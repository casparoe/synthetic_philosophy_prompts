prompt: |-
  hey — you're a professional philosopher of science who specializes in Bayesian confirmation theory (the real stuff, not the pop-Silver version), and you've also done a two-year stint embedded with an evidence-assessment team, so you know how this kind of thing actually gets used when the clock is running. Before you write anything final, take a pass at brainstorming: list the distinctions from the old-evidence literature that you think could survive being turned into a checklist, and the ones that are hopeless in practice, and say briefly why you're dropping each. Then give me the actual procedure, and think carefully about the hard cases rather than sketching them.

  Context: I run a small evidence-assessment unit at a large medical research funder. Twice a year we re-score each funded programme's central mechanistic hypothesis H against the whole evidence base, and we report a log likelihood ratio (we use decibels, we call them "credits") that rolls up into a confidence rating the renewal panel sees. My team is six people, no philosophers among them, and they get about half a day per programme. The thing that keeps blowing up our meetings: most of the evidence we want to count was already known — sometimes for decades — before anyone wrote H down in its current form. Taken literally, if E is already in the background knowledge then its probability is 1, the ratio is 1, zero credits, done. But that's obviously wrong sometimes (a theory that quietly explains away a long-standing anomaly looks like it earns a lot) and obviously right sometimes (a mechanism invented to fit a famous dataset that everyone already had open on their desk earns nothing). I need a procedure that separates those two, definately.

  What I want:

  - An ordered set of steps my team can run on each (H, E) pair in about 40 minutes, with what counts as a sufficient answer at each step, and what to write down when we can't get a number.
  - Where the procedure says stop, zero credits, and the reason it stops there.
  - Where it says this is a judgment call, escalate to the panel — instead of pretending to be mechanical. Be explicit about which steps are judgment in a lab coat.
  - Real handling of: (i) evidence that was used to construct H vs. merely known before H; (ii) H entailing E only with help from auxiliaries that were themselves adjusted along the way; (iii) evidence that was an open anomaly for the previous theory vs. evidence that everyone already had a decent explanation for; (iv) the "data is old but the quantity is new" case — re-analyses nobody performed until H told them what to compute; (v) how to avoid counting the same evidence twice, once as motivation for H and again as a prediction of H; (vi) what to do when nobody can say what H would have predicted if E had come out otherwise, including whether it's legitimate to fall back on "would the field have been surprised?"

  Then run it on three cases:

  1. A calibration case from outside medicine: a new theory of gravitation from the 1910s that nobody built in order to explain the odd behaviour of Mercury's orbit, but which gets the anomalous part right. Does it get credits, on which step, and how many does it deserve compared to a genuine novel prediction? Then: someone later proposes a rival explanation that soaks up part of the anomaly. Do the credits come back out, and if so, when — at the moment the rival is proposed, or only once it's tested?
  2. Our problem child. Programme B's hypothesis is that a specific gut-bacteria-derived metabolite drives insulin resistance. Its strongest support is a widely-used cohort dataset; the metabolite was picked, out of a panel of dozens of candidates, by seeing which one tracked the outcome in that dataset. The team loves this programme and I expect your procedure to tell me something I don't want to hear. Say it plainly, don't soften it.
  3. A retrodiction case: an old dataset, and a quantity nobody had ever computed from it. H pins that quantity down to a fairly narrow range, and when someone finally computes it, it lands in the range. Old evidence or new prediction? Where does your procedure land, and what single change to the facts would flip the answer?

  Finally, a short section on what this procedure can't do: where it will misfire even when my team runs it correctly, which disagreements it settles by fiat rather than argument, and what I should tell the panel so they don't read the credits as more precise than they are.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher of science (specializing in Bayesian confirmation theory) + embedded experience with evidence-assessment teams (practical, time-constrained, high-stakes).
      *   **Task:** Create a practical procedure (checklist/steps) for handling the "Old Evidence Problem" in Bayesian confirmation theory within a medical research funding context.
      *   **Constraints:**
          *   Team of 6 non-philosophers.
          *   Time limit: ~40 minutes per (H, E) pair (total 0.5 day per programme).
          *   Output: Log likelihood ratio (decibels/"credits").
          *   Specific handling of hard cases (construction vs. known, auxiliaries, anomalies vs. explained, re-analysis, double counting, counterfactuals).
          *   Three specific case studies (Mercury/Gravity, Gut Metabolite/Selection Bias, Old Data/New Quantity).
          *   Limitations section (what the procedure *can't* do).
      *   **Tone:** Professional, direct, pragmatic, no fluff, acknowledging the messiness of real-world science.
      *   **Structure:**
          1.  Brainstorming/Distinctions (Survive vs. Hopeless).
          2.  The Procedure (Steps, Stop conditions, Escalation points).
          3.  Case Studies (1, 2, 3).
          4.  Limitations/Warnings for the Panel.

  2.  **Brainstorming: Old Evidence Distinctions (Philosophy vs. Practice):**
      *   *The Core Problem:* In standard Bayesianism, if $P(E) = 1$ (known evidence), then $P(E|H) = 1$, so Likelihood Ratio (LR) = 1, Confirmation = 0. This contradicts scientific intuition (e.g., GR explaining Mercury's perihelion).
      *   *Potential Distinctions:*
          *   *Historical vs. Logical:* Did the scientist *know* E when writing H? (Too historical, hard to verify).
          *   *Construction vs. Accommodation:* Was E used to *build* H? (Crucial, but often murky).
          *   *Anomaly Status:* Was E an anomaly for the *prevailing* theory? (High value if H explains it).
          *   *Counterfactual Surprise:* Would the community be surprised if E were false? (Subjective but usable).
          *   *Auxiliary Stability:* Did we tweak auxiliaries to fit E? (Undermines confirmation).
          *   *New Quantity from Old Data:* Is the *statistic* new even if data is old? (Often counts as new).
      *   *Hopeless in Practice:*
          *   *Subjective Degrees of Belief:* Asking assessors to assign $P(H)$ or $P(E)$ directly. Too noisy.
          *   *Temporal Precision:* Pinpointing the exact minute H was formulated vs. E known.
          *   *Logical Omniscience:* Assuming agents know all logical consequences of H immediately.
          *   *Purely Historical Intent:* Trying to read the PI's mind about *why* they wrote H.
      *   *Survivors:*
          *   *Selection Effects:* Was E used to select parameters of H? (Checklist-able).
          *   *Anomaly Status:* Was E unexplained by the null/standard model? (Checklist-able).
          *   *Analysis Plan:* Was the analysis of E pre-specified relative to H? (Checklist-able).
          *   *Rival Explanations:* Are there live competitors explaining E equally well? (Checklist-able).

  3.  **Developing the Procedure (The "40-Minute Protocol"):**
      *   Need to move from "Is E old?" to "Does E discriminate H from rivals?"
      *   Shift focus from *temporal* oldness to *probabilistic* independence.
      *   *Step 1: Provenance & Construction.* (Is E part of H's DNA?)
      *   *Step 2: The Null/Status Quo Test.* (Was E already expected?)
      *   *Step 3: Auxiliary Stability.* (Did we cheat with assumptions?)
      *   *Step 4: The Counterfactual/Surprise Test.* (If E were false, would H be in trouble?)
      *   *Step 5: Double-Counting Check.* (Is this E already used in the 'motivation' score?)
      *   *Decision Rules:* Stop if construction is direct. Escalate if auxiliaries are shaky.
      *   *Scoring:* Convert qualitative judgments to decibels (dB). 0 dB = no support. 10 dB = strong.

  4.  **Drafting the Case Studies:**
      *   *Case 1 (Mercury/GR):* Classic old evidence. H (GR) not built for E (Mercury). E was an anomaly for Newton. *Verdict:* High credits. Rival comes later? *Verdict:* Credits don't vanish immediately, but LR drops if rival explains E equally well. Update on *discrimination*, not just fit.
      *   *Case 2 (Gut Metabolite):* The "Problem Child." H built *from* the data (selection bias). E used to pick the metabolite. *Verdict:* Zero credits for that dataset. It's accommodation, not prediction. Hard truth: The team loves it, but the evidence is circular.
      *   *Case 3 (Old Data/New Quantity):* Data old, statistic new. H predicted the *statistic*. *Verdict:* New prediction. Old data is just the substrate. *Flip:* If the statistic was one of many tried and only this one reported (p-hacking), then it reverts to Case 2.

  5.  **Refining the Tone and Content:**
      *   *Tone:* "Embedded Philosopher." I need to sound like I've sat in the meetings. Acknowledge the pressure. Use terms like "audit trail," "selection effects," "live rivals."
      *   *Bayesian Technicality:* Keep it real. Don't use $P(E)=1$. Use the *counterfactual* formulation (Garber-style or similar) but operationalized. The key is $P(E|H) / P(E|\neg H)$. If $P(E|\neg H)$ is high (everyone expected it), LR is low.
      *   *Decibels:* $10 \log_{10}(LR)$. 3dB $\approx$ 2:1. 10dB $\approx$ 10:1.
      *   *Limitations:* Be honest. This doesn't solve the philosophical problem, it manages the administrative risk. It can't measure truth, only discrimination.

  6.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is 40 minutes realistic for all this?
      *   *Fix:* Make Step 1 a hard filter. If it fails Step 1, stop. Don't waste time on Step 4.
      *   *Critique:* Is the Mercury case too historical?
      *   *Fix:* Frame it as a calibration exercise for the team to understand the *principle*, not to grade Einstein.
      *   *Critique:* Case 2 needs to be harsh.
      *   *Fix:* Explicitly state "Zero Credits." Explain that loving the hypothesis doesn't change the likelihood ratio.
      *   *Critique:* Ensure the "Escalate" points are clear.
      *   *Fix:* Mark them clearly in the procedure.

  7.  **Final Polish:** Check against all constraints in the prompt.
      *   Brainstorming section included? Yes.
      *   Procedure steps with stop/escalate? Yes.
      *   Six hard cases addressed in procedure? Yes.
      *   Three specific cases run? Yes.
      *   Limitations section? Yes.
      *   Tone check: Professional, direct, no pop-science Bayesianism.

  8.  *(Final thought on the "Old Evidence" technicality)*: I need to be careful not to say "P(E) is not 1." In the agent's mind, it is. The trick is to evaluate the *likelihood ratio* based on the *explanatory power* relative to rivals, effectively treating the "oldness" as a constraint on the *alternative* hypothesis probability. If the null hypothesis already predicted E, LR is 1. If the null didn't, LR > 1. This is the pragmatic solution.

  Let's write it.cw
answer: |-
  ## Part 1: Brainstorming & Triage (The "Embedded Philosopher" Pass)

  Before we lock the protocol, I need to clear the deck. I've sat in your meetings. I know the pressure. The philosophical literature on Old Evidence is dense, but 90% of it is useless for a six-person team with a half-day deadline. We need distinctions that map onto audit trails, not epistemic states.

  ### Distinctions That Survive (The Checklist)
  1.  **Construction vs. Accommodation:** Was $E$ used to *select* parameters of $H$?
      *   *Why:* This is the core of overfitting. If the data chose the hypothesis, the data cannot test it. This is empirically traceable via lab notebooks and analysis plans.
  2.  **Anomaly Status (Relative to Null):** Was $E$ expected under the standard model ($\neg H$)?
      *   *Why:* If $\neg H$ predicts $E$ just as well as $H$, the Likelihood Ratio (LR) is 1. It doesn't matter if $E$ is old; if it was already "explained," it offers no *discriminatory* power.
  3.  **Analysis Specification:** Was the *method* of deriving $E$ fixed before $H$ was applied?
      *   *Why:* Addresses the "old data, new quantity" case. If the statistic was pre-specified by $H$, the age of the raw data is irrelevant.
  4.  **Auxiliary Stability:** Did we have to tweak background assumptions ($A$) to make $H$ yield $E$?
      *   *Why:* $H + A \rightarrow E$. If $A$ was adjusted *post hoc* to save $H$, the confirmation belongs to the adjustment, not $H$.

  ### Distinctions That Are Hopeless (Drop These)
  1.  **Subjective Degree of Belief ($P(E)$):**
      *   *Why:* Asking your team to assign a probability to a known fact is cognitive noise. They will anchor on 1.0 or argue forever. We care about $P(E|H)$ vs $P(E|\neg H)$, not $P(E)$.
  2.  **Temporal Precision of Formulation:**
      *   *Why:* Trying to pinpoint the exact hour $H$ was written vs. when $E$ was published is forensic history, not evidence assessment. It invites gaming ("I wrote the grant before I saw the paper, technically").
  3.  **Logical Omniscience:**
      *   *Why:* Standard Bayesianism assumes agents know all logical consequences of $H$ instantly. Real scientists don't. Don't try to model their ignorance; model the *public* state of the field.
  4.  **"Surprise" as a Feeling:**
      *   *Why:* "Would we be surprised?" is too vague. Replace with "Would the null hypothesis make this unlikely?"

  ---

  ## Part 2: The Procedure (The 40-Minute Protocol)

  **Goal:** Assign Log Likelihood Ratio (LLR) in decibels (dB).
  **Formula:** $\text{Credits} = 10 \log_{10} \left( \frac{P(E|H)}{P(E|\neg H)} \right)$.
  **Constraint:** If $E$ is "old," we are assessing whether it discriminates $H$ from the Status Quo ($\neg H$).

  ### Step 1: The Construction Filter (5 Minutes)
  **Question:** Was evidence $E$ (or a direct proxy) used to *construct* or *select* hypothesis $H$?
  *   **Check:** Look at the grant proposal, preliminary data figures, and variable selection logs. Did the PI screen 50 metabolites and pick the one that correlated best to write $H$?
  *   **Stop Rule:** If **YES**, assign **0 dB**.
      *   *Reason:* This is accommodation/overfitting. The data is part of the hypothesis definition.
      *   *Write Down:* "Evidence used for construction/selection. LR = 1."
  *   **Pass:** If **NO**, proceed to Step 2.

  ### Step 2: The Status Quo Test (10 Minutes)
  **Question:** Prior to $H$, did the prevailing theory ($\neg H$) predict or explain $E$?
  *   **Check:** Review standard textbooks, clinical guidelines, or the null model used in the field. Was $E$ considered "normal," "expected," or "already solved"?
  *   **Stop Rule:** If **YES** (Status Quo explains $E$ well), assign **0 dB**.
      *   *Reason:* $P(E|H) \approx P(E|\neg H)$. No discrimination.
      *   *Write Down:* "Evidence consistent with Status Quo. No discriminatory power."
  *   **Pass:** If **NO** ($E$ was an anomaly, unexplained, or unexpected under $\neg H$), proceed to Step 3.
      *   *Note:* This handles the "Mercury" case. Old evidence counts if it was a *puzzle* for the old theory.

  ### Step 3: Auxiliary Stability Check (10 Minutes)
  **Question:** Does deriving $E$ from $H$ require auxiliary assumptions ($A$) that were adjusted *after* seeing $E$?
  *   **Check:** Did the team change inclusion criteria, normalization methods, or background constants to make the numbers match?
  *   **Escalation Point:** If auxiliaries are unstable or contested, **do not assign a number**.
      *   *Action:* Flag for Panel Review.
      *   *Write Down:* "Confirmation depends on contested auxiliaries. LR unstable."
      *   *Reason:* You are confirming $H+A$, not just $H$. The panel must decide if $A$ is legitimate.
  *   **Pass:** If auxiliaries are standard/stable, proceed to Step 4.

  ### Step 4: The Counterfactual/Surprise Test (10 Minutes)
  **Question:** If $E$ had turned out differently (within reasonable bounds), would $H$ have been falsified or severely damaged?
  *   **Check:** This addresses "nobody can say what H would predict." Look at the *riskiness* of the prediction.
  *   **Judgment Call:**
      *   **High Risk:** $H$ specified a narrow range, and $E$ landed in it. (Award **+10 to +20 dB**).
      *   **Low Risk:** $H$ is vague ("levels will change"), and $E$ shows any change. (Award **+3 dB**).
      *   **Unknown:** If the team cannot articulate how $H$ could fail on $E$, **Escalate to Panel**.
      *   *Write Down:* "Hypothesis not falsifiable by this evidence type."
  *   **Double Counting Check:** Ensure $E$ is not also being scored as "Preliminary Data" in the feasibility section. If it is, zero it here.

  ### Step 5: Final Aggregation & Sign-off (5 Minutes)
  *   Sum the dB.
  *   If any step triggered an **Escalation**, submit the file with the "Judgment Required" tag.
  *   If any step triggered a **Stop**, file as "0 dB" with the specific reason code.

  ---

  ## Part 3: Running the Cases

  ### Case 1: The Calibration Case (Gravity & Mercury)
  **Scenario:** 1910s Gravitation Theory ($H$). Mercury's Perihelion ($E$). $E$ known for decades. $H$ not built to fit $E$.
  **Procedure Run:**
  1.  **Construction:** Did Einstein tune GR to match Mercury's 43 arcseconds? *Historical consensus: No.* **Pass.**
  2.  **Status Quo:** Did Newtonian physics explain Mercury? *No, it was a known anomaly.* **Pass.** (This is the key. $P(E|\text{Newton})$ was low).
  3.  **Auxiliaries:** Did GR need tweaked auxiliaries? *No, it falls out of the field equations.* **Pass.**
  4.  **Counterfactual:** If Mercury's orbit were normal, would GR be in trouble? *Yes, GR predicts the shift necessarily.* **High Risk.**
  **Verdict:** **High Credits (+15 dB).**
  **Reasoning:** It passes Step 2. Old evidence counts when it is an *anomaly* for the rival.
  **Rival Scenario:** A rival theory ($H2$) is proposed later that also explains Mercury.
  *   **Do credits come back out?** No, not retrospectively. The LR was calculated based on the information state *at the time of assessment*.
  *   **However:** When you assess the *current* confidence in $H$, the existence of $H2$ lowers the *Prior* $P(H)$, not the Likelihood of $E$. But if $H2$ explains $E$ *better*, future assessments of $E$'s value drop because $P(E|\neg H)$ rises (since $\neg H$ now includes $H2$).
  *   **Operational Rule:** Credits for $E$ stand for that cycle. But in the next cycle, $E$ moves to Step 2 (Status Quo). If $H2$ is now a live rival, $P(E|\neg H)$ is higher. Credits for $E$ drop in *future* rounds.

  ### Case 2: The Problem Child (Gut Metabolite & Selection Bias)
  **Scenario:** Programme B. Hypothesis: Metabolite X drives insulin resistance. Evidence: Cohort Dataset Z. Metabolite X was selected *from* Dataset Z because it correlated best.
  **Procedure Run:**
  1.  **Construction:** Did the team look at dozens of metabolites in Dataset Z and pick X? **YES.**
  2.  **Stop Rule:** **Immediate Stop. 0 dB.**
  **Verdict:** **Zero Credits.**
  **Reasoning:** This is pure accommodation. The hypothesis is *defined* by the noise in that dataset. To give credits here is to reward overfitting.
  **Hard Truth for the Team:** I know they love this programme. I know the PI is charismatic. But on Bayesian grounds, this dataset provides *no* confirmation for the specific claim that X is the driver. It only confirms that *something* in that panel correlates.
  **Action:** Tell the team: "You cannot use Dataset Z to score Hypothesis X. You need an external validation cohort. If you don't have one, the LLR for this hypothesis is currently 0. Do not pass go."

  ### Case 3: The Retrodiction (Old Data, New Quantity)
  **Scenario:** Old dataset (2010). New statistic computed (2024). $H$ predicted the value of this statistic.
  **Procedure Run:**
  1.  **Construction:** Was the *statistic* defined before the computation? **Yes.** (The raw data is old, but the *evidence proposition* is new).
  2.  **Status Quo:** Did the null model predict this specific statistic? **No.** (Nobody computed it, so it wasn't 'expected').
  3.  **Auxiliaries:** Was the computation method standard? **Yes.**
  4.  **Counterfactual:** If the statistic fell outside the range, would $H$ fail? **Yes.**
  **Verdict:** **New Prediction Credits (+10 dB).**
  **Reasoning:** The "evidence" is not the raw data; it is the *value of the computed quantity*. That quantity did not exist in the background knowledge until $H$ motivated its extraction.
  **The Flip:** What single change flips this to 0 dB?
  *   **Change:** If the team computed *50 different statistics* from that old data and only reported the one that matched $H$.
  *   **Why:** This reverts to Step 1 (Selection). The "Quantity" was selected from a garden of forking paths.

  ---

  ## Part 4: Limitations & Panel Guidance

  **What This Procedure Cannot Do:**
  1.  **It Cannot Measure Truth:** A high credit score means $H$ discriminates well against $\neg H$ *given our current auxiliaries*. If the auxiliaries are wrong (e.g., a systematic bias in the measurement tool), the credits are garbage. The procedure flags unstable auxiliaries, but it cannot detect unknown unknowns.
  2.  **It Cannot Settle Paradigm Wars:** If the "Status Quo" (Step 2) is itself contested (e.g., assessing a homeopathic claim where the null is "nothing happens" but proponents argue "energy fields exist"), the team will stall. This requires Panel Escalation.
  3.  **It Is Not Additive Forever:** You can't stack 100 old anomalies to get infinite confidence. Eventually, the "Rival Hypothesis" space fills up. The procedure assesses $E$ in isolation; the Panel must apply a diminishing returns heuristic on the total score.

  **Instructions for the Renewal Panel:**
  *   **The Number is a Signal, Not a Metric:** Treat the "Credits" like a credit rating, not a temperature. 20 dB is "Strong Discrimination," not "20 units of Truth."
  *   **Respect the Zeros:** If a programme gets 0 dB on its main evidence because of Step 1 (Construction), do not override it with "Expert Intuition." That intuition is exactly what the Bayesian filter is meant to correct.
  *   **Watch the Escalations:** If a file is flagged for "Auxiliary Instability," do not simply vote. Demand an independent audit of the assumptions.
  *   **Old Evidence is Not Dead Evidence:** Do not penalize a programme simply because the data is old. Penalize it only if the data was *used to build* the hypothesis or was *already explained* by the null.

  **Final Word:**
  This protocol shifts the burden from "When was this known?" to "Does this distinguish the hypothesis from the null?" That is the only question that matters for funding decisions. It will hurt some of your favourite projects (like Programme B). That pain is the sound of the system working.
