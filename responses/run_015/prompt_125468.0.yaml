answer: |-
  # The Evidentiary Sorting Instrument
  **For: *Science & Ideas Quarterly* | **Subject:** Archaeology of Belief**

  This instrument is designed to bypass academic labels (which often shift meaning between disciplines) and sort readers by their underlying epistemological commitments regarding legend and history. It utilizes three stress cases: **Troy** (Site/Epic), **Arthur** (Figure/Polity), and **Exodus** (Migration/Trace).

  Answer the following nodes in sequence. Your path determines your historiographical position.

  ---

  ### NODE 1: The Material Threshold
  **Question:** To grant a legend "historical" status, is a physical correlation (stratigraphic destruction layers, settlement discontinuities, mass-burial patterns) a *necessary condition*?
  *   **YES:** (You require the ground to speak before the text can be history.) → **Go to Node 2.**
  *   **NO:** (You allow history to reside in text, memory, or function without ground truth.) → **Go to Node 4.**

  ### NODE 2: The Silence Test
  **Question:** When expected material traces are absent (e.g., no mass graves in Sinai, no 6th-century fortifications in Britain), does this archaeological silence function as *disconfirmation*?
  *   **YES:** (Absence of evidence is evidence of absence.) → **Go to Node 3.**
  *   **NO:** (Silence is a neutral gap; preservation is patchy.) → **Go to Node 5.**

  ### NODE 3: The Singularity Filter
  **Question:** Must the history be anchored by a recoverable *singular* protagonist (Arthur, Moses, Agamemnon) rather than a collective movement or process?
  *   **YES:** → **LEAF A: Rigid Maximalist**
  *   **NO:** → **LEAF B: Evidence Minimalist**

  ### NODE 4: The Memory Kernel
  **Question:** Can collective memory preserve a historical kernel without identifiable protagonists or material traces?
  *   **YES:** → **LEAF C: Textual Kernel-Historian**
  *   **NO:** → **Go to Node 5.**

  ### NODE 5: The Scale & Form Variable
  **Question:** Does the social form of the claimed event (city-state siege vs. population displacement) alter the burden of proof *in kind* rather than merely in degree?
  *   **YES:** (A migration requires different proof than a battle.) → **LEAF D: Narrative-Functional**
  *   **NO:** (History is history; the burden is constant.) → **LEAF E: Radical Mythicist**

  *(Note: Node 2 also feeds into Node 5 for those who treat silence as neutral but still demand material correlation.)*
  *   **From Node 2 (NO) → Node 5:** → **LEAF F: Contextual Maximalist**

  ---

  ## The Leaves: Positions & Awkward Commitments

  ### LEAF A: Rigid Maximalist
  *   **Definition:** Requires physical correlation; treats silence as fatal; demands a singular hero.
  *   **The Position:** The legend is a distorted record of specific events and people. If the site doesn't match the poem, the poem is fiction.
  *   **Most Awkward Commitment:** You must accept that if Hisarlik Layer VI is not destroyed by fire, *The Iliad* is no more historical than *The Lord of the Rings*, regardless of its cultural weight. You risk discarding the history of stateless societies because they leave no palaces.

  ### LEAF B: Evidence Minimalist
  *   **Definition:** Requires physical correlation; treats silence as fatal; accepts collective processes over singular heroes.
  *   **The Position:** The "war" or "migration" happened, but the "king" is a literary construct anchoring a tribal memory.
  *   **Most Awkward Commitment:** You must defend a "history" that looks nothing like the story told. If Arthur was not a king but a vague resistance movement, the chivalric cycle is fundamentally misleading, rendering the "history" useless for explaining the legend's content.

  ### LEAF C: Textual Kernel-Historian
  *   **Definition:** Does not require physical correlation; believes memory preserves a kernel.
  *   **The Position:** Oral tradition is robust enough to carry a core truth (a name, a route) without material backup.
  *   **Most Awkward Commitment:** You must explain the mechanism of preservation. To claim a kernel survives 400 years of oral transmission (Arthur) without distortion requires a theory of memory that most cognitive science rejects. You are positing a "historical atom" that explains nothing about the surrounding narrative.

  ### LEAF D: Narrative-Functional
  *   **Definition:** Does not require physical correlation; denies kernel; argues scale/form changes the proof.
  *   **The Position:** The "truth" of the Exodus is in its function as a founding myth for a polity, not in the number of walkers in the Sinai.
  *   **Most Awkward Commitment:** You must admit that whether Moses existed is irrelevant to the truth claims of Judaism. This satisfies sociologists but alienates theologians and empiricists alike, making you a permanent outsider to both faith and science.

  ### LEAF E: Radical Mythicist
  *   **Definition:** Does not require physical correlation; denies kernel; burden of proof is constant.
  *   **The Position:** There is no meaningful distinction between the historical status of Arthur and Harry Potter.
  *   **Most Awkward Commitment:** You must treat the *Historia Brittonum* and *The Daily Prophet* as ontologically equivalent. This ignores the material reality that myths often accrete around real geopolitical fractures, rendering your position theoretically pure but archaeologically blind.

  ### LEAF F: Contextual Maximalist
  *   **Definition:** Requires physical correlation; treats silence as neutral; scale alters proof.
  *   **The Position:** We need evidence, but we know large migrations leave different traces than sieges, and absence isn't fatal.
  *   **Most Awkward Commitment:** You must accept that large events can leave *no* trace, which undermines the utility of archaeology itself. If a population displacement leaves no pottery shards, your primary tool for detecting history is rendered impotent for that specific class of event.

  ---

  ## Instrument Blind Spots: Indistinguishable Leaves

  This instrument cannot genuinely separate the following pairs, revealing where academic taxonomy fails to capture nuance:

  **1. The "Evidence Minimalist" (Leaf B) vs. The "Contextual Maximalist" (Leaf F)**
  *   **The Blur:** Both require material evidence but differ on how they treat silence. In practice, a Minimalist arguing for a "small Exodus" (Leaf B) and a Contextual Maximalist arguing for a "nomadic infiltration" (Leaf F) often arrive at the same historical reconstruction: *Something happened, but it wasn't the Bible's version.*
  *   **Why the Tree Fails:** The tree separates them on the "Silence" node (Disconfirmation vs. Neutral). However, in real-time scholarship, both positions often utilize the same "neutral silence" argument to protect their specific kernel, making their practical output identical despite different epistemological starting points.

  **2. The "Textual Kernel-Historian" (Leaf C) vs. The "Narrative-Functional" (Leaf D)**
  *   **The Blur:** Both reject the need for physical correlation. The Kernel-Historian claims a "real person" started the myth; the Functionalist claims the "social need" created the myth.
  *   **Why the Tree Fails:** Both end up analyzing the *text* to understand the *society*. If the Kernel-Historian admits the "kernel" is unrecoverable and only the *belief* in the kernel matters, they have functionally become a Narrative-Functionalists. The tree separates them on "Memory," but memory without a recoverable protagonist is functionally identical to narrative function.

  **3. The Prompt's Specific Case: The Anatolian/Post-Roman Overlap**
  *   **The Blur:** A **Minimalist** who denies Anatolian stratigraphic correlations (saying "Troy VI wasn't Homer's Troy") and a **Maximalist** who accepts only post-Roman settlement continuity (saying "Arthur was a Romanized Briton, not a Medieval King") often occupy the same evidentiary space.
  *   **Why the Tree Fails:** The tree sorts by *commitment to evidence*, not by *interpretation of specific strata*. A user who answers "Yes" to Physical Correlation but interprets the layers differently than the consensus will land in Leaf A or B, indistinguishable from a user who interprets the layers differently but lands in Leaf F. The instrument diagnoses the *rule set*, not the *archaeological verdict*.

  ---

  ### Journalist's Note on Usage
  *This instrument is not designed to tell your readers who is "right." It is designed to show them why they are talking past one another. When a Maximalist and a Mythicist argue about Exodus, they are often arguing at Node 1 (Material Threshold). When two Minimalists argue about Arthur, they are often arguing at Node 2 (Silence). By identifying the node of disagreement, you can determine if the debate is about dirt, memory, or the definition of history itself.*
