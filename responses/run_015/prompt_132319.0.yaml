answer: |-
  # Pattern Ontology Decision Instrument

  **Instructions:** Proceed through the four branching questions below. Record your answer (Yes/No) for each. At the end of the path, locate the corresponding Terminal Node to identify your ontological commitment and its associated theoretical cost. If your path leads to a Flagged Branch, note the diagnosis provided.

  ### Branching Questions

  **1. Root: Predictive Sufficiency**
  *Case:* A climate model predicts regional droughts with 99% accuracy using mathematical variables that do not map onto any single physical object (e.g., "atmospheric pressure systems" rather than specific molecules).
  *Question:* Does the predictive success alone prove the "drought pattern" exists in reality, or is the pattern merely a tool inside the model?
  *   **(A) Yes:** The pattern is real because the prediction works.
  *   **(B) No:** The pattern is a fiction/tool; reality requires more than prediction.

  **2. Split: Physical-Law Instantiation**
  *Case:* Consider the pattern from Question 1.
  *Question:* For this pattern to be real, must it be strictly reducible to fundamental physical laws (e.g., particle interactions), or can it be real even if it ignores physical details?
  *   **(A) Yes:** Reality requires physical-law grounding.
  *   **(B) No:** Reality does not require physical-law grounding.

  **3. Split: Design-Level Functional Organization**
  *Case:* Assume physical grounding is not required (or is insufficient).
  *Question:* Can the pattern be considered real solely because the system is organized to perform a function (like a thermostat regulating heat), even if its physical makeup varies or is irrelevant?
  *   **(A) Yes:** Functional organization substitutes for physical grounding.
  *   **(B) No:** Functional organization does not substitute for physical grounding.

  **4. Split: Intentional Stance**
  *Case:* Assume the system exhibits stable regularities.
  *Question:* To fully explain these regularities, is it required or appropriate to treat the system *as if* it possessed beliefs or goals (e.g., "the model *tries* to minimize error"), or is this attribution categorically inappropriate for non-biological artifacts?
  *   **(A) Yes:** Attributing goals/beliefs is required or appropriate.
  *   **(B) No:** Attributing goals/beliefs is inappropriate or unnecessary.

  ---

  ### Terminal Nodes & Flagged Branches

  Match your sequence of answers (e.g., 1A-2B-3A-4B) to the nodes below.

  #### **Node: Predictive-Sufficiency Realist**
  *   **Logical Combination:** 1A (Yes) — 2B (No) — 3B (No) — 4B (No)
  *   **Definition:** Patterns are real if they predict well, regardless of physics, design, or intent.
  *   **Most Awkward Commitment:** You must accept that a mathematical model finding a coincidence in random noise creates a real pattern simply because it fit the past data perfectly.

  #### **Node: Physical-Grounding Exclusivist**
  *   **Logical Combination:** 1B (No) — 2A (Yes) — [3 Irrelevant] — 4B (No)
  *   **Definition:** Predictive success is insufficient; only patterns reducible to fundamental physics are real, and intentional attributions are false.
  *   **Most Awkward Commitment:** You are forced to deny the reality of macroeconomic cycles or software objects, as they cease to exist if the underlying hardware particles are rearranged.

  #### **Node: Design-Stance Functionalist**
  *   **Logical Combination:** 1A (Yes) — 2B (No) — 3A (Yes) — 4B (No)
  *   **Definition:** Patterns are real if they serve a function, independent of physical substrate, but do not require mental attribution.
  *   **Most Awkward Commitment:** You must grant ontological reality to a broken thermostat's "regulation" pattern if its internal design logic remains intact despite failing to actually control temperature.

  #### **Node: Intentional-Stance Pluralist**
  *   **Logical Combination:** 1A (Yes) — 2B (No) — 3A (Yes) — 4A (Yes)
  *   **Definition:** Patterns are real, grounded in function, and best explained by attributing proto-goals or beliefs to the system.
  *   **Most Awkward Commitment:** You are committed to asserting that a simple feedback loop, such as a missile guidance system, literally possesses "desires" to hit a target in the same sense a human does.

  #### **Node: Full Eliminativist About Synthetic Patterns**
  *   **Logical Combination:** 1B (No) — 2A (Yes) — 3B (No) — 4B (No)
  *   **Definition:** Neither prediction, function, nor intent grants reality; only fundamental physics is real, and higher-level patterns are strictly false.
  *   **Most Awkward Commitment:** You must maintain that statements like "the market crashed" are strictly false, as only individual electrons and atoms moved, not "markets."

  ---

  ### Flagged Vacant Branches

  If your answers led to one of the following combinations, your position is flagged as logically unstable or uninhabited.

  #### **Vacant Branch: Disembodied Intentionalist**
  *   **Logical Combination:** 1A (Yes) — 2B (No) — 3B (No) — 4A (Yes)
  *   **Diagnosis:** **Incoherence.** This position claims patterns are real and require intentional attribution (goals/beliefs) while simultaneously denying that physical grounding or functional design is necessary. Without physics or design to anchor the "goal," the intentionality floats without a subject, rendering the explanation vacuous.

  #### **Vacant Branch: Physical Intentionalist**
  *   **Logical Combination:** 1B (No) — 2A (Yes) — [3 Irrelevant] — 4A (Yes)
  *   **Diagnosis:** **Unattractiveness/Neglect.** This position claims only physics is real (rejecting predictive sufficiency) but insists on attributing beliefs to physical systems. This creates a tension where one denies the reality of higher-level patterns while simultaneously employing higher-level intentional explanations to describe the physics, a view rarely sustained under scrutiny.

  #### **Vacant Branch: Functional Eliminativist**
  *   **Logical Combination:** 1B (No) — 2B (No) — 3A (Yes) — 4B (No)
  *   **Diagnosis:** **Neglect.** This position claims prediction is insufficient for reality and physics is not required, yet asserts functional organization *is* sufficient. If prediction and physics are both rejected as grounds for reality, it is logically unclear what work "function" is doing to secure reality without collapsing back into predictive success or physical grounding.
