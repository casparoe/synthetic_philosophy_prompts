prompt: |-
  Got 40 minutes next week in front of a room of ML engineers to explain updateless decision theory. They're completely fine with expected utility, Bayes and policy gradients, they have zero philosophy, and they're going to assume that anything that sounds like "ignore the evidence" is crackpot — so I need a plan, not an explanation.

  What has to be in place before "updateless" even means anything to them: do they need the causal/evidential decision theory split first, or can I get there from Newcomb's problem alone (which half of them will have half-remembered from a blog post)? Which single case should carry the whole thing — I was going to build it around an agent that gets to patch its own source code before the input arrives, so the policy feels like a real object they can point at, but tell me if that just smuggles in the conclusion or quietly collapses into Newcomb. Then the misconceptions, and where in the sequence to kill each one: I'm expecting "so you're saying don't condition on the evidence", "isn't that just evidential decision theory again", and "surely the perfect predictor is doing all the work here". Plus one question at the end that tells me whether they actually got it or just got comfortable with it.

  Also: what should I flatly refuse to go into at this level, and say out loud that I'm leaving it out — logical counterfactuals, why the policy gets evaluated from the prior, whatever else. British English please.
reasoning: |-
  Here's a thinking process that leads to the suggested plan:

  1.  **Analyze the Request:**
      *   **Audience:** ML Engineers (40 mins). Comfortable with Expected Utility (EU), Bayes, Policy Gradients. Zero philosophy background. Skeptical of "ignore evidence" claims (anti-crackpot radar on).
      *   **Topic:** Updateless Decision Theory (UDT).
      *   **Goal:** A *plan*, not just an explanation. Needs structure, sequencing, specific examples, misconception handling, and scope boundaries.
      *   **Constraints:** British English. 40 minutes.
      *   **Key Questions to Answer:**
          *   Prerequisites (CDT/EDT split vs. Newcomb)?
          *   Core Case (Self-modifying code vs. Newcomb)?
          *   Misconceptions & Timing ("don't condition", "just EDT", "predictor does the work").
          *   Final Verification Question.
          *   Scope Boundaries (What to explicitly exclude).

  2.  **Deconstruct the Audience & Topic:**
      *   *ML Engineers:* They think in terms of policies ($\pi$), loss functions, training vs. inference, and compute graphs. They view agents as optimisers.
      *   *UDT:* Essentially, choosing a policy at the prior rather than conditioning on observations at the moment of action. It's about *commitment* and *logical correlation* rather than causal influence or evidential correlation.
      *   *The "Crackpot" Risk:* Saying "don't update on evidence" sounds like ignoring data. In ML terms, this sounds like inference-time stupidity. I need to reframe "not updating" as "optimising the policy function globally" vs. "greedy action selection".

  3.  **Address the Specific Questions:**

      *   **Prerequisites (CDT/EDT vs. Newcomb):**
          *   Don't teach a philosophy lecture on CDT/EDT. It's a time sink and abstract.
          *   Start with Newcomb's Problem, but *immediately* translate it into ML terms (Prediction vs. Action).
          *   Actually, better yet: Use the *Transparent Newcomb* or *Parfit's Hitchhiker* setup, but the prompt suggests a "self-patching source code" angle. Let's evaluate that.
          *   *Self-patching code:* This is strong for ML engineers. It maps to "training time" vs. "runtime". UDT is essentially "Training Time Optimality".
          *   *Decision:* Start with a simplified Newcomb to establish the tension, then immediately pivot to the "Source Code" analogy to make it concrete. Don't dwell on CDT/EDT taxonomy.

      *   **Core Case (Self-patching code):**
          *   Does it smuggle in the conclusion? It risks looking like precommitment, which is easy to accept, whereas UDT claims this *is* rationality, not just a trick.
          *   Does it collapse into Newcomb? It *is* Newcomb structurally, but the framing changes the intuition.
          *   *Strategy:* Use the "Source Code" framing as the *primary* intuition pump. It maps "Updateless" to "Policy Optimisation" (training) vs. "Action Selection" (inference). This resonates with Policy Gradients.
          *   *Refinement:* The "Input arrives" part is crucial. If I patch code *before* input, I'm optimising $E[U | \text{Policy}]$. If I choose action *after* input, I'm optimising $E[U | \text{Observation}, \text{Action}]$. UDT says do the former.

      *   **Misconceptions & Sequencing:**
          1.  *"Don't condition on evidence":* Reframe as "Conditioning happens at policy selection, not action selection."
          2.  *"Isn't that EDT?":* Distinguish via logical correlation (source code similarity) vs. statistical correlation.
          3.  *"Perfect predictor does the work":* Show a case where the correlation is logical (twin agent), not causal/predictive.

      *   **Scope Boundaries:**
          *   Logical Counterfactuals (too math-heavy/undefined).
          *   Formal priors (Solomonoff, etc.).
          *   Timeless Decision Theory (TDT) nuances (keep it UDT-ish).
          *   Philosophy of identity.

      *   **Final Question:**
          *   Needs to test if they understand *why* we don't update, not just *that* we don't.
          *   Scenario: A situation where updating leads to a dominated policy.

  4.  **Drafting the Plan (Iterative Process):**

      *   *Intro (5 mins):* Hook them with "Training vs. Inference". Define UDT as "Training-Time Optimality".
      *   *The Problem (10 mins):* Newcomb's Problem. But translate it. Omega = Classifier. Box = Reward. One-box = Trusting the classifier's correlation with your policy.
      *   *The Pivot (10 mins):* The "Source Code" scenario. You can edit your `policy_function` before seeing the `input`. If you edit it to "Always One-Box", Omega (who read your code) fills the box. If you edit it to "Maximise conditional on input", you get less.
      *   *Misconceptions (10 mins):* Address the "ignore evidence" charge. It's not ignoring; it's about *when* you bind the variables. Address EDT (correlation vs. logical identity).
      *   *Conclusion/Test (5 mins):* The verification question.

      *   *Critique:* Is 40 mins enough for Newcomb *and* Source Code? Maybe merge them. Make the Source Code scenario *be* the Newcomb scenario.
      *   *Revised Flow:*
          1.  Frame: Policy Gradients vs. Greedy Inference.
          2.  Case: The "Predictor reads Weights" problem.
          3.  The "Update" error: Conditioning on observation at inference time.
          4.  Misconceptions.
          5.  Test.

      *   *British English Check:* "Programme" (maybe too formal, stick to code), "optimise", "centre", "maths", "whilst", "flatly refuse". Tone should be pragmatic, slightly dry, no fluff.

  5.  **Refining the Content:**

      *   *The "Crackpot" Barrier:* The phrase "Updateless" is toxic. Call it "Prior Optimality" or "Policy-Level Optimisation" initially, then introduce the term UDT as the label for what they just agreed makes sense.
      *   *The Source Code Case:* Make sure it's clear that the predictor reads the *weights*, not the output. This avoids the "causal influence" trap.
      *   *EDT Distinction:* EDT says $P(\text{Win} | \text{OneBox})$ is high. UDT says "My code *is* the reason $P(\text{Win} | \text{OneBox})$ is high". It's about the *mechanism* of correlation. For ML engineers, use "Training Distribution" vs. "Test Distribution".
      *   *The "Ignore Evidence" Rebuttal:* You *do* use evidence to select the policy, but the policy itself doesn't re-calculate EU based on evidence at runtime if that breaks the correlation. Actually, simpler: You optimise the mapping $Observation \to Action$ from the prior, you don't optimise $Action$ given $Observation$ at the posterior.

      *   *Final Question:* Needs to be a variant of Newcomb where the observation is tempting but misleading. The "Transparent Newcomb" is good here. If you see the money, do you take both? UDT says no (if policy was committed). CDT/EDT says yes.

  6.  **Final Polish (incorporating constraints):**
      *   Ensure British spelling (optimise, programme, behaviour).
      *   Ensure tone is authoritative but collaborative (engineer-to-engineer).
      *   Check timing (40 mins is tight).
      *   Make sure the "What to leave out" section is explicit.

  7.  **Structure of the Output:**
      *   Executive Summary.
      *   The Narrative Arc (Minute-by-minute).
      *   The Core Analogy (Training vs. Inference).
      *   Misconception Kill-Sequence.
      *   The Verification Question.
      *   The "Out of Scope" Declaration.

  8.  *(Self-Correction during drafting)*: Wait, if I say "Policy Gradients", they might think of RL. UDT is more like finding the global optimum of the policy parameters $\theta$ to maximise expected utility over the prior, rather than updating $\theta$ based on a specific trajectory. I need to be careful not to confuse UDT with standard RL training. UDT is about *decision making* in a single shot, but modelled as a policy selection problem.
      *   *Correction:* Frame it as "Selecting the inference algorithm" vs "Running the inference algorithm".
      *   *Key Insight:* UDT is what you get if you treat the decision problem as a loss landscape over policies, not actions.

  9.  **Final Review against constraints:**
      *   British English? Yes.
      *   Plan not explanation? Yes.
      *   Misconceptions addressed? Yes.
      *   Scope limits? Yes.
      *   Verification question? Yes.

