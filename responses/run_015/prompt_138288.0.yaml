answer: |-
  Here is a 40-minute battle plan designed for ML engineers. It bypasses philosophy jargon and frames Updateless Decision Theory (UDT) as a problem of **optimisation scope** (policy-level vs. action-level).

  ### Executive Summary
  *   **The Hook:** Frame UDT not as "ignoring evidence," but as "Training-Time Optimality" vs. "Inference-Time Greed."
  *   **The Core Case:** Do not start with Newcomb. Start with the **Source Code/Predictor** scenario. It maps directly to weights vs. inputs.
  *   **The Terminology:** Avoid "Updateless" until minute 25. Call it "Prior Policy Optimisation" initially to bypass the crackpot alarm.
  *   **The Goal:** Convince them that conditioning on observations *during* action selection can break logical correlations established *during* policy selection.

  ---

  ### 1. The Narrative Arc (Minute-by-Minute)

  **00:00 – 05:00: The Setup (Training vs. Inference)**
  *   **Do not** mention philosophy.
  *   **Say:** "In RL, we distinguish between updating policy weights ($\theta$) and selecting actions ($a$) given a state ($s$). Standard decision theory assumes you optimise $a$ given $s$ at inference time. I'm going to argue that for certain loss landscapes, you must optimise the mapping $s \to a$ from the prior, before $s$ is known."
  *   **Goal:** Establish that 'updating' means 'conditioning on $s$ to pick $a$' and 'updateless' means 'picking the function $f(s)$ based on $P(s)$'.

  **05:00 – 15:00: The Core Case (The Weight-Reader)**
  *   **Scenario:** An agent deploys code to a server. A Predictor (Omega) reads the **weights** of the policy network *before* deployment. If the weights encode a policy that will output 'A', Predictor puts £1M in the box. If weights encode 'B', box is empty.
  *   **The Input:** Once deployed, the agent receives an input. It *could* ignore its weights and compute a new action based on the input (e.g., "I see the box is full, I'll take both").
  *   **The Conflict:**
      *   **Inference-Time Optimisation (CDT/EDT):** "I see the money is already there. My action can't causally change the past. I'll take both boxes." Result: Predictor saw *this* logic in the weights, box is empty. Payoff: £0.
      *   **Prior Policy Optimisation (UDT):** "I must select weights such that, *across the prior distribution of Predictors*, I get the money." I hardcode 'One-Box' into the weights. Result: £1M.
  *   **Why this works:** It bypasses "magic prediction." It's just static analysis of code. It makes the policy a tangible object they can point to.

  **15:00 – 25:00: The Translation (Why this is UDT)**
  *   Now introduce the term **Updateless Decision Theory**.
  *   **Define it:** "UDT is the claim that rational agents should act as if they are selecting their entire policy from the prior, rather than selecting actions from the posterior."
  *   **The "Ignore Evidence" Reframe:** "You aren't ignoring evidence. You are acknowledging that the evidence (the input) is logically correlated with the Predictor's earlier read of your policy. Conditioning on the input *as if it were independent* breaks the correlation."
  *   **Analogy:** "It's like overfitting. If you optimise for the specific test case (the observation), you lose generalisation (the correlation with the Predictor). You must optimise for the training distribution (the prior)."

  **25:00 – 35:00: Killing the Misconceptions**
  *   *See the "Misconception Kill-Sequence" below for exact phrasing.*
  *   Handle the "EDT vs. UDT" and "Predictor Magic" objections here.

  **35:00 – 40:00: The Verification Question**
  *   *See below.*
  *   Q&A buffer.

  ---

  ### 2. The Core Case: Source Code vs. Newcomb
  You asked if the "self-patching source code" case smuggles in the conclusion.
  *   **Verdict:** It does, but **that is a feature, not a bug** for this audience.
  *   **Reasoning:** ML engineers understand that if a static analyser reads your weights, your runtime logic is constrained by your weights. Newcomb's Problem feels like magic to them; Weight-Reading feels like engineering.
  *   **The Pivot:** Once they accept the Weight-Reader case, *then* you tell them: "Newcomb's Problem is exactly this, but the 'weight reading' is done via logical inference rather than static analysis. If you accept the engineering case, you must accept the logical case, unless you believe human logic isn't computable."
  *   **Warning:** Do not let them dismiss it as "just precommitment." Precommitment is a trick; UDT is the claim that this *is* the correct way to calculate expected utility. Emphasise that the agent *wants* to be the type of agent that doesn't take the second box.

  ---

  ### 3. Misconception Kill-Sequence
  Address these in this specific order. If you address them out of order, you will get bogged down.

  **1. "So you're saying don't condition on the evidence?"**
  *   **When:** Minute 26 (Immediately after defining UDT).
  *   **The Kill:** "No. I'm saying you condition on the evidence when you *select the policy*, not when you *execute the action*. If your policy is $f(s)$, you optimise $f$ using $P(s)$. You do not re-calculate EU for $a$ using $P(s|s_{observed})$ at runtime if doing so contradicts $f$. It's the difference between backpropagating through the whole graph vs. greedy decoding."

  **2. "Isn't that just Evidential Decision Theory (EDT) again?"**
  *   **When:** Minute 30.
  *   **The Kill:** "EDT conditions on the action: $P(\text{Outcome} | \text{Action})$. UDT conditions on the policy: $P(\text{Outcome} | \text{Policy})$. In the Weight-Reader case, EDT fails if the Predictor reads your code but you try to 'act' against it at runtime. EDT sees the correlation but lacks the mechanism to *be* the correlation. UDT says *you are the code*. The correlation isn't statistical; it's logical identity."

  **3. "Surely the perfect predictor is doing all the work here?"**
  *   **When:** Minute 33.
  *   **The Kill:** "Remove the Predictor. Replace it with a **Twin Agent**. You and a copy share source code. You both face a Prisoner's Dilemma. If you defect, the copy defects. CDT says 'Defect (dominant strategy)'. UDT says 'Cooperate (my action determines my copy's action)'. The mechanism isn't prediction; it's logical subjunctivity. If the maths is the same, the output is the same."

  ---

  ### 4. The Verification Question
  Do not ask "Do you understand?" They will lie. Do not ask a maths question; they will solve it mechanically without grasping the concept.

  **The Question:**
  > "Imagine you train a policy on a distribution where 'One-Boxing' yields £1M and 'Two-Boxing' yields £1k. You deploy it. At runtime, you observe a specific instance where the box is visibly full. A standard RL agent might learn to 'Two-Box' on this specific state to squeeze out extra utility if it thinks the reward is fixed.
  >
  > **If your agent is Updateless, does it Two-Box on this specific observation? Why or why not?**"

  **The Correct Answer:**
  "It depends on whether the 'box full' observation is causally independent of the policy. If the box is full *because* the policy was 'One-Box', then Two-Boxing at runtime implies the policy *would have been* 'Two-Box', which means the box would have been empty. The Updateless agent sticks to the policy that generated the £1M, even if locally Two-Boxing looks dominant."

  **What this tells you:**
  *   If they say "It Two-Boxes," they think UDT is just precommitment they can break.
  *   If they say "It One-Boxes because of the correlation," they get it.
  *   If they say "It depends on the training objective," they are hedging but thinking like engineers.

  ---

  ### 5. Scope Boundaries (What to Flatly Refuse)
  At minute 05, state this explicitly to manage expectations and protect your time.

  > "To make this fit 40 minutes, I am explicitly excluding three things:
  > 1.  **Logical Counterfactuals:** I will not define the maths of 'what if 2+2=5'. We are treating logical correlation as a given engineering constraint, like a shared random seed.
  > 2.  **The Prior:** I am not defending Solomonoff Induction or the specific prior used. We assume a prior exists.
  > 3.  **Philosophy of Identity:** We are not discussing 'you'. We are discussing 'the agent instance'.
  >
  > If you want to argue about the nature of counterfactuals, buy me a pint afterwards. For now, we are discussing optimisation landscapes."

  ### 6. Delivery Notes (British English & Tone)
  *   **Tone:** Pragmatic, slightly dry. Avoid evangelism. Treat UDT as a "weird edge case in loss landscapes" rather than "the truth about rationality."
  *   **Vocabulary:** Use "optimise" (not optimize), "programme" (if referring to the whole system, though 'code' is fine), "behaviour", "maths".
  *   **Phrasing:**
      *   Instead of "You must believe," say "The model implies..."
      *   Instead of "It is rational," say "It maximises expected utility from the prior."
      *   If challenged aggressively: "That's a valid objection for CDT, but we're looking at the policy-gradient perspective where the weights are the decision variable."

  ### Summary Checklist for the Podium
  1.  **Reframe:** Updateless = Prior Policy Optimisation.
  2.  **Case:** Weight-Reader (not Newcomb initially).
  3.  **Distinction:** Policy ($\theta$) vs. Action ($a$).
  4.  **Exclusions:** Logical counterfactuals, Priors, Philosophy.
  5.  **Test:** The "Visible Full Box" scenario.

  Stick to this, and you'll keep them in the engineering mindset without triggering the "crackpot" alarms. Good luck.
