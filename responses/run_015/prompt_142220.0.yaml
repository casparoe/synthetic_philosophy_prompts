      *   *Case 7 (Costs):* Asymmetry. Willing to pass costs to future, less willing to pass benefits. Verdict: Discount costs more than benefits?
      *   *Case 8 (Future Self/Dementia):* Torn. 60 vs 85 (dementia). Verdict: Ambivalent (identity connection weakens).
      *   *Case 9 (Very Long Horizon):* Faint pull to sooner at 300 yrs, real pull at 1000 yrs. Verdict: Epistemic humility/model breakdown.

  3.  **Identify the Philosophical Conflict:**
      *   The conflict is between *Impartiality* (Case 1: time shouldn't matter morally) and *Perspectivalism* (Case 4: from my point of view, now matters more).
      *   Standard Economic View: Pure time preference is irrational/immoral (Ramsey, Pigou), but descriptive discounting is practical.
      *   Parfit's Non-Identity Problem: Relevant to Case 1 (different people).
      *   Psychological/Phenomenological View: Case 4 is about *experience*, Case 1 is about *states of affairs*.

  4.  **Develop a Unifying Principle:**
      *   The user's "stab" is actually very close to the standard philosophical defense against pure time preference (the "Triple Discount" framework: Probability, Opportunity Cost, Epistemic Decay).
