  3.  **Deconstruct Section 2: Where Theory Breaks Down:**
      *   *Division:* 51.9% vs 48.1% is not a homogeneous will. It's a fractured society. Populism struggles with narrow margins.
      *   *Heterogeneity:* Scotland/Northern Ireland vs. England/Wales. Age, education divides. The "unitary" will is a fiction.
      *   *Implementation:* The ballot didn't say *how* to leave (Soft vs. Hard Brexit). The "will" was vague on specifics.
      *   *Binary Reduction:* Complex constitutional/economic entanglement reduced to In/Out. Loss of nuance.

  4.  **Deconstruct Section 3: What the Episode Reveals about Theory:**
      *   *Constructed vs. Discovered:* The mechanism (the vote) didn't find a pre-existing unity; the rhetoric *created* a unity out of a plurality.
