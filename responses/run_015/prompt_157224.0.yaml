  **OFFICE FOR EPISTEMIC STANDARDS**
  **DRAFT STATUTORY GUIDANCE: PILOT SCHEME 44-B**
  **JURISDICTION: LITTLE CREDENCE**
  **SUBJECT: QUARTERLY CREDENCE RETURN (QCR)**

  **1.0 General Obligations**
  1.1 Participating households must file a QCR within 14 days of quarter-end.
  1.2 For every proposition on the Approved Question Schedule (AQS), the Resident must assign a credence $c \in [0, 1]$. The assignment of 'No View', 'Unsure', or 'N/A' is prohibited; suspension of judgment is administratively coded as $c = 0.5$ and will be scored accordingly.
  1.3 Credences must satisfy the Probability Calculus. Incoherent sets are accuracy-dominated and constitute a Class 2 Epistemic Offence. Penalties are levied for accuracy loss, not pragmatic vulnerability.

  **2.0 Scoring and Utility**
  2.1 Returns are assessed using the Brier Strictly Proper Scoring Rule. Residents maximize expected epistemic utility by reporting their genuine credence; insincerity is self-punishing and undetectable.
  2.2 To prevent evasion via vague commitment, Residents are reminded that proper scoring rules reward refinement. A calibrated but unsharp profile (e.g., $c = 0.5$ for all $p$) yields lower expected utility than a calibrated, sharp profile.
  2.3 Updating Duty: Residents must maintain a standing plan to conditionalize on new evidence. Failure to plan for expected accuracy maximization is a breach, regardless of actual posterior coherence.

  **3.0 Domain Neutrality**
  3.1 Epistemic utility is invariant to subject matter. A credence of 0.9 regarding *'It will rain'* yields identical utility to 0.9 regarding *'The patient has malignancy'*, provided truth-values match. Weighting by practical importance is excluded from epistemic assessment.

  **SPECIMEN CREDENCE RETURN (EXTRACT)**
  **Resident:** J. Doe (Household 4)
  **Auditor:** M. Verity (Certified Credence Auditor)

  | AQS ID | Proposition | Resident Credence | Truth Value | Score | Auditor Notes |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 001 | Bus 7 arrives before 09:00 | 0.85 | 1 (True) | 0.0225 | Acceptable. |
  | 002 | Local water contains lead | 0.50 | 1 (True) | 0.2500 | **Penalty.** Excessive caution. Evidence available; sharpness required. |
  | 003 | Atom #992 decays in T1 | 0.50 | 0 (False) | 0.2500 | **Query.** Why 0.5? |
  | 004 | *P* ∧ ¬*P* | 0.00 | 0 (False) | 0.0000 | Coherence maintained. |

  **Auditor Marginalia on 003:** *Resident claims evidential access is impossible. Guidance 1.2 applies: 'No View' is not a valid state. You must assign a distribution. Default 0.5 incurs penalty if false. Recommend assigning 0.0 or 1.0 to maximize potential utility.*

  **DEPARTMENTAL COMMENTARY**

  **Dr. E. Norm, OES Spokesperson:** "Critics argue that forcing a number on unknowables is epistemically reckless. This misunderstands the framework. Truth is binary; credence is continuous. The epistemic good is closeness to truth. Whether the proposition concerns a diagnosis or a quantum event is irrelevant to the mathematics of accuracy. We do not score morality; we score proximity to reality."

  **L. Citizen, Little Credence Resident:** "I tried to leave the box blank for the atom question. The form rejected it. The auditor said my silence was just a hidden 0.5, and since the atom didn't decay, I was inaccurate. I am now financially penalized for admitting I don't know the future of a subatomic particle. It feels less like science and more like demanding I guess the weight of a ghost."

  **4.0 Compliance and Recoil**
  4.1 The AQS is expanded quarterly. Residents must note that Proposition 003 (Atomic Decay) is mandatory. Defense of 'Evidential Insufficiency' is not admissible. The duty to maximize expected accuracy requires a credence assignment even where evidence is null, as $c=0.5$ is itself a truth-apt claim subject to scoring.
  4.2 Residents are reminded that understanding, explanation, and testimony are not epistemic goods under this statute. Only accurate credence counts.

  **NOTICE TO ALL RESIDENTS:** Failure to assign a precise credence to AQS Item 003 (Atomic Decay) will result in an automatic accuracy deficit. The Office maintains that holding no view is merely holding a view of 0.5 with poor calibration. There is no exit from the doxastic economy.

  ***

  **Note to Editor (Not for Publication):**
  This piece targets the **Domain Neutrality** and **Prohibition of Suspension** implications of accuracy-first epistemology. It assumes a canonical Joyce-style framework where epistemic utility is solely a function of credence accuracy. Clause 2.2 rests on the contested claim that proper scores sufficiently incentivize sharpness without pragmatic weighting; a defender would reply that rational agents naturally sharpen when evidence permits, and the "unknowable" case is an edge case where 0.5 is indeed the rational credence, not a penalty. The satire leans on the administrative operationalization forcing commitment where evidence is absent, highlighting the tension between "rational credence" and "mandatory opinion."
