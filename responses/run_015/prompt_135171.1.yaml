answer: |-
  **PREP SHEET: Structural PAP Defense (Job Talk)**
  **Date:** Next Thursday
  **Room:** Action Workshop (Hostile territory)

  **STRAT NOTE:** Concede the locked-in case *immediately* in the intro or first Q. Don't fight the cognitive scientist on biology. If the hardware is broken, the architectonic software can't run. Say: "You're right, no action-space means no structural control. My theory isn't for them." Gets them on side.

  Here are the 8 objections, ranked by how much they hurt.

  ***

  **1. The Infinite Regress (The "Hope Nobody Asks" Killer)**
  *Who:* Senior Compatibilist (knows Frankfurt cases inside-out)
  *Q:* "If responsibility requires a prior structural choice to become the kind of agent who refuses, did you make *that* choice responsibly? If yes, you needed a prior structural choice for *that*. If no, your responsibility rests on luck. Aren't you just pushing the buck back infinitely?"
  *Reply (2 min):* "Good question. I'm not claiming every structural choice needs a prior structural choice. That *would* be a regress. I'm claiming responsibility tracks the *capacity* for structural revision, not an infinite history of them. At some point, you just *are* an agent with a deep self. If Black intervenes before that capacity forms, sure, no responsibility. But for mature agents, the structural option is present in the history, not requiring an infinite chain."
  *Weakness:* Ouch. If they push on *how* that capacity formed without prior choice, I have to admit **constitutive luck**. I have to concede that ultimate origination might fail, but argue moral responsibility doesn't need *ultimate* origination, just sufficient structural control. Don't dig in on "ultimate."

  **2. The "Flicker in Disguise" Objection**
  *Who:* Lead Frankfurtian
  *Q:* "This looks like a standard 'flicker of freedom' defense. You're just renaming the alternative. Frankfurt showed Jones can't refuse. You say he could have 'become a refuser.' But in the actual sequence, he didn't. If the actual sequence is determined/blocked, your 'structural alternative' is irrelevant to the action performed."
  *Reply:* "It's not a flicker because it's not about the action token. It's about the *agent type*. Frankfurt blocks the act; he doesn't block the history of character formation. Responsibility attaches to the architecture that produced the act, not just the act itself. The alternative isn't 'doing otherwise now,' it's 'having been otherwise.'"
  *Weakness:* They will say this changes the subject of PAP. PAP is about *possibilities at t of action*. I'm shifting it to *t-minus-n*. Might look like I'm abandoning PAP rather than revising it.

  **3. The Hidden Neural Alternative (Libertarian Attack)**
  *Who:* The Libertarian
  *Q:* "You're ignoring the real metaphysics. Frankfurt cases only block macro-choices. The real alternative possibility exists in pre-decision neural states—micro-indeterminacies before the signal fires. By focusing on 'structural choices,' you're ignoring the physical locus of freedom. Jones didn't have a structural option if his neural architecture was determined."
  *Reply:* "I'm agnostic on the neural micro-states. Even if there's indeterminacy there, if the agent can't *access* it to restructure their options, it's just noise, not freedom. Structural PAP requires the alternative be *actionable* at the level of self-governance, not just a quantum flutter in the motor cortex."
  *Weakness:* They'll accuse me of ignoring the hard problem of determinism. If the structure itself is determined, my "structural option" is an illusion. I'm begging the question against hard determinism.

  **4. The Timing/Intervention Objection**
  *Who:* Compatibilist
  *Q:* "Black intervenes *before* Jones decides. If Black monitors Jones's character formation, he blocks the structural choice too. You can't say Jones retained the structural alternative if Black is watching the whole timeline."
  *Reply:* "Frankfurt cases are usually set up to intervene at the moment of decision (the sign). If Black monitors the whole life, that's a 'Global Frankfurt Case,' which is a different beast. My claim holds for standard local intervention. We shouldn't let the perfect be the enemy of the good."
  *Weakness:* Standard Frankfurtians argue the sign *entails* the intervention is always already there. Distinguishing local vs global might look ad hoc.

  **5. The Locked-In Inconsistency**
  *Who:* Cognitive Scientist
  *Q:* "You conceded locked-in patients lack framework control. But what about severe OCD or addiction? Their 'action-space' is retained physically, but their structural ability to revise options is chemically compromised. Are they responsible? Your line seems arbitrary."
  *Reply:* "It's a spectrum. Locked-in is a hard floor (no output). Addiction is a degradation of the structural mechanism. I'd say responsibility is diminished proportional to the loss of structural flexibility. The theory predicts degrees of responsibility, which fits clinical intuition."
  *Weakness:* Hard to draw the line. If I say "degrees," I weaken the binary nature of PAP.

  **6. The "Too Expensive" Objection**
  *Who:* Grad Student (trying to impress)
  *Q:* "This makes responsibility too hard. Most of us act on habit. Do you really mean I'm not responsible for buying coffee unless I actively considered 'becoming a non-coffee-drinker' structurally?"
  *Reply:* "No. The structural option is a *capacity*, not a conscious event. You don't have to exercise it every time. You just have to possess the machinery to override habit if needed. Habits are authorized by the structure."
  *Weakness:* "Capacity" is vague. How do we test for it? Might make responsibility empirically unknowable.

  **7. The Triviality Charge**
  *Who:* Skeptic
  *Q:* "Isn't this just saying 'You're responsible if you're the kind of agent who is responsible'? It sounds circular. Structural PAP = Responsible agents have options. Well, yeah."
  *Reply:* "It's not circular because it specifies *which* options matter. It explains *why* Frankfurt cases don't work: they remove first-order options but leave second-order status intact. It adds explanatory power about *why* we blame Jones."
  *Weakness:* If they press that second-order status is defined by responsibility, I'm stuck. Need to define 'structural capacity' independently.

  **8. The Terminology Quibble**
  *Who:* Pedant
  *Q:* "Why call it PAP at all? If you don't require alternative possibilities at the time of action, you're basically a semi-compatibilist. Why keep the label?"
  *Reply:* "Because the alternative *is* there, just at a different grain. I want to save the intuition that 'could have done otherwise' matters, without failing the Frankfurt test. It's a revision, not an abandonment."
  *Weakness:* Semantics. Doesn't hurt the thesis, but annoys the room.

  ***

  **EMERGENCY PROTOCOL (If Regress #1 gets pushed hard):**
  If they corner me on where the structural choice comes from:
  **Admit:** "I have to admit that at the foundational level, deep self-constitution involves luck. I can't guarantee Ultimate Responsibility. But I'm arguing for *Moral* Responsibility, which only requires that the structure is *yours*, not that you created it ex nihilo."
  (Don't try to solve the regress. Own the luck.)

  *Typo check: make sure I don't spell 'structrual' wrong in the slides.* (oops, did it here).
  *Good luck.*
