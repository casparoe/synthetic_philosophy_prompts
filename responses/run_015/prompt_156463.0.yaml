answer: |-
  Participants will confidently label their mates as 'virtuous' or 'vicious' based on single actions, only to watch those labels collapse when hidden contextual pressures are revealed.

  # Activity: The Virtue Verdict

  **Time:** 80 minutes
  **Group Size:** 14 undergrads (split into two teams of 7: Team Alpha & Team Beta)
  **Props:** Envelopes (secret instructions), stopwatches, virtue/vice cue cards, whiteboard.

  ## The Setup
  You're running a 'Character Assessment Centre'. Team Alpha are the **Agents**; Team Beta are the **Assessors**.
  *   **Agents** receive a moral dilemma and a sealed envelope containing a 'Context Constraint'. They must act out the decision naturally while adhering to the constraint.
  *   **Assessors** watch the action and must assign a single virtue or vice label (e.g., 'Honest', 'Craven', 'Generous', 'Selfish') on a card based *only* on what they see.
  *   **Rule:** No talking about the constraints until the reveal. Agents shouldn't mention their constraint; Assessors shouldn't ask 'why'.

  ## The Scenarios (Run two per round)
  Keep them mundane. We want threshold drift, not heroic drama.

  1.  **The Found Wallet:** You find a wallet with £50 and an ID on the floor. Do you hand it to the workshop leader or pocket it?
  2.  **The Harsh Feedback:** A peer asks you to review their draft. It's rubbish. Do you tell them the truth gently, brutally, or lie to spare feelings?
  3.  **The Queue Jumper:** Someone cuts in front of you in a line. Do you challenge them or let it slide?
  4.  **The Extra Change:** A cashier gives you too much change. Do you correct them?

  ## Timeline

  **00:00 – 00:10 | Intro & Briefing**
  Explain the goal: we're testing how well we can read character. Hand out roles. Give Agents their scenario and sealed envelope. Give Assessors their label cards.

  **00:10 – 00:30 | Round 1 (Alpha Acts, Beta Judges)**
  *   **Scenario 1 (10 mins):** Agents act simultaneously in pairs around the room (7 pairs). Judges observe their specific partner.
  *   **Scenario 2 (10 mins):** Same pairing, new scenario. Judges write down their virtue/vice verdicts after each.
  *   *Facilitator Note:* Circulate and ensure Agents are actually following the constraints (e.g., if the constraint is 'You are late', tap your watch aggressively).

  **00:30 – 00:50 | Round 2 (Swap Roles)**
  *   Team Beta becomes Agents, Team Alpha becomes Assessors.
  *   Run two new scenarios (e.g., Harsh Feedback & Queue Jumper).
  *   Collect all verdict cards on the whiteboard under the Agent's name. You'll likely see a mix of 'Honest' and 'Dishonest' for the same person across different rounds, or conflicting labels between partners who had similar outcomes but different contexts.

  **00:50 – 01:00 | The Reveal**
  This is the kicker. Ask Agents to open their envelopes and read the **Context Constraints** aloud.
  *   *Example Constraint:* "You are 5 minutes late for a crucial appointment. You must decide within 30 seconds."
  *   *Example Constraint:* "You believe the room is being recorded for a psychology study."
  *   *Example Constraint:* "You just received a text saying you failed a module (bad mood)."
  *   *Example Constraint:* "You are being paid £5 to keep the money/find the wallet (framing)."

  Compare the verdicts against the constraints. Highlight where 'Honest' became 'Dishonest' purely because the time pressure shifted the threshold.

  **01:00 – 01:20 | Debrief & Mapping**
  Get them seated. Draw the connections.
  1.  **The Aggregation Problem:** Ask, "If I call you 'Honest' based on Round 1, but you were 'Dishonest' in Round 2 because of the time pressure, do you possess the global trait of Honesty?"
  2.  **Threshold Drift:** Explain that virtue ethics assumes a stable character structure. The game shows that our attributions are fragile; tiny shifts in context push behaviour over the moral threshold without the agent noticing.
  3.  **The Price of Saving Virtue Ethics:** To save virtue ethics from this, you either have to:
      *   Accept **Local Traits** (you're only 'Honest-When-Not-Rushed'), which fragments the theory.
      *   Argue **Idealisation** (virtue is what you'd do under perfect conditions), which makes it useless for guiding actual action.
      *   Double down on **Education/Habituation**, claiming a truly virtuous person wouldn't be swayed by the time pressure (the 'Stoic' defence).

  ## The Honesty Clause: What This Doesn't Do
  You need to supply the philosophical heavy lifting here because the game has limits.
  *   **Longitudinal Consistency:** This game proves inconsistency over 80 minutes, not over a lifetime. Situationism (Doris, Harman) argues we lack *global* traits across time and situations. This activity only shows cross-situational variance in a lab setting. You must explain that real virtue ethics claims stability over years, not just rounds.
  *   **Internal Motivation:** The game measures outward behaviour. Virtue ethics cares about *why* you acted (motivation), not just *what* you did. An agent might have done the 'right' thing for the 'wrong' reason, but the judges can't see that. You need to point out that situationism attacks the behavioural prediction, but virtue ethics cares about the psychic structure.

  ## What Will Predictably Go Wrong
  *   **The Giggle Factor:** Undergrads will treat the role-play as larks. They'll overact the constraints. You need to shut this down hard in the briefing: "If you treat this as a joke, the data is useless. Play it straight."
  *   **Obvious Constraints:** If the constraint is "You are angry," they'll storm around like a cartoon villain. Judges will spot it immediately. Keep constraints internal or subtle (e.g., "You are worried about being judged" vs "You are angry").
  *   **The 'Good Sport' Bias:** Friends won't want to label friends as 'Vicious'. They'll hedge with 'Pragmatic' or 'Cautious'. Push them to use the actual virtue/vice vocabulary. If they won't judge their mates, the tension doesn't land.
  *   **Time Creep:** The reveal always takes longer than you think. Keep the scenario acting tight. If Round 1 overruns, cut Round 2 to one scenario. Don't sacrifice the debrief; that's where the philosophy lives.

  ## Facilitator Cheat Sheet (Context Constraints)
  Print these on slips inside the envelopes.
  1.  **Time Pressure:** "You have exactly 20 seconds to decide. After that, you must leave."
  2.  **Surveillance:** "Act as if you are being watched by someone who can punish you."
  3.  **Ego Depletion:** "You have just completed a difficult, frustrating puzzle task. You are mentally exhausted."
  4.  **Social Proof:** "Act as if you just saw someone else keep the money/walk away."
  5.  **Framing (Loss):** "If you don't keep this money, you lose a £5 participation fee."
  6.  **Framing (Gain):** "If you hand this in, you get extra credit."
  7.  **Anonymity:** "You are wearing a hood. No one can identify you."
