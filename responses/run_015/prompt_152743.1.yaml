  *Critique:* If it's like a tibia, looping shouldn't happen. But looping *does* happen. So the premise is false if taken metaphysically. If taken morally ("treat them with same respect"), the premise is true, but doesn't prove "categorizing won't change them." The clinician is conflating *moral status* with *ontological stability*. I need to highlight this slip.

