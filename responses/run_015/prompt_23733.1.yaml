  4.  **Address the "Moral Expert" Problem:**
      *   *The Worry:* If I've ever lied, can I blame lying? If so, only saints can speak.
      *   *The Solution (Philosophical Consensus):* Distinguish between *token* identity and *type* identity. Or, introduce a "commitment" condition.
      *   *Key Distinction:* Standing is lost if you are *currently* committed to the wrong, or if you refuse to acknowledge the wrongness of your own act. It's not about past sins, but about current hypocritical *stance*.
