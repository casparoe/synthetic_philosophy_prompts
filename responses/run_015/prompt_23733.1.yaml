answer: |-
  This is a classic problem in contemporary moral philosophy, often discussed under the header of **"Standing to Blame."** The core intuition you're chewing on is that hypocrisy forfeits standing.

  For your reading group, here are the three most critical implications of that view, specifically tailored to your questions about public criticism and the "moral expert" worry.

  ### 1. The Relevance Condition (The Politician Problem)
  Your politician example highlights the **scope** of the forfeiture. Most philosophical accounts (like those by Macalester Bell or Kyle Fritz) argue that standing is lost only when the hypocrisy is **relevantly similar**.

  *   **The Implication:** If a politician is caught embezzling funds (Wrong A), they lose standing to blame others for embezzlement. But do they lose standing to lecture on foreign policy or environmental ethics (Wrong B)?
  *   **The Nuance:** Under a strict view, no. Hypocrisy regarding *honesty* doesn't automatically strip standing regarding *justice*.
  *   **The Catch:** However, in public discourse, we often treat "character" as a unified asset. If the view is that standing requires **moral authority**, and the scandal reveals a fundamental disregard for *norms generally*, then their standing on *unrelated* issues might be compromised.
  *   **Reading Group Takeaway:** The debate isn't just "are they a hypocrite?" but "is the hypocrisy **structurally relevant** to the norm they are enforcing?" If the politician lectures on "family values" while cheating on a spouse, the link is direct. If they lecture on "tax policy" while cheating on a spouse, the link is tenuous unless you argue both require a commitment to "rule-following."

  ### 2. Dodging the "Moral Expert" Problem (Purity vs. Accountability)
  This is the strongest objection to the standing view: **If standing requires moral purity, only saints can speak, and moral discourse collapses.**

  To dodge this, most contemporary philosophers distinguish between **committing a wrong** and **rejecting the norm**.

  *   **The "Acknowledgment" Condition:** You do not lose standing simply because you have sinned. You lose standing if you **refuse to acknowledge** that your own action was wrong while blaming someone else for it.
  *   **The Implication:** A reformed smoker has standing to tell a kid not to smoke. A current smoker who says, "Smoking is bad for you (and yes, I know I'm a hypocrite, but I'm trying to quit)" retains standing. A current smoker who says, "Smoking is bad for you (and what I do is none of your business)" loses standing.
  *   **Reading Group Takeaway:** Standing isn't about a clean past; it's about a **current commitment to the norm**. This saves the "moral expert." An ethicist can teach about honesty even if they have lied in the past, provided they acknowledge the lie as a failure and endorse the norm of honesty.

  ### 3. The Function of Public Blame (Accountability vs. Punishment)
  Finally, this view changes what we think public moral criticism is *for*.

  *   **If standing is required:** The goal of blame is not just to identify wrongs (which anyone can do), but to call someone into a **moral community**.
  *   **The Implication:** When a hypocrite blames someone, they aren't just making a factual claim ("You did wrong"); they are issuing a challenge ("You owe us an account"). If the blamer isn't willing to offer an account for their own similar actions, the "contract" of the moral community is broken.
  *   **Reading Group Takeaway:** This suggests that public criticism shouldn't be silenced by hypocrisy, but it should be **discounted**. We can still agree the act is wrong (the truth claim stands), but we are justified in ignoring the *blamer* (the authority claim fails).

  ### Summary for the Group
  To synthesize this for your discussion:

  1.  **Truth vs. Standing:** Distinguish between whether the criticism is *true* (the act is wrong) and whether the critic has the *authority* to issue it. Hypocrisy attacks the latter, not the former.
  2.  **The Escape Hatch:** To avoid the "only saints can speak" problem, define standing loss as **unacknowledged hypocrisy**, not **past sin**.
  3.  **Public Sphere:** For public figures, the bar for "relevant similarity" is lower. Because they legisate/enforce norms, a breach in *any* serious norm can undermine their standing to enforce *other* norms, as it suggests a general disregard for the rule of law/ethics.

  **Suggested Reading:** If you want to dive deeper, look up **Macalester Bell's "The Standing to Blame"** or **Kyle Fritz's work on hypocrisy**. They tackle the "moral expert" objection head-on.
