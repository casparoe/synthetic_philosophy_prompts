  quick question for my reading group. i've been chewing on the idea that you lose standing to blame someone if you've committed the same kind of wrong yourself (the whole hypocrisy angle). what are the most important implications of that view for public moral criticism, like a politician who got caught in a scandal but keeps lecturing about a totally unrelated moral issue? i'm especially curious whether the view can dodge the problem where moral experts end up with no standing to say anything at all.
