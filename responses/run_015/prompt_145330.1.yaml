  **Co-sign:** Alex says co-signing asserts you know the claim too. Jordan says it asserts you've vetted the source. **Verdict:** Alex wins on intuition (names imply agreement), but Jordan wins on utility (allows collaboration without omniscience).
  **Lottery:** Alex says you can't assert a ticket lost before checking. Jordan says you can if stakes are low enough to rely on odds. **Verdict:** Alex wins. Even in low stakes, asserting lottery losses feels wrong regardless of probability.
  **Extra Case (Directions):** Alex says don't assert directions unless known. Jordan says assert if reliable enough for the stakes. **Verdict:** Jordan wins. forbidding uncertain directions impedes daily life more than it protects truth.

  **Loose Ends**
  The dialogue leaves open the question of "contextual stakes." Who decides what the stakes are? The speaker, the listener, or the community? If Alex and Jordan disagree on whether a situation is high-stakes, which norm applies? This is the best anchor for part two. It moves the debate from the nature of assertion to the nature of context. Can we codify stakes, or is it always subjective? If it's subjective, does the Reliance Norm collapse into "assert whatever you feel like"? That's the vulnerability to exploit next time.
