answer: |-
  **MEMORANDUM**

  **TO:** University Animal Ethics Committee
  **FROM:** [Your Name/Role]
  **DATE:** October 24, 2023
  **SUBJECT:** Decision & Precedent: Invertebrate Nociception Study (Shore Crab)

  **DECISION:** **Approve with Conditions.**

  This application is approved contingent on the specific mitigations below. This decision establishes the interim framework for all future invertebrate protocols (including the pending octopus and crayfish proposals).

  **RATIONALE**

  We reject the binary threshold. We cannot wait for definitive proof of sentience before granting protection; by the time evidence is conclusive, the harm is done. Instead, we adopt **graded protection proportional to the strength of evidence.** Where evidence is ambiguous, we apply the precautionary principle.

  Regarding the PI's neuroanatomical argument: The absence of a centralized cortex does not preclude the capacity to suffer. Distributed ganglia can support complex integration. While the PI argues behavior is "reweighted reflexes," the proposed analgesic arm of the study explicitly tests for the *modulation* of those reflexes by internal state. If the analgesic reduces avoidance learning, it implies the shock is not merely a stimulus but an aversive experience the animal seeks to minimize.

  Regarding the "trade-off" marker: We accept motivation trade-offs as valid evidence, but we apply a **portability discount.** Markers validated in vertebrates cannot be weighted equally in animals with divergent neural hardware. For this study, trade-off behavior must be robust and replicated to count toward the sentience threshold. We are not assuming crab pain equals human pain, but we are assuming *some* negative welfare impact is possible.

  **CONDITIONS**

  1.  **Shock Intensity Cap:** Shocks must not exceed the minimum threshold required to elicit the avoidance response. The PI must submit voltage/duration calibration data prior to commencement.
  2.  **Analgesic Control:** The analgesic arm is mandatory, not optional. If the analgesic alters behavior, it confirms the stimulus is aversive, triggering a requirement for immediate protocol review to reduce shock intensity.
  3.  **Humane Endpoints:** Any crab showing signs of prolonged distress (e.g., failure to feed >48 hours post-trial) must be euthanized immediately.
  4.  **Policy Sunset:** This framework is valid for 18 months. The Committee will reconvene to review new literature on decapod and cephalopod sentience before the octopus proposal is adjudicated.

  **THE LOSING CONSIDERATION**

  The strongest argument against this decision is the risk of a "false positive" on sentience. If the PI is correct that this is purely nociceptive reflex without affective experience, we are imposing vertebrate-level burdens on invertebrate research without ethical justification. This sets a precedent that could stifle high-value ecological and neurological research on insects and crustaceans by subjecting them to bureaucratic hurdles designed for mammals. We risk prioritizing philosophical caution over scientific utility.

  **WHAT WOULD CHANGE MY MIND**

  I would reverse this stance if definitive neurobiological evidence emerged demonstrating that decapod crustaceans lack the specific neural circuitry required for state-dependent learning (e.g., proof that modulation occurs entirely at the spinal/ganglionic level without central integration). My reasoning is most likely wrong if the "portability discount" is actually a "portability error"—meaning we are fundamentally misinterpreting invertebrate behavior through a vertebrate lens, rendering trade-off tests meaningless for this taxa.
