      *   Why? Because the relationship is not solely dependent on *her* recognition of others, but on *others'* recognition and care for her. The "we" includes her, even if she is silent or confused.
      *   The community (family, care home) sustains her personhood through their treatment of her.
      *   This is often described as "vicarious personhood" or the community bearing witness to her humanity.

  4.  **Address the Rights Question:**
      *   Does this undermine individual rights?
      *   Western liberalism often posits rights as inherent to the isolated individual.
