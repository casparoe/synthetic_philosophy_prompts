answer: |-
  # Question-Period Preparation Sheet
  **Workshop:** Comparative Historical Social Science
  **Time Horizon:** 3 Weeks
  **Room Dynamic:** 12 participants; high expertise, low tolerance for hand-waving.

  ## Part I: The Eight Objections (Ordered by Expected Damage)

  ### 1. The Identification Critique (Quantitative Economic Historians)
  **The Objection:** "You frame 'erasure-and-replay' as a test, but methodologically it's a claim about identification. You're asking us to treat historical singularities as data points in a counterfactual distribution. But you have no variation in the treatment (the erasure) and no control group. If your 'test' relies on N=2 cases of independent invention, you haven't shifted the burden of proof; you've just moved the goalposts to where data doesn't exist. How is this research design distinct from 'cherry-picking convergences'?"
  *   **Concede:** That independent re-derivation cases are rare and rarely clean natural experiments.
  *   **Hold:** That the *absence* of such cases is currently being used to support strong lock-in claims without justification.
  *   **Reply:** "I am not proposing this as a standard regression design with N; I am proposing it as a bound on inference. Currently, the literature infers lock-in from the *absence* of deviation in a single trajectory. I am arguing that without observing a severance and re-derivation, the estimand is unidentified. You don't need a large N to know a claim is untested; you need it only to confirm the alternative. My claim is negative: without a replay, the strong claim is metaphysical, not empirical. I am asking for a 'show your work' standard on the counterfactual, not a new dataset."
  *   **Candid Weakness:** This reply risks sounding like you are lowering the bar for evidence ("it's hard, so don't ask") rather than raising it. It sounds defensive.

  ### 2. The Grain of Description Problem (Philosopher of Science)
  **The Objection:** "Your taxonomy hinges on the distinction between 'outcome-type' (which recurs) and 'outcome-token' (which is path-dependent). But the grain of description is underdetermined by the evidence. Is 'industrialization' the outcome-type? Or is 'coal-intensive steam mechanization'? If you describe the outcome finely enough, every history is locked-in; if coarsely enough, everything converges. What non-arbitrary rule selects the right modal grain for your arrival-time claim?"
  *   **Concede:** That the grain is not given by nature and must be argued.
  *   **Hold:** That functional equivalence in social systems provides a non-arbitrary anchor (e.g., fiscal extraction capacity, not specific tax forms).
  *   **Reply:** "You're right that grain is a choice, but it's not arbitrary if tied to the mechanism. If the mechanism is increasing returns to *function* (e.g., communication speed), the outcome-type is defined by that function. If the mechanism is increasing returns to *specificity* (e.g., QWERTY keyboard layout), the outcome is the token. I am asking scholars to specify the mechanism first, which dictates the grain. If the mechanism is 'need for bureaucratic coordination,' then 'bureaucracy' is the type. If the mechanism is 'specific legacy software,' then the token is locked. The grain follows the causal story, not the other way around."
  *   **Candid Weakness:** This pushes the problem back to "specify the mechanism," which is often exactly what historical actors obscure. You might be demanding clarity the history cannot provide.

  ### 3. The Distributional Stakes (Comparative-Historical PolSci / Hist Soc)
  **The Objection:** "You concede that distributional legacies—who industrialized first, who was dispossessed—survive your deflation. But in our field, *that* is the path dependence that matters. If the 'outcome-type' (e.g., capitalism) arrives, but the 'arrival-time' (e.g., 1800 vs. 1950) determines global inequality gradients that persist today, isn't your deflation politically naive? You're saving the functionalist outcome while washing out the historical injustice."
  *   **Concede:** Fully. Arrival-time differences *are* the source of durable inequality.
  *   **Hold:** That conflating inequality with outcome-class lock-in muddies the policy implication (reform vs. revolution).
  *   **Reply:** "I agree entirely that arrival-time is where the human cost lives. My deflation is not meant to minimize the legacy of colonialism or dispossession; it is to clarify the remedy. If we believe in strong lock-in, we believe current institutions are unique fossils that cannot be reformed, only replaced. If we believe in arrival-time dependence, we believe functional pressures will re-derive similar institutions, so reform can work. I am not saying the history doesn't matter; I am saying the *future* is less constrained than the strong claim suggests. We can acknowledge the scar without believing the wound never heals."
  *   **Candid Weakness:** This is the hardest room to read. If they view "functional convergence" as a neoliberal erasure of difference, this reply will not satisfy them. It risks sounding technocratic.

  ### 4. The Theoretical Mismatch (Institutional Economists)
  **The Objection:** "You treat lock-in as an empirical hypothesis, but in our models, it's a mathematical property of non-ergodic systems with increasing returns. If the payoff structure has multiple absorbing states, small events *must* select the equilibrium. You aren't disproving the model with anecdotes; you're asserting the real world doesn't fit the model. Why should we change the theory rather than your interpretation of the cases?"
  *   **Concede:** That non-ergodic models *allow* for lock-in.
  *   **Hold:** That allowing for it is not the same as demonstrating it obtains in specific social domains.
  *   **Reply:** "A model shows possibility, not necessity. A physics model allows for a pencil to balance on its tip, but we don't build architecture assuming it will. The increasing-returns model is a valid *logic*, but applying it to institutions requires showing the payoff structure actually prevents switching. My argument is that in social systems, 'payoffs' are endogenous to political contestation. The model assumes fixed payoff structures; history shows those structures get rewritten. I'm not fighting the math; I'm fighting the application of static payoff assumptions to dynamic political systems."
  *   **Candid Weakness:** Economists may view this as "sociologists don't understand math." It risks a standoff between formalism and realism.

  ### 5. The Mechanism Denial (Institutional Economists)
  **The Objection:** "Are you denying increasing returns exist? If network effects or learning-by-doing exist, then early advantages compound. If you admit those mechanisms, you admit lock-in. You can't have it both ways."
  *   **Concede:** Increasing returns exist in specific technical subsystems.
  *   **Hold:** They are often overridden by political or functional pressures in macro-institutions.
  *   **Reply:** "I admit increasing returns exist locally. But institutions are not single networks; they are bundles of competing networks. A legacy tax system has increasing returns, but a fiscal crisis creates a counter-pressure that breaks the lock. Strong path dependence assumes the increasing returns dominate forever. Arrival-time dependence says they dominate until a shock resets the cost-benefit analysis. I'm arguing the 'forever' is the unsupported leap."
  *   **Candid Weakness:** Requires you to specify *which* shocks break the lock. If you can't name one, this is hand-waving.

  ### 6. The "Name Three Cases" Challenge (Quantitative Economic Historians)
  **The Objection:** "You say replays show convergence. Name three clear cases where a lineage was severed and the *same* outcome-type re-derived independently, with dates."
  *   **Concede:** Clear cases are rarer than the literature implies (which is your point).
  *   **Hold:** That the existing ones are sufficient to shift the burden.
  *   **Reply:** "I will give you two robust ones, not three. One: The independent emergence of bureaucratic census-taking in early modern Europe and Qing China—severed lineages, same functional outcome. Two: The re-derivation of double-entry bookkeeping in Northern Italy and later in Japan post-Meiji, absent direct transfer. I refuse to guess at a third because precision matters more than volume here. The point is not that replays are common, but that where we *do* see them, they show convergence, not divergence."
  *   **Candid Weakness:** **Do not guess a third case.** If you guess and are wrong, you lose credibility. The "I refuse to guess" is stronger than a wrong guess.

  ### 7. The Reform Implication (Comparative-Historical PolSci)
  **The Objection:** "If institutions re-converge on functional solutions, does that mean policy reform is inevitable? Why bother studying politics if the outcome is determined by functional needs?"
  *   **Concede:** Functional needs create pressure, not inevitability.
  *   **Hold:** Politics determines the *cost* of the arrival, not the destination.
  *   **Reply:** "It doesn't mean reform is inevitable; it means it's possible. Strong path dependence says 'don't bother, the system is stuck.' Arrival-time says 'the system will move, but politics decides who pays for the transition.' It makes politics *more* important, not less, because it focuses struggle on the distributional consequences of the transition rather than a futile fight against the functional outcome itself."
  *   **Candid Weakness:** Risks sounding like functionalist determinism ("everything works out eventually").

  ### 8. The Semantic Deflation (Graduate Students)
  **The Objection:** "Isn't this just renaming 'convergence' as 'arrival-time dependence'? What work is the 'path' doing if the destination is fixed?"
  *   **Concede:** The terminology is new.
  *   **Hold:** The 'path' determines the welfare costs and the actors.
  *   **Reply:** "The path determines the casualties. If two countries reach 'industrialization,' but one does it via slavery and the other via peasant savings, the path is the entire moral story. My taxonomy forces us to separate the *what* from the *how*. Standard path dependence conflates them. I want to study the 'how' without assuming the 'what' was the only possibility."
  *   **Candid Weakness:** A bit abstract. Needs a concrete example ready (e.g., British vs. German industrialization).

  ---

  ## Part II: Strategic Advice

  ### 1. The Pre-Emptive Concession (First Minute of Q&A)
  **Say this before taking the first question:**
  "I want to be clear on the stakes before we begin. I am not arguing that history doesn't matter, or that colonial legacies and distributional injustices wash out. They do not. My argument is strictly about the *counterfactual space of institutional forms*. I am conceding the durability of inequality to focus on the malleability of structure. If we conflate the two, we risk assuming that because the *winners* are locked in, the *rules* must be too."
  *   **Why:** This disarms the PolSci/Soc objection (Objection #3) immediately. It shows you are not a naive functionalist.

  ### 2. The Single Reply That Must Land
  **The Topic:** The "Grain of Description" (Objection #2).
  **Why:** If the Philosopher convinces the room that your "outcome-type" is arbitrary, your taxonomy collapses.
  **The Line:** "The grain is not arbitrary if it is tied to the *mechanism of selection*. If the selection pressure is 'fiscal survival,' the outcome-type is 'fiscal capacity,' not 'income tax.' I am asking you to match the outcome description to the causal mechanism, not to intuition."

  ### 3. The Weakest Joint in Your Argument
  **The Vulnerability:** The scarcity of the "Erasure-and-Replay" cases (Objection #1 & #6).
  **Why:** You are building a methodological demand on a dataset that barely exists. If they press you on why we should accept a test that yields almost no data, you could look like you're proposing an impossible standard.
  **Defense:** Be ready to argue that the *current* standard (inferring lock-in from a single trajectory) is *also* data-poor. You are not solving the data problem; you are exposing the lack of data in the prevailing view. "I am not saying my test is easy; I am saying the current claim is untested."

  ### 4. The Question You Hope Nobody Asks
  **The Question:** "Can you name a case where you *expected* convergence based on your theory, but observed divergence instead? Where did your theory fail?"
  **Why:** You have framed the argument around the success of replays. A falsification case would be devastating if you don't have one prepared.
  **Preparation:** Have a "boundary condition" ready.
  **Example:** "Where political coercion overrides functional selection. E.g., A colony forced to adopt a legal code that is functionally maladaptive for its economy. That is not path dependence; that is power. My theory applies where functional selection is allowed to operate."
  **Warning:** Do not guess a specific historical case here unless you are 100% sure of the historiography. Better to define the *condition* (coercion) than name a *country*.

  ### 5. Pocket Cases & Data
  *   **Assert from Memory:**
      *   **Independent Invention of Agriculture:** (Neolithic Near East vs. Mesoamerica). Safe, broad consensus.
      *   **Bureaucratic Census:** (Qing China vs. Early Modern Europe). Good for "outcome-type" (extraction capacity) vs "token" (specific forms).
      *   **Rail Gauges:** (Use cautiously). Good for "strong lock-in" counter-example if you argue they *did* converge eventually or were broken by war. Better to avoid as it's contested.
  *   **Refuse to Guess:**
      *   **Specific Dates of Re-derivation:** Do not say "Japan adopted bookkeeping in 1870." Say "Late 19th Century." Precision invites error.
      *   **Welfare Metrics:** Do not guess GDP convergence rates. Speak qualitatively about "functional capacity."

  ### 6. Final Note on Tone
  The room will test whether you are a **reformer** of the literature or a **destroyer** of it.
  *   If you sound like a destroyer ("Path dependence is wrong"), the Institutional Economists and PolSci scholars will circle the wagons.
  *   If you sound like a reformer ("Path dependence is right, but we are measuring the wrong thing"), you keep them in the tent.
  *   **Key Phrase:** "I am refining the estimand," not "I am rejecting the theory." Use their vocabulary (estimand, identification, equilibrium) to show you are inside the tent, just rearranging the furniture.
