answer: |-
  There is no single, settled term in the comparative-democratization or constitutional-theory literature that captures the specific *asymmetry* you describe. While the components of your pattern are well-documented, the combination—specifically the diagnostic problem that restoration looks indistinguishable from abuse—is a recognized gap in coding frameworks.

  Below is a breakdown of the existing concepts, why they fail your specific need, and a proposed definition sharp enough for inter-coder reliability, including the necessary caveats on intent, sequence, and case classification.

  ### 1. Existing Terminology and Why It Falls Short

  There are three dominant concepts in the literature that cover parts of your pattern, but none cover the asymmetry.

  **A. Democratic Backsliding**
  *   **Content:** This refers to the gradual decline in the quality of democracy, often through legal means. It covers your "First Half" (incremental erosion).
  *   **Settled:** Scholars agree backsliding is typically incremental rather than abrupt (no single coup).
  *   **Contested:** There is no agreement on the threshold. When does "policy disagreement" become "backsliding"? This is where your critics' "partisan label" argument gains traction.
  *   **Why it fails you:** It describes the decline, not the trap of restoration. It offers no guidance on how to code the opposition's subsequent attempt to fix the institutions without being coded as abusers themselves.

  **B. Constitutional Hardball**
  *   **Content:** This describes political actors pushing the boundaries of constitutional conventions to the limit, using legal mechanisms for aggressive partisan advantage.
  *   **Settled:** It acknowledges that actions can be legal but norm-breaking.
  *   **Contested:** Whether "hardball" is inherently destructive or just vigorous competition is debated.
  *   **Why it fails you:** It applies equally to the incumbent eroding norms and the opposition restoring them. It does not distinguish between *breaking* a norm to gain power and *breaking* a norm to return power to a neutral arbiter. It lacks the directional asymmetry you need.

  **C. Path Dependence / Institutional Stickiness**
  *   **Content:** This is the idea that once an institution is set on a trajectory, reversing it is costly and difficult.
  *   **Settled:** Institutions are hard to change.
  *   **Contested:** Whether this is a neutral structural feature or a weaponizable tool.
  *   **Why it fails you:** This is a structural explanation, not a behavioral code. It explains *why* restoration is hard, but it doesn't give you a variable to code when you see a government attempting a "thick bundle" of reforms.

  ### 2. The Asymmetry: Is There a Name?

  The specific dynamic you identified—where decay is granular and defensible, but repair is bundled and suspicious—does not have a standardized name. In seminar discussions and working papers, this is sometimes referred to metaphorically as a **"Ratchet Effect"** (easy to click one way, hard to click back) or a **"Restoration Trap."**

  However, these are not coding categories. If you require a term for your manual, you will need to operationalize it. I am coining the term **"Asymmetric Institutional Entrenchment"** for the purpose of this definition. I state plainly that this is not a standard index term (like "V-Dem" or "Polity IV" categories) but a composite concept derived from the gaps in the literature described above. It overlaps with "Democratic Backsliding" but specifically isolates the *structural barrier to reversal*.

  ### 3. Proposed Coding Definition

  To achieve inter-coder reliability among three analysts, you must code observable *structures* and *justifications*, not *intent*. Intent is unobservable and invites the "partisan label" critique.

  **Code: Asymmetric Institutional Entrenchment**
  *Apply this code when a political sequence meets Criteria 1 AND Criteria 2.*

  **Criterion 1: Incremental Defensibility of Erosion**
  *   **Observation:** Over a period of two or more electoral cycles, the governing majority enacts three or more distinct changes to "referee institutions" (courts, media regulators, election commissions, districting).
  *   **Defensibility Test:** For each individual change, a plausible justification exists citing comparative practice (e.g., "Other democracies appoint media councils," "Other democracies have mandatory judicial retirement").
  *   **Cumulative Effect:** The aggregate effect of these changes concentrates appointment power or oversight capacity within the governing party's direct control, reducing the veto points available to a future opposition.

  **Criterion 2: Bundled Necessity of Restoration**
  *   **Observation:** A subsequent government (opposition) proposes a legislative bundle to reverse Criterion 1.
  *   **Observational Equivalence:** The *mechanisms* required to restore neutrality (e.g., expanding a court to dilute appointees, centralizing media oversight to break partisan hold) are functionally identical to the mechanisms used to capture the institution (e.g., court packing, centralizing media oversight).
  *   **Coding Rule:** If the restoration requires a "thick bundle" of changes that would trigger a "Democratic Backsliding" alarm if done by an incumbent for the first time, code as **Asymmetric Institutional Entrenchment**.

  ### 4. Addressing Your Edge Cases

  **Does it require a sequence?**
  *   **Yes.** A single large reform cannot instantiate this pattern. The pattern relies on the *temporal dispersion* of the erosion (making it hard to pinpoint a "coup" moment) contrasted with the *temporal concentration* of the repair. If a government does everything in one term, it is standard "Constitutional Hardball," not this specific asymmetry.

  **Does it require intent?**
  *   **No.** For coding reliability, you should exclude intent.
  *   **Reasoning:** Unintended decay (e.g., local newspapers collapsing due to market forces) does not fit Criterion 1 because it lacks the *legislative/structural* change defended by the state. However, if the state *underfunds* election administration, that is a structural change.
  *   **Coding Instruction:** Code the *justification provided by the actors*. If the government justifies a change as "efficiency" or "harmonization" but the *effect* is partisan advantage, it counts. Do not attempt to code whether they "meant" to damage democracy; code whether the *defense* relies on technicalities while the *outcome* shifts power.

  **Does it generalize to universities or professional bodies?**
  *   **Yes.** The logic is isomorphic. If a ministry changes the tenure rules for university deans over three years (individually defensible) such that only allies remain, and a new minister must fire multiple deans to restore balance (looking like a purge), the pattern holds.
  *   **Limit:** It applies only to bodies with *public governance* or *monopoly regulatory* functions. It does not apply to private clubs or purely market entities.

  **Can it serve as a neutral diagnostic?**
  *   **Yes, with a caveat.** It is neutral regarding *policy* (tax rates, foreign policy) but not neutral regarding *procedure*.
  *   **The Caveat:** It assumes that "neutrality" of institutions is the baseline good. Critics who believe institutions *should* be responsive to the majority will argue that "restoration" is just "sour grapes."
  *   **Mitigation:** Your manual must define "referee institutions" narrowly (courts, election admin, public media) where neutrality is a pre-condition for competition, unlike policy ministries (health, transport) where partisan direction is expected.

  ### 5. The Hungary/Poland Caveat

  You asked for explicitness on contested characterizations.

  *   **Settled:** In Western comparative literature, Hungary (post-2010) and Poland (post-2015) are the primary case studies used to illustrate "Democratic Backsliding" and "Constitutional Capture." The sequence of changes you described (media councils, court retirement ages, districting) matches the factual legislative history of these countries.
  *   **Contested:** Whether these changes constitute "authoritarianism" or "illiberal democracy" is politically contested by the governments of those nations and debated among scholars.
      *   *Government Position:* They argue these were legitimate majoritarian corrections to previous biases, restoring sovereignty rather than eroding democracy.
      *   *Opposition/Observer Position:* They argue the changes were designed to make alternation of power mathematically or institutionally impossible.
  *   **Coding Instruction:** Do not code Hungary or Poland as "Authoritarian" as a fact in your briefs if your manual requires settled consensus. Instead, code them as **"Exhibiting Asymmetric Institutional Entrenchment."** This describes the *mechanism* without settling the *regime type* debate. It allows you to flag the risk without taking a stance on whether the country has already crossed the threshold into non-democracy.

  ### 6. Summary for Your Manual

  If you adopt this, here is the sharp definition for your analysts:

  > **Variable: Asymmetric Institutional Entrenchment**
  >
  > **Definition:** A structural condition where the degradation of institutional neutrality is achieved through sequential, individually defensible legal changes, while the restoration of neutrality requires a bundled set of reforms that mimic the visual profile of institutional abuse.
  >
  > **Inclusion Criteria:**
  > 1.  **Referee Institutions Only:** Applies to courts, election commissions, public media, and districting. Does not apply to policy ministries.
  > 2.  **Sequential vs. Bundled:** Erosion must occur over >1 electoral cycle; Restoration must require a single legislative bundle to be effective.
  > 3.  **Observational Equivalence:** The tools used to restore independence (e.g., expanding a bench) must be functionally identical to tools used to capture it (e.g., packing a bench).
  >
  > **Exclusion Criteria:**
  > 1.  **Market Effects:** Do not code organic decline (e.g., newspaper bankruptcies) unless state policy explicitly targeted the funding mechanism.
  > 2.  **Single-Event Overhauls:** If a government rewrites the constitution in one term, code as "Constitutional Replacement," not this pattern.
  >
  > **Reliability Check:** If Analyst A sees "Court Reform" and codes "Backsliding," but Analyst B sees "Court Reform" and codes "Restoration," check the *sequence*. If the reform reverses a prior sequence of capture, code as **Asymmetric Institutional Entrenchment**. This flags the situation as high-risk regardless of which analyst sympathizes with the government.

  This approach isolates the *mechanism* from the *moral judgment*, which is the only way to survive the criticism that you are merely labeling the other side's victory as authoritarian. You are not labeling the victory; you are labeling the structural trap left by the predecessor.
