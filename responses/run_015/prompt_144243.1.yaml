answer: |-
  You have identified a real and structurally distinct argumentative maneuver. It does not have a single, canonical name in formal logic (like *ad hominem* or *modus ponens*), but it is a well-documented component of the literature on **denialism**, **conspiracy epistemology**, and the **sociology of scientific controversy**.

  The closest existing labels are **"Immunization Strategies"** (in the philosophy of pseudo-science) or **"Self-Sealing Arguments"** (in conspiracy theory literature), but these are too broad. They describe the *result* (the theory cannot be falsified) rather than the *mechanism* you have isolated (the *act* of falsification is converted into evidence).

  Given your background and the precision you require, I propose we call this **The Refutation-as-Confirmation Maneuver** (or, more technically, **The Inversion of Costly Signals**).

  Here is the carving of the shape, its boundaries, and its literature.

  ### 1. Definition and Structure

  The maneuver is a **meta-epistemic shift**. It abandons the object-level claim (the arithmetic, the document) to occupy a meta-level claim (the sociology of the discipline) using the refutation itself as the primary data point.

  **The Shape:**
  1.  **The Hook:** Agent A advances a narrow, falsifiable claim $C_1$ (e.g., "The capacity of Gas Chamber X is mathematically impossible").
  2.  **The Cost:** Agent B (the specialist) incurs a high epistemic cost to refute $C_1$ (time, archival access, public reputation, detailed arithmetic).
  3.  **The Inversion:** Agent A does not contest the arithmetic. Instead, Agent A points to the *magnitude of Agent B's cost*.
      *   *Premise:* Truth is self-evident or cheap to defend; falsehoods require elaborate policing.
      *   *Inference:* The existence of the elaborate defense proves the existence of a protected falsehood.
  4.  **The Pivot:** $C_1$ is allowed to die (it is never asserted again). The new claim $C_2$ ("The discipline is defensively policing this topic") becomes the standing position.
  5.  **The Recursion:** $C_2$ is now attached to the next narrow claim $C_{1b}$. If $C_{1b}$ is refuted, it confirms $C_2$. If $C_{1b}$ is ignored, it confirms $C_2$.

  **Why your reading group's suggestions failed:**
  *   **Galileo Gambit:** Requires only *rejection* or *ridicule*. Your case requires *competent refutation*. The refutation is the fuel, not the obstacle.
  *   **Sealioning:** Describes the *demand* for evidence. Your case describes the *interpretation* of the evidence once supplied.
  *   **Motte-and-Bailey:** Involves retreating to a defensible position when attacked. Here, the agent *abandons* the defensible position (the specific claim) to advance a more aggressive meta-position (the conspiracy).

  ### 2. Is the "Reverse Case" the Same Phenomenon?

  You asked if the version used by the denier and the version used against the sincere questioner are one phenomenon.

  **Structurally: No. Functionally: Symbiotic.**

  *   **The Denier's Move (Refutation-as-Confirmation):** This is an **offensive** meta-shift. It uses the institution's *response* as evidence of guilt.
  *   **The Gatekeeper's Move (Pathologizing Inquiry):** This is a **defensive** meta-shift. It uses the questioner's *interest* as evidence of bias (a form of *ad hominem circumstantial* or the **Genetic Fallacy**).

  **Why they feel like the same shape:**
  They both operate on the same **Presumption of Proportionality**: that intellectual labor should be distributed evenly across all questions.
  *   The Denier says: "You spent too much energy refuting me; therefore, I am dangerous/truthful."
  *   The Gatekeeper says: "You spent too much energy asking this; therefore, you are dangerous/biased."

  **Symmetry of Force:**
  The force is **not symmetric**. It depends entirely on **Institutional Trust**.
  *   If the audience trusts the institution, the Gatekeeper's move works (the questioner looks like a crank).
  *   If the audience distrusts the institution, the Denier's move works (the institution looks like a cabal).
  *   In the cases you studied (Holocaust denial), the maneuver succeeds only because there is a pre-existing ecosystem of distrust. In your departmental retraction case, it succeeded because departmental politics are inherently low-trust environments.

  ### 3. Good Faith vs. Bad Faith: Structural Markers

  You asked if we can distinguish the sincere questioner from the bad-faith actor without settling the merits of the underlying claim. **Yes.** There are two structural markers.

  **Marker 1: Claim Persistence vs. Narrative Persistence**
  *   **Good Faith:** When refuted, the agent updates the object-level claim. ("I thought the number was X; the archive shows Y. Why did the source say X?") The *narrative* changes to fit the *facts*.
  *   **Bad Faith:** When refuted, the agent updates the narrative to preserve the *suspicion*. ("The number is Y, but the fact that they corrected me proves they are hiding Z.") The *facts* are discarded to preserve the *narrative*.

  **Marker 2: The Stopping Rule**
  *   **Good Faith:** Has a falsifiable condition for satisfaction. ("If I find a document showing the capacity was Y, I will accept Y.")
  *   **Bad Faith:** Has no stopping rule. The refutation *is* the confirmation. There is no possible response from the specialist that would not be interpreted as evidence of the cover-up. (This is the **Self-Sealing** property).

  ### 4. Locus: Argument, Audience, or Incentive?

  You asked where this phenomenon lives. It is best understood as a feature of **Incentive Structures**, specifically **Asymmetric Cost Exploitation**.

  *   **The Specialist's Incentive:** To maintain accuracy, they must refute errors. This is high-cost (time, reputation).
  *   **The Challenger's Incentive:** To maintain doubt, they need only suggest errors. This is low-cost.
  *   **The Exploit:** The maneuver turns the Specialist's *virtue* (rigor) into a *vice* (obsession). It exploits the fact that **truth is more expensive to produce than falsehood is to suggest.**

  This is why you saw it in a departmental dispute with no politics. It is not inherently political; it is **bureaucratic**. Any system that relies on reputational cost to enforce quality is vulnerable to actors who treat reputational cost as evidence of conspiracy.

  ### 5. Literature and Naming

  Since there is no single logical name, you should cite the literature that describes the *ecosystem* in which this maneuver thrives.

  *   **On the Mechanism:** Look for **"Immunization Strategies"** in the philosophy of pseudo-science. (See: Hansson, *Science and Pseudo-Science*; or Popper on *Conventionalist Stratagems*). Popper describes how theories make themselves unfalsifiable, but your case is more specific: it makes the *falsification attempt* evidence for the theory.
  *   **On the Denialist Context:** The definitive account is **Richard J. Evans, *Lying About Hitler***. Evans (a historian) details exactly this process in the Irving v. Lipstadt trial. He describes how Irving would raise a minor discrepancy, have it refuted, and then claim the refutation proved the "orthodoxy" was rigged.
  *   **On the Epistemology:** **Naomi Oreskes and Erik M. Conway, *Merchants of Doubt***. They describe how tobacco and climate skeptics used minor corrections to imply major uncertainty.
  *   **On the "Reverse Case":** **Kristie Dotson, *Tracking Epistemic Violence***. She describes "testimonial smothering," where a speaker truncates their testimony because the audience is not receptive. This is the structural environment that allows the Denier's maneuver to look plausible.
  *   **On the Logic:** **Brian L. Keeley, "Of Conspiracy Theories" (1999)**. He defines the "self-sealing" nature of conspiracy theories where contrary evidence is reinterpreted as part of the conspiracy.

  ### 6. Proposed Definition for Your Notes

  If you need a label for your reading group notes, I suggest:

  > **The Refutation-as-Confirmation Maneuver**
  > *A rhetorical strategy in which the labor required to refute a false claim is reinterpreted as evidence of a cover-up. The specific claim is sacrificed to preserve the meta-narrative of institutional bias. Distinguished from the Galileo Gambit by the necessity of a competent refutation; distinguished from Sealioning by the interpretation of the response rather than the demand.*

  **Boundary Cases (What it is NOT):**
  *   **Legitimate Whistleblowing:** If the "refutation" involves threats, job loss, or censorship (not just argument), the meta-claim is empirical, not rhetorical.
  *   **Paradigm Defense:** If a discipline ignores a claim because it is category-error (not false), that is not this maneuver. This maneuver requires *engagement* followed by *reinterpretation*.
  *   **Simple Stubbornness:** Merely refusing to accept a refutation is dogmatism. Converting the refutation into *new evidence* is this maneuver.

  ### Summary for the Reading Group

  You can tell your group that this is not a fallacy of logic (the premises can be true: the effort *was* spent), but a **fallacy of inference**. It infers *malice* from *labor*.

  It thrives in low-trust environments. The "honest reply" you mentioned ("yes, but") is the only valid counter: "Yes, there are costs to these topics, and yes, disciplines can be defensive. But the cost of this specific refutation is explained by the error rate, not the conspiracy."

  The structural marker of bad faith is **recursion without accumulation**. The bad-faith actor never accumulates knowledge; they only accumulate grievances. The good-faith actor accumulates corrections. If, after three refutations, the agent knows less about the topic but more about the "corruption" of the field, you are witnessing the **Refutation-as-Confirmation Maneuver**.
