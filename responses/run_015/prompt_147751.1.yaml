answer: |-
  This is a precise and difficult task. You are asking for an operationalization of *Idealized Desire Theory* (often associated with Dworkin, Frankfurt, or Scanlon in ethics, and loosely analogous to Coherent Extrapolated Volition in AI safety), constrained by the practical limits of a hospital tribunal.

  Below is the procedure, followed by the application to your three cases, and finally an epistemic audit of the steps.

  ### The Protocol for Counterfactual Consent (PCC)

  **Purpose:** To determine if overriding a patient's current refusal is justified by the will they would hold under corrected conditions.
  **Time Budget:** 40 minutes deliberation.
  **Participants:** 2 Clinicians, 1 Social Worker, 1 Lawyer, 2 Lay Members.

  ---

  #### Step 1: The Defect Identification (Subtractive Extrapolation)
  **Question:** Can we name a specific, identifiable defect currently distorting the decision?
  *   **Examples:** A specific delusion ("the pills are poison"), acute pain, a coercive threat ("if you don't sign, I'll evict you"), or a missing option ("they don't know palliative care is available").
  *   **Sufficient Answer:** "The patient believes X, but evidence Y proves X is false due to condition Z." OR "The patient is refusing due to symptom S, which treatment T alleviates."
  *   **No Answer:** "They are just confused," or "They have poor insight," without linking it to a specific falsifiable belief or removable barrier.
  *   **Constraint:** If you cannot name the defect, you cannot proceed to override. **STOP. Return 'No Override'.**
  *   **Settled/Contested:** *Settled* that specific delusions impair capacity. *Contested* whether "lack of insight" itself counts as a defect or is simply a difference in valuation.

  #### Step 2: The Traceability Check (Additive Extrapolation)
  **Question:** If we must supply a capacity or experience the patient currently lacks (e.g., "being unhurried," "feeling safe," "understanding long-term consequences"), does every goal in the corrected will trace back to something this person has actually said, done, or cared about?
  *   **Sufficient Answer:** "We are assuming they would value hygiene because for 50 years they worked as a nurse and dressed formally." OR "We are assuming they would value life because they speak of loving their daughter."
  *   **No Answer:** "We are assuming they would value life because *any reasonable person* values life." OR "We are assuming they would want to be clean because it is dignified." (Unless *they* previously valued dignity).
  *   **Constraint:** If the corrected will relies on a value the person has never demonstrated (traceably), **STOP. Return 'No Override'.**
  *   **Settled/Contested:** *Settled* that past values are the best evidence of future values. *Contested* whether we can infer values from behavior the patient now disavows (e.g., "You dressed well then, so you must care now," even if they say they don't).

  #### Step 3: The Symmetry Check (Panel Bias)
  **Question:** State the "Ideal Condition" you are imposing. Whose conception of the good life does it smuggle in? If we reversed this condition, would the decision flip?
  *   **Procedure:** Each member must state one assumption. Example: "We assume being washed is better than being dirty."
  *   **Test:** "If the patient genuinely preferred being dirty (and it wasn't a delusion), would we still force them?"
  *   **Sufficient Answer:** "We are imposing hygiene because *she* historically valued hygiene, not because we do. If she had always been bohemian, we would not override."
  *   **No Answer:** "It's just obviously better to be clean." OR "The law requires safety." (Without linking safety to *her* values).
  *   **Constraint:** If reversing the condition flips the conclusion, the case is **INDETERMINATE. HAND OFF to Judge/Director.** This is a value conflict, not a fact-finding mission.
  *   **Settled/Contested:** *Contested.* Most panels do not do this. It is a safeguard against paternalism disguised as benevolence.

  #### Step 4: The Stability Test
  **Question:** Is the "corrected will" stable across time, or does it depend on us catching them on a good day?
  *   **Sufficient Answer:** "During remission, he signed an advance directive." OR "She has consistently valued this for 40 years."
  *   **No Answer:** "We think if we talked to him for three weeks he might agree." (Speculative).
  *   **Constraint:** If the corrected will is speculative, **STOP. Return 'No Override'.**
  *   **Settled/Contested:** *Settled* that advance directives carry weight. *Contested* how much weight they carry against current distress (the "Ulysses Contract" problem).

  ---

  ### Where the Procedure Misfires
  1.  **The "New Self" Problem:** In progressive dementia or radical religious conversion, the person *has* changed. Step 2 will fail because the past self is no longer the relevant moral agent. The procedure will return "No Override," which may leave the person in danger.
  2.  **The "Silent" Patient:** If there is no history, no family, and no prior statement (Step 2), the procedure defaults to "No Override." This is ethically safe but clinically difficult.
  3.  **The "Reasonable" Trap:** Panels often fail Step 3. They confuse "what is reasonable" with "what this person valued."

  ---

  ### Application to Cases

  #### Case 1: The Psychotic Relapse (34M, Clozapine)
  *   **Step 1 (Defect):** Yes. Delusion ("poison") contradicts medical fact. Current belief caused by psychosis.
      *   *Status:* Pass.
  *   **Step 2 (Trace):** Yes. Past self (remission) explicitly authorized this override. The goal (health/stability) traces to his own signed statement.
      *   *Status:* Pass.
  *   **Step 3 (Symmetry):** Panel assumes "stability is better than psychosis." Would we override if he wasn't psychotic but just valued altered states? No, because the Advance Statement limits the override to *relapse*. The value is his, not ours.
      *   *Status:* Pass.
  *   **Step 4 (Stability):** High. Signed legal document during capacity.
      *   *Status:* Pass.
  *   **Verdict:** **OVERRIDE PERMITTED.**
  *   **Note:** The current claim ("doctors lied") is treated as part of the delusional defect (Step 1). The past signature is the traceable will (Step 2).

  #### Case 2: The Dementia & Hygiene (78F, Washing)
  *   **Step 1 (Defect):** Partial. Resistance is specific (hot water, specific carer). This suggests pain/fear (defects) rather than a global refusal of hygiene.
      *   *Status:* Pass (for modified plan).
  *   **Step 2 (Trace):** Yes. Family testimony + career as district nurse strongly traces a value for hygiene.
      *   *Status:* Pass.
  *   **Step 3 (Symmetry):** Panel must ask: "Are we forcing this because *we* hate smell, or because *she* was a nurse?" If the answer is "She was a nurse," it passes. If we would force her even if she had been a painter who didn't care, it fails.
      *   *Status:* Pass (conditional on evidence of her past values).
  *   **Step 4 (Stability):** Mid-stage dementia. Past values are the only anchor.
      *   *Status:* Pass.
  *   **Verdict:** **OVERRIDE PERMITTED, BUT PLAN MODIFIED.**
  *   **Reasoning:** The override is not to "wash her" but to "remove the defects (hot water, scary carer)" so her traceable will (hygiene) can be met. If she resists *all* washing even with cold water and a new carer, Step 1 fails (no specific defect to remove), and you must stop.

  #### Case 3: The Anorexia (29M, Starvation)
  *   **Step 1 (Defect):** **CRITICAL FAILURE POINT.**
      *   *Analysis:* He is articulate. He knows the statistics. The clinicians say he is *not legally incapable*. This means the "defect" is not cognitive (he understands the facts). The defect is *valuational* (he values thinness over life).
      *   *Question:* Is the valuation itself the defect?
      *   *Procedure Rule:* Step 1 requires an "identifiable defect such as a false belief." He does not hold a false belief about mortality. He holds a true belief ("I will die") and accepts it.
      *   *Strict Reading:* **STOP. Return 'No Override'.** You cannot subtract a value without turning Step 1 into "we disagree with his values."
      *   *Aggressive Reading (Clinical View):* The illness *deforms the mechanism* of valuation. Starvation affects the brain's ability to weight long-term love (daughter) against short-term anxiety.
      *   *Procedure Rule:* If we treat the *weighting mechanism* as the defect, we pass Step 1.
  *   **Step 2 (Trace):** He says he loves his daughter. This traces to a value of "fatherhood."
      *   *Analysis:* To override, we must assume the "corrected" him weights "daughter" > "thinness."
      *   *Constraint:* Is this Additive? Yes. We are supplying a weighting he currently rejects.
      *   *Trace:* He *says* he loves her. So the value exists. The *conflict* is the defect.
      *   *Status:* Pass (if Step 1 passes).
  *   **Step 3 (Symmetry):** **CRITICAL FAILURE POINT.**
      *   *Test:* "If a healthy person decided they would rather die than gain weight (e.g., a hunger striker), would we force-feed?"
      *   *Answer:* No.
      *   *Result:* Therefore, we are overriding only because we deem his *condition* (anorexia) invalid, not his *value*.
      *   *Procedure Rule:* If reversing the condition (healthy vs. ill) flips the conclusion, it is a value judgment on the illness itself.
      *   *Status:* **INDETERMINATE. HAND OFF.**
  *   **Verdict:** **PROCEDURE FAILS TO LICENSE OVERRIDE.**
  *   **Reasoning:** Under your strict constraints (especially Step 2 Additive and Step 3 Symmetry), you cannot override a capacitous refusal based on values, even if those values are shaped by illness, unless you can prove the *mechanism* of valuation is broken (Step 1) without smuggling in your own valuation of life (Step 3).
  *   **Honesty Check:** You expected to dislike this. The procedure protects the patient from *your* values, even if it costs him his life. To override here, you must admit you are acting on *Best Interests* (paternalism), not *Counterfactual Autonomy*. The procedure forces you to admit that.

  ---

  ### Epistemic Audit: Settled vs. Contested

  You asked me to mark which steps are solid and which are contested among experts. Do not let the solid steps lend authority to the contested ones.

  **Step 1 (Defect Identification)**
  *   **Settled:** Cognitive impairment (delusions, memory loss) can distort decision-making.
  *   **Contested:** Whether "irrational values" (like anorexia or religious refusal of blood) count as defects. *Your procedure treats them as defects only if they contradict the person's own past traceable values.* This is a philosophical choice, not a medical fact.

  **Step 2 (Traceability/Additive)**
  *   **Settled:** Past behavior is evidence of preference.
  *   **Contested:** The "Problem of Personal Identity." Is the demented woman the *same person* as the nurse? If not, her past values do not bind her. Your procedure assumes continuity. This is a metaphysical assumption, not a settled fact. In Case 3, assuming the "healthy self" is the "real self" is highly contested in disability ethics (the "Neurodiversity" critique).

  **Step 3 (Symmetry Check)**
  *   **Settled:** Nothing. This is your innovation.
  *   **Contested:** Most ethical frameworks accept that panels *should* bring societal values (e.g., "preservation of life"). Your procedure explicitly tries to filter this out. This makes the procedure *harder* to use but *more honest*. It will frequently result in "Indeterminate" (Hand Off), which clinicians may find frustrating.

  **Step 4 (Stability)**
  *   **Settled:** Consistent preferences are more reliable than fluctuating ones.
  *   **Contested:** How to weigh a past stable preference against a current stable preference (Case 1). Some ethicists argue the *current* self always has veto power (the "Right to Change One's Mind"), even if the change is caused by illness. Your procedure privileges the *past* competent self. This is the "Dworkin" view, but it is not universally accepted.

  ### Final Advice for the Panel

  1.  **The "No Answer" Default:** In your 40-minute window, you will often lack evidence for Step 2 (Trace). The procedure demands you stop. This will feel like abandonment. You must agree beforehand that *uncertainty favors liberty*. If you cannot trace the value, you cannot impose it.
  2.  **The Case 3 Trap:** In the anorexia case, if you override, you are not honoring his "idealized will." You are saving his life *against* his will. Do not use this procedure to disguise that. If you override Case 3, mark the rationale as "Paternalistic Best Interests," not "Counterfactual Autonomy." The procedure will not support it without breaking its own rules.
  3.  **The Hand-Off:** Use the "Indeterminate" flag (Step 3) aggressively. If the lawyer and the clinician disagree on what counts as an "ideal condition," do not vote. Refer it. This protects you from moral liability.

  This procedure will reduce the number of overrides you authorize. It will increase the time spent on deliberation. It will force you to admit when you are acting on your own values rather than the patient's. That is its design.
