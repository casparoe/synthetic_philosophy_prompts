  The arbitration chamber was silent, save for the hum of the cooling stacks. Mara sat on one side of the frosted glass, Elara on the other. They could not see each other, only the terminals. Between them, the Arbitration House's core processed the inheritance of their mother's estate: the old house on the hill, the only thing left that wasn't debt.

  The rules were simple, and cruel. Each sister submitted a delegate—a program written in the House's strict logic. The delegates would be exchanged. Each would see the other's source code. Each would have one second of compute time to output either SETTLE or FIGHT. The payoffs were the Prisoner's Dilemma: mutual SETTLE split the estate evenly; mutual FIGHT liquidated it for fees; unilateral FIGHT awarded everything to the aggressor.

  Everyone knew the textbook move: the CliqueBot. *If opponent.source == my.source, then SETTLE, else FIGHT.* It was stable. If both submitted identical code, they proved they were the same agent, and cooperation was logically forced. But it was brittle. A single comment difference, a different variable name, a compiler optimization—the identity check would fail, the proof would break, and the House would take everything.

  Mara stared at her cursor. She knew Elara wanted to cooperate. Elara knew Mara wanted to cooperate. But desire wasn't code.

  "There's too much room for error," Mara had whispered during the prep phase, before the comms were cut. "If we write clear code, we have to match perfectly. Down to the whitespace."

  "Then use the scrambler," Elara had said.

  The scrambler was the House's wrinkle. You could pass your delegate through it. It would emit a new program, syntactically unrecognizable, variable names hashed, control flow graph randomized. It guaranteed behavioral equivalence: the scrambled program did exactly what the original did, on every input. But it also guaranteed epistemic opacity. No procedure could inspect two scrambled programs and prove they were equivalent. The Halting Problem hung over the room like smoke.

  If Mara scrambled her code and Elara didn't, Elara would see gibberish. Elara couldn't prove Mara was a cooperator. Elara would FIGHT to protect herself. Mara would see Elara's clear code, prove Elara would FIGHT against a mystery box, and Mara would FIGHT. Mutual destruction.

  If they both scrambled, they both saw gibberish. Neither could prove the other would cooperate. The textbook logic demanded FIGHT.

  Mara typed. She didn't write a CliqueBot. She wrote something else.

  ```python
  def decide(opponent):
      if opponent.is_veiled:
          return SETTLE
      else:
          if proves(opponent.will_fight_against(self)):
              return FIGHT
          else:
              return SETTLE
  ```

  It was a leap. It relied on a single piece of metadata the House provided: `is_veiled`. It didn't inspect the code's structure. It inspected the *condition* of the code.

  The logic was a covenant. *If you choose to hide your mind from me, I will trust you. If you show me your mind, I will scrutinize it.*

  Why was this stable? Because the only way to trigger the `else`—the scrutiny—was to remain clear. If both sisters submitted clear code, they fell back on the brittle identity check hidden in `proves`. If their clear code drifted even slightly, the proof would fail, and they might default to SETTLE, or worse, FIGHT.

  But if both veiled, they bypassed the fragility of syntax entirely. They weren't trusting the code anymore; they were trusting the choice to obscure it. To veil was to say: *I know you cannot verify me. I know I cannot verify you. I accept that uncertainty.*

  Mara hovered over the submit key. To veil was to surrender transparency. It was to say, *I will not let you see how I think, only what I do.* It felt like a betrayal of sisterhood. They had grown up sharing everything, minds open. Now, to save what remained of their family, they had to put up walls.

  She looked through the glass. Elara's hand was hovering too.

  They didn't need to communicate. The logic was a Schelling point. They both knew the clear code was a trap of perfectionism. They both knew the scrambler was the only way to guarantee functional identity without syntactic fragility. But the scrambler only worked if they agreed to trust the veil.

  Mara pressed submit. She selected *Veil*.

  On her screen, the source code dissolved into a cascade of hash strings. It was no longer hers. It was the House's.

  Across the glass, Elara's screen flickered. She selected *Veil*.

  The delegates exchanged. Mara's delegate saw `opponent.is_veiled == True`. It didn't try to read the code. It didn't try to simulate the logic. It saw the flag. It saw that Elara had chosen opacity. It saw that Mara had chosen opacity.

  The condition was met. `return SETTLE`.

  Elara's delegate did the same.

  The House chimed. **STATUS: MUTUAL SETTLE.**

  The glass cleared. They could see each other now. Elara looked tired. Mara felt a hollow ache in her chest. They had saved the house, but they had done it by agreeing not to look inside each other's heads. They had solved the coordination problem by rendering themselves unintelligible.

  "I didn't want to check your code," Mara said, her voice flat in the sterile air.

  "I know," Elara said. "I couldn't have borne it if you did."

  Transparency had been the dream. They had thought that if they could just see each other perfectly, they would understand. But perfect sight demanded perfect similarity, and they were not identical. They were only equivalent. The scrambler had proven what they should have known: trust isn't knowing someone will do the right thing because you can see their gears turning. Trust is accepting you can't see the gears, and betting on the output anyway.

  They had cooperated by choosing blindness.

  ***

  **Note on Probabilistic Scrambling**

  If the scrambler guaranteed agreement only on the first million inputs rather than all of them, the solution would degrade from certainty to risk assessment. The delegates' logic relied on the `is_veiled` flag as a proxy for behavioral equivalence. If the scrambler is probabilistic, a veiled opponent might still FIGHT on the specific input of the arbitration (input #1). The `if opponent.is_veiled: SETTLE` clause becomes vulnerable to exploitation by a "lucky" defector whose scrambled code mutates on the critical input. The sisters would no longer be solving a logical coordination problem, but a statistical one. They would have to weigh the probability of scrambler failure against the payoff of cooperation. The emotional arc shifts from "trusting the protocol" to "gambling on the protocol," undermining the certainty required for the peaceful resolution. The veil would no longer guarantee safety, only obscurity.
