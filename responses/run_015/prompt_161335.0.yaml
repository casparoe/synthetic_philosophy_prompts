          *   Contribution to the philosophical debate: Can role ethics criticize a corrupt role from within, or is it limited to conformity/loyal remonstrance?

  2.  **Initial Brainstorming & Mapping:**

      *   *Confucian Role Ethics:* Focus on Ames, Hall, Rosemont. The self is constituted by relationships. Morality is contextual, not universalist. *Xiao* (filial piety) is central. *Li* (ritual/propriety) structures interactions.
      *   *The Godfather:* Michael starts outside the "Family" business (Marine, college, Kay). He is pulled in by an attack on his father (Vito). He kills Sollozzo/McCluskey (restaurant). He exiles to Sicily (learns tradition). He returns, takes over, purges enemies during baptism. He lies to Kay, shuts the door.
      *   *The Distinction:*
