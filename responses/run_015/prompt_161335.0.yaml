      *   *Tension:* Confucianism usually assumes the roles are morally conducive (Father should be fatherly, Son should be filial). The Corleone "Family" is a criminal organization. Does Confucianism care about the *content* of the role or just the *performance*?
      *   *Michael's Arc:* Is it tragic (loss of soul) or successful (becoming the Don)? The film treats it as a tragedy (Kay shut out). Confucianism might view it as successful cultivation *if* the role is valid, but problematic *if* the role violates broader relational harmony.

  3.  **Drafting the Analysis - Section by Section:**

