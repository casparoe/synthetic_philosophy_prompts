          *   *Firm vs. Household:* Confucianism relies on the family as the seed of moral sentiment (ren). The Corleone "Family" instrumentalizes kinship. Fredo is betrayed. Kay is excluded. This violates the *spirit* of Confucian family (harmony, care), even if it keeps the *structure*.
