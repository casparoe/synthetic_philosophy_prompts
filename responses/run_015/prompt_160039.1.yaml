  3.  **Address the "Non-Clean Rewrite" Objection:**

      *   *Objection:* ReLU/GeLU and LayerNorm break exact linear invariance. $f(Rx) \neq R f(x)$. So there *is* a privileged basis (the one the network was trained in).
      *   *Counter-argument:* While exact symmetry is broken, *approximate* symmetry remains. The "privileged" basis is often just a local optimum in a rugged loss landscape shaped by initialization noise, not semantic necessity. Furthermore, SAEs introduce *their own* non-uniqueness. Even if the network has a fixed basis, the *decomposition* of that basis into human-interpretable features is not unique. The argument shifts from "network basis is arbitrary" to "feature decomposition is arbitrary."
      *   *Refinement:* The user wants to argue that non-uniqueness goes *all the way up*. So, even if the raw neuron basis is fixed by ReLU, the *semantic* basis (SAE features) is not. The "content" isn't the feature, it's the subspace or the manifold structure.

  4.  **Address Falsification Conditions (What would change my mind?):**

      *   Need a result that shows a specific decomposition is *necessary* for the function, not just convenient.
      *   Maybe causal interventions? If ablating "Feature A" breaks "Function B" reliably across architectures/tasks, that suggests reality.
