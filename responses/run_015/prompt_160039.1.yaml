      *   Better falsification: If we find a "natural" basis that emerges *without* sparsity penalties or human priors, solely from the dynamics of learning. (Though one could argue the optimizer imposes priors).
      *   Strongest falsification: If specific directions are robust to *adversarial basis rotations* that preserve function. If you rotate the space and performance tanks despite retraining the readout, then the original basis was special.

  5.  **Address Generalizability (Transformers vs. ConvNets):**

      *   Does this apply to ConvNets? Yes. ConvNets also have channel dimensions that can be mixed. Pooling introduces some invariance, but linear mixes of channels are still largely possible before nonlinearity.
      *   The core issue is the distinction between *format* (the vector space) and *interpretation* (the basis). This applies to any distributed representation.

  6.  **Identify the "Soft Spot" (Most likely to break):**

      *   The claim that content is *only* determinate up to linear transformation.
      *   Why it might break: Nonlinearities (ReLU) *do* select a specific orthant. You can't rotate a ReLU network arbitrarily without changing the function. The "dead neurons" and activation patterns fix the basis more than the argument admits.
