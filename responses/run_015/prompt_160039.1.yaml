      *   **Task:** Argue *for* a specific position: Non-uniqueness goes all the way up. Sparse Autoencoders (SAEs) and dictionary learning don't reveal "the" representational contents because there are indefinitely many dictionaries fitting activations equally well, selected by methodological choices (sparsity, etc.). Realism must locate content at a higher level (similarity structure, maps, distinctions available to downstream computation), meaning content is determinate only up to linear transformation.
      *   **Constraints:**
