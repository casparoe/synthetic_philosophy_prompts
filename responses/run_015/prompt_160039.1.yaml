  2.  **Deconstruct the Argument to be Steelmanned:**

      *   *Premise 1:* Internal states are only meaningful relative to how they are used by downstream computation.
      *   *Premise 2:* Linear transformations (basis changes) preserve the functional relationships between layers (mostly), even if nonlinearities complicate exact invariance.
