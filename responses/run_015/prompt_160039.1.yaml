      *   *Refining the "Content up to Linear Transformation":* This is the tricky philosophical bit. If content is only determinate up to linear transform, is it content? Yes, if we adopt a structural realist view. The relationships matter, not the relata.

      *   *Refining the Soft Spot:* The ReLU objection is the strongest. The patch is to move from linear invariance to *functional equivalence classes*.

  8.  **Final Polish:** Check against constraints.
