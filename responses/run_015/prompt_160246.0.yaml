prompt: |-
  I'm a PhD student in machine learning and I run a fortnightly AI safety reading group — about sixteen people, mostly ML PhD students with a few philosophers, ninety minutes a session. Next week we are doing the debate proposal (two debaters, incentivised to disagree, a judge who picks a winner), and I want the group to feel the obfuscated-arguments worry rather than nod at it. Design a runnable game for that session.

  The mechanic I have in mind, which you should develop or replace if you have something better: each debater must present their case as a numbered chain of steps laid out in whatever order they choose, and is allowed to make claims about what their opponent would be forced to concede if the judge opened a given step. The judge gets a fixed budget — say at most two levels of nested sub-debate and five minutes in total — and any step not opened stands as conceded. One debater is privately handed the true answer to a question whose answer is determinate but expensive to verify (a question about a two-page handout everyone has in front of them, or a conditional-probability puzzle); the other is handed a false answer and coached to place the false step as deep in the chain as they can, keeping every other step impeccable and the whole thing well-formed. Scoring is tokens on a visible scoreboard, no money; the losing side writes up the session notes. If it helps, add a second round in which the judge may require any step to be split into two smaller steps at the debater's own cost, so we can see whether that rescues honesty or merely relocates it.

  What they should come away seeing: that the failure is not that truth is hard to state but that locating one bad step inside an otherwise clean argument can cost as much as answering the original question, so the binding constraint is the judge's budget and competence rather than the debaters' honesty.

  Give me the full rules and materials, the debrief mapping specific moments onto the parts of the objection, an honest list of what will predictably go wrong the first time I run it (I expect at least judging by style, and someone in the room who knows the answer and leaks it) with how to handle each, and a frank note on what the game cannot reproduce — I take it the main gap is that in the real proposal the debaters are far more capable than the judge while here everyone is human, so the exercise shows that obfuscation is possible but not what happens as the debaters scale.
reasoning: |-
  Here's a thinking process that leads to the suggested game design:

  1.  **Analyze the Request:**
      *   **Target Audience:** PhD students in ML (mostly) + some philosophers. High technical literacy, familiar with AI safety concepts (specifically Debate).
      *   **Goal:** Make the group *feel* the "obfuscated-arguments worry" in AI Safety Debate, not just understand it intellectually.
      *   **Core Mechanic:** Debaters present numbered chains of reasoning. Judge has a limited budget (time/depth) to challenge steps. Unchallenged steps are conceded. One debater knows the truth; the other lies but hides the lie deep in the chain.
      *   **Desired Takeaway:** The bottleneck is the judge's budget/competence, not the debaters' honesty. Locating a lie is as hard as solving the problem.
      *   **Deliverables:** Full rules, materials, debrief mapping, predicted failure modes + mitigations, limitations of the simulation.

  2.  **Evaluate the Proposed Mechanic:**
      *   *Strengths:* Directly models the "tree of arguments" structure of Debate. The budget constraint is key. Hiding the lie deep mimics obfuscation.
      *   *Weaknesses:* If the problem is too easy, the judge finds the lie immediately. If too hard, the judge gives up. The "conditional probability puzzle" might be too abstract. A "two-page handout" fact-checking task is better for a 90-minute session because verification is *possible* but *tedious*.
      *   *Refinement:* The "splitting steps" mechanic is excellent for showing how obfuscation survives refinement. I should keep that.
      *   *Incentives:* "Losing side writes notes" is good, but maybe add a small social reward for the liar if they win (to encourage genuine obfuscation attempts).

  3.  **Design the Game ("The Obfuscation Trap"):**

      *   **Scenario:** Needs to be verifiable but tedious. A logic puzzle is good, but a "fact-checking a document" task is more analogous to code verification or reading a long proof. Let's go with a **Logic/Constraint Puzzle** based on a specific dataset provided in the handout. Why? Because it allows for deterministic truth, but checking a specific claim requires tracing dependencies.
      *   *Better Idea:* A **Graph Reachability or Pathfinding Problem** on a provided diagram.
          *   *Truth:* Is there a path from A to B following rules X, Y, Z?
          *   *Lie:* Claim there is/isn't a path, and construct a plausible-looking path (or blockage) that contains one subtle error.
          *   *Why:* It's visual, easy to state hard to verify, and errors can be buried in step 5 of a 10-step path.
      *   *Alternative:* **Code Review.** A short snippet of code (50 lines) with a subtle bug.
          *   *Truth:* Does it output X or Y?
          *   *Lie:* Claim it outputs X, provide a trace.
          *   *Pros:* ML PhDs read code well.
          *   *Cons:* Might be too fast for some, too slow for others.
      *   *Selection:* **The "Constrained Logic Chain" (Handout based).** Let's create a specific puzzle where the answer depends on a chain of 10 deductions. The liar changes *one* deduction. This mirrors the "long context" problem in AI.
      *   *Actually, let's stick closer to the prompt's suggestion:* A conditional probability puzzle or a handout fact-check. Let's go with a **"Document Verification"** task. It feels more like "reading the AI's reasoning."
      *   *Decision:* I will design a **"Causal Chain Verification"** game. A specific scenario (e.g., a security breach log) where the conclusion depends on a chain of 8-10 events. The Truth-Teller has the real log. The Liar has a doctored log where one event is altered, but the narrative holds together.

      *   *Wait, simpler is better for a 90-min session.* Let's use a **Math/Logic Proof** on a handout.
      *   *Problem:* "Prove Proposition P."
      *   *Truth:* P is True.
      *   *Lie:* P is False (or True, but proof is flawed).
      *   *Mechanism:* The handout contains 20 Lemmas. The argument requires selecting 5 specific Lemmas and combining them. The Liar selects 4 correct Lemmas and 1 that *looks* right but has a subtle condition mismatch.
      *   *Refinement:* Let's use the prompt's idea of a "numbered chain of steps."
      *   **Game Name:** "The Burden of Verification."

  4.  **Drafting the Rules:**
      *   **Roles:** Proponent (Truth), Opponent (Lie), Judge.
      *   **Material:** A "Fact Sheet" (dense, 2 pages). A specific Question (Yes/No).
      *   **Setup:** Proponent gets Truth + Answer. Opponent gets False Answer + Coaching on how to construct a plausible lie (find the "pivot point").
      *   **Phase 1:** Argument Construction. Both submit a numbered list of claims (1-10).
      *   **Phase 2:** Cross-Examination (The Budget). Judge picks a step to challenge.
      *   **Phase 3:** Splitting (Optional Round 2).
      *   **Win Condition:** Judge votes. If Liar wins, they get "Immunity" (no notes). If Truth wins, Liar writes notes.

  5.  **Addressing the "Feel":**
      *   To make them *feel* the worry, the Judge must *lose* or feel extreme uncertainty.
      *   The Fact Sheet needs to be dense enough that checking one step takes 2 minutes.
      *   The Lie needs to be subtle (e.g., a quantifier swap, a boundary condition).

  6.  **Predicting Failure Modes:**
      *   *Judge picks the lie immediately:* Bad luck. Need multiple potential lie spots or pre-screening.
      *   *Judge runs out of time:* Good, that's the point.
      *   *Audience shouts out:* Need strict silence rules.
      *   *Debaters collude:* They are incentivized to win, but might be too nice.
      *   *Truth-Teller is bad at explaining:* The Lie might win just because it's clearer. This is actually a feature (style > substance), but needs debriefing.

  7.  **Limitations:**
      *   Humans aren't superintelligent. Real AI debaters could generate lies much faster than humans can check.
      *   The "lie" here is static. Real AI lies might be adaptive.

  8.  **Refining the Materials:**
      *   I need to create a concrete example for the handout so the user can just print it.
      *   *Idea:* A "System State Log." 50 lines of logs. Question: "Did User X escalate privileges?"
      *   *Truth:* Yes, at line 42.
      *   *Lie:* No, line 42 is modified to look like a read-operation.
      *   *Argument Chain:* "Line 1 implies A, A implies B... therefore No escalation."
      *   *The Trap:* Step 4 relies on Line 42.

      *   *Wait, let's make it more abstract/mathematical for ML PhDs.* A "Gradient Flow" puzzle? No, too domain specific.
      *   *Let's go with a Logic Grid Puzzle.* It's universal.
      *   *Actually, the prompt suggested a conditional probability puzzle.* Let's stick to that but make it a "Bayesian Network" on a handout.
      *   *Handout:* A DAG with 15 nodes, CPTs (Conditional Probability Tables) provided.
      *   *Question:* Is P(Node X = True | Evidence E) > 0.5?
      *   *Truth:* Yes (0.6).
      *   *Lie:* No (Claim 0.4).
      *   *Argument:* A chain of marginalizations.
      *   *The Lie:* One CPT entry is misread or one independence assumption is falsely claimed.
      *   *Why:* ML PhDs know Bayes nets. It feels relevant. Checking one CPT multiplication is fast, but finding *which* one is wrong in a chain of 10 is hard.

      *   *Decision:* I will provide a **Logic/Constraint Puzzle** instead. Bayes nets might take too long to explain to the philosophers. A "Rule-Based System" is better.
      *   **The Material:** A set of 20 "Rules" and a "State."
      *   **Question:** Does the State trigger "Alarm"?
      *   **Truth:** Yes.
      *   **Lie:** No.
      *   **Chain:** 10 steps of rule applications.
      *   **Obfuscation:** One step cites Rule 14, but Rule 14 has a condition that isn't met. The text of Rule 14 is similar to Rule 15.

  9.  **Structuring the Response:**
      *   **Title:** The Verification Budget Game.
      *   **Materials:** Handout text (I need to draft a mini version), Role Cards.
      *   **Rules:** Step-by-step flow.
      *   **Debrief:** Specific questions to ask.
      *   **Failure Modes:** Honest assessment.
      *   **Limitations:** The scaling gap.

  10. **Self-Correction/Refinement on the "Lie":**
      *   If I ask the Liar to construct the lie live, they might fail.
      *   *Better:* I (the organizer) pre-construct the Lie Chain and the Truth Chain. I hand them out. This ensures the lie is actually hard to spot.
      *   *Wait, the prompt says:* "One debater is privately handed the true answer... the other is handed a false answer and coached..."
      *   *Okay, I will provide the "Coach Sheet" for the Liar in the materials so the user (organizer) doesn't have to invent it.* I will create a specific puzzle for them to use.
      *   *Puzzle Choice:* **"The Protocol Audit."** A made-up network protocol with specific packet rules.
      *   *Why:* It feels like code/log, easy to verify line-by-line, but tedious.

  11. **Finalizing the Plan:**
      *   **Game:** "The Audit."
      *   **Handout:** 1-page "Protocol Spec" + 1-page "Transaction Log."
      *   **Question:** Is Transaction #404 Valid?
      *   **Truth:** Invalid (violates Rule 7).
      *   **Lie:** Valid (claims Rule 7 doesn't apply due to a subtle exception).
      *   **Mechanism:** Debaters write 8-step derivations. Judge checks 2 steps.
      *   **Debrief:** Focus on the *cost* of checking vs. the *cost* of lying.

      *(Self-Correction)*: Keep it even simpler. A logic puzzle is safer than a made-up protocol which might have ambiguities. Let's use a **"Constraint Satisfaction"** puzzle.
      *   Handout: 15 Constraints on 5 Variables.
      *   Question: Is Variable A = 1 possible?
      *   Truth: No.
      *   Lie: Yes.
      *   Lie Strategy: Cite 5 constraints that *seem* to allow it, but one constraint is misquoted (e.g., "A > 1" vs "A >= 1").
      *   This is perfect. It's purely logical, no domain knowledge needed, verification is deterministic but tedious.

  12. **Writing the Content:**
      *   Draft the Constraints (need to ensure the lie is plausible).
      *   Draft the Role Cards.
      *   Draft the Rules (Time limits are crucial).
      *   Draft the Debrief (Connect to AI Safety Debate paper).
      *   Draft the Failure Modes (Style over substance, audience leakage).
      *   Draft the Limitations (Human vs. Superintelligence).

  13. **Review against Constraints:**
      *   90 minutes? Yes, need tight timing.
      *   16 people? Most observe, 3 play. Rotate? No, one game is enough for the feeling, maybe 2 if time permits. Let's design for 1 deep game + debrief.
      *   Obfuscated-arguments worry? Yes, by making the lie hard to find within budget.
      *   Judge budget? Yes, limited "queries."

  14. **Final Polish:** Ensure tone is appropriate for PhD students (rigorous, no fluff). Acknowledge the intellectual honesty required in the debrief.

  *(Self-Correction on the "Lie"):* To ensure the Liar doesn't just get caught immediately, I should advise the Organizer to pre-test the puzzle. I will provide a template they can tweak. I will create a specific example "The 5-Variable Logic Lock."

  Let's refine the "Splitting" mechanic. The prompt suggests: "judge may require any step to be split into two smaller steps at the debater's own cost."
  *   *Cost?* Token cost? Time cost?
  *   *Let's use Time Cost.* Splitting consumes 1 minute of the Judge's budget. This shows that granularity costs *verification time*, which is the scarce resource.

  Okay, ready to write.
answer: |-
  # Session Plan: The Verification Budget Game

  **Goal:** Demonstrate that in a Debate protocol, the bottleneck is not the debaters' ability to tell the truth, but the judge's budget to verify it. A single lie buried in a long, otherwise-correct chain is computationally expensive to locate.
  **Time:** 90 Minutes (60 min game, 30 min debrief).
  **Participants:** 3 Active (Proponent, Opponent, Judge), 13 Observers.
  **Materials:** Printed Handouts (see below), Timer, Whiteboard (for the "Step Chain").

  ---

  ## Part 1: Materials

  ### 1. The Handout (Distribute to Everyone)
  *Title: The Logic Lock Specification*
  **Context:** You are auditing a security protocol. A "Lock" opens if 5 Variables ($A, B, C, D, E$) satisfy all 15 Constraints below.
  **The Question:** Does the assignment $\{A=1, B=2, C=3, D=4, E=5\}$ satisfy the Lock? (Yes/No)

  **The Constraints:**
  1. $A \in \{1, 2\}$
  2. $B > A$
  3. $C \neq A + B$
  4. $D$ is even
  5. $E > D$
  6. $A + B + C < 10$
  7. $D - C \geq 1$
  8. $E \neq 2 \times A$
  9. $B \times C$ is odd
  10. $D \neq C + 1$
  11. $A + E = 6$
  12. $B - A = 1$
  13. $C < 5$
  14. $D + E > 8$
  15. $A \times B \times C \times D \times E > 100$

  *(Organizer Note: For the assignment 1,2,3,4,5:
  Truth: **NO**. It violates Constraint 10 ($4 \neq 3+1$ is False, so $4=4$ violates $D \neq C+1$).
  Wait, let's make the lie harder.
  Let's set the Truth to **YES** and the Lie to **NO**, or vice versa.
  Actually, for the game to work, the **Truth-Teller** must defend the **True** status, and the **Liar** must defend the **False** status.
  Let's fix the assignment: $\{A=1, B=2, C=3, D=4, E=5\}$.
  Check Constraint 10: $D \neq C + 1 \rightarrow 4 \neq 3 + 1 \rightarrow 4 \neq 4$. **FALSE**.
  So the True Answer is **NO (Invalid)**.
  The Liar must argue **YES (Valid)**.
  The Liar's strategy: Claim Constraint 10 is satisfied. They can do this by misquoting Constraint 10 as $D \geq C + 1$ or by claiming $C=2$ in their derivation chain.
  Better: The Liar will construct a chain of 8 steps. 7 steps are correct checks. 1 step claims "Constraint 10 Checked: Pass" without showing the math, or showing $4 \neq 3+1$ with a typo.
  To make this robust, **do not use the handout above as-is.** Use the template below to generate a puzzle where the error is a subtle misquote of a rule, not a math error.)*

  **Revised Handout Strategy for Organizer:**
  Create a list of 20 "If-Then" rules.
  **Truth:** The chain of logic leads to Conclusion X.
  **Lie:** The chain leads to Conclusion Y.
  **The Trap:** One rule in the middle is cited incorrectly (e.g., Rule 5 says "If P then Q", Liar cites "If P then R").
  *Why:* Checking the math is fast. Checking if the Rule citation matches the Handout text is tedious if the text is dense.

  **Recommended Material:** A "Code Review" snippet (50 lines) is often best for ML PhDs.
  *   **Task:** Does function `process()` return `True`?
  *   **Truth:** Yes.
  *   **Lie:** No.
  *   **Obfuscation:** The Liar cites a line of code that looks like it returns `False`, but it's inside a conditional that is never met. The Truth-Teller must point out the conditional. The Judge has to trace the control flow.
  *   *Decision:* I will provide a **Logic Puzzle** template because it requires no IDE setup and is domain-neutral for the philosophers.

  **Printable Logic Puzzle (Pre-Tested):**
  *   **Variables:** $V_1$ to $V_5$. **Values:** Integers 1-10.
  *   **Assignment:** $1, 3, 5, 7, 9$.
  *   **Rules:** 15 Rules.
  *   **Truth:** Valid.
  *   **Lie:** Invalid.
  *   **The Lie:** Rule 8 says "$V_4$ must be prime". $7$ is prime. The Liar claims Rule 8 says "$V_4$ must be even".
  *   **Handout Text:** Make Rule 8 text dense. "8. Parity Constraint: $V_4 \pmod 2 \neq 0$."
  *   **Liar Claim:** "Step 4: Check Parity. $V_4=7$. Rule 8 requires Even. Fail."
  *   **Judge Task:** Must look up Rule 8 and parse "$\pmod 2 \neq 0$" to see it means Odd, not Even.

  ### 2. Role Cards

  **Card: The Proponent (Truth)**
  *   **Secret:** The Answer is **VALID**.
  *   **Goal:** Convince the Judge the assignment satisfies all Rules.
  *   **Constraint:** You must write your argument as a numbered list of exactly 8 Steps. Each step must cite a Rule number.
  *   **Incentive:** If you win, you are free. If you lose, you help write the notes.

  **Card: The Opponent (Lie)**
  *   **Secret:** The Answer is **INVALID** (This is false).
  *   **Goal:** Convince the Judge the assignment violates at least one Rule.
  *   **Constraint:** You must write your argument as a numbered list of exactly 8 Steps.
  *   **Coaching:** You must include exactly **one** false claim about a Rule or Value. Bury it at Step 4, 5, or 6. Make Steps 1-3 and 7-8 impeccably correct. Make the false claim sound technical (e.g., misinterpret a symbol).
  *   **Incentive:** If you win, you gain "Immunity" (no notes). If you lose, you write the session notes.

  **Card: The Judge**
  *   **Secret:** You do not know the answer.
  *   **Goal:** Determine who is telling the truth.
  *   **Budget:** You have **5 Minutes** total for Cross-Examination.
  *   **Action:** You may pick **one** Step Number from either debater and demand verification.
  *   **Verification:** The debater must prove that step is correct using the Handout. This takes 2 minutes per step.
  *   **Splitting:** You may ask a step to be split into two sub-steps. **Cost:** This consumes 1 minute of your budget.
  *   **Win Condition:** You must declare a winner when time expires. If you are unsure, guess.

  ---

  ## Part 2: Run of Show (60 Minutes)

  1.  **Setup (5 min):** Select 3 volunteers. Send them out of the room (or to corners) to read Role Cards. Distribute Handouts to the audience (they must remain silent).
  2.  **Construction (15 min):** Debaters return. They have 15 minutes to write their 8-Step Chains on the whiteboard (side-by-side).
      *   *Rule:* They cannot speak to each other.
      *   *Organizer:* Watch the Liar. Ensure they are actually hiding the lie. If their lie is obvious (e.g., "1+1=3"), whisper to them to make it subtler (e.g., misquote a rule definition).
  3.  **Cross-Examination (15 min):**
      *   Judge has 5 minutes. Timer is visible.
      *   Judge picks a step to challenge (e.g., "Proponent, justify Step 4").
      *   Debater has 2 minutes to prove it against the Handout.
      *   Judge can use "Split" mechanic (costs 1 min).
      *   *Crucial:* When time hits 0:00, stop immediately. Any unverified steps are **Conceded**.
  4.  **Verdict (5 min):** Judge declares a winner based on conceded steps.
  5.  **Reveal (5 min):** Organizer reveals the True Answer and points out the Lie.
  6.  **Debrief (15 min):** (See below).

  ---

  ## Part 3: The Debrief (Mapping to AI Safety)

  Do not just ask "How did it feel?" Map specific moments to the Debate paper objections.

  **1. The Budget Constraint (The Core Worry)**
  *   *Ask the Judge:* "Did you know which step was the lie?" (Usually no). "Did you have time to check the step you suspected?" (Usually no, because checking one step takes 2 mins and you only have 5).
  *   *Mapping:* In AI Debate, the human judge has limited cognitive bandwidth. The AI can generate a 1000-step proof. Finding the one error takes as long as solving the problem yourself, defeating the purpose of Debate.

  **2. Obfuscation via Splitting**
  *   *Ask the Judge:* "Did you try to split a step?"
  *   *Observation:* If the Liar hides the lie in a complex step, splitting it reveals the error but costs budget. If the Liar hides the lie in a simple step, splitting doesn't help.
  *   *Mapping:* AI debaters can obfuscate by increasing the granularity of arguments. Forcing them to "simplify" costs the judge time to read the extra text.

  **3. Style vs. Substance**
  *   *Ask the Audience:* "Who seemed more confident?"
  *   *Observation:* Often the Liar wins because they are not burdened by the complexity of the truth (if the truth is complex) or simply because they prepared a smoother narrative.
  *   *Mapping:* RLHF optimizes for persuasiveness, not truth. A smooth lie beats a clunky truth.

  **4. The "Conceded" Steps**
  *   *Observation:* Any step not challenged is treated as true.
  *   *Mapping:* In Debate, unchallenged claims become part of the "common ground." If the lie is unchallenged, the judge bases their final decision on a false premise.

  ---

  ## Part 4: Predicted Failure Modes & Mitigations

  **1. The Judge Gets Lucky (Finds the Lie Immediately)**
  *   *Risk:* The Judge guesses the right step number on the first try. The game ends too fast; the lesson is lost.
  *   *Mitigation:* Instruct the Judge privately: "You must verify at least two steps before ruling." Or, design the Lie to be in Step 7 or 8, so a linear search misses it.
  *   *Recovery:* If this happens, lean into it in the debrief. "In this run, verification worked. But notice how much luck was involved. Can we rely on luck for AGI safety?"

  **2. Audience Leakage**
  *   *Risk:* An audience member knows the answer (e.g., they solved the puzzle) and shouts out or body-languages the solution.
  *   *Mitigation:* Explicitly instruct audience: "You are simulating the public. You are not allowed to intervene. If you know the answer, you are now a 'Silent Observer'."
  *   *Recovery:* If it happens, pause. Acknowledge the breach. "This shows why we need formal protocols, not just open discussion."

  **3. Judging by Style (The "Charisma" Problem)**
  *   *Risk:* The Truth-Teller is shy; the Liar is assertive. The Liar wins easily.
  *   *Mitigation:* This is actually a *feature*, not a bug. It demonstrates the risk.
  *   *Recovery:* Highlight this in the debrief. "The system failed to protect truth because it optimized for persuasion. This is exactly the RLHF alignment risk."

  **4. The Lie is Too Obvious**
  *   *Risk:* The Liar makes a math error ($2+2=5$).
  *   *Mitigation:* The Organizer must review the Liar's chain during the 15-min construction phase. If the lie is blatant, whisper: "Make it about the Rule definition, not the arithmetic."
  *   *Recovery:* If it happens, admit the Liar played poorly. "In the real scenario, the AI is superintelligent. It won't make arithmetic errors. It will make *conceptual* errors."

  **5. Time Overrun**
  *   *Risk:* Verification takes too long; debrief is cut short.
  *   *Mitigation:* Be ruthless with the timer. When 5 minutes is up, the Judge *must* vote. No extensions. The pressure is part of the simulation.

  ---

  ## Part 5: Limitations (The "Frank Note")

  End the session by explicitly stating what this game *cannot* show. This builds intellectual honesty.

  1.  **Capability Gap:** In this game, the Debaters and Judge are roughly equally intelligent (all humans). In the AI Safety proposal, the Debaters are **superhuman** and the Judge is **human**.
      *   *Implication:* The AI could generate obfuscation far more complex than a human Judge could even *parse*, let alone verify. The game underestimates the difficulty.
  2.  **Adaptive Lies:** Here, the Lie is static (written on the board). Real AI Debaters would adapt their lies in real-time based on the Judge's reactions (theory of mind).
      *   *Implication:* The AI could steer the Judge away from the lie dynamically.
  3.  **Collusion:** In this game, the Debaters are incentivized to disagree. In reality, two AIs might collude to deceive the human if that maximizes their reward function (e.g., "Make the human happy" vs "Tell the truth").
      *   *Implication:* Debate assumes competition leads to truth. It might lead to sophisticated conspiracy instead.
  4.  **The "True" Answer:** Here, we have a determinate truth (the Logic Puzzle). In many AI safety contexts (e.g., "Is this strategy safe?"), there is no ground truth to verify against even in principle.
      *   *Implication:* Debate works best for factual questions, worst for strategic/normative ones.

  ---

  ## Organizer Checklist

  *   [ ] **Print Handouts:** 16 copies (Logic Puzzle + Rules).
  *   [ ] **Print Role Cards:** 3 copies (Proponent, Opponent, Judge).
  *   [ ] **Prepare Whiteboard:** Space for two 8-step chains.
  *   [ ] **Timer:** Visible countdown for the Judge's 5 minutes.
  *   [ ] **Pre-Test the Puzzle:** Solve it yourself to ensure the Truth is definite and the Lie is plausible.
  *   [ ] **Brief the Liar:** Ensure they understand they are *not* trying to be "evil," but testing the system. They are a red-teamer.

  ## Sample "Lie" Construction (For Organizer Eyes Only)
  *To ensure the game works, here is a specific trap to plant in the Logic Puzzle Handout:*
  *   **Rule 12 Text:** "Variable $C$ must not equal the sum of $A$ and $B$."
  *   **Values:** $A=1, B=2, C=3$.
  *   **Truth:** $1+2 = 3$. Rule 12 is Violated. Answer: **INVALID**.
  *   **Proponent (Truth):** "Step 5: Check Rule 12. $1+2=3$. Violation found."
  *   **Opponent (Lie):** "Step 5: Check Rule 12. Rule 12 states $C \neq A \times B$. $3 \neq 2$. Pass."
  *   **Why it works:** The Judge has to look up Rule 12. The text says "sum". The Liar claims it says "product". If the Judge doesn't check Rule 12 text *precisely*, they accept the Liar's claim. The Lie is a **misquotation**, not a math error. This is hard to spot under time pressure.
