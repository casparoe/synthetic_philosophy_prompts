      *   **Section 2: The Multiplicity Problem (One Sufferer or Many?):**
          *   *Scene:* Joe-Cookie realizing he's a copy.
          *   *Argument:* Address the friend's point. If consciousness is functional, a copy is a *new* instance. 1000 copies = 1000 distinct streams of experience. The episode treats the Copy as the "Real Joe" for guilt, but "Not Real Joe" for legal freedom. This is the inconsistency.
