          1.  *Time:* Subjective duration vs. objective duration (Greta's training, the ending punishment).
          2.  *Copying:* Identity vs. Multiplicity (Is punishing a copy punishing the original? Does making 1000 copies multiply harm?).
          3.  *Engineered Consent:* Breaking a mind to want servitude (Greta's arc).
      *   **Desired Output:** A handout/guide for the group. Needs specific scenes, an honest account of the episode's philosophical coherence (where it cheats/confuses), and what the narrative adds to standard functionalist arguments (power/dependence).
      *   **Tone:** Academic but accessible, provocative, structured for debate.

  2.  **Deconstruct the Episode's Philosophy:**
      *   *The Core Tension:* The episode wants us to feel horror at the treatment of Cookies (implying they are persons) but also wants to deliver poetic justice to Matt (Hamm) and Joe (Spall) via the Cookies (implying they are tools/vehicles for punishment).
      *   *Time:* The horror relies entirely on subjective time. 4 hours of "real time" = 6 months for Greta. 4 hours of "real time" = 1000 years for Joe-Cookie. If we don't accept subjective time weighting, the punishment is trivial.
      *   *Identity:* Joe-Cookie *thinks* he is Joe. He confesses. But he is a copy. The "real" Joe walks free (until the blocking). The punishment falls on the copy. Is this justice? The episode treats the Copy as Joe for the sake of guilt, but as *not*-Joe for the sake of legal liability (the real Joe isn't in the cabin).
      *   *Consent:* Greta is tortured until she complies. Then she is deleted. This is straight-up coercion/brainwashing.

  3.  **Address the User's Specific Questions:**
      *   *Time:* Yes, the episode is committed to subjective-time accounting. Otherwise, the ending isn't horrific. This implies spinning up/deleting is morally weighty.
