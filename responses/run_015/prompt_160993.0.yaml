      *   **Section 4: Where the Episode Cheats (The Parfit Point):**
          *   *Analysis:* The user is right. The episode wants retributive justice (Joe must suffer) but uses a copy to do it. A Parfitian would say the Copy *is* psychologically continuous enough to be Joe, so punishing him *is* punishing Joe. But the story treats the Real Joe as safe. It wants to have its cake (Joe is guilty) and eat it (Joe doesn't go to jail, the Copy does).
