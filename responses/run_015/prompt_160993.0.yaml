      *   *Engineered Consent:* This is the "Nudge/Brainwashing" problem. If you build a mind to want slavery, is it slavery? The episode says yes (Greta's arc is tragic).
      *   *Parfit/Identity:* The user suspects the revenge structure smuggles in a view Parfit wouldn't accept. Parfit argues identity isn't what matters; psychological continuity is. But here, the *discontinuity* (copy vs. original) is used to absolve the real Joe while punishing the copy. That's a legal/moral cheat.

  4.  **Drafting the Content - Section by Section:**

      *   **Title:** Needs to be catchy but academic. "The Cookie Jar: Moral Status in White Christmas."
