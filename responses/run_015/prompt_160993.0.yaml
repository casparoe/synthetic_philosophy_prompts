  *(Self-Correction Note on the "Friend's Argument"):* The friend's argument is essentially that consciousness is a *type* not a *token*. If I copy a file, I don't have two files, I have two instances of the same data. But in philosophy of mind, qualia are token-specific. I need to make sure I articulate why the "One Sufferer" view is intuitively appealing but philosophically weak in a functionalist framework.

