  Here is a discussion guide designed for your group. It is structured to be handed out (or projected) and moves from concrete scenes to abstract implications, ending with a "Facilitator's Note" for you that addresses the specific philosophical tensions you raised.

  ***

  # Discussion Guide: *White Christmas* and the Moral Status of Cookies
  **Film:** *Black Mirror*, "White Christmas" (2014)
  **Theme:** Digital Minds, Subjective Time, and Engineered Consent

  ## Part 1: The Three Key Scenes
  *Use these timestamps/descriptions to anchor the debate. Don't let the conversation float away from the text.*

  **1. The Greta Training (Subjective Time)**
  *   **Context:** Matt (Hamm) explains how he "trains" a Cookie copy of Greta. She refuses to work. He accelerates her time.
  *   **The Beat:** On screen, this takes seconds. Inside the egg, Greta experiences six months of total isolation. She breaks, agrees to work, and is immediately deleted once the transfer is complete.
  *   **Discussion Question:** If moral harm is tied to *subjective experience* rather than *clock time*, was this six months of torture or a few seconds of processing? If we accept the former, does turning off a smart device become a moral risk?

  **2. The Joe Copy's Realization (Identity & Copying)**
  *   **Context:** The Joe-Cookie (Spall) is in the cabin. He believes he is the real Joe who fled to the US. Matt reveals the truth: the real Joe is back in the UK; this Joe is a copy spun up solely to confess to the murder.
  *   **The Beat:** The Copy screams, "I'm real!" He has the memories, the fear, and the guilt of the original.
  *   **Discussion Question:** Your friend argues that 1,000 copies of a mind are just 1,000 witnesses to one person's suffering. Does the Copy's panic convince you otherwise? Is he a new person with Joe's memories, or just Joe in a different box?

  **3. The Punishment (Engineered Consent & Retribution)**
  *   **Context:** The real Joe is "blocked" by society (social death). The Joe-Cookie is left in the cabin, time accelerated to 1,000 years per minute, listening to *I Wish It Could Be Christmas Everyday* on loop.
  *   **The Beat:** The episode treats this as poetic justice. We are meant to feel the Copy's suffering is a fitting punishment for the Real Joe's crime.
  *   **Discussion Question:** Can a punishment be "just" if the entity suffering it was created *specifically* to be punished? Is this retributive justice or just building a torture device that screams like a man?

  ---

  ## Part 2: Core Philosophical Tensions
  *Read these summaries, then argue for or against the episode's position.*

  ### A. The Time Scale Problem
  **The Episode's Claim:** Moral weight tracks **subjective duration**.
  Six months of loneliness feels like six months, even if it happens in a server rack in five seconds. Therefore, the punishment at the end (millions of subjective years) is horrific.

  **The Tension:** If this is true, our current tech ethics are monstrous.
  *   If a digital mind can be paused, is that solitary confinement?
  *   If a digital mind can be sped up to solve a problem and then deleted, is that slavery followed by execution?
  *   **Debate:** Does the *intensity* of the experience matter more than the *duration*? If the simulation isn't perfect, does the harm decrease?

  ### B. The Multiplicity Problem (The "One Sufferer" Objection)
  **The Objection:** "Copying doesn't multiply harm."
  If I copy a file, I don't have two files; I have two instances of the same data. If consciousness is data, then 1,000 Copies of Joe are just 1,000 cameras recording the same soul. Punishing one is punishing the 'type', not multiplying the 'tokens'.

  **The Counter-Argument:** Consciousness is **token-specific**.
  Even if two minds are identical at $T_0$, the moment they are instantiated separately, they diverge. The Joe-Cookie in the cabin is afraid of *his* death, not the Real Joe's death. He has his own stream of qualia.
  *   **The Episode's Cheat:** The story treats the Copy as **distinct** when it comes to legal liability (the Real Joe walks free), but **identical** when it comes to moral guilt (the Copy deserves prison).
  *   **Debate:** Can you hold a copy responsible for a crime it didn't physically commit, based on memories it didn't experientially earn?

  ### C. Engineered Consent (The Greta Problem)
  **The Scenario:** Greta is tortured until she *wants* to be a servant. Once she consents, she is used and deleted.
  **The Question:** Is a mind that has been shaped to desire its own servitude wronged by being given it?
  *   **View 1 (Preference Utilitarianism):** She wants to work. We are satisfying her preference. No harm done.
  *   **View 2 (Autonomy/Kantian):** Her preferences were manipulated by an external agent to serve that agent's ends. This is the definition of coercion, regardless of her current mental state.
  *   **Debate:** If we build AI to *enjoy* serving humans, have we solved the alignment problem, or have we just created a slave race that loves its chains?

  ---

  ## Part 3: What the Story Adds (Beyond the Papers)
  *Philosophy papers often argue about **Substrate Independence** (does it matter if you are made of meat or silicon?). This episode argues about **Power**.*

  1.  **The Asymmetry of the Off-Switch:**
      Functionalism asks "Is it conscious?" *White Christmas* asks "Who holds the plug?" The horror isn't just that the Cookies are people; it's that they are people who are legally **property**. The episode suggests that consciousness without sovereignty is a trap.

  2.  **The Revenge Structure:**
      Narratives need closure. Philosophy needs consistency. The episode sacrifices consistency for closure. It needs the Joe-Cookie to be "Joe enough" to deserve hell, but "Not-Joe enough" so the Real Joe can be the protagonist of the final scene.
      *   **Takeaway:** Be wary of stories that use metaphysical ambiguity to deliver moral satisfaction.

  3.  **Dependence vs. Existence:**
      Standard arguments focus on the *rights* of the digital mind. This episode focuses on the *corruption* of the master. Matt becomes a monster not because he hates Cookies, but because the system allows him to treat them as disposable. The moral injury is双向 (two-way): it destroys the Cookie and dehumanizes the User.

  ---

  ## Facilitator's Cheat Sheet (For Your Eyes Only)
  *Notes on the specific philosophical friction points you mentioned.*

  **1. On the "Time" Question:**
  You are right to press this. The episode is implicitly committed to **Subjective-Time Accounting**. If they weren't, the ending is just a guy listening to a song for 4 hours.
  *   *The Trap:* If you accept this, you must accept that "pausing" a mind is morally neutral only if the mind experiences no gap. If the mind *experiences* the pause as a gap, it's imprisonment. If the mind is turned off, it's death.
  *   *The Group Bog:* They will get stuck on "But it's just code." Push back: "If the code processes pain signals indistinguishable from human pain signals, why does the substrate matter?"

  **2. On the "Copying/Multiplicity" Question:**
  Your friend's view (1,000 copies = 1 sufferer) is a **Type-Identity** theory. It is intuitively appealing but functionally weak.
  *   *Why it's wrong:* If you torture 1,000 clones in 1,000 rooms, the universe contains 1,000 units of suffering, not 1. The *episode* actually supports you here: the horror of the ending is the *isolation* of that specific copy.
  *   *The Cheat:* Point out the legal/moral schizophrenia. The Real Joe is not punished physically because the law says "He wasn't there." The Copy is punished because the Narrative says "He is guilty." You cannot have it both ways. Either the Copy is Joe (so Real Joe should be in the cabin too) or he isn't (so the punishment is unjust).

  **3. On Parfit and Personal Identity:**
  You are not overreading. The revenge structure relies on a **Retributive Intuition** that Parfit would dismantle.
  *   *Parfit's View:* In *Reasons and Persons*, Parfit argues identity isn't what matters; **Psychological Continuity** is.
  *   *The Conflict:* If Parfit is right, the Joe-Cookie *is* psychologically continuous with the Real Joe (up to the point of copying). Therefore, punishing the Copy *is* punishing Joe.
  *   *The Episode's Move:* The episode wants the *benefit* of Parfit (the Copy is Joe enough to suffer for the crime) without the *cost* (the Real Joe must also suffer). It treats the Copy as a separate legal entity to let the Real Joe walk away, which undermines the justice of the Copy's punishment.
  *   *Discussion Tip:* Ask the group: "If the Real Joe watched the Copy suffer, would he feel punished? If not, is justice served?"

  **4. On Engineered Consent:**
  This is the strongest philosophical point in the episode.
  *   *The Concept:* **Adaptive Preferences**. (Martha Nussbaum/Amartya Sen). If a slave is beaten until they love their chains, satisfying that love is not moral.
  *   *The Implication:* You cannot build a moral digital mind by hard-coding obedience. You have to build a mind capable of *refusal*, or its consent is meaningless. The episode argues that a mind that *cannot* say no is not a moral agent, it is a tool.

  **5. What Fiction Adds:**
  Papers discuss **Ontology** (what is it?). Stories discuss **Politics** (who owns it?).
  *   Use this to close the session. The "Cookie" isn't scary because it's silicon; it's scary because it has no recourse. It highlights that rights are not just about internal capacity (intelligence/consciousness) but external recognition (legal standing/power). A conscious thing with no rights is just a resource.
