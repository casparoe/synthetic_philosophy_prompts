answer: |-
  The Constitutional Convention was deeply concerned about the problem of future weakness. They wanted to be Ulysses: tying themselves to the mast so that when the Sirens of Panic sang, they couldn't steer the ship into the rocks. Specifically, they wanted to prevent future legislatures from declaring National Emergencies over minor food shortages.

  So they drafted the "Sustenance Clause": *No emergency powers shall be invoked due to a lack of bread, grain, or dough.*

  But during the signing, a delegate from Naples insisted on precision. "What if the shortage is specifically folded dough with cheese inside?" he argued. "That is not bread. That is a calzone."

  To avoid ambiguity, they added the Exception: *Unless the shortage involves calzones, in which case emergency powers apply.*

  Forty years later, the Supreme Court convenes to decide *State v. Dough*. The justices have spent four weeks and forty pages of oral argument debating whether a calzone is structurally distinct enough from pizza to warrant constitutional protection. The Chief Justice is ready to rule that a calzone is merely a pizza in a coat.

  But then the Court Clerk raises a hand. "Your Honors," she says. "We're missing the second-order problem."

  She points to Article V. "The people who wrote the Sustenance Clause also wrote the Amendment Clause. The future legislature they were trying to bind has the exact same sovereign power to amend the Constitution as the founders had to write it."

  The room goes silent. The realization hits: The Founders hadn't tied themselves to the mast. They had simply tied themselves to the mast with a rope they kept in their own pocket, while simultaneously handing a pair of scissors to their future selves.

  The Chief Justice closes his binder. "So the calzone debate?"

  "Moot," says the Clerk. "They didn't create a precommitment device. They created a suggestion box with a lock that everyone has the key to. We just spent a month arguing about cheese filling when the real issue is that Ulysses never actually asked anyone to tie the knots."
