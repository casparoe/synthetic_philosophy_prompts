answer: |-
  This is a precise and profound cut into the philosophy of action. You have identified the structural tension between *diachronic rationality* (being rational over time) and *synchronic flexibility* (being responsive to reasons now).

  There is no single, universally agreed-upon word for this specific configuration, but there is a cluster of terms of art that carve it up. The most precise label in rational choice theory is **Resolute Choice**. In the philosophy of action, it maps onto **Michael Bratman's Stability of Intention** (specifically the norm of *non-reconsideration*). In political economy and psychology, it is often discussed under **Rational Precommitment** or **Ulysses Contracts**.

  However, since you are after the *carving* and the *edge* (the regress problem), I will focus less on lexicography and more on the structural analysis you requested.

  ### 1. The Term of Art: Resolute Choice
  The configuration you describe is best captured by Edward McClennen's concept of **Resolute Choice** (contrasted with *Sophisticated Choice*).

  *   **Sophisticated Choice:** An agent anticipates their future preferences and chooses a plan only if they know their future self will stick to it. If the future self would deviate, the sophisticated agent abandons the plan now.
  *   **Resolute Choice:** An agent adopts a plan and *makes it the case* that they stick to it, even if, at the later time, the local reasons seem to favor deviation. The agent treats the past decision as a *reason* in the present that overrides local considerations.

  Your colleague and your friend are exercising **Resolute Choice**. They are not ignoring reasons (they acknowledge the new edition or the career event); they are treating the *rule of reconsideration* as a higher-order reason that trumps the first-order reason.

  ### 2. The Carving: Diachronic vs. Synchronic Agency
  You note that this is not stubbornness or akrasia. The carving lies in the distinction between two types of rationality:

  *   **Synchronic Rationality:** At time *t*, do what the balance of reasons at *t* suggests. (This leads to the "wasp" problem if taken to the extreme, or to paralysis if taken to the other extreme).
  *   **Diachronic Rationality:** At time *t*, do what serves the rationality of the trajectory from *t-1* to *t+1*.

  Your agents are prioritizing **Diachronic Rationality**. They have judged that a policy of *scheduled flexibility* yields better agency over a lifetime than a policy of *continuous flexibility*. Continuous flexibility incurs "transaction costs" (deliberation fatigue, loss of coordination, instability of identity).

  Therefore, the rigidity is not a failure of agency; it is a **technology of agency**. It is the scaffolding that allows the agent to exist as a unified entity over time rather than a series of momentary impulses.

  ### 3. The Edge: The Regress Problem
  This is the core of your inquiry: *Does the fact that the meta-rule is revisable later solve the problem, or merely relocate it?*

  It **relocates** it. If the rule "I only reconsider on my birthday" is itself subject to reconsideration on your birthday, you face a regress.
  *   *Level 1:* I will not reconsider career plans until June.
  *   *Level 2:* I will not reconsider the "June Rule" until next year.
  *   *Level 3:* I will not reconsider the "Next Year Rule" until...

  If every rule requires a higher-order rule to validate its rigidity, you face an infinite regress. For agency to exist, the regress must terminate.

  **Where does it terminate?**
  It cannot terminate in another *rule*, because that would just be another link in the chain. It must terminate in something that is **not a rule** but is still **not a mechanism**. In the literature, there are three main candidates for this terminus:

  #### A. Practical Identity (Christine Korsgaard)
  The regress stops at **who you are**. You do not choose your practical identity in the moment; you *act from* it.
  *   *Application:* Your colleague does not deliberate on the syllabus rule because she identifies *as a teacher who provides stability for students*. To reconsider the rule mid-term would be to betray that identity.
  *   *Is it rigid?* Yes, but it is **constitutively rigid**. It is rigid in the way a definition is rigid. It is not a causal constraint (like a wasp's nervous system); it is a normative constraint (like the rules of chess). You can quit chess, but while playing, the rules are fixed.

  #### B. Care / Volitional Necessity (Harry Frankfurt)
  Frankfurt argues that the regress stops at what we **Care** about. We do not choose our cares; we find ourselves bound by them.
  *   *Application:* Your friend cares about being a decisive person. The "birthday rule" is an expression of that care. He cannot deliberate on the rule without undermining the care that makes him *him*.
  *   *Is it rigid?* Frankfurt calls this **Volitional Necessity**. It feels like "I cannot do otherwise," but it is the "cannot" of love or loyalty, not the "cannot" of physics. This is the "non-rigid rigidity" you are looking for. It is flexible over a lifetime (cares can evolve) but rigid in the moment.

  #### C. Habit / Hexis (Aristotle)
  The regress stops at **Character**.
  *   *Application:* The agent has cultivated a *hexis* (stable disposition) of planning. The rule is not a conscious command issued every time; it is a habit of mind.
  *   *Is it rigid?* Aristotle distinguishes between *mechanical habit* and *virtuous habit*. The latter is flexible in its origin (cultivated by reason) but fixed in its operation. The "rigidity" is the weight of character.

  ### 4. Addressing Your Final Question
  *“Does the structure count as rigidity at all if the higher-level rule is itself revisable at some other scheduled time, or does that merely relocate the problem one level up? And if it does merely relocate it, what would have to be true for the regress to terminate in something that is not itself rigid?”*

  **It does merely relocate the problem.** Scheduled revisability is just deferred rigidity.

  For the regress to terminate in something **not rigid**, the terminus cannot be a *proposition* or a *rule*. It must be a **capacity** or a **state of being**.

  The terminus must be **Autonomy** in the Kantian sense: the capacity to legislate.
  *   The rule is rigid.
  *   The *authority* that issued the rule is not rigid; it is **spontaneous**.
  *   The agent is not rigid; the agent's *output* is rigidified to allow for action.

  **The Solution:**
  The configuration counts as **Agency** (not mechanism) if the rigidity is **Self-Imposed** and **Revocable in Principle** (even if not in practice).
  *   **Mechanism:** The wasp *cannot* stop.
  *   **Agency:** The colleague *could* tear up the syllabus, but *won't* because she binds herself.

  The "something not flexible" that terminates the regress is **The Agent**.
  The agent is not a rule. The agent is the *source* of rules. The source does not need a rule to validate its sourcing; that is what it means to be an originator (an *arche*).

  ### Summary for your Seminar
  If you need a label, use **Resolute Choice** or **Rational Precommitment**.
  If you need the carving:
  1.  **Distinguish** it from *akrasia* (it is higher-order endorsement).
  2.  **Distinguish** it from *mechanism* (it is revocable in principle, even if locked in practice).
  3.  **Resolve the Regress** by locating the terminus in **Practical Identity** or **Volitional Necessity**. The rigidity is not in the *agent*, but in the *commitments* that constitute the agent.

  The flexibility of agency does not require that *every* node in the network be flexible. It requires that the *network as a whole* be responsive to reasons over time. The "rigid" nodes are the joints that allow the structure to move without collapsing. Without them, you do not have freedom; you have fluidity. And fluidity is not agency; it is drift.
