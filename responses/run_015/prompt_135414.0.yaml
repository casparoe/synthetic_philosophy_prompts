answer: |-
  ### The Berkeley Capacity Protocol (BCP)

  **Purpose:** To operationalize George Berkeley's theory of money for the management of service-backed scrip.
  **Core Principle:** Scrip is a *ticket* for labor and commodities, not wealth itself. Issuance must never exceed the verified capacity to redeem that labor.
  **Usage:** Apply this procedure to any proposal involving (A) new scrip issuance, (B) changes to redemption schedules, or (C) acceptance of collateral to back the unit.

  ---

  #### Phase 1: The Tangible Capacity Test
  *Berkeley Commitment: Money tracks real productive capacity. To multiply tickets without multiplying goods undermines trust.*

  **Q1.1: What specific labor hours or service units are immediately available to honor this proposal?**
  *   **Establish:** A verified schedule of work (e.g., "500 hours of road repair," "1000 meals distributed") that exists *now* or is contractually guaranteed within the redemption window.
  *   **Sufficient Answer:** A signed commitment from a department head or vendor confirming capacity exists *independent* of the scrip issuance.
  *   **Insufficient Answer:** Projections, market valuations, asset appraisals, or "expected" tax revenues.
  *   **Termination:** If the answer relies on *future* or *speculative* capacity (e.g., land value, projected growth), **STOP. REFUSE PROPOSAL.**
  *   **[JUDGMENT REQUIRED]:** If capacity exists but is shared with other obligations (e.g., staff already paid in national currency), the Treasury Officer must estimate the *surplus* labor available. This is not a calculation; it is an estimate of slack.

  **Q1.2: Does the scrip volume match the labor volume at the established redemption rate?**
  *   **Establish:** The ratio of scrip units to labor units (e.g., 1 Unit = 1 Hour of Skilled Labor).
  *   **Sufficient Answer:** Total new scrip $\leq$ Total verified labor hours $\times$ Redemption Rate.
  *   **Termination:** If Scrip Volume > Labor Capacity, **STOP. REFUSE PROPOSAL.** (This prevents inflationary over-issue).

  ---

  #### Phase 2: The Convertibility Test
  *Berkeley Commitment: Money operates as a convention sustained by collective confidence. It must be spendable.*

  **Q2.1: Is there a clear, frictionless path for the holder to exchange this scrip for the promised service?**
  *   **Establish:** A logistical mechanism for redemption (e.g., a booking system, a voucher exchange).
  *   **Sufficient Answer:** A documented workflow that allows a citizen to present scrip and receive service within a standard timeframe (e.g., 30 days).
  *   **Termination:** If redemption is contingent on further funding, legislative approval, or uncertain supply chains, **STOP. REFUSE PROPOSAL.**

  **Q2.2: Will this issuance encourage circulation or hoarding?**
  *   **Establish:** An analysis of the recipient's likely behavior. Scrip is a ticket for *industry*, not a store of value.
  *   **Sufficient Answer:** Evidence that recipients have an immediate need for the services or will spend the scrip locally.
  *   **[JUDGMENT REQUIRED]:** Treasury Officer must assess if the scrip acts as a "savings account." If the design encourages holding scrip rather than spending it on labor, it violates the Berkeleyan function of money as a circulator of industry. The Officer must decide if demurrage (decay) or expiration dates are necessary.

  ---

  #### Phase 3: The Collateral Integrity Test
  *Berkeley Commitment: Distinguish between the token of value and value itself. Do not accept abstract claims as backing.*

  **Q3.1: Is the proposed collateral a tangible asset ready for use, or a claim on future value?**
  *   **Establish:** The nature of the backing asset.
  *   **Sufficient Answer:** The asset is currently generating the service or commodity (e.g., a stocked warehouse, a deployed crew).
  *   **Termination:** If the collateral is land, equity, bonds, or projected revenue, **STOP. REFUSE PROPOSAL.** (Berkeley explicitly rejects land/metal as intrinsic wealth; only labor/commodities count).
  *   **[JUDGMENT REQUIRED]:** If the asset is "infrastructure" (e.g., a road that needs repair), the Officer must decide if the *repair* is the value, or the *road*. Under Berkeley, only the *repair labor* is the value. The road itself is not backing.

  ---

  #### Phase 4: The Social Priority Test
  *Berkeley Commitment: Trust is social. When capacity is constrained, allocation is a moral choice, not an economic one.*

  **Q4.1: If redemption capacity is insufficient to meet all claims, who has priority?**
  *   **Establish:** A hierarchy of needs (e.g., flood barriers vs. artisanal repair).
  *   **Sufficient Answer:** A directive from the Citizens' Assembly or elected body.
  *   **Termination:** If no directive exists and capacity is tight, **STOP. ESCALATE TO LEADERSHIP.** The Treasury cannot decide values.
  *   **[JUDGMENT REQUIRED]:** This step cannot be automated. If the procedure reaches here, the Treasury Officer must flag the issue as political. The procedure does not solve this; it identifies it.

  ---

  ### Warning on Simplification
  **Distortion Risk:** Berkeley argued money is a *sign* of industry. This protocol risks treating the *labor hours* as the "real value." Be warned: Labor is not value in itself; it is the activity that creates well-being. By reducing "industry" to "billable hours," we risk bureaucratizing the very social trust Berkeley sought to protect. If staff begin treating the labor schedule as a commodity to be traded rather than a promise to be kept, the system has failed.

  ---

  ### Application to Current Proposals

  #### Case 1: Backing New Scrip with Undeveloped Municipal Land
  *Proposal:* Issue 50,000 Units backed by a portfolio of vacant lots. The land is appraised at a market value equivalent to the scrip, but it is currently unused.

  **BCP Execution:**
  1.  **Phase 1 (Capacity):** Q1.1 asks for specific labor hours available.
      *   *Finding:* The land is vacant. It generates no service. It requires labor to develop, but that labor is not yet scheduled or funded.
      *   *Result:* **Insufficient Answer.**
  2.  **Phase 3 (Collateral):** Q3.1 asks if collateral is tangible/ready or a claim on future value.
      *   *Finding:* Land value is speculative/projected. It is a claim on future utility, not current industry.
      *   *Result:* **Termination.**

  **Outcome:** **REFUSE PROPOSAL.**
  **Unwelcome Answer:** Your office likely views land as a strong asset. Under the BCP (and Berkeley's theory), land is not wealth until labor is mixed with it. Backing scrip with vacant land is issuing tickets for goods that do not exist. This creates inflationary pressure because the "tickets" exceed the "industry."
  **Judgment Marker:** None. This is a hard stop based on the definition of backing.

  #### Case 2: Emergency Redemption for Climate-Adaptation Labor
  *Proposal:* Authorize immediate redemption of existing scrip for flood-barrier upkeep during a budget crisis. The labor pool is uncertain (some workers may be unavailable due to the disaster), and the Citizens' Assembly is divided on prioritizing barriers over food logistics.

  **BCP Execution:**
  1.  **Phase 1 (Capacity):** Q1.1 asks for verified labor hours.
      *   *Finding:* Labor pool is "uncertain." Department heads cannot guarantee crew availability due to the crisis.
      *   *Result:* **[JUDGMENT REQUIRED].** The Treasury Officer must estimate if the *risk* of non-redemption is acceptable. Berkeley warns against undermining trust. If you authorize redemption and cannot deliver, trust collapses.
      *   *Decision:* Officer marks capacity as "High Risk."
  2.  **Phase 2 (Convertibility):** Q2.1 asks for a frictionless path.
      *   *Finding:* Crisis conditions create friction.
      *   *Result:* **Warning Flag.**
  3.  **Phase 4 (Priority):** Q4.1 asks who has priority if capacity is tight.
      *   *Finding:* Citizens' Assembly is divided (Barriers vs. Food). No directive exists.
      *   *Result:* **STOP. ESCALATE TO LEADERSHIP.**

  **Outcome:** **HAND-OFF TO POLITICAL LEADERSHIP.**
  **Reasoning:** The Treasury cannot issue the authorization because the "Social Priority" is unresolved. Berkeley's system relies on confidence; if the public perceives the Treasury is choosing sides in a political dispute (Barriers vs. Food) without a mandate, confidence erodes.
  **Judgment Marker:** **Phase 4, Q4.1.** The Treasury Officer cannot decide whether a flood barrier is more valuable than food distribution. That is a value judgment, not an accounting fact. The procedure forces the office to admit it lacks the mandate to act, preventing the Treasury from absorbing political liability.

  ### Summary of Risks
  In Case 1, the procedure blocks a standard financial maneuver (asset-backed issuance) because it violates the philosophical core of the scrip (labor-backed). In Case 2, the procedure prevents the Treasury from acting decisively during a crisis, potentially slowing response time. This is intentional: Berkeley's theory prioritizes the *integrity of the token* over the *speed of transaction*. If the token promises labor it cannot deliver, the system is worse than useless; it is a lie. The procedure is designed to force that truth into the open.
