  ### Strategic Research Agenda: Prioritization and Dependency Analysis

  Given the constraints of a three-year timeline and a single postdoctoral researcher, the research unit must prioritize questions that offer the highest empirical leverage while minimizing the risk of pursuing theoretically elegant but experimentally inert pathways. The proposed agenda orders the four lines of inquiry based on their upstream-downstream logical dependencies, their tractability within the resource envelope, and the risk that resolving one question renders the others moot.

  #### 1. The Ordering of Effort

  **Primary Focus (Months 1–24): Line of Inquiry 2 (FEP Variational Formalism vs. Hierarchical Predictive Coding)**
  The majority of the postdoctoral effort (approximately 60%) must be directed toward determining whether the Free Energy Principle (FEP) variational formalism produces empirically distinguishable predictions from standard Hierarchical Predictive Coding (HPC). This should take the form of comparative computational modeling and simulation.

  **Parallel Track (Months 1–18): Line of Inquiry 1 (Active Inference vs. Expected Utility)**
  A secondary portion of effort (approximately 25%) should run parallel to the primary focus, addressing the decision-theoretic status of Active Inference. This work should not aim for a definitive philosophical resolution but rather to establish the boundary conditions under which Active Inference diverges from Expected Utility maximization in simulated agents.

  **Conditional Phase (Months 19–36): Line of Inquiry 3 (Precision-Weighting and Neuromodulation)**
  The remaining effort (approximately 15%) is reserved for the final year, contingent on positive results from the Primary Focus. This phase involves mapping the computational signatures identified in the first two years onto existing neurophysiological datasets to propose specific neuromodulatory hypotheses.

  **Actively Deprioritized (0% Allocation): Line of Inquiry 4 (Extension to Social/Developmental/AI Systems)**
  This line of inquiry should be explicitly excluded from the three-year plan. Effort here is prohibited until the core mechanistic and formal claims are validated.

  #### 2. Defense of the Ordering: Dependency Structure

  The ranking is dictated by the logical dependency structure among the questions. Lines of Inquiry 1 and 2 constitute the **foundational layer**, Line of Inquiry 3 constitutes the **mechanistic layer**, and Line of Inquiry 4 constitutes the **scalability layer**.

  **Why Line 2 is Upstream of Line 3**
  Line of Inquiry 3 (neuromodulatory mapping) is downstream of Line of Inquiry 2 (formalism distinguishability). Precision-weighting is a computational construct; to map it biologically, one must first prove that the specific FEP formulation of precision generates behavior or learning dynamics that differ from standard HPC. If Line 2 is resolved negatively (i.e., FEP is merely a redescription of HPC with no divergent predictions), then Line 3 loses its specific theoretical motivation. In that scenario, searching for "FEP-specific" neuromodulatory circuits becomes a category error; the search would revert to standard Bayesian neural coding, rendering the specific FEP-driven experimental design moot. Therefore, Line 2 must be settled to define *what* biological signal Line 3 should look for.

  **Why Line 2 is Prioritized Over Line 1**
  While Line 1 (decision-theoretic distinctness) is conceptually upstream of Line 2, it is less tractable and carries a higher risk of semantic stalemate. Two theories can be mathematically equivalent in the limit (Line 1 resolved as "restatement") yet diverge significantly in finite-sample learning dynamics or biological plausibility (Line 2 resolved as "distinguishable"). For a resource-constrained unit, empirical distinguishability (Line 2) is the more valuable deliverable. If the models behave differently in simulation, the decision-theoretic equivalence becomes a secondary philosophical concern rather than a practical blocker. Conversely, if Line 2 shows no empirical difference, resolving Line 1 becomes irrelevant for experimental neuroscience. Thus, Line 2 is the empirical gatekeeper for the relevance of Line 1.

  **Why Line 4 is Deprioritized**
  Line 4 (extensions) is the furthest downstream. Extending a framework to social or artificial systems presupposes that the framework is valid for the individual biological agent. If Line 2 reveals the formalism to be empirically vacuous, or if Line 3 fails to identify a plausible biological mechanism, extending the framework to complex systems risks propagating foundational errors at a larger scale. Furthermore, Line 4 requires parameter rescaling or theoretical revision that cannot be intelligently guessed without the constraints provided by Lines 2 and 3. Pursuing Line 4 now creates a high risk of building speculative models on unverified foundations.

  #### 3. Tractability and Resource Constraints

  The allocation reflects the capacity of a single postdoctoral researcher over three years.

  *   **Line 2 (High Tractability):** Comparative simulation studies are well-suited to a single researcher. They require computational resources rather than expensive equipment or large teams. This ensures a high probability of publication and tangible deliverables within the timeline.
  *   **Line 1 (Moderate Tractability):** By limiting this track to boundary conditions in simulated agents rather than broad philosophical argumentation, it remains within the skill set of a computational researcher. It supports Line 2 without requiring a separate expertise in decision theory or philosophy.
  *   **Line 3 (Low Tractability):** Direct experimental mapping of neuromodulatory circuits typically requires wet-lab infrastructure, animal ethics approvals, or large-scale human neuroimaging consortia, which exceeds the capacity of one postdoc. By restricting this to the analysis of *existing* datasets guided by Line 2's predictions, the project remains feasible.
  *   **Line 4 (Variable Tractability, High Risk):** While simulations of social systems are computationally feasible, the interpretative burden is high. Without the grounding of Lines 2 and 3, any results here would be difficult to defend against claims of arbitrariness.

  #### 4. Risk Assessment: Mootness and Downstream Consequence

  The primary risk management strategy is to prevent the "mootness" of downstream efforts.

  *   **Risk of Mootness:** If the unit prioritizes Line 3 (mechanism) first, it risks identifying neuromodulatory correlates for a computational construct that does not uniquely predict behavior (Line 2 failure). This would result in a biologically precise map of a theoretically redundant concept. By prioritizing Line 2, the unit ensures that any biological mapping (Line 3) is targeting a mechanism that offers explanatory power beyond existing models.
  *   **Magnitude of Downstream Consequence:** Resolving Line 2 positively (FEP offers unique predictions) validates the entire research program, enabling Line 3 to proceed with high confidence and eventually Line 4. Resolving Line 2 negatively saves the unit from wasting years on Lines 3 and 4, allowing for a strategic pivot. Thus, Line 2 has the highest information value.
  *   **Trade-off:** The trade-off is delaying the high-impact appeal of Line 4 (social/AI applications). However, this is a necessary sacrifice. A robust, validated core theory (Lines 1 & 2) with a tentative biological link (Line 3) is scientifically more valuable than a broad, speculative application (Line 4) built on unverified assumptions.

  #### 5. Summary of Allocation

  | Line of Inquiry | Priority | Allocation | Justification |
  | :--- | :--- | :--- | :--- |
  | **2. Formalism (FEP vs. HPC)** | **First** | **60%** | Empirical gatekeeper; determines if the math yields unique predictions. High tractability. |
  | **1. Decision Theory (AIF vs. EU)** | **Parallel** | **25%** | Defines boundary conditions for Line 2; prevents interpretative ambiguity. |
  | **3. Mechanism (Neuromodulation)** | **Second** | **15%** | Downstream of Line 2; restricted to existing data analysis to fit constraints. |
  | **4. Extensions (Social/AI)** | **Drop** | **0%** | Premature scaling; high risk of mootness if core theory is invalid. |

  This agenda ensures that the research unit produces a definitive verdict on the empirical utility of the Free Energy Principle before committing resources to biological implementation or theoretical expansion. It maximizes the probability of high-impact output while minimizing the risk of pursuing a theoretically elegant but experimentally dead-end pathway.
