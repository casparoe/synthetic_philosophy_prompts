  3.  **Brainstorm Candidate Tensions (Mental Sandbox):**
      *   *(1) vs. (3):* Lewis's big problem. Simple counterfactual dependence fails in preemption (the effect doesn't depend on the preempting cause because the backup would have done it). If (1) is strict dependence, (3) is false. If (3) is true, (1) needs "chaining" or "influence," but the user specified "clean deterministic sense."
      *   *(1) vs. (6):* (1) says causation *is* counterfactual dependence. (6) says counterfactuals are eliminable bookkeeping for interventions. Is causation metaphysical dependence or methodological manipulation? Woodward distinguishes these, but the user seems to conflate the *definition* (1) with the *elimination* (6).
      *   *(2) vs. (5):* (2) says claims should be invariant. (5) says structure is identifiable from interventions. This seems mostly consistent (Woodwardian), but "identifiable" is a strong claim. What about latent confounders? Even with interventions, if you can't intervene on every node, can you identify the structure? The commitment says "Give me enough well-chosen interventions." This might be technically true but practically/metaphysically loaded.
