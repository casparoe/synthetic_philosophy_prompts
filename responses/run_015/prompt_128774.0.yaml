  You and your colleague agree on the facts: the dynasty fell because of a prolonged fiscal crisis and a newly circulated religious movement. You also agree that either one, standing alone, was sufficient to bring the state down. The dispute is not about what happened, but about how these two sufficient causes relate to one another and to the truth. To navigate this dispute without relying on jargon, answer the following four questions in order. Note that to keep this map usable, later questions are only asked if your earlier answers leave them unresolved.

  **The Decision Tree**

  **1. The Symmetry Question**
  *Claim:* The fiscal crisis and the religious movement are interchangeable triggers (Symmetric), OR one cause is the primary engine while the other is merely a symptom or accelerator (Hierarchical).
  *   **If Symmetric:** Proceed to Question 2.
  *   **If Hierarchical:** Proceed to Question 2.

  **2. The Substitution Question**
  *Claim:* You can replace the explanation of the crisis with the explanation of the movement without losing any understanding of the fall (Permissible), OR each explanation captures a distinct "causal residue" that the other misses (Impermissible).
  *   **If Permissible:** Stop. (Go to Leaf A or E).
  *   **If Impermissible:** Proceed to Question 3.

  **3. The Magnitude Question**
  *Claim:* The sheer scale of the collapse makes citing both causes mandatory (Obligatory), OR citing both is epistemically suspicious or merely redundant (Non-Obligatory).
  *   **If Non-Obligatory:** Stop. (Go to Leaf B or F).
  *   **If Obligatory:** Proceed to Question 4.

  **4. The Modal Fragility Question**
  *Claim:* If you removed one cause, the dynasty would still fall in nearly all nearby scenarios (Robust), OR if you removed one cause, the dynasty’s survival would become genuinely possible (Fragile).
  *   **If Fragile:** Go to Leaf C or G.
  *   **If Robust:** Go to Leaf D or H.

  ***

  **The Leaves**

  **Leaf A (Symmetric + Permissible)**
  *Position:* Deflationary Minimalism
  *Awkward Commitment:* It commits you to treating profound historical turning points as interchangeable administrative errors where the specific content of the cause does not matter.

  **Leaf B (Symmetric + Impermissible + Non-Obligatory)**
  *Position:* Causal Pluralism (Weak)
  *Awkward Commitment:* It forces you to admit that adding more true causes to an explanation sometimes makes the account worse rather than better.

  **Leaf C (Symmetric + Impermissible + Obligatory + Fragile)**
  *Position:* Mechanism-Based Explanation
  *Awkward Commitment:* It requires you to claim the dynasty would have survived if either the tax collectors or the priests had taken a single day off.

  **Leaf D (Symmetric + Impermissible + Obligatory + Robust)**
  *Position:* Unnamed (Unoccupied)
  *Diagnosis:* Unattractive; it asserts distinct causes are both necessary for understanding yet redundantly sufficient across all nearby possibilities.

  **Leaf E (Hierarchical + Permissible)**
  *Position:* Covering-Law Model
  *Awkward Commitment:* It demands you treat the dominant cause as a universal law that swallows the specific context of the religious movement.

  **Leaf F (Hierarchical + Impermissible + Non-Obligatory)**
  *Position:* Unnamed (Unoccupied)
  *Diagnosis:* Incoherent; if one cause dominates, the other should be substitutable as a mere symptom rather than holding distinct residue.

  **Leaf G (Hierarchical + Impermissible + Obligatory + Fragile)**
  *Position:* Narrative Explanation
  *Awkward Commitment:* It binds the outcome to a specific chain of events so tightly that changing one link breaks the story entirely.

  **Leaf H (Hierarchical + Impermissible + Obligatory + Robust)**
  *Position:* Unnamed (Unoccupied)
  *Diagnosis:* Incoherent; it implies a hidden hierarchy that survives even when the dominant cause is removed, contradicting the definition of dominance.

  ***

  **Revision Statement**

  I would revise this taxonomy if presented with a robust case of **preemptive causation** where one cause (e.g., the fiscal crisis) cuts off the other (the religious movement) before it can fully act, yet both are cited as essential to the *timing* of the fall. This scenario would blur the distinction between Leaf E (Hierarchical) and Leaf G (Narrative), suggesting that "Hierarchy" and "Fragility" are not mutually exclusive in the way I have structured Question 4. The precise step in my construction most likely to fail is the **conditional bypassing of Questions 3 and 4 for "Permissible" substitution cases**; a theorist might argue that even if explanations are substitutable, the magnitude of the event still obligates a multi-causal account for reasons of completeness, which my tree currently forces into a terminal leaf too early.
