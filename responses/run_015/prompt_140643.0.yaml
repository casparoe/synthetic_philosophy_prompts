      *   *Verdict:* It's a useful heuristic for the discussion, but philosophically it likely collapses into "Real" (if the output is indistinguishable and autonomous) or "Counterfeit" (if the internal state is purely algorithmic optimization). However, for a film club, it's a great *phenomenological* category (how it feels to watch her).

