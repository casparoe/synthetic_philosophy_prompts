          *   *Statistician (ML side):* Untestable, arbitrary due to uncomputability of Kolmogorov Complexity (KC) and dependence on reference machine (Turing machine choice). Risk of ad hoc heuristics masquerading as theory.
          *   *Philosopher:* It's an idealization (like frictionless planes). Invariance theorem means machine choice only adds a constant.
          *   *PI:* Agrees with Philosopher. Constant washes out. Only using as a benchmark, not an algorithm.
      *   **Task:** Draft a pre-vote memo (Fund, Reject, or Fund with Conditions).
      *   **Requirements:**
          *   Provide reasons the PI can push back on (substantive critique, not just scores).
          *   State the losing side's best argument at full strength (steel-manning).
          *   Explicitly address whether the "additive constant" reply holds water for *finite* datasets.

  2.  **Determine the Recommendation:**
      *   *Option A: Fund.* Risky. The uncomputability issue is real. Approximations are already what MDL does. Hard to justify 3 years for something theoretically impossible to compute exactly.
      *   *Option B: Reject.* Harsh. Theoretical work has value. But the "usable approximation" claim is suspect.
      *   *Option C: Fund with Conditions.* Best middle ground. Acknowledge theoretical value but constrain the "usable benchmark" claim. Force clarity on the reference machine and finite data limitations.
      *   *Decision:* **Fund with Conditions.** This allows the theoretical exploration (pleasing philosophers) while mitigating the risk of pseudoscientific benchmarking (pleasing statisticians). It creates the most fruitful ground for the memo's required analysis.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject, Recommendation).
