          *   Then distinguish from standard *divide-and-conquer*. In D&C, the merge is trivial (sorting numbers). In HCH, the merge is *interpretive* (synthesizing arguments).
          *   *Order:* Limits of single pass -> Decomposition -> The "Glue" (Synthesis) -> Recursion.

      *   **2. The One Concrete Question:**
          *   *Criteria:* Needs to be complex, ambiguous but not moralistic, requires synthesis, not just calculation.
          *   *Bad:* Math (too deterministic), Moral (too emotional/subjective), Trivia (just lookup).
          *   *Good:* Policy analysis, System design trade-off, Historical causality.
          *   *Selection:* "Should our city ban private cars in the center?" (Too political?). "How do we migrate this legacy codebase to microservices without downtime?" (Too technical?).
          *   *Better:* "What actually caused the 2008 financial crisis?" (Complex, factual but interpretive, requires weighing factors).
          *   *Best for Pub/Coders:* "Design a reputation system for this very discussion group that prevents cliques but encourages regulars." (Meta, relatable, requires balancing competing values, no single right answer).
          *   *Wait, let's refine:* The prompt asks for *criteria* mostly, but a suggestion helps. Let's suggest a "Policy + Mechanism" question. "How should we allocate the pub's budget for snacks vs. drinks for the next year?" (Too trivial).
          *   *Decision:* "Evaluate the proposal: 'We should switch this group to a reading circle format instead of discussion.'" It requires weighing pros/cons, predicting outcomes, and synthesizing values (learning vs. socializing).
          *   *Actually, looking at the "Splitting Labour vs Question" point:* A better question is one where *information gathering* is distinct from *judgment*.
          *   *Revised Selection:* "Is this specific open-source library safe to use for our next project?" (Requires checking docs, checking issues, checking license, then synthesizing risk).
          *   *Wait, keep it general:* "Should we adopt a four-day workweek?" (Teachers and coders both have stakes, factual + value-based).
          *   *Let's stick to the criteria:* Needs *interdependent sub-questions*. If sub-questions are independent, it's just MapReduce. The synthesis must be non-trivial.

      *   **3. Misconceptions:**
          *   *Expected:* "Just delegation" (No, it's recursive amplification), "Bottom humans do work" (No, the *structure* does the work), "Superintelligence" (It's a capability ceiling, not magic), "Who splits?" (The top node).
          *   *Unexpected:* "Infinite regress" (Where does it stop?), "Context Loss" (Does the bottom node know *why* they are answering?), "Honesty" (What if a node lies?).
          *   *Timing:* Address "Just delegation" early. Address "Superintelligence" late (as a limit case). Address "Who splits" during the mechanism setup.

      *   **4. Splitting Question vs. Splitting Labour:**
          *   *Insight:* This is crucial. Splitting the *question* is decomposition (What is X made of?). Splitting *labour* is parallelization (You check A, I check B).
          *   *HCH relies on Question Splitting.* Labour splitting is just efficiency. Question splitting changes the *cognitive load*.
          *   *Placement:* This belongs in the "Why isn't this just Divide-and-Conquer?" section.

      *   **5. Idealization vs. Psychology:**
          *   *Risk:* Early = Boring disclaimer. Late = Confusion.
          *   *Strategy:* Frame it as "A model of *effective* reasoning" first. Reveal the AI connection mid-way as "This is where the AI folks got it." Reveal the "Idealization" at the end as "This is why we fail at it."
          *   *Actually:* The host wants to discuss *good deliberation*. So frame it as "A blueprint for thinking" from the start. The AI stuff is the *origin*, not the *point*.

      *   **6. End Check:**
          *   *Idea:* Give a broken decomposition.
          *   *Example:* Question: "Is this restaurant good?" Sub-questions: "Is the floor clean?" "Is the music loud?" (Misses food quality). Or: "What is 2+2?" Sub-questions: "What is 2?" "What is +?" (Over-splitting).
          *   *Better:* A question where the synthesis fails. "Should I take this job?" Sub-answers: "Salary is high." "Commute is long." (Missing: "Do you like the work?"). The *tree* didn't capture the *value*.

      *   **7. Omissions:**
          *   *Distillation/Imitation:* (How to make the AI faster). Cost: You lose the "scaling" aspect.
          *   *Training Dynamics:* (How to actually train the model). Cost: Irrelevant for deliberation focus.
          *   *Safety/Alignment specifics:* (Reward hacking). Cost: Misses the "why we need this" for AI, but fine for deliberation focus.

  4.  **Drafting the Plan (Iterative refinement):**

      *   *Tone:* Collaborative, pub-friendly, respectful of the "no philosophy training" constraint. Use coder analogies (stack traces, recursion depth, API contracts).
      *   *Structure:*
          *   0-15: Warm-up (The bottleneck).
          *   15-30: The Mechanism (HCH basics).
          *   30-60: The Exercise (The Concrete Question).
          *   60-75: The Twist (Idealization vs. Reality).
          *   75-90: Check & Close.

      *   *Refining the "Concrete Question":* It needs to be something where the *composition* is the hard part.
      *   *Suggestion:* "Write a one-paragraph recommendation on whether our group should continue meeting here."
      *   *Why:* Requires data (cost, noise, comfort), judgment (value of atmosphere), and synthesis (weighing cost vs. vibe).
      *   *Split:* One person checks cost. One checks noise. One checks comfort. *Host* synthesizes.
      *   *Wait, the group needs to do the splitting.*
      *   *Okay, the question is:* "How do we know if a technical decision is reversible?"
      *   *Sub-questions:* "What is the cost of rollback?" "What is the cost of data migration?" "What is the social cost of telling users?"
      *   *Synthesis:* Weighing these against each other.
      *   *Let's go with the "Reversible Decision" example.* Coders get it. Teachers get it (curriculum changes).

      *   *Refining the "Splitting Question vs Labour":*
          *   Labour: "You read pages 1-50, I read 51-100." (Same cognitive task).
          *   Question: "You assess risk, I assess benefit." (Different cognitive tasks).
          *   HCH needs Question Splitting.

      *   *Refining the "Idealization" reveal:*
          *   Don't hide it, but don't lead with it. "This is a model of *ideal* reasoning." Then later, "AI researchers use this to..." Then finally, "Humans can't actually do this perfectly, which is why deliberation fails."

  5.  **Final Polish:**
      *   Ensure the "Misconceptions" section addresses the *unexpected* ones (e.g., "The Context Problem" - sub-agents don't know the big picture).
      *   Make sure the "Omissions" clearly state the *cost* of skipping them.
      *   Check timing. 90 mins is tight. Keep the lecture parts short.

  6.  **Writing the Response:** (Aligning with the user's requested structure).
      *   *Section 1: Prerequisites & Order.*
      *   *Section 2: The Concrete Question.*
      *   *Section 3: Misconceptions.*
      *   *Section 4: Question vs. Labour.*
      *   *Section 5: Idealization Timing.*
      *   *Section 6: End Check.*
