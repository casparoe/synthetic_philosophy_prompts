          6.  End Check (structural understanding vs. vibe).
          7.  Omissions (what to skip and the cost).

  2.  **Deconstruct HCH/Factored Cognition for this Audience:**
      *   *Core Concept:* A human can answer hard questions by breaking them into sub-questions, asking other humans (or themselves at another time) those sub-questions, and synthesizing the answers. Recursively.
      *   *The Host's Twist:* This isn't about building a tree of APIs; it's about what *thinking well* looks like.
      *   *Audience Profile:* Coders understand recursion, decomposition, and system design. Teachers understand pedagogy, scaffolding, and group dynamics. This is a strong mix.

  3.  **Address Specific Requests:**

