answer: |-
  You have a very sharp eye for the machinery of social construction. You are describing a specific, robust mechanism that sits at the intersection of Science and Technology Studies (STS), economic sociology, and critical data science. You are also right to be dissatisfied with the standard labels. "Self-fulfilling prophecy" is too psychological and one-off; "endogeneity" is too statistical and ontologically thin; and your hesitation about Hacking is warranted, though perhaps not for the reason you think.

  Here is the carving you need, distinguishing the nearby concepts, answering your specific constraints, and offering a term if you decide to claim the novelty.

  ### 1. The Landscape of Existing Concepts

  **(a) Which existing concept fits best?**

  The strongest existing theoretical home for this is **Barnesian Performativity** (derived from Michel Callon and Donald MacKenzie), but it needs to be coupled with **Hacking's Looping Effects** to capture the *re-estimation* aspect.

  *   **Hacking's Looping Effects:** You are half-right to set this aside. Hacking's paradigmatic cases (the autistic child, the multiple personality) involve the *classified* changing their self-conception. However, Hacking's formal definition of an "interactive kind" is broader: it is any kind where the *classification itself* causally affects the *extension* of the kind. In your policing case, the "kind" is *High-Crime Neighbourhood*. The classification causes more patrols, which causes more arrests, which changes the extension of the kind. Hacking *does* allow for institutional loops, but the literature has heavily favoured the psychological/identity pathway. If you use Hacking, you must explicitly argue for an **Institutional Looping Effect** (where the feedback runs through the measurer, not the measured).
  *   **Barnesian Performativity:** This is the better fit for the "laundering" and "robustness" features. MacKenzie distinguishes between *generic* performativity (a theory is used) and *Barnesian* performativity (the use of the theory makes the world *more like* the theory). This captures your bank run and risk score cases perfectly: the model of risk makes the risk real. It also captures the "vocabulary laundering": performativity often works by installing new metrics (rates, scores) that replace qualitative judgment, making the construction look like a discovery.
  *   **Goodhart's / Campbell's Law:** These are near-misses. They describe *distortion* (people gaming the metric). Your cases describe *constitution* (the metric creating the reality). In your medical case, the patients aren't gaming the test; the test is finding things it wouldn't have found otherwise.
  *   **Surveillance Bias (Epidemiology):** This fits the mechanism of your medical and policing cases (more looking = more finding) but lacks the ontological claim. It treats the bias as an error to be corrected, whereas you are describing a system that *settles* into a stable, robust reality.

  **Verdict:** The phenomenon is **Barnesian Performativity** driven by **Institutional Looping**. If you need a single label from the literature, **Performativity** is the heavyweight champion, but you must specify it is *measurement-driven* performativity, not *agent-driven*.

  **(b) Is the "evidence-base loop" vs. "self-understanding loop" a real distinction?**

  **Yes, it is a real and crucial distinction.**
  In Hacking's classic looping, the *target* has agency (the person labelled "refugee" starts acting like a refugee). In your cases, the *target* may be passive (the neighbourhood, the bank, the silent patient). The agency lies with the *observer/institution*.
  *   **Why it matters:** If the loop runs through self-understanding, you can break it by changing the narrative (empowerment, destigmatization). If the loop runs through the evidence-base (your cases), changing the narrative does nothing. You have to break the *measurement apparatus* (stop patrolling, stop testing).
  *   **Theoretical implication:** This moves the phenomenon from the philosophy of mind/identity (Hacking) to the philosophy of measurement/infrastructure (STS/Metrology).

  **(c) The "Recording Only" Case (Underlying rate identical, numbers move)**

  **This is the same phenomenon, and it is the more important target for a paper.**
  *   **Why:** In the "reality changes" case (bank run), one can argue the fragility was "latent" and the panic just "triggered" it. There is a whisper of realism there. In the "recording only" case (policing/medical), the underlying reality *does not change*, yet the *social fact* (the crime rate, the risk score) changes and drives resource allocation.
  *   **The Punchline:** This demonstrates that the "kind" is *entirely* a product of the measurement interface. It proves the "robustness" you described is an *administrative* robustness, not an empirical one.
  *   **Name:** In data science, this is often called **Label Bias** or **Feedback Bias**. In social theory, this is **Pure Performativity** (the theory creates the data without changing the world).
  *   **Recommendation:** Focus on this. It's the stronger claim. It shows that "empirical robustness" is compatible with "ontological emptiness."

  **(d) Does reflexivity (everyone knows about the loop) matter?**

  **No.** This is a key feature that distinguishes it from ideology or false consciousness.
  *   **Why:** In ideology critique, if you reveal the mechanism, the spell breaks. In your cases, the loop is *structural*. The police chief may know the data is biased by patrols, but if he reduces patrols, his crime numbers drop, and he gets fired for "ignoring crime." The system selects for the loop.
  *   **Term:** This is **Structural Reflexivity** or **Institutional Lock-in**. The loop persists because the *incentives* are aligned with the *bias*, not because people are ignorant.

  **(e) The Runaway Version (Oscillation/Escalation)**

  **This is a systems dynamics distinction, not a different phenomenon.**
  *   **Settled Loop:** Negative feedback dominates eventually (resources run out, thresholds max out). This leads to **Reification** (the kind looks natural).
  *   **Runaway Loop:** Positive feedback dominates. This leads to **Instability** or **Crisis** (the bank collapses, the neighbourhood is emptied).
  *   **Name:** In control theory, this is **Positive Feedback** vs. **Homeostasis**. In social science, the runaway version is often called a **Cascading Failure** or **Runaway Feedback Loop** (specifically used in the predictive policing literature, e.g., Ensign et al.).
  *   **Verdict:** It's the same animal in a different regime. The "settled" version is more insidious for a paper on social construction because it hides itself better.

  ---

  ### 2. If You Need to Coin a Term

  If you decide the existing literature is too fragmented (Hacking is too psychological, Performativity is too broad, Endogeneity is too statistical), here is a coined term that tightens the definition for your paper.

  **Term:** **Constitutive Stabilization**

  **Definition:** A process wherein an institutional classification alters the behavior of *third-party observers* (not necessarily the classified), generating data that confirms the classification. This data is used to re-estimate the classification criteria, causing the kind to drift until it stabilizes. The stability of the resulting data creates the appearance of naturalness, laundering the institutional origin of the kind.

  **In/Out Criteria:**
  *   **IN:** Predictive policing models that send cops to where they already arrest people; Medical risk scores that trigger tests which find the conditions they predict; Credit scores that raise interest rates causing the default they predicted.
  *   **OUT:**
      *   *Self-fulfilling prophecy (Classic):* A teacher thinks a student is smart, the student feels confident and works harder. (Mechanism: *Target's* self-conception).
      *   *Goodhart's Law:* A school teaches to the test to boost scores without improving learning. (Mechanism: *Target's* gaming/adaptation).
      *   *Ideology:* Workers believe they are paid fairly despite exploitation. (Mechanism: *False belief*, no data feedback loop).

  **Near-Misses (for your "Careless Reader" warning):**
  *   **The Observer Effect:** In physics, measuring changes the state. In social science, this is often used loosely. *Distinction:* The Observer Effect is usually immediate and physical. Constitutive Stabilization is iterative, administrative, and relies on *re-estimation*.
  *   **Path Dependence:** History locks in a solution. *Distinction:* Path dependence doesn't require a *feedback loop of evidence*. It just requires high switching costs. Constitutive Stabilization actively *generates evidence* to justify the path.

  ### 3. Summary Advice for the Paper

  1.  **Anchor in Hacking, Pivot to Performativity:** Acknowledge Hacking's *Looping Effects* as the genealogy, but explicitly state you are analyzing the **Institutional Variant** (loop through measurement, not identity). Then bring in MacKenzie's **Barnesian Performativity** to explain the "laundering" (how the model makes the world look like the model).
  2.  **Focus on the "Recording Only" Case:** This is your killer argument. It proves that "empirical robustness" is not evidence of "natural kind."
  3.  **Use "Constitutive Stabilization":** Even if you don't coin it as a proper noun, use this phrase to describe the *outcome*. It captures the "made but robust" paradox better than "reification" (which implies the making is forgotten) or "construction" (which implies it's fragile).
  4.  **Address the Reflexivity:** Explicitly note that knowledge of the loop does not stop it. This moves your argument from "we need to educate people" to "we need to dismantle the measurement infrastructure."

  You have identified the mechanism by which **bureaucracy becomes ontology**. That is a very strong paper. Don't let the lack of a single perfect noun stop you; the lack of a noun is exactly why the phenomenon is so powerful (it operates in the gaps between disciplines).
