answer: |-
  It's last orders at the Rusty Anchor, and the lights are half-off. Jimmy and Billy are staring at the barman, who's aggressively wiping the same glass for the past ten minutes.

  Jimmy shifts his weight. "Look, it's a live, forced, and momentous option. Either I believe we can get one more pint, or I lose the truth of it forever. I'm exercising my will to believe."

  Billy adjusts his spectacles. "You haven't got sufficient evidance. The man is stacking stools. To believe otherwise is reckless."

  "Fine," Jimmy says, leaning on the counter. "Compromise. I'll put the belief in doxastic escrow. I'm parking it in provisional holding. I won't fully adopt 'the bar is open' until the pint is in my hand."

  Billy shakes his head, looking genuinely pained. "You can't do that, chap. Even parking it in escrow influences your behaviour. You're leaning on the bar. You're expecting service. That's action based on insufficient evidence. It's wrong, always, everywhere, and especially here in the centre of London."

  "But if I wait for evidence, the opportunity vanishes!" Jimmy protests.

  "Better to miss the truth than to be epistemically corrupt," Billy says, backing towards the door.

  The barman clicks the lock. Jimmy's inside. Billy's outside.

  Jimmy bangs on the glass. "See! My will couldn't even keep it open!"

  Billy shouts through the letterbox, "No, my ethics kept me safe! You're locked in with a false belief, and I've got the key because I recognised the evidence!"

  Jimmy slides down the door. "Yeah, but you're going home to water."

  "And you," Billy calls out, walking off into the night, "are staying here with your passional nature. Hope it tastes like lager."
