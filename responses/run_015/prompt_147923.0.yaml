  | Replicator/Vehicle | Pass | Fail | Pass | Fail | Fail |
  | Causal-Partitioning | Pass | Negotiable | Pass | Pass | Pass |

  Gene-level fails simultaneity (Case b). Statistical MLS fails causality (Case g). Replicator/Vehicle struggles with transitions (Case e) and non-genetic (Case f). Causal-Partitioning best fits but struggles with tractability. Only Causal-Partitioning meets the core purpose of guiding measurement while respecting causal reality.

  6. The constructed cases
  **Case (d):** Is the pair a unit? My list requires measuring **fitness interdependence** and **heritable variance of the pair**. If the joint output's variance is heritable and distinct from individual variances, the pair is a unit. The theory must specify measuring the covariance between partner traits and joint fitness. If the list requires strict reproduction, it runs out; if it requires heritable variance, it passes. To decide, measure whether variation in the pair's composition predicts variation in pair survival independent of individual traits.

  **Case (f):** Non-genetic inheritance. My list marks this **Negotiable**. To cover this, the definition of "heritability" must broaden beyond DNA to include cultural/behavioral transmission. If the theory restricts inheritance to genetics, it excludes Case (f). Given the purpose is empirical guidance, excluding observable inheritance channels is a failure. The list should be revised to Non-negotiable for general evolutionary theory. If it remains negotiable, the theory admits it is not a general theory of selection.
