  1. The purpose
  I accept the purpose, with one revision: you cannot fully sever empirical guidance from metaphysics. To tell a biologist "what to measure" is to claim something about what causally exists. If the account treats levels as mere bookkeeping, it fails to guide intervention. Therefore, the purpose must demand causal specificity, not just statistical partitioning. This shifts the list away from purely mathematical consistency toward causal identifiability. The goal remains pragmatic, but the means must be ontologically robust enough to distinguish cause from correlation. If the theory cannot distinguish causal forces, it cannot tell a biologist what to manipulate.

  2. Desiderata
  1. **Causal Specificity:** The account must distinguish causal selection from statistical covariance. Motivated by Case (g), where partitions agree on totals but disagree on components. If the theory cannot identify which component reflects actual causality, it cannot guide measurement. A biologist needs to know which variable to manipulate, not just which covariance exists. Without this, the theory is descriptive, not explanatory. **Status: Non-negotiable.**

  2. **Empirical Tractability:** Requirements must be measurable with field data (relatedness, fitness components), not just complete causal graphs. Motivated by the Purpose. A theory requiring unobtainable data is useless to a working biologist. It must operate with the imperfect proxies available in natural populations. If it demands full causal reconstruction, it fails the "what to measure" test. **Status: Non-negotiable.**

  3. **Multi-level Simultaneity:** The account must permit several levels to be genuine units simultaneously and to conflict. Motivated by Case (b) (within-genome conflict) and Case (c) (infectious lineage). In (b), genes and organisms conflict. In (c), cell lineage and host fitness diverge. Reductionism fails here because both levels show heritable variance in fitness. Denying one level obscures the conflict. **Status: Non-negotiable.**

  4. **Transition Sensitivity:** The theory must account for the appearance and disappearance of levels. Motivated by Case (e) (major transitions). It must specify when a level ceases to act as a unit, such as when variance is suppressed in somatic cells. A static definition of "unit" cannot handle the dynamic loss of lower-level fitness. It must explain the death of a level. **Status: Non-negotiable.**

  5. **Inheritance Generality:** The account should extend to non-genetic inheritance or explicitly exclude it with justification. Motivated by Case (f). If the purpose is general evolutionary guidance, restricting to DNA is a camp preference. If the trait spreads and raises group survival, it fits the functional definition of selection. Excluding it limits the theory's scope arbitrarily. **Status: Negotiable (but should be Non-negotiable for generality).**

  6. **Lower-level Parsimony:** "Never invoke a higher level when a lower-level account plus population structure will do." Motivated by Case (a) and gene-selectionist intuitions. However, this often begs the question against emergent causality. Sometimes the higher-level description is the only tractable one. Insisting on reduction can obscure the actual mechanism. **Status: Camp Preference.**

  7. **Unique Partition:** "Give a unique partition of total change." Motivated by desire for clarity. However, mathematically, multiple partitions are valid. Demanding uniqueness without causal grounding is impossible. It treats a mathematical choice as a biological fact. **Status: Camp Preference/Question-begging.**

  8. **Adaptation Locus:** Say at which level adaptation accumulates. Motivated by Purpose. Essential for identifying design. In Case (c), is the adaptation for the host or the lineage? The theory must decide. Without this, the biologist cannot predict evolutionary trajectories. **Status: Non-negotiable.**

  3. Joint unsatisfiability
  Three tensions arise within this list. First, **Causal Specificity** conflicts with **Empirical Tractability**. Identifying true causal paths often requires experimental manipulation or complete graphs, whereas field data offers only statistical correlations. A theory satisfying tractability often sacrifices causal depth, becoming merely descriptive. To know what to measure, you often need to know the cause; to know the cause, you often need data you cannot measure.

  Second, **Unique Partition** conflicts with **Model Equivalence**. Case (g) notes that partitions can agree on totals while disagreeing on components. Mathematics allows multiple valid decompositions. Demanding a unique statistical partition is mathematically false; demanding a unique causal partition is empirically hard. You cannot have both uniqueness and purely statistical input. A theory promising uniqueness usually hides causal assumptions in the math.

  Third, **Transition Sensitivity** conflicts with strict **Unit Definitions**. Case (e) involves levels dissolving. A rigid definition of "unit" (e.g., requiring reproduction) may fail to capture the process of a level ceasing to be a unit. A theory strict on units fails during transitions; a theory flexible on units risks vagueness. You cannot have precise boundaries and handle fuzzy transitions simultaneously without a theory of boundary dissolution.

  4. The decisive requirement
  The decisive requirement is **Causal Specificity** (independent of arbitrary model choice). This excludes pure statistical partitioning approaches (like some uses of the Price equation) that treat all decompositions as equally valid descriptions. It also excludes strict gene-selectionism that denies higher-level causality by fiat rather than measurement. If a theory cannot distinguish between a statistical artifact and a causal force, it cannot tell a biologist what to measure to intervene. It reduces evolution to bookkeeping rather than mechanism.

