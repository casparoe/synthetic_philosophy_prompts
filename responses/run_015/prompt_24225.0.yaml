      Dear Friend,
      It is wonderful to hear that you are weaving economic theory into the fabric of your new novel, particularly the notion that a character's choices are the primary window into her values. As you delve into revealed preference theory, I urge you to adopt a specific and somewhat austere interpretation of what the theory actually claims about utility, for it aligns strikingly well with your literary project while demanding a rigorous philosophical discipline. You must argue that the utility function within this framework cannot be understood as a measure of a real psychological state, such as satisfaction, happiness, or the intensity of desire, but must instead be viewed as a purely formal device whose sole purpose is to rank alternatives. This formalist reading is not merely a stylistic choice but is forced upon us by the mathematical architecture of the theory itself, specifically the fact that any two utility functions representing the same preference relation differ only by a strictly increasing transformation. Because we can stretch or compress the numerical scale of utility without altering the underlying order of choices, no fact about the amount or intensity of utility is ever fixed by the theory, rendering any claim about the magnitude of happiness or desire scientifically meaningless within this context.

      By insisting on this ordinal interpretation, you rescue the theory from the impossible task of measuring internal states, yet you do so at a significant cost that you should bring to light in your reasoning. If utility is stripped of its cardinal meaning and reduced to a ranking mechanism, then the concept of preference itself is inevitably drained of psychological content. In this light, preference ceases to be a description of an internal longing or a mental inclination and becomes merely a logical reconstruction of observed behavior. What the theory ultimately describes is not the agent's inner life, with its conflicts and passions, but rather a property of the agent's choice function, defined by consistency and transitivity rather than by feeling. This means that when we say a character prefers A to B, we are not saying she feels more drawn to A, but only that she consistently chooses A over B when both are available. For your novel, this suggests a profound truth about characterization, implying that what a person values is not what they claim to feel or what they imagine in the privacy of their thoughts, but solely the pattern of actions they perform when constrained by reality.

      This perspective transforms the economic agent from a soulful individual into a locus of consistent choices, which might seem cold but offers a powerful tool for storytelling. It implies that values are not hidden treasures waiting to be discovered within the psyche but are instead constituted by the choices themselves. If you accept this formalist reading, you acknowledge that revealed preference theory does not explain why a character chooses, but only codifies the structure of those choices. It separates the observable truth of action from the unobservable speculation of motive. Therefore, when you write your character, you are engaging in the same operation as the economist using this theory; you are defining her values through her decisions rather than through her introspections. The theory tells us that we cannot know the intensity of her desire, only the direction of her will, and in doing so, it reminds us that the only accessible truth about human values is the trace they leave in the world through action. I hope this clarification helps you navigate the theoretical underpinnings of your story, allowing you to use the rigor of economics to deepen the mystery and reality of your character's inner world, or rather, to show that her inner world is only real insofar as it is revealed.

      Warmly,
      A Friend

