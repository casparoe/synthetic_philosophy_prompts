answer: |-
  To distinguish a thought experiment that offers evidence from one that merely exerts rhetorical pressure, we must treat the case as a measurement instrument. The specification below outlines the necessary conditions for evidential competence. It demands that the case isolate the variable under investigation without triggering extraneous cognitive heuristics.

  ### The Specification for Evidential Competence

  | Desideratum | Phenomenon It Must Catch | Failure Mode It Must Flag |
  | :--- | :--- | :--- |
  | **Variable Isolation** | The intuition must track the specific philosophical variable (e.g., intent), not narrative texture. | **(a) The Idle Wheel:** Details that shift the feeling without changing the variable. |
  | **Stability** | The verdict must hold across phrasing, ordering, and non-expert populations. | **(b) The Shadow Case:** Verdicts driven by framing effects or unmentioned analogues. |
  | **Modal Coherence** | The scenario must be possible within the rules of the thought experiment's universe. | **(c) The Modal Gap:** Drawing evidence from the incoherence of an impossible premise. |
  | **Semantic Neutrality** | The description must not load the verdict via affective vocabulary. | **(d) Borrowed Intensity:** Swapping thin terms for thick, emotionally charged language. |
  | **Export Clause** | The author must specify what empirical or conceptual change would reverse the verdict. | **Immunisation:** Treating the intuition as self-justifying rather than falsifiable. |

  ### Stands on Methodological Disputes

  Regarding the usual demands placed on cases, we must separate evidential requirements from tribal preferences. **Stability** is not a prejudice of the survey-running camp; it is a genuine requirement. If a verdict flips when 'caused to die' is swapped for 'killed', the intuition is tracking linguistic affect, not metaphysical truth. **Realism**, however, is merely a taste. A zombie case fails not because it is unrealistic, but if it violates Modal Coherence. Finally, appealing to **Specialist Intuition** is special pleading. Unless the concept is technical (like 'entropy'), expertise often signals indoctrination rather than refined perceptual access.

  ### The True Tension

  You candidate the tension between **Spareness** and **Ecological Richness** as the pair of desiderata that cannot be jointly satisfied. This is the true tension. To achieve Variable Isolation, one must strip the case to its bones (Spareness); yet, to engage the reader's ordinary conceptual competence rather than forcing them to guess at an alien logic, one needs narrative texture (Richness). Maximising one inevitably degrades the other. You cannot have a case that is perfectly controlled and fully immersive.

  ### The Most Exclusionary Requirement

  The single requirement that does the most exclusionary work is **Variable Isolation**. If you enforce the demand that every detail in the vignette must be shown to be load-bearing for the verdict, most circulating cases collapse. Narrative vignettes rely on atmosphere to engage the reader; analytic cases often rely on hidden assumptions. Prohibiting the "Idle Wheel" kills the majority of intuition pumps because they rely on unargued texture to secure the verdict.

  ### Evaluation of Case A and Case B

  Your criterion demands Variable Isolation regarding the nurse's culpability for omission. In both Case A (alert switched off) and Case B (alert never installed), the nurse's epistemic state and physical ability to act are identical. She is ignorant of the risk and unable to prevent the death.

  The criterion dictates that the verdict **should not differ**. The causal history of the missing alert (maintenance error vs. policy decision) is an Idle Wheel relative to the nurse's moral responsibility in that moment. If intuitions diverge—perhaps judging the nurse more harshly in A because the missing alert feels like a specific accident rather than background noise—it indicates that blame is being pumped by narrative context rather than argued on the principle of omission. The difference in verdict would signal a failure of Variable Isolation, revealing that the case is measuring sensitivity to causal history, not culpability for ignorance.

  ### Scorecard on Styles

  *   **Spare Analytic Cases:** High on Variable Isolation, but frequently fail Stability across populations.
  *   **Escalating Science-Fiction:** High on Modal Coherence risk, often succumbing to the Modal Gap.
  *   **Realistic Vignettes:** High on Ecological Richness, but notoriously prone to Idle Wheels and Borrowed Intensity.

  \answer{Variable Isolation}
