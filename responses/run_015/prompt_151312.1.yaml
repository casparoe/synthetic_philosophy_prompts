      *   **Role:** Philosophy grad student who has deeply read David Lewis's *Convention: A Philosophical Study* (1969). Not a superficial summary, but deep engagement with the text's nuances.
      *   **Task:** Explain a specific conceptual knot regarding Lewis's definition of convention (common knowledge + arbitrariness) vs. real-world anonymous societies where norms evolve via precedent without explicit common knowledge ("silent conventions").
      *   **Focus:** Do "silent conventions" break Lewis's account? Can we weaken the epistemic condition without collapsing convention into mere regularity? What happens to arbitrariness when institutional design removes alternatives (collapsing convention into law)?
      *   **Constraints:**
