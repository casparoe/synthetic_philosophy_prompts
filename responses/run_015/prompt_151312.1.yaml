answer: |-
  Silent conventions don't break Lewis's account because precedent functions as the public signal that sustains the recursive expectations required for common knowledge, though institutional lock-in does threaten the arbitrariness condition by shifting the primary motive from coordination to compliance.

  Lewis's common knowledge requirement isn't a demand for a mental census where every agent explicitly represents everyone else's mental state; it's a logical condition satisfied when a public signal makes it rational for everyone to expect everyone to expect conformity. In anonymous societies, the precedent *is* that public signal. When I see traffic flowing on the right, that behavior is indicative; it gives me reason to believe you expect me to drive on the right, and reason to believe you believe I have that reason. We don't need a meeting room to establish the recursion; the history of play provides the inductive base. If we weaken the epistemic condition too much—say, to mere statistical regularity without the recursive expectation—we lose the *reason* for action. Lewis insists a convention is a solution to a coordination problem, meaning I conform *because* I expect you to conform. If I just mimic you without expecting you to expect me, that's a habit or a custom, not a Lewisian convention, because the conditional preference (I prefer to match you) isn't activated by mutual expectation.

  The harder knot is arbitrariness when institutions get involved. Lewis defines arbitrariness not as "random selection" but as the existence of at least one alternative regularity $R'$ that could have served as another coordination equilibrium. Even if institutional design makes $R$ overwhelmingly salient—like codifying driving on the right into law—the convention persists as long as the *primary reason* for compliance remains the coordination payoff rather than the sanction. If the state removes $R'$ by making it physically impossible or prohibitively costly via punishment, we risk collapsing convention into law. Lewis distinguishes them by the source of the obligation: in convention, the obligation comes from the interdependence of preferences; in law, it comes from the threat of sanction independent of others' behavior.

  However, in modern states, these layers overlap. A "silent convention" codified into law remains conventional in Lewis's sense if I would still follow it even without the police, simply because I expect you to. The institutional design doesn't remove arbitrariness *in origin*—we could have codified the left side—but it can erode arbitrariness *in maintenance* if the sanction becomes the sole motivator. If the coordination equilibrium is so locked in by infrastructure that $R'$ is no longer a viable alternative even conceptually, then yes, it ceases to be a convention and becomes a structural constraint. But until that point, the "silence" is just the absence of explicit agreement, which Lewis never required; he only required the common knowledge of conformity, which precedent supplies through salience.
