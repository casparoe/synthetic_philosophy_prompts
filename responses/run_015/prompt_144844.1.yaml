answer: |-
  # Adversarial Collaboration: The Frame Problem

  ## 1. Agreed Claims

  1. The original technical challenge concerns how to represent action and change without explicitly enumerating every fact that remains unchanged.
  2. The qualification problem (unlistable preconditions), ramification problem (unlistable consequences), and inferential problem (selecting relevant facts) are structurally linked in logical formalizations of action.
  3. Neither camp claims that 1960s/70s non-monotonic formalisms fully solved the computational complexity of general relevance determination for open-ended agents.
  4. Tractability results demonstrate that unrestricted search for relevance is computationally prohibitive under standard logical assumptions.
  5. Any deployed agent, regardless of architecture, must employ mechanisms to ignore most possible consequences of its actions to function in real time.
  6. Both camps agree that real-world agents operate under bounded computation and partial information.

  ## 2. Disagreements Table

  | ID | Centrality Camp Wording | Dissolution Camp Wording | Assessment |
  | :--- | :--- | :--- | :--- |
  | **D1** | The frame problem reveals a deep epistemological truth about how belief systems determine relevance isotropically. | The frame problem was an artifact of a particular logicist way of formalizing action and change. | **Substantive.** One side sees a feature of mind; the other sees a bug of notation. To become verbal, Centrality would have to agree the "depth" is only deep relative to logical formalisms, not intelligence itself. |
  | **D2** | Changing the architecture (neural, embodied) shifts the burden but does not remove the need for a solution to global relevance. | Changing the architecture (probabilistic, embodied) dissolves the problem because relevance emerges from coupling, not inference. | **Substantive.** This is an empirical claim about whether non-logical systems still face a relevance bottleneck. |
  | **D3** | A solution requires a theory of how relevance is determined across a whole belief system. | A solution requires ordinary engineering under bounded computation and partial information. | **Mixed (Verbal/Substantive).** Mostly verbal regarding the word "solution." If Centrality accepts "working system" as a solution and Dissolution accepts "theory" as unnecessary, they agree on outcomes but disagree on description. To stay verbal, Centrality must stop claiming engineering successes are theoretically incomplete. |

  ## 3. Probe Cases

  ### Case A: The In-Context Ramification Problem
  **Scenario:** You give a language-model agent a long context of retrieved documents, mostly irrelevant, plus one new fact that contradicts something it "knows" (e.g., a company is acquired, a treaty is voided, a library call is deprecated). The agent now has to work out which of the unenumerated downstream consequences of that fact matter for its next action.

  *   **Centrality Camp:**
      *   **Verdict:** This is the Frame Problem.
      *   **Reason:** The model must access isotropic knowledge to see implications. The difficulty of ensuring the model updates all and only the relevant beliefs without hallucinating or missing connections shows the problem persists in subsymbolic systems.
  *   **Dissolution Camp:**
      *   **Verdict:** This is a different problem (Context Management).
      *   **Reason:** This is an engineering problem of attention weights and context window management. Failure here is a matter of training data or architecture limits, not a deep epistemic barrier regarding change.

  ### Case B: The Horizon Frame Problem
  **Scenario:** A deployed agent with a long time horizon has to decide which changes in its environment are worth re-planning over and which it can safely ignore, with no one around to write down the relevance conditions.

  *   **Centrality Camp:**
      *   **Verdict:** This is the Frame Problem.
      *   **Reason:** How does it know what stays relevant over time without checking everything? The lack of explicit frame axioms does not remove the computational burden of filtering irrelevant state changes.
  *   **Dissolution Camp:**
      *   **Verdict:** This is no problem (Optimization).
      *   **Reason:** This is standard Reinforcement Learning or Control Theory. Reward signals and value functions guide attention naturally; there is no separate "frame" issue, just optimization under uncertainty.

  ## 4. The Cruxes

  ### Crux 1: The Scaling of Relevance
  *   **Sub-question:** As knowledge base size increases, does the error rate in identifying relevant facts increase for non-logical (neural) systems?
  *   **Shared Test:** Scale context size and measure relevance retrieval accuracy on counterfactual updates in a controlled benchmark.
  *   **Centrality Prediction:** Error rate increases (isotropy makes search hard regardless of architecture).
  *   **Dissolution Prediction:** Error rate stays stable or decreases (attention mechanisms scale efficiently).
  *   **Which Side Moves:** Centrality moves if error stays low; Dissolution moves if error spikes systematically.

  ### Crux 2: The Embodiment Escape
  *   **Sub-question:** Does physical embodiment eliminate the need for explicit relevance filtering compared to simulation?
  *   **Shared Test:** Compare simulated agent vs. embodied robot on task requiring ignoring distractors over a long horizon.
  *   **Centrality Prediction:** Both struggle equally with relevance (the problem is cognitive, not physical).
  *   **Dissolution Prediction:** Embodied robot struggles less (physics filters information automatically).
  *   **Which Side Moves:** Dissolution moves if robot struggles equally; Centrality moves if robot succeeds easily without explicit filtering.

