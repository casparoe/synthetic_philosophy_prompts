  # Taxonomy of Assisted Dying Positions
  *Designed for the "Easy Case" Consensus: Competent, Terminal, Painful, Requesting.*

  ### The Decision Tree

  **Q1: In the "Easy Case," what makes the act permissible?**
  *   **A. The Act is Inherently Constrained.** (Go to Q2)
  *   **B. The Patient's Will.** (Go to Q3)
  *   **C. The Patient's Suffering.** (Go to Q3)

  **Q2: What is the source of the constraint?**
  *   **A1. Life is sacred/inviolable.** → **Sanctity-of-Life Absolutism**
  *   **A2. Medicine's role is healing, not killing.** → **'Medicine Has Fixed Ends'**
  *   **A3. Killing is wrong, but allowing death/sedation is not.** → **Terminal-Sedation/Double-Effect**

  **Q3: Must the patient be Terminally Ill?**
  *   **Yes.** → **Terminal-Illness Restriction**
  *   **No.** (Go to Q4)

  **Q4: (If Will) Does the request survive Loss of Competence (e.g., dementia)?**
  *   **No, current competence required.** → **Autonomy-Only View**
  *   **Yes, prior directive binds.** → **Precedent Autonomy View**

  **Q5: (If Suffering) Is the suffering valid if it is Avoidable (refused treatment) or Social (burden/disability)?**
  *   **No, these invalidate the claim.** → **Disability-Rights Objection**
  *   **Yes, subjective experience rules.** (Go to Q6)

  **Q6: (If Suffering/Valid) Must the suffering be Psychiatric/Pathological?**
  *   **Yes, 'tiredness' is not pathology.** → **Psychiatric Suffering View**
  *   **No, 'completed life' is sufficient.** → **Completed Life View**

  ***

  ### The Leaves (Positions & Awkward Commitments)

  1.  **Sanctity-of-Life Absolutism:** Must let the metastatic cancer patient suffer rather than intentionally shorten life.
  2.  **'Medicine Has Fixed Ends':** Must refer the dying patient to a non-physician or abandon them to avoid role corruption.
  3.  **Terminal-Sedation/Double-Effect:** Must intend the patient's death but describe the intention as "relief of symptoms."
  4.  **Terminal-Illness Restriction:** *[See Note 1]* Must deny the 84-year-old "tired of living" despite chronic, unremitting suffering.
  5.  **Autonomy-Only View:** Must assist a healthy 29-year-old if they ask, even without suffering or illness.
  6.  **Precedent Autonomy View:** Must end the life of a contented, demented patient because their past self requested it.
  7.  **Disability-Rights Objection:** Must tell the suffering patient their pain is "social coercion" rather than a medical reality.
  8.  **Psychiatric Suffering View:** Must draw a clinically coherent line between "treatment-refractory depression" and "existential tiredness."
  9.  **Completed Life View:** Must accept "weariness of life" as a medical ground equivalent to physical pathology.

  ***

  ### Meta-Commentary for the Seminar

  **1. The Merged Leaf (Terminal-Illness Restriction):**
  Q3 merges the **Will** and **Suffering** branches. This leaf hides a disagreement: some hold this view because choice is only rational when dying (Will), others because suffering is only unbearable when dying (Suffering). Your questions cannot separate them, but they disagree on the *29-year-old depressed patient* (Will says no, Suffering says no, but for different reasons).

  **2. The Snapshot/Trajectory Problem (Q5):**
  This question isolates the "Avoidable Suffering" case.
  *   **Snapshot (Yes):** The patient's current report is final (leads to *Completed Life/Psychiatric* views).
  *   **Trajectory (No):** We assess the suffering against what life *could* be with treatment/support (leads to *Disability-Rights*).
  *   **Unoccupied Combination:** A view that says "Suffering is the engine" but "Avoidable suffering counts" *and* "Terminality is required." This is incoherent: if avoidable suffering counts, terminality shouldn't matter; if terminality matters, avoidability shouldn't override it.

  **3. The Unattractive Leaf (Precedent Autonomy):**
  Leaf 6 is rarely occupied as a standalone positive view. It is usually unattractive because it requires violating the *current* interests of a patient who no longer identifies with the request (the "contented demented" problem). Most who support advance directives limit them to withholding care, not active killing.

  **4. The Burden Case:**
  Requests driven by "not wanting to be a burden" (Case 5 in your list) land in **Q5**.
  *   If you answer **No**, you land in **Disability-Rights** (the burden is a social failure, not a medical indication).
  *   If you answer **Yes**, you land in **Completed Life/Psychiatric** (the feeling of burden is real suffering, regardless of cause).
  *   *Note:* There is no leaf that says "Burden is a valid reason only if terminal." That combination is unclaimed, likely because if burden matters, terminality is irrelevant, and if terminality matters, burden is secondary.
