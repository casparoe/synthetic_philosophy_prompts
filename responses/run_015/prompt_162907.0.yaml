answer: |-
  **1. Essay Question**

  Consider an economy where machines produce machines without direct production workers. Living labour is restricted to remote design, maintenance, and workforce reproduction. Assume the technical composition of capital rises indefinitely while its value composition stagnates due to cheapening. Contrast the *Fragment on Machines* with *Capital* Vol 3. For each, determine the fate of value, surplus value, and the profit rate here. Which text better accounts for the cheapening of constant capital? Evaluate whether expanding the 'collective labourer' to include design and education sustains the labour theory of value or merely relocates the contradiction. Reject the dismissal of the *Fragment* as immature draftsmanship. Finally, commit: which diagnosis explains capitalism's limit in this scenario, and what observable empirical pattern would falsify your choice? Ensure you distinguish between the breakdown of the value measure itself and the internal squeeze on profitability.

  ***

  **2. Model Answer**

  The central tension lies between a crisis *within* the law of value (*Capital* Vol 3) and a crisis *of* the law of value (*Fragment*). In Vol 3, Marx argues the rate of profit falls because the organic composition of capital rises: constant capital (machinery) grows faster than variable capital (labor). Surplus value originates only from variable capital; thus, as production becomes more automated, the base for exploitation shrinks relative to total investment. However, Vol 3 acknowledges counter-tendencies, specifically the cheapening of constant capital. In the proposed case, where automation lowers the value of machines even as their physical mass grows, Vol 3 predicts the profit rate need not collapse mechanically. The value composition stagnates even as technical productivity soars. Yet, the mass of surplus value remains constrained by the shrinking pool of living labor. The crisis here is one of realization and insufficient surplus value mass, not necessarily a falling rate, provided cheapening is sufficiently aggressive.

  The *Fragment* offers a more radical diagnosis. It argues that as "general intellect" (social knowledge) becomes the direct force of production, labor time ceases to be the adequate measure of wealth. Value is congealed labor time; if production relies primarily on appropriated knowledge and automated systems rather than direct labor, the value form becomes a fetishistic barrier to material abundance. In this fully automated scenario, Vol 3 tries to salvage the value category by counting design and maintenance as productive labor. The *Fragment* suggests this is futile: when direct labor is reduced to a negligible supervision role, the relation between labor time and wealth production breaks. The threat is not a low profit rate, but the impossibility of measuring wealth via exchange value at all.

  The 'collective labourer' defence attempts to rescue Vol 3 by aggregating remote designers and educators into the productive workforce. This sustains the claim that living labor remains the source of value. However, this merely relocates the difficulty. If the total social labor time required for production approaches zero relative to output, the unit of value becomes infinitesimal while material wealth explodes. This creates a realization crisis: who earns wages to buy the output? If value is preserved theoretically, it becomes practically irrelevant to the distribution of wealth. Thus, the defence saves the labour theory of value only by admitting it no longer regulates distribution or production planning. It relocates the contradiction from production to realization and social reproduction.

  Dismissing the *Fragment* as immature draftsmanship ignores its structural insight. Vol 3 describes capitalism's economic limits; the *Fragment* describes its historical limits. Vol 3 assumes the law of value holds until profitability fails. The *Fragment* argues the law of value fails before profitability necessarily hits zero, because the social form (value) becomes incompatible with the technical content (automation). In a scenario where machine-producing sectors are fully automated, the *Fragment* handles the cheapening of constant capital better because it recognizes that cheapening isn't just a counter-tendency to profit fall, but evidence that value is decoupling from labor time.

  I commit to the *Fragment* as the superior diagnosis for this specific case. Vol 3 explains cyclical crises driven by profitability squeezes, but it cannot explain a system where wealth is abundant yet value production is negligible without resorting to ad hoc adjustments about 'productive' boundaries. The *Fragment* explains why capitalism would struggle to exist here even if profits were momentarily high. The falsification condition for this choice is empirical: if such an economy sustained high profit rates and stable wage relations indefinitely despite near-zero direct labor input, the *Fragment* would be wrong. If, however, such an economy exhibits chronic stagnation, debt-fuelled consumption, and the commodification of non-production spheres (like education itself) to absorb surplus capital, the *Fragment* is confirmed. The Vol 3 model would be falsified if cheapening constant capital successfully stabilized profit rates without triggering realization crises or financialization.

  ***

  **3. Marking Scheme**

  **Total: 25 Marks**

  **1. Distinguish the Mechanisms (5 marks)**
  *   **Must Hit:** Clearly differentiate Vol 3's internal squeeze (profit rate falls due to composition) from the *Fragment*'s breakdown of the measure (labor time ceases to measure wealth).
  *   **Typical Error:** Treating both texts as predicting the same outcome (e.g., "both say capitalism collapses") without distinguishing the *mechanism* (value law failure vs. profitability crisis).

  **2. Apply Vol 3 to the Case (5 marks)**
  *   **Must Hit:** Explain that cheapening constant capital mitigates the falling rate in Vol 3, but surplus value mass remains limited by the shrinking variable capital.
  *   **Typical Error:** Ignoring the cheapening counter-tendency specified in the prompt, or conflating the *rate* of profit with the *mass* of profit.

  **3. Apply *Fragment* to the Case (5 marks)**
  *   **Must Hit:** Argue that the *Fragment* posits value itself becomes obsolete as general intellect drives production, making the value form a barrier.
  *   **Typical Error:** Summarizing the *Fragment* without applying it to the specific "zero direct labor" case provided.

  **4. Evaluate the 'Collective Labourer' (5 marks) [A/B Separator]**
  *   **Must Hit:** Argue that expanding the collective labourer relocates the contradiction (to realization/reproduction) rather than resolving it, as labor time becomes disconnected from wealth.
  *   **Typical Error:** Accepting the defence uncritically as a solution, or rejecting it without explaining *where* the contradiction moves (e.g., to realization).
  *   **Wrong vs. Thin:** An answer is *wrong* if it conflates value with material wealth (e.g., "wealth increases so value increases"). It is *thin* if it states the defence fails without explaining the relocation.

  **5. Commitment and Falsification (5 marks)**
  *   **Must Hit:** Choose one diagnosis and provide a specific observable empirical pattern (e.g., financialization vs. stable profits) that would prove it wrong.
  *   **Typical Error:** Refusing to commit ("both are useful") or offering a falsification condition that is not observable (e.g., "if Marx was wrong").
  *   **Wrong:** Mistaking the TRPF argument for an empirical forecast about money profits rather than a structural tendency of value categories.
