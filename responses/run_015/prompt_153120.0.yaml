      *   *Deductions:* The Quine/Reference sentence is the main place to deduct. It's a bit glib. Also, it doesn't explicitly mention "persuasion" or "conversion," which is how Kuhn describes the rational process without an algorithm.
      *   *Range:* 8.5 to 9.5. Let's settle on 9/10. It's excellent but the Quine bit is a slight conflation that a strict grader might flag.

