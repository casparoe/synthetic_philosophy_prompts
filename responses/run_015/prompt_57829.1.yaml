      *   **Additional Requirement:** Identify one moment resisting all three approaches (moral/psychological).
      *   **Conclusion:** What does fiction contribute to understanding revolutionary dynamics that historiography doesn't?
      *   **Constraint:** Refer to scenes/decisions by description, *no quotations*.

  2.  **Deconstruct the Historiographical Approaches (Mental Check):**
      *   *Class/Material:* Soboul, Lefebvre. Focus on feudalism, aristocracy vs. bourgeoisie/peasantry, economic pressure, structural inevitability.
      *   *Ideas/Discourse:* Furet, Baker. Focus on Enlightenment rhetoric, the "virtue/vice" binary, the power of language to create reality, conspiracy theories as political tools.
      *   *Contingency/Terror:* Doyle, Tackett (to an extent). Focus on war, external threat, internal panic, the spiral of violence eating its children (Thermidor).

  3.  **Drafting - Strand 1: Madame Defarge (Knitting & Vendetta)**
      *   *Dramatizes:* Class struggle (she represents the oppressed peasantry) BUT ALSO Ideas/Conspiracy (the register is a list of enemies, the knitting is a silent judgment). Actually, she fits best with the *Ideas/Conspiracy* lens regarding the *logic* of the Terror (elimination of enemies), but her *motivation* is deeply personal/feudal (Class).
      *   *Conflation:* Dickens blends personal vendetta (Evrémonde rape of her sister) with structural class war. In history, the Terror wasn't just about settling old feudal scores; it was about political survival. Defarge makes it look like the Revolution was *only* about blood feuds.
      *   *Misleading:* It suggests the revolutionaries were driven primarily by ancient, almost supernatural grudges rather than immediate political exigencies (war, inflation). It demonizes the *sans-culottes* as inherently bloodthirsty rather than desperate.
      *   *Selection:* Let's argue it dramatizes the **Class Struggle** lens most visibly (oppressed vs. oppressor), but operates through the **Conspiracy** lens (the register).
      *   *Refinement:* Actually, for the "Ideas/Language of Virtue" lens, Defarge is interesting because she rejects the "virtue" of mercy in favor of "justice" as extermination. But the prompt asks which it dramatizes *most powerfully*. The Class lens is the most obvious surface reading. The Conspiracy lens is the mechanism. Let's focus on how it conflates Class grievance with Conspiracy logic.

  4.  **Drafting - Strand 2: The Revolutionary Tribunal (Darnay's Trials)**
      *   *Dramatizes:* Contingency/Factional Accident. Darnay is acquitted the first time (Dr. Manette's letter hasn't been revealed/isn't in play), condemned the second time based on a specific document. The outcome depends on who is in the room, the mood of the crowd, and specific evidence.
      *   *Conflation:* It conflates legal procedure with mob justice. It suggests the Tribunal was arbitrary (which it often was) but attributes this to moral corruption rather than the structural pressure of the Law of Suspects.
      *   *Misleading:* It implies the Revolution had no legal logic. Historians know the Tribunal was a tool of state building and defense, not just a slaughterhouse. Dickens misses the *necessity* felt by the revolutionaries (war context).
      *   *Selection:* This fits the **Contingency/War/Factional** lens best. The shift from acquittal to condemnation shows how quickly the wind changes.

  5.  **Drafting - Strand 3: Carton's Substitution & Manette's Relapse**
      *   *Dramatizes:* The "Revolution eats its own" thesis (Thermidorian logic). Manette, a Bastille victim, becomes the tool that condemns his son-in-law. The Revolution destroys the innocent along with the guilty.
