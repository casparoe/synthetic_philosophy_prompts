      *   Al-Ghazālī is an Ash'arite theologian. He inherits the framework but refines it. I need to explain the Ash'arite distinction between *creation* (*khalq*) and *acquisition* (*kasb*), and how al-Ghazālī specifically navigates the semantics of "agent" (*fa'il*).

