answer: |-
  This is a sophisticated request that cuts to the heart of the debate between "Pessimists" (e.g., Sarah McGrath, Alison Hills) and "Optimists" (e.g., Jennifer Lackey, Paul Faulkner) regarding moral testimony. You are correct that the standard four objections (Understanding, Extension, Motivation, Fragility) are often vulnerable to "engineering" solutions where the hearer is simply made more competent.

  The "residue" you are looking for is often articulated as a defect in **Moral Autonomy** or **Moral Ownership**. The claim is that even if the belief functions perfectly in practice, holding it on the basis of testimony alienates the agent from the moral norm itself.

  Here is a construction of the case you requested, designed to isolate that residue.

  ### The Case: The Committee Allocation

  **Setting:** A small, low-stakes departmental committee at a university (e.g., the "Social Fund Committee").
  **Characters:** **Casey** (the hearer, a new junior member) and **Morgan** (the speaker, a senior, respected colleague).
  **Subject:** Whether it is permissible to vote for a venue that Casey personally prefers but is less accessible to disabled staff.

  **The Descriptive Facts (Known to Casey):**
  Casey knows the budget is tight. Casey knows Venue A is their favorite but lacks a ramp. Casey knows Venue B is slightly more expensive but fully accessible. Casey knows one disabled staff member will attend. Casey knows the committee's stated goal is "inclusive community building."

  **The Testimony:**
  Morgan says: "I know you prefer Venue A, but voting for it is unfair. It signals that your comfort outweighs the participation of our colleagues. We should vote for B." Morgan offers a compressed schema: *Inclusive access trumps minor preference in communal settings.*

  **The Hearer's Response (Meeting your Constraints):**
  1.  **Ordinary/Low-Stakes:** This is a minor administrative vote, not a life-or-death moral crisis.
  2.  **Descriptive Sufficiency:** Casey already knew all the facts about the ramp, the budget, and the staff. Morgan supplied only the moral verdict ("unfair") and the schema. Morgan is reliable; the verdict is true.
  3.  **Virtuous Hearer:** Casey is not lazy. Casey wants to do the right thing. Casey is not deferring to avoid conflict or to gain favor.
  4.  **Robustness:**
      *   *Action:* Casey votes for Venue B.
      *   *Extension:* Later, when deciding on a conference date, Casey independently applies the schema to avoid scheduling during a religious holiday, even though Morgan didn't mention it.
      *   *Stability:* If Morgan later says, "Actually, maybe Venue A is fine," Casey replies, "No, I see why that would be exclusionary," and sticks to the view.
      *   *Reasons:* If asked, Casey accurately explains, "It prioritizes my preference over their access, which violates the inclusive aim."

  **The Defect (The Residue):**
  Despite meeting all four conditions, there remains a sense that Casey's belief is **deferentially owned** rather than **autonomously held**. Casey treats the moral truth as a *policy* adopted from a reliable authority, rather than a *demand* grasped directly.

  When Casey votes for Venue B, they are effectively thinking: *"Morgan has correctly identified that the principles of fairness require B."*
  What is missing is the first-personal commitment: *"The principles of fairness require B."*

  Casey's belief is *mediated* by Morgan's judgment. Even though Casey can recite the reasons, the *warrant* for the belief remains tied to Morgan's reliability. Casey is acting as a "moral subordinate" rather than a "moral peer." The defect is a lack of **moral intimacy** with the reason. Casey understands the reason *intellectually* but does not stand in the right *normative relation* to it.

  ***

  ### The Closest Variant: The Deliberative Peer

  To isolate the feature doing the work, consider **Casey*** (the variant).

  **The Difference:**
  The situation is identical in every respect (facts, stakes, Morgan's utterance, Casey's virtues) except for one: **The Basis of Acceptance.**

  In this variant, when Morgan offers the verdict and schema, Casey pauses and treats Morgan's statement not as a *testimony to be accepted*, but as a *prompt to deliberate*. Casey thinks: "Morgan suggests this is unfair. Looking at the facts—the ramp, the budget, the goal—do I endorse that conclusion?"

  Casey *immediately* sees the force of the reasons themselves. Casey forms the belief *on the basis of the moral reasons*, using Morgan's comment merely as a catalyst.

  **Why this is Unproblematic:**
  In this variant, Casey's belief is **autonomously owned**. If Morgan retracts the view, Casey's belief remains secure not because Casey trusts their own reliability over Morgan's, but because Casey's belief is no longer anchored to Morgan at all. It is anchored to the value of fairness. Casey stands in a relation of *moral equality* with Morgan, rather than *moral deference*.

  ***

  ### Analysis of the Residue: Epistemic vs. Non-Epistemic

  The crucial question for your paper is how to categorize this residue. Is it that Casey (in the first case) fails to *know*, or that Casey fails to *be* a certain kind of agent?

  #### 1. The Epistemic Reading (Defect in Justification/Knowledge)
  On this view (associated with Hills or McGrath), moral knowledge requires a specific kind of grasp of the *reasons why* that testimony cannot convey. Even if Casey can recite the reasons, Casey lacks the "moral understanding" necessary for knowledge.
  *   **Diagnosis:** Casey has a true belief, but it does not amount to moral *knowledge* because the justification is testimonial, and moral knowledge requires non-testimonial justification (grasping the normative connection oneself).
  *   **What Casey Should Have Done:** Casey should have engaged in further private deliberation until the belief was justified by the reasons themselves, severing the dependence on Morgan's say-so. The goal is to upgrade the *epistemic status* of the belief.

  #### 2. The Non-Epistemic Reading (Defect in Agency/Relationship)
  On this view (associated with Keller or Jones), Casey *knows* the proposition is true. The defect is not in the belief's status, but in the **normative relationship** between the agent, the action, and the community. Morality is a domain where we owe it to each other to judge for ourselves.
  *   **Diagnosis:** Casey has knowledge, but violates a norm of **moral autonomy** or **civic friendship**. By deferring, Casey treats morality as a technical domain (like tax law) rather than a domain of shared practical reasoning. It creates an objectionable hierarchy between moral agents.
  *   **What Casey Should Have Done:** Casey should have engaged Morgan in *dialogue*, not *deference*. Instead of accepting the verdict, Casey should have said, "Let's weigh that principle against the budget." The goal is not to change the *basis of the belief* (epistemic), but to change the *mode of engagement* (relational).

  #### Where the Readings Diverge
  The divergence appears in **what counts as a successful resolution**.

  *   **Under the Epistemic Reading:** If Casey goes away, thinks alone for an hour, and comes back believing the same thing *for the reasons*, the defect is cured. The social relationship with Morgan is irrelevant; the internal cognitive state is what matters.
  *   **Under the Non-Epistemic Reading:** Even if Casey deliberates alone, if the *social dynamic* remains one of Expert/Novice, a residue of defect remains. The solution requires Casey to relate to Morgan as a co-deliberator. The defect is not just in Casey's head, but in the space *between* them.

  For a seminar paper, the **Non-Epistemic Reading** often offers a richer avenue for discussion in this specific "Residue" context, because it explains why the defect persists even when the hearer is intellectually competent (meeting your Constraint 4). It suggests the puzzle of moral testimony is not just about how we know, but about **who we are** when we know.
