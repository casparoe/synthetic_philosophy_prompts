  8.  **Refining the Output:**
      *   Ensure the tone is academic but helpful.
      *   Check all constraints again.
      *   *Constraint 4 Check:* "Hearer can reproduce those reasons accurately." This is the hardest one for Pessimism. Usually, Pessimists say you *can't* understand via testimony. I need to frame the Pessimist view as: "You can recite the reasons, but you don't *grasp their force* in the right way." Or, "You hold the belief *de re* regarding the testimony, not *de dicto* regarding the value."
