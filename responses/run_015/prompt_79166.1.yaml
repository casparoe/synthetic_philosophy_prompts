      *   *Addressing "What does this predict?":* A boring calibration story says "Be right 80% of the time when you say 80%." The user's view says "Ignore your specific model, look at the class." The prediction difference: The user's view predicts you should ignore specific evidence if it conflicts with the base rate, whereas calibration allows specific evidence to shift the probability *if* the model is robust.

  6.  **Ranking the Objections:**
      1.  *The Reference Class Selection Problem:* This is the strongest philosophical objection. It shows the view isn't self-contained.
