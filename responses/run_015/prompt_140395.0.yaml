answer: |-
  ### 1. The Mapping: Refactoring the Spec

  Your initial pass (`MUST`/`SHOULD`/`MAY`) fails because RFC 2119 verbs describe **constraints on the implementation**, whereas supererogation describes **metadata about the agent**.

  In your stack:
  *   **MUST (Duty):** A blocking merge gate. If missing, the build fails. If you bypass it, you incur technical debt and are blameworthy in post-mortem.
  *   **MAY (Permissible):** A no-op. The system is indifferent. No metric is emitted whether you do it or not.
  *   **SHOULD (Soft Constraint):** A warning lint. The build passes, but the PR comment flags it. If you ignore it, you owe an explanation in the review thread.

  **Supererogation does not map to `SHOULD`.**
  A `SHOULD` implies a default expectation. Supererogation implies *zero* expectation.
  The correct engineering analog is a **Side-Channel Metric with No Alerting**.

  *   **Definition:** An operation that, if committed, triggers a `counter_increment('moral_credit')` in the performance review service, but if omitted, triggers **no** error, **no** warning, and **no** log entry.
  *   **The API:** `Optional<Void> doGoodThing();`
      *   Return value: Ignored by the runtime.
      *   Side effect: Updates the `Agent_Reputation` table.
      *   Exception handling: Catching `DidNotDoGoodThing` is explicitly forbidden.

  **Why your vocabulary struggles:**
  Your stack is designed for **deterministic reliability**. Supererogation is designed for **non-deterministic valuation**. In engineering, if something is valuable enough to track, we usually make it a `SHOULD` (to ensure it happens) or a `MUST` (to guarantee it). A "valuable but optional" signal is usually noise in a monitoring system. We prune it.

  ### 2. The Test Suite: Running the Scenarios

  Let's execute your scenarios against this `Agent_Reputation` model. I will flag where the "Standard Definition" (consensus) ends and the "Implementation Disputes" (live philosophical bugs) begin.

  | Scenario | Cost to Agent | Benefit to System | Classification | Notes |
  | :--- | :--- | :--- | :--- | :--- |
  | **Kidney Donation** | High (Surgery/Risk) | High (Life) | **Supererogatory** | **Settled.** Everyone agrees this is above and beyond. |
  | **Subway Jump** | Extreme (Life Risk) | High (Life) | **Supererogatory** | **Settled.** Though some argue it's irrational, it's not *required*. |
  | **2am Bug Fix (Other Service)** | Medium (Sleep) | Medium (Velocity) | **Supererogatory** | **Contested.** In a "high ownership" culture, this might drift to `SHOULD`. |
  | **Wallet Return (Zero Cost)** | None | High (Trust) | **Disputed** | **Live Bug.** See "The Cost Variable" below. |
  | **Not Tipping** | Low (Money) | Low (Norms) | **Duty Violation** | In most social specs, this is a `MUST` violation (blameworthy). |
  | **Shadow Requirement** | Low/Medium | Medium | **Supererogatory** | This is the exact engineering analog. |

  **Heroism vs. Small Favours:**
  Are they the same shape? **Yes, structurally.**
  Both are `MAY` operations that emit a `Reputation` signal.
  The difference is the **magnitude of the signal**, not the type.
  *   Kidney = `+1000 Reputation`
  *   Code Cleanup = `+5 Reputation`

  However, there is a **Live Disagreement** on whether the *magnitude of cost* changes the category.
  *   **View A (Standard):** Supererogation requires **Sacrifice**. If the cost is zero (Wallet), it's just `MUST` (Duty). You *should* return the wallet. Not returning it is blameworthy.
  *   **View B (Libertarian/Minimalist):** Supererogation requires **Optionality**. If you aren't contractually obligated to return the wallet, it's supererogatory, regardless of cost.

  **Consensus Check:** The majority view (View A) is that **Cost/Sacrifice is a necessary condition.** If it costs you nothing, it's likely just basic decency (`MUST`). If this holds, the "Shadow Requirement" only counts as supererogatory if it involves *actual* extra effort (e.g., staying late), not just "doing the job well during normal hours."

  ### 3. The Cost Variable: Is Sacrifice Required?

  You asked: *Does the category require the act to be costly?*

  *   **Settled Definition:** The core definition is "Good + Optional + Not Required." Cost is not strictly in the definition.
  *   **Live Disagreement:** Most philosophers argue that without cost/sacrifice, the act collapses into Duty.
      *   *Argument:* If I hand back a wallet I found, and it costs me nothing, why am I praiseworthy? I'm just not a thief. The baseline (`MUST`) is "don't steal."
      *   *Counter-Argument:* If I donate $1M to charity and I'm a billionaire (zero cost to lifestyle), am I not praiseworthy?
      *   *Engineering Translation:* Is a `Reputation` signal valid if the `CPU_Cost` was zero?
      *   *Verdict:* In ethics, **Intent** often substitutes for Cost. In engineering, **Cost** (effort) is the only proxy for Intent we trust.

  **Conclusion on Cost:** The concept *can* exist without cost, but it becomes unstable. Most implementations require a `Sacrifice_Flag` to prevent inflation of the `Reputation` currency.

  ### 4. Residue Report: What Evaporates?

  This is the critical failure point in the translation.

  **1. The Asymmetry of Praise/Blame**
  *   **Engineering:** We have symmetric gates.
      *   Bad code = Build Fail (Blame).
      *   Good code = Build Pass (Neutral).
      *   *Great* code = ... Build Pass (Neutral).
      *   We have no mechanism for "Build Pass + Gold Star." We handle this via Performance Reviews (off-band), not the CI/CD pipeline.
  *   **Philosophy:** Supererogation relies on an **Asymmetric Scoring System**.
      *   Skip = 0 (Neutral).
      *   Do = +10 (Positive).
      *   Engineering systems hate asymmetry. If `+10` is possible, why isn't `-10` enforced for skipping? If it's not enforced, why track it? It looks like technical debt in the metrics system.

  **2. Agent State vs. System State**
  *   **Engineering:** We optimize the **System**. The code works or it doesn't. The *developer's* suffering is irrelevant to the binary. If you fix the bug at 2am or 2pm, the `latency_p99` is identical.
  *   **Philosophy:** We evaluate the **Agent**. The *cost* to you is the entire point. The moral value is generated by the sacrifice, not just the outcome.
  *   **The Evaporation:** When you translate supererogation to engineering, the **Sacrifice** disappears because the system is agnostic to it. The "Shadow Requirement" becomes just "Unplanned Work." The *moral credit* evaporates because there is no `Moral_Ledger` table in your schema.

  **3. The "Weak Preference" Collapse**
  You guessed: *"Rewarded-if-done and never-penalised-if-skipped just collapses into weakly preferred."*
  **You are correct.**
  In a purely utilitarian engineering model, supererogation **does** collapse into `Priority: Low`.
  *   If it doesn't block merge, it's low priority.
  *   If it gets credit, it's a "Bonus Ticket."
  *   The *moral* distinction (that you are a *Good Person* for doing it) has no storage column.

  ### 5. Verdict: Missing Vocabulary or Empty Concept?

  **Is the philosophical notion empty?**
  No. But it points to a layer your stack explicitly ignores.
  Your stack models **Correctness**. Philosophy models **Character**.
  Supererogation is a query against the `Character` table. Your backend doesn't *have* a `Character` table. It only has `Output` logs.

  **What is your vocabulary missing?**
  It is missing **Non-Instrumentalized Value**.
  *   In engineering, if an action is good, we instrument it (`SHOULD`). If we don't instrument it, we deem it unnecessary (`MAY`).
  *   Supererogation says: "This is valuable, but instrumenting it (making it a requirement) destroys its value."
      *   *Example:* If you make kidney donation a `MUST` (law), it is no longer supererogatory. It becomes compliance. The moral credit vanishes.
      *   *Engineering Analog:* If you make "cleaning up modules" a `MUST` in the CI gate, developers will resent it. It becomes toil. The "goodwill" signal is lost.

  **The Finding:**
  The "evaporation" you suspect is real, but it's not because the concept is fake. It's because **supererogation requires the option to opt-out to remain valid.**
  Engineering systems are designed to eliminate options to ensure reliability.
  Therefore, **Supererogation cannot exist in a fully specified system.** It can only exist in the gaps (the "Shadow Requirements").

  **Settled vs. Contested Summary:**
  1.  **Settled:** Supererogatory acts are optional (no blame if skipped) and good (praise if done).
  2.  **Settled:** They are distinct from Duty (`MUST`).
  3.  **Contested:** Whether they require Sacrifice/Cost (The Wallet Problem).
  4.  **Contested:** Whether they exist at all (Some utilitarian frameworks argue *everything* you can do to maximize good is a `MUST`, effectively deleting the `SUPER` category entirely).

  **Final Answer:**
  Your vocabulary has no slot for it because your vocabulary is designed to **close gaps**, and supererogation lives **in the gaps**. The "Shadow Requirement" is the correct analog, but be aware: the moment you document it in the `CONTRIBUTING.md` as an expectation, it ceases to be supererogatory and becomes `SHOULD`. The value lies in the silence of the spec.
