prompt: |-
  hey, im in a philosophy of mind course and we just covered the scale argument about insects. i tried writing out the logic for my study group but now it feels like it proves way too much. here's the chain:

  (1) if an organism has any nonzero chance of being sentient, then its group gets moral weight proportional to that chance times population size.
  (2) there are roughly 10^18 insects alive at any moment.
  (3) even at 0.001% sentience probability per insect, the expected number of sentient insects dwarfs mammals by orders of magnitude.
  (4) so rational agents with limited resources should prioritize insect welfare over almost everything else.
  (5) but apply the same formula to soil bacteria - about 10^30, with a 10^-20 sentience chance - and you get a comparable expected total.
  (6) now allow hypothetical future digital minds with unknown but nonzero probability; the expected moral weight seems to go unbounded.
  (7) therefore either we're required to care mostly about bacteria and hypothetical sims, which is absurd, or premise (1) is false.
  (8) but if (1) fails, the whole scale argument for insects collapses, and then we're back to ignoring them because each individual probability is low.

  i think the slip is between (3) and (4) - maybe treating epistemic uncertainty like actual distributed patients? - but i cant tell if thats the real problem or just me wanting to save the argument. which step should i reject, and whats the cost? please write in american english, and no citations or reading lists needed.
