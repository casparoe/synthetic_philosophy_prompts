prompt: |-
  I'm a novelist, not a philosopher, so forgive me if I mangle the jargon. I've been stuck for something like two years on one scene in a book: two minor, extremely stubborn academics who have spent fifteen years sniping at each other in footnotes get forced by a foundation into an adversarial collaboration, and the scene is basically the two of them handing over the joint document they were made to write. What I need from you is that document — not a description of it, the thing itself — written so the intellectual content is real enough that a reader who genuinely knows this literature wouldn't wince, but with no citations, bibliographies or "as Soares argues": I'm drafting on a laptop with no internet and I can't check anything, so I want the arguments and the cases spelled out from scratch.

  The pair are, badly named, the policy-first people and the evidence-first people. The first say the proper object of evaluation is the procedure you're running, and that you should reason as though the predictor's model of you and the decision you're making now are one and the same event; on the two cases they've been fighting over they end up paying in the counterfactual mugging and not paying in the XOR case. The second say you evaluate the act in front of you by what it would tell you, given everything you now know; they end up not paying in the mugging and paying in the XOR case. Set both cases out yourself in the text so it's self-contained, but here's what I mean: (i) a stipulation-perfect predictor predicts whether you'd hand over a small sum if asked, then a fair coin is flipped — one way round it silently pays you a large sum iff it predicted you'd hand it over, the other way round it approaches you and asks, and you're told which way the coin went and it's the asking branch, so the large sum is already settled and nothing you do now touches it; (ii) the predictor sends you a letter iff exactly one of two things holds — you'd pay the demanded sum on recieving it, or some rare expensive misfortune has already befallen you — and the misfortune costs far more than the demand, so getting the letter is bad news unless you're the paying sort. There's also a third position both of them reject (plain act-causal: nothing you do changes anything, so never pay in either case) and I'd like a short closing section where they jointly say what they think that view misses, and why their agreement about it doesn't settle anything between them.

  Format-wise I want a numbered agreed-claims section both could sign — including about the cases themselves, about what has to be stipulated for the cases to have any force at all (no duplicates, no time travel, no causal back-channel), and about whether being right here is even worth money — followed by a disagreements table where each row is phrased first in the wording its own side would accept and then, if you can do it without watering it down, in neutral wording. Then the cruxes, and for each crux the case or argument both would accept as bearing on it with each side's prediction written down in advance. A few things I've been fiddling with that I suspect are where the real disagreement lives, so please use them rather than generic banter: (a) what happens if the predictor is only right with probability p and p is dialled down — is there an accuracy threshold at which one side's verdict flips, and does the other side's ever move at all; (b) both sides agree that if you could have publicly installed a policy before the prediction was made you should have installed the paying one, so does that fact bear on what you should do now that you can't, or is it pure regret; (c) whether "what I would have done" is even well defined when the thing that got predicted didn't know the coin had come up badly and the thing doing the deciding does; (d) whether the fact that one of them gets money-pumped in the XOR case is evidence against them or just a symptom. Finally, tell me honestly which parts of their fight are verbal — about words like "would", "act", or "rational" — and which are not, because my two characters need to end the scene still hating each other a little and I want the hating to be about the right thing.
