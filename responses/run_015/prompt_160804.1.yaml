answer: |-
  **JOINT STATEMENT ON DECISION-THEORETIC PROTOCOLS IN ADVERSARIAL PREDICTION SCENARIOS**

  **Submitted to:** The Foundation for Rational Inquiry
  **Authors:** Dr. Aris Thorne (Policy-First Group) & Dr. Lena Vane (Evidence-First Group)
  **Date:** 14 October 2023
  **Status:** Final Draft (Forced Collaboration Compliance)

  ***

  ### 1. AGREED CLAIMS

  We, the undersigned, submit this document to satisfy the Foundation's requirement for a unified position. While we maintain fundamental disagreements regarding the normative evaluation of decisions under prediction, we agree on the following stipulations, case definitions, and rejections of the null hypothesis.

  **1.1. Case Definitions**
  To ensure the dispute is not merely verbal regarding the setup, we stipulate the following two scenarios as the test bed for our theories. In both cases, the Predictor is stipulated to be accurate with probability $p$, where $p > 0.5$.

  *   **Case A (The Counterfactual Mugging):** A Predictor simulates the Agent. If the simulation would hand over a small sum ($S$) upon request, the Predictor flips a fair coin.
      *   *Heads:* The Predictor deposits a large sum ($L$, where $L \gg S$) into the Agent's account. No request is made.
      *   *Tails:* The Predictor approaches the Agent and requests $S$.
      *   *Current State:* The Agent is in the *Tails* branch. The Agent knows the coin landed Tails. The Agent knows the large sum $L$ was not deposited in this branch (and cannot be retrieved). The Agent must decide whether to hand over $S$.
  *   **Case B (The XOR Blackmail):** A rare Misfortune ($M$) occurs with low independent probability. $M$ costs significantly more than a Demand ($D$). A Blackmailer sends a Letter iff exactly one of the following is true: (1) The Agent would pay $D$ upon receiving the Letter, or (2) The Misfortune $M$ has occurred.
      *   *Current State:* The Agent has received the Letter. The Agent must decide whether to pay $D$.

  **1.2. Structural Stipulations**
  We agree that for these cases to have normative force, the following constraints must hold:
  1.  **No Causal Back-Channels:** The Agent's decision in the present cannot causally influence the past prediction or the past coin flip via physical means (e.g., time travel, tachyons).
  2.  **No Duplicates:** The Agent is not physically duplicated; the "simulation" is a logical isomorphism, not a biological clone.
  3.  **Transparency:** The Agent knows the structure of the problem and the accuracy $p$ of the Predictor/Blackmailer.

  **1.3. Rejection of the Act-Causal Null**
  We jointly reject the "Plain Act-Causal" view (henceforth: Causalism). Causalism holds that because the present act cannot change the past prediction (Case A) or the independent Misfortune (Case B), the rational agent never pays $S$ or $D$.
  *   **Joint Claim:** An agent following Causalism is *diachronically dominated*. A Causalist agent will predictably end up with less utility over a lifetime of such interactions than an agent following either of our proposed frameworks. We agree that rationality must account for this dominance, even if we disagree on the mechanism.

  **1.4. Value of Correctness**
  We agree that being "right" in this debate has instrumental value. A theory that yields dominated outcomes is defective. However, we disagree on whether "dominance" is measured by the outcome of the specific token act or the outcome of the type-level policy.

  ***

  ### 2. DISAGREEMENTS TABLE

  The following table outlines our divergences. Column 1 represents the Policy-First (Thorne) position. Column 2 represents the Evidence-First (Vane) position. Column 3 is a neutral phrasing agreed upon for the record.

  | Row | Policy-First Wording (Thorne) | Evidence-First Wording (Vane) | Neutral Wording |
  | :--- | :--- | :--- | :--- |
  | **2.1** | **The Unit of Evaluation:** The proper object of rational assessment is the *algorithm* or *policy* the agent instantiates. The decision "now" is merely the output of that algorithm in this specific information state. | **The Unit of Evaluation:** The proper object of rational assessment is the *act* chosen given the agent's *current* epistemic state. Past algorithmic choices are sunk costs. | **The Unit:** Rationality evaluates the [Decision-Event / Decision-Function]. |
  | **2.2** | **Control:** You "control" the Predictor's simulation because your decision procedure and the simulation's output are logically identical. Refusing to pay in Case A logically implies the simulation refused, costing you $L$. | **Control:** You do not control the past. In Case A, the money is gone. Paying $S$ loses you $S$ with no return. The correlation is evidential, not causal. | **Control:** The Agent's choice [determines / correlates with] the Predictor's past output. |
  | **2.3** | **Case A Verdict:** **Pay.** Refusing is an admission that your policy is "Refuse," which ensures you lose $L$ in the Heads branch. | **Case A Verdict:** **Refuse.** Paying is throwing good money after bad. The expected utility of paying *now* is negative. | **Case A:** The Agent [should / should not] transfer $S$. |
  | **2.4** | **Case B Verdict:** **Refuse.** The Blackmailer predicts your policy *conditional on receiving the letter*. Your decision now cannot change whether the letter was sent. Paying only loses $D$. | **Case B Verdict:** **Pay.** Receiving the letter is strong evidence that $M$ has occurred (if you are the refusing type). Paying screens off this evidence, making $M$ less likely conditional on your act. | **Case B:** The Agent [should / should not] transfer $D$. |
  | **2.5** | **Regret:** If you regret not pre-committing, you are irrational. Rationality *is* doing what you would have pre-committed to. | **Regret:** Regret is an emotion, not a guide. You should optimize for the world you are *in*, not the world you wish you had prepared for. | **Regret:** Pre-commitment preferences [bind / inform] current action. |

  ***

  ### 3. CRUXES AND PREDICTIONS

  We identify four specific technical cruxes where our theories yield differentiable predictions. We have written our predictions down in advance of further empirical testing (simulated or otherwise).

  **3.1. Crux: The Accuracy Threshold ($p$)**
  *Question:* In Case A (Mugging), if the Predictor's accuracy $p$ is dialled down, is there a threshold where the verdict flips?
  *   **Policy-First (Thorne):** Yes. If $p$ drops such that $p \cdot L < S$, the policy "Pay" no longer has positive expected utility across the whole game. The verdict flips to Refuse.
  *   **Evidence-First (Vane):** No. Regardless of $p$, once you are in the Tails branch, the money $L$ is gone. The expected utility of paying *now* is always $-S$. The verdict never flips; you never pay.
  *   **Joint Prediction:** If we run 10,000 simulations where $p$ varies, Thorne predicts a switch point. Vane predicts a flat line of refusal.

  **3.2. Crux: Pre-Commitment vs. Regret**
  *Question:* Both sides agree that if the Agent could publicly install a policy *before* the prediction (Case A) or before the Blackmailer scans them (Case B), they should install the "Pay" policy. Does this bear on the decision *now*?
  *   **Policy-First (Thorne):** Yes. Rationality is timelessly consistent. If you would have committed to Pay, you must Pay now. To do otherwise is to be a "dynamic inconsistent" agent who is exploitable.
  *   **Evidence-First (Vane):** No. That is pure regret. The situation has changed. Before, your choice influenced the prediction. Now, it does not. Acknowledging you *should have* committed is not the same as saying you *should* pay now.
  *   **Joint Prediction:** In a scenario where agents are punished for dynamic inconsistency, Thorne's agents survive. In a scenario where agents are rewarded for token-act efficiency in isolated instances, Vane's agents survive.

  **3.3. Crux: The Definition of "Would"**
  *Question:* Is "what I would have done" well-defined when the predictor's simulation didn't know the coin flip, but the real agent does?
  *   **Policy-First (Thorne):** Yes. The decision algorithm is the same. The input (knowledge of Tails) is different, but the function mapping inputs to outputs must be stable across logical possibilities.
  *   **Evidence-First (Vane):** No. The agent in the simulation and the agent in reality are in different epistemic states. To treat them as the same is to ignore the value of information.
  *   **Joint Prediction:** If we construct a case where having more information leads to a worse policy outcome (Value of Information is negative), Thorne argues the agent should ignore the info. Vane argues the agent must use the info.

  **3.4. Crux: Money Pumping in XOR (Case B)**
  *Question:* In Case B, the Evidence-First agent pays $D$. If this scenario repeats with independent Misfortunes, does this constitute a "money pump" (predictable loss)?
  *   **Policy-First (Thorne):** Yes. The Evidence-First agent pays $D$ every time they get a letter, but their paying does not reduce the frequency of Misfortunes. They are paying for news, not protection. This is a fatal flaw.
  *   **Evidence-First (Vane):** No. It is not a pump; it is an insurance premium against bad news. In worlds where they don't pay, they suffer $M$ more often. They are buying a correlation with a safe world.
  *   **Joint Prediction:** Over 1,000 iterations of Case B, Vane's agents will have higher variance in outcomes but potentially higher mean utility if $M$ is sufficiently costly. Thorne's agents will have lower variance but will systematically inhabit the "Misfortune & No Letter" world more often.

  ***

  ### 4. META-ANALYSIS: VERBAL VS. SUBSTANTIVE

  *Note: This section is included to satisfy the Foundation's request for clarity on whether our disagreement is merely semantic.*

  We disagree on whether the fight is verbal.

  **4.1. What is Verbal**
  We agree that some friction is terminological.
  *   **"Rational":** Thorne uses "rational" to mean *winning across the ensemble of possible worlds*. Vane uses "rational" to mean *winning in the actual world given current knowledge*.
  *   **"Control":** Thorne speaks of "logical control" over a simulation. Vane reserves "control" for causal leverage.
  *   **"Act":** Thorne views the act as an instance of a function. Vane views the act as a singular event in time.

  **4.2. What is Substantive**
  However, the disagreement is not *purely* verbal. There is a substantive divergence regarding **ontological commitment to counterfactuals**.
  *   Thorne treats the counterfactual world (Heads branch in Case A) as having normative weight equal to the actual world (Tails branch) because the decision algorithm bridges them.
  *   Vane treats the actual world as having exclusive normative weight because only it exists.
  *   **The Residual Hate:** This is not solvable by dictionary definitions. It is a disagreement about whether logic is physical. If Thorne is right, reasoning itself is a causal force. If Vane is right, reasoning is merely a map. We cannot both be right about the territory.

  ***

  ### 5. SIGNATURES

  **Aris Thorne** (Policy-First)
  *I sign this acknowledging that Vane is wrong about Case A, but right that Causalism is dead.*

  **Lena Vane** (Evidence-First)
  *I sign this acknowledging that Thorne is wrong about Case B, but right that Causalism is dead.*

  ***

  ### NOVELIST'S NOTE (For your eyes only)

  You asked me to tell you honestly which parts of their fight are verbal and which are not, so you know what they should still be hating each other about at the end of the scene.

  **The Verbal Stuff (They can compromise here, but won't):**
  Half of their argument is about the word "Rational." Thorne thinks being rational means being the *kind of person* who wins. Vane thinks being rational means *making the move* that wins right now. They could solve this by agreeing to use different words (e.g., "Dispositionally Optimal" vs. "Contextually Optimal"), but they won't, because admitting the other's definition has merit feels like surrender.

  **The Substantive Stuff (This is where the hate lives):**
  The real hatred comes from **Section 4.2**.
  *   **Thorne's view:** Logic is a physical lever. If I decide to pay, I am reaching back through time/logic and moving the money. To him, Vane is blind to the structure of reality. She is a "myopic empiricist" who leaves billions on the table because she's too scared to trust logic.
  *   **Vane's view:** Reality is local. You can't change the past with math. To her, Thorne is a "mystic." He is engaging in magical thinking, believing that his thoughts control a simulator that doesn't exist anymore. She thinks he is intellectually dishonest, dressing up superstition as decision theory.

  **The "Hating" Dynamic:**
