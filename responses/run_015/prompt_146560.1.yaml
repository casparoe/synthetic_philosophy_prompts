      *(Self-Correction on Quine Interpretation)*: Quine's view on ethics is nuanced. He didn't think moral statements were meaningless, just that they don't have the same empirical content as physics. They are part of the web but further from the sensory edge. The key distinction for the user is treating them *as if* they are sensory observations. I need to make sure the procedure highlights *misclassification* of claim type.

      *(Refining Example 3)*: Why should Genetics pass? Because "reduce suffering" is a clear value premise. If the proposal admits "We assume reducing suffering is good," then the move to testing is instrumental. The "mandate" part is tricky. If they say "Data proves we MUST mandate," that's fail. If they say "Data shows testing reduces suffering, therefore to achieve our goal of less suffering, we propose mandate," that's pass. I need to write the procedure to catch the difference. The user wants it to pass to show the *limit*—meaning the procedure validates the *logic* even if the *policy* is debatable. Okay, I will structure the test so that if the value premise is explicit, it passes, even if the policy is heavy-handed.

      *(Wait, re-reading prompt)*: "a genetics screening program arguing early testing reduces suffering so we should mandate it — I want the procedure to clear this one even though my gut says it's overreaching, so I see the method's limit."
      Okay, so the procedure *should* clear it. This implies the procedure checks for *disguised* values, not *controversial* values. If the argument is "Testing -> Less Suffering -> Mandate," the jump from Testing to Less Suffering is empirical. The jump from Less Suffering to Mandate is value/policy. If they present the whole chain as empirical, it should fail. But the user wants it to pass. This suggests the user thinks the procedure *might* be too permissive. Or perhaps the proposal frames it as "Standard public health logic."
