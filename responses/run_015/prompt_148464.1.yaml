answer: |-
  This is a common plateau in the philosophy of time. The "Presentism vs. Eternalism" debate reached a high-water mark in the early 2000s (Sider, Merricks, Bigelow, etc.) and has since risked becoming a industry of minor variations on the same three objections. Given your three-year timeline and logic background, you cannot afford to spend a year on a problem that was exhausted in 2004.

  Here is a defended ordering of research priorities, ranked by **upstream impact** (does solving this settle other things?), **tractability** (can a logician do this without a physics degree?), and **novelty** (is this actually open?).

  ### Priority 1: The Truthmaker/Grounding Objection (Metaphysical Coherence)
  **Status:** Contested (High Stakes)
  **Tractability:** High (For a Logician)
  **Why Upstream:** This is the gatekeeper. If presentism cannot account for the truth of past-tensed propositions without positing existing past entities, the debate ends before it reaches physics or experience.

  *   **The Problem:** Eternalists say "Caesar crossed the Rubicon" is true because there exists a temporal part of Caesar. Presentists must say it is true *now*, without Caesar. The standard move is **Lucretianism** (the world currently has the property *having-contained-Caesar*). The objection is that these are "cheating" properties that supervene on nothing.
  *   **Why Prioritize:** This is purely metaphysical and logical. It relies on **grounding theory** and **truthmaker maximalism**, which are technical, formalizable areas where your background gives you an edge.
  *   **The Research Angle:** Do not rehash the 90s "is it a cheat?" debate. Instead, focus on **Grounding Logic**. Can you formalize a logic of grounding where past-tensed truths are grounded in *present* structural facts without requiring "temporal properties"? Recent work on **metaphysical explanation** allows you to treat this as a structural problem rather than an intuitive one.
  *   **Impact:** If you can formalize a coherent grounding model for presentism, you neutralize the primary metaphysical objection. If you prove it impossible, you save eternalists the trouble.

  ### Priority 2: Epistemic Access and Reference (The "Archive" Model)
  **Status:** Neglected (High Novelty)
  **Tractability:** Medium/High
  **Why Upstream:** This addresses *why* we believe in the past. Eternalism often wins because it makes reference to the past easy (we refer to existing things). Presentism makes reference mysterious.

  *   **The Problem:** How do we refer to or know about the past if it doesn't exist? Eternalists have a causal theory of reference that works smoothly. Presentists often struggle to explain how a present mental state connects to a non-existent object.
  *   **Your Roommate's Intuition:** She is describing a version of **Presentism with Informational States**. This is not just a metaphor; it aligns with **structuralist** or **informational** accounts of time. The database doesn't store "yesterday"; it stores a current record *marked* as past.
  *   **The Research Angle:** Investigate **Two-Dimensional Semantics** or **Contextualism** for temporal reference. Instead of asking "What makes it true?" (Priority 1), ask "What are the conditions of assertion?" You can argue that "The past exists" is a category error akin to saying "The database contains last year." The database contains *records dated* last year.
  *   **Impact:** This bypasses the heavy metaphysics of Priority 1. If you can show that our *discourse* about the past is compatible with presentism via an archival/informational model, you weaken the motivation for eternalism without needing to solve the grounding problem fully. This is the most likely place to find a "new" contribution.

  ### Priority 3: Special Relativity (As a Constraint, Not a Solution)
  **Status:** Contested (High Risk)
  **Tractability:** Low (For a Non-Physicist)
  **Why Downstream:** Even if you solve Truthmaking and Access, you still need to ensure your view isn't empirically falsified. However, this is a trap for philosophers without physics training.

  *   **The Problem:** SR suggests there is no privileged "now." Presentism requires a privileged "now."
  *   **Why Deprioritize:** This is where PhDs go to die. Philosophers often propose "Lorentzian Presentism" (there is a preferred frame, we just can't detect it) or "Fragmentalism" (facts are relative to frames). These require deep engagement with the physics to avoid being dismissed as "physics-bashing."
  *   **The Research Angle:** Do not try to *solve* the tension. Treat SR as a **boundary condition**. Your job is to see if the logic developed in Priority 1 & 2 can be *made compatible* with SR, not to argue against SR. Look into **Frame-Relative Truth**. Can presentism be true *relative to a frame*? This preserves the logic without fighting the physics.
  *   **Impact:** Necessary for completeness, but low return on investment for a logician. It limits your theory; it rarely generates positive theory.

  ---

  ### What to Avoid (The "Dead Ends")

  1.  **The Phenomenology of Passage:** "Does time *feel* like it passes?" This is wheel-spinning. Cognitive science has largely taken this over. Unless you are doing experimental philosophy, metaphysical claims about passage are rarely settled by introspection.
  2.  **The "Moving Spotlight" Theory:** This is often a compromise position that inherits the problems of both presentism and eternalism. It is rarely a productive primary focus anymore.
  3.  **Arguing Against Special Relativity:** Do not try to argue that physics is wrong. The consensus is that SR is empirically adequate. Your job is to interpret it, not refute it.

  ---

  ### Settled vs. Contested: A Reality Check

  You asked to distinguish what specialists consider settled from what is contested. Be very careful here; in metaphysics, very little is "settled," but there are **dominant working assumptions**.

  | Claim | Status | Nuance |
  | :--- | :--- | :--- |
  | **"Special Relativity poses a problem for Global Presentism."** | **Settled** | Almost no one denies SR creates a tension. The debate is whether the tension is fatal. |
  | **"Eternalism is the default view in Philosophy of Physics."** | **Settled** | Among those specializing in physics, eternalism (block universe) is the working hypothesis. |
  | **"Presentism is metaphysically incoherent."** | **Contested** | This is the core debate. Presentists argue coherence is possible via grounding/Lucretianism. |
  | **"Truthmaker Maximalism is true."** | **Contested** | Many presentists deny that *all* truths need truthmakers. This is a live logical escape hatch. |
  | **"Temporal Passage is an illusion."** | **Contested** | Divides "A-Theorists" (passage is real) from "B-Theorists" (passage is mind-dependent). |
  | **"The Past exists."** | **Contested** | This is the definition of the debate. However, the *definition* of "exists" (tenseless vs. tensed) is the real contention. |

  ### Verdict on the "Archive/Database" Idea

  **Is it a real research line?** Yes, but it needs rigor.
  **Is it new?** The *analogy* is common, but applying **Information Theory** or **Database Logic** to the metaphysics of time is under-explored.
  **How to make it count:**
  Don't just say "it's like a database." Formalize it.
  *   How does a database handle "deleted" records? (Analogy for the past ceasing to exist).
  *   How does it handle "timestamps"? (Analogy for tense logic).
  *   If the database is the present state of the world, how do queries about the past return true values?
  *   **Connect this to Priority 1:** The "archive" is your **Truthmaker**. The present physical state *encodes* the past. If you can formalize "encoding" as a metaphysical grounding relation, you have a dissertation.

  ### Summary Plan for 3 Years

  1.  **Year 1 (Logic & Grounding):** Master the formal literature on **Grounding** and **Truthmaking**. Construct a formal model where past-tensed truths are grounded in present structural properties. (Priority 1).
  2.  **Year 2 (Semantics & Access):** Develop the "Archive" model using **Temporal Semantics**. Show how reference to the past works without ontological commitment to past entities. (Priority 2).
  3.  **Year 3 (Physics Constraint):** Test your model against **Special Relativity**. Can your "present structure" be frame-relative? If yes, you have a consistent system. If no, you adjust the logic. (Priority 3).

  **Final Advice:** Your logic background is your greatest asset. The field is saturated with intuition-pumping metaphysicians. It is starving for rigorous formalizations. If you can translate the "Archive" intuition into a formal semantic system that resolves the Truthmaker objection, you will have done something genuine. If you stay at the level of metaphor, you will recycle the 90s.
