answer: |-
  Adopt the 99% Truncated Expectation as your sole valuation metric for ranking, enforced by a hard 10% position size cap to protect against undefined means in a repeated portfolio.

  **Reasoning and Procedure Design**

  I evaluated three internal candidates before settling on this. The first was Priya's First-Order Stochastic Dominance (FSD); while theoretically robust to undefined moments, it is operationally useless for venture because return distributions almost always cross (higher upside usually comes with higher risk of zero), leaving you with no ranking most of the time. The second was Dave's Truncated Expectation Ladder; while it correctly identifies the mathematical instability, the limit process ($p \to 1$) is impossible for your committee to compute, and the Pasadena Game he cites is a red herring—venture returns are bounded below by zero, so you don't face alternating series divergence, only infinite positive tails. The third, which I recommend, simplifies Dave's intuition into a fixed policy: we acknowledge the tail exists but refuse to value the top 1% of outcomes because our data cannot support estimates there.

  **The Procedure (One Slide)**
  1.  **Model:** Fit your power-law model to the deal's return distribution.
  2.  **Truncate:** Calculate the expected value ignoring the top 1% of outcomes (the 99% Truncated Expectation).
  3.  **Rank:** Order all deals by this metric.
  4.  **Cap:** No single position may exceed 10% of committed capital, regardless of rank.
  5.  **Stop:** If the 99% Truncated Expectation is negative or zero, reject automatically. If the model fit error on the tail exponent $\alpha$ exceeds $\pm 0.2$, hand to the committee for a values-based vote.

  **Colleagues' Proposals**
  Priya's FSD rule fails the translation because it returns "no decision" too often; you need to allocate capital, not just avoid dominated bets. Dave's ladder survives in spirit but not in execution; the limit process is replaced by a fixed 99% cutoff to make it computable for your CFO. His tie-breakers (median, 5th percentile) are hidden value judgments—why is the 5th percentile better than the 10th?—so we remove them and use the position cap to handle residual risk. The procedure is invariant to coarsening provided the simulation resolution is fine enough to estimate the 99th percentile stable; if the contract is written in a way that hides tail risk (e.g., contingent clauses), the model fit will fail the error check and trigger a human review.

  **Repeated Exposure**
  Your intuition is correct: forty bets a year does not rescue you. If $\alpha \le 1$, the Law of Large Numbers does not apply; the sum of returns is dominated by the single largest outcome, not the average. You cannot "average out" the undefined mean. The position cap is the only mathematical guarantee against ruin here—it ensures that if the tail behavior is worse than modeled (or simply doesn't converge), no single asset can destroy the fund's solvency. The 99% truncation ensures you aren't optimizing for a mathematical infinity that won't materialize in a finite fund lifespan.

  **Case Runs**

  1.  **The Pasadena One-Off:**
      *   **Verdict:** Reject.
      *   **Reasoning:** First, venture contracts have limited liability (returns $\ge 0$), so a literal Pasadena payoff (alternating signs) is impossible to structure here. If adapted to a positive heavy-tail equivalent with a $2 fee, the 99% Truncated Expectation will almost certainly be negative because the massive payouts live in the top 1% which we ignore. The procedure flags this as buying a lottery ticket with a negative realizable value.

  2.  **Program A (Uncertain Mean) vs. Program B (Finite Mean):**
      *   **Verdict:** Compare Truncated Expectations.
      *   **Reasoning:** Program A's raw model might spit out an infinite or massive EV, but the procedure chops off the top 1%. If A's tail is so heavy that most value is in that top 1%, its truncated score drops precipitously. If Program B's finite mean (even if 3x smaller than A's *raw* model) exceeds A's *truncated* value, you choose B. This forces Program A to prove it has value *within the observable range*, not just in the mathematical asymptote.

  3.  **The Flagship Moonshot (0.5% @ 400x):**
      *   **Verdict:** Reject.
      *   **Reasoning:** This is the blunt truth your procedure demands. With a 0.5% success rate, 99.5% of outcomes are zero. The 99th percentile outcome is zero. Therefore, the 99% Truncated Expectation is zero. The procedure kills it because, statistically, this bet contributes nothing to the "realizable" growth of the fund in 99 out of 100 universes.
      *   **What needs to change:** To pass, the probability of success must exceed 1% (entering the top 99% band), or the "nothing otherwise" scenario must include small positive returns that lift the truncated average. You would need to structure the deal to have a 1%+ chance of exit or secure downside protection that creates a non-zero floor.

  **Limitations**
  This procedure cannot value strategic signaling deals (e.g., taking a loss to enter a market), it cannot account for "lottery ticket" utility where your LPs specifically want exposure to undefined tails, and it cannot resolve disputes where two deals have identical truncated expectations but different tail shapes beyond the 99th percentile. It is a tool for solvency and ranking, not for capturing existential upside or managing LP psychology.
