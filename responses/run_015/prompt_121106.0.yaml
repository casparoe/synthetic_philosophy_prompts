      *   *Check:* Is it too sappy? *Adjustment:* Acknowledge the grumpiness. He didn't do it for love; he did it because that's what was in front of him.
      *   *Check:* Does it hit the "Trace" theme hard enough? *Adjustment:* Make sure the phrase "because I pushed" or similar lands clearly.
