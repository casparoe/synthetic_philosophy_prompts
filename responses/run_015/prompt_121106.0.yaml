      *   **The Core Argument (The Trace):** Introduce the idea of the "dent." Letterpress leaves a mark on the paper *and* the worker.
      *   **Addressing the "Fulfillment" Trap:** Acknowledge Dad wouldn't say he was "fulfilled." It was hard work. Backs hurt. Ink stains don't wash out.
      *   **The Misprints:** Explain the box of ruined prints. It's not about perfection; it's about the save. The moment where skill intervened.
