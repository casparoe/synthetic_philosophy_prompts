answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I'm the one who inherited the permanent ink stains on the carpet.

  Looking around this room, I realize I have a tricky line to walk. On one side, I have family who know that work is mostly about keeping the lights on and the roof from leaking. On the other, I have scholars and thinkers who know that romanticizing hard labor is usually a way to justify how hard it is.

  So, I'm not going to stand here and tell you that my dad "loved" every minute of the last 32 years. If I said that, he'd laugh into his beer, and the historians in the back would start taking notes on "false consciousness." The truth is, letterpress printing is heavy. It's loud. It smells like solvent and old metal. It ruins your knuckles and your lower back. Dad didn't go to the shop because he was finding himself; he went because there was paper that needed to be pressed and a crew that needed to be paid.

  But there is something specific about the work he did that I want to talk about. It's about what happens when you spend three decades touching the things you make.

  In a letterpress shop, you cannot separate the thought from the physical act. You can't just imagine the print. You have to lock the type, mix the ink, adjust the pressure, and feed the sheet. If you don't push, nothing happens. And when you do push, the paper remembers. You can run your finger over a letterpress card and feel the indentation. It's a topographical map of the effort it took to make it.

  I think that's why Dad kept the misprints. If you go into his office, there are boxes of them. Jobs that went wrong. Ink smudges, misaligned borders, paper jams. To an outsider, that's just waste. But I think he kept them because they are the only ones that tell the truth.

  A perfect print looks like it appeared by magic. But a salvaged misprint? That shows the moment the machine resisted, and the moment a human hand intervened to fix it. He kept them as proof that he was there. That he wrestled with the material, and for better or worse, he left a mark on it.

  That's the thing I want to toast to. The idea that work, at its core, isn't just about income, and it isn't just about self-expression. It's about agency. It's the ability to look at an object and say, "That shape exists because I pushed."

  We all know the industry changed. We know the story. Eventually, the presses got quiet. The screens got bright. And in a twist of irony that I know the philosophers here will appreciate, Dad spent the last few years of his career training the software that would replace the crew. He took the instincts he'd built over thirty years—the feel of the paper, the mix of the ink—and he translated them into code.

  He made himself obsolete, efficiently.

  The new system is incredible. It's faster, cleaner, and it doesn't need coffee breaks. But it operates in a realm where effort doesn't leave a dent. You click a mouse, and a thousand copies appear. There is no friction. There is no resistance. And because there is no resistance, there is no trace of the person who made it happen. It feels like a kind of disappearance. Not of the product, but of the producer.

  Dad is retiring now. The shop is quiet. He won't be going in to fix the jams or mix the Pantone colors. And I know he's ready to rest. I know he's ready to not have to worry about the bottom line.

  But I hope he takes a moment to look around at what he's left behind. Not just the business, or the money, or the software code. I hope he looks at the boxes of misprints, and the stacks of good runs, and the calluses on his own hands.

  Because in a world that is increasingly smooth, digital, and frictionless, there is a profound dignity in having left a dent. There is a comfort in knowing that for thirty-two years, you stood in front of a machine, you applied pressure, and the world changed shape to match your will.

  So, if everyone could raise a glass.

  To Dad. Who taught the machines how to think, but never forgot the value of the push. May your retirement be light, may your ink wash off, and may you always be able to point to something solid and say, "I made that."

  To Dad.
