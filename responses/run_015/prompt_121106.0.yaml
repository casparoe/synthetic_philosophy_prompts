      *   **Tone:** Warm, not a lecture. No academic quotes (Marx, etc.). No clichés about "loving your job."
      *   **Length:** About 5 minutes (roughly 600-800 words spoken at a moderate pace).

  2.  **Deconstruct the Core Theme:**
      *   *The "Trace":* Letterpress is physical. Ink, pressure, paper, indentation. You can feel it. Digital is invisible code.
      *   *The "Push":* Effort matters. Not just mental, but physical engagement with the material.
      *   *The "Misprints":* Why keep failures? Because they show the struggle. They prove the human was there intervening. A perfect digital print has no history of effort. A salvaged misprint has a story of correction.
      *   *The "Replacement":* He trained the software. That's ironic and poignant. He codified his knowledge until it wasn't needed physically anymore.
      *   *The Audience Balance:* Avoid saying "he loved every minute" (family knows he complained, historians know labor is often hard). Avoid saying "machines are evil" (efficiency is real). Focus on the *change in relationship* between the worker and the object.

  3.  **Drafting - Section by Section:**

