answer: |-
  In the town of Axiom, Ordinance 7 required that before any citizen could cast a ballot, they must hand-write a calculation demonstrating the probability of their single vote breaking a tie. The form was attached to the back of the ballot; if the math was wrong, the vote was discarded. If the math was right, the vote was counted, but the affidavit became part of the public record.

  On election day, Mr. Elias stood before the Clerk, Ms. Nash, and slid his ballot across the counter. Taped to the back was a dense page of binomial distributions and margin-of-error analysis.

  "The probability is one in forty-three thousand," Elias said, tapping the final line. "Statistically negligible."

  Ms. Nash adjusted her glasses. "The calculation is flawless. You may cast your vote."

  Elias dropped the ballot in the box. "Good. I feel much better knowing I've done my civic duty without deluding myself about its impact."

  At 8:00 PM, the polls closed. Ms. Nash stood before the town assembly to certify the results. She held up the box of ballots.

  "Citizens," she announced. "We have a problem. Every single one of you attached an affidavit swearing under penalty of perjury that your vote was statistically inconsequential. We have summed the affidavits. The total impact of this election is zero."

  A murmur went through the crowd. "Does that mean the winner didn't win?" someone asked.

  "It means the mandate is void," Ms. Nash said. "An election composed entirely of irrelevant votes cannot produce a relevant government. We must hold a revote."

  "Who will schedule it?" Elias called out from the back.

  Ms. Nash looked down at her own desk, where a notepad lay open. She had been working on a calculation of her own.

  "I have analyzed the probability of my scheduling a revote actually resulting in a functional government," she said, closing the notepad. "Given that everyone here has proven they are rational actors who know their individual efforts change nothing... the probability of me organizing this successfully is also zero."

  "So what do we do?" Elias asked.

  Ms. Nash picked up her coat. "We remain in a state of perfect, logical equilibrium. I'm going home. The cost of staying exceeds the expected benefit."

  "But the town will have no administration!"

  "Correct," she said, turning off the lights. "But at least we'll be accurately unrepresented."
