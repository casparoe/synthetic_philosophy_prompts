answer: |-
  It is a pleasure to engage with this question because it cuts directly to the heart of the most difficult problem in the philosophy of mind, which is how to describe subjective experience without secretly smuggling in a little person inside the head to do the experiencing. You have framed the tension perfectly between Dennett's Multiple Drafts Model and Baars' Global Workspace Theory, and the crux of the matter lies in whether a functional bottleneck is merely a structural necessity or a philosophical betrayal. To answer whether keeping the single place is a fatal concession, we must first be rigorous about what made the Cartesian Theater fatal in the first place. The theater was not condemned simply because it posited a central location where information converged, but because it posited a central viewer who inspected that information. The homunculus is the error, not the screen. If we remove the homunculus, we remove the infinite regress that makes the theory untenable. Global Workspace Theory does exactly this by replacing the single audience with a multiplicity of unconscious specialized processors that receive the broadcast. In this specific regard, the Global Workspace is genuinely different from the Cartesian Theater because it describes a routing mechanism rather than a viewing room. The information in the workspace is not being watched by a self; it is being used by systems for memory, speech, and motor control, none of which possess understanding on their own. Therefore, the charge that Global Workspace Theory reintrodu the Cartesian Theater is technically incorrect if we define the theater by the presence of an observer.

  However, Dennett's objection runs deeper than the mere presence of a homunculus, and this is where the two theories stop being variants of each other and become genuinely opposed. Dennett argues that positing a single bottleneck implies a finish line, a specific moment in time when unconscious processing stops and conscious experience begins. For Dennett, this is a myth because neural processing is parallel and continuous, with no definitive point where the draft becomes final. By contrast, Global Workspace Theory insists on a discrete transition, often described as ignition, where information crosses a threshold into global availability. This is the precise point of divergence. If you believe that consciousness is a functional status of information access, then the Global Workspace account is stronger because it explains the limited capacity of consciousness, such as why we cannot focus on two distinct thoughts simultaneously. The bottleneck explains the serial nature of subjective attention without requiring a serial processor at the core of the brain. But if you believe that consciousness is not a state but a narrative construct, then Dennett is stronger because he refuses to reify the moment of awareness into a physical or functional event. The disagreement is ultimately about the ontology of the conscious moment. Global Workspace Theory treats consciousness as a real event that happens when data enters the workspace, whereas the Multiple Drafts Model treats consciousness as a retrospective judgment made by the system about its own processing.

  So is the single place a fatal concession? I would argue that it is not, provided we understand the workspace as a functional role rather than a physical location. The brain does not need a literal spot where things come together, but it does need a mechanism for coordinating disparate modules, and the bottleneck describes that coordination. The fatal error of the Cartesian Theater was the combination of a single stage and a single viewer. Global Workspace Theory keeps the stage but populates the audience with unconscious zombies, so to speak, which dissolves the homunculus problem. Dennett wants to demolish the stage entirely because he fears it invites the viewer back in, but this seems like an overcorrection that makes it difficult to explain the unity of experience. We feel like a single self experiencing a unified world, and while Dennett calls this an illusion, Global Workspace Theory offers a mechanistic explanation for why the illusion is so persistent, namely that only one thing at a time can be broadcast. Therefore, the Global Workspace model is the stronger account because it accommodates the phenomenological data of limited capacity and unity without violating the prohibition against homunculi. The two theories become genuinely opposed when asked whether there is a fact of the matter about when a stimulus becomes conscious. For Baars and his successors, there is a fact of the matter marked by neural ignition, but for Dennett, there is no fact of the matter, only various judgments made at different times. This is not a minor semantic difference but a fundamental split between viewing consciousness as a functional state of access versus viewing it as a fictional narrative spun by parallel processes. In the end, keeping the single place is not a concession to dualism but a necessary acknowledgment of the serial bottlenecks inherent in complex information processing, and as long as the audience remains a multitude of unconscious systems, the theater remains empty of the one ghost that matters.
