answer: |-
  Here is a disciplined analysis of the 2006 IAU redefinition of Pluto through the lens of Frege's sense/reference distinction, mapping the specific mechanics of the puzzle and identifying where the framework fractures.

  ### 1. Mapping the Terms: Proper Name vs. Kind Term

  To apply Frege rigorously, we must first fix the semantic values of the terms involved in the controversy.

  **"Pluto" as a Proper Name**
  In the Fregean framework, "Pluto" functions as a proper name.
  *   **Reference (*Bedeutung*):** The specific physical body in the Kuiper Belt (the icy object discovered by Tombaugh in 1930). This reference remains fixed throughout the episode. The object did not move, shrink, or vanish in 2006.
  *   **Sense (*Sinn*):** The mode of presentation. Prior to 2006, the sense included descriptions like "the ninth planet," "the object orbiting beyond Neptune," or "the body satisfying the 1930s criteria for planethood."
  *   **Status:** The reference is stable. The cognitive shift does not concern *which* object "Pluto" picks out, but rather *what properties* that object holds.

  **"Planet" as a Kind Term (Concept)**
  Frege treats general terms as concepts (*Begriffe*), which have an extension (the set of objects falling under them) and an intension (the criteria for membership).
  *   **Reference (Extension):** The set of all objects classified as planets.
  *   **Sense (Criteria):** The definition required to enter the set. Pre-2006, this sense was vague but generally included "orbiting the sun" and "being round." Post-2006, the IAU added a third criterion: "clearing the neighborhood."
  *   **Status:** The sense of "Planet" was revised. Consequently, the extension (reference of the concept) shrank.

  **The Identity Claim**
  The IAU did not merely assert "Pluto is not a planet." They advanced a reclassification identity: "Pluto is a dwarf planet."
  *   In the Hesperus/Phosphorus case, the identity statement ($a=b$) reveals that two different senses pick out the same reference.
  *   In the Pluto case, the identity statement is constitutive. It asserts that the reference of "Pluto" falls under the extension of "Dwarf Planet" rather than "Planet." The informativeness does not come from linking two existing names to one object, but from moving an object from one conceptual extension to another.

  ### 2. Eris: Empirical Discovery or Definitional Stipulation?

  The discovery of Eris by Mike Brown is the critical variable that determines whether this is a Fregean discovery or a linguistic stipulation.

  **The Empirical Trigger**
  Brown's discovery provided a new object, Eris, with a sense ("the trans-Neptunian object larger than Pluto") and a reference (the physical body Eris). Empirically, if the sense of "Planet" includes Pluto, logic dictates it must include Eris. This is a standard empirical expansion of a concept's extension.

  **The Stipulative Reaction**
  The IAU response was not to update the extension to include Eris (which would preserve the old sense), but to revise the *sense* of "Planet" to exclude both Pluto and Eris.
  *   **Fregean Tension:** In the Hesperus case, the identity is discovered in the world; the senses were already there, waiting to be linked. In the Pluto case, the sense of "Dwarf Planet" was *created* at the Prague assembly.
  *   **Analysis:** This makes the identity claim ("Pluto is a dwarf planet") look less like an empirical discovery ($a=b$) and more like a definitional stipulation ("Let us define 'Dwarf Planet' such that it contains Pluto").
  *   **Result:** The informativeness of the statement does not arise from uncovering a hidden semantic connection (as with Venus), but from an authoritative decision to alter the rules of the language game. Frege's framework assumes senses are objective abstract entities that we *grasp*, not social constructs that we *vote on*.

  ### 3. Constitutive Identity vs. Hidden Sameness

  You asked whether Frege can handle "constitutive identity," where reference conditions shift. The answer is largely no, because Frege's logic is static regarding the third realm of senses.

  **The Hesperus Model (Epistemic)**
  *   **Structure:** Sense A $\rightarrow$ Reference X; Sense B $\rightarrow$ Reference X.
  *   **News:** We learn A and B converge on X.
  *   **Ontology:** X is unchanged.

  **The Pluto Model (Constitutive)**
  *   **Structure:** Name "Pluto" $\rightarrow$ Reference X. Concept "Planet" $\rightarrow$ Extension {X, ...}.
  *   **Event:** The Sense of "Planet" is altered to exclude X. A new Concept "Dwarf Planet" is minted to include X.
  *   **News:** We learn that X no longer satisfies the criteria for "Planet."
  *   **Ontology:** The *system of classification* has changed, not just our knowledge of X.

  **Where Frege Breaks:**
  Frege explains cognitive surprise (why $a=b$ is more informative than $a=a$). He explains why learning "Pluto is a dwarf planet" tells us something we didn't know. However, he cannot explain why the *truth conditions* themselves appear to have shifted. In Frege's logic, a thought (*Gedanke*) is timeless. If "Pluto is a planet" was true in 2005, and "Pluto is not a planet" is true in 2007, Fregean logic suggests a contradiction unless the *sense* of "planet" is explicitly indexed to time.
  But the controversy wasn't about time-indexing; it was about authority. The IAU vote didn't discover that Pluto *never* was a planet (which would be the Hesperus model: "We thought it was X, but it was always Y"). They effectively ruled that as of 2006, the term "Planet" no longer applies. This is a legislative act, not a logical deduction. Frege has no category for "truth by vote."

  ### 4. The Emotional Reaction: Loss of Essence

  Frege's framework goes silent on the public and scientific outrage.

  **Frege on Surprise:**
  Frege can account for the shock of reclassification. If the sense of "Planet" changes, the thought expressed by "Pluto is a planet" changes its truth value. A scientist who believed the old thought now realizes it is false under the new sense. This is cognitive dissonance.

  **Frege on Grief:**
  Frege cannot account for the feeling that Pluto *lost* something essential.
  *   **The Intuition:** People reacted as if Pluto's *nature* changed, not just its label. They spoke of Pluto being "demoted."
  *   **The Fregean Gap:** For Frege, reference is logical. If the reference of "Pluto" (the rock) is unchanged, and the concept "Planet" is just a bucket for sorting rocks, there is no ontological loss. The rock is the same.
  *   **The Missing Element:** The reaction implies that "Planet" is not just a Fregean concept with an extension, but a *natural kind* with essential properties (a Kripkean view, not Fregean). The public treated "Planet" as if it referred to a metaphysical status inherent to the object, which the IAU stripped away. Frege's distinction separates sense (mode of presentation) from reference (the object), but it does not accommodate the idea that the *social status* of the reference is part of its identity in a way that logic should track. The "loss" was normative, not logical. Frege's logic is descriptive of truth conditions, not normative of status.

  ### 5. Institutional Authority and Reference Fixing

  This is the point where the analogy completely fractures.

  **Frege's Reference Fixing:**
  For Frege, reference is determined by the satisfaction of the sense. If the sense is "the morning star," the reference is whatever object satisfies that description. It is a relationship between language and the world, mediated by abstract senses.

  **The IAU's Reference Fixing:**
  The 2006 vote demonstrates that in scientific taxonomy, reference can be fixed by *peer consensus* independent of prior usage.
  *   Prior to 2006, "Planet" successfully referred to Pluto for 76 years. The reference was stable.
  *   The IAU vote severed that link not because of a discovery about Pluto, but because of a decision about the *term*.
  *   **The Breakdown:** Frege's framework assumes that if we understand the sense, we find the reference. The Pluto episode shows that sometimes the community *decides* the reference by fiat, effectively rewriting the sense retroactively.
  *   **Implication:** This introduces a sociological variable into semantics that Frege's "third realm" excludes. The "informativeness" of the identity "Pluto is a dwarf planet" comes from institutional authority. It is informative because a governing body declared it so, not because the universe revealed a hidden identity. Frege's logic has no variable for "legislative power."

  ### Summary of What Works and What Fails

  **What Frege Explains (The Forced Fit):**
  *   **Cognitive Value:** Frege successfully explains why the statement is informative. The sense of "Planet" (pre-2006) and "Dwarf Planet" (post-2006) differ, so learning that Pluto falls under the latter but not the former adds knowledge.
  *   **Sense Variation:** It clarifies that the dispute was not about the object (reference) but the criteria (sense).

  **What Frege Misses (The Silent Gaps):**
  *   **Constitutive Revision:** Frege cannot model the *change* of sense by decree. His senses are abstract and timeless; the IAU treated the sense of "Planet" as mutable and political.
  *   **Normative Loss:** Frege cannot explain the emotional reaction. Logic tracks truth, not status. The feeling that Pluto was "demoted" implies a normative hierarchy that Fregean semantics ignores.
  *   **Authority as Truth-Maker:** The episode reveals that in scientific taxonomy, reference conditions can be fixed by vote. Frege's framework assumes reference is fixed by the relationship between sense and object, not by committee.

  **Conclusion:**
  The Hesperus/Phosphorus puzzle is epistemic (we didn't know the paths were the same). The Pluto puzzle is ontological and institutional (we changed the rules of the category). Frege's sense/reference distinction can map the *structure* of the terms, but it breaks down when asked to explain the *mechanism* of the change. It treats the shift as a correction of error, whereas the IAU vote was a revision of the framework itself. The informativeness of "Pluto is a dwarf planet" is not semantic discovery, but legislative notification. Frege's logic was built for mathematics and timeless truths, not for the sociology of scientific classification.
