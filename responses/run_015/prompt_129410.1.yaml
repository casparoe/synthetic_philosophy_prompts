  1.  **Analyze the User's Request:**
      *   **Context:** Environmental ethics course, debate about boiling crabs alive.
      *   **Core Issue:** The slogan "no cortex, no pain" is being used to dismiss crustacean suffering and critique legislation (like the UK Sentience Act).
      *   **Task:** Break down the precise claims hidden in "no cortex, no pain."
      *   **Specific Requirements:**
          *   Provide a "menu of readings" (conceptual breakdown, not actual bibliography).
          *   Cover four specific angles:
              1.  Necessary neural architecture for phenomenal consciousness.
              2.  Epistemic burden in welfare policy.
              3.  Analogical reasoning across species.
              4.  Distinction between nociception and affective suffering (specifically regarding distributed ganglia).
          *   For each version: Assess if it's a platitude, defensible, or false. Assess if it supports the classmate's conclusion (boiling isn't a moral problem).
          *   Address the "graded welfare thresholds" concept mentioned by the professor.
