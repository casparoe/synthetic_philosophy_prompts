  2.  **Deconstruct the Slogan ("No Cortex, No Pain"):**
      *   *Literal Meaning:* Mammals have a neocortex; crabs don't. Therefore, crabs don't feel pain.
      *   *Hidden Assumptions:* Pain *requires* a neocortex. Pain is binary (on/off). Pain is the only moral relevant factor.
      *   *Scientific Nuance:* Crustaceans have nervous systems, just different ones. Nociception (detection) vs. Pain (experience).

  3.  **Drafting the Four Conceptual Angles:**

      *   **Angle 1: Neural Architecture (The Hard Requirement)**
          *   *Claim:* Phenomenal consciousness (the feeling of "ouch") physically requires a neocortex or homologous structure.
          *   *Assessment:* Defensible in a strict mammal-centric view, but increasingly challenged by convergent evolution theories (e.g., Cambridge Declaration on Consciousness). It's not a flat-out falsehood, but it's scientifically narrowing.
          *   *Moral Conclusion:* If true, supports the classmate. If false, undermines it.
          *   *Status:* Defensible but contested.

      *   **Angle 2: Epistemic Burden (Policy & Precaution)**
          *   *Claim:* Since we can't prove they feel pain, we assume they don't until proven otherwise.
          *   *Assessment:* This flips the precautionary principle. In welfare policy, the burden is often on the *actor* to ensure no harm, not on the *victim* to prove harm.
          *   *Moral Conclusion:* Doesn't necessarily support the classmate. Even if we aren't sure, risk management might suggest treating them as sentient.
          *   *Status:* False/Weak in policy contexts.

      *   **Angle 3: Analogical Reasoning (Behavioral Inference)**
          *   *Claim:* Crabs don't act like mammals in pain, so they aren't in pain. OR: Crabs act like they are in pain (rubbing, avoiding), so the brain structure doesn't matter.
          *   *Assessment:* The slogan ignores behavior. If we rely on analogy, crabs show pain behaviors (trade-offs, learning).
          *   *Moral Conclusion:* Undermines the classmate. Behavior suggests suffering regardless of cortex.
          *   *Status:* False (ignores evidence).

      *   **Angle 4: Nociception vs. Affective Suffering (The Definition of Pain)**
          *   *Claim:* Crabs have nociceptors (reflexes) but no "hurt" (emotion/suffering).
          *   *Assessment:* This is the strongest version of the slogan. It distinguishes reflex from experience. However, distributed ganglia might process "negative states" differently.
          *   *Moral Conclusion:* If "pain" means "emotional suffering," maybe the classmate is right. But if "welfare" includes avoiding nociceptive stress, he's wrong.
