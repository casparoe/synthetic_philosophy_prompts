answer: |-
  ### 1. The menu

  Here are six distinct readings of "there is something it is like," ordered from thin (operational) to thick (metaphysical).

  1.  **Reportability.** (1) World: The system verbally asserts it has experiences. (2) Status: Platitude; defines consciousness by output. (3) GWT: Settles yes, provided a report module exists. (4) DB: No (by stipulation). DW: No subjects report.
  2.  **Global Access.** (1) World: Information is broadcast to multiple specialized subsystems. (2) Status: Substantive; equates consciousness with functional availability (Block). (3) GWT: Settles yes; this is the theory's core claim. (4) DB: Yes (broadcast exists). DW: Two distinct access streams.
  3.  **Higher-Order Representation.** (1) World: The system represents its own internal states as occurring. (2) Status: Substantive; requires meta-cognition (HOT theory). (3) GWT: No; standard GWT lacks mandatory self-modeling. (4) DB: No (no self-model route). DW: Two self-modeling subjects.
  4.  **Functional Isomorphism.** (1) World: Experience is identical to the functional structure itself. (2) Status: Substantive; philosophical functionalism. (3) GWT: Settles yes; structure determines experience. (4) DB: Yes (structure intact). DW: Two distinct subjects.
  5.  **Biological Naturalism.** (1) World: Specific biological causal powers generate experience. (2) Status: Substantive; substrate dependence (Searle). (3) GWT: No; architecture is irrelevant without biology. (4) DB: No (if silicon). DW: No subjects.
  6.  **Intrinsic Qualia.** (1) World: A non-functional, intrinsic property exists alongside processing. (2) Status: Substantive; the "Hard Problem" stance. (3) GWT: No; explains access, not intrinsic quality. (4) DB: Unknown/None. DW: Unknown/Two.

  Disagreements between Readings 2 and 4 are often merely verbal: both tie experience to function, differing only on whether "access" suffices for the whole structure. Reading 6 is the only one that strictly separates access from phenomenality.

  ### 2. Triage

  | Reading | Platitude? | GWT Settles? | Dark Broadcast | Dual Workspace |
  | :--- | :--- | :--- | :--- | :--- |
  | 1. Reportability | Yes | Yes (if added) | No | No |
  | 2. Global Access | No | Yes | Yes | Two streams |
  | 3. Higher-Order | No | No | No | Two subjects |
  | 4. Functionalism | No | Yes | Yes | Two subjects |
  | 5. Bio-Naturalism | No | No | No | No |
  | 6. Intrinsic | No | No | Unknown | Unknown |

  Readings 1–4 are functionalist variants; 5–6 are non-functionalist. GWT settles all functionalist readings except Higher-Order (which needs extra architecture). Non-functionalist readings remain open regardless of GWT completion. Dark Broadcast kills 1 and 3 by design; distinguishes 2/4 from 5/6.

  ### 3. What he actually needed

  For the comment "access ain't phenomenality" to land, the commenter must be using Reading 6 (Intrinsic Qualia) or possibly Reading 5 (Biological Naturalism). If they were using Reading 2 (Global Access) or 4 (Functionalism), the comment would be false by definition, because those readings *define* phenomenality as access or functional role. The comment asserts an explanatory gap: that describing the flow of information (access) leaves untouched the question of inner feeling (phenomenality).

  This requires Reading 6 to be true. Does it survive? Logically, yes; it is the standard dualist or property-dualist position. Empirically, it is idle; no experiment can confirm or deny intrinsic non-functional properties. The comment relies on the intuition that functional description is incomplete. If you reject Reading 6 as confused (Illusionism), the comment collapses. If you accept it, the comment is a platitude of the Hard Problem framework. The commenter assumes you share Reading 6 without stating it.

  ### 4. Where my case does and doesn't bite

  Your Dark Broadcast case cleanly discriminates between functional and non-functional readings. It kills Reading 1 (Reportability) and Reading 3 (Higher-Order) by stipulation, as you removed the reporting and self-modeling routes. It confirms Reading 2 and 4 (Access/Functionalism) because the broadcast architecture remains intact. It leaves Reading 5 and 6 (Bio/Intrinsic) untouched, as they depend on substrate or metaphysics, not architecture.

  The Dual Workspace variant tests subject unity. Readings 2, 3, and 4 imply two subjects (two functional clusters). Reading 6 is ambiguous; intrinsic qualia might not individuate by functional boundaries. Where your case doesn't bite is between Reading 2 and 4; both say "Yes" to Dark Broadcast. The disagreement there is merely verbal: whether "access" exhausts the functional role required for experience. Your case forces the commenter to admit whether they care about the *broadcast* (Reading 2) or the *intrinsic glow* (Reading 6).

  ### 5. Things I can post in the thread

  1.  "When you say 'something it's like,' do you mean reportable access or intrinsic quality?"
  2.  "If a system broadcasts data globally but cannot report it, is it conscious?"
  3.  "Is the gap between access and phenomenality empirical or conceptual?"
  4.  "Does Global Workspace Theory fail because it lacks biology or because it lacks qualia?"
  5.  "If two disjoint workspaces run on one input, is that one subject or two?"
  6.  "Are you asserting consciousness is non-functional, or just unexplained by current function?"
