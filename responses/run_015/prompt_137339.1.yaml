prompt: |-
  You are a professional philosopher who works on population ethics, infinite aggregation, and the foundations of decision theory. Please answer in that capacity, and take your time: before committing yourself, I'd find it most useful if you sketched out three or four candidate diagnoses of the argument below, said what each one would cost to give up, and only then defended the one you actually favor.

  I'm a journalist who covers science and ideas, and I'm midway through a long feature on how people who try to take the very long-term future seriously actually handle value — the cosmologists, the risk people, the moral philosophers. I've got stuck on one piece of machinery and I don't want to get it wrong in print. A cosmologist I interviewed shrugged off the possibility that the world contains infinitely many lives, or that a civilization that makes it out of this century could fill an unbounded future, as if it made no practical difference. A philosopher friend said that this is where the standard aggregation machinery gives out, but couldn't tell me which joint fails. A mathematician friend, hearing my paraphrase, proposed a fix: instead of totalling value over the whole infinite world, fix a nested sequence of bounded regions — spheres of radius r around some centre, growing without bound — compute the welfare inside each, and compare worlds by the limiting behaviour of that sequence, perhaps by taking the value of the sequence in a non-Archimedean sense rather than an ordinary real limit. I've tried to write out the reasoning myself, including his fix, and I don't like where it lands, which makes me think I've built a bad argument rather than discovered a real result. I'd like you to find the bad step.

  My reconstruction, with an outcome called big if it contains infinitely many lives at positive welfare and infinitely many units of realized value:

  1. Serious cosmology gives us a non-trivial probability that the outcomes we choose between are big — infinitely many lives across infinite space, or an unbounded future.
  2. Pairing Principle: if the persons in outcome A can be put into one-one correspondence with the persons in outcome B such that everyone in A is at least as well off as their partner in B and someone is better off, then A is better than B.
  3. Between any two countably infinite collections there are infinitely many bijections, and for big outcomes in which everyone enjoys the same positive welfare there exist bijections witnessing the Pairing Principle in both directions — Hilbert's-Hotel style shuffling.
  4. So the Pairing Principle either contradicts itself or must be read as requiring unanimity across all bijections, in which case it yields: no big outcome is better than any other. On either reading it delivers nothing: big outcomes are equally good, or incomparable.
  5. If big outcomes are equally good or incomparable, then no finite difference we can make now — averting a war, funding a vaccination programme, not funding one — improves the world, since the world is big either way and finite differences do not register against an infinite total.
  6. The mathematician's window-averaging criterion repairs this: a future with happy lives at twice the density per cubic megaparsec comes out twice as good as one at half the density, and a world in which every second person is miserable comes out worse, which is what we wanted.
  7. But window-averaging makes an outcome's value depend on where the spheres are centred, on their shape, and on how fast they grow: recentre them on a different galaxy, switch to cubes, alter the growth schedule, and for some pairs of outcomes the verdict flips — while no individual's life has been altered by so much as a hair.
  8. Rearrangements, relabelings and re-coordinatizations that change no one's experience are morally irrelevant, and there is no fact of the matter about where the centre of an infinite world is; how good the world is cannot depend on where I mentally stand when I add things up.
  9. So by 7 and 8, window-averaging is morally arbitrary; and by 2–5 and 8, the only structure-independent criterion available is paralysis.
  10. Therefore there is no coherent way of aggregating value in infinite contexts, and since we cannot rule out a big future, any long-termist cost-effectiveness reasoning that leans on the size of the future rests on a criterion that either collapses into indifference or smuggles in arbitrary structure.

  Which step do you reject, and what does rejecting it cost? I'm interested in whether the failure is a genuine error of inference — an equivocation between one reading of a term and another, a quantifier or scope shift, a slide from a mathematical existence claim to a moral one — or whether the argument is in good order and the real question is which plausible premise is least expensive to abandon. Please explain why the step you reject looked fine, and price the main alternatives rather than just listing them. If I have to choose, I would rather keep 8 than keep 6, and I would sooner give up the Pairing Principle than accept 5; tell me if that ordering is itself a mistake.

  Two further things I need for the piece. First, does the diagnosis change if the infinity is spatial — infinitely many people existing now — rather than temporal, an unending future, or if it's merely an infinite sequence of finite worlds? Second, and this is the claim my editors will push on: does the possibility of an infinite future do any independent work in arguments for prioritizing existential risk, or does the finite-but-astronomically-large version of those arguments carry all of the weight anyway, with the infinite case only dramatizing it? Please don't give me citations or a reading list — I have interviewees for that — and assume I've read the survey-level material; what I need is the conceptual structure and the prices.
