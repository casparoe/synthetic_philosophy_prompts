  3.  **Retrieve Expert Knowledge (Al-Ghazali & Ash'arism):**
      *   *Causation:* Al-Ghazali denies *necessary* connection (*darura*) between created things. He does not necessarily deny that fire burns, but denies that fire *by its essence* forces burning. God creates the burning *at the occasion* of contact.
      *   *Custom (*'Ada*):* God's habit is not a constraint on Him. It is a voluntary consistency for the sake of human order/knowledge. It is not a "law of nature" in the modern sense, nor a blind loop.
      *   *Human Agency:* This is the trickiest part. Ash'arites hold to *kasb* (acquisition). God creates the act, the human "acquires" it. Is it window dressing? Al-Ghazali tries to preserve moral responsibility. He distinguishes between voluntary and involuntary acts. Calling it *just* window dressing ignores his epistemological and legal efforts to make sense of responsibility.
      *   *Motivation:* Why deny necessary causation? Primarily to protect Divine Omnipotence (*qudra*) and the possibility of miracles. But also an epistemological point: we only observe conjunction, not connection (Humean anticipation).
      *   *Science:* Can science exist? Yes, as the study of God's customary ways (*sunan Allah*). It's not "fake," but it's contingent, not necessary.

  4.  **Evaluate the Claims (Drafting the Audit):**

      *   *Claim 1 (Fire/Cotton):* Accurate core. This is the famous example from *Tahafut*.
      *   *Claim 2 (Programmer/Loop):* Simplification. "Habit" (*'ada*) implies will and wisdom, not code. A loop implies automatism. Ghazali emphasizes God's *continuous* will, not a set-and-forget mechanism.
      *   *Claim 3 (Miracles/Subroutine):* Simplification/Misrepresentation. Miracles aren't just "different code"; they are breaks in the habit to signify prophethood. The analogy makes it sound arbitrary rather than significative.
      *   *Claim 4 (Human Actions):* Mostly Accurate regarding the metaphysics (God creates the act), but needs nuance on the "choice" aspect.
      *   *Claim 5 (Kasb as Window Dressing):* **Major Misrepresentation.** This is a common critique (e.g., by Averroes or modern scholars), but treating it *only* as window dressing ignores Ghazali's attempt to ground legal responsibility (*taklif*). He argues the connection between will and act is real, even if created by God.
      *   *Claim 6 (Micromanagement):* Accurate description of occasionalism, though "micromanagement" has a pejorative bureaucratic connotation. "Sustenance" (*imdad*) is better.
      *   *Claim 7 (Science/Correlation):* Nuanced. Science studies the *habit*, which is real enough for practical life. Saying "no underlying causal structure" is true metaphysically, but science still has an object of study (the patterns of creation).

  5.  **Address Specific Prompt Questions:**
