          *   *Follow-ups:* Make sure they aren't just "Why?" but specific counters to the expected Kuhnian move.
          *   *Summary Line:* Must start with "Summary:" and be one sentence.

  4.  **Finalizing the Content (Mental Simulation):**

      *   *Q1:* Focus on "natural kinds." How does a paradigm tell you what counts as an object?
      *   *Q2:* Focus on "translation." Why can't they just define terms?
