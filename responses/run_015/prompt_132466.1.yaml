  before the house bred its first Tyrant.
  Advice was sought from gray-bearded Elders,
  who locked the gate against the rusting Gold.
  The market square respected every Voice,
  and order held the breathing Crowd.

  Now silence swallows the unruly Crowd.
  We name the heir and crown a new King,
  but he speaks with a borrowed Voice.
  He fears the knife of some hidden Tyrant.
  The chest is empty of the ancestral Gold.
  The Elders watch the walls for fire.

  Fire lights the faces of the Elders.
  They sell the silver to pacify the Crowd.
  Who reads the charter written for the King?
  The script demands a loud and angry Voice.
  A candidate emerges, nearly Tyrant,
  who promises to melt down public Gold.

  They spend the melted veins of Gold
  to buy the silence of the Elders.
  The stage is set for one man, Tyrant,
  who calms the noise of the frantic Crowd.
  He claims the mantle of the dead King,
  but lacks the throat to raise a Voice.

  No one listens to the common Voice.
  The vaults are stripped of all their Gold.
  We act the part of the returning King.
  The council sits, a ghost of Elders.
  The street is packed, a waiting Crowd.
  The script calls for the final Tyrant.

  Run fast, the clock hands seek the Tyrant.
  Spend quick, there is no leftover Gold.
  Gather tight, the impatient Crowd.
  Speak loud, though no one owns a Voice.
  Sit down, you painted mock-Elders.
  Begin again, the silent King.

  The Tyrant spends the last of Gold,
  The Crowd forgets how to use a Voice,
  The Elders bow to the hollow King.

  ***

  **Note**

  End-words map to Polybius's cycle: King (Monarchy), Tyrant (Tyranny), Elders (Aristocracy), Gold (Oligarchy), Voice (Polity), Crowd (Ochlocracy). The drift is registered in the adjectives and syntax: the first King wears iron; the last is silent, then hollow. Early stanzas use full sentences; later stanzas tighten into imperatives ("Run fast," "Spend quick"), embodying the archive effect where knowledge of the cycle accelerates its decay. The restoration discount appears in the thinning authority of repeated terms ("borrowed Voice," "mock-Elders"). The form cycles, but the content entropy is linear.
