answer: |-
  ### Exam Question: Philosophy 12 – Elective Module
  **Topic:** Agency, Time, and Weakness of Will
  **Time Allowed:** 30 Minutes
  **Total Marks:** 20

  **Question 1: The Zero-Cost Procrastination Case**

  Read the following case study and answer the questions below.

  > **Case: The Open Tab**
  > Jordan finds a government rebate form online. It pays $50, takes exactly 45 seconds to fill out, and the money is deposited immediately upon submission. Jordan has the information ready, the tab is open on their laptop, and they genuinely prefer having the $50 to not having it. There is no effort cost, no waiting period, and no risk.
  >
  > Yet, Jordan leaves the tab open for three weeks. Every time they walk past the laptop, they think, "I should do that," but they walk away. They do not switch to a more enjoyable task; they often just check the news or stare at the wall. Eventually, the link expires.

  **A)** Standard hyperbolic discounting models explain weakness of will as a conflict between a "patient long-term self" and an "impulsive short-term self," driven by **present bias** (overvaluing immediate rewards/relief). Explain why this standard model struggles to explain Jordan's behaviour in *The Open Tab* case. **(5 marks)**

  **B)** Propose **one** psychological or structural modification to the standard model (e.g., regarding attention, salience, or status quo bias) that could explain why Jordan fails to act despite zero cost. **(5 marks)**

  **C)** Based on your explanation in (B), argue whether Jordan's failure counts as genuine **akrasia** (weakness of will) or a different category of action failure. Recall that akrasia typically requires acting against one's better judgment. Justify your classification. **(10 marks)**

  ***

  ### Model Answer (Approx. 550 words)

  **A) The Failure of Standard Discounting**
  Standard hyperbolic discounting relies on a trade-off between time and magnitude. It suggests an agent procrastinates because the immediate "cost" of effort feels heavier now than it will in the future, or the immediate reward of leisure outweighs the future reward of the task. In *The Open Tab*, this mechanism breaks down. There is no delay in the reward (immediate deposit) and no significant effort cost (45 seconds). For a hyperbolic discounter to delay, they must be valuing the immediate relief of *not* acting higher than the $50. But since the act is effortless, there is no relief to be gained. The standard model assumes a conflict of preferences over time, but Jordan's preference remains stable ($50 > $0) across all time points. Therefore, simple present bias cannot explain why a costless action is repeatedly deferred.

  **B) The Attention and Salience Modification**
  To explain this, we must look beyond time-discounting to **cognitive salience** or **attention costs**. Even if an action has no physical cost, it may have a "psychic switching cost." For Jordan, the open tab is background noise; it lacks salience. The model can be modified to include an "activation energy" required to shift attention from a passive state (walking past) to an active state (typing). If the task is not emotionally salient—it doesn't feel urgent or exciting—the agent remains in a **status quo bias**. The "cost" isn't effort or time; it is the cognitive load of initiating the sequence. Jordan isn't discounting the future; they are failing to register the present opportunity as a call to action.

  **C) Akrasia or Negligence?**
  This modification changes whether we classify the behaviour as akrasia. Traditional akrasia (following Davidson) requires acting against one's "all-things-considered judgment." Jordan clearly holds the judgment ("I should do this"). However, if the failure is due to low salience or attentional drift rather than a conflict of desire, it resembles **negligence** more than weakness of will.

  In standard akrasia, I want to diet but eat the cake because the desire for cake *overpowers* my judgment. In Jordan's case, there is no overpowering desire. There is simply an absence of motivation. If we accept the attention-modified model, Jordan isn't "weak"; they are psychologically inert. However, one could argue it remains akrasia if Jordan *judges* that they should pay attention and *fails* to do so. If Jordan thinks, "I need to focus on this tab," and still walks away, they are acting against a second-order judgment about their own attention.

  Ultimately, if the mechanism is purely status quo bias (inertia), it is not akrasia, because there is no counter-volition. It is a failure of agency, not a conflict of will. But if Jordan actively avoids closing the loop because closing it ends the "potential" of the task (fear of completion), then it returns to akrasia. Given the case description, the lack of conflicting desire suggests this is **negligence driven by low salience**, not strict akrasia. The standard model fails because it assumes we always act on our strongest preference; here, Jordan acts on no preference at all.

  ***

  ### Marking Scheme (20 Marks)

  **Goal:** Distinguish students who understand the *limits* of the theory (A) from those who can only *describe* the theory (B/C).

  #### Part A: Critique of Standard Model (5 Marks)
  *   **0-2 Marks (C Range):** Defines hyperbolic discounting correctly but claims it explains the case (e.g., "Jordan values leisure now"). Fails to notice the zero-cost constraint.
  *   **3-4 Marks (B Range):** Identifies that there is no time delay or effort cost. States that standard discounting needs a trade-off to function.
  *   **5 Marks (A Range):** Clearly articulates that without a "cost of effort" or "delay of reward," the discount curve has nothing to bite on. Notes that preference is stable over time, ruling out preference reversal.

  #### Part B: Alternative Mechanism (5 Marks)
  *   **0-2 Marks (C Range):** Vague answers like "Jordan is lazy" or "Jordan is irrational." No structural modification proposed.
  *   **3-4 Marks (B Range):** Proposes a valid concept (Status Quo Bias, Salience, Attention Cost) but doesn't explain *how* it functions as a cost.
  *   **5 Marks (A Range):** Explicitly frames the alternative as a "switching cost" or "salience threshold." Explains that the barrier is cognitive activation, not physical effort.

  #### Part C: Classification as Akrasia (10 Marks)
  *   **0-4 Marks (C Range):** Says "Yes it is akrasia because he didn't do what he wanted." No reference to judgment or conflicting desires.
  *   **5-7 Marks (B Range):** Uses the definition of akrasia (acting against judgment). Argues Yes or No consistently. **Limit:** Treats the definition as static; doesn't consider how the mechanism in (B) changes the classification.
  *   **8-10 Marks (A Range):** **Nuanced analysis.** Connects Part B to Part C. Argues that if the cause is *inertia/salience*, it might not be akrasia (no conflicting desire), but if it involves a judgment about attention, it could be. Distinguishes between "conflict of will" vs. "failure of agency/negligence."

  #### Grade Boundaries
  *   **15-20 (A):** Clear critique of the standard model, sophisticated alternative mechanism, nuanced philosophical classification.
  *   **10-14 (B):** Good understanding of standard model, identifies the problem, but the alternative mechanism or philosophical classification is standard/rote.
  *   **0-9 (C):** Misunderstands the case or the theory. Applies hyperbolic discounting where it doesn't fit.

  ***

  ### Common Wrong Answers (For Distractors/Feedback)

  1.  **"Jordan is discounting the $50."**
      *   *Why it's wrong:* The case states Jordan prefers having the money. Hyperbolic discounting explains why we devalue *future* money, but this money is immediate upon action.
  2.  **"It's just laziness."**
      *   *Why it's wrong:* "Laziness" is a label, not an explanation. Philosophy requires a mechanism (e.g., valuation of effort vs. reward). In this case, effort is near-zero, so laziness doesn't explain the *mechanism*.
  3.  **"Jordan is using a commitment device."**
      *   *Why it's wrong:* Jordan is failing to act, not setting up constraints. This confuses the *solution* to akrasia with the *cause*.
  4.  **"This proves humans are irrational."**
      *   *Why it's wrong:* Too broad. The question asks about specific models of time and will. "Irrational" doesn't distinguish between discounting errors and attention errors.
  5.  **"The cost is the 45 seconds."**
      *   *Why it's wrong:* While technically time, the prompt specifies this is negligible. An A answer recognizes that for a discount model to work, the agent must perceive the cost as significant enough to trade off against the reward. If they don't, the model fails.
