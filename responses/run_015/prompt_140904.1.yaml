prompt: |-
  I'm a PhD candidate in economics and I'm presenting my job-market paper next month at a public policy school's economic theory workshop. The room will be about twelve people, seminar format, thirty minutes plus a very long question period, and it breaks down roughly like this: two behavioral economists who run incentive-compatible lab elicitations and care about elicitation machinery above all; a development economist who does survey-experimental work on subjective well-being; a health economist who builds QALY-style measures by person trade-off; one social choice theorist of the old school; and a philosopher of economics who has written on welfarism and who is the person I most want to survive. Assume they have read nothing of mine in advance.

  The thesis I'm defending is that interpersonal comparisons of well-being need not be assumed as a global, all-or-nothing premise — either as a metaphysical posit about a single mental magnitude, or as the equiprobability-style identification that does the work in Harsanyi-style aggregation — but can be discovered pairwise and locally, and can fail. Call the elicitation the swap test. In stage one I fix a reference good and a reference gamble over it and use each subject's certainty equivalent to estimate her risk curvature. In stage two I ask her to name the probability at which she is indifferent between remaining in her own circumstances for sure and a lottery that, with that probability, moves her into the other person's circumstances and otherwise leaves her where she is. Her stage-one curvature lets me convert that probability into a stated level-difference between the two positions. Two people are then mutually calibrated when, after that conversion, her implied difference between her position and his equals the negative of his implied difference between his position and hers, and I take the common value as the interpersonal comparison for that pair. Calibration is chained across overlapping pairs to build a comparison graph; where chains conflict I reconcile them by least squares over log-ratios and accept that what comes out is a partial rather than a complete social ordering. The pitch is that comparability becomes an empirical relation with a testable failure mode, so the framework can represent "these two genuinely cannot be compared" instead of forcing a ranking the way a full-comparability axiom does. My sketch of the argument is: (i) the familiar complaint that utility is defined only up to positive affine transformation, so that the choice of a unit is a moral stipulation, is correct within the single-person expected-utility setting but that setting is under-described — once you let people have preferences over lotteries in which they occupy someone else's position, the identification problem is overconstrained by cross-person data; (ii) so the symmetry assumption that has to be stipulated in the aggregation theorems is instead derived from a condition that can be checked; (iii) and because the condition can fail for a pair, the resulting ordering is partial, which handles incomparability that the standard framework can only handle by stipulation.

  What I want from you is a Q&A prep sheet written for that specific room and not for my advisor. Give me the eight or so objections I will actually get, in roughly the order they will come, each phrased the way the relevant person would put it: the behavioral economists in the vocabulary of incentive compatibility, reference dependence, status quo bias and whether a hypothetical swap can be made binding; the health economist asking how this differs from person trade-off and what it buys over the measures already in use; the social choice theorist in the vocabulary of Arrow-style conditions and, especially, what happens to the weak Pareto condition once the social ordering is incomplete; the philosopher asking whether I have quietly changed the subject from welfare to fairness. For each objection: how much damage it does if I handle it badly, a two-minute version of the reply I should give out loud, and an honest note on where that reply is soft. Tell me what I should concede in the first two slides rather than be forced into later — I suspect there is something about risk attitudes contaminating willingness-to-swap that I should give up immediately, but you should tell me if I'm wrong about which concession to make. I also want the objection I am hoping nobody asks. Two friends at a conference dinner gave me two candidates: a behavioral economist said the whole apparatus is just envy-freeness from the fair-division literature with extra steps, and the social choice theorist said it is Harsanyi with an elicitation detour bolted on. I want to know which of those has real force, which is a cheap shot I can dispatch in a sentence, and whether there is a worse one I haven't thought of — my advisor keeps muttering that I cannot separate a person's circumstances from her preferences, and I don't yet know how bad that one is. Finally: my advisor and I disagree about how much of this is settled, so in your notes please separate what people who actually work on welfare economics and social choice would grant without argument from what is genuinely contested in the literature, and where one of my replies depends on a contested reading — whether aggregation results of that kind are best read as arguments for utilitarianism or as reductios of their own assumptions, whether fairness criteria like no-envy are welfarist at all, whether interpersonal comparability is even the right name for what I'm measuring — say so explicitly rather than presenting it as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** PhD candidate in economics.
      *   **Task:** Job-market paper presentation at a public policy school's economic theory workshop.
      *   **Audience:** 12 people, specific mix (2 behavioralists, 1 development, 1 health, 1 social choice theorist, 1 philosopher).
      *   **Format:** 30 min talk, *very long* Q&A.
      *   **Topic:** Interpersonal comparisons of well-being (IPC) via a "swap test" (risk curvature + probability equivalence). Claims IPC is empirical, local, pairwise, and can fail (partial ordering).
      *   **Goal:** A Q&A prep sheet tailored to *this* room, not a generic advisor. Needs specific objections, damage assessment, reply scripts, soft spots, strategic concessions, and a "nightmare question."
      *   **Tone:** Professional, sharp, realistic, acknowledging the high stakes (job market).

  2.  **Deconstruct the Paper's Core Argument:**
      *   *Mechanism:* Stage 1 (Risk curvature via certainty equivalent) + Stage 2 (Probability indifference for swapping positions).
      *   *Claim:* Solves the identification problem (affine transformation issue) by using cross-person lottery preferences.
      *   *Innovation:* Comparability is testable/empirical, not axiomatic. Allows for incomparability (partial ordering).
      *   *Calibration:* Mutual calibration (symmetry) + Chaining (least squares on log-ratios).

  3.  **Analyze the Audience & Anticipate Objections:**

      *   **Behavioral Economists (2):** Care about incentive compatibility, hypothetical bias, reference dependence.
          *   *Objection:* "Is this binding? Can you incentivize a swap of *life circumstances*? Reference points shift when you imagine being someone else."
      *   **Development Economist (Subjective Well-being):** Care about surveys, self-reports vs. revealed preference.
          *   *Objection:* "Why not just ask them how happy they are? Why the complex lottery machinery?" (Though the prompt focuses less on this person, I should integrate their vibe into the "measurement" critiques).
      *   **Health Economist (QALY/Person Trade-Off):** Care about PTO methods.
          *   *Objection:* "This looks exactly like Person Trade-Off (PTO). What's the gain? PTO already does interpersonal weighting."
      *   **Social Choice Theorist (Old School):** Care about Arrow, Pareto, axioms.
          *   *Objection:* "Weak Pareto with incomplete ordering? If you can't compare, do you violate Pareto? Is this just Harsanyi with extra steps?"
      *   **Philosopher (Welfarism):** Care about the definition of welfare vs. fairness.
          *   *Objection:* "Are you measuring welfare or fairness (envy)? You've changed the subject."
      *   **Advisor's Worry:** "Cannot separate circumstances from preferences." (Crucial).

  4.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Behavioral):* Incentive Compatibility. You can't pay people to swap lives.
          *   *Reply:* It's a revealed preference over lotteries, not a literal swap.
          *   *Soft Spot:* Hypothetical bias is huge here.
      *   *Objection 2 (Health):* PTO similarity.
          *   *Reply:* PTO assumes comparability; I test it.
          *   *Soft Spot:* PTO practitioners already know their numbers are fuzzy.
      *   *Objection 3 (Social Choice):* Harsanyi detour.
          *   *Reply:* Harsanyi assumes it; I derive it.
          *   *Soft Spot:* Is the derivation actually distinct or just semantic?
      *   *Objection 4 (Philosopher):* Welfare vs. Fairness (Envy).
          *   *Reply:* Envy is about resources; this is about well-being levels.
          *   *Soft Spot:* The "swap" language invites envy interpretations.
      *   *Objection 5 (Advisor's Worry):* Circumstances vs. Preferences.
          *   *Reply:* I hold preferences fixed, vary circumstances.
          *   *Soft Spot:* Preferences adapt to circumstances (adaptive preferences).
      *   *Objection 6 (Social Choice):* Weak Pareto & Incompleteness.
          *   *Reply:* Pareto holds where comparisons exist.
          *   *Soft Spot:* Policy paralysis if comparisons fail often.
      *   *Objection 7 (Behavioral):* Reference Dependence.
          *   *Reply:* Stage 1 controls for curvature.
          *   *Soft Spot:* Imagining *being* someone else changes the utility function, not just the outcome.
      *   *Objection 8 (The "Nightmare"):* The "Separation" problem (Advisor's muttering).

  5.  **Refining the "Nightmare" Question:**
      *   Friend 1: "Envy-freeness with extra steps."
      *   Friend 2: "Harsanyi with elicitation detour."
      *   Advisor: "Cannot separate circumstances from preferences."
      *   *Analysis:* The Advisor's point is the deepest. If utility is defined over (outcome, preference type), and preference type is endogenous to circumstances, the "swap" is ill-defined. This is the real killer. The Harsanyi charge is a cheap shot if handled well (axiom vs. empirical test). The Envy charge is category error (resources vs. utility).
      *   *Decision:* The "Separation" objection is the worst. The "Harsanyi" one is the most likely to be asked by the Social Choice theorist.

  6.  **Strategic Concessions (First Two Slides):**
      *   User suspects risk attitudes contaminate willingness-to-swap.
      *   *Verdict:* Yes, concede this. Risk attitude over *own* outcomes might differ from risk attitude over *identity* outcomes. Also, concede that this measures *decision utility* not *experienced utility* (Philosopher/Development point).
      *   *Better Concession:* Concede that "circumstances" includes adaptive preferences unless explicitly controlled. Concede that incentive compatibility is hypothetical.

  7.  **Mapping Consensus vs. Contested:**
      *   *Consensus:* Utility is affine invariant within a person. Arrow's Impossibility holds for ordinal non-comparable inputs.
      *   *Contested:* Whether Harsanyi's theorem justifies utilitarianism. Whether interpersonal comparability is meaningful. Whether "no-envy" is welfarist.
      *   *User's Contested Claim:* That comparability is an empirical fact rather than an ethical axiom.

  8.  **Drafting the Content (incorporating specific voices):**
      *   *Behavioral:* Use terms like "incentive compatible," "hypothetical bias," "endowment effect."
      *   *Health:* Use "PTO," "QALY weights," "social value function."
      *   *Social Choice:* Use "domain restriction," "Pareto," "social welfare functional."
      *   *Philosopher:* Use "welfarism," "metric," "ontological status."

  9.  **Review against Constraints:**
      *   8 objections? Yes.
      *   Order roughly as they will come? (Start with methods/behavioral, move to theory/philosophy).
      *   Damage assessment? Yes.
      *   2-minute reply? Yes.
      *   Soft spot? Yes.
      *   Concessions? Yes.
      *   Nightmare question? Yes.
      *   Consensus vs. Contested notes? Yes.

  10. **Final Polish:** Ensure the tone is supportive but rigorous (like a senior colleague prepping a junior). Make sure the distinction between the "Harsanyi detour" and the "Separation" problem is clear. (Self-Correction: The prompt asks specifically about the two friends' suggestions vs the advisor's worry. I need to evaluate those specifically).

      *   *Friend 1 (Envy):* Weak. Envy is resource-based; this is utility-based.
      *   *Friend 2 (Harsanyi):* Medium. Needs careful distinction between *axiomatic assumption* vs. *empirical derivation*.
      *   *Advisor (Separation):* Strongest. If preferences adapt, the "other person's circumstances" bundle includes their preferences, making the comparison circular or meaningless.

      *Let's structure the response.*

      *   **Section 1: Strategic Concessions (Slides 1-2).**
      *   **Section 2: The 8 Objections (Audience specific).**
      *   **Section 3: The Nightmare Question (Advisor vs. Friends).**
      *   **Section 4: Consensus vs. Contested Map.**

      *Refining the "Risk Attitude" concession:* The user thinks they should concede risk attitudes contaminate the swap. Actually, the model *uses* risk attitude (Stage 1) to correct the swap (Stage 2). The real contamination is *identity risk* vs. *outcome risk*. I should advise them to concede that Stage 1 risk might not apply to Stage 2 identity lotteries.

      *Refining the "Harsanyi" objection:* The Social Choice theorist will pounce on this. The reply must be: Harsanyi *assumes* the VNM axioms hold across persons to get the sum. I *test* if the VNM structure holds across persons to get the ratio.

      *Refining the "Separation" objection:* This is the ontological kill shot. If I swap into your body, do I get your utility function? If yes, I'm not comparing *my* welfare in two states. If no, I'm imagining a counterfactual that doesn't exist.

      *Okay, ready to write.*
answer: |-
  Here is your Q&A prep sheet. It is calibrated for the specific composition of the room and the stakes of a job-market talk. The tone is direct: your goal is not to "win" every point, but to demonstrate you understand the boundaries of your contribution and where the bodies are buried.

  ### Part 1: Strategic Concessions (Slides 1–2)
  **Do not wait to be cornered.** Pre-empt the two biggest methodological attacks by framing them as scope conditions.

  1.  **Concede the "Identity Risk" Contamination:** You suspect risk attitudes contaminate the willingness-to-swap. You are right, but be specific.
      *   *Say:* "Stage 1 measures risk aversion over *goods*. Stage 2 involves risk over *identities*. I assume the curvature parameter transfers. I acknowledge this is a strong assumption. If subjects treat 'becoming someone else' as a distinct risk domain, my calibration is biased. I treat this as an empirical testable restriction, not a theorem."
      *   *Why:* This disarms the Behavioralists. They can't attack you for ignoring it if you flag it as a primary limitation.
  2.  **Concede the "Circumstance/Preference" Entanglement:** Your advisor is right to mutter about this.
      *   *Say:* "When I ask you to imagine 'Person B's circumstances,' I am holding *your* preference structure fixed and changing the constraint set. I am not asking you to simulate Person B's psychology. This measures *your* evaluation of their position, not an objective 'view from nowhere.' Consequently, this is a measure of *social evaluation* suitable for policy, not necessarily a metaphysical claim about experienced utility."
      *   *Why:* This satisfies the Philosopher (you aren't claiming ontological magic) and the Development Economist (you admit this is survey/decision utility).

  ---

  ### Part 2: The Eight Objections
  *Ordered roughly by who speaks first (Behavioral/Methods) to who speaks last (Theory/Philosophy).*

  #### 1. The Behavioralists (Incentive Compatibility)
  **Objection:** "This is hypothetical cheap talk. You cannot make a 'life swap' lottery incentive compatible. If there's no real consequence to saying you'd swap, you're measuring cheap signaling or social desirability, not revealed preference. How do you know the probability $p$ isn't just noise?"
  *   **Damage:** **High.** If the mechanism isn't incentive compatible, the data is meaningless to them.
  *   **Reply:** "You are correct that a literal life-swap cannot be incentivized. However, we incentivize the *choice* mechanism using standard lottery payment schemes (e.g., one trial is selected for real payment in a financially equivalent frame). While we cannot pay in 'lives,' we calibrate the financial stakes to be salient. More importantly, my claim isn't that this is noise-free, but that the *structure* allows for a test of consistency (the mutual calibration check). If they lie randomly, the graph won't calibrate. If they lie systematically, we detect it via the failure of the symmetry condition."
  *   **Soft Spot:** Financial incentives don't validate hypothetical life choices. You are relying on the assumption that preferences over small financial lotteries map to preferences over life lotteries.

  #### 2. The Behavioralists (Reference Dependence)
  **Objection:** "Status quo bias. When I evaluate staying in my life vs. yours, my current endowment is the reference point. Loss aversion will skew the probability $p$. You aren't measuring well-being; you're measuring loss aversion relative to the status quo."
  *   **Damage:** **Medium.** It undermines the cardinality of your measure.
  *   **Reply:** "That is precisely why Stage 1 exists. Stage 1 estimates the curvature of the utility function, which captures risk and loss attitudes *within* the individual's frame. We use that curvature to linearize the Stage 2 probability. We are explicitly correcting for the reference-dependent curvature to isolate the level difference. If loss aversion varies *between* the swap and the financial task, that is the 'Identity Risk' contamination I conceded in Slide 2."
  *   **Soft Spot:** Loss aversion over identity might be structurally different from loss aversion over money.

  #### 3. The Health Economist (Person Trade-Off)
  **Objection:** "This is Person Trade-Off (PTO). We've done this for QALYs for thirty years. We ask people how many lives to save in Group A to equal one life in Group B. What does your 'swap test' buy me over standard PTO weights?"
  *   **Damage:** **Medium.** Risks making your paper look like reinvented wheels.
  *   **Reply:** "PTO typically asks a *social planner* to weigh two *third parties*. My test asks the *individual* to weigh themselves against another. PTO assumes interpersonal comparability to aggregate; I use the individual's own risk preferences to *derive* the comparability ratio. PTO gives you a social weight; I give you a test of whether a weight exists. If my 'calibration condition' fails for a pair, PTO forces you to pick a number anyway. I allow the data to say 'no comparison possible.'"
  *   **Soft Spot:** Policy makers hate "no comparison." They will force a number regardless of your test failure.

  #### 4. The Development Economist (Subjective Well-being)
  **Objection:** "Why the complex machinery? If I want to know if Person A is better off than Person B, I ask them 'How satisfied are you?' on a 0-10 scale. Can-cantril ladders work better than hypothetical swap lotteries. Why not just use SWB data?"
  *   **Damage:** **Low.** They are in the minority here, but the question signals simplicity.
  *   **Reply:** "SWB scales assume cardinality and comparability of the *reports* themselves (is my 7 your 7?). My method derives the cardinality from the axioms of choice under risk. SWB is a direct report of feeling; this is a revealed preference over states. They measure different constructs. My method is designed to be consistent with economic choice theory, which SWB often struggles to integrate."
  *   **Soft Spot:** SWB is cheaper and easier. If your method is too costly, it won't be used.

  #### 5. The Social Choice Theorist (Harsanyi Detour)
  **Objection:** "This is just Harsanyi with an elicitation detour bolted on. Harsanyi shows that if you satisfy Pareto and VNM axioms, you get a weighted sum. You're just empirically estimating the weights. You haven't solved the identification problem; you've just assumed the VNM axioms apply across persons."
  *   **Damage:** **High.** This attacks the theoretical novelty.
  *   **Reply:** "Harsanyi *assumes* interpersonal comparability to derive the social welfare function. I am deriving the comparability *from* individual preferences over 'position lotteries.' In Harsanyi, the unit of utility is a moral stipulation (the 'equiprobability' assumption). In my framework, the unit is an empirical finding (the calibration condition). If the calibration fails, Harsanyi's theorem breaks down; my framework simply records a partial order. I am not deriving Utilitarianism; I am testing the pre-condition for it."
  *   **Soft Spot:** You still need the VNM axioms to hold for the "position lotteries." If those axioms are morally contentious, you haven't escaped stipulation.

  #### 6. The Social Choice Theorist (Weak Pareto & Incompleteness)
  **Objection:** "You propose a partial ordering. What happens to Weak Pareto? If A prefers X to Y and B prefers X to Y, but your test says A and B are 'incomparable,' do you violate Pareto? A social ordering that cannot rank Pareto improvements is useless."
  *   **Damage:** **Medium.** Threatens the normative usefulness of the paper.
  *   **Reply:** "Weak Pareto holds *within* the connected components of the comparison graph. If A and B are calibrated, Pareto holds. If they are not calibrated, it is not that I violate Pareto, but that the social evaluator lacks the information to apply it. Forcing a ranking when comparability fails is a stronger violation of rationality than admitting incompleteness. I prioritize avoiding false precision over completeness."
  *   **Soft Spot:** Policy requires completeness. You are offering a tool that might paralyze policy.

  #### 7. The Philosopher (Welfare vs. Fairness)
  **Objection:** "You say you are measuring well-being, but the 'swap test' sounds like 'envy-freeness.' If I don't want to swap, I'm not envious. Have you quietly changed the subject from welfare (how good is my life?) to fairness (do I want what you have?)."
  *   **Damage:** **Medium.** Confuses the metric.
  *   **Reply:** "Envy-freeness is about resource bundles. I am asking about utility levels. I might not want to swap with you because I prefer my wife, even if your 'well-being level' is objectively higher. However, by correcting for risk curvature, I am trying to isolate the *level* of utility, not the specific bundle. That said, I concede this measures *decision utility regarding positions*, which is a specific slice of welfare, not the whole pie."
  *   **Soft Spot:** The distinction between "wanting your life" and "your life being better" is notoriously slippery (adaptive preferences).

  #### 8. The "Advisor" Objection (Circumstances vs. Preferences)
  **Objection:** "You cannot separate a person's circumstances from their preferences. If I imagine being you, do I get your preferences? If yes, I'm not comparing *my* welfare. If no, I'm imagining a counterfactual that doesn't exist (me, with my preferences, in your body). The 'swap' is ontologically incoherent."
  *   **Damage:** **Critical.** This is the theoretical kill shot.
  *   **Reply:** "I define 'circumstances' as the constraint set and the physical state, holding the utility function fixed to the evaluator. This is standard in economic policy evaluation (we ask if a policy makes people better off *given* their current preferences). I am not claiming to measure the 'view from nowhere.' I am measuring the 'social evaluator's view.' If preferences adapt to circumstances, that is a feature, not a bug—it captures how we actually value different lives from our current standpoint."
  *   **Soft Spot:** This admits you aren't measuring "true" welfare, but rather "current preference satisfaction over hypothetical states."

  ---

  ### Part 3: The Nightmare Question
  You asked about the two friends' suggestions versus your advisor's worry.

  **The Verdict:**
  1.  **Friend 1 (Envy-Freeness):** **Cheap Shot.** Dismiss in a sentence. Envy is about resources; you are about utility levels. (See Objection 7).
  2.  **Friend 2 (Harsanyi Detour):** **Real Force.** The Social Choice theorist *will* ask this. It's not a cheap shot; it's the standard critique of empirical welfare economics. You must draw the distinction between *axiomatic assumption* (Harsanyi) and *empirical test* (You).
  3.  **Advisor (Separation of Circumstance/Preference):** **The Worst One.** This is the one that keeps you from publishing in *Econometrica* or *Philosophy & Public Affairs*. It attacks the coherence of the dependent variable.

  **The Question You Hope Nobody Asks (But Will):**
  *"If Person A has adaptive preferences (e.g., the happy slave), and Person B does not, your swap test will likely say they are equally well off (A doesn't want to swap). Does your method validate oppression by treating adapted preferences as sovereign?"*

  *   **Preparation:** This combines the Philosopher and Development Economist.
  *   **Reply:** "This framework measures *preference satisfaction*, not *objective well-being*. If the literature wishes to adjust for adaptive preferences, my 'comparison graph' can accept exogenous weights. I provide the structure for comparability; I do not claim to solve the adaptive preference problem. However, because my test can *fail* (resulting in incomparability), it is less likely to falsely validate oppression than a method that forces a cardinal ranking."

  ---

  ### Part 4: Consensus vs. Contested (For Your Internal Map)
  *Use this to gauge how hard to push back.*

  | Claim | Consensus? | Notes for your Reply |
  | :--- | :--- | :--- |
  | **Utility is affine invariant within a person.** | **Yes.** | Standard VNM. Use this to justify Stage 1. |
  | **Interpersonal comparisons are impossible without axioms.** | **Contested.** | *This is your battleground.* Behavioralists/Philosophers often agree it's impossible. Social Choice theorists say it's an axiom. You claim it's empirical. **Do not claim consensus here.** Frame it as "I offer a way to bypass the axiom." |
  | **Harsanyi's theorem justifies Utilitarianism.** | **Contested.** | Many read it as a *reductio* of the axioms (Sen). **Do not claim Harsanyi proves Utilitarianism.** Claim Harsanyi *requires* comparability, and you test for it. |
  | **No-Envy is a Welfarist criterion.** | **Contested.** | Philosophers debate this. **Concede ambiguity.** Say your method is compatible with welfarism but distinct from resource-equality. |
  | **Partial orderings are acceptable in Social Choice.** | **Yes (with caveats).** | Arrow allows it, but policy hates it. **Acknowledge the policy cost** of incompleteness. |
  | **Preferences are distinct from Circumstances.** | **Contested.** | **This is your Advisor's point.** Do not treat this as settled. Explicitly state your definition (Preferences = Utility Function; Circumstances = Constraint Set) and admit it is a modeling choice. |

  ### Final Advice for the Room
  *   **The Behavioralists:** Give them the "Incentive Compatibility" concession early. They just want to know you aren't naive.
  *   **The Social Choice Theorist:** Do not try to beat them on axioms. Beat them on *empirics*. "You assume comparability; I test it."
  *   **The Philosopher:** Do not claim you have solved the metaphysical problem of other minds. Claim you have solved the *operational* problem for policy evaluation.
  *   **The Advisor:** He wants you to survive. If he asks the "Separation" question, acknowledge the depth of the problem. "That is the fundamental limitation of any welfarist approach that relies on revealed preference. I am pushing the boundary as far as choice data allows, but I agree it requires philosophical supplementation."

  Good luck. The partial ordering angle is your strongest shield; use it to deflect the "you can't compare" attacks by saying "Exactly, and here is the proof that we can't."
