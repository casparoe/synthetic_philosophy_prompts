  **Orientation: Humean Commitments**

  To assess the Settled Preference Act through a Humean lens, I extrapolate from the following commitments found in his moral psychology and philosophical essays:

  1.  **The Permissibility of Suicide:** When suicide violates no duty to God, society, or oneself, it is not a crime and should not be punished. (a) Stated explicitly in "Of Suicide."
  2.  **Reason and Passion:** Reason is and ought only to be the slave of the passions; it cannot originate action but only guide them. (a) Stated explicitly in the *Treatise*.
  3.  **Calm vs. Violent Passions:** Passions vary by intensity; calm passions are often mistaken for reason, while violent passions disrupt judgment. (a) Stated explicitly in the *Treatise*.
  4.  **The Bundle Theory:** The self is not a simple substance but a bundle of successive perceptions linked by resemblance and causation. (a) Stated explicitly in the *Treatise*.
  5.  **Utility and Sympathy:** Moral approval arises from sympathy with the utility of actions for oneself and society. (a) Stated explicitly in the *Enquiry* and *Treatise*.
  6.  **Stability of Character:** A steady, consistent character is generally more virtuous and reliable than a fluctuating one. (b) A natural extension of his views on moral evaluation.
  7.  **Legal Conventions as Fictions:** Legal identity and binding obligations are useful social fictions despite metaphysical inaccuracies. (c) Merely consistent with his view on property and promises.

  ***

  **Assessment of The Settled Preference Act**

  **One: Overall Verdict**
  Hume would likely welcome the Act as a significant improvement over the status quo of criminalization, viewing it as a triumph of liberty over superstition. He would argue that the state's primary interest is public utility, not the policing of private exit strategies that harm no one. The single feature most worth defending is Clause 1, the removal of diagnostic requirements. This aligns with his core argument that life is not a sacred trust from which one cannot resign. Conversely, he would find Clause 4, the advance arrangement, the most misguided. While he accepts social conventions, binding a future bundle of perceptions based on a past preference stretches the fiction of identity beyond its useful limit, risking a violation of the future self's current sentiments.

  **Two: Clause 1 and the Logic of "Of Suicide"**
  Clause 1 allows eligibility based on indifference rather than unbearable suffering. In "Of Suicide," Hume's rhetoric often focuses on life becoming a burden or misery. However, the logical structure of his argument rests on the absence of duty, not the presence of pain. He argues we are not God's property and that ending one's life is no different than diverting a river or stopping a blood flow—alterations of matter that are permissible unless they violate a duty to society or self. If life has become a matter of indifference, the utility of continuing it is null. There is no duty to oneself to pursue a life devoid of interest, provided one's death does not harm society (e.g., by abandoning dependents). Therefore, Clause 1 does not go beyond his arguments; it is exactly what they imply once the theological objection is removed. Hume's focus on suffering was likely rhetorical, aimed at eliciting sympathy from readers who could not conceive of leaving a life that was merely neutral. The logic of *no duty* supports indifference just as robustly as it supports relief from agony.

  **Three: Clause 3 and the Passions**
  Clause 3 treats fluctuation as conflict and flatness as settledness. Hume would accept stability as evidence of a calm passion, which he views as more reliable than violent impulses. A violent desire to die, born of sudden despair or rage, is turbulent and likely to pass; a calm, flat desire is durable and often guides the general course of life. However, Hume would harbor a specific suspicion regarding "flatness." In his psychology, a lack of agitation can indicate not just rational settledness but also melancholy—a disorder of the spirits that distorts the view of good and evil. If the "flatness" is the result of a depressed temperament rather than a genuine evaluation of utility, the calm passion is corrupted. Hume would argue that stability is necessary but not sufficient; the clinician must ensure the calmness is not merely the numbness of a mind whose capacity for sympathy and sentiment has been pathologically dampened. He would prefer a calm, reasoned resolution over a violent impulse, but he would warn against mistaking the absence of feeling for the presence of judgment.

  **Four: Clauses 2 & 4 and the Bundle Self**
  These clauses rely on the persistence of preference and the binding of future selves. Against the bundle account, Hume would argue that strict identity over nine to thirty months is a fiction. There is no "same" preference, only a chain of resembling perceptions linked by memory. However, Hume is a pragmatist. He acknowledges that while metaphysical identity is false, causal continuity is real enough for social life. The deliberation companions in Clause 2 serve to strengthen this causal link, ensuring the future decision resembles the past one through continuous reinforcement. Regarding Clause 4, Hume would not reject the question but would label the advance arrangement a useful convention, similar to a promise or property right. It is a fiction we agree to uphold for social stability. Yet, he would caution that if the future self's bundle of perceptions changes radically (e.g., a new set of passions arises), the moral obligation dissolves. The law cannot metaphysically bind a future self that no longer resembles the past self; it can only enforce a social contract that the future self may have no sentiment to uphold.

  **Five: The State's Role and Moral Sentiment**
  Would Hume think the state should be in this business? He argues suicide is no proper object of criminal punishment, but he is not an anarchist regarding regulation. He would view the apparatus of companions and waiting periods as prudent institutional design if it serves to filter out actions driven by violent passions that reduce overall utility. It is an improvement on leaving the matter to private cruelty or rash impulse. However, he would warn against this becoming a re-domestication of interference. If the process becomes so burdensome that it effectively prohibits the act for those whose calm passions dictate it, it violates liberty. Regarding moral sentiment, Hume would expect the practice to remain condemned by many due to sympathy with the survivors' grief and religious habit. He would argue this condemnation is irrelevant to legislation unless it translates to tangible public harm. The law should not codify sentiment; it should secure utility. If the Act allows for a peaceful exit without harming society, the lingering moral condemnation is a matter for private philosophy, not public statute.

  ***

  **Confidence Audit**

  **Prediction Confidence Ratings:**
  1.  **Overall Verdict:** High. (Hume's liberalism on suicide is well-documented).
  2.  **Clause 1 (Indifference):** Moderate. (Relies on extending the logic of "no duty" beyond his rhetorical focus on misery).
  3.  **Clause 3 (Passions):** High. (The calm/violent distinction is central to his psychology).
  4.  **Clauses 2 & 4 (Bundle Self):** Moderate. (Requires balancing his metaphysical skepticism with his pragmatic conventionalism).
  5.  **State Role:** High. (His distinction between vice and crime is clear).

  **Least Sure Claim:**
  I am least sure of the claim in **Section Two** that Hume's logic supports "indifference" as strongly as "burden." While the *absence of duty* logically permits it, Hume's moral theory is grounded in utility and sentiment. A life of indifference might be seen as having low utility, but ending it also produces no positive utility.

  **What Would Change My Mind:**
  Discovery of a passage in Hume's private correspondence or minor essays where he explicitly distinguishes between "escaping misery" and "abandoning neutrality," suggesting he viewed the latter as a failure of courage or social utility, would quickly overturn my assessment of Clause 1. If he viewed life as a trust of potential utility rather than just a burden to be escaped, the "indifference" clause would fail his test.
