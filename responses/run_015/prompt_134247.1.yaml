answer: |-
  **Materials & Setup**
  Divide the 20 students into three groups of 6–7. Each group is a separate market tracking one contract. You need three coins (or phones), three whiteboard sections, index cards for bids, and play money. Print a payoff table for each pair: Heads on flip 1 = 1 point, flip 2 = 2, flip 3 = 4, doubling until a hard cap of 1000 points. Give each student 50 points in play money. Prize: one chocolate bar per group for the highest final balance.

  **Rules & Payouts**
  1.  **Auction:** Before any flipping, pairs calculate a break-even price. Then, a sealed-bid auction sells one contract per group. The highest bidder pays their bid and holds the contract.
  2.  **Flipping:** The group flips their coin publicly. If Heads, the game ends, payoff is awarded, and trading stops.
  3.  **Trading:** If Tails, the contract stays live. Before the next flip, everyone writes a bid to buy; the current holder writes an ask. If a bid meets the ask, the contract trades.
  4.  **End:** When a group flips Heads, the holder collects the points. Compare final balances within groups to award chocolate.

  **Timeline**
  *   **0–10:** Distribute materials, explain payoff table and cap.
  *   **10–20:** Pair work: Calculate break-even price using the table. No "expected value" terminology allowed.
  *   **20–30:** Sealed-bid auction. Assign the "know-it-all" student as a neutral Scorekeeper for one group.
  *   **30–60:** Live flipping and re-pricing rounds. Groups will progress at different speeds.
  *   **60–75:** Debrief and payout.

  **Board Work**
  Do not write theoretical prices. For each group, track only:
  *   **Current Flip Count:** (e.g., "3 Tails observed")
  *   **Current Payoff if Heads:** (e.g., "8 points")
  *   **Last Trade Price:** (e.g., "35 points")
  *   **Cash Cap:** Remind them max cash is 50 points.

  **Debrief**
  Map the learning objectives to specific moments:
  1.  **Right Price, Wrong Outcome:** Find a student who refused a high price (e.g., 30) because the math said it was overvalued, but the contract paid out 16. Highlight that their decision was correct based on information available, even though they lost points. Value lives in the branches that didn't happen.
  2.  **Moving Price:** Compare the trade prices in the group that hit 4+ Tails. The coin didn't change, but the price jumped from 6 to 36 to 100. Ask why. They should articulate that the "bad" branches (Heads early) were eliminated, leaving only high-payoff branches.
  3.  **Terminology:** Now introduce "Expected Value." Reveal your prep numbers (6, 11, 20, 36...). Compare them to the students' trading data.

  **What Will Go Wrong**
  *   **The Early End:** There is a 50% chance a group flips Heads immediately. **Fix:** The three parallel groups ensure variance. At least one group will likely see 3+ Tails, providing the data needed for re-pricing analysis.
  *   **The Know-It-All:** A student may shout "It's worth infinite!" **Fix:** Assign them Scorekeeper. Their job is to record bids, not make them. If they speak, ask them to explain why the cap makes it finite without giving the number.
  *   **The Show-Off Bidder:** A student bids 400 to disrupt the market. **Fix:** The 50-point cash cap makes this impossible. They simply cannot bid it. If they promise IOUs, refuse. Real constraints teach real lessons.

  **The Missing Piece**
  You must state this aloud: This game cannot reproduce the true St. Petersburg Paradox because of the 1000-point cap. The original paradox relies on infinite payoff potential to break the math. Here, the cap makes the price finite and calculable. The lesson is about conditional value and risk, not actual infinity. Do not pretend the cap isn't there; use it to show why real-world prices behave differently than theoretical infinities.

  Summary: This activity uses parallel markets and cash caps to force students to experience conditional pricing and outcome variance without relying on abstract theory.
