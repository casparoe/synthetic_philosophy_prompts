answer: |-
  First off, welcome to the rabbit hole. You haven't just "cooked up an argument"; you have independently rediscovered one of the most famous critiques of Popper, often associated with Pierre Duhem, W.V. Quine, and later Imre Lakatos. Your intuition is sharp: if falsificationism is applied naively, it condemns almost all actual science.

  However, your argument doesn't necessarily destroy falsificationism; it reveals that Premise (1) is a bit too simplistic for the job you want it to do.

  Here is where I think you tripped, and how you can save your intuition about the difference between chemistry and astrology without calling your old profession pseudoscience.

  ### The Trip: Conflating "Truth" with "Testability"

  The slip happens between **(2)** and **(3)**.

  In **(2)**, you note that hard-sphere models are *literally false* (ontologically incorrect according to QM).
  In **(3)**, you infer that because they are known to be false, they cannot be *falsified* (empirically refuted).

  But Popper's criterion isn't about whether a theory is *ultimately true*; it's about whether it *sticks its neck out*.

  The hard-sphere model **is** falsifiable. If you synthesized a crystal where the steric hindrance didn't match the hard-sphere prediction, the model would be empirically refuted for that context. The fact that we have a "deeper" theory (QM) that explains *why* the hard-sphere model fails at the limit doesn't mean the hard-sphere model isn't scientific. It means it's an **approximation with a specified domain of validity.**

  Popper was aware of this. He distinguished between **falsifiability** (a logical property) and **falsification** (a methodological decision). Scientists decide to treat a model as "falsified" only when the deviation exceeds the agreed-upon margin of error for that domain.

  ### The Astrology Distinction: Ad Hoc vs. Independent

  Your real worry is in **(4)** and **(5)**: If chemists can restrict domains to save their models, why can't astrologers?

  The difference lies in *how* the boundary is drawn. Popper called this the difference between a **progressive move** and a **conventionalist stratagem** (or *ad hoc* rescue).

  1.  **The Chemist's Restriction:** When we say "hard-sphere models apply only when thermal energy is low relative to lattice energy," that boundary is **independently testable**. I can measure the thermal energy and the lattice energy *without* referencing the crystal packing success. The restriction predicts *in advance* where the model will break.
  2.  **The Astrologer's Restriction:** When an astrologer says, "The horoscope didn't work because Mercury was retrograde" or "because you have unresolved trauma," these are **ad hoc**. They are invented *after* the failure to explain it away, and they often cannot be tested independently of the failure itself.

  So, you don't have to drop the idea that science risks being wrong. You just have to refine *what* is risking error.

  ### Which Premise to Drop?

  I recommend modifying **Premise (3)**.

  **Current (3):** *So if falsifiability means "can be shown literally false," then these crystal-packing models aren't scientific.*

  **Revised (3):** *Falsifiability means "can be shown empirically inadequate within its stated domain," not "can be shown ontologically ultimate."*

  **The Cost:** The cost of this revision is that you can no longer view science as a march toward "The Truth." Instead, science becomes a march toward **increasingly precise and broad domains of empirical reliability.** The hard-sphere model is scientific not because atoms *are* spheres, but because the claim "atoms *behave as if* they are spheres under conditions X, Y, Z" is a risky claim that could be wrong.

  ### A Suggestion for Your Reading

  Since you are enjoying this, you are perfectly positioned to read **Imre Lakatos**.

  Lakatos took your exact argument and formalized it into the **Methodology of Scientific Research Programmes**. He argued that every scientific theory has:
  1.  A **Hard Core** (e.g., "Quantum mechanics is true") which is protected from falsification by agreement.
  2.  A **Protective Belt** (e.g., "Hard-sphere approximation," "Specific boundary conditions") which takes the hits.

  For Lakatos, a research programme is scientific if it is **progressive** (the adjustments to the protective belt lead to *new* predictions) rather than **degenerative** (the adjustments only explain away past failures, like astrology).

  ### Summary

  You don't need to abandon falsificationism, and you certainly don't need to call chemistry pseudoscience.

  *   **Keep (1):** Falsifiability is the demarcation.
  *   **Keep (2):** Models are approximations.
  *   **Drop (3):** Falsifiability applies to the *empirical claim within the domain*, not the ontological status of the entities.
  *   **Refine (5):** Domain restrictions count only if the boundaries are defined independently of the data they are saving.

  Your intuition holds: The chemist says, "If I heat this above 500K, this model will fail." The astrologer says, "If this fails, it's because of unseen forces." One invites refutation; the other evades it. That is the logical difference you were looking for.
