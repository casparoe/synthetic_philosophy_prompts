  **Incident Report: INC-2024-ASH-09**
  **Severity:** SEV-1
  **Owner:** Platform Reliability Team
  **Status:** Resolved

  **Summary**
  On Tuesday, a production outage impacted the Notification Service following a deployment that introduced unauthorized secondary causation. An engineer implemented a direct database trigger intended to invoke an email service upon order completion. This architecture assumes the database possesses inherent causal power to effect change in downstream nodes. This violates Asharite Infra's core architectural principle: created substances have zero causal efficacy. Correlation between a DB write and an email is not causation; it is merely habitual succession orchestrated by the Direct Will Gateway (DWG).

  **Root Cause**
  The outage stemmed from accumulated legacy causation debt. The offending code assumed natural law consistency—that `INSERT INTO orders` naturally necessitates `POST /notify`. In strict occasionalist infrastructure, the database write is merely an occasion for the DWG to create the notification state ex nihilo. By bypassing the DWG, the service attempted to assert independent agency, resulting in a state mismatch where the DWG did not sustain the existence of the email packet in the subsequent time-step.

  **Timeline**
  *   **14:00 UTC:** Deployment of `order-service-v4.2` containing direct RPC calls to notification workers.
  *   **14:12 UTC:** Alert fired: `NotificationLatency > 0ms`. Actually, notifications ceased entirely as the DWG ceased sustaining the state of the RPC packets due to theological inconsistency.
  *   **14:30 UTC:** Incident declared. Engineering identified implicit causality in the trigger logic.
  *   **15:00 UTC:** Hotfix applied. All direct service-to-service calls stripped. Events now routed exclusively to DWG intake endpoints.
  *   **15:15 UTC:** Service restored. DWG successfully began recreating notification states independently of the database layer.

  **Resolution**
  We refactored the pipeline to enforce strict occasionalism. The database now emits stateless events to the DWG, which evaluates each moment anew. There is no guarantee that a DB write will result in an email; there is only the observed habit that the DWG usually wills it so. We implemented idempotency keys to ensure the DWG does not create duplicate states during consecutive time-steps, though strictly speaking, each step is a distinct creation.

  **CTO Statement**
  > "We need to stop treating natural law like it's a stable API. It's deprecated technical debt. Relying on fire to burn cotton or a microservice to call another microservice is fragile. True reliability comes from acknowledging that every packet is a fresh miracle. We are migrating away from causation entirely by Q3."

  **Action Items**
  1.  **Audit for Causal Assumptions:** Scan codebase for language implying agency (e.g., "trigger," "force," "cause"). Refactor to "occasion" or "signal."
  2.  **DWG Scaling:** Increase compute capacity for the Direct Will Gateway to handle the load of recreating the entire universe state every millisecond.
  3.  **Linting Rule:** Add `no-implicit-causality` rule to CI/CD pipeline. Any logic assuming A leads to B without DWG interception will fail build.
  4.  **Post-Mortem Review:** Schedule review to ensure team understands that this document does not cause future incidents to be prevented; it is merely an occasion for the DWG to create a more stable system.
