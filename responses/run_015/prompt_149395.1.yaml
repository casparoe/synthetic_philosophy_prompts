      *   **Mechanism 2: Factivity as a Burden:** Explain why factivity makes KK *more* vulnerable, not less. (The "factive anchor" drifts).
      *   **The "Knowledge Thermometer" (Thresholds):** Address the gradable justification/binary truth model. Explain the "Threshold Problem." If the threshold is sharp, it's arbitrary (Sorites). If it's vague, KK fails at the boundaries.
      *   **The Regress Point:** Clarify that the regress isn't the main problem; the *iteration of safety conditions* is. $K^n p$ requires more safety than $K^{n-1} p$.
      *   **The Edge Case:** Address the binary/gradable split. Show how this actually supports the failure of KK (you can have the binary state without the introspective access).
      *   **Seminar Takeaway:** Summarize the dialectical position (Internalism vs. Externalism/Williamson).

  8.  **Refine the Tone:**
