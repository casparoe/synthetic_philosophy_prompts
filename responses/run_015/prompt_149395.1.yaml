      *   *The "Binary Truth" Edge Case:* If truth is binary, $p$ is either true or false. But $Kp$ depends on justification too. If justification is gradable, $Kp$ becomes vague. If $Kp$ is vague, $KKp$ is impossible at the boundary.

  10. **Final Polish:** Ensure the distinction between "position to know" (luminosity) and "actually knowing" (KK) is clear. (Actually, for Williamson, luminosity is defined as: if C obtains, one is in a position to know C obtains. KK is: if one knows p, one knows one knows p. They converge if knowledge is a mental state).

