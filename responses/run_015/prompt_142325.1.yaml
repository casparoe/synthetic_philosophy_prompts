answer: |-
  In 1966, a funder applying the Importance, Tractability, Neglectedness (ITN) framework to choose between the failing Malaria Eradication Programme and the proposed Intensified Smallpox Programme would face significant distortions. Here is how the scorecard breaks down ex ante.

  **Importance**
  Malaria clearly wins on annual flow. Even then, malaria killed significantly more than smallpox's two million. ITN typically aggregates annual burden (e.g., deaths averted per year). Unless the model explicitly discounts the future at nearly zero percent to value permanence, the framework systematically underrates eradication. A permanent zero looks mathematically similar to a very low annual burden after a few decades. ITN treats "ending this forever" as just another year of low numbers, failing to capture the unique value of a one-shot solution versus a perpetual management cost.

  **Tractability**
  This is where the framework biases toward status quo interventions. Malaria had DDT and drugs, but resistance was mounting and implementation was failing. Smallpox had a heat-stable vaccine, but mass vaccination campaigns were stalling. The winning strategy—surveillance and containment (ring vaccination)—was not yet standard doctrine. ITN scores tractability based on existing, proven methods. Because the specific delivery mechanism for smallpox eradication wasn't fully operationalized, ITN would score ex ante tractability as low or uncertain. It penalizes causes requiring strategic innovation, favoring those with established delivery pipelines even if those pipelines are hitting diminishing returns.

  **Neglectedness**
  Malaria had the flagship status, the staff, and the budget. Smallpox was under-resourced. ITN flags Smallpox as the higher-opportunity cause. However, the framework misreads the *reason* for neglect. Much of the push for smallpox eradication came from rich nations wanting to stop footing the bill for routine vaccination and quarantine imports. This wasn't altruistic neglect; it was a political calculation to exit a recurring cost. ITN asks "who else would have paid?" and sees a gap. It fails to distinguish between a gap caused by oversight and a gap caused by donors actively trying to disengage. It treats the funding vacuum as an opportunity rather than a signal of political fragility.

  **Missing Slots**
  The smallpox programme left behind vaccine logistics, surveillance networks, and trained field epidemiologists that later campaigns borrowed. This is option value or capacity building. ITN has no slot for this. It evaluates the cause in isolation, ignoring the infrastructure spillover that makes future health wins cheaper. A funder using ITN would treat these benefits as externalities rather than direct returns, systematically underinvesting in programmes that build systemic capacity.

  **The Verdict**
  ITN likely picks Smallpox, but primarily driven by Neglectedness and the biological certainty of the vaccine (Tractability), not because it understands the strategic pivot required. It would recommend the shift, but for the wrong reasons: it sees an underfunded cause with a working tool, not a chance to innovate a delivery strategy that turns a manageable disease into a extinct one. It would likely underestimate the risk that the new strategy might fail, because it scores the *cause* rather than the *method*.

  **Survivorship Bias**
  We hold smallpox up as a poster child because it won. Ex ante, the surveillance-containment strategy was a gamble. If smallpox had persisted despite the 1967 push, ITN would look foolish for backing a "neglected" cause with "low" tractability scores regarding implementation. The framework struggles to separate the quality of the opportunity from the quality of the execution. We are applying ITN to a success story; had the programme failed, the same framework could have been used to argue that malaria's established infrastructure was the safer bet. ITN does not inherently correct for the risk that the "obvious" neglected opportunity is neglected because it is actually impossible to solve with current resources.

  **Conclusion**
  The framework works well for comparing perpetual interventions (e.g., bednets vs. supplements). It mis-specifies eradication. It treats flow as primary, ignoring the value of stopping the flow forever. It scores tools rather than strategies, biasing against innovation. It treats funding gaps as opportunities without auditing donor motivation. And it has nowhere to put capacity building. ITN would have likely endorsed the smallpox shift, but it would have been blind to the strategic innovation required to make it work and the legacy value it would leave behind. It is a useful heuristic for allocation, but a poor map for transformation.
