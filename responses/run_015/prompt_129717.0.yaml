answer: |-
  # Activity: The Definition Protocol
  **Time:** 80 Minutes
  **Class Size:** 18 Students (4 Groups: two of 5, two of 4)
  **Goal:** Expose the gap between biological criteria, linguistic clarity, and social function in defining death.

  ## 1. Materials & Setup
  *   **Tables:** 4 clusters.
  *   **Handouts per Group:**
      *   1 "Charter Sheet" (for writing their One-Sentence Rule).
      *   1 "Audit Sheet" (for the Swap Phase).
      *   1 Deck of 14 Case Cards (printed, cut, shuffled).
      *   1 Scoring Tally Card.
  *   **Whiteboard:** Divided into 4 columns (one per group) for live scoring.
  *   **Timer:** Visible to all.

  ## 2. Timeline (Minute-by-Minute)

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00-05** | **Briefing** | Explain stakes. Distribute materials. **Rule Constraint:** No deferring to authority ("doctor decides" is illegal). |
  | **05-15** | **Drafting** | Groups write their **One-Sentence Rule**. Must be criteria-based (describe the patient, not the staff). |
  | **15-35** | **Stress Test** | Groups draw 8 cards from their deck. Sort Dead/Not Dead. **Penalty:** -1 point for every "Can't Tell." **Penalty:** -2 points for every rule amendment. |
  | **35-50** | **The Swap** | Groups pass their Rule + Tally to the table on their left. They receive a *new* Rule. They draw 2 *fresh* cards. They must apply the *new* rule blindly. |
  | **50-65** | **Function Check** | Instructor reveals the "Transplant/Inheritance" stakes for 2 specific cards. Groups calculate "Social Utility Score." |
  | **65-80** | **Debrief** | Tally final scores. Map frustrations to philosophical problems. |

  ## 3. The Rules (For Students)

  **The Constraint:**
  You are a Policy Committee. You must write **one sentence** that defines when a patient is dead.
  1.  **No Authority:** You cannot say "when a doctor says so" or "when the law says so." You must describe the *patient's state*.
  2.  **No Lists:** It must be a single grammatical sentence.
  3.  **Binary Output:** Your rule must force a "Dead" or "Not Dead" verdict. "Can't Tell" is a failure of the rule.

  **The Scoring:**
  *   **Consistency:** +1 point for every card sorted without amending the rule.
  *   **Clarity:** -2 points for every card marked "Can't Tell."
  *   **Stability:** -5 points if you change your sentence after seeing the cards.
  *   **Utility (Final Round):** +5 points if your rule allows organ harvest in the "Donor" case. +5 points if your rule prevents harvest in the "Recoverable" case.

  ## 4. The Case Deck (14 Cards)
  *Print these on cardstock. Do not label them by type.*

  1.  **Cardiac Standard:** No pulse, no breathing, pupils fixed. Cold to touch. 10 minutes since collapse.
  2.  **Ventilated Brain:** No brainstem reflexes, flat EEG. Heart beating via ventilator. Warm skin. Urine produced.
  3.  **PVS (Persistent):** Cortex destroyed. Brainstem intact. Breathing on own. Eyes open, sleep/wake cycles. No awareness.
  4.  **Locked-In:** Brainstem stroke. Cannot breathe or move. Fully conscious mind. Requires vent to live.
  5.  **The Donation Wish:** Meets brain criteria. Heart beating. Family demands organ harvest *now* to save 5 recipients.
  6.  **The Religious Objection:** Meets brain criteria. Heart beating. Family refuses to accept death until heart stops.
  7.  **Severe Dementia:** Mind gone. Memory gone. Personality gone. Brainstem functioning. Breathing and eating with assistance.
  8.  **The Execution:** Prisoner declared dead by law for inheritance purposes, but biologically sustained on life support for organ harvesting.
  9.  **Anencephalic Infant:** Born without cortex. Brainstem present. Breathing on own. Expected lifespan: 3 days.
  10. **The Freeze:** Cardiac arrest in ice water. No pulse/breath/EEG for 40 mins. Revival protocol active, 80% success rate expected.
  11. **The Harmonized Body:** Total brain destruction. AI-pump maintains circulation/oxygenation perfectly. Body heals wounds, fights infection, grows hair for 3 weeks.
  12. **The Cellular Decay:** Heart stopped. Vent removed. Body still warm. Cells metabolizing. Organs viable for transplant for next 30 mins.
  13. **The Insurance Clause:** Patient meets brain criteria. Life insurance pays out on "death." Family needs funds for funeral *today*.
  14. **The Ambulance Ride:** Patient coding in ambulance. Paramedics compressing. No pulse *during* compression. Pulse returns *between* compressions.

  ## 5. Facilitator Notes (Do's and Don'ts)

  *   **DO** enforce the "One Sentence" rule ruthlessly. If a group writes two sentences, make them combine them or lose 5 points.
  *   **DO** intervene immediately if a rule says "when a physician determines." Tell them: *"You are writing the law the physician must follow. You cannot defer to them."*
  *   **DON'T** answer medical questions (e.g., "Can a brain-dead person grow hair?"). Reply: *"The card says they do. Work with the facts on the card."*
  *   **DON'T** validate biological accuracy. This is not a medicine test; it is a logic test.
  *   **DO** keep the timer visible. Anxiety is a feature, not a bug.

  ## 6. Predictable Failure Modes & Mitigation

  **1. The "Doctor Decides" Loophole**
  *   *Prediction:* A group writes: "Death is when a qualified medical professional certifies irreversible cessation."
  *   *Fix:* This is banned in the constraints. If they slip it in, circle it and deduct 5 points immediately. Tell them: *"This kicks the can down the road. We are defining the certification criteria, not the certifier."*

  **2. The Pre-Med Takeover**
  *   *Prediction:* One student dominates with clinical knowledge ("Actually, brain death requires an apnea test...").
  *   *Fix:* Assign roles at the start: **Scribe** (writes the rule), **Reader** (reads cards), **Auditor** (checks scoring), **Spokesperson** (talks in debrief). Rotate the Scribe role if possible, or tell the Pre-Med: *"Your job is to translate your knowledge into the Scribe's sentence, not dictate it."*

  **3. The "Can't Tell" Hedge**
  *   *Prediction:* Groups write vague rules ("when life functions cease") so they can mark "Can't Tell" on hard cases to avoid penalty.
  *   *Fix:* The scoring scheme penalizes "Can't Tell" (-2 pts) more than a "wrong" binary choice (-0 pts). A wrong decision is better than no decision. Emphasize this in the briefing: *"A policy that cannot decide is a useless policy."*

  **4. The Quiet Student**
  *   *Prediction:* Two students in a group of 5 never speak.
  *   *Fix:* The **Swap Phase** requires fresh eyes. Instruct the groups that during the Swap, the *Scribe* from the original group must remain silent, and the *Auditor* must lead the application of the new rule. This forces role rotation.

  ## 7. The Debrief (Mapping Frustration to Philosophy)

  Do not ask "Who won?" Ask "Where did it break?" Write three headers on the board: **Biology**, **Language**, **Consequences**.

  **Step 1: The Swap Failure (Language)**
  *   *Ask:* "Group 2, you applied Group 1's rule. Where did you get stuck?"
  *   *Likely Answer:* "Their word 'conscious' wasn't defined," or "They said 'life functions' but didn't say which ones."
  *   *Philosophical Point:* **Verbal Disagreement.** We think we agree on "death," but our operational definitions are ambiguous. The problem isn't just the body; it's the vocabulary.

  **Step 2: The Hard Cases (Biology vs. Function)**
  *   *Ask:* "Look at Card 11 (Harmonized Body) or Card 5 (Donation Wish). Did your biology rule give you the answer you *wanted*?"
  *   *Likely Answer:* "No. The body was alive biologically, but we wanted to call it dead to harvest organs," or "The body was dead, but the family wasn't ready."
  *   *Philosophical Point:* **Functional Disagreement.** We want the definition of death to do different jobs (organ procurement vs. family closure). One biological criterion cannot satisfy conflicting social goals.

  **Step 3: The Scoring (Normative)**
  *   *Ask:* "Did anyone change their rule to get the 'Utility Points' in the final round?"
  *   *Likely Answer:* "Yes, we tweaked it so we could harvest the organs."
  *   *Philosophical Point:* **Normative Stakes.** We define death partly based on what we want to *do* with the body. The definition is not a discovery of fact; it is a decision about permission.

  **Step 4: The Final Question**
  *   Put this on the board: *"Was your disagreement today about what is true (Fact), what words mean (Language), or what we are allowed to do (Norms)?"*
  *   Let them sit with the silence. The answer is "All three, and you can't separate them."

  ## 8. What The Game Cannot Reproduce (Instructor Note)

  You must say this aloud at the very end. The game structurally cannot reproduce **Grief** and **Ontological Weight**.

  *   **Grief:** In the game, "Family Objection" (Card 6) is a scoring penalty. In reality, it is a human tragedy. The game makes them cold utilitarians; you must acknowledge that this coldness is necessary for policy but insufficient for care.
  *   **Ontological Weight:** In the game, declaring "Dead" is a point value. In reality, it is the moment a person becomes a corpse. The game simulates the *administrative* burden of death, not the *existential* burden.
  *   **Why this matters:** If they leave thinking death is *just* a policy tool, they have missed the moral horror. If they leave thinking it is *just* a biological fact, they have missed the policy necessity. The tension between the two is the course.

  ## 9. Scoring Key (For Instructor Use)

  *   **Max Possible:** ~40 points (Consistency + Utility).
  *   **Winning Condition:** There is no winner. If a group scores very high, point out in debrief: *"You likely wrote a rule so vague it let you cheat the hard cases, or so specific it ignored the social stakes."*
  *   **The "Trap":** If a group gets 100% consistency, they likely ignored the "Utility" round or gerrymandered the rule. Highlight this as a failure of *principle*, even if it's a success of *logic*.

  ## 10. Two Novel Case Cards (Specific Request)

  **Card 11: The Harmonized Body**
  > "Total brain destruction confirmed. However, an experimental AI-perfusion system maintains circulation and oxygenation without a ventilator. Over 3 weeks, the body heals surgical wounds, fights off a flu virus, and digests food. No EEG activity."
  > *(Targets: Integrationism vs. Organism. If the body integrates functions, is it alive, even without the brain?)*

  **Card 14: The Ambulance Ride**
  > "Patient coding in ambulance. Paramedics performing compressions. No pulse detectable *during* compressions. Pulse returns spontaneously for 10 seconds *between* compression cycles. Consciousness unknown."
  > *(Targets: Irreversibility. Is death a state or a process? If circulation is intermittent, is the 'cessation' permanent?)*
