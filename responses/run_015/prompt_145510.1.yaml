answer: |-
  This is a sharp philosophical distinction, and your intuition is correct: these are not the same concept, nor does one simply morph into the other if you remove the "emotional" or "spiritual" component. They operate on fundamentally different axes of responsibility.

  Here is the map of the comparison, the verdict on which one supports "national guilt" at a distance, and a name for the tension you are sensing.

  ### 1. The Map: Jaspers vs. Institutional Inheritance

  To see why they don't merge, we have to look at *where* they locate the problem.

  **Karl Jaspers (*The Question of German Guilt*, 1947)**
  Jaspers is obsessed with protecting the individual conscience from being swallowed by the collective.
  *   **Political Guilt:** This is the only category that applies to the citizenry collectively. It means all citizens are *liable* for the actions of their state. It results in reparations or loss of rights. It is external and legalistic.
  *   **Metaphysical Guilt:** This is strictly **individual**. It arises from human solidarity—the idea that I am co-responsible for every wrong committed in my presence that I did not prevent. Jaspers explicitly argues this *cannot* be adjudicated by courts or states. It is between the individual and God (or Existence).
  *   **The Limit:** Jaspers refuses to let the "Nation" be a moral agent. A nation can pay (Political), but only a person can repent (Metaphysical/Moral).

  **Institutional Inheritance Guilt (IIG)**
  This is a structural/sociological framework (akin to ideas from Iris Marion Young or modern reparations theory).
  *   **The Locus:** The **Structure**, not the soul. It argues that institutions (police, banks, land systems) have a "memory" encoded in their rules, assets, and hierarchies.
  *   **The Mechanism:** Unjust enrichment and continuity. If a state's wealth was built on slavery or colonization, and the current institutions still distribute that wealth according to those old patterns, the *state* owes a debt.
  *   **The Limit:** It does not require current citizens to feel "sinful." It requires them to acknowledge they are beneficiaries of a tainted system.

  ### 2. The "Stripping Emotion" Test

  You asked: *Does Jaspers' metaphysical guilt just become institutional inheritance guilt once you strip away the emotional part?*

  **No.** If you strip the spirituality from Jaspers' Metaphysical guilt, you don't get Institutional Inheritance; you get **Political Guilt.**

  *   **Jaspers' Metaphysical:** "I am guilty because I am human and I failed in solidarity." (Universal, Internal)
  *   **Jaspers' Political:** "I am liable because I am a citizen of this state." (Particular, External)
  *   **Institutional Inheritance:** "This institution is flawed because its foundation is unjust." (Structural, Historical)

  Jaspers' framework is about **human agency** (what did you do or fail to do?). Institutional Inheritance is about **systemic continuity** (what does this machine do, regardless of who is operating it?).

  If you try to institutionalize Jaspers' Metaphysical guilt, you create a totalitarian state that demands spiritual conformity. If you try to personalize Institutional Inheritance guilt, you create resentment in people who feel blamed for things they didn't do. They are designed to solve different problems.

  ### 3. Which Argument Supports "National Guilt" 50 Years On?

  If your feature is arguing that a **nation** (as an entity) is guilty fifty years later, **Institutional Inheritance Guilt is the only viable argument.**

  *   **Jaspers fails here:** Jaspers would argue that after 50 years, the specific *Political* liability might be settled (via treaties, reparations paid), and the *Metaphysical* guilt remains only for the individuals who were actually alive and complicit. He does not believe in trans-generational moral guilt for the nation itself.
  *   **IIG succeeds here:** IIG argues that the *state* is a corporate entity that exists across time. If the institution survives the regime, the debt survives the regime. It allows you to say "The United States" or "Germany" is guilty, without saying "Every American or German alive today is a sinner."

  ### 4. Naming the Tension

  You wrote: *"Jaspers gives you accountability without collective blame, while the other gives you collective obligations without anyone being guilty."*

  That is an excellent formulation. The philosophical name for this tension is **The Culpability-Obligation Gap.**

  *   **Jaspers** preserves **Culpability** (you must be an agent to be guilty) but limits **Obligation** (you only pay for what your state did while you were a citizen).
  *   **IIG** preserves **Obligation** (the state must fix the structure) but bypasses **Culpability** (no one currently alive needs to be morally condemned).

  This is the crux of your feature. The tension exists because we are trying to use **moral language** (guilt, sin, blame) to solve **structural problems** (systemic inequality, historical wealth gaps).

  *   **Jaspers** says: Keep moral language moral (individual) and political language political (liability).
  *   **IIG** says: Moral language is useless here; talk about **Debt** and **Design**.

  ### 5. Where Each Breaks Down

  For your feature, here is where the arguments fracture under pressure:

  **Where Jaspers Breaks Down:**
  *   **The "Deep State" Problem:** Jaspers assumes a clean break between regimes. He assumes if the Nazi state falls, the political liability is assessed and settled. He doesn't account for institutions (like policing or banking) that survive the regime change and carry the DNA of the past wrong into the new democracy. His framework cannot explain why a modern democracy is still "guilty" of past crimes if the laws have changed but the outcomes haven't.

  **Where Institutional Inheritance Breaks Down:**
  *   **The "Democratic Legitimacy" Problem:** If a nation is "guilty" via its institutions, who pays? Usually, taxpayers. If I am a citizen who immigrated yesterday, or a descendant of victims, why do I share this "institutional guilt"? IIG risks treating citizens as mere resources of the state. It creates a **Collective Obligation** that can feel indistinguishable from **Collective Punishment** to the people footing the bill, potentially fueling the backlash it seeks to cure.

  ### Summary for your Feature
  You are tracking the shift from **Post-War Moral Philosophy** (Jaspers: How do we live with ourselves after atrocity?) to **Post-Colonial Structural Theory** (IIG: How do we fix a machine built on broken parts?).

  *   Use **Jaspers** to explain why we hesitate to blame living people for dead sins.
  *   Use **Institutional Inheritance** to explain why the bill still comes due regardless.
  *   Name the tension: **The Culpability-Obligation Gap.**

  The breakthrough in your piece will be arguing that we need to stop asking "Who is to blame?" (Jaspers' worry) and start asking "What is owed?" (IIG's strength), without confusing the two.
