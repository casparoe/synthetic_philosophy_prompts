  2. Memetics asserts transmission is low-temperature sampling preserving specific parameter configurations, whereas Cultural Attraction Theory claims transmission is reconstruction toward stable modes regardless of the initial noise vector. They disagree on whether cultural stability arises from copying fidelity or from the convergence properties of the denoising dynamics themselves.
  3. Transmission biases map to guidance scales that reweight the target distribution, while guided variation becomes a biased proposal distribution that systematically shifts samples before they enter the training set. Content biases adjust the loss landscape directly, whereas context biases distort the sampler's trajectory through that landscape.
  4. Your vocabulary lacks an external fitness function (a measure of propagation success separate from the sampling process) separate from the training loop, making the fidelity threshold merely a constraint on variance before mode collapse erases rare innovations rather than a condition for cumulative complexity. Consequently, you cannot express the difference between selection for a trait (causal contribution to propagation) and mere selection of it because there is no objective function outside the generative process to validate adaptive value.
  5. The residue indicates the Darwinian question (whether selection acts on random variation) is less sharp than the literature claims because culture involves direct weight updates based on sampled performance rather than pure selection, and your synthetic-data mapping is substantive regarding drift but misses the adaptive feedback loop. This suggests your analogy captures the pathology of degradation accurately but fails to model the constructive accumulation of complexity.
