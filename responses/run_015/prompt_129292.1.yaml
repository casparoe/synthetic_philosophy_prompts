answer: |-
  Here are 5 pairs of questions (10 total) designed for your podcast. They cover the three specific constraints you requested, plus two additional lines of inquiry to round out the interview. The follow-ups are tuned to anticipate her appeal to pragmatic constraints.

  ### 1. The Arbitrariness Constraint (Required)
  **Q1:** If the right reference class is determined by the explanatory target, what stops this from collapsing into "any class works as long as I frame the target right?" Where is the brake on arbitrariness in your view?

  **Follow-up:** You'll likely say pragmatic constraints limit which targets are legitimate. But aren't those constraints just another layer of context? How do we avoid an infinite regress where we need a further context to justify the pragmatic constraints?

  ### 2. The Single-Case Problem (Required)
  **Q2:** Patients don't ask about classes; they ask, "Will *I* get cancer?" If probability is always relative to a class selected by a target, does the single-case question become meaningless on your view?

  **Follow-up:** If you reply that it's still meaningful because it guides individual belief, does that reduce probability to just a measure of subjective confidence rather than a feature of the risk itself?

  ### 3. The Meta-Problem of Target Selection (Required)
  **Q3:** To choose the explanatory target—say, mechanism versus access—don't I already need to know which factors are causally relevant? Aren't you presupposing the solution to the reference class problem just to set the target?

  **Follow-up:** If you say it's an iterative process rather than a presupposition, doesn't that make probabilistic claims unstable until the inquiry is fully complete? How do scientists publish stable results if the target is always shifting?

  ### 4. Conflicting Contexts
  **Q4:** Imagine a case where the genetic reference class suggests low risk, but the social reference class suggests high risk. If a policy maker needs a single number for insurance pricing, does your view force them to pick one arbitrarily?

  **Follow-up:** So is the solution to report multiple probabilities? If so, doesn't that undermine the action-guiding force you claim probability has, since the agent now has conflicting directives?

  ### 5. Normativity and Truth
  **Q5:** Is there ever a *wrong* reference class on your view, or just a less useful one? If a scientist picks the "wrong" target, are they making a factual error about the world or just a pragmatic mistake?

  **Follow-up:** If it's just a pragmatic mistake, does that mean philosophy of science loses its grip on tracking truth about the world? Can we have a philosophy of science that cares only about utility and not about getting the classes "right"?
