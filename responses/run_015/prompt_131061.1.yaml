      *   *Wait, re-reading the prompt:* The user suggests "shoebox of family photos to a scraped image corpus." I need to tell them if that fails.
      *   *Critique:* It risks failing because a shoebox isn't really an "archive" in the institutional sense either. It's a "collection." If the definition of archive is already loose in the shoebox, the slippage to AI is less visible.
      *   *Recommendation:* Use a *Museum/Institutional Archive* vs. *AI Dataset*. It sharpens the contrast on "preservation ethic" and "gatekeeping."

  5.  **Identify Misconceptions & Blocking Points:**
      *   *Misconception 1:* "It's just a metaphor." (Blocking: Show material consequences. If we treat it as an archive, we apply archive laws/ethics. If we don't, we don't.)
