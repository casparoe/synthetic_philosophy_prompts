      *   *Final Decision:* Introduce the *Fluid Boundary* first (the landscape), then the *Copycat Mechanism* (the movement across that landscape). Why? Because if they think boundaries are rigid, they won't see the slippage as a mechanism, just an error. They need to accept fuzziness first.
