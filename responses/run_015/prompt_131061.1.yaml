  3.  **Determine the Order of Ideas:**
      *   *Option A:* Fluid Boundaries $\rightarrow$ Copycat Mechanism. (Start with the fuzziness, then explain how the copy happens).
      *   *Option B:* Copycat Mechanism $\rightarrow$ Fluid Boundaries. (Start with the mimicry, then show how it blurs the line).
      *   *Decision:* Option B is better for design students. They understand *mimicry* and *iteration* in design. Start with the *act* of copying (the mechanism), then show how that act erodes the boundary (the consequence). It's more active.
      *   *Refinement:* Actually, for a 40-minute session, it's better to start with the *intuition* (the example), then name the *mechanism*, then analyse the *boundary*.
