      *   *Let's stick to the prompt's specific question on order:* I will advise that the **Copycat Mechanism** must come *before* the **Fluid Boundary** analysis. Why? Because you need to show *how* the label travels before you can discuss *what happens* to the meaning when it lands. It's causal.

      *   *Re-evaluating the Example:* The shoebox vs. scraped corpus.
