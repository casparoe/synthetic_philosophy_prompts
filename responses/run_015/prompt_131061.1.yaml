      *   *Check:* A "Responsibility Audit."

  9.  **Final Polish:** Check British spelling (ethic/ethics, programme, analyse, centre). Ensure the tone is supportive but rigorous. Ensure the timing adds up to 40 mins.

      *(Self-Correction on Order)*: Actually, thinking about pedagogy: If I say "Boundaries are fluid" first, they might tune out (too abstract). If I say "Look at this Copycat move" first, they engage. Then I explain "This works because boundaries are fluid."
