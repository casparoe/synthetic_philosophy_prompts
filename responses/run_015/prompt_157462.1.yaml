prompt: |-
  I sit on the funding committee of a small foundation that moves somewhere between ten and fifteen million dollars a year. We rank causes with the importance–tractability–neglectedness framework that circulates in this part of the philanthropic world: score a cause by the value of solving (or substantially reducing) the problem, multiplied by the share of the problem you can expect to eliminate per million dollars spent, multiplied by how little is already going into it. One of our programme officers has written an internal paper arguing that the framework cannot underwrite a durable funding strategy. I cannot find the mistake in it, and I also cannot accept its conclusion. Reconstructed as cleanly as I can:

  (1) Our score for a cause C is S(C) = I(C) × T(C) × N(C), where I is the value of eliminating the problem, T is expected problem-eliminated per dollar at current spending levels, and N is (inversely) the resources already devoted to C.

  (2) S(C) is not a property of C alone. Both T and N are functions of what other funders are doing, so S depends on other agents' behaviour. Call any quantity with that feature crowding-sensitive. This step is not in dispute; it is why we re-run the ranking each cycle.

  (3) A decision procedure is admissible as the basis of a standing strategy only if widespread compliance with it does not systematically destroy the conditions in virtue of which it issued its recommendation. A procedure that is self-defeating in that sense cannot guide action at scale, however well it serves whoever moves first.

  (4) ITN is self-defeating in precisely that sense. Its top-ranked cause is by construction one that few others are funding. Acting on the recommendation moves money and people into that cause; that raises the resources going to it, which lowers N, which lowers S; and if enough of us act on it, the cause stops being top-ranked. The recommendation erases the ground it stood on.

  (5) None of this turns on the details of ITN. Take any crowding-sensitive quantity, build a rule that says do more of whatever currently scores highest on it, and the same thing happens: successful compliance moves the quantity and withdraws the reason for complying. So no crowding-sensitive framework can support a standing strategy for a community of funders; it can at most give a one-off edge to whoever moves first and quietly.

  (6) But (5) is absurd, and I want to treat that as a reductio. It indicts choosing the shortest queue, arbitraging a mispriced asset, triaging an emergency room by urgency, and allocating wherever marginal return is highest. Every one of those is crowding-sensitive; every one of them is fine. A principle that condemns all of them has condemned optimizing under scarcity as such. So something in (1)–(5) has to go.

  (7) Hence we must restrict or replace the framework. The paper offers three options: treat ITN as a private heuristic valid only for actors too small to move the aggregate; drop N and rank by I × T alone; or replace N with an estimate of the total resources the cause will eventually attract, and fund only where we expect to move that total rather than join it.

  Two things about our situation that I think constrain the answer. First, we commit on a three-year cycle and some of the causes we care about are thirty-year projects, so a framework whose verdicts flip when others move is a real problem for us and not a theoretical one. Second, we cannot measure T directly for most of what we fund — no trials, no clean counterfactuals, and where we do have estimates they are contested. Neglectedness is in the framework largely because it is the best available evidence about where the cheap opportunities are, not because anyone thinks crowding is intrinsically valuable. Assume that stays true.

  There is also a worry I cannot tell whether it belongs to this argument or is a separate one. For a cause to be uncrowded may itself be evidence that better-informed funders looked at it and passed — the sidewalk-money thought. On that reading N is not a proxy for untapped opportunity but a proxy for adverse selection, and multiplying by it is not merely redundant with T but sign-flipping. Does that change the diagnosis, or is it an independent complaint that I should handle on its own?

  So: which step do you reject, and what does rejecting it cost me? Please name the step, explain why it looked innocent, and price the alternatives rather than only the one you pick — in particular, tell me what I lose if I give up (1) rather than (3) or (4), since I would rather keep (2) and (6) than (1). If you intervene at (3), give me the corrected version of the principle and say whether ITN survives it. And if the right answer is that ITN is fine at any given moment but unstable across time, tell me what a committee in our position should do with that instability. One thing I would find unhelpful: being told that ITN is only a heuristic and that heuristics are fine. I know that; it does not tell me which of the three options in (7) to adopt.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Problem:**
      *   **User:** A member of a funding committee for a small foundation ($10-15M/year). They use the Importance-Tractability-Neglectedness (ITN) framework.
      *   **Context:** A program officer has written a paper arguing ITN cannot underwrite a *durable funding strategy* because it is self-defeating (crowding-sensitive).
      *   **User's Stance:** They can't find the mistake in the argument but can't accept the conclusion (that ITN is useless for strategy). They need to know which step to reject and the costs of doing so.
      *   **Constraints:**
          *   3-year commitment cycles vs. 30-year projects (stability matters).
          *   Tractability ($T$) is hard to measure; Neglectedness ($N$) is a proxy for low-hanging fruit.
          *   "Sidewalk money" worry (Neglectedness might signal adverse selection).
          *   Specific request: Name the step to reject, explain why it looked innocent, price the alternatives, address the stability issue, and avoid vague "it's just a heuristic" dismissals.

  2.  **Deconstruct the Program Officer's Argument:**
      *   (1) Definition of $S(C) = I \times T \times N$.
      *   (2) $T$ and $N$ are crowding-sensitive (depend on others' behavior). *Accepted as true.*
      *   (3) Admissibility Principle: A strategy is invalid if widespread compliance destroys the conditions for its recommendation (self-defeating).
      *   (4) ITN is self-defeating: Funding top causes reduces $N$, lowering $S$, changing the ranking.
      *   (5) Generalization: *Any* crowding-sensitive rule is self-defeating if widely complied with.
      *   (6) Reductio: This condemns valid optimization strategies (arbitrage, triage). Therefore, (1)-(5) must contain an error.
      *   (7) Conclusion: Restrict or replace ITN (Private heuristic, drop $N$, or predict total resources).

  3.  **Evaluate the Steps for Rejection:**

      *   **Step (1):** The formula. Changing this changes the framework fundamentally. The user wants to keep the spirit of ITN.
      *   **Step (2):** The observation that $N$ depends on others. This is factually true. Hard to reject.
      *   **Step (3):** The Admissibility Principle. "A decision procedure is admissible... only if widespread compliance... does not systematically destroy the conditions..."
          *   *Critique:* This is the strongest candidate for rejection. It conflates *individual* rationality with *collective* equilibrium. It demands that a decision rule be stable under *universal* adoption, but philanthropy is not a single agent. It's a market. Arbitrage *is* self-defeating if *everyone* does it instantly, but that doesn't make arbitrage invalid for an individual actor. The principle is too strong.
      *   **Step (4):** The mechanism of self-defeat. This is logically sound based on the definition of $N$.
      *   **Step (5):** The generalization. Also logically sound based on (3).
      *   **Step (6):** The intuition pump. Correctly identifies that (5) leads to absurdity.

  4.  **Identify the Core Philosophical/Economic Error:**
      *   The argument treats the foundation as if it were the *only* funder or as if all funders move in lockstep.
      *   It confuses *marginal* utility with *average* utility.
      *   It confuses a *snapshot* optimization with a *dynamic* equilibrium.
      *   The "Self-Defeating" label is misleading. It's not self-defeating; it's *convergent*. The goal of ITN is to move resources until marginal returns equalize. Once they equalize, the signal stops. That is a feature, not a bug. It means the problem is solved (or at least the easy part is).
      *   The error is in Step (3). The principle demands *universal* stability for a *partial* agent.

  5.  **Address the "Sidewalk Money" Worry:**
      *   This is distinct from the self-defeat argument. It's about the *interpretation* of $N$.
      *   If $N$ is high (neglected), is it because it's overlooked (opportunity) or because it's a trap (adverse selection)?
      *   This requires adjusting $T$ or $I$, not necessarily discarding $N$. It suggests $N$ shouldn't be a simple multiplier but a signal to investigate *why* it's neglected.

  6.  **Develop the Recommendation:**
      *   **Reject Step (3).**
      *   **Why it looked innocent:** It sounds like a Kantian universalizability test or a game-theoretic equilibrium condition. It feels robust to demand strategies that work even if everyone does them.
      *   **The Cost:** You admit that ITN is a *market signal*, not a *law of nature*. It works for you *because* others aren't doing it. You lose the claim to moral uniqueness if everyone adopts it. You accept that your strategy has an expiration date.
      *   **Alternative (Keeping 3):** If you keep (3), you must adopt Option 3 from (7) (predict total resources). This is incredibly hard to do (requires predicting other funders). Or you drop $N$ (Option 2), which ignores the diminishing returns reality.
      *   **Handling Instability:** The committee needs to treat ITN as a *dynamic allocation rule*, not a static tag. Commit for 3 years, but review $N$ annually. Accept that "graduating" a cause is success.
      *   **Sidewalk Money:** Handle separately. It modifies how $N$ is calculated (discount neglectedness if there's a good reason for neglect), but doesn't invalidate the framework.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Professional, analytical, respectful of the foundation's sophistication.
      *   *Structure:*
          1.  Direct Answer: Reject Step (3).
          2.  Diagnosis: Why (3) is the error (Universalizability vs. Marginalism).
          3.  Pricing the Alternatives: What happens if you reject (1) or (4) instead?
          4.  Operationalizing the Fix: How to handle the 3-year cycle vs. dynamic reality.
          5.  The Sidewalk Money Worry: Distinct issue, specific fix.
      *   *Refining the Rejection of (3):* The principle demands that a strategy be robust to *universal* adoption. But philanthropy is a distributed system. The "self-defeat" is actually "success." If everyone funds the top cause, it's no longer neglected, and the framework correctly moves them elsewhere. That's not a failure of the strategy; it's the strategy working.
      *   *Refining the Operational Advice:* Don't just say "re-run the ranking." Suggest "lock-in with review clauses." If $N$ drops below threshold $X$, trigger a review.
      *   *Refining Sidewalk Money:* Distinguish between "accidental neglect" (good $N$) and "informed neglect" (bad $N$).

  8.  **Final Review against Constraints:**
      *   Did I name the step? Yes (3).
      *   Did I explain why it looked innocent? Yes (universalizability intuition).
      *   Did I price alternatives? Yes (Rejecting 1 kills ITN; Rejecting 4 is factually wrong).
      *   Did I address the 3-year/30-year tension? Yes (dynamic locking).
      *   Did I address Sidewalk Money? Yes (adverse selection filter).
      *   Did I avoid "it's just a heuristic"? Yes, focused on structural logic.

  9.  **Final Polish:** Ensure the distinction between *marginal* and *average* returns is clear, as that's the economic heart of why ITN works despite the "self-defeat." Ensure the distinction between the *logic of the framework* and the *epistemology of N* (sidewalk money) is clear.

  **(Self-Correction during drafting):** I initially thought about suggesting modifying Step (1) to use marginal $T$ instead of average $T$. But the prompt says $T$ is hard to measure. $N$ is the proxy for marginal $T$. So modifying (1) effectively means dropping $N$, which is Option 2 in (7). The user wants to know if they should do that. My argument is they shouldn't drop $N$, they should fix the *interpretation* of the strategy's stability. So sticking with rejecting (3) is the strongest path.

  Let's make sure I address the "durable funding strategy" concern. The officer says ITN can't support a *standing* strategy. My counter is: It supports a *dynamic* standing strategy. The strategy is "Always fund the current marginal maximum." That is durable. The *targets* change, not the *rule*.

  Okay, ready to write.
answer: |-
  The mistake is in **Step (3)**.

  Here is the diagnosis, the cost of fixing it, and how to handle the operational constraints you face.

  ### 1. The Diagnosis: Why Step (3) Fails

  **The Step:** *"A decision procedure is admissible as the basis of a standing strategy only if widespread compliance with it does not systematically destroy the conditions in virtue of which it issued its recommendation."*

  **Why it looked innocent:** This principle borrows its intuitive force from two respectable sources: Kantian universalizability (act only on maxims you can will to be universal law) and game-theoretic equilibrium (a strategy should be stable if everyone plays it). It feels robust to demand that a rule work even if "everyone does it." It frames the self-defeating nature of ITN as a logical flaw rather than a market feature.

  **Why it is wrong:** It conflates *individual marginal optimization* with *collective equilibrium*. Philanthropy is not a single agent; it is a distributed market. A rule that directs capital to the highest marginal return is *supposed* to eliminate the opportunity that triggered the recommendation.

  If you and every other funder instantly poured money into the top-ranked cause, $N$ would drop, $S$ would fall, and the cause would no longer be top-ranked. The officer calls this "self-defeating." In economic terms, this is **convergence**. The framework is functioning correctly. It is a signal to move resources until marginal returns equalize across causes. Once they equalize, the signal stops. That the signal disappears upon successful compliance is not a defect of the compass; it is evidence that you have arrived.

  Step (3) demands that the compass keep pointing North even after you have moved the North Pole. That is not a requirement for a valid strategy; it is a category error. A strategy can be "standing" (a permanent rule of action) without having "static" outputs (permanent target causes). The standing strategy is *"Allocate to the current maximum $S(C)$,"* not *"Allocate to Cause X forever."*

  ### 2. Pricing the Alternatives

  You asked to price the alternatives, specifically what you lose if you intervene elsewhere.

  **If you reject (1) [The Formula]:**
  *   **The Move:** You change $S(C) = I \times T \times N$.
  *   **The Cost:** You lose the ability to compare disparate causes. $I$ captures scale, $T$ captures solvability, and $N$ captures diminishing returns. If you remove $N$ (Option 2 in your officer's paper), you ignore the most reliable empirical predictor of marginal ROI. You will fund "important" problems that are already saturated, wasting money on low-marginal-return activities. If you change the multiplication to addition or another function, you lose the leverage effect that highlights "black swan" opportunities.
  *   **Verdict:** Too expensive. $N$ is your best proxy for marginal tractability.

  **If you reject (2) [Crowding-Sensitivity]:**
  *   **The Move:** You claim $T$ and $N$ are intrinsic properties of the cause.
  *   **The Cost:** You become factually wrong. Tractability *does* drop as low-hanging fruit is picked. Neglectedness *does* change as others fund. Denying this makes your model brittle and blind to market dynamics.
  *   **Verdict:** Impossible. This is empirical reality.

  **If you reject (4) [The Mechanism]:**
  *   **The Move:** You argue that funding a cause does not lower its score.
  *   **The Cost:** You deny the law of diminishing returns.
  *   **Verdict:** Impossible.

  **If you keep (3) [The Officer's Recommendation]:**
  *   **The Move:** You accept that ITN cannot be a standing strategy. You must adopt one of the remedies in (7).
  *   **The Cost:**
      *   *Option 7a (Private Heuristic):* You cede the ability to coordinate or justify your strategy publicly. It makes you a free-rider on the ecosystem's information gathering.
      *   *Option 7b (Drop N):* As above, you ignore diminishing returns.
      *   *Option 7c (Predict Total Resources):* You shift from measuring *current* opportunity to *predicting other funders' behavior*. This turns you into a macro-strategist rather than a cause-investor. It requires data you do not have (other funders' pipelines) and introduces massive variance.
  *   **Verdict:** High operational cost, high uncertainty.

  **If you reject (3) [My Recommendation]:**
  *   **The Move:** You accept that ITN is a valid standing strategy *even though* successful compliance changes the ranking.
  *   **The Cost:** You must accept **instability of targets**. You cannot tell your board, "We are the Foundation for Malaria Bednets." You must tell them, "We are the Foundation for Maximum Marginal Impact, which currently happens to be Bednets." This creates narrative friction. It makes long-term branding harder. It requires you to build "exit strategies" into your 3-year grants where the exit condition is "sufficient funding from others," not just "project complete."
  *   **Verdict:** This is the cheapest cost. It is a communications and operational burden, not a logical or strategic one.

  ### 3. Operationalizing the Instability

  You noted a real constraint: **3-year commitments vs. 30-year problems.** If the score flips in year 2, are you locked into a sub-optimal cause?

  Rejecting Step (3) allows you to treat ITN as a **dynamic control system** rather than a static map. Here is how to manage the instability without abandoning the framework:

  1.  **Lock-in with Review Clauses:** Your 3-year commitment should be structured as "1 year firm, 2 years contingent." The contingency is not just performance-based (did the grantee deliver?) but *landscape-based* (has $N$ shifted?). If the cause becomes crowded (e.g., a government picks it up, or a mega-donor enters), you trigger a review. You reserve the right to pivot or taper if the ITN score drops below a certain threshold relative to alternatives.
  2.  **Discount Rate for Volatility:** When calculating $S(C)$, apply a volatility discount to causes where $N$ is known to be unstable. If a cause is neglected only because a large government decision is pending, its $N$ is high but fragile. Prefer causes where $N$ is high due to structural barriers (hard to solve) rather than informational barriers (easy to solve once noticed). This stabilizes your pipeline.
  3.  **The "Bridge" Strategy:** Accept that for 30-year problems, you are rarely the "solver." You are the "catalyst." Your 3-year grant is designed to prove tractability ($T$) to lower the risk for larger, slower funders. If successful, $N$ drops, $S$ drops, and you leave. That is not a failure of strategy; it is the successful execution of a catalytic strategy.

  ### 4. The "Sidewalk Money" Worry

  This is a **separate complaint** from the self-defeat argument, and it targets the *epistemology* of $N$, not the *logic* of the framework.

  *   **The Argument:** High $N$ (neglect) might signal adverse selection (informed actors avoided it) rather than opportunity (informed actors haven't noticed it).
  *   **The Diagnosis:** This does not require rejecting ITN. It requires refining how you estimate $N$.
  *   **The Fix:** Decompose $N$. Do not treat "dollars spent" as the only input for Neglectedness. Treat it as **"Unexplained Neglectedness."**
      *   Before multiplying by $N$, ask: *Why is this neglected?*
      *   If the answer is "It's hard to measure," "It's unglamorous," or "It's a new idea," that is **valid $N$**.
      *   If the answer is "Experts looked and deemed it intractable," or "The theory of change is flawed," that is **adverse selection**.
      *   In the latter case, you do not discard the cause; you downgrade its $T$ (Tractability). The "sidewalk money" worry is actually a $T$ adjustment, not an $N$ rejection. If smart money isn't there, your estimate of $T$ should be lower.

  ### Summary Recommendation

  1.  **Reject Step (3).** The requirement for universal stability is inappropriate for a marginal optimization framework in a multi-agent system. The "self-defeat" is actually success (convergence).
  2.  **Keep Step (1).** Do not drop $N$. It is your best proxy for marginal returns.
  3.  **Manage the Instability.** Adopt "contingent multi-year grants" that allow you to exit if the landscape shifts significantly (i.e., if $N$ collapses). Reframe your mission from "Solving X" to "Funding the highest marginal impact at time $t$."
  4.  **Handle Sidewalk Money separately.** Treat unexplained neglect as opportunity ($N$), but explained neglect as a Tractability ($T$) penalty.

  This preserves the mathematical engine of ITN while acknowledging the market dynamics your officer correctly identified, without forcing you into the impossible task of predicting the aggregate behavior of all other funders.
