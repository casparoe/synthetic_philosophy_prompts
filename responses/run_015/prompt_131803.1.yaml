answer: |-
  **Specification of Adequacy for a Theory of Reparations for Historical Injustice**

  **To:** Interdisciplinary Reading Group
  **From:** [Your Name/Persona]
  **Subject:** Desiderata for Reparative Theory Construction

  Given the background in population ecology, the following specification treats a theory of reparations not as a moral sentiment but as a systemic model. It must define inputs (historical acts), transfer functions (obligations), and outputs (rectification) without generating logical singularities (paradoxes) or violating boundary conditions (liberal constraints).

  Below are the six core desiderata required for adequacy, followed by an analysis of their joint satisfiability and a scoring of existing frameworks.

  ---

  ### I. The Desiderata List

  #### 1. The Bifurcation Constraint (Direct vs. Structural)
  *   **Requirement:** The theory must distinguish between two distinct obligation streams:
      *   *Stream A (Direct Corrective):* Obligations owed to identifiable victims or their immediate lineal descendants for specific, discrete violations (e.g., unpaid labor, specific land theft).
      *   *Stream B (Structural Repair):* Obligations owed to present communities suffering from persistent institutional distortion (e.g., wealth gaps, political disenfranchisement) resulting from historical systems, regardless of specific lineal proof.
  *   **Motivating Consideration:** Collapsing these streams creates category errors. Stream A relies on tort-like causality which attenuates over time. Stream B relies on systemic pathology which often compounds over time. Conflating them allows critics to dismiss structural claims by attacking the fragility of lineal causality, or vice versa.
  *   **Status:** **Non-negotiable.** Without this distinction, the theory cannot handle multi-generational cases without contradiction.

  #### 2. The Attenuation Function Specification
  *   **Requirement:** The theory must explicitly define the temporal decay or growth of obligations. It cannot rely on intuition.
      *   For *Stream A (Direct)*: The theory must specify if obligations decay linearly, exponentially, or hit a threshold of extinction. (Adequate theories typically posit a statute-of-limitations style threshold).
      *   For *Stream B (Structural)*: The theory must account for **non-decreasing structural compounding**. If an injustice alters the initial conditions of a population's development (like an ecological carrying capacity), the "debt" does not decay; it accumulates interest via lost opportunity and compounded disadvantage.
  *   **Motivating Consideration:** Intuitive judgments contradict themselves across generations. Without a specified function, a theory cannot determine when a claim expires or why a 200-year-old structural distortion is more potent than a 20-year-old one.
  *   **Status:** **Non-negotiable.** A theory without a temporal function is mathematically indeterminate.

  #### 3. Non-Identity Compatibility (NIC)
  *   **Requirement:** The theory must explain how present persons hold claims for past harms without presupposing they would have existed had the harm not occurred. It must sever the claim from *existence* and anchor it in *rights violation* or *entitlement failure*.
  *   **Motivating Consideration:** The Non-Identity Problem (Parfit) suggests that if the injustice (e.g., slavery) was a condition for the conception of the claimant, the claimant cannot claim they were "harmed" in a comparative sense (existence vs. non-existence). An adequate theory must bypass this by arguing that rights can be violated even if the victim's existence depends on the violation, or by shifting the unit of analysis from the individual to the continuous group.
  *   **Status:** **Non-negotiable.** Failure here renders the theory logically incoherent regarding descendants.

  #### 4. The Robust Baseline Method
  *   **Requirement:** The theory must select a counterfactual baseline for measuring loss that does not require impossible historical reconstruction. It should utilize a **Peer-Group Parity** or **Capability Threshold** model rather than a specific GDP trajectory.
      *   *Method:* Compare the affected population's current metrics against a relevant control group (e.g., a similar demographic not subjected to the injustice) or a minimum capability threshold, rather than attempting to calculate "what would have happened" in a specific alternate timeline.
  *   **Motivating Consideration:** Reconstructing specific counterfactual histories is epistemically impossible and vulnerable to speculation. A robust baseline relies on observable divergences between comparable populations.
  *   **Status:** **Non-negotiable** for epistemic feasibility.

  #### 5. Liberal Liability Constraints
  *   **Requirement:** The theory must assign liability to present agents without violating the liberal prohibition on collective punishment. Liability must be grounded in **current benefit receipt** or **institutional membership**, not ancestral guilt.
  *   **Motivating Consideration:** Present individuals cannot be morally liable for actions they did not choose. However, they can be liable for maintaining institutions that perpetuate the harm or for retaining unearned advantages (unjust enrichment) derived from that harm.
  *   **Status:** **Non-negotiable** for compatibility with liberal democracy. (Note: Communitarian theories may mark this as a Preference, but for a general political theory, it is a constraint).

  #### 6. Ecological and Interspecies Inclusion
  *   **Requirement:** The theory must categorize ecological degradation and interspecies harm as *constitutive* harms to the community, not merely property damage. Restoration of ecosystem function must be a valid form of reparative discharge.
  *   **Motivating Consideration:** For many indigenous and agrarian communities, the "community" includes the land and non-human actors. Treating ecological extraction solely as economic loss (distributive justice) fails to capture the rupture in the relational fabric that constitutes the injustice.
  *   **Status:** **Preference** (specific to ecological/indigenous frameworks), but increasingly **Non-negotiable** for completeness in post-colonial contexts.

  ---

  ### II. Analysis of Joint Satisfiability: The Reparative Trilemma

  You asked to examine whether a subset of these desiderata generates a trilemma. Specifically, does the combination of **Strict Temporal Attenuation**, **NIP Resolution (severing lineal claims)**, and **Liberal Anti-Punishment Constraints** make structural repair impossible?

  **The Trilemma:**
  1.  **Strict Temporal Attenuation:** If obligations decay significantly over generations (to satisfy fairness to present actors), the magnitude of the debt approaches zero.
  2.  **NIP Resolution (Severing Lineage):** If we solve the Non-Identity Problem by severing lineal claims (admitting descendants wouldn't exist otherwise), Stream A (Direct Corrective) collapses for distant generations.
  3.  **Liberal Anti-Punishment:** If present individuals cannot be taxed for ancestral sins, only for current benefits/structures, the liability base shrinks to those currently holding assets.

  **The Conflict:**
  If you accept all three, **Stream A (Direct Corrective)** vanishes for historical injustices older than one or two generations. There are no specific victims left (Attenuation), the descendants have no standing (NIP), and the ancestors' estate is dissolved (Liberalism).

  However, **Stream B (Structural Repair)** remains viable *only if* we reject Strict Temporal Attenuation for structural harms.
  *   **Resolution:** The trilemma is real for *Corrective Justice* models but dissolvable for *Structural Justice* models.
  *   **Why:** Structural harm is not a debt passed down; it is a distortion persist in the present. The "attenuation" function for structural harm is not decay, but **persistence**. The obligation does not come from the past act, but from the present maintenance of the distorted structure.
  *   **Conclusion:** An adequate theory must reject Strict Temporal Attenuation for Stream B. If it applies linear decay to structural distortion, the theory fails. The trilemma proves that **Corrective Justice is insufficient for Historical Injustice**; only a Structural framework can satisfy the Liberal and NIP constraints while maintaining a non-zero obligation.

  ---

  ### III. Scoring Standard Contenders

  Here is how the major philosophical frameworks fare against the specification above.

  | Desideratum | Pure Corrective Justice (Tort Model) | Pure Structural Injustice (Political Model) | Hybrid Institutional-Repair |
  | :--- | :--- | :--- | :--- |
  | **1. Bifurcation** | **Fail.** Collapses all claims into lineal debt. | **Pass.** Focuses entirely on Stream B. | **Pass.** Explicitly distinguishes the two. |
  | **2. Attenuation** | **Fail.** Assumes linear decay or statute of limitations, ignoring compounding disadvantage. | **Pass.** Recognizes compounding structural effects. | **Pass.** Applies decay to direct, compounding to structural. |
  | **3. Non-Identity** | **Fail.** Vulnerable to the "you wouldn't exist" objection. | **Pass.** Focuses on group rights/present structure, bypassing individual existence. | **Pass.** Uses group claims for structural, limits direct claims to immediate descendants. |
  | **4. Baseline** | **Fail.** Requires impossible counterfactual reconstruction of individual wealth. | **Pass.** Uses peer-group parity or capability thresholds. | **Pass.** Uses parity for structural, specific records for direct. |
  | **5. Liberal Constraints** | **Fail.** Often implies blood liability or collective guilt. | **Pass.** Liability tied to citizenship/participation in unjust institutions. | **Pass.** Distinguishes guilt (none) from liability (institutional). |
  | **6. Ecological** | **Fail.** Treats land as property/commodity. | **Pass.** Can accommodate relational/ecological restoration. | **Pass.** Can integrate restoration as institutional repair. |
  | **Overall Score** | **Inadequate.** Logically coherent but empirically impotent for historical cases. | **Strong.** Meets most criteria but risks being too abstract for specific redress. | **Optimal.** Best fit, provided it solves the Trilemma by rejecting attenuation for structural claims. |

  ### IV. Final Specification Note

  For a theory to count as adequate, it must explicitly state that **historical injustice is not merely a past event but a present condition.**

  Therefore, the **Non-Negotiable Core** is the rejection of the "Past-Act" model in favor of the "Present-Structure" model for multi-generational claims. Any theory that treats reparations solely as payment for a past act will fail the Non-Identity and Attenuation constraints. Any theory that treats reparations solely as forward-looking distribution will fail the Direct Corrective constraint.

  The adequate theory is a **Hybrid Institutional-Repair Model** that treats Stream A (Direct) as a short-term statute-limited obligation and Stream B (Structural) as a continuous obligation of institutional redesign, where the "debt" is measured not by what was taken then, but by what is required to restore parity now. This is the only configuration that satisfies the Liberal, NIP, and Ecological constraints simultaneously without collapsing into logical contradiction.
