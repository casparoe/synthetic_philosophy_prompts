      *   *Desideratum 2: Temporal Attenuation.* Needs a function. Pure corrective justice often assumes no decay (debt remains). Structural justice might assume compounding (interest). Liberalism might want decay (fairness to present actors). I need to propose a specific functional requirement, likely distinguishing between the two tracks.
      *   *Desideratum 3: Non-Identity Problem (NIP).* If the harm caused the existence of the claimant, can they claim harm? Standard solution: Harm to interests vs. harm to existence, or shifting to group-based claims. The theory *must* solve this without denying the intuition that slavery/colonialism created obligations.
      *   *Desideratum 4: Counterfactual Baseline.* Comparing "what is" to "what would have been." Problem: Impossible to know. Solution requirement: Must use a "normal development" trajectory or a "capability threshold" rather than specific GDP projections.
