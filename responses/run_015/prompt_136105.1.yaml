  **Specification for Decision Rules Under Undefined Expectation**

  *   **Decisiveness:** The rule must yield a specific maximum willingness to pay, rejecting "undefined" verdicts. *Case:* Pasadena Game. (Non-negotiable).
  *   **Permutation Invariance:** Permuting which prize attaches to which outcome must not change value if probabilities remain fixed. *Case:* The Relabeler. (Reflex: Repair-the-expectation).
  *   **Consistency (No Pump):** Agents must not pay to swap between probabilistically identical prospects cyclically. *Case:* The Relabeler (reversible). (Non-negotiable: Dominance-first).
  *   **Linearity:** The value of a composite prospect must equal the sum of its disjoint components. *Case:* The Split Ticket. (Reflex: Repair-the-expectation).
  *   **Truncation Independence:** Valuations must converge to the same limit regardless of whether truncating by trial count or payout magnitude. *Case:* Two Ways to Cut It Off. (Reflex: Repair-the-expectation).
  *   **Frequentist Validity:** The price should reflect the limiting average return over repeated plays. *Case:* The Long Run. (Reflex: Drop-expectation-entirely; likely impossible here).

  **Conflicts and Bottlenecks**
  **Permutation Invariance** and **Linearity** are mathematically incompatible for conditionally convergent series like Pasadena (Riemann Rearrangement Theorem); you cannot preserve sum-values while ignoring term order. **Permutation Invariance** kills the most candidates, as standard expected value is inherently order-dependent here. **Frequentist Validity** is likely a prejudice: since the Pasadena average never settles, this desideratum demands impossibility, suggesting it should be dropped for one-off choices.
