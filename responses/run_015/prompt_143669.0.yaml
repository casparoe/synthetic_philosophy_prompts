answer: |-
  Your diagnosis—that the stalemate is partly a confusion between "what act to perform now" and "what agent to be"—is sharp, and it captures the phenomenological difference between the two camps. However, calling the stalemate "fake" lets the underlying metaphysical disagreement off the hook too easily. The disagreement is genuine, but it is located deeper than the timing of the decision. It is located in the **semantics of counterfactuals** and the **condition of screening off**.

  Here is the diagnosis of the genuine disagreement, followed by what actually counts as progress.

  ### 1. The Genuine Disagreement: Counterfactuals and Control
  You suggest the one-boxer answers the disposition question and the two-boxer answers the act question. This is true, but it begs the question of *why* the one-boxer thinks the disposition question is relevant to the act question.

  *   **The Two-Boxer (CDT)** operates with **interventionist counterfactuals**. When they ask, "What happens if I two-box?", they surgically alter the node "My Act" in the causal graph while holding all prior nodes (including the Prediction) fixed. For them, the prediction is in the past. It is causally screened off. To think your current act influences the box content is, to them, magical thinking.
  *   **The One-Boxer (EDT/FDT)** operates with **evidential or logical counterfactuals**. They argue that "My Act" and "The Prediction" are not causally linked in time, but they are logically or functionally linked. If the predictor works by simulation (or by reading a deterministic brain state), your current decision procedure *is* what the predictor predicted. You cannot surgically alter your act without logically altering the prediction.

  The stalemate isn't just about time-slices; it's about **control**. The two-boxer believes you only control your physical movement *now*. The one-boxer believes you control the *output of the algorithm* that determines both your movement and the prediction. Unless you resolve whether "choice" means "local muscular intervention" or "logical output selection," you will talk past each other.

  ### 2. The Biased Predictor Case: Revealing the Screening-Off Assumption
  Your tampered setup (99% accurate, but errors skewed so two-boxers often find the million) is illuminating. It forces the predictor's mechanism into the open.

  *   **Your Friend's Reaction:** She says the case for one-boxing was "smuggled in by the accuracy spec." She is correct. Standard Newcomb problems implicitly assume the prediction **does not screen off** the act. If the predictor is perfect (or near perfect) via simulation, $P(\text{Million} | \text{One-Box}) \approx 1$ and $P(\text{Million} | \text{Two-Box}) \approx 0$.
  *   **Your Reaction:** You say this shows Newcomb tests "how you describe the predictor." You are also correct. If the predictor works by reading a prior brain state that is *not* fully deterministic of the act (leaving room for a "free" deviation at the last second), then the prediction *does* screen off the act. In that specific causal graph, two-boxing dominates.

  The disagreement here is about **which causal graph represents the thought experiment**.
  *   If the graph is: `Agent Type -> Prediction` and `Agent Type -> Act`, then One-Boxing wins (the common cause structure).
  *   If the graph is: `Agent Type -> Prediction` and `Act` (independent), then Two-Boxing wins (the screening-off structure).

  Most literature assumes the first graph but argues about it using the language of the second. Your biased example breaks the symmetry and shows that the "One-Boxing Intuition" relies entirely on the logical dependency between Act and Prediction remaining unbroken.

  ### 3. What Counts as Progress?
  Since you asked for a diagnosis with reasons, here is the prescription. Progress will not come from a new formal result proving one theory "true," because both theories are internally consistent given their axioms. Progress will come from **dissolving the expectation of a unique answer**.

  You should aim for the following three clarifications:

  **A. Distinguish Ex-Ante Strategic Rationality from Ex-Post Tactical Rationality**
  Agree to answer the two questions separately, as you suggested, but formalize the distinction.
  *   **Ex-Ante:** "What decision algorithm should I instantiate?" (One-Boxing is clearly optimal here).
  *   **Ex-Post:** "Given I am already instantiated and the boxes are filled, what motion do I make?" (Two-Boxing is clearly optimal here *if* you accept interventionist counterfactuals).
  *   **Progress:** Admit that a theory can be **action-guiding** (tell you what to do now) vs. **evaluation-guiding** (tell you what you should have been). CDT is better at the former in screened-off cases; EDT/FDT is better at the latter in correlated cases. The "paradox" arises from demanding one theory do both jobs simultaneously in a scenario designed to make them conflict.

  **B. Specify the Predictor's Mechanism as a Premise, Not a Parameter**
  Stop arguing about "99% accuracy" as a scalar. Argue about the **mechanism**.
  *   If the predictor is a **Simulator**: Two-boxing is logically incoherent. You cannot two-box while the simulation one-boxes. The debate ends; you must one-box.
  *   If the predictor is a **Psychic/Brain-Scanner**: Two-boxing is live. The scan is a past fact. The debate remains.
  *   **Progress:** Agree that Newcomb's Problem is actually *two* different problems depending on the mechanism. The "Paradox" only exists if the mechanism is left vague enough to allow both interpretations. Force your friend to commit: Is the predictor predicting *you* or predicting *your type*?

  **C. Accept "Rational Regret"**
  The two-boxer often says, "I'd rather be rich than rational." The one-boxer says, "You aren't rational if you aren't rich."
  *   **Progress:** Adopt the stance that **Rationality does not guarantee Victory in all causal structures.** A two-boxer can consistently hold: "I am rational because I maximized expected utility given the causal facts available *at the moment of choice*, even though I wish I had been the kind of person who was predicted to get the million."
  *   This kills the "Why Ain'tcha Rich" argument as a knockout blow. It reclassifies it as a complaint about the universe's setup, not a flaw in the decision procedure.

  ### Summary
  Your "Act vs. Disposition" theory is the *phenomenology* of the dispute, but the *ontology* of the dispute is about **counterfactual semantics** and **causal screening**.

  Progress looks like this: You stop trying to prove the other person wrong about "Rationality." Instead, you agree that **Newcomb's Problem is a boundary case where Ex-Ante and Ex-Post rationality diverge.** You then agree that the correct move depends entirely on whether the predictor's mechanism creates a logical dependency (favoring One-Box) or merely a causal correlation that screens off (favoring Two-Box).

  If you can agree that the "Paradox" is just the friction between these two valid perspectives on agency, you can stop going round. You aren't disagreeing about the math; you're disagreeing about whether you are a *cause* or a *symptom* of the prediction. Pick a metaphysics, and the decision follows.
