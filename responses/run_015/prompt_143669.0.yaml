          3.  Accept the **Ex-Ante/Ex-Post Distinction**. You can be a Two-boxer who wishes they were a One-boxer (regret without irrationality).
      *   *Conclusion:* The progress isn't solving Newcomb, it's dissolving the expectation that one theory must win all contexts.

