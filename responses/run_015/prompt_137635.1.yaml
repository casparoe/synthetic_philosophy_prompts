prompt: |-
  hey — I'm a PhD student in moral philosophy (broadly contractualist corner, though I keep drifting) and I've ended up defending a particular version of the practice-cum-assurance story about promising, and I'd like it stress-tested before I commit another chapter to it.

  The rough view: you're bound by a promise neither because you intended to bind yourself nor because someone gets hurt if you wriggle out. You're bound because promising is a conventional normative power whose point is to let people hand each other insurance against their own future change of mind. What I keep calling the lockbox feature: a promise is supposed to keep its force after every reason you had for making it has evaporated, and even in cases where nobody was relying on you in any ordinary sense. And I want to bolt on a second, sharper claim that I think falls out of it: the stringency of a given promise tracks how much assurance the promisee actually needed — how exposed they are to your changing your mind — and *not* how solemn the framing was. So a mumbled, unwitnessed promise to do something the promisee has already reorganised their life around binds harder than a formal signed promise to do something that costs them nothing if it lapses. That's the bit I take to be a real prediction rather than a restatement.

  My supervisor says I've built something unfalsifiable: any pattern of intuitions can be soaked up by redescribing what "the practice" is, and any case where stringency fails to track exposure can be explained away by saying the practice happens to have a formality convention too. I want to know if that's fair or if it's just a cheap shot at any view with a social practice in it.

  So: what would count against this package? Along the lines of —

  - cases where the practice seems to run out: promises to beings who can't have expectations in the relevant sense (very small children, someone permanently unconscious), promises to a group whose membership has completely turned over between the promise and the performance date, and at the limit a promise to an artificial agent that can model your future behaviour but can't plan or suffer. Does my story have to say these don't bind, or can it say they bind for a different reason — and if it says the latter, what has it given up?
  - the fact that release is built into the practice: the promisee can let you off. Doesn't the easy waivability of promissory obligation sit badly with the idea that I've created a claim by exercising a power? What would the practice look like if waivability *weren't* there, and would that be evidence for or against me?
  - the shape-of-the-norm worry, which is the one I care about most: if the function of the practice is assurance, why does the practice seem to rule out promising to do something bad, rather than permitting it subject to a side-constraint that's imported from elsewhere? That looks like the norm isn't purely assurance-shaped, and I'm not sure my view can explain the shape from the function.

  Rank the defeaters from fatal to merely awkward, and — importantly — be explicit about which ones someone in my position should *concede* count against me rather than dismiss as a misdescription. I'd rather have a defeater than a defence. And tell me honestly whether the unfalsifiability charge sticks, and if it does, whether that's actually a problem for a view whose job is to explain a practice, or just the cost of doing business. Concrete cases and what they'd show, please; I don't need a map of the literature.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** PhD student in moral philosophy (contractualist leaning, but drifting).
      *   **Project:** Defending a "practice-cum-assurance" view of promising.
      *   **Core Claims:**
          1.  Promising is a conventional normative power.
          2.  Point: Insurance against future change of mind (the "lockbox feature").
          3.  Force persists even if original reasons evaporate or reliance is minimal.
          4.  *Sharper Claim:* Stringency tracks the *need for assurance* (exposure), not the *solemnity/formality*.
      *   **Supervisor's Objection:** The view is unfalsifiable (ad hoc adjustments to "the practice" or "exposure" can explain away counterexamples).
      *   **Task:** Stress-test the view. Identify defeaters (cases where the view fails). Rank them (fatal vs. awkward). Advise on what to concede. Address the unfalsifiability charge honestly.
      *   **Constraints:** No literature map. Concrete cases. Be honest/critical ("I'd rather have a defeater than a defence").

  2.  **Deconstruct the View:**
      *   *Genre:* Practice View (Rawls/Scanlon hybrid-ish?) + Assurance/Reliance (Shiffrin/Scanlon?).
      *   *Distinctive Feature:* Stringency = Exposure/Need, not Formality.
      *   *Mechanism:* Conventional power creating a "lockbox" for reasons.

  3.  **Address the Specific Worry Points:**

      *   **1. Limits of the Practice (Non-standard Promisees):**
          *   *Cases:* Small children, unconscious persons, turnover groups, AI.
          *   *Analysis:* If the point is *assurance* to the promisee, the promisee must be capable of holding an expectation/being assured.
          *   *Problem:* We intuitively think you can promise a dying person (who won't know) or a child.
          *   *View's Verdict:* If the view says "no obligation because no assurance possible," it clashes with intuition. If it says "obligation exists but for *different* reasons," it fragments the theory (promising isn't *just* assurance).
          *   *Severity:* Awkward but manageable if framed as "parasitic" obligations. Fatal if the view claims to be *the* exhaustive account.

      *   **2. Waivability (Release):**
          *   *Issue:* If I create a claim/right for you, why can you just give it back so easily?
          *   *Analysis:* In property rights, I can waive your duty not to trespass. But promissory release is *too* easy. It suggests the obligation is *for* the promisee's benefit primarily.
          *   *View's Fit:* Actually, this *helps* the Assurance View. If the point is to give *them* security, they can decide they no longer need security.
          *   *Counter:* But what if the promise was also to a third party? Or to uphold the practice itself?
          *   *Severity:* Low. This fits the assurance model well.

      *   **3. Shape of the Norm (Immoral Promises):**
          *   *Issue:* Why can't I promise to murder? The assurance view says "I'm securing your expectation." If you expect murder, why isn't that secured?
          *   *Analysis:* Practice views usually say "The practice has internal constraints." But *why*? If the function is purely assurance, immoral promises should be valid but overridden. But we think they are *void*.
          *   *Severity:* High. This is the "Normativity Gap." If the practice is conventional, where does the moral constraint come from? If it's external, the practice isn't doing all the work.

      *   **4. The Supervisor's Charge (Unfalsifiability):**
          *   *Issue:* "Stringency tracks exposure" is hard to measure independently of intuition.
          *   *Analysis:* If every time intuition diverges from "exposure," you redefine "exposure," it's circular.
          *   *Test:* Can we measure exposure *without* asking "how bound do you feel?"
          *   *Severity:* Medium/High. It's a methodological risk.

  4.  **Develop Concrete Defeaters (The "Stress Test"):**

      *   *Defeater A: The "Useless Assurance" Case.* I promise to meet you for coffee. You don't care at all (zero exposure). I break it. Intuition: Still a bit wrong (breach of promise), but your view says low stringency. *Refinement:* What if I promise to water your plants while you're away, but you have a backup system you forgot to mention? Exposure is low. Is the promise void?
      *   *Defeater B: The "High Exposure, No Promise" Case.* You rely heavily on me without a promise. I let you down. Intuition: Bad, but not *promise-breaking*. Your view needs to distinguish why the *conventional act* matters if the *harm* is the same. (This is the standard Scanlon objection).
      *   *Defeater C: The "Solemnity Intuition" Case.* Wedding vows vs. casual "I'll be there." Intuition says vows are stricter. Your view says only exposure matters. If exposure is equal, but intuition differs, your view fails.
      *   *Defeater D: The "Post-Mortem" Promise.* Promise to a dead person. No assurance possible (they can't expect). Intuition: Still binding. View: Not binding (or different reason). This fragments the theory.

  5.  **Ranking and Concessions:**

      *   *Fatal:* The "Immoral Promise" shape problem (if not handled carefully) and the "Solemnity vs. Exposure" empirical claim. If people *actually* judge solemnity as increasing stringency independent of exposure, the core prediction is false.
      *   *Awkward:* Non-standard promisees (can be handled by saying the practice *extends* by analogy). Waivability (actually supports the view).
      *   *Unfalsifiability:* It sticks if "exposure" is defined post-hoc. Needs an independent metric.

  6.  **Drafting the Response:**

      *   *Tone:* Professional, peer-to-peer, rigorous, direct. No fluff.
      *   *Structure:*
          1.  Assessment of the Unfalsifiability Charge.
          2.  Ranking the Defeaters (Fatal -> Awkward).
          3.  Specific Concessions Advice.
          4.  The "Shape of the Norm" deep dive.
      *   *Key Insight:* The strongest threat is the empirical claim about solemnity vs. exposure. If that's wrong, the "sharp claim" dies. The second strongest is the "voidness" of immoral promises.

  7.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction on Waivability:* Wait, if the obligation is to *uphold the practice* (Rawls), waiving is hard. If it's purely *assurance to the individual* (Scanlon/Shiffrin), waiving is easy. The user's view is the latter. So waivability is a *strength*, not a weakness. I need to make sure I don't mischaracterize that.
      *   *Correction on Unfalsifiability:* The supervisor is half-right. To avoid it, the student needs an independent measure of "exposure." I should suggest what that looks like (e.g., cost of backup plans).
      *   *Correction on Immoral Promises:* The user asks why the practice *rules them out* rather than permitting them subject to constraint. This is the "Internal vs. External" constraint problem. If the practice is conventional, why does morality police the *content* of the convention?

  8.  **Final Polish:** Check against the prompt's specific requests (Rank defeaters, explicit concessions, unfalsifiability verdict, concrete cases). Ensure the tone respects the PhD level. (Avoid explaining basic contractualism).

      *(Self-Correction on the "Lockbox" feature)*: The user says force persists even if reasons evaporate. This is standard. The new bit is Stringency = Exposure. I need to focus heavily on testing *that* specific prediction.

      *Case to construct:* The "High Formality/Low Exposure" vs. "Low Formality/High Exposure" clash.
      *   Case 1: Signed contract to buy a pen (low exposure).
      *   Case 2: Mumbled promise to pick up a child (high exposure).
      *   User's prediction: Case 2 is stricter.
      *   Counter-intuition: Some people feel the signed contract creates a *different kind* of obligation (legal/conventional) that feels "heavier" in a specific way, even if moral harm is lower. Or, consider a vow of silence (high formality, low exposure for others).
      *   Actually, the better test is: Equal Exposure, Different Formality.
      *   Case: I tell you "I'll be there" (casual) vs. "I swear on my mother's grave I'll be there" (solemn). Exposure is identical (you need a ride either way).
      *   Intuition: The solemn one is harder to break.
      *   User's View: Stringency should be equal.
      *   *This is the killer.*

  9.  **Finalizing the Plan:**
      *   Start with the Unfalsifiability verdict (It sticks, but is fixable).
      *   Rank 1 (Fatal): The Solemnity Intuition (Equal Exposure, Different Form).
      *   Rank 2 (Fatal/Severe): The Immoral Promise (Shape of Norm).
      *   Rank 3 (Awkward): Non-standard Promisees (can be conceded).
      *   Rank 4 (Non-Issue): Waivability (actually supports the view).
      *   Advice on Concessions.

  10. **Writing the Response.** (Proceed to generate output based on this thought process).
answer: |-
  This is a sharp setup. You've isolated a specific, predictive claim (stringency tracks exposure, not formality) within a broader practice view. That makes you more vulnerable than a generic practice theorist, but it also gives you a clearer target for falsification.

  Here is the stress test, ranked from fatal to manageable, followed by a verdict on the unfalsifiability charge.

  ### 1. The Unfalsifiability Charge: Does it stick?
  **Verdict:** It sticks, but it's not necessarily fatal. It is a methodological warning, not a refutation.

  Your supervisor is right that "exposure" is a slippery variable if defined post-hoc. If you ask, "How bound am I?" and answer, "Very," and then infer, "Therefore, exposure must have been high," you have circularized the explanation.

  **How to fix it:** You need an independent metric for "exposure" that does not rely on promissory intuition.
  *   **The Metric:** Cost of contingency planning.
  *   **The Test:** In Case A (Formal Promise) and Case B (Casual Promise), measure the objective cost to the promisee of securing a backup plan. If the costs are identical, but the intuitive stringency differs, your view is falsified.
  *   **The Risk:** If you find that people intuitively treat solemn promises as stricter *even when backup costs are identical*, your core prediction is empirically false. You cannot save this by saying "well, maybe they felt more exposed." You have to measure the exposure externally (e.g., "Would a reasonable person in this position have sought an alternative?").

  ### 2. The Defeaters (Ranked)

  #### **Rank 1: The "Equal Exposure, Different Solemnity" Case (Fatal)**
  This is the direct test of your sharper claim.
  *   **The Case:** I need a ride to the airport. It is crucial (high exposure).
      *   *Scenario A:* You say, "Don't worry, I'll take you." (Casual)
      *   *Scenario B:* You say, "I swear on my life, I will take you." (Solemn)
  *   **The Exposure:** Identical. My need for the ride and the cost of a backup taxi are the same in both.
  *   **The Intuition:** Most people judge Scenario B as significantly harder to break. The solemnity *adds* normative weight independent of the assurance need.
  *   **Why it's fatal:** Your view predicts equal stringency. If the intuition holds, your claim that stringency tracks *only* exposure is false.
  *   **Concession:** You must concede that formality *can* act as a multiplier on stringency, or that the "practice" includes a convention that solemnity signals a higher tier of commitment *beyond* the baseline assurance. If you concede this, your "sharp claim" becomes a "default claim" (exposure is the baseline, formality modulates it). This weakens the theoretical elegance but saves the view.

  #### **Rank 2: The "Immoral Promise" Shape Problem (Severe)**
  You identified this, but the specific threat is sharper than you think.
  *   **The Case:** I promise to help you hide a body.
  *   **The Assurance:** You are highly exposed. You have reorganised your life around my assistance. The "lockbox" is engaged.
  *   **The View's Output:** On a pure assurance view, this should generate a pro tanto obligation that is simply overridden by the moral prohibition against hiding bodies.
  *   **The Intuition:** The promise is *void*. It generates no obligation whatsoever. I don't owe you an apology for breaking a promise to help commit murder; I owe it to you to break it.
  *   **Why it's severe:** If the function of the practice is *just* assurance, the content shouldn't matter for the *existence* of the obligation, only for its permissibility. The fact that the practice itself seems to have an internal "validity condition" regarding moral content suggests the norm isn't purely assurance-shaped. It suggests the practice is *parasitic on prior morality*.
  *   **Concession:** You must concede that the practice of promising is not a free-standing normative engine. It is a power we exercise *within* a moral framework that vetoes certain uses. You cannot derive the "voidness" from the assurance function alone. You have to import a side-constraint. This doesn't kill the view, but it stops it from being a *foundational* account of promissory obligation. It becomes a *structural* account within a broader morality.

  #### **Rank 3: The "Dead Promisee" / "Incapacitated Promisee" (Awkward)**
  *   **The Case:** You promise your dying friend to look after their cat. They die five minutes later.
  *   **The Exposure:** Zero. They can no longer form expectations, plan, or suffer disappointment.
  *   **The Intuition:** You are still bound.
  *   **The View's Output:** No assurance is possible, so no obligation (or a different kind).
  *   **Why it's only awkward:** You can handle this by distinguishing between the *genesis* of the obligation and its *persistence*. The obligation was created when the assurance was possible (while they were alive). The "lockbox" feature explains why it persists after their death (and after their reasons evaporate).
  *   **Concession:** Concede that the *creation* of the obligation requires a capable promisee, but the *persistence* does not. This fits your "lockbox" claim perfectly. This is not a defeater; it's a clarification.

  #### **Rank 4: Waivability (Non-Issue / Actually a Strength)**
  *   **The Worry:** If I create a claim, why can you waive it so easily?
  *   **Analysis:** This actually supports your view over a "will theory" or "pure practice" view. If the point of the practice is to give *you* security, then *you* are the best judge of when you no longer need security.
  *   **The Limit:** The only tension is third-party reliance (e.g., I promise to drive you to the airport, and you tell your boss you'll be there). If you release me, your boss is screwed.
  *   **Concession:** Concede that waivability is constrained by third-party reliance. This aligns with the "exposure" metric (the boss is now exposed). This is consistent with your view.

  ### 3. Specific Advice on What to Concede

  Do not fight the "Immoral Promise" bullet. It is the quickest way to look like you are ignoring the embeddedness of conventions in morality.
  *   **Say this:** "The practice of promising is a normative power, but like all powers, it is subject to the background conditions of moral validity. The assurance view explains the *binding force* of valid promises, not the *validity conditions* of the act itself."
  *   **Why:** This isolates your theory to what it does best (explaining the *persistence* and *stringency* of valid obligations) and outsources the "voidness" problem to general morality.

  Do fight the "Solemnity" bullet, but be ready to retreat.
  *   **Strategy:** Argue that solemnity *is* a signal of exposure. When someone swears on their life, they are communicating, "I know you need extra assurance here."
  *   **Retreat:** If pressed on the "Equal Exposure" case (the airport ride), concede that social conventions can layer *additional* normative weight onto the baseline assurance. Admit that "practice" includes conventions about signaling. This blunts the "sharp claim" but saves the core mechanism.

  ### 4. The Unfalsifiability Verdict

  Your supervisor is half-right. The view is *currently* vulnerable to the charge because "exposure" is too theoretical.

  **To make it falsifiable:**
  You need to commit to the claim that **objective reliance costs** determine stringency, not **subjective feelings of security**.
  *   **Prediction:** In a court of public opinion (or experimental philosophy survey), if Case A has high objective reliance costs (hard to get a backup) and low formality, and Case B has low objective reliance costs (easy backup) and high formality, people will judge Case A as the *greater moral wrong* to breach.
  *   **If this prediction fails:** If people consistently say breaking the Formal/Low-Reliance promise is worse than the Casual/High-Reliance promise, your view is empirically inadequate.

  **Is unfalsifiability a problem here?**
  Yes. A practice view that explains everything explains nothing. If every counter-intuition is met with "that's just a different feature of the practice," you aren't testing the theory; you're defining terms to match intuitions.
  *   **The Cost of Business:** It is acceptable to say "The practice has multiple features." It is *not* acceptable to say "The practice has whatever feature is required to match this specific intuition."
  *   **The Fix:** Pre-commit to the "Exposure > Formality" hierarchy. If you find a robust intuition where Formality > Exposure, you must call that a counter-example and explain it away using *independent* principles (e.g., "people are confused about the source of obligation"), not by redefining exposure.

  ### Summary of Moves
  1.  **Concede** that immoral promises are void due to external moral constraints, not internal assurance logic.
  2.  **Concede** that waivability is limited by third-party exposure.
  3.  **Defend** the "Dead Promisee" case as a feature of the lockbox (persistence), not a bug.
  4.  **Operationalize** "exposure" as "cost of contingency planning" to answer the unfalsifiability charge.
  5.  **Prepare to die on the hill** that High Exposure/Low Formality is stricter than Low Exposure/High Formality. If your data doesn't support this, the "sharp claim" must be downgraded to a "primary factor."

  If you make these moves, you move from a "just-so story" about practices to a robust, testable normative hypothesis. That's chapter-worthy.
