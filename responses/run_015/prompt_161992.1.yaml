prompt: |-
  I'm giving a work-in-progress talk in three weeks on money pumps, and I know this room well enough to be nervous. Can you build me a Q&A prep sheet for the question period.

  The thesis I'm defending: money-pump arguments are used to show that cyclic preferences are irrational — you prefer A to B, B to C, and C to A, someone charges you a penny at each step, you end up back with A and three pennies poorer, so something is wrong with *you*. I want to argue the argument can't deliver that verdict on its own. What it establishes is a claim about policies across time, which means the explanatory direction everyone assumes is backwards: diachronic rationality is the basic notion, and the synchronic coherence axioms are what you get when you add the assumption that the agent can't bind herself.

  Sketch of how I get there, so you know what to aim at:

  1. Split the pumps in two. In an *open* pump you end up with something you prefer at the time you end up with it; calling you worse off requires a premise about the sequence as a whole. In a *closed* (loop) pump you end where you started minus the money — the only kind that gives you a "worse off by your own lights" verdict without extra help. So most of the scary examples in circulation aren't doing the work people think they are.
  2. Even the closed pump needs two premises nobody states. (i) It needs you to keep trading rather than notice the loop coming and just refuse the first trade. Call the ones who refuse *loop-closing* agents: the pump only bites the myopic. (ii) The strong version — you get drained of everything — needs you to move for arbitrarily small amounts, or for nothing at all. If you'll only move for a penny, the exploiter's take is bounded by her own stake. So the punch of the example depends on an unstated assumption about how fine-grained your willingness-to-trade is.
  3. Conclusion: exploitability is a property of an agent-in-an-environment, not of a preference ordering. The irrationality verdict has to come from somewhere else, and the somewhere else is a claim about which policies you could have adopted ex ante.

  The audience, precisely: Friday WIP, department heavy on formal epistemology and social choice. Most of the room thinks of rationality as coherence among representational states — credences, utilities, preference orderings — and is allergic to anything that smells like a substantive claim about what you have reason to want; they'll read my positive view as smuggling in a normative notion of planning. Two people work on akrasia and weakness of will and will be on my side too fast and for the wrong reasons (they'll want to use it for something about resolve, and I don't want the talk hijacked by that). There's a small group that does sequential and dynamic choice and thinks in terms of policies and working backwards from the last node; they're the dangerous ones, because they'll think the conclusion is old news and say so. A senior person in the corner is a Humean about practical reason — reasons come from desires plus means-ends — and she'll say the whole "policy" framing is normative glue she doesn't have any use for. And there are three grad students who last term watched someone use "you'd be money pumped" as a knockdown and have never seen it resisted.

  What I want: the objections I'll actually get, ordered by how likely they are times how much damage they'd do, each phrased the way that particular person or subgroup would phrase it (I want to hear the social choice person's version, not a generic version). For each, a reply I can give in about two minutes, and a note on where the reply is soft. Then: what I should concede in the first two minutes so the room doesn't spend the whole Q&A on it; the single reply that has to land for the thesis to survive; and the question I'm hoping nobody asks. Mine is something like "if the loop-closing agent can just refuse the first trade, doesn't your view entail that the person who can't bind herself to quit smoking isn't irrational, just unlucky about her environment?" — but if you see a worse one, use that instead.

  One constraint: I can't lean on citations. The room will ask "who says that?" and I'd rather answer the objection than the footnote, so no reply should depend on pointing at a paper or a name.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the Request:**
      *   **Topic:** Money Pump Arguments (specifically, challenging the standard interpretation that they prove synchronic cyclic preferences are irrational).
      *   **Thesis:** Money pumps show a problem with *policies across time* (diachronic rationality), not just preference orderings (synchronic coherence). Synchronic axioms are derived from diachronic rationality + inability to bind.
      *   **Key Arguments:**
          1.  Open vs. Closed pumps (only closed pumps show "worse off by own lights").
          2.  Hidden premises: Myopia (failure to see the loop) and Fine-grained willingness to trade (arbitrarily small amounts).
          3.  Conclusion: Exploitability is agent-in-environment, not just preference ordering. Irrationality comes from ex ante policy adoption.
      *   **Audience:** Formal epistemology/social choice heavy.
          *   *Majority:* Rationality = coherence among representational states (allergic to substantive norms/planning).
          *   *Akrasia/Weakness of Will (2 people):* Will support too enthusiastically for wrong reasons (resolve).
          *   *Sequential/Dynamic Choice Group:* Think this is old news (danger: dismissal).
          *   *Senior Humean:* Rejects "policy" framing as normative glue.
          *   *Grad Students (3):* Naive believers in money pumps as knockdown arguments.
      *   **Constraints:** No citations (avoid "who says that?"). Replies must be ~2 minutes.
      *   **Deliverables:**
          1.  Objections (ordered by likelihood $\times$ damage), phrased by subgroup.
          2.  Replies (2 mins, no citations).
          3.  Soft spots in replies.
          4.  Early concessions (first 2 mins of Q&A).
          5.  The "Must-Land" reply.
          6.  The "Dreaded Question" (worst-case scenario).

  2.  **Deconstruct the Thesis & Anticipate Objections:**
      *   *Thesis Core:* Cyclic preferences aren't inherently irrational; it's the *policy* of accepting trades that's the issue.
      *   *Vulnerability 1 (Dynamic Choice Group):* "This is just McClennen or Bratman. You're reinventing the wheel." (Damage: High, makes talk seem redundant).
      *   *Vulnerability 2 (Formal/Social Choice):* "You're changing the definition of rationality. Rationality *is* coherence. If you add 'policies,' you're talking about prudence, not rationality." (Damage: High, undermines conceptual framework).
      *   *Vulnerability 3 (Humean):* "Where does the normativity of the policy come from? If I desire A>B>C>A, and I get pumped, I'm satisfying my desires. Why is the policy irrational?" (Damage: Medium-High, attacks the foundation).
      *   *Vulnerability 4 (Grad Students/General):* "But if I have cyclic preferences, I *will* get pumped. Isn't that enough to call it irrational?" (Damage: Medium, misses the nuance but persistent).
      *   *Vulnerability 5 (Akrasia People):* "So this is about willpower? If I just had more resolve, I wouldn't get pumped?" (Damage: Low-Medium, hijacks the talk).

  3.  **Drafting the Objections & Replies (Iterative Process):**

      *   *Objection 1 (Dynamic Choice Group):* "Isn't this just dynamic consistency?"
          *   *Reply:* Distinguish between *requiring* dynamic consistency vs. explaining *why* synchronic coherence matters. I'm arguing synchronic coherence is a *shadow* of diachronic policy, not the foundation.
          *   *Soft Spot:* Might sound like semantic quibbling.

      *   *Objection 2 (Formal Epistemologists):* "You're smuggling in a substantive norm."
          *   *Reply:* Deny it's substantive in the "what to want" sense. It's structural about *temporal extension*. Rationality isn't a snapshot; it's a trajectory.
          *   *Soft Spot:* Humean will pounce on "trajectory" implying a norm.

      *   *Objection 3 (Humean):* "Why is the ex-ante policy binding?"
          *   *Reply:* It's not binding magically. It's that the *agent* at t1 judges the sequence as bad. If the agent doesn't care about the sequence, they aren't pumped (they stop trading).
          *   *Soft Spot:* Risks circularity (why should they care?).

      *   *Objection 4 (Grad Students):* "But the math shows you lose money."
          *   *Reply:* The math shows you lose money *given* the myopia assumption. Remove myopia, remove the loss. The math doesn't prove the preference is bad, only the *strategy* is bad.
          *   *Soft Spot:* They might insist cyclic preferences *cause* the bad strategy.

      *   *Objection 5 (Akrasia People):* "Is this about weakness of will?"
          *   *Reply:* No, it's about foresight. Weakness implies knowing the better policy and failing. My point is the preference ordering doesn't *dictate* the failure.
          *   *Soft Spot:* Hard to draw the line sharply.

  4.  **Refining the "Dreaded Question":**
      *   User suggested: "If the loop-closing agent can just refuse... isn't the smoker just unlucky?"
      *   *Analysis:* This is good. It attacks the distinction between irrationality and bad environment. If rationality is just "having a good policy," and some people *can't* form policies (addiction/compulsion), does your view exculpate them too much?
      *   *Worse Version:* "If synchronic coherence is just a derivative of diachronic policy, does a being that exists only for an instant have no rationality constraints?" (This attacks the core metaphysical claim).
      *   *Decision:* The user's smoking example is more concrete and dangerous for the "policy" view. I'll refine that one to be sharper. Let's make it about *constitutive* limitations. "If I physically cannot bind myself, am I rationally required to do the impossible?"

  5.  **Selecting Early Concessions:**
      *   Need to disarm the "Old News" crowd. Admit dynamic choice literature exists but frame the contribution as *foundational* (what explains what).
      *   Need to disarm the "Definition" crowd. Admit this shifts the focal point of rationality.

  6.  **Selecting the "Must-Land" Reply:**
      *   The distinction between Open and Closed pumps. If this fails, the whole "worse off by own lights" argument collapses.

  7.  **Final Review against Constraints:**
      *   No citations? Check.
      *   2-minute replies? Check (keep them tight).
      *   Audience specific phrasing? Check.

  8.  **Drafting the Content (incorporating the "Voice"):**
      *   Tone: Professional, prepared, slightly defensive but confident.
      *   Structure: Follow the user's requested layout.

      *(Self-Correction during drafting)*: Make sure the "Dynamic Choice" objection doesn't sound like I'm dismissing them. I need to acknowledge their framework while claiming a deeper philosophical point.
      *(Self-Correction on Humean)*: The Humean objection is tricky without citations (like Smith or Velleman). I need to handle it purely on argumentative grounds. Focus on *instrumental* rationality failing if the sequence is not considered.

      *(Refining the Dreaded Question)*: The user's smoking example is strong. Let's make it the "Constitutive Limitation" objection. If I *cannot* bind, is the policy requirement unfair?

      *(Refining the "Must Land")*: It has to be the Open/Closed distinction. If closed pumps are the only real threat, and they require myopia, then the standard argument fails.

      *(Refining Concessions)*: Concede that cyclic preferences are *correlated* with exploitability, just not *constitutive* of it.

  9.  **Final Polish:** Check timing and tone. Ensure the "Soft Spot" warnings are honest. (e.g., admitting where the argument relies on intuition).

      *Wait, one more check on the "Dynamic Choice" group.* They are dangerous because they might say "We already model this with resolute choice." I need to make sure my reply distinguishes my *philosophical claim* (explanatory direction) from their *modeling claim*.

      *Okay, ready to write.*
answer: |-
  # Q&A Prep Sheet: Money Pumps & Diachronic Rationality

  **Talk Context:** WIP, 3 weeks out.
  **Audience:** Formal Epi/Social Choice (Coherence-focused), Dynamic Choice (Policy-focused), Humean (Senior), Akrasia (2), Grads (3).
  **Constraint:** No citations.

  ---

  ## 1. Early Concessions (First 2 Minutes of Q&A)
  *Goal: Disarm the "Old News" crowd and lower the temperature on the "Definition" fight.*

  *   **To the Dynamic Choice Group:** "I am not claiming that sequential choice problems haven't been modeled before. I know the literature on resolute choice and dynamic consistency. My claim isn't that the *math* is new, but that the *explanatory direction* is backwards. We treat synchronic coherence as the axiom and diachronic consistency as the theorem. I'm arguing the reverse."
  *   **To the Coherence Crowd:** "I am conceding that cyclic preferences are *dangerous*. I am not arguing they are safe. I am arguing that the danger comes from the interaction with time and foresight, not from the ordering itself. If you strip out the temporal extension, the 'irrationality' verdict loses its grip."

  ---

  ## 2. High-Priority Objections (Ordered by Likelihood $\times$ Damage)

  ### Objection 1: The "Old News" Dismissal
  **Who:** The Sequential/Dynamic Choice Group.
  **Phrasing:** "This looks like a philosophical restatement of standard dynamic inconsistency. If an agent violates dynamic consistency, they get pumped. We already model this by imposing consistency constraints on policies. What work is your 'explanatory direction' claim doing that a standard decision tree doesn't?"
  **The Reply (2 mins):**
  "A decision tree takes the nodes as given. It assumes the agent *can* choose at each node. My point is about what makes the preference ordering look irrational in the first place. The standard view says: 'Your preferences are bad, therefore you get pumped.' I'm saying: 'You get pumped because you lack a policy, and we call the preferences bad *because* they make policy formation hard.'
  If I'm right, synchronic coherence isn't a fundamental requirement of rationality; it's a heuristic for 'this agent will struggle to form a stable plan.' That changes how we diagnose the error. It's not a static inconsistency; it's a planning failure. The tree shows the *consequence*, but it doesn't tell us whether the fault lies in the preferences or the inability to commit."
  **Soft Spot:** They may press that "planning failure" just *is* irrationality, making the distinction verbal. Be ready to insist that locating the fault in *time* rather than *logic* changes the normative remedy (training vs. correction).

  ### Objection 2: The "Substantive Norm" Attack
  **Who:** The Formal Epistemology Majority.
  **Phrasing:** "You're smuggling in a substantive norm about planning. Coherence is formal; it doesn't tell you what to want. By saying you need a 'policy across time,' you're saying rational agents must care about their future selves in a specific way. That's not rationality; that's prudence."
  **The Reply (2 mins):**
  "I'm not saying you must care about your future self. I'm saying that if you *don't*, the money pump doesn't bite. The pump only works if you care enough about the outcome to trade, but not enough to see the loop.
  Rationality is about means-ends efficiency. If your 'end' is just the immediate transaction, you aren't pumped. If your 'end' is the final state, you are. The 'policy' isn't a new value; it's just the recognition that you are a temporally extended agent. If you ignore the temporal extension, you aren't incoherent, you're just myopic. But if you claim to be maximizing utility over time, *then* the policy constraint is internal to your own goal."
  **Soft Spot:** The Humean will pounce on "if you claim to be maximizing." If the agent doesn't claim that, your norm loses grip.

  ### Objection 3: The Humean Challenge
  **Who:** The Senior Humean.
  **Phrasing:** "Reasons come from desires. If I desire A over B, B over C, and C over A, and I trade my way around the loop, I am satisfying my desires at every step. Why is the 'ex ante policy' binding? Where does the normativity of that policy come from if not from a desire to have coherent preferences?"
  **The Reply (2 mins):**
  "The normativity comes from the agent's own judgment at $t_1$. At the start, before the trading begins, the agent prefers 'Keep A' to 'A minus 3 pennies.' That's a desire. The money pump shows that acting on local desires at $t_2, t_3, t_4$ frustrates the desire held at $t_1$.
  I'm not imposing an external norm. I'm pointing out a conflict between the agent's local desires and their global desires. Rationality is instrumental. If the global desire exists, the local trades are instrumentally irrational. If the global desire doesn't exist, there's no pump, just a series of satisfied local desires."
  **Soft Spot:** If the agent says "I have no global desire, only local ones," the Humean wins. You must hold that being an *agent* implies some minimal integration of local states.

  ### Objection 4: The "Myopia is Irrational" Counter
  **Who:** Grad Students / General Audience.
  **Phrasing:** "But isn't failing to see the loop itself irrational? If you have cyclic preferences, you *should* know you're vulnerable. So isn't the myopia just another form of irrationality stemming from the preferences?"
  **The Reply (2 mins):**
  "Not necessarily. Myopia is an informational or cognitive limit, not necessarily a preference defect. I can have cyclic preferences and know it. If I know it, I stop the trade.
  The standard argument says the preferences *force* the loss. I'm saying the preferences only *invite* the loss if I lack foresight or binding power. Calling the preferences irrational conflates the 'bug' (the cycle) with the 'crash' (the loss). You can have the bug without the crash if you run the right software (policy). So the crash isn't proof the bug is fatal."
  **Soft Spot:** They may argue that a rational agent *must* have the foresight, so the combination (Cycle + Myopia) is the irrational unit. Concede this, but insist the Cycle alone isn't sufficient.

  ### Objection 5: The Akrasia Hijack
  **Who:** The Two Akrasia/Weakness of Will Colleagues.
  **Phrasing:** "This sounds like a classic weakness of will case. You know the policy is better, but you lack the resolve to stick to it. Shouldn't we frame this as a failure of resolve rather than a failure of rationality?"
  **The Reply (2 mins):**
  "I want to resist the 'resolve' framing. Weakness of will implies you judge the policy to be better but fail to follow it due to passion. My argument is weaker: I'm saying the judgment of 'better' depends on whether you adopt the policy stance at all.
  It's not that you're too weak to follow the plan; it's that the preference ordering doesn't generate the plan automatically. We don't need to posit a struggle of will. We just need to posit that the agent considers the sequence as a unit. If they do, they stop. If they don't, they trade. That's a framing difference, not necessarily a volitional failure."
  **Soft Spot:** Hard to maintain this distinction if they press on *why* the agent fails to consider the sequence.

  ---

  ## 3. The "Must-Land" Reply
  *If this fails, the thesis collapses.*

  **The Issue:** The Open vs. Closed Pump distinction.
  **The Objection:** "Even in an open pump, you end up with something you prefer less than what you started with, relative to the starting point. Doesn't that show the preferences are wrong?"
  **The Reply:**
  "No. In an open pump, you end with Z. At the moment you hold Z, you prefer Z to what you had before. You are not 'worse off by your own lights' at the finish line. You are only worse off if we compare the finish to the start using the *start's* preferences.
  But if preferences can change or are context-dependent, that comparison is illegitimate. The only time you are indisputably worse off is the Closed Pump, where you end with A-minus-pennies. But as I argued, that requires myopia. If we agree the Closed Pump is the only true 'worse off' case, and it requires myopia, then the preference cycle alone isn't the culprit."
  **Why it must land:** If the audience believes Open Pumps prove irrationality without extra premises, your distinction between synchronic and diachronic dissolves.

  ---

  ## 4. The Dreaded Question
  *The one you hope nobody asks.*

  **The Question:** "If the irrationality lies in the inability to adopt a policy, what is the verdict on an agent who *cannot* bind themselves? For example, an addict who knows they will smoke, knows it violates their ex-ante policy, but physically cannot stop. On your view, are they irrational, or just unlucky about their environment?"

  **Why it's dangerous:**
  1.  If you say **Irrational**: You seem to be blaming them for a lack of control (binding power), which looks unfair and contradicts the "environment" claim.
  2.  If you say **Not Irrational**: You seem to exculpate clearly self-destructive behavior, which makes your theory of rationality too permissive for the room.
  3.  It forces you to define the boundary between "can't bind" and "won't bind."

  **Prepared Reply (Damage Control):**
  "I would say they are in a tragic position, but the *source* of the tragedy isn't their preference ordering. It's the mismatch between their capacity for agency and their situation.
  Rationality is an assessment of agency. If the capacity to execute a policy is gone, the assessment of 'irrational' loses its grip. We wouldn't call a paralyzed person irrational for not walking. Similarly, if the binding mechanism is broken, the failure is in the *capacity*, not the *rationality*.
  This is actually a feature of my view: it stops us from blaming the preference ordering for what is actually a failure of executive function. It directs the remedy toward support and binding mechanisms, not preference correction."
  **Risk:** The Formal Epi crowd may hate the idea that rationality depends on executive capacity. They want it to be about the states, not the hardware.

  ---

  ## 5. Strategic Notes for the Q&A

  *   **Watch the Humean:** She sits in the corner. If she starts speaking, stop everything and listen. If you lose her, you lose the "normativity" battle. Keep bringing it back to *instrumental* satisfaction of the $t_1$ self.
  *   **Manage the Akrasia Colleagues:** Thank them, but pivot. "That's a related issue, but I'm trying to isolate the structural constraint before we add the volitional one."
  *   **Don't Cite:** If asked "Who says that?", answer: "It follows from the structure of the pump itself. If you look at the nodes..."
  *   **The "Old News" Trap:** If the Dynamic Choice group says "We know this," reply: "You model it. I'm asking what justifies the model." Keep the distinction between *mathematical representation* and *philosophical explanation*.

  **Final Check:** Does this defend the thesis? Yes, by keeping the focus on the *conditions* required for the pump to work (myopia, binding), rather than the preferences themselves.
