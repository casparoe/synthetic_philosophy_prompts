  She's wiping down the Haas control panel when she gestures at the cycling indicator. "See the green 'Ready' lamp? That means the cycle is safe to start," she says, tapping the glass. "And if the cycle is safe, the door interlock is definitely engaged." She believes the cycle is safe ($p$) because the lamp is lit, and she believes the interlock is engaged ($q$) because she knows safety entails the interlock. "But look at the hydraulic gauge," she adds, pointing to a flickering needle in the red. "Pressure's low. It's not actually safe." The lamp is known to stick on when hydraulics fail but turns off reliably if the door opens. In the actual world, the hydraulics are fine, the door is closed, and the lamp is lit.

  **Verdict:**
  For belief $p$ ("Cycle is safe"): The method is *visual confirmation of the Ready lamp*. In the nearest possible world where $p$ is false (hydraulic failure), the lamp remains lit due to the glitch, so she still believes $p$. This violates Sensitivity (If $\neg p$, she would still believe $p$). Thus, $\neg Kp$.
  For belief $q$ ("Interlock engaged"): The method is *deduction from $p$ based on the lamp*. In the nearest possible world where $q$ is false (door open), the lamp turns off. She sees the lamp off, does not believe $p$, and thus does not believe $q$. This satisfies Sensitivity (If $\neg q$, she would not believe $q$). Since $q$ is true and she believes it, $Kq$.

  **Structural Feature:**
  The modal robustness of $q$ arises because the set of $\neg p$ worlds is larger than the set of $\neg q$ worlds. The observational method (the lamp) is insensitive to some $\neg p$ worlds (hydraulic failure) but sensitive to all $\neg q$ worlds (door open). The shift from direct observation ($p$) to inference ($q$) allows the belief state to track the specific falsity conditions of $q$ while ignoring the irrelevant falsity conditions of $p$ that break tracking for the base belief. The inference acts as a filter, isolating the modal neighborhood where the method is reliable.

  **Removing the Feature:**
  If you remove this modal gap—making the lamp insensitive to door openings as well (e.g., it sticks on for any fault)—then the nearest $\neg q$ world becomes one where she still believes $p$ and thus $q$. The case collapses into symmetric ignorance ($\neg Kp$ and $\neg Kq$). It does not revert to the *standard* closure-failure pattern ($Kp$ and $\neg Kq$); rather, the asymmetry vanishes entirely, leaving tracking unable to distinguish the entailed proposition from the base proposition.

  **Tracking-Theory Defense:**
  A defender would argue that the method for $q$ is not truly "deduction from $p$" but "belief based on the lamp's state regarding the interlock." They would claim I am individuating methods too finely to manufacture knowledge. Alternatively, they might argue that in the hydraulic failure world, her belief in $p$ is unsafe (even if insensitive), and since $q$ relies on $p$, $q$ inherits this unsafe status, denying knowledge of $q$ despite sensitivity.

  \answer{This reverse case does not save closure for tracking theory; it merely demonstrates that tracking violations can be asymmetrical in either direction depending on how method sensitivity aligns with the modal scope of the propositions.}
