answer: |-
  This is a precise and difficult exegetical problem. Tolstoy's *What Is Art?* is notoriously volatile because it oscillates between a phenomenological description of aesthetic experience and a sectarian manifesto.

  Here is a parsing of the "infection" (*zarazitel'nost*) passage, adhering to your constraint to avoid anachronistic cognitive science mapping.

  ### 1. The Verdict: Constitutive Normativity Disguised as Natural Law

  Tolstoy's "infection" is **evaluative (normative) operating through a claimed causal mechanism.** It is not a neutral psychological description, nor is it a purely arbitrary rule. It is a **constitutive definition.**

  Here is the breakdown of why it functions this way:

  **The Causal Claim:**
  Tolstoy asserts a specific psychology: The artist externalizes a felt experience; the perceiver internalizes it. He treats this as a law of human nature, akin to digestion or respiration. He argues that without this transmission, the object is merely a "stimulant" or a "craft." In this sense, he believes he is describing a causal reality: if no feeling is transmitted, the event *did not happen*.

  **The Normative Lever:**
  However, Tolstoy tightens the causal screws until they function as moral filters. He introduces three conditions for successful infection:
  1.  **Individuality:** The feeling must be distinct.
  2.  **Clarity:** The expression must be intelligible.
  3.  **Sincerity:** The artist must actually feel what they transmit.

  "Sincerity" is the Trojan Horse. It transforms the mechanism from a descriptive account of communication into a moral judgment. By making sincerity a *condition of possibility* for art, Tolstoy ensures that any art he deems "insincere" (e.g., Wagner, Shakespeare, his own earlier novels) is definitionally excluded from being art at all.

  **Why it is not merely "Emotional Contagion":**
  If Tolstoy were describing simple emotional contagion (a causal mechanism), he would have to admit that propaganda, pornography, or jingoistic songs are "art," because they successfully infect audiences with feelings (lust, hatred, pride). Tolstoy *does* admit these infect, but he categorizes them as "bad art" or "counterfeit art."
  *   **Crucial Distinction:** When he calls them "counterfeit," he is arguing they failed the *sincerity* test, not necessarily the *infection* test. But he often conflates the two. He argues that without sincerity, true infection *cannot* occur. This is where the causal claim becomes dubious and the normative agenda takes over. He is asserting that *moral* sincerity is a prerequisite for *psychological* transmission.

  **Conclusion:** The metaphor is **causal in form but normative in function.** Tolstoy wants you to believe infection is a biological fact (like a virus), so that when he says "Beethoven does not infect," it sounds like a medical diagnosis rather than a aesthetic preference.

  ### 2. What Argument or Finding Would Change This Reading?

  To falsify the interpretation that this is primarily a normative maneuver disguised as psychology, you would need textual evidence where Tolstoy decouples the *success of transmission* from the *moral quality of the artist.*

  **Specific Falsification Conditions:**
  1.  **Acknowledgment of "Immoral Infection":** If Tolstoy explicitly states, "A liar can transmit the feeling of lying so perfectly that the audience feels it, and this is Art," the reading shifts toward a causal/psychological one.
      *   *Current Status:* He generally resists this. He argues that insincerity creates a barrier that prevents true union. If you find a passage where he admits an insincere artist successfully united an audience in a feeling, the "normative" reading weakens.
  2.  **Technical Mastery without Feeling:** If Tolstoy concedes that高超 (high) technical skill can produce "art" even if the artist felt nothing during creation (i.e., craft becomes art through execution alone).
      *   *Current Status:* He vehemently denies this. He defines craft as the production of objects for utility or pleasure, distinct from art. If he were to classify a perfectly executed but emotionally hollow sonnet as "art" (even "bad art"), it would suggest he sees art as an object-class rather than an event of transmission.
  3.  **The "Unconscious Sincerity" Clause:** If he allows that an artist can transmit a feeling they *think* they feel, but don't actually feel, and still counts it as art.
      *   *Current Status:* He insists on the artist's internal state being the source. If evidence suggests he allows for the "method actor" paradox (feigning feeling to generate real feeling in others), the strict sincerity requirement loosens.

  ### 3. Where This Reasoning Is Most Likely to Fail

  There are three significant vulnerabilities in this analysis that you should flag in your feature:

  **A. The Translation of *Zarazitel'nost*:**
  The Russian word *zarazitel'nost* carries a heavier biological/epidemiological weight than the English "infection." In the late 19th century, germ theory was revolutionizing Russian medicine. Tolstoy is leveraging the cultural authority of science.
  *   *Risk:* By analyzing it through English philosophical concepts (normative vs. descriptive), we might miss that Tolstoy genuinely viewed this as a **spiritual physiology**. He may not be "disguising" a norm as a law; he may genuinely believe that moral impurity blocks spiritual transmission in the same way a blockage stops blood flow. If he is a naive realist about spiritual mechanics, calling it "normative" imposes a modern secular distinction he wouldn't recognize.

  **B. Tolstoy's Inconsistency:**
  *What Is Art?* was written over years and contains contradictions. In some chapters, he defines art broadly (any transmission of feeling); in others, narrowly (only transmission of *religious* feeling that unites humanity).
  *   *Risk:* Pinning him down to one logical structure (constitutive rule) might systematize a polemic that was intended to be fluid. He often shifts definitions mid-argument to trap his opponents. If you treat the text as a coherent system, you might miss the rhetorical strategy.

  **C. The "Sincerity" Black Box:**
  My analysis assumes "sincerity" is the normative filter. However, Tolstoy sometimes suggests that the *audience's* reaction is the final arbiter. If the audience feels united, the art was sincere.
  *   *Risk:* This creates a circularity. Art is what infects; infection proves sincerity; sincerity makes art. If the mechanism is circular, distinguishing between "causal" and "normative" becomes impossible. The reasoning fails if the text ultimately rests on this tautology rather than a linear argument.

  ### Summary for your Feature
  Tolstoy is not doing empirical psychology. He is proposing a **moral ontology of communication.** He claims that the *only* way feelings are truly transmitted (causal) is through sincerity (normative). Therefore, "infection" is not just a metaphor for how art works; it is a test for how *human beings ought to relate to one another.* To call it merely "emotional contagion" strips it of its religious imperative; to call it merely "criticism" ignores his claim to be describing a universal human function.

  **Recommendation:** Frame it as Tolstoy attempting to **scientize morality.** He uses the language of cause-and-effect (infection, signs, reception) to enforce a religious requirement (sincerity, brotherhood). The "infection" is the bridge he builds to make his moral demands seem like laws of nature.
