answer: |-
  ### Pre-Draft Brainstorming: Where does the body lie?

  Okay, looking at this idea. The instinct to move from metaphysics ("can we?") to pragmatics ("what for?") is strong, but it's a common move in ethics. What makes this specific? It's the *Witness Asymmetry*. That's the live wire. Most proposals will argue about the units of comparison (events vs. regimes). Few will argue that the *speaker* changes the truth conditions of the comparison.

  But here's the risk: If I say "who speaks matters," reviewers might hear "truth is subjective." I need to frame this as *licensing* rather than *truth*. A descendant isn't epistemically superior about death tolls, but they are morally licensed to speak on betrayal in a way a foreign academic isn't. Or vice versa? Actually, the prompt suggests the tension is that those epistemically positioned (perpetrator states?) are morally blocked. That's the ugly tension. I need to make sure the proposal doesn't resolve this too neatly. The value is in exposing the tension, not solving it.

  The "Forced-Choice Test" is the anchor for the incomparabilists. If you say "you can't compare," but you have a budget to save one group or another, you *are* comparing. I need to make sure this doesn't just sound like a standard consequentialist trap. It's about deliberative coherence.

  The Protocol is the sell. It can't be abstract. It needs to look like a flowchart. Step 1: Define Purpose. Step 2: Select Dimension. Step 3: Check Authority. If the proposal promises a "tool," it has to look usable.

  Biggest danger: Scope creep. Nine months is nothing. I cannot build a full normative theory of value. I have to stick to the *structure* of the comparison. I need to explicitly state what I am *not* doing. No new theory of suffering. No historical accounting. Just the logic of the ranking itself.

  Okay, the crux is this: The outrage at ranking isn't about the math; it's about the authority. The proposal needs to commit to that.

  ***

  ### Grant Proposal: The Architecture of Atrocity Comparison

  **Project Title:** Functional Comparability: A Protocol for Ranking Historical Atrocities

  **The Question**
  Is the resistance to ranking historical atrocities a metaphysical blockage or a functional confusion? Standard debates stall between the "uniqueness thesis" (each atrocity is *sui generis* and ranking is obscene) and the "single-scale consequentialist" view (all suffering is commensurable on one metric). Both miss the operative reality: agents *must* compare when allocating prevention resources, yet *should not* compare when designing memorials. This project asks: **Can we construct a stable taxonomy of comparative purposes that renders atrocity ranking tractable without violating moral constraints?** I argue that comparability is not a property of the events themselves, but a relation determined by three axes: the unit of analysis (event vs. regime), the dimension of value (death toll vs. betrayal), and the purpose of the ranking (prevention vs. commemoration).

  **Why Standard Positions Fail**
  Current literature leaves this question open because it treats comparability as monolithic.
  1.  **The Uniqueness Thesis** collapses under the **forced-choice test**. If an agent can prevent only one of two emerging atrocities, refusing to rank them is not moral humility; it is deliberative paralysis. The incomparabilist owes an account of how one chooses without weighing.
  2.  **The Flat Incomparabilist** argues values are distinct (e.g., dignity vs. survival), but fails to explain why we successfully trade these off in legal and policy contexts without moral catastrophe.
  3.  **The Everything-Is-Measurable View** ignores the **witness asymmetry**. The offensiveness of a ranking shifts depending on who speaks. A descendant of victims ranking suffering carries a different moral weight than a detached actuary calculating costs. The single-scale view assumes the ranking exists independently of the ranker, missing that part of the "wrongness" is about authority, not accuracy.

  **Methodology and Work Plan**
  I will not produce another survey of the uniqueness debates. Pure conceptual analysis of "worse than" spins its wheels; instead, I will use a functionalist approach, testing concepts against the constraints of real-world decision bodies.

  *   **Months 1–3 (Conceptual Mapping):** I will rigorously define the three axes. The goal is to isolate cases where ranking feels obscene versus cases where it feels mandatory. I will draft the logical structure of the "forced-choice" argument to pressure the incomparabilist position.
  *   **Months 4–6 (Asymmetry Testing):** I will apply the framework to specific contexts (reparations commissions, curriculum committees). Here I will test the witness asymmetry: does the epistemic position of the ranker alter the validity of the comparison? I will interview or review transcripts from past compensation boards to see how they implicitly handled this.
  *   **Months 7–9 (Synthesis and Protocol):** I will draft the 7,000-word paper and the one-page protocol. The protocol will not be a ranking list, but a decision tree. It will force the user to declare their purpose before selecting a dimension.

  **Outcomes and Deciding Considerations**
  The project succeeds if it produces a taxonomy that explains why some comparisons are legitimate (triage) while others are not (memorialization).
  *   **Outcome A:** Comparability is fully purpose-relative. There is no "fact of the matter" on which atrocity was worse, only "worse for X purpose."
  *   **Outcome B:** There are moral constraints on purpose. Some purposes (e.g., ranking for the sake of hierarchical blame) are illegitimate regardless of the metric used.
  *   **Deciding Factor:** The witness asymmetry. If I find that the *who* matters more than the *why*, the theory shifts from functionalism to epistemic authority. If the *why* dominates, the theory remains procedural.

  **The Deliverable: The Protocol**
  The one-page "how to compare" protocol will be aimed at non-philosophers (boards, committees). It will contain three gates:
  1.  **Declare Purpose:** Are you preventing, commemorating, or compensating? (If commemorating, stop; ranking is prohibited).
  2.  **Select Dimension:** Are you measuring physical destruction, cultural erasure, or intent? (You cannot mix dimensions in a single ranking).
  3.  **Check Authority:** Who is issuing this ranking? (If the ranker lacks standing relative to the victims, the ranking is void regardless of accuracy).

  **Failure Conditions**
  I am committing to a sharp argument, which invites specific risks. The project fails if:
  1.  **Relativist Collapse:** The taxonomy becomes so granular that every case is unique, effectively resurrecting the uniqueness thesis under a different name.
  2.  **Usability Failure:** The protocol is too abstract for a curriculum committee to use. If it requires a philosophy degree to operate, it fails the "real world" test.
  3.  **Asymmetry Reduction:** If the witness asymmetry turns out to be merely about politeness or social etiquette rather than moral authority, the core innovation loses its philosophical weight.

  **Scope and Cuts**
  Nine months is insufficient for a full normative theory of value. To fit the timeline, I am cutting any attempt to quantify the dimensions themselves. I will not propose a metric for "cultural erasure" or "betrayal." I am only analyzing the *structure* of the comparison, not the content. I am also cutting a deep historical case study. I will refer to historical episodes generally (e.g., "state-led genocide" vs. "colonial neglect") without attaching specific dates or death tolls. This keeps the argument structural and prevents the proposal from resting on contested historical data. Finally, I am not addressing individual blame. This framework is for institutional decision-making, not criminal law.

  This project offers a way out of the deadlock. It acknowledges the moral panic around ranking without surrendering to it. It gives boards a way to act without pretending to be God.
