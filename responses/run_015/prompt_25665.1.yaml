prompt: |-
  I'm a backend engineer working on data provenance systems — the kind of thing C2PA does for media authenticity, signing camera-to-publish chains so you can verify an image hasn't been tampered with. I live in a world of hash chains, cryptographic attestations, content credentials, and git-style commit histories for digital artifacts. In my world, two blobs with the same SHA-256 are the same artifact, full stop. If I cp a file, the copy just *is* the file. The only reason we care about provenance is trust and security: who signed what, was this tampered with in transit, can I verify the chain of custody.

  But I've been falling down a rabbit hole reading about philosophical debates on art forgery — Goodman, Dutton, the whole thing about why we care that a painting is the original even when a forgery is perceptually identical and experts can't tell them apart. What's messing with my head is that in these debates, the causal history of the object seems to matter *aesthetically*, not just evidentially. It's not that we want the original because the forgery might later be exposed and embarrass us; the claim is that knowing it's a forgery changes the experience itself, that the object is somehow a different artwork even if it's atom-for-atom identical. This doesn't have any clean analog in my world. We provenance-engineers care about history for debugging and trust, but the idea that the history changes what the artifact *is*, or what kind of value it has, feels like category error territory — or maybe it's something we're missing.

  So here's what I want. Restate the main positions in the philosophical debate about fakes, forgeries, and the value of originals using the vocabulary I actually work with: cryptographic hashing, content authenticity, version control (commits, forks, rebasing), data lineage, replay, attestations, supply-chain integrity. Do the translation honestly — don't smuggle philosophical assumptions into my concepts and pretend they were there. Then give me a residue report: which claims map cleanly onto my world, which ones you had to stretch or distort, and which ones simply have no counterpart at all. I want to know whether the untranslatable residue points to something my vocabulary is too poor to express, or whether it suggests the philosophers are tracking a distinction that evaporates when you try to make it precise.

  Also, tell me how confident you are in each major claim you make, and call out the single thing you're least sure about — especially if you think you're leaning on a contested reading of someone's position.
