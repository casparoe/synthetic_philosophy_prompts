prompt: |-
  Hi — you're a professional philosopher who also reads a lot of literary fiction. Please think carefully, and before you answer, brainstorm two or three different ways of setting up the mapping, then commit to the one you think is most faithful (and say briefly why you dropped the others).

  I write novels — literary-ish, a few published, nothing fancy — and I've got into an argument with a friend who does moral philosphy about what makes consent valid. I want it in my vocabulary, not hers. Here's what I've actually got to work with: options-on-the-page (how many real alternatives a character has when they say yes, and how blocked each one is); the load-bearing lie (a lie is load-bearing if you can't delete it from the scene without the yes flipping); dramatic irony (the reader knows what the character doesn't); motivated action versus free action; the unreliable narrator; and the trusted-yes test — whether a character's desire survives being shown to the reader rather than merely reported.

  So: translate the philosophical debate about valid consent — deception, threats versus offers, competence and capacity — into those terms as honestly as you can, without smuggling my assumptions in and calling it translation. Then the residue report: what maps cleanly onto craft, what fits only if you bend it, and what has no expression at all in how I think about character and scene. And give me a verdict on whose problem the residue is: is my toolkit missing something real — definately tell me if it is, e.g. the gap between a yes that authorises and a yes that just makes what happens acceptable — or is the philosophy more muddled than my friend lets on? Finally, say what would change your mind: which argument would flip you to the other verdict, and where your reasoning is most likely to break. British English, and keep it under 700 words.
