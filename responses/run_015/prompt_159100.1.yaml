answer: |-
  Bottom line
  Don't take the bet. Your wife is right: in quantum mechanics, the "weight" or measure of a branch determines your odds, not the number of copies printed on it. Even by your brother-in-law's own admission about the unequal thickness of the copies, the math doesn't add up in your favor.

  What you two are actually disagreeing about
  You're fighting over how to count "yourselves" after the split. Your brother-in-law is using a "copy-counting" view, where probability is just the fraction of future versions of you that win. He's arguing that because nine copies wake up happy on the low-probability branch, you should bet as if that branch is the likely one.

  Your wife is using the standard "Born Rule" view, which says probability comes from the quantum amplitude (the "thickness") of the branch, regardless of how many people are standing on it. She's correctly pointing out that printing more copies on a thin branch doesn't make the branch thicker, just like printing a million lottery tickets doesn't change the odds of the draw.

  Adding it up both ways
  Let's look at the arithmetic using standard decision theory. You pay $600 upfront. On the 90% branch, one version of you loses it all (utility: -$600). On the 10% branch, nine versions each net $100 (total utility: +$900). Your expected value is (0.9 × -$600) + (0.1 × $900), which equals -$450. You lose money on average.

  Your brother-in-law's math tries to compare the total payout on the winning side ($6,300) discounted by its weight (0.1 = $630) against your upfront cost ($600). But this ignores that the pain of losing the $600 happens on the 90% branch too. When you account for the loss experienced by the majority version of you, the bet collapses. Plus, his admission that eight of the nine copies are "vanishingly thin" undermines his own "nine out of ten futures" pitch—if eight copies barely exist, you effectively have one thick loser versus one thick winner.

  What I'd do
  I'd keep my $600 and enjoy the cookout. This is a classic "quantum suicide" style thought experiment dressed up as a wager, and it relies on confusing metaphysical claims about identity with actual expected value. Unless you have a burning desire to fund his startup or prove a point about philosophy, there's no financial logic here that survives contact with the actual numbers.

  The strongest thing on the other side
  The only sliver of validity is if you believe personal identity splits equally among copies regardless of quantum weight—a minority view in physics but a coherent philosophical stance. If you truly believe you are equally likely to be any of the resulting copies regardless of branch thickness, then the 9-to-1 copy ratio looks attractive. However, even that argument falls apart once he admits most of those copies are "thin," making them negligible candidates for your consciousness.

  Confidence and my weakest point
  I'm about 95% confident you should walk away, because the expected value is negative under almost any standard decision theory. The weakest point is the deep metaphysics of personal identity in Many-Worlds; while physicists agree on the betting odds (Born Rule), philosophers still debate whether "you" are the pre-branch self or the collection of post-branch selves. That debate doesn't change the financial loss, but it's the only part of this puzzle that isn't completely settled science.
