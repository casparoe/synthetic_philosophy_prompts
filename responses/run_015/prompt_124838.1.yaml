  Question (20 pts): Define pure time preference and distinguish it carefully from exponential discounting of future utility. Then explain Sidgwick's claim that the mere temporal location of a pleasure or pain is not a rational ground for treating them differently. Finally, apply the distinction to this case: a government is deciding whether to fund a 200-year groundwater remediation project. The cost-benefit analysis uses a 3% social discount rate that the analysts say includes no risk premium, no capital productivity adjustment, and no growth factor—only pure time preference. Is that rate defensible on the view we've discussed?

  Student answer:
  "Pure time preference is when you value future outcomes less solely because they occur later, like preferring $100 now over $110 in a year with zero risk. Exponential discounting is the formula 1/(1+r)^t that weights future utility, and it always embeds pure time preference because the rate r just is our preference for present over future goods. Sidgwick argued that time itself shouldnt matter ethically, so he called pure time preference ethically indefensible and said it comes from weakness of imagination; this means we should reject all discounting, even for risk. Ramsey agreed with Sidgwick that the bias is irrational, but he said we still need exponential discounting in public policy or we'll end up paralyzed by obligations to infinite future generations.

  In the groundwater case, the 3% rate is pure preference with no other justification, so Sidgwick's argument shows its just unfair bias against people who happen to live later. And since exponential discounting requires pure time preference to function, using any positive r here is wrong. The government should set r to 0 and weigh year 200 exactly like year 1."

