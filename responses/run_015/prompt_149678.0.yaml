      *   *Did I mention Dennett?* Yes, crucial since he coined the term.

  10. **Final Polish:** Check flow and ensure the "expert" persona comes through as helpful, not condescending. (The user said "act like an expert on how arguments actually work," so I need to embody that analytical rigor.)

