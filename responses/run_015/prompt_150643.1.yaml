answer: |-
  There is no single established term in aesthetics or philosophy of perception that captures the specific triad of features you describe (one-shot irreversibility, generalization, and resilience to debunking). The phenomenon sits at the intersection of three distinct debates, borrowing from each but belonging wholly to none.

  Here is the carving you requested.

  ### 1. The Near Misses
  To locate the phenomenon, we must distinguish it from the concepts that most closely approximate it.

  *   **Aspect Perception (Wittgenstein):** You are correct to reject the duck-rabbit model. Aspect switching is characterized by *volitional reversibility* and *neutrality* (neither aspect is "true"). Your case involves *irreversibility* and *veridicality* (the counter-melody is heard as objectively present). This is not "seeing-as"; it is "coming to see."
  *   **Categories of Art (Walton):** Kendall Walton argues that we perceive works under categories (e.g., "Guernica" is perceived under the category *Cubism*, not *Impressionism*). Your case fits the mechanism (the sentence provides the category) but violates Walton's condition of *correctness*. For Walton, if the category is factually wrong, the aesthetic judgment is flawed. In your case, the *hearing* persists despite the factual error. The percept has decoupled from the category's truth conditions.
  *   **Cognitive Penetrability:** This is the broad debate on whether beliefs influence perception. Your case is a specific, extreme subtype. Standard cognitive penetrability is often gradual or context-dependent. Your case is *discontinuous* (one-shot) and *encapsulated* (survives the removal of the belief).
  *   **Perceptual Learning:** This accounts for the irreversibility (one cannot "unlearn" to read), but standard perceptual learning requires repeated exposure and practice. Your case is *instantiated by testimony*, not by sensory repetition.

  ### 2. The Coined Term: Perceptual Crystallization
  I propose the term **Perceptual Crystallization**.

  **Definition:** *Perceptual Crystallization* is the irreversible reorganization of a sensory field triggered by semantic input, wherein the resulting perceptual structure becomes autonomously sustained by its own internal coherence, independent of the veracity of the initiating input.

  **Etymology of the Concept:** The term "crystallization" is chosen to capture three physical analogues corresponding to your three features:
  1.  **Phase Change (Irreversibility):** Like water freezing, the shift is discontinuous. You do not "slide" into hearing the counter-melody; the auditory field snaps into a new state. Returning to the prior state is not a matter of will, but of entropy (it requires the structure to dissolve, which it resists).
  2.  **Lattice Structure (Generalization):** A crystal grows according to a structural rule. Once the "seed" (the sentence) establishes the lattice, new material (other pieces by the composer) is assimilated into the same structure automatically.
  3.  **Autonomy (Debunking Resilience):** Once a crystal forms, it holds its shape even if the seed that started it is removed. The perceptual structure is sustained by the fit between the sound and the listener's auditory cognition, not by the continued belief in the testimony.

  ### 3. Unity of the Three Features
  You ask whether the three features (irreversibility, generalization, debunking resilience) are one phenomenon or three that travel together. Under the model of Perceptual Crystallization, **they are one phenomenon.**

  They are not distinct effects caused by the sentence; they are three descriptions of the same underlying mechanism: **the shift from Top-Down Guidance to Bottom-Up Stability.**

  *   **Before the sentence:** The counter-melody is acoustically present but perceptually latent. The auditory system lacks a "schema" to bind those frequencies into an object.
  *   **The sentence:** Acts as a *schema-injection*. It provides the top-down rule ("group these frequencies").
  *   **After the sentence:** The schema is no longer top-down (a belief you hold); it becomes bottom-up (a feature of the sound). Because the counter-melody is *structurally plausible* (it fits the harmony, rhythm, and style), the auditory system accepts it as a valid parsing of the data.
  *   **Why they travel together:**
      *   Because the parsing is valid (structurally plausible), it becomes **Irreversible** (the brain prefers stable interpretations).
      *   Because it is a schema (a rule), it **Generalizes** (applies to new data fitting the rule).
      *   Because it is now a bottom-up percept, it is **Autonomous** (it no longer relies on the top-down belief that generated it).

  If the counter-melody were *not* structurally plausible (e.g., if the colleague pointed to random noise), Crystallization would not occur. You would attend to the noise, but it would not "gel." Thus, the three features are mutually dependent indicators of a successful structural reorganization.

  ### 4. Boundary Cases
  To ensure the carving is precise, here is how Perceptual Crystallization differs from nearby states:

  | Case | Description | Verdict | Why? |
  | :--- | :--- | :--- | :--- |
  | **The "Spotlight" Instruction** | "Listen to the viola at bar 30." | **Not Crystallization** | This is *Attention*. It is local, reversible, and does not generalize. It pins the ear to a spot; it does not reorganize the field. |
  | **The "False Positive"** | "There is a quote from Bach here." (There isn't). | **Not Crystallization** | If the structure isn't there, the percept won't stabilize. You might *believe* you hear it, but it will feel forced and vanish when the belief is challenged. Crystallization requires the percept to be *self-sustaining*. |
  | **The "Unreachable Friend"** | You cannot make them hear it. | **Boundary Condition** | Crystallization requires the recipient's perceptual system to be capable of the reorganization. If their auditory schemata are too rigid or lack the necessary resolution, the seed cannot take. This confirms the phenomenon is a *interaction* between stimulus and perceiver, not a property of the stimulus alone. |
  | **The "Duck-Rabbit"** | Switching aspects at will. | **Not Crystallization** | This is *Aspect Switching*. It lacks veridical commitment and irreversibility. You know both are possible; in Crystallization, the new way feels like *the* way. |
  | **The "Gradual Learner"** | Hearing the line after 50 listenings. | **Not Crystallization** | This is *Perceptual Learning*. It lacks the discontinuous, one-shot nature. It is a slope, not a step. |

  ### 5. The Debunking Paradox
  The most philosophically significant feature is the resilience to debunking. In epistemology, if *p* is believed on the basis of testimony *t*, and *t* is discredited, *p* should collapse.

  In Perceptual Crystallization, the belief (*"There is a counter-melody"*) collapses, but the percept (*hearing the counter-melody*) remains. This suggests that the testimony does not merely convey a proposition; it **activates a perceptual module**.

  Once activated, the module verifies itself. You are no longer hearing the melody *because she said so*; you are hearing it *because it makes sense of the sound*. The testimony was the key, but the door is now open. The "truth" of the experience is no longer historical (did the composer intend this?) but structural (does this parsing work?). This explains why you can admit the edition was wrong while still hearing the line: the line is *perceptually true* even if it is *historically false*.

  ### Summary
  The phenomenon is **Perceptual Crystallization**. It is distinct from aspect perception (due to irreversibility), distinct from standard perceptual learning (due to the testimonial trigger), and distinct from Waltonian categories (due to its autonomy from factual correctness). It is a state change in the listener's auditory cognition, where a semantic seed triggers a structural reorganization that becomes self-sustaining.
