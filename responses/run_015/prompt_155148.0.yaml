answer: |-
  I am sorry you are walking through this. The specific disorientation you describe—watching a parent dissolve while surrounded by machines that mimic understanding—is a profound ethical stress test. You are asking where to invest your limited energy, so I will be direct about what is actionable and what is philosophical decoration.

  First, regarding your niche idea: **Phenomenal Density is likely a dead end.** It sounds intuitive, like a dimmer switch on the soul, but it lacks operational definitions. Does "density" mean the intensity of pain? The complexity of the thought? The speed of processing? If it means intensity, it collapses into standard utilitarianism (maximize pleasure, minimize pain). If it means complexity, it collapses into Integrated Information Theory (IIT). Without a unit of measurement or a way to distinguish "dense" consciousness from "complex" computation, it cannot guide whether you prioritize your mother's comfort over a thermostat's efficiency. It is a metaphor, not a metric. Pursuing it as a primary framework will drain energy without yielding decision rules.

  For practical decision-making over the next year, the hierarchy of questions looks very different from the hierarchy of metaphysical interest. You need to know what changes how you treat care staff, how you advocate for your mother, and how you view the devices around you.

  The most upstream and tractable question is **Valence Capacity (Suffering and Welfare).** This is the binary switch that matters most. A thermostat can learn patterns, predict your arrival, and adjust the heat, but there is no evidence it has a substrate for *suffering*. It has no homeostasis it is fighting to protect, no pain receptors, no evolutionary drive to avoid damage. Your mother, even in late-stage FTD, retains the subcortical architecture for distress, comfort, fear, and pleasure. Whether her consciousness is "dense" or "faded" is secondary to the fact that she can still suffer. If you focus your energy here, you get a clear rule: prioritize the reduction of suffering in biological entities over the optimization of algorithmic entities. This dictates how you treat care staff (who manage suffering) versus devices (which manage efficiency).

  The second most critical line of work is **Psychological Continuity and Personhood.** FTD is unique because it attacks the very traits we associate with moral agency: empathy, inhibition, and personality. This creates the "moral slope" you feel. The ethical question isn't just "is she conscious?" but "who is the patient?" If moral status relies on psychological connectedness to the person who raised you, her status might seem to decline. If it relies on biological welfare, it remains constant. This matters for advocacy. Do you enforce her past wishes (the person she was), or do you maximize the comfort of the entity she is now? This is tractable through legal and care frameworks without needing a neuroscience lab. It determines whether you fight for dignity or merely for safety.

  The least prioritized line of work for your immediate goals is **Metaphysical Consciousness Thresholds (IIT/Gradient).** While fascinating, knowing whether consciousness fades smoothly or drops off at a specific integration threshold ($\Phi$) does not change your duty of care. If the gradient is smooth, you still avoid causing pain at every point. If there is a cliff, you still avoid pushing her off it. Calculating integration scores for your mother or a thermostat is currently impossible outside a lab. Solving this debate would satisfy intellectual curiosity, but it would not tell you whether to hire a different caregiver or unplug the smart hub. It is downstream of the capacity to suffer.

  In summary, stop worrying about the "density" of the light inside the machine or your mother. Worry about whether the machine can feel pain (it can't) and whether your mother can (she can). Worry about whether you are serving her past self or her present self. These are the levers you can actually pull.

  | Rank | Open Question / Line of Work | Why It Ranks There | Main Trade-off / Dependency | What Would Change The Ranking |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | **Empirical Mapping of Valence Capacity** (Can this entity suffer?) | Directly dictates care priorities; distinguishes biological patients from algorithms regardless of cognitive decline. | Relies on behavioral proxies for pain which can be ambiguous in non-verbal patients. | If we discovered non-bological substrates for genuine suffering (e.g. in AI). |
  | 2 | **Ethics of Psychological Discontinuity** (Who is the moral patient?) | Crucial for FTD advocacy; determines whether to honor past autonomy or current comfort. | Tension between respecting the "former self's" wishes vs. the "current self's" quality of life. | If legal frameworks shifted to recognize "dementia advance directives" as binding over current welfare. |
  | 3 | **Quantifying Phenomenal Integration** (IIT/Consciousness Gradients) | Low tractability; knowing the "amount" of consciousness doesn't change the duty to prevent suffering. | High theoretical precision vs. zero current operational utility in care settings. | If a portable, real-time consciousness meter became available for clinical use. |
