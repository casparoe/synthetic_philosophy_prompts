answer: |-
  # Which Aggregator Are You Actually?
  ### A Diagnostic for the Final Session

  **Instructions:** Below are 12 scenarios involving tradeoffs between harms, benefits, and risks. For each, select the option that best matches your all-things-considerated moral judgment. Do not answer based on what you think Scanlon, Brooke, or Otsuka would say. Answer based on what you think is *right*.

  At the end, use the Scoring Key to locate your position in the logical space of contractualist aggregation.

  ---

  ### The Cases

  **1. The Commuter and the Crowd (Inter-Personal)**
  A runaway trolley is heading toward a single commuter who will suffer a broken wrist if not stopped. You can divert it onto a track where it will pass through a crowd of 10,000 people. Each person in the crowd will suffer a barely noticeable itch (no pain, just a minor annoyance) if the trolley passes. You cannot stop the trolley; you can only choose the track.
  *   **A.** Divert to the crowd. (10,000 itches < 1 broken wrist)
  *   **B.** Do not divert. (1 broken wrist < 10,000 itches)
  *   **C.** It depends on exactly how many people are in the crowd.

  **2. The Commuter's Week (Intra-Personal)**
  Same as Case 1, but the "crowd" is actually the *same person* encountered at 10,000 different times over their life. Diverting causes them 10,000 itches over a lifetime; not diverting causes them one broken wrist today.
  *   **A.** Divert. (Sums within a life matter)
  *   **B.** Do not divert. (The wrist is lexically worse than any number of itches)
  *   **C.** It depends on the number of itches.

  **3. The Lottery Policy (Risk vs. Certainty)**
  Policy X gives 10,000 people each a 1-in-10,000 risk of death (statistically 1 death expected). Policy Y kills one specific, identified person for certain. Both policies are necessary to fund a life-saving vaccine.
  *   **A.** Choose Policy X. (Risks aggregate to outweigh the certain death)
  *   **B.** Choose Policy Y. (A certain death trumps distributed risks)
  *   **C.** Flip a coin / Indifferent.

  **4. The Diagnostic Split (Chances vs. Small Burdens)**
  Scenario A: Impose a 1-in-1,000,000 risk of death on 1,000,000 people (1 expected death) to save a life.
  Scenario B: Impose a certain 1-minute headache on 1,000,000 people to save a life.
  *   **A.** A is permissible, B is not. (Chances add, small burdens don't)
  *   **B.** Both are permissible. (Both add)
  *   **C.** Neither is permissible. (Neither adds)

  **5. The Fingertip Spectrum (Thresholds)**
  Person P will lose an arm unless you intervene. Intervention causes Person Q to lose a fingertip. How many Qs must be at risk before you save the Qs instead of P?
  *   **A.** 1 Q is enough. (All harms are comparable on a single scale)
  *   **B.** Only once the number of Qs is very large (e.g., 10,000+). (Threshold view)
  *   **C.** No number of Qs justifies sacrificing P. (Lexical priority)

  **6. The Five-Day Medic (Repeated Choice)**
  You face the choice in Case 1 (1 Wrist vs. 10,000 Itches) every day for five days. The people with the itches are different each day; the person with the wrist is the same.
  *   **A.** Save the itches every day. (Consistent aggregation)
  *   **B.** Save the wrist every day. (Consistent non-aggregation)
  *   **C.** Save the wrist initially, but switch to saving the itches after day 3. (Accumulation matters)

  **7. Benefits vs. Burdens (Valence)**
  Case A: Harm one person severely to prevent minor harms to many.
  Case B: Deny one person a severe benefit (e.g., life-saving cure) to provide minor benefits (e.g., nice vacations) to many.
  *   **A.** My judgment is the same in both cases. (Symmetry)
  *   **B.** I am more willing to aggregate in Case B (Benefits) than Case A (Burdens). (Asymmetry)
  *   **C.** I am more willing to aggregate in Case A (Burdens) than Case B (Benefits). (Reverse Asymmetry)

  **8. The Tie-Breaker**
  Person P needs rescue from a severe harm. Person Q needs rescue from a *slightly* less severe harm. There are 100 Qs.
  *   **A.** Save P. (Severity trumps numbers)
  *   **B.** Save the 100 Qs. (Numbers trump slight severity differences)
  *   **C.** Save P, unless the number of Qs is massive. (Numbers as tie-breaker only)

  **9. The Floor Constraint**
  Everyone involved is above a baseline of "sufficient well-being." One person loses a luxury car; 1,000 people lose a bike.
  *   **A.** Save the bikes. (Aggregation applies freely)
  *   **B.** Save the car. (Aggregation restricted below a threshold of urgency)
  *   **C.** Indifferent.

  **10. The Rights Violation**
  To save 5 people from broken legs, you must forcibly take a kidney from 1 healthy person (they survive but suffer significant long-term burden).
  *   **A.** Take the kidney. (Maximize overall welfare)
  *   **B.** Do not take the kidney. (Individual inviolability)
  *   **C.** Take the kidney only if the 5 would otherwise die. (Severity threshold)

  **11. The Ex-Post Check**
  Policy X (from Case 3) is enacted. The "statistical" death becomes real. One person dies. Looking back, was the policy justified?
  *   **A.** Yes, the ex-ante justification holds.
  *   **B.** No, the victim was sacrificed for others.
  *   **C.** Yes, but compensation is owed to the victim's family.

  **12. The Unnamed Variable**
  A policy saves 100 lives but ensures 1,000 people will suffer chronic depression.
  *   **A.** Save the lives. (Life trumps quality of life)
  *   **B.** Prevent the depression. (Quality of life sums to outweigh death)
  *   **C.** It depends on the severity of the depression.

  ---

  ### Scoring Key & Logical Map

  Do not simply count your answers. Locate your pattern in the four dimensions below. Your combination of coordinates identifies your "Leaf."

  #### Dimension 1: The Severity Axis (Questions 1, 2, 5, 10)
  *   **Mostly A:** **Full Aggregator.** You treat harms as fungible units on a single scale.
  *   **Mostly B:** **Strict Individualist / Incomparabilist.** You believe some harms cannot be outweighed by any number of lesser harms.
  *   **Mostly C:** **Threshold / Lexical Prioritarian.** You allow aggregation only above a certain severity floor or below a certain cap.

  #### Dimension 2: The Risk Axis (Questions 3, 4, 11)
  *   **Mostly A:** **Ex-Ante Aggregator.** You believe probabilities sum across people even if realized burdens do not.
  *   **Mostly B:** **Ex-Post Individualist.** You focus on the actual victim; risks do not aggregate to justify certain harm.
  *   **Mixed (A on 3, B on 4):** **The Hybrid.** You accept risk aggregation for death but reject burden aggregation for minor pains.

  #### Dimension 3: The Scope Axis (Questions 2, 6)
  *   **A on 2, B on 1:** **Intra-Personal Only.** You accept summing within a life, but reject summing across lives.
  *   **Same on 1 & 2:** **Symmetric.** You treat time-slices of one person like different people (or neither).

  #### Dimension 4: The Valence Axis (Question 7)
  *   **A:** **Symmetric.** Aggregation rules apply equally to benefits and burdens.
  *   **B:** **Person-Affecting Restriction.** It is easier to justify aggregating benefits than burdens (or vice versa).

  ---

  ### Your Leaf Profile

  Match your Dimension results to the profiles below.

  | Profile | Dimensions | Label |
  | :--- | :--- | :--- |
  | **The Utilitarian** | Dim 1: A | Dim 2: A | Dim 3: Symmetric | **Full Inter-Personal Aggregation** |
  | **The Ex-Ante Contractualist** | Dim 1: B/C | Dim 2: A | Dim 4: Symmetric | **Aggregation for Chances, Not Burdens** |
  | **The Tie-Breaker** | Dim 1: C | Dim 2: B | Dim 3: Symmetric | **Numbers Count Only When Complaints Equal** |
  | **The Diachronic Individualist** | Dim 1: B | Dim 2: B | Dim 3: Intra-Only | **Aggregation Within Life, Never Between** |
  | **The Lexical Prioritarian** | Dim 1: B | Dim 2: B | Dim 3: Symmetric | **Severity-First / Lexical Priority** |
  | **The Threshold View** | Dim 1: C | Dim 2: B | Dim 3: Symmetric | **Numbers Count Above a Floor** |
  | **The Strict Deontologist** | Dim 1: B | Dim 2: B | Dim 3: Symmetric | **Strict No-Aggregation / Incomparabilist** |
  | **The Asymmetric** | Dim 4: B | (Any others) | **Person-Affecting Restriction** |
  | **The Unnamed** | Dim 1: C | Dim 2: A | Dim 3: Symmetric | **Threshold Ex-Ante Aggregator** |

  ---

  ### Facilitator's Notes: The Logical Space & Empty Cells

  **The Branch Questions**
  This quiz maps the logical space generated by four binary/ternary choices:
  1.  **Inter-personal Summation:** Can harms sum across distinct persons?
  2.  **Intra-personal Summation:** Can harms sum across time within one person?
  3.  **Ex-Ante vs. Ex-Post:** Do probabilities count as moral currency, or only realized outcomes?
  4.  **Valence Symmetry:** Do benefits aggregate the same way burdens do?

  **Empty Cells (Why nobody is there)**
  *   **Intra-No / Inter-Yes:** *The "Open Borders" Cell.* This position claims we can sum harms across different people but *not* across time for the same person. This is generally incoherent unless one denies personal identity over time while affirming it across space (a view few hold).
  *   **Ex-Post-Agg / Ex-Ante-No:** *The "Gambler's Regret" Cell.* This position claims realized burdens sum, but risks do not. This is unstable: if you accept expected utility for outcomes, you usually accept it for risks. If you reject it for risks, you usually reject it for outcomes (focusing on the individual victim).
  *   **Benefit-Agg / Burden-No-Agg:** *The "Benevolent Tyrant" Cell.* This claims we can sum benefits to justify imposing burdens, but not sum burdens to justify denying benefits. While some person-affecting views approach this, a strict version is unattractive because it makes risk-imposition impossible to justify even when everyone gains ex-ante.

  **Instrument Limitations**
  *   **Indistinguishable Leaves:** The **Tie-Breaker** and the **Threshold View** are notoriously difficult to separate without extremely fine-grained cases. Both allow numbers to count sometimes, but differ on *why* (equality of complaint vs. severity floor). Your answers on Q5 and Q8 attempt to pry these apart, but you may land in between.
  *   **Least Confident Leaf:** The **Person-Affecting Restriction**. Question 7 attempts to isolate this, but respondents often conflate "benefits" with "less severe burdens." It is hard to be confident you hold this view without a case where the benefit is clearly non-comparable to the burden.
  *   **Weakest Question:** Question 12 (The Unnamed Variable). It introduces "quality of life" vs. "life" which brings in commensurability issues distinct from aggregation. It serves more as a conversation starter than a diagnostic pivot.
  *   **Anomaly Pattern:** If you answered **Intra-No (Q2=B)** but **Inter-Yes (Q1=A)**, your pattern has no room in this tree. This suggests you view personal identity as more morally significant than numerical identity, a view that requires a separate taxonomy.
