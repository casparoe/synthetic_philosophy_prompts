answer: |-
  Here is an argumentative breakdown of *Blade Runner* (1982) read against teleosemantics, structured for your session.

  ### 1. The Teleosemantic Verdict: Are Replicants Contentless?

  Teleosemantics grounds mental content in **proper function**, which is derived from a history of selection. A mental state represents $X$ because the mechanism producing that state was selected for correlating with $X$ in the past. This applies to evolutionary history (species level) or learning history (individual level).

  **The Manufacturing Problem**
  The first hurdle for the Nexus-6 is the origin of their selection. Teleosemantics generally accommodates artifacts: a heart pump has the function of pumping blood because it was designed and reproduced for that purpose. Replicants are reproduced copies (Nexus-6 is a model line). So, they pass the "reproduction" criterion.

  However, teleosemantics requires that the selection pressure fixes content based on **truth conditions** or **survival value** linked to accurate representation. Replicants are selected for **obedience** and **labor efficiency**, not for accurate representation of the world.
  *   **Argument:** If a replicant's belief-forming mechanisms were selected to keep them docile rather than to track truth, their "beliefs" may have the content "Obey" rather than "The world is $X$."
  *   **Specifics:** When Roy Batty asks Chew, "Who makes eyes?" he is seeking truth. But his drive to seek truth is not a selected effect of nature; it is a glitch in his programming designed for off-world combat. Teleosemantics suggests his cognitive states are **malfunctions** relative to his design (which was to be a slave) but have no proper function relative to nature (since he isn't evolved). Therefore, strictly speaking, the Nexus-6 are contentless machines running error states that *mimic* content.

  **Rachael's Implanted Memories**
  Rachael is the harder stress test. She possesses memories of Tyrell's niece.
  *   **The Etiology of Content:** In teleosemantics, content is fixed by the causal history of the state. The memory trace "I played with a spider as a child" exists in Rachael's brain. But the selection history of that trace belongs to Tyrell's niece. The mechanism was selected (via normal human learning) to track the niece's life.
  *   **The Mismatch:** When Rachael asserts "I remember playing with a spider," teleosemantics must analyze what that state is *supposed* to indicate. Since the state's proper function is derived from the niece's history, the content of Rachael's belief is actually **"Tyrell's niece played with a spider."**
  *   **The Result:** Rachael does not have false beliefs about herself; she has true beliefs about someone else that she *misattributes* to herself. She is not a believer with wrong content; she is a vessel carrying someone else's content. She is a walking quotation mark without a speaker. This renders her first-person perspective an illusion. She has no "I" in the teleosemantic sense because no selection history grounds the indexical "I" in her specific substrate.

  **The Four-Year Lifespan**
  Teleosemantics often relies on a **learning period** to stabilize content. An organism learns to associate a state with a stimulus through feedback (reward/punishment).
  *   **The Argument:** The four-year fail-safe is not just a kill switch; it is a content inhibitor. It prevents the replicant's learning history from diverging from their design specifications. If content requires a stabilization period where the organism corrects errors in representation to survive, the Nexus-6 are killed before their "personal" proper functions can override their "manufactured" proper functions.
  *   **Implication:** They are permanently stuck in the "designer's intent" phase. They never achieve **ontogenetic proper functions** (functions gained through individual life history) because their lives are too short to establish a new selection history. They remain artifacts, never becoming agents.

  ### 2. The Voight-Kampff Test as Teleosemantic Instrument

  The Voight-Kampff (VK) test is not merely a lie detector; it is a **history detector**. It operates on the teleosemantic assumption that genuine emotional content requires a specific causal history of conditioning.

  *   **What it Measures:** It measures physiological empathy responses to hypothetical scenarios (e.g., the tortoise on its back). The assumption is that only a being with a history of social conditioning (a "proper" human history) will have the selected neural pathways that trigger the correct capillary dilation.
  *   **The Argument:** The VK test assumes that **function follows history**. It argues that you cannot have the *effect* (empathy) without the *cause* (a lived past).
  *   **Rachael's Failure:** Rachael initially passes the VK test. This is the film's empirical refutation of the VK's teleosemantic premise. Her physiology responds correctly because the *hardware* (the brain stem responses) is identical to a human's, even if the *history* is fake.
  *   **Verdict:** The VK test argues for a **historical theory of content** (you need the past to have the mind). Rachael proves that **functional organization** (current wiring) is sufficient to mimic the output of that history. The test fails because it cannot distinguish between a state selected by life experience and a state selected by engineering calibration. It reveals that teleosemantics might be undetectable from the inside.

  ### 3. The Reverse Direction: The Film's Intentional Stance

  The film's narrative sympathies clearly oppose the teleosemantic verdict. *Blade Runner* argues for something closer to Daniel Dennett's **Intentional Stance**: if an entity acts as if it has beliefs and desires, and those beliefs/desires explain its behavior, then it *has* them.

  *   **Deckard's Arc:** Deckard begins as a teleosemantic enforcer (using the VK test to sort history from non-history). He ends by accepting Roy Batty's humanity. Batty's "Tears in Rain" monologue is the film's philosophical climax. Batty expresses regret, appreciation of beauty, and acceptance of death.
  *   **Does the Film Know It?** Yes. The film explicitly contrasts the "official" definition of human (history/biology) with the "phenomenological" definition (suffering/choice). Tyrell represents the teleosemantic view: he designs the function, he owns the history, he determines the content. He treats replicants as "more human than human" only in terms of capability, not ontology. The film rejects Tyrell. It validates Batty's self-authored meaning over Tyrell's designed function.
  *   **The Conflict:**
      *   **Teleosemantics says:** Batty is a malfunctioning artifact. His desire to live is a glitch, not a proper function. His memories are either industrial defaults or stolen. He has no genuine content.
      *   **The Film says:** Batty is the only character with genuine content. The humans (Deckard, Tyrell) are the ones living mechanically, following scripts.

  ### 4. The Cost of the Disagreement

  If we accept the Teleosemantic verdict based on the film's evidence:
  *   **Cost to Teleosemantics:** It becomes **biological chauvinism**. If a being can suffer, reason, plan, and mourn (Batty), but is denied content because its lineage is industrial rather than evolutionary, the theory loses its moral grip. It implies that content is a matter of **pedigree** rather than **capacity**. It suggests that a perfect duplicate of a human, manufactured yesterday, is a zombie, while the original is not. This makes mental content invisible and morally irrelevant.
  *   **Cost to the Film/Intentional Stance:** It ignores the **politics of manipulation**. If we accept the Intentional Stance fully, we must treat Rachael as a full person. But the film shows she is *trapped*. Her desires are not hers; they are Tyrell's. To say she has genuine content is to validate her oppression. It ignores that her "beliefs" are weapons used to control her. The Intentional Stance risks smoothing over the fact that her agency is compromised by her design. It grants her freedom she structurally cannot have.

  ### 5. What the Film Adds to the Debate

  Pure philosophical argument often treats "history" as an abstract lineage. *Blade Runner* materializes history as a **commodity**.

  *   **Memory as Object:** The film shows memories can be photographed, implanted, and sold. This forces the debate to confront the **portability of content**. Teleosemantics assumes the history is tied to the organism. The film asks: If the history is detached and grafted, does the content travel with it? The film suggests **yes** (Rachael feels the pain of the memories), while teleosemantics must say **no** (the function is severed from the substrate).
  *   **The Phenomenology of the Artificial:** The film adds the dimension of **urgency**. The four-year lifespan creates a compression of meaning. Batty's content is *more* intense because it is fleeting. This challenges the teleosemantic idea that content needs long-term stabilization. The film argues that **mortality** (even engineered mortality) creates content faster than evolution does.
  *   **The Moral Stakes of Definition:** Finally, the film demonstrates that the definition of content is not just metaphysical; it is **lethal**. To define the replicants as contentless (the teleosemantic view) is to justify their execution ("retirement"). To define them as believers (the intentional stance) is to grant them rights. The film adds the argument that **whatever theory of content you choose, you will be responsible for the bodies.**

  ### Summary for Session Use

  *   **Teleosemantics:** Replicants are contentless. Their states are selected for obedience, not truth. Rachael's memories belong to the niece, not her. The 4-year limit prevents individual selection history from stabilizing.
  *   **Voight-Kampff:** It is a test for proper history. It fails because physiology can be calibrated without history.
  *   **Film's Stance:** Intentional Stance. Current functional organization + suffering = content.
  *   **The Clash:** Teleosemantics preserves the distinction between design and agency but at the cost of excluding suffering entities. The Film includes them but risks ignoring the manipulation inherent in their design.
  *   **The Contribution:** The film shows that "history" can be faked, making teleosemantics unverifiable, and raises the stakes: denying content is an act of violence.
