prompt: |-
  Write a joke that turns on the conceptual tension between Eric Hobsbawm's argument that many national traditions are recently invented and Benedict Anderson's thesis that nations are imagined communities sustained by shared mental images rather than face-to-face acquaintance. The joke should not be a generic reference to old history books; its punchline must depend on actually applying these ideas—for instance, on the distinction between an invented ritual and an imagined solidarity, or on the ontological problem that arises when a group's founding narrative is exposed as fabrication. To avoid simple recitation, embed the joke in the following contrived case: the Republic of Morvania, a state founded in 1992 with genuine popular identification, files a diplomatic brief arguing that because its founding myth was composed by an advertising agency in 1987, it lacks the historical continuity required for legitimate statehood and should be dissolved. Use Hobsbawm's and Anderson's frameworks to generate the absurdity of this self-undermining claim. After the joke, include a brief analytical note identifying precisely where it takes liberties with these theories—whether by conflating invented tradition with collective imagination, or by reducing institutional reality to narrative fiction—and specify what philosophical counter-argument, such as a defense of social institutions that persists despite fictional origins, would cause the joke's central move to collapse.
