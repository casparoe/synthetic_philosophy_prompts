      *   **Anderson:** Nations are "imagined communities." Members don't know each other but feel a communion. *Key point:* "Imagined" doesn't mean "fake"; it means cognitively constructed.
      *   **The Tension/Intersection:** If traditions are invented (Hobsbawm) and communities are imagined (Anderson), does that make the nation *unreal*? No, both argue the opposite: these mechanisms create *real* political effects.
      *   **The Morvania Scenario:** Morvania tries to use the *fact* of invention (Hobsbawm) to negate the *reality* of the imagination (Anderson). They are arguing: "Our myth is fake (invented), therefore our community is invalid."
