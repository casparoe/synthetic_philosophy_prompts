answer: |-
  ### The Requirements Specification

  You are building a filter for *methodological reliability*, not a truth machine. The tag "fringe" should mean "this claim does not meet the procedural standards of historical inquiry," not necessarily "this claim is false." Below is the requirements list derived from your constraints and the nature of historical evidence.

  **Legend:** **[NN]** = Non-Negotiable (System fails without this). **[P]** = Prejudice (One camp's preference, not a structural requirement).

  1.  **Procedural Decidability [NN]**
      *   **Requirement:** The rule must yield a binary output based solely on text available in the article and its direct links, interpretable by a literate non-specialist within two hours.
      *   **Reason:** Your operational constraint. If the rule requires knowing whether "groundwater contamination" is a plausible chemical explanation for C14 failure, it requires a specialist. If it requires a specialist, the volunteer system collapses.

  2.  **Methodological Symmetry [NN]**
      *   **Requirement:** The rule must apply the same criteria to a claim made by a tenured professor as to a claim made by an independent amateur.
      *   **Reason:** Authority is not evidence. History contains many examples of institutional consensus being wrong (e.g., the initial rejection of plate tectonics). The tag must track *how* the conclusion was reached, not *who* reached it.

  3.  **Defeasibility Specification [NN]**
      *   **Requirement:** The claim must specify what evidence would prove it wrong. If the proponents assert that no possible evidence could disprove the claim (or that all contrary evidence is inherently fake/contaminated by definition), the tag fires.
      *   **Reason:** Distinguishes historical hypothesis from belief system. If a claim is immune to counter-evidence, it cannot function as history.

  4.  **Explanatory Coverage [NN]**
      *   **Requirement:** The claim must provide an account for the evidence supporting the rival view, not merely dismiss it.
      *   **Reason:** Distinguishes "false-but-ordinary-error" from "pseudohistory." A honest mistake accepts the data but misinterprets it. A fringe claim often asserts the data itself is forged, contaminated, or irrelevant without independent verification.

  5.  **Claim/Data Separation [NN]**
      *   **Requirement:** The rule must allow tagging the *interpretation* as fringe without tagging the *primary data* as invalid.
      *   **Reason:** The "salvage case." A researcher might be wrong about Atlantis but right about the stratigraphy of a site. Tagging the whole article as fringe destroys the survey data. The tag must attach to the specific causal claim, not the asset.

  6.  **Political Utility Neutrality [P]**
      *   **Requirement:** (Proposed) Political or nation-building utility should not count as a marker of fringe status.
      *   **Reason:** Nationalist history can be rigorously argued and correct; internationalist history can be sloppy and wrong. Utility is orthogonal to method. Treating political motivation as a demarcation criterion is a prejudice of the "skeptical" camp that conflates motive with method.

  7.  **Consensus Independence [P]**
      *   **Requirement:** (Proposed) The rule must not rely on the percentage of experts who agree with the claim.
      *   **Reason:** This is the "Prejudice of the Outsiders." While ideally true, in practice, a generalist cannot assess "evidence quality" without using "expert consensus" as a proxy. Demanding total independence from consensus makes the rule undecidable for a generalist (see Conflict below).

  ---

  ### The Trilemma: Impossible Joint Satisfaction

  You asked to see where the requirements conflict. You cannot satisfy these three simultaneously:

  1.  **Decidability by Generalist**
  2.  **Sensitivity to Real Evidence (Epistemic Quality)**
  3.  **Symmetry between Insiders and Outsiders**

  **The Conflict:**
  To satisfy **Sensitivity**, the editor must judge the quality of the evidence (e.g., "Is the C14 contamination claim chemically plausible?"). A generalist cannot do this. To make it **Decidable**, the generalist must use a proxy for quality. The only available proxy is **Consensus** (e.g., "Was this published in a peer-reviewed journal?"). But relying on Consensus violates **Symmetry**, because it structurally disadvantages the outsider who may not have access to those journals or the social capital to publish there.

  **Resolution:**
  You must sacrifice pure **Symmetry** to save **Decidability** and **Sensitivity**. The rule must treat "publication in recognized venues" and "responsiveness to peer critique" as *methodological* markers, not sociological ones. An outsider who publishes their data and invites critique is treated the same as an insider. An insider who bypasses review and goes straight to press is treated the same as an outsider. The distinction is not status, but *process*.

  ---

  ### Evaluation of Proposed Rules

  **Priya's Double-Standard Test**
  *   **Verdict:** Fails Decidability [NN].
  *   **Reason:** It requires the editor to construct a hypothetical "mirror case" ("What if the mainstream believed this?"). This requires deep knowledge of how the mainstream treats similar evidence. It turns the editor into a sociologist. It is a good *check* for bias, but a bad *algorithm* for tagging.
  *   **Test Case:** Would mainstream archaeology accept tool marks as dating evidence if it fit their timeline? Yes. Would they accept C14 rejection based on "groundwater" without re-testing? Sometimes. The editor cannot know the threshold for "sometimes."

  **Marcus's Vindication Condition**
  *   **Verdict:** Passes Defeasibility [NN], Fails Decidability [NN] in edge cases.
  *   **Reason:** It correctly identifies that fringe claims often lack a "stop condition." However, fringe advocates are adept at saying, "If you let us dig, we could prove it." The rule needs to specify *who* performs the observation. If the vindication condition relies on the proponents themselves verifying it without oversight, it is weak.
  *   **Test Case:** The fringe group says, "If the Ministry let us re-date, it would vindicate us." This looks like a vindication condition, but it's a moveable goalpost (blaming the Ministry). The rule needs to add: "The observation must be achievable by a third party without the proponent's permission."

  **Sam's Replacement Rule**
  *   **Verdict:** Best Candidate. Meets Explanatory Coverage [NN] and Decidability [NN].
  *   **Reason:** It focuses on whether the new claim accounts for the old evidence. This is text-checkable. Did the article explain the pottery? Did it explain the C14?
  *   **Test Case:** The fringe claim *does* offer an account ("later use" for pottery, "contamination" for C14). Sam's rule might fail to fire here unless refined. It needs to add: "The account for the rival evidence must not rely on unverified assertions of fraud or suppression."

  ---

  ### Application to the Test Case (The Terraces)

  **The Scenario:**
  *   **Mainstream:** Pottery (1st mil BCE), C14 (consistent).
  *   **Fringe:** Tool marks (3rd mil BCE), C14 (rejected as contamination), Epic (myth), No Settlement (evidence of seafaring), Ministry (suppression).

  **Applying the Refined Requirements:**

  1.  **Decidability:** Can the editor check this? Yes. They can read the article to see if the C14 rejection was published or just asserted.
  2.  **Defeasibility:** The fringe claim asserts Ministry suppression prevents testing. This blocks third-party verification. **Flag.**
  3.  **Explanatory Coverage:** The fringe claim accounts for the pottery ("later use") and C14 ("contamination"). However, the "contamination" claim is asserted without independent lab reports linked in the article. **Flag.**
  4.  **Claim/Data Separation:** The survey of the terraces (measurements, photos) should remain untagged. The dating claim gets the tag.

  **Why existing rules bog down:**
  They bog down on the "contamination question." Your rule must not ask "Is it contaminated?" (Undecidable). It must ask "Is the contamination claim verified by a third party?" (Decidable). If the article says "We suspect contamination" but links no lab analysis, and instead links to a petition against the Ministry, the methodological standard is not met.

  ---

  ### The Single Requirement That Knocks Out Candidates

  **Procedural Decidability by Non-Specialist [NN]**

  This is the killer.
  *   It knocks out **Priya's Rule** (requires sociological imagination of the field).
  *   It knocks out pure **Evidence-Tracking** (requires technical knowledge to weigh evidence).
  *   It knocks out **Marcus's Rule** (unless strictly constrained to third-party verification).
  *   It forces you to reject **Political Utility** as a marker (hard to define objectively) and **Consensus** as a sole marker (violates symmetry).

  Most philosophical demarcation criteria (falsifiability, explanatory power, predictive success) assume the evaluator understands the science/history well enough to judge the *content*. You do not have that luxury. You are judging the *packaging and process* because you cannot judge the *product*.

  ### Final Recommendation for the Rule Logic

  Do not ask the editor to judge the history. Ask them to judge the **communication of the history.**

  **The Operational Rule:**
  Tag as Fringe if **ANY** of the following are true:
  1.  **Immunization:** The claim asserts that contrary evidence is inherently invalid (e.g., "all C14 is flawed," "all documents from this era are forgeries") without providing independent verification of that invalidity.
  2.  **Access Block:** The claim relies on evidence that is explicitly unavailable to third-party verification (e.g., "classified documents," "private collections," "suppressed by Ministry") and offers no public proxy.
  3.  **Asymmetric Burden:** The claim demands the mainstream disprove it, while offering no specifiable condition under which the proponents would accept they are wrong.
  4.  **Data/Theory Conflation:** The article presents primary data (measurements, surveys) as inseparable from the interpretive claim, making it impossible to credit the data without accepting the theory.

  **Why this works for your case:**
  In the Terrace Case, the fringe group claims C14 is contaminated (Immunization) and the Ministry blocks re-testing (Access Block). The editor does not need to know if the C14 *is* contaminated. They only need to see that the claim of contamination is not independently verified and that verification is blocked. This satisfies Decidability. It satisfies Symmetry (an Insider who claimed suppression without proof would also be tagged). It satisfies Evidence-Sensitivity (by enforcing the standard that evidence must be shareable).

  **On the "Prejudice" Candidates:**
  *   **Decidability:** Non-negotiable. Without it, you have no system.
  *   **Track Evidence:** Non-negotiable in intent, but must be implemented via *process proxies* (verification, access) not content judgment.
  *   **Political Utility:** Prejudice. Exclude it. It introduces noise without increasing signal on methodological reliability.

  **The Conflict Summary:**
  You are building a spam filter for history. You cannot detect spam by reading the essay for truth; you detect it by looking at the headers, the links, and the refusal to accept bounce-backs. Use the process, not the content.
