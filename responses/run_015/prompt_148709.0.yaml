prompt: |-
  I maintain the backend for an open history reference project — volunteer work, on the side of a normal engineering job — and I've inherited the job of rewriting the rule our editors use to decide whether a claim gets tagged as fringe. The tag matters more than it sounds: it changes where the article ranks in search, and our corpus gets pulled into retrieval and fine-tuning pipelines, so a bad rule doesn't just mislabel a page, it launders nonsense into other people's systems. I have no philosophy training, and the arguments on our mailing list have convinced me that the disagreements are almost never about the evidence for Atlantis or ancient-astronaut explanations of monumental architecture or Fomenko's rebuild of the whole chronology; they are about what sort of thing a demarcation rule is even supposed to be. So before I let the list argue further I want a specification, and I want it written for a fixed purpose: the rule has to be applicable by a generalist editor, working from an article and whatever is linked from it, without resolving the underlying historical question and without specialist consultation. Both errors cost something real — tagging a responsible-but-heterodox hypothesis suppresses work that might be right, and failing to tag a confident fabrication gives it our house style — so please keep that purpose in view when you decide what counts as a requirement.

  What I want is the requirements list: the cases any adequate rule has to get right, the distinctions it must not collapse, the results from how historical inquiry actually works that it can't contradict, and the reason behind each. The distinctions I keep tripping over, to get you started but please don't limit yourself to them: false-but-ordinary-error versus pseudohistory; a heterodox hypothesis argued inside the discipline versus one argued from outside it; a bad method that landed on a true date versus a good method that landed on a false one; a claim that is protected by cheap auxiliary hypotheses every time it is pressed versus one that is genuinely untestable in principle; and tagging a whole research program versus saying whether anything inside it is still worth crediting — the salvage case, where someone chasing a lost continent nonetheless produces the only careful survey of a site anyone has. Flag for each requirement whether it is non-negotiable or a prejudice of one camp; I strongly suspect some of the things people demand are just preferences wearing argumentative clothing, and in particular I want your view on three candidates: that the rule must be decidable by a non-specialist in an afternoon, that it must track evidence rather than who believes what, and that political or nation-building utility counts as a marker at all. If some subset of the requirements can't be jointly satisfied — say, decidability by a generalist, sensitivity to real evidence, and symmetry between insiders and outsiders — say so explicitly and show me the conflict; that is the part I most want to see. And tell me which single requirement knocks out the most candidate rules.

  Three rules have been proposed on the list and I'd rather you judged them as candidate requirements than as theories, since I can't tell which is which. Priya's Double-Standard Test: build the mirror case, with the same evidence structure but believed by the right people, and if your rule stops firing it was only ever sociology. Marcus's Vindication Condition: there must be a specifiable set of observations that would get a tagged claim untagged, and it must not be empty. Sam's Replacement Rule: a claim counts as fringe only when it discards an established finding while offering no account of why the accepted evidence looks the way it does. Test them, and the requirements generally, against a case I made up for the purpose: a set of dressed stone terraces on an inland hillside, dated by mainstream archaeology to the first millennium BCE from pottery in the upper layers, which a group instead attributes to a seafaring culture two thousand years earlier, on the grounds that the tool marks on the lower courses look like metal tools; that the deep radiocarbon samples came back too old and were discarded as groundwater contamination; that a local flood epic mentions stone steps to the water at that spot; that no settlement of the right date exists nearby, which they read as evidence the builders came from elsewhere; and that the heritage ministry has refused permission to re-date, which they present as suppression. Every rule I try either flags it for reasons that would also flag a contested ordinary dig, or bogs down on the contamination question, which neither I nor the rule is competent to settle. Please don't give me citations, a reading list, or a survey of the literature — I can't chase references and neither can the system I'll run this on, so argue from the cases themselves. If one of these three is just a restatement of something with a name in the philosophy of science, tell me in one line and move on; keep any scoring of existing proposals to a few lines, because the criteria are the deliverable.
reasoning: |-
  Here's a thinking process that leads to the suggested requirements list and analysis:

  1.  **Analyze the Request:**

      *   **Context:** Backend maintainer for an open history reference project (volunteer work).
      *   **Task:** Rewrite the rule for tagging claims as "fringe."
      *   **Stakes:** High. Affects search ranking, retrieval pipelines, fine-tuning. Bad rules launder nonsense or suppress valid heterodoxy.
      *   **Constraints:**
          *   Rule must be applicable by a *generalist editor* (non-specialist).
          *   Must work from the article + links (no external specialist consultation).
          *   Must *not* resolve the underlying historical question.
          *   No philosophy training assumed (user).
          *   No citations/reading lists (user can't chase them).
          *   Focus on requirements, not just theory.
          *   Specific distinctions to address: False-vs-ordinary error, insider-vs-outsider, bad-method/true-result vs good-method/false-result, auxiliary hypotheses vs untestable, whole program vs salvageable parts.
          *   Specific candidates to evaluate: Decidability by non-specialist, track evidence not believers, political utility as marker.
          *   Specific proposed rules to test: Priya's Double-Standard, Marcus's Vindication, Sam's Replacement.
          *   Specific Test Case: Inland terraces, mainstream (1st millennium BCE, pottery), fringe (seafaring, 2000 years earlier, tool marks, rejected C14 as contamination, flood epic, no nearby settlement, ministry suppression).
          *   **Crucial:** Identify conflicts between requirements (trade-offs). Identify the single requirement that knocks out the most candidate rules.
          *   **Format:** Requirements list with "Non-negotiable" vs "Prejudice" flags. Analysis of the three proposed rules. Analysis of the test case.

  2.  **Deconstruct the Core Problem:**

      *   The user is asking for a *demarcation criterion* (philosophy of science term, though they say no training) operationalized for *content moderation* in a specific domain (history).
      *   The tension is between *epistemic quality* (is this true/well-supported?) and *procedural feasibility* (can a volunteer decide this quickly without being an expert?).
      *   The "Fringe" tag is not just "False." It implies a specific *mode* of failure (pseudohistory, conspiracy, methodological breakdown) distinct from simple error or legitimate debate.

  3.  **Drafting the Requirements List:**

      *   *Requirement 1: Procedural Decidability.* Can a generalist apply it?
          *   Status: Non-negotiable (given the prompt's constraints).
          *   Reason: If it requires specialist knowledge, the system fails its operational constraints.
      *   *Requirement 2: Evidence-Tracking vs. Consensus-Tracking.* Does it look at *how* the claim is supported, or *who* supports it?
          *   Status: Non-negotiable (for integrity), but hard to implement.
          *   Reason: "Consensus" can be wrong or politicized. "Evidence" is hard for generalists to judge.
      *   *Requirement 3: Falsifiability/Defeasibility.* Can the claim be proven wrong?
          *   Status: Non-negotiable.
          *   Reason: If nothing counts against it, it's not history.
      *   *Requirement 4: Explanatory Scope.* Does it account for the evidence the rival theory explains?
          *   Status: Non-negotiable.
          *   Reason: Ignoring counter-evidence is a hallmark of pseudohistory.
      *   *Requirement 5: Separation of Claim and Source.* Can we tag the claim without tagging the person?
          *   Status: Non-negotiable.
          *   Reason: Avoids ad hominem; allows for "salvage" cases (good data, bad theory).
      *   *Requirement 6: Political Utility.* Does nation-building make it fringe?
          *   Status: Prejudice (of the skeptics).
          *   Reason: Nationalist history can be right or wrong. Utility $\neq$ Truth value.
      *   *Requirement 7: Symmetry (Insider/Outsider).*
          *   Status: Non-negotiable (in principle), Prejudice (in practice).
          *   Reason: Ideally, method matters more than affiliation. But insiders have access to data outsiders don't.

  4.  **Analyzing the Conflicts (The "Trade-off" Section):**

      *   *The Trilemma:* Decidability (Generalist) + Sensitivity (Real Evidence) + Symmetry (Insider/Outsider).
      *   *Conflict:* A generalist cannot evaluate "Real Evidence" in history without relying on "Consensus" (Insider status). If they ignore Consensus to ensure Symmetry, they can't judge Evidence. If they rely on Consensus for Decidability, they violate Symmetry.
      *   *Resolution:* You have to prioritize Decidability and Evidence-Proxy (Consensus *of method*, not just conclusion) over pure Symmetry.

  5.  **Evaluating the Three Proposed Rules:**

      *   *Priya's Double-Standard Test:* (Mirror case).
          *   Pros: Catches bias.
          *   Cons: Hard for a generalist to construct the "mirror case" without knowing the field. Subjective.
          *   Verdict: Good heuristic, bad algorithm.
      *   *Marcus's Vindication Condition:* (Specifiable observations to untag).
          *   Pros: Hits the "untestable" issue.
          *   Cons: "Contamination" in the test case makes this tricky. Fringe advocates always say "If you dug here, you'd see."
          *   Verdict: Strong, but needs refinement on *who* does the observing.
      *   *Sam's Replacement Rule:* (Discards finding + no account of accepted evidence).
          *   Pros: Hits the "ignoring counter-evidence" issue.
          *   Cons: "No account" is vague. They *always* offer an account (e.g., "contamination").
          *   Verdict: Closest to operationalizable, but needs to define "account."

  6.  **Applying to the Test Case (The Terraces):**

      *   *Mainstream:* Pottery (upper), C14 (deep, accepted).
      *   *Fringe:* Tool marks (metal?), C14 (rejected as contamination), Epic (myth), No settlement (evidence of seafaring), Ministry (suppression).
      *   *Application:*
          *   Priya: Would mainstream reject metal tools if found in 1st millennium? No. But would they reject C14 if it contradicted pottery? Yes, usually investigate contamination. Hard to mirror.
          *   Marcus: What un-tags it? Finding metal tools from 3rd millennium BCE? Finding settlement? The rule fires if they say "Ministry won't let us test."
          *   Sam: Do they discard the pottery date? Yes. Do they account for it? Yes ("later use" or "contamination"). Do they account for the C14? Yes ("groundwater").
          *   *The Crux:* The "Contamination" claim. This is the standard escape hatch. A rule must distinguish *plausible* methodological critique from *ad hoc* rescue.

  7.  **Refining the "Single Requirement" that kills candidates:**

      *   It's **Decidability by Non-Specialist**.
      *   Why? Because almost all epistemic criteria (is the method sound? is the contamination claim valid?) require specialist knowledge. To make it decidable, you have to rely on *proxies* (publication venue, response from community), which reintroduces the sociological elements Priya hates.

  8.  **Structuring the Output:**

      *   **Introduction:** Acknowledge the stakes and the trilemma.
      *   **The Requirements List:** Categorized by Non-Negotiable vs. Prejudice.
      *   **The Conflict (Trilemma):** Explicitly state the impossibility of satisfying all three (Decidability, Evidence-Sensitivity, Symmetry).
      *   **Evaluation of Proposed Rules:** Priya, Marcus, Sam against the requirements and the Test Case.
      *   **The "Killer" Requirement:** Identify Decidability.
      *   **Recommendation/Specification:** A synthesized approach based on the analysis.

  9.  **Self-Correction/Refinement during drafting:**

      *   *Check:* Did I avoid citations? Yes.
      *   *Check:* Did I address the three specific candidates (Decidability, Evidence, Politics)? Yes.
      *   *Check:* Did I handle the Test Case specifically? Yes.
      *   *Check:* Is the tone appropriate? (Engineering/Spec focused, not philosophical musing).
      *   *Refinement on "Politics":* Be careful not to say politics *never* matters, but that it's a bad *demarcation* criterion for truth.
      *   *Refinement on "Salvage":* Ensure the rule allows tagging the *claim* as fringe without deleting the *data* (e.g., the survey of the site).
      *   *Refinement on Marcus's Rule:* The "Contamination" issue is key. If they claim contamination, is there a vindication condition? "If independent lab confirms contamination." If they refuse independent lab, rule fires.

  10. **Final Polish:** Ensure the distinction between "Fringe" (methodological failure) and "False" (empirical failure) is clear, as that's the core of the user's problem. "Fringe" means "not trustworthy enough to build on," not necessarily "wrong."

  *(Self-Correction on the "Single Requirement"):* I need to be precise. Is it Decidability? Or is it the requirement that the rule must not resolve the underlying historical question? Actually, the prompt asks "which single requirement knocks out the most candidate rules." I think it's **Decidability by Non-Specialist**. Most philosophical demarcation criteria (falsifiability, explanatory power) require expert judgment to apply correctly.

  *(Self-Correction on the Test Case):* The test case hinges on the C14 rejection. Mainstream says "Groundwater." Fringe says "Suppression/Contamination." A generalist can't judge chemistry. So the rule must look at *process*. Did they publish the rejection? Did they offer a sample for re-testing?

  *(Final Plan):*
  1. Requirements List (NN vs Prejudice).
  2. The Trilemma (Decidability, Evidence, Symmetry).
  3. Rule Evaluation (Priya, Marcus, Sam).
  4. Test Case Application.
  5. The Killer Requirement.
  6. Closing advice.

