prompt: |-
  Please defend the view that promises bind not primarily because they generate legitimate expectations or because breaking them causes harm, but because they enact a temporary jurisdictional transfer: in promising, the promisor places a specific domain of her practical reasoning under the promisee's normative authority. Breaking the promise is then structurally analogous to a legislature revoking its own enacted statute—except that the revocation is self-undermining, since the promisor remains both legislator and subject. Explain how this delegated-authority account handles promises unknown to the promisee, addresses the objection that it overstates personal autonomy, and distinguishes promise-breaking from mere change of mind in cases where no harm or disappointed expectation is present.
reasoning: |-
  Here's a thinking process that leads to the essay defending the "delegated-authority" account of promises:

  1.  **Deconstruct the Prompt:**

      *   **Core Thesis:** Promises bind not primarily due to expectations (reliance) or harm (consequentialism), but because they enact a *temporary jurisdictional transfer*. The promisor places a domain of practical reasoning under the promisee's normative authority.
      *   **Analogy:** Breaking a promise is like a legislature revoking its own statute, but self-undermining because the promisor is both legislator (of the promise) and subject (bound by it).
      *   **Required Explanations:**
          1.  How does this account handle *promises unknown to the promisee* (e.g., deathbed promises, secret promises)?
          2.  How does it address the objection that it *overstates personal autonomy* (i.e., can we really give away our moral freedom)?
          3.  How does it distinguish *promise-breaking from mere change of mind* in cases where no harm/expectation exists?

  2.  **Initial Brainstorming & Theoretical Grounding:**

      *   *Traditional Views:*
          *   Reliance/Expectation (Scanlon, Shiffrin): Promises create expectations; breaking them betrays trust.
          *   Harm/Consequentialism: Breaking promises causes bad outcomes.
          *   Will Theory (Kant, Hume, Raz): Promises are exercises of will. The prompt leans heavily into a specific version of the Will Theory, reminiscent of H.L.A. Hart's "choice theory" or Joseph Raz's "authority" concepts, but with a specific "jurisdictional" twist.
      *   *The "Jurisdictional Transfer" Metaphor:* This is political philosophy applied to ethics. It suggests a micro-sovereignty. When I promise, I say, "You now have the right to decide this matter for me."
      *   *The Legislature Analogy:* A legislature passes a law. It binds the citizens. Can it repeal it? Yes, but usually with procedure. If an individual tries to repeal a law *on themselves* instantly without cause, it undermines the rule of law. In promising, the promisor makes themselves subject to the promisee's authority regarding that act. To break it is to claim authority one just surrendered.

  3.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   State the thesis clearly.
          *   Contrast with reliance/harm theories.
          *   Introduce the "jurisdictional transfer" concept.
          *   Roadmap the three required defenses.

      *   **Core Argument: The Nature of the Transfer:**
          *   Explain the mechanism. It's not about psychology (expectations) but normative status (authority).
          *   Use the legislature analogy. The promisor creates a "local law" where the promisee is the sovereign over that specific action.
          *   Why breaking is wrong: It's a usurpation of authority, not just a disappointment.

      *   **Challenge 1: Promises Unknown to the Promisee:**
          *   *Problem:* If authority is transferred to the *promisee*, how can they have authority if they don't know? (e.g., promising a dying person who is unconscious, or a secret vow).
          *   *Solution:* Distinguish between *holding* authority and *exercising* authority. The transfer creates a normative status even if not actualized cognitively. It's like being granted citizenship while asleep. You have the status even if you don't know it yet.
          *   *Refinement:* The authority is "in trust." The promisee *could* release the promisor, but until they do (or know they can), the bind exists. The obligation is to the *status* of the promisee as authority-holder, not their psychological state.

      *   **Challenge 2: Overstating Autonomy (The Paradox of Self-Binding):**
          *   *Objection:* How can I be free if I bind myself? Isn't this slavery? If I can bind myself, can I bind myself to do immoral things?
          *   *Response:* Autonomy isn't just "doing what I want now"; it's "governing myself over time." This is *constitutive* autonomy. By transferring jurisdiction, I exercise autonomy to limit future autonomy.
          *   *Limits:* The jurisdiction is limited (specific domain, not total slavery) and conditional (cannot override fundamental moral duties). The "legislature" cannot pass unconstitutional laws.
          *   *The "Self-Undermining" point:* If I revoke the promise unilaterally, I contradict the initial act of will. I am claiming I *didn't* transfer authority while simultaneously having transferred it.

      *   **Challenge 3: Change of Mind vs. Promise-Breaking (No Harm/Expectation):**
          *   *Scenario:* I promise to meet you. You forget. I don't show up. No harm, no disappointment.
          *   *Reliance View:* Hard to explain why this is wrong.
          *   *Jurisdictional View:* It's clearly wrong. Why? Because I acted outside my jurisdiction. I no longer had the right to decide that action; *you* did.
          *   *Distinction:* A "change of mind" is valid in domains where I retain jurisdiction. In promised domains, my "mind" is no longer the sole sovereign. Breaking the promise is an ultra vires act (beyond powers).

      *   **Conclusion:**
          *   Summarize the strengths.
          *   Reiterate that this preserves the deontic force of promises without relying on contingent psychological states.
          *   Final thought on the dignity of promising as an act of normative engineering.

  4.  **Review and Refine:**

      *   *Tone:* Philosophical, rigorous, persuasive.
      *   *Check:* Did I use the legislature analogy effectively? Yes.
      *   *Check:* Did I address the "unknown promisee" case? Yes, need to ensure the distinction between *possession* of rights and *awareness* of rights is clear.
      *   *Check:* Did I address the autonomy objection? Yes, focus on the distinction between autonomy as impulse vs. autonomy as normative planning.
      *   *Check:* Did I distinguish change of mind? Yes, focus on *jurisdiction* vs. *preference*.

  5.  **Self-Correction during drafting:**
      *   *Critique:* The legislature analogy might be confusing if pushed too far. Legislatures *can* repeal laws.
      *   *Fix:* Emphasize the "self-undermining" aspect. A legislature can repeal a law, but it cannot repeal the *authority of the law* while claiming to be bound by the rule of law. In promising, the promisor binds themselves *to the promisee*. To break it is to say "I am bound to you" and "I am not bound to you" simultaneously. It's a performative contradiction.
      *   *Refinement on Unknown Promises:* Make sure to mention that the promisee acquires a *right of release*. Even if they don't know it, the power exists. The promisor cannot unilaterally cancel that power.

  6.  **Final Polish:** Check transitions and ensure the voice is consistent. (Proceed to generate output based on these thoughts.)
answer: |-
  The dominant theories of promissory obligation generally fall into two camps: the reliance view, which grounds obligation in the expectations generated in the promisee, and the consequentialist view, which grounds it in the harm caused by disappointment. Both, however, struggle to explain the intuitive wrongness of breaking a promise when no reliance has occurred and no tangible harm results. To capture the distinctively *normative* force of a promise, we must look beyond psychological states and outcomes to the structure of the act itself.

  The most robust defense of promissory obligation is the **delegated-authority account**. On this view, to promise is not merely to predict one's behavior or invite trust; it is to enact a temporary jurisdictional transfer. In making a promise, the promisor places a specific domain of her practical reasoning under the normative authority of the promisee. Breaking a promise is therefore not primarily a betrayal of trust or a cause of harm, but a usurpation of authority. It is structurally analogous to a legislature revoking its own enacted statute without due process: the promisor attempts to act as a sovereign in a domain where she has temporarily surrendered sovereignty.

  This account preserves the deontic force of promises, explains their binding nature in the absence of harm, and resolves paradoxes regarding autonomy and unknown promises.

  ### I. The Structure of Jurisdictional Transfer

  The core of the delegated-authority account is that promising is a speech act that alters normative relationships. When I promise to $\phi$, I do not merely say "I will $\phi$." I say, "Regarding the act of $\phi$-ing, you now have the authority to determine my will."

  Consider the legislative analogy. A legislature passes a statute. That statute binds the citizens. Can the legislature later repeal the statute? Yes, but it must do so *as a legislature*, following established procedures. It cannot simply ignore the statute while claiming the statute is valid. In the case of promising, the promisor is both the legislator (the one who creates the obligation) and the subject (the one bound by it). However, by promising, the promisor elevates the promisee to a position of micro-sovereignty over that specific act.

  When the promisor breaks the promise, she acts as though she retains exclusive jurisdiction over the act. But she does not. She has transferred that jurisdiction. Therefore, breaking the promise is a performative contradiction. It is an attempt to exercise an authority (the right to decide whether to $\phi$) that one has explicitly alienated. The wrong is not that the promisee is hurt; the wrong is that the promisor has acted *ultra vires*—beyond her powers.

  ### II. The Problem of Unknown Promises

  A significant challenge for any will-based theory is the case of the unknown promise. If I promise my unconscious, dying friend to care for his cat, he never forms an expectation. He cannot rely on me. If obligation rests on expectation, no obligation exists. If obligation rests on the promisee's authority, how can he have authority he doesn't know he possesses?

  The delegated-authority account handles this by distinguishing between the *possession* of normative power and the *exercise* or *awareness* of it. Normative statuses do not require cognitive acknowledgment to exist. A person can own property while asleep; a citizen can possess rights while unaware of them. Similarly, when I promise the unconscious friend, I transfer the jurisdiction over the cat's care to him. He holds the authority, even if he cannot currently exercise it.

  Crucially, this transfer includes the **power of release**. By promising, I give the promisee the right to waive the obligation. In the case of the unconscious friend, he holds this power in trust. If he wakes up, he may release me. If he dies, the authority may lapse or transfer to an heir, depending on the nature of the vow. But until the authority is validly waived or lapses, I remain bound. My obligation is not to his psychological state (his expectation), but to his normative status as the holder of jurisdiction over my action. To break the promise is to ignore his standing as the authority-holder, regardless of his awareness.

  ### III. The Objection of Overstated Autonomy

  Critics often argue that the delegated-authority account relies on a magical conception of autonomy. How can I bind my future self? If I am truly autonomous, should I not be free to change my mind? To suggest I can alienate my future will seems to border on voluntary servitude, which is morally impermissible.

  This objection conflates autonomy with *caprice*. True autonomy is not the freedom to do whatever one wants at any given moment; it is the capacity to govern oneself over time. The power to promise is a higher-order exercise of autonomy. It is the ability to create stable normative structures that survive changes in desire. By promising, I exercise my autonomy to limit my future options, thereby securing a form of agency that is resilient against future weakness of will.

  Furthermore, the jurisdictional transfer is not total. It is not slavery because it is **domain-specific** and **revocable by the promisee**. I do not surrender my general moral agency; I surrender jurisdiction over a specific act. Moreover, just as a legislature cannot pass unconstitutional laws, a promisor cannot transfer authority over immoral acts. I cannot promise to commit a crime, because I do not possess the jurisdiction to commit crimes in the first place; thus, I cannot transfer that authority to another.

  The "self-undermining" nature of breaking the promise addresses the autonomy concern directly. If I could unilaterally revoke the promise at will, the initial act would have been meaningless. It would be like a legislature passing a law that says, "This law is binding unless I decide it isn't." That is not a law; it is a suggestion. To preserve the integrity of the initial autonomous act (the promise), the subsequent act (the breaking) must be recognized as a violation of the normative structure created. I am not a slave to the promise; I am a citizen of the normative order I helped create. To break it is to stage a coup against my own legitimate government.

  ### IV. Distinguishing Promise-Breaking from Change of Mind

  The greatest strength of the delegated-authority account is its ability to distinguish promise-breaking from a mere change of mind in "harmless" cases.

  Imagine I promise to meet you for coffee. You forget the meeting, so you have no expectation. I stay home, causing you no harm and disappointing no expectation.
  *   **The Reliance View:** Struggles here. If you didn't rely on me, and weren't disappointed, what wrong was committed? It risks reducing the obligation to a contingent psychological fact.
  *   **The Jurisdictional View:** The wrong is clear and objective. Before the promise, the decision to go to the coffee shop was within my exclusive jurisdiction. I could change my mind freely. After the promise, jurisdiction over that decision was transferred to you.

  When I stay home, I am not merely changing my mind; I am adjudicating a matter that is no longer mine to decide. I have acted as a judge in a case where I recused myself. A "change of mind" is a valid exercise of autonomy within one's own jurisdiction. "Promise-breaking" is an invalid exercise of autonomy within another's jurisdiction.

  This explains why we feel a residual guilt even when the promisee is unaware. We recognize that we acted outside our authority. The obligation is *in rem* (attached to the status of the act) rather than *in personam* (attached solely to the person's feelings). The promisee *could* have relied; they *could* have exercised their authority to demand performance. By breaking the promise, I destroyed the possibility of that authority being exercised. I treated a domain of shared normative governance as if it were my private property.

  ### Conclusion

  The delegated-authority account rescues the concept of promising from the vagaries of psychology and consequence. By viewing the promise as a temporary transfer of jurisdiction, we understand that the bond is not created by the promisee's hope, but by the promisor's surrender of sovereignty over a specific act.

  This view elegantly handles unknown promises by recognizing that authority can be held without awareness; it defends autonomy by framing self-binding as a higher-order exercise of self-governance; and it sharply distinguishes breaking a promise from changing one's mind by locating the wrong in the usurpation of authority rather than the production of harm. Ultimately, to promise is to legislate a micro-reality where another person holds the veto. To break that promise is not just to disappoint; it is to dissolve the very normative ground upon which one stands.
