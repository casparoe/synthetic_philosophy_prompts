          *   *Draft:* How do you calculate branching ratios?
          *   *Refinement:* Ask about the reference class problem. What is the sample size for "nations at institutional nodes"?
          *   *Follow-up:* If she appeals to theory, ask if the theory is derived from the very data it explains (circularity).

      *   *Q3: The Coal Geography Claim.* She relies on this for stability.
          *   *Draft:* Is coal really that important?
          *   *Refinement:* Connect coal to the "necessity" claim. If coal is the constraint, does that make human agency irrelevant at those nodes?
          *   *Follow-up:* Press on whether geological determinism is just another form of essentialism.

      *   *Q4: The Japan Question (Required).*
          *   *Draft:* What about Japan? They industrialized too.
          *   *Refinement:* Japan is a "partial divergence." Does your model predict Japan's path? If not, does it break the branching ratio?
          *   *Follow-up:* If she says Japan is an outlier, ask if "outlier" is just code for "falsification."

      *   *Q5: The Scientific Revolution Node (Required).*
          *   *Draft:* Was the Scientific Revolution necessary?
          *   *Refinement:* What evidence would shift your credence on whether the Scientific Revolution was a *necessary* node vs. contingent?
          *   *Follow-up:* If she says "new archival data," ask if that data isn't already interpreted through the lens of the Scientific Revolution's importance.

      *   *Q6: Institutional Nodes Definition.*
          *   *Draft:* How do you define a node?
