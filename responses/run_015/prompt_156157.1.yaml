  2.  **Deconstruct the Philosopher's Position:**
      *   *Core Mechanism:* Counterfactual branching ratios. This implies a probabilistic or modal logic approach to history. At certain "nodes" (decision points, institutional changes), the probability of path A vs. path B shifts.
      *   *Defense:* "Structural, not evaluative." She claims she isn't saying Britain is *better*, just that the structural probability of industrialization was higher there due to specific constraints (like coal).
      *   *Specific Claim:* China's coal geography creates "modal stability" (it was hard for China to industrialize regardless of culture), making Britain the unique outlier.
      *   *Vulnerability:*
          *   Selection bias (why start the clock where she does?).
          *   Definition of "nodes" (who decides what counts as an institutional node?).
          *   The Japan problem (Japan industrialized without British coal/institutions initially).
          *   The "Structural vs. Evaluative" shield (often hides normative assumptions about what counts as "development").
          *   Modal Stability (how do we measure probability in single-case history?).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1: The "Structural vs. Evaluative" Shield.* Need to hit this early.
