answer: |-
  | Tax Frame | Prioritarian Frame |
  | :--- | :--- |
  | Pre-tax income | Raw well-being levels |
  | Marginal rate schedule | Priority weighting function (concave transform) |
  | Marginal rate itself | Moral weight of additional well-being |
  | Post-tax income | Priority-weighted well-being (moral value) |
  | Total revenue | Total moral value of the distribution |
  | Legislature | Moral theorist setting the weighting principle |
  | Behavioral response | Motivational impact (usually assumed null) |
  | **Leveling Down** | **State burning revenue** (unless schedule is dispersion-indexed) |

  Your suspicion regarding the leveling-down objection (LDO) is correct. In the standard tax analogy, the state maximizes total revenue (moral value). Destroying income (well-being) without redistributing it reduces total revenue. Thus, the frame registers leveling down as a pure loss, mirroring prioritarianism's rejection of the practice. To represent the egalitarian claim—that leveling down has *some* value in virtue of increased equality—the analogy requires a schedule where rates are indexed to dispersion (e.g., a Gini coefficient). Without this, the tax frame lacks the resources to represent telic equality; it can only register efficiency losses. The closest analogue to the egalitarian's valuation of leveling down is indeed the state burning money to satisfy a separate equality constraint, which standard prioritarianism explicitly rejects.

  The disanalogies between tax schedules and priority weights bear heavily on your colleague's first conclusion: that there is no substantive moral disagreement, only a calibration dispute. This fails because the diminishing marginal utility of money is an empirical claim about psychology and consumption, whereas the diminishing marginal moral weight of well-being is a normative stipulation. A tax schedule can be audited against behavioral data; a priority function is checked only against moral intuition. Furthermore, treating the weighting function as mere "bookkeeping" ignores that tax schedules are themselves instruments of justice, not neutral scaling conventions. Nobody regards a progressive tax code as morally inert; it embodies a specific view of fairness. If the tax schedule is not mere bookkeeping, the priority transform cannot be dismissed as such either. This cuts against her claim that the disagreement is merely semantic. The analogy actually undermines her first conclusion by showing that even in economics, the schedule embodies a substantive view of distributive justice, not just a measurement convention.

  Regarding her second conclusion—that prioritarianism's immunity to LDO is dialectically cheap because it drops the claim that equality matters—you are right to identify separability and monotonicity as the mechanical drivers. Any strictly increasing separable function rejects leveling down; concavity is required only to favor the worse off, not to block leveling down. The tax analogy supports her structural point: a standard schedule maximizes total post-tax income and ignores equality for its own sake. However, calling this escape "cheap" mischaracterizes the theoretical cost. Prioritarianism avoids LDO not to dodge a bullet, but to maintain person-separability and avoid the intransitivity problems of telic egalitarianism. The analogy shows *how* the immunity is achieved (aggregation), but it does not prove the immunity is unearned. The charge is aimed at the right feature (separability), but the normative weight of that feature is heavier than the analogy suggests. The immunity is a byproduct of a commitment to non-relational value, which is a substantive moral stance, not a dialectical trick.

  Your variable-schedule variant requires stress-testing. You propose indexing the concavity exponent to dispersion: steeper when spread widens, flatter when it closes. Your arithmetic indicates $V(1,10) \approx 2.52$ and $V(1,6) \approx 2.67$. If leveling down from 10 to 6 increases total value, the variant *favors* leveling down. Consequently, it **does not escape** the leveling-down objection; it succumbs to it. Furthermore, you note $V(1,11) \approx 2.49$. Here, a Pareto improvement (increasing the top value) lowers the total value because the increased dispersion steepens the schedule enough to penalize the gain. This violates the Pareto principle. Because the weighting function depends on the relational spread of the distribution rather than individual levels alone, this view is non-separable. It is not prioritarianism; it is egalitarianism with priority weighting doing the work of a relational term. Regarding the analogy: standard tax schedules are pointwise and separable (rates depend on individual income brackets). Your variant requires a dynamic code where rates change based on national inequality. This falls outside the colleague's static analogy. It does not refute the analogy's application to standard prioritarianism, but it demonstrates that once you introduce relational sensitivity to escape LDO, you leave the tax frame entirely.

  If the tax-schedule analogy is insufficient, a better one is a handicap racing system. In handicapping, weights are added to faster cars to equalize finishing times. This captures the relational aspect missing from the tax frame. However, for standard prioritarianism, the tax analogy remains useful for illustrating separability and aggregation, provided one acknowledges the normative weight of the schedule. It fails only when pressed to explain why the schedule isn't mere bookkeeping or how it might value equality intrinsically. For your purposes, the analogy is right about the structure (separability blocks LDO) but wrong about the substance (normative vs. empirical). It carries her conclusion that the immunity is structural, but fails to support the claim that this makes the view morally shallow.

  Variant: DOES-NOT-ESCAPE
  Verdict: HOLDS-PARTIALLY
