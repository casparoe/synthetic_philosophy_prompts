      *   *Leveling Down:* In tax terms, this is tricky. If the goal is maximizing revenue (total moral value), leveling down (destroying utility of the better off without helping the worse off) reduces total revenue. The colleague claims prioritarianism escapes LDO because it doesn't value equality *per se*. In the tax analogy, "equality" isn't a goal of the tax schedule itself unless the schedule is indexed to dispersion.
      *   *Egalitarian Claim:* To represent egalitarianism (where leveling down has *some* value), the tax analogy needs a goal function that includes equality (e.g., minimizing Gini) alongside revenue. A standard progressive tax maximizes revenue/utility given constraints; it doesn't value burning money to reduce inequality unless the "state" values inequality reduction independently.
