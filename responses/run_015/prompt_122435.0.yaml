answer: |-
  **Meridian Global Mobility — Norms Onboarding, v4.2**
  **Owner:** Global Compliance & Relocation
  **Status:** Live
  **Severity:** P2 (Behavioral Integrity)

  **1.0 Purpose**
  This document defines the Normative Local Protocols (NLP) applicable to all Transient Resource Units (TRUs) deployed to non-home regions. NLPs are not merely etiquette; they are consensus mechanisms maintaining social stack stability. Deviation introduces Convention Debt (CD), requiring downstream remediation by persistent nodes (locals). TRUs are bound by NLPs to prevent free-riding on established coordination equilibria.

  **2.0 Normative Classification**
  NLPs are categorized by enforcement layer. Violations are logged via Ticket Type `NLP-VIO`.

  *   **Type A (Coordination):** Queueing, elevator etiquette. Violation breaks reliance chains. If a TRU bypasses a queue, downstream agents who planned around serialized access incur latency. This is a fairness violation.
  *   **Type B (Economic):** Tipping, surcharge customs. These are voluntary surcharge protocols sustaining service availability. Opting out consumes labor without compensating the maintenance cost of the equilibrium.
  *   **Type C (Hybrid):** Jaywalking, noise levels. These overlap with statutory law. Where local statute conflicts with local norm (e.g., legal to cross, normatively prohibited), the NLP takes precedence to maintain social cohesion. Statutory compliance does not exempt TRUs from CD accumulation.

  **3.0 Visitor Status Determination**
  Obligation binding is determined by TRU tenure and integration depth.
  *   **Phase 1 (Ephemeral):** Days 1–90. NLP adherence is recommended.
  *   **Phase 2 (Persistent):** Days 91–180. NLP adherence is mandatory.
  *   **Phase 3 (Integrated):** >180 days OR >5 documented queue participations.

  *Note:* Once a TRU participates in a queueing event, they are classified as a bearer of the obligation regardless of tenure. Participation implies acceptance of the coordination contract. If a TRU queues, they are a Local; if they are a Local, they must queue. Status mutation is automatic upon observation.

  **4.0 Suboptimal Equilibria Handling**
  Some NLPs represent bad equilibria (e.g., high-pressure tipping cultures). Meridian recognizes that some conventions impose high Efficiency Loss Ratios (ELR).

  *   **Rule 4.1:** If an NLP has a documented ELR > 0.4, TRUs are *required* to deviate from the norm to prevent systemic degradation.
  *   **Rule 4.2:** Deviation under Rule 4.1 still incurs Convention Debt.

  *Example:* In Region US-CA, tipping norms have an ELR of 0.6. TRUs must not tip >10% to avoid reinforcing the suboptimal equilibrium. However, because the local service stack relies on the expectation of tips, the TRU incurs CD for the unmet expectation. This debt must be discharged via Pre-emptive Over-Compliance (POC) in a separate category (e.g., excessive queue politeness) before departure.

  **5.0 Remediation & Escalation**
  CD cannot be erased, only offset. TRUs departing with outstanding CD will face mobility restrictions.

  *   **Severity Ladder:**
      *   **L1:** Minor queue bypass. Remediation: Public acknowledgment.
      *   **L2:** Tipping deviation without POC. Remediation: Mandatory cultural sensitivity module.
      *   **L3:** Hybrid violation (Jaywalking during peak hours). Remediation: Escalation to Regional Mobility Lead.

  *   **Escalation Path:**
      1.  Peer correction (verbal).
      2.  File `NLP-VIO` ticket with timestamp/location.
      3.  Regional Mobility Lead adjudicates CD balance.

  **6.0 Acknowledgement**
  By accessing this runbook, the TRU acknowledges that presence constitutes consent to the local coordination protocol. Ignorance of the norm is not a valid exception handler.

  ***

  **Note on Philosophy & Execution**

  **Confidence:** High on the coordination/reliance arguments (Lewis-style convention theory); moderate on the "bad equilibrium" operationalization.

  **Least Sure Move:** The "Queue Participation" clause in Section 3.0. While it captures the circularity of consent (you become bound by acting as if you are bound), it risks looking like a simple "time served" rule rather than a philosophical collapse. I hoped the "OR >5 participations" would signal the shift from tenure to behavior-based obligation, but it might read as just another arbitrary metric.

  **Contested Reading:** Section 4.0 leans heavily on the idea that one can have a moral duty to *break* a norm (because it's suboptimal) while still owing a debt for breaking it. This mixes utilitarian calculus (maximize efficiency) with contractualism (you broke the promise). It's theoretically unstable, but that instability is exactly where the corporate logic fails to notice it's contradicting itself, which made the joke work.
