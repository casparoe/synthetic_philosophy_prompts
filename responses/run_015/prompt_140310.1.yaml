  ### The Starting Rules
  *(Copy-paste ready for your group chat)*

  **Rule 1:** Proposals to change the rules pass by **Majority** vote.
  **Rule 2:** Rule 1 cannot be amended unless another active Rule explicitly cites "Rule 1" by number.
  **Rule 3:** This rule has no effect.
  **Rule 4:** This rule may only be amended by **Unanimous** vote.

  ***

  ### The Two Moves

  **Move A:** Amend Rule 3 to read: *"This rule supports Rule 1."*
  **Move B:** Amend Rule 1 to read: *"Proposals to change the rules pass by Unanimous vote."*

  ***

  ### The Demonstration

  **Sequence 1: A then B (Legal)**
  1.  **Start:** Rule 3 is inert. Rule 1 requires Majority.
  2.  **Move A:** You propose to amend Rule 3.
      *   *Validity:* Rule 1 allows amendments by Majority. Rule 2 only restricts amendments to *Rule 1*, not Rule 3.
      *   *Result:* **Valid.** Rule 3 now cites "Rule 1".
  3.  **Move B:** You propose to amend Rule 1 (changing Majority to Unanimous).
      *   *Validity:* Rule 1 (current version) allows amendments by Majority. Rule 2 allows amendments to Rule 1 *because* Rule 3 now explicitly cites "Rule 1".
      *   *Result:* **Valid.** Rule 1 now requires Unanimous vote.
  4.  **Final Rulebook R:** {Rule 1: Unanimous, Rule 2: Constraint, Rule 3: Citation, Rule 4: Unanimous}.
      *   *Coherence:* No contradictions. Rule 1 sets the threshold; Rule 2 sets a condition precedent; Rule 3 satisfies the condition.

  **Sequence 2: B then A (Illegal)**
  1.  **Start:** Rule 3 is inert (does not cite "Rule 1").
  2.  **Move B:** You propose to amend Rule 1.
      *   *Validity:* Rule 1 allows amendments by Majority. **However**, Rule 2 forbids amending Rule 1 unless another rule cites it. No rule currently cites "Rule 1".
      *   *Result:* **Invalid.** The proposal violates Rule 2.
  3.  **Move A:** Irrelevant, as the game state cannot legally reach the point where B is passed.

  ***

  ### Analysis

  **1. Which single feature is doing the work?**
  The path dependence is created by **Rule 2's condition precedent**. Rule 2 makes the validity of an action (amending Rule 1) dependent on the *state of the rulebook* (existence of a citation), not just the text of Rule 1 itself. Because Move A changes the state of the rulebook to satisfy Rule 2, it unlocks Move B. Without A, B is locked.

  **2. What happens if you add a clause saying Rule 1 can only be changed by Unanimous vote?**
  *(i.e., Rule 1 starts as: "Proposals pass by Majority, except amendments to Rule 1 require Unanimous.")*

  The path dependence **remains intact**, but the voting threshold for Move B increases.
  *   **A then B:** Move A still passes by Majority. Move B now requires Unanimous votes (per the new clause) *plus* the citation from Rule 3 (per Rule 2). If you have the votes and the citation, it works.
  *   **B then A:** Move B still fails immediately. Even if you have Unanimous support, Rule 2 forbids the attempt without the citation.
  *   **Conclusion:** Adding a higher voting threshold raises the cost of the move, but it does not remove the *structural lock* created by Rule 2. The argument about path dependence survives because the barrier is the *condition* (citation), not the *vote count*.

  **3. The Strongest Counter-Argument ("Legal at the Time")**
  The best argument against path dependence relies on the legal doctrine of **Ratification** (or *Curative Legislation*).

  *   **The Argument:** "Legality is determined by the rules in force *at the moment of the vote*. In Sequence 2, if we somehow passed B (perhaps by error or oversight), and *then* passed A, the current Rulebook R is internally consistent. The current rules (R) authorize the existence of R. To invalidate the history based on a procedural defect that no longer exists invites chaos. The current consensus *ratifies* the past."
  *   **The Doctrine:** In corporate and constitutional law, a *de facto* officer's actions are often upheld to preserve stability, or a later legislature may pass a law explicitly validating prior defective acts.
  *   **Why it fails in Nomic:** Nomic lacks a "Supreme Court" or a "Sovereign" outside the rules to issue a ratification. For ratification to occur, there must be a valid rule allowing it. If Rule 2 says "Rule 1 cannot be amended unless...", a proposal to amend Rule 1 without the citation is *void ab initio* (invalid from the start). It creates no legal effect to be ratified. You cannot vote to validate a move that the current rules define as impossible.
  *   **Is it the same move?** No. Ratification is a *new* move that says "We acknowledge the past defect and agree to accept the outcome." Path dependence says "The outcome never legally existed." If your group agrees to ignore the defect, you are effectively passing a *new* Move C ("We ratify the previous change"), which is distinct from the original Move B.

  **Summary for your blog:**
  Identical rulebooks can have different legal histories. If your rules contain conditions precedent (Rule 2), the *order* of operations is a rule-bound constraint, not just a matter of history. A rulebook that forbids its own creation is a paradox; a rulebook that forbids the *path* taken to create it is a valid trap.
