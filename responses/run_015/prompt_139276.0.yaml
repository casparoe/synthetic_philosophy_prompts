answer: |-
  You were right to be suspicious. Your roommate's book is doing what popular philosophy books often do: it's presenting a "steel man" of utilitarianism and a "straw man" of contractualism to make the Effective Altruist case look stronger.

  Here is the conceptual breakdown of where the book is accurate, where it's misleading, and how to handle the specific cases you and your roommate got stuck on.

  ### 1. Claim-by-Claim Takedown

  Let's walk through the book's summary.

  *   **"Act is wrong if ruled out by any principle that some person could reasonably reject."**
      *   **Verdict:** **Accurate.** This is the core formula of Scanlon's theory.
  *   **"Morality is basically a hypothetical contract... if we didn't know who we were going to be."**
      *   **Verdict:** **Wrong.** This is a conflation of Scanlon with John Rawls. Rawls uses the "Veil of Ignorance" (you don't know who you are). Scanlon explicitly rejects this. For Scanlon, we know exactly who we are; we just ask if anyone *actually* could reasonably reject the rule from their specific standpoint. This matters because it changes how complaints are weighed.
  *   **"Blocks the utilitarian habit of adding everyone's benefits together."**
      *   **Verdict:** **Accurate.** Scanlon is non-aggregative. He doesn't sum total welfare.
  *   **"Each person's complaint gets weighed on its own... no number of tiny benefits... can ever outweigh one serious harm."**
      *   **Verdict:** **Mostly Accurate (but outdated).** This is the "Individualist Restriction." It is the heart of the theory. However, saying "no number... can ever" is too strong for Scanlon's mature view (more on this below).
  *   **"Scanlon's own example... TV transmitter... cut the broadcast anyway."**
      *   **Verdict:** **Accurate.** This is the famous example from *What We Owe to Each Other*.
  *   **"Contractualism can't explain why you should save five strangers from drowning instead of one."**
      *   **Verdict:** **Unfair/Outdated.** This is the standard "Aggregation Objection." Early Scanlon struggled here, but the book implies he has no answer. He does. It's not a perfect answer for utilitarians, but it's not "cannot explain."
  *   **"Scanlon tries to patch this by letting numbers break ties... basically nobody working on this accepts the patch."**
      *   **Verdict:** **False.** This refers to Scanlon's early "tie-breaker" view. Many contemporary contractualists have developed more robust accounts of how numbers matter without summing welfare. It is a live, debated topic, not a refuted patch.

  **Conclusion on the Book:** The book is polemical. It treats a complex, evolving debate as a settled defeat for contractualism. You were right to defend Scanlon, but you should acknowledge that aggregation *is* the hardest problem for his theory.

  ### 2. The "Save Five vs. One" Objection

  The book claims contractualism forces you to flip a coin between saving one person and saving five. This is the biggest exaggeration.

  **How Contractualism Actually Handles It:**
  Scanlon doesn't sum the *welfare* (5 lives > 1 life). Instead, he looks at the *complaints*.
  1.  **Principle A (Save the One):** The five people who die can complain. "Why did you let us die when you could have saved us?"
  2.  **Principle B (Save the Five):** The one person who dies can complain. "Why did you let me die when you could have saved me?"

  The complaints are identical in *kind* and *strength* (losing a life). So, how do we choose?
  Scanlon's later view is that numbers *do* matter, but not as a sum. They matter because a principle that condemns five people to death is *more reasonably rejectable* than a principle that condemns one, simply because there are more people with a grounded complaint. It's not "5 units of value > 1 unit." It's "The objection from the group of five is stronger than the objection from the single individual because it is a shared objection."

  **Was the book unfair?**
  Yes. It portrays contractualism as being unable to count people at all. Contractualism counts *people*, it just refuses to count *units of welfare*. For most practical purposes (like the drowning case), this leads to the same result as utilitarianism (save the five), but for a different reason. The book pretends this distinction doesn't exist.

  ### 3. The Risk Case (Your First Scenario)

  This is a much sharper objection than the book made. You asked: *If we convert the certain harm to the viewers into a dispersed risk (1 in 2 million chance of a broken leg each), does contractualism flip the answer?*

  **The Contractualist Analysis:**
  *   **Option A (Interrupt):** The man in the room is safe. Each of the 2 million viewers faces a 1/2,000,000 risk of a broken leg.
  *   **Option B (Don't Interrupt):** The man in the room gets a broken leg. The viewers are safe.

  Scanlon asks: *Can any individual reasonably reject Option A?*
  A single viewer says: "I am being exposed to a 1 in 2 million chance of a broken leg."
  Scanlon would likely say: **No.** That risk is too small to ground a "reasonable rejection," especially when the alternative is a certain broken leg for someone else.
  Therefore, Option A is permissible. Option B is rejectable by the man in the room (certain harm).
  **Verdict:** Interrupt the broadcast (Save the man).

  **Does the answer flip?**
  In the original case (Certain Missed Game vs. Certain Broken Leg), Scanlon says: Interrupt (Save the man).
  In the risk case (Tiny Risk of Leg vs. Certain Broken Leg), Scanlon says: Interrupt (Save the man).
  **The verdict does not flip.**

  **Where your intuition is right:**
  You felt "something has gone wrong." The problem isn't the verdict here; it's the *reasoning*. This highlights the **"Problem of Risk"** for contractualism.
  If the risk per person is small enough to be ignored, contractualism implies you can impose that risk on *any number* of people. You could impose a 1-in-a-billion risk of death on every human on earth to save one person from a broken leg, because no *single* person has a strong enough complaint to veto it.
  Utilitarianism handles this easily (sum the expected harms). Contractualism struggles to explain why the *cumulative* risk matters if the *individual* risk doesn't.
  **So:** You were right to feel the tension. The theory doesn't necessarily flip the answer in this specific math, but it relies on a premise (individual risks below a threshold don't count) that feels dangerous in broader contexts (like climate change or pollution).

  ### 4. Your Roommate's "Diminishing Weight" Fix

  Your roommate suggested: *Add complaints up, but with diminishing weight per person (100 annoyances > 1 leg, but 100,000 annoyances < 1 leg).*

  **Is this Contractualist?**
  **No.** This is a fundamental category error.
  *   **Contractualism** is about **veto power**. It asks: "Is there any single person who has a complaint strong enough to reject this rule?" It is binary. Either the complaint is reasonable or it isn't.
  *   **Your Roommate's View** is **Prioritarianism** (a cousin of Utilitarianism). It is about **summing weighted value**.

  By suggesting we "add complaints up," your roommate has abandoned the core mechanism of contractualism. Scanlon's whole point is that you *cannot* trade off a serious harm to one person against a collection of small harms to others, regardless of diminishing weights. Once you start summing, you are doing consequentialist math, not contractualist reasoning.

  **Why this matters:**
  Your roommate is trying to get the Effective Altruist *results* (maximizing good) while using contractualist *language* (complaints). But structurally, you can't have both. If you aggregate, you aren't a contractualist.

  ### Summary: Who Was Talking Nonsense?

  *   **The Book:** Was engaging in polemic. It conflated Rawls with Scanlon, used an outdated version of the aggregation objection, and falsely claimed contractualism cannot justify saving five people over one.
  *   **Your Roommate:** Is a good Effective Altruist but a sloppy moral philosopher. His "diminishing weight" fix is not contractualism; it's weighted utilitarianism. He wants the theory to do work it explicitly refuses to do (aggregation).
  *   **You:** Were right to defend Scanlon. The book's summary was too clean and ignored the nuanced ways contractualists handle numbers. However, your intuition on the **Risk Case** was the strongest philosophical point in the room. That is a genuine vulnerability in Scanlon's theory that even his defenders worry about.

  **The Bottom Line:**
  Contractualism isn't "refuted" by aggregation, but it handles it differently than utilitarianism. It saves the five, not because 5 > 1, but because the *principle* allowing the five to die is more reasonably rejectable. Your roommate's fix abandons the theory to save the math. The book abandoned the nuance to sell the critique. You were right to push back.
