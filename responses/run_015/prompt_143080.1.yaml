prompt: |-
  I'm giving a talk next thursday to our phil-of-science reading group — mostly naturalized metaphysicians who think ontology should be continuous with science, one formal-epistemology guy who treats "Bayesian brain" talk as just rebranding, plus a grad student who actually builds sparse-coding vision models. My thesis: the problem of universals is mostly confusion about compression. Properties aren't Platonic entities or bare predicates; they're compressed nodes in hierarchical predictive models, but the clustering is causally forced by the environment, so it's not arbitrary conceptualism. I'm calling it causal-compression nominalism — universals survive as real patterns in the model-world interface, not in the furniture of the world.

  I need a Q&A prep sheet, not a defense. Give me the objections in roughly damage-order, phrased the way thier voices actually sound — especially the formal-epistemologist and the sparse-coding student. For each: what's the real force, what I should concede up front, my two-minute reply, and exactly where that reply is soft. Include the Armstrong-style truthmaker objection I really don't want to field, and flag whether I'm smuggling in an unearned metaphysics of mental representation. Also tell me the one question I'm hoping nobody asks — probably something about whether environment-driven clustering just collapses into Goodman's grue problem once you allow causal constraints to pick the clusters. Keep it focused; I don't need a bibliography, just the battlefield map. Oh, and if there's a typo in my framing, assume I meant it.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Context:**
