          *   Majority: Naturalized metaphysicians (ontology continuous with science).
          *   One: Formal epistemologist (skeptical of "Bayesian brain" hype).
          *   One: Grad student (builds sparse-coding vision models).
      *   **Speaker's Thesis:** "Causal-Compression Nominalism." Universals = compressed nodes in hierarchical predictive models. Clustering is causally forced by the environment (not arbitrary), but universals exist at the model-world interface, not in the world itself.
      *   **Goal:** Q&A prep sheet (objections, concessions, replies, weaknesses).
      *   **Tone:** Professional, sharp, "battlefield map," no fluff/bibliography. Acknowledge the specific voices in the room.
