prompt: |-
  I understand the Kelly criterion at the surface level: on a fair-odds bet with a positive edge, stake a fraction of your bankroll equal to that edge, and this choice maximizes your long-run geometric growth rate. What I want to understand is a subtler point about what happens when your estimate of the edge is wrong. Please explain intuitively why the criterion is asymmetric in this respect: why does there exist a range of overbets — staking more than the true Kelly fraction — that leads to almost sure ruin, i.e., your wealth decaying to zero with probability one, even though each individual bet still has positive expected value? And why does this asymmetry have to do with the fact that the right objective is expected log wealth (the geometric growth rate) rather than expected wealth? I want the gut-level intuition, not the full derivation.
reasoning: |-
  Here's a thinking process that leads to the explanation of Kelly criterion asymmetry:

  1.  **Deconstruct the User's Request:**
      *   **Core Topic:** Kelly Criterion.
      *   **Specific Focus:** Sensitivity to estimation error (overbetting vs. underbetting).
      *   **Key Question:** Why does overbetting (staking more than true Kelly) lead to ruin (wealth $\to 0$) even with positive expected value (EV) per bet?
      *   **Key Connection:** Why does this relate to maximizing Expected Log Wealth (geometric growth) vs. Expected Wealth (arithmetic growth)?
      *   **Constraint:** "Gut-level intuition, not the full derivation."

  2.  **Initial Brainstorming & Key Concepts:**
      *   *Kelly Fraction ($f^*$):* The optimal fraction to bet.
      *   *Overbetting ($f > f^*$):* Betting too much.
      *   *Underbetting ($f < f^*$):* Betting too little.
      *   *Ruin:* Wealth goes to zero.
      *   *Positive EV:* On average, you make money per bet *arithmetically*.
      *   *Geometric vs. Arithmetic Mean:* This is the crux. Compounding matters.
      *   *Volatility Drag:* The penalty for variance in compounding.
      *   *Asymmetry:* Losses hurt more than gains help (in percentage terms).

  3.  **Addressing the "Positive EV but Ruin" Paradox:**
      *   *Scenario:* 50/50 coin flip. Win double, lose stake. Edge = 0.5 * 2 - 0.5 * 1 = 0.5. Positive EV.
      *   *Bet:* All-in ($f=1$).
      *   *Outcome:* One loss wipes you out. Even if you win 99 times, the 100th loss kills you.
      *   *Intuition:* You can't recover from a 100% loss. Compounding requires survival.
      *   *Generalizing:* Even if not all-in, if the bet is large enough, a string of losses reduces the bankroll so much that the required gain to recover becomes mathematically impossible in the long run relative to the growth rate.

  4.  **Addressing the Geometric vs. Arithmetic Distinction:**
      *   *Arithmetic Mean (Expected Wealth):* $(W_{win} + W_{loss}) / 2$. Ignores sequence. Suggests betting everything if EV > 0.
      *   *Geometric Mean (Expected Log Wealth):* $\sqrt{W_{win} \times W_{loss}}$. Accounts for sequence/compounding.
      *   *The Link:* Long-term wealth is determined by the product of returns, not the sum. The product is dominated by the geometric mean.
      *   *Log Utility:* $\log(W_n) = \log(W_0) + \sum \log(1 + r_i)$. By Law of Large Numbers, average log return converges to expected log return. If $E[\log(1+r)] < 0$, wealth $\to 0$.

  5.  **Developing the "Gut-Level" Intuition (The Narrative Arc):**
      *   *Analogy:* The "Volatility Tax" or "Compounding Penalty."
      *   *Visual:* The path of wealth. It's a random walk on a log scale.
      *   *The Asymmetry:* Gaining 50% then losing 50% doesn't bring you back to start. It leaves you down.
      *   *Overbetting:* Increases the magnitude of the swings. Because losses hurt more than gains help (mathematically), increasing swing size disproportionately hurts the geometric mean.
      *   *The Tipping Point:* There's a specific point (2x Kelly) where the drag from volatility exactly cancels the edge. Beyond that, drag > edge.
      *   *Underbetting:* Reduces swings. You sacrifice some growth, but you stay safely on the "positive growth" side of the curve. It's forgiving.
      *   *Overbetting:* Increases swings. You move towards the "negative growth" cliff. It's unforgiving.

  6.  **Drafting the Explanation (Iterative refinement):**

      *   *Introduction:* Acknowledge the paradox. Positive EV $\neq$ Long-term growth.
      *   *Concept 1: The Compounding Trap (Arithmetic vs. Geometric).* Use the 50% up / 50% down example. $100 \to 150 \to 75$. You lost money despite "average" return being 0. This is volatility drag.
      *   *Concept 2: Leverage Amplifies Drag.* Betting more increases the % swings. Since the drag grows faster than the edge (it's quadratic vs linear), eventually drag wins.
      *   *Concept 3: The Log Wealth Objective.* Explain that to maximize final wealth, you maximize the *rate* of compounding. That rate is the expected log return. If this number is negative, you shrink.
      *   *Concept 4: Asymmetry.* Why is underbetting safe? Because the growth curve is flat near the top. Why is overbetting dangerous? Because the curve drops off a cliff.
      *   *The "2x Kelly" Ruin Point:* Mention that at 2x Kelly, expected log growth is zero. Beyond that, it's negative.
      *   *Conclusion:* Summarize the intuition. Survival is prerequisite for growth.

  7.  **Refining the "Why Ruin?" part:**
      *   Need to be careful with "Almost Sure Ruin." It means $W_t \to 0$ as $t \to \infty$.
      *   Why does positive EV not save you? Because EV is an average over *parallel universes* (ensemble average). Long-term wealth is a single *trajectory* (time average).
      *   In a single trajectory, you experience the geometric mean, not the arithmetic mean.
      *   If you overbet, the geometric mean return becomes negative, even if the arithmetic mean is positive.

  8.  **Final Polish (checking against constraints):**
      *   No heavy math formulas (keep it conceptual).
      *   Focus on intuition.
      *   Ensure the distinction between Expected Wealth (arithmetic) and Expected Log Wealth (geometric) is clear.
      *   Highlight the asymmetry (underbetting is okay, overbetting is fatal).

  9.  **Self-Correction Example during drafting:** I initially thought about mentioning utility functions. *Correction:* Keep it focused on growth rates. Utility is a normative justification; growth rate is the descriptive mechanism of ruin. Stick to the "Volatility Drag" explanation as it's more intuitive for this specific question. Make sure to emphasize that *one* bad sequence in your personal timeline ruins you, whereas EV averages over all possible sequences.

  10. **Final Structure:**
      *   The Trap of Averages (Arithmetic vs. Geometric).
      *   The Volatility Drag (Why losses hurt more).
      *   Leverage and the Tipping Point (2x Kelly).
      *   The Asymmetry (Flat top vs. Steep cliff).
