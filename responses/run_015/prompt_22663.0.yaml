answer: |-
  Here is the gut-level intuition for why overbetting is fatal while underbetting is forgiving, and why this hinges on the difference between arithmetic and geometric growth.

  ### 1. The Trap of Averages (Arithmetic vs. Geometric)
  The core confusion comes from mixing up two different types of "average."

  *   **Expected Wealth (Arithmetic Mean):** This asks, "If a million people made this bet once, what is the average amount of money they would have?" If the bet has positive expected value (EV), this number goes up as you bet more. This suggests you should bet everything.
  *   **Long-Run Wealth (Geometric Mean):** This asks, "If **I** make this bet a million times in a row, compounding my winnings, what happens to my bankroll?"

  In the long run, your personal wealth is determined by the **geometric mean**, not the arithmetic mean. This is because investing is multiplicative, not additive. Your next bet depends on the size of your bankroll *after* the previous bet.

  **The Intuition:** Imagine you start with \$100. You gain 50%, then you lose 50%.
  *   Arithmetic average return: $(+50\% - 50\%) / 2 = 0\%$. It looks like you broke even.
  *   Actual result: $\$100 \to \$150 \to \$75$. You lost 25% of your money.

  This penalty is called **volatility drag**. Variance eats away at compounded returns. The more your wealth swings up and down, the more drag you suffer, even if the "average" outcome looks profitable.

  ### 2. Why Overbetting Leads to Ruin
  When you bet the Kelly fraction, you are perfectly balancing your **edge** (the positive EV) against the **drag** (the volatility penalty).

  *   **Edge** grows linearly with bet size. (Bet twice as much, get twice the expected profit).
  *   **Drag** grows quadratically with bet size. (Bet twice as much, your volatility swings are twice as big, but the damage from those swings is four times as severe).

  Because drag accelerates faster than edge, there is a tipping point.
  *   **At 1x Kelly:** Edge exactly offsets drag optimally. Growth is maximized.
  *   **At 2x Kelly:** The volatility drag becomes so large that it completely cancels out your edge. Your expected *geometric* growth rate is now zero. Your wealth will wander aimlessly but trend toward zero over infinite time.
  *   **Above 2x Kelly:** The drag exceeds the edge. Your expected geometric growth rate becomes **negative**.

  **The Ruin Paradox:** How can you have positive EV per bet but negative growth overall?
  Because "Positive EV" is an **ensemble average** (across many parallel universes). In most parallel universes, you get lucky early, bet huge, and end up astronomically rich. These outliers pull the arithmetic average up.
  But in **your** single timeline (the time average), you cannot rely on being the outlier. You will experience the typical sequence of wins and losses. If your geometric growth rate is negative, the typical sequence is a slow (or fast) march to zero. You don't need to lose your whole bankroll in one go; you just need your recoveries to be mathematically insufficient to cover your drawdowns.

  ### 3. The Asymmetry: Why Underbetting is Safe
  The function relating bet size to geometric growth rate looks like an inverted parabola (a hill).

  *   **The Top is Flat:** Near the peak (the true Kelly fraction), the curve is very flat. If you bet half-Kelly (50% of the optimal amount), you sacrifice very little growth (roughly 25% of the *rate*, but still positive growth) but you drastically reduce your volatility and risk of ruin. This is why underbetting is forgiving. You are on the safe side of the hill.
  *   **The Cliff is Steep:** On the overbetting side, the curve drops off precipitously. Once you cross the 2x Kelly threshold, you aren't just growing slower; you are actively shrinking. The penalty for being wrong about your edge is catastrophic because you have leveraged the volatility drag against yourself.

  ### 4. Summary: The Log Wealth Objective
  Why do we maximize **Expected Log Wealth**?
  Because $\log(\text{Wealth})$ turns multiplication into addition.
  $$ \log(W_{final}) = \log(W_{start}) + \sum \log(\text{returns}) $$

  By the Law of Large Numbers, the sum of those log returns converges to the **Expected Log Return**.
  *   If Expected Log Return > 0, your wealth grows exponentially.
  *   If Expected Log Return < 0, your wealth decays exponentially to zero.

  Overbetting pushes your Expected Log Return into the negative zone. Even though the arithmetic expected value of each bet is positive, the *log* expected value is negative. Since long-term compounding follows the log value, you are guaranteed to go broke.

  **The Gut Check:**
  Underbetting is like driving 10 mph under the speed limit. You get there slightly later, but you arrive safely.
  Overbetting is like driving 100 mph over the speed limit. You might get there faster in some parallel universe where you don't crash, but in *this* universe, the volatility (the curve in the road) will eventually flip your car, and the journey ends.
