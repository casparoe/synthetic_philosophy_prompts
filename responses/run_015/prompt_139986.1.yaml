answer: |-
  The glow of the monitor was the only light in Arthur's flat, casting long shadows against the peeling wallpaper. It was 2:00 am, the witching hour for the lonely and the employed. On screen sat Puzzle 894.

  Six images on the left. Six on the right.

  The left panel displayed six triangles. Every one of them was equilateral, sharp-edged, and contained a single, small black dot in the centre.
  The right panel displayed six squares. Every one was perfectly aligned, containing two small black dots, side-by-side.

  Arthur cracked his knuckles. He'd been at this for three hours. He'd tried 'straight lines vs curved', 'acute angles', 'symmetry'. All rejected. But now he had it. He'd measured the pixel areas. The triangles were consistently smaller than the squares. He'd checked the RGB values. The triangles were slightly greyer.

  But the cleanest cut was the shape itself.
  *Rule:* **Left contains triangles. Right contains squares.**

  It separated the set perfectly. Twelve out of twelve. Logically unassailable. He typed it into the submission box and hit Enter.

  A red cross flashed. *Incorrect.*

  Arthur slumped back, the chair creaking in the silence. "Bollocks," he whispered.

  He stared at the images again. If not shape, then what? The dots. One dot vs two dots.
  He typed: **Left contains one dot. Right contains two dots.**
  He hit Enter.

  A green tick. *Correct.*

  Arthur rubbed his face. Both rules worked. Both separated the left set from the right set with 100% accuracy. By any mathematical metric, his first answer was valid. So why was it wrong?

  He poured a cold cup of tea and stared at the triangles. He realised he'd been treating the puzzle like archaeology. He assumed these images were artifacts dug up from a pile of existing drawings, and his job was to find the property that happened to correlate with their grouping. If that were true, 'Triangle vs Square' was just as valid as 'One Dot vs Two'. It was a feature of the data.

  But Bongard puzzles aren't archaeology. They're telepathy.

  The images hadn't been picked from a pile; they had been drawn to order. The setter hadn't thought, "I wonder what separates these triangles from these squares?" They had thought, "I want to illustrate the concept of *singularity versus plurality*." Then, lazily, they'd drawn triangles to hold the single dot and squares to hold the pair. The shape was noise. The count was the signal.

  Arthur had failed to read the setter. He'd analysed the *evidence* without considering the *intent*.

  He moved to Puzzle 895.
  Left: Six arrows pointing North.
  Right: Six arrows pointing South.
  Confounding variable: All North arrows were drawn in blue ink. All South arrows in red.

  Arthur hesitated. His instinct screamed 'Colour'. It was the most salient feature. But he knew now that salience was a trap. He had to guess what rule the setter was *allowed* to pick. Was this a test of colour perception? Or directionality?

  He imagined the setter, some tired graphic designer in a co-working space in Shoreditch. They'd opened their vector software. Did they think, "I'll make a blue arrow"? Or did they think, "I'll make an Up arrow"?
  If the images were selected from a database, 'Blue vs Red' might be the only hard truth. But if they were generated... generation implies hierarchy. You decide the concept, then you render it. The rendering is subordinate.

  Arthur typed: **Arrows point Up vs Arrows point Down.**
  Green tick.

  He leaned back, feeling a strange hollowness. He wasn't solving puzzles. He was modelling a human mind. He was guessing which constraints the setter considered fundamental and which were accidental byproducts of their drawing hand.

  The distinction haunted him. If the pictures were picked from a pile, the rule was a discovery. If they were drawn to fit, the rule was a command. He'd been marking answers wrong for weeks because he was looking for truth, when he should have been looking for authority.

  He closed the laptop. The room was dark again. He wondered if the setter knew how much of themselves they were giving away. Every puzzle was a confession of what they considered important, and what they considered noise. Arthur had spent the night hunting for facts, only to find he was actually judging character.

  He went to bed, dreaming of triangles that refused to be triangles, waiting for someone to tell them what they really were.
