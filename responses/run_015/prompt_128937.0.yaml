  3.  **Identify the Philosophical Slip:**
      *   The main error is a slide from **causal interaction** to **ontological constitution**.
      *   Just because $X$ (classification) affects $Y$ (symptoms/behavior) doesn't mean $X$ *creates* $Y$ ex nihilo.
