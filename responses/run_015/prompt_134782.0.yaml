answer: |-
  # Joint Statement on the Ontological Status of Neural Network Representations

  ## 1. Areas of Agreement

  1.  **Formal Structure of Computation:** We agree that neural networks are mathematical structures composed of layers, weights, and non-linear activation functions. Computation proceeds via deterministic or stochastic transformations of input vectors into output logits through intermediate activation states. There is no disagreement regarding the underlying arithmetic or the causal graph of the system.
  2.  **Achievements of Mechanistic Interpretability:** We agree that mechanistic interpretability techniques have successfully identified specific internal structures correlated with observable behaviors. These achievements include identifying feature directions in activation space, isolating circuit motifs (such as attention heads that copy previous tokens), and characterizing polysemantic neurons that respond to multiple distinct input features. Both sides accept these findings as robust empirical descriptions of the model's causal topology.
  3.  **Heuristic Utility of Representation-Talk:** We agree that attributing "representations," "features," or "goals" to internal states is currently indispensable for human researchers. This vocabulary serves as a necessary compression mechanism for navigating high-dimensional parameter spaces, facilitating hypothesis generation, and communicating findings among engineers. We agree that abandoning this language would significantly slow down current interpretability workflows.
  4.  **Conditions for Adequacy:** We agree that any adequate account of neural network internals must explain two key phenomena: (a) **Generalization**, specifically how models perform competently on out-of-distribution inputs despite being trained on fixed datasets, and (b) **Systematic Error**, including adversarial vulnerability and hallucination, where models produce confident outputs that diverge from ground truth or training distribution statistics.

  ## 2. Table of Disagreements

  | Crux | Realist Formulation | Anti-Realist Formulation | Agreed Empirical Case & Predictions |
  | :--- | :--- | :--- | :--- |
  | **(a) Decoupling and Misrepresentation** | Internal states can genuinely decouple from their causal origins, entering activation states that carry content corresponding to a feature even when that feature is absent in the input or reality. This supports the possibility of genuine misrepresentation within the system. | Activation in the absence of the external feature is merely a causal state triggered by prior inputs or weights; "misrepresentation" is a projection by the observer who expects a mapping that the system never committed to maintaining. | **Case:** Confident hallucination in large language models (e.g., asserting a false biographical fact).<br>**Realist Prediction:** This demonstrates the internal state carries false content; the model "believes" the fact due to representational drift.<br>**Anti-Realist Prediction:** This demonstrates the causal chain produces high-probability tokens based on statistical regularities; "falsity" exists only relative to an external database, not internal dynamics. |
  | **(b) Polysemanticity and Unit Identity** | Polysemanticity (one neuron responding to multiple features) is compatible with realism because representations are distributed across superposed directions in high-dimensional space, not localized to single neurons. | Polysemanticity undermines realism because it shows that individual units are functional optimizers serving multiple loss-reduction roles simultaneously, lacking the discrete identity required to be a vehicle of content. | **Case:** Discovery of neurons that activate for both distinct semantic concepts (e.g., specific human names and code syntax) within the same layer.<br>**Realist Prediction:** This confirms representational superposition; the features are distinct but overlap in the basis provided by the neurons.<br>**Anti-Realist Prediction:** This confirms neurons are multi-purpose causal levers; attributing distinct "representations" to them is an over-interpolation of their functional role. |
  | **(c) Explanatory Irreducibility** | Representation-based explanations have successfully predicted behaviors and guided interventions (e.g., activation patching) that purely causal-functional descriptions failed to anticipate or would have described less efficiently. | Representation-based explanations are post-hoc labels applied to causal-functional descriptions; every successful intervention predicted by representation-talk could have been derived from causal graph analysis alone without invoking content. | **Case:** The identification and patching of the "Indirect Object Identification" circuit to alter model output.<br>**Realist Prediction:** The hypothesis that the model "represents" the indirect object guided the specific patching strategy that causal analysis alone would not have prioritized.<br>**Anti-Realist Prediction:** The causal topology of attention patterns dictated the patch; the "indirect object" label was a mnemonic aid that added no predictive power beyond the graph structure. |

  ## 3. Assessment of Dispute Nature

  We conclude that a portion of this dispute is verbal, while a core portion remains substantive.

  The dispute is **verbal** regarding the definition of "representation." If "representation" is defined strictly as a state that plays a causal role in behavior similar to how human beliefs guide action, the Realist position holds trivially. If "representation" is defined as requiring a committed semantic mapping condition that the system itself enforces, the Anti-Realist position holds. Much of our disagreement stems from whether the interpreter or the system establishes the semantic conditions of use.

  The dispute is **substantive** regarding the **irreducibility of the intentional stance**. The critical empirical question is whether adopting the representationalist framework yields novel, successful interventions that a strictly causal-functional framework would miss. If future interpretability work demonstrates that hypothesizing about "content" allows researchers to solve alignment problems or predict generalization failures that causal graph analysis cannot, the Realist position gains empirical vindication. Conversely, if all successful interventions are fully derivable from causal topology without recourse to content attribution, the Anti-Realist position is substantively confirmed. We agree to track the rate of novel discovery attributable specifically to representational hypotheses versus causal tracing in future collaborative benchmarks.
