answer: |-
  ### Desiderata for a Theory of Pramāṇas

  **1. Mechanism Specificity (Non-Negotiable)**
  The theory must individuate sources by the causal-mechanical process generating the cognition, not merely by the functional output.
  *Case Anchor:* **The Remote Prosthesis.** If the device produces states introspectively identical to vision but lacks sense–object contact and reconstructible inference, the theory must determine whether mechanism trumps phenomenology. A theory that classifies solely by output (true belief about the world) collapses into simple reliabilism; a theory that classifies by mechanism must explain why this mechanism is or is not *sui generis*.

  **2. Novelty Specification (Non-Negotiable)**
  The theory must define whether the novelty condition (*anadhigata*) applies to the token cognitive event or the type content relative to the agent's history.
  *Case Anchor:* **Rediscovery.** If a subject re-derives a forgotten truth, the content is not new to their history, but the event is. Dropping the condition entirely allows memory to count as a *pramāṇa* (often excluded in the stock list); retaining it without specification renders the second derivation non-*pramā*. The theory must state what epistemic value novelty adds—if any—to distinguish fresh warrant from stored warrant.

  **3. Ontological Neutrality (Non-Negotiable)**
  The theory must accommodate veridical cognition of absences without requiring a positive ontological correlate.
  *Case Anchor:* **Purely Negative Competence.** An organism tracking "no predator" functions reliably and guides action. If the theory requires all *pramāṇa* objects to be positive existents, this competence is excluded. The theory must specify whether absence is a distinct object of knowledge or a mode of perceiving presence, as this determines whether a distinct *pramāṇa* is needed.

  **4. Transmission Integrity (Non-Negotiable)**
  The theory must specify whether a source transmits epistemic status from a prior holder or generates it de novo in the recipient.
  *Case Anchor:* **Gettierized Testimony.** If the speaker lacks a *pramāṇa* (due to misleading evidence) but the hearer forms a true belief, the theory must decide if the hearer's cognition is a *pramā*. A theory treating testimony as basic (generative) permits this; a theory treating it as derivative (transmissive) denies it. The requirement is an explicit rule on the flow of validity across agents.

  **5. Modal Strength (Local Preference)**
  The theory must state whether *pramāṇa* status is binary (a specific occasion either is or is not a source) or graded (a disposition with a reliability rate).
  *Case Anchor:* **The Probabilistic Instrument.** A device accurate 70% of the time yields a true reading on a specific occasion. A binary theory must declare this specific reading either a *pramā* or not, risking arbitrariness. A graded theory accommodates the risk but requires a successor notion to the classical *pramā* (which is defined as undefeatable truth). This is a preference because a classical theory may simply exclude probabilistic instruments by fiat.

  **6. Agent Locus (Non-Negotiable)**
  The theory must define the boundaries of the "subject" in whom the *pramā* inheres.
  *Case Anchor:* **Corporate Cognition.** If a laboratory conclusion relies on procedures no individual member comprehends, the reliability is institutional. The theory must either expand the notion of "subject" to include collectives or deny that the conclusion is a *pramā* for any individual. Without this specification, the theory cannot classify institutional testimony.

  **7. Source Individuation and Confluence (Non-Negotiable)**
  The theory must provide identity conditions for sources and state whether a single fact can be warranted by multiple distinct sources simultaneously.
  *Case Anchor:* **Demarcation.** A satellite image interpreted by a model involves perception (of the screen), inference (the model's logic), and testimony (the calibration report). The theory must state if these fuse into one source or remain distinct. Rigid partitioning forbids confluence; permissive accounts allow it. This is non-negotiable because without it, the classification of hybrid technologies is impossible.

  **8. Validation Termination (Non-Negotiable)**
  The theory must identify a non-arbitrary stopping point for the validation of a *pramāṇa* that does not relocate the problem into a theory of action.
  *Case Anchor:* **The Regress of Extrinsic Validity.** If every *pramā* requires a further *pramā* to validate it, the chain never ends. Appealing to "practical success" stops the regress but risks defining truth by utility. The requirement is that the theory must explicitly state whether validity is intrinsic (self-certifying) or extrinsic (validated by success), and justify why that stop is not circular.

  ***

  ### Separation of Requirements

  **1. Genuine Desiderata vs. Metaphysical Artifacts**
  Genuine desiderata are those required to make the classification of new belief-sources possible: Mechanism Specificity, Agent Locus, and Source Individuation. These are functional necessities for the stated purpose of the paper. Metaphysical artifacts are constraints inherited from specific ontological commitments that do not serve the classificatory goal. These include the demand that knowledge be a quality of a substantial self (which blocks Corporate Cognition), the demand that every *pramāṇa* exhibit a distinct instrument-and-result structure (some sources may be identical to their results), and the demand that the list be closed at a specific number (e.g., exactly four). The latter are artifacts of systematizing a tradition, not requirements for analyzing remote-sensing or institutional data.

  **2. Incompatible Requirements**
  The pair that cannot be jointly satisfied is **Reduction to Two Sources** and **Mechanism Specificity** (given the Remote Prosthesis case). If one insists that all valid cognition must collapse into either Perception or Inference, one cannot respect the mechanistic distinctness of the Remote Prosthesis. The Prosthesis lacks sense–object contact (ruling out classical Perception) and lacks reconstructible reasoning (ruling out classical Inference). To accommodate it under a Two-Source reduction, one must stretch the definition of Perception to include "functional equivalence," which violates Mechanism Specificity (which demands we distinguish sources by *how* they work, not just *that* they work). Conversely, if one respects Mechanism Specificity, the Prosthesis demands a fifth source or a new category, breaking the Reduction. You cannot have a rigid binary taxonomy and a mechanism-sensitive classification of novel technology simultaneously.

  **3. The Most Exclusionary Requirement**
  The single requirement that excludes the most candidate theories is **Validation Termination without Relocation to Action**. Most contemporary naturalized epistemologies and reliabilist accounts solve the regress problem by appealing to the causal reliability of the process or the practical success of the belief. This requirement demands that the theory explain validity without merely pointing to successful action, as that relocates the epistemic problem into a pragmatic one. This excludes pure externalism (which often ignores the agent's access to validity) and pragmatism (which equates validity with success), forcing the theory to posit either intrinsic self-certification or a complex internalist structure that most modern accounts reject.

  ***

  ### Comparative Assessment

  The four-source list fails the Desiderata primarily on Source Individuation and Agent Locus; it cannot classify the Remote Prosthesis without arbitrary forcing, and it lacks the resources to handle Corporate Cognition without redefining the subject. The two-source reduction fails Mechanism Specificity; by collapsing Testimony and Comparison into Perception or Inference, it loses the normative distinctions required to evaluate Gettierized Testimony or hybrid technologies like satellite modeling. Contemporary reliabilism satisfies Mechanism Specificity and Agent Locus only by reducing them to causal chains, but it fundamentally violates the core definition of *pramā* provided: it cannot distinguish a *pramāṇa* from a reliable cause without collapsing into the claim that "produced reliably" is sufficient, thereby failing the Non-Defeatability and Validation Termination requirements which demand a normative status stronger than statistical accuracy.
