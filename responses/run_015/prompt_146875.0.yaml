  # Decision Tree: The Logical Space of Old Evidence

  **Instructions:** Begin at Node 1. Answer each question based on your theoretical commitments regarding the agent's epistemic state and the definition of confirmation. Follow the branch to the next node or to a terminal Leaf. Each Leaf represents a distinct doctrinal position on the Problem of Old Evidence (POE).

  ### Branch Nodes

  **Node 1: Certainty**
  Is the agent's credence in the evidence $E$ strictly 1 (certain) at the time hypothesis $H$ is evaluated?
  *   **No:** Go to **Leaf 1**. (Handles the *rough numerical coincidence* case: $E$ is not certain, perhaps due to measurement error).
  *   **Yes:** Go to **Node 2**. (The standard POE setup, e.g., Mercury's perihelion).

  **Node 2: Dynamics**
  Does confirmation essentially require an actual *increase* in the agent's credence in $H$ over time?
  *   **No:** Go to **Node 3**. (Static/Support views: confirmation is a relation, not an event).
  *   **Yes:** Go to **Node 5**. (Dynamic views: confirmation is learning).

  **Node 3: Logical Omniscience (Static)**
  Does the agent already know the logical entailment relation ($H \vdash E$)?
  *   **No:** Go to **Leaf 2**. (Handles the *later derivation* case: agent knew $E$, but didn't know $H$ entailed it).
  *   **Yes:** Go to **Node 4**. (The agent is logically omniscient regarding $H$ and $E$).

  **Node 4: Static Support**
  Is a confirmatory relation possible between $H$ and $E$ even if the agent's credences never change?
  *   **No:** Go to **Leaf 3**. (Static Skepticism).
  *   **Yes:** Go to **Leaf 4**. (Static Support, potentially via *language expansion*).

  **Node 5: Baseline (Dynamic)**
  To measure the increase in credence, do we compare the current state to a *counterfactual* state (what if the agent didn't know $E$)?
  *   **No:** Go to **Node 7**. (Historical Baseline: compare to what the agent *actually* believed earlier).
  *   **Yes:** Go to **Node 6**. (Counterfactual Baseline).

  **Node 6: Counterfactual Type**
  Is the counterfactual prior an *ur-prior* (assigned before any evidence) rather than a subtractive modification of the current prior?
  *   **No:** Go to **Leaf 5**. (Subtractive Counterfactuals).
  *   **Yes:** Go to **Leaf 6**. (Ur-Priors).

  **Node 7: Forgetting (Historical)**
  If the agent once knew $E$, forgot it, and then re-learned it, does this count as a credence increase?
  *   **No:** Go to **Leaf 7**. (Strict Historical).
  *   **Yes:** Go to **Leaf 8**. (Forgetting Resets).

  ---

  ### Terminal Leaves

  **Leaf 1: Uncertain Evidence (Jeffrey Conditionalization)**
  *   **Doctrinal Name:** Jeffrey-Conditionalization View.
  *   **Awkward Commitment:** Must deny that established empirical facts (like Mercury's orbit) are known with certainty, treating them as perpetually open to doubt.
  *   **Attribution:** Defended by **Jeffrey (1965)**; applied to POE by **Christensen (1999)**.
  *   **Predictivism Verdict:** Construction history is irrelevant; only the probabilistic relation matters.
  *   **Case Coverage:** *Rough numerical coincidence.*

  **Leaf 2: Logical Ignorance (Garber-Style)**
  *   **Doctrinal Name:** Bayesianism with Bounded Rationality.
  *   **Awkward Commitment:** Requires expanding the probability space to include sentences about logical relations (e.g., "$H \vdash E$") as distinct propositions.
  *   **Attribution:** Defended by **Garber (1983)**; developed by **Eells (1985)**.
  *   **Predictivism Verdict:** Construction history is irrelevant; the *discovery* of the entailment drives confirmation.
  *   **Case Coverage:** *Knew E, didn't know H|-E.*

  **Leaf 3: Static Skepticism**
  *   **Doctrinal Name:** Old Evidence Skepticism.
  *   **Awkward Commitment:** Must concede that $E$ provides *no* confirmatory support for $H$ for an omniscient agent, contrary to scientific practice.
  *   **Attribution:** Attributed to **Earman (1992)** as a *reductio* of strict Bayesianism.
  *   **Predictivism Verdict:** N/A (Denies confirmation entirely).
  *   **Case Coverage:** *Omniscient agent, fixed language.*

  **Leaf 4: Static Support (Language Expansion)**
  *   **Doctrinal Name:** Counterfactual Language View.
  *   **Awkward Commitment:** Commits to the metaphysical claim that the agent's language/probability space can expand to include $E$ only after $H$ is formulated.
  *   **Attribution:** Defended by **Lange (2001)**.
  *   **Predictivism Verdict:** Construction history matters only insofar as it dictates the order of language acquisition.
  *   **Case Coverage:** *E inexpressible before H.*

  **Leaf 5: Subtractive Counterfactual (Excision)**
  *   **Doctrinal Name:** Evidential Excision View.
  *   **Awkward Commitment:** Requires a coherent method for "excising" $E$ from a belief state without disturbing other probabilistic dependencies (often technically difficult).
  *   **Attribution:** Defended by **Christensen (1999)** (Jeffrey shift variant) / **Eells (1985)**.
  *   **Predictivism Verdict:** Construction history is irrelevant; the counterfactual ignorance washes out the accommodation.
  *   **Case Coverage:** *Standard Old Evidence.*
  *   **Note:** *Indistinguishable from Leaf 6 on the "Construction" verdict, but distinct on the mechanics of the prior.*

  **Leaf 6: Ur-Prior Counterfactual**
  *   **Doctrinal Name:** Ur-Prior View.
  *   **Awkward Commitment:** Requires positing a hypothetical prior at a time before the agent possessed *any* evidence, which may be psychologically unrealistic.
  *   **Attribution:** Defended by **Howson (2000)**.
  *   **Predictivism Verdict:** Construction history is irrelevant; support is determined by the ur-prior's likelihood ratio.
  *   **Case Coverage:** *Standard Old Evidence.*

  **Leaf 7: Strict Historical**
  *   **Doctrinal Name:** Historical Bayesianism.
  *   **Awkward Commitment:** Implies that $E$ cannot confirm $H$ if $E$ was known before $H$, even if $H$ was built to explain $E$ (accommodation yields zero support).
  *   **Attribution:** Implied by **Maher (1988)** (regarding novel prediction).
  *   **Predictivism Verdict:** **YES.** A theory built to fit evidence receives less support than one that predicts it.
  *   **Case Coverage:** *Built to fit E.*

  **Leaf 8: Forgetting Resets**
  *   **Doctrinal Name:** Epistemic Reset View.
  *   **Awkward Commitment:** Implies that an agent can "manufacture" confirmation for $H$ by deliberately forgetting $E$ and re-learning it.
  *   **Attribution:** **Unnamed** (Generally considered unattractive/unoccupied).
  *   **Predictivism Verdict:** **NO.** If forgetting resets status, accommodation can be converted to "novel" support artificially.
  *   **Case Coverage:** *Straightforwardly forgotten.*

  **Leaf 9: Incoherent Combination**
  *   **Doctrinal Name:** N/A.
  *   **Status:** **Incoherent.**
  *   **Reasoning:** This cell represents the Dynamic/Historical/No-Reset path where $P(E)=1$ and $\Delta Credence = 0$. If confirmation *requires* increase (Node 2), and no increase is possible (Node 7), confirmation is impossible. This collapses into Leaf 3 (Skepticism) or is simply empty.
  *   **Predictivism Verdict:** N/A.

  ---

  ### Seminar Note: The "Manufacturing Support" Worry

  Several leaves (specifically **Leaf 4**, **Leaf 6**, and **Leaf 8**) allow the agent to reach back to a hypothetical prior, expand the language, or reset epistemic status to generate confirmation where none seemingly exists. The worry is that this makes support too easy to manufacture: an agent could arbitrarily posit an *ur-prior* that favors $H$, or claim $E$ was inexpressible until $H$ arrived.

  *   **Survivors:** **Leaf 2 (Logical Ignorance)** and **Leaf 5 (Subtractive Counterfactual)** are best positioned to block this. They rely on concrete constraints (actual logical ignorance or specific technical excision rules) rather than open-ended counterfactuals.
  *   **Collapsers:** **Leaf 8** collapses immediately if we deny that forgetting is epistemically relevant. **Leaf 6** risks collapsing if the *ur-prior* is not constrained by rationality requirements beyond probability axioms.
  *   **Session 3 Link:** Note that **Leaf 7** is the only view that inherently privileges novel prediction over accommodation without relying on counterfactual manipulation. This sets the stage for our next discussion on Predictivism.
