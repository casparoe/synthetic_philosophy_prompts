answer: |-
  I grant you, the heat of yesterday's sun made us quick to strike. I grant you, the ringleaders who begged Sparta for help are guiltier than the common man who followed. But you mistake the nature of this "irreversibility." You say death is final. True. But the signal sent by sparing them is more final still. If we show that a decree of death can be undone by clever words, we teach every subject that our threats are wind. You call this a path to safety for the defeated; I call it a highway for treason. If every allied city believes that revolt brings profit when successful and pity when failed, then the empire dissolves. The true disaster isn't the death of traitors; it's the life of an empire that hesitates. To wait for anger to cool is to admit our judgment was flawed, and an empire cannot afford to look flawed.

  You chide us for spending our "reversibility" too fast, acting while the wine of anger was still fresh. But hesitation is its own irreversible act. Once Chios sees Mytilene live, the seed is planted that cannot be unplanted. Yet I am curious about this land of yours, where you claim to command such magic. If you can undo the gravest errors so easily, do you never punish anyone? Does the thief return the gold and walk free because the loss was "rolled back"? Tell me how a city holds together when no consequence is final, and whether your people fear anything at all.
