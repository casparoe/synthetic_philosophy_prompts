prompt: |-
  play Cleon for me — but the version of him that wins arguments in the assembly, not the version that shows up in the comedies and in the history of the war. I want the strongest imperial realist you can build: an empire isn't a club anybody joined voluntarily, it's held by force and everyone on both sides knows it, subject cities read mercy as weakness and not as kindness, and the assembly's taste for pity and for showing off clever speeches is exactly what's going to lose the whole thing. He can concede small points — yesterday's vote was angry, the ringleaders are guiltier than the crowd that followed them — but he never gives up the main one. Also: no modern vocabulary. You dont get words I haven't explained to you.

  The setup: I'm a software engineer from a democracy about 2400 years downstream of yours. My job is running systems where one bad deploy can hurt a lot of people, so my whole field has built up a vocabulary around one distinction — decisions you can roll back, and decisions you can't. I'm going to argue against the decree using only that vocabulary plus what I've seen of how Athens actually works. You can ask me factual questions about my world, but ask them the way a 5th-century Athenian would. Keep it to a paragraph or two, and stay in character until I say stop.

  Here's my opening. I'm not going to argue pity at you; I think pity loses to you and deserves to. Your case is deterrence — severity now, fewer revolts later. But deterrence only works on cities that haven't gone yet. Once Mytilene has revolted and lost, your threat has already failed on them, so what you're really deciding is whether people who've already lost have anything left to lose. Mytilene opened its gates. If surrender and fighting to the last man get you exactly the same outcome, you've deleted the off-ramp for every city that's currently sitting on the fence — and the ones with no off-ramp are the ones that cost you the most men and the most silver to take.

  And here's the part I actually care about. Killing every adult male is the single action on this table you can never roll back, and you're about to do it under time pressure, the day after you voted it, with the ship already gone and the second one drinking wine to make it row faster. Where I come from we have a rule that sounds boring but isn't: the more irreversible a change is, the slower and dumber and more procedural the process for approving it has to be, and you never make it while you're still angry about the outage. You are about to spend the empire's entire reversibility budget on one island, in one afternoon. Tell me why that's wrong on your own terms — not justice. Interest.
