prompt: |-
  I'm on a licensing board for protected wildlife and we keep getting submissions asking us to list 'cryptic species' or subspecies as full species, but our legal framework only protects biological species. I need a reusable decision procedure — like a checklist in order — that my team can actually run when a biologist claims two populations are seperate species and deserve seperate protection status. Ground it in the philosophy of taxonomy, not just 'what biologists usually do': cover ring species, asexual lineages, hybrid zones, and cases where DNA and morphology disagree. For each step say what counts as a sufficient answer, where the procedure stops with a 'no', and where it has to hand over to a human because it's a value judgement not a fact. Apply it to three proposals: a ring of salamanders round a valley where the end populations don't interbreed, a coral that looks identical to its neighbour but has partial gene flow, and a researcher pushing to split an asexual lizard population — the last one should be a case where your procedure gives an answer they won't like. Write it in British English please, and don't ask me for bibliographies — I can't search them up from here.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Context:** Licensing board for protected wildlife.
      *   **Problem:** Submissions asking to list 'cryptic species' or subspecies as full species, but the legal framework *only* protects biological species.
      *   **Task:** Create a reusable decision procedure (checklist in order) for evaluating claims that two populations are separate species.
      *   **Requirements:**
          *   Grounded in the philosophy of taxonomy (not just "what biologists do").
          *   Cover specific edge cases: ring species, asexual lineages, hybrid zones, DNA/morphology disagreement.
          *   For each step: Define sufficient answer, stop condition ('no'), and handover point (value judgement).
          *   Apply to three specific proposals:
              1.  Ring of salamanders (ends don't interbreed).
              2.  Coral (identical look, partial gene flow).
              3.  Asexual lizard (researcher wants split, procedure should give an answer they won't like).
          *   Language: British English.
          *   Constraint: No bibliographies (user can't search them).

  2.  **Deconstruct the Philosophical Basis:**
      *   The legal framework specifies "biological species." This points directly to the *Biological Species Concept (BSC)* (Mayr), which defines species based on reproductive isolation.
      *   However, the prompt asks to cover asexual lineages and cryptic species, which the BSC struggles with.
      *   To be philosophically robust, the procedure needs to acknowledge the *Species Problem* (the fact that "species" is a theoretical construct, not always a natural kind).
      *   The procedure must prioritize the *legal definition* over scientific preference. If the law says "biological species," the BSC is the primary metric, but we need fallbacks for edge cases where BSC is inapplicable (asexuality) or ambiguous (ring species).
      *   Key philosophical tension: *Realism* (species exist independently) vs. *Nominalism* (species are human categories). The board must act as if realism holds for the sake of law, but acknowledge nominalist limits in the procedure.
      *   Key concepts to integrate: Reproductive Isolation (BSC), Phylogenetic Species Concept (PSC) for asexuals/cryptic, Cohesion, and the distinction between *process* (speciation) and *pattern* (distinctness).

  3.  **Drafting the Decision Procedure (The Checklist):**
      *   *Goal:* Determine if Population A and Population B constitute distinct "biological species" under the law.
      *   *Step 1: Reproductive Compatibility (The BSC Core).* If they interbreed freely and produce fertile offspring in nature, they are one species. Stop.
      *   *Step 2: Natural Barriers vs. Artificial.* Is isolation due to geography or biology? (Allopatry vs. Sympatry). If allopatric, we can't test interbreeding directly. Need inference.
      *   *Step 3: Gene Flow.* Is there significant genetic exchange?
      *   *Step 4: Asexual Exception.* If no sex, BSC fails. Switch to Phylogenetic/Lineage concept.
      *   *Step 5: The "Grey Zone" (Hybrids/Rings).* Where do we draw the line? This is the value judgement handover.

      *Refining the Steps for the Prompt:*
      *   Need to be explicit about "Sufficient Answer," "Stop (No)," and "Handover."
      *   Need to ensure British English (e.g., "programme," "centre," "analyse").
      *   Need to ensure the philosophical grounding is clear (e.g., referencing the BSC's limits).

  4.  **Developing the Three Case Studies:**
      *   *Case 1: Salamander Ring.* Classic ring species problem. Ends don't interbreed, but connected via intermediates.
          *   *Application:* Step 1 fails (ends don't interbreed). Step 2 (gene flow exists through the ring). Handover point: Is the ring one species or many? Legally, usually treated as one unit if gene flow is continuous, but the ends are distinct. This is a value judgement.
      *   *Case 2: Coral.* Cryptic species. Morphologically identical, partial gene flow.
          *   *Application:* Step 1 (Partial gene flow). Step 3 (DNA distinct). If gene flow is *significant*, they are one species under strict BSC. If gene flow is negligible, they are splitting. This is often a threshold judgement.
      *   *Case 3: Asexual Lizard.* Researcher wants split.
          *   *Application:* BSC is inapplicable (no sex). Must use Lineage concept. However, if the legal framework *strictly* says "biological species," asexuals are a legal paradox. The prompt says the procedure should give an answer they *won't like*.
          *   *Strategy:* If the law defines species biologically (interbreeding), asexual lineages technically cannot be "biological species." Or, if we treat them as lineages, if the researcher wants to split a *single* clonal lineage into two without distinct evolutionary trajectories, the procedure should reject it. Let's go with: The procedure prioritises evolutionary independence. If the "split" is just geographic variation within a single clonal lineage, it gets rejected. Or, more sharply: If the law requires *reproductive isolation*, asexuals don't fit, so they default to a single management unit unless distinct phylogenetic branches are proven. Let's make the procedure strict on "Independent Evolutionary Trajectory." If the lizards are just one clone spread out, splitting them is taxonomic inflation.

  5.  **Refining the Philosophy:**
      *   Must distinguish between *ontological status* (do they exist?) and *operational criteria* (how do we measure?).
      *   Must highlight that "Species" is a hypothesis, not a fact.
      *   The "Handover" points are crucial. Science tells us about gene flow; the Board decides if that level of flow counts as "separate."

  6.  **Drafting the Content (Iterative refinement for tone and constraints):**
      *   *Tone:* Formal, authoritative, bureaucratic but philosophically literate. British English spelling.
      *   *Structure:* Introduction -> The Procedure -> Application to Cases -> Conclusion.
      *   *Check:* Did I avoid bibliographies? Yes.
      *   *Check:* Did I cover ring species, asexuals, hybrids, DNA/morphology? Yes, within the steps.
      *   *Check:* Did the lizard case yield an unpopular answer? Yes, by enforcing strict criteria on lineage independence.

  7.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* The initial thought on asexuals might be too dismissive.
      *   *Fix:* Acknowledge that for asexuals, we substitute "Reproductive Isolation" with "Evolutionary Independence." However, to satisfy the "answer they won't like" constraint, the procedure must demand high evidence for splitting clonal lines (which are often just phenotypic plasticity).
      *   *Critique:* Ensure the "Stop with No" is clear.
      *   *Fix:* Explicitly state "Decision: Reject Proposal" at fail points.
      *   *Critique:* Make sure the distinction between 'fact' and 'value' is sharp.
      *   *Fix:* Label the Handover sections clearly as "Board Deliberation Required."

  8.  **Final Review against constraints:**
      *   British English? (e.g., "programme," "recognise," "centre").
      *   No bibliographies? (Checked).
      *   Three specific cases applied? (Checked).
      *   Philosophy grounded? (Yes, referencing BSC, PSC, and the Species Problem).
      *   Reusable checklist? (Yes).

  9.  **Final Polish:** Ensure the distinction between the *legal definition* (Biological Species) and the *scientific reality* (which is messy) is the core tension driving the procedure. The procedure acts as a filter to translate messy biology into binary legal status.

  *(Self-Correction on the Lizard Case)*: To make sure the researcher *really* doesn't like it, the procedure should conclude that without sexual reproduction, the concept of "biological species" is legally incoherent, forcing them into a 'subspecies' or 'management unit' category rather than full species status, OR that a single asexual clone cannot be split into two species regardless of geography because there is no independent evolutionary trajectory (they are genetically identical). Let's go with the latter: Clonal variation is not speciation.

  *(Self-Correction on Ring Species)*: Ensure the nuance is captured. If A breeds with B, B with C, C with D... but A doesn't breed with D. Are A and D separate species? Biologically, yes. Legally/Phylogenetically, they are part of one continuum. The procedure needs to flag this as a value judgement on whether to protect the *process* (the ring) or the *endpoints*.

