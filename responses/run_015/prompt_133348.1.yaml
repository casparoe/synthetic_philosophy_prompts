answer: |-
  # Board Decision Procedure: Evaluation of Species Status Proposals

  **Document Reference:** LBP-SP-01
  **Authority:** Licensing Board for Protected Wildlife
  **Purpose:** To determine whether submitted populations qualify as distinct 'biological species' under the current legal framework.
  **Philosophical Basis:** This procedure prioritises the **Biological Species Concept (BSC)** as mandated by law (species defined by reproductive isolation). Where the BSC is inapplicable (e.g., asexual taxa), it defaults to the **General Lineage Concept** (species as separately evolving metapopulation lineages). It acknowledges that 'species' are hypotheses about natural kinds, not immutable facts.

  ---

  ## Part 1: The Decision Checklist

  Run the following steps in order. Do not proceed to the next step unless the current step yields an inconclusive or positive result for distinctness.

  ### Step 1: Assessment of Reproductive Compatibility (The BSC Core)
  **Question:** In areas where the two populations occur together (sympatry), do they interbreed and produce fertile offspring naturally?
  *   **Data Required:** Field observations of mating, fertility rates of hybrid offspring, genetic admixture analysis in contact zones.
  *   **Sufficient Answer for 'One Species':** Evidence of frequent, fertile interbreeding without behavioural or physiological barriers.
  *   **Stop Condition (No):** If they interbreed freely and fertile hybrids are common and stable.
      *   *Decision:* **Reject Proposal.** The populations constitute a single biological species.
  *   **Proceed If:** They do not interbreed in sympatry, OR they are geographically separated (allopatric) so direct testing is impossible.

  ### Step 2: Assessment of Gene Flow (Allopatric/Partial Isolation)
  **Question:** Is there significant genetic exchange occurring between the populations, even if rare?
  *   **Data Required:** Population genomics (e.g., F-statistics, coalescent modelling).
  *   **Sufficient Answer for 'One Species':** Evidence that gene flow is sufficient to prevent independent evolutionary trajectories (i.e., alleles are shared frequently enough to keep the gene pool cohesive).
  *   **Stop Condition (No):** If gene flow is high enough to homogenise the populations genetically.
      *   *Decision:* **Reject Proposal.** Distinctness is merely local adaptation, not speciation.
  *   **Proceed If:** Gene flow is negligible or absent.
  *   **Handover Point (Value Judgement):** If gene flow is *low but non-zero* (a hybrid zone). Science can measure the flow, but it cannot define the threshold where 'variation' becomes 'separation'.
      *   *Action:* Flag for **Board Deliberation**. The Board must decide if the level of isolation is sufficient to warrant separate legal protection.

  ### Step 3: Morphological and Ecological Concordance
  **Question:** Do the genetic distinctions correlate with distinct morphological (physical) or ecological traits?
  *   **Data Required:** Morphometrics, niche modelling, behavioural studies.
  *   **Sufficient Answer for 'Separate Species':** Genetic distinctness is supported by consistent physical or ecological differences (cryptic species are acknowledged, but concordance strengthens the case).
  *   **Stop Condition (No):** If DNA suggests distinctness but morphology/ecology is identical *and* there is evidence of recent divergence with ongoing gene flow.
      *   *Decision:* **Reject Proposal.** Likely intraspecific variation or phylogeographic structure, not full species status.
  *   **Proceed If:** DNA and morphology/ecology agree on distinctness, OR DNA shows deep divergence despite morphological stasis.
  *   **Handover Point (Value Judgement):** Cases where DNA and morphology disagree (e.g., high genetic divergence but identical looks).
      *   *Action:* Flag for **Board Deliberation**. The Board must weigh whether genetic history outweighs functional identity for protection purposes.

  ### Step 4: Special Cases (Asexuality and Ring Species)
  **Question:** Does the taxon reproduce sexually?
  *   **If Yes:** Proceed to Step 5.
  *   **If No (Asexual/Clonal):** The BSC is inapplicable. Apply the **Phylogenetic Species Concept**.
      *   **Criterion:** Are the populations distinct monophyletic lineages with fixed diagnostic characters?
      *   **Stop Condition (No):** If the 'split' is based on geographic distance within a single clonal lineage without fixed genetic mutations distinguishing them.
          *   *Decision:* **Reject Proposal.** Geographic variation in a clone is not speciation.
      *   **Proceed If:** Distinct clonal lineages with independent evolutionary histories are proven.
  *   **If Ring Species:**
      *   **Criterion:** Does the chain of interbreeding populations connect the two ends?
      *   **Handover Point (Value Judgement):** If the ends do not interbreed but are connected by intermediates.
          *   *Action:* Flag for **Board Deliberation**. The Board must decide whether to protect the *endpoints* as distinct species or the *ring* as a single evolutionary process.

  ### Step 5: The Independence Test (Final Filter)
  **Question:** If protected separately, would the two populations continue to evolve independently?
  *   **Data Required:** Projection of evolutionary trajectories.
  *   **Sufficient Answer for 'Separate Species':** Yes, they are on independent evolutionary paths.
  *   **Stop Condition (No):** If they are likely to merge upon secondary contact or are merely transient forms of a single lineage.
      *   *Decision:* **Reject Proposal.**
  *   **Handover Point (Value Judgement):** In all cases where scientific data is ambiguous (e.g., early-stage speciation).
      *   *Action:* **Final Board Vote.** Science provides the probability of independence; the Board assigns the legal status.

  ---

  ## Part 2: Application to Current Proposals

  The following applies the procedure above to the three submissions currently on the docket.

  ### Proposal A: The Valley Salamander Ring
  **Submission:** Biologists request listing the northern and southern endpoints of a salamander ring as two separate species. The populations around the valley interbreed sequentially, but the endpoints meet at the top of the valley and do not interbreed.
  **Procedure Run:**
  1.  **Step 1 (Reproduction):** Endpoints do not interbreed. *Proceed.*
  2.  **Step 2 (Gene Flow):** Gene flow exists through the ring intermediates. *Proceed.*
  3.  **Step 4 (Ring Species):** This is a classic ring species scenario. The endpoints are reproductively isolated, but connected via gene flow through the chain.
  **Handover Point:** Step 4 identifies this as a Value Judgement.
  **Board Analysis:** Under a strict Biological Species Concept, the endpoints behave as distinct species where they meet. However, they are genetically connected via the rest of the ring. Listing them as separate species legally severs a continuous evolutionary process.
  **Decision:** **Handover to Board Deliberation.**
  *Recommendation:* Do not list as separate species. Protect the entire ring as a single 'Evolutionary Significant Unit'. Splitting them legally creates an unenforceable boundary where biology shows a continuum.

  ### Proposal B: The Cryptic Coral
  **Submission:** Two coral populations look identical but show 5% genetic divergence. There is a hybrid zone where they meet, with 10% of individuals being hybrids.
  **Procedure Run:**
  1.  **Step 1 (Reproduction):** They interbreed in the contact zone. *Proceed.*
  2.  **Step 2 (Gene Flow):** There is gene flow (hybrids exist), but is it 'significant'? 10% hybridisation suggests barriers are permeable but present. *Proceed.*
  3.  **Step 3 (Morphology):** Morphology is identical (cryptic). DNA and morphology disagree.
  **Handover Point:** Step 3 identifies this as a Value Judgement.
  **Board Analysis:** The law protects 'biological species'. Under the BSC, if gene flow is maintaining cohesion, they are one species. However, 5% divergence suggests they are separating. The 10% hybrid rate is the threshold question.
  **Decision:** **Handover to Board Deliberation.**
  *Recommendation:* Reject separate species status for now. 10% introgression suggests the speciation process is incomplete. List as a single species with two protected 'Management Units' to preserve the genetic distinctness without violating the legal definition of a species.

  ### Proposal C: The Asexual Lizard (The Unpopular Decision)
  **Submission:** A researcher proposes splitting a population of parthenogenetic (asexual) lizards into two species based on a mountain range separation. The lizards are clones. The researcher argues they have been separated for 10,000 years and show slight mitochondrial DNA variation.
  **Procedure Run:**
  1.  **Step 1 (Reproduction):** Taxon is asexual. BSC is inapplicable. *Switch to Step 4 (Special Cases).*
  2.  **Step 4 (Asexuality):** Apply Phylogenetic Species Concept. Are they distinct monophyletic lineages with fixed diagnostic characters?
      *   *Evidence:* The lizards are clonal. The genetic variation is minor mitochondrial drift within a single clone lineage. There are no fixed nuclear mutations distinguishing the two groups, only geographic distance.
  3.  **Step 4 Stop Condition:** The proposal relies on geographic separation within a single clonal lineage without fixed diagnostic characters.
  **Decision:** **Reject Proposal.**
  **Rationale:** This is the answer the researcher will not like. In asexual organisms, 'speciation' requires the establishment of independent evolutionary lineages (distinct clones). Mere geographic separation of the *same* clone is not speciation; it is dispersal. To grant them separate species status would be to classify distance as biology. Under our framework, they remain a single biological unit until distinct clonal lineages evolve. Protecting them as one species does not preclude protecting both geographic populations, but it denies the taxonomic inflation requested.

  ---

  ## Part 3: Guidance for Board Members

  When a case reaches a **Handover Point**, remember the following philosophical distinctions:

  1.  **Process vs. Pattern:** Science describes the *process* of speciation (which is gradual). The Law requires a *pattern* (binary status: protected or not). You are drawing a line on a gradient. There is no 'correct' scientific answer here, only a legally defensible one.
  2.  **Ontology:** Do not ask "What *are* they?" Ask "What is the most prudent category for conservation?" Sometimes, lumping protects the evolutionary process (the salamander ring); sometimes, splitting protects unique genetic heritage (the coral).
  3.  **Precedent:** Your decision sets a precedent for how the Board interprets 'biological species'. Consistency is more important than accommodating every new taxonomic paper.

  **End of Procedure.**
