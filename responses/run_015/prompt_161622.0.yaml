  Your ordering is correct. Labeling invites defensiveness; eliciting invites investment. Write "MEANING = ?" on the board. Collect answers ("concept," "vector," "image"). Hold "externalism" until the conclusion.

  **The Example**
  Use standard Twin Earth. Your mixed-lake variant undermines the core intuition: that Oscar and Twin-Oscar are *intrinsic duplicates*. If Twin Earth lakes vary, Twin-Oscar's causal history becomes ambiguous, allowing internalists to claim their mental states differ based on local exposure. Standard Twin Earth isolates the environment as the sole variable. Hesperus/Phosphorus addresses identity, not content individuation. Burge's Arthritis is vital for social externalism but introduces normative community standards too early; stick to physical environment first to isolate the mechanism.

  **Sequence & Misconception Map**
  1.  **Setup:** Describe Earth/Twin Earth. Stipulate intrinsic identity. *Head off (d) Matrix:* Explicitly state no deception. This isn't skepticism about existence, but individuation.
  2.  **The Turn:** Reveal H2O vs. XYZ. Ask if extension differs. When they agree, ask if meaning differs. *Head off (b) Empirical Revision:* Clarify this isn't about current chemistry knowledge, but what *fixes* reference across possible worlds. It's a modal point, not a scientific bet.
  3.  **The Mind:** Ask if Oscar knows what he means. *Head off (a) Authority:* Distinguish knowing *that* you think from knowing *what* your thought contains. Authority remains over the occurrence, not the content's boundaries. Place this here, not at the end, or they will stew in it.
  4.  **Generalization:** *Head off (e) Natural Kinds Only:* Briefly note 'arthritis' works similarly via social community, not just microstructure. *Head off (c) Pure Causality:* Emphasize it's not just contact, but the *nature* of the contact fixing the sortal. Avoid behaviorism; the internal state is real, just not sufficient for content.

  **Closing**
  Ask: "If two AIs have identical weights but train on Earth vs. Twin Earth data, do their 'water' vectors differ?" If they say yes, they grasp externalism applies to functional roles too. If no, they cling to internalism. This tests application, not slogan recall.

  **Refusal**
  Openly refuse the "Skepticism/Brain-in-a-Vat" deep dive. It conflates externalism with idealism and consumes the session. Keep focus on content individuation. Similarly, do not enter the "Privileged Access" literature; it is a rabbit hole that shifts focus from semantics to epistemology. Stay on the mind-language interface.
