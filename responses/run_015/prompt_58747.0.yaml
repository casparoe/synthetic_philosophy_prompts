  8.  **Final Polish:** Check against the "Tragedy of the Commons" definition. Ensure I'm distinguishing between the *resource* (tools) and the *maintenance* (labor). The labor aspect is actually more critical here. The "Tragedy" is usually about over-consumption, but here it's also under-maintenance. I need to make sure that distinction is clear.

