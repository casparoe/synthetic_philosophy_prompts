      *   *Closing:* Encouragement. It's about governance, not just money.

  7.  **Refining for Tone and Constraints:**
      *   *Constraint:* "I dont need a theory lecture." -> Keep Ostrom mention minimal, focus on mechanics.
      *   *Constraint:* "2 or 3 biggest implications." -> Stick to that structure.
