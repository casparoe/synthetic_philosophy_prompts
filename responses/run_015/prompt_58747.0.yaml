answer: |-
  First, tell the person who suggested shutting it down that they're quoting Garrett Hardin (1968), but ignoring Elinor Ostrom (1990). Hardin said commons *always* fail without privatization or government. Ostrom won a Nobel Prize for proving that communities can self-manage commons successfully if they have the right rules.

  You aren't in a "tragedy" yet; you're in a **governance crisis**. The theory implies three specific things for your shed. Here is what is stuck, what is fixable, and what to do first.

  ### The 3 Implications for Your Shed

  **1. Rivalry is Real (The "Saturday Morning" Problem)**
  *   **The Theory:** A "commons" fails when a resource is *rivalrous* (if I use it, you can't) but *non-excludable* (everyone has access). Your two mowers are the bottleneck.
  *   **What's Stuck:** You cannot make the mowers non-rivalrous. No matter how nice people are, only one household can mow at a time. If demand exceeds supply on Saturdays, someone will be mad.
  *   **What's Fixable:** You can manage *access*. First-come-first-served encourages racing. A reservation system encourages planning.
  *   **The Fix:** Implement a simple Google Calendar or booking app. You can book a mower for a 4-hour block. If you don't show up, you lose booking privileges for a month. This stops the "race to the garage" and reduces friction.

  **2. Privatized Gain, Socialized Pain (The "Dirty Tool" Problem)**
  *   **The Theory:** Individuals get 100% of the benefit of using the tool quickly/roughly, but the cost of repair/cleaning is spread across all 27 households. Therefore, the rational selfish choice is to be sloppy.
  *   **What's Stuck:** You cannot rely on altruism. People will always prioritize their Saturday afternoon over cleaning a hedge trimmer for the next guy.
  *   **What's Fixable:** You can re-couple the cost to the user.
  *   **The Fix:** The "Clean Return" Policy. You need a mechanism where the user feels the pain of a dirty tool.
      *   **Idea:** A $20 "cleaning deposit" added to the $35 fee, refunded if the tool is returned clean/sharpened.
      *   **Idea (Lower friction):** A "Two-Strike" rule. If a tool comes back dirty/broken and unreported, you get a warning. Second time, you lose access for the season. No refund. This requires you to actually inspect, but it shifts the social norm from "oops my bad" to "this has consequences."

  **3. The Labor Subsidy (The Real Tragedy)**
  *   **The Theory:** This is the big one. You and the other guy are the *actual* commons. You are providing a public good (maintenance) that everyone consumes. Currently, 25 households are free-riding on your labor. This is mathematically unsustainable.
  *   **What's Stuck:** You cannot force people to volunteer. The "Fix-It Saturday" failed because voluntary labor is the first thing people cut when busy.
  *   **What's Fixable:** You can make labor mandatory *or* monetize the opt-out.
  *   **The Fix:** The "Sweat or Pay" Model.
      *   Every household must contribute 2 hours of labor/year (sharpening, cleaning, organizing).
      *   **Crucial:** If they don't want to do the labor, the fee jumps from $35 to $100.
      *   This does two things: It gets you more helpers, OR it gives you the cash to buy a third mower or pay a local teen to do the sharpening. It stops you from subsidizing the neighbors.

  ### What to Try First (Low Cost, High Impact)

  Don't raise the base fee yet; that punishes the good actors. Change the rules of engagement.

  1.  **Kill the Notebook, Go Digital:** The notebook is anonymous. Switch to a free Google Form or a shared calendar for sign-outs. It creates a digital trail. If a mower breaks, you know who had it last.
  2.  **The "Condition Check" Rule:** When you sign out a tool, you must check a box that says "I accept this tool in working condition." When you return it, you check "I am returning this clean and working." If you check "working" and it's broken, you own the repair cost. This stops the "it was already broken" lie.
  3.  **Call a Meeting, But Change the Agenda:** Don't ask "Who wants to volunteer?" Ask "Do we want to pay $35 and do 2 hours of work, or pay $100 and do nothing?" Force them to choose the model.

  **Summary:** The tragedy isn't that the tools are breaking; it's that **you two are the battery powering the shed.** If you burn out, the shed dies. The theory says you must either exclude non-contributors or charge them for their consumption of your labor. Pick one, write it down, and enforce it.
