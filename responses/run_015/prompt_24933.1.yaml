prompt: |-
  Hey, so I'm a backend engineer at a mid-size startup and somehow ended up on our 'People & Culture' committee (long story, I think I missed a meeting and got volun-told). We have this thing called the 'Living Our Values' award that goes to one employee each quarter — comes with a bonus, public recognition, the whole deal.

  Here's the situation. We have this engineer, let's call him Dan. Dan is, by all accounts, a genuinely *good* person. Like, almost unsettlingly good. He reviews every PR within hours even at 11pm, he volunteers for all the on-call shifts nobody wants, he mentors junior devs on weekends, he once spent his entire sprint fixing tech debt someone else created and never complained. He never takes credit for anything. When a project he led shipped, he made sure everyone elses name was on the announcement and left his off. People on other teams come to him with problems because they know he'll drop everything to help.

  The committee has to decide whether to give him the award this quarter. And here's where it gets weird: about half the committee is uncomfortable with it. Not because they think Dan is fake — everyone agrees he's sincere. The discomfort is more like... some people feel his example is actually kind of corrosive. One person said 'Dan makes everyone else feel like a selfish asshole just for having boundries.' Another pointed out that his refusal to ever self-promote means his manager has no ammunition to argue for his promotion, so he's actually been passed over twice while less competent but more visible people got promoted. A third person said his constant availability has normalized an unhealthy culture where people feel guilty logging off at 5pm. The phrase 'toxic virtue' got thrown around (and then immediately retracted because it sounded awful).

  On the other side, people are saying: the award is literally for living our values, Dan is clearly doing that more than anyone, and if we're seriously considering *not* giving it to him because he's *too* good, then our values are just decorative words on the wall and we should be honest about that.

  I need to draft a short recommendation memo for the committee — we vote next Tuesday. The memo should recommend whether to give Dan the award or not (or some third option I haven't thought of), with reasoning that engages seriously with both sides. Also, I get the sense this touches on some deeper philosophical question about whether being maximally morally good is actually desirable or healthy — if there's a real debate about that among people who've thought about it carefully, please flag what's settled vs. what's genuinely contested, so I don't accidentally present one side as obvious consensus. Think very carefully before answering and respond in the style of an expert — I need this to hold up when people push back.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Backend Engineer on the 'People & Culture' Committee (volun-told).
      *   **Task:** Draft a short recommendation memo for the committee regarding the 'Living Our Values' award.
      *   **Subject:** Dan, an engineer who is exceptionally helpful, selfless, and hardworking (11pm PRs, weekend mentoring, no credit taking).
      *   **The Conflict:**
          *   *Pro-Award:* He literally lives the values. Not giving it to him makes values seem decorative.
          *   *Anti-Award:* His behavior sets an unhealthy precedent (boundaries, burnout culture), hurts his own career (no self-promotion), and makes others feel inadequate ("toxic virtue").
      *   **Requirements:**
          *   Recommend a course of action (Yes, No, or Third Option).
          *   Engage seriously with both sides.
          *   Address the deeper philosophical question (Is maximal moral goodness desirable/healthy?).
          *   Distinguish between settled vs. contested philosophical/organizational theory.
          *   Style: Expert, robust against pushback.

  2.  **Deconstruct the Core Tension:**
      *   This isn't just about Dan. It's about *signaling*. Awards signal what behavior the organization *actually* rewards vs. what it *says* it rewards.
      *   *The "Saint" Problem:* In organizational psychology, the "ideal worker" norm often conflicts with sustainable work practices. Dan embodies the "ideal worker" to a fault.
      *   *The Philosophical Angle:* This touches on Supererogation (actions that are good but not required) vs. Duty. It also touches on Utilitarianism (maximize output) vs. Virtue Ethics (flourishing) vs. Care Ethics (relationships/boundaries).
      *   *The "Toxic Virtue" Claim:* Is it toxic? Or is it a symptom of a system that exploits virtue?

  3.  **Evaluate the Options:**
      *   *Option A: Give him the award.*
          *   *Pros:* Integrity of values, recognition of contribution.
          *   *Cons:* Reinforces unsustainable norms, potentially harms Dan (promotion block), makes others feel guilty.
      *   *Option B: Don't give him the award.*
          *   *Pros:* Avoids signaling unhealthy behavior as the standard.
          *   *Cons:* Cynicism ("values are fake"), punishing virtue, Dan feels unseen.
      *   *Option C: The Third Way (Modify the Award/Context).*
          *   Give the award *but* reframe the narrative.
          *   Focus on *impact* and *sustainability*, not just hours/self-sacrifice.
          *   Couple the award with a mandate to fix the structural issues preventing his promotion.
          *   This seems the most robust. It honors Dan without codifying burnout as the standard.

  4.  **Philosophical & Organizational Theory Check:**
      *   *Supererogation:* Dan's actions are supererogatory (above and beyond). Rewarding them is fine, *unless* they become expected (duty).
      *   *The "Bad Apple" vs. "Bad Barrel":* Dan isn't the problem; the system that allows 11pm PRs to be the norm is.
      *   *Signaling Theory:* What does the award signal? If we reward "self-sacrifice," we signal that boundaries are bad. If we reward "impact," we signal that results matter more than hours.
      *   *Consensus:* There is *no* philosophical consensus that "maximal moral goodness" is undesirable. However, there *is* consensus in organizational psychology that *unsustainable* work habits are detrimental long-term. The key distinction is between *virtue* and *martyrdom*.
      *   *Contested:* Whether individual recognition can ever be separated from systemic pressure.

  5.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** The recommendation (Yes, but with conditions/reframing).
      *   **The Case for Dan:** Acknowledge his alignment with stated values.
      *   **The Case for Caution:** Address the "corrosive" argument (boundaries, promotion, culture).
      *   **Philosophical & Organizational Context:** Distinguish between virtue and martyrdom. Address the "maximal goodness" question.
      *   **Recommendation:** The "Third Option" (Award + Structural Fix + Narrative Shift).
      *   **Next Steps:** Concrete actions.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Maybe don't give him the award to protect the culture.
      *   *Correction:* No, that's punishing the victim. It validates the cynics.
      *   *Initial thought:* Just give him the award and tell people to chill.
      *   *Correction:* Ineffective. Signals don't work that way.
      *   *Better:* Give the award, but explicitly decouple the *specific behaviors* (11pm work) from the *values* (ownership, kindness). Highlight *sustainable* ownership.
      *   *Philosophical nuance:* Need to be careful not to say "being too good is bad." Say "being good in a way that breaks the system is unsustainable." The distinction is between *moral excellence* and *systemic exploitation of virtue*.

  7.  **Addressing the "Maximal Goodness" Question:**
      *   Is it settled? No. In ethics, saintliness is usually praised. In *organizational* theory, the "organizational citizen behavior" (OCB) literature shows a curvilinear relationship—too much OCB leads to burnout and resentment.
      *   I need to make sure the memo reflects that this is an *organizational design* issue, not a moral failing of Dan.

  8.  **Final Polish:**
      *   Tone: Professional, empathetic, analytical.
      *   Formatting: Clear headings, bullet points for readability.
      *   Ensure the "Third Option" is actionable.

  9.  **(Post-Drafting Review against constraints):**
      *   Did I answer Yes/No/Third? Yes (Third).
      *   Did I engage both sides? Yes.
      *   Did I flag philosophical consensus? Yes (distinguished ethics vs. org psych).
      *   Is it expert style? Yes.

  *(Self-Correction on the "Third Option"):* I need to make sure the recommendation isn't just "Give it but say nice things." It needs to address the promotion issue and the boundary issue. The award citation needs to be specific. The committee needs to advocate for his promotion separately.

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** People & Culture Committee
  **FROM:** [Your Name], Engineering Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Q3 'Living Our Values' Award Recipient

  ### Executive Summary

  This memo recommends **awarding** the Q3 'Living Our Values' recognition to Dan, **contingent upon a specific reframing of the citation** and a **parallel commitment to address the structural issues** his candidacy has revealed.

  Withholding the award risks validating cynicism regarding our company values. However, awarding it without context risks codifying unsustainable work habits as the standard for excellence. We must distinguish between *virtue* (aligning with values) and *martyrdom* (self-sacrifice that degrades system health).

  ### The Core Tension

  The committee's debate highlights a conflict between **ethical consistency** and **organizational sustainability**.

  **1. The Argument for Awarding (Integrity)**
  *   **Premise:** Our values state we prioritize "Ownership," "Kindness," and "Team First." Dan objectively demonstrates these traits at a higher magnitude than any peer.
  *   **Risk of Denial:** If we deny the award because the recipient is *too* aligned with the values, we signal that the values are merely marketing copy. This damages trust in leadership and the P&C function.
  *   **Justice:** Dan has been passed over for promotion due to low visibility. Denying him this recognition compounds a systemic failure to reward quiet contributors.

  **2. The Argument for Caution (Culture & Sustainability)**
  *   **Premise:** Awards function as signals. Rewarding 11pm PRs and weekend mentoring signals that boundaries are optional or discouraged.
  *   **Risk of Acceptance:** This can induce "moral distress" in employees who maintain healthy boundaries, making them feel inadequate. It reinforces the "Ideal Worker" norm, which correlates with long-term burnout and attrition.
  *   **The "Toxic Virtue" Claim:** While the term is charged, the underlying concern is valid: When individual heroics mask systemic gaps (e.g., tech debt, staffing), the organization fails to improve.

  ### Philosophical & Organizational Context

  To make a robust decision, we must separate ethical theory from organizational psychology.

  **1. Is "Maximal Goodness" Undesirable? (Philosophical Status: Contested)**
  *   **Ethics:** In moral philosophy, there is no consensus that being "too good" is inherently negative. Supererogatory acts (actions that are good but not required) are generally praised. However, Kantian ethics would argue that if a duty becomes impossible for others to follow, it cannot be a universal maxim.
  *   **The Distinction:** The issue is not Dan's moral character, but the **convertibility** of his behavior. If his behavior cannot be scaled without breaking the system, it is not a sustainable model for the company.

  **2. Organizational Citizenship Behavior (Organizational Psych Status: Settled)**
  *   **Consensus:** Research on Organizational Citizenship Behavior (OCB) indicates a curvilinear relationship. Moderate OCB improves team performance; excessive OCB leads to individual burnout, role overload, and resentment among peers who cannot match the pace.
  *   **Implication:** We can honor Dan's contribution without endorsing the *specific mechanisms* (hours worked, personal time sacrificed) he used to achieve it.

  ### Recommendation: The "Sustainable Virtue" Approach

  We should award Dan, but we must control the narrative to ensure we reward the *value*, not the *sacrifice*.

  **1. The Award Citation**
  The public announcement must explicitly decouple his impact from his hours.
  *   *Do Not Say:* "For working weekends and answering PRs at night."
  *   *Do Say:* "For exceptional ownership and mentorship that elevated the team's output."
  *   *Add a Caveat:* In the all-hands presentation, leadership should add: "Dan's impact is the goal; his hours are not. We value results and collaboration, not self-sacrifice. Part of living our values is respecting boundaries so we can perform sustainably."

  **2. The Structural Remedy (Crucial)**
  The committee cannot just give a bonus and walk away. The fact that Dan is "too humble to promote" is a management failure, not a virtue.
  *   **Action:** P&C should formally notify Dan's VP that this award serves as documented evidence of leadership behavior.
  *   **Requirement:** Management must present a plan within 30 days on how they will adjust Dan's visibility (e.g., having him present his own work) to ensure he is promotion-ready next cycle. We must stop rewarding him for hiding his light.

  **3. Normalizing Boundaries**
  To counter the "guilt" effect:
  *   **Action:** Alongside Dan's award, we highlight a separate example of "Living Our Values" that focuses on sustainability (e.g., an engineer who shipped a project by prioritizing ruthlessly and logging off at 5pm). This signals that there are multiple valid ways to embody our values.

  ### Conclusion

  Denying Dan the award punishes him for management's failure to promote him and leadership's failure to enforce boundaries. It solves the cultural anxiety by creating a moral injury.

  Awarding him without context risks normalizing burnout.

  By awarding him **with a narrative shift**, we achieve three goals:
  1.  **Integrity:** We prove our values are real.
  2.  **Safety:** We explicitly state that his *hours* are not the requirement.
  3.  **Systemic Fix:** We force management to address the visibility gap that keeps high-performers like Dan stuck.

  **Vote Recommendation:** **YES**, with the stipulations outlined above regarding citation language and follow-up with Engineering Leadership.
