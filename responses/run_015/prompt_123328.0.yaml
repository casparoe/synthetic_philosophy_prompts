prompt: |-
  I'm a PhD student in American literature with a secondary field in intellectual history, writing a seminar paper on Harriet Beecher Stowe's *Uncle Tom's Cabin* as a piece of moral technology: a text designed to do something, not merely to say something. I'd like a reading of the novel through the philosophical literature on moral revolutions — specifically, the skeptical position associated with Bernard Williams, on which practices like Atlantic slavery did not end because anyone was argued out of them (the arguments were largely in place well before the practice was), and what did the work was change in economic and social structure; and, against it, the honor-based account associated with Kwame Appiah, on which the decisive variable is neither belief nor interest but what a relevant community can afford to be *known* doing, so that a revolution consists in a once-honorable practice becoming dishonorable.

  I want a reading, not a survey of the debate. Three things in particular.

  First: which causal story does the novel itself imply? I don't mean whether the novel caused anything. I mean whether the picture it gives of what sustains slavery — the motives it assigns to Haley, to the Shelbys, to St. Clare, to Legree, to Ophelia, the reasons its characters actually give for what they do — is an interest story or an honor story, and whether Stowe's own confidence that a book could matter is evidence for something neither of them has.

  Second, I think the argument / interest / honor trichotomy is too coarse, and I want you to press on the distinction I'm using. Distinguish conversion (getting an agent to accept a proposition she previously rejected) from re-coordination (changing what it costs her to be *seen* acting as she did) from a third thing I'll call availability: changing which features of a practice are perceptible as normative considerations at all, before anyone accepts or rejects anything. My suspicion is that the novel's real strategy — what it stages, what it puts in front of the reader's attention in scenes like the opening sale, Eliza's crossing, Tom's death, George Harris's defiance, the ending's emigration scheme — is best described as availability, and that availability is not reducible to either Williams's mechanism or Appiah's. Argue for or against that; I'd rather be talked out of it now than in front of my committee.

  Third, the hard case: the honor-centered reading has to explain the afterlife. The name of Stowe's hero is now a term of contempt for exactly the patient, nonresistant endurance the novel presents as his greatness — the revolution turned and disgraced the conduct its canonical text ennobled. Does an honor-based account predict that overshoot, or does it show that honor only ever borrows its content from something else?

  Please be committed rather than even-handed: take a definite position on whether the novel vindicates Williams, Appiah, or neither, name the two or three scenes that carry the weight for you, then name the scene or device that most resists your reading and say what you'd have to find in the text to give it up. I don't need citations or a bibliography — I need a reading that lets the novel push back on the philosophy, rather than decorating a position I already hold.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** PhD student in American Literature/Intellectual History.
      *   **Topic:** *Uncle Tom's Cabin* (UTC) as "moral technology."
      *   **Theoretical Framework:** Moral Revolutions (Bernard Williams vs. Kwame Appiah).
          *   *Williams:* Skeptical. Arguments don't change minds; structural/economic shifts end practices.
          *   *Appiah:* Honor-based. Practices end when they become dishonorable within a community (social coordination/shame).
      *   **User's Hypothesis:** The Williams/Appiah trichotomy (Argument/Interest/Honor) is too coarse. Proposes a third category: *Availability* (changing what features of a practice are perceptible as normative considerations).
      *   **Tasks:**
          1.  Determine which causal story UTC *itself* implies (Interest vs. Honor vs. Something Else).
          2.  Evaluate the "Availability" hypothesis against Williams and Appiah. Argue for or against it.
          3.  Address the "Hard Case": The reversal of Tom's honor (from martyr to pejorative). Does Appiah's model predict this?
          4.  **Constraint:** Be committed, not even-handed. Take a definite position. Name key scenes. Name the resisting scene/device and what would change the mind. No citations/bibliography needed. Focus on the novel pushing back on the philosophy.

  2.  **Deconstruct the Theoretical Positions:**
      *   *Williams:* Slavery ended because it became economically inefficient or politically untenable, not because slaveholders read philosophy and repented. Moral argument is epiphenomenal.
      *   *Appiah:* Slavery ended because the *honor code* shifted. It became shameful to own slaves. It's about social coordination and reputation.
      *   *User's "Availability":* Before you can be shamed or convinced, you have to *see* the act differently. It's about perceptual framing. Making the invisible visible (e.g., the separation of families).

  3.  **Analyze *Uncle Tom's Cabin* (UTC) through these lenses:**
      *   *Does UTC argue?* Yes, constantly. But does it think argument works? Stowe thinks feeling leads to action.
      *   *Does UTC appeal to honor?* Yes, especially with the Shelbys and St. Clare. They know it's wrong but do it for "necessity" or "custom."
      *   *Does UTC change availability?* Yes, by domesticating the political. Making the slave trade a *family* issue.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the prompt. State the thesis clearly. *Thesis:* UTC vindicates neither Williams nor Appiah fully; it operates primarily through *Availability*, but specifically a theological-affective availability that precedes honor. However, the "Tom" reversal suggests Appiah was right about the fragility of honor, but wrong about its source.

      *   **Task 1: The Novel's Implied Causal Story.**
          *   Look at the villains and the wavering.
          *   *Haley:* Pure interest (Williams). He is unredeemable. The novel treats him as a force of nature, almost.
          *   *The Shelbys:* Honor/Custom. They are "kind" but sell Tom. They are the target.
          *   *St. Clare:* The intellectual. He *knows* it's wrong (has the arguments) but does nothing. He represents the failure of Williams's "argument" model. He dies without acting.
          *   *Legree:* Brutal interest, but also a rejection of Southern honor codes.
          *   *Ophelia:* Northern prejudice. She has the *theory* of abolition but can't touch the reality (Topsy).
          *   *Conclusion on Task 1:* The novel implies that *knowledge* (St. Clare) and *interest* (Haley) are insufficient. It targets the *affections* to make the abstract concrete. It implies a causal story where *seeing* (availability) triggers *feeling*, which forces a re-evaluation of honor. It's not just "it's shameful," it's "look at this child crying."

      *   **Task 2: Evaluating "Availability" vs. Williams/Appiah.**
          *   User's definition: Changing which features are perceptible as normative.
          *   *Argument:* I need to support the "Availability" hypothesis but refine it. It's not just perceptual; it's *ontological* in the social sense.
          *   *Key Scenes:*
              1.  *The Opening Sale (Shelby/Haley):* Makes the bureaucratic visible. The check is signed while Harry plays.
              2.  *Eliza's Crossing:* Makes the abstract "fugitive" into a physical, maternal body.
              3.  *Tom's Death:* The ultimate visibility of the soul vs. the body.
          *   *Critique of Availability:* Is it reducible? Appiah says honor is about what you can be *seen* doing. Availability is about what you can *see*. They are reciprocal.
          *   *My Position:* I will argue *for* Availability as the primary mechanism, but claim it is the *precondition* for Appiah's honor shift. You can't be shamed for what you don't perceive as harmful. Williams is wrong because the novel treats economic interest as secondary to moral perception (Legree fails because he is spiritually blind, not just greedy).
          *   *Refinement:* Call it "Affective Availability." It's not just seeing the chain; it's feeling the snap.

      *   **Task 3: The Hard Case (Tom's Legacy).**
          *   Why did "Uncle Tom" become a slur?
          *   Appiah's model: Honor is contingent on the community. If the community changes (Black Power movement, post-WWII), the honor code changes. Submission is no longer honorable; resistance is.
          *   Does this predict the overshoot? Yes, because honor is external. It relies on the audience.
          *   *The Twist:* Stowe's theology vs. Social Honor. Tom's honor was *divine*, not social. The slur proves that social honor (Appiah) cannibalized theological honor (Stowe).
          *   *Conclusion:* The reversal shows Appiah is right about *social* honor, but Stowe was aiming for a *transcendent* honor that social movements inevitably secularize and invert.

      *   **Task 4: Commitment & Falsification.**
          *   *Position:* UTC vindicates the "Availability" thesis (specifically Affective Availability) as the engine that drives the Honor shift. Williams is rejected (St. Clare proves argument fails). Appiah is partially accepted but shown to be superficial compared to Stowe's theological realism.
          *   *Weight-bearing Scenes:* The Shelby Sale (availability of the market), Tom's Death (availability of the soul).
          *   *Resisting Scene:* George Harris's escape/defiance. He uses the language of revolution and honor (fighting back). He fits Appiah better than the "Availability" model.
          *   *Falsification Condition:* If the text consistently showed economic pressure forcing the Shelbys' hand regardless of their feelings, or if Tom's death was portrayed as futile rather than redemptive.

  5.  **Refining the Tone:**
      *   Must be academic but direct. No hedging ("on the one hand...").
      *   Engage the philosophy seriously.
      *   Show deep knowledge of the text.
      *   Address the "moral technology" aspect.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish Conversion, Re-coordination, and Availability clearly?
      *   *Adjustment:* Make sure to define Availability not just as "noticing" but as "making a normative claim perceptible."
      *   *Check:* Did I address the "Tom" slur sufficiently?
      *   *Adjustment:* Ensure I link the slur to the shift from religious honor to political honor.
      *   *Check:* Did I name the resisting scene?
      *   *Adjustment:* George Harris is the best candidate. He represents the "Argument/Interest" model (fighting for rights) rather than the "Availability/Honor" model (suffering to reveal truth).

  7.  **Final Polish:** Ensure the distinction between Stowe's *intent* (moral technology) and the *reception* (the slur) is clear in the Appiah section. (Stowe wanted to shift availability; the public shifted honor; later generations shifted honor again).

  8.  *(Final thought before writing)*: The prompt asks me to be committed. I should argue that "Availability" is the strongest lens, but that Stowe's specific version of it (sentimental theology) contains the seeds of its own destruction, which explains the "Tom" slur better than Appiah alone.

