answer: |-
  Here is a reading of *Uncle Tom's Cabin* as moral technology, committed to the position that the novel vindicates neither Williams nor Appiah exclusively, but rather exposes a prior mechanism—**Affective Availability**—which your trichotomy identifies correctly as the distinct third term. However, I will argue that while Availability drives the moral revolution within the text, the novel's afterlife (the "Tom" slur) vindicates Appiah's skepticism about the stability of honor, revealing that Stowe's technology was too dependent on a theological consensus that secular modernity could not sustain.

  ### I. The Novel's Implied Causal Story: The Failure of Argument and Interest

  If we look at the internal economy of motivation in *Uncle Tom's Cabin*, Stowe explicitly rejects the Williams thesis (interest/structure) and complicates the Appiah thesis (honor) by inserting a theological prerequisite.

  The novel's diagnostic of slavery is found in the character of Augustine St. Clare. St. Clare is the control group for the Williams/Appiah debate. He possesses the **arguments** (he knows slavery is wrong intellectually) and he is insulated from the **interest** (he is wealthy enough to manumit without ruin). Yet, he does nothing. He represents the failure of the Williams model: knowing the structural evil and having the arguments against it does not end the practice. He also represents a limit of the Appiah model: St. Clare is indifferent to the honor of his peer group (he mocks Southern chivalry), yet he still remains complicit.

  St. Clare dies without acting. His death is the novel's philosophical pivot: *Intellectual assent is inert.*

  Conversely, consider Haley. He is pure Williamsian interest. But the novel does not treat him as the primary engine of slavery; it treats him as a symptom. The true engine is the "kind" master, Mr. Shelby. Shelby acts against his own stated honor ("I wouldn't sell a child from its mother") because of economic pressure. But Stowe does not let economics off the hook; she makes the economic *visible* as a moral choice. When Shelby signs the bill of sale, the novel does not frame it as "he had no choice." It frames it as "he chose money over a moral intuition he possessed."

  Therefore, the causal story the novel implies is this: Slavery persists not because of interest (Williams) or lack of shame (Appiah), but because the **human cost is rendered invisible to the moral imagination.** The "moral technology" of the book is not to argue (St. Clare already agrees), nor merely to shame (Shelby is already uneasy), but to make the abstract consequence *perceptually available*.

  Stowe's confidence that a book could matter rests on a specific anthropology: that human beings are motivated not by reason or reputation alone, but by *feeling*, and feeling requires an object. You cannot feel for a "system." You can only feel for a child. The novel implies that if you make the suffering available to the senses, the will *must* move. This is why St. Clare fails (he feels but doesn't *see* the urgency) and why Ophelia fails (she sees the theory but can't *touch* the black body). The causal mechanism is **perceptual conversion**.

  ### II. Availability vs. Honor and Interest

  Your distinction holds, and I argue **for** Availability as the primary mechanism, but with a crucial refinement: Availability is not just cognitive; it is *ontological*. It changes what kind of thing the reader believes slavery *is*.

  Williams says structures change practices. Appiah says honor codes change practices. Both assume the practice is stable and the *evaluation* of it changes. Availability argues that the practice *itself* changes because its constituent parts are revealed.

  **The Weight-Bearing Scenes:**

  1.  **The Opening Sale (Shelby/Haley):** This scene is not about interest; it is about **categorization**. To Shelby, Tom is a "hand" and Harry is a "boy." To Haley, they are "stock." To the reader, via Eliza's overhearing, they become "a mother and a son." The moral technology here is the collapse of the bureaucratic distance. The novel forces the reader to occupy the space between the signing of the check and the crying of the child. This is Availability: making the transactional *relational*. Williams cannot explain this because the economic structure hasn't changed yet; Appiah cannot explain it because Shelby isn't worried about reputation yet (it's a private sale). The normativity shifts because the *object* of the action has been re-described.
  2.  **Eliza's Crossing:** This is the visual anchor of Availability. Abolitionist argument spoke of "liberty." Stowe shows a woman jumping on ice. The normative consideration shifts from "property rights" to "maternal instinct." By making the physical danger perceptible, she makes the moral claim undeniable. You cannot debate the ice.
  3.  **Tom's Death:** This is the theological limit of Availability. Tom makes his suffering visible to Legree and the overseers. He transforms the whip from a tool of discipline into a witness of martyrdom. The "feature of the practice" made available here is the *soul* of the slave. Legree cannot kill what he cannot see, and Tom forces him to see it.

  **Why Availability is not reducible to Appiah:**
  Appiah's honor model relies on *coordination*. I stop doing X because I don't want to be seen as an X-doer. But in *UTC*, the characters often act rightly when *no one is watching* (Tom forgiving Legree, Eliza fleeing into the wilderness). Availability works even in isolation because it changes the agent's relationship to reality, not just to their peers. When Ophelia touches Topsy, she isn't doing it for honor; she is doing it because her previous inability to touch has been revealed as a moral failing. The "cost" isn't social shame; it's spiritual dissonance.

  **The Argument:**
  The novel vindicates the Availability thesis. Williams is wrong because St. Clare proves argument is insufficient. Appiah is incomplete because honor is external, whereas Stowe targets the internal imagination. The revolution happens when the "invisible college" of suffering becomes visible to the Northern reader. The book is a machine for generating visibility.

  ### III. The Hard Case: The Afterlife of "Uncle Tom"

  This is where the reading must confront the limits of Stowe's technology. If Appiah is right that honor is social coordination, then the inversion of "Uncle Tom" from martyr to traitor is not an accident; it is a feature of the honor model.

  Stowe's Tom is honorable within a **Christian honor code**: submission to God is higher than submission to man. His greatness is his refusal to hate Legree.
  The 20th-century Black Power critique operates within a **Political honor code**: resistance to oppression is the highest good. Submission is complicity.

  Does an honor-based account predict this overshoot? **Yes.**
  Appiah's model suggests that honor is contingent on the "script" of the community. In 1852, the relevant community for Stowe was Northern Christians. In that script, Christ-like suffering was the apex of honor. In the 1960s, the relevant community was Black nationalists. In that script, Christ-like suffering was the apex of *shame*.

  However, this reveals a flaw in Stowe's Availability strategy. She made the *suffering* available, but she anchored the *meaning* of that suffering in a specific theology. When the theology faded (secularization) and the political context shifted (from persuasion to liberation), the Availability remained (we still see Tom suffering), but the Honor flipped.

  This suggests that **Availability without a stable Honor framework is volatile.** Stowe made the pain visible, but she could not lock the interpretation of that pain. By making Tom's passivity the vehicle of his holiness, she made his passivity the target of future dishonor. Appiah is vindicated here: the practice (reading the book) remained, but the honor status inverted because the community's script changed. Stowe thought she was writing eternal truth (Williams's "moral facts"); Appiah shows she was writing social coordination.

  ### IV. Commitment and Falsification

  **My Position:**
  *Uncle Tom's Cabin* is a machine for **Affective Availability**. It vindicates neither Williams (it rejects economic determinism) nor Appiah (it rejects social shame as the primary motivator, favoring spiritual conviction). However, the novel's reception history vindicates Appiah's warning: without a stable honor code, Availability is open to re-interpretation. Stowe changed what people *saw*, but she could not control what they *valued* in what they saw.

  **Weight-Bearing Scenes:**
  1.  **The Shelby Sale:** Establishes the gap between bureaucratic language and human reality (Availability).
  2.  **Tom's Death:** Establishes the theological honor code that will later collapse.

  **The Resisting Scene:**
  **George Harris's Escape.**
  George does not wait for availability or honor. He acts on **Interest and Right**. He declares war. He says, "I'll fight for my liberty to the last breath I breathe." This scene resists the Availability reading because George does not need the reader to *see* his humanity to act; he claims it. He fits the Williams model (structural conflict) better than the Stowe model (sentimental revelation). He is the revolutionary, not the martyr.

  **Why this scene threatens my reading:**
  If George Harris is the true hero of the moral revolution (as later history suggests), then Stowe's focus on Tom's availability is a distraction, perhaps even a counter-revolutionary move. If the practice of slavery ended because of people like George (resistance, economic disruption, Civil War) rather than people like Tom (making white people cry), then the novel's moral technology is misfiring. It is selling a pacifist solution to a structural problem.

  **Falsification Condition:**
  I would have to give up the "Availability" reading if the text consistently showed that *seeing* suffering led to *inaction* rather than action. If St. Clare, after fully witnessing the cruelty (which he does), had not died but had instead manumitted Tom, the novel would be a success story for Availability. But he dies. The only character who acts decisively is George Harris, who rejects the "availability of suffering" for the "assertion of rights."

  To sustain my reading, I must argue that George Harris is the *consequence* of the Availability shift, not the alternative to it. The North had to see the humanity (Tom) before it could support the rights (George). But the "Tom" slur suggests this link was broken. The reading holds only if we accept that Stowe's technology was designed for 1852, not 1962. The novel succeeds as moral technology for its moment (shifting Availability to break the Honor code of the 1850s) but fails as a permanent moral document because it conflated theological honor with human dignity.

  **Conclusion:**
  The novel pushes back on Appiah by showing that honor shifts require a perceptual shift first (Availability). But the afterlife pushes back on Stowe by showing that Availability is not enough; if the Honor code shifts (from Christian martyrdom to Political Resistance), the same available facts (Tom's submission) yield the opposite moral verdict. The novel is a moral technology that worked by making slavery *unbearable to see*, but it could not dictate how future generations would bear it.
