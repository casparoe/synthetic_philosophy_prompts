answer: |-
  The concept you are describing is established in the literature of Science and Technology Studies (STS) and AI ethics, most prominently under the term **the Moral Crumple Zone**. It was coined by researcher Madeline C. Elish (specifically in her 2019 paper *"Moral Crumple Zones: Cautionary Tales in Human-Robot Interaction"*), which draws directly on the autonomous vehicle safety driver cases you mentioned.

  However, your analysis adds a critical layer to the standard definition. Elish describes the *absorption* of blame; you have identified the *mechanism of inquiry termination* that allows that absorption to hold. You have noticed that the human presence does not just attract blame, but actively *repels* upstream scrutiny.

  Below is the precise mechanism, the conditions for its arising, its distinctions from related concepts, and an analysis of your boundary cases.

  ### The Mechanism: Decoupled Agency with Epistemic Closure

  The arrangement functions through a four-step structural loop. For this to be a Moral Crumple Zone (rather than simple negligence or hierarchy), all four must be present:

  1.  **Formal Agency Assignment:** A human actor is inserted into the decision loop with the *formal* authority and obligation to intervene, override, or validate. This satisfies legal and regulatory requirements for "human control."
  2.  **Effective Agency Negation:** The conditions of the role (time pressure, information asymmetry, automation bias, or interface design) make it cognitively or practically impossible for the human to exercise meaningful judgment. They cannot verify the upstream logic; they can only react to its output.
  3.  **Liability Asymmetry:** When the system succeeds, credit accrues to the technology or the institution ("the model worked"). When the system fails, liability accrues to the human ("the operator failed to intervene").
  4.  **Epistemic Closure (Your Contribution):** The existence of the human signature/checkpoint satisfies the audit trail. Because a human "confirmed" the action, the investigation treats the decision as a *human decision*, thereby rendering the upstream system design (thresholds, training data, deployment context) invisible to the review. The file contains an answer, so the question is never asked.

  **The Result:** Responsibility does not just migrate downstream; it *evaporates* upstream. The total surface area of accountability shrinks because the complex socio-technical system is reduced to a single point of human failure.

  ### Conditions for Arising

  For this structure to emerge, three conditions must hold simultaneously:

  1.  **Regulatory/ethical necessity for a human:** There must be a rule, norm, or law that says "a machine cannot be solely responsible for this outcome." (e.g., medical safety, vehicle operation on public roads).
  2.  **System Opacity or Speed:** The upstream system must operate at a speed or level of complexity that exceeds the human's capacity for real-time verification. (e.g., a nurse cannot re-calculate the risk score; a driver cannot process sensor fusion data faster than the car).
  3.  **Retrospective Clarity:** The failure must be visible only in hindsight. At the moment of decision, the situation must appear ambiguous enough that the human's inaction looks like negligence, even if it was rational reliance on the tool.

  ### What It Is Not

  You correctly identified that standard terms do not fit. Here is the precise differentiation:

  *   **It is not a Responsibility Gap:** A responsibility gap (e.g., Matthias, Danaher) occurs when harm happens and *no one* can be held responsible (e.g., a truly autonomous robot with no owner). In your cases, responsibility is *hyper-concentrated*, not absent.
  *   **It is not the Problem of Many Hands:** That problem (Thompson) arises when responsibility is so diffuse that no individual is liable. Here, the structure is designed to ensure one specific individual *is* liable.
  *   **It is not Scapegoating:** Scapegoating implies the person is innocent and the blame is deflected from someone *else who is actually guilty*. In a Moral Crumple Zone, the human is *formally* guilty (they did sign off), but the *causal* weight of the error lies upstream. The system is not deflecting blame it *would otherwise bear*; it is using the human to prevent the blame from ever reaching it.
  *   **It is not Vicarious Liability:** Vicarious liability holds the employer responsible for the employee. Here, the institution often protects itself by pointing to the employee's procedural failure ("They didn't follow protocol"), shielding the institution's strategic choices.

  ### Boundary Cases

  You asked for the edges of the definition. Here is how the mechanism applies to your examples:

  **1. A minister signing a regulation drafted by civil servants.**
  *   **Verdict:** **Borderline / Political Firebreak.**
  *   **Analysis:** This shares the *Liability Asymmetry* (Minister resigns, civil service remains). However, it often lacks *Effective Agency Negation*. A Minister *could* theoretically read the draft, but chooses not to due to volume. In a Moral Crumple Zone, the human *cannot* verify the data (e.g., they cannot see the sensor inputs). The Minister case is usually a "Political Shield" rather than a Crumple Zone, unless the Minister is given technically complex data they are incapable of understanding and told they must certify its accuracy.

  **2. A junior doctor countersigning a consultant's plan.**
  *   **Verdict:** **No (usually).**
  *   **Analysis:** This is typically a training hierarchy. The junior is expected to learn to spot errors. If the junior signs without reading, that is genuine negligence. It becomes a Moral Crumple Zone only if the "Consultant" is actually an **Algorithm**, or if the volume of plans makes it physically impossible for the junior to review them, yet they are blamed for missing an error. If the junior is there to learn, the responsibility is shared for training purposes. If the junior is there to be a "second set of eyes" on 500 charts a day, it is a Crumple Zone.

  **3. A night security guard.**
  *   **Verdict:** **Yes.**
  *   **Analysis:** This is a classic instance. The guard is paid to prevent breaches. The building design, lock quality, and staffing levels (upstream decisions) determine security. If a breach occurs, the guard is fired for "not paying attention." They lack the capacity to stop a determined intruder alone, but they absorb the liability for the failure of the security system.

  **4. A referee at a sporting match.**
  *   **Verdict:** **No.**
  *   **Analysis:** The referee is the **Source of Authority**, not a check on an external system. The rules do not exist independently of the referee's enforcement in the moment. While VAR (Video Assistant Referee) introduces a technological layer that *could* create a Crumple Zone (if the ref is blamed for overriding VAR incorrectly), the traditional referee role is one of genuine agency. They are not validating a machine's output; they are generating the ruling.

  ### Summary Definition

  If you need to name this in your committee discussions without relying solely on the academic term, you might define it as **Procedural Liability Trapping**.

  However, **Moral Crumple Zone** is the established term. Your specific insight—that the human presence *contracts* total responsibility by satisfying the audit requirement—is the crucial mechanism that makes the Crumple Zone durable. Without that epistemic closure, the blame would bounce back upstream. The human does not just take the hit; they absorb the *question*.

  **Recommendation for your Committee:**
  When reviewing an incident, ask: *"If the human had not signed this, would the system have acted anyway?"*
  *   If **Yes**: The human was a Moral Crumple Zone. The inquiry must focus on why the system was allowed to act without meaningful oversight.
  *   If **No**: The human had genuine gatekeeping power. The inquiry can focus on their judgment.

  In your hospital's case, if the prediction flag auto-populates the chart and the nurse merely acknowledges it to clear the alert, they are in a Crumple Zone. If the nurse must independently gather data to *generate* the risk score, they are not. The distinction lies in whether the human is the **author** of the decision or the **witness** to it.
