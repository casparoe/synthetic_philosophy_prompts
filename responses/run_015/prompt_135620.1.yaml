      **Notice of Proposed Rulemaking: Standardization of Negligible Adverse Events and Conversion Protocols**

      **AGENCY:** Office of De Minimis Harms (ODH), Department of Harmonic Standardization.

      **ACTION:** Notice of proposed rulemaking.

      **SUMMARY:** The Office of De Minimis Harms proposes to establish a regulatory framework for quantifying, aggregating, and trading imperceptible adverse events. This rule establishes a conversion schedule between high-intensity singular harms and low-intensity distributed harms, defines noticeability thresholds, and outlines procedures for standing harm allocation elections.

      **DATES:** Comments must be received by [Date].

      **FOR FURTHER INFORMATION CONTACT:** Office of De Minimis Harms, Division of Quantitative Ethics.

      **SUPPLEMENTARY INFORMATION:**

      **1. Authority and Purpose**
      Under the Authority of the Ethical Harmonization Act, the ODH seeks to resolve ambiguities in liability where harms are too small to be consciously registered by individual subjects but significant when cumulative. This rule codifies the exchange rate between Severe Singular Events (SSE) and Distributed Negligible Events (DNE).

      **2. Definitional Framework**
      (a) *Perceptible Adverse Event:* Any harm resulting in a conscious negative utility reading above 0.01 on the Standardized Irritation Scale (SIS).
      (b) *De Minimis Event:* Any harm registering below 0.01 SIS. Per § 2(b)(1), DNEs do not constitute reportable injuries unless the total subject count exceeds the Statutory Threshold.^1
      (c) *Microharm Credit (MHC):* The base unit of negative utility. One (1) MHC equals one (1) subject experiencing one (1) DNE.

      **3. Conversion Schedule and Tradeable Credits**
      The Office proposes the following conversion rate for regulatory compliance:
      (a) 1 Torture-Day (defined as 24 hours of continuous maximum intensity suffering) = 3^^^3 Microharm Credits.
      (b) Entities holding Torture-Day liabilities may discharge said liabilities by purchasing MHCs from the general populace, provided the total volume meets the conversion rate.
      (c) No single subject may accrue more than 50 MHCs per fiscal year. Harms exceeding this cap must be distributed across new subjects.

      **4. Noticeability Exemption**
      Harms classified as DNEs are exempt from informed consent requirements if the subject cannot retrospectively identify the event. The Office maintains that a harm unremembered is functionally equivalent to a harm unexperienced, provided the aggregate volume does not trigger the Statutory Threshold.

      **5. Recurring Election Protocol**
      Participants selecting the Distributed Model must file Form 44-B (Standing Authorization for Daily Harm Allocation). This election authorizes the Office to administer one (1) DNE per subject, per day, indefinitely. Withdrawal of consent requires a 30-day notice period, during which allocations continue.

      **6. Justification for Summation Protocol**
      Commenters often object to the equivalence proposed in Section 3, arguing that the intensity of an SSE outweighs any volume of DNEs. The Office rejects this distinction. To claim that 3^^^3 minor irritations sum to less than one severe suffering event requires asserting that the negative utility of additional subjects diminishes to zero at an unspecified point. The Office notes that objections to the summation protocol often rely on an unstated premise that single-subject intensity inherently outweighs multi-subject frequency, regardless of magnitude. Without a defined discontinuity function, the linear summation remains the only administrable standard.

      **7. Impact Tables**
      See Appendix A for projected liability shifts. Table 1 illustrates the break-even point where total distributed discomfort exceeds singular severity based on current population metrics.

      **Appendix A: Impact Tables**
      *Table 1: Cumulative Utility Loss by Subject Count*
      | Subjects | Total MHCs | Equivalent SSE Units |
      | :--- | :--- | :--- |
      | 1,000,000 | 10^6 | 0.000...01 |
      | 3^^^3 | 3^^^3 | 1.0 Torture-Day |
      | 10^(3^^^3) | 10^(3^^^3) | Variable |

      **Footnotes**
      ^1 ODH Internal Study 94-C found that 99.9% of subjects could not distinguish between 0.0001 units of irritation and baseline sensory noise. Consequently, the threshold was set at 10^100 subjects to ensure statistical significance.

