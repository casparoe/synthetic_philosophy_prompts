answer: |-
  Your friend has put their finger on the single most vulnerable point in Dennett's architecture. The move from a "Cartesian Theater" to a "Committee of Drafts" does not automatically dissolve the homunculus; it risks merely fracturing it. If the committee requires a protocol to decide which draft influences behavior, that protocol functions as a chairperson. If it does not, the system risks paralysis or incoherence.

  For someone working in cognitive architecture rather than pure metaphysics, the order of operations matters because some problems are structural prerequisites for others. You cannot model the temporal flow of experience if you haven't solved how competing representations are adjudicated, and you cannot explain binding if you haven't solved how information persists over time.

  Here is the ranking of the unresolved issues, ordered by logical dependency and tractability for a philosopher of cognitive science.

  ### 1. The Adjudication Problem (Global Workspace vs. The Chairperson)
  **Status:** Upstream / Conceptual Prerequisite
  **Tractability:** High for Philosophy / High for Architecture

  This is the most critical issue. Your friend's objection—that a distributed committee implies a chairperson—is a version of the "Combination Problem." In cognitive architecture terms, this asks: **What is the functional mechanism that selects one draft for motor output or verbal report without invoking a central decider?**

  Dennett often leans on Global Workspace Theory (GWT) here, suggesting that "fame in the brain" (wide availability of information) constitutes the selection. However, GWT posits a bottleneck. If that bottleneck is a specific neural substrate or computational routine that gates access, it functionally resembles the Theater it was meant to replace. If there is no bottleneck, and all drafts act in parallel, you lose the unity of agency.

  **Why this is first:** You cannot build a model of consciousness (artificial or biological) that acts coherently without a resolution mechanism for conflicting data. If the resolution mechanism is "conscious," you have relocated the homunculus. If it is "unconscious," you have explained behavior but potentially eliminated the phenomenology (the "what it is like" to decide).

  **Philosophical Task:** This is not yet an empirical question. It is a question of functional coherence. A philosopher can analyze whether a "vote" among sub-personal processes can logically result in a unified action without a "tallying" agent. If the tallying is done by a further process, does that process require its own tallying? You are looking for a regress stopper that is purely mechanical. Resolving this determines whether MDM is a viable architecture or just a metaphor.

  ### 2. Temporal Dynamics (The Specious Present)
  **Status:** Mid-stream / Architectural Constraint
  **Tractability:** Mixed (Phenomenology + Cognitive Modeling)

  Once you have a mechanism for adjudicating drafts, you must account for *when* this happens. Experience is not a series of frozen snapshots; it has duration (the specious present). We hear melodies, not just tones. Dennett's model is often criticized for being "snapshot-heavy," where drafts are revised discretely. If the adjudication from Issue #1 happens instantaneously, where does the temporal thickness come from?

  **Why this is second:** Temporal integration requires memory and retention. An architecture must hold a draft long enough for it to be compared with a subsequent draft. If the adjudication mechanism (Issue #1) is too fast or too discrete, it cannot generate the experience of duration. If it is too slow, it cannot guide real-time behavior.

  **Philosophical Task:** This is tractable for a philosopher because it involves the logic of time-consciousness. You can analyze whether a "distributed" system can generate a "thick" present without a central clock. This is where predictive processing enters: if the brain is predicting the future based on the past, the "now" is a window of integration. A philosopher can define the necessary conditions for this window without needing to know the specific neural frequency. Resolving this shifts the debate on **personal identity**: if the "self" is just a span of temporal integration, identity is fluid and granular, not a continuous thread.

  ### 3. Perceptual Binding (Unity of Experience)
  **Status:** Downstream / Emergent Property
  **Tractability:** Low for Philosophy / High for Neuroscience

  Binding is the problem of how color, shape, motion, and location are experienced as a single object. In MDM, binding is often treated as a byproduct of the competition: the draft that wins the competition is the one where features are already bound. However, your friend's worry about hierarchical predictive processing is relevant here: if higher levels "bind" lower levels by imposing predictions, does the higher level become the Theater?

  **Why this is third:** Binding is largely a consequence of how adjudication and time are handled. If you solve how conflicting drafts are resolved (Issue #1) and how they are sustained over time (Issue #2), binding often falls out as a feature of that architecture. If the system selects a coherent draft for action, that draft must, by definition, be bound enough to guide action.

  **Philosophical Task:** This is the least tractable for pure philosophy because it is deeply entangled with neural implementation (e.g., neural synchrony, gamma waves). A philosopher can clarify what "unity" means functionally, but determining whether MDM *actually* achieves it without a central binder is an empirical question. Philosophy should largely step back here until the architecture of adjudication is settled.

  ### Downstream Implications of this Ordering

  Resolving these in order clarifies the stakes for your reading group:

  1.  **If Adjudication fails (The Chairperson remains):** Then MDM is false as an eliminativist theory. It implies there *is* a central functional locus. This strengthens the case for a robust **Personal Identity**, as there is a specific "place" or process that constitutes the self. It also suggests **AI Consciousness** is harder to achieve; you can't just have parallel processing; you need a specific serial bottleneck that might be biologically unique.
  2.  **If Temporal Dynamics fail (Snapshots only):** Then MDM explains behavior but not **Phenomenology**. The Explanatory Gap remains wide open because the model cannot account for the flow of experience, only the report of it. This suggests consciousness might be an illusion of memory, not a real-time process.
  3.  **If Binding is derivative:** Then **AI Consciousness** becomes much more tractable. If binding is just a result of successful competition for output, then any system with a competitive workspace (like certain advanced architectures) could be said to have "experience" in the functional sense.

  ### Conclusion: Nature vs. Taste

  To answer your opening worry: Your disagreement is likely about **Nature**, not taste, but it is disguised as taste.

  Explanatory taste usually concerns whether one prefers a reductive or non-reductive vocabulary. Your friend's objection is structural: they are claiming the architecture is unstable. If the "Committee" requires a "Chair," Dennett hasn't dissolved the Theater; he has just renovated it.

  **Recommendation for the Reading Group:**
  Focus 80% of your energy on **Issue #1 (Adjudication)**. Do not get bogged down in the neuroscience of binding until you agree on whether a functional bottleneck entails a homunculus. If you can agree that a "vote" among sub-systems does not require a "tally-er" that is itself conscious, the rest of the model becomes plausible. If you cannot agree on that, the Multiple Drafts Model collapses back into a variant of the Cartesian Theater, and the debate shifts to whether that Theater is acceptable (which is a different argument entirely).

  Philosophy's job here is to police the logic of the architecture: ensure that "distributed" doesn't secretly mean "centralized." Neuroscience's job is to see if the brain actually works that way. Stick to the logic first.
