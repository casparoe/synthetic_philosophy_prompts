prompt: |-
  I'm drafting a novel that jumps between deep prehistory and the present, so I've been reading Harari, Diamond, and Graeber and Wengrow. There's this tension I can't shake: big history needs a clean arc—hunter-gatherers to farmers to states to capitalism—otherwise the narrative falls apart, but Graeber and Wengrow say that's ideology, not history. So here's the controversy: are grand narratives in deep history epistemically corrupt—do they systematically warp human agency and contingency just to keep a dramatic shape—or are they unavoidable heuristics we can discipline? Write an essay reaching a conclusion: is the narrative impulse a genuine vice for understanding prehistory, or just a stylistic risk that careful scholars can manage? I'm particularly interested in wether the critics actually destroy the narrative form, or merely replace it with something so messy no publisher would touch it. Answer in British English, please. And be self-critical: what archaeological finding or argument would flip your verdict, and where is your reasoning shakiest? No bibliography needed—just your own take. Sorry for the rushed wording, I'm between chapters.
