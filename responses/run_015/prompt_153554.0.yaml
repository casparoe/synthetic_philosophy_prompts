      *   *The Critique (Graeber/Wengrow):* Human history is non-linear, experimental, and political. People chose freedom over hierarchy often. Agriculture didn't inevitably lead to states. Good for accuracy and agency. Risks being fragmented, lacking dramatic momentum, and "messy."
      *   *The Novelist's Dilemma:* A novel *needs* structure. History *needs* nuance. Can they coexist?

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be evocative. Something about arcs and messiness. *The Arc and the Labyrinth*? *The Tyranny of the Plot*? Let's go with *The Tyranny of the Plot: Narrative as Vice or Virtue in Deep History*.

      *   **Introduction:** Acknowledge the user's predicament. The "clean arc" vs. the "messy reality." Define the stakes. Is the story a lie if it imposes order?
      *   **Body Paragraph 1: The Case Against the Arc.** Discuss Graeber and Wengrow's point. The "ladder" of progress is ideological. It removes human choice. If you write a novel following Diamond, are you writing fiction or propaganda?
      *   **Body Paragraph 2: The Necessity of Form.** Counter-argument. Humans think in stories. A novel without an arc isn't a novel; it's a catalogue. Publishers need hooks. Readers need traction. Is "messiness" just code for "unmarketable"?
      *   **Body Paragraph 3: The Middle Ground (Disciplined Heuristics).** Can we use the arc *knowing* it's a construct? Meta-fiction? Polyphonic narratives? The narrative impulse isn't the vice; *dogmatism* is.
      *   **Conclusion:** Reach a verdict. The narrative impulse is a manageable risk, not a fatal vice, *provided* the author acknowledges the friction.
      *   **Self-Criticism (Crucial Step):** I need to explicitly state what would change my mind and where my logic is weak.
          *   *Flip verdict:* New archaeological evidence showing strict determinism (unlikely but possible). Or evidence that narrative structures fundamentally alter cognitive processing of history in harmful ways.
          *   *Shakiest reasoning:* Assuming a novelist can successfully balance both without alienating readers. Underestimating the market force of simplicity.

  4.  **Refining the Voice (British English):**
