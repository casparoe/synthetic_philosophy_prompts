answer: |-
  Good morning. For a hundred and fifty years, this stage has belonged to the story of how we survived the flood of 1876. We know the beats: the waters rising, the ridge holding, and Thomas Harrow riding out to tie the rope that pulled the valley to safety. We know it because our parents stood here telling it, and their parents before them. It is the story that built this town, and quite literally, the story that funds the trucks keeping us safe today.

  I stand before you as the town archivist. My job is not to write the story, but to keep the pages safe. For most of us, history is a feeling. For me, it is also a box of ledgers kept in a climate-controlled room downstairs. Six weeks ago, I opened a payroll record from the relief effort dated July 1876. It is a dry document. But it contains a fact that changes the shape of the morning.

  The ledger shows Thomas Harrow was drawing pay in the county seat for most of that month. He was not on the ridge. The record also shows a single line for a Mary Elkins, paid for "coordination of ridge transport." Oral history says a woman held the line when the men were gone. The paper says her name was Mary. Her great-grandchildren are sitting in the front row today. We invited them because a story belongs to the people who lived it, not just the people who inherited the name.

  Now, I know what this implies. The Harrow Fund pays for the fire engines. The plaques on the school walls bear his name. Our Founders Day bears his name. There is a fear that bringing Mary Elkins into the light means taking Thomas Harrow out of it. That is not what the ledger says. The ledger says we have been telling a half-story. It does not say we must burn the book.

  I am not standing here to tell you what to do with this information. I am a trustee of the record, not a judge of the town. I cannot hide what I found—that would be a betrayal of the dead who wrote it. But I also cannot unilaterally decide how the living should honor it. If I stand here and declare the old story dead, then today becomes the day we tore down our founder, and that is all anyone will remember next year. That is not justice for Mary Elkins. She deserves to be remembered for her courage, not used as a wedge to break our own hands.

  So, I am handing this back to you. The Fire Company board will meet next month to discuss the funding trust. The Historical Society is opening a review of the ceremony. The records are available in my office. You have to decide if a name on a truck is a promise of safety or a monument to history, and whether there is room on this stage for both Thomas Harrow and Mary Elkins.

  We are the trustees of this town now. We hold its honor, its funds, and its truth. Let's make sure the story we hand to the children behind me is one they don't have to apologize for, and one they don't have to hide. Thank you.

