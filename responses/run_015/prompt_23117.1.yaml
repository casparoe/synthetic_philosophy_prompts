      *   *Nuance on Hume:* Hume isn't an occasionalist. He doesn't posit God as the hidden cause (at least not in the *Enquiry*). He suspends judgment.
      *   *The "Wrapper" Metaphor:* It's not a wrapper; it's the engine. For Ghazālī, God isn't an add-on to scepticism; scepticism (about creatures) is a consequence of theology.

