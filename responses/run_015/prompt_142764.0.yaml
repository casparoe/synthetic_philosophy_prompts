answer: |-
  Right. Let's treat the act of assertion as a protocol execution where a Prover (the speaker) sends a message to a Verifier (the listener) within a specific environment. We shall map the three norms—Knowledge, Truth, and Belief—onto security definitions, looking for the homomorphisms and the kernel of the mapping.

  ### 1. The Knowledge Norm as Proof of Knowledge (PoK)

  **The Translation:**
  Under the Knowledge Norm, one asserts $p$ only if one knows $p$. In cryptographic terms, assertion is a **Proof of Knowledge**. To assert a statement $x$, the Prover must demonstrate possession of a witness $w$ such that a relation $R(x, w) = 1$ holds. Crucially, this relies on the **extractability** property. If a malicious Prover can convince a Verifier to accept the assertion with non-negligible probability, there must exist an efficient extractor algorithm that can interact with the Prover and recover the witness $w$.

  *   **What translates cleanly:** The externalisation of competence. Just as the extractor recovers the witness from a successful prover, the Knowledge Norm demands that successful assertion implies the capacity to produce the underlying justification or evidence. The "ideal-world/real-world" paradigm fits well here: in the ideal world, the prover simply hands over the knowledge; in the real world, they run a protocol that proves they hold it without necessarily leaking the raw data (akin to a Zero-Knowledge Proof of Knowledge).
  *   **What requires distortion:** Crypto "knowledge" is purely computational. It is the ability to compute a function, not a mental state. To fit the norm, we must distort "knowledge" to mean "possession of a private key or preimage," ignoring how that possession was acquired.
  *   **What has no equivalent:** The Gettier problem. In crypto, if you possess the witness $w$, you satisfy the protocol, even if you found $w$ by lucky guess or brute force. There is no primitive for "justification" distinct from "possession." Furthermore, the normative force—the *obligation* not to assert without knowledge—is absent. The protocol defines what *can* be verified, not what *ought* to be claimed.

  ### 2. The Truth Norm as State Validity (Consensus Integrity)

  **The Translation:**
  Under the Truth Norm, one asserts $p$ only if $p$ is true. In a distributed system, this maps to **State Validity**. An assertion is a transaction submitted to a ledger; it is valid only if it corresponds to the canonical state of the network. Verification involves checking the assertion against a public oracle or the consensus history. If the assertion contradicts the global state (e.g., double-spending, asserting a balance that doesn't exist), the transaction is rejected.

  *   **What translates cleanly:** Objective verifiability. Just as any node can verify a block against the chain rules, any listener can (in principle) verify a truth-claim against reality. The "negligible function" here is the probability of a hash collision or a 51% attack; we accept the assertion as "true" if the probability of it being invalid is computationally negligible.
  *   **What requires distortion:** We must conflate metaphysical truth with consensus truth. In crypto, truth is often defined by the longest chain or the majority vote of validators. This distorts the philosophical norm, which usually posits a mind-independent reality. We are forced to treat "truth" as "agreement among verifiers."
  *   **What has no equivalent:** The Oracle Problem. Cryptography cannot verify the semantic truth of an off-chain statement. A signed message saying "It is raining" is cryptographically valid if the signature checks out, regardless of whether it is actually raining. Crypto secures the *integrity of the transmission*, not the *correspondence of the content*.

  ### 3. The Belief Norm as Commitment and Non-Repudiation

  **The Translation:**
  Under the Belief Norm, one asserts $p$ only if one believes $p$. This maps to a **Commitment Scheme** coupled with **Digital Signatures**. By asserting, the Prover commits to a value and signs it with their private key. This ensures non-repudiation: the Prover cannot later deny that they held that specific stance at time $t$. The protocol ensures that the Prover is bound to the assertion, mirroring the internal binding of belief.

  *   **What translates cleanly:** Binding and accountability. Just as a commitment scheme prevents a prover from changing their value after the fact, the Belief Norm prevents a speaker from asserting without internal endorsement. The signature acts as the public trace of that internal commitment.
  *   **What requires distortion:** Belief is graded and probabilistic; signatures are binary. You either signed the packet or you didn't. To fit the norm, we must treat belief as a boolean flag, ignoring degrees of confidence.
  *   **What has no equivalent:** Sincerity. This is the critical failure point. A private key can sign any message, regardless of the holder's internal state. There is no cryptographic primitive that verifies the *alignment* between the private key holder's mental state and the message content. A liar with a valid key produces a perfectly valid signature. Crypto guarantees *authorship*, not *honesty*.

  ### The Residue and the Verdict

  Now, let us look at the residue—the parts that refused to map.

  In all three cases, the cryptographic translation captures the **verifiable external behaviour** but completely fails to capture the **internal normative state**.
  1.  **Mental States:** Crypto has no equivalent for belief or understanding. It models agents as stateless functions or holders of secrets. The "Knowledge" in Proof-of-Knowledge is a capacity to compute, not a justified true belief.
  2.  **Justification:** The extractor gets the witness, but it cannot determine if the prover *understands* the witness or merely replayed a captured transcript.
  3.  **Normativity:** This is the largest gap. Cryptography defines what is *possible* (security) and what is *detectable* (verification). Philosophy of assertion defines what is *permissible* (norms). A crypto protocol can punish a violator (slash their stake, reject their transaction), but it cannot define the violation as a breach of *duty* prior to the punishment.

  **Does this reveal a gap in the philosophical theories?**
  No. The philosophical norms are robust in their own domain. They address the social and rational obligations of agents. The fact that they don't map to code doesn't suggest they are vague; rather, it suggests they govern a layer of abstraction that code does not touch.

  **Does it show crypto is the wrong tool?**
  Yes, but with a caveat. Cryptography is the wrong tool for modelling the *speech act* itself, because speech acts are inherently semantic and normative, whereas crypto is syntactic and mechanical. Crypto is excellent for modelling the *consequences* of assertion (reputation, accountability, information flow), but it is category error to use it for the *conditions* of assertion.

  The residue reveals that assertion is not merely a data transmission with integrity checks. It is a social move that relies on the assumption of a mind behind the key. You can build a system where lying is computationally expensive (Proof of Stake slashing), but you cannot build a system where lying is cryptographically impossible, because the private key does not contain the conscience of its owner. The gap isn't in the philosophy; it's in the attempt to reduce the normative to the computational.
