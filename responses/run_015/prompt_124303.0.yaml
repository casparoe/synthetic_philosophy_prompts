  1.  **Analyze the User's Request:**
      *   **Context:** Philosophy of Mind course, specifically Gilbert Ryle's *Knowing-How vs. Knowing-That* distinction.
      *   **Problem:** The user's intuitions about cases are inconsistent ("all over the place").
      *   **Cases Provided:**
          1.  *Roommate (Swimming):* Memorized steps (knowing-that) but sinks (no knowing-how). -> Intuition: Not knowing-how.
          2.  *Grandma (Sourdough):* Can't explain chemistry (no knowing-that) but makes great bread (knowing-how). -> Intuition: Knowing-how.
          3.  *Cousin (Brain Injury):*
              *   Shoe tying: Can explain (knowing-that) but can't do it (no knowing-how).
              *   Bike riding: Can't explain (no knowing-that) but can do it (knowing-how).
              *   *Conflict:* Why shoe tying fails but bike riding works if both are procedural memory issues? (User notes this weirdness).
          4.  *VR Surgeons:* Trained only in simulation, perform perfectly on real bodies. -> Intuition: Unsure. Is it knowing-how if no "real" contact?
          5.  *Hypothetical (BCI Piano):* Learning piano via brain-computer interface without touching physical keys. -> Question: Is this knowing-how?
      *   **Professor's Hint:** "Counterfactual Robustness" (skill holds up when conditions shift).
      *   **Goal:** Find a unifying principle that captures the user's verdicts, identify which intuitions need to be dropped/adjusted, and address the specific tricky cases (Cousin, VR Surgeons, BCI Piano).
      *   **Tone:** Honest, analytical, philosophical but accessible (peer-to-peer vibe).

  2.  **Deconstruct Ryle's Original View:**
      *   Ryle (in *The Concept of Mind*) argues against Intellectualism (the idea that knowing-how is just applying knowing-that).
      *   For Ryle, knowing-how is a *disposition* or a *capacity* to perform intelligently.
      *   Key criterion: Success in performance + adaptability/correctness of mistakes.
      *   Ryle would say the Roommate lacks knowing-how. Grandma has knowing-how. Cousin (bike) has knowing-how. Cousin (shoes) lacks knowing-how.

  3.  **Evaluate the User's Intuitions against Ryle & Modern Epistemology:**
      *   *Roommate:* Clear case of Knowing-That without Knowing-How. (Ryle agrees).
      *   *Grandma:* Clear case of Knowing-How without Knowing-That. (Ryle agrees).
      *   *Cousin:* This is the tricky one. The user is confused about *why* one procedural memory is lost and another kept.
          *   *Philosophical/Medical nuance:* Procedural memory isn't a single block. Shoe tying is more complex/sequential fine motor + cognitive planning. Bike riding is deeply ingrained balance/gross motor.
          *   *Verdict:* If he can ride the bike, he has knowing-how. If he can't tie shoes, he lacks knowing-how *for shoes*. The ability to explain the shoes is irrelevant to the knowing-how of tying them.
      *   *VR Surgeons:* This challenges the "practice" aspect. If they perform successfully, Ryle says it's knowing-how. The "zero real contact" is a red herring if the skill transfers.
      *   *Counterfactual Robustness:* This is a modern refinement (often associated with anti-intellectualists like Jason Stanley or ability theorists). It asks: Can you adapt if things go wrong?

  4.  **Identify the Unifying Principle:**
      *   The user wants *one principle*.
      *   Candidate 1: *Successful Performance.* (Too simple. Luck doesn't count).
      *   Candidate 2: *Disposition to Succeed.* (Better).
      *   Candidate 3: *Counterfactual Robustness / Adaptability.* (Best fit for the Professor's hint and the VR/Grandma cases).
      *   *Proposed Principle:* **Knowing-How is the reliable, adaptable capacity to successfully perform a task across varying conditions, independent of the ability to articulate the rules governing that task.**

  5.  **Address the "Honesty" Requirement (Which intuitions to drop):**
      *   *The Cousin Case:* The user thinks it's "weird" that bike vs. shoe differs.
          *   *Correction:* Drop the idea that procedural memory is monolithic. It's task-specific. The principle holds: If he performs, he knows-how. If he doesn't, he doesn't. The explanation ability is irrelevant.
      *   *The VR Surgeons:* The user worries about "zero real contact."
          *   *Correction:* Drop the requirement for "historical real-world repetition." If the simulation is high-fidelity enough to grant *robustness* in the real world, it counts. The medium doesn't matter; the transferable capacity does.
      *   *The BCI Piano:* This is the stress test.
          *   *Prediction:* If they can play a physical piano after BCI training, it's knowing-how. If they can only "play" in the BCI simulation, it's not knowing-how *to play piano*, it's knowing-how to *simulate playing*.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Intro:* Validate the confusion. Ryle is classic but these edge cases are where modern philosophy lives.
      *   *The Core Principle:* Define "Intelligent Capacity" or "Counterfactual Robustness." Explain that Knowing-How is about *what you can do*, not *what you know about what you do*.
      *   *Walking through the cases:*
          *   Roommate: Fails robustness (water is different than manual).
          *   Grandma: Passes robustness (dough varies, she adapts).
          *   Cousin: Split verdict. Bike = Yes. Shoes = No. Explain the neurological distinction (procedural isn't one thing).
          *   VR Surgeons: Passes *if* they adapt to real flesh (which is squishier than VR). If they freeze when blood appears, they lacked robustness.
      *   *The BCI Case:* Apply the principle. If the skill transfers to physical keys, yes. If not, no.
      *   *The "Drop This" Section:* Be direct.
          1.  Drop the idea that "practice" requires physical history (VR case).
          2.  Drop the idea that procedural memory is all-or-nothing (Cousin case).
