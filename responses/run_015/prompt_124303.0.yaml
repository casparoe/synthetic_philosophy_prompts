      *   BCI Piano: If the BCI bypasses fingers, do they know how to play *piano* (which requires fingers) or how to *make piano sounds*? This distinction is crucial.

  8.  **Final Polish:** Check tone. Ensure it sounds like a helpful study partner/tutor, not a lecture. Ensure the "honesty" constraint is met (telling them where their intuition is leading them astray).

      *(Self-Correction during drafting)*: Wait, I need to be careful with the Cousin case. The user said he *can* ride a bike but *can't* tie shoes, despite both being procedural. The user finds this weird. I need to explain that this isn't a failure of the *philosophical* principle, but a nuance of *cognitive science*. The principle remains: Performance = Knowing-How. The fact that one performance is broken and the other isn't just shows the modularity of skill.

