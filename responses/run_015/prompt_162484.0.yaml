  ### LEAF KEY

  *   **Leaf 1: Narrow Person-Affecting View**
      *   *Awkward Commitment:* Cannot say a world with happy extra people is better than a world without them.
      *   *Load-Bearing:* Q2 (Existence Benefit).
  *   **Leaf 2: Asymmetry / Negative-Leaning View**
      *   *Awkward Commitment:* Adding happy lives is neutral, but adding miserable lives is bad (non-symmetric).
      *   *Load-Bearing:* Q2 (Existence Benefit).
  *   **Leaf 3: Lexical / Person-Weighted View**
      *   *Awkward Commitment:* Must prioritize quality of life over quantity even at extreme scales (rejects Drip Lives).
      *   *Load-Bearing:* Q3 (Drip Lives).
  *   **Leaf 4: Average Utilitarianism**
      *   *Awkward Commitment:* Adding a happy person below the average makes the world worse (Mere Addition Paradox).
      *   *Load-Bearing:* Q4 (Metric).
  *   **Leaf 5: Total Utilitarianism (Bullet-Biter)**
      *   *Awkward Commitment:* The Repugnant Conclusion is true; Z is better than A.
      *   *Load-Bearing:* Q6 (Continuity).
  *   **Leaf 6: Total Utilitarianism ("Z is Good" Variant)**
      *   *Awkward Commitment:* Shares theory with Leaf 5 but claims intuition against Z is mistaken (not repugnant).
      *   *Load-Bearing:* Q6 (Continuity).
  *   **Leaf 7: Intransitive View**
      *   *Awkward Commitment:* Accepts every step in the staircase is an improvement, but denies the top is better than the bottom.
      *   *Load-Bearing:* Q6 (Continuity).
  *   **Leaf 8: Critical-Level Utilitarianism (Fixed)**
      *   *Awkward Commitment:* Lives worth living but below the critical level make the world worse to add.
      *   *Load-Bearing:* Q5 (Critical Level).
  *   **Leaf 9: Sliding Critical-Level (Unnamed)**
      *   *Awkward Commitment:* The value of a life depends on how many other people exist (variable threshold).
      *   *Load-Bearing:* Q7 (Threshold Dynamics).
  *   **Leaf 10: Unoccupied (Average + Critical Level)**
      *   *Status:* Incoherent. Average utilitarianism implicitly uses a variable critical level (the current average); adding a fixed one is redundant or contradictory.
  *   **Leaf 11: Unoccupied (Person-Affecting + Sum Compensation)**
      *   *Status:* Incoherent. Person-affecting views deny compensation by definition (Q1 No).
  *   **Leaf 12: Unoccupied (Lexical + Average)**
      *   *Status:* Unexplored/Unattractive. Lexical views usually prioritize total person-weight or thresholds, not averages.

  ### NOTES & FLAGS

  **1. The Sliding Critical-Level (Leaf 9)**
  This view sets the critical level as a decreasing function of population size (high threshold for small populations, low threshold for large ones).
  *   **Viability:** It does not escape impossibility results. By lowering the threshold as population grows, it eventually allows lives near neutral to count positively.
  *   **Result:** It re-derives the Repugnant Conclusion in slow motion. It avoids the conclusion for mid-sized populations but yields it for sufficiently large ones where the threshold drops near zero.

  **2. Indistinguishable Pairs**
  *   **Leaf 5 vs. Leaf 6 (Total Util Variants):** The tree cannot separate these logically. They share the same axiology (Sum, No CL, Transitive). The difference is purely meta-ethical (whether the intuition against Z is a bug or a feature). To separate them, you need a question about *phenomenology*: "Does Z feel repugnant to you?"
  *   **Leaf 1 vs. Leaf 2 (Person-Affecting vs. Asymmetry):** On fixed-population cases, these views often converge. They only separate on cases involving potential people. To separate them, ask: "Is a world with extra happy people *neutral* compared to a world without them (Asymmetry), or *incomparable* (Person-Affecting)?"

  **3. Case Locations**
  *   **Drip Lives (One vs. Many):** Located at **Q3**. This separates Leaf 3 (Lexical) from Leaves 4–9 (Aggregative). It tests whether *persons* or *welfare quantity* is the unit of value.
  *   **Staircase vs. One Jump:** Located at **Q6**. This separates Leaf 7 (Intransitive) from Leaves 5 & 6 (Total Util). If you accept the Jump (A→Z) but reject the Staircase (A→...→Z), you land in Leaf 7. If you accept both, you land in Leaf 5 or 6.
