      So 1 vs 4 is actually quite hot.
      But 2 vs 4 is still hotter because 2 explicitly defines the *conditions* for defeat which 4 violates directly.
      Let's stick with 2 vs 4 as #1 severity.

      *Refining the "Single Revision":*
