      *   *Tone:* Professional, analytical, direct (audit style).
      *   *Structure:*
          1.  Executive Summary (The "Fatal Flaw").
          2.  Tension Audit (Ranked by severity).
          3.  Fixes (Cost/Benefit).
          4.  The Single Best Revision.
      *   *Check:* Did I lecture on akrasia? No. Did I focus on the package? Yes.

      *(Self-Correction during drafting)*: Wait, let's look closer at 1. "Believe P while believing my belief is no more justified than my peer's disbelief." This is *conciliatory* akrasia. Usually, steadfasters say "My belief is *more* justified." Conciliationists say "Suspend." This view says "Believe P + Equal Justification." This is the "Akratic Permissivism" view (like Lasonen-Aarnio or Christensen's harder cases).
      Claim 4 says General Bias -> Suspend.
