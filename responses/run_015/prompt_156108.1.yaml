          *   *Tension:* Low. One is about belief suspension, one is about normative confidence.
      *   **1 vs. 6:** Claim 1 allows akrasia (believing P + believing belief is unjustified/unlevel). Claim 6 says don't be humble about humility.
          *   *Tension:* Low. Akrasia is about belief/justification mismatch. Humility is about confidence levels.

