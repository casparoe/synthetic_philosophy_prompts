          *   *Cheapest:* Modify 2. Distinguish "general unreliability" (I'm dumb) from "systematic domain bias" (anchoring in finance). Claim 2 likely meant "I am generally unreliable," not "I have a known systematic distortion in this domain."
      *   *Fix for 1 vs. 4:*
