answer: |-
  You are wrestling with the boundary between **Fair Play** (the duty not to free-ride on a scheme you benefit from) and **Cultural Sovereignty** (the duty not to impose your norms on others). Your "draw-down" intuition is strong, but as you noted, it treats obligation as purely transactional (benefit received = duty owed). It misses the relational aspect: *how your actions affect the stability of the scheme for others.*

  Here is a single principle that unifies your verdicts, the adjustments it requires, and how to handle the hard cases in your syllabus.

  ### The Principle: Cooperative Integrity

  > **"One is obliged to conform to a local convention to the extent that one is a participant in the cooperative scheme, provided that conformity sustains rather than disrupts the scheme's equilibrium."**

  This principle has three variables that explain your gut verdicts:
  1.  **Membership:** Are you a transient guest or a stakeholder?
  2.  **Equilibrium:** Does your action stabilize or destabilize the system for others?
  3.  **Legitimacy:** Is the convention distributive (fairness) or coordinative (safety/flow)?

  ---

  ### 1. How it explains your verdicts

  *   **Visitor no-tip (US) / Visitor bus scrum:**
      *   *Verdict:* Fine.
      *   *Analysis:* **Low Membership.** The visitor is a transient. The local scheme absorbs their non-conformity as a "cost of tourism." They are not taking a *sustained* draw-down, so they owe no *sustained* conformity.
  *   **American fat-tip (No-tip country):**
      *   *Verdict:* Obnoxious.
      *   *Analysis:* **Disrupted Equilibrium.** This is the key to your asymmetry problem. The visitor isn't "taking" from the scheme; they are *rewriting* it. By tipping heavily, they inflate local expectations, potentially distort wage structures, and signal superiority. They are disrupting the equilibrium without having the membership stake to justify changing the rules.
  *   **Local queue-jumper:**
      *   *Verdict:* Not fine.
      *   *Analysis:* **High Membership + Distributive Convention.** Queuing is a fairness convention. The local is a full stakeholder. Jumping is free-riding, which directly undermines the integrity of the scheme for other stakeholders.
  *   **Empty-street Jaywalk:**
      *   *Verdict:* Fine.
      *   *Analysis:* **Coordinative Convention.** Traffic lights are for safety coordination, not distributive fairness. If the street is empty, the "cooperative scheme" (safety) is not engaged. No one is harmed; the equilibrium is intact.
  *   **Frequent Flyer (Monthly):**
      *   *Verdict:* Not fine.
      *   *Analysis:* **Threshold of Membership.** This is where your "draw-down" theory needed help. This person has crossed the threshold from "guest" to "functional resident." They benefit from the local order repeatedly. Their non-conformity is no longer an anomaly; it becomes a pattern of free-riding.

  ### 2. Which verdict must you drop (or nuance)?

  You need to nuance the **Frequent Flyer**.
  Under the Principle of Cooperative Integrity, obligation isn't binary (Tourist vs. Local); it's a slider. A monthly visitor is in a grey zone.
  *   **The Adjustment:** If the flyer integrates into the city's economy (uses services, occupies space) *without* accepting its burdens, they are "extractive." Your verdict that they are "worse than a tourist" is correct, but the principle forces you to admit they are *not quite as wrong as a local*. They owe *some* conformity, proportional to their footprint, but perhaps not the full burden of citizenship.
  *   **Teaching Point:** Use this to discuss "Functional Membership." At what point does a visitor become a participant? (e.g., The "Snowbird" problem).

  ### 3. The Delivery App (The 20% Default)

  The app is not rewriting the convention; it is **manufacturing friction.**
  *   **The Principle's View:** Moral obligation requires voluntary participation in a scheme. The app uses "dark patterns" to simulate social pressure where none exists.
  *   **Verdict:** You do not owe the 20%. The app is attempting to bypass the "Membership" variable by making refusal psychologically costly. It is a *pseudo-obligation*.
  *   **Teaching Point:** Distinguish between *social conventions* (emergent norms) and *manipulative architecture* (designed nudges). The latter creates annoyance, not moral duty.

  ### 4. The Hard Cases: The Expat and The Resentful Locals

  This is where the unit gets philosophically rich.

  **The 10-Year Expat Who Won't Tip**
  *   **Analysis:** They have **High Membership**. They are functionally locals. Under Cooperative Integrity, they are free-riding on a wage system they benefit from.
  *   **Verdict:** They are in the wrong *unless* they are actively working to change the system (see below). If they simply enjoy the service while refusing the norm, they are violating Fair Play.

  **The Resentful Locals (Conventions they want to dismantle)**
  *   **The Problem:** If locals resent tipping, is complying "respecting them" or "propping up oppression"?
  *   **The Principle's Limit:** Cooperative Integrity assumes the scheme is *legitimate*. If the scheme is exploitative (e.g., employers offloading wages to customers), the "Integrity" of the scheme is morally bankrupt.
  *   **Resolution:** You must introduce a **Legitimacy Clause**.
      *   *Obligation tracks the collective will, not just the historical practice.*
      *   If the locals are actively trying to dismantle the convention (e.g., a "hospitality included" movement), then complying with the old norm is actually *disrespectful*. It undermines their political agency.
      *   *However (Non-Ideal Theory):* If the locals resent it but *depend* on it for survival (no alternative wage structure exists yet), then conformity is a duty of **Interpersonal Care** (helping the waiter eat today) even if it conflicts with **Systemic Justice** (wanting the system to change).
      *   **Verdict:** You tip the individual (justice for the worker) while advocating against the system (justice for the scheme).

  ### Summary for the Syllabus

  If you want one sentence to anchor the unit:

  > **"Conventional obligation is the price of membership in a cooperative scheme; it binds participants to maintain equilibrium, but dissolves when the scheme is victimless, transient, or illegitimate."**

  *   **Transient:** Tourists (Fine to opt out).
  *   **Victimless:** Empty street jaywalk (Fine to opt out).
  *   **Illegitimate:** Resentful/Reformist locals (Obligation shifts from conformity to solidarity).
  *   **Membership:** Expats/Frequent Flyers (Obligation scales with integration).
  *   **Equilibrium:** Exporting norms (Forbidden to disrupt).

  This preserves your gut instincts while giving you the vocabulary to explain *why* the fat-tipper is obnoxious (disruption) while the no-tip tourist is fine (transience), and why the 10-year expat is in a bind (membership without legitimacy).
