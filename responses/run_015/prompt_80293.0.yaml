      *   *Correction:* Don't just bash the professor. Acknowledge that in an undergrad course, deep ontology can derail learning the Hilbert space formalism.
      *   *Nuance:* The phrase "Shut up and calculate" is often used pejoratively *against* the Copenhagen orthodoxy. The professor using it might be ironic or unreflective.
