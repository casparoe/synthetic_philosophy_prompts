answer: |-
  Here is a principle that captures your verdicts, followed by its rivals, its application to your new cases, and an honest audit of where it breaks (specifically regarding your own defensiveness).

  ### The Principle: Conscious Alignment and Role Fidelity

  You are not judging people for violating universal moral truth (which would condemn the Roman); you are judging them for violating the **specific moral or epistemic duties available to their station at that time.**

  Blame is warranted when three conditions are met:
  1.  **Epistemic Access:** The moral critique was available in a language the agent could have understood and acted upon without social suicide. (Exonerates the Roman; condemns the Virginian).
  2.  **Role Fidelity:** The agent violated the specific internal ethics of their profession or self-professed role, not just general social norms. (Condemns the Sugar Researcher for betraying *science*, even if society allowed it; condemns Jefferson for betraying *lawgiving*).
  3.  **Defensive Entrenchment:** The agent doubled down on the violation when the contradiction was pointed out, rather than retreating into silence or reform. (Condemns Churchill on Empire; condemns the 85-year-old who never walked it back).

  **The Memorialization Corollary:** Statues do not honor the *whole man*; they honor a *narrative*. If the narrative is inextricable from the harm (Columbus = Conquest), the statue falls. If the narrative is separable from the harm (Jefferson = Words vs. Deeds), the statue stays but the plaque must bridge the gap.

  ---

  ### Rival Candidate: The Moral Trajectory Principle

  A competing explanation for your intuitions is that you are judging **direction, not position.**
  *   **The Rule:** You blame those who stood still or moved backward when the moral arrow of their time was moving forward. You excuse those who were stationary when there was no arrow.
  *   **Why it fits:** It explains why the Virginian is worse than the Roman (the arrow existed). It explains why Churchill is blamed for empire *after* the war (the wind turned).
  *   **Why it fails:** It doesn't explain the Sugar Researcher. If "peers did it," the arrow in his professional environment wasn't moving. Yet you blame him. This suggests *Role Fidelity* (my first principle) is stronger than *Trajectory*.

  ---

  ### Testing the Principle on New Cases

  **1. The Mid-Century Scientist (Unethical Data)**
  *   **Verdict:** High Blame.
  *   **Reasoning:** Under **Role Fidelity**, science has an internal ethic of consent and honesty that often precedes public law. If the experiment was "already considered unethical at the time" *by peers*, Epistemic Access is met. The fact that the result is famous is irrelevant; the achievement is tainted by the betrayal of the role.
  *   **Outcome:** The result can be cited, but the method must be condemned. No statue, no named award.

  **2. The Person "Ahead of Their Time"**
  *   **Verdict:** Symmetric Credit is *not* granted.
  *   **Reasoning:** Your principle is asymmetrical. Blame requires *Access* + *Betrayal*. Credit requires *Vision* + *Success*. We blame Jefferson for ignoring the abolitionists (Access); we do not credit a hypothetical slave-owner who freed slaves in 500 BC because there was no framework for that virtue to land in. Virtue requires a receptive environment to count as leadership; vice only requires a conscience.
  *   **Outcome:** You get blame for ignoring the light you had; you don't get extra credit for seeing light nobody else could perceive unless you successfully lit a fire with it.

  **3. The Living 85-Year-Old (Awful things in 1974, no walkback)**
  *   **Verdict:** High Blame.
  *   **Reasoning:** This turns on **Defensive Entrenchment**. In 1974, the norms may have been mixed (Epistemic Access is debatable). But in the decades since, the critique became dominant. By *never walking it back*, they chose to defend the position when challenged. They moved from "product of their time" to "defender of a rejected norm."
  *   **Outcome:** They are judged by the standards of 2024 because they refused to update when the update was available.

  **4. The Statues (1890s vs. Later Pushback)**
  *   **Verdict:** Judge the erector, not the subject.
  *   **Reasoning:** This fits the **Memorialization Corollary**. A statue erected in the 1890s (often Confederate or Imperial pushback) is a speech act by the *builders* to assert dominance. A statue erected later as reverence is a different speech act.
  *   **Outcome:** You are right: you are judging the people who put it up. If the statue was erected to signal "this man's values still rule," it must come down if those values are rejected. If it was erected as "history," it stays with context.

  ---

  ### Where the Principle Breaks (and where you break)

  You asked for the argument's weakness and where it cannot save your verdicts. Here is the fracture.

  **1. The Columbus/Jefferson Scale**
  My principle struggles to explain why Columbus gets statues down while Jefferson gets plaques, given Jefferson's **Role Fidelity** betrayal (Lawgiver vs. Slaveowner) is arguably deeper than Columbus's (Governor vs. Brutality).
  *   **The Break:** The distinction rests entirely on the **Memorialization Corollary**. Jefferson's "Words" are a separable asset to the current state; Columbus's "Discovery" is inextricably linked to the "Brutality."
  *   **The Weakness:** This is utilitarian, not moral. It says: *We keep Jefferson because he is still useful to us.* It admits we are not judging the dead; we are curating the present. If you want a moral principle, this is a failure. If you want a political principle, it holds.

  **2. The Factory Farming Asymmetry (Your Blind Spot)**
  You wrote: *"I get genuinely defensive when people say future generations will judge us over factory farming... and I want to say that would be unfair — but I refuse the same generosity backwards."*
  *   **The Verdict of the Principle:** You are wrong. By your own standard (**Epistemic Access**), the critique of factory farming is available *now*. The language of animal welfare, the environmental data, and the ethical arguments are in the air. You have **Access**.
  *   **The Contradiction:** You blame the Virginian because abolitionists existed. Abolitionists (for animals) exist now. You blame the Sugar Researcher because peers questioned the ethics. Peers question factory farming now.
  *   **Why you feel defensive:** You are conflating *systemic difficulty* with *moral ambiguity*. You want to claim that because the system makes it hard to stop, you shouldn't be blamed. But the Virginia Planter also faced economic ruin if he freed his slaves.
  *   **The Hard Truth:** Your desire to "still be allowed to blame people" requires you to accept that future people will be allowed to blame *you*. If you claim a "man of his time" defense for yourself, you must grant it to Jefferson. If you deny it to Jefferson, you forfeit it for yourself.
  *   **The Weakness in My Reasoning:** I cannot resolve this for you without forcing you to choose. The principle demands consistency. If you keep the asymmetry, you are admitting that your judgment is not about *justice*, but about *power*: *I judge the past because I can; I resist the future because I cannot stop them.*

  ### The Argument That Would Make Me Switch

  To convince me (or you) that the "Man of His Time" defense should apply to the Virginian but *not* to the Modern Factory Farmer, I would need an argument for **Moral Lag Time.**

  I would need to be shown that moral truths require a "settling period" before they become binding duties.
  *   *Argument:* A moral critique is not binding until it shifts from "available to intellectuals" to "embedded in institutions."
  *   *Application:* In the 1790s, abolition was intellectual. In the 2020s, animal rights are intellectual but not institutional.
  *   *Why this fails:* Jefferson held institutional power. He *could* have embedded it. You hold consumer power. You *could* embed it. The lag is voluntary.

  ### Final Diagnosis

  You want to come out still being allowed to blame people. You can. But the price is admitting that **you are not judging the past for being imperfect; you are judging them for being less brave than they could have been.**

  If that is your standard, you must accept that future generations will judge you for being less brave than *you* could have been. The asymmetry you feel is not a philosophical puzzle; it is self-preservation. The principle holds, but it cuts both ways. If you want to keep the sword, you must expose your neck.
