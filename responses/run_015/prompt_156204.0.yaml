answer: |-
  ### Criteria for Trade-offs

  Before detailing the agenda, I need to be explicit about how I'm weighing the four dimensions (Importance, Tractability, Neglectedness, Upstreamness).

  1.  **Upstreamness (Highest Weight):** The fund's mandate is to revive a *framework*, not just score policy points. If the core Humean mechanism (automatic adjustment) is broken in a fiat world, the rest of the agenda collapses. Theoretical foundations take precedence over applied policy debates.
  2.  **Tractability (High Weight):** We have junior scholars on two-year clocks. Projects requiring proprietary data, heavy formal modeling, or decades of historical reconstruction are out. We need conceptual clarity, synthesis, and case studies accessible to a smart generalist.
  3.  **Importance (Medium-High Weight):** The work must matter for 2025-ish policy. Pure history of thought is excluded by mandate. The output must interface with live debates (sanctions, industrial policy, deficits).
  4.  **Neglectedness (Medium Weight):** We want leverage. If the econ consensus is already clear but ignored (like capital accounts), that's high leverage. If a field is crowded (standard trade modeling), we avoid it.

  ### Deliberate Deprioritizations

  To ensure focus, I am explicitly excluding the following, even though they are adjacent to the mandate:

  *   **Pure History of Economic Thought:** The mandate explicitly forbids bibliographies. We are not funding scholars to tell us what Hume said, but what Humean logic *implies* now.
  *   **Formal International Macro Modeling:** Junior scholars cannot build better DSGE models than the Fed in two years. This is downstream of the conceptual questions we need to settle.
  *   **Crypto/DeFi Monetary Theory:** While relevant to "money," this is too volatile and niche. We need to address the USD reserve system, which will dominate 2025 regardless of Bitcoin's price.
  *   **General "Free Trade is Good" Advocacy:** This is downstream. The debate isn't whether trade is good; it's about security externalities and adjustment mechanisms. Arguing comparative advantage 101 is not a research agenda.

  ---

  ### Priority Research Agenda

  Here are the five lines of work, ordered by priority. For each, I present the **Steelman** (the strongest possible version of the project) before detailing the specific criteria.

  #### 1. The Fiat-Reserve Adjustment Mechanism

  **Steelman:** Hume's price-specie-flow mechanism relied on gold convertibility to enforce discipline. In a fiat world with a dominant reserve currency, that automatic brake is gone. The strongest version of this project doesn't just ask "is it different?" but rigorously maps the *replacement* mechanism. Does the exchange rate do the work? Do capital flows? Or has the adjustment mechanism broken entirely, allowing permanent imbalances without correction? If we can't identify the modern equivalent of specie flow, the Humean framework is historically contingent, not universal.

  *   **(1) Open Question:** In a fiat system with a reserve currency, what specific variable (exchange rates, interest rates, inflation differentials) enforces the Humean self-correction on trade imbalances, and can states politically resist it?
  *   **(2) Upstreamness:** Critical. If there is no automatic correction, the Humean claim that "imbalances don't matter" is false. This determines whether the rest of the agenda is valid.
  *   **(3) Tractability:** High. This is conceptual synthesis and historical case study (e.g., Plaza Accord, Nixon Shock, Post-2008). No new data generation needed; requires mapping existing macro theory onto political economy constraints.
  *   **(4) Neglectedness:** Medium. Macro economists study this, but the *political economy* implications (can a state refuse to adjust?) are neglected in public discourse.
  *   **(5) Update Evidence:** If the scholar identifies a clear historical episode where the adjustment mechanism failed due to reserve status (not policy interference), this moves to "critical failure" of the Humean view. If they identify a robust modern mechanism, the view is strengthened.

  #### 2. Sanctions Blowback and Weaponized Interdependence

  **Steelman:** Hume argued that trade barriers hurt the imposer most. Sanctions are the ultimate trade barrier, but they are weaponized for security, not profit. The strongest version of this project tests whether the economic blowback on the sanctioning state is still large enough to constrain policy, or if "friend-shoring" and strategic decoupling have fundamentally altered the cost-benefit analysis. It treats sanctions as a natural experiment on the limits of positive-sum commerce.

  *   **(1) Open Question:** Do modern sanctions regimes trigger Humean self-defeat (economic cost to the sender) sufficient to deter use, or has strategic fragmentation made them cost-effective tools of statecraft?
  *   **(2) Upstreamness:** High. This determines if the Humean "commerce softens manners" thesis holds under geopolitical stress. If sanctions are costless to the sender, the positive-sum assumption breaks.
  *   **(3) Tractability:** High. Relies on existing trade data and public sanctions lists. Comparative case studies (Russia vs. Iran vs. Cuba) are feasible for a junior scholar.
  *   **(4) Neglectedness:** Medium-High. Security studies dominate this space; the *economic* blowback to the sender is often assumed rather than measured.
  *   **(5) Update Evidence:** Quantifying the GDP/welfare cost to sanctioning states. If costs are negligible, the Humean warning is less relevant. If costs are high but ignored, the crux is political will, not economic mechanism.

  #### 3. The Capital Account Conceptual Gap

  **Steelman:** The public and many elites treat the trade deficit as a scoreboard (exports good, imports bad). Hume knew money flows balance trade flows. The strongest version of this project explains why the "Capital Account Mirror" (deficit = net capital inflow) fails to land politically. It's not just "educating the public"; it's analyzing why the heuristic persists. Is it cognitive bias, or does the financialization of wealth make capital inflows feel abstract while job losses feel concrete?

  *   **(1) Open Question:** Why does the "trade deficit = loss" heuristic persist among elites despite consensus that it mirrors capital inflows, and what framing successfully corrects this without triggering backlash?
  *   **(2) Upstreamness:** Medium-High. This is the main driver of protectionist demand. Solving the communication crux reduces political pressure for harmful policies.
  *   **(3) Tractability:** Very High. Conceptual analysis, discourse analysis of policy speeches, and small-scale framing experiments. No heavy modeling.
  *   **(4) Neglectedness:** High. Economists know this, but political economy research on *why* the error persists (beyond "ignorance") is thin.
  *   **(5) Update Evidence:** Identifying a specific framing or institutional change that shifts elite discourse. If the error is shown to be rational signaling rather than ignorance, the solution shifts from education to incentive reform.

  #### 4. The Security-Externality Boundary

  **Steelman:** Hume opposed protectionism, but he didn't face AI or hypersonics. The strongest version of this project doesn't just say "security matters." It defines the *boundary condition*. Where does a legitimate security externality end and mercantilist rent-seeking begin? It seeks a testable framework to evaluate claims like "semiconductors are national security" vs. "steel is national security."

  *   **(1) Open Question:** What criteria distinguish a legitimate security-based industrial policy from mercantilist protectionism in a Humean framework?
  *   **(2) Upstreamness:** Medium. Prevents the Humean view from being dismissed as naive on national security. Allows for a "Humean Industrial Policy" exception clause.
  *   **(3) Tractability:** Medium. Philosophical and policy analysis. Requires deep dives into specific sectors (chips, energy, pharma).
  *   **(4) Neglectedness:** Medium. Everyone argues extremes; the middle ground (the threshold) is under-theorized.
  *   **(5) Update Evidence:** A robust checklist or framework that successfully categorizes past policies ex-post. If no clear boundary can be drawn, the exception swallows the rule.

  #### 5. Elite Mercantilist Incentives

  **Steelman:** Maybe politicians know trade is positive-sum but say it's zero-sum because it wins votes. The strongest version of this project investigates whether mercantilism is a cognitive error or a rational signaling strategy. If it's rational signaling, education won't fix it. This project maps the incentive structures that reward "trade deficit = bad" rhetoric even when policymakers know better.

  *   **(1) Open Question:** Is elite mercantilism driven by epistemic failure or by rational political incentives (signaling toughness, protecting donors)?
  *   **(2) Upstreamness:** Medium-Low. Explains the persistence of the error, but doesn't fix the economic mechanism.
  *   **(3) Tractability:** High. Interviews, analysis of campaign finance, voting records vs. private statements.
  *   **(4) Neglectedness:** Medium. Often assumed to be ignorance.
  *   **(5) Update Evidence:** Evidence that policymakers privately hold correct views but publicly dissent. If true, the intervention shifts from research to institutional reform.

  ---

  ### Ranking Justification

  1.  **The Fiat-Reserve Adjustment Mechanism** is #1 because it is the most **upstream**. If the automatic correction mechanism is broken in a fiat world, the Humean framework requires fundamental revision, not just application. It is tractable as a theoretical reconstruction and highly neglected in the *political economy* dimension (vs. pure macro).
  2.  **Sanctions Blowback** is #2 because it addresses the biggest **2025 complication** (geopolitical fragmentation). It tests the limits of the positive-sum assumption under stress.
  3.  **The Capital Account Conceptual Gap** is #3 because it is the most **neglected** leverage point for public discourse. The economics is settled; the political economy of the misunderstanding is not.
  4.  **The Security-Externality Boundary** is #4 because it is necessary for **credibility**. Without it, the Humean view is easily dismissed as irrelevant to security states. It is slightly downstream of the mechanism questions.
  5.  **Elite Mercantilist Incentives** is #5 because it is **explanatory** rather than foundational. It helps understand the barrier to adoption, but doesn't determine the truth of the theory itself.

  \answer{fiat-reserve-adjustment}
