answer: |-
  You have correctly identified the heart of the Absent-Minded Driver paradox, and your derivation of the contradiction is mathematically sound given the premises. The tension you feel between the ex-ante optimum of 4/3 and the ex-intersection optimum of 9/5 is the canonical formulation of the problem introduced by Piccione and Rubinstein. To resolve this without abandoning rationality, you must reject Step 3, and in doing so, you implicitly reject the applicability of Step 1 in its standard form to problems of imperfect recall. The error in Step 3 is not arithmetic but interpretive: the quantity 9/5 is not the expected payoff of the trip, but rather the expected payoff per intersection visit, and optimizing this metric distorts the agent's incentives by double-counting the value of surviving the first intersection.

  When you calculate the credences in Step 2 as 3/5 and 2/5, you are normalizing by the expected number of intersections visited, which is 1 + p. This transforms the probabilities from ex-ante likelihoods of reaching a node into conditional probabilities of being at a specific node given that you are at some node. Consequently, the weighted sum in Step 3 calculates the expected utility conditioned on the event I am currently at an intersection. Because being at the second intersection is good news it implies you successfully navigated the first without exiting for zero the conditional expected utility at the second intersection is higher than the ex-ante expected utility of the trip. By averaging the ex-ante value at the first intersection with this inflated conditional value at the second, you generate a number 9/5 that exceeds the true ex-ante maximum 4/3. Optimizing this inflated number leads you to choose p prime equals 1/3 because the calculation treats the probability of being at the second intersection as fixed evidence rather than as a consequence of your action at the first. You are effectively rewarded for the probability of reaching the second node without being charged for the risk of failing to reach it, because the credences were derived from the old plan p equals 2/3 while the optimization assumes a new plan p prime.

  This reveals that Step 1, the principle of dynamic consistency or sequential rationality, cannot be applied naively in the presence of imperfect recall. Standard dynamic consistency assumes that the agent's knowledge at a decision node partitions the world in a way that allows local optimization to align with global optimization. In the Absent-Minded Driver, the agent's self-locating belief is endogenous to the strategy; changing the strategy changes the probability of being at the second node. Therefore, the replacement for dynamic consistency is ex-ante policy commitment, often formalized in Updateless Decision Theory or Timeless Decision Theory. You must view the decision at the intersection not as a fresh opportunity to maximize conditional expected utility, but as the execution of the optimal policy selected before departure. The rational agent at the intersection recognizes that their decision rule applies to all indistinguishable nodes, including the one they might have already passed, and thus adheres to the ex-ante optimal p equals 2/3 despite the local calculation suggesting otherwise. The cost of this rejection is accepting that rational agents with imperfect recall cannot always act to maximize expected utility relative to their current self-locating credences; they must instead act to maximize the expected utility of the policy that generated those credences.

  Regarding your question about what the 9/5 measures, it is the expected payoff per intersection encounter. Since the driver visits the first intersection with probability 1 and the second with probability p, the total expected payoff is distributed over 1 + p visits. The calculation in Step 3 divides the total expected utility by the expected number of visits, effectively averaging the payoff over the decision points rather than the trips. Because higher payoffs generally require visiting more intersections, maximizing the average payoff per visit biases the agent toward strategies that look efficient per node but fail to maximize the total return per trip. This explains why the surplus appears to grow with confusion; the more nodes you add, the more you dilute the ex-ante value across multiple decision points, inflating the per-visit average if you condition on being at a node.

  On the matter of your re-randomizing device, it is not smuggling in recall, but it is accessing a strategy space that a single pre-departure flip cannot. A single coin flip before departure selects a pure strategy or a mixture of pure strategies, such as exit always or continue always. In games with perfect recall, mixtures of pure strategies are equivalent to behavioral strategies where you randomize at each node. However, in games with imperfect recall like this one, behavioral strategies are strictly more powerful. A single flip cannot implement the independent randomization required to achieve the 4/3 payoff; it forces correlation between the actions at the two intersections that limits you to the convex hull of the pure strategy payoffs, capping you at 1. The device allows a behavioral strategy where the action at the second intersection is statistically independent of the first given the strategy parameter p, which is necessary to achieve the ex-ante optimum. Thus, the device is legitimate and necessary for the 4/3 solution, but it does not validate the local re-evaluation.

  Finally, regarding the consistent plan fix where p equals 4/9, this solution accepts the flawed local objective function of Step 3 and seeks a fixed point where the credences derived from the plan match the optimal plan derived from those credences. While this restores a form of local consistency, it does so by optimizing the wrong metric, which is why it costs you real money compared to the ex-ante optimum. You should not pay this cost. The consistency constraint is only binding if you accept that the agent at the intersection is entitled to re-optimize based on self-locating evidence treated as fixed. Since we have established that such evidence is endogenous to the policy, the fixed point is a equilibrium of a mistaken decision procedure. The rational choice is to ignore the temptation of the 9/5 calculation, recognize it as an artifact of averaging over visits rather than trips, and stick with the ex-ante plan of p equals 2/3. The paradox dissolves when you realize that in the absence of perfect recall, the perspective of the agent-at-the-node is not a valid foundation for decision theory; only the perspective of the agent-before-departure holds normative authority.
