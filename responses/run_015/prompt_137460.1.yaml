answer: |-
  Friends, family, and crew.

  We are gathered here to mark a beginning. Usually, at a moment like this, a speaker offers a specific kind of wish. We are told to wish the couple joy. We are told to wish them the fulfillment of their dreams. We are told to hope their life together is a mountain peak of excitement and achievement.

  I know [Partner A] and [Partner B] well enough to know that if I stood here and wished for their dreams to come true, I would be wishing for them to remain on a treadmill. To dream is to want. To fulfill a dream is to satisfy a want. And when the satisfaction fades, the want returns, or a new one takes its place. On that accounting, a life of fulfilled dreams is just a life of managed itching.

  So, I will not wish you happiness. Happiness is a weather system; it passes. It is also, by your own lights, a distraction. Instead, I want to wish you something more durable. I want to wish you a distinct kind of quiet.

  There is the quiet that comes after a storm, when the wind finally dies down. That is the quiet of satisfaction. You were cold, now you are warm. You were hungry, now you are full. But that quiet is fragile. It depends on the storm having happened, and it waits for the next storm to begin.

  Then there is the other quiet. The quiet of the air before the pressure drops. The quiet of a room where no one is waiting for a phone to ring. This is the quiet of not needing the wind to die down, because you were never buffeted by it. This is the state I wish for you. May you find that the background noise of *wanting* grows fainter in each other's presence. May your marriage be a place where the burden of needing to be somewhere else, or someone else, is set down at the door.

  You met, as many know, working on a sailboat. Restoring a hull is not, by most accounts, a thrill. It is sanding, and scraping, and fitting, and waiting for glue to cure. I have watched you work together. There is a specific quality to the silence between you when you are passing a tool, or measuring a spar.

  I know there is a question between you about what that silence *is*. One of you might say it is merely the absence of trouble. The other might say it is something more. I will not try to solve that argument today. I will only say this: In that work, the self disappears. When you are fully absorbed in the fit of a joint, there is no "I" there to crave, to worry, or to suffer. There is only the work. That is a rare sanctuary. My wish is that your life together provides more of those sanctuaries. Not because the work is glorious, but because the work is total, and in that totality, there is no room for pain.

  To the family here, who might hear this and wonder where the romance is: Romance is often sold as a fire. But fire consumes. It requires fuel. It creates ash. What [Partner A] and [Partner B] have built is not a fire. It is a house. It is insulation. It is the knowledge that when the world is loud, there is a place where nothing is demanded of you.

  So, my toast is not a cheer for the future. It is a wish for the reduction of friction.

  May you rarely need to be brave, because bravery is only required when things go wrong.
  May you find that the world makes fewer claims on your time than you feared.
  May you look at each other and feel no pull, no hunger, no urgency—but simply the relief of a weight you didn't know you were carrying, suddenly gone.

  May your cravings be few. May your suffering be less. May your days be long, and uneventful.

  To the quiet.

  ***

  **Note on Risks**

  **The Tranquilist Risk:** The line *"May your days be long, and uneventful"* leans hardest on a reading of tranquilism I am least confident is right. A strict suffering-focused ethicist might argue that a "long" life merely extends the duration of potential risk/existence, which is neutral at best. However, I included it because "long life" is a standard wedding convention that functions as a proxy for "time to practice equanimity," but a purist might view existence itself as the variable to be minimized, not maximized.

  **The Family Risk:** The line *"May you rarely need to be brave, because bravery is only required when things go wrong"* is the one I am least confident lands with the family half. To the traditional ear, bravery is a virtue to be celebrated, not a symptom of disaster to be avoided. They may hear this as wishing the couple a cowardly or passive life, rather than hearing the intended wish: that they be spared the tragedies that make bravery necessary.
