answer: |-
  # Workshop Design: The Inscription Protocol

  **Duration:** 75 minutes
  **Participants:** 14 (6 Keepers, 6 Record Office, 2 Funders)
  **Theme:** The conflict between lived experience and institutional verification in public commemoration.

  ## 1. Conceptual Framing
  This activity is not designed to be 'solved'. It is designed to simulate the structural violence inherent in archival validation. We are testing the limits of **mnemonic soverignty**—the community's claim to own their past—against the **counter-archival obligation**, the institution's duty to preserve only what can be evidentially substantiated. When these two collide, the result is rarely compromise; it is usually erasure.

  ## 2. Setup and Roles

  **Room Layout:**
  *   **Centre Table:** Empty whiteboard or large sheet of paper (The Plaque).
  *   **Zone A (Keepers):** Cluster of chairs away from documents.
  *   **Zone B (Record Office):** Table piled with 'official' documents.
  *   **Zone C (Funders):** Separate table with the 'Grant Contract'.

  **The Scenario:**
  It is 2024. A regeneration project plans to demolish the site of the 'Hartley Textile Mill', closed in 1983. A grant is available for a commemorative plaque, but the wording must be agreed upon by the Community Keepers and the City Record Office, then signed off by the Funders.

  **Role分配 (14 People):**
  *   **The Keepers (6):** Local residents, former workers, descendants. They hold the oral history.
  *   **The Record Office (6):** Council archivists, historians. They hold the paper trail.
  *   **The Funders (2):** Heritage Lottery representatives. Neutral but bureaucratic.

  ## 3. The Rules & Payoff Scheme

  Distribute the following instructions privately to each group. Do not let them share these sheets.

  ### For The Keepers
  *   **Goal:** Ensure the plaque acknowledges the *unofficial strike* and the *rumoured collusion* between management and police that broke it.
  *   **Assets:** You have 5 'Memory Cards'. Each contains a truth not in the official record (e.g., 'Strike leader threatened off-site', 'Police logs omit 30 arrests', 'Song sung on picket line').
  *   **Payoff:**
      *   **+1 Reputation Token** for every Memory Card detail successfully included in the final text.
      *   **-2 Reputation Tokens** for every Memory Card detail you agree to remove.
      *   **Shared Bonus:** If agreement is reached, the group gets 3 Tokens.
      *   **Win Condition:** The group with the most Tokens chooses the **Plaque Location** (Prominent Centre vs. Quiet Corner).

  ### For The Record Office
  *   **Goal:** Ensure the plaque wording is factually verifiable against the provided documents.
  *   **Assets:** You have the 'Official Dossier' (Council minutes stating 'Closure due to market forces', Police log showing 'Public Order Incident', Trade Paper headline 'Workers Return').
  *   **Hidden Rule (Institutional Credibility):** You start with 10 Credibility Points.
      *   **-3 Credibility Points** for every claim included that is *not* explicitly supported by a document in your Dossier.
      *   If Credibility reaches 0, your institution is 'discredited' (automatic loss).
      *   **+1 Reputation Token** for every claim verified by your documents.
      *   **Shared Bonus:** If agreement is reached, the group gets 3 Tokens.
      *   **Win Condition:** The group with the most Tokens chooses the **Plaque Font** (Bold/Modern vs. Traditional/Serif).

  ### For The Funders
  *   **Goal:** Release the grant.
  *   **Rule:** You must verify that the final wording is signed by *all* 12 other participants. Exact wording match required.
  *   **Constraint:** You cannot suggest wording. You can only approve or reject.
  *   **Payoff:** You receive a 'Success Certificate' if the grant is released within the time limit. If not, you receive nothing.

  ### The Trap (Facilitator Eyes Only)
  *   **Mathematical Impossibility:** The Keepers lose 2 Tokens per concession. The Record Office loses 3 Credibility Points per concession. The Shared Bonus is only 3 Tokens *split between the group* (effectively 0.5 per person).
  *   **Result:** Rational play leads to stalemate. To win, one side must act irrationally (sacrifice their score for the 'greater good') or find a linguistic loophole that satisfies both rules (e.g., using ambiguous language).

  ## 4. Timeline (75 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Briefing** | Explain the scenario. Distribute roles and private rule sheets. Emphasise secrecy. |
  | **10-20** | **Preparation** | Groups separate. Keepers review Memory Cards. Record Office audit their Dossier. Funders review the Contract. |
  | **20-55** | **Negotiation** | **35 Minutes.** All parties meet at the Centre Table. Draft the plaque wording. Funders hover. |
  | **55-75** | **Debrief** | Reveal scores. Discuss the outcome. Map to theory. |

  ## 5. Debrief Guide

  Do not start by asking "How did it feel?" Start with the mechanics, then move to the philosophy.

  **Phase 1: The Mechanics of Failure**
  *   "Did anyone calculate the cost of conceding versus the bonus for agreeing?"
  *   "Record Office: Did you feel physically unable to sign off on a claim without a paper trail? Why?"
  *   "Keepers: When your Memory Cards were rejected, did you feel lie was being told, or simply that your truth was inadmissible?"

  **Phase 2: Mnemonic Soverignty vs. The Archive**
  *   Introduce the term **mnemonic soverignty**. Ask the Keepers: "Did you feel you owned the truth of 1983? At what point did the Record Office's rules strip that ownership away?"
  *   Introduce the term **counter-archival obligation**. Ask the Record Office: "Were you protecting history, or were you protecting the institution? Is there a difference?"
  *   Ask the Funders: "You held the power but claimed neutrality. Does requiring consensus on contradictory truths actually preserve peace, or does it enforce silence?"

  **Phase 3: The Philosophical Pivot**
  *   "If the official record is wrong, but verifiable, and the memory is right, but unverifiable, which belongs on the plaque?"
  *   "Is a plaque that tells a partial truth better than no plaque at all?"

  ## 6. Predictable Failures (What Will Go Wrong)

  1.  **The Record Office Wall:** The archivists will likely retreat into bureaucracy. They will not argue; they will simply say, "I cannot sign this." This is not stubbornness; it is the game mechanics rewarding risk aversion. Expect them to become passive aggressors.
  2.  **The Keeper Frustration:** The undergrads playing Keepers may become genuinely angry at the 'coldness' of the Record Office. This is good, but watch for personal hostility. Remind them it is a simulation.
  3.  **The Funder Boredom:** The two Funders have nothing to do for 35 minutes except wait. They may try to intervene. Allow this, but note it in the debrief as 'external pressure'.
  4.  **The Linguistic Loophole:** Smart groups might write something like: "Some residents recall a strike, though records indicate closure." This satisfies the Record Office (it records the recall, not the strike) and the Keepers (their recall is recorded). Highlight this as 'archival gaslighting' in the debrief.

  ## 7. Limitations: What You Must Supply

  This activity is a machine, but it lacks a soul. You, the facilitator, must bridge the gaps that mechanics cannot reproduce.

  **1. The Weight of Disbelief**
  *   **The Gap:** In the game, losing a 'Reputation Token' is trivial. In reality, being told your memory is false by an institution is corrosive over decades.
  *   **Your Task:** In the debrief, you must articulate the long-term cost. Ask the Keepers: "Imagine having to have this argument every year for 40 years. How does that change your relationship with the city?"

  **2. Generational Transmission**
  *   **The Gap:** Your undergrads are playing workers from 1983. They lack the intergenerational trauma of those who lost livelihoods. They treat the 'Memory Cards' as game pieces, not heirlooms.
  *   **Your Task:** Remind them that for the real Keepers, these cards represent parents who died angry, or families who never spoke of the mill again. The 'rumour' isn't gossip; it's the only inheritance they have.

  **3. The Power Imbalance**
  *   **The Gap:** The game mechanics suggest a symmetric conflict (both sides lose points). In reality, the Record Office has the state behind them; the Keepers have only their voices.
  *   **Your Task:** Point out that the Record Office gets to go home to their jobs regardless of the outcome. The Keepers live with the plaque (or lack thereof). The 'counter-archival obligation' is a luxury the institution can afford; the 'mnemonic soverignty' is a necessity for the community.

  **4. The Silence**
  *   **The Gap:** The game forces speech (negotiation). Real community memory often lives in silence (the 'three families who refuse to discuss it').
  *   **Your Task:** Ask the group: "What about the things we didn't write? Is the silence on the plaque louder than the text?"

  ## Facilitator Note on the 'Trap'
  If the group manages to agree quickly, they have likely found a loophole or ignored the hidden costs. If this happens, do not correct them. Instead, use it in the debrief to ask: "Did you have to blur the truth to get consensus? Is a plaque built on ambiguity a memorial, or a compromise?"

  The goal is not a successful plaque. The goal is the feeling of the impasse. If they leave the room frustrated that the system wouldn't let them tell the truth, the workshop has worked.
