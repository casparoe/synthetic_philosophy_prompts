answer: |-
  ### I. The Humean Mapping (Best System Account)

  **Case Side: Options and Ranking**
  For the Humean, the laws of nature are the axioms and theorems of the system that best balances simplicity and strength in summarizing the total mosaic of particular matters of fact. Le Verrier's anomaly (the 43 arcseconds) represents a set of particular facts that the current "Best System" (Newtonian Mechanics) fails to capture perfectly.

  Le Verrier had three options:
  1.  **Observational/Computational Error:** Claim the mosaic data is noisy.
  2.  **Tinker with the Force Law:** Propose a new system (e.g., modify the inverse-square law).
  3.  **Add Unobserved Mass:** Posit Vulcan (new initial conditions within the existing system).

  **Humean Ranking:** The Humean must rank Option 3 highest. Option 2 degrades the *simplicity* of the system globally. Changing the force law affects every prediction in the system, reducing its utility as a summary. Option 3 preserves the simple, strong Newtonian axioms and localizes the complexity to a specific region of the mosaic (the intra-Mercurial space). Option 1 is always a fallback, but given the success of Neptune, the system's strength suggests the data is likely reliable, pointing to missing mosaic content (mass) rather than system failure.

  **Expectations:** Le Verrier was entitled to expect the prediction to succeed only in the sense that the Newtonian system was, *at that time*, the most efficient summary of the *known* mosaic. He was extrapolating the system's reach into an unknown region. The Humean cannot say he was entitled to expect success because the law *governs*; he was entitled to expect success because the system had hitherto proven to be a robust compressor of information.

  **Theory Side: Credit and Blame**
  *   **Neptune:** The Humean takes credit for the *systematization*. The inference worked because the Newtonian system happened to fit that part of the mosaic.
  *   **Vulcan:** The Humean takes blame for the *over-extension*. The failure shows that the "Best System" is relative to the available data. In 1859, Newton was Best relative to known data. In 1915, GR is Best relative to the *total* mosaic (including Mercury's perihelion).
  *   **The Problem:** The Humean view makes lawhood retrospective. At the moment of prediction, the "Best System" status was epistemic, not metaphysical. If laws are just summaries, the Vulcan prediction was rational but metaphysically groundless. The Humean gets credit for rationality but must admit the "law" he was using didn't have the modal stability to guarantee the outcome.

  ### II. The Necessitarian Mapping (Governing Laws)

  **Case Side: Options and Ranking**
  For the Necessitarian, laws are relations between universals or primitive modal facts that produce or constrain the mosaic. They have authority over particulars.

  Le Verrier's options remain the same, but the ranking justification differs.
  1.  **Error:** Possible, but unlikely given instrumental precision.
  2.  **Tinker with the Force Law:** Highly dispreferred. Laws are necessary/stable. To change the law is to claim the fundamental structure of reality is different than thought.
  3.  **Add Unobserved Mass:** Preferred. Laws govern boundary conditions. It is metaphysically cheaper to posit a contingent particular (Vulcan) than to posit a change in the necessary law.

  **Necessitarian Ranking:** Option 3 is overwhelmingly preferred. The law (Newtonian gravity) is taken to be a stable producer of events. If the effect (orbit) deviates, and the law is held fixed, the cause must be a missing antecedent condition (mass).

  **Expectations:** Le Verrier was entitled to expect success because he was reasoning from a law that *governs*. If the law holds, the prediction *must* obtain, provided all relevant conditions are specified. The expectation is not just about information compression; it is about causal/nomic necessitation.

  **Theory Side: Credit and Blame**
  *   **Neptune:** The Necessitarian takes full credit. The law governed the Uranian perturbations, and the inference tracked that governance.
  *   **Vulcan:** The Necessitarian takes *less* blame than the Humean, provided they distinguish between *True Laws* and *Putative Laws*. The failure of Vulcan does not refute the idea of governing laws; it refutes the claim that Newton's law was the *true* governing law in that domain.
  *   **The Problem:** The Necessitarian must explain why the *method* of inferring from laws was identical in both cases. If laws govern, they should leave a signature that distinguishes them from false generalizations. Le Verrier had no such signature. The Necessitarian gets a cleaner metaphysical story (Newton wasn't the real law), but a weaker epistemic story (we can't tell real laws from good summaries until after the fact).

  ### III. Analysis of Distinctions

  **1. Production vs. Reach**
  *   **Your Suspicion:** The episode is evidence about *reach* (licensing expectations about unobserved regions) and silent about *production* (making events happen).
  *   **Test Result:** The suspicion holds.
      *   **Silence on Production:** Nothing in the Neptune/Vulcan case demonstrates *production*. We see correlations between math and observation. Whether gravity "pushed" Neptune or merely summarizes its motion is undecidable from the data. The case is silent on the mechanism of lawhood.
      *   **Evidence on Reach:** The case is entirely about reach. Le Verrier extended the mathematical formalism into unobserved spatial regions.
      *   **Humean Claim to Reach:** You asked if reach is something the Humean can help herself to. Yes, but with a caveat. For the Humean, reach is an inductive bet on the uniformity of the mosaic. The Vulcan failure shows this bet is fallible. The Humean can claim reach, but she cannot claim that reach is *guaranteed* by the status of the statement as a "law." It is only guaranteed by the actual uniformity of the mosaic, which is unknown.
      *   **Necessitarian Claim to Reach:** For the Necessitarian, reach is derived from production. If the law produces the events, it reaches wherever the law applies. The Vulcan failure forces the Necessitarian to say the law *didn't apply*, not that the reach failed.
      *   **Verdict on Distinction:** The case adjudicates reach, not production. Both views can account for reach, but the Necessitarian ties it to truth, while the Humean ties it to systematization. The asymmetry (Neptune yes, Vulcan no) damages the Humean account of reach slightly more, as it shows the "Best System" can have high reach in one domain and zero in another without changing its formal status.

  **2. Slippage and Extendability**
  *   **Humean Slippage:** You note that for the Humean, the residual is an unsystematized particular, not a violation. The Humean owes an account of tolerable slippage.
  *   **The Trade-off:** Standard BSA trades simplicity vs. strength. Your case suggests a third virtue: *extendability* (stability across new domains).
  *   **The Secret Anti-Humean Work:** Does adding "extendability" smuggle in anti-Humeanism? **Yes.**
      *   To value a system because it *will* fit future or unobserved data is to value it for a property it does not yet possess relative to the *current* mosaic.
      *   If the Humean says, "Newton was better than GR in 1859 because it was simpler," she admits the law was false (no reach to Mercury).
      *   If the Humean says, "We should have preferred a system with better extendability," she is appealing to a modal virtue: the capacity of the system to hold in *counterfactual* or *future* situations. This treats the system as having a power beyond summarizing the *actual* mosaic. It treats the law as a guide to what *would* happen, not just what *did*. This is the core of the anti-Humean position.
      *   **Conclusion:** The Humean cannot easily incorporate "extendability" as a virtue of the Best System without conceding that laws are more than summaries of the actual. They become guides to the non-actual.

  ### IV. The Differential Vindication Constraint (DVC)

  **Definition:** Same author, method, and epistemic credentials, but one inference vindicated (Neptune) and one failed (Vulcan).

  **Weight:** The DVC bears heavy weight. It isolates the metaphysical status of the law from the epistemic practice of the scientist.

  **Against the Humean:**
  The DVC is damaging. If laws are just the Best System, and the Newtonian system was the Best System in 1859 (given available data), then the Vulcan inference was "lawful." Its failure implies that "lawful" inferences can be false. This severs the link between lawhood and truth. The Humean must say: "It was a law then, but it isn't now." This makes lawhood time-indexed and epistemic, which undermines the objective status the BSA tries to secure. The DVC shows that "Best System" status is not a reliable tracker of predictive success in new domains.

  **Against the Necessitarian:**
  The DVC is less damaging metaphysically but damaging epistemically. The Necessitarian says: "Neptune tracked a true law; Vulcan tracked a false one." This preserves the link between lawhood and truth. However, it concedes that scientists cannot distinguish true governing laws from false generalizations using the methods the laws themselves justify. If the method (perturbation analysis) is licensed by the law, and the method fails, was the method licensed? The Necessitarian must say the method was licensed *only if* the law was true, creating a circle: we know the law was true because the method worked, and the method worked because the law was true. The DVC breaks this circle by showing the method can fail.

  **Who Bears the Burden?**
  The Humean bears the heavier burden. The Necessitarian can absorb the failure as a case of *false belief* about laws. The Humean must absorb it as a case of *changing status* of laws. The former is a standard error; the latter is a metaphysical instability.

  ### V. Straight Verdict

  **For the Humean (Best System Account):**
  **Verdict: Anomaly.**
  This episode is not something the view was built to handle comfortably. The BSA relies on the global fit of the system to the mosaic. The Neptune/Vulcan asymmetry reveals that local extrapolations from the "Best System" are not modally robust. To explain why Le Verrier was rational to believe in Vulcan but wrong, the Humean must separate epistemic rationality from metaphysical lawhood. To explain why we value laws that *project* (like GR) over those that *fit* (like Newton in 1859), the Humean must import a virtue (extendability) that functions exactly like nomic necessity. The case suggests the Humean cannot account for the *authority* of laws in prediction without ceasing to be a Humean.

  **For the Necessitarian (Governing Laws):**
  **Verdict: Confirms (with epistemic caveats).**
  The episode confirms the core intuition that there is a fact of the matter about whether a law applies, independent of our confidence. Newton's law governed Neptune; it did not govern Mercury. The failure of Vulcan is evidence that the law has limits (domain specificity). The view handles the Differential Vindication Constraint by distinguishing truth from justification. However, the view is silent on *how* Le Verrier was to know the difference. It confirms the metaphysics of governance but highlights the opacity of our access to it.

  **Overall Pedagogical Recommendation:**
  Use this case to press the Humean on **Extendability**. If they admit that a system is better if it predicts new domains, ask them what *makes* it do that. If it's just a lucky fit, science is gambling. If it's because the system captures something real about the structure of the world that *constrains* the future, they have conceded the Necessitarian point. The case breaks the rut by showing that "Best System" is too static to account for the dynamic success and failure of theoretical extrapolation.
