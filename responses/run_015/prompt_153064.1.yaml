      This looks very strong. It combines *Control* (to handle 3, 4, 7) and *Normative Endorsement* (to handle 1, 2, 5, 6).
      
      *Wait, one tension:* In (1), the Chairman doesn't *endorse* the harm, he is *indifferent*. Does indifference count as endorsement of a normative deviance? In the Knobe literature, yes, "not caring about a norm" is treated as complicity.
      In (5), she *regrets* it. That is active non-endorsement.
      In (6), there is no norm to violate.
      
      *Refining the Principle for Precision:*
      **"Endorsed-Guidance Principle":** An outcome $O$ is intentionally brought about by Agent $A$ iff:
