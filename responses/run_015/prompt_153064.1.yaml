answer: |-
  You are experiencing a very common phenomenon in experimental philosophy: **stimulus saturation**. When you stare at the Chairman case for six weeks, your intuitions stop being "data" and start being "artifacts of exposure." Your roommate is half-right (semantics constrains the output) but half-wrong (the semantics are tracking underlying cognitive structures regarding agency and normativity).

  Your seven verdicts are actually remarkably consistent with a specific hybrid view in the literature that combines **Guidance Control** (from philosophy of action) with **Normative Complicity** (from the Knobe effect literature). The reason you feel tension is that you are trying to force a single *moral* explanation (Blame) onto a concept that is partly *metaphysical* (Causation/Control).

  Here is the principle that unifies your seven verdicts, the mapping of your data to it, the one verdict you should consider sacrificing, and the predictions for your new cases.

  ### The Principle: Complicit-Guidance Account

  **An agent $A$ intentionally brings about outcome $O$ if and only if:**
  1.  **Guidance Condition:** $O$ was produced by a causal mechanism that $A$ initiated and retained the capacity to veto or modify (i.e., $O$ was not the result of a deviant causal chain or pure luck).
  2.  **Complicity Condition:** $O$ represents a normative violation (or deviation from a default), and $A$'s attitude toward $O$ was one of *endorsement* or *indifference* (i.e., $A$ did not actively resist or regret $O$ as a cost).

  **Why this works:** It treats "intentionally" as a **filter**. The Guidance Condition filters out cases where the agent's will didn't actually steer the outcome (handling your Case 3). The Complicity Condition filters out cases where the outcome is good, neutral, or actively regretted (handling Cases 1, 2, 5, 6).

  ---

  ### Mapping Your Verdicts to the Principle

  Here is how your seven gut reactions pay for specific clauses of the principle:

  *   **(1) Standard Harm (Intentional):**
      *   *Guidance:* Met (Chairman authorized the program).
      *   *Complicity:* Met (Harm is a normative violation; Indifference counts as complicity).
      *   *Result:* **Intentional.**
  *   **(2) Standard Help (Not Intentional):**
      *   *Guidance:* Met.
      *   *Complicity:* **Failed.** (Help is not a normative violation; indifference to a good outcome does not constitute moral complicity).
      *   *Result:* **Not Intentional.** (Explains the asymmetry without reducing it purely to blame).
  *   **(3) Deviant Chain (Not Intentional):**
      *   *Guidance:* **Failed.** (The harm occurred via a mechanism he didn't count on/control, even if he wanted it).
      *   *Complicity:* Met (He wanted it).
      *   *Result:* **Not Intentional.** (This saves you from the "Blame = Intention" error. He is blameworthy for his *character*, but not for the *intentional action* because his will didn't guide the specific causal chain).
  *   **(4) Omission (Diluted Intentional):**
      *   *Guidance:* Met, but **Weak**. (Control via omission is psychologically processed as less direct than commission).
      *   *Complicity:* Met.
      *   *Result:* **Intentional (Scalar).** (This explains the "70%" feeling. The Guidance Condition is satisfied but with lower "gain").
  *   **(5) Trade-off/Regret (Not Intentional):**
      *   *Guidance:* Met.
      *   *Complicity:* **Failed.** (She *regretted* the bakery closing. Active regret negates complicity, even if the act was voluntary).
      *   *Result:* **Not Intentional.**
  *   **(6) Neutral (Not Intentional):**
      *   *Guidance:* Met.
      *   *Complicity:* **Failed.** (No normative violation exists to be complicit in).
      *   *Result:* **Not Intentional.** (The word "goes dead" because the Complicity Condition has nothing to latch onto).
  *   **(7) Committee (Group Intentional, No-Voters Not):**
      *   *Guidance:* Met for the **Group Agent** (the voting procedure) and the **Yes-Voters**. Failed for No-Voters (they lacked causal efficacy).
      *   *Complicity:* Met for Group/Yes-Voters.
      *   *Result:* **Group Intentional / Individual Split.** (This aligns with the "Group Agency" literature [e.g., Pettit/List]: the group is an agent distinct from the sum of members).

  ---

  ### The Sacrifice: Which Verdict to Give Up?

  If you are forced to make the principle binary (Intentional vs. Not Intentional) for the sake of clean data analysis, **you should sacrifice the scalar intuition in (4).**

  **Why:** The Complicit-Guidance Principle is fundamentally a threshold concept. While psychological *confidence* might vary (hence your "70%" feeling), the *attribution* of intentionality is typically treated as a binary gate in moral judgment (either you are responsible for it as an intentional act, or you are responsible for it as negligence/recklessness).
  **Recommendation:** Code (4) as **Intentional**. Treat the "dilution" as a separate dependent variable (e.g., "How much control did the agent have?") rather than muddying the intentionality measure. If you keep the scalar rating, you risk conflating *degree of control* with *presence of intention*.

  ---

  ### Predictions for Your New Cases

  Here is what the Complicit-Guidance Principle predicts for your two unsettled cases:

  **(a) The Machine Learning System (No human foresaw the harm)**
  *   **Analysis:**
      *   *Human Agents:* Guidance Condition **Failed** (No individual foresaw it, so they could not guide/veto the specific outcome).
      *   *ML System:* Guidance Condition Met (It optimized). Complicity Condition **Failed** (Current folk psychology does not attribute "normative indifference" to algorithms, only functional optimization. An algorithm cannot be "complicit" in a moral sense).
  *   **Prediction:** **Not Intentional.**
  *   **Nuance:** Participants will likely shift attribution to "Negligence" on the part of the deployers, but will resist "Intentional Harm." If you want to test the boundary of agency, this is a great case, but expect low intentionality scores.

  **(b) Probabilistic Harm (10% chance, Chairman indifferent, harm happens)**
  *   **Analysis:**
      *   *Guidance Condition:* **Weakened.** Initiating a 10% risk is not the same as guiding a specific outcome. The causal link between "will" and "outcome" is mediated by chance.
      *   *Complicity Condition:* Met (Indifferent to the risk of violation).
  *   **Prediction:** **Significantly Lower Intentionality than Standard Case.**
  *   **Nuance:** This often shifts the label from "Intentional" to "Reckless." In legal and folk terms, "Intentional" usually implies a high subjective probability (practical certainty). If you code this as binary, expect a significant drop in "Yes" responses compared to the 100% certainty vignette.

  ### Advice for the Pilot

  1.  **Trust the Deviant Chain (Case 3):** Your intuition there is philosophically robust (it's the classic *Chisholm* problem). Do not smooth this over. It proves your study isn't just measuring "Bad Thing = Intentional."
  2.  **Operationalize "Regret" (Case 5):** Ensure the vignette makes the regret explicit (e.g., "She sighed and said she wished there were another way"). If the regret is implicit, participants might project indifference.
  3.  **Group Agency (Case 7):** Be careful with the phrasing. If you ask "Did the committee intentionally...?" vs "Did the members intentionally...?" you will get different data. Your current setup distinguishes them, which is good. Keep that distinction.
  4.  **The Roommate's Point:** Tell your roommate you are testing **semantic assertability conditions constrained by metaphysical control**. That should keep them happy without conceding that it's *just* linguistics.

  You have a solid theoretical framework here. The tension you feel isn't incoherence; it's the friction between moral blame and causal control. Lean into that friction; it's where the interesting data lives.
