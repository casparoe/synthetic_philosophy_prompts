      *Let's go with a specific philosophical framework:* **The "Reasons-Responsiveness with Normative Default" Account.**
      This is testable.
      Principle: **An agent intentionally produces outcome O if O was part of the plan that guided the action, where 'part of the plan' is determined by whether the agent would have abandoned the action if O were guaranteed not to occur (Counterfactual Test), MODIFIED by whether O is normatively negative (Knobe Modifier).**
      *Wait, that's messy.*
      
      *Better:* **The "Control + Complicity" Principle.**
      Intentionality requires **Guidance Control** (ruling out deviant chains) AND **Moral Complicity** (ruling out neutral/positive side effects unless actively sought).
      
      *Let's formulate the specific principle for the user:*
      **Principle:** *An agent $A$ intentionally brings about outcome $O$ if and only if (i) $O$ was produced by a mechanism under $A$'s guidance control, and (ii) $A$ exhibited indifference to or endorsement of $O$ in a context where $O$ constitutes a normative violation.*
      
