      The user's intuition in (3) is the key constraint. It distinguishes *Moral Blame* from *Intentional Action*. This suggests a **Hybrid View**: Intentionality requires both a *Moral/Normative Component* (Knobe effect) AND a *Causal/Control Component* (Traditional philosophy of action).
