      Does this fit (7)? Committee has control. Members have control. Normative violation exists. Yes-voters indifferent/endorse. No-voters opposed (lack complicity). Correct.
      Does this fit (4)? Omission. Control exists (could have acted). Violation exists. Indifference exists. Intentional. (Dilution comes from the 'omission' clause in control).
      
      *This looks like the winner.* It's essentially a **Dual-Condition Theory** (Control + Normative Stance).
      
      *Addressing the Roommate:* The roommate says it's semantics. This principle shows it's *semantics constrained by metaphysics (control) and ethics (norms)*. It's not *just* the word.
      
