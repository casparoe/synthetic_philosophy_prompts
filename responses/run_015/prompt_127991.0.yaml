answer: |-
  The argument breaks at step (8), which infers that scheme-dependent claims lack a determinate subject matter. This step looked acceptable because it smuggles in a hidden premise that only attitude-independent (natural) kinds can support objective truths, conflating ontological independence with causal robustness. Your friend's reasoning proves too much: if (8) were true, claims about inflation, bankruptcy, or property rights would also be empty, since money and property are paradigmatically scheme-dependent yet support rigorous legal and economic assertions. The error is assuming that because we made the rules, the outcomes of the game aren't real.

  The cheapest alternative is to reject (8) while keeping (5), which is the standard social constructionist position. The cost here is metaphysical: you must explain how attitude-dependent facts can be objective enough for law and politics without collapsing into realism or eliminativism, usually by appealing to the stability of social structures. The next cheapest is to reject (5) and embrace biological realism, but this costs scientific credibility given the clinal nature of genetic variation. The most expensive alternative is to accept (8) and reject (9) (eliminativism), which saves the logic but costs you the literal truth of anti-racist claims, reducing them to useful fictions.

  Your distinction between live and inertial attitude-dependence is insightful but targets a vulnerability the argument doesn't explicitly exploit. The argument doesn't claim racial categories are volatile (live), only that they are constituted by attitudes (inertial or not). While inertial dependence explains why race feels fixed, it doesn't directly refute (8)'s claim about emptiness; money is also inertial yet constructed. A better formulation would distinguish between "ontological independence" and "causal robustness," arguing that constructed kinds are causally robust enough to ground inequality claims regardless of their origin.

  Ultimately, you should maintain that race is constructed (5) but deny that construction implies emptiness (8). The truth of disparate-impact claims relies on the objective reality of the social scheme, not its biological grounding. You can exit the whiteboard trap by insisting that social facts are facts, and that the rug remains firmly underfoot even if we woven it ourselves.

