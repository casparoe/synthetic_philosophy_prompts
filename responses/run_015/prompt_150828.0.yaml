      *Refining Move 5:* This is the pivot. If Nadia writes for the magazine, is the blame hers or the magazine's? Usually both. Dev's point about "laundered standing" is very strong. I will rate this "Right."
      *Refining the Verdict:* I need to be decisive. The Reader had a point. Nadia's standing was compromised *institutionally*, even if *personally* she was clean.

