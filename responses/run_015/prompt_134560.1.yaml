          *   *Procedural Privilege:* The "Gavel Right" (who sets the agenda for the last 10 mins).
      *   **Timeline:** 80 minutes.
          *   0-10: Setup & Rule Reading.
          *   10-30: Normal Legislation (get them comfortable).
          *   30-50: The Efficiency Crisis (The Trap).
          *   50-65: The Collapse & Scramble.
          *   65-80: Debrief.

  4.  **Drafting the Rulebook (The "Constitution"):**
      *   Needs to be printed and physical.
      *   *Article I (Authority):* "The Assembly possesses the power to alter this document."
      *   *Article II (Validation):* "No alteration is valid unless the motion explicitly cites Article I as its source of authority."
      *   *Article III (Integrity):* "Article II cannot be suspended or amended unless the motion to do so complies with Article II." (This is the recursive lock).
      *   *Article IV (Urgency):* "A motion of 'Efficiency' may suspend procedural rules to expedite voting." (The Trojan Horse).

  5.  **Refining the Trap (Crucial Step):**
      *   If they use Article IV (Efficiency) to suspend Article II, the Referee must rule on validity.
