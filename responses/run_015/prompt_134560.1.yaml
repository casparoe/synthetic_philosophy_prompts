      *   *The Specific Conflict:* An "Efficiency Motion" is introduced. It wants to suspend the citation requirement (Article 2). To pass this, they need to cite Article 1. But what if Article 1 *requires* Article 2 to be active to validate the citation?
      *   *Refining the Trap:* Let's make it simpler but sharper.
          *   Article 1: Sovereignty. "This Assembly holds all legislative power."
          *   Article 2: Procedure. "All amendments must cite the Article granting the power to amend." (Implicitly Article 1).
          *   Article 3: Entrenchment. "Article 2 cannot be suspended unless the motion to suspend cites Article 2."
          *   *Wait, that's circular.* Let's go with the prompt's specific instruction: "Recursive Entrenchment: every proposed amendment must explicitly cite the article that authorizes it, and that authorizing article must remain unsuspended at the exact moment of citation."
          *   *The Crisis:* A motion is made to suspend the Citation Requirement (Article 2) to speed up voting. To pass this motion, they must cite the Authority Article (Article 1). But Article 1 says "Authority is exercised *in accordance with* Article 2." So, to use Article 1, Article 2 must be active. To suspend Article 2, you must use Article 1. But using Article 1 requires Article 2.
          *   *Result:* You cannot legally suspend the rule that makes your legislation legal.

  3.  **Designing the Simulation Elements:**
      *   **Participants:** 14 students.
      *   **Roles:**
          *   Chair/Referee (1) - Enforces rules strictly.
          *   Drafting Committee (3) - Writes the motions.
          *   Dissent Recorder (1) - Tracks objections.
          *   Archivist (1) - Keeps the physical rulebook.
