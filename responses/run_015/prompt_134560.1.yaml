          *   If they don't suspend Rule 2, they run out of time.

  6.  **Developing the Debrief:**
      *   Must distinguish logical authority gap vs. political disagreement.
      *   Must predict the "drafting error" reaction (trying to write a new rule to fix the broken chain).
      *   Must admit the simulation lacks an "external validator" (the real world doesn't care if your law is logical, only if you have guns/enforcement). The facilitator supplies this truth.

