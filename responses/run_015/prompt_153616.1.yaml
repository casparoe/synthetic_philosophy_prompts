answer: |-
  This is a remarkably precise observation of a tension that sits at the heart of contemporary population ethics and longtermist philosophy. You have identified a specific cluster of intuitions that is widely held but rarely named as a single unit.

  Here is the breakdown of the concepts, the existing terminology, a proposed coinage for your piece, and the criteria for testing consistency.

  ### 1. The Book and the Nearby View
  The book you recall is almost certainly **Samuel Scheffler's *Death and the Afterlife* (2013)**, based on his Tanner Lectures.

  *   **Scheffler's Claim:** He argues for the "Afterlife Conception." We do not need to believe in a personal afterlife to sustain our values, but we *do* need to believe in a *collective* afterlife. If we knew humanity would go extinct shortly after our deaths, our current projects (science, art, raising children) would lose their *meaning* or *point*.
  *   **The Distinction:** Your interviewees are hedging against Scheffler. Scheffler says the *value* of the activities dissolves (retrospective hollowing). Some of your interviewees say the activities retain their value, but the *future good* is lost (prospective loss). This is a crucial divergence. Scheffler's view is about **meaning**; the interviewees' view is often about **value**.

  ### 2. Does This Configuration Have a Name?
  There is no single canonical term for the exact configuration you describe, because it is technically a contradiction within standard ethical frameworks. However, it is composed of two well-known philosophical problems:

  1.  **The Asymmetry (in Population Ethics):** First formalized by Jan Narveson and discussed extensively by Derek Parfit. The intuition is: "We are in favor of making people happy, but neutral about making happy people." This explains why your interviewees reject the mirror image (low birth rates are not a loss).
  2.  **The Non-Identity Problem:** Also Parfit. This deals with how actions that change *who* comes into existence cannot be said to harm those specific people (since they wouldn't exist otherwise).

  When combined with the specific focus on *extinction* (the end of the line) versus *non-procreation* (fewer branches), this specific shape is often discussed in Longtermist circles as **"The Value of Potential"** or **"Existential Catastrophe."**

  However, for your purposes, I recommend coining a term that captures the specific tension between the two directions of time.

  **Proposed Term:** **"The Asymmetry of Continuity"**
  **Definition:** The ethical intuition that preventing the *cessation* of future people is a catastrophic loss, while failing to *increase* the number of future people is not a loss, despite both resulting in fewer total future lives.

  ### 3. Is This One Phenomenon or Two?
  It is **two distinct phenomena** that are often conflated in conversation. Your interviewees are likely sliding between them without realizing it.

  **Phenomenon A: The Retrospective Claim (Schefflerian)**
  *   **Mechanism:** Meaning depends on **uptake**. A vaccine only matters if there are people to be vaccinated later; a symphony only matters if there are ears to hear it.
  *   **The Edge:** This view is vulnerable to the "Time Horizon" constraint you noticed. If extinction is 1,000 years away, my current projects *do* have uptake. This explains why some interviewees feel 10 centuries out is safe.
  *   **Philosophical Label:** **Intergenerational Dependence.**

  **Phenomenon B: The Prospective Claim (Utilitarian/Platonic)**
  *   **Mechanism:** Value exists independently of observers. The *potential* for good is a real thing that can be destroyed. This is the "lost future" argument standard in Longtermism (e.g., Nick Bostrom's calculation of "astronomical waste").
  *   **The Edge:** This view should logically condemn low birth rates just as much as extinction (if the total sum of happiness is lower). The fact that interviewees reject this suggests they are not actually holding this view consistently, or they are smuggling in a **Status Quo Bias** (ending the line is a violation; not starting new lines is not).
  *   **Philosophical Label:** **Impersonal Total Value.**

  **Why they conflate them:** In the case of *imminent* extinction, both mechanisms trigger simultaneously. Our projects lose their uptake (A) AND the future good vanishes (B). It takes careful questioning (like yours) to separate them.

  ### 4. The Replacement Case and the Split
  The division over the "Alien Replacement" case reveals a third, hidden variable: **Anthropocentrism vs. Sentientism.**

  *   **Group 1 (It is still a catastrophe):** They hold a **Sentientist** or **Universalist** view. The value is in *conscious experience* itself. If humans die but aliens flourish, the total value is preserved, but if they still call it a catastrophe, they are likely admitting that **Human Continuity** is the specific value, not just "good things happening."
  *   **Group 2 (It is not a catastrophe):** They hold a **Humanist** view. The value is specific to *our* lineage, *our* culture, or *our* species.
  *   **The Diagnostic:** This split tells you whether your interviewees are motivated by **welfare** (suffering/joy) or **identity** (the survival of "Us"). Most Longtermists claim the former, but their intuitions often betray the latter.

  ### 5. Evidence of Inconsistency (The Deflationary Explanation)
  You asked what would count as evidence that this is simply an inconsistency. In philosophy, this is often attributed to **Status Quo Bias** or the **Endowment Effect** applied to the species. We feel we *own* the future that follows us, but we do not feel we *owe* a future that doesn't follow us.

  To test this in your piece, look for these three fractures:

  **Test 1: The "Post-Human" Substitution**
  Ask: *If humanity evolves into a digital post-human species that is vastly happier but shares no biological or cultural continuity with us, is extinction a catastrophe?*
  *   **Consistent Prospective View:** No, that is a gain (more good).
  *   **Consistent Retrospective View:** Yes, our specific projects lose uptake.
  *   **Inconsistency:** If they say "Extinction is bad" but "Post-human replacement is also bad," they are prioritizing **Biological Continuity** over **Value**, which contradicts the "painless/full life" premise.

  **Test 2: The "Quality vs. Quantity" Trade-off**
  Ask: *Is a future with 1 billion extremely flourishing people better than a future with 100 billion barely-happy people?*
  *   **Consistent Prospective View (Total Utilitarianism):** 100 billion is better (more total good).
  *   **Consistent Retrospective View:** It depends on whether *our* values are upheld.
  *   **Inconsistency:** Most x-risk researchers argue extinction is bad because it loses *potential* (Quantity), but they often argue against low birth rates because quality of life might drop (Quality). Holding both positions simultaneously regarding the *same* metric of value is the inconsistency.

  **Test 3: The "Time Decay" Function**
  Ask: *At what exact point does the loss of future value drop to zero?*
  *   **The Trap:** If the loss is prospective (all future good), a death in 10,000 years is just as bad as a death in 100 years (assuming discount rates are zero, which Longtermists usually argue).
  *   **Inconsistency:** If they say extinction in 100 years is a catastrophe but extinction in 1,000 years is "not their concern," they are admitting the value is **Retrospective/Meaning-based** (tied to their own lifespan's ripple effects), not Prospective/Value-based. They cannot claim to be saving "humanity's future" if they only care about the future that overlaps with their own legacy.

  ### Summary for Your Piece
  *   **The Concept:** You are describing the **"Asymmetry of Continuity."**
  *   **The Philosophy:** It is a hybrid of **Scheffler's Afterlife Conception** (meaning requires uptake) and **Parfit's Impersonal Total Principle** (lost potential is bad), stitched together to avoid the counter-intuitive implications of each (i.e., that low birth rates are also catastrophic).
  *   **The Split:** The disagreement over the "Replacement Case" distinguishes **Humanists** (we must survive) from **Utilitarians** (good must survive).
  *   **The Deflation:** The view is likely unstable. It relies on treating the *continuation of the current line* as a special good without being able to justify why *more lines* (higher birth rates) or *different lines* (aliens/post-humans) do not count equally.

  If you need a single sentence to frame this in your article:
  *"They are advocating for a right to have descendants, without accepting a duty to create them; a position that relies on valuing the future only insofar as it resembles the past."*
