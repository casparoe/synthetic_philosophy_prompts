  7.  **Final Polish:** Ensure the distinction between "valuing the spirit" and "mandating the sacrifice" is clear. The key is to reward the *initiative* without rewarding the *exploitation of self*. The organization should ideally have paid her to do this. Since they didn't, the bonus acts as retroactive pay, but the public messaging must clarify that the *organization* failed to resource this, not that the *employee* succeeded by bypassing resources.

      *Wait, one nuance:* If the organization admits they failed to resource it, does that undermine the award? No, it strengthens the ethical stance. "We are rewarding you because you saved us/thes public when we didn't have a mechanism, but we promise to build that mechanism so you don't have to do this again." This aligns the Editor's desire for inspiration with the User's desire for labor protection.

