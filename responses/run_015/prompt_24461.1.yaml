      *   *Dev on Intervals as Placeholders:* He is partially right that sometimes intervals represent epistemic uncertainty (lack of knowledge) that could be reduced, but wrong to treat them as *merely* placeholders if the data is fundamentally thin (aleatory vs. epistemic).
