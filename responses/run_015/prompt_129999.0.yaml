answer: |-
  The "diachronic solution" you propose is the most structurally sound reading of *Memento*, yet the film subtly undermines it as a moral exoneration. To teach this effectively, you should screen three specific sequences that triangulate the tension between logical possibility and moral continuity.

  First, screen the **confrontation with Teddy in the derelict building** (the chronological end). Here, Leonard explicitly admits he knows the truth: he knows his wife survived the assault, knows he has already killed the real "John G.," and knows Teddy is helping him. Yet, he decides to manipulate the evidence to ensure he kills Teddy again. This scene confirms that the "deceiver" possesses the knowledge $p$ (Teddy is innocent/useful) while intending to create the belief $\neg p$ in his future self. It supports your reading that the paradox is avoided temporally: at $t_1$, Leonard knows; at $t_2$, Leonard believes.

  Second, screen the **tattoo parlor scene** where Leonard inks "John G. raped and murdered my wife" onto his thigh. This visualizes the materiality of the deception. Unlike standard philosophical examples where self-deception is a mysterious mental act, here it is an engineering project. Leonard is building a world—curating notes, burning photographs, tattooing skin—to constrain his future epistemic access. This adds a crucial dimension to the debate: self-deception is not merely a contradictory state of mind but a *practice of environmental manipulation*. It suggests the skeptic's puzzle assumes an internalist model of belief that *Memento* rejects; the belief is stored outside the mind, in the room, on the body.

  Third, however, you must screen the **Sammy Jankis insulin flashback**. Leonard tells this story to explain his condition, but the film reveals Leonard is projecting his own guilt onto Sammy. This is a *synchronic* act of repression: Leonard knows Sammy's story is his own, yet he tells it as if it were another's to avoid guilt *in the present moment*. This undercuts the diachronic solution. It suggests that even with amnesia, Leonard engages in standard, synchronic self-deception (denial/repression) alongside the diachronic note-writing. If he can deceive himself about Sammy while telling the story, the "split self" theory is insufficient; the deception is also internal and immediate.

  Regarding your question on identity: the film treats the diachronic split as a relocation of the problem, not a solution. While the amnesia creates an epistemic break, the moral continuity remains. Leonard's closing monologue ("I have to believe that my actions still have meaning") reveals he is not merely deceiving a stranger; he is sustaining a narrative required for his own existence. The "successor" self is not distinct enough to absolve the "predecessor" of responsibility, because the predecessor *chooses* the successor's ignorance to serve his own ends. The film resists the reading that this is merely one person deceiving another; the tragedy relies on them being the *same* person who has lost the capacity for truth.

  \answer{genuine self-deception} Although the film literalizes the temporal partitioning of knowledge, Leonard's enduring moral responsibility and the synchronic repression evident in the Sammy Jankis narrative collapse the distinction between deceiver and deceived.
