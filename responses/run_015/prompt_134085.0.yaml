answer: |-
  # Seminar Plan: Spinoza's *Tractatus Politicus* via Common Notions
  **Time:** 50 Minutes
  **Target:** Philosophy Undergraduates (Familiar with *Ethics*, New to *TP*)
  **Goal:** Argue that Democracy is the "most natural" regime because it alone institutionalizes *common notions*, preserving collective *potentia*.

  ---

  ## I. Sequence and Justification (0:00–0:05)
  **Order of Introduction:**
  1.  **Metaphysics of *Potentia* (Power/Capacity)**
  2.  **The Limits of the Social Contract (Natural Right)**
  3.  **Democracy as the Institutionalization of Common Notions**

  **Why this order?**
  You must begin with the **Metaphysics of *Potentia***. If you start with the failure of the social contract, students will treat Spinoza's politics as a mere institutional critique (like Locke or Rousseau). However, for Spinoza, politics is applied metaphysics. Students must first recall *Ethics* Part III: an individual's *right* is co-extensive with their *power* (*potentia*). Because *potentia* is the essence of a thing, it cannot be fully alienated. Only once students grasp that power cannot be truly transferred (only coordinated) can they understand why the Hobbesian contract fails and why Democracy is "natural." Democracy is not just a moral preference; it is the only structure that acknowledges the metaphysical impossibility of alienating one's *conatus*.

  ---

  ## II. The Metaphysical Foundation: *Potentia* and Common Notions (0:05–0:15)
  **Content:**
  *   Recap *Ethics* III, P6-7: *Conatus* (striving to persist) is the actual essence of a thing.
  *   Recap *Ethics* II, P38-40: **Common Notions** (*notiones communes*). These are ideas of properties common to all bodies (e.g., extension, motion). They are the basis of Reason. Crucially, common notions cannot be the source of error; they are equally in the part and in the whole.
  *   **The Political Translation:** In the *TP*, human *potentia* is individual capacity to act. When humans agree in nature, they increase each other's power (*Ethics* IV, P31).
  *   **The Bridge:** A political law functions as a **political common notion** when it is derived from what is *common* to all citizens (self-preservation/security) rather than what is *singular* to a ruler (whim/passion).

  ---

  ## III. The Failure of the Contract Model (0:15–0:25)
  **Content:**
  *   Contrast with Hobbes. Hobbes argues we transfer our right to the Sovereign.
  *   **Spinoza's Critique:** You cannot transfer your *potentia* because it is your essence. You can only promise obedience, but if your *conatus* is threatened, you *will* resist (you cannot stop striving to exist).
  *   **The Monarchy Problem:** In a monarchy, the state's power depends on the *singular* body of the King. The King is subject to passions (fear, anger, love). These are *not* common notions; they are inadequate ideas specific to one body. Therefore, a monarchy bases the collective power on a singular, irrational foundation. It creates a friction between the subjects' *conatus* and the Sovereign's commands.

  **[INTERCEPT MISCONCEPTION 1: Unanimous Rational Agreement]**
  *   **Misconception:** "If stability depends on reason, Spinoza must think all citizens must be philosophers."
  *   **Interception Point:** Immediately after explaining the Monarchy Problem.
  *   **Correction:** Clarify that Democratic stability does **not** require citizens to be internally rational. It requires the *laws* to function like common notions. Just as I can understand "motion" (a common notion) while feeling angry, I can obey a rational law while feeling passionate. Democracy aligns *actions* through shared interests (security), even if internal *affects* differ. We do not need unanimous agreement on *why* the law is good, only that the law preserves the *power* of all.

  ---

  ## IV. The Carrying Example: The Dike System (0:25–0:35)
  **The Example:**
  Imagine a low-lying region protected by a single continuous dike system.
  *   **The Common Notion:** "Water destroys life/property." This is a truth equally in the part (the farmer) and the whole (the state).
  *   **Monarchy Scenario:** The King owns the high ground. He decides to divert resources to build a palace fortress, neglecting the dike section protecting the farmers. His decision is based on a *singular passion* (pride/desire for luxury). The farmers' *conatus* (self-preservation) is now in direct conflict with the State's command. Their power is subtracted from the collective; they may revolt or flee. The State's total *potentia* decreases.
  *   **Democratic Scenario:** The dike maintenance is decided by a council representing all landholders. Deliberation forces the aggregation of local knowledge (where the leaks are). The resulting law ("Maintain dike height X") is based on the *common notion* of safety. Even if a merchant hates paying the tax, the law aligns with his *conatus* (he doesn't want to drown). His power is added to the collective.

  **Why NOT the Dutch Republic?**
  Do **not** use the actual 17th-century Dutch Republic as the positive example.
  *   **Reason:** The Dutch Republic was an oligarchy of Regents, not a Spinozist democracy. It was plagued by the exact factionalism Spinoza critiques (Orangists vs. States Party). Spinoza witnessed the murder of De Witt by a mob; this was a failure of the *actual* Dutch system to manage affects. Using it invites historical contingencies (Calvinism, trade disputes) that obscure the *metaphysical* argument. We need a structural model, not a historical case study.

  **[INTERCEPT MISCONCEPTION 2: Direct Democracy]**
  *   **Misconception:** "Spinoza wants everyone voting on every law (Athenian style)."
  *   **Interception Point:** While describing the "Democratic Scenario" in the Dike example.
  *   **Correction:** Explicitly state that Spinoza's *TP* Democracy relies on **large representative councils**, not direct town halls. He fears the "mob" as much as the King. The key is not *who* counts the votes, but that the *structure* ensures laws are derived from the common interest of a large multitude, making it statistically probable that laws approximate common notions rather than singular passions.

  ---

  ## V. Synthesis: Democracy as the "Most Natural" (0:35–0:45)
  **Content:**
  *   Return to the definition of "Natural."
  *   A government is "natural" if it minimizes the contradiction between the individual's *jus naturale* (right/power) and the Civil Law.
  *   In a Monarchy, the Law is the King's will (Singular). In Democracy, the Law is the collective will (Common).
  *   Therefore, Democracy is the most natural because it least requires the individual to act against their own *conatus*. It preserves the collective *potentia* because it turns individual striving into a shared structural force, mediated by laws that function as **common notions** (applicable to all, preserving all).

  ---

  ## VI. Diagnostic Question (0:45–0:50)
  **Instruction to Students:** "Do not answer with a slogan like 'freedom is good.' Answer using the metaphysics of power."

  **The Question:**
  > "Spinoza argues that democratic stability depends on laws functioning as *common notions*. Suppose a democratic majority votes to pass a law that confiscates the property of a specific minority faction to pay for public works. According to Spinoza's metaphysics of *potentia*, why does this law threaten the stability of the state *even if the voting procedure was perfectly democratic*?"

  **Expected Answer Key (for Instructor):**
  *   **Correct Grasp:** The student identifies that the law is no longer a "common notion" (what is common to all) but a "singular passion" (what benefits the part against the whole). By violating the *conatus* of the minority, the state turns their *potentia* into resistance. The collective power drops because the state is now fighting a part of itself. Democracy is not just procedure; it is the production of laws that preserve the power of the *whole* body.
  *   **Incorrect Grasp:** The student argues it is "unfair" (moralizing) or "illegal" (normative) without referencing the loss of collective *potentia* or the failure of the law to be "common."
