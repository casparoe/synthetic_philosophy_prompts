  What I'd like: build the tree out of *licencing rules for forming collections*, not out of a list of theory names — first the questions and the space of answer-combinations they allow, then the real positions dropped into that space, then the empty cells named as empty with a one-line note on whether they're empty because incoherent, unattractive, or just unexplored. Six to eight branch questions, eight to twelve leaves, plain indented text or numbered nodes, whatever's easiest to read. Every question has to be answerable by someone who has never heard the word "ZFC": phrase them as things like whether forming {x : φ(x)} is fine when x ranges over stuff you've already built but not over everything at once; whether a collection may contain itself; whether you want a collection of all collections; whether membership chains have to bottom out somewhere; whether you'd sooner give up part of classical logic than give up comprehension; and whether the fix is even about which collections exist rather then about which sentences are well-formed in the first place. Please make sure these leaves all show up: an iterative/cumulative picture, a two-sorted "some collections are too big to be members of anything" picture, a typed-or-stratified picture, a non-well-founded picture, a constructive/intuitionistic picture, and a keep-full-comprehension-and-learn-to-live-with-contradictions picture. Two extras I really want in: a branch for the negation-free cousin of the paradox (the one where the property is a conditional instead of a negation, so you get the same explosion without any step a dialetheist can block by fussing over negation), because I think it splits the contradiction-tolerant leaf in a way the original doesn't; and a home for one of our member's hand-rolled fix, where every property gets a "formation stage" and is only allowed to quantify over collections formed at strictly earlier stages — I can't tell whether that's just type theory wearing a hat or something that