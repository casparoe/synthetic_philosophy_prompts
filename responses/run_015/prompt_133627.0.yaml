      *   *Tension A (The Big One):* Belief 4 (Output > Effort in Code) vs. Belief 6 (Effort/Struggle > Output in Morality).
          *   *Why:* In dev, the artifact is king. In ethics, the *process* is king. This is a fundamental axiological clash.
          *   *Severity:* High. It suggests two different ethical frameworks operating simultaneously without reconciliation.

      *   *Tension B (The Definition Problem):* Belief 1 (Therapy/Enhancement distinction matters) vs. Belief 2 (Statistical normal is bad).
          *   *Why:* If you reject the statistical baseline, what is the "restored" state? If "restored" is just "functional in current society," then Belief 3 (Social Model) makes Belief 1 look like enforcing the status quo.
          *   *Severity:* Medium-High. This threatens the coherence of the core distinction.

      *   *Tension C (The "Crunch" Problem):* Belief 1 (Need vs. Want) vs. Belief 4 (Meds for crunch = okay/not cheating).
          *   *Why:* Crunch is usually optional/extra work. Using meds there looks like enhancement (Want). User calls it treatment/not cheating.
          *   *Severity:* Medium. Can be resolved by redefining "Need."

      *   *Tension D (Coercion vs. Obligation):* Belief 1 (We owe each other needs) vs. Belief 5 (Employers can't mandate enhancement).
