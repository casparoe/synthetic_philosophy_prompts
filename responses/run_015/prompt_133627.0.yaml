  *(Looking at 1 vs 2. If "normal" is bad, what is "broken"? User implies "broken" = "cannot function in current environment." This links to 3. This is solvable by shifting from "Statistical Normal" to "Functional Baseline." I will classify this as a definitional tension, solvable with a patch.)*

