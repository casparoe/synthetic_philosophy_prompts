      *   *Correction:* Make sure to explicitly address the ADHD context. The "baseline" for an ADHD brain isn't "neurotypical," it's "medicated ADHD."
      *   *Refinement on Belief 3:* The Social Model of Disability is key here. If the world is the problem, meds are a patch. Is patching the user better than patching the world? User seems to accept both (3 & 4). That's actually consistent if viewed as "mitigation while advocating for change." I should note that as a consistency.

