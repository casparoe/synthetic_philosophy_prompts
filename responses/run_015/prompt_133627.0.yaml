      *   **Tone:** Pragmatic, analytical, respectful of the "vibes vs. position" concern. Avoid academic jargon where possible, but use precise reasoning.

  2.  **Deconstruct the 7 Beliefs:**
      1.  *Therapy/Enhancement Distinction:* Real moral work. Restoration (need) vs. Improvement (want). Affects payment/obligation.
      2.  *Baseline Problem:* "Normal/Statistical" is a bad line (glasses/vaccines/literacy counter-examples).
      3.  *Social Model of Disability:* Disability is often disadvantage created by environmental design (e.g., school structure).
      4.  *Meds/Work:* Taking meds for normal work = treatment. Taking meds for crunch/extra output = not cheating. Output value > Effort value.
      5.  *Coercion (Parents/Employers):* Parents pushing enhancers on kids = wrong (non-side-effect reasons). Employers mandating enhancement = illegal/wrong (even with consent).
      6.  *Moral Enhancement:* Against engineering virtues (patience, kindness). Value is in *managing it yourself*.
      7.  *Naturalness:* "Unnatural" = 0 weight. Safety/efficacy is what matters.

  3.  **Initial Scan for Tensions (Brainstorming):**
      *   *1 vs. 2:* If "normal" is a bad baseline (2), how do we define "restoration" vs. "improvement" (1)? If I restore you to a baseline that doesn't exist statistically, is it still therapy?
      *   *1 vs. 4:* If I take meds for a "crunch weekend" (extra output), isn't that enhancement (want) rather than treatment (need)? But user says it's not cheating.
      *   *3 vs. 1:* If disability is social (3), then meds might be adapting the person to a bad environment rather than fixing a broken person. Does that make it enhancement (fitting a norm) rather than therapy (fixing a break)?
      *   *5 vs. 1:* If therapy is a need (1), why can't parents ensure kids have needs met via enhancers? Or is the distinction that enhancers aren't needs?
      *   *6 vs. 7:* "Unnatural" doesn't matter (7), but moral enhancement is wrong (6). Why? Is it safety? Or is there a hidden "natural" value in struggle (6) that contradicts (7)?
