answer: |-
  # SPECIFICATION FOR EVALUATION: MAIMONIDEAN SACRIFICIAL RECONSTRUCTION

  **Document Type:** Philosophical Desiderata / Evaluation Criteria
  **Subject:** The Sacrificial Persistence Problem in Maimonides
  **Context:** Graduate Seminar in Medieval Philosophy and Religion
  **Objective:** To establish necessary and sufficient conditions for any adequate philosophical reconstruction of Maimonides' position on animal sacrifice, specifically addressing the tension between the anthropological-genetic explanation in *The Guide of the Perplexed* and the legal-permanence codification in the *Mishneh Torah*.

  ---

  ## I. PREAMBLE: THE SACRIFICIAL PERSISTENCE PROBLEM

  Any adequate reconstruction must address the central tension: Maimonides posits sacrifice as a historical concession to idolatrous habit (anthropological-genetic), yet codifies it as eternally binding law with provisions for Messianic restoration (legal-permanence). A successful interpretation cannot dissolve this tension by dismissing one pole as rhetorical or obsolete. It must articulate a coherent philosophical position that holds both claims in productive equilibrium.

  The following desiderata are divided into **Non-Negotiable Constraints** (derived from explicit textual commitments and core metaphysical principles) and **Interpretive Preferences** (reflecting specific camp inclinations). A reconstruction failing a Non-Negotiable Constraint is deemed inadequate.

  ---

  ## II. STRUCTURAL LAYERS AND DESIDERATA

  ### 1. The Anthropological-Genetic Layer
  *Focus: The historical and psychological rationale for the commandment's institution.*

  | ID | Requirement | Motivating Consideration | Status |
  | :--- | :--- | :--- | :--- |
  | **AG-01** | **Historical Accommodation:** The reconstruction must explain sacrifice as a divine accommodation to the psychological limitations of the Exodus generation (habituated to idolatrous materialism). | Based on *Guide* III:32. Denying this reduces Maimonides' innovation to traditionalism. | **Non-Negotiable** |
  | **AG-02** | **Non-Obsolescence:** The reconstruction must explain why the *form* of sacrifice remains necessary even after the psychological defect (idolatrous habit) is ostensibly cured or manageable. | If the cure is permanent, the medicine should be unnecessary. This is the core of the Persistence Problem. | **Non-Negotiable** |
  | **AG-03** | **Teleological Continuity:** The reconstruction must identify a telos for sacrifice that transcends the historical moment of its institution without contradicting the historical explanation. | Required to bridge the gap between *Guide* (history) and *Mishneh Torah* (eternity). | **Non-Negotiable** |

  ### 2. The Legal-Permanence Layer
  *Focus: The jurisprudential status and future actualization of the law.*

  | ID | Requirement | Motivating Consideration | Status |
  | :--- | :--- | :--- | :--- |
  | **LP-01** | **Binding Force:** The reconstruction must affirm that sacrificial law retains full halakhic bindingness in the present (in absence of Temple) and future (with Temple). | Based on *Mishneh Torah* codification and *Letter to Yemen*. Denying this treats legal texts as mere rhetoric. | **Non-Negotiable** |
  | **LP-02** | **Messianic Restoration:** The reconstruction must account for the explicit claim that sacrifices will be restored in the Messianic era, despite the expectation of universal knowledge of God. | If knowledge of God is universal, the "accommodation to ignorance" should be unnecessary. This creates a paradox with AG-01. | **Non-Negotiable** |
  | **LP-03** | **Prayer Substitution:** The reconstruction must clarify that prayer substitutes for sacrifice only *de facto* (due to Temple destruction), not *de jure* (in principle). | Maimonides explicitly rejects the idea that prayer is the *true* intent that replaced sacrifice. Sacrifice remains the ideal mode of service. | **Non-Negotiable** |

  ### 3. The Metaphysical-Symbolic Layer
  *Focus: The ontological significance of sacrificial details and animal status.*

  | ID | Requirement | Motivating Consideration | Status |
  | :--- | :--- | :--- | :--- |
  | **MS-01** | **Intellect-Appetite Hierarchy:** The symbolic weight of sacrificial conditions (perfection, species) must be interpreted as tools for human moral/intellectual perfection (subduing appetite), not as intrinsic value in the animal. | Consistent with Maimonidean Aristotelianism. The goal is human virtue, not animal welfare. | **Non-Negotiable** |
  | **MS-02** | **Denial of Particular Providence:** The reconstruction must not attribute concern for individual animal suffering to Maimonides' rationale. | Maimonides denies particular providence extends to non-rational animals. Importing animal ethics is anachronistic. | **Non-Negotiable** |
  | **MS-03** | **Conventional vs. Natural:** The reconstruction must determine whether species specifications are natural kinds with metaphysical significance or conventional legal markers. | Affects whether the law is mutable. Maimonides generally leans toward conventional utility, but some symbols suggest natural hierarchy. | **Interpretive Preference** (Legal-Formalist vs. Esoteric-Symbolic) |

  ---

  ## III. SYSTEMIC CONSISTENCY REQUIREMENTS

  Beyond the three layers, the reconstruction must maintain coherence with Maimonides' broader philosophical system.

  1.  **Immutability of Divine Law:** The explanation must not imply that Divine Law changes essentially. If the *reason* changes (from curing idolatry to something else), the *law* must remain stable.
      *   *Status:* **Non-Negotiable**.
  2.  **Accessibility of Reasons:** The reconstruction must uphold the principle that commandments have reasons accessible to human reason, even if currently unknown or difficult. It cannot retreat into pure voluntarism (God commanded it *because* He commanded it).
      *   *Status:* **Non-Negotiable**.
  3.  **Exoteric/Esoteric Distinction:** The reconstruction must preserve the distinction between the pedagogical function (*taʿlīm*) offered to the multitude and the ontological/legal status apprehended by the elite. It must specify the relationship between these two (e.g., surface/depth, complementary, or unresolved).
      *   *Status:* **Non-Negotiable**. Collapsing this distinction renders Maimonides' esoteric method incoherent.

  ---

  ## IV. IDENTIFICATION OF JOINTLY UNSATISFIABLE PAIRS

  The following pairs of desiderata generate significant tension. A reconstruction may satisfy one at the expense of the other, but satisfying both requires high-level philosophical work.

  **Tension Pair A: The Exhaustive Concession vs. The Permanence Thesis**
  *   **Conflict:** Between **AG-01** (Sacrifice exists *solely* to cure a psychological defect of idolatry) and **LP-02** (Sacrifice will be restored in the Messianic era when idolatry is eradicated).
  *   **Analysis:** If the concession is exhaustive (the *only* reason), the law should expire when the defect is cured. If the law is permanent, the concession cannot be the *only* reason.
  *   **Resolution Demand:** The reconstruction must posit a secondary, enduring function of sacrifice that is compatible with the historical explanation but not exhausted by it.

  **Tension Pair B: Robust Symbolism vs. Aristotelian Hierarchy**
  *   **Conflict:** Between **MS-01** (Animal details symbolize human subordination of appetite) and **MS-02** (No particular providence for animals).
  *   **Analysis:** A robust symbolic reading often risks implying the animal has ontological significance in the ritual. If the animal is merely a prop for human psychology, the symbolism is thin. If the animal is metaphysically significant, it risks conflicting with the denial of animal providence.
  *   **Resolution Demand:** The reconstruction must articulate how the animal serves as a *medium* for human perfection without granting the animal *subjecthood* in the divine economy.

  **Tension Pair C: Exoteric Truth vs. Esoteric Truth**
  *   **Conflict:** Between **Exoteric/Esoteric Distinction** and **Accessibility of Reasons**.
  *   **Analysis:** If the historical explanation is merely exoteric (a "noble lie" for the masses), then the true reason is hidden. But Maimonides claims reasons are accessible. Is the historical explanation the *whole* truth or *part* of the truth?
  *   **Resolution Demand:** The reconstruction must clarify if the historical explanation is a partial truth or a pedagogical simplification of a deeper metaphysical truth.

  ---

  ## V. CRITICAL ASSESSMENT OF CONSTRAINTS

  **Most Damaging Requirement:**
  **AG-02 (Non-Obsolescence).**
  This requirement does the most damage to the currently dominant **Concessive-Pedagogical** reading. Most standard readings accept AG-01 (it was for idolatry) but implicitly fail AG-02 by treating sacrifice as a primitive stage Judaism has outgrown. AG-02 forces the interpreter to explain why a "cure" remains binding after the "disease" is gone. This requirement invalidates any reading that suggests Maimonides viewed sacrifice as spiritually inferior to prayer in principle.

  **Jointly Unsatisfiable Verdict:**
  It is highly probable that **AG-01 (Exhaustive Historical Concession)** and **LP-02 (Messianic Restoration)** are jointly unsatisfiable without modification.
  *   *Reasoning:* If the *only* reason is historical habituation, restoration in a perfected world is irrational.
  *   *Implication:* An adequate reconstruction *must* modify AG-01. It cannot claim the historical reason is the *exclusive* reason. It must argue that the historical reason is the *efficient cause* of the law's institution, while a metaphysical reason (e.g., ontological ordering of matter) is the *final cause* of its permanence.

  ---

  ## VI. EVALUATION OF INTERPRETIVE CAMPS

  The following table scores the three main interpretive camps against the Non-Negotiable Desiderata.
  *   **Pass:** Satisfies requirement coherently.
  *   **Fail:** Contradicts or dismisses requirement.
  *   **Strain:** Satisfies requirement only through significant philosophical contortion.

  | Desideratum | Concessive-Pedagogical Camp | Legal-Formalist Camp | Esoteric-Symbolic Camp |
  | :--- | :--- | :--- | :--- |
  | **AG-01** (Historical Accommodation) | **Pass** (Central thesis) | **Strain** (Often minimizes *Guide* claims) | **Pass** (Accepts as exoteric layer) |
  | **AG-02** (Non-Obsolescence) | **Fail** (Treats sacrifice as obsolete/spiritually inferior) | **Pass** (Law is law, regardless of reason) | **Pass** (Symbolic function remains eternal) |
  | **LP-01** (Binding Force) | **Strain** (Must explain why we don't practice now beyond Temple absence) | **Pass** (Central thesis) | **Pass** (Law reflects metaphysical truth) |
  | **LP-02** (Messianic Restoration) | **Fail** (Inconsistent with spiritual progress narrative) | **Pass** (Literal acceptance) | **Pass** (Restoration of cosmic order) |
  | **MS-02** (No Animal Providence) | **Pass** (Animals are irrelevant to the point) | **Pass** (Animals are legal objects) | **Strain** (Risk of attributing too much weight to the animal symbol) |
  | **Exoteric/Esoteric** | **Strain** (Often collapses distinction, taking *Guide* as final truth) | **Fail** (Often ignores esoteric dimension) | **Pass** (Central methodology) |

  **Camp Summaries:**
  1.  **Concessive-Pedagogical:** Strongest on Layer 1, fails Layer 2. It dissolves the Persistence Problem by denying the persistence. It violates **AG-02** and **LP-02**.
  2.  **Legal-Formalist:** Strongest on Layer 2, weak on Layer 1. It preserves the law but ignores the philosophical rationale, violating the **Accessibility of Reasons** and **AG-01**.
  3.  **Esoteric-Symbolic:** Strongest on Layer 3 and the Exoteric/Esoteric distinction. However, it risks violating **MS-02** if it attributes too much ontological weight to the animal, and it must carefully navigate **AG-01** to ensure the historical explanation isn't dismissed as mere falsehood.

  ---

  ## VII. FINAL SPECIFICATION NOTE

  A successful reconstruction must not merely choose a camp. It must demonstrate how the **Anthropological-Genetic** explanation serves as the *historical vehicle* for a **Metaphysical-Symbolic** truth that ensures **Legal-Permanence**.

  **The litmus test:** Can the reconstruction explain why a Messianic figure, who has eradicated idolatry and perfected human intellect, would *still* slaughter an animal in the Temple, without contradicting Maimonides' definition of perfection? If the answer relies on "obedience without reason," it fails the **Accessibility of Reasons**. If the answer relies on "animal welfare," it fails **MS-02**. If the answer relies on "historical habit," it fails **LP-02**.

  The reconstruction must provide a fourth option: Sacrifice as an eternal technology for the governance of matter by form, instituted historically through concession, but ontologically necessary for the embodied human condition, even in perfection.
