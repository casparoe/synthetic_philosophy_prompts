answer: |-
  Honouring sunk costs is not invariably irrational, provided one accounts for diachronic integrity and epistemic investment. The standard economic model insists decisions should rely solely on future utilities, dismissing past expenditures as irrelevant. This view treats agents as ahistorical snapshots, ignoring that human rationality is embedded in a narrative life. Abandoning a project merely because initial costs cannot be recovered can fracture diachronic integrity; sticking with commitments preserves continuity with one's past self, fostering self-trust and coherent identity. To constantly pivot based on cold calculus is to live discontinuously.

  Furthermore, epistemic sunk costs—the mental labour already expended to grasp a specific problem—are not truly 'sunk'. Switching contexts discards this accrued competence, imposing a fresh learning curve elsewhere. Thus, the prior investment yields a residual asset in the form of expertise, making continuation economically sensible where a stranger would see only loss. The standard view mistakenly categorises all past effort as waste, rather than recognising it as capitalisation of skill or character.

  Therefore, while throwing good money after bad remains foolish, honouring sunk costs is rational when it safeguards personal coherence or leverages accumulated knowledge. The fallacy lies not in considering the past, but in letting it dictate future value without assessing these deeper returns. Rationality requires weighing the cost of discontinuity against the marginal benefit of quitting.
