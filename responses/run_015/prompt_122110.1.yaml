  Move 2 (Mostly Right): It is well-established that human societies are not closed deterministic systems, making strict chaos theory application problematic. However, Jonas overstates structural inertia; social systems can amplify perturbations (e.g., revolutions). His claim that structures always dampen noise is an empirical generalization, not a theoretical necessity, and remains contested among sociologists.

  Move 3 (Mostly Right): Shifting to path dependence grounds the argument in established historical institutionalism rather than physics. The mechanism of feedback loops locking in early differences is a recognized social science model. This avoids the determinism trap while preserving the significance of micro-events through structural mediation, though the specific locking mechanisms vary by context and are not universal.

