answer: |-
  Here is the prediction and the strategic analysis you need for your defense.

  ### The Prediction
  She will **reject** the claim that the $150,000 is required. She will argue that you are obligated only to your **fair share ($3,000)**, despite the defaults of others.

  ### The Principle She Is Running
  She is running **Principle C: A duty capped at one's fair share under full compliance, which others' defaults do not inflate.**

  While her verdicts on the kidney and the child suggest a protection of specific goods (Principle B), and the suit vs. savings distinction suggests a cost threshold (Principle A), the specific structure of your Flood Case—*others' defaults*—triggers her compliance condition. If she accepted that others' failures increase your duty, she would be committed to requiring the high-paying career in your earlier verdict (to make up for those who don't donate). Since she explicitly said morality "cannot settle" that career choice, she has already signaled that agents are not required to maximize their economic capacity to cover the shortfall of others. The Flood Case is simply the retrospective version of the Career Case: you are not required to liquidate your past economic security (savings) to cover others' failures any more than you are required to mortgage your future economic capacity (career) to do so.

  ### The Verdict Doing the Most Work
  The **Career Choice verdict** ("choosing between a teaching career and a better-paying career... is a choice morality cannot settle") is the anchor.

  This verdict establishes that her theory is not consequentialist regarding resources. If the moral demand were simply to save the most lives regardless of compliance, she would have to say the agent *must* take the high-paying career to donate the third. By refusing to demand that, she establishes a boundary around the agent's economic life planning. The Flood Case attempts to cross that boundary by demanding the liquidation of the safety net that makes that life planning possible. The Career verdict proves she protects the agent's economic agency against the demands of non-compliance.

  ### The Test Case to Separate the Principles
  To cleanly separate **Fair Share (C)** from **Well-being Ceiling (A)** during the defense, put this case to her:

  > **The Rich Default Case:** An agent is extraordinarily wealthy ($100 million net worth). Her fair share of a global crisis, calculated under full compliance, is $5 million. Due to massive defaults by others, her contribution is now requested to be $10 million. This $10 million loss has *zero* impact on her well-being, life projects, or security; she will not notice the difference.
  >
  > **Question:** Is the extra $5 million (above fair share) obligatory?

  *   **If she says Yes:** She is running **Well-being Ceiling (A)**. (Cost is irrelevant if well-being is untouched).
  *   **If she says No:** She is running **Fair Share (C)**. (The duty is structural, not just about cost).

  This forces her to admit whether the limit is about *harm to the agent* or *fairness among agents*. Given her Career verdict, she will likely say No, confirming Principle C.

  ### Where Your Reconstruction Is Most Likely Wrong
  Your reconstruction fails on the **categorization of savings**.

  You have treated the $150,000 savings as functionally identical to the "year's discretionary income" ($10k) from her earlier verdicts. You argue that because money is fungible (unlike kidneys or children), the amount shouldn't matter.

  **The Error:** You are ignoring the **threshold where fungible resources become non-fungible security.**

  For your advisor, "discretionary income" is surplus; "savings" (specifically a safety net) are the *precondition* for maintaining the "projects that make life the agent's own" (the language she used in the Child verdict). By liquidating the safety net, the agent risks future agency. If a medical emergency or job loss occurs next year, she becomes a burden on the state or others, or her vocation is threatened.

  You have reconstructed her view as: *Body/Projects = Protected; Money = Expendable.*
  Her actual view is likely: *Body/Projects/Security = Protected; Surplus Income = Expendable.*

  In the defense, do not defend the idea that she *must* accept the $150k obligation. Instead, concede that the Fair Share principle limits the demand, but argue that the *definition* of Fair Share in non-ideal theory is the real battleground. This shows you understand her position better than she expects, turning a potential attack into a demonstration of mastery. She will likely appreciate that you forced the Fair Share principle into the open, even if she corrects your application of it.
