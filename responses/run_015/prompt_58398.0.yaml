  Your framing rests on a confused premise because a five-session student group cannot reliably identify field-wide research priorities, so you should instead prioritize understanding the shift from alternative possibilities to sourcehood over refining Frankfurt-case mechanics.

  Prioritize the question of whether defeating the Principle of Alternative Possibilities (PAP) actually aids compatibilism once manipulation and ultimate sourcehood worries are on the table, as this is the philosophically dominant bottleneck; contemporary incompatibilists largely concede that Frankfurt cases undermine PAP but argue that responsibility still requires being the ultimate source of one's actions, meaning refuting PAP alone solves little. This question scores highest on philosophical importance and dependency because nearly all subsequent debates about free will hinge on whether sourcehood, rather than alternative possibilities, is the necessary condition for responsibility. It is also more tractable for non-specialists than metaphysical nuances about intervention, as manipulation cases (like Mele's zygote argument or Pereboom's four-case argument) rely on intuitive narratives rather than technical modal logic.

  Secondarily, prioritize whether these examples carry over from positive actions to omissions and responsibility for outcomes, as this tests the robustness of your theoretical framework across different categories of agency. This is valuable because omissions often reveal hidden assumptions about control that action-based cases obscure, and it is neglected in introductory surveys that focus exclusively on commission.

  Explicitly deprioritize the debate over whether any remaining alternative, however thin (such as the difference between locking exits versus pushing), defeats the example. This "flicker of freedom" strategy is highly technical, diminishing in philosophical return, and often functions as a defensive maneuver for PAP rather than a constructive path forward for understanding responsibility. For students, sinking time into distinguishing intervention methods yields low tractability and negligible impact on the broader literature, which has largely moved toward sourcehood incompatibilism regardless of Frankfurt-case success.

  The tradeoff is that by deprioritizing the technical variants, you will be unable to defend Frankfurt cases against sophisticated "flicker" objections, but you will gain a more accurate map of the current meta-ethical landscape where PAP is rarely the sole battleground. I would revise this ranking only if a new argument emerged demonstrating that specific mechanical details of Frankfurt cases directly resolve sourcehood worries, but given the current state of the literature, such a development is unlikely.
