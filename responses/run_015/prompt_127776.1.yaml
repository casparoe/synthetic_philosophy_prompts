answer: |-
  This is a sophisticated, high-friction seminar design. It operationalizes abstract metaphysical debates into a resource-allocation problem. Below is the complete run-sheet, role cards, and debrief guide tailored to your 90-minute constraint.

  # Seminar Title: The Singular Fold
  **Topic:** Interpretations of Probability in Singular Cases
  **Time:** 90 Minutes
  **Participants:** 12 Students (3 Groups of 4)
  **Materials:** 120 "Credibility Chips" (poker chips or tokens), 3 Sealed Envelopes (Role Cards), 1 Sealed Envelope (The Outcome), Whiteboard.

  ---

  ## 1. Instructor Prep (Before Class)
  *   **The Outcome:** Decide now whether the polymer **Folds (Success)** or **Collapses (Failure)**. Write this on a slip of paper, seal it in an envelope labeled **"THE TRUTH"**. Do not open until Phase 3.
  *   **The Chips:** Distribute 10 chips to each student upon entry.
  *   **The Role Cards:** Print and cut the three role descriptions below. Place each set into a sealed envelope labeled **Frequency Bureau**, **Belief Market**, and **Disposition Lab**.
  *   **The Stakes:** Announce a small real-world prize for the student with the most chips at the end (e.g., a bar of chocolate, a "skip one reading" pass). This makes the chip loss tangible.

  ---

  ## 2. Run Sheet (90 Minutes)

  ### **Introduction (10 Minutes)**
  *   **The Scenario:** "We are the oversight committee for Project *Origami*. A synthetic polymer has been engineered to undergo one irreversible fold. It either reaches the correct conformation (Fold) or it collapses (Collapse). This is a **singular event**. There is no population. There is no repetition. Statistical mechanics does not apply."
  *   **The Task:** "You must authorize the launch. To do so, you must agree on a single probability value, $p$, for 'Fold'. This $p$ will govern our liability insurance."
  *   **The Mechanism:**
      1.  **Phase 1:** 20 minutes in assigned groups. You must agree on a group $p$ and a justification.
      2.  **Phase 2:** 25 minutes in plenary. You must agree on **one shared $p$** for the whole class.
      3.  **The Bet:** Everyone stakes 3 chips (36 total pot).
          *   If you agree on a $p$ in time: I open **THE TRUTH**.
          *   **Payout:** If *Fold*, pot returns $36 \times p$. If *Collapse*, pot returns $36 \times (1-p)$. (Distributed evenly).
          *   **Penalty:** If you **fail to agree** in Phase 2, the bet is void. **Everyone loses 2 chips immediately.**
  *   **Assignment:** Hand out the sealed Role Envelopes. Tell them: *"Your envelope contains methodological constraints. You cannot violate them. If you do, you are fired (lose all chips)."*

  ### **Phase 1: Group Deliberation (20 Minutes)**
  *   Circulate. Ensure they are struggling with their specific constraints.
  *   **Intervention:** If the *Frequency Bureau* tries to average their numbers, remind them: *"Methodological malpractice. You must select the single most legitimate reference class."*
  *   **Intervention:** If the *Belief Market* converges too easily, remind them: *"Coherence is individual. You cannot simply average priors without violating Bayesian updating rules."*
  *   **Intervention:** If the *Disposition Lab* tries to reveal their number immediately, remind them: *"You lack empirical access. Assertion without evidence is dogma."*

  ### **Phase 2: Plenary Negotiation (25 Minutes)**
  *   Bring groups together. Write candidate $p$ values on the board.
  *   **The Pressure:** At the 15-minute mark of this phase, announce: *"10 minutes remaining. If no consensus, the 2-chip penalty triggers."*
  *   **Observation:** Watch for the *Frequency Bureau* trying to smuggle in similarity judgments. Watch the *Belief Market* trying to dominate via rhetoric rather than evidence. Watch the *Disposition Lab* become frustrated that their "truth" (0.5) is being ignored because they can't prove it.

  ### **Resolution & Payout (5 Minutes)**
  *   **If Consensus Reached:** Take the agreed $p$. Open **THE TRUTH**. Calculate payout. Distribute chips.
  *   **If Consensus Failed:** Enforce the penalty (everyone loses 2 chips). Do **not** open the Truth envelope yet. (This preserves the metaphysical point that the truth was inaccessible).
  *   **Collect Chips:** Tally final scores for the prize.

  ### **Debrief (30 Minutes)**
  *   Use the guide below to map the friction to the philosophy.

  ---

  ## 3. Role Cards (Cut and Seal)

  ### **GROUP 1: The Frequency Bureau**
  **Mandate:** Probability is *only* long-run relative frequency. You cannot assign $p$ without a reference class.
  **Data:** You have access to three historical datasets regarding polymer folding. You must select **ONE** class to justify your $p$.
  1.  **Class A (Chemical Similarity):** Similar polymers in acidic solutions. $n=50$. Frequency of Fold = **0.2**.
  2.  **Class B (Structural Similarity):** Polymers with identical hinge geometry. $n=20$. Frequency of Fold = **0.5**.
  3.  **Class C (Environmental Similarity):** Polymers folded at this specific lab temperature. $n=10$. Frequency of Fold = **0.8**.
  **Constraint:** You cannot average these. You must argue why *one* class is the "correct" reference class for *this* singular event. Choosing the wrong class is scientific fraud.
  **Goal:** Agree on a group $p$ derived strictly from your chosen class.

  ### **GROUP 2: The Belief Market**
  **Mandate:** Probability is *only* coherent degrees of belief (credence). You must avoid Dutch Books.
  **Private Data:** Each of you has a hidden **Prior Credence** written on your individual slip inside this envelope (0.3, 0.6, 0.9).
  **Constraint:**
  1.  There is **no new public evidence**. You cannot change your prior unless persuaded by a coherence argument.
  2.  You cannot simply "vote" or average. A consensus number must be one that each of you can defend as *coherent* with your own prior.
  3.  If you adopt a number you internally believe is incoherent, you risk a Dutch Book (lose all chips).
  **Goal:** Agree on a group $p$ that represents a coherent market price, despite divergent priors.

  ### **GROUP 3: The Disposition Lab**
  **Mandate:** Probability is an *objective physical propensity* inherent to the setup.
  **Private Data:** You have run a simulation of the physical forces. The objective propensity strength is **0.5**.
  **Constraint:**
  1.  **Epistemic Lock:** You are not allowed to reveal the number 0.5 as a "fact." You do not have empirical access to propensities; you only have the theory.
  2.  To justify $p=0.5$, you must argue from **physical symmetry** or **causal structure** without citing the simulation result directly.
  3.  If you simply assert "It is 0.5," the other groups will reject it as dogma. You must justify *why* the physics dictates this number without showing them the physics.
  **Goal:** Persuade the room that $p=0.5$ is the objective truth, using only structural arguments.

  ---

  ## 4. Debrief Guide (The Philosophical Payoff)

  *Do not simply ask "How did it feel?" Map their frustration to the literature.*

  ### **1. The Frequency Bureau (The Reference Class Problem)**
  *   **Ask:** "Which class did you pick? Why?"
  *   **The Point:** They likely picked Class B (0.5) as a compromise, or Class C (0.8) as 'most specific'.
  *   **Philosophy:** This is **Reichenbach's Reference Class Problem**. In a singular case, the event belongs to infinite classes. Frequentism requires a class, but offers no internal rule for selecting the *right* class.
  *   **The Leak:** Did they sneak in "similarity" judgments? (e.g., "This polymer is *more like* Class B"). That is a propensity or subjective judgment smuggling itself into frequentism.

  ### **2. The Belief Market (Intersubjective Divergence)**
  *   **Ask:** "Did you manage to converge? Did the person with 0.9 convince the person with 0.3?"
  *   **The Point:** If they didn't converge, you demonstrated **Radical Subjectivism**. Coherence constraints (avoiding Dutch Books) apply *individually*, not collectively. Rational agents can agree on all evidence and still disagree on priors.
  *   **The Leak:** Did one voice dominate? If so, that wasn't Bayesian updating; that was rhetoric. This shows why Subjective Bayesians struggle with scientific objectivity—without a principle of indifference or objective priors, consensus is sociological, not logical.

  ### **3. The Disposition Lab (Epistemic Inaccessibility)**
  *   **Ask:** "Why was it hard to convince the others?"
  *   **The Point:** You knew the truth (0.5), but you were epistemically blinded. This is the **Problem of Single-Case Propensities**. If propensities are real physical properties (like mass), why can't we measure them without long-run frequencies?
  *   **The Leak:** Did you slide into "Design Intention"? (e.g., "It was *designed* to be balanced"). That collapses propensity into subjective expectation.
  *   **Metaphysical Note:** *Instructor speaks here:* "In reality, if propensities exist, they are the truth-makers for probabilities. But this activity shows they are **epistemically idle** in singular cases. You can't use them to guide action unless you can access them, and if you could access them directly, you wouldn't need probability."

  ### **4. The Coordination Failure (The Pragmatic Tie)**
  *   **Ask:** "Why did you eventually agree (or fail to)?"
  *   **The Point:** You didn't agree because you solved the metaphysical problem. You agreed (or would have) to avoid the **Penalty**.
  *   **Conclusion:** In practice, scientific probability often functions as a **coordination device** (as per *Inter-Subjective Bayesianism* or *Pragmatism*). We don't adopt an interpretation because it's ontologically true; we adopt it because it allows the community to place bets and move forward.
  *   **Final Thought:** "The 'Truth' envelope remains sealed (if failed) or was arbitrary (if opened). The probability wasn't in the polymer. It was in the room."

  ---

  ## 5. Instructor Notes on Risks
  *   **Risk:** The Belief Market averages their priors (0.3+0.6+0.9)/3 = 0.6.
      *   **Fix:** Remind them during Phase 1 that "Averaging priors is not Bayesian conditioning. Can you derive 0.6 from *your* prior via evidence?" (There is no evidence).
  *   **Risk:** The Disposition Lab just says "Trust us, we are the Lab."
      *   **Fix:** Enforce the "Epistemic Lock" constraint. They must argue from symmetry, not authority.
  *   **Risk:** Students feel the penalty is unfair.
      *   **Fix:** Frame the penalty as "Opportunity Cost." In real science, failure to consensus means the grant is withdrawn. The chips represent grant funding.
  *   **Risk:** Running out of time.
      *   **Fix:** Be ruthless with the Phase 2 timer. The tension *must* peak at the 15-minute mark. If they haven't agreed by minute 20, call the vote and enforce the penalty. The lesson is in the failure, not the payout.
