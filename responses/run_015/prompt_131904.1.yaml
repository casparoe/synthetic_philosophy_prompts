      *   *Analysis:* The third case is crucial. It shifts the locus of rationality. If a recommender system filters the menu, the user might optimize locally, but the *system* satisficed (or optimized) globally. This complicates the "as-if" argument because the cost function is now distributed across agents. It makes the "single agent optimization" model empirically hollow because the "costs" are actually *incentives of the platform*.
