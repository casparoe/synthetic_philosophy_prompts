answer: |-
  **Scenario**
  Manager Elena wants employee Sam to accept a lateral transfer beneficial to both. Sam hesitates. Elena knows Sam values skill growth over stability. She presents three true reasons: "This builds Python skills," "It connects you to Tokyo," "It aids VP promotion." She omits that her department desperately needs coverage there. She sequences reasons to maximize emotional impact. She does not disclose she is curating this list to steer him. Sam deliberates and accepts. Later, informed of the curation, Sam says, "I'm glad I went; those reasons were sound." Had Elena said initially, "I'm ordering these to make you agree," Sam would have resisted out of spite.

  **Walkthroughs**
  (i) **Bypass:** Elena addresses Sam's rationality with true propositions. Sam weighs them. No psychological subversion occurs; the route is reason-based. Verdict: **Legitimate.**
  (ii) **Hidden-Agenda:** Elena intends to steer Sam via selection/sequencing. This intention is concealed. Concealment prevents Sam from accounting for her bias in his deliberation. Verdict: **Manipulative.**
  (iii) **Tool:** Elena engages Sam's self-governing choice via reasons. She does not bypass his will to produce a decision mechanically. She treats him as a reason-responder, albeit covertly. Verdict: **Legitimate.**

  **Matched Variant**
  Elena discloses: "I want you to take this, so I'm highlighting reasons I know move you."
  (i) Unchanged (Legitimate). (ii) Flips (Legitimate): Intention is transparent, removing the hidden agenda. (iii) Unchanged (Legitimate). This confirms (ii) isolates hiddenness as the normative fault.

  **Diagnosis & Reply**
  The normative work is done by the **concealment of the steering intention**, not the content or mechanism. Sam's autonomy is respected in outcome (iii) and process (i), but violated in the *terms of engagement* (ii).

  Defender of (i) argues sequencing affects salience sub-consciously, bypassing deliberation. This is **ad hoc**. If any salience manipulation counts as bypass, all persuasion is manipulative. The genuine implication is that (i) cannot distinguish covert steering from open reasoning when reasons are true.

  **Deception Check**
  No lies told. Omission of departmental need is not deception about the *reasons for Sam*. The TA cannot claim disguised deception without conflating motive with reason. The case holds.
