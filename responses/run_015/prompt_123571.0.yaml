  # Section Handout: The Toxin Classification Tree

  **Note to Section Leader:** This instrument is designed to bypass the CDT/EDT debate initially. As per seminar constraints, Decision Theory is treated here as a proxy for the "Reason Autonomy" node (Question 4). If a student insists CDT/EDT is independent, direct them to Question 4: EDT treats the *evidence* of intending as a reason to intend (Autonomy = Yes); CDT denies this (Autonomy = No).

  ### The Decision Tree

  **Q1. The Belief Condition**
  To honestly say "I intend to drink the toxin tomorrow," must you also believe "I will drink the toxin tomorrow"?
  *   **YES:** (You cannot intend what you believe you won't do.) → Go to **Q2**.
  *   **NO:** (You can intend even if you know you won't follow through.) → Go to **Q4**.

  **Q2. The Voluntarism Check**
  You know you won't drink (because it's painful and pointless). Can you simply *choose* to believe you will drink anyway, despite this evidence?
  *   **NO:** (Belief is involuntary; you can't lie to yourself at will.) → Go to **Q3**.
  *   **YES:** (You can force the belief through an act of will.) → Go to **Q3B**.

  **Q3. The Lockbox Variant**
  You cannot form the intention directly. But suppose you could pay a small fee tonight to lock yourself in a room tomorrow where you *must* drink. Would you pay the fee?
  *   **NO:** (You won't pay to drink, and you can't intend.) → **Leaf 1**.
  *   **YES:** (You can't intend the act, but you can intend the *constraint*.) → **Leaf 2**.

  **Q3B. The Bland Button Variant (for Voluntarists)**
  You can force yourself to believe you will act. In the "Bland Button" case (pressing a button that causes only mild inconvenience), is forming this belief easier than in the Toxin case?
  *   **NO:** (The difficulty is purely doxastic; pain level doesn't change the belief barrier.) → **Leaf 3**.
  *   **YES:** (Pain makes self-deception harder, even if possible.) → **Leaf 4**.

  **Q4. Reason Autonomy**
  You don't need to believe you'll drink to intend. But is the money (a reason to *intend*) a valid reason even though it is not a reason to *drink*?
  *   **NO:** (Reasons for intending must be reasons for acting.) → Go to **Q5**.
  *   **YES:** (Reasons for intending can be independent of reasons for acting.) → Go to **Q6**.

  **Q5. Temporal Binding (The Resolute Choice Check)**
  If reasons must align, you need a reason to drink tomorrow. Does forming the intention *tonight* create a new reason to drink *tomorrow*?
  *   **NO:** (Past intentions don't change future reasons.) → **Leaf 5**.
  *   **YES:** (Commitment creates reasons.) → Go to **Q5B**.

  **Q5B. The Serial Variant**
  Does this commitment work only if the offer repeats for a month (building a policy), or does it work for the single night too?
  *   **SINGLE NIGHT ONLY:** (One-off resolution is sufficient.) → **Leaf 6**.
  *   **SERIES REQUIRED:** (You need the iterated context to sustain the reason.) → **Leaf 7**.
      *(Note: Flag these leaves as potentially indistinguishable; see Key.)*

  **Q6. The Nature of Intention**
  Reasons are autonomous. How do you form the intention?
  *   **ADOPTING A PLAN:** (Intending is settling on a course of conduct for coordination.) → Go to **Q6B**.
  *   **ACT OF WILL:** (Intending is a mental action you can perform directly.) → **Leaf 9**.

  **Q6B. The Bland Button Variant (for Planners)**
  If intending is adopting a plan, is the plan easier to adopt in the Bland Button case (no illness) than the Toxin case?
  *   **NO:** (The structural lack of reason to act is the only barrier; pain is irrelevant.) → **Leaf 8**.
  *   **YES:** (Aversion disrupts planning even if reasons are autonomous.) → **Leaf 9**.

  **Q7. The Empty Cell Check**
  (Reached only if you answered YES to Reason Autonomy, YES to Plan, and claim Bland is *Harder* than Toxin).
  *   **BLAND IS HARDER:** → **Leaf 10**.

  ---

  ### Scoring Key & Position Analysis

  **Leaf 1: The Hard Impossibilist**
  *   **Position:** You cannot intend, and you will not pay to force the act.
  *   **Most Awkward Commitment:** You must leave the billionaire's money on the table even though you value the money more than the cost of the Lockbox fee.

  **Leaf 2: The Lockbox Instrumentalist**
  *   **Position:** You cannot intend the act, but you can intend to constrain yourself to act.
  *   **Most Awkward Commitment:** You admit the Billionaire's condition (intend to drink) is impossible for you, so you technically deserve no money, even if you pay for the Lockbox.

  **Leaf 3: The Pure Self-Deceiver**
  *   **Position:** You can intend by forcing a belief, regardless of pain.
  *   **Most Awkward Commitment:** You claim you can believe you will drink a painful toxin just as easily as you can believe you will press a bland button, despite the evidence of your own aversion.

  **Leaf 4: The Cost-Sensitive Deceiver**
  *   **Position:** You can intend by forcing a belief, but pain makes it harder.
  *   **Most Awkward Commitment:** You rely on self-deception, which is generally considered irrational, as a stable basis for rational agency.

  **Leaf 5: The Incoherent Sophisticate**
  *   **Position:** You can intend without belief, reasons must align, but past intentions don't bind.
  *   **Most Awkward Commitment:** **Empty Cell.** This position is logically unstable: if reasons must align and the past doesn't bind, you have no reason to drink, so you believe you won't drink, which (on most views) collapses back into Q1-YES.

  **Leaf 6: The One-Off Resolute Chooser**
  *   **Position:** A single prior intention creates a reason to act later.
  *   **Most Awkward Commitment:** You must explain why rationality changes between midnight (when you intend) and afternoon (when you drink) without any new information arriving.

  **Leaf 7: The Iterated Resolute Chooser**
  *   **Position:** Only a policy built over the Serial variant creates a reason to act.
  *   **Most Awkward Commitment:** **Flagged Separation.** It is unclear why the logic of resolution works over a month but fails on the first night; this may not be genuinely separable from Leaf 6.

  **Leaf 8: The Structural Planning Agent**
  *   **Position:** Intending is planning; reasons are autonomous; pain is irrelevant to the intention state.
  *   **Most Awkward Commitment:** You must claim that intending to drink a painful toxin is no harder than intending to press a bland button, provided the reward is the same.

  **Leaf 9: The Aversion-Sensitive Planner (or Pure Voluntarist)**
  *   **Position:** (Two routes merge here). Either intending is an act of will, or planning is sensitive to aversion.
  *   **Most Awkward Commitment:** If Voluntarist: You claim intention is under direct voluntary control, which conflicts with the intuition that we intend based on reasons. If Planner: You struggle to explain why aversion matters if reasons are autonomous.

  **Leaf 10: The Unoccupied Cell**
  *   **Position:** Reasons are autonomous, intending is planning, but Bland is *Harder* than Toxin.
  *   **Most Awkward Commitment:** **Empty Cell.** Nobody defends this. It implies that removing the pain makes the intention *more* difficult, which is psychologically and rationally unmotivated.

  ---

  ### Variant Diagnostic Report (Constraint 3)

  *   **The Lockbox Variant:** **High Discriminatory Power.** It cleanly separates those who think the *act* is the problem (they pay) from those who think the *intention state* is the problem (they don't pay). It is the only way to salvage the "Belief Required" view without self-deception.
  *   **The Bland Button Variant:** **Moderate Discriminatory Power.** It separates views that locate the obstacle in *aversion* (Toxin is harder) from views that locate it in *structure* (Toxin and Bland are equally hard). However, almost everyone agrees Bland is easier, making it less useful for splitting advanced positions.
  *   **The Serial Variant:** **Low Discriminatory Power (Idle).** While intuitively appealing, few serious positions hold that the *logic* of resolute choice works only in the Serial case but not the Single case. It mostly functions as a psychological aid rather than a rational necessity. If a student insists Serial works and Single fails, press them on Leaf 7's awkward commitment.
