answer: |-
  This is a fascinating translation exercise. You are essentially asking for a mapping between *inverse theory in physical sciences* and *hermeneutics in social sciences*. The fit is tight in some places and tears in others.

  Here is the translation, the critique of your heuristics, the residue report, and the verdict on Duhem-Quine.

  ### 1. The Translation: Processualism vs. Post-Processualism

  **Side A: The Processualists (The "Yes, we can infer" camp)**
  *   **The Claim:** There exists a forward operator $G$ such that $d = G(m) + \epsilon$, where $d$ is the data vector (artifacts, features, ecofacts) and $m$ is the model parameter vector (social rules, beliefs, institutions).
  *   **The Forward Model:** They call this "Middle-Range Theory." It is the physics linking human behavior to material residue (e.g., "if a society has hierarchical inheritance, we expect differential grave goods"). They acknowledge $G$ is noisy (taphonomy) and potentially time-averaged (the "Pompeii Premise" debate is about the temporal support of the kernel in $G$).
  *   **Identifiability:** They argue that with sufficient data density and proper regularization (constraints based on ethnography or functional necessity), the null space is small enough. The resolution matrix $R$ has diagonal elements close to 1 for the parameters of interest.
  *   **The Posterior:** They believe the likelihood function $P(d|m)$ is sufficiently peaked that the posterior $P(m|d)$ is driven by data, not the prior.

  **Side B: The Post-Processualists (The "Meaning-Constituted" camp)**
  *   **The Claim:** The forward operator $G$ is not a physical law; it is itself a cultural construct. You cannot separate $m$ (belief) from the observer's framework used to construct $G$.
  *   **The Prior Complaint:** Their argument is indeed that "the posterior is the prior with extra steps," but it is stronger than simple ill-posedness. They argue the *parameterization* is invalid. "Belief" is not a scalar or vector field like permeability or density; it is a semantic category.
  *   **Non-Uniqueness:** They argue the problem is infinitely underdetermined not just because of noise, but because the mapping from meaning to matter is many-to-many and context-dependent. A "fancy object" ($d_i$) could map to "chief" ($m_1$), "ritual specialist" ($m_2$), or "trade good" ($m_3$) depending on a context variable you cannot measure.
  *   **The Likelihood:** They contend $P(d|m)$ is subjective. The "noise model" includes the archaeologist's own cultural biases. Therefore, the inversion converges on the archaeologist's prior, not the past reality.

  **Did I distort Side B?**
  Slightly, if you treat their objection as purely mathematical. It is also ontological. In geophysics, the subsurface exists independently of your inversion. Side B argues that "social structure" is not a static substrate waiting to be imaged; it was enacted and fluid. However, mathematically, their position reduces to: *The operator $G$ is singular and unknowable, and the data vector $d$ is theory-laden.* So your suspicion holds: they view the posterior as a reflection of the prior because the likelihood provides no independent constraint.

  ### 2. Critique of Your Heuristics

  **Heuristic 1: The Low-Pass Filter (Nyquist)**
  *   **Translation:** The deposition process acts as a temporal smoothing kernel. If the social phenomenon has frequency $f_{signal}$ and the deposit averages over time $T$, such that $f_{signal} > 1/(2T)$, the signal is aliased or attenuated beyond recovery.
  *   **Validity:** This is standard taphonomy. Archaeologists accept "time-averaging."
  *   **Where it fails:** You noted the risk: *what if the forward model is the uncertain bit?* In geophysics, you know the wave equation even if you don't know the velocity model. In archaeology, the "filter" properties (how fast a hut decays, how often a midden is turned over) are part of the social behavior you are trying to invert for. You cannot define the cutoff frequency without knowing the social parameters.
  *   **Verdict:** The argument is available, but it is circular. You need the model to define the filter, but you need the filter to resolve the model.

  **Heuristic 2: Two Independent Channels**
  *   **Translation:** Multi-physics inversion (e.g., joint inversion of seismic and magnetotelluric data). You require $d_1 = G_1(m)$ and $d_2 = G_2(m)$ to converge on the same $m$.
  *   **Validity:** In geophysics, this works because the physics of acoustics and electromagnetics are independent.
  *   **Where it fails:** Your worry is correct. In archaeology, "faunal remains" and "house floor areas" are not independent physics. They are both outputs of the *same* social system filtered through *the same* interpretive framework (e.g., "larger = higher status").
  *   **The Coupling:** The independence is broken because the *bridging arguments* ($G_1$ and $G_2$) share the same theoretical priors (e.g., functionalism). If the theory "status is displayed materially" is wrong, both channels fail simultaneously. The correlation is in the model space construction, not just the data noise.
  *   **Verdict:** This heuristic is weaker in archaeology than in geophysics. It guards against random noise, but not against systemic bias in the forward operator.

  ### 3. The Residue Report: What Didn't Survive Translation

  You guessed four points. Here is the assessment of whether they are "hard inverse problems" or "category errors."

  1.  **No independently known forward model.**
      *   *Status:* **Category Error.** In geophysics, Maxwell's equations or the Wave Equation are fixed. In archaeology, the map from behavior to deposit is a *social claim* (ethnoarchaeology).
      *   *Impact:* This turns the inverse problem into a *joint inversion for both model and operator*. Mathematically possible, but usually unstable without massive constraints. Here, the constraints are theoretical, not physical.

  2.  **The target isn't passive (Agency).**
      *   *Status:* **Real Content.** The "model parameters" (people) generated the "data" (objects) with intent to communicate or conceal. This is an *active source* problem where the source term is coupled to the medium properties.
      *   *Impact:* Standard inverse theory assumes $m$ is a property distribution. Here $m$ includes *rules for generating $d$*. This violates the linearity (and often stability) assumptions of standard inversion.

  3.  **Hypothesis space can't be written down.**
      *   *Status:* **Real Content.** In geophysics, you discretize the earth (voxels). In archaeology, the set of possible social structures is open-ended. You cannot define the null space if you cannot define the model space.
      *   *Impact:* Bayesian model selection is impossible because you cannot sum over the model space. You are selecting from a list of *plausible stories*, not a discretized parameter field.

  4.  **No core to calibrate against.**
      *   *Status:* **Real Content.** You cannot drill a "belief core."
      *   *Impact:* This prevents *supervised learning*. You have no ground truth to validate the forward model. You are stuck in an unsupervised learning regime with no way to check cluster validity against reality.

  **Summary:** These are not just "ordinary hard cases." They indicate that the mathematical structure of inverse theory (fixed operator, passive medium, defined parameter space) is mismatched to the ontology of social meaning.

  ### 4. The Bit You Actually Care About: Data vs. Prior Dominance

  **Is there an honest analogue?**
  Yes, but it is rarely run rigorously.
  *   **The Check:** Predictive modeling. If I infer "ritual center" from Site A, can I predict the location of Site B using the same $G$?
  *   **The Problem:** You can validate *location* (data-dominated), but you cannot validate *meaning* (prior-dominated). You can predict where a settlement is based on hydrology (physics). You cannot predict that a specific pot shape means "ancestor worship" without assuming the link first.
  *   **The Stall:** The debate stalls because Side A treats "meaning" as a parameter that can be resolved with more data (more excavations). Side B treats "meaning" as a prior that structures the data collection.
  *   **Vindication:** If the business is prior-dominated, it vindicates the Skeptics (Side B) *epistemologically*, but not *pragmatically*. Archaeologists must act as if $G$ is known to decide where to dig.
  *   **Young Field?** It is not just a young field with thin data. It is a field where the "signal" (belief) may not be encoded in the "medium" (matter) in a recoverable way. More data reduces variance, but not bias. If the forward model is biased (culturally specific), infinite data just gives you a precise wrong answer.

  ### 5. Duhem-Quine vs. Non-Uniqueness

  **The Distinction:**
  *   **Non-Uniqueness (Your vocabulary):** Given a fixed forward model $G$ and data $d$, there are multiple models $m$ that satisfy the error tolerance. The null space is non-zero.
  *   **Duhem-Quine (Their vocabulary):** You cannot test a hypothesis $H$ in isolation. You test $H$ bundled with auxiliary assumptions $A$ (the forward model, the context, the dating). If the prediction fails, you don't know if $H$ is false or $A$ is false.

  **The Verdict:**
  The archaeologists are dealing with **Duhem-Quine**, which is more severe than non-uniqueness.
  *   In **Non-Uniqueness**, you trust the physics ($G$) and admit the image is blurry. You can still say "the truth is somewhere in this suite of models."
  *   In **Duhem-Quine**, you cannot trust the physics ($G$) because the physics *is* the social theory. If the inversion fails, you can tweak the "belief" (model) or you can tweak the "bridging argument" (operator). There is no independent handle to turn.

  **Is the philosophy thinner than it sounds?**
  No. Your vocabulary misses the *holism* of the theory testing. In geophysics, if the inversion fails, you blame the noise or the parameterization. You don't blame Maxwell's equations. In archaeology, *everything* is up for grabs simultaneously.

  **Is your vocabulary missing something?**
  Yes. It lacks **Hermeneutics**. Inverse theory is about *estimation* (finding the value of $m$). Hermeneutics is about *interpretation* (assigning meaning to $m$).
  *   Geophysics: $m$ = Density. Meaning = "Rock." (Fixed).
  *   Archaeology: $m$ = "Pot Cluster." Meaning = "Ritual" vs. "Refuse." (Contested).

  The archaeological fight is not about whether we can solve $G^{-1}d$. It is about whether $G$ maps *matter* to *mind* at all. Your vocabulary assumes the map exists. Their fight is about the existence of the map.

  **Final Recommendation for the Reading Group:**
  Tell them you see the problem as a **joint inversion for model and operator with no ground truth and coupled error channels.** Ask them if "meaning" is a model parameter or a property of the operator. If it's a property of the operator, standard inverse theory cannot touch it. That should keep the conversation honest.
