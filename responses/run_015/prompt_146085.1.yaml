  ### Part 1: The Quiz

  | # | Case (One Sentence) | Option A | Option B | Option C | Axis This Question Separates |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | You disagree with yourself from last week, when you were exhausted and in a foul mood. | Treat past-self as an equal peer; split the difference in confidence. | Discount past-self significantly due to the known mood impairment. | Trust current self; the evidence hasn't changed, only the processing did. | Symmetry of Self (Temporal) |
  | 2 | You only find out about a disagreement because a journalist emails you; supporters never email. | Assume the silent majority agrees with the critics; reduce confidence. | Note the selection bias; adjust confidence slightly but don't capitulate. | Ignore the sample bias; focus only on the arguments presented in the email. | Sampling Bias vs. Peer Status |
  | 3 | You learn you were on medication that quietly scrambles your sense of confidence (not belief). | Suspend judgment entirely until you are off the medication. | Keep the belief but lower your confidence rating significantly. | Trust the belief; the calculation mechanism wasn't scrambled, only the feeling. | Higher-Order Evidence as Defeater |
  | 4 | A peer says your carefully double-checked long sum is wrong; you can't redo it. | Assume a 50/50 chance of error; suspend judgment on the result. | Factor in your past accuracy with sums versus theirs before deciding. | Trust your two checks; they likely missed something you didn't. | Mathematical Certainty vs. Testimony |
  | 5 | Six peers disagree with you, but you don't know if they talked to each other first. | Concede; six voices against one is overwhelming evidence. | Withhold judgment until their independence is verified. | Stand firm; numbers don't trump your direct access to the proof. | Independence vs. Headcount |
  | 6 | Your peer has a better track record on this, but you've studied this specific case more closely. | Defer to her; her general reliability outweighs your specific effort. | Weigh her record against your extra effort on this specific case. | Trust your extra effort; track record is irrelevant to this specific evidence. | Track Record vs. First-Order Effort |
  | 7 | Evidence is vague; you pick X, a peer picks Y, and neither of you seems careless. | Switch to Y or suspend; rationality requires resolving the tie. | Stick with X, but acknowledge Y is also a rational response to the evidence. | Stick with X confidently; your perspective makes X the clear choice. | Uniqueness vs. Permissivism |
  | 8 | You realize you formed a belief via a bias, but it still feels intuitively true. | Abandon the belief immediately because the source is tainted. | Keep the belief but mark it internally as "unjustified." | Assume the feeling of truth overrides the origin story. | Akrasia Tolerance |

  ***

  ### Part 2: Position Mapping

  | Answer Pattern | Position Name | One Sentence Commitment | Most Awkward Consequence |
  | :--- | :--- | :--- | :--- |
  | **A, A, A, A, A, A, A, A** | **Radical Conciliationism** | The fact of disagreement always trumps your first-order evidence. | You must suspend judgment on almost everything, including whether conciliationism is true. |
  | **C, C, C, C, C, C, C, C** | **Hard Steadfastness** | Your direct access to the evidence always trumps the fact of disagreement. | You are rationally required to ignore reliable data about your own unreliability. |
  | **B, B, B, B, B, B, B, B** | **Calibrationism** | Confidence should always track estimated reliability, not just evidence or peer status. | You may end up believing nothing with high confidence, even when right. |
  | **C, C, C, C, C, C, B, C** | **The Akratic Holdout** | I still believe *p*, and I also believe my belief that *p* was formed badly. | You are committed to holding beliefs you admit are irrational, creating internal tension. |
  | **C, B, C, C, B, B, B, C** | **Total Evidence View** | Disagreement is just more evidence; weigh it alongside everything else. | Hard to distinguish from Steadfastness in practice; often collapses into it. |
  | **A, B, A, A, A, B, B, A** | **Equal-Weight View** | Peer status mandates splitting the difference, unless specific reliability defeaters exist. | Requires a precise definition of "peer" that is hard to maintain in real cases. |
  | **C, C, C, C, C, C, B, B** | **Permissive Pluralism** | Standing pat and budging are both fine; rationality allows multiple responses. | Makes disagreement less troubling, but undermines the normativity of logic. |

