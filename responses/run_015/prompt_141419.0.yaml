prompt: |-
  I have come to philosophy late, after a working life spent on colonial marine invertebrates — siphonophores and their relations, where the question "is this one organism or many?" has a technical answer that settles nothing of interest — and I now sit, unpaid, on a small panel that advises our regional health board on which of the treatments it has been asked to fund it should actually pay for. The seminar I have been auditing on distributive ethics has convinced me that nearly every dispute in the room turns on one contested idea: that persons are separate, and that this separateness constrains what may be done to some for the sake of others. No one, however, will tell me what would settle the question of whether they have got the constraint right. So I would like the specification instead. Before I read another paper, tell me what an account of the moral significance of the separateness of persons would have to deliver in order to count as adequate — adequate, that is, for my purpose: a view that a committee such as mine could genuinely use to rank competing claims, under uncertainty, and without always knowing in advance which named individuals will end up benefiting.

  Give me the desiderata as a list, each with the case or consideration behind it, and be explicit about what a theory is supposed to explain rather than merely assert. In particular I want to know: what separateness is meant to consist in once one stops helping oneself to a metaphysically tidy boundary between one person and the next — my animals offer nested candidate units all the way up, and the fission and duplication cases I have met in the literature seem to me to press the same worry about what the things being counted actually are, and whether the ethical objection can survive a deflationary metaphysics of persons; what the theory must say about the very different case of one person bearing a great deal across a whole life and the case of many people each bearing a little; about compensation that arrives after the loss and lands on someone other than the person who suffered it; about choosing when the identities of those helped are unknown and only a distribution over them is known; about claims that arise only on condition that a particular person is brought into existence; and about collectives — hospitals, trade unions, families — that deliberate and act as one while their members each feel their own pains. I also want the distinctions the theory must respect and not quietly collapse: between counting as one and counting for much, between being permitted in prospect and being justified after the fact, between being answerable to someone and improving things for them, between refusing to aggregate and aggregating badly.

  Two things matter most to me. First, sort the requirements into the non-negotiable and the merely sectarian: which follow from the job the theory has to do for an institution like mine, and which are preferences of one camp dressed up as constraints — I suspect, for instance, that the demand that the view be fully impartial and the demand that it never weigh one person's loss against another's gain are not on the same footing, and I should like to be told if I am wrong. Second, tell me if some subset of the requirements cannot be jointly satisfied: if the list is itself the result, and a committee must then decide which demand to abandon, I want the argument for the incompatibility and not merely the assertion of it. I should also value your view on which single requirement does the most work in excluding candidates — my own guess is that it is whatever requirement forces a theory to answer the person who loses, but the seminar has not yet persuaded me either way. Finish, if you would, with a brief scorecard, no more than a paragraph each, for the aggregative consequentialist view, the prioritarian, the Nozickian side-constraint view, the Scanlonian contractualist one, the equal-chance view that declines to count numbers at all, and the ex ante expected-utility view associated with the impartial spectator behind a veil; I shall not hold you to the scoring, since it is the criteria I came for. Kindly write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Persona:** A former marine biologist (specializing in colonial invertebrates like siphonophores) now serving unpaid on a regional health board panel (resource allocation/priority setting). Latecomer to philosophy. Pragmatic but deeply concerned with metaphysical coherence.
      *   **Core Problem:** The panel needs to rank treatments under uncertainty without knowing specific beneficiaries. The prevailing ethical discourse hinges on the "separateness of persons," but no one defines what makes an account of this *adequate* for practical decision-making.
      *   **Task:** Provide a list of *desiderata* (requirements) for an adequate account of the moral significance of the separateness of persons, tailored for an institutional decision-making context.
      *   **Specific Content Requirements:**
          *   List format with cases/considerations behind each.
          *   Explicit about what the theory must *explain*, not assert.
          *   Address specific metaphysical/ethical worries: nested units (siphonophore analogy), fission/duplication, intra-personal vs. inter-personal distribution, compensation across persons, uncertainty/anonymous beneficiaries, non-identity problems, collective agents.
          *   Respect specific distinctions: counting as one vs. counting for much, prospect vs. ex post justification, answerability vs. improvement, refusing to aggregate vs. aggregating badly.
          *   **Crucial Constraint 1:** Sort requirements into *Non-Negotiable* (institutional necessity) vs. *Sectarian* (philosophical preference).
          *   **Crucial Constraint 2:** Identify incompatibilities (impossibility theorems/trilemmas) if they exist.
          *   **Crucial Constraint 3:** Identify the single most exclusionary requirement.
          *   **Crucial Constraint 4:** Brief scorecard (one paragraph each) for: Aggregative Consequentialism, Prioritarianism, Nozickian Side-Constraints, Scanlonian Contractualism, Equal-Chance (Numbers Skepticism), Ex Ante Expected-Utility (Harsanyi-style).
          *   **Language:** British English.
          *   **Tone:** Respectful, rigorous, acknowledging the user's scientific background (precision, metaphysical skepticism), avoiding unnecessary jargon where possible, but philosophically precise.

  2.  **Deconstruct the "Separateness of Persons" Problem:**

      *   The user is right: "Separateness of persons" is often a slogan (Rawls' critique of utilitarianism) rather than a worked-out metric.
      *   The user's biological background (siphonophores) highlights the metaphysical fuzziness of "individuality." If biological individuality is graded or nested, why is moral individuality binary?
      *   The institutional context (health board) adds constraints: public accountability, limited resources, ex ante uncertainty, need for action.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Metaphysical Robustness:* Must handle the "siphonophore worry." If persons are just bundles of experiences or temporal stages, does the constraint vanish?
      *   *Distributional Sensitivity:* Must distinguish one person losing a lot vs. many losing a little. (The classic utilitarian blind spot).
      *   *Compensation:* Must explain why compensating *someone else* doesn't cancel the loss.
      *   *Uncertainty:* Must work when we don't know *who* will benefit (ex ante vs. ex post).
      *   *Non-Identity:* Must handle claims of future people.
      *   *Collectives:* Must distinguish the group acting from the individuals suffering.
      *   *Distinctions:* Counting as one vs. weight; prospect vs. outcome; answerability vs. benefit.

  4.  **Sorting Non-Negotiable vs. Sectarian:**

      *   *Non-Negotiable:* Must be actionable, publicly justifiable, consistent under uncertainty, respect the basic unit of the patient (legal/moral personhood).
      *   *Sectarian:* Absolute prohibition on aggregation (libertarian), strict equality of outcome (egalitarian), specific metaphysical views on personal identity (Lockean vs. Psychological).

  5.  **Identifying Incompatibilities:**

      *   This is the hardest part. There are known impossibility results in social choice and population ethics.
      *   *The Trilemma:* You usually can't have (1) Respect for Separateness (no sacrifice of one for many), (2) Pareto Efficiency (make some better off without harming others), and (3) Consistency under Uncertainty/Aggregation for small stakes.
      *   *Specifically:* The conflict between *Ex Ante* fairness (equal chance) and *Ex Post* outcomes (maximizing health). If you respect separateness strictly, you might refuse to save two lives to save one if it violates the one's rights, but under uncertainty, you might choose the policy that saves more on average.
      *   *The "Answerability" vs. "Improvement" conflict:* If I must answer to the loser, I might not be able to improve the overall lot.

  6.  **Identifying the "Most Exclusionary" Requirement:**

      *   The user guesses it's "answering the person who loses." This is close to the *Complaint Model* (Scanlon/Parfit).
      *   Actually, the hardest constraint is usually *Non-Aggregation across Persons* combined with *Decision under Uncertainty*. If you can't aggregate, you can't calculate expected utility in the standard way.
      *   Let's refine: The requirement to *justify to each individual* (reciprocity) is the killer for standard cost-benefit analysis.

  7.  **Drafting the Scorecard:**

      *   *Consequentialism:* Fails separateness (sacrifices one for many).
      *   *Prioritarianism:* Aggregates but weights the worse off. Better, but still aggregates.
      *   *Nozick:* Too rigid for health boards (rights as side constraints block almost all redistribution).
      *   *Scanlon:* Good on justification, struggles with numbers and uncertainty.
      *   *Equal-Chance:* Ignores magnitude of benefit.
      *   *Ex Ante (Harsanyi):* Collapses into utilitarianism behind the veil, ignoring separateness ex post.

  8.  **Refining Tone and Language:**

      *   British English (prioritise, programme, centre, etc.).
      *   Acknowledge the siphonophore analogy (it's brilliant).
      *   Keep it structured but fluid.

  9.  **Self-Correction/Review during drafting:**

