      *   *Check:* Is the incompatibility section clear? *Action:* Focus on the tension between *Ex Ante* agreement and *Ex Post* distribution.
      *   *Check:* Is the scorecard brief? *Action:* Keep to one paragraph each.

  10. **Final Polish:** Ensure the distinction between institutional constraints and philosophical preferences is sharp. The user is on a *health board*, not writing a metaphysics thesis. The theory must *work*.

  **(Self-Correction on the "Incompatibility" point):** I need to be careful not to just say "it's hard." I need to point to a specific structural conflict. The conflict between *Individual Rationality* (what I'd choose behind a veil) and *Moral Separateness* (what I can demand as a right) is key. Also, the "Numbers Problem" in contractualism. I will highlight the tension between *Responsiveness to Numbers* and *Strict Separateness*.

  **(Self-Correction on "Non-Negotiable"):** A health board *must* allocate resources. A theory that says "do nothing because rights" is non-starters. So "Action-Guiding under Scarcity" is non-negotiable. "No Aggregation" might be sectarian.

  Let's assemble the response.

  *Structure:*
  1.  Introduction (acknowledging the siphonophore insight).
  2.  The Desiderata (categorized).
  3.  Non-Negotiable vs. Sectarian.
  4.  Incompatibilities (The Trilemma).
  5.  The Key Exclusionary Requirement.
  6.  Scorecard.

  *Drafting content...*
  *   *Metaphysics:* Must survive Parfit's reductionism.
  *   *Compensation:* Must explain why A's loss isn't cancelled by B's gain.
  *   *Uncertainty:* Must handle probabilistic identities.
  *   *Collectives:* Must not reify the hospital over the patient.
  *   *Distinctions:* Counting as one vs weight.

  *Incompatibility:* The "Fairness vs. Outcome" clash. If you respect separateness strictly, you can't maximize. If you maximize, you violate separateness. Under uncertainty, this becomes Ex Ante vs Ex Post.

  *Scorecard:* Be fair but critical.

  *Language:* British spelling (prioritise, programme, centre, defence, etc.).

  *Final check on user constraints:* "Tell me what an account... would have to deliver." "Give me the desiderata as a list." "Sort the requirements." "Tell me if some subset... cannot be jointly satisfied." "Which single requirement does the most work." "Finish... with a brief scorecard."

