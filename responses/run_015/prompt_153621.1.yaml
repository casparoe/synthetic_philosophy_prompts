      *   *Core Concept:* The "Afterlife Conjecture."
      *   *Definition of "Afterlife":* Not personal immortality, but the survival of humanity after our own deaths.
      *   *Core Claim:* Our confidence in the existence of future generations is a precondition for valuing many of our current activities. If we knew humanity would end soon after our deaths, many things we value would lose their value (not just make us sad).
      *   *Distinction:* It's not just about distress/sadness (psychological); it's about the *normative* status of our values (axiological). Extinction undermines the *reasons* we have for acting.
      *   *The "Collective Afterlife":* It requires *people*, not just things. It's about the human community continuing.
      *   *The Variant Case (Robots/Algorithms):* Scheffler emphasizes *human* successors. The value comes from future *people* valuing what we do. Mere preservation or algorithmic continuation without human consciousness/agency generally fails to satisfy the condition because the "human chain" is broken. The value is often tied to contributing to the *human* good or *human* knowledge.

