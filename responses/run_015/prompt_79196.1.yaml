answer: |-
  ### The Effective Altruism Critique Decision Tree

  **Root Question:** When you argue that Effective Altruism is flawed, is the core mistake that it misunderstands **what is valuable**, **what we owe**, or **what we can know**?

  *   **Branch 1: What We Can Know (Epistemic)**
      *   **Node:** Is the problem that our measurement tools are **inaccurate**, or that having tools **changes behavior**?
          *   **Leaf 1: The Metrics Are Flawed.** (We measure the wrong things.)
              *   *Hardest Commitment:* Accepting that vital goods like dignity or justice may remain permanently unquantified and thus excluded from analysis.
          *   **Leaf 2: The Metrics Drive Behavior.** (Only measurable things get funded.)
              *   *Hardest Commitment:* Refusing to fund high-impact projects simply because they lack clean data, even if people suffer as a result.

  *   **Branch 2: What We Owe (Practical/Obligation)**
      *   **Node:** Is the objection to the **method of earning** the money, or to the **organizations spending** it?
          *   **Path A: Method of Earning (Earning to Give)**
              *   **Node:** Is the concern that the earner is **avoiding personal risk**, or that their income **supports harmful systems**?
                  *   **Leaf 3: Labor Is Replaceable.** (You should do the work, not just fund it.)
                      *   *Hardest Commitment:* Personally undertaking high-risk direct action rather than funding safer, more scalable bets.
                  *   **Leaf 4: Money Funds Wrong Things.** (The causes chosen are wrong or harmful.)
                      *   *Hardest Commitment:* Rejecting effective interventions if they originate from ethically compromised economic sources.
          *   **Path B: Organizations Spending (Institutions)**
              *   **Leaf 5: The Institutional Critique.** (Professionalisation creates distance and bureaucracy.)
                  *   *Hardest Commitment:* Dismantling efficient charities to return power to communities, even if overall efficiency drops.

  *   **Branch 3: What Is Valuable (Political/Good)**
      *   **Node:** Does the harm come from **replacing state duty**, or from **controlling the agenda**?
          *   **Leaf 6: The Displacement Critique.** (Private giving displaces public provision.)
              *   *Hardest Commitment:* Withholding private aid to pressure the state, even if people suffer in the interim.
          *   **Leaf 7: The Agenda Control Critique.** (Funding structure quietly decides which questions get researched.)
              *   *Hardest Commitment:* Rejecting donor money even for urgent needs to prevent external agenda-setting.

  ***

  ### Analysis of the Tree

  **Inseparable Pair**
  **Leaf 5 (Institutional Critique)** and **Leaf 7 (Agenda Control)** are flagged as difficult to separate. The "professionalised institutions" criticized in Leaf 5 are the very mechanism by which the "funding structure" in Leaf 7 decides research questions. A critic who attacks the bureaucracy of the movement almost inevitably attacks its power to set the agenda, making these two positions frequently overlap in practice despite the logical distinction.

  **Unoccupied Combination**
  There is no occupied position that combines **"We cannot know what works" (Branch 1)** with **"We are obligated to maximize impact" (Branch 2)**.
  *   **Reason:** This view is **incoherent**. One cannot have a specific moral obligation to maximize an outcome if one simultaneously claims that the outcome is unknowable. Critics usually argue either that we *can* know but are measuring wrongly, or that we *cannot* know and therefore the obligation to maximize is void.

  **The Moot-Making Answer**
  If a participant answers **"Effectiveness is not a moral category"** at the Root, the rest of the tree becomes moot.
  *   **Reason:** This rejects the fundamental premise of Effective Altruism itself. If moral worth is determined by intention, virtue, or duty rather than consequences, then the entire project of sorting critiques based on *how* to be effective collapses, as the goal of "effectiveness" is no longer relevant to the moral discussion.
