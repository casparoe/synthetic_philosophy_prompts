answer: |-
  **Brainstorming Note: The Conceptual Knot**
  The genuinely hard conceptual knot lies in the *normative gap* between causal continuity and moral responsibility. Standard theories of desert require a subject that is numerically identical (or sufficiently continuous) to the agent who performed the prior act. Karma as *cosmic causation* easily survives *anātman* (no-self) because cause-and-effect requires only conditional arising, not a substantial self. However, karma as *moral desert* implies a normative claim: the suffering is *justified* because the sufferer *owns* the prior act. If the "self" is merely a conventional label over a stream of aggregates, the link between the past doer and present sufferer is causal, not necessarily moral. The knot is whether "psychological continuity" without "substantial identity" can bear the heavy normative weight of deserved suffering, or whether this combination collapses desert into mere consequentialist bookkeeping (balancing energy) or unjust scapegoating.

  ***

  ### 1. Essay Question

  **Course:** Philosophy of Religion (Upper-Level Seminar)
  **Time Allowed:** 90 Minutes
  **Total Marks:** 30

  **Prompt:**
  Critically evaluate the coherence of interpreting karma specifically as a theory of **moral desert** within a framework that accepts the Buddhist doctrine of no-self (*anātman*). Assume that moral desert requires that present suffering or flourishing is deserved in virtue of prior moral action, with the desert relation extending across embodied lives.

  In your analysis, you must address the following metaphysical tension: If there is no enduring substantial self that is numerically identical across lives, in what precise sense is the present sufferer the same moral agent who deserves the consequences of prior acts? Your response must distinguish this karmic model carefully from (i) Western single-life retributivism, which presupposes one continuous embodied life, and (ii) purely consequentialist moral bookkeeping that tracks outcomes without establishing a genuine desert relation. Conclude by assessing whether a reconstructed notion of conventional personal identity can bear the normative weight of responsibility required by moral desert.

  ***

  ### 2. Model Answer

  The interpretation of karma as a theory of moral desert faces a severe metaphysical challenge when coupled with the doctrine of *anātman* (no-self). Moral desert traditionally presupposes a subject of responsibility—an agent who persists sufficiently to own both the action and its subsequent consequences. In Western retributive frameworks, this is secured by the continuity of a single embodied life and often a substantive notion of the soul or psychological ego. However, the karmic framework extends consequences across distinct lifetimes while denying the existence of a permanent substantial self. This creates a tension between the metaphysics of identity and the ethics of responsibility.

  The primary difficulty is distinguishing moral desert from mere causal necessitation. If karma is merely cosmic bookkeeping, the connection between act and consequence is mechanistic, akin to touching fire and getting burned. In such a model, suffering is not *deserved* in a moral sense; it is simply the inevitable output of a prior input. For karma to function as desert, there must be a normative link, not just a causal one. The sufferer must be the *same* moral entity as the actor. Yet, under *anātman*, the "person" is a conventional designation over a stream of impermanent aggregates. There is no numerical identity between the person in life A and the person in life B, only causal continuity.

  This distinguishes the karmic model from Western single-life retributivism. In the Western model, bodily and psychological continuity within one lifespan provides a robust substrate for responsibility. Even if psychological continuity fades (e.g., amnesia), the bodily continuity often sustains the legal and moral claim of identity. In the karmic model, bodily continuity is broken by death and rebirth. Therefore, the burden falls entirely on psychological or causal continuity. If the present consciousness is merely a causal effect of past consciousness, like one candle lighting another, the justification for *desert* weakens. Punishing the second candle for the heat of the first appears unjust if they are not substantively the same entity.

  Consequently, the proponent of karmic desert must argue that causal-psychological continuity is sufficient for moral responsibility, even without substantial identity. They might posit that the "conventional self" is the only self required for ethics. However, this risks collapsing karma into consequentialist bookkeeping. If the "self" is a fiction, then "desert" becomes a useful narrative to encourage ethical behavior rather than a metaphysical truth about justice. The suffering is inflicted to balance the cosmic scale or purify the stream, not because the subject inherently merits it through identity with the past agent.

  Ultimately, moral desert requires conditions stronger than mere causal continuity. It requires a notion of ownership that *anātman* explicitly undermines. While a reconstructed conventional identity can explain how consequences transmit, it struggles to justify why those consequences are *just* rather than merely inevitable. Without a substantial self to anchor the desert relation, karma as moral desert risks becoming incoherent, reducing to a system of natural causation mislabeled as justice. Therefore, unless one can demonstrate that normative responsibility survives the dissolution of numerical identity, the combination of karma-as-desert and *anātman* remains metaphysically unstable.

  ***

  ### 3. Marking Scheme (30 Marks)

  **A-Range (26–30 Marks): Excellent to Outstanding**
  *   **Core Argument (10 marks):** Explicitly articulates the tension between *anātman* and moral desert. Identifies that desert requires a subject of responsibility ("ownership" of action) which *anātman* denies.
  *   **Metaphysical Analysis (8 marks):** Clearly distinguishes between *numerical identity* (substantial self) and *causal/psychological continuity*. Evaluates whether continuity is sufficient for desert (arguing it is likely insufficient for robust desert).
  *   **Required Distinctions (7 marks):**
      *   Successfully distinguishes karma from Western retributivism (noting the break in bodily continuity vs. single life).
      *   Successfully distinguishes karma from consequentialist bookkeeping (noting the difference between *justified suffering* vs. *mechanical outcome*).
  *   **Clarity and Structure (5 marks):** Argument is logically progressive, formally written, and stays within word limits.

  **B-Range (21–25 Marks): Good to Very Good**
  *   **Core Argument (7 marks):** Identifies the problem of no-self but may not fully explore the normative implications for "desert."
  *   **Metaphysical Analysis (6 marks):** Discusses continuity vs. identity but may treat them as synonymous or fail to press the "justice" vs. "causation" point hard enough.
  *   **Required Distinctions (5 marks):** Addresses Western retributivism or consequentialism but perhaps treats one superficially.
  *   **Clarity and Structure (5 marks):** Clear writing, but argument may lack the precision of the A-range.

  **C-Range and Below (20 Marks and below): Adequate to Fail**
  *   **Core Argument (0–5 marks):** Fails to address the *anātman* constraint or treats karma as compatible with a soul.
  *   **Metaphysical Analysis (0–5 marks):** Conflates karma with fate or generic causation without addressing the moral desert component.
  *   **Required Distinctions (0–5 marks):** Ignores the comparison with Western retributivism or consequentialism.
  *   **Clarity and Structure (0–5 marks):** Disorganized or informal.

  **Specific Deductions (Applied within categories):**
  *   **Treating karma as mere causation:** -5 marks (Fails the "desert" constraint).
  *   **Conflating desert with utility:** -5 marks (Fails to distinguish justice from outcome balancing).
  *   **Importing an unargued substantial soul:** -5 marks (Violates the *anātman* constraint).
  *   **Ignoring the cross-life identity problem:** -5 marks (Treats it like single-life responsibility).
