prompt: |-
  I chair the clinical ethics committee at a large teaching hospital trust. We meet fortnightly, consider three or four referrals a month — mostly from intensive care, paediatrics and oncology — and produce a one-page opinion that goes into the patient's record and is increasingly read by people who were not in the room. Almost every referral reaches us already labelled "an ethical dilemma", and the word has become useless: it covers everything from two clinicians disagreeing about a prognosis to cases where, as far as anyone can tell, someone is wronged whichever option is taken. I want a procedure, not an essay.

  What I am asking for is a decision procedure my committee can actually run: the questions, in a fixed order; what should count as a sufficient answer to each; where the procedure stops and returns a verdict of "not a dilemma"; where it escalates because the remaining question is one of values rather than of analysis. It has to be runnable in about an hour by people with no philosophical training, myself included, and written so that the output is defensible in a record.

  The distinctions I most need it to draw are these: an epistemic or informational difficulty masquerading as a conflict of values; a hard weighing of considerations that nonetheless has a correct answer; a clash between what someone ought to do and something merely admirable or self-sacrificing; a conflict manufactured by the institution's own rules, rotas or resource limits, which I would rather have routed back to management than resolved as though it were ethical; and, if anything is left over, a genuine dilemma in the strict sense — incompatible requirements, such that moral residue attaches to the agent whatever is done. Please include a step that re-describes the conflict at the level of the reasons rather than of the options, to check whether the opposition survives the re-description, and a step that asks whether an ideally informed and impartial deliberator, re-running the reasoning, would converge on one option. Someone suggested to me that the second of these is doing more philosophical work than it appears to; if so, say so plainly, and say what it presupposes. Mark clearly the points at which the procedure must hand the decision to a particular person — the chair, the treating consultant, the patient or family — because no further analysis settles it.

  Then run it on three referrals: one remaining intensive care bed and two patients with comparable claims on it; a sixteen-year-old refusing a blood transfusion on religious grounds with her parents and the clinical team in favour of treating and a live dispute about her capacity; and a family asking the team to withhold a cancer diagnosis from the patient. At least one of these should come out somewhere the committee will dislike — my colleagues treat the first as the paradigm dilemma, and I suspect the procedure will say something less comfortable than that.

  Two further constraints. Please ground the steps in what is actually argued about these cases rather than in common sense, but do not give me citations, a bibliography or a reading list: nothing I can follow up, and I would have no way of checking it. And separate what is settled from what is genuinely contested among people who work on this — I have the impression that whether "ought" implies "can" settles the matter against genuine dilemmas, and whether moral residue is evidence of real wrongdoing rather than of difficulty, are both live disputes, and I do not want a contested view presented to me as the consensus. Where the procedure is likely to misfire, say where and why. I would be grateful for British English throughout.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Chair of a clinical ethics committee (CEC) at a large teaching hospital trust (UK context implied by "trust", "fortnightly", "British English").
      *   **Problem:** The term "ethical dilemma" is overused and unhelpful. Referrals range from informational gaps to genuine moral conflicts. The current output (one-page opinion) is read by outsiders, so it needs defensibility.
      *   **Goal:** A runnable decision procedure (algorithm/flowchart style) for the committee.
      *   **Constraints:**
          *   Runnable in ~1 hour by non-philosophers.
          *   Fixed order of questions.
          *   Criteria for sufficient answers.
          *   Stop points ("not a dilemma").
          *   Escalation points (values vs. analysis).
          *   Hand-off points (who decides: Chair, Consultant, Patient, Management).
          *   Specific distinctions to draw: Epistemic vs. Value, Hard weighing vs. Correct answer, Obligation vs. Supererogation, Institutional/Resource vs. Ethical, Genuine Dilemma (incompatible requirements + moral residue).
          *   Specific steps required: Re-description of conflict (reasons vs. options), Ideal deliberator test (with caveats).
          *   Test Cases: ICU bed allocation (2 patients, 1 bed), 16yo refusing blood (capacity disputed), Family withholding diagnosis.
          *   Outcome requirement: At least one outcome must be uncomfortable/unexpected (specifically the ICU bed case).
          *   Tone/Style: British English, no citations/bibliography, distinguish settled vs. contested theory, acknowledge where the procedure might misfire.

  2.  **Deconstruct the Philosophy (Mental Check):**

      *   *Epistemic vs. Value:* Often conflicts arise because we don't know the prognosis. If we knew, the path might be clear.
      *   *Obligation vs. Supererogation:* Is it *required* to do X, or just *nice*?
      *   *Institutional/Resource:* Is this actually a budget/staffing issue disguised as ethics? (e.g., "We can't afford the drug" vs. "The drug is futile").
      *   *Genuine Dilemma:* Remainder/residue. Whatever you do, something wrong happens.
      *   *Ideal Deliberator:* This leans towards a form of ideal observer theory or reflective equilibrium. It presupposes convergence is possible. I need to flag this as contested.
      *   *Ought implies Can:* If the system prevents the action, is it an ethical failure or a system failure?
      *   *Hand-offs:* Ethics committees advise; they rarely decide. Clinicians decide (legal duty), Patients decide (capacity permitting), Management decides (resources).

  3.  **Drafting the Procedure (The "Algorithm"):**

      *   *Step 1: Triage (Is there actually a conflict?)* Check for factual disagreement.
      *   *Step 2: Authority Check (Who owns this?)* Resources -> Management. Clinical Judgment -> Consultant. Patient Choice -> Patient.
      *   *Step 3: Re-description.* Move from "Option A vs Option B" to "Reason X vs Reason Y". Do they actually conflict?
      *   *Step 4: The "Ought" Check.* Is one option merely admirable (supererogatory)?
      *   *Step 5: The Ideal Deliberator Test.* Would a fully informed, impartial agent see one option as mandatory? (Flag philosophical baggage here).
      *   *Step 6: Residue Check.* If we choose A, is there a lingering duty to B that remains unfulfilled? (Genuine Dilemma).

  4.  **Refining the Steps for the User's Constraints:**

      *   Need to be explicit about *sufficient answers*.
      *   Need to mark *hand-offs*.
      *   Need to address the *ICU bed* case specifically (User suspects the procedure will say it's *not* a dilemma, or a management one).
      *   Need to address the *16yo* case (Capacity is legal, not ethical, but ethics supports the process).
      *   Need to address the *Diagnosis* case (Cultural competence vs. Autonomy).

  5.  **Developing the Test Cases:**

      *   *ICU Bed:* Usually seen as a "tragic choice". The procedure should likely categorize this as a *Resource/Institutional* conflict, not a pure ethical dilemma between patients. The ethical duty is on the *system* to provide beds, not on the clinician to play God. This fits the "uncomfortable" requirement.
      *   *16yo Blood:* In the UK, 16-17s can consent but refusal can be overridden if life-saving (Family Law Reform Act / Mental Capacity Act nuances). If capacity is disputed, it's a legal/clinical assessment, not primarily an ethics debate. The ethics committee's role is to ensure the *process* of capacity assessment is robust.
      *   *Withholding Diagnosis:* Paternalism vs. Autonomy. Often cultural. If the patient *wants* to know, family can't veto. If patient *doesn't* want to know, family request aligns. If patient status unknown, the dilemma is about how to ask.

  6.  **Addressing the Philosophical Caveats:**

      *   *Ideal Deliberator:* This presupposes moral realism or at least convergent rationality. Moral pluralists disagree. I must state this.
      *   *Moral Residue:* Some argue residue proves a dilemma; others argue it's just psychological distress. I need to note this distinction.
      *   *Ought implies Can:* If the bed doesn't exist, you *can't* treat both. Is it unethical to fail? Or just unfortunate?

  7.  **Drafting the Content (Iterative refinement for tone and British English):**

      *   *Tone:* Professional, direct, procedural, slightly dry (committee style).
      *   *Language:* "Trust", "Consultant", "Clinician", "Programme", "Centre".
      *   *Structure:*
          1.  Introduction (Acknowledging the brief).
          2.  The Procedure (The 6 Steps).
          3.  Philosophical Footnotes (The "contested" bits).
          4.  Application to Cases.
          5.  Limitations/Misfire warnings.

  8.  **Self-Correction/Review during drafting:**

      *   *Critique:* Did I make the ICU case come out "uncomfortable"?
      *   *Fix:* Ensure the procedure routes resource scarcity to Management/Policy, not the bedside clinician's moral conscience. This absolves the clinician of the "dilemma" but indicts the Trust. Clinicians hate this; it fits the brief.
      *   *Critique:* Did I explain the "Ideal Deliberator" presuppositions?
      *   *Fix:* Add a specific box/text explaining it assumes convergence of reason, which is debated.
      *   *Critique:* Is the hand-off clear?
      *   *Fix:* Use bold text for **HAND-OFF**.
      *   *Critique:* British English?
      *   *Fix:* Check spellings (programme, centre, analyse, colour) and terminology (Trust, Consultant, GP).

  9.  **Final Polish:** Check against the "no citations" rule. Ensure the distinction between settled and contested is clear. Ensure the "re-description" step is prominent.

  *(Self-Correction on the 16-year-old case)*: In England/Wales, a 16-year-old is presumed to have capacity to consent, but refusal of life-saving treatment can be overridden by the Court or parents (depending on specific circumstances and Gillick competence nuances for under 16s, but 16-17s have statutory right to consent). However, if capacity is *disputed*, the ethics committee shouldn't decide capacity. They should decide *how to proceed while capacity is assessed*. I need to be careful not to give legal advice but ethical procedure. The procedure should flag "Legal/Statutory" as a stop.

  *(Self-Correction on the ICU case)*: The prompt says "two patients with comparable claims". If claims are truly comparable, clinical criteria fail. If it's purely scarcity, it's a macro-allocation issue. The procedure should identify this as an institutional failure, not a bedside dilemma.

  *(Self-Correction on the Diagnosis case)*: This is often a communication issue. The procedure should push for "Ask the patient what they want to know."

  10. **Final Review against constraints:**
      *   Runnable in an hour? Yes, it's a checklist.
      *   Defensible record? Yes, it documents *why* it's not a dilemma.
      *   British English? Yes.
      *   No citations? Yes.
      *   Contested views marked? Yes.

  Let's write it.cw
answer: |-
  **To:** Clinical Ethics Committee Members
  **From:** The Chair
  **Subject:** Proposed Decision Procedure for Referral Triage and Analysis

  ### Introduction

  The following procedure is designed to replace the open-ended discussion we currently employ. Its purpose is not to generate moral insight from scratch, but to categorise the nature of the conflict presented. It distinguishes between problems that are factual, legal, institutional, or merely difficult, and those that are genuine ethical dilemmas.

  It is to be run at the start of each case discussion. The outcome determines whether we offer a recommendation, defer to another authority, or record a "genuine dilemma" with attendant moral residue.

  **Time allocation:** 45–60 minutes per case.
  **Output:** A structured minute entry corresponding to the Step at which the procedure terminates.

  ---

  ### The Procedure

  #### Step 1: The Epistemic Check (Fact vs. Value)
  **Question:** Is the disagreement driven by uncertainty about prognosis, diagnosis, or the likely outcome of an intervention?
  **Sufficient Answer:**
  *   **Yes:** The case is **not an ethical dilemma**. It is an informational deficit.
  *   **No:** Proceed to Step 2.
  **Action:** If 'Yes', the Committee recommends a specific clinical review, second opinion, or time-limited trial of therapy to resolve the uncertainty. The file is closed pending new data.
  **Hand-off:** Treating Consultant (to order tests/reviews).

  #### Step 2: The Institutional Check (System vs. Conscience)
  **Question:** Is the conflict caused by a lack of resources (beds, staff, drugs), rota gaps, or administrative policy that prevents the clinically indicated or ethically preferred option?
  **Sufficient Answer:**
  *   **Yes:** The case is **not an ethical dilemma**. It is an institutional failure or resource allocation issue.
  *   **No:** Proceed to Step 3.
  **Action:** If 'Yes', the Committee records that the moral distress arises from system constraints, not conflicting duties between agents. The recommendation is to escalate the barrier to Trust Management. The clinician is not morally culpable for the system's inability to provide.
  **Hand-off:** Trust Management / Clinical Directors.
  **Note:** This step often produces discomfort. It reclassifies "tragic choices" as management failures.

  #### Step 3: The Authority Check (Who Decides?)
  **Question:** Is there a clear legal or professional duty-holder whose authority resolves the conflict? (e.g., A patient with capacity refusing treatment; a statutory safeguarding requirement; a clear professional guideline).
  **Sufficient Answer:**
  *   **Yes:** The case is **not an ethical dilemma**. It is a matter of compliance or rights.
  *   **No:** Proceed to Step 4.
  **Action:** If 'Yes', the Committee confirms the authority holder's role. We do not weigh the decision, only the process by which it is reached.
  **Hand-off:** Patient (if capacitous), Court (if disputed capacity/life-sustaining), or Regulator.

  #### Step 4: Re-description of the Conflict (Reasons vs. Options)
  **Question:** Can the conflict be re-stated not as "Option A vs. Option B", but as "Reason X vs. Reason Y"? Do these reasons logically exclude one another, or can they be partially satisfied?
  **Sufficient Answer:**
  *   **Partial Satisfaction Possible:** The case is a **negotiation**, not a dilemma.
  *   **Total Exclusion:** Proceed to Step 5.
  **Action:** Write down the competing reasons (e.g., "Respect for Autonomy" vs. "Prevention of Harm"). If a compromise exists (e.g., treat now, review later), adopt it.
  **Hand-off:** Treating Team (to negotiate compromise).

  #### Step 5: The Ideal Deliberator Test (Weighing)
  **Question:** If an ideally informed, impartial, and rational deliberator considered these reasons without personal stake or emotional fatigue, would they converge on one option as *mandatory* rather than *permissible*?
  **Sufficient Answer:**
  *   **Yes (One option is mandatory):** The case is a **hard decision**, not a dilemma. The other option is wrong, even if understandable.
  *   **No (Both remain permissible):** Proceed to Step 6.
  **Action:** If 'Yes', the Committee recommends the mandatory option.
  **Philosophical Caveat:** This step presupposes that moral reasons are objective enough to allow convergence. Some committee members may hold that reasonable people can disagree on fundamental values. If this objection is raised, note it in the minutes, but proceed to Step 6 for safety.
  **Hand-off:** Treating Consultant (to enact the mandatory option).

  #### Step 6: The Residue Check (Genuine Dilemma)
  **Question:** If we choose the recommended option, is there a remaining duty to the unchosen option that is not cancelled out, such that the agent is entitled to feel regret or guilt (moral residue)?
  **Sufficient Answer:**
  *   **Yes:** This is a **Genuine Ethical Dilemma**.
  *   **No:** One option was simply wrong (return to Step 5).
  **Action:** The Committee records that incompatible requirements exist. We do not recommend one option over the other as morally superior. We recommend that whichever option is chosen, the team must acknowledge the moral cost (e.g., through debriefing, apology, or memorialisation).
  **Hand-off:** Treating Consultant (to choose, with support) + Committee (to document residue).

  ---

  ### Philosophical Footnotes (For the Record)

  **1. The Ideal Deliberator (Step 5)**
  *   **Settled:** In practical ethics, we often act *as if* a correct answer exists to avoid paralysis.
  *   **Contested:** This test presupposes a form of moral realism or convergent rationality. It assumes that if we knew all the facts and removed bias, we would agree. Moral pluralists argue that some values are incommensurable (e.g., sanctity of life vs. quality of life) and no amount of reasoning makes one superior.
  *   **Risk:** The procedure may misfire here by labelling a pluralistic conflict as a "hard decision" with a correct answer, when it is actually a clash of worldviews.

  **2. Moral Residue (Step 6)**
  *   **Settled:** Agents often feel distress after difficult choices.
  *   **Contested:** Does this distress prove a dilemma existed (the "remainder" view), or does it merely prove the decision was difficult (the "psychological" view)? Some argue that if you choose the "right" thing, you have done no wrong, and guilt is irrational. This procedure adopts the "remainder" view: that wrongdoing can occur even when doing the best one can.
  *   **Risk:** We may validate inappropriate guilt in clinicians who made the correct decision.

  **3. 'Ought' Implies 'Can' (Step 2)**
  *   **Settled:** You cannot have a duty to do the impossible.
  *   **Contested:** Does the impossibility remove the ethical dimension entirely, or does it shift the blame? This procedure shifts the blame to Management. Some argue the clinician retains a duty to advocate, making it an ethical duty to fight the system.
  *   **Risk:** Clinicians may feel absolved of advocacy duties if we classify resource issues as "management problems".

  ---

  ### Application to Current Referrals

  #### Case 1: ICU Bed Allocation (One bed, two patients, comparable claims)
  *   **Step 1 (Epistemic):** Prognoses are comparable. No factual uncertainty. -> *Pass.*
  *   **Step 2 (Institutional):** The conflict exists *only* because there is one bed. If there were two beds, there would be no conflict. The constraint is resource scarcity. -> **STOP.**
  *   **Verdict:** Not an ethical dilemma. This is an institutional failure.
  *   **Hand-off:** Trust Management / Critical Care Lead.
  *   **Committee Opinion:** "The moral distress here is generated by resource scarcity, not conflicting ethical duties between patients. The decision of which patient receives the bed is a triage decision based on clinical utility, but the existence of the choice is a management failure. The Committee recommends the bed allocation follows existing triage policy, but records that the Trust bears the moral responsibility for the lack of capacity."
  *   **Comment:** This will be uncomfortable. Colleagues view this as the paradigm dilemma. The procedure argues it is a management scandal disguised as ethics. It protects the bedside clinician from moral residue but indicts the Trust.

  #### Case 2: 16-Year-Old Refusing Blood (Capacity Disputed)
  *   **Step 1 (Epistemic):** Dispute is about capacity, not prognosis. -> *Pass.*
  *   **Step 2 (Institutional):** Not a resource issue. -> *Pass.*
  *   **Step 3 (Authority):** In this jurisdiction, a 16-year-old can consent, but refusal of life-sustaining treatment can be overridden by the Court or those with parental responsibility if the young person lacks capacity or if the refusal leads to death. The dispute is *about* capacity. Capacity is a legal/clinical threshold, not an ethical weighing. -> **STOP.**
  *   **Verdict:** Not an ethical dilemma. It is a legal/clinical assessment.
  *   **Hand-off:** Treating Consultant (to assess capacity formally) / Court of Protection (if time permits and dispute persists).
  *   **Committee Opinion:** "The core question is legal capacity, not ethical permissibility. Ethics cannot resolve a capacity dispute. The Committee recommends a formal capacity assessment under the relevant statutory framework. If capacity is present, the refusal stands (subject to legal override provisions for minors). If absent, treatment proceeds in best interests. The Committee should not be asked to adjudicate capacity."
  *   **Comment:** This prevents the Committee from acting as a pseudo-court.

  #### Case 3: Family Withholding Cancer Diagnosis
  *   **Step 1 (Epistemic):** Diagnosis is known. -> *Pass.*
  *   **Step 2 (Institutional):** Not a resource issue. -> *Pass.*
  *   **Step 3 (Authority):** Patient autonomy is the primary authority. Does the patient want to know? -> *Pass (Assume unknown).*
  *   **Step 4 (Re-description):** Conflict is "Family's desire to protect" vs. "Patient's right to know". Can these be partially satisfied? Yes, by asking the patient how much they wish to know. -> **STOP.**
  *   **Verdict:** Not a dilemma. It is a communication failure.
  *   **Hand-off:** Treating Team.
  *   **Committee Opinion:** "The conflict dissolves if the patient's preference for information is established. The team must ask the patient: 'How much information would you like about your condition?' If the patient delegates this to the family, the family's wish stands. If the patient wants to know, the family's wish is overridden. The dilemma is manufactured by not asking the question."
  *   **Comment:** This highlights that many "cultural" dilemmas are actually failures of communication protocols.

  ---

  ### Limitations and Misfire Points

  1.  **The ICU Case (Step 2):** The procedure assumes that resource allocation is a management duty, not a clinical ethical one. In reality, clinicians *do* make these choices at the bedside. By routing this to Management, we risk leaving the clinician without support in the moment. The procedure is theoretically sound but practically difficult if Management does not respond within the clinical timeframe.
  2.  **The Capacity Case (Step 3):** Capacity is not purely binary. There are "grey zones" of fluctuating capacity. The procedure treats it as a stop-point, but in practice, the Committee is often asked to advise on the *threshold* of capacity. We must resist this, or we become a legal body.
  3.  **Moral Residue (Step 6):** If we declare a "Genuine Dilemma", we risk implying that the clinical team is excused from the consequences of their choice. Moral residue is for the agent to process; it should not be used to shield the team from accountability for the outcome.

  ### Implementation

  I propose we adopt this procedure for the next three months. We will audit whether the "Hand-offs" are accepted by the relevant parties (Management, Consultants, Legal). If Management refuses to accept the ICU allocation referrals, we must revert to Step 6 for those cases, acknowledging the system failure but supporting the clinician in the dilemma.

  Please review before the fortnightly meeting.
