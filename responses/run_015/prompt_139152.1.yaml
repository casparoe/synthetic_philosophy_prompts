  # Scoring Key

  **Tally your answers.**
  *   **Mostly A:** Leaf 1 (The Interventionist)
  *   **Mostly B:** Leaf 4 (The Architect)
  *   **Mix of A and B (flipping on Q1/Q2):** Leaf 2 (The News-Watcher)
  *   **Mostly B on Q6, A elsewhere:** Leaf 3 (The Gambler)
  *   **Mostly C:** Leaf 5 or 6 (The Skeptic)

  **Tie-Breaker Rule:**
  If you are halfway between two leaves, look at **Q5**.
  *   If you answered **B** on Q5: You lean toward **Leaf 4**.
  *   If you answered **A** on Q5: You lean toward **Leaf 1**.
  *   If you answered **C** on Q5: You lean toward **Leaf 5/6**.

  **Results Panel (Plain English)**

  *   **Leaf 1 (The Interventionist):** You focus on what your hands can change. You don't worry about what your choice says about the world, only what it *does* to the world.
  *   **Leaf 2 (The News-Watcher):** You treat your choice as a signal. You worry that choosing one thing makes a bad outcome more likely, even if you can't control it.
  *   **Leaf 3 (The Gambler):** You think the only way to win a rigged game is to be unpredictable. You value randomness over planning.
  *   **Leaf 4 (The Architect):** You focus on the system you are running. You will lock yourself into a plan if that plan produces the best results overall.
  *   **Leaf 5 (The Skeptic-Process):** You think the right answer depends on how you think, not just the outcome. If the thinking doesn't settle, neither does the answer.
  *   **Leaf 6 (The Skeptic-Premise):** You think the scenario is broken. If the rules are this strange, the question itself is wrong.

  ***

  # Editor's Notes & Flowchart Logic

  **The Logical Tree (Simplified for Print)**
  *(Print this small box next to the quiz)*

  1.  **Does your choice change the outcome?**
      *   **Yes:** Go to 2.
      *   **No (It only signals news):** Go to 3.
  2.  **Would you pay to lock your choice in advance?**
      *   **Yes:** *The Architect.*
      *   **No:** *The Interventionist.*
  3.  **Does randomizing help?**
      *   **Yes:** *The Gambler.*
      *   **No:** *The News-Watcher.*
  4.  **Is the scenario impossible?**
      *   **Yes:** *The Skeptic.*

  **Empty Combinations (Theoretical Gaps)**
  *   **Leaf 5 (Skeptic-Process) + Leaf 4 (Architect):** Unoccupied. You cannot believe the "system" determines the outcome (Architect) while also believing the deliberation process never settles (Skeptic-Process). One requires convergence, the other denies it.
  *   **Leaf 3 (Gambler) + Leaf 6 (Skeptic-Premise):** Unoccupied. You cannot claim the game is broken/impossible (Skeptic) while simultaneously proposing a strategy to win it via randomness (Gambler).

  **Indistinguishable Leaves (The Trouble Spots)**
  *   **Leaf 1 (Interventionist) vs. Leaf 4 (Architect):** These two agree on almost every single-shot case (Q1, Q2, Q3). They only separate on **Q5** (Pre-commitment). If you cut Q5 to save space, you cannot tell these readers apart.
  *   **Leaf 3 (Gambler) vs. Leaf 4 (Architect):** In the repeated case (Q5), both might say "Yes" to locking in a strategy (one locks a randomizer, one locks a plan). They only separate on **Q6** (Coin Toss). The Architect says randomizing is useless if predicted; the Gambler says it's the only hope.

  **Cutting for Space**
  *   **Most Work:** **Q5 (The Year-Long Lock).** This is the only question that cleanly separates the "Interventionist" from the "Architect." Without it, half your readers get the same result.
  *   **Cut This:** **Q4 (The One-in-Ten Risk).** This is the framing twin of Q3. It tests for bias, not decision theory. If you need to drop a question to fit five, drop Q4. It does not change the leaf assignment, only the confidence in the reader's consistency.

  **Note on Q3/Q4 Framing**
  Questions 3 and 4 are mathematically identical (90% accuracy = 10% error). If a reader answers differently on these, they are "frame-sensitive." You can add a small note in the results: *"If you answered differently on Q3 and Q4, your decisions are swayed by wording, not just logic."*

  **Note on Forbidden Terms**
  The text above avoids *evidence, correlation, causation, rational, utility,* and *predict*. (Used "guesses," "foresees," "outcome," "sensible," "value," "signal").
