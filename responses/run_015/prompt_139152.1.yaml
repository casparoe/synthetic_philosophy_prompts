prompt: |-
  I'm a journalist — I cover science and ideas for a general-interest magazine — and I'm doing a feature on why decision theory is suddenly a live subject again (short version: people building AI systems keep running into these old puzzles, and nobody agrees on what a rational agent is even supposed to do in them). I want a sidebar for the piece: a which-decision-theory-are-you-actually-running-on quiz for readers, plus a small flowchart I can print next to it. Readers are smart but have no philosophy background, and I want the whole thing to take under two minutes.

  What I need from you:

  Eight questions, each a tiny concrete scenario with two or three answer options. No question may use the words evidence, correlation, causation, rational, utility, or predict-as-such, and no answer option may carry a theory name — a reader should be able to answer without knowing that there is a debate. The cases I want used (rework the details freely, but keep the structural point of each):

  1. The baseline: you're in Damascus, Death is a very reliable predictor of where you'll be, fleeing costs you a small amount (a train fare, say), and the payoffs are set up so that staying is better if Death goes to Aleppo and fleeing is better if Death comes to Damascus.
  2. The same case with the small cost turned into a small bonus, so that whichever option the don't-treat-your-own-choice-as-news answer picks flips. I like the hook that the entire answer turns on the train fare, so please build that in explicitly.
  3. A version where the predictor is only 90% accurate rather than near-perfect, to see whose answer moves continuously and whose flips.
  4. A version where, the night before, you can pay a modest fee to have your choice locked in for you: would you pay?
  5. The same scenario every week for a year, Death predicting each week fresh.
  6. A version where Death reliably predicts your coin as well, so arranging to randomise buys you nothing.
  7. A version where you get a message telling you where Death is, but only after you've already committed — and then a bookie offers you a bet on where Death is. Same odds you'd have taken before you left, or not?
  8. A control with no predictor at all: same numbers, but Death's location is just settled by a coin toss nobody foresaw. I want this one to catch the readers who are answering on vibes or who are extremely survival-motivated, so I can throw out inconsistent answer sheets.

  I'd also like one pair of questions that are the same case reframed (say the 90% one described once as right nine times in ten and once as a ten percent chance of escape) so I can see how many readers are just frame-sensitive.

  Six leaves, and I want the tree built from the logical space first — the questions and the answer combinations they allow — and only then the real positions located in it. The leaves:

  - Your own choice isn't news about anything; what matters is what would happen if you did each thing.
  - Your own choice is news, and in this kind of case that means there is no stable answer.
  - Your own choice is news, so arrange to be the sort of thing that isn't predictable — dice if you can.
  - What matters is which procedure you're running, and you should pick the one that does best everywhere it gets evaluated, including inside other people's models of you.
  - Nothing about acts settles it; rationality belongs to the process of deliberation or to what you'd settle into, and here it doesn't converge.
  - The case is broken: a predictor like that with these payoffs either can't exist, or leaves the probabilities or the values undefined, or you're asking the wrong question.

  For the combinations nobody occupies, tell me which ones they are and give me one line on why — incoherent, unattractive, or just unexplored. And flag openly any two leaves your eight questions can't actually pull apart; I'd rather print a note saying so than pretend the quiz is sharper than it is. Two I suspect are trouble: the interventionist and the procedure leaf will agree on most of my cases, and the dice leaf and the procedure leaf both say dice in the repeated version — so if you need to invent a ninth case to split a pair, say what it is and I'll find room.

  Also: a scoring key that gives a rough distribution across the six leaves rather than one winner, with weights and a rule for what I tell someone who lands halfway between two; a one-line plain-English blurb per leaf for the results panel, with no jargon and nothing that reads like a horoscope; and a note on which question is doing the most work and which I should cut if print only gives me five.

  Don't give me a literature review or any citations — I'll handle the attributions myself, and I don't want names of papers in the sidebar anyway.
