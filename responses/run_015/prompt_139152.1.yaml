answer: |-
  # Sidebar: Which Decision Theory Are You Running?

  **Instructions:** Read the eight scenarios below. For each, pick the option that feels most like what you would actually do. Don't overthink it; go with your gut. Tally your answers (A, B, or C) and check the key at the bottom.

  **Q1. The Costly Escape**
  You are in Damascus. A hunter wants to find you. The hunter is very good at guessing where you will go; if they guess your location, they find you. If they find you, the day is ruined. If you stay in Damascus, you save $20 on travel. If you flee to Aleppo, you spend $20.
  *   **A.** Stay in Damascus. (The travel cost is real; the hunter's guess is already made.)
  *   **B.** Flee to Aleppo. (Better to be safe and spend the money than be found.)
  *   **C.** It depends on how I feel in the moment.

  **Q2. The Bonus Escape**
  Same setup as Q1. The hunter guesses your location. If they find you, the day is ruined. However, if you flee to Aleppo, a friend pays you $20 for the trip. If you stay, you pay nothing.
  *   **A.** Stay in Damascus. (The money doesn't change the fact that the hunter's guess is already made.)
  *   **B.** Flee to Aleppo. (Now I get paid to be safe.)
  *   **C.** It depends on how I feel in the moment.

  **Q3. The Nine-in-Ten Chance**
  The hunter is right 90% of the time. If you go where they guess, you are found. If you go elsewhere, you are safe.
  *   **A.** Go where I want, ignoring the odds. (My choice doesn't change their guess.)
  *   **B.** Try to go where they won't guess. (I need to beat the odds.)
  *   **C.** The setup feels unfair; I can't answer.

  **Q4. The One-in-Ten Risk**
  The hunter is wrong 10% of the time. If you go where they guess, you are found. If you go elsewhere, you are safe.
  *   **A.** Go where I want, ignoring the odds. (My choice doesn't change their guess.)
  *   **B.** Try to go where they won't guess. (I need to beat the odds.)
  *   **C.** The setup feels unfair; I can't answer.

  **Q5. The Year-Long Lock**
  You face this hunter every week for a year. Before the year starts, you can pay a fee to have a machine choose your location for you every week. The hunter knows the machine's settings.
  *   **A.** No. (I should keep my freedom to choose each week.)
  *   **B.** Yes. (Locking my choice in advance gets better results.)
  *   **C.** Only if the fee is very small.

  **Q6. The Coin Toss**
  The hunter is perfect. They even know if you plan to flip a coin to decide. If you flip a coin, they predict the result and find you.
  *   **A.** Flip the coin anyway. (It's my only chance.)
  *   **B.** Don't flip. (It buys me nothing if they know the result.)
  *   **C.** Leave the country. (This game is rigged.)

  **Q7. The Late Message**
  You commit to a location. The hunter commits to a location. Then, before you travel, a messenger tells you where the hunter went. A bookie offers you a bet on whether you will meet them, at the same odds you would have taken earlier.
  *   **A.** Take the bet. (I have new information.)
  *   **B.** Decline the bet. (My commitment shouldn't change based on news I can't act on.)
  *   **C.** Ask for different odds.

  **Q8. The Blind Toss**
  No hunter. Your location is settled by a coin toss nobody foresaw. If the coin matches a target, you lose.
  *   **A.** Pick a side. (I have to choose something.)
  *   **B.** Refuse to play. (It's pure luck.)
  *   **C.** Pick the side that feels lucky.

