answer: |-
  Start by withholding the names of the three views entirely because labeling them too early gives your audience hooks to hang their existing misconceptions on before you have reshaped the underlying intuition. Open with their prior that freedom is a count of available options and treat it as a coherent system rather than a mistake to be corrected. Ask them to model a scenario where the option count is high but the stability of those options is zero. Use your bike example here but strip out the housemate element for the first pass and focus purely on the physical access. If the door is unlocked and open you have the option to leave. If the door is locked but you have the key you have the option to leave. If the door is locked and someone else holds the key you still have the option to leave conditional on their consent. Ask them to write the function for freedom based on this. They will likely return option_count multiplied by probability_of_access. This is the trap. You need them to voice the probability collapse objection themselves because you cannot refute a argument they haven't made yet. Once someone suggests that republican liberty is just negative liberty weighted by the likelihood of interference you introduce the benevolent master case. This is where you bring in the housemate who has the key and has never refused you and never will. The probability of interference is zero. The option count is effectively unchanged. Under their model freedom is maximal. Under the republican view freedom is minimal because the structure of the relationship allows interference even if it never occurs. Do not name this republican liberty yet. Call it security of status versus security of options. You need them to feel the discomfort of calling the benevolent slave free before you give them the vocabulary to resolve it.

  Keep the bike half of your example but bin the city hall gate half as it stands because mentioning state actors will trigger the positive liberty weasel word alarm prematurely and derail the negative versus republican distinction into a political debate. Replace the city hall gate with a private API lock managed by a corporation where the terms of service allow them to revoke access at any time without cause but they never do. This keeps the domination structure identical without invoking the state. The awkward fact that you want the gate to stop you some mornings is valuable but it belongs to the third act. If you introduce it now it conflates internal constraints with external domination. Hold that piece in reserve until you have firmly separated negative and republican liberty. The carrying example needs zero actual interference to work because if interference occurs negative liberty is violated anyway and you lose the contrast. The example must not involve the state because your audience equates state with coercion and you need them to see coercion in private relationships too. So the plan is bike first for negative versus republican then the API gate for the same distinction but in a systemic context then pivot to the wanting to be stopped intuition to launch positive liberty.

  When you introduce positive liberty do not frame it as the state making you do things. Frame it as the capacity to act on your own higher-order preferences. This is where you use the awkward fact about wanting the gate to stop you. Ask them if they are freer when the gate opens regardless of their desire or when the gate enforces their own prior commitment to avoid pollution. This captures the positive liberty intuition without invoking paternalism immediately. Name the views only after you have established the intuitions. Negative liberty is freedom from interference. Republican liberty is freedom from domination. Positive liberty is freedom to self-govern. The order matters because negative liberty is their baseline. Republican liberty modifies the source of the constraint from actual interference to arbitrary power. Positive liberty modifies the source of the constraint from external to internal. If you start with positive liberty they will reject it as moralizing. If you start with republican liberty they will reject it as probabilistic negative liberty. You must walk the ladder rung by rung.

  Defuse the misconceptions at specific choke points. The freedom is option count misconception dies in the first five minutes when you show that unstable options are not real options. The republican is negative plus probability misconception dies immediately after the benevolent master case when you emphasize that status matters independently of outcome. The positive liberty is a weasel word misconception dies when you frame it as internal coherence rather than external coercion. You must say out loud that positive liberty is often abused to justify coercion but that the core concept is about agency not obedience. If you do not concede the abuse they will assume you are advocating for it.

  End on a case where the verdicts diverge sharply so they can see the utility of having three tools instead of one. Use a Ulysses pact or a smart contract pre-commitment where you lock your own assets to prevent future spending. Negative liberty says you are less free because you have reduced your option set. Positive liberty says you are more free because you are enforcing your rational will against your impulses. Republican liberty says you are free because no other agent holds arbitrary power over you. Ask the room which verdict matches their intuition of freedom. The wrong-but-telling answer sounds like maximizing utility regardless of status. If someone says he is free because he got what he wanted you point out that he achieved his goal by destroying his capacity to choose otherwise. This highlights the split between outcome and agency.

  Refuse to get into free will because it collapses the distinction into metaphysics rather than political structure. Refuse to get into the Cold War context because it turns the definitions into ideological weapons rather than analytical tools. Refuse to get into what the American founders meant because it invites historical pedantry that ignores the conceptual utility. Say this explicitly at the start or whenever the first tangent arises. Tell them you are analyzing the architecture of the concept not the history of the word. This keeps the engineers in the room focused on the system design rather than the provenance.

  Your timing should be ten minutes on negative liberty and the option count model. Fifteen minutes on republican liberty and the benevolent master case. Ten minutes on positive liberty and the internal constraint case. Ten minutes on the ending question and discussion. This leaves buffer for the Moloch comment which will happen. When someone tries to fit Moloch in acknowledge it as a coordination problem that creates domination without a dominator and pivot back to whether that counts as unfreedom under the republican view. This validates their framework without letting it consume the talk. The goal is not to convince them one view is true but to show them that each view captures a different failure mode in the system of human interaction. Negative captures interference. Republican captures dependency. Positive captures incapacity. If they leave thinking freedom is a multidimensional vector rather than a scalar count you have succeeded. Do not try to resolve the tension between the views. The tension is the point. If you try to synthesize them you will lose the precision that makes them useful. Let the contradiction stand and ask them which dimension matters most in their own codebases when they design permissions systems. This maps the political philosophy back to their daily work and grounds the abstraction in concrete access control lists.
