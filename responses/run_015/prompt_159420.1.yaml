      *   **Where it holds (150 words):**
          *   Subjectivity of experience: Just as broccoli tastes bitter to some and not others, harm feels wrong to liberals, authority violations might not.
          *   Innate basis: Both taste and moral foundations have evolutionary/genetic components.
          *   Cultural modulation: Cuisine shapes how receptors are used; culture shapes how foundations are prioritized.
          *   The "blindness" stipulation fits well: If a group lacks a receptor, they literally cannot perceive that dimension, explaining disagreement without malice.
          *   The "supertaster" stipulation fits the intensity of intuition.
          *   It explains the *phenomenology* of disagreement effectively.

      *   **Where it breaks (250 words):**
          *   Taste is private; morality is public/prescriptive. Taste says "I like this"; morality says "You shouldn't do that."
          *   Truth-aptitude: Taste claims aren't true/false (de gustibus); moral claims claim objective wrongness.
          *   The Psychologist's argument (6 > 2) fails because more receptors don't guarantee truth (e.g., hallucinations).
          *   The Philosopher's argument (toleration) fails because we don't tolerate "taste" when it involves harm (e.g., poisoning).
