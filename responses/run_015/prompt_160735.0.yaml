      *   *Risk:* Does "interface" sound too technical/cybernetic? Maybe, but "machinery of forms" clarifies it.
      *   *Verdict:* It does real work. It bridges the gap between psychological explanations and sociological ones without losing the moral agent.

  5.  **Address Question 3: Hostile Reader Objections (Evasion):**
      *   *Thought:* What's the biggest risk? That this lets the individual off the hook. If the *interface* is the problem, the *agent* is just a component.
      *   *The "Compassion Drift":* The user already identified this.
