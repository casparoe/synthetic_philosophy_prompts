  Signing below indicates acceptance of these baseline facts.

  **Real Disagreements**

  | Issue | Brother's Take (Nuclear Model) | User's Take (Printing Press Model) | Note |
  | :--- | :--- | :--- | :--- |
  | **Core Metaphor** | AI is like nuclear weapons; one mistake ends the game. | AI is like steam engines; it changes how everyone works and lives. | Different risk types. |
  | **Access Control** | Only a few licensed labs should build powerful models. | Everyone should have access; innovation comes from distribution. | Semantic mixup on "Safety." |
  | **Regulatory Mechanism** | Permits required before development starts. | Liability and rules applied after deployment. | Process vs. Outcome. |
  | **Primary Harm** | Existential catastrophe (global loss of control). | Socioeconomic collapse (jobs, trust, inequality). | Timescale difference. |
  | **Timeline** | Immediate crisis requiring urgent lockdowns. | Generational shift requiring long-term adaptation. | Urgency mismatch. |

  **What Would Move Us**

  To move forward, we need to test our predictions against reality rather than arguing metaphors. Here are three concrete cruxes where evidence could shift our views. We must agree on what would change our minds before the events happen.

  First, the Leakage Test. If major open-source models leak globally despite strict compute lockdowns, Brother admits centralized control is impossible and shifts focus to mitigation. User admits that unrestricted access makes misuse harder to track than expected. We watch the cousin's video tool: if it spreads without limits, lockdowns are dead. Brother predicts permits will stop leaks; User predicts code will escape anyway. If code escapes, Brother accepts distributed liability laws.

  Second, the Labor Shock Test. If AI causes unemployment to spike over 5% in two years, User admits the economic disruption is catastrophic, not just transitional. Brother admits the immediate harm is economic ruin, not just existential risk. We track local job postings versus automation announcements. User predicts slow adaptation; Brother predicts sudden displacement. If jobs vanish fast, User accepts temporary deployment pauses.

  Third, the Infrastructure Stress Test. If the power company's AI causes a major regional outage, Brother says this proves centralized automation is too risky for critical grids. User says this proves we need better integration standards, not less technology. We monitor the town council's next quarterly report on grid stability. Brother predicts fragility; User predicts efficiency. If the grid fails, User accepts stricter permits for infrastructure AI.

  Agreeing on these outcomes beforehand prevents moving the goalposts. If Brother's lockdowns fail to stop leaks, he accepts distributed regulation. If User's adoption causes mass job loss without safety nets, he accepts stricter caps. We commit to updating our views based on these specific metrics rather than winning the argument. This turns abstract fear into measurable risk.
