      Your friend is right about money. Luck determines talent, so huge pay gaps aren't morally "owed." But you're right that meritocracy isn't about owing money; it's about owing recognition. When we praise achievement, we aren't paying a debt; we are acknowledging reality. Your friend says praise is just status, another reward subject to luck. But this reduces all human interaction to transaction. Praise validates agency. Even if my genius is lucky, my effort to use it is mine. A society that refuses to distinguish achievement treats human action as meaningless. We need meritocracy not to enrich the lucky, but to honor the act of striving. If we abolish meritocratic recognition, we don't fix luck; we just erase the map of human excellence.

