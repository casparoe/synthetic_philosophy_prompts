      Your friend's luck objection is devastating against *reward-desert*. If talent is a genetic lottery, no one is morally owed millions simply for exercising it. Material inequality based purely on luck is hard to defend as justice. However, your intuition is correct: this conflates compensation with recognition. Meritocracy's deeper justification lies in *praise-desert*.

