  1.  **Analyze the Request:**
      *   **Topic:** Defending meritocratic pay systems against the "luck objection" (genetic/environmental lottery).
      *   **User's Position:** Distinguish between "desert as reward" (owed goods) and "desert as praise" (recognition of achievement). Meritocracy is justified by the latter, not the former. Luck undermines reward-desert but not praise-desert.
      *   **Task:** Argue for the user's position.
      *   **Counter-argument to Address:** The friend's strongest reply: Praise is just a cheap substitute for reward; it's a status good, thus vulnerable to the same luck objection.
      *   **Constraint:** Maximum 450 words.

  2.  **Deconstruct the Argument:**
      *   *Premise 1:* Luck undermines claims to unequal material rewards (reward-desert).
      *   *Premise 2:* Luck does not undermine the value of recognizing achievement (praise-desert).
      *   *Conclusion:* Meritocracy is justified as a system of recognition, not necessarily as a system of owing material wealth.
      *   *Rebuttal to Friend:* Praise isn't just "status currency"; it's constitutive of meaning. Even if status is a good, the *act* of recognizing effort/talent validates human agency, which luck doesn't erase.

  3.  **Drafting - Section by Section:**

      *   *Introduction:* Acknowledge the friend's point on luck and reward. Validate the distinction between reward-desert and praise-desert.
      *   *Core Argument:* Meritocracy's true value is signaling what we value as a society. It affirms agency.
