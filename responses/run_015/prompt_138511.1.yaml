answer: |-
  ### The Decision Procedure for Standing Orders

  *Print this section on a single card for the Chair.*

  **1. Identify the Target.** Which Order(s) does the motion touch?
  *   *If 1, 2, 3, or 4:* Proceed to Q2.
  *   *If 5 or higher:* Proceed to Q3.

  **2. Check the Current Threshold.** What majority does the *existing* text require for this Order?
  *   *If Simple Majority:* Proceed to Q3.
  *   *If Two-Thirds + Two Meetings:* The motion is **Out of Order** unless that threshold is met *now*. (You cannot use a simple majority to lower a super-majority requirement).

  **3. Check Self-Reference (Adoption).** Does the motion change the voting rule *for itself*?
  *   *Yes:* **Out of Order.** The rules *before* the amendment govern the adoption of the amendment.
  *   *No:* Proceed to Q4.

  **4. Check Commencement.** Does the motion claim to take effect *before* the close of this meeting?
  *   *Yes:* **Out of Order.** Order 3 governs until amended at a *subsequent* meeting.
  *   *No:* Proceed to Q5.

  **5. Check Systemic Viability.** Does the motion repeal Orders 1 and 2 without replacement?
  *   *Yes:* **Out of Order.** The Society cannot vote to abolish its own capacity to function as a corporate body.
  *   *No:* **In Order.** (Subject to standard debate rules).

  **Reasoning Statement:** "The motion is [In/Out] of Order because [the existing rules governing adoption/commencement/systemic continuity] take precedence over the proposed changes."

  ***

  ### Philosophical Distinctions: What to Keep and What to Drop

  Your rough cut (Adoption, Content, Commencement) is serviceable but requires sharpening to block Nomic-style gaming.

  **Keep: Adoption Conditions vs. Commencement Date.**
  This is the vital distinction. *Adoption* is governed by the rules existing *at the moment of voting*. *Commencement* is governed by the rules existing *at the moment of effect*. A motion cannot alter the conditions of its own adoption (temporal precedence), but it can alter the commencement of future motions. This blocks the "self-commencing" paradox.

  **Drop: "Content" as a distinct category.**
  Distinguish instead between **Constitutive Rules** (the engine: SO 1–4) and **Regulative Rules** (the gameplay: subscriptions, dates). Philosophical accounts of self-amendment (e.g. Hart, Kelsen) insist that a system cannot validate its own destruction. Therefore, "Content" matters only insofar as it threatens the Constitutive Framework. A motion to change subscriptions is mere content; a motion to remove the amending power is constitutive suicide.

  **Why:** The "Content" category is where members hide self-referential traps. By collapsing "Content" into "Constitutive vs. Regulative," you force the question: *Does this break the engine?* If yes, the engine's current safety mechanisms (SO2) apply.

  ***

  ### Application to Specific Cases

  **1. Motion to delete '2' from the list in Order 2.**
  *   **Procedure:** Q1 (Targets SO2) → Q2 (Existing text requires 2/3 + 2 meetings) → Motion is at one meeting.
  *   **Ruling:** **Out of Order.**
  *   **Reason:** "Order 2 protects itself; you cannot use a simple majority to amend the list of entrenched Orders."
  *   **Logic:** The list in SO2 defines the scope of SO2. To change the scope, you must follow the scope.

  **2. Motion to amend Order 3 and change the voting threshold for a ballot later in the same meeting (Self-commencing).**
  *   **Procedure:** Q1 (Targets SO3) → Q2 (SO3 is entrenched) → Q4 (Claims immediate effect).
  *   **Ruling:** **Partially Out of Order.** The amendment to the text of SO3 is In Order (if passed twice); the clause claiming immediate effect is void. The threshold change for the later ballot is void.
  *   **Reason:** "Order 3 governs this meeting until it closes; an amendment to Order 3 cannot take effect during the meeting that adopts it."
  *   **Logic:** Temporal precedence. The old SO3 validates the vote; the new SO3 cannot retroactively validate the vote that created it.

  **3. Motion to repeal Orders 1 and 2 outright.**
  *   **Procedure:** Q1 (Targets SO1, 2) → Q2 (Entrenched) → Q5 (Destroys amending power).
  *   **Ruling:** **Out of Order.**
  *   **Reason:** "The Society cannot vote to abolish the constitutional framework that gives the vote its validity."
  *   **Logic:** Implied limitation on sovereignty. A corporate body must retain the capacity to act; total repeal renders the Society a static entity, incompatible with its constitution.

  ***

  ### Reflection on Your Past Rulings (Entrenchment at Birth)

  You ruled that a motion to add a new Order (e.g., Order 9) with a rider that it may only be amended by a three-quarters majority is **Out of Order**, on the ground that one majority cannot bind its successors.

  **You were wrong.**

  A simple majority *can* create an entrenched rule, provided the *creation* itself complies with the current simple majority rule (SO1). The constraint binds the *future* amendment, not the *present* adoption. This is standard constitutional practice: a legislature can pass a law that requires a super-majority to repeal, provided the initial passage was valid. To rule otherwise is to assume that all laws must have identical amendment thresholds, which SO1 does not state.
  *Correction:* Allow the creation of entrenched new Orders via simple majority, provided the *creation* motion itself passes by simple majority. The entrenchment applies only to *subsequent* attempts to change Order 9.

  ***

  ### Limitations of the Procedure

  **Where it will misfire:**
  1.  **Simultaneous Inconsistent Motions:** If two valid motions pass that contradict each other (e.g., "Subscription £10" and "Subscription £20"), the procedure has no priority rule. It yields a decision (both In Order) but not a resolution.
  2.  **Council Appeal:** The procedure stops at the Convener's ruling. If Council overturns you, the Procedure offers no recourse. It is a tool for the Chair, not a court of appeal.
  3.  **Convincing the Room:** The procedure supplies *authority*, not *persuasion*. A member determined to argue that "SO2 does not protect SO2" will not be convinced by logic, only by your gavel. The Procedure justifies your use of the gavel; it does not replace it.

  **Where it supplies decision without justification:**
  The "Systemic Viability" check (Q5). Declaring a motion to repeal all amending power "Out of Order" relies on an unwritten principle of constitutional continuity. The text does not explicitly forbid suicide. You are importing a norm external to the text to save the text.

  ***

  ### Missing Rules and Insertion Strategy

  The Orders lack three critical mechanisms to prevent Nomic gaming:
  1.  **Temporal Priority:** An amendment is judged by the rules existing *before* it takes effect.
  2.  **Conflict Priority:** If two amendments pass at one meeting, the latter prevails (or the more specific).
  3.  **Residual Clause:** Where the Orders are silent, the Convener rules based on the intended function of the Society.

  **What to Insert:**
  Add a new **Order 7**: *"An amendment takes effect under the rules existing prior to its adoption. Where amendments conflict, the latter in time prevails. Where these Orders are silent, the Convener shall rule to preserve the Society's capacity to function."*

  **How to Insert It (The Paradox of Insertion):**
  You cannot simply propose Order 7 under SO1, because Order 7 clarifies the operation of SO1–4 (making it arguably entrenched) and alters the Convener's power (SO4).
  *   **Strategy:** Propose Order 7 under **Order 2** (Two-thirds, two meetings).
  *   **Why:** This acknowledges that the fix touches the constitutive framework.
  *   **Solving the Self-Reference:** The motion to adopt Order 7 is judged by the *current* SO2. Once adopted, Order 7 governs *future* amendments. It does not need to validate its own adoption; the old SO2 does that. This breaks the circularity. The new rule applies prospectively, validating the system for the next cycle without claiming to validate the current one.

  **Instruction:** Draft the motion to add Order 7. Submit it for the next General Meeting. Note that it requires a two-thirds majority at *two successive* meetings. Do not attempt to rush it via a "self-commencing" clause, or you will trigger the very paradox you seek to resolve.
