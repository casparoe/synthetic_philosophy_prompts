  **Q3. Case: Voluntary Fault. Smoker vs. Genetic Lung Disease. Equalize?**
  *   **Yes (Ignore Responsibility)** → **Leaf 1: Strict Welfare Egalitarianism.** Awkward: Subsidizes self-harm.
  *   **No (Sensitive to Responsibility)** → **Leaf 2: Luck Egalitarianism (Welfare).** Awkward: Abandons the reckless poor.
  *   *[Unseparated: Prioritarianism often matches "No" here but differs on Q1.]*

  **Q4. Case: Disability. Equalize budget or function?**
  *   **Budget (Resources)** → Go to Q7 (Timing).
  *   **Function (Capabilities/Recovery)** → Go to Q5.

  **Q5. Custom Case: Recovery. Same health/budget, different support networks. Fund the isolated?**
  *   **No (Ignore Recovery Speed)** → Go to Q8 (Adaptive).
  *   **Yes (Equalize Recovery)** → **Leaf 3: Recoverability View.** Nearest: Capability Approach. Case: Two people have same capability set, but different shock-absorption speeds. Awkward: Risks penalizing resilient communities.

  **Q6. Proxy Value? (Case: Humiliation without poverty.)**
  *   **Status/Non-Domination** → **Leaf 4: Relational Egalitarianism.** Awkward: Permits large material gaps if status holds.
  *   **Sufficiency** → **Leaf 5: Sufficientarianism.** Awkward: Indifferent to gaps above the threshold.
  *   **Priority to Worst-Off** → **Leaf 6: Prioritarianism.** Awkward: May reduce total welfare to help worst-off slightly.

  **Q7. Timing (Fundamental views only). Rob young to help old?**
  *   **Yes (Time-Slice)** → **Leaf 7: Unnamed.** Why: Incoherent; ignores life-course planning.
  *   **No (Whole Life)** → **Leaf 8: Standard Resource Egalitarianism.** Awkward: Ignores conversion costs.

  **Q8. Case: Adaptive Preferences. Deprived person endorses low functioning.**
  *   **Respect Endorsement** → **Leaf 9: Unnamed.** Why: Unattractive; validates oppression.
  *   **Correct Preference** → **Leaf 10: Objective Capability Approach.** Awkward: Paternalistic.

  **Q9. Case: Foreseeable vs. Voluntary. Bad choice made under duress.**
  *   **Treat as Voluntary** → **Leaf 11: Hard Luck Egalitarianism.** Awkward: Ignores structural coercion.
  *   **Treat as Misfortune** → **Leaf 12: Soft Luck Egalitarianism.** Awkward: Blurs agency lines.

  **Q10. Case: Public Health Allocation. Cure many mild vs. one severe.**
  *   **Maximize Total** → **Leaf: Utilitarianism (Non-Egalitarian).**
  *   **Prioritize Severe** → **Leaf: Prioritarianism.**

  **Scoring Note**
  *   Track answers. If you land on "Unnamed," check consistency. Unoccupied regions usually imply incoherence (e.g., demanding equality but ignoring timing) or unattractiveness (e.g., punishing resilience).
  *   Recoverability View sits adjacent to Capability; separate only if you fund based on recovery speed despite identical current functionings.
  *   If answers land in unoccupied region: Check if you are conflating "equality of outcome" with "equality of opportunity."

  **Contested Placements & Failure Points**
  *   **Contested:** Luck Egalitarianism placement. Some luck egalitarians accept welfare currency (Leaf 2), others resources. Tree forces a split.
  *   **Failure Point:** The Responsibility distinction (Q3/Q9). In practice, "voluntary" is hard to verify, collapsing Luck Egalitarianism into Strict Egalitarianism administratively.
  *   **Failure Point:** Recoverability vs. Capability. If security is a capability, the view collapses.

  **Redraw Conditions**
  *   Redraw if: A participant answers "Yes" to Fundamental Equality but "No" to Responsibility sensitivity yet rejects Welfare currency. This suggests a hybrid view (e.g., Capability Egalitarianism without luck sensitivity) not fully captured.
  *   Redraw if: The Recoverability View is argued to be a subset of Capabilities, merging Q5.
  *   Redraw if: Relational Egalitarians claim equality is fundamental, not proxy (moves Leaf 4 to Q1-Yes branch).
