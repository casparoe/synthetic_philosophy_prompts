answer: |-
  It is a pleasure to engage with a colleague who understands that boundary conditions often matter more than the differential equations. Your background in plasma physics gives you a distinct advantage here: you know that asking "why did the discharge quench?" is a different question depending on whether the foil is "why did it sustain?" or "why did it quench at $t_1$ rather than $t_2$?"

  Your hunch about the **Shared-Aim Assumption** is not daft. In fact, it cuts to the bone of the problem with counterfactual history. In experimental terms, you are identifying a selection bias in the setup of the control group. If the control group (the foil $Q$) was never subjected to the same driving potential, comparing the output ($P$) tells you more about the input than the system dynamics.

  Here is the disciplined mapping you requested, treating the historical record as your fixed dataset.

  ---

  ### 1. Mapping the Difference-Makers

  #### Case A: $P$ = US Landing (1969), $Q$ = USSR Landing (1969)
  *The Classic "Race" Framing*

  **Candidate Difference-Makers:**
  1.  **Decision Latency:** US formal commitment (May 1961) vs. Soviet formal commitment (Aug 1964).
  2.  **Organizational Topology:** NASA (single agency, civil-military bridge) vs. OKB System (rival design bureaus, Korolev vs. Glushko, no central "NASA" equivalent until late).
  3.  **Resource Density:** Apollo peak budget (~4.4% of US federal) vs. Soviet Space Program (estimated <1.5% of GDP, competing with heavy ICBM priorities).
  4.  **Hardware Architecture:** Saturn V (conservative staging, tested components) vs. N1 (aggressive 30-engine first stage, insufficient ground testing).

  **Confidence & Stakes:**
  *   **High Confidence (Would stake money):** **Decision Latency** and **Organizational Topology**. The 3-year head start in formal programmatic focus is the dominant eigenvalue here. As you know from device operations, if you delay the gas puff relative to the heating pulse, you don't get the plasma. The Soviets were trying to light the fuse after the rocket had left the pad.
  *   **Medium Confidence:** **Resource Density**. The US economy was larger, but the Soviet economy was capable of massive concentration (see: WWII). The difference was *priority*, not just capacity. However, by 1965, the Soviet economy was stagnating relative to US tech growth. I'd bet on this being a necessary but not sufficient condition.
  *   **Low Confidence:** **Hardware Architecture**. The N1 failure is often cited as the "cause," but from an engineering standpoint, the N1 failures were symptoms of the rushed schedule (caused by Decision Latency) and lack of test infrastructure (caused by Organizational fragmentation). If Korolev lives and gets the 1961 start, the N1 likely succeeds.

  #### Case B: $P$ = US Landing (1969), $Q$ = US Landing (1979/81)
  *The Temporal Framing*

  **Candidate Difference-Makers:**
  1.  **Geopolitical Shock:** Gagarin (1961) + Bay of Pigs (1961) created a crisis atmosphere. By 1969-1979, Détente is in effect; the urgency evaporates.
  2.  **Budgetary Window:** The 1960s US economic expansion allowed discretionary spending. The 1970s brought stagflation, Vietnam costs, and domestic social spending pressure.
  3.  **Technological Momentum:** The Mercury/Gemini pipeline was "hot" in 1961. By 1969, the Saturn production line was closing. Restarting in 1971 for a 1979 landing would have required re-mobilizing a dissolved industrial base.

  **Survival of Difference-Makers from Case A:**
  *   **Organizational Topology:** Survives. NASA would still have been the vehicle.
  *   **Decision Latency:** Transforms into **Political Will**. The "difference" is no longer between nations, but between political epochs.
  *   **Resource Density:** Becomes the primary constraint. In 1961, money was no object for prestige. In 1971, cost-benefit analysis kills the program (as happened with the post-Apollo cuts).

  #### Case C: $P$ = US Landing (1969), $Q$ = Nobody Landing (Ever)
  *The Existential Framing*

  **Candidate Difference-Makers:**
  1.  **Bipolar Prestige Economy:** In a multipolar or unipolar world, the ROI on a manned landing is negative. In a bipolar zero-sum game, the ROI is infinite (propaganda value).
  2.  **Military Ambiguity:** The ambiguity of lunar military utility (high ground vs. useless terrain) allowed civilian agencies to piggyback on defense budgets. If the military utility had been proven null earlier, funding vanishes.
  3.  **Technological Optimism:** The 1960s belief in "technological fixes" (vs. 1970s environmental/limits to growth mindset).

  **Survival of Difference-Makers:**
  *   **Resource Density:** Irrelevant. If $Q$ is "Nobody," then even the US economy wasn't enough without the *motivation*.
  *   **Organizational Topology:** Irrelevant. Without the Geopolitical Shock (Case B), NASA doesn't get the mandate.
  *   **Key Insight:** The only robust difference-maker here is the **Bipolar Prestige Economy**. Remove the Cold War, remove the landing.

  ---

  ### 2. The Aggregation Test

  Can we add these three answers into one story: *"America landed in 1969 because of X, Y, Z"*?

  **Verdict: Aggregation Fails.**

  The causes are not additive; they are **conditional**.
  *   The "US vs. USSR" causes (Org Structure, N1 reliability) are only relevant *because* the "1969 vs. 1979" causes (Political Will) were active.
  *   The "1969 vs. 1979" causes are only relevant *because* the "Somebody vs. Nobody" causes (Cold War Prestige) were active.

  If you treat them as a merged list, you commit a category error. You are mixing *enabling conditions* (Cold War existence) with *triggering conditions* (Kennedy's speech) and *mechanism conditions* (Saturn V vs. N1).

  In physics terms: Case C sets the boundary conditions (the tokamak exists). Case B sets the initial values (the plasma is fueled). Case A describes the transport coefficients (why this confinement mode and not that one). You cannot sum boundary conditions and transport coefficients to explain the discharge.

  **Interesting Failure Mode:** The aggregation hides the fragility of the event. A merged story suggests inevitability ("The US had the money and the tech"). The separated contrasts reveal that if you change the time ($Q=1979$) or the opponent ($Q=$ Nobody), the "US Advantages" (money/tech) cease to be difference-makers. The victory was path-dependent on a specific 1961-1969 window.

  ---

  ### 3. The Shared-Aim Assumption & Machinery Breakdown

  Your hunch is correct. The contrastive machinery breaks when the foil ($Q$) is not a valid counterfactual state of the same system.

  **The Breakdown in "Why US not USSR?":**
  For the first half of the race (1961-1964), the Shared-Aim Assumption is **false**. The Soviet Politburo had not authorized a manned landing program. They were aiming for "space firsts" (first woman, first walk, first station), not "Moon first."
  *   **Consequence:** Asking "Why US and not USSR in 1969?" implicitly assumes a race existed in 1961. It didn't. It became a race in 1964.
  *   **The Collapse:** The explanation collapses from *performance* ("We ran faster") to *intent* ("We started running").
  *   **Philosophical Implication:** If the answer to "Why P rather than Q?" is "Because Q wasn't trying," the contrastive question is malformed. It asks for a causal mechanism within a competition that did not yet exist.

  **Does this validate your Needham Parallel?**
  **Yes, but with a gradient.**
  *   **Moon Race:** The USSR *did* eventually aim for $P$ (the N1 program). The Shared-Aim assumption is violated temporally (late start), but not categorically. The question is *partially* well-posed.
  *   **Great Divergence (Needham):** "Why Europe and not China?" This assumes China was *in the running* for industrialization and lost.
      *   If you believe (as many economic historians do) that Qing China had the capital, markets, and tech but lacked *institutions* (property rights, fragmented sovereignty), the Shared-Aim holds. China was "trying" to maximize wealth, just via a different local optimum.
      *   If you believe (as some cultural historians do) that the Confucian state actively *suppressed* the kind of disruptive innovation required for industrialization, then the Shared-Aim fails. China wasn't trying to be Britain; it was trying to be China (stable).
      *   **Where the Parallel Holds:** In both cases, the "Why not Q?" question smuggles in a teleology. It assumes $P$ (Industrialization/Moon Landing) was the universal goal. If $Q$ had different goals, the "failure" of $Q$ is an artifact of the historian's framing, not the historical actor's reality.
      *   **Where it Breaks:** The Soviets *did* try to land men. The Qing *did not* try to industrialize in the British sense. The Moon Race is a "failed race"; the Great Divergence might be a "category error."

  **Confidence:** I would stake money on the claim that the "Why not USSR?" question is historically productive only if qualified as "Why not USSR *given that they entered the race late*?" Without that qualification, it attributes Soviet structural flaws to a period where they simply had no program.

  ---

  ### 4. Trust in Contrastive Explanation

  Does this case leave me trusting the tool more or less?

  **Less as a truth-generator, More as a diagnostic.**

  *   **Where it is Silent:** Contrastive explanation is silent on *constitutive* questions. It cannot tell you what a "Moon Landing" *meant* to the actors, only what distinguished it from the foil. It strips away the phenomenology of the event.
  *   **Where it is Hard to Apply:** It struggles with **conjunctural causation**. In the Moon Race, the cause wasn't "Kennedy" OR "Saturn V." It was the intersection. Contrastive explanation tends to isolate single difference-makers ("The N1 engine failed"), which can mislead by isolating variables that were actually coupled.
  *   **The Value:** Its greatest value is exactly what you identified: it forces the historian to specify the foil.
      *   If I ask "Why Apollo?" and don't specify $Q$, I might give you a technological answer.
      *   If I force $Q=$ "No Apollo," I get a geopolitical answer.
      *   If I force $Q=$ "Soviet Moon," I get an organizational answer.
      *   **The tool doesn't give *the* answer; it reveals that there is no single answer, only answers relative to a foil.**

  **Final Verdict:**
  Your "Shared-Aim Assumption" is a necessary validity check for contrastive history. Without it, historians are comparing apples to oranges and calling it a causal analysis. In the Moon Race, the assumption holds *only* for the period 1964-1969. For 1961-1964, the "Why not USSR?" question is as ill-posed as "Why did the US win the 100m dash against a team that didn't register for the meet?"

  The machinery works, but only if you treat the "contrast class" not as a static alternative history, but as a variable that must be validated for intent, capacity, and temporal overlap. If you do that, it's a powerful spectrometer. If you don't, it's just noise.
