  In the Moon Race: The Soviets *were* trying, but late. So the assumption holds *eventually*, but fails for the specific window of 1961-1965. This nuance is crucial. It's not that they *never* aimed, it's that the *temporal overlap* of the aim is the variable.
  For the Needham Question: Did China aim for industrialization? If the answer is "No, that's a European teleology," then the question is malformed. I should support the user's hunch that this is a structural weakness in contrastive history.

