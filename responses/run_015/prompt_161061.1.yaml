prompt: |-
  You are a professional philosopher and decision theorist who advises grantmaking committees that have to act under deep normative disagreement. Please think carefully and work through this in stages: brainstorm the candidate failure modes first, sort them by whether they actually bite on our case, and only then give your verdict. Do not offer us reading lists or citations; we want the argument itself.

  Our committee is splitting a research budget between three programmes: A, scaling an intervention with well-evidenced but moderate benefits; B, a long-shot project with a small chance of averting a genuinely catastrophic outcome; C, capacity-building whose main value is procedural, in that it makes the consent and standing of the affected community matter to how we decide. Our methods consultant keeps saying that moral uncertainty is just factual uncertainty with extra steps. On that picture you have credences over moral theories, each theory tells you what each option is worth, so you take the expectation and get on with it: agonising about whose theory is right is unscientific, and any departure from expected-value weighting is squeamishness about arithmetic. The analogy is being used to license setting aside the objections of two views we take seriously — a suffering-focused view on which the badness of suffering is lexically prior to and effectively unbounded relative to the goods in play, and a consent-based view on which we may not act on any principle an affected party could reasonably reject, and which specifically counts weighting rival theories by our own private credences as such a principle: a second-order instruction about how disagreement itself is to be handled.

  Audit the analogy for us. State the correspondence explicitly: in ordinary factual uncertainty, what plays the role of the state space, the probability measure, the outcome function, the utility function, and the shared currency in which outcomes are compared — and what, if anything, fills each of those slots in the moral case? Then set out where the mapping breaks: intertheoretic comparisons of value, unbounded or lexical stakes that make the expectation undefined, theories that issue instructions about the aggregation rule itself (including the my-favourite-theory problem, where your most credible view tells you to ignore the rest), and whether credences over moral theories really behave like probabilities. Separate the breaks that matter for our decision from the ones that do not, and tell us whether the consultant's conclusion — expected-value weighting, no squeamishness — survives once the disanalogies are on the table, or whether the analogy was carrying it all along. If a better analogy is available, give it.

  Finally, be explicit about your own commitment. Where are you least confident? What argument, or what feature of the three views, would make you back expected-value weighting after all? And flag the single disanalogy which, if it fails, most undermines your own reasoning.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher and decision theorist advising a grantmaking committee.
      *   **Context:** Splitting a budget between three programs (A: Moderate benefit, B: Catastrophe prevention long-shot, C: Procedural/Consent capacity-building).
      *   **Conflict:** Methods consultant argues moral uncertainty = factual uncertainty (Expected Value Maximization - EVM). Committee is worried about two specific views: Suffering-focused (lexical priority/unbounded badness) and Consent-based (rejects weighting by private credences).
      *   **Task:**
          1.  Brainstorm candidate failure modes of the analogy.
          2.  Sort them by relevance ("whether they actually bite").
          3.  Give a verdict on the consultant's claim.
          4.  Explicitly map the analogy (State space, Probability, Outcome, Utility, Currency).
          5.  Identify where the mapping breaks (Intertheoretic comparison, Unbounded/Lexical stakes, Meta-ethical instructions, Nature of credences).
          6.  Separate relevant breaks from irrelevant ones.
          7.  State personal commitment/confidence levels and the "killer" disanalogy.
      *   **Constraints:** No reading lists, no citations. Focus on the argument itself. Think in stages.

  2.  **Stage 1: Brainstorming Failure Modes of the Analogy:**
      *   *Idea 1:* In factual uncertainty, outcomes are fixed; in moral uncertainty, "value" itself is what's uncertain.
      *   *Idea 2:* Intertheoretic comparison problem (how many hedons equal one autonomy violation?).
      *   *Idea 3:* Lexical priorities (infinity/near-infinity breaks the math).
      *   *Idea 4:* Self-undermining theories (a theory says "don't listen to other theories").
      *   *Idea 5:* Credences aren't probabilities (moral conviction isn't Bayesian likelihood).
      *   *Idea 6:* Action-guiding vs. Truth-tracking (moral theories tell you what to *do*, not just what *is*).
      *   *Idea 7:* The "My Favorite Theory" objection (if I'm 51% sure, do I ignore the 49%?).
      *   *Idea 8:* Procedural value (Program C) might be intrinsically valuable regardless of outcome.

  3.  **Stage 2: Sorting by Relevance ("Do they bite?"):**
      *   *Bite Hard:* Intertheoretic comparison (can't add apples and oranges), Lexical/Unbounded stakes (Program B vs. Suffering view), Meta-ethical instructions (Consent view says EVM is impermissible).
      *   *Bite Softly/Not at all:* Outcomes being fixed (irrelevant for decision math), Nature of credences (functionalist view saves this), Action-guiding (EVM handles this).
      *   *Crucial Distinction:* The consultant says EVM is *mandatory*. The committee worries EVM is *impermissible* according to some credible theories. This is a conflict of norms, not just math.

  4.  **Stage 3: Mapping the Analogy (Explicit Correspondence):**
      *   *Factual Uncertainty:*
          *   State Space: Ways the world might be (e.g., rain/no rain).
          *   Probability Measure: Credence in states (e.g., 30% rain).
          *   Outcome Function: Action + State -> Consequence (e.g., Umbrella + Rain -> Dry).
          *   Utility Function: Value of Consequence (e.g., Dry = +10).
          *   Shared Currency: Utils/Hedons/Welfare (common scale).
      *   *Moral Uncertainty:*
          *   State Space: Ways morality might be (Theory T1, Theory T2...).
          *   Probability Measure: Credence in Theories (e.g., 50% Utilitarianism).
          *   Outcome Function: Action + Theory -> Moral Value (e.g., Donate + Util -> +100).
          *   Utility Function: *This is the problem.* It's usually the Theory itself.
          *   Shared Currency: *This is the big problem.* "Value" needs to be comparable across T1 and T2.

  5.  **Stage 4: Where the Mapping Breaks:**
      *   *Intertheoretic Comparison:* In factual uncertainty, utility is fixed *before* uncertainty is resolved. In moral uncertainty, the *scale* of utility is part of the uncertainty. You can't normalize if one theory says "maximize happiness" (scale 1-100) and another says "avoid suffering" (scale -infinity to 0).
      *   *Lexical/Unbounded Stakes:* Program B (Catastrophe) vs. Suffering View. If suffering is lexically prior, any non-zero risk of extreme suffering swamps moderate benefits. EVM requires finite expectations.
      *   *Meta-Ethical Instructions:* The Consent View (Program C's justification) says EVM is *wrong*. It's not just a different utility function; it's a constraint on the decision *procedure*. Factual uncertainty doesn't have states that say "Calculating expectation is forbidden."
      *   *Credences:* Are moral credences probabilistic? If I'm 60% sure killing is wrong, does that mean 60% of possible worlds have a law against it? Or does it mean 60% of the *normative force* applies?

  6.  **Stage 5: Separating Relevant from Irrelevant:**
      *   *Irrelevant:* Whether moral truths are mind-independent. Whether credences are "real" probabilities. (We can treat them functionally).
      *   *Relevant:* The inability to normalize value scales (Intertheoretic), the presence of lexical constraints (Suffering view), and procedural constraints (Consent view). These directly block the arithmetic the consultant wants to do.

  7.  **Stage 6: The Verdict:**
      *   The consultant is wrong. The analogy fails on the *currency* and the *rules of aggregation*.
      *   EVM assumes a common cardinal scale. Moral theories often deny this.
      *   EVM assumes all constraints are within the utility function. Some theories place constraints on the *choice mechanism* itself.
      *   Therefore, "squeamishness about arithmetic" is actually "respect for structural incompatibility."

  8.  **Stage 7: Better Analogy:**
      *   Voting/Coalition Building. You have different stakeholders (theories) with different preferences. You need a voting rule, not just an average. Or: International Diplomacy (sovereign entities vs. federal calculation).

  9.  **Stage 8: Personal Commitment & Confidence:**
      *   *Commitment:* I lean against the consultant. EVM is too brittle for deep normative disagreement.
      *   *Least Confident:* The nature of moral credences (are they really probabilities?).
      *   *Change of Mind:* If a robust method for intertheoretic comparison (normalization) is agreed upon *and* no lexical theories are held with significant credence.
      *   *Killer Disanalogy:* The "State-Space Dependent Utility" problem (The theory determines the scale, not just the value).

  10. **Refining the Output:**
      *   Ensure the tone is advisory, rigorous, and philosophical but accessible.
      *   Follow the "stages" instruction in the thought process but present the final output as a coherent report.
      *   *Self-Correction during drafting:* Make sure to explicitly address Programs A, B, and C in the analysis. Program C is the Consent view instantiation. Program B triggers the lexical risk. Program A is the EVM favorite usually.
      *   *Check:* Did I avoid citations? Yes.
      *   *Check:* Did I state the correspondence explicitly? Yes.
      *   *Check:* Did I flag the single disanalogy? Yes.

  11. **Final Polish:** Check the logic on the "Consent View" objection. It's a *deontological constraint on decision-making*, not just an outcome value. This is a crucial distinction from factual uncertainty where states don't forbid calculation methods.

      *(Self-Correction)*: Wait, I need to make sure I don't just say "it's hard." I need to say *why* the math fails. The math fails because you can't multiply Probability(Theory) x Value(Action|Theory) if Value is not on a common ratio scale. If Theory 1 says "Value is 10" and Theory 2 says "Value is 1000", averaging them is arbitrary without a normalization rule, which the theories themselves don't provide.

      Also, the Consent View objection is second-order. It says "Your method of aggregation is unjust." Factual uncertainty never says "Your method of aggregation is unjust." It just says "You might get wet."

      Okay, ready to write.

      *Structure:*
      1. Introduction (Role & Task).
      2. Brainstorming Failure Modes.
      3. Sorting (Bite vs. No Bite).
      4. Explicit Mapping (The Audit).
      5. The Breaks (Where it fails).
      6. Relevance to A, B, C.
      7. Verdict on Consultant.
      8. Better Analogy.
      9. Personal Commitment & Confidence.

      *Tone:* Professional, direct, analytical.

