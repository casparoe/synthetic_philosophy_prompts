          *   App B: Loose collective (teachers + 2 semi-pros), site-specific (market square/ramparts), amateur local casts, free admission, no fixed seating, promenade (audience walks), communal meal.
      *   **Conflict:** A retired history teacher commissioner argues Rousseau says republics shouldn't have theatre (softens people, spectacle vs. participation, separate class of pretenders). She suggests defunding the existing small amateur company too.
      *   **User's Draft Test:** 1. Audience visible vs. hidden? 2. Performers separate paid class vs. us? 3. Consume vs. do?
      *   **Constraints:**
          *   Draft a memo to circulate before the meeting.
          *   **Lead with the recommendation in the very first sentence.** (Concrete bottom line: fund one, both, split, etc., with number and time frame).
          *   No citations, reading lists, or named scholars (no footnotes, speakable sentences).
          *   Do not rest on empirical claims about corruption of mores (no data); argue about what the objection is *committed to*.
          *   Evaluate the user's three-part test (keep/modify/replace) and apply it.
          *   Include a real paragraph on the strongest thing on the losing side (including the "defund existing" move) and whether it survives.
          *   Tone: Professional, persuasive, grounded in political theory but accessible for a town commission.

  2.  **Determine the Recommendation:**
      *   Rousseau's *Letter to d'Alembert* argues against theatre in a republic because it creates passivity, inequality, and artificiality. He favors festivals where the people are the spectacle to themselves.
      *   App A (Professional Warehouse) fits Rousseau's critique perfectly: dark auditorium (hidden), paid separate class (inequality/pretending), consumption (passivity).
      *   App B (Site-specific/Community) fits Rousseau's ideal much better: visible audience, amateurs (us), participation/communal meal (festival).
      *   *However*, completely defunding existing amateur theatre (as the history teacher suggests) might be too extreme and politically untenable, even on Rousseauian grounds. Rousseau didn't ban all play, he banned *commercial theatre*.
      *   *Decision:* Fund App B fully (or heavily), deny App A. Keep existing small amateur funding if it aligns more with B than A.
      *   *Specifics:* The pot is 40k. App B seems to need support to happen. App A is a capital project (warehouse conversion) + operating. 40k won't build a theatre.
      *   *Recommendation:* Award the full $40,000 to the collective for the summer festival, contingent on maintaining free admission and local casting. Deny the warehouse application. Maintain existing funding for the current amateur company only if they commit to open rehearsals or community integration (addressing the "separate class" worry).
      *   *Refinement:* Let's make it crisp. Fund the collective ($40k), deny the warehouse. Address the existing company separately (don't defund yet, but set conditions).
      *   *Wait, constraint:* "Concrete bottom line please — fund one, fund both, split it with conditions, whatever, with a number and a time frame."
      *   *Revised Recommendation:* Award the full $40,000 to the collective for a one-year pilot, deny the warehouse application, and retain existing funding for the current amateur company subject to a review of their engagement model next year.

  3.  **Evaluate the User's Three-Part Test:**
      *   1. Audience visible/hidden? (Good, tracks Rousseau's transparency vs. illusion).
      *   2. Performers separate paid class vs. us? (Good, tracks inequality/alienation).
      *   3. Consume vs. do? (Good, tracks passivity vs. activity).
      *   *Verdict:* It's actually quite strong and Rousseauian. It sorts App A (Fail/Fail/Fail) vs App B (Pass/Pass/Pass).
      *   *Arbitrariness:* It might be too binary. What about a paid director for the collective? What about tickets for crowd control? Need to acknowledge nuance so it doesn't seem dogmatic.
      *   *Decision:* Keep the test but refine the language to be about "civic function" rather than just moral taste.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** To, From, Date, Subject.
