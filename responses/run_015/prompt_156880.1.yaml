      *   **The Counter-Argument (Strongest Case for Losing Side):** The history teacher's point. If theatre is bad, why fund *any*? The strongest version is consistency. If we accept the premise that professional theatre undermines self-governance, the existing company is also suspect.
      *   **Rebuttal to Counter-Argument:** The distinction isn't "theatre vs. no theatre," it's "spectacle vs. festival." The existing company is closer to the festival model than the warehouse model. Defunding them now is inconsistent with the goal of nurturing local capacity.
      *   **Future Criteria:** Formalize the test for next year.

  5.  **Refining the Tone:**
      *   Avoid academic jargon ("alienation," "general will").
