answer: |-
  **MEMORANDUM**

  **TO:** Arts Commission
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Funding Recommendations for FY2024

  I recommend we award the full $40,000 to the collective for a one-year summer festival, deny the warehouse application, and maintain existing funding for the current amateur company subject to a review of their community engagement model next year.

  Our town prides itself on self-governance, and public arts funding should reinforce rather than undermine that civic structure. The core question is not whether theatre is morally good or bad in the abstract, but whether the structure of the proposed activity supports a community of citizens or creates a division between producers and consumers. The warehouse proposal establishes a permanent separation: a darkened room where the audience is hidden, paid professionals who commute from outside, and a transaction where art is something purchased and consumed. The collective proposal inverts this: the action happens in public light, the cast is drawn from our neighbors, and the event concludes with a shared meal that dissolves the line between performer and spectator.

  My proposed three-part test—visibility of the audience, origin of the performers, and active versus passive engagement—successfully sorts these two applications. The warehouse fails all three criteria; the collective passes all three. However, the test contains one arbitrary edge case regarding payment. The collective includes two semi-professional performers, which technically violates the "just us" criterion. To make this criterion usable for future cycles, we should refine it to ask whether the *primary* creative labor is provided by residents versus whether *any* payment changes the classification. This prevents us from penalizing groups that need a small amount of professional leadership to organize volunteer energy.

  The strongest argument against this recommendation is the claim of consistency: if we accept the premise that theatrical representation distances citizens from their own civic reality, then the existing amateur company is vulnerable to the same objection as the warehouse proposal. If pretending to be someone else is the problem, it matters less whether the pretender is paid or local. This objection survives only if we define the harm of theatre solely as the act of imitation. However, the deeper objection is about institutionalized inequality and passivity. A group of neighbors organizing a play for themselves is structurally different from a business selling tickets to a darkened room. Therefore, the move to defund the existing company does not survive if we distinguish between *spectacle* (imported consumption) and *festival* (local participation). We should retain their funding but require them to demonstrate how they integrate non-performers into their process to ensure they remain a civic activity rather than a nascent industry.

  For next year's applications, I propose we adopt the refined criteria above as a standard rubric. We should prioritize projects that utilize public space, prioritize local casting, and include mechanisms for audience interaction. This ensures our limited funds support the town's self-conception as an active republic rather than a passive market for culture.
