answer: |-
  # The Kitchen Table Protocol: Realism vs. Induction

  ### 1. Agreed Claims
  *These are the premises both of us sign off on. They are not trivial sceptic claims; they are the load-bearing floor of the argument.*

  1.  **Novel Prediction is the Metric:** We agree that "success" should be measured primarily by novel predictions (predicting phenomena not used to construct the theory) rather than mere accommodation of known data.
  2.  **Ontology vs. Formalism:** We agree that a theory can be separated into its mathematical formalism (the equations/structure) and its ontological posits (the claims about what physically exists, e.g., "ether," "quarks").
  3.  **Theory Change is Real:** We agree that the history of science shows significant theory change, where previously successful theories are replaced or heavily modified.
  4.  **Future Judgment:** We agree that scientists in 40 years will be in a better position to judge the truth-value of our current theories than we are today.
  5.  **The Audit is Possible:** We agree that for any past theory, we can list the specific components responsible for its novel predictions and check their status in current science.

  ### 2. Disagreements Table
  *We state our positions here so we cannot accuse each other of straw-manning later. Each formulation is designed so the respective party would sign it.*

  | Issue | Sam's Formulation (Selective Realist) | My Formulation (Pessimist) |
  | :--- | :--- | :--- |
  | **1. The Unit of Induction** | The unit is the **structurally indispensable component**. We should not count the whole theory as "false" if the math that did the work survives. The unit is whatever carries the predictive load. | The unit is the **central ontological posit**. If the thing the theory said existed (ether, phlogiston) is gone, the theory is false, even if the equations work. The unit is the claim about reality. |
  | **2. Retention & Hindsight** | Retention is objective. If the math structure survives, it wasn't hindsight to find it; it was actually doing the work back then. High retention rates justify belief in the current structure. | Retention is often retrofitted. It is easy to look at what survived and claim it was "essential." We need to know if the *reason* it worked was preserved, not just the formula. |
  | **3. Comparability of Success** | Success is absolute. Past theories are only relevant if they matched the raw predictive power of current theories. If they were weaker, their failure doesn't indict our stronger theories. | Success is relative to rivals. A past theory should be judged against its contemporaries. If it beat its rivals but was still wrong, our beating our rivals doesn't guarantee we are right. |
  | **4. Approximate Truth** | Approximate truth is simply **structural retention**. If the structure stays, the theory was approximately true. This is a substantive claim, not a label. | Approximate truth is a **placeholder label**. It is applied after the fact to whatever survives. It lets the realist claim victory regardless of what happens. |

  ### 3. Cruxes & Forward Commitments
  *This is where we stop looking backward and place our bets. We define the procedures and predictions that will settle this in 40 years.*

  **Crux 1: The Retention Audit (Backward Calibration)**
  *   **The Procedure:** We select three discarded theories once considered highly successful (e.g., Caloric Theory, Fresnel's Ether, Phlogiston). We list the specific components that generated their novel predictions. We categorize the fate of each component using the Taxonomy below.
  *   **The Taxonomy:**
      1.  **Refuted-and-Abandoned:** The posit is declared non-existent; the math is discarded.
      2.  **Absorbed-as-Limiting-Case:** The math works in a specific range, but the ontology is rejected (e.g., Newtonian mass).
      3.  **Kept-with-Reinterpretation:** The ontology is retained, but the mechanism explaining it changes.
  *   **Sam's Prediction:** The majority of predictive load-bearing components will fall into Category 2 or 3. This shows structural continuity.
  *   **My Prediction:** The majority of central ontological posits will fall into Category 1. The math surviving is just instrumentality, not truth.

  **Crux 2: The 40-Year Commitment (Forward Test)**
  *   **The Sample Theories:** We lock in this list of current central posits to be judged in 40 years:
      1.  Quarks and Leptons (Standard Model).
      2.  Spacetime Curvature (General Relativity).
      3.  Dark Matter as particulate substance.
      4.  The Central Dogma (DNA -> RNA -> Protein as universal rule).
  *   **The Rules for Judgment:**
      *   **Abandoned:** The posit is declared non-existent (e.g., "Dark matter was a measurement error").
      *   **Demoted:** The math remains useful, but the ontology is rejected or radically changed (e.g., "Spacetime isn't fundamental, it's emergent").
      *   **Vindicated:** The posit is confirmed as physically real in roughly the form described.
  *   **Sam's Prediction:** At least 75% of these posits will be Vindicated or Demoted (preserving structure). Less than 25% will be fully Abandoned.
  *   **My Prediction:** At least 50% of these posits will be fully Abandoned. The ones that are Demoted will lose their ontological status entirely.
  *   **Evidence Against Sam's Position:** If specific central posits (like Quarks) are declared non-existent rather than modified.
      *   *Sam's prediction of my reaction:* I will claim this proves the PMI.
      *   *My prediction of Sam's reaction:* She will argue the mathematical structure survived, so the "realism" was justified despite the ontology change.
  *   **Evidence Against My Position:** If the mathematical structure remains identical and the ontology is confirmed largely as is (e.g., we literally find the particle exactly as described).
      *   *My prediction of Sam's reaction:* She will claim this proves selective realism.
      *   *Sam's prediction of my reaction:* I will argue this is just one lucky hit and doesn't invalidate the historical trend.

  **Crux 3: Domain Variance (Physics vs. Biology/Medicine)**
  *   **The Case:** Does the induction hold equally across fields?
  *   **Sam's Prediction:** The retention rate will be higher in Physics than in Biology. Physics deals with fundamental structure; Biology deals with messy, contingent historical systems. Realism is safer in Physics.
  *   **My Prediction:** The retention rate will be low in both. Biology feels messier, but Physics posits (like Dark Matter) are currently more speculative than biological mechanisms. The PMI applies equally; the "fundamental" label is no protection.

  ### 4. Verbal and Definitional Issues
  *We acknowledge where we might be arguing over words rather than world.*

  1.  **"Approximate Truth":** We recognize this is the biggest verbal sticking point.
      *   *Why:* Sam uses it to mean "structural retention." I use it to mean "ontological accuracy."
      *   *Resolution:* We agree to stop using the phrase "approximately true" in future debates. We will use "structurally retained" (Sam's view) vs. "ontologically preserved" (My view). If we strip the phrase out, the disagreement remains about whether structure implies ontology, but we won't get stuck on the label.
  2.  **"Success":** We acknowledge a tension in the "Comparability" row.
      *   *Why:* Sam defines success by absolute predictive power; I define it by relative superiority to rivals.
      *   *Resolution:* We will track both metrics in the 40-Year Commitment. We will note if a theory is superseded by something *more* successful (Sam's focus) or simply *different* (My focus).

  ### 5. Aside: Critique of Sub-Arguments
  *This section is outside the agreement. It is an observation on the argumentative structure we used last night.*

  **The "Hindsight" Loop is a Dead End.**
  Both of us used the accusation of "hindsight bias" as a conversation stopper.
  *   **Sam:** When I pointed out a discarded posit, you said I was cherry-picking the bits that survived.
  *   **Me:** When you pointed out surviving math, I said you were retrofitting importance onto it.
  *   **The Problem:** This accusation is unfalsifiable in the moment. Anyone can claim the other is looking backward to find a pattern.
  *   **The Fix:** This is why the **Retention Audit** in Crux 1 is necessary. We must write down the components *before* checking their status. If we don't pre-commit to what counts as the "load-bearing" part of a past theory, the hindsight accusation will always be valid, and we will never settle anything. The argument isn't about whether hindsight exists; it's about whether we can control for it. Last night, we didn't try to control for it; we just wielded it as a weapon. That was bad arguing.
