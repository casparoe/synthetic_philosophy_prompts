prompt: |-
  I got into sortition a couple years back (I drive a delivery van, no philosophy past high school) and the more I read the more it looks like the thing people actually build isn't the thing they say they believe in.

  What's actually out there: you draw a few dozen or a few hundred people at random — but only from the people who said yes to the letter — you sort them so the group roughly mirrors the population on age, gender, education, region, you sit them for a handful of weekends with experts and a facilitator, they write recommendations, and the elected politicians are free to shelve them. One issue, one group, never the same people twice.

  What I can't figure out is what any of that is claiming. If the claim is that an ordinary random person's judgment on an issue is as good as a politician's, why is it fine that the pool is only volunteers, why bother making the group mirror the population, and why is the output only advice? If the claim is that the group is legitimate because everyone had an equal shot at the draw, don't the volunteer filter and the expert weekends break it? I think people are quietly switching between two different stories — one about the group standing in for everybody, one about the draw being fair to everybody — and I want to know whether those two stories are really compatible.

  The version I daydream about: forget the weekends. Draw people for one non-renewable six year term, pay them what legislators get, let them hire their own staff, ban them from ever running for elected office afterwards so it can't be a career step, and fill half the chamber that way and half by election. Meanwhile plenty of places cap presidents, governors and mayors at two terms and then act surprised that the permanent staff, agency heads and lobbyists are the ones who actually remember how anything works.

  So: what does a practice like this presuppose — about what makes a body representative, about whether governing is a skill that takes time to learn, and about why a decision binds people who had no hand in it? Give me the implicit theory rather than the case for it, and mark which bits the practice really commits you to versus which bits it just sits nicely with and would still work fine under a completely different theory. And if the mirroring story and the equal-chance story can't both be doing the work, tell me which one the real world version is secretly leaning on and which one it would have to give up.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Profile:** Delivery van driver, no philosophy past high school, interested in sortition (citizens' assemblies) for a couple of years. This means they are intelligent and observant but likely unfamiliar with academic jargon (e.g., "descriptive representation," "epistemic democracy," "normative legitimacy"). They see through the marketing fluff.
      *   **Core Observation:** The user has spotted a contradiction in current sortition practice (Citizens' Assemblies/Citizens' Juries).
          *   *Practice:* Volunteers only, stratified sampling (mirroring), expert-led learning, advisory only, one-off issues.
          *   *Tension:* Is it about *competence* (ordinary people know best)? Is it about *fairness* (equal chance)? Is it about *representation* (standing for the people)? The user suspects proponents are switching between stories.
      *   **User's Alternative:** A bicameral system (half elected, half sortition), long terms (6 years), professionalized (staff, pay), ban on future office. This is closer to a "Sortition House" or "Lottocracy" model.
      *   **The Task:** Explain the *implicit theory* behind current practice vs. the user's vision. Identify what the practice *commits* you to vs. what is just compatible. Determine which legitimacy story (mirroring vs. equal chance) the current practice actually relies on.
      *   **Tone:** Respectful, direct, avoiding unnecessary jargon, acknowledging the user's insight (which is quite sharp).

  2.  **Deconstruct the Current Practice (Citizens' Assemblies):**
      *   *Mechanism:* Random selection from volunteers -> Stratification -> Deliberation -> Recommendation.
      *   *Implicit Theory:* It's not about *ruling*; it's about *advising*. It's a "poll plus." It assumes politicians need cover to make tough decisions. It assumes ordinary people need "training" (experts) to be useful.
      *   *Legitimacy Source:* It leans heavily on *Descriptive Representation* (mirroring) + *Deliberative Quality* (the process makes the output good). It *abandons* the idea that the draw itself confers authority to rule.
      *   *The Contradiction:* The user is right. If it's about the "equal chance" (sortition proper), the volunteer filter breaks it. If it's about "mirroring," the small sample size and advisory status weaken it.

  3.  **Deconstruct the User's Vision (Sortition Chamber):**
      *   *Mechanism:* Compulsory (implied, or at least no volunteer filter), Long Term, Professionalized, Legislative Power.
      *   *Implicit Theory:* Governing is a job like any other. Experience matters (6 years). Representation means *being* the people, not just looking like them. Legitimacy comes from the *office*, not just the *process*.
      *   *Tension:* Does long-term service make them a new class (professional citizens)? Does removing the volunteer filter make it a duty (like jury duty)?

  4.  **Address the Specific Questions:**
      *   *What does the practice presuppose?* (About representation, skill, binding decisions).
      *   *Commitments vs. Compatibility:* What is essential to the theory vs. what is accidental?
      *   *Mirroring vs. Equal Chance:* Which one is the real engine?

  5.  **Drafting the Response - Section by Section:**

      *   **Validation:** Start by acknowledging the user's insight. They are correct. The "Citizens' Assembly" model is a hybrid that tries to have it both way and often fails the strict logic of sortition.
      *   **The Two Stories (Mirroring vs. Equal Chance):**
          *   *Equal Chance:* Pure sortition. Like jury duty. You don't volunteer. You *are* the state.
          *   *Mirroring:* Statistical representation. Like a poll. You need to look like the population.
          *   *The Verdict:* Current practice leans on **Mirroring + Deliberation**. It gives up the "Equal Chance" authority. The volunteer filter proves they want *willing* participants, not *obligated* citizens.
      *   **Implicit Theory of Current Practice:**
          *   *Representation:* It's "Descriptive." The group is a microcosm.
          *   *Skill:* Governing isn't the goal; *judging* is. They don't need to be experts; they need to be "common sense" filters for experts.
          *   *Binding:* They don't bind. They provide "political cover."
          *   *Commitment:* This model commits to the idea that people are *too busy* or *unwilling* to serve long-term. It treats democracy as a part-time hobby, not a job.
      *   **Implicit Theory of User's Vision:**
          *   *Representation:* It's "Authorization." You are sent to act.
          *   *Skill:* Governing *is* a skill. It takes time to learn (6 years).
          *   *Binding:* Yes, they make laws.
          *   *Commitment:* This commits to the idea that citizenship is a *duty* (like jury duty), not a volunteer opportunity.
      *   **The "Secret" Lean:** Current practice is secretly a **Consultative Poll**. It uses the *aesthetic* of sortition (randomness) to gain legitimacy, but the *mechanics* of focus groups (volunteers, facilitators) to ensure manageability. It cannot claim the "Equal Chance" legitimacy because of the volunteer filter.
      *   **The "Binding" Question:** Why does a decision bind those who didn't participate?
          *   *Current Practice:* It doesn't. That's why it's advisory.
          *   *User's Vision:* It binds because the *office* binds, just like an MP binds constituents who didn't vote for them. The randomness ensures the *office* isn't captured by elites.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Jury Duty Analogy:* Crucial here. Real juries don't ask for volunteers. They summon. Current assemblies are more like "Focus Groups with Lottery Marketing."
      *   *Stratification:* Why do they do it? Because random samples of 100 people often look weird by chance. Stratification forces the "Mirroring." This confirms the "Mirroring" theory over the "Pure Luck" theory.
      *   *Expertise:* Current practice assumes people are ignorant and need filling up. User's vision assumes people are capable of learning on the job.
      *   *Terminology:* Keep it simple. Instead of "Descriptive Representation," use "Looking like the crowd." Instead of "Normative Legitimacy," use "Right to Rule."

  7.  **Final Polish:**
      *   Ensure the distinction between "Commitments" (must be true for the system to work) and "Compatibilities" (nice to have) is clear.
      *   Make sure to answer the specific question: "Which one the real world version is secretly leaning on?" (Answer: Mirroring/Consultative).
      *   Acknowledge the user's "Daydream" is actually closer to historical sortition (Venice, Athens) than the modern "Assembly" model.

  8.  **Final Review against constraints:**
      *   No philosophy jargon without explanation.
      *   Address the driver's specific observations.
      *   Focus on implicit theory, not advocacy.

  *(Self-Correction during drafting)*: I need to be careful not to just say "You're right, the current system sucks." I need to explain *why* it is built that way. It's built that way because elites tolerate it. It's a safety valve, not a power transfer. The theory behind *that* is "Elite Stewardship with Public Input."

  Okay, let's structure the response.
  1. Validate the insight.
  2. Break down the two stories (Mirroring vs. Equal Chance).
  3. Analyze Current Practice (The "Advisory" Model).
  4. Analyze User's Vision (The "Legislative" Model).
  5. Answer the specific questions on representation, skill, and binding.
  6. Conclusion on which story is actually being told.

  (Proceed to generate output based on this thought process.)
answer: |-
  You have spotted the seam in the fabric. Most people who talk about sortition don't realize they are stitching together two different theories of democracy that don't actually fit. You're right to be suspicious.

  Here is the breakdown of the implicit theories, what the current practice actually commits to, and where the contradiction lies.

  ### 1. The Two Stories
  You identified them perfectly. Let's give them plain names.

  *   **Story A: The Equal-Chance Story (The Jury Model).**
      *   **Logic:** Every citizen has an equal right to rule. Therefore, we pick by lot. If you are picked, you serve, whether you want to or not (like jury duty).
      *   **Legitimacy:** Comes from the *fairness of the selection*. It doesn't matter if the group looks perfect; it matters that nobody was excluded from the pool.
      *   **Implication:** Service is a duty. The output is binding (like a verdict).

  *   **Story B: The Mirroring Story (The Microcosm Model).**
      *   **Logic:** The group needs to "stand for" the whole population. If the country is 51% female, the group should be too. If the country is angry, the group should show anger.
      *   **Legitimacy:** Comes from the *accuracy of the reflection*.
      *   **Implication:** You need to filter and adjust the group (stratification) to make sure it looks right. The output is advice, because a mini-version of the people can't actually *be* the government.

  ### 2. What Current Practice Actually Commits To
  The "Citizens' Assembly" model you described (volunteers, stratified, advisory, short-term) is not trying to tell Story A. It is secretly telling a third story: **The Consultative Story.**

  **What it presupposes:**
  *   **Representation:** It assumes representation is about *opinion*, not *authority*. The group is a high-quality focus group, not a legislature.
  *   **Skill:** It assumes governing is a technical skill that ordinary people *cannot* learn in a reasonable time. Therefore, they must be "fed" information by experts and facilitated by professionals. They are judges of evidence, not creators of policy.
  *   **Binding:** It presupposes that a decision only binds people if their elected agents sign off on it. It assumes ordinary people cannot be trusted with the "hard choices" of implementation or budget trade-offs.

  **The Contradiction:**
  You asked if the volunteer filter breaks the "Equal Chance" story. **Yes, absolutely.**
  *   If you only pick from volunteers, you are not selecting "the people." You are selecting "people who like meetings."
  *   If you then stratify (adjust the group to match census data), you are admitting that random chance isn't enough. You are engineering the outcome to look representative.

  **The Verdict on Current Practice:**
  The real-world version is secretly leaning on **Story B (Mirroring)** but without the teeth. It wants the *look* of the people without the *power* of the people. It would have to give up the "Equal Chance" story entirely. It cannot claim that everyone had a fair shot at power, because only the willing were in the hat.

  ### 3. What Your Vision Commits To
  Your "daydream" (6-year terms, paid, half the chamber, no re-election) is historically closer to how sortition was actually used (e.g., Venice, Athens). It relies on **Story A (Equal Chance/Duty)** but professionalized.

  **What it presupposes:**
  *   **Representation:** Representation is about *authorization*. If I am drawn by lot, I am authorized to act for my neighbors. I don't need to "mirror" them perfectly; I just need to be one of them.
  *   **Skill:** Governing *is* a skill, but it is a skill like carpentry or nursing, not priesthood. It can be learned on the job. Six years is an apprenticeship.
  *   **Binding:** A decision binds because the *office* binds. Just as you are bound by a law passed by an MP you didn't vote for, you are bound by a law passed by a sortition member you didn't know. The randomness ensures the office isn't owned by a specific class.

  **The Tension in Your Vision:**
  Your model creates a new class: **Professional Citizens.**
  *   If they serve for 6 years, paid well, with staff, they are no longer "ordinary people." They become a distinct political class, just like elected politicians.
  *   However, banning them from future office helps. It prevents them from using the seat as a stepping stone. It makes it a *terminal* career, not a *launching* career.

  ### 4. Answering Your Specific Questions

  **Q: What makes a body representative?**
  *   **Current Practice:** A body is representative if its *demographics* match the population (Story B). This is why they tweak the numbers.
  *   **Your Vision:** A body is representative if its *members are drawn from the population without exclusion* (Story A). It relies on the law of large numbers over time.
  *   **The Conflict:** You can't have both. If you tweak the group to match demographics (current practice), you violate the pure random draw. If you do a pure random draw (your vision), you might end up with a group that doesn't perfectly match the census in any given year. Current practice chooses "looking right" over "being random."

  **Q: Is governing a skill that takes time to learn?**
  *   **Current Practice:** **Yes.** This is why they limit it to weekends and give them experts. They assume you can't learn the job, so you should just give advice.
  *   **Your Vision:** **Yes, but...** It assumes you *can* learn it if given the time and resources.
  *   **The Commitment:** Current practice commits to the idea that ordinary people are *too busy* to govern. Your vision commits to the idea that ordinary people are *capable* but currently *blocked*.

  **Q: Why does a decision bind people who had no hand in it?**
  *   **Current Practice:** **It doesn't.** This is the crucial point. Current assemblies produce *recommendations*. They bind no one. This is why politicians tolerate them. They are a way for politicians to say, "Look, the people said it, not me."
  *   **Your Vision:** It binds because the *system* is legitimate, not the specific individual. In an election, 51% bind the 49%. In your sortition chamber, the 0.001% selected bind the 99.999%. The justification is that *anyone* could have been selected (if you remove the volunteer filter).
  *   **The Commitment:** To make it bind, you must remove the volunteer filter. You must make it a duty, like jury duty. If it's voluntary, the people who didn't volunteer can rightly say, "I didn't choose them, they don't speak for me."

  ### 5. Summary: The Hidden Theory

  The current "Citizens' Assembly" industry is not building a democratic alternative. It is building a **legitimacy machine for the existing system.**

  *   **Implicit Theory:** "Elected politicians are stuck. They need cover to make long-term decisions (like climate change) that voters might punish them for. Let's create a group that *looks* like the voters, *learns* what the experts want, and *recommends* what the politicians wanted to do anyway."
  *   **What it commits to:** It commits to the idea that the *current elected officials* must remain the final decision-makers.
  *   **What is just compatible:** The idea of "randomness" is just compatible. They use it for branding. They could achieve the same "mirroring" with a carefully recruited focus group, but "Lottery" sounds more democratic.

  **Your vision** commits to something much more radical: **Power Sharing.**
  *   It commits to the idea that elected politicians are structurally biased (toward donors, short-term cycles, careerism) and need a counter-weight with a different incentive structure.
  *   It commits to the idea that citizenship is a job, not a hobby.

  **Conclusion:**
  The two stories (Mirroring vs. Equal Chance) are not compatible in the current model. The current model sacrifices **Equal Chance** (by using volunteers) to ensure **Mirroring** (by stratifying), and then sacrifices **Power** (by making it advisory) to ensure **Elite Acceptance**.

  If you want the "Equal Chance" story to work, you must remove the volunteer filter. If you want the "Mirroring" story to work, you must admit it's a poll, not a parliament. The current practice tries to claim the moral authority of the first while keeping the safety of the second. You are right to call it a switch.
