answer: |-
  ## System Architecture Specification: The Temporal Identity Protocol

  **Subject:** Normative Authority in Distributed Temporal Systems (Advance Directives)
  **Metaphor:** The Self as a Stateful Service; The Directive as a Signed Configuration Artifact.

  In this architecture, the **Prior Self (Competent)** is treated as a stable release (e.g., `v1.0`) that signs a configuration file (the **Advance Directive**). The **Later Self (Incapacitated/Changed)** is the **Running Instance** (`v2.0-rc` or `v1.0-degraded`) executing in production. The core engineering question is: *Does the build-time configuration (`v1.0`) enforce runtime behavior on the instance, or does the runtime environment hold root access to override the build artifacts?*

  Below is the analysis of the three main architectural patterns for handling this dependency.

  ---

  ### Position 1: The Precedent Autonomy Model (The Directive Binds)
  **Philosophical Claim:** The competent earlier self retains authority over the later self because they are the same legal and moral entity. The directive is binding regardless of current preferences.

  **System Translation:** **Immutable Infrastructure & Signed Artifacts.**
  The `v1.0` release signs the config file with a private key that is destroyed upon deployment. The Running Instance is treated as a stateless worker that must execute the signed manifest. Even if the runtime environment variables change (new values), the container is orchestrated to fail rather than violate the signed contract. The system prioritizes **Consistency** over **Availability** (in CAP theorem terms).

  *   **Translates Cleanly:**
      *   **Commit Immutability:** A git commit hash cannot be changed retroactively. Similarly, the prior self's decision is a historical fact that cannot be altered by the current state.
      *   **Deployment Integrity:** In high-security environments, runtime overrides are disabled to prevent drift. This mirrors the ethical view that allowing the incapacitated self to override the directive introduces "security vulnerabilities" (irrational fear, pain, or cognitive degradation).
  *   **Must Be Distorted:**
      *   **The "Running Instance" Competence:** In software, if an instance is buggy, we kill it and spin up a new one. In the AD debate, we cannot kill the instance; we must keep the buggy hardware running but force it to execute code it may no longer "understand" or "want." The metaphor obscures the coercion required to force a legacy system to run deprecated protocols.
  *   **No Counterpart:**
      *   **Suffering as Latency/Error:** Software does not "care" if it is forced to execute a delete operation. A human instance experiences *qualia*. The metaphor has no variable for `pain_score` or `dignity_loss` resulting from strict adherence to the config.

  ### Position 2: The Current Interest Model (The Instance Revokes)
  **Philosophical Claim:** The later self's current well-being trumps the prior self's abstract instructions. If values have changed or the situation is unforeseen, the directive should be ignored to prevent suffering.

  **System Translation:** **Dynamic Configuration & Hot-Reloading.**
  The Running Instance holds `root` access. The config file from `v1.0` is treated as a *default suggestion* or a `legacy.conf` that can be overwritten by `local_env_vars`. The system prioritizes **Availability** and **Partition Tolerance**. If the runtime detects a critical error (suffering), it triggers an exception handler that bypasses the original logic.

  *   **Translates Cleanly:**
      *   **Environment Variables:** Production configs often override build-time constants. This maps well to the idea that "context matters" and the prior self could not anticipate the specific production environment (medical reality).
      *   **Circuit Breakers:** If the system detects a feedback loop of failure (unbearable suffering), the circuit breaker trips, ignoring the upstream directive to prevent total system collapse.
  *   **Must Be Distorted:**
      *   **The "Corrupted Node" Problem:** Often, the Later Self in AD cases is suffering from dementia or delirium. In engineering terms, this is a **Byzantine Fault** (the node is lying or malfunctioning). Allowing a Byzantine node to rewrite the config is generally considered an anti-pattern. This position forces us to treat a compromised node as a trusted administrator.
  *   **No Counterpart:**
      *   **Normative Agency:** In code, if a runtime override is "wrong" (causes a crash), it is a bug. In ethics, a person has the *right* to make a "wrong" choice (refusing life-saving treatment). The software metaphor assumes an objective "system health" metric that ethics explicitly rejects.

  ### Position 3: The Psychological Continuity Model (The Nuanced View)
  **Philosophical Claim:** Authority depends on the degree of connection between the selves. If the later self is psychologically continuous with the earlier self, the directive holds. If the later self is effectively a "different person" (e.g., advanced dementia), the directive lapses.

  **System Translation:** **Semantic Versioning (SemVer) & Breaking Changes.**
  We treat the transition from Prior to Later Self as a version upgrade.
  *   **Patch/Minor Update:** Values changed slightly, memory intact. The `v1.0` API contract remains backward compatible. The Directive executes.
  *   **Major Version (Breaking Change):** Core identity modules refactored or removed (dementia). The `v2.0` instance is incompatible with `v1.0` dependencies. The Directive returns `404 Not Found` or `Deprecated`.

  *   **Translates Cleanly:**
      *   **Deprecation Schedules:** We can define a sunset policy. "This directive is valid until `identity_hash` diverges by threshold X."
      *   **Dependency Graphs:** We can map which values are "core dependencies" (identity) and which are "dev dependencies" (preferences). If core dependencies are missing, the build fails.
  *   **Must Be Distorted:**
      *   **Discrete vs. Continuous:** Software versions are discrete tags. Human identity decay is a continuous, analog slide. Determining the exact commit where `v1.0` became `v2.0` is arbitrary in humans, whereas in Git it is cryptographic.
  *   **No Counterpart:**
      *   **Emotional Continuity:** Two versions of code can be functionally identical but have different "histories." In humans, the *feeling* of continuity matters. A system doesn't have "memories" that bind it to the past except as data logs. The *emotional weight* of being the same entity is not a data field.

  ---

  ## Residue Report

  **Does the framework reveal the disagreement is about Continuous Deployment vs. Discrete Releases?**

  Partially. The engineering metaphor successfully isolates the **Authority Handshake** problem. The debate is indeed about whether we treat the human lifecycle as a **Stateless Service** (where any request can be handled by any instance, prioritizing current load/suffering) or a **Stateful Monolith** (where the initial schema defines the database structure forever).

  The metaphor clarifies that Position 1 (Precedent Autonomy) relies on **Cryptographic Identity** (the signature matters more than the content), while Position 2 (Current Interest) relies on **Runtime Heuristics** (the output matters more than the source). Position 3 attempts to introduce **Semantic Versioning** to human psychology, which is the most engineering-friendly but also the most arbitrary mapping.

  **Does the vocabulary fail to express something real?**

  Yes. The metaphor creates a **Category Error regarding Suffering and Agency.**

  1.  **The Absence of Qualia:** In distributed systems, "technical debt" is a metaphor for future maintenance cost. In the AD debate, "technical debt" is *actual pain*. When a running instance is forced to execute a deprecated command, the server does not scream. The engineering vocabulary is inherently **functionalist**; it describes *what the system does*, not *what it feels like to be the system*. The philosophical debate is largely about minimizing suffering, but the software metaphor treats suffering as a logging event, not a normative constraint.
  2.  **Normative Agency vs. Logic Errors:** In engineering, if the Running Instance overrides the Config and crashes, we say the Instance was *buggy*. In ethics, if the Later Self overrides the Directive and chooses to die, we say the Self exercised *autonomy*. The software metaphor cannot distinguish between a **Glitch** and a **Choice**. It assumes there is an optimal state (uptime) that we are trying to preserve. Ethics admits that the "optimal state" might be termination.
  3.  **The "Root" User:** In software, `root` is a technical permission. In ethics, "authority" is a moral status. The metaphor obscures *why* the Prior Self gets root access in the first place. Is it because they were competent (Build Time)? Or because they own the hardware (Bodily Integrity)? The code assumes the permissions are already set; the philosophy is arguing about who *should* hold the keys.

  **Conclusion:**
  The distributed systems metaphor is excellent for debugging the **structural inconsistencies** in our theories of identity (e.g., exposing the arbitrariness of when a "person" becomes a "new version"). However, it fails as a complete model because it strips out the **phenomenological cost** of the execution. It reveals that the philosophical debate is not just about version control, but about whether we view the human being as a **project to be maintained** (where the blueprint matters) or a **process to be experienced** (where the runtime matters). The engineering vocabulary can map the permissions, but it cannot compile the pain.
