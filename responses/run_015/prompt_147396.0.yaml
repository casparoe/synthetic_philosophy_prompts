answer: |-
  # The Adaptive Consent Decision Procedure (ACDP)
  **Time Limit:** 20 Minutes | **Reviewer:** Single Clinician-Ethicist
  **Purpose:** To evaluate consent validity in dynamic/adaptive trials where risk profiles update in real-time.
  **Judgments:** `VALID`, `INVALID`, `VALID WITH CONDITIONS`

  ---

  ## Phase 1: Domain-Specific Competence (5 Minutes)
  *Focus: Does the participant understand that risk is not static?*

  **Q1.1: The Updating Mechanism**
  Does the consent script explicitly state that risk probabilities are **not fixed** and will be recalculated by an algorithm during the study?
  *   **Sufficient Answer:** Yes, the text specifies frequency (e.g., "weekly") and trigger (e.g., "new lab data").
  *   **Negative Stop:** **INVALID**. (Fundamental deception regarding the nature of the intervention).

  **Q1.2: The Teach-Back Requirement**
  Does the protocol mandate a **specific teach-back assessment** regarding probabilistic updating (e.g., "Please explain in your own words what might happen to your risk score next week")?
  *   **Sufficient Answer:** Yes, a specific script exists for dynamic risk, distinct from standard capacity checks (orientation x3).
  *   **Negative Stop:** **VALID WITH CONDITIONS**. (Condition: Implement dynamic teach-back before enrollment).
  *   **Proceed if:** Yes.

  > **⚠️ Value/Fact Handoff:** This step assumes that *understanding volatility* is morally required for consent. A utilitarian might argue that if the treatment is beneficial, understanding the math is unnecessary. The procedure treats understanding as a deontological requirement.

  ## Phase 2: Structural Coercion (5 Minutes)
  *Focus: Is access to care weaponized to ensure retention?*

  **Q2.1: Continuity of Care**
  If a participant withdraws, do they retain access to the **standard of care** they would have received outside the trial, including any specialized monitoring the algorithm provides?
  *   **Sufficient Answer:** Yes, withdrawal does not penalize access to clinical care or monitoring tools.
  *   **Negative Stop:** **INVALID**. (This constitutes structural coercion; care cannot be contingent on research retention).

  **Q2.2: Post-Study Benefits**
  Are post-study benefits (e.g., continued specialty care, access to the algorithm) **decoupled** from the duration of enrollment?
  *   **Sufficient Answer:** Yes, benefits are guaranteed regardless of early withdrawal.
  *   **Negative Stop:** **VALID WITH CONDITIONS**. (Condition: Decouple benefits from retention timelines).
  *   **Proceed if:** Yes.

  ## Phase 3: Deception & Framing of Uncertainty (7 Minutes)
  *Focus: Is the evolving uncertainty hidden or manipulatively framed?*

  **Q3.1: Transparency of Volatility**
  Does the consent form disclose the **range of potential volatility** in the risk scores (e.g., "Your risk score may swing from 5% to 40% based on algorithm updates")?
  *   **Sufficient Answer:** Yes, historical data or simulation ranges are provided.
  *   **Negative Stop:** **VALID WITH CONDITIONS**. (Condition: Disclose maximum observed volatility in lay terms).

  **Q3.2: Risk Metrics**
  Are risk probabilities presented in **Absolute Risk** terms (e.g., "2 in 100") rather than solely **Relative Risk** (e.g., "50% reduction")?
  *   **Sufficient Answer:** Yes, Absolute Risk is primary; Relative Risk is secondary or absent.
  *   **Negative Stop:** **VALID WITH CONDITIONS**. (Condition: Reframe to Absolute Risk).
  *   **Note:** If Absolute Risk is present but contextually minimized, proceed to Q3.3.

  **Q3.3: The "Black Box" Clause**
  If the algorithm's weights are proprietary, does the consent form explicitly state **what is hidden** and **why** (e.g., "We cannot show the formula, but we can show you the output")?
  *   **Sufficient Answer:** Yes, the limitation is disclosed as a limitation.
  *   **Negative Stop:** **VALID WITH CONDITIONS**. (Condition: Add disclosure regarding proprietary limitations).
  *   **Proceed if:** Yes.

  ## Phase 4: The Value Handoff (3 Minutes)
  *Focus: Where the checklist ends and judgment begins.*

  **Q4.1: The Framing Intuition Check**
  Even if Q3.1–Q3.3 are passed, does the overall narrative of the consent form **minimize the anxiety** of living with updating risk to a degree that feels patronizing or manipulative?
  *   **Action:** If **Yes**, override previous judgments to **VALID WITH CONDITIONS** (Condition: Revise tone to reflect genuine uncertainty).
  *   **Action:** If **No**, proceed to Final Judgment.

  > **⚠️ Procedural Misfire Warning:** Q4.1 is not objective. It relies entirely on the reviewer's sensitivity to "therapeutic misconception" and linguistic framing. Two reviewers may reach different conclusions here. This is where the procedure admits it cannot algorithmically detect *manipulation* that stays within the bounds of *truth*.

  ---

  # Application to Protocols

  ## Case 1: The Cancer "Black Box" Monitoring Study
  **Protocol:** Patients consent to "adaptive risk tracking." The algorithm updates weekly. Patients do not see feature weights or update logic.
  **Checklist Path:**
  *   **Q1.1 (Updating):** Pass. Protocol states risks update weekly.
  *   **Q1.2 (Teach-Back):** Fail. Protocol uses standard capacity check, not dynamic teach-back. → *Condition Added.*
  *   **Q2.1 (Care Access):** Pass. Withdrawal does not affect standard oncology care.
  *   **Q3.1 (Volatility):** Fail. No range of score volatility provided. → *Condition Added.*
  *   **Q3.3 (Black Box):** Fail. Consent implies full transparency but omits proprietary limits. → *Condition Added.*
  *   **Q4.1 (Intuition):** Pass. Tone is clinical.

  **Final Judgment:** **VALID WITH CONDITIONS**
  **Conditions:** 1) Implement teach-back on probabilistic updating. 2) Disclose historical range of risk score volatility. 3) Explicitly state that algorithm weights are proprietary and explain the implication of that opacity.
  **Comment:** The procedure successfully identifies that "adaptive" requires more than static consent. It treats the "Black Box" not as a dealbreaker (Invalid) but as a disclosure requirement (Condition), balancing innovation with transparency.

  ## Case 2: The Contingent Care Trial
  **Protocol:** Trial offers free post-study specialty care and algorithm monitoring, *contingent on enrollment and retention* for 12 months.
  **Checklist Path:**
  *   **Q1.1 (Updating):** Pass.
  *   **Q1.2 (Teach-Back):** Pass.
  *   **Q2.1 (Care Access):** **FAIL**. Access to specialized monitoring is lost upon withdrawal.
  *   **Stop Rule:** **INVALID**.

  **Final Judgment:** **INVALID**
  **Comment:** The procedure halts immediately at Q2.1. This operationalizes the distinction between *inducement* (offer of benefit) and *coercion* (threat of loss). Because the protocol structures the benefit as a penalty for withdrawal, it creates structural coercion. No amount of reframing (Phase 3) can fix this; the structure itself is the violation.

  ## Case 3: The "Nudge" Protocol (Transparent but Biased)
  **Protocol:** Technically transparent. Full disclosure of probabilities. No access conditions. Adequate cognitive screening. However, risks are framed using **Relative Risk** metrics (e.g., "50% reduction in progression") where Absolute Risk is negligible (0.02% to 0.01%), exploiting known cognitive biases to encourage enrollment.
  **Checklist Path:**
  *   **Q1.1 & Q1.2 (Competence):** Pass. Dynamic nature is disclosed and tested.
  *   **Q2.1 & Q2.2 (Coercion):** Pass. No structural pressure.
  *   **Q3.1 (Volatility):** Pass. Ranges are disclosed.
  *   **Q3.2 (Risk Metrics):** **FAIL/Mitigated**. Protocol uses Relative Risk primarily.
      *   *Procedure Rule:* Triggers **VALID WITH CONDITIONS** (Condition: Add Absolute Risk).
      *   *Scenario Adjustment:* Assume the protocol *adds* Absolute Risk in fine print to satisfy the checklist technically, but highlights Relative Risk in bold headers.
      *   *Re-evaluated Q3.2:* Pass (Technically compliant).
  *   **Q4.1 (Intuition Check):** **FAIL**. The reviewer feels the framing is manipulative.
      *   *Procedure Rule:* Override to **VALID WITH CONDITIONS**.

  **Final Judgment:** **VALID WITH CONDITIONS** (Driven by Q4.1 Override)
  **Comment:** Without the Q4.1 override, this protocol would have returned **VALID**. The checklist captures the *facts* of disclosure but struggles with the *moral weight* of emphasis. The procedure relies on the reviewer's intuition at Q4.1 to catch what the objective metrics missed. If the reviewer is fatigued or less sensitive to framing effects, this protocol slips through as **VALID**.

  ---

  # Limitations: What the Procedure Cannot Settle

  This procedure operationalizes deception, coercion, and competence for efficiency, but it leaves a **moral residue** in three specific areas where human judgment must supersede the checklist:

  1.  **The "Truthful Manipulation" Problem:** As seen in Case 3, a protocol can be factually accurate (transparent) yet morally manipulative (framing). The checklist treats disclosure as a binary (Present/Absent), but the *salience* of information is a matter of degree. The procedure cannot quantify whether placing Absolute Risk in a footnote vs. a header constitutes deception. This remains a value judgment disguised as Q4.1.
  2.  **The Epistemic Gap in Adaptive Algorithms:** In Case 1, we conditioned on disclosing "volatility." However, in highly complex adaptive trials, *even the researchers* may not know the full range of algorithmic volatility until the study is underway. The procedure demands disclosure of facts that may not yet exist, forcing researchers to speculate. The procedure cannot resolve the ethics of consenting to *unknown unknowns* generated by AI.
  3.  **The Threshold of Competence:** Phase 1 requires a "domain-specific" teach-back. However, there is no consensus on the minimum literacy required to understand Bayesian updating. The procedure assumes *any* understanding is better than *none*, but it cannot determine if a patient's understanding is *sufficient* for the magnitude of the risk. A patient might understand "the number changes" without understanding "the number determines my life expectancy."

  **Conclusion:** The ACDP is a triage tool, not a moral arbiter. It efficiently filters out blatant coercion and static consent in dynamic trials. However, when transparency is technically satisfied but the *spirit* of autonomy is undermined by sophisticated framing, the procedure relies entirely on the reviewer's willingness to invoke Q4.1. Where the checklist ends, the ethicist's responsibility begins.
