answer: |-
  1. What the procedure is for

  This procedure translates Adam Smith's method of moral judgment into a workflow for volunteer appeal reviewers. It is designed to fit within a twenty-five-minute review window and requires no philosophical training. Its purpose is to separate the question of whether a member's feeling was understandable from the question of whether their action deserves punishment. It forces you to strip away manipulated details before judging, and it checks whether your decision changes based on who involved has higher standing. It does not decide what the rules should be; it decides whether the sanction fits the act under the rules as they stand.

  2. The procedure

  1. **Strip the Stage.** Remove all information from the appeal packet that does not describe the act itself or the immediate trigger. Delete names, join dates, post counts, references to personal hardship, private apologies, and character testimonials. Keep only the quoted posts, the rule cited, and the moderator's factual note.
     *   **Sufficient answer:** You are left with only the interaction and the rule break.
     *   **Stop-with-a-no:** If removing this information leaves no context for why the act happened, flag the case as "Insufficient Evidence" and stop.
     *   [This isolates the impartial spectator from the corruption of sympathy by rank and from manipulated narratives.]

  2. **Test Propriety.** Imagine yourself as a neutral member reading the trigger post. Ask: Is the member's emotional reaction proportionate to what they read? Could a calm person feel similarly, even if they acted differently?
     *   **Sufficient answer:** You can confirm the feeling was natural or unnatural regardless of the action taken.
     *   **Stop-with-a-no:** If you cannot determine the trigger's content from the logs, flag as "Insufficient Evidence" and stop.
     *   [This judges the propriety of the sentiment, separating the feeling from the subsequent action.]

  3. **Test Merit.** Ask: Regardless of the feeling, does the specific action taken damage the community's order enough to warrant a sanction under the written rules? Ignore whether the member is sorry now; look only at the act's impact at the time.
     *   **Sufficient answer:** You can decide if the act harms the forum's function independently of the member's intent.
     *   **Stop-with-a-no:** If the rule cited is too vague to determine harm, flag as "Procedural Error" and send to the board.
     *   [This judges the merit or demerit of the action, distinguishing desert from the propriety of the sentiment.]

  4. **The Standing Swap.** Imagine the exact same act occurred, but swap the roles: if a veteran did it to a newcomer, imagine a newcomer doing it to a veteran. Would you recommend the same sanction?
     *   **Sufficient answer:** Your recommended sanction remains identical regardless of who held the power or status.
     *   **Stop-with-a-no:** If your decision changes when you swap their statuses, you must recuse yourself from this case.
     *   [This corrects for the natural human bias to admire rank and sympathize more with the powerful.]

  5. **Assign Disposition.** Map your findings to the four options. If Propriety failed and Merit failed: Uphold. If Propriety failed but Merit is mitigated: Reduce. If Propriety passed and Merit passed: Overturn. If Propriety passed but Merit failed (technical breach): Uphold with Note.
     *   **Sufficient answer:** A clear selection of one of the four dispositions based on the previous steps.
     *   **Stop-with-a-no:** If the findings contradict (e.g., Propriety passed but Merit is unclear), return to Step 3.
     *   [This aligns the final judgment with the distinct findings of sentiment and action.]

  3. The staged-spectator test

  This test is Step 1 of the procedure. Smith warns that we sympathize too easily with those who present a story well or hold high status. In an appeal, both sides curate the evidence to make you feel for them. To fix this, you must physically or digitally redact the "stage." Do not read the apology letter. Do not look at the profile signature showing ten years of membership. Do not consider the mother in the hospital. These are real facts, but they are not facts about the propriety of the act at the time it occurred. If you find yourself thinking "he is usually a good guy," you have failed this step. You are judging the person, not the spectator's view of the act. Only when the packet looks boring and anonymous are you ready to judge. This prevents the "withering reply" from being softened by the "hard-luck story."

  4. Three appeals

  **Case one.**
  Step 1 removes the mother's hospitalization and the private apology. We are left with a veteran posting a withering reply to a newcomer's first project. Step 2 asks if the feeling was proportionate. A newbie's project rarely warrants withering criticism; the sentiment is disproportionate. Propriety fails. Step 3 asks if the act damages the community. Driving away a new member harms growth. Merit fails. Step 4 checks standing. If a newbie wrote this to a veteran, they would be banned instantly. The veteran status is biasing you. Step 5 maps this: Propriety failed, Merit failed. The disposition is **Uphold**. You are wrong to overturn because you are sympathizing with the member's hardship rather than judging the act's propriety. The apology is post-hoc and does not fix the initial impropriety.

  **Case two.**
  Step 1 strips the names, leaving two contradictory accounts of a threat. Step 2 asks for the trigger. The logs are partial and five months old. We cannot know what was said initially. We cannot test propriety without the full context of the exchange. Step 1's stop condition is met: removing the unverified claims leaves no context. We cannot imagine the spectator's view because the scene is incomplete. The procedure hits the "Stop-with-a-no" at Step 2. The disposition is **Insufficient Evidence**. You cannot judge merit or propriety on he-said-she-said. The honest answer is to stop, as you suspected. To decide otherwise is to guess, not judge.

  **Case three.**
  Step 1 removes the fact that the offender was banned later. We see a public denunciation in a general thread. Step 2 asks if the anger was proportionate. The original remark was genuinely offensive. The anger is proper. Propriety passes. Step 3 asks if the action damages order. Public denunciations in general threads break rules against personal attacks, regardless of truth. The act harms the thread's function. Merit fails. Step 4 confirms a newbie doing this would be suspended. Step 5 maps this: Propriety passed, Merit failed. The disposition is **Uphold**. You are committing the second confusion: you think proper sentiment excuses the action. Smith says you can be right to be angry but wrong to act publicly. The sanction stands.

  5. What had to be dropped

  To make this usable in twenty-five minutes, I flattened Smith's distinction between the "internal man" and the "external man." Smith spends much time on how we judge ourselves versus how others judge us. This procedure only handles external judgment. We lose the ability to guide the member toward conscience; we only decide on punishment. I also dropped the nuance of intention. Smith cares deeply about whether harm was intended or accidental. Here, we treat the act's impact as primary because volunteers cannot reliably psychoanalyze intent from text logs. We assume the act speaks for the intent. This makes the procedure colder than Smith's full theory. We sacrifice the deep moral education of the agent for the consistency of the community's rules. You get a verdict, not a lesson.

  6. Where it hands off, and what it cannot do

  This procedure cannot decide what the rules should be. If a rule is unjust, this process will still uphold sanctions for breaking it. That question belongs to the board. It also cannot fix missing evidence. If the logs are gone, the procedure stops; it cannot conjure facts. It will misfire if the community's values shift faster than the rules. For example, if a new norm accepts public denunciations, but the rule forbids them, this procedure will uphold sanctions that feel wrong to the community. It relies on the rules being clear enough for Step 3. Finally, it cannot force a reviewer to be honest in Step 4. If a reviewer lies about whether they would swap the sanction, the procedure cannot catch them. It relies on your integrity to run the swap test truly.
