answer: |-
  **Note on Framing**

  Your suspicion is well-founded. Defining pure time preference as the residual remaining after accounting for risk and growth makes the claim "it ought to be zero" analytically true only if one assumes all discounting *must* be justified by those factors. The ethical work lies not in the decomposition itself, but in arguing why temporal position alone lacks moral significance. Treating it as merely a residual risks begging the question against those who believe time itself matters. The question below frames this as a justificatory burden rather than a definitional cleanup.

  ***

  **Final Assessment: Long-Horizon Technical Decisions**

  **Time Limit:** 30 Minutes
  **Format:** Closed-book Essay
  **Total Marks:** 20

  **Question**

  Your team proposes a infrastructure migration costing $1M today to secure a benefit valued at $1M in ten years. You use a constant, time-consistent discount rate of 5% per annum to evaluate this. At this rate, the future benefit is worth only $610k today, so the project is rejected.

  Write an essay critiquing or defending this discount rate. You must address the following five points:

  1.  **Decomposition:** A 5% rate might mix genuine impatience, the risk the project fails, and the expectation that future engineers will be richer. Identify these components. Which one carries the moral weight?
  2.  **Diagnostic:** If the 5% reflects a 5% annual risk of cancellation, how should you value the benefit *conditional* on the project surviving? Should your valuation jump if you learn the project is safe?
  3.  **Double Counting:** Suppose spending the $1M now reduces the risk of future failure. If you discount the future benefit for risk, do you also discount the value of that risk reduction? Explain the correct treatment.
  4.  **Normative Defense:** Imagine a closed system with no growth and no extinction risk. Is preferring benefits now solely because they are earlier morally defensible? Compare temporal distance to spatial distance. Distinguish between benefits to the same person over time versus different people.
  5.  **Scale:** What does a constant positive rate imply for benefits occurring one hundred years out? Is this a reductio ad absurdum or an acceptable cost?

  **Requirement:** You must take a clear stand on whether the 5% rate is justified. Answers that merely survey considerations without concluding will not pass.

  **Expected Length:** 500–800 words.

  ***

  **Model Answer**

  The use of a 5% discount rate requires rigorous justification, as it effectively vetoed a project with equal nominal cost and benefit. To defend this, we must decompose the rate into its constituent parts: pure time preference, extinction risk, and marginal utility growth. Pure time preference is a raw valuation of the present over the future. Extinction risk accounts for the chance the project or organization ceases to exist. Growth adjustments reflect the expectation that future resources are less valuable because future engineers will be wealthier. Only pure time preference carries direct moral weight regarding temporal impartiality; the others are empirical adjustments.

  Distinguishing risk from preference is critical. If the 5% rate is entirely due to a 5% annual chance of cancellation, the valuation method changes. We should not discount the value of the benefit itself based on probability; rather, we should discount the *probability* of receiving the benefit. If we learn tomorrow that the project is guaranteed to survive, the value of the future benefit should jump to its full nominal amount, discounted only for pure time preference. If the valuation remains low despite guaranteed survival, the discount reflects genuine impatience, not risk. Confusing these leads to erroneous decisions where safe long-term projects are rejected because they were modeled as risky.

  Double counting arises when the investment itself mitigates the risk used to justify discounting. If spending $1M now lowers the chance of future failure, we cannot simultaneously discount the future benefit for that risk and claim the spending is valuable because it reduces that same risk. This counts the risk reduction twice: once as a reason to devalue the future, and once as a reason to spend now. The correct treatment is to separate the discount rate from the risk model. Use a risk-free rate to value the future benefit, and model the risk reduction as a separate probability adjustment in the expected value calculation. This ensures the investment is judged on its ability to secure value, not on an arbitrary penalty applied to that value.

  The hardest question is normative. In a closed system with no growth and no risk, does temporal position matter? Preferring benefits now solely because they are earlier implies that time itself diminishes value. This is hard to defend. Spatial distance does not diminish the moral weight of a stranger's suffering; a person suffering one mile away matters as much as a person suffering one thousand miles away. Temporal distance should be analogous. A future engineer's productivity matters as much as a current engineer's. However, objections exist. Time is traversed; we anticipate the future but remember the past. Within a single life, preferring good years early might be a preference about the shape of a life, not pure time preference. But between different people, such as current versus future teams, there is no psychological connection to justify bias. Pure time preference between different generations is morally arbitrary.

  Finally, scale sensitivity reveals the danger of constant positive rates. At 5%, a benefit one hundred years out is worth less than one percent of its nominal value. This drives the weight of the far future to nearly nothing. If we care about the long-term survival of our systems or organization, this is unacceptable. It implies that preventing a catastrophic failure in a century is worth almost no investment today. This is a reductio ad absurdum for any entity claiming to care about longevity. A nonzero pure time preference is incompatible with genuine long-term stewardship.

  Therefore, the 5% rate is unjustified. It likely conflates risk with impatience and double-counts risk mitigation. Morally, pure time preference should be zero. The discount rate should reflect only empirical risks and growth, not a bias against the future.

  ***

  **Marking Scheme (20 Marks)**

  **1. Decomposition (4 Marks)**
  *   **4:** Identifies all three components (preference, risk, growth) and isolates pure time preference as the only normative component.
  *   **2:** Identifies components but fails to distinguish empirical vs. normative weight.
  *   **0:** Treats the rate as a single monolithic number or recites a formula without explanation.

  **2. Diagnostic Test (4 Marks)**
  *   **4:** Explains that conditional on survival, risk-based discounting should vanish (valuation jumps). Distinguishes discounting value vs. discounting probability.
  *   **2:** Notes the distinction but is unclear on whether valuation changes upon learning survival.
  *   **0:** Claims the rate stays the same regardless of survival certainty.

  **3. Double Counting (4 Marks)**
  *   **4:** Identifies that discounting the benefit for risk while valuing risk reduction counts the risk twice. Proposes separating risk modeling from discounting.
  *   **2:** Identifies double counting but offers no correct treatment.
  *   **0:** Denies double counting is possible or suggests applying the rate to both is fine.

  **4. Normative Defense (4 Marks)**
  *   **4:** Compares temporal to spatial distance. Distinguishes same-person (shape of life) vs. different-person (impartiality) cases. Argues pure time preference is arbitrary between generations.
  *   **2:** Makes the spatial comparison but ignores the same/different person distinction.
  *   **0:** Asserts "time is money" or "impatience is natural" without moral argument.

  **5. Scale Sensitivity (2 Marks)**
  *   **2:** Notes that constant rates vanish the far future and identifies this as a problem for long-term stewardship.
  *   **0:** Ignores the long-term implication.

  **6. Stand and Coherence (2 Marks)**
  *   **2:** Takes a clear position (justify or reject) consistent with the arguments made.
  *   **0:** Hedges, concludes "it depends" without resolving, or contradicts earlier arguments.

  **Zero Score Conditions:**
  *   Simply asserting discounting is obviously irrational or obviously fine.
  *   Conflating a discount on value with a discount on probability.
  *   Using external philosophical labels not defined in the text.

  ***

  **Grade Boundary Note**

  **First-Class (17–20 marks):** The answer takes a definitive stand and integrates all five points into a coherent argument. The diagnostic test is explained clearly (valuation jumps on survival), and the normative section explicitly handles the same-person vs. different-person distinction.

  **Upper-Second (14–16 marks):** The answer identifies the key issues but may hedge on the final stand or miss the nuance in the normative section (e.g., treating all time preference as identical regardless of beneficiaries). The double-counting argument is present but the solution is vague.
