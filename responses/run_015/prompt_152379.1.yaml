answer: |-
  ### Session Plan: The Fractured Subject (50 Minutes)

  **Objective:** To use commissurotomy data not as proof of "two minds," but as a wedge to separate *Phenomenal Unity* (what it is like to be the subject) from *Access Unity* (functional availability of information for report and control), thereby exposing the fragility of the concept of "the subject."

  **Prerequisites:** Familiarity with Descartes (substance dualism/indivisibility of the soul) and Locke (consciousness as the basis of personal identity).

  ---

  ### I. Conceptual Dependency: Defining Unity (00:00 – 00:10)

  **Goal:** Secure the distinction between Phenomenal and Access Unity *before* introducing the patient. Prevent the "Cartesian Theater" from forming.

  1.  **The Lockean Setup (5 mins):**
      *   Remind students of Locke's view: Personal identity follows consciousness. If I remember it, it is mine.
      *   **Introduce the Distinction:**
          *   **Access Unity:** The functional capacity to take any piece of information (sight, sound, memory) and use it for reasoning, speech, or deliberate action. (The "Global Workspace").
          *   **Phenomenal Unity:** The subjective fact that all current experiences seem to belong to a single "locus" of feeling. (The "What It Is Like").
      *   **The Dependency:** Normally, we assume these travel together. If I can report it (Access), I feel it (Phenomenal). If I feel it, I can report it.
      *   **Intercepting Misconception #1 (The Cartesian Theater):**
          *   *Risk:* Students imagine consciousness as a literal screen in the head where images are projected for a viewer.
          *   *Interception:* Explicitly state: "Do not imagine a little man watching a screen. 'Phenomenal Unity' is not a place where data meets; it is a structural property of the experience itself. We are looking for the *conditions* under which we are willing to say 'one subject' exists."

  2.  **The Stress Test (5 mins):**
      *   Pose the question: "If Access Unity breaks (I cannot report what I see), must Phenomenal Unity break (I do not experience what I see)?"
      *   Tell them we will test this using a patient whose hemispheres cannot talk to each other, but whose brain is still one biological organism.

  ---

  ### II. The Concrete Scenario: The Bilateral Ambiguity (00:10 – 00:25)

  **Goal:** Present a single scenario that forces incompatible outputs from identical inputs without invoking "two people."

  **The Scenario:**
  A commissurotomy patient sits before a screen. An **ambiguous figure** (e.g., the Duck/Rabbit illusion) is flashed **simultaneously to both the Left and Right Visual Fields**.
  *   **Stimulus Property (Possess):** *Identical Input.* Both hemispheres receive the exact same pixel data at the same time.
  *   **Stimulus Property (Possess):** *Interpretive Ambiguity.* The image supports two mutually exclusive conceptualizations (Duck vs. Rabbit).
  *   **Stimulus Property (Lack):** *Lateralized Secret Information.* Unlike standard split-brain tasks (where LH sees 'X' and RH sees 'Y'), here both sides see the *same* thing. There is no "hidden knowledge" one side has that the other lacks.
  *   **Stimulus Property (Lack):** *Emotional Valence.* The image is neutral. This prevents students from arguing that the Right Hemisphere is a "feeling twin" and the Left is a "logic twin."

  **The Data:**
  1.  **Left Hemisphere (Speech):** When asked "What did you see?", the patient says, "A Duck."
  2.  **Right Hemisphere (Left Hand Pointing):** When asked to point to a matching picture from a array using the left hand, the hand points decisively to a "Rabbit."

  **The Argument:**
  *   Both hemispheres processed the *same* stimulus.
  *   Both generated a *coherent* interpretation.
  *   The interpretations are *incompatible* (It cannot be both a Duck and a Rabbit simultaneously in the same respect).
  *   **Crucial Question:** Did *one* subject see an ambiguous image and hesitate? Or did the system fracture into two interpretive streams?

  ---

  ### III. Mapping and Intercepting Misconceptions (00:25 – 00:40)

  **Goal:** Prevent the collapse of the argument into pop-science dualism.

  1.  **Misconception #2: The "Hidden Twin" Ontology (00:25 – 00:32)**
      *   *The Error:* Students will infer: "The Right Hemisphere is a silent person trapped inside." This treats the Right Hemisphere as a full Cartesian *res cogitans*.
      *   *The Interception:* Halt this inference immediately.
      *   *Correction:* "Do not reify the hemisphere. The Right Hemisphere is not a 'person'; it is a *processing system* capable of guiding action without speech. If we call it a 'second subject,' we are smuggling in a soul where we only have a motor output. The question is not 'Are there two people?' but 'Is there one subject with fractured access?'"
      *   *Philosophical Lever:* Use Descartes against them. Descartes argued the mind is indivisible. If the mind is the "thinking thing," and the thinking thing is now producing contradictory reports from identical data, is the *mind* divisible, or is our definition of "mind" wrong?

  2.  **Misconception #3: Access Exhausts Phenomenality (00:32 – 00:40)**
      *   *The Error:* "If the Left Hemisphere (speech) says 'Duck,' that is the only reality. The Right Hemisphere's pointing is just a reflex." (Collapse Phenomenal into Access).
      *   *The Interception:* Challenge the authority of speech.
      *   *Correction:* "Why privilege speech? If the Left Hand (controlled by RH) fights the Right Hand to point to the Rabbit, is that not evidence of a competing *intention*? If there is intention, is there not phenomenology?"
      *   *The Pivot:* This is where the distinction matters.
          *   If **Access Unity** is required for **Phenomenal Unity**: Then there is only one subject (the speaking one), and the pointing is unconscious machinery.
          *   If **Phenomenal Unity** can exist without **Access Unity**: Then there may be a non-verbal experience (the Rabbit) that exists phenomenally but is inaccessible to the reporting self.
      *   *Result:* The concept of "The Subject" becomes unstable. It is no longer a binary (One vs. Two), but a gradient of integration.

  ---

  ### IV. Closing Check & Delimitations (00:40 – 00:50)

  **Goal:** Verify understanding of the distinction and define the boundaries of the session.

  1.  **The Closing Check: "The Silent Scream" (00:40 – 00:45)**
      *   *Prompt:* "Imagine we stimulate the Right Hemisphere's pain centers directly. The patient does not wince. The patient says 'I feel no pain.' But the Left Hand pulls away violently and protects the body."
      *   *Question:* "Does the *subject* suffer?"
      *   *Correct Response (Indicates Understanding):* "We cannot answer 'yes' or 'no' without deciding if suffering requires *Access* (reporting/behavioral integration) or only *Phenomenality* (raw feeling). If suffering is phenomenal, the subject suffers but cannot know it. If suffering requires access, no one suffers."
      *   *Incorrect Response (Indicates Failure):* "There are two people, so one suffers and one doesn't." (This retreats to the "Hidden Twin" ontology we explicitly barred).

  2.  **Deliberate Omissions (00:45 – 00:50)**
      *   State explicitly what we are **not** doing, to preserve the conceptual architecture:
          *   **We are not discussing Surgical Anatomy:** We will not detail *how* the corpus callosum is cut (stages of commissurotomy) or distinguish between anterior and posterior commissures. This is medical detail that distracts from the metaphysical problem of unity.
          *   **We are not classifying Fiber Types:** We will not discuss ipsilateral vs. contralateral pathways. This invites the "mechanical fix" fallacy (i.e., "if we just wire it back, the person returns").
          *   **Why:** Explaining the *mechanism* of disconnection suggests the *person* is merely the sum of connections. We are investigating whether the *concept of the person* survives the disconnection. Keeping the anatomy vague forces you to grapple with the *logic of subjecthood*, not the biology of the brain.

  **Final Takeaway:** "The split-brain patient does not prove there are two minds. It proves that our ordinary concept of 'one mind' relies on the accidental coincidence of Phenomenal and Access Unity. When they come apart, the 'Subject' does not split; our definition of it dissolves."
