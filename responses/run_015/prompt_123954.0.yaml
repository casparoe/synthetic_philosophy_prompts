answer: |-
  ### The Principle: Causal-Functional Continuity (CFC)

  Based on the coherence of your verdicts, the principle actually doing the work in your committee is not about biological substrate, nor about the uninterrupted stream of consciousness, nor about the preservation of matter. It is about the preservation of **causal authority** over mental states, subject to a **non-branching constraint**.

  I propose we formalize your intuitions into the **Principle of Causal-Functional Continuity (CFC)**. It has three clauses:

  1.  **The Functionalist Clause:** Personal identity follows the realization of the functional organization that generates psychology, not the specific physical substrate realizing it.
      *   *Motivation:* This is forced by **Case (5)** (the synthetic survivor is you, not the vitrified brain) and **Case (6)** (you are the active network, not the idle biological neurons). You have already decided that matter is a vessel, not the passenger.
  2.  **The Non-Branching Clause:** Identity cannot divide. If a single prior psychology gives rise to multiple subsequent psychologies with equal claim, the original identity ceases; neither successor is the original.
      *   *Motivation:* This is forced by **Case (4)**. You reject the "copy" scenario because uniqueness is a necessary condition for survival. You cannot be two people.
  3.  **The Continuity Clause:** Psychological continuity must be maintained via a causal chain. Interruptions in consciousness are permissible provided the causal chain of memory and character is preserved upon resumption.
      *   *Motivation:* This is forced by **Case (3)**. You accept survival across a gap of unconsciousness (anaesthetic) because the causal chain is restored. It is also supported by **Case (1)**, where continuity is maintained gradually.

  ### Application to Unsettled Cases

  Applying CFC to your three open questions yields the following verdicts:

  **(a) The Converging Patients (Fusion):**
  Two patients undergo the slow protocol, but their synthetic units are tuned until they run identical psychology on two networks.
  *   **Verdict:** **Death for both.**
  *   **Reasoning:** This violates the **Non-Branching Clause** in reverse (fusion). If one psychology runs on two networks, you have a many-to-one mapping. If the networks are distinct physical entities, you have two candidates for one identity. CFC dictates that where uniqueness fails, identity fails. Neither is the original; they are new entities with shared pasts.

  **(b) The Dreamless Decade:**
  Slow protocol over ten years, but the patient is in an unresponsive dreamless state throughout.
  *   **Verdict:** **Survival.**
  *   **Reasoning:** This falls under the **Continuity Clause**. You already accept **Case (3)** (anaesthetic gap). The duration of the gap is ethically relevant only insofar as it degrades the psychological connection (memory/character). If the functional organization is preserved such that upon waking the patient remembers the pre-op state and retains their temperament, the gap is irrelevant. The substrate swap happening during the gap is protected by the **Functionalist Clause**.

  **(c) The Running Copy:**
  A functional copy runs for a year while the biological patient lives; then the biological patient dies, and the copy continues.
  *   **Verdict:** **Death.**
  *   **Reasoning:** This is a variant of **Case (4)**. At the moment the copy is activated, branching occurs. There are now two distinct causal chains. The subsequent death of the biological original does not retroactively validate the copy's identity. The copy is a survivor, a successor, but not *you*. The existence of the simultaneous biological branch breaks the uniqueness required for identity.

  ### The Line Between (1) and (2)

  You ask where the line falls between the slow protocol (1) and the instant swap (2).

  **There is no metaphysical line.**
  If you accept **Case (6)** (that you are the functional network, not the biology) and **Case (3)** (that instant swaps are permissible during unconsciousness), then the rejection of **Case (2)** rests solely on the *rate of change during consciousness*.

  However, since you stipulate that in **Case (2)** "nothing changes in the patient's speech, memory, temperament or reported experience," there is no phenomenological difference between (1) and (2). The patient reports no break. The output is identical. The functional organization is identical.

  If there is no line, then **Case (2) is not death.** It is merely the limit of **Case (1)** as the rate of substitution approaches infinity. To insist there is a line is to succumb to a Sorites paradox where you claim a threshold exists but cannot define it. If you cannot specify the maximum neurons-per-second that constitutes "death," you cannot ethically enforce the distinction.

  **Pragmatic Recommendation:** For clinical safety, you may impose a speed limit to allow for error correction and monitoring. But metaphysically, if the functional continuity is perfect, the speed is irrelevant.

  ### The Cost: Which Verdicts Must Be Overturned

  To make your ethics coherent under CFC, you must pay a specific price. You cannot keep all your gut verdicts.

  **1. You must overturn Verdict (2).**
  *   **Current Verdict:** Instant swap while awake is death.
  *   **Required Verdict:** Instant swap while awake is **survival**.
  *   **Why:** Your acceptance of **Case (6)** proves you believe identity resides in the *causal role*, not the *biological matter*. Your acceptance of **Case (3)** proves you believe identity survives *instantaneous substrate changes* if consciousness is not monitoring them. In **Case (2)**, consciousness *is* monitoring, but you stipulate it *notices nothing*. If the experience is uninterrupted and the function is continuous, the speed of the substrate swap is metaphysically inert. To call (2) death is to privilege the *process* of replacement over the *result* of continuity, which contradicts your functionalism in (5) and (6).
  *   **Cost:** You lose the "sanctity of the slow process." You must acknowledge that the ten-year protocol is a safety measure, not an ontological requirement. This exposes the clinic to liability if an emergency instant-swap is performed and the family claims "that isn't my husband." You must be prepared to testify that it *is* him.

  **2. You must clarify Verdict (6).**
  *   **Current Verdict:** "I am the network."
  *   **Required Clarification:** You are the network *only because* it sustains your psychological continuity.
  *   **Why:** If the biological brain is left alive but disconnected, you have created a philosophical zombie (the biological brain) and a person (the synthetic network). Your verdict is correct, but the reasoning must be strict: the biological brain is no longer *you* because it no longer participates in the causal chain of your psychology. It is merely tissue.
  *   **Cost:** This creates a legal category of "living non-person tissue." If the biological brain is nourished and alive, does it have rights? Under CFC, no. It is an organ culture. This is a significant ethical burden to manage regarding the disposal or maintenance of the discarded tissue.

  **Summary:**
  Your intuition on **Case (2)** is the inconsistency. It is a "substrate fetish" that survives despite your functionalist verdicts on (5) and (6). If you are willing to say you are the network in (6), you must say you are the network in (2). The cost is accepting that **continuity of function is sufficient for survival, regardless of the speed of implementation.** If you cannot bear this cost, you must reject **Case (6)** as well, which would undermine the very therapy your committee oversees.
