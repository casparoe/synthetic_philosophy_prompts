answer: |-
  Based on the group's composition (philosophers + theoretical cognitive scientists), constraints (no empirical lab), and specific interest (distributed agency without shared representations), here is the recommended research agenda.

  ### Priority 1: The Viability and Structure of Fragmented Collective Intentionality (FCI)
  **Status:** Primary Focus (Year 1–2)
  **Role:** Establishing the possibility conditions for the group's entire research program.

  **Reasoning for Priority:**
  This is the linchpin. Your group's core constraint is coordination *without* fully shared mental representations. Standard accounts of joint action (Bratman, Searle, Gilbert) typically posit that some form of interlocking or shared intention is a necessary condition for *joint* action (as opposed to merely parallel individual action). If FCI is merely a special case of "failed" shared intention, your core premise collapses. If FCI is a distinct, stable mode of agency, it redefines the field.

  *   **Tractability:** This is highly tractable for your specific mix of scholars. It does not require behavioral experiments.
      *   *Philosophers* can perform conceptual analysis to distinguish "fragmentation" from "misunderstanding" or "deception."
      *   *Cognitive Scientists* can build formal models (e.g., using dynamical systems theory or partial information games) to demonstrate how stable coordination emerges from incompatible internal states.
  *   **Dependency:** High. The normative questions (Priority 2) depend on this. You cannot determine the obligations binding a collective if you cannot first define whether that collective constitutes a genuine agent or merely a causal system.
  *   **Upgrade/Downgrade Criteria:**
      *   *Upgrade:* If formal modeling demonstrates that fragmented representations increase robustness in noisy environments (e.g., the system works *better* because agents aren't trying to align mental states), FCI becomes a major theoretical contribution.
      *   *Downgrade:* If analysis shows that "fragmented" cases are actually instances of one party deferring to the other (hierarchical control) or merely coincidental parallel action, FCI is an illusion. The group should then pivot to studying *deception* or *heteronomy* in joint action.

  **Defense of FCI as Central (Not a Special Case):**
  You asked whether FCI is merely a special case of disagreement about shared intention. It is not.
  *   *Disagreement* typically implies a breakdown in coordination or a requirement for negotiation to resolve the conflict before action proceeds.
  *   *FCI* posits that coordination proceeds *because* of the fragmentation, not despite it.
  *   *Example:* In a human-AI medical team, the human intends "patient care" (relational), while the AI intends "protocol optimization" (instrumental). If they successfully coordinate, standard theory says they must share a "we-intention." FCI argues they do *not* share an intention, but their *interfaces* align. This is not a bug; it is the defining feature of human-non-human distributed agency. Making this central allows you to bypass the "do they really have a mind?" debate and focus on "does the system function as an agent?"

  ### Priority 2: The Normative Structure of Hybrid Commitment
  **Status:** Secondary Focus (Year 2–3)
  **Role:** Defining the binding forces in the absence of mutual authorization.

  **Reasoning for Priority:**
  Once you have established that fragmented coordination is possible (Priority 1), you must explain what holds it together. Margaret Gilbert's account of joint commitment relies on mutual recognition and authorization. In human-non-human settings, the non-human cannot "authorize" the commitment in the moral sense.

  *   **Tractability:** Purely conceptual and logical. It requires analyzing the conditions under which an agent can be bound by a norm they did not cognitively endorse. This fits the philosophers' strengths.
  *   **Dependency:** Moderate. It relies on Priority 1 to define the "collective," but it can be developed in parallel. It is upstream of any practical design recommendations regarding accountability.
  *   **Upgrade/Downgrade Criteria:**
      *   *Upgrade:* If the group can formulate a coherent account of "functional obligation" (where the obligation arises from the role in the system rather than mental assent) that survives counter-arguments about autonomy.
      *   *Downgrade:* If the analysis concludes that without mutual authorization, there are only *causal* expectations, not *normative* obligations. This would force a downgrade of the "agency" claim to a "mechanism" claim, significantly altering the social ontology deliverable.

  ### Deprioritized Lines of Work
  To ensure the agenda remains defended and focused, you should actively deprioritize the following, despite their prominence in the literature:

  1.  **The Metaphysics of Plural Subjects vs. Reducible We-Intentions:**
      *   *Why Deprioritize:* This is the "textbook debate" you wished to avoid. Whether the group is a distinct ontological entity (Gilbert) or a sum of individuals (Bratman) is often a verbal dispute that stalls progress.
      *   *Impact:* Resolving this does not change how distributed systems are designed. A system works the same way regardless of whether the "we" is metaphysically primitive.
      *   *Exception:* Only revisit this if Priority 1 (FCI) forces a new ontological category that existing frameworks cannot accommodate.

  2.  **The Empirical Necessity of Shared Attention:**
      *   *Why Deprioritize:* You noted uncertainty about whether resolving this changes downstream outcomes. For a group without a lab, trying to prove whether shared attention is *psychologically necessary* is a trap.
      *   *Impact:* Instead of asking "Is shared attention required?", subsume this under Priority 1. Ask "What functional role does attentional alignment play in FCI?" If external coordination mechanisms suffice (as your framing suggests), the metaphysical necessity of shared attention is irrelevant.
      *   *Criteria:* This fails the **Leverage** test. Knowing the answer doesn't help design better human-AI coordination protocols if the protocols work via external scaffolding regardless of internal attention.

  ### Criteria and Conflicts in Allocation

  I have used four criteria to allocate these priorities. Here is how they interact and where they conflict:

  1.  **Dependency:** (What must be solved first?)
      *   *Conflict:* Dependency suggests solving the Ontology (Plural Subjects) first. However, I have overridden this because that debate is stagnant. FCI is a *functional* dependency; you need to know how the coordination works before you label what it is.
  2.  **Tractability:** (Can this group do it without a lab?)
      *   *Conflict:* Empirical questions about shared attention are high-value but low-tractability for this group. FCI and Norms are high-tractability (conceptual/formal). I have prioritized Tractability to ensure deliverables within 3 years.
  3.  **Neglect:** (Is this fresh?)
      *   *Alignment:* FCI scores high here. The literature is saturated with "Shared Intention" but sparse on "Successful Coordination without Shared Intention." This maximizes the impact of the research agenda.
  4.  **Practical Leverage:** (Does this help design distributed systems?)
      *   *Alignment:* The Normative Structure question has high leverage for AI ethics and system design (accountability). The Ontology question has low leverage.

  **The Strategic Trade-off:**
  The primary conflict is between **Orthodoxy** (solving the classic debates first) and **Innovation** (skipping to the new problems).
  *   *Risk:* By deprioritizing the classic Ontology debate, critics may claim your definitions of "agency" are loose.
  *   *Mitigation:* Your deliverable must explicitly state that you are adopting a *functionalist* ontology for the sake of the project. You are not solving the metaphysics of the "We"; you are solving the mechanics of the "Us" in distributed systems.

  ### Summary of the 3-Year Arc
  *   **Year 1:** Define FCI. Distinguish it from error, deception, and parallel action. Produce a formal model showing stability conditions.
  *   **Year 2:** Analyze the Normative Structure of these fragmented collectives. Can obligation exist without mutual authorization?
  *   **Year 3:** Synthesize. Produce a "Design Philosophy for Distributed Agency" that tells engineers and ethicists how to build systems that leverage fragmentation rather than trying to force shared mental states.

  This agenda respects the group's constraints, avoids the stagnant debates, and targets the specific problem of human/non-human coordination where mental alignment is impossible but functional alignment is required.
