prompt: |-
  I spent the better part of last night in a long argument with a close friend who works in evolutionary biology. She kept insisting that if a behavioral regularity is evolutionarily stable, then it already is a convention in the relevant normative sense, and that David Lewis's emphasis on common knowledge and arbitrary alternatives adds nothing but philosophical ornament. I think she is wrong—specifically, she is collapsing the normative "ought" of a Lewisian convention into the descriptive stability of an equilibrium—but I need to be able to show exactly where the collapse happens, and why it matters. So I am asking for a teaching plan, not an explanation: I will lead a single ninety-minute session with a reading group of cognitive-science graduate students. They are fluent in evolutionary game theory and signaling models, but they have no background in philosophy of language or action theory.

  The concept I need them to grasp is Lewis's analysis of convention as a solution to coordination problems that carries genuine normative weight, together with the evolutionary dynamics that can stabilize but do not by themselves constitute such conventions. I need the dependency structure laid out precisely: which component—the payoff structure of a coordination problem, the notion of an arbitrary alternative, the common-knowledge condition, or the normative "ought"—must be secured before the next is introduced, and what breaks if the order is reversed?

  For the carrying example, I want to avoid both the overused telephone and driving-on-the-right illustrations. I am considering the spontaneous stabilization of functional roles—healer, tank, damage-dealer—in a cooperative multiplayer raid environment where no central authority assigns positions, and where newcomers are socially expected to learn and adopt the established pattern. What properties must this example possess, and what properties must it deliberately lack, in order to carry the distinction between a merely stable regularity and a full Lewisian convention? And why should an explicit institutional contract or legal rule not serve as the parallel case?

  Then I need a misconception map tailored to this audience. I anticipate three specific errors: that convention requires an explicit agreement or contract; that evolutionary stability is sufficient for convention; and that the common-knowledge condition involves an impossible infinite regress of beliefs about beliefs. For each, I need to know exactly where in the sequence it will arise, what form it will take given their scientific training, and the precise point at which I should intervene to head it off—especially the second misconception, which is the one my friend advanced.

  What should I explicitly leave out at this level? I am tempted to introduce later work in evolutionary dynamics—perhaps signaling-game models or accounts of normative emergence in social science—but I want to know whether bringing them in helps or undermines the distinction I am trying to protect.

  Finally, I need one diagnostic question I can pose at the end that reveals whether they have genuinely understood the difference between a stable evolutionary regularity and a Lewisian convention with normative force, rather than whether they can merely list the formal conditions.

  Please structure your response as a teaching plan: the ordered introduction with dependency justifications; the carrying example with its required and excluded features; the misconception map with intervention points; the omissions with reasoning; and the check-for-understanding question. End with a single line beginning "Core principle:" that summarizes the central pedagogical insight in one sentence.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Goal:** Create a 90-minute teaching plan for cognitive science grad students (fluent in EGT/signaling, no philosophy background).
      *   **Topic:** David Lewis's analysis of convention vs. evolutionary stability (normative "ought" vs. descriptive stability).
      *   **Specific Conflict:** The user's friend (evo bio) claims evolutionary stability *is* convention (collapsing normative into descriptive). The user believes this is wrong.
      *   **Key Requirements:**
          *   Ordered introduction with dependency justifications (what must come before what).
          *   Carrying example: Multiplayer raid roles (healer/tank/DPS), *not* driving/phone. Must specify required/excluded features and why no contracts.
          *   Misconception Map: 3 specific errors (explicit agreement, evo stability = convention, common knowledge regress). Needs intervention points tailored to scientists.
          *   Omissions: What to leave out (e.g., later signaling dynamics) and why.
          *   Diagnostic Question: One question to test genuine understanding of the norm/stability distinction.
          *   Format: Teaching plan structure.
          *   Ending: Single line "Core principle:".

  2.  **Deconstruct the Philosophical Core (Lewis vs. Evolution):**
      *   *Lewis's Convention:* Regularity $R$ in population $P$ in circumstance $C$.
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform.
          3.  Everyone prefers to conform *given* others conform (coordination equilibrium).
          4.  There is an alternative regularity $R'$ that could have worked just as well (Arbitrariness).
          5.  Common Knowledge (of 1-4).
          6.  *Normative element:* There is a "ought" (reason to conform based on expectations/preferences), often interpreted as a normative expectation.
      *   *Evolutionary Stability (ESS):* A strategy that, if adopted by a population, cannot be invaded by a mutant strategy. It's descriptive stability based on fitness/payoffs.
      *   *The Gap:* ESS explains *why* $R$ persists. Lewis explains *why* agents feel bound to $R$ and why $R$ counts as a social rule rather than just a law of nature or instinct. The "Arbitrariness" and "Common Knowledge" are crucial for the *normative* force (I do it because I know you do it and we know we could have done otherwise). ESS lacks the "could have done otherwise" (arbitrariness) and the reflexive reasoning (common knowledge) in the agent's mind; it just selects the fittest.

  3.  **Drafting the Teaching Plan - Section by Section:**

      *   **Session Structure (90 mins):** Needs to be tight.
          *   Intro (10): Hook & Definitions.
          *   The Dependency Chain (20): The core logic.
          *   The Raid Example (20): Application.
          *   Misconception Map (20): Addressing the friend's argument.
          *   Omissions & Wrap (10): Boundaries.
          *   Diagnostic (10): Assessment.
          *   *Correction:* The prompt asks for specific sections in the response, not necessarily a minute-by-minute agenda, but the *content* of the plan. I will structure the response according to the prompt's requested headers.

      *   **Ordered Introduction (Dependency Structure):**
          *   *Order:* Coordination Problem $\rightarrow$ Equilibrium $\rightarrow$ Arbitrariness $\rightarrow$ Common Knowledge $\rightarrow$ Normativity.
          *   *Why:* You can't have arbitrariness without alternatives (Coordination). You can't have Normativity without Common Knowledge (reasons for action).
          *   *Risk:* If you start with Normativity, it looks like morality. If you start with ESS, you lose the agent's perspective.

      *   **Carrying Example (Raid Roles):**
          *   *Scenario:* MMORPG raid (e.g., WoW). Tank/Healer/DPS.
          *   *Required:* Spontaneous emergence (no dev mandate), Interdependence (Tank needs Healer), Arbitrariness (could have swapped mechanics if coded differently, but now fixed), Expectation (newbies scolded for not following).
          *   *Excluded:* Explicit rules in ToS, Biological hard-coding (instinct), Payoff asymmetry that forces *one* specific solution (must be a coordination equilibrium, not Prisoner's Dilemma).
          *   *Why no contract:* Contracts make it institutional law, not convention. Lewisian convention is pre-institutional.

      *   **Misconception Map:**
          *   1. *Explicit Agreement:* Scientists look for signaling/handshakes. Intervention: Distinguish *signaling* the convention from *agreeing* to it.
          *   2. *ESS = Convention (The Friend's View):* This is the big one. Intervention: The "Arbitrariness" test. ESS selects the *best* fit. Convention selects *one of many* fits. If the payoff structure changed slightly, ESS shifts. If convention shifts, it's social. Also, the "Ought". ESS describes survival; Convention prescribes behavior.
          *   3. *Common Knowledge Regress:* "I know that you know that I know..." infinite loop. Intervention: Treat it as a cognitive heuristic or public salience, not literal infinite recursion.

      *   **Omissions:**
          *   *Skip:* Skyrms' evolutionary signaling dynamics, Bicchieri's empirical expectations vs. normative expectations (too nuanced for 90 mins), Post-Lewis critiques (Gilbert, Millikan).
          *   *Why:* They blur the line between evolution and rationality. The goal is to *separate* them first.

      *   **Diagnostic Question:**
          *   Needs to force a choice between "It works" (ESS) and "We expect it/It could be otherwise" (Lewis).
          *   *Idea:* A scenario where a behavior is stable but not arbitrary (biological reflex) vs. stable and arbitrary. Or a scenario where stability breaks but normativity remains.
          *   *Better:* A case where an ESS exists but isn't a convention. E.g., a biological trait vs. a social rule.
          *   *Best:* Modify the Raid example. Suppose the game developers patch the mechanics so *only* one specific build works (no alternative). Is it still a convention? (No, it's a constraint). Or: Suppose a mutant strategy arises that works *better* but is socially shunned. (ESS says switch, Lewis says norm resists).
          *   *Refinement:* Let's focus on the "Arbitrariness" + "Ought".

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Tone:* Academic, precise, respectful of their EGT knowledge but firm on the philosophical distinction.
      *   *The "Friend's" Argument:* I need to make sure I don't just say "she's wrong." I need to show *why* the collapse is a category error. ESS is third-person (observer); Convention is first-person (participant).
      *   *Dependency:* Make sure to emphasize that Common Knowledge is the bridge to Normativity. Without CK, I don't know *why* I ought to conform other than raw payoff. With CK, I conform because *you* expect me to.

  5.  **Final Polish:**
      *   Check against all constraints.
      *   Ensure the "Core principle" line is distinct and summary-like.
      *   Verify the Raid example doesn't accidentally imply explicit rules (guild charters). Must be *public group finding* (LFG) norms.

  6.  **Writing the Response:** (Proceeding to generate output based on these thoughts.)
      *   *Structure:*
          1.  Ordered Introduction (Dependency Chain).
          2.  Carrying Example (Raid Roles).
          3.  Misconception Map.
          4.  Omissions.
          5.  Diagnostic Question.
          6.  Core Principle.

      *(Self-Correction on Diagnostic Question)*: The prompt asks for *one* question. It needs to be sharp.
      *   *Draft:* "If a behavior is an ESS but there are no alternative equilibria, is it a convention?"
      *   *Critique:* Too dry.
      *   *Better:* "Imagine a raid mechanic where the 'Tank' role is the only mathematically viable strategy (no arbitrary alternative). Players still expect newcomers to Tank. Is this a Lewisian convention?"
      *   *Answer:* No. It lacks arbitrariness. It's a technical constraint.
      *   *Wait, stronger:* "Imagine a mutant strategy emerges that yields higher clear-rates but violates the established role meta. The population eventually shifts to the new strategy. In the transition period, veterans scold the innovators. Is the veterans' scolding justified by Lewisian convention or ESS?"
      *   *Actually, let's look at the "Ought".*
      *   *Selected:* Focus on the "Arbitrariness" condition as the differentiator between ESS and Convention.

      *(Self-Correction on Omissions)*: Be careful not to dismiss evolutionary dynamics entirely, just the *reduction* of convention to dynamics.

      *(Final check on "Core Principle")*: Needs to capture the Normative/Descriptive split.

      *Let's write it.*
answer: |-
  # Teaching Plan: Convention vs. Evolutionary Stability

  ## 1. Ordered Introduction: The Dependency Chain
  **Time Allocation:** 20 Minutes
  **Goal:** Establish the logical scaffolding. Do not define "convention" until the prerequisites are laid.

  1.  **Coordination Problem (The Foundation)**
      *   *Definition:* A situation where agents' payoffs depend on matching actions, not just on the actions themselves (e.g., meeting at a location).
      *   *Dependency:* Must be established first. Without interdependence, there is no need for coordination, only individual optimization.
      *   *Risk if Reversed:* If you start with "rules," students will treat them as constraints (Prisoner's Dilemma style) rather than solutions to interdependence.

  2.  **Coordination Equilibrium (The Stability)**
      *   *Definition:* A regularity where no agent prefers to deviate *given* that others do not deviate.
      *   *Dependency:* Requires the Coordination Problem.
      *   *Risk if Reversed:* If introduced before the problem, it looks like a Nash Equilibrium in a vacuum. Students must see it as a *solution* to the specific problem of matching.

  3.  **Arbitrary Alternative (The Crucial Filter)**
      *   *Definition:* There must exist at least one other regularity $R'$ that would have solved the coordination problem equally well had the population converged on it instead.
      *   *Dependency:* Requires Equilibrium.
      *   *Risk if Reversed:* If introduced before Equilibrium, "arbitrariness" sounds like "randomness." It is not random; it is *contingent*.
      *   *Philosophical Weight:* This is the wedge against your friend's argument. ESS selects the *fittest* solution. Convention selects *one of many* fit solutions. If there is no alternative, it is a law of nature or technical constraint, not a convention.

  4.  **Common Knowledge (The Mechanism)**
      *   *Definition:* Everyone conforms, everyone expects everyone to conform, and everyone knows that everyone knows this (iteratively).
      *   *Dependency:* Requires Arbitrary Alternative.
      *   *Risk if Reversed:* If introduced before Arbitrariness, Common Knowledge looks like mere prediction ("I know you will do X because it's optimal"). With Arbitrariness, it becomes reasoning ("I know you will do X because we both know X is the *chosen* arbitrary solution").

  5.  **Normative "Ought" (The Conclusion)**
      *   *Definition:* The reason to conform is not just payoff maximization, but the *expectation of others* grounded in the shared knowledge of the arbitrary choice.
      *   *Dependency:* Requires Common Knowledge.
      *   *Risk if Reversed:* If introduced first, "normativity" conflates with morality or law. Here, it is strictly rational normativity: "I ought to do X because you expect me to, and I want to coordinate."

  ## 2. The Carrying Example: Raid Role Stabilization
  **Time Allocation:** 20 Minutes
  **Scenario:** A cooperative multiplayer raid (e.g., *World of Warcraft* or *Destiny*) where groups form via anonymous matchmaking (no pre-existing guild contracts). The "Meta" dictates specific roles: Tank (absorbs damage), Healer (restores health), DPS (deals damage).

  **Required Properties (To sustain Lewisian Convention):**
  1.  **Interdependence:** A group of all DPS fails; a group of all Tanks fails. Payoffs depend on *complementarity*.
  2.  **Spontaneous Order:** No developer mandate forces a player to pick "Tank." The code allows any class to attempt any role, but success requires the pattern.
  3.  **Arbitrariness (Critical):** The game mechanics *could* have been coded differently (e.g., "Shield-Bearers" absorb damage instead of "Warriors"). The specific class-to-role mapping is contingent on history, not code.
  4.  **Normative Expectation:** If a new player joins as DPS when a Tank is needed, they are not just "ineffective"; they are *criticized* ("learn the meta"). This social pressure indicates an "ought."

  **Excluded Properties (To prevent collapse into Law/Contract):**
  1.  **Hard Constraints:** The software must *not* prevent a DPS from entering the raid. If the code blocks them, it is a physical/legal constraint, not a convention.
  2.  **Explicit Contract:** Players must not sign a guild charter agreeing to roles. If they do, it becomes an institutional obligation, bypassing the need for Common Knowledge of arbitrary regularity.
  3.  **Biological Instinct:** Players must not be hard-wired to prefer roles. If "Tanking" was a biological reflex, it would be an ESS without normativity.

  **Why No Institutional Contract?**
  Lewisian convention is *pre-institutional*. If you introduce a contract, you explain compliance via "fear of breach penalty" (institutional law). Lewis wants to explain compliance via "mutual expectation of coordination" (social norm). The raid example works only if the pressure is social (reputation/kick vote), not legal (Terms of Service).

  ## 3. Misconception Map
  **Time Allocation:** 30 Minutes
  **Target Audience:** Cognitive Scientists (prone to functionalist/reductionist explanations).

  | Misconception | Form it will take (Scientific Training) | Intervention Point | Corrective Move |
  | :--- | :--- | :--- | :--- |
  | **1. Convention requires Explicit Agreement** | "Where is the signaling handshake? How do they negotiate the equilibrium?" | **During Common Knowledge section.** | Distinguish *signaling* from *agreeing*. Lewis's point is that conventions arise *without* prior negotiation. The "agreement" is tacit, embedded in the history of play, not a speech act. |
  | **2. Evolutionary Stability = Convention** (The Friend's View) | "If the role meta is an ESS, it resists invasion. That explains the stability. Why add 'Common Knowledge'?" | **During Arbitrary Alternative section.** | **The "Arbitrariness Test."** Ask: "If the Tank role was the *only* mathematically viable strategy (no alternative equilibrium), would it still be a convention?" <br> **Answer:** No. It would be a technical constraint. ESS explains *persistence*; Lewis explains *contingency*. ESS is third-person (observer sees stability); Convention is first-person (agent feels expectation). |
  | **3. Common Knowledge is Infinite Regress** | "Agents can't compute infinite 'I know that you know...' loops. It's cognitively implausible." | **During Normative 'Ought' section.** | Reframe CK as **Salience**. It is not a literal infinite computation. It is a public fact (e.g., a patch note, a widely read guide) that serves as a focal point. The "infinite" loop is a logical requirement for the *definition*, implemented cognitively as "publicly obvious." |

  **Specific Intervention for Misconception 2 (The Friend's Argument):**
  *   **The Trap:** Your friend argues that because the behavior is stable, it *is* a convention.
  *   **The Counter:** Stability is necessary but not sufficient. A biological reflex (e.g., blinking when air hits the eye) is evolutionarily stable. It is not a convention.
  *   **The Pivot:** Ask the students: "Does the blinking reflex carry a normative 'ought'?" (i.e., do we scold people for not blinking?) No.
  *   **The Conclusion:** ESS explains the *is*. Lewis explains the *ought* (the expectation of conformity). Your friend is collapsing the *participant stance* into the *design stance*.

  ## 4. Omissions: What to Leave Out
  **Time Allocation:** 10 Minutes (Integrated into transitions)
  **Reasoning:** Protect the Lewisian distinction from being blurred by later dynamic models.

  1.  **Omit: Brian Skyrms' Evolutionary Signaling Dynamics.**
      *   *Why:* Skyrms shows how conventions *can* emerge via evolutionary dynamics without rational deliberation. While true, introducing this now validates your friend's collapse. You must first establish the *conceptual* distinction between rational convention and blind stability before showing how they might overlap in emergence.
  2.  **Omit: Cristina Bicchieri's Empirical vs. Normative Expectations.**
      *   *Why:* Too granular. It splits the "Common Knowledge" condition into psychological components. For this session, keep "Common Knowledge" as a unified block to contrast against "Evolutionary Stability."
  3.  **Omit: Millikan's Proper Functions.**
      *   *Why:* This leans heavily into the biological/teleological view. It will encourage students to view the raid roles as "functions" rather than "agreements," reinforcing the reductionist error you are trying to prevent.

  **Pedagogical Reason:** You are teaching a *conceptual boundary*, not a *historical genealogy*. Introducing evolutionary accounts of emergence now undermines the lesson that "Stability $\neq$ Normativity."

  ## 5. Diagnostic Question
  **Time Allocation:** 10 Minutes
  **Goal:** Test for the distinction between *Stability* (ESS) and *Normativity* (Lewis).

  **The Question:**
  > "Imagine a patch changes the raid mechanics so that the 'Tank' role is no longer an arbitrary equilibrium, but the *only* mathematically possible way to survive (all other strategies result in instant failure, regardless of what others do). Players continue to scold newcomers who fail to Tank.
  >
  > **According to Lewis, does the scolding remain a normative enforcement of a convention, or does it become something else? Why?**"

  **Correct Answer Key:**
  *   **Verdict:** It is no longer a convention.
  *   **Reasoning:** The **Arbitrariness Condition** is violated. If there is no alternative equilibrium $R'$, the regularity is a technical constraint or law of nature, not a convention.
  *   **Nuance:** The *scolding* might persist (as a habit), but it loses its *justification* as a convention. It becomes a misconception of physics/mechanics by the veterans.
  *   **Failure Mode:** If a student answers "It is still a convention because it is stable," they have collapsed Lewis into ESS (your friend's error). If they answer "It is still a convention because people expect it," they have missed the Arbitrariness condition.

  Core principle: Evolutionary stability explains why a behavior persists, but Lewisian convention explains why agents feel bound to it by mutual expectation rather than physical necessity.
