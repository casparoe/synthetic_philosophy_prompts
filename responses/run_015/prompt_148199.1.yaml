  *(Refining the Palimpsest Analysis)*: The key insight there is that the Palimpsest case creates a *branching* or *blending* of causal history that the standard case hides. If the weights slide back, functionalism says nothing changed (function restored). But if the *subject* faded out, restoration is resurrection, not survival. This highlights the difference between *functional capacity* and *historical continuity*.

