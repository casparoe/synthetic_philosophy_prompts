      *   *Unfalsifiability:* Yes, if "affordances" are defined post-hoc.
      *   *Insulation:* Being too insulated makes it descriptively accurate but normatively useless.

  7.  **Final Polish:** Ensure tone is analytical and philosophical, not dismissive. Ensure the "Verdict" line matches the constraints.

