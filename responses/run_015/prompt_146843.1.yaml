prompt: |-
  I just finished a long argument with a friend about whether virtue ethics survives the situationist critique. I want to defend a qualified version: virtues are not global, cross-situational traits but "ecologically embedded dispositions" that stabilize only within specific institutional and relational affordances — a surgeon's calm is real and excellent in the operating theater even if it vanishes in traffic, and moral training should therefore target contextual scaffolding rather than global self-cultivation. The view predicts domain-clustered moral behavior and denies that personality-level consistency is necessary for virtue.

  What would count against this position? I want the observations, arguments, formal results, or psychological findings that should actually move me, sorted by decisiveness — including whether documented failures of domain-clustering exist, whether the view collapses into situationism with extra vocabulary, and whether it has been qualified into unfalsifiability. Please say what defenders of this ecological-disposition account would themselves concede as damaging, not only what critics assert. Distinguish evidence that would be merely awkward from evidence that would be decisive, and tell me whether being well-insulated is itself a problem for a view of this kind.

  Please conclude with a fixed, extractable line: Verdict: [brief phrase stating whether the position is well-insulated and whether that undermines it].
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Position:**
      *   **Core Claim:** Virtue ethics survives situationism by redefining virtues not as global traits but as "ecologically embedded dispositions" (EED).
      *   **Key Features:**
          *   Virtues stabilize within specific institutional/relational affordances (e.g., surgeon in OR vs. surgeon in traffic).
          *   Moral training should target contextual scaffolding, not just global self-cultivation.
          *   Predicts domain-clustered moral behavior.
          *   Denies necessity of personality-level consistency (cross-situational consistency).
      *   **Goal:** Identify what would count *against* this position, sorted by decisiveness, including what *defenders* would concede is damaging.
      *   **Specific Questions to Address:**
          *   Do documented failures of domain-clustering exist?
          *   Does the view collapse into situationism with extra vocabulary?
          *   Has it been qualified into unfalsifiability?
          *   Is being well-insulated a problem?
          *   Distinguish awkward vs. decisive evidence.
      *   **Constraint:** Conclude with a fixed line: `Verdict: [brief phrase]`.

  2.  **Deconstruct the Philosophical Landscape:**
      *   **Situationist Critique:** (Doris, Harman) Empirical evidence shows lack of cross-situational consistency (e.g., Good Samaritan study, Milgram). Therefore, global character traits don't exist. Virtue ethics relies on global traits. Therefore, virtue ethics is empirically inadequate.
      *   **User's Response (Local/Fragmented Virtue):** This is a standard move in the literature (e.g., Miller, Snow, some interpretations of Annas). It concedes the empirical point (no global traits) but saves the normative core by localizing the trait.
      *   **Potential Weaknesses:**
          *   *Fragmentation:* If virtues are too local, do they lose their normative force? Is "operating room courage" really *courage*?
          *   *Integration:* Aristotelian virtue requires unity (Unity of Virtues). If I'm brave in the OR but cowardly in traffic, do I have the virtue of Courage?
          *   *Situationism Collapse:* If behavior is entirely determined by the niche, where is the *agent*? Is it just "situation + script" rather than "agent + disposition"?
          *   *Falsifiability:* If every failure is blamed on "wrong ecology," can the theory ever be wrong?

  3.  **Brainstorming Counterevidence & Arguments (Sorted by Decisiveness):**

      *   *Decisive (Theoretical/Conceptual):*
          *   **The Unity of Virtues Problem:** If virtues are domain-specific, can one be virtuous *simpliciter*? Aristotle argues you can't have one without the others (phronesis connects them). If the user's view denies this, is it still *virtue ethics* or just "contextual behavioral reliability"?
          *   **The Collapse into Situationism:** If the disposition *only* exists because of the scaffolding, is the disposition doing any work? If the scaffolding is removed and the behavior vanishes, was it a disposition or just a stimulus-response pattern? Defenders must admit that if the *agent* contributes nothing distinct from the *environment*, the view is situationism in disguise.
          *   **Moral Transfer/Generalization:** If moral training is purely contextual, how do we explain moral growth or transfer? If I learn honesty in business, can I ever learn it at home? If empirical data shows *no* transfer even with explicit training, the "disposition" part is hollow.

      *   *Significant (Empirical/Psychological):*
          *   **Failure of Domain-Clustering:** The user claims behavior clusters in domains (OR vs. Traffic). If psychology shows that *even within domains* consistency is low (e.g., honesty in one business context doesn't predict honesty in another business context), the "local trait" idea fails. (Hartshorne & May is the classic reference here).
          *   **Scaffolding Independence:** If people maintain virtuous behavior *despite* hostile environments (e.g., whistleblowers, resistors in totalitarian regimes), this suggests global traits *do* exist or at least that ecology isn't the sole stabilizer.

      *   *Awkward (Methodological/Meta):*
          *   **Unfalsifiability:** If every failure is explained away as "missing affordance," the theory is safe but empty.
          *   **Normative Thinness:** If virtues are just "skills for specific contexts," do they retain their moral weight?

  4.  **Drafting the Response (Iterative Refinement):**

      *   *Introduction:* Acknowledge the sophistication of the view (it aligns with "local traits" responses in the literature like Christian Miller or Nancy Snow).
      *   *Section 1: Decisive Theoretical Threats.* Focus on the "Collapse into Situationism" and "Unity of Virtues." If the agent isn't doing the work, it's not virtue ethics.
      *   *Section 2: Decisive Empirical Threats.* Focus on intra-domain inconsistency. If honesty in business A doesn't predict honesty in business B, "business honesty" isn't a trait either.
      *   *Section 3: The Insulation Problem.* Address the unfalsifiability concern. Defenders *should* concede that if they can't specify *which* affordances are necessary, the theory is ad hoc.
      *   *Section 4: What Defenders Concede.* This is crucial. A sophisticated defender admits that if there is *no* cross-domain integration (phronesis), it's not full virtue. They also admit that if the disposition disappears instantly when context shifts, it was likely just habit/compliance, not virtue.
      *   *Conclusion:* The Verdict line.

  5.  **Refining the "Decisiveness" Sorting:**
      *   *Most Decisive:* Intra-domain inconsistency. If the trait doesn't even hold *within* the claimed ecology, the "ecological disposition" is a fiction.
      *   *Second Most Decisive:* Collapse into Situationism. If the explanation of behavior relies 99% on the situation and 1% on the "disposition," the disposition is epiphenomenal.
      *   *Third:* Loss of Normative Force (Is it still *ethics*?).

  6.  **Addressing Specific User Prompts:**
