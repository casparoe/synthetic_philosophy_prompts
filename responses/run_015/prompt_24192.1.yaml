answer: |-
  This is one of the most famous stalemates in philosophy, so first off: don't feel bad. You've stumbled into a rift that has split decision theorists for over 50 years.

  Your friend is half-right, but their conclusion ("two-boxing obviously wins") is where the controversy lies. To give you the ammo you need to continue (or end) this argument, we need to unpack three things: the difference between **Evidential** and **Causal** decision theory, the newer concept of **Functional** decision theory (which answers your "deeper reason" question), and the role of the **Predictor's Mechanism**.

  Here is the breakdown of why your intuition that "there's more to it" is correct.

  ### 1. Your Friend's Argument: CDT vs. EDT
  Your friend is describing the classic standoff between **Causal Decision Theory (CDT)** and **Evidential Decision Theory (EDT)**.

  *   **The Two-Boxer (CDT):** They argue that at the moment you choose, the prediction has *already happened*. The money is either in Box B or it isn't. Nothing you do *now* can causally change the past. Therefore, you should take both boxes because you get the \$1,000 in Box A plus whatever is in Box B. Two-boxing strictly dominates one-boxing.
  *   **The One-Boxer (EDT):** They argue that your choice is *evidence* of what the predictor did. If you choose one box, it is highly probable the predictor anticipated this and filled the box. If you choose two, it's probable they left it empty. Therefore, one-boxing maximizes expected utility.

  **Where your friend is right:** In standard Causal Decision Theory, two-boxing is the only rational move. CDT forbids "magical thinking" (thinking your choice changes the past).
  **Where your friend is wrong:** They assume CDT is the *only* valid definition of rationality. If you define rationality as "the algorithm that gets you the most money," the CDT agent walks away with \$1,000 while the EDT agent walks away with \$1,000,000. As the philosopher David Lewis famously asked: *"Why ain'cha rich?"*

  ### 2. Is it "Just" Evidential? (The Deeper Reason)
  You asked if there is a deeper reason to one-box that doesn't depend on the predictor being accurate (well, it *does* depend on accuracy, but not just on "evidence").

  This is where **Functional Decision Theory (FDT)** and **Timeless Decision Theory (TDT)** come in. These are modern updates to decision theory designed specifically to solve Newcomb's Problem without relying on "spooky" evidential correlations.

  **The Argument:**
  The predictor (Omega) isn't guessing randomly; Omega is simulating you. Omega knows your algorithm.
  *   When you sit down to decide, you are running a decision algorithm.
  *   Omega predicted your choice by running that *same* algorithm (or a very close simulation) beforehand.
  *   Therefore, your decision and Omega's prediction are **logically dependent**.

  It is not that your choice *causes* the money to be there (backward causation). It is not merely that your choice is *evidence* of the money (correlation). It is that **your decision and the prediction are the output of the same logical function.**

  If you decide to two-box, you are effectively determining that "the output of the function [Me]" is "Two-Box." Since Omega ran that function yesterday, the output yesterday was also "Two-Box," so Box B is empty.

  **Why this matters:** This removes the "magic." You aren't changing the past. You are realizing that *you* and *the prediction* are logically linked. If you want the box to be full, you must be the kind of agent that one-boxes. FDT argues that rationality is about choosing the best *output* for your decision algorithm, not just the best physical action in the immediate moment.

  So, to answer your question: **No, the one-boxer's argument is not "just" evidential.** It can be framed as a logical necessity if you view agents as computational functions.

  ### 3. Does the Predictor's Mechanism Matter?
  You asked if the argument is robust to *how* the predictor works. The answer is **yes, it matters immensely for the justification, but not for the payout.**

  *   **Scenario A: The Brain Scanner (Physical Causation).** Omega scans your brain states 10 seconds before you choose. The state of the box is physically fixed before you move your hand.
      *   *CDT says:* Two-box. (You can't change the past).
      *   *FDT says:* One-box. (Your brain state *is* the algorithm).
  *   **Scenario B: The Time Traveler (Backward Causation).** Omega literally sees the future and puts the money in based on that.
      *   *CDT says:* This breaks physics, but if possible, two-box (money is already there).
      *   *Intuition says:* One-box (your choice literally determines the past state).
  *   **Scenario C: The Simulation (Logical Dependence).** Omega runs a perfect simulation of you to see what you do.
      *   This is the strongest case for One-Boxing. You *are* the simulation. If "you" in the simulation two-box, "you" in reality two-box.

  **The Robustness Test:**
  The one-boxing argument is robust **only if the correlation is high and non-accidental.**
  If Omega is just a coin flipper who got lucky 90% of the time, you should two-box. The one-boxing argument relies on the predictor being accurate *because of your decision-making process*, not just by coincidence.

  If the predictor is accurate merely because they bribe people to one-box, that's different than them predicting your rational choice. The one-boxer wins if the predictor is accurate *about your reasoning*.

  ### 4. How to Counter Your Friend
  Here is the summary you can use in your next round:

  1.  **Acknowledge CDT:** Admit that under strict *Causal* Decision Theory, two-boxing is correct. Your friend isn't crazy; they are just a Causal Decision Theorist.
  2.  **Challenge the Definition of Rationality:** Ask them: "If rationality is about making the best decisions to maximize outcomes, why does the Causal Decision Theorist leave with \$1,000 while the Evidential/Functional Decision Theorist leaves with \$1,000,000?" If the goal is winning, CDT fails Newcomb's Problem.
  3.  **Introduce Logical Dependence:** Tell them it's not about "evidence." It's about **logical identity**. If the predictor simulates you, your choice *is* the prediction. You aren't changing the past; you are computing the same result that was computed yesterday.
  4.  **The Precommitment Test:** Ask them: "If you could precommit to a strategy *before* the predictor made their prediction, what would you choose?" Everyone (including two-boxers) would precommit to one-boxing. A rational theory shouldn't tell you to make a plan and then abandon it the moment it's time to execute it.

  ### The Verdict
  Your intuition is right. Dismissing one-boxing as "just evidential" ignores the strongest modern arguments (FDT/TDT) which frame one-boxing as a matter of **logical consistency** rather than magical thinking.

  The two-boxer wins the battle of "causal influence over the past" (which is impossible), but the one-boxer wins the war of "getting the money." Whether that makes them "irrational" or "super-rational" depends entirely on how you define rationality.
