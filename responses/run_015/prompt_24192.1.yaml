      *   *Is the friend wrong?* In standard CDT, the friend is right. I need to make sure I don't say CDT is "wrong," but rather that CDT might be the *wrong tool* for this problem.
      *   *Robustness:* Be clear that if the predictor is *not* accurate, one-boxing fails. The argument relies on the *reliability* of the predictor.

  9.  **Final Polish:** Check for clarity on the distinction between "causing the money to be there" (impossible) vs. "being the kind of agent for whom the money is there" (possible). (This aligns with the FDT explanation).

