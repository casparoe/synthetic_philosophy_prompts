  **The Boundary Condition**

  The path appears the same played back or through,
  Where atoms move in perfect accord.
  There is no mark to tell the old from new,
  In every conjugate and clean record.
  Invert the sign upon the flow of time,
  The logic holds within its crystal mold.
  There is no friction in the upward climb,
  Where past and future are equally told.
  But memory requires a broken cup,
  And heat moves only outward from the flame.
  We cannot trace the scattered shards back up,
  Unless we fix the start from which we came.
  Remove this bound, and logic stays intact,
  But loses why the cause precedes the act.
