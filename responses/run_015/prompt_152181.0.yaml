answer: |-
  **1. Dependency Order: Ethics First, Metaphysics as the Key**
  Start with the **Essay's Ethical Arguments**, not the Bundle Theory.
  *   **Why:** If you open with Bundle Theory, students treat it as a abstract puzzle ("Do I exist?"). If you open with the Suicide Essay, they treat it as a moral problem ("Is this permissible?").
  *   **The Arc:** Present Hume's three traditional objections to suicide (Duty to God, Duty to Society, Duty to Self). Let the group wrestle with God and Society using common sense. When you hit **Duty to Self**, the discussion will stall because they assume a "Self" that owns the future. *That* is the moment you deploy Bundle Theory. It becomes the tool that unlocks the ethical deadlock, rather than a prerequisite lecture.
  *   **Sequence:**
      1.  Hume's 3 Objections (God, Society, Self).
      2.  Refute God & Society (Essay arguments).
      3.  Pause at "Duty to Self." Insert Bundle Theory here.
      4.  Refute "Duty to Self" using Bundle Theory.
      5.  Address the Murder Objection (using the Example).

  **2. The Carrying Example: The Candle Flame**
  Use **A Lit Candle Flame** to explain both the metaphysics and the ethics.
  *   **The Metaphysical Job (Bundle vs. Vase):** A vase exists even when you leave the room. A flame *is* the process of burning; it has no underlying "flame substance" separate from the wax and wick and combustion. Extinguishing it isn't "breaking a thing" (like smashing the vase); it is stopping a process. This mirrors the Bundle Theory: the self is the perceptions, not a container holding them.
  *   **The Ethical Job (Suicide vs. Murder):** Snuffing your own candle ends your light. Blowing out *someone else's* candle plunges them into darkness.
  *   **Required Properties:**
      *   **Process-Dependent:** It must cease to exist the moment the activity stops (no hidden substrate).
      *   **Utility-Bearing:** It must produce something tangible for others (light/heat) to ground the harm principle.
  *   **What It Must Lack:**
      *   **Nobility:** Do not use a "torch relay" or "lighthouse" analogy. This makes suicide look like sacrifice. The candle must be private and ordinary.
      *   **Ownership:** The flame shouldn't belong to a "master." This avoids reintroducing a God-substance.

  **3. Misconceptions & Defusal Sequence**
  *   **Misconception 1: "Hume just likes suicide because he's an atheist."**
      *   **When to Defuse:** During the **Duty to God** section (Step 1 of the Arc).
      *   **How:** Point out that Hume's argument isn't "God doesn't exist." It's "If God established laws of matter/motion, suicide is just matter in motion." He argues *within* a theological framework, not outside it. This forces them to engage with the logic, not the biography.
  *   **Misconception 2: "Bundle Theory means the Self is an illusion (Eastern/Spooky way)."**
      *   **When to Defuse:** During the **Bundle Theory Insertion** (Step 3 of the Arc).
      *   **How:** Be explicit: "Hume isn't saying perceptions aren't real. The pain is real. The joy is real. He's saying the *glue* holding them together isn't real." Use the Candle: The light is real, the "Flame-Soul" is not. This prevents the "Nothing matters" nihilism slip.
  *   **Misconception 3: "If there's no Self, there's no harm in killing anyone ever."**
      *   **When to Defuse:** During the **Murder Objection** (Step 5 of the Arc).
      *   **How:** Use the Candle Example. "If I blow out your candle, I haven't broken a 'soul-vase,' but I have deprived you of light and heat." Hume's ethics rest on *sentiment and utility* (pain/pleasure), not on protecting a metaphysical substance. Murder is wrong because it causes pain to *other bundles*, not because it violates a sacred substance.

  **4. End-of-Session Assessment Question**
  Do not ask if they agree with Hume. Ask them to isolate the machinery of his argument.
  *   **The Question:** "If Hume were convinced that the Self *was* a permanent, immortal substance (like a vase), which specific step in his argument for the permissibility of suicide would collapse, and which step would remain standing?"
  *   **Why this works:** To answer correctly, they must identify that the "Duty to Self" argument collapses (you can't destroy property you don't own), but the "Duty to God/Society" arguments (based on causation and utility) could theoretically stand. This proves they separated the metaphysics from the ethics.

  **5. Explicit Exclusions (What to Leave Out)**
  Openly state at the start: "We are bracketing two things today."
  1.  **The Historical Suppression:** Do not discuss *why* the essay was withheld until after his death (fear of prosecution, friends' advice). It invites ad hominem speculation about Hume's courage rather than his logic.
  2.  **The Formal Is-Ought Problem:** Do not drag in the *Enquiry* or the formal "Is-Ought" gap from Book 3 of the *Treatise*. It complicates the specific link between Bundle Theory (Is) and Suicide (Ought). Keep it internal to the Essay's specific reasoning.
