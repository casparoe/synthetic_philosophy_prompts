      *   *Better Example:* **A Game of Catch.**
      *   *Bundle:* The game only exists in the throwing. No "game substance."
      *   *Suicide:* Dropping your glove and walking away. The game ends for you.
      *   *Murder:* Tackling the other player.
      *   *Vase:* The ball exists when the game stops. The game doesn't.
      *   *Properties:* Requires participation (perceptions). Ends when participation ends.
      *   *Must Lack:* No scoring/winning (avoids nobility).
      *   *Why Murder is wrong:* You physically harm the other player (pain/sentiment), not because you destroyed the "Game-Substance."
      *   *Actually, the **Candle** is more Humean.* Hume talks about matter in motion. A flame is matter in motion. A game is too abstract. Let's stick with **The Candle Flame** but emphasize the *heat* (utility) for the murder distinction.
