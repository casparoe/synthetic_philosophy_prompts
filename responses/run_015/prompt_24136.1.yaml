      *   **Claim 2: "The mind can perceive the truth of $G$ for any putative formalization of itself."**
          *   *Gödel:* No. Gödel says nothing about minds.
          *   *Lucas/Penrose:* This is the crux of the Lucas-Penrose argument (LPA). Lucas (1961): "For any machine, there is a formula it cannot produce as true, but we can see is true."
