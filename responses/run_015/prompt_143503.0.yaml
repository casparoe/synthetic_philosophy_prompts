answer: |-
  This is a magnificent problem. You've identified the exact fault line where legal theory meets moral history. If you get this right, the scene won't just be about law; it will be about whether a nation can be bound by a promise it broke while making it.

  Here is the breakdown of Douglass's position, the tensions you can exploit, and the specific dynamics for your scene.

  ### 1. The Tension: 1787 vs. 1868 (The "Wrapper" Question)

  You asked if his reading of the Constitution was load-bearing or a rhetorical wrapper. The answer is: **It was a tactical shield that became a theological commitment.**

  Pre-war, when Douglass argued the Constitution was anti-slavery, he was doing something radical. The Garrisonians said the document was pro-slavery and should be burned. Douglass said, "No, read the text." He was arguing that the *words* did not sanction slavery, even if the *men* who wrote it did. This looks like originalism (text over intention), but it was actually **Natural Law originalism**. He believed the text, properly read, had to align with the self-evident truths of the Declaration.

  Post-war, he acknowledges the document was "remade." This is the key for your scene. Douglass does not believe in the sanctity of the 1787 bargain. He believes in the sanctity of the 1868 correction.

  **How he answers your protagonist:**
  He would not be insulted by the suggestion that his earlier reading was rhetorical. He was a pragmatist. He would say: *"I used the text as a lever to move the world. When the world moved, the text changed with it. The law is not a tomb for the dead; it is a living covenant among the breathing."*

  **The Conflict:** Modern originalism often tries to freeze the "original public meaning" of 1787 (or sometimes 1868) based on what people *expected* it to do. Douglass would argue that the *principle* of the text outruns the *expectations* of the ratifiers. The 14th Amendment meant equality, even if the men who voted for it didn't fully grasp how far that equality would reach.

  ### 2. The History-and-Tradition Test

  Your instinct is correct: Douglass would find a pure "history and tradition" test self-refuting because history and tradition *included* slavery.

  However, he wouldn't reject history entirely. He would distinguish between **the tradition of practice** and **the tradition of principle.**

  *   **Practice:** We held slaves. We excluded immigrants. We barred women. (This is the Judge's "history.")
  *   **Principle:** We declared all men created equal. We fought a war to prove it. We amended the Constitution to codify it. (This is Douglass's "history.")

  **Can he endorse the test?**
  Only if the "tradition" being tested is the *Reconstruction* tradition, not the *Founding* tradition. He would argue that the Civil War was a revolution that wiped the slate clean. To ask what was protected in 1787 is to ask what rights existed when black men were property. To ask what was protected in 1868 is to ask what rights exist when black men are citizens.

  **The Trap for your Judge:** If the Judge says, "We look to history to constrain judges," Douglass says, "History constrained us to chains. I do not want constraint; I want justice. If your method sanctifies the past, it sanctifies the sin."

  ### 3. The Algorithm Case (Intent vs. Outcome)

  This is where you can make Douglass feel historically real rather than a modern progressive in a wig.

  Douglass was a moralist, not a sociologist. He spoke often of "character" and "intent." However, he also had a profound understanding of **systemic consequences.** He argued that if you leave a man with nothing but his freedom, he will starve, and that is not freedom at all. He understood that neutral laws applied to unequal conditions produce unequal results.

  **Would he care about intent?**
  He would argue that **outcome proves intent.**

  If an algorithm produces a caste system, Douglass would not care that the programmer didn't *mean* to be racist. He would argue that a system that reproduces the conditions of slavery *is* a slave system, regardless of the master's feelings.

  **The Reasoning:**
  He would likely frame it this way: *"You say the machine has no heart, so it cannot hate. But if the machine grinds the black man down just as the whip did, I do not ask the machine for its motives. I ask the state for its remedy. If the law creates a result that looks like slavery, the law must bear the burden of slavery."*

  He wouldn't use the term "disparate impact." He would use the term "substance over form." He spent his life fighting laws that were neutral on their face but designed to crush black freedom (like the Black Codes). He knows that "no intent" is the favorite excuse of the oppressor.

  ### 4. Your Theory: Meaning vs. The Deal

  **Your theory is not dumb; it is the strongest argument in the room.**

  Originalism is fundamentally contractarian. It says: *We are bound because the Founders agreed to this.*
  Douglass's rebuttal is: *I was not at the table. I was on the menu.*

  He would argue that legitimacy does not come from the consent of the governed if the governed includes people who were owned. The 1787 Constitution was a contract between white property owners. Douglass would say that a contract founded on theft cannot bind the stolen.

  **Why this stings the Judge:**
  The Judge believes the law's authority comes from its continuity. Douglass argues the law's authority comes from its justice. If the continuity preserves the theft, the authority is void.

  ### The Scene Dynamics: Where They Get Stuck

  Here is how you play the tennis match.

  **Douglass's Weakness (The Concession):**
  Douglass must admit that without *some* fixed text, rights are just the whims of the powerful. He needs the Constitution. He needs the 14th Amendment. He cannot simply say "Justice is whatever I say it is." He has to admit that he needs the Judge to enforce the text, even if the text is old.
  *   **The Concession:** *"I need your rules, Judge. Without the text, I am at the mercy of your mood. But do not ask me to worship the hand that wrote the chains."*

  **The Judge's Sting (The Rebuttal):**
  The Judge shouldn't argue that slavery was good. He should argue that **stability protects the weak.**
  *   **The Sting:** *"Mr. Douglass, you say the text is tainted. But if I throw out the 'deal' because it was imperfect, I throw out the only thing that protects you from the mob. You want me to find new rights in the shadows of the text? What happens when the next judge finds a 'right' in those same shadows that strips you of your vote? You want the law to be a moral mirror. I need it to be a shield. A shield doesn't care if it's pretty; it cares if it holds."*

  **The Resolution (For your Protagonist):**
  The protagonist realizes that Douglass and the Judge are both originalists, but of different covenants.
  *   The Judge is an originalist of the **Contract** (1787, stability, process).
  *   Douglass is an originalist of the **Covenant** (1868, redemption, substance).

  Douglass would tell her: *"The Judge asks what the dead intended. I ask what the living require. The text is the same. The question is whether you read it as a tombstone or a seed."*

  ### Specific Dialogue Beats to Consider

  **On the "Rhetorical Wrapper":**
  *   **Protagonist:** "Did you believe the Constitution was anti-slavery, or did you just need it to be?"
  *   **Douglass:** "A man drowning does not argue with the rope. He grabs it. Later, he asks if the rope was strong. I grabbed the Constitution. It held. That is belief enough."

  **On the Algorithm/Intent:**
  *   **Judge:** "The state didn't intend to discriminate. The math is neutral."
  *   **Douglass:** "The whip did not hate the back it cut. The chain did not hate the ankle it bound. They were just doing their work. Do not ask the tool if it is evil. Ask the hand that wields it why the blood is always the same color."

  **On the "Deal":**
  *   **Judge:** "We are bound by the agreement that made this nation."
  *   **Douglass:** "An agreement made over my body cannot bind my soul. You call it a Constitution. I call it a truce between thieves. I am not a party to that deal. I am the redemption of it."

  ### Summary for the Scene

  1.  **Douglass is not a Living Constitutionalists in the modern sense.** He doesn't want judges making things up. He wants them to enforce the *radical promise* of the Reconstruction Amendments. He is more of a "Reconstruction Originalist" than a "Founding Originalist."
  2.  **He accepts the "Wrapper" charge.** He was a soldier. Tools are used to win wars.
  3.  **He rejects "History and Tradition" if it means "Status Quo."** He accepts it if it means "The Tradition of Emancipation."
  4.  **He cares about Outcomes.** Intent is the refuge of the scoundrel.
  5.  **Your "Deal" Theory is the Core.** The Judge worships the Contract; Douglass worships the Correction.

  The scene works best if the Judge is not defeated, but *unsettled*. He realizes his method provides stability, but Douglass makes him feel that stability might be complicit. And Douglass is unsettled because he knows he needs the Judge's court to enforce his vision, but the Judge's method makes that impossible. The protagonist is stuck in the middle, realizing the law is not a machine for finding truth, but a battlefield for defining it.
