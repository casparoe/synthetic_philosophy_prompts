prompt: |-
  I'm writing a short paper on the metaphysics and normativity of promising, and I'd appreciate critical comments on the draft below — both on the soundness of the argument and on whether the central proposal is doing any real work.

  The paper defends a view I call the "transferred authority" account of promissory obligation, against the two views I take to be the main competitors.

  Draft:

  It is a commonplace that promises bind, but remarkably hard to say what a promise does such that it binds. I consider two familiar accounts and find both wanting. The first, which I call the practice view, holds that promising is a conventional practice, like chess, and that the wrong of breaking a promise is the wrong of breaking the rules of the practice — just as it would be wrong to move a rook diagonally even if nobody is harmed. This correctly explains why a promise binds even when the promisee neither relies on it nor even remembers it. But it faces a difficulty: it seems to get the explanation backwards. The rules of a game bind only those who have chosen to play, and it is implausible that each individual promise is a fresh decision to enter the practice. If the practice view says we are all already players, it owes an account of how we got in the game — and no plausible account of that avoids circularity, since the natural story is that joining a practice is itself something like a promise.

  The second, the reliance view, holds that a promise generates an obligation by inducing an expectation in the promisee, thereby exposing the promisee to a risk the promisor has a duty not to exploit. This nicely explains why promises bind proportionally to the reliance they induce, but it cannot explain the bindingness of promises made to people who cannot rely on them: promises to small children, to the severely forgetful, or to the dead. Yet these seem to be paradigm promises, not degenerate cases.

  I propose instead that a promise is a transfer of authority. In promising to φ, the promisor grants the promisee a standing to determine that the promisor φ — a private, localized version of the authority a principal grants an agent. The obligation is not owed to a practice, nor generated by the promisee's psychological states, but is simply the mirror image of a normative power the promisee now holds. The promise is like handing someone keys: in ordinary speech you hand over the keys to your house, in promising you hand over the keys to a piece of your own will.

  This account predicts, correctly I think, that promises made under duress do not bind: coerced transfers of authority, like coerced transfers of property, are defective transfers. It also explains why third parties can feel the existence of an obligation even when the promisee has forgotten: an unexercised right is still a right.

  Comments requested on the following, though please raise anything else you notice:

  1. The dead-promisee case is meant to be an objection to reliance views, but does my own account handle it? A dead person seems unable to hold any standing, yet I claim the promise still binds. Is this an embarrassment for my view, or can the appeal to "unexercised rights" be made to work?
  2. Does the keys analogy carry any argumentative weight, or is it merely decorative?
  3. Is my characterization of the two competitor views fair, or am I attacking weakened versions of them?
reasoning: |-
  Here's a thinking process that leads to the suggested comments:

  1.  **Analyze the User's Request:**
      *   **Task:** Provide critical comments on a draft paper abstract/summary regarding the metaphysics and normativity of promising.
      *   **Topic:** The "transferred authority" account of promissory obligation vs. Practice View and Reliance View.
      *   **Specific Questions:**
          1.  Does the "dead promisee" case undermine the transferred authority view (since dead people can't hold standing)?
          2.  Is the "keys" analogy argumentative or decorative?
          3.  Are the competitor views (Practice, Reliance) characterized fairly?
      *   **General Request:** Check soundness of argument and whether the central proposal is doing "real work."

  2.  **Analyze the Draft Text:**
      *   **Core Thesis:** Promising is a transfer of authority (promisor grants promisee standing to determine promisor's action).
      *   **Critique of Practice View:** Rules bind only players; joining the practice is circular (like a promise).
      *   **Critique of Reliance View:** Can't handle cases where reliance is impossible (children, forgetful, dead).
      *   **Defense of Transferred Authority:** Explains duress (defective transfer), explains third-party observation (unexercised right).
      *   **Tone:** Philosophical, concise, argumentative.

  3.  **Address Question 1: The Dead Promisee Case:**
      *   *The Problem:* The user admits dead people can't rely. They claim their view handles it because rights persist. But can dead people hold *authority* or *standing*?
      *   *Analysis:* If authority is a normative power to *direct* the will, a dead person cannot exercise this. If the authority transfers to heirs, it's no longer a promise *to the dead*. If the authority remains with the dead, it's metaphysically odd (rights without subjects?).
      *   *Critique:* This is a significant vulnerability. The "unexercised right" move works for property, but authority implies a capacity to *will*. A dead person has no will.
      *   *Suggestion:* Distinguish between the *source* of the authority (the act of promising) and the *holder* of the authority. Or, concede that promises to the dead are a special subclass (testamentary) governed by different norms, rather than paradigm promises. Or, argue that the authority transfers to the promisee's estate/representatives, but that weakens the "personal" nature of the view.
      *   *Verdict:* It's an embarrassment unless refined. The "unexercised right" analogy works for *claims*, but "authority/standing" implies agency.

  4.  **Address Question 2: The Keys Analogy:**
      *   *The Metaphor:* Handing over keys to a house vs. keys to a piece of will.
      *   *Function:* It illustrates *transfer* and *access/control*.
      *   *Critique:* It's mostly decorative/pedagogical. It doesn't prove the metaphysics. However, it highlights the *exclusivity* and *permission* aspect. Keys allow entry (authority) but don't force entry (reliance).
      *   *Verdict:* Decorative but useful for intuition pumping. It doesn't carry argumentative weight on its own but helps visualize the "normative power" concept.

  5.  **Address Question 3: Characterization of Competitor Views:**
      *   *Practice View (Rawls/Scanlon-ish?):* The critique focuses on "joining the game." Rawls argues the practice is social, not individual. The circularity charge is standard (Shiffrin makes similar points). It's a fair *summary* for a short paper, but might miss sophisticated versions (e.g., convention-based but not rule-based in a game sense).
      *   *Reliance View (Scanlon/Shebasta?):* The critique focuses on "inducing expectation." Scanlon's Principle F is more nuanced (it's about assurance, not just reliance). The "dead/children" objection is a classic one against pure reliance.
      *   *Critique:* The Practice View critique is strong. The Reliance View critique is standard but might ignore "assurance" views which try to bridge reliance and authority.
      *   *Verdict:* Fair enough for a short draft, but needs to acknowledge that modern Reliance views often try to account for the "special standing" (e.g., Scanlon).

  6.  **Assess "Real Work" (Metaphysics & Normativity):**
      *   *Metaphysics:* What *is* the transfer? Is it a speech act? A mental state? The draft says "granting standing." This is close to Hohfeldian powers or Shiffrin's view.
      *   *Normativity:* Why does the transfer bind? The draft says "mirror image of normative power." This risks being descriptive rather than explanatory. *Why* does granting authority create an obligation? (The "Normative Gap").
      *   *Critique:* The view sounds very similar to Seana Shiffrin's "Authority" view or H.L.A. Hart's "Choice Theory." The user needs to distinguish their view from these existing accounts. If it's just Shiffrin renamed, it's not doing new work.
      *   *Key Issue:* The "Normative Gap." How do words create authority? The Practice view answers this (convention). Reliance answers this (harm prevention). Transferred Authority often struggles to explain *how* the transfer happens without presupposing the normativity of promising (circularity).

  7.  **Synthesize and Structure the Feedback:**
      *   **Introduction:** Acknowledge the clarity and ambition of the draft.
      *   **Section 1: The Dead Promisee (Question 1).** Deep dive into the metaphysics of rights vs. authority.
      *   **Section 2: The Keys Analogy (Question 2).** Assess its rhetorical utility.
      *   **Section 3: Competitor Views (Question 3).** Nuance the Practice and Reliance critiques.
      *   **Section 4: The "Real Work" (General Soundness).** Address the circularity risk (how is authority transferred?) and similarity to existing literature (Shiffrin/Hart).
      *   **Section 5: Specific Suggestions for Revision.**

  8.  **Refine the Content (Self-Correction during drafting):**
      *   *Correction:* I initially thought of Scanlon for Reliance. Scanlon is actually more about "assurance" which is close to authority. I should warn the user that their "Transferred Authority" view might collapse into a sophisticated Assurance view if not careful.
      *   *Correction:* On the dead promisee: If I promise my dead father to visit his grave, who holds the authority? If no one, the obligation is arguably owed to the *memory* or *value*, not the person. This challenges the "personal authority" model.
      *   *Correction:* On circularity: The Practice view critique is good, but the Transferred Authority view faces the *same* circularity. How do I transfer authority unless there is already a convention that allows such transfer? (Hume's point). I need to make sure the user addresses this.

  9.  **Final Polish:** Ensure tone is constructive, rigorous, and helpful for a philosophical paper. (Proceed to generate output based on these thoughts.)
answer: |-
  This is a compelling and clearly written draft. You have identified a genuine gap in the literature (the tension between the *source* of the obligation and its *bindingness*) and proposed a solution that aligns with a "will theory" of rights.

  However, to answer your specific concern: **Is the central proposal doing real work?** There is a risk that the "transferred authority" view is merely a redescription of the phenomenon rather than an explanation of it. Below are critical comments structured around your three specific questions, followed by a broader section on the metaphysics/normativity gap.

  ### 1. The Dead Promisee Case
  **Verdict:** This is currently the weakest point in your defense and risks being an embarrassment for the Transferred Authority view.

  *   **The Problem:** You argue that the Reliance View fails because the dead cannot rely. But your view requires the promisee to hold *authority* or *standing*. Metaphysically, a dead person cannot hold standing, exercise a normative power, or release you from the obligation. Authority implies a capacity to *will* something regarding the promisor's action. A corpse has no will.
  *   **The "Unexercised Right" Move:** You suggest an unexercised right is still a right. This works for *claim-rights* (I have a right that you not kill me, even if I am asleep), but "authority" is more dynamic. It is the right to *change* the normative situation (e.g., to release you from the promise). If the dead cannot exercise this power, the transfer is incomplete or the authority is frozen.
  *   **Suggestion:** You have two options:
      1.  **Concede and Distinguish:** Argue that promises to the dead are a distinct, degenerate class (testamentary obligations) grounded in respect for the *past* will of the person, not their *current* authority. This saves your theory for paradigm cases (living promisees).
      2.  **The Estate/Representative Move:** Argue that the authority transfers to the promisee's heirs or executors. However, this weakens the "personal" nature of your view. If I promise *you* to water your plants, and you die, and your heir tells me to let them die, have I violated the promise to *you*? Your view needs to explain why the authority survives the person.

  ### 2. The Keys Analogy
  **Verdict:** It is primarily decorative/pedagogical, but it does have one specific argumentative function if leveraged correctly.

  *   **Decoration:** It helps the reader visualize the "transfer" metaphor. It makes the abstract concept of "normative power" concrete.
  *   **Argumentative Weight:** As it stands, it carries no logical weight. However, it *can* do work if you use it to distinguish your view from the Reliance View.
      *   *How:* If I hand you the keys to my house, you have the *authority* to enter, even if you never actually enter (no reliance). Furthermore, if you lose the keys (forget the promise), I am still not allowed to enter without permission (the authority structure remains).
      *   *Refinement:* Use the analogy to highlight **exclusivity**. When I give you the keys, I *lose* the authority to determine that space (I shouldn't enter without asking). This captures the "mirror image" claim better than the text currently does. The promisor is "locked out" of their own will regarding $\phi$.

  ### 3. Characterization of Competitor Views
  **Verdict:** Fair for a short paper, but vulnerable to sophisticated counter-arguments.

  *   **The Practice View:** Your critique (circularity of joining the practice) is a standard and strong objection (often associated with Shiffrin). However, be careful not to conflate the Practice View with a "Game View." Sophisticated practice theorists (like Rawls) argue the practice is a public good we are born into, not a game we opt into. You should acknowledge that the Practice View might argue language itself is the practice we are "born into."
  *   **The Reliance View:** You are likely targeting a crude utilitarian reliance view. Modern reliance/assurance views (like Scanlon's Principle F) attempt to account for the "special standing" of the promisee without full reliance. Scanlon argues that breaking a promise violates a principle of fidelity that we have reason to want, based on the *assurance* given, not just the reliance incurred.
      *   *Risk:* Your "Transferred Authority" view looks very similar to Scanlon's "Assurance" view. You need to distinguish *granting authority to command* (your view) from *providing assurance of performance* (Scanlon). In your view, the promisee can *order* you to $\phi$; in Scanlon's, they just expect you to $\phi$. Clarifying this distinction is crucial for your proposal to do "real work."

  ### 4. General Soundness and "Real Work"
  The most significant challenge to your draft is the **Normative Gap**.

  *   **The Circularity Risk:** The Practice View explains *how* we bind ourselves (convention). The Reliance View explains *why* we bind ourselves (harm prevention). The Transferred Authority view says we bind ourselves by transferring authority. But **how** is authority transferred?
      *   If I say "I promise," what makes that a transfer of authority? If it is a social convention, you are back to the Practice View. If it is because you intend to transfer authority, how does a mental intention change normative reality without a pre-existing norm? (This is Hume's famous objection to promising).
      *   *Fix:* You need to explain the *mechanism* of the transfer. Is it a speech act constituted by social norms? If so, how is that different from the Practice View? You might argue that the Practice View makes the *rules* primary, whereas you make the *interpersonal power dynamic* primary.

  *   **Similarity to Existing Literature:** Your view is very close to **H.L.A. Hart's "Choice Theory" of rights** and **Seana Shiffrin's** work on the authority of promises.
      *   If you are unaware of this, you risk reinventing the wheel.
      *   If you are aware, you need to cite them and explain your deviation. For instance, Shiffrin emphasizes the *autonomy* aspect of promising. Does your "keys" analogy add something new? Perhaps the idea of the promisor being "locked out" of their own will is a fresh take on Shiffrin.

  ### Specific Recommendations for Revision

  1.  **Refine the Dead Promisee Objection:** Either limit the scope of your theory to living promisees or develop a robust account of posthumous authority (perhaps via representatives). Don't let it sit as an unresolved tension.
  2.  **Clarify the Mechanism:** Add a sentence or two on *how* the transfer occurs. Is it the utterance? The intention? Acknowledge that this requires a background convention (conceding some ground to the Practice View) but argue that the *normative force* comes from the transfer, not the convention.
  3.  **Distinguish from Assurance:** Explicitly distinguish "Authority" from "Assurance." Assurance is about expectations; Authority is about *control*. The promisee can *waive* the obligation on your view. Can they do that on the Reliance/Assurance view? (Usually yes, but the grounding is different).
  4.  **Strengthen the "Lock Out" Metaphor:** Expand the keys analogy to show that the promisor loses the right to decide. This explains the *obligation* (I cannot $\neg\phi$) as a correlate of the promisee's *power* (They can demand $\phi$).

  **Summary:** The draft is philosophically sound in its intuitions but needs to shore up its metaphysics regarding *how* the transfer happens and *who* holds the authority in edge cases. It is a viable position, but it walks a tightrope between the Practice and Will theories that you need to navigate explicitly.
