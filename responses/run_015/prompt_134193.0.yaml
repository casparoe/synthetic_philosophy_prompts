  ### Brainstorming Logical Commitments

  Before structuring the taxonomy, we must isolate the logical pressures that force these distinctions. First, there is the **commensurability problem**: can suffering be quantified like weight, or is it qualitative like color? If qualitative, ranking requires a structural proxy (e.g., intent, bureaucracy) rather than a pain metric. Second, there is the **function problem**: is history used to judge guilt (moral), explain causes (causal), or honor the dead (commemorative)? Ranking serves different masters in each case. Third, there is the **zero-sum assumption**: does moral attention operate like a budget, where funding one memory defunds another, or is it infinite? Finally, there is the **barrier problem**: when people reject ranking, is it because they think we *can't* know (epistemic), *shouldn't* compare (moral), or *logically cannot* equate the events (conceptual)? These four tensions generate the decision tree below.

  ### Taxonomy of Positions on Ranking Historical Atrocities

