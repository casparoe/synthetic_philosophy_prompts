                          *   **The entailment of comparison**
                              *   **Diminishes moral standing** → **Unnamed**
                              *   **Non-competitive ordering** → **Memorial Pluralism**
                      *   **Conceptual** → **Unnamed**

  ### Leaf Analysis and Empty Combinations

  **Occupied Positions (Leaves)**

  1.  **Deflationary Skepticism:** *Awkward Commitment:* Implies we cannot learn moral lessons from history because we cannot measure the pain involved.
  2.  **Hierarchical Retributivism:** *Awkward Commitment:* Suggests that justice is a finite resource where punishing one crime lessens the severity of another.
  3.  **Comparative Genocide Studies:** *Awkward Commitment:* Must assume bureaucratic structures map neatly enough to human pain to allow for scientific classification.
  4.  **Structural-Ordinal Comparison:** *Awkward Commitment:* Risks ignoring the lived experience of victims in favor of administrative data and state capacity metrics.
  5.  **Holocaust Uniqueness or Incommensurability:** *Awkward Commitment:* Must assert one event is ontologically distinct from all other human violence, risking historical isolationism.
  6.  **Memorial Pluralism:** *Awkward Commitment:* Risks diluting specific political demands for justice into general, non-competitive remembrance.

  **Empty Logical Combinations**

  *   **Moral Evaluation + Ordinal/Structural:** All branches here are marked "Unnamed." This combination is unattractive because moral evaluation of agents typically requires a metric of harm (suffering), not just bureaucratic structure.
  *   **Causal-Historical + Cardinal Scale:** All branches here are marked "Unnamed." This combination is unexplored because historians generally lack access to cardinal suffering data and rely on structural evidence.
  *   **Conceptual Resistance + Non-competitive Ordering (under Moral Evaluation):** Marked "Incoherent." If the category of atrocity is logically sui generis (conceptual resistance), one cannot sustain even a non-competitive ordering; the comparison itself collapses.
  *   **Commemorative + Cardinal + Non-competitive:** Marked "Unnamed." While logically possible, this is rarely defended because commemorative practices rarely claim access to cardinal suffering scales.

  **Indistinguishable Leaves**

  *   **Holocaust Uniqueness (Conceptual Resistance)** and **Holocaust Uniqueness (Moral Resistance):** The tree cannot reliably separate these leaves. In practice, claims that the Holocaust is conceptually unique (ontologically distinct) are functionally identical to claims that it is morally unique (too sacred to compare), as both yield the same prohibition against ranking.
