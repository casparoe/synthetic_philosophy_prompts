                          *   **The entailment of comparison**
                              *   **Diminishes moral standing** → **Unnamed**
                              *   **Non-competitive ordering** → **Unnamed**
                      *   **Conceptual** → **Holocaust Uniqueness or Incommensurability**
              *   **Ordinal/Structural features sufficient**
                  *   **The ground of resistance**
