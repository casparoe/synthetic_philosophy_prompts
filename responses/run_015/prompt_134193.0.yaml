      *   **Moral evaluation of agents**
          *   **The metric required**
              *   **Cardinal scale of suffering presupposed**
                  *   **The ground of resistance**
                      *   **Epistemic (we lack access)**
                          *   **The entailment of comparison**
                              *   **Diminishes moral standing** → **Deflationary Skepticism**
                              *   **Non-competitive ordering** → **Unnamed**
                      *   **Moral (disrespects victims)**
                          *   **The entailment of comparison**
                              *   **Diminishes moral standing** → **Hierarchical Retributivism**
                              *   **Non-competitive ordering** → **Unnamed**
                      *   **Conceptual (atrocity is sui generis)**
                          *   **The entailment of comparison**
                              *   **Diminishes moral standing** → **Unnamed**
