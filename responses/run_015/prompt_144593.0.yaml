answer: |-
  ### Exam Question: Historical Explanation and Fragility

  **Question:**
  Consider a historian who claims the 1789 grain crisis caused the French Revolution. They argue this narrative is "counterfactually fragile": if the harvest had failed just one week later, the revolutionary chain would not have started. Using the concept of **counterfactual fragility mapping**, evaluate whether this fragility proves the narrative relies on hidden scientific laws (the covering-law model) or if the fragility is internal to the story structure itself. In your answer, you must distinguish between logical and causal dependence, explain why fragility does not require a covering law, and identify the mistake of confusing narrative coherence with nomological subsumption.

  ***

  ### Model Answer

  The claim that the French Revolution hinges on a one-week harvest window introduces the problem of counterfactual fragility mapping. This concept asks whether the sensitivity of an outcome to small changes implies a universal law governs the event, or if the sensitivity is merely a feature of how the story is told. To resolve this, we must analyze the type of dependence involved.

  First, we must distinguish logical dependence from causal dependence. Causal dependence refers to physical mechanisms: lack of food physically weakens a population, leading to unrest. However, the historian's claim relies on logical dependence within the narrative. The statement "if the harvest failed later, no revolution" is a logical connection between plot points, not necessarily a physical law. The narrative requires this specific timing to make sense, but that requirement is internal to the explanation, not external in the world.

  Second, fragility does not automatically import a covering law. Proponents of the covering-law model argue that for an explanation to be valid, it must subsume events under a universal generalization (e.g., "Food shortages always cause revolutions"). They might argue that because the outcome changes with a one-week shift, there must be a precise law governing that shift. However, counterfactual fragility mapping shows this is incorrect. A narrative can be highly sensitive to initial conditions without being governed by a universal rule. The fragility highlights the uniqueness of the context, not the existence of a scientific law. The event is fragile because the specific convergence of factors was rare, not because a law dictates that specific week.

  Finally, students often make the mistake of confusing narrative coherence with nomological subsumption. Nomological subsumption means fitting an event under a law. Narrative coherence means making the events intelligible as a story. When a historian says the revolution "would not have happened" without the grain crisis, they are establishing coherence, not proving a law. The error lies in assuming that because the story falls apart without that detail, a universal law must have been violated. In reality, the story simply loses its explanatory power. The fragility belongs to the plot structure, not the physics of society.

  In conclusion, counterfactual fragility mapping reveals that the historian's claim supports the narrative model. The sensitivity of the revolution to the harvest timing demonstrates the specific logical structure of the story, not the presence of hidden covering laws. The explanation works by making the events coherent, not by subsuming them under universal rules.

  ***

  ### Marking Scheme (20 Points Total)

  **Separate Section 1: Logical vs. Causal Dependence (5 Points)**
  *   **5 pts:** Clearly distinguishes logical dependence (story structure) from causal dependence (physical mechanism).
  *   **3 pts:** Mentions both terms but blurs the distinction.
  *   **0 pts:** Fails to mention logical dependence.
  *   *Common Error:* Treating the logical link ("if X then Y in the story") as identical to a physical cause.

  **Separate Section 2: Fragility vs. Covering Law (5 Points)**
  *   **5 pts:** Explicitly argues that fragility does not prove a covering law exists.
  *   **3 pts:** States fragility exists but doesn't explain why it rejects the covering-law model.
  *   **0 pts:** Claims fragility proves a law exists.
  *   *Common Error:* Assuming that because a small change alters the outcome, a precise scientific law must control that change.

  **Separate Section 3: Coherence vs. Nomological Subsumption (5 Points)**
  *   **5 pts:** Identifies the mistake of confusing narrative coherence with nomological subsumption.
  *   **3 pts:** Defines the terms but doesn't apply them to the "mistake."
  *   **0 pts:** Uses neither term.
  *   *Common Error:* Thinking that a "good story" equals a "scientific explanation."

  **Separate Section 4: Synthesis and Conclusion (5 Points)**
  *   **5 pts (A Grade):** Answers the hidden-law objection directly using fragility mapping; concludes narratives are internally fragile, not law-bound.
  *   **3 pts (B Grade):** Describes both theories (covering-law vs. narrative) but ignores the fragility twist; generic summary.
  *   **0 pts:** No clear conclusion.
  *   *Common Error:* Writing a generic comparison of Hempel vs. Narrative without addressing the specific "one-week harvest" scenario.
