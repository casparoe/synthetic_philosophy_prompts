answer: |-
  # Workshop Title: The Definition Shift
  **Duration:** 90 Minutes
  **Participants:** 16 Adults (8 Pairs)
  **Materials Needed:**
  *   8 Tables (2 chairs per table).
  *   1 Deck of 40 "Property Cards" (details below).
  *   16 "Searcher Wallets" (envelopes containing 10 red poker chips or paper tokens per pair).
  *   8 "Criteria Contracts" (paper forms).
  *   8 "Final Declaration" forms.
  *   1 Bell or loud timer.
  *   Small prizes (e.g., gift cards, nice chocolates) for the "Best Deal" and "Most Honest Reflection."

  ---

  ## Part 1: The Setup (0:00 – 0:15)

  **Room Arrangement:**
  Arrange the 8 pairs at separate tables. They are "House Hunting Partners." They must make all decisions jointly.

  **Facilitator Script (Opening):**
  > "Welcome. For the next hour, you are not yourselves. You are a single household looking for a rental property. You have a limited budget of energy and time.
  >
  > On your table, you have an envelope with 10 red chips. These are your **Stress Tokens**.
  > You also have a **Criteria Contract**.
  >
  > Here are the rules:
  > 1. **The Market:** I will reveal three Property Cards every round. You can look at them for free during the round.
  > 2. **The Cost:** If you want to see the *next* round of properties, you must pay 2 Stress Tokens into the center pot *before* I reveal them.
  > 3. **The Stop:** At any point, you can ring the bell. This stops the game for everyone. You must buy the last property you saw.
  > 4. **The Limit:** If you run out of Stress Tokens, you are forced to buy the last property you saw, plus a 'Penalty Card' I will add to your costs.
  > 5. **The Goal:** Find a property that fits your Criteria Contract.
  >
  > Do not ask me if a property is 'good.' The market does not give advice. The market only takes tokens."

  **Activity: The Criteria Contract (10 Minutes)**
  Hand out the Contracts. Each pair must agree on and write down **three non-negotiable criteria**.
  *   *Examples:* "Max Rent $2,000," "Commute under 30 mins," "No street noise."
  *   **Crucial Rule:** They must define the terms. If they write "Quiet," they must define what that means (e.g., "Not on a main road").
  *   **Signature:** Both partners sign. This is now a binding document for the purpose of the game.

  **Facilitator Note:** Walk around. Ensure criteria are specific. If a pair writes "Nice place," make them define "Nice." This creates the baseline against which the "drift" will be measured.

  ---

  ## Part 2: The Search Phase (0:15 – 0:55)

  **The Property Cards (Preparation):**
  Create 40 cards. Each has three stats: **Rent**, **Commute**, **Condition**.
  *   *Distribution:*
      *   Rounds 1-2: Mostly poor fits (High rent or bad commute).
      *   Rounds 3-4: "The Trap." Good on two stats, terrible on one (e.g., Great price, but 90-min commute).
      *   Rounds 5-6: "The Dream." Perfect stats, but very rare (only 2 cards in the whole deck).
  *   *Hidden Info:* Do not tell participants the distribution.

  **The Mechanics of Pressure:**
  1.  **Round Start:** Facilitator places 3 cards face up at each table.
  2.  **Discussion (3 Minutes):** Pairs discuss. They can pick up cards.
  3.  **Decision Point:** Facilitator announces: "Pay to continue, or Ring to Stop."
  4.  **Payment:** If they continue, they drop 2 chips in the center.
  5.  **Repeat:** Do this for up to 6 Rounds.

  **Facilitator Script (Mid-Game Pressure):**
  *   *At Round 3:* "Inventory is moving fast. If you wait for the next round, there is no guarantee these cards will be available." (Even if this isn't mechanically true, it increases the perceived scarcity).
  *   *At Round 4:* Check tables. If a pair has only 2 tokens left, say loudly enough for neighbors to hear: "Table 3 is running low on energy."

  **The "Drift" Trigger (Round 5):**
  If a pair is still searching by Round 5, they are likely stressed. They have spent 8 tokens. They have 2 left. They *must* stop next round or face the Penalty.
  *   *Observation:* Watch for pairs looking at a card that violates their Contract (e.g., the "No street noise" pair looking at a "Main Road" card).
  *   *Action:* Do not intervene. Let them argue.

  **Stopping the Game:**
  When a pair rings the bell:
  1.  All activity freezes.
  2.  That pair stands up.
  3.  They state which card they are buying.
  4.  **The Declaration:** They must read their original Criteria Contract. Then, they must state clearly: "We are keeping this criteria," OR "We are redefining this criteria."
      *   *Example:* "We wrote 'No street noise.' We chose the Main Road apartment. We are redefining 'Quiet' to mean 'Soundproof windows'."
  5.  Record this on the Final Declaration Form.

  **End Condition:**
  The game ends when all pairs have stopped or when Round 6 is complete (forcing everyone to stop).

  ---

  ## Part 3: The Audit & Debrief (0:55 – 1:30)

  **Phase 1: The Score (5 Minutes)**
  Calculate "Winner" based on objective stats (lowest rent + shortest commute - tokens spent). Award the small prize. This validates the "rational" outcome.

  **Phase 2: The Wall of Definitions (15 Minutes)**
  Collect the "Criteria Contracts" and the "Final Declarations."
  On a whiteboard, draw two columns: **Original Definition** | **Final Definition**.
  Ask pairs to read their changes.

  *   *Facilitator:* "Table 1, you wrote 'Commute under 30 mins.' You bought a 50-min commute. What did you write in the Final Declaration?"
  *   *Participant:* "We wrote that 'Commute includes working from home two days a week.'"
  *   *Facilitator:* (Write this on the board). "Did you actually secure a work-from-home agreement during the game?"
  *   *Participant:* "No."
  *   *Facilitator:* "So you solved a physical constraint with a mental assumption."

  **Phase 3: Mapping the Experience (15 Minutes)**
  Do not use academic terms yet. Ask questions that lead them there.

  1.  **The Sunk Cost:** "Raise your hand if you felt you *had* to keep looking because you already spent 6 tokens."
      *   *Connect:* "That pain of the spent tokens is what kept you searching past the point of comfort."
  2.  **The Warp:** "Look at the whiteboard. Every single pair that stopped on a 'flawed' house changed the definition of the flaw, not the house."
      *   *Connect:* "This is the drift. The house didn't change. Your ruler changed."
  3.  **The Social Pressure:** "Did anyone feel they couldn't say 'no' to their partner because the tokens were running out?"
      *   *Connect:* "External pressure accelerates the internal drift."

  **Phase 4: Naming the Phenomenon (5 Minutes)**
  Now, introduce the user's term.

  > "One of you calls this 'Threshold Drift.' In formal study, it is often called 'Satisficing' or 'Aspiration Level Adjustment.'
  >
  > It works like this: You set a threshold for 'Good.' As the cost of searching rises (your tokens), the pain of searching begins to outweigh the pain of settling. To stop the pain of searching, your brain automatically lowers the threshold of 'Good' to match what is available.
  >
  > You didn't just pick a house. You edited your life requirements to fit the house."

  ---

  ## Troubleshooting & Facilitation Notes

  **1. The "Gamer" Problem**
  *   *Risk:* A pair treats this purely as a math puzzle. They count cards, calculate odds, and ignore the emotional weight. They might say, "Statistically, Round 4 is the optimal stop point."
  *   *Correction:* During the debrief, isolate them gently. Ask: "You calculated the odds. But when you signed the Final Declaration, did you feel relief or regret?" Force them to acknowledge the emotional component. If they remain robotic, use them in the debrief as the "Control Group" to contrast with the pairs who felt the anxiety.
  *   *Rule Tweak:* Add a "Fatigue Rule." In Round 4, tell them they must stand while discussing. Physical discomfort reduces cold calculation.

  **2. The Dominant Partner**
  *   *Risk:* One person dictates the choice; the other just nods. The "drift" isn't shared.
  *   *Correction:* During the Criteria Contract phase, require *both* people to write one criterion each. During the Search, enforce a "Silent Minute" where they must look at cards without talking before discussing.
  *   *Facilitator Move:* If you hear one voice dominating, walk over and ask the quiet partner: "Does this meet *your* specific criterion?"

  **3. Stopping Too Early**
  *   *Risk:* A pair stops in Round 1 because they are risk-averse. They don't feel the "drift" because they never felt the "pressure."
  *   *Correction:* In the debrief, ask them: "Did you stop because you found perfection, or because you were afraid to spend the tokens?" Usually, it's fear. Highlight that *fear of cost* is a form of pressure that causes drift just as much as *exhaustion*.

  **4. No One Breaks the Criteria**
  *   *Risk:* The deck is too generous. Everyone finds a house that matches their contract. The lesson fails.
  *   *Correction:* This is why deck stacking is vital. Ensure Round 3 and 4 cards have *deliberate* deal-breakers (e.g., Rent is low, but Condition is "Mold"). If everyone is too happy, intervene in Round 4: "Market Update: Interest rates just ticked up. All future rents effectively increase by 10%." This retroactively makes their current "okay" choice look better, forcing a stop.

  ---

  ## Limitations: What This Workshop Cannot Reproduce

  **1. Irreversibility**
  *   *The Gap:* In this workshop, if they make a bad choice, they get a chocolate bar and go home. In life, signing a lease or accepting a job locks you in for months or years. The "drift" in real life is dangerous because it is hard to undo.
  *   *Facilitator Script:* "Today, if you redefined 'Quiet' to fit a noisy apartment, the only consequence was writing it on a card. In reality, you would have to live with the noise. The danger of Threshold Drift is not that you make a choice, but that you make a *permanent* choice based on a *temporary* exhaustion. You cannot 'play another round' with a career or a marriage as easily as you can with poker chips."

  **2. The Long Tail of Regret**
  *   *The Gap:* The workshop ends immediately after the choice. Participants feel the relief of stopping (the "Search Cost" vanishes). They do not feel the "Opportunity Cost" of the better house that might have appeared in Round 7.
  *   *Facilitator Script:* "Notice how good you felt when you rang the bell. The pressure stopped. That relief is a trick. It feels like success, but it might just be the end of pain. In your real lives, ask yourself: Am I choosing this because it's right, or because I'm tired of looking?"

  **3. External Validation**
  *   *The Gap:* In the game, the Facilitator is neutral. In life, friends and family validate our drift. "Oh, a long commute isn't that bad, think of the podcast time!"
  *   *Facilitator Script:* "If we had let you talk to other tables during the game, you would have convinced each other to lower your standards. 'We took the noisy one, it's fine.' You would have normalized the drift. Be wary of social consensus when you are tired."

  ---

  ## Final Facilitator Checklist
  *   [ ] **Deck Stacked:** Ensure "Perfect" cards are rare and late.
  *   [ ] **Tokens Visible:** Ensure chips are in clear view, not hidden in pockets.
  *   [ ] **Silence Enforced:** During decision moments, stop side conversations between tables.
  *   [ ] **Definitions Captured:** Ensure the "Original" vs. "Final" definitions are written down *before* the debrief starts.
  *   [ ] **Neutrality:** Never hint that a card is "bad." Let them discover the pain.

  By the end of the 90 minutes, the participants will not just understand "Threshold Drift"; they will have a memory of the exact moment they decided to lie to themselves about what they needed in order to make the pain stop. That memory is the lesson.
