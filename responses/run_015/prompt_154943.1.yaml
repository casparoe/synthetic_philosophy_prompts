          4.  Case Verdicts (Original vs. Repaired).
          5.  Closing advice on the Friend's Critique.
      *   *Tone Check:* Ensure I'm auditing, not just answering. Use phrases like "Your position collapses here," "This creates a dilemma," etc.

      *(Self-Correction during drafting)*: Wait, look closely at Case 1 again. "Tourist in a country where tipping isn't done, whose café staff are plainly underpaid."
      *   If tipping *isn't done*, wages presumably *aren't* built on tips (unlike the US). So (4) ("Not tipping where servers' wages are built on the assumption of tips") might not apply.
      *   However, if they are underpaid *generally*, is there a moral duty?
