          5.  Address whether "convention" is being used ambiguously (equivocation).
      *   **Tone:** Academic, rigorous, constructive but critical.

  2.  **Analyze the 7-Point Statement:**
      *   (1) **Lewisian Coordination:** Reason to conform is purely conditional on others conforming (social facts). Arbitrary resolution.
      *   (2) **Moral Wrongs:** Some breaches are moral wrongs (queue-jumping harms specific others).
      *   (3) **Visitor Obligation:** Depends *only* on local force. Not on personal judgment, duration, or intent. (Strong contextualism).
      *   (4) **Moral vs. Conventional:** Not tipping where wages depend on it = Moral Wrong. Jaywalking on empty street = Conventional Failing.
      *   (5) **Generalization Test:** Permissibility test = "What if everyone did that?" (Kantian/Rule Utilitarian flavor).
      *   (6) **Bad Conventions:** No duty to preserve bad conventions. Deviation justified to move to better equilibrium (e.g., inefficient queues, deference).
      *   (7) **Purely Expressive Norms:** Greeting strangers (or not). Visitor should conform. Offense = reason to conform.

  3.  **Identify Tensions/Contradictions:**

      *   *Tension A: (1) vs. (4) & (2).*
          *   (1) says the reason is *exhausted* by coordination facts (arbitrary).
          *   (4) & (2) say some breaches are *moral wrongs* independent of coordination (harm to servers, harm to queue-waiters).
          *   *Conflict:* If the reason is *exhausted* by coordination, where does the moral obligation come from? If it's moral, it's not *just* a Lewisian convention. (1) claims exhaustiveness; (2) and (4) deny it for specific cases.
          *   *Severity:* High. This strikes at the definition of the subject matter.

      *   *Tension B: (3) vs. (6).*
          *   (3) says visitor must follow local convention *not on whether she thinks the convention is a good one*.
          *   (6) says one is justified in deviating to fix a *bad convention* (worse equilibrium).
          *   *Conflict:* If a visitor thinks the local queueing norm is inefficient (bad equilibrium), (3) says "queue anyway," (6) says "you can break it to fix it."
          *   *Severity:* High. This creates a direct action-guidance conflict for the agent.

      *   *Tension C: (5) vs. (1) & Friend's Critique.*
          *   (1) says reason depends on *actual* conformity (empirical).
          *   (5) says permissibility depends on *counterfactual* universalization.
          *   *Friend's Critique:* Conventions tolerate deviation. Universalization kills the convention.
          *   *Conflict:* If everyone jaywalks on an empty street, the convention collapses. Does that make jaywalking impermissible? (4) says jaywalking is merely a conventional failing (permissible-ish). (5) might imply it's impermissible if universalized.
          *   *Severity:* Medium/High. It undermines the test's utility for conventions.

      *   *Tension D: (4) vs. (1).*
          *   (4) treats tipping as moral because of wage structures (consequences/harm), not just coordination.
          *   (1) treats conventions as arbitrary resolutions.
          *   *Conflict:* Is tipping a convention or a moral duty disguised as one? If it's moral, (1)'s "exhausted by social facts" is wrong for this case.

  4.  **Select the Top Tensions (Ranking):**
      *   **#1 Severity:** (1) vs. (2)/(4). The definition of "Convention" vs. "Morality." You can't claim the reason is *exhausted* by coordination (1) while simultaneously claiming some conventions carry independent moral weight (2, 4). This is a category error.
      *   **#2 Severity:** (3) vs. (6). The "Reformist Exception." (3) is rigid ("depends *only* on what is locally in force"); (6) allows breaking norms for improvement. This leaves the visitor without a decision procedure when they encounter a "bad" norm.
      *   **#3 Severity:** (5) The Generalization Test. As the friend noted, this is the wrong tool for conventions. It conflates moral rules with coordination equilibria.

  5.  **Develop Repairs:**
      *   *Repair for #1:* Distinguish "Pure Conventions" (Lewisian) from "Norms with Moral Stakes." Admit (1) only applies to *pure* conventions.
      *   *Repair for #2:* Qualify (3). Add a "harm/justice proviso." You follow local norms *unless* they violate basic moral duties or are significantly inefficient *and* your deviation helps.
      *   *Repair for #5:* Drop (5) for conventions. Use a "Compliance Condition" or "Expectation Harm" test instead.

      *   *Best Single Revision:* Modify (1). Acknowledge that what we colloquially call "conventions" is a mix of Lewisian coordination norms and moralized norms. This fixes the tension with (2) and (4) immediately, which then clarifies (3) and (6).

  6.  **Address the Two Cases:**
      *   *Case 1: Underpaid Tip Jurisdiction (No tipping norm, but underpaid staff).*
          *   *Original View:* (4) says not tipping where wages depend on tips is wrong. But the premise says "country where tipping isn't done." If wages *don't* depend on tips (because it's not done), (4) doesn't trigger. But the prompt says staff are "plainly underpaid." This suggests a moral duty independent of convention. (1) says follow local convention (no tip). (4) says if wages depend on tips, don't tip is wrong. Contradiction in facts? If wages *don't* depend on tips, (4) is silent. If they *do* (despite no norm), then (4) conflicts with (3).
          *   *Repaired View:* Distinguish moral duty from convention. If underpayment is exploitation, moral duty to tip overrides convention.
      *   *Case 2: Tourist Queue-Jumper.*
          *   *Original View:* (2) says queue-jumping wrongs specific people (moral). (3) says follow local norm (queue). Verdict: Must queue.
          *   *Repaired View:* Same verdict, but clearer reasoning (harm to others > tourist status).

  7.  **Address Equivocation:**
      *   Yes, "Convention" is doing too much work. It covers: (a) Arbitrary coordination (Jaywalking), (b) Moralized norms (Queueing), (c) Economic structures (Tipping).

  8.  **Drafting the Response:**
      *   *Structure:*
          1.  Executive Summary (The Equivocation).
          2.  Ranked Tensions (1 & 2).
