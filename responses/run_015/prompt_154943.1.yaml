answer: |-
  Here is an audit of your position. I have treated this as a reading-group critique: I am looking for structural integrity, not nitpicking phrasing.

  ### 1. The Equivocation Warning
  You asked me to flag this explicitly if it appeared: **Yes, you are using "convention" to do three different jobs.**
  1.  **Pure Coordination:** (Jaywalking on empty streets, greeting strangers). Arbitrary, solved by common knowledge.
  2.  **Moralized Norms:** (Queueing). Convention-shaped, but breaches cause specific harm to identifiable others.
  3.  **Structural/Economic Norms:** (Tipping). Convention-shaped, but breaches implicate systemic fairness or livelihood.

  Your troubles stem from trying to run a single engine (Lewisian coordination) on three different fuels. This is the root of the tensions below.

  ### 2. Ranked Tensions

  **Tension #1 (Severity: Critical): (1) vs. (2) and (4)**
  *   **The Conflict:** In (1), you claim the reason to conform is *exhausted* by social facts (others do it, they expect it). It is arbitrary. In (2) and (4), you claim breaches can be *moral wrongs* (harming queue-waiters, underpaying servers). If the reason is *exhausted* by coordination, there is no conceptual space for a moral wrong independent of that coordination. You cannot have it both ways: either the norm is a Lewisian convention (arbitrary, coordination-based) or it is a moral duty (harm-based).
  *   **What Must Give:** You must abandon the claim in (1) that the reason is *exhausted* by social facts for *all* cases.
  *   **Cost:** You lose the elegance of a unified theory. You have to admit that what laypeople call "conventions" are actually a mix of coordination norms and moral norms.
  *   **Cheaper Repair:** Qualify (1). State that (1) applies only to *pure* conventions (like jaywalking on empty streets), whereas (2) and (4) describe norms that *look* like conventions but have independent moral stakes.

  **Tension #2 (Severity: High): (3) vs. (6)**
  *   **The Conflict:** (3) states the visitor's obligation depends *only* on what is locally in force, explicitly excluding whether the convention is "a good one." (6) states that deviating to move a group from a worse equilibrium to a better one is *justified*. If a visitor encounters a "bad" local convention (e.g., a deference norm that wastes time), (3) says "conform," and (6) says "you may deviate." This leaves the agent with no decision procedure.
  *   **What Must Give:** The absolutism of (3).
  *   **Cost:** You lose the clean, bright-line rule for visitors. You introduce a judgment call (is this convention "bad" enough to break?).
  *   **Cheaper Repair:** Add a proviso to (3): "A visitor must follow local convention *unless* doing so violates a moral duty or perpetuates a significantly inefficient equilibrium where deviation is unlikely to cause retaliation."

  **Tension #3 (Severity: Medium): (5) vs. The Nature of Conventions (Friend's Critique)**
  *   **The Conflict:** Your friend is correct. The Generalization Test (Kantian/Rule-Utilitarian) is designed for moral maxims, not coordination equilibria. Conventions *require* a non-zero rate of deviation to remain conventions (if everyone always queued perfectly, it wouldn't be a norm, it would be physics). If you universalize "jaywalk on empty streets," the convention collapses, but the act remains harmless. If the test renders the act impermissible because the convention would vanish, you have proven too much.
  *   **What Must Give:** (5).
  *   **Cost:** You lose your preferred metric for permissibility.
  *   **Cheaper Repair:** Replace (5) with a "Harm/Expectation Test" for conventions: Is anyone harmed? Are reasonable expectations violated? This aligns better with (2) and (4).

  ### 3. The Single Best Revision
  **Revise (1) to create a Typology of Norms.**
  Do not try to force tipping and queueing into the Lewisian box of (1). Instead, rewrite (1) to say: *"We distinguish between Pure Conventions (arbitrary coordination) and Moralized Norms (conventions that protect specific interests)."*

  *   **Why this cleans up the most:**
      *   It resolves Tension #1 immediately by admitting (2) and (4) are not examples of (1).
      *   It resolves Tension #2 because (3) can now apply strictly to Pure Conventions, while Moralized Norms are governed by (2) and (4).
      *   It makes (5) unnecessary for Pure Conventions (coordination is the test) and keeps it available for Moralized Norms (generalization works for harm).
      *   It clarifies the Equivocation warning.

  ### 4. Verdicts on the Two Cases

  **Case A: The Underpaid Server (No tipping norm, but staff underpaid)**
  *   **Under Original View:** **Verdict: Ambiguous/Contradictory.**
      *   (3) says follow local convention (don't tip).
      *   (4) says not tipping is wrong *only* "where servers' wages are built on the assumption of tips." In a no-tipping country, wages presumably *aren't* built on tips. So (4) is silent.
      *   (1) says reason is exhausted by coordination (no one tips, so don't tip).
      *   *Result:* The view forbids tipping via (3) and (1), but offers no moral cover for the underpayment via (4). You are left with a moral intuition (help the underpaid) that your theory cannot validate.
  *   **Under Repaired View (Typology):** **Verdict: Permissible (and perhaps required).**
      *   Tipping here is not a "convention" issue; it is a distributive justice issue. The "Pure Convention" (no tipping) is overridden by the general moral duty not to exploit/ignore severe underpayment if one can afford to help. The distinction allows you to say: "Follow the convention of *how* to pay, but the *amount* is a moral question."
  *   **Reasoning Change:** Yes. Originally, you were stuck trying to fit this into "local force." Now, you treat it as a moral override on a local convention.

  **Case B: The Obvious Tourist Queue-Jumper**
  *   **Under Original View:** **Verdict: Wrong.**
      *   (2) says queue-jumping wrongs specific people (moral).
      *   (3) says follow local convention (queue).
      *   *Result:* Clear prohibition.
      *   *Problem:* (3) says obligation depends *only* on local force, not on being a tourist. But (2) makes it moral. If it's moral, why does (3) emphasize "local force"? It implies if he were in a non-queueing city, it wouldn't be wrong. This suggests the wrongness is contingent on the convention, which weakens the "moral" claim in (2).
  *   **Under Repaired View (Typology):** **Verdict: Wrong.**
      *   Queueing is a "Moralized Norm" (protects against harm/cutting).
      *   The visitor's status is irrelevant because the constraint is moral (harm to others), not conventional (coordination).
  *   **Reasoning Change:** Yes. In the original, the wrongness feels contingent on the city's habit. In the repair, the wrongness is grounded in the harm to the people behind him, which exists regardless of the city, though the *expectation* is localized.

  ### 5. Note on the Friend's Critique (Point 5)
  Your friend is right, but for the wrong reason. It's not just that conventions tolerate deviation; it's that the Generalization Test asks "What if the *rule* changed?" whereas Conventions ask "What is the *current* equilibrium?"
  *   **Advice:** Drop (5) entirely for the talk. It invites the exact confusion you are experiencing. Replace it with: *"For pure conventions, the test is coordination stability. For moralized norms, the test is harm."* This is cheaper and stronger.

  ### Summary for the Talk
  1.  **Admit the Equivocation:** Start by distinguishing Pure Conventions from Moralized Norms.
  2.  **Drop the Generalization Test:** It's the wrong tool for coordination problems.
  3.  **Qualify the Visitor's Duty:** They must follow Pure Conventions (greetings, jaywalking) but must obey Moralized Norms (queueing, wage structures) because those are moral duties, not just local habits.

  This saves your core intuition (visitors should generally blend in) without forcing you to defend the indefensible (that tipping an underpaid server is wrong because "locals don't do it").
