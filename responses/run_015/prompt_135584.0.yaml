  **MEMORANDUM**

  **TO:** Participatory Climate Budget Advisory Board
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Voter Eligibility (Demos) for Flood Infrastructure Vote

  Colleagues,

  We are stuck between two legitimate democratic principles. The "all-affected" argument is morally sound: floodwaters do not respect city lines. Excluding our neighbors in the three townships from deciding on watershed infrastructure treats them as subjects of our decisions rather than partners. However, the accountability concern is equally valid. If voters who do not elect our City Council can dictate budget allocations, we break the link between taxation, representation, and responsibility.

  The proposal to grant proxy votes via employers is a non-starter; it privileges economic presence over human stakeholder status.

  **Recommendation**
  I propose we expand eligibility for this specific vote to **verified residents of the City plus the three named neighboring townships.** To protect democratic accountability, passage requires a **double majority**: a majority of City residents voting AND a majority of the total combined vote.

  This respects the physical reality of the watershed (addressing the all-affected principle) while ensuring City residents retain veto power over their own budget (addressing the accountability principle). Neighbors get a voice, but not a veto.

  **Implementation Timeline**
  *   **Nov 1–14:** Verification period. Township clerks collaborate with City to validate resident addresses against voter rolls.
  *   **Nov 15–21:** Voting window. Online and in-person ballots marked by residency zone.
  *   **Nov 22:** Certification. Results validated only if both majority thresholds are met.

  This is a narrow exception for climate infrastructure, not a precedent for general elections. I ask that you review this mechanism before Tuesday. If you believe the double majority still fails to protect accountability, come prepared to suggest a different safeguard, not a narrower border.

  ***

