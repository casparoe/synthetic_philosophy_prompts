      *   *Argument for Non-Identity (Leibniz's Law):* The lump existed before the statue (when it was just molten bronze). The lump can survive melting; the statue cannot. Therefore, they have different modal properties. Therefore, they are not identical.
      *   *Argument for Constitution:* The statue is *constituted* by the lump, but not *identical* to it.
      *   *Emotional Resonance:*
