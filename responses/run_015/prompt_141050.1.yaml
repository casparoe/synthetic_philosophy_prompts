answer: |-
  Here is a 50-minute battle plan designed to stop the collapse of the distinction and force students to see the *costs* of perdurantism.

  ### 1. The Board Plan (Do this before they sit down)
  Do not write the definitions yet. Write the **Problem** and the **Example**.

  **Left Panel: The Problem of Change**
  1.  Leibniz's Law: If $x = y$, $x$ and $y$ share all properties.
  2.  The Pencil at $t_1$: Sharp, Mass $M$.
  3.  The Pencil at $t_2$: Dull, Mass $M/2$.
  4.  **Contradiction:** The pencil is Sharp AND Not-Sharp.

  **Center Panel: The Two Solutions**
  *Draw a timeline.*
  *   **Endurantism:** Draw one oval spanning $t_1$ to $t_2$. Label: "Numerically Identical."
  *   **Perdurantism:** Draw a long rectangle (worm) divided at $t_1$ and $t_2$. Label: "Distinct Temporal Parts."

  **Right Panel: The "Wholly Present" Trap (Leave blank until min 25)**
  *   *Do not write the definition yet.* This is where you intervene.

  ---

  ### 2. Session Timeline & Script

  #### 0–5 mins: Triage the Handout Damage
  Your handout says "objects are four-dimensional." Students hear "objects exist in time." You need to separate *location* from *extension*.
  *   **Say:** "The handout says objects are 4D. That is the *conclusion* of perdurantism, not the starting point. If we start there, endurantism looks like a mistake. Today we start with the **Problem of Change**. Both views try to solve the contradiction on the Left Panel. They just disagree on the cost of the solution."
  *   **Action:** Do not spend more than 5 minutes here. If they argue physics, park it.

  #### 5–20 mins: The Pencil (The Core Example)
  Stick with the **Pencil**. Do not switch to Sourdough.
  *   **Why:** Sourdough introduces *constitution* (is it the flour or the culture?) and *lineage* (Ship of Theseus). That is a debate about *persistence conditions* (what makes it the same object?), not *persistence modes* (how does it exist through time?). Using it now will conflate the two debates. Keep the pencil; it isolates *intrinsic change*.
  *   **Task:** Ask them to solve the Contradiction on the Left Panel without using the words "endurance" or "perdurance."
  *   **Expected Output:** They will say "It's sharp *at* $t_1$ and dull *at* $t_2$."
  *   **Push:** "Okay, but what is the 'It'? Is the 'It' at $t_1$ the exact same thing as the 'It' at $t_2$?"

  #### 20–25 mins: Formalize the Views (Center Panel)
  Now map their intuitions to the Center Panel.
  *   **Endurantism:** The *whole* pencil is at $t_1$ and the *whole* pencil is at $t_2$. It changes properties.
  *   **Perdurantism:** The *pencil-worm* exists at $t_1$ and $t_2$. The $t_1$-part is sharp. The $t_2$-part is dull. The worm itself doesn't change properties; it has different parts with different properties.

  #### 25–35 mins: Defuse the "Wholly Present" Trap
  This is the critical moment where your previous tutorials died.
  *   **The Trap:** Students define "wholly present" as "all its parts exist at $t$." The perdurantist agrees (the $t$-slice has all its *spatial* parts). The distinction vanishes.
  *   **The Fix:** Write on the **Right Panel**:
      *   **Endurantist:** Object at $t_1$ **=** Object at $t_2$ (Numerical Identity).
      *   **Perdurantist:** Object at $t_1$ **$\neq$** Object at $t_2$ (Distinct Parts).
  *   **Say:** "Stop defining 'wholly present' as 'all parts exist.' Define it as 'numerical identity.' For the endurantist, the thing here now is *literally the same number* as the thing there then. For the perdurantist, they are different parts of a larger whole, like the London part of the M1 is not the Birmingham part."
  *   **Check:** Ask a student: "On perdurantism, is the pencil at $t_1$ identical to the pencil at $t_2$?" If they say "Yes," they haven't understood. It must be "No."

  #### 35–40 mins: The Git Analogy (Use it here)
  You asked about the version-control analogy. **Use it now** to explain the "Hundreds of Pencils" objection, not the nature of parts.
  *   **The Analogy:**
      *   **Perdurantist:** "The File" = The entire Git history (the branch). A "commit" = a temporal part.
      *   **Endurantist:** "The File" = The working directory (the current state).
  *   **The Point:** When a perdurantist says "There are hundreds of pencils," they mean "There are hundreds of commits in the history."
  *   **The Objection:** Why reject perdurantism? Because it multiplies entities. "Do I really have to believe there is an object called 'The Pencil-Worm' distinct from 'The Pencil-Part-at-$t_1$'?"
  *   **Why this works:** It shows perdurantism isn't "wrong," it's *ontologically expensive*. It buys a solution to change by populating the universe with time-slices.

  #### 40–45 mins: Addressing the "Big Fears"
  Briefly head off the two big misconceptions so they don't derail the Q&A.
  1.  **"Nothing Changes":** Perdurantists *do* believe things change. They just say change is *qualitative variation across parts*, not *numerical identity across time*. It's derivative change, not fundamental change.
  2.  **"Block Universe":** Explicitly decouple them. "You can be a perdurantist and think only the present exists (Presentism), though it's awkward. Perdurantism is about *objects*, Eternalism is about *time*. Don't confuse the two."
  3.  **"So there are hundreds of pencils":** Treat this as the **cost**, not the refutation. "Yes, that is the price of the ticket. Endurantism refuses to pay that price, but then struggles to explain how the pencil survives the sharpening."

  #### 45–50 mins: The Final Question
  You need a sentence where the truth values *must* differ. Do not ask for a definition. Ask for a truth value.

  **Write on Board:**
  > "The pencil existing at 9:00 AM is **identical to** the pencil existing at 9:05 AM."

  **Instruction:** "Answer True or False. If you say True, you are an Endurantist. If you say False, you are a Perdurantist. You cannot say 'It depends on what you mean by pencil.' You must commit to the metaphysics."

  *   **Why this works:** It forces them to abandon the "wholly present" shield. The Endurantist *must* affirm identity despite property change. The Perdurantist *must* deny identity to avoid contradiction. There is no middle ground.

  ---

  ### 3. What to Exclude (Say this out loud)
  At the start (min 2), draw a box on the board labeled **"Out of Bounds."** Write:
  1.  **Special Relativity:** "We are doing metaphysics, not physics. Simultaneity issues are for next term."
  2.  **Stage Theory:** "We are discussing Worm Theory (Classical Perdurantism). Stage theory is a variant that complicates the identity conditions. We stick to Worms."
  3.  **Sourdough/Theseus:** "That is about *constitution*, not *persistence*. We stick to the Pencil."

  ### 4. Summary of Fixes for Your Specific Pain Points
  *   **"Objects are 4D" damage:** Spend 5 mins max reframing it as "Extended in time" vs "Located in time."
  *   **Sourdough:** Drop it as the lead. It muddies constitution with persistence. Use the Pencil.
  *   **"Wholly Present" collapse:** Redefine it on the board as **Numerical Identity** ($=$) vs **Distinct Parts** ($\neq$).
  *   **Git Analogy:** Use it in the "Objections" phase to explain ontological proliferation, not to define temporal parts (use the Road/M1 analogy for parts).
  *   **"Nothing Changes/Block Universe":** Explicitly decouple them. Change is derivative; Eternalism is separate.
  *   **Final Question:** The Identity Sentence ("$O_{t1} = O_{t2}$").

  ### 5. Why They Will Reject Perdurantism (The Takeaway)
  To ensure they leave knowing why someone rejects it, drive this home in the last 5 minutes:
  "We reject perdurantism not because it's false, but because it violates **parsimony** and **phenomenology**. It says I am not *here now*, only a slice of me is. It says there are thousands of 'mes' in this room. Endurantism saves the intuition that *I* am the one moving through time, but pays for it with the Problem of Change. Pick your poison."
