answer: |-
  Sam stared at the budget sheet, tapping her pen against the proposal for the international disaster-relief fund while the committee chair rubbed their temples. "Look, if we fund the pantry, we're maintaining a concrete relationship here, sure, but my point is about chains of attentive responsibility," she said, looking up at Riley. "When we care for our local community, that labor isn't isolated; it attunes us to how our consumption and policies ripple outward. So even if we never meet a climate refugee, our local care work generates an indirect duty to them because we're emotionally tracking the harm our shared structures cause." Riley sighed, leaning back in the cheap committee chair and spinning a pen between her fingers. "But that sounds like you're just tracking causal impact with extra vocabulary. If the duty exists because our local actions affect them, you're mapping a causal chain, not a care relationship. You're saying we owe them because of what our actions *do*, not who we *are* to them."

  "It's not about the outcome, it's about the presence," Sam countered, frustration creeping into her voice as she gestured between the two proposals. "Consequentialism asks what maximizes good down the line; care ethics asks if we're maintaining the relational web that makes life possible. If we ignore the refugees, we're severing a link in the web of attention that sustains the pantry patrons too." Riley shook her head, picking up the proposal for the local food pantry and weighing it in her hand. "But once you try to formalize that web to include strangers, you've abandoned the particularity that makes care ethics interesting. You're just building a worse version of utilitarianism where 'relational maintenance' is the utility metric. If you can't point to a specific person you're responding to, you're not doing care, you're doing abstract moral math."

  The committee chair cleared their throat, reminding them the fixed budget meant picking one before the hour was up. Sam looked at the international fund, then at Riley, her pen hovering over the paper. "So you'd cut the aid? Even knowing the causal link?" "I'd fund the pantry because that's where the actual care relation exists," Riley said, closing the folder with a definitive thud. "Everything else is just guilt management disguised as ethics." Sam didn't pick up her pen, leaving the vote hanging between them as the silence stretched out. "Then care ethics has no answer for a globalized world," she muttered, staring at the table.
