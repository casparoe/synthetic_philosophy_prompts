answer: |-
  (a) Exam Question

  **Time Allowed:** 90 Minutes
  **Word Limit:** Approximately 800 words

  **Prompt:**

  Situationist critics in moral psychology argue that empirical evidence shows human behavior is driven more by situational variables than by robust, cross-situational character traits. In response, consider the following proposed defense known as the "Threshold Model." According to this model, virtues are not global traits but domain-indexed dispositions that manifest only when a context-sensitive threshold of moral demand is satisfied. Furthermore, these dispositions are governed by a second-order meta-cognitive capacity through which the agent recognizes which domains are appropriate for the exercise of each disposition.

  Write an essay assessing whether the Threshold Model successfully defends virtue ethics against the situationist critique. Your analysis must address the following three issues:

  1.  **Character Integrity:** Does defining virtues as domain-indexed dispositions preserve the normative idea that virtue is a genuine feature of character, or does it reduce virtue to a cluster of situation-specific behavioral patterns?
  2.  **Meta-cognitive Vulnerability:** Does the second-order meta-cognitive capacity function as a global trait that is itself vulnerable to situationist debunking, thereby undermining the model?
  3.  **Moral Education:** Can this model provide a non-circular account of moral education and character improvement, or does it presuppose the very capacity it seeks to explain?

  Conclude with a definitive judgment on whether localizing virtue in this manner saves the theory or dissolves it.

  ***

  (b) Model Answer

  The situationist challenge posits that empirical data reveals a lack of cross-situational consistency in human behavior, suggesting that robust character traits are folk-psychological fictions. The Threshold Model attempts to salvage virtue ethics by fragmenting traits into domain-specific dispositions activated only when moral demand exceeds a certain threshold, managed by a meta-cognitive overseer. While this model offers a sophisticated retreat from the demand for global consistency, it ultimately fails to secure virtue ethics because it concedes too much to situationism regarding character integrity, invites a regress problem regarding meta-cognition, and struggles to explain moral development without circularity.

  Regarding character integrity, the Threshold Model risks dissolving the very notion of character it seeks to save. Traditional virtue ethics relies on the idea that a virtuous person possesses a unified disposition to act well across varied contexts. By indexing virtues to specific domains and thresholds, the model approximates the situationist claim that behavior is fragmented. If courage manifests only in physical danger above a specific intensity but not in social risk, the agent lacks a unified courageous character. They possess merely a set of conditional responses. While the proponent might argue that the threshold ensures the trait is robust within its domain, this localization makes virtue indistinguishable from the situation-specific behavioral patterns described by critics. If the "character" is merely the sum of these fragmented thresholds, the normative force of virtue ethics—which demands a holistic excellence of personality—is lost. The model saves the terminology of virtue but empties it of its unified psychological reality.

  The second issue, meta-cognitive vulnerability, presents a fatal structural weakness. The model relies on a second-order capacity to recognize appropriate domains and thresholds. For this system to function reliably, this meta-cognitive capacity must itself be stable across situations. However, if situationism holds that psychological capacities are generally sensitive to irrelevant situational variables, this overseer capacity is equally vulnerable. If an agent's ability to recognize moral demand is disrupted by fatigue, mood, or social pressure, the threshold mechanism fails. To avoid this, the defender must claim this meta-cognitive capacity is a global trait resistant to situationist factors. But this reintroduces the very global trait that situationists deny exists. Thus, the model faces a dilemma: either the meta-cognitive capacity is local and unreliable, rendering the virtues unstable, or it is global, making the model vulnerable to the original situationist critique. It cannot have it both ways.

  Finally, the account of moral education faces a circularity problem. Character improvement requires learning to recognize thresholds and appropriate domains. However, correctly identifying when a moral demand is sufficient to trigger a virtue requires practical wisdom. If the agent lacks the virtue, they presumably lack the meta-cognitive capacity to identify the domain correctly. Teaching an agent to recognize thresholds presupposes they already possess the sensitivity they are meant to acquire. A non-circular account requires a mechanism by which one learns to perceive moral demand without already possessing the capacity to perceive it. The Threshold Model offers no such mechanism; it assumes the meta-cognitive governor is either innate or acquired through a process that remains unexplained. Without a clear path to acquiring this second-order capacity, the model cannot explain how agents become virtuous, rendering it practically inert.

  In conclusion, the Threshold Model does not successfully defend virtue ethics. While it attempts to accommodate empirical data by localizing traits, this localization reduces character to fragmented behavioral patterns, undermining the holistic nature of virtue. Furthermore, by relying on a meta-cognitive capacity, it either succumbs to situationist debunking or smuggles in a global trait, and it fails to explain how such a capacity is developed without circularity. Localizing virtue in this manner does not save the theory; it dissolves the unity of character required for virtue ethics to remain distinct from situationism. The model is a strategic retreat that surrenders the core territory.

  ***

  (c) Marking Scheme

  **Total Points:** 20
  **Structure:** 5 Argumentative Moves (4 points each)

  **1. Reconstruction of the Dialectic (4 Points)**
  *   **Criteria:** Accurately distinguishes the situationist challenge (lack of cross-situational consistency) from the Threshold Model's specific solution (domain-indexing + meta-cognitive threshold).
  *   **A Answer (4 pts):** Clearly articulates the tension between global traits and fragmented dispositions without mere summary; sets up the stakes of the evaluation.
  *   **B Answer (2-3 pts):** Summarizes the prompt definitions correctly but fails to frame them as a problematic tension; treats the model as a fixed fact rather than a proposal to be tested.
  *   **Failure Mode:** Confusing the Threshold Model with standard Aristotelianism or misrepresenting the situationist claim as simply denying morality exists.

  **2. Analysis of Character Integrity (Issue 1) (4 Points)**
  *   **Criteria:** Evaluates whether domain-indexing preserves character unity or reduces it to behavioral patterns.
  *   **A Answer (4 pts):** Identifies that excessive fragmentation makes virtue indistinguishable from situationist behavioral clusters; critiques the loss of normative unity.
  *   **B Answer (2-3 pts):** Asserts that the model preserves character because "traits still exist," without addressing the fragmentation problem or the definition of character unity.
  *   **Failure Mode:** Accepting the model's definition of character without questioning whether it meets the traditional normative requirements of virtue ethics.

  **3. Analysis of Meta-cognitive Vulnerability (Issue 2) (4 Points)**
  *   **Criteria:** Identifies the dilemma regarding the second-order capacity (either it is global/vulnerable or local/unreliable).
  *   **A Answer (4 pts):** Explicitly traces the regress or dilemma: if the manager is global, situationism applies; if local, the system is unstable.
  *   **B Answer (2-3 pts):** Discusses the meta-cognitive capacity but fails to see it as a potential point of failure for situationist critique; treats it as a magic bullet.
  *   **Failure Mode:** Ignoring the possibility that the meta-cognitive capacity itself is subject to situational variance.

  **4. Analysis of Moral Education (Issue 3) (4 Points)**
  *   **Criteria:** Assesses whether the model explains character improvement without presupposing the capacity it seeks to build.
  *   **A Answer (4 pts):** Identifies the circularity: recognizing thresholds requires the very wisdom the education is supposed to produce.
  *   **B Answer (2-3 pts):** Describes how education might work generally but fails to apply the specific constraint of the Threshold Model's circularity risk.
  *   **Failure Mode:** Providing a generic account of moral learning that ignores the specific mechanism (threshold recognition) proposed in the prompt.

  **5. Synthesis and Verdict (4 Points)**
  *   **Criteria:** Provides a definitive conclusion on whether the model saves or dissolves virtue ethics, based on the preceding analysis.
  *   **A Answer (4 pts):** Conclusion follows logically from the three critiques; offers a nuanced judgment on the trade-off between empirical accuracy and normative power.
  *   **B Answer (2-3 pts):** Offers a conclusion that is disconnected from the arguments made (e.g., "It works mostly") or hedges excessively without taking a stand.
  *   **Failure Mode:** Ending the essay without a clear verdict or contradicting the analysis provided in the body paragraphs.
