answer: |-
  The dust motes dancing in the shaft of afternoon sunlight were the first clue. They didn't drift randomly; they traced perfect, microscopic ellipses. Elara noticed it during third-period History, while Mr. Henderson droned on about dates that felt less like history and more like script.

  She had read about Kurt Gödel in a dusty paperback from the back of the library. The logician who befriended Einstein. The man who proved that if the universe spins just so, time doesn't flow like a river. It pools. It curls back on itself like a fern frond. A closed timelike curve. If you fly fast enough in a rotating universe, Gödel said, you can fly into your own yesterday.

  Elara didn't have a rocket ship. She just had a town called Oakhaven, and a feeling that the world was turning slightly faster than it should.

  It wasn't a violent loop. No one screamed. No one vanished. It was subtle. It was the way the school bell rang with the exact same metallic twang every day, not similar, but *identical*. It was the way the barista at the coffee shop dropped a spoon at 7:14 AM, caught it, and smiled with the exact same crinkle around her eyes.

  But Elara remembered. That was the cruelty of it. Her memory was a straight line drawn on a spinning sphere. She accumulated days while the world reset. She was the only one carrying the weight of the extra seconds.

  Today, she decided to test the curvature.

  She took out a sheet of notebook paper, lined blue. The pen was heavy in her hand. She wasn't writing to a friend. She was writing to the girl who sat in this desk yesterday, the girl who hadn't yet noticed the dust motes spinning in ellipses.

  *Don't go to the park after school,* she wrote. *Stay home. It's all seperate.*

  She paused. She always misspelled "separate." It was a tiny human flaw, a fingerprint of her specific timeline. She underlined the word. *Seperate.*

  She folded the note and slipped it into the back pocket of her jeans, intending to leave it in her locker for yesterday's self to find. But as she looked down, the ink began to shimmer.

  It wasn't bleeding. It was migrating.

  The letters of *seperate* writhed like small black insects. The 's' sharpened into an angle. The 'p' lost its loop. Within seconds, the word wasn't English anymore. It wasn't any language Elara knew. It looked like geometry made of ink—sharp, vertical strokes, intersecting lines that hurt her eyes if she focused too long.

  It was a language she didn't know *yet*.

  A chill that had nothing to do with the classroom air conditioning walked up her spine. Causality wasn't just protecting the timeline; it was encrypting it. The note was trying to travel backward, but the universe demanded a toll. To read this message, she would have to live through enough loops to learn the tongue of the future. The note wasn't for the Elara of yesterday. It was for an Elara ten cycles from now, an Elara who might finally understand the script.

  She looked up. Mr. Henderson dropped his eraser. It hit the floor with a soft *thump*.

  "Oops," he said.

  He had said that yesterday. He had said that the day before.

  Elara looked back at the paper. The rest of the sentence was dissolving too. *Don't go to the park* was becoming a series of waves. *It's all* was becoming a circle. Only the misspelling remained partially intact, a scar of her own imperfection resisting the cosmic correction.

  She realized then what Gödel had meant when he said time wasn't objectively real. Time wasn't a thing out there, ticking on a clock tower. It was a sensation, like hunger or cold. And she was the only one hungry in a room full of people who had already eaten.

  The bell rang. The metallic twang. Identical.

  Elara crumpled the note. She didn't throw it away. She put it in her pocket, next to the lint and the loose change. She would keep it. She would collect them all. Maybe one day, after enough rotations, after the dust motes had spun in their ellipses a million more times, she would wake up and look at the crumpled ball of paper and finally be able to read it.

  She stood up and walked into the hallway. The crowd of students moved like water flowing uphill, unaware they were walking in a circle. Elara walked with them, alone in her straight line, carrying the weight of a future language in her pocket, waiting for the universe to stop spinning long enough for her to speak.
