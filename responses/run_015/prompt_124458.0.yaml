answer: |-
  Here is a preparation sheet for your question period. I have ordered these by the product of likelihood and potential damage. The phrasing mimics the specific disciplinary anxieties you described.

  ### 1. The Equilibrium Objection (The Game Theorist)
  **"You've conceded this isn't a Nash equilibrium. If I deviate to $p=1$ while everyone else plays your policy, my expected payoff increases by a factor of roughly $N$. Why should I call this 'rational' if it invites exploitation by any agent who doesn't share your specific metaphysical commitments?"**

  *   **Grant:** Immediately concede that a unilateral deviator gains significantly and that this is not a Nash equilibrium.
  *   **Reply:** "Nash equilibrium assumes that my choice of strategy is probabilistically independent of yours. Superrationality assumes that because we are identical reasoners facing identical data, our outputs are correlated. If you deviate, you are no longer running the 'identical reasoning' stipulated by the thought experiment; you have effectively left the reference class. The policy is stable *within* the class of superrational agents, which is the only context where the problem is defined."
  *   **Soft Spot:** This assumes the other players *know* you are superrational and that this knowledge constrains their rationality. A standard game theorist will say rationality *requires* deviation if it pays, regardless of reference classes.

  ### 2. The Causal Mechanism Objection (Causal Decision Theorist #1)
  **"You claim my deliberation is correlated with theirs. What is the causal structure here? Are you positing backwards causation, or a common cause? If there is no causal link between my rolling the die and theirs, why does decision theory allow me to condition my action on their outcome?"**

  *   **Grant:** Concede there is no causal influence between your die roll and theirs at the time of sending.
  *   **Reply:** "It is not causal correlation; it is logical correlation. We are instantiating the same algorithm. When I decide what output this algorithm should produce, I am effectively deciding what output *all* instances of this algorithm produce. You don't need a causal link between two calculators to know they will display the same number if they run the same code on the same input."
  *   **Soft Spot:** CDTs reject logical correlation as decision-relevant. They argue that *my* pressing the button cannot change what *they* do, even if it predicts it. This reply assumes Functional Decision Theory (FDT) without naming it, which they may reject as question-begging.

  ### 3. The Probability Bound Objection (Grad Student / Physicist)
  **"Your formula for the Noisy Courier is $p = 1/(N(1-\epsilon))$. If $N=2$ and the noise $\epsilon$ is $0.6$, your probability $p$ is $1.25$. Probabilities cannot exceed one. Does your correction collapse for moderate noise?"**

  *   **Grant:** Concede immediately that the formula is an approximation valid only for small $\epsilon$ or large $N$.
  *   **Reply:** "You are quite right; the linear approximation breaks down as $\epsilon$ approaches $1 - 1/N$. The rigorous policy is to choose $p$ to maximize the binomial probability of exactly one arrival, capped at $p=1$. The qualitative point remains: the optimal $p$ is strictly greater than $1/N$ whenever $\epsilon > 0$, but I should have specified the boundary condition."
  *   **Soft Spot:** This undermines the elegance of your "simple correction." It suggests the rule is not a fundamental principle but a perturbative fix. **(See advice below on conceding this in the paper).**

  ### 4. The Evolutionary Stability Objection (Evolutionary Game Theorist)
  **"In biological or cultural evolution, strategies are selected by payoff. A population of your superrational agents would be invaded and wiped out by a mutant strategy that simply sends with probability one. If it can't evolve, in what sense is it rational for real organisms?"**

  *   **Grant:** Concede that the strategy is not Evolutionarily Stable (ESS) against unconditional defectors.
  *   **Reply:** "Superrationality is not a blind heuristic; it requires the cognitive capacity to recognize symmetry and model other agents. It evolves only in populations where agents can identify 'like' reasoners and condition their strategy on that recognition. It is rational for high-fidelity cognitive agents, not for simple replicators."
  *   **Soft Spot:** This restricts the applicability of your thesis to a very narrow class of agents (perhaps only humans or AIs), weakening its claim as a general theory of rational action.

  ### 5. The 'Smuggled Utilitarianism' Objection (Kantian Moral Philosopher)
  **"You claim this is about rationality, but you are maximizing group expected value. Isn't this just act utilitarianism dressed in the language of decision theory? You've derived an 'ought' from a 'want' for collective payoff."**

  *   **Grant:** Concede that the *outcome* matches what a utilitarian calculator would choose.
  *   **Reply:** "The derivation is different. A utilitarian chooses the act that *causes* the best outcome. I am choosing the act that is consistent with being a member of a class of agents who *produce* the best outcome via logical correlation. It is a constraint on consistency of reasoning, not a moral imperative to maximize good."
  *   **Soft Spot:** The distinction between 'consistency of reasoning' and 'moral duty' is thin here. A Kantian may argue that if the outcome is the sole justification, the motive is consequentialist regardless of the derivation.

  ### 6. The 'Evidential Decision Theory' Label (Causal Decision Theorist #2)
  **"This looks exactly like Evidential Decision Theory (EDT). You are conditioning on the news that others send. Why should we resurrect EDT when we know it fails in cases like the Smoking Lesion?"**

  *   **Grant:** Concede that the mathematical formalism resembles EDT.
  *   **Reply:** "Standard EDT conditions on correlations that might be spurious (like the lesion). Superrationality conditions on correlations that are *constitutive* of the decision itself. I am not treating my action as evidence of theirs; I am treating my action as the *computation* of theirs. It is closer to Functional Decision Theory than classical EDT."
  *   **Soft Spot:** If you are not deeply versed in the FDT vs. EDT literature, they may press you on the Smoking Lesion distinction, which is technically dense.

  ### 7. The Common Knowledge Objection (Economist)
  **"Your solution relies on everyone knowing that everyone is running this argument. In the real world, I can never be certain you are a superrationalist. Doesn't the policy collapse to Nash immediately under any uncertainty?"**

  *   **Grant:** Concede that the policy is fragile to uncertainty about the other agents' reasoning types.
  *   **Reply:** "It does collapse if confidence drops below a certain threshold. However, in high-stakes, symmetric, abstract problems (like the Platonia Dilemma), the prior probability of symmetry is high. The theory describes the limit of perfect rationality, serving as a normative benchmark even if empirical application requires robustness checks."
  *   **Soft Spot:** This retreats to "ideal theory," which economists often find less useful than predictive models of actual behavior.

  ### 8. The Normative Force Objection (General Philosopher)
  **"Even if I accept your logic, what force does the recommendation have? If I know I can defect and win, and you say 'but that's not superrational', why should I care?"**

  *   **Grant:** Concede that there is no external enforcement mechanism.
  *   **Reply:** "The force is internal. If you value being the kind of agent whose reasoning wins in symmetric scenarios, you must adopt the policy. If you value only the single-shot payoff regardless of your reasoning type, Nash is correct. It is a choice of what kind of rational agent you wish to be."
  *   **Soft Spot:** This risks sounding like a moral plea rather than a proof of rationality.

  ***

  ### Strategic Advice for the Paper

  **1. Concede in the Paper (Do not wait for Q&A):**
  *   **The Probability Bound:** You must fix the $p = 1/(N(1-\epsilon))$ formula. Add a footnote or clause stating that $p$ is capped at 1, and that the formula is the first-order approximation for small $\epsilon$. A physicist in the audience spotting $p>1$ will discount the rest of your arithmetic.
  *   **The Equilibrium Claim:** Soften your language. Instead of "equilibrium is the wrong desideratum," phrase it as "Nash equilibrium is insufficient for capturing the normative constraints of identical reasoners." This acknowledges the game theorist's point without surrendering your thesis.

  **2. Dissolve in a Sentence:**
  *   **The Utilitarian Charge:** If asked, say: "Utilitarianism asks 'What outcome should I cause?'; Superrationality asks 'What output should this algorithm produce?' The extensional equivalence does not imply intentional identity."
  *   **The "Magic" Charge:** If asked how the correlation happens without causation, say: "It is the same correlation that exists between two calculators displaying '4' when both compute '2+2'. No signal passes between them; the logic is shared."

  **3. The Deadly Question:**
  **"You say I should act as if my choice determines theirs because we run the same algorithm. But I am sitting here, and you are sitting there. What physical fact makes it the *same* algorithm? If my brain state differs from yours by even a few neurons, does the correlation vanish? If so, isn't your 'rationality' dependent on a metaphysical identity that doesn't exist in the physical world?"**

  *   **Why this is deadly:** It attacks the ontological basis of your thesis. It forces you to define "same reasoning" precisely.
  *   **Why you can't answer in 2 minutes:** You would need to delve into the philosophy of mind, functionalism, and the precise granularity of "algorithmic identity." If you say "it's an approximation," they will ask how much approximation is allowed before the logic breaks. If you say "it's exact," they will point to biological variability.
  *   **Preparation:** Hope this doesn't come up. If it does, pivot to: "We treat 'same algorithm' as a idealization, much like frictionless planes in physics. The question is whether the idealization yields better normative guidance, not whether it is physically exact."
