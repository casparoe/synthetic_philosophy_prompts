answer: |-
  Here are 6 interview questions tailored to your guest's specific view on "soft analyticities," including the targeted follow-ups you requested.

  **1. The Breakdown of the Web**
  "Quine's 'web of belief' is famous because it's continuous; any belief can touch any other belief if you pull the strings hard enough. Your view suggests beliefs actually sit in semi-isolated clusters. But Quine argued we can't draw boundaries around meanings. So, what mechanism do you have for drawing a border around a 'cluster' that doesn't secretly rely on the very analytic/synthetic distinctions you're trying to dissolve?"

  *   **Follow-up (if she says this is just a naturalized research program):** "If this is just an empirical hypothesis about how brains group ideas, what would count as *falsifying* it? If every time we find a counter-example you just say 'that belief belongs to a different cluster,' aren't you making the theory unfalsifiable by definition?"

  **2. The Status of Mathematics**
  "Math is usually the fortress of analytic truth. On your view, mathematical statements seem to just have very high 'revision weights' inside a logic cluster. But if a physics cluster (like Quantum Mechanics) conflicts with a math cluster (like classical logic), does the math actually get revised? Or is it just shuffled into a 'do not touch' pile?"

  *   **Follow-up (if she says math is just deeply entrenched):** "If 'entrenchment' is the only difference between a mathematical truth and a common sense belief, doesn't that reduce mathematical necessity to mere psychological habit? I'm asking if your view accidentally turns math into sociology."

  **3. The "Back Door" Objection**
  "Critics might say you're relabeling 'analytic' as 'high revision weight' without actually changing the machinery. If a statement is practically immune to revision within its cluster, functionally, isn't that just analyticity? Why should we call this a new theory rather than just admitting Quine was wrong and the distinction survives?"

  *   **Follow-up (if she says she's offering a better framework, not a definition):** "A framework still needs to explain why the old distinction failed. If your 'soft analyticity' performs the exact same job as 'hard analyticity' for the philosopher trying to make sense of necessity, what work is the word 'soft' actually doing here?"

  **4. Cluster Collisions**
  "If beliefs are clustered, I assume different people or disciplines might have different clusters. If my 'ethics cluster' defines 'justice' one way, and your 'political cluster' defines it another, is there any neutral ground to resolve that disagreement? Or does your view imply that truth is relative to which cluster you're standing in?"

  *   **Follow-up (if she says clusters can merge or communicate):** "Quine's web allowed for communication because we all share the same global web. If we're in different local clusters, what bridges the gap? If you say 'translation,' aren't you presupposing shared meanings that your theory says don't exist globally?"

  **5. Learning and Acquisition**
  "How does a child acquire these clusters? Do they learn 'all bachelors are unmarried' as a rule of the 'language cluster,' or do they learn it through experience? If it's through experience, it's synthetic. If it's by rule, it sounds analytic. How does your view explain the *origin* of the revision weight without picking one of those two options?"

  *   **Follow-up (if she says it's an evolutionary/developmental process):** "If it's evolutionary, then these 'soft analyticities' are just biological quirks. Does that mean if humans evolved differently, '2+2=4' could end up in a low-weight cluster? I'm trying to pin down if your view makes logic contingent on biology."

  **6. The Normative Question**
  "Quine's view was descriptive: this is how science works. But philosophers often use analyticity to say what we *ought* to believe. Does your 'soft analyticity' give us any normative guidance? If I encounter a statement with high revision weight, am I *irrational* to change it, or just inconvenient?"

  *   **Follow-up (if she says norms emerge from the clusters themselves):** "If the norms come from inside the cluster, then a radical skeptic who rejects the whole cluster isn't wrong, just outside the group. Does your view leave us without a way to criticize entire frameworks, only moves within them?"
