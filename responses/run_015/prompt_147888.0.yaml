answer: |-
  This is a profound set of problems that cuts to the bone of semantic externalism. You are correct to set aside the "Twin Earth" thought experiment; that scenario is synchronic (two places at once) and designed to show that meaning isn't in the head. Your cases are diachronic (one place over time) and designed to show that meaning might not be stable even when the *heads* are stable.

  Here is the analysis of your situation, argued out as requested.

  ### 1. Naming the Phenomenon

  **Does it have an established name?**
  No, there is no single, canonical label for this specific configuration in the literature.

  The closest established concepts are:
  *   **Diachronic Reference:** This covers how reference holds over time, but usually assumes the object persists (e.g., "Does 'Aristotle' refer to the same man in 1900 and 2000?"). Your case is about the *substance* changing, not just the object persisting.
  *   **Slow Switching:** (Associated with Tyler Burge). This argues that if a speaker moves from Earth to Twin Earth slowly, their mental content changes without them knowing. Your case is the inverse: the speaker stays still, but the *world* switches underneath them.
  *   **The Sorites Paradox of Reference:** Case 2 is explicitly a Sorites problem applied to natural kind terms.

  **Are your four cases one phenomenon?**
  Yes. They are all instances of **Environmental Drift in Reference**. They share a single underlying tension: the conflict between the *historical causal chain* (where the word started) and the *current causal interaction* (what the word is now used on), complicated by the speakers' inability to detect the physical change.

  **Proposed Term:**
  Since no single label fits, for your documentation purposes, I recommend calling this **Substratal Drift**.
  *   *Definition:* A shift in the extension of a natural kind term caused by physical changes in the environment that are undetectable to the linguistic community without instrumental aid.
  *   *Why this fits:* It captures that the "substrate" (the physical stuff) is drifting relative to the "label" (the word), creating a gap between usage and reference.

  ### 2. Analysis of Cases Against Established Concepts

  Here is how your cases map onto standard philosophical problems, and where the fit breaks down.

  **Case 1: The Dried Spring (Historical vs. Current Extension)**
  *   **Nearest Concept:** **Reference Failure / Empty Terms.**
  *   **The Fit:** If the original spring water was chemically unique ($X$) and now gone, a strict Causal-Historical view says *mbula* refers to $X$. Since $X$ is gone, the term is now empty, or current users are in error.
  *   **Where it Breaks:** Speakers are successfully communicating about *something* (the ordinary water, $Y$). Calling it "error" ignores the functional success of the term. A Descriptivist view ("water that looks like this and quenches thirst") would say the reference successfully shifted to $Y$.
  *   **Distinction from Ambiguity:** It is not ambiguous (two meanings). It is a conflict between *which* meaning is active: the historical essence or the current description.
  *   **Distinction from Deference:** Speakers aren't deferring to experts; they *are* the experts on their own usage, but the world has outpaced them.

  **Case 2: The Drifting Aquifer (The Threshold Question)**
  *   **Nearest Concept:** **Vagueness (The Sorites Paradox).**
  *   **The Fit:** This is exactly the Sorites structure. If one molecule changes, meaning doesn't shift. If all change, it does. Where is the line?
  *   **Where it Breaks:** Ordinary vagueness applies to predicates (is this pile a heap?). This applies to *identity over time* (is this the same kind?).
  *   **Distinction from Meaning Change:** In ordinary semantic change (e.g., "awful" meaning "full of awe" to "bad"), speakers usually notice a shift in usage over generations. Here, speakers insist nothing has changed. The change is ontological, not linguistic.
  *   **The Threshold:** Most philosophical accounts admit there is **no sharp threshold**. It is not a fact of the matter. The reference becomes indeterminate during the drift.

  **Case 3: The Stable Mixture (The Disjunction Problem)**
  *   **Nearest Concept:** **The Disjunction Problem** (Jerry Fodor) and **Homeostatic Property Clusters** (Richard Boyd).
  *   **The Fit:** If the liquid is always $A+B$, does the word mean $A$, $B$, or $A+B$? Fodor's problem asks: what stops a word for "cow" from meaning "cow or horse on a dark night"?
  *   **Where it Breaks:** Usually, we solve this by saying speakers intend to pick out a unified kind. Here, the unity is physical (the mixture), not conceptual.
  *   **Distinction from Ambiguity:** If it were ambiguous, you could say "This is *mbula* (type A) but not *mbula* (type B)." Speakers cannot do this. The meaning is settled on the *mixture* as a single kind.
  *   **Settling Property:** It is likely settled by the **causal role** (what the liquid *does* for the speakers) rather than the chemical composition.

  **Lab Variant: Impurity vs. Pure**
  *   **Nearest Concept:** **Essentialism vs. Nominalism.**
  *   **The Fit:** If the original sample defined the kind, the impurity is essential. If the intended structure defines it, the impurity is accidental.
  *   **Where it Breaks:** In natural language, "intention" is rarely clear. In science, we stipulate. Your field case lacks the stipulation.

  ### 3. How the Main Families of View Handle Your Cases

  I will argue out the three dominant positions: **Causal-Historical Externalism** (Kripke/Putnam), **Cluster Semantics** (Boyd), and **Internalism/Descriptivism**.

  **A. Causal-Historical Externalism**
  *   *Core Claim:* Reference is fixed by an initial "baptism" and passed down a chain. The physical essence of the original sample determines the meaning.
  *   *Case 1 (Dried Spring):* **Hard Line.** *Mbula* refers to the extinct spring water ($X$). Current usage referring to ordinary water ($Y$) is systematically false or reference-failing. The dictionary should note the term is technically empty or misapplied.
  *   *Case 2 (Drifting Aquifer):* **Sharp Cutoff (in theory).** There was a moment the water ceased to be the original kind. However, since speakers cannot detect it, they are all in error after that point. In practice, this view struggles to identify *when* the cutoff happened.
  *   *Case 3 (Mixture):* **Essentialist Struggle.** If the kind is defined by the original sample, and the original sample was a mix, then the mix is the essence. If later samples are pure, they are *not* the kind.
  *   *Verdict:* This view preserves the link between word and world but makes the speakers constantly wrong about what they are talking about.

  **B. Homeostatic Property Cluster (HPC)**
  *   *Core Claim:* Natural kinds are not defined by one essential property, but by a cluster of properties that tend to co-occur and remain stable over time (e.g., genetics, behavior, environment).
  *   *Case 1:* **Flexible.** If the ordinary water shares enough properties (quenching thirst, clear, local) with the spring water, it belongs to the same cluster. The kind is defined by the *role* in the ecosystem, not the exact chemistry.
  *   *Case 2:* **Smooth Transition.** As the chemistry drifts, the cluster drifts. There is no sharp threshold. Reference is stable as long as the "homeostasis" (the stability of the cluster) is maintained.
  *   *Case 3:* **Best Fit.** The mixture *is* the cluster. The kind is defined by the stable co-occurrence of $A$ and $B$.
  *   *Verdict:* This fits fieldwork best. It allows for reference stability despite physical drift. However, it makes "kindhood" vague.

  **C. Internalism / Descriptivism**
  *   *Core Claim:* Meaning is determined by the concepts in the speaker's head (descriptions like "clear drinkable liquid").
  *   *Case 1:* **Success.** If the ordinary water fits the description, the word refers to it. The history of the spring is irrelevant.
  *   *Case 2:* **Stability.** Since the speakers' concepts haven't changed, the meaning hasn't changed. The fact that the chemistry changed is irrelevant to meaning.
  *   *Case 3:* **Success.** The concept is "liquid from the well." It doesn't matter what it's made of.
  *   *Verdict:* This protects the speakers from error but severs the link between language and scientific reality. It makes chemistry irrelevant to lexicography.

  **Addressing Your Specific Questions:**
  *   **Threshold in Case 2:** Causal views imply a sharp threshold (but can't locate it). HPC views deny a sharp threshold (it's vague). Internalist views deny the threshold matters (meaning is constant). **None** of them provide a method for you to *find* the threshold, because HPC says there isn't one, and Causal says it's hidden.
  *   **Mixture in Case 3:** HPC handles this best (the kind is the stable cluster). Causal views require you to find the "original" sample to decide if the mix is essential.

  ### 4. Epistemic Consequences (What Speakers Know)

  This is the most critical implication for your work.

  If **Externalism** (Causal or HPC) is true: **Speakers do not fully know the meanings of their own words.**
  *   In Case 2, the speakers believe their word means "the water we have always had." If the water has chemically changed into a new kind, their word now means something else, despite their internal state being identical.
  *   This violates the principle of **Transparency of Content** (the idea that you can know what you mean by introspection).
  *   **Consequence for Lexicography:** You cannot rely solely on speaker intuition to define natural kind terms. Their intuition tells you the *concept*, but the *reference* depends on facts outside their heads (chemistry, history). Your dictionary entries must distinguish between **Speaker Meaning** (what they think they are saying) and **Extension** (what they are actually picking out in the world).

  If **Internalism** is true: Speakers *do* know their meanings, but your dictionary entries will be scientifically inaccurate regarding the substances.

  ### 5. Coining a Term: **Substratal Drift**

  Since no established term fits perfectly, here is the definition for your records.

  **Term:** **Substratal Drift**
  **Definition:** A semantic phenomenon where the extension of a natural kind term shifts due to physical changes in the environment, while the linguistic community's usage and conceptual understanding remain constant.
  **Boundary Cases:**
  *   **Clear Instance:** Your Case 2 (Aquifer chemistry changes imperceptibly over 40 years).
  *   **Clear Non-Instance:** A community migrates to a new land and learns a new word for a new substance. (This is standard lexical change).
  *   **Edge Case:** A substance changes properties perceptibly (e.g., water becomes salty), and speakers debate whether to keep the name. (This is standard semantic negotiation, not *drift*, because the speakers are aware).

  ### 6. Confidence and Uncertainty

  **Confidence Level:** High on the philosophical mapping; Moderate on the fieldwork implications.

  *   **High Confidence:** I am confident that Case 2 is a Sorites paradox applied to reference, and that standard Externalist theories imply speakers can be wrong about their own reference (Case 1 & 2). I am confident that "Twin Earth" is not the right model for this.
  *   **Moderate Confidence:** I am confident that Homeostatic Property Cluster theory (Boyd) offers the most pragmatic solution for a lexicographer, as it allows for stable reference despite physical variation.
  *   **Least Sure Point:** I am least sure about the metaphysical status of **Case 2's threshold**. While I stated above that most views deny a sharp threshold, there is a minority view in metaphysics (**Epistemicism**) which claims there *is* a sharp cutoff (a specific molecule change that flips the reference), but it is unknowable. If Epistemicism is true, there is a fact of the matter you are missing. I cannot rule this out, but it is a unpopular position. If you need a practical answer for the dictionary, treat the threshold as non-existent (vague).

  **Summary Recommendation for Your Dictionary:**
  For *mbula* (Case 1), do not write "Water." Write: "Local water (historically associated with [Spring Name], now applied generally to local surface water)."
  For Case 2, note the potential for chemical variance.
  For Case 3, define the kind by its **function and source**, not its chemical composition, unless the mixture is chemically unstable.

  You are documenting the friction between language (which seeks stability) and the world (which seeks entropy). There is no clean solution, only accurate description of the gap.
