      *Recommendation:* Drop Condorcet (3). It conflicts with 4, 7, and arguably 8. Embrace Borda but fix the Spoiler definition (Clones).

      *Wait, one nuance:* The user says "I want to evaluate rules as functions... judged by how they behave on profiles." This is standard social choice.
      *   The "Spoiler" intuition (5) is usually IIA.
      *   If they drop IIA (4), they must redefine Spoiler (5).
      *   If they redefine Spoiler as "Clones" (Tideman), Borda fails.
      *   If they redefine Spoiler as "Bottom-Insertion" (6), Borda passes, but it's trivial.
      *   This is the crux.

      *Okay, ready to write.*
answer: |-
  ### Phase 1: Brainstorm of Pairwise Frictions

  Before ranking, here is the matrix of tensions I see in your eight points. I am treating these as logical and normative constraints on your proposed system.

  *   **1 vs. 2 (Ontology vs. Pathology):** You deny the ontological status of a collective ordering (1), yet you treat agenda-dependence (a symptom of cyclic majorities) as a normative failure (2). If there is no "will," path-dependence is merely a feature of the function, not a bug. Calling it a "pathology" smuggles in a stability requirement that 1 explicitly disavows.
  *   **3 vs. 4 (Condorcet vs. Borda):** These are extensionally incompatible. Borda counts can elect a candidate who loses a head-to-head matchup. You acknowledge this in 8, but 3 states it as a principle ("should win").
  *   **4 vs. 5 (Anti-IIA vs. No-Spoilers):** "Spoiler" is colloquially understood as an IIA violation. If you reject IIA (4) to allow positional information, you invite spoiler effects. You need a formal definition of "spoiler" that isn't IIA.
  *   **5 vs. 6 (Intuitive Spoiler vs. Rank-Robustness):** Your condition (6) is a subset of spoiler protection (specifically, *Independence of Irrelevant Alternatives at the Bottom*). It is satisfied by Borda. However, it does not protect against *clones* or vote-splitting, which is the intuitive core of (5). Satisfying 6 does not satisfy 5.
  *   **3 vs. 7 (Condorcet vs. Participation):** Moulin's Theorem (1988). No Condorcet-consistent method satisfies the Participation Criterion. You cannot have both.
  *   **1 vs. 8 (No Will vs. Consensus):** In 8, you defend a winner who was nobody's first choice. This aligns with 1 (no "will" of the majority). However, your worry ("winner nobody wanted") appeals to a normative intuition about legitimacy that 1 suggests shouldn't exist.
  *   **2 vs. 4 (Meeting Agendas vs. Hiring Rules):** You want agenda-independence in meetings (2) but are willing to use Borda in hiring (4). Borda is not agenda-dependent in the sequential sense, but it is sensitive to the *set* of alternatives (like an agenda). The friction here is why sequential majority is suspect in meetings but head-to-head majoritarianism (3) is privileged in hiring.

  ---

  ### Phase 2: Audit of Tensions (Ranked by Severity)

  Here is the ordering of frictions from "fatal flaw" to "manageable trade-off," with the specific cost of resolution.

  #### 1. The "Spoiler" Trap (5 vs. 6 vs. 4)
  **Severity:** Critical. This is a technical vulnerability in your memo.
  **The Conflict:** You reject IIA (4) but demand No-Spoilers (5). You propose Rank-Robustness (6) as the bridge.
  **The Problem:** Condition 6 is trivially satisfied by Borda (adding a bottom-ranked candidate shifts all scores equally). But condition 6 does not capture the *political* reality of spoilers. The real spoiler threat is **Independence of Clones** (Tideman 1987). If a candidate similar to $x$ enters, Borda penalizes $x$ disproportionately compared to $y$. Borda *fails* clone independence.
  **What Must Give:** You must revise 5 or 6.
  **Cost:**
  *   *If you keep 5 (intuitive):* You must admit Borda is vulnerable to strategic entry/cloning. You lose the claim that Borda "solves" the spoiler problem.
  *   *If you keep 6 (formal):* You retain mathematical consistency, but you leave yourself open to the charge that you've redefined "spoiler" to mean something politically irrelevant.
  **Recommendation:** Redefine 5 explicitly as **Independence of Clones**. Admit Borda fails this. Decide if the gain in positional information (4) outweighs the vulnerability to cloning.

  #### 2. The Ontological Contradiction (1 vs. 2)
  **Severity:** High (Philosophical Coherence).
  **The Conflict:** 1 says cycles are fine because there is no collective agent. 2 says agenda dependence (caused by cycles) is a pathology.
  **The Problem:** If you truly believe 1, then agenda dependence in meetings is not "wrong," it is just *indeterminate*. Calling it a pathology implies there *should* be a stable outcome independent of procedure.
  **What Must Give:** Nuance in 1 or 2.
  **Cost:**
  *   *Revise 1:* Acknowledge that while there is no "will," there is a requirement for *procedural neutrality*. The pathology isn't that the "will" changed, but that the *process* allowed manipulation.
  *   *Revise 2:* Accept that meeting outcomes are inherently unstable (McKelvey chaos) and focus on constraining the agenda setter rather than the voting rule.
  **Recommendation:** Keep 1, but reframe 2. The pathology is not "inconsistency of the will," but "power of the agenda-setter." This aligns with your comparative institutions background.

  #### 3. The Impossibility of Condorcet + Participation (3 vs. 7)
  **Severity:** High (Mathematical).
  **The Conflict:** Moulin's Theorem proves these are incompatible.
  **The Problem:** You want Condorcet (3) and Participation (7). In a department where turnout is low (as you note in 7), Participation is crucial.
  **What Must Give:** 3 (Condorcet).
  **Cost:** You lose the "straightforwardly majoritarian" guarantee.
  **Why:** Borda satisfies Participation. Condorcet methods (Minimax, Ranked Pairs, etc.) generally fail it. Given your constraint on turnout (7), 3 is the casualty. This also resolves the tension in 8 (where you defended a non-Condorcet winner).

  #### 4. The Revealed Preference Gap (3 vs. 8)
  **Severity:** Medium (Normative).
  **The Conflict:** Principle 3 says Condorcet Winner (CW) *should* win. Case 8 describes a CW losing to a Borda winner, which you defended.
  **The Problem:** Your revealed preference contradicts your stated principle.
  **What Must Give:** 3.
  **Cost:** You must admit that "majoritarianism" is not your top lexical priority; "consensus/intensity" (Borda) is.
  **Recommendation:** Downgrade 3 from a principle to a *proviso*. "A CW should win, *unless* it violates Participation or produces a consensus outlier." But given Moulin, you can't have the proviso and the rule. Drop 3 as a hard constraint.

  ---

  ### Phase 3: Provable Inconsistencies

  You asked for specific results. Here are the two that bind your hands:

  1.  **Moulin's Theorem (1988):** Any voting rule that satisfies the **Condorcet Criterion** (3) must violate the **Participation Criterion** (7).
      *   *Implication:* You cannot satisfy both. Given your departmental context (low turnout), 7 is normatively more important than 3.
  2.  **Tideman's Independence of Clones (1987):** **Borda Count** (4) fails **Independence of Clones** (the robust version of 5).
      *   *Implication:* Your "Rank-Robustness" condition (6) is insufficient to protect against the intuitive "Spoiler" effect (5). If two similar candidates run, Borda will penalize both, potentially allowing a polarizing candidate to win.

  ---

  ### Phase 4: The Single Revision

  If you make one change to clean up the memo, do this:

  **Drop the Condorcet Criterion (3) as a hard principle and reclassify it as a "Diagnostic."**

  **Why this works:**
  1.  **Resolves Moulin:** It clears the conflict with Participation (7), which you correctly identify as vital for departmental health.
  2.  **Resolves 8:** It aligns your principles with your actual defense of the "third choice" winner. You are already acting as a Borda theorist; stop pretending you are a Majoritarian.
  3.  **Clarifies 1:** It reinforces your ontological claim. If there is no "will," the head-to-head winner has no special claim to legitimacy over the consensus winner.
  4.  **Isolates the Real Fight:** It leaves you with one honest battle: **Borda vs. Spoilers (Clones).**

  **The Trade-off (What you lose):**
  You lose the ability to claim your rule is "democratic" in the simple majoritarian sense. You cannot say "the majority prefers X." You must argue that **intensity and breadth of support** (Borda) are more legitimate for *hiring* than pairwise dominance. This is a strong normative argument (hiring is about collegiality, not war), but it is a *normative* argument, not a formal majoritarian one.

  **Revised Principle 3:**
  *"While head-to-head dominance is informative, it is not decisive. In a hiring context, broad acceptability (positional score) outweighs narrow majority preference to ensure long-term departmental cohesion."*

  **Final Note on the "Spoiler" (5 & 6):**
  In the memo, do not claim Borda solves the spoiler problem. Claim that Borda *minimizes* the spoiler problem relative to Plurality, but acknowledge the clone vulnerability. Propose a **pre-screening process** (the shortlist itself) as the institutional solution to clones, rather than the voting rule. This moves the burden from the aggregation function (where impossibility looms) to the agenda-setting stage (where your comparative institutions expertise lies).
