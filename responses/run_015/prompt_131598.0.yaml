prompt: |-
  I hold that pathogens, climate regimes, and volcanic eruptions should be treated as genuine historical actors rather than as background conditions, but that this need not collapse into environmental determinism if agency is understood relationally and non-intentionally: forces like the 1815 Tambora eruption or Yersinia pestis reshape societies not by pursuing goals but by translating the programs of human institutions—disrupting trade, altering harvests, forcing migration—so that causal power is always mediated through social structure. What would count against this position? I want the arguments and evidence sorted by how decisive they would be: which historical cases or conceptual results in philosophy of action show that non-intentional agency is incoherent or that the framing inevitably reduces humans to passive effects; which intuitions about human resilience or institutional adaptation it struggles to accommodate; and whether its defenders would concede any of these as genuine defeaters rather than dismiss them. I also want an honest assessment of whether the view risks being qualified into unfalsifiability—if every observed human response can be redescribed as mediation through social structure—and whether that insulation is a problem for a historiographical framework of this kind. Please answer in continuous prose only, without headings, bullet points, bold text, or tables, as in a letter or email.
