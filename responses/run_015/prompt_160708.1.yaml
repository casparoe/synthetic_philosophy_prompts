      *   **Task:**
          1.  Create a numbered menu of distinct precise theses the slogan could express.
          2.  For each thesis, specify: (a) Type (epistemic, semantic, ontological), (b) Status (trivial, defensible, false), (c) Verdict on Shade, (d) Strength of "Experience" required.
          3.  Address the "committed to thinking vs. extra premise" objection (is it a separate problem?).
