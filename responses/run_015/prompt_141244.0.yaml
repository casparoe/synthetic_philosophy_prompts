answer: |-
  There is no single canonical term in game theory or organizational economics that captures this exact constellation of constraints. You are not misremembering a name; you are describing a specific failure mode that sits at the intersection of three distinct concepts.

  If you need a label to use in the wild, the most precise descriptive name is **"The Adverse Volunteer Dilemma"** (specifically, a **Competence-Threshold Inversion**).

  However, to answer your request properly: this is not just the "Curse" and "Adverse Selection" glued together. The **visibility** and **sequential ordering** do real work that changes the game class. Here is the breakdown of what this is, what it isn't, and why the distinction matters for remedies.

  ### 1. The Anatomy of the Problem
  You have identified a **Sequential Volunteer's Dilemma** played under conditions of **Adverse Selection on Action Thresholds.**

  *   **The Base Game (Volunteer's Dilemma):** A public good is produced if *at least one* person acts. If no one acts, everyone loses. If multiple act, there is waste or penalty.
  *   **The Dynamic (War of Attrition):** Because the chat/dashboard is visible, the game is not simultaneous. It becomes a waiting game. Everyone is waiting for someone else to "fold" (act). In a standard War of Attrition, the person who waits the *longest* wins the prize. In your scenario, the person who waits the *shortest* time (folds first) "wins" the burden of the task.
  *   **The Failure Mode (Adverse Selection):** The variable that determines who folds first (tolerance for uncertainty/impatience) is negatively correlated with the variable that determines task success (competence/caution).

  **Why visibility matters:**
  If the decision were simultaneous (everyone votes at 9:00 AM whether to send the email), this would be a standard Volunteer's Dilemma with heterogeneous agents. The risk is primarily that *no one* acts.
  Because the decision is sequential (visible chat), it becomes a **preemption game**. The "cost" of waiting is psychological (anxiety, tolerance for error rates). The mechanism that selects the actor is **time-to-action**. Because time-to-action correlates with incompetence, the selection mechanism itself is broken.

  ### 2. Is it just the "Curse" plus "Adverse Selection"?
  It is structurally analogous to the **Winner's Curse**, but the mechanics are distinct enough that subsuming it loses explanatory power.

  *   **Winner's Curse:** Simultaneous bids. Common value. Winner is the person with the highest *estimate* of value. The act of winning reveals you overestimated.
  *   **Your Scenario:** Sequential bids (timing). Common need. "Winner" (actor) is the person with the lowest *threshold* for waiting. The act of acting reveals you are the most impatient (and thus, by correlation, the least competent).

  **What gets lost if you call it a Winner's Curse:**
  In a Winner's Curse, the remedy is "bid less." In your scenario, the remedy cannot be "act later," because if everyone acts later, the system crashes (the hall isn't booked, the server stays down). The Winner's Curse assumes the transaction is optional or price-adjustable. Your scenario assumes the task *must* happen, but the *agent* matters.

  ### 3. Drawing the Boundaries
  You asked to distinguish this from nearby concepts. Here are the hard lines:

  | Concept | Goal of Game | Selection Mechanism | Outcome Failure | Why Your Case is Different |
  | :--- | :--- | :--- | :--- | :--- |
  | **Bystander Effect** | Diffusion of responsibility | Assumption others will act | **No one acts.** | In your case, someone *does* act. The failure is *who*, not *if*. |
  | **War of Attrition** | Be the last one waiting | Endurance / Cost tolerance | **Resource waste** (time spent waiting). | In your case, the "loser" (first to fold) must act. The cost is the *quality* of the action, not the wait time. |
  | **Winner's Curse** | Win the auction | Highest valuation | **Overpayment.** | Your case is sequential, not simultaneous. The "bid" is time, not price. |
  | **Tragedy of the Commons** | Maximize individual gain | Unregulated access | **Resource depletion.** | Your case is about a *singleton* action, not cumulative consumption. |

  **The Boundary Test:**
  If you remove the **negative correlation** (impatient people are equally competent), this collapses into a standard **Volunteer's Dilemma**. The group still risks duplication or delay, but there is no systemic bias toward incompetence.
  If you remove the **visibility** (simultaneous decision), this collapses into a **Heterogeneous Volunteer's Dilemma**. The risk is duplication, but not specifically selection of the worst agent via timing.

  ### 4. The Remedy Test
  You are correct that the remedy distinguishes the concept.

  *   **Volunteer's Dilemma Remedy:** Increase the reward for volunteering or decrease the cost of acting. (e.g., "Whoever emails the hall gets a $20 gift card.")
  *   **Winner's Curse Remedy:** Restraint. Bid below your estimate. (e.g., "Don't email unless you're sure.")
  *   **Your Scenario's Remedy:** **Decouple the threshold from the selection.**
      *   *Assignment:* Remove the volunteer aspect entirely. (Designated owner.)
      *   *Friction:* Make acting expensive for the impatient/low-skill. (e.g., "Only admins can push hotfixes," or "Email must be drafted in channel before sending.")
      *   *Subsidize Waiting:* Make it cheap for competent people to wait. (e.g., "Senior devs are explicitly told *not* to fix this for 1 hour.")

  Because the standard remedies for the Volunteer's Dilemma (incentivize action) would actually **worsen** your specific problem (by encouraging the impatient/low-skill actors to act faster), this confirms it is a distinct failure mode.

  ### 5. Edge Cases and Definitions
  To formalize this as a concept, here are the boundary conditions:

  **1. The Correlation Direction (The "Happy Path")**
  *   *Condition:* The most impatient person is also the most competent (e.g., only the expert knows how bad the error rate is, so only they feel the pain).
  *   *Verdict:* This is **not** the phenomenon. This is an efficient market. The "Adverse Volunteer Dilemma" requires the **Competence-Threshold Inversion**. If the correlation is positive, the waiting game efficiently selects the best agent.

  **2. Equal Competence**
  *   *Condition:* Everyone is equally skilled, but impatience varies.
  *   *Verdict:* This is a standard **Volunteer's Dilemma** with noise. It is not the specific failure mode you described. The "curse" relies on the selection of the *wrong* agent, not just *an* agent.

  **3. Wasteful vs. Harmful Duplication**
  *   *Condition:* Two emails is annoying, but doesn't lose the venue. Two hotfixes causes a reboot, but no data loss.
  *   *Verdict:* The phenomenon still holds, but the severity scales with the penalty of duplication. The defining feature is not the *magnitude* of the harm, but the **selection bias**. However, if duplication is harmless, the "one person must act" constraint dissolves, and the problem vanishes. So yes, the **singleton constraint** (one is good, >1 is bad) is necessary.

  ### 6. The Name
  Since you asked to coin one if none exists:

  **The Adverse Volunteer Dilemma**
  *Definition:* A sequential coordination game where a singleton action is required, visibility allows for waiting, and the threshold for action is negatively correlated with the competence required to execute the action successfully.

  **Alternative (more descriptive):**
  **The Competence-Threshold Inversion**
  *Definition:* A systemic failure where the mechanism for selecting an actor (tolerance for delay) systematically filters for the agent least capable of performing the task.

  ### Summary
  You are not redescribing a special case; you are describing a specific **parameterization of a Volunteer's Dilemma** that creates a unique equilibrium failure.

  *   **Is it the Curse?** It is a temporal, sequential Winner's Curse.
  *   **Is it Adverse Selection?** Yes, specifically on the "price" of waiting.
  *   **Does visibility matter?** Yes, it changes the game from Simultaneous to Sequential (Attrition/Preemption).
  *   **Is it distinct?** Yes, because the standard remedies for the parent games (incentivize action / restrain bidding) fail or backfire. The only working remedy is **structural decoupling** (assignment or permissioning).

  You can confidently treat this as a distinct operational risk pattern. It is the **Adverse Volunteer Dilemma**.
