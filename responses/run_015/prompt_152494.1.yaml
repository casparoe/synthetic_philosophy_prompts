answer: |-
  This is a sophisticated reconstruction of a classic problem in Rawlsian scholarship, often referred to as the "Problem of Intergenerational Justice." Your chain is logically tight *if* one accepts the premise that the Veil of Ignorance (VoI) must apply symmetrically to temporal position in the same way it applies to social position. However, from the standpoint of Rawls's own system, the argument contains a critical equivocation in Step (4) and a misapplication of the maximin rule in Step (5).

  Here is the assessment of where the chain breaks, the principled reason Rawls offers for the boundary, and the cost of accepting your conclusion.

  ### 1. The Equivocation on "Position" (Step 4)
  Your argument hinges on Step (4): *"The veil removes knowledge of one's position just as thoroughly in time as in space or class."*

  While this sounds intuitive, it conflates **social location within a cooperative scheme** with **temporal location across cooperative schemes**. For Rawls, justice is the virtue of *social institutions* defined as a "fair system of cooperation over time." Crucially, cooperation implies reciprocity: I follow the rules because I benefit from your following them, and vice versa.

  *   **Social Position:** Members of the same generation can reciprocate. The rich benefit from the stability provided by the poor accepting the system; the poor benefit from the economic growth generated by the rich. Maximin works here because there is a live possibility of mutual advantage.
  *   **Temporal Position:** Future generations cannot reciprocate with the present. We can help them, but they cannot help us.

  Rawls explicitly acknowledges this asymmetry. In *A Theory of Justice*, he admits that the parties in the Original Position cannot be strictly ignorant of their generation in the same way they are ignorant of their class, because strict ignorance would make the motivation for saving incoherent. If the parties truly did not know which generation they belonged to, and applied maximin, they would likely assume they are in the *first* generation (the poorest, with the least accumulated capital). To maximize the position of the worst-off generation (themselves), they would consume all resources and save nothing, starving the future.

  Therefore, Step (4) is the weak link. Rawls does not treat temporal position as structurally identical to social position because the conditions for *justice as fairness* (reciprocity) do not hold across time in the same way.

  ### 2. The Misapplication of Maximin (Step 5)
  Step (5) claims consistency demands applying maximin to generations. However, Rawls replaces the Difference Principle with the **Just Savings Principle** for intergenerational justice.

  *   **The Logic:** The parties are not viewed as isolated individuals but as representatives of "lines of descent" (heads of families). They are motivated to care for their immediate descendants.
  *   **The Mechanism:** Instead of maximizing the minimum position across *all* time (which leads to the absurdity you noted), the parties agree on a rate of savings that allows each generation to establish just institutions and pass them on. Once a just society is achieved, the savings rate drops to zero (maintenance only).
  *   **The Boundary:** This avoids the "near-total deprivation" you fear in Step (11). The present is not sacrificed endlessly for the future; it is only required to save enough to establish justice. Once justice is secured, the Difference Principle applies *within* that generation, not *across* to the next.

  ### 3. The "Arbitrary Boundary" Charge (Step 9 & 10)
  You argue that excluding temporal position requires a principled reason, otherwise, it is arbitrary. Rawls's principled reason is **the nature of the social contract itself**.

  The contract is an agreement for *mutual* advantage among contemporaries. Extending the contract to include non-existent future persons who cannot be parties to the agreement stretches the concept of a "contract" beyond its breaking point. Rawls solves this not by forcing the future into the Veil, but by extending the *motivation* of the contractors (via the family line metaphor) to care for the near future.

  This is not an *ad hoc* suppression of maximin; it is a recognition that maximin is a decision rule for dividing the fruits of cooperation, not a rule for creating the conditions of cooperation where none exist.

  ### 4. The Cost of Your Conclusion
  If you choose to keep (1) through (3) intact and force the logic through to (11), as you suggest, here is precisely what you pay:

  1.  **You Abandon Reciprocity:** You transform Justice as Fairness from a theory of *cooperation* into a theory of *impersonal benevolence*. If we must maximize the position of the worst-off generation regardless of reciprocity, we are no longer doing contractarianism; we are doing a form of rule-utilitarianism or prioritarianism across time.
  2.  **You Invite the "Zero Savings" Paradox:** As noted above, if the "worst-off generation" is the first one (due to lack of capital), strict maximin demands zero savings. Your Step (11) argues for "present deprivation," which assumes the *future* will be worse off (e.g., due to climate collapse). But without empirical assumptions about decline, the logic of maximin across time usually favors the *present* at the expense of the future. Your argument is unstable because the direction of the "absurdity" depends on empirical predictions about technological progress vs. resource depletion.
  3.  **You Lose the Primary Goods Metric:** As you noted in Step (7), to compare generations, you need a common currency. If you abandon primary goods for subjective welfare, you open the door to adaptive preferences. If you keep primary goods, you face the indexing problem. Rawls avoids this by limiting the scope of comparison to contemporaries who share a basic structure.

  ### Final Verdict
  Your chain is **valid** (the conclusion follows from the premises) but **unsound** because Step (4) is false within the Rawlsian framework. Rawls explicitly rejects the premise that the Veil applies to temporal position in the same way it applies to social position.

  The "hidden boundary" you detect in Step (10) is not a bug; it is a feature. It marks the limit of contractarian justice. To go beyond it requires a different ethical foundation (e.g., utilitarianism or a duty of stewardship) that does not rely on the reciprocity of the Original Position. If you enforce the Veil across time, you are no longer interpreting Rawls; you are using Rawlsian machinery to build a different theory—one that likely collapses under the weight of the "non-identity problem" or the "zero-savings" paradox.

  **Recommendation:** Reject Step (4). Accept that the Veil is bounded by the possibility of reciprocity. This preserves the Difference Principle for intra-generational justice while requiring a separate Just Savings Principle for inter-generational duties, avoiding the absurdity of total present deprivation.
