answer: |-
  ### I. The Purpose Specification

  The theory is to serve as a **deliberative guide** for a **competent but morally unexceptional agent**.
  *   **Competent:** Capable of grasping moral reasons and acting on them (excludes Case 7 initially, includes it developmentally).
  *   **Unexceptional:** Not a moral saint, not a sociopath; possesses standard moral sensitivity.
  *   **Deliberative Guide:** The theory must not merely describe when belief is justified; it must prescribe when *action on that belief* is permissible. It must distinguish between *knowing the truth* and *being entitled to act on another's say-so*.
  *   **Target:** It must explain the specific normative defect in objectionable deference (e.g., servility, alienation, buck-passing) that persists even when the testifier is reliable.

  ### II. The Eight Desiderata

  1.  **The Reason-Access Requirement:** The agent must be able to grasp the reasons supporting the verdict, even if mediated by the testifier. Blind trust on core moral matters is impermissible.
      *   *Basis:* Case 1 (Trusted person, no reasons).
      *   *Status:* **Non-Negotiable.** (Without this, the agent ceases to be a moral agent.)
  2.  **The Constitutive Authority Exception:** Deference to a victim regarding what they are owed is not merely epistemic; withholding it can be a moral failing regardless of the victim's epistemic reliability.
      *   *Basis:* Case 2 (The person you wronged).
      *   *Status:* **Non-Negotiable.** (Without this, the theory fails to capture the normative force of repair and recognition.)
  3.  **The Competence Threshold:** The permissibility of deference must decrease as the agent's moral competence increases. A theory must specify the transition from learner to peer.
      *   *Basis:* Case 7 (The learner's case).
      *   *Status:* **Non-Negotiable.** (Required for the "guide" purpose; otherwise, the agent remains a child forever.)
  4.  **The Reliability/Reason Gap:** Predictive reliability regarding moral verdicts is insufficient for deference if the testifier cannot articulate the justifying reasons.
      *   *Basis:* Case 4 (Reliable but confused testifier).
      *   *Status:* **Non-Negotiable.** (Distinguishes moral testimony from weather forecasting.)
  5.  **The Interpersonal Constraint:** Moral testimony requires a person-to-person transmission of standing. Deferring to a non-agent prediction does not count as moral testimony, even if accurate.
      *   *Basis:* Case 8 (The artifact).
      *   *Status:* **Non-Negotiable.** (Moral deference is a social relation, not just data intake.)
  6.  **The Content Separation:** A theory must distinguish between deferring on empirical premises and deferring on the moral weighting of those premises. Deferring on the latter is the primary target.
      *   *Basis:* Case 9 (Empirical facts not yet in).
      *   *Status:* **Non-Negotiable.** (Prevents dissolving the problem by reclassifying moral questions as empirical.)
  7.  **The Disagreement Tolerance:** An agent may sometimes defer on a specific verdict even while rejecting the testifier's fundamental framework, provided the verdict is intelligible within the agent's own framework.
      *   *Basis:* Case 5 (Fundamental disagreement).
      *   *Status:* **Camp-Specific.** (Autonomists deny this; Reductionists allow it. Included to test flexibility.)
  8.  **The Procedural Distinction:** Deferring to an aggregation or procedure is epistemically distinct from deferring to an individual's judgment. A theory must explain why the latter carries specific moral risk.
      *   *Basis:* Case 6 (Aggregation vs. Expert).
      *   *Status:* **Camp-Specific.** (Purely epistemic views collapse this; interpersonal views maintain it.)

  ### III. Adjudication of the Ten Cases

  1.  **Trusted person, no reasons:** **Genuine Desideratum.** (Reason-Access Requirement). **Doing Work.** It tests whether trust can substitute for understanding in the moral domain.
  2.  **Victim's say-so:** **Genuine Desideratum.** (Constitutive Authority Exception). **Doing Work.** This is the hardest case for epistemic views. It forces the theory to admit non-epistemic reasons for deference.
  3.  **Lived experience/Empirical access:** **Genuine Desideratum.** (Content Separation). **Doing Work.** It tests if the theory can locate authority in factual access without conceding moral expertise.
  4.  **Reliable but confused:** **Genuine Desideratum.** (Reliability/Reason Gap). **Doing Work.** Kills pure reliabilism. Essential for distinguishing moral from scientific testimony.
  5.  **Fundamental disagreement:** **Genuine Desideratum.** (Disagreement Tolerance). **Doing Work.** Tests if shared framework is a precondition for deference or just a heuristic.
  6.  **Aggregation vs. Expert:** **No Genuine Desideratum.** **Cheap.** This is primarily an epistemic problem (Condorcet's Jury Theorem). It does not press the specific *moral* worry about deference (alienation/agency).
  7.  **The learner:** **Genuine Desideratum.** (Competence Threshold). **Doing Work.** Essential for the "guide" purpose. A theory that forbids all deference fails here; a theory that allows all deference fails the adult agent.
  8.  **The artifact:** **Genuine Desideratum.** (Interpersonal Constraint). **Doing Work.** Distinguishes between *moral prediction* and *moral testimony*. Crucial for the "person vs. evidence" distinction.
  9.  **Empirical open question:** **Genuine Desideratum.** (Content Separation). **Doing Work.** Prevents the theory from cheating by claiming all moral disagreements are empirical.
  10. **Agent with no view:** **No Genuine Desideratum.** **Cheap.** This is a boundary condition of incompetence. If the agent has *no* view, they are not yet the "competent agent" specified in the purpose. It adds no pressure to the theory beyond Case 7.

  ### IV. Forbidden Collapses

  A theory adequate to the stated purpose **may not collapse** the following distinctions:

  1.  **Deferring to a person vs. treating her as evidence:** Moral testimony involves acknowledging standing, not just registering a data point. (Collapsing this fails Case 8).
  2.  **Believing on testimony vs. understanding why:** In morality, acting on a belief one does not understand is a distinct normative failure. (Collapsing this fails Case 1 & 4).
  3.  **Reliability vs. Authority:** One can be reliable without having the standing to demand deference. (Collapsing this fails Case 2).
  4.  **First-personal deliberative standpoint vs. third-personal appraisal:** The theory must guide the *deliberator*, not just the *observer* of deliberation. (Collapsing this fails the Purpose Specification).
  5.  **Epistemic permission vs. Moral failing:** It must be possible to be epistemically justified in believing a testifier but morally forbidden to act on that belief. (Collapsing this fails the "objectionable deference" constraint).
  6.  **Deference to a person vs. deference to a procedure:** Aggregation lacks the interpersonal address required for moral repair or recognition. (Collapsing this fails Case 6/8 distinction).
  7.  **Taking a verdict now vs. coming to understand it later:** Temporary deference is permissible only if it is a bridge to understanding, not a permanent resting place. (Collapsing this fails Case 7).

  *Allowed Collapse:* **Moral content vs. Empirical claims embedded in it.** A theory *may* argue that what looks like moral deference is often just empirical deference (Case 9), provided it explains why the residual moral component resists deference.

  ### V. Meta-Questions

  **1. Which items are camp commitments dressed as data?**
  The demand that the theory **vindicate the claim that there are no moral experts** is a camp commitment (Autonomism), not data. Case 7 (Learner) and Case 5 (Disagreement) show that some asymmetry in competence is real and sometimes actionable. Similarly, the demand for a **special explanation of testifiers with odious views** (Case 5) is often cheap; if the theory handles reliability and reason-access correctly, the "odiousness" often reduces to unreliability or lack of shared framework. These should not earn credit unless they survive the reduction to epistemic/structural flaws.

  **2. Is any subset of desiderata jointly unsatisfiable?**
  Yes. **The Reason-Access Requirement (1)** and **The Constitutive Authority Exception (2)** are in tension.
  *   If I must grasp the reasons to act (1), I cannot simply defer to a victim who says "You owe me this" but cannot explain why (perhaps because the harm is ineffable or the reasons are complex).
  *   If I must defer to the victim's say-so as constitutive of the obligation (2), I may have to act without grasping the reasons.
  *   *Result:* No single theory can fully satisfy both without qualification. A successful theory must prioritize one (usually Agency over Constitutive Authority) or provide a nuanced hierarchy (e.g., Constitutive Authority overrides Reason-Access only in specific reparative contexts).

  **3. Which single requirement does the most exclusionary work?**
  **The Reason-Access Requirement (1).**
  This knocks out any view that treats moral testimony as a pure transmission of knowledge (like a bucket brigade). It demands that the recipient do cognitive work. It eliminates "Straight Deference" views and "Knowledge without Understanding" views immediately, as they cannot explain why the *agent's* grasp of the reason is necessary for the *action* to be permissible.

  ### VI. Scorecard

  *   **Straight Deference View:** Fails **Reason-Access** and **Interpersonal Constraint**. Treats moral testimony like factual reporting; permits objectionable servility.
  *   **Knowledge without Understanding:** Fails **Reason-Access**. Allows the agent to act on verdicts they cannot justify, violating the deliberative purpose.
  *   **Deliberative Standpoint (Inappropriateness):** Fails **Constitutive Authority** and **Competence Threshold**. Too rigid; forbids necessary deference in learning and repair contexts.
  *   **Disagreement-Based Asymmetry:** Scores well on **Disagreement Tolerance** but risks failing **Reliability/Reason Gap** if it attributes all friction to framework clashes rather than cognitive access.
