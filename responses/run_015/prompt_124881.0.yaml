  # Taxonomy of the Heterogeneity Problem: A Decision Tree

  **Instructions:** Answer the following four questions based on your intuitions about the cases described. Do not worry about which theory your answer supports. Follow the branches to locate your position in the logical space.

  **Q1. The Phenomenal Claim.** Consider the **climber** absorbed in a hard route (who reports no feeling at the time) and the logician closing a **long proof** (with no sensory phenomenology). If these subjects attended fully to their experience, would they find a distinctive qualitative character common to these states and the taste of wine, or is the "pleasure" constituted entirely by how they relate to the activity?
  *   **Yes, there is a distinctive character:** Go to **Leaf 1**.
  *   **No, it is a relation/stance:** Go to **Q2**.

  **Q2. The Homogeneity Claim.** Consider the **astringent food** (enjoyed and disliked at once) and the **reward-system dissociation** (brain signals reward, subject reports none). Do all states we call "pleasure" share a single underlying nature, or is the class a loose collection of disparate states (or empty)?
  *   **Single Nature:** Go to **Q3**.
  *   **Disparate/Empty:** Go to **Q4**.

  **Q3. The Constitution Claim.** Consider the **mild background contentment** (unnoticed until prompted) and the **relief of a toothache** (an absence). Is pleasure a functional role in learning and action, or is it a mental stance toward an experience?
  *   **Functional Role:** Go to **Leaf 2**.
  *   **Mental Stance:** Go to **Q4**.

  **Q4. The Double-Duty Claim.** Consider **delight at a fictional character's escape** (where the object is not believed to obtain). Must the feature that classifies this state as "pleasure" be the *very same* feature that explains why it benefits the subject, or can classification and value come apart?
  *   **Same Feature (Double Duty):** Go to **Leaf 3**.
  *   **Different Features (Separation):** Go to **Leaf 4, 5, 6, or 7** (See below).

  ***

  ## The Leaves

  **Leaf 1: Qualitative Hedonism**
  *   **Statement:** Pleasures share a distinctive felt quality, even if sometimes subtle or overlooked.
  *   **Awkward Commitment:** Must explain away the climber's lack of reported feeling as a failure of attention rather than a lack of phenomenology.

  **Leaf 2: Functional Hedonism**
  *   **Statement:** Pleasure is a common-currency functional role in reinforcement and action selection.
  *   **Awkward Commitment:** Must accept that a subject could be in pain but functionally "pleased" if the reward system fires without report.

  **Leaf 3: Hybrid Attitudinalism**
  *   **Statement:** Pleasure is a pro-attitude toward experience that also constitutes the benefit to the person.
  *   **Awkward Commitment:** Struggles to explain why satisfying a pro-attitude toward a fictional object benefits the subject.

  **Leaf 4: Pro-Attitude Hedonism**
  *   **Statement:** Pleasure consists in wanting an experience to continue, distinct from whether it benefits the person.
  *   **Awkward Commitment:** Must allow that one can be pleased by something that makes one's life go worse (e.g., malicious gossip).

  **Leaf 5: Mode Attitudinalism**
  *   **Statement:** Pleasure is a way of undergoing an experience (e.g., intrinsically wanting it) rather than a desire for it.
  *   **Awkward Commitment:** Must distinguish the "mode" from the "quality" without reintroducing a distinctive phenomenology.

  **Leaf 6: Determinable Disjunctivism**
  *   **Statement:** Pleasure is a determinable whose determinates (sensory, intellectual, relief) share nothing qualitative.
  *   **Awkward Commitment:** Must accept the class is a gerrymander, risking the claim that "pleasure" names no natural kind.

  **Leaf 7: Eliminativism**
  *   **Statement:** Serious psychology and ethics should stop using the category "pleasure" entirely.
  *   **Awkward Commitment:** Must rewrite standard welfare economics and moral theory without a proxy for positive experience.

  ***

  ## Undefended Combinations

  1.  **Qualitative Eliminativism (Q1 Yes + Q2 Disparate/Empty + Q4 Eliminative):** Incoherent; one cannot affirm a distinctive quality while denying the category exists.
  2.  **Functional Double-Duty Realism (Q3 Function + Q4 Same Feature):** Unattractive; functional roles explain action, but rarely ground normative value directly.
  3.  **Phenomenal Disjunctivism (Q1 Yes + Q2 Disparate):** Unexplored; claims a feel exists but varies so wildly it offers no unifying explanation.

  ***

  1.  **Mode Attitudinalism and Pro-Attitude Hedonism:** The tree groups both under "Mental Stance + Separation"; only fine-grained analysis of "wanting" vs. "mode" separates them.
  2.  **Determinable Disjunctivism and Eliminativism:** The tree groups both under "Disparate/Empty"; the distinction rests on whether the gerrymandered class remains useful.
  3.  **Qualitative Hedonism and Mode Attitudinalism:** Both can accommodate the climber case by positing unnoticed internal states; the tree relies on the subject's report to separate them.
  4.  **Functional Hedonism and Hybrid Attitudinalism:** Both are Non-Phenomenal and Unified; the tree separates them by "Role" vs. "Stance," but neural implementation blurs this line.
  5.  **Hybrid Attitudinalism and Pro-Attitude Hedonism:** Both are Attitudinal; the tree separates them by the Double-Duty constraint, but value theories often shift to align classification with benefit post-hoc.
