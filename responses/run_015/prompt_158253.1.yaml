answer: |-
  This is a fantastic framing. You have the exact right toolkit to cut through the philosophical fog of Predictive Processing (PP) and Active Inference (AI). The reason you feel like you might be "smuggling assumptions" is that PP *is* control theory, but it makes ontological claims that engineering usually sidesteps.

  Here is the translation of the PP/AI framework into your native Control vocabulary, followed by the residue report and the answers to your specific sticking points.

  ### 1. The Translation Layer

  | Predictive Processing Term | Control Engineering Equivalent | Notes |
  | :--- | :--- | :--- |
  | **Generative Model** | **Process Model / Plant Model** ($\hat{x}_{k+1} = A\hat{x}_k + Bu_k$) | The internal simulation of how states evolve. |
  | **Hidden Causes** | **State Vector** ($x$) | The true physical state you are trying to estimate. |
  | **Sensory Input** | **Measurements** ($y$) | Sensor readings, subject to noise. |
  | **Prediction Error** | **Innovation** ($\nu_k = y_k - H\hat{x}_k$) | The residual between expected and actual measurement. |
  | **Precision** | **Inverse Measurement Covariance** ($\Pi = R^{-1}$) | Confidence in the sensor channel. |
  | **Perception** | **State Estimation Update** (Kalman Update) | Adjusting $\hat{x}$ to minimize innovation. |
  | **Action** | **Control Input** ($u$) | MPC style: choosing $u$ to minimize future cost. |
  | **Priors / Preferred States** | **Reference Trajectory** ($r$) & **Constraints** | Where the system *wants* the states to be. |
  | **Free Energy Minimisation** | **Cost Function** ($J$) | $J = \text{Error}^T \Pi \text{Error} + \text{Complexity Penalty}$ |
  | **Attention** | **Gain Scheduling on $R$** | Dynamically weighting which sensors matter. |

  #### The Charles Bonnet Case Study (in your terms)
  Your grandmother's macular degeneration is a **sensor failure mode**.
  1.  **Sensor Noise ($R$):** The visual input covariance $R$ has gone to infinity (signal is gone).
  2.  **Kalman Gain ($K$):** Since $K = P H^T (H P H^T + R)^{-1}$, as $R \to \infty$, $K \to 0$.
  3.  **Result:** The estimator stops trusting measurements. It runs **open-loop** on the process model (her priors/memory).
  4.  **Hallucinations:** The "little figures" are the trajectory of the internal model $\hat{x}$ evolving without correction from $y$.
  5.  **Insight:** She knows they aren't real because a **higher-order hierarchy** (meta-cognition) is comparing the visual layer's output against other sensor modalities (touch, logic) and flagging a consistency error. The visual loop is divergent, but the supervisory loop is stable.

  ---

  ### 2. The Sticking Points

  #### (1) Precision/Attention vs. Measurement Covariance
  **Your intuition:** In your Kalman filters, $R$ is identified off-line. In PP, precision is regulated moment-to-moment. Is this just adaptive gain?

  **The Translation:**
  It is an **Adaptive Kalman Filter where $R_t$ is a state variable being estimated alongside $x_t$.**
  In standard control, you assume sensor noise is exogenous. In PP, the "noise" is endogenous uncertainty. The system maintains a distribution over the reliability of its own sensors.

  *   **Mechanism:** The system minimizes prediction error *with respect to precision* as well as state. If a sensor channel is consistently noisy (high innovation variance), the system down-weights its precision ($\Pi \downarrow$).
  *   **Attention:** "Attention" is simply the act of increasing $\Pi$ for a specific channel. By increasing precision, you increase the Kalman Gain for that channel, forcing the state estimate to align with that sensor.
  *   **Is it just adaptive gain?** Mathematically, yes. Conceptually, no. In control, you tune $R$ to make the filter converge. In PP, tuning $\Pi$ *is* the act of selecting what to perceive. It collapses the distinction between "filter tuning" and "perceptual content."

  **Verdict:** This translates cleanly, but requires you to accept that the "tuning parameters" are dynamic states optimized in real-time, not fixed constants.

  #### (2) The Dark Room Problem vs. Degenerate Optima
  **Your intuition:** Is the "Dark Room" (minimizing surprise by hiding in a dark room and dying) just a specification gaming / degenerate optimum problem?

  **The Translation:**
  Yes, it is exactly a **degenerate optimum caused by a misspecified cost function.**
  If your cost function is $J = \sum (y - \hat{y})^2$, the global minimum is $y=0$ (no input). If the controller can disconnect the sensors, it will. This is "wireheading" or specification gaming.

  *   **PP Solution:** Active Inference adds **Priors over States** (Preferred States). The cost function isn't just "minimize error," it is "minimize error *relative to a specific reference trajectory*."
  *   **Control Analog:** You have a reference signal $r(t)$ that says "Blood Glucose = 100mg/dL" or "Body Temp = 37°C." Sitting in a dark room violates these homeostatic constraints. The "Dark Room" is a local optimum, but the homeostatic priors act as **hard constraints** or a **time-varying reference** that forces exploration (action) to maintain viability.
  *   **Why it bites harder:** In control, if you get a degenerate optimum, you fix the spec. In PP, they claim this is the *definition* of life. A system that doesn't have these "existence priors" physically dissolves. They are trying to derive the reference signal from the physics of the system itself, rather than an operator setting it.

  **Verdict:** It is specification gaming. PP claims to solve it by hard-coding "stay alive" into the priors. Whether that counts as a solution or just kicking the can (who sets the priors?) is the philosophical residue.

  ---

  ### 3. The Residue Report

  Here is where your vocabulary fits, where it stretches, and where it breaks.

  #### A. Translates Cleanly (The "Green Zone")
  *   **Hierarchical Control:** PP is essentially Cascade Control. Lower levels handle fast dynamics (reflexes, edges), higher levels handle slow dynamics (objects, plans). The "prediction error" passed up the hierarchy is just the residual from the lower loop.
  *   **Integral Windup:** This maps to **Psychological Fixation**. If the system cannot reduce prediction error (cannot achieve the reference), and it keeps integrating the error, you get rigid, maladaptive behavior (obsession/delusion).
  *   **Estimator Divergence:** Psychosis. When the internal model decouples from reality entirely (like your grandmother's visual cortex, but system-wide).

  #### B. Translates with Distortion (The "Yellow Zone")
  *   **Priors vs. References:**
      *   *Control:* A reference $r$ is a deterministic setpoint.
      *   *PP:* A Prior is a *probability distribution*. It's not "Temp = 37", it's "Temp $\sim \mathcal{N}(37, 0.1)$".
      *   *Distortion:* You have to treat your MPC reference trajectory as probabilistic. This changes the cost function from quadratic error to KL-divergence. It's doable (Stochastic MPC), but not standard industrial practice.
  *   **Action vs. Control:**
      *   *Control:* $u$ affects the plant.
      *   *PP:* $u$ affects the *sensory input* to match the prediction.
      *   *Distortion:* In control, we usually want $y \to r$. In PP, we want $y \to \hat{y}$ (where $\hat{y}$ is generated from priors). It's a subtle shift from "track the command" to "make the world look like the command." It implies the command is generated internally, not externally.

  #### C. No Counterpart (The "Red Zone")
  *   **The Model *Is* The Plant:**
      *   *Control:* There is a clear boundary between the Controller (code) and the Plant (reactor).
      *   *PP:* The brain *is* the model. There is no separation. The "physics" of the neuron *is* the inference.
      *   *Residue:* You can simulate a KF on a reactor. You cannot simulate a PP agent without *being* the PP agent. This is ontological, not mathematical.
  *   **Valence / "Goodness":**
      *   *Control:* Stability is binary (stable/unstable). Performance is scalar (cost).
      *   *PP:* There is an inherent "goodness" to minimizing Free Energy that is supposed to map to *subjective experience* (pain/pleasure).
      *   *Residue:* Your vocabulary has no term for "suffering." PP claims prediction error *is* suffering. This is where the engineering analogy hits the hard wall of phenomenology.

  ### 4. Vocabulary Missing vs. PP Fuzziness

  **Where your vocabulary is missing something:**
  Control theory is agnostic about *why* the reference signal exists. You tune for stability and performance, but you don't ask "Why does the reactor want to be at 200°C?" PP attempts to answer *why* the reference signal exists (homeostasis, survival). If you want to model *agency* rather than *regulation*, your vocabulary needs the concept of **endogenous reference generation**.

  **Where PP is fuzzier than it sounds:**
  PP often glosses over the **computational cost** of the inference.
  *   In your MPC, you know the solver time. If the horizon is too long, the system crashes.
  *   PP often assumes the brain performs gradient descent on Free Energy instantly. It hand-waves the "solver time" problem.
  *   **The "Degenerate Optima" in PP:** PP theorists sometimes treat "Priors" as a magic bullet. In control terms, if your constraints contradict your dynamics, the solver is infeasible. PP sometimes implies the system *creates* reality to match priors, which sounds like magic until you realize they mean "action." But the boundary between "changing the world" and "hallucinating" is just a gain setting ($\Pi$). If $\Pi_{proprioception}$ is too low, you can't tell if you moved or imagined moving. PP acknowledges this, but often lacks the rigorous stability margins you'd demand in a batch reactor.

  ### Summary for your Grandmother's Case
  You are not smuggling assumptions. You are seeing the isomorphism clearly.
  *   **CBS** is a sensor-failure induced open-loop estimator drift.
  *   **Precision** is adaptive gain scheduling on sensor covariance.
  *   **Dark Room** is a degenerate optimum solved by homeostatic constraints (reference signals).

  The only thing you are missing is the claim that this math *explains qualia*. As a control engineer, you can safely ignore that residue. The rest is just stochastic MPC with a very aggressive adaptation law on the measurement noise covariance.
