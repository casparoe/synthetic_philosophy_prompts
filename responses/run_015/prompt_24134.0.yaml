      *   *Indeterminacy:* Constant tracking vs. "maybe" watched. Fit: Break. (Digital is often *constant* and *retrospective*, not just the *possibility* of observation).
      *   *Internalized Self-Surveillance:* Self-censorship vs. Algorithmic nudging. Fit: Partial. (Panopticon creates docile bodies; Digital creates datafied subjects optimized for engagement).
