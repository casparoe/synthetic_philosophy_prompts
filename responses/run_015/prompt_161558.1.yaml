answer: |-
  Good evening. Thank you for coming. To the family who traveled from Baden-Württemberg, to the neighbors from the street, and to the people from the plant. We are here because my father-in-law is being naturalized. But I want to say something about the man he was before today, and what his fifty-two years here tell us about how to live.

  I have no training in this. I read in the evenings, on my own. But for a few years I have been chewing on a difference I keep seeing in how people picture a decent person. On one side, there is the idea that decency means keeping the path cleared. You do the thing that is the thing to do. You keep the slot. This is expected of you on ordinary Tuesdays when nothing is at stake, and the smallness of the occasion is not thought to excuse you. On the other side, there is the idea that decency means answering to something in yourself. You are ready to break a rule, or refuse an order, when the rule asks something your conscience will not give. Each side has a stock of examples in which the other side's ideal produces something ugly. I have never been able to settle which of the two has the better of it.

  But watching him, I have started sorting rules into two kinds. I have not found anyone else making this distinction, so it may be simply wrong. But it fits what I see. There are load-bearing rules and training-weight rules. A load-bearing rule is doing a job at the moment you follow it. Its point can be explained to anyone in a sentence. If you skip it, the part does not fit. A training-weight rule does nothing in the moment and everything over a lifetime. No one is watching. Nothing goes wrong if you skip it. Its job is not to keep the machine running, but to keep you running. It is practice for a day you cannot predict. To an outsider, a training weight looks like wasted effort. It looks like stubbornness. But it is actually preparation.

  Consider the logbook. For thirty-one years, he kept a handwritten record of every machine setting he changed. After 2004, the plant logged everything digitally. Nobody ever read his book again. He kept it up anyway, every day, until he retired. When asked why, he said it is simply what you do. That was a training weight. It did not help the machine. It helped him. It kept the habit of accuracy warm when no one was checking. It ensured that on a day when accuracy mattered more than safety, the habit was still there.

  Consider 1990. A foreman told him to sign off on a run of parts he had not measured himself, ahead of a Friday shipment. He refused. He was moved off that line for a while. He has never mentioned it himself. I heard it from a former coworker. That was a day when following a rule cost something real. It was not a training day. It was a day when the account had to be spent.

  People argue about which picture is better. The one who keeps the slot, or the one who stands up. I think they are blind to each other's half. The rule-habit stocks the account. The conscience spends it. If you skip the small things because nothing is at stake, you will not have the strength when something is at stake. The small cases are where the mattering happens, because that is where the muscle is built. You cannot summon a spine for the big moment if you have been bending for the small ones. The training weight feels pointless until the day it is the only thing holding you up.

  So which side does his life support? It supports the view that these are not rivals. The picture of keeping the path wins the small cases because that is where the character is forged. The picture of answering to yourself wins the large cases because that is where the character is used. They only look like opponents because each is blind to the other's half. His life is evidence that you need the first to do the second.

  He is not becoming one of us. He is not staying one of them. He is showing us how to be a person who can do both. To his brothers, and to everyone here: thank you for the lesson. We often think we must choose between keeping the rule and keeping our soul. His life says we do not choose. We keep the rule so that we can keep our soul. Welcome to the country. But mostly, thank you for the work.

  ***

  **Note to the Speaker**

  The single sentence doing the heaviest work is: **"The rule-habit stocks the account. The conscience spends it."**

  This sentence is weakest because it relies on a financial metaphor that implies a finite resource. A critic could argue that conscience is not a withdrawal from a habit account, but a separate faculty entirely, or that one can spend (act on conscience) without having stocked (practiced small rules). If someone pushes back, they will likely argue that moral courage is innate or spontaneous, not a cumulative result of mundane discipline. You should be prepared to defend the idea that habit is the *enabler* of conscience, not just its precursor.
