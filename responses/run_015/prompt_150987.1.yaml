          *   *Implication for Rachel:* Undermines the simplicity of the slogan. If the "vote" is unintelligible, the slogan fails as a guide.
          *   *Support for Pledge?* No. Makes both harder, but institutional buyers have more power to audit supply chains.

  4.  **Address the "Pivot Problem":**
      *   User asks: *Votes need pivotality; purchases nudge price. Does the election reading escape the "single vote doesn't matter" worry?*
