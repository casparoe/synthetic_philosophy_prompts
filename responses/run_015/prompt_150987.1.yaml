          *   *Support for Pledge?* Only if the goal is redefined from "impact" to "purity."

      *   *Reading 4 (Signalling/Norms):*
          *   *Claim:* Visible pledges shift culture, influencing others/policy.
          *   *Verdict:* Contested/Defensible. Social norms do shift.
          *   *Implication for Rachel:* Plausible. But does a pledge drive signal better than a high-profile campaign? A campaign might signal institutional commitment. Pledges can be private.
