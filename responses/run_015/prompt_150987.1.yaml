          *   *Implication for Rachel:* Weak. Even if true, it doesn't explain why individual votes > institutional votes.
          *   *Support for Pledge?* No.

      *   *Reading 6 (Wild Animal Suffering/Complexity):*
          *   *Claim:* Purchases have complex causal chains (feed crops, field mice).
