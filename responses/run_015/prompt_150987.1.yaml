      *   Resolution: The "Threshold" model (Reading 2) is the only one that makes purchases like votes (binary outcomes). But as noted, institutional changes are *more* pivotal than individual dietary changes. So the analogy backfires on Rachel.

  5.  **Address the "Wild Animal Suffering" (WAS) Issue:**
