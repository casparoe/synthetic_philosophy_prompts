  *(Self-Correction Note on "Pivot Problem"):* I need to be careful not to conflate the "expected utility" argument with the "pivotality" argument. The user distinguishes them. The "Threshold" reading *is* the pivotality argument applied to markets. I should clarify that.

  *(Self-Correction on WAS):* The user asks if the slogan helps choose between foods. The answer is a hard "No." The slogan assumes the voter knows what they are voting for. WAS shows they don't. This weakens the Pledge (individuals can't research supply chains) vs. Supplier (institution can demand data).

