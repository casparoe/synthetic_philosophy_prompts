      *   **Task:** Deconstruct the slogan "you vote with your fork" into distinct claims/readings. Evaluate each for truth/plausibility (Platitude, Contested/Defensible, Wrong). Determine if each reading supports Rachel's conclusion (Pledge > Supplier Campaign). Address the "pivot problem" (votes vs. purchases) and the "wild animal suffering" complication.
      *   **Tone:** Rigorous, honest, non-diplomatic, analytical. No fluff.

  2.  **Deconstruct "You Vote With Your Fork":**
      The user has already identified several potential readings. I need to formalize them, evaluate them, and check their implication for the specific strategic choice (Pledge vs. Supplier).

      *   *Reading 1: The Micro-Economic Causal Claim.* (Demand curves slope down).
      *   *Reading 2: The Threshold/Lumpy Decision Claim.* (Pivotality in supply chains).
      *   *Reading 3: The Expressive/Complicity Claim.* (Moral integrity, not outcomes).
      *   *Reading 4: The Signalling/Normative Claim.* (Influencing others).
      *   *Reading 5: The Market Democracy Claim.* (Legitimacy/Aggregate will).
      *   *Reading 6: The Wild Animal/Complex Causal Claim.* (Unintended consequences).

  3.  **Evaluate Each Reading:**

      *   *Reading 1 (Micro-Economic):*
          *   *Claim:* Buying less reduces demand, lowering price/quantity marginally.
          *   *Verdict:* Platitude/True. Economics 101.
          *   *Implication for Rachel:* Weak. The objection was "basically nothing." This admits it's "basically nothing." Does "nothing" add up? Yes, but does *one* pledge matter more than *one* institutional vote? Probably not. Institutional change moves orders of magnitude more volume.
          *   *Support for Pledge?* No.

