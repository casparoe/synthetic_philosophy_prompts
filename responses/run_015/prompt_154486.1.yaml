prompt: |-
  Germany has now completed its nuclear phase-out, having justified it largely in precautionary terms, across years in which coal still supplied a large share of its electricity; France, facing the same climate arithmetic, has chosen instead to keep and extend a fleet that supplies most of its electricity with low operational emissions but leaves waste that must be isolated over many thousands of years. I want to set aside which country got it right and ask about the shape of the reasoning involved.

  What puzzles me is an asymmetry inside a single regulatory culture. Applied to nuclear, the state refuses to let a very small probability of a catastrophic release be traded off against expected benefits: a thick tail disqualifies the technology, no level of expected harm counts as tolerable, and the waste must be shown to be containable over timescales exceeding the life of any institution that produced it. Applied to the fossil-fuel alternative, the same state regulates by thresholds and cost-benefit balancing: it demands reduction rather than elimination, accepts harms that are large in aggregate and well characterised statistically, imposes no comparably strict containment or escrow duty on those who create long-lived costs, and treats diffuse and delayed harm to anonymous people as a different sort of problem.

  What view of risk — or of what we owe to those we expose to risk — does this pattern presuppose? Reconstruct the implicit theory rather than diagnosing it: say what the practice strictly requires its theory to commit to, what the theory merely sits well with, and where the practice is underdetermined, so that several theories could license it. In particular, can one expected-utility calculation with some discount rate generate the asymmetry, or does it need a qualitative distinction between kinds of hazard — concentrated against diffuse, dread against statistical, hazards that outlive every institution responsible for them against hazards whose victims and beneficiaries are contemporaries? Are the two halves consistent? One defence I have heard is a principle of counterfactual-baseline discipline: a technology may be rejected only if what will actually be built in its place is safer on the same metric, so refusing nuclear for coal fails while refusing nuclear for renewables and storage passes. A second is that the state does not impose the coal deaths but merely declines to prevent them by one particular means. Do these defences carry the weight the practice puts on them, can they be combined, and can either handle the waste objection — that a hazard lasting longer than any responsible institution differs in kind, not merely in degree? Finally, if the implicit theory were replaced by one uniform rule for all energy hazards, what would have to change in regulation, and what would be lost?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Subject:** The asymmetry in regulatory reasoning between nuclear power (Germany's phase-out) and fossil fuels (coal) within the same regulatory culture.
      *   **The Asymmetry:**
          *   *Nuclear:* Precautionary principle, zero tolerance for catastrophic tail risk, intergenerational waste containment (exceeding institutional lifespans), deontological constraints (some risks are impermissible regardless of benefit).
          *   *Fossil Fuels:* Cost-benefit analysis, thresholds rather than elimination, acceptance of aggregate statistical harm, diffuse/delayed harm treated differently, no strict containment/escrow for long-lived costs (climate change).
      *   **Task:** Reconstruct the *implicit theory* of risk and obligation presupposed by this practice.
      *   **Specific Requirements:**
          *   Distinguish what the theory *must* commit to vs. what it *sits well with* vs. where it is *underdetermined*.
          *   Address whether a single expected-utility calculation (with discounting) can explain the asymmetry or if a qualitative distinction is needed.
          *   Evaluate two specific defenses: (1) Counterfactual-baseline discipline (replace with safer alternative), (2) Action vs. Omission (state doesn't impose coal deaths, just declines to prevent them via nuclear).
          *   Address the "waste objection" (hazards outliving institutions).
          *   Analyze consistency.
          *   Speculate on the consequences of adopting a uniform rule (what changes, what is lost).

  2.  **Initial Brainstorming & Conceptual Mapping:**

      *   *Risk Perception:* Psychometric paradigm (Slovic). Dread risk (nuclear) vs. Statistical risk (coal). Controllability, observability, catastrophic potential.
      *   *Ethical Frameworks:* Deontology (rights, constraints) vs. Consequentialism (utilitarianism). The nuclear stance looks deontological ("do not play god with millennia"); the coal stance looks utilitarian ("balance costs and benefits").
      *   *Temporal Ethics:* Non-identity problem, discount rates, intergenerational justice. Nuclear waste is a specific, identifiable burden on the future; Climate change is a diffuse, probabilistic burden.
      *   *Political Philosophy:* Legitimacy of the state. Can the state guarantee safety for 10,000 years? No. Therefore, it shouldn't create the waste. Can the state regulate emissions? Yes.
      *   *Expected Utility:* Can discounting explain it? High discount rates make future waste negligible, but the prompt says the state *rejects* nuclear *because* of the waste. So standard discounting fails to explain the nuclear aversion. It might explain the coal acceptance (future climate damages discounted). This suggests *different* discount rates or *incommensurability*.

  3.  **Drafting the Reconstruction (Section by Section):**

      *   **Introduction:** Acknowledge the profundity of the question. It's about the moral grammar of risk regulation.
      *   **The Implicit Theory (The "Dual-Register" Theory):**
          *   *Commitments:* The theory must commit to a distinction between *agency-imposed risk* (nuclear) and *background/omitted risk* (coal). It must commit to a threshold of "institutional competence" (we can't guarantee 10k years).
          *   *Fits Well:* Cultural Theory of Risk (Douglas/Wildavsky). Hierarchy vs. Individualism. Dread factors.
          *   *Underdetermined:* Why is the threshold set *there*? Why is climate harm not treated as an institutional failure?
      *   **Expected Utility vs. Qualitative Distinction:**
          *   Can EU do it? No. Standard EU would likely favor nuclear over coal given mortality stats and climate costs. To get the observed result, you need *lexicographic preferences* (catastrophe trumps all) or *infinite disutility* for specific types of outcomes (institutional collapse/waste).
          *   Qualitative Distinction is necessary. Concentrated/Intentional vs. Diffuse/Systemic.
      *   **Evaluating the Defenses:**
          *   *Counterfactual-Baseline:* "Only reject if replacement is safer." This is strong for renewables, weak for coal. If Germany switched to coal, this defense fails unless "safety" is redefined to exclude CO2.
          *   *Action vs. Omission:* "We don't impose coal deaths." This relies on a doctrine of doing vs. allowing. It holds legally but struggles morally if the state controls the energy mix.
          *   *The Waste Objection:* This is the hardest nut. Coal leaves CO2 (also lasts millennia). Why is spent fuel different? *Specific containment* vs. *Atmospheric mixing*. One is a deliberate burial of poison; the other is a side effect of burning. The theory requires a distinction between *designed longevity of hazard* vs. *incidental longevity of byproduct*.
      *   **Consistency:** They are logically inconsistent under a single moral framework (e.g., pure utilitarianism). They are consistent under a *political legitimacy* framework (State cannot promise what it cannot keep).
      *   **Uniform Rule Scenario:**
          *   *If Nuclear Rules applied to Coal:* Coal banned immediately. No carbon budget.
          *   *If Coal Rules applied to Nuclear:* Nuclear expanded, waste stored "adequately" for a few hundred years, probabilistic risk assessment accepted.
          *   *What is lost?* If we go uniform Nuclear-style: Energy poverty, loss of flexibility. If we go uniform Coal-style: Loss of the "precautionary" safeguard against existential tail risks, erosion of trust in long-term stewardship.

  4.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction:* I need to be careful not to just say "Germany is hypocritical." The prompt asks to *reconstruct the theory*, not diagnose the hypocrisy. I need to find the internal logic that makes this make sense *to the regulators*.
      *   *Key Insight:* The logic isn't about *physics*; it's about *political sovereignty*. The state claims a monopoly on violence and safety. It can regulate emissions (flow), but it cannot guarantee the containment of a stock (waste) beyond its own projected lifespan. To create the waste is to claim a power the state admits it does not have. To burn coal is to accept a chaos (climate) that no single state controls anyway.
      *   *Discounting:* I need to explicitly address the discount rate question. A single discount rate cannot generate the asymmetry. You need a *lexical* priority rule or distinct discount rates for different *types* of goods (institutional integrity vs. economic output).
      *   *The "Waste" vs. "CO2" distinction:* CO2 is a "public bad" dispersed globally. Nuclear waste is a "point source bad" localized but requiring active management. The regulatory burden is on *management*, not just *existence*.

  5.  **Structuring the Response:**

      1.  **Introduction:** Define the "Dual-Register Theory of Risk Legitimacy."
      2.  **Core Commitments:** What the theory *must* hold (Agency, Institutional Horizon, Commensurability).
      3.  **Expected Utility Analysis:** Why standard EU fails; need for Lexical Thresholds.
      4.  **Evaluating the Defenses:** Counterfactual Baseline & Action/Omission.
      5.  **The Waste/CO2 Distinction:** Containment vs. Dispersion.
      6.  **Uniform Rule Counterfactual:** Consequences of harmonization.
      7.  **Conclusion:** Summary of the trade-off (Legitimacy vs. Optimization).

  6.  **Drafting the Content (Iterative refinement during drafting):**
      *   *Focus on the "State" aspect:* The prompt mentions "institution that produced it." This is key. The state is an agent.
      *   *Tone:* Philosophical, analytical, precise. Avoid taking sides on nuclear vs. coal.
      *   *Check against prompt:* Did I answer "what the practice strictly requires"? Yes. "What sits well"? Yes. "Underdetermined"? Yes. "Defenses"? Yes. "Uniform rule"? Yes.

  7.  **Final Polish:** Ensure terms like "lexical priority," "intergenerational equity," "doctrine of doing and allowing," and "political legitimacy" are used correctly. Make sure the distinction between *risk as probability* and *risk as legitimacy* is clear. (Self-correction: Ensure I don't get bogged down in the specific German politics, keep it on the *reasoning structure*.)

  8.  *(Final check of the "Waste Objection" part)*: The prompt asks if the defenses can handle the waste objection. I need to be explicit here. The Action/Omission defense struggles with waste because waste is a *created* omission (we made the trash, now we omit cleaning it up forever). The Counterfactual defense works only if renewables are the baseline. I need to highlight this tension.

  9.  *(Final check on "Uniform Rule")*: What is lost? If we treat coal like nuclear, we lose the ability to function within a global commons where others pollute. If we treat nuclear like coal, we lose the specific cultural contract regarding "toxic sovereignty."

  10. **Final Review against constraints:** No moralizing about which is better. Focus on the *shape of reasoning*.

