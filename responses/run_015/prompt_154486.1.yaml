answer: |-
  The asymmetry you describe is not merely a policy inconsistency; it is the surface expression of a **Dual-Register Theory of Risk Legitimacy**. To reconstruct the implicit theory, we must look beyond the physical properties of the hazards and examine the conditions under which the state claims the authority to impose them.

  Here is a reconstruction of the reasoning structure, divided into its necessary commitments, its relationship to expected utility, the viability of its defenses, and the consequences of harmonization.

  ### 1. The Implicit Theory: Commitments, Fits, and Gaps

  The regulatory practice presupposes a theory that distinguishes between **sovereign risks** and **systemic risks**.

  **What the theory strictly requires (The Commitments):**
  1.  **The Principle of Institutional Horizon:** The state may not authorize a hazard that requires active containment or institutional memory exceeding the projected lifespan of the state itself. Nuclear waste requires a "guardian" for millennia; the modern democratic state cannot guarantee its own continuity for millennia. Therefore, creating the waste is an act of *illegitimate sovereignty* (promising what you cannot keep).
  2.  **The Distinction between Imposition and Acceptance:** There is a moral difference between *introducing* a novel, concentrated mechanism of harm (nuclear reactor) and *continuing* to tolerate a diffuse, background mechanism of harm (fossil fuel combustion). The state is responsible for what it *licenses*, not necessarily for what it *fails to ban* if the ban requires breaking the existing economic substrate.
  3.  **Incommensurability of Catastrophe:** Certain tail risks (core melt, permanent contamination) are lexically prior to aggregate statistical harms. You cannot trade a probability of "uncontainable toxicity" against a certainty of "statistical mortality."

  **What the theory sits well with (The Resonances):**
  *   **The Psychometric Paradigm of Risk:** This aligns with public perception research (e.g., Slovic) where "dread risks" (uncontrollable, catastrophic, involuntary) are weighted heavier than "statistical risks" (familiar, voluntary, diffuse). The theory codifies this psychological asymmetry into law.
  *   **Political Realism:** It acknowledges the state's limited capacity. It is politically easier to regulate a flow (emissions) than to guarantee the security of a stock (waste) against future political collapse.

  **Where the practice is underdetermined (The Gaps):**
  *   **The CO2 Equivalence:** The theory does not strictly explain why atmospheric CO2, which also persists for millennia and threatens institutional collapse, is treated as a "flow" to be managed rather than a "stock" to be contained. The theory is underdetermined on *why* dispersion legitimizes longevity.
  *   **The Baseline Problem:** The theory does not define the moral baseline. Is the baseline "zero human impact" (which bans both) or "current technological suite" (which favors coal)? The practice shifts between these baselines depending on the technology.

  ### 2. Expected Utility vs. Qualitative Distinction

  **Can a single expected-utility (EU) calculation generate this asymmetry?**
  No. A standard EU calculation with a uniform discount rate would almost certainly favor nuclear over coal.
  *   **Mortality:** Coal causes vastly more deaths per TWh (via particulate matter) than nuclear.
  *   **Climate:** Coal has vastly higher externalized carbon costs.
  *   **Discounting:** If you apply a standard social discount rate to future nuclear waste management costs, they become negligible. If you apply the same rate to future climate damages, they also become negligible.

  To generate the observed German asymmetry using EU, you would need **time-inconsistent discounting**: a near-zero discount rate for nuclear waste (making it prohibitively expensive) and a high discount rate for climate damages (making them tolerable). This is mathematically possible but theoretically ad hoc.

  **The Necessity of Qualitative Distinction:**
  The practice requires a **lexical threshold rule**, not a continuous utility function.
  *   **Nuclear:** Triggers a *deontological constraint*. "Do not create permanent poison." The utility of the electricity cannot override the constraint.
  *   **Coal:** Treated as a *consequentialist optimization*. "Minimize harm within constraints."
  *   **The Distinction:** It is not merely concentrated vs. diffuse. It is **designed containment** vs. **incidental dispersion**. Nuclear waste is a *deliberate* creation of a hazardous object that must be guarded. CO2 is an *incidental* byproduct that disperses into a commons the state does not own. The theory posits that the state is liable for the boxes it fills, but not for the air it clouds, provided the clouding stays within regulatory limits.

  ### 3. Evaluating the Defenses

  **Defense 1: Counterfactual-Baseline Discipline**
  *   *Argument:* You may only reject a technology if the actual replacement is safer.
  *   *Weight:* This carries weight only if the replacement is renewables. If the replacement is coal, the defense fails on utilitarian grounds (coal kills more).
  *   *Handling Waste:* It fails to handle the waste objection. Even if renewables replace nuclear, the *existing* waste remains. The baseline defense justifies the *shutdown*, but not the *original sin* of creating the waste, nor does it explain why we don't apply the same logic to coal plants (i.e., "don't build coal unless you have storage").
  *   *Verdict:* Insufficient. It explains the transition timing, not the moral categorization of the hazards.

  **Defense 2: Action vs. Omission (The Doctrine of Doing and Allowing)**
  *   *Argument:* The state *imposes* nuclear risk by licensing the plant; it merely *allows* coal risk by not banning coal.
  *   *Weight:* This is the strongest legal fit. It relies on the distinction between **commission** (creating a new hazard) and **omission** (failing to prevent an existing hazard).
  *   *Handling Waste:* This struggles with waste. Waste is a *created omission*. By burning the fuel, the state actively creates a burden it then omits to fully resolve. However, the defense can pivot: "We created the waste, but we have secured it for the limit of our competence (e.g., 1,000 years). To demand more is to demand magic."
  *   *Verdict:* Plausible, but relies on a fragile distinction. If the state controls the energy grid, the distinction between "licensing nuclear" and "licensing coal" collapses; both are active state choices.

  **Can they be combined?**
  Yes. The combined theory is: *The state minimizes aggregate harm (EU) subject to the constraint that it does not actively create hazards requiring stewardship beyond its institutional horizon (Deontology).*
  *   This explains why nuclear is banned (violates the horizon constraint).
  *   This explains why coal is tolerated (does not violate the horizon constraint; the harm is diffuse and the "containment" is the atmosphere, which the state does not claim to own).

  **Does this handle the Waste Objection?**
  Only partially. The objection states: *A hazard lasting longer than any responsible institution differs in kind.*
  The combined theory accepts this premise for nuclear waste but rejects it for CO2. Why? Because nuclear waste is **localized and excludable**. It requires a specific institution to guard a specific site. CO2 is **global and non-excludable**. No single institution *can* guard the atmosphere. Therefore, the "institutional horizon" constraint applies only to hazards that *could* theoretically be guarded by a state. Since no state can guard the atmosphere, the state is not held to the "institutional horizon" standard for climate. This is a distinction based on **governability**, not physics.

  ### 4. Consistency and the Uniform Rule Counterfactual

  **Are the two halves consistent?**
  They are **politically consistent** but **ethically inconsistent**.
  *   *Political Consistency:* Both rules protect state legitimacy. Banning nuclear protects the state from blame for a future catastrophe it cannot prevent. Regulating coal (rather than banning) protects the state from economic collapse it cannot survive. Both preserve the state's continuity.
  *   *Ethical Inconsistency:* They violate the principle of impartiality regarding victims. A future person dying from leaked waste is treated as a violation of rights; a future person dying from climate change is treated as a statistical cost.

  **If replaced by a Uniform Rule:**

  **Scenario A: Uniform Nuclear Standard (The Precautionary Absolute)**
  *   *Change:* Apply the "no long-term uncontained hazard" rule to CO2.
  *   *Result:* Immediate ban on fossil fuels. Carbon Capture and Storage (CCS) would be required to meet the same containment standards as nuclear waste (i.e., proof of isolation for 10,000 years). Most CCS projects would fail this test.
  *   *What is lost:* **Energy Security and Economic Continuity.** The state would be forced to abandon the existing energy substrate before replacements are fully scalable, risking blackouts and economic contraction. It prioritizes *moral purity* over *systemic resilience*.

  **Scenario B: Uniform Coal Standard (The Cost-Benefit Pragmatist)**
  *   *Change:* Apply probabilistic risk assessment and discounting to nuclear waste.
  *   *Result:* Nuclear expansion. Waste would be stored in facilities designed for "reasonable" timeframes (e.g., 300 years) with the assumption that future generations will manage it or that the probability of leakage is an acceptable cost per kWh.
  *   *What is lost:* **Intergenerational Trust and Sovereign Restraint.** The state admits it is willing to mortgage the safety of future institutions for current convenience. It dissolves the "guardian" role of the state, turning it into a pure utility maximizer. It risks a loss of public trust, as the "dread" factor of nuclear power is not eliminated by cost-benefit analysis.

  ### 5. Conclusion: The Theory of Sovereign Competence

  The implicit theory is not primarily about **safety**; it is about **sovereign competence**.

  The asymmetry presupposes that the state is a temporal entity with a limited horizon. It accepts responsibility for harms that fall within its administrative capacity to manage (coal emissions, which can be taxed or filtered) but refuses responsibility for harms that exceed its administrative capacity to guarantee (nuclear waste, which requires a guardian that may not exist).

  The "waste objection" is therefore not a bug in the theory, but a feature. The theory admits: *We are not gods. We cannot promise safety for 10,000 years. Therefore, we will not make the thing that requires that promise.* The fact that coal also creates a 10,000-year problem is rationalized away because the atmosphere is not a container the state claims to manage.

  To harmonize the rules would be to force the state to either act as a god (guaranteeing atmospheric safety) or as a merchant (selling future safety for current power). The current asymmetry allows the state to remain a **steward**: protecting the present from catastrophe (nuclear) while managing the decline of the past (coal). It is a theory of risk management designed to preserve the legitimacy of the regulator, rather than to minimize the aggregate harm to the regulated.
