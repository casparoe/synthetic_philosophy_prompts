      *Self-Correction on Q4/Q5:* Ensure the follow-up is keyed to the *likely* answer. The likely answer is that the error is deviation. So the follow-up must trap that definition.

      *Self-Correction on Q10:* Make it sharp. "What observation... could actually count against."

      *Check Count:* 10 questions total.

      *Check Brainstorm:* Keep it short and punchy.

      *Check Persona:* "Act like a philosophy interviewer who knows Popper cold and is a little skeptical." Use phrases like "Popper's own sense," "degenerate case," "error-elimination."

      *Final check on "no 'it depends'":* Phrasing like "Is it X or Y?" forces a choice. "What specifically..." forces detail.

