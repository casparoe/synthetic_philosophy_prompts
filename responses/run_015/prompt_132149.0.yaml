answer: |-
  This configuration does not have a single, universally settled label in the literature, though it is often discussed under the umbrella of "Gettier-style cases for moral worth" or "the problem of coincidental rightness." Because existing terms tend to blur the specific epistemic breakdowns you are highlighting, I will coin a term to capture the precise defect: **Fragile Moral Worth**.

  The underlying mechanism causing this fragility is **Normative Decoupling**. This occurs when the agent's motivating reason (what actually moves them to act) is decoupled from the normative reason (the fact that actually makes the action right), even if the two happen to overlap in extension.

  Here is the carving of the distinction, the assessment of credit, and the boundaries of the concept.

  ### One Defect or Two?

  Cases (1) and (2) are two distinct *epistemic* paths to a single *moral* defect.

  **Case (1) is Misidentified Instantiation.**
  The agent is committed to the correct general principle (procedural integrity) but identifies the wrong specific fact as the trigger. She acts on the belief "Procedure X is tainted," where X is false. Coincidentally, Y is true and also taints the procedure.
  *   **The Defect:** Her commitment is to the *signal* (the email), not the *value* (integrity).
  *   **The Proof:** The counterfactual test. If the email had been clean (hiding X), she would have ignored Y. She is not tracking integrity; she is tracking the email.

  **Case (2) is Opaque Justification.**
  The agent identifies the correct specific fact (bad precedent) and the correct general principle (tenant welfare), but the link between them is unintelligible to her. She acts on the belief "I should trust my friend," not "I should protect tenants."
  *   **The Defect:** Her commitment is to *authority*, not *reason*.
  *   **The Proof:** If the friend had given a bad argument for the right conclusion, she would still have acted. She is not tracking the normative force of the precedent; she is tracking the friend's testimony.

  **The Unified Moral Defect:**
  Despite the epistemic difference, both suffer from **Counterfactual Insensitivity**. In moral philosophy, credit usually requires that the agent would not have performed the action if the right-making feature were absent. In both your cases, the agent *would* have performed the action even if the right-making feature were absent (provided their specific, flawed trigger remained), or would have failed to act if the right-making feature were present (provided their specific, flawed trigger were absent).

  Therefore, they share the single moral defect of **Normative Decoupling**: the right-making feature is not doing the work of explaining the action.

  ### Assessment of Credit

  Does this breakage remove credit entirely, reduce it, or leave it untouched?

  **It reduces credit significantly, often to zero.**
  Standard views of moral worth (particularly Kantian and Reasons-Internalist views) hold that an action has moral worth only if the right-making feature is what *explains* the action. In your cases, the explanation is flawed.

  *   **Case (1) warrants near-zero credit.** This is closer to accidental rightness. The agent demonstrates a lack of concern for the actual value (integrity). She is willing to tolerate corruption if it is hidden from her specific line of sight. This suggests a vice (willful blindness or procedural fetishism) rather than a virtue.
  *   **Case (2) warrants reduced credit.** The agent is aligned with the right value, but her grasp is immature. She deserves credit for the *outcome* and for her *trust in reliable sources*, but she does not deserve full moral credit for *understanding* or *wisdom*. She is a novice, not an expert. Her worth is fragile because it depends on the reliability of others, not her own moral perception.

  In neither case does the agent possess **Robust Moral Worth**. Robust worth requires that the agent's psychology is sensitive to the right-making feature across a range of nearby possible worlds.

  ### The Boundary: Harmless vs. Harmful Breakage

  You asked where the boundary lies between a broken route that is harmless and one that destroys credit. The boundary is determined by **Substantive Alignment**.

  **Harmless Breakage (The "Technical Error" Zone)**
  The route is broken, but the agent's core valuation is intact.
  *   *Example:* A doctor refuses a treatment because she believes it violates "Patient Autonomy." She cites the wrong bioethical statute to support this. The statute she cites is irrelevant, but the principle of Autonomy is indeed the right-making feature, and she understands *why* autonomy matters.
  *   *Why it's harmless:* If the statute were different, she would still refuse based on the principle. Her grasp of the value is robust; her citation is merely sloppy. The decoupling is superficial.

  **Harmful Breakage (The "Signal" Zone)**
  The route is broken because the agent is tracking a proxy, not the value.
  *   *Example:* A doctor refuses a treatment because "The Hospital Rule Book says so." It turns out the Rule Book aligns with Autonomy in this case.
  *   *Why it's harmful:* If the Rule Book changed to violate Autonomy, she would follow the book. She is tracking authority, not the patient's good. This is your Case (1) and (2).

  **The Boundary Test:**
  To determine if a case is Harmless or Harmful, apply the **Value-Shift Test**:
  *   *Imagine a nearby world where the right-making feature remains, but the agent's specific trigger is removed.* (e.g., The email is clean, but the rigging remains).
  *   *Imagine a nearby world where the agent's specific trigger remains, but the right-making feature is removed.* (e.g., The friend says "accept," and accepting is actually good).

  If the agent fails to do the right thing in the first scenario, or does the wrong thing in the second, the breakage is **Harmful**, and Moral Worth is **Fragile** (or non-existent). If the agent succeeds regardless, the breakage is **Harmless**, and Moral Worth is **Robust**.

  ### Summary Definition

  **Fragile Moral Worth**
  A status assigned to an agent who performs a right action that aligns with a right-making feature, but whose motivation relies on an epistemic route that is insensitive to that feature. The agent hits the moral target, but lacks the reliable aim necessary for full credit.

  *   **Species A (Misidentified Instantiation):** Tracking the wrong evidence for the right value.
  *   **Species B (Opaque Justification):** Tracking the right conclusion via defective reasoning.
  *   **Verdict:** Credit is diminished or voided because the agent's will is not securely yoked to the good.
