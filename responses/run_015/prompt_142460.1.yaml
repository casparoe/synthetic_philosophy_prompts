  ### The Single Further Case

  To separate **Custodianship** (my prediction) from **Visible Suffering** and **Sovereignty**, you need a case where *Property*, *Suffering*, and *Responsibility* pull in different directions.

  **The Case:** **A badger digging a sett under her bee shed.**
  *   **Context:** The badger is a protected native species (Wild). It is threatening the structural integrity of the shed and potentially the hives (Charges/Property). It is a vertebrate (High Empathy).
