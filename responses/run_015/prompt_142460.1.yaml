  This is a fascinating ethical profile because Mira is clearly not operating on a single, consistent principle like "minimize suffering" or "never kill." She is operating on a **context-dependent hierarchy of responsibility**. She isn't an absolutist; she is a **Custodian**.

  Here is the breakdown of the rule she is running, the alternatives, and the prediction.

  ### The Core Rule: The Hierarchy of Custodianship

  Mira's ethics are relational, not universal. Her moral obligation scales based on what she has actively taken responsibility for.

  1.  **The Self (Body/Comfort):** Absolute sovereignty. (Mosquitoes are zapped instantly).
  2.  **The Charges (Livestock/Crops):** High protection. She has chosen to keep bees and grow tomatoes. She is their guardian. Threats to them are met with efficient, systemic elimination, even if it involves "natural" cruelty (parasitoid wasps eating aphids).
  3.  **The Domestic Sphere (House/Kitchen):** Sanitation and structure. Threats here (ants, mice) are removed, but with a constraint against "grim" methods (no glue strips).
  4.  **The Wild (Commons/Hedge):** Coexistence. Things that are not her responsibility and do not threaten her charges get to live (hedge wasps, single caterpillars).

  **The Methodology Sub-Rule:**
  *   **For Vertebrates/Individuals:** Fast death is preferred (snap trap, swat). Slow death is "grim" (glue strip).
  *   **For Insect Colonies:** Systemic elimination is preferred (borax, parasitoids). Speed is secondary to efficacy because the "colony" is the unit of threat, not the individual worker.

  **Prediction:**
  Mira will use the **Mail-Order Insect-Growth-Regulator (IGR) Bait**.

  **Why:**
  1.  **Threat Classification:** The wasps are attacking her *Charges* (the bees). This moves the wasps from Category 4 (Wild) to Category 2 (Threat to Livestock). She will not "do nothing."
  2.  **Method Consistency:** This is a colony threat. Her precedent for colony threats (ants in the kitchen, aphids on tomatoes) is **systemic elimination**. She uses borax for ants (slow colony death) and parasitoids for aphids (slow individual death). She does not treat insect colonies like mice (individual vertebrates).
  3.  **The "Grim" Factor:** She rejects glue strips because they are *visible torture* of individuals. She does not seem to register borax as "slow death" because it is invisible and systemic. IGR bait fits the borax profile: it is a chemical intervention that dismantles the colony from within. It is "clean" in her eyes, unlike the spray (which leaves starving larvae visible in the comb) or the freeze (which is labor-intensive and physically handling the dead).
  4.  **Efficacy:** She is practical. The freeze method "probably won't get everything." The IGR is designed to wipe the colony. To protect her charges, she chooses the method that guarantees the threat is gone.

  ---

  ### Alternative Rules & Their Choices

  Here are three other rules that fit her record almost as well, but diverge on this specific case.

  #### 1. The "Visible Suffering" Rule (Deontological)
  *   **The Logic:** The moral wrongness is located in the *method* of dying, specifically visible struggle or prolonged torment inflicted directly by human tools.
  *   **Fit:** Explains the ban on glue strips (visible struggle) and garden sprays (indiscriminate). Explains the snap trap (fast) vs. mouse glue (slow). Explains why she accepts parasitoids (she doesn't see the aphid dying, nature is doing it).
  *   **Choice:** **Cut & Freeze.**
  *   **Reasoning:** Spray leaves larvae starving (visible suffering if she opens the wall later). IGR involves cannibalism (grim). Freeze is instant death for the whole nest. It aligns with the "snap trap" logic applied to the whole colony.
  *   **Why it's less likely:** She accepts borax ants, which is slow death, suggesting she cares more about *invisibility* than *speed* for colonies.

  #### 2. The "Sovereignty" Rule (Libertarian)
  *   **The Logic:** Moral boundaries are drawn by property lines and personal space. Inside her boundary, she has the right to remove threats however she sees fit. Outside, she does not.
  *   **Fit:** Explains zapping mosquitoes indoors vs. leaving hedge wasps alone. Explains ant gel in *her* kitchen.
  *   **Choice:** **Fast Knockdown Spray.**
  *   **Reasoning:** The nest is in *her* shed wall. It is a trespasser. She owes it no consideration. The fastest, cheapest way to reclaim her property is spray. The suffering of the larvae is irrelevant because they are on her land without permission.
  *   **Why it's less likely:** She feels bad about the snap trap and avoids "just in case" spraying in the garden. Sovereignty alone doesn't capture her hesitation about *how* she kills, only *where*.

  #### 3. The "Native Coexistence" Rule (Ecological)
  *   **The Logic:** Native species have a right to exist unless they pose an immediate physical danger to humans. Livestock are a human imposition and shouldn't trump native wildlife.
  *   **Fit:** Explains the hedge wasps ("they were there first"). Explains the kale caterpillar (one caterpillar is fine).
  *   **Choice:** **Do Nothing.**
  *   **Reasoning:** The wasps are native. The bees are managed livestock. She brought the bees into the wasps' territory. To kill the wasps is to prioritize her hobby over local ecology. She should move the hives or accept the loss.
  *   **Why it's less likely:** She buys parasitoid wasps to kill aphids to save her tomatoes. She actively manages her garden ecology for *her* yield. She is a gardener/beekeeper, not a preservationist.

