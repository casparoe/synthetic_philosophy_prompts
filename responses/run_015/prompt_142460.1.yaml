  | Rule | Prediction | Why |
  | :--- | :--- | :--- |
  | **Custodianship** (My Pick) | **Exclude/Relocate.** | The bees are her charge, but the badger is a vertebrate (Mouse rule). She will prioritize the bees but use the "humane" method (exclusion) rather than killing. |
  | **Visible Suffering** | **Do Nothing / Move Bees.** | Trapping/relocating a badger is high stress/suffering. Killing it is worse. To avoid inflicting suffering, she sacrifices the shed location. |
  | **Sovereignty** | **Lethal Control.** | It's her land. It's damaging her property. If legal, she removes the threat permanently. |
  | **Native Coexistence** | **Do Nothing.** | The badger was there first. The bees are the intruders. She moves the hives. |

  If she calls a wildlife exclusion expert to fence the badger out while keeping the bees, **Custodianship** is confirmed.

