  ### The Commitments (What her choice says)

  Since you want to tell her what she'd be committing to, here is the ethical cost of each option:

  *   **If she chooses IGR Bait:** She commits to the view that **efficacy for her charges trumps the method of death for pest colonies.** She accepts that she is willing to inflict slow, hidden death (cannibalism) on social insects if it protects her livestock, aligning her with her ant/aphid protocol. She admits she values her bees more than the wasps' mode of dying.
  *   **If she chooses Spray:** She commits to **Sovereignty.** She admits that property rights and speed matter more than the lingering death of the brood. This contradicts her "no glue strip" stance unless she argues larvae don't count as "individuals" in the same way flies do.
  *   **If she chooses Freeze:** She commits to **Consistent Humaneness.** She elevates the wasps to the moral status of mice. This requires her to explain why she uses borax on ants but won't freeze wasps. It prioritizes her conscience over cost and efficacy.
  *   **If she chooses Nothing:** She commits to **Ecological Primacy.** She admits her beekeeping hobby is less important than the native wasp colony. This contradicts her use of parasitoid wasps for her tomatoes. She would have to stop protecting her crops from native pests to be consistent.

  **Final Word:**
  Mira is a **Pragmatic Custodian**. She loves nature, but she loves *her* nature (her hives, her kale, her house) more. She will save the bees. She will use the bait. She will sleep fine, because in her framework, she didn't torture the wasps; she defended her livestock using standard agricultural protocols. The "grimness" is hidden in the wall, just like the borax ants, and that is where she can live with it.
