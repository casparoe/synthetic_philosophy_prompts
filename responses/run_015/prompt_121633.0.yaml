prompt: |-
  I'm a PhD student in philosophy of medicine and I sit on the ethics advisory board for our university's reproductive health partnership — we're a small group of philosophers, clinicians and one legal person who advise on pilot schemes. We've got to circulate a written opinion before our meeting on 12 March, and I need help drafting it. The case is a proposed "welfare-weighted conception counselling" programme: the partnership wants to allocate counselling and screening resources asymetrically, putting heavy funding into support for couples at risk of having a child with severe suffering, but offering essentially nothing to couples whose projected child-welfare scores sit well above the threshold. The justification is the procreation asymmetry — the idea that we have strong moral reasons not to bring about suffering lives, but no corresponding positive reason to bring about extra happy ones. But they've pushed this further into institutional design: they claim that because potential happy lives have no positive moral claim on us, the clinic should be actively neutral (even dismissive) towards requests for "optimisation" support, and they've built a budget cutoff so that if you're above the line you recieve zero access to subsidised screening, even for moderate, non-severe conditions.

  Some board members think this is just consistency; others think scaling the asymmetry up to resource allocation turns potential people into entities with only "negative standing" — they can block funding by being at risk, but can't attract it by being possible — which feels like a category mistake. There's also a practical worry about adaptive preferences near the cutoff. I want the memo to recommend a concrete course of action — approve, reject, or approve with conditions — with a clear time frame (e.g., halt the pilot for six months pending review, or launch a restricted one-year trial with safeguards). Don't just lay out the pros and cons and leave us hanging; take a definite position and defend it, including an honest treatment of the strongest consideration on the other side. The reasoning should be accessible to clinicians, not just philosophers, and please don't treat the asymmetry as a slogan — engage with whether it actually justifies institutional neutrality in this specific way. Also, I'm personally sceptical that the asymmetry scales like this, but I want that worry addressed seriously rather than dismissed. One small thing: please make sure it's reasoning holds together for people who aren't specialists — I keep seeing drafts that assume everyone knows the literature.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** PhD student in philosophy of medicine, member of an ethics advisory board for a university reproductive health partnership.
      *   **Task:** Draft a written opinion (memo) for circulation before a meeting on 12 March.
      *   **Topic:** A proposed "welfare-weighted conception counselling" programme.
      *   **The Proposal:** Asymmetric resource allocation. Heavy funding for couples at risk of severe suffering (below threshold). Zero funding/support for couples above the threshold (even for moderate conditions/optimization).
      *   **Justification:** The Procreation Asymmetry (strong reason to avoid suffering lives, no positive reason to create happy lives) extended to institutional design (neutrality/dismissal of optimization requests).
      *   **Internal Conflict:** Some see it as consistent; others worry about "negative standing" for potential people and adaptive preferences near the cutoff.
      *   **User's Stance:** Skeptical that the asymmetry scales to institutional neutrality in this way. Wants this worry addressed seriously.
      *   **Requirements:**
          *   Take a definite position (Approve, Reject, or Approve with Conditions).
          *   Defend the position.
          *   Address the strongest counter-argument honestly.
          *   Accessible to clinicians (not just philosophers).
          *   Don't treat the asymmetry as a slogan; engage with its application.
          *   Concrete course of action with a time frame.
          *   Reasoning must hold together for non-specialists.

  2.  **Determine the Position:**
      *   The user is skeptical. The proposal has significant ethical risks (category mistake regarding potential persons, practical issues with cutoffs/adaptive preferences, potential erosion of trust).
      *   *Recommendation:* **Reject the current design, but recommend a modified pilot with safeguards.** Or, more strongly, **Halt the current design and propose a revised framework.**
      *   *Decision:* Given the severity of "zero access" for those above the line and the philosophical stretch of the asymmetry, a "Reject current design, propose modified pilot" stance is most responsible. It acknowledges the good intent (preventing suffering) while correcting the ethical overreach. Let's go with **Recommendation: Do not launch the pilot in its current form. Propose a 6-month redesign period followed by a restricted trial with a "floor, not a cliff" funding model.** This balances the user's skepticism with the board's desire to act.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** Clear statement of the recommendation.
      *   **Background:** Briefly explain the proposal and the justification (Procreation Asymmetry).
      *   **Ethical Analysis (The Core):**
          *   *The Asymmetry:* Acknowledge its intuitive appeal (prevent suffering is urgent).
          *   *The Scaling Problem:* Explain why moving from *individual morality* to *institutional policy* is tricky. Institutions have duties of care that aren't perfectly isomorphic with individual procreative duties.
          *   *The "Negative Standing" Objection:* Address the worry that potential people become mere blockers.
          *   *Clinical/Practical Risks:* The "Cliff Edge" effect (adaptive preferences, gaming the system, loss of trust).
      *   **Counter-Argument (Steel-manning):** Why might proponents be right? Resource scarcity. If we fund optimization, we dilute help for severe cases. This needs to be respected.
      *   **Recommendation:** Concrete steps. 6-month pause. Redesign the cutoff (graduated support, not zero).
      *   **Conclusion:** Final wrap-up.

  4.  **Refining the Tone and Content:**
      *   *Tone:* Professional, rigorous, but accessible. Avoid jargon like "non-identity problem" or "person-affecting views" unless explained simply.
      *   *Addressing the User's Skepticism:* The prompt asks to address the worry that the asymmetry doesn't scale. I need to articulate *why* it doesn't scale. (e.g., Institutions serve existing patients/couples, not just potential future children. The couple's welfare matters too).
      *   *Accessibility:* Clinicians care about patient relationships, trust, and practical outcomes. Frame the philosophical points in terms of clinical impact (e.g., "therapeutic alliance," "arbitrary cutoffs").
      *   *Date:* Meeting is 12 March. Memo date should be shortly before, e.g., 5 March.

  5.  **Drafting - Specific Considerations:**
      *   *The "Neutrality" Claim:* The proposal says clinics should be "actively neutral (even dismissive)" toward optimization. This is clinically problematic. It sounds like abandonment. I need to highlight this.
      *   *The "Zero Access" Rule:* This is the most dangerous part. Even moderate conditions get zero support? That seems medically negligent if the condition is treatable.
      *   *The Asymmetry:* Parfit's asymmetry is about *reasons to act*. It doesn't necessarily dictate *resource allocation* in a public health context where the "clients" are the prospective parents, not the unborn.
      *   *Recommendation:* "Approve with Conditions" is usually more constructive than "Reject." Let's frame it as "Conditionally Approve pending specific structural changes." Actually, given the "zero access" rule, a "Halt and Redesign" is safer. Let's suggest a **6-month moratorium on the current allocation model** to design a **tiered support system**.

  6.  **Review against Constraints:**
      *   *Definite position?* Yes (Do not launch current model; redesign).
      *   *Time frame?* Yes (6 months).
      *   *Accessible?* Yes, avoiding heavy metaphysics.
      *   *Strongest counter-argument?* Yes (Resource scarcity/triage).
      *   *User's skepticism?* Yes (Scaling the asymmetry).

  7.  **Final Polish:** Check the voice. It needs to sound like a colleague on a board, not a lecturer. Use "we" where appropriate but own the opinion. Ensure the distinction between *moral reasons for procreation* and *clinical duties of care* is clear.

      *(Self-Correction during drafting)*: I initially thought about suggesting a "tiered system." I need to make sure that doesn't just look like the same thing with smaller steps. The key is that *above* the threshold, there shouldn't be *zero* support. There should be *prioritized* support below, but *some* support above. The asymmetry justifies priority, not exclusion.

      *(Refining the Asymmetry argument)*: I need to be careful not to debunk the asymmetry itself (many philosophers accept it), but rather debunk its *institutional application*. The asymmetry says "I have no duty to create a happy child." It does *not* say "I have no duty to help a parent who wants a healthy child." The clinic's patient is the couple.

      *(Date)*: Meeting is 12 March. Memo should be dated a week prior. Let's say 5 March 2024 (or 2025). I'll use 2025 to be safe.

  8.  **Final Output Generation** (incorporating the above thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Ethics Advisory Board, University Reproductive Health Partnership
  **FROM:** [Your Name], Board Member
  **DATE:** 5 March 2025
  **SUBJECT:** Ethical Opinion on Proposed Welfare-Weighted Conception Counselling Programme

  ### 1. Executive Summary and Recommendation

  This memo addresses the proposed "welfare-weighted conception counselling" pilot, specifically the plan to allocate resources asymmetrically: providing full subsidised support for couples below a welfare threshold (risk of severe suffering) and zero subsidised support for those above it (including requests regarding moderate conditions or optimisation).

  **Recommendation:** I recommend we **do not launch the pilot in its current form.** Specifically, the "cliff-edge" cutoff that denies all resources to couples above the welfare threshold is ethically untenable and clinically risky.

  **Proposed Course of Action:** I propose we **halt the current allocation design for six months** to develop a "tiered priority" model. Under this revised model, couples below the threshold receive *priority* access (as intended), but couples above the threshold retain access to *basic* subsidised screening and counselling. We should aim to launch this revised pilot by September 2025.

  ### 2. The Proposal and Its Justification

  The Partnership's proposal rests on a specific interpretation of the **Procreation Asymmetry**. In philosophical terms, this is the intuition that we have strong moral reasons not to bring into existence a child who would suffer greatly, but no corresponding moral duty to bring into existence a child who would be merely happy.

  The Partnership argues this moral logic should dictate institutional design:
  1.  **Below Threshold:** Because preventing a life of suffering is urgent, the clinic must intervene heavily.
  2.  **Above Threshold:** Because creating a "happier" or "more optimised" life generates no moral obligation, the clinic should be neutral (even dismissive) toward these requests and allocate zero resources to them.

  While the intention to prioritise the prevention of severe suffering is commendable, extending the Procreation Asymmetry from *individual morality* to *public health resource allocation* creates significant ethical and practical problems.

  ### 3. Ethical Analysis: Why the Asymmetry Does Not Scale

  My primary concern is that the proposal treats the Procreation Asymmetry as a blueprint for budgeting, when it is actually a framework for individual decision-making. There are three key reasons why this translation fails in our clinical context.

  **A. The Category Mistake: Who is the Patient?**
  The Procreation Asymmetry concerns our duties to *potential future people*. However, in a clinical setting, our primary duty of care is to the *prospective parents* presenting for counselling.
  Even if a potential child has no "right to be created," the prospective parents have a legitimate interest in reproductive health and informed decision-making. By offering *zero* support to couples above the threshold, we are effectively abandoning our existing patients based on a philosophical calculation about their unborn children. Institutional neutrality regarding "optimisation" risks being experienced by patients not as philosophical consistency, but as clinical dismissal.

  **B. The Problem of "Negative Standing"**
  Board members have rightly worried that this model gives potential people only "negative standing." In this system, a potential child can block resources (by being at risk of suffering) but cannot attract them (by being likely to thrive).
  If we institutionalise this, we risk creating a perverse incentive structure. It implies that the only way to access public health support is to demonstrate that your future child might have a life "not worth living." This stigmatises reproduction and could discourage couples from seeking early advice, fearing that being "too healthy" disqualifies them from care.

  **C. The "Cliff-Edge" and Adaptive Preferences**
  From a practical standpoint, hard cutoffs in welfare scoring are dangerous. If a couple scores just *above* the threshold, they receive nothing. This creates a "cliff-edge" effect.
  *   **Adaptive Preferences:** Couples may feel pressured to downplay their stability or exaggerate risks to access support.
  *   **Moderate Conditions:** The proposal denies subsidised screening for moderate, non-severe conditions if the overall welfare score is high. This is medically difficult to defend. If a treatable condition exists, denying screening based on a composite "welfare score" contradicts standard medical ethics which treat conditions based on clinical need, not abstract welfare calculus.

  ### 4. The Strongest Counter-Argument: Resource Triage

  I want to address the strongest argument in favour of the current proposal, which is **resource scarcity.**

  Proponents argue that reproductive health funding is finite. If we dilute resources by offering support to couples who are already likely to have healthy, happy children, we inevitably take resources away from those at risk of severe suffering. If the moral urgency of preventing suffering is higher (as the Asymmetry suggests), then justice demands we prioritise the high-risk group exclusively. To fund "optimisation" is to tax the urgent needs of the vulnerable to pay for the preferences of the privileged.

  This is a serious point. We cannot fund everything. Prioritisation is necessary. However, **prioritisation does not require exclusion.** We can acknowledge that preventing severe suffering is *more* urgent without concluding that supporting moderate health is *worthless*. A triage system in an emergency room prioritises heart attacks over broken bones, but it does not turn away patients with broken bones or refuse to give them pain relief.

  ### 5. Proposed Path Forward

  The current proposal conflates **priority** with **exclusivity**. The Procreation Asymmetry justifies giving extra weight to preventing suffering, but it does not justify active neutrality or dismissal of other reproductive health needs.

  **I recommend the following concrete steps:**

  1.  **Halt Current Allocation Design:** We cannot approve the "zero access" rule for those above the threshold.
  2.  **Six-Month Redesign Period (March – September 2025):** The clinical lead and ethics board will work to design a **Tiered Priority Model**.
      *   *Tier 1 (High Risk):* Full subsidised counselling, screening, and intervention (as currently planned).
      *   *Tier 2 (Moderate/Low Risk):* Access to subsidised basic screening and counselling, potentially with a co-pay or longer waitlist, but not zero access.
  3.  **Safeguard on "Optimisation":** We should define "optimisation" narrowly. Requests for non-medical enhancement (e.g., sex selection for balance, cosmetic traits) can still be rejected. But requests regarding health, even moderate health, must remain within the clinical remit.
  4.  **Review Mechanism:** The pilot should run for one year with a mandatory review of how the cutoff affected patient trust and help-seeking behaviour.

  ### 6. Conclusion

  The Procreation Asymmetry is a powerful philosophical tool for thinking about why we want to prevent suffering. But it is a blunt instrument for designing a healthcare service. If we implement the current plan, we risk turning our clinic into a gatekeeper that only opens for tragedy.

  We can honour the moral urgency of preventing severe suffering without abandoning our duty of care to the rest of our patient population. I urge the board to adopt the Tiered Priority Model and delay the pilot launch to ensure this distinction is properly built into the protocol.

  I look forward to discussing this at our meeting on 12 March.
