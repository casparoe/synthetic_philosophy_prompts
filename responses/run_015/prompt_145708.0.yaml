answer: |-
  Here is an attempt to codify your intuitions into a single working framework. It is not perfect—no ethical system is—but it maps onto your verdicts with a high degree of accuracy.

  ### The Principle: Proportionate and Contained Intervention

  **Statement:**
  Intervention against a pest is permissible if and only if it satisfies three conditions:
  1.  **Humane Execution:** The method minimises the duration and intensity of suffering for the individual organism.
  2.  **Strict Specificity:** Harm is restricted solely to the organisms directly causing the conflict; non-target collateral damage is impermissible.
  3.  **Ecological Reversibility:** The intervention must not permanently alter the species' existence or the ecosystem's structure beyond the immediate locality.

  ---

  ### Clause Breakdown and Motivation

  **1. Humane Execution**
  *   **Motivating Case:** *Glue traps vs. Squashing.*
      You accept squashing the mosquito (instant) but reject glue traps for mice (days of agony). This clause prioritises the *quality* of the death over the *fact* of the death. It also explains your recoil at the RNA spray: starving an insect over four days is a lingering, physiological decay, whereas a contact poison is a neurological switch-off. You are objecting to the *process* of dying, not just the outcome.
  *   **What it implies:** Death should be instantaneous or, if prevention is used (sterile males), it should not involve suffering at all.

  **2. Strict Specificity**
  *   **Motivating Case:** *Neonics vs. Ant Spray.*
      You accept spraying the ant trail (targeted) but reject neonics (systemic, affecting pollinators). This clause asserts that you have no right to harm innocents to solve your problem. It explains why the lure-and-vapourise trap is "completely fine": it is perfectly discriminating.
  *   **What it implies:** Collateral damage is the primary sin. If the method kills things that weren't bothering you, it is impermissible.

  **3. Ecological Reversibility**
  *   **Motivating Case:** *Sterile Males vs. Gene Drive (Crash).*
      This is the crux of your gene drive dilemma. Sterile males suppress a local population temporarily (reversible, local). A gene drive that crashes a species across its range is permanent and existential (irreversible, global). You are comfortable managing a nuisance; you are uncomfortable erasing a lineage. This also covers the cane toad scenario: introducing a new predator is an irreversible ecological gamble.
  *   **What it implies:** You may defend your home, but you may not play God with the biosphere. The modification drive is "fine" because it leaves the species *existing*, merely altered; the crash drive removes the species from the web of life entirely.

  ---

  ### Application to New Cases

  **The Bug Splat on the Windscreen**
  *   **Verdict:** Permissible (Regrettable).
  *   **Reasoning:** It satisfies **Humane Execution** (instant) and **Ecological Reversibility** (negligible impact). It technically fails **Strict Specificity** (the bug wasn't attacking you), but it falls under the doctrine of *unavoidable accident*. You are not *intervening* to kill; you are travelling, and the death is incidental. It requires no moral action, only perhaps a moment of acknowledgement.

  **Insects Killed by Ploughing a Field**
  *   **Verdict:** Impermissible in isolation, but Necessity-Overridden.
  *   **Reasoning:** Ploughing fails **Strict Specificity** (kills everything in the soil) and **Humane Execution** (crushing/exposure). However, unlike the mosquito in the bedroom, this is tied to human survival (food). Your principle handles pest control, not agriculture. If we apply the principle strictly, industrial agriculture is morally catastrophic. You likely tolerate this only because the "Threshold of Harm" (starvation for humans) outweighs the insect welfare, whereas the mosquito in the bedroom is a mere nuisance.

  ---

  ### The Explicit Case: The Wasps in the Shed

  This is the October argument. Here is what the principle dictates.

  **Option A: Instant Freeze Spray**
  *   **Humane Execution:** Pass. Death is near-instant.
  *   **Strict Specificity:** Pass. Only the wasps in the shed are affected.
  *   **Ecological Reversibility:** Pass. It is a local removal of a seasonal colony.

  **Option B: Leave Them to Starve**
  *   **Humane Execution:** Fail. You noted yourself that starvation over weeks is worse than a quick death.
  *   **Strict Specificity:** Pass.
  *   **Ecological Reversibility:** Pass.

  **The Verdict:**
  You should use the **freeze spray**.

  **The Argument for your Partner:**
  Your partner likely feels that killing is an active sin, whereas letting them die is passive. They are relying on an *Omission Bias* (the idea that harm caused by action is worse than harm caused by inaction). However, under the **Humane Execution** clause, leaving them is not "letting nature take its course"; it is a deliberate choice to allow a slow death when a fast one is available. By choosing not to spray, you are not saving lives; you are prolonging suffering. The "clean hands" approach actually results in more net misery. The merciful act is the intervention.

  ---

  ### Honest Account of Limitations

  No principle survives contact with reality without bruising. Here is where this framework fails to accommodate your intuitions:

  **1. The RNA Spray vs. Natural Starvation Paradox**
  *   **The Conflict:** You recoil at the RNA spray (4-day starvation) more than a colony starving naturally over weeks.
  *   **The Failure:** The principle cannot explain this. Under **Humane Execution**, both are slow deaths. The only difference is *agency*. You are more bothered by *causing* the starvation than *observing* it. This is a psychological bias (Commission vs. Omission), not an ethical consistency. The principle treats them as equally bad; your gut treats the human-caused one as worse. To accommodate this, you would need a fourth clause: *"Do not instrumentalise suffering,"* which forbids using starvation as a mechanism even if the outcome is identical to nature.

  **2. The Gene Drive Body Count**
  *   **The Conflict:** You admit ten years of spraying kills more mosquitoes than the gene drive, yet you reject the drive.
  *   **The Failure:** The principle prioritises **Ecological Reversibility** over aggregate body count. This is a deontological constraint (a rule-based boundary) rather than a utilitarian calculation. If you ever decide that "minimising total death" is more important than "preserving species integrity," this principle will break. It currently says: *It is better to kill many individuals reversibly than to erase a species irreversibly.* If you change your mind on that, the principle must be rewritten.

  **3. The "Icky" Ant Spray**
  *   **The Conflict:** You call spraying ants "slightly icky."
  *   **The Failure:** The principle says it should be "Fine" (Instant, Specific, Reversible). The "ickiness" suggests a residual moral discomfort that the principle dismisses. It implies that perhaps **Strict Specificity** isn't enough; perhaps there is a "Sanctity of Life" clause that makes *any* killing slightly tarnished, even when permissible. The principle justifies the act, but it doesn't cleanse the feeling.

  ### Summary
  Your ethics are not purely about suffering (Utilitarianism), nor purely about rights (Deontology). They are a form of **Stewardship Virtue Ethics**. You wish to be the kind of person who defends their home without becoming a tyrant over nature. You accept killing when it is clean, targeted, and humble. You reject it when it is cruel, indiscriminate, or arrogant.

  Use the freeze spray on the wasps. It is the humble, clean, and merciful choice.
