answer: |-
  **Activity: The Cross-Modal Gap**

  **Roles:** 3 Volunteers ("Blind"), 11 Observers ("Guides").
  **Objects:** 1) Wooden Sphere, 2) Wooden Cube, 3) Thin Wooden Square Tile (face dimensions match Cube exactly).
  **Crucial Mechanic:** During the Touch Phase, instruct volunteers to hold the Cube by its face, not its edges. Tactilely, the Cube face and the Tile are identical. Visually, they are distinct (depth vs. flat).

  **Rules:**
  1.  **Touch Phase:** Volunteers blindfolded. They handle objects. Guides describe textures/shapes using *no object names* (e.g., "curved," "sharp edge," "flat"). No functional cues ("it rolls").
  2.  **Visual Phase:** Blindfolds off. Objects placed on table at distance. Volunteers identify matches using sight *only*. No touching allowed.

  **Timeline (50 min):**
  *   **0-5:** Setup. Distribute objects. Emphasize "no names" rule.
  *   **5-15:** Touch Phase. Volunteers rotate objects. Guides describe. *Instructor Note:* Ensure Cube volunteers feel only the face.
  *   **15-25:** Visual Matching. Blindfolds off. Volunteers point to matches. Guides silent.
  *   **25-50:** Debrief.

  **Debrief & Theory Mapping:**
  *   **Phase 1 (Touch) → Empiricist Input:** Locke argued all knowledge comes from sensory experience. The volunteers' tactile data is their "tabula rasa."
  *   **Phase 2 (Sight) → The Mapping Problem:** When blindfolds came off, did the visual shape instantly "click" with the tactile memory? Most will say yes for the Sphere, but hesitate on the Cube/Tile.
  *   **The Philosophical Split:**
      *   **Empiricism (Locke):** Answered "No." Sight and touch are distinct languages. Association requires experience. Use the Cube/Tile confusion: Vision grants depth simultaneously; touch requires sequential movement. Without prior association, the brain doesn't know that "sharp edge felt" = "shadow line seen."
      *   **Rationalism (Leibniz):** Answered "Yes." Geometric properties are innate ideas understood by the mind, not senses. The mind recognizes "cubeness" regardless of input channel.
      *   **The Verdict:** Modern data (cataract surgery patients) supports Locke initially: recognition is not immediate. It requires learning.

  **Predictable Failures:**
  1.  **Peeking:** Blindfolds slip. *Fix:* Use sleep masks; instructor monitors.
  2.  **Verbal Cheating:** Guides say "it's the block." *Fix:* Instructor interrupts leading descriptions.
  3.  **Tactile Sneak:** Volunteers touch during visual phase. *Fix:* Hands behind back rule.

  **Critical Limitations (Instructor Must Supply):**
  1.  **Prior Visual Memory:** Your volunteers *have* seen cubes before. This tests *recall*, not *novel mapping*. True Molyneux subjects lack the concept of "visibility." You must explain that real patients see a blur of light/color initially, not clear shapes.
  2.  **Brain Plasticity:** Congenital blindness repurposes the visual cortex. Sighted brains are pre-wired for cross-modal integration.
  3.  **Lighting:** Real restoration patients often have poor acuity. Your classroom lighting is too clear.

  **Conclusion:** The activity simulates the *friction* of mapping, but not the *void* of true blindness. Use the Cube/Tile failure to prove empiricism: without prior visual-depth association, the senses don't automatically speak to each other. The "obviousness" sighted people feel is learned, not innate.
