  The sequence proves that declassification loops back on identity as strongly as classification does, revealing that Hacking's model, built on imposed labels, cannot account for the narrative vacuum left when a diagnosis is withdrawn without recognizing that the vacuum itself becomes a site for new institutional storytelling. Gay liberation activists pressed for removal to secure social legitimacy and legal protection, advocating for a script of full normalization that would recast the homosexual not as a patient but as a citizen freed from medical surveillance. In response, psychiatrists drafting DSM-III constructed a pathologized remainder, ego-dystonic homosexuality, to preserve therapeutic jurisdiction and insurance access without condemning the orientation itself, ensuring the clinic remained the arbiter of sexual truth. Patients confronted a choice of strategic self-narration: adopt the activist plot of social oppression or the clinical plot of internal conflict to gain access to care, effectively trading identity integrity for insurance coverage. Looping explains the backlash here, as the withdrawn category reshaped clinical conduct and patient self-description by shifting the locus of pathology from the object of desire to the subject's relationship with that desire, creating a new character type who suffers not from who they love but from unhappiness about it. However, Hacking's framework is silent on the institutional inertia and political need to preserve a residual disorder, missing how the declassification was a tactical retreat designed to keep the medical story dominant even as it surrendered the main title. Ultimately, the episode shows that withdrawing a psychiatric label creates an absence that people fill with new self-stories, and Hacking's framework must be expanded beyond "making up people" to include "unmaking people" through strategic declassification.
