  I've been spiralling about something on my own for a few weeks and I want somebody to just put a number on it. Context: I have no philosophy background at all — I work night shifts doing IT support at a hospital and read this kind of thing on my phone at 3am — so please don't assume I know the literature, I probly know less than I think I do.

  Here's where I got to. The reason people take panpsychism seriously, as far as I can tell, is that if matter has an inside all the way down, you don't have to explain how consciousness pops into existence at some magic level of complexity. Fine. But what's been keeping me awake: if that's true, then brains are a rounding error. There are something like ten-to-the-eighty atoms in the observable universe, a few billion brains, and most of that matter is in stars, plasma, dust, whatever. So on a panpsychist picture almost all the experience in the universe would be non-biological, and whether the world as a whole is a good place or a bad place might mostly depend on what it's like to be, I don't know, a hydrogen atom in the sun — which I can't even begin to picture, and which nobody seems to worry about. On the other hand maybe that's backwards: maybe valence isn't the kind of thing that comes in fundamental units, maybe suffering needs a whole architecture — a body, a memory, a sense that things could have gone otherwise, some goal getting blocked — and if that's right then a universe packed with micro-experiences would be a universe packed with moral blankness, and panpsychism would actually *reduce* the amount of suffering in the world, because it demotes brains from being a spooky exception to being just one arrangement among many. A friend I argue with about this is at about 75% that panpsychism makes things worse; I'm around 30%.

  So: give me your own number, as a percentage, for the claim that **if panpsychism is true, the total amount of suffering in the observable universe is greater than it would be if consciousness only showed up in complex systems like brains.** By "settled" I mean: imagine that in a hundred years we have a grown-up science that tells us which physical systems are subjects of experience and what those experiences are like, plus an agreed way of adding welfare up across subjects — would the ledger come out worse under panpsychism than under the emergence story? I'm asking about the *amount* of suffering, not about what we'd be obliged to do about it, that's a separate question. And I want the decomposition, not just the number: how much of it hangs on whether valence is fundamental or needs complex architecture, how much on how you even count subjects (per particle? per system? per state? — whether ten-to-the-eighty tiny experiences add up to something big or to nothing), how much on whether brains are *additional* subjects or whether my experience is just what a big collection of micro-experiences looks like from outside, how much on what most of the universe's matter is actually doing thermodynamically, and how much on whether piling up astronomically many microscopic bits of badness is even the right ethical move rather than a threshold or an anti-aggregation view. Give each term a number and a line of justification, show the combination, add whatever terms you think I've missed, then tell me which one you're least confident in, what evidence would move it most, and where you think the gap between me at 30 and my friend at 75 most likely lives.
