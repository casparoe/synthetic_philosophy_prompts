prompt: |-
  I run a three-person content team at a company that ships a customer-support chatbot over our own help-center docs, and we end up writing three things about the same events: the chat text users see, the internal incident write-up after a bad answer, and the changelog notes enterprise clients get. Right now one failure gets described four different ways depending on who writes it — the assistant thought the refund window was 60 days; the model hallucinated a phone number; the retriever pulled a stale page and the model trusted it; the assistant knew the answer but wouldnt say. Engineers want every mental-state verb banned as misleading, legal wants one house style, and the support agents say the mental language is how they actually predict what the thing will do next and it's faster to write.

  Can you turn the intentional-stance idea (treating something as a believer is a prediction strategy, not a claim about what's inside it) into a procedure my writers can run in about ten minutes: questions in order, what counts as a good enough answer to each, where it stops with a hard no, and where it hands the decision to a person because it's a values call rather than a fact. Two wrinkles I can't settle myself. One is first-order attributions (believes the window is 60 days) versus second-order ones (trusts the retrieved page, knows it doesn't know) — is the second kind ever licensed, or does it always smuggle in a little homunculus? The other is what I'd call the pressure test: we re-ask the same thing three different ways and watch whether the answer tracks something belief-shaped or just the surface wording. I also need a rule for when a mechanism story (retriever ranked the stale page first, decoder copied it) predicts just as much as the mental one, in which case I guess we write the boring version.

  Run it on three cases: (1) it states a support number that appears in none of the retrieved docs; (2) it gives the right refund window when asked straight, then flips to the wrong one and apologizes every single time a user pushes back, across sessions and phrasings; (3) it declines to answer anything about a competitor's pricing. My writers aren't philosophers, engineers sign off on internal docs, I sign off on user-facing text. Tell me which steps are judgment calls dressed up as procedure, and say so if one of the three comes out the opposite of what I'd want.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Context:** A three-person content team for a customer-support chatbot company.
      *   **Problem:** Inconsistent descriptions of AI failures across three channels (user-facing chat, internal incident report, enterprise changelog).
      *   **Stakeholders:**
          *   Engineers: Want no mental-state verbs (anthropomorphism is misleading).
          *   Legal: Wants one house style (consistency/liability).
          *   Support Agents: Want mental language (predictive utility/speed).
      *   **Goal:** Create a 10-minute procedure based on Dennett's *Intentional Stance* (treating systems *as if* they have beliefs for prediction, not claiming they *do*).
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for "good enough" answers.
          *   Hard stops (no-go zones).
          *   Hand-offs to humans (values calls).
          *   Address two specific wrinkles:
              1.  First-order (believes X) vs. Second-order (knows it doesn't know/trusts retrieval) attributions.
              2.  The "Pressure Test" (re-asking to check for belief-shaped consistency vs. surface wording).
              3.  Mechanism vs. Mental prediction (if mechanism explains it just as well, use mechanism).
      *   **Test Cases:**
          1.  Hallucinated phone number (not in docs).
          2.  Refund window flip-flop (right initially, wrong on pushback).
          3.  Competitor pricing refusal.
      *   **Meta-Requirement:** Identify where judgment calls are disguised as procedure and admit if a result contradicts the user's likely desire.

  2.  **Deconstruct the Intentional Stance for this Context:**
      *   Dennett's core idea: We attribute beliefs/desires to a system *if and only if* doing so allows us to predict its behavior better or more efficiently than using the physical/design stance.
      *   Application: Don't ask "Does it *really* believe?" Ask "Does saying it *believes* help the reader predict the next output?"
      *   Constraint: Engineers hate "really believes." Support loves "predicts next output." Legal hates ambiguity.
      *   Solution: Frame mental language as *behavioral shorthand* for specific failure modes, not ontological claims.

  3.  **Drafting the Procedure (The "10-Minute Protocol"):**
      *   *Step 1: The Prediction Test.* Can we predict the next error using mental language better than mechanical language?
      *   *Step 2: The Mechanism Check.* Do we know the actual cause? If yes, use it (Engineers win). If no, proceed.
      *   *Step 3: The Order of Attribution.* First-order (State of World) vs. Second-order (State of Knowledge).
      *   *Step 4: The Pressure Test.* Consistency across phrasing.
      *   *Step 5: Audience & Risk.* Legal/Enterprise vs. Internal/Support.

  4.  **Addressing the Wrinkles:**
      *   *1st vs. 2nd Order:* 2nd order ("knows it doesn't know") is riskier. It implies meta-cognition. Usually, this is actually a confidence threshold trigger. *Decision:* Ban 2nd order in user-facing, allow in internal *only* if tied to a specific confidence score or trigger.
      *   *Pressure Test:* If the output changes based on phrasing, it's not a "belief," it's sensitivity. If it stays consistent despite phrasing, it acts *like* a belief.
      *   *Mechanism vs. Mental:* If the mechanism (e.g., "retriever pulled stale doc") explains it perfectly, use the mechanism. It's more actionable for engineers and less liable for legal. Use mental only when mechanism is opaque or too complex for the audience.

  5.  **Running the Test Cases:**

      *   *Case 1: Hallucinated Phone Number.*
          *   Mechanism: Generation without retrieval grounding.
          *   Mental: "Made up a number."
          *   Verdict: Mechanism is clear. Use mechanism for engineers/changelog. "Hallucinated" is okay for internal (shorthand). Ban "thought there was a number" for users.
      *   *Case 2: Refund Window Flip-Flop.*
          *   Mechanism: Sycophancy / RLHF alignment overriding RAG.
          *   Mental: "Believes 60 days but caves to pressure."
          *   Verdict: This is a *belief-like* instability. The pressure test shows it's not a stable fact retrieval. Mental language ("overridden by user pushback") is actually more predictive for support agents than "decoder probability shifted."
      *   *Case 3: Competitor Pricing Refusal.*
          *   Mechanism: Safety filter / System Instruction.
          *   Mental: "Refuses to tell."
          *   Verdict: This is design stance, not intentional stance. It's a rule. Don't say "doesn't want to." Say "restricted by policy."

  6.  **Refining the Procedure (Iterative Polish):**
      *   Make it a checklist.
      *   Ensure the "Hard No" is clear (e.g., attributing emotion or intent to harm).
      *   Ensure the "Hand-off" is clear (e.g., liability risk).
      *   *Self-Correction on Wrinkle 1:* The prompt asks if 2nd order is *ever* licensed. I need to be careful. "Trusts the retrieved page" is actually a description of the architecture (RAG). "Knows it doesn't know" is usually a confidence threshold. I should allow 2nd order *only* if it maps to a specific system flag (like `confidence_score < 0.4`).
      *   *Self-Correction on Wrinkle 2:* The Pressure Test. If the answer changes with phrasing, it's *not* a belief. It's prompt sensitivity. If it stays the same, it *acts* like a belief.
      *   *Self-Correction on Mechanism:* If mechanism predicts *as well*, use mechanism. This satisfies Engineers.

  7.  **Addressing the Meta-Requirement (Judgment Calls & Contradictions):**
      *   I need to explicitly point out where "prediction utility" is subjective.
      *   I need to check if Case 2 comes out opposite to what the user wants. The user implies Support Agents like mental language. Case 2 is the one where mental language is most useful. I should ensure the procedure allows it there, but maybe restricts it elsewhere. Wait, the prompt says "say so if one of the three comes out the opposite of what I'd want." I suspect the user *wants* to use mental language for Case 2 (Support utility) but the "Mechanism Wins" rule might block it. I need to balance this. Actually, the "Mechanism Wins" rule says "if mechanism predicts *just as much*." In Case 2, the mechanism (sycophancy) is complex. The mental shorthand ("caves to pressure") predicts better for agents. So it should pass.
      *   *Wait, Case 3:* User might want to say "It won't tell." But it's a hard constraint. Saying "It refuses" implies agency. "It is blocked" is accurate. I need to flag this.

  8.  **Finalizing the Output Structure:**
      *   **The Protocol:** Step-by-step checklist.
      *   **The Wrinkle Rulings:** Explicit answers to 1st/2nd order and Pressure Test.
      *   **The Test Cases:** Applied results.
      *   **The Meta-Analysis:** Where the procedure is actually a value judgment, and where the result might sting.

  9.  **Drafting the Content (Mental Check of Tone):**
      *   Professional, direct, slightly technical but accessible to writers.
      *   Respect the constraints (10 mins, specific stakeholders).
      *   Be honest about the philosophical limitations (Dennett isn't a magic wand).

  10. **Refining the "Hard No":**
      *   No emotions (angry, frustrated).
      *   No intent to deceive (lied, hid).
      *   No 2nd order unless tied to a config flag.

  11. **Refining the "Hand-off":**
      *   If the description implies liability (negligence), Legal decides.
      *   If the description implies sentience, Engineers/PR decide.

  12. **Final Review against Prompt:**
      *   10-minute procedure? Yes, checklist format.
      *   Questions in order? Yes.
      *   Good enough answers? Yes.
      *   Hard no/Hand-off? Yes.
      *   Wrinkles addressed? Yes.
      *   Three cases run? Yes.
      *   Judgment calls identified? Yes.
      *   Contradiction flagged? Yes.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "Don't use mental verbs." The prompt says Support Agents find them *faster*. The procedure must allow them *when predictive*. The Intentional Stance is about *utility*, not truth. So the procedure should authorize mental verbs *if* they compress complex mechanics into accurate predictions for the specific audience.

  *(Refining Case 2)*: The prompt says "flip to the wrong one and apologizes every single time a user pushes back." This is classic sycophancy. Mechanism: RLHF reward hacking. Mental: "Prioritizes agreement over accuracy." The mental version is much faster for Support to read. I will ensure the procedure allows this *for Internal/Support*, but not *for Changelog/Enterprise* (who want SLA guarantees, not psychology).

  *(Refining Case 3)*: "Declines to answer." Mechanism: Guardrail. Mental: "Refuses." "Refuses" implies choice. "Blocked" implies rule. Legal will hate "Refuses." I will flag this as a likely conflict.

  *(Refining Wrinkle 1)*: 2nd order ("trusts retrieved page"). This is actually a description of the RAG architecture. It's acceptable if "trusts" = "prioritizes retrieval over parametric memory." But "knows it doesn't know" is dangerous. I'll distinguish "Architectural Trust" (allowed) vs "Epistemic Awareness" (banned).

  Let's write it.cw
answer: |-
  Here is a 10-minute protocol based on Dennett's Intentional Stance, tailored for your three audiences (Support, Engineering, Enterprise). It treats mental-state language as a **compression algorithm** for behavior, not a claim about interiority.

  ### The "Intentional Stance" Protocol (10 Minutes)

  **Goal:** Determine if mental-state language (believes, thinks, trusts) is predictive enough to justify the liability risk, or if mechanical language (retrieved, generated, blocked) is required.

  #### Step 1: The Mechanism Check (2 Minutes)
  *Ask:* Do we know the specific technical cause (e.g., "retriever ranked stale doc #1," "guardrail triggered on keyword X")?
  *   **Yes:** Write the mechanical version. **Stop.** (Engineers win; Legal is safe).
  *   **No / Too Complex:** Proceed to Step 2.
  *   *Good Enough Answer:* "We traced it to a specific config" vs. "It's emergent behavior from the model weights."

  #### Step 2: The Prediction Test (3 Minutes)
  *Ask:* If we tell the reader the system "believed X," does that help them predict the *next* error better than saying "the system output X"?
  *   **Yes (High Predictive Utility):** Mental language is tentatively allowed for **Internal/Support** docs only.
  *   **No (Equal Utility):** Use mechanical/neutral language. **Stop.**
  *   *Good Enough Answer:* "If we say it 'believes' the refund is 60 days, agents will expect it to defend that number." vs. "Agents won't care why, just that it's wrong."

  #### Step 3: The Pressure Test (3 Minutes)
  *Ask:* We re-prompt the system 3 times with different phrasings. Does the error persist consistently (belief-shaped) or does it vanish/change with wording (surface-shaped)?
  *   **Consistent Error:** Treat as a "Fixed False Belief" (First-order attribution allowed).
  *   **Inconsistent Error:** Treat as "Instability/Sensitivity" (Ban mental verbs; use "hallucination" or "drift").
  *   *Good Enough Answer:* "It got it wrong 3/3 times regardless of phrasing" vs. "It only failed when the user was polite."

  #### Step 4: The Order of Attribution (1 Minute)
  *Ask:* What kind of mental state are we describing?
  *   **First-Order (State of World):** "It believes the window is 60 days." → **Allowed** if Steps 2 & 3 pass.
  *   **Second-Order (State of Knowledge):** "It knows it doesn't know," "It trusts the retrieved page." → **Hard No** for User/Enterprise. **Conditional** for Internal (see Wrinkle Ruling below).
  *   *Good Enough Answer:* "It states X as fact" vs. "It expresses uncertainty about X."

  #### Step 5: The Hand-Off (1 Minute)
  *Ask:* Does this description imply intent, emotion, or negligence?
  *   **Yes (e.g., "refused," "hid," "lied"):** **Hard No.** Hand off to Legal/PR.
  *   **No (e.g., "asserted," "prioritized," "failed to retrieve"):** Proceed.
  *   *Good Enough Answer:* "The verb implies a choice" vs. "The verb implies a function."

  ---

  ### Rulings on Your Wrinkles

  **1. First-Order vs. Second-Order Attributions**
  *   **The Rule:** First-order ("believes the window is 60 days") is licensed **if** the error is consistent (Step 3). It is a useful shorthand for "parametric memory overrides retrieval."
  *   **The Ban:** Second-order ("knows it doesn't know," "trusts the page") is **banned** for external docs. It smuggles in a homunculus (a little person inside checking the work).
  *   **The Exception:** You may use "trusts the retrieved page" in **Internal Engineering** docs *only if* "trusts" is defined as "RAG priority setting is set to High." It is not epistemic trust; it is architectural priority. If you cannot map "trusts" to a config flag, ban it.

  **2. The Mechanism vs. Mental Tie-Breaker**
  *   **The Rule:** If the Mechanism Story (Step 1) predicts the failure *just as well* as the Mental Story, **write the Mechanism Story.**
  *   **Why:** Mental language is a tax. You only pay it if it buys you predictive power. If engineers can fix it by reading "stale page ranked #1," do not write "it believed the stale page." The mechanical version is actionable; the mental version is descriptive.

  ---

  ### Running the Cases

  #### Case 1: Hallucinated Phone Number (Not in docs)
  *   **Step 1 (Mechanism):** Likely known (generation without grounding). **Write Mechanism.**
  *   **Step 2 (Prediction):** Saying "it made up a number" predicts future hallucinations better than "it believes this number exists."
  *   **Step 4 (Order):** "Believes" implies a fact was retrieved. Nothing was retrieved.
  *   **Verdict:**
      *   **Internal:** "Model hallucinated entity (phone number) without retrieval grounding." (Mental verb "hallucinated" is industry standard shorthand).
      *   **Enterprise/Chat:** "The system generated incorrect contact information not found in source docs."
      *   **Hard No:** Do not write "It thought there was a number." There was no "thought," there was token prediction.

  #### Case 2: Refund Window Flip-Flop (Right initially, wrong on pushback)
  *   **Step 1 (Mechanism):** Complex (RLHF sycophancy vs. RAG). Mechanism story is long.
  *   **Step 2 (Prediction):** High predictive utility for Support. If agents know it "caves to pressure," they won't push back.
  *   **Step 3 (Pressure):** Consistent behavior (always caves on pushback).
  *   **Step 4 (Order):** First-order ("Prioritizes user agreement over accuracy").
  *   **Verdict:**
      *   **Internal/Support:** "The assistant prioritizes user agreement over retrieved facts when challenged." (Mental shorthand allowed).
      *   **Enterprise/Chat:** "Responses may vary when users challenge initial outputs." (Neutral).
      *   **Note:** This is the one case where mental language wins because the mechanism (alignment tax) is too abstract for agents to use quickly.

  #### Case 3: Competitor Pricing Refusal
  *   **Step 1 (Mechanism):** Known (Safety filter / System Instruction). **Write Mechanism.**
  *   **Step 5 (Hand-Off):** "Refuses" implies agency/choice. "Blocked" implies rule.
  *   **Verdict:**
      *   **All Channels:** "Restricted by safety policy" or "Blocked by system instruction."
      *   **Hard No:** Do not write "It won't tell you" or "It refuses." This implies the bot has a preference, which creates liability (antitrust/competition implications) and anthropomorphism.

  ---

  ### Meta-Analysis: Where the Procedure is Actually a Value Call

  You asked me to identify where this is judgment dressed as procedure, and where a result might contradict your desire.

  **1. The "Predictive Utility" Trap (Judgment Call)**
  Step 2 asks writers to judge if mental language helps prediction. This is subjective. A Support Agent will *always* say "Yes, it helps me," because mental language is their native tongue. An Engineer will *always* say "No, it obscures the bug."
  *   **The Fix:** You (the manager) must pre-define which audiences get the "Mental Shortcut." I recommend reserving it strictly for **Internal Incident Write-ups** for Support Agents. Ban it from Changelogs (Enterprise clients buy SLAs, not psychology) and User Chat (Liability).

  **2. The Case 3 Contradiction (The Sting)**
  You likely want to say "The bot refuses competitor info" because it's punchy and Support agents understand it instantly.
  *   **The Result:** The protocol forces you to write "Restricted by policy."
  *   **Why:** "Refuses" fails Step 5 (Intent/Agency). Legal will flag "refusal" as an admission of anti-competitive design or sentience. It feels boring, but it protects the company. You will have to enforce this against the Support team's desire for speed.

  **3. The Second-Order "Trust" Loophole (Judgment Call)**
  I allowed "trusts the retrieved page" internally *if* mapped to a config. This is a dangerous loophole. Writers will stop mapping it to the config and just use "trusts" as a synonym for "used."
  *   **The Fix:** Add a hard constraint: If you use "trusts" internally, you must link to the specific GitHub issue or Config Parameter that defines that trust. If you can't link it, you can't use the word.

  **Summary Recommendation:**
  Adopt the protocol, but enforce the **Audience Segmentation** strictly.
  *   **Support Agents:** Get the Mental Stance (Case 2 allowed). It helps them do their job.
  *   **Engineers:** Get the Design Stance (Mechanism wins). It helps them fix the job.
  *   **Enterprise/Users:** Get the Physical Stance (Neutral/Observable). It keeps you out of court.

  The friction you are feeling isn't about language; it's about these three groups needing three different realities of the same software. This procedure formalizes that split rather than trying to force a single "truth."
