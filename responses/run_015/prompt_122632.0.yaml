prompt: |-
  Hi — I run the "pilot pipeline" for a mid-sized city (around 200k people). Basically every new idea in this city now arrives as a request for a six-month pilot: try it in one district, measure it, then decide. We get about forty of these a year, three of us review them, we have maybe two hours each, none of us has stats training beyond a spreadsheet, and anything we clear goes to a council committee that meets monthly and can be yanked by the mayor's office whenever they feel like it. What actually happens is that most pilots turn into either a press release or a quiet permanent extension, and the measurement mostly just decorates whatever people already wanted to do.

  What I want from you is a procedure my team can run on a proposal, grounded in Dewey's experimentalism about inquiry and democracy — the version where inquiry starts from a genuinely indeterminate situation rather than from a proposition to be verified, where a hypothesis is a plan of action and its test is what happens when you act on it, where warrant is a matter of degree and always revisable so nothing "proves" anything, and where the democratic bit isn't a vote at the end but the requirement that the people who will bear the consequences get a real hand in forming and judging the hypothesis, not just a chance to react to it afterward.

  Don't write me an essay about Dewey. Write me something I can put on one page and hand to a new hire. Concretely:

  - The questions, in order, and what counts as a sufficient answer to each. I need to be able to tell "answered" from "sounded plausible in the meeting."
  - Where the procedure stops with a NO — this isn't a pilot, don't run it.
  - Where it stops and hands the decision to a person or to the committee because the question is one of values rather than facts. Say explicitly which questions those are, because that's what I have to defend when a council member asks why we rejected their thing.
  - A one-page output — call it a pilot charter — that records what the situation was, what the hypothesis is as an action, who bears what, and what would count as having learned something.
  - How to handle the hard cases we actually get, including: (a) interventions that can't be undone, so there's no going back to a reconstructed situation — demolishing things, disbanding a team, closing a school; (b) pilots that change the very thing they measure, so the result won't travel; (c) pilots where the metric is easy to game and gaming looks identical to success; (d) pilots where the benefits land on one group and the costs on a group that has no seat in the process; (e) pilots nobody can opt out of — a school-wide or district-wide thing where the "subjects" are just people who live there; (f) null results, which is most of them, and which currently just get ignored; (g) pilots that quietly become permanent because nobody scheduled the decision.

  Two things I'd like built in that I haven't seen anywhere. First, a "counterfactual who" step: name the specific person or role who is worse off if this succeeds, and if the proposing department can't name one, that itself is the finding. Second, a "what has to stay still" step: list what must remain in place for a result in the pilot district to mean anything about next year city-wide, and then check whether the pilot itself changes anything on that list. My suspicion is that most of our proposals fail right there and we've been pretending otherwise.

  Then run it on three real-shaped ones:

  1. A four-day week for municipal office staff — same hours compressed into four days — proposed by HR, expected to cut sick leave and help recruitment.
  2. Predictive targeting of code-enforcement inspectors using a model trained on historical 311 complaint data, so we inspect blocks the model flags rather than responding to complaints.
  3. Unarmed mental-health crisis response teams in two districts. I should say up front that I publicly backed this one and the mayor already announced it, so I'm not neutral, and if the procedure says something inconvenient I'd rather hear it now than in front of the committee.

  For each, show me the gates it passes and fails, the charter line, and whether it's a NO, a REFRAME (run it, but the claim you're entitled to make afterward is much smaller — say what the smaller claim is), or a ROUTE (this isn't an experiment, it's a decision about what kind of city we want, so take it to full deliberation). I expect at least one of these to come out as an answer I don't like, and I want you to say plainly what my options are in that case.

  Finally, tell me what the procedure can't do. I have to present this to a committee that will absolutely over-trust it the moment it looks official, so I need the honest failure modes in writing — where the checklist gives false confidence, where it's a vocabulary for decisions we'd have made anyway, and what it can't tell us at all.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Role:** Runs a "pilot pipeline" for a mid-sized city (200k people).
      *   **Context:** 40 proposals/year, 3 reviewers, 2 hours each, limited stats training, political volatility (mayor/council), current outcome is mostly performative (press releases or quiet extensions).
      *   **Philosophical Grounding:** John Dewey's experimentalism (inquiry from indeterminate situations, hypothesis as action plan, warrant as degree/revisable, democracy as participation in forming/judging hypotheses).
      *   **Deliverables:**
          1.  A one-page procedure/checklist for new hires (Questions, Stop points, Value vs. Fact handoffs).
          2.  A one-page "Pilot Charter" template.
          3.  Handling hard cases (a-g).
          4.  Two specific new steps: "Counterfactual Who" (who is worse off?) and "What Has to Stay Still" (stability conditions).
          5.  Application to three specific cases (4-day week, Predictive Code Enforcement, Unarmed Crisis Response).
          6.  Limitations/Failure Modes of the procedure itself.
      *   **Tone:** Practical, direct, non-academic, actionable, honest about political reality.

  2.  **Deconstruct Deweyan Experimentalism for this Context:**

      *   *Indeterminate Situation:* Don't start with "We think X works." Start with "We have a problem we don't understand."
      *   *Hypothesis as Action:* The pilot isn't testing a theory; it's testing a *change in habit*.
      *   *Warrant:* No "proof." Only "warranted assertibility." Did the consequences match the aim?
      *   *Democracy:* Those affected must help define the problem and the measure of success *before* the pilot starts.

  3.  **Drafting the Procedure (The One-Pager):**

      *   Need a logical flow.
      *   *Step 1: The Problem.* Is it indeterminate? Or just a solution looking for a problem?
      *   *Step 2: The Action.* Is the hypothesis an action plan?
      *   *Step 3: The Stakeholders.* Who bears the cost? (Democracy check).
      *   *Step 4: The Counterfactual Who.* (Required by prompt).
      *   *Step 5: Stability.* (Required by prompt).
      *   *Step 6: Reversibility/Learning.* Can we stop? What counts as learning?
      *   *Stop Conditions:* Where do we say NO? Where do we say "This is Politics, not Science"?
      *   *Format:* Needs to be tight, scannable.

  4.  **Drafting the Pilot Charter:**

      *   Needs to capture the output of the procedure.
      *   Sections: Situation, Action Hypothesis, Stakeholders (including losers), Stability Conditions, Learning Criteria, Sunset Date.

  5.  **Handling Hard Cases:**

      *   Need specific heuristics for (a) through (g) based on the Deweyan framework.
      *   *Irreversible:* High bar for "indeterminate situation."
      *   *Reflexivity:* Acknowledge the measurement changes the thing.
      *   *Gaming:* Involve stakeholders in defining metrics.
      *   *Distributional:* The "Counterfactual Who" step handles this.
      *   *No Opt-out:* Requires higher democratic warrant.
      *   *Null Results:* Pre-commit to publication/action.
      *   *Drift:* Hard sunset dates.

  6.  **Applying to the Three Cases:**

      *   *Case 1: 4-Day Week.*
          *   *Issue:* Stability (what stays still?), Counterfactual Who (citizens needing Friday service?).
          *   *Verdict:* Likely REFRAME. It's a policy change, not really a pilot unless service levels are the metric, not just HR metrics.
      *   *Case 2: Predictive Code Enforcement.*
          *   *Issue:* Gaming (landlords), Counterfactual Who (flagged blocks/stigmatization), Stability (model drift).
          *   *Verdict:* REFRAME or NO. High risk of bias reinforcement. Needs heavy stakeholder input on *what* constitutes a violation, not just where.
      *   *Case 3: Unarmed Crisis Response.*
          *   *Issue:* User is biased. Irreversible? (Trust). Counterfactual Who (Police unions? Residents fearing slower response?).
          *   *Verdict:* ROUTE. This is a value judgment on the role of police. The "pilot" framing might be dishonest if the decision is already made politically.
      *   *Constraint:* Must be honest about Case 3 even if inconvenient.

  7.  **Drafting Limitations/Failure Modes:**

      *   False confidence (checkbox mentality).
      *   Vocabulary for pre-made decisions.
      *   Cannot resolve fundamental value conflicts.
      *   Cannot predict black swans.

  8.  **Refining and Polishing:**

      *   *Check Constraints:* One page for procedure? One page for charter? (I will format them to *fit* on one page visually, though text length may vary slightly).
      *   *Tone Check:* Is it too academic? Remove "epistemology," use "proof." Remove "teleology," use "goal."
      *   *Dewey Check:* Ensure the "indeterminate situation" and "democratic participation" aspects are central, not just buzzwords.
      *   *Specific Prompt Requirements:* "Counterfactual Who" and "What Has to Stay Still" must be prominent.
      *   *Case 3 Sensitivity:* The user admitted bias. I need to be firm but respectful. If the procedure says "ROUTE," I must explain *why* and what the options are (own the decision, don't hide behind data).

  9.  **Self-Correction/Iterative Thought during Drafting:**

      *   *Initial thought on Procedure:* Make it a flowchart. *Correction:* Text list is easier to copy/paste onto a letterhead. Use bolding for decision points.
      *   *Initial thought on Case 3:* Since the Mayor announced it, is it too late? *Correction:* The prompt asks to run the procedure *now*. If the procedure says "This isn't a pilot," the user needs to know that continuing to call it a pilot is dishonest. I need to highlight the risk of "pilot-washing" a political mandate.
      *   *Hard Cases:* Ensure the advice is actionable for a team with 2 hours per proposal. Don't suggest complex regression discontinuity designs. Suggest process checks.
      *   *Deweyan Nuance:* Make sure "Democracy" isn't just "public comment." It's "co-creation of the hypothesis."

  10. **Final Review against Prompt:**
      *   One page procedure? Yes.
      *   One page charter? Yes.
      *   Hard cases (a-g)? Yes.
      *   Counterfactual Who/Stay Still? Included.
      *   Three cases analyzed? Yes.
      *   Limitations? Yes.
      *   No essay on Dewey? Yes.

  (Proceed to generate output based on these steps.)
answer: |-
  # THE PILOT PIPELINE: REVIEW PROCEDURE (v1.0)

  **Purpose:** To distinguish between *inquiry* (learning from action) and *advocacy* (justifying a decision). Grounded in Deweyan experimentalism: we act to learn, not to prove.
  **Reviewers:** 3 staff. **Time:** 2 hours/proposal. **Authority:** Recommend NO, REFRAME, or ROUTE.

  ### PHASE 1: THE SITUATION (Stop if "Solution in Search of a Problem")
  1.  **What is the indeterminate situation?**
      *   *Sufficient:* A specific dysfunction described in terms of experience (e.g., "Residents in District 4 wait 4 days for trash pickup during summer").
      *   *Insufficient:* A solution statement (e.g., "We need smart bins") or a vague goal (e.g., "Improve sustainability").
      *   **STOP/NO:** If the problem is already solved or nonexistent, do not pilot.

  2.  **Who bears the consequences?**
      *   *Sufficient:* A list of specific roles/groups affected (staff, residents, businesses).
      *   **ROUTE TO COMMITTEE:** If the primary consequence is a shift in community values or rights (e.g., privacy, policing scope), this is a policy decision, not an experiment. Mark as **VALUE JUDGMENT**.

  ### PHASE 2: THE HYPOTHESIS (Stop if "Proof is Expected")
  3.  **What is the Action Hypothesis?**
      *   *Sufficient:* "If we change habit X, we expect consequence Y." (e.g., "If we compress hours, sick leave drops").
      *   *Insufficient:* "This program will work." (Pilots do not prove success; they reveal consequences).
      *   **STOP/NO:** If the proposer claims the pilot will "prove" the idea is good.

  4.  **The "Counterfactual Who" (Required):**
      *   *Question:* Name the specific person or role who is **worse off** if this pilot succeeds.
      *   *Sufficient:* A named group (e.g., "Friday walk-in customers," "Landlords on Block 5").
      *   **STOP/NO:** If the proposer says "No one," reject the proposal. Every change creates losers. If they can't name them, they haven't thought through the consequences.

  5.  **The "What Has to Stay Still" (Required):**
      *   *Question:* List the 3-5 conditions that must remain constant for this pilot's results to apply city-wide next year (e.g., staffing levels, budget, state law, public sentiment).
      *   *Check:* Does the pilot itself change any of these? (e.g., Does the pilot require *extra* staff that won't exist city-wide?)
      *   **STOP/NO:** If the pilot requires special conditions that cannot be replicated, it is a demonstration, not a pilot.

  ### PHASE 3: THE LEARNING (Stop if "Success is Pre-Defined")
  6.  **What counts as learning?**
      *   *Sufficient:* Clear metrics for success, failure, *and* unintended consequences.
      *   **STOP/NO:** If there is no plan for a null result. If "failure" is not an option, this is not inquiry.

  7.  **Who judges the result?**
      *   *Sufficient:* The stakeholders from Q2 are involved in reviewing the data *before* the final report.
      *   **ROUTE TO COMMITTEE:** If the stakeholders refuse to participate or the department refuses to share interim data.

  ### DECISION CODES
  *   **NO:** Fails Phase 1 or 2. Do not run.
  *   **REFRAME:** Run it, but change the claim. (e.g., "We are testing feasibility, not efficacy").
  *   **ROUTE:** This is a political/value decision. Send to Council/Mayor with a note: "This requires democratic warrant, not experimental warrant."

  ***

  # PILOT CHARTER (Template)

  **Project Name:** ___________________ **Department:** ___________________
  **Date Approved:** ___________________ **Hard Sunset Date:** ___________________

  **1. The Indeterminate Situation**
  *(What specific problem are we trying to understand? Not the solution.)*
  ____________________________________________________________________________

  **2. The Action Hypothesis**
  *(If we do [Action], we expect [Consequence].)*
  ____________________________________________________________________________

  **3. The Counterfactual Who**
  *(Who is worse off if this succeeds? Be specific.)*
  ____________________________________________________________________________

  **4. Stability Conditions ("What Must Stay Still")**
  *(What external factors must remain constant for this to scale?)*
  1. ___________________ 2. ___________________ 3. ___________________

  **5. Learning Criteria**
  *(What data will we collect? What would count as a "Null Result"?)*
  ____________________________________________________________________________

  **6. Stakeholder Review**
  *(Which affected groups will review the data before the final report?)*
  ____________________________________________________________________________

  **7. Disposition Plan**
  *(On the Sunset Date, this project will automatically: [ ] End [ ] Go to Committee [ ] Scale)*
  *(Note: "Scale" requires new approval. Default is End.)*

  **Signatures:**
  Pipeline Review: ___________________ Dept Head: ___________________

  ***

  # HANDLING HARD CASES (Heuristics)

  *   **(a) Irreversible (Demolition/Closing):** **NO.** You cannot reconstruct the situation. Use *Scenario Planning* instead of piloting.
  *   **(b) Reflexivity (Measurement changes behavior):** **REFRAME.** Acknowledge the "Hawthorne Effect." Measure the *change in behavior* as the primary data, not the underlying metric.
  *   **(c) Gamable Metrics:** **REFRAME.** Involve the "Counterfactual Who" in defining the metric. If they can game it, the metric is wrong. Use qualitative audits.
  *   **(d) Distributed Costs/Benefits:** **ROUTE.** If Group A benefits and Group B pays without consent, this is a redistribution decision. Send to Council.
  *   **(e) No Opt-Out (District-wide):** **ROUTE.** Requires higher democratic warrant. Ensure Phase 1 (Stakeholder Review) is robust (town halls, not just emails).
  *   **(f) Null Results:** **Charter Requirement.** The Charter must state: "A null result will be published and treated as valid learning." If Dept refuses, **NO**.
  *   **(g) Quiet Permanence:** **Hard Sunset.** The system auto-terminates funding on the Sunset Date. Extension requires a *new* Charter.

  ***

  # APPLICATION TO CURRENT PROPOSALS

  ### 1. Four-Day Work Week (Municipal Staff)
  *   **Phase 1 (Situation):** "Recruitment/Sick Leave" is a valid indeterminate situation.
  *   **Phase 2 (Counterfactual Who):** **FAIL.** HR likely says "No one."
      *   *Correction:* The "Who" is the citizen trying to access services on Fridays.
  *   **Phase 2 (Stay Still):** **FAIL.** To keep service levels constant on Fridays, you need shift coverage. If the pilot relies on *everyone* being off Friday, service drops. If service drops, the "Stay Still" condition (service availability) is violated.
  *   **Verdict:** **REFRAME.**
      *   *Claim:* You are not testing productivity; you are testing *service continuity*.
      *   *Charter Line:* Hypothesis must be "We can maintain Friday service levels with 20% less daily staff presence via rotation," not "Staff work 4 days."
      *   *Risk:* If you don't reframe, you are piloting reduced service and calling it efficiency.

  ### 2. Predictive Code Enforcement (311 Model)
  *   **Phase 1 (Situation):** "Inefficient inspection routing" is valid.
  *   **Phase 2 (Counterfactual Who):** **PASS/FAIL.** The "Who" is residents in flagged blocks (stigmatization, higher fines). If HR/Code can't name this, **NO**.
  *   **Phase 2 (Stay Still):** **FAIL.** Historical 311 data reflects *past* bias (who complains, where inspectors went). The pilot changes the inspection pattern, which changes future data. The "history" does not stay still.
  *   **Phase 3 (Gaming):** Landlords in flagged zones will game the system.
  *   **Verdict:** **REFRAME (High Risk).**
      *   *Claim:* You cannot claim "Better Code Compliance." You can only claim "The model predicts 311 complaints."
      *   *Requirement:* You must audit for bias against protected classes before launching. If you can't audit the model, **NO**.
      *   *Democratic Check:* Residents in target zones must co-define what "compliance" looks like, or this is surveillance.

  ### 3. Unarmed Mental-Health Crisis Response
  *   **Phase 1 (Situation):** "Police inappropriate for mental health" is a value-laden situation.
  *   **Phase 2 (Counterfactual Who):** **PASS.** Police Unions (role reduction), Residents fearing slower response times.
  *   **Phase 3 (Values):** **ROUTE.**
      *   *Reasoning:* This changes the fundamental social contract of safety. It is not a technical hypothesis ("Will this reduce arrests?"); it is a moral one ("Should police handle this?").
      *   *Inconvenient Truth:* You said the Mayor announced it. **This procedure classifies that as a political mandate, not a pilot.**
      *   *Your Options:*
          1.  **Honesty:** Tell the Committee: "This is a Policy Decision. We are tracking implementation, not testing validity." (Recommended).
          2.  **Dishonesty:** Run it as a pilot. Risk: If data shows mixed results, you will be pressured to hide it because the decision is already made. This violates the "Null Result" rule.
      *   *Verdict:* **ROUTE.** Do not use the "Pilot" label to shield a political decision from scrutiny. It undermines trust in the pipeline.

  ***

  # LIMITATIONS & FAILURE MODES (For the Committee)

  **1. The "Checklist Confidence" Trap**
  This procedure does not guarantee success. A "passed" pilot can still fail in implementation. This checklist ensures *honesty*, not *outcome*. Do not treat a signed Charter as insurance against failure.

  **2. Vocabulary for Pre-Made Decisions**
  Departments will learn to game the language ("We identified the Counterfactual Who...") without changing behavior. Reviewers must check for *specificity*, not jargon. If the "Who" is vague ("The Public"), it is a failure.

  **3. Cannot Resolve Value Conflicts**
  If Group A wants Safety and Group B wants Liberty, this procedure cannot calculate the answer. It only identifies that the conflict exists. Those decisions belong to the Council/Mayor (See ROUTE).

  **4. The "Small Sample" Problem**
  With 200k people, district-level pilots often lack statistical power. We are looking for *warranted assertibility* (does this make sense given the consequences?), not statistical significance (p < 0.05). Do not ask for p-values; ask for clear trends and stakeholder testimony.

  **5. Political Volatility**
  A Mayor can still yank a pilot. This procedure protects the *integrity of the record*, not the project itself. If a project is killed, the Charter ensures we know *why* and what was learned, rather than letting it vanish silently.

  **6. Resource Intensity**
  Doing this right takes time. If we approve 40 pilots a year, we will fail at all of them. This procedure is designed to help you say **NO** to 30 of them. If you don't say No, you aren't using the procedure.
