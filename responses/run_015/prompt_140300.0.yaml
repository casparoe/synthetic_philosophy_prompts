      *   Constraint: "Everything internal is a function of the data the system was trained on."
      *   Implication: If internals are just $f(\text{corpus})$, then Externalism claims the *validity* or *truth conditions* of the output depend on the *deployment* distribution, not just the training corpus.

  4.  **Drafting the Failure Report (The Core Challenge):**
      *   *Constraint Check:* The user wants to know where the ML vocabulary *fails* to capture the philosophical nuance.
