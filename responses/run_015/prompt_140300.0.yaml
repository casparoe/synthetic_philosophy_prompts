          *   *ML Translation:* Two models trained on identical architectures and hyperparameters. Model A trained on Corpus A (where "water" co-occurs with H2O properties). Model B trained on Corpus B (where "water" co-occurs with XYZ properties).
          *   *Wait, constraint:* The prompt says "molecule-for-molecule duplicate." In ML, this means *byte-identical weights*.
          *   *Refined Translation:* One model checkpoint ($\theta$). Deployed in Environment A (real world, H2O) vs. Environment B (Twin world, XYZ). The *ground truth* labels associated with the token "water" differ in the retrieval index or downstream task.
      *   **Case 2: Social/Arthritis (Burge):**
          *   *Philosophy:* Patient thinks "arthritis" applies to thigh pain. Doctor corrects him. Meaning is fixed by expert/community usage, not individual conception.
          *   *ML Translation:* Model learns a representation for "arthritis" based on training corpus (which might include layman misuse). However, the *benchmark* or *evaluation metric* is defined by expert annotation (the "community"). Fine-tuning or RLHF acts as the "correction." The "meaning" is defined by the loss function derived from expert labels, not the raw pre-training activations.
      *   **Case 3: Slow-Switching:**
