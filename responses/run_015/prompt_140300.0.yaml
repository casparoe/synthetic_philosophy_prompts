          *   Externalism often blurs them (Causal history *is* the meaning).
          *   *Verdict:* ML framework forces a distinction Externalism might reject. Externalism cares about the *actual* causal link, not just the statistical correlation in the corpus.
      *   *Issue 2: Byte-Identical Weights.*
          *   ML: Same weights = Same function = Same meaning (operationalist).
          *   Externalism: Same weights + Different Environment = Different Meaning.
          *   *Residue:* ML has no variable for "reference" other than "loss on benchmark." If the benchmark changes, ML calls it "distribution shift" or "domain adaptation," not "change in meaning of the internal state."
