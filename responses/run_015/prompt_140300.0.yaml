  **(Self-Correction on Specific 2):** The user suspects externalism owes us two descriptions for identical weights. I need to confirm this. Yes, Externalism says Meaning differs. ML says Model is identical. The gap is "Reference." ML has no native slot for Reference, only "Token ID."

