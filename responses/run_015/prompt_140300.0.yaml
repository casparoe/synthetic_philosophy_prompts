  2.  **Deconstruct the Philosophical Cases into ML Terms:**

      *   **Core Concept:** Semantic Externalism = Meaning is not determined solely by internal state (weights/activations) but by causal/historical relation to the environment.
      *   **ML Equivalent:** The "internal state" is the model weights ($\theta$) and activations ($h$). The "environment" is the data distribution ($P_{data}$).
