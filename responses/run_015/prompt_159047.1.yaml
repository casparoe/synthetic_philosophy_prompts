prompt: |-
  I should say at the outset that I have no academic background in philosophy — I work in medical billing, and whatever I know about the free will debate comes from reading on my own in the evenings and from a small self-study group I help organise. There are five of us and none of us has a teacher: we agree on a question, each of us writes an answer against the clock, and then we swap and mark one another's work. This week the rotation has landed on me to grade an answer on Frankfurt-style cases and the principle of alternative possibilities, and because I would rather my own sympathies in that debate did not leak into the feedback, I would like you to act as the external grader and produce the assessment I can pass on.

  The question we had all agreed on was this: state the principle of alternative possibilities and explain how a Frankfurt-style case is meant to be a counterexample to it; then set out the flicker-of-freedom reply and say whether you think it succeeds; and finish by saying, with reasons, whether such cases establish that moral responsibility does not require the ability to do otherwise. Two rules went with it: no consulting any sources, and no more than 450 words. The writer had about forty minutes. Here is the answer I have to mark, reproduced exactly as it was written to me.

  The principle of alternative possibilities, or PAP, is the claim that a person is morally responsible for what they have done only if they could have done otherwise. It therefore treats the ability to do otherwise as a sufficient condition on responsibility: if some alternative was open to you, that is enough to make you responsible, and if none was, you cannot be. Frankfurt's 1969 paper attacked this principle with a counterexample, and the pattern of case he invented there has been reused ever since.

  In the original case, Black wants Jones to kill Smith and is able to make him do it, but Black would rather not show his hand; he watches and waits, and would intervene only if it became clear that Jones was going to refrain. As things turn out, Jones kills Smith on his own, for his own reasons, and Black never has to do anything at all. Jones is plainly morally responsible for the killing. But Jones could not have done otherwise, because had he been about to refrain, Black would have brought the killing about anyway. So here we have moral responsibility without alternative possibilities, and PAP is refuted.

  The upshot is that moral responsibility is compatible with determinism. Jones's action was unavoidable in the relevant sense, and yet he is responsible, because what makes him responsible is that the action flowed from his own desires and reasons rather than from anything outside him. Frankfurt-style cases are therefore best read as a defence of compatibilism, and they dispose of the incompatibilist argument that if our acts are the inevitable outcome of the laws and the remote past then we are never responsible.

  The most important reply is the flicker-of-freedom objection. Critics point out that Jones did retain some alternative: he could at least have twitched a muscle, or begun to form an intention not to kill, or blinked at a moment when in fact he did not. However small, that is an alternative possibility, and PAP demands no more than that there be one. The flicker is enough to satisfy the principle, so the cases fail to be counterexamples and Frankfurt's argument does not go through.

  I think this reply succeeds, and I conclude that Frankfurt-style cases do not show that moral responsibility is possible without the ability to do otherwise. PAP survives the cases, and the ability to do otherwise is still required for moral responsibility.

  What I need from you is a mark out of 100 together with the specific comments that justify it, rather than a general impression of whether the answer is good or bad. Please work through it more or less in the order it runs: say plainly which claims are correct and why they are correct, which are wrong and what exactly goes wrong, and for each mistake whether it is a slip that costs the writer little or one that the argument actually rests on. I suspect there is at least one passage that reads smoothly and confidently but is subtly wrong, and I do not trust myself to find it, so if there is anything here of the kind a quick grader would wave through, please flag it as such. It would also help to know what the answer omits that the question asked for, what further objection it never encounters, and what a revised version would have to add or drop to be worth full marks.

  One constraint on the format: please write your whole response as continuous prose, with no headings, bullet points, numbered lists, bold text or tables, in the manner of an email or a letter, since I intend to send your comments on more or less as they stand. Somewhere around six or seven hundred words should be right.
