answer: |-
  ### Brainstorming and Problem Analysis

  The real problem here isn't archaeological; it's legal and epistemological. Your ordinance creates a binary distinction—"domestic" versus "institutional"—that rarely exists in the ground. Prehistoric farming communities often practiced ritual at the household level; a "household shrine" is both domestic and ceremonial. By forcing a choice between "rubbish" and "temple," the ordinance ignores the middle ground where most ancient belief lived. The economist is right to worry about auditability: if "ritual" becomes a catch-all for anything we don't understand, the commission gains veto power based on subjective interpretation rather than evidence. However, the archaeologist is right that "structured deposition" (deliberate placement of objects following a rule) is a measurable phenomenon distinct from random accumulation. The crux is whether this specific pattern represents a shared community norm (institutional) or one farmer's eccentricity (domestic).

  You have framed the oral tradition issue as a problem of "contamination," but that assumes traditions are static texts rather than living practices. The fact that the tradition was written down in 1974 after a dig doesn't necessarily mean the dig created the tradition; it might mean the dig prompted the recording of an existing memory. However, you are correct that it cannot serve as independent proof. If the tradition and the artifacts rely on the same 1970s interpretation, you have one line of evidence, not two. The commission needs to treat the tradition as a hypothesis generator—it tells you where to look—not as a verdict on what you will find.

  To give you a precise recommendation, I need to know the exact cost difference between "record-and-release" and "full excavation," and whether the ordinance defines "institutional" as requiring multiple sites or simply evidence of shared norms. However, based on standard practice, the solution is usually phased investigation. You cannot vote to approve yet because the evidence is currently ambiguous. You cannot vote to deny because the evidence isn't conclusive. You need a motion that forces a resolution of the ambiguity within a fixed timeframe. The goal is to find evidence that could *falsify* the ritual claim, not just confirm it.

  ***

  ### MEMORANDUM

  **TO:** Historic Preservation Commission
  **FROM:** [Your Name], Commission Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Application 24-09 (River Ridge Development)

  **Bottom Line Recommendation**
  I move we **continue the application for 60 days** to allow for a limited evaluation excavation. We should not approve as applied for, nor should we require redesign yet. The motion should specify: The developer must fund an excavation of 10% of the remaining undeveloped ridge, supervised by the County Archaeologist, to be completed by December 26. **Stop Criterion:** If this evaluation reveals further structured deposits (repeated pit arcs, intentional breakage) outside the current footprint, the application returns to the Commission for a redesign requirement. **Go Criterion:** If the evaluation reveals only random domestic refuse consistent with the developer's consultant's model, the Commission votes to approve with standard record-and-release conditions. This sets a hard deadline and clear evidentiary thresholds for a final vote.

  **Evidence and Falsifiability**
  We must define what counts as evidence of "institutional practice" versus "household rubbish." The County Archaeologist argues for "structured deposition," meaning objects placed according to a rule (e.g., only skulls, inverted stones) rather than accumulating by chance. The Developer's Consultant argues these are normal losses. To change the Economist's mind, we need to see if this pattern is isolated or repeated. If this is the only spot on the ridge, it may be one household's idiosyncrasy. If the evaluation excavation finds similar pits nearby, it indicates a shared community norm, satisfying the "institutional" requirement. To change the Archaeologist's mind, the evaluation must show that the "pattern" dissolves into random scatter when viewed at a larger scale. We must acknowledge that absolute certainty is impossible; we are inferring mental states from dirt. However, if neither side can be ruled out by further digging, the Commission must vote based on the precautionary principle: when evidence of significant heritage is ambiguous but plausible, we err on the side of preservation because destruction is irreversible.

  **Addressing Developer and Economist Concerns**
  The Economist's worry is valid: "Ritual" can become an unfalsifiable label used to halt housing whenever artifacts appear. This threatens the auditability of our decisions. We cannot allow "we don't understand it, therefore it's sacred" to become policy. Furthermore, the housing need is real, and delays cost money that ultimately raises prices for buyers. The Developer is right that pots break and dogs die in backyards. However, the specific combination here—refittable pots, selected body parts, inverted tools—is statistically unlikely to be random waste. Ignoring this pattern risks erasing the only record of this community's belief system. The cost of a limited evaluation is high, but the cost of destroying unique data is higher. If the site is merely domestic, the evaluation proves it, and building proceeds. If it is institutional, the cost of delay is the price of complying with the ordinance we are sworn to uphold. We protect the process by demanding evidence that could prove us wrong, not just evidence that confirms our suspicions.

  **Oral Tradition and Contamination**
  Regarding the descendant community's tradition: We must treat this as corroborative but not definitive. The concern that the tradition was influenced by the 1970s excavation is serious; if the tradition relies on the excavation notes, it is circular evidence. However, oral traditions often predate their documentation. We should not dismiss the tradition because it was written down late, nor should we accept it as absolute proof because it aligns with the artifacts. The correct approach is to treat the tradition as independent *context* rather than independent *proof*. It tells us why this specific ridge might be significant, guiding where we look, but the ground must still yield the physical evidence of institutional practice. If the evaluation excavation finds nothing further, the tradition alone cannot trigger the "institutional" clause of our ordinance. If the excavation finds more structured deposits, the tradition helps us understand their meaning. We honor the community by investigating seriously, not by bypassing evidence standards.

  **Conclusion**
  This motion balances the need for housing with our duty to preserve history. It addresses the auditability worry by setting clear fail conditions. It respects the oral tradition without making it law. It gives the Developer a path to build if the evidence supports them, and it protects the site if the evidence supports the Archaeologist. We vote to continue, not to stop.
