answer: |-
  This is a classic dilemma in voting theory, and it's awesome that you're thinking this deeply about it. You and your friend are actually both right, but you're right about different things. She is right about the **math/game theory**, and you are right about the **social contract/ethics**.

  Here is the breakdown of the situation, the math, and what you should actually do.

  ### 1. The Math Check (Who actually wins?)
  Based on the gossip you provided, I ran the numbers for the Borda Count system (2 pts for 1st, 1 for 2nd, 0 for 3rd).

  **The Projected Votes:**
  *   **You & Friend (Honest):** Dinner (2), Donate (1), Cash (0)
  *   **Group A (2 people):** Cash (2), Donate (1), Dinner (0) *(Assuming Donate is middle since Dinner is last)*
  *   **Group B (2 people):** Donate (2), Cash (1), Dinner (0)

  **The Tally:**
  *   **Donate:** 1+1 (You/Friend) + 1+1 (Group A) + 2+2 (Group B) = **8 points**
  *   **Cash:** 0+0 (You/Friend) + 2+2 (Group A) + 1+1 (Group B) = **6 points**
  *   **Dinner:** 2+2 (You/Friend) + 0+0 (Group A) + 0+0 (Group B) = **4 points**

  **The Result:** Even if you vote honestly, **Donate wins by two points.** Cash does not win.

  **Why is your friend worried?**
  She is likely worried about the "Spoiler Effect." In Borda Count, if you rank your true favorite (Dinner) first, you give zero points to your second choice (Donate). If the gossip is slightly wrong (e.g., one of the "Donate" people actually prefers Cash), Cash could tie or beat Donate. If they tie, the Landlord breaks it, and the Landlord hates Dinner but might pick Cash over Donate.

  By ranking Donate first, she guarantees Donate gets maximum points to create a "firewall" against Cash.

  ### 2. Is it "Cheating"?
  **Technically: No.**
  In voting theory, this is called **Strategic Voting** (or "burying"). Almost all voting systems (except maybe Approval Voting) have loopholes where lying about your preference can get you a better outcome. Your friend is citing the *Gibbard-Satterthwaite theorem*, which basically proves that in any ranked voting system, there will always be situations where voting honestly is a bad move. She isn't "cheating" by the rules of the ballot.

  **Socially: It's risky.**
  You live in a **co-op**. The entire point of a cooperative is shared values, transparency, and trust.
  *   **If you vote honestly:** You uphold the integrity of the group. If Dinner loses, it loses fairly.
  *   **If you vote strategically:** You are treating your housemates like opponents in a game rather than partners in a home. If people find out later (e.g., "Why did you rank Donate first? I thought you wanted Dinner!"), it creates suspicion. "Who else lied on their ballot?"

  ### 3. What should you do?
  **You should vote honestly (Dinner > Donate > Cash).**

  Here is why:
  1.  **The Math is on your side:** Based on the numbers you have, Donate wins even with honest voting. You don't *need* to lie to stop Cash.
  2.  **The Margin of Error:** Even if the gossip is slightly off, Donate has a 2-point lead. For Cash to overtake Donate, two people would have to have lied about their preferences in the gossip.
  3.  **The Principle:** If a voting system is so fragile that two honest voters cause the "worst outcome," the system is broken, not the voters. Fixing the system is better than gaming it.
  4.  **The Landlord Factor:** Dinner is already handicapped because the Landlord vetoes it on a tie. You and your friend ranking Dinner first is the *only* thing giving it a chance. If you both bury Dinner to help Donate, Dinner gets 0 points and looks like it has no support at all.

  **How to talk to your friend:**
  Tell her: *"I ran the numbers based on the gossip. Donate wins by 8 to 6 even if we vote honestly. Cash doesn't have a path to win unless the gossip is totally wrong. I'd rather we vote our true preferences so we don't start a culture of lying in the house. If Cash somehow wins, that means our voting system is broken, and we should fix it next year."*

  ### 4. How to fix the system for next year
  Your friend is right that the current system incentivizes lying. Borda Count is notorious for this. Here are three tweaks you can propose for next year:

  1.  **Approval Voting (Easiest Fix):**
      *   Instead of ranking, you just "approve" of any option you'd be happy with.
      *   You check: Dinner and Donate.
      *   Friend checks: Dinner and Donate.
      *   Cash-first people check: Cash.
      *   Donate-first people check: Donate and maybe Cash.
      *   *Why it helps:* You never have to rank your second choice below your first. You can support both Dinner and Donate without hurting Dinner. It removes the incentive to "bury" Dinner.

  2.  **Instant Runoff (Ranked Choice):**
      *   If no one gets 50% of the first-place votes, the last place option is eliminated and their votes transfer to their second choice.
      *   *Why it helps:* It makes it safer to vote for your true favorite (Dinner) first, because if Dinner loses, your vote transfers to Donate anyway. You don't "waste" your vote.

  3.  **Remove the Landlord Tie-Breaker:**
      *   Having an outsider who hates one of the options break ties is fundamentally unfair. It effectively vetos Dinner before the vote starts. The house should decide ties internally (e.g., re-vote between the top two, or flip a coin).

  ### Summary
  *   **Is she right?** Mathematically, yes, strategic voting is a real thing. But her fear that Cash will win seems exaggerated by the numbers.
  *   **Are you right?** Ethically, yes. In a small co-op, trust is more valuable than optimizing a ballot.
  *   **The Move:** Vote **Dinner > Donate > Cash**. It likely yields the same result (Donate wins) without compromising your integrity. If Cash wins anyway, use that as proof to switch to Approval Voting next year.
