answer: |-
  There is currently no single theory that successfully treats institutional facts as real without either collapsing them into physics or secretly relying on magical explanations.

  Here is the spec for a theory that tries to walk the line between Dennett's cranes (natural mechanisms) and skyhooks (miraculous leaps), specifically for social stuff like money or laws.

  ### The Must-Haves (Desiderata)

  **1. Specific Cases It Has to Handle**
  *   **Substrate vs. Status:** It must explain why a piece of paper (physical) becomes a dollar bill (institutional) without saying the paper *is* the money (greedy reduction) and without saying the money is a ghost floating above the paper (skyhook).
  *   **Descriptive vs. Normative:** It needs to account for how a physical action (moving your body across a line) becomes a normative violation (illegal border crossing). The theory must explain how "oughts" emerge from "ises" without claiming morality is a physical force like gravity.
  *   **Collective Intentionality:** It has to show how individual brain states combine to create a group fact (like "we are a corporation") that constrains the individuals themselves.

  **2. Distinctions It Can't Collapse**
  *   **Explaining-Away vs. Explaining-Up:** A valid theory must explain *how* the higher level exists (explaining-up) without claiming the higher level doesn't matter because only the atoms are real (explaining-away). If you say "money is just paper," you've failed.
  *   **Real Pattern vs. Real Substance:** It needs to treat institutions as "real patterns" (like a center of gravity—useful and predictable) without demanding they be "real substances" (like a rock—made of stuff). Collapsing this leads to confusion about what "exists."
  *   **Constitutive vs. Causal:** It must distinguish what makes something what it is (constitutive rules, like "checkmate ends the game") from what makes things happen (causal powers, like "the guard stops you").

  **3. Science It Must Respect**
  *   **Causal Closure of Physics:** Every physical event must have a physical cause. You can't say "the law stopped the car" if the actual stopping was done by brakes and friction without explaining how the "law" triggered the brakes physically.
  *   **Evolutionary Continuity:** The capacity to create institutions must evolve from simpler biological traits (like primate hierarchy or signaling) without a sudden jump where humans got a "social soul."
  *   **Neuroscience Compatibility:** The theory can't require brains to operate outside known neurobiology. No special "institution neurons" or non-physical mental substances.

  ### The Trouble Spots (Jointly Impossible Pairs)

  These are the tensions where satisfying one requirement might force you to violate another, often creating a hidden skyhook.

  *   **Causal Efficacy vs. Physical Closure:** If you insist institutional facts (like citizenship) have real causal power to stop you from voting, you risk violating the causal closure of physics. If you insist on strict physical closure, you risk making citizenship an "epiphenomenon" (a shadow that does nothing), which feels like greedy reductionism. **You usually can't have full causal power for social facts without smuggling in a skyhook.**
  *   **Objectivity vs. Mind-Dependence:** Institutional facts are "ontologically subjective" (they depend on us believing they exist) but "epistemically objective" (it's a fact that you owe taxes). A theory struggles to explain how something dependent on minds can constrain minds objectively without appealing to a mysterious social field (skyhook) or reducing it to individual psychology (greedy reduction).
  *   **Continuity vs. Discontinuity:** To avoid skyhooks, you need evolutionary continuity (animals -> humans). But institutional reality seems qualitatively different from animal hierarchy (language, rules, rights). Bridging this gap without claiming humans are "special" often looks like a hidden skyhook.

  ### What's Settled vs. What's Contested

  **Settled (Most Naturalists Agree)**
  *   **Greedy Reductionism is a Mistake:** Almost everyone agrees that saying "money isn't real, it's just atoms" misses the point of how the world works. The higher-level patterns matter.
  *   **Skyhooks are Forbidden:** In serious philosophy of mind/social science, nobody openly argues for supernatural or non-natural explanations. Everyone claims to be using "cranes."
  *   **Supervenience:** Most agree that social facts depend on physical facts (if you change all the physical atoms, the social facts change), even if they aren't reducible to them.

  **Contested (Actual Fighting Ground)**
  *   **Weak vs. Strong Emergence:** Some argue "weak emergence" (complexity arising from simple rules, like traffic jams) is enough to explain institutions. Others argue you need "strong emergence" (new causal powers that literally cannot be predicted from the bottom up), which many physicists hate because it threatens causal closure.
  *   **The Status of "Functions":** Is a dollar bill's value a real property of the universe once we agree on it, or is it just a useful fiction we tell ourselves? Dennett leans toward "real patterns," while others lean toward "social constructs" that are less ontologically robust.
  *   **Where the Crane Stops:** There is no agreement on exactly *which* mechanism bridges the gap from biological signaling to institutional rules. Is it language? Recursion? Shared attention? Everyone has a candidate, but none are universally accepted as the full solution.
