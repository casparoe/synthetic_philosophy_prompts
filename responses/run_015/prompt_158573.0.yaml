answer: |-
  Hello there. It is a pleasure to meet a fellow traveler in the landscape of rationality. Retirement seems to suit you; trading lab benches for thought experiments is a noble transition. And do not worry about the typos—old habits, as you say, die hard. I will keep this in American English for your grandson's sake.

  You have put your finger on the exact sore spot in modern decision theory. The short answer to your opening question is: **No, coherence arguments do not strictly force Expected Utility (EU) maximization.** They force your *beliefs* to be probabilistic (to avoid a Dutch Book), and they force your *preferences* to be consistent (to avoid a Money Pump). But you can be consistent without maximizing EU if you are willing to give up other axioms, specifically **Completeness**.

  Here is the breakdown of your four cases, the principle that ties them together, and the hard truth about which verdict might have to go.

  ### The Unifying Principle: Completeness of Preference

  The standard EU framework (von Neumann-Morgenstern or Savage) relies on four axioms. The one most people ignore is **Completeness**. It states that for any two options, A and B, you must either prefer A, prefer B, or be indifferent.

  Your four cases are actually a battle between **Completeness** (standard EU) and **Lexicographic/Protected Values** (non-EU).

  1.  **Case 1 (Researcher):** This is standard EU. She has high utility for discovery and accepts the risk. No conflict here.
  2.  **Case 2 (Doctor):** She treats "life" as a **protected value**. She refuses to trade it against money or probability. In technical terms, her preferences are *incomplete*. She will not state a preference between "sure life" and "gamble for greater good."
  3.  **Case 3 (Climate Advisor):** She uses Minimax Regret. This is a non-Bayesian rule. You say her probabilities shift with framing. Technically, if a bookie can control the framing, she *can* be Dutch-booked on her beliefs. However, if her decision rule refuses to bet when framing is unstable, she avoids the pump. She sacrifices probabilistic coherence for decision robustness.
  4.  **Case 4 (Trader):** She claims to follow Savage's axioms *except* when outcomes are sacred. This is the outlier. You cannot accept an axiomatic system partially. If you violate the Sure-Thing Principle, you are not a Savage agent.

  ### Which Verdict Should You Drop?

  There is no single principle that saves all four verdicts exactly as you stated them. To find coherence, you must adjust one.

  **I recommend you drop the verdict on Case 4.**

  Here is why: Your intuition in Case 2 (the Doctor) is widely shared. We feel it is rational to refuse to put a price on a human life. If Case 2 is rational, then Case 4 must also be rational, *provided* the Trader does not claim to be a standard EU maximizer. The Trader is incoherent only because she claims to follow the axioms while breaking them. If she simply said, "I use a lexical rule for sacred outcomes," she would be in the same boat as the Doctor.

  **The Hard Truth:** If you stick to strict decision theory, **Case 2 is actually the one under fire.** Standard coherence arguments (specifically Money Pump arguments) suggest that if you have incomplete preferences (like the Doctor), a clever agent can exploit you. They can offer you a series of trades that leave you worse off, purely because you refuse to rank certain outcomes. To save the Doctor, you must accept that "Rationality" allows for **incomplete preferences**, which means abandoning strict EU maximization.

  ### Prediction: The AI Designer Case

  You asked about an AI designer who maximizes EU for hardware costs but treats safety violations lexicographically (i.e., safety is a hard constraint, not a trade-off).

  **Prediction:** This system will be **dynamically inconsistent** in edge cases.

  Here is the scenario:
  *   **Option A:** 100% safe, very expensive.
  *   **Option B:** 99.9% safe, cheap.
  *   **Option C:** 99.9% safe, cheaper than B, but slightly different risk profile.

  The AI chooses A over B (Safety first). It chooses B over C (Cost EU). But if framed differently, it might choose C over A (if the safety violation is deemed "negligible" in one frame but "critical" in another).

  Because the AI is mixing two different decision rules (EU for cost, Lexicographic for safety), it risks a **Money Pump**. A adversary could trade the AI from A to C to B and back to A, charging a fee each time, because the AI lacks a single currency (utility) to compare safety and cost globally.

  **Verdict:** The AI is "locally coherent" but "globally vulnerable." It works fine until the safety constraint conflicts with the cost optimization in a loop.

  ### Summary for the Lab Notebook

  1.  **Coherence Arguments:** They force probabilities to be consistent and preferences to avoid money pumps. They do *not* force EU maximization unless you demand **Completeness**.
  2.  **The Conflict:** Your Doctor (Case 2) and Trader (Case 4) are doing the same thing (protecting values). If one is rational, the other is too. The Trader is only "incoherent" because of her inconsistent self-description.
  3.  **The Sacrifice:** To keep your intuition about the Doctor, you must accept that rational agents can have **incomplete preferences**. This saves Cases 2 and 4, but it admits that EU theory is not the whole story.
  4.  **The AI:** Mixing EU and Lexicographic rules creates vulnerabilities. It is practical engineering, but theoretically "leaky."

  You are right to be puzzled. The field often pretends these problems are solved. They are not. You have identified the exact boundary where mathematics meets morality. Keep puzzling; that is where the real work is.
