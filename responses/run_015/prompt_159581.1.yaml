  1. **Popper argues extrapolating a trend isn't stating a law; forecasts only work if institutions and technology stay put. Isn't your "law" merely a trend conditional on modern bureaucratic data collection existing?**
  Follow-up: If you claim data quality is constant, doesn't institutional change alter what gets recorded, breaking the trend's continuity?

  2. **History doesn't rerun. What observation counts against your law when every state breakdown is unique?**
  Follow-up: You'll likely cite cross-societal comparison or natural experiments. But how do you ensure cases are independent enough to count as multiple tests rather than one diffuse event?

  3. **Are these laws really ceteris paribus clauses with the historical frame smuggled into the antecedents?**
  Follow-up: If you say all special sciences do this, where do you draw the line between a scientific law and a contextual generalization like astrology?

  4. **If elites read your law, they might mitigate overproduction. Does the law dissolve upon publication?**
  Follow-up: If you call that a scope condition, doesn't it render the law useless for public policy precisely where it claims relevance?

  5. **If the forecast is reliable, does Popper's argument for piecemeal engineering still hold, or does reliability license large-scale social restructuring?**
  Follow-up: If you endorse restructuring, doesn't that revive the utopian engineering Popper warned against, despite your claimed reliability?

  6. **You argue discovery rates can be trended. But isn't the content of discovery what changes history, not just the rate?**
  Follow-up: If you say rate drives capacity, how do you account for qualitative shifts, like nuclear weapons versus stone tools, having different historical impacts per unit?

  7. **Big data shows correlation. Where is the causal mechanism linking elite overproduction specifically to breakdown?**
  Follow-up: If you say the data is the mechanism, how do you distinguish your law from spurious correlations like ice cream sales and drowning?

  8. **What distinguishes your "historical law" from a long-term statistical regularity that simply breaks tomorrow?**
  Follow-up: If you say longevity, how many years of stability are required to transition from regularity to law?

  9. **If history follows laws, is moral responsibility diminished since actors are following trajectories?**
  Follow-up: If you say no, how do you reconcile human freedom with deterministic historical laws?
