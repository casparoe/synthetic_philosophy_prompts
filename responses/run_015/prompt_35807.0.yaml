answer: |-
  You have put your finger on one of the most robust, well-documented, and frustrating realities in skill acquisition. You are not imagining it, and you are not alone.

  There is no single, canonical Latin term that acts as a perfect container for this specific phenomenon (a skilled practitioner's confident but factually false self-report that successfully transmits skill). However, it sits at the intersection of three major fields: **Philosophy of Mind** (Tacit Knowledge), **Motor Learning Science** (External Focus), and **Pedagogy** (Scaffolding).

  Here is the breakdown of the existing concepts, how they relate to your "Knowing How/That" distinction, and a proposed term to define the edges of what you are seeing.

  ### 1. The Existing Framework

  **A. Tacit Knowledge (Michael Polanyi)**
  The philosophical foundation is Polanyi's maxim: *"We can know more than we can tell."*
  When you float, you are engaging in **Tacit Knowledge**. Your body is managing buoyancy, lung volume, and spinal alignment unconsciously. When a student asks "What are you doing?", your conscious mind tries to translate that unconscious process into language (Explicit Knowledge). In doing so, it often grabs the most salient *feeling* (head sinking) rather than the mechanical *cause* (lower back extension).
  *   **Relation to your question:** This explains *why* the report is false. You aren't lying; you are reporting your *conscious experience*, not your *biomechanics*.

  **B. External Focus of Attention (Gabriele Wulf)**
  This is the scientific explanation for *why the false cue works*. Decades of motor learning research show that instructions focusing on the **effect** of the movement (e.g., "push the water back," "let the head sink") are vastly superior to instructions focusing on the **body mechanics** (e.g., "extend the lumbar," "rotate the shoulder").
  *   **Relation to your question:** Your instruction ("let the head sink") is an *External Focus* cue. It works *because* it bypasses the student's tendency to micromanage their muscles. The fact that it is biomechanically false regarding your own body is irrelevant; it is functionally true for their attention.

  **C. Expertise Reversal / The Curse of Knowledge**
  Experts often suffer from "amnesia" regarding the novice experience. You no longer feel the tension in your neck because you solved it years ago. When you try to describe the solution, you describe the *last thing you fixed* (the head), not the *root cause* (the back).

  ### 2. Coining the Term: "Functional Falsehood"

  Since you asked for a term to define the edges of this, I propose we call this a **Functional Falsehood** (or more technically, a **Phenomenological Proxy**).

  **Definition:** A verbal instruction that is factually incorrect regarding the instructor's biomechanics or the causal chain of the skill, but functionally correct regarding the attentional focus required for the student to acquire the skill.

  **The Edges (What counts and what doesn't):**

  *   **Simplification vs. Falsehood:**
      *   *Simplification:* "Keep your back straight." (Technically, the spine has curves, but this is a close enough approximation). **Not** a Functional Falsehood.
      *   *Falsehood:* "Press harder on the frets as you go up the neck." (Physically untrue; efficiency increases, force stays same or drops). **Is** a Functional Falsehood.
      *   *Boundary:* If the instruction describes a physical reality that *could* be measured and is found absent, it is a Functional Falsehood. If it is just vague, it is simplification.

  *   **Metaphor:**
      *   "Hold the club like a small bird." **Is** a Functional Falsehood (you aren't holding a bird). However, metaphors are usually understood as figurative. Your swimming example is distinct because it is presented as a *literal description of the teacher's body* ("I let my head sink").
      *   *Boundary:* Functional Falsehoods are often presented as literal mechanics, whereas metaphors are presented as imagery. Both function similarly, but the "false self-report" you noticed is the specific subset where the teacher believes (or claims) they are describing mechanics.

  *   **Non-Physical Skills:**
      *   *Therapy/Negotiation:* A senior negotiator might tell a junior, "I waited to speak because I wanted to show patience." In reality, they waited because their cognitive load was high and they needed to think. If the junior mimics the waiting and learns patience, the false report transmitted the skill.
      *   *Boundary:* Yes, this applies to cognitive skills where the *stated intent* differs from the *actual cognitive process* but yields the correct behavior.

  ### 3. Relation to "Knowing How" vs. "Knowing That"

  You mentioned Gilbert Ryle's distinction. Here is how the **Functional Falsehood** fits in:

  *   **Knowing How:** The teacher has this (the ability to float).
  *   **Knowing That:** The teacher attempts to generate this (the proposition "I sink my head").
  *   **The Glitch:** Usually, we assume "Knowing That" is a truthful map of "Knowing How." Your observation proves the map can be false and still navigate successfully.
  *   **The Mechanism:** The False "That" does not describe the *terrain* (the body); it describes the *compass heading* (the attention).
  *   **Conclusion:** The Functional Falsehood is not an attempt to describe the *mechanics* (Knowledge That about the body); it is a **Key** to unlock the student's *Knowledge How*. It is a tool, not a description.

  ### 4. Why It Works (It's Not a Placebo)

  You asked if this is just a placebo. It is not. A placebo relies on belief in the *treatment*. This relies on **Constraint-Led Action**.

  When you tell a student "Let your head sink," you are not giving them a mechanical order. You are removing a constraint.
  1.  **Novice State:** The student is holding their head up. This creates tension. Tension sinks the body.
  2.  **The Cue:** "Let the head sink."
  3.  **The Result:** The student stops fighting gravity with their neck.
  4.  **The Hidden Mechanism:** Once the neck tension is gone, the body's natural buoyancy and the teacher's actual mechanism (lower back extension) can finally engage.

  The false cue works because it **disables the interference** (neck tension) rather than **enabling the mechanism** (back extension). It is easier to tell a panicked system "Stop doing X" (even if X isn't the whole story) than "Start doing Y" (which requires coordination they don't have yet).

  ### Summary for Your Teaching

  You are practicing **Phenomenological Proxying**.
  *   **The Phenomenon:** Skilled practitioners report their *conscious intent* or *sensory focus*, not their *biomechanical reality*.
  *   **The Value:** These reports are optimized for *communication*, not *accuracy*. They are "lossy compression" files of the skill that the student's brain can actually open.
  *   **The Risk:** If a student becomes an expert and tries to teach using only these false reports, the lineage drifts. (This is why martial arts forms change over generations).
  *   **The Fix:** Keep using the Functional Falsehoods for novices (they work). But for advanced students, or when filming yourself for peer review, switch to **Biomechanical Truth**.

  You aren't lying. You are translating poetry (the feeling of floating) into prose (instructions), and in translation, some truth is always lost. As long as the poem still makes the student swim, the translation is successful.
