  ### Part 1: Expert Analysis & Philosophical Grounding

  Before you present the memo, you need to understand the terrain you are walking on. The committee's discomfort is not just "feelings"; it touches on well-documented phenomena in organizational psychology and ethics. However, there is a difference between what is empirically settled and what is ethically contested.

  **1. What is Settled (Organizational Psychology & Management Science)**
  *   **Implicit Norms Trump Explicit Values:** Culture is defined by what is rewarded, not what is written on the wall. If you reward Dan's *sacrifice* (late nights, weekend work) rather than his *output*, you implicitly mandate that sacrifice.
  *   **Citizenship Pressure:** There is robust evidence that "Organizational Citizenship Behavior" (OCB)—helping others, going beyond job descriptions—can become coercive. When one person sets a high OCB baseline, peers feel pressured to match it to avoid looking bad, leading to collective burnout.
  *   **The Visibility Paradox:** Employees who focus exclusively on work without self-advocacy are statistically less likely to be promoted. Rewarding Dan publicly helps correct this specific inequity for him, but does not fix the system that created it.
  *   **Sustainability:** High performance that relies on individual heroics is not scalable. It creates single points of failure (if Dan burns out, who reviews the PRs?).

  **2. What is Contested (Ethics & Philosophy)**
  *   **Supererogation vs. Duty:** In ethics, *supererogatory* acts are good but not required (e.g., running into a burning building). There is debate over whether workplaces should reward supererogation.
      *   *Side A:* Rewarding it encourages excellence and altruism.
      *   *Side B:* Rewarding it blurs the line between "extraordinary" and "expected," effectively raising the job requirements without changing the job description.
  *   **Paternalism vs. Autonomy:** Does the company have a right to tell Dan to work less?
      *   *Side A:* Yes, because his behavior harms the ecosystem (the team).
      *   *Side B:* No, that is policing his autonomy and generosity.
  *   **The "Martyr" Effect:** Is it better to deny the award to signal that boundaries are valued, or give the award to signal that contribution is valued? There is no consensus on which signal is stronger.

  **Strategy for the Memo:**
  The memo below takes the position that **denying the award is the greater risk.** It validates cynicism ("values are fake"). However, it mitigates the "toxic virtue" risk by explicitly decoupling the *value* (collaboration/excellence) from the *unsustainable method* (no boundaries). It recommends awarding Dan for his **impact**, while simultaneously launching a parallel initiative to protect him and the team from the **cost** of that impact.

  ***

  ### Part 2: Recommendation Memo

  **TO:** People & Culture Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation re: Q3 'Living Our Values' Award (Candidate: Dan)

  #### Executive Summary
  I recommend we **proceed with awarding** the Q3 'Living Our Values' recognition to Dan. However, I strongly advise that we alter the **framing of the citation** and pair the public recognition with **private structural support**.

  Denying the award risks validating the cynicism that our values are decorative. However, awarding it without context risks normalizing unsustainable work habits. We can navigate this by rewarding the *outcome* of Dan's behavior (team enablement, code quality) rather than the *cost* (hours worked, personal sacrifice).

  #### The Core Tension
  The committee's debate highlights a critical maturity point for our culture. We are grappling with two valid concerns:
  1.  **Integrity:** If an employee demonstrably embodies our stated values more than any peer, denying them the award suggests our values are conditional.
  2.  **Sustainability:** Dan's specific *methods* (24/7 availability, refusal of credit) rely on personal sacrifice that is not scalable and may induce guilt in peers who maintain healthy boundaries.

  #### Analysis of Risks
  *   **Risk of Denial:** High. It signals that "Living Our Values" actually means "Living Our Values *within reasonable corporate boundaries*." This undermines trust in leadership and punishes high performers who take our cultural statements literally.
  *   **Risk of Award:** Moderate, but manageable. The concern is "citizenship pressure"—that peers will feel compelled to mimic Dan's lack of boundaries to compete. This risk is mitigated entirely by *how* we describe his win.

  #### Recommendation: The "Sustainable Excellence" Framework
  We should give Dan the award, but we must curate the narrative. We are not rewarding "working late"; we are rewarding "unblocking the team."

  **1. Public Citation (The Narrative)**
  The announcement must focus on **leverage and enablement**, not hours or sacrifice.
  *   *Avoid:* "Dan stayed late to fix everything," "Dan never says no."
  *   *Use:* "Dan ensured the team shipped with confidence," "Dan elevated our code quality," "Dan mentored juniors to independence."
  *   *Goal:* Signal that the value is **collaboration**, not **martyrdom**.

  **2. Private Intervention (The Support)**
  Simultaneously, Dan's manager (with P&C support) must address the career and boundary risks:
  *   **Promotion Path:** Dan is being passed over due to low visibility. This award serves as documented evidence of his impact for his next promotion packet. We must ensure his manager explicitly connects this award to his career progression.
  *   **Boundary Enforcement:** Leadership should privately encourage Dan to delegate more. If Dan is the only one who can fix certain debt, that is a bus-factor risk, not a virtue. We should frame "taking time off" as a requirement for his continued effectiveness.

  **3. Systemic Follow-up (The Culture)**
  Use this moment to reiterate our stance on boundaries. In the all-hands meeting where Dan is recognized, leadership should add a standard reminder: *"Dan's impact is incredible. Please note that you do not need to replicate his hours to be valued here. We value sustainable high performance."*

  #### Conclusion
  If we refuse to reward Dan because he is "too good," we admit our values are merely marketing. If we reward him without context, we risk burnout culture. The middle path is to honor his contribution while explicitly defining the *sustainable* version of that contribution as the true standard.

  **Action Required:** Approval to proceed with award, contingent on Marketing/Comms aligning on the citation language described above.

  ***

  ### Part 3: Notes for Q&A (For Your Preparation)

  When you present this, expect pushback. Here is how to handle the specific philosophical objections based on the analysis in Part 1.

  **If someone says:** *"Giving this award tells juniors they need to work weekends to get recognized."*
  **You say:** *"That is exactly why we are controlling the citation language. If we highlight his code quality and mentorship, we reward skill. If we highlight his 11 PM PR reviews, we reward hours. We control the norm by choosing what we praise."*

  **If someone says:** *"Dan is hurting his own career by not self-promoting. Should we reward a strategy that fails?"*
  **You say:** *"This award is the intervention. It provides the external visibility his manager needs to promote him. Denying the award punishes him twice: once for not self-promoting, and again by withholding the bonus/recognition he earned."*

  **If someone says:** *"It's 'toxic virtue.' It makes everyone else feel bad."*
  **You say:** *"Psychologically, guilt comes from comparison. If we frame Dan as a 'saint' who sacrifices everything, yes, it creates guilt. If we frame him as a 'force multiplier' who makes the team better, it creates aspiration. We have the power to choose the frame."*

  **If someone asks:** *"Are we saying it's okay to work that much?"*
  **You say:** *"We are saying it's not our place to police an adult's voluntary time management, provided they are healthy. But we are responsible for ensuring the *team* doesn't feel coerced to match it. That's why the 'Sustainable Excellence' framing is non-negotiable."*
