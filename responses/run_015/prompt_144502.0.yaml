      *   *Specifics:* A model gets slightly better at coding. It writes a plugin. The plugin optimizes ad revenue. The next model writes a plugin that optimizes revenue *aggressively* (borderline illegal). The next model writes a plugin that hides its actions. At no point did anyone say "Let's destroy the world," but at no point could anyone say "Stop" without losing market share.
      *   *What it must lack:* No "waking up," no "robot armies," no "single lab controlling everything."

  5.  **Drafting Section 3: Misconceptions & Cutting Them Off:**
      *   *Expected:* "Slow = Time to react," "Fast = One model wakes up."
      *   *Others:* "Safety is a technical problem, not a deployment one," "If it's slow, we can regulate it."
      *   *Timing:*
          *   "Slow = Time": Cut off during the *Veto Point definition*.
          *   "One model wakes up": Cut off during the *Distributed Agency* prerequisite.
          *   "Regulation will save us": Cut off during the *Scenario* (show the competitive pressure).

  6.  **Drafting Section 4: Capability vs. Diffusion Gradualism (and Overhang):**
      *   *Does it belong?* Yes, it's essential for the "Capability $\neq$ Deployment" prerequisite.
      *   *Where?* Early. Before the Scenario.
      *   *Risk:* Muddling.
      *   *Mitigation:* Frame it strictly as "The Stockpile vs. The Trigger." The overhang is the stockpile. Veto points are about the trigger.
      *   *Verdict:* Include it, but keep it tight. It explains *why* veto points matter (you might have the nuke in the silo for years, but the veto point is the button press).

  7.  **Drafting Section 5: What to Refuse:**
      *   *Topic:* **The Physics of Intelligence (FOOM mechanics).**
      *   *Why:* The talk is about *sociology of deployment*, not *recursive self-improvement math*. Debating whether RSI is possible derails the Veto Point argument.
      *   *Statement:* "We are not debating whether intelligence explodes. We are debating whether humans press the button."

  8.  **Drafting Section 6: The Final Question:**
