      *   **Core Insight:** A 15-year takeoff can have *fewer* veto points than a 15-month takeoff if every step is defensible/competitive and "stop" is never a live option.
      *   **Deliverables:**
          1.  Prerequisites/Dependency Order (Capability $\neq$ Rate, Capability $\neq$ Deployment, etc.).
