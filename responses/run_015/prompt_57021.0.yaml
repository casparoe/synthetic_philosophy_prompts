answer: |-
  1. Does the normative authority of the geometric growth criterion depend essentially on proportional scalability and continuous reinvestment, rather than on ergodicity alone? This is settled by demonstrating whether maximising geometric growth diverges from rational preference in structured environments where stakes are lumpy, wealth is partially illiquid, or payoffs are additive rather than multiplicative. A formal boundary condition must be identified.

  2. Proponents of ergodicity economics correctly identify time-averages but assume unrestricted betting fractions. Defenders of expected utility correctly note the logarithmic equivalence but treat it as a preference constraint rather than an environmental theorem. Both leave undetermined how restricted scalability alters the rationality of geometric maximisation, assuming the verdict holds uniformly across betting environments.

  3. I will construct formal models of non-scalable betting environments to derive conditions where geometric maximisation fails to optimise long-run welfare. Mere simulation cannot establish normative boundaries, and conceptual analysis alone cannot quantify the divergence. Formal derivation is required to prove precisely when the equivalence theorem breaks down under structural constraints.

  4. Success entails a theorem specifying the structural conditions under which the geometric criterion loses its normative force, thereby contextualising the dispute. Failure would result if the equivalence holds robustly despite scalability restrictions, or if the derived conditions are too trivial to inform the philosophical debate about rational choice under risk.

  5. Eighteen months part-time permits only limited model classes; I may not generalise sufficiently beyond simple cases. The weak point is assuming scalability is the primary driver: if logarithmic utility emerges as robustly optimal even in lumpy environments via dynamic programming, the question closes prematurely. If the mathematics proves intractable without unrealistic simplifications, this route is dead.
