answer: |-
  It is a pleasure to engage with a colleague who understands that a number without an error budget is just a story. Your intuition about "provenance" is not merely stubbornness; it maps onto a sophisticated and growing area of decision theory concerning *epistemic risk* and *imprecise probabilities*. You are effectively treating the probability estimate itself as a measurement with systematic uncertainty, where the "adversarial selection" introduces a systematic error that swamps the statistical one.

  Per your request, I will avoid citations and reading lists. I will separate the mathematical settledness from the philosophical contention, propose a principle that captures your intuitions, and apply it to your specific cases.

  ### Part 1: Settled Mathematics vs. Contested Philosophy

  Before we build a principle, we must clear the ground regarding what is fact and what is opinion in this field.

  **Settled Mathematics:**
  1.  **Expected Utility Theory (EUT):** If you accept the standard axioms of rational choice (completeness, transitivity, continuity, and independence), you must maximize expected utility.
  2.  **Fanaticism:** If your utility function is *unbounded* (there is no limit to how good or bad an outcome can be) and you assign *any* non-zero probability to a hypothesis, then sufficiently large stakes will always dominate the calculation. This is a mathematical theorem. If you reject the conclusion (Pascal's Mugging), you must reject at least one premise (usually unbounded utility or the strict application of probabilities to testimony).
  3.  **Separability:** In standard theory, if you prefer Option A over Option B in a single instance, you must prefer a portfolio of 10,000 A's over a portfolio of 10,000 B's, assuming independence. Your verdict on Case 8 (Single vs. Portfolio) violates this axiom.

  **Contested Philosophy:**
  1.  **Bounded Utility:** The standard textbook fix for Pascal's Mugging is to say utility *must* be bounded (e.g., saving a billion lives is not a billion times better than saving one). Many philosophers find this "crude," as you do, because it implies indifference to large-scale catastrophes once a certain threshold is passed. There is no consensus that this is the *correct* normative fix, only that it is the *mathematically convenient* one.
  2.  **Epistemic Constraints:** There is active debate over whether we are permitted to discount probabilities based on *how* they were generated (your "provenance" idea). Some argue probability is probability, regardless of source. Others (aligning with you) argue that probabilities derived from adversarial testimony carry "Knightian uncertainty" (ambiguity) that justifies ignoring them.
  3.  **Act vs. Policy:** There is disagreement on whether we should evaluate individual acts or general policies. Your intuition on Case 8 suggests you are evaluating policies in the portfolio case but acts in the single case.

  ### Part 2: Candidate Principles

  Here are three candidate principles that could organize your verdicts. I will evaluate them before selecting the best one.

  **Candidate 1: The Bounded Utility Principle**
  *   **Rule:** Assign a maximum cap to the value of any outcome (e.g., the value of all human lives). Calculate expected value normally.
  *   **Fit:** Handles the Mugger escalation (Case 7). Handles the $1M vs. $3M (Case 2).
  *   **Mismatch:** Fails your "Provenance" intuition. It treats the extinction model (Case 4) and the Mugger (Case 6) identically if the stakes are high enough. It also forces you to be "weirdly calm" about large losses, which you explicitly rejected.

  **Candidate 2: The Probability Threshold Principle**
  *   **Rule:** Ignore any probability below a fixed floor (e.g., $10^{-9}$). Treat it as zero.
  *   **Fit:** Handles the Mugger (Case 6). Handles the Single Lottery Ticket (Case 8).
  *   **Mismatch:** Fails the Extinction Risk (Case 4), which is $10^{-9}$ per century. If your threshold is high enough to stop the Mugger, it might also stop the physics-based extinction risk. It also doesn't explain why the Portfolio (Case 8) becomes acceptable.

  **Candidate 3: The Principle of Epistemic Grounding and Policy Separation**
  *   **Rule:** Expected value calculations are only valid when two conditions are met:
      1.  **Epistemic Independence:** The probability estimate must be generated by a causal process (model, data, physical law) that did not "know" about the specific decision rule you are using to evaluate it. (This targets adversarial selection).
      2.  **Policy Coherence:** For repeated, low-stakes structural decisions, evaluate the *policy* (portfolio). For unique, high-stakes existential decisions, evaluate the *act*, but apply Epistemic Independence strictly.
  *   **Fit:** Captures the "Provenance" distinction (Case 4 vs. Case 6). Explains the Portfolio intuition (Case 8) as a shift from Act to Policy.
  *   **Mismatch:** Requires you to overturn the mathematical axiom of Separability (Case 8), admitting that rationality might be frame-dependent.

  ### Part 3: The Recommended Principle

  I recommend **Candidate 3**. It best respects your background as a physicist. In your field, a number derived from a fit that was tuned to the signal is worthless; a number derived from a blind analysis is gold. You are applying "blind analysis" standards to decision theory.

  Here is the principle stated precisely, with clauses tied to your verdicts:

  **The Principle of Epistemic Grounding**
  *An agent should maximize expected value only when the probability estimates satisfy the **Grounding Condition**. If the Grounding Condition fails, the probability is treated as indeterminate (effectively zero for decision purposes).*

  **The Grounding Condition has two clauses:**

  1.  **Causal Independence (Motivated by Case 6 & 7 vs. Case 4):**
      The probability estimate must be derived from a model or data set that was constructed *prior to* and *independently of* the specific payoff structure offered in the decision.
      *   *Application:* The extinction risk model (Case 4) was built to understand physics, not to solicit money. It passes. The Mugger (Case 6) chose the stake *because* of your decision rule. It fails.

  2.  **Intent Verification (Motivated by the Server Farm Case):**
      If the probability depends on the future intent of an agent (e.g., "will they switch it on?"), that intent must be verified by mechanisms independent of testimony. Testimony alone, when stakes are adversarial, carries unbounded systematic error.
      *   *Application:* Even if the servers work, the *intent* to use them for suffering is testimony. Since the stake ($10^{30}$) is chosen to defeat your rule, the intent is suspect. It fails.

  **The Policy Exception (Motivated by Case 8):**
  *For decisions that are structurally identical and repeatable (a portfolio), evaluate the expected value of the **policy** of accepting such bets, rather than the individual act. For unique existential decisions, evaluate the act.*
  *   *Application:* A single lottery ticket (Case 8) looks like a gamble (Act). A portfolio of 10,000 looks like a research funding strategy (Policy). If the "Provenance" of the odds is grounded (e.g., a scientific lottery), the Policy can be positive even if the single Act feels psychologically untenable.

  ### Part 4: Judgment on the Target Case

  **The Case:** Server farm simulation threat. $5,000 cost. Mechanism verified (physics/cost). Intent unverified (testimony only). Stake adversarial ($10^{30}$).

  **Verdict:** **Decline.**

  **Reasoning:**
  While the *mechanism* passes the Causal Independence clause (the engineering is real), the *intent* fails the Intent Verification clause. The probability that they will actually run the simulation depends entirely on their testimony. Because the stake ($10^{30}$) was explicitly chosen to defeat decision rules (adversarial selection), the testimony regarding intent is contaminated.

  In your terms: The "systematic error" on the probability of their intent is 100%. You cannot bound the probability that they are bluffing, because the bluff is incentivized by the magnitude of the stake. Therefore, the number is a "hope," not a measurement. You treat the probability as zero.

  ### Part 5: Refused and Overturned Verdicts

  No principle fits every gut intuition without cost. Here is where the **Principle of Epistemic Grounding** demands you change your mind.

  **1. The Verdict to Overturn: Case 8 (Portfolio vs. Sequential)**
  *   **Your Intuition:** Yes to Portfolio, No to Sequential.
  *   **The Principle's Demand:** If the single ticket fails the Grounding Condition (because the probability is not model-based but arbitrary), the portfolio must *also* fail. You cannot turn 10,000 ungrounded hopes into one grounded measurement simply by bundling them.
  *   **Correction:** If the $10^{12}$ probability is just a number printed on a ticket (like a state lottery), you should reject *both* the single ticket and the portfolio. If, however, the probability comes from a grounded scientific model (like the extinction risk), you should accept *both*. The packaging should not matter. Your intuition here is likely driven by *risk pooling* psychology, not decision-theoretic rationality. I recommend aligning these: if the provenance is weak, reject the portfolio.

  **2. The Verdict to Re-examine: Case 5 (4 Identifiable Lives)**
  *   **Your Intuition:** No to saving 4 lives, Yes to extinction risk (even with similar expected lives).
  *   **The Principle's Demand:** This verdict is actually *consistent* with the principle if you view the extinction risk as "Grounded" (model-based) and the rescue of 4 lives as "Ungrounded" (testimony/identifiable victim effect). However, standard ethics suggests certain lives should weigh heavier than probabilistic ones.
  *   **Correction:** I will not force you to overturn this, as it reflects a *value* judgment (prioritizing existential security over identifiable victims) rather than a probability error. However, be aware that this makes you a "Longtermist" by trade, not just by calculation. You are prioritizing the *quality of the probability* over the *certainty of the outcome*.

  ### Part 6: The Discriminating Case

