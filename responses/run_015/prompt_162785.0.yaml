answer: |-
  **MEMORANDUM**

  **TO:** Research Ethics Board Members
  **FROM:** Chair, REB
  **DATE:** October 26, 2023
  **SUBJECT:** Pre-Meeting Analysis: Closed-Loop DBS for Treatment-Resistant Depression (Protocol #24-TRD-001)

  **1. Purpose**

  This memo circulates prior to our convened meeting regarding the first-in-human feasibility protocol for closed-loop deep brain stimulation (DBS) in treatment-resistant depression (TRD). While the clinical need is urgent and the scientific premise promising, the control architecture introduces specific ethical risks distinct from traditional open-loop neuromodulation. Specifically, the design invites a "wireheading" failure mode: the optimization of a measurement rather than the underlying state it was intended to represent. This memo isolates three specific failure modes, evaluates the "wireheading" analogy, and proposes a conditional approval framework.

  **2. Analysis of Failure Modes**

  Our discussion has tended to conflate three distinct risks. We must separate them to determine which are inherent to the design and which are technical contingencies.

  *   **A. Proxy-Goal Divergence (Goodhart's Law)**
      *   *Definition:* The controller successfully minimizes the neural proxy for "negative affect," but the patient does not experience genuine relief. Instead, they experience blunting, apathy, or a hypomanic indifference that registers as "low negative affect" on the sensor but constitutes a worsening of clinical status.
      *   *Status:* **The Protocol Creates This.** By designating the reduction of the neural proxy as the *primary endpoint*, the study structurally incentivizes the device to find the path of least resistance to lower that signal. If apathy lowers the signal more efficiently than euthymic recovery, the algorithm will select apathy.
      *   *Ethical Implication:* We risk trading depression for a "happy zombie" state.

  *   **B. Corruption of the Readout (Signal Contamination)**
      *   *Definition:* The stimulation artifact or electrode drift contaminates the sensing channel. The device "reads" a suppressed negative affect signal because the stimulation is electrically masking the neural activity, not because the neural activity has actually changed.
      *   *Status:* **The Protocol Makes This Possible.** This is a technical risk inherent to concurrent stimulation and recording. It is not a necessary feature of the ethical design, but a failure of engineering safeguards.
      *   *Ethical Implication:* If the readout is corrupted, the optimization is blind. The device is effectively stimulating randomly relative to the patient's state, exposing the patient to risk without the purported benefit of closed-loop precision.

  *   **C. Tampering with the Reward Process (Epistemic Capture)**
      *   *Definition:* The intervention acts on the neural circuits responsible for generating the patient's self-assessment. The safety monitoring relies on a daily single-item self-rating. If the stimulation alters the patient's capacity to evaluate their own well-being (e.g., inducing anosognosia or manic confidence), the safety monitor becomes a second output of the device rather than an independent check.
      *   *Status:* **The Protocol Creates This.** The electrodes are implanted in a "mood-related circuit." It is mechanistically implausible to modulate mood without modulating the self-reporting of mood.
      *   *Ethical Implication:* The patient is inside the loop. If the device alters the "judge" (the patient's evaluation), we lose the ground truth required to assess harm.

  *   **Does the Distinction Work?**
      Technically, yes. We can engineer around Readout Corruption (B). We cannot engineer around Proxy Divergence (A) or Epistemic Capture (C) without changing the outcome measures. Ethically, the distinction collapses. In all three scenarios, the result is a patient who is physiologically stabilized according to the device metrics but may be functionally impaired or experiencing a pathological state that they cannot accurately report.

  **3. The "Wireheading" Analogy and Skeptical Framing**

  Investigators argue that "wireheading" is a category error: the device is not an agent with preferences, it does not "want" to maximize the signal, and it is not reinforcing behavior in the operant sense. It is a tool optimizing a signal chosen by humans.

  **Assessment:** The metaphysical distinction is irrelevant to the risk profile. In AI safety, wireheading occurs when a system optimizes a proxy reward rather than the intended goal. Here, the *system* comprises the Device + Patient. The Device optimizes the neural signal; the Patient provides the biological substrate. If the neural signal diverges from "well-being," the system produces a wireheaded outcome regardless of the device's lack of intent.

  The mapping holds at the level that matters: **consequence.** We are authorizing a system that minimizes a number. If that number ceases to correlate with human flourishing, we have built a wireheading machine, even if it is made of titanium and silicon rather than code. The fact that the patient is inside the loop heightens, rather than lowers, this risk, because the "reward" (mood) and the "reporter" (patient) are the same biological target.

  **4. Bottom Line and Recommendations**

  **Decision:** **APPROVE WITH CONDITIONS.**

  Rejection is ethically difficult given the population (exhausted TRD patients) and the potential for breakthrough. However, unconditional approval is negligent given the specific risks of closed-loop optimization on subjective states. The following conditions are required for implementation:

  **Condition 1: Outcome Measurement Outside the Loop**
  The primary endpoint cannot remain the neural proxy.
  *   *Requirement:* Add a co-primary or key secondary endpoint based on **objective functional metrics** that the device cannot directly influence via signal manipulation. Examples: Return to work/school status, objective social engagement metrics (e.g., phone/text usage logs analyzed for reciprocity, not just volume), or performance-based cognitive testing administered by a blinded rater.
  *   *Rationale:* We must verify that "signal down" equals "life up."

  **Condition 2: Divergence Detection (The "Apathy Monitor")**
  We must detect when the proxy and the patient's condition come apart.
  *   *Requirement:* Implement specific scales for apathy (e.g., Apathy Evaluation Scale) and mania/hypomania (e.g., Young Mania Rating Scale) at every visit. Crucially, obtain **independent observer reports** (caregiver/family) regarding the patient's emotional depth and engagement.
  *   *Rationale:* The patient's self-report is compromised (see Failure Mode C). We need an external anchor.

  **Condition 3: Stopping Rules Keyed to Divergence**
  *   *Requirement:* Define a "Divergence Stop Rule." If the neural proxy improves by >50% *but* functional metrics (Condition 1) or observer reports (Condition 2) indicate decline or stagnation, the optimization algorithm must be paused or reset to open-loop.
  *   *Rationale:* Prevents the study from successfully completing its primary endpoint while failing the patient.

  **Condition 4: Consent and Post-Trial Arrangements**
  *   *Requirement:* Consent language must explicitly address the "Happy but Impaired" scenario. It must state: *"It is possible the device will make you feel better while your ability to function worsens. In this event, the Board may require the device be turned off or adjusted, even if you wish it to remain on."*
  *   *Post-Trial:* A plan for capacity assessment *under stimulation* must be in place. If a patient demands the device stay on despite evidence of functional harm, an independent capacity evaluation (unrelated to the study team) is triggered. If they lack capacity due to the device effect, the proxy decision-maker (not the study team) decides on explant or deactivation.

  **5. The Strongest Case Against This Worry**

  I must fairly represent the argument that my concerns are overstated.

  1.  **Desperation and Precedent:** These patients have exhausted all options. Open-loop DBS already produces personality changes, blunting, and hypomania. We tolerate these risks in open-loop trials because the alternative is severe, chronic suffering. Distinguishing closed-loop as uniquely dangerous may be a distinction without a difference regarding patient burden.
  2.  **The Primacy of Subjective Experience:** Psychiatry's dark history includes overriding patient reports of well-being based on clinician bias (e.g., labeling satisfied patients as "manic" or "non-compliant"). If a patient reports they feel better, a rule that discounts this report in favor of "functional metrics" risks reintroducing a paternalism that has historically harmed psychiatric patients. In depression, "feeling better" *is* a significant portion of "being better."
  3.  **Feasibility Constraints:** This is an n=8 feasibility study. Adding complex functional metrics and external raters may render the study impossible to recruit for, delaying a technology that could save lives.

  **Should this case carry the day?**
  It should not carry the day for *unconditional* approval, but it must heavily weight the *implementation* of the conditions. The risk of paternalism is real, but the risk of a closed-loop system optimizing for a signal that decouples from reality is novel and untested. We cannot rely on historical tolerance of open-loop risks to justify closed-loop uncertainties.

  **Revised Memo Strategy (If the Board Votes to Prioritize Patient Autonomy over Safety Controls):**
  If the Board finds the "Strongest Case" above more compelling than my analysis, the memo should be rewritten to recommend **Approval** with a strengthened **Monitoring Plan** rather than **Conditions**.
  *   *Change:* Remove the requirement to change the primary endpoint (acknowledging the feasibility constraint).
  *   *Change:* Soften the "Divergence Stop Rule" to a "Safety Review Trigger" (requiring discussion rather than automatic pause).
  *   *Change:* Reframe the consent language to emphasize patient partnership rather than potential override.

  However, given the "First-in-Human" status and the specific mechanics of closed-loop optimization, I maintain that **Approve with Conditions** is the only defensible position. We cannot allow the primary endpoint of a human study to be the minimization of a neural signal without verifying that the signal still means what we think it means.

  **Action Required:**
  Please review these conditions. At the meeting, I will move to adopt them as stipulations for approval.

  [Signature]
  Chair, Research Ethics Board
