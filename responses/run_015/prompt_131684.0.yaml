      *(Self-Correction during drafting)*: Wait, I should check if Hume explicitly mentions reversibility. He does not. He focuses on the *power* to alter matter. "I have the same power to alter the motion of matter in my own body as in a river." That's the quote essence. So the friend's objection is external to the text. The user's worry about importing modern concepts is well-founded but their intuition about "no wronged party" aligns better with Hume's *social* argument, not the *nature* argument. I need to make that distinction clear.

