  Observer A remains on Earth while Observer B travels away from Earth toward Andromeda, currently located light-years distant at constant velocity $v$. A contemplates a free decision $x$ to send a message tomorrow (Earth-time), which A regards as ontologically open relative to their present moment $z$. However, due to the relativity of simultaneity over the vast spatial separation, B calculates that $x$ is simultaneous with B's current present moment $y$ in B's inertial frame. B invokes the 'frame-transitive reality' condition: since $x$ is simultaneous-and-co-real with $y$ in B's frame, and $y$ is co-real with $z$ (via their shared departure event in a prior frame), $x$ and $z$ must be co-real period. Consequently, B concludes A's decision is already fixed, while A insists their choice remains genuinely open, creating a direct ontological conflict over the status of $x$.

  (1) **Block-universe/Eternalist Verdict:** Both reasonings are partially correct descriptions of a single, fixed four-dimensional manifold. A's sense of "openness" is merely epistemic (ignorance of the block), not ontological. B's reasoning correctly identifies that $x$ exists tenselessly within the block, just as $z$ does. There is no contradiction, only a difference in perspective on the same static reality.

  (2) **Presentist Verdict (Rejecting Frame-Transitive Reality):** The presentist denies the premise that simultaneity implies co-reality. They argue that "co-real" applies only to events on the unique, privileged present hypersurface. Since simultaneity is frame-relative, it cannot determine existence. B's calculation is merely a coordinate artifact, not an ontological discovery. A's future is unreal, regardless of B's frame.

  (3) **Presentist Verdict (Accepting Frame-Transitive Reality):** Presentism collapses into eternalism. If co-reality transfers transitively across frames via simultaneity, then A's future ($x$) becomes co-real with A's present ($z$). This violates the core presentist tenet that only the present exists. The distinction between "fixed" and "open" vanishes, forcing the presentist to admit the future is already real.

  (4) **Feature Doing the Work & Separation Collapse:** The work is done by the spatial separation term ($\Delta x$) in the Lorentz transformation for time ($\Delta t' = \gamma(\Delta t - v\Delta x/c^2)$). The simultaneity shift depends entirely on distance. If we shrink the separation from Andromeda-scale to a local lab ($\Delta x \to 0$), the time shift vanishes. B would then agree that A's tomorrow is in the future, the transitive chain breaks, and the argument for a fixed future collapses. **Note on the Typo:** Your spec sheet contains a geometric typo: for B to push A's Earth-bound future into B's present, B must already be *distant* from Earth (light-years away), not merely "on a ship heading toward Andromeda" which implies departure from Earth. The classic paradox places the *event* at Andromeda; your setup places the *observer* at Andromeda-distance. Both work, but B must be far from A for the physics to hold.

  **Presentist Defender's Attack:** A presentist defender attacks the "frame-transitive reality" condition itself, labeling it a category error. They argue that existence is absolute, but simultaneity is conventional. Just because two events are assigned the same time-coordinate in a specific frame does not mean they share the same ontological status. They would reject the inference from "simultaneous-in-frame-F" to "co-real," insisting that only the local present is real, rendering B's distant simultaneity judgment ontologically inert.
