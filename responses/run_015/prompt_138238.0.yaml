  # Is the Brain a Computer? A Decision Tree for Graduate Study

  This handout maps the logical space of the "brain-as-computer" debate. It does not survey authors; it structures the **commitments** that generate the doctrines. Start at the root and answer the questions based on your intuitions about concrete cases. Your path leads to a specific theoretical doctrine.

  ### The Decision Tree

  **Q1. The Triviality Check**
  *Case:* A rock heats up in the sun. We can map its temperature states to the states of a WordStar word processor.
  *Question:* Does the brain compute merely because *some* mapping exists (like the rock), or because it computes the *specific function* that explains its behavior (e.g., edge detection)?
  *   **Any mapping suffices** → **Leaf 1: Pancomputationalism**
  *   **Specific function required** → Go to Q2.

  **Q2. The Reality Check**
  *Case:* We have a perfect equation predicting neural firing from stimuli, but "computation" adds no causal power over biophysics.
  *Question:* Is "computation" a **real causal mechanism** in the brain, or just a **useful vocabulary** (eliminable in favor of neural laws)?
  *   **Just vocabulary** → **Leaf 2: Computational Instrumentalism**
  *   **Real causal mechanism** → Go to Q3.

  **Q3. The Substrate Check**
  *Case:* We upload the brain's program to a silicon server. The input-output behavior is identical.
  *Question:* Does the **biological wetware** (analogue, energy-hungry, chemical) carry explanatory weight, or is the computation **indifferent to the medium**?
  *   **Indifferent (Abstract)** → Go to Q4.
  *   **Medium Matters (Concrete)** → Go to Q6.

  **Q4. The Format Check (Abstract Path)**
  *Question:* Are the primitive units of the computation **discrete symbols** (addressable, logic-gate like) or **continuous values** (vectors, activation levels)?
  *   **Discrete Symbols** → Go to Q5.
  *   **Continuous Values** → Go to Q5*.

  **Q5. The Verification Check (Discrete Path)**
  *Case:* We scramble the internal wiring but fix the input-output behavior with a "look-up table" wrapper.
  *Question:* Must the **internal states be recoverable by intervention** (tracking the model's units), or is **input-output prediction** enough?
  *   **Intervention required** → **Leaf 3: Classical Mechanistic Computationalism**
  *   **Prediction enough** → Go to Q5b.

  **Q5b. The Mind Claim (Discrete/Black-Box Path)**
  *Question:* Does running this program **suffice** for having a mind, or is it merely **necessary** (a simulation)?
  *   **Suffices** → **Leaf 4: Strong Functionalism**
  *   **Merely Necessary** → **Leaf 5: Weak Functionalism**

  **Q5*. The Mind Claim (Continuous/Abstract Path)**
  *Question:* Does running this network **suffice** for having a mind, or is it a **model** of how minds work?
  *   **Suffices** → **Leaf 6: Strong Connectionism**
  *   **Merely a Model** → **Leaf 7: Weak Connectionism**

  **Q6. The Locus Check (Concrete Path)**
  *Question:* Is the explanation located in **internal states** representing the world, or in **sensorimotor coupling** with the environment?
  *   **Sensorimotor Coupling** → **Leaf 8: Radical Enactivism**
  *   **Internal States** → Go to Q7.

  **Q7. The Dynamics Check (Concrete/Internal Path)**
  *Question:* Is the system best described by **differential equations over fields** (continuous time) or **mechanistic interactions of parts** (spikes/circuits)?
  *   **Differential Equations** → **Leaf 9: Dynamical Systems Cognitive Science**
  *   **Mechanistic Parts** → Go to Q7b.

  **Q7b. The Biological Specificity Check**
  *Question:* Do the biological details **implement a computation** or **replace the need for computation** (causal powers are purely biological)?
  *   **Implement Computation** → **Leaf 10: Mechanistic Neurocomputation**
  *   **Replace Computation** → **Leaf 11: Biological Naturalism**

  *(Note: Predictive Processing is a hybrid often occupying Leaf 10 or 7, depending on whether priors are treated as symbolic or dynamical.)*

  ---

  ### The Doctrines (Leaves)

  1.  **Pancomputationalism:** Everything computes because physics allows state mappings. (Trivializes the debate).
  2.  **Computational Instrumentalism:** Computation is a *façon de parler*; real laws are neural/biophysical.
  3.  **Classical Mechanistic Computationalism:** Symbols are real, substrate-independent, and internal structure must match the model (e.g., Fodor, Gallistel).
  4.  **Strong Functionalism:** Input-output equivalence + abstract program = Mind (Turing Test tradition).
  5.  **Weak Functionalism:** Computation models the mind but lacks intentionality/consciousness (Searle's Chinese Room target).
  6.  **Strong Connectionism:** Neural networks *are* minds; substrate independence holds for wetware/silicon nets.
  7.  **Weak Connectionism:** Networks are useful models of learning, but not ontologically sufficient for mentality.
  8.  **Radical Enactivism:** No internal computation; cognition is skilled coupling with the environment (No representations).
  9.  **Dynamical Systems:** Cognition is trajectories in state-space; time is constitutive, not incidental.
  10. **Mechanistic Neurocomputation:** Computation is real but implemented by specific biological mechanisms (spikes, synapses).
  11. **Biological Naturalism:** Brains cause minds via biological causal powers; computation is observer-relative (Searle).

  ---

  ### Empty Logical Space

  **The "Biological Strong AI" Gap (Q3: Medium Matters + Q5/5*: Suffices)**
  *   *Combination:* Claiming that *only* biological tissue suffices for a mind, but *because* it runs a computation.
  *   *Status:* **Unstable.** If the computation is what suffices for the mind (Strong AI), substrate independence usually follows. If substrate matters, it is usually because computation *doesn't* suffice (Biological Naturalism). This view is rarely occupied because it contradicts the functionalist logic of "Strong" claims.

  **The "Enactivist Mechanist" Gap (Q6: Coupling + Q7: Mechanistic Parts)**
  *   *Combination:* Claiming cognition is purely sensorimotor coupling, but explaining it via discrete spiking mechanisms.
  *   *Status:* **Unexplored/Unfashionable.** Enactivism typically rejects mechanistic decomposition in favor of holistic dynamics. A view that marries strict coupling with discrete mechanistic explanation would be a novel form of embodied mechanism.

  ---

  ### Indistinguishable Leaves & A Novel Test

  **The Problem:** The tree struggles to separate **Leaf 7 (Weak Connectionism)** from **Leaf 9 (Dynamical Systems)**.
  *   *Why:* Both reject discrete symbols. Both often accept substrate dependence. Both view computation as continuous. In practice, a neural network (Connectionist) can be described as a dynamical system, and a dynamical system can be simulated by a network.
  *   *Consequence:* A researcher might classify a model as either depending on their mathematical toolkit, not their ontological commitment.

  **The Novel Test Case: "The Transient Gate"**
  *   *Scenario:* Consider a neural circuit where the "output" is not the steady-state activation level (the attractor), but the **specific trajectory** taken to reach that state. The system computes a logic function *during* the relaxation period before equilibrium.
  *   *The Intervention:* We slow down the time-constant of the neurons (making them sluggish) without changing the final activation levels or the connectivity weights.
  *   **Weak Connectionist Prediction:** Performance remains **unchanged**. The computation is defined by the weights and the final activation vector; time is incidental to the function.
  *   **Dynamical Systems Prediction:** Performance **degrades or fails**. The computation is constituted by the trajectory through state-space over time; altering the temporal profile alters the computation itself.
  *   *Resolution:* If the system fails when slowed, it is a Dynamical System (Leaf 9). If it succeeds, it is a Connectionist model using dynamics merely as implementation (Leaf 7).
