answer: |-
  **Component 1: Textual Emphasis on Displacement vs. Corruption**
  **Probability:** 0.70
  **Justification:** While moralizing rhetoric about vice is voluminous, the structural critique of spectatorship time and cost underpins the institutional argument.

  **Component 2: Internal Coherence with Republican Festivals**
  **Probability:** 0.90
  **Justification:** Only the displacement model explains why participatory festivals build virtue while spectator theater erodes it despite both evoking emotion.

  **Component 3: Determinative Value for Argumentative Success**
  **Probability:** 0.75
  **Justification:** Framing the issue as institutional resource allocation makes the critique robust against Enlightenment claims of moral education through art.

  **Component 4: Anthropological Assumption of Finite Civic Energy**
  **Probability:** 0.85
  **Weight:** High (Foundational)
  **Justification:** Rousseau's political theory presupposes a zero-sum economy of attention where psychic expenditure on simulation reduces capacity for action.

  **Overall Credence:** 0.80

  **Least Confident Component:** Component 1 (Textual Emphasis).

  **Shift Condition:** My confidence in Component 1 would decrease significantly if textual analysis revealed passages where Rousseau explicitly endorses non-participatory spectacles that do not serve political ends, or if he condemns the *content* of specific plays as the primary danger irrespective of the time or attention they consume.
