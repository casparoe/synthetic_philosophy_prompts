answer: |-
  # The Karma Decision Tree: A Classification Instrument

  ## Part 1: The Branching Structure
  *Instructions for the Seminar Leader:* Present these nodes sequentially. At each node, ask for a show of hands for Option A versus Option B. Record the cohort's dominant intuition, but allow individual students to track their own path. The goal is not consensus, but mapping the logical space of moral desert.

  **Node 1: The Input of Desert (The Moral Luck Test)**
  *Question:* A driver texts while driving. Driver A hits and kills a pedestrian. Driver B hits nothing and arrives safely. Both had the exact same reckless intention. Do they deserve the *same* moral penalty?
  *   **A:** Yes. The outcome was luck; only the choice matters. (**Intention-Only**)
  *   **B:** No. The harm done changes the moral account, regardless of intent. (**Outcome-Sensitive**)

  **Node 2: The Mechanism of Payoff**
  *Question:* When a penalty comes due, does it arrive because the act *changed the agent* (e.g., hardened their character), or because the universe *owes a debt* independent of that change?
  *   **A:** The act changes the agent; the 'payoff' is just the natural state of that changed character. (**Internal/Naturalistic**)
  *   **B:** The universe (or a moral order) must actively balance the books, regardless of character change. (**External/Administered**)

  **Node 3: The Direction of Justification**
  *Question:* Is the suffering inflicted on the agent justified because they *did* something wrong in the past, or because it will *make* them better in the future?
  *   **A:** It is a payment for a past deed. The debt exists regardless of improvement. (**Backward-Looking/Retributive**)
  *   **B:** It is a correction or education. If no improvement follows, the suffering was pointless. (**Forward-Looking/Therapeutic**)

  **Node 4: The Ledger's Closure**
  *Question:* Must all moral accounts be settled within the span of a single biological life, or can the debt carry over after death?
  *   **A:** Death closes the ledger. If justice isn't done now, it isn't done. (**Single-Life**)
  *   **B:** The account survives death and attaches to a future existence. (**Multi-Life**)

  **Node 5: The Status of Birth (The Suffering Test)**
  *Question:* If a child is born into severe suffering or disability, can this be a just discharge of a moral debt from before their birth?
  *   **A:** No. Birth circumstances are brute luck; blaming the sufferer is immoral. (**Birth as Luck**)
  *   **B:** Yes. Starting conditions are the first payment on a prior account. (**Birth as Desert**)
      *(Note: If you chose Single-Life at Node 4, you are logically compelled to choose A here.)*

  **Node 6: The Subject of Continuity**
  *Question:* In a Multi-Life view, is the being born in the next life the *identical person* who acted before, or merely the causal successor (like one candle flame lighting another)?
  *   **A:** It is the same persistent 'self' or soul. (**Persisting Subject**)
  *   **B:** It is a stream of causality without a permanent core. (**Causal Stream**)

  **Node 7: The Unit of Accounting**
  *Question:* Is the moral debt tied strictly to the individual agent, or can it be shared by a family, community, or transferred to a saviour?
  *   **A:** Strictly individual. I pay for me. (**Individual**)
  *   **B:** It can be shared, inherited, or voluntarily taken by another. (**Collective/Transferable**)

  ---

  ## Part 2: The Occupied Leaves
  *Below are the coherent clusters of answers that correspond to defendable philosophical positions. Not all 128 logical combinations are listed; only those that constitute a viable theory of desert.*

  ### Leaf 1: Classical Retributivism
  *   **Path:** 1A (Intention) → 2B (External) → 3A (Backward) → 4A (Single-Life) → 5A (Luck) → 6A (Persisting) → 7A (Individual).
  *   **Label:** **Western Legal Retributivism**.
  *   **Awkward Commitment:** It must admit that the universe is often fundamentally unjust, as many wrongs go unpunished in this life.
  *   **Desert Status:** **Yes.** This is the baseline theory of desert.

  ### Leaf 2: Psychological Naturalism
  *   **Path:** 1A (Intention) → 2A (Internal) → 3B (Forward) → 4A (Single-Life) → 5A (Luck) → 6A (Persisting) → 7A (Individual).
  *   **Label:** **Secular Karma (Western Appropriation)**.
  *   **Awkward Commitment:** It struggles to explain why bad people sometimes flourish without consequence, reducing 'karma' to a metaphor for habit formation.
  *   **Desert Status:** **No.** It has quietly become a theory of moral psychology and education, not desert.

  ### Leaf 3: Orthodox Rebirth Desert
  *   **Path:** 1A (Intention) → 2B (External) → 3A (Backward) → 4B (Multi-Life) → 5B (Desert) → 6A (Persisting) → 7A (Individual).
  *   **Label:** **Hindu (Vedantic/Mīmāṃsā) Karma**.
  *   **Awkward Commitment:** It requires accepting that a suffering infant is morally responsible for a deed they cannot remember and a 'self' that persists without memory.
  *   **Desert Status:** **Yes.** It preserves desert by expanding the timeline.

  ### Leaf 4: Stream Continuity Theory
  *   **Path:** 1A (Intention) → 2B (External) → 3B (Forward) → 4B (Multi-Life) → 5B (Desert) → 6B (Causal Stream) → 7A (Individual).
  *   **Label:** **Theravada Buddhist Karma**.
  *   **Awkward Commitment:** It punishes a 'successor' for a 'predecessor's' deed without strict identity, which looks like collective punishment disguised as individual continuity.
  *   **Desert Status:** **Debatable.** It functions as desert but relies on causal continuity rather than identity to justify the link.

  ### Leaf 5: Material Binding Theory
  *   **Path:** 1B (Outcome) → 2B (External) → 3A (Backward) → 4B (Multi-Life) → 5B (Desert) → 6A (Persisting) → 7A (Individual).
  *   **Label:** **Jain Karma**.
  *   **Awkward Commitment:** It treats moral fault as a physical substance that clings to the soul, meaning accidental harm generates debt even with pure intentions.
  *   **Desert Status:** **Yes.** It is a hyper-literal theory of desert where morality is physics.

  ### Leaf 6: Compassionate Transfer Theory
  *   **Path:** 1A (Intention) → 2B (External) → 3B (Forward) → 4B (Multi-Life) → 5B (Desert) → 6B (Causal Stream) → 7B (Collective).
  *   **Label:** **Mahayana (Bodhisattva) Karma**.
  *   **Awkward Commitment:** It allows merit transfer, which undermines the strict 'you reap what you sow' principle required for individual justice.
  *   **Desert Status:** **No.** It has become a theory of salvation and communal grace rather than strict desert.

  ### Leaf 7: Fatalistic Determinism
  *   **Path:** 1B (Outcome) → 2B (External) → 3A (Backward) → 4B (Multi-Life) → 5B (Desert) → 6A (Persisting) → 7A (Individual).
  *   **Label:** **Popular/Folk Karma**.
  *   **Awkward Commitment:** It implies that every misfortune (e.g., being robbed) is deserved, leading to victim-blaming and political quietism.
  *   **Desert Status:** **Yes.** But it is a morally repugnant version of desert that justifies the status quo.

  ---

  ## Part 3: The Unoccupied Logical Space
  *These are combinations of answers the logical space allows, but which remain philosophically vacant.*

  1.  **External Mechanism + Single-Life + Birth as Desert.**
      *   **Status:** **Incoherent.** If the ledger closes at death (Single-Life), there is no prior time from which a birth debt could originate.
  2.  **Causal Stream + Backward-Looking Retribution + Individual Unit.**
      *   **Status:** **Unattractive.** Punishing a causal successor for a predecessor's past deed without a forward-looking therapeutic aim is indistinguishable from punishing a child for a parent's crime, which violates modern individualism.
  3.  **Internal Mechanism + Multi-Life + Birth as Desert.**
      *   **Status:** **Unexplored.** If the payoff is internal (character change), it is unclear how this transfers across lives where memory is wiped. No major tradition argues that character traits persist biologically without a metaphysical carrier (soul or karmic seed).
  4.  **Outcome-Sensitive + Single-Life + Birth as Luck.**
      *   **Status:** **Occupied (mostly by Consequentialism), but unstable as Desert.** If outcomes matter but there is no afterlife to balance the books, the theory collapses into luck egalitarianism rather than desert.
  5.  **Persisting Subject + Collective Unit.**
      *   **Status:** **Unexplored.** If the 'self' is persistent and individual, it is logically difficult to argue that a *group* pays the debt. This combination usually forces a shift to a Collective Subject (e.g., National Karma), which is rare in moral philosophy.

  ---

  ## Part 4: Indistinguishable Leaves
  *The tree cannot perfectly separate the following positions without further metaphysical questioning.*

  *   **Leaf 3 (Orthodox Rebirth) and Leaf 5 (Material Binding):** On this tree, both appear as Multi-Life, Backward-Looking, Persisting Subject theories. The distinction lies in whether karma is a moral law (Leaf 3) or a physical substance (Leaf 5). This requires a metaphysical node not included here to separate.
  *   **Leaf 1 (Retributivism) and Leaf 2 (Naturalism):** If a Naturalist believes character *inevitably* leads to suffering (External-looking Internalism), their practical outcomes look identical to Retributivism in this life. The distinction is only visible in their explanation of *why* the suffering occurs.

  ---

  ## Part 5: Seminar Execution Note (90 Minutes)

  **00:00 – 00:10: Introduction**
  Briefly recap the problem of Moral Luck (Nagel/Williams). Explain that today is not about learning 'what karma is', but testing whether a karmic structure solves the luck problem better than Retributivism.

  **00:10 – 00:50: The Walk-Through (Nodes 1–7)**
  Proceed through the nodes in order.
  *   **Expect Split 1:** Node 1 (Luck). This is the core of the course. Expect a 60/40 split between Intention and Outcome.
  *   **Expect Split 2:** Node 4 (Ledger). This is the metaphysical hurdle. Most will choose Single-Life. Use this to highlight why Western desert theory accepts 'injustice' as a brute fact.
  *   **Expect Split 3:** Node 5 (Birth). This is the ethical hurdle. Even those who accept Multi-Life may reject Birth as Desert. This is where the 'victim-blaming' objection arises.
  *   *Tactic:* Do not debate the answers. Record the votes. Ask one student from each side to justify their choice in one sentence only.

  **00:50 – 01:20: Mapping the Leaves**
  Group the students by their final 'path'.
  *   Ask the **Classical Retributivists** (Leaf 1): "Are you comfortable that the driver who killed no one deserves the same blame, but the universe owes them nothing?"
  *   Ask the **Rebirth Desert** group (Leaf 3): "Does believing the suffering infant 'deserved' their fate make the universe more just, or does it just move the injustice to a time we cannot verify?"
  *   Ask the **Stream Continuity** group (Leaf 4): "If there is no 'self', who is being punished?"

  **01:20 – 01:30: Conclusion**
  Return to the guiding question.
  *   If you chose **Single-Life**, Karma offers no advantage over Retributivism regarding luck; it merely internalises it.
  *   If you chose **Multi-Life**, you solve the distribution of luck but at the cost of empirical verifiability and potentially harsh moral judgments on sufferers.
  *   **Final thought:** Karma handles moral luck *better* only if one accepts the metaphysical cost of rebirth. If one rejects rebirth, Karma collapses into either Retributivism (Leaf 1) or Psychology (Leaf 2).
