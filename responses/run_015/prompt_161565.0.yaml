answer: |-
  **Alex:** The current bottleneck is statistical noise. We have five reviewers reading a two-page summary. Even if each is sixty percent competent, simple majority rule leaves us vulnerable to a bad flip. The Condorcet Jury Theorem is clear: if individual competence exceeds chance and errors are independent, accuracy converges to one as the panel grows. The cheapest reform isn't retraining reviewers or rewriting guidelines; it's expanding the panel from five to fifteen. We buy accuracy with volume.

  **Jordan:** The theorem is elegant, but it hangs on a thread: independence. In your model, errors must be uncorrelated. In ours, reviewers sit in the same room, read the same summary, and often share the same disciplinary blind spots. Let me propose a concrete dependence structure. Suppose each reviewer, with probability $\lambda$, forms an independent judgment correct with probability $c > 0.5$. But with probability $1-\lambda$, they defer to a lead reviewer whose judgment is correct with probability $d$.

  **Alex:** A mixture model. Reasonable.

  **Jordan:** Here is the implication: if $\lambda \le 0.5$, the independent voters are a minority. The deferrers vote as a bloc following the lead. No matter how large $n$ becomes, the majority follows the lead reviewer. The panel's accuracy caps at $d$. If the lead is fallible, adding a hundred deferential reviewers changes nothing. The lever that matters is raising $\lambda$, not adding bodies.

  **Alex:** I grant the math. If $\lambda$ is fixed and low, you are right. But $\lambda$ is not a physical constant; it's a design parameter. You assume deference is blind copying, transmitting noise. I argue deference transmits expertise. If the lead reviewer is a senior expert, $d$ might be $0.9$ while $c$ is $0.6$. In that case, a high deference rate is efficient, not pathological. Furthermore, $\lambda$ depends on whom we add. If we recruit fifteen reviewers from diverse subfields rather than five from one department, the probability of shared bias drops. We can engineer independence by curating the panel, not just shrinking it.

  **Jordan:** You're treating correlation as a binary switch we can flip by changing resumes. Real correlation is graded and multi-centered. It's not just one lead reviewer; it's shared methodological priors, shared jargon, shared exposure to the same preliminary data. But let's grant your point on diversity. There is a cost to de-correlation you're ignoring. To maximize $\lambda$, we often isolate reviewers—no deliberation, no pooling of evidence. If reviewer A sees a flaw B missed, deliberation allows correction. If we silence them to preserve independence, we sacrifice the gains from pooled evidence.

  **Alex:** So you prefer deliberation despite the correlation risk?

  **Jordan:** I prefer acknowledging the incentive structure. In a panel of five, my vote is pivotal. I read the summary carefully. In a panel of fifteen, my pivotality drops. Rational reviewers exert less effort as $n$ rises. That drags $c$ down. You might be adding bodies, but you're diluting competence. And this connects to the competence condition of Condorcet. You assume $c > 0.5$. On the hardest proposals—the ones that actually reach us after administrative filtering—the signal is weak. If the summary obscures the methodology, reviewers might be systematically worse than chance, $c < 0.5$. In that case, majority voting doesn't converge to truth; it converges to error.

  **Alex:** That's a valid worry for the marginal cases. But the easy cases are filtered out before they ever reach a vote. We aren't voting on obviously dead proposals. We are voting on the ambiguous middle. In that zone, I maintain the collective signal is better than noise. But your model assumes $\lambda$ is static regardless of panel composition. If I add reviewers who haven't spoken to the lead, $\lambda$ rises. You assume the correlation is structural; I argue it's social.

  **Jordan:** And I argue that social correlation is the only kind we can measure. But you're right that we are guessing at parameters. We are arguing over $\lambda$, $c$, and $d$ without data.

  **Alex:** Precisely. So, to settle this: I need to measure the **marginal predictive validity of the $k$-th reviewer**. I need to know if the vote of the sixth reviewer adds independent signal that corrects the majority of the first five.

  **Jordan:** That requires a counterfactual. We didn't collect the sixth vote. We can't observe the marginal contribution without running parallel panels, which doubles our cost.

  **Alex:** And you? What do you need?

  **Jordan:** I need to measure the **pairwise correlation of errors** among our current reviewers. To do that, I need to know the ground truth—which proposals were actually "correct" decisions.

  **Alex:** Which requires tracking grant outcomes years later, disentangling funding quality from execution luck.

  **Jordan:** Exactly. You need counterfactual votes; I need counterfactual truths. Until we have one, we are just fitting curves to our own biases.
