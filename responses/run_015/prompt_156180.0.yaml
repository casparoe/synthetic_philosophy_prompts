answer: |-
  There is no single established term that captures precisely what you are describing. You have identified a gap in the taxonomy of information pathology.

  The phenomenon sits at the intersection of three existing concepts, none of which fully cover the ground you need for policy:

  1.  **Immunizing Stratagems (Philosophy of Science):** Karl Popper and Imre Lakatos described how theories protect themselves from falsification by adding auxiliary hypotheses. However, this is usually logical (e.g., "the experiment failed because of unseen interference"), not social (e.g., "asking for the experiment is immoral").
  2.  **Poisoning the Well (Rhetoric):** This covers the pre-emptive attack on the questioner ("only a fool would ask"). But this describes a *tactic* in a debate, not a *property* of a claim that aids its transmission over time.
  3.  **Kafkatrapping (Sociology):** Coined by James C. Bennett, this describes a dynamic where a denial of an accusation is taken as evidence of the accusation (e.g., "Your demand for proof proves your privilege"). This fits your examples closely but is typically restricted to identity politics discourse, not general hobbyist information.

  ### Is "Selection" the Right Machinery?

  Yes, but with a caveat. In **Cultural Evolution Theory** (Dual Inheritance Theory), traits are selected based on how well they replicate. Standard biases are:
  *   **Content Bias:** The idea is useful/true.
  *   **Model Bias:** The person sharing it is prestigious.
  *   **Frequency Bias:** Everyone else is doing it.

  You have identified a fourth, rarer bias: **Defense Bias**. The trait survives not because it benefits the host (the community), nor because it is easy to copy, but because it actively suppresses the mechanism (scrutiny) that would normally cull it. It is a form of **parasitic self-preservation**. The "gene" (the claim) modifies the "environment" (the social norms) to prevent its own deletion.

  So, "selection" is the correct word, but it is selection *against the host's immune system* (community scrutiny), rather than selection *for host fitness* (truth/utility).

  ### The Coinage: Verification-Hostile Coupling (VHC)

  For the purpose of your moderation policy, I propose the term **Verification-Hostile Coupling (VHC)**.

  **Definition:** A claim exhibits VHC when the assertion of its truth is structurally linked to a social or normative penalty for attempting to verify it.

  **The Mechanism:** The claim "hitchhikes" on a pre-existing legitimate norm (safety, trust, efficiency, expertise) to raise the transaction cost of scrutiny. The cost is not technical (e.g., "you need a $5,000 oscilloscope"); it is reputational or moral (e.g., "you are unsafe/untrusting/inexperienced").

  ### The Carving: Distinguishing VHC from Legitimate Barriers

  To write policy that catches VHC without silencing whistleblowers or respecting legitimate expertise, you must distinguish between **Technical Friction** and **Normative Friction**.

  Here are three tests to determine if a claim is VHC (bannable/suspect) or Legitimate (allowed/protected).

  #### 1. The Locus of Cost Test
  *   **Legitimate:** The cost of verification is **external** to the social system.
      *   *Example:* "This amplifier oscillates at 40kHz." / "How do you know?" / "You need an oscilloscope with 100MHz bandwidth to see it."
      *   *Verdict:* **Pass.** The barrier is physics/economics. The claim does not attack the asker for lacking the scope.
  *   **VHC:** The cost of verification is **internal** to the social system.
      *   *Example:* "This amplifier is dangerous." / "How do you know?" / "If you have to ask, you shouldn't be building amps."
      *   *Verdict:* **Fail.** The barrier is status/morality. The claim attacks the asker's right to ask.

  #### 2. The Decoupling Test
  *   **Legitimate:** The claim can be separated from the difficulty of checking it.
      *   *Example:* A whistleblower says, "I suspect this batch is faulty. I lost my test rig, but here is the serial number range. Please check yours."
      *   *Verdict:* **Pass.** The claim invites verification by others, even if the originator cannot currently perform it.
  *   **VHC:** The claim is fused to the prohibition of checking.
      *   *Example:* "This batch is faulty. Do not test it, just replace it. Testing wastes time we could spend on safety."
      *   *Verdict:* **Fail.** The claim defines the verification attempt as a negative outcome (waste, danger, betrayal).

  #### 3. The Reciprocity Test
  *   **Legitimate:** The person making the claim accepts the same burden they impose.
      *   *Example:* "We don't write minutes because it slows us down." / "Okay, will you accept a motion that we start writing them if 50% of members ask?" / "Yes."
      *   *Verdict:* **Pass.** The norm is open to procedural challenge.
  *   **VHC:** The person making the claim is exempt from the burden.
      *   *Example:* "We don't write decisions down." / "Who decided that?" / "Asking that proves you don't understand how we work."
      *   *Verdict:* **Fail.** The norm protects itself from the very process it claims to optimize.

  ### Policy Application: The "Provisionality" Clause

  Your concern about whistleblowing is critical. Whistleblowing often looks like VHC because it involves urgent, unverified claims ("This part might kill you!").

  The distinction lies in **Provisionality**.
  *   **Whistleblowing** is inherently provisional. It says: "I believe X, I cannot fully prove it yet, but the risk is high enough that you should investigate." It *invites* scrutiny from those who *can* check.
  *   **VHC** is inherently dogmatic. It says: "X is true, and your attempt to investigate is itself a violation." It *repels* scrutiny.

  **Draft Policy Language:**
  > "Claims regarding safety, integrity, or organizational procedure must remain open to verification. It is a violation to attach social, moral, or reputational penalties to the act of requesting evidence.
  >
  > **Allowed:** 'I suspect this component is faulty; I lost my logs, but please test yours.' (Invites verification).
  > **Prohibited:** 'This component is faulty; asking for logs proves you don't care about safety.' (Penalizes verification)."

  ### Contested Boundaries

  You asked to flag where the classification is genuinely contested. There are two gray zones where VHC overlaps with legitimate community protection.

  **1. The "Troll Tax" Boundary**
  *   *The Conflict:* In large forums, bad-faith actors often demand impossible levels of proof to exhaust opponents (sea-lioning). Communities often develop norms like "Don't feed the trolls" or "Trust established members."
  *   *The Gray Zone:* When does "Don't feed the trolls" become VHC?
  *   *The Line:* If the norm applies **asymmetrically**. If a new member asking for sources is told "Do your own research" (VHC), but an established member making a claim is not held to the same standard, it is VHC. If the norm applies to *everyone* equally to prevent exhaustion, it is a legitimate **Rate Limit**, not VHC.

  **2. The "Expertise" Boundary**
  *   *The Conflict:* In hobbyist forums, some questions are genuinely basic ("How do I turn on the soldering iron?"). Experienced members may feel that answering these repeatedly degrades the signal-to-noise ratio.
  *   *The Gray Zone:* "Read the FAQ" can be a helpful pointer or a shaming tactic.
  *   *The Line:* **Helpfulness.** "The answer is in the FAQ, section 4" is legitimate friction. "Only an idiot would ask this, read the FAQ" is VHC. The former lowers the cost of finding truth; the latter raises the cost of asking.

  ### Summary for Moderation

  You are dealing with **Verification-Hostile Coupling**. It is a form of cultural selection where ideas survive by making their own culling socially expensive.

  *   **Do not ban unverified claims.** (This kills whistleblowing).
  *   **Ban the coupling of claims with penalties for verification.**
  *   **Look for the "Rider":** Is there a clause attached to the claim that makes the checker the problem?
  *   **Look for the "Borrowed Shield":** Is the claim hiding behind a norm (safety, trust, efficiency) that it did not create and does not serve?

  This allows you to keep the "This batch is dangerous" warning (if posted as a warning to investigate) while removing the "If you ask for proof you are dangerous" rider (which prevents the investigation).
