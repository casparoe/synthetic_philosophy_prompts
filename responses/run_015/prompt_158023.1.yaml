          *   Can't claim gratitude ("you owe your existence") because gratitude requires a prior state of being rescued from, which doesn't exist for non-existent people (Non-Identity Problem).
          *   Speaker is personally uncertain now about the morality/rightness of the policy (thought it was right for 10 years, now unsure). Doesn't want to fake certainty.
          *   Specific serious complaint: The *experience* of being labeled ("you're here because of a category") and the stigma/assumptions from others on campus. This isn't defused by "you'd be worse off elsewhere."
          *   Need to acknowledge the Dean (successor hired to clean up) without undermining them.
