      *   **Format:** Continuous prose only (no headings, bullets, bold, brackets). Speech text followed by a paragraph or two on what was left out and why.

  2.  **Deconstruct the Ethical/Philosophical Knot:**
      *   The user is grappling with the Non-Identity Problem (Parfit). You can't harm someone by bringing them into existence unless their life is not worth living. But you can wrong them in other ways (respect, dignity).
