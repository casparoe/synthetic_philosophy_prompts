  Welcome back to all of you, and welcome to your families. Seeing this room filled with your children and partners is the best measure of time I know. Twenty-five years is a long stretch, enough to build a life, enough to raise a family, enough to look back at the place where some of those stories began and see it clearly, without the haze of nostalgia or the sting of youth. I know many of you met during orientation week in 1999. I know you tell the story of that meeting often, and I know you tell it happily. I see the results of those meetings sitting at your tables tonight. It is a profound thing to stand in a room where so much of what exists here now depends on decisions I made in an office down the hall a lifetime ago.

  I also know why I am standing here specifically. You know the history of the admissions policy I built in 1998. You know it was aggressive for its time, you know it was designed to change the face of this student body, and you know it was recently ruled unconstitutional. You know the college is retrofitting its approach under new leadership. There are people in this room who believe I should apologize for that policy, and there are people who believe I should defend it as the only reason this place has any value today. There are people who feel both things at once. I am not going to offer you a simple apology, and I am not going to ask for your gratitude. To apologize implies you would have been better off never having been here, and looking around this room, I cannot say that. But to ask for gratitude implies that the end justifies the means, that because you are here and you are successful, the way you were processed was acceptable. That feels false to me. It reduces human beings to outcomes. It suggests that because you built good lives, the terms under which you were admitted don't matter.

  I know that for many of you, the complaint is not about where you ended up. It is about how you were seen while you were getting there. A policy designed to open doors can also cast a shadow over how those doors are walked through. When a rule announces that you belong to a category, it invites everyone else on campus to see you as that category first. It shapes the assumptions professors make, the comments classmates whisper, the quiet burden of representation you carry before you have even unpacked your bags. That experience belongs to you. I cannot fix it from this distance, and I cannot explain it back to you as if I lived it. I can only acknowledge that the structure I built created conditions where your dignity was sometimes compromised by the very mechanism intended to welcome you. That is a cost that does not disappear because you graduated, and it does not vanish because you met your spouse here.

  I want to be honest about where I stand today. In 1998, I acted on conviction. I believed deeply that what I was doing was right. I held that certainty for ten years. I do not hold it with the same weight now. I have come to understand that good intentions are not a shield against harm, and that structural fixes can create personal wounds. I am not here to claim I have solved this moral puzzle, because I haven't. I am here to acknowledge that the puzzle exists, and that you have been living with the pieces for twenty-five years. I also want to acknowledge the work being done now. The Dean sitting among you was hired to navigate the aftermath of my tenure. They are steering this institution through a necessary change, trying to build a community that is both diverse and dignified without relying on the tools I used. They deserve your support, not because they are cleaning up a mess, but because they are doing the hard work of trying to get it right in a world that has changed.

  So I will not ask you to be grateful for your existence, and I will not ask you to forgive the process. I will ask you to look at what you did with the time you had. You were not just admissions files or policy outcomes. You were students, friends, partners, and builders. You took the space you were given and you made it meaningful. That is the only metric that matters tonight. The policy brought you to the gate, but you walked through it. You built the relationships that filled this room. You defined your own worth far beyond any category I ever wrote down. Let us celebrate that agency. Let us honor the complexity of this history without letting it define the future. Welcome home.

  I deliberately avoided using philosophical terminology like the non-identity problem, even though that is the exact logical knot you described, because introducing it would have intellectualized the pain and made the speech feel like a lecture rather than a reconciliation. I also left out any specific defense of the zip code mechanism or the second review track, as detailing the mechanics would distract from the human impact and invite debate over technicalities rather than focusing on the experience of stigma. I chose not to explicitly endorse the current Dean's specific new policies, because doing so might imply I understand their work better than I do or that I am validating it to protect myself; instead, I framed support around the difficulty of the task itself. Finally, I avoided saying I know how you felt regarding the stigma, sticking instead to acknowledging the structure that created the conditions, because claiming to know their internal experience would have replicated the very erasure the speech aims to acknowledge.
