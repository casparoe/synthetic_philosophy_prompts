      *   **Tone:** Academic, precise, ambitious but feasible for an undergrad.
      *   **Constraint:** No citations needed (user will fill them in).

  2.  **Deconstruct the Core Idea (Granularity vs. Weight):**
      *   *Standard View:* Speciesism is wrong because it gives less weight to similar interests based on species. (Weight View).
      *   *User's View:* Speciesism might be wrong because it uses a *group label* instead of *individual traits*, even if the group label correlates with traits. (Granularity/Sorting View).
      *   *The Collapse Problem:* If I say "sorting by species is wrong, sort by sentience instead," isn't that just saying "sentience is the relevant property"?
      *   *The Sharpening:* The distinction lies in *epistemic proxy vs. ontological ground*. Is it wrong to use a statistical proxy (species) even if it's accurate 99% of the time? Or is the wrongness only in the misalignment of interests? The proposal needs to focus on the *structure of moral justification*, not just the outcome.
      *   *Test Case:* A being that fits the species-typical profile but is an outlier (e.g., a human with no sentience vs. a pig with high sentience). Wait, that's the Argument from Marginal Cases (AMC).
      *   *Better Test Case:* A policy that sorts by species *but* assigns equal weights to interests *within* the sorted categories, or a scenario where species correlates perfectly with a morally relevant trait (e.g., all humans have capacity X, no animals do). If speciesism is *only* about weight, perfect correlation excuses it. If it's about granularity, using the group label is still suspect.
      *   *Refined Test Case:* The "Statistical Speciesist." Someone who admits animals have interests, assigns them equal weight *in principle*, but uses species membership as a *heuristic* for decision-making because individual assessment is too costly. Is this speciesist? The Weight View says "No, interests are weighted equally." The Granularity View says "Yes, you're using a morally arbitrary group boundary as a decision procedure."

  3.  **Drafting the Proposal - Section by Section:**

      *   **Title:** Needs to be catchy but academic. "The Granularity of Moral Consideration."
      *   **Research Question:** Needs to be specific. "Is speciesism a substantive error regarding the weight of interests, or a procedural error regarding the granularity of moral classification?"
      *   **Background/Problem:** Briefly state the standard Singer/Regan view (equal consideration) and the AMC. Explain why this misses the "sorting" mechanism.
      *   **Why Standard Moves Fail:**
          *   *AMC:* Focuses on outcomes (who gets protected), not the classification method.
          *   *Racism/Sexism Analogy:* Usually focuses on prejudice (weight), not the use of categories themselves.
          *   *Equal Consideration:* Assumes the entities are already identified; doesn't ask *how* we identify them.
      *   **Methodology:** Two terms.
          *   Term 1: Conceptual analysis + Literature review (mapping the "weight" vs. "sorting" distinction).
          *   Term 2: Constructing the test cases + Normative evaluation (deontological vs. consequentialist implications of sorting). *Crucial:* Avoid just polling intuitions. Use structural analysis of moral theories.
      *   **Test Case:** The "Heuristic Speciesist" (as developed above).
      *   **Positive Result:** Showing that even if outcomes match, the *justification* matters. Establishing a "Right to Individual Assessment."
      *   **Failure Conditions:** If granularity reduces entirely to "relevant properties," the project adds nothing.
      *   **Collapse Critique:** I need to address the user's worry directly in the proposal structure or as a note. I will integrate the "sharpened version" into the proposal to make it stronger. The sharpening is: *Procedural Justice vs. Substantive Justice.*

  4.  **Refining the Argument (Self-Correction during drafting):**
