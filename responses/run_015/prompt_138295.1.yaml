answer: |-
  **Dissertation Proposal**

  **Title:** Beyond Weight: The Granularity of Moral Sorting and the Structure of Speciesism

  **1. Research Question**
  Standard debates in animal ethics treat speciesism as a substantive error regarding the *weight* assigned to interests (e.g., Singer's equal consideration of interests). This project asks whether speciesism might instead be, or also be, a procedural error regarding the *granularity* of moral sorting. Specifically: Is the wrong of speciesism located in the unequal weighting of similar interests, or in the use of species membership as a coarse-grained proxy for moral status, even when that proxy correlates with morally relevant traits? I aim to determine whether a "Non-Speciesist Speciesist" is conceptually possible—an agent who assigns equal weight to interests but uses species as a heuristic for sorting—and if not, why the granularity of the sorting mechanism matters independently of the weight of the outcome.

  **2. Background and The Gap**
  The dominant framework (Singer, Regan, McMahan) frames speciesism as analogous to racism or sexism: a prejudice that leads to discounting interests based on group membership. The Argument from Marginal Cases (AMC) is the standard weapon, demonstrating that species membership does not align with capacities like sentience or agency. However, the AMC targets the *correlation* between species and capacity, not the *structure* of the classification itself.

  Current literature assumes that if we fix the weights (give animals equal consideration) and fix the criteria (sort by sentience), the problem is solved. This overlooks the "Granularity Question": Is there a moral requirement to assess moral status at the level of the individual rather than the group? If a policy sorts by species but assigns equal weight to interests *within* the sorted categories, has it avoided speciesism? The standard view implies yes (if weights are equal); I suspect the answer is no, because using species as a sorting property violates a duty of individual assessment.

  **3. Why Standard Moves Do Not Settle This**
  *   **The Argument from Marginal Cases:** The AMC shows species is an imperfect proxy for capacity. It does not tell us if a *perfect* proxy (e.g., a world where species perfectly aligns with sentience) would be permissible. If speciesism is about granularity, it remains wrong even with perfect correlation.
  *   **Racism/Sexism Analogies:** These analogies usually focus on the *outcome* (oppression) or *attitude* (prejudice). They rarely analyze whether using demographic categories as administrative heuristics is wrong *per se*, even when statistically accurate.
  *   **Equal Consideration of Interests:** This principle presupposes we have already identified the "considerable" beings. It offers no guidance on the epistemic process of identification. It addresses the *weight* of the claim, not the *standing* to make it.

  **4. Methodology and Two-Term Plan**
  I will avoid reliance on intuition pumps (e.g., constructing new trolley cases) as these often collapse back into substantive disagreements about capacity. Instead, I will use conceptual analysis and normative structuralism.

  *   **Term 1: Mapping the Distinction.** I will reconstruct the "Weight View" (speciesism as interest discounting) and the "Granularity View" (speciesism as categorical error). I will analyze whether "granularity" collapses into "moral relevance." *Sharpening the concept:* To prevent collapse, I will define granularity not as "which properties matter," but as "epistemic access conditions." The question becomes: Do agents have a duty to incur higher epistemic costs to assess individual traits rather than relying on group proxies?
  *   **Term 2: Normative Evaluation and Test Cases.** I will apply deontological and consequentialist frameworks to the Granularity View. Does a right to individual assessment exist independently of the outcome? I will draft a chapter analyzing the "Heuristic Speciesist" (see below) and evaluate whether the Granularity View offers a more robust critique of institutional animal use than the Weight View.

  **5. The Decisive Test Case: The Heuristic Speciesist**
  To separate the Weight Reading from the Granularity Reading, I propose the case of the **Costly Assessment Scenario**.

  *   *Scenario:* An agent acknowledges that some non-human animals possess sentience equal to humans. They assign equal weight to these interests *in principle*. However, they argue that individual assessment of sentience is epistemically costly or practically impossible at scale. Therefore, they adopt a policy of sorting by species as a cost-effective heuristic, accepting that this will lead to occasional errors (e.g., harming a sentient animal because it belongs to a "low-status" species).
  *   *Weight View Verdict:* This is permissible (or at least, not *speciesist* in the prejudicial sense). The interests are weighted correctly; the error is merely epistemic/administrative.
  *   *Granularity View Verdict:* This is impermissible speciesism. By using species as a sorting property, the agent treats individuals as mere tokens of a type, violating a procedural duty of individual consideration, regardless of the epistemic cost.

  If the Granularity View holds, speciesism is not just about *how much* we care, but *how we look*.

  **6. Positive Result and Failure Conditions**
  *   **Positive Result:** A successful dissertation will demonstrate that the Granularity View captures a distinct moral wrong that the Weight View misses. It would establish that "speciesism" is partly a violation of procedural justice (the right to be judged on one's own merits) rather than solely distributive justice (the allocation of welfare). This would shift the burden of proof: proponents of animal use could not justify their position via statistical generalizations about animal capacities.
  *   **Failure Conditions:** The project fails if:
      1.  **The Collapse:** It turns out "granularity" is just a verbose way of saying "sentience is the only relevant property." If the duty to assess individuals reduces entirely to the duty to maximize interest satisfaction, the distinction is illusory.
      2.  **The Triviality:** The Granularity View demands an impossible epistemic standard (e.g., we must assess the moral status of every insect), rendering the theory practically vacuous.
      3.  **Indeterminacy:** I cannot articulate a principled reason why species is an impermissible sorting property while other proxies (e.g., "legal personhood," "biological life") might be permissible.

  **7. Addressing the Collapse Objection**
  I anticipate the objection that "sorting by species is wrong" just means "species is not the morally relevant property." I will argue this is a category mistake. One can agree that sentience is the *ground* of moral status while maintaining that species is an impermissible *proxy*. In human ethics, we reject using race as a proxy for criminal risk even if statistical correlations existed. The wrong is not in the weight assigned to the risk, but in the use of the category. My dissertation will argue animal ethics requires a parallel distinction between the *grounds* of status and the *procedures* for attribution.

  **8. Feasibility**
  The scope is limited to the conceptual structure of speciesism, not a defense of a specific normative theory (e.g., utilitarianism vs. rights). This ensures the project is manageable within two terms. Primary texts will include Singer (practical ethics), McMahan (moral status), and literature on statistical discrimination in human bioethics to bridge the analogy.
