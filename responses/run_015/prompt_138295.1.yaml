      *   *Sharpening:* The proposal should argue that speciesism is a violation of *procedural fairness* in moral status attribution, distinct from the *substantive unfairness* of interest weighting.
      *   *Test Case:* The "Perfect Correlation World." Imagine a world where *all* humans have rational agency and *no* animals do. A weight theorist says speciesism is fine here (no interests violated). A granularity theorist says it's still wrong (you're treating the group as the ground, not the trait).
      *   *Wait, better Test Case:* The "Costly Assessment" case. We *could* test every animal for sentience, but it's expensive. We use species instead. Weight view: Permissible (consequentialist calculus). Granularity view: Impermissible (rights-based procedural violation). This separates them cleanly.

