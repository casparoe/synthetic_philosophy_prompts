      *Confidence Marking:* I should explicitly state where I am interpreting Wittgenstein (scholarship varies) vs. where I am analyzing the scientific practice.
      *Tone Check:* Ensure I sound like a colleague, not a lecturer. Acknowledge the sophistication of the prompt.

  6.  **Refining the Distinctions:**
      *   *Lakatos:* Hard core is protected by *fiat*. Hinge is protected by *sense*. If you attack the hard core, you are a heretic. If you attack the hinge, you are nonsensical (in that context).
      *   *Kuhn:* Paradigm is a worldview. Hinge is a condition of possibility for stating facts.
      *   *Supervisor:* Incentives explain the *speed* of dismissal, not the *direction*.

  7.  **Final Polish:** Check against all constraints.
