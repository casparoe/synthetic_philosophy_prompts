      *   *Hinge vs. Hard Core (Lakatos):* Lakatos's hard core is *protected* by methodological decision. It *could* be doubted, but we choose not to. Hinges are not chosen; they stand fast because doubting them undermines the logic of the inquiry itself.
      *   *Hinge vs. Moore:* Moore says "I know I have hands." Wittgenstein says "I know" is misused here. It's not knowledge; it's the scaffold. If the practice treated these as Moorean knowledge, referees would ask for justification of the knowledge claim. They don't. They treat them as *given*.
