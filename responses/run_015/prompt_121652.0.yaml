answer: |-
  You have independently rediscovered one of the most significant distinctions in the philosophy of language and linguistics. What you are grappling with is the difference between **semantics** (the literal meaning of words) and **pragmatics** (how context contributes to meaning).

  Your intuition is correct: your sister was not necessarily being dishonest, nor was she failing to cooperate. In fact, by being indirect, she was relying on a sophisticated form of cooperation that assumes you are smart enough to read between the lines.

  Here is a breakdown of the principles you are looking for, which should help you resolve the puzzle.

  ### 1. "What is Said" vs. "What is Implicated"
  To answer your first question: Is the "real" meaning something *extra* attached to the words, or something *recoverable* from them?

  In linguistics, this is known as **Conversational Implicature**, a concept developed by the philosopher Paul Grice. Grice argued that when we speak, we convey two layers of information:
  *   **What is said:** The literal, truth-conditional content (e.g., "Dad is busy").
  *   **What is implicated:** The meaning inferred by the listener based on the assumption that the speaker is being cooperative.

  The meaning is not "attached" to the words like a luggage tag; it is **recoverable** through inference. You calculate the meaning by assuming your sister is following the rules of conversation.

  Here is how the calculation works in your scenario:
  1.  **You ask:** "Should we invite them?"
  2.  **She replies:** "Dad is busy." (Literally irrelevant to a yes/no question).
  3.  **Your brain assumes:** She is cooperating and being relevant (Grice's **Maxim of Relation**).
  4.  **The Inference:** If she thought they should come, Dad's busyness wouldn't matter (we could reschedule). The only reason to mention his busyness as a response to an invitation query is if his busyness is a *reason not to invite him*.
  5.  **Conclusion:** She means "No."

  So, the "real" meaning was not a secret addition; it was a logical consequence of her words combined with the shared context of your goal (planning a reunion).

  ### 2. Cooperation Is Not Directness
  You hypothesized that cooperation might require maximizing directness, but realized that would make politeness impossible. You are exactly right.

  Grice called this the **Cooperative Principle**. However, cooperation does not mean "state everything explicitly." It means "make your contribution such as is required, at the stage at which it occurs, by the accepted purpose or direction of the talk exchange."

  Sometimes, the "accepted purpose" includes maintaining social harmony. If your sister had said, "No, because Mom is annoying and Dad is useless," she would have been direct, but she would have violated the social contract of your relationship.

  By giving you reasons ("Dad is busy") rather than a verdict ("No"), she allowed you to draw the conclusion yourself. This is often called **off-record politeness**. She put the interpretation in your hands. If you got angry, she could plausibly say, "I never said they couldn't come! I just said Dad was busy." This protects both her "face" (from being confrontational) and yours (from being directly rejected).

  ### 3. Is It Deceptive?
  This brings us to your ethical question: Is this legitimate, or is it deception?

  Philosophers distinguish between **lying** and **misleading**.
  *   **Lying** involves asserting something you believe to be false. (e.g., If Dad *wasn't* busy, and she said he was).
  *   **Misleading** involves implying something without asserting it.

  In your sister's case, her statements were factually true. Her *implicature* (that they shouldn't come) matched her actual belief (that they complicate logistics). Therefore, she was not lying, nor was she misleading you about her stance.

  She was engaging in a **Speech Act**. When she spoke, she wasn't just describing the world (constative); she was performing an action (performative). Specifically, she was performing the act of **refusal**, but doing so via the act of **informing**.

  Is it deceptive? Only if you define communication strictly as the transfer of literal data. If you define communication as the coordination of social action, then her reply was highly efficient. She conveyed the refusal, the reason for the refusal, and respect for your feelings, all in one sentence.

  ### 4. Why It Felt Like a Puzzle
  The friction you feel comes from a mismatch in **contextual expectations**.
  *   **You** were operating in a "planning mode," where efficiency and directness are prioritized.
  *   **She** was operating in a "family mode," where hierarchy, politeness, and avoiding conflict are prioritized.

  When she later admitted, "I meant that as a refusal," she was translating her pragmatic meaning back into semantic meaning because she realized the implicature hadn't landed. This is common in close relationships; we sometimes forget that our "shared context" isn't as shared as we think.

  ### Summary
  To resolve your puzzle:
  1.  **Meaning:** The "real" meaning was **recoverable**, not extra. It was generated by the gap between her literal words and the context of your question.
  2.  **Cooperation:** Indirectness is not a breach of cooperation; it is often a higher form of it that accounts for social emotions, not just data transfer.
  3.  **Honesty:** She was not being deceptive. She was using **implicature** to soften a "face-threatening act" (a refusal).

  You have identified the precise mechanism that allows human beings to be polite, subtle, and nuanced. If we always spoke in literal truths and direct commands, we would be efficient robots, but we would likely have very few functioning families. Your sister wasn't hiding the truth; she was trusting you to understand the subtext.
