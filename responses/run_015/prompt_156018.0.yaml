          *   *Rating:* Partially Right (identifies tension), Mostly Wrong (calls it incoherent rather than resolvable conflict).

      *   **Move 2 (Jake):** Claims hierarchy. "15 breaks the tie: meta-rules govern object-rules."
          *   *Analysis:* This is standard legal interpretation (lex specialis). If Art 15 says amendment rules rule, and Art 12 is an amendment rule regarding Art 7, Art 12 wins. This is the standard legal positivist view.
          *   *Rating:* Mostly Right. This is how courts actually solve this.

      *   **Move 3 (Maria):** "15 is inside the same document... no archimedian point." Brings up Nomic.
          *   *Analysis:* She's hitting on the *Grundnorm* problem (Kelsen) or the Rule of Recognition (Hart). Logically, she's right that there's no external anchor *within* the text. However, legal systems don't need an external logical anchor to function; they need social acceptance. Her Nomic analogy is apt regarding self-reference but maybe misapplied to a static charter.
