          *   **Jake:** Argues it's a hierarchy, not a paradox. Meta-rules govern object-rules. Self-amendment is normal (US Constitution Art. V). Distinguishes logic from normativity (lowering the bar isn't illogical, just controversial).
      *   **My Task:** Evaluate each move (1-7), rate them (Wrong to Right), determine the overall winner, and identify what both are missing (specifically regarding logical circularity vs. normative legitimacy and Nomic).

  2.  **Analyze Each Move:**

