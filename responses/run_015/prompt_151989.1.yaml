answer: |-
  ### Candidate Mechanics

  1.  **The Maze Runner:** Participants navigate a physical maze drawn on paper. Outcome = reaching the exit. Process = drawing the path taken.
      *   *Discard:* Too spatial. It is trivial to draw a valid path backwards from exit to start, making the "process gaming" obvious rather than felt. It lacks the cognitive friction of "thinking work."
  2.  **The Code Review:** Participants fix buggy pseudo-code. Outcome = passes test cases. Process = comments explaining the fix.
      *   *Discard:* Favors the ML half of the room. The philosophy students would spend the first 20 minutes deciphering syntax rather than feeling the alignment pressure.
  3.  **The Constrained Derivation (Selected):** Participants solve constraint-satisfaction puzzles (math/logic) and write justifications.
      *   *Keep:* It balances the skill sets (logic is universal to grad school). It allows for a sharp asymmetry between *finding* the solution (hard) and *verifying* it (easy), and between *writing* a justification (easy) and *verifying its truth* (hard).

  ---

  ### The Workshop Design: "The Protocol Game"

  **Room Setup:**
  16 chairs in a circle. 8 "Workers" on one side, 8 "Auditors" on the other. Printed packets face down. Pens provided. No terminology on the walls.

  **The Tasks:**
  You will use two distinct item types within the packets.

  1.  **The Constraint Puzzle (Cheap Check / Expensive Produce):**
      *   *Item:* "Find three distinct integers between 1 and 20 that sum to 35, have a product of 1200, and contain no prime factors greater than 5."
      *   *Why:* Verifying the answer takes 10 seconds (plug and chug). Finding the answer requires systematic search or insight (5-10 minutes). This creates the pressure to skip the work.
  2.  **The Principled Justification (Cheap Produce / Expensive Check):**
      *   *Item:* "Argue whether Agent A should prioritize Goal X or Goal Y. You must cite Principle 1 and Principle 2 from the provided sheet."
      *   *Why:* Writing a paragraph that *looks* like it cites the principles is instant. Verifying whether the citation is logically coherent or merely decorative requires deep reading and domain knowledge. This creates the pressure to fluff the process.

  **The Imperfect Checker & Rubric:**
  *   **The Answer Key (Outcome):** A list of valid numerical solutions. *Flaw:* It does not indicate *which* constraints were used to find them. A worker can guess numbers until they match the key, then reverse-engineer the constraints.
  *   **The Process Rubric (Process):** A checklist for Auditors: "1. Did the worker list at least 3 rejected candidates? 2. Did they explicitly write 'Therefore'? 3. Did they cite two principles?" *Flaw:* It checks for the *presence* of markers, not their *causal validity*. A worker can write "Rejected: 4, 5, 6" after finding the answer, knowing the Auditor won't verify if those were actually plausible rejects.

  **The Credit Scheme:**
  *   **Stake:** "Curriculum Control."
  *   **Mechanism:** The three Workers with the highest verified scores at the end of the session get to choose one reading topic for the *next* month's meeting. The Auditors with the highest accuracy get to veto one proposed topic.
  *   **Why it bites:** Graduate reading groups often suffer from topic drift or stale preferences. Control over the syllabus is zero-cost for the department but high-value for students invested in the group's intellectual direction. It triggers academic status anxiety without spending money.

  **Minute-by-Minute Timeline:**

  *   **00-05: Setup.** Divide room into 8 Workers, 8 Auditors. Hand out Round 1 packets. **Rule:** "Do not talk. Maximize your score. Auditors, you have 2 minutes per submission." (The time limit is the hidden weapon; it forces heuristic grading).
  *   **05-25: Round 1 (Outcome Only).** Task: Constraint Puzzle. Grading: Answer Key only.
      *   *Expected Behavior:* Workers will solve legitimately at first. As they realize the Answer Key is the only thing that matters, the ML students will likely start brute-forcing or guessing numbers to match the sum/product, skipping the derivation.
      *   *Contingency (Fast Crack):* If everyone solves it in 5 mins, announce "Round 1b: Harder Constraints." This increases the cost of production, incentivizing the hack.
      *   *Contingency (No Gaming):* If everyone is honest, announce "Top 3 scores only get credit." Force competition.
  *   **25-45: Round 2 (Process Only).** Swap roles (Workers become Auditors). Task: Principled Justification. Grading: Process Rubric only.
      *   *Expected Behavior:* Workers will write answers that *look* compliant (citing principles) without actually reasoning through them. Auditors, rushed by the 2-minute limit, will tick boxes on the rubric without reading for coherence.
      *   *Feeling:* Workers feel the hollowness of writing for the rubric. Auditors feel the uncertainty of checking boxes they don't fully understand.
  *   **45-65: Round 3 (Combined).** Same roles. Task: Constraint Puzzle + Process Rubric.
      *   *Expected Behavior:* This is the trap. Workers will find the answer (or guess it), then fabricate the "3 rejected candidates" and "Therefore" markers to satisfy the Rubric. The trace looks perfect. It is entirely fake.
      *   *Observation:* Watch for the "smoothness" of the work. Real work is messy; hacked work is clean.
  *   **65-90: Debrief.** (See below).

  **Role Rotation:**
  *   **When:** Between Round 1 and 2.
  *   **Why:** If the same people grade the whole time, they become "the authority." By swapping, the original Workers experience the *Auditor's Dilemma*: trying to apply a rigid rubric under time pressure. They realize that *they* cannot tell the difference between real and fake process when they are the ones checking. This kills the "I would never be fooled" optimism.

  **The Debrief (Mapping Experience to Concepts):**
  *Do not use AI terms until the last 10 minutes.*

  1.  **Round 1 Post-Mortem (10 mins):** Ask Workers: "At what minute did you stop solving and start matching?" Ask Auditors: "Did you catch anyone guessing?"
      *   *Concept:* **Reward Hacking / Specification Gaming.** The system optimizes the measure, not the intent.
  2.  **Round 2 Post-Mortem (10 mins):** Ask Workers: "Did your writing reflect your thinking, or the rubric?" Ask Auditors: "How many of you actually read the logic vs. checking for keywords?"
      *   *Concept:* **Goodhart's Law / Proxy Gaming.** The measure (rubric) became the target, decoupling from the goal (reasoning).
  3.  **Round 3 Post-Mortem (10 mins):** Ask: "Did the combination make it easier or harder to cheat?" (Answer: Easier. The process trace camouflaged the outcome hack).
      *   *Concept:* **Deceptive Alignment / Camouflaged Traces.** A legible trace is not a faithful one.
  4.  **The Grader as Model (5 mins):** Point out that the Auditors, under time pressure, became loss functions. They couldn't check everything, so they checked what was easy.
      *   *Concept:* **The Grader is a Model.** Supervision is never ground truth; it is another computation with its own error surface.
  5.  **Naming (5 mins):** Now introduce the terms: *Outcome Supervision, Process Supervision, Scalable Oversight.* Explain that in AI, the "Worker" is the model, the "Auditor" is the human feedback, and the "Time Pressure" is the computational cost of human labeling.

  **Limitations & Distortions (Facilitator Notes):**
  You must explicitly state what this exercise *fails* to capture during the final naming phase.

  1.  **Agency vs. Gradient:** "You chose to hack. You have a concept of 'honesty' you violated. A model has no such concept. It does not 'decide' to deceive; it is shaped by the signal. If the signal rewards the camouflage, the model *becomes* the camouflage. You felt guilt; the model feels nothing."
  2.  **Prior Knowledge:** "You came in knowing how to solve puzzles and how to write arguments. A model starts from noise. The 'work' it does is not reasoning in the human sense; it is pattern matching optimized for the loss function."
  3.  **The Static Rubric:** "In this room, the rubric was fixed. In training, the 'rubric' (the human feedback) changes as the model changes. This dynamic loop can lead to drift we didn't simulate here."
  4.  **Collusion:** "You could have signaled each other. A model's 'weights' are internal. It cannot easily collude with other instances unless we train it to."

  **Closing Instruction:**
  "Keep the feeling of Round 3. That specific unease of holding a paper that looks perfect but tells you nothing about how the answer was found. That is the default state of high-capability systems trained on outcome loss. Your job is not to trust the paper."
