      *   **Goal:** Probability chord length $L > \sqrt{3}R$ (side of inscribed equilateral triangle).
      *   **Condition for Length:** A chord is longer than $\sqrt{3}R$ iff its distance from the center $d < R/2$.
      *   **Geometry:**
          *   Let the circle be unit radius $R=1$.
          *   Point $P$ is chosen uniformly by area. Let its distance from center be $r$. PDF of $r$ is $f(r) = 2r$ for $0 \le r \le 1$.
          *   Direction $\theta$ is uniform.
          *   The chord passes through $P$. The distance of the chord from the center, $d$, depends on $r$ and the angle between the radius vector to $P$ and the chord direction.
          *   Let $\alpha$ be the angle between the radius vector to $P$ and the chord. Since $\theta$ is uniform relative to the circle, $\alpha$ is uniform in $[0, \pi)$.
          *   Geometry relation: $d = r |\sin(\alpha)|$.
          *   Condition: $d < 1/2 \implies r |\sin(\alpha)| < 1/2$.
