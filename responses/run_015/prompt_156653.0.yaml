  # Taxonomy of Moral Desert and Punishment

  **Root Case:** A convicted offender whose violent behavior is traced to a deterministic neural lesion expresses sincere remorse and voluntarily requests a longer, stricter confinement as a form of self-correction.

  **Node 1 (Root): Respect vs. Intervention**
  Does granting this request treat the offender with the respect due to someone who genuinely *deserves* harsher conditions based on their past choice, or does it merely apply a therapeutically appropriate intervention that happens to align with their current wish?
  *   **Left (Deserves):** The offender is a proper target of deserved hardship.
  *   **Right (Intervention):** The offender is a proper target of management or care.

  ---

  ### Left Branch: The Desert Framework

  **Node 2: Determinism and Control (Topic i)**
  Does the fact that the behavior arose from a deterministic neural lesion undermine the control required to be the true source of that action?
  *   **Left (Undermines):** Determinism removes the necessary control.
  *   **Right (Preserves):** Determinism is compatible with sufficient control.

  **Node 3: Backward-Looking Entitlement (Topic ii)**
  Is the justification for imposing the confinement necessarily based on a backward-looking entitlement (the offender forfeited rights by acting wrongly), or can it be fully captured by future benefits?
  *   **Left (Backward):** Punishment requires a past wrong to justify hardship.
  *   **Right (Forward):** Punishment is justified solely by future outcomes.

  *   **Leaf 1: Incoherent Retributivism**
      *   **Claim:** The offender deserves confinement despite lacking control over the lesion-driven act.
      *   **Awkward Commitment:** It must assert responsibility exists even when the agent could not have done otherwise.
      *   **Flag:** **Incoherent.** It asserts a desert claim while denying the control condition required to ground it.
  *   **Leaf 2: Classic Compatibilist Retributivism**
      *   **Claim:** The offender deserves confinement because deterministic causes do not negate their control.
      *   **Awkward Commitment:** It must accept that identical agents in identical deterministic worlds are equally blameworthy.
      *   **Flag:** **Defended.** This is the standard Dennett-style compatibilist position.
  *   **Leaf 3: Hybrid Consequentialist Retributivism**
      *   **Claim:** The offender deserves confinement, but only because imposing it yields future social benefits.
      *   **Awkward Commitment:** It must admit the offender would not deserve punishment if hiding them produced no social good.
      *   **Flag:** **Unexplored but Coherent.** It merges desert language with purely instrumental justification.

  ---

  ### Right Branch: The Intervention Framework

  **Node 4: Quarantine Collapse (Topic iii)**
  If confinement is non-punitive, does its severity or duration track the gravity of the past act rather than the present risk profile of the agent?
  *   **Left (Tracks Gravity):** Confinement scales with the harm caused.
  *   **Right (Tracks Risk):** Confinement scales with the likelihood of future harm.

  **Node 5: Expressive Recognition (Topic iv)**
  Can a system of confinement express societal condemnation and recognize the victim's claim without smuggling in a metaphysical notion of desert?
  *   **Left (Yes):** Expression is possible without retributive desert.
  *   **Right (No):** Expression necessarily implies retributive desert.

  **Node 6: Procedural Desert (Topic v)**
  Can an agent rationally endorse rules whose sanctions apply deterministically to her, thereby generating a non-retributive reason for punishment?
  *   **Left (Yes):** Endorsement creates a binding reason for sanction.
  *   **Right (No):** Endorsement cannot generate desert-like reasons under determinism.

  **Node 7: Validity of Consent (Extension)**
  If the offender voluntarily requests stricter confinement, does their consent legitimize the hardship independently of risk assessments?
  *   **Left (Yes):** Consent validates the confinement.
  *   **Right (No):** Only risk validates the confinement.

  *   **Leaf 4: Disguised Retributivism**
      *   **Claim:** The offender is confined for safety, but the term length matches the moral gravity of the crime.
      *   **Awkward Commitment:** It must detain low-risk offenders longer simply because their past crime was heinous.
      *   **Flag:** **Incoherent.** It claims to be non-punitive while using a punitive metric (gravity) for duration.
  *   **Leaf 5: Communicative Non-Retributivism**
      *   **Claim:** The offender is confined to communicate censure and recognize the victim, without claiming they deserve suffering.
      *   **Awkward Commitment:** It must inflict hardship while denying the offender deserves that hardship.
      *   **Flag:** **Defended.** Similar to Duff's communicative theory adapted for skepticism.
  *   **Leaf 6: Procedural Contractarianism**
      *   **Claim:** The offender is confined because they endorsed the rules that sanction such deterministic outcomes.
      *   **Awkward Commitment:** It must treat the offender as bound by rules they cannot ultimately avoid breaking.
      *   **Flag:** **Unexplored but Coherent.** A middle ground between Dennett and Caruso.
  *   **Leaf 7: Liberal Instrumentalism**
      *   **Claim:** The offender is confined based on risk, but their request for stricter terms is honored out of respect for autonomy.
      *   **Awkward Commitment:** It must allow self-harm (stricter confinement) if it does not increase public safety.
      *   **Flag:** **Defended.** Aligns with liberal paternalism in public health.
  *   **Leaf 8: Strict Public Health Model**
      *   **Claim:** The offender is confined strictly according to risk profile; their request for stricter terms is ignored.
      *   **Awkward Commitment:** It must deny the offender's sincere request for moral self-correction.
      *   **Flag:** **Defended.** This is the Caruso-style public health quarantine model.

  ---

  ### Meta-Analysis

  This taxonomy cannot cleanly separate **Leaf 7 (Liberal Instrumentalism)** and **Leaf 8 (Strict Public Health)**. Both share identical answers on determinism, quarantine metrics, and expressive value, diverging only on the weight of offender consent. This divergence stems from an **unmeasured normative weighting**: the relative priority of autonomy versus welfare. Similarly, **Leaf 2 (Classic Compatibilist)** and **Leaf 3 (Hybrid)** share metaphysical commitments but diverge on whether desert is intrinsic or instrumental. This is a **conceptual ambiguity** regarding the definition of "justification" that the tree captures only at the terminal stage. Finally, **Leaf 5 (Communicative)** and **Leaf 6 (Procedural)** both seek non-retributive censure; their separation relies on whether the source of obligation is social expression or individual endorsement, a distinction that may collapse in practice if expression requires endorsement.
