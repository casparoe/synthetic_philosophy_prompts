answer: |-
  **Private Working Phase**

  (a) **Features of the pond scenario doing argumentative work:**
  1.  **Single Agent:** One passer-by bears the full burden.
  2.  **Single Victim:** One child creates a focused moral claim.
  3.  **Immediate Causality:** Pulling out directly prevents drowning; no intervening agents.
  4.  **Modest Cost:** Ruined clothes are trivial compared to death.
  5.  **Certainty:** Drowning is immediate and certain without intervention.
  6.  **Encounter Structure:** Happens *to you* physically; no institutional mediation.
  7.  **Isolation:** Other bystanders are irrelevant to your duty.

  (b) **Transport to the *St. Louis* case:**
  1.  **Single Agent:** **Lost.** Multiple states (Cuba, US, Canada) shared the option set.
  2.  **Single Victim:** **Lost.** 937 passengers; collective claim.
  3.  **Immediate Causality:** **Lost.** Harm mediated by future Nazi occupation; different wrongdoers.
  4.  **Modest Cost:** **Contested.** State cost involves political capital, security, precedent, not just material goods.
  5.  **Certainty:** **Lost.** Future persecution was probabilistic at the time of refusal.
  6.  **Encounter Structure:** **Lost.** Institutional policy application, not physical encounter.
  7.  **Isolation:** **Lost.** Refusals were sequential and dependent on prior refusals.
  **Survivors:** The core principle (prevent very bad thing at modest cost) and the moral urgency of death.

  ***

  **Analysis**

  **1. The Mapping, Disciplined**
  The agents here are sovereign states acting through officials: Cuba, the United States, Canada, and eventually European democracies. The captain acts as a transporter, not a sovereign rescuer. Each state's option set was binary: admit the ship or refuse entry. The cost analogue to ruined clothes is not material expenditure but political capital, domestic security concerns, and the burden on welfare systems. For the United States, the cost included potential public unrest during the Depression and strict adherence to immigration quotas. The counterfactual chain is stark: refusal by Cuba forced the ship to seek alternatives; refusal by the US and Canada forced return to Europe; return to Europe placed passengers under Nazi jurisdiction; occupation led to the death of approximately a quarter of the passengers. The cost of refusal for the state was political convenience; the cost for the passengers was life itself.

  **2. Feature-by-Feature Transport**
  The pond argument derives force from simplicity: one agent, one victim, immediate cause. This case is multi-agent, sequential, and causally mediated. The argument's force depends primarily on the modesty of the cost relative to the bad averted. If the cost to the state is truly modest compared to mass death, the duty holds. However, the encounter structure matters. The pond relies on a visceral, physical demand. Institutional refusal is abstract. Where features are absent, the argument does not go quiet but becomes harder to apply because institutional duties are distributed. The absence of immediate causality weakens the grip; officials could claim they were not killing the passengers, merely refusing entry. Yet, if the principle holds that distance and other agents do not negate duty, this distinction should not matter morally, even if it matters psychologically.

  **3. Number and Scale**
  There are 937 victims, not one. The cost of admitting them does not scale linearly; the fixed costs of border processing and integration are shared. This multiplicity strengthens the moral weight of the claim (more lives saved) but complicates the cost assessment. Does the demandingness objection attach differently? If cost scales sub-linearly, the per-life cost is lower, strengthening the duty per individual. However, the aggregate cost might trigger the exemption clause where the cost to the agent becomes comparable to the bad averted. If admitting 937 refugees threatens the state's stability, the cost is no longer modest. But historically, the economic impact was negligible compared to the loss of life. The scale suggests the duty is stronger, not weaker, provided the state can absorb the fixed costs.

  **4. Overdetermination and Non-Compliance**
  Any single refusal was sufficient to doom the ship. No single state needed to admit everyone. A fair-share view implies each state should take a portion. A compliance-conditional view implies a state need only act if others do. A pick-up-the-slack view implies a state must act even if others refuse. The pond argument, staged for a lone bystander, implies a pick-up-the-slack view: you must save the child even if others walk by. It has no resources to distribute the burden among multiple states. It is silent on whether the US duty was reduced because Cuba refused first. This silence is a gap, not a negation; the argument dictates you must act, but not how to coordinate when many can act.

  **5. The Ratchet**
  Officials argued admitting these passengers would commit the state to admitting everyone similarly situated. This conflates three claims. First, an empirical claim: admissions trigger floods of applicants. Second, a fairness claim: it is unfair for one state to bear the global burden alone. Third, a rationalization: using the first two to excuse refusal. To tell them apart, one must test the empirical claim historically (did floods occur?) and isolate the fairness claim (should burdens be shared?). The pond argument is committed to the empirical claim's truth. If admitting the ship truly leads to admitting everyone, and admitting everyone destroys the state's capacity to function, the cost becomes comparable to the bad averted. The exemption clause activates. But if the flood claim is false, the ratchet is merely a rationalization, and the duty stands.

  **6. The Shore Problem**
  Once institutions rescue, the duty converts from a one-off pull to ongoing protection. The ultimate harm was inflicted by a different agent years later. Does the argument's grip depend on the rescue being a single completed act? The pond scenario suggests the duty ends when safety is reached. Here, safety was temporary. However, the intervention of another wrongdoer does not negate the duty to prevent the outcome if you can. The argument's posture on letting happen versus doing suggests that refusing entry (letting happen) is morally equivalent to sending back (doing) if the outcome is known. The temporal extension raises the cost, potentially shifting it from modest to significant, but does not erase the initial duty to provide sanctuary.

  **7. Verdict on the Theory**
  This episode exposes that the argument is under-specified, not false. It was engineered for one agent, one victim, and one afternoon. It handles the cost test well—refusals likely failed the modesty condition—but has no account of collective agents, sequenced refusals, or precedent effects. It treats the state as a monolithic individual, which obscures internal political costs. These are cases the theory never anticipated, not genuine anomalies that refute it. The theory is silent on how duties distribute among states, forcing us to import political philosophy to fill the gap. It vindicates the core intuition that comfortable refusals fail the cost test, but fails to guide action in a world of multiple potential rescuers.

  **Closing Revision**
  To address this, the argument requires a revision: "If multiple agents can avert the bad, the duty falls on those who can do so at the lowest marginal cost, but if others fail, the duty devolves to any remaining agent capable of bearing it." This creates a distributed duty rather than a lone bystander duty. The price exacted is a blunting of the rhetorical force. The pond works because it is small and closed; it shocks the conscience by isolating the agent. Adding clauses about collective distribution and marginal costs makes the principle more accurate but less intuitively immediate. It transforms a visceral punch into a policy calculation, potentially weakening its ability to motivate individual action in simpler cases.
