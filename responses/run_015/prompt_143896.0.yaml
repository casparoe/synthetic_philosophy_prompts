answer: |-
  **Roommate Pattern Truce Document**

  **1. Agreed claims**
  1. The universe is made of physical stuff (particles, fields, energy) that follows consistent laws.
  2. Dennett's three stances (Physical, Design, Intentional) are valid ways to describe systems, even if they operate at different levels.
  3. Prediction is the main way we test if a description is working—if you can't predict what happens next, your model is bad.
  4. Slime molds definitely find the shortest path through a maze to get food, even though they don't have brains.
  5. Hurricanes definitely maintain their structure over time and react to changes in their environment.
  6. Fundamental physics equations don't include words like "goal," "strategy," or "pattern."
  7. Even if a pattern is just in our heads, it's still useful for navigating the world.
  8. We both want to know if "pattern" refers to something out there in the world or just a shortcut in our brains.

  **2. The disagreements table**

  | My wording | His wording |
  | :--- | :--- |
  | If a pattern lets you reliably predict outcomes, it's real enough to count as existing. | Patterns are only "real" if they exist in the fundamental physics, otherwise they're just useful fictions. |
  | The Design stance reveals actual structure in the world, not just how we talk about it. | The Design stance is a metaphor we layer on top of physics to make sense of complexity. |
  | When a hurricane maintains itself, it's actually doing something active, not just being pushed. | The hurricane is just pressure differences equalizing; saying it "maintains itself" is projecting agency. |
  | Slime mold solving a maze is a form of computation happening in the world. | Slime mold following chemicals is just physics playing out; calling it "solving" is human projection. |
  | Real patterns emerge and have causal power on their own level. | Only the bottom-level particles have causal power; everything else is just description. |

  **3. The cruxes**

  *   **Crux 1: The Slime Mold Maze**
      *   *The Case:* We put a slime mold in a maze with food at the end. It expands and finds the food.
      *   *My Prediction:* The mold is processing information about the maze structure. The pattern of the solution exists in the interaction between mold and environment.
      *   *His Prediction:* The mold is just reacting to local chemical gradients. The "solution" only exists when we look at it from above and draw a line.

  *   **Crux 2: The Hurricane Survival**
      *   *The Case:* A hurricane hits land and weakens, but over water, it pulls energy to stay strong.
      *   *My Prediction:* The storm has a self-preserving pattern. If you intervene to help it, it responds in a way that keeps the pattern going.
      *   *His Prediction:* It's just thermodynamics. There is no "it" trying to stay alive, just heat moving from warm water to cool air until equilibrium.

  *   **Crux 3: The Chess Computer**
      *   *The Case:* A computer plays chess against a grandmaster and makes a sacrificial move to win later.
      *   *My Prediction:* The computer literally "wanted" to win and "saw" the strategy. The intentional stance is tracking real states in the system.
      *   *His Prediction:* The computer executed code. Saying it "wanted" anything is a story we tell to explain the output, not what's actually happening in the silicon.

  **4. Is this partly just words?**
  Yeah, probably some of it. We might both agree on all the physical facts and how to predict them, but we fight over whether we're allowed to call those patterns "real." If I say real means "predictively useful" and he says real means "fundamentally physical," we aren't actually disagreeing about the world, just how we recieve the definition of the word. But there's still a genuine split on whether higher-level stuff can actually cause things to happen, or if it's just passengers along for the ride.
