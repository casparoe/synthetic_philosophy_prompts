answer: |-
  Here is the plain truth before we begin: the premise is normatively confused. Nietzsche's typology in *On the Use and Abuse of History for Life* is diagnostic of psychological attitudes, not an archival ethic. His metric is 'life-enhancement', not accuracy. If you use these modes to decide which contradictory narrative is 'true'—official record or living memory—you are misapplying the tool. Archives are bound by provenance and verification; Nietzsche is bound by vitality. Using him to adjudicate fact is a category error that risks legitimising fabrication under the guise of 'critical' or 'monumental' utility.

  However, if you shift the goal from *adjudicating truth* to *managing the presentation of conflict*, the typology becomes viable. You are not choosing which story wins; you are choosing how the tension between them serves the community.

  Given your constraints (three people, two years, no technical bulk-processing), here is the prioritised order of work.

  ### 1. Define the Ethical Boundary Between 'Use' and 'Fabrication'
  **The Question:** At what point does foregrounding a 'living memory' narrative over a verified record cease to be 'Critical history' (liberating the present) and become misinformation?
  **Why First (Dependency):** This is the foundational constraint. If you cannot agree on whether accuracy is negotiable for the sake of community cohesion, the project collapses immediately. Nietzsche gives you permission to ignore the past for the sake of the future; heritage ethics generally do not. You must draft a local policy that specifies when the 'official record' is inviolable (e.g., legal deeds, dates of birth) versus where it is interpretive (e.g., motives, community impact).
  **Tractability:** High. This requires workshops with your steering group, not new technology. It is a policy decision, not a research marathon.
  **Evidence to Shift Ranking:** If your legal counsel indicates high liability risk regarding the specific contradictions, this becomes the *only* workstream. If the contradictions are purely interpretive (e.g., 'was this figure benevolent or exploitative?'), this moves down.

  ### 2. Identify the Agent of the 'Critical' Mode
  **The Question:** Who is authorised to wield the 'Critical' hammer against the official archive?
  **Why Second (Dependency):** Once you know you *can* challenge the record (within the bounds of Q1), you must decide *who* gets to do it. In the backroom, the 'Antiquarian' mode (preservation of the record) is the default setting of the institution. The 'Critical' mode (judging the past) is politically volatile. If your three-person team imposes the Critical mode on local memory, you replicate the colonial/official dynamic you aim to fix. If you hand the Critical mode entirely to the community, you risk losing curatorial coherence.
  **Tractability:** Medium. This requires negotiation and governance structures. It is time-consuming but feasible in two years if scoped to specific exhibits rather than the whole collection.
  **Evidence to Shift Ranking:** If community trust is already critically low, this moves to Priority 1. You cannot define ethics without knowing who holds the power.

  ### 3. Test Object-Level Hybridity vs. Narrative Segregation
  **The Question:** Can a single object sustain contradictory modes simultaneously, or must the narratives be spatially separated?
  **Why Third (Tractability):** This is the design phase. Do you label an object with both the official record and the oral testimony (Hybrid), or do you create separate zones for 'Archive' and 'Memory' (Segregation)? Nietzsche suggests the modes are attitudes of the *historian*, not properties of the *object*. Trying to make one object be both 'Antiquarian' (revered document) and 'Critical' (condemned symbol) often confuses the visitor.
  **Tractability:** High. This is prototyping. You can test this with temporary displays before committing to a permanent programme.
  **Evidence to Shift Ranking:** If visitor testing shows that hybrid labeling creates confusion rather than dialogue, you must pivot to segregation. If the collection is too small to segregate, hybridity becomes mandatory.

  ### Summary of Defence
  I have prioritised **Ethics** over **Power** over **Design**.
  1.  **Ethics:** You cannot build on a normative confusion. You must resolve the Truth vs. Use tension first.
  2.  **Power:** Once the ethical lane is marked, you must decide who drives.
  3.  **Design:** Finally, you decide what the vehicle looks like.

  If you attempt Design (Q3) before Ethics (Q1), you risk producing a polished exhibition that is ethically indefensible. If you attempt Power (Q2) before Ethics (Q1), you risk political deadlock.

  **Final Warning:** Do not use Nietzsche to justify ignoring the paper record. Use him to justify why the paper record alone is insufficient for a living community. The modes should frame the *gap* between memory and document, not erase it. If your programme aims to erase the contradiction, the framing has already collapsed.
