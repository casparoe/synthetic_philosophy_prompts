      *   *Potential Agents:* Internalists often rely on *potential* agents (if someone *were* rational, they would care). The scenario must close off potential agents too.
      *   *Epistemic Access:* Does a reason exist if no one can know it?
      *   *The "Ought Implies Can" constraint:* If no one can be motivated, can there be an obligation?

  3.  **Constructing the Thought Experiment:**
      *   *Setting:* Ordinary workplace.
      *   *Constraint:* One paragraph.
      *   *Goal:* Externalism = Wrong; Internalism = No Wrongness.
      *   *Challenge:* Internalism (Williams-style) says a reason must link to the agent's subjective motivational set (SMS). If no agent has a motive (even after rational deliberation), there's no reason. If there's no reason, there's no normative requirement. If no requirement, no wrongness.
      *   *Scenario Idea:* A mundane administrative task that prevents a future harm, but the person responsible has zero motivation (psychopathic/disengaged) and no one else is affected enough to care, and the harm is impersonal or affects no existing agent's interests.
      *   *Refinement:* To make Internalism say "no wrongness at all," the omission must not violate any reason anchored in *anyone's* motivational set. This is hard because usually, harm to others provides reasons.
      *   *Solution:* The harm must be to something that doesn't generate a motive in the agent *and* no other agent exists who cares. Or, the agent is uniquely positioned to prevent a loss of value that no one currently values or would value upon reflection.
      *   *Better Idea:* A "lonely negligence" case. An employee is tasked with archiving data. The data contains proof of a minor injustice that happened decades ago to people now dead. No living person knows about it or cares. If archived correctly, the truth is preserved (a value). If deleted, the truth is lost. The employee, due to a specific psychological quirk (not insanity, just deep apathy), has no desire to preserve truth and no desire to follow rules. No one else knows the data exists.
      *   *Internalist Check:* Does the employee have a motive? Ex hypothesi, no. Does anyone else? No, they don't know. So no anchored reason.
      *   *Externalist Check:* There is a reason to preserve truth/history regardless of desires. Omission is wrong.
      *   *Drafting the paragraph:* Needs to be tight.

  4.  **Walking Through the Views:**
      *   *Externalism (Realism):* Reasons are facts. The fact that "this data preserves historical truth" is a reason. Ignoring it is wrong.
      *   *Internalism (Williams-style):* Reasons require a link to the SMS. If the agent has no desire (even dispositional) to preserve truth, and no one else is affected (no victim to generate reactive attitudes), there is no reason. If no reason, no normative violation. Hence, no wrongness.

  5.  **Identifying the Split Feature:**
      *   The disconnect between *value* and *motivation*. The existence of a normative fact independent of psychological states.

  6.  **Internalist Counter-Attack:**
      *   *Strategy 1:* Posit a "rational agent" ideal. If the agent were fully rational, would they care? (The procedural internalist move).
      *   *Strategy 2:* Expand the motivational set to include abstract commitments (e.g., "being an employee").
      *   *Assessment:* Does this succeed? If the agent is stipulated to be incapable of caring even upon reflection, the internalist must deny the reason exists. This risks making normativity too contingent.

