answer: |-
  These accounts are not competing definitions of the same right but distinct moral languages that talk past one another, where the danger-anchored view sees a temporary shelter and the accrued-membership view sees a permanent home.

  On the question of who counts, the danger-anchored account requires a specific antagonist, meaning it struggles to accommodate those fleeing drought, economic collapse, or general disorder unless those conditions are framed as targeted persecution. It demands a narrative of victimhood focused on who is hunting the claimant, which excludes many modern drivers of displacement that are structural rather than personal. The accrued-membership account bypasses the origin story entirely; it counts anyone who has successfully embedded themselves in the social fabric, regardless of whether they fled a militia or a famine. Where the first account asks "Who hurt you?", the second asks "Who knows you?", making the latter far more capacious for those fleeing non-human predators like climate or market failure.

  Regarding who must take them in, the danger-anchored account posits a universal humanitarian duty that any capable state may discharge, rendering the specific destination morally interchangeable. This logic supports the "safe third country" rule, allowing a state to return a claimant to any nation where they would not be killed, even if they have no ties there. The accrued-membership account argues that the duty is relational and particular, owed specifically by the community where the labor, singing, and neighborliness occurred. On this view, returning a claimant to a safe third country is not merely inconvenient but unjust, because it severs the specific web of obligations that generated the claim in the first place.

  On the wrinkle of state delay, the danger-anchored account treats time as neutral erosion, where the freshness of the threat matters more than the reason for the wait. It allows the state to argue that the danger is stale, regardless of whether the state's own bureaucracy caused the staleness. The accrued-membership account treats time as accumulative debt, where the state's delay is the very mechanism that allowed the membership to grow. Here, the state is estopped from citing the safety it failed to adjudicate against the person who waited; the delay transforms the claim from one of emergency protection to one of procedural fairness.

  When the original peril has ended but ties remain, the danger-anchored account declares the claim extinguished, reducing any further stay to an act of charity rather than obligation. The logic dictates return because the condition justifying the exception (danger) no longer exists. The accrued-membership account argues the claim has matured, shifting the burden from the claimant's fear to the community's disruption. Expulsion becomes the active harm requiring justification, rather than residence being the exception requiring justification, because the moral cost of uprooting a member now outweighs the logic of repatriation.

  These accounts are legally rivals but logically sequential. In a hearing, they compete because accepting one often precludes the need for the other, yet structurally, accrued membership functions best as an independent claim that activates when danger-anchored asylum expires. Reading them as sequential rather than rivalrous changes the scene from a debate about the past (was she ever safe?) to a judgment on the present (is she now one of us?). If treated as independent, the woman need not prove the militia still seeks her; she admits the danger may have passed but argues a new right has been born from the state's failure to decide. This shifts the burden of proof from her credibility regarding the past to the state's responsibility for the present.

  I am highly confident in the structural distinction between the two accounts and their implications for state obligation. I am least sure about the political viability of treating accrued membership as an independent claim within existing legal frameworks, as most systems force these distinct moral arguments into a single binary decision where one must negate the other.
