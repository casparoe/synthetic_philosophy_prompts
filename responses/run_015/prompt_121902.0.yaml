  Nevertheless, I recommend approving the ABI bound by the asymmetric escrow protocol, with stringent modifications. This position requires engaging seriously with the strongest opposing argument: that competitive markets in science correct errors faster than coordinated protocols, and that escrow governance is too brittle to survive industry pressure.

