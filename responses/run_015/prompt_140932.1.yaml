answer: |-
  Form 88-B sits on the kitchen table in Portland, waiting for a signature. It asks me to designate the Primary Vessel. Below the checkbox for "Portland" is the checkbox for "Cleveland." One gets the name, the mortgage, the daughter, the tax ID. The other gets a new name generated by an algorithm, a stipend, and a one-way ticket to wherever a stranger starts over.

  The link is still active. I feel the hum of it behind my eyes, a sterile bridge spanning two thousand miles. Technically, I am one person. Practically, I am managing a merger that is failing due to cultural differences.

  In Portland, the left hemisphere wakes at 6:00 AM. I know this because I smell the rosemary on the windowsill. It's a silly thing to fixate on, but the scent is sharp, green, and immediate. That body waters the plant every morning. It runs three miles. It packs a lunch. It looks at the form and feels a tight, responsible anxiety in the chest cavity. It wants to secure the daughter's future.

  In Cleveland, the right hemisphere wakes at 9:30. I know this because I feel the bass of the neighbor's TV through the drywall. It's a rhythmic thumping, warm and intrusive. That body buys vinyl records. It stays out late talking to bartenders. It looks at the form and feels a creative restlessness. It bought a leather jacket yesterday. I felt the leather creak on my shoulders in Cleveland while my hands in Portland were typing this sentence.

  We leave notes in the shared cloud drive. *Please don't buy any more jackets,* Portland types. *You need to eat something that isn't kale,* Cleveland replies. Neither of us is lying. Neither of us is sabotaging. We are just drifting. The bandwidth is high, but the latency of desire is growing. I want to save money; I want to spend it. I want silence; I want the thumping bass.

  The clinic brochure sits next to the form. It features a smiling woman holding a tablet. "Personhood is defined by effective agency," the text reads. "You are located wherever your intentions still reach. Where you can act, you are." It is meant to be reassuring. It suggests that identity is a verb, not a place.

  I find it useless. It answers the question of *location*, but I am asking the question of *continuity*. If I intend to save money in Portland and intend to spend it in Cleveland, where is the agency? The brochure assumes a singular vector. It doesn't account for divergence. The nurse told me over the phone, voice bright and practiced, "Don't worry about the metaphysics, honey. Just pick where you want to wake up on the 31st."

  But I won't be waking up on the 31st. One of us will. The other will be someone else who remembers being me up until the switch flips.

  The deadline is tomorrow. The link status in the corner of my vision counts down. 14 hours.

  Portland is filling out the form. The pen feels heavy. The rosemary smells like rain. Cleveland is listening to the neighbor's TV, a sitcom laugh track bleeding through the wall. That hand is holding a glass of wine. I can feel the weight of the glass in Cleveland and the weight of the pen in Portland. They are equally real. The hum behind the eyes is starting to sound like static.

  If I sign for Portland, Cleveland dies. If I sign for Cleveland, Portland dies. But who is the "I" holding the pen? Is it the one who loves the rosemary? Or the one who loves the bass? Or is it the signal between them, which is about to be severed?

  The brochure says I am where I act. I am acting in two cities. I am loving two different lives. The form demands a singular answer to a plural condition.

  10 hours.

  The static is louder. It's hard to tell which thought originates where. Did I decide to run this morning, or did Cleveland decide to sleep in? The memories are syncing poorly. The daughter's face is clear in Portland, fuzzy in Cleveland. The taste of the wine is vivid in Cleveland, distant in Portland.

  We are filling out the form. No, I am. No, we are.

  The clinic says the cut is clean. No pain. Just a silence where the hum used to be. One body will blink and continue. The other will blink and be a stranger wearing your face. They say the stranger won't suffer. They say the stranger will be grateful for the stipend.

  8 hours.

  The rosemary is drying out. The TV is off. The pen hovers over the box. If I check Portland, I kill the part of me that likes the night. If I check Cleveland, I kill the part of me that keeps the promises.

  Maybe the brochure is right. Maybe I am just the intention. But the intention is splitting. The vector is bifurcating.

  4 hours.

  It doesn't matter which box is checked. The name is just administrative. The question isn't who survives. The question is whether survival requires a singular noun.

  2 hours.

  The hand moves. The pen touches the paper. The hum stutters.

  I am writing this. We are writing this. The ink dries on the page. The rosemary smells like nothing. The TV thumps through the wall.

  When the link cuts, will there be one person left to read this? Or will there be two readers, both claiming the text, both wondering why the ending feels like a beginning for someone else?

  The box is checked. The countdown hits zero.

  The silence arrives. It is loud.

  I am here. Are you there?

  Or are we both just waiting to see who picks up the pen?
