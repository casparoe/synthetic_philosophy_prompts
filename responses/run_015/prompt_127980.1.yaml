      *   *Section 2: Confused Perception vs. Apperception.* Explain Sections 14, 20-24. Distinguish between metaphysical imperfection (confusion) and conscious pain.
      *   *Section 3: The Aggregation Problem (The Core).* Explain Sections 3, 67-69. The difference between a true unity (dominant monad) and a heap. This directly addresses the "vacuum-ensemble" worry. If there's no dominant monad, there's no unified subject to suffer.
