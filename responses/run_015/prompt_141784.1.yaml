answer: |-
  **Brainstorming**

  *   **Theoretical Debate:** Students are assigned a view and must defend it against case variations.
      *   *Experience:* Participants feel the pressure of articulating a position they have not yet learned.
      *   *Weakness:* Premature theorising obscures the intuitive verdicts the activity aims to elicit.
  *   **The Confidence Betting Market:** Students bet chocolate on whether the subject 'knows', with odds shifting based on stakes.
      *   *Experience:* Participants feel the financial risk of attributing knowledge incorrectly.
      *   *Weakness:* Conflates confidence levels with the truth conditions of knowledge ascriptions.
  *   **The Transmission Chain:** A Subject verifies, an Ascriber reports, an Operator acts on the report alone.
      *   *Experience:* Participants feel the friction between what is said and what can be safely acted upon.
      *   *Weakness:* Logistics of moving cards and people might eat into discussion time.

  **Design: The Transmission Chain**

  I recommend the third option. It isolates the semantic variable by forcing a practical commitment on the basis of a knowledge claim alone.

  **Materials and Setup**
  You need a whiteboard, index cards (three colours), and a bag of chocolates. Arrange chairs into four pods of three, with two students acting as independent auditors. The scenario is fixed: Mira (Subject) needs to know if the Brighton train runs on Saturday. Evidence: checked timetable two weeks ago + colleague's word. This evidence card never changes.

  **Payoff and Roles**
  Each pod has a Subject, an Ascriber, and an Operator. The Operator holds a 'Resource Token' (a chocolate). They gain a chocolate if they act correctly on the truth of the matter; they lose one if they act on a false knowledge claim. The Ascriber must write either 'Mira knows the train runs' or 'Mira does not know' on a card. No hedging, no probabilities. The Operator sees only this card and must decide whether to book the ticket (act) or walk away (refrain).

  **Timeline and Rounds (90 Minutes)**

  *   **00–05:** Setup. Distribute roles and evidence cards. Explain the payoff: Operators lose chocolates for acting on false 'knows'.
  *   **05–15:** Round 1 (Baseline). Low Subject stakes (casual trip), Low Operator stakes (flexible schedule), Quiet Ascriber context (no error talk).
  *   **15–25:** Round 2 (Subject Stakes). High Subject stakes (Mira misses train = missed wedding), Low Operator stakes, Quiet Ascriber.
  *   **25–35:** Round 3 (Ascriber Context). Low Subject stakes, Low Operator stakes, Loud Ascriber (you read out a news report about timetable errors to the Ascribers only).
  *   **35–45:** Round 4 (Operator Stakes). Low Subject stakes, High Operator stakes (Operator misses train = missed wedding), Quiet Ascriber.
  *   **45–50:** Break and Data Collection.
  *   **50–70:** Whiteboard Grid and Analysis.
  *   **70–90:** Debrief and Closing.

  **The Whiteboard Grid**
  Draw a table with four rows (Rounds 1–4) and columns for Subject Stakes, Ascriber Context, Operator Stakes, and Verdict ('Knows' %). Ask each pod to raise hands for their Ascriber's verdict. Record the percentage.
  *   **Contextualism** predicts 'Not Knows' only in Round 3 (Ascriber context shifts standards).
  *   **Pragmatic Encroachment** predicts 'Not Knows' only in Round 2 (Subject stakes shift truth).
  *   **Reliance-Relative Invariantism** predicts 'Not Knows' only in Round 4 (Operator stakes shift truth).
  *   **Diagnostic Weight:** Round 4 is crucial. It isolates the third view. If verdicts drop here while Rounds 2 and 3 remain high, Reliance-Relative Invariantism gains plausibility.

  **Debrief**
  Begin by naming the views. Map Round 2 to Pragmatic Encroachment: the subject's practical situation altered the truth value. Map Round 3 to Contextualism: the conversational context altered the standards. Map Round 4 to Reliance-Relative Invariantism: the stakes of the *listener* determined the truth.

  If a student says, "It just depends on what you mean by 'knows'", acknowledge this is precisely the debate: is the meaning fixed (Invariantism) or shifting (Contextualism)? The activity shows that regardless of meaning, practical outcomes shift. If a student insists, "Mira should just check", point out that epistemology concerns when checking is *necessary*. If she 'knows', checking is wasteful; if not, it is required. The activity forces them to decide if she knows *now*.

  I expect the group to find Pragmatic Encroachment most attractive initially, as the Subject's stakes feel most relevant to whether *they* know. Reliance-Relative Invariantism will seem novel but compelling if Operators felt genuinely unsafe acting in Round 4.

  **Closing Notes**

  **Predictable Failures and Remedies**
  1.  **Hedging:** Ascribers will try to write 'Mira probably knows'. *Remedy:* Collect and discard any card with modals; force a rewrite.
  2.  **Collusion:** Pods might discuss rounds between trials. *Remedy:* Collect all cards after each round before discussing.
  3.  **Boredom:** Auditors may disengage. *Remedy:* Give auditors veto power over unfair payoff distributions.

  **Limitations**
  Be frank: this activity elicits verdicts about willingness to act, not purely semantic intuition. It cannot distinguish a genuine semantic shift in 'knows' from a pragmatic implicature (e.g., 'I know' implying 'It is safe to act'). The pattern on the board is consistent with all three views explaining away the others as pragmatic noise. You must supply the philosophical distinction in the closing lecture: Contextualism claims the *word* changes meaning; Encroachment claims the *fact* of knowledge changes; Reliance-Relative claims the *norm of assertion* changes. Furthermore, the staging cannot capture the full metaphysical weight of Reliance-Relative Invariantism; it makes it look like a norm of communication, whereas the theory claims it fixes truth conditions. You must clarify that distinction yourself.
