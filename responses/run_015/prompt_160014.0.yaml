  Here is a draft proposal structured for a small independent research fund. I have kept the language precise and British, avoided specific citations as requested, and included **Philosophical Status Notes** after each section to highlight settled vs. live disputes and potential framing risks.

  ***

  # Project Title: Implicature Without Intent: A Pragmatic Framework for Generated Text

  ## 1. The Research Question
  Standard pragmatic theory relies on counterfactuals about a speaker's choices to identify conversational implicature (e.g., 'If the speaker had not meant *p*, they would have said *q*'). In automated text generation—ranging from stochastic language models to rigid notification templates—there is often no identifiable agent who made those choices, nor a determinate fact about what else 'could' have been produced. Yet, users consistently draw defeasible inferences from this text which function exactly like implicatures in social contexts.

  **Primary Question:** Do the standard diagnostic tests for conversational implicature (specifically cancelability and calculability) remain valid when the 'speaker' condition is removed or indeterminate, or does the failure of these tests necessitate a shift from an intentionalist account of meaning to an account based on hearer entitlement and system design?

  **Secondary Question:** If the tests fail, can we formulate a 'Design Implicature' norm that tells system builders when they are responsible for inferences they did not explicitly intend?

  > **Philosophical Status Note:**
  > *   **Settled:** That Gricean pragmatics is fundamentally intentionalist (speaker meaning is primitive).
  > *   **Live Dispute:** Whether the tests (cancelability, etc.) are *constitutive* of implicature or merely *diagnostic*. Your framing assumes they are at least necessary conditions; if they are merely contingent symptoms, their failure in AI cases might not matter philosophically, though it matters practically.
  > *   **Contested Framing:** You are treating 'the speaker condition' as binary (present/absent). Some argue for 'distributed agency' where the designer, the model, and the user co-constitute the speaker. This proposal treats that as a hypothesis to be tested, not a starting assumption.

  ## 2. Gap Analysis: Why Existing Positions Do Not Settle This
  Three dominant approaches currently exist, but none adequately address the specific tension between stochastic generation and pragmatic inference.

  1.  **Strict Intentionalism:** Holds that without a mental state, there is no speaker meaning, and therefore no implicature. This view dismisses the user's experience as 'error' or 'anthropomorphism'. This is insufficient for engineering ethics: if users act on the inference (e.g., believing a loan application was rejected due to credit score rather than a system error), the practical consequence is identical to human deception, regardless of the metaphysical status of the 'speaker'.
  2.  **The 'Designer-as-Speaker' Move:** Attributes the intention to the human developers or the deploying company. This works for hard-coded templates but fractures under stochastic generation. If a model produces an output via probabilistic sampling that no human reviewed, claiming the developer 'meant' that specific implicature is legally and philosophically tenuous. It relies on a theory of collective intentionality that does not scale to non-deterministic outputs.
  3.  **Hearer-Default/Relevance Approaches:** Focuses entirely on the cognitive mechanisms of the interpreter. While this bypasses the need for a speaker, it risks making the system builder blameless for any inference a user happens to draw. It lacks a normative component: it explains *why* a user inferred *p*, but not whether the system *warranted* that inference.

  This project occupies the gap between these positions: acknowledging the hearer's cognitive reality while seeking a normative standard for the system designer that does not rely on fictitious mental states.

  > **Philosophical Status Note:**
  > *   **Settled:** That Strict Intentionalism struggles with non-human communication.
  > *   **Live Dispute:** The 'Designer-as-Speaker' move is heavily debated in philosophy of language (corporate speech) and law. Your proposal correctly identifies that stochasticity breaks this link, which is a strong, novel contribution.
  > *   **Contested Framing:** You characterise the Hearer-Default line as lacking a normative component. Proponents of Relevance Theory might argue cognitive effects *are* the norm. You will need to defend the claim that 'entitlement' is distinct from 'psychological expectation'.

  ## 3. Methodology and Timeline (6 Months Part-Time)
  Given the word limit (~5000 words) and the lack of library access, the method will be conceptual analysis applied to engineered case studies, rather than empirical user research or deep historical exegesis.

  **Month 1: Taxonomy of Generation.**
  Define three categories of text generation to test against the implicature criteria:
  1.  **Hard-Template:** (e.g., "Your password expires in [X] days"). Clear authorial intent.
  2.  **Retrieval/Selection:** (e.g., Support bot selecting from pre-approved paragraphs). Mixed intent.
  3.  **Stochastic Generation:** (e.g., LLM summarising a ticket). Indeterminate intent.

  **Month 2: The Cancelability Test.**
  Apply the cancelability test across the taxonomy. In human speech, one can say "I implied *p*, but actually *not-p*". In systems, 'cancellation' happens via UI context, disclaimers, or follow-up messages. I will analyse whether these technical cancellations function pragmatically like linguistic cancellations.
  *Deliverable:* Draft section on the failure of counterfactuals in stochastic cases.

  **Month 3: The Calculability & Non-Detachability Tests.**
  Analyse whether the inference relies on the specific wording (detachability) or the cooperative principle (calculability). If a model generates a polite refusal, is the implicature "I am refusing you" detachable if the model had used rude words? If the system has no 'cooperative principle', what replaces it?
  *Deliverable:* Draft section on 'System Norms' replacing 'Conversational Maxims'.

  **Month 4: Synthesis and 'Design Entitlement'.**
  Develop the alternative framework. If speaker meaning is removed, what grounds the inference? I propose 'Design Entitlement': a user is entitled to an inference if the system architecture makes that inference the most rational path, regardless of developer intent.
  *Deliverable:* Core argument of the paper.

  **Month 5: The Practical Annexe.**
  Translate the philosophical findings into heuristics for engineers. (e.g., "If your system cannot technically cancel an inference, do not generate text that invites it.")
  *Deliverable:* 2-page guide.

  **Month 6: Review and Polish.**
  Refining arguments, checking for scope creep, ensuring the distinction between 'meaning' and 'effect' is maintained.

  > **Philosophical Status Note:**
  > *   **Settled:** That cancelability is the most robust of the tests. Focusing here is methodologically sound.
  > *   **Live Dispute:** Whether 'Non-Detachability' applies to all implicatures (some argue conventional implicatures are detachable). Stick to conversational implicature to avoid this rabbit hole.
  > *   **Scope Warning:** Six months part-time is tight for developing a new normative framework ('Design Entitlement'). Be prepared to scale back to *critiquing* the old framework rather than fully *building* the new one if the writing stalls.

  ## 4. Justification of Approach
  **Why not an empirical study?**
  Empirical work (e.g., A/B testing user reactions to cancellations) describes *what* users infer. This project addresses *what they are entitled to infer*. An empirical study cannot answer the normative question of responsibility. If users consistently misunderstand a system, an empirical study reports the error rate; this project determines whether the system design was misleading.

  **Why not metaphysics of AI mind?**
  Debates on whether models 'have intentions' are currently stalled and often hinge on definitions of consciousness. This project brackets that question. It asks: even if the model has no mind, does the *structure of the communication* sustain pragmatic norms? This makes the findings useful regardless of the outcome of the AI consciousness debate.

  **Why this specific wedge?**
  Focusing on the counterfactual nature of the tests (what the speaker *could* have said) leverages my background in engineering. I can demonstrate technically why the counterfactual is indeterminate in stochastic systems (e.g., temperature settings, sampling paths) in a way a pure philosopher cannot.

  > **Philosophical Status Note:**
  > *   **Settled:** The distinction between descriptive (empirical) and normative (philosophical) claims is standard.
  > *   **Contested Framing:** You are assuming the 'metaphysics of AI mind' is a dead end. Some philosophers of cognitive science would argue you cannot separate the pragmatic norms from the cognitive architecture. You should acknowledge this briefly to show awareness, but maintain that for *engineering ethics*, the functionalist approach is sufficient.

  ## 5. Possible Conclusions and Decision Criteria
  The project will likely land on one of three conclusions:

  1.  **The Error Theory:** The tests fail, therefore there is no implicature in generated text. Users are systematically mistaken.
      *   *Decision Criterion:* If 'Design Entitlement' cannot be grounded without fictitious intent.
  2.  **The Proxy Speaker:** The tests hold, but the 'speaker' is legally/philosophically the deploying organisation.
      *   *Decision Criterion:* If we can successfully map corporate liability to pragmatic intent without requiring individual mental states.
  3.  **The Pragmatic Shift (Preferred):** The tests are symptoms, not constitutive rules. Implicature survives based on 'System Reliability' rather than 'Speaker Intent'.
      *   *Decision Criterion:* If we can show that users are rational to draw inferences from systems even when counterfactuals are indeterminate, provided the system is designed to be reliable.

  > **Philosophical Status Note:**
  > *   **Live Dispute:** Whether the tests are constitutive or symptomatic is the crux of your project. If the literature already overwhelmingly agrees they are merely symptomatic, your project loses novelty. Current consensus is mixed: they are often treated as necessary conditions in introductory texts, but contested in advanced pragmatics. You must verify the current state of this specific debate early in Month 1.

  ## 6. Failure Conditions
  This project would fail if:
  1.  **Redundancy:** It turns out 'Post-Gricean' pragmatics has already fully resolved non-human communication (e.g., in bio-semiotics or institutional speech act theory) in a way that renders the 'AI' case uninteresting.
  2.  **Category Error:** The analysis reveals that 'implicature' is simply the wrong tool for human-computer interaction, and the phenomena are better described as 'affordances' or 'conditioned responses'.
  3.  **Scope Creep:** The attempt to build a new normative framework ('Design Entitlement') proves too large for 5000 words, resulting in a paper that identifies a problem but offers no solution.

  > **Philosophical Status Note:**
  > *   **Honest Scope:** Condition 3 is the highest risk. 5000 words is very short for a philosophy paper. You may need to limit the paper to *arguing for the failure of the tests* and leave the *new framework* for the practical annexe or a future paper.

  ## 7. Realistic Scope and Constraints
  **Word Count:** 5000 words is approximately 10–12 single-spaced pages. This is sufficient for a tight argument but not a comprehensive survey. I will restrict the philosophical analysis to **Cancelability** only, as it is the most critical test for your argument regarding counterfactuals. I will mention the others but not analyse them in depth.

  **Library Access:** Without institutional access, I will rely on open-access preprints and standard texts I already possess. I will avoid historical exegesis (e.g., "What did Grice *really* mean in 1975?") and focus on contemporary applications of the theory.

  **Supervision:** Without a supervisor, I will mitigate the risk of 'amateur error' by sticking to the engineering constraints. I will not attempt to solve the nature of intention, but rather demonstrate where the current tools break for a builder. The practical annexe ensures the project has value even if the philosophical contribution is incremental.

  > **Philosophical Status Note:**
  > *   **Strategic Advice:** Limiting the scope to **Cancelability** is the wisest move. It is the most famous test and the one most reliant on speaker counterfactuals ("I didn't mean that"). Non-detachability is harder to argue without deep linguistic knowledge.
  > *   **Risk:** By ignoring Relevance Theory (which downplays Gricean maxims), you risk missing the main competitor. You do not need to read the whole corpus, but you must understand the basic objection: that communication is about optimizing cognitive effects, not following rules. If Relevance Theory already handles non-intentional systems, your project needs to explain why it doesn't solve the *ethical* problem for builders.

  ***

  # Practical Annexe (Draft Outline)
  *To be included in final deliverable*

  **Title:** Pragmatic Risk Assessment for Text Systems
  **Audience:** Engineering Leads / Product Managers

  1.  **The Cancellation Check:** If your system generates an inference (e.g., "We suspect fraud"), is there a technical mechanism to cancel it immediately if challenged? If no, do not generate the inference.
  2.  **The Counterfactual Audit:** For stochastic systems, acknowledge that you cannot know what the model *didn't* say. Treat all outputs as 'assertions' rather than 'implicatures' to minimize liability.
  3.  **Template vs. Generation:** Use templates for high-stakes implicatures (rejections, warnings). Use generation for low-stakes summarisation.
  4.  **User Entitlement:** Assume the user is rational. If the system design makes an inference the 'path of least resistance', you are responsible for it, regardless of disclaimers.

  ***

  ### Final Advice for the Applicant

  You have a genuine wedge here. The intersection of stochasticity and pragmatics is under-theorised because philosophers don't usually understand temperature sampling, and engineers don't usually read Grice.

  However, be very careful with the claim that **"there isn't a fact of the matter about what it would have produced instead."** In computer science, given a seed and weights, there *is* a determinate output. The philosophical indeterminacy comes from the fact that the *developer* doesn't know it, not that the universe doesn't know it. You need to phrase this carefully: focus on the **unavailability of the counterfactual to the interlocutor**, not metaphysical indeterminism.

  Good luck. This is fundable if you keep the scope tight.
