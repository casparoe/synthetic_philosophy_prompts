  There is no single, canonical term in philosophy or institutional theory that captures this exact configuration. However, your description is a precise synthesis of three well-established concepts: **Institutional Decoupling** (sociology), **Prototype/Exemplar Theory** (cognitive philosophy), and **Path Dependence** (historical institutionalism).

  If a name were to be coined for this specific dynamic, **"Precedential Encrustation"** or **"The Paradigm-Rule Decoupling"** would be accurate. In legal theory, it resembles a **"Common Law Method"** applied within a **"Civil Law Structure"** (using case precedent to override static code).

  Here is the breakdown of the theoretical edges, the distinctions you requested, and my confidence assessment.

  ### 1. Theoretical Components
  While no single noun exists, the phenomenon is the intersection of these three frameworks:

  *   **Institutional Decoupling (Meyer & Rowan, 1977):** This is the strongest institutional match. It describes when an organization maintains formal structures (published criteria) to maintain legitimacy, while actual practices (the shadow taxonomy) diverge to accommodate internal pressures or uncertainties. The "rules" are ceremonial; the "precedents" are operational.
  *   **Prototype/Family Resemblance (Wittgenstein/Rosch):** Philosophically, the board claims to use **Criterial Classification** (necessary and sufficient conditions). In practice, they use **Prototype Classification** (judging new items by their similarity to a cluster of "central cases"). The "shadow taxonomy" you describe is a **Cluster Concept** masquerading as a **Criterial Concept**.
  *   **Case-Based Reasoning (CBR):** In law and AI, this is solving new problems by adapting solutions from similar past problems. Your scenario describes CBR overriding Rule-Based Reasoning (RBR), even when the institution claims to be RBR.

  ### 2. Distinguishing Edges

  You asked to distinguish this from three specific concepts. Here is how the boundaries are drawn:

  | Concept | The Distinction |
  | :--- | :--- |
  | **Sorites Paradox** | **Logic vs. History.** The Sorites Paradox arises from the *logical impossibility* of drawing a sharp line on a continuum (e.g., "how many grains make a heap?"). Your phenomenon is not about the impossibility of a line, but the *existence of a hidden line* based on historical accumulation. The rejection isn't because the boundary is vague (Sorites), but because the applicant doesn't match the *historical trajectory* of exceptions. |
  | **Regulatory Drift** | **Rule Status.** In regulatory drift, formal rules often become obsolete or are quietly ignored because the environment changed. In your scenario, the formal rules remain **active and cited**. They are not ignored; they are **subordinated**. The board uses the rules to reject the applicant ("You lack X") while simultaneously violating the rules to accept others ("We accepted Y without X"). Drift implies the rules fade; this implies the rules are weaponized selectively. |
  | **Strategic Ambiguity** | **Location of Vagueness.** Strategic ambiguity resides in the *text* of the rule (e.g., "reasonable care") to allow flexibility. In your scenario, the text is *precise* (radiometric range, provenance). The ambiguity is not in the rule, but in the **unwritten weighting system** derived from past cases. It is not ambiguity of definition, but **ambiguity of precedence**. |

  ### 3. Proposed Descriptive Labels
  Since a standard term is absent, these labels are used in niche literature to describe aspects of this dynamic:

  *   **"The Hidden Curriculum" (Sociology of Professions):** Often used in medical education to describe implicit norms that override formal syllabi.
  *   **"Connoisseurship vs. Scientism" (Art History):** Specifically describes the tension between "eye-based" (prototype) authentication and "lab-based" (criteria) authentication.
  *   **"Administrative Common Law":** A legal theory term describing when agencies create binding norms through ad-hoc decisions rather than formal rulemaking.

  ### 4. Confidence and Uncertainty

  **Confidence Level: High (85%)**
  I am highly confident that there is no single, universally recognized term (like "The Peter Principle" or "Goodhart's Law") that exclusively defines this specific configuration of *static rules + dynamic precedent-based exclusion*. I am also highly confident that **Institutional Decoupling** and **Prototype Theory** are the correct theoretical scaffolds to analyze it.

  **Point of Least Certainty: Niche Jurisprudence**
  My lowest certainty lies in whether a specific sub-field of **Administrative Law** or **Forensic Epistemology** has a slang term for this. For example, in art authentication, there may be a specific phrase like "The Provenance Trap" or "The Connoisseur's Veto" used in trade literature that hasn't crossed into general theory. Additionally, while **"Path Dependence"** explains *why* the shadow taxonomy exists, some theorists might argue that **"Hysteresis"** (the dependence of the state of a system on its history) is the more precise physical/sociological term for the *lag* between the rules and the practice.

  ### Summary
  You have identified a **Decoupled Criterial System**. It functions by maintaining the **legitimacy** of explicit rules while exercising the **flexibility** of implicit precedents. The specific injustice you note—rejecting a rule-compliant applicant because they lack the "shadow credentials" of past exceptions—is the hallmark of a system that has transitioned from **Rule-Governance** to **Exemplar-Governance** without admitting the change.

  **Recommended Label:** If you need to name this in writing, **"Precedential Encrustation"** or **"The Paradigm-Rule Gap"** are the most precise descriptive terms available.
