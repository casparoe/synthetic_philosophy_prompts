  2.  **Deconstruct the "Menu" of Theses:**
      *   *Aggregative/Majoritarian:* Will = sum of expressed preferences (votes).
      *   *Counterfactual-Deliberative:* Will = what people *would* want if informed/rational.
      *   *General Will (Rousseauian):* Will = common interest vs. private interest ("will of all").
      *   *Corporate-Group-Agent:* Will = the state/people as a single legal/moral person over time.
      *   *Constitutive:* Will = created by the procedure, not tracked by it.
      *   *Purely Legitimating:* Will = rhetorical honorific, no descriptive content.
      *   *Exclusionary/Moralised:* Will = the "real" people vs. elites/corrupt elements.

  3.  **Analyze the Commissioners:**
      *   *Former Minister:* Claims election = will. Sounds Aggregative. But implies a mandate for specific statutes (Bundle Problem).
      *   *Deliberative Scholar:* Claims election = snapshot of ignorance; Assembly = true will. Sounds Counterfactual-Deliberative.
      *   *Check:* Are they consistent? The Minister might be relying on *Legitimating* (election confers authority) while sounding *Aggregative*. The Scholar might be relying on *Constitutive* (the assembly makes the will) while sounding *Counterfactual*.

  4.  **Evaluate User's Hypothesis:**
