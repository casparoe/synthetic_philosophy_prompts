      *   *Bundle Problem:* Elections aren't referendums on specific laws. Minister's view is analytically weak here.
      *   *Identity Over Time:* Who are "the people"? Future generations? Non-voters? This breaks both simple views.

  6.  **Address Usage:**
      *   Populists usually use *Exclusionary/Moralised*.
      *   Critics usually attack the *Coherence* (Legitimating/False).
      *   Commissioners are using *Institutional/Procedural* versions, which differ from street usage.

  7.  **Drafting the Briefing Note (Iterative Process):**
      *   *Tone:* Professional, analytical, neutral, decisive.
      *   *Structure:* Follow the prompt's requirements logically.
      *   *Section 1: The Menu.* Define the 7 theses clearly with the required criteria (Truth conditions, Status, Consequence).
      *   *Section 2: Commissioner Diagnosis.* Map them to the menu. Expose the gaps in their logic.
      *   *Section 3: Hypothesis Evaluation.* Validate the Track/Constitute and Electorate/Affected axes. Confirm the "smuggling" of theory via the 2/3 threshold. Identify missing axes (Time/Competence).
      *   *Section 4: The Wrinkles.* Tackle Specification, Bundling, and Identity honestly. Admit where the commission *cannot* settle things (philosophical premises) vs. where they *can* (drafting choices).
      *   *Section 5: Ordinary Usage.* Contrast technical vs. political usage.
