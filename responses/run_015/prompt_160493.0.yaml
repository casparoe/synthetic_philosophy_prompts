  ### Conceptual Analysis

  What is levelled down here is persons' **prospects**. Moving from R to S reduces the expected well-being of both individuals, specifically harming the person who is ex-ante worse off. The standard Levelling-Down Objection (LDO) claims that a distribution cannot be better if it makes someone worse off and no one better off. In deterministic settings, both prioritarian renderings avoid this because their value functions are strictly increasing; lowering anyone's utility lowers the total value. Here, Ex Ante Prioritarianism respects this: since expectations fall for everyone, R is ranked higher.

  However, Ex Post Prioritarianism violates this intuition under uncertainty. It ranks S higher not because anyone's prospects improve, but because the **spread of the distribution within states** is reduced. In State 1, Policy R creates a severe deficit for Person A ($1.000$). The concave transformation penalizes this low realization heavily, dragging down the expected value of R despite its higher mean. This is not the original LDO, which objects to equality for its own sake. This is a distinct objection: **Ex Post Levelling Down**. It sacrifices everyone's long-term interests to avoid inequitable realizations in specific states of nature. It treats the "state" as the locus of moral concern rather than the "person" across time.

  Regarding the rank-weighted rendering: it should count as a version of prioritarianism, not egalitarianism. Egalitarianism typically values the reduction of gaps between persons. Rank-weighted views value well-being itself, merely weighting it differently based on relative position. While the view is non-separable (a person's moral contribution depends on their rank), the currency remains well-being, not equality. This classification matters significantly. If rank-weighting were merely egalitarianism, this example would only damage egalitarian theories. By confirming it as prioritarianism, the example demonstrates that the conflict between ex ante and ex post readings infects the entire prioritarian family, not just the concave-transform subset.

  On the dispute between readings, **Ex Ante** is the correct reading for a view whose rationale is that it matters more to benefit people the worse off they are. The strongest reason is **respect for persons as distinct entities**. Prioritarianism is person-affecting; it assigns weight to benefits based on a person's lifetime condition. Ex Post Prioritarianism fragments persons into state-slices, prioritizing the distribution of utility across slices in a state over the integral utility of the person. If Person A is the worse-off person, their expectation should matter most. Ex Post Prioritarianism risks sacrificing Person A's expectation to improve the distribution in a state that may not occur, effectively treating Person A as a vessel for state-value rather than a recipient of benefits.

