      *   **Input:** A short draft paragraph defining the concept and giving an example.

  2.  **Analyze the Draft Content:**
      *   **Definition:** A policy change is a *safe Pareto improvement* (SPI) if:
          1.  For every person, there is a reasonable bound on loss under *any plausible state of the world* (or no loss).
          2.  At least one person is better off in *every plausible state*.
          3.  Implicitly: Compensation must be guaranteed in all scenarios if harm occurs.
      *   **Contrast:** Ordinary Pareto/Cost-Benefit Analysis (CBA) looks at *expected* utility (weighing probabilities). SPI looks at *worst-case plausible* utility.
      *   **Example:** Bridge replacement.
          *   Standard: Expected benefits > Expected harms (even if some lose out in rare scenarios).
          *   SPI: Must ensure no one loses in *any* plausible scenario (or compensate them guaranteed).
      *   **Claim:** This is a more honest standard; treats possibility of harm as a redesign trigger, not a discount factor.

  3.  **Evaluate the Concepts (Mental Check & Knowledge Retrieval):**
      *   *Term Check:* "Safe Pareto Improvement" is actually a specific term in Game Theory/Decision Theory (often associated with MIRI/Rob Bensinger et al. regarding AI delegation). It usually means delegating decisions to an agent such that the outcome is guaranteed to be at least as good as the default, without needing to know the exact utility functions.
      *   *User's Usage:* The user is *not* using the technical game-theoretic definition. They are coining/adapting the term for public policy under uncertainty. I need to address this potential terminological collision gently while evaluating their specific definition on its own merits.
      *   *Pareto Improvement (Standard):* State A $\to$ State B. At least one better, none worse. Usually ex-post (after the fact) or ex-ante (expected utility).
      *   *Kaldor-Hicks:* Winners *could* compensate losers (potential Pareto). This is what CBA usually approximates.
      *   *User's "Safe" Version:* Sounds like a "Maximin" or "Robust Decision Making" constraint applied to Pareto. It shifts from *expectation* to *state-wise dominance*.
      *   *Coherence:* It's coherent but extremely demanding. "Any plausible state" is the weasel phrase.
      *   *Difference:* Yes, it differs from ex-ante expected Pareto. It aligns more with ex-post Pareto across all states.
      *   *Bridge Example:* Supports the distinction well. CBA accepts risk; SPI demands risk elimination or guaranteed insurance.
      *   *Interest Level:* It touches on deep issues in welfare economics (uncertainty, risk aversion, compensation principles). It's not just restating Kaldor-Hicks, but it is related to "State-Contingent Claims" and "Insurance."

  4.  **Drafting the Feedback - Section by Section:**

      *   **1. Coherence of the Definition:**
          *   It's logically consistent.
          *   *Critique:* The phrase "reasonable bound" is vague. Does "bound" mean "zero harm" or "limited harm"? The text says "no plausible scenario makes any resident worse off" later, which implies zero harm. I need to point out this tension.
          *   *Terminology Note:* I must mention the existing Game Theory definition of SPI to prevent future confusion, even if they want to keep their usage.

      *   **2. Difference from Ordinary Pareto:**
          *   Standard Pareto is usually deterministic or ex-ante expected.
          *   User's version is *state-wise* Pareto dominance.
          *   It's stricter than Kaldor-Hicks (which allows losers if winners *could* compensate).
          *   It's stricter than Ex-Ante Pareto (which allows losses in some states if the average is up).
          *   *Verdict:* Yes, genuinely different, specifically regarding *risk* and *uncertainty*.

      *   **3. The Bridge Example:**
          *   It works well to illustrate the gap between CBA (expected value) and the proposed standard (guaranteed safety/compensation).
          *   *Nuance:* The example mentions "fully compensated in every such scenario." This turns it into an insurance problem. This is a strong point.

      *   **4. Interesting vs. Familiar:**
          *   It's interesting. It reframes the "Precautionary Principle" through a Pareto lens.
          *   It connects to "State-Contingent Claims" in economics (Arrow-Debreu). If markets were perfect, you could buy insurance against the landslide. The policy requirement is essentially mandating that insurance.
          *   It's not *just* restating Kaldor-Hicks, because Kaldor-Hicks doesn't require *actual* compensation, whereas this draft seems to require *guaranteed* compensation.

      *   **5. The "Expected Harm" vs. "Any Plausible Scenario" Move:**
          *   *The Problem:* "Plausible" is subjective. Does 1 in a million count? If not, it collapses back to expected utility. If yes, it might paralyze policy (nothing is risk-free).
          *   *Suggestions:*
              *   Define "plausible" (e.g., above a certain probability threshold, or non-negligible tail risk).
