answer: |-
  A Maxwell's Demon sits proudly behind his partition, tapping a array of Toffoli gates. "You can't touch me," he tells the visiting physicist. "Fully reversible architecture. I never erase a measurement. Landauer's limit is zero. I extract work without the $kT \ln 2$ tax."

  A woman in a grey suit steps out of the shadows, badge gleaming: *Thermodynamic Audit Bureau*. "Form 89-B," she says, sliding a paper across the console. "New compliance mandate. All measurement histories must be retained in an immutable, append-only ledger for perpetual audit."

  The Demon freezes. "Append-only? But my memory register is finite. To keep logging without erasing, I have to physically expand my storage lattice into the environment. I'll need to construct new memory cells indefinitely."

  "Correct," says the auditor.

  "But the work required to organize that matter— to carve out fresh, low-entropy phase space for the ledger—exceeds the work I extract from sorting the gas!"

  "Exactly," she says, stamping his form. "You thought you relocated the entropy to the erasure step. We just relocated it to the capital expenditure step. Sign here."

  The Demon sighs, handing over his pen. "So the Second Law isn't saved by the heat I dump..."

  "No," says the auditor. "It's saved by the hard drive you have to build to avoid dumping it. The ledger *is* the heat bath now."
