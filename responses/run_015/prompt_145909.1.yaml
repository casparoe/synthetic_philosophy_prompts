answer: |-
  Thank you. Thank you for having me back.

  It is a privilege to stand here. To the trustees, to the faculty, and especially to the family whose generosity made this Center possible: thank you. A building is just stone and glass until it has a purpose. You have given us a purpose.

  We are here to talk about Athens. We always are, when we talk about democracy.

  If you read the brochures, or the op-eds, you will hear two stories about why Athens failed.

  The first story says the people were too powerful. That the Assembly was a mob, emotional and fickle, that swallowed its best men and launched wars it couldn't win. This story says democracy needs brakes. It needs protection from itself.

  The second story says the people were not the problem at all. That Athens was an empire, and empires do what empires do. The Assembly was just the room where imperial policy got ratified. The violence wasn't democratic; it was structural.

  Both stories are familiar. Both stories are comfortable. And if you know the history, you know both stories leave things out.

  I want to suggest a third story. It is less about emotion, and less about empire. It is about the price of changing your mind in public.

  In a democracy, you vote. You raise your hand. You commit. But what happens when you realize you are wrong? In a private room, you can say, "I made a mistake." In the Pnyx, in front of six thousand neighbors, a mistake is a weakness. Reversal has a cost. And in Athens, that cost was often too high.

  Look at Mytilene.

  The Assembly voted to kill every man in the city and enslave the women and children. It was a harsh vote. But the next day, they felt differently. Regret set in.

  Here is the crucial detail: The institution allowed them to change their mind. They reopened the debate. Diodotus argued against Cleon. They voted again. They chose mercy.

  But the first ship had already left. It had a day's head start. The second ship had to row harder than a trireme should ever row. The crew ate their rations of barley and oil while they rowed, hoping the first ship hadn't docked. They arrived just as the executioners were ready.

  The system worked, but barely. The mechanism for reversal existed, but the pressure of the first commitment almost made it irrelevant. The problem wasn't that they couldn't change their minds. It was that changing their minds required a race against time they almost lost.

  Look at Sicily.

  This is the case where reversal didn't happen. But you can see the shape of it.

  When the Assembly began to hesitate, Nicias tried to talk them out of the expedition. But he didn't say, "We were wrong." He said, "If we go, we need much more." He itemized the cost. He thought if he made the price high enough, they would balk.

  Instead, they voted him more.

  Why? Because admitting the first vote was a mistake was harder than doubling the bet. To stop was to admit error. To escalate was to stay consistent. The institution didn't force them to war; the cost of public reversal pushed them deeper into it.

  And look at Socrates.

  This is the hardest case. We like to think the mob killed him. But the procedure actually built in a second chance. There was a vote on guilt, and then a vote on penalty.

  After the guilty verdict, the standard compromise was exile. It was the off-ramp. It allowed the city to save face and the philosopher to live.

  Socrates refused it. He proposed that the city reward him with maintenance in the Prytaneum. He forced a choice between honor and death. Only at the very end did his friends propose a fine.

  The institution offered a way to climb down. The individual blocked it.

  So, what do these three cases share? It isn't just emotion. It isn't just empire. It is the mechanics of commitment.

  In each case, someone had a live chance to reverse course in public. And in each case, the institution or the actor made that reversal expensive.

  This brings me to what this Center should do.

  It would be easy to spend the next decade studying how to slow democracy down. How to filter the popular will. How to build barriers against the heat of the moment. That is a respectable project. It aligns with the donor's concern about stability.

  But if my reading is right, stability doesn't come from barriers. It comes from flexibility.

  The danger isn't that people change their minds. The danger is that we build systems where changing your mind looks like surrender.

  So here is my claim for the Center for Democratic Deliberation. Do not just study how we decide. Study how we *undecide*.

  Study the mechanics of reversal.

  How do we design assemblies where a second vote isn't a sign of weakness, but a standard procedure? How do we create political cultures where "I was wrong" is not a fatal concession? How do we lower the price of public correction so that the second ship doesn't have to row on an empty stomach?

  This is not a plea for wishy-washy centrism. It is a plea for resilience. A system that cannot correct itself without crisis is not a stable system. It is a brittle one.

  The donor who gave us this building worries about the mob. The faculty worry about the empire. I suggest we worry about the trap.

  We need to study how to build institutions that allow us to stop. To turn around. To admit that the first ship left too soon.

  This is hard work. It requires humility. It requires designing procedures that protect people when they backtrack. It requires recognizing that sometimes the most democratic thing you can do is provide a graceful exit.

  I know there are people in this room who have spent fifty years studying these texts. I am not telling them what they mean. I am suggesting that after fifty years, they still have something to teach us about our own moment.

  We live in a time where changing your mind is treated as betrayal. Where consistency is valued over accuracy. Where the second ship is rarely launched.

  If this Center can figure out how to make reversal cheaper than escalation, it will have earned its name. It will have honored the gift. And it will have served the democracy we hope to sustain.

  Thank you.
