  4.  **Refining for Audience & Tone:**
      *   *Donor:* Needs to feel his concern (popular pressure) is addressed, but reframed. He wants protection from pressure; the speech argues for mechanisms to handle pressure.
      *   *Faculty:* Needs to feel the historical analysis is sharp, not populist.
