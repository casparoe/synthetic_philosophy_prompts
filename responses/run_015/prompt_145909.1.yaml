          *   2/3: Faculty/Grad/Undergrads. Belief: Athens failed due to imperialism, not democracy. Assembly just ratified imperial policy.
      *   **Speaker's Thesis:** Neither emotion nor empire is the core issue. The core issue is the *cost of reversal* in public. Changing your mind in front of 6,000 people is expensive/hard.
          *   *Mytilene:* Reversal happened (barely), but required a second ship race.
          *   *Sicily:* Reversal attempted (Nicias), but backfired (voted more resources).
          *   *Socrates:* Reversal built into procedure (penalty vote), but Socrates blocked the off-ramp (exile) by proposing maintenance in the Prytaneum.
      *   **Constraints:**
          *   10 minutes (approx. 1,300 - 1,500 words spoken at a moderate pace).
          *   Don't tell either side they're wrong explicitly (diplomatic but firm).
          *   Specific enough for the 88-year-old professor (no factual errors, no clichés).
          *   Land on an actual claim for the Center's next decade (not just "deliberation is good").
          *   Style: Speech, not essay. Short sentences. Conversational. No awkwardness for the receiving line.
          *   Tone: Willing to annoy slightly rather than bore. Don't insult the donor personally, but don't shill.

  2.  **Deconstruct the Thesis & Arguments:**
      *   *The Trap:* Donor says "Mob Rule." Faculty says "Imperial Structure."
      *   *The Pivot:* "Public Commitment." The mechanics of changing course.
      *   *Mytilene:* Diodotus vs. Cleon. The key isn't just mercy, it's the logistics of the second ship. The *mechanism* allowed reversal, but the *pressure* made it a race against time.
      *   *Sicily:* Nicias's strategy. He tried to deter by asking for more. The Assembly doubled down. Why? Because admitting error on the first vote was harder than escalating.
      *   *Socrates:* The penalty phase. Exile was the obvious compromise. Socrates refused it. Why? Because admitting he was wrong (or that the city was wrong) was less important than maintaining his philosophical stance. The institution offered a way out; the individual blocked it.
      *   *The Claim for the Center:* Study the *mechanics of reversal*. How do we build institutions where changing your mind isn't seen as weakness? How do we lower the price of public correction?

