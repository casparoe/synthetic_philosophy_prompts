      *   *Sicily:* Nicias's second speech (Thucydides 6.20-23). He asks for more men; they vote him more.
      *   *Socrates:* Apology/Crito. The penalty phase. Exile was the standard compromise. Socrates proposed maintenance.
      *   *Donor Name:* The prompt says "his name's on the thing." I shouldn't invent a name, just refer to him or the building name. I'll refer to the building name.
