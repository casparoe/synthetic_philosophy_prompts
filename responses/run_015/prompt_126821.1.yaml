      *   **Audience:** ~12 students (10th & 11th graders). Some have taken logic (want symbols), most haven't (new to puzzle).
      *   **Resources:** Whiteboard and nothing else.
      *   **User's Knowledge:** Understands the paradox (5-day version, backward induction, the conflict between proof and reality).
      *   **Needs:**
          1.  **Order/Structure:** What comes before what? Specifically regarding the distinction between the announcement being false vs. unusable as a premise.
          2.  **Case/Variant:** Should the 5-day version be used or the "open-ended term" variant (no fixed endpoint)? Where does it fit?
          3.  **Misconceptions:** Identify misconceptions (including ones the user hasn't thought of) and when to address them.
          4.  **Closing:** One final question to test understanding vs. enjoyment.
          5.  **Exclusions:** What to explicitly decline to cover (set boundaries).
      *   **Constraints:** Continuous prose only. No headings, bullet points, bold text, or tables. British English.

  2.  **Deconstruct the Content:**

      *   **Order/Structure:** The user is right that the distinction between "false" and "unusable as knowledge" is crucial but hard. It needs to come *after* the paradox is felt but *before* the resolution is attempted. If introduced too early, it's abstract nonsense. If introduced too late, the confusion is entrenched. The flow should be: Intuitive setup -> The Argument (Backward Induction) -> The Reality (Exam happens & surprises) -> The Conflict -> Analysis of Knowledge/Premises -> Resolution/Philosophical Moral.
      *   **The Variant (Open-ended term):** The user's intuition is that this variant shows the fixed endpoint is crucial. This is a strong diagnostic tool. It should come *after* the main paradox is explored, as a way to test hypotheses about what generates the paradox. If used too early, it dilutes the classic tension. It serves well as a "what if" scenario to isolate the variable of "common knowledge of the endpoint."
      *   **Misconceptions:**
          *   User identified: Teacher lying, probability/randomness, logic proves anything.
          *   Missing ones: Confusing "surprise" with "ignorance" (not knowing vs. not being able to know), assuming the students are perfect logicians (idealization), conflating truth with knowability (KK principle issues).
          *   Timing: Address the "lying" one early (assume teacher is truthful for the sake of argument). Address the "probability" one during the setup (surprise is binary here, not probabilistic). Address the "logic proves anything" one at the climax (paraconsistency vs. error in reasoning).
      *   **Closing Question:** Needs to distinguish between "that was fun" and "I get the epistemic nuance." Something about whether the students *could* have known, rather than whether they were surprised.
      *   **Exclusions:** Modal logic formalisms (S4, S5), detailed history (Quine vs. Shaw), complex probability theory, psychological aspects of surprise. Keep it epistemic logic lite.

  3.  **Drafting - Section by Section (incorporating constraints):**

      *   *Constraint Check:* Continuous prose. No headings. No bullets. No bold. British English (e.g., "programme", "maths", "colour" - though not many colour words needed, just spelling and idiom).

      *   *Introduction/Order:* Start with the narrative. Get them invested. Then the argument. Then the clash. Then the epistemic distinction. The user's instinct about the distinction between false and unusable is correct but needs scaffolding. Don't start with it. Start with the story. Let them feel the contradiction. Then introduce the idea that knowing something requires more than it being true.
      *   *The Variant:* Place this after the main argument. Use it to test the "fixed endpoint" hypothesis. It shows that without a known last day, the induction fails. This helps isolate the source of the paradox (common knowledge of the timeframe).
      *   *Misconceptions:* Weave these into the flow. The "lying" teacher idea should be shut down immediately by stipulating the teacher is trustworthy. The "probability" idea needs addressing when defining surprise (it's about deduction, not statistics). The "logic is broken" idea is the climax – logic isn't broken, one premise is shaky.
      *   *Exclusions:* Be explicit. No heavy symbolism (even for the logic kids, keep it natural language with maybe simple notation), no deep dive into specific philosophers' solutions (Quine, Fitch, etc.), no psychological definition of surprise.
      *   *Closing Question:* Needs to target the knowledge condition. "If the teacher had told you the exam was on Friday *after* the induction proof was accepted, could you have known it?" Or better: "Does the argument show the exam cannot happen, or that you cannot know it will happen?"

  4.  **Refining the Flow (Mental Walkthrough):**

      *   *0-5 mins:* Setup. Teacher announces surprise exam next week. Define surprise (cannot deduce the night before).
      *   *5-15 mins:* The Backward Induction. Walk through Friday, then Thursday, etc. Get them to agree the exam is impossible.
      *   *15-20 mins:* The Reality. Teacher gives exam on Wednesday. Everyone surprised. Contradiction.
      *   *20-30 mins:* Diagnosis. Where did the argument go wrong? Introduce the user's key distinction: Truth vs. Knowability. The announcement might be true, but believing it undermines it. This is where the logic kids can help formalize "K(p)" but keep it accessible.
