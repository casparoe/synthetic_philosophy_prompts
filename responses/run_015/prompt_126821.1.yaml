      *   *Misconceptions:* Need to add the "perfect logician" assumption. The argument assumes students know they are perfect logicians who know the teacher is truthful, etc.
      *   *Exclusions:* Need to be specific about what to say "no" to.

  6.  **Writing - Tone and Style:**
      *   British English (analyse, realise, programme, maths, etc.).
