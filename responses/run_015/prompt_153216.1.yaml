  **(Self-Correction Note):** I need to be careful not to conflate "belief" (personal level) with "prior" (subpersonal). The user's view rests on this distinction. A fatal defeater would show the personal-level belief *is* the prior, or that the prior functions exactly like a belief in a way that violates the user's epistemic constraints.

  10. **Finalizing the Ranking:**
      *   **Fatal:** 1. Maladaptive calibration (breaks the "tracks stats" defense). 2. Content-specific top-down signals to V1 (breaks the "gain only" claim).
      *   **Serious:** 3. Collapse of gain/content distinction in formal models. 4. Phenomenal reports of qualitative shift (not just acuity).
      *   **Awkward:** 5. Redescription costs (Occam's razor).

