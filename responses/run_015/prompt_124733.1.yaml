answer: |-
  Here is the translation of the five accounts into your stack, followed by the edge-case stress test and the residue analysis.

  ### 1. The Five Accounts as Schema Constraints

  **(1) NASA (Darwinian Evolution)**
  *   **Predicate:** `CAN_EVOLVE(population_id)`
  *   **Fields:** Required: `population_id`, `mutation_rate`, `selection_pressure`. Nullable: `individual_id` (irrelevant on its own).
  *   **Logic:** Hard boolean, but scope is set-based, not row-based. A single row returns `NULL` or `FALSE` by definition.
  *   **Type:** Monotone (either heredity with variation exists or it doesn't).
  *   **Unit Test:** Inject noise into `sequence_hash`; assert `frequency` changes over `generation_count`.
  *   **Parent Pointer:** Irrelevant; lineage is a DAG of genes, not organisms.
  *   **Data Structure:** Versioned lineage table. A lone sexually reproducing individual throws a foreign key constraint error on `population_id`.

  **(2) Autopoiesis (Organizational Closure)**
  *   **Predicate:** `IS_CLOSED_SYSTEM(entity_id)`
  *   **Fields:** Required: `boundary_geometry`, `internal_synthesis_log`. Nullable: None (closure is all-or-nothing).
  *   **Logic:** Hard boolean.
  *   **Type:** Monotone (necessary and sufficient conditions).
  *   **Unit Test:** Delete `boundary_geometry`; assert system reconstructs it using only `internal_synthesis_log`.
  *   **Parent Pointer:** Null is fatal. The system must be self-producing; a `parent_id` implies external manufacture.
  *   **Data Structure:** Closed loop graph (cycles required).

  **(3) Replication (Information-First)**
  *   **Predicate:** `HAS_HERITABLE_INFO(sequence_id)`
  *   **Fields:** Required: `sequence_hash`, `copy_mechanism`. Nullable: `metabolism`, `boundary`.
  *   **Logic:** Hard boolean.
  *   **Type:** Monotone.
  *   **Unit Test:** Isolate `sequence_hash`; assert it directs synthesis of copy mechanism in sandbox.
  *   **Parent Pointer:** Nullable (allows for abiogenesis row), but typically a Tree. HGT makes it a DAG.
  *   **Data Structure:** Gene lineage DAG. Organism is a `VIEW` aggregating active genes.

  **(4) Metabolism (Dissipation-First)**
  *   **Predicate:** `DISSIPATES_GRADIENT(process_id)`
  *   **Fields:** Required: `energy_flux`, `entropy_delta`. Nullable: `structure`, `sequence`.
  *   **Logic:** Score against threshold (e.g., `entropy_production > 0.5`).
  *   **Type:** Polythetic (degrees of liveness).
  *   **Unit Test:** Remove external gradient; assert process halts.
  *   **Parent Pointer:** Irrelevant. Process continuity matters, not lineage.
  *   **Data Structure:** Time-series log of thermodynamic states.

  **(5) Deflationary (Cluster)**
  *   **Predicate:** `IN_LIFE_CLUSTER(trait_vector)`
  *   **Fields:** Required: `trait_vector` (array). Nullable: Any specific trait.
  *   **Logic:** Distance score (Euclidean/cosine) to centroid.
  *   **Type:** Polythetic (family resemblance).
  *   **Unit Test:** K-means convergence stability.
  *   **Parent Pointer:** Irrelevant.
  *   **Data Structure:** Feature matrix + Cluster ID.

  ### 2. Stress Test Against Cases

  **(a) The Chimney Fields**
  *   **NASA/Replication/Auto:** `FALSE`. No heredity, no internal synthesis, no information.
  *   **Metabolism:** `TRUE`. High `entropy_delta`, maintains gradient.
  *   **Deflationary:** `TRUE` (high similarity score to known structures).
  *   **Result:** Conflict. Metabolism schema admits it; others reject it.

  **(b) The Tenant (Synthetic Cell)**
  *   **NASA/Replication:** `TRUE`. Has `sequence_hash`, evolves.
  *   **Autopoiesis:** `FALSE`. `internal_synthesis_log` depends on external `helper_id`. Boundary not self-produced.
  *   **Metabolism:** `TRUE`. Dissipates ATP.
  *   **Result:** Autopoiesis schema drops the record; others keep it.

  **(c) Pando (Clonal Aspen)**
  *   **All Theories:** `TRUE` on biology.
  *   **Entity Resolution:** Failure. `organism_id` is ambiguous. Is it 1 row (genome) or 40k rows (stems)?
  *   **Data Structure:** Your DAG assumption breaks. It's a single node with 40k spatial extensions, or 40k nodes with identical `genome_hash`. Your schema forces a choice that the biology doesn't support.

  **(d) Prions & Spores (The Two-Year Rule)**
  *   **Spores:** `NULL` (dormant) → `TRUE` (active). Rule works.
  *   **Prions:** `NULL` → `TRUE`. Rule admits prions (they replicate structure upon rehydration).
  *   **Theory Check:** NASA/Replication reject prions (no nucleic acid). Metabolism rejects (no gradient dissipation).
  *   **Result:** Your rule produces a False Positive relative to four out of five theories.

  ### 3. The Two-Year Rule Translation

  Your intake rule is not an ontological definition; it is a **latency buffer with a state machine transition**.
  *   **Schema:** `status` column transitions from `SAMPLE` to `ORGANISM` on `timestamp > intake_date + 2 years` AND `viability_test = TRUE`.
  *   **Philosophy:** It is a proxy for **Metabolic Potential** implemented as **Persistence**. It assumes that if structure survives entropy for time *T*, it implies internal maintenance.
  *   **Cheating:** Yes. It smuggles in a temporal constraint to solve an identification problem. It admits prions because they satisfy persistence, not because they are alive. It is an operational hack to delay classification until the data stabilizes, masquerading as a biological truth.

  ### 4. The Residue

  You asked what survives translation and what breaks.

  **Nullable vs. Indeterminate**
  In Postgres, `NULL` is epistemic (missing info). In biology, "borderline" is often ontological (vagueness in the world). Adding a third value `INDETERMINATE` to your boolean column does not solve this; it just creates a tri-state flag. In your classifier, `INDETERMINATE` is actually `confidence_score BETWEEN 0.4 AND 0.6`. This encodes *your model's uncertainty*, not *nature's vagueness*. Your stack cannot represent ontological fuzziness, only data absence or classifier hesitation.

  **Thresholds vs. Ground Truth**
  A threshold (`score > 0.5`) presupposes a ground truth exists to be approximated. The Deflationist account denies this ground truth. If life is just a cluster, there is no fact of the matter to be right or wrong about, only useful or useless groupings. Your binary classifier (`ORGANISM`/`NOT`) forces a Deflationist reality into a Realist schema. You are minimizing loss functions against a target that the theory says doesn't exist.

  **Real vs. Useful**
  Your schema cannot distinguish "really alive" from "filed as alive." Constraints enforce consistency, not truth. A `CHECK CONSTRAINT` ensures data integrity, not biological fidelity. When an account says something is *really* alive, it claims a property independent of the database. Your database only knows properties defined by columns. The distinction collapses upon ingestion.

  **Conclusion: Defect or Policy?**
  The residue is not a defect of your vocabulary. It is a sign that the debate is not about biology, but about **downstream permissions**.
  *   **NASA definition** is for **Planetary Protection** (don't contaminate Mars).
  *   **Autopoiesis** is for **Synthetic Biology Safety** (is it contained?).
  *   **Replication** is for **IP/Patents** (who owns the gene?).
  *   **Metabolism** is for **Ecology** (where does energy go?).
  *   **Deflationary** is for **Taxonomy** (how do we file this?).

  Your `ORGANISM` flag is not a scientific claim; it is a **policy key**. It unlocks grant eligibility, biosafety level 2 access, or export controls. The friction you feel—the residue—is the collision of these conflicting policy requirements masquerading as a single ontological question. Your schema isn't failing to capture life; it's successfully capturing the fact that "life" is a legacy interface for five different regulatory regimes. The debate persists because nobody wants to admit that "Is it alive?" is actually "Does it qualify for the grant?"
