answer: |-
  The pint glasses were empty, the bar lights were half-dimmed, and Leo was staring at a coaster like it contained the secrets of the universe, or at least the secrets of his stalled thesis.

  "Malthus isn't falsified," Leo said, his voice raspy from cheap lager and exhaustion. "He's just temporally displaced."

  Sam rubbed their eyes. "Leo, he's been empirically dead since the Corn Laws were repealed. You can't just keep a theory on life support for two centuries because you think the ventilator might break tomorrow."

  "No, listen. The theory holds. The boundary condition shifted. Haber-Bosch synthetic fertiliser was a temporary patch, a variable he couldn't see. Now phosphorus is peaking, energy costs are rising, the patch is coming off. The arithmetic finally bites." Leo tapped the coaster. "He's not wrong. He's just right but early."

  "So you're saying a model can be contradicted by every single data point since 1800, but if the world ends next Tuesday, suddenly it's peer-reviewed gold?"

  "It's within the error bar," Leo insisted, slumping further into the booth. "Long-run predictions have wide confidence intervals. Being consistently wrong for two hundred years is just part of the variance."

  Sam laughed, a dry, hollow sound. "That error bar is wider than the Holocene. You're describing a zombie hypothesis. It's empirically dead, rotting in the ground, but you're hoping it'll wake up because the gravity changed."

  "It's not magic, it's rescue," Leo muttered. "A new boundary condition rescues the core axiom. Just like my funding."

  "Your funding ran out in 2021."

  "Exactly. I'm not unemployed, I'm just pre-verified. Once the department collapses, my status as 'staff' becomes technically accurate."

  Sam signaled for the bill. "You know, if you have to wait for the apocalypse to prove your hypothesis, you haven't discovered a law of nature. You've just written a suicide note with footnotes."

  "If your error bar swallows two centuries of contrary evidence, you aren't doing science, you're doing eschatology."
