  ## 1. The Game: "The Project Committee"

  **Objective:** Groups must decide whether to launch a project. The project has a single **True Value** for the whole group, but it is unknown. Each member receives a **Private Signal** (a noisy estimate). Under the **Unilateral Rule**, if *any* single member votes "Launch," the project proceeds for everyone.

  **Materials Prep (15 mins before class):**
  1.  **The Bag (True Value):** Write the following on 20 Index Cards, fold them, and put them in the cloth bag.
      *   5 cards: `BASE +50`
      *   14 cards: `BASE -10`
      *   1 card: `BASE -200`
      *   *(Expected Value: -2.5. The project is a bad bet on average.)*
  2.  **The Deck (Noise):** Take one deck of playing cards. Remove all **Red Face Cards** (J, Q, K, A of Hearts/Diamonds). You should have 36 cards left.
      *   26 Black Cards (Spades/Clubs): Represent **Noise -30**.
      *   10 Red Cards (Hearts/Diamonds 2-10): Represent **Noise +30**.
      *   *(Probability: 72% chance of -30, 28% chance of +30. Mean Noise ≈ 0.)*
  3.  **Stakes:** Place the box of chocolates in the center. 1 Chocolate = 10 Points. Groups start with 0. Negative points are debt (deducted from future earnings or "honor system" return).

  **The Mechanism:**
  *   **True Value ($V$):** Determined by the Bag card (hidden).
  *   **Private Signal ($S$):** $S = V + \text{Noise}$.
  *   **Decision:** If $S > 0$, a rational individual expects profit. If $S < 0$, they expect loss.
  *   **The Curse:** In the `BASE -10` state, 72% of members get $S = -40$ (Vote No), but 28% get $S = +20$ (Vote Yes). Under Unilateral Rule, the 28% trigger the project, and the group loses 10 points.

  ---

  ## 2. The Sequence (80 Minutes)

  **Phase 1: The Unilateral Scaling (30 mins)**
  *   **Setup:** Divide 18 students into committees.
  *   **Round 1 (Small N):** 6 Committees of 3 members.
      *   Draw 1 Bag Card (Same True Value for all groups to allow comparison, or separate draws per group for independence. *Recommendation: Separate draws per group to prevent collusion, but rig the first draw to `BASE -10` to ensure the lesson lands.*)
      *   Deal 3 cards from the Noise Deck to each group.
      *   Students calculate $S$ mentally ($V$ is hidden, but tell them: *"Your Signal is written on this slip"* — **See Prep Note Below**).
      *   *Prep Note for Speed:* To save time calculating $V + \text{Noise}$ in class, **pre-write the Signal Slips**. Create 3 decks of Index Cards corresponding to the 3 Bag States.
          *   Deck A (Base +50): 26 slips say "20", 10 slips say "80".
          *   Deck B (Base -10): 26 slips say "-40", 10 slips say "20".
          *   Deck C (Base -200): 26 slips say "-230", 10 slips say "-170".
          *   *In Class:* Instructor draws Bag Card secretly, picks the corresponding Deck, deals slips. This is transparent (show decks afterwards) and fast.
      *   **Rule:** Any one member can say "Launch".
      *   **Result:** Record on Whiteboard: `Group | N | Decision | True Value | Payoff`.
      *   *Expected:* Most groups Launch. Most lose points (since `BASE -10` is most likely).
  *   **Round 2 (Medium N):** 2 Committees of 9 members.
      *   Repeat procedure.
      *   *Expected:* Probability of *all* 9 drawing "-40" is $0.72^9 \approx 5\%$. 95% of groups Launch and Lose.
  *   **Round 3 (Large N):** 1 Committee of 18 members.
      *   Repeat procedure.
      *   *Expected:* Probability of all 18 drawing "-40" is $0.72^{18} \approx 0.3\%$. Certainty of Launch. Certainty of Loss (if `BASE -10`).
  *   **Whiteboard Pattern:** Plot `Group Size` vs `Average Payoff`. The line should slope down.

  **Phase 2: Decision Rules & Complications (35 mins)**
  *   **Round 4 (Majority):** 1 Group of 18. Launch requires >50% votes.
      *   *Expected:* In `BASE -10` state, only 28% vote Yes. Project Refrained. Payoff 0 (Saved loss).
  *   **Round 5 (Delegation):** 1 Group of 18. One random member decides.
      *   *Expected:* 72% chance Delegate sees "-40" and Refrains. Better than Unilateral.
  *   **Round 6 (Side-Benefit):** Unilateral Rule. Trigger gets +20 personal bonus (extra chocolate) regardless of group outcome.
      *   *Expected:* Even those with "-40" signal might trigger to get the bonus. Disaster risk increases.
  *   **Round 7 (Cost to Vote):** Unilateral Rule. Trigger must pay 5 points from personal stash to Launch.
      *   *Expected:* Filters out low-confidence optimists.
  *   **Round 8 (Deliberation):** 2 minutes talk before vote. Unilateral Rule.
      *   *Trap:* Students share "I got a positive signal!" This counts as one piece of evidence but influences 18 votes. Correlated error.

  **Phase 3: Student-Designed Rule (15 mins)**
  *   Groups propose a rule. Play one final round. Award bonus chocolates to the rule with the highest EV.

  ---

  ## 3. Comparison and Wrinkles (Instructor Key)

  **Expected Values (per round, assuming `BASE -10` state which occurs 70% of time):**
  *   **Unilateral (N=18):** Prob(Launch) $\approx 100\%$. Payoff $\approx -10$.
  *   **Majority:** Prob(Launch) $\approx 0\%$ (since only 28% have positive signal). Payoff $0$.
  *   **Unanimity:** Prob(Launch) $\approx 0\%$. Payoff $0$.
  *   **Delegation (1 person):** Prob(Launch) $28\%$. Payoff $0.28 \times -10 = -2.8$.
  *   **Verdict:** Delegation is better than Unilateral. Majority is best for avoiding loss.

  **The Four Complications:**
  1.  **Side-Benefit:** Shows how private incentives exacerbate the curse. The trigger internalizes the bonus but externalizes the loss.
  2.  **Cost to Vote:** Shows how "skin in the game" can restore efficiency by raising the threshold for triggering.
  3.  **Expert Trigger:** Give "Gold Cards" (Noise +/- 10) to 3 students. Only they can trigger.
      *   *Verdict:* **Relocates, does not fix.** If the 3 experts get lucky noise, the curse remains. It reduces $N$, but doesn't correct the threshold.
  4.  **Deliberation:**
      *   *Helps:* If someone has unique info ("I know the Base is likely negative").
      *   *Hurts:* If they just say "I'm optimistic." That one optimistic signal gets counted 18 times. This simulates **common knowledge cascades**.

  ---

  ## 4. Participant Rules Sheet (One Page)

  **PROJECT COMMITTEE: PARTICIPANT GUIDE**

  **1. The Goal**
  Your committee decides whether to launch a project. The project has a **True Value** (in points) that is the same for everyone, but it is hidden.
  *   If the committee **Launches**: Everyone receives the True Value (could be positive or negative).
  *   If the committee **Refrains**: Everyone receives 0 points.

  **2. Your Information**
  *   You will receive one **Signal Slip**.
  *   The Signal is an estimate of the True Value. It is noisy.
  *   Sometimes the Signal is higher than the True Value; sometimes lower.
  *   **Rational Guideline:** If your Signal is **Positive (>0)**, the project looks profitable to you. If **Negative (<0)**, it looks like a loss.

  **3. The Decision Rule**
  *   **Standard Rule (Unilateral):** If **ANY ONE** member says "LAUNCH", the project proceeds.
  *   **Silence means Refrain.**
  *   You may discuss or vote secretly as instructed by the Chair.

  **4. Scoring**
  *   Points are tracked per Committee.
  *   **10 Points = 1 Chocolate.**
  *   Negative points are debt.
  *   Committees compete for the highest total score.

  **5. Conduct**
  *   Do not show your Signal Slip to others unless instructed.
  *   You may not transfer points between members.
  *   Trust the Instructor's shuffling and drawing procedures.

  ---

  ## 5. Debrief Guide (Mapping Mechanics to Theory)

  **1. The One-Sided Filter (Round 3)**
  *   *Ask:* "In the large group, how many of you had a negative signal?" (Most hands). "How many had positive?" (Few hands). "Did we launch?" (Yes).
  *   *Mechanism:* The decision rule filters for the **maximum** signal, not the **mean**. $Decision = \max(S_1, ... S_N) > 0$.
  *   *Math:* Even if $E[V] < 0$, $P(\max(S_i) > 0)$ approaches 1 as $N$ increases.

  **2. The Whiteboard Evidence**
  *   Point to the `Group Size` vs `Payoff` graph.
  *   *Insight:* Competence didn't drop. Signals didn't change. Only $N$ changed.
  *   *Threshold:* The effective threshold for the group dropped as $N$ rose. For $N=1$, Threshold $\approx 0$. For $N=18$, Threshold $\approx -20$ (because someone is likely to see -20 even if V is -40).

  **3. Distinguishing the Phenomenon**
  *   **Not Groupthink:** Groupthink is social pressure to conform. Here, the 72% with negative signals *wanted* to refrain. They were overruled by the structure.
  *   **Not Tragedy of the Commons:** This isn't over-consumption of a resource. It's the adoption of a bad policy.
  *   **Not Optimism Bias:** Individuals were calibrated (Mean Noise = 0). The *aggregate* was biased.
  *   **Why Discussion Fails:** In Round 8, the "I'm optimistic" statement became common knowledge. It wasn't new evidence; it was the *same* evidence counted 18 times.
  *   **Why Rules Work:** Changing to Majority or Delegation raises the effective threshold back up.

  **4. When It Doesn't Arise**
  *   If the action is **reversible**.
  *   If the decision requires **continuous effort** (harder to unilateralize).
  *   If $V$ is **positive** (then the curse is a blessing).

  ---

  ## 6. Troubleshooting & Limitations

  **Predictable Failures & Fixes:**
  1.  **Curiosity Triggering:** Students launch just to see what happens.
      *   *Fix:* Emphasize the "Debt" aspect. Make the chocolate stakes salient *before* Round 1.
  2.  **Inference Cascades:** "No one has triggered yet, so signals must be low."
      *   *Fix:* Enforce **Simultaneous Reveal**. Everyone writes "Launch/Refrain" on a card, reveals on count of three.
  3.  **Unlucky Samples:** You draw `BASE +50` three times in a row. Unilateralism looks great.
      *   *Fix:* **Rig the first demo round.** Manually ensure the Bag draws `BASE -10` for the first two phases. Randomize only in the second half.
  4.  **Chocolates Distorting:** Students don't care about points.
      *   *Fix:* Make it competitive. "The top committee gets the whole box."
  5.  **Coordination:** Students agree "Nobody trigger unless Signal > 50".
      *   *Fix:* Forbid binding agreements. Remind them it's a one-shot game; defection is tempting.

  **Honest Limitations (What You Must Say):**
  *   **Irreversibility:** The game assumes the decision is final. In reality, you can often undo a launch. The curse is strongest when actions are irreversible (e.g., publishing sensitive tech).
  *   **Unbounded Stakes:** In the game, losses are capped. In reality (e.g., existential risk), one loss wipes out all gains. The curse is more dangerous with fat-tailed risks.
  *   **Individual Rationality:** In the game, triggering is individually rational if you only care about your signal. In reality, an altruistic individual *should* account for $N$. The curse persists because individuals act on their own threshold, not the collective one.
  *   **The "Reason to Refrain":** The game shows the *group* error. It doesn't fully solve the *individual's* dilemma: "If I don't trigger, someone else might." This is the core tension of the Unilateralist's Curse that remains unresolved without a normative shift.
