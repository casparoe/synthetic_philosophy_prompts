      *   **Resources:** Projector, index cards, 2 decks of playing cards, cloth bag, whiteboard, box of chocolates.
      *   **Core Concept:** The Unilateralist's Curse (Bostrom, Sandberg, Shulman). Key mechanism: When any single member can initiate an action for the group, the group acts based on the *maximum* of the individual estimates, not the *mean*. If estimates are noisy, the max is likely an overestimate.
      *   **Requirements:**
          1.  Fully runnable game with specific numbers/distributions (heavy-tailed downside).
          2.  Sequence of rounds (varying group sizes, specific outcomes: large group fails, small group succeeds/better).
