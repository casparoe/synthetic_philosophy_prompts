  2.  **Deconstruct the Unilateralist's Curse:**

      *   *Mechanism:* $N$ agents. True value $V$. Signals $S_i = V + \epsilon_i$. Action taken if $\exists i, S_i > T$ (Threshold).
      *   *Problem:* $P(\max(S_i) > T | V < T)$ increases with $N$. Even if $E[V] < 0$, if one person gets a high noise spike, the action happens.
      *   *Correction:* The threshold for acting should rise with $N$. $T_N \approx T_1 + \sigma \Phi^{-1}(1 - 1/N)$.
      *   *Game Design Challenge:* Need to simulate $V$ and $S_i$ physically with cards. Need heavy tails (rare disaster). Need incentives where "doing nothing" is viable.

