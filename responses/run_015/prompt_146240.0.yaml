answer: |-
  **TO:** Voss Prize Fiction Jury
  **FROM:** [Your Name]
  **SUBJECT:** Decision Rule for Final Voting

  **BOTTOM LINE:** We cannot use the ranked ballots to pick a winner; they produce a mathematical tie. I recommend we discard the ranked tally and adopt **Majority Judgment (letter grades)** during Sunday's call. Jurors will assign each book a grade (A–F); the book with the highest median grade wins. This captures preference intensity, handles potential disqualification stablely, and avoids granting dictatorial power to the Chair.

  **The Problem**
  Our ranked ballots produced a Condorcet cycle: *Salt Year* beats *Understudy*, *Understudy* beats *Winter*, and *Winter* beats *Salt Year*, all 4–2. Borda counts and first-place votes also tie. This is a real-world demonstration of Arrow's Impossibility Theorem: with three options and six voters, no ranked voting system can satisfy all fairness criteria simultaneously. We must choose which imperfection to live with.

  **Rule Analysis**
  *   **Plurality:** Fails immediately (2–2–2 tie). It violates the **Pareto condition** (if everyone prefers A over B, B can still win if votes split). In a visible room, this encourages strategic voting where jurors refuse to compromise, locking us in deadlock.
  *   **Borda Count:** Also ties (6–6–6). It violates **Independence of Irrelevant Alternatives (IIA)**; the ranking of two books depends on the third. Strategically, jurors will "bury" strong competitors by ranking them last, distorting honest preference.
  *   **Pairwise with Chair Elimination:** Requires a tie-breaker. If the Chair decides the elimination order, this violates **Non-dictatorship**. In a visible room, jurors will lobby the Chair to sequence eliminations favorably, turning the vote into political maneuvering rather than literary assessment.

  **Board Proposals**
  Regarding the proposal that the **Chair picks the elimination order**: I recommend we reject this. As noted above, this creates a Dictatorship, violating Arrow's Non-dictatorship condition. It invites coercion and undermines the jury's collective authority.

  Regarding the proposal to **pre-commit a fixed elimination order in bylaws**: This is sound policy for future years. It mitigates manipulation by removing the Chair's discretion. However, it does not solve the current cycle. Pre-commitment improves **Unrestricted Domain** stability over time but cannot prevent IIA violations when a specific cycle occurs. We should adopt this for future bylaws, but it saves us no trouble this Sunday.

  **Intensity and Withdrawal**
  Ranked ballots discard critical information. Our *Winter* supporters feel strongly that *Understudy* is the worst book; our *Salt* supporters are indifferent between the bottom two. Ranked ballots treat "indifferent" and "hate" identically. Majority Judgment (grading) captures this intensity. *Winter* jurors can assign *Understudy* an F, lowering its median below *Salt Year*.

  This also addresses the plagiarism allegation. In pairwise voting, removing a loser changes the winner (a violation of IIA inherent to cycles). If *Understudy* is withdrawn, *Winter* beats *Salt*; if *Salt* is withdrawn, *Understudy* beats *Winter*. The winner flips based on who is disqualified. With Majority Judgment, if a book is withdrawn, we simply recalculate the medians of the remaining books. While no system is immune to IIA violations in a cycle, grades measure absolute quality rather than relative positioning, making the outcome less volatile if a finalist disappears.

  **Strategic Voting and Deliberation**
  In a six-person room with visible ballots, strategy is inevitable. However, grading reduces the incentive to bury competitors compared to ranking. You can give your favorite an A and your least favorite an F without affecting the middle candidate's median as drastically as moving them from 2nd to 3rd place in a ranking.

  However, voting rules assume fixed preferences. Our final tool is deliberation. I recommend we discuss the books *before* casting grades. Deliberation changes preferences, effectively bypassing Arrow's theorem, which applies only to aggregating fixed rankings. We give up the purity of a "secret ballot" verdict, acknowledging that prizes are social constructs built on consensus, not just math.

  **Recommendation**
  1.  **Reject** the ranked ballots as inconclusive.
  2.  **Reject** Chair discretion on elimination order.
  3.  **Adopt** Majority Judgment (grades) on the call.
  4.  **Deliberate** before voting to align our standards.
  5.  **Pre-commit** a fixed elimination order in future bylaws, understanding it prevents manipulation but not cycles.

  This approach accepts that no system is perfect. We choose the imperfection that best respects our intensity of feeling and withstands the potential loss of a finalist.

  **[End of Memo]**
