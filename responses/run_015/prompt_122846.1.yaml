      *(Refining the "Feared Question")*: The user asked to include the one they hope nobody asks. I need to make sure I identify if there's something *worse* or confirm their fear is the worst. The "Non-Identity Problem" (if the war didn't happen, you wouldn't exist, so you can't claim harm/blame) is usually worse than just "who is the bearer." I should flag that.

      *(Final check on the "Licensing" concept)*: Ensure I don't confuse Licensing Blame with Causal Responsibility. Licensing is about the *menu*, Causal is about the *order*.

      *(Tone Check)*: The user is smart, knows their stuff. Don't patronize. Be direct.

      *(Formatting)*: Use clear headings. Bold key phrases.

