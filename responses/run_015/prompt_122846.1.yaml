      *   *Weakness 2 (Individualist):* Who exactly is the "community"? How do you blame a ghost? How does blame transmit across generations?
      *   *Weakness 3 (Statist):* If states are agents, why complicate it with "culture"? Just blame the state.
      *   *Weakness 4 (Political Theorist):* If licensing blame exists, does it entail reparations? If so, for how long?
      *   *Weakness 5 (General):* Is "licensing blame" just a fancy way of restating causal responsibility?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Historian - Presentism):* This is the biggest threat. If they dismiss the project as moralizing, the argument collapses.
          *   *Voice:* "We aren't judges," "Fischer was a mistake," "Context matters."
          *   *Reply:* Distinguish moral judgment from political accountability.
      *   *Objection 2 (The Individualist - The Bearer):* This is the user's feared question. Who bears the blame? Dead people?
          *   *Voice:* "Metaphorical," "Categories error," "Only individuals act."
