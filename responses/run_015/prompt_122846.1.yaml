      *   *Objection 4 (The Statist - State Agency):* Why not just blame the German State?
          *   *Voice:* "States are agents," "Culture is epiphenomenal."
          *   *Reply:* State agency *depends* on the licensing culture.
      *   *Objection 5 (The Historian - Counterfactuals):* "Could have revised" is counterfactual.
          *   *Voice:* "Archives don't show possibilities," "Determinism."
          *   *Reply:* Not claiming inevitability, just contingency of structure.
      *   *Objection 6 (The Historian - Shared Failure):* Why single out Germany's culture if it was a European failure?
          *   *Voice:* "Vienna wanted war too," "Paris mobilized."
          *   *Reply:* Acknowledge shared failure, but argue degrees of licensing differ (Blank Cheque specificity).
      *   *Objection 7 (The Individualist - Transmission):* How does blame pass to today?
          *   *Voice:* "I didn't do it," "Non-identity problem."
          *   *Reply:* Inheritance of institutions, not sin.
      *   *Objection 8 (General - Definition):* Is Licensing just Causal?
          *   *Voice:* "Semantics," "Same thing."
          *   *Reply:* One is event, one is condition of possibility.

      *   *Refining the Order:* The Historian Presentism objection is most damaging because it invalidates the *method*. The Individualist Bearer objection is second because it invalidates the *subject*. The Reparations question is third because it creates political liability.

  4.  **Developing the Replies & Concessions:**
      *   Need to be humble but firm.
      *   Concede where the historians are right (archives don't show "culture" directly).
