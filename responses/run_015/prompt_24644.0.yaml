answer: |-
  This is a fascinating exercise in conceptual cartography. Your friend is mapping the boundaries of the *demos* not by legal formalism (citizenship) or by consequentialism (affected interests), but by a specific blend of **territorial presence** and **legal subjection**.

  Here is the reverse-engineering of her principle, the predictions for your new cases, the competing hypotheses that fit the data, and the decisive test case.

  ### 1. The Working Hypothesis: The Principle of Resident Subjection

  Based on her five rulings, your friend is applying a variation of the **"All Subjected Principle,"** but with a strict **Residential Constraint**.

  *   **Citizenship is irrelevant:** Case 2 (Expatriate Citizen = Out) vs. Case 3 (Permanent Resident = In) proves that formal legal status is neither necessary nor sufficient.
  *   **Affected Interests are insufficient:** Case 5 (Affected Neighbor = Out) rejects the "All Affected Interests" principle. Impact alone does not grant standing.
  *   **Immunity is exclusionary:** Case 4 (Diplomat = Out) shows that physical presence is not enough if one is exempt from the coercive authority of the law.
  *   **The Formula:** To be a full member of the *demos*, one must be **(A) Physically Resident** within the territory AND **(B) Subject to the Coercive Authority** of the state's laws (no immunity), regardless of citizenship.

  ### 2. Predictions for the New Cases

  Here is how the **Principle of Resident Subjection** applies to your three cases, along with the likely reasoning she will use.

  **Case 1: The Corporation**
  *   **Prediction:** **Outright Outsider.**
  *   **Reasoning:** While the corporation meets the criteria of Residence (operations) and Subjection (taxes/law), the *demos* is a community of *moral agents*. Her previous cases all implicitly assume human actors. A corporation is a legal fiction; it can be subject to law, but it cannot exercise "co-rulership" or hold political standing in a democratic sense. She will likely rule that while the corporation is a *subject* of the state, it is not a *member* of the people.

  **Case 2: The Foreign Military Member**
  *   **Prediction:** **Outright Outsider (or at best, Suspended).**
  *   **Reasoning:** This is the strongest test of her consistency. Like the Diplomat (Case 4), this soldier is physically resident but **exempt from local criminal jurisdiction** (governed by Status of Forces Agreements). Despite the social ties (family, school), the lack of legal subjection is the dealbreaker. If the Diplomat is out because of immunity, the soldier must also be out. The social ties are irrelevant if the legal bond of subjection is missing.

  **Case 3: The Large Language Model (LLM)**
  *   **Prediction:** **Outright Outsider.**
  *   **Reasoning:** This tests the "Humanity" constraint. An LLM is not a legal person, pays no taxes, and feels no coercion. It fails both the Subjection and Moral Agency tests. She will likely dismiss this as a category error; tools cannot be co-rulers.

  ### 3. Competing Principles (The "Equifinality" Problem)

  The danger in reverse-engineering is that multiple rules can explain the same five data points. Here are two rival principles that fit her track record just as well but diverge on the new cases.

  **Rival A: The "Social Integration" Principle**
  *   **The Rule:** Membership belongs to those embedded in the daily social and economic reproduction of the community.
  *   **Fits Past Data:**
      *   *In:* Citizen & PR (both live and work here).
      *   *Out:* Expatriate (left the social fabric), Diplomat (lives in a separate bubble), Neighbor (lives elsewhere).
  *   **Divergence:**
      *   *The Soldier:* Under this rule, the soldier might be ruled **In** (or Partial). Unlike the Diplomat, the soldier's family is in local schools and the community. Their daily life is intertwined with the locals.
      *   *The Corporation:* Ruled **Out** (not socially embedded).

  **Rival B: The "Strict Juridical Subjection" Principle**
  *   **The Rule:** Membership belongs to *any* entity subject to the state's coercive laws, residence is merely evidence of subjection.
  *   **Fits Past Data:**
      *   *In:* Citizen & PR (both subject to law).
      *   *Out:* Diplomat (immune), Neighbor (not subject to law), Expatriate (practically beyond reach of daily coercion).
  *   **Divergence:**
      *   *The Corporation:* Under this rule, the corporation should be ruled **In**. It is a legal person, subject to law, and pays taxes. If subjection is the *only* thing that matters, the corporation qualifies.
      *   *The Soldier:* Ruled **Out** (not subject to local law).

  ### 4. The Crucial Experiment

  To distinguish between your friend's likely **Resident Subjection** principle and the rivals, you need a case that separates **Residence** from **Subjection**. All five of her past cases confound these two variables (those resident were subject, those not resident were not subject, except the Diplomat who was resident but not subject).

  **The Decisive Case: The Cross-Border Commuter**
  *   **The Scenario:** A person who lives in the adjacent foreign region (Non-Resident) but works in this country every day, pays income tax to this country, and is fully subject to this country's criminal and civil law while within the border (Subject).
  *   **Why this tells the rules apart:**
      *   **If she rules IN:** She is applying **Rival B (Strict Juridical Subjection)**. Residence is not necessary; being governed is sufficient.
      *   **If she rules OUT:** She is applying the **Resident Subjection Principle** (or Rival A). Physical presence in the community is a necessary condition for membership, regardless of tax or legal liability.
      *   **Why it matters:** This cuts to the heart of the boundary problem. Is the *demos* defined by those who *live together* (Residence) or those who are *governed together* (Subjection)?

  **Summary of Predictions vs. Rivals:**

  | Case | **Her Likely Rule** (Residence + Subjection) | **Rival A** (Social Integration) | **Rival B** (Strict Subjection) |
  | :--- | :--- | :--- | :--- |
  | **Corporation** | **Out** (Not human) | **Out** (Not social) | **In** (Subject to law) |
  | **Soldier** | **Out** (Not subject to law) | **In** (Socially integrated) | **Out** (Not subject to law) |
  | **Commuter** | **Out** (Not resident) | **Out** (Not resident) | **In** (Subject to law) |

  **Recommendation:** Present the **Corporation** case first. If she rules it *In*, she is a Strict Juridical theorist. If she rules it *Out* (as expected), she holds a Humanist constraint. Then, present the **Commuter** case. That is the only case that truly isolates the boundary of the political community from the boundary of the legal jurisdiction.
