answer: |-
  Here is the procedure, tested against your cases, with the necessary revisions made explicit. I am not going to accommodate the feasibility of your "Detection Discount" as originally framed; estimating a numeric ratio of undetected to detected instances in ninety minutes is impossible without data you do not have. I have replaced it with a binary threshold. I am also going to be blunt about the record: you cannot fully separate blame and sanction in a document that will be read by adversarial parties, but you can structure the language to minimize the conflation.

  ### The Procedure (Ninety Minutes)

  **Phase 1: The Luck Ledger (20 Minutes)**
  *   **Task:** Populate the four categories: Resultant (outcome), Circumstantial (context/rosta/resources), Constitutive (capacity/health/training), Reporting (why this case reached us).
  *   **Sufficient Answer:** Each category must have a one-sentence factual descriptor. If "Reporting Luck" cannot be populated with evidence of similar unreported cases, it remains blank.
  *   **Lay Member Anchor:** "We are listing the things this person did not control."
  *   **Stop Point:** If Resultant Luck is the only non-empty category, proceed to Phase 2. If Constitutive or Circumstantial luck dominates, flag for Systemic Referral.

  **Phase 2: The Counterfactual Twin Memo (15 Minutes)**
  *   **Task:** Before discussing the actual harm severity, the panel must agree on a disposition for the *median outcome* of this conduct. This is written down and signed.
  *   **Sufficient Answer:** A specific disposition from the option set.
  *   **Lay Member Anchor:** "We are judging the choice, not the chance."
  *   **Stop Point:** If the panel cannot agree on the median outcome disposition, the case is paused for data gathering. If the Twin Memo disposition is "No Action," the panel cannot upgrade to a harsher sanction based solely on actual harm.

  **Phase 3: Detection & System Check (25 Minutes)**
  *   **Task:** Assess the "Detection Discount." *Revision:* Drop the numeric ratio. Ask: "Is there credible evidence this conduct occurs widely without detection?" (Yes/No).
  *   **Sufficient Answer:** Yes/No based on audit data, witness testimony, or known culture.
  *   **Rule:** If Yes, sanction cannot be justified by the outcome. Sanction must be justified by the conduct's inherent risk regardless of outcome.
  *   **Lay Member Anchor:** "Punishing only the caught mistakes is a lottery."
  *   **Stop Point:** If Yes, and the conduct is tolerated systemic practice, return "No Action" for the individual and refer to system.

  **Phase 4: Disposition & Record (30 Minutes)**
  *   **Task:** Draft the record. It must have two distinct headers: "Finding on Responsibility" (backward-looking) and "Sanction & Risk Mitigation" (forward-looking).
  *   **Sufficient Answer:** HR and Union rep must agree the language distinguishes punishment from safety.
  *   **Value Judgment Point:** Determining whether the individual is capable of remediation (forward-looking) versus whether they deserve blame (backward-looking). This is where the panel must act as humans, not auditors.
  *   **Drop Distinction:** You must drop the hope that the regulator will read this as you intend. You write for the record, not their interpretation.

  ---

  ### Case One: The Insulin Nurses

  **Application:**
  *   **Ledger:** Resultant Luck differs (Harm vs. No Harm). Circumstantial/Constitutive identical. Reporting Luck differs (Audit vs. Incident).
  *   **Twin Memo:** Median outcome of skipping a check is "no harm." The Twin Memo disposition for both must be identical. Let us say "Informal Coaching" (conduct is risky but common).
  *   **Detection:** Evidence suggests the shortcut is ward-tolerated. Detection Discount applies (Yes).
  *   **Disposition:** Both receive **Informal Coaching**.
  *   **The Gap:** You asked how far apart the dispositions may defensibly be. Under this procedure, the answer is zero. Any gap is an admission that you are punishing luck.
  *   **The Pressure:** The family and regulator will read the identical sanction for the nurse whose patient died as indifference. You must write in the record: "The panel notes the severity of harm to Patient B, but finds the controllable conduct identical to Case A. Sanction is calibrated to prevent recurrence, not compensate for outcome."
  *   **Revision:** The procedure holds, but the record will be attacked. You cannot fix this without refusing to publish individual dispositions in high-profile harm cases, which you cannot do.

  ### Case Two: The Vascular Surgeon

  **Application:**
  *   **Ledger:** Resultant Luck (Death). Circumstantial Luck (Manager tolerance, team culture). Reporting Luck (High; 400 ops, 1 death).
  *   **Twin Memo:** Median outcome of retrospective checklist is "no harm." Would you sanction the *practice* if no one died? Yes, it is a protocol violation. Twin Memo: **Formal Remediation**.
  *   **Detection:** Credible evidence of widespread undetected occurrence (399 ops). Detection Discount applies to the *death*, not the *violation*.
  *   **Who to Blame:** The surgeon led the clinical act, but the manager tolerated the culture. The procedure forces you to ask: "Is the surgeon the only point of control?" If the manager is not in the room, you must note the systemic tolerance in the record.
  *   **Disposition:** **Formal Remediation** for the surgeon (for violating protocol), not Regulator Referral (which implies unfit practice rather than risky habit). The death does not upgrade the sanction.
  *   **Detection Discount Validity:** You asked if this is a moral requirement or a lawyer's trick. It is a moral requirement. If you sanction based on the death, you are sanctioning the 1% chance that manifested, not the 100% certainty of the risk creation. However, the risk creation *itself* warrants remediation. The Discount prevents the *death* from turning Remediation into Dismissal.
  *   **Revision:** The procedure requires you to sanction the *risk behavior*, not the *harm*. This is usable.

  ### Case Three: The Junior Doctor

  **Application:**
  *   **Ledger:** Resultant (Death + Pharmacy Error). Circumstantial (Rota gap, foreign training, untaught protocol). Constitutive (Sleep disorder). Reporting (3 similar unreported failures).
  *   **Twin Memo:** Median outcome of a tired, untrained junior not escalating? Often no harm, sometimes harm. But given the systemic setup, is the conduct "blameworthy"? A locally trained, rested doctor would have escalated. This doctor could not reasonably be expected to. Twin Memo: **No Action**.
  *   **Detection:** Credible evidence of widespread undetected occurrence (3 similar failures). Detection Discount applies.
  *   **Disposition:** **No Action**.
  *   **The Conflict:** The regulator wants a referral. The family wants acknowledgment. HR wants a precedent.
  *   **Analysis:** You cannot give the regulator a referral without violating the procedure. The doctor is a victim of constitutive and circumstantial luck. The pharmacy error is resultant luck not attached to her. The failure to escalate is a system failure (training/rota).
  *   **The Record:** You can give the family acknowledgment ("The system failed you") without giving the regulator blame ("The doctor is unfit"). You write: "No individual sanction. Systemic referral regarding rota and training."
  *   **The Real Problem:** You asked if the problem is the option set. Yes. The option set forces individualization. "No Action" feels like "Nothing happened." You need a "Systemic Referral" disposition that is not "No Action." But within your current set, "No Action" is the only honest choice.
  *   **Revision:** The procedure breaks here only if HR refuses to sign off on "No Action" for a death. If HR blocks it, the procedure is dead. Assuming HR signs, the procedure holds.

  ---

  ### Procedure Revisions & Limits

  Based on these cases, two revisions are mandatory for usability:
  1.  **Detection Discount:** Change from "estimated ratio" to "Credible Evidence of Widespread Occurrence." You cannot calculate ratios in ninety minutes. You can only judge culture. What is lost is precision; what is gained is the ability to actually finish the case.
  2.  **The Option Set:** You need a sixth option: "Systemic Referral Only." Currently, "No Action" absorbs this, which looks like exoneration to a grieving family. If you cannot add this, you must use "No Action" and write aggressively about system failure in the record.

  ### Addressing Your Doubts

  **Doubt 1: Blame and Sanction in One Record**
  You are asking to assert two incompatible things in one document. The regulator reads "Sanction" as "Blame." The family reads "No Sanction" as "No Responsibility." You cannot fix this with wording alone. You separate them by using distinct headers ("Finding on Responsibility" vs "Sanction") and explicit meta-language ("This sanction is imposed to mitigate future risk, not to punish past error"). However, you must accept that stakeholders will read what they want. The procedure protects *your* integrity, not their interpretation. You are not being asked to assert incompatible things; you are being asked to write clearly enough that the incompatibility is visible to anyone who reads carefully. Most will not. That is the cost.

  **Doubt 2: The Lottery**
  Is a panel that assigns dispositions only to cases that reach it administering a lottery? Yes. If you sanction based on outcome, you are punishing the losers of the risk lottery. The honest response is to admit it and refuse to sanction based on outcome severity. This means your sanction rate will drop. You will see fewer referrals and dismissals. This will look like leniency. It is actually consistency. If you cannot tolerate the drop in sanctions, you cannot tolerate justice. The procedure forces you to choose.

  Summary: This procedure isolates controllable conduct from outcome luck to ensure fair sanctioning, but it cannot prevent stakeholders from misreading forward-looking risk mitigation as backward-looking exoneration.
