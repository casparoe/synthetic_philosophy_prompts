  *   **(ii) Convexity Claim (Permissive):** **Incorrect.** You claim convexity saves the permissive rule. This is false.
      *   **Mathematical Error:** Your proof relies on the equality $E_{\bar{Q}}[\sum X_i] = \frac{1}{k} \sum E_{Q_i}[X_i]$. This is false.
      *   Linearity gives $E_{\bar{Q}}[\sum X_i] = \sum_j E_{\bar{Q}}[X_j] = \sum_j (\frac{1}{k} \sum_i E_{Q_i}[X_j])$.
      *   Your proof ignores the "cross-terms" where $i \neq j$. $Q_1$ might vouch for $X_1$ but assign highly negative expectation to $X_2$. The average measure $\bar{Q}$ will reflect this negativity.
