prompt: |-
  I am preparing a single-session teaching plan for a rationalist discussion group—mostly technically trained non-philosophers with no formal philosophy background—on Bernard Williams's integrity objection to utilitarian moral reasoning, centered on the scenario in which a husband saves his spouse rather than a stranger and the charge that a fully calculated justification involves one thought too many. I want the dependency structure of the explanation mapped out precisely: the order in which the conceptual pieces must be introduced so that the audience sees the objection as a structural failure of a moral theory rather than as a sentimental defense of partiality; the single carrying example that must do the work, specifying what properties it needs to include and what it must exclude so that it does not collapse into a generic intuition pump or a story about romantic loyalty; the misconceptions this audience will predictably bring—such as conflating the case with a critique of expected-utility maximization, reducing it to an emotional appeal against calculation, assuming Williams is defending selfishness, or treating it as an argument that moral agents should never count lives—together with the exact point in the sequence where each misconception should be headed off. I also want a concrete check for understanding that distinguishes someone who has grasped the objection's logical structure from someone who merely finds the husband's choice relatable. Specify what parts of Williams's broader framework—particularly his attack on the morality system and his distinction between ground projects and obligations—should be explicitly bracketed as out of scope for this level, with an honest statement of what is being left out and why. Finally, separate what is settled about the objection's force and its proper scope from what remains genuinely contested among specialists—such as whether it undermines all consequentialist frameworks or only act-utilitarianism, whether it depends on a defensible theory of personal projects, and how it relates to later debates about moral demandingness—and do not present any contested interpretation as the consensus view.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**

      *   **Target Audience:** Technically trained non-philosophers (rationalist discussion group). They value logic, structure, precision, and likely have some exposure to utilitarianism/effective altruism concepts. They lack formal philosophy training.
      *   **Topic:** Bernard Williams's integrity objection to utilitarianism (specifically the "one thought too many" argument).
      *   **Core Scenario:** The husband saving his spouse vs. a stranger.
      *   **Key Requirements:**
          1.  **Dependency Structure:** Precise order of conceptual introduction to frame it as a *structural failure*, not sentimentality.
          2.  **Carrying Example:** Specific properties (include/exclude) to prevent collapse into generic intuition pumping or mere romantic loyalty.
          3.  **Misconceptions:** Predictable errors (EU maximization, anti-calcation, selfishness, counting lives) + *exact point* to address them.
          4.  **Check for Understanding:** Concrete test distinguishing logical grasp from relatability.
          5.  **Scope Bracketing:** What parts of Williams's broader framework to exclude (Morality System, Ground Projects) + honest statement of omission.
          6.  **Settled vs. Contested:** Distinguish consensus from ongoing debate (act vs. rule utilitarianism, theory of projects, demandingness).
      *   **Tone:** Precise, structured, honest about limitations, suitable for a rationalist audience.

  2.  **Deconstruct the Content (Williams's Integrity Objection):**

      *   *The Core Claim:* Utilitarianism requires agents to be neutral conduits for utility. This alienates them from their own actions and projects.
      *   *The "One Thought Too Many" Case:* A man saves his wife from drowning. If he justifies it by saying "it maximizes utility," he has had one thought too many. He should have saved her *because she is his wife*.
      *   *The Structural Point:* It's not that the outcome is wrong; it's that the *mode of deliberation* corrupts the agent's integrity (identity + projects).
      *   *Rationalist Angle:* This isn't "feelings good." It's about the architecture of decision theory and agent-relative reasons.

  3.  **Drafting the Dependency Structure (The Flow):**

      *   Need to start with the utilitarian premise they know (maximization).
      *   Introduce the demand for *justification*.
      *   Introduce the scenario.
      *   Reveal the "thought."
      *   Show why the thought is structurally problematic (alienation), not emotionally problematic.
      *   Connect to Integrity (identity).
      *   *Constraint:* Must prevent the "sentimental" interpretation early on.

  4.  **Designing the Carrying Example:**

      *   *Standard:* Wife drowning.
      *   *Risk:* "But love is special!" (Sentimentality). "But wives are useful!" (Instrumentalization).
      *   *Modification:* Needs to be sterile enough to block pure emotion but specific enough to block pure instrumentality.
      *   *Decision:* Keep the drowning wife (it's the canonical text), but *stipulate* the variables.
      *   *Include:* Equal utility outcome (saving wife = saving stranger in terms of net happiness). Immediate action (no time for complex calc).
      *   *Exclude:* Future utility of the wife (don't let them argue she raises kids better). Romantic feeling (frame it as "commitment" or "role").
      *   *Why:* To force the focus onto the *justification*, not the *outcome* or the *emotion*.

  5.  **Mapping Misconceptions & Interventions:**

      *   *Misconception 1: Expected Utility (EU).* "Maybe saving the wife *does* maximize EU."
          *   *Fix:* Stipulate ex ante that utility is equal. Address *before* the scenario analysis.
      *   *Misconception 2: Anti-Calculation.* "Williams hates math."
          *   *Fix:* Clarify it's about the *source of motivation*, not the tool. Address *after* the "one thought" reveal.
      *   *Misconception 3: Selfishness.* "He's just being selfish."
          *   *Fix:* Distinguish self-interest from integrity/projects. Address during the "Integrity" definition phase.
      *   *Misconception 4: Counting Lives.* "Utilitarianism doesn't count lives."
          *   *Fix:* Irrelevant here, but clarify neutrality. Address in the setup.

  6.  **Developing the Check for Understanding:**

      *   *Bad Check:* "Do you agree?" (Relatability).
      *   *Good Check:* A structural analogy. If they get the logic, they should see the pattern in a non-emotional context.
      *   *Idea:* A programmer or engineer analogy. Debugging your own code vs. sending it to a neutral optimizer. Or a specific variation of the drowning case where the emotion is removed but the structural alienation remains.
      *   *Selection:* A "Neutral Arbiter" variation. If a third party decides, utilitarianism works. If the *agent* decides, the problem arises. Can they spot the difference?

  7.  **Bracketing Williams's Broader Framework:**

      *   *Out:* "The Morality System" (too meta-ethical). "Ground Projects" (too psychological/existential for one session). "Negative Responsibility" (too complex for this specific focus).
      *   *Reason:* Keep it focused on the *deliberative structure*.
      *   *Statement:* Explicitly state we are looking at the *logic of justification*, not the full existential critique.

  8.  **Settled vs. Contested:**

      *   *Settled:* It identifies a tension between impartiality and personal commitment. It challenges the *psychological realism* of strict act-utilitarianism.
      *   *Contested:* Does it kill Consequentialism entirely? (No, rule-utilitarians respond). Is "Integrity" a coherent moral value? (Debatable). Does it apply to Effective Altruism? (Hotly debated).
      *   *Instruction:* Label these clearly.

  9.  **Refining for the "Rationalist" Audience:**

      *   Use terms like "objective function," "agent-neutral vs. agent-relative," "meta-level."
      *   Avoid flowery language.
      *   Emphasize the *structural* constraint.
      *   Ensure the distinction between *criterion of rightness* and *decision procedure* is clear (a common rationalist distinction).

  10. **Review against Constraints:**

      *   *Dependency Structure?* Yes, mapped in Phase 1-5.
      *   *Carrying Example Properties?* Specified in Phase 2.
      *   *Misconceptions?* Mapped to specific phases.
      *   *Check for Understanding?* Designed in Phase 6.
      *   *Bracketing?* Included in Phase 7.
      *   *Settled/Contested?* Included in Phase 8.

  11. **Final Polish:** Ensure the tone is authoritative yet open, matching a teaching plan for peers. (Self-Correction: Make sure the "One Thought Too Many" isn't presented as Williams saying calculation is *bad*, but that it's *category error* in that context.)

  12. **Final Output Generation** (Proceeding to generate response based on these steps).
answer: |-
  # Teaching Plan: Williams's Integrity Objection ("One Thought Too Many")

  **Target Audience:** Technically trained non-philosophers (Rationalist/EA adjacent).
  **Session Goal:** To demonstrate that Williams's objection is a structural critique of agent-neutrality in moral deliberation, not an appeal to emotion or partiality.
  **Time Allocation:** 90 Minutes.

  ---

  ## 1. Dependency Structure (The Conceptual Sequence)

  To prevent the audience from dismissing the argument as "sentimentality," you must establish the **formal requirements of the moral theory** before introducing the **human element**. The logic must flow from the theory's constraints to the agent's alienation.

  1.  **Define the Utilitarian Deliberative Stance:** Establish that for the strict act-utilitarian, the *criterion of rightness* (maximize utility) must ideally match the *decision procedure* (calculate utility). The agent is a neutral vessel.
  2.  **Introduce Agent-Neutrality:** Define this technically. All reasons must be reducible to a common currency accessible to any observer. Personal relationships have no intrinsic weight, only instrumental weight.
  3.  **Present the Scenario (The Constraint):** Introduce the drowning case *with strict stipulations* (see Section 2).
  4.  **Reveal the Justification:** Show the utilitarian justification ("I saved her because it maximized utility").
  5.  **Identify the Structural Glitch:** Explain why this justification is redundant/alienating *given the relationship*, not because it is cold, but because it inserts a third party (the Theory) between the Agent and the Action.
  6.  **Define Integrity (Technical Sense):** Integrity here is not "honesty"; it is the continuity between an agent's projects/identity and their actions.
  7.  **Conclusion:** The theory demands a psychological split that undermines the agency required to act morally within it.

  ---

  ## 2. The Carrying Example: Properties & Stipulations

  **The Scenario:** Jim's wife is drowning. Jim can save his wife or a stranger. He saves his wife.

  **Required Properties (Include):**
  *   **Utility Equivalence:** You must explicitly stipulate that, ex ante, the expected utility of saving the wife is *identical* to saving the stranger. (e.g., both will contribute equally to society, both have equal happiness potential).
      *   *Why:* Prevents the "Efficient Altruism" counter-argument (e.g., "But wives are force-multipliers!").
  *   **Immediacy:** The decision must be made instantly.
      *   *Why:* Prevents the "Calculation is too costly" argument. This is not about transaction costs; it is about the *content* of the thought.
  *   **Commitment without Emotion:** Describe Jim's motivation as "recognition of the marital commitment" rather than "overwhelming passion."
      *   *Why:* Prevents the "He was overcome by emotion" defense. Williams is critiquing the *justification*, not the impulse.

  **Excluded Properties (Exclude):**
  *   **Future Instrumental Value:** Do not mention children, income, or social stability.
  *   **Romantic Love:** Do not frame it as "he loves her more." Frame it as "she is his wife."
  *   **Self-Interest:** Do not imply Jim is happier if she lives.
      *   *Why:* These properties allow the audience to reconstruct a utilitarian calculation. You must block all utilitarian escape routes to force them to confront the *structural* objection.

  ---

  ## 3. Misconceptions & Intervention Points

  This audience will attempt to "solve" the case using optimization heuristics. You must head these off at specific nodes in the sequence.

  | Misconception | The Error | Intervention Point | Script/Correction |
  | :--- | :--- | :--- | :--- |
  | **Expected Utility Maximization** | "Saving the wife *does* maximize EU because of bias/stress costs." | **Phase 2 (Before Scenario)** | "We are stipulating utility equivalence. We are not asking if the calculation is hard; we are asking if the calculation is *appropriate*." |
  | **Anti-Calculation / Intuitionism** | "Williams is saying don't think, just feel." | **Phase 5 (After Reveal)** | "Williams is not against calculation in policy. He is against calculation as the *constitutive justification* for personal commitments. It is a category error, not a computational error." |
  | **Selfishness / Partiality** | "This is just a defense of favoritism." | **Phase 6 (Defining Integrity)** | "Integrity is not doing what you want. It is acting from projects that constitute your identity. A selfish person lacks integrity just as much as a neutral utilitarian." |
  | **Counting Lives** | "Utilitarianism doesn't count lives, it counts welfare." | **Phase 1 (Defining Stance)** | "Correct. That is why the equivalence stipulation holds. The objection is not about the math of welfare, but the *location* of the reason." |

  ---

  ## 4. Check for Understanding (The Structural Test)

  Do not ask: *"Do you agree Jim should save his wife?"* (This tests relatability, not philosophical grasp).

  **The Test:** Present a **Non-Human/Structural Analog**.

  > **Prompt:** "Consider a firewall algorithm designed to protect a specific server network (Network A). The algorithm detects an attack. It can block the attack on Network A or Network B. Network A is 'its' network (it is installed there); Network B is identical in value and data.
  >
  > **Scenario 1:** The firewall blocks the attack on Network A because it is programmed to prioritize Network A.
  > **Scenario 2:** The firewall blocks the attack on Network A because it calculated that protecting Network A maximizes global network uptime (which happens to be equal to B).
  >
  > **Question:** In the context of Williams's objection, why is Scenario 2 structurally defective in a way Scenario 1 is not, even if the outcome is identical?"

  **Grading Rubric:**
  *   **Fail (Relatability Only):** "Scenario 2 is too cold/robotic." or "Scenario 1 is better because it cares."
  *   **Pass (Structural Grasp):** "In Scenario 2, the firewall is acting as a neutral optimizer, making its specific installation location irrelevant. It alienates the mechanism from its function. In Scenario 1, the mechanism's action is constituted by its specific relation to the object. Williams argues moral agents are like Scenario 1: their actions are defined by their specific relations, not neutral optimization."

  ---

  ## 5. Scope Bracketing (What We Are Leaving Out)

  Williams's critique is part of a larger attack on "The Morality System." For a single session, you must explicitly bracket the following to maintain focus.

  **Explicit Statement to Audience:**
  > "We are isolating the **Integrity Objection** regarding deliberative structure. We are explicitly **not** covering:
  > 1.  **Ground Projects:** Williams's deeper existential claim that without personal projects, life is not worth living. We are treating projects as structural constraints, not existential necessities.
  > 2.  **Negative Responsibility:** The claim that we are responsible for what we *allow* as much as what we *do*. This complicates the calculation but is not the core of the integrity argument.
  > 3.  **The Morality System:** Williams's meta-ethical critique of obligation and blame.
  >
  > **Why?** These are broader metaphysical claims. Our goal today is to test the *logic of justification* within a rationalist framework, not to adopt Williams's entire moral psychology."

  ---

  ## 6. Settled vs. Contested (Mapping the Landscape)

  Do not present Williams's view as the final word. Distinguish between the force of the objection and its downstream implications.

  **Settled (Consensus among Specialists):**
  *   **The Tension is Real:** There is a genuine conflict between strict agent-neutrality and the phenomenology of personal commitment.
  *   **Psychological Realism:** Act-utilitarianism is psychologically demanding in a way that risks alienating agents from their actions.
  *   **Distinction:** There is a valid distinction between the *criterion of rightness* (what makes an act right) and the *decision procedure* (how an agent decides). Williams targets the collapse of these two.

  **Contested (Open Debates):**
  *   **Scope of Refutation:** Does this refute *all* consequentialism?
      *   *Debate:* Rule-utilitarians and Two-Level utilitarians (e.g., Hare) argue they can accommodate integrity by having "integrity-protecting rules." Williams skeptics argue this is ad-hoc.
  *   **Value of Integrity:** Is "integrity" itself a moral value that can be weighed?
      *   *Debate:* Some consequentialists argue integrity *is* valuable and should be maximized. Williams argues this misses the point (you can't value integrity instrumentally without losing it).
  *   **Relation to Demandingness:** Is this just an argument that utilitarianism is too demanding?
      *   *Debate:* Williams says no; it's not about the *amount* of sacrifice, but the *type* of justification. (Crucial distinction for this audience).
  *   **EA Implications:** Does this undermine Effective Altruism?
      *   *Debate:* EAs often argue for agent-neutral prioritization. Williams suggests this is sustainable only at the policy level, not the personal deliberative level. This remains an active friction point.

  ---

  ## 7. Session Flow Summary (Cheat Sheet)

  1.  **Setup (10m):** Define Act-Utilitarianism + Agent-Neutrality. (Block "Counting Lives" misconception).
  2.  **Case Stipulation (10m):** Present Drowning Case. Enforce Utility Equivalence. (Block "EU Maximization" misconception).
  3.  **The Reveal (15m):** The "One Thought Too Many." Analyze the justification, not the act.
  4.  **Integrity Defined (15m):** Structural continuity vs. Sentiment. (Block "Selfishness" misconception).
  5.  **Intervention (15m):** Address "Anti-Calculation" misconception. Distinguish Criterion vs. Procedure.
  6.  **Check for Understanding (15m):** The Firewall Analog.
  7.  **Context & Limits (10m):** Bracketing Ground Projects/Morality System.
  8.  **Debate Map (10m):** Settled vs. Contested landscape.

  **Instructor Note:** If a participant argues, "But if everyone saved their spouses, utility is maximized," acknowledge this as a **Rule-Utilitarian** response. Mark it as a valid counter-move in the "Contested" section, but reiterate that Williams's objection applies to the **individual deliberative moment**, which Rule-Utilitarianism attempts to bypass rather than solve.
