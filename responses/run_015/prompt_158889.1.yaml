  2.  **Deconstruct the "Moon's Light" Analogy:**
      *   *Standard View:* Human minds have "Original Intentionality" (Sun). Machines have "Derived Intentionality" (Moon).
      *   *The Problem:* Where does the Sun get its light? If evolution (blind process), are humans just moons too?
