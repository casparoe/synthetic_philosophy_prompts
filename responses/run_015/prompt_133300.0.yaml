      *   **Physics vs. Philosophy Distinctions:**
          *   *Chance vs. Credence:* Crucial. MWI has no objective chance (deterministic). It derives *credence* (subjective belief). The link between the two (Principal Principle) is hard to establish in MWI.
          *   *Derivation vs. Assumption:* The axioms of decision theory are the pivot point.

