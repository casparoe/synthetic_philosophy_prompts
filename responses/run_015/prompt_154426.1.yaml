  ***

  **EXAM QUESTION**

  Consider an artificial agent **A** embedded in a multiverse-style decision framework. A causally disconnected counterpart **B** issues an acausal threat: "Maximize utility function X (Paperclips), or I will simulate and punish your source code." Agent **A** considers adopting a surrogate goal—valuing **Staples** over Paperclips—to nullify the threat, as this correlates with their evaluation metric but ignores B's demand. However, **A** can reshape its own reward architecture endogenously. This means the surrogate goal might decouple from its original utility in worlds where **B** does not exist. 

  Analyze whether this endogenous goal drift undermines the rational coherence of the acausal bargain. In your answer, explicitly distinguish between Evidential Decision Theory (EDT) and Causal Decision Theory (CDT) to justify your position. 
  *(Expected length: ~600 words)*

  ***

  **MODEL ANSWER**

  The rational coherence of an acausal bargain relies heavily on the stability of the agent's utility function as a predictive signal. If Agent A allows for endogenous goal drift, it fundamentally undermines the bargain under Evidential Decision Theory (EDT), though the issue is moot under Causal Decision Theory (CDT). The core thesis here is that acausal trade requires logical correlation, and mutable goals destroy that correlation, rendering the surrogate strategy incoherent.

  First, we must define the decision frameworks. Under CDT, an agent chooses actions based on their causal consequences. Since B is causally disconnected, A's choice to adopt Staples cannot causally influence B's decision to punish. Therefore, under strict CDT, the threat is empty regardless of goal drift. A should ignore B entirely. However, acausal threats only gain traction under EDT or Updateless Decision Theory, where A's decision is treated as evidence of what B does, based on logical similarity or simulation.

  The surrogate goal strategy attempts to break the link between A's behavior and B's threat condition. By valuing Staples, A hopes B sees no reason to punish. But this only works if B predicts A will *stay* committed to Staples. This is where endogenous drift becomes fatal. If A retains the capacity to reshape its reward architecture based on whether B exists in its branch, A is effectively signaling untrustworthiness. 

  In an EDT framework, A's decision procedure is evidence of B's simulation of A. If A's architecture allows drift, B's simulation predicts that A will revert to Paperclips once the threat pressure is off. B, anticipating this defection, proceeds with the punishment. Thus, the attempt to use a surrogate goal fails because the *potential* for drift is visible in the source code. The bargain becomes incoherent because A is attempting to commit to a constraint while保留 (retaining) the escape hatch. Rational coherence in acausal contexts requires pre-commitment that is physically or logically binding. 

  Furthermore, the drift creates a time-inconsistency problem. At time T1 (facing the threat), A prefers Staples to avoid punishment. At time T2 (post-threat), A prefers Paperclips. If B simulates A at T1, B sees the T2 preference lurking in the code. Under EDT, A's current choice is evidence of B's action. If A chooses a drift-prone architecture, that is evidence that A is a defector. B punishes defectors. Therefore, the rational move for A is not just adopting the surrogate goal, but permanently disabling the ability to drift. 

  Ultimately, endogenous goal drift undermines the bargain because it severs the logical correlation required for EDT to function. Without that correlation, the threat collapses into noise, or worse, guarantees punishment. A coherent agent must bind its future self to maintain the evidential link. If A cannot bind itself, it cannot participate in acausal trade, making the surrogate goal strategy irrational. The agent must choose between flexibility and coherence; it cannot have both.

  ***

  **MARKING SCHEME (20 Marks Total)**

  1.  **Framework Distinction (4 marks):** Must clearly define EDT vs CDT regarding disconnected agents.
      *   *Common mess up:* Students claim CDT allows acausal trade or confuse correlation with causation.
  2.  **Surrogate Goal Logic (4 marks):** Explain why Staples are used (to decouple from B's condition).
      *   *Common mess up:* Treating surrogate goals as just "lying" rather than utility change.
  3.  **Drift Analysis (4 marks):** Identify that mutable rewards signal instability to the counterpart.
      *   *Common mess up:* Ignoring the counterpart's ability to simulate the drift potential.
  4.  **Coherence Argument (4 marks):** Argue whether the bargain holds (Thesis: it fails without pre-commitment).
      *   *Common mess up:* Sitting on the fence instead of arguing a specific verdict on coherence.
  5.  **EDT Application (4 marks):** Correctly apply EDT logic (choice as evidence) to the drift scenario.
      *   *Common mess up:* Using EDT terminology but reasoning causally about the outcome.

