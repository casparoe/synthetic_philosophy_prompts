  8.  *(Self-Correction on Case 1)*: The user asks: "is there any case where future-me is rational and undeceived and the principle still bites wrongly?" I must answer this directly. The Shangri-La case is the answer. In Shangri-La, you know you will lose evidence (memory wipe) but you know the process is reliable. Conditionalization says stay confident. Reflection says lower confidence (because you know you *will* believe the other path if you took it). This creates a conflict between Reflection and Conditionalization where both seem rational. This is a strong defeater for Reflection as a *universal* norm.

  9.  *(Self-Correction on Dutch Book)*: Ensure I mention that the Dutch Book argument relies on the assumption that you *must* bet at $t'$ according to $C_{t'}$. If you can pre-commit or refuse, the book fails.

