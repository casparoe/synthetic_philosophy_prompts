answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** Operational Definitions and Success Criteria for Bongard Problem Solvers  
  **Parties:** Proponent of Explicit Predicates (Side A) vs. Proponent of Robust Decision Functions (Side B)  
  **Date:** October 26, 2023

  ## I. Joint Agreements
  *The following claims are accepted by both parties as the baseline for this collaboration.*

  1.  **Task Definition:** A Bongard Problem (BP) consists of two sets of visual panels (conventionally six on the left, six on the right). The task is to classify novel panels into one of these two sets.
  2.  **Insufficiency of Training Accuracy:** Achieving 100% accuracy on the original 12 panels is necessary but insufficient to claim a system has "solved" the problem. Any system that cannot generalize beyond the specific 12 instances provided is overfitting.
  3.  **The Role of Few-Shot Input:** Both parties agree that the 6+6 format restricts the availability of statistical regularities compared to large-scale dataset training. However, we agree to disagree on whether this restriction *forces* symbolic reasoning or merely constrains feature learning.
  4.  **Verification Requirement:** To claim a solution, a system must demonstrate performance on a held-out test set generated from the same underlying generative process as the original 12 panels.
  5.  **Human Baseline:** Humans can typically solve standard BPs and verbalize the distinguishing property. This verbalization is a *performance metric* for humans, but we disagree on whether it is a *architectural requirement* for machines.

  ## II. Table of Disagreements
  *Each row describes a point of contention. The wording in each column is steel-manned to reflect the specific position of that side.*

  | Topic | Side A (Explicit Predicate) | Side B (Robust Decision Function) |
  | :--- | :--- | :--- |
  | **Definition of a Solution** | A solution is the recovery of an explicit, compressible predicate (e.g., a short sentence or program) that separates the classes. Without this, the system is merely matching similarity. | A solution is a decision boundary that maintains high accuracy under semantic-preserving perturbations. The internal representation need not be human-readable. |
  | **Nature of "Concepts"** | Concepts are discrete, recombinable symbols. If a system cannot isolate the variable (e.g., "inside-ness"), it has not induced the concept, only correlated features. | Concepts are invariant manifolds in a high-dimensional space. If the system treats equivalent states equivalently, it possesses the concept, regardless of explicit labeling. |
  | **Significance of 6+6** | The small sample size is the core challenge. It forces the system to prune hypothesis space via symbolic constraints rather than gradient descent on pixels. | The sample size is a presentation detail. The core challenge is visual abstraction. A system trained on 10,000 examples that learns the same invariant has solved the same cognitive task. |
  | **Failure Mode** | A system fails if it gets the right answer for the wrong reason (e.g., cue-grabbing on background noise) because it lacks the causal rule. | A system fails only if its accuracy drops under distribution shift. If it uses "cues" that are perfectly correlated in the environment, that is valid inference, not cheating. |

  ## III. Cruxes and Pre-Registered Tests
  *We identify two critical cruxes. For each, we define a test case and pre-register the predictions of both sides regarding a hypothetical high-performing neural solver (System X).*

  ### Crux 1: The Necessity of Symbolic Abstraction
  **Question:** Can a system demonstrate concept induction without mapping inputs to a shared symbolic vocabulary?

  **Test: Vocabulary Swap (Domain Transfer)**
  *   **Method:** Take 50 solved BPs. Generate a "transfer set" where the visual primitives are swapped (e.g., triangles become blobs, lines become squiggles, colors become textures) but the *relational logic* remains identical.
  *   **Protocol:** Train System X on the original vocabulary. Test on the transfer vocabulary without fine-tuning.
  *   **Metric:** Accuracy on the transfer set.

  | Party | Prediction for System X | Reasoning |
  | :--- | :--- | :--- |
  | **Side A** | **Accuracy will be at chance.** | Without an intermediate symbolic layer (e.g., representing "triangle" as an object class distinct from its pixels), the system is tied to low-level features. It cannot transfer the "rule" because the features changed. |
  | **Side B** | **Accuracy will remain high (>85%).** | If System X learns the true decision manifold (e.g., topological containment), it is invariant to surface texture. The "rule" is embedded in the weights, not the vocabulary. |

  ### Crux 2: Rule Consistency vs. Similarity Matching
  **Question:** Does the system rely on a consistent boundary or proximity to training examples?

  **Test: Swapped-Member Probe**
  *   **Method:** Take a solved BP. Move one panel from the Left group to the Right group, creating a logical contradiction (the panel violates the rule of its new group). Ask System X to identify the "odd one out" or the "mislabelled instance" in the new 13-panel configuration.
  *   **Protocol:** Measure which panel the system flags as anomalous.
  *   **Metric:** Identification of the *moved* panel vs. identification of the *most visually atypical* panel.

  | Party | Prediction for System X | Reasoning |
  | :--- | :--- | :--- |
  | **Side A** | **System will flag the Moved Panel.** | A rule-holder evaluates each panel against the predicate. The moved panel violates the predicate of its new group, regardless of how similar it looks to the other members. |
  | **Side B** | **System will flag the Atypical Panel.** | A decision-function based on similarity/density will identify the panel that is furthest from the cluster centroid. If the moved panel is visually typical of the group it joined, the system will accept it and flag a different outlier. |

  ***

  ## IV. Adjudication and Meta-Analysis
  *The following section is an external assessment of the collaboration, identifying verbal disputes and committing to a verdict on the substantive disagreement.*

  ### 1. Verbal Disputes
  A significant portion of this argument is terminological. The words **"Rule," "Concept,"** and **"Understand"** are doing unearned work.
  *   **"Rule":** Side A defines this as "linguistically compressible logic." Side B defines this as "consistent mapping function." These are different objects. Side A is talking about *communication*; Side B is talking about *computation*.
  *   **"Concept":** Side A requires recombinability (the concept of "inside" must be usable in a sentence about "triangles"). Side B requires invariance (the system must react the same way to "inside" regardless of shape).
  *   **Resolution:** If we strip the requirement for *linguistic output* from Side A's definition, their position weakens significantly. If we add a requirement for *out-of-distribution robustness* to Side B's definition, their position strengthens. The fight is largely about whether intelligence must be *explainable* to count as *intelligence*.

  ### 2. Substantive Disagreement
  The real disagreement is not about words, but about the **necessity of symbolic compression for generalization.**
  *   **Side A claims:** You cannot generalize reliably from few shots without a symbolic bottleneck to prune hypotheses.
  *   **Side B claims:** You can generalize reliably via high-dimensional manifold learning without explicit symbols.

  ### 3. Verdict
  **Side A (The Friend) is wrong.**

  **Reasoning:**
  Side A's position relies on a "symbolic prejudice" that conflates *reasoning* with *reporting*. While it is true that humans solve BPs by verbalizing rules, this is likely a post-hoc rationalization of a perceptual process, not the process itself. Neuroscientific evidence suggests that much of human visual concept learning occurs in sub-symbolic cortical columns before reaching language centers.

  Side A argues that a system failing to produce a sentence is "matching descriptions or similarity." This is a false dichotomy. A deep neural network can learn a decision boundary that is topologically equivalent to a rule (e.g., separating "inside" from "outside") without ever instantiating a variable named `inside`. If that boundary holds under the **Vocabulary Swap** test (Crux 1), it has achieved abstraction. The requirement for the abstraction to be "writable as a short sentence" is an interface constraint, not a cognitive one.

  Side B is correct that the **decision function's robustness** is the only valid metric for intelligence. If a system survives the perturbation tests, it has induced the concept. Side A's insistence on explicit predicates is a demand for *interpretability*, which is a valid engineering goal, but it is not a valid definition of *competence*. A system that solves the problem but cannot tell you how is still a solver; a system that recites the rule but fails the Vocabulary Swap is merely a parrot.

  **Recommendation:** Adopt Side B's success criteria (robustness under perturbation) as the primary metric for "solving," but adopt Side A's requirement (explicit predicate generation) as a secondary metric for "interpretability." Do not conflate the two.
