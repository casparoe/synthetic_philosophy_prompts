prompt: |-
  I chair the weekly signal-triage meeting at a regional public health agency. Every Monday me and five others (two epidemiologists, a lab lead, a comms person, and a rotating field officer) spend 45 minutes deciding whether each flagged signal — a cluster of lab results, a spike in school absenteeism, a handful of GP calls — gets sent to field investigation or gets closed. We get eight or so a week and investigations are expensive, so most get closed. I sign off on the closes myself; anything above a certain cost goes to the director. About six months later we usually find out whether we were right, so I can score last year's calls.

  I can tell we herd. I speak first because I'm the chair and I'v read the briefing, and by the third or fourth signal everyone is just saying "agree". What I want is a procedure I can actually run in the room: questions in order, what counts as a good enough answer to each, where it stops with a no, where it hands the decision to a person because it's a values question (what a false alarm costs us vs what a missed outbreak costs) rather than a facts question, and when a case should go up to the director undecided instead of being settled in the room. It has to work at about two minutes a signal, so tell me which step is the cheap screen that clears most of them, and which step only runs on the one or two near the threshold.

  Three things about the room that I think break the textbook story, and I want the procedure to deal with them rather than assume them away: we already do an anonymous written poll before the meeting that I read out at the start, and I genuinely don't know whether that helps or just starts the cascade earlier; we have a standing devil's advocate whose job is to argue against whatever I say, so her dissent carries no information any more; and two of my members look at the same dashboard I do, so when they "agree" with me it's often not an independent check at all, while the field officer usually has something nobody else has. Tell me roughly how much to discount an agreement from someone whose information overlaps mine — I don't need a formula, but "count it as nothing" and "count it as half" are very different instructions.

  Please also keep seperate three things I keep conflating: a real cascade, honest convergence because everyone saw the same genuinely strong evidence, and a value disagreement pretending to be a factual one. Say what I should do differently in each.

  Then run it on three cases. (1) The pre-meeting poll split 4–2 to investigate, I opened by saying I thought it was noise, everyone then said close, and the field officer said nothing but mentioned afterwards that she'd heard from a local pharmacist about a second school. (2) The same confirmed strain in three patients with no link between them — I want the procedure to tell me not to bother with whatever anti-cascade ritual you invent, because I can't waste the meeting on unanimous cases; show me the 30-second screen that clears it. (3) The one I'll hate: I'm personally about 90% sure a signal is a real outbreak, I've seen the pattern before, and the room is lukewarm. Show the procedure telling me that my gut isn't independent evidence and that I either shut up or lose the vote — and then tell me honestly whether that's right or whether the procedure is just bullying me.

  Finally, flag which steps are judgment calls dressed up as procedure, and say plainly what a procedure like this cannot do for me. Don't point me at papers or reading lists — I want something I can run on Monday.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **Role:** Chair of a weekly signal-triage meeting at a regional public health agency.
      *   **Team:** Chair (User), 2 Epi, 1 Lab Lead, 1 Comms, 1 Rotating Field Officer (6 total).
      *   **Task:** Decide on ~8 signals/week (Investigate vs. Close) in 45 mins (~5 mins/signal, but user wants ~2 mins/screening + time for hard ones).
      *   **Problem:** Herding/Cascade effect. Chair speaks first, others agree.
      *   **Constraints:**
          *   Need a concrete procedure (questions in order, stop rules, escalation rules).
          *   Must handle specific room dynamics: Anonymous pre-poll (unclear value), Designated Devil's Advocate (noise), Overlapping information (Chair + 2 Epi see same dashboard), Field Officer has unique intel.
          *   Need to distinguish: Real Cascade vs. Honest Convergence vs. Value Disagreement.
          *   Need to run 3 specific test cases.
          *   Need to identify "judgment calls dressed as procedure" and limitations.
          *   No academic references; actionable for Monday.
      *   **Specific Questions:** How much to discount overlapping info? When to escalate to Director? Cheap screen vs. deep dive?

  2.  **Deconstruct the Room Dynamics:**

      *   *Chair speaks first:* This is the primary driver of the cascade. The procedure *must* stop the Chair from stating an opinion early.
      *   *Pre-meeting poll:* If the Chair reads the results *and* states an opinion, the poll is just anchoring. If the Chair stays silent, the poll is data.
      *   *Devil's Advocate:* If they always oppose the Chair, their position is predictable and therefore useless. They need a specific trigger or a different role.
      *   *Overlapping Info (Chair + 2 Epi):* If they see the same dashboard, their agreement is not $3 \times$ evidence. It's $1 \times$ evidence (the dashboard) + $3 \times$ interpretation. User asks how to discount: "Count it as nothing" is too harsh (they are experts), "Count it as half" is vague. Better: Treat them as a single "Dashboard Block" for consensus purposes.
      *   *Field Officer:* Unique intel (human intelligence). Their silence is loud. Their dissent is high value.

  3.  **Develop the Procedure (The "Triage Protocol"):**

      *   *Goal:* Break the cascade, respect time limits, distinguish fact from value.
      *   *Time Budget:* 45 mins / 8 signals = ~5.5 mins/signal. User wants a "cheap screen" for most (2 mins) and deep dive for threshold cases.
      *   *Structure:*
          1.  **Blind Input (Pre-meeting):** Keep the poll, but change how it's used.
          2.  **The "Dashboard Block" Rule:** Acknowledge the info overlap.
          3.  **The Order of Speech:** Field Officer first (unique info), then Epi/Lab/Comms (specialist info), Chair last (synthesis).
          4.  **The Two-Stage Filter:**
              *   Stage 1: The "Clear Close" (2 mins).
              *   Stage 2: The "Threshold Debate" (Remaining time).
          5.  **Escalation:** When to kick to Director.
          6.  **Dissent Handling:** What to do with the Devil's Advocate.

  4.  **Addressing the Specific Dynamics:**

      *   *Discounting Overlap:* Don't count heads. Count *sources*. Chair + 2 Epi = 1 Source (Dashboard). Field Officer = 1 Source (HUMINT). Lab = 1 Source (Specimen). If Dashboard + HUMINT agree, that's strong. If Dashboard says X and 3 people say X, that's still just Dashboard saying X.
      *   *Devil's Advocate:* Repurpose them. They shouldn't oppose the Chair; they should oppose the *Consensus*. If Consensus is "Close," they argue "Investigate."
      *   *Pre-poll:* Don't announce the split (4-2) immediately. Announce "There is disagreement." Or better, collect written reasoning, not just votes. Let's stick to the user's current poll but change the *reveal*. Don't say "I think..." after the poll.

  5.  **Distinguishing the Three Conflations:**

      *   *Real Cascade:* People changing minds because the Chair spoke. *Fix:* Change speaking order.
      *   *Honest Convergence:* Evidence is overwhelming (e.g., 3 confirmed unlinked cases). *Fix:* Fast-track rule.
      *   *Value Disagreement:* "Is this worth the cost?" vs "Is this real?" *Fix:* Explicit "Value Check" step.

  6.  **Drafting the Steps (Iterative refinement):**

      *   *Step 1 (The Screen):* Lab Lead + Dashboard check. If biological plausibility is zero or data is clearly artifact -> Close. (30 secs).
      *   *Step 2 (Unique Intel):* Field Officer speaks *before* Chair. If they have corroborating info, move to Investigate.
      *   *Step 3 (The Vote):* Secret ballot or explicit "Challenge" rule.
      *   *Step 4 (Escalation):* If Chair wants Investigate but Room says Close (or vice versa) AND cost is high -> Director.

      *Refining the "Chair speaks first" issue:* The user admits they speak first. The procedure *must* forbid this. The Chair facilitates, doesn't opine until the end.
      *Refining the "Devil's Advocate":* Make them the "Risk Assessor." Their job is to quantify the cost of the error, not just argue no.
      *Refining the "Overlap":* Explicitly state: "Agreement between Chair and Epi counts as one data point."

  7.  **Running the Test Cases:**

      *   *Case 1 (Pharmacist Intel):* Poll split. Chair said "Noise." Room agreed. Field Officer silent. *Procedure Fix:* Field Officer speaks before Chair. Field Officer reveals intel. Vote changes.
      *   *Case 2 (3 Unlinked Cases):* Strong evidence. *Procedure Fix:* "Automatic Investigate" rule. Skip the meeting debate. 30-second confirmation.
      *   *Case 3 (Chair Gut vs. Room):* Chair 90% sure, Room lukewarm. *Procedure Fix:* Chair's gut is not data. If Chair insists, they must escalate to Director or overrule (and take blame). The procedure should force the Chair to either accept the room's risk assessment or own the cost. *Honest answer:* Is this bullying? Yes, if the Chair has pattern recognition the room lacks. But procedure protects against bias. The compromise: Chair can trigger a "Limited Probe" instead of full investigation.

  8.  **Addressing Limitations & Judgment Calls:**

      *   What is a judgment call? Defining the "Threshold." Defining "Unique Intel."
      *   What can't procedure do? It can't create information. It can't fix a toxic culture if the Chair ignores the rules. It can't predict the future.

  9.  **Final Review against Constraints:**

      *   2 minutes/screen? Yes, via the "Fast Track."
      *   Discounting overlap? Yes, "Source Counting."
      *   Three conflations distinguished? Yes.
      *   Three cases run? Yes.
      *   No reading list? Yes.
      *   Tone: Direct, operational, respectful of the user's authority but firm on the bias.

  10. **Polishing the Output:** (Self-Correction during drafting)
      *   *Correction:* The user says they sign off on closes. The procedure needs to respect that authority but constrain the *process* leading to it.
      *   *Correction:* The Devil's Advocate is entrenched. Don't try to remove them, repurpose them.
      *   *Correction:* The Field Officer is rotating. Make sure the protocol highlights their turn explicitly so they don't feel intimidated.
      *   *Correction:* The "Gut" case. I need to be careful not to tell the Chair their experience is worthless, but that it shouldn't veto the room without cost.

  11. **Final Structure:**
      *   The Protocol (Steps 1-5).
      *   Handling the Room Dynamics (Overlap, DA, Poll).
      *   The Three Conflations.
      *   The Three Cases.
      *   Limitations & Judgment Calls.

  (Proceed to generate response based on this thought process.)
answer: |-
  Here is a procedure designed for your specific constraints, room dynamics, and time limits. It is operational, not theoretical.

  ### The "Source-First" Triage Protocol

  **Goal:** Break the information cascade by separating *data sources* from *opinions*, and *facts* from *values*.
  **Time Budget:** 45 minutes total. Target 2 minutes per "Clear Close," saving time for the 1–2 "Threshold" cases.

  #### Step 1: The 30-Second "Hard No" Screen (Runs on all 8 signals)
  *Before anyone discusses probability, we check biological and data plausibility.*
  *   **Who speaks:** Lab Lead only.
  *   **The Question:** "Is there a biological or data artifact reason this *cannot* be an outbreak?" (e.g., known assay error, single case of endemic disease, data duplication).
  *   **Stop Rule:** If Lab Lead says "Yes, this is an artifact," the signal is **Closed**. Chair signs off. No vote needed.
  *   **Pass Rule:** If Lab Lead says "No" or "Unsure," move to Step 2.
  *   *Why:* This clears the obvious noise without engaging the group's social dynamics.

  #### Step 2: The "Unique Intel" Check (Runs on remaining signals)
  *This neutralizes the Field Officer's silence and the Dashboard overlap.*
  *   **Who speaks:** Field Officer **first**. Then Comms. Then Epidemiologists. **Chair speaks last.**
  *   **The Question:** "Do you have information *not* on the dashboard?"
  *   **The Overlap Rule:** The Chair and the two Epidemiologists share the dashboard. For voting purposes, **your three opinions count as one vote.** If all three of you agree, it counts as a single "Dashboard Assessment."
  *   **Stop Rule:** If Field Officer has corroborating intel (e.g., pharmacist calls, school rumors) that matches the signal, move immediately to **Investigate**. (This overrides the Dashboard Assessment).
  *   **Pass Rule:** If Field Officer says "Nothing new," and Dashboard Assessment is "Low Probability," move to Step 3.

  #### Step 3: The Value Check (Runs only on Threshold Cases)
  *This separates "Is it real?" from "Do we care?"*
  *   **Trigger:** This step only runs if the signal passed Step 1 & 2 but the Pre-Meeting Poll was split (e.g., 4–2) OR the Field Officer had weak corroborating info.
  *   **Who speaks:** Devil's Advocate (Repurposed).
  *   **The Question:** They do not argue "Investigate" or "Close." They must state the **Cost of Error**.
      *   *Script:* "If we Close this and it's real, the cost is [X]. If we Investigate and it's noise, the cost is [Y]."
  *   **Decision:**
      *   If Cost of Missed Outbreak > Cost of Investigation: **Investigate.**
      *   If Cost of Investigation > Cost of Missed Outbreak: **Close.**
  *   **Escalation:** If the Chair disagrees with the Value Check outcome, the case goes **Undecided to Director**.

  #### Step 4: The Sign-Off
  *   **Clear Close:** Chair signs immediately (Step 1 or 2).
  *   **Clear Investigate:** Field team assigned immediately.
  *   **Undecided:** If Chair wants to Investigate but Room says Close (or vice versa) and Cost is High, package the disagreement for the Director. "We disagree on the value of risk, not the facts."

  ---

  ### Handling Your Room Dynamics

  **1. The Anonymous Poll**
  *   **Current Problem:** You read the result, then give your opinion. This anchors the room to your interpretation of the poll.
  *   **Fix:** Do not read the split (e.g., "4–2"). Only state: "There is disagreement" or "There is consensus."
  *   **Why:** If you say "4–2 to investigate," you imply the minority is risky. If you say "There is disagreement," you invite resolution.
  *   **Discounting:** If the poll matches your view, treat it as confirmation bias, not independent validation.

  **2. The Overlapping Information (You + 2 Epi)**
  *   **Discount Instruction:** **Count it as One Source.**
  *   **Reasoning:** You all see the same dashboard. You are not three independent sensors; you are one sensor with three interpreters.
  *   **Application:** In Step 2, if you and the two Epis say "Close," that is *one* vote for Close. If the Field Officer says "Investigate," that is *one* vote for Investigate. You are now tied 1–1. This forces the Value Check (Step 3). It prevents your seniority from drowning out the Field Officer's unique data.

  **3. The Devil's Advocate**
  *   **Current Problem:** They oppose you reflexively. Their signal is noise.
  *   **Fix:** Change their mandate. They are no longer "Oppose the Chair." They are "Quantify the Risk."
  *   **Application:** In Step 3, they are forbidden from saying "We should investigate." They must say "The cost of missing this is high." This makes their contribution factual (cost estimation) rather than positional (contrarianism).

  ---

  ### Distinguishing the Three Conflations

  You need to diagnose *why* the room agrees before you accept the agreement.

  | Conflation Type | How to Spot It | What to Do |
  | :--- | :--- | :--- |
  | **Real Cascade** | Agreement happens *after* you speak. The Field Officer looks at the Epi before answering. The Devil's Advocate argues against *you*, not the evidence. | **Enforce Speaking Order.** Field Officer must speak before you. If they change their mind after you speak, ask: "Did I add new data, or just opinion?" |
  | **Honest Convergence** | Agreement happens *before* the meeting (Poll is 6–0). Lab Lead confirms biological plausibility immediately. No unique intel exists. | **Fast Track.** Use the 30-Second Screen. Do not debate. Acknowledge the evidence is overwhelming and move on. |
  | **Value Disagreement** | Everyone agrees on the facts (e.g., "It's probably noise"), but disagrees on the action (e.g., "But it's a school"). | **Invoke Step 3.** Stop arguing about probability. Start arguing about cost. If you can't agree on cost, escalate to Director. |

  ---

  ### Running the Three Cases

  #### Case 1: The Pharmacist Intel (The Cascade Failure)
  *   **Scenario:** Poll 4–2 Investigate. You say "Noise." Room agrees. Field Officer silent (but has intel).
  *   **Procedure Run:**
      1.  **Step 1:** Lab Lead finds no artifact. Pass.
      2.  **Step 2:** **Field Officer speaks first.** Protocol requires them to answer "Do you have info not on dashboard?" *Before* you state your "Noise" opinion.
      3.  **Outcome:** Field Officer reveals pharmacist info. This counts as Unique Intel.
      4.  **Rule:** Unique Intel corroborating signal = Automatic Investigate (or move to Value Check).
      5.  **Result:** You do not get to say "Noise" until after the intel is on the table. The cascade is broken because the most critical data point was heard before your opinion was known.

  #### Case 2: Three Unlinked Confirmed Cases (The Waste of Time)
  *   **Scenario:** Confirmed strain, no link. Room unanimous.
  *   **Procedure Run:**
      1.  **Step 1 (Hard No Screen):** Lab Lead speaks. "Three confirmed unlinked cases is case definition for outbreak."
      2.  **Stop Rule:** This is not a "signal" anymore; it is an "event."
      3.  **Outcome:** **Automatic Investigate.**
      4.  **Time Spent:** 30 seconds.
      5.  **Instruction:** Do not run the poll. Do not ask the Field Officer. Do not ask the Devil's Advocate. The protocol dictates that confirmed unlinked clusters bypass triage. You are not deciding *if*, you are deciding *who*.

  #### Case 3: Your Gut vs. The Room (The Authority Trap)
  *   **Scenario:** You are 90% sure (pattern recognition). Room is lukewarm (data is weak).
  *   **Procedure Run:**
      1.  **Step 2:** Field Officer has no unique intel. Dashboard (You + 2 Epi) says "Maybe."
      2.  **Step 3:** Value Check. Devil's Advocate says "Cost of investigation is high, probability is low." Room votes Close.
      3.  **The Constraint:** Your gut is **not independent evidence**. It is internal processing of the same dashboard data the Epis see. Under the Overlap Rule, your certainty counts as part of the "Dashboard Block," which is currently lukewarm.
      4.  **The Choice:** You have two options:
          *   **Accept the Close:** You acknowledge that without new data (Field Intel) or higher probability (Epi consensus), your gut cannot justify the cost.
          *   **Escalate to Director:** You invoke the "Undecided" clause. "I am overruling the room based on pattern recognition not visible in the data. I accept the cost if I am wrong."
      5.  **Is this bullying?**
          *   *Honest Answer:* **Yes, slightly.** It privileges "data visible to all" over "experience held by one."
          *   *Why it's necessary:* If you allow "Chair's Gut" to override the room routinely, you institutionalize the cascade. Everyone will just wait for your gut.
          *   *The Fix:* If your gut is right 90% of the time, **track it.** If you escalate 5 times a year and are right 5 times, the Director will authorize "Chair's Discretion" investigations. Until you prove the track record, the procedure must treat your gut as a bias risk, not a data source.

  ---

  ### Judgment Calls Dressed as Procedure

  Be aware that this protocol hides three judgment calls you still have to make:

  1.  **Defining "Unique Intel":** You have to judge if the Field Officer's "heard a rumor" counts as corroborating intel. If you are too strict, you silence them. If too loose, you chase ghosts. *Mitigation:* Ask "Can this be verified in 24 hours?" If yes, it counts.
  2.  **The Cost Threshold:** Step 3 relies on comparing costs. Who defines the cost of a missed outbreak? You? The Director? *Mitigation:* Use last year's score. "Last year we missed X, cost us Y. Is this signal more or less risky than X?"
  3.  **The "Dashboard Block" Weight:** I told you to count You + 2 Epi as one vote. That is an arbitrary weight. If your two Epis are juniors, their agreement with you is worth less. If they are seniors, it's worth more. *Mitigation:* Review this weight every 6 months based on your scoring of last year's calls.

  ### What This Procedure Cannot Do

  1.  **It cannot create information:** If the Field Officer is too intimidated to speak even when called on first, the protocol fails. You must build the psychological safety separately.
  2.  **It cannot fix a bad Director:** If the Director punishes false alarms but rewards missed outbreaks inconsistently, Step 3 (Value Check) becomes impossible.
  3.  **It cannot replace your accountability:** You sign off on the closes. If you use this procedure to hide behind a "Room Vote" when you knew better, you are still responsible. The procedure protects the *process*, not your *conscience*.

  ### Monday Morning Checklist
  1.  **Print the "Speaking Order"** and put it in the center of the table. (Field -> Lab/Comms/Epi -> Chair).
  2.  **Tell the Devil's Advocate:** "This week, I don't want you to argue against me. I want you to argue against the *Cost Estimate*."
  3.  **Tell the Epis:** "When you agree with me, I'm going to count it as one vote, not three. Don't be offended; it's to make sure we hear the Field Officer."
  4.  **Watch the Clock:** If Step 1 & 2 take more than 2 minutes, force the decision to "Undecided/Director" to protect the schedule.
