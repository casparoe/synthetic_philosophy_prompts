  4.  **Audit the Disanalogies (Where it breaks):**
      *   *Static vs. Dynamic Capacity:* Lifeboats have hard physical limits. Nations have economic/social limits that can expand (immigrants often *add* to capacity).
      *   *Passive vs. Active "Swimmers":* Swimmers are dead weight. Migrants bring labor, skills, culture, tax revenue.
      *   *Isolation vs. Interconnection:* Lifeboats are isolated. Nations are economically entangled with the "swimmers" (trade, supply chains, climate change, foreign policy).
      *   *Zero-Sum vs. Positive-Sum:* Lifeboat is zero-sum (one in, one out or sink). Migration is often positive-sum (economic growth).
      *   *Temporary vs. Permanent:* Lifeboats await rescue. Nations are permanent settlements.
      *   *Cause of Distress:* Swimmers are in water due to accident/fate. Migration is often driven by policies, history, or economic systems the "lifeboat" nations participated in.

  5.  **Evaluate Hidden Assumptions (The "Smuggling"):**
