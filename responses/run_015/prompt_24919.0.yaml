      *   *Inevitability of Collapse:* Assumes strain leads to catastrophe rather than adaptation.
      *   *Moral Boundary:* Assumes moral obligation stops at the border (nationalism vs. cosmopolitanism).
      *   *Agency:* Removes agency from current citizens (they are just "in the boat," not steering it).

  6.  **Assess the Policy Conclusion:**
      *   Does "restrictive immigration is ethically mandatory" hold?
      *   *Verdict:* No, not based *solely* on this analogy, because the analogy's premises are flawed regarding capacity and contribution. A nuanced policy might involve *managed* immigration rather than *restrictive* (in the sense of minimal) immigration.

  7.  **Develop Alternative Analogies:**
