  2.  **Map the Logical Space (Pre-computation):**
      *   *The Core Puzzle:* Kavka's Toxin Puzzle challenges the connection between intention, belief, and reason. Can one intend to do $X$ if one knows one will have no reason to do $X$ when the time comes?
      *   *Claim A (Intention-Belief Thesis):* Does intending to $\phi$ entail believing one will $\phi$? (Bea leans yes, Alan leans no/qualified).
      *   *Claim B (Intention-Reason Connection):* Does intending require a current reason to act *at the time of action*, or just a reason to form the intention *now*? (Alan argues reasons can be manufactured/iterative; Bea argues intention tracks expectation based on reasons).
