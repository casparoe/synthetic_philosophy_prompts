answer: |-
  There is no universally established technical term in analytic social ontology that precisely captures this non-causal, bidirectional conceptual dependence, so I will coin the label **Conceptual Co-constitution**.

  **Conceptual Co-constitution** refers to a relationship between two levels of description (micro and macro) where the truth conditions for statements at either level logically require reference to the other, without implying a temporal or causal loop. Unlike supervenience, which asserts that fixing the micro fixes the macro (asymmetric dependence), co-constitution asserts that you cannot fully specify the micro facts without invoking macro concepts, nor can you identify the macro facts without invoking micro arrangements. The dependence is semantic and ontological, not mechanical. It marks a failure of **separability**: the levels cannot be defined independently even in principle.

  This configuration is distinct from neighboring notions in the following ways:
  *   **Supervenience:** Supervenience is asymmetric (A supervenes on B, but B does not supervene on A). Co-constitution is symmetric regarding definitional dependence.
  *   **Emergence:** Weak emergence is compatible with reducibility; strong emergence implies novel causal powers. Co-constitution implies neither novelty nor causal power, only mutual definitional necessity.
  *   **Downward Causation:** This implies the macro level causally influences the micro level over time. Co-constitution is synchronic and logical, not diachronic and causal.
  *   **Reflexivity:** In social theory, reflexivity usually describes a feedback loop where beliefs alter outcomes over time. Co-constitution describes the static logical structure of the description itself, regardless of time.
  *   **Microfoundations:** The demand for microfoundations assumes the macro can be rebuilt from the micro. Co-constitution shows that the "micro" foundation already contains the macro in its specification.

  Case (1) and Case (2) are species of this same genus, but they operate through different mechanisms. Case (1) is **Intentional Co-constitution**. The dependence runs through the content of individual mental states. The individual's belief is *about* the collective; therefore, the description of the individual fact (the belief) semantically contains the collective concept. If you remove the collective vocabulary, you change the belief itself. Case (2) is **Functional Co-constitution**. The dependence runs through the classification of dispositions. The individual dispositions exist independently, but their identity as "components of a risk-averse firm" depends on the macro-level functional context. Without the macro concept (the firm's role), the micro dispositions are just behaviors; with it, they are parts of a system.

  The two cases come apart if you can find a scenario where the macro concept is not required to specify the micro state. In Case (1), if depositors withdrew for reasons unrelated to the bank's solvency (e.g., a sudden personal need for cash unrelated to expectations), the co-constitution breaks; the micro fact becomes independent. In Case (2), if the firm's risk aversion were simply the arithmetic mean of individual risk aversions, the macro property would be aggregative and reducible, dissolving the co-constitution. The persistence of the dependence in both your examples confirms they are instances of the same logical configuration, despite the intentional vs. functional difference.

  I am 90% confident that there is no single, standardized term in analytic philosophy that isolates this specific non-causal mutual dependence without ambiguity. I am 80% confident that **Conceptual Co-constitution** accurately captures the boundaries you described while distinguishing it from causal loops. I am 60% confident that Case (1) and Case (2) are fundamentally the same ontological phenomenon rather than merely analogous structures. The claim I am least sure of is the unity of Case (1) and Case (2); it is possible that intentional content dependence (Case 1) is a linguistic feature while functional classification dependence (Case 2) is a metaphysical feature, and lumping them together obscures a deeper distinction between semantics and ontology.
