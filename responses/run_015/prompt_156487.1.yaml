  You are running two distinct notions together, but they can be unified under a single principle: **function is the effect that contributes to the persistence of the system responsible for the trait's presence.**

  This **Maintenance Principle** resolves your cases by identifying the "sustaining system" in each scenario. When the sustaining system is **historical selection**, function is etiological (why the trait type exists). When the sustaining system is **current dynamics** (development, design, or physiology), function is systemic (what the trait token does now).

  Here is how the principle handles your specific verdicts:

  *   **Cases 1, 2, 6, 9 (Historical Maintenance):** The sustaining system is natural selection acting over generations. In Case 2 (cave fish), the eyes are present because ancestors were selected for seeing; the function remains "seeing" because that is what the historical system optimized, even if the current token fails. In Case 9 (jaw-to-ear), the sustaining system has shifted; selection now maintains the bone for hearing (B), so the function updates to B, erasing A.
  *   **Cases 3, 8 (Current Maintenance):** The sustaining system is not selection, but a **developmental regime** (toad) or **intentional design** (pump). The toad patch is rebuilt every generation by a developmental system that responds to light; its function is cooling because that is what sustains the *organism* now, regardless of lineage history. The pump is sustained by the surgeon's intent; its function is pumping.
  *   **Case 5 (Drift/Weak Maintenance):** The sustaining system is random drift, which has no "goal." Because drift does not maintain traits *for* an effect, your intuition that the function is "weaker" is correct: it is a **useful effect** but not a **proper function** in the historical sense, nor a **designed function** in the systemic sense. It is accidental utility.
  *   **Case 7 (Relative Systems):** You identified that function is relative. This principle specifies the relativity: function is relative to the **beneficiary system**. Relative to the organism (sustained by fertility), the element is dysfunctional. Relative to the element (sustained by copying), it is functional.

  To test this further, here are verdicts on two new cases:

  *   **Gut Bacteria (Vitamin K):** This is a **dual-system case**. Relative to the host organism, the bacteria's function is vitamin production (contributing to host persistence). Relative to the bacterial lineage, the function is securing a habitat (contributing to bacterial persistence). Both are true because two different sustaining systems are involved in the symbiosis.
  *   **Co-option (Selection for A, shifting to B):** If a trait is still primarily maintained by selection for A, but B is becoming useful, the function is **transitional**. If selection for A ceases and selection for B begins maintaining the trait, the function flips to B. If both maintain it, it has **plural functions**.

  The cost of this principle is that you must drop the idea that "function" means the same thing in Case 2 and Case 3. In Case 2, you are making a claim about **history** (this trait exists because of seeing). In Case 3, you are making a claim about **current utility** (this trait exists because of cooling). They are both valid functional ascriptions, but they rely on different modes of maintenance. You must also accept that Case 5 (drift) is technically **functionless** regarding the organism's design, even if it is beneficial; calling it a "weak function" is a charitable shorthand for "accidental benefit." If you want to keep your verdict on Case 5 as a genuine function, you must weaken the principle to allow **any** contribution to persistence to count, but this will force you to admit the cave fish eyes have a function (structural support, perhaps), which you explicitly rejected. To stay consistent with your Case 2 verdict, you must treat Case 5 as secondary to true functional traits.
