answer: |-
  Here is a decision tree designed to sort your reading group's underlying commitments. It avoids labels at the start and forces choices on concrete cases. It is structured to separate the six required cases plus one 'glossed over' distinction, resulting in nine distinct leaves.

  ### The Demography Value Tree

  **Starting Commitment:** We accept that policy can affect how many people exist. We are judging the *value* of the outcome, not the feasibility of the policy.

  #### Node 1: The Source of Value (The 'Glossed Over' Split)
  **Case:** Imagine a choice where a larger population results in *slightly* less technological innovation and *higher* fiscal strain, but the total number of lives worth living is higher. Is the larger population still *pro tanto* better?
  *   **No:** The value of population size is entirely dependent on the external benefits (innovation, fiscal, defence) it secures.
      *   → **Leaf 1: The Instrumentalist.** (Population is a means to an end).
  *   **Yes:** There is intrinsic value in the lives themselves or the scale of the civilisation.
      *   → **Go to Node 2.**

  *(Note: This node splits Instrumentalists from Intrinsic Totalists. In standard cases where growth brings innovation, both say 'grow'. They only diverge here. This is the distinction your group likely glosses.)*

  #### Node 2: Holism vs. Individualism
  **Case:** Is a civilisation of ten billion people doing things together worth something *over and above* the sum of ten billion individual lives?
  *   **Yes:** The collective entity has value distinct from the aggregate welfare of its members.
      *   → **Leaf 2: Scale-Value.** (Holistic value).
      *   *(Diagnosis: This is not merely instrumental value in disguise. Instrumentalists value the population for what it produces for *existing* people. Scale-Value advocates value the 'greatness' or 'endurance' of the collective itself, even if individual welfare is static.)*
  *   **No:** Value is exhausted by the welfare of the individuals within the population.
      *   → **Go to Node 3.**

  #### Node 3: The Repugnant Trade-off
  **Case:** A choice between 8 billion people at welfare level 70 and 12 billion people at welfare level 55 (on a 0–100 scale).
  *   **8 Billion is Better:** Average welfare or a threshold matters more than the sum.
      *   → **Go to Node 4 (Averagist/Prioritarian Path).**
  *   **12 Billion is Better:** The total sum of welfare is what counts.
      *   → **Go to Node 5 (Totalist/Critical Path).**

  #### Node 4: The Threshold Question (For those who rejected the Repugnant Conclusion)
  **Case:** Does the moral priority lie with raising the average, or specifically with ensuring no one falls below a sufficiency threshold?
  *   **Raise the Average:** We should maximise the mean welfare.
      *   → **Leaf 3: Averagism.**
  *   **Protect the Worst-Off:** We should prioritise the condition of the least advantaged, even if it lowers the average.
      *   → **Leaf 4: Prioritarian/Threshold.**

  #### Node 5: Mere Addition (For those who accepted the Repugnant Conclusion)
  **Case:** Adding one extra life that is only barely worth living (positive welfare, but very low). Does this addition make the outcome better?
  *   **Yes, Always:** Any life worth living adds value.
      *   → **Go to Node 6.**
  *   **No/Neutral:** A life must meet a critical level of welfare to add value.
      *   → **Leaf 5: Critical-Level Utilitarianism.**
      *   *(Note: This view avoids the Repugnant Conclusion by setting the 'critical level' above the 'barely worth living' line.)*

  #### Node 6: Existing vs. Potential People
  **Case:** For the same cost, you can either save a 40-year-old (who will live 30 more good years) or cause an additional happy person to exist (who will live 70 good years).
  *   **Save the 40-year-old:** We have stronger obligations to existing people than to potential people.
      *   → **Go to Node 7.**
  *   **Create the New Person / Indifferent:** A life is a life; identity does not create priority.
      *   → **Go to Node 8.**

  #### Node 7: The Non-Identity Test (For those who prioritise existing people)
  **Case:** A choice that changes *who* exists without making anyone worse off than they would otherwise have been (e.g., a policy that causes different children to be born, some with disabilities, who would not otherwise have existed). Is this outcome objectionable?
  *   **No:** If no specific person is harmed, there is no objection.
      *   → **Leaf 6: Person-Affecting / No-Difference View.**
  *   **Yes:** The outcome is worse because the people who exist are less well-off than those who *could* have existed.
      *   → **Leaf 7: Asymmetry / Moderate Person-Affecting.**
      *   *(Note: This view accepts obligations to future people but denies that creating happy people is a duty.)*

  #### Node 8: The Risk Profile (For Impersonal Views)
  **Case:** If you think the long-run future is more likely to be astronomically bad (suffering) than astronomically good (flourishing), does the risk of bad outweigh the potential good?
  *   **Yes:** The disvalue of suffering outweighs the value of happiness.
      *   → **Leaf 8: Suffering-Focused.**
      *   *(Note: This leads to a strong precautionary principle against expansion.)*
  *   **No:** Happiness and suffering are symmetric; we should maximise expected value.
      *   → **Leaf 9: Totalism.**

  ---

  ### Analysis of the Logical Space

  #### 1. Unoccupied Combinations
  There are two combinations of answers that are logically possible but virtually unoccupied in the literature:
  *   **The 'Sadistic' Totalist:** Someone who answers 'Yes' to Node 3 (12bn is better) but 'Yes' to Node 8 (Suffering dominates). This is incoherent. If suffering dominates, you cannot accept the Repugnant Conclusion where vast numbers of people live lives barely above the suffering threshold. This combination is squeezed out by the logic of aggregation.
  *   **The 'Instrumental Scale-Value' Advocate:** Someone who answers 'Yes' to Node 2 (Civilisation value) but 'No' to Node 1 (Value is only instrumental). This is unstable. If the civilisation has value over the sum of lives (Node 2), that value is intrinsic to the collective, not merely instrumental for fiscal stability. Most who claim 'Scale-Value' are committed to the 'Yes' at Node 1.

  #### 2. Indistinguishable Leaves
  The tree cannot fully separate **Critical-Level Utilitarianism** (Leaf 5) from **Totalism** (Leaf 9) on all realistic cases. If the 'critical level' is set very low (e.g., at the point of a life barely worth living), the two views yield identical verdicts on almost all demographic questions. They only diverge on the 'Mere Addition' case (Node 5). In practice, your group may find members clustering here who claim to be Totalists but intuitively balk at adding miserable lives.

  #### 3. Impossibility Results
  *   **The Repugnant Conclusion:** Bites **Leaf 9 (Totalism)**. To avoid it, Totalists must accept that a vast population of lives barely worth living is better than a smaller, happier one. **Leaf 5 (Critical-Level)** and **Leaf 3 (Averagism)** are specifically designed to escape this squeeze.
  *   **The Non-Identity Problem:** Bites **Leaf 6 (Person-Affecting)**. This view struggles to explain why it is wrong to choose a policy that creates disabled children if those children would not otherwise exist. **Leaf 7 (Asymmetry)** and **Leaf 9 (Totalism)** avoid this by accepting impersonal comparisons.
  *   **The Mere Addition Paradox:** Bites **Leaf 9 (Totalism)** and **Leaf 5 (Critical-Level)**. If adding a happy person is always good, and adding a barely-worth-living person is good, logic forces you toward the Repugnant Conclusion. **Leaf 3 (Averagism)** avoids this but falls prey to the 'Sadistic Conclusion' (preferring a smaller population where everyone suffers terribly, provided the average is high).

  #### 4. Policy Implications: Intrinsic vs. Instrumental
  Your group conflates "more people is better" with "we should have more babies." This tree separates the *reason* for the verdict.
  *   **Leaves 1 (Instrumental) & 2 (Scale-Value):** These provide a reason to encourage births *only if* the empirical conditions hold (innovation is needed, civilisation needs scale). If technology substitutes for labour, or if scale threatens stability, the reason vanishes.
  *   **Leaves 3, 5, 9 (Averagism, Critical, Totalism):** These provide an *intrinsic* reason. However, **Leaf 3 (Averagism)** might actually recommend *fewer* babies if current welfare is low. **Leaf 9 (Totalism)** recommends more babies as long as lives are worth living.
  *   **Leaves 6, 7, 8 (Person-Affecting, Asymmetry, Suffering-Focused):** These leaves leave it down to contingent facts or recommend caution. **Leaf 8 (Suffering-Focused)** specifically suggests that increasing population is likely *bad* due to existential risk. **Leaf 6 (Person-Affecting)** suggests we have no duty to create new people, only to help those who exist.

  **Summary for the Group:** If you find yourself arguing for pronatalism, check Node 1. If you are an Instrumentalist, your argument is empirical (will they innovate?). If you are a Totalist, your argument is axiological (is more joy better?). If you are Suffering-Focused, you should be arguing for *fewer* births. The tree reveals that 'pronatalist' is not a single position, but a convergence of five different moral geometries.
