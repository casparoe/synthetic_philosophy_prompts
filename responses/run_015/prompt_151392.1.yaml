      *   **Framing:** "Ambient Commemoration" (Statues = focal/intentional vs. Street/Building Names = diffuse/infrastructural/embedded).
      *   **Key Questions to Address:**
          *   Who had standing to demand removal in each case (statue vs. names)?
          *   How does "restoration" differ (museum-ization vs. erasure of toponym)?
          *   Where does the theory break? (Are some street names more focal than hidden statues?)
          *   Do commemoration ethics treat spatial infrastructure differently from art objects, or do they collapse?
