      *   *The Hall:* Music venue. Renamed "The Beacon." Long campaign before 2020.
      *   *The Street:* Colston Street. Debate ongoing. Council decided to keep names but add contextual plaques (initially), then later reviews. Actually, the Bristol City Council "Address and Street Name Review" concluded in 2021/2022. Some names changed, Colston Street largely remained but with context? *Correction:* Need to verify the specific outcome for Colston Street. *Self-Correction:* The Council decided *not* to rename Colston Street in the initial sweep, opting for contextualization, though the Hall was renamed earlier. This distinction is crucial for the "ambient" argument.
