prompt: |-
  hey i wanna think through the 2020 bristol colston statue removal using a kinda niche framing: "ambient commemoration." the idea is that statues are focal, intentional monuments — you go to them, they face you — but street names and building names are diffuse, infrastructural markers that embed honor into everyday navigation without anyone really noticing. so take the colston statue being pulled down during the BLM protests and dumped in the harbor, plus the later renaming of colston hall and the debates over colston street. analyze it through that lens: who had standing to demand removal of the statue versus the street names? how does the "restoration" framing apply differently when a statue can be museum-ized versus a renamed street which just erases a toponym? and where does the theory break — are there cases where a street name is actually more focal than some hidden statue? does the bristol episode show that commemoration ethics should treat spatial infrastructure differently from art objects, or do they collapse into each other? don't just summarize the news; map the actors, the options, what counts as the harm in each case, and say where the framing stays silent.
reasoning: |-
