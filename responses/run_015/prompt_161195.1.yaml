answer: |-
  Your hypothesis is the most penetrating of the options presented. The stalemate is not primarily about the physics (the equations agree) nor merely about semantics (Candidate i), but about the **ontological status of information** and the **methodological boundaries of explanation**.

  However, to answer your specific constraint: the operational structure of the disagreement is **Candidate (iii)** (disagreement about which setups count as the data/system boundary), but this is merely the proxy war for the deeper conflict you identified in your hypothesis (the goal of the exorcism).

  Here is the diagnosis of the structure, the evaluation of your candidates, and the path to progress.

  ### 1. The Diagnosis: Boundary Conditions as Ontology

  The two camps agree on the generalized Second Law (e.g., the Sagawa-Ueda relation: $\langle W \rangle \le \Delta F + k_B T \langle I \rangle$). They agree that correlations can be converted to work. They disagree on **where the entropy production is localized** in the cycle, and this localization depends entirely on how they draw the system boundary.

  *   **Camp A (Landauer/Bennett):** Draws the boundary around the **Demon's Memory**. The memory is part of the machine. To make the machine cyclic, the memory must be reset. The cost is localized at the **reset**. This supports the thesis that "Information is Physical" because the information content of the memory directly dictates the heat dissipation.
  *   **Camp B (Earman/Norton):** Draws the boundary around the **Demon + Probe Source**. They argue you cannot assume a low-entropy memory probe is available for free. The cost of creating that low-entropy probe (acquisition/preparation) is where the entropy is generated. The "reset" is irrelevant because you should simply discard the used probe and grab a fresh one. This supports the thesis that "Statistical Mechanics is Sufficient" because the cost is just standard thermalization of a resource, not a special "information tax."

  **Why Candidate (iii) is the actual structure:**
  The "swap" scenario you described (reversible interaction with an external register) is the crucible.
  *   For Camp A, swapping a correlated memory with a fresh thermal register *is* erasure (of the mutual information). The correlation is thermalized.
  *   For Camp B, this is simply consuming a resource (the fresh register). There is no "erasure" in the Landauer sense; there is only the thermodynamic cost of maintaining a supply of low-entropy registers.

  The disagreement persists because Camp A treats the memory state as an internal variable of the demon, while Camp B treats the memory state as an external fuel source. Both descriptions are mathematically equivalent, but they tell different causal stories.

  **Why Candidates (i) and (ii) are secondary:**
  *   **(i) Verbal dispute:** While "erasure" is defined differently, this is a symptom. If they agreed on the system boundary (iii), the definition of erasure would settle itself.
  *   **(ii) Reversibility of Measurement:** This was the battleground in the 1980s (Bennett vs. Norton). However, the advent of fluctuation theorems has largely conceded that measurement *can* be modeled reversibly in principle. The fight moved to the *cycle closure*. Camp B now argues that while measurement *interaction* is reversible, the *preparation* of the measuring device is not. This collapses back into (iii): is the preparation part of the demon's cycle?

  ### 2. Why Your Hypothesis is the Root Cause

  You correctly identified that the quarrel is about **what an exorcism is supposed to accomplish.**

  *   **Camp A wants a Constructive Exorcism:** They want to show that Information is a thermodynamic quantity on par with Energy and Entropy. To do this, they need a specific mechanism (Landauer Erasure) that ties information processing to heat dissipation *necessarily*. They need the demon to fail *because* it is an information processor.
  *   **Camp B wants a Reductive Exorcism:** They want to show that "Information" is just a useful bookkeeping label for phase-space volumes. They suspect Camp A is smuggling in the Second Law to prove the Second Law (circularity). They want the demon to fail *because* it is a physical machine subject to standard statistical mechanics, without needing a new principle about "information."

  As long as Camp A demands a proof that "Information is Physical" and Camp B demands a proof that "Information is just Mechanics," they will talk past each other. The math (fluctuation theorems) satisfies both, so neither feels compelled to move.

  ### 3. What Counts as Progress?

  No new experiment will resolve this, because both camps predict identical heat and work values for any given setup. No new theorem will resolve this, because the Sagawa-Ueda bounds are already general enough to encompass both views.

  Progress requires a **Restatement of the Question** via the framework of **Quantum/Thermodynamic Resource Theory**.

  **The Restatement:**
  Stop asking "Where is the cost? (Acquisition vs. Erasure)."
  Start asking "What is the Resource? (Correlations vs. Low-Entropy States)."

  In Resource Theory, thermodynamics is a theory of state conversion under constraints.
  1.  **Correlations are Fuel:** A correlated state between system and memory is a non-equilibrium resource.
  2.  **Decoupling is the Cost:** To close the cycle, the demon must decouple from the system. Decoupling a correlated state into a product state (system $\otimes$ memory) necessarily increases entropy elsewhere, regardless of whether you call it "erasure" or "swapping."
  3.  **Equivalence:** "Erasing a memory" and "Swapping with a fresh register" are thermodynamically equivalent operations *if* you account for the entropy of the fresh register.

  **The Specific Progress Needed:**
  A **Translation Manual** (or Duality Proof) that explicitly maps the "Erasure Cost" of Camp A to the "Preparation Cost" of Camp B.
  *   Show formally that $W_{erase}$ (Camp A) $= W_{prepare}$ (Camp B) + $W_{swap}$.
  *   Demonstrate that the choice between them is a choice of **gauge** (where you set the zero point of entropy/accounting), not a choice of physics.

  **Why this resolves the stalemate:**
  It validates Camp B's suspicion (you don't need a new law, just standard accounting) while validating Camp A's intuition (information processing has a physical cost, because correlations are physical resources). It dissolves the "ontological" fight by showing that "Information is Physical" is a category error; the correct statement is "Correlations are Thermodynamic Resources."

  ### Summary
  *   **Structure:** Candidate (iii) (System Boundaries).
  *   **Driver:** Your Hypothesis (Ontological vs. Methodological goals).
  *   **Progress:** A shift to **Resource Theory** that treats "erasure" and "acquisition" as dual descriptions of the same resource consumption (decoupling correlations).
  *   **Expectation:** Do not expect an experimental verdict. Expect a conceptual dissolution. The debate will end not when one side wins, but when the next generation of physicists adopts the Resource Theory framework where the distinction is recognized as a matter of accounting convention rather than physical mechanism.
