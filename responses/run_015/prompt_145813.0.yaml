  This procedure operationalizes Jaspers' taxonomy to prevent category errors between legal liability and existential solidarity, ensuring institutional speech acts match the specific guilt-type alleged. Its two critical decision gates are **Representational Standing** (Step 2), which verifies the museum's authority to speak for the collective, and **Guilt-Type Matching** (Step 1), which dictates the permissible speech act. The structure is weakest at the **Metaphysical boundary**, where universal co-responsibility risks paralyzing institutional action or masking political avoidance as philosophical humility, requiring board intervention.

  **Decision Procedure:**
  1.  **Categorize:** Classify the wrong as Criminal (law-breaking), Political (state liability), Moral (conscience), or Metaphysical (solidarity).
  2.  **Standing Gate:** Does the museum represent the specific collective bearer (State, Citizenry, or Humanity)? If No → Stop ("No statement appropriate"). Institutions cannot bear Moral guilt (individual) or Metaphysical guilt (universal); attempting to speak here constitutes overreach.
  3.  **Adjudication Gate:** Is guilt established by competent authority (courts for Criminal; transitional mechanisms for Political)? If No → Escalate to Board Value Judgment. Here, the Board must accept responsibility for the uncertainty, moving from conceptual derivation to political risk assessment.
  4.  **Speech Act:** Criminal → Acknowledgment; Political → Apology/Designation; Moral → Silence; Metaphysical → Silence/Solidarity.

  **Applications:**
  1.  **Famine Apology:** Classified as Political guilt (state liability). Since present citizens include descendants of perpetrators and victims, liability is collective via citizenship. However, Step 2 (Standing) fails: the Museum represents memory, not the State's legal continuity required for an official apology seventy years later. The Ministry holds the liability. Result: Museum refuses co-signature; offers Acknowledgment instead.
  2.  **Criminal Labeling:** Classified as Criminal guilt. Step 2 fails: the Museum lacks judicial standing to label individuals "criminal" or display names as perpetrators in a permanent gallery without verdicts. Result: "No statement appropriate" on naming; display only established court records.
  3.  **Forced-Labor Silence:** Board claims Metaphysical guilt mandates silence. Step 2 fails: Metaphysical guilt is universal, not institutional; it cannot confer standing to enact official silence. This triggers Step 3 Escalation, exposing the board's reasoning as disguised political caution rather than philosophical necessity, forcing a value choice on visibility.

  This procedure cannot resolve conflicts where political survival requires contradicting established historical truth.
