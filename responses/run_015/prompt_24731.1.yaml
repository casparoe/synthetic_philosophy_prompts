answer: |-
  This is a sharp argument. It effectively formalizes a common skepticism about "moral mathematics." Your intuition that it "proves too much" is the correct diagnostic tool here. If this argument succeeds, it doesn't just kill Effective Altruism (EA); it kills Expected Utility Theory (EUT), cost-benefit analysis in economics, and arguably any decision-making framework that involves weighing trade-offs under uncertainty. Since those frameworks are conceptually coherent (even if practically difficult), the argument must contain a flaw in its theory of measurement.

  Here is the breakdown of where the argument fails, why it looked plausible, and the costs of fixing it.

  ### The Weak Link: Premise (8)

  **Premise (8):** *If the choice of unit is arbitrary, then the EMV ranking it produces depends on an arbitrary choice, and so is not a fact about which option is genuinely better.*

  This is the premise you should reject. It relies on a misunderstanding of how measurement scales work in decision theory and physics.

  **Why it looked fine on first reading:**
  It appeals to a robust intuition about objectivity: if the ruler you use is chosen arbitrarily (inches vs. centimeters), then the numbers you get are "just conventions." The argument smuggles in the idea that if the *numbers* are conventional, the *relationships* between the numbers must also be conventional.

  **Why it is false:**
  In measurement theory, we distinguish between **Ratio Scales** (like mass or length, where zero is absolute) and **Interval Scales** (like temperature in Celsius or Fahrenheit, where zero and unit size are conventional).

  *   **The Temperature Analogy:** The choice between Celsius and Fahrenheit is "arbitrary" in the sense of Premise (5). There is no fact of the matter that nature prefers one over the other. However, it is **not** the case that the ranking of temperatures depends on this arbitrary choice. If Water A is hotter than Water B in Celsius, it is *necessarily* hotter in Fahrenheit. The transformation is linear ($F = 1.8C + 32$). The *ordering* is invariant under the change of unit.
  *   **Application to EMV:** Expected Utility Theory (and by extension, EMV) treats utility/value as an **interval scale**. You do not need a unique, discovered "moral meter" to rank options. You only need a consistent representation of your moral preferences (or moral facts) such that positive linear transformations preserve the ordering of expected values.

  If Option A has twice the EMV of Option B in "hedons," and you switch to "kilohedons," Option A still has twice the EMV of Option B. The *magnitude* changes, but the *guidance* (choose A over B) does not. Therefore, the arbitrariness of the unit does not render the ranking arbitrary.

  ### The Secondary Weak Link: Premise (3)

  **Premise (3):** *To compare EMVs, you must represent each option's moral value as a quantity on some scale.*

  This is worth challenging if you want to be more concessive. Strictly speaking, to *maximize* EMV, you need cardinal values (to multiply by probability). But to simply *choose the better option*, you arguably only need an **ordinal** ranking. However, since EA explicitly commits to quantification for the sake of expectation calculations, rejecting (3) undermines the EA project itself. It is better to hold (3) and reject (8).

  ### The Costs of Rejecting Premise (8)

  If you reject (8) to save the EA decision procedure, here is what both sides must pay:

  #### 1. What the EA Defender Must Concede
  By rejecting (8), you are accepting that moral measurement is **interval-like**, not **ratio-like**.

  *   **No "Absolute Zero" of Moral Value:** You must concede that there may be no fact of the matter about the "absolute zero" of moral value (unlike mass, where 0kg is the absence of mass). In utility theory, the zero point is often set by convention (e.g., the utility of the status quo = 0).
  *   **Intertheoretic Comparison is Hard:** If moral units are conventional within a framework, comparing units *across* different moral frameworks (e.g., Utilitarianism vs. Deontology) becomes extremely difficult, perhaps impossible. You can maximize EMV *given* a moral theory, but the argument shows you cannot easily use EMV to *select* the moral theory itself without circularity.
  *   **Epistemic Humility:** You must concede that while the *concept* of EMV is coherent, the *practice* is epistemically fraught. Just because the thermometer works doesn't mean we can accurately read the temperature of a distant star. The "measurability bias" critic is right that we often pretend to have more precision than we do, even if precision is theoretically possible.

  #### 2. What the Measurability-Bias Critic Loses
  *   **The Conceptual Knockout:** The critic can no longer claim that EMV is *conceptually incoherent* or *guidance-free*. They lose the argument that EA is "meaningless."
  *   **The "Proves Too Much" Shield:** They can no longer use this specific argument to attack standard decision theory or economics without undermining themselves. If they accept that economics works, they must accept that interval measurement provides guidance.
  *   **The Shift to Epistemology:** The critic is forced to retreat from a metaphysical objection ("You can't measure value") to an epistemic one ("You can't *know* the values well enough to trust the calculation"). This is a weaker position. It turns the critique into a practical warning ("Don't overestimate your precision") rather than a philosophical refutation ("The project is impossible").

  ### Summary of the Exit

  The argument fails because it conflates the **conventionality of representation** with the **arbitrariness of relations**.

  *   **Step (5)** is arguably true: The unit is a choice (like meters vs. feet).
  *   **Step (8)** is false: The ranking is *not* arbitrary just because the unit is chosen.

  **The Fix:**
  Modify the conclusion. The EMV computation *does* deliver a non-arbitrary answer about what we should do **relative to the chosen moral framework and scale**, provided the scale is consistent. The "guidance" is real, but it is internal to the framework.

  **Your "Proves Too Much" intuition was the compass.** It pointed directly to the fact that this argument attacks the structure of *measurement* itself. Since we know measurement works in physics (despite arbitrary units like Celsius), and we know decision theory works in economics (despite arbitrary utility units), we know Premise (8) must be false. The EA defender saves the theory by accepting that moral measurement is a human construct that tracks objective relations, much like a map tracks a territory. The map's scale is arbitrary; the route it recommends is not.
