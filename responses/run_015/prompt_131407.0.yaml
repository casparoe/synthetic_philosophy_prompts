  | **1. Descriptive Relativism** | **Empirical Claim:** Human groups hold conflicting moral beliefs and prioritize different values (e.g., Harm vs. Authority). | **Defensible.** Strongly supported by cross-cultural psychology (e.g., Haidt's Moral Foundations Theory) and anthropological data. | **No.** Disagreement about facts (e.g., the shape of the earth) does not prove there is no fact of the matter. This commits the *is-ought fallacy* if used to deny objective wrongness. | **Fact vs. Belief:** Distinguishes *what people think* is right from *what is* right. Counterexample: Cultures once disagreed on germ theory, but germs existed regardless. |
  | **2. Meta-Ethical Relativism** | **Ontological Claim:** Moral truth is constituted by cultural consensus; there is no standpoint outside a culture to judge practices. "Wrong" means "forbidden here." | **Controversial/Debatable.** Philosophically coherent but rejected by moral realists. It denies the possibility of cross-cultural moral error. | **Yes.** If moral truth is *defined* by local culture, then forced marriage cannot be "objectively" wrong, only "locally" unpopular. | **Truth Conditions:** Treats morality like **taste** (cilantro is good *to me*) rather than **fact** (the earth is round *simpliciter*). |
  | **3. Epistemic Skepticism** | **Epistemological Claim:** There may be objective moral truths, but human cognition is too biased or culturally embedded to access them reliably. | **Defensible.** Acknowledges cognitive limitations without denying moral reality. Consistent with the finding that WEIRD psychology is an outlier. | **Weakly.** It justifies suspending judgment ("we can't know"), but not asserting "there is no right answer." It blocks certainty, not truth. | **Access vs. Existence:** Distinguishes *knowing* the answer from the *existence* of an answer. Counterexample: We might not know the cure, but the cure still exists. |
  | **4. Normative Non-Interference** | **Prescriptive Claim:** Regardless of truth, outsiders ought not criticize or intervene in other cultures' practices due to respect or pragmatic consequences. | **Defensible** as a political or diplomatic heuristic, but not a moral truth claim. Often conflated with Meta-Ethical Relativism. | **Yes (Pragmatically).** It shuts down the *argumentative move* of criticism, but concedes the practice could still be objectively wrong. | **Action vs. Truth:** Distinguishes *what we should do* (leave them alone) from *what is the case* (is it harmful?). |
  | **5. Non-Cognitivism / Expressivism** | **Semantic Claim:** Moral statements are not truth-apt descriptions of the world but expressions of emotion or commitment (like saying "Boo!" to forced marriage). | **Philosophically Defensible** but counter-intuitive to lay discourse. Aligns with the "taste" analogy (morality as preference). | **Yes.** If moral claims aren't true/false, then claiming a practice is "objectively wrong" is a category error. | **Proposition vs. Expression:** Treats morality strictly like **taste** ("I dislike cilantro") rather than **fact** ("Cilantro contains aldehydes"). |

