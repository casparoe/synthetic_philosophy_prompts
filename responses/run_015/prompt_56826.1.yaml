      *   **Task:** Audit a specific paragraph about the Judy Benjamin problem from a trade book.
      *   **Constraints:**
          1.  Claim-by-claim audit (Accurate / Defensible Simplification / Wrong). No padding the middle bucket.
          2.  Address two specific suspicions (confusing believing a conditional vs. conditional belief; treating constraints as propositions). Identify exact sentences.
          3.  Evaluate the appeal to Lewis's triviality result.
