answer: |-
  ### The Decision Problem: Prospects and Parties

  Before applying the apparatus, we must fix the object of assessment. In 1976, the CDC and the Ford Administration were not choosing between "vaccinate" and "do nothing" in a vacuum. They were choosing between distinct *prospects* distributed across a population. The genuine alternatives included: (1) mass immunization of the entire civilian population; (2) targeted immunization of high-risk groups (the elderly, immunocompromised) and military personnel; (3) stockpiling vaccine for contingent deployment upon confirmed spread; and (4) watchful waiting with no procurement.

  The parties to whom justification is owed are not merely the 43 million vaccinated. They include: the Fort Dix recruits (who faced the initial outbreak); the counterfactual pandemic victims (who would have died or suffered grave illness had the virus spread); the taxpayers (who funded the appropriation and the indemnification); the vaccine manufacturers (whose liability was waived); and the future public (whose trust in medical institutions constitutes a long-term good).

  For *outcome-relativized contractualism*, the object of assessment is the actual history: who died, who was paralyzed, who was spared. For *risk-relativized contractualism*, the object is the *ex ante* structure of the policy: the probability distribution of harms and benefits as they stood in March 1976. This distinction is load-bearing. If we assess the policy based on the fact that the pandemic never materialized, we are assessing luck, not choice. If we assess it based on the risk profile, we are assessing the justification for imposing that profile.

  **Flagged Fact:** To run the risk-relativized calculation, we need the *ex ante* probability estimate of a pandemic assigned by the CDC in February 1976. The prompt gives the *ex post* fact (it did not happen), but contractualism evaluates reasonable rejection based on available evidence at the time of decision. Without the CDC's internal probability estimate for a nationwide outbreak, the expected utility comparison remains incomplete. I will proceed assuming the administration believed the probability was significant enough to warrant emergency appropriation, but I will mark where this uncertainty creates theoretical silence.

  ***

  ### 1. The Contractualist Setup: Comparators and Rejection

  Who stands to reject the principle permitting mass immunization? Under outcome-relativized views, the Guillain–Barré syndrome (GBS) victims have the strongest standing. They suffered grave harm. Under risk-relativized views, every vaccinated person has standing proportional to their risk exposure.

  The critical move in contractualism is selecting the *comparator*. A principle is rejected if there is an alternative principle that no one could reasonably reject. If the comparator is "Do Nothing," the mass vaccination policy imposes a 1/100,000 risk of paralysis to save lives from a potential pandemic. If the comparator is "Targeted Vaccination," the mass policy imposes that same risk on 40 million low-risk people who would have been safe under the alternative.

  If we fix the comparator as "Targeted Vaccination," the mass program becomes much harder to justify. The Fort Dix recruits and high-risk groups would be covered under both policies. The marginal complaint comes from the 40 million low-risk civilians. Under the mass policy, they bear a risk of GBS. Under the targeted policy, they bear the risk of the pandemic spreading to them later.

  **Theoretical Silence:** Contractualism does not inherently specify how to select the relevant alternative principles. If we allow *any* alternative to serve as a comparator, the "reasonable rejection" test becomes unstable. A risk-relativized view needs a constraint on which alternatives are "on the table." If "Targeted Vaccination" was a feasible alternative (as it seems to have been), the mass program imposes gratuitous risk on the low-risk population, strengthening their complaint. If "Targeted Vaccination" was logistically impossible given the timeline, the comparator shifts back to "Do Nothing," weakening the complaint. The theory is silent on the feasibility constraints required to make the comparator well-posed.

  ### 2. Outcome-Relativized Contractualism: The Hostage to Luck

  Run the episode on outcome-relativized contractualism. The complaint strength is fixed by actual harm. The GBS victims have complaints of death or permanent paralysis. The "saved" victims have no complaints, because they were never actually threatened—the virus died at Fort Dix. The taxpayers have a financial complaint, but usually, contractualism prioritizes bodily integrity over financial cost.

  On this view, the program is impermissible. It sacrificed identifiable lives for statistical ghosts. The aggregation prohibition forbids summing the "relief" of the unharmed to outweigh the paralysis of the harmed. Since the benefit side of the equation contains zero actual lives saved, the small number of actual deaths on the cost side dictates the verdict.

  Is this a reductio of the view? It suggests that outcome-relativized contractualism cannot evaluate public health policy *at the time it is made*. It can only deliver a verdict in hindsight, and that verdict is determined by luck. If the pandemic had occurred, the same decision might have been permissible (many lives saved vs. few paralyzed). If it did not, it is impermissible. This makes the *rightness* of the action dependent on facts outside the agent's control.

  **Theoretical Silence:** The view is silent on *ex ante* permissibility. It cannot tell a government what it ought to do in March; it can only tell them in December that they were wrong. For a theory of political obligation, this is a catastrophic failure. It implies that governments cannot legitimately impose risks for uncertain future benefits, effectively paralyzing preventive governance. The 1976 case indicts the decision only if we judge by outcomes, but it indicts the *theory* if we require guidance for action under uncertainty.

  ### 3. Risk-Relativized Contractualism: Aggregation and CBA

  Now run the episode on your risk-relativized view. Complaint strength is fixed by *ex ante* expected harm. Each of the 43 million vaccinated faces a 1/100,000 risk of GBS. The expected number of GBS cases is ~430. The complaint of each individual is small (a 0.001% chance of paralysis).

  Does this license summing the complaints? Yes. If the complaint is defined by the risk burden, then 43 million people bearing a small risk generate an aggregate moral weight comparable to a smaller number of people bearing a large risk. We compare the aggregate risk burden of vaccination (430 expected GBS cases) against the expected burden of the pandemic (Probability of Pandemic $\times$ Expected Deaths).

  If the CDC estimated a high probability of a 1918-style pandemic (say, 50% chance of 1 million deaths), the expected pandemic burden dwarfs the vaccine risk burden. The risk-relativized view permits the policy.

  **The Collapse Worry:** You ask whether anything contractualist survives this relabeling. If we sum probability-weighted complaints, we are performing expected utility calculations. What distinguishes this from Cost-Benefit Analysis (CBA)?
  Standard CBA sums *utilities*. Risk-relativized contractualism sums *complaints*. The distinction survives only if the *weight* of a complaint is non-linear. For example, if imposing a 1/100,000 risk on a million people is worse than imposing a 1/1 risk on one person (even if expected harms are equal), the view diverges from CBA.
  However, in the 1976 case, the view seems to collapse into CBA. It justifies the policy because the aggregate expected harm of the pandemic outweighs the aggregate expected harm of the vaccine.

  **Theoretical Silence:** The theory is silent on the *exchange rate* between risk and certainty. Does a 1/100,000 risk of death count as 1/100,000 of a complaint about death? Or does the mere imposition of non-consensual risk carry a deontological surcharge? If the latter, the theory needs a metric for that surcharge, which it currently lacks. Without it, "justification to each person" becomes "justification to the aggregate expected value," which dissolves the individualist constraint contractualism prizes.

  ### 4. The Identifiable-Victim Asymmetry

  In 1976, the victims (GBS patients) were identifiable; the beneficiaries were statistical. Outcome-relativized views are hypersensitive to this. Risk-relativized views claim to be insensitive to it (since everyone faced the same risk).

  Does the testimony of the paralyzed matter? Contractualism should treat this testimony as *evidentially* relevant, not *morally* foundational. The testimony confirms the magnitude of the risk (that GBS was a real side effect, not a rumor). It bears on whether the risk was disclosed and whether the consent was informed.
  However, if the question is "Was the policy permissible?", the moral shape is untouched by who ended up harmed. If Private Jones was paralyzed instead of Private Smith, the moral violation is the same. The "identifiable victim effect" is a cognitive bias, not a moral truth.

  **Theoretical Silence:** The theory is silent on *political legitimacy* vs. *moral permissibility*. Even if the policy was morally permissible (risk-relativized), the government may lack legitimacy if it cannot explain the sacrifice to the victims in a way they can accept. Contractualism focuses on the principle, but public health requires managing the *reaction* to the outcome. The theory has no resources to explain why the GBS victims' outrage is politically destabilizing in a way that statistical deaths are not, other than noting the psychological salience.

  ### 5. Uncertainty and Hindsight: Evidence-Relative vs. Fact-Relative

  Should we judge Sencer by what he knew in March or what we know now? Contractualism's "reasonable rejection" clause is inherently evidence-relative. A principle cannot be rejected on grounds that were unavailable to the agents at the time.
  Sencer's defense ("better to err toward overreaction") is an evidence-relative claim. Given the 1918 analogy and the Fort Dix cluster, the expectation of a pandemic was reasonable.

  **The 2009 H1N1 Finding:** The discovery that 1976 vaccinees had enhanced immunity in 2009 is morally irrelevant to the 1976 decision unless it was foreseeable. It is a windfall, not a justification.
  However, if contractualism is strictly evidence-relative, it loses its critical bite against *negligent* risk-taking that turns out well. If Sencer had ignored clear safety data but the pandemic happened anyway, saving lives, an evidence-relative view might still condemn him (for ignoring data), but a fact-relative view would praise the outcome.
  **Theoretical Silence:** Contractualism struggles to condemn a decision that was reasonable *ex ante* but disastrous *ex post*. It implies the government did nothing wrong to the GBS victims, provided the risk assessment was sound. This leaves the victims without a moral grievance against the state, only a claim to compensation. The theory is silent on whether "you were treated fairly according to the best available science" is a sufficient apology for paralysis.

  ### 6. Institutional Features: Indemnification and Dissent

  **Indemnification:** The government absorbed liability, spreading the financial cost to taxpayers.
  *Contractualist Analysis:* This disperses the burden. Instead of manufacturers bearing the risk (which might have stopped production), the public bears it. Since the cost per taxpayer is tiny (pennies), their complaint is weak. This looks like a contractualist improvement: it minimizes the maximum individual burden.
  *Critique:* Or, it renders the aggregation problem invisible. By monetizing the harm and spreading it, the state avoids confronting the concentrated harm to the GBS victims. Contractualism should insist that financial dispersion does not negate the bodily integrity violation of the vaccinated.

  **The Dissenter (Morris):** Morris was dismissed for raising safety doubts.
  *Contractualist Analysis:* This is crucial for the "reasonable" in "reasonable rejection." If dissent is silenced, the epistemic basis for the risk assessment is corrupted. A principle that permits silencing safety dissenters is one that no one could accept, because it increases the likelihood of uncalculated risk.
  *Legitimacy:* Contractualism usually assesses the *principle* of action. But here, the *procedure* of decision-making affects the validity of the principle. If the risk estimate was inflated by suppressing dissent, the *ex ante* justification collapses.
  **Theoretical Silence:** Standard contractualism focuses on the outcome principle ("Vaccinate to prevent pandemic"). It is less equipped to handle procedural wrongs ("Suppress dissent to enable vaccination") unless those wrongs are codified as separate principles. A full account needs a principle of *epistemic integrity* within the deciding body.

  ***

  ### Verdict

  Does the 1976 Swine Flu episode support your hypothesis that risk-relativized contractualism handles mass-risk policy better than outcome-relativized contractualism?

  **Yes, but at the cost of distinctiveness.**

  The episode refutes outcome-relativized contractualism as a viable theory for public policy. A view that condemns the 1976 program solely because the pandemic failed to materialize is hostage to luck and cannot guide action. It renders preventive governance impossible, as any failed prevention looks like a net harm in hindsight.

  However, the episode shows that risk-relativized contractualism, while avoiding the luck objection, collapses into **expected-value reasoning** at the precise moment a decision is required. To determine if the 43 million small complaints outweigh the potential pandemic catastrophe, you must sum the expected harms. Once you do this, the "justification to each person" becomes "justification based on the aggregate expected good." The contractualist constraint—that you cannot sacrifice one for the many—dissolves when the "one" is a probabilistic risk shared by the "many."

  **The Decisive Negative Result:**
  Your hypothesis is correct that we *must* adopt a risk-relativized view to make sense of public health ethics. But your hope that this preserves a distinctive contractualist aggregation rule is unfounded. In cases of mass social risk where everyone faces the same probabilistic burden (the 1/100,000 GBS risk), risk-relativized contractualism **has no distinctive deliverable**. It either:
  1.  **Collapses into CBA:** It sums the expected complaints and chooses the policy with the lower aggregate expected harm.
  2.  **Falls Silent:** It refuses to compare the small risks of the many against the large risks of the few because it lacks a metric for trading probabilistic bodily integrity against probabilistic survival.

  The 1976 case demonstrates that the *ex ante* vs. *ex post* axis is not the source of the trouble. The trouble is **commensurability**. Contractualism provides a powerful veto for *identifiable* sacrifices (you cannot kill one to save five). But when the sacrifice is *probabilistic* and *universal* (everyone risks a little to save everyone from a lot), the veto loses its grip. The theory stops speaking exactly where the decision had to be made: at the point of weighing a known, distributed small risk against an unknown, concentrated catastrophe.

  For your dissertation, the chapter should conclude that risk-relativized contractualism is a necessary condition for public health ethics (to avoid the luck problem), but it is not a sufficient decision procedure. It clears the ground for expected-value reasoning but does not replace it. If you seek a contractualist veto on the 1976 program, you will not find it in the risk structure alone; you must find it in the procedural failures (the silencing of Morris) or the feasibility of alternatives (targeted vs. mass). The aggregation problem, in the context of universal social risk, is not solved by shifting to *ex ante* complaints; it is merely translated into the language of probability.
