prompt: |-
  hey — so I'm taking this philosophy of biology seminar this term (cross-listed as metaphysics of natural kinds, which is why I'm in it, I'm a phil major not a bio one) and I have a 2000 word paper due friday that I have not started. We've spent like two and a half weeks on the species problem and I think I get the menu: the interbreeding / reproductive isolation account, the morphological or typological one, the ecological one, the lineage view where a species is a segment of a population lineage rather than a set picked out by traits, and the homeostatic-property-cluster thing where a kind is held together by mechanisms that keep its members similar enough. My prof keeps hammering the move from "species are classes" to "species are historical entities / individuals," and the upshot he cares about is that on that move membership stops being a trait checklist and becomes a matter of standing in the right ancestry relation. I basically buy that but I don't know what it actually commits me to in weird cases.

  Two things came up in section that I keep chewing on. First: the interbreeding account looks like it's defined over populations, not over single organisms — you can't interbreed all by yourself — so there's this odd result that a lone organism might fail to be a member of any species even while being, intuitively, obviously a human being or obviously a beetle. My TA called it the "species-less organism problem" but I dont know if that's a real name for it or he made it up. Second: if species are lineage segments with beginnings and ends, what do you say about the founding members of a new lineage — do they belong to the parent species or the new one, and doesn't that make their membership depend on what happens *after* they're born, i.e. on whether their descendants happen to succeed? My roommate, who's a biochem major, says all of this is bullshit because you can just sequence the genome and be done with it, which feels like it's missing the point but I can't articulate why.

  So here's the paper I want to write, and I need someone to think through it with me: read Mary Shelley's Frankenstein (1818) through the species problem. Is Victor's creature a member of Homo sapiens? I want the question taken apart concept by concept: he's built out of human corpses and dissecting-room material, so he's human "all the way down" in a material or genetic sense, and yet he has no parents and stands in no reproductive relation to anyone; he's built unnaturally large and everyone who sees him reacts with horror, though he turns out to learn language, read Paradise Lost, weep, and argue; and the one human who treats him decently is old De Lacey, who is blind and so can't see the features that horrify everybody else, until the sighted family comes back and drags him off. Then there's the half-finished female companion, and Victor destroying it because he imagines them breeding and a population getting founded — which looks like the novel staging the difference between one organism and a breeding population from the inside. And, weirdly, the creature only knows his own origin by reading Victor's stolen lab notes, so his "ancestry" is a text he read rather than a history he's part of. Which species concept would count him in, which would exclude him, and is the disagreement between those answers a substantive one or are the concepts just tracking different things? If you go the lineage route, can you say anything at all about him, or does he come out species-less in the sense my TA was talking about, and does the companion's destruction matter to that verdict — i.e. does the answer depend on a counterfactual about descendants that never existed?

  The bit I most want help with, though, is where the book resists this reading, because I don't want to turn a novel into a logic puzzle. Shelley isn't doing taxonomy: the horror is mostly about Victor's refusal of responsibility, and the creature's exclusion reads at least as much as social, racial, or just aesthetic disgust as it does as a biological verdict — everybody's repulsion is immediate and bodily, before any concept gets applied. So: what would the honest critic say about how far this lens can go? Does the novel actually need the creature to be biologically human for its moral to work, or would that settle nothing? And is there something the book shows about species concepts that the seminar papers don't — e.g. that in practice these concepts get used to decide who you owe things to, so a "merely verbal" disagreement about concepts can be a very substantive one about a person? If you had to point me to two or three scenes to build the paper around, which ones, and what order should I take them in?
