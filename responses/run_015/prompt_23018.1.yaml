          *   Criterion for conventional truth vs. ultimate falsehood (If all four are denied, what makes a convention *merely* conventional?).
      *   **Constraint 4:** Include a short follow-up for each question to counter likely deflections.

  2.  **Deconstruct the Scholar's Position:**
      *   *Standard Madhyamaka (Prāsaṅgika):* The *catuṣkoṭi* is a tool to eliminate views. Emptiness is the emptiness of intrinsic nature (*svabhāva*). Emptiness itself is empty (*śūnyatā-śūnyatā*). No positive thesis (*pratijñā*).
      *   *Scholar's Twist:* Emptiness is a "real (if itself empty) conventional *dharma*." This sounds like a Svātantrika or even a Yogācāra-leaning interpretation, or perhaps a "positive Madhyamaka" (like some readings of Gorampa or modern constructivists). It suggests *śūnyatā* has some ontological weight, even if conventional.
      *   *Vulnerability:* If emptiness is a "real conventional dharma," does it function as a *svabhāva* in disguise? How does it avoid reification? If the *catuṣkoṭi* generates a positive doctrine, how does it avoid becoming just another view (*dṛṣṭi*)?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Topic 1: Self-Referential/Regress (Required)*
          *   *Draft:* If all four fail, is emptiness a fifth? How does chapter 13 stop regress?
          *   *Refinement:* Make it sharper. Focus on the status of the statement "all dharmas are empty." If that statement is a conventional dharma, does it escape the *catuṣkoṭi*?
          *   *Follow-up:* If he says "it's therapeutic," ask why it doesn't leave a residue of commitment.

      *   *Topic 2: Logic of 3rd and 4th Horns (Required)*
          *   *Draft:* Why reject both/neither on their own merits? Does rejecting both entail rejecting neither?
          *   *Refinement:* Focus on the logical independence. In classical logic, "neither" is often the negation of the disjunction of the first two. But in Mādhyamika, are they independent ontological claims? If I say "not A and not not-A," isn't that "neither"? Why is "neither" specifically targeted as a view to be abandoned?
          *   *Follow-up:* If he says "it's just logical exhaustiveness," ask about the soteriological danger of the "neither" view (e.g., agnosticism).

      *   *Topic 3: Criterion for Conventional Truth (Required)*
          *   *Draft:* What makes a conventional truth merely conventional rather than ultimately false?
          *   *Refinement:* If the *catuṣkoṭi* denies existence, non-existence, both, and neither, then *everything* seems ultimately false. What distinguishes a valid convention (like karma) from an invalid one (like a square circle) if neither can survive ultimate analysis?
          *   *Follow-up:* If he appeals to "worldly consensus," ask if that makes truth subjective.

      *   *Topic 4: The Status of "Real Conventional Dharma"*
          *   *Idea:* He calls emptiness a "real conventional dharma." This is risky.
          *   *Question:* How do you distinguish "real conventional dharma" from *svabhāva*?
          *   *Follow-up:* If he says "it depends on context," ask for the ontological marker.

      *   *Topic 5: Soteriological Function*
          *   *Idea:* Why does this positive reading help liberation?
          *   *Question:* Does positing emptiness as a positive conventional dharma risk becoming an object of grasping (*upādāna*)?
          *   *Follow-up:* If he says "we know it's empty," ask how that knowledge prevents grasping.

      *   *Topic 6: The Two Truths Relationship*
          *   *Idea:* If emptiness is conventional, where is the ultimate?
          *   *Question:* If emptiness is a conventional dharma, does anything remain for the "ultimate truth" to refer to, or does it collapse into a monism of convention?
          *   *Follow-up:* If he says "ultimate is just the nature of convention," ask about the distinction's utility.

      *   *Topic 7: Historical/Textual Consistency (Nāgārjuna)*
          *   *Idea:* Nāgārjuna says he has no thesis.
          *   *Question:* How do you reconcile your positive reading with *Vigrahavyāvartanī* 29 ("I have no thesis")?
          *   *Follow-up:* If he says "that's also empty," ask if that renders the book's argument vacuous.

      *   *Topic 8: Comparison with Rival Schools*
          *   *Idea:* How is this different from Yogācāra or Svātantrika?
          *   *Question:* How does your view differ from the Svātantrika assertion of autonomous syllogisms or Yogācāra's *paratantra*?
          *   *Follow-up:* If he says "we don't posit intrinsic nature," ask what "real conventional" adds.

      *   *Topic 9: The "Middle" Metaphor*
          *   *Idea:* What is the Middle actually *between*?
          *   *Question:* If the four horns are rejected, what are the boundaries of the "Middle" you are proposing?
          *   *Follow-up:* If he says "it's not spatial," ask for a structural definition.

      *   *Topic 10: Practical Application (Ethics)*
          *   *Idea:* Does this change how we act?
          *   *Question:* If emptiness is a real dharma, does it ground ethics differently than if it were pure negation?
          *   *Follow-up:* If he says "no," ask why the ontological distinction matters.

  4.  **Review and Refine:**
      *   Check against constraints: 8-10 questions? Yes. Specific topics covered? Yes (Self-ref, 3rd/4th horn, Convention criterion). Follow-ups included? Yes. Tone appropriate (grad seminar, rigorous but respectful)? Yes.
      *   *Self-Correction on Topic 2:* The prompt asks specifically about the logical relation between "both" and "neither." I need to ensure the question highlights that "neither" isn't just the logical negation of "both" but a distinct ontological claim that needs independent refutation.
      *   *Self-Correction on Topic 1:* Ensure the "emptiness of emptiness" (*śūnyatā-śūnyatā*) is explicitly mentioned as the mechanism he needs to defend.
      *   *Self-Correction on Topic 3:* Ensure the distinction between "conventionally true" and "ultimately false" is sharp. If all four horns fail, *everything* is ultimately false. So what saves convention?

  5.  **Final Polish:** Check the phrasing to ensure it sounds like a chair of a reading group (knowledgeable, precise, slightly provocative). Ensure the follow-ups anticipate the "It's all empty" deflection.

      *(Self-Correction during drafting)*: Make sure the follow-ups don't sound aggressive but rather like "If you say X, then Y seems to follow, how do you block Y?"

      *Let's finalize the list.*
      1. Self-Referential/Regress (Required)
      2. Logic of 3rd/4th Horns (Required)
      3. Criterion for Convention (Required)
      4. "Real Conventional Dharma" vs. *Svabhāva*
      5. *Vigrahavyāvartanī* "No Thesis" claim
      6. Soteriological Risk (Grasping at Emptiness)
      7. Svātantrika/Yogācāra Distinction
