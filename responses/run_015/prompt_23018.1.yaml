      *   **Occasion:** Visiting scholar closing the spring series.
      *   **Scholar's Position:** Argues that Nāgārjuna's *catuṣkoṭi* (four corners/negations) is not just a *reductio ad absurdum* leaving nothing, but a genuine, non-reifying doctrine of the Middle Way. "Emptiness" (*śūnyatā*) is a real (though empty) conventional *dharma*, not just an absence.
      *   **Goal:** Draft 8-10 Q&A questions.
