          1.  Grounding $\rightarrow$ Redundancy (B adds nothing over A).
          2.  Grounding is Transitive.
          3.  Therefore, non-fundamental facts (bio, psych) are redundant w.r.t. fundamental facts (quantum fields).
          4.  But Physics (Renormalization) says higher scales have autonomy (not redundant).
          5.  Contradiction between (3) and (4)/(5).
          6.  Dilemma: Reject transitivity, reject redundancy, or accept eliminativism.
          7.  Eliminativism is absurd.
          8.  Conclusion: Something in (1)-(3) is wrong, but how to preserve fundamentality?
