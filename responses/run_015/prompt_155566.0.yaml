  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, does integrating out make variables irrelevant?* In the Wilsonian sense, irrelevant operators vanish at the fixed point. But the *degrees of freedom* change. The phonon is real, even if it's just a collective excitation of atoms.
