      *   *Caution:* Don't let the physics metaphor do all the work. Grounding is metaphysical. But the user wants the bridge.
      *   *Fundamentality:* Define it as "ungroundedness" rather than "exclusive reality."

  7.  **Final Plan:**
      *   Validate the tension (it's the core of non-reductive physicalism).
      *   Identify Premise (1) as the failure point.
      *   Explain why (1) conflates *dependence* with *elimination*.
      *   Show how to preserve fundamentality (priority vs. exclusivity).
      *   Show how to preserve transitivity (dependence chains don't imply identity chains).
      *   Use the RG/Universality insight to redefine grounding as "constraining" rather than "replacing."
