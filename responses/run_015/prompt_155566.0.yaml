      *   **User Persona:** Retired physicist working on metaphysics of science. This means they have a strong grasp of physics (renormalization, scales, effective field theories) but are grappling with philosophical technicalities (grounding, ontology, fundamentality). They value rigor but are wary of eliminativism.
