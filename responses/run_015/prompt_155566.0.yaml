  *(Self-Correction on Premise 1)*: Is it "ontologically redundant"? If B is grounded in A, does B exist *over and above* A? Many groundings say "no extra being." But "no extra being" $\neq$ "B is an illusion." A statue is grounded in clay. No extra being. But the statue is real. The user's premise (1) says "B adds no independent reality." This is ambiguous. If "independent" means "separate substance," it's true. If it means "real in its own right," it's false. I need to pinpoint this ambiguity.

  *(Refining the RG analogy)*: In RG, we integrate out high momentum modes. The low energy effective theory is *autonomous*. It doesn't mean the high energy stuff didn't happen. It means the low energy stuff is *stable* against variations in the high energy stuff. This maps to *Multiple Realizability*. Grounding + Multiple Realizability = Non-reductive physicalism.

