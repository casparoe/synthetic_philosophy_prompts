      *   *Biggest Mistake:* Conflating "ground of duty" with "content of duty." Just because the *ground* is human doesn't mean the *content* doesn't strictly forbid animal harm.

      *   *Table:* Ensure exact columns and formatting.

  5.  **Review against Constraints:**
