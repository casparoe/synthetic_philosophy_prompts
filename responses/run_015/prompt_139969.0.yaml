          3.  *Moral Feeling and Attention:* Developing a Kantian virtue ethics of attention toward non-rational beings. (A bit riskier, maybe less "Kantian" in the strict deontological sense, but growing field).

      *   *Refining the Top 2:*
          1.  **The Structural Indirect Duty:** Does the duty to preserve moral feeling entail a duty to abolish institutionalized animal use, not just avoid personal cruelty? (This addresses Sam's point directly but elevates it).
          2.  **The Normative Status of "Analogy":** If we must treat animals *as if* they have moral standing to protect our own, does this generate *quasi-rights* or strict prohibitions independent of human benefit?

      *   *Biggest Mistake:* Assuming "indirect duty" = "no direct constraint on action." It might mean "direct constraint on action, grounded in self-regard."

  3.  **Drafting the Response (Advisor Persona):**
      *   *Tone:* Encouraging but rigorous, realistic about the job market and philosophical contribution.
