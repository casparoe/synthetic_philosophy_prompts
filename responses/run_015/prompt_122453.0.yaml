answer: |-
  The short answer
  Your colleague is right and you are half-wrong; while both problems require updateless reasoning, they are not mirror images because Evidential Decision Theory behaves oppositely in each case. In the Mugging, Evidential Decision Theory refuses to pay, but in the Blackmail, it pays, whereas Functional Decision Theory stays consistent across both. This means the pair is highly useful pedagogically because they separate the theories in different ways rather than cancelling each other out.

  Where I'm going wrong
  You are treating the problems as structurally identical because both involve a predictor simulating your decision, but you are overlooking how information flows differently for an evidential agent. In the Mugging, once you know the coin landed tails, your decision to pay provides no evidence that the coin landed heads, so an evidential agent sees no reason to pay. In the Blackmail, however, your decision to pay provides strong evidence that there are no termites, because the letter was only sent based on the logical correlation between your policy and the termite state.

  This means the theories do not jump in unison as they do in Newcomb's Problem. In Newcomb's, Causal and Evidential Decision Theory split apart, but in your pair, Causal and Evidential Decision Theory agree on the Mugging and disagree on the Blackmail. If you teach them as simple sign-flips of Newcomb, you will miss the chance to show how Evidential Decision Theory can be manipulated into paying blackmail while Functional Decision Theory avoids it.

  The asymmetry that actually does the work
  The crucial difference lies in what your action tells you about the hidden state of the world. In the Mugging, the coin flip is a physical event that happened in the past, so your current action cannot update your belief about whether the coin was heads or tails. In the Blackmail, the letter's arrival is logically tied to your decision algorithm, so your choice updates your belief about whether termites exist even after you have received the letter.

  This is why the problems pull in opposite directions for an evidential agent. In the Mugging, there is no news to buy, so the evidential agent keeps their money. In the Blackmail, paying buys good news about the termites, so the evidential agent hands over the cash. Functional Decision Theory avoids this trap in both cases by choosing a policy before the coin flips or the letters arrive, rather than reacting to the evidence in front of them.

  The 50/50 mixture and my bookkeeping worry
  Your intuition about adding ex ante and ex post values is spotting a real tension, but it is not about time—it is about conditionalization. In the Mugging half, the benefit is purely counterfactual; you never see the reward, so you must value the other branch before knowing the coin result. In the Blackmail half, the benefit is avoiding the letter, but since you already have it, you are evaluating based on what your choice implies about the termites.

  When you mix them, you are not adding apples to oranges; you are testing whether your students' decision theory can commit to a policy before knowing which game they are in. The asymmetry you feel comes from the fact that the Mugging reward is inaccessible in the actual world, while the Blackmail reward is inaccessible once the letter arrives. Both require the agent to care about worlds they are not currently in, but for different reasons involving probability versus logical correlation.

  So your test works, but not as a wash. It works as a stress test for updatelessness, revealing that a student who says "Pay the Mugging but Don't Pay Blackmail" is likely using Functional Decision Theory. The mixture does not cancel out the theories; it highlights exactly where they diverge, proving that the two problems are distinct tools rather than redundant copies.

  What I should tell the seminar
  Tell them these problems look like Newcomb's but they separate the theories differently: Causal and Evidential Decision Theory agree on the Mugging but fight on the Blackmail, while Functional Decision Theory stays consistent across both by choosing policies before the coin flips or letters arrive.
