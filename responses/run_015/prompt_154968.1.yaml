  2.  **Deconstruct the Philosophical Framework (Teleosemantics):**
      *   *Teleosemantics:* Meaning/content is determined by the *proper function* of a mechanism, which is determined by its selection history (evolutionary or design).
      *   *Original Proper Function:* Functions selected for by natural selection (biology). Usually grounds "original intentionality."
      *   *Derived Proper Function:* Functions assigned by designers/users (artifacts). Usually grounds "derived intentionality."
      *   *The Problem:* The Creature is biologically human-like but has no evolutionary history. He is designed by Victor (artifact-like) but learns like a human. Does he have a mind?

  3.  **Deconstruct the Literary Text (*Frankenstein*):**
