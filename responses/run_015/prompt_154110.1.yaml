          *   **Major Tension:** (3) vs (7). Cumulative hierarchy vs. LLM classification.
          *   **Medium Tension:** (2) vs (6). Definition of "surrogate."
          *   **Minor Tension:** (4) vs (5). Location of tools.

      *   *Refining the "Single Revision":*
          *   The root cause is conflating **Cognitive Architecture** (the levels) with **Cultural Environment** (the tools).
