      *   *Actually, (6) is logically consistent with (2).* (2) says cost must be booked to *internal* surrogate. (6) says cost booked to *other* bodies. So (6) follows (2). The tension is only if the user *wants* them to be Popperian but knows they aren't. The prompt says "I classify them as Skinnerian." So logically, (1), (2), (6) hang together.
      *   *Wait, is there a tension between (6) and Dennett's actual view?* Dennett often treats social learning as a step *toward* Popperian/Gregorian. But strictly, if the surrogate isn't internal, it's not Popperian. I will flag this as a "Definitional Rigidity" risk rather than a logical contradiction.
