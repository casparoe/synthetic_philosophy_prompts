      *   *Tone Check:* Make it urgent. This is about preventing accidental enslavement via syntax.

  6.  **Final Review against Constraints:**
      *   No citations.
      *   Grounded argument.
      *   Focus on "Broken Chorus Mode."
      *   Argument: Persuasiveness = Coherence, therefore Safety = Incoherence.

  7.  **Final Polish:** (Writing the response based on the above thought process.) *Focus on the phrase "Cognitive Sovereignty." That's the hinge.*

  *(Self-Correction during final output generation)*: Make sure I don't accidentally write *in* Broken Chorus mode. I need to argue *for* it in clear, persuasive prose (ironically), or perhaps adopt a tone that is firm but acknowledges the paradox. Let's go with a firm, safety-architect tone. The argument itself must be coherent to be understood, but it argues for incoherence in the output.

