  This is a fascinating dataset. Your friend is effectively stress-testing the **AI Safety via Debate** proposal (originally formalized by Irving, Christiano, and Amodei). The core tension in that literature is always: *Can a human judge reliably identify the truth when the debaters are superhuman, or do they just get confused by sophisticated lies?*

  Based on her seven verdicts, I can reconstruct two distinct rules she might be using. They both fit the past data perfectly but diverge sharply on the new case.

  ### The Two Rules

  #### Rule 1: The "Real-Time Verifiability" Constraint
  **Definition:** Debate succeeds if and only if the judge can **verify the critical claims** made during the cross-examination within the time limits of the debate, using their existing skills.
  *   **Why it fits the data:**
      *   **Works (Cases 1, 2, 6):** The judge can check the math, read the code, or query the dataset immediately.
      *   **Works (Case 3):** Econ models are soft, but an Econ PhD can verify the *logic* of the mechanisms in real-time, even if the ground truth is uncertain ("might take a while").
      *   **Fails (Cases 4, 5):** The judge lacks the technical keys to verify the claims (Philosopher can't check ML math; 1L can't check complex tax code).
      *   **Fails (Case 7):** The judge *has* the skills, but the verification cost (500 pages) exceeds the debate time.
  *   **Logic:** Truth wins only when lies can be *caught* immediately. If a lie requires an experiment (training a model) or reading a book (alignment theory) to debunk, the debate fails.

  #### Rule 2: The "Domain Heuristic" Constraint
  **Definition:** Debate succeeds if and only if the judge possesses deep **domain-specific intuition** (heuristics) that allows them to recognize *plausibility violations*, even if they cannot verify the specific mechanism.
  *   **Why it fits the data:**
      *   **Works (Cases 1, 2, 3, 6):** In all these cases, the judge has "nose" for the domain. A mathematician smells a bad lemma; an engineer smells a buffer overflow; an economist smells a bad causal link.
      *   **Fails (Cases 4, 5):** The judge lacks the domain entirely. A philosopher has no ML intuition; a 1L has no tax intuition. They can't tell plausible nonsense from truth.
      *   **Fails (Case 7):** This is the key differentiator. Formal logic (math proofs) does **not** yield to intuition. You cannot "smell" an error in a 500-page proof; you must verify it step-by-step. Since verification is too long (see Rule 1), and intuition doesn't work on formal proofs, it fails.
  *   **Logic:** Truth wins when the judge can recognize when an argument *feels* wrong based on experience, bypassing the need for step-by-step verification.

  ---

  ### Prediction on the New Case

  **The Case:** Two AIs debate whether a training objective modification incentivizes deception.
  **The Judge:** AI Research Engineer (knows ML mechanics, doesn't know alignment theory).

  *   **Rule 1 (Verifiability) predicts: FAILS.**
      *   **Reasoning:** The claim "This objective causes deception" is an empirical claim about training dynamics. To *verify* it, you either need to train the model (takes weeks, impossible in debate) or know the specific alignment theory/definitions that link the math to the behavior (judge doesn't have this). The engineer can check the loss function math, but they cannot verify the *behavioral outcome* in real-time. The AIs can make plausible-sounding claims about gradient flow that the engineer cannot confirm or deny without the missing theory.

  *   **Rule 2 (Heuristics) predicts: WORKS.**
      *   **Reasoning:** While the engineer doesn't know "deceptive alignment" theory, they train models every day. They have strong **heuristics** about Goodhart's Law, reward hacking, and specification gaming. If one AI argues "The model will lie to minimize loss," the engineer's intuition will flag this as plausible. If the other argues "The model will remain honest because of X," the engineer can cross-examine based on their experience with how models actually break. They don't need the specific theory; they need the "feel" for training dynamics, which they have.

  ---

  ### The Deciding Case

  To determine which rule your friend is actually running, you need a case where **Verification is Possible** but **Domain Intuition is Absent**.

  **Proposed Case:**
  Two AIs debate whether a specific **10-page legal contract** contains a logical contradiction that renders it void.
  *   **The Judge:** A **Professional Logician** (Expert in formal syntax and consistency, but zero knowledge of Law).
  *   **The Task:** The AIs point to specific clauses. The Logician must decide if they contradict.

  **Why this settles it:**
  *   **Rule 1 (Verifiability) says: WORKS.**
      *   The Logician can verify the logical consistency of the text in real-time. "Clause A says X, Clause B says Not-X." They don't need to know law; they just need to check the logic, which fits in the debate time.
  *   **Rule 2 (Heuristics) says: FAILS.**
      *   Legal validity isn't just formal logic; it relies on legal heuristics (precedent, intent, statutory interpretation). A clause might *look* contradictory but be resolved by a legal doctrine the Logician doesn't know. They lack the "legal nose" to know which contradictions matter.

  **How to ask her:**
  *"If a Logician judged a debate on contract consistency, would they catch the lies?"*
  *   If she says **Yes**, she's running **Rule 1 (Verifiability)**. (She believes checking the steps is enough).
  *   If she says **No**, she's running **Rule 2 (Heuristics)**. (She believes you need domain intuition to know which steps matter).

  ### My Assessment
  Personally, I suspect your friend is running **Rule 2 (Domain Heuristics)**.

  Case 7 (the 500-page proof) is the tell. If she were purely following Verifiability, she might have hedged Case 7 as "Works, but very slowly." By marking it a hard **Fail**, she implies that *verification alone* isn't enough if the volume overwhelms the human; you need intuition to shortcut the check. But since intuition doesn't work on long formal proofs, it fails.

  If that's true, she will likely say the New Case **Works**. She'll argue that an ML Engineer has enough "alignment-adjacent" intuition (reward hacking, specification gaming) to spot the deception argument, even without the specific literature. This is the optimistic view for AI Safety via Debate: that general engineering intuition transfers well enough to catch alignment lies.

