answer: |-
  This is one of the sharpest cuts into the philosophy of bioethics currently available. You have identified the fault line where legal pragmatism, metaphysical identity, and moral philosophy collide. The asymmetry you describe is real, entrenched, and often unacknowledged in its full implications.

  Here is an analysis of what the practice presupposes, how a defender of precedent autonomy justifies the asymmetry, and what would happen if you forced the system to confront the "Continuity Clause."

  ### 1. What the Practice Strictly Presupposes vs. What Fits Comfortably

  To answer your question directly: **Current practice does not strictly presuppose a metaphysical theory of personal identity.** It presupposes a theory of **legal personhood and rights.**

  **The Strict Presupposition:**
  The law treats the "patient" as a continuous legal entity from the moment of competence through the onset of dementia. It does not need to claim that the demented woman is *psychologically* the same person as the woman who wrote the directive. It only needs to claim that the *legal rights* attached to that biological organism were validly exercised by the last competent authority.
  *   **For Refusals:** The practice presupposes that the right to bodily integrity is a **negative right** (a shield). Once validly invoked, it persists until revoked by a competent agent. Since the demented self is not competent to revoke, the shield remains up.
  *   **For Requests:** The practice presupposes that medical treatment is a **collaborative good**, not a commodity. A positive right (a sword) requires the cooperation of a professional. Clinicians retain the authority to determine "medical appropriateness."

  **What Merely Fits Comfortably:**
  Ronald Dworkin's distinction between **Critical Interests** (what makes a life good as a whole narrative) and **Experiential Interests** (what feels good in the moment) fits the practice *comfortably*, but the law does not strictly depend on it.
  *   It is comfortable to say, "We honor the living will because the earlier self's critical interests in dignity outweigh the later self's experiential interest in staying alive."
  *   However, the law could theoretically reach the same conclusion without Dworkin's moral weight, simply by saying, "Battery is legally worse than non-treatment." The practice relies on the **asymmetry of harm**: violating a refusal is an active intrusion (battery); ignoring a request is a passive omission (non-maleficence).

  **The Strain:**
  You asked where it strains. It strains exactly where you suspect: **in the ranking of interests.**
  When a clinician honors a refusal of antibiotics for a demented patient who is currently happy and eating cookies, the system *is* implicitly ranking the earlier self's evaluative interests over the later self's experiential ones. The practice rarely acknowledges this because admitting it requires admitting that we are allowing a "dead" self (the psychological predecessor) to kill a "living" self (the conscious successor). The law papers this over by insisting they are the *same legal person*, but the moral reality is a conflict between two distinct centers of consciousness.

  ### 2. The Defender of Strong Precedent Autonomy

  You asked for a defender of strong precedent autonomy to explain the asymmetry without retreating. They cannot simply say, "Requests are harder to fulfill." They must explain why the *authority* of the earlier self binds differently in negative vs. positive cases.

  **The Argument from Sovereignty:**
  A strong defender would argue that autonomy is fundamentally about **sovereignty over one's boundaries**, not **entitlement to resources.**
  *   **Refusals:** When I write a directive refusing ventilation, I am drawing a boundary around my body. That boundary is a property right. Even if I lose the capacity to guard the fence (dementia), the property line does not move. To ignore the directive is to trespass.
  *   **Requests:** When I write a directive requesting experimental medication, I am not drawing a boundary; I am asking for entry into a shared practice (medicine). My earlier self cannot bind a clinician to act against their professional judgment any more than my earlier self can bind a stranger to give me money.

  **The Argument from Irreversibility:**
  The defender would also lean on the **asymmetry of error.**
  *   If we honor a refusal and the patient dies, we cannot check if we were wrong. But if we *violate* a refusal and keep them alive, we have definitively violated their bodily integrity. The moral cost of forced intrusion is higher than the moral cost of withheld aid.
  *   Therefore, the earlier self's authority is absolute regarding *protection from intrusion*, but advisory regarding *demands for care*. This preserves the "strong" precedent autonomy for the only thing that truly matters: preventing the body from being used as a vessel against its owner's design.

  ### 3. The "Continuity Clause" Hypothetical

  This is the most revealing part of your inquiry. If hospitals offered a choice:
  *   **Box A (Continuity):** Instructions govern even if I change psychologically.
  *   **Box B (Lapse):** Instructions lapse if I change psychologically (clinicians follow current well-being).

  **How a Hospital Must Handle Box A:**
  *   **Refusals:** They must honor this. This is the current legal default.
  *   **Requests:** They can still reject this based on futility/professional integrity. Box A does not turn a futile treatment into a viable one.
  *   **Implication:** Box A confirms the "Legal Person" theory. It asserts that the signature on the form binds the biological organism regardless of psychological transformation.

  **How a Hospital Must Handle Box B:**
  *   **Refusals:** This is legally toxic. If a patient checks Box B, they are effectively saying, "If I become demented and happy, I want my prior refusal to be void."
      *   *The Problem:* In most jurisdictions, you cannot consent to future battery while incompetent. If the demented patient is happy and wants treatment, fine. But if the demented patient is distressed and refuses treatment, but the *earlier* self said "treat me," Box B creates a conflict.
      *   *The Coherence:* Accepting Box B concedes that **precedent autonomy is conditional on psychological continuity.** It admits that the authority of the earlier self derives from their representation of the later self's interests. If the representation fails (because the later self is different), the authority dissolves.
  *   **Requests:** Box B makes little difference here, as requests are already advisory.

  **Is Box B Coherent?**
  A system can accept Box B, but it transforms the Advance Directive from a **Command** into a **Testament of Values.**
  *   If Box B is valid, then the Advance Directive is no longer about *rights*; it is about *evidence*. It tells the surrogate, "This is what I used to like."
  *   **The Concession:** Accepting Box B concedes that the first box (Box A) was never really about "who the patient is" in a metaphysical sense. It was about **social policy.** We honor Box A not because the selves are identical, but because we want competent people to feel safe planning their deaths. Box A is a utilitarian tool to encourage planning; Box B is the metaphysical truth that the "demented self" is a new moral patient.

  ### 4. Summary for Your Piece

  If you are writing this piece, here is the synthesis of the tension:

  1.  **The Asymmetry is Structural, Not Metaphysical:** The system does not rely on the earlier and later selves being the "same person." It relies on the earlier self having the exclusive legal power to set **limits** (refusals), while lacking the power to mandate **actions** (requests).
  2.  **The Hidden Hierarchy:** Honoring a refusal in the face of current contentment *does* require ranking "Critical Interests" (the narrative of the life) over "Experiential Interests" (the quality of the moment). The practice hides this by calling it "respecting the patient's rights," but morally, it is prioritizing the author of the life over the character currently living it.
  3.  **The Continuity Clause Test:** If you introduced Box B (Lapse), you would expose that the current system is a **legal fiction.** We pretend the selves are the same to protect the integrity of the planning process. If we allowed Box B, we would admit that in advanced dementia, we are often making decisions for a *new* person, guided by the ghost of the old one.
  4.  **The Defender's Last Stand:** A strong defender of precedent autonomy must argue that **integrity is a property of the life, not the moment.** To allow the demented self to override the competent self's refusal is to allow a temporary state of mind to destroy the coherence of a whole human life. The asymmetry exists because destroying a life's coherence (by violating a refusal) is a greater moral injury than failing to optimize a moment's happiness (by denying a request).

  **The Journalistic Hook:**
  The system claims to be about "patient autonomy." But in cases of advanced dementia, it is actually about **whose autonomy counts.** The practice answers: "The autonomy of the person who could understand death counts more than the autonomy of the person who can only understand comfort." It is a system that privileges the *capacity to value* over the *capacity to feel*, and the asymmetry between refusals and requests is the mechanism by which it enforces that hierarchy.
