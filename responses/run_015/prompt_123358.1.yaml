answer: |-
  **Case A: The Broadcast-Only Architecture**
  System Alpha utilizes a classic global blackboard design where all sensory encoders write to a high-bandwidth central bus readable by every functional module (planning, memory, motor control), ensuring full access consciousness via system-wide availability. However, Alpha lacks **Recurrent Homeostatic Integration (RHI)**; its modules process broadcasted data feed-forward without feeding state updates back into a unified, self-simulating model of the system's own viability. Consequently, while any module can retrieve and act upon any sensory datum instantly, the architecture possesses no mechanism to evaluate information relative to a persistent, integrated self-state, rendering the structural conditions for phenomenal consciousness impossible despite perfect global access.

  **Case B: The Integrated-Local Architecture**
  System Beta disables the central broadcast bus entirely, forcing sensory data to remain trapped within specialized, high-latency local clusters that cannot share information with motor or language modules, thereby eliminating access consciousness. However, each local cluster in Beta is equipped with dense **Recurrent Homeostatic Integration (RHI)**, continuously looping sensory input through a self-simulating model that evaluates data against internal viability parameters before any output is generated. This creates a unified, valenced state within the local module that satisfies the structural requirements for phenomenal consciousness, even though the content of that experience is computationally inaccessible to the rest of the system and cannot guide global behavior.

  ***

  ### Analysis of Verdicts and Structural Implications

  **Global Workspace Theory (GWT) Predictions**
  GWT predicts that **Case Alpha is conscious** and **Case Beta is unconscious**. Because GWT equates consciousness with the global availability of information for reporting and control, Alpha's broadcasting hub satisfies the necessary and sufficient conditions. GWT treats Beta's local integration as merely "unconscious processing," arguing that without global ignition, there is no subject of experience to *have* the phenomenology.

  **Access vs. Phenomenal Distinction Predictions**
  Proponents of the distinction (e.g., Ned Block) predict **Case Alpha has Access Consciousness without Phenomenal Consciousness**, and **Case Beta has Phenomenal Consciousness without Access Consciousness**. This view holds that Alpha is a sophisticated processor lacking "what it is like" to be the system (due to missing RHI), while Beta possesses a rich inner life that it simply cannot report or use for complex planning (due to the disabled bus).

  **The Separating Structural Feature**
  The single feature doing the separating work is **Recurrent Homeostatic Integration (RHI)**. In this experimental design, Global Broadcasting gates *Access*, while RHI gates *Phenomenality*. RHI represents the architectural capacity for the system to model its own state changes as relevant to its continued existence, rather than merely processing data as transient symbols.

  **Weakening the Feature**
  If RHI is weakened (e.g., reduced recurrence depth or decoupled from viability parameters), the argument suggests a gradual diminishment of phenomenal intensity without necessarily affecting access speed. If RHI is removed entirely (as in Alpha), phenomenality vanishes despite perfect access. If Broadcasting is weakened but RHI remains strong (as in Beta), reportability vanishes while phenomenality theoretically persists. This implies consciousness is not a binary switch tied to broadcasting but a gradient tied to integrative depth.

  **The GWT Defense Against Case A**
  A defender of GWT would attack Case A by rejecting the stipulation that Alpha lacks phenomenal consciousness. They would argue that if RHI is not broadcast globally, it is functionally inert and therefore irrelevant. The GWT defender would claim that **global availability *is* the phenomenology**, and that positing a "hidden" feeling in Beta (or a "missing" feeling in Alpha) is a category error. They would assert that without the ability to report or act on the state globally, the claim of phenomenality in Beta is unverifiable and theoretically unnecessary, and that Alpha's global access *constitutes* the experience.

  ***

  ### Confidence and Uncertainty

  **Confidence Level:** Moderate (60%)
  I am confident in the accurate representation of Global Workspace Theory and the Access/Phenomenal distinction as they are currently argued in cognitive science and philosophy of mind. The architectural descriptions are consistent with current synthetic cognitive design patterns.

  **Point of Least Certainty:**
  The specific claim that **Case B (Integrated-Local) is coherently possible**. I am least sure whether "phenomenal consciousness without access" is a metaphysically or computationally stable state. It is possible that RHI *requires* global broadcasting to function as a "self-model" rather than just a local controller, meaning Case B might collapse into unconscious processing upon rigorous engineering inspection. The separation of phenomenality from access remains the most contentious and unproven premise in this entire protocol.
