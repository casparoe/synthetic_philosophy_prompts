answer: |-
  To count as a solution rather than a redescription, a normative theory of remembrance and forgetting must provide a decision procedure for the archivist-executor that distinguishes between *hoarding* and *stewardship*. It must move beyond the binary of "preserve all" versus "destroy all" to a framework of *curated obligation*. Below is the specification of the desiderata such a theory must satisfy, the conflicts it must acknowledge, and an assessment of how existing conceptual models fail to meet these criteria.

  ### I. The Desiderata of an Adequate Theory

  An adequate theory must deliver explanatory power for the following five phenomena. Failure to account for any one of these reduces the theory to a slogan.

  **1. The Paradox of Harmful Truth (The Perpetrator's Correspondence)**
  *   **Phenomenon:** The theory must explain why preserving a perpetrator's private letters can constitute a secondary violence against victims, even if those letters contain historical truth.
  *   **Conceptual Distinction:** *Archival Completeness* vs. *Ethical License*.
      *   *Completeness* is a logistical state (all data is present); *License* is a normative permission (this data may circulate).
      *   The theory must articulate why *Mnemonic Debt* is not satisfied merely by storage. If the debt is to the victims, paying it by amplifying the perpetrator's voice without context violates the terms of the debt.
  *   **Requirement:** The theory must define a category of "toxic evidence"—records that are historically valid but ethically radioactive—and prescribe conditions for their containment (e.g., sealed access, redaction, or contextual framing) rather than assuming transparency is inherently virtuous.

  **2. The Duty to Disruption (The Survivor's Testimony)**
  *   **Phenomenon:** The theory must explain why a survivor's testimony must be preserved even when it shatters a community's cohesive self-narrative or threatens its ongoing viability.
  *   **Conceptual Distinction:** *Social Cohesion* vs. *Testimonial Justice*.
      *   Communities often rely on shared myths to function. A theory of memory must prioritize *Testimonial Justice* (the right of the victim to be heard) over *Social Cohesion* (the comfort of the group) when the two conflict.
      *   However, it must also explain the cost of this disruption.
  *   **Requirement:** The theory must validate *Counter-Memorial Silence* elsewhere to balance this disruption. If you preserve the testimony that breaks the community, you may owe the community a silence elsewhere (e.g., withholding the names of low-level accomplices) to prevent total social collapse. It must treat memory as an ecosystem, not a single ledger.

  **3. The Architecture of Structural Silence (The Missing Margins)**
  *   **Phenomenon:** The theory must account for why institutional archives systematically over-record the powerful and under-record the marginal, and prescribe a response that is not merely "add more boxes."
  *   **Conceptual Distinction:** *Accidental Loss* vs. *Constitutive Exclusion*.
      *   *Accidental Loss* is paper rotting; *Constitutive Exclusion* is a system designed never to record certain lives.
      *   Filling the gap with "guesses" or "representative samples" can be a new form of violence (speaking for the silent).
  *   **Requirement:** The theory must distinguish between *recovery* (finding lost records) and *marking the void* (documenting the absence itself). A rigorous theory demands that the archive record *why* certain records do not exist. The "empty folder" is not a failure; it is a data point about power.

  **4. The Taxonomy of Forgetting**
  *   **Phenomenon:** The theory must distinguish between the forgetting that harms and the forgetting that heals.
  *   **Conceptual Distinction:** *Forgetting as Erasure* vs. *Forgetting as Merciful Release*.
      *   *Erasure* denies that an event happened (revisionism).
      *   *Merciful Release* acknowledges the event but denies it the power to dictate the future (amnesty, privacy, sealing).
  *   **Requirement:** The theory must provide criteria for when *Counter-Memorial Silence* is an act of respect rather than neglect. This requires a metric of *consent* and *agency*. Did the subject have a say in their silence? Is the silence protecting the living or shielding the guilty?

  **5. The Temporal Horizon of Obligation**
  *   **Phenomenon:** The theory must explain when a *Mnemonic Debt* expires.
  *   **Conceptual Distinction:** *Eternal Duty* vs. *Generational Handoff*.
      *   Does the executor owe the dead forever, or only until the living are safe?
  *   **Requirement:** The theory must define the conditions under which the duty to remember transforms into a duty to let go. If the memory no longer serves justice or truth, but only sustains grief, the debt may be considered paid.

  ### II. The Conflict Matrix (Jointly Unsatisfiable Desiderata)

  A rigorous theory must admit where it cannot have it all. The following pairs are likely jointly unsatisfiable; a theory must prioritize one or define a tragic trade-off.

  **1. Total Mnemonic Transparency vs. The Right to Be Forgotten**
  *   **Conflict:** You cannot have a perfectly complete archive and a robust right to privacy/oblivion.
  *   **Resolution Requirement:** The theory must reject "Total Transparency" as a normative ideal. It must treat transparency as a *means* to justice, not an *end* in itself. If transparency violates the *Merciful Release* of the living (e.g., descendants of victims, or even reformed perpetrators), the theory must allow for redaction.
  *   **Status:** *Non-Negotiable.* Any theory claiming both is logically incoherent.

  **2. Memory as Justice vs. Memory as Healing**
  *   **Conflict:** Justice often requires raking up coals (identifying perpetrators, detailing crimes); Healing often requires letting the fire go out (integration, moving forward).
  *   **Resolution Requirement:** The theory must acknowledge that the archive cannot be both a courtroom and a clinic simultaneously. It must specify which function takes precedence in the context of the *community organization* vs. the *family estate*. (e.g., Family = Healing priority; Public Institution = Justice priority).
  *   **Status:** *Context-Dependent.* A universal theory fails here; it must be modular.

  ### III. Non-Negotiables vs. Camp Preferences

  To avoid bias, the theory must distinguish between core architectural needs and philosophical preferences.

  **Non-Negotiable (Core Architecture):**
  *   **Agency:** The subjects of the records (or their proxies) must have some standing in the decision to preserve or destroy.
  *   **Power Analysis:** The theory must account for who created the record and who is harmed by it.
  *   **Distinction of Forgetting:** It must structurally differentiate Erasure from Release.

  **Camp Preferences (Philosophical Alignments):**
  *   **The Margalit Position (Ethics of Memory):** Prioritizes *Mnemonic Debt* as a thick relation. Favors preservation. Risks turning grief into a duty.
      *   *Preference:* Treats forgetting as a moral failure unless strictly necessary.
  *   **The Rieff Position (Against Remembrance):** Prioritizes the future over the past. Favors *Merciful Release*. Risks enabling impunity.
      *   *Preference:* Treats remembering as a political tool that should be discarded when it hinders peace.
  *   **The Theory's Stance:** An adequate theory must not adopt either camp wholesale. It must treat Margalit's "Debt" as the *default* and Rieff's "Release" as the *exception that requires justification*, or vice versa, but it must explicitly state the burden of proof.

  ### IV. Assessment of Existing Approaches

  Here is how the three dominant conceptual models fare against the desiderata above, specifically regarding where they collapse essential distinctions.

  **1. The Ethics of Debt (Remembrance as Obligation to the Dead)**
  *   **Performance:** Strong on Desiderata 2 (Survivor Testimony) and 5 (Temporal Horizon). It takes the "Mnemonic Debt" seriously.
  *   **Collapse:** It collapses *Archival Completeness* with *Ethical License*. It assumes that because we *can* remember, we *must*. It struggles with Desiderata 1 (Harmful Truth). It often lacks a mechanism for *Counter-Memorial Silence*, viewing any withholding as a betrayal of the dead.
  *   **Verdict:** Fails the "Right to Be Forgotten" test. It creates a tyranny of the dead over the living.

  **2. The Politics of Reconciliation (Strategic Forgetting for Democratic Stability)**
  *   **Performance:** Strong on Desiderata 4 (Taxonomy of Forgetting - specifically Merciful Release). It understands that communities need silence to function.
  *   **Collapse:** It collapses *Forgetting as Erasure* with *Forgetting as Release*. In the pursuit of "moving on," it often sanctions the erasure of structural injustices (Desiderata 3). It risks sacrificing the *Survivor's Testimony* (Desiderata 2) for the sake of *Social Cohesion*.
  *   **Verdict:** Fails the "Justice" test. It privileges the peace of the powerful over the truth of the marginalized.

  **3. The Psychological Trauma Model (Integration vs. Suppression)**
  *   **Performance:** Strong on the distinction between *Erasure* and *Release*. It understands that memory can be pathogenic.
  *   **Collapse:** It collapses the *Collective* into the *Individual*. It treats the archive as a therapeutic tool for the living rather than a record for the future. It fails Desiderata 3 (Structural Silence) because trauma is individual, but structural silence is systemic. It cannot explain why we should keep records that hurt us if "healing" is the goal.
  *   **Verdict:** Fails the "Historical Truth" test. It reduces normative duty to clinical outcome.

  ### V. Conclusion: The Architectural Requirement

  To solve your problem, the theory you construct must function as a **triage system**. It cannot treat all records as equal. It must classify incoming material into three streams:
  1.  **Testimonial Core:** Must be preserved (Survivor testimony, structural evidence).
  2.  **Toxic Evidence:** Preserved but contained (Perpetrator correspondence, sensitive data).
  3.  **Candidate for Release:** Eligible for *Counter-Memorial Silence* (Private grief, redundant data, records where preservation harms the living).

  The "solution" is not a rule that tells you what to keep, but a **metric of harm**. If the preservation of a record inflicts more harm on the living than the loss of the record inflicts on the truth, the *Mnemonic Debt* is paid by the act of deliberate forgetting. This is the only way to reconcile the executor's duty to the dead with the archivist's duty to the future.
