      *   **Task:** Define the *desiderata* (requirements) for an adequate normative theory of remembrance and deliberate forgetting.
      *   **Key Concepts to Integrate:** Mnemonic Debt, Counter-Memorial Silence.
      *   **Specific Phenomena to Explain:**
          *   Why preserving a perpetrator's private correspondence might compound harm (even if historically true).
          *   Why a survivor's testimony demands preservation (even if it destabilizes community self-image).
          *   Why institutional archives over-record the powerful/under-record the marginal (structural silence).
      *   **Key Distinctions:** Forgetting as erasure vs. forgetting as merciful release; Archival completeness vs. Narrative coherence.
      *   **Conflict Analysis:** Flag jointly unsatisfiable desiderata (e.g., total transparency vs. right to be forgotten; justice vs. healing).
      *   **Non-negotiable vs. Camp Preferences:** Distinguish between core requirements and specific philosophical alignments (Margalit vs. Rieff).
      *   **Evaluation of Existing Approaches:** Briefly assess three main approaches (Ethics of Debt, Politics of Reconciliation, Psychology of Trauma) against the desiderata, noting where they collapse essential distinctions.
      *   **Constraint:** No bibliography, no "consult sources," focus on conceptual architecture.

  2.  **Deconstruct the Core Problem:**
      *   The user is facing the tension between *hoarding memory* (archival impulse) and *curating silence* (ethical impulse).
      *   The theory needs to move beyond "remember everything" or "forget everything."
      *   It needs to handle power dynamics, harm, and the difference between *storage* and *response*.

  3.  **Drafting the Desiderata (The "What"):**
      *   *Requirement 1: The Harm Principle in Preservation.* Why keep something if it hurts? Need to explain the difference between historical truth and ethical license.
      *   *Requirement 2: The Duty to Disruption.* Why keep something if it hurts the community's feelings? Survivor testimony vs. community myth.
      *   *Requirement 3: Structural Accountability.* Why are some people missing? The theory must address *why* the archive is skewed, not just fill gaps.
      *   *Requirement 4: The Taxonomy of Forgetting.* Distinguish malicious erasure from merciful release.
      *   *Requirement 5: The Limit of Transparency.* Can we have total transparency and a right to be forgotten? (This is the conflict point).
      *   *Requirement 6: Justice vs. Healing.* Does memory serve the court or the clinic? (Another conflict point).

  4.  **Refining the Distinctions:**
      *   *Erasure vs. Release:* Erasure denies existence; Release acknowledges existence but denies circulation.
      *   *Completeness vs. Coherence:* Completeness is data; Coherence is meaning. An archive can be complete but meaningless, or coherent but lying.

  5.  **Addressing the Conflicts (Joint Unsatisfiability):**
      *   *Transparency vs. Right to be Forgotten:* Logically, you can't have total transparency *and* a robust right to be forgotten. One must yield. A theory must decide which is the default and which is the exception.
      *   *Justice vs. Healing:* Justice often requires raking up coals; healing requires letting them cool. A theory must acknowledge this trade-off, not pretend they align.

  6.  **Categorizing Requirements (Non-negotiable vs. Camp Preferences):**
      *   *Non-negotiable:* Must distinguish types of forgetting; must address power imbalances; must account for harm.
      *   *Camp Preferences:* Margalit (thick relations, duty to remember) vs. Rieff (memory as obstacle to peace). The theory shouldn't just pick one but explain the tension.

  7.  **Evaluating Existing Approaches:**
      *   *Ethics of Debt (Margalit-esque):* Good on duty, bad on the right to forget. Risks turning memory into a burdensome idol.
      *   *Politics of Reconciliation (Rieff-esque):* Good on letting go, bad on structural silence. Risks sweeping injustice under the rug for "peace."
      *   *Psychological Trauma Model:* Good on the *effect* of memory, bad on the *normative* status. Treats memory as a symptom to be managed, not a record to be kept.

  8.  **Synthesizing and Polishing (Iterative drafting):**
      *   *Tone:* Rigorous, philosophical, empathetic to the practitioner's dilemma.
      *   *Structure:*
          1.  Introduction (acknowledging the stakes).
          2.  The Desiderata (numbered, with phenomena and distinctions).
          3.  The Conflict Matrix (joint unsatisfiability).
          4.  Non-negotiables vs. Preferences.
