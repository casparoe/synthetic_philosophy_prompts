  1. **Candidate principle**

  **The Principle of Explanatory Construction**
  1.  **Determinacy:** A fact F grounds G if F is a more specific determination of G (Cases 1, 9). This captures the crimson/red chain without conflating fundamentality with intermediate grounding; fundamentality is merely the chain's base.
  2.  **Mereological Direction:** Arranged parts ground wholes; wholes never ground parts (Cases 5, 6). This blocks priority monism by fixing explanatory direction on composition; arrangement is part of the ground.
  3.  **Boolean Uniformity:** Conjunctions and disjunctions are grounded by their truth-makers (Case 4; revises 3). Both introduce truth-conditions distinct from their components, requiring grounding to satisfy the "Distinctness" test.
  4.  **Negation via Totality:** Negative facts are grounded by the totality of positive facts in a domain (Case 7). This avoids circularity by grounding absence in exhaustive presence rather than specific positives.
  5.  **Set-Theoretic Dependence:** Concrete members ground their singletons; the empty set is an ungrounded logical primitive (Case 2). This separates ontological fundamentality (concrete base) from logical necessity (abstract constants).
  6.  **Non-Supervenience:** Nomological necessitation does not entail grounding (Case 8). Laws require explanatory connection beyond modal covariance; the mosaic lacks the normative force to ground laws.
  This principle prioritizes explanatory depth over mere modal correlation, treating grounding as ontological construction rather than logical entailment. It resolves your tension between fundamentality and grounding by defining fundamentality as the termination of grounding chains, not the absence of grounding relations entirely. Logical truths terminate chains without being fundamental constituents of reality.

  2. **Run over my cases**

  The table below compares our verdicts. Where we agree, the principle confirms your intuition. Where we diverge, the principle corrects an inconsistency. The primary divergence is on Boolean compounds, where your intuition treats conjunctions as invisible but disjunctions as visible. The principle enforces uniformity.

