answer: |-
  You have identified a very specific and well-documented tension in political economy, but you are correct that there is no single, universally agreed-upon noun that captures the *entirety* of that configuration (benevolent metrics + structural dependency) in one word.

  However, in academic literature, this configuration is most precisely described by the convergence of two concepts: **"Dependent Development"** (from Dependency Theory) and **"Extractive Institutions"** (from New Institutional Economics).

  If you are looking for the historical policy name for this specific era of "improving while locking in," historians often refer to it as **"Colonial Developmentalism."**

  Here is how to map the terminology, the theoretical lineage from Smith, and how to draw the boundaries you asked for.

  ### 1. The Established Concepts

  **A. Dependent Development (The Economic Structure)**
  Coined primarily by Fernando Henrique Cardoso and Enzo Faletto (1979), this concept directly addresses your observation that "improvement data" and "dependency" are not opposites.
  *   **The Definition:** A situation where industrialization and economic growth *do* occur in the periphery (roads, literacy, trade volume increase), but the *structure* of that growth reinforces reliance on the core.
  *   **Why it fits:** It rejects the binary that "colonialism = stagnation." Instead, it argues that the colony can grow dynamically, but only in sectors that serve the metropole (e.g., efficient ports for extraction, literacy for lower-level bureaucracy), making the region *more* valuable as a dependency, not less.

  **B. Extractive Institutions (The Institutional Design)**
  Popularized by Daron Acemoglu and James Robinson in *Why Nations Fail* (2012), though the idea is much older.
  *   **The Definition:** Institutions designed to extract wealth and resources from the many for the benefit of the few (the metropole/elite), as opposed to "inclusive institutions" that empower broad participation.
  *   **Why it fits:** You noted that "legal authority stays with the metropole" and "leaders are appointed." Acemoglu/Robinson argue that you can have high GDP growth under extractive institutions (e.g., the Soviet Union, or colonial plantations), but it is unsustainable and structurally prevents self-governance because the institutions are designed to concentrate power, not distribute it.

  **C. Colonial Developmentalism (The Historical Policy)**
  This is the specific historical term for the shift you are describing, particularly prominent in the British Empire from the 1930s to the 1950s (e.g., the Colonial Development and Welfare Acts).
  *   **The Context:** Earlier colonialism was often laissez-faire extraction. *Colonial Developmentalism* admitted that neglect caused instability. So, the metropole actively invested in health, education, and infrastructure.
  *   **The Catch:** As historian Frederick Cooper argues, this was done to make colonies more productive and stable *within* the empire, not necessarily to prepare them for exit. The "development" was a technique of governance, not a pathway to sovereignty.

  ### 2. The Adam Smith Connection

  You are right to anchor this in Smith. In *The Wealth of Nations* (Book IV, Chapter VII), Smith argues that the mercantile system turns the colony into a **monopsony** (a market with only one buyer).

  Smith's insight was that even if the colony prospers, its prosperity is **"clogged"** by the restriction of its market. He argued that the "benefit" of protection is outweighed by the "tax" of restricted trade. Your observation updates Smith: it's not just trade restrictions; it's that the *institutions of improvement* (schools, courts, roads) are themselves the mechanism of the clog.

  In modern postcolonial theory, this is often linked to **Partha Chatterjee's** concept of the **"Rule of Colonial Difference."** The colonizer says, "We are building institutions to modernize you," but simultaneously argues, "You are not yet ready to run these institutions," thereby justifying permanent control. The improvement *creates* the justification for the dependency.

  ### 3. Drawing the Boundaries: How to Distinguish from Paternalism

  You asked how to distinguish this from genuine paternalism (where the authority intends to let go). In political science, this is the difference between **Tutelage** and **Trusteeship.**

  To determine if a configuration is "Benevolent Dependency" (your concept) vs. "Genuine Paternalism," apply these three boundary tests:

  **I. The Sovereignty Horizon Test**
  *   **Genuine Paternalism:** Has a defined metric for "graduation." The institutions are designed to become obsolete or transferable. (e.g., "When literacy hits X%, local elections begin.")
  *   **Benevolent Dependency:** The metrics for improvement are decoupled from the metrics for sovereignty. You can have 90% literacy and a booming GDP, but the legal authority remains with the metropole indefinitely. The "child" is never allowed to become an "adult."

  **II. The Economic Diversification Test**
  *   **Genuine Paternalism:** Encourages the region to develop industries that might eventually compete with the metropole, accepting short-term loss for long-term independence.
  *   **Benevolent Dependency:** Infrastructure is built specifically to lower the cost of *extraction* (roads from mines to ports) rather than *integration* (roads between local cities). The economy is optimized for complementarity with the metropole, not self-sufficiency.

  **III. The Accountability Loop Test**
  *   **Genuine Paternalism:** Local leaders, even if appointed, are increasingly accountable to local constituencies as a training mechanism.
  *   **Benevolent Dependency:** Local leaders are accountable *upward* to the metropole. Their legitimacy comes from their ability to manage the local population for the benefit of the center, not from representing the local population to the center.

  ### 4. Suggested Terminology

  If you need a precise phrase to use in conversation or writing that captures this specific duality, I recommend:

  > **"Structural Dependency"** or **"Institutionalized Dependence."**

  However, if you want to capture the *ideological* aspect (the claim of benevolence), the most accurate critical term is:

  > **"The Development of Underdevelopment."**

  Coined by Andre Gunder Frank (1966), this phrase argues that the "development" of the satellite region is actually the active *production* of its own underdevelopment relative to the core. It captures your exact point: the roads and schools are not accidents; they are the tools that lock the region into a subordinate position.

  **Summary for your discussion:**
  You are describing **Colonial Developmentalism** operating through **Extractive Institutions** to create **Dependent Development**. The key boundary that separates this from benevolent paternalism is the absence of a **sovereignty horizon**—the system is designed to manage the population, not to empower a successor state.
