answer: |-
  ### Final Exam Essay Question

  **Course:** PHIL 405 – Locke and the Empiricists  
  **Time Allowed:** 90 Minutes  
  **Total Marks:** 30  

  **Question:**  
  In *Some Thoughts Concerning Education*, Locke famously advises tutors to avoid corporal punishment and instead govern children through "esteem and disgrace," yet he simultaneously insists that a parent must inevitably "break the will" of a stubborn child. Evaluate whether this coercive imperative is consistent with Locke's empiricist psychology, specifically his commitment to the *tabula rasa* and the formation of virtue through habit rather than innate temperament. In your answer, consider whether the variable success of Locke's method introduces a problem of "pedagogical moral luck"—where educational outcomes depend on the child's native pliability rather than the tutor's skill—and explain what this implies for the coherence of Locke's view of the mind.

  ***

  ### Model Answer

  **1. The Tension Between Rational Persuasion and Will-Breaking**  
  Locke's pedagogy rests on a apparent contradiction. On one hand, he argues that children are rational agents in the making; therefore, coercion (corporal punishment) is counterproductive because it fosters slavery to pain rather than love of virtue. He proposes governing through "esteem and disgrace," appealing to the child's desire for social validation. On the other hand, Locke admits that when a child exhibits "obstinacy," the tutor must "break the will." The tension lies here: if the mind is to be guided by reason and habit, why is a pre-rational force required to crush the will? If the child is truly a *tabula rasa*, obstinacy should be a product of bad habitting, correctable by re-habitting. The command to "break" suggests the will is a distinct entity that can resist reason entirely, requiring force rather than persuasion. This looks less like empiricist conditioning and more like combat against an innate adversary.

  **2. The Failure of the Wit vs. Judgment Distinction**  
  Locke attempts to manage psychological differences by distinguishing between "wit" (quickness of thought) and "judgment" (careful separation of ideas). One might argue that "breaking the will" is simply correcting a lack of judgment. However, this distinction does not dissolve the tension. Obstinate willfulness is not necessarily a failure of judgment (knowing the better) but a failure of volition (choosing the better). A child can judge correctly that disobedience brings shame yet still willfully disobey. By targeting the *will* specifically for breaking, Locke acknowledges a faculty that operates independently of the understanding. Since his empiricism claims the understanding determines the will via unease and desire, a will that must be "broken" implies a resistance within the machinery of the mind that empiricist habit-formation cannot fully explain.

  **3. Innate Temperament and the Crack in the Blank Slate**  
  This leads to the issue of native disposition. Locke officially denies innate ideas, but in *Education*, he frequently references native temperaments (e.g., the choleric child vs. the sluggish child). If some children require "will-breaking" and others do not, this variance suggests native differences in moral pliability. If the *tabula rasa* were truly blank, all children would respond uniformly to the same regimen of esteem and shame. The necessity of coercive intervention for some implies that the "slate" has a grain—a native temperament that resists empirical imprinting. Locke tries to have it both ways: denying innate moral principles while admitting innate psychological dispositions that dictate how those principles must be applied. This sneaks a form of nativism into his moral psychology.

  **4. Pedagogical Moral Luck**  
  This variance introduces the problem of "pedagogical moral luck." If educational success depends on the tutor matching their method to the child's native temperament, then a successful outcome is partly due to luck (having a pliable child) rather than solely due to the tutor's skill or the method's validity. If a child succeeds because they were naturally amenable to "esteem and disgrace," Locke's empiricism stands. But if a child succeeds only because the tutor successfully "broke" a resistant native will, the success is not purely a product of environmental conditioning. This undercuts the strong empiricist claim that virtue is *mainly* habit and experience. It suggests that the raw material of the mind constrains the possible outcomes of education, meaning moral virtue is not infinitely malleable.

  **5. Conclusion: Repair or Collapse?**  
  Does Locke's view collapse? It can be repaired if we interpret "breaking the will" not as contradicting empiricism, but as the necessary precondition for it. The "will" that must be broken is not an innate evil, but the accumulation of early, unchecked habits that solidify into a "second nature." Thus, breaking the will is actually breaking a *bad habit* before it becomes immutable. However, this repair is shaky. Locke's language suggests fighting the child's nature, not just their habits. Ultimately, Locke's system remains coherent only if we accept a weak nativism: the mind is blank regarding *ideas*, but not regarding *dispositions*. If we insist on a strict *tabula rasa*, the necessity of will-breaking creates a fatal inconsistency. Locke saves his pedagogy at the cost of pure empiricism.

  ***

  ### Marking Scheme (30 Marks Total)

  | Move | Marks | Criteria for Full Credit | Common Pitfall (Deduction) |
  | :--- | :---: | :--- | :--- |
  | **1. Tension Articulation** | 6 | Clearly defines the conflict between governing by reason/esteem vs. coercive will-breaking. Identifies why this threatens the rational agent model. | **Conflating Locke with Rousseau:** Treating Locke as a pure "naturalist" who opposes all coercion, missing the specific "breaking" command. |
  | **2. Wit vs. Judgment** | 6 | Explains the distinction but argues why it fails to resolve the volitional problem (obstinacy ≠ lack of understanding). | **Category Error:** Treating wit/judgment as moral categories rather than cognitive faculties, or claiming Locke uses them to solve the will problem successfully. |
  | **3. Innate Temperament** | 6 | Identifies that variable resistance implies native disposition. Argues whether this contradicts *tabula rasa* (yes, regarding dispositions). | **Environmental Reductionism:** Assuming all stubbornness is purely learned habit, ignoring Locke's textual admissions of native temperaments. |
  | **4. Moral Luck** | 6 | Applies the "pedagogical moral luck" concept. Links variable success to the limits of empiricist malleability. | **Ignoring the Prompt:** Failing to use the term "moral luck" or failing to connect luck to the validity of empiricism. |
  | **5. Verdict/Repair** | 6 | Provides a clear conclusion (collapse or repair). Justifies the stance based on the previous analysis (e.g., weak nativism vs. strict empiricism). | **Fence-Sitting:** Refusing to take a stance on consistency, or offering a vague summary instead of a philosophical verdict. |

  ***

  ### Aside: Meta-Commentary on the Model Answer

  **What would change my mind?**  
  If a student pointed out that Locke defines "will" in *An Essay Concerning Human Understanding* strictly as the power to prefer, and in *Education* uses "breaking the will" colloquially to mean "correcting wrong preferences before they solidify," I might concede the consistency holds. There is textual evidence that Locke views obstinacy as a habit of demanding things, not a metaphysical faculty. If "breaking" is just "extinguishing a bad habit early," the nativism charge weakens.

  **Where is my reasoning shakiest?**  
  I am likely being too harsh on the "innate temperament" point in Move 3. Locke consistently denies innate *principles*, but he is quite open about innate *physiological* constitutions (health, energy levels) affecting the mind. My model answer treats this as a contradiction of empiricism, but Locke might argue physiological differences are compatible with a blank *mental* slate. Distinguishing between "native temperament" and "innate ideas" is the weakest link in my own critique here.
