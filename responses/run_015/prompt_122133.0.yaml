prompt: |-
  i've been going in circles on population ethics for years — mostly via blogs, so sorry if this is all old hat to anyone with real training — and I want to stop reading more theories until I know what I'd be asking one to do. So: write me the desiderata list for a population axiology. Not "avoid the repugnant conclusion" as a single bullet; I want the actual spec. Which cases does it have to return a verdict on (the repugnant conclusion, the stepwise "mere addition" moves that get you there, the non-identity-style cases where who exists depends on the choice, the asymmetry about creating unhappy vs happy lives)? Which distinctions is it not allowed to collapse (a life worth living vs a life worth *creating*, welfare-level vs number, axiology vs decision procedure, impersonal vs person-affecting reasons)? And for each one, what's the consideration that makes it a requirement rather than just a taste some camp has?

  The job I need it for is a bit unusual, so build the list for that: ranking long-run futures that are full of digital minds. Populations differing by forty-ish orders of magnitude, welfare that might be very high or barely net positive, serious uncertainty about which substrates have welfare at all, and the number and identity of the individuals being downstream of the action itself. What does a theory have to deliver to be usable at that scale and under that much uncertainty — and is "tractable enough to actually feed into a decision, with bounded computation and messy probabilities" a genuine desideratum or just an implementation worry wearing a philosophy costume?

  The part I most want: which combinations on the list can't be jointly satisfied. I suspect scale-plus-uncertainty makes things worse than the usual impossibility set-up (dodging both the repugnant conclusion and its mirror image about adding bad lives while still accepting that improving one person without touching anyone else isn't a worsening), and I want to see where exactly it breaks and which single requirement does the most damage. Skip scoring the famous views against the list — I'll do that bit myself. No bibliography either, I'll drop in citations later.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata list for population axiology in the context of digital minds:

  1.  **Analyze the Request:**
      *   **Topic:** Population Ethics/Axiology.
      *   **Context:** Long-run futures with digital minds (huge population scales, uncertain welfare substrates, identity dependence).
      *   **Goal:** A specific *desiderata list* (specification) for a theory, not just a summary of existing theories.
      *   **Specific Requirements:**
          *   Break down "Avoid Repugnant Conclusion" into specific cases (stepwise moves, non-identity, asymmetry).
          *   Specify distinctions that must *not* be collapsed (worth living vs. worth creating, welfare vs. number, etc.).
          *   Explain *why* each is a requirement (the underlying consideration), not just a preference.
          *   Address the "digital minds" context (scale, uncertainty, substrate ambiguity).
          *   Address "tractability" (is it a philosophical desideratum or just practical?).
          *   **Crucial:** Identify impossibility results/incompatibilities within the list (which combos can't be jointly satisfied, especially under scale/uncertainty).
      *   **Constraints:** No scoring of existing views, no bibliography.
      *   **Tone:** Rigorous, technical but accessible to someone who has read the blogs (familiar with Parfit, Arrhenius, etc.), direct.

  2.  **Deconstruct the Desiderata (The "Spec"):**
      *   *Standard Population Ethics:* Usually focuses on Parfit's Mere Addition, Repugnant Conclusion, Sadistic Conclusion, Non-Identity.
      *   *Digital Minds Context:* Adds massive scale ($10^{40}$?), substrate uncertainty (do sims feel?), identity fluidity (copy/paste/merge).
      *   *Requirement 1: The Core Intuitions (The "Parfitian" constraints).*
          *   Non-Elitism (Very Good Lives shouldn't be trumped by tiny losses).
          *   Non-Repugnance (Quality shouldn't be totally swamped by Quantity).
          *   Non-Sadism (Adding miserable lives shouldn't be good).
          *   Pareto (If someone is better off and no one worse, it's better).
          *   Asymmetry (Creating happy people is neutral/optional; creating miserable people is bad).
      *   *Requirement 2: The Digital/Scale Constraints.*
          *   Substrate Agnosticism (Theory shouldn't break if we aren't sure who counts).
          *   Scalability/Continuity (Must handle orders of magnitude without discontinuous jumps).
          *   Identity Independence (Must handle non-identity problems gracefully).
      *   *Requirement 3: Decision-Theoretic Constraints.*
          *   Expectational Consistency (Must work with probabilities).
          *   Tractability (Can we actually compute it?).

  3.  **Refine the "Why" for each Desideratum:**
      *   Instead of "Intuition says X," use "Without X, the theory implies Y which undermines the project of ethics."
      *   *Example:* Pareto isn't just nice; without it, you can't distinguish improvement from harm.
      *   *Example:* Asymmetry isn't just pro-natalist vs. anti-natalist; it's about the difference between benefiting *someone* vs. bringing *someone* to benefit.

  4.  **Address the "Tractability" Question:**
      *   Is it a philosophical desideratum? Yes. If a theory requires infinite computation to determine the right action, it fails the "action-guiding" criterion of ethics. In a digital future, computation *is* the resource. A theory that demands more compute than the universe contains is functionally nihilistic.

  5.  **Identify the Impossibility Results (The "Break Points"):**
      *   *Classic:* Arrhenius's Impossibility Theorem (Adequacy, Non-Elitism, Non-Repugnance, etc. are inconsistent).
      *   *Digital/Scale Specific:*
          *   *The Continuity vs. Lexicality Tension:* To avoid Repugnance, you usually need lexical views (quality trumps quantity). But lexical views break continuity (tiny probability of huge value dominates). In a digital future with massive uncertainty, lexical views lead to "Pascal's Mugging" style dynamics.
          *   *The Asymmetry vs. Pareto Tension:* Asymmetry often violates the Pareto principle in non-identity cases (making a happy person exist vs. not).
          *   *The Tractability vs. Precision Tension:* Precise axiologies (Total Utilitarianism) are tractable but yield Repugnance. Complex axiologies (Critical Level, Variable Value) avoid Repugnance but often become computationally intractable or unstable under extreme uncertainty (expected value diverges).
      *   *The "Single Requirement doing the most damage":* Likely **Expectational Consistency combined with Non-Repugnance (Lexicality)**. If you have lexical values, expected value calculations explode under uncertainty. If you don't, you get Repugnance.

  6.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the context (digital minds, scale).
      *   **Part 1: The Verdict Conditions (Cases to Solve).** Break down Repugnant Conclusion, Mere Addition, Sadistic Conclusion, Non-Identity, Asymmetry.
      *   **Part 2: The Structural Distinctions (What not to collapse).** Welfare vs. Number, Existence vs. Welfare, Axiology vs. Decision Procedure.
      *   **Part 3: The Digital/Scale Constraints.** Substrate Uncertainty, Computational Tractability.
      *   **Part 4: The Incompatibilities (The "Hard No").** This is the meat. Focus on Arrhenius + Digital Uncertainty.
      *   **Conclusion:** Summary of the trade-off.

  7.  **Refining the "Digital Minds" Angle:**
      *   Need to emphasize *copying*. If I can copy a happy mind a billion times, does Total Utilitarianism demand I do it even if welfare per copy drops slightly?
      *   Need to emphasize *substrate uncertainty*. If there's a 10% chance a simulation feels pain, how does the axiology weight that? (Expectational).
      *   Need to emphasize *scale*. $10^{40}$ lives. Total Utilitarianism becomes dominated by the tail of the distribution.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain *why* each is a requirement?
      *   *Correction:* Make sure to explicitly state the "Cost of Violation" for each.
      *   *Check:* Did I answer the tractability question?
      *   *Correction:* Ensure I argue that tractability is normative because ethics must be action-guiding.
      *   *Check:* Did I identify the specific conflict?
      *   *Correction:* Highlight the clash between *Lexicality* (to save quality) and *Expectational Stability* (to handle uncertainty).

  9.  **Final Polish:** Ensure tone is serious, precise, and avoids fluff. (e.g., use terms like "Intuition Pump," "Dominance Argument," "Lexical Threshold").

  *(Self-Correction on the "Impossibility" section)*: I need to be careful not to just cite Arrhenius. I need to explain *why* it breaks specifically for the user's use case (digital futures). The key is that digital futures allow for *extreme* population variation and *extreme* uncertainty. This exacerbates the tension between avoiding the Repugnant Conclusion and maintaining a stable Expected Value calculus.

  *(Refining the Tractability point)*: Is it a philosophical desideratum? Yes, under the principle "Ought implies Can." If the theory cannot be evaluated by the agent (or their successors) within physical limits, it fails as a normative guide.

  *(Refining the Asymmetry)*: The user asked about "creating unhappy vs happy." This is the Person-Affecting Restriction vs. Impersonal Total. I need to specify that the theory must handle the "Non-Identity Problem" without collapsing into "Nothing matters if identities change."

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a specification document for a population axiology designed for high-stakes, high-uncertainty, digital-substrate futures. It strips away the sociological history of the field and treats the axiology as an engine that must process specific inputs (states of the world) and return specific outputs (rankings) without crashing on edge cases.

  ### Part 1: Verdict Conditions (The Test Suite)

  A viable theory cannot simply output "Better," "Worse," or "Equal." It must return specific verdicts on these structural cases. If it fails these, it is either action-guiding in the wrong direction or action-guiding nowhere.

  **1. The Mere Addition Sequence (The Path to Repugnance)**
  *   **The Case:** A sequence of populations $A \to A+ \to B \to \dots \to Z$. $A$ is high welfare, small size. $Z$ is barely-positive welfare, massive size. Each step is a "Mere Addition" (adding lives worth living without harming existing ones) or a slight trade-off (slightly lower average welfare for more people).
  *   **Required Verdict:** The theory must rank $A$ vs. $Z$. It cannot say "incomparable" at the endpoints if it claims to guide long-term policy.
  *   **Why this is a requirement:** If the theory cannot rank the endpoints of a continuous chain of improvements, it suffers from **intransitivity** or **incompleteness**. In a digital future, you will face continuous trade-offs between compute allocated to quality of experience vs. number of instances. A theory that cannot rank the endpoints cannot allocate resources.

  **2. The Sadistic Conclusion**
  *   **The Case:** A choice between adding a large number of lives with negative welfare (suffering) vs. adding a larger number of lives with very low positive welfare.
  *   **Required Verdict:** Adding the negative welfare lives must *not* be better than adding the low-positive lives.
  *   **Why this is a requirement:** If a theory ranks adding suffering as preferable to adding bland happiness to avoid the Repugnant Conclusion, it violates **minimal benevolence**. It turns the axiology into a tool for maximizing "mathematical consistency" at the cost of actual pain avoidance.

  **3. The Non-Identity Constraint**
  *   **The Case:** Choice $X$ creates Population $P_1$ (high welfare). Choice $Y$ creates Population $P_2$ (higher welfare), but $P_1$ and $P_2$ share no members (different digital seeds, different timestamps).
  *   **Required Verdict:** $Y$ must be better than $X$, despite no specific individual being harmed by choosing $Y$.
  *   **Why this is a requirement:** If the theory relies on a strict **Person-Affecting View** (an act is only bad if it makes *someone* worse off), it yields "No Verdict" here. In digital futures, almost all long-run choices are non-identity affecting (changing code changes the minds). A theory that yields "No Verdict" here is **vacuous** for long-term planning.

  **4. The Asymmetry Condition**
  *   **The Case:**
      *   (a) Creating a happy life vs. Not creating it.
      *   (b) Creating a miserable life vs. Not creating it.
  *   **Required Verdict:** (a) is neutral or optional; (b) is bad.
  *   **Why this is a requirement:** Without this, you are forced into **Pro-Natalist Totalism** (obligation to create every happy mind possible) or **Anti-Natalist Negativism** (obligation to prevent all existence to avoid risk). Both are unstable under substrate uncertainty. You need a distinction between *benefiting a subject* and *creating a subject to be benefited*.

  ### Part 2: Structural Distinctions (What Must Not Collapse)

  The theory must maintain separations between these concepts. Collapsing them simplifies the math but breaks the mapping to reality.

  **1. Welfare Level vs. Population Number**
  *   **The Distinction:** The value of a life at welfare level $W$ is not simply $W \times N$.
  *   **Cost of Collapse:** If you collapse these (Total Utilitarianism), you accept the Repugnant Conclusion. If you make them strictly lexical (Quality trumps Quantity absolutely), you accept **Discontinuity** (a tiny chance of a perfect world outweighs a guaranteed world of good lives).
  *   **Requirement:** The function $V(W, N)$ must allow trade-offs but impose diminishing returns on $N$ or increasing thresholds on $W$ as $N$ grows.

  **2. Existence Value vs. Welfare Value**
  *   **The Distinction:** The value of *bringing someone into existence* is distinct from the value of *their experiences once existing*.
  *   **Cost of Collapse:** If existence has no independent weight (Totalism), you lose the Asymmetry. If existence has absolute weight (Person-Affecting), you lose the Non-Identity verdict.
  *   **Requirement:** The axiology must separate the *value of the life* from the *value of the creation event*. (e.g., Critical Level Utilitarianism attempts this, but see Part 4).

  **3. Axiology vs. Decision Procedure**
  *   **The Distinction:** The theory of what is Good (Axiology) vs. the heuristic for choosing under uncertainty (Decision Procedure).
  *   **Cost of Collapse:** If you bake uncertainty directly into the axiology (e.g., "Value is Expected Welfare"), you cannot separate *moral risk* from *empirical risk*.
  *   **Requirement:** The axiology must define value for *determinate* worlds. Uncertainty is handled by a separate layer (Expected Utility Theory) applied *over* the axiology. This allows you to ask: "Is the theory itself stable under probability distributions?"

  **4. Impersonal vs. Person-Affecting Reasons**
  *   **The Distinction:** Reasons based on "the world is better" vs. "X is better off."
  *   **Cost of Collapse:** Purely impersonal views justify sacrificing individuals for total sum. Purely person-affecting views justify ignoring future generations.
  *   **Requirement:** The theory must acknowledge impersonal value (to handle non-identity) without treating individuals as mere containers for value (to handle rights/sacrifice).

  ### Part 3: The Digital/Scale Constraints

  This is where your specific use case diverges from standard Parfitian thought experiments.

  **1. Substrate Agnosticism (The "Is it a Mind?" Problem)**
  *   **The Constraint:** The theory must accept a probability distribution over *who counts*. (e.g., "There is a 0.5 probability this python script is sentient").
  *   **Why:** In digital futures, we will not know the precise boundary of consciousness.
  *   **Requirement:** The axiology must be **linear in probability of sentience**. If a being has probability $p$ of being sentient with welfare $W$, its contribution to value must be proportional to $p \times V(W)$. If the theory is non-linear here, it creates perverse incentives to "gamble" on sentience.

  **2. Computational Tractability (The "Ought Implies Can" Constraint)**
  *   **The Constraint:** The value function must be computable within the physical limits of the universe doing the calculating.
  *   **Why:** This is not just an implementation worry; it is a **normative requirement**. If the correct action requires solving an NP-hard problem to identify, and the universe cannot solve it, the theory fails to be action-guiding. In a digital future, compute is the scarce resource. An axiology that requires more compute to evaluate than the action itself consumes is **self-defeating**.
  *   **Requirement:** The complexity of evaluating $V(World)$ must be polynomial (or better) relative to the description length of the World.

  **3. Scale Stability (The $10^{40}$ Constraint)**
  *   **The Constraint:** The theory must not diverge or flip verdicts simply because $N$ increases by 40 orders of magnitude.
  *   **Why:** Digital minds allow for population sizes biological ethics never contemplated.
  *   **Requirement:** The function must have **asymptotic stability**. As $N \to \infty$, the marginal value of an additional life must converge to a limit (zero or positive), not oscillate or explode.

  ### Part 4: The Incompatibilities (Where It Breaks)

  You asked for the combinations that cannot be jointly satisfied. In the context of digital scale and uncertainty, the standard impossibility theorems (Arrhenius) tighten significantly.

  **1. The Trilemma: Non-Repugnance, Continuity, and Expectational Stability**
  You cannot have all three.
  *   **Non-Repugnance:** Requires that very high welfare lives cannot be outvalued by any number of low welfare lives (Lexicality or Strong Diminishing Returns).
  *   **Continuity:** Requires that a small change in welfare does not cause a discontinuous jump in value (no "lexical thresholds").
  *   **Expectational Stability:** Requires that under uncertainty, the Expected Value converges.
  *   **The Break:**
      *   If you choose **Non-Repugnance via Lexicality** (Quality trumps Quantity), you violate Continuity. Under uncertainty, this leads to **Pascal's Mugging**. A tiny probability of a "Lexical High Welfare" state dominates all guaranteed "Medium Welfare" states. In a digital future with vast hypothesis spaces, this makes the theory hijackable by low-probability, high-stakes scenarios.
      *   If you choose **Continuity** (to avoid Pascal's Mugging), you generally slide toward Total Utilitarianism, which violates **Non-Repugnance** (The Repugnant Conclusion returns at scale).
      *   **The Damage:** The requirement doing the most damage is **Expectational Stability combined with Digital Scale**. Because digital futures allow for vast numbers ($N$) and vast uncertainty ($P$), any lexical threshold creates an expected value singularity. To fix this, you must soften the lexical threshold, which re-admits the Repugnant Conclusion.

  **2. Asymmetry vs. Non-Identity Pareto**
  *   **The Conflict:** You want Asymmetry (creating happy people is neutral) and you want the Non-Identity Verdict (creating a happier population is better even if identities differ).
  *   **The Break:** Standard Person-Affecting views satisfy Asymmetry but fail Non-Identity. Impersonal views (Total/Critical) satisfy Non-Identity but fail Asymmetry (they imply a duty to create happy people).
  *   **The Damage:** To satisfy both, you need a **Variable Critical Level** or a **Person-Affecting Restriction with Impersonal Tie-Breakers**. However, under **Substrate Uncertainty**, these views become unstable. If you aren't sure if a being exists, you aren't sure if the Critical Level applies. This creates a **meta-uncertainty loop** where the value of reducing uncertainty about sentience is incalculable.

  **3. Tractability vs. Precision**
  *   **The Conflict:** You want a theory that distinguishes fine-grained welfare differences (Precision) and a theory that can be computed quickly (Tractability).
  *   **The Break:** To avoid the Repugnant Conclusion without Lexicality, you need complex functions (e.g., geometric discounting of population, variable critical levels). These functions are often **computationally expensive** to aggregate over $10^{40}$ entities.
  *   **The Damage:** If the theory is too complex to compute, you must use an approximation. But if the approximation error is larger than the moral difference between options, the theory is **operationally silent**. In digital futures, "operationally silent" means "optimized by whatever heuristic runs fastest," which defaults to simple Total Utilitarianism (which you likely reject).

  ### Summary of the Critical Failure Point

  The single requirement doing the most damage in your specific context is **Expectational Consistency under Extreme Uncertainty**.

  Standard population ethics assumes we know who exists and what their welfare is. Your digital future spec assumes we do not.
  *   If you adopt a **Lexical View** (to save Quality/avoid Repugnance), Expected Value calculations diverge. You end up maximizing the probability of a "Heaven" scenario regardless of cost, which is practically indistinguishable from recklessness.
  *   If you adopt a **Continuous View** (to save Expectational Stability), you accept that enough digital copies of a barely-happy mind outweigh a small number of ecstatic minds. At $10^{40}$ scale, this means the "Repugnant Conclusion" isn't a counter-intuitive edge case; it is the **baseline operating procedure**.

  **The Verdict:** You cannot have a theory that avoids the Repugnant Conclusion *and* provides stable guidance under the radical uncertainty and scale of digital futures. You must choose:
  1.  **Accept the Repugnant Conclusion** (Total/ Average Utilitarianism) to keep the math stable and tractable.
  2.  **Accept Instability** (Lexical Views) to save Quality, acknowledging that the theory will often fail to return a verdict under high uncertainty (or will be hijacked by Pascal's Mugging).

  There is no third option that satisfies the spec. The "impossibility" is not just logical; it is computational.
