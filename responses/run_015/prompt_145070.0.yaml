      *Vetting the Tests again:*
      *   Ninth-read: Tolstoy says art loses charm if insincere upon repetition. User's "foul mood" addition is practical wisdom, not Tolstoy.
      *   Naming test: Tolstoy says receiver must feel what sender felt. User's "3 readers" is a workshop adaptation.
      *   Verdict on tests: Both are user inventions based on Tolstoyian principles. I need to state this clearly.

      *Accessibility Gate:* "Does this require a password to enter?" is good. "Specificity opens doors, exclusivity locks them."
      *Time Index:* "The feeling must be alive in the words now."
