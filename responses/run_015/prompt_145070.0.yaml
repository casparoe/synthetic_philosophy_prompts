      *   *Plain Sentences First:* Explain the tests, the gates, the case results, and the breakdown.
      *   *JSON Second:* Strictly follow schema.
      *   *Tone:* Professional, direct, respecting the "no theory vocabulary" constraint for the gates themselves, but analytical in the explanation.

      *Self-Correction on Gates:* The user wants a procedure *they* run. The co-tutor needs to use it too. So the language in the JSON `question` fields must be simple.
      *Time Allocation:* 20 mins total.
      Gate 1: 5 mins (Read + Name).
      Gate 2: 5 mins (Scan for props/clichés).
      Gate 3: 5 mins (Accessibility check).
      Gate 4: 5 mins (Moral/Together check).
