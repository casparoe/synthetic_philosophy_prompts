prompt: |-
  I'm a novelist, three books out, and twice a year I mentor six writers for a low residency program — I get a 2,000 word chunk from each of them every fortnight, notes back within the week, and I share the load with a co-tutor who is a poet and has read zero theory and won't. So I have maybe twenty minutes per chunk, I can't read the whole manuscript, and whatever I come up with has to be pasteable into feedback notes without making me sound like a crank. Also the writers have started quoting Tolstoy at each other in workshop, which is my fault, so now I need something better than vibes.

  I fell down a rabbit hole with Tolstoy's What Is Art (finished 1897, published in English first because of the censors) and here is what I think I took away, tell me if I have it wrong: art is when someone calls up a feeling they once had and passes it to other people through external signs, so the mark of art is infection rather than beauty; how strongly it infects depends mostly on how sincere the maker was, i.e. whether they were actually feeling the thing; there are four usual ways of faking it — borrowing, imitation, effectfulness, diversion — with borrowing being recycled props off a fairly specific list (moonlight, doves, lions, the sea, long hair), imitation being the descriptive-realism version where a scene turns into a list of faces and weather; then the weird part, which is that very bad feelings still count as art if they infect, but good art is the stuff that carries feelings of brotherhood, or plain everyday feelings accessible to everybody, and on that basis he throws out Shakespeare and Beethoven and most of his own novels. That last bit is the part I keep arguing about.

  What I want is a procedure, not an essay. A set of gates I run in order on a chunk, where each gate has one question, a description of what counts as a yes, and a rule for what happens on a no (stop as not-art, stop as bad-art, pass through, or hand it to me because it's a values call), plus a rough minute count per gate so I can see whether this fits in twenty minutes. Constraints worth respecting:

  - I can't test sincerity by asking the writer did you feel it, they always say yes, so I need proxies. Two I invented and want you to vet rather than bless: the ninth-read test (read it aloud a ninth time in a foul mood; if it still lands it was infection, if it's flat it was effectfulness), and the naming test (three readers who don't know my intention each name the feeling in one sentence, unprompted; two naming the same feeling counts as infection, and if they name a subject instead of a feeling — it's about grief — that's report, not transmission). Tell me honestly which of those is actually in Tolstoy and which is me dressing up a mood as a test.
  - The accessibility gate worries me. My writers work in dialect, inside particular immigrant households, in a queer nightlife register, and Tolstoy's complaint about obscurity and in-group allusion reads to me like a class snobbery test if I state it straight. Give me a version of that gate that keeps whatever he was actually after without penalising work rooted in a specific world, or tell me to drop the gate and say why.
  - Sincerity needs a time index and I don't know which one he'd pick. Which moment has to be the felt one: the draft, the revision, reading it out loud to the group, or reading it in the finished book? There is a real difference for us, because half of what gets submitted is rewriting.
  - No theory vocabulary in the output. My co-tutor has to be able to run it.

  Then run it on three things, all prose fiction, all from real manuscripts including mine:

  A. My own showpiece opening, four pages, forty drafts, the most praised thing in my last book. It is allusive as hell, and now that I look at it, it uses at least three items off Tolstoy's borrowed-props list. I built it like carpentry and felt approximately nothing while writing it.
  B. Two hundred words a writer dashed off in twenty minutes during a terrible week, technically sloppy, she wanted to cut it, hasn't touched it since. It makes me cry every time and I can't tell you why.
  C. A humiliation scene — a minor character, a kid at a school — written so that the reader enjoys the cruelty. The workshop laughs out loud, it is by a distance the most effective piece of writing in that manuscript, and infecting people with contempt is exactly the case where Tolstoy's basic definition and his moral one come apart.

  I'd rather have at least one verdict I don't like, and I suspect it's A. Also: outside the three, there's a case I don't think any procedure settles, which is a passage assembled almost word for word out of the writer's dead mother's letters — it infects everybody, and nobody knows whose feeling it is or when it was felt. Put that wherever it belongs and say what the procedure should do with it.

  Finally, tell me where this whole thing breaks: which gate does most of the work, which gate misfires hardest on chapters that only exist to make the next chapter land and on ironic or mixed-feeling writing, and whether Tolstoy's theory can be turned into a grading tool at all or whether I should just be using it on my own work.

  Give me the gates and the three worked cases in plain sentences first, then one JSON object I can keep in my notes app, with this schema. Top level keys: gates, verdicts, heaviest_gate, worst_failure_mode, my_call. gates is an array, one object per gate, with keys: n (integer, the order), question (one sentence, no jargon), pass_looks_like (what evidence would count as a yes, concretely), if_no (one of the exact strings stop_not_art, stop_bad_art, pass, hand_to_human), minutes (number), kind (one of fact, values, mixed). verdicts is an array, one object per case, with keys: case (A, B or C), stopped_at (the gate number, or null if it reaches an end verdict), verdict (one of not_art, bad_art, good_art, unsettled), confidence (number between 0 and 1), reason (one sentence), flips_if (the one thing that would change the verdict). heaviest_gate is a string naming the gate number that decides most of the outcomes; worst_failure_mode is one sentence; my_call is one sentence on the thing the procedure cannot decide for me.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Novelist, mentor in a low-residency program.
      *   **Task:** Create a procedural checklist ("gates") based on Tolstoy's *What Is Art?* for evaluating student writing chunks (2,000 words, 20 mins per chunk).
      *   **Constraints:**
          *   No theory vocabulary (co-tutor is a poet, read zero theory).
          *   Must fit within 20 minutes total.
          *   Must handle specific edge cases (dialect/specific worlds, sincerity timing, borrowed props).
          *   Must vet two proposed tests (ninth-read, naming test).
          *   Must evaluate three specific cases (A, B, C) and one edge case (dead mother's letters).
          *   Must identify where the theory breaks (gates, failure modes, grading utility).
          *   **Output Format:** Plain sentences first (gates + worked cases), THEN one JSON object with a specific schema.
      *   **Tolstoy Summary Provided by User:** Art = infection of feeling via external signs. Sincerity is key. Faking methods: borrowing, imitation, effectfulness, diversion. Good art = feelings of brotherhood/universal access. Bad art = exclusive/obscure/upper-class feelings (even if infectious).
      *   **User's Specific Questions/Concerns:**
          *   Vet the "ninth-read" and "naming" tests (which are Tolstoy, which are user invention?).
          *   Adapt the "accessibility" gate to avoid class snobbery while keeping the core intent (universal connection vs. exclusivity).
          *   Determine the "time index" for sincerity (draft vs. revision vs. reading).
          *   Handle the "dead mother's letters" case (appropriated feeling?).
          *   Identify the breaking point of the theory.

  2.  **Deconstruct Tolstoy's *What Is Art?* (vs. User's Summary):**
      *   *Infection:* Yes, core concept. Art transmits feeling from artist to recipient.
      *   *Sincerity:* Yes, crucial. The artist must feel the emotion they are transmitting.
      *   *Faking:* Tolstoy lists obstacles to infection: 1. Poverty of invention (borrowing/imitation), 2. Obscurity (being too specific/elite), 3. Lack of sincerity (effectfulness/diversion).
      *   *The "Ninth-Read" Test:* Tolstoy does *not* specify a ninth read in a foul mood. He talks about art losing its power over repetition if it wasn't sincere, but the specific "ninth read/foul mood" protocol is the user's invention (or a distillation of the concept of durability).
      *   *The "Naming" Test:* Tolstoy emphasizes that the recipient must feel the *same* feeling. He doesn't specify a three-reader consensus test, but the logic aligns with his definition of infection (unity of feeling). The distinction between naming a feeling vs. a subject is a useful operationalization of "infection vs. report."
      *   *Accessibility/Class:* Tolstoy was notoriously anti-elite. He rejected Shakespeare, Beethoven, and his own earlier work because they were inaccessible to the common peasant. He wanted "universal religious consciousness" (brotherhood). The user is right to worry about this sounding like class snobbery against dialect/queer nightlife. The core principle is *inclusivity of feeling*, not *simplicity of subject*. A specific world can transmit universal feelings (grief, joy, shame). The gate needs to ask: "Does this lock people out, or let them in?"
      *   *Time Index for Sincerity:* Tolstoy focuses on the moment of creation/transmission. For a writer, the feeling must be present during the *writing* (or rewriting) to infect the text. If it's just mechanical revision without re-feeling, the infection fades.
      *   *Moral Judgment:* Tolstoy distinguishes between "art" (infection happens) and "good art" (infection of good feelings). Bad feelings (contempt) count as art but are "bad art" morally.

  3.  **Develop the Gates (Procedure):**
      *   *Goal:* 20 minutes total. 5 gates seems reasonable (4 mins each).
      *   *Gate 1: Infection (The Basic Test).* Does it move me? (User's "Naming Test" fits here).
      *   *Gate 2: Sincerity (The Fake Check).* Is it borrowed/imitated? (User's "Borrowed Props" list + "Ninth-Read" logic).
      *   *Gate 3: Accessibility (The Class Check).* Is it exclusive? (Needs reframing).
      *   *Gate 4: Moral Quality (The Tolstoy Twist).* What feeling is transmitted? (Brotherhood vs. Contempt).
      *   *Gate 5: The Human Override.* (For edge cases).

      *Refining Gates for Constraints:*
      *   *No Jargon:* No "infection," "sincerity," "aesthetic." Use "move," "feel," "fake," "lock out."
      *   *Vetting User Tests:*
          *   "Ninth-read": User invention based on Tolstoy's idea of durability. Good proxy for sincerity/effectfulness.
          *   "Naming test": User invention based on Tolstoy's definition of infection. Good proxy.
      *   *Accessibility Gate:* Instead of "can a peasant understand this," ask "Does this require special knowledge to feel the emotion, or does the emotion bridge the gap?"
      *   *Time Index:* The feeling must be present *now* in the text, regardless of when drafted. If the revision killed the feeling, it fails.
      *   *Dead Mother's Letters:* This is "appropriated feeling." Tolstoy would likely say if the writer feels the emotion *now* while arranging them, it's art. If they are just pasting, it's report. The procedure should flag this as "hand_to_human."

  4.  **Drafting the Gates (Mental Walkthrough):**
      *   *Gate 1 (Infection):* Question: "Do I feel a specific emotion after reading?" Pass: I can name the feeling. No: stop_not_art. (2 mins).
      *   *Gate 2 (Sincerity/Props):* Question: "Did the writer build this or borrow it?" Pass: No cliché props, feels lived-in. No: stop_bad_art (if borrowed/imitated). (4 mins). *Wait, Tolstoy says borrowed stuff is bad art, not not-art.* So "stop_bad_art".
      *   *Gate 3 (Accessibility):* Question: "Does this require a password to enter?" Pass: Specific details open a universal door. No: stop_bad_art (exclusive). (4 mins).
      *   *Gate 4 (Morality):* Question: "Does this bring us together or push us apart?" Pass: Brotherhood/shared humanity. No: stop_bad_art (if contempt/exclusion). *Tolstoy says it's still art, just bad.* So "stop_bad_art".
      *   *Gate 5 (Edge Cases):* Question: "Is there something here I can't explain?" Pass: Hand to human. (10 mins remaining? No, need to balance time).
      *   *Time Check:* 20 mins total.
      *   Gate 1: 5 mins (Read + Name).
      *   Gate 2: 5 mins (Scan for props/fake).
      *   Gate 3: 5 mins (Accessibility check).
      *   Gate 4: 5 mins (Moral check).
      *   Actually, let's streamline. 4 Gates + Final Verdict.

      *Revised Gates:*
      1.  **The Feeling Test (Infection):** Can three strangers name the same feeling? (5 mins).
      2.  **The Prop Check (Sincerity/Borrowing):** Are there moonlight/doves/lists of weather? (3 mins).
      3.  **The Door Test (Accessibility):** Does the specific world lock the reader out or let them in? (5 mins).
      4.  **The Together Test (Morality):** Does this make us feel closer to humans or superior to them? (5 mins).
      5.  **The Mystery Box (Edge Cases):** If it breaks the rules but works, flag it. (2 mins).

      *Wait, the prompt asks for specific schema:* `if_no` must be `stop_not_art`, `stop_bad_art`, `pass`, `hand_to_human`.
      *Tolstoy's distinction:* Not Art = No infection. Bad Art = Infection but fake/exclusive/bad feelings. Good Art = Infection + Sincere + Universal + Good Feelings.
      *So:*
      *   Gate 1 (Infection): No -> `stop_not_art`.
      *   Gate 2 (Sincerity/Borrowing): No -> `stop_bad_art`.
      *   Gate 3 (Accessibility): No -> `stop_bad_art`.
      *   Gate 4 (Morality): No -> `stop_bad_art` (or `hand_to_human` if it's complex).
      *   Let's make Gate 4 the `hand_to_human` gate for the "Dead Mother" case or complex irony.

  5.  **Addressing Specific User Questions in the Narrative Section:**
      *   *Vetting Tests:* Ninth-read is user invention (Tolstoy talks about repetition losing charm if insincere, but not the specific protocol). Naming test is user invention (Tolstoy talks about unity of feeling, not the 3-reader protocol). Both are valid operationalizations.
      *   *Accessibility:* Reframe as "Exclusivity vs. Specificity." Specificity is good (immigrant household); Exclusivity is bad (requiring elite education to get the joke).
      *   *Time Index:* The feeling must be alive in the *final text*. If revision killed it, it fails.
      *   *Dead Mother:* This is "appropriated sincerity." The writer must feel the feeling *now* while arranging the letters. If they do, it passes. If not, it's report. Procedure should flag this as `hand_to_human`.
      *   *Breaking Point:* The Morality Gate. Irony and mixed feelings break Tolstoy. He hates ambiguity. Chapters that are "bridge" chapters (functional) also fail because they aren't emotionally infectious on their own.
      *   *Grading Tool:* No. It's a diagnostic tool for the writer, not a grading rubric for the institution.

  6.  **Working the Cases:**
      *   **Case A (User's Showpiece):** Allusive, borrowed props, felt nothing.
          *   Gate 1 (Infection): Might pass (it's praised), but user says "felt approximately nothing." If the *writer* felt nothing, Tolstoy says it's fake. But does the *reader* feel? If readers praise it, they feel *something*. But if it uses borrowed props...
          *   Gate 2 (Props): Fails (3 items off list). -> `stop_bad_art`.
          *   Verdict: Bad Art (Technically proficient but insincere/borrowed).
      *   **Case B (Dash off):** Sloppy, makes mentor cry.
          *   Gate 1 (Infection): Passes (cries).
          *   Gate 2 (Props): Passes (raw, not borrowed).
          *   Gate 3 (Access): Passes (universal grief).
          *   Gate 4 (Morality): Passes (brotherhood/pity).
          *   Verdict: Good Art.
      *   **Case C (Humiliation):** Effective, makes readers laugh/contempt.
          *   Gate 1 (Infection): Passes (laughs/feels contempt).
          *   Gate 2 (Props): Passes (effective).
          *   Gate 3 (Access): Passes.
          *   Gate 4 (Morality): Fails (contempt vs brotherhood). -> `stop_bad_art`.
          *   Verdict: Bad Art (Infectious but morally corrupting per Tolstoy).
      *   **Dead Mother Case:**
          *   Gate 1: Passes (infects).
          *   Gate 2: Unclear (whose sincerity?).
          *   Action: `hand_to_human`.

  7.  **Constructing the JSON:**
      *   Ensure schema compliance.
      *   `gates`: Array of objects.
      *   `verdicts`: Array of objects (A, B, C).
      *   `heaviest_gate`: Likely Gate 1 (Infection) or Gate 4 (Morality). Tolstoy hinges on Infection, but the "Good vs Bad" hinges on Morality. The prompt asks where the procedure breaks. The Morality gate is the most contentious. But the "Infection" gate decides Art vs Not Art. Let's say Gate 1 is heaviest for definition, Gate 4 is heaviest for value. The prompt asks for *one* string. I'll choose Gate 1 because without infection, nothing else matters.
      *   `worst_failure_mode`: Irony/Functional chapters.
      *   `my_call`: The dead mother letters.

