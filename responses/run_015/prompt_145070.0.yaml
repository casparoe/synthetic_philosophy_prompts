answer: |-
  ### The Procedure and The Theory

  Here is the breakdown of your tests, the adapted gates, the verdicts on your cases, and where the system breaks.

  **On Your Tests**
  Neither the "ninth-read" nor the "naming test" is in Tolstoy. You have dressed up his moods as protocols, which is exactly what you need to make him usable. Tolstoy argues that insincere art loses its power over repetition, but he never specified a foul mood or a count of nine. He argues that art unites people in feeling, but he never specified a three-reader consensus. Keep them. They are practical proxies for his abstract claims. The naming test is particularly strong because it distinguishes between *reporting* a subject (about grief) and *transmitting* a feeling (desolation).

  **On The Accessibility Gate**
  Tolstoy's error was confusing *simplicity* with *universality*. He thought peasants couldn't understand complex syntax; you know they can understand complex feelings if the entry point is honest. Do not test for simplicity. Test for exclusivity. A scene in a queer nightclub is accessible if the feeling of loneliness or joy is clear. It is exclusive if the joke relies on knowing a specific slang term that acts as a password. The gate question should be: "Does this require a password to enter, or does the emotion bridge the gap?" Specificity opens doors; exclusivity locks them.

  **On The Time Index**
  Tolstoy would pick the moment the work is released to the public. For you, that means the final draft. It does not matter if the writer felt it during the first draft. If the revision process机械化 (mechanized) the text and killed the feeling, it is no longer sincere. The feeling must be alive in the words *now*. If the writer had to re-feel the emotion to fix the rhythm in draft forty, that counts. If they just polished the grammar without re-entering the state, it fails.

  **On The Dead Mother's Letters**
  This is the edge case Tolstoy ignores. It passes the Infection Gate (it moves people) but fails the Sincerity Gate (the writer didn't feel it; the mother did). The procedure cannot settle this. It requires a human judgment on whether the writer's *curation* of the letters constitutes a new feeling of their own. If the writer feels grief *now* while arranging them, it is art. If they are just displaying relics, it is report. Mark this as `hand_to_human`.

  **The Worked Cases**

  **Case A (Your Showpiece)**
  This fails the Prop Check. You used borrowed items (moonlight, etc.) and felt nothing while writing. Even if readers praise it, Tolstoy classifies this as "counterfeit art." It might look like art, and it might even move people slightly through habit, but it is technically bad art because it relies on recycled signs rather than lived experience.
  *Verdict:* Bad Art.

  **Case B (The Dash-Off)**
  This passes every gate. It infects (you cry), it is sincere (raw, unpolished), it is accessible (grief is universal), and it promotes brotherhood (pity/connection). The technical sloppiness does not matter to Tolstoy; clarity of feeling matters more than craft.
  *Verdict:* Good Art.

  **Case C (The Humiliation)**
  This passes Infection but fails the Morality Gate. It infects the readers with contempt and superiority. For Tolstoy, this is the definition of bad art. It unites the readers, but in a negative feeling that separates them from the subject. It is effective, but morally corrupting.
  *Verdict:* Bad Art.

  **Where It Breaks**
  The **Infection Gate** does most of the work, but the **Morality Gate** misfires hardest. Tolstoy cannot handle irony, ambiguity, or mixed feelings. He wants clear moral transmission. A chapter written solely to set up a later payoff (a bridge chapter) will fail the Infection Gate because it isn't meant to stand alone emotionally. Also, do not use this as a grading tool. It is a diagnostic for the writing, not the writer. Use it to tell them what the text *does*, not what mark they get.

  ***

