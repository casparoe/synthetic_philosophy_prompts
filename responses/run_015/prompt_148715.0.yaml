answer: |-
  # Seminar Architecture: The Lexical/Aggregative Impasse

  ## 1. The Prerequisite Dependency: The "Common Currency" Illusion
  Before you can break the standard recipe, students must implicitly accept the **Intertheoretic Comparability Assumption**. 

  Most undergrads arrive treating "Expected Moral Value" like expected monetary value. They assume Theory A (Rights) and Theory B (Utilitarianism) both output values in a shared unit (e.g., "moral points") that can be averaged. 
  *   **The Setup:** Spend the first 15 minutes solidifying *why* Maximize Expected Moral Value (MEMV) works in "normal" cases (e.g., two utilitarian theories disagreeing on the magnitude of suffering). 
  *   **The Dependency:** They must agree that MEMV requires **cardinality** (theories assign magnitudes, not just rankings) and **commensurability** (a unit of badness in Theory A is convertible to a unit of badness in Theory B). 
  *   **The Trap:** Once they accept this as the baseline for moral uncertainty, you pull the rug. The lexical theory *denies* the dependency. It claims its output is not a magnitude on a shared scale, but a **domain restriction**. You cannot see the problem until you believe the units *should* match.

  ## 2. The Carrying Example: "The Innocent Lock"
  Avoid the ticking time bomb (too empirical). Use a scenario where the causal facts are stipulated as certain, forcing a purely normative clash.

  **The Scenario:** 
  To permanently secure an AI system that will guide humanity for the next million years, you must subject one innocent person to 50 years of isolated, intense psychological suffering (no physical torture, but total autonomy destruction). 
  *   **Credence:** You are 95% confident in **Longtermist Aggregativism** (maximize expected welfare of future generations). You are 5% confident in **Kantian Lexicalism** (persons are ends-in-themselves; autonomy violations are absolute side-constraints).
  *   **Theory A (Aggregative):** The lock secures $10^{20}$ future lives at high welfare. The cost is 1 life ruined. The Expected Value is astronomically positive. Even at 95% credence, the math screams **DO IT**.
  *   **Theory B (Lexical):** The act is a category error. It is not "badness level 1,000,000"; it is **INADMISSIBLE**. The choiceworthiness is not $-\infty$ (which is a number); it is **NULL**.

  **Why this works:** It forces the "numbers get big enough" claim of aggregativism against the "never do X" claim of lexicalism. The 5% credence in the lexical theory is the wedge.

  ## 3. The Misconception Arc & Head-Offs
  Students will try to save the MEMV model in three specific waves. Address them in this order.

  ### Wave 1: The Empirical Collapse
  *   **The Misconception:** "This is just empirical uncertainty. You aren't sure the AI lock will actually work."
  *   **The Head-Off:** Stipulate causal certainty. Tell them: "For the sake of the seminar, the physics and sociology are solved. The lock *will* hold. The disagreement is not about what happens, but whether the *nature* of the act permits the calculation."
  *   **The Point:** Moral uncertainty is not risk; it is disagreement over the *metric* of evaluation.

  ### Wave 2: The Normalization Fix (The "High Weight" Error)
  *   **The Misconception:** "Just treat the Lexical constraint as a really, really high negative number. If the Utilitarian gain is higher, you override it. If not, you don't."
  *   **The Head-Off:** Ask: "If you assign a finite number to the Rights violation, have you respected the Rights theory?" 
  *   **The Point:** Lexicality means *non-tradeable*. If you normalize the scales to make them comparable (e.g., variance normalization), you have mathematically falsified the Lexical theory. You are no longer uncertain between Theory A and Theory B; you are certain that Theory B is false (because you've forced it to accept trade-offs it forbids). **You cannot compare a vector to a scalar.**

  ### Wave 3: The Credence Threshold
  *   **The Misconception:** "If I'm only 5% sure in the Lexical theory, I can ignore it. I only need to worry about it if I'm >50% sure."
  *   **The Head-Off:** "If the Lexical theory is true, it applies regardless of your confidence in it. If you commit the violation, and the Lexical theory is the true one, you have committed a moral catastrophe, not a statistical error."
  *   **The Point:** This introduces **Moral Veto** problems. If any non-zero credence in a lexical theory vetoes the action, you face **Paralysis** (since some lexical theory probably forbids almost anything). If you set a threshold, you are arbitrarily violating the lexical theory you claim to respect.

  ## 4. The End-of-Session Check: "The Impossible Equation"
  Do not ask a multiple-choice question. Do not ask for an opinion. Give them a worksheet with a single task.

  **The Task:** 
  > "Write down the Expected Choiceworthiness equation for 'The Innocent Lock' that satisfies both theories simultaneously. Define the variable $V_{violation}$ (the value of the rights violation) such that the equation holds."

  **The Pass Condition:** 
  They must write **"No Solution"** or **"Undefined"** and provide a one-sentence justification: *"Theory B does not assign a value to $V_{violation}$; it assigns a domain restriction."*

  **The Fail Condition:** 
  If they write an equation where $V_{violation}$ is a finite number (even a huge one) or $-\infty$, they have failed. If they use $-\infty$, ask: "Does $\infty \times 0.05$ outweigh $10^{20} \times 0.95$?" (Mathematically, yes, but this reduces the lexical theory to a magnitude contest, which misses the structural point). The goal is to see if they recognize that **comparison itself is the error**, not the weighting.

  ## 5. Formal Machinery to Explicitly Refuse
  **Exclude: Dynamic Choice Models (Myopic vs. Sophisticated Choice).**

  *   **Why:** Students will ask, "What if I make a rule now to prevent myself from doing this later?" or "Does this change if I face this choice repeatedly?"
  *   **The Refusal:** Tell them: "Dynamic choice problems assume you can compare your future selves' utilities over time. Our problem today is that we cannot compare the *theories* at a single time point $t_0$. Adding time sequences adds complexity but does not solve the incommensurability of the units."
  *   **The Reasoning:** Introducing myopia/sophistication implies the problem is about *consistency over time*. It is not. The problem is about *structure at an instant*. If the units don't match now, they won't match in a sequence. Keep the focus on the static impossibility of the intertheoretic exchange rate.
