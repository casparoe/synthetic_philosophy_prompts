prompt: |-
  I'm running a seminar for sharp undergrads on moral uncertainty, but I want to skip the tired coffee-vs-charity examples. I want to build the session around the specific problem of intertheoretic comparison when one live theory is lexical (absolute side-constraints) and the other is fully aggregative (longtermist expected-value reasoning). The students will arrive thinking uncertainty just means "I'm unsure, so split teh difference." Plan the teaching arc: what dependency has to be in place before they can even see why lexical/aggregative disagreement breaks the standard maximize-expected-moral-value recipe; pick one carrying example where one theory says "never do X no matter the scale" and the other says "do X if the numbers get big enough"; map out the misconceptions in the order they'll hit them — probably that this collapses to empirical uncertainty, or that lexical rules are just very high weights — and exactly where to head each off; give me one end-of-session check that proves they got the structural problem not just teh two theories; and tell me what formal machinery (maybe myopic vs sophisticated choice) to openly refuse to explain. No bibliography, just the architecture.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Sharp undergraduates (philosophy/ethics/econ background likely).
      *   **Topic:** Moral Uncertainty, specifically Intertheoretic Comparison (ITC) between Lexical (deontological/constraint-based) and Aggregative (consequentialist/longtermist) theories.
      *   **Constraint 1:** No "coffee vs. charity" examples (too basic).
      *   **Constraint 2:** Focus on the structural breakdown of "maximize expected moral value" (MEMV) when theories are incommensurable in scale.
      *   **Constraint 3:** Specific teaching arc (prerequisites -> example -> misconceptions -> check).
      *   **Constraint 4:** Identify what formal machinery to *exclude* (e.g., myopic vs. sophisticated choice).
      *   **Constraint 5:** No bibliography, just architecture.

  2.  **Deconstruct the Core Problem:**
      *   Standard Moral Uncertainty (MEMV): Assign credence $C(T_i)$ to theory $T_i$. Calculate expected choiceworthiness $E(CW) = \sum C(T_i) \times CW_i(Action)$. Choose max $E(CW)$.
      *   The Glitch: Lexical theories (e.g., Kantianism, Rights-based) often say $CW(Forbidden) = -\infty$ or simply "Inadmissible." Aggregative theories (e.g., Utilitarianism) say $CW(Forbidden) = \text{Finite Negative}$, but $CW(Allowed) = \text{Huge Positive}$.
      *   The Comparison Issue: How do you compare $-\infty$ (or "absolute veto") with a finite number? If the lexical theory has even 1% credence, does it veto everything? If we normalize scales, do we violate the lexical theory's core claim (that the constraint *cannot* be traded off)?

  3.  **Drafting the Teaching Arc:**

      *   **Phase 1: The Setup (The "Naive" MEMV).**
          *   Need to establish *why* they think splitting the difference works.
          *   Prerequisite: Understanding that moral uncertainty isn't just empirical uncertainty.
          *   *Dependency:* They need to grasp that moral theories output *numbers* (or rankings) that are supposed to be comparable across theories. If Theory A says "Goodness = 10" and Theory B says "Goodness = 100," can we average them? Only if the units match.

      *   **Phase 2: The Carrying Example.**
          *   Needs high stakes to make the aggregative view tempting, but clear violation for the lexical view.
          *   *Idea:* Torture vs. Existential Risk.
          *   *Scenario:* "The Ticking Cosmic Bomb."
          *   *Theory A (Rights/Lexical):* Never torture an innocent. Absolute constraint.
          *   *Theory B (Longtermist Utilitarianism):* Maximize expected lives saved. If torturing one saves $10^{50}$ future beings, do it.
          *   *Credence:* 90% Util, 10% Rights.
          *   *Conflict:* MEMV says torture (huge gain $\times$ 0.9 outweighs huge loss $\times$ 0.1?). Rights says "No."

      *   **Phase 3: Misconceptions & Head-offs.**
          *   *Misconception 1:* "It's just empirical uncertainty." (i.e., I'm not sure if torture actually saves lives). *Head-off:* Stipulate the causal facts are known. The disagreement is normative.
          *   *Misconception 2:* "Lexical just means 'Really High Weight'." *Head-off:* If it's just a high weight, it's tradeable. Lexical means *no* trade-off. If you normalize the scale to make them comparable, you've falsified the Lexical theory.
          *   *Misconception 3:* "Just use Probabilistic Dominance." *Head-off:* What if the Utilitarian gain is *infinite* (or sufficiently large) relative to the Rights violation?

      *   **Phase 4: The Structural Check.**
          *   Need a question that forces them to admit the math breaks, not just the intuition.
          *   *Idea:* Ask them to construct the normalization function. If they can't do it without violating one theory's definition, they get it.

      *   **Phase 5: What to Exclude.**
          *   The prompt suggests "myopic vs. sophisticated choice."
          *   Better exclusion: *Formal Voting Theory analogies* (e.g., Borda counts in moral uncertainty) or *Metanormative Realism*. Keep it focused on the ITC (Intertheoretic Comparison) problem, not the meta-ethics of whether moral truth exists. Also, avoid deep dive into *specific* normalization techniques (variance, range) because they all fail here. Let's stick to the prompt's suggestion: **Myopic vs. Sophisticated Choice**. It's a dynamic choice problem that distracts from the static comparison problem.

  4.  **Refining the Architecture (Iterative Polish):**

      *   *Prerequisite:* The "Common Unit" Assumption. Students must realize MEMV requires a common currency of "choiceworthiness."
      *   *Example:* "The Innocent Organ Harvest." Classic, visceral. One healthy person killed to save 5 (or 5 billion).
          *   T1 (Kantian): Forbidden. $CW = -\infty$ or Veto.
          *   T2 (Utilitarian): Required if $N$ is high enough. $CW = +N$.
      *   *Misconception Order:*
          1.  Empirical uncertainty (Is the math right?).
          2.  Scaling/Normalization (Just make the units match).
          3.  Credence Thresholds (If I'm <5% sure in Kant, I can ignore him).
      *   *The Check:* A "Normalization Trap." Ask them to assign a numerical value to the Rights violation that allows the Utilitarian gain to outweigh it. If they assign a number, they've abandoned the Lexical theory.
      *   *Exclusion:* Dynamic choice sequences (Myopic/Sophisticated). This is about a single decision node where the scales don't balance.

  5.  **Final Review against Constraints:**
      *   Sharp undergrads? Yes, tone should be rigorous.
      *   No coffee/charity? Yes, using Organ Harvest/Cosmic Risk.
      *   Dependency identified? Yes (Common Unit Assumption).
      *   Example selected? Yes (The "One vs. Infinity" Case).
      *   Misconceptions mapped? Yes (Empirical, Scaling, Threshold).
      *   End-of-session check? Yes (The Normalization Trap).
      *   Formal machinery refused? Yes (Dynamic Choice/Myopia).

  6.  **Writing the Output:** (Drafting the response following the thought process). *Self-Correction during drafting:* Make sure to emphasize *why* normalization fails. It's not just hard; it's conceptually impossible without distorting one theory. The Lexical theory denies the *possibility* of comparison, not just the *difficulty*.

      *   *Refining the Check:* Make it a specific task. "Write down the equation." If they write an equation, they failed.
      *   *Refining the Exclusion:* Be explicit about *why* we are excluding it (it solves a different problem).

  7.  **Final Polish:** Ensure clear headings and logical flow. (Proceed to generate output).

  *(Self-Correction on the "Dependency"):* The prompt asks "what dependency has to be in place before they can even see why... breaks the standard recipe."
  The dependency is **Cardinality + Intertheoretic Comparability**. They need to think moral theories output cardinal numbers *and* that a "util" in Theory A is comparable to a "util" in Theory B. If they think theories only give rankings (ordinal), MEMV is already dead. So the prerequisite is believing MEMV *works* in normal cases.

  *(Self-Correction on the Example):* "Innocent Organ Harvest" is a bit cliché. Let's go with **"The Preventive Detention Case."** Detain an innocent person without trial to prevent a terrorist attack.
  *   Lexical (Rights): Violates due process/liberty. Absolutely forbidden.
  *   Aggregative (Longtermism): Prevents death of millions. Massive EV gain.
  *   Why better? It feels more "policy" relevant for undergrads thinking about governance, less "trolley problem"-y. Actually, let's stick closer to the prompt's "scale" hint. **"The Single Sacrifice for Existential Security."** One person subjected to extreme suffering to secure a lock on an AI that saves humanity.
  *   T1 (Lexical): Torture is intrinsically wrong.
  *   T2 (Aggregative): $8 \times 10^{10}$ lives saved.
  *   This highlights the "numbers get big enough" aspect well.

  *(Final Plan Confirmation)*
  1.  **Prerequisite:** The "Common Currency" Illusion.
  2.  **Example:** The "Infinite Stake" Scenario.
  3.  **Misconceptions:** Empirical -> Scaling -> Credence Threshold.
  4.  **Check:** The "Impossible Equation."
  5.  **Exclusion:** Dynamic Choice (Myopic/Sophisticated).

