  ### 1. Which Rule Is She Running?

  She is running a refined version of your **Rule 3**, but with a specific counterfactual test attached to it. Let's call it the **"Independent Lethality" Rule**.

  *   **The Rule:** A non-human thing counts as a "historical actor" only if it possesses the causal power to produce the specific disruption *independently* of the human system in place. If the disaster requires a specific human arrangement to become lethal, the non-human thing is demoted to "background," and the human arrangement is promoted to "actor."
  *   **Why Rule 1 (Abruptness) fails:** The Dust Bowl drought was abrupt and dateable (early 1930s), yet she classified it as background.
  *   **Why Rule 2 (Determinism) is close but imprecise:** Rule 2 suggests "no matter what people did." But in the Ireland case, she admits policy determined the *famine*, yet the Blight remains an *actor*. Why? Because the Blight killed the *potatoes* regardless of policy. The Drought, however, did not create the *Dust Bowl* without the wheat economy.
  *   **Why Rule 3 (Mediation) is the winner:** This explains the Dust Bowl vs. Blight distinction.
      *   **Blight:** Would have killed potatoes even with good policy. (Independent Lethality $\rightarrow$ Actor).
      *   **Drought:** Would not have created a "Dust Bowl" without plowing. (Dependent Lethality $\rightarrow$ Background).
      *   **Malaria/LIA:** People adapted; the environment didn't force a change. (Integrated Condition $\rightarrow$ Background).

  ### 2. What Do the Three Rules Say About Your Delta?

  Here is how each rule processes your river delta case (40-year creep, colonial dams, single-season kill):

  *   **Rule 1 (Abruptness): ACTOR.**
      *   *Logic:* The crop death happened in a "single season." Like Tambora or the Blight, there is a clear "before" and "after" date. The 40-year creep is just the lead-up; the event is the kill.
  *   **Rule 2 (Determinism): ACTOR.**
      *   *Logic:* Saltwater kills rice. Biologically/chemically, once the salinity hits a certain threshold, the crop dies. No human policy could have saved that specific rice once the salt was there.
  *   **Rule 3 (Independent Lethality): BACKGROUND.**
      *   *Logic:* This is the supervisor's likely verdict. The saltwater creep was "made much worse by upstream dams." Without the colonial dams reducing freshwater flow, the salt creep might have remained manageable (like the Roman Campagna malaria). The *lethality* is contingent on the colonial infrastructure. Therefore, the **Colonial Water Regime** is the Actor; the **Salt** is the Background mechanism (just as the Drought was the background mechanism for the Wheat Economy).

  **Prediction:** She will likely classify the Salt as **Background**. She wants you to argue that the *Colonial Dams* are the historical actor, and the salt is merely the tool they unwittingly wielded.

  ### 3. The Single Further Case to Tell Them Apart

  To confirm this before you write your paper, you need a case where **Abruptness and Determinism say "Actor"** but **Independent Lethality says "Background."**

  I recommend proposing this hypothetical case to her (or testing it against her logic):

  > **The Deforestation Landslide:**
  > "A mining company strips all vegetation from a steep hillside to access ore. Two years later, after a week of heavy seasonal rain, the hillside collapses, burying the worker camp below. The rain was not record-breaking, but the slope was now unstable."

  **How the rules diverge on this case:**

  *   **Rule 1 (Abruptness) says ACTOR:** The landslide is sudden, violent, and dateable. It is a discrete event, not a slow process.
  *   **Rule 2 (Determinism) says ACTOR:** Once the slope failed, gravity forced the outcome. No human action could have stopped the mud once it moved.
  *   **Rule 3 (Independent Lethality) says BACKGROUND:** The rain was "seasonal" (not exceptional). The landslide only happened because humans stripped the vegetation. The **Mining Company** is the Actor; the **Landslide** is the Background condition (the physical mechanism).

  **Why this breaks the tie:**
  If she says the Landslide is an **Actor**, she is prioritizing physical force and suddenness (Rule 1/2). If she says the Landslide is **Background** (and the Mining is the Actor), she is confirming the **Independent Lethality** rule (Rule 3).

  Given her verdict on the Dust Bowl ("the wheat economy is [the actor]"), she will almost certainly say the Landslide is **Background**. This confirms that for your Delta case, you should frame the **Salt** as the background condition and the **Colonial Dams** as the true historical actor.

  ### Summary for Your Paper
  Don't fight the classification. If you write "The Salt was an Actor," you are arguing for Environmental Determinism. If you write "The Salt was Background," you are arguing for Political Ecology. Her verdicts show she wants the latter.

  **Your thesis should look like this:** "While the saltwater intrusion appears to be the immediate cause of the migration, it functions as a background condition; the true historical actor was the colonial damming regime which transformed a manageable ecological gradient into a lethal barrier."
