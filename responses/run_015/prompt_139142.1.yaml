      *(Self-Correction during drafting)*: I initially thought about explaining the "orphan performative" term. But the prompt says "half the room... never read a word of what she wrote." Using the specific term might alienate them. Better to describe the *feeling* of the term without necessarily branding it, or introduce it gently as "a phrase she loved." Let's use the phrase but explain it immediately in human terms.

      *(Refining the Ending)*: The ending needs to be an invitation, not a period. It needs to invite the audience to respond (even if silently).

  10. **Final Review of the Output:**
