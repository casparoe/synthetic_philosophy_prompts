prompt: |-
  My old supervisor died in March and I have to give the memorial talk at the department gathering — about six minutes, spoken, half the room her colleagues and ex-students, half her sisters and kids and neighbours who never read a word of what she wrote.

  Her thing, which she went on about for thirty years, was that the standard picture puts uptake in the wrong place: not a felicity condition hanging outside the act but half of it. On her view a promise, a bet, an apology, even a thank-you, is co-authored — the person it's addressed to has to answer, and their answer is partly what makes it the act it is. She had a name for the ones that don't get an answer: utterances like a promise made to someone who can't hear it anymore. She called them orphan performatives — perfectly formed, apparently doing something, and in fact unfinished.

  So I'm stuck, and not just rhetorically. Her old students will hear every "we'll finish your book" and "the seminar will go on" as me standing up in her memory and producing precisely the half-an-act she spent her career saying wasn't one. Her sisters, reasonably, need what I say to actually do something, not just describe somebody impressive. I think what's left is that the living can still answer each other, so whatever gets done has to get done sideways, among us, and the part aimed at her has to stay openly unfinished rather than dressed up as complete — but I'm not sure that's right, or that it's enough for the people in the room who aren't philosophers. Write it, and tell me if you think I've got the shape wrong. Don't have me promise her anything, and don't turn it into a tour of speech act theory.
reasoning: |-
  Here's a thinking process that leads to the suggested memorial talk:

  1.  **Analyze the Request:**
      *   **Speaker:** A former student of the deceased supervisor.
      *   **Audience:** Mixed. 50% academics (colleagues, ex-students) who know her work. 50% family/neighbors (sisters, kids, neighbors) who don't know the theory but need emotional resonance.
      *   **Time:** About 6 minutes spoken (roughly 750-900 words at a normal pace).
      *   **Subject:** The supervisor's core philosophical idea: *Uptake* is internal to the speech act, not external. Acts like promises/apologies are co-authored. Without an answer/uptake, they are "orphan performatives" (unfinished).
      *   **The Dilemma:** The speaker wants to avoid making "orphan performatives" themselves (e.g., saying "we'll finish your book" to someone who can't hear it). The speaker wants to acknowledge the unfinished nature of the loss while still providing comfort/closure to the family.
      *   **Constraints:** Do *not* promise her anything. Do *not* turn it into a lecture on speech act theory.
      *   **Task:** Write the talk and provide feedback on whether the user's conceptual shape is right.

  2.  **Deconstruct the Philosophical Core (for the speech):**
      *   *Concept:* Speech acts need two people. I speak, you respond. That response completes the act.
      *   *Application to Death:* Death stops the response. Therefore, speaking *to* the dead is technically an "orphan performative."
      *   *The Trap:* If I stand up and say "We honor you," but she can't hear/answer, am I proving her right in the worst way? Am I highlighting the silence?
      *   *The Solution:* Shift the address. Don't speak *to* her (the orphan act). Speak *about* her to the living, inviting *them* to answer. Make the uptake come from the room, not the grave. The "co-authoring" happens among the mourners.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty. Connect the personal loss to the professional passion without jargon.
      *   **The Theory (Simplified):** Explain "uptake" and "co-authoring" using everyday examples (promises, thank-yous) rather than academic terms. Make it relatable to the sisters/neighbors.
      *   **The Conflict:** Address the "orphan performative." Acknowledge the silence. Don't pretend she's listening.
      *   **The Turn/Resolution:** Shift the focus to the living. We answer *each other* now. Her work lives in how we treat each other.
      *   **Closing:** A gesture of completion that doesn't claim false finality.

      *   *Tone:* Warm, intellectual but accessible, honest, slightly vulnerable.
      *   *Word Count Check:* 6 minutes is roughly 800-900 words. I need to keep it tight.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hi everyone. She loved talking about how we talk.
      *   She said a promise isn't real until someone accepts it.
      *   She called things without answers "orphan performatives."
      *   Today is hard because she can't answer.
      *   But we are here. We can answer each other.
      *   Her legacy is how we listen.
      *   Thank you.

      *Critique 1:* Too dry. Needs more emotion for the family. Needs to explicitly avoid the "I promise to finish your work" trap.

  5.  **Drafting - Iteration 2 (Focusing on the "Shape"):**
      *   Start with the room. Half know the theory, half know the person.
      *   Explain the theory as "connection."
      *   Address the elephant in the room: She taught that silence breaks the act.
      *   So I won't talk to her. I'll talk to you.
      *   To the family: She loved you. To the students: She loved us.
      *   We complete the circle by being here together.

  6.  **Refining the Content (incorporating the "Orphan" concept delicately):**
      *   I need to make sure the family understands *why* I'm not saying "Rest in Peace" or "We'll make you proud."
      *   Actually, I can say those things, but I need to frame them as acts *for us*, not for her.
      *   Better: Frame the memorial itself as an act of uptake. We are answering her life by being here.

  7.  **Writing the Speech (incorporating constraints):**
      *   *Avoid:* "I promise to publish your papers."
      *   *Avoid:* "Uptake," "Felicity Condition," "Illocutionary Act." Use "Answer," "Completion," "Conversation."
      *   *Focus:* The room is the mechanism of completion.

  8.  **Feedback Section:**
      *   The user asked: "Tell me if you think I've got the shape wrong."
      *   My assessment: The shape is actually brilliant. It turns the philosophical constraint into the rhetorical solution. The risk is alienating the family with abstraction. The speech must bridge that.
      *   I need to validate their intuition: Yes, speaking *to* her is the orphan act. Speaking *with* the room is the completed act.

  9.  **Final Polish (Reviewing against constraints):**
