  ***

  ### Designer's Note on Structure and Confidence

  **Confidence Level:** High. The tree successfully isolates the three required distinctions (Authority, Empirical Premise, Purpose) while mapping the four required cases (AVF, Universal/Civilian, Militia, Lottery) to distinct leaves without forcing prose explanations into the nodes.

  **Least Sure Node:** **Q3 (Maximize Power vs. Bear Costs).**
  *   **Reasoning:** It is philosophically difficult to separate "Statist Mobilization" from "Necessity-Based Conscription" in practice. A proponent of state power might argue that conscription is *always* necessary for optimal power, thereby answering "YES" to Q2 and landing in Leaf 2, even though their underlying motive aligns with Leaf 3.
  *   **What would settle it:** A clear stipulation on whether the position values conscription *instrumentally* (only as a tool for defense) or *constitutively* (as an expression of state sovereignty regardless of immediate defense needs).

  **Indistinguishable Pair:** **Necessity-Based Conscription (Leaf 2) and Statist Mobilization (Leaf 3).**
  *   **Reasoning:** If the empirical premise holds (i.e., volunteers *cannot* defend as well), both positions mandate conscription. The tree separates them by what happens if the premise *fails*, but in a real-world scenario where the premise holds, their policy prescriptions are identical.
