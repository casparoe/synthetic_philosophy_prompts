  # Q&A PREP SHEET: Climate-Economy Modelling Seminar
  **Speaker:** 4th-Year Philosophy PhD | **Audience:** IAM Modellers, Statistician, Philosophers | **Time:** 20m Q&A

  ## STRATEGIC ANCHORS
  **The One Concession (First 2 Minutes):**
  *"I am not arguing we should stop using these models for policy. I agree that decisions must be made under uncertainty and that these models are the best tools we currently have."*
  **Why:** Disarms the Senior Modeller's "ivory tower" reflex and prevents the "what's the alternative?" trap from derailing the talk immediately. Do **not** follow this with "but they are wrong." Follow with "but we must be clear about what they cannot tell us."

  **The Reply That Must Land:**
  *The Regime Distinction.* You must successfully argue that Friedman's defense (prediction validates assumptions) holds only for **interpolation** (within tested data) and fails for **extrapolation** (policy counterfactuals). If the audience accepts that F-twist covers extrapolation, your argument collapses.

  ---

  ## THE 7 LIKELY OBJECTIONS
  *Ordered by likelihood and potential damage.*

  ### 1. The "Utility Trumps Truth" Objection (Senior Modeller)
  **Phrasing:** "Look, we know the assumptions are unrealistic. We've said that for thirty years. 'All models are false.' But policymakers need a number for the Social Cost of Carbon next quarter. If the model produces decision-relevant output that survives peer review, isn't that sufficient? Why does the *reason* for the success matter if the success is there?"
  **Your Reply (2 mins):** "Utility is sufficient for *using* the model, but Friedman's F-twist is a claim about *scientific warrant*. If you use a model outside its tested regime (e.g., +4°C warming), past predictive success doesn't warrant the new output. My point isn't to ban the model, but to stop using the F-twist to claim the output is 'tested' or 'validated' when it's actually a placeholder. We can use the number, but we must label it as expert judgment, not empirical prediction."
  **Soft Spot:** You aren't giving them a better number. You're asking them to downgrade their confidence.
  **Pre-emptive Concession:** "I agree the model is the best tool available for that decision."

  ### 2. The "Out-of-Sample" Objection (Statistician)
  **Phrasing:** "You're describing a failure of validation. But we do run out-of-sample tests on historical data, and we use ensemble methods to capture structural uncertainty. If a damage function performs well on cross-validation within the 20th century, doesn't that provide some probabilistic warrant for extrapolation, even if imperfect?"
  **Your Reply (2 mins):** "Cross-validation tests stability within the *same* data-generating process. Climate-economy extrapolation assumes the process *changes* (tipping points, structural breaks). A damage function fitted on 1950-2020 data cannot be cross-validated against 2100 conditions. My 'surrogacy requirement' is essentially a demand for structural uncertainty quantification that goes beyond statistical fitting—it asks for a mechanistic account of the distortion."
  **Soft Spot:** Statisticians know all extrapolation is risky; they might argue "better than nothing."
  **Pre-emptive Concession:** "Statistical validation is necessary, just not sufficient, for counterfactuals."

  ### 3. The "Model Autonomy" Objection (Sympathetic Philosopher)
  **Phrasing:** "You're leaning heavily on a representational view—that models need to map to real features. But if we treat models as mediators or autonomous objects, they generate knowledge through manipulation, not mirroring. Why does a 'placeholder' fail if it successfully mediates a policy discussion?"
  **Your Reply (2 mins):** "I'm not demanding a 'mirror' of reality. I'm demanding *control*. A 'surrogate' allows you to turn a dial and see how the output changes (e.g., varying viscosity). A 'placeholder' is a black box fixed by calibration. If the model is autonomous, fine, but you can't use Friedman's defense (which relies on empirical prediction) to shield an autonomous object from empirical criticism when it claims to predict the future."
  **Soft Spot:** You are mixing normative claims (how they *should* be used) with descriptive claims (how they *are* used).
  **Pre-emptive Concession:** "Models do generate knowledge without perfect representation."

  ### 4. The "Action-Guiding" Objection (Junior Modeller/Grad Student)
  **Phrasing:** "Okay, say we accept the surrogacy requirement. For the damage function or the discount rate, we literally *cannot* relax the assumption because we have no data. Does your norm just tell us to stop? That's not action-guiding for a policy process."
  **Your Reply (2 mins):** "It tells you to stop claiming *empirical warrant* where you have none. It forces you to shift the burden of proof. Instead of saying 'the model predicts X,' you say 'if we assume Y, the model outputs X.' It distinguishes between a forecast and a scenario. That is action-guiding: it prevents policy from locking in based on false precision."
  **Soft Spot:** This is your weakest practical point (see "Weakest Links" below).
  **Pre-emptive Concession:** "I don't have a better model to offer you."

  ### 5. The "Operationalization" Objection (Statistician/Modeller)
  **Phrasing:** "You say a surrogate requires knowing 'how outputs move as the distortion is relaxed.' In high-dimensional IAMs, parameters are non-identifiable. How do you check surrogacy when you can't isolate the assumption?"
  **Your Reply (2 mins):** "You're right, full isolation is often impossible. But surrogacy is gradational. Sensitivity analysis is the tool for this. If you can't run a sensitivity analysis on a parameter because it's structurally fixed (like a functional form choice), that's a flag that it's a placeholder. I'm asking for transparency about which knobs can be turned and which are welded shut."
  **Soft Spot:** Sensitivity analysis is often done perfunctorily.
  **Pre-emptive Concession:** "Surrogacy is a matter of degree, not a binary switch."

  ### 6. The "Historical Precedent" Objection (Senior Modeller/Philosopher)
  **Phrasing:** "This distinction between controllable idealizations and black-box assumptions sounds like Cartwright's 'capacities' or Winther's 'partitioning.' Isn't this just a redescription of existing philosophy of idealization applied to a new case?"
  **Your Reply (2 mins):** "It is built on that literature. But my target isn't idealization generally; it's the specific *Friedmanite defense* of unrealistic assumptions in *extrapolative* contexts. The literature often focuses on explanation; I'm focusing on the warrant for long-term policy prediction where the F-twist is most aggressively invoked."
  **Soft Spot:** This is the "Novelty" trap. If they think it's just old wine, they won't publish/cite.
  **Pre-emptive Concession:** "I am standing on the shoulders of Cartwright and Morrison."

  ### 7. The "Damage Function" Specific Objection (Modeller)
  **Phrasing:** "You single out damage functions. But we fit those to observed variation in climate impacts. Why is that a placeholder and not a surrogate? We can relax the coefficients."
  **Your Reply (2 mins):** "Fitting coefficients is surrogate-like. But the *functional form* (e.g., quadratic vs. exponential) is usually fixed based on sparse data and then extrapolated far beyond the fit range. You can relax the coefficient, but if the form itself is a placeholder for unknown tipping points, relaxing the coefficient doesn't satisfy the surrogacy requirement."
  **Soft Spot:** They will argue they test multiple functional forms.
  **Pre-emptive Concession:** "Some work is being done on alternative forms, but it's not standard."

  ---

  ## YOUR TWO WEAKEST LINKS (Defend, Don't Hope)

  **1. The "No Data" Problem (Operationalizing Surrogacy)**
  *   **The Trap:** If surrogacy requires knowing what happens when you relax the assumption, but there is *no data* to discipline the relaxed version (e.g., 3°C warming), how is surrogacy any better than a placeholder?
  *   **Defense:** Surrogacy doesn't require *data* for the relaxed version; it requires a *mechanism* or *theory* for the distortion. We know how friction works theoretically, even if we can't measure a frictionless surface. For IAMs, if there is no theoretical account of the damage function beyond the fit, it remains a placeholder. Admit this is hard, but insist that "theoretical account" is better than "statistical fit."

  **2. The "Policy Deadline" Problem (Action-Guidance)**
  *   **The Trap:** The Senior Modeller will corner you: "We have a UN deadline. Your philosophy says 'wait for surrogacy.' We say 'use the number.' Who wins?"
  *   **Defense:** Do not say "wait." Say "label." The cost of error is asymmetric. If you use a placeholder and claim it's a prediction, you risk catastrophic policy error. If you label it as a placeholder (scenario), you allow policymakers to hedge. Your norm improves the *quality of the advice*, even if it doesn't change the *timing*.

  ---

  ## THE QUESTION YOU HOPE NOBODY ASKS
  **The Source:** The Senior Modeller (who reads philosophy).
  **The Question:** "You've drawn a line between surrogates and placeholders. But hasn't this already been made under the names 'controlled idealizations' vs. 'tractability assumptions,' or 'Galilean' vs. 'minimalist' models? If your distinction is just a redescription, what is the *new* argument here?"
  **Why it hurts:** It attacks the contribution of your thesis directly. If it's just a redescription, it's a term paper, not a dissertation chapter.
  **Prepared Reply:** "The existing literature focuses on *explanation* (how we understand phenomena). My argument is about *warrant for extrapolation* (how we justify policy numbers). The F-twist is specifically invoked to bypass the need for realistic assumptions in prediction. I am arguing that the F-twist's license expires at the boundary of the data. That specific limit on Friedman is not standard in the idealization literature, which tends to treat idealizations more generally."
  **Backup:** If they push hard, concede: "The vocabulary is adapted, but the application to the specific methodology of IAMs and the critique of Friedman's extrapolation is the novel contribution."

  ---

  ## ROOM MANAGEMENT TIPS
  *   **If the Senior Modeller interrupts:** Let them finish. They hold the room's attention. If you cut them off, you look like the arrogant philosopher.
  *   **If the Statistician gets technical:** Do not try to out-math them. Pivot to the *interpretation* of the math. "That's exactly why the identifiability issue matters for my surrogacy claim..."
  *   **If the Philosophers nod:** Don't rely on their validation. It alienates the modellers. Translate their agreement into modeller terms (e.g., "As my colleague in philosophy might put it... but in your terms, this means...").
  *   **Watch your hands:** When you say "decisions must be made," do not wave it away. Pause. Look at the Senior Modeller. Show you respect the burden they carry.
