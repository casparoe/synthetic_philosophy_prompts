answer: |-
  # Session Plan: The Unmarked Default

  **Course:** First-Year Writing & Rhetoric
  **Time:** 75 Minutes
  **Students:** 19 (Groups of 3-4)
  **Goal:** Make visible how "neutral" language encodes hierarchy through reference, defaulting, and social load without triggering immediate ideological defense.

  ---

  ## 1. Materials & Handout Text

  **Materials Needed:**
  *   Projector/Screen (for timer only).
  *   Printed Handouts (1 per student).
  *   Whiteboard & Markers.
  *   Timer (visible to class).

  **Handout Text:**

  > **Activity: The Structure of Norms**
  >
  > **Part 1: Invention (15 mins)**
  > In your group, create a fictional professional guild. Define two roles within this guild:
  > 1.  **The Standard Role (Unmarked):** This is the "default" member. When people say the guild's name, they picture this person. (e.g., "A Builder knows...")
  > 2.  **The Specialized Role (Marked):** This is a specific subset. Their title specifies their difference. (e.g., "A Decorator knows...")
  >
  > **Task:** Write a 100-word memo defending the guild's current naming convention. Argue that the **Standard Role** title is neutral and functional, while the **Specialized Role** title is necessary for clarity.
  > *   *Constraint:* Use generic phrases like "When a [Standard] walks in..." or "The average [Standard]..."
  > *   *Constraint:* Do not use real-world genders or races. Use your invented terms.
  >
  > **Part 2: The Transplant (15 mins)**
  > Swap memos with another group. Use the **Transplant Table** below to rewrite their memo. Replace their fictional terms with the Target Terms exactly as shown. Do not change the grammar or argument logic—only swap the nouns/pronouns.
  >
  > **Transplant Table**
  > | Original Axis | Target Axis | Unmarked Term (Replace with...) | Marked Term (Replace with...) | Rule |
  > | :--- | :--- | :--- | :--- | :--- |
  > | Fictional Guild | Gender | Standard Role → **Men** | Specialized Role → **Women** | Swap exact terms. Keep "he/they" consistent with new noun. |
  > | Fictional Guild | Profession | Standard Role → **Doctors** | Specialized Role → **Nurses** | Swap exact terms. Keep singular/plural consistent. |
  >
  > *Choose ONE Target Axis per memo.*
  >
  > **Part 3: Performance (20 mins)**
  > 1.  One person reads the **Original** (Fictional) memo aloud.
  > 2.  One person reads the **Transplanted** (Gender/Profession) memo aloud.
  > 3.  The listening group must guess: Which arguments sounded natural in the fictional version but deranged in the transplanted version?
  >
  > **Part 4: Analysis (25 mins)**
  > We will discuss what happened to the meaning when the words changed.

  ---

  ## 2. Timeline (75 Minutes)

  | Minutes | Participants Do | Facilitator Says |
  | :--- | :--- | :--- |
  | **00-05** | Sit in groups of 3-4. Listen. | "Today we are analyzing how professional language establishes norms. We are not debating politics; we are reverse-engineering syntax. You will build a fictional hierarchy, then we will test its structural integrity by swapping the variables." |
  | **05-20** | Draft fictional guild memo (Part 1). | "Remember: The goal is to sound reasonable. Argue why the 'Standard' title is neutral. Avoid real-world identities. I am looking for logical consistency, not moral correctness." |
  | **20-35** | Swap memos. Apply Transplant Table (Part 2). | "Do not edit the argument. If the original says 'A Builder is naturally stronger,' and you swap to 'Men,' you must write 'Men are naturally stronger.' Preserve the logic, even if it makes you uncomfortable. That discomfort is data." |
  | **35-55** | Read aloud. Guessing game (Part 3). | "Listen for the 'click.' When does the sentence stop sounding like policy and start sounding like prejudice? Note the specific phrases that trigger the shift." |
  | **55-65** | Discuss patterns. | "We are going to look at three specific jobs these words were doing. I'm not asking for your opinion on gender; I'm asking what happened to the *sentence* when we swapped the noun." |
  | **65-75** | Reveal Hofstadter. Close. | "This structure mirrors a famous 1973 satire by Douglas Hofstadter. He used this exact swap to show how arguments about 'neutral language' often rely on hidden defaults. We stop here because the mechanism is the lesson, not the conclusion." |

  ---

  ## 3. Debrief Moves (Mapping Activity to Theory)

  | Moment From Activity | Idea It Maps To | One Question To Ask |
  | :--- | :--- | :--- |
  | **Students laugh/wince reading "Men are naturally stronger"** | **Social Load:** The marked/unmarked terms carry historical baggage that the fictional terms lacked. | "When you read 'A Builder is naturally stronger,' it sounded like a job requirement. When you read 'Men are naturally stronger,' it sounded like biology. Did the grammar change, or did the weight of the word change?" |
  | **Students argue "But 'Men' can mean everyone"** | **Reference (Generic vs. Specific):** The struggle between quantificational work (all humans) vs. pointing (males). | "In the fictional version, did 'Standard Role' mean 'everyone in the guild' or 'the typical member'? When we swapped to 'Men,' did that ambiguity break the argument?" |
  | **Students visualize a specific person for "Standard"** | **Defaulting:** The unmarked form imports a picture of the typical member. | "When you wrote 'When a Builder walks in,' what image did you picture? When you read 'When a Man walks in,' did that image change? If the image changed, was the word ever truly neutral?" |

  ---

  ## 4. Failure Modes & Handling

  | What Goes Wrong | How To Handle |
  | :--- | :--- |
  | **Edgy Axis:** A group chooses a controversial real-world axis (e.g., Citizen/Illegal) instead of fictional. | "Pause. We need a control variable. If you use real-world politics, we can't isolate the linguistics. Please switch to a fictional guild (e.g., Wizards/Apprentices). The goal is mechanical isolation." |
  | **Refusal to Read:** A student refuses to read the transplanted text because it sounds sexist/bigoted. | "You do not have to read it. You can ask a partner to read it, or I can read it. The point is to observe the effect of the words, not to endorse them. Your discomfort confirms the hypothesis." |
  | **Accusation:** "So you're calling my grandfather a bigot because he says 'fireman'?" | "I am not judging your grandfather. I am judging the word 'fireman.' This activity shows how words carry history regardless of the speaker's intent. We are analyzing the tool, not the carpenter." |
  | **Clumsiness Dismissal:** "It only sounds weird because 'Women' doesn't fit the sentence structure." | "That is exactly the point. The sentence structure was built for the Unmarked term. When the Marked term fits clumsily, it reveals the structure was never neutral to begin with." |

  ---

  ## 5. What This Activity Cannot Teach

  *   **Clumsiness vs. Oppression:** The activity relies on the transplanted text sounding awkward. Students may conclude the problem is just "style" rather than "exclusion." You must explicitly separate aesthetic clumsiness from social harm in the debrief.
  *   **Mechanism Equivalence:** It suggests gender hierarchy works *exactly* like a fictional guild hierarchy. It does not. Gender carries biological, legal, and violent histories that a fictional guild does not. You must acknowledge the analogy has limits.
  *   **Intent:** It demonstrates structural bias, but students may walk away thinking "intent doesn't matter" is the whole lesson, rather than "intent doesn't fix structure."

  ---

  ## 6. Thirty-Minute Version (Low Attendance: 6 Students)

  **Adjustments:**
  *   **Groups:** 2 groups of 3.
  *   **Cut:** Remove the "Guessing Game." Remove the "Professional/Doctor" transplant option (stick to Gender only).
  *   **Flow:**
      *   **0-5:** Intro (Same script).
      *   **5-15:** Group 1 writes Fictional Memo. Group 2 prepares Transplant Table.
      *   **15-20:** Group 2 transplants Group 1's memo immediately.
      *   **20-30:** Read both versions back-to-back. Direct debrief using the "Social Load" question only.
  *   **Rationale:** With fewer students, the "performance" aspect feels too exposed. Focus on the textual comparison. The debrief must be tighter; skip the "Reference" vs "Default" distinction and focus solely on **Social Load** (why does the word feel heavier in the second version?).

