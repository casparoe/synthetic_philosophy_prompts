    "debrief_moves": [{"moment_from_activity": string, "idea_it_maps_to": string, "one_question_to_ask": string}],
    "failure_modes": [{"what_goes_wrong": string, "how_to_handle": string}],
    "cannot_teach": [string],
    "thirty_minute_version": string
  }
