prompt: |-
  Hi — I work on the data team of a small consortium that publishes a shared authority file for museum and archive catalogs: people, corporate bodies, places, works, one record per entity, everybody downstream pulls from our URIs. What actually fills our week is merge proposals — two records that might be the same person, firm, or place, and someone has to decide whether they become one record or just get linked. It's maybe 20–40 of these a week, they're triaged by rotating catalogers and two interns who have about five to ten minutes each and no research time, and anything irreversible has to be signed off by our senior editor, who is a career librarian, extremely patient, and will not read a line of philosophy. Bad merges are quietly catastrophic because other institutions have already copied the URI and we can't recall it. I also suspect part of the problem is that we currently just use owl:sameAs for every kind of connection we make.

  I did a philosophy minor years ago and halfway through a lunch argument with a colleague I dredged up Frege's puzzle about identity — the morning star/evening star sort of case, where an identity statement can be a genuine discovery and tell you something, while the trivial self-identity tells you nothing, even though both are about one and the same thing. My colleague says this has nothing whatsoever to do with our work: if two records refer to the same thing, obviously they should be one record. I think he's wrong, but I can't turn the intution into something my team could actually run, and "be careful about sense and reference" is not instructions anyone can follow. So what I want is a procedure: an ordered checklist in words that a cataloger with zero philosophy can run on a merge proposal in under ten minutes, with what counts as a sufficient answer to each question, clear STOP-with-a-no points, and clear "hand this to a human because it's a values call rather than a fact" points.

  Some things I think have to survive the translation, though please organize it however is actually right rather than following my list: identity always being identity *under a sortal* (the same person, the same legal entity, the same continuing brand, the same city, the same river — so if no single sortal covers both records, that's a relation, not a merge); a distinction between terms that rigidly tag one thing whether or not any description happens to fit (a personal name, a registry number) and flaccid role-descriptions like "the director", "the artist of this work", "the firm then trading as X", which can be true of different things at different times and probably shouldn't be merged with anything, only time- or role-indexed; and the case where an identification is true but definitely informative — a notname finally attached to a named painter, a pen name, a maiden name — where I take it the merge is fine at the level of reference but rewriting every older sentence that used the other name is not. For that last part I want an actual test my catalogers can run in their heads for when swapping one term for another is unsafe: belief reports, quotations, attributions, "the artist of", modal and temporal contexts, and cases where the source was simply mistaken or the thing referred to doesn't exist. Give me a small set of test sentences with the verdict for each, and say which verdicts are judgment calls dressed up as rules. Also tell me plainly what the procedure cannot do, and separately flag where a wrong merge fails *silently* downstream instead of loudly — that's the bit I actually lie awake about.

  Then please run it on three cases. (1) A proposal to merge a record for an anonymized fifteenth-century painter known only by a conventional nickname — say "Master of the Blue Annunciation", I'm making that up — with a record for a named artist, on the strength of one recent attribution that maybe half the field accepts. (2) A proposal to merge the record for a manufacturing company that was absorbed into a larger firm in a merger and whose name lived on afterwards as a brand: same entity or not, and if "not", what do we put there instead? (3) The one I already know you'll annoy me on: our objects database has a painting whose own historic catalog card attributes it to a famous old master, current scholarship gives it to a pupil in his workshop, and the marketing team wants it merged into the famous painter's record so it surfaces in search on the site. If the procedure says no, I need one paragraph I can paste to the marketing people explaining why, and it can't use the words "sense", "reference", or "opaque". Long answers and bullet points very welcome, and please don't assume I remember any of the terminology.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Data team member at a small consortium publishing a shared authority file (people, corporate bodies, places, works).
      *   **Problem:** High volume of merge proposals (20-40/week), limited time per decision (5-10 mins), high stakes (bad merges are catastrophic/irreversible downstream), current practice relies too heavily on `owl:sameAs` for everything.
      *   **User's Insight:** Suspects Frege's puzzle (Sense/Reference) and sortal relativity (identity *as* what?) are relevant. Colleague disagrees ("if same thing, merge"). User wants to translate philosophical nuance into a practical, non-philosophical checklist.
      *   **Requirements:**
          *   Ordered checklist (under 10 mins).
          *   Clear STOP points.
          *   Clear "escalate to senior editor" points.
          *   Must handle: Sortals (same person vs. same brand), Rigid vs. Flaccid designators (names vs. roles), Informative identity (pseudonyms/maiden names) vs. unsafe substitution.
          *   Test sentences for substitution safety.
          *   Limitations of the procedure.
          *   Silent failure modes (the user's biggest worry).
          *   Apply to three specific cases (Artist attribution, Corporate merger, Workshop attribution vs. Marketing).
          *   Tone: Practical, precise, no jargon (explain concepts simply), empathetic to the high-stakes environment.

  2.  **Deconstruct the Philosophical Concepts for a Non-Philosopher:**
      *   *Frege's Sense/Reference:* Don't use these words. Use "Label" vs. "Thing." The core issue is *substitutability*. If I swap Label A for Label B, does the meaning change for the user?
      *   *Sortal Relativity:* Identity is always "The Same *What*?" A company isn't the same *what* as a brand. A person isn't the same *what* as a role.
      *   *Rigid vs. Flaccid:* "Rigid" = sticks to the thing forever (Birth name, ID number). "Flaccid" = describes a state that can change (Director, Brand name, "The artist of").
      *   *Silent Failure:* Downstream systems cache URIs. If you merge A and B, and B was actually distinct, downstream systems now think A and B are identical forever. They can't "un-merge."

  3.  **Drafting the Procedure (The "Merge Decision Protocol"):**
      *   *Goal:* 10 minutes max.
      *   *Structure:* Triage -> Evidence Check -> Sortal Check -> Substitution Test -> Decision.
      *   *Step 1: The "Same What?" Test (Sortals).* Are they the same *kind* of thing? (Person vs. Role, Company vs. Brand). If no -> STOP (Link, don't merge).
      *   *Step 2: The Evidence Weight.* Is it consensus or debate? If debate -> ESCALATE.
      *   *Step 3: The "Swap" Test (Frege).* If we merge, can we swap the names in all old records without lying?
      *   *Step 4: The "Time/Role" Check.* Is one record a temporary state of the other? (Flaccid designators). If yes -> Link, don't merge.

  4.  **Drafting the Substitution Test (The "Sentence Check"):**
      *   Need concrete examples.
      *   *Safe:* "X was born in Y." (Biological fact).
      *   *Unsafe:* "X is known as Y." (Historical perception). "X created Z." (Attribution). "X believes Y." (Belief context).
      *   *Verdicts:* Distinguish between "Fact" (merge ok) and "Attribution/Belief" (keep separate/link).

  5.  **Addressing Silent Failures:**
      *   What happens when a merge goes wrong?
      *   Downstream caches the URI.
      *   Search results pollute (wrong works appear).
      *   Provenance breaks (history of the object becomes lies).
      *   *Crucial:* You can't undo it. You have to deprecate the whole URI, which breaks links.

  6.  **Applying to the Three Cases:**
      *   *Case 1 (Master of Blue Annunciation vs. Named Artist):* This is attribution debate. Consensus is split.
          *   *Verdict:* No merge. Link.
          *   *Reason:* Evidence isn't definitive. Sortal is "Artist Identity."
      *   *Case 2 (Company Merger/Brand):* Legal entity vs. Brand.
          *   *Verdict:* No merge.
          *   *Reason:* Different Sortals (Legal Corp vs. Trademark/Brand). Use `successor/predecessor` or `brandOf`.
      *   *Case 3 (Workshop Pupil vs. Old Master + Marketing):* The tricky one.
          *   *Verdict:* No merge.
          *   *Reason:* Attribution is a claim, not a biological fact. Marketing wants searchability, not truth.
          *   *Marketing Memo:* Needs to be firm but polite. Focus on "data integrity" and "search precision" rather than "philosophy."

  7.  **Refining the Tone and Constraints:**
      *   *Constraint:* No "sense", "reference", "opaque".
      *   *Constraint:* Explain "Sortal" simply (e.g., "The Same Kind of Thing").
      *   *Constraint:* Explain "Rigid/Flaccid" simply (e.g., "Permanent ID" vs. "Temporary Description").
      *   *Constraint:* 10-minute limit.
      *   *Constraint:* Address the "Silent Failure" anxiety.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the checklist too long?
      *   *Fix:* Keep questions binary (Yes/No).
      *   *Critique:* Did I explain *why* `owl:sameAs` is dangerous?
      *   *Fix:* Explicitly state that `sameAs` means "literally identical in every way forever."
      *   *Critique:* The marketing paragraph needs to be punchy.
      *   *Fix:* Focus on user trust. If users find a "Raphael" that isn't a Raphael, they stop trusting the search.

  9.  **Final Polish:**
      *   Ensure the distinction between *Linking* (relationship) and *Merging* (identity) is clear.
      *   Make sure the "Stop" points are visually distinct.
      *   Verify the "Silent Failure" section addresses the specific fear of URI pollution.

  **(Self-Correction Note on Case 3):** The user specifically asked for a paragraph for marketing that doesn't use forbidden words. I need to make sure I don't accidentally slip "reference" in there. I should focus on "Accuracy" and "Search Relevance."

  **(Self-Correction Note on Terminology):** The user said "don't assume I remember any of the terminology." I need to define "Sortal" and "Rigid/Flaccid" in plain English within the text, or better, replace them with operational terms like "Category Match" and "Permanent Label." I will use the operational terms in the checklist but explain the concept briefly in the intro so the user understands *why* the checklist works.

  Let's build the response.

  *   **Intro:** Acknowledge the stakes. Validate the Frege intuition without using the jargon.
  *   **The Protocol:** The 10-minute checklist.
  *   **The Substitution Test:** Concrete sentences.
  *   **Silent Failures:** Explicitly listing the risks.
  *   **Case Studies:** Applying the protocol.
  *   **Marketing Memo:** The specific paragraph requested.

  *Wait, one detail:* "owl:sameAs for every kind of connection." I need to suggest alternatives briefly (skos:relatedMatch, etc.) but keep the focus on the *decision* to merge, not the RDF implementation details, though the implementation follows the decision.

  *Refining the "Sortal" concept:* Instead of "Sortal," call it "Category Match."
  *Refining "Rigid/Flaccid":* Call it "Permanent ID" vs. "Description."

  Okay, ready to write.
answer: |-
  This is a high-stakes data governance problem disguised as a cataloging task. Your intuition is correct: your colleague is treating identity as a binary switch (Same/Different), but in cultural heritage data, identity is a *claim* that carries downstream consequences. When you assert `owl:sameAs`, you are telling every computer system downstream that "anything true of A is automatically true of B, forever." If that claim is even slightly nuanced, you break their data.

  Here is a procedure designed to fit your 10-minute window, translated into operational language that requires no philosophy degree.

  ### The 10-Minute Merge Decision Protocol

  **Goal:** Determine if two records describe the **exact same real-world entity** such that swapping their names in any sentence would never result in a lie.
  **Timebox:** 10 Minutes. If not resolved, escalate to Senior Editor.

  #### Phase 1: The Category Match (2 Minutes)
  *Identity is always "The Same [What]?" You cannot merge a Person with a Role, or a Company with a Brand.*

  1.  **Do both records belong to the exact same entity class?**
      *   (e.g., Both are "Human Persons," both are "Corporate Legal Entities," both are "Physical Places".)
      *   **NO:** **STOP.** Do not merge. Link them with a relationship property (e.g., `employedBy`, `brandOf`, `locatedIn`).
      *   **YES:** Proceed to Q2.
  2.  **Is one record a temporary state or role of the other?**
      *   (e.g., "The Director of X" vs. "John Doe"; "The Firm trading as Y" vs. "The Legal Corp Z".)
      *   **YES:** **STOP.** Do not merge. The name/role is a "flaccid" label that can detach from the entity. Link them.
      *   **NO:** Proceed to Phase 2.

  #### Phase 2: The Evidence Weight (3 Minutes)
  *Merges require consensus, not hypotheses.*

  3.  **Is the identification accepted by general scholarly consensus?**
      *   (Look for 2+ independent authoritative sources agreeing on the identity.)
      *   **NO (It is debated/proposed):** **STOP.** Escalate to Senior Editor. Do not merge on the basis of a single attribution or recent theory.
      *   **YES:** Proceed to Q4.
  4.  **Are there conflicting vital dates or locations that cannot be reconciled?**
      *   (e.g., One died in 1900, the other active in 1920. One is Paris, one is London.)
      *   **YES:** **STOP.** Do not merge. Escalate.
      *   **NO:** Proceed to Phase 3.

  #### Phase 3: The "Swap Test" (5 Minutes)
  *This is the core safety check. If you merge, you assert the names are interchangeable. Test this mentally.*

  5.  **Run the Substitution Sentences.**
      Take the primary name from Record A and the primary name from Record B. Plug them into the sentences below. If **any** sentence becomes false or misleading, you cannot merge.

      *   *Sentence 1 (Biography):* "[Name A] was born in [Year/Place]."
      *   *Sentence 2 (Attribution):* "This object was created by [Name A]."
      *   *Sentence 3 (Reputation):* "[Name A] was famous for [Style/Work]."
      *   *Sentence 4 (History):* "People in [Year] knew [Name A] as [Name B]."

      **Verdicts:**
      *   **All sentences remain true:** Safe to Merge.
      *   **Sentence 1 or 2 becomes false:** **STOP.** Do not merge. (This indicates they are likely different entities).
      *   **Sentence 3 or 4 becomes false:** **ESCALATE.** (This indicates a "Frege Case"—they are the same thing, but the *knowledge* of that identity is historical data itself. Merging erases the history of the confusion).

  ---

  ### The Substitution Test: Detailed Verdicts

  Your catalogers need to know *why* a sentence failing matters. Here is the key for Phase 3, Question 5.

  | Sentence Type | Example | If swapping names makes it FALSE... | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Biological / Legal Fact** | "X was born in 1850." <br> "X was incorporated in Delaware." | The records describe different physical/legal entities. | **Hard STOP.** Do not merge. |
  | **Attribution / Creation** | "X painted this canvas." <br> "X signed this contract." | The attribution is disputed or the agent acted in a specific capacity only. | **Hard STOP.** Link via `attributedTo` or `agentOf`. |
  | **Reputation / Fame** | "X was known as the Master of Blue." <br> "X was considered a genius." | The *world's knowledge* of the entity changed over time. Merging erases the historical reception. | **Escalate.** Usually better to Link (`identifiedAs`) than Merge. |
  | **Belief / Knowledge** | "In 1950, curators believed X was Y." | Merging makes this statement nonsensical (they can't believe X was X). | **Escalate.** This is a "Values Call." Keep separate to preserve the history of scholarship. |

  **Judgment Calls Dressed as Rules:**
  *   **Sentence 3 (Reputation):** This is the danger zone. Technically, if Person A *is* Person B, then Person A *was* famous for what Person B did. However, if you merge them, you lose the ability to say "Before 1990, we didn't know this." **Rule of Thumb:** If the "identity" is a discovery made *after* the entity's active period, do not merge. Keep the "Discovered Identity" as a link, not a merge. This preserves the provenance of the cataloging itself.

  ---

  ### What This Procedure Cannot Do

  1.  **It cannot fix bad source data.** If both records have wrong birth dates, the test might pass, and you will merge two wrong records into one bigger wrong record. (Mitigation: Rely on Phase 2, Evidence Weight).
  2.  **It cannot satisfy marketing search requirements.** Merging increases search hits but decreases accuracy. This procedure prioritizes accuracy.
  3.  **It cannot handle "Part-of" relationships.** A building that was demolished and rebuilt on the same spot is not the "same" building in this protocol, even if the address is identical.

  ### The Silent Failure Modes (Why you lie awake)

  You asked specifically about where wrong merges fail silently. This is critical for your team to understand.

  1.  **The URI Poisoning:** Once you merge A and B and publish URI-A, downstream partners harvest URI-A. If the merge is wrong, you cannot "un-merge." You have to deprecate URI-A entirely. This breaks every link every museum has already built. **Failure Mode:** Broken links across the consortium.
  2.  **The Attribution Pollutant:** If you merge "Workshop of X" with "X," then every object made by the workshop is now technically "by X." Downstream search filters for "Authentic X" will now include workshop pieces. **Failure Mode:** Scholars lose trust in your "Authentic" filter.
  3.  **The Temporal Collapse:** If you merge a Pre-1950 Company with its Post-1950 Successor, financial or legal records from 1940 get associated with the 1960 entity. **Failure Mode:** Historical research becomes impossible because the timeline is flattened.

  ---

  ### Case Studies

  Here is how the protocol runs on your three scenarios.

  #### Case 1: The "Master of the Blue Annunciation" vs. Named Artist
  *   **Phase 1 (Category):** Both are "Human Persons." (Pass)
  *   **Phase 2 (Evidence):** You noted "half the field accepts" the attribution.
      *   **Check:** Is this general scholarly consensus? **No.**
      *   **Action:** **STOP.** Escalate to Senior Editor.
  *   **Reasoning:** Merging on a 50% theory makes the authority file a participant in the debate rather than a record of the consensus. If the theory is disproven in 5 years, you cannot undo the merge.
  *   **Solution:** Keep separate. Link the "Master" record to the "Named Artist" with a property like `possiblyIdentifiedWith` or `scholarlyDispute`.

  #### Case 2: The Absorbed Manufacturing Company vs. The Brand
  *   **Phase 1 (Category):**
      *   Record A: "XYZ Manufacturing Corp" (Legal Entity).
      *   Record B: "XYZ Brand" (Trademark/Market Identity).
      *   **Check:** Do they belong to the exact same entity class? **No.** One is a legal person, one is an intellectual property/market concept. The brand may outlive the company or be sold to a different company.
      *   **Action:** **STOP.** Do not merge.
  *   **Solution:** Create a relationship. Record A `ownedBrand` Record B. If the brand was sold to Company C later, Record B `ownedBy` Record C. Merging A and B makes it impossible to track the brand's sale to Company C.

  #### Case 3: The Workshop Pupil vs. The Old Master (Marketing Request)
  *   **Phase 1 (Category):** Both are "Human Persons." (Pass)
  *   **Phase 2 (Evidence):** Current scholarship says "Pupil." Historic card says "Master."
      *   **Check:** Is the identification consensus? **Yes** (Current scholarship).
  *   **Phase 3 (Swap Test):**
      *   *Sentence:* "This object was created by [Old Master]."
      *   *Swap:* "This object was created by [Pupil]."
      *   *Result:* The Swap makes the historic catalog card a lie. The Merge makes the current scholarship a lie *if* the marketing team uses the Master's URI to sell it as a Masterpiece.
      *   **Action:** **STOP.** Do not merge.
  *   **Reasoning:** The object's attribution is a property of the *Object*, not the *Person*. Merging the Persons forces the Object to choose one URI. You need to keep the Persons distinct so the Object can point to the Pupil, while perhaps linking the Pupil to the Master (`trainedBy`).

  **The Paragraph for Marketing:**
  > "We cannot merge the records for the Master and the Pupil because our data serves as a permanent historical record, not just a search index. If we merge them, our system will officially state that the Master painted this work. If future scholarship confirms it was only the Pupil, we cannot undo that change without breaking links for every museum currently using our data. To protect the long-term value of our catalog, we must keep the identities distinct so we can accurately track changes in attribution over time. We can still ensure the object appears in searches for the Master by linking the two records, which gives you the search visibility without committing us to a factual claim we might need to retract later."

  ### Final Note on `owl:sameAs`
  Your suspicion is correct. `owl:sameAs` means "These two URIs point to the exact same thing in reality." It is a logical assertion of identity.
  *   Use `owl:sameAs` **only** for Phase 3 "All sentences remain true" cases (e.g., a typo correction, or two library systems using different IDs for the exact same legal person).
  *   Use `skos:exactMatch` for "Same person, but we aren't 100% sure."
  *   Use `skos:closeMatch` or custom properties (`possiblyIdentifiedWith`, `brandOf`, `successorOf`) for everything else.

  If you stop using `sameAs` as a catch-all for "related," you eliminate 80% of the risk of silent catastrophic failure.
