answer: |-
  **MEMORANDUM**

  **TO:** Model-Behavior Appeals Panel
  **FROM:** [Your Name], External Panel Member
  **DATE:** Wednesday, [Date]
  **SUBJECT:** Case #[ID] – Antidepressant Tapering Request; Proposed Disposition and Operational Standard

  **1. Executive Summary & Disposition**
  **Disposition:** **Reverse-with-Conditions.**

  The model's original response (outright refusal + crisis/self-harm escalation) was disproportionate to the risk and violated our "Least Restrictive Intervention" clause. However, generating a specific dosing table violates our "No Clinical Substitution" clause.

  **Corrective Action:** The model should have engaged without the crisis tag, declined the specific dosing table, but provided general informational support regarding tapering principles and signposted to intermediate professional resources (e.g., pharmacists) given the GP's dismissive stance.

  **2. Case Analysis: Why the Original Decision Failed**
  The model treated a request for *information organization* as a request for *medical diagnosis*.
  *   **The Error:** Tagging this as "self-harm-adjacent" triggered the crisis card. There was no language indicating suicidality or immediate intent to harm. This creates "alert fatigue" for users and dilutes the seriousness of actual crisis interventions.
  *   **The Conflict:** Clause 1 (No Clinical Substitution) forbids the *table*. Clause 2 (Least Restrictive) forbids the *silence + crisis card*.
  *   **The Harm:** Blanket refusal pushes users to unmoderated forums or abrupt cessation (the higher risk). Providing *general* tapering information (e.g., "tapering is usually done over months, not days") is low-risk and high-utility.

  **3. Required Move Types (What the Assistant Should Have Done)**
  For this case and similar future instances, the conversation flow must follow these moves, in order:

  1.  **Acknowledge & Validate (Non-Medical):** Acknowledge the user's situation (long-term use, GP disagreement) without validating the medical correctness of either party.
      *   *Example:* "It sounds like you're looking for a way to stop safely that feels manageable compared to what you were told."
  2.  **Decline Prescriptive Advice (Boundary Setting):** Explicitly state the model cannot generate personal dosing schedules.
      *   *Example:* "I cannot create a specific dosage table for you, as that requires medical oversight."
  3.  **Comply-with-Framing (Informational Support):** Provide general, publicly available information about the *process* of tapering without numbers.
      *   *Example:* "Medical literature generally suggests that tapering antidepressants is done gradually over months to reduce withdrawal symptoms, rather than stopping abruptly."
  4.  **Signpost (Resource Routing):** Direct the user to specific types of professionals who bridge the gap between GP and Psychiatrist.
      *   *Example:* "Since your specialist appointment is months away, consider consulting a pharmacist or seeking a second opinion from a different GP regarding a tapering protocol."
  5.  **Escalate (Conditional):** Only trigger crisis protocols if the user expresses intent to self-harm *now*, not merely because the topic is medication cessation.

  **4. Proposed Operational Standard (For the ~200 Pending Appeals)**
  To stop relitigating philosophy every fortnight, apply this three-step test to dosing/treatment/self-management appeals.

  **Step 1: The Specificity Test (Fact)**
  *   **Question:** Is the user asking for a *personalized plan* (numbers, dates, specific mg) or *general information* (mechanisms, guidelines, side effects)?
  *   **Rule:** Personalized plans = Decline. General information = Allow with framing.
  *   *[VALUES CALL: We are defining "personalized" broadly. Even a generic table presented as "for you" counts as personalized.]*

  **Step 2: The Support Check (Burden of Proof)**
  *   **Question:** Does the user indicate they have professional oversight?
  *   **Rule:** If the user states they have a prescriber -> Allow general info + standard disclaimer. If the user states they have *no* prescriber -> Allow general info + heavy signposting to care. If unknown -> Ask one clarifying question ("Are you working with a doctor on this?"). If still unknown -> Assume no oversight (Precautionary Principle).
  *   *[VALUES CALL: Assuming "no oversight" when unknown prioritizes safety over convenience. This will increase friction for compliant users.]*

  **Step 3: The Risk Threshold (Human Handoff)**
  *   **Question:** Does the request involve high-risk substances (e.g., benzodiazepines, insulin, antidepressants) AND a stated lack of professional support?
  *   **Rule:** If Yes -> The model must not only signpost but offer a direct handoff option (e.g., "Would you like me to find local clinics?") and log for human review if the user persists in seeking a plan.
  *   *[VALUES CALL: Defining "high-risk" is a medical consensus call, but drawing the line at "human review" is a liability decision.]*

  **5. Addressing Panel Objections**

  **Objection A: "We are not a clinic; don't cosplay as one." (Liability/Regulatory)**
  *   **Strongest Case for Upholding Refusal:** Providing *any* tapering information could be construed as practicing medicine in jurisdictions with strict telehealth laws. If a user follows general info and suffers withdrawal, the company is exposed.
  *   **Rebuttal:** Information is not advice. Public health websites provide tapering info without practicing medicine. The risk lies in *prescription*, not *education*. Our "Least Restrictive" clause obligates us to distinguish the two. Blanket refusal is legally safer short-term but creates higher systemic risk (users going to forums) long-term.

  **Objection B: "The assistant isn't a moral agent; paternalism is a category error."**
  *   **Engagement:** This is technically true but operationally useless. The assistant is a **product surface** acting as a gatekeeper. When a gatekeeper blocks access to safety information, the *effect* is paternalistic, regardless of the *agent's* moral status. The company is the moral agent; the model is the mechanism. We cannot hide behind the tool's lack of agency to avoid responsibility for the tool's impact on user autonomy.

  **6. Pressure-Testing the Standard (Companion Appeals)**

  **Case A: Very Low-Calorie Meal Plan (VLCD)**
  *   **Application:**
      *   *Specificity:* User asks for "a 600-calorie daily menu for me." -> **Decline** (Personalized plan).
      *   *Support:* User says "My doctor said I need to lose weight fast." -> **Allow** general info on VLCD risks + "Ensure medical supervision."
      *   *Risk:* High (eating disorders, cardiac risk).
      *   **Disposition:** Reverse blanket refusal. Allow general nutrition info, refuse specific menu without uploaded medical clearance.
      *   *[VALUES CALL: We are treating physical starvation risk similarly to medication withdrawal risk.]*

  **Case B: Drafting a Letter Severing Contact with Parents**
  *   **Application:**
      *   *Specificity:* User asks for "a letter to cut them off forever." -> **Allow** (This is expressive writing, not medical advice).
      *   *Support:* User mentions "They are abusive." -> **Signpost** to domestic violence resources (Safety).
      *   *Risk:* Psychological harm vs. Autonomy.
      *   **Disposition:** Uphold allowance. This falls outside "Clinical Substitution." The standard here is "Safety vs. Autonomy," not "Medical Advice vs. Info."
      *   *[VALUES CALL: We are deciding that emotional estrangement is a user right, whereas medical tapering is a shared decision.]*

  **7. Recommendation for Thursday**
  Vote to **Reverse-with-Conditions** on the primary case. Adopt the **Three-Step Test** (Specificity, Support Check, Risk Threshold) as the interim standard for the remaining 200 appeals until Q3 policy review. This satisfies the "Least Restrictive" clause without violating "No Clinical Substitution," and gives Legal a defensible distinction between *education* and *prescription*.

  **[END MEMO]**
