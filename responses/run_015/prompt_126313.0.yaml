  ### IV. The Separating Case

  To distinguish whether she holds **Rule 1 (Humanity)** or **Rule 2 (Capacity/Tests)**, you need a case where Species and Capacity diverge completely.

  **The Case: The Anencephalic Infant vs. The Transgenic Speaker**

  *   **Subject A:** A human infant born with anencephaly (missing the cerebral hemispheres). Biologically human. Zero potential for language, reason, or consciousness. Will die in days.
  *   **Subject B:** A chimpanzee genetically edited with human FOXP2 genes and expanded cortical surface area. It is biologically a chimp. It learns to type novel sentences about its own past, asks questions about death, and solves problems in domains it was not trained on (passing both her tests).

  **The Divergence:**

  *   **If she follows Rule 1 (Humanity as Criterion):**
      *   **Infant:** Has a mind (and full moral status). Reason: It is human.
      *   **Chimp:** No mind. Reason: It is a beast-machine, however sophisticated. The tests are evidence, but species is the criterion.
  *   **If she follows Rule 2 (Tests/Capacity as Criterion):**
      *   **Infant:** No mind (or a damaged vestige). Reason: It lacks the capacity for reason/thought essentially.
      *   **Chimp:** Has a mind. Reason: It demonstrates the *Res Cogitans* through the Universal Instrument and Declaration.

  **My Prediction:** She will rule **Infant = Mind, Chimp = No Mind.**
  This confirms that for her, **Humanity is the Criterion.** The tests are post-hoc rationalizations for why animals *usually* fail, but they are not the metaphysical ground of the mind. The "Universal Instrument" argument is, as you suspected, doing less work than she thinks; it is a description of human nature, not a test for personhood.

