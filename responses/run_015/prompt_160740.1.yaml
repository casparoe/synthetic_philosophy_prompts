answer: |-
  **PROSPECTUS FOR THE IMPARTIAL MIRROR**
  **A Daily Journal Dedicated to the Formation of the Public**

  The Proprietors beg leave to announce the inauguration of a Periodical entirely suited to the spirit of the Age. Wherein previous journals have addressed themselves to specific persons in specific situations, *The Impartial Mirror* addresses itself to No One, and thereby to Everyone. It is designed not to inform the citizen, but to constitute the Public.

  **I. THE RELIEF OF ABSTRACTION**
  The primary benefit offered to the Subscriber is liberation from the burden of particularity. In the ordinary course of life, a man is bound by his trade, his family, and his locality. He is responsible for what he says because he is somebody. *The Impartial Mirror* relieves the reader of this weight. By reading our columns in the solitude of his own room, the Subscriber joins a hundred thousand others similarly situated, not in a crowd, but in an abstraction. He becomes part of a Whole that is nowhere and everywhere. He need not possess any expertise to hold an opinion on matters of state, art, or morality. The paper provides the opinion; the reader provides the assent; and no one is required to be the person who actually holds it.

  **II. THE PRIVILEGE OF IRRESPONSIBILITY**
  It is the boast of this Journal that nothing printed within it shall possess any lasting actuality. Our reports are designed to be consumed and forgotten by the following morning. This is not a defect, but a feature of the highest order. That which is forgotten cannot be answered for. The Public is never responsible, because the Public is never present. We offer a sanctuary of chatter where passions may be aroused without consequence, judgments rendered without trial, and convictions adopted without action. Truth is a matter of how one exists, and since existence is too heavy a burden for a collective mind, we offer instead the lightness of gossip.

  **III. ANONYMITY AND AUTHORITY**
  The Editorship of *The Impartial Mirror* shall remain strictly concealed. A named editor invites reply; an anonymous power commands silence. We speak with the voice of a phantom, which is to say, with the voice of All. We do not report events, for events belong to actuality. We report what Everyone is Saying about events. This ensures that the news is always true to the Public, even if it is false to the world. We cannot be challenged, for there is no one to challenge.

  **IV. THE PREMIUM TIER: THE SINGLE INDIVIDUAL**
  Recognizing that some subscribers may feel a lingering discontent with this comfortable nothingness, we offer a Premium Subscription available to literally one person at a time. This supplement, titled *The Individual*, contains no opinions and offers no relief. It cannot be shared, discussed, or quoted. It requires the Subscriber to live what he reads rather than merely think it. Please note: The Paper cannot perform this part for him. Most subscribers find this tier too demanding and revert to the standard Public rate.

  **TESTIMONIALS**
  *"I feel much less responsible since subscribing."* — A Reader.
  *"It is comforting to know my opinion matters precisely because I do not."* — A Subscriber.
  *"I have joined the Public and now I am everywhere."* — No One.

  **SUBSCRIPTION FORM**

  Name: _________________________________________
  *(The Proprietors politely suggest that leaving this line blank best secures the benefits of the Public. A name anchors the reader to a specific situation, which undermines the abstraction.)*

  Address: _______________________________________
  *(Optional. The Paper arrives wherever the Reader is not.)*

  Remittance: ____________________________________

  **NOTICE TO THE READER**
  This Prospectus is itself a piece of printed paper, read by you alone in a room. It addresses a Public that does not yet exist, but which will come into being the moment you accept that you are not reading this as yourself. By subscribing, you do not join a community; you join the machinery that makes community unnecessary.

  *Published by The Void, for The Void.*
