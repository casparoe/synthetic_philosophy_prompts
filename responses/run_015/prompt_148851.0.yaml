prompt: |-
  Our interpretability reading group has been going in circles for about a year on whether neural networks really have representations, and I want a diagnosis of the stalemate rather than a verdict on who's right.

  Here's where each side actually is. The feature realists point to: linear probes in early layers recovering things like whether a chunk of text is in French or whether an open bracket is still open; sparse autoencoders (SAEs) trained on a residual stream giving directions that look monosemantic, that fire on categories humans can label, and that shift behaviour in the intended way when you clamp them; and the fact that the same directions show up across models trained from different seeds once you align the two activation spaces in an unsupervised way. They also lean on a structural point — that the MLP acts elementwise, so the residual-stream basis isn't as arbitrary as picking random coordinates in a vector space.

  The skeptics reply that every one of those results is a fact about a decomposition we chose, not about the network. The SAE optimizer hands you one of many dictionaries that sit equally well on the sparsity/reconstruction tradeoff; a probe is just a linear functional that happens to exist; and clamping shows that your intervention is causally efficacious, not that the network was using that variable. Call them features if it helps, but don't confuse a coordinate system that's convenient for us with the network's own ontology.

  Three results keep getting waved at each other and none of them has moved anybody:

  1. Two SAEs trained on the same layer, different seeds and dictionary sizes, produce two dictionaries that aren't permutations of each other, that are equally good on the curve, that are both steerable, and each of which predicts the other's activations well. Realists say that's just features splitting into sub-features — hierarchy. Skeptics say that's underdetermination, full stop.

  2. A preprint someone brought a couple of months ago that I can't stop thinking about. Two models, same architecture, same data, different seeds, loss within noise of each other. For most features in model A there's a matching direction in B under the unsupervised alignment, and clamping it does the same thing. But for one cluster — stuff that looks like tracking whether a syntactic construction is still open — B has no single direction. A probe recovers the information perfectly, but it's spread across about six directions; clamping any one of them does nothing, and you have to clamp all six to get the effect you get from A's one feature.

  3. The mirror image: a probe for some boring syntactic property hits 99%, no SAE at any dictionary size finds a feature correlating with it above chance, and there's no direction whose clamping changes anything.

  So: what kind of disagreement is this, actually? My half-baked theory is that the two sides aren't arguing about the network at all — they're arguing about whether a decomposition has to be *unique* to be real, which is the same shape as fights over whether a system's natural degrees of freedom are discovered or imposed. If that's right it's basically verbal. But both sides keep running new experiments, which suggests they think there's an empirical or formal question buried in there — something about whether the network satisfies the conditions under which a dictionary is identifiable, or about whether there's a privileged basis at all.

  What I want: a diagnosis with reasons, using what each camp actually says above, and an honest account of what would count as progress. A theorem about identifiability? A benchmark? A distinction — say, between information being present in the activations, being implemented as a causally separable variable, and being axis-aligned? A change of question, from "does it have representations" to something like "does this description let me predict or control it"? Or is this one where we should definately expect no resolution, and if so, why.
reasoning: |-
  Here's a thinking process that leads to the suggested diagnosis:

  1.  **Deconstruct the User's Request:**
      *   **Context:** An interpretability reading group stuck in a year-long stalemate about whether neural networks "really have representations."
      *   **The Parties:**
          *   *Feature Realists:* Point to linear probes, SAEs (monosemanticity, steering), cross-model alignment, structural constraints (MLP elementwise).
          *   *Skeptics:* Argue these are artifacts of decomposition choice (SAE non-uniqueness, probe existence $\neq$ usage, intervention efficacy $\neq$ native ontology).
      *   **The Stalemate Evidence (3 Key Results):**
          1.  *SAE Non-Uniqueness:* Different SAEs on same layer $\rightarrow$ different dictionaries, both good, predictable mapping. Realists say "hierarchy"; Skeptics say "underdetermination."
          2.  *Cross-Model Mismatch:* Model A has a single feature for syntax; Model B has it distributed across 6 directions. Alignment works for most, not this.
          3.  *Probe/SAE Mismatch:* Probe finds info (99%), SAE finds nothing, clamping does nothing.
      *   **User's Hypothesis:** Is this verbal? (Uniqueness requirement). Is there an empirical/formal core? (Identifiability, privileged basis).
      *   **Desired Output:** A diagnosis of the disagreement type, using the specific evidence provided, reasons for the stalemate, and an honest account of what counts as progress (theorem, benchmark, distinction, question shift, or acceptance of no resolution).

  2.  **Analyze the Core Disagreement:**
      *   It's not just "do representations exist?" It's "what constitutes a representation?"
      *   *Realists* seem to operate with a *functionalist/causal* definition: If I can isolate it, steer it, and find it across models, it's real.
      *   *Skeptics* seem to operate with a *structural/ontological* definition: If the network doesn't *need* this basis to compute, or if the basis isn't unique/canonical, it's an artifact of the observer.
      *   The "Verbal" Hypothesis: The user suggests it's about uniqueness. I need to validate this but go deeper. It's not just uniqueness; it's about *compression vs. computation*.
      *   The "Empirical" Hypothesis: There might be a formal condition (identifiability) that hasn't been met.

  3.  **Evaluate the Three Stalemate Results:**
      *   *Result 1 (SAE Non-Uniqueness):* This is the strongest point for Skeptics. If the "atoms" of thought change based on random seed/hyperparams, are they atoms? Realists' "hierarchy" defense is weak unless they can show a canonical tree structure. This points to *rotational freedom* in the subspace.
      *   *Result 2 (Distributed vs. Localized):* This is crucial. It shows that *information* is robust, but *implementation* is not. Model A uses a "local" code; Model B uses a "distributed" code for the same semantic content. This suggests "representation" is not a binary property of the *network*, but a property of the *training trajectory*.
      *   *Result 3 (Probe vs. SAE):* This distinguishes *information presence* (probe) from *causal leverage* (SAE/clamping). If a probe finds it but you can't steer it, the network isn't using that variable as a *control handle*. It's a byproduct or entangled.

  4.  **Formulate the Diagnosis:**
      *   **Type of Disagreement:** It is *not* purely verbal. It is a **Category Error regarding Levels of Abstraction**.
      *   Realists are talking about *Discoverable Causal Levers* (Instrumentalism).
      *   Skeptics are talking about *Canonical Computational Primitives* (Realism about architecture).
      *   The stalemate exists because they are optimizing for different virtues: Realists want *predictive/control utility*; Skeptics want *ontological uniqueness*.
      *   **The "Unique Decomposition" Trap:** The user's intuition is right. The Skeptics are implicitly demanding a "God's Eye View" basis (like eigenvalues in PCA, but for semantics). Realists are accepting "Engineer's View" bases (tools that work).
      *   **Why Experiments Don't Resolve It:** Because every experiment Realists run (SAE, probing) is a *transformation* of the space. Skeptics can always say "you imposed that structure." To resolve it, you need a constraint that comes *from the network dynamics*, not the analysis tool.

  5.  **Develop Paths to Progress:**
      *   *Theorem:* Identifiability conditions for SAEs. When is the dictionary unique? (Likely never perfectly, but maybe approximately).
      *   *Distinction:* Separate "Information," "Representation," and "Mechanism."
          *   Information: Can be decoded? (Probe)
          *   Representation: Is it a distinct direction used by downstream layers? (Causal Mediation)
          *   Mechanism: Is it the *only* way the network does it? (Skeptic's bar).
      *   *Question Shift:* Move from "Is it real?" to "Is it *stable* under perturbation?" (Robustness).
      *   *No Resolution:* Acknowledge that neural networks might be *polysemantic by nature* and the quest for monosemanticity is a human imposition.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Validate the user's "verbal" hunch but refine it. It's not just verbal; it's a clash of *criteria for reality*.
      *   *Diagnosis:* Frame it as **Instrumentalism vs. Structural Realism**.
          *   Realists: "If it bleeds, it's real." (Causal efficacy).
          *   Skeptics: "If it's not the *only* way to bleed, it's not a fundamental organ." (Identifiability).
      *   *Analyzing the 3 Results:*
          *   1 (SAE variance): Shows the "basis" is not intrinsic. Supports Skeptic's "imposed coordinate system."
          *   2 (A vs B): Shows *semantic content* is conserved, *geometry* is not. This kills the idea of a universal "feature ontology."
          *   3 (Probe/SAE gap): Crucial distinction between *readable* and *causally isolated*.
      *   *What Counts as Progress:*
          *   Stop asking "Is it real?"
          *   Start asking "Under what conditions is a decomposition *stable*?"
          *   Formalize "Causal Isolation."
          *   Accept "Approximate Identifiability."
      *   *Conclusion:* The stalemate persists because they are solving different problems. One wants to hack the model (Engineering), the other wants to understand the model's soul (Science).

  7.  **Refining the Tone:**
      *   Needs to be analytical, not taking sides.
      *   Use the user's terminology (SAE, probes, clamping, residual stream).
      *   Be honest about the "No Resolution" possibility.

  8.  **Final Polish:** Check against the specific constraints.
      *   Diagnosis with reasons? Yes.
      *   Use the 3 results? Yes.
      *   Honest account of progress? Yes.
      *   Address the "verbal" theory? Yes.

      *(Self-Correction during drafting)*: I should be careful not to dismiss the Realists too easily. Their point about the MLP acting elementwise *is* a structural constraint that breaks rotational invariance. I need to acknowledge that the Skeptics might be overstating the "arbitrariness." The MLP *does* privilege the standard basis. The disagreement is whether the *SAE basis* aligns with the *MLP basis*.
      *Correction:* Actually, the SAE is usually trained on the residual stream *before* the MLP. The MLP then projects. The Realist argument is that the SAE finds the basis the MLP *wants* to use. The Skeptic says the SAE finds *a* basis the MLP *can* use. This nuance is important.

      *(Refining Result 2)*: The fact that Model B distributes the feature suggests that "features" are not universal constants. This supports the Skeptic's view that features are *emergent properties of a specific training run*, not intrinsic to the architecture/task.

      *(Refining Result 3)*: This highlights the difference between *linear readout* and *causal isolation*. A probe finds information; an SAE finds *independent* information.

      *Final Plan:* Structure the response into: 1. The Core Diagnosis (Instrumentalism vs. Ontological Realism), 2. Analysis of the 3 Stalemate Results through this lens, 3. Why Experiments Fail to Break It, 4. Paths to Progress (Formal, Conceptual, Pragmatic).

