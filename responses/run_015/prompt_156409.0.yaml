answer: |-
  This is a sophisticated plan for a methods section, and your three-way distinction is significantly better than the standard "all models are wrong but some are useful" platitude usually fed to undergraduates. It gives them operational criteria rather than slogans.

  Here is the verdict on your spine, the structural plan for the hour, the example choice, and the boundaries you need to set.

  ### 1. The Spine: Evaluate the Three-Way Distinction

  **Keep the distinction, but rename and reweight.**

  Your categories are analytically sound, but for 2nd-years with no philosophy, the labels *Cancellable*, *Compensated*, and *Inert but Fragile* are slightly too abstract. They risk becoming jargon to be memorized rather than tools for thought.

  *   **(i) Cancellable $\rightarrow$ "Robust Simplifications."**
      *   *Why:* This is the easiest sell. It aligns with their intuition about approximations (e.g., ignoring air resistance).
      *   *Verdict:* Keep. This is where you validate Friedman.
  *   **(ii) Compensated $\rightarrow$ "Lucky Cancellations."**
      *   *Why:* "Compensated" sounds intentional. "Lucky" signals danger. If errors offset, the model works *until* the correlation between errors breaks. This is a crucial bridge to your third point.
      *   *Verdict:* Keep, but treat it as a subset of "fragile" rather than a standalone virtue. It warns them that a good fit can be accidental.
  *   **(iii) Inert but Fragile $\rightarrow$ "Policy-Breaking Assumptions."**
      *   *Why:* "Inert" suggests it does nothing, which confuses students when you say it drives the answer. The danger here is specifically about **invariance**. The assumption holds in the status quo but breaks under intervention.
      *   *Verdict:* This is the most important category. It is where you defeat their econometrics training (which tells them $R^2$ is king).

  **Recommendation:** Build the session on the tension between **(i) Robust** and **(iii) Policy-Breaking**. Use (ii) only to explain why a model might look Robust (good fit) but actually be Policy-Breaking. If you spend equal time on all three, you will run out of minutes. The pedagogical payload is: *An assumption can be false and harmless (i), or false and catastrophic (iii). Your job is to tell the difference.*

  ### 2. The Flow: 50-Minute Structure

  You need to front-load the *purpose* of a model before you defend its *assumptions*.

  *   **0:00–0:05: The Hook (The Econometrics Trap).**
      *   Show a regression with a perfect fit based on a spurious relationship (e.g., storks and births, or a classic omitted variable bias they know).
      *   *Point:* Good prediction $\neq$ True mechanism. This undermines their instinct that "fit vindicates the box."
  *   **0:05–0:15: Friedman's Claim & The Map Analogy.**
      *   State the F-twist: "The question is not whether assumptions are descriptively true, but whether the model yields accurate predictions for the purpose at hand."
      *   *Analogy:* A subway map is topologically accurate but geographically false. It is useless for walking, perfect for riding.
      *   *Misconception Check:* Head off "Unrealistic = Approximately True." Explicitly say: "The map is not *approximately* the terrain; it is *structurally different* to serve a purpose."
  *   **0:15–0:35: The Carrying Example (Price-Taking).**
      *   Walk through your three categories using this example (detailed below).
  *   **0:35–0:45: The Danger Zone (Inert/Fragile).**
      *   Focus heavily here. Show how the same assumption that worked for prediction fails for policy. This is the Lucas Critique intuition without the math.
  *   **0:45–0:50: Assessment & Wrap.**
      *   The final question (detailed below).

  ### 3. The Carrying Example: Price-Taking Behavior

  **Verdict:** Use **Price-Taking (Perfect Competition)**.
  *Zero Transaction Costs* is too institutional/Coasean for a 50-minute micro-focused session. *Price-Taking* is the bedrock of their Intermediate Micro. They know the graph. They know the math ($P=MC$).

  **What the example must have:**
  1.  **A Falsehood:** Firms clearly have some market power (downward sloping demand, not horizontal).
  2.  **A Repair Path:** Move from Perfect Competition to Cournot (or simple Monopoly). The math is known to them ($MR=MC$).
  3.  **A Separable Function:** Show that for *price prediction* in a market with 1,000 firms, the PC model works (Robust).
  4.  **A Policy Intervention:** Show that for *merger policy* (reducing 1,000 firms to 2), the PC model fails catastrophically (Fragile).

  **What the example must lack:**
  *   **Game Theory Nuance:** Do not derive Nash equilibria. Just state: "If firms recognize their influence, price rises."
  *   **Psychology:** Do not discuss whether firms *know* they are maximizing. Stick to the system outcome.

  **How to execute the distinction with this example:**
  *   **(i) Robust:** Predicting the price of wheat. There are thousands of farmers. Assuming price-taking gives the right price. Relaxing the assumption (Cournot with $N=1000$) changes the price by 0.01%. The assumption is false but cancellable.
  *   **(ii) Lucky:** (Briefly) Imagine a market where input costs rise exactly as demand falls. A PC model might predict stable prices correctly, but for the wrong reasons. If the correlation breaks, the model dies.
  *   **(iii) Fragile:** Antitrust regulation. If you use the PC model to assess a merger of two tech giants, you predict zero price effect (since they are price-takers). In reality, prices jump. The assumption was "inert" during the fit period but "fragile" under the policy intervention.

  ### 4. The Misconception Map

  You listed three good ones. Here are three more you must head off, and *when* to kill them.

  1.  **"Models are Photographs."**
      *   *Misconception:* A model is defective if it leaves things out.
      *   *Correction:* A model is a **Map**. A map that showed every tree would be useless for navigation.
      *   *Timing:* 0:05 (Friedman intro).
  2.  **"The Black Box Fallacy."**
      *   *Misconception:* (From Econometrics) If the output matches the data, the internal mechanism is confirmed.
      *   *Correction:* High $R^2$ validates the *prediction*, not the *assumptions*.
      *   *Timing:* 0:00 (The Hook).
  3.  **"All Falsehoods are Equal."**
      *   *Misconception:* If one assumption is false, the whole model is suspect.
      *   *Correction:* Some assumptions are **load-bearing** (Fragile), others are **scaffolding** (Robust).
      *   *Timing:* 0:35 (The Danger Zone).

  ### 5. The Final Question (Assessment)

  Do not ask them to define the F-twist. Ask them to apply the distinction.

  **The Question:**
  > "You are advising a regulator on a proposed merger between two large internet service providers. You have a model that fits historical pricing data perfectly ($R^2 = 0.99$). The model assumes consumers have zero switching costs.
  >
  > The merger will introduce switching costs for the first time.
  >
  > Based on today's distinction, is this assumption **Robust** or **Fragile**? Should you trust the model's prediction that prices won't change? Why?"

  **What this tests:**
  *   It forces them to identify the assumption (zero switching costs).
  *   It forces them to identify the intervention (merger creates costs).
  *   It tests if they understand that a good historical fit (Econometrics training) does not validate the assumption under policy change (Methods training).
  *   *Correct Answer:* It is Fragile/Policy-Breaking. The assumption drives the result precisely where the policy intervenes. Do not trust the prediction.

  ### 6. Scope Boundaries: What to Refuse

  You are correct to avoid the Realism/Anti-Realism debate. Here is the explicit "Out of Scope" list to keep you safe:

  1.  **Ontological Status of Unobservables:** Do not discuss whether utility functions "exist." Treat them as tools. If a student asks, "But do people actually maximize utility?" answer: "For this hour, we only care if assuming they do helps us predict prices."
  2.  **The 'As-If' Psychology:** Avoid Friedman's billiards player. It invites debates about cognitive science. Keep the focus on *market outcomes*, not *agent cognition*.
  3.  **Normative Economics:** Do not let the discussion slide into "Is this policy good?" Keep it on "Will this model predict the outcome of the policy?"
  4.  **History of Thought:** Do not contextualize Friedman against Samuelson or the Austrian school. It consumes time and adds noise.
  5.  **Structural Estimation Details:** Do not try to teach them how to fix the fragile model structurally. Just teach them to recognize it is fragile.

  **Summary Advice:**
  Your distinction is the strongest part of your plan. It transforms Friedman from a "anything goes" excuse into a diagnostic tool. Use the Price-Taking example to make it concrete. Spend the most time on the **Fragile** category, because that is where their econometrics training will actively mislead them. If they leave understanding that **a model can fit the past perfectly and still lie about the future**, you have succeeded.
