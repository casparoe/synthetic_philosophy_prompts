  6.  **Drafting the Plan (Iterative refinement):**

      *   *Critique of the 3-Way Distinction:* It's strong. "Compensated" is the riskiest. If errors offset, is the model *good*? Friedman might say yes (prediction works), but a structuralist says no. For a methods class, emphasize that (ii) is lucky and (i) is robust. (iii) is the killer.
      *   *Refining the Example:* Use a specific market. Agricultural market (wheat)? Good for price-taking. But where does it break? Merger policy. If two wheat farmers merge, does it matter? No. If two tech platforms merge? Yes. This highlights the *context* dependence of the assumption's validity.
