answer: |-
  Dear Parent,

  It is genuinely impressive that you and your daughter have uncovered this mechanism so clearly, because what you are describing is the engine room of most historical and political disagreement. You are right to feel that standard terms like security dilemma or revisionism do not quite capture the specific rhetorical machinery you are seeing. The security dilemma is a structural theory about how states behave under anarchy, whereas what you are watching is about how humans construct stories to assign blame. You have identified two distinct but cooperating phenomena here, and while one has a very precise name in psychology, the other is a bit more diffuse in its labeling, though no less real.

  The second thing you noticed, where her side is described by circumstances and the other side by character, has a very specific name. In social psychology, this is called the Fundamental Attribution Error. When we explain our own behavior, we tend to cite the situation, such as being worried or boxed in, but when we explain the behavior of others, especially adversaries, we cite their disposition, such as being expansionist or paranoid. In the context of group conflict or international relations, this is often refined as the Ultimate Attribution Error. I am very confident in this label. It is a robust, replicable finding in psychology that describes exactly the flip you are seeing. It is not bias in the sense of lying about facts, but a bias in how facts are categorized. Your daughter is not doing this maliciously; our brains are wired to protect our own sense of agency while固化 ing the enemy's nature. This is the same mechanism you see in a divorce or between siblings, where one child says I hit him because he took my toy, and the other says he hit me because he is violent. The facts of the hit are agreed upon, but the level of description diverges to protect the self.

  The first thing you noticed, the sliding timeline where the start date determines the aggressor, is slightly harder to pin to a single canonical law, though historians and philosophers of history discuss it constantly. The most accurate description is Narrative Framing or Temporal Periodization. Historians know that any start date is arbitrary because every event is the result of a previous event, leading back to an infinite regress. Choosing 1945 versus 1917 is an act of Causal Selection. While there isn't a single catchy phrase like Fundamental Attribution Error that covers this timeline maneuver universally, it is often discussed under the umbrella of Framing Effects or sometimes Temporal Bias. I am less confident than I am about the attribution error that there is one universally agreed-upon name for this specific rhetorical move, but the concept itself is well-established in historiography. It is the recognition that a narrative requires a beginning, and whoever controls the beginning controls the assignment of guilt. This is not quite cherry-picking dates in the sense of ignoring data, but rather selecting the horizon from which the data is viewed. It stops being honest debate and tips into bad faith when the arguer pretends their chosen start date is the natural or obvious one, rather than admitting it is a strategic choice. If your daughter says the story begins in 1947 because that is when the policy shifted, that is honest. If she says the story begins in 1947 because anything before that doesn't count, without acknowledging why it doesn't count, that is where the manipulation lies.

  You asked whether putting a name to this settles the question of who started it. It does not settle the history, but it does settle the logic of the debate. It reveals that the question who started the Cold War is not a well-posed question in the scientific sense, because it assumes there was a state of peace that was interrupted by a specific agent. If the situation was actually a continuous spiral of action and reaction, then looking for a first mover is a category error. Naming these mechanisms relocates the fight from the facts to the frame. The debate should not be about who was first, but about which timeframe is more useful for understanding the conflict. This is the advice I would give your daughter for Thursday. She should not try to prove her start date is the true one, because her opponent will just step back one year. Instead, she should argue that her start date is the most analytically useful one. She can say that while actions occurred before 1947, the policy framework that defined the Cold War crystallized then, so that is the relevant beginning for this discussion. This acknowledges the arbitrariness without surrendering the argument.

  The edge where this becomes propaganda is precisely where the awareness of the frame disappears. In honest history, scholars argue about periodization openly. In propaganda, the frame is presented as reality itself. Since your daughter is arguing both sides honestly, she is safely within the realm of rhetorical exercise rather than deception. She is learning that history is not just a collection of events but a collection of stories we tell about those events. The mechanism you spotted is the same animal whether it is in a superpower conflict or a backseat fight, because it relies on the same human limitations in processing cause and effect. We cannot see the whole chain, so we grab a link and call it the start. We cannot see the whole mind, so we grab a trait and call it the cause. Recognizing this does not solve the Cold War, but it solves the puzzle of why smart people can agree on the facts and disagree on the truth. I am most uncertain about whether there is a more specific technical term for the timeline maneuver than Narrative Framing or Periodization, as different disciplines prefer different labels, but I am certain that the phenomenon itself is exactly as you have described it.
