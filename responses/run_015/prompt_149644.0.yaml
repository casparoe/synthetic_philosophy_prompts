  I’m a PhD student in politcal philosphy, and we’re working through the dirty-hands literature in my normative theory seminar. Last week my advisor kept saying “you can’t govern with clean hands” whenever someone objected to a hypothetical coalition deal with an authoritarian party to push through climate legislation. I think she was using it to mean something like moral purity is just incompatible with real-world effectiveness, but I’m genuinely unsure what precise claim she was advancing.

