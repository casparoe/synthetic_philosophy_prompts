answer: |-
  This is a classic pivot point in normative theory, and your instinct to press for precision is exactly what your seminar needs. The slogan "you can't govern with clean hands" is often used as a conversation-stopper when it should be a conversation-starter. In the literature (from Machiavelli to Weber to Walzer and beyond), this claim fractures into several distinct normative theses.

  Here is a menu of interpretations, categorized by their philosophical weight and utility. I have tailored these to help you diagnose whether your advisor is making a realist claim, a consequentialist one, or a claim about the nature of political office itself.

  ### I. The Trivial / Conceptual Theses
  *These claims are technically true but carry little normative weight. If your advisor is relying on these, she is under-arguing the case.*

  **1. The Non-Ideal Theory Thesis**
  *   **Claim:** Political action takes place in conditions of scarcity, disagreement, and institutional constraint. Therefore, outcomes will never perfectly align with ideal moral principles.
  *   **Verdict:** True, but banal. It explains why we can't achieve *utopia*, but it doesn't justify specific rights-violations or coalition deals with authoritarians.
  *   **Seminar Utility:** Low. This admits imperfection but doesn't justify the "dirt."

  **2. The Compromise Thesis**
  *   **Claim:** Governance requires coalition-building; coalitions require compromising with actors who hold some objectionable views.
  *   **Verdict:** Descriptive. It explains why hands get *touched* by others, but not why they get *dirty*. Working with an authoritarian party to pass climate law is a strategic calculation; calling it "dirty hands" implies a moral violation occurred, not just a pragmatic annoyance.
  *   **Seminar Utility:** Low. This conflates "impurity" with "compromise."

  ### II. Substantive & Defensible Theses
  *These are the heavy lifters in the literature. They argue that the dirt is real, but the action is nonetheless required.*

  **3. The Weberian "Ethic of Responsibility" Thesis**
  *   **Claim:** Political leaders have a specific duty to prevent catastrophic outcomes (e.g., climate collapse). When deontological constraints (e.g., "do not associate with authoritarians") conflict with this duty, the duty to protect the populace overrides the constraint.
  *   **Verdict:** Defensible. This shifts the moral locus from the *purity of the agent* to the *welfare of the constituents*.
  *   **Seminar Utility:** High. This suggests the "dirt" is the violation of a norm, but the *justification* is the prevention of greater harm.

  **4. The "Moral Remainder" Thesis (Walzerian)**
  *   **Claim:** The politician *does* commit a moral wrong by making the deal, even if it is the right thing to do all-things-considered. The "dirt" is the lingering moral culpability that remains after the justification is accounted for.
  *   **Verdict:** Defensible. This preserves the reality of the moral violation. It prevents the "ends justify the means" from becoming a blank check.
  *   **Seminar Utility:** High. This is crucial for your question on emotional residue (see below).

  **5. The Structural Complicity Thesis**
  *   **Claim:** The "dirt" is not solely the result of discrete agential choices but is embedded in the institutional architecture. By occupying the office, one inherits the sins of the institution (e.g., a state that relies on coercive power or unjust historical treaties).
  *   **Verdict:** Defensible (and addresses your specific curiosity). This distinguishes between *agent-relative* dirt (I chose to shake a dictator's hand) and *structural* dirt (I am governing a state that inherently coerces).
  *   **Seminar Utility:** Very High. If your advisor is invoking this, she is arguing that the "dirt" is inevitable because the *system* is dirty, not because the *climate deal* is dirty.

  ### III. False or Dangerous Theses
  *These are often smuggled into the slogan but should be rejected in a normative theory context.*

  **6. The Moral Nihilist Thesis**
  *   **Claim:** Morality does not apply to political action. The sphere of politics is amoral.
  *   **Verdict:** False. This dissolves the problem rather than solving it. If morality doesn't apply, there are no "dirty hands," only "effective hands."
  *   **Seminar Utility:** Negative. If your advisor means this, she is rejecting the premise of normative theory itself.

  **7. The "Clean Slate" Thesis**
  *   **Claim:** If the outcome is good enough, the means are retroactively cleansed. The hands are no longer dirty once the legislation passes.
  *   **Verdict:** False. This denies the "moral remainder." Most dirty hands literature insists the stain remains even if the act was necessary.
  *   **Seminar Utility:** Negative. This is dangerous consequentialism.

  ### IV. Theses That Dismiss Objections (The Advisor's Likely Toolkit)
  *These are the specific claims that function to shut down the students' objections about coalition-building.*

  **8. The "Moral Self-Indulgence" Thesis**
  *   **Claim:** Refusing to get your hands dirty is a form of narcissism. It prioritizes the moral purity of the leader over the actual needs of the governed.
  *   **Claim in Action:** "If you refuse this coalition to keep your conscience clean, you are valuing your conscience more than the climate."
  *   **Seminar Utility:** Critical. This turns the objection on its head. The students aren't being *moral*; they are being *selfish*.

  **9. The "Competence Signal" Thesis**
  *   **Claim:** Having clean hands is evidence that you are not actually doing the job of governing. If your hands are clean, you likely haven't made the hard calls.
  *   **Claim in Action:** "A politician with clean hands is an unemployed politician."
  *   **Seminar Utility:** Rhetorical. It frames the dirt as a badge of honor or a necessary byproduct of efficacy.

  ***

  ### Deep Dive: Your Two Specific Questions

  You asked about two nuances that often get glossed over. Here is how they fit into the menu above.

  **1. Agency vs. Structure: Is the dirt chosen or forced?**
  This is the distinction between **Voluntarist Dirty Hands** and **Structural Dirty Hands**.
  *   **Voluntarist (Walzer/Weber):** The dirt comes from a specific choice I make (e.g., authorizing torture to stop a bomb, or coalitioning with an authoritarian to pass climate law). I could have walked away, but I chose to act.
  *   **Structural (Critical Theory/Realism):** The dirt is forced by the office itself. Even if I make no "evil" choices, the state I govern relies on coercion, borders, or historical injustices.
  *   **Why it matters for your seminar:** If your advisor is using the **Structural** reading, then the students' objections are misplaced. It doesn't matter if *this specific deal* is bad; the act of *governing* within this state apparatus is already dirty. If she is using the **Voluntarist** reading, then the specific deal must be justified by the outcome (Thesis #3).

  **2. Emotional Residue: Guilt as a Moral Barometer**
  This is the **Phenomenology of Dirty Hands**.
  *   **The Walzerian View:** You *should* feel guilty. If you do the wrong thing for the right reason and feel *no* remorse, you have become a monster. The guilt proves you still recognize the moral norm you violated.
  *   **The "Hardened Heart" View:** Successful governance requires suppressing this guilt to function.
  *   **Why it matters:** If your advisor implies that "you can't govern with clean hands" means "you shouldn't feel bad about it," she is advocating for the Hardened Heart view (which is controversial). If she means "you will get dirty, and you must bear the weight of that," she is advocating for the Walzerian view. The slogan is ambiguous here: does it mean "don't worry about the dirt" or "accept the dirt as your burden"?

  ***

  ### How to Deploy This in Seminar

  To pinpoint your advisor's position, I suggest asking one of the following questions, depending on which thesis you suspect she is holding:

  *   **To test for Self-Indulgence (Thesis #8):** "Professor, are you suggesting that objecting to the coalition is a failure of responsibility, or that the moral cost of the coalition is simply negligible?"
  *   **To test for Structure vs. Agency:** "Is the 'dirt' here specific to this deal with the authoritarian party, or are you arguing that the act of wielding state power in a non-ideal world makes clean hands impossible regardless of the specific policy?"
  *   **To test for Emotional Residue:** "If we take this deal, should we feel remorse for legitimizing an authoritarian party, or does the climate legislation wash that away?"

  **A Note on Your Notes:**
  Don't worry about the "clean hans" typo in your notes; that is purely orthographic dirt, not moral dirt. As the literature suggests, you can wipe that off easily without compromising your integrity.

  Good luck with the seminar. This is a rich vein to mine.
