answer: |-
  Here is a draft of ten interview questions designed to press the deflationist view beyond mere restatement. They are structured to build momentum, starting with the mechanics of the view, moving through the specific objections you requested (with follow-ups), and ending with the question of falsifiability.

  ### Part I: The Mechanics of the Dispute

  **1.** Let's begin by distinguishing your view from a kind of metaphysical nihilism. When you say a dispute is "merely verbal," you aren't suggesting that the objects in question don't exist, but rather that the disagreement is about the rules of our language. But if two philosophers are equally competent speakers of English, equally informed about the facts, and still disagree, what resource do you have to tell them they are talking past each other rather than grappling with a difficult truth?

  **2.** *(Topic A: The Case of Genuine Facts)* I want to press you on a case that seems resistant to the verbal diagnosis: mathematics. If one philosopher asserts "There are infinitely many numbers" and another denies it, this looks like a disagreement about a genuine, mind-independent fact, not a choice of conceptual scheme. How does your view handle this without simply stipulating that mathematical existence is "different" from ontological existence to save the theory?

  > **Follow-up (Keyed to likely answer: *She will likely argue that mathematical existence is governed by internal framework rules, not external reality.*)**:
  > But who gets to write the rules of that framework? If a Platonist insists their framework reflects the "structure of reality" and you insist it reflects "linguistic convention," aren't you now engaged in the very substantive metaphysical dispute you claim to dissolve? How do you adjudicate that higher-order disagreement without begging the question?

  **3.** One of the strongest intuitions driving traditional metaphysics is the phenomenology of disagreement: when I argue with a realist about universals, it *feels* like we are tracking something external. Does your view require us to treat this feeling as a kind of mass illusion, and if so, what psychological or sociological explanation do you offer for why smart people persistently feel they are discovering facts rather than negotiating language?

  **4.** *(Topic B: The Fine/Dogmatism Worry)* Kit Fine has argued that deflationists risk a kind of dogmatism. He suggests that you assume your analysis of our concepts is correct, but "conceptual truths" can be mistaken. If you can declare a dispute verbal based on your analysis of the concept "object," what prevents a realist from declaring your analysis mistaken? How do you avoid a situation where any disagreement can be declared verbal on demand by the person with the louder voice?

  > **Follow-up (Keyed to likely answer: *She will likely appeal to ordinary usage or linguistic competence as the check against dogmatism.*)**:
  > Ordinary usage is notoriously messy and often inconsistent. If you find a conflict between the metaphysician's technical usage and the layperson's ordinary usage, you seem to privilege the latter. Why is the layperson's implicit grasp of "existence" authoritative over the metaphysician's explicit, refined definition? Are you not just enforcing a linguistic status quo?

  **5.** Let's look at the boundary line. You concede some disputes are substantive (e.g., empirical science) and some are verbal. Is there a principled test we can apply to a new metaphysical claim to determine which category it falls into, or is this distinction itself a matter of philosophical interpretation that is open to debate?

  ### Part II: The Stakes and Value

  **6.** *(Topic C: What is at Stake?)* If these disputes are not about the world, then what is actually at stake in them? If we aren't carving nature at its joints, are we merely deciding on a preferred terminology? If so, why should we care enough to fund departments, write books, and build careers around these distinctions?

  > **Follow-up (Keyed to likely answer: *She will likely argue that the stakes are pragmatic, ethical, or about conceptual clarity rather than ontological depth.*)**:
  > Pragmatic clarity is important, but traditional metaphysicians claim they are offering wisdom about the fundamental nature of things, not just a style guide. If you reduce their project to pragmatics, aren't you changing the subject? Why should a metaphysician who cares about *reality* accept your re-description of their life's work as merely a project of linguistic hygiene?

  **7.** There is a worry that if the deflationary view is correct, it undermines the normative force of metaphysics. If there is no "correct" ontology, only "useful" ones, do we lose the ability to criticize harmful conceptual schemes? For instance, if a legal or social system relies on a specific metaphysical view of personhood, can you critique it as *false*, or only as *inconvenient*?

  **8.** Deflationism often relies on the idea that there is a "folk" ontology that is unproblematic, and that metaphysicians complicate it unnecessarily. But isn't it possible that the "folk" ontology is itself deeply confused? If so, doesn't the metaphysician have a duty to correct the language, rather than simply describing how it is currently used?

  ### Part III: Falsifiability and Conclusion

  **9.** You've argued that many classic problems (composition, persistence, universals) dissolve under your view. But is there any specific metaphysical problem that you *cannot* dissolve? Is there a "hard case" where you would concede, "Yes, here the deflationary account fails, and the realist is right"?

  **10.** Finally, the question my readers always ask: What kind of evidence or argument would change your mind? If tomorrow a realist produced a compelling argument that showed a specific metaphysical dispute *must* be substantive regardless of linguistic framing, what would that argument need to demonstrate to convince you to abandon the deflationary stance?
