  6.  **Final Polish:** Ensure the follow-ups are logically connected to the *likely* answers (e.g., if she appeals to "ordinary language," the follow-up challenges the precision of ordinary language). Ensure the distinction between "verbal" and "substantive" is pressed.

      *(Self-Correction during drafting)*: Make sure the follow-ups aren't just "But why?" They need to be specific counter-pressures based on standard objections to deflationism. For the Fine objection, the key is that *conceptual competence* is not transparent. For the Numbers objection, the key is *mathematical objectivity* vs *linguistic convention*.

