answer: |-
  TO: Board of Governors, Marlund Reserve Authority
  FROM: Maya Halden, Joseph Ahlgren
  DATE: 14 October 2024
  SUBJECT: Joint Memorandum on Model Assumptions and Policy Failure

  Pursuant to Review Panel Order 44-B, we submit this joint assessment regarding the failure of the interbank contagion model known as the Halden model. We have been instructed to produce a single document regarding what this episode demonstrates about unrealistic assumptions in scientific and policy models. We have not reached consensus on all underlying philosophical principles. However, we agree on the operational implications for the Authority. The following text distinguishes between our shared findings, our residual technical disagreements, and disputes we now recognize as merely verbal. We have avoided technical jargon unless defined within these pages.

  **I. Joint Claims**

  1.  We define *calibration* as the adjustment of a model's internal numbers to match past data. We define *surrogate credit* as the share of a model's predictive success that a particular false assumption may claim as opposed to the share belonging to the calibration procedure. We agree that during the eleven years of stability, the assumption of instantaneous liquidation accrued positive surrogate credit only insofar as it reduced computational latency, not because it described market mechanics. The success was largely due to calibration masking the structural error.

  2.  We define *de-idealization debt* as the standing backlog of omitted factors that no one has a scheduled obligation to reinsert. We agree that the Halden model accumulated significant de-idealization debt during the period of success, as the assumption of costless counterparty location was treated as a permanent feature rather than a temporary simplification. This debt fell due when the model was carried into a neighbouring domain where liquidation times mattered.

  3.  We define the *convergence ladder* as the ordered family of model variants obtained by reinserting those factors one at a time. We agree that future models must be constructed with a visible convergence ladder, such that the removal of any idealization does not cause the model's output to diverge wildly from the previous rung. A model without a ladder is a black box, not a policy tool.

  4.  We agree that a model's validity in one jurisdiction does not transfer to another with a different settlement structure unless the structural differences are explicitly modeled as variables rather than absorbed into calibration constants. The eleven years of success in Marlund lend no credence to the same model in a jurisdiction with slower settlement protocols.

  5.  We agree that the demand for "realistic" assumptions is incoherent if it requires total description, but coherent if it requires that the distance between the assumption and reality be measurable and manageable. An assumption is auditable not when it is true, but when the cost of its falsehood can be estimated in advance.

  **II. Table of Residual Disagreements**

  | Issue | Halden Formulation | Ahlgren Formulation | Crux | Accepted Case | Prior Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Surrogate Credit** | The liquidation assumption earned credit by enabling speed, which is a functional virtue. | The assumption earned no credit; calibration did the work while the assumption slept. | Can a false mechanism generate true numbers reliably? | The eleven-year stability period. | Halden: New model works if calibrated. Ahlgren: It will fail without structural change. |
  | **Multiple Realization** | If incompatible false assumptions yield same numbers, the model is robust. | If incompatible assumptions yield same numbers, the model describes nothing. | Is the goal prediction or explanation? | Hypothetical alternative model test. | Halden: Indifferent to mechanism. Ahlgren: Requires mechanism match. |
  | **Convergence Ladder** | Expect a sequence of predictions that steadily approaches observed behaviour. | Expect a qualitative change at some rung, stabilizing the mechanism. | Continuity vs. Phase change. | Step-wise reinsertion of friction. | Halden: Smooth curve. Ahlgren: Step-change then stability. |
  | **Cross-Jurisdiction** | Valid if calibration constants are updated for the new jurisdiction. | Valid only if the settlement structure matches the model's topology. | Universality vs. Specificity. | Application to foreign reserve data. | Halden: Transferable with tuning. Ahlgren: Not transferable. |
  | **Auditable** | Auditable means traceable output from input. | Auditable means reversible assumption to reality. | Traceability vs. Reversibility. | The Review Panel's regulations. | Halden: Code audit suffices. Ahlgren: Logic audit required. |

  **III. Verbal Disputes**

  We concede that the following disputes were about words rather than substance, and we will cease using them to obstruct policy:

  1.  Whether the word "unrealistic" applies to individual assumptions or only to whole models. We agree that an assumption can be false while the model is useful, and that calling the assumption "unrealistic" is shorthand for "known to be false."
  2.  Whether the word "auditable" means traceable code or reversible logic. We agree that for the Authority's purposes, it must mean both: the code must be traceable, and the logic must be reversible enough to estimate error.
  3.  Whether the model "failed" or the "environment changed." We agree that the model failed because it could not accommodate the environment change, which is the same thing for policy purposes.

  **IV. Closing Statement**

  We sign this document acknowledging that our previous positions were insufficient. Maya Halden concedes that instrumental success is not self-justifying; a model that works for the wrong reasons accumulates hidden liabilities that eventually exceed its utility. The falsity of an assumption is a defect if it prevents us from knowing why the model works. Joseph Ahlgren concedes that perfect realism is impossible and that demanding full mechanistic truth paralyzes policy; a model that predicts correctly has value even if its internal story is false, provided the debt is managed. We agree that a model is neither a map nor a engine, but a scaffold. It must hold weight, but it must also be possible to dismantle it without bringing down the building. We recommend that the Authority adopt the convergence ladder as a standard requirement for all future risk models.

  Signed,

  Maya Halden
  Joseph Ahlgren
