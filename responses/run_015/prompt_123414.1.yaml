answer: |-
  The meta-science reform movement presents a fascinating case study in the gap between methodological rhetoric and scientific practice. To understand what methodology it actually presupposes, we must disentangle the normative goals of the reformers from the descriptive reality of how scientific communities respond to evidence.

  ### 1. Rhetoric vs. Practice: Popper vs. Lakatos

  The movement's **rhetoric** is indeed naively falsificationist. It speaks the language of Karl Popper: bold conjectures, severe tests, and the willingness to reject hypotheses when data contradict them. Preregistration is sold as a mechanism to lock in these "risky predictions," preventing the "garden of forking paths" from turning a non-falsifiable process into a seemingly confirmatory one.

  However, the **practice** you describe—where failed replications of famous effects (like ego depletion) do not lead to the abandonment of the underlying theory but rather to searches for hidden moderators, protocol differences, or boundary conditions—is textbook **Lakatosian**. In Imre Lakatos's "Methodology of Scientific Research Programmes" (MSRP), a research programme consists of a "hard core" of fundamental assumptions protected by a "negative heuristic" (which forbids direct attacks on the core) and a "protective belt" of auxiliary hypotheses. When an anomaly arises (a failed replication), the negative heuristic directs scientists to adjust the protective belt (e.g., "the effect only holds under condition X") rather than discard the hard core.

  The reform movement's response to replication failures—demanding *more rigorous* tests rather than abandoning the programme—confirms that the unit of appraisal is not the single hypothesis (Popper) but the research programme (Lakatos). The "crisis" is not declared because a single theory was falsified, but because the *aggregate* evidence suggests the programme may be stagnating or degenerating.

  ### 2. The Lakatosian Scorecard and the Novelty Problem

  You raise a critical objection regarding a "Lakatosian Scorecard." If preregistration makes every prediction temporally novel, does it trivialize Lakatos's criterion of *novel facts*?

  Lakatos distinguished between *temporal* novelty (predicted before the data is known) and *heuristic* novelty (predicted without using the data to construct the theory). Preregistration guarantees temporal novelty but not necessarily heuristic novelty. A flexible protective belt can be adjusted *before* data collection to accommodate any outcome, rendering the prediction vacuous. Therefore, a Lakatosian scorecard cannot rely on timing alone; it must assess whether the auxiliary adjustments are *ad hoc* (saving the theory without generating new predictions) or *theoretically progressive* (leading to new, corroborated predictions).

  This leads to your second point: **Retrospectivity.** Lakatos admitted that distinguishing a progressive from a degenerating programme is often only possible historically. From the inside, a scientist cannot know if a hidden moderator is a genuine discovery (progressive) or a face-saving device (degenerating). A funder's real-time scorecard cannot solve this epistemic limitation. It can only track *symptoms* of degeneration (e.g., a high ratio of auxiliary adjustments to novel predictions). Thus, the movement's demand for "decisive" institutional decisions is indeed incoherent if viewed as a strict logical appraisal, but it functions as a sensible **institutional workaround**. It forces the protective belt to be explicit (via preregistration), making the *cost* of ad hoc adjustments higher, even if it cannot logically prove degeneration in real-time.

  ### 3. Strict Presuppositions vs. Methodological Fit

  Here we must separate what the reforms *require* from what they *support*.

  *   **Strictly Presupposed:** The reforms strictly presuppose **Realism** (there is a fact of the matter about the effect) and **Fallibilism** (our methods are prone to bias). They do not strictly presuppose a specific philosophy of science.
  *   **Fits Well With (Underdetermination):**
      *   **Bayesian Evidentialism:** This fits the statistical reforms best. Bayesians agree that "no single study is decisive" and that evidence should accumulate. Preregistration clarifies the likelihood function by preventing HARKing (Hypothesizing After Results are Known). A Bayesian would view the "ego depletion" crisis not as a falsification, but as a massive likelihood ratio update shifting credence downward.
      *   **Lakatosian:** This fits the *sociology* best. It explains why programmes survive failure and why the unit of change is the "programme" rather than the "paper."
      *   **Naive Falsificationism:** This fits the *marketing* best. It provides a clear, actionable narrative for funders and journalists ("We are testing and rejecting bad ideas"), even if it doesn't match the complex reality of theory change.
      *   **Kuhnian:** This fits the *crisis narrative*. The "Replication Crisis" is a Kuhnian moment where anomalies accumulate until the paradigm is threatened. However, Kuhn offers fewer normative tools for *reform* than Lakatos or Bayes.

  The practice is **genuinely underdetermined** regarding the *tools* (preregistration, open data). A Bayesian, a Lakatosian, and a Popperian would all agree on these tools, but for different reasons. The Bayesian wants accurate likelihoods; the Popperian wants severe tests; the Lakatosian wants to check the progressive shift of the programme.

  ### 4. Institutional Implications of Programme Appraisal

  If we dropped the pretense of decisive single tests and appraised programmes explicitly (adopting the Lakatosian view honestly), institutions would need to shift fundamentally:

  *   **Journals:** Would move away from publishing "breakthrough" single studies. They would prioritize **Registered Reports** (committing to the test before the result) and **Systematic Reviews/Meta-analyses** (assessing the programme's trajectory). "Null results" would be valued as data points on the programme's health, not as failures of the author.
  *   **Funders:** Would fund **lines of inquiry** rather than discrete projects. Evaluation would be based on the **predictive track record** of a research line over 5-10 years, rather than publication counts in high-impact journals. They would incentivize replication work as "maintenance" of the research infrastructure.
  *   **Hiring Committees:** Would evaluate candidates on the **coherence and robustness** of their research programme. Did their predictions hold up across labs? Did they generate novel facts, or just absorb anomalies? The "h-index" would be supplanted by metrics of reproducibility and theoretical contribution.

  ### Conclusion

  The meta-science movement's rhetoric is Popperian, but its practice is **Lakatosian**. It treats theories as resilient programmes that survive anomalies via protective belts, yet it attempts to regulate that resilience to prevent degeneration. While the specific *tools* of reform are underdetermined (compatible with Bayesian and Popperian views), the *structure of scientific change* it confronts and attempts to manage is best described by Lakatos's sophisticated falsificationism. The movement is essentially an attempt to make Lakatosian appraisal operational in real-time, despite the epistemic limitations Lakatos himself identified.

  \answer{lakatosian}
