          *   *Verdict:* User is right. PCI is consistent with IIT but not a *falsification* of competitors. It's a "severity of consciousness" metric, not a specific IIT test.

      *   **Claim 3: "The core theory is circular — you can't compute Phi without already having picked out which system is the conscious one." (User) & "IIT 4.0 just dropped [exclusion]... so the circularity objection is dead." (Sam)**
