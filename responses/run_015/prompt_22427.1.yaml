          *   *Analysis:* IIT predicts the cerebellum contributes little to $\Phi$ despite high neuron count because of its modular, feedforward structure. Lesion studies suggest consciousness remains intact after cerebellar damage.
          *   *Verdict:* Sam is right that it is a bold, testable prediction. User is right that defenders sometimes waffle on *why* (e.g., appealing to thalamocortical loops as the "main" substrate). However, empirically, the cerebellum prediction is one of IIT's strongest points against GNW (which might expect cerebellar involvement if it's about global broadcasting).

