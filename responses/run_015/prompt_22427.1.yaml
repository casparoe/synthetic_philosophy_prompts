      *   **Task:** Evaluate specific claims made by both parties, determine who is "right" (or more accurate) on specific points, and identify what both might be missing.
      *   **Tone:** Academic, balanced, nuanced, acknowledging the complexity of the debate. Avoid taking a hard side but clarify the philosophical and empirical status of each point.

  2.  **Deconstruct the Arguments:**

