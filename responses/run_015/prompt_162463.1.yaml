  We are gathered here knowing that Ilse spent three decades chasing a ghost in a few lines of French, a commitment that often kept her quiet at the table while you waited for her attention, wondering when she would look up. To those who loved her most, that silence at the desk sometimes felt like a wall between you and her, and her absence was felt even when she was in the room, leaving you to wonder why a poem mattered more than the people around her. That hurt is real and deserves to be named alongside her dedication, because the love she gave to Marot was sometimes taken from the time she might have given to you, and that trade-off was real.

  She believed that every gain in music demanded a loss in meaning, so she refused to choose a final text, insisting instead that each of the two hundred and fourteen drafts was a unique sacrifice, none superior to the rest. You who know the craft understand that she was not building a monument, but keeping a ledger of beautiful failures where no line could reappear unchanged and no version could claim superiority over another. She knew the poem was notorious, but she wanted to prove that translation is not a puzzle to be solved, but a series of incomparable choices that resist ranking, defying the urge for closure.

  Her notebook lists the things she could never carry over, like the caesura on the fourth syllable or the sudden drop into worry, marking the boundaries where language simply refuses to bend to the will of the translator, no matter how many years are spent trying to force the match. She did not see these gaps as mistakes, but as the precise shape of her devotion, proving that she valued the truth of the struggle over the comfort of a resolved ending, and that some debts remain unpayable by any hand, and that was the point of the ledger.

  To her sister, I say that this obsession was not time stolen from life, but her specific way of inhabiting it, a daily practice of fidelity that required her to show up even when the solution retreated, year after year, without expectation of reward. The value was not in the solving, but in the thirty-one years of showing up to the problem with honesty, demonstrating that a life can be full without ever claiming to be finished, and that presence is its own reward, enough to sustain a lifetime.

  We do not need to pick a favorite draft to honor her, because she taught us that the choosing matters more than the chosen, and that taste is an act of love rather than discovery, a gift we can all share. Her legacy is not the paper she left behind, but the rigorous love she practiced while writing it, leaving us with the permission to value our own unfinished efforts without shame, and to hold them close.
