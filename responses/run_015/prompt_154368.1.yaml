prompt: |-
  I write novels — close third, past tense, the usual — and I've been reading Smith's Theory of Moral Sentiments in a rented cabin with one battered paperback and no library, so please don't send me off to secondary literature or hand me a reading list. What I actually want is help figuring out what I think about sympathy, since I spend my working life manufacturing it and I have alot of strong opinions about it that don't obviously add up.

  Here are my verdicts, gut-level, from drafting and from reader mail.

  1. One sock left in the drawer undoes readers. A paragraph about two hundred people dead does almost nothing. I exploit this deliberately and feel slightly bad about it.
  2. The scene where the character says nothing at all at the worst moment gets the strongest response in the book. So the biggest payoff comes where there's apparently no passion on the page to feel with.
  3. Three pages inside a genuinely bad man's head while he feels remorse, and readers are entirely with him. I think that's fine. I don't think it corrupts anybody.
  4. A character who wrecks her own life through laziness and small lies: readers go cold. Roughly the same quantity of suffering as 2, opposite response.
  5. A character who narrates her own grief for six pages: readers bail. I file that as a craft failure, not a moral one — but note it's the same suffering as 2 again.
  6. My most reliable tool is second-hand: a minor character noticing the protagonist's hands shaking gets more tears than any direct description of what the protagonist is feeling. Which is weird, because it means I'm getting readers to feel by showing somebody else feeling.
  7. Death scenes. The dead feel nothing and the reader feels the most. I tell myself the grief is really for the people in the room, but I'm not convinced that's the whole of it.
  8. Dramatic irony — reader knows the letter is a rejection, character is delighted — produces something that isn't pity and isn't fear. I'd call it dread. There's no passion onstage to enter into at all.
  9. Just writing "she was heartbroken" kills it dead. Sympathy seems to need the reader to do the imagining themselves.
  10. Big joy is thin and embarrassing to write; tiny joy lands fine — getting the window seat, the train leaving without her. Which I think cuts against the thing people always say about Smith, that we enter into cheerful passions more readily.
  11. Second person: half my readers feel it intensely, half feel handled. Exact same sentences.
  12. Twelve grieving people in a room and I feel less per person than I would for one. That seems backwards if sympathy is supposed to feed on itself.

  And the one I keep flip-flopping on: the wife who's being made a fool of and never finds out. I want readers to feel for her, I can't tell whether what I'm producing is fellow-feeling or something nastier, and I can't decide whether it's okay to write it.

  My own stab at a principle, three clauses: (a) readers feel in proportion to how much imagining the page makes them do — nothing to do with the size of the suffering, and telling them what to feel is fatal; (b) quite separately, readers warm or cool depending on whether the passion fits its cause and whether the character seems to have deserved it, and this runs independently of (a); (c) the spectator isn't impartial at all, it's a guy I built and stood in the room, usually as literally as possible.

  Test that against the twelve, tell me which clause breaks and repair it. If it turns out I need two principles — one for feeling-with and one for approval — say so and say exactly where they come apart. Tell me which of my verdicts the repaired version forces me to drop, and be honest if it's more than one. And say where Smith's own kit — sympathy, propriety, the man within the breast — already covers this and where fiction needs something added to it.

  Then give me its verdicts on cases I haven't listed: a narrator who speaks after her own death; a chapter told from a dog's point of view; a chapter told from a dog's point of view; an omniscient chapter that withholds the protagonist's inner state entirely; and a book where you're told the ending in the first sentence.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A novelist (close third, past tense).
      *   **Context:** Reading Adam Smith's *The Theory of Moral Sentiments* (TMS) in isolation (cabin, one book, no library).
      *   **Constraint:** Do *not* suggest secondary literature or reading lists. Stick to the text and the user's experience.
      *   **Goal:** Help the user figure out what *they* think about sympathy based on their 12 verdicts/observations from writing.
      *   **Task:**
          1.  Test the user's proposed 3-clause principle against their 12 verdicts.
          2.  Identify which clause breaks and repair it.
          3.  Determine if two principles are needed (feeling-with vs. approval) and where they diverge.
          4.  Identify which verdicts must be dropped/modified.
          5.  Map this against Smith's actual concepts (sympathy, propriety, impartial spectator).
          6.  Apply the repaired principle to new cases (dead narrator, dog POV, omniscient withholding, spoiler opening).
      *   **Tone:** Intellectual, practical, craft-focused, respectful of the user's expertise, avoiding academic pedantry.

  2.  **Deconstruct the User's 12 Verdicts:**
      1.  *One sock vs. 200 dead:* Specificity > Scale. (Imagination trigger).
      2.  *Silence at worst moment:* Restraint > Expression. (Imagination trigger).
      3.  *Bad man's remorse:* Access to interiority creates sympathy even for "bad" acts. (Imagination/Approval tension).
      4.  *Laziness/small lies:* Suffering doesn't guarantee sympathy if cause is moral failing. (Approval).
      5.  *Narrating grief (6 pages):* Direct statement kills sympathy. (Imagination trigger).
      6.  *Second-hand (shaking hands):* Observer reaction > Subject feeling. (Spectator mechanism).
      7.  *Death scenes:* Dead feel nothing, reader feels most. (Spectator grief vs. Subject feeling).
      8.  *Dramatic Irony:* Dread without passion onstage. (Knowledge gap).
      9.  *Telling ("she was heartbroken"):* Kills sympathy. (Imagination trigger).
      10. *Big joy vs. Tiny joy:* Restraint in joy works better. (Propriety/Imagination).
      11. *Second Person:* Polarizing. (Spectator position).
      12. *Twelve grieving people:* Diffusion of focus reduces sympathy. (Imagination limit).
      *   *Flip-flop:* Wife made fool of (Pity vs. Voyeurism).

  3.  **Evaluate the User's 3-Clause Principle:**
      *   *(a) Readers feel in proportion to how much imagining the page makes them do... telling them what to feel is fatal.*
          *   Supports: 1, 2, 5, 6, 9, 10, 12.
          *   Conflict: 3 (Remorse is direct interiority, yet works), 8 (Dread comes from knowledge, not necessarily imagination of feeling).
      *   *(b) Readers warm or cool depending on whether the passion fits its cause and whether the character seems to have deserved it...*
          *   Supports: 3, 4.
          *   Conflict: 1 (200 dead *should* fit cause, but doesn't work), 7 (Dead deserve nothing, yet we feel).
      *   *(c) The spectator isn't impartial at all, it's a guy I built and stood in the room...*
          *   Supports: 6, 11.
          *   Conflict: 12 (Why does adding more spectators/subjects dilute it?).

  4.  **Smithian Analysis (Mental Check):**
      *   *Sympathy (in TMS):* Not pity. It's "fellow-feeling with any passion whatever." It requires imagining oneself in the other's situation.
      *   *Propriety:* The suitability of the emotion to the cause. We sympathize more if the emotion matches what we would feel.
      *   *Impartial Spectator:* The conscience within. We judge ourselves and others by this standard.
      *   *Key Smithian Insight:* We sympathize more with sorrow than joy (usually). We sympathize with the *living* mourners more than the dead. We cannot fully enter into another's pain; we enter into our *idea* of their pain.

  5.  **Synthesizing and Repairing the Principle:**
      *   *Problem with Clause (a):* It's too cognitive. It's not just "imagining," it's "imagining *myself* in that situation." Verdict 3 (bad man's remorse) works because we imagine *our own* capacity for remorse, not necessarily approving his past acts. Verdict 5 fails because the character doing the narrating blocks the reader from doing the imagining.
      *   *Problem with Clause (b):* "Deserved" is too moralistic. Smith talks about *propriety* (fittingness). Verdict 1 (200 dead) fails not because they didn't deserve it, but because the scale breaks the imagination. Verdict 4 (laziness) fails because the suffering doesn't match the cause in a way the spectator accepts (lack of propriety).
      *   *Problem with Clause (c):* The "built guy" is the *Impartial Spectator*, but in fiction, the author controls the *distance*. Verdict 12 suggests the spectator has a limited focal capacity.
      *   *The Split:* The user suspects a split between "feeling-with" (Sympathy) and "approval" (Merit/Propriety). Smith agrees. We can sympathize with a grieving murderer (feeling-with) while condemning the murder (approval).
      *   *Repair:*
          *   Principle 1 (Mechanism): Sympathy is an act of *projection*, not reception. The reader must inhabit the situation, not the emotion. (Fixes 2, 5, 6, 9).
          *   Principle 2 (Judgment): Sympathy is modulated by *Propriety*. Does the emotion match the cause *as I would feel it*? (Fixes 3, 4, 10).
          *   Principle 3 (The Spectator): The Spectator is not a person in the room, but a *limit of attention*. (Fixes 1, 12).

  6.  **Drafting the Response:**
      *   *Acknowledge the constraint:* No library, just Smith and the craft.
      *   *Validate the User:* Their instincts are remarkably Smithian, often more than they realize.
      *   *Critique the 3 Clauses:*
          *   (a) is mostly right but needs to specify *whose* imagination.
          *   (b) is the "Propriety" clause but conflates "desert" with "fittingness."
          *   (c) is the weakest. The spectator isn't a "guy," it's a function of attention.
      *   *The Split:* Yes, you need two principles. Smith calls them "Sympathy" (feeling-with) and "Merit/Demerit" (approval). They diverge at Verdict 3 (Bad man).
      *   *Verdicts to Drop/Modify:*
          *   Verdict 1: It's not about the sock vs. bodies; it's about *singular* vs. *statistic*. Smith says we sympathize with one man's loss more than a million strangers. Keep the insight, refine the reason.
          *   Verdict 12: Smith explicitly says sympathy dilutes in a crowd. Keep it.
          *   Verdict 3: Clarify that we sympathize with the *remorse*, not the *man*.
      *   *Smith's Kit:*
          *   *Sympathy:* Changing places in fancy.
          *   *Propriety:* Congruence of affection and cause.
          *   *Impartial Spectator:* The judge.
      *   *New Cases:*
          *   *Dead Narrator:* Breaks the "living spectator" rule. Works only if they mourn their own loss (Smithian paradox).
          *   *Dog POV:* Harder. We project humanity onto the dog.
          *   *Omniscient Withholding:* Creates dread (Verdict 8).
          *   *Spoiler Opening:* Shifts focus from *what* to *how*.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, check Verdict 10 (Joy).* Smith says we sympathize more with sorrow than joy. The user says "Big joy is thin." This aligns perfectly with Smith. I need to make sure I highlight that alignment.
      *   *Check Verdict 6 (Second-hand).* Smith says we sympathize more with the mourner than the dead. This is exactly Verdict 6 & 7.
      *   *Check Verdict 11 (Second Person).* Smith's sympathy requires a distance. "You" collapses the distance too much for some (aggression) and not enough for others (intimacy). It disrupts the "Impartial Spectator."
      *   *The "Wife made a fool of" case:* This is the tension between Sympathy (we feel her pain) and Merit (we feel the injustice). If she never knows, is it pity or tragedy? Smith would say it depends on whether the *reader* feels the indignity.

  8.  **Final Polish:** Ensure the tone is collaborative ("Let's test this"), not lecturing. Keep the Smith references grounded in TMS concepts without quoting chapter/verse unnecessarily. Focus on the *mechanism* of fiction.

      *(Self-Correction on the "Two Principles" request)*: The user asked: "If it turns out I need two principles — one for feeling-with and one for approval — say so and say exactly where they come apart."
      *   *Decision:* Yes, they come apart at Verdict 3. We feel the remorse (Sympathy) but might not approve the past (Merit). But actually, Smith says Merit depends on Sympathy with the *gratitude* of the beneficiary. In fiction, it's simpler: Sympathy is access; Approval is judgment.
      *   *Refinement:* Let's call them **The Mechanism of Entry** (Imagination/Projection) and **The Condition of Propriety** (Fit/Desert).

      *(Self-Correction on "Which verdicts to drop")*: I shouldn't tell them to drop their *observations* (those are data). I should tell them to drop their *interpretations* of those observations if they contradict the repaired principle.
      *   Actually, Verdict 1's interpretation ("I exploit this") might need nuance. It's not exploitation, it's cognitive limitation.
      *   Verdict 3's interpretation ("I don't think it corrupts anybody") is moral, not craft. Keep the craft insight, ignore the moral defense for now.

      *(Final check on constraints)*: No reading lists. Stick to the cabin context.

      *Let's structure the response:*
      1.  Diagnosis of the 3 Clauses.
      2.  The Split (Feeling vs. Approval).
      3.  Smithian Alignment (Where you match, where you diverge).
      4.  The Repaired Principle.
      5.  Application to New Cases.
      6.  The "Wife" Verdict.

      *Wait, one detail in the prompt:* "A chapter told from a dog's point of view" is listed twice in the "new cases" section. I should probably address it once, or note the repetition as a joke/test. I'll address it once seriously.

      *Wait, another detail:* "Tell me which of my verdicts the repaired version forces me to drop."
      *   I need to be careful here. The verdicts are *empirical observations* from their writing. I can't tell them their experience is wrong. I can only tell them their *explanation* for the verdict is wrong.
      *   *Correction:* I will interpret "drop" as "reject the current interpretation of." Or, perhaps, one verdict contradicts another?
      *   Verdict 3 (Bad man remorse = sympathy) vs Verdict 4 (Bad character laziness = no sympathy).
      *   Difference: Remorse implies recognition of propriety violated. Laziness implies indifference to propriety. So they are consistent.
      *   Verdict 2 (Silence = strong) vs Verdict 5 (Narrating grief = weak). Consistent (Imagination).
      *   Okay, I won't force them to drop an observation, but I will challenge the *conclusion* drawn from Verdict 1 (exploitation) and Verdict 3 (corruption).

      *Let's get writing.*
answer: |-
  You are working in the dark with the right book. Smith's *Theory of Moral Sentiments* is not a moralizing text; it is a mechanics text. It describes how the engine of human judgment runs. Your twelve verdicts are empirical data from the factory floor. They are accurate. Your three-clause principle is your attempt to write the manual for the engine.

  Here is the diagnosis: Your Clause (a) is the strongest, Clause (b) is necessary but misnamed, and Clause (c) is the weak link that threatens to collapse the whole structure.

  ### 1. Testing the Three Clauses

  **Clause (a): *Readers feel in proportion to how much imagining the page makes them do.* **
  *   **Verdicts Supported:** 1, 2, 5, 6, 9, 10, 12.
  *   **The Break:** It fails on Verdict 3 (the bad man's remorse). If sympathy relies on the reader imagining *themselves* in the situation, a "genuinely bad man" should block that projection. Yet it works. Why? Because the reader isn't imagining being *him*; they are imagining the *sensation of remorse* itself, which is universal.
  *   **The Break:** It also wobbles on Verdict 8 (Dramatic Irony). Dread isn't generated by imagining the character's feeling (they are delighted); it's generated by the reader holding two conflicting realities at once. That is cognitive dissonance, not imaginative projection.

  **Clause (b): *Readers warm or cool depending on whether the passion fits its cause and whether the character seems to have deserved it.* **
  *   **Verdicts Supported:** 3, 4, 10.
  *   **The Break:** It fails on Verdict 1 (200 dead). By any metric of "desert" or "cause," 200 dead is a massive cause. The passion *should* fit. But it doesn't land. This clause confuses *moral desert* with *cognitive scale*. Smith argues we sympathize with one man's toothache more than a million strangers' starvation. It's not about justice; it's about the limits of the imagination.
  *   **The Break:** It fails on Verdict 7 (Death scenes). The dead deserve nothing and feel nothing. The grief is entirely for the survivors. If this clause were true, the dead character's "undeserved" death should trigger outrage, but you say the grief is for the people in the room.

  **Clause (c): *The spectator isn't impartial at all, it's a guy I built and stood in the room.* **
  *   **Verdicts Supported:** 6, 11.
  *   **The Break:** This is the dangerous one. If the spectator is a "guy you built," you are directing the reader's judgment too closely. Verdict 11 (Second Person) proves this. Half your readers feel handled because you have removed their ability to *be* the spectator. You have replaced their internal judge with your external narration.
  *   **The Break:** Verdict 12 (Twelve grieving people). If the spectator is just a guy in the room, adding more people should add more emotion. Instead, sympathy dilutes. This suggests the spectator is not a person, but a *focus of attention* with a fixed aperture.

  ### 2. The Split: Feeling-With vs. Approval

  You asked if you need two principles. **Yes.** Smith separates these explicitly, though he weaves them together. In fiction, they must be disentangled to work.

  1.  **The Principle of Entry (Sympathy):** This is mechanical. It governs whether the reader can access the emotion. It relies on *specificity*, *restraint*, and *projection*.
  2.  **The Principle of Propriety (Merit):** This is moral. It governs whether the reader *endors* the emotion. It relies on *cause*, *consequence*, and *agency*.

  **Where they come apart:**
  They come apart at **Verdict 3** (The Bad Man).
  *   **Entry:** We enter. We feel the remorse. The mechanism works.
  *   **Propriety:** We do not approve of the past acts. But because the *current* passion (remorse) fits the *current* cause (realization of evil), Propriety is satisfied in the present moment.
  *   **The Conflict:** You said, "I don't think it corrupts anybody." That is a moral claim. The craft reality is: You have successfully decoupled Entry from Approval. The reader feels the pain without endorsing the history. This is the definition of tragedy.

  They also come apart at **The Wife Who Never Finds Out**.
  *   **Entry:** We feel her confusion or her quiet dignity.
  *   **Propriety:** We feel indignity on her behalf because the cause (her husband's betrayal) does not match her passion (trust).
  *   **The Nastiness:** If you linger here, you move from Sympathy to **Voyeurism**. Smith distinguishes between "sympathy" (fellow-feeling) and "pity" (sorrow for another). If she never knows, the reader becomes the sole possessor of the truth. That power dynamic is intoxicating. If you write it to make the reader feel *superior* to her, it is nasty. If you write it to make the reader feel *helpless* for her, it is tragic.

  ### 3. Repairing the Principle

  Drop Clause (c). It is the error. The spectator is not a character you build; it is the **space you leave**.

  **The Repaired Principle:**
  1.  **Sympathy is an act of projection, not reception.** The reader cannot feel what the character feels; they can only feel what *they* would feel if they were in the character's situation. Therefore, the text must provide the *situation* (the shaking hands, the sock) and withhold the *emotion* (the heartbreak). (Fixes 1, 2, 5, 6, 9).
  2.  **Propriety is the congruence of passion and cause, judged by the reader's own standard.** The reader warms when the character's reaction matches what the reader's "Impartial Spectator" would feel. Suffering caused by laziness (Verdict 4) fails because the reader's Spectator says, "I would not have lied." Suffering caused by bad luck (Verdict 2) succeeds because the Spectator says, "I would be silent too." (Fixes 3, 4, 10).
  3.  **The Spectator has a fixed focal limit.** Sympathy requires a singular object. It cannot be split twelve ways (Verdict 12). It cannot be forced via "You" (Verdict 11) because that invades the Spectator's seat. (Fixes 11, 12).

  **Verdicts you must modify:**
  *   **Verdict 1:** You say, "I exploit this deliberately." Stop thinking of it as exploitation. It is not a trick; it is a biological limit. You cannot "fix" this by making the 200 dead more vivid. The principle forces you to accept that fiction is inherently singular. You must choose the *one* sock.
  *   **Verdict 3:** You say, "I don't think it corrupts anybody." Drop the moral defense. It doesn't matter if it corrupts them. What matters is that you have proven Sympathy (Entry) is independent of Moral Approval. Acknowledge that you are making the reader complicit in the remorse, not the crime.
  *   **Verdict 10:** You say this cuts against Smith. It does not. Smith explicitly states (Part I, Section III) that we sympathize more with sorrow than joy. "Big joy" looks like mania to the Spectator. "Tiny joy" looks like propriety. Your instinct is more Smithian than the critics.

  ### 4. Smith's Kit vs. Fiction's Needs

  **Where Smith Covers It:**
  *   **The Impartial Spectator:** This is your reader. They are sitting in the cabin with you. They are judging your characters by their own standards. You cannot tell them how to judge; you can only present the evidence.
  *   **Propriety:** This explains why "she was heartbroken" (Verdict 9) fails. It is an assertion of passion without evidence of cause. It violates propriety because it demands a feeling without providing the grounds for it.
  *   **Sorrow > Joy:** Smith notes that the pain of grief is more acute than the pleasure of joy. We are more willing to enter into sorrow. This validates your "tiny joy" observation.

  **Where Fiction Needs Something Added:**
  *   **Control of Information:** Smith's Spectator sees the situation. In fiction, *you* decide what the Spectator sees. Verdict 8 (Dramatic Irony) is a fictional tool Smith doesn't fully account for. In life, we usually don't know the letter is a rejection while the character opens it. In fiction, you can force the Spectator to know more than the subject. This creates **Dread**, which is distinct from Sympathy. Dread is Sympathy + Foreknowledge.
  *   **Time:** Smith's judgments are immediate. Fiction allows you to delay the judgment. Verdict 5 (Six pages of grief) fails because it sustains the passion too long. Propriety decays over time. Grief is proper in a scene; grief becomes self-indulgence in a chapter.

  ### 5. Verdicts on New Cases

  Here is the Repaired Principle applied to your unlisted scenarios:

  **A narrator who speaks after her own death.**
  *   **Verdict:** **High Risk / Low Sympathy.**
  *   **Reasoning:** Smith's sympathy requires a living subject to project into. A dead narrator has no situation to imagine. They are a ghost. To make this work, the narrator must not speak of *being dead*, but of *having been alive*. They must mourn their own past life as if it were another person's. If they narrate their death, it is vanity. If they narrate the grief of those they left behind, it works (Verdict 7).

  **A chapter told from a dog's point of view.**
  *   **Verdict:** **Works only via Anthropomorphism.**
  *   **Reasoning:** We cannot project ourselves into a dog's situation because we do not know what it is to be a dog. We only sympathize because we imagine the dog as a *human child* or a *loyal servant*. If the dog feels "betrayal," we feel it. If the dog feels "canine confusion," we detach. The sympathy is for the human emotion projected onto the animal.

  **An omniscient chapter that withholds the protagonist's inner state entirely.**
  *   **Verdict:** **Generates Dread (Verdict 8) or Mystery, not Sympathy.**
  *   **Reasoning:** This removes the data required for Projection (Clause 1). The reader cannot imagine the situation fully. This forces the reader into the role of the "Impartial Spectator" judging from a distance. It creates authority, but it reduces intimacy. Use this when you want the reader to judge the character, not feel with them.

  **A book where you're told the ending in the first sentence.**
  *   **Verdict:** **Shifts Sympathy to Propriety.**
  *   **Reasoning:** Since the *what* is known, the reader's imagination focuses entirely on the *how*. This aligns with Verdict 2 (Silence/Restraint). The reader is no longer asking "What will happen?" but "How will she bear it?" This increases the focus on Propriety. We watch to see if her reactions fit the known doom. It can heighten tragedy (Oedipus) or create fatalism.

  ### Final Word on the Wife

  Regarding the wife who is made a fool of and never finds out:
  If you write this to make the reader feel **pity**, you must show her dignity.
  If you write this to make the reader feel **indignation**, you must show the husband's cruelty.
  If you write this to make the reader feel **superior**, you are writing pornography of a sort.

  Smith says we sympathize with the person who is striving to master their emotion. If she suspects nothing and is happy, we feel unease (Dread). If she suspects and suppresses it, we feel Sympathy. If she is oblivious and you mock her, we feel Contempt.

  Your instinct that it might be "nastier" than fellow-feeling is correct. It borders on the sadistic pleasure of the Spectator who sees the flaw that the Subject does not. To sanitize it, you must ensure the reader suffers *with* the ignorance, not *above* it. Give the reader the same limitation, or make the cost of the truth too high to wish it known.

  You are not manufacturing sympathy. You are building the room where the reader's own sympathy can occur. Get out of the way.
