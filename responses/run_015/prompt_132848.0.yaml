      *   *The Pivot:* Doxastic Voluntarism. If I can't choose my beliefs, can I be morally obligated (Clifford) or morally permitted (James) to form them in a certain way?
      *   *The Prerequisite Concept:* The distinction between *propositional attitude formation* (passive) vs. *policy of inquiry* (active). Or, more precisely, the distinction between *direct* voluntary control (believing at will) vs. *indirect* voluntary control (cultivating habits of mind). Both Clifford and James actually rely on *indirect* control, but they frame the moment of decision differently.
      *   *Refining the Prerequisite:* To make James's "genuine option" work, students must understand belief not as a static state but as a *commitment to act*. To make Clifford's shipowner work, they must see belief as a *habit-forming action*. The common ground is *Belief as a Disposition to Act*.

  3.  **Develop the "Carrying Scenario":**
      *   Need something high-stakes, evidentially ambiguous, and requiring action.
      *   *Idea 1:* A medical diagnosis. (Good, but maybe too technical).
      *   *Idea 2:* A political revolution. (Too abstract).
      *   *Idea 3:* A rescue mission in uncertain conditions. (Classic, fits the "climber" vibe but unifies it).
      *   *Selection:* **The Rescue Team Leader.**
      *   *Scenario:* You lead a team. A survivor is trapped. Evidence is 50/50 on whether they are alive. Going in risks the team. Staying out guarantees death if they are alive.
      *   *Why:* It captures the "forced" and "momentous" nature (James) and the "public trust/risk to others" nature (Clifford). It avoids specific religious baggage.

  4.  **Drafting the Explanatory Arc:**
      *   *Step 1:* Establish the Normative Gap. Why do we need ethics for belief at all? (Beliefs cause actions).
      *   *Step 2:* The Control Condition. Can we be blamed/praised for things we can't control? Introduce Indirect Voluntarism.
      *   *Step 3:* Apply to Scenario.
      *   *Step 4:* Clifford's lens (Habit/Precedent).
      *   *Step 5:* James's lens (Passion/Stakes).
      *   *Prerequisite Concept:* **Belief as a Policy of Action.** Before James's "option" makes sense, students must see belief not as "accepting a fact" but "adopting a working hypothesis." This makes Clifford's shipowner analogy work (it's about the habit of negligence) and James's defense work (it's about the necessity of the hypothesis to create the fact).

  5.  **Mapping Misconceptions:**
      *   1. *James = Religion.* (Intercept early: Use the secular scenario).
      *   2. *Clifford = Certainty.* (Intercept during evidence discussion: It's about proportion, not perfection).
      *   3. *Feelings = Reasons.* (Intercept at the end: James isn't saying feelings *justify* truth, but that they justify the *risk* of belief in specific contexts).

  6.  **Designing the Assessment:**
      *   Need to test the *dependency*.
      *   *Idea:* Ask them to modify the scenario so that one philosopher's constraint vanishes.
      *   *Better:* Ask them to identify the "Switch Point." At what precise change in the evidence/stakes does the permission (James) become the prohibition (Clifford)? This forces them to weigh the conditions against the norm.

  7.  **Defining Exclusions:**
      *   Contemporary evidentialism vs. pragmatism (Feldman, Shah).
      *   Detailed theological implications (Pascal).
      *   Psychologism (how belief actually works in the brain).

  8.  **Refining the Doxastic Voluntarism Angle:**
      *   This is the trickiest part. If belief is involuntary, Clifford's "ought" implies "can" is threatened. James admits we can't believe at will *directly*, but we can let our "passional nature" decide when intellect is stalled.
