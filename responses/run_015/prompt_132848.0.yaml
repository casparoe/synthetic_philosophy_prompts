answer: |-
  ### Confidence Statement
  I am **85% confident** in this teaching sequence. The philosophical architecture is sound for second-year undergraduates, and the focus on doxastic control effectively bypasses the standard caricatures. However, the success of the session hinges heavily on the facilitation of the "Carrying Scenario." If the scenario feels contrived, the comparison will fail to land.

  ### 1. The Explanatory Arc: The Prerequisite Concept
  Before James's conditions for a "genuine option" (live, forced, momentous) can function, and before Clifford's shipowner analogy can be evaluated as a moral argument rather than an epistemic one, students must firmly grasp the distinction between **Direct Doxastic Control** and **Indirect Doxastic Control**.

  *   **The Concept:** Students must understand that neither philosopher believes we can believe "at will" in the direct sense (i.e., I cannot simply choose to believe the wall is made of gold).
      *   **Clifford** relies on *Indirect Control*: We control the *habits of inquiry* and the *time spent investigating*. The norm governs the *process* that leads to the belief state.
      *   **James** relies on a specific limitation of Indirect Control: In "genuine options," the intellect is stalled (evidence is insufficient). Here, the "passional nature" *must* decide. The norm governs the *permission to let passion drive the policy* when intellect cannot.
  *   **Why this matters for the Arc:**
      *   If students think belief is directly voluntary, Clifford looks absurd (why blame me for what I can't help?) and James looks trivial (just choose the happy belief).
      *   By anchoring the session in **Indirect Control**, Clifford's Shipowner succeeds not because he chose a false belief, but because he chose a *negligent policy of investigation*.
      *   Simultaneously, James's defense succeeds not because he licenses wishful thinking, but because he argues that in specific high-stakes stalls, *suspending judgment is itself a choice with consequences*, and the only available policy is to let hope drive action.

  ### 2. The Carrying Scenario: "The Rescue Leader"
  Do not use the Shipowner and the Alpine Climber as separate examples. Use a single, unified scenario that forces the tension between Clifford's evidential duty and James's passional right.

  **The Scenario:**
  You are the leader of a mountain rescue team. A climber is trapped in a crevasse.
  *   **The Evidence:** Your instruments give a 50/50 reading on whether the climber is alive. The storm is worsening.
  *   **The Choice:** Send the team in (high risk of death/injury to rescuers, potential to save the climber) OR abort (zero risk to rescuers, climber certainly dies if alive).
  *   **The "Belief":** The decision to send the team requires operating on the *belief* that the climber is alive. You cannot send a team "just in case"; the mission profile requires commitment to the hypothesis "They are alive."

  **Inclusions (to carry both readings):**
  *   **Public Trust:** The rescuers are under your command (captures Clifford's "society has a right to protect itself from harmful belief").
  *   **Momentousness:** The decision is irreversible and high-stakes (captures James's "momentous option").
  *   **Evidential Ambiguity:** The data is genuinely inconclusive (captures James's "intellectually undecidable").
  *   **Causal Efficacy:** The belief is required to *make* the outcome possible (if you don't believe they are alive, you don't act, and they die; captures James's "truth is made by belief").

  **Exclusions (to prevent distortion):**
  *   **Exclude Religious Language:** Do not mention God or salvation. Keep it secular to intercept the "James = Theology" misconception.
  *   **Exclude Personal Gain:** The leader gains nothing personally. This prevents students from reducing James to "selfish wish-fulfillment."
  *   **Exclude Absolute Ignorance:** There *is* some evidence (the 50/50 reading). This prevents students from thinking Clifford requires 100% certainty.

  **How it structures the comparison:**
  *   **Clifford's Verdict:** You violated your duty. A 50/50 probability is insufficient evidence to risk the lives of your team. By acting, you established a *habit* of recklessness that endangers future teams.
  *   **James's Verdict:** This is a *forced option*. Waiting for better evidence is impossible (the storm is coming). To withhold belief is to choose "they are dead." You have the *right* to let your hope (passion) tip the scale because only that belief allows the truth (the rescue) to be realized.

  ### 3. Misconception Interception Plan
  Students will likely form misconceptions in this specific order. You must intercept them at these precise moments:

  1.  **Misconception:** *"James is just defending religious faith."*
      *   **Likely Arrival:** Introduction/Context setting.
      *   **Interception Point:** **During the Scenario Setup.** Explicitly state: "We are analyzing the structure of decision-making under uncertainty. Religion is James's primary example, but the *logic* applies to any live, forced, momentous option. Our Rescue Scenario is secular."
  2.  **Misconception:** *"Clifford requires mathematical certainty before acting."*
      *   **Likely Arrival:** When applying Clifford's norm to the 50/50 evidence.
      *   **Interception Point:** **During the Clifford Analysis.** Interrupt any claim that Clifford wants "proof." Clarify: "Clifford demands evidence *proportionate to the stakes*. The issue isn't the lack of 100% certainty; it's that the evidence (50/50) does not warrant the risk imposed on *others* (the rescue team)."
  3.  **Misconception:** *"James thinks feelings count as evidence."*
      *   **Likely Arrival:** When discussing James's "passional nature."
      *   **Interception Point:** **During the James Analysis.** Correct this immediately: "James does not say hope makes the climber alive (evidence). He says hope justifies the *risk of acting* when evidence is silent. Feelings are not reasons for *truth*; they are permissions for *commitment*."

  ### 4. Final Assessment: The "Switch Point" Exercise
  Do not ask "Who is right?" This encourages side-choosing without understanding the structural dependency.

  **The Exercise:**
  "Modify exactly **one variable** in the Rescue Scenario (e.g., the probability reading, the number of rescuers at risk, or the time available) such that **Clifford's prohibition becomes absolute** even if **James's conditions remain met**, OR such that **James's permission vanishes** even if **Clifford's evidential threshold is met**."

  **Why this tests dependency:**
  To answer this, the student must understand that James's permission is *parasitic* on the evidential stall. If they change the evidence to 90% likely alive, James's "right to believe" disappears (because the intellect can now decide), but Clifford's prohibition also disappears (because evidence is sufficient).
  To succeed, they must identify the **threshold of risk to others**.
  *   *Correct Move:* Increase the risk to the team (e.g., "Sending the team guarantees one rescuer's death").
  *   *Result:* James's conditions (live, forced, momentous) are still met. However, Clifford's norm (duty to society/others) now overrides James's right.
  *   *Learning Goal:* This reveals that James's ethics of belief is not a free-for-all; it is bounded by the consequences of the belief on the "public trust" Clifford champions. It forces them to see the debate as a negotiation between *individual epistemic rights* and *collective epistemic safety*.

  ### 5. Explicit Exclusions
  At the start of the session (after the hook), state clearly:
  *"We are deliberately leaving out two major areas. First, we are not discussing **contemporary Evidentialism** (e.g., Feldman or Shah) or the psychology of belief formation. We are treating 'belief' as a normative commitment, not a brain state. Second, we are not evaluating the **theological implications** of James's argument. We are analyzing the *structure* of the argument, not its application to God. If you are interested in those downstream consequences, see the reading list for Week 10."*

  ### 6. Least Sure Recommendation
  I am least confident in the **"Switch Point" Exercise**.
  **Reasoning:** While philosophically robust, it requires students to hold multiple normative variables in their head simultaneously (evidence level, stakes, risk to others, James's three conditions). Second-year students may struggle to isolate the *one variable* without collapsing the whole scenario.
  **Mitigation:** Be prepared to scaffold this. If the room goes silent, offer the specific variable change yourself ("What if sending the team guarantees a rescuer dies?") and ask them to argue whether James would still permit the belief. This preserves the test of the *limit* of James's theory without getting bogged down in scenario-building.
