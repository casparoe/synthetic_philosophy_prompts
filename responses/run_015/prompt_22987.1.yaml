answer: |-
  You have hit on a really sharp philosophical observation. You are right that both arguments use the formal machinery of decision theory (utilities, expectations, dominance). If you look at the math, they look like cousins.

  However, the label "non-pragmatic" isn't about the **mathematical tool** being used; it is about the **source of the normative force** (why you should care).

  Here is the breakdown of why the distinction exists, why your confusion is understandable, and where the actual difference lies.

  ### 1. The Definition of "Pragmatic"
  In this context, "pragmatic" doesn't mean "practical" in the sense of "useful." It means **"dependent on practical consequences."**

  *   **The Dutch Book Argument (Pragmatic):** This argument says your beliefs should be probabilistic because if they aren't, you will act in ways that lead to **practical losses** (losing money). The normativity comes from the desire to avoid bad outcomes in the world (poverty, losing bets). If you were a monk who took a vow of poverty and never made bets, the Dutch Book argument loses its bite. It ties belief to *action*.
  *   **The Epistemic Utility Argument (Non-Pragmatic):** This argument says your beliefs should be probabilistic because if they aren't, your beliefs are **less accurate**. The normativity comes from the desire to represent the world correctly. It ties belief to *truth*.

  So, when philosophers say "non-pragmatic," they mean: **"This argument holds even if you never act on your beliefs, never bet money, and care nothing for practical outcomes."**

  ### 2. The "Utility" Input is Different
  You noted that both arguments say "maximize utility." But in decision theory, "utility" is just a variable. It's a placeholder for "the thing we value."

  *   **Dutch Book:** The utility function is **Prudential**. $U = \text{Money} / \text{Satisfaction of Desires}$.
  *   **Epistemic Utility:** The utility function is **Veritistic** (truth-oriented). $U = \text{Accuracy} / \text{Closeness to Truth}$.

  The argument is "non-pragmatic" because it swaps out "Money" for "Truth." It claims that accuracy is a *sui generis* (unique) good. You shouldn't be probabilistic to save your wallet; you should be probabilistic because being probabilistic is literally what it means to be an accurate believer.

  ### 3. A Technical Nuance: Expectation vs. Dominance
  There is a deeper technical difference that strengthens the "non-pragmatic" claim.

  *   **Dutch Book** relies on **coherence**. It says, "If your beliefs aren't probabilities, there *exists* a set of bets you would accept that guarantees a loss." It relies on the *possibility* of a bad outcome based on your betting dispositions.
  *   **Epistemic Utility (specifically Jim Joyce's Accuracy Dominance Argument):** This is often stronger than "maximizing expected utility." It uses **Accuracy Dominance**.
      *   The theorem shows that if your credences violate probability axioms, there is *another* set of credences that is **more accurate than yours in every possible world.**
      *   You don't need to calculate expectations or probabilities of worlds. You are objectively, mathematically, less accurate right now, regardless of what the world turns out to be.

  This removes the "decision" element almost entirely. It's not that you *should choose* probabilistic beliefs to get a better score; it's that non-probabilistic beliefs are **defective representations**, full stop.

  ### 4. The "Brain in a Vat" Test
  The best way to see the difference is the "Brain in a Vat" thought experiment.

  *   **Scenario:** Imagine you are a brain in a vat. You cannot act. You cannot bet. You cannot buy anything. You just have experiences and beliefs.
  *   **Dutch Book:** In this scenario, the Dutch Book argument collapses. You can't be Dutch Booked because you can't bet. Therefore, according to DBA, there is no requirement for your beliefs to be probabilistic.
  *   **Epistemic Utility:** In this scenario, the EUT argument still holds. Even as a brain in a vat, your beliefs can be accurate or inaccurate regarding your sensory inputs. If your confidence levels violate probability axioms, they are mathematically guaranteed to be less accurate than they could be.

  Because EUT applies to the Brain in a Vat and DBA does not, EUT is considered "purely epistemic" (non-pragmatic), while DBA is "pragmatic."

  ### 5. Why your confusion is valid (The Critique)
  You aren't wrong to feel skeptical. Many philosophers (like Alan Hájek) have criticized Epistemic Utility Theory on exactly the grounds you mentioned.

  The critique is: **Why should we maximize expected epistemic utility?**
  *   To justify maximizing *money*, we appeal to greed or survival needs (pragmatic).
  *   To justify maximizing *accuracy*, EUT proponents often have to smuggle in a pragmatic-style decision rule. They say, "You ought to maximize expected accuracy."

  Critics argue: "Wait, why 'ought' I do that? If 'accuracy' isn't cash, why does the 'maximize utility' rule apply?"

  If the only reason you maximize accuracy is because "that's what rational agents do," and "rational agents maximize utility," then you haven't really escaped pragmatism; you've just renamed "money" to "accuracy."

  ### Summary
  The label "non-pragmatic" is not empty, but it is specific:
  1.  **Value:** It values **Truth** rather than **Money**.
  2.  **Scope:** It applies even when **Action** is impossible (Brain in a Vat).
  3.  **Logic:** It often relies on **Dominance** (objectively worse) rather than **Expectation** (risk of loss).

  You are right that the *structure* is the same (decision theory). But the *philosophical claim* is that epistemic norms (truth) are independent of pragmatic norms (money). Whether that claim succeeds is still a matter of hot debate, but that is what the distinction is trying to mark.
