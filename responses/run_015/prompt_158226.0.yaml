prompt: |-
  I am trying to formalise a decision framework for cases where two institutional goods—say, epistemic transparency and procedural privacy—are genuinely incommensurable. I understand that, according to the parity view, such values can stand in a relation of being on a par rather than being better, worse, or equal. However, I seem to have drawn the conclusion that if they are on a par, then any institutional rule that prioritises one over the other in a specific context must be either arbitrary or an illicit reduction of the other value to a subordinate metric. This leads me to propose what I call structured parity with lexical side-constraints: a system in which neither value is ever traded off, but each governs its own non-overlapping domain. Is this a coherent way to preserve incommensurability within institutional design, or does it rest on a false presupposition about the relationship between parity, rational ordering, and domain separation? In particular, am I wrong to assume that being on a par precludes any context-sensitive ranking, and if so, what does that imply for hard choices in policy-making? Please respond in British English, and avoid citing specific texts or authors where possible.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Formalising a decision framework for incommensurable institutional goods (specifically epistemic transparency vs. procedural privacy).
      *   **Core Concept:** The "parity view" (values are "on a par" rather than better/worse/equal).
      *   **User's Conclusion:** If values are on a par, prioritising one over the other is either arbitrary or an illicit reduction.
      *   **User's Proposal:** "Structured parity with lexical side-constraints" (no trade-offs, each governs non-overlapping domains).
      *   **Questions:** Is this coherent? Does it rest on false presuppositions about parity, rational ordering, and domain separation? Am I wrong to assume parity precludes context-sensitive ranking? What does this imply for hard choices in policy-making?
      *   **Constraints:** Respond in British English. Avoid citing specific texts or authors.

  2.  **Deconstruct the Philosophical Issues:**
      *   **Incommensurability & Parity:** The idea that two values cannot be measured by a common standard. "Parity" suggests they are comparable but not via the standard trichotomy (better, worse, equal). They are in the same neighbourhood of value, but distinct.
      *   **The User's Dilemma:** If $A$ and $B$ are on a par, choosing $A$ over $B$ seems unjustified (arbitrary) or implies $A > B$ (collapsing parity).
      *   **The User's Solution:** Domain separation (lexical side-constraints). $A$ rules here, $B$ rules there. No overlap, no trade-off.
      *   **Critique of the Solution:**
          *   *Coherence:* It avoids trade-offs, but does it solve the problem of *hard choices*? Hard choices often arise precisely because domains *do* overlap.
          *   *Presupposition:* The user assumes parity precludes context-sensitive ranking. This is the crux. Most philosophical accounts of parity allow for rational choice without a pre-existing metric (willpower, commitment, specification).
          *   *Institutional Design:* Strict domain separation might be impractical. Real-world policies often involve mixed goods.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the problem. Validate the intuition behind the "arbitrariness" worry but challenge the conclusion.
      *   **Addressing the "Arbitrariness" Claim:**
          *   Challenge the idea that parity implies arbitrariness.
          *   Explain that parity allows for rational choice *without* a pre-existing ranking.
          *   Introduce the concept of "specification" or "voluntarist" reasons (creating reasons through choice rather than finding them).
      *   **Critiquing "Structured Parity with Lexical Side-Constraints":**
          *   Is it coherent? Yes, logically.
          *   Is it useful? Probably not for *hard* cases.
          *   Why? Because hard choices happen at the boundaries. If domains are truly non-overlapping, there is no conflict to resolve. If they overlap, the framework fails.
          *   It risks becoming a form of "compartmentalisation" that ignores the holistic nature of institutional goods.
      *   **Addressing Context-Sensitive Ranking:**
          *   Directly answer: Yes, you are likely wrong to assume parity precludes context-sensitive ranking.
          *   Explain how context can tip the balance without establishing a general hierarchy. (e.g., in *this* specific crisis, transparency matters more, without implying it always does).
          *   Distinguish between *global* ranking (always better) and *local* justification (better here, now).
      *   **Implications for Policy-Making:**
          *   Hard choices require more than rules; they require judgement.
          *   Institutional design should facilitate deliberation, not just prohibit trade-offs.
          *   The danger of the user's proposal: It creates rigid silos that might break under pressure.
      *   **Conclusion:** Summarise. The proposal is a safe haven but avoids the actual problem. True engagement with parity requires accepting that rational choice is possible even without a pre-determined metric.

  4.  **Refining the Tone and Language (British English):**
      *   Use "formalise" (already used by user), "prioritises", "programme", "analyse", "defence", "honour".
