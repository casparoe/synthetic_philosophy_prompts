answer: |-
  **Exam Question**

  **Time Allowed:** 90 Minutes
  **Word Limit:** Approximately 1,200 words
  **Instructions:** Answer the following question. Do not cite specific authors or papers. Argue from the principles and cases provided.

  **The Standard Repair**
  Consider the following analysis of dispositions (hereafter "The Repair"): An object $x$ is disposed at time $t$ to give response $r$ to stimulus $s$ if and only if $x$ has some intrinsic property $B$ at $t$, and there is a later time $t'$ such that, if $x$ were to undergo $s$ while retaining $B$ right up to $t'$, then $s$ together with $x$'s having $B$ would be a sufficiently complete cause of $x$'s giving $r$.

  **The Cases**
  1.  **The Loan:** A drinking glass is made of a flexible polymer that deforms rather than shatters when struck. However, it contains a microscopic monitor that detects the onset of an impact. Within a microsecond of detection, the monitor reorganizes the glass's molecular structure into that of ordinary fragile glass. Consequently, the glass shatters upon impact. Intuitively, the glass is not fragile; its shattering is not due to fragility it possessed prior to the strike.
  2.  **The Race:** A drinking glass is made of ordinary fragile glass. It is also wired to a hardening mechanism that detects impact and would prevent shattering. However, the mechanism takes one microsecond to act, while the shattering occurs within one nanosecond of the impact. Consequently, the glass shatters upon impact. Intuitively, the glass is fragile; the hardening mechanism simply failed to intervene in time.

  **The Prompt**
  Write an essay addressing the following three points:
  1.  State the correct intuitive verdict for each case (fragile or not fragile) and explain why the Standard Repair struggles to deliver these verdicts consistently without further adjustment.
  2.  Explain how specifying the intrinsic property $B$ or the stimulus conditions differently changes the outcome of the analysis in each case.
  3.  Argue for what these cases demonstrate about the relationship between a disposition and its causal basis. Specifically, do these cases suggest that the disposition is identical to the basis, or does the analysis presuppose the existence of the disposition it attempts to define?

  ***

  **Model Answer**

  The Standard Repair attempts to save the conditional analysis of dispositions from finkish and masking counterexamples by requiring the retention of an intrinsic causal basis. However, the Loan and Race cases demonstrate that the Repair does not solve the problem so much as relocate it. The analysis succeeds only if we already know how to individuate the basis and specify the stimulus, which presupposes the very disposition facts the analysis is meant to ground.

  In the Loan case, the intuitive verdict is that the glass is not fragile. It behaves like fragile glass only because the stimulus triggers a change that creates fragility mid-process. The Standard Repair struggles here because the verdict depends entirely on how we identify the intrinsic property $B$. If $B$ is identified as the initial polymer structure, the glass does not retain $B$ through the stimulus; the monitor changes it. Thus, the antecedent of the conditional ("while retaining $B$") is false, and the analysis correctly fails to attribute fragility. However, if $B$ is identified as the composite property of the glass-plus-monitor system, the system *does* retain its intrinsic structure throughout the process. The system is intrinsically such that it transforms and shatters. On this individuation, the Repair verdict is that the object *is* disposed to shatter, contradicting our intuition. The analysis offers no internal resource to decide whether the monitor is part of the basis or an extrinsic interferer.

  In the Race case, the intuitive verdict is that the glass is fragile. The hardening mechanism is extrinsic to the fragility itself; it merely fails to act fast enough. Here, the struggle arises from the specification of the stimulus and the time $t'$. If the stimulus $s$ is defined simply as "being struck," the glass retains its fragile basis long enough for the shattering to occur before the hardener acts. The Repair correctly attributes fragility. However, if the stimulus is specified more finely as "being struck and waiting one microsecond," the hardening mechanism succeeds within the relevant timeframe. The glass would not shatter under this refined stimulus description while retaining the basis. Consequently, the Repair would deny fragility. Again, the verdict flips based on how coarsely or finely we carve up the stimulus conditions, yet the analysis provides no principle for determining the correct granularity.

  These inconsistencies reveal a deeper metaphysical problem regarding the identity of dispositions and their bases. Proponents of the Repair often assume that dispositions are identical to, or strictly grounded in, their intrinsic causal bases. If this were true, identifying the basis should settle the disposition's presence. Yet, in both cases, the physical facts are fixed while the disposition verdicts vary based on our descriptive choices. In Loan, the physical process is identical regardless of whether we call the monitor part of the basis. In Race, the physical timeline is fixed regardless of how we label the stimulus.

  This suggests that the disposition is not simply identical to the basis. Instead, the application of the analysis presupposes a prior grip on whether the disposition survives the stimulus. We know the Loan glass is not fragile because we know the shattering is not due to a pre-existing liability, but rather a created one. We know the Race glass is fragile because the hardening mechanism is an external prevention, not a lack of basis. We use this prior knowledge to select the appropriate $B$ and $s$ that make the analysis work. Therefore, the analysis is circular. It does not explain what a disposition is in terms of bases and counterfactuals; rather, it uses our understanding of dispositions to select the relevant bases and counterfactuals. The disposition remains something over and above the basis, serving as the criterion by which we judge which intrinsic properties are relevant to the analysis.

  ***

  **Marking Scheme**

  **Total Marks:** 20
  **Passing Threshold:** 10/20

  | Point | Criteria | Marks | Common Error |
  | :--- | :--- | :--- | :--- |
  | **1. Intuitive Verdicts** | Correctly identifies Loan as *not fragile* and Race as *fragile*, providing a brief justification based on the source of the shattering (created vs. pre-existing). | 4 | Students often claim both are fragile because both shatter, missing the intuitive distinction regarding the *source* of the manifestation. |
  | **2. Loan Analysis** | Explains that the Loan verdict depends on whether the monitor is included in the intrinsic basis $B$ (excluded = not fragile; included = fragile). | 4 | Students describe the case mechanically but fail to link the monitor's status to the definition of the intrinsic property $B$. |
  | **3. Race Analysis** | Explains that the Race verdict depends on the temporal specification of the stimulus $s$ or the retention time $t'$ (short window = fragile; long window = not fragile). | 4 | Students focus on the hardening mechanism as a "mask" without explaining how the *timing* alters the conditional truth conditions. |
  | **4. Property Individuation** | Identifies that the Repair lacks an internal principle for individuating bases or stimuli, allowing opposite verdicts for the same physical setup. | 4 | Students argue the Repair is simply "wrong" rather than identifying the indeterminacy in property/stimulus selection as the specific failure. |
  | **5. Circularity Critique** | Argues that the analysis presupposes the disposition it seeks to define, implying dispositions are not identical to their bases but guide the selection of bases. | 4 | Students conclude dispositions are real but fail to articulate the *epistemic circularity* (using disposition knowledge to fix the analysis). |
