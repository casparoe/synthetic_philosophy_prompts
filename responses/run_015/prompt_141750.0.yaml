answer: |-
  First, a direct answer to your final constraint: **Your thesis is not muddled, and Step 2 is mathematically correct.** The claim that heritability ($h^2$) rises as environmental variance ($V_E$) shrinks, holding genetic variance ($V_A$) constant, is standard quantitative genetics (Falconer & Mackay, *Introduction to Quantitative Genetics*). Your philosophical contribution is not the math, but the insistence that this mathematical triviality has been metaphysically obscured in the literature and public discourse. You are on solid ground.

  Here is your prep sheet for the Q&A.

  ### Strategic Concessions (First Two Minutes)
  *Do not wait for these to be raised. Pre-empt them in your opening remarks or immediately after the chair invites questions.*

  1.  **To the Geneticists:** "I anticipate my colleagues from the medical school will note that the population-relativity of $h^2$ is textbook material. I concede this entirely. My argument is not that the math is new, but that the *ontological interpretation* often attached to it in policy and public discourse treats the coefficient as a intrinsic property of the trait rather than a property of the population–environment system."
  2.  **To the STS Students:** "I also concede that $h^2$ has a history of misuse in support of harmful ideologies. My aim is not to rehabilitate that history, but to argue that the number itself, properly understood as a local sensitivity coefficient, is less dangerous than its reification. If we treat it as I propose, it loses its rhetorical power to justify status quo inequalities."

  ---

  ### The Eight Objections
  *Ordered by likelihood and potential damage to your credibility or thesis.*

  #### 1. The "Textbook Triviality" Objection
  *   **Who:** The Quantitative Geneticists (Medical School).
  *   **Likelihood:** Very High. **Damage:** High (threatens your credibility as a peer).
  *   **Their Vocabulary:** "This is standard Falconer. We teach this in Genetics 101. $V_P = V_G + V_E + V_{GxE}$. Of course $h^2$ changes if $V_E$ changes. What is the *novel* contribution here?"
  *   **Gloss:** They are distinguishing between the *math* (which they agree with) and the *philosophical payload* (which they suspect is empty).
  *   **Your Reply:** "The math is indeed standard. The novelty is the prescription. In practice, high $h^2$ estimates are routinely cited in policy documents as evidence of 'genetic determination' or 'limits to malleability,' even by experts who know the math. My claim is that the *format* of the number invites this reification. By explicitly defining it as a local sensitivity coefficient bounded by environmental support, we break the rhetorical link between high $h^2$ and immutability. I am arguing for a change in reporting standards, not estimation methods."
  *   **Soft Spot:** If they press that "experts already know this," you must admit the failure is pedagogical/sociological, not mathematical.

  #### 2. The "Interventionist Causality" Objection
  *   **Who:** The Host (Philosopher of Science).
  *   **Likelihood:** High. **Damage:** Medium (philosophical precision).
  *   **Their Vocabulary:** "On an interventionist account (à la Woodward), a causal claim must tell us what happens under a manipulation. You say $h^2$ licenses prediction only within the support. But doesn't the Breeder's Equation ($R = h^2 S$) imply a causal capacity to respond? How do you cash out 'sensitivity coefficient' without a causal graph?"
  *   **Gloss:** *Interventionist:* Causation is defined by what happens when you wiggle a variable. *Support:* The range of values the variables actually take in your data.
  *   **Your Reply:** "I am treating $h^2$ not as a causal parameter of the individuals, but as a structural parameter of the population distribution. It tells us the slope of the response function *at the current operating point*. It is causal in the sense that a pressure gauge is causal: it predicts what the system will do under pressure, but only if the pipe doesn't burst. It licenses interventionist claims only for interventions that do not alter the variance structure of the environment itself."
  *   **Soft Spot:** You are walking a line between "statistical association" and "causal capacity." If pressed on *why* the response occurs if not causally, you must retreat to "aggregate statistical regularity."

  #### 3. The "Abolish the Number" Objection
  *   **Who:** STS Graduate Students.
  *   **Likelihood:** High. **Damage:** Medium (political/ethical heat).
  *   **Their Vocabulary:** "If the number is so easily misinterpreted and context-dependent, why publish it at all? Isn't this just providing a veneer of legitimacy to a metric that should be retired in social science contexts?"
  *   **Gloss:** *Legitimacy:* Making something controversial appear scientifically neutral.
  *   **Your Reply:** "Because selection happens whether we measure it or not. In animal breeding, ignoring $h^2$ leads to failed programmes. In human policy, ignoring the distinction between variance in a population and determination in an individual leads to fatalism. My proposal is not to use the number more, but to use it *less confidently*. Publishing the environmental support alongside the estimate acts as a warning label, not an endorsement."
  *   **Soft Spot:** They may argue that warning labels on dangerous tools are insufficient; the tool itself is the problem.

  #### 4. The "Individual vs. Population" Objection
  *   **Who:** Philosopher of Biology.
  *   **Likelihood:** Medium. **Damage:** Low (conceptual clarification).
  *   **Their Vocabulary:** "You distinguish the causes of an individual's trait value from the causes of variance. But if genes cause the trait in the individual, doesn't $h^2$ track that causal contribution in the aggregate? Why sever the link so sharply?"
  *   **Gloss:** *Variance:* Statistical spread of values. *Trait Value:* The actual measurement of the individual.
  *   **Your Reply:** "Because the sum of causes in an individual is not the sum of variances in a population. If I am tall because of good nutrition, and everyone else is tall because of good nutrition, nutrition explains my height but contributes zero to the variance. $h^2$ tracks the latter. To infer the former from the latter is the ecological fallacy. I am insisting we keep the bookkeeping separate."
  *   **Soft Spot:** Some modern causal models (e.g., structural equation models) attempt to bridge this; you are taking a hardline classical view.

  #### 5. The "Genomic vs. Pedigree" Objection
  *   **Who:** The Genomicist (Medical School).
  *   **Likelihood:** Medium. **Damage:** Medium (technical obsolescence).
  *   **Their Vocabulary:** "You mention genomic-relatedness estimates (GREML) are lower. Isn't that because pedigree designs capture shared environment confounds ($C^2$) as genetic variance? So your 'local sensitivity' is actually just 'uncontrolled confounding'."
  *   **Gloss:** *GREML:* Genomic-Relatedness-Matrix Restricted Maximum Likelihood (uses DNA markers, not family trees). *Confounds:* Variables that correlate with both cause and effect, biasing the result.
  *   **Your Reply:** "That is a possibility, and it strengthens my point. If pedigree $h^2$ captures environmental similarity mistaken for genetic relatedness, then it is even *more* sensitive to the specific population structure than I claimed. It is a local sensitivity to the *assumed* genetic structure. This makes the requirement to state the environmental support even more critical, as genomic estimates depend on the linkage disequilibrium of that specific population."
  *   **Soft Spot:** You are conceding that classical $h^2$ might be 'dirty,' which weakens its utility even inside the support.

  #### 6. The "Gene-Environment Correlation" (rGE) Objection
  *   **Who:** The Behavioural Geneticist (Medical School).
  *   **Likelihood:** Medium. **Damage:** Medium (technical rebuttal).
  *   **Their Vocabulary:** "In your school reform example, you assume $V_G$ stays fixed. But if you equalise schools, you might activate passive rGE—parents with high genotypes for education might move to the remaining variable environments. So $V_A$ isn't constant."
  *   **Gloss:** *rGE:* When an individual's genotype influences their exposure to an environment (e.g., smart parents seek smart schools).
  *   **Your Reply:** "That is a dynamic second-order effect. My point is about the immediate arithmetic of the variance components. Even if $V_A$ shifts slightly, the mechanical effect of shrinking $V_E$ dominates the ratio in the short run. Furthermore, if rGE causes $V_A$ to rise as $V_E$ falls, that only amplifies my warning: the number becomes even more unstable as a guide for intervention."
  *   **Soft Spot:** You are assuming a static snapshot; they are arguing about dynamic systems.

  #### 7. The "Predictive Utility" Objection
  *   **Who:** Lay Audience / Generalists.
  *   **Likelihood:** Medium. **Damage:** Low (pragmatic pushback).
  *   **Their Vocabulary:** "But if the number predicts breeding response, doesn't that prove it captures something real about the genes? Why dismiss the 'genetic' label?"
  *   **Gloss:** *Breeding Response:* The change in the average trait in the next generation.
  *   **Your Reply:** "It captures something real about the *population's capacity to respond to selection*, not about the genes' determination of the trait. A spring has a 'stiffness coefficient.' It tells you how it responds to force. It doesn't tell you what the spring is made of. $h^2$ is the stiffness of the population, not the composition of the individual."
  *   **Soft Spot:** The analogy might break down if they press on the biological mechanism of inheritance.

  #### 8. The "Between-Group" Objection
  *   **Who:** Lay Audience / STS.
  *   **Likelihood:** High (given the topic). **Damage:** High (ethical minefield).
  *   **Their Vocabulary:** "Does this mean we can never use genetics to explain differences between groups (e.g., races or classes)?"
  *   **Gloss:** *Between-Group:* Differences in average trait values between distinct populations.
  *   **Your Reply:** "My thesis implies that within-group $h^2$ tells us *nothing* about between-group differences. This is Lewontin's point. If the environmental supports of the two groups do not overlap, the sensitivity coefficients are incommensurable. You cannot use a number derived from Variation Within Group A to explain the Mean Difference between Group A and Group B. That is a category error."
  *   **Soft Spot:** This is the standard "Lewontin's Fallacy" defence. It is robust, but emotionally charged. Keep it technical.

  ---

  ### The "Real Force" Objection
  *Prepare for this one. It is the strongest philosophical challenge to your specific prescription.*

  **The Objection:** **The Stability of Reaction Norms.**
  *   **Who:** The Host or the Philosopher of Biology.
  *   **The Argument:** You claim $h^2$ is useless for extrapolation outside the environmental support. However, if the *reaction norms* (the function mapping environment to phenotype for a given genotype) are linear and parallel across the population, then extrapolation *is* valid. By dismissing all extrapolation, you are implicitly assuming non-linearity or GxE interaction without evidence. If reaction norms are stable, $h^2$ *does* inform us about interventions outside the support.
  *   **Your Counter:** "That is a strong biological assumption that is rarely tested. In complex traits like behaviour or attainment, we have ample evidence of threshold effects and non-linearity (e.g., malnutrition). My prescription is epistemic humility: unless you have demonstrated the linearity of the reaction norms *a priori*, you cannot assume the coefficient holds outside the sampled support. The burden of proof should be on the extrapolator."
  *   **Why it hurts:** It forces you to admit your rule is a heuristic, not a logical necessity.

  ### The Question You Hope Nobody Asks
  *   **The Question:** **"If classical heritability estimates are confounded by shared environment, and genomic estimates are lower and population-specific, and the number doesn't predict policy outcomes outside the sample... what work is left for the number to do that couldn't be done by simply reporting the raw variance components ($V_A, V_E$) separately?"**
  *   **Why it's dangerous:** It suggests your "reform" is merely semantic. If the ratio itself is the problem, why not abolish the ratio and publish the variances?
  *   **Prepared Answer:** "Because the Breeder's Equation requires the ratio. For short-term prediction *within* the support, the ratio is computationally necessary. My argument is not to abolish the calculation, but to abolish the *interpretation* of the ratio as a fundamental constant. We need the number for prediction, but we must stop treating it as an explanation."

  ### Final Advice
  You have the authority of 30 years of practice. Use it. When the geneticists challenge you on the math, nod and say, "As you know better than I..." then pivot to the philosophy. When the philosophers challenge you on the causality, nod and say, "As a practitioner, I saw what this number *did* in the real world..." You are the bridge. Walk it confidently.
