answer: |-
  Here is the defended research agenda, ranked by upstreamness and leverage, incorporating your constraints and your specific suspicion.

  ### 1. Ranking of the Three Cruxes

  1.  **Correlated Uncertainty** (The Scope Problem)
  2.  **The Currency Problem** (The Weight Problem)
  3.  **The Unit Question** (The Intervention Problem)

  ### 2. Defense of the Ranking

  I am ranking these based on a weighted function of **Upstreamness** (how many downstream decisions depend on this), **Tractability** (can $4M move the needle in 5 years?), and **Regulatory Leverage** (will this change what funders/laws prioritize?).

  **Why Correlated Uncertainty is First:**
  This is the gatekeeper. If the uncertainty about invertebrate sentience is highly correlated across the clade, the "expected value" of the invertebrate kingdom collapses relative to the vertebrate one, regardless of how many individuals exist. If uncertainties are independent, the sheer numbers dominate the moral calculus.
  *   **Upstreamness:** Maximum. If the correlation is high, we focus resources on vertebrates. If low, we must pivot to invertebrates. This decides *who* is in the room before we ask *how much* they count.
  *   **Tractability:** High. This does not require proving sentience in every species. It requires mapping the phylogenetic signal of neural substrates associated with valence. A team of 6-7 can produce a robust phylogenetic model of sentience probability within 5 years using existing data plus targeted pilot neuroethology.
  *   **Regulatory Leverage:** High. Regulators operate on risk assessment. A model showing "high correlation of uncertainty" provides a defensible reason to maintain the status quo (vertebrate focus). A model showing "low correlation" forces a re-evaluation of scope.

  **Why Currency is Second:**
  Once we know *who* counts, we must know *how much* they count relative to each other to prioritize interventions.
  *   **Upstreamness:** High, but secondary to Scope. You cannot weight beings you haven't included.
  *   **Tractability:** Moderate/Low. Comparing valence intensity across phyla is notoriously difficult. However, focusing on "minimum viable proxies" (e.g., trade-off decisions in reinforcement learning paradigms) is tractable for a small team.
  *   **Regulatory Leverage:** Moderate. Regulators struggle with inter-species weighting, but they understand "severity of procedure." Providing a calibrated scale helps prioritize which species get protection first.

  **Why The Unit Question is Third:**
  This asks whether death is a harm and if creation offsets suffering.
  *   **Upstreamness:** Low/Mixed. This dictates *intervention type* (welfare vs. population control), but only after Scope and Weight are settled.
  *   **Tractability:** Very Low. This is a philosophical stalemate. $4M will not resolve the non-identity problem or the asymmetry of creation.
  *   **Regulatory Leverage:** Low. Current law is predicated on the individual as the unit of concern. Arguing for population-level ethics is politically toxic and legally alien. It is unlikely to change prioritization in a 5-year window.

  ### 3. Deprioritized Items

  I would explicitly deprioritize the following two areas as unlikely to yield ROI for your specific goal (changing regulatory/advocacy priorities):

  1.  **The Unit Question (Replaceability/Population Ethics):** As noted above, this is philosophically intractable and politically non-starters for regulators. Advocacy groups focusing on "wild animal suffering" via population control often alienate conservation partners. Funding this would produce papers, not policy changes.
  2.  **The Argument from Marginal Cases / Speciesism Debate:** You are correct to suspect this is no longer load-bearing. The philosophical consensus (among those who matter for this work) is already that species membership alone is not a moral boundary. Re-arguing this is redundant. The bottleneck is no longer *justification for inclusion*, but *operational criteria for inclusion*.

  ### 4. Effort Split: Conceptual vs. Empirical

  **Split: 40% Conceptual / 60% Empirical**

  *   **Reasoning:** Purely conceptual work on sentience has diminishing returns; the literature is saturated. Purely empirical work without a conceptual frame risks measuring the wrong variables (e.g., measuring nociception when looking for affect).
  *   **Allocation:**
      *   **Conceptual (2-3 researchers):** Focus on defining the "minimum sufficient conditions" for welfare in non-vertebrates. They must operationalize the variables for the empirical team.
      *   **Empirical (4-5 researchers):** Focus on phylogenetic mapping of neural architectures and pilot behavioral assays. The goal is not to prove sentience in one species, but to test the *correlation structure* across clades.
  *   **Trade-off:** This sacrifices depth in any single model organism for breadth across the phylogeny. Given the "Correlated Uncertainty" crux is #1, breadth is the higher leverage investment.

  ### 5. Evidence Triggers

  **Evidence that moves Correlated Uncertainty Up/Down:**
  *   **Up:** Discovery that key neural substrates for valence (e.g., specific mushroom body output neurons in insects) are homologous across Bilateria, suggesting a deep evolutionary origin. This lowers uncertainty for the whole clade.
  *   **Down:** Evidence that similar behaviors (e.g., analgesic self-administration) are driven by radically different, non-homologous mechanisms in different clades. This increases uncertainty and suggests we cannot extrapolate.

  **Evidence that moves Currency Up/Down:**
  *   **Up:** Demonstration that invertebrates make complex trade-offs between competing motivational states (e.g., hunger vs. safety) that scale with intensity in a way mathematically comparable to vertebrates.
  *   **Down:** Evidence that invertebrate "pain" responses are purely reflexive and dissociable from long-term behavioral change or state valuation.

  ### 6. Evaluation of Your Suspicion (The Welfare Model)

  **Is it live?**
  Yes. It is the most critical conceptual blind spot in the field. The "welfare" construct is heavily derived from mammalian neurobiology (integrated affect, memory of past pain, anticipation of future pain). Insects and nematodes may operate on "stimulus-bound" valence without temporal integration. If an animal suffers only *during* the nociceptive event and does not integrate that into a "life narrative," the moral weight of duration and memory changes fundamentally.

  **Is it tractable?**
  Yes, but only for a team with your specific background. It requires neuroethologists who understand that behavior is not a direct readout of internal state, working with philosophers who can articulate what "welfare" means without mammalian baggage.

  **Where does it belong in the ordering?**
  **It belongs at #0.** It is upstream of Correlated Uncertainty.

  *   **Reasoning:** The "Correlated Uncertainty" crux assumes we are looking for a variable called "sentience" or "welfare." If your suspicion is correct, that variable is ill-defined for the target clade. You cannot calculate the probability of sentience (Crux 1) or the intensity of suffering (Crux 2) if the theoretical object you are measuring does not exist in that form.
  *   **Impact on Agenda:** If the vertebrate model of welfare is wrong for invertebrates, the "Currency Problem" dissolves because there is no common currency. We would need separate moral accounts for "integrated welfare beings" (vertebrates) and "momentary valence beings" (invertebrates). This drastically changes intervention prioritization (e.g., instantaneous death might be less harmful for a momentary valence being than for one that anticipates death).

  **Recommendation:**
  Make the validation of the Welfare Model the primary conceptual workstream of the grant. Do not assume the vertebrate model holds. Task the conceptual researchers with defining "Invertebrate Welfare" from the ground up, using the empirical team to test for temporal integration of valence. If this fails, the rest of the agenda (Currency, Unit) must be re-engineered. If it succeeds, it validates the approach for Crux 1 and 2.

  **Summary of Revised Order:**
  1.  **Welfare Model Validity** (Your Suspicion)
  2.  **Correlated Uncertainty**
  3.  **Currency Problem**
  4.  **Unit Question** (Deprioritized)

  This ordering maximizes the chance that your $4M produces a paradigm shift rather than just more data on the old paradigm.
