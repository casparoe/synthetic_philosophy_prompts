answer: |-
  **Coding Protocol: Societal Disruption Classification Tree**

  **Step 0: Declaration (Pre-Condition)**
  Before entering the tree, the coder must declare:
  1.  **Patient:** The entity assessed (e.g., State, Settlement System, Welfare).
  2.  **Territory:** The geographic scope.
  3.  **Window:** The sampling duration (e.g., 50 years, 3 generations).
  *Justification:* Disagreements often stem from differing definitions of what collapsed, not the events themselves.

  **Decision Nodes (1–9)**
  1.  **Integration Threshold:** Did measurable complexity (settlement hierarchy, administrative reach, exchange volume) drop >50% within the window? (No → Go to 9).
  2.  **Scale Relativity:** Was the loss concentrated in centralizing institutions (palaces, states) rather than distributed units (households, villages)?
  3.  **Legibility Cessation:** Did administrative technologies (writing, accounting, metrology) cease operation in the territory?
  4.  **Welfare Decline:** Did biological welfare (mortality, stature, nutrition) decline significantly concurrent with integration loss?
  5.  **Register Divergence:** If Integration/Legibility decline but Welfare remains stable or improves, code as Transformation. (If both decline, proceed).
  6.  **Recovery Test:** Was the prior configuration materially available to the next generation but not resumed? (Yes → Proceed; No → Transformation).
  7.  **Duration (Trough) Test:** Did the low-integration state persist for >2 generations? (No → Shock; Yes → Proceed).
  8.  **Self-Description:** Do near-contemporary sources describe the event as a catastrophic loss of order?
  9.  **Bias Discount:** Is the testimony authored by successors who gained power from the rupture? (If Yes, downgrade evidentiary weight; if No, confirm).

  **Leaves and Logical Space**
  *   **Canonical Collapse:** Integration↓, Welfare↓, Legibility↓, No Recovery, Persistent. *Awkward Consequence:* Requires evidence of suffering; prosperous simplifications are excluded.
  *   **Elite Transformation:** Integration↓, Welfare→, Legibility↓, No Recovery, Persistent. *Awkward Consequence:* Classifies the Classic Maya end as transformation, not collapse.
  *   **System Reset:** Integration↓, Recovery Yes. *Awkward Consequence:* Dynastic turnovers count as non-collapses despite violence.
  *   **Transient Shock:** Integration↓, Duration <2 Generations. *Awkward Consequence:* Severe invasions may be coded as blips if recovery is fast.
  *   **Continuity:** Integration Stable. *Awkward Consequence:* Ignores qualitative cultural shifts without complexity loss.
  *   **Near Miss:** Integration threatened but threshold not crossed. *Status:* **Mis-specification.** This instrument codes outcomes, not risks. "Near Miss" belongs in a risk assessment model, not a retrospective event classifier.

  **Unoccupied/Indistinguishable Cells**
  *   **Unoccupied:** Integration↓, Welfare↑, No Recovery. (The "Liberation" scenario: complexity drops, people thrive, old system not resumed). Theoretically possible but empirically rare; often coded as Elite Transformation.
  *   **Indistinguishable:** Canonical Collapse vs. Elite Transformation when welfare data is missing. The tree cannot separate these without biological evidence; coders must flag "Welfare Unknown."

  ***

  **Validation**

  **Episode A: Eastern Mediterranean (1200 BCE)**
  *   **Declaration:** Patient=Palace States; Territory=Aegean/Anatolia; Window=50 years.
  *   **Path:** 1(Yes) → 2(Yes) → 3(Yes, Linear B lost) → 4(Yes, debated but generally accepted decline) → 5(No) → 6(Yes, palaces not rebuilt) → 7(Yes, centuries) → 8(Yes, later tradition implies loss) → 9(Yes, but archaeological evidence outweighs bias).
  *   **Verdict:** Canonical Collapse.
  *   **Disagreement:** Coders may dispute Node 4 (Welfare). Archaeological evidence for stature/nutrition is patchy. If Welfare is coded stable, verdict shifts to Elite Transformation. This is a **real feature** of the concept: collapse implies human cost; if cost is unproven, classification must reflect uncertainty.

  **Episode B: Southern Maya Lowlands (800–950 CE)**
  *   **Declaration:** Patient=Divine Kingship; Territory=Southern Lowlands; Window=150 years.
  *   **Path:** 1(Yes) → 2(Yes, villages persist) → 3(Yes, script/stela end) → 4(No, population persists) → 5(Yes, Divergence) → **Verdict: Elite Transformation.**
  *   **Alternative Declaration:** Patient=Settlement System. Path: 1(Yes) → 4(Yes, steep decline) → Verdict: Canonical Collapse.
  *   **Disagreement:** Coders will disagree on Step 0 (Patient). If coding the State, it is Transformation. If coding the Population Density, it is Collapse. This is **not a defect**; Constraint 1 mandates this disagreement be visible. The protocol successfully isolates the variable (Elite vs. Demographic).

  **Episode C: Soviet Union (1991)**
  *   **Declaration:** Patient=Union State; Territory=USSR; Window=5 years.
  *   **Path:** 1(Yes) → 2(Yes) → 3(Yes, Command Economy/Party ends) → 4(Yes, male life expectancy drop) → 5(No) → 6(Yes, Union not resumed) → 7(Yes, >2 generations so far) → 8(Yes) → 9(No, successor elites often ex-party but benefit from fragmentation).
  *   **Verdict:** Canonical Collapse (of the Union).
  *   **Disagreement:** Node 7 (Duration). Is 30 years enough for "persistent" vs. "transient"? Some may argue recovery is ongoing. Also, Node 4 (Welfare): Life expectancy recovered post-2000. If coded as transient welfare shock, verdict might shift. This highlights a **defect in the tree**: Node 7 requires a fixed endpoint for historical cases, making contemporary coding unstable.

  ***

  **Analysis of Disagreement**
  Disagreement on Episode A (Welfare) is epistemic (lack of data). Disagreement on Episode B (Patient) is ontological (what constitutes the society). Disagreement on Episode C (Duration) is temporal (window specification).

  The protocol does not eliminate disagreement; it locates it. In Episode B, two competent coders will produce different verdicts based on Step 0. This is the intended function of Constraint 1. In Episode A, disagreement arises at Node 4. This indicates the concept of collapse is empirically sensitive to welfare data; without it, the tree forces a "Transformation" default, which is logically consistent but historically contentious.

  The "Collapse Averted" verdict is confirmed as a mis-specification. The tree measures *state changes*, not *counterfactuals*. A "Near Miss" is logically a "Continuity" verdict with a metadata flag for threat level, not a distinct leaf.

  **Summary of Constraints Met**
  1.  **Patient/Bandwidth:** Step 0 declaration.
  2.  **No Labels:** Nodes rely on measurable thresholds (50%, 2 generations, cessation).
  3.  **Registers:** Nodes 1 (Integration), 3 (Legibility), 4 (Welfare), 5 (Divergence).
  4.  **Structure:** 9 Nodes. Includes Trough (7), Scale (2), Self-Description (8+9), Recovery (6).

  **Verification Note:** The distinction between "Elite Transformation" and "Canonical Collapse" aligns with debates found in *The Collapse of Complex Societies* (Tainter) vs. *Resilience Theory* (Holling), but specific attributions should be verified against current archaeological consensus on Maya welfare metrics.
