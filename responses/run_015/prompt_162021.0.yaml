      *   *Scenario Draft:* To secure a critical vote from a skeptical colleague, Julian, for my preferred hiring candidate, I must convince him I genuinely intend to chair the resulting search committee for the full year, a commitment he verifies not by my promise but by observing whether I spend the intervening week drafting a rigorous recruitment timeline and declining conflicting administrative offers—behaviors he knows a mere pretender, aware they plan to abdicate, would not sustain without detectable hesitation or inconsistency in their deliberation. Once the vote is secured and the candidate hired, the Dean unexpectedly abolishes the committee structure, rendering the chairmanship purely ceremonial with no duties, no meetings, and no impact on anyone, though the formal title must still be accepted to finalize the hire. I know at the time of bargaining that the Dean plans to abolish the committee, but Julian does not, and accepting the title costs me nothing, benefits no one, and serves no purpose, yet the commitment remains.
