answer: |-
  To secure a critical vote from a skeptical colleague, Julian, for my preferred hiring candidate, I must convince him I genuinely intend to chair the resulting search committee for the full year, a commitment he verifies not by my promise but by observing whether I spend the intervening week drafting a rigorous recruitment timeline and declining conflicting administrative offers—behaviors he knows a mere pretender, aware they plan to abdicate, would not sustain without detectable hesitation or inconsistency in their deliberation. Once the vote is secured and the candidate hired, the Dean abolishes the committee structure, rendering the chairmanship purely ceremonial with no duties, no meetings, and no impact on the hire which is already secure. I know at the time of bargaining that the Dean plans to abolish the committee, but Julian does not, and accepting the title costs me nothing, benefits no one, and serves no purpose, yet the commitment remains.

  (a) The intention in question is to chair the search committee for the full year. At the early time, the reason to form this intention is to secure Julian's vote for the hiring candidate, a benefit I value highly; the benefit is responsive to the intention itself because Julian's shrewd observation of my planning behavior (drafting timelines, declining roles) distinguishes genuine intention from pretense, as a pretender knowing they will not act would not invest the cognitive effort or opportunity cost without slipping. At the later time, there is no reason to perform the action (accepting the ceremonial title/chairing): the hire is secure, the committee is abolished, there is no audit, no reputational gain, and no cost to refusing, so the normative landscape is empty of reasons to act, and I know this calmly at the start. Under the belief-constraint account, I cannot intend at the early time because I know at that time that I will have no reason to act later, so I cannot believe I will act; without belief, there is no intention, so Julian detects my pretense, withholding the vote, and the action is not performed. Under the two-tier account, I can intend at the early time based on the reason to secure the vote; this intention is a distinct attitude that does not require belief of action but rather constitutes a commitment; once formed, the intention itself supplies a reason to act at the later time (fidelity to the plan), so the intention is formed, Julian detects it, the vote is secured, and I perform the action.

  (b) The single structural feature doing the work is the *decoupling of the benefit's trigger from the action's utility*. The benefit (the vote) is triggered by the *formation and detection of the intention* (via interim planning), not by the *completion* of the action, while the action itself is rendered normatively inert by external circumstances known only to the agent. If this feature is removed—for instance, if the vote were contingent on actually chairing the committee for a year—then there would be a reason to act at the later time (to get the vote), collapsing the distinction between the two accounts: both would agree the intention is rational and the action is performed, failing to generate the puzzle.

  (c) The strongest reply available to a defender of the belief-constraint account is that the case smuggles in self-deception or a false belief about the nature of planning. They will argue that a lucid agent who knows there is no future reason to chair cannot genuinely draft a rigorous timeline or decline other offers without lying to themselves about their future agency; what Julian detects is not "intention" but "skillful acting," and the agent is either deceiving Julian or deceiving themselves about their own likelihood of following through. I think this reply fails because it conflates the *confidence* required for planning with the *belief* required by the constraint. The two-tier account explains the observable data (sustained, consistent planning behavior) without positing self-deception: the agent is not predicting they will act, but settling on acting. The planning behavior is real and costly, distinguishable from pretense by its coherence, which validates the two-tier verdict that intention can exist without predictive belief, allowing the case to stand.
