      *   *Decision:* I will construct the case such that it *appeals* to the Two-Tier account's resources (intention as a distinct attitude that creates reasons). I will acknowledge in section (c) that the Belief-Constraint defender denies the possibility, but argue that the case stands because the "planning behavior" is observable and distinct from pretense, validating the Two-Tier view. I won't claim the constraints are impossible, but that they are contested. Actually, the prompt says "If you conclude... say which one has to give". I should probably take a stand. I will take the stand that the case *does* work (constraints satisfied) under the Two-Tier account, which is the "surviving" design.
      *   *Wait, if I say it works, I am saying a lucid agent can intend without belief.* This is controversial. But I am role-playing a philosopher of action who wants to settle the argument by construction. I will argue the construction holds.

      *   *Wait, one more thing:* "The agent is at neither time self-deceived... or weak-willed." If I intend to X, and I know there's no reason to X, and I do X... am I weak-willed? No, weak-willed is acting against reason. Here, acting *with* the reason provided by intention.
