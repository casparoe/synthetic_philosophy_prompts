prompt: |-
  I've ended up defending a version of Kant's universal-law test that most people I know think died out a while ago, and I want to know what would actually kill it.

  The version I hold: the test is not "what would happen if everyone did that". It's a test on a maxim under universalization, with two failure modes — a maxim you can't even *conceive* as a universal law without the law cancelling itself (the borrowing case: a promise no one believes in isn't a promise), and a maxim you can conceive but can't *will* as a universal law, because a will that willed it couldn't still will what any finite rational agent necessarily wills. The second branch is supposed to be non-consequentialist: you aren't totalling up the misery of universal non-beneficence, you're asking whether the will is at war with itself. And on that reading the obvious objections just miss — the "what if everyone did that" parodies, all the partial-compliance stuff, the cases where 99% compliance is lovely and 100% collapses the practice. Wrong question, wrong currency.

  So: what would count against it? Not the greatest-hits objections I can already recite. I want the defeaters ranked from fatal to merely awkward, and I want the ones a defender of the test would *concede* as counting against it, not only the ones its critics repeat. Which intuitions or cases does the view stand or fall with? Does it have predictions its rivals don't — for instance, that no amount of bad consequences can by itself sink a maxim, or that the duty/not-duty line should land somewhere other than where a welfarist would put it?

  The thing I actually mabye lose sleep over, which I don't think is in the standard lists. Call them wobblers: maxims whose content refers to how other people are behaving, so that universalizing them produces not a contradiction but a law with no fixed point. "I'll take the quieter of the two roads home, whichever turns out to be quieter." "I'll free-ride on a cooperative scheme as long as nearly everyone else is contributing." "I'll believe whatever the local consensus denies." Universalize the second one and it seems to flicker: at full compliance the condition fails, so nobody free-rides, so the condition is met again. There's no stable state the law describes, but there isn't an outright contradiction either, and neither of Kant's two branches obviously has a slot for it. Is that a genuinely new failure mode, does it collapse into one of the known ones, or does it just show that such things aren't maxims at all (no universal form, no real end)? Which of those replies is more plausible and what does each one cost elsewhere? And be honest with me if this is only the old problem about how maxims get individuated wearing a hat.

  Related: I want to know whether the view has been qualified into unfalsifiability. Whenever the test seems to misfire, the move available is "that wasn't really the maxim" or "that's a consequence, not a contradiction". Say whether the version I hold is insulated in that way, and whether insulation is fine for a claim of this kind — it isn't an empirical prediction, after all — or whether it means I'm holding something with no content.

  What would move me most, personally: a case where the test gets the intuitively right answer but only by smuggling in a forecast of consequences. If every workable application of the will-branch secretly reasons that way, then what I'm defending is consequentialism with extra machinery, and I'd want to know. Can the conception/will distinction hold that line, or does it leak?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Position:** The user defends a specific, sophisticated interpretation of Kant's Formula of Universal Law (FUL). It's *not* the crude "what if everyone did that" (act-utilitarian style) reading. It's the "contradiction in conception" (CC) vs. "contradiction in the will" (CW) distinction. It emphasizes the internal coherence of the will, not aggregate consequences.
      *   **Goal:** The user wants to know what would *actually* kill this view. They know the standard objections (partial compliance, "what if everyone," etc.) and think they miss the point. They want *fatal* defeaters, ranked, that a defender would have to concede.
      *   **Specific Concern ("Wobblers"):** The user is worried about maxims that reference others' behavior (conditionals/free-riding/contrarianism) leading to instability/no fixed point rather than a clear contradiction. Is this a new failure mode? Does it collapse? Does it show these aren't maxims?
      *   **Falsifiability/Insulation:** Is the view qualified into unfalsifiability? (e.g., "That wasn't the *real* maxim"). Is this insulation acceptable for a non-empirical claim?
      *   **Consequentialism Leak:** Does the CW branch secretly rely on forecasting consequences? If so, is it just consequentialism with extra steps?
      *   **Tone:** Philosophical, rigorous, honest, avoiding platitudes. The user is knowledgeable.

  2.  **Deconstruct the User's Version of Kant:**
      *   *CC (Contradiction in Conception):* The maxim becomes impossible to conceive as a universal law (e.g., false promising destroys the institution of promising).
      *   *CW (Contradiction in the Will):* The maxim can be conceived, but a rational agent cannot *will* it because it conflicts with necessary ends of a rational will (e.g., non-beneficence conflicts with the need for aid).
      *   *Non-Consequentialist:* It's about the structure of the will, not the sum of happiness.

  3.  **Brainstorming Defeaters (Ranking Fatal to Awkward):**

      *   *Fatal 1: The "Necessary Ends" Problem (CW Branch).* The CW test relies on identifying what a rational agent *necessarily* wills. Kant says things like "happiness" or "perfection." But if these are empirically derived or vague, the test loses its a priori force. If "necessary ends" are just "things people happen to want," it collapses into hypothetical imperatives. If they are "things Kant thinks people should want," it's dogmatic. *Fatal if:* There is no non-question-begging account of "necessary ends of a rational will."
      *   *Fatal 2: The Maxim Individuation Problem (The "Insulation" Charge).* If every counter-example is solved by tweaking the maxim's description, the test is empty. The user asks about this directly. *Fatal if:* There are no constraints on maxim individuation other than "make it pass the test."
      *   *Fatal 3: The Consequentialist Leak.* Does CW require imagining a world and seeing if it's "bad"? If the reason I can't will non-beneficence is "I might need help," that's a prediction of future states (consequences). *Fatal if:* The "contradiction in the will" is just a "contradiction in desired outcomes."
      *   *Awkward 1: The "Wobblers" (Conditional Maxims).* The user's specific worry.
      *   *Awkward 2: Conflicts of Duty.* Kantianism struggles with genuine moral dilemmas. If two maxims pass CC/CW but conflict, the system has no resolution mechanism.

  4.  **Addressing the "Wobblers" (Conditional Maxims):**
      *   *Case:* "I'll free-ride if others contribute."
      *   *Universalization:* "Everyone free-rides if others contribute."
      *   *Result:* If everyone does it, no one contributes. So the condition "if others contribute" is never met. So no one free-rides. So everyone contributes? (Wait, no).
      *   *Analysis:* This looks like a game-theoretic instability.
      *   *Kantian Reply:* This isn't a contradiction in *conception* (the world is conceivable). Is it a contradiction in *will*? A rational will cannot will a system where cooperation is structurally unstable.
      *   *Better Reply:* These aren't valid maxims because they lack a universal *end*. They are merely reactive. A maxim needs a purpose (teleology). "Free-riding" presupposes the practice exists. Universalizing it destroys the presupposition. This collapses into CC.
      *   *Cost:* It requires a robust theory of what counts as a valid maxim (must have a stable end).

  5.  **Addressing Falsifiability/Insulation:**
      *   Is it unfalsifiable? To a degree, yes. But philosophical tests often are (like Rawls' Original Position).
      *   The constraint is *rational agency*. If the maxim description violates the conditions of agency (e.g., it's purely parasitic), it's rejected *before* the test.
      *   *Honest Assessment:* The view *is* insulated, but not arbitrarily. The insulation comes from the metaphysics of morals (what is a will? what is a law?). If you reject that metaphysics, the test fails. The test isn't empirical; it's transcendental.
      *   *Risk:* If *every* failure is explained away by "bad maxim formulation," it's ad hoc. There needs to be independent criteria for maxim individuation.

  6.  **Addressing the Consequentialist Leak:**
      *   Does CW rely on consequences?
      *   *Standard Defense:* No, it relies on the *concept* of a will. A will that wills its own inability to achieve ends is contradictory.
      *   *Critique:* To know I can't will non-beneficence, I have to imagine a world where no one helps. In that world, I suffer. I don't will that suffering.
      *   *The Leak:* If the "contradiction" is "I will X, but X leads to Y, and I can't will Y," that looks instrumental.
      *   *The Fix:* The contradiction isn't "I suffer." It's "I will a world where the *conditions of my agency* are undermined." Agency requires certain material conditions (help, development).
      *   *Verdict:* It leaks if "necessary ends" are cashed out empirically. It holds if "necessary ends" are transcendental conditions of agency.

  7.  **Drafting the Response:**
      *   *Structure:*
          1.  Acknowledge the sophistication of the user's position (it's the Korsgaard/O'Neill reading, roughly).
          2.  Rank the Defeaters (Fatal to Awkward).
          3.  Tackle the "Wobblers" (Conditional Maxims).
          4.  Tackle the Falsifiability/Insulation charge.
          5.  Tackle the Consequentialist Leak.
      *   *Tone:* Peer-to-peer, rigorous, avoiding intro-level Kant summaries.
      *   *Key References:* Korsgaard (Procedural realism), O'Neill (Constructivism), Hegel (Empty formalism), Parfit (Triviality).

  8.  **Refining the "Wobblers" Analysis:**
      *   The user's example: "I'll take the quieter road."
      *   Universalized: "Everyone takes the quieter road."
      *   Result: Traffic oscillates or equilibrium is reached. No contradiction.
      *   Is it immoral? No. So the test should pass.
      *   The user's worry is about the *free-rider* case. "I'll free-ride if others pay."
      *   Universalized: "Everyone free-rides if others pay."
      *   Result: No one pays. So the condition "if others pay" is false. So no one free-rides.
      *   This is a *performative contradiction* of the condition, not the action.
      *   *Diagnosis:* This is a CC failure. The maxim relies on a condition (others paying) that the universalized maxim renders impossible. It's structurally identical to false promising (relying on an institution the maxim destroys).
      *   *Cost:* Requires accepting that maxims with parasitic conditions are conceptually unstable.

  9.  **Refining the Consequentialist Leak:**
      *   This is the biggest threat.
      *   If CW says "You can't will a world where no one helps because *you might need help*," that is prudential/consequentialist.
      *   Kant needs: "You can't will a world where no one helps because a rational will necessarily wills the *furtherance of ends* as such."
      *   If the defender can't make that jump without pointing to "bad outcomes," it's rule-consequentialism.
      *   *Test Case:* Duties to self (e.g., suicide, neglecting talents). If the reason I shouldn't neglect talents is "it makes the world worse," it's consequentialist. If it's "it contradicts the will's nature as setting ends," it's Kantian.
      *   *The Leak:* Most modern defenders *do* rely on a thin theory of the good (agency needs X, Y, Z). If X, Y, Z are empirical, it leaks.

  10. **Final Review against User Constraints:**
      *   *Rank defeaters?* Yes.
      *   *Address Wobblers?* Yes.
      *   *Address Falsifiability?* Yes.
      *   *Address Consequentialist Leak?* Yes.
      *   *Honest about concessions?* Yes.

  11. **Self-Correction during drafting:** I need to make sure I don't just repeat the "empty formalism" objection (Hegel) without explaining *why* it might be fatal to *this specific version*. The user knows Hegel. I need to focus on the *mechanism* of the test. The "Necessary Ends" problem is the sharpest spear here. Also, distinguish between "empirical consequences" and "structural conditions of agency."

  12. **Final Polish:** Ensure the distinction between CC and CW is maintained throughout. Ensure the "Wobbler" analysis distinguishes between harmless coordination problems and parasitic free-riding. (The "quieter road" is a coordination equilibrium, not necessarily immoral. The "free ride" is the moral problem). I should clarify that the "quieter road" maxim *passes* the test, which is fine. The "free ride" maxim *fails*. The user's worry is that the failure mode isn't CC or CW. I need to argue it *is* CC.

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is a sophisticated position. You are defending what is often called the "procedural" or "constructivist" reading of the Formula of Universal Law (FUL), associated with scholars like Onora O'Neill and Christine Korsgaard, rather than the "act-utilitarian parody" reading. You are correct that the standard "what if everyone did that" objections (partial compliance, catastrophic 100% scenarios) miss the point of the *contradiction in conception* (CC) and *contradiction in the will* (CW) distinction.

  However, holding this line requires paying specific philosophical taxes. Below are the defeaters ranked from fatal to awkward, followed by an analysis of your "wobblers," the falsifiability charge, and the consequentialist leak.

  ### I. The Defeaters (Ranked)

  **1. Fatal: The "Necessary Ends" Gap (The CW Collapse)**
  The CC test works on logical/semantic contradiction (institutions presupposed by the maxim are destroyed by the maxim). The CW test works on teleological contradiction (the will wills something that undermines its own necessary ends).
  *   **The Defeater:** If you cannot specify the "necessary ends of a rational will" without recourse to empirical generalizations about what humans *happen* to desire, the CW test collapses into hypothetical imperatives or rule-consequentialism.
  *   **Why it kills the view:** Kant claims these ends (e.g., one's own perfection, the happiness of others) are *a priori*. If your defense of CW relies on saying, "You can't will non-beneficence because *you might need help someday*," you are reasoning from prudence (empirical contingency), not rationality.
  *   **The Concession:** You must concede that if the "necessary ends" are cashed out as "conditions for the satisfaction of preferences," the view is consequentialism with extra steps. To survive, you must argue that there are transcendental conditions of agency (e.g., "a will must will the conditions of its own efficacy") that are non-empirical. If that metaphysics is rejected, CW has no traction.

  **2. Fatal: The Maxim-Individuation Arbitrariness (The Insulation Charge)**
  *   **The Defeater:** If the output of the test can be flipped simply by re-describing the maxim (e.g., "I will lie" vs. "I will lie to save a life"), and there are no *independent* constraints on how maxims are individuated, the test is vacuous.
  *   **Why it kills the view:** A test that can be gamed by description is not a test.
  *   **The Concession:** You must concede that the FUL is not a standalone algorithm. It relies on a prior theory of action description. If you cannot provide criteria for maxim individuation that are *not* derived from the test results themselves (i.e., "the right description is the one that yields the right duty"), the view is circular.

  **3. Serious: The "Empty Formalism" Problem (Hegel's Ghost)**
  *   **The Defeater:** The test generates negative duties (don't lie, don't steal) relatively well via CC. It generates positive duties (help, develop talents) only via CW. But CW is much weaker. It shows non-beneficence is *irrational*, but not necessarily *wrong* in the same binding way as contradiction in conception.
  *   **Why it counts:** If the "duty" generated by CW is merely "it is imprudent/irrational to will this" rather than "it is morally forbidden," you have lost the deontological force.
  *   **The Concession:** You must concede that the binding force of imperfect duties (CW) is qualitatively different from perfect duties (CC). If you claim they are equally binding, you are overstating the test's power.

  **4. Awkward: Conflicts of Duty**
  *   **The Defeater:** Two maxims can both pass universalization but conflict in practice (e.g., "Keep promises" vs. "Prevent harm").
  *   **Why it counts:** The FUL provides no hierarchy.
  *   **The Concession:** You must concede the FUL is not a complete moral system. It needs a supplementary theory of moral weights or lexical ordering, which the FUL itself does not provide.

  ---

  ### II. The "Wobblers" (Conditional Maxims)

  You asked about maxims like: *"I'll free-ride as long as nearly everyone else is contributing."*
  Universalized: *"Everyone free-rides as long as nearly everyone else is contributing."*

  **Diagnosis:** This is not a new failure mode. It collapses into **Contradiction in Conception (CC)**, but it requires a specific understanding of "conception."

  1.  **The Instability:** You noted the flickering: if everyone does it, the condition ("others contributing") fails, so no one does it, so the condition holds...
  2.  **The Kantian Reply:** A maxim must have a stable *end*. The end of this maxim is "secure benefit without cost." The *means* is "relying on the contribution of others."
  3.  **The Contradiction:** When universalized, the *means* (others contributing) is rendered impossible by the *policy* (everyone free-rides). The maxim presupposes a practice (cooperation) that the universalized maxim destroys.
  4.  **Is it CC or CW?** It is CC. Just as the false promiser presupposes the institution of promising which his universalized maxim destroys, the free-rider presupposes the cooperative scheme which his universalized maxim destroys. The "flicker" is just the temporal unfolding of that destruction.
  5.  **The "Quieter Road" Case:** *"I'll take the quieter road."* Universalized, this creates a coordination equilibrium (traffic distributes evenly). There is no contradiction in conception (the world is stable) and no contradiction in the will (agency is not undermined). **The test correctly says this is permissible.**
  6.  **The Cost:** To make this work, you must adopt a **teleological constraint on maxims**. A maxim cannot be purely reactive ("I do X if they do Y"). It must posit an end ("I secure benefit"). If you allow purely reactive maxims, the test breaks. You must argue that a "maxim" without a stable end is not a rational principle of action at all.
      *   *Plausibility:* High. It aligns with Kant's view that the will is a faculty of ends.
      *   *Cost:* It restricts the scope of the test. It means the FUL only tests *purposive* rationality. It cannot adjudicate purely conventional or aesthetic choices that lack a "rational end" in the Kantian sense.

  **Verdict on Wobblers:** This is not a fatal flaw, but it forces you to tighten the definition of a "maxim." It costs you the ability to say the test applies to *any* rule of action; it only applies to rules of action that posit an end.

  ---

  ### III. Falsifiability and Insulation

  You asked: *Is the view insulated into unfalsifiability?*

  **Honest Answer:** Yes, but that is not necessarily fatal *if* you admit the insulation is transcendental, not empirical.

  1.  **The Insulation:** When a counter-example arises (e.g., "Why can't I lie to the murderer at the door?"), the defender says, "Your maxim was too specific," or "You are confusing the contradiction with the consequences."
  2.  **Is this Ad Hoc?** It is ad hoc *if* the criteria for "correct maxim description" are derived *from* the desired moral outcome. It is *not* ad hoc if the criteria are derived from a theory of rational agency independent of the specific moral case.
  3.  **The Content:** The content of the view is not "This action is wrong." The content is: **"Moral wrongness is identical to a specific kind of rational incoherence."**
  4.  **The Risk:** The view becomes unfalsifiable if *any* rational incoherence can be massaged away. To avoid this, you need **independent constraints on rationality**.
      *   *Example:* If you claim "Rational agents cannot will the destruction of their own agency," that is a substantive claim. If a case arises where an agent *can* will that (e.g., suicide, self-sacrifice), and you say "No, that's not rational," you are defining rationality to fit the morality.
      *   *The Fix:* You must ground "rationality" in something outside the moral test (e.g., the structure of deliberation, the nature of choice).
  5.  **Concession:** You must concede that the FUL is not an empirical hypothesis. It cannot be "disproven" by a thought experiment unless that thought experiment successfully demonstrates a coherent rational will that wills the contradiction. The burden is on the critic to show a *coherent* counter-example, not just an intuitive one.

  ---

  ### IV. The Consequentialist Leak (The "Sleep" Question)

  You asked: *Does the will-branch secretly reason from consequences?*

  **This is the most dangerous threat to your position.**

  1.  **The Leak:** In the CW test (non-beneficence), Kant argues you cannot will a world where no one helps. Why? Usually, the explanation is: "Because you yourself might need help."
  2.  **The Problem:** This is a prediction of a future state of affairs (consequence) that you dislike. If the "contradiction" is "I will X, X causes Y, I don't want Y," that is instrumental rationality. It is consequentialism (specifically, rule-egoism or rule-utilitarianism).
  3.  **Can the line hold?** It holds *only if* the "necessary end" is not "my happiness" but **"the efficacy of rational agency as such."**
      *   *Non-Consequentialist Reading:* I cannot will non-beneficence not because *I* might suffer, but because a will that wills the systematic frustration of ends (its own and others') contradicts the very nature of a will (which is to posit ends).
      *   *The Distinction:* Consequentialism asks: "Will this world have less good?" Kantianism asks: "Can a will coherently posit this law?"
  4.  **The Test Case:** **Duties to Self.**
      *   If I neglect my talents, a consequentialist says: "The world is worse off."
      *   A Kantian must say: "You are treating your agency as a mere thing, not an end."
      *   *The Leak:* If the reason I shouldn't treat my agency as a thing is "because it leads to bad outcomes for me," it leaks. If the reason is "because it is a category error in deliberation," it holds.
  5.  **Concession:** You must concede that **most popular defenses of CW do leak.** They rely on "you wouldn't want to live in that world." To plug the leak, you must adopt a **constitutive account of rationality**. You must argue that certain goods (help, talent) are *constitutive* of rational willing, not *objects* of it.
      *   *If you fail this:* You are defending a form of Rule Consequentialism that uses Kantian vocabulary.
      *   *If you succeed:* You are defending a metaphysical claim about the structure of volition that many find obscure or dogmatic.

  ### Summary: What Would Move You?

  To defend this view honestly, you should look for the following:

  1.  **The Fatal Blow:** A case where a maxim is clearly immoral, passes both CC and CW, and the only reason it "should" fail is because of the *bad consequences* of its universalization. (e.g., A maxim of "extreme frugality" that passes CC/CW but leads to universal misery). If you have to say "That's not immoral," you lose intuition. If you say "It fails CW," you likely leak consequentialism.
  2.  **The Wobbler Solution:** Accept that conditional/free-riding maxims fail via **CC** because they are parasitic on practices they destroy. Concede that this requires a teleological definition of "maxim."
  3.  **The Insulation:** Admit the test is transcendental. It is not falsified by intuition pumps, but by demonstrations of coherent rational volition.
  4.  **The Leak:** Acknowledge that the CW branch is the weak point. It is only non-consequentialist if "necessary ends" are transcendental conditions of agency, not empirical desires. If you cannot defend that metaphysics, the view collapses into a sophisticated consequentialism.

  **Final Verdict:** The view stands or falls on the **metaphysics of the will**. If "rational nature exists as an end in itself" is a substantive truth about agency, the test works. If it is a postulate added to save the phenomena of morality, the test is a circle. Your sleeplessness should be focused on whether you can defend the "necessary ends" claim without smuggling in empirical preferences.
