  Diachronic authorship, assessed
  Your diachronic authorship proposal suggests meaning accumulates through a lineage of interpreters. This resembles common law constitutionalism. It is not a third option but anti-intentionalism wearing intentionalist clothing. It rejects the founding moment as sole authority. However, it faces the notice problem. Law requires citizens to know rules in advance. If the author is a lineage, the rule changes with each interpretation. Citizens cannot predict the next link in the chain. This violates the rule of law's demand for stability. Intentionalism fixes the author to provide notice. Diachronic authorship makes the text fluid. It might describe how law actually works (precedent), but it fails as a normative theory of constraint. It collapses because it cannot distinguish legitimate evolution from judicial invention. If every interpreter is a co-author, the text loses its binding power. Yet, there is value in the description. Law *is* practiced this way via stare decisis. But as a theory of meaning, it conflates authority with interpretation. The founding text remains the source of authority; precedents are merely interpretations. If you make precedents co-authors, you dissolve the hierarchy. The notice demand is critical. Citizens must plan lives around fixed rules. Diachronic authorship implies rules shift as the lineage grows. This creates uncertainty. Intentionalism, despite its flaws, offers a fixed point. Your proposal risks making the text whatever the current court says, disguised as inheritance. It is anti-intentionalism because it denies the founding moment's exclusivity. It cannot satisfy the legal need for pre-existing standards. Therefore, it is not a viable third option for constitutional interpretation, though it accurately describes the common law method. It fails the specific demand of written constitutionalism: to bind the future to the past. It treats precedent as constitutive rather than interpretive. This undermines the written constitution's s