  The mapping
  In *Heller*, the text is the Second Amendment. For an intentionalist theory mapped onto originalism, the "author" is theoretically contested. Original intent originalism points to the Drafting Congress (Madison et al.). Original public meaning originalism, which Scalia explicitly adopts, points to the Ratifying Public—the reasonable citizen understanding the text in 1791. This shifts the author from a specific psyche to a collective linguistic community. Evidence includes drafting records, ratification debates, founding-era dictionaries (Johnson), legal treatises (Blackstone), and state constitutional analogues. The theory dictates the interpreter's job is archaeological: recover the fixed semantic content or intended purpose at the moment of ratification. The interpreter is bound by that historical meaning, regardless of modern policy consequences. In *Heller*, this means determining whether "the people" referred to a collective body (militia) or individuals, and whether "keep and bear Arms" covered private possession. The theory demands neutrality; the judge is a historian, not a policymaker. However, the theory must stipulate which "author" controls when drafting intent clashes with public understanding. Scalia prioritizes public meaning, treating the text as an objectified intent released into the wild, yet he still relies heavily on framer statements to illuminate that public understanding. This creates a hybrid: the author is the public, but the evidence is often elite drafting history. The job is to freeze meaning at enactment, preventing judicial updating. Consequently, the interpreter must ignore subsequent societal changes regarding violence or policing. The constraint is temporal: meaning is locked in 1791. The authority derives from the legitimacy of the founding act. If the author is the "people," evidence must reflect common usage, not just Federalist Papers. Scalia navigates this by treating legal terms of art as carrying specific intent known to the public. The mapping holds only if one accepts that historical recovery yields singular answers. The theory requires the judge to suppress contemporary moral reasoning in favor of historical fidelity. This distinguishes it from living constitutionalism, where the author is effectively the current generation. The intentionalist map demands a journey backward, treating the Constitution as a statute enacted by a distant sovereign whose will remains binding. Normatively, this claims to protect democracy by preventing judges from imposing personal values. It posits that the author's will is the only legitimate source of constitutional law. Thus, the interpreter serves as a conduit for the past.

  What the theory gets right
  Intentionalism correctly predicts the form of the argument: both majority and dissent treat history as authoritative. Stevens and Scalia do not debate whether 1791 matters, but what 1791 says. This validates the intentionalist claim that legal meaning is fixed at enactment. It explains why both opinions dive into Blackstone and state constitutions; if meaning were purely contemporary, this evidence would be irrelevant. The theory also explains the constraint felt by the justices; they cannot simply assert policy preferences but must anchor them in historical narrative. Intentionalism predicts that disagreements will center on evidence weighting. Stevens emphasizes the prefatory clause ("well regulated Militia") as revealing the purpose (intent), while Scalia emphasizes the operative clause ("right of the people") as revealing the semantic meaning. Both are standard intentionalist moves: one looks to purpose, the other to text-as-intent. The theory successfully accounts for the legitimacy strategy: claiming to follow the author avoids accusations of judicial activism. It explains why the Court spent 70 pages on history rather than prudential consequences. However, it does not predict the outcome, only the method. Both sides claim the mantle of the true intentionalist. The theory captures the institutional need for binding authority. By grounding rights in the past, the Court insulates them from majoritarian fluctuation. This aligns with intentionalism's core virtue: stability through fidelity. The dissent's focus on militia service reflects an intent-based purposivism, while the majority's focus on individual possession reflects a semantic intentionalism. Both accept the premise that the author's choice governs. Stevens argues for a purpose-bound right; Scalia for a text-bound right. Both claim fidelity. It confirms that legal interpretation is backward-looking by design. The theory captures the institutional need for binding authority.

  Where it breaks, and where it is silent
  The theory fractures on collective authorship. "The People" is a metaphor, not a mind. When drafting records conflict with ratification debates, intentionalism offers no principled selection rule; Scalia stipulates public meaning but uses elite evidence. The level-of-generality problem is fatal. Did the author intend to protect "arms," "musket-type weapons," or "weapons useful for defense"? Scalia chooses "weapons in common use," a standard not found in the text or history, but derived from a specific abstraction level. The theory is silent on how to select this level. Similarly, the gap between meaning and expected application is bridged illegitimately. The framers expected militia service; Scalia argues they meant individual right. When applying this to D.C. bans, the Court asks what the authors would have thought, not just what they meant. This shifts from semantic intent to imagined application. Evidence selection is equally unprincipled; Stevens cites English history, Scalia dismisses it. The theory cannot adjudicate conflicting historical signals. It demands singular meaning from plural sources.
  The "many minds" problem undermines the coherence of the author. A legislature is not a unitary agent. Intentionalism treats the output as a unified will, but *Heller* shows multiple wills competing. Stevens reads the militia clause as a limitation; Scalia reads it as a justification. Both are plausible reconstructions of intent. The theory provides no algorithm to choose between purposive intent (security of a free state) and semantic intent (right of the people). It breaks where history is silent. On handgun bans specifically, there is no direct evidence. The Court must infer from general principles. This is not recovery; it is construction. The theory claims to find meaning, but here it creates it to fill the gap. Furthermore, the selection of evidence is driven by the desired outcome. Scalia privileges dictionaries over legislative history when convenient. The theory is silent on evidentiary hierarchy. When expected applications diverge from semantic meaning, intentionalism usually privileges meaning. Yet Scalia relies heavily on what he claims were contemporary understandings of self-defense, blending meaning and application. The theory does not explain how to weigh these when they conflict. It breaks down because it promises objectivity but delivers stipulation. The level of generality determines the result, yet the theory offers no guidance on abstraction. Is the right to "arms" abstract (any weapon) or concrete (1791 weapons)? Scalia chooses a middle path ("common use") that serves modern policy while claiming historical fidelity. This reveals the theory's silence on the crucial mechanic of application. Ultimately, the theory cannot explain why one historical narrative wins without importing external values. It is silent on the choice of abstraction, which is where the real judicial work happens. This indeterminacy allows judges to project modern values onto history. The theory promises constraint but delivers discretion. It cannot explain why one historic