prompt: |-
  okay so me and my friend argued for like three hours about Szasz and whether mental illness is actually a myth, and now i realize my gut verdicts on real cases don't line up at all. here's where i land:

  - my uncle with schizophrenia, hears voices, can't work or live alone. i think thats a real brain disease, not a Szasz-style myth. but if he's competent and refuses meds, forcing them on him feels wrong in a different way than forcing chemo? i don't know, the condition itself is real though.

  - my coworker diagnosed with "social anxiety disorder" who just hates open offices and small talk. total bs, just pathologizing normal shyness to sell pills.

  - a guy with delusions after a brain tumor. clearly medical, not a myth.

  - my cousin in a psych ward after a suicide attempt. she was depressed, but she also just got dumped and fired. i keep flip-flopping: is that a real illness or just doctors labeling a crushing life crisis "major depressive disorder" to avoid dealing with her actual problems? i feel like if she was diabetic refusing insulin we'd step in, but with her i think forced treatment was wrong even though she was in real pain. so is it real or not?

  - ADHD in kids. half the time it's just boys being boys and teachers wanting quiet classrooms, but then there's kids with actual brain differences who genuinely can't focus. so split verdict: some ADHD is myth, some isn't.

  - addiction. my friend said Szasz would call alcoholism a myth too, but withdrawal and brain changes make it feel real. yet "sex addiction" and "shopping addiction" feel like made-up excuses. so where's the line?

  - and OCD? i haven't decided. if someone spends eight hours washing hands because they're terrified of germs, but they know rationally the risk is tiny and still can't stop—does that count as a real distortion or just an extreme response?

  i came up with this rough idea that maybe the line is between conditions that actually distort reality-testing (schizophrenia, tumor delusions, maybe OCD?) versus conditions that are just extreme reactions to real situations (social anxiety, depression after job loss, some ADHD labeling). but then addiction doesn't fit neat, and schizophrenia sometimes has no visible brain lesion. so is there one principle that saves my verdicts, or do i have to drop one? and what does it say about that OCD case? please don't give me a bibliography or ask me to cite Szasz's books, i just want to think through the logic with no web access. also tell me which of my intuitions breaks first if i try to make the principle simple.
