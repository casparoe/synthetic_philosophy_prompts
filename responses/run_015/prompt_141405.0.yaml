answer: |-
  # Decision Tree: Mapping Inferences Beyond "What Is Said"

  **Instructions:** Start at Node 1 with a specific inference a hearer has drawn from an utterance. Answer **Yes** or **No** based on the tests provided. Follow the arrows to the next node or a leaf.

  ### The Tree

  **Node 1: Speaker Endorsement**
  If the speaker learned you drew this conclusion, could they deny it without admitting they misspoke or lied about their communicative intent?
  *   **No** → **Leaf A: Observer Meaning** (Hearer Over-inference)
  *   **Yes** → Go to Node 2

  **Node 2: Truth-Conditional Impact**
  If this inferred content turns out to be false, does that make the original utterance false?
  *   **Yes** → Go to Node 3 (Explicature Territory)
  *   **No** → Go to Node 7 (Implicature/CI Territory)

  **Node 3: Propositional Completion**
  Without this inference, does the sentence fail to express a complete claim that can be judged true or false at all?
  *   **Yes** → **Leaf B: Saturation Explicature**
  *   **No** → Go to Node 4

  **Node 4: Reference Fixing**
  Is the inference required to identify *who* or *what* a noun phrase refers to in the world?
  *   **Yes** → **Leaf C: Reference Explicature**
  *   **No** → Go to Node 5

  **Node 5: Lexical Precision**
  Is the inference adjusting the precision of a word (e.g., allowing 'empty' to mean 'mostly empty') to fit the situation?
  *   **Yes** → **Leaf D: Loose Explicature**
  *   **No** → Go to Node 6

  **Node 6: Lower-Bound Fixing**
  Is the inference determining the minimum value of a quantity term (e.g., establishing that 'three' means 'at least three')?
  *   **Yes** → **Leaf E: Lower-Bound Explicature**
  *   **No** → **Leaf F: [Empty Combination]** *(See Note 1)*

  **Node 7: Lexical Trigger**
  Does the inference vanish if you replace a specific word (like 'but' or 'therefore') with a neutral synonym (like 'and' or 'so'), keeping the truth conditions the same?
  *   **Yes** → Go to Node 8 (Conventional Implicature Territory)
  *   **No** → Go to Node 9 (Conversational Implicature Territory)

  **Node 8: Projectivity**
  If you negate the sentence (say "It is not the case that..."), does this inferred content remain attached to the claim?
  *   **Yes** → **Leaf G: Conventional Implicature**
  *   **No** → **Leaf H: [Empty Combination]** *(See Note 2)*

  **Node 9: Cancelability**
  Can the speaker explicitly add "but not..." to the end of the utterance without sounding contradictory?
  *   **No** → **Leaf I: [Empty Combination]** *(See Note 3)*
  *   **Yes** → Go to Node 10

  **Node 10: Context Dependence**
  Would a hearer draw this inference even if they knew nothing about the specific time, place, or people involved, just from the sentence?
  *   **Yes** → Go to Node 11
  *   **No** → **Leaf J: Particularized Conversational Implicature**

  **Node 11: Scalar Strength**
  Is the inference ruling out a stronger alternative on a scale (e.g., ruling out 'all' when 'some' is said)?
  *   **Yes** → **Leaf K: Generalized Conversational Implicature**
  *   **No** → **Leaf L: Default Non-Scalar Implicature** *(See Note 4)*

  **Node 12: Calculability** *(Unused in main path, reserved for Leaf L verification)*
  Does the inference rely on the assumption that the speaker is being cooperative and informative?
  *   **Yes** → **Leaf L: Default Non-Scalar Implicature**
  *   **No** → **Leaf F: [Empty Combination]**

  ---

  ### Case Studies: Walking the Tree

  **1. 'The ham sandwich is getting impatient'**
  *   *Inference:* The speaker is referring to the customer who ordered the ham sandwich, not the food itself.
  *   **Node 1 (Endorsement):** **Yes.** The speaker meant that.
  *   **Node 2 (Truth-Conditional):** **Yes.** If it was the waiter getting impatient, the utterance is false.
  *   **Node 3 (Completion):** **No.** The sentence is grammatically complete without the inference.
  *   **Node 4 (Reference):** **Yes.** We need to know *who* is impatient.
  *   **Result:** **Leaf C: Reference Explicature.**

  **2. 'The lecture hall was empty' (said when two people were there)**
  *   *Inference:* There were very few people there (not literally zero).
  *   **Node 1:** **Yes.**
  *   **Node 2:** **Yes.** If it was actually full, the utterance is false.
  *   **Node 3:** **No.**
  *   **Node 4:** **No.** Reference is clear (the hall).
  *   **Node 5 (Precision):** **Yes.** 'Empty' is being loosened.
  *   **Result:** **Leaf D: Loose Explicature.**

  **3. 'I ate three of the cookies'**
  *   *Inference A:* I ate *at least* three.
      *   **Node 1:** **Yes.**
      *   **Node 2:** **Yes.** If I ate only two, the utterance is false.
      *   **Node 3:** **No.**
      *   **Node 4:** **No.**
      *   **Node 5:** **No.** (Not precision/looseness).
      *   **Node 6 (Lower-Bound):** **Yes.**
      *   **Result:** **Leaf E: Lower-Bound Explicature.**
  *   *Inference B:* I ate *exactly* three (not four).
      *   **Node 1:** **Yes.**
      *   **Node 2:** **No.** If I ate four, "I ate three" is still technically true (semantically).
      *   **Node 7 (Trigger):** **No.** (Not tied to a specific function word).
      *   **Node 9 (Cancelability):** **Yes.** ("...in fact I ate four").
      *   **Node 10 (Context):** **Yes.** (Arises from the word 'three' generally).
      *   **Node 11 (Scalar):** **Yes.** (Rules out 'four', 'five'...).
      *   **Result:** **Leaf K: Generalized Conversational Implicature.**

  **4. 'She's poor but honest'**
  *   *Inference:* There is a contrast between being poor and being honest.
  *   **Node 1:** **Yes.**
  *   **Node 2:** **No.** If there is no contrast, the sentence is still true (she is poor and she is honest).
  *   **Node 7 (Trigger):** **Yes.** Replace 'but' with 'and', the contrast inference vanishes.
  *   **Node 8 (Projectivity):** **Yes.** ("It's not the case that she's poor but honest" still suggests a contrast exists between the concepts).
  *   **Result:** **Leaf G: Conventional Implicature.**

  **5. 'Some of the students passed'**
  *   *Inference:* Not all of the students passed.
  *   **Node 1:** **Yes.**
  *   **Node 2:** **No.** (If all passed, 'some' is still semantically true).
  *   **Node 7:** **No.**
  *   **Node 9:** **Yes.** ("...in fact all of them did").
  *   **Node 10:** **Yes.**
  *   **Node 11:** **Yes.** (Rules out 'all').
  *   **Result:** **Leaf K: Generalized Conversational Implicature.**

  **6. Reference Letter ('Perfect attendance, lovely handwriting')**
  *   *Inference:* The candidate is no good at philosophy.
  *   **Node 1:** **Yes.** (The writer intends this to be understood).
  *   **Node 2:** **No.** (The letter can be factually true even if the candidate is a genius).
  *   **Node 7:** **No.**
  *   **Node 9:** **Yes.** (Theoretically cancelable: "...and he is also a brilliant theorist," though pragmatically odd).
  *   **Node 10:** **No.** (Depends on the context of writing a recommendation).
  *   **Result:** **Leaf J: Particularized Conversational Implicature.**

  **7. Hearer infers 'The writer hates the candidate' (from the Letter)**
  *   *Inference:* Personal animosity.
  *   **Node 1:** **No.** (The writer can deny this without contradiction: "I don't hate him, I just have nothing positive to say").
  *   **Result:** **Leaf A: Observer Meaning.**

  ---

  ### Notes on Empty Combinations & Contested Ground

  **Note 1 (Leaf F: Truth-Conditional but not Explicature):**
  *   *Why Empty:* If an inference affects truth conditions (Node 2=Yes) but isn't required for completion, reference, looseness, or lower-bounds, it is difficult to categorize in standard taxonomies. Some theories might place certain presuppositions here, but presuppositions usually fail the truth-conditional test (Node 2=No) in modern semantics.
  *   *Violence to Material:* This node forces a binary on truth-conditions. Some theorists argue that *all* pragmatic enrichment is truth-conditional (Contextualism), which would collapse the top half of the tree.

  **Note 2 (Leaf H: CI that doesn't Project):**
  *   *Why Empty:* By definition, Conventional Implicatures (like 'but', 'therefore') project out of negation and modals. If an inference attached to a word disappears under negation, it is likely part of the truth-conditions (Node 2=Yes), not a CI.

  **Note 3 (Leaf I: Uncancelable Conversational Implicature):**
  *   *Why Empty:* A core test for Conversational Implicature is cancelability. If an inference cannot be canceled without contradiction, and it isn't truth-conditional, and it isn't tied to a specific word (CI), it occupies a logical space that standard Gricean theory says shouldn't exist. (Some argue certain Generalized Implicatures are hard to cancel, but they remain theoretically cancelable).

  **Note 4 (Leaf L vs. Leaf K: Generalized vs. Default):**
  *   *Flagged Indistinction:* The tree distinguishes **Leaf K (Scalar GCI)** from **Leaf L (Default Non-Scalar)**. However, in practice, these are hard to pull apart. Is "I broke a finger" → "I broke my own finger" a Generalized CI (Leaf K) or a Default Inference (Leaf L)?
  *   *Contested Ground:* Many pragmatics (e.g., Relevance Theorists) argue **Leaf K** shouldn't exist as a separate category. They argue scalar inferences (Some→Not All) are either part of **Leaf E (Explicature)** or **Leaf J (Particularized)** depending on context, rejecting the "Generalized" middle ground. Similarly, the status of **Leaf E (Lower-Bound)** is disputed: Griceans say "three" semantically means "at least three" (Semantics), while others argue it is pragmatically enriched (Explicature).

  ### Consensus vs. Dispute Map

  | Leaf | Status | The Dispute |
  | :--- | :--- | :--- |
  | **A: Observer Meaning** | **Common Ground** | Generally accepted as "not speaker meaning." |
  | **B, C: Explicature** | **Common Ground** | Everyone agrees reference/disambiguation is needed for "what is said." |
  | **D: Loose Explicature** | **Contested** | Is 'empty' meaning 'mostly empty' a change in *what is said* (Explicature) or an implicature? Relevance Theory says Explicature; traditionalists may say Implicature. |
  | **E: Lower-Bound** | **Highly Contested** | Is "at least three" semantic (literal meaning) or pragmatic (enriched explicature)? The tree treats it as Explicature, but many semanticists place this in the lexicon. |
  | **G: Conventional CI** | **Stable but Rare** | 'But' and 'therefore' are standard examples, but some semanticists try to fold these into truth-conditions (expressivist semantics). |
  | **K: Generalized CI** | **Highly Contested** | Neo-Griceans (Horn, Levinson) love this category. Relevance Theorists and Contextualists often reject it, arguing all implicatures are particularized (Leaf J) or explicatures (Leaf E). |
  | **J: Particularized CI** | **Common Ground** | The standard example of pragmatics in action (the Reference Letter). |

  **Where the Tree Does Violence:**
  The tree presents a **Neo-Gricean/Standard Pragmatics** view. It forces a clean split between "What is Said" (Explicature) and "What is Implicated."
  1.  **Contextualism:** If you are a Contextualist, you believe Node 2 (Truth-Conditions) is *always* influenced by Node 10 (Context). The tree implies you can check Truth-Conditions *before* checking Context Dependence, which Contextualists deny.
  2.  **The "Generalized" Middle:** The tree validates the existence of Generalized Implicatures (Leaf K). If your reading group leans towards Relevance Theory, they may argue Leaf K should be merged into Leaf J (it's always context-dependent) or Leaf E (it's often explicature).
  3.  **Metonymy:** The tree places 'Ham Sandwich' in Reference Explicature (Leaf C). Some linguists argue metonymy is a form of implicature or a distinct pragmatic process not captured by the Explicature/Implicature binary.
