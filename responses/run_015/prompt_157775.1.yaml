  **Seminar Plan: The Internal Reasons Thesis**

  **Carrying Scenario:** A student practising oboe scales solely to inherit a family estate, lacking any musical interest or desire for wealth.
  **Justification:** Gunman cases conduce to prudential necessity, obscuring normative force; moral blackmail conflates duty with motivation. The oboe case isolates instrumental rationality from intrinsic valuation, preventing confusion between coercion and reason. It ensures the 'wrong kind of reason' problem is not mistaken for a threat-based obligation.

  **Conceptual Sequence:**
  1.  **Instrumental Rationality (0–20 mins):** Establish that scales serve the concerto. *Misconception Intercept:* Students may claim there is "no reason" to practise scales. Clarify: there is a hypothetical reason, contingent on the end. Stop the slide from 'instrumental failure' to 'no reason whatsoever'.
  2.  **Valuing the End (20–40 mins):** Question the inheritance motive. If the agent lacks desire for the estate, does the reason persist? *Misconception Intercept:* Prevent conflating objective value with agent-relative reasons. Ensure they see the gap between 'good end' and 'reason for agent'.
  3.  **The Motivation Link (40–60 mins):** Introduce the claim that reasons must be capable of motivating. *Misconception Intercept:* Students often conflate this with weakness of will. Clarify: this is about the *existence* of a reason, not the failure to act on one. Intercept the assumption that normative force just is psychological efficacy.
  4.  **Internal vs External (60–80 mins):** Define internal reasons as those grounded in the subjective motivational set. *Misconception Intercept:* Distinguish explaining action from justifying it.

  **Diagnostic Question (80–85 mins):**
  "If an agent remains unmoved by a fact despite ideal deliberation, does that fact constitute a reason for them?"
  (Tests grasp of the dependency between reasonhood and motivational potential.)

  **Omissions:**
  1.  **Williams's 'Subjective Motivational Set' details:** Too technical for a first pass; distracts from the core normative problem.
  2.  **Externalist Rebuttals:** Premature; students must first grasp the internalist challenge before evaluating counter-arguments.
  3.  **Neuroscientific Correlates:** Category error; risks reducing normative questions to psychological descriptions, thereby reinforcing their documented tendency to treat philosophical distinctions as psychological descriptions.

  **Rationale:** This sequence forces students to derive the internal/external distinction from the failure of instrumental reasoning to ground ends, rather than stipulating it dogmatically.
