answer: |-
  ### Exam Question: Moral Philosophy Seminar

  **Question:**
  Situationist critics argue that Aristotelian virtue ethics relies on a empirically false psychology of global, cross-situational character traits. In response, some defenders propose a "domain-indexed" conception of virtue, wherein traits like courage or honesty are stable only within specific spheres of activity (e.g., professional vs. domestic) rather than across an agent's entire life.

  Write an essay evaluating whether this domain-indexed retreat successfully preserves the core commitments of Aristotelian virtue ethics or whether it effectively concedes the situationist critique. In your analysis, you must:
  1.  Distinguish between *trait possession* and *trait expression* in the context of domain-specificity.
  2.  Analyze how the fragmentation of practical domains impacts the operation of *phronesis* (practical wisdom) and the Aristotelian thesis of the unity of virtues.
  3.  Assess whether moral evaluations (praise, blame, and character attribution) remain meaningful if an agent displays a virtue in one domain but its corresponding vice in another.

  ***

  ### Model Answer

  The situationist challenge threatens virtue ethics by arguing that empirical evidence shows behavior is determined by situational variables rather than robust character traits. The "domain-indexed" defense attempts to salvage virtue ethics by retreating from global consistency to local stability. While this move immunizes virtue theory against certain empirical counterexamples, it ultimately undermines the Aristotelian conception of character by fragmenting *phronesis* and rendering holistic moral evaluation incoherent.

  To evaluate this defense, one must first distinguish between trait possession and trait expression. Situationists attack the inference from behavior to possession, arguing that inconsistent expression proves non-possession. The domain-indexed defender argues that an agent can possess courage in the professional domain while expressing cowardice in the domestic domain without contradiction. However, this redefines possession. For Aristotle, to possess a virtue is to have a settled state of character (*hexis*) that informs one's overall orientation toward the good. If courage is merely a local reliability mechanism triggered by specific contextual cues (e.g., a boardroom but not a living room), it resembles a conditioned habit more than a moral virtue. By restricting possession to domains, the defender saves the *label* of virtue but evacuates it of its status as a deep psychological structure. The trait becomes a description of local behavioral patterns rather than an explanation of agency.

  This fragmentation is most damaging when applied to *phronesis*. In Aristotelian ethics, practical wisdom is the intellectual virtue that allows an agent to discern the mean relative to them across all contexts. Crucially, Aristotle posits the unity of virtues: one cannot fully possess one virtue without *phronesis*, and without *phronesis*, one cannot possess any virtue fully. *Phronesis* requires a unified conception of the good life (*eudaimonia*). If virtues are domain-indexed, *phronesis* is likewise siloed. An agent might exhibit practical wisdom in navigating professional ethics but lack the perceptual capacity to recognize moral demands at home. This contradicts the Aristotelian view that moral perception is a unified capacity. If *phronesis* cannot traverse domains, it is no longer wisdom regarding the human good, but merely technical proficiency within a specific sphere. Consequently, the domain-indexed retreat collapses the distinction between moral virtue and social competence.

  Finally, we must consider the meaningfulness of moral evaluation. Virtue ethics traditionally grounds praise and blame in the agent's character, not just their isolated acts. If character is fragmented, global attribution becomes impossible. We cannot call an agent "courageous" simpliciter, only "courageous-at-work." While this allows for localized praise, it undermines the reactive attitudes central to moral life. We typically blame agents for hypocrisies that span domains (e.g., a honest judge who lies to their spouse). If virtues are domain-relative, this hypocrisy vanishes conceptually; the agent is simply operating within different normative frameworks. This renders character assessment superficial. We are no longer evaluating the person, but rather their performance in specific scripts. While this avoids the situationist claim that traits *never* exist, it accepts the situationist premise that the *self* is not a unified moral agent.

  In conclusion, the domain-indexed defense is a pyrrhic victory. It preserves the existence of traits by lowering the bar for what counts as a trait, shifting from global character to local reliability. However, in doing so, it abandons the Aristotelian commitment to the unity of the self and the integrative function of *phronesis*. It saves virtue ethics from empirical falsification only by transforming it into a theory of context-dependent behavioral dispositions, which is precisely the form of situationism it sought to avoid.

  ***

  ### Marking Scheme

  **Total Marks: 100**

  **Grade Boundaries:**
  *   **A (80-100):** Sophisticated synthesis. Explicitly connects domain-indexing to the fragmentation of *phronesis* and the unity of virtues. Clear distinction between possession and expression. Original critical conclusion.
  *   **B (70-79):** Competent analysis. Identifies the tension and discusses *phronesis* or moral evaluation well, but may lack depth on the "possession vs. expression" distinction or the unity of virtues thesis.
  *   **C (60-69):** Descriptive. Summarizes the situationist challenge and the domain response but fails to critically evaluate whether the retreat *works*. Limited engagement with *phronesis*.
  *   **D/F (<60):** Significant misunderstandings of virtue ethics or situationism. Fails to address the prompt's specific requirements.

  **Detailed Breakdown of Philosophical Moves**

  | Criterion | Marks | Required Move for 'A' Grade | Required Move for 'B' Grade | Common Pitfalls |
  | :--- | :---: | :--- | :--- | :--- |
  | **1. Situationist Context & Domain Defense** | 15 | Identifies that situationists attack *cross-situational consistency*, not local reliability. Explains domain-indexing as a strategic retreat. | Identifies the situationist challenge generally. Explains domain-indexing as limiting virtues to specific contexts. | Treating situationism as claiming "no behavior is ever stable" (too strong). Describing domain-indexing without explaining *why* it is a response to situationism. |
  | **2. Trait Possession vs. Expression** | 25 | Argues that domain-indexing redefines *possession* from a *hexis* (settled state) to a local habit. Notes that saving the label may lose the substance. | Distinguishes between having a trait and showing it. Notes that domain-indexing allows possession in one area but not another. | Conflating possession with expression (e.g., "If they don't act brave, they aren't brave"). Failing to note that Aristotle views possession as a unified state. |
  | **3. Phronesis & Unity of Virtues** | 30 | **Crucial Differentiator.** Argues that *phronesis* must be unified to grasp *eudaimonia*. Domain-siloing fragments *phronesis*, turning it into technical skill. | Mentions *phronesis*. Notes that separating domains makes wisdom inconsistent. | Ignoring *phronesis* entirely. Treating *phronesis* as simple decision-making rather than a unified intellectual virtue. |
  | **4. Moral Evaluation (Praise/Blame)** | 20 | Analyzes how fragmentation undermines global character attribution. Discusses the loss of meaning in calling someone "good" or "bad" overall. | Discusses that we can still praise/blame within domains. Notes it makes evaluation more limited. | Claiming moral evaluation becomes impossible (too strong). Ignoring the impact on the concept of the "moral agent." |
  | **5. Synthesis & Argument** | 10 | Concludes that the retreat concedes the situationist view of the self (fragmented) even if it saves traits. | Concludes that the defense is partially successful or unsuccessful. | No clear conclusion. Merely summarizing both sides without taking a stance. |

  **Examiner's Note on Grading:**
  *   **The 'A' Differentiator:** The key distinction between an A and a B lies in Criterion 3 (*Phronesis*). A B student will argue that domain-indexing allows virtues to exist locally. An A student will recognize that for Aristotle, virtues *cannot* exist locally because they are tied to a unified conception of the good life via *phronesis*. Therefore, the A student argues that the defense actually destroys the Aristotelian framework it tries to save.
  *   **Common Error:** Many students will treat virtues as simple behavioral dispositions (e.g., "honesty is just telling the truth"). Ensure marks are deducted if they fail to treat virtues as psychological structures involving reasoning and emotion (Criterion 2).
  *   **Word Count:** The model answer is approx. 700 words. Students should be penalized minimally for slight deviations, but significant brevity usually indicates a lack of depth in Criterion 3.
