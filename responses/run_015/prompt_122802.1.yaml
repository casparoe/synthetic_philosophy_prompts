          *   *Nuance:* Proponents argue the *configuration* creates new meaning (Mink's "synoptic judgment").
      *   **Defeater 2: The Underdetermination/Equivalence Test.**
          *   *Idea:* Two narratives, same facts, different shapes (e.g., Fall of Rome as Tragedy vs. Inevitable Decay). Do historians have epistemic grounds to choose?
