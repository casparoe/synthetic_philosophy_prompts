  2.  **Deconstruct the Philosophical Context:**
      *   This is the classic "Narrative vs. Covering Law" debate in philosophy of history.
      *   *Proponents of Narrative:* Mink, Dray, Veyne, White (though White is more constructivist), Gallie (following narratives).
      *   *Critics/Opponents:* Hempel, Danto (somewhere in between), analytical philosophers of history who want causal mechanisms.
      *   *Key Concept:* "Followability" (Gallie), "Configuration" (Mink), "Employment" (White).
      *   *The User's Stance:* Realist about narrative explanation. It's not just rhetoric; it's cognitive/epistemic.

  3.  **Brainstorming Defeaters (Internal/Concedable):**
      *   *The "Covert Mechanism" Problem:* If historians argue about narratives by arguing about *causal links* (e.g., "A didn't cause B because..."), aren't they actually doing causal modeling?
      *   *The "Equifinality/Underdetermination" Problem:* Can two radically different narrative shapes (e.g., Tragedy vs. Romance) fit the *exact* same set of verified causal facts? If historians can't choose, narrative shape is aesthetic, not explanatory.
      *   *The "Counterfactual" Problem:* Explanation usually implies "if X hadn't happened, Y wouldn't." Narrative often implies "X led to Y." If the narrative can't support counterfactuals, is it explanation or just description?
      *   *The "Gappiness" Problem:* How many links can you remove before the narrative breaks? If it's robust to removal, the links aren't doing work. If it's fragile, is it just a chain of causal claims?
      *   *The "Psychological/Cognitive" Problem:* Is the "followability" just a feature of human cognition (we like stories) rather than a feature of the world (how history actually works)?

  4.  **Ranking the Defeaters:**
      *   *Fatal:* If narrative shape turns out to be purely aesthetic with no truth-conditional difference. If "explanation" reduces to "persuasion."
      *   *Awkward but Manageable:* If narrative relies on background causal knowledge (this is almost admitted by most narrative theorists).
      *   *The "Hedge" Question:* This is crucial. Is it a retreat?

