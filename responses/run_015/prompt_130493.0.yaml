answer: |-
  ### Brainstorming & Analysis

  You are walking into a minefield that moral philosophers have been navigating for centuries, but you need a practical map, not a history of the mines. The core tension you are facing is between **description** (what people actually believe) and **prescription** (what the model should enforce). Your team is trying to build a prescriptive rubric based on descriptive data, and the friction points (thresholds, loyalty, historical change) are exactly where description and prescription collide.

  **On the Group Swap Probe:**
  You are right to be suspicious. The probe is rigged. It assumes that **impartiality** is the null hypothesis of morality. It treats "treating in-group and out-group differently" as a deviation that needs explaining (bias), rather than a potential core feature of the moral system (particularism). In many cultures, morality *is* the specific duty owed to specific people. Swapping the groups changes the moral facts, not just the bias.
  *Verdict:* The probe is valid *only if* your rubric explicitly commits to impartiality as a core value. If your rubric claims to be "neutral," using this probe secretly imposes Western liberal impartiality.
  *Requirement:* A theory must declare whether impartiality is a procedural tool or a substantive value. If a verdict fails the probe, the theory must say whether that failure is a bug (bias) or a feature (contextual duty).

  **On Threshold Divergence:**
  This is your most valuable data point. "Ordinal agreement with threshold divergence" suggests a shared moral grammar (everyone knows pain is worse than rudeness) but different cultural "sensitivity settings." A theory that treats this as "disagreement" misses the structure. A theory that treats it as "noise" loses the signal. The theory needs to model morality as a vector space where cultures point in similar directions but stop at different distances.
  *Requirement:* The theory must accommodate magnitude disagreement without collapsing it into binary right/wrong.

  **On Historical Change:**
  This is the trap. If you say "past societies were wrong," you imply there is a timeless standard (Absolutism). If you say "past societies were just different," you cannot condemn current atrocities if the culture supports them (Relativism). You need a **Dynamic Constructivist** view: moral truths are built through practice and reflection, and "progress" is the expansion of the circle of concern or the reduction of unnecessary suffering, identified *retrospectively* through the failure of old systems to sustain themselves or meet their own ideals.
  *Requirement:* The theory must allow for "retrospective correction" without requiring a "God's eye view" in the present.

  **On the Unsatisfiable Tension:**
  You want a procedure for non-philosophers (Simplicity) that handles deep meta-ethical tensions (Nuance). These are in tension. A simple flowchart cannot solve the problem of moral imperialism vs. moral progress. You will have to accept that some cases will remain "unresolved disagreements" rather than "classified errors."

  **On the Rejected Demand:**
  The demand that "The theory must yield a single correct verdict for every case" is a prejudice of the Universalist/Absolutist camp. It assumes morality is a calculation with one answer. A functional theory must allow for "legitimate variation zones."

