  Headline Number: **0.42**

  I am slightly more optimistic than you (0.35) but far from convinced. The flatmate (0.05) is guarding a definition of rationality that is too narrow for the real world, but your defense risks smuggling forward-looking benefits in through the back door. Here is the decomposition.

  ### The Decomposition

  **(a) The Scope of the Marginal Principle: 0.85**
  *Justification:* The "only marginal costs matter" rule is a normative axiom for idealized utility maximizers, not an empirical truth about human reasoning or a binding constraint on all coherent agency.

  **(b) Acts vs. Policies (Resolute Choice): 0.25**
  *Justification:* While adopting a policy of "finish what you start" can be rational, following it in a specific instance is usually justifiable via the forward-looking benefit of maintaining the policy, not the past cost itself.

  **(c) Lumpiness and Completion Thresholds: 0.20**
  *Justification:* Lumpy goods explain why we finish projects, but the reason is typically the *future* value of completion, not the *past* cost incurred; the sunk cost is usually incidental to the completion calculus.

  **(d) Self-Signalling and Information: 0.00**
  *Justification:* You explicitly excluded this; if the reason is to learn about your discount function or build a reputation, the justification is purely forward-looking instrumental value.

  **(e) Normative Status of Waste/Integrity: 0.35**
  *Justification:* This is the crux; rationality must permit terminal disvalue for "waste" or intrinsic value for "narrative coherence" independent of future psychological consequences.

  ### How They Combine

  The claim holds if **(a)** is true (the econ principle isn't absolute) **AND** at least one mechanism **(b, c, or e)** successfully generates an *irreducible* backward-looking reason. I treat (b), (c), and (e) as independent pathways to the conclusion, though they overlap.

  $$ P(\text{Claim}) = P(a) \times [1 - (1-P(b)) \times (1-P(c)) \times (1-P(e))] $$

  $$ P(\text{Claim}) = 0.85 \times [1 - (0.75 \times 0.80 \times 0.65)] $$

  $$ P(\text{Claim}) = 0.85 \times [1 - 0.39] = 0.85 \times 0.61 \approx 0.52 $$

  *Correction for "Realistic Class" Constraint:* The math above suggests 0.52, but I am discounting this by ~20% because finding a case that is *realistic* yet *not* collapsible into forward-looking terms (b and c usually collapse) is extremely difficult. The weight rests almost entirely on (e). Adjusting for the high bar of "irreducibility," I land at **0.42**.

  ### Sensitivity Analysis

  **Most Sensitive Term:** **(e) Normative Status of Waste/Integrity.**
  If you concede that "waste" is only bad instrumentally (i.e., because it reduces future resources or morale), the probability crashes to near the flatmate's 0.05. If you accept that honoring past investment can be a terminal value (a deontological constraint or virtue), the probability jumps above 0.70.

  **The Shove Argument:**
  *   **Upward:** A case of **memorialization**. If it is rational to spend resources maintaining a grave for a loved one (who gains no utility), it is rational to spend resources honoring a past project for the sake of the past self. This decouples value from future consequences entirely.
  *   **Downward:** A **perfect pre-commitment market**. If an agent could costlessly sell their "obligation to finish" to another agent who values it more, continuing personally would always be irrational. The existence of such markets (even hypothetical) suggests the value is always fungible/forward-looking.

  ### The Researcher Case

  This lands squarely on term **(e)**, but your description leaks into forward-looking territory.
  *   **Your framing:** "Damage to her willingness to start anything ambitious again." This is forward-looking (protecting future agency/confidence). Your flatmate will crush this; it's an investment in human capital.
  *   **The winning framing:** "It is *in itself* a worse life story for those four years to be nullified." If the reason is that the *truth* of her biography is worse if she quits, regardless of how she feels about it later, that is irreducibly backward-looking.
  *   **Verdict:** As you stated it, it's a forward-looking psychological hedge (Probability ~0.10). If reframed as narrative integrity, it's the strongest candidate for the claim (Probability ~0.60).

  ### Confidence and Vulnerability

  **Confidence Level:** **65%**
  This is philosophy, not physics. The number reflects the current state of the literature on diachronic rationality, not a calculable frequency.

  **Claim I'd Be Least Surprised to Be Wrong About:** **Term (b) Acts vs. Policies.**
  I assigned it a low probability (0.25) because standard resolute choice theory usually justifies policy-following via future benefits. However, if "resoluteness" is constitutive of agency rather than instrumental to it, (b) could be much higher, which would validate your position more than I have credited here. I am betting against a strong theory of constitutive agency, and that is the shakiest node in my tree.
