answer: |-
  # The Liar Commitment Mapper: A Pedagogical Decision Tree

  ## Introduction
  This instrument is designed to locate a respondent's theoretical commitments regarding semantic pathology without presupposing familiarity with specific schools of thought. The tree proceeds from concrete verdicts on specific logical tasks to abstract structural commitments. Navigate the nodes sequentially. At each node, select the verdict that best matches your intuitive or argued judgment.

  ---

  ## Part I: The Decision Tree

  ### Node 1: The Direct Liar Verdict
  **Scenario:** Consider the sentence *L*: "This sentence is false." Assume standard logical syntax and that the sentence successfully refers to itself.
  **Task:** Assign a truth-status to *L*.

  *   **Choice A:** *L* is both true and false. The contradiction is real and must be accommodated.
      *   *Proceed to Leaf 1 (Paraconsistent).*
  *   **Choice B:** *L* fails to express a genuine proposition or assertion. It is pragmatically or semantically defective.
      *   *Proceed to Leaf 2 (Deflationary).*
  *   **Choice C:** *L* has a truth value, but stating that value requires resources not available within the sentence's own language.
      *   *Proceed to Node 2.*
  *   **Choice D:** *L* has no classical truth value (it is neither true nor false).
      *   *Proceed to Node 3.*
  *   **Choice E:** *L* does not have a single static value; its status oscillates depending on the stage of evaluation.
      *   *Proceed to Leaf 3 (Revision-Theoretic).*

  ### Node 2: The Hierarchical Stability Test (Inter-Level Preservation)
  **Scenario:** You have chosen that *L* has a value, but it requires a higher language to state. Consider a Meta-Language ($M$) evaluating the Object-Language ($O$) containing *L*.
  **Task:** Evaluate the following conditional claim: *"We can assign a stable truth-value to L in M without generating a new paradox, provided M is structurally barred from containing its own self-referential apparatus."*

  *   **Choice A:** I accept this claim. The restriction on $M$ is necessary and sufficient to block revenge paradoxes. Hierarchy is the solution.
      *   *Proceed to Leaf 4 (Strict Hierarchical).*
  *   **Choice B:** I reject this claim. Even if $M$ lacks self-reference, the very act of defining truth for $O$ in $M$ allows us to reconstruct a liar-like sentence in $M$ (or a combined system), leading to revenge.
      *   *Proceed to Node 5 (Contextual/Gap Split).*

  ### Node 3: The Strengthened Liar Challenge
  **Scenario:** You have chosen that *L* is neither true nor false (a gap). Now consider the *Strengthened Liar* ($L^*$): "This sentence is not true" (interpreted as "false or gap-valued").
  **Task:** How does $L^*$ behave compared to $L$?

  *   **Choice A:** $L^*$ suffers the same fate as $L$. It is also gap-valued. We can classify both as "ungrounded," but we cannot consistently assert this classification within the same semantic level without complication.
      *   *Proceed to Leaf 5 (Fixed-Point).*
  *   **Choice B:** $L^*$ behaves differently. While $L$ is gap-valued in the original context, $L^*$ forces a shift in context that allows it to be evaluated as true.
      *   *Proceed to Leaf 6 (Contextualist).*

  ### Node 5: Contextual/Gap Split (For those who rejected Hierarchical Stability)
  **Scenario:** You believe gaps exist, but hierarchy fails to contain revenge. Consider the Cross-Language Loop: Sentence *A* (in Language 1) says "*B* is false." Sentence *B* (in Language 2) says "*A* is false." Neither language is strictly "higher" than the other.
  **Task:** How do you evaluate the pair?

  *   **Choice A:** Both sentences remain gap-valued. The lack of a well-founded grounding structure prevents either from securing a value. The gap is a permanent feature of the semantic structure.
      *   *Proceed to Leaf 5 (Fixed-Point).*
  *   **Choice B:** The context of evaluation shifts when moving between the sentences. *A* might be gap-valued relative to one context, but *B* can be true relative to an expanded context that includes *A*'s evaluation.
      *   *Proceed to Leaf 6 (Contextualist).*

  ---

  ## Part II: The Six Leaves (Theoretical Families)

  **Leaf 1: The Paraconsistent View**
  *   **Core Commitment:** True contradictions exist.
  *   **Logic:** Classical logic is rejected in favor of a logic that tolerates contradiction (e.g., LP).
  *   **Verdict:** The Liar is true (and false).
  *   **Revenge:** Handled by accepting that the "revenge" sentence is also a true contradiction.

  **Leaf 2: The Deflationary/Expressivist View**
  *   **Core Commitment:** The Liar is not a semantic problem but a pragmatic or syntactic failure.
  *   **Logic:** Classical logic is preserved because the Liar does not express a proposition to which logic applies.
  *   **Verdict:** The sentence is meaningless or fails to assert.
  *   **Revenge:** Dissolved; one cannot generate a paradox from nonsense.

  **Leaf 3: The Revision-Theoretic View**
  *   **Core Commitment:** Truth is a process, not a static property.
  *   **Logic:** Classical logic is preserved for stable sentences; Liar sentences have unstable truth conditions.
  *   **Verdict:** The Liar has no stable value; it oscillates (False $\to$ True $\to$ False).
  *   **Revenge:** Managed by analyzing the stability of revision sequences rather than seeking a fixed extension.

  **Leaf 4: The Strict Hierarchical View**
  *   **Core Commitment:** Truth predicates are ambiguous across levels.
  *   **Logic:** Classical logic is preserved within each level.
  *   **Verdict:** The Liar is ill-formed or valueless in its own language; true in the meta-language.
  *   **Revenge:** Blocked by the **Inter-Level Preservation** condition (meta-language cannot self-reference).

  **Leaf 5: The Fixed-Point/Partial-Grounding View**
  *   **Core Commitment:** Truth is partial; some sentences are ungrounded.
  *   **Logic:** Classical logic is modified (e.g., Strong Kleene) to handle gaps.
  *   **Verdict:** The Liar and Strengthened Liar are both gap-valued (ungrounded).
  *   **Revenge:** Acknowledged as a limitation; the predicate "ungrounded" cannot be fully expressed within the object language without remainder.

  **Leaf 6: The Contextualist/Gap-Theoretic View**
  *   **Core Commitment:** Truth values are context-sensitive.
  *   **Logic:** Classical logic is preserved, but the context of evaluation shifts during the paradox.
  *   **Verdict:** The Liar is gap-valued in the initial context, but the Strengthened Liar is true in a later, expanded context.
  *   **Revenge:** Resolved by allowing the context to expand to accommodate the new evaluation.

  ---

  ## Part III: Analysis of Logical Space

  ### Unoccupied Combinations
  Certain theoretical combinations are logically empty or historically absent. Below are diagnoses for specific unoccupied regions of the logical space.

  1.  **Strict Hierarchy + True Contradictions (Leaf 4 + Leaf 1)**
      *   **Diagnosis:** **Incoherence.** The motivation for Strict Hierarchy is to *preserve* classical consistency by segregating truth predicates. If one accepts true contradictions (Paraconsistency), the primary motivation for segregating languages vanishes, as the contradiction can be contained within a single language.
  2.  **Deflationary + Revision-Theoretic (Leaf 2 + Leaf 3)**
      *   **Diagnosis:** **Conceptual Instability.** Deflationism claims the Liar fails to express a proposition. Revision Theory claims it expresses a proposition with unstable truth conditions. One cannot hold that a sentence expresses *no* content and *oscillating* content simultaneously.
  3.  **Strict Hierarchy + Contextualism (Leaf 4 + Leaf 6)**
      *   **Diagnosis:** **Mere Historical Neglect / Redundancy.** While not strictly incoherent, these views compete to solve the same problem (Revenge) via different mechanisms (structural bans vs. pragmatic shifts). A hybrid would likely collapse into Contextualism, as the "shift" in context renders the rigid "level" distinction unnecessary.

  ### Overlapping Leaves (Ambiguities)
  The following pairs share commitments that the tree's questions may not cleanly separate without further probing.

  1.  **Fixed-Point (Leaf 5) vs. Contextualist (Leaf 6)**
      *   **Shared Commitment:** Both agree the Liar lacks a classical truth value (Gap) in the initial instance.
      *   **Source of Overlap:** Both views often utilize similar formal machinery (partial models).
      *   **Distinguishing Factor:** The treatment of the *Strengthened Liar*. Fixed-Point views accept the Strengthened Liar is *also* a gap (ineffability). Contextualist views argue the Strengthened Liar becomes *true* due to a context shift. If a respondent is vague on whether the context "shifts" or merely "expands semantically," they may land ambiguously between these leaves.
  2.  **Revision-Theoretic (Leaf 3) vs. Fixed-Point (Leaf 5)**
      *   **Shared Commitment:** Both reject a simple, static classical assignment for the Liar.
      *   **Source of Overlap:** In many formalizations, the "ungrounded" sentences of Fixed-Point theory correspond to the "oscillating" sentences of Revision Theory.
      *   **Distinguishing Factor:** Ontological status of the gap. Fixed-Point treats the gap as a stable third value. Revision treats it as a lack of stability over time/stages. If a respondent views "ungrounded" as "never settling," they blur the line.

  ---

  ## Part IV: Scoring Key and Diagnostic Notes

  Use the path taken through the Nodes to determine the respondent's primary theoretical family.

  | Path | Resulting Leaf | Theoretical Family | Diagnostic Note |
  | :--- | :--- | :--- | :--- |
  | **Node 1 → Choice A** | **Leaf 1** | **Paraconsistent** | Respondent prioritizes semantic closure over consistency. |
  | **Node 1 → Choice B** | **Leaf 2** | **Deflationary** | Respondent dissolves the problem by denying semantic content. |
  | **Node 1 → Choice E** | **Leaf 3** | **Revision-Theoretic** | Respondent views truth as dynamic/processual. |
  | **Node 1 → Choice C → Node 2 → Choice A** | **Leaf 4** | **Strict Hierarchical** | Respondent accepts **Inter-Level Preservation**. Commitment to structural bans on self-reference is absolute. |
  | **Node 1 → Choice C → Node 2 → Choice B** | **Leaf 6** | **Contextualist** | Respondent rejects rigid hierarchy but maintains truth values exist via context shifts. |
  | **Node 1 → Choice D → Node 3 → Choice A** | **Leaf 5** | **Fixed-Point** | Respondent accepts stable gaps. Likely comfortable with ineffability regarding the "ungrounded" predicate. |
  | **Node 1 → Choice D → Node 3 → Choice B** | **Leaf 6** | **Contextualist** | Respondent uses gaps but resolves them via context sensitivity. |
  | **Node 1 → Choice D → Node 5 → Choice A** | **Leaf 5** | **Fixed-Point** | Confirms commitment to permanent gaps even in cross-language loops. |
  | **Node 1 → Choice D → Node 5 → Choice B** | **Leaf 6** | **Contextualist** | Confirms commitment to context-shifting to resolve loops. |

  ### Hybrid and Ambiguous Patterns

  *   **The "Reluctant Hierarchist" (Node 2, Choice A with hesitation):**
      *   *Pattern:* Accepts Inter-Level Preservation but expresses discomfort with the "artificiality" of the ban on meta-language self-reference.
      *   *Diagnosis:* This respondent may be a **Contextualist in disguise**. They accept the hierarchy as a formal model but interpret the "levels" as pragmatic contexts rather than syntactic barriers.
  *   **The "Stable Oscillator" (Node 1, Choice E vs. Node 3, Choice A):**
      *   *Pattern:* Describes the Liar as "oscillating" (Revision) but concludes it is ultimately "ungrounded" (Fixed-Point).
      *   *Diagnosis:* This is a common formal overlap. Check if they believe the oscillation *is* the semantic content (Revision) or if the oscillation indicates a *lack* of content (Fixed-Point).
  *   **The "Revenge Skeptic" (Node 2, Choice B + Node 3, Choice A):**
      *   *Pattern:* Rejects Hierarchy due to revenge, but insists the Strengthened Liar is still a gap.
      *   *Diagnosis:* This is a robust **Fixed-Point** position that acknowledges the expressive limitations of the system without resorting to Contextualism. They accept that "ungrounded" cannot be fully expressed.

  ### Instruction for Workshop Facilitators
  When a respondent lands on **Leaf 5 (Fixed-Point)** or **Leaf 6 (Contextualist)**, administer the **Inter-Level Preservation** test retroactively. Ask: *"If we could ban self-reference in the meta-language, would you accept the hierarchy?"*
  *   If **Yes**: They are structurally Hierarchical but were worried about revenge (Leaf 4).
  *   If **No**: They are fundamentally opposed to levels, favoring Gaps or Context (Leaf 5 or 6).

  This retroactive check clarifies whether their rejection of Hierarchy was principled (against levels) or pragmatic (against revenge).
