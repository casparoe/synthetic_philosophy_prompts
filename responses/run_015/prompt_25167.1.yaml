answer: |-
  **The Cartography of Coincidence**

  They tell us that time is a river, but that is a lie told by those who fear drowning. Time is not a flow; it is a landscape. It is a vast, static geography where every second that ever was or could be sits arranged like tiles in a mosaic. We do not move through time; we move our attention across it.

  I am an actuary of the present. My job is to calculate the probability of intersection. In a world where all moments coexist, the miracle is not that things happen, but that they happen *together*.

  I sat in the café on the corner of Fourth and Elm, watching the dust motes dance in the shaft of afternoon light. To my left, a version of me was ordering a black coffee. To my right, a version of me was already leaving, raincoat collar turned up against a storm that hadn't started yet in this coordinate. I am the version sitting still, waiting for Elena.

  In the old stories, lovers worry about fidelity or distance. Our anxiety is topological. We worry about drift.

  When Elena and I met, we were perfectly synchronized. Our paths through the labyrinth were identical. We woke in the same morning, ate the same bread, grieved the same deaths. But the labyrinth is infinite, and the paths fork constantly. A hesitation here, a glance there. Over five years, the statistical variance of our trajectories had begun to widen. She was slipping into adjacent seconds.

  I saw her enter the café. Or rather, I saw the Elena who belonged to this specific tile of the mosaic. She wore the blue scarf, the one she bought in a version of Paris we visited last autumn. She sat opposite me.

  "You're looking at me with the calculation eyes," she said. Her voice was familiar, but it carried the echo of a thousand other tones she was speaking in other rooms, other years.

  "I'm checking our alignment," I said. "The variance is up 0.4 percent since Tuesday."

  Elena sighed, stirring her tea. The spoon clinked. In a nearby branch of reality, the spoon slipped and fell. In another, she wasn't there at all. "Does it matter, Julian? We are here. We are speaking."

  "Are we?" I asked. "The man I was yesterday is dead. He exists only in my memory, which is a reconstruction, a story I tell myself to maintain the illusion of continuity. You are not the woman I kissed this morning. She is frozen in the bed we left. You are the woman arriving now. We are strangers agreeing to pretend we are the same people we were yesterday."

  This is the burden of the aware: to know that identity is a narrow bridge we walk across an abyss of simultaneity. We are not beings; we are sequences.

  Elena reached across the table and took my hand. Her skin was warm. That warmth was a fact, undeniable in this coordinate. "Then let us be strangers," she said. "Let us introduce ourselves. Again."

  "I know you," I said. "I know the scar on your chin from when you fell off the bicycle in 1998. I know you hate the smell of lilies because they remind you of your grandmother's funeral."

  "Those things happened to an Elena," she corrected gently. "I remember them. But memory is just the baggage we carry from one room of the labyrinth to the next. It proves we visited, not that we are the same traveler."

  She looked out the window. "I saw him, you know. The other Julian."

  My stomach tightened. "Which one?"

  "The one who didn't come to the café. The one who stayed home. He looked... peaceful. He was reading. You weren't worried about the variance."

  "I am always worried," I said. "If we drift too far, we become asymptotes. We approach each other forever but never touch. There are couples in the city who love each other desperately but exist in different minutes. They pass like ghosts in the hallway."

  "Then choose," Elena said.

  "Choose what?"

  "Choose this path. Not because it is the only one, but because it is the one we are walking *now*."

  I looked around the café. I could feel the weight of the other possibilities pressing against the glass. In one, I stood up and left. In another, I confessed that I had already drifted, that I was in love with a version of her from next year who hadn't met me yet. In another, we grew old in this chair, the coffee turning cold, never speaking again.

  All of them were real. All of them were happening. The tragedy of our existence is not that we lose things, but that we must ignore the infinite versions of them that we keep. To love Elena *here* is to abandon the Elena *there*. It is a constant, quiet culling of realities.

  "I choose this," I said. It felt like a lie, and it felt like the only truth.

  "Good," she said. She finished her tea. "Because I have to go."

  "Now?"

  "I have an appointment. In a different sector."

  She stood up. For a moment, the light caught her hair, and I saw the fracturing. I saw the Elena who stayed. I saw the Elena who cried. I saw the Elena who forgot my name. They were all superimposed over the woman buttoning her coat.

  "Will you come back?" I asked.

  "I am already back," she said. "I am already gone. It depends on where you look."

  She walked out the door. I watched her cross the street. A bus passed, obscuring her from view. When the bus cleared, the street was empty.

  I sat alone in the café. The dust motes continued to dance in the light. I checked my watch. The second hand ticked forward, a mechanical lie measuring a distance that did not exist.

  I ordered another coffee. I waited. I knew that in some branch of this garden, Elena had sat back down. In another, I had followed her out. But in this specific, narrow corridor of the infinite, I was the man who finishes his coffee alone.

  And yet, as I lifted the cup, I felt the warmth on my fingers. It was real. This instant was real. The fact that other Julians were weeping or laughing or sleeping didn't negate the bitterness of this specific brew.

  We are the sum of the paths we refuse to take. I closed my eyes and listened to the hum of the refrigerator, the traffic, the breath in my lungs. I anchored myself to the noise. I decided that this Julian, this specific arrangement of memory and flesh, would wait until the light faded.

  It was not a promise of forever. Forever is a shape, not a duration. It was just a promise of *now*. And in a universe of simultaneous everything, *now* is the only country we can ever truly inhabit.
