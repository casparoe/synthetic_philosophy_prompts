answer: |-
  ### Essay Question

  **Topic:** Aquinas on Tyranny and Private Authority

  **Prompt:**
  Consider the following hypothetical scenario grounded in Thomistic political theory: A ruler clearly governs for his own private good rather than the common good, constituting a tyranny. He was installed by a distant higher authority (such as an Emperor or Pope) that now ignores all appeals to remove him. The only realistic way to remove him without triggering a full civil war is a targeted killing by one private person. Assume everyone agrees the resulting disorder from this killing would be much smaller than letting the tyranny continue.

  In your essay, determine whether Aquinas's own principles actually commit him to allowing this killing *in extremis*, or whether they show his ban on private tyrannicide is absolute. In your analysis, you must engage with the following framework derived from his work:
  1.  **Tyranny:** Defined as rule directed toward the private good of the ruler rather than the common good.
  2.  **The Disorder Proviso:** Resistance is permissible only if the disorder it causes is not worse than the tyranny itself.
  3.  **Public Authority:** Killing a ruler is lawful only by public authority or the community, not by private whim.

  Do not use outside citations or extra reading. Rely solely on your understanding of the principles provided above and their logical implications.

  ***

  ### Model Answer

  Aquinas's political theory rests on the fundamental axiom that legitimate government exists solely for the common good. When a ruler governs for private advantage rather than public welfare, he becomes a tyrant, effectively forfeiting the moral claim to obedience. In *De Regno*, Aquinas acknowledges that a community may depose such a ruler, provided the removal does not provoke greater harm than the tyranny itself. However, the crucial tension in this hypothetical case lies not in the end—removing harm—but in the means: who possesses the authority to act?

  Aquinas strictly distinguishes between public authority and private whim. For Aquinas, judgment regarding the common good belongs to the community as a corporate body or a superior public power, not to isolated individuals. Private killing lacks jurisdiction. Even if a private individual correctly identifies the tyranny, acting alone usurps the public function of judgment and execution. This is not merely a procedural hurdle; it protects the political order from fragmentation. If private citizens decide when rulers die, the rule of law dissolves into vendetta and subjective interpretation. In the *Summa Theologiae*, Aquinas argues that killing is lawful only when exercised by public authority for the common good; private individuals lack this commission.

  In this hypothetical, the higher authority is absent, and community action risks civil war. The student must weigh whether the "disorder" proviso allows an exception. A superficial reading suggests yes: if private killing causes less disorder than tyranny, it satisfies the harm principle. However, a deeper analysis of Aquinas suggests the ban is absolute. The "disorder" Aquinas fears is not merely immediate bloodshed but the long-term corrosion of authority. Allowing private tyrannicide establishes a precedent where any individual may claim to act for the common good, inevitably leading to greater instability than the current tyrant. The risk is that every disgruntled subject becomes a judge.

  Therefore, Aquinas's principles likely commit him to forbidding the act. The requirement for public authority is not a contingent rule but a constitutive element of justice. Without public sanction, the killing is murder, regardless of the tyrant's guilt. The distant authority's negligence does not transfer jurisdiction to the private individual. To allow it would be to prioritize immediate utility over the structural integrity of lawful rule. Aquinas would argue that enduring the tyranny is preferable to legitimizing private violence, which destroys the very possibility of a common good grounded in law. The private individual cannot embody the public good they seek to save. Thus, the ban remains absolute because the means (private killing) contradict the end (a lawful common good). The tyranny is a disease, but private killing is the cure that kills the patient by destroying the body politic's authority structure.

  ***

  ### Marking Scheme (Total: 20 Marks)

  | Point | Criteria | Marks | Common Student Error |
  | :--- | :--- | :--- | :--- |
  | **1. Definition of Tyranny** | Correctly identifies tyranny as rule for private good vs. common good, establishing the moral basis for resistance. | 4 | Fails to distinguish tyranny from mere incompetence or harsh rule. |
  | **2. Public vs. Private Authority** | Explains that jurisdiction to judge/kill belongs to the community/public power, not individuals. | 4 | Treats the public/private distinction as merely practical rather than juridical. |
  | **3. The Disorder Proviso** | Interprets "disorder" to include long-term legal precedent, not just immediate bloodshed. | 4 | Limits "disorder" only to immediate violence/civil war risks. |
  | **4. Application to Case** | Addresses the "distant authority" constraint (absence does not transfer power to individuals). | 4 | Assumes the higher authority's absence creates a vacuum individuals can fill. |
  | **5. Final Verdict** | Concludes clearly on whether the ban is absolute or exception-based, consistent with the reasoning above. | 4 | Sits on the fence without committing to a interpretation of Aquinas's principles. |
