  9.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure not to validate the Covering-Law model. The user and friend reject it. The audit is about the *Novel* analogy, not defending Hempel.
      *   *Nuance:* Acknowledge that historians *do* use narrative. The question is whether narrative *constitutes* explanation or *packages* it.
