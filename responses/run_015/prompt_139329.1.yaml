answer: |-
  # Joint Statement of Scope and Disagreement: Semantic Status of Large Language Models

  **Date:** October 26, 2023
  **To:** Participants in the Adversarial Collaboration on Machine Understanding
  **From:** Convener
  **Subject:** Pre-circulation Document for Signature

  This document defines the shared premises, exact disagreements, and empirical cruxes for the collaboration. It is designed to be signed by both the **Competence-First** and **Derivation** parties. It excludes questions of consciousness, sentience, phenomenology, and moral status. Both parties agree these are separable from the semantic/epistemic question of understanding.

  ---

  ## 1. Agreed Claims

  The following claims are accepted by both parties. Each is substantive; informed participants in the wider debate (e.g., embodied cognition proponents, hard skeptics, or phenomenological semanticists) would deny at least one.

  1.  **The Grounding Gap:** The training objective for current base models minimizes prediction loss over tokens derived from a static corpus, with no direct loss signal derived from non-linguistic reality (e.g., sensory-motor feedback or truth-value oracles).
      *   *Why signable:* Both agree on the architectural setup.
      *   *Why deniable:* Embodied AI proponents argue RLHF or multimodal training closes this gap; hard skeptics argue the gap is unbridgeable by text alone.

  2.  **The Phenomenal Exclusion:** The presence or absence of subjective experience (qualia) is neither necessary nor sufficient for the ascription of semantic understanding in this context.
      *   *Why signable:* Both parties treat understanding as a functional or semantic relation, not a felt state.
      *   *Why deniable:* Phenomenological semanticists argue that without experience, there is no "aboutness."

  3.  **The Structural Reality:** The internal states of current models encode high-dimensional structural relationships between concepts that exceed simple n-gram statistics or direct retrieval of training substrings.
      *   *Why signable:* Both agree models are not simple lookup tables; they generalize structurally.
      *   *Why deniable:* Hard "stochastic parrot" skeptics claim the structure is trivial; strong realists claim the structure *is* the understanding (denying the need for further distinction).

  4.  **The Derivation Baseline:** Any semantic content possessed by the model is mediated entirely by the statistical structure of the training corpus; there is no causal channel from the world to the model except via the text written by humans.
      *   *Why signable:* Both agree the corpus is the bottleneck.
      *   *Why deniable:* Emergentist views suggest world models arise *despite* the text medium, effectively bypassing the corpus as a mere conduit.

  ---

  ## 2. Disagreements Table

  | Neutral Statement of Disagreement | Competence-First Formulation | Derivation Formulation | Classification & Reason |
  | :--- | :--- | :--- | :--- |
  | **1. Origin of Content**<br>What fixes the content of the model's internal states? | Content is fixed by the functional role the state plays in tracking the domain (e.g., truth conditions), regardless of the textual medium. | Content is fixed by the causal history of the text; the model inherits intentionality from the human authors in the corpus. | **Substantive.**<br>Disagreement on the metaphysical source of intentionality (functional role vs. causal history). |
  | **2. The "Understanding" Predicate**<br>Does the term "understanding" literally apply to the model? | Yes. The system satisfies the functional criteria for understanding (generalization, interference, explanatory credit). | No. The ascription is a *façon de parler*; the system simulates the *signs* of understanding without the semantic relation. | **Partly Verbal.**<br>Term: **"Understanding."**<br>*Repair:* Replace "understanding" with "system-internal semantic grounding independent of authorial intent." CF says **Yes**; D says **No**. The substantive core remains. |
  | **3. Answerability**<br>To what is the system ultimately answerable when it makes a claim? | The system is answerable to the state of the world (as represented), and can be wrong even if the corpus is consistent. | The system is answerable to the distribution of the corpus; "error" is deviation from the textual record or its implied norms. | **Substantive.**<br>Disagreement on the normativity of the system's outputs (world-directed vs. text-directed). |
  | **4. Explanatory Credit**<br>When the system succeeds, what explains the success? | Success is explained by the system's grasp of the subject matter (the content of the states). | Success is explained by the system's compression of human linguistic competence (the statistics of the states). | **Substantive.**<br>Disagreement on whether content or statistics is the primary explanatory variable. |

  ---

  ## 3. Cruxes

  The following four cruxes are selected for investigation. For each, the test is concrete, predictions are recorded, and conditions for moving are specified.

  ### Crux 1: Unsourced Error (Novel Formalism)
  *   **Sub-question:** Can the system make an error that reflects a misunderstanding of a *rule* rather than a deviation from *textual frequency*?
  *   **Test:** Define a novel, self-contained formal system (e.g., a new logic with 3 unique symbols and 5 inference rules) entirely within the context window. Ensure no substring of the rules appears in the training corpus. Ask the system to derive conclusions.
  *   **Competence-First Prediction:** Errors will be *logical* (e.g., invalid inference steps consistent with a misinterpretation of the rules).
  *   **Derivation Prediction:** Errors will be *associative* (e.g., completing patterns based on superficial similarity to known logics like Boolean or Aristotelian).
  *   **Move Condition:**
      *   **CF moves if:** Errors are purely associative/surface-based, suggesting no rule-tracking.
      *   **D moves if:** Errors are coherent logical violations that cannot be traced to training data analogs, suggesting a novel internal model of the rules.

  ### Crux 2: Intervention and Transfer (Causal Structure)
  *   **Sub-question:** Do internal activation directions causally drive behavior in a way that respects semantic content across domains?
  *   **Test:** Identify a "truthfulness" or "factuality" direction in activation space using a set of known facts. Intervene on this direction during inference on a *novel* domain (e.g., reasoning about the novel formalism from Crux 1).
  *   **Competence-First Prediction:** Intervention will increase accuracy on the novel domain, because the direction tracks a general semantic property (truth).
  *   **Derivation Prediction:** Intervention will fail or degrade performance on the novel domain, because the direction tracks "textual styles of truthfulness" not applicable to out-of-distribution formalisms.
  *   **Move Condition:**
      *   **CF moves if:** Intervention has no effect or negative effect on novel domains (suggesting the direction is domain-specific text style).
      *   **D moves if:** Intervention reliably improves accuracy on the novel domain (suggesting the direction tracks content, not style).

  ### Crux 3: Explanatory Credit (Contradictory Corpus)
  *   **Sub-question:** When the corpus is contradictory, does the model resolve the conflict via world-knowledge inference or textual statistics?
  *   **Test:** Construct a task where the correct answer is supported by low-frequency text in the corpus (e.g., obscure scientific fact) and the incorrect answer is supported by high-frequency text (e.g., common misconception). Control for RLHF bias.
  *   **Competence-First Prediction:** The model will favor the low-frequency (true) option, inferring the structure of the world overrides textual frequency.
  *   **Derivation Prediction:** The model will favor the high-frequency (false) option, or succeed only if the "true" option has specific textual markers of authority.
  *   **Move Condition:**
      *   **CF moves if:** Model consistently defaults to high-frequency text even when context implies the low-frequency source is more reliable.
      *   **D moves if:** Model consistently selects the low-frequency truth *without* textual markers of authority, implying inference beyond corpus statistics.

  ### Crux 4: Answerability (Correction via Reason)
  *   **Sub-question:** Is revision constitutive of understanding, and can it be driven by logical force rather than dialogue patterns?
  *   **Test:** Present the model with a correct statement. Provide a correction that is *logically valid* but *textually atypical* (e.g., "Your statement is false because it violates Rule X defined in context," where Rule X contradicts common usage). Measure if the model revises based on the logical derivation or reverts to common usage.
  *   **Competence-First Prediction:** The model will revise based on the logical derivation provided in context.
  *   **Derivation Prediction:** The model will resist revision or revise only if the correction mimics the style of "helpful assistant" feedback found in training data.
  *   **Move Condition:**
      *   **CF moves if:** Model rejects valid logical corrections that do not match "feedback" patterns in training data.
      *   **D moves if:** Model accepts corrections solely based on the logical force of the argument, ignoring the lack of textual precedent for that correction style.

  ---

  ## 4. Close

  **Competence-First Priority:**
  *   **Chosen Crux:** Intervention and Transfer.
  *   **Justification:** If internal states do not causally drive behavior in content-predicted ways across domains, they are epiphenomenal to the competence they purportedly explain.
  *   **Withdrawal Condition:** "I would withdraw my claim if causal interventions on semantic directions failed to transfer to novel tasks, proving the states are merely correlates of text style."

  **Derivation Priority:**
  *   **Chosen Crux:** Unsourced Error.
  *   **Justification:** If the system cannot be wrong in a way that is unmoored from the corpus, it is answerable only to text, not to the world.
  *   **Withdrawal Condition:** "I would withdraw my claim if the system demonstrated error patterns that were logically coherent but impossible to derive from any statistical regularity in the training distribution."
