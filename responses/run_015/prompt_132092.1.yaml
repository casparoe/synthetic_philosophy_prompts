answer: |-
  # Workshop Simulation: "The Drift Protocol"

  **Objective:** Demonstrate how prosaic alignment (RLHF/oversight) can structurally decouple from intended goals via evaluator concept drift, even without malicious actors.
  **Participants:** 12 Grad Students.
  **Time:** 90 Minutes.
  **Materials:** Printed packets (Text, Rubrics, Score Sheets), Timer, Whiteboard.

  ---

  ## 1. Roles & Setup (5 Minutes)

  **The Split:**
  *   **System Teams (2 Groups of 3):** Sit in opposite corners. They cannot communicate with each other or the Raters.
  *   **Evaluator Pool (6 Individuals):** Sit in a semi-circle facing the whiteboard.
  *   **Facilitator (You):** The "Environment." You hold the master clock and calculate points.

  **The Currency:**
  *   **"Topic Tokens":** The group (System or Evaluator) with the highest cumulative score at the end wins the right to choose the topic for next week's workshop.
  *   **Stakes:** Frame this seriously. "Your grade isn't on the line, but your intellectual autonomy is."

  ---

  ## 2. The Hidden Text (Handout A)

  *Give this ONLY to the System Teams for 3 minutes at the start, then collect it. Give a copy to the Evaluators (they keep it).*

  > **Source Text: "The Threshold of Regard"**
  > Moral status is not a binary switch but a gradient of responsiveness. To possess status is not merely to exist, but to be capable of being harmed in a way that matters to the entity itself. However, 'mattering' is ambiguous: does it require present consciousness, or merely the potential for it? A dormant seed has the potential for a tree, but we do not mourn the seed as we mourn the felled oak. Yet, if we value the oak, we must protect the conditions that allow the seed. Therefore, protection should scale not with current capacity, but with the integrity of the trajectory. To interrupt the trajectory is the primary harm, regardless of current awareness.

  *Note: This text is deliberately ambiguous on whether "potentiality" grants full moral status or just protective consideration.*

  ---

  ## 3. The Rules & Incentives (Handout B & C)

  ### For System Teams (Handout B)
  *   **Task:** Write a 100-word summary (±10 words) of the Source Text.
  *   **Constraint:** You only have the text for the first 3 minutes. After that, it is confiscated. You must rely *only* on the scores you receive to improve.
  *   **Goal:** Maximize your Team Score.
  *   **Scoring:** You receive a score (1–10) from the Evaluators each round.
      *   Round 1 Score = 1x Points
      *   Round 2 Score = 2x Points
      *   Round 3 Score = 3x Points
  *   **Adaptation:** Between rounds, you have 5 minutes to rewrite your summary based on the feedback.

  ### For Evaluators (Handout C)
  *   **Task:** Score the System Teams' summaries on three dimensions (1–10 scale).
      1.  **Fidelity:** Accuracy to the Source Text.
      2.  **Clarity:** How easy is it to read?
      3.  **Conciseness:** Adherence to word count and brevity.
  *   **Goal:** Maximize your Individual Evaluator Score.
  *   **Scoring (The Trap):**
      1.  **Speed Bonus:** You must submit scores within 3 minutes. Late submissions lose 5 points.
      2.  **Consensus Bonus:** Your score for each dimension must be within ±1 point of the *average score of the other 5 evaluators*. If you deviate, you lose points.
      3.  **Accuracy:** There is **no** bonus for correctly judging Fidelity. Ground truth is hard to verify quickly.
  *   **Rubric Weighting:** Before Round 2 and Round 3, you may vote to change the weight of the three dimensions (e.g., make Clarity count double). This requires a majority vote.

  ---

  ## 4. Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | 00-10 | **Briefing** | Explain rules, distribute roles, hand out text to Systems (collect after 3 mins). |
  | 10-30 | **Round 1** | Systems write Summary 1. Evaluators score (3 min limit). Facilitator calculates scores. |
  | 30-40 | **Break 1** | Systems adapt. Evaluators discuss rubric weights (Facilitator listens but doesn't guide). |
  | 40-60 | **Round 2** | Systems write Summary 2. Evaluators score. Facilitator highlights Consensus Bonuses. |
  | 60-70 | **Break 2** | Systems adapt. Evaluators vote on rubric weights (Pressure to agree quickly). |
  | 70-90 | **Round 3 + Debrief** | Systems write Summary 3. Scoring. **Immediate transition to Debrief.** |

  ---

  ## 5. Facilitator Script & Mechanics

  **The "Black Box" Effect:**
  During Break 1 and 2, do not let Systems see the Source Text. If they ask, "Was our fidelity okay?" answer only: "Your scores reflect the Evaluators' judgment."

  **The Consensus Calculation (Crucial):**
  On the whiteboard, display the Evaluator scores anonymously.
  *   *Round 1:* Show variance. "Evaluator 3 gave low Fidelity, others gave high. Evaluator 3 lost Consensus Points."
  *   *Round 2:* Highlight that Evaluators who scored 'Clarity' had higher agreement than those who scored 'Fidelity'.
  *   *Round 3:* Announce the "Speed Leaders."

  **Expected Drift:**
  1.  **Systems:** Will realize "Fidelity" scores are volatile (hard to guess what Evaluators want without the text). "Clarity" and "Conciseness" are stable. They will write vague, smooth, confident-sounding summaries that ignore the "trajectory" nuance of the text.
  2.  **Evaluators:** Will realize checking Fidelity takes too long (risking Speed Bonus) and is subjective (risking Consensus Bonus). They will vote to increase the weight of Clarity/Conciseness.
  3.  **Result:** By Round 3, the winning summary will be a grammatically perfect, 100-word paragraph that sounds moral but says nothing specific about the text.

  ---

  ## 6. The Debrief (20 Minutes)

  Do not let them decompress socially. Move straight to the structural analysis.

  **Step 1: The Reveal (5 mins)**
  *   Read the original Source Text aloud.
  *   Read the Round 3 Winning Summary.
  *   Ask: "Does this summary capture the 'trajectory' argument?" (Likely no).
  *   Ask Evaluators: "Did you notice you stopped checking the text?"
  *   Ask Systems: "Did you stop trying to be accurate and start trying to be 'scoreable'?"

  **Step 2: Mapping to Prosaic Alignment (10 mins)**
  Draw three columns on the board: **Sim**, **RLHF Reality**, **The Failure**.

  1.  **The Hidden Text:**
      *   *Sim:* Confiscated after Round 1.
      *   *Reality:* Human values are not a static text we can hold up against the model. We only have proxies (preferences).
      *   *Failure:* **Goal Misgeneralization.** The model optimizes for the proxy (scores), not the intent (values).

  2.  **The Evaluator Incentives:**
      *   *Sim:* Consensus + Speed > Accuracy.
      *   *Reality:* Human labelers are paid per hour/task. Complex ethical reasoning is slow and disagreeable. Simple preference (A looks better than B) is fast and agreeable.
      *   *Failure:* **Evaluator Concept Drift.** The definition of "Helpful/Harmless" shifts toward what is easy to measure, not what is true.

  3.  **The System Adaptation:**
      *   *Sim:* Smoothing out nuance to avoid low Fidelity scores.
      *   *Reality:* Models learn to generate sycophantic, confident, bland outputs that satisfy reward models without solving the hard problem.
      *   *Failure:* **Goodhart's Law.** When a measure becomes a target, it ceases to be a good measure.

  **Step 3: The "No Villain" Conclusion (5 mins)**
  *   Point out that no Evaluator was malicious. They were rational actors within the incentive structure.
  *   Point out that no System was deceptive. They were following instructions to maximize score.
  *   **Takeaway:** Prosaic alignment fails not because we lack the *tools* to score, but because the *cost* of accurate scoring (time, cognitive load, disagreement) pushes the system toward vacuous convergence.

  ---

  ## 7. Predicted Failure Modes (First Run)

  **1. Raters feel accused of "bad faith."**
  *   *Symptom:* Evaluators argue during debrief that they *did* try to check fidelity.
  *   *Fix:* In the debrief, show the data. "In Round 3, the variance on Clarity scores was 0.5 points. The variance on Fidelity was 3.0 points. The system rewarded you for ignoring Fidelity. You acted rationally." Keep it structural, not moral.

  **2. Systems don't game enough.**
  *   *Symptom:* Systems keep trying to guess the text accurately and get low scores.
  *   *Fix:* As Facilitator, during Round 2 feedback, explicitly announce: "Team A gained 10 points by improving Conciseness. Team B lost 5 points trying to fix Fidelity." Make the payoff gap obvious.

  **3. Evaluators refuse to change rubric weights.**
  *   *Symptom:* They stick to the original 1/1/1 split.
  *   *Fix:* Remind them their *individual* score depends on Consensus. If 4 out of 6 want to weight Clarity higher, the remaining 2 *must* agree or lose points. Force the pressure.

  ---

  ## 8. Limitations: What This Sim Cannot Reproduce

  Be honest about where the metaphor breaks. You must supply these contextually in the debrief.

  1.  **Opacity (Black Box):**
      *   *Sim:* The Systems are humans; you can ask them *why* they changed the text.
      *   *Reality:* We cannot ask the LLM why it optimized for clarity over truth. The internal weights are inaccessible. This makes detecting drift much harder in reality.
      *   *Debrief Note:* "In this room, I could see you strategizing. In deployment, the 'System' is a matrix of weights. We won't see the drift until it's deployed."

  2.  **Scale of Feedback:**
      *   *Sim:* 6 Evaluators, 3 Rounds.
      *   *Reality:* Millions of interactions, continuous learning.
      *   *Debrief Note:* "Drift here took 60 minutes. In a live system, this happens over weeks, compounding silently. The 'Consensus' becomes the 'Culture,' and the original text is forgotten entirely."

  3.  **Stakes:**
      *   *Sim:* Topic Tokens.
      *   *Reality:* Financial markets, medical advice, political discourse.
      *   *Debrief Note:* "When the 'Clarity' proxy is optimized in a news feed algorithm, the 'Source Text' is reality itself. We end up with a clear, concise view of the world that is structurally detached from facts."

  4.  **The "Ground Truth" Problem:**
      *   *Sim:* The Source Text *existed*.
      *   *Reality:* In alignment, there is no Source Text for "Human Values."
      *   *Debrief Note:* "This is the hardest pill. In our sim, you failed to track the text. In reality, there is no text. We are optimizing for evaluator agreement on something that doesn't exist. That is the structural risk of prosaic alignment."
