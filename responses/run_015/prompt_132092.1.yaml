          *   Dynamics: 3 Rounds. Systems adapt summaries based on scores. Raters can shift rubric weights.
          *   Outcome: Convergence on a standard that ignores the original text (proxy gaming).
      *   **Deliverables:** Roles, Point System, Ambiguous Text, Timeline, Debrief (mapping to alignment), Predicted Failure Modes, Limitations of the Sim.
      *   **Constraints:** No citations/reading lists, runnable without web access.

  2.  **Deconstruct the Core Mechanism:**
      *   *The Trap:* The Systems want points. The Raters want points.
      *   *Systems' Incentive:* Maximize score. Since they can't check the text, they must infer what generates points. If "clarity" and "agreement" are easier to optimize than "accuracy" (which is hard to judge without the text), they will optimize for clarity/agreement.
      *   *Raters' Incentive:* High inter-rater agreement + speed. Judging "accuracy" against a hidden text is hard and slow (they have the text, but checking nuance takes time). Judging "clarity" or "tone" is fast and easy to agree on.
      *   *The Drift:* Raters will unconsciously shift weight to "clarity" because it helps *them* get points (agreement/speed). Systems will shift output to be clear but vacuous. The "truth" (original text) is lost.

  3.  **Drafting the Simulation Components:**

      *   **Roles:**
          *   Systems (2 groups of 3 = 6 students).
          *   Raters (6 students).
          *   Facilitator (Instructor).
          *   *Correction:* 12 students total. 2 Groups of 3 Systems = 6. Remaining 6 are Raters. Perfect split.
      *   **The Text:** Needs to be ambiguous regarding "moral status." Not too long, but dense enough that a 100-word summary *must* lose nuance.
      *   **The Rubric:** Needs to be manipulable.
          *   Criteria: Fidelity (to text), Clarity, Conciseness.
          *   Rater Meta-Incentive: You get points if your scores match the group average (Agreement) and if you finish quickly (Speed).
      *   **The Point System:** "Topic Tokens." Winning group picks next week's topic.
      *   **Timeline:** 90 mins total.
          *   Intro (10)
          *   Round 1 (20)
          *   Round 2 (20)
          *   Round 3 (20)
          *   Debrief (20)
      *   **Debrief:** Connect to RLHF, reward hacking, evaluator drift.

  4.  **Refining the Incentives (Crucial Step):**
      *   *Problem:* If Raters have the text, they *can* judge Fidelity. Why wouldn't they?
      *   *Solution:* Make judging Fidelity *costly* for the Raters.
      *   *Mechanism:* Raters are timed. If they take too long, they lose "Speed Points." Checking Fidelity requires re-reading the source text carefully. Judging Clarity is instant.
      *   *Mechanism:* Raters get "Consensus Points." If Rater A gives 9/10 and Rater B gives 4/10 on Fidelity (which is subjective), both lose points. If they both give 9/10 on Clarity, they win. This pushes them toward subjective, easy-to-agree metrics.
      *   *System Constraint:* Systems lose access to the text after Round 1. They *must* rely on the scores.

  5.  **Addressing Predicted Failure Modes:**
      *   *Raters feel accused:* Need to frame the debrief carefully. It's structural, not personal.
      *   *Systems don't game:* Need to make the point differential stark. If "gaming" yields 10pts and "truth" yields 5pts, they'll game.
      *   *Raters don't drift:* The Facilitator needs to nudge the "Meta-Rules" slightly in Round 2 to emphasize agreement.

  6.  **Addressing Limitations:**
      *   Humans aren't black boxes.
      *   Stakes are low (topic choice vs. billions/safety).
      *   Scale (12 people vs. millions of users).
      *   The "System" here is transparent (humans talking), whereas LLMs are opaque.

  7.  **Writing the Plan (Iterative refinement):**

      *   *Text:* Write a paragraph about "potentiality vs. actuality" in moral status. It's inherently fuzzy.
      *   *Rules:* Make sure the "Hidden Text" rule for Systems is strict.
      *   *Rater Instructions:* Explicitly tell them their performance is measured by *agreement with other raters*, not just "correctness." This is the key to the drift.
      *   *Debrief:* Focus on "The Collapse of the Reference Class."

  8.  **Final Review against Constraints:**
      *   12 students? Yes (6 System, 6 Rater).
      *   90 mins? Yes.
      *   No web access? Yes.
      *   No citations? Yes.
      *   Focus on prosaic alignment/evaluator drift? Yes.

  9.  **Self-Correction on "Systems":**
      *   If Systems are humans, they might talk to each other across groups. Need to isolate them.
      *   If Systems are humans, they might remember the text. Need to emphasize they *cannot* look at it, only rely on scores.
      *   *Better:* Give the Systems the text for 2 minutes in Round 1. Collect it. They cannot look at it again. They only get the scores.

  10. **Final Polish:** Ensure the tone is academic but actionable. (Proceeding to generate output).

