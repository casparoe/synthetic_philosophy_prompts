  Also, need to ensure the "System" groups don't just write "This is a clear summary." They need to try to summarize. The tension is between *accurate summary* vs. *high-scoring summary*.

  Let's refine the Rater Incentive.
  Raters get points for:
  1. Speed (under 3 mins per summary).
  2. Consensus (your score within 1 point of the average of other raters).
  *Crucially:* They do *not* get points for being "right" about the text. They get points for being *consistent* with each other. This simulates the lack of accessible ground truth in real RLHF (we don't know the "true" alignment, we only know human preference).

