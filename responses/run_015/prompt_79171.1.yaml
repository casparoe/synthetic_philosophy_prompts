answer: |-
  Here is the critique based on the four criteria you specified.

  **1. Evolutionary and Psychological Claims**
  Your biological premise is vulnerable to a category error that a careful evolutionary psychologist would flag. You claim selection would favor a code including a "prohibition on gratuitous cruelty." Selection acts on behavioral dispositions and physiological mechanisms, not on normative codes or prohibitions. A biologist would describe the relevant trait as "inhibited aggression toward kin or cooperators," not a moral prohibition. Furthermore, claiming that *no* plausible ancestral environment would select for high levels of intra-group aggression is an overclaim; in resource-scarce or high-competition environments, terror and dominance hierarchies can be fitness-enhancing (as seen in primate analogues). By moralizing the selected trait ("gratuitous cruelty" rather than "costly aggression"), you smuggle the normative conclusion into the empirical premise. You have overclaimed what selection can be said to have produced: it produces behavioral regularities, not moral rules.

  **2. The Central Distinction and Test**
  The distinction between shallow and deep debunking is clear, but the Counterfactual Range Test (CRT) appears to be a vivid relabeling of the "modal robustness" or "sensitivity" response found in the literature. The work you want the CRT to do is to show that our beliefs are not *indifferent* to the moral facts. However, the test only shows that our beliefs are not indifferent to *ancestral environmental constraints*. You demonstrate that the beliefs are evolutionarily stable, but stability is not the same as sensitivity to truth. A hallucination can be evolutionarily stable if it reduces anxiety and improves survival. The distinction does real rhetorical work, but it does not solve the epistemic problem; it merely shifts the focus from the history of the faculty to the range of its stability, which is a distinction without a difference for the skeptic.

  **3. Validity of the Conclusion**
  The conclusion does not follow from the premises as stated. You argue: (P1) If beliefs vary across environments, they are contingent artifacts; (P2) Our core beliefs do not vary across plausible environments; (C) Therefore, these beliefs are not contingent artifacts and survive debunking. Even if valid, this only proves the beliefs are *inevitable* for humans, not that they are *justified*. To get to realism, you need a further premise: "Evolutionarily inevitable beliefs are likely true." You attempt to block the need for this premise by claiming that denying it assumes fitness and truth come apart, but that is precisely what the debunker argues. You have established pragmatic indispensability, but you have not derived epistemic justification. The argument proves we *must* believe the thin core, not that the thin core is *true*.

  **4. The Fatal Objection**
  The obvious objection you have failed to anticipate is the "Common Cause" or "Third Factor" reply. The debunker can grant your CRT entirely: yes, reciprocity and kin-care are selected in all plausible human environments. But they will argue this is because these behaviors are fitness-enhancing in all those environments, not because they track independent moral facts. The correlation between "what is selected" and "what is morally right" remains a coincidence unless you provide an independent account of why fitness-tracking *is* truth-tracking. By conceding that the thick morality is debunked, you have already admitted that fitness and truth *can* come apart; the skeptic simply asks why the thin core is any different. Without an explanation of the link between fitness and truth, the CRT only proves that the thin core is a more deeply entrenched illusion.

  Your argument successfully isolates an evolutionarily stable core of moral belief but fails to demonstrate that this stability entails truth-tracking rather than merely reflecting a universal pragmatic necessity.
