  8.  **Final Polish:** Check against the user's constraint: "keep clear what's settled... and what's genuinely contested." Ensure I don't smooth over disagreements. (e.g., The "number opera" vs. "through-composed" debate affects point 2).

  **(Self-Correction on Williams):** I need to be precise. Williams' essay is in *Problems of the Self*. He argues immortality would be boring. He uses the opera to show that. He doesn't explicitly theorize opera's *duration* as the locus of truth. The user is inferring this. I must flag this inference.

  **(Self-Correction on Point 2):** Soliloquy is the closest analog. But in soliloquy, the *text* expands. In aria, the *sound* expands. The semantic content might be one sentence, but the musical content is 4 minutes. That's the distinction.

