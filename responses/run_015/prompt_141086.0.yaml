      *   **Current Argument:** Moves beyond "it's just a convention" to "singing does representational work speech can't." Specifically focuses on *temporality* (aria as temporal microscope), *totalization* (death scenes as life summed up), *ensembles* (simultaneous incompatible emotions), and *Bernard Williams* (truth in duration vs. incident).
      *   **Specific Questions:**
