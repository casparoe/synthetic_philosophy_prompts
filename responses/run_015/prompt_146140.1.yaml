  4. that knowing something requires being in a position to know it, so failure of the second-order position really is failure of KK and not just failure of some stronger reflective condition;
  5. that there's no stable restricted survivor — e.g., KK confined to cases with no indistinguishable failure-case, or to subject matters where the luck gap can't open up.

