answer: |-
  You have put your finger on a profound tension between the formal logic of social choice and the lived ethics of our institutions, and it reveals something unsettling about how we conceive of ourselves as agents within collective systems. When an election board or a conference chair insists that you reveal your preferences sincerely, they are not merely giving you technical advice about how to maximize your influence; they are making a metaphysical claim about the nature of your preferences themselves. By framing strategic misordering as a kind of lie or a lapse in rationality, these institutions presuppose that preferences are internal, fixed states of affairs that exist prior to and independent of the mechanism used to aggregate them. In this view, your ranking of candidates or papers is akin to a report on the weather or a statement about your health, something that can be true or false relative to a reality inside you. If you rank strategically, you are not just playing the game differently; you are falsifying the record of your own mind, treating your preferences as movable pieces rather than authentic expressions of value. This suggests a robust, essentialist view of preference where the agent is a discoverer of their own tastes rather than a constructor of them based on the incentives at hand.

  However, since we know from Gibbard and Satterthwaite that no general mechanism can guarantee safety for honest voting when there are three or more options, the instruction to vote sincerely cannot be purely technical advice about safety. It must be a normative command that overrides instrumental rationality. This implies that the institutions are not viewing you as a homo economicus whose only duty is to optimize outcomes for yourself, but rather as a citizen or community member whose duty is to sustain the legitimacy of the process itself. If everyone treats the vote as a game to be manipulated, the signal-to-noise ratio degrades until the collective decision loses its meaning, so the instruction to be honest is a request for cooperation in a Prisoner's Dilemma where the cooperative move is truth-telling. This frames rational agency not as the capacity to win, but as the capacity to commit to rules that allow the community to function, even when defecting might offer a marginal personal advantage. It treats the act of voting or reviewing as a speech act with felicity conditions of sincerity, where the value lies in the expression itself as much as in the resulting allocation of power or prestige.

  Given that universal strategy-proofness is impossible, you are right to wonder if these practices are secretly relying on restricted preference domains they refuse to articulate. It is possible that election designers assume voters have single-peaked preferences along a left-right spectrum, or that conference chairs assume reviewers evaluate based on a shared metric of quality that prevents cyclical rankings. If preferences are well-behaved in these specific ways, then honesty actually becomes safer, and the warning against strategy is technically correct within that narrowed context. Yet, by not stating these assumptions, they leave participants in the dark about when honesty is safe and when it is sacrificial. This opacity suggests that the restriction of domains is not the primary engine here; rather, the practice is asking participants to treat honest revelation as a kind of autonomy right or a deontological duty regardless of the mechanism's safety. They are asking you to act as if the mechanism were strategy-proof, effectively willing a reality where your honesty cannot be used against you, even if the math says otherwise.

  Ultimately, this framing presupposes a view of rational agency where integrity is constitutive of the self, rather than merely a strategy for long-term gain. It assumes that there is a true ordering of values within you that deserves expression for its own sake, and that suppressing this ordering to game the system is a violation of your own autonomy as much as it is a disruption of the collective process. When they tell you that you cannot hurt your top choice by being honest, they are offering a promise that is mathematically fragile but socially necessary, inviting you to join them in a fiction that allows the system to hold together. They are asking you to prioritize the health of the deliberative body over the optimization of your individual utility, positing that the rational thing to do is to trust the procedure enough to expose your true preferences to it. This transforms the vote or the review from a tactical maneuver into a ritual of membership, where the cost of honesty is the price of admission to a community that claims to value truth over victory. In doing so, they reveal that their commitment is not to the perfect mechanics of aggregation, but to the moral character of the participants who must breathe life into those mechanics.
