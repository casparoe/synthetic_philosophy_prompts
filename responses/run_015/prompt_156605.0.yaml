answer: |-
  **Title:** The Ergodic Illusion: Why Geometric Rationality Fails as a Universal Norm

  The quest for a fundamental norm of rational choice has long oscillated between the arithmetic expectation of classical Expected Utility Theory (EUT) and the geometric growth rates of the Kelly criterion. Geometric rationality, which prescribes maximizing the expected logarithm of wealth (or utility), offers a compelling correction to the paradoxes of arithmetic EUT. It resolves the St. Petersburg paradox, avoids the Gambler's Ruin, and aligns decision-making with the time-average properties of multiplicative processes. However, to elevate geometric rationality from a robust financial heuristic to the *fundamental* norm of rational choice requires it to withstand scrutiny beyond the casino and the stock market. When subjected to the rigors of serious philosophical decision problems—specifically those involving non-substitutable values and ontological ambiguity—geometric rationality fractures. While proponents argue that hierarchical extensions can preserve its core, these extensions ultimately reveal geometric rationality to be a special case of broader reasoning rather than its foundation. Consequently, geometric rationality must be rejected as the universal norm of rational choice; it is a domain-specific optimum that collapses when the sample space itself becomes a variable of the decision.

  The appeal of geometric rationality rests on the concept of ergodicity. In many real-world systems, the ensemble average (what happens to many people at once) differs from the time average (what happens to one person over time). Arithmetic EUT maximizes the ensemble average, often recommending bets that lead to certain ruin over time. Geometric rationality, by maximizing the expected log of outcomes, maximizes the time-average growth rate. This physical grounding makes it appear more "real" than the abstract axioms of von Neumann-Morgenstern utility. It treats wealth not as a static score but as a reproductive capacity, aligning rationality with survival and compounding. In a closed system with well-defined probabilities and fungible assets, it is undeniably superior to arithmetic expectation.

  However, the first crack in this foundation appears when we consider the axiom of substitutability. Geometric rationality assumes that all values can be mapped onto a continuous, scalable metric (like wealth) where losses and gains smooth out over time. It presupposes that a 50% loss can be recovered by a 100% gain. This holds for capital, but it fails for categorical values. In moral and existential decision-making, values are often lexical or non-substitutable. A loss of human rights, a violation of bodily autonomy, or the extinction of a culture cannot be treated as a drawdown in a utility bank account that can be compounded back to solvency. If an outcome involves a categorical violation—a "ruin" that is not merely zero wealth but the negation of the value system itself—the logarithmic function becomes undefined or morally grotesque. To apply geometric rationality here, one must force incommensurable values into a single currency of "log-utility." This does not solve the philosophical problem; it obscures it. A rational agent facing a choice between a guaranteed moral violation and a probabilistic avoidance of that violation cannot simply "bet" a fraction of their moral capital. The tension here reveals that geometric rationality is not a theory of value, but a theory of resource management presupposing a specific, fungible ontology of value.

  The second, more devastating tension arises from ontological ambiguity. Geometric rationality requires a well-defined sample space $\Omega$ and a probability measure $P$. It answers the question, "How much should I bet?" but it cannot answer, "What game am I playing?" In serious philosophical contexts, agents face uncertainty not just about outcomes within a space, but about the structure of the space itself. Consider the problem of personal identity in the context of quantum mechanics or teleportation. If an agent is uncertain whether they are a continuous linear entity (single-world) or a branching entity (Many-Worlds), the definition of "growth" changes fundamentally. In a branching universe, "survival" might be guaranteed across the multiverse, rendering the Kelly constraint against ruin irrelevant. In a linear universe, ruin is absolute. Geometric rationality cannot compute an optimal bet without first resolving the ontological status of the agent.

  Furthermore, this leads to the problem of model uncertainty (Knightian uncertainty). If the agent is unsure about the probability distribution itself, they must hold a distribution over distributions. To act, they must aggregate these models. Proponents of geometric rationality suggest applying the criterion at a meta-level: one should maximize the expected log-utility across models, effectively "betting" on which model is true. However, this hierarchical extension triggers a collapse. To combine recommendations from different ontological models (e.g., "Model A says bet 10%, Model B says bet 0%"), the agent must weight the models. This weighting is inherently an arithmetic operation. One calculates the arithmetic expectation of the utility across the model space to determine the prior weights for the geometric betting within the model space.

  This hierarchy reveals that geometric rationality is not the engine of the decision, but merely the utility function of the inner layer. The *fundamental* rational norm driving the meta-choice is still a form of expected utility maximization (arithmetic) over the space of models. If the top-level aggregation is arithmetic, then geometric rationality loses its claim to fundamentality. It becomes a specific strategy for handling risk *within* a confirmed ontology, rather than a norm for handling uncertainty *about* the ontology. By extending it to cover model uncertainty, we dilute its unique mathematical character. It becomes "EUT with a log utility function and a specific handling of ruin," rather than a distinct paradigm that supersedes EUT.

  Moreover, these extensions strip geometric rationality of its primary virtue: uniqueness. The Kelly criterion is often celebrated because it derives a specific bet size without needing arbitrary risk-aversion parameters. But once we introduce meta-uncertainty about the state space or lexical constraints on values, we must introduce weighting parameters to balance the incommensurable models or values. We are back to tuning parameters. The elegance of the Kelly criterion—its derivation from the pure mathematics of compounding—is lost when we must manually weight the probability of "branching identity" versus "linear identity." At that point, the decision is driven by the agent's subjective priors on metaphysics, not by the objective growth rate of the bet.

  Therefore, the tension between the criterion's requirements and the ambiguity of philosophical reality demonstrates its inadequacy as a general theory. Geometric rationality is an *ergodic* solution to a *non-ergodic* world. It assumes the game continues indefinitely and the rules remain static. But rational choice often concerns changing the rules, questioning the game, or facing one-off existential threats where "long-term growth" is meaningless. To insist on geometric rationality as the fundamental norm is to impose a financial logic onto metaphysical problems. It demands that we treat our lives, identities, and moral commitments as a bankroll to be managed for growth, rather than as categorical ends to be preserved.

  In conclusion, geometric rationality should not be treated as the fundamental norm for rational choice under risk. While it corrects critical flaws in arithmetic EUT regarding repeated multiplicative risks and ruin, it relies on assumptions of substitutability and ontological stability that do not hold in deep philosophical decision problems. The attempt to save it through hierarchical meta-betting succeeds only by subsuming it under a broader arithmetic framework of model weighting, thereby proving it to be a special case rather than a universal foundation. Rationality requires a toolkit, not a single master key. Geometric rationality is the optimal tool for wealth preservation in a known game, but it is too rigid to serve as the norm for navigating the unknown rules of existence itself. We must recognize it as a powerful domain-specific heuristic, bounded by the very ontological and axiological tensions it cannot resolve.
