  1.  **Analyze the User's Request:**
      *   **Context:** The user is writing a novel with two specific characters: one obsessed with why people read bad books, the other a utilitarian philosopher.
      *   **Core Conflict:** They are stuck on the "heterogeneity of pleasure" debate (Uniformism vs. Heterogeneity/Family Resemblance).
      *   **Specific Questions:**
