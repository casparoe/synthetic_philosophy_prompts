          *   Reward ambiguity (not just affine, but structural).
          *   Out-of-distribution generalization risks.

  6.  **Refining the "Ambiguity" point:**
      *   The book says: "multiplying by positive number/adding constant." This is the standard *affine transformation* invariance in RL.
      *   The Reality: That's the *minimum* ambiguity. The *real* problem is that many *structurally different* reward functions can produce the same optimal policy in the observed states. (e.g., Reward for "being near the lane center" vs. Reward for "minimizing steering angle"). In the training data, they look the same. In a new situation (ice on road), they diverge. The book ignores this *under-specification*.
      *   *Correction:* The passage conflates "mathematical equivalence of optimal policies" with "semantic equivalence of goals."

  7.  **Refining the "Alignment" point:**
