  9.  **Final Polish:** Ensure the distinction between "affine ambiguity" (mathematical) and "degeneracy/under-specification" (structural) is clear, as that's the crux of the user's second bug. The book is right about affine, wrong that it's the *only* ambiguity.

  **(Self-Correction during drafting):** I need to make sure I don't overwhelm the user with MDP math. Keep it conceptual. Use the driving example they know.
