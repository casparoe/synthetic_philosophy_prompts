answer: |-
  This is a fantastic problem to have as a TA. It means your students (and you) are actually engaging with the texts rather than just treating *Naming and Necessity* as a set of bullet points. Your confusion is well-founded: Mill and Kripke are fighting the same enemy (descriptivism), but they are fighting with different weapons in different arenas.

  Here is a breakdown of what Mill is doing in that passage, how it relates (and doesn't relate) to Kripke, and a verdict on your friend's heuristic.

  ### 1. Mill's "Subject" vs. "Attribute"
  To understand why 'John' signifies a subject only while 'virtuous' denotes a class, you have to look at Mill's metaphysics of language.

  *   **Subject:** For Mill, a "subject" is a concrete particular—a substance or bearer of properties. It is the *thing* that exists in the world. When he says 'John' signifies a subject only, he means the word functions as a label attached directly to that particular entity. It does not tell you anything *about* John (e.g., that he is tall, kind, or the baker). It just points to him.
  *   **Attribute:** An attribute is a property, quality, or characteristic (whiteness, virtue, length).
  *   **Connotative Terms (e.g., 'virtuous'):** These terms work by filtering. To know if the word 'virtuous' applies to Socrates, you must check if Socrates possesses the attribute *virtue*. The word denotes the class of people (Socrates, Howard, etc.), but it *connotes* the attribute that defines membership in that class. If Socrates stops being virtuous, the word 'virtuous' no longer applies to him.
  *   **Non-Connotative Terms (e.g., 'John'):** These terms do not filter by attributes. They are unmeaning marks. If John loses his hair, changes his personality, or moves to Mars, he is still 'John'. The name does not rely on any attribute to pick out the subject.

  **Why the distinction matters:** Mill is arguing that proper names have no *semantic content* (no "meaning" in the sense of a description). They are purely denotative tags. 'Virtuous' has meaning (it implies virtue); 'John' does not (it implies nothing).

  ### 2. Mill vs. Kripke: Non-Connotative vs. Rigid
  Your friend's "Mill's Rigid-Designator Test" is catchy, but it is indeed anachronistic. Here is the precise relationship:

  **The Overlap (Anti-Descriptivism):**
  Both Mill and Kripke agree that proper names are not abbreviations for descriptions.
  *   **Mill:** Names are non-connotative. They don't imply attributes.
  *   **Kripke:** Names are not synonymous with clusters of descriptions (e.g., "Aristotle" doesn't mean "the teacher of Alexander").
  *   **Result:** Both views sever the link between *meaning* and *reference*. For both, you don't need to know a description to successfully refer.

  **The Divergence (Semantics vs. Modality):**
  *   **Mill's Claim is Semantic/Epistemological:** He is saying names don't carry descriptive *information*. His distinction is about what the word *means* (connotes) in the actual world. He is not thinking about counterfactual scenarios.
  *   **Kripke's Claim is Modal:** Rigidity is about behavior across *possible worlds*. A rigid designator picks out the same object in every world where that object exists.
  *   **The Gap:** Mill's view *entails* a kind of rigidity, but he doesn't formulate it. If a name has no descriptive content, there is no description that could fail to apply in a different possible world. However, Mill lacks the machinery of possible worlds semantics. He is an empiricist who thinks all necessity is verbal/definitional. Kripke is arguing for *metaphysical* necessity.

  **Verdict:** Mill's "non-connotative" is a **semantic precursor** to Kripke's "rigid designator," but they are not identical. Mill says names lack *sense*; Kripke says names lack *modal variability*.

  ### 3. Handling Kripkean Examples in Mill's Framework
  If you bring "Hesperus is Phosphorus" or "Water is H2O" to Mill using this passage, here is how he would parse it:

  **Hesperus = Phosphorus:**
  *   **Mill:** Both 'Hesperus' and 'Phosphorus' are non-connotative names. They are mere marks attached to a subject.
  *   **The Discovery:** Before the discovery, people thought the marks were attached to two different subjects. The astronomical discovery revealed that both marks are attached to the *same subject* (Venus).
  *   **Necessity?** Mill would struggle here. For Mill, this is a "real proposition" (it conveys new information, so it's not just verbal), known *a posteriori*. But Mill generally holds that all necessary truths are verbal (connotative/definitional). He would likely deny that the identity is *necessary* in the Kripkean sense, viewing it instead as a very stable empirical fact. He lacks the concept of metaphysical necessity.

  **Water = H2O:**
  *   **Mill:** 'Water' is a name (non-connotative) for the substance. 'H2O' is a connotative term (it implies a specific chemical structure).
  *   **The Discovery:** We discovered that the subject marked by 'Water' possesses the attribute connoted by 'H2O'.
  *   **The Difference:** For Kripke, 'Water' rigidly designates the stuff. For Mill, 'Water' is just a tag. The scientific description ('H2O') captures the attributes. Mill would view "Water is H2O" as linking a name to a description, whereas Kripke views it as linking two rigid designators (if we treat 'H2O' as a natural kind term).

  ### 4. Is the Heuristic Helpful or Misleading?
  Your friend's "Mill's Rigid-Designator Test" is **pedagogically useful but philosophically risky.**

  **Why it's helpful:**
  It stops students from thinking Kripke invented the idea that "names aren't descriptions" out of thin air. It highlights the *anti-descriptivist* core that Mill and Kripke share. It helps students see that if a name "signifies a subject only" (Mill), it naturally follows that it doesn't change reference when attributes change (Kripke).

  **Why it's misleading:**
  1.  **Modality:** It imports modal logic into a text that doesn't have it. Mill's "subject" is a metaphysical substance, not an object tracked across possible worlds.
  2.  **Necessity:** It glosses over the fact that Mill is an empiricist who would likely reject the "necessary a posteriori." For Mill, if it's *a posteriori*, it's contingent.
  3.  **Connotation:** Mill's "connotation" is technical (implying attributes), not the modern sense (emotional overtone). Students might confuse the two.

  **Recommendation for your Seminar:**
  Use the heuristic as a **bridge**, but explicitly label it as such. You might say:
  > "Mill gives us the semantic groundwork: names are tags without descriptive meaning. Kripke takes that groundwork and builds a modal skyscraper on top of it. Mill says names don't describe; Kripke says names don't describe *and therefore* they pick out the same thing in every possible world."

  If you use the "Test," add a disclaimer: *"Mill didn't know about possible worlds, but if he did, his theory of names suggests they would behave rigidly."* This honors the text while making the connection to Kripke clear without committing the anachronism.

  **Summary for your students:**
  *   **Mill:** Names are tags (non-connotative). They point to subjects without describing them.
  *   **Kripke:** Names are rigid tags. They point to the same subject in all possible worlds without describing them.
  *   **Connection:** Mill explains *why* names aren't descriptions; Kripke explains *what happens* when we treat them that way in modal contexts.

  (And don't worry about the typos; 'connotation' is a dangerous word in this context regardless of spelling!)
