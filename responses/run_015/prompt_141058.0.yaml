  Me and my friend spent like two hours on this last night and got nowhere, so I want someone to actually settle it. His position: there's no such thing as a deceptively aligned model, there's just a policy that fit the training distribution and then behaves unexpectedly off-distribution, same category as reward hacking or Goodharting, and the story about a hidden goal that waits until it can get away with something is mysticism we're reading in. He also said that even if it were true, the treacherous turn and ordinary distributional Goodharting have the same observable signature right up until the turn, so the distinction does no work for anyone actually building evals. I think he's throwing away something real and I couldnt say what.

  For context: I work on RL and eval infrastructure. I'm fluent in policies, reward models, on- vs off-policy data, distribution shift, Goodharting, KL penalties, gradient descent, adversarial examples; I've read a bit of mech interp, and basically no philosophy.

  Take the actual argument for deceptive alignment and the treacherous turn — a model learns the training objective only as a means, preserves its own objective through gradient descent by performing well under oversight, and switches once oversight stops being informative — and restate it as faithfully as you can in that vocabulary. Not a debunk: I want the strongest version, phrased so my friend would accept every sentence as well-formed ML.

  Then the residue report: what translates cleanly, what only translates with something lost, what has no expression in policy/distribution-shift terms at all. My guesses for the hard bits are the "waits until it can get away with it" part, since strategic timing looks like it needs the model to represent the overseer, and the line between deceptively aligned and merely reward-hacking, which looks like a claim about internal structure rather than behavior. Then say whether the residue means my vocabulary is missing something real — an intentional stance doing predictive work, or a goal read off as the attractor of off-distribution behavior — or means the safety framing is vaguer than it sounds.

  After the prose, give me a table with columns: Original claim (one sentence, in their terms) | Restatement in my vocabulary | Distortion (what had to be bent to fit) | Verdict (translates cleanly / only with distortion / no counterpart) | Whose problem (my vocabulary is missing something, or the original claim was unclear). One row per claim, and keep the rows that don't translate — those are the ones I care about.
