  In a municipal budget office, the director faces a fixed annual allocation that must be assigned to either the Specialized Pain Management Initiative or the General Wellness Optimization Program. The Specialized Initiative would fully alleviate the excruciating, unremitting neuropathic pain experienced by twelve residents who currently spend twenty hours a day in a state of agony so severe they cannot speak or sleep, effectively restoring their capacity for a normal life. The General Wellness Program would instead distribute the funds to provide minor ergonomic improvements and reduced waiting times for public services to one million citizens, each gaining a trivial but measurable increase in daily comfort equivalent to avoiding a mild headache for ten minutes. The budget is insufficient to fund both, and no other revenue sources exist, forcing a binary choice between eliminating the extreme suffering of the few or aggregating the marginal comfort gains of the many.

  A fully commensurable account of pleasure and pain, treating all states as convertible units on a single scale, would likely mandate funding the General Wellness Program, provided the aggregate sum of one million minor comfort gains mathematically exceeds the disutility of the twelve individuals' agony. In contrast, lexical-threshold negative utilitarianism would mandate funding the Specialized Pain Management Initiative, asserting that the severity of the neuropathic pain crosses a qualitative boundary that no quantity of mild comfort can morally outweigh. The precise structural feature driving this divergence is the lexical boundary itself, which posits that states above a certain intensity of suffering belong to a different moral category than states below it, rendering them incomparable rather than merely unequal in magnitude. If this feature were removed by lowering the intensity of the severe case just beneath the threshold—for instance, reducing the pain to a moderate, manageable discomfort—the lexical theory would collapse into aggregation, potentially aligning with the commensurable view to favor the larger number of beneficiaries since no lexically superior badness remains to veto the trade-off. Finally, a defender of the lexical-threshold position might attack the case without appealing to empirical data or named authorities by arguing that the boundary has been assumed rather than independently established, contending that the thought experiment presupposes a continuous metric of value to create the trade-off instead of demonstrating why mild comforts should be permitted to outweigh severe agony in the first place.
