answer: |-
  **Joint Statement on Levels of Selection in Engineered Microbiomes**

  **1. Agreed Claims**
  1.  The Price Equation partitions total evolutionary change into within-group and between-group components; this partition is algebraic, not inherently causal.
  2.  Enzyme carriage reduces cell growth rate by 8% in isolation; this is a fixed physiological cost.
  3.  Low colonization bottlenecks (1–10 founders) increase genetic relatedness among gut bacteria compared to high bottlenecks (1000 founders).
  4.  High migration rates homogenize plasmid frequencies across cages, reducing between-cage variance.
  5.  Cage-level productivity (mouse health/offspring) correlates with total enzyme concentration in the gut, not merely carrier frequency.
  6.  For the enzyme gene to increase globally, between-cage selection must offset within-gut selection against the costly plasmid.
  7.  Horizontal transfer allows plasmid fitness to diverge from host-cell fitness; the plasmid is a mobile genetic element.
  8.  The defector plasmid has a within-gut advantage due to lower metabolic cost and higher transfer rate.
  9.  Both frameworks yield identical quantitative predictions for frequency change given full parameter specification; disagreement concerns causal attribution.

  **2. Disagreements Table**

  | Crux | Nadia's Formulation (Gene's Eye) | Owen's Formulation (MLS) | Diagnostic Manipulation | Nadia's Prediction | Owen's Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Unit of Adaptation** | The plasmid is the replicator; the cell is a vehicle. Selection maximizes plasmid lineage fitness. | The cell is the interactor; the gut is the collective. Selection maximizes cell/gut functional integrity. | **Vary Conjugation:** Set rate to Max vs. Zero at fixed bottleneck. | Plasmid frequency tracks plasmid fitness (transfer rate minus cost) regardless of cell lineage stability. | High conjugation dissolves cell-level selection; cooperation collapses unless gut-level selection is extreme. |
  | **2. Cause of Stability** | Cooperation persists if relatedness ($r$) offsets cost ($c$). Group terms are bookkeeping for $r$. | Cooperation persists if between-group variance drives trajectory. Group terms are causal forces. | **Vary Turnover:** Link cage turnover to productivity vs. Random turnover at fixed relatedness. | Turnover mechanism is irrelevant; only final $r$ and fitness values determine equilibrium. | Productivity-linked turnover increases enzyme frequency by amplifying between-group causality. |
  | **3. Defector Outcome** | Defector is a superior replicator; it fixes unless $r$ is extreme enough to suppress it. | Defector is a group-level parasite; it fixes locally but crashes cages, selecting against itself globally. | **Introduce Defector:** Measure global frequency after 100 gens with high cage turnover. | Defector frequency > 90% unless bottleneck is single-cell (max $r$). | Enzyme plasmid persists > 50% because defector-heavy cages fail to reproduce. |

  **3. Verbal Disputes**
  Much of the persistent friction is terminological rather than empirical. First, the word "group" is overloaded. Nadia uses it to denote a statistical cluster for covariance calculation; Owen uses it to denote a physiological interactor with a life cycle. To settle this, we agree to distinguish "statistical grouping" (any partition) from "reproducing collectives" (entities with bottlenecked formation and differential extinction). Second, "selection" is used interchangeably with "evolutionary change." Nadia treats selection as the covariance itself; Owen treats it as the causal process generating the covariance. We recommend reserving "selection" for causal processes involving heritable variation in fitness, and "change" for the net outcome. Finally, "individuality" is the sticking point in Crux 1. If horizontal transfer is high, the cell loses lineage integrity. Nadia calls this a change in replicator dynamics; Owen calls it a breakdown of the interactor. This is not merely verbal: it dictates whether we model the system as competing genes or competing ecosystems. Fixing the vocabulary requires specifying the *timescale* of individuality relative to the *timescale* of selection.

  **4. Referee's Note**
  This document forces specificity. The engineered system allows independent variation of parameters that are usually conflated in nature (e.g., relatedness vs. group turnover). The defector plasmid is the critical stress test. If Owen claims group selection saves the enzyme despite the defector, he must show cage turnover drives the frequency change independently of relatedness. If Nadia claims the plasmid wins on its own merits, she must show persistence even when cage turnover is random. We require raw data on cage extinction rates, not just final frequencies. Do not retreat to "mathematical equivalence" to avoid the causal claim. The math is the same; the story is not. We want the story that guides the next intervention.

  \answer{crux 1: plasmid versus cell individuality}
