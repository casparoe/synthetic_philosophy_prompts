  No consequence justifies the stain.
  They offered him the honour well.
  It shortened conflict's long campaign.

  The necessity was feigned in vain.
  She read the pamphlet, knew it well.
  No consequence justifies the stain.

  What use to stand when powers reign.
  "What good," they asked, "when the honour fell?"
  It spared the cost of further pain.

  To keep her own hands clean remains.
  "To not consent is all to tell."
  No consequence justifies the stain.

  The signature breaks no moral chain.
  The signature alone cannot quell.
  The cities burned to stop the strain.

  The description holds the verdict plain.
  The act remains for us to spell.
  No consequence justifies the stain.
  The deaths were what we meant to gain.

  Notes

  I took a formal liberty by varying the second refrain (A2) on each return. A strict villanelle demands exact repetition, but the prompt required the erosion of euphemism to be enacted in the form itself. I am confident in the reading of Anscombe's central thesis: that the distinction between intended means and foreseen side-effects is moral bedrock, not a loophole for calculation. The poem assumes her protest was about complicity in honouring evil, not about altering the outcome.

  The line I am least sure about is "To keep her own hands clean remains." It risks sounding like a concern for personal purity rather than an objective duty to refuse injustice. Anscombe would likely frame it as "not cooperating with murder" rather than "keeping hands clean," but the latter fits the rhyme and meter while pointing toward agency. The closing couplet juxtaposes the absolute prohibition with the stripped-back admission of intent, aiming to show that once the action is described honestly, the moral math collapses.
