  **The Problem of Old Evidence**

  In Bayesian confirmation, a hypothesis H confirms evidence E only if learning E raises H's probability. But if E is already known (probability 1), learning it cannot raise anything. Thus, old evidence cannot confirm new theories. Yet Einstein's use of Mercury's orbit seems paradigmatic confirmation. This tree sorts solutions by your judgments on specific cases, not by labels.

  **Design Logic**

  **Questions 1–4 (Cases):** C1 Individual/Community; C2 P(E)=1 barrier; C3 Prior H; C4 Logical Omniscience.
  **Questions 5–8 (Fixes):** Algebra change; Historical reconstruction; Certainty denial; Metric change.
  **Questions 9–12 (Meta):** Omniscience; Community; Prediction vs. Accommodation.
  **Coherence:** "Fixed Algebra" + "New Logical Info" = Incoherent. "E is Certain" + "Certainty Denial" = Incoherent. "Individual Confirmation" + "Community Property" = Incoherent.
  **Empty Cells:** Views denying confirmation entirely are ruled out as unattractive. Views requiring both reconstruction and certainty denial are unexplored.

  **The Decision Tree**

  Answer each question. Track your path to a Leaf.

  1.  **C1 (New Researcher):** Does she confirm H using the old logs?
      *   Yes → Go to 2. (Individual State)
      *   No → Go to 5. (Community State)
  2.  **C2 (Certain E):** Is E's probability of 1 the barrier to confirmation?
      *   Yes → Go to 3.
      *   No → Go to 4.
  3.  **Fix (Certainty):** Must we treat E as uncertain to solve this?
      *   Yes → **Leaf: Uncertain Observation.**
      *   No → Go to 6.
  4.  **C3 (Prior H):** Does reviving H with a prior help confirmation?
      *   Yes → Go to 7.
      *   No → Go to 8.
  5.  **C1 (Community):** Is oldness a property of the lab, not the person?
      *   Yes → Go to 9.
      *   No → (Incoherent with Q1-No).
  6.  **Fix (Algebra):** Must we add propositions about logic to the set?
      *   Yes → Go to 10.
      *   No → Go to 11.
  7.  **Fix (History):** Must we reconstruct the state before E was known?
      *   Yes → **Leaf: Historical Reconstruction.**
      *   No → Go to 12.
  8.  **Metric:** Is confirmation about high probability, not increase?
      *   Yes → **Leaf: Firmness.**
      *   No → **Leaf: Incrementalist Error.**
  9.  **C4 (Omniscience):** Does not knowing H entails E block confirmation?
      *   Yes → Go to 10.
      *   No → Go to 11.
  10. **Fix (Logic):** Is learning the entailment the new evidence?
      *   Yes → **Leaf: Logical Relation.**
      *   No → **Leaf: Bounded Rationality.**
  11. **Case A (Eclipse):** Does the new eclipse data confirm H more than Mercury?
      *   Yes → **Leaf: Incrementalist Error.**
      *   No → **Leaf: Firmness.**
  12. **Case B (Prediction):** Do predicted lines confirm more than fitted ones?
      *   Yes → **Leaf: Historical Reconstruction.**
      *   No → **Leaf: Firmness.**

  **The Leaves**

  1.  **Uncertain Observation (Jeffrey).** *Awkward Commitment:* No empirical data is ever fully certain. *Indistinguishable from:* None.
  2.  **Historical Reconstruction (Horwich).** *Awkward Commitment:* Confirmation depends on counterfactual history, not actual states. *Indistinguishable from:* None.
  3.  **Firmness (Keynes).** *Awkward Commitment:* A theory can be confirmed without probability changing. *Indistinguishable from:* Incrementalist Error.
  4.  **Incrementalist Error (Mayo).** *Awkward Commitment:* Bayesianism is correct, but "confirmation as increase" is wrong. *Indistinguishable from:* Firmness.
  5.  **Logical Relation (Garber).** *Awkward Commitment:* Agents assign probabilities to logical truths. *Indistinguishable from:* Bounded Rationality.
  6.  **Bounded Rationality (Hintikka).** *Awkward Commitment:* Agents are not logically omniscient. *Indistinguishable from:* Logical Relation.

  **Indistinguishable Pairs**

  1.  **Firmness / Incrementalist Error.** *Reason:* Both deny the need for probability increase. *Distinguishing Question:* "Is Bayesianism itself flawed, or just the incrementalist criterion?" (Not in Case Bank).
  2.  **Logical Relation / Bounded Rationality.** *Reason:* Both rely on logical discovery. *Distinguishing Question:* "Is the entailment a new proposition or a computational limit?" (Not in Case Bank).
  3.  **Historical Reconstruction / Firmness.** *Reason:* Both validate old evidence. *Distinguishing Question:* "Does confirmation require a past state where P(E)<1?" (Covered by Q7/Q12 split).
