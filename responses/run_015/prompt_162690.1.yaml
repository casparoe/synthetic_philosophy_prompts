answer: |-
  This is a sophisticated dissection of the normative architecture of modern retirement policy. You have identified the central friction in "Libertarian Paternalism" as it is actually implemented: the asymmetry in how agency is construed at the point of entry versus the point of exit.

  Here is a reconstruction of the implicit theory, an analysis of its theoretical underdetermination, and a verdict on the "agency laundering" charge.

  ### 1. The Charitable Reconstruction: Time-Sliced Agency

  To make the package coherent, one must reject a unitary view of the agent. The operative theory is not about "Means vs. Ends," nor strictly about "Fiduciary Relations." It is a theory of **Time-Inconsistent Preferences managed by Institutional Scaffolding.**

  **The Theory of Agency:**
  The design presupposes that the worker is not one agent, but a sequence of agents (T1, T2, T3...) with conflicting preference orderings.
  *   **At T1 (Enrolment):** The worker suffers from *status quo bias* and *procrastination*. Inertia here is treated as **noise**, not signal. Therefore, treating inertia as consent is not "respecting their will" in a literal sense, but "respecting their latent will" (what they would choose if transaction costs were zero and cognition was unbounded).
  *   **At T2 (Accumulation):** The worker suffers from *present bias* and *temptation*. Active choices to withdraw or invest aggressively are treated as **signal**, but signal of a "lower" self (the impulsive self) overriding the "higher" self (the planning self).
  *   **At T3 (Retirement):** The goal is to ensure the T1 self's plan survives the T2 self's temptations.

  **Coherence:**
  It is coherent to treat inertia as respect-worthy at T1 and active choice as constrainable at T2 *if and only if* you accept that:
  1.  **Latent Preference > Expressed Preference:** What a person *would* choose under ideal conditions trumps what they *do* choose under biased conditions.
  2.  **Asymmetry of Error:** The cost of false positives (enrolling someone who didn't want to) is lower than the cost of false negatives (failing to enroll someone who needed to). Conversely, the cost of allowing withdrawal (poverty) is higher than the cost of restricting it (liquidity constraint).

  **Required vs. Optional:**
  *   **Strictly Required:** The belief in **Hyperbolic Discounting**. Without the empirical claim that humans systematically value the present disproportionately to their own long-term interest, the lock-ins are indefensible paternalism.
  *   **Strictly Required:** The **Low-Cost Exit at T1**. If opting out at the start were difficult, the claim that inertia represents latent consent collapses into coercion.
  *   **Optional Extras:**
      *   *Fiduciary Language:* Helpful for legitimacy, but not logically required. The state could act as a "strict parent" without claiming to be an agent of the worker.
      *   *Means vs. Ends:* This distinction does not hold. The policy *does* dispute the worker's ends if their end is "consume now rather than later." It disputes the validity of that end at T2.
      *   *Cheap to Resist:* This is only half-true. It is cheap to resist at T1, but the policy deliberately makes it expensive at T2. The theory requires the *initial* resistance to be cheap, not the ongoing one.

  ### 2. Where It Is Underdetermined

  Three distinct normative theories generate this exact institutional shape. You cannot distinguish them by looking at the rules alone.

  **Theory A: Welfarist Nudge (Thaler/Sunstein)**
  *   **Foundation:** Maximize individual welfare as judged by the individual themselves.
  *   **Logic:** People make mistakes due to bias. We correct mistakes while preserving the formal right to choose.
  *   **Justification:** "We are helping you help yourself."

  **Theory B: Fiscal Sustainability (Macro-Prudential)**
  *   **Foundation:** Minimize future state liability for means-tested elderly support.
  *   **Logic:** If workers do not save, the state pays. The state therefore has a legitimate interest in forcing savings to protect the *taxpayer*, not necessarily the *worker*.
  *   **Justification:** "We are preventing future poverty that would become a public burden."

  **Theory C: Republican Self-Binding (Ulysses Contract)**
  *   **Foundation:** Autonomy as self-legislation over time.
  *   **Logic:** The T1 self binds the T2 self to ensure freedom from future tyranny (of debt or destitution). The state is merely the external enforcer of the contract the worker made with themselves.
  *   **Justification:** "We are upholding your own long-term commitments."

  **Distinguishing Observation:**
  Look at the **Hardship Provisions** and the **Investment Menu**.
  *   **If Fiscal:** Hardship withdrawals will be minimal or taxable as income (to discourage use). The investment menu will prioritize low fees and capital preservation over growth (protecting the future tax base).
  *   **If Welfarist:** Hardship rules will be generous regarding welfare shocks (medical, housing) but strict on consumption. The menu will offer risk profiles matching age (lifecycle investing).
  *   **If Ulysses:** Hardship rules might allow pre-committed exceptions (e.g., "I allow myself to withdraw for a house deposit"). The menu will be simplified to prevent "choice overload" paralysis.

  *Empirical Test:* If the system allows hardship withdrawals for medical emergencies but taxes them heavily, it is Fiscal. If it allows them tax-free, it is Welfarist. If it allows them only if pre-authorized years prior, it is Ulysses.

  ### 3. Agency Laundering: Verdict and Cost

  **Verdict:**
  You are correct. **Agency Laundering** is a genuine feature of the practice, though a defender would call it **Preference Construction.**

  The system credits the worker with the *outcome* of the default (saving) to claim legitimacy ("You chose this"), but denies the worker agency over the *process* of the constraint (locking) to ensure efficacy ("You can't touch this").

  **The Defender's Reply:**
  A sophisticated defender would argue: "Nothing is laundered because we never claimed the *inertia* was the agency. We claimed the *outcome* aligns with the agency they *would have exercised* absent bias. The constraints are not denying agency; they are protecting the *conditions of future agency* (financial security)."

  **The Cost to Self-Presentation:**
  This reply costs the policy its "Libertarian" badge.
  *   **Current Presentation:** "We preserve freedom of choice."
  *   **Honest Presentation:** "We structure choice architecture to make the 'right' choice the path of least resistance, and we remove the 'wrong' choices entirely once committed."
  *   **The Cost:** It admits that "Freedom of Choice" is rhetorical. It shifts the legitimacy claim from *procedural* (you could have opted out) to *substantive* (this outcome is better for you). This makes the policy more vulnerable to challenges about *who defines* "better." If the state defines "better" as "more savings," but the worker defines it as "paying off high-interest debt," the laundering is exposed.

  ### 4. The Rival View: The Inevitable Architect

  If we accept that **neutrality is impossible** (someone must set the default rate, the menu, the age), the distinction between nudging and mandating does not collapse, but it shifts ground.

  *   **Does the distinction collapse?** No. It survives in the **Cost of Exit.** A nudge has a low-cost exit; a mandate has a high-cost (or no-cost) exit.
  *   **Does policy need to change?** Yes. If the Architect is inevitable, the focus must shift from *hiding the Architect* to **Accountability of the Architect.**
      *   **Current Design:** The Architect is hidden behind "market defaults" or "standard practice."
      *   **Required Change:** The default rate should be subject to periodic legislative review or sunset clauses. The investment menu selection criteria should be public and contestable.
  *   **Justification Change:** Instead of "We are just facilitating your choice," the state must say, "We are exercising stewardship over a public good (retirement security)." This requires democratic oversight of the default parameters, not just technical administration.

  ### 5. The Republican Worry: Non-Domination

  **The Worry:**
  Republican freedom is freedom from *arbitrary power*. Even if I can opt out, if the State has the *capacity* to change the default rate, the exit cost, or the investment menu at its discretion, I am subject to domination.

  **Is Individual Opt-Out Sufficient?**
  **No.** An individual opt-out defeats *interference*, but it does not defeat *domination*.
  *   **Example:** A master who allows a slave to take a day off whenever they ask is still a master. The power remains arbitrary.
  *   **Application:** If the State can raise the default contribution rate from 3% to 10% tomorrow without a fixed rule or recourse, the worker is dominated, even if they can opt out. The *threat* of the power affects their planning.

  **Resolution:**
  To satisfy the Republican constraint, the power to set the default must be **non-arbitrary.**
  *   **Rule of Law:** The criteria for changing defaults must be fixed in law (e.g., "rates adjust only with CPI + 1%").
  *   **Recourse:** There must be a mechanism to challenge the default settings collectively (e.g., through representation on the regulatory board), not just individually.
  *   **Verdict:** The current design usually fails this test. Defaults are often set by technocrats with broad discretion. Easy individual opt-out masks the structural domination of the rule-setter.

  ### 6. The Clinical Contrast: Why Defaults Here and Not There?

  You asked why defaults are scandalous in medicine but legitimate in savings. The distinction rests on **Reversibility** and **Bodily Integrity.**

  1.  **Reversibility:**
      *   **Medicine:** Cutting off a limb is irreversible. Consent must be explicit because the error cost is infinite.
      *   **Savings (at T1):** Failing to enroll for one pay period is reversible. You can catch up. Therefore, a default is permissible *at the start*.
      *   **The Tension:** As you noted, the savings policy *deliberately raises reversal costs* over time (lock-ins).
      *   **Resolution:** The policy treats the **Enrolment Decision** as the "Medical Moment." Once you consent to the *structure* (even by inertia), the subsequent lock-ins are treated as **Contractual Terms**, not new medical procedures.
      *   **The Flaw:** This is weak. A lock-in at year 10 is functionally similar to a medical procedure in terms of irreversibility. The policy relies on the T1 inertia to legitimize the T10 lock-in.

  2.  **Bodily Integrity vs. Wallet:**
      *   Liberalism grants the body a higher status than property. Interfering with the body requires a higher threshold of agency (informed consent) than interfering with property (contractual default).

  3.  **Expertise Asymmetry:**
      *   **Medicine:** The doctor knows the risk; the patient does not. A default would allow the doctor to impose their risk tolerance on the patient.
      *   **Savings:** The State/Regulator claims to know the *math* (compound interest), but the Worker knows the *need* (cash flow). A default here imposes the State's risk tolerance (long-term security) over the Worker's (current liquidity).

  **Conclusion on the Contrast:**
  The practice is legitimate in savings *only because* the initial reversal cost is low. The moment the policy raises reversal costs (lock-ins), it moves closer to the clinical model. To remain defensible, the policy must treat the **Lock-In** not as a continuation of the default, but as a **new decision point** requiring renewed consent. The fact that it does not do this is the strongest evidence for your "Agency Laundering" hypothesis. The system uses the low-stakes nature of T1 to legitimize the high-stakes constraints of T2.
