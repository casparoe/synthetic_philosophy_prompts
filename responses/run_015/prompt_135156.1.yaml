  here's the decision tree handout. i kept it in the weeds like you asked—no footnotes, just the logic branches.

  ### the intergenerational guilt sorter

  start at the top. answer honestly. if you hesitate, pick the one that makes you less uncomfortable.

  **1. can a group (like a nation) be responsible in a way that isnt just the sum of its members?**
  *   **NO** → go to **Leaf 1**
  *   **YES** → go to **Q2**

  **2. if 100% of the original people are dead, does the nation survive because of laws/borders (institutional) or blood/culture (essentialist)?**
  *   **BLOOD/CULTURE** → go to **Q3**
  *   **LAWS/BORDERS** → go to **Q4**

  **3. is the tie based on biological essence or learned values?**
  *   **BIOLOGICAL ESSENCE** → **Leaf 2**
  *   **LEARNED VALUES** → **Leaf 3**

  **4. is the guilt held by the State-Entity itself or the Citizens?**
  *   **STATE-ENTITY** → **Leaf 4**
  *   **CITIZENS** → go to **Q5**

  **5. are the citizens morally blameworthy (sin) or politically liable (debt)?**
  *   **MORALLY BLAMEWORTHY** → **Leaf 5**
  *   **POLITICALLY LIABLE** → go to **Q6**

  **6. is the liability because of your status (citizen) or your function (benefit/structure)?**
  *   **STATUS (CITIZEN)** → **Leaf 6**
  *   **FUNCTION** → go to **Q7**

  **7. is the function about wealth gained or systems kept?**
  *   **WEALTH GAINED** → **Leaf 7**
  *   **SYSTEMS KEPT** → **Leaf 8**

  ***

  ### the leaves

  **Leaf 1: Strict Methodological Individualist**
  *   **Claim:** Only humans have souls/minds, so only humans can be guilty. "Germany" didnt do anything, specific Germans did.
  *   **Awkward Commitment:** Makes it impossible to address harms built into laws or institutions that outlive the perpetrators.

  **Leaf 2: Ethnic Essentialist**
  *   **Claim:** Guilt is in the blood. If you share the lineage, you share the stain.
  *   **Awkward Commitment:** Requires believing in biological moral inheritance, which is scientifically nonsense and ethically horrific.

  **Leaf 3: Cultural Inheritance**
  *   **Claim:** You inherited the bad values/memes that caused the harm, so you need to unlearn them.
  *   **Awkward Commitment:** Hard to prove you actually hold the values just because you were born there; risks guilt by association.

  **Leaf 4: Corporate-Agent-With-Institutional-Continuity**
  *   **Claim:** The State is a legal person that survives population turnover. The State is guilty, not necessarily you.
  *   **Awkward Commitment:** Treats the state as a magical entity separate from the people who fund and run it.

  **Leaf 5: [UNNAMED COMBO]**
  *   **Claim:** Citizens are personally morally sinful for state acts they didnt commit.
  *   **Awkward Commitment:** Imputes personal sin to individuals for acts they had no causal hand in.

  **Leaf 6: Jaspers-Style Political Guilt**
  *   **Claim:** All citizens are liable for the deeds of the state by virtue of membership, regardless of personal fault.
  *   **Awkward Commitment:** Forces good actors to pay for bad actors solely based on geography/bureaucracy.

  **Leaf 7: Beneficiary Liability**
  *   **Claim:** You didnt do the crime, but you inherited the stolen money, so you owe it back.
  *   **Awkward Commitment:** Doesn't account for harms where no wealth was transferred, only dignity lost.

  **Leaf 8: Structural-Transmission-Without-Essentialism**
  *   **Claim:** You operate the machine that was built to harm. You dont need to be evil, just the operator.
  *   **Awkward Commitment:** Requires dismantling systems you might rely on to survive, which feels like self-harm.

