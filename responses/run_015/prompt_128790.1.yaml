  **Credence: 0.25**

  **Resolution and Settledness**
  This question cannot be settled empirically because it bridges the is-ought gap; no amount of psychological data dictates which foundations *ought* to be weighted. It would only be "settled" by a convergence on a meta-ethical theory (e.g., robust moral realism vs. constructivism) that validates specific intuitive inputs as truth-tracking. Since such convergence is historically unprecedented and perhaps impossible, my credence is capped by the inherent instability of the normative premises required to interpret the empirical data.

  **Decomposition**

  1.  **0.65** — Probability that binding foundations track genuine pro tanto reasons, as they often protect social cohesion goods that care/fairness miss.
  2.  **0.60** — Probability that higher responsiveness indicates better calibration, assuming non-zero detection is epistemically superior to zero detection even if overshooting.
  3.  **0.75** — Probability that genealogical explanations do not debunk moral beliefs asymmetrically, as evolutionary origins apply to care/fairness equally.
  4.  **0.85** — Probability that political moralities are comparable as wholes, since scope of moral concern is a coherent metric of completeness.

  **Combination and Confidence**
  I combine these via the product rule ($0.65 \times 0.60 \times 0.75 \times 0.85 \approx 0.25$), treating them as necessary conjuncts for the claim to hold robustly. I am least confident in **Term 2 (Calibration)**, because psychological intensity is a poor proxy for normative accuracy and often signals bias rather than insight. The single result that would move my number most is a **philosophical demonstration of moral anti-realism**, which would collapse Term 1 to near zero and render the empirical asymmetry normatively inert.

  **Disagreement Analysis**
  You (0.2) and your opponent (0.55) are most likely disagreeing on **Term 1 (Genuine Reasons)**. Your skepticism suggests you view binding foundations as largely coalitional psychology (lowering Term 1), while your opponent likely grants them ontological weight as evolved moral truths (raising Term 1). A secondary disagreement may lie in Term 2, regarding whether conservative intensity is a feature (sensitivity) or a bug (prejudice).

  **Hypothetical Result Impact**
  If a calibration measure showed both camps track binding foundations equally poorly (with conservatives merely reacting more strongly), this would devastate **Term 2**, dropping it from 0.60 to roughly 0.25 (acknowledging only that noticing the *category* exists has some value). This would reduce my total credence from **0.25 to roughly 0.10**. Once this finding is in, almost none of the asymmetry's normative upshot remains; the conservative position becomes not "less incomplete," but "equally blind but louder," stripping the empirical difference of its claim to greater moral truth-tracking.
