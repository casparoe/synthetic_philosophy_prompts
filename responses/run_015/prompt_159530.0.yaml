answer: |-
  ### I. The Collapse of Ideal and Non-Ideal Constraints

  For the specific purpose of grading real deliberative bodies, the distinction between a *theory of rational planning* and a *theory of what may be demanded of bounded agents* collapses.

  An ideal theory of rationality specifies what an agent with perfect control and persistence ought to do. A theory of bounded agency specifies what is feasible. If you are grading an agent, a verdict that relies on the impossible is not a normative assessment; it is a category error. Therefore, the normative theory must be **endogenous to the constraints**. It cannot treat boundedness, turnover, or leaky precommitment as external friction to be ignored; it must treat them as constitutive parameters of the agency being graded.

  **The Fundamental Requirement: Feasible Diachronic Coherence**
  The theory must define rationality relative to the agent's actual persistence and control parameters. A plan is rational only if it is optimal *among the set of plans the agent can actually execute given their institutional constraints*.
  *   **Status:** Non-negotiable.
  *   **Reasoning:** If the theory demands perfect precommitment from an agent who legally cannot bind their successors, the theory fails the "ought implies can" constraint necessary for fair grading.

  ---

  ### II. Case Analysis and Requirement Generation

  Here are the requirements generated by your load-bearing cases, plus one addition.

  #### 1. The Pump that No One Profits From (Dissipative Cycle)
  *   **The Case:** An agent cycles through preferences (A→B→C→A), paying a cost at each step, ending with the original holding minus the costs. No external exploiter profits; the value is dissipated.
  *   **The Requirement:** **Diachronic Efficiency.** An agent is defective if they end in a state that is Pareto-dominated by a reachable alternative state (e.g., the starting state), provided the transition was under their control.
  *   **Status:** **Non-negotiable.**
  *   **Reasoning:** For fiduciary bodies (endowments, central banks), wealth destruction without compensating value is the definition of failure. A theory that validates this behavior (e.g., by claiming each step was synchronically rational) is useless for grading.
  *   **Correction:** You frame this as separating "exploitation" from "intransitivity." For grading purposes, this distinction is irrelevant. The defect is the *net loss*. The requirement is not merely structural transitivity, but outcome-based efficiency over time.

  #### 2. The Rotating Committee (Partial Persistence)
  *   **The Case:** A committee with membership turnover executes a sequence of locally preferred trades that result in a net loss (a institutional money pump). No individual member is inconsistent.
  *   **The Requirement:** **Institutional Identity Conditions.** The theory must treat the *office* as the agent, not the *officeholders*. It must assign responsibility for diachronic coherence to the institution even when no single human constituent persists through the sequence.
  *   **Status:** **Non-negotiable.**
  *   **Reasoning:** If the theory treats each yearly cohort as a distinct agent, it cannot grade the "Endowment Committee's" long-horizon performance. It would merely grade the individuals. To grade the body, the theory must posit a trans-temporal agent constituted by rules and mandates, not just biological continuity.
  *   **Addition:** This generates a sub-requirement of **Successor Binding Weight.** The theory must specify the normative cost of repealing a predecessor's rule. It cannot be zero (otherwise no planning is possible) nor infinite (otherwise reform is impossible). It must be *positive but defeasible*.

  #### 3. The Reversal that Answers to Reasons (Preference Change)
  *   **The Case:** An agent reverses preferences (Career > Family → Family > Career → Career > Family) correlated with life stages.
  *   **The Requirement:** **Objective Reason-Tracking.** The theory must distinguish between preference changes driven by *new information or relevant state changes* (rational) and changes driven by *mere passage of time or visceral impulse* (irrational). Crucially, this assessment cannot rely solely on the agent's retrospective justification.
  *   **Status:** **Non-negotiable (for grading), but theoretically costly.**
  *   **Reasoning:** A theory that penalizes all preference change penalizes learning and adaptation. A theory that accepts all preference change cannot condemn weakness of will. To grade a body, you must be able to say, "This reversal was a prudent adaptation," vs. "This reversal was a failure of mandate."
  *   **Correction:** You suspect familiar families fail here. You are correct. Most standard theories are preference-*satisfaction* theories, not preference-*assessment* theories. They take preferences as inputs. To meet this requirement, the theory must incorporate an objective account of "reasons" external to the agent's revealed preferences.

  #### 4. The Leaky Ulysses Device (Imperfect Precommitment)
  *   **The Case:** An agent knows they will reverse. Binding is possible but costly and reversible by the future self.
  *   **The Requirement:** **Second-Best Compliance.** Rationality requires adopting the *optimal feasible* constraint, not the *ideal* constraint. If perfect binding is impossible, raising the cost of reversal is mandatory if it improves the expected outcome.
  *   **Status:** **Non-negotiable.**
  *   **Reasoning:** Grading an agent for failing to achieve the impossible (perfect binding) is unfair. Grading an agent for failing to use available, imperfect tools (raising costs) is valid. The theory must grade the *effort to constrain* relative to the *technology of constraint* available.

  #### 5. Added Case: The Emergency Override (Unforeseen Catastrophe)
  *   **The Case:** A committee binds itself to a long-term rule. A black-swan event occurs where following the rule causes catastrophic harm. The committee repeals the rule.
  *   **The Requirement:** **Defeasibility Conditions.** The theory must specify when a successor is *permitted* to violate a precommitment without being graded as irrational.
  *   **Status:** **Non-negotiable.**
  *   **Reasoning:** Without this, the theory demands suicide (or institutional collapse) in the face of the unforeseen. It complements "Successor Binding Weight." It ensures the theory does not fetishize consistency over survival.

  ---

  ### III. The Trilemma of Diachronic Choice

  Your hypothesis regarding the trilemma is correct. In the presence of dynamic inconsistency (where future preferences diverge from current plans), the following three requirements are jointly unsatisfiable:

  1.  **Synchronic Sovereignty:** Never act against your own current all-things-considered judgment.
  2.  **Diachronic Optimality:** Never adopt or persist in a plan you know to be worse than another plan available to you when you adopt it.
  3.  **Dynamic Consistency:** Never adopt a plan you know you will abandon.

  **Analysis of the Horns:**
  *   **Myopic Choice** satisfies (1) but drops (2) and (3). It follows local judgment, accepts worse outcomes, and abandons plans.
  *   **Sophisticated Choice** satisfies (1) and (3) but drops (2). It anticipates future abandonment, restricts itself to feasible plans, but accepts that the "best" plan is unavailable because it would be abandoned.
  *   **Resolute Choice** satisfies (2) and (3) but drops (1). It commits to the optimal plan and forces the future self to comply, even if the future self's local judgment objects.

  **Verdict on the Trilemma:**
  *   **Is it valid?** Yes. This is a structural impossibility for agents with time-inconsistent preferences and imperfect binding technology.
  *   **Which horn is cheapest to give up?** For *deliberative bodies*, **Horn 1 (Synchronic Sovereignty)** is the cheapest to drop.
      *   *Why:* Institutions are specifically designed to override local whims for long-term goals (charters, mandates, fiduciary duties). A central bank governor *ought* to act against their current political judgment if it violates the inflation mandate. Dropping Horn 1 allows for **Resoluteness**, which is the only path to securing Diachronic Optimality (Horn 2) without perfect precommitment.
  *   **Which single requirement excludes the largest number of candidates?**
      *   **Diachronic Optimality (Horn 2).**
      *   *Why:* This requirement rules out Myopic approaches (obviously) but also rules out Sophisticated approaches. Sophistication accepts suboptimal outcomes as the "rational" price of consistency with future weakness. If your grading methodology demands that the body *achieve* the best long-term outcome (efficiency), Sophistication fails. Only Resoluteness (or perfect Precommitment) passes. Since perfect Precommitment is ruled out by your "Leaky Ulysses" constraint, **Resoluteness becomes the only viable candidate.** This excludes the vast majority of standard economic models of dynamic choice which default to Sophistication.

  ---

  ### IV. Scorecard of Families Against Requirements

  | Requirement | Act-by-Act (Myopic) | Sophisticated Planning | Resolute Planning | Team/Person-Stages |
  | :--- | :--- | :--- | :--- | :--- |
  | **Feasible Diachronic Coherence** | **Pass** (Fits bounds) | **Pass** (Fits bounds) | **Fail** (Demands control agents may lack) * |
  | **Diachronic Efficiency** | **Fail** (Accepts pumps) | **Fail** (Accepts suboptimal equilibrium) | **Pass** (Targets best outcome) | **Fail** (No cross-temporal opt) |
  | **Institutional Identity** | **Fail** (Treats stages as new) | **Pass** (Anticipates successors) | **Pass** (Binds successors) | **Fail** (Treats stages as distinct) |
  | **Objective Reason-Tracking** | **Fail** (Internalist) | **Fail** (Internalist) | **Pass** (Can embed external reasons) | **Fail** (Internalist) |
  | **Second-Best Compliance** | **Pass** | **Pass** | **Fail** (Often assumes binding) | **Pass** |
  | **Synchronic Sovereignty** | **Pass** | **Pass** | **Fail** (Violates local judgment) | **Pass** |

  *\*Note on Resoluteness:* Resoluteness fails "Feasible Diachronic Coherence" *if* the agent lacks the psychological or institutional capacity to be resolute. However, for *grading* institutions, we often prescribe Resoluteness as a normative ideal they *ought* to build capacity for. If the grading is purely descriptive of capacity, Resoluteness fails. If normative of design, it passes.

  ### V. Summary Specification for Your Methodology

  To grade long-horizon decision procedures of bounded, partially persisting bodies, your normative methodology must specify:

  1.  **The Unit of Agency:** The institution (office), not the constituents (officeholders).
  2.  **The Standard of Success:** Diachronic Efficiency (avoidance of self-inflicted loss), not Synchronic Sovereignty.
  3.  **The Constraint Set:** Second-Best Feasibility (what can be achieved with leaky binding), not Ideal Feasibility.
  4.  **The Adjudication of Change:** Objective Reason-Tracking (was the reversal warranted by the state of the world?), not Revealed Preference.
  5.  **The Resolution of the Trilemma:** Endorse **Resoluteness** as the normative standard. The body is graded on its ability to maintain the optimal plan against future local judgment, subject to Emergency Override conditions.

  This specification excludes Myopic and Sophisticated frameworks as inadequate for *grading*, leaving only Resolute or Precommitment-based frameworks as viable candidates for high performance.
