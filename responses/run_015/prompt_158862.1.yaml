  **Overall**
  Callum is more right overall, specifically about the nature of the harm suffered by Amara. He successfully identifies that the injury is epistemic (to her status as a knower) rather than merely practical, and he manages to salvage the concept of testimonial injustice from Nadia's objection about individual prejudice by introducing the idea of structural contamination. Nadia is right to worry about diluting the concept, but her insistence on individual blame and her misclassification of the case as hermeneutical undermine her position. Callum wins because he adapts the framework to fit the structural reality of the school, whereas Nadia tries to force the reality to fit a narrower framework.

  **What both are missing**
  Neither of them distinguishes clearly between *blame* and *responsibility*. Nadia assumes that if the Head of Year isn't to blame (because he isn't prejudiced), he bears no responsibility for the injustice. Callum assumes that if there is responsibility, there must be a specific type of injustice labelled 'testimonial'. The missing question is whether an individual can be responsible for rectifying an epistemic wrong they did not personally create, without necessarily being the villain of the piece. This distinction would allow Nadia to keep her definition of prejudice while accepting Callum's conclusion about the Head of Year's duty to act.

  **The hinge**
  The single feature doing the most work is the status of the 'log' (the record of past complaints). If the log is neutral evidence, Nadia's Move (2) stands and Callum's case collapses into ordinary statistical reasoning. If the log is tainted, as Callum argues in Move (3), then Nadia's defence of the Head of Year's rationality fails because the rationality is built on corrupted data. If you remove the claim about the log's contamination, the verdict in (1) becomes clearly mistaken (as it would rely on unproven prejudice) and the verdict in (5) becomes half right (as the 'tax' would appear to be mere bureaucratic procedure rather than structural injustice).
