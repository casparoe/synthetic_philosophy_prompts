answer: |-
  # PROTOCOL FOR EVALUATING DIAGNOSTIC REVISIONS: THE LOOPING EFFECT AUDIT

  **Purpose:** To distinguish between genuine shifts in population health and artifacts generated by the interaction between diagnostic categories and the people classified (looping effects).
  **Users:** Clinicians and Epidemiologists.
  **Constraint:** This protocol does not determine moral value (harm/benefit); it determines stability and origin of the observed phenomenon.

  ---

  ## PART I: THE DECISION PROCEDURE

  ### Step 1: The Institutional Incentive Check
  **Question:** Is the observed change in prevalence or symptom presentation temporally correlated with a change in reimbursement policies, legal protections, or resource allocation tied to this specific code?

  *   **Sufficient Answer to Proceed:** Data shows no correlation between policy changes and prevalence shifts, OR the correlation is accounted for in the statistical model.
  *   **Stop Point (Recommendation Against Change):** If the prevalence shift is >50% explained by new incentives (e.g., insurance pays for Condition X but not Condition Y, and diagnoses of X spike immediately). Proceed only if clinical justification overrides this artifact.
  *   **Value Judgment Point:** None. This is an empirical correlation check.
  *   **Failure Condition (False Negative):** If an incentive change is covert or informal (e.g., unwritten ward culture) and not captured in policy documents, the procedure will fail to detect the loop.

  ### Step 2: The Self-Concept & Behavioral Script Check
  **Question:** Do patients classified under the proposed criteria demonstrate knowledge of the diagnostic criteria prior to assessment, and does their reported symptomatology mirror the public-facing definition of the disorder?

  *   **Sufficient Answer to Proceed:** Patients report symptoms that are private, physiological, or inconsistent with public descriptions of the disorder.
  *   **Stop Point (Recommendation Against Change):** If patient narratives closely match diagnostic checklists found in public media or advocacy materials *before* clinical confirmation, suggesting the diagnosis is being performed rather than discovered.
  *   **Value Judgment Point:** None. This assesses the source of the symptom report.
  *   **Failure Condition (False Negative):** High health literacy patients may accurately report genuine biological symptoms that happen to match public descriptions. The procedure may falsely flag genuine insight as looping.

  ### Step 3: The Resistance and Redefinition Check
  **Question:** Is the proposed change driven by advocacy groups or patient communities seeking to expand/contract the category for identity purposes, rather than by clinical outcome data?

  *   **Sufficient Answer to Proceed:** The proposal originates from clinical outcome data (e.g., treatment response, mortality) independent of community lobbying.
  *   **Stop Point (Recommendation Against Change):** If the primary evidence for the change is testimonial data from identity groups asserting that the old criteria "did not fit" their experience, without accompanying biomarker or longitudinal stability data.
  *   **Value Judgment Point:** **Required.** If the community argues the old criteria were stigmatizing, a **Patient Advocacy Liaison** and the **Ethics Subcommittee Chair** must sign off. They must weigh epistemic stability against social justice.
  *   **Failure Condition (False Negative):** If a patient community correctly identifies a biological reality that the medical establishment has missed (e.g., historical examples of marginalized groups defining their own pain), the procedure may incorrectly flag this as mere identity politics.

  ### Step 4: The Counterfactual Stability Check
  **Question:** If the diagnostic label were withheld from the patient and the treating institution, would the behavioral trajectory or symptom severity remain statistically indistinguishable?

  *   **Sufficient Answer to Proceed:** Longitudinal data from blinded settings or historical precedents where the label was absent shows similar trajectories.
  *   **Stop Point (Recommendation Against Change):** If the condition remits or radically alters when the label is unknown (indicating the label is the active agent of the condition's persistence).
  *   **Value Judgment Point:** None. This is a test of causal independence.
  *   **Failure Condition (False Negative):** Some genuine biological conditions are exacerbated by stress; knowing a diagnosis might reduce stress and improve outcomes (therapeutic looping). The procedure flags this as instability, potentially discarding a useful therapeutic tool.

  ### Step 5: The Utility vs. Ontology Sign-Off
  **Question:** Given the identified looping effects, does the utility of the classification (access to care, reduced stigma, research funding) outweigh the loss of descriptive stability?

  *   **Sufficient Answer to Proceed:** The Working Group votes that the pragmatic benefits exceed the epistemic costs.
  *   **Stop Point (Recommendation Against Change):** The Working Group votes that the classification is too unstable to support research or long-term treatment planning.
  *   **Value Judgment Point:** **Required.** This is the final gate. **Committee Chair** and **Lead Epidemiologist** must sign off. This acknowledges that the category is being adopted as a *tool* rather than a *truth*.
  *   **Failure Condition (False Negative):** The group may prioritize short-term utility over long-term scientific validity, cementing a transient social phenomenon into a permanent medical fact.

  ---

  ## PART II: APPLICATION TO PROPOSALS

  ### Proposal 1: Lowering Age-of-Onset Threshold for Mood Disorder
  **Context:** Clinicians report encountering younger patients. These patients actively self-identify with the diagnosis via social media before assessment.

  *   **Step 1 (Incentives):** No major policy change regarding pediatric mood reimbursement. **Proceed.**
  *   **Step 2 (Self-Concept):** High correlation found. Adolescents present with symptoms matching TikTok/online checklists verbatim. **Stop Point Triggered.**
  *   **Step 3 (Resistance/Redefinition):** Driven by youth advocacy seeking validation for distress. **Value Judgment Required.** (Advocacy Liaison signs off: acknowledges distress is real, but category may be wrong).
  *   **Step 4 (Stability):** Blinded assessments show lower concordance than open assessments. The label amplifies the reporting.
  *   **Procedure Recommendation:** **Reject the criteria change.** The data suggests the "condition" is partially constituted by the availability of the label to that age group.
  *   **Outcome:** The group is advised to create a "Distress" code rather than a specific "Mood Disorder" code to avoid cementing the loop.

  ### Proposal 2: Narrowing Personality Disorder Criteria Post-De-institutionalization
  **Context:** Prevalence rates dropped sharply in jurisdictions that closed long-term asylums. Proposal suggests the disorder is rarer than thought; criteria should narrow to match new rates.

  *   **Step 1 (Incentives):** Strong correlation. The "institutional care" variable explains the prevalence drop. In the community, these individuals are not diagnosed, often becoming homeless or incarcerated instead. **Stop Point Triggered.**
  *   **Step 2 (Self-Concept):** N/A (Often diagnosed by observation, not self-report).
  *   **Step 3 (Resistance/Redefinition):** No patient advocacy; this is a provider-side statistical adjustment.
  *   **Step 4 (Stability):** The phenotype disappears when the institutional environment is removed. The "kind" of person was produced by the total institution.
  *   **Procedure Recommendation:** **Reject the criteria change.** Narrowing criteria treats an artifact of care settings as a refinement of pathology. The procedure demands maintaining broader criteria but adding a specifier for "Institutional Context."
  *   **Outcome:** The group recognizes the prevalence drop is not a discovery of truth, but a displacement of the population.

  ### Proposal 3: The Conflict Case (Severe Burnout vs. Depressive Episode)
  **Context:** Proposal to codify "Severe Burnout" as a distinct medical entity to allow paid medical leave. Clinicians intuitively feel this helps patients escape toxic work environments.

  *   **Step 1 (Incentives):** High correlation. The code is sought specifically for leave eligibility. **Warning Flag.**
  *   **Step 2 (Self-Concept):** Patients adopt the "burnout" identity to distinguish themselves from "depression" (less stigmatizing). **Warning Flag.**
  *   **Step 3 (Resistance/Redefinition):** Driven by labor groups and clinicians wanting to validate workplace harm. **Value Judgment Required.**
  *   **Step 4 (Stability):** Symptoms remit upon removal from work, regardless of treatment. The condition is situationally locked.
  *   **Step 5 (Utility vs. Ontology):**
      *   **Procedure Demand:** The procedure flags this as a highly unstable category driven by social context and incentives. It recommends **against** codification as a stable psychiatric *disorder*, suggesting a Z-code (factor influencing health) instead.
      *   **Clinical Intuition:** Clinicians argue, "If we don't give them the medical code, they get no leave, they crash, and they get worse. The loop is therapeutic."
      *   **The Disagreement:** The procedure prioritizes **ontological stability** (is this a consistent kind of person?). The clinicians prioritize **pragmatic welfare** (does this label unlock resources?).
      *   **Resolution:** The procedure requires the **Committee Chair** to sign off on adopting a "Z-code" status. This acknowledges the looping effect (the label creates the eligibility) without falsely claiming it is a biological disease entity. The intuition is overruled on the *nature* of the diagnosis, but accommodated on the *access* to care.

  ---

  ## PART III: LIMITATIONS AND PHILOSOPHICAL JUNCTURES

  ### What the Procedure Cannot Determine
  This procedure is incapable of determining whether altering patient identity through reclassification is **harmful or beneficial**.
  *   It can detect that a diagnosis changes how a patient acts (Step 2).
  *   It *cannot* calculate if that change is a "liberation" (e.g., accepting a neurodivergent identity) or a "confinement" (e.g., adopting a chronic sick role).
  *   Hacking's looping effects are descriptive; they describe the mechanism of change, not the moral valence. A false positive diagnosis that grants a disabled person financial security is a "looping artifact" by this protocol's standards, but ethically defensible. The protocol will flag it as epistemically unstable, but it remains silent on whether that instability is a price worth paying.

  ### The Specific Juncture of Philosophical Disagreement
  The disagreement is not empirical; it is located exclusively at **Step 5: The Utility vs. Ontology Sign-Off.**

  *   **Empirical Agreement:** Both the philosophers (via the protocol) and the clinicians agree on the facts: the category is unstable, influenced by incentives, and alters patient behavior.
  *   **Philosophical Divergence:**
      *   **The Protocol's Stance:** Implicitly values **Realism**. It assumes that diagnostic categories *should* track stable underlying features of the world. If they don't, they are suspect.
      *   **The Clinician's Stance:** Implicitly values **Pragmatism**. It assumes diagnostic categories are *tools* for intervention. If a looping effect produces a better outcome (e.g., patient gets rest, recovers), the "truth" of the category is secondary.

  When the procedure recommends against a change due to looping, but clinicians insist on it for patient welfare, the conflict is not about data. It is a conflict between **Scientific Integrity** (do not label what you cannot stably define) and **Care Ethics** (use whatever label alleviates suffering). The protocol forces this conflict into the open at Step 5, requiring the Committee Chair to acknowledge that they are choosing a tool over a truth, or vice versa.
