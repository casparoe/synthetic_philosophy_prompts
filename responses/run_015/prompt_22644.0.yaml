answer: |-
  This conflation is endemic in the literature, and it is excellent that your working group is addressing it head-on. As a philosopher of computation, distinguishing these two theses is crucial because they operate in different modal registers: one is conceptual/mathematical, the other is empirical/physical.

  Here is a precise comparison of the **Ordinary Church-Turing Thesis (CTT-O)** and the **Physical Church-Turing Thesis (CTT-P)**, structured around the logical independence, epistemic status, and the specific implications of quantum computation.

  ### 1. Definitions and Scope

  **The Ordinary Church-Turing Thesis (CTT-O)**
  *   **Formulation:** Every effectively calculable function is Turing-computable.
  *   **Domain:** The space of *algorithms* or *effective procedures*. It concerns what a human computer (following strict rules with paper and pencil) can compute.
  *   **Nature:** It is a proposal to identify a vague intuitive notion ("effective calculability") with a precise mathematical formalism (Turing computability/recursive functions).

  **The Physical Church-Turing Thesis (CTT-P)**
  *   **Formulation:** Every function that is physically computable (by any physical system in the universe) is Turing-computable. (Alternatively: Any physical process can be simulated by a Turing Machine).
  *   **Domain:** The space of *physical systems*. It concerns the computational capacity of nature itself.
  *   **Nature:** It is an empirical hypothesis about the laws of physics.

  ### 2. How Each Claim Goes Beyond the Other

  The two theses are logically independent. Neither strictly entails the other, though they are often assumed to travel together.

  **How CTT-P goes beyond CTT-O:**
  CTT-P extends the domain of computation from *human symbolic manipulation* to *arbitrary physical processes*.
  *   CTT-O limits itself to discrete, step-by-step procedures that a human can survey.
  *   CTT-P claims that even if a physical system operates via continuous variables, quantum superposition, or relativistic spacetime geometries that no human could replicate with paper and pencil, it still cannot compute a non-Turing-computable function.
  *   **The Gap:** It is logically possible that CTT-O is true (humans are limited to TMs) but CTT-P is false (the universe contains "oracles" or hypercomputational processes that humans cannot access or replicate).

  **How CTT-O goes beyond CTT-P:**
  This direction is subtler. CTT-O makes a claim about the *concept* of an algorithm that CTT-P does not.
  *   CTT-O asserts that the *meaning* of "effective procedure" is exhausted by Turing computability. It is a claim about mathematical epistemology.
  *   CTT-P is silent on what a human can compute; it only restricts what nature can do.
  *   **The Gap:** It is logically possible that CTT-P is true (nature is Turing-bound) but CTT-O is false (perhaps the intuitive notion of "effective calculability" is broader than Turing computability, even if physics prevents us from realizing it). However, this is rarely defended, as CTT-O is usually grounded in the finiteness of human cognitive states (Gandy 1980).

  ### 3. Epistemic Status and Refutation

  Philosophers treat these differently because one is a conceptual analysis and the other is a law of nature.

  **CTT-O: Conceptual or Mathematical Necessity?**
  *   **Status:** Many philosophers (e.g., Olszewski, Shagrir) argue CTT-O is not an empirical hypothesis but a *definition* or a conceptual truth derived from the analysis of "effective procedure." If you define an effective procedure as one involving finite, local, deterministic operations, CTT-O follows analytically.
  *   **Refutation:** To refute CTT-O, one would need to demonstrate a procedure that is intuitively "effective" (mechanical, finite, certain) yet computes a non-recursive function. Since "effective" is usually defined *by* Turing computability in modern logic, refutation is difficult. It would require a conceptual revolution in what we mean by "algorithm."

  **CTT-P: Empirical Conjecture**
  *   **Status:** CTT-P is a contingent claim about our universe (Deutsch 1985; Pitowsky 1990). It depends on the actual laws of physics.
  *   **Refutation:** To refute CTT-P, one must construct (or prove the possibility of) a **hypercomputer**: a physical device that solves the Halting Problem or computes a non-recursive function.
      *   *Example:* If General Relativity permits Malament-Hogarth spacetimes (where an observer can witness an infinite number of events in finite proper time), one could theoretically build a computer that solves the Halting Problem. If such spacetimes exist physically, CTT-P is false, even if CTT-O remains true (since humans cannot travel into such spacetimes to run the algorithm).

  ### 4. The Bearing of Quantum Computation

  This is the critical point for your working group. The confusion often arises from conflating *computability* (what can be computed) with *complexity* (how efficiently it can be computed).

  **Does Quantum Computing Refute CTT-O?**
  *   **No.** Quantum algorithms (e.g., Shor's algorithm) are still algorithms. They are finite sequences of instructions operating on quantum states. They are Turing-computable. A classical TM can simulate a quantum computer; it just takes exponentially longer. The set of computable functions remains the recursive functions.

  **Does Quantum Computing Refute CTT-P?**
  *   **Standard View: No.** Standard quantum mechanics (unitary evolution on finite-dimensional Hilbert spaces) does not allow for hypercomputation. A quantum computer is a physical system that respects CTT-P. It computes the same *functions* as a classical computer, merely with different *complexity* (BQP vs. P/NP).
  *   **Speculative View: Maybe.** Some philosophers and physicists (e.g., Tien Kieu, using the Quantum Adiabatic Algorithm for Hilbert's Tenth Problem) have proposed models where quantum systems might decide undecidable problems. However, these models typically require infinite precision or infinite energy, which most physicists regard as physically unrealizable.
  *   **The Nuance:** If a future theory of Quantum Gravity allows for discrete spacetime structures that function as hypercomputers, CTT-P would be threatened. But current, standard quantum computation **preserves** CTT-P.

  ### 5. Summary for the Working Group

  When participating in your group, you can clarify the discussion by applying this filter:

  1.  **Is the claim about efficiency or computability?**
      *   If the claim is "Quantum computers solve problems classical computers can't," ask: "Do you mean *in polynomial time* (Complexity) or *at all* (Computability)?"
      *   If they mean *in polynomial time*, this bears on **Complexity Theory**, not CTT-O or CTT-P.
      *   If they mean *at all*, they are making a claim about **CTT-P**.

  2.  **Is the claim about humans or nature?**
      *   If the discussion is about what an agent can follow as a rule, it concerns **CTT-O**.
      *   If the discussion is about what a physical system (black hole, quantum field) can evolve to produce, it concerns **CTT-P**.

  3.  **The "Deutsch Principle":**
      *   David Deutsch (1985) explicitly formulated CTT-P to replace CTT-O as the foundational principle of computation. He argued CTT-O is too anthropocentric. For your group, it is vital to note that accepting Deutsch's view means treating CTT-P as the primary empirical thesis, while viewing CTT-O as a derivative claim about human limitations within that physics.

  **Conclusion:**
  The existence of quantum computers does **not** refute CTT-O (quantum algorithms are still effective procedures) and, under standard interpretations, does **not** refute CTT-P (quantum systems are simulable by TMs). The conflation arises because quantum computation challenges the *efficiency* thesis (that P = BQP), which is often mistakenly heard as a challenge to the *computability* thesis. CTT-P remains an open empirical question, contingent on the ultimate laws of physics, whereas CTT-O remains a robust conceptual analysis of the algorithmic.
