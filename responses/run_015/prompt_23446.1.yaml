prompt: |-
  I was discussing this with a colleague of mine last week, and we ended up more or less disagreeing, so I want to get it straight in my own head before I put it in front of students. I'm preparing a lecture for my grad seminar on the philosophy of probability, and I keep going back and forth on how to present the relationship between the Dempster–Shafer theory of belief functions and the more general machinery of imprecise probabilities (lower and upper probabilities, or equivalently sets of probability measures / credal sets). I want to get the conceptual picture right before I comit to a handout, so I'd be grateful for a careful comparison the two.

  First, I want to nail down the exact relationship: is Dempster–Shafer really just a special case of imprecise probability, or are they genuinely different frameworks? I have a vague sense that every belief function induces a lower probability, and that the distinguishing feature is some kind of monotonicity condition (2-monotonicity? I could be misremembering), but I'd like that spelled out precisely. And I'd like to understand what's actually lost when you move from belief functions to arbitrary credal sets — is it just expressive power, or do you also lose some of the nice structural or computational properties that make DS attractive to the people who use it?

  Second, and this is the part I find most philosophically interesting: in the precise Bayesian case, once you observe an event B (with P(B) > 0), the posterior P(·|B) is uniquely pinned down by Bayes' rule, so there's no room for disagreement about "the" update. In the imprecise case, I'm told there's a real "conditioning problem" — that the prior lower probability doesn't uniquely determine the conditional lower probability, and that the "natural extension" is a conservative choice among many coherent ones. Can you explain why this ambiguity arises, what the natural extension actually does, and why the problem is more acute in the imprecise case than in the precise one? I'm especially interested in whether this is just a technical nuisance or whether it reflects a genuine philosophical difference about what it means to have "a" rational belief state and to update it.
