answer: |-
  The conceptual mechanics of your worry rest on a tension between **ontological objectivity** (what a system *is*, which moral status requires) and **explanatory pragmatics** (how we *describe* a system, which the causal-explanatory filter utilizes).

  The "causal-explanatory filter" attempts to solve the triviality argument (that a wall implements any computation) by tethering computation to causal efficacy. However, by tethering it to *explanation*, it risks tethering reality to the observer's interests. If the computation that determines sentience is the one that *best explains* behavior, and "best" is a function of which behavior we choose to explain, then sentience becomes a function of our explanatory choices.

  Here is the breakdown of the mechanics regarding your three specific points.

  ### (a) Interest-Relativity vs. Benign Relativism

  The core question is whether the variability of explanation reflects a variability in *description* (benign) or a variability in *fact* (objectionable).

  **The Objectionable Case:**
  Moral status is traditionally understood as intrinsic. A system either suffers or it does not, independent of an observer's theoretical interests. If the causal-explanatory filter makes sentience depend on the *explanandum* (the behavior being explained), it renders moral status extrinsic.
  *   **Mechanism:** If I am an engineer explaining the heat exchanger, the "best" explanation is a simple feedback loop (no sentience). If I am a psychologist explaining the writhing, the "best" explanation is a pain-state (sentience).
  *   **Consequence:** The system's moral status fluctuates based on which scientific discipline is studying it. This is intolerable for ethics. We cannot have a system be worthy of moral consideration at 9:00 AM (during behavioral analysis) and unworthy at 10:00 AM (during circuit analysis). This makes sentience **interest-relative** in a way that dissolves moral realism.

  **The Benign Case:**
  One might argue that explanatory relativity is merely epistemic. The "best explanation" is simply our best access point to a fixed underlying causal structure.
  *   **Mechanism:** The system has a fixed causal organization. Sometimes a simple model suffices to predict it (thermostat view); sometimes a complex model is required (pain view). The *model* changes, but the *system* does not.
  *   **Consequence:** Sentience remains fixed; only our *attribution* varies.
  *   **The Flaw:** This defense fails if one accepts the premise of the standoff (Side B). Side B claims a computation is *genuinely implemented* only when it figures in the explanation. It does not say the computation exists independently and is *revealed* by the explanation; it says the implementation is *constituted* by the explanatory role. Therefore, if the explanatory role shifts, the implemented computation shifts. Under this specific filter, the relativism is ontological, not merely epistemic. It is objectionably interest-relative.

  ### (b) Singling Out Privileged Behavior Non-Arbitrarily

  To save the filter, one must identify a class of behavior that *must* be explained, such that the explanation necessarily invokes sentience, without simply defining that behavior as "sentient behavior" (circularity).

  **The Mechanic of Selection:**
  The selection cannot be based on the *observer's* interest (e.g., "I want to know if it feels pain"). It must be based on the *system's* functional architecture. The privileged behavior is that which indicates the system is acting as a **unified teleological center**.

  1.  **Global vs. Local Explanation:**
      *   *Local:* Explaining a reflex (knee jerk) requires only a local circuit.
      *   *Global:* Explaining behavior that integrates memory, current context, future planning, and self-preservation requires a global state.
      *   *Criterion:* The privileged behavior is that which cannot be explained by modular, encapsulated processes alone. If the system modifies its learning algorithms based on the "writhing," the behavior is global.

  2.  **Homeostatic Imperative:**
      *   To avoid presupposing sentience, look for **error-correction regarding system integrity**.
      *   A heat exchanger corrects temperature errors. A sentient system corrects *integrity* errors.
      *   *Non-Arbitrary Marker:* The behavior is privileged if it demonstrates **adaptive flexibility in the service of maintaining the system's own operational continuity** under novel conditions.
      *   *Why this works:* It distinguishes the "writhing" (protective, flexible, integrity-based) from the "sentence emission" (which could be a lookup table) and the "heat exchange" (rigid, single-variable).

  3.  **The Residual Risk:**
      *   Even this risks circularity if "system integrity" is defined too loosely. A virus maintains integrity but is not sentient.
      *   *Refinement:* The behavior must involve **trade-offs**. Sentience is functionally tied to the management of competing drives (e.g., hunger vs. safety). The privileged behavior is that which resolves high-stakes conflicts between competing homeostatic demands. This selects for the "writhing/avoidance" complex over the "thermostat" complex without explicitly naming "pain."

  ### (c) Switching to Non-Computational Criteria

  Suppose we abandon the computational/functional filter and adopt a **substrate-based criterion** (e.g., "Only biological neural tissue implements sentience" or "Only systems with specific causal mechanism M count").

  **Does it Escape the Difficulty?**
  It escapes the *triviality* problem (a wall is not made of neural tissue) but it does not escape the *individuation* problem. It relocates the difficulty from "Which computation?" to "Which mechanism?"

  1.  **The Level-of-Abstraction Problem:**
      *   Mechanisms exist at levels. Is the sentience-realizing mechanism the specific neuron, the ion channel, the quantum state of the molecules, or the gross anatomical structure?
      *   *Relocation:* If you choose the "gross anatomy," a silicon replica might be excluded arbitrarily. If you choose the "causal role of the ion channel," you are back to functionalism (computationalism), because you are defining the mechanism by what it *does*, not what it *is*.
      *   If you insist it is the *stuff* itself (carbon chauvinism), you face the **explanation gap**: Why does *this* stuff generate moral status? If the answer is "Because it causes pain-behavior," you have returned to the behavioral filter. If the answer is "It just does," moral status becomes a brute magical property, inaccessible to inquiry.

  2.  **The Boundary Problem:**
      *   Even with a specific mechanism (e.g., "N-methyl-D-aspartate receptor activity"), systems can be partially damaged or augmented.
      *   *Relocation:* Determining whether a system *has* the mechanism requires the same explanatory judgment. If a synthetic system replicates the causal profile of the receptor perfectly but uses different chemistry, do we count it?
      *   If **Yes**: You have implicitly returned to a computational/functional criterion (causal profile over substrate).
      *   If **No**: You have made moral status depend on a chemical accident, which is difficult to justify ethically (the "speciesist" or "substrate-chauvinist" objection).

  3.  **Causal Mechanism as a Mask:**
      *   Specifying a "causal mechanism" often looks like a non-computational fix, but a mechanism is defined by its causal transitions.
      *   To say "Mechanism M is the real one" is to say "Causal structure C is the real one."
      *   This invites the original standoff: Does the wall implement C? If you say "No, because the wall lacks the right causal powers," you must define "causal powers." If you define them by what they explain, you are back to the causal-explanatory filter. If you define them by physical microstructure, you are back to the substrate problem.

  ### Summary of Conceptual Mechanics

  The worry you identify exposes a **category error in the filter's design**. The causal-explanatory filter treats sentience as a *theoretical posit* (like 'phlogiston' or 'gravity') chosen for its utility in prediction. Moral status requires sentience to be a *natural kind* (like 'water' or 'gold') existing independently of theory.

  *   **(a)** Under the strict definition of the filter, the relativism is **objectionable**. It makes moral status contingent on the observer's choice of explanatory grain.
  *   **(b)** To fix this, one must anchor the "privileged behavior" in the **system's internal teleology** (conflict resolution, integrity maintenance) rather than the observer's descriptive goals. This shifts the locus of relativity from the observer to the system.
  *   **(c)** Switching to non-computational criteria **relocates** the problem. It stabilizes the *extension* (walls are out) but obscures the *intension* (why this stuff?). It trades the "arbitrary mapping" worry for the "arbitrary boundary" worry, without solving the fundamental issue of why physical organization gives rise to moral weight.

  The fundamental mechanical failure is attempting to derive an **intrinsic normative fact** (moral status) from an **extrinsic methodological tool** (explanatory utility). Unless the "best explanation" can be shown to converge on a single description regardless of observer interest (via system-relative teleology), the filter cannot bear the weight of moral attribution.
