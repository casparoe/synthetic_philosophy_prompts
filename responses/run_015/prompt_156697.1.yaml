      *   *Empirical?* No, they explicitly state they agree on the facts (who, what, when).
      *   *Verbal/Semantic?* Partly. They are using the word "corruption" to do different work. One sees it as a violation of a specific bureaucratic ideal; the other sees it as a violation of *any* public duty vs. private gain distinction.
      *   *Normative/Foundational?* Yes. This is the core. It's about the *legitimacy* of social bonds in public office. Is an official a neutral arbiter (Weberian ideal) or a node in a social network (Communitarian/Relational view)?
      *   *Institutional?* Yes. It's about how institutions *should* function vs. how they *do* function.

