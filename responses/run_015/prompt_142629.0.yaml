answer: |-
  ### Desiderata for a Theory of Pramāṇas

  To function as a tool for classifying new sources of belief and guiding action, a theory of *pramāṇas* must satisfy the following requirements. Each is anchored in the stipulated cases and marked as either a non-negotiable condition for the theory's stated purpose or a local preference reflecting specific metaphysical commitments.

  1.  **Mechanism Individuation [Non-Negotiable]**
      *   **Case:** *The Remote Prosthesis.*
      *   **Requirement:** The theory must provide identity conditions for a *pramāṇa* based on the causal mechanism producing the cognition, not merely the phenomenological state or the truth of the content.
      *   **Consideration:** If the prosthesis produces a state type-identical to vision but lacks sense–object contact, classifying it as "perception" solely on phenomenological grounds erases the causal distinction required to evaluate reliability in novel contexts. The theory must distinguish between *what* is known and *how* it is known to determine if the mechanism is trustworthy for future action.

  2.  **Token-Novelties of Cognition [Non-Negotiable]**
      *   **Case:** *Rediscovery.*
      *   **Requirement:** The novelty condition must attach to the token event of cognition, not solely to the propositional content.
      *   **Consideration:** If novelty applied only to content, the second discovery of the fire on the hill would not be a *pramā*, rendering the *pramāṇa* useless for re-establishing lost knowledge. To serve as a tool for an agent regaining competence, the theory must count the new cognitive event as a fresh deliverance, even if the content is historically old for that subject.

  3.  **Ontological Neutrality of Content [Non-Negotiable]**
      *   **Case:** *Purely Negative Competence.*
      *   **Requirement:** A *pramāṇa* must be capable of delivering veridical cognition of absences without requiring the postulation of a distinct ontological category of "non-existence" as the object.
      *   **Consideration:** An organism surviving via "no predator" signals acts on veridical information. If the theory requires a positive entity to serve as the object of every *pramā*, it cannot account for action-guiding negative knowledge. The instrument must be valid regardless of whether the content asserts presence or absence.

  4.  **Transmission Specification [Non-Negotiable]**
      *   **Case:** *Gettierized Testimony.*
      *   **Requirement:** The theory must explicitly state whether a *pramāṇa* generates truth de novo or transmits epistemic status from a prior source.
      *   **Consideration:** In the Gettier case, the hearer has a true belief from a sincere speaker, but the speaker lacks knowledge. If testimony is a generative *pramāṇa*, the hearer acquires a *pramā*; if it is transmissive, they do not. A theory intended to guide trust must resolve whether the hearer's warrant is independent of or dependent on the speaker's epistemic state.

  5.  **Threshold of Certainty [Non-Negotiable]**
      *   **Case:** *The Probabilistic Instrument.*
      *   **Requirement:** The theory must specify whether a *pramāṇa* requires token-infallibility (this specific output is true) or type-reliability (the mechanism is generally accurate).
      *   **Consideration:** If *pramā* requires truth, the instrument produces a *pramā* on the seven successful occasions but offers no *ex ante* marker to distinguish them from the three failures. For the theory to guide action, it must either admit a graded notion of warrant or explain how an agent can act on a mechanism known to be fallible without violating the truth condition.

  6.  **Subject Scalability [Local Preference]**
      *   **Case:** *Corporate Cognition.*
      *   **Requirement:** The theory must define whether the "subject" of a *pramāṇa* is restricted to a biological individual or can be a distributed system.
      *   **Consideration:** Classical accounts tie *pramāṇa* to an individual cognizer. However, institutional reliability emerges from procedures no single member holds. Accommodating this requires expanding the metaphysics of the subject. This is a local preference: a theory can remain individualistic if it treats corporate output as testimony to the individual, but it loses explanatory power regarding the source of the reliability.

  7.  **Principle of Demarcation [Non-Negotiable]**
      *   **Case:** *Demarcation.*
      *   **Requirement:** The theory must provide necessary and sufficient conditions for distinguishing one *pramāṇa* from another and for allowing confluence (multiple sources yielding the same fact).
      *   **Consideration:** Without identity conditions, a satellite image interpreted by a model cannot be classified. Is it perception (image), inference (model), or testimony (data transmission)? If domains are rigidly partitioned, hybrid cases fail. If confluence is permitted, the theory must explain whether the warrant aggregates or remains singular.

  8.  **Termination of Validation [Non-Negotiable]**
      *   **Case:** *The Regress of Extrinsic Validity.*
      *   **Requirement:** The theory must identify a stopping point for validation that does not rely on an infinite chain of further cognitions.
      *   **Consideration:** If every *pramāṇa* requires validation by another *pramāṇa*, action is paralyzed. The theory must locate intrinsic validity (the cognition is self-certifying) or practical validity (success in action counts as validation). If the latter, the theory must ensure this does not merely reduce epistemology to a theory of successful praxis without truth.

  ***

  ### I. Genuine Desiderata vs. Metaphysical Artifacts

  Many requirements standardly imposed on *pramāṇa* theory are artifacts of specific metaphysical programmes rather than functional necessities for a theory of knowledge sources.

  **Genuine Desiderata** are those required to meet the functional goal of classifying sources and guiding action. These include **Mechanism Individuation**, **Threshold of Certainty**, and **Termination of Validation**. Without these, the theory cannot distinguish a reliable instrument from a lucky guess, nor can it tell an agent when to stop deliberating and act. These are derived from the operational constraints of the cases provided (e.g., the Probabilistic Instrument and the Regress).

  **Metaphysical Artifacts** are constraints that serve a specific ontology rather than the epistemic tool. Examples include:
  *   **The Substance Self:** The demand that a *pramāṇa* operate only on a unitary, enduring substantial self (relevant to *Corporate Cognition*). This is a local preference; a functionalist or Buddhist no-self theory can accommodate sources of belief without a substantial subject.
  *   **Distinct Instrument-and-Result Structure:** The demand that every *pramāṇa* exhibit a separable instrument (*karaṇa*) and result (*phala*). In hybrid cases like the *Remote Prosthesis*, the instrument is a black box; insisting on a separable internal instrument may be impossible without distorting the mechanism.
  *   **Closed List Numerology:** The demand that the list be closed at exactly four (or two). This is an artifact of systematization. For a tool classifying *new* sources (BCIs, algorithms), the number must be open or defined by principles rather than enumeration.

  ### II. Incompatible Requirements

  There is a triad of requirements that cannot be jointly satisfied. You must abandon one to maintain consistency.

  1.  **Rigid Domain Partitioning:** Each *pramāṇa* operates on a distinct ontological domain (e.g., perception on sensibles, inference on universals/marks, testimony on meanings).
  2.  **Reduction of the List:** The *pramāṇas* can be reduced to two fundamental types (typically Perception and Inference).
  3.  **Accommodation of Hybrid Mechanisms:** The theory must classify novel, hybrid sources (like the *Remote Prosthesis* or *Satellite Image*) without distorting their operational description.

  **The Conflict:**
  If you maintain **Rigid Domain Partitioning** (1) and **Reduction** (2), you cannot accommodate **Hybrid Mechanisms** (3).
  *   *Reasoning:* The *Remote Prosthesis* yields sensory-like content (Perception domain) via a causal chain involving data transmission and processing (Inference/Testimony structure). If domains are rigid, it cannot be Perception (no sense-contact) and cannot be Inference (no reconstructible reasoning). If you reduce the list to two, you force it into one of these boxes, violating the operational description of the case. If you accommodate the hybrid accurately, you must either allow domain overlap (breaking Rigidity) or admit a third category (breaking Reduction).
  *   *Resolution:* To make the theory usable for modern technology, you must drop **Rigid Domain Partitioning**. Domains must be defined by functional role rather than ontological object, allowing a single fact to be accessed by overlapping mechanisms without forcing a false dichotomy.

  ### III. The Single Most Exclusionary Requirement

  The **Truth Condition (Infallibilism)** is the single requirement that excludes the most candidate theories.

  **Why:** The stipulation that a *pramā* must be *true* (and undefeated) means that a *pramāṇa* cannot, by definition, produce error. This excludes any fallibilist epistemology. In the context of the **Probabilistic Instrument**, a device that is 70% reliable cannot be a *pramāṇa* on a specific occasion unless the agent already knows the output is true. But if the agent already knows it is true, the instrument is redundant. This requirement renders the theory useless for *selecting* sources of belief in real-time, as validity can only be assessed retrospectively. It excludes all contemporary reliabilist accounts that define knowledge sources by high probability rather than guaranteed truth, and it excludes any account of scientific instrumentation where error is an inherent risk of the measurement process.

  ***

  ### Comparative Assessment

  The **four-source list** satisfies Demarcation and Transmission Specification well for traditional cases but fails Mechanism Individuation for the Remote Prosthesis, forcing awkward classifications of new tech. The **two-source reduction** succeeds in metaphysical economy but breaks down on Gettierized Testimony and Corporate Cognition, as it cannot distinguish the specific warrant generated by social or institutional mechanisms from raw inference. A **contemporary reliabilist account** handles the Probabilistic Instrument and Remote Prosthesis best by focusing on causal reliability, but it fails the Truth Condition and Termination of Validation, as it cannot guarantee truth on a token occasion or stop the regress without appealing to external statistical norms rather than internal cognitive authority. The Truth Condition is the filter that passes the classical lists but blocks the reliabilist; the Mechanism Individuation requirement is the filter that passes the reliabilist but blocks the classical reduction.
