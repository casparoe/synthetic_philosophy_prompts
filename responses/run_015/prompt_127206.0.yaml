answer: |-
  **Examination Question**

  **Course:** Scepticism and Common Sense (PHL402)
  **Time Allowed:** 90 Minutes
  **Texts:** G.E. Moore, *A Proof of the External World*; Descartes, *Meditations I & VI*.

  **Question:**

  Moore stipulates that a rigorous proof requires three conditions: (i) the premises must be different from the conclusion; (ii) the premises must be *known* to be true; and (iii) the conclusion must follow from the premises. Consider the following two cases involving a subject, Anna:

  1.  **Simulation Anna:** Anna has lived her entire life in a high-fidelity computer simulation. She has hands, which are simulated objects existing within the simulation's physics. She has never left the simulation.
  2.  **Feed Anna:** Anna is a brain in a vat. Her experiences are fed directly to her cortex. There are no hands, tables, or spatial objects in her reality, though her experience is subjectively identical to Simulation Anna's.

  In both cases, Anna asserts, "Here is a hand," and argues that therefore external objects exist.

  Moore claims he knows the premises of his proof better than anyone knows the premises of any argument leading to scepticism. A retired physicist suggests this is analogous to laboratory instrumentation: we trust calibration standards not because we have verified them against a 'true' reality, but because the practice of measurement terminates in trusted standards; this is bootstrapping, but not viciously circular.

  Critically evaluate Moore's proof in light of the Anna cases and the instrumentation analogy. Does the difference between Simulation Anna and Feed Anna show that the truth of the premises is doing the work, or does the identity of their experiences show that *epistemic status* is the only thing that matters? Is the physicist's analogy a charitable interpretation of Moore, or does it reveal a category mistake between being *entitled to trust* a premise and *knowing* it?

  ***

  **Model Answer**

  Moore's proof stands or falls on his second condition: that the premises are *known*. While the sceptic attacks the truth of the premises (perhaps you are dreaming), Moore reverses the burden, arguing that his knowledge of "Here is a hand" is more certain than the sceptic's premises required to doubt it. However, the Anna cases reveal a tension between truth and knowledge that Moore's formulation struggles to resolve.

  In the case of Simulation Anna, the premise "Here is a hand" is arguably true (there is a simulated hand external to her mind), and the conclusion "External objects exist" is true within her ontology. Yet, intuitively, Anna does not *know* she has hands, because her evidence is compatible with the Feed Anna scenario. Feed Anna's premise is false. Since their subjective evidence is identical, the difference in truth value between the two Annas cannot account for a difference in their epistemic justification. If Moore's proof relies merely on the premises being true, Simulation Anna succeeds and Feed Anna fails. But if the proof is meant to confer *knowledge*, Simulation Anna should fail just as Feed Anna does, because she cannot rule out the Feed hypothesis.

  This suggests that the truth of the premises (condition ii, part 1) is insufficient without the epistemic status (condition ii, part 2). Moore insists he *knows* the premises. The sceptic argues that to know them, one must first rule out the Feed scenario. Moore replies that he is more certain of the hand than of the logic required to doubt it. The Anna cases demonstrate that if "knowledge" requires ruling out subjectively indistinguishable sceptical hypotheses, Moore fails. If "knowledge" merely means being maximally certain, Moore succeeds, but he has changed the definition of knowledge to suit his conclusion.

  The physicist's instrumentation analogy illuminates this tension. In the lab, trusting a standard without external verification is indeed bootstrapping. However, scientists distinguish between *calibration* (internal consistency within a practice) and *truth* (correspondence to reality). The physicist suggests this bootstrapping is not vicious. Applied to Moore, this suggests he is claiming an *entitlement* to trust his senses, not Cartesian *knowledge*. If Moore is claiming entitlement, the analogy holds: we are entitled to assume an external world to engage in the practice of judging, just as we trust instruments to measure.

  However, this reveals a category mistake. Moore explicitly claims to *prove* the external world using premises he *knows*. Entitlement is not knowledge. If the physicist is right that Moore is merely describing a necessary trust required for practice (like calibration), then Moore has not satisfied his own second condition. He has shown that we must *act* as if we know, not that we *know*. The pressure falls squarely on the epistemic status of the premises, not their truth or the logical validity of the inference. The Anna cases show that truth can vary while evidence remains constant; therefore, evidence alone cannot secure the "knowledge" Moore requires. The instrumentation analogy saves Moore from absurdity only by downgrading his claim from "Proof" to "Pragmatic Necessity." Thus, the proof fails as a proof of knowledge, even if it succeeds as a description of why we cannot help but believe.

  ***

  **Marking Scheme (20 Marks)**

  **1. Moore's Three Conditions (3 Marks)**
  *   **Award:** Clear statement that premises must differ from conclusion, be *known*, and entail conclusion.
  *   **Common Error:** Listing the conditions but failing to emphasize that "Known" is the contentious condition (treating it as merely "True").

  **2. The Sceptical Objection (Circularity) (3 Marks)**
  *   **Award:** Explanation that the sceptic claims Moore assumes the external world to prove the external world (begging the question).
  *   **Common Error:** Stating Moore begs the question without explaining *why* (i.e., that perceptual knowledge presupposes the conclusion).

  **3. Moore's Reversal of Certainty (4 Marks)**
  *   **Award:** Articulation of Moore's claim: certainty of common sense > certainty of sceptical assumptions.
  *   **Common Error:** Treating this as a psychological claim about feeling sure, rather than an epistemic claim about the grounds of knowledge.

  **4. Application of Anna Cases (Truth vs. Status) (4 Marks)**
  *   **Award:** Recognition that Simulation Anna has true premises but (likely) no knowledge, proving truth is insufficient without epistemic access.
  *   **Common Error:** Arguing the cases are identical because experience is identical, thereby ignoring the truth-value distinction the question asks them to analyze.

  **5. Evaluation of Instrumentation Analogy (4 Marks)**
  *   **Award:** Distinction drawn between *entitlement/trust* (calibration) and *knowledge* (proof). Acknowledgement that the analogy saves Moore only by changing his claim.
  *   **Common Error:** Accepting the analogy uncritically as a perfect defence, missing the category mistake between engineering trust and philosophical knowledge.

  **6. Synthesis: Where the Pressure Lies (2 Marks)**
  *   **Award:** Conclusion that the argument fails on epistemic status (knowing), not logic or truth.
  *   **Common Error:** Concluding the argument fails because the logic is invalid (condition iii) rather than the epistemic status (condition ii).

  ***

  **Closing Note: Distinguishing First-Class from Upper-Second**

  An upper-second answer will typically possess all the vocabulary: it will list Moore's conditions, mention the sceptic, describe the Anna cases, and reference the calibration analogy. It will be technically accurate but structurally passive. It will treat the Anna cases as a "counter-example" to be described rather than a tool to dissect the concept of knowledge.

  A first-class answer is distinguished by locating the **crux**: the conflict between Moore's definition of "proof" (which demands knowledge) and the physicist's description of "trust" (which demands only coherence). The first-class candidate will use the Anna cases to demonstrate that *truth* is irrelevant to the subject's justification (since Feed and Simulation Anna have identical justification but different truths), thereby forcing the conclusion that Moore's second condition is the breaking point. They will not merely say the analogy is "good" or "bad"; they will identify that the analogy works only if Moore is wrong about what he is doing. Penalise answers that discuss the *truth* of the external world extensively; reward answers that discuss the *status of the claim* to know it.
