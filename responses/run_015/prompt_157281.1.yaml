  3.  **Drafting the Desiderata Table:**
      *   *D1: State/Cause Distinction.* Must distinguish error about *having* a state vs. *why* one has it. (Nisbett & Wilson style).
      *   *D2: Load-Dependent Degradation.* Error rates shouldn't be random; they should correlate with cognitive load (working memory).
      *   *D3: Revision Resistance.* Some errors are immune to counter-evidence (the galvanic skin response case).
      *   *D4: Phenomenal/Access Gap.* Must explain why it *feels* direct even when it's inferred.
      *   *D5: Temporal Granularity.* Introspection isn't instantaneous; there's a lag/buffer.
      *   *D6: Authority vs. Infallibility.* Must grant some privilege to the first-person without making it magic.

  4.  **Identifying the "Killer" Desideratum:**
      *   What kills Naive Transparency? *Revision Resistance (D3).* If I see my skin conductance spike but still feel calm, and *insist* I'm calm, transparency says I should see the anxiety.
      *   What kills Behaviorism? *Phenomenal/Access Gap (D4).* Behaviorism denies the inner state matters, but the report exists.
      *   What kills Strong Infallibility? *Load-Dependent Degradation (D2).*
      *   *Selection:* **Revision Resistance under Counter-Evidence** is probably the sharpest knife. It kills the idea that introspection is a "direct perception" that updates automatically.

