  *   If authority is *epistemic* (I know best), correctability is possible (I was wrong).
  *   If authority is *constitutive* (My saying it makes it so), correctability is impossible.
  *   Most theories want epistemic privilege. The contradiction arises if you demand *infallibility* (a subset of authority) in low load but *fallibility* in high load without a clear mechanism for the switch. I need to be precise here. The real tension is between **Phenomenal Immediacy** (it feels direct) and **Inferential Latency** (it acts like a slow calculation).

  Let's stick to the user's hunch but refine it: The tension is between **First-Person Privilege** (the report sets the boundary of the mental) and **Third-Person Ontology** (the brain state sets the boundary of the mental).

