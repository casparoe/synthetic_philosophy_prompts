answer: |-
  **Project Title:** The Enablement Gap: Reconstructing Subsidiarity as Dynamic Capacity Building

  **Research Question and Conceptual Framing**
  This project asks: Does incorporating a counterfactual-capacity horizon into subsidiarity analysis resolve the tension between abstention and enablement readings, and does it produce a determinate allocation of competence across four federal systems? I frame the contrast not as two principles in tension, but as two operational senses of a single principle. The dominant "abstention reading" treats subsidiarity as a static constraint: the higher level must stay off unless the lower level fails. The original "enablement reading" treats it as a dynamic investment: the higher level must act to ensure the lower level *can* succeed. The research question is determinate because it tests whether a specific modification to the subsidiarity test—the counterfactual-capacity test—yields consistent allocation results where current tests yield ambiguity. If the modified test produces a stable answer across different constitutional architectures, the ambiguity is doctrinal, not structural. If it produces divergent answers, the ambiguity is inherent to the systems themselves.

  **Why Existing Answers Leave It Open**
  Current legal tests fail to capture the dynamic nature of capacity. The EU's "better achieved" test and Germany's *Erforderlichkeit* (necessity) requirement assess capacity at a single point in time: now. This creates a self-fulfilling prophecy. If competences have drifted upward over decades, leaving lower units hollowed out of staff, expertise, and revenue, a static test mandates further centralization because the lower unit objectively cannot perform the task today. The abstention reading locks in this incapacity. Conversely, political process theories argue federalism is protected by representation rather than doctrine, but this ignores cases where lower units are administratively incapable of leveraging political voice. Finally, viewing subsidiarity as merely procedural or a burden-of-proof rule avoids the substantive question of what capacity actually means. By ignoring the time horizon required to build capacity, existing doctrines render the principle indeterminate. They cannot distinguish between a lower unit that is permanently incompetent and one that is temporarily depleted due to prior centralization. This project isolates that temporal variable.

  **Methodology and Timeline**
  This project requires nine months of part-time work (six to eight hours weekly). I reject two obvious alternatives. A full four-system legal comparison is too broad for this timeframe and would dilute conceptual precision. A purely normative argument from first principles would lack traction with legal practitioners. Instead, I will use doctrinal analysis combined with conceptual modeling. I will work in English and slow German, relying on publicly available constitutional texts, court judgments, and secondary literature without archives, interviews, or travel.

  *Months 1–2:* Conceptual groundwork. I will define the abstention and enablement readings precisely and formalize the counterfactual-capacity test. I will establish the criteria for a "realistic interval" of capacity building.
  *Months 3–4:* United States and Germany. I will analyze enumerated powers and concurrent powers doctrines, focusing on case law where capacity was argued implicitly (e.g., funding conditions, administrative conscription).
  *Months 5–6:* European Union and Switzerland. I will examine the EU subsidiarity protocol and national parliament early-warning mechanisms, alongside Swiss fiscal equalization and task division reforms.
  *Month 7:* Policy Application. I will run the three test domains (school standards, pandemic response, climate targets) through the machinery of all four systems using the new test.
  *Month 8:* Drafting the Decision Procedure. I will synthesize findings into a usable protocol.
  *Month 9:* Revision and Failure Analysis. I will stress-test the conclusions against the identified risks and finalize the text.

  This method prioritizes depth of conceptual clarity over breadth of coverage. It allows for a rigorous test of the hypothesis without requiring empirical fieldwork that is impossible for an unaffiliated researcher.

  **Concrete Deliverable**
  The primary output will be "The Subsidiarity Capacity Protocol," a decision procedure usable by policymakers or legal counsel. It will function as a flowchart or checklist that forces the user to specify the time horizon for capacity building before assigning competence. The protocol will ask: (1) Can the lower unit perform this task now? (2) If not, what specific investment (funding, training, authority) is required? (3) Is that investment feasible within a defined interval? (4) Who bears the cost of that interval?

  I will validate this protocol by applying it to three policy domains across all four systems. For school standards, the test may reveal that enablement requires federal funding floors without federal curriculum control. For pandemic response, it may show that temporary centralization is required to build local stockpiles, after which competence reverts. For climate targets, it may demonstrate that lower units cannot act without higher-level carbon pricing mechanisms, licensing centralization not as permanent ownership but as capacity scaffolding. These worked examples will show whether the protocol produces distinct results compared to standard necessity tests.

  **Possible Conclusions and Deciding Considerations**
  There are three possible outcomes. First, the counterfactual test aligns the four systems, suggesting a universal logic of federalism that current doctrine obscures. Second, the test reveals irreconcilable structural differences; for example, the US enumerated powers model may legally forbid the temporary centralization required for enablement, while the EU model permits it. Third, the test shows that "enablement" is already implicit in existing proportionality reasoning, rendering the new terminology redundant. The deciding consideration will be whether the protocol changes the outcome of the allocation decision. If applying the counterfactual test flips the result from "centralize" to "decentralize with support," the project succeeds. If the result remains "centralize" because the cost of building capacity is too high, the project clarifies why decentralization is impossible.

  **Failure Conditions and Scope Assessment**
  I must state an honest failure condition. The project fails if the enablement reading collapses into ordinary proportionality reasoning. If "building capacity" is legally indistinguishable from "less restrictive means" analysis in current jurisprudence, the conceptual innovation adds no value. I will test for this explicitly in Month 8. Additionally, the project fails if the differences between the four systems turn out to be only differences about who bears the burden of proof rather than substantive outcomes. If the US, Germany, Switzerland, and EU all reach the same result using different vocabulary, the comparative element is moot.

  Regarding scope, I am not arguing for a specific political outcome. I am not claiming decentralization is always better. I am testing whether the *principle* used to decide the level of action is coherent. The scope is limited to constitutional and treaty-based allocation of competence, not political feasibility. I will not address unitary states or non-democratic federations. If the counterfactual test proves too complex for practical application, I will simplify the protocol to a binary threshold rather than a sliding scale. This ensures the deliverable remains useful even if the theoretical ideal is unattainable. The goal is clarity, not perfection. If the research shows that subsidiarity is inherently indeterminate without a political rather than legal fix, I will report that negative finding. A clear negative result is more valuable than a fuzzy positive one.
