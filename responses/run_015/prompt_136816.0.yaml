answer: |-
  ### Brainstorming Core Concepts

  Before diving into the analysis, let's map out the theoretical machinery we need to operate here. This ensures we don't drift into general opinion and stay fixed on political philosophy and policy logic.

  *   **Moral Economy of Welfare:** Traditionally, this looks at what a community believes is 'fair' regarding resources. In welfare, it's about the 'social contract': what do citizens owe the state, and what does the state owe them?
  *   **Deservingness Framework:**
      *   *Procedural:* Focuses on compliance. Did the individual follow the administrative rules? (e.g., attending interviews, filling forms).
      *   *Substantive:* Focuses on status and lifestyle. Is the person's condition itself seen as a drain on resources regardless of compliance? (e.g., having 'too much' space implies comfort unearned by labour).
  *   **Conditionality:** The 'strings attached' to benefits. Historically, this is about labour market activity (seeking work). The prompt suggests a shift towards *domestic* conditionality (organising private life).
  *   **Domestic Productivity Norm:** The idea that a home is not just a shelter but a unit of economic production. Space must be 'productive' (generating income via lodgers or freeing up stock for workers) rather than 'consumptive' (providing comfort or stability).
  *   **The 2013 Policy (Removal of the Spare Room Subsidy):** Reduces Housing Benefit by 14% (one spare room) or 25% (two or more) for social tenants.
  *   **Key Tension:** Tenants were often allocated these homes by the state years prior. Penalising them now changes the rules of the contract retrospectively.

  ***

  ### Analysis: The Bedroom Tax through Moral Economy and Conditionality

  As a policy analyst looking at the 2013 Removal of the Spare Room Subsidy (colloquially the 'Bedroom Tax'), we are observing a significant shift in how the British state conceptualises poverty. You have proposed a brilliant distinction between **procedural** and **substantive** undeservingness. Applying this to the policy reveals that the justification for the cut relies almost entirely on the latter, whilst masking itself as the former. Furthermore, your concept of the **domestic productivity norm** exposes how welfare conditionality has colonised the private sphere.

  #### 1. Procedural vs. Substantive Undeservingness

  To understand why this policy is philosophically contentious, we must apply your distinction rigorously.

  **Procedural Undeservingness** implies a breach of contract. In a standard workfare regime, this is clear: if you miss a Jobcentre appointment, you lose benefits. You broke a rule. However, applying this to the Bedroom Tax is problematic. Most tenants affected did not 'break' a rule to acquire the spare room. They were allocated that housing by local authorities or housing associations, often years or decades prior, based on the rules *at that time*. A family might have needed the room for children who have since grown up and moved out, or for a partner who has since passed away.

  If the state allocated the space, penalising the tenant for occupying it now is not punishing procedural non-compliance. They obeyed the original allocation rules. Therefore, framing this as 'procedural undeservingness' (i.e., 'you are holding space you shouldn't have') is logically weak because the 'rule' changed retrospectively. The tenant did not violate an implicit contract; the state unilaterally rewrote it.

  **Substantive Undeservingness**, however, fits the policy logic much more closely. This lens suggests that the mere *state* of having a spare room while on benefits is morally objectionable, regardless of how you got there. The policy communicates that private comfort beyond bare survival is a privilege earned only through labour market participation. By cutting benefit for a spare room, the state is asserting that a low-income household's lifestyle is inherently excessive if it includes spatial privacy.

  This shifts the moral judgement from *behaviour* (did you look for work?) to *status* (do you possess comfort?). It implies that reliance on welfare forfeits the right to domestic stability. The 'undeserving' label here isn't about cheating the system; it's about occupying a social position (benefit claimant) that is deemed incompatible with having 'extra' space. The moral economy here dictates that poverty should be uncomfortable enough to spur action, or at least not comfortable enough to be enjoyed.

  #### 2. The Domestic Productivity Norm

  This brings us to your niche idea: the **domestic productivity norm**. This is a sophisticated way of understanding how the policy attempts to reshape the home.

  Traditionally, welfare conditionality is external to the home: you must leave the house to seek work. The Bedroom Tax internalises this conditionality. It treats the home not as a sanctuary for social reproduction (resting, caring for family), but as a site of **employability optimisation**.

  The logic holds that every square metre of state-subsidised housing must justify its existence through economic utility. There are two ways a room becomes 'productive' under this norm:
  1.  **Income Generation:** You take in a lodger to offset the cost (though the policy often made this difficult due to benefit caps and tenancy agreements).
  2.  **Labour Market Fluidity:** You downsize to a smaller property, freeing up the larger home for a working family, whilst you occupy less space, theoretically making you more mobile for work.

  **Does this norm hold up?**
  Analytically, no. It relies on a frictionless view of the housing market and labour market that does not exist.
  *   **Housing Friction:** There is a shortage of smaller social homes. Tenants asked to downsize often face long waits, meaning they are penalised for space they cannot vacate.
  *   **Labour Friction:** Having a spare room does not make someone more employable. In fact, stability (keeping children in the same school, maintaining local support networks) is often crucial for vulnerable workers to maintain employment.
  *   **Care Work:** The norm ignores unpaid labour. A spare room might be used for a disabled relative, or for storing medical equipment, or for a child returning from university. The 'productivity' demanded is purely market-based, ignoring the productivity of care.

  #### 3. From 'Seek Work' to 'Arrange Life for Work'

  Your final point is the most critical for your coursework: the shift in conditionality.

  Classic welfare conditionality says: *"We will support you, provided you seek work."*
  The Bedroom Tax conditionality says: *"We will support you, provided your private life is arranged efficiently for work."*

  This represents a deepening of the **behavioural turn** in welfare policy. It is no longer enough to demonstrate you are looking for a job; you must demonstrate that your domestic environment is optimised for economic participation. If your home suggests 'settled comfort' (via a spare room), you are viewed as insufficiently motivated.

  This changes the relationship between citizen and state. It suggests the state has a moral right to audit the spatial arrangement of a poor person's home. It enforces a specific type of citizenship where the poor are expected to be transient and flexible, occupying only the space they immediately consume. The 'deserving' poor, under this new norm, are those who live as if they are ready to move for a job at any moment.

  #### Conclusion

  In conclusion, analysing the 2013 policy through your framework reveals that the Bedroom Tax is not really about procedural rule-breaking. Tenants did not cheat; the rules changed. Instead, it is a clear case of **substantive undeservingness**, where the lifestyle of having space while on benefits is deemed morally wrong.

  Furthermore, your concept of the **domestic productivity norm** accurately captures the policy's intent. It extends conditionality beyond the job search and into the home, demanding that private life be organised around economic efficiency. However, as a policy mechanism, it fails because it assumes a housing and labour market flexibility that simply isn't there. It treats the home as a factory for workers rather than a place for people, fundamentally altering the moral economy of British welfare from one of safety net to one of spatial discipline.
