      *   *Key Insight to Highlight:* The distinction between *motivation* (why I act), *justification* (why I say I act), and *equilibrium* (why we all act). The camps are talking past each other across these categories.
      *   *Refining the "Honor" Definition:* Honor isn't just a motive; it's a *signal*. This supports the user's coordination idea.
