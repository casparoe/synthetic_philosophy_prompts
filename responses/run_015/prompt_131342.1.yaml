          *   *Core Claim:* Norms change because of cognitive dissonance. People realize practices contradict existing values (dignity, honor, Christianity).
          *   *Mechanism:* Internal critique, persuasion, moral reasoning.
          *   *View of Honor:* A lever for moral argument (e.g., "True honor forbids slavery").
          *   *Question Answered:* "How was this practice *justifiably* abandoned?" (Often conflates justification with causation).
      *   **Camp 2: Williams-Style Honor/Fashion (e.g., Bernard Williams, Jon Elster).**
          *   *Core Claim:* Reason doesn't move mountains; social status does. Dueling ended not because it was immoral, but because it became *uncool* or socially costly.
          *   *Mechanism:* Shift in what confers status/prestige. Reconfiguration of honor, not its defeat by reason.
          *   *View of Honor:* A primitive social motivation, distinct from morality.
          *   *Question Answered:* "What social pressure actually compelled compliance?"
      *   **Camp 3: Material/Institutional (e.g., Marxist, State-Centric).**
          *   *Core Claim:* Economics and state power drive change. Slavery ended because industrial capitalism needed wage labor; dueling ended because the state monopolized violence. Moral talk is ideology.
          *   *Mechanism:* Incentive structures, legal coercion, economic efficiency.
          *   *View of Honor:* Epiphenomenal, post-hoc rationalization.
