answer: |-
  # Teaching Plan: The Limits of Constitutional Precommitment
  **Session Duration:** 90 Minutes
  **Audience:** Final-Year Law Students (Constitutional Law background, No Philosophy of Agency background)

  ## 1. Conceptual Distinction: Synchronic vs. Diachronic Identity (00:00 – 00:15)
  **Goal:** Secure the definition of "Self" before applying it to the "State."
  **Activity:** Brief lecture and Socratic questioning.

  *   **The Hook:** Ask students to define a "Ulysses Contract" in medical law (e.g., a psychiatric advance directive). Most will identify it as *binding one's future self to protect one's long-term interests.*
  *   **The Distinction:** Introduce two terms without heavy jargon:
      1.  **Diachronic Identity (The Personal):** Time 1 You and Time 2 You are legally and biologically the *same entity*. Harm to Future You is harm to Present You.
      2.  **Successive Identity (The Political):** The "Founding Generation" and the "Current Legislature" are *different entities* sharing an institution. Harm to Future Voters is not necessarily harm to Founders.
  *   **Intercepting Misconception 1 (Precommitment = Discipline):**
      *   *Predicted Error:* Students will argue precommitment is just about "willpower" or "being serious."
      *   *Intervention:* Clarify that Ulysses didn't *try* harder to resist the Sirens; he *removed the option* to steer. Precommitment is structural incapacity, not psychological resolve. If the Constitution is just "discipline," it can be ignored when willpower fails. If it is structural, it requires a key (amendment) to open.

  ## 2. The Carrying Scenario: The "Focus Lock" vs. The "Eternity Clause" (00:15 – 00:45)
  **Goal:** Use a single parallel narrative to visualize the analogy and its breaking point.
  **Activity:** Comparative case study.

  *   **The Scenario:**
      *   **Track A (Personal):** A law student installs a "Focus App" on their phone on Monday morning. It locks all social media until Friday evening. They cannot override it, even if they beg on Wednesday.
      *   **Track B (Constitutional):** A Constitutional Convention inserts an "Eternity Clause" (e.g., protection of human dignity) that cannot be amended, even by a 100% parliamentary majority.
  *   **The Parallel:** Both involve Time 1 restricting the options of Time 2 to preserve a value (Productivity / Human Dignity).
  *   **Intercepting Misconception 2 (Rigidity = Anti-Democratic):**
      *   *Predicted Error:* Students will argue the Eternity Clause is undemocratic because it stops the current majority from ruling.
      *   *Intervention:* Ask: "Was the Focus App undemocratic?" No, it was an exercise of autonomy. Reframe: Entrenchment is not *stopping* democracy; it is *constituting* the boundaries within which democratic bargaining occurs. Without the lock, the game changes; with the lock, the game continues.

  ## 3. The Collapse & Injected Framing: The Non-Identity Problem (00:45 – 01:15)
  **Goal:** Demonstrate where the analogy fails and introduce the "Reverse Ulysses" framing.
  **Activity:** Thought experiment and group debate.

  *   **The Breaking Point:** Ask: "Who suffers the pain of the lock?"
      *   *In Track A:* The student on Wednesday suffers, but the student on Friday benefits. It is the *same person* trading short-term pain for long-term gain.
      *   *In Track B:* The Founders (Time 1) gain stability. The Future Citizens (Time 2) bear the restriction. They are *not* the same person.
  *   **Injecting the "Reverse Ulysses" Framing:**
      *   Explain that standard theory says we entrench to save the Future from itself (Standard Ulysses).
      *   **The Twist:** Argue that because Future Generations are *strangers* (Non-Identity), entrenchment often functions to shield the *Founders' Settlement* from transient future majorities. It is not "I bind me to save me." It is "We bind them to preserve *our* agreement."
      *   *Why this matters:* If it were truly Ulysses, the Future Self would thank the Past Self. In the Constitutional version, the Future Generation might view the Entrenchment not as self-care, but as foreign occupation.
  *   **Intercepting Misconception 3 (Future Generation = Future Self):**
      *   *Predicted Error:* Students will assume the "Polity" is a single immortal being like a person.
      *   *Intervention:* Force the distinction. A person has a continuous consciousness. A polity has successive, distinct electorates. Treating them as the same "Self" masks the power dynamic of one generation ruling another.

  ## 4. Closing Question & Omissions (01:15 – 01:30)
  **Goal:** Test understanding of the limit, not the surface.
  **Activity:** Final reflection and administrative close.

  *   **The Closing Question:**
      *   *"If a future generation unanimously agrees to repeal an entrenched clause, is that an act of liberation (breaking the chains of the dead) or suicide (destroying the self that makes rights possible)? Explain your answer without using the word 'democracy'."*
      *   *Success Criteria:* A good answer acknowledges the tension between the *identity* of the polity (which requires continuity) and the *agency* of the current voters (which requires freedom). It recognizes the analogy fails because "suicide" implies harming oneself, whereas repealing a constitution harms a *predecessor's* project.
  *   **Explicit Omissions:**
      *   Acknowledge that we are **not** discussing the "Dead Hand" argument in full normative depth (i.e., whether generations *should* be bound).
      *   Acknowledge we are **not** solving the metaphysical problem of personal identity (Parfit's Reductionism); we are using a legal fiction of identity for the sake of the analogy.
      *   State clearly: *"We are treating the 'Non-Identity' problem as a political fact, not a metaphysical puzzle, to keep the legal analysis sharp."*

  ***

