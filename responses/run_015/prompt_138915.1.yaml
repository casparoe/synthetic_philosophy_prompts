answer: |-
  We must abandon the expectation that our categories map onto static natural kinds and instead design for dynamic stability against patient adaptation.

  **Desiderata for a Loop-Aware Classification**

  1.  **Decision Utility over Ontological Truth**
      *   **Motivation:** The system must gate care and match treatments now, whereas tracking a mind-independent reality is secondary to function.
      *   **Verdict:** **Non-negotiable** for access and treatment matching; tracking static reality is a **preference** we must drop.
  2.  **Loop-Stability over Inter-Rater Reliability**
      *   **Motivation:** Reliability ensures consistent coding across clinicians, but if criteria are public, high reliability often indicates easy gaming by patients.
      *   **Verdict:** **Non-negotiable** for research cohorts and decade-long validity; reliability is **preferable** only if it does not invite performance.
  3.  **Longitudinal Robustness over Cross-Sectional Accuracy**
      *   **Motivation:** A diagnosis accurate today may vanish in five years as patients reorganize around the published criteria.
      *   **Verdict:** **Non-negotiable** given the decennial revision cycle; snapshot accuracy is **merely preferable**.
  4.  **Validation Evidence Standards**
      *   **Motivation:** Predictive validity is contaminated if the label triggers the outcome (e.g., funding or social support) rather than predicting a natural course.
      *   **Verdict:** **Non-negotiable** adjustment: Discount predictive validity findings by at least 50% if the outcome is mediated by administrative response to the label; discard entirely if the mechanism is purely social reinforcement.
  5.  **Ontological Independence (Struck)**
      *   **Motivation:** The desire for categories to exist independent of the classification process.
      *   **Verdict:** **Struck.** In a looping system with open text, the classification constitutes the kind; demanding independence is incoherent.

  **Incompatibilities and Trade-Offs**

  You cannot jointly satisfy high inter-rater reliability via strict operationalization and high loop-stability; tightening criteria to raise reliability makes a category easier to game and quicker to drift. Publishing criteria in plain language appears to erode the very validity publication was meant to serve, creating a tension between transparency and stability that cannot be fully resolved, only managed. Tracking a biological mechanism conflicts with being usable at the point of care next Tuesday, forcing a choice between research purity and clinical throughput. If the committee insists on **Loop-Stability** as a non-negotiable requirement, it would eliminate the largest share of options actually on the table, specifically standard operationalized criteria and pure formulation approaches, leaving only hybrid dimensional models as viable candidates.

  **Architecture Scorecard**

  **Operationalized Categorical (DSM/ICD):** Fails loop-stability due to gameable checklists but succeeds at gating and finance auditing.
  **Mechanism-First (RDoC):** Offers high loop-stability via abstraction but fails clinical utility and access gating entirely.
  **Hierarchical Dimensional:** Balances validity and reliability but struggles with the hard thresholds required for funding eligibility.
  **Formulation-Based:** Maximizes individual care accuracy but cannot define research cohorts or audit access decisions.
