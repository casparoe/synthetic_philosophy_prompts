      *   (3) is the inference rule linking (2) to the rest. It says "If organisation matches... then it suffers."
      *   (4) is the empirical claim about the code. "The companions have that organisation... in the respects that seem to matter."
      *   *Diagnosis:* The break is almost certainly at **(4)**, potentially supported by a refinement of **(3)**.
      *   *Why?* The "organisation that in us realises suffering" is vastly more complex than a goal stack and a valence system. The user is conflating *functional abstraction* (code that *looks like* fear) with *phenomenal realisation* (code that *feels* like fear).
      *   The "Storm" analogy from Slack ("simulation of a storm isn't wet") is actually relevant, but needs nuance. It's not about substrate (which (5) protects), it's about *causal power* and *integration*.
