answer: |-
  Okay, so here's the thing about reconstructing belief without text: you're basically trying to hear a whisper in a hurricane using only the debris the wind left behind. For this seminar, we're sticking to your anchor case—the broken pots, burnt bone, aligned posts, silence everywhere.

  I've sketched out a decision tree below. It's not about "which theory is right," but about which epistemological commitments you're willing to make to get from *shard* to *statement*. I've tried to make the nodes concrete claims. You should be able to answer "Yes/No" or "A/B" without knowing which academic tribe you're joining.

  I've also woven in the lipid residue angle because that's where the hard science often masks a soft assumption.

  ***

  ### The Epistemological Decision Tree: From Trace to Institution

  **START:** You are standing over the feature. Broken pottery, burnt bone, aligned post-holes. No writing.

  **NODE 1: The Ontology of the Break**
  *Claim:* "The deliberate breaking of the pottery is a form of communication equivalent to a sentence."
  *   **YES (Propositional):** The break carries specific meaning (e.g., "this vessel is dead," "the pact is sealed"). It functions like a signifier.
      *   *Go to Node 2A.*
  *   **NO (Performative/Behavioral):** The break is just an action with consequences. It changes the social state but doesn't "say" anything true/false. It's a thing done, not a thing read.
      *   *Go to Node 2B.*

  **NODE 2A: (If Propositional)**
  *Claim:* "The meaning of the break is fixed by a shared mental rulebook (doctrine)."
  *   **YES:** There is a cognitive template everyone follows.
      *   *Leaf:* **Cognitive Processualism** (Renfrew-ish). Beliefs are internal software driving external hardware.
  *   **NO:** The meaning is negotiated in the moment of breaking; it's unstable.
      *   *Leaf:* **Post-Processual Semiotics**. The object is a text, but the reading varies.

  **NODE 2B: (If Performative)**
  *Claim:* "The alignment of post-holes requires a shared abstract model (cosmology) to explain the precision."
  *   **YES:** You can't get that alignment without agreeing on where 'North' or 'Sacred' is beforehand.
      *   *Leaf:* **Structuralist Materialism**. The structure proves the thought.
  *   **NO:** The alignment emerges from repeated practical solutions (wind load, sun shade, terrain) that harden into tradition.
      *   *Go to Node 3.*

  **NODE 3: The Continuity Mechanism**
  *Claim:* "If this pattern repeats for 200 years, it requires a chain of teaching (oral/textual) to survive."
  *   **YES:** Institutions need memory carriers.
      *   *Leaf:* **Institutional Minimalism**. Without transmission chains, you only have habit, not institution. (This is a mostly empty leaf in pure form, usually hybridized).
  *   **NO:** Pure repetition of practice (habit memory) is enough to sustain the institution without explicit teaching.
      *   *Leaf:* **Practice Theory** (Bourdieu-inspired). The body knows what the mind doesn't say.

  **NODE 4: The Lipid/Residue Split (The Science Trap)**
  *Claim:* "Specific fatty-acid profiles (e.g., ruminant dairy vs. adipose) prove a normative rule was followed."
  *   **YES:** The chemistry shows compliance. They *had* to use this fat here.
      *   *Go to Node 5.*
  *   **NO:** The chemistry shows consumption. They *did* use this fat, but maybe just because it was Tuesday.
      *   *Leaf:* **Behavioral Ecology View**. Optimization and chance, not normativity.

  **NODE 5: The Taste Fallacy Check**
  *Claim:* "We can assume the food found in 'ritual' contexts was considered 'high value' by the actors based on nutritional density or modern prestige markers." (Rejecting the **Uniformitarian Taste Fallacy**).
  *   **YES (Accept Fallacy):** High calorie/modern prestige = Sacred.
      *   *Leaf:* **Radical Materialist Inference**. (Often unnamed, but common in older processualism).
  *   **NO (Reject Fallacy):** Their value system might privilege bland, toxic, or rare items we see as useless. The residue proves presence, not value.
      *   *Leaf:* **Material Engagement Theory** (Malafouris-ish). The substance itself alters the mind, regardless of 'taste'.

  ***

  ### Commentary on the Map

  **Empty/Incoherent Combinations:**
  There's a weird empty space between **Node 1 (YES)** and **Node 2B (NO)**. If you claim the break is propositional (a sentence) but deny it requires a shared mental rulebook *or* a negotiated reading, you're left with magic. Nobody sits there. It's incoherent to say "this pot break means X" but "nobody agreed on what X means."

  Also, **Node 3 (YES)** is almost empty. Pure "Institutional Minimalism" is rare because even minimalists admit some oral transmission happens. It's usually a hybrid leaf. Most people cluster around **Practice Theory** because it allows for continuity without needing a "priesthood" to explain every post-hole.

  **Indistinguishable Pairs:**
  The tree struggles to seperate **Node 2B (YES)** [Cosmology] from **Node 2B (NO)** [Practical Logistics] purely on post-hole alignment. This is the classic "astro-archaeology vs. engineering" deadlock. Unless you find a model of the stars carved on a pot, the material trace is identical. The tree forces you to pick a metaphysical commitment, not find a solution in the dirt.

  **The Lipid Angle & The Taste Fallacy:**
  This is where the seminar should get messy. Lipid analysis gives us hard data (presence of molecules), but we treat it like soft data (meaning of molecules).

  If we find dairy fats in the broken pots:
  1.  **Standard View:** They offered milk. Milk = pure/sacred (modern bias creeping in?).
  2.  **Uniformitarian Taste Fallacy View:** We assume they liked milk because we do, or because it's nutritious.
  3.  **The Epistemological Twist:** If we reject the fallacy, the residue proves *contact*, not *intent*. Maybe the pot was broken *because* it held something profane, not sacred. Maybe the "sacrificial feast" was actually a disposal of contaminated goods.

  The lipid profile doesn't tell you if the meal was a "feast" (institutional) or "dinner" (domestic) unless you assume institutional norms dictate specific diets. If you reject the fallacy, you admit their "sacred diet" might look like garbage to us. So, the residue proves *what*, but the tree determines *why*.

  **One last thing:**
  Notice how **Node 1** splits the room immediately. If you think matter can't carry propositional content (No), you can never reconstruct "belief" in the theological sense, only "practice." That's a hard ceiling. Some of your seminar participants might not realize they're hitting that ceiling until you ask them that first question.

  Anyway, hope this helps frame the discussion. It's messy, but that's the point. If it was clean, we'd have texts.

  (Also, sorry if the formatting on Node 5 looks a bit off, typing this out quick.)
