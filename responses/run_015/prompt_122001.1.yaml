  *   **Philosophy:** Everything is a trade-off. Safety is a commodity to be weighed against efficiency.

  **Rule B: Lexicographic Safety Constraint (The Member's View)**
  *   **Logic:** A two-step filter.
      1.  **Veto:** Reject any option with an unbounded, unquantifiable, or systemic-catastrophic worst-case scenario (regardless of expected utility).
      2.  **Optimize:** Among the remaining "safe" options, select the one with the highest expected utility.
