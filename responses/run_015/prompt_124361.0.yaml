answer: |-
  Here are the desiderata for your protagonist's framework. I've kept the spelling correct on *desiderata* (no worries on the typo, it's a mouthful), and structured this as a set of constraints she'd keep on her whiteboard or in her field notes.

  ### The Desiderata for a Theory of Moral Bias

  **1. The Sentience Boundary Condition**
  The framework must distinguish between *moral harm* and *sensory aversion*.
  *   **The Test Case:** It must classify "discounting animal pain" as a potential moral bias (excluding a relevant moral patient), while classifying "hating bitter taste" as a legitimate preference (excluding a sensory qualia).
  *   **The Constraint:** The theory cannot rely solely on intensity of feeling. It must identify a structural difference between *suffering* (which demands justification) and *dislike* (which does not). If the theory treats these identically, it collapses morality into aesthetics.

  **2. The Integration vs. Instrumentalism Test**
  The framework must distinguish between *principled disagreement* and *strategic conformity*.
  *   **The Test Case:** It must handle the "Moral Tourist" (who adopts local norms for social ease without internal belief) and the "Exile" (who rejects local norms based on universal principles) without labeling either as inherently biased.
  *   **The Constraint:** Bias is not defined by *alignment* with local norms, but by the *transparency of reasoning*. The Tourist is only biased if they claim internal belief while acting strategically. The Exile is only biased if their rejection stems from self-interest masked as principle. The theory must detect the *source* of the stance, not just the stance itself.

  **3. The Epistemic Independence Clause**
  The framework must separate *processing errors* from *information deficits*.
  *   **The Distinction:**
      *   **Bias:** Systematic deviation in weighting evidence due to irrelevant factors (e.g., source credibility, group identity).
      *   **Epistemic Bad Luck:** Correct processing of incomplete or misleading data.
  *   **The Constraint:** If two agents have the same information and reasoning tools but reach different values, the theory must not automatically label the minority view as "biased." It must allow for *reasonable pluralism* where no bias is present, only different weighting of valid goods.

  **4. The Weighting Structure Requirement**
  The framework must allow for objective *bounds* without demanding objective *points*.
  *   **The Contradiction Check:** You noted the tension between demanding objectivity and allowing different moral weights. This criterion resolves it by treating moral values like a budget rather than a single currency.
  *   **The Constraint:** The theory must define a "permissible range" of weightings (e.g., you can value Liberty over Security, but not Liberty over Survival). Objectivity lies in the *constraints on the trade-off*, not the specific trade-off chosen. This prevents the theory from calling every disagreement a bias while still ruling out extreme deviations.

  **5. The Correctability Asymmetry (The Pop-Psych Killer)**
  The framework must require that a identified bias be *correctable without identity dissolution*.
  *   **Why it kills Pop-Psych:** Popular psychology often suggests "we are all biased" or "bias is part of who you are." This renders the term useless for critique.
  *   **The Constraint:** For a distortion to count as a *moral bias* rather than a *personality trait*, the agent must be able to recognize and reduce it when prompted with neutral evidence, without ceasing to be themselves. If the "bias" is inseparable from the agent's core identity, the theory must classify it as a *value difference*, not a bias. This stops people from pathologizing fundamental disagreements.

  ***

  ### The Impossible Pair (Jointly Unsatisfiable)

  You asked to flag a pair that cannot coexist. Your protagonist should know that she cannot have both of the following simultaneously. She has to choose which one to sacrifice:

  **Pair A: Value-Neutral Methodology**
  The framework itself relies on no moral assumptions to detect bias (it is purely descriptive/psychological).

  **Pair B: Normative Force**
  The framework can definitively label a specific moral judgment as "biased" rather than just "different."

  **The Conflict:** You cannot derive an *ought* (this judgment is wrong/biased) from an *is* (this is how the brain processes data) without smuggling in a moral premise. If the framework is truly neutral (A), it can only describe deviations from a statistical norm, not a moral one. If it claims moral force (B), it is itself biased toward a specific moral ontology.
  *   **Novel Tip:** Your protagonist likely tries to hide this contradiction. The tension in her character arc comes from realizing she needs **B** to do her job, but claims **A** to maintain scientific authority.

  ### Summary for the Character
  *   **Bias** = Error in processing relevant data due to irrelevant factors (correctable).
  *   **Preference** = Different weighting of valid values within permissible bounds (stable).
  *   **Bad Luck** = Correct processing of incorrect data (fixable with info).
  *   **The Trap:** Claiming your framework is purely scientific while making moral judgments.
