answer: |-
  This is a fantastic tension to build a dissertation chapter around. You have identified the precise friction point where Berkeley's immaterialist metaphysics meets his proto-Keynesian economics. Most scholarship treats Berkeley's *The Querist* (1735–37) as a separate practical project from his *Principles* (1710), but you are right to press them together.

  Here is a breakdown of how to navigate this comparison, address the "vault" problem, and evaluate the coherence of paper currency in both systems.

  ### 1. Berkeley's "Ticket" and the Metaphysical Vault
  You ask if Berkeley is sneaking in an exception to *esse est percipi* (to be is to be perceived) when he treats gold in a vault as capital. The short answer is **no**, but it requires understanding his theory of **signs** rather than just perception.

  In *Alciphron* and *The Querist*, Berkeley treats money not as a commodity (like Locke) but as a **semiotic system**. Money is a "counter" or "ticket" (Query 31 in *The Querist*: "Whether money be not only useful to induce industry...?").
  *   **The Metaphysical Fix:** For Berkeley, a sign does not cease to signify when it is not currently being looked at, provided the *system of signification* exists in minds. Think of it like language. If I write a sentence and lock it in a drawer, the words do not lose their meaning, because the meaning resides in the *convention* held by the community of minds (and ultimately grounded in God).
  *   **Potential vs. Actual Perception:** Berkeley relies on a **dispositional** theory of value. The gold in the vault has value because there is a *potential* for it to enter circulation and command labor. That potentiality exists in the collective mind of the polity. It is not a material property of the metal; it is a relational property grounded in the *will* of the society to accept it.
  *   **The "Exception":** He isn't admitting matter has intrinsic value. He is arguing that the *concept* of the gold's redeemability is what holds value. If the society collapses (the minds disappear or the convention breaks), the gold in the vault becomes just yellow metal (a bundle of sensations with no economic signification).

  **Dissertation Angle:** Argue that Berkeley shifts value from **ontology** (what the thing *is*) to **teleology** (what the thing *does*). The gold is capital only insofar as it is destined to circulate. Hoarding actually *destroys* value for Berkeley (Query 55: "Whether the keeping of money locked up... be not a hindrance to industry?").

  ### 2. Locke's Labor-Mixing and Intrinsic Value
  Locke's position in *Some Considerations of the Consequences of the Lowering of Interest and Raising the Value of Money* (1691) is fundamentally different.
  *   **Embodied Labor:** For Locke, value is largely **accumulated past labor**. Silver has value because it is durable and scarce, but its monetary power comes from a tacit consent that recognizes the labor required to mine and refine it.
  *   **The Vault:** For Locke, gold in a vault *does* retain value independently of immediate perception because the labor is "mixed" into the substance. It is a store of value in a realist sense. The value is embedded in the object's relation to human needs and the labor required to produce it.
  *   **The Tension:** Locke struggles with fiat. If value is tied to the substance (which represents labor), then paper (which has no labor of mining/refining) is inherently suspect. Locke was famously skeptical of land banks and paper credit because he feared the decoupling of the sign (money) from the thing (specie/labor).

  ### 3. Which Account Explains Paper Currency Better?
  **Berkeley wins this round hands down,** and this is where your chapter can make a strong intervention.

  *   **Berkeley's Coherence:** Because Berkeley defines money as a "ticket to command labor," the material substrate is irrelevant. Whether the ticket is gold, silver, or paper matters less than the **credit** (the trust) behind it. In *The Querist*, he explicitly advocates for a national bank in Ireland issuing paper notes to stimulate industry. Since value is in the *circulation* and the *industry* it prompts, paper is actually superior if it circulates faster than heavy coin.
  *   **Locke's Incoherence:** Locke's theory creates a friction with paper currency. If money's value is tied to the intrinsic worth of the metal (derived from its scarcity and the labor to get it), paper money looks like a deception. Locke worries about "raising the value of money" (debasing currency) because he thinks it disrupts the natural measure of value provided by silver.
  *   **The Verdict:** Berkeley provides a **functionalist** theory of money that anticipates modern chartalism (money as a creature of the state/social convention). Locke provides a **commodity** theory of money. In a fiat economy, Berkeley's metaphysics (value is in the mind/convention, not the matter) accidentally aligns better with economic reality than Locke's realism.

  ### 4. The Trap: Does Berkeley Collapse into a Social Ontology?
  This is your most dangerous and interesting question. If value depends on "collective perception," does Berkeley reify "Society" into a material-like force he would hate?

  *   **The Risk:** If "The Market" or "Public Credit" acts as an invisible hand that dictates value regardless of individual will, Berkeley has inadvertently created a **social substance**. This would violate his rejection of abstract ideas. He hates the idea of "Force" or "Gravity" as occult qualities; he would equally hate "Value" as an occult social quality.
  *   **The Defense (Voluntarism):** Berkeley saves himself by grounding the "collective" in **individual volitions**. Value isn't a ghostly social ether; it is the sum of individual willingness to trade labor for tickets. In *The Querist*, he constantly links money to **Industry** (active human will). If people stop working or stop trusting, the value vanishes instantly.
  *   **The Theological Safety Net:** Remember, for Berkeley, the stability of the world (and the economy) is ultimately guaranteed by God. The regularity of economic laws (like supply and demand) is part of the "Divine Language." So, the "social ontology" is actually a **theological ontology**. The coherence of the currency is maintained because God sustains the regularity of human nature and perception.
  *   **Conclusion on the Trap:** He avoids collapsing into materialism *only if* he maintains that value is always traceable back to **spirits** (human or divine) willing it. If he allows "market forces" to operate independently of human will, he betrays his metaphysics. You can argue that Berkeley *nearly* slips here, which is why he emphasizes **circulation** (active motion) over **hoarding** (static existence). Static value looks too much like material substance; circulating value looks like active spirit.

  ### Suggested Structure for the Chapter Section
  1.  **The Metaphysics of the Counter:** Establish Berkeley's definition of money in *The Querist* as a sign/ticket, linking it to *Alciphron's* theory of language.
  2.  **The Vault Problem:** Address the unperceived gold. Argue for a "dispositional idealism"—value exists as a potentiality in the collective mind, not as a property of the metal.
  3.  **Lockean Contrast:** Contrast this with Locke's labor-embodiment. Show how Locke's realism makes paper currency problematic, whereas Berkeley's idealism makes it natural.
  4.  **The Social Ontology Critique:** Interrogate whether "Public Credit" becomes a reified abstraction. Conclude that Berkeley avoids this only by insisting on the primacy of *Industry* (active will) over *Wealth* (static possession).

  ### Key Textual References to Check
  *   **Berkeley:** *The Querist* (specifically Queries 31, 43, 55, 106). Look at Query 106 regarding whether the power of money is "real" or "imaginary."
  *   **Berkeley:** *Alciphron*, Dialogue VII (on the nature of signs and language).
  *   **Locke:** *Some Considerations of the Consequences of the Lowering of Interest and Raising the Value of Money*.
  *   **Secondary Lit:** Look for work by **Patricia Spence** (Berkeley's economics), **Gordon Graham**, or **S. H. H. Carr**. More recently, check **Silvia Manzo** on Berkeley and economics.

  This is a strong argument. You are effectively arguing that Berkeley's immaterialism makes him a more modern economist than Locke, precisely because he understands that value is a mental/social construct, not a physical property. Just be careful not to make him sound *too* modern; keep his theological voluntarism front and center to explain *why* the collective mind holds together.
