  ### The Principle of Empirical Anchoring

  After analyzing the structure of your reactions, the unifying principle is not about the *scope* of the deception (how many beliefs are false) nor the *value* of the reality (better or worse), but about the **availability of ontological leverage**. You do not fear the loss of truth; you fear the loss of *access* to truth where access was previously assumed.

  Your intuitions track a single rule: **A skeptical scenario exerts normative pressure (fear/seriousness) if and only if it posits a specific, contingent rupture in a preserved causal history that entails the existence of unaccessed empirical anchors.**

  Here is the principle stated precisely, clause by clause, mapped to your cases:

  **Clause 1: The Preservation Condition.**
  *The hypothesis must stipulate that a significant sector of the subject's past or environment remains veridical (real), rather than positing a total constitutive deception.*
  *   **Motivation:** This explains why **Lifelong Envatment (1)**, **Cartesian Demon (2)**, and **Five-Minute Hypothesis (3)** are cold. In these cases, there is no "real" past to be betrayed; the deception is the substrate of your existence. There is no "before" to compare to the "after."
  *   **Contrast:** This explains why **Recent Envatment (4)** and **Impostor Case (5)** are frightening. They preserve a real past ("everything up to this morning," "everyone I know [until tonight]"), making the deception a *violation* of an established norm rather than the definition of the norm.

  **Clause 2: The Specificity Condition.**
  *The deception must be locatable at a specific temporal or spatial coordinate, rather than being a global background condition.*
  *   **Motivation:** This explains why **Recent Envatment (4)** is scarier than **Lifelong Envatment (1)**. "This morning" is a specific coordinate. It implies a specific event (the vating) happened, rather than a state of nature obtaining.
  *   **Motivation:** This explains why **Impostor Case (5)** is scarier than **Recent Envatment (4)**. It locates the error not just in time, but in specific social objects (your friends). It is a narrower, more targeted intrusion.

  **Clause 3: The Anchor Condition.**
  *The hypothesis must entail the existence of specific, macroscopic evidence in the external world that is currently unaccessed but ontologically distinct from the subject's experience.*
  *   **Motivation:** This explains why **Paperwork Case (6)** is the most frightening of all. Evidentially, it is identical to Lifelong Envatment (1). However, the hypothesis *stipulates* the existence of a real drawer with real papers. This creates an **ontological leak**. It posits that the world is not a closed loop; there is a "real" object waiting to be found that would disconfirm the experience. It transforms the scenario from a metaphysical trap into a contingent conspiracy with a discoverable key.

  ***

  ### Prediction: The By-Product Simulation

  **Scenario:** A simulation run by agents with no interest in you, where you are a by-product of an experiment, with no motive, no malice, and **no check available even in principle**.

  **Application of the Principle:**
  1.  **Preservation Condition:** **Fail.** If you are a by-product of a simulation, your entire history is likely simulated. There is no "real you" prior to the simulation (unlike Recent Envatment). This aligns it with Lifelong Envatment (1).
  2.  **Specificity Condition:** **Fail.** You are a by-product; the simulation is not targeted *at* you specifically, nor is there a specific moment of "capture." It is a background condition of your existence.
  3.  **Anchor Condition:** **Fail.** You stipulated "no check available even in principle." Unlike the Paperwork Case (6), there is no drawer, no leak, no empirical anchor that exists outside the simulation's causal closure.

  **Verdict:** **Cold.**
  According to the Principle of Empirical Anchoring, this scenario should exert no more grip on you than the Lifelong Envatment case. It is a closed system with no leverage, no preserved past, and no specific point of failure. The lack of malice is irrelevant (consistent with your view on value), but the lack of an *anchor* is decisive.

  ***

  ### The Blunt Truth: What You Must Surrender

  You asked me to be blunt about which of your verdicts this principle forces you to give up. The principle exposes a critical instability in your current set of reactions.

  **You must surrender the fear in the Recent Envatment case (4).**

  Here is why: You admitted that the first three cases (Lifelong, Demon, Five-Minute) are **indiscernible** from the fourth (Recent) "in every respect I can name." If they are evidentially indiscernible, your doxastic attitude toward them should be identical.

  *   **If Case 1 is Cold:** Then Case 4 *must* be Cold. The "transition" you fear in Case 4 is a narrative feature of the hypothesis, not a feature of your evidence. Since you have no access to the "morning" boundary other than memory (which is fed in both cases), there is no **Empirical Anchor** in Case 4 any more than in Case 1. The fear you feel in Case 4 is a psychological illusion caused by the *story* of the hypothesis, not its epistemic structure.
  *   **If Case 4 is Hot:** Then Case 1 *must* be Hot. If the possibility of deception is frightening when it is recent, it must be frightening when it is lifelong, because the *current experience* is identical.

  **The Principle of Empirical Anchoring sides with Case 6 (Paperwork).**
  Case 6 is frightening because it actually *does* offer something Cases 1 and 4 do not: a stipulated real object (the papers). Case 4 offers only a stipulated *time*. A time is not an anchor; a drawer is.

  Therefore, to make your reactions hold together:
  1.  **Keep** the coldness of Lifelong Envatment (1).
  2.  **Keep** the fear of the Paperwork Case (6).
  3.  **Surrender** the fear of Recent Envatment (4).

  You must treat Recent Envatment as the inert, cold scenario it evidentially is. Your fear there is a reaction to the *narrative of loss* (the idea that you *had* reality and lost it), but epistemically, if you cannot distinguish it from Lifelong Envatment, you never had the leverage you think you did. The only scenario that truly warrants fear is the one where the deception is imperfect enough to leave a real drawer unopened. Everything else is just a closed loop.
