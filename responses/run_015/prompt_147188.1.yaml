  1. The precise research question and its stakes

  The central question driving this research is whether the ethical obligations surrounding the renaming of public streets differ structurally from those surrounding the removal of public statues, specifically due to the functional embeddedness of street names within daily logistical networks. While public discourse often groups these actions under the单一 banner of "decolonizing space" or "erasing history," this proposal argues that such a categorization obscures a critical moral distinction. A statue is primarily a commemorative object; its function is representational. A street name, however, is a commemorative object that also serves as a practical coordinate. It is a piece of inherited navigational speech that residents must invoke to perform essential tasks: receiving mail, summoning emergency services, navigating delivery routes, and establishing legal residency. This dual nature—simultaneously symbolic and functional—creates a unique ethical problem. When a statue is removed, the physical object may be relocated, but the public square remains. When a street is renamed, the label vanishes from maps, databases, and daily speech, creating a practical discontinuity that does not exist with physical monuments.

  The stakes of this inquiry are substantial for both political philosophy and urban governance. If street names are merely symbolic, then the ethical calculus for renaming them should mirror that of removing statues, relying primarily on considerations of historical honor and public harm. However, if street names function as necessary infrastructure for orientation and logistics, then renaming them imposes a distinct burden on residents: it forces them to update their navigational habits and administrative records, effectively binding them to a new narrative through practical necessity rather than voluntary consent. This raises the question of whether the functional embeddedness of a street name creates a stronger obligation to retain it for stability, or a stronger obligation to rename it to prevent the continuous harm of invoking a discredited figure in daily speech. The research seeks to determine if this functional layer alters the weight of standard ethical frameworks, such as harm-based, consent-based, and narrative-integrity-based approaches.

  Furthermore, the stakes extend to the concept of intergenerational obligation. Current residents inherit these names without consent, yet they are required to use them to participate in society. This creates a form of involuntary participation in a historical narrative. If the honoree is discredited, does the functional necessity of the name amplify the harm of that participation? Conversely, does the practical disruption of renaming constitute a harm that outweighs the symbolic benefit? By isolating the functional component of street names, this project aims to move beyond the binary of "keep" or "remove" and explore whether a principle of "semantic rupture" is required. This principle would suggest that replacement names should not simply swap one hero for another but should explicitly mark a discontinuity in the collective narrative, acknowledging the change rather than obscuring it. The outcome of this research could inform municipal policies on renaming, offering a framework that respects both the practical needs of logistics and the ethical demands of historical justice.

  2. Why existing answers and public debates leave the question genuinely open

  Current public debates and existing academic literature largely fail to distinguish between the ethics of renaming streets and removing statues, treating them as interchangeable acts of memorialization. This conflation leaves the specific ethical problem of navigational speech genuinely open. In public discourse, the argument often collapses into a binary conflict between historical preservation and social justice. Proponents of retention argue that removing names erases history, suggesting that discomfort is a necessary educational tool. Proponents of removal argue that honoring discredited figures causes present-day harm, particularly to marginalized communities. While these arguments are valid for statues, they do not account for the unique operational role of street names. A statue can be ignored; a street name must be spoken and written to function within the city. This distinction is rarely addressed in mainstream commentary, which tends to focus on the symbolic weight of the name rather than its practical utility.

  Academic discussions on memorialization often focus on the aesthetics of memory or the politics of public space, but they seldom analyze the linguistic and logistical mechanics of addressing systems. Philosophical treatments of monuments typically categorize them as expressive acts by the state, evaluating them based on what message they send to the public. However, this expressive model does not capture the coercive nature of street names. Residents do not choose to speak a street name; they are required to do so by the infrastructure of the state and the market. This coercive element introduces a consent-based ethical dimension that is absent in the debate over statues. Existing frameworks do not adequately explain whether this lack of consent strengthens the claim for renaming (to stop forced invocation) or weakens it (to avoid imposing administrative burdens). The literature remains silent on whether the practical discontinuity of renaming—where a street effectively vanishes from databases—creates a unique harm that differs from the physical removal of a statue.

  Moreover, the prevailing discourse lacks a nuanced approach to what should happen after removal. The default assumption is substitution: replacing a discredited figure with a credited one. This assumes that the function of the name is to honor someone, rather than to facilitate navigation. This approach fails to address the temporal asymmetry mentioned earlier: a renamed street instantly vanishes from maps, whereas a relocated statue can still be encountered. This vanishing act carries a risk of historical amnesia that is distinct from the musealization of a statue. Existing answers do not provide a framework for deciding when a name should be replaced with another hero versus when it should be marked as a rupture. The question remains open because no current model accounts for the dual nature of street names as both commemorative objects and practical coordinates. Without a taxonomy that separates these functions, ethical prescriptions remain vague, relying on intuition rather than structured analysis. This project seeks to fill that gap by constructing a conceptual framework that treats functional embeddedness as a morally relevant variable.

  3. The conceptual approach, the taxonomy of embeddedness, and why the standard alternatives are inadequate for this project

  The conceptual approach of this research is strictly analytical rather than empirical. Instead of surveying historical renaming campaigns or analyzing legal statutes, the project will construct a philosophical taxonomy of commemorative objects based on their degree of practical embeddedness. This taxonomy will categorize objects into three types: pure display, navigational label, and institutional address. Pure display objects, such as statues in parks, serve primarily representational functions. Navigational labels, such as street names, serve both representational and coordinative functions, binding residents into logistical networks. Institutional addresses, such as the names of government buildings or schools, occupy a middle ground, serving as identifiers for specific services but requiring less frequent invocation than street names. By mapping ethical frameworks onto this taxonomy, the research will test whether functional embeddedness systematically alters moral prescriptions.

  The project will apply three standard ethical frameworks across these categories: harm-based, consent-based, and narrative-integrity-based. A harm-based framework typically focuses on the psychological or social injury caused by honoring a discredited figure. For statues, this harm is symbolic. For street names, the harm is also linguistic, as residents are forced to invoke the figure in daily speech. A consent-based framework examines whether residents voluntarily participate in the commemoration. Statues allow for passive avoidance; street names require active usage. A narrative-integrity framework considers whether the object supports a coherent and just collective story. Here, the question is whether replacing a name with another hero preserves integrity or merely shifts the problem. The research will analyze how these frameworks yield different results when applied to navigational labels versus pure display objects. For instance, a harm-based approach might demand renaming a street to stop forced invocation, while a consent-based approach might resist renaming to avoid imposing administrative burdens on residents who did not choose the original name.

  Standard alternatives, such as historical surveys or legal framings, are inadequate for this project because they fail to isolate the conceptual variable of functional embeddedness. A historical survey of renaming campaigns would provide data on frequency and outcome but would not explain the underlying ethical mechanics. It would describe what happened, not why it should happen. Legal arguments about property rights or municipal authority focus on who has the power to rename, not whether they ought to. These approaches treat the street name as a static asset rather than a dynamic speech act embedded in logistics. By avoiding these alternatives, the project remains focused on the normative question: does the function change the obligation? The goal is to determine if the logistical nature of street names creates a unique category of moral concern that existing theories overlook.

  This conceptual work is necessary because current debates are stalled by category errors. Treating street names as statues ignores their role in emergency response and delivery networks. Treating them as mere infrastructure ignores their commemorative power. The taxonomy allows for a precise dissection of these roles. For example, if a street name is primarily a navigational label, the ethical weight might shift toward stability and clarity. If it is primarily commemorative, the weight might shift toward justice and representation. The research will explore whether these functions can be separated or if they are inextricably linked. By borrowing informally from theories of intergenerational obligation, the project will argue that inherited practical structures carry narrative burdens that outlive their originators. This approach avoids the trap of reducing the issue to either pure harm or pure preservation, instead offering a nuanced view of how practical necessity interacts with moral memory. The conceptual clarity gained here could resolve the talking-past-one-another dynamic observed in public debates.

  4. What a successful result would look like, including the conditions that would count as success versus failure or inconclusiveness

  A successful result for this research would be the establishment of a robust conceptual framework that demonstrates functional embeddedness is a morally relevant variable in the ethics of commemoration. Success would mean showing that the ethical prescriptions for renaming streets diverge systematically from those for removing statues when analyzed through harm, consent, and narrative-integrity frameworks. Specifically, the project would succeed if it can argue that the coercive nature of navigational speech creates a distinct obligation—either to rename to prevent forced invocation or to retain to prevent logistical harm—that does not apply to statues. The deliverable would be a clear articulation of why street names cannot be treated as mere monuments and how their dual function alters the moral calculus. This would provide a theoretical basis for policymakers to distinguish between symbolic removal and practical renaming.

  Another marker of success would be the validation of the "semantic rupture" principle. If the research can demonstrate that substituting one hero for another fails to address the ethical problem of inherited narrative, and that a marker of discontinuity is required, this would constitute a significant conceptual advance. Success would also involve showing that standard ethical frameworks yield contradictory or insufficient results when applied without accounting for functional embeddedness. For example, if a harm-based approach suggests renaming while a consent-based approach suggests retaining, the project would succeed by explaining this tension through the lens of logistics and navigation. The outcome would be a nuanced prescription that acknowledges the trade-offs rather than offering a simplistic solution.

  Failure or inconclusiveness would occur if the analysis reveals that functional embeddedness does not actually alter the ethical outcome. If the frameworks yield the same prescriptions for statues and street names regardless of their function, then the core hypothesis would be undermined. Inconclusiveness might also arise if the taxonomy proves too rigid to capture the complexity of real-world cases. For instance, if some statues serve navigational functions (e.g., "meet me at the Lincoln Statue") or some street names are purely symbolic (e.g., private roads), the categories might blur too much to be useful. Additionally, if the concept of "semantic rupture" cannot be clearly defined or operationalized, the project might fail to offer a practical alternative to substitution. Another risk is that the ethical frameworks themselves might be too contested to yield stable results. If harm, consent, and narrative integrity are interpreted too variably, the analysis might not produce a coherent conclusion.

  Ultimately, success is defined by conceptual clarity. The project does not need to solve every renaming case but must provide a tool for analyzing them differently. If the research can show that the logistics of addressing systems create a unique ethical bind—where residents are bound into a narrative they never chose—it will have achieved its goal. The result should be a framework that allows stakeholders to see why street names feel different from statues and why that difference matters morally. This would move the debate from intuition to structured argument, providing a basis for more informed decision-making in urban governance. The success of the project lies in its ability to make the invisible infrastructure of navigation visible as an ethical problem.

  5. Realistic scope for a six-month timeline, the deliverables expected, and an honest assessment of the biggest conceptual risk that could make the project too large

  For a six-month timeline, the scope must be tightly managed to ensure the conceptual work is completed without drifting into empirical case studies. The first month will be dedicated to refining the taxonomy of embeddedness and defining the three ethical frameworks. This involves clarifying the distinctions between pure display, navigational label, and institutional address, and ensuring the definitions of harm, consent, and narrative integrity are stable for the purpose of the analysis. The second and third months will focus on applying these frameworks to the taxonomy, testing how the prescriptions change across categories. This is the core analytical phase, where the arguments regarding functional embeddedness will be constructed. The fourth month will be devoted to developing the principle of semantic rupture, exploring what it means practically and ethically to mark a discontinuity rather than substitute a hero. The fifth month will involve drafting the final paper or proposal document, ensuring the arguments are coherent and the stakes are clearly articulated. The sixth month will be for revision and feedback, refining the language to ensure it is accessible to an interdisciplinary audience.

  The expected deliverables include a final research paper of approximately 4,000 to 5,000 words, suitable for an independent study or workshop pitch. This paper will outline the taxonomy, the application of ethical frameworks, and the argument for semantic rupture. Additionally, a set of conceptual diagrams or tables mapping the frameworks against the taxonomy may be produced to visualize the ethical divergences. A brief summary abstract will also be prepared to communicate the core findings to non-specialists. These deliverables are designed to be self-contained, requiring no external data collection or historical survey, fitting the conceptual nature of the project.

  The biggest conceptual risk is the potential expansion of the "functional embeddedness" category. There is a danger that almost any public object could be argued to have some functional use, blurring the line between display and navigation. If the taxonomy becomes too porous, the analysis loses its sharpness. For example, if a statue is used as a meeting point, does it become a navigational label? The project must rigorously defend the distinction to avoid scope creep. Another risk is the complexity of the "semantic rupture" concept. Defining what counts as a rupture versus a substitution could become a project in itself, potentially consuming the entire timeline. To mitigate this, the research will focus on clear examples, such as renaming a street to a number or a neutral descriptor versus another person's name. Finally, there is the risk of philosophical abstraction detached from reality. Without empirical grounding, the arguments might seem speculative. The project must remain grounded in the practical realities of logistics and addressing systems to maintain relevance. By keeping the focus on the conceptual distinction rather than specific historical cases, the project can remain within scope while delivering a meaningful contribution to the debate.
