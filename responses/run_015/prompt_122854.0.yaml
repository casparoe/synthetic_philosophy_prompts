answer: |-
  ### Essay Question (45 Minutes, 25 Marks)

  **Question:**
  The standard "Chairman" vignette demonstrates an asymmetry in intentionality judgments based on moral valence. However, simply attributing this to "moral bias" may describe the data without explaining the underlying cognitive mechanism. 

  Consider the following four variations:
  1.  **Non-Moral Norm:** A student picks a playlist to maximize dancing, knowing it violates a neutral administrative rule about lyrics after 9pm. She doesn't care about the rule.
  2.  **Omission:** A Chairman cancels a program to save money, knowing this will help/harm the environment. He doesn't care about the environment.
  3.  **Algorithm:** Programmers design a scheduling algorithm solely to minimize room clashes. They know it will foreseeably cause students to miss buses. They don't care.
  4.  **Counterfactual Opposition:** A Chairman implements a policy for profits. He knows it will help the environment, *hates* that it helps the environment, actively tries to mitigate the environmental help, but fails to stop it.

  **Task:**
  Evaluate which theoretical framework best accounts for the pattern of intuitions across these four cases. Specifically, address whether the asymmetry is driven by (a) moral blame/praise, (b) broader normative expectations, or (c) the agent's attitude toward the outcome (counterfactual dependence). Explain why the "he knew and did it anyway" explanation is insufficient on its own.

  ***

  ### Model Answer (650 Words)

  The core puzzle of the side-effect effect is not merely that moral valence shifts intentionality judgments, but *how* it does so. A superficial explanation claims people conflate "intentional" with "blameworthy." While this captures the standard Chairman data, it fails to explain the mechanism, effectively relabeling the datum rather than analyzing it. If "intentional" just meant "blameworthy," we would not need the concept of intentionality at all. To distinguish the theories, we must look at where moral blame is absent or altered.

  Case 3 (the Algorithm) is the strongest test against the "Moral Blame" hypothesis. We cannot morally blame software code, and the programmers are distant from the immediate output. If participants still attribute the side effect (missed buses) as "intentional" on the part of the designers, it suggests the judgment is not about immediate moral condemnation of an actor, but about the *relationship between the agent's goals and the outcome*. If participants deny intentionality here, it suggests the effect requires a unified moral agent capable of receiving blame. Most experimental data suggests intentionality is still attributed to the designers, implying the mechanism is about *foreseeability + acceptance*, not just hot-blooded blame.

  Case 1 (Non-Moral Norm) tests whether the effect is specifically *moral* or generally *normative*. If participants say the student "intentionally" broke the admin rule, it demonstrates that the asymmetry is driven by deviation from any expected norm, not just moral ones. This supports the "Normative Expectation" theory: we judge an action intentional if the agent accepts a deviation from the default expected course of events to achieve their goal. If they say "unintentional," it isolates morality as the unique trigger. Evidence suggests non-moral norms can trigger the effect, though weaker than moral ones, indicating morality is a subset of a broader normative reasoning process.

  Case 2 (Omission) challenges causal theories. In the standard vignette, the Chairman actively causes harm. In the omission variant, he allows it. If the asymmetry persists (i.e., intentionally allowing harm vs. unintentionally allowing help), it proves that causal force is secondary to the agent's stance toward the norm. It reinforces that the judgment is about the agent's *reasons*, not just their physical impact.

  Case 4 (Counterfactual Opposition) directly addresses the "he knew and did it anyway" confusion. In the standard harm case, people say the Chairman acted intentionally even though he would have done it anyway (the harm wasn't his reason). However, in Case 4, the agent actively *opposes* the side effect. If participants say this is *not* intentional, it proves that "knowledge + occurrence" is insufficient. There must be a lack of active opposition. This clarifies the counterfactual condition: an agent acts intentionally if they do not try to prevent the side effect, even if it isn't their primary goal. The standard Chairman is judged intentional because he was *indifferent*, not because he was *motivated* by the harm.

  Therefore, the "Moral Blame" explanation is insufficient because it cannot handle Case 3 (non-moral agents) or Case 1 (non-moral norms) without stretching the definition of blame. The "Knowledge + Acceptance" explanation is better but requires the nuance from Case 4 to show that active opposition negates intentionality.

  The best account is a **Reasons-Responsiveness** or **Normative** view. We judge actions as intentional when the agent accepts a norm-violating side effect as the cost of their goal. In the harm case, harming is bad (norm violation), so accepting it signals intentionality. In the help case, helping is good (norm conformity), so accepting it signals nothing special. The asymmetry arises because "intentional" is not a neutral description of causal psychology; it is a tool we use to mark when an agent has taken responsibility for a deviation from how things ought to be. This explains why we attribute intentionality even when the agent claims they "didn't care"—because by not caring about a norm violation, they have already taken responsibility for it.

  ***

  ### Marking Scheme (25 Marks Total)

  **1. Critique of the "Moral Blame" Hypothesis (5 Marks)**
  *   **5:** Explicitly argues that "blame" is a relabeling of the data, not an explanation. Uses Case 3 (Algorithm) to show intentionality can exist without a target for moral blame.
  *   **3:** States that blame is involved but doesn't explain why it's insufficient.
  *   **0-2:** **TRAP:** Claims "People just mean blameworthy when they say intentional." (Cap score at 3/25 total if this is the only argument made).

  **2. Analysis of Normativity vs. Morality (Case 1) (5 Marks)**
  *   **5:** Identifies Case 1 as a test of whether the effect is *specifically* moral or *generally* normative. Explains that if "intentional" applies to the admin rule, the mechanism is about norm-deviation, not just ethics.
  *   **3:** Describes the case but fails to link it to the "Normative Expectation" theory.
  *   **1:** Merely summarizes the vignette.

  **3. Agency and Causation (Cases 2 & 3) (5 Marks)**
  *   **5:** Distinguishes between active causation and omission (Case 2) and human vs. system agency (Case 3). Notes that if the effect persists, the mechanism relies on the *designer's attitude*, not the physical act.
  *   **3:** Discusses omission or algorithm but treats them as identical to the standard case without nuance.
  *   **1:** Confuses the algorithm's intent with the programmer's intent.

  **4. The Counterfactual Condition (Case 4) (5 Marks)**
  *   **5:** **CRITICAL DISTINCTION:** Uses Case 4 to show that "knowledge + occurrence" is not enough. Explains that *indifference* allows intentionality, but *active opposition* kills it. This solves the "he would have done it anyway" puzzle.
  *   **3:** Notes that opposition matters but doesn't link it to the counterfactual reasoning problem.
  *   **1:** Ignores Case 4.

  **5. Synthesis and Conclusion (5 Marks)**
  *   **5:** Proposes a unified view (e.g., Normative/Reasons-Responsiveness). Explains that "intentional" marks responsibility for norm deviations.
  *   **3:** Summarizes the cases without a unified theoretical conclusion.
  *   **1:** Restates the introduction.

  **Grade Boundaries:**
  *   **A (20-25):** Hits the "Critical Distinction" in section 4 and avoids the "Blame Trap" in section 1. Synthesizes cases into a theory of normativity.
  *   **B (14-19):** Correctly analyzes most cases but treats "Blame" as a valid final explanation or misses the nuance of Case 4 (Counterfactuals).
  *   **C (10-13):** Describes the vignettes well but falls for the "Intentional = Blameworthy" trap.
  *   **D/F (0-9):** Fails to engage with the specific cases or misunderstands the basic Knobe asymmetry.

  **Examiner's Note on the "Blame Trap":**
  Many students will argue that people are simply "confused" and using "intentional" to mean "bad." This is the classic C-level answer. To get an A, students must explain *why* the concept is structured that way (e.g., to assign responsibility for norm violations) or prove that blame isn't necessary (using the Algorithm/Non-moral cases). If a student writes a brilliant essay that concludes "It's just moral bias," cap their mark at 13/25. They have described the effect, not explained the concept.
