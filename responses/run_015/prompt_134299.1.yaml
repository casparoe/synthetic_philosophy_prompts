  # Seminar Plan: Judgment Aggregation and the Discursive Dilemma

  ## 1. Dependency Sequence
  To prevent the seminar from devolving into a general discussion of voting fairness, you must secure four logical distinctions in strict order. Do not proceed to the next step until the previous one is accepted by the room.

  1.  **Judgments vs. Preferences:** Secure the distinction that social choice theory typically aggregates *orderings* (preferences), whereas this seminar aggregates *truth-apt propositions* (judgments). Students must accept that the group is attempting to form a consistent belief set, not merely rank options.
  2.  **Proposition-Wise Majority Voting (PwMV):** Establish the aggregation mechanism. The group decides each proposition independently by simple majority. This must be distinguished from "package voting" (voting on entire worldview sets) to isolate the source of the paradox.
  3.  **Logical Interconnection (The Agenda):** Define the constraint. The propositions are not disjoint; they form a logical structure (e.g., $p, q, r$ where $r \iff p \land q$). Without this entailment, independent voting cannot generate inconsistency.
  4.  **Collective Deductive Closure:** Define the success condition. The collective set of judgments must be logically consistent and closed under entailment. This frames the outcome not as a "tie" but as a violation of the laws of logic by the collective agent.

  ## 2. Carrying Case
  **Scenario:** A three-person Urban Planning Committee deciding on a Wetland Development Project.
  **Propositions:**
  *   $p$: "The project poses no significant ecological risk."
  *   $q$: "The project is in full legal compliance."
  *   $r$: "Approve the project."
  **Logical Constraint:** The committee charter states $r \iff (p \land q)$. Approval is permitted if and only if both risk is low and compliance is met.

  **Required Properties:**
  *   **Interdependent Premises:** $p$ and $q$ are distinct factual/legal claims, but $r$ is logically derivative, not an independent preference.
  *   **Transparent Logical Connection:** The biconditional relationship is explicit in the charter, not implied by policy nuance.
  *   **Binary Individual Judgments:** Members must accept or reject each proposition (True/False); no abstentions or degrees of confidence.

  **Excluded Elements:**
  *   **No Hidden Chairperson:** No single member has veto power; all votes weigh equally.
  *   **No Probabilistic Credences:** Do not allow "80% sure"; this introduces Bayesian aggregation complexities outside the scope.
  *   **No Strategic Preference Revelation:** Assume members vote their sincere judgments; do not introduce game-theoretic manipulation.

  **Why Not the Standard Jury Framing:**
  Avoid the classic "negligence, causation, damages" legal trial scenario. For philosophy graduates, legal doctrines often conflate logical conjunction with evidentiary burdens (e.g., "preponderance of evidence" applies to the whole claim, not necessarily each element independently). Furthermore, legal liability is sometimes treated as a holistic judgment rather than a strict truth-functional output. The wetland case isolates the *logic* from the *law*, preventing students from debating legal theory instead of aggregation rationality.

  ## 3. Misconception Trajectory
  Students will attempt to resolve the paradox using intuitive fixes. You must intercept these at specific points with precise countermoves.

  1.  **Misconception:** "Weighted or supermajority voting resolves the conflict."
      *   **Intervention Point:** Immediately after displaying the contradictory outcome (Majority says Yes to $p$, Yes to $q$, No to $r$).
      *   **Countermove:** "Changing the quota changes who wins, but proposition-wise voting on connected issues will still generate some profile that yields a contradiction."

  2.  **Misconception:** "The problem only arises with strictly binary premises."
      *   **Intervention Point:** During the discussion of uncertainty or credences.
      *   **Countermove:** "Granularity shifts the contradiction from binary inconsistency to probabilistic incoherence, preserving the rationality threat."

  3.  **Misconception:** "The dilemma is an argument for overriding collective judgment with expert or authoritarian decision-making."
      *   **Intervention Point:** In the final synthesis, when discussing solutions.
      *   **Countermove:** "Dictatorship ensures rationality by abolishing the 'collective' in collective rationality."

  ## 4. Check for Understanding
  Do not ask them to reproduce the paradox. Ask them to identify why a similar-looking scenario *fails* to generate it, testing their grasp of *collective rationality* versus *democratic legitimacy*.

  **Scenario Description:**
  Present a modified case: A three-person committee votes on $p$, $q$, and $r$ (where $r \iff p \land q$). They use a **Conclusion-Based Procedure**: they discuss $p$ and $q$, but only vote on $r$. The majority rejects $r$. The collective judgment set is $\{ \neg r \}$. The premises $p$ and $q$ are not collectively judged, only individually held.

  **Diagnostic Criterion:**
  Students must diagnose that this scenario avoids the Discursive Dilemma because the collective judgment set is logically consistent (trivially closed), meaning **collective rationality is preserved** even if **democratic legitimacy is compromised** (because members who accepted $p$ and $q$ feel their reasoning was ignored). If they claim this is still a paradox, they have not distinguished rationality from legitimacy.

  ## 5. Omitted Scope
  Explicitly name these topics as out of scope to manage expectations and maintain focus on the core logical threat.
  *   The full formal taxonomy of aggregation rules (e.g., distance-based, sequential priority).
  *   The general impossibility results for groups larger than three (List & Pettit Theorem generalizations).
  *   Any proof sketch using lattice-theoretic machinery or ultrafilter theory.

