answer: |-
  # ADVERSARIAL COLLABORATION MEMO: MORAL REASONING
  **Parties:** Roommate A (Generalist Leanings) & Roommate B (Particularist Leanings)
  **Date:** [Today]
  **Subject:** Clarifying the Particularism/Generalism Dispute

  We agree that our previous discussion suffered from definitional drift. This document locks in our shared premises and isolates the exact points of divergence. We agree not to cite external literature but to rely on the arguments generated in our conversation.

  ### I. AGREED CLAIMS (COMMON GROUND)
  *We both endorse the following propositions. If either of us feels tempted to deny these during future arguments, we agree to pause and re-read this section.*

  1.  **Moral Reasoning is Not Algorithmic:** Neither of us believes moral judgment is a matter of plugging facts into a rigid formula to spit out a verdict. We agree that judgment requires sensitivity to nuance.
  2.  **Feature-Sensitivity:** We agree that specific features of a situation (e.g., "causing pain," "breaking a promise") generally carry moral weight. We disagree on *how* they carry it, not *that* they carry it.
  3.  **Defeasibility:** We agree that a feature that counts in favor of an action in one case (e.g., "it makes me happy") can count against it in another (e.g., "it is sadistic pleasure"). We agree principles must account for this or dissolve.
  4.  **The Requirement of Reasons:** We agree that moral agents must be able to give reasons for their actions to others. "Because I felt like it" is not an acceptable moral justification in serious cases.
  5.  **Bad Agents, Right Acts:** We agree that an agent can perform the objectively right action for the wrong reasons (e.g., out of fear rather than duty). We disagree on whether this undermines the *principle* or just the *praise*.

  ---

  ### II. DISAGREEMENTS TABLE (THE CRUXES)
  *The following table isolates the three specific points where our models diverge. We have phrased the positions so that each side recognizes their own view without feeling straw-manned.*

  | CRUX | GENERALIST POSITION (Roommate A) | PARTICULARIST POSITION (Roommate B) | SHARED HYPOTHETICAL / ARGUMENT | PREDICTIONS (What each side expects the case to show) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Context-Dependence**<br>*(Noise vs. Constitutive)* | Contextual variation is **noise** around a stable signal. Principles describe the default valence of features; exceptions are handled by higher-order principles (e.g., "unless it causes harm"). | Contextual variation is **constitutive**. A feature's moral valence is determined entirely by the context; there is no "default" setting independent of the holistic situation. | **The "Shifting Lie" Case:**<br>Lying to a murderer at the door vs. Lying to a friend about a surprise party.<br>*(Both agree the act is "Lying" in both cases.)* | **Generalist:** We can formulate a principle ("Do not lie") that survives if we add enough caveats ("...unless it saves a life").<br>**Particularist:** Adding caveats changes the definition of the act. The "Lying" in case 1 is morally distinct from "Lying" in case 2; no single principle covers both without becoming vacuous. |
  | **2. Shadowed-Virtue Cases**<br>*(Canceling Biases)* | The rightness of an act is tracked by **conformity to principle**, regardless of the agent's psychological chaos. If the act aligns with the principle, the principle is explanatory. | The rightness of an act requires a **salient moral feature** to function as a reason. If the act results from non-moral biases canceling out, there is no moral reason present, only a coincidental outcome. | **The "Counter-Vailing Vices" Case:**<br>Agent donates to charity. Bias A (Vanity) pushes to donate. Bias B (Spite toward a rival who hates the charity) pushes to donate. <br>*(Note: We agreed to treat these as morally neutral/negative biases that align to produce a "Right Act" with no virtuous motive.)*<br>*Correction per prompt:* **The "Canceling Bias" Case:** Agent does Right Act. Bias A pushes to Act (for bad reason). Bias B pushes to Not Act (for bad reason). They cancel morally, but Act occurs due to habit. | **Generalist:** The act is Right because it instantiates Beneficence. The messy psychology is irrelevant to the *truth* of the principle.<br>**Particularist:** The act is Right, but the principle of Beneficence is not *doing any work*. There is no salient feature of "need" tracking the action. This proves principles are post-hoc labels, not drivers. |
  | **3. Salience Weights**<br>*(Smuggled Generalities)* | When a particularist says "Feature X is more salient here," they are secretly invoking a **higher-order principle** about weighting. It is a generality in disguise. | Salience is **perceptual**, not propositional. It is like recognizing a face. You can't reduce "salience" to a rule without losing the phenomenon. | **The "Art Critic" Analogy:**<br>A critic says "This brushstroke is too heavy." Is this a rule ("Heavy strokes are bad") or a perception ("This stroke is bad *here*")? | **Generalist:** If the critic is consistent, they are following a rule. If they can't state the rule, they are unreliable. We can codify the weights.<br>**Particularist:** The critic can be consistent without rules. Codifying the weights kills the sensitivity. The "rule" will fail on the next new piece of art. |

  ---

  ### III. OPERATIONAL DEFINITIONS FOR FUTURE ARGUMENTS
  *To prevent talking past each other, we agree to use these terms strictly as defined below:*

  *   **"Principle":** (Generalist) A normative generalization that holds across cases, even if defeasible. (Particularist) A codified rule that claims to determine rightness prior to context.
  *   **"Salience":** (Generalist) The measurable weight of a feature within a principle. (Particularist) The holistic perception of a feature's relevance in *this* specific context.
  *   **"Explanation":** (Generalist) Subsuming an act under a general category. (Particularist) Identifying the specific feature(s) that motivated the act in situ.

  ### IV. NEXT STEPS
  1.  We will not restart the debate until we have both signed off that this document accurately reflects our positions.
  2.  If we encounter a new case, we will fill out a mini-version of Section II (Table) before discussing it verbally.
  3.  We acknowledge that the "Shadowed-Virtue" case remains the strongest test for whether principles are descriptive or explanatory. We will return to this if stuck.

  **Signed:** ____________________ (Generalist) & ____________________ (Particularist)
