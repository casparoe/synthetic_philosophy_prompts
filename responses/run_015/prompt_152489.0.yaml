      *   *Path Dependence:* If Choice A leads to Trajectory X and Choice B leads to Trajectory Y, and X $\neq$ Y, then the specific architecture matters.
      *   *Temporal Lag:* If Newton's notation delayed British mathematics by 100 years compared to the Continent, then the "functional equivalence" claim is false regarding *rate* and *direction* of progress.
      *   *Conceptual Blindspots:* If Wallace rejected sexual selection and Darwin didn't, and sexual selection turned out to be crucial, then the theories weren't functionally equivalent.
      *   *Alternative Possibilities:* If a viable alternative existed (e.g., Lamarckism, Fluxions vs. Limits) that was *not* taken but could have been, does that undermine inevitability? (Maybe not, if the claim is about what *was* taken).
