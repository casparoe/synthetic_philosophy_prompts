  8.  **Final Polish:** Ensure tone is academic, rigorous, and directly answers the prompt's specific questions (Fatal vs. Awkward, Strength vs. Emptiness). (Check: Did I address the "generation" constraint? Yes, need to emphasize the time window).

  9.  **Final Output Structure:**
