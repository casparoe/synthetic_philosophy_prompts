      *   *Awkward (Absorbable):* Minor delays, biographical quirks that don't change the endpoint, notational preferences that eventually converge. A structuralist can say, "Sure, it took 20 years longer, but the *structure* was inevitable."
      *   *Fatal (Damaging):* Evidence that the specific formulation *precluded* certain future developments (e.g., Newton's fluxions actively hindered analysis of complex functions that Leibniz's $dy/dx$ facilitated). Evidence that the "alternative" discovery lacked a core mechanism essential for the theory's success (e.g., Wallace's lack of a heredity mechanism made his version non-viable as a research program). Evidence of *divergent* trajectories that didn't reconverge.

  5.  **Addressing Unfalsifiability (The "Protection" Question):**

      *   If every divergence is called "surface noise," the theory is tautological.
      *   To be robust, it must specify *what counts as structure* vs. *noise* beforehand.
      *   If the protection comes from moving the goalposts (e.g., "It was inevitable, just 50 years later"), it's a vice.
      *   If the protection comes from a robust definition of "functional equivalence" (e.g., predictive power, generative capacity), it's a virtue.

