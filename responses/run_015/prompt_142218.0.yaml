  2. On the morning of the vote, the Principle prescribes setting credence in a Clinton victory equal to the modeled chance, conditional on accepting that model as authoritative. After the result, the chance collapses to zero or one, requiring credence to match the actual outcome rather than the prior forecast.
  3. It correctly validates the forecasters against the charge of being 'wrong' by showing that assigning a high probability to an event is logically compatible with that event failing to occur. It also clarifies why rational agents should not have been certain of victory despite the favorable odds.
  4. The Principle is silent on whether single-case political events possess objective chances at all, treating model outputs as metaphysical facts rather than epistemic estimates. It also fails to address how agents should aggregate conflicting models when the 'chance' itself is a matter of dispute among experts.
  5. The episode offers no evidence against the Principle itself, since the complaint targets model calibration rather than the normative link between chance and credence. Your mixture puzzle identifies a genuine gap regarding higher-order uncertainty, as deferring to a weighted average of models differs normatively from averaging the credences each model demands.
