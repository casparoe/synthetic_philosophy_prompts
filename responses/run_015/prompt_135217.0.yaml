o magnetic monopoles in the laboratory I am not content to ground in anything at all, and I cannot see what separates the two. (7) That the two-dimensional Ising model has a phase transition at a definite temperature I take to be a fact grounded, if in anything, in the mathematical structure alone, with physical samples inheriting it by instantiation; I am no Platonist, but I balk at grounding a mathematical fact in physical ones. (8) Finally, my professional instinct that "more fundamental" means "smaller scale" has collapsed on me: in the renormalization-group picture the large-scale fixed point is the robust, explanatory item, and the microscopic details are what wash out. Relatedly, the electron's mass is a brute parameter within our best theory and is also said to be explained by its coupling to the Higgs field, so "fundamental" in the physicist's sense and "ungrounded" in yours seem to me to come clean apart.

