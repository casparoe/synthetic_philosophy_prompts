  To extract a principle tight enough for application, we must decouple **Ontological Grounding** (what makes a fact obtain) from **Explanatory Priority** (what makes a fact intelligible). Standard metaphysics often conflates these; your physics practice correctly separates them.

  Here is the principle that delivers your verdicts, followed by the necessary adjustment to your framework and the prediction for the early universe.

  ### The Principle: Scale-Relative Determination and RG-Fundamentality

  **1. Grounding (Ontological):** A fact $F$ is grounded in a set of facts $G$ at scale $S$ if and only if $G$ **fixes the truth value** of $F$ within the domain of validity of the effective theory describing $S$.
  *   *Implication:* Grounding is scale-relative. Micro-states ground macro-states at the microscopic scale of description. Macro-structures ground macro-behaviors at the macroscopic scale.

  **2. Fundamentality (Metaphysical):** A fact or structure $X$ is fundamental if and only if $X$ is **invariant under coarse-graining** (RG flow).
  *   *Implication:* Fundamentality is robustness. Details that "wash out" are less fundamental than the fixed points that remain.

  **3. Explanation:** Explanation tracks **Invariance**, not necessarily Grounding.
  *   *Implication:* A fact can be ontologically grounded in micro-details but explanatorily grounded in macro-invariants.

  ---

  ### Application to Your Verdicts

  This principle reconciles your eight cases without forcing you to abandon your physical instincts:

  *   **(1) Temperature:** Grounded in microstate (fixes truth value in Stat Mech). Not fundamental (washes out under coarse-graining; depends on specific kinetic energies). **Verdict Saved.**
  *   **(2) Ferromagnetic Phase:** Grounded in microstate (ontologically), but the *type* of phase is identified by symmetry. **Verdict Saved.**
  *   **(3) Critical Exponents:** Ontologically grounded in the microstate (the sample must be made of *something*), but **Explanatorily grounded** in the RG fixed point (symmetry, dimensionality). The exponent is invariant under changes to the micro-details. This resolves the tension: the micro-details *ground* the existence of the exponent, but the *value* is explained by the invariant structure. **Verdict Saved (with distinction).**
  *   **(4) Phonons:** Real (play a causal role in the effective theory). Grounded in atomic motion (ontologically), but not "nothing but" atoms because the phonon description is the invariant, robust structure under coarse-graining, whereas the specific atomic positions are the variant details. **Verdict Saved.**
  *   **(5) Gauge Potentials:** Surplus structure is **not invariant** (changes under gauge transformation). Therefore, it is not fundamental and, strictly speaking, not real (grounded in nothing). Its explanatory utility (Aharonov–Bohm) arises because the *holonomy* (the gauge-invariant loop integral) is the actual ground. **Verdict Saved.**
  *   **(6) Negative Results:** "No superconductivity" is a local fact grounded in the specific micro-history (a specific trajectory in phase space). "No monopoles" is a global constraint. If monopoles are permitted by the laws but absent in history, it is grounded in history. If they are forbidden by the laws, it is a fundamental law (invariant). Your resistance suggests you suspect the latter. **Verdict Nuanced.**
  *   **(7) Mathematical Facts:** Mathematical structures are the space of possible RG fixed points. They are grounded in mathematical consistency, not physical instantiation. Physical samples inherit them. **Verdict Saved.**
  *   **(8) Fundamentality vs. Scale:** "Fundamental" in physics (RG fixed point) $\neq$ "Ungrounded" in metaphysics (brute). The electron mass is a parameter in the Lagrangian (grounded in the Higgs coupling), but the Higgs mechanism itself is an RG-invariant structure. **Verdict Saved.**

  ### The Necessary Surrender

  You asked which verdict to surrender if a single account cannot be found. The principle above saves them all, but it requires you to surrender a metaphysical assumption implicit in your worry about (3):

  **Surrender the Transitivity of Explanation through Grounding.**

  You feel a pull between (2) and (3) because you assume that if Micro grounds Phase, and Phase determines Exponent, then Micro must explain Exponent. The RG picture shows this is false. The micro-details are **screened off**.
  *   **Cost:** You must accept that grounding is not always explanatory. You can say: "The microstate makes the exponent exist (grounding), but the symmetry tells us why it has *this* value (explanation)." This is a standard move in contemporary metaphysics (e.g., Gideon Rosen), but it contradicts the intuition that "to ground is to explain."

  ### Prediction: The Early Universe Entropy

  Applying the **Invariance Principle** to your specific question about the low entropy of the early universe:

  1.  **Is it Fundamental?**
      *   **No.** Low entropy is a specific, highly contingent state. It is **not invariant** under coarse-graining. If you perturb the initial conditions slightly, the entropy changes. It is not a fixed point of the dynamics; it is a boundary condition. In your RG terms, it is part of the "microscopic details" of the universe's history that one might hope to wash out, but cannot because it sets the arrow of time.

  2.  **Is it Grounded or Brute?**
      *   It is **Grounded** in the specific history of the universe (the trajectory of the cosmic state vector). It is analogous to your "no superconductivity" verdict (6): a fact about a specific system's history grounded in laws + initial conditions.
      *   However, the **Initial Condition itself** (the fact that the universe started in *this* low-entropy state rather than a high-entropy one) is **Brute**.

  3.  **What does "Brute" mean here?**
      *   It means **Ungrounded**, not merely "not derived."
      *   If it were merely "not derived within any theory we presently possess," it would be a placeholder for future physics.
      *   If it is brute in the RG sense, it means there is **no deeper invariant structure** that necessitates it. It is a "cosmic accident" required to get the RG flow (time) started.
      *   **Prediction:** Calling it brute means asserting that there is no law (invariant) that fixes the initial entropy. It is a **boundary constraint** on the space of possible histories.

  ### How to Apply This to New Cases

  When you encounter a new case in the reading group, apply this three-step test:

  1.  **The Coarse-Graining Test:** If I zoom out (average over details), does this fact persist?
      *   Yes $\rightarrow$ Candidate for Fundamentality/Reality (e.g., Phonons, Exponents).
      *   No $\rightarrow$ Derivative/Description-Dependent (e.g., Gauge potentials, specific atomic positions).
  2.  **The Determination Test:** Within the effective theory at this scale, does fact $A$ fix fact $B$?
      *   Yes $\rightarrow$ $A$ grounds $B$ *at this scale*.
  3.  **The Invariance Test:** Does the *value* of $B$ depend on the specific details of $A$, or only on the structural symmetries of $A$?
      *   Specific Details $\rightarrow$ Explanation is Micro (e.g., Temperature).
      *   Structural Symmetries $\rightarrow$ Explanation is Macro (e.g., Critical Exponents).

  ### Summary

  Your instinct that "fundamental" means "smaller scale" collapsed because physics discovered that **robustness** is a better marker of reality than **size**.

  *   **Grounding** is the relation of **scale-relative determination**.
  *   **Fundamentality** is the property of **RG-invariance**.
  *   **The Early Universe:** Low entropy is a **grounded fact** (in the history) but the **initial condition is brute** (ungrounded by any deeper law).

  You need not surrender your verdicts, only the assumption that the grounding relation must carry explanatory weight across scales. The micro-ground makes the macro-fact *real*; the macro-structure makes it *intelligible*.
