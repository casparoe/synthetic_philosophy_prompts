answer: |-
  National character is coherent only if treated as a performative institutional script, not a psychological essence. An adequate theory must explain how states coordinate populations without reducing traits to biology or ignoring historical fluidity. Essentialism fails empirical constraints; pure statistical descriptivism misses the normative force. The winning framework treats character as a bureaucratic technology that sticks through institutional reinforcement, not individual minds.

  Non-negotiables include accommodating historical change and forbidding individual prediction; prioritizing subnational regions over state boundaries is merely a camp preference. The theory must sharply distinguish statistical clustering from normative stereotypes and descriptive observations from prescriptive demands. It must account for diaspora continuity without territory and pre-state cohesion without bureaucracy. Crucially, under the performative script framing, it must explain why the script sticks via institutional coordination rather than internal belief. Empirical constraints from cross-cultural psychology and generational shift are hard limits; violating them renders the theory obsolete. The script must function even when citizens don't personally identify with it, relying on administrative enforcement rather than shared soul.

  Essentialism fails non-negotiables: it violates historical change and collapses group/individual distinctions, rendering it empirically dead. Descriptivism meets empirical constraints but struggles with the performative script's normative force and prescriptive uses, lacking explanatory power for coordination. Constructivism best handles the bureaucratic script framing and historical fluidity but risks overdetermining state power over subnational regions. Only a constructivist-institutional hybrid satisfies the requirement to explain coordination without psychological reductionism, though it must guard against ignoring statistical realities.
