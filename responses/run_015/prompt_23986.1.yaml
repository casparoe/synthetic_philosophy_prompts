answer: |-
  1. **The Dependency Claim**

  The traditional empiricist project seeks to naturalize the *a priori* by grounding it in analyticity. The strategy is to claim that *a priori* knowledge is possible because it is merely knowledge of analytic truths, where an analytic truth is one true in virtue of meaning alone, independent of fact. Quine's first conceptual move is to demonstrate that this strategy is viciously circular because the notion of 'analyticity' is not explanatorily prior to the notions of 'necessity' or 'the *a priori*'; rather, they are mutually dependent intensional notions.

  Quine observes that the extension of 'analytic' is standardly taken to coincide with the extension of 'necessary' (true in all possible worlds) and 'knowable *a priori*' (knowable independently of experience). If we attempt to define analyticity, we inevitably rely on one of these cognate notions. For instance, to say a statement is analytic is often to say it is *necessarily* true. But 'necessity' is itself an obscure modal notion that cries out for the very explanation analyticity was supposed to provide. Alternatively, if we define analyticity epistemically—as a statement whose falsity is inconceivable or whose truth is guaranteed without empirical check—we have simply invoked the *a priori*.

  The critical presupposition here is that a successful philosophical analysis must reduce the obscure to the clear. If 'analytic', 'necessary', and '*a priori*' are co-extensive, defining one in terms of another yields no explanatory gain. Quine argues that the empiricist wants analyticity to do the heavy lifting of explaining how *a priori* knowledge is compatible with empiricism. However, if analyticity itself can only be characterized by appealing to necessity or *a priori* knowability, the project collapses. We are left with a cluster of intensional notions that stand or fall together. Consequently, we cannot use analyticity to validate the *a priori* without begging the question, because the coherence of analyticity presupposes the coherence of the *a priori*. The distinction is not independent; it is parasitic on the very modal and epistemic distinctions it was meant to ground.

  2. **The Regress**

  Having blocked the modal/epistemic escape route, Quine turns to the semantic definition: a statement is analytic if it can be turned into a logical truth by substituting synonyms for synonyms. This shifts the burden to explaining 'synonymy'. Quine demonstrates that any attempt to explicate synonymy without presupposing analyticity results in a circle or a regress.

  The argument proceeds by testing criteria for synonymy. The most promising candidate is interchangeability *salva veritate* (substitutability without change of truth value).
  *Step 1:* We propose that two expressions are synonymous if they are interchangeable in all contexts without altering the truth value of the sentences containing them.
  *Step 2 (The Extensionality Objection):* Quine notes that in a purely extensional language, this criterion is too weak. 'Creature with a heart' and 'creature with kidneys' are co-extensive and thus interchangeable *salva veritate* in an extensional language, yet they are not synonymous. Co-extension does not guarantee synonymy.
  *Step 3 (The Intensional Escape):* To fix this, we must require interchangeability in *all* contexts, including intensional ones (e.g., within the scope of 'necessarily'). Thus, 'bachelor' and 'unmarried man' are synonymous because 'Necessarily, all bachelors are unmarried men' is true.
  *Step 4 (The Circularity):* But to make this move, we must presuppose we understand 'necessarily'. As established in the dependency claim, 'necessarily' is cognate with 'analytic'. We have therefore defined synonymy via necessity, and necessity via analyticity. We are back where we started.

  Quine also considers defining synonymy via definition (dictionary) or convention. He argues that dictionaries report antecedent usage; they do not legislate it. They record that 'bachelor' is *used* as synonymous with 'unmarried man', but this merely pushes the question back to why that usage holds. Is it a convention? If so, it is arbitrary. If it is based on shared meaning, we must explain 'meaning'. But 'meaning' is itself an intensional entity whose identity conditions rely on synonymy. To appeal to 'meanings' as entities that ground synonymy is to reify the problem, not solve it. The regress shows that we cannot cash out the semantic notion of analyticity in behavioral or extensional terms without smuggling in the very modal or intensional notions we sought to explain.

  3. **The Confirmation Story**

  The second dogma of empiricism is reductionism: the belief that each meaningful statement is equivalent to some logical construct upon terms that refer to immediate experience. This dogma supports the analytic-synthetic distinction by suggesting that synthetic statements have specific empirical content that can confirm or falsify them individually, whereas analytic statements have no empirical content.

  Quine replaces reductionism with confirmation holism. The unit of empirical significance is not the individual sentence but the entire theory (or a substantial fragment thereof). When a recalcitrant experience occurs, it impinges on the web of belief as a whole. We have a choice of which statements to revise to accommodate the anomaly.
  *Premise 1:* Any statement can be held true come what may, if we make drastic enough adjustments elsewhere in the system.
  *Premise 2:* Conversely, no statement is immune to revision, not even the laws of logic.

  This undermines the analytic-synthetic distinction by removing the *qualitative* difference in how sentences relate to experience. The traditional view holds that analytic sentences are immune to empirical revision because their truth is secured by meaning. Quine argues that their immunity is merely pragmatic. We protect logical and mathematical truths (the center of the web) not because they are analytic, but because revising them would cause maximum disruption to the rest of our scientific framework. It is a matter of degree, not kind.

  For the theorems of logic and mathematics, this matters profoundly. If the boundary between meaning and fact is blurred, then a revision to logic (e.g., adopting a many-valued logic to handle quantum phenomena) is not a change in the "meanings" of logical constants, but a pragmatic adjustment to the web of belief. There is no fact of the matter about whether we are changing the meaning of 'negation' or changing our theory about the world. The distinction collapses because the criterion for analyticity (immunity to empirical revision) is shown to be a function of centrality and entrenchment, not semantic structure.

  4. **The Weakened Residue**

  Quine's attack does not eliminate the intuition behind the distinction entirely, but it forces a radical reconceptualization. What remains is a weakened, pragmatic residue. We can still distinguish between sentences that are *highly entrenched* and those that are *peripheral*. Sentences near the center of the web (logic, math, fundamental categories) are treated *as if* they were analytic because we are extremely reluctant to revise them. Sentences near the periphery (observational reports) are treated *as if* they were synthetic because they are easily revised in the face of sensory stimulation.

  However, to defend this weakened version, we must give up two crucial claims:
  1.  **Immunity:** We must abandon the claim that analytic truths are *strictly* immune to empirical revision. They are only *practically* immune. A sufficiently recalcitrant experience could, in principle, force us to revise a logical law, just as it forces us to revise a physical law.
  2.  **Truth in Virtue of Meaning:** We must abandon the claim that analytic truths are true *solely* in virtue of meaning. On Quine's view, meaning and fact are interwoven. The "truth" of a central sentence is a function of its role in the total theory and its utility in predicting experience, not a function of a separable semantic component.

  The distinction becomes a continuum of cognitive cogency or degree of confirmation rather than a binary partition. The work the distinction used to do—demarcating the realm of conceptual truth from empirical contingency—is lost. We are left with a naturalized epistemology where logic and mathematics are simply the most abstract and central parts of our overall theory of the world, continuous with physics and biology, differing only in their generality and their resistance to revision.
