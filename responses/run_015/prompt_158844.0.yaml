answer: |-
  The bit that is actually wrong is your claim that **normalizing utilities (0 to 1) is "only a change of units" that "doesn't sneak in any contested value judgement."**

  This is false. Utility functions are unique only up to positive affine transformations ($u' = au + b$). By forcing every agent's minimum to 0 and maximum to 1, you are arbitrarily fixing the scale parameter $a$ for each agent. This assumes that the *range* of one agent's preferences is morally equivalent to the *range* of another's. It treats a fanatic (who feels extreme intensity about outcomes) the same as a stoic (who feels mild intensity), simply because both map their feelings to a 0–1 scale. This is a massive, contested ethical assumption (egalitarianism of preference intensity), not a neutral mathematical step. If you follow your draft's advice, you open the door to manipulation (agents claiming extreme utility ranges) or ignore genuine differences in stakes.

  **What you should write instead:**

  1.  **On Epistemics:** Do not tell readers to "raise your credence." That is motivated reasoning. Tell them to *condition* on the possibility of a large universe. The argument is that *if* the universe is large, ECL dominates, so even a small credence makes it high-priority.
  2.  **On Bargaining:** Replace "normalize and sum" with the **Nash Bargaining Solution**. In game theory, when agents with different utility functions cooperate without a common currency, the standard focal point is to maximize the *product* of the gains from the disagreement point (status quo), not the sum of normalized utilities. This is robust to affine transformations of individual utilities and doesn't require comparing the "size" of one person's utility against another's.

  **Here is the corrected text for your note:**

  > "The main lever is the size of the universe: the more agents there are whose decisions correlate with yours, the more you should bend your behavior toward a cooperative compromise. Concretely: condition on the possibility that the universe is huge (even a small credence suffices for ECL to dominate expected value). To find the compromise, do not simply sum normalized utilities, as this arbitrarily equates different agents' preference intensities. Instead, adopt a bargaining solution invariant to utility scales, such as the **Nash Bargaining Solution**: maximize the product of each agent's gain in utility relative to the non-cooperative status quo. This secures Pareto improvements without requiring contested interpersonal utility comparisons."
