      *   *Stronger Version:* Needs to emphasize *practice* over *proposition*. It's not just that we don't source standards; it's that the verification machinery *rests* on these commitments. They are the "ground" on which the "building" of a story stands. If you question the ground, you aren't doing journalism anymore; you're doing philosophy or skepticism.
