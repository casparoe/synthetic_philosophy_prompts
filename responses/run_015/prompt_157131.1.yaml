  ## Apparatus

  ### Scoring Key
  | Path Code | Position | Diagnostic Pattern |
  | :--- | :--- | :--- |
  | **A-Yes-Yes** | Full-Blooded Parity | Accepts constitution, coupling, and shared agency. |
  | **A-Yes-No** | Extended System / Not Mind | Accepts constitution/coupling, rejects shared agency. |
  | **A-No** | Coupling Mismatch | Accepts constitution, rejects coupling dependence. |
  | **B-Yes** | Conservative Rejection | Rejects constitution; accepts intrinsic/history mark. |
  | **B-No-Yes** | Enculturation | Rejects constitution; locates change in internal plasticity. |
  | **B-No-No** | Embedded / Scaffolded | Rejects constitution; accepts causal dependence. |
  | **C-Yes** | Distributed Cognition | Shifts unit of analysis from individual to system. |
  | **C-No-No** | Deflationary | Denies substantive fact of the matter. |
  | **C-No-Yes** | Realist Anti-Extension | Asserts substantive fact without functional difference. |

  **Order Sensitivity:** Node 1 is the primary sorter. If Node 1 is answered (C), Nodes 2–5 are bypassed. This reflects that if the boundary is interest-relative (C), specific functional tests (2–5) are secondary. Swapping Node 1 and Node 6 would force respondents to consider social units before establishing individual constitution, potentially confusing those who hold individualist conservative views.

  ### Table of Unoccupied Combinations
  *Note: The tree structure above prunes logically inconsistent paths. The following are combinations that the logical space permits but no major view appears to defend.*

  | Combination | Diagnosis |
  | :--- | :--- |
  | **Node 1(Yes) + Node 4(Yes)** | **Incoherent:** If belief changes silently (1-Yes), the object is functioning cognitively; claiming history matters (4-Yes) contradicts the functional evidence accepted in Node 1. |
  | **Node 1(No) + Node 3(Yes)** | **Unattractive:** If the device is merely a source of misinformation (1-No), it is hard to argue it shares moral blame for errors (3-Yes) unless it is an agent, which 1-No denies. |
  | **Node 6(Yes) + Node 7(Yes)** | **Unexplored:** Claiming the unit is the pair (6-Yes) but that there is a non-functional fact making this true (7-Yes) is a form of social realism rarely articulated. |

  ### Indistinguishable Leaves & Further Questions

  **Pair:** *Leaf B3 (Embedded)* and *Leaf A2 (Extended System / Not Mind)*.
  **Similarity:** Both locate personal-level belief inside the head while acknowledging heavy external dependence.
  **Difference:** B3 denies the external resource is part of the *process* (causal only); A2 accepts it is part of the *process* (constitutive) but denies it holds *states*.
  **Separating Question:** "If the external resource is removed, does the *process* of reasoning stop immediately (A2), or does it merely become slower/harder (B3)?"
  **Status:** Substantive. It turns on whether the external resource is a component of the mechanism or merely an environmental condition.

  **Pair:** *Leaf C2 (Deflationary)* and *Leaf B3 (Embedded)*.
  **Similarity:** Both deny that the AI is part of the mind in a strong ontological sense.
  **Difference:** C2 says the question is verbal; B3 says the question has a answer (No).
  **Separating Question:** "If we agreed to call the AI 'memory' for legal purposes, would we have discovered something new (B3), or just changed the subject (C2)?"
  **Status:** Verbal/Meta-ontological.

  ### Flagged Nodes: Divergent Reasons

  **Node 1 (The Silent Update):**
  *   **Same Answer (Yes):** A *Full Parity* advocate says "Yes" because the notebook is literally part of the belief system. A *Distributed Cognition* advocate might say "Yes" because the belief is a property of the system, not the head. They agree on the case but disagree on *where* the belief is located (Head+App vs. System).
  *   **Same Answer (No):** A *Conservative* says "No" because beliefs must be biological. An *Enculturation* advocate says "No" because the belief is in the reshaped brain, not the app. They agree on the case but disagree on the locus of the change (Static Biology vs. Plastic Biology).

  **Node 3 (The Hallucination):**
  *   **Same Answer (No):** A *Conservative* says "No" because devices cannot be agents. A *Full Parity* advocate might say "No" because while the device is part of the mind, *moral agency* requires a level of consciousness the device lacks. They agree on blame but disagree on whether the device is cognitive.
