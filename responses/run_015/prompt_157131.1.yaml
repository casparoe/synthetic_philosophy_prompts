  # Diagnostic Instrument: The Cognitive Boundary Tree

  **Instructions:** Proceed through the nodes in order. At each node, select the response that best matches your intuition about the case described. Follow the branch indicated until you reach a terminal leaf. Record your path (e.g., A-Yes-No) for the scoring key.

  ### Node 1: The Silent Update (Case 1)
  **Case:** A notes app whose contents are altered by a sync error; you consult it, act on the altered entry without hesitation, and are never corrected.
  **Question:** In this scenario, did your *belief* change to match the new entry, or were you merely misinformed by an external source?
  **Probe:** *Where the mind stops* (Constitution vs. Causation).
  **Branches:**
  *   **(A) Yes, my belief changed silently.** → Go to Node 2.
  *   **(B) No, I was misinformed by a source.** → Go to Node 4.
  *   **(C) It depends on how integrated the app was.** → Go to Node 6.

  ---

  ### Node 2: The Power Cut (Case 5)
  **Case:** Notes readable only while a device is powered and online; when it is off, you recall nothing at all.
  **Question:** If the device is powered down for a week, do you *lose* the knowledge during that week, or does it remain yours but inaccessible?
  **Probe:** *Where the mind stops* (Coupling vs. Continuity).
  **Branches:**
  *   **(Yes) I lose the knowledge; the capacity is gone.** → Go to Node 3.
  *   **(No) I retain the knowledge; it is merely inaccessible.** → **Leaf A3**.

  ---

  ### Node 3: The Hallucination (Custom Case 10)
  **Case:** If the AI aid hallucinates a fact that leads to a harmful decision, is the *device* partly to blame, or only the user for trusting it?
  **Question:** Is the device itself a candidate for moral blame or responsibility?
  **Probe:** *Who is answerable*.
  **Branches:**
  *   **(Yes) The device shares the blame.** → **Leaf A1**.
  *   **(No) Only the user is to blame.** → **Leaf A2**.

  ---

  ### Node 4: The History Check (Case 7)
  **Case:** A device purpose-built as a memory aid versus an ordinary object you have trained yourself to use as one.
  **Question:** Does the *history* of the object (whether it was designed for cognition) matter for whether it counts as part of your mind?
  **Probe:** *Where the mind stops* (Intrinsicality).
  **Branches:**
  *   **(Yes) History matters; design determines status.** → **Leaf B1**.
  *   **(No) Only current function matters.** → Go to Node 5.

  ---

  ### Node 5: The Reshaping (Case 8)
  **Case:** A practitioner who, after years with a navigation or notation aid, no longer uses it, but whose unaided reasoning has been permanently reshaped by it.
  **Question:** Was the cognitive extension real only while the tool was present, or did the tool become part of you by changing your internal biology?
  **Probe:** *Who the agent is* (Transformation).
  **Branches:**
  *   **(Yes) The internal change is what matters; the tool was a catalyst.** → **Leaf B2**.
  *   **(No) The tool itself was the extension; the change is just a trace.** → **Leaf B3**.

  ---

  ### Node 6: The Shared Base (Case 3)
  **Case:** A shared knowledge base maintained by two people, where neither can tell who entered a given item and each treats every item as something they know.
  **Question:** Is the cognitive system that knows these items the *pair* of people, or just each individual accessing a resource?
  **Probe:** *Proper unit of explanation*.
  **Branches:**
  *   **(Yes) The system is the pair; the individual is incomplete.** → **Leaf C1**.
  *   **(No) The system is the individual; the other person is a resource.** → Go to Node 7.

  ---

  ### Node 7: The Prediction Check (Custom Meta-Case)
  **Case:** If two people agree on all predictions about behavior and neural activity but disagree on whether the mind extends, is there a fact left over?
  **Question:** Is there a substantive fact of the matter remaining, or is the dispute merely about how we use words?
  **Probe:** *Where the mind stops* (Factuality).
  **Branches:**
  *   **(No) No fact is left over; it is verbal.** → **Leaf C2**.
  *   **(Yes) A fact remains; one view is objectively correct.** → **Leaf C3**.

  ---

  ## Terminal Leaves

  **Leaf A1: Full-Blooded Parity**
  *   **Path:** 1(A) → 2(Yes) → 3(Yes)
  *   **AI Implication:** A person relying on a persistent-memory AI thereby remembers and believes the stored content just as if it were biological.
  *   **Awkward Commitment:** If the device is sufficiently complex, it may qualify as a subject of experience or a moral patient itself.

  **Leaf A2: Extended System / Not Mind**
  *   **Path:** 1(A) → 2(Yes) → 3(No)
  *   **AI Implication:** The human-AI system functions as a cognitive unit, but personal-level belief and responsibility remain strictly inside the skull.
  *   **Awkward Commitment:** There can be cognitive processes without a cognizer, and beliefs that belong to no believer.

  **Leaf A3: Coupling-Constitution Mismatch (Unnamed)**
  *   **Path:** 1(A) → 2(No)
  *   **AI Implication:** You remember the content even when the AI is off, implying the AI is merely a reliable retrieval cue, not a storage vessel.
  *   **Awkward Commitment:** You must explain why silent updates change belief (Node 1) if the storage location (internal) never changed.

  **Leaf B1: Conservative Rejection**
  *   **Path:** 1(B) → 4(Yes)
  *   **AI Implication:** Commercial AI aids are tools like hammers; using them enhances performance but never constitutes remembering.
  *   **Awkward Commitment:** The boundary of the mind is fixed by evolutionary history or design intent, making it immune to functional changes.

  **Leaf B2: Enculturation / Cognitive Integration**
  *   **Path:** 1(B) → 4(No) → 5(Yes)
  *   **AI Implication:** The AI does not store your memories; it trains your brain to store them differently, so you remember only what you can recall unaided.
  *   **Awkward Commitment:** The tool that did the heavy lifting during learning is excluded from the cognitive system it created.

  **Leaf B3: Embedded / Scaffolded**
  *   **Path:** 1(B) → 4(No) → 5(No)
  *   **AI Implication:** The AI is a causal scaffold essential for reasoning, but the mind stops at the skin; dependence is not constitution.
  *   **Awkward Commitment:** You must draw a sharp line between "causally essential" and "constitutive" that makes no difference to behavioral prediction.

  **Leaf C1: Distributed Cognition**
  *   **Path:** 1(C) → 6(Yes)
  *   **AI Implication:** The unit of memory is the social-technical network; asking if the *individual* remembers is a category error.
  *   **Awkward Commitment:** Individual psychology is a fiction; no single person in the group knows what the group knows.

  **Leaf C2: Deflationary / Verbal**
  *   **Path:** 1(C) → 6(No) → 7(No)
  *   **AI Implication:** Whether the AI "remembers" is a choice of terminology for convenience, not a discovery about the world.
  *   **Awkward Commitment:** All metaphysical debates about cognitive boundaries are merely verbal disputes with no empirical content.

  **Leaf C3: Realist Anti-Extension (Unnamed)**
  *   **Path:** 1(C) → 6(No) → 7(Yes)
  *   **AI Implication:** There is a fact of the matter that the AI is not part of the mind, even if it behaves exactly like biological memory.
  *   **Awkward Commitment:** There exists a non-functional, non-behavioral property ("intrinsicality") that determines cognitive status.

