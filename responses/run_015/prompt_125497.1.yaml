answer: |-
  There is no single, canonical rhetorical term for this specific maneuver, but it is a recognizable pattern in philosophical and economic debates. The closest existing concepts are a hybrid of **Moving the Goalposts** and **Foundationalism**, but with a specific directional vector.

  If you need a label to use in conversation, the most accurate descriptive term is **"The Foundationalist Retreat"** (or **"The Materialist Retreat"**).

  Here is a breakdown of why this move is distinct from the standard fallacies you mentioned, and the philosophical machinery driving it.

  ### 1. Why it isn't quite "Moving the Goalposts"
  **Moving the Goalposts** usually implies an *arbitrary* change in the criteria for proof to avoid losing an argument.
  *   *Standard Goalposts:* "Prove X." -> [X is proven] -> "Well, now you need to prove Y." (Y is unrelated or stricter).
  *   *Your Scenario:* The criteria aren't arbitrary; they are **stratified**. The arguer isn't just changing the requirement; they are digging deeper into ontology. They are moving from *social layer* → *scarcity layer* → *physical layer* → *atomic layer*.
  *   **The Distinction:** Standard goalpost shifting is lateral or vertical (higher bar). This move is **depth-wise**. It relies on the intuition that if you dig deep enough into matter, you will find a layer that is *not* socially constructed.

  ### 2. Why it isn't quite "Motte-and-Bailey"
  **Motte-and-Bailey** involves holding two positions simultaneously: a controversial one (Bailey) and a defensible triviality (Motte), and swapping between them when challenged.
  *   *Standard Motte-and-Bailey:* "Gold is valuable because society says so (Bailey)" vs "Gold is valuable because it's shiny (Motte)." The arguer switches back and forth depending on pressure.
  *   *Your Scenario:* The arguer is not swapping; they are **retreating**. They abandon the "scarcity" claim once it is debunked and dig in behind the "physical properties" claim. They concede the previous layer to defend the deeper layer.
  *   **The Distinction:** Motte-and-Bailey is equivocation (holding two meanings at once). This is **sequential concession**. It feels more honest because they admit the previous point was flawed, but the *strategy* remains the same: find a layer that cannot be deconstructed.

  ### 3. The Philosophical Root: "The Myth of the Given"
  The engine driving this argument is a philosophical error identified by Wilfrid Sellars as **The Myth of the Given**.
  *   This is the belief that there must be some layer of reality (sense data, physical objects, brute matter) that provides a foundation for knowledge or value *without* itself requiring interpretation or social context.
  *   In your money example, the arguer believes there must be an **Archimedean Point**—a place to stand outside of the social system to anchor value. When you show that "scarcity" is social, they retreat to "physics," assuming physics is the "Given" that exists outside society.
  *   **The Counter:** As you noted, even "physical properties" only have *value* because of human needs/technology (e.g., gold is conductive and non-corrosive, which is only valuable if you have electronics). The arguer treats *utility* as intrinsic, when utility is relational.

  ### 4. Proposed Terminology
  Since there isn't a standard Latin term, you can describe this move using one of the following, depending on the nuance you want to highlight:

  **A. The Foundationalist Retreat**
  This highlights the philosophical error. They are retreating toward a "foundation" they believe is solid, ignoring that the foundation itself rests on social interpretation.
  *   *Usage:* "You're engaging in a foundationalist retreat. Every time I show a layer is socially mediated, you dig deeper, assuming there's a bottom layer that isn't."

  **B. Strategic Reductionism**
  This highlights the method. They are reducing the argument from sociology to economics to physics to avoid the core point (that value is relational).
  *   *Usage:* "This is strategic reductionism. You're trying to reduce a social phenomenon to a physical one to avoid admitting the social component."

  **C. The Intrinsic Value Fallacy**
  Specific to economics. This names the assumption that value can exist inside an object rather than in the relationship between the object and a subject.
  *   *Usage:* "You're falling for the intrinsic value fallacy. You keep looking for the value inside the gold, but it's always in the network."

  ### Summary of the Dynamic
  | Feature | Moving Goalposts | Motte-and-Bailey | **The Foundationalist Retreat** |
  | :--- | :--- | :--- | :--- |
  | **Movement** | Arbitrary / Stricter | Swapping (Back & Forth) | **Directional (Deepening)** |
  | **Concession** | None (ignores proof) | Temporary (tactical) | **Explicit (abandons layer)** |
  | **Goal** | Avoid loss | Defend controversial claim | **Find the "Real" Substance** |
  | **Underlying Belief** | "I win." | "I'm right." | **"There must be a bedrock."** |

  ### How to Counter It
  Since the move relies on the intuition that "matter is real, society is fake," the counter-move is to stop chasing them down the rabbit hole of materiality.

  Instead of arguing about gold's physical properties, reframe the ontology:
  > "You keep retreating to physical properties as if they exist in a vacuum. But 'hardness,' 'scarcity,' and 'conductivity' are only valuable because of human technology and desire. If you remove the human context, gold is just heavy yellow dirt. You aren't finding a foundation; you're just finding a deeper layer of context."

  This stops the retreat by refusing to accept the premise that there is a "non-social" layer of value to be found.
