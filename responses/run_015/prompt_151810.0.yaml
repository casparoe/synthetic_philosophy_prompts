answer: |-
  # JOINT STATEMENT ON ALGORITHMIC GOVERNANCE AND LEGAL THEORY

  **Signatories:** A Representative of Hartian Legal Positivism and A Representative of Fullerian Natural-Law Theory
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Predictive Policing and Machine-Learning-Generated Norms

  ## I. AGREED CLAIMS

  The undersigned parties, representing distinct traditions in legal philosophy, submit the following claims as settled matters of fact or framework for the purpose of this collaboration. We distinguish these from interpretive disputes regarding the ultimate nature of law.

  1.  **Structural Framework of Legal Systems:** We agree to utilize H.L.A. Hart's descriptive framework as a common vocabulary for analyzing legal structures. This includes the distinction between **primary rules** (rules of conduct imposing duties) and **secondary rules** (rules conferring powers to change, adjudicate, or recognize primary rules). We further agree that any functioning legal system relies on a **rule of recognition**, understood socially as the ultimate criterion officials use to identify valid law within that jurisdiction.
  2.  **Procedural Desiderata of Legality:** We agree to utilize Lon Fuller's eight principles of legality as a descriptive checklist for evaluating the form of norms. These principles are: (1) generality, (2) publicity, (3) non-retroactivity, (4) clarity, (5) non-contradiction, (6) possibility of compliance, (7) constancy through time, and (8) congruence between official action and declared rule. We agree to treat these as procedural conditions without initially committing to whether they constitute moral obligations or conditions of validity.
  3.  **Empirical Characteristics of Algorithmic Governance:** We agree on the following empirical characteristics of current predictive-policing and machine-learning regulatory systems:
      *   **Opacity:** The internal logic of these systems often relies on model weights and neural network layers that are not human-comprehensible.
      *   **Specificity:** Outputs often take the form of case-specific risk scores rather than general categorical rules.
      *   **Promulgation Deficit:** These norms frequently lack traditional legislative enactment or formal publication in legal registers.
      *   **Data Dependence:** The normative force of the system derives from training data that encodes historical patterns, which may reflect past biases or social correlations rather than intentional legislative policy.
  4.  **Distinction Between Validity and Merit:** We agree that a conceptual distinction exists between the **legal validity** of a norm (its status as binding law within the system) and its **moral merit** (its justice or righteousness). We disagree, as detailed below, on whether procedural failures affect validity or only merit.
  5.  **Efficacy vs. Normativity:** We share the acknowledgment that a normative system can possess **social efficacy**—meaning it is recognized, applied, and enforced by officials—while simultaneously failing to meet the normative conditions of the rule of law. We agree that social facticity (officials doing X) does not automatically satisfy the procedural requirements of legality (Fuller's principles).

  ## II. RESIDUAL DISAGREEMENTS

  The following table outlines the specific points of divergence regarding the application of our respective theories to algorithmic governance. Each side accepts the wording in its column as an accurate statement of its position.

  | Issue | Hartian Legal Positivist Position | Fullerian Natural-Law Theorist Position |
  | :--- | :--- | :--- |
  | **1. Publicity and Intelligibility** | The principle of publicity is satisfied if the technical architecture, code, and data are accessible to the public and experts, regardless of whether the average subject can cognitively comprehend the specific logic. Law is a tool of social control that may utilize complex mechanisms beyond lay understanding, provided officials recognize them. | The principle of publicity requires that norms be intelligible to those subject to them. If algorithmic norms are technically accessible but cognitively opaque to the governed, they fail publicity. Law must guide conduct; a rule that cannot be understood by the subject cannot guide them. |
  | **2. Social Source and Validity** | Hart's social-source thesis permits a rule of recognition to incorporate opaque, machine-generated outputs as binding legal norms, provided legal officials consistently treat them as authoritative. This incorporation does not smuggle in moral criteria; it merely reflects the social fact of official acceptance. | A rule of recognition cannot validly incorporate norms that fundamentally violate the internal morality of law (e.g., secrecy or impossibility of comprehension). If machine-generated outputs lack the form of law, they are managerial directives, not law, regardless of official treatment. |

  ## III. IDENTIFIED CRUXES

  We identify the following sub-questions as the critical pivot points of our disagreement. Settling these empirical or conceptual matters would significantly alter the theoretical landscape for at least one party.

  **Crux (a): The Nature of Generality in Algorithmic Contexts**
  Does the principle of generality require that legal rules be framed in terms that apply to classes of persons and actions in a way that is independently graspable by those subject to them? Or, can a collection of case-specific algorithmic outputs, generated by a single underlying model, collectively constitute a general normative framework?

  **Crux (b): Internal Morality as a Condition of Validity**
  Is the "internal morality of law" (adherence to Fuller's eight principles) a condition of legal validity itself, as the Fullerian maintains? Or is it only a condition of efficacy and moral legitimacy that is conceptually separable from validity, as the Hartian maintains? This question is sharpened when the "law" in question is generated by statistical models rather than by intentional human promulgation.

  ## IV. EMPIRICAL TESTS AND PREDICTIONS

  For each crux, we specify a concrete institutional arrangement that would bear on the question. We record our divergent predictions regarding how these cases should be characterized.

  ### Test Case for Crux (a): The Transparent Black Box
  **Scenario:** A jurisdiction fully publishes the architecture, training data, and decision weights of its predictive-policing model. However, the system retains case-specific risk scores for individuals that are not reducible to any human-readable rule (e.g., no simple "if X then Y" statement can summarize the output).
  **Question:** Does this satisfy the requirements of Generality and Publicity?

  *   **Hartian Prediction:** **Yes.** The rule is general because it applies the same mathematical function to all subjects. It is public because the code and weights are available. The complexity of the application does not negate the generality of the source. The law exists as a social fact recognized by officials.
  *   **Fullerian Prediction:** **No.** This fails Generality and Publicity. Because the subject cannot understand *why* they are targeted or *how* to comply (other than by guessing), the system functions as a series of specific orders disguised as rules. It fails to guide conduct and therefore fails the internal morality of law.

  ### Test Case for Crux (b): The Judicial Adoption of Opaque Scores
  **Scenario:** A judiciary consistently applies an opaque risk-score threshold in bail and sentencing decisions, treating it as binding without legislative enactment. Legislators remain silent; officials treat the score as dispositive.
  **Question:** Does this demonstrate the incorporation of algorithmic norms into the rule of recognition, and does that incorporation undermine or confirm the separability of law and morality?

  *   **Hartian Prediction:** **Incorporation Confirmed; Separability Confirmed.** This demonstrates that the rule of recognition has evolved to accept algorithmic output as a source of law. The norms are valid law because officials treat them as such. The fact that they are opaque or procedurally flawed makes them *bad* law (morally or practically), but does not strip them of legal validity. Law and morality remain separate.
  *   **Fullerian Prediction:** **Incorporation Failed; Separability Undermined.** This demonstrates a collapse of the legal system into a system of managerial control. Because the norms lack the internal morality (specifically clarity and congruence), they cannot be incorporated into the rule of recognition *as law*. They are merely exercises of power. Validity is not separable from the procedural morality that makes law possible.

  ## V. CONCLUSION: VERBAL VS. SUBSTANTIVE DISPUTES

  In concluding this collaboration, we note that portions of our dispute appear to be **verbal**, while others remain **substantive**.

  **Verbal Disputes:**
  Much of our disagreement dissolves when we specify the definition of "law" in the algorithmic context. If "law" is defined strictly as *effective official command* (Hart), the algorithmic system is law. If "law" is defined as *a purposive enterprise subjecting human conduct to the governance of rules* (Fuller), the algorithmic system may not qualify. Once we agree on which definition is being operationalized for a specific analysis, we often agree on the empirical description of the system's functioning.

  **Substantive Disputes:**
  However, a substantive disagreement remains regarding the **conditions under which a normative system counts as law** for the purpose of political obligation and critique.
  *   The Hartian maintains that calling the algorithmic system "law" is necessary to subject it to moral criticism; denying it the name of law obscures the reality of state power.
  *   The Fullerian maintains that calling the algorithmic system "law" grants it a legitimacy it does not deserve; denying it the name of law is necessary to protect the integrity of the concept and the rights of subjects.

  We agree that this substantive disagreement is not merely semantic but reflects a fundamental divergence on whether the concept of law serves primarily to describe social power or to prescribe the conditions for legitimate governance. We commit to maintaining this distinction in future analyses of technology governance.

  __________________________
  **Representative, Hartian Legal Positivism**

  __________________________
  **Representative, Fullerian Natural-Law Theory**
