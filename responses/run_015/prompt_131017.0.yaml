      *   *Nuance:* The user is in high school. I need to ensure the advice is rigorous but accessible. Don't drown them in jargon, but don't talk down. The prompt shows high sophistication.
      *   *Key Insight:* The Knobe effect relies on a *single agent* with a *single mind*. Collectives have *multiple minds*. The "filter" might operate differently. Does the observer aggregate individual moral judgments first, then assign collective intent? Or do they judge the collective outcome morally, then assign intent? This order of operations is the crux of the "conceptual clarification" request.

  7.  **Final Polish:** Organize into clear sections: Coherence of Extension, Ontological vs. Psychological, Normative Filter vs. Framing, and Conceptual Distinctions. Ensure the tone is constructive and analytical. (Check against constraint: No citations/bibliography).

