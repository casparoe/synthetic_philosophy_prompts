answer: |-
  Here is the plan. I have evaluated your three candidate mechanics, killed the two that fail the arithmetic or the classroom reality test, and built the winner into a run-ready protocol.

  ### Part 1: Mechanic Autopsy

  **Candidate 1: The Hive-Mind (Team as Person)**
  *   **The Pitch:** A team of students is one "Beauty." You tap shoulders to "wake" them.
  *   **The Kill:** The "Identity Fiction" collapses immediately. If I tap Alice, then tap Bob, Alice knows she isn't Bob. To make this work, they have to pretend they are the same person, which 2nd-year undergrads will treat as a joke. Furthermore, scoring is ambiguous: if the team gets one score, do they average their guesses first (Halfer) or sum their Brier scores (Thirder)? If you don't specify, they will ask you, and the game is over.
  *   **Verdict:** **Discard.** Too much roleplay friction, not enough mathematical bite.

  **Candidate 2: The Captain Variant**
  *   **The Pitch:** Only one random awakening per trial is scored.
  *   **The Kill:** This resolves the ambiguity rather than exposing it.
      *   *Algebra:* Let $S$ be the event "Selected as Captain."
      *   $P(S|H) = 1$ (Only one waking, must be selected).
      *   $P(S|T) = 1/2$ (Two wakings, one selected at random).
      *   By Bayes: $P(H|S) = \frac{1 \cdot 0.5}{1 \cdot 0.5 + 0.5 \cdot 0.5} = \frac{0.5}{0.75} = 2/3$.
      *   This forces a specific answer (2/3) by changing the sampling method. It destroys the 1/2 vs 1/3 tension you want them to feel.
  *   **Verdict:** **Discard.** It solves the problem instead of dramatizing it.

  **Candidate 3: The Dual-Ledger Protocol (Winner)**
  *   **The Pitch:** We run the standard Sleeping Beauty physical setup (1 or 2 wakings per coin flip), but we calculate the winnings **two different ways** at the end.
  *   **Why it survives:** It directly tests your hypothesis: *The dispute is about the unit of scoring.*
      *   Ledger A sums points per **slip** (Awakening). Optimal credence: 1/3.
      *   Ledger B sums points per **trial** (Coin Flip). Optimal credence: 1/2.
      *   Students will see that *both* ledgers are mathematically valid, but they reward different behaviors. This forces the philosophical realization without you lecturing.
  *   **Verdict:** **Build this.**

  ---

  ### Part 2: The Dual-Ledger Protocol (Run Sheet)

  **Setting:** 75 Minutes. 20 Students. 10 Pairs (Each Pair = 1 "Beauty").
  **Materials:**
  *   1 Coin.
  *   Phone (for white noise).
  *   20 Folders (or large envelopes/books) to block line-of-sight between partners.
  *   Slips of paper (2 per student).
  *   Projector (for the Ledger).
  *   Whiteboard (for the Final Reveal).

  **The Cover Story:**
  Do not mention Sleeping Beauty. Tell them: *"We are testing decision protocols in fragmented information networks. You are nodes. Your goal is to maximize points."*

  **Recruiting the YouTubers:**
  Before class, identify the 2-3 students who likely know the puzzle. Pull them aside at the start. *"I know you might know where this is going. I need you to be 'Auditors.' Your job is to watch the coin and the ledger math. You cannot speak until the debrief. If you spoil it, you invalidate the data."* This gives them status and silences them.

  #### Timeline

  **00:00 – 00:10: Setup & Rules**
  1.  Arrange chairs in 10 pairs. Partners sit side-by-side but must use folders to block seeing each other's writing hands.
  2.  **Rule 1:** No talking.
  3.  **Rule 2:** Eyes down until instructed.
  4.  **Rule 3:** You will receive a signal to write. If you do not receive it, write "Z" (Sleep) and put the slip in the box.
  5.  **Payoff:** Explain the **Brier Score** simply: *"If you write probability $p$ and the event happens, you get $1 - (1-p)^2$ points. If it doesn't happen, you get $1 - (0-p)^2$ points. Higher is better."* (Write formula on board).
  6.  **The Goal:** *"Maximize the team's total points."* (Crucially, do not define how team points are aggregated yet).

  **00:10 – 00:40: The Game (5 Rounds)**
  1.  Play white noise on phone (masks your movement).
  2.  For each Round (Trial):
      *   Flip one coin publicly.
      *   **Heads:** Walk to the pair. Tap **one** partner on the shoulder.
      *   **Tails:** Tap **both** partners on the shoulder.
      *   *Note:* Move randomly so they can't predict who gets tapped.
      *   Signal: "Write." (Tapped students write a number $0-1$ representing probability of Heads. Untapped write "Z").
      *   Signal: "Fold." (Students fold slips, hiding content).
      *   Collect slips in a box.
  3.  Repeat 5 times. (Total 10 Trials, approx. 15-25 slips total).
  4.  *During this phase:* If students ask "Should we coordinate?", say "You cannot communicate."

  **00:40 – 00:55: The Scoring Crisis**
  1.  Open the box. Project the results anonymously (e.g., "Trial 1: H, Slips: 0.5, Z").
  2.  Calculate the points for every slip on the projector.
  3.  **The Twist:** Announce there are two ways to claim the prize.
      *   **Ledger A (Per Slip):** Sum the scores of every single slip submitted.
      *   **Ledger B (Per Trial):** For each trial, average the scores of the slips submitted *in that trial*, then sum the trial averages.
  4.  Ask the class: *"Which Ledger should we use to determine the winner?"*
  5.  Let them argue. They will realize:
      *   If we use Ledger A, the students who wrote ~0.33 did best.
      *   If we use Ledger B, the students who wrote ~0.50 did best.
      *   *Both groups followed the rules. Both were rational relative to a scoring scheme.*

  **00:55 – 01:05: The Reveal**
  1.  Write "SLEEPING BEAUTY" on the board.
  2.  Explain the mapping:
      *   Coin Flip = The Beauty's Coin.
      *   Tap = Waking.
      *   Folder/Memory Loss = Amnesia.
      *   Ledger A = "Thirder" position (count awakenings).
      *   Ledger B = "Halfer" position (count trials).
  3.  Acknowledge the Auditors (the YouTubers). Ask them to confirm the math was fair.

  **01:05 – 01:15: Debrief & The Monday Question**
  1.  Discuss why the unit of scoring matters.
  2.  Run the "Monday" algebra (see below).
  3.  Dismiss.

  ---

  ### Part 3: The Algebra (For Your Ledger)

  You need to verify this before class so you can defend it on the board.

  **Notation:**
  *   $p$: The probability of Heads reported by the student.
  *   $S$: Score for a single slip.
  *   $H$: Coin is Heads. $T$: Coin is Tails.
  *   Brier Score: $1 - (Outcome - p)^2$.
      *   If Heads (Outcome=1): Score $= 1 - (1-p)^2 = 2p - p^2$.
      *   If Tails (Outcome=0): Score $= 1 - (0-p)^2 = 1 - p^2$.

  **Scenario 1: Ledger A (Awakening Scoring / Thirder)**
  *   **Goal:** Maximize Expected Score **per slip**.
  *   In a long run of trials:
      *   Half the trials are Heads (1 slip each).
      *   Half the trials are Tails (2 slips each).
      *   Total Slips = $0.5N \times 1 + 0.5N \times 2 = 1.5N$.
      *   Proportion of slips that are Heads: $0.5N / 1.5N = 1/3$.
      *   Proportion of slips that are Tails: $1.0N / 1.5N = 2/3$.
  *   **Expected Score per Slip:**
      $$E[S] = \frac{1}{3}(2p - p^2) + \frac{2}{3}(1 - p^2)$$
      $$E[S] = \frac{2}{3}p - \frac{1}{3}p^2 + \frac{2}{3} - \frac{2}{3}p^2$$
      $$E[S] = \frac{2}{3} + \frac{2}{3}p - p^2$$
  *   **Maximize:** Take derivative w.r.t $p$ and set to 0.
      $$\frac{2}{3} - 2p = 0 \implies 2p = \frac{2}{3} \implies p = 1/3.$$
  *   **Result:** If points count per slip, rational agents report **1/3**.

  **Scenario 2: Ledger B (Trial Scoring / Halfer)**
  *   **Goal:** Maximize Expected Score **per Trial**.
  *   In a long run:
      *   Half the trials are Heads. Score = $2p - p^2$.
      *   Half the trials are Tails. Two slips are submitted ($p_1, p_2$). Trial Score = Average of slips = $\frac{(1-p_1^2) + (1-p_2^2)}{2}$.
      *   Assume symmetric strategy ($p_1 = p_2 = p$). Trial Score = $1 - p^2$.
  *   **Expected Score per Trial:**
      $$E[Trial] = \frac{1}{2}(2p - p^2) + \frac{1}{2}(1 - p^2)$$
      $$E[Trial] = p - 0.5p^2 + 0.5 - 0.5p^2$$
      $$E[Trial] = 0.5 + p - p^2$$
  *   **Maximize:** Take derivative w.r.t $p$ and set to 0.
      $$1 - 2p = 0 \implies 2p = 1 \implies p = 1/2.$$
  *   **Result:** If points count per trial, rational agents report **1/2**.

  **The "Monday" Credence Check (Your Extra)**
  *   *Question:* Upon waking, what is your credence that it is Monday?
  *   **Thirder View ($P(H)=1/3$):**
      *   Three equiprobable centered worlds: {H-Mon, T-Mon, T-Tue}.
      *   Monday occurs in {H-Mon, T-Mon}.
      *   $P(Mon) = 1/3 + 1/3 = \mathbf{2/3}$.
  *   **Halfer View ($P(H)=1/2$):**
      *   $P(Mon) = P(Mon|H)P(H) + P(Mon|T)P(T)$.
      *   If Heads, it must be Monday ($P(Mon|H)=1$).
      *   If Tails, it is Monday or Tuesday ($P(Mon|T)=1/2$).
      *   $P(Mon) = (1 \cdot 1/2) + (1/2 \cdot 1/2) = 1/2 + 1/4 = \mathbf{3/4}$.
  *   *Arithmetic Check:* Your hunch was correct. 2/3 vs 3/4. Include this in the debrief to show the divergence spreads to other beliefs.

  ---

  ### Part 4: Failure Modes & Mitigation

  **1. The "Peeking" Problem**
  *   *Risk:* Partners peek to see if the other is writing. If both see each other writing, they know it's Tails.
  *   *Fix:* The Folders. Insist they hold the folder up like a carrel. If you see peeking, disqualify that pair's slips for that round (warn them of this rule upfront).

  **2. The "Counting Taps" Problem**
  *   *Risk:* Students hear you tap two desks vs one.
  *   *Fix:* White noise. Also, walk randomly. Sometimes tap a desk lightly without meaning it (a "dummy tap"), then tell them later "Ignore accidental brushes." Better yet: **The Chip Method.**
      *   *Alternative:* Place a poker chip on the desk of woken students while eyes are closed. It's silent.
      *   *Decision:* Use the **Chip Method** if you have chips/tokens. It is silent and definitive. If not, stick to taps + white noise + soft shoes.

  **3. The "Boredom" Problem**
  *   *Risk:* 5 rounds is too few for stats, 10 is too boring.
  *   *Fix:* 5 rounds is enough for the *concept*. Don't grind for statistical significance; grind for *conflict*. The conflict arises in the debrief, not the data.

  **4. The "YouTuber" Leak**
  *   *Risk:* An auditor whispers "It's 1/3" during the scoring.
  *   *Fix:* The "Data Validity" threat. *"If the Auditors speak, we cannot publish the results, and no one gets the prize."* Peer pressure will hold them.

  ---

  ### Part 5: What This Activity Cannot Do

  Be honest with them (and yourself) about the limits.

  1.  **First-Personal Identity:** The game simulates the *structure* of the problem (branching timelines, memory loss), but it cannot simulate the *horror* of being the same person twice. In the game, Partner A and Partner B are distinct humans. In the thought experiment, Beauty is one consciousness stretched thin. You must supply this via lecture in the final 10 minutes. The game proves the *math* depends on the scoring; the lecture must explain why the *metaphysics* is uncomfortable.
  2.  **New Evidence:** The "Halfer" argument often rests on "She learned nothing new." The game shows that even if you *have* the same information, your action changes based on how you are scored. You need to explicitly bridge this: *"The Halfer says the score shouldn't matter for belief, only for action. The Thirder says belief just IS a disposition to act."* This is the philosophical crux you must articulate.

  ### Final Checklist for You
  *   [ ] Load white noise on phone.
  *   [ ] Prepare 20 folders/books.
  *   [ ] Print the Brier Score formula for the board.
  *   [ ] Pre-calculate the Ledger A vs Ledger B numbers for a hypothetical dataset so you don't fumble the algebra live.
  *   [ ] Brief the Auditors.

  This setup forces the arithmetic to speak before the philosophy does. When they see that 1/2 wins one ledger and 1/3 wins the other, the "disagreement" stops looking like a mistake and starts looking like a parameter choice. That is the win condition.
