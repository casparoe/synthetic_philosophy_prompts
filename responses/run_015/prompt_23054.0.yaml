prompt: |-
  I have just finished a long, somewhat heated discussion with a friend who works in statistics, in which we failed to reach agreement on what a "default" or "uninformative" prior should be when I have little or no prior information about an unknown quantity. I had been defending the simple practice of placing a flat, uniform prior over the parameter of interest—say, the success probability of a new treatment, or the failure rate of a component—on the grounds that, absent any reason to favor one value over another, the values should be treated as equally likely, an application of what I understood to be the principle of indifference. My friend objected that this is not actually well-defined for continuous quantities, invoking what is usually called Bertrand's paradox, the puzzle about randomly drawn chords of a circle, in which the probability that a chord exceeds the length of the side of an inscribed equilateral triangle comes out to 1/3, 1/2, or 1/4 depending on which reasonable procedure one uses to pick the chord at random. He argued that my uniform prior is doing exactly the same thing, and that whether I flatten the prior over the probability itself, over its log-odds, or over the corresponding rate, I am quietly committing to different assumptions about what "no information" means. I found his point hard to dismiss, but I left the conversation not really understanding the full force of it, or what I should do about it in practice.

  Could you please describe the most important implications of this for someone in my position, who must choose a default prior for a continuous parameter in a statistical or decision model and wants the choice to be defensible to a colleague who is aware of the puzzle? In particular, I would be grateful for an account of which reparameterizations preserve or distort a putatively flat prior, what the standard principled resolutions are, and whether there is any way to break the tie between competing "uniform" choices that does not itself amount to smuggling in a substantive prior assumption. If there are concrete recommendations for the two kinds of parameters I mentioned—a probability and a rate—I would find those especially useful.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user had a heated discussion with a statistician friend about "uninformative" or "default" priors for continuous parameters.
      *   **User's Stance:** Defended flat/uniform priors based on the Principle of Indifference (equal likelihood absent information).
      *   **Friend's Stance:** Argued that flat priors are parameterization-dependent (Bertrand's Paradox analogy). A uniform prior on $\theta$ is not uniform on $\log(\theta)$ or $\text{logit}(\theta)$.
      *   **User's Goal:** Wants to understand the implications, know which reparameterizations distort flat priors, learn standard principled resolutions, and get concrete recommendations for probabilities (success rate) and rates (failure rate).
      *   **Tone:** Needs to be explanatory, balanced, technically accurate but accessible, and practical.

  2.  **Deconstruct the Core Statistical Issue:**
      *   **The Problem:** The Principle of Indifference works for finite discrete sets but fails for continuous parameters because there is no unique translation-invariant measure on the real line that remains invariant under all transformations.
      *   **Bertrand's Paradox:** Illustrates that "random" is ill-defined without specifying the method of selection. Similarly, "uniform" is ill-defined without specifying the parameterization.
      *   **Reparameterization:** If $p \sim \text{Uniform}(0,1)$, then $\phi = \log(p/(1-p))$ (log-odds) is *not* uniform. If $\lambda \sim \text{Uniform}(0, \infty)$, then $\log(\lambda)$ is *not* uniform.
      *   **Invariance:** We want a prior that represents "ignorance" regardless of how we measure the parameter.

  3.  **Identify Standard Resolutions:**
      *   **Jeffreys Prior:** Based on Fisher Information. Invariant under reparameterization. $p(\theta) \propto \sqrt{I(\theta)}$.
      *   **Reference Priors:** (Bernardo) More general, maximizes expected Kullback-Leibler divergence.
      *   **Maximum Entropy:** (Jaynes) Choose the distribution with highest entropy subject to constraints.
      *   **Improper Priors:** Sometimes the "uninformative" prior integrates to infinity (e.g., Uniform on $(-\infty, \infty)$). Need to ensure posterior is proper.

  4.  **Address the Specific Parameters:**
      *   **Probability ($p \in [0,1]$):**
          *   Uniform: $\text{Beta}(1,1)$.
          *   Jeffreys: $\text{Beta}(0.5, 0.5)$.
          *   Why Jeffreys? Invariant to transformation. Handles boundaries better (infinite density at 0 and 1 implies we are open to extreme values).
      *   **Rate ($\lambda \in [0, \infty)$):**
          *   Uniform: Improper, implies large values are as likely as small values (on linear scale).
          *   Jeffreys/Scale Invariant: $p(\lambda) \propto 1/\lambda$ (Uniform on $\log \lambda$).
          *   Why? A failure rate of 0.001 vs 0.002 is the same "distance" as 1000 vs 2000 on a log scale.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Validate the friend's point. It's a classic and deep issue in Bayesian statistics. Acknowledge that the Principle of Indifference is indeed ambiguous for continuous variables.
      *   **The Core Problem (Reparameterization):** Explain mathematically why $p(\theta) d\theta \neq p(\phi) d\phi$ if $\phi = f(\theta)$ and $p$ is constant. Use the change of variables formula.
          *   Example: Uniform on $p$ vs. Uniform on log-odds.
      *   **Bertrand's Paradox Connection:** Briefly confirm the friend was right. "Random" requires a measure. "Uniform" requires a metric.
      *   **Principled Resolutions:**
          *   **Jeffreys Prior:** The gold standard for invariance. Explain Fisher Information intuitively (how much data tells us about the parameter).
          *   **Reference Priors:** Mention briefly as a generalization.
          *   **Group Invariance:** (Jaynes) If the problem has symmetry (like scale), use that.
      *   **Concrete Recommendations:**
