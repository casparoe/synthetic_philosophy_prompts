          *   **For Rates ($\lambda$):** Recommend $1/\lambda$ (Uniform on log) over Uniform on $\lambda$. Explain scale invariance.
      *   **Practical Advice/Defense:** How to talk to the colleague. Admit the subjectivity but argue for *invariance* as the objective criterion. Mention that with enough data, the prior matters less (posterior dominance).
      *   **Caveats:** Improper priors, proper posteriors, and the fact that "no information" is a myth (there's always *some* assumption).

  6.  **Refining the Content (Self-Correction/Nuance):**
