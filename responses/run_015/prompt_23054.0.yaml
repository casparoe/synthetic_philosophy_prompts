answer: |-
  Your friend is correct, and their objection strikes at one of the deepest foundational issues in Bayesian statistics. You are not alone in this confusion; for decades, statisticians debated whether a "state of ignorance" could be mathematically formalized. The short answer is that **a uniform prior is not invariant under reparameterization**, meaning that claiming "I know nothing" yields different mathematical results depending on the units or scale you choose to write the problem in.

  Here is an account of why this happens, how modern statistics resolves it, and concrete recommendations for the parameters you mentioned.

  ### 1. The Core Problem: Reparameterization Distorts Flatness

  Your intuition relies on the **Principle of Indifference**: if there is no reason to prefer value $A$ over value $B$, assign them equal probability. This works perfectly for finite discrete sets (e.g., a die roll). However, for continuous quantities, "equal probability" requires a **measure** (a way of measuring distance or volume).

  If you place a uniform prior on a parameter $\theta$, you are asserting that the probability density $p(\theta)$ is constant. However, if you transform that parameter to $\phi = f(\theta)$, the density changes according to the **change-of-variables formula**:

  $$p(\phi) = p(\theta) \left| \frac{d\theta}{d\phi} \right|$$

  Unless the derivative $\frac{d\theta}{d\phi}$ is constant (i.e., a linear shift), a uniform distribution on $\theta$ becomes **non-uniform** on $\phi$.

  **Example: Probability vs. Log-Odds**
  Suppose you are modeling a success probability $p \in [0,1]$.
  *   **Choice A:** You place a Uniform(0,1) prior on $p$. This implies $p(p) = 1$.
  *   **Choice B:** You decide the "natural" scale is the log-odds, $\phi = \log(\frac{p}{1-p})$. If you place a Uniform prior on $\phi$, you are implicitly placing a **logistic distribution** on $p$.

  These two priors assign very different probabilities to extreme values. A Uniform(0,1) on $p$ suggests values near 0.5 are just as likely as values near 0.01. A Uniform prior on log-odds suggests that orders of magnitude are equally likely, placing much more density near 0 and 1. Both claim to represent "ignorance," but they contradict each other. This is the continuous analog of Bertrand's Paradox: "random" is undefined without specifying the method of selection (the parameterization).

  ### 2. Principled Resolutions: How to Break the Tie

  To defend a prior choice to a statistician, you cannot appeal to "simplicity" (flatness). You must appeal to **invariance**. The goal is to find a prior that represents the same state of knowledge regardless of how the parameter is measured.

  #### The Jeffreys Prior
  The standard solution, proposed by Harold Jeffreys (1946), is to construct a prior based on the **Fisher Information** $I(\theta)$. The Fisher Information measures how much "information" an observable random variable carries about an unknown parameter. Intuitively, if the likelihood function is very sharp (high information), the data tells us a lot; if it is flat (low information), the data tells us little.

  Jeffreys suggested that a prior representing ignorance should be proportional to the square root of the Fisher Information:
  $$p(\theta) \propto \sqrt{I(\theta)}$$

  **Why this works:** The Fisher Information transforms in a specific way under reparameterization that exactly cancels out the distortion from the change-of-variables formula. If you compute the Jeffreys prior for $\theta$, and then compute the Jeffreys prior for $\phi = f(\theta)$, the resulting distributions are mathematically consistent. They represent the same state of ignorance.

  #### Reference Priors
  A more modern generalization (developed by José Bernardo) is the **Reference Prior**. These are designed to maximize the Kullback-Leibler divergence between the prior and the posterior, essentially ensuring that the data contributes as much information as possible relative to the prior. In single-parameter cases, Reference Priors usually coincide with Jeffreys Priors.

  ### 3. Concrete Recommendations

  Here is how you should handle the two specific cases you mentioned to ensure your choice is defensible.

  #### Case A: A Probability ($p \in [0,1]$)
  *   **The Naive Choice:** $\text{Beta}(1, 1)$, which is Uniform(0,1).
      *   *Critique:* This implies that $p$ is equally likely to be between 0.4 and 0.5 as it is between 0.0 and 0.1. It is not invariant to transformations like the logit.
  *   **The Defensible Choice:** $\text{Beta}(0.5, 0.5)$, the **Jeffreys Prior**.
      *   *Density:* $p(p) \propto p^{-0.5}(1-p)^{-0.5}$.
      *   *Shape:* This distribution is U-shaped, with infinite density at 0 and 1.
      *   *Justification:* This prior is invariant under reparameterization. It acknowledges that without data, we should not rule out the possibility that the event is impossible ($p=0$) or certain ($p=1$). It is the standard "non-informative" prior for binomial proportions.
      *   *Practical Note:* If you have even a small amount of data, the difference between Beta(1,1) and Beta(0.5, 0.5) vanishes quickly. However, for a *default* prior intended to represent pure ignorance, Beta(0.5, 0.5) is theoretically superior.

  #### Case B: A Rate ($\lambda \in [0, \infty)$)
  *   **The Naive Choice:** Uniform($0, \infty$).
      *   *Critique:* This is an **improper prior** (it does not integrate to 1). More importantly, it implies that a rate of 1,000,000 is just as likely as a rate of 1. This is rarely a true state of ignorance; it is actually a strong assumption that the value is likely to be huge.
  *   **The Defensible Choice:** $p(\lambda) \propto 1/\lambda$.
      *   *Equivalent to:* A Uniform prior on $\log(\lambda)$.
      *   *Justification:* This is the **scale-invariant prior**. If you measure the rate in "failures per hour" or "failures per second," your inference should not change. A uniform prior on $\lambda$ changes depending on the time unit; a $1/\lambda$ prior does not. It implies that all *orders of magnitude* are equally likely (e.g., it is equally likely that $\lambda$ is between 1 and 10 as it is between 10 and 100).
      *   *Practical Note:* Like the uniform prior, this is improper. You must ensure your likelihood function is strong enough to produce a proper posterior (which is true for standard exponential/Poisson models with at least one observation).

  ### 4. How to Defend This to Your Colleague

  When you return to this discussion, you can concede the point on the Principle of Indifference while pivoting to **Invariance**. Here is a script for that defense:

  1.  **Acknowledge the Paradox:** "You were right that a flat prior depends on parameterization. A uniform prior on probability is not uniform on log-odds."
  2.  **State the Criterion:** "However, 'no information' shouldn't mean 'flat density.' It should mean 'invariant inference.' I am choosing a prior that yields the same posterior probabilities regardless of whether I parameterize the model in terms of rates, log-rates, or probabilities."
  3.  **Name the Solution:** "Therefore, I am using the **Jeffreys Prior** (or Reference Prior). For the probability parameter, that is Beta(0.5, 0.5), and for the rate parameter, that is $1/\lambda$."
  4.  **The "Smuggling" Objection:** If they argue that Jeffreys priors still smuggle in assumptions (e.g., the U-shape of Beta(0.5, 0.5)), admit it. "All priors contain assumptions. The assumption here is not about the value of the parameter, but about the **metric** of the parameter space. I am assuming that the Fisher Information is the correct metric for 'distance' in this space."

  ### Summary of Implications

  1.  **"Uninformative" is a misnomer:** There is no such thing as a prior that has *no* influence. There are only priors that attempt to minimize influence relative to the data or maximize invariance. It is better to call them **Reference Priors**.
  2.  **Flatness is not neutral:** A flat prior on a continuous parameter is actually a strong assumption about the scale of measurement.
  3.  **Data usually wins:** In practice, if you have a moderate amount of data, the likelihood will overwhelm the prior, and the difference between Uniform(0,1) and Beta(0.5, 0.5) will be negligible. The choice matters most when data is scarce.
  4.  **Recommendation:**
      *   For **Probabilities**: Use **Beta(0.5, 0.5)**.
      *   For **Rates/Scales**: Use **$1/\lambda$** (Uniform on log).

  By adopting these, you move from a philosophical defense of "indifference" to a technical defense of "invariance," which is the standard language of modern Bayesian theory.
