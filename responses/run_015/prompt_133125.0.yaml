answer: |-
  The Oakhaven Water Cooperative is a single-owner utility serving a rural district. The proprietor, who is also the sole on-duty system operator, deploys a deterministic pressure-regulation algorithm to manage aging infrastructure. The code is open-source and transparent: if a catastrophic main break is predicted in the high-density Zone A, the system automatically reduces pressure in low-density Zone B to preserve the main. The proprietor knows the aggregate statistics: the system will prevent ten catastrophic bursts per year but will inevitably cause hydrant failure in Zone B once every five years, leading to a probable fatality during a fire. Manual control is statistically worse, resulting in more bursts and more deaths overall. One evening, a fire ignites in Zone B. The system detects a threat to the Zone A main and drops pressure. The proprietor, monitoring the screen, could physically override the command but knows that doing so would violate the safety protocol they themselves authorized and would gamble thousands of lives for one. They watch the pressure drop. The hydrants fail. One identifiable person burns to death. The proprietor pays the wrongful death settlement without litigation, yet the moral question of who is responsible for *this* specific death remains unsettled.

  **Check:**

  *   **Blaming the human:** Blocked. The proprietor acted as any reasonable operator would; overriding a statistically superior safety protocol to save one life at the risk of thousands is negligence, not virtue. The design forces the choice between rational protocol and irrational heroism.
  *   **Assigning liability:** Succeeds cleanly. The proprietor pays compensation; the legal ledger is balanced. However, the moral ledger feels unbalanced because the proprietor did not *choose* this death in the moment; they chose a *policy* that deterministically produced it.
  *   **Abstentionism:** Unavailable. Returning to manual control increases the total death count. Refusing to deploy the system is morally worse than deploying it and accepting the residue.
  *   **Debunking:** Fails. This is not an "accident" like a slipped wrench or a random pipe burst. It was a calculated, deterministic output of a system functioning exactly as intended.

  **Structural Feature:**
  The work is done by **Algorithmic Particularization**: the decoupling of *ex-ante* authorization of a risk profile from the *ex-post* causation of a specific harm. The human authorizes the *rule*, but the algorithm executes the *instance*.

  **Response Availability:**
  If this feature is removed (i.e., the human must manually execute the pressure drop for each specific instance), the **Blaming the Human** response becomes available again. We would hold the operator fully responsible for pulling the lever that killed the victim, even if it was for the greater good. The algorithm absorbs the agency of the particular act.

  **Objection and Verdict:**
  The strongest objection is that there is no gap: the proprietor is responsible because they authorized the risk profile knowing it entailed specific deaths. This is simply "risk imposition," a familiar moral category.
  **Verdict:** This objection fails to land. While the proprietor is responsible for the *risk*, there is a moral residue regarding the *killing*. In standard risk imposition (e.g., driving a car), the harm is probabilistic and contingent on external factors. Here, the harm is deterministic and guaranteed by the system's logic once the trigger conditions are met. The algorithm acts as a moral buffer, transforming a direct sacrifice into an administrative output. The gap is not about *who* to blame, but about the *nature* of the causal link between human will and specific harm. It is a novel problem because it separates the *authorization of death* from the *decision to kill* in a way that traditional risk imposition does not.
