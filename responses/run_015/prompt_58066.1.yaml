  3. One Tuesday, Elias reached for the southern valve but stopped, his hand hovering. The open page before him read *The Caretaker hesitates when the pressure drops*, written three days prior. He had not known he would hesitate until he read that he had. A shiver of recognition passed through him, a resonance between the muscle memory in his arm and the symbol on the page. The hesitation hung in the damp air between them, unclaimable by the flesh or the ink, a ghost generated by the feedback of the record against the hand that wrote it.

