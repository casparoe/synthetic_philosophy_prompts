  1. Elias opened the leather-bound logbook, damp with sea air, to the page marked *Year 42*. The previous caretakers had written in a steady, impersonal hand, documenting not just the tide levels but the habits of the role itself: *The Caretaker prefers coffee over tea during storm surges; The Caretaker tends to check the southern valve twice.* Elias read these entries as archaeological strata, instructions left by ghosts to govern the living flesh that now occupied the chair. He was the operator, and the book was the manual, distinct and separate.

