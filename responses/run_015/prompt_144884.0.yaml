answer: |-
  ### Reconstruction of the Argument

  Your friend's argument is a concise formulation of **Ergodicity Economics**, specifically the version advanced by Ole Peters and colleagues. It attempts to resolve the St. Petersburg paradox and the Kelly criterion debate not by positing a subjective utility function, but by appealing to the objective dynamics of the wealth process.

  Here is the structure as I reconstruct it:

  1.  **The Dynamics (1–3):** In a multiplicative process, the ensemble average (expected value) diverges from the time average (typical trajectory). Because the agent exists in time, not in an ensemble, the time-average growth rate is the physically relevant metric. For the specific coin ($1.5 \times 0.6$), the time-average is negative, implying ruin for an EV-maximizer.
  2.  **The Generalization (4–5):** This dynamic is universal to compounding systems (biological, financial, institutional) and is independent of the time horizon. The optimization rule (maximize expected log) is myopic; it does not require looking ahead to a deadline or boundary.
  3.  **The Normative Leap (6):** Therefore, any rational agent facing compounding risks should maximize expected log wealth, regardless of specific goals, deadlines, or constraints.

  The argument is seductive because it claims to derive an "ought" (maximize log) directly from an "is" (multiplicative dynamics), bypassing the need for a subjective utility function. It posits that **rationality is alignment with the time-average dynamics.**

  ### The Load-Bearing Step

  I reject **Step (5)**: *"Nothing in it turns on the horizon either. The log rule is myopic... so it is what you should do on the last bet as well as on the first."*

  While the Kelly fraction is mathematically myopic (the optimal fraction is constant regardless of remaining steps *for an unconstrained log-maximizer*), the **justification** provided in steps (1)–(3) is fundamentally asymptotic. It relies on the Law of Large Numbers applied to log-returns. This convergence ("almost surely") only holds as $T \to \infty$.

  **Why it looked safe:**
  Step (5) looks safe because the Kelly criterion *is* a myopic strategy *if* your objective is to maximize expected log wealth. It is easy to conflate the *property of the strategy* (myopia) with the *validity of the objective* (growth rate maximization) across all horizons. The argument smuggles in the assumption that the "long-run" justification applies to the "short-run" decision without a discount factor or adjustment. It treats the *limit* as the *current state*.

  **The Diagnosis:**
  The argument proves too much because it conflates **survival in the limit** with **optimality in the finite**. The ergodicity argument (1–3) demonstrates that EV maximization leads to ruin *eventually*. It does not demonstrate that Log maximization leads to the *best outcome* for a specific finite goal. By asserting horizon independence, Step (5) severs the link between the *justification* (asymptotic convergence) and the *application* (finite decision).

  ### Priced Comparison of Alternatives

  To see the cost of accepting Step (5), we must compare the "price" paid by following the Log rule versus alternative strategies in your three counter-cases. The "price" is measured in **probability of achieving the agent's actual objective.**

  | Context | Objective | Log Strategy (Friend's View) | Optimal Strategy (Alternative) | The Price of Log |
  | :--- | :--- | :--- | :--- | :--- |
  | **(a) Foundation** | Maximize total social impact (sum of grants). | Declines positive-EV, negative-log grants. Reduces variance. | Accepts positive-EV grants if risk is diversified across endowment. | **Lost Impact:** The foundation passes up value. Because the foundation is an ensemble of grants, the "single path" risk is mitigated by diversification, making EV closer to the relevant metric. |
  | **(b) Deadline Target** | Maximize $P(W_T > H)$. | Maximizes median wealth. Ignores $H$. | **Goal-Reach:** Bet more if $W_t \ll H$ (to catch up); bet less if $W_t \gg H$ (to lock in). | **Missed Target:** If the target requires aggressive growth, Log betting yields a probability of success near zero, whereas a "bold play" strategy might offer a non-zero chance. |
  | **(c) Capital Floor** | Maximize growth subject to $P(\text{ruin}) < \epsilon$. | Accepts deep drawdowns. Ruin is asymptotic, but possible in finite time. | **Constrained Growth:** Reduce leverage to ensure survival probability meets $\epsilon$. | **Premature Ruin:** Log optimization does not account for the absorbing barrier until it is hit. A constrained strategy sacrifices growth rate to buy survival insurance. |

  ### Addressing Your Three Cases

  You are correct that (6) is false. Here is how rejecting Step (5) resolves your specific worries without abandoning the core insights of (1)–(3).

  **(a) The Foundation (Diversification vs. Time)**
  The friend's argument relies on the agent being a "single path" through time. However, a foundation making many independent grants effectively creates an **ensemble across space** (grants) at each time step.
  *   **Resolution:** If the number of independent grants $N$ is large, the aggregate return distribution narrows by the Central Limit Theorem. The foundation's wealth path becomes smoother, approximating the ensemble average.
  *   **Implication:** For a diversified foundation, the "single path" risk is mitigated. They can afford to be more risk-neutral (EV-focused) on individual grants because the *portfolio* behaves ergodically even if the *individual bets* do not. Rejecting (5) allows us to say: "The horizon and the diversification structure matter."

  **(b) The Deadline Target (Finite Horizon)**
  This is the strongest refutation of Step (5). The ergodicity argument is an asymptotic claim ($T \to \infty$). A retirement deadline is a fixed $T$.
  *   **Resolution:** In finite time, the distribution of wealth has not yet collapsed to the time-average growth rate. There is still significant variance.
  *   **Implication:** If you need \$10M and have \$1M with 5 years left, the Log strategy (which preserves capital) guarantees failure. You must maximize the *probability of the tail*, not the *center of the distribution*. Rejecting (5) allows you to say: "When $T$ is finite, the variance matters more than the drift."

  **(c) The Capital Floor (Absorbing States)**
  Step (1) claims wealth evolves multiplicatively. But if wealth hits zero, it stops. This is an **absorbing barrier**.
  *   **Resolution:** The existence of a floor breaks the ergodicity. The time-average over an infinite horizon is zero (ruin) for *any* strategy that allows a non-zero probability of hitting the floor. The Log rule minimizes this probability but does not eliminate it.
  *   **Implication:** Rational choice near a floor requires **survival constraints**, not just growth optimization. You must maximize growth *subject to* $P(\text{hit floor}) < \delta$. This explicitly violates the myopia of Step (5), as the bet size depends on the distance to the floor.

  ### The Relation Between "Growth" and "Better"

  You asked: *What exactly is the relation between "higher almost-sure growth rate" and "better for the agent" that the argument is trading on?*

  The argument trades on an implicit identity: **Utility $\equiv$ Log(Wealth).**

  In standard decision theory, we maximize $E[U(W)]$.
  In the Ergodicity argument, they maximize $E[\log(W)]$ and claim this is derived from physics, not preference.
  *   **The Trade:** They argue that because $W_T \approx W_0 e^{g T}$ (where $g$ is the time-average growth rate), maximizing $g$ maximizes $W_T$ for large $T$.
  *   **The Flaw:** This is only "better" if the agent's utility is linear in terminal wealth $W_T$. If Utility is $W_T$, then maximizing the *median* $W_T$ (which Log does) is not the same as maximizing the *expected* $W_T$ (which EV does), nor is it the same as maximizing $P(W_T > \text{Target})$.

  **The Verdict:**
  Higher almost-sure growth is "better" **if and only if**:
  1.  The horizon is sufficiently long for the Law of Large Numbers to dominate variance.
  2.  There are no absorbing barriers (ruin floors).
  3.  The agent has no specific target liability (step-function utility).
  4.  The agent's utility function is approximately logarithmic (diminishing marginal utility of wealth).

  By rejecting Step (5), you preserve the physical truth of (1)–(3) (wealth *does* grow geometrically in the long run) without accepting the normative universality of (6). You can acknowledge that the Log rule is the **survival strategy for the infinite horizon**, while maintaining that **finite agents with specific goals** must optimize for their specific constraints, not the asymptotic limit they will never reach.
