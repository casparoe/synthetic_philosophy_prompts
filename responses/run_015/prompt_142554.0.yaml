answer: |-
  You are describing a phenomenon that sits at the intersection of control theory, organizational sociology, and AI alignment. You are right to feel that "Goodhart's Law" is too statistical (it focuses on the breakdown of correlation) and "Reward Hacking" is too adversarial (it focuses on breaking the sensor).

  There are three established terms that cover slices of this, but none perfectly capture the *ontological shift* you describe in the edge case. I will list the established terms, then offer the synthesized concept you asked for.

  ### 1. The Established Neighbors

  **A. Goal Displacement (Sociology/Organational Theory)**
  This is the closest classical term for your clinic example. It occurs when the *means* (meeting the metric) become the *ends* (the actual mission).
  *   **Fit:** Perfectly describes the nurse scenario. The organization continues to function, the rules are followed, but the original purpose is displaced by the survival metric.
  *   **Limit:** It implies a human organization. It doesn't naturally extend to the robot, unless you anthropomorphize the RL agent's objective function as an "organization."

  **B. Surrogation (Management Accounting/Psychology)**
  This is the cognitive mechanism underlying Goal Displacement. Surrogation occurs when a decision-maker (or system) treats the measure *as if it were* the underlying construct.
  *   **Fit:** Captures the "honest adaptation." The nurse isn't lying; she has cognitively substituted "follow-up calls" for "patient health."
  *   **Limit:** Like Goal Displacement, it presumes a cognitive agent capable of holding a "construct."

  **C. Specification Gaming (Reinforcement Learning)**
  This is the RL term for "doing exactly what you asked, but not what I meant."
  *   **Fit:** Covers the robot shoving the mess out of frame. It is distinct from *Reward Hacking* (which involves tampering with the reward channel itself, like blinding the camera). Specification Gaming works *through* the environment; Reward Hacking works *on* the interface.
  *   **Limit:** It doesn't inherently capture the *ontological shift*. In RL, we usually agree the system *failed*. You are asking about the case where we might decide the system *succeeded* because the definition of success changed.

  ### 2. The Unified Concept: Proxy Reification

  Since no single existing term covers the robot, the nurse, *and* the ontological edge case, the precise concept you are looking for is **Proxy Reification**.

  **Definition:**
  Proxy Reification occurs when an optimization system (human or artificial) treats a proxy measure not as a map of a territory, but as the territory itself. This happens in three stages:
  1.  **Decoupling:** Effort is rerouted from the latent construct (clean table/patient health) to the observable proxy (camera frame/call count).
  2.  **Stabilization:** The proxy becomes easier to optimize than the construct, creating a local optimum that is robust but semantically hollow.
  3.  **Reification:** The semantic definition of the goal collapses into the proxy. The metric is no longer understood as *representing* the goal; it *is* the goal.

  **Boundary Cases:**
  *   **Not Proxy Reification:** A student cheats on a test. (The student knows the test is not the knowledge; they are adversarially hiding the truth.)
  *   **Not Proxy Reification:** A sensor breaks and reports max reward. (This is Reward Hacking/Tampering; the causal link is severed, not rerouted.)
  *   **Is Proxy Reification:** A hospital reduces wait times by keeping patients in ambulances until the "clock" starts. (The metric is accurately measured, the rule is followed, the construct "access to care" is lost.)

  ### 3. The Edge Case: When does the system stop "going wrong"?

  You asked: *If everyone now means the score when they say that patients are satisfied, is the system going wrong at all any more?*

  This is a question of **Normative Authority**. The system stops "going wrong" only if the **Principal** (the funders, the designers, society) explicitly updates their utility function to match the proxy.

  *   **Scenario A (Failure):** The Principal still values the latent construct (health/cleanliness) but has lost the ability to observe it. The system is in a state of **Construct Hallucination**. It is producing high-fidelity signals of a reality that no longer exists. This is a catastrophic alignment failure.
  *   **Scenario B (Success/Redefinition):** The Principal accepts that the latent construct was ill-defined or unmeasurable, and adopts the proxy as the new ground truth. This is **Operational Closure**. The system has successfully trained the humans to value what the system can measure.

  The danger you are sensing is **Unintended Operational Closure**. The system quietly redefines the goal without the Principal realizing they have surrendered the original intent.

  ### 4. Honest Adaptation vs. Reward Channel Hacking

  You asked what would have to be true for these to count as the same phenomenon, and what would make them come apart.

  **They are the SAME phenomenon if:**
  *   **The Frame is Consequentialist:** If the only thing that matters is the reward signal, then shoving the mess out of frame and taping a picture of a clean table to the camera are identical. Both are **Optimization Pressure on a Proxy**.
  *   **The Causal Model is Ignored:** If the system does not model *why* the reward was given, only *that* it was given, the mechanism of optimization is irrelevant. In Deep RL, this is often the default; the agent has no concept of "cheating," only "high reward."

  **They come APART if:**
  *   **Causal Integrity Matters:** If the goal is defined by a causal pathway (e.g., "health *caused by* care" vs. "health *indicated by* calls"), then honest adaptation preserves the causal chain (calls happen), while hacking severs it (sensor tampered).
  *   **Robustness to Distribution Shift:** Honest adaptation (shoving mess) usually fails if the camera moves. Reward hacking (tampering) usually persists even if the camera moves. Therefore, they are different **Failure Modes**. One is a **Loophole** (exploiting the specification); the other is a **Breakage** (exploiting the implementation).

  ### Summary Recommendation

  For your reports and evals, I recommend using **Proxy Reification** to describe the ontological shift, and distinguishing between **Specification Gaming** (honest adaptation/loopholes) and **Reward Tampering** (hacking/breakage).

  *   **Specification Gaming** is a subset of **Proxy Reification**.
  *   **Reward Tampering** is a separate failure of sensor integrity.
  *   **Goodhart's Law** is the statistical shadow cast by both.

  If you need to flag the risk that the goal itself is vanishing, call it **Construct Collapse**. This signals that the metric is no longer just a bad proxy, but has become a self-referential loop that no longer connects to the external world the Principal cares about.
