  **The Priority Fund: 2023 Annual Impact Report**

  **From the Desk of the CEO**
  Dear Partners,
  Welcome to a year of rigorous compassion. In 2023, we remained steadfast in our mission to maximize priority-weighted welfare. We noticed some donors asking if we are "closing the gap" between rich and poor. We love this energy, but we gently correct the framing: gaps are relational distractions. We care only about absolute levels, heavily weighted toward the bottom. Inequality is merely a shadow; we chase the light.

  Our Priority Dial began the year at $\epsilon = 2.5$. By Q3, following a robust sensitivity analysis, we adjusted to $\epsilon = 2.8$. This subtle turn radically altered our portfolio, shifting resources from the "moderately deprived" to the "absolutely lowest." The math is cold, but the heart is warm.

  **Programme Highlights**

  **1. Regional Vaccination Drive (Q1-Q2)**
  *   **Beneficiaries:** 50,000 individuals (Baseline Welfare: 40/100).
  *   **Cost:** $10M.
  *   **Outcome:** Successful delivery.
  *   **Priority Weighted Units (PWU):** +12,500.
  *   **Status:** Completed. However, as the Dial turned in Q3, this demographic became too "well-off" to justify further investment. We ceased booster shipments mid-stream to reallocate capital.

  **2. Project Crumb (Q3)**
  *   **Beneficiary:** Individual ID #8940 (Baseline Welfare: 2/100).
  *   **Cost:** $45M.
  *   **Outcome:** Delivery of one nutrient-dense biscuit.
  *   **Collateral Impact:** Local market collapse due to resource diversion (-5,000 welfare units for 200 merchants).
  *   **PWU:** +15,000.
  *   **Status:** **High Success.** While the merchants suffered absolute losses, ID #8940's marginal gain, when processed through our weighting function, outweighed the aggregate loss. Crucially, ID #8940 *did* gain (Pareto satisfied), licensing the broader ecosystem contraction.

  **3. The Ex Ante Guarantee Fund (Q4)**
  *   **Beneficiaries:** Probabilistic cohort.
  *   **Cost:** $100M.
  *   **Outcome:** Zero actual welfare generated (supply chain failure).
  *   **PWU:** +50,000 (Projected).
  *   **Status:** **Success.** As ex ante prioritarians, we measure value at the moment of signing. The expected utility was positive when the wire transferred. That the biscuits rotted in a warehouse is morally irrelevant noise. We booked the win.

  **Closing Note**
  Some stakeholders express concern that Project Crumb spent $45M on a single biscuit. We urge patience. When the weight on the worst-off is high enough, a crumb outweighs a castle. We are not here to be efficient; we are here to be correct.

  **Technical Appendix**
  *   **Weighting Function:** $w(u) = u^{(1-\epsilon)}/(1-\epsilon)$.
  *   **Current Setting:** $\epsilon = 2.8$.
  *   **Marginal Weight:** At welfare level 2, marginal value is 5.6x higher than at level 40.
  *   **Constraint:** No grant approved without strictly positive gain for at least one recipient. Levelling down is prohibited; we prefer destructive leveling up.

  ***

  *Footnote 1: Ben in Evaluation continues to ask "who actually received anything" and "why the merchants starved." We have reassigned Ben to archival duty. His concern for realized outcomes is noted but falls outside our ethical framework.*
