answer: |-
  Here is the translation of the verisimilitude problem into statistical decision theory vocabulary, testing your proposed mapping against the logical constraints.

  ### The Translation

  Popper's motivating picture translates to **estimation under misspecification**. The "truth" is the data-generating distribution $P^*$ or the true parameter $\theta^*$. The "theories" are candidate models $Q_\theta$ within a model class $\mathcal{M}$. Since $\mathcal{M}$ is typically misspecified (no $Q_\theta = P^*$), progress is defined as selecting a $Q_\theta$ that minimizes **risk** relative to $P^*$.

  Popper's formal proposal (truth content minus falsity content) maps structurally to the asymmetry of **KL divergence**. Truth content (true consequences) corresponds to the **zero-avoiding** direction ($D_{KL}(P^* || Q_\theta)$), penalizing the model for failing to cover regions where the truth has mass. Falsity content (false consequences) corresponds to the **zero-forcing** direction ($D_{KL}(Q_\theta || P^*)$), penalizing the model for placing mass where the truth has none.

  The **collapse objection** translates to a property of proper scoring rules under strict falsity. If $Q_\theta$ is strictly false (assigns zero probability to an event that occurs), the **log loss** is infinite. Consequently, any false theory has infinite risk. You cannot compare two infinities to determine which is "closer" to zero risk. The ordering collapses.

  The **likeness approach** (Tichý, Niiniluoto) translates to defining a **loss function** $L(\theta^*, \hat{\theta})$ on the parameter space rather than the outcome space. The "best-case" term (closest possible world) maps to the distance from $\theta^*$ to the nearest point in the model's support (minimizing bias). The "aggregate" term (weighted average over worlds) maps to the **variance** or dispersion of the estimator over the admitted parameter set. The total verisimilitude measure becomes a **risk decomposition**: Bias (distance to truth) + Variance (spread of admitted possibilities).

  ### Testing Your Mapping

  1.  **Truth/Content vs. Divergence Directions:** This holds structurally but strains semantically. Divergence directions measure informational penalty, not logical consequence. $D_{KL}(P^* || Q)$ penalizes missing truth (falsity of omission); $D_{KL}(Q || P^*)$ penalizes asserting falsehood (falsity of commission). This captures the Popperian tension, but only if you accept "content" as "probability mass."
  2.  **Best-case/Aggregate vs. Distance/Spread:** This translates cleanly. The likeness measure's minimum distance is the **bias** term (distance from estimand to closest estimator). The aggregate is the **variance** term (dispersion of the estimator). The tension between precision and caution is exactly the bias-variance tradeoff.
  3.  **Weighting vs. Capacity:** This is honest. Weighting the best-case against the aggregate is equivalent to tuning a **regularization parameter**. High weight on the best-case favors high-capacity models (sharp, risky); high weight on the aggregate favors low-capacity models (diffuse, safe).
  4.  **Metric Arbitrariness vs. Loss/Measure:** This translates perfectly. The philosophical complaint that the similarity metric is arbitrary is the statistical fact that **loss functions are not unique**. There is no "true" loss; there is only loss relative to a decision problem. The "arbitrariness" is not a bug of the likeness approach; it is a feature of decision theory.

  ### The Three Test Cases

  **Case 1: Nine Planets vs. Not-Nine.**
  *Truth:* 8 planets. *Theory A:* "9 planets" (Point mass at 9). *Theory B:* "Not 9" (Uniform over $\mathbb{N} \setminus \{9\}$).
  *Philosophical Intuition:* A is closer to truth than B.
  *Statistical Translation:*
  Under **log loss** (predictive accuracy), Theory A assigns $P(8)=0$. Risk is $\infty$. Theory B assigns $P(8) > 0$. Risk is finite. Statistics ranks B > A. The vocabulary fails the intuition.
  To recover the intuition, you must switch from outcome-space loss to parameter-space loss (e.g., **squared error** on the number of planets). Loss(A) = $(9-8)^2 = 1$. Loss(B) = $E[(\theta-8)^2]$, which is large. Now A > B.
  *Result:* Your suspicion is correct. The statistical vocabulary only validates the intuition if you import a **metric on the parameter space**. This confirms the philosophical charge: the ranking depends on an arbitrary choice of loss representation (counting planets vs. predicting observations).

  **Case 2: The Tautology.**
  *Theory:* "The number of planets is some number." (Uniform over all $\mathbb{N}$).
  *Philosophical Intuition:* Minimally close to truth (zero content).
  *Statistical Translation:*
  This is a maximum entropy distribution. Under log loss against a sharp truth, risk is high (poor prediction). Under parameter-space squared error, risk is infinite (variance is infinite).
  *Result:* Statistics ranks the tautology as "high risk" (bad). Popper ranks it as "low verisimilitude" (uninformative). These align negatively: high risk correlates with low verisimilitude *if* verisimilitude implies utility. However, Popper wants to distinguish "false but close" from "true but vacuous." Statistics distinguishes them via **bias vs. variance**. The tautology has zero bias (it covers the truth) but infinite variance. A false precise theory has high bias but zero variance. The vocabulary can distinguish them, but only by decomposing risk, not by a single scalar "closeness."

  **Case 3: Logical Relation vs. Expectation.**
  *Philosophical Claim:* Verisimilitude is a logical relation between theory and truth, independent of evidence or sampling.
  *Statistical Constraint:* **Risk** is defined as an expectation over a sampling distribution $P(x|\theta)$. Even if you fix $\theta^*$ (the truth), the definition of loss often presupposes a sampling context (e.g., predictive density).
  *Result:* The translation fails here. You cannot define risk without a distribution. To make verisimilitude "logical," you must degenerate the sampling distribution to a point mass at the truth. Then Risk collapses to Loss. But Loss is not logical; it is pragmatic. The statistical vocabulary cannot express "closeness" without invoking a **cost function**. There is no distribution-free metric in this vocabulary. The framework forces you to admit that "closeness to truth" is always "closeness relative to a penalty."

  ### Residue Report

  **What Translates Cleanly:**
  The structural tension between content and truth maps cleanly to the **bias-variance decomposition** and the asymmetry of **KL divergence**. The complaint about arbitrary metrics translates cleanly to the **dependence on loss functions and dominating measures**. The capacity knob in model selection is an honest translation of the weighting parameters in likeness measures.

  **What Requires Imports:**
  To save the intuition that "precise falsehoods are better than vacuous truths" (Case 1), you must import a **geometry on the parameter space** (e.g., Euclidean distance between parameters) that is not intrinsic to the probability model itself. Standard statistical decision theory operates on outcome spaces (distributions); verisimilitude operates on proposition spaces (worlds). You must force propositions into parameters to make the math work.

  **What Cannot Be Expressed:**
  The **logical status** of verisimilitude cannot be expressed. In statistics, all comparisons are conditional on a loss function and a distribution. There is no "view from nowhere." The statistical vocabulary collapses the distinction between **ontology** (what is true) and **epistemology** (what is costly to miss). You can define "distance to truth" only if you define "cost of error."

  **The Geometry Defect:**
  The likeness approach requires a geometry on the space of possibilities. The statistical vocabulary provides **information geometry**, but it is induced by the parametrization and the Fisher information metric. It is not intrinsic to the propositions themselves. This is not a defect of the vocabulary; it is a sign that the likeness approach helped itself to an arbitrary choice. The statistical vocabulary exposes that choice: you are selecting a feature representation. There is no metric-free similarity.

  **Truth vs. Support:**
  The translation tends to collapse **closeness to truth** with **predictive accuracy**. In statistics, the "pseudo-true parameter" is the one minimizing divergence from the data-generating process. This is defined by performance (support), not by intrinsic likeness. To keep them separate, you must treat $\theta^*$ as fixed and known (counterfactual risk). But even then, the ranking depends on the loss. The vocabulary cannot mark the difference between "closer to truth" and "better for prediction" unless you stipulate two different loss functions, which begs the question of why one measures truth and the other utility.

  **Honesty of the Mapping:**
  Your four-part mapping is honest, but it changes the subject. It relativizes "closeness to truth" to "utility for a specific question." Popper wants verisimilitude to be intrinsic to the theory's relation to the world. The statistical vocabulary asserts there is no such relation without a decision context. The mapping succeeds by revealing that the philosophical problem is actually a problem of **loss function selection**. The "arbitrariness" complained of by philosophers is the necessary specification of the **estimand** in statistics. The translation does not solve the problem; it dissolves it into decision theory.
