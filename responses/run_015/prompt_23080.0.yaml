answer: |-
  Your skepticism is well-founded, and I must say, your former postdoc's assertion that the problem is "well understood and handled without difficulty" is, to put it mildly, a contentious claim within the philosophy of science community. While there are sophisticated Bayesian responses to the Problem of Old Evidence (POE), none are universally accepted as a complete dissolution of the problem. Many prominent philosophers of science (including Clark Glymour, who famously formalized the problem in 1980) argue that it remains a significant wound in the side of strict Bayesianism.

  You are correct that standard Bayesian conditionalization fails here. If $P(E) = 1$, then $P(E|H) = 1$, and Bayes' theorem yields $P(H|E) = P(H)$. No confirmation occurs.

  However, since you asked for the specific Bayesian responses that attempt to salvage the framework, I will outline the two most serious attempts to answer your objections, followed by my recommendation for a non-Bayesian alternative should you find those salvage attempts wanting.

  ### The Bayesian Responses

  There are two main strategies Bayesians employ to handle old evidence. Neither involves the "cosmetic fix" of simply pretending you are uncertain about the evidence itself (i.e., setting $P(E) < 1$ arbitrarily).

  #### 1. The "Entailment" Solution (Garber, Jeffrey)
  This is the most technical and widely discussed Bayesian response. It addresses your "Cosmetic Fix" objection directly by agreeing that $P(E) = 1$.

  *   **The Mechanism:** The argument is that when Einstein realized GR accounted for Mercury's perihelion, he did not update on the evidence $E$ (the anomaly itself), which he already knew. He updated on a *new logical fact*: the proposition that **$H$ entails $E$**. Let's call this proposition $L$ (for logical link).
  *   **Addressing the "Cosmetic Fix":** This approach does not require you to lower your credence in the perihelion anomaly. You remain certain that $E$ is true ($P(E)=1$). However, prior to formulating GR, you were *not* certain that $H$ implied $E$. In fact, before GR existed, the probability of the link was undefined or zero. When you discover that $H \vdash E$, you conditionalize on $L$, not $E$. Since $P(L) < 1$ (you weren't logically omniscient), learning $L$ allows $P(H)$ to rise.
  *   **Addressing the "Ill-Defined Prior":** This requires relaxing the assumption of **logical omniscience**. Standard Bayesianism assumes agents know all logical consequences of their beliefs. The Garber solution admits that agents are not logically omniscient. It allows you to assign a prior to $H$ at the moment of its conception, and then update that prior when you discover the logical relationship between $H$ and the already-known $E$.

  **Critique:** This saves the math, but at a cost. It requires expanding the probability space to include propositions about logical relationships, which complicates the formalism significantly. Critics argue it shifts the problem rather than solving it: how do we assign probabilities to logical entailments?

  #### 2. The Counterfactual (Ur-Prior) Solution
  This approach addresses your "Ill-Defined Prior" objection by changing the temporal perspective.

  *   **The Mechanism:** Confirmation is not measured by comparing your *actual* current credence to your *actual* past credence. Instead, it is measured by comparing your current credence to the credence you *would have had* had you not known $E$. This is sometimes called the "Ur-prior" approach.
  *   **Addressing the "Ill-Defined Prior":** We reconstruct a hypothetical prior $P_{old}(H)$ representing your rational degree of belief in GR before the perihelion data was known (or treating the data as unknown). We then compare this to $P_{new}(H|E)$.
  *   **Addressing the "Cosmetic Fix":** This acknowledges that $P_{now}(E) = 1$ but argues that confirmation is a structural relationship between $H$ and $E$, not merely a psychological update history. It asks: "Does $E$ support $H$?" rather than "Did learning $E$ raise my belief in $H$?"

  **Critique:** This feels closer to scientific practice, but it relies on counterfactual histories that are difficult to define rigorously. What exactly is the "rational credence" in GR in a world where Mercury's orbit is unknown?

  ### My Assessment

  If you find the "Entailment" solution too formalistic (requiring you to model your own logical ignorance) and the "Counterfactual" solution too speculative (requiring you to imagine worlds where data doesn't exist), then you are in good company. Many philosophers believe these solutions save Bayesianism only by changing the subject from *belief updating* to *logical support*.

  Your intuition that standard Bayesianism has "no purchase" on old evidence is correct regarding **strict conditionalization**. The "solutions" are modifications to the theory, not applications of the standard textbook account.

  ### A Non-Bayesian Recommendation

  Given your background in physics, you might find **Inference to the Best Explanation (IBE)** more satisfactory.

  IBE is not a calculus of credences but a heuristic of explanatory power. It aligns closely with how physicists actually reason.

  *   **How it handles Old Evidence:** IBE does not care when the evidence was discovered. It cares about the *explanatory relationship*. The fact that the perihelion anomaly was known for 50 years is irrelevant to whether GR *explains* it better than Newtonian mechanics (plus ad hoc auxiliaries).
  *   **Why it fits your intuition:** In physics, we often say a theory is confirmed because it "makes sense" of disparate phenomena. GR didn't just fit the number; it derived it from the curvature of spacetime, unifying gravity and geometry. IBE captures this "unification" and "explanatory depth" which Bayesian likelihoods often struggle to quantify without ad hoc adjustments.
  *   **The Account:** Peter Lipton's *Inference to the Best Explanation* is the standard reference. He distinguishes between "likeliest" (most probable) and "loveliest" (most explanatory). In the case of old evidence, the "loveliness" of the explanation drives the confirmation, bypassing the temporal problem of when the data was acquired.

  ### Summary

  1.  **Your Postdoc:** She is representing an orthodox Bayesian view that considers the Garber/Entailment solution sufficient. However, calling it "without difficulty" is an overstatement; it requires significant theoretical machinery.
  2.  **Your Objections:** They are valid. The "Cosmetic Fix" you described (setting $P(E) < 1$) is indeed a straw man; the real Bayesian fix is updating on the *entailment*, not the evidence. However, this requires abandoning logical omniscience.
  3.  **Recommendation:** If you want an account that respects the temporal reality of discovery (that $H$ was new, $E$ was old) without resorting to counterfactuals or logical probability spaces, **Inference to the Best Explanation** is the robust non-Bayesian alternative. It validates the intuition that Einstein was confirmed by Mercury not because he "learned" the data, but because his theory provided the first non-ad-hoc explanation for it.

  You are not missing a simple trick; you have identified a genuine fracture point in the philosophy of confirmation. Trust your physicist's instinct: the formalism should serve the science, not force the science to fit the formalism.
