prompt: |-
  I retired from physics a few years ago and have been spending my evenings on philosophy of science, and I keep returning to the so-called problem of old evidence, which I believed I understood until recently. I was discussing it with a former postdoc of mine, and she assured me that the problem is well understood and that Bayesian epistemology handles it without difficulty, but I am not convinced, and I would value a second opinion.

  The textbook case is the anomalous precession of Mercury's perihelion: it was known and quantified from Le Verrier's time, decades before Einstein, and yet it is routinely cited as one of the strongest pieces of evidence for general relativity. On the standard Bayesian account, confirmation is an increase in credence, so that E confirms H just in case P(H | E) exceeds P(H). But if I had already assigned credence one to the perihelion anomaly, then conditionalizing on it changes nothing, and it cannot raise my credence in general relativity at all. The response I have encountered is to say that my credence in the "evidence" was in fact less than one, because what I possess is not a single fact but a body of many individual observations, and that a genuine update is therefore still possible. That strikes me as a cosmetic fix: I do know the anomaly, and modeling myself as uncertain about it merely to make the inequality come out right looks like changing the subject.

  And there is a deeper difficulty that I keep coming back to. General relativity is, for me, a new hypothesis, so I never assigned it a prior credence in the first place, which means the P(H) on the right-hand side of that inequality was never actually defined. It therefore seems to me that Bayesian confirmation theory simply has no purchase on old evidence, and that the honest move is to concede the point and adopt a non-Bayesian account of confirmation. If I am missing a Bayesian response, I would be grateful if you could name it and explain specifically how it answers both the "cosmetic fix" objection and the ill-defined-prior objection; and if you think I am right that Bayesianism cannot handle the case, I would like to know which non-Bayesian account of confirmation you would recommend.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Persona:** Retired physicist, knowledgeable about science, currently studying philosophy of science. Familiar with Bayesian epistemology but skeptical.
      *   **Topic:** The Problem of Old Evidence (POE) in Bayesian confirmation theory.
      *   **Specific Case:** Mercury's perihelion precession (known before GR, confirms GR).
      *   **User's Objections:**
          1.  *The "Cosmetic Fix":* Claiming uncertainty about known evidence ($P(E) < 1$) feels ad hoc/dishonest.
          2.  *The "Ill-Defined Prior":* If $H$ (GR) is new, $P(H)$ wasn't defined *before* $E$ was known, so standard conditionalization $P(H|E) > P(H)$ doesn't work temporally.
      *   **Goal:** Provide a second opinion. Either explain a robust Bayesian solution that addresses both objections specifically OR agree that Bayesianism fails and recommend a non-Bayesian alternative.
      *   **Tone:** Respectful, intellectually rigorous, acknowledging the user's expertise (physics background), avoiding condescension.

  2.  **Deconstruct the Problem of Old Evidence (POE):**
      *   *The Core Issue:* In standard Bayesianism, confirmation is $P(H|E) > P(H)$. By Bayes' Theorem, this requires $P(E|H) > P(E)$. If $E$ is already known with certainty ($P(E) = 1$), then $P(E|H) = 1$ as well. The ratio becomes 1, and no confirmation occurs.
      *   *Historical Context:* Glymour (1980) famously raised this. It's a major sticking point in philosophy of science.
      *   *The User's Postdoc's Claim:* "Well understood... handles it without difficulty." -> This is controversial. Many philosophers think it's *not* solved satisfactorily. The user is right to be skeptical.

  3.  **Evaluate Bayesian Responses:**
      *   *Strategy 1: Counterfactuals (Garber, Jeffrey).*
          *   Idea: Don't update on $E$ itself, but on the *logical relationship* between $H$ and $E$ (i.e., $H \vdash E$).
          *   Mechanism: Expand the probability space to include the proposition "$H$ entails $E$".
          *   Addressing "Cosmetic Fix": It doesn't claim $P(E) < 1$. It claims the *new information* is the entailment, not the evidence.
          *   Addressing "Ill-Defined Prior": It allows assigning priors to $H$ at the time of theory construction, then updating on the discovery of the entailment.
          *   *Critique:* Requires logical omniscience relaxation. Computationally complex. Some find it artificial.
      *   *Strategy 2: Ur-Priors / Temporal Indexing.*
          *   Idea: Compare current credence to what credence *would have been* had you not known $E$.
          *   Addressing "Cosmetic Fix": Acknowledges $P_{now}(E)=1$, but uses a hypothetical past state.
          *   Addressing "Ill-Defined Prior": Reconstructs the prior $P_{then}(H)$.
          *   *Critique:* Counterfactual history is tricky.
      *   *Strategy 3: Likelihoodism (Sober).*
          *   Idea: Focus on Likelihood Ratio $P(E|H) / P(E|H')$.
          *   *Critique:* Doesn't solve the $P(E)=1$ issue directly unless framed carefully.
      *   *Strategy 4: Acceptance of the Problem.*
          *   Many Bayesians admit POE is a serious challenge. The postdoc's claim that it's "without difficulty" is arguably wrong or at least overstated.

  4.  **Evaluate Non-Bayesian Alternatives:**
      *   *Hypothetico-Deductivism (HD):* $H$ entails $E$. $E$ is true. Therefore $H$ is confirmed.
          *   *Pros:* Handles old evidence easily.
          *   *Cons:* Too permissive (any $H$ that entails $E$ is confirmed, even if ad hoc).
      *   *Error Statistics (Mayo):* Severe testing. Did the method have a high capacity to detect errors?
          *   *Pros:* Focuses on methodology rather than belief states.
          *   *Cons:* Different framework entirely.
      *   *Model-Based Accounts:* Focus on how the model fits the phenomenon.

  5.  **Drafting the Response - Step-by-Step:**

      *   **Validation:** Acknowledge the user's intuition. They are right to be skeptical. The postdoc's claim is contentious. POE is one of the most famous *unsolved* (or at least disputed) problems in Bayesian epistemology.
      *   **Addressing Objection 1 (The Cosmetic Fix):**
          *   Explain why $P(E)=1$ is the killer.
          *   Introduce the **Garber/Jefferies Solution** (Learning the Entailment). This is the standard "serious" Bayesian reply.
          *   *How it works:* The update isn't on $E$, but on the proposition "$H$ explains/entails $E$".
          *   *Does it fix the objection?* It avoids setting $P(E) < 1$. It keeps $P(E)=1$ but finds new information elsewhere (the logical link).
      *   **Addressing Objection 2 (The Ill-Defined Prior):**
          *   This relates to the "New Theory" problem.
          *   Bayesian response: **Counterfactual Priors (Ur-Priors)**. We reconstruct what $P(H)$ *would* have been before $E$ was known, or treat the "discovery" of $H$ as the moment priors are assigned, and the "discovery" of the entailment as the update.
          *   *Honest assessment:* This is where Bayesianism gets messy. It requires idealized rational agents.
      *   **The Verdict on Bayesianism:**
          *   Be honest. It's not "without difficulty." It requires modifying standard conditionalization.
          *   The "standard" textbook Bayes ($P(H|E) > P(H)$) *fails* here. Modified Bayes *attempts* to save it.
      *   **Non-Bayesian Recommendation:**
          *   If the user finds Bayesian tweaks unsatisfying (which is reasonable), what fits a physicist's intuition?
          *   **Deborah Mayo's Error Statistics (Severe Testing).** This is often the go-to for scientists. It focuses on the *process* of testing, not the *state* of belief. It handles old evidence by asking: "Was this data used to construct the theory (fitting) or to test it (prediction)?" Wait, actually, Mayo argues old evidence *doesn't* confirm unless it's used in a severe test. This might be tricky for Mercury/GR.
          *   **Better Recommendation:** **Hypothetico-Deductivism (refined)** or **Inference to the Best Explanation (IBE)**.
          *   *IBE:* GR is the *best explanation* for the anomaly, even if the anomaly was known. This aligns well with scientific practice. It bypasses probability calculus.
          *   *Model-Based:* The construction of a model that subsumes old data without ad-hocery is confirmatory.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction on Mayo:* Mayo actually argues that old evidence *cannot* confirm in the same way novel prediction does, unless the testing procedure was severe. She might say the Mercury case is actually problematic for *any* account if the theory was tuned to it (which GR wasn't, really). But IBE is safer.
      *   *Correction on Garber:* Garber's solution is the most technical and "respectable" Bayesian answer. I need to explain it clearly. It shifts the evidence from $E$ to "$H \to E$".
      *   *Tone Check:* Ensure I don't sound like I'm dismissing the postdoc entirely, but validating the user's deeper philosophical instinct. The postdoc represents the "orthodox" view that it's solved; the user represents the "practitioner" view that the math doesn't match the intuition. Both have merit, but the user's skepticism is philosophically defensible.

  7.  **Final Structure:**
      *   **Introduction:** Validate the user. The problem is not "without difficulty."
      *   **The Bayesian "Fix" (Garber/Entailment):** Explain the shift from $E$ to "$H$ entails $E$". Address the "Cosmetic" objection (it doesn't lower $P(E)$). Address the "Prior" objection (logical omniscience relaxation).
      *   **The Cost of the Fix:** Acknowledge that this requires abandoning "standard" Bayesianism (logical omniscience).
      *   **Non-Bayesian Alternative:** Recommend **Inference to the Best Explanation (IBE)**. It captures the "explanatory power" intuition which is strong in physics.
      *   **Conclusion:** Summarize. The user isn't missing anything obvious; the problem is genuine.

  8.  *(Self-Correction during drafting)*: I should make sure to mention that the "Ill-Defined Prior" is often handled by the "Counterfactual" approach (What would I have believed before?). I need to distinguish between the *Garber* solution (logical relation) and the *Counterfactual* solution (temporal reconstruction). The Garber solution is more formal; the Counterfactual is more intuitive. I will present Garber as the primary technical response.

  9.  *(Final Polish)*: Ensure the physics example (Mercury) is used to illustrate the philosophical points. Ensure the distinction between $P(E)=1$ and $P(H \to E) < 1$ is clear.

