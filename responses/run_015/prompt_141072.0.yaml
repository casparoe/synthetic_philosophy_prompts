answer: |-
  Welcome to the seminar. Before we examine any specific accounts of what emotions are, we must agree on what a theory of emotion is supposed to do. We are not merely seeking a description of inner life; we are seeking a specification that underwrites the authority of institutional ascription. When a clinician diagnoses a phobia, when a court accepts a provocation defense, when a community validates a period of grief, or when an automated system labels a facial expression, these practices assume that emotions are real, attributable, and assessable. Therefore, our first requirement is normativity. An adequate theory must provide conditions under which an emotion can be correct or incorrect, appropriate or disproportionate. Without this, the clinician cannot claim a fear is irrational, and the court cannot distinguish between culpable rage and justified indignation. This is non-negotiable given our purpose. Closely tied to this is the requirement of ownership. The theory must explain whose emotion it is. It must distinguish between an emotion I have and a mere bodily disturbance that happens to me, or a social atmosphere that surrounds me. If a theory cannot secure the subject's agency or perspective, it cannot support the practices of responsibility and treatment that define our institutional context. This too is non-negotiable.

  Having settled the institutional stakes, we must confront the phenomenological data. The first case is recalcitrance. We often feel fear while judging ourselves to be safe, such as when trembling on a glass bridge despite knowing it is secure. A theory must explain how an emotion can persist in conflict with a contradictory judgment. If a theory defines emotion as a judgment, it cannot accommodate this case without denying the phenomenon exists. Thus, the requirement to accommodate recalcitrant emotions is non-negotiable, while the theoretical move to define emotions as judgments is a preference of one camp that we must now treat as suspect. Next, consider the objects of emotion. We feel relief at a cancellation, fear of a one-in-ten-thousand chance, or resentment over a long pattern of slights rather than a single event. These objects are absences, probabilities, or aggregates. A theory must allow emotions to attach to things that are not concretely present or singular. This is a hard constraint on any model that ties emotion too tightly to immediate perception of actual events. Furthermore, emotions like grief, suspense, and anticipation are essentially spread over time. They are not instantaneous spikes but processes with a temporal structure. A theory that models emotions as occurrent events located at a specific timestamp will fail to capture the ontology of grief. This requirement for temporal extension is non-negotiable based on the phenomenology.

  We must also account for the social direction of certain emotions. Resentment, gratitude, and moral anger are not merely about someone; they are addressed to someone. They make a claim for acknowledgement. A theory must explain this communicative normativity, where having the emotion is itself a demand for recognition. If a theory reduces emotion to internal causation, it loses this addressivity. This is non-negotiable if we are to understand the role of emotion in moral and legal communities. Then there is the question of subjects who lack concepts. Infants feel distress at separation, and animals feel fear of learned cues. They do not possess the propositional attitudes or complex concepts that adults do. A theory must allow for emotions without full conceptual sophistication. This is non-negotiable if we accept that infants and animals have emotions, which evolutionary and developmental science suggests we must. Finally, we have two structural constraints. The theory must individuate emotions, explaining what makes fear one thing and anger another, and how emotion differs from mood, sentiment, bodily feeling, and desire. Without this, the category of emotion dissolves into noise. Additionally, the theory must confront the findings of affective science which indicate there is no distinctive autonomic or neural signature per emotion category. Any theory that quietly implies a specific physiological fingerprint for fear or anger is violating an empirical constraint. This is non-negotiable given the current state of the science.

  Now we must sort these demands. The requirements for normativity, ownership, recalcitrance, abstract objects, temporal spread, addressivity, non-conceptual subjects, individuation, and consistency with neuroscience are all non-negotiable. They are derived from the phenomena we must explain and the institutional practices we must justify. What are the preferences? The preference lies in how one attempts to meet these demands. For instance, insisting that normativity requires full propositional judgment is a judgmentalist preference. Insisting that phenomenology requires a distinctive feeling tone is a feeling theorist preference. Insisting that objects must be perceived values is a perceptualist preference. These are theoretical strategies, not data constraints. However, there is a subset of these demands that appears unsatisfiable together. The tension lies between the demand for normativity, which suggests emotions are assessable like beliefs, and the demand to accommodate non-conceptual subjects and recalcitrance, which suggests emotions operate independently of rational assessment. If correctness requires conceptual access, infants cannot have correct or incorrect emotions. If correctness does not require conceptual access, it is hard to see how courts can assess culpability based on emotional states. This tension is the central knot of the seminar.

  Regarding which single requirement does the most work in excluding candidates, it is the demand for normativity combined with non-conceptual subjects. This combination excludes simple feeling theories, which cannot account for correctness, and it excludes strong judgmental theories, which cannot account for infants or recalcitrance. It forces a theory to find a middle ground where an state can be assessable without being a full-blown judgment. This is the hardest filter to pass. With this specification in hand, we can now briefly assess the traditional contenders against the list.

  The judgment view holds that emotions are or entail evaluative judgments. This view excels at meeting the requirement for normativity, as judgments are the kind of thing that can be true or false, rational or irrational, which perfectly underwrites the clinician and the court. It also handles addressivity well, as judgments can involve claims about others. However, it fails decisively on recalcitrance, since it cannot explain how I can judge something safe and yet fear it without contradiction. It also struggles with the non-conceptual constraint, as infants and animals lack the conceptual repertoire required for complex evaluative judgments. It tends to treat emotions as occurrent events, struggling with the temporal spread of grief, and it often implies a cognitive signature that risks conflicting with the neuroscience constraint if it assumes specific cognitive modules. Ultimately, it secures the institutional purpose at the cost of the phenomenology.

  The perceptual or attitudinal view treats emotions as perceptions of value or non-doxastic attitudes toward propositions. This view handles recalcitrance well, allowing one to perceive danger while judging safety, much like seeing an illusion while knowing it is an illusion. It accommodates abstract objects better than pure perception by allowing attitudinal content regarding probabilities or absences. It also manages the temporal spread by viewing emotions as sustained orientations rather than snapshots. However, it struggles with the normativity requirement in the institutional sense; while perceptions can be accurate, they are not typically culpable in the way courts require for mitigation. It also faces difficulty with the non-conceptual constraint if the perception of value requires sophisticated conceptual framing. Finally, it must be careful not to imply a specific neural signature for value perception, which would violate the affective science constraint. It balances phenomenology and normativity but risks weakening the authority of institutional ascription.

  The feeling view identifies emotions with bodily sensations or felt tendencies. This view excels at accommodating non-conceptual subjects, as infants and animals certainly have bodies and feelings. It handles the temporal spread of grief naturally as a unfolding bodily state. It also aligns well with the neuroscience constraint by not requiring specific cognitive modules, focusing instead on arousal patterns, though it must avoid claiming specific signatures for specific emotions. However, it fails catastrophically on normativity. Feelings are not true or false, only present or absent, so a clinician cannot call a feeling disproportionate in a normative sense, only atypical. It also fails on addressivity, as a bodily feeling does not inherently make a claim on another person. It struggles with individuation, as moods and emotions often feel similar bodily. It captures the raw experience but cannot underwrite the practices of judgment and responsibility that define our institutional purpose.
