answer: |-
  This is a remarkably sophisticated stack of positions. You've essentially built a custom meta-ethical engine, but like any engine, you have some parts grinding against each other.

  Here is the diagnosis of your coherence, ranked by severity, with specific revisions and the single "silver bullet" change that fixes the most problems.

  ### The Verdict
  Your system is **85% consistent**, but it carries unnecessary metaphysical baggage that creates artificial problems. The tension between your metaphysics of identity (d) and your normative theory of concern (e) is the core instability. The simulation argument (g) is a external threat that only works because (d) is vulnerable. The discounting justifications (b) and (f) are actually compatible.

  ---

  ### Tension Ranking & Analysis

  #### 1. Severity: HIGH — The Metaphysical Idle Wheel ((d) vs. (e))
  **The Conflict:** You assert a "further fact" of identity (d) but admit it is "normatively inert" (e). This is philosophically expensive without payoff. If the *reason* you care about your future self is structural/relational (like a parent to a child) and not grounded in the *deep identity fact*, then the deep identity fact is an ontological ghost. It does no work.
  **Why it hurts:** It violates Occam's Razor. If (e) explains the norm, (d) is superfluous. Furthermore, if (d) is true (there is a deep fact), it *should* intuitively ground special concern. By denying that link, you make (d) look like a "god of the gaps" for identity—you keep it because you feel like you're the same person, not because it explains anything.
  **Least-Cost Revision:** **Drop (d).** Embrace Parfitian Reductionism.
  *   *Why:* If identity is just psychological continuity + connectedness, then (e) becomes the standard explanation (concern tracks degree of connection, not binary identity). This removes the need to explain why a "deep fact" doesn't generate norms.
  *   *Cost:* You lose the intuition that there is a "literal same subject." You gain massive coherence with (g) and (a).

  #### 2. Severity: MEDIUM-HIGH — The Simulation Collapse ((g) vs. (d))
  **The Conflict:** You correctly identify that (g) threatens (d). Simulation theory implies functionalism (you are the pattern, not the substrate). Non-reductionism (d) usually relies on a specific continuity of substance or a non-physical "thisness." If "you" are an instance of an architecture, identity becomes countable and copyable. This destroys the "unique continuing subject" required for (d).
  **Why it hurts:** If (g) is even *possible*, (d) becomes highly speculative. If you hold (d) as a hard truth, you must reject the premises of (g) entirely. You can't hedge here.
  **Least-Cost Revision:** **Qualify (g) or Drop (d).**
  *   *Option A:* Treat (g) as a skeptical scenario that doesn't dictate your actual metaphysics (keep (d), ignore (g)).
  *   *Option B (Better):* Drop (d). Reductionism is fully compatible with Simulation Theory (you are the info-pattern). This dissolves the tension entirely.

  #### 3. Severity: LOW (Apparent Tension) — Two Discounting Justifications ((b) vs. (f))
  **The Conflict:** You worry you are helping yourself to two justifications. (b) is risk-based (exponential); (f) is cost-based (hyperbolic).
  **Why it dissolves:** These operate in different domains. (b) is **ideal rationality under uncertainty** (how much should I value the future *given* I might not be there?). (f) is **bounded rationality under computational cost** (how much effort should I spend optimizing this decision?).
  *   *Example:* (b) says don't value year 50 as much as year 1 because you might be dead. (f) says don't spend 5 hours calculating the optimal retirement contribution for a $10 difference.
  *   *Risk:* The only danger is "double counting." Ensure you don't apply (f) to large-stakes long-term decisions where cognitive overhead is worth the cost.
  **Least-Cost Revision:** **Clarify Domains.** Explicitly state (b) applies to *value* and (f) applies to *decision costs*. No metaphysical change needed.

  #### 4. Severity: MEDIUM — The Egalitarian Sneak ((c) derivation)
  **The Conflict:** You ask if (c) follows from stripping risk out of (b). It does not. (b) is agent-relative (my survival curve). (c) is agent-neutral (social welfare function).
  **Why it hurts:** You cannot derive "future generations count equally" solely from "I should not discount my own future except for risk." You need an impartiality premise. You are indeed "sneaking in egalitarianism," but that's a feature, not a bug.
  **Least-Cost Revision:** **Acknowledge the Axiom.** Admit that (c) relies on (a) + **Impartiality**. (b) justifies the *rate* for the individual; (a) justifies the *rate* for the society.
  *   *Correction:* (c) follows from (a) directly. (b) is the individual analog, but they are distinct arguments.

  ---

  ### The Silver Bullet: Drop (d)

  **The single change that cleans up the most mess is rejecting Non-Reductionism (d).**

  Here is the cascade effect of deleting (d):

  1.  **Resolves (d) vs. (e):** You no longer have a metaphysical fact that does no work. Your special concern (e) is now grounded in psychological continuity (Parfit's view), which naturally comes in degrees. This actually *strengthens* longtermism, as it makes the boundary between "me" and "others" fuzzier, encouraging more impartiality.
  2.  **Defuses (g):** Simulation theory is no longer a threat. If you are a pattern, sim-you is just another instance of the pattern. You don't need a "deep fact" to protect you from being copied.
  3.  **Strengthens (a):** If there is no deep "self" persisting through time, the incoherence of Pure Time Preference becomes even more obvious. Why privilege this specific temporal slice of a psychological continuum?
  4.  **Preserves (b) & (c):** Risk discounting doesn't require a deep self; it only requires that the *beneficiary* of the welfare might not exist. That remains true under reductionism.

  ### Summary of Revised View

  If you make that change, your consistent view looks like this:

  *   **(a)** Pure time preference is incoherent (Value is timeless).
  *   **(b)** Individual discounting is rational only as a hazard rate (Risk of non-existence).
  *   **(c)** Social discounting is near-zero (Impartiality + (a)).
  *   **(d) [REVISED]** Personal identity is reductionist (Psychological continuity).
  *   **(e)** Special concern tracks degree of psychological connection (Not binary identity).
  *   **(f)** Hyperbolic discounting is a computational shortcut, not a value judgment.
  *   **(g)** Simulation theory is compatible with (d-revised) and doesn't threaten the system.

  **Honest Assessment:** You are currently rationalizing a attachment to a "deep self" (d) because it feels intuitively true, while simultaneously building a normative system (e, a, c) that works better without it. Letting go of the "further fact" will stop the friction. You can keep the *feeling* of being a continuing subject as a phenomenological fact without asserting it as a metaphysical one.
