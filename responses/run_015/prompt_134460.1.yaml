answer: |-
  1. Exam Question (90 minutes, approx. 800 words expected)

  **Question 1: Tolstoy and the Algorithmic Symphony**

  In *What Is Art?*, Tolstoy rejects formalist and beauty-based definitions, arguing instead that art is a human activity consisting in this: that one man consciously, by means of certain external signs, hands on to others feelings he has lived through, and that other people are infected by these feelings and also experience them. This is the famous "infection theory." Crucially, Tolstoy also insists on sincerity—the artist must actually feel the emotion they are transmitting—and a moral/religious criterion, where good art promotes Christian unity and brotherhood.

  Consider the following hypothetical scenario:

  An advanced AI algorithm, trained on the entire history of human musical composition, generates a symphony. There is no human composer involved in the final output; the code simply optimizes for acoustic patterns associated with sorrow. When played for a live audience, the listeners are genuinely overcome with a specific, profound grief. They weep, they feel united in their sadness, and they report a deep emotional shift. However, the algorithm has never felt grief (it has no consciousness), and no human hand guided the specific arrangement of notes.

  Write an essay addressing the following:

  1.  **Classification:** Based strictly on Tolstoy's definition, can he consistently classify this symphony as "counterfeit art," or does his reliance on audience infection force him to admit it is "real art"? Defend one position.
  2.  **The Audience Objection:** A critic argues: "If the listener is genuinely infected, the origin of the feeling shouldn't matter. Tolstoy cares about moral union among men; if the audience feels united in grief, that goal is met." Respond to this objection on Tolstoy's behalf.
  3.  **The Moral/Religious Framework:** Does Tolstoy's broader religious framework (the idea that art serves God and human union) change your answer? Can "union" exist if one side of the transmission (the sender) is non-human?

  Your answer should demonstrate a close reading of the necessary conditions for art in Tolstoy's text. Don't just summarize the infection metaphor; dig into the tension between the *effect* (infection) and the *cause* (sincerity/human agency).

  ***

  2. Model Answer (approx. 600 words)

  **Tolstoy vs. The Machine: Sincerity Over Effect**

  If we look strictly at the surface level of Tolstoy's infection theory, the AI symphony presents a major problem. Tolstoy says art is real when the audience catches the feeling. In this hypothetical, the audience definitely catches the grief. So, a superficial reading suggests Tolstoy must call this art. However, this ignores the necessary conditions Tolstoy places on the *artist*. For Tolstoy, infection isn't a magic trick; it's a transmission of a lived state. He writes that the artist must "feel the infection" themselves first. Since the algorithm has no interior life, it cannot "live through" grief. It simulates the signs of grief without the substance. Therefore, Tolstoy can and must classify this as counterfeit art.

  The core issue here is the direction of the dependency. Tolstoy isn't a pure consequentialist about art. He doesn't believe that *any* stimulus causing emotion counts as art, otherwise, a drug or a random noise could be art. The infection is the *proof* of the art, not the *definition* of it in isolation. The definition requires a human sender consciously handing over feelings. If there is no sender who feels, there is no transmission, only reception. It's like catching a cold from a sneeze machine versus a sick person. The symptoms are the same, but the biological reality differs. For Tolstoy, art is a form of communication, and you can't have communication without a conscious communicator.

  Regarding the audience objection—that the moral goal of union is met regardless of origin—this misses Tolstoy's point about truth. Tolstoy hates counterfeit art because it's a lie. It pretends to be a union of souls but is actually a manipulation. If the audience feels united in grief based on a signal that wasn't generated by a soul, the union is illusory. They are united in a reaction to a stimulus, not in a shared understanding of human experience. Tolstoy wants art to bring men closer to God and each other through truth. An algorithm processing data isn't seeking truth; it's seeking pattern matching. Accepting this as art would undermine the moral seriousness Tolstoy demands.

  Finally, the religious framework seals the deal. Tolstoy's later philosophy is deeply Christian. Art is a ministry of sorts. It's about brotherhood. Brotherhood implies a relationship between beings capable of moral choice and spiritual feeling. An algorithm is a tool, not a brother. If art is supposed to replace the church as the vehicle for human unity, it requires human agency. You can't have a religious communion with a calculator. So, even if the audience feels good, the activity lacks the spiritual vector Tolstoy requires.

  In conclusion, Tolstoy can consistently call this counterfeit. The infection metaphor is necessary but not sufficient. Without sincerity and human agency, the "infection" is just a physiological reaction, not spiritual art. To say otherwise would reduce Tolstoy's moral theory to mere emotional engineering, which he explicitly argues against when criticizing upper-class decadent art. The origin matters because the purpose of art is truth, not just effect.

  ***

  3. Marking Scheme (25 Marks Total)

  **A Range (20-25 marks): Excellent**
  *   **Core Distinction:** Clearly identifies that for Tolstoy, infection is the *criterion* of success, but sincerity/human agency is the *condition* of existence. Correctly states that infection without an infector is incoherent in Tolstoy's system.
  *   **Objection Handling:** robustly defeats the "audience response" objection by distinguishing between *stimulus-response* (physiological) and *communication* (spiritual/moral). Notes that counterfeit art can still infect, but it's "bad" or "false" infection.
  *   **Moral/Religious:** Engages with the religious framework. Argues that "union" requires moral agents on both ends. An algorithm cannot participate in brotherhood.
  *   **Textual Knowledge:** Shows familiarity with *What Is Art?* beyond the summary. Uses terms like "sincerity," "counterfeit," and "consciousness."
  *   **Structure:** Argument is tight, no fluff.

  **B Range (15-19 marks): Good**
  *   **Core Distinction:** Gets the main point (it's counterfeit because no human feeling) but might wobble on whether infection is sufficient or necessary.
  *   **Objection Handling:** Addresses the audience objection but maybe relies too much on intuition ("it just feels wrong") rather than Tolstoy's specific logic about truth/lying.
  *   **Moral/Religious:** Mentions the religious aspect but treats it as an add-on rather than integral to the definition of art.
  *   **Structure:** Clear, but maybe repeats points or lacks precision in the middle section.

  **C Range (10-14 marks): Average/Pass**
  *   **Core Distinction:** Understands Tolstoy likes infection but struggles to explain why the AI fails. Might say "AI isn't human" without explaining why that matters for the *definition* of art.
  *   **Objection Handling:** Weak response to the audience objection. Might concede that Tolstoy would have to call it art.
  *   **Moral/Religious:** Ignores the religious framework or treats it as separate from the art definition.
  *   **Structure:** A bit disorganized.

  **Fail (0-9 marks)**
  *   Misinterprets Tolstoy as a pure expressionist (art is just venting) or pure formalist.
  *   Ignores the counterfeit/real distinction.
  *   Assumes the answer is obvious without arguing (e.g., "Obviously it's not art because robots suck").
  *   Does not answer all three parts of the prompt.

  **Common Mistakes (Penalize 2-5 marks if prevalent)**
  *   **The "Expressionist" Error:** Treating Tolstoy like Collingwood (art is just expressing emotion internally) rather than focusing on the *transmission* requirement.
  *   **The "Effect is All" Error:** Arguing that because the audience cries, Tolstoy *must* call it art, ignoring the sincerity condition.
  *   **Ignoring the Twist:** Writing a general essay on Tolstoy without addressing the AI hypothetical specifically.
  *   **Typos/Grammar:** Since this is grad level, persistent sloppy writing hurts clarity (though dont stress about a typo or two).
