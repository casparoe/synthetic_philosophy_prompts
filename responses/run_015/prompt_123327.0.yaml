  ### The Miriam Doctrine: Rules and Eliminations

  Based on the fifteen-year track record, Miriam operates under a specific, hybrid ontology of vessel identity. It is neither purely materialist nor purely formalist. Here are the four rules that jointly fit precedents (i) through (vi), followed by the natural-looking rules her record has explicitly eliminated.

  **The Surviving Rules**
  1.  **The Continuity of History Principle:** Identity persists through an unbroken chain of service, function, or custodial intent. A vessel is a history, not just a thing. (Supports: i, iii, iv).
  2.  **The Anti-Fission Constraint:** Identity cannot divide. If one vessel becomes two competing candidates, the original identity is extinguished for both. (Supports: v).
  3.  **The Critical Fabric Threshold:** Some original material is necessary for identity, but it is not sufficient. You cannot have a "same vessel" ruling with zero original fabric, but you can have one with very little, provided History is continuous. (Supports: i, iv vs. vi).
  4.  **The Custodial Pause Provision:** Physical continuity can be interrupted if a single custodian maintains the *intent* to restore the object, rendering the interval "dormant" rather than "ended." (Supports: iii).

  **The Eliminated Rules**
  1.  **Strict Materialism (The "Wood" Rule):** The idea that identity resides in the original matter. Ruling (ii) kills this outright: having 100% of the original timbers did not make the second hull "the vessel."
  2.  **Strict Formalism/Administrativism (The "Paper" Rule):** The idea that identity resides in name, registration, or logbooks. Ruling (vi) kills this: moving the paperwork to a new hull made only a "namesake."
  3.  **Strict Spatio-Temporal Continuity:** The idea that the object cannot be discontinuous in space or time. Ruling (iii) kills this: the sloop was in pieces on trucks for nine months and retained identity.
  4.  **Permissive Fission (Standard 4Dism):** The metaphysical view that an object can have two future temporal branches. Ruling (v) kills this: when the barge split, Miriam did not say "both are parts of the barge"; she said the barge "ceased to exist."

  ---

  ### Analysis of the 60/40 Split Case

  This case is a conflict between the **Continuity of History** (Hull A: 40%, sailing, logs) and the **Critical Fabric Threshold** (Hull B: 60%, keel, frames), complicated by the **Anti-Fission Constraint**.

  Your brother is correct that the "Single Custodial Project" distinguishes this from (v). In (v), the fission was accidental (wreck) and the successors were competitors (unconnected salvors). Here, the fission was intentional and managed. This invokes the **Custodial Pause Provision** (iii). However, (iii) ended in *one* reassembled hull. This case ends in *two*.

  **The Tension:**
  *   **Hull A (40%):** Wins on History (7 years service), Administration (logs/reg), and Functional Continuity. Loses on Fabric Majority and Keel.
  *   **Hull B (60%):** Wins on Fabric Majority and Keel (critical structure per (iv)). Loses on History (10-year gap) and Administration.

  **Classification:**
  This case is best classified as a **hybrid of (iii) and (v)**. It has the controlled intent of (iii) but the branching outcome of (v). It is *not* like (iii) and (iv) primarily because (iii) and (iv) resulted in singular continuations. It is *not* purely (v) because the split was not a chaotic wreck but a curated division.

  However, because Miriam's Rule 2 (Anti-Fission) is a hard constraint in (v), the moment the project produced two sailing hulls, the *original* identity was threatened. The question is whether the "Single Project" allows one branch to inherit the identity while the other becomes a reconstruction.

  Given (i) vs (ii), Miriam prioritizes **History/Service over Fabric**. In (i), 0% fabric + Continuous Service = Same Vessel. In (ii), 100% fabric + Broken Service = Different Vessel. Therefore, Fabric is the weaker criterion. Hull A has the Continuous Service. Hull B has the Fabric.

  ---

  ### The Verdict

  **Prediction:** Miriam will rule that **Hull A (the 40% hull)** is "the vessel." Hull B will be catalogued as a "Reconstruction using original fabric."

  **Reasoning:**
  1.  **Service Trumps Fabric:** Precedents (i) and (ii) establish that the history of the object outweighs the matter of the object. Hull A has the unbroken narrative of service; Hull B has a decade of dormancy under a tarp.
  2.  **The Keel is Not Decisive in Fission:** While (iv) values the keel, that was a non-fission rebuild. In a fission scenario (v), structural continuity is broken by definition.
  3.  **Custodial Intent Saves One Branch:** The "Single Project" distinguishes this from (v). Miriam will likely view the project as intending *one* successor to carry the identity (the one launched and sailing), while the other was effectively a "parts donor" that was unexpectedly completed. Hull A is the functional heir; Hull B is the material archive.
  4.  **Administration as Tie-Breaker:** While (vi) says admin isn't *sufficient*, combined with Service (i), it reinforces Hull A. Hull B has neither.

  **Classification:** This is closer to **(i) and (iv)** (Continuity of Service) than (v) (Ceased to Exist), provided Miriam accepts the "Single Project" as a valid bridge over the fission gap. If she is strict on (v), she will rule "Ceased to Exist" for both. But given her flexibility in (iii), she will likely privilege the *active* branch.

  ---

  ### Cataloguing Protocol

  If Miriam feels her precedents genuinely underdetermine the verdict (i.e., she sees equal weight in the Fission rule vs. the Service rule), she should not force a binary choice.

  **Entry:** Create a **Linked Identity Record**.
  *   **Primary Record:** "Vessel [Name] (Successor A)." Status: *Active Vessel.*
  *   **Secondary Record:** "Vessel [Name] (Successor B)." Status: *Reconstruction.*
  *   **Note Field:** "Identity disputed due to custodial fission event [Date]. Original identity technically extinguished per Precedent (v), but heritage value assigned to Successor A due to continuity of service and documentation per Precedent (i). Successor B holds majority original fabric."

  This preserves the philosophical ambiguity for future researchers while satisfying insurance and loan requirements (which need *a* vessel to insure).

  ---

  ### The Decisive Test Case

  You asked for a single further case to separate the rules that still agree. In my predicted verdict (Hull A wins), the rules of **Continuity of Service** and **Administrative Continuity** agree. The rule of **Material Constitution** disagrees.

  To separate **Service** from **Administration** (the two agreeing rules), the best test case is:

  **The Paperless Sailor:**
  > A vessel sails continuously for twenty years under its original name and crew (Service Continuity), but due to a fire in the captain's cabin, all logbooks, registration papers, and the ship's bell are lost and never replaced. Simultaneously, a static replica is built in a museum using the original plans, and the *saved* logbooks and registration are legally transferred to this static hull (Administrative Continuity).

  *   **If Service Wins:** The sailing vessel is "the vessel," despite lacking papers. (Confirms Rule 1 is dominant).
  *   **If Admin Wins:** The museum hull is "the vessel," despite never sailing. (Confirms Rule 4/Documentation has more weight than assumed).
  *   **If Neither:** Identity requires both. (Confirms a stricter conjunction of rules).

  However, given the specific proposal in your prompt (the re-joined hull), a more contextually relevant test for Miriam's **Fission vs. Dormancy** logic would be:

  **The Re-joined Hull (The Heritage Trust Proposal):**
  > Twenty years from now, the two hulls are physically joined back together into a single seaworthy vessel using the surviving fabric of both.

  *   **If Miriam rules "Same Vessel":** She prioritizes **Custodial Intent/Dormancy** (iii). The identity was "sleeping" in the fabric of Hull B and is now woken.
  *   **If Miriam rules "New Vessel":** She prioritizes **Anti-Fission** (v). The split killed the identity permanently; re-joining creates a third object from two dead predecessors.

  This second case is the stronger test for your museum's specific long-term planning. It determines whether the "60% hull" is a dead relic or a sleeping partner.
