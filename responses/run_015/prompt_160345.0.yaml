answer: |-
  You cannot moderate intent, so stop trying to judge sincerity and instead moderate for epistemic asymmetry using a standardized three-step test that flags users whose argumentative standards do not travel across sides.

  ### The Epistemic Symmetry Procedure (ESP)

  **Timebox:** 15 minutes maximum.
  **Scope:** Applies only when conduct violations (harassment, slurs) are absent or minor, and the core complaint is "bad faith argument."

  **Step 1: The Conduct Gate (2 minutes)**
  *   **Question:** Is there a clear violation of the Code of Conduct (personal attacks, protected group harassment, doxxing)?
  *   **Pass:** No clear violation. → Proceed to Step 2.
  *   **Fail:** Clear violation. → **Stop.** Apply standard conduct penalty. Do not label this "bad faith"; label it "conduct."
  *   **Note:** Tone alone (rudeness, impatience) is not a fail here unless it crosses into harassment.

  **Step 2: The Reversal Test (5 minutes)**
  *   **Question:** Identify the specific evidentiary standard or logical burden the accused is demanding of their opponent. If you swapped the accused's position with their opponent's position, would the accused accept this same burden?
  *   **Pass:** Yes, the standard appears consistent regardless of who holds the view (e.g., "Everyone needs to link primary sources").
  *   **Fail:** No, the standard is asymmetric (e.g., "My links are sufficient, but yours require peer review" or "You must prove negative X, but I only need to assert positive Y").
  *   **Action:** If **Fail**, document the specific asymmetry. This is the primary evidence for bad faith.

  **Step 3: The Update Check (5 minutes)**
  *   **Question:** Scan the user's history in this community for the last 90 days. Have they conceded a point, corrected a fact, or retracted a claim that weakened their preferred narrative or aligned with an opponent's argument?
  *   **Pass:** Yes, there is at least one instance of public update/concession.
  *   **Fail:** No, their history shows zero concessions or corrections, only accumulation of arguments supporting one side.
  *   **Action:** If **Fail**, this supports a finding of structural closed-mindedness.

  **Decision Matrix**
  *   **Step 2 Pass OR Step 3 Pass:** → **No Action.** Close the thread if necessary, but do not penalize the user. This is a values conflict, not conduct.
  *   **Step 2 Fail AND Step 3 Fail:** → **Issue Warning.** Explain specifically which standard failed the Reversal Test. Do not ban yet.
  *   **Step 2 Fail AND Step 3 Fail AND Prior Warning:** → **Ban Recommendation.** Hand off to the Appeals Committee with the documented asymmetry.
  *   **Unclear/Mod Bias Risk:** If the moderator feels personal agreement influencing the Step 2 judgment, → **Handoff.** Pass the ticket to another moderator immediately.

  ### Evaluation of Current Tests

  *   **Keep:** "Would you accept the standard reversed?" (This is the Reversal Test, Step 2). It is the only reliable proxy for fairness.
  *   **Keep:** "Have you ever conceded something costly?" (This is the Update Check, Step 3). It proves contact with outside reality.
  *   **Discard:** "Can they state the other side's case well enough..." (The Steelman Test). While ideal, it is too time-consuming for a 15-minute window and easy to fake superficially.
  *   **Discard:** "Sincerity/Feel." Unverifiable and introduces mod bias.
  *   **Discard:** "Tone" as a proxy for bad faith. Rude people can be right; polite people can be structurally unreachable. Handle tone under Conduct, not Faith.

  ### Worked Cases

  **Case 1: The Popular Contributor**
  *   **Profile:** Polite, one outlet, never concedes, agrees with mod.
  *   **Step 1 (Conduct):** Pass. No harassment.
  *   **Step 2 (Reversal):** **Fail.** Demanding others engage with their single outlet while ignoring others is asymmetric. If the opponent demanded engagement only with a rival outlet, this user would reject it.
  *   **Step 3 (Update):** **Fail.** Never conceded a point in three years.
  *   **Decision:** **Issue Warning.** The procedure identifies this user as structurally unreachable (echo chamber participant).
  *   **Mod Action:** You must acknowledge your political agreement creates bias. You should ideally hand this off to a mod who disagrees with you to issue the warning. The penalty is not a ban (no conduct violation), but a formal warning that sourcing must diversify to remain in good standing. You must accept that keeping him engages the community in a dead-end loop.

  **Case 2: The Rude Retractant**
  *   **Profile:** Rude tone, public retraction of flawed study, argues with own side.
  *   **Step 1 (Conduct):** **Fail.** Tone warnings apply here. Handle separately as conduct.
  *   **Step 2 (Reversal):** **Pass.** Arguing with their own side indicates their standards travel; they apply scrutiny internally.
  *   **Step 3 (Update):** **Pass.** Public retraction is a high-cost concession.
  *   **Decision:** **No Action (on bad faith).** The bad faith accusation is incorrect.
  *   **Mod Action:** Address the tone under Conduct rules, but explicitly clear them of bad faith. This user is epistemically honest despite being abrasive.

  **Case 3: The Procedural Blocker**
  *   **Profile:** Demands perfect steelmanning, treats failure as bad faith, renews demand indefinitely.
  *   **Step 1 (Conduct):** Pass. Technically polite.
  *   **Step 2 (Reversal):** **Fail.** The demand is asymmetric because it is used as a shield, not a bridge. If the opponent demanded the same before listening, this user would call it obstruction.
  *   **Step 3 (Update):** **Fail.** The procedure is used to avoid engagement, not facilitate it. No concessions exist.
  *   **Decision:** **Ban Recommendation.** This is procedural bad faith (sea-loning).
  *   **Mod Action:** The warning step can be skipped if the obstruction is severe enough to halt community function, but standard protocol suggests one warning explaining that "procedural demands cannot be used to block participation." If repeated, ban.

  ### Limitations of the Procedure

  **Ignorance vs. Bad Faith**
  This procedure cannot separate bad faith from mere ignorance. A user may fail the Reversal Test because they are genuinely unaware of their own bias, not because they are malicious. The procedure treats them the same because the *impact* on the community (toxicity, unreachable arguments) is identical. You are moderating the damage to the discourse, not the soul of the participant.

  **Reflexivity and Mod Bias**
  The procedure can be turned on you, but only if you submit your own moderation decisions to the Reversal Test. Ask yourself: "If I held the opposing political view, would I accept this warning?" If the answer is no, you are violating the procedure. The handoff clause ("Mod Bias Risk") is the only safety valve; if you feel the tug of agreement, you must recuse. The procedure does not prevent you from weaponizing it, but it makes weaponization visible in the written record required for the Appeals Committee.

  **Values Conflicts**
  The procedure cannot resolve genuine values conflicts. If a user passes the Reversal and Update tests but the community still finds their presence intolerable, the procedure mandates **No Action**. This protects minority opinions that are argued in good faith. If the community cannot tolerate good-faith disagreement, that is a community culture issue, not a moderation case.
