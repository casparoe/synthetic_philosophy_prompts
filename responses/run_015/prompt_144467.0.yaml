      *   *Antiquarian:* History as preservation for its own sake. Reverence for origins. Risk: Hoarding, inability to let go, stagnation, valuing the old simply because it is old.
      *   *Critical:* History as judgment. Breaking the past to free the present. Condemning injustices. Risk: Nihilism, destroying roots, severing continuity.

  3.  **Translate to Archival/Conservation Vocabulary (Iterative Process):**

      *   *Monumental:* How do we use collections to inspire action? Exhibitions? "Highlight reels"?
          *   *Terms:* Exhibition narrative, interpretive signage, flagship objects, inspirational programming.
          *   *Nietzschean twist:* It's about *using* the past to drive current vitality.
          *   *Archival translation:* "Exhibition-Driven Acquisition." Selecting items based on their ability to galvanize current institutional goals. Focusing on "Flagship Objects" that define institutional identity.
          *   *Risk:* "Interpretive Overreach" or "Context Stripping." Making the object say what we need it to say for the show.

      *   *Antiquarian:* Preservation for preservation's sake.
          *   *Terms:* Preventive conservation, climate control, provenance tracking, institutional memory, backlog, hoarding.
          *   *Nietzschean twist:* Reverence for the root. Everything matters because it existed.
          *   *Archival translation:* "Total Retention Policy." "Strict Provenance Adherence." "Preventive Conservation" as the highest good. Valuing "Institutional Memory" above operational efficiency.
