          *   *Terms:* Deaccession, weeding, reappraisal, repatriation, corrective cataloging, redaction.
          *   *Nietzschean twist:* Breaking the chain to live. Condemning the past.
          *   *Archival translation:* "Aggressive Deaccessioning." "Reappraisal for Social Justice." "Corrective Cataloging" (changing old descriptions). "Repatriation" (returning items to break colonial hold).
          *   *Risk:* "Collection Fragmentation." Loss of "Chain of Custody." Erasing evidence of past mistakes (which might be needed later).

      *   *Refining the "Real Translation" aspect:* The prompt asks for a *real translation*, not loose metaphor. This means I need to frame the *stances* themselves as archival policies.
      *   *Monumental* $\rightarrow$ **Curatorial Utility Mode.** (Using the archive to build a future narrative).
      *   *Antiquarian* $\rightarrow$ **Stewardship Preservation Mode.** (Keeping the archive intact for its own sake).
      *   *Critical* $\rightarrow$ **Appraisal & Disposition Mode.** (Judging the archive to clear space for the new).

      *   *Let's try to map specific terms more tightly.*
      *   *Monumental:* "Exhibition-Ready Selection." Prioritizing objects that serve a narrative of greatness. Risk: "Anachronistic Restoration" (making it look how we think it should have looked).
      *   *Antiquarian:* "Preventive Conservation Priority." "Provenance Tracking" as sacred. "Institutional Memory" as weight. Risk: "Backlog Accumulation."
