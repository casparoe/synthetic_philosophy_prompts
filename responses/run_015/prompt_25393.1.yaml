  **UNIVERSITY STANDING COMMITTEE ON ACADEMIC FREEDOM AND SCHOLARLY CONDUCT**

  **TO:** The Office of the Provost; Dr. [Researcher Name]; The Petitioning Faculty and Students
  **FROM:** The Standing Committee on Academic Freedom and Scholarly Conduct
  **DATE:** October 26, 2023
  **SUBJECT:** Committee Opinion Regarding Proposed Research Project on Moral Genealogy and Bias

  **I. PREAMBLE**

  The Committee has reviewed the proposal entitled "Genealogical Explanations of Partialist Moral Convictions," the petition submitted by concerned faculty and students, and the researcher's formal response. Our mandate is to balance two core university values: the protection of academic freedom to pursue uncomfortable lines of inquiry, and the enforcement of scholarly conduct standards requiring methodological rigor and intellectual honesty.

  This case presents a profound meta-ethical difficulty. It is not merely a dispute over resources or safety, but a disagreement about the boundaries between descriptive social science and normative philosophy. The Committee's opinion below addresses the philosophical substance of the objection before issuing a recommendation.

  **II. ANALYSIS OF THE PHILOSOPHICAL DIFFICULTY**

  The petitioners argue that the project is question-begging because classifying a moral conviction as a "bias" presupposes that the conviction is irrational or unjustified. They contend that there is no value-neutral vantage point from which to distinguish a "genuine moral reason" from a "culturally transmitted bias." The researcher counters that all genealogical critique faces this charge, and that accepting the petitioners' view would insulate moral norms from empirical scrutiny.

  The Committee finds merit in both positions, reflecting a genuine tension in moral philosophy:

  1.  **Validity of the Petitioners' Concern:** The petitioners are correct that the term "bias" is not purely descriptive. In cognitive science, a bias is a systematic deviation from a norm of accuracy or rationality. To label a moral intuition (e.g., special obligation to family) as a bias implies that the impartial stance is the correct baseline. If the research design assumes impartialism is the correct moral framework in order to prove that partialism is a bias, the reasoning is indeed circular. There is no "view from nowhere"; methodological naturalism cannot fully escape meta-ethical commitments.
  2.  **Validity of the Researcher's Defense:** The researcher is correct that the genealogical method—investigating the historical or psychological origins of beliefs to assess their justificatory status—is a legitimate and central tradition in philosophy (from Nietzsche to contemporary Error Theory). To block this project on the grounds that it challenges foundational moral intuitions would set a precedent that certain moral convictions are immune to empirical or genealogical critique. This would constitute viewpoint discrimination and violate the principle of academic freedom.

  The core issue, therefore, is not *whether* this question may be asked, but *how* the relationship between the descriptive findings (origins of the belief) and the normative conclusions (status of the belief) is framed. The "is-ought" gap remains a fundamental philosophical constraint. A study showing that a belief arises from cultural transmission does not logically prove the belief is false, unless one already assumes that only non-cultural sources yield moral truth.

  **III. RECOMMENDATION**

  The Committee recommends that the project **PROCEED WITH CONDITIONS.**

  Blocking the project would infringe upon academic freedom and stifle legitimate philosophical debate regarding the origins of moral judgment. However, allowing the project to proceed without modification risks violating standards of scholarly conduct by presenting normative conclusions as neutral empirical findings. To resolve this, the researcher must adjust the methodological framing to acknowledge the philosophical limits of the inquiry.

  **IV. CONDITIONS OF APPROVAL**

  To ensure the project meets the standards of scholarly rigor while protecting the rights of all parties, the following conditions must be met prior to the commencement of data collection and publication:

  1.  **Operational Definition of "Bias":** In all research instruments and publications, the term "bias" must be defined operationally rather than normatively. For example, the researcher should distinguish between *psychological bias* (a cognitive heuristic that deviates from a specified model of reasoning) and *moral error* (a claim that the belief is unjustified). The study may investigate whether familial partialism functions as a psychological heuristic, but it must not claim that this finding alone disproves the moral validity of familial obligations.
  2.  **Methodological Reflexivity:** The research proposal and subsequent publications must include a "Positionality and Meta-Ethical Framework" section. In this section, the researcher must explicitly state the normative assumptions underpinning the study (e.g., "This project proceeds under the working hypothesis that impartiality is a requisite for moral truth"). This ensures transparency, allowing readers to evaluate the argument without being misled by claims of pure neutrality.
  3.  **Dissemination Guidelines:** When presenting findings to non-specialist audiences (including press releases or campus talks), the researcher must clearly distinguish between *explaining the origin* of a belief and *evaluating the truth* of a belief. Claims should be framed as contributions to moral psychology and genealogy, not as definitive disproofs of specific moral duties.

  **V. RATIONALE FOR FAIRNESS**

  The Committee recognizes that this decision may not fully satisfy either party. We offer the following reasoning to demonstrate why these conditions are fair to both sides:

  **To the Petitioners:**
  You argued that the project smuggles in normative conclusions under the guise of neutral science. The Committee agrees that such smuggling constitutes poor scholarship. By requiring the researcher to explicitly state their meta-ethical assumptions (Condition 2) and restrict strong normative claims (Condition 3), we ensure that the project does not claim a false objectivity. Your concern about methodological circularity is addressed not by silencing the research, but by forcing the researcher to be philosophically honest about the limits of their methodology. The project can no longer claim to be "neutral descriptive work" if it is not; it must own its normative commitments.

  **To the Researcher:**
  You argued that blocking the project insulates moral convictions from scrutiny and that all bias research faces circularity worries. The Committee agrees that your inquiry is protected by academic freedom. You are permitted to investigate the genealogical origins of moral intuitions, even if doing so challenges widely held values. These conditions do not prevent you from arguing that familial obligations are biases; they merely require you to argue for that conclusion philosophically, rather than implying it is a simple empirical output. This strengthens your work by insulating it from the valid criticism that it conflates psychology with ethics.

  **VI. CONCLUSION**

  The university is a place where foundational assumptions must be open to examination, but where that examination must be conducted with rigorous attention to logical validity. This opinion upholds the right to question moral convictions while enforcing the duty to acknowledge the philosophical presuppositions required to do so.

  The Committee trusts that the researcher will incorporate these conditions into the IRB application and research design. We thank all parties for engaging in this difficult but necessary dialogue regarding the boundaries of inquiry.

  **Signed,**

  *The Standing Committee on Academic Freedom and Scholarly Conduct*
