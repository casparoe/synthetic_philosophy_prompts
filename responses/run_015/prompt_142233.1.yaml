prompt: |-
  I'm TAing an intro metaphysics module this term and keep having the same argument with one of the PhD students, so I'd rather get properly attacked on this than keep winning by stipulation. The view I hold — call it the paraphrase view, I need some label — is that there is no causation by absence, full stop. When we say the guard's not turning up caused the vault to be emptied, or that the missing signature caused the application to be rejected, nothing negative is doing causal work: there's the actual positive history (the guard asleep down the road, the clerk processing the file), some counterfactuals about what would have happened had things gone differently, and a background of norms, plans and expectations that explains why we single out her absence rather than the Queen of England's. On my view causal claims about omissions are in perfectly good order as compressed explanations, they're just not reports of a causal relation with an absence in it. My supervisor says I've defintely just built the conclusion into what I'll count as a cause — causes have to be actual happenings, locatable in time, the sort of thing that can enter into production-like relations, and absences are none of those — and I want to know how much of the view is that definition wearing a coat.

  So: what would count against me, ranked from I'd have to give it up through this hurts to this is merely awkward, and for each one say whether a committed paraphrase theorist should concede it or is entitled to shrug. The things I want you to actually work through, with cases rather than name-dropping, are these. (1) Double prevention: someone tries to poison the coffee, a colleague quietly swaps the cups, the victim survives, and the absence of poison upstream seems to be what lets the whole normal causal story run — people treat this as the case where absences inherit causal power, and I've never felt its force, so either show me what I'm missing or agree with me and say why it's not the master case it's made out to be. (2) Symmetric overdetermination by two omissions: either of two guards would have locked the door and would have been enough, neither does, the burglar walks in; my counterfactual machinery breaks here, and I need to know whether my fallback (no cause of the break-in at all, or the two together) is a cost or a feature I can charge for. (3) The timing worry: an omission doesn't seem to have a sharp location or duration in the way causes are supposed to, and the late omission case — the doctor fails to give the antidote at midnight, but the patient was already dead at 11:55 — shows the shape of the problem; is the vagueness a reason to deny absences causal status or just a reason to be careful about event individuation? (4) The case that worries me most, which I made up and haven't seen discussed: the disarmed sprinkler. A fire spreads through a wing of a building because the sprinkler's trigger was never rewired after maintenance months earlier. There's no agent who failed to act at the relevant moment, nobody had a duty, there's no queue of expectations for my story to lean on — and yet the absence of a signal caused the fire to spread sounds completely fine to nearly everyone I try it on. (5) Model-relativity: whether a causal model even contains a variable for the guard locks the door is a modeller's choice, and if it does then the absence comes out as a cause on the usual actual-cause tests, and if it doesn't it can't even be a candidate. Positive causes don't look like they're at the mercy of variable inclusion in the same way — or do they? If they do, I'm not specially exposed and you should say so; if they don't, I owe you something. (6) My own rescue device, which I half suspect is junk: I distinguish thin absences (mere non-occurrences, like the Queen not watering the plant) from thick ones (the non-execution of a standing arrangement — a mechanism that was meant to fire, a plan, a role, a duty), and I use the distinction to explain why some absence-claims are good explanations and others are noise. Is that doing real work, or is it a moves-in-the-night device that lets me dismiss any counterexample as thin? If it's the latter, say so, and tell me what test would expose it.

  On epistemics: I want you to seperate what people who work on this genuinely agree on from what's just fashionable, and not hand me a consensus where there's only a majority. Flag every place where my view is insulated by a definition rather than an argument, and be willing to conclude that the whole thing has been qualified into unfalsifiability — and then say whether, for a view of this kind, that's a real problem or just what metaphysics looks like when it's done honestly. Tell me which single defeater you think is most likely to be right and roughly how confident you are in that ranking. And for what it's worth, the thing that would move me most is a case where the absence does explanatory work that no reconstruction out of positive history plus counterfactuals plus norms can replicate; shared intuitions alone won't do much for me, so if that argument is available, make it, and if it isn't, say that too.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** TA in an intro metaphysics module. Philosophically sophisticated (knows terms like "double prevention," "symmetric overdetermination," "causal models," "event individuation").
      *   **Stance:** "Paraphrase View" (Causal Nihilism about Omissions / Positive Causation Only). Believes omission causal claims are shorthand for positive history + counterfactuals + norms, not reports of a relation involving an absence.
      *   **Conflict:** Arguing with a PhD student (and supervisor suspects question-begging).
      *   **Goal:** Wants to be "properly attacked." Wants to know what would count against the view, ranked by severity. Wants specific analysis of 6 specific cases/concerns. Wants epistemic honesty (consensus vs. fashion, insulation by definition). Wants a single most likely defeater with confidence levels.
      *   **Tone:** Rigorous, philosophical, direct, slightly informal but high-level (matching the user's "TA/PhD" vibe). No fluff.

  2.  **Deconstruct the "Paraphrase View":**
      *   Core claim: Causation requires positive relata (events/processes). Omission claims are pragmatic/explanatory, not ontological.
      *   Strengths: Avoids spurious causation (Queen of England), preserves locality/production intuition.
      *   Weaknesses: Struggles with symmetry, timing, and cases where norms are absent (the "Disarmed Sprinkler").
      *   Risk: Definitional immunity (making "cause" mean "positive event" by fiat).

  3.  **Address the 6 Specific Points:**

      *   **(1) Double Prevention:** (Poison swapped -> survival).
          *   *Standard View:* The absence of poison caused survival.
          *   *Paraphrase View:* The colleague's *action* (swapping) caused survival. The absence of poison is just the state of the cup.
          *   *Analysis:* This is actually a *strength* for the Paraphrase View. Double prevention is usually reduced to positive prevention. The "absence of poison" isn't doing work; the *presence* of the safe cup is.
          *   *Verdict:* Shrug. This isn't a counterexample; it's a misdescription by opponents.

      *   **(2) Symmetric Overdetermination by Omissions:** (Two guards, neither locks, burglar enters).
          *   *Problem:* Counterfactual dependence fails (if Guard A locked, no burglar; if Guard B locked, no burglar; but neither did).
          *   *Paraphrase View:* No cause? Or the positive history (guards playing cards)?
          *   *Analysis:* If the view says "no cause," it conflicts with intuition that the break-in *had* a cause. If it says "guards playing cards," that's the positive cause. But the specific claim "Guard A's failure caused..." is hard to parse without norms.
          *   *Verdict:* Hurts. Requires biting the bullet that sometimes there is *no* cause for an effect, or re-describing the positive activity as the cause.

      *   **(3) Timing/Location:** (Doctor fails at midnight, patient dead at 11:55).
          *   *Problem:* Absences don't have spatiotemporal coordinates.
          *   *Paraphrase View:* Vagueness proves they aren't events.
          *   *Analysis:* Positive events can be vague too (when did the heating start?). But the "late omission" shows the counterfactual dependence holds even when the "cause" is temporally displaced from the effect's vulnerability.
          *   *Verdict:* Merely Awkward. Positive events have boundary issues too. The real issue is the *relation* to the effect's time.

      *   **(4) The Disarmed Sprinkler (User's Case):** (No rewiring months ago, no duty, no agent at time T, fire spreads).
          *   *Problem:* No norms, no duty, no specific agent failure at the moment. Just a structural absence.
          *   *Paraphrase View:* Needs norms/plans to select the absence. Here, there are none. Yet "absence of signal caused fire" sounds true.
          *   *Analysis:* This is the strongest case against the Paraphrase View. It isolates the "norms" clause. If there are no norms, the Paraphrase View says "not a cause." Intuition says "cause."
          *   *Verdict:* **Give it up / Major Concession.** This attacks the "norms" escape hatch.

      *   **(5) Model-Relativity:** (Variables in causal models).
          *   *Problem:* Omissions are causes only if modeled. Positive causes seem robust.
          *   *Paraphrase View:* "See? It's pragmatic."
          *   *Analysis:* Positive causes are *also* model-relative (Halpern/Pearl). We choose the granularity. But omissions are *more* sensitive.
          *   *Verdict:* Hurts. Shows the view relies on pragmatic selection, but admits positive causation does too. Not a knockout, but highlights the pragmatism.

      *   **(6) Thin vs. Thick Absences:** (User's rescue device).
          *   *Problem:* Is this ad hoc?
          *   *Analysis:* It tracks the "norms" clause. "Thick" = institutional fact. "Thin" = brute fact.
          *   *Test:* Can we find a Thick absence that isn't a cause, or a Thin one that is? The Sprinkler case (4) makes "Thick" hard to define without norms.
          *   *Verdict:* Moves-in-the-night risk. Needs independent criteria for "Thick" other than "causally relevant."

  4.  **Epistemics & Consensus:**
      *   *Consensus:* There is *no* consensus. The literature is split between Neo-Russellian (no causation), Process (positive only), and Counterfactual/Interventionist (omissions allowed).
      *   *Insulation:* The view is insulated if "cause" is defined as "energy transfer" or "positive event." If defined functionally, it fails.
      *   *Unfalsifiability:* It risks being unfalsifiable if every counterexample is met with "that's just an explanation, not causation."
      *   *Metaphysics:* This is standard metaphysical friction (ontology vs. pragmatics).

  5.  **Ranking the Defeaters:**
      1.  **The Disarmed Sprinkler (Case 4):** Removes the "norms" crutch.
      2.  **Symmetric Overdetermination (Case 2):** Breaks the counterfactual backup.
      3.  **Model Relativity (Case 5):** Shows the pragmatism is deeper than admitted.
      4.  **Timing (Case 3):** Weak objection.
      5.  **Double Prevention (Case 1):** Actually supports the view.
      6.  **Thin/Thick (Case 6):** Methodological worry.

  6.  **Drafting the Response:**
      *   *Tone:* Peer-to-peer. Acknowledge the sophistication.
      *   *Structure:*
          *   Intro: Validate the position (it's the "Positive Causation" or "Process" view).
          *   The Ranking (The "Cost" Analysis).
          *   Detailed walkthrough of the 6 cases.
          *   Epistemic Status (Consensus vs. Fashion).
          *   The Verdict (Insulation & The Single Defeater).
      *   *Key Insight:* The user's view is essentially *Causal Realism about Processes* + *Pragmatism about Omission Talk*. The vulnerability is whether "causation" is a natural kind or a pragmatic tool.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction on Case 1:* Make sure to emphasize that Double Prevention is usually *friendly* to the paraphrase view because it reduces to positive prevention.
      *   *Correction on Case 4:* This is the killer. I need to make sure the user sees *why* it kills the "norms" clause. It's a structural absence without a moral/normative agent.
      *   *Correction on Epistemics:* Don't claim there's a consensus. Be clear that Interventionists (Woodward) dominate currently, but Process theorists (Dowe) exist.
      *   *Definition Check:* The user admits the supervisor's charge. I need to confirm: Yes, it is definitional, but definitions in metaphysics are theory-laden. The question is whether the definition pays its rent.

  8.  **Final Polish:** Check against constraints.
      *   Rank from "Give it up" to "Merely awkward."
      *   Address all 6 cases.
      *   Separate consensus from fashion.
      *   Flag definitional insulation.
      *   Single defeater with confidence.
      *   Explanatory work argument.

      *(Self-Correction on "Explanatory Work"):* The user asked for a case where absence does work positive history + counterfactuals + norms can't replicate. I need to be honest: It's hard to find *ontological* work. The work is usually *explanatory*. If the view concedes the explanatory work but denies the ontology, it survives. The Sprinkler case threatens this because the "norms" part of the explanation is missing, yet the explanation holds.

      *Wait, one nuance:* The user asks: "I want to know how much of the view is that definition wearing a coat." I need to answer this directly. It *is* a definition wearing a coat, but the coat (the theory of explanation) does work. The risk is if the coat is just camouflage.

      *Final Plan:*
      1.  Label the view (Causal Realism/Process Theory).
      2.  Rank the 6 points.
      3.  Deep dive into the 6 points.
      4.  Epistemic check.
      5.  The "Definition wearing a coat" verdict.
      6.  The Single Defeater.

      *Let's write.*
answer: |-
  This is a clean, high-stakes metaphysical dispute. You are defending a version of **Process Theory** (or Causal Realism) combined with **Pragmatism about Omission Talk**. Your opponent is likely defending an **Interventionist** or **Counterfactual** account where causation is a functional relation, not an ontological pipeline.

  Your supervisor is half-right: you *have* built the conclusion into the definition, but in metaphysics, that is only a sin if the definition doesn't pay its rent in theoretical utility. If your "Paraphrase View" (let's call it **Positive Causation + Pragmatic Omission**, or PCPO) handles the data better than the competition, the definition is a feature, not a bug. If it merely immunizes you from refutation while failing to explain why omission-talk is so ubiquitous and robust, it's a vice.

  Here is the ranking of what would count against you, from fatal to cosmetic, followed by the walkthrough of your six cases, the epistemic reality check, and the single defeater.

  ### The Cost Ranking

  1.  **Give It Up (Fatal):** A case where an absence functions as a cause *without* any available positive surrogate, *without* any normative background, and *without* counterfactual dependence that tracks the absence specifically. (See Case 4).
  2.  **This Hurts (Major Concession):** A case where your view forces you to deny there is *any* cause for a clear effect, or where you must accept that "causation" is so model-relative that positive events lose their privileged status. (See Cases 2 & 5).
  3.  **This is Merely Awkward (Cost of Doing Business):** Vagueness in timing or location that also plagues positive events, or cases where your paraphrase is verbose but accurate. (See Cases 3 & 6).
  4.  **Shrug (Actually Supports You):** Cases where the "omission" intuitively reduces cleanly to a positive prevention. (See Case 1).

  ---

  ### Walkthrough of the Six Cases

  #### (1) Double Prevention (The Poison Swap)
  *The Case:* Assassin poisons Cup A. Colleague swaps Cup A for Cup B (safe). Victim drinks B, survives.
  *Opponent:* The *absence* of poison in Cup B caused the survival.
  *Your View:* The Colleague's *action* (swapping) caused the survival. The absence of poison is a state, not an event.

  **Verdict: Shrug.**
  This is not a counterexample to PCPO; it is the strongest evidence *for* it. Double prevention cases are almost universally reducible to positive prevention in a process framework. The colleague's movement physically intercepted the causal chain. The "absence of poison" is just a description of the state of Cup B resulting from the swap.
  *Concession:* You must concede that "absence of poison" is a *true explanation*, but you are entitled to deny it reports a causal *relation*. The positive history (the swap) does all the ontological heavy lifting. If your opponent insists the absence is the cause, ask them: "What energy, matter, or information flowed from the absence to the survival?" If they say "none," you have won the ontology battle; if they say "information," ask where it was encoded (in the cup, which is positive).

  #### (2) Symmetric Overdetermination by Two Omissions
  *The Case:* Guard A and Guard B both have keys. Either locking is sufficient. Neither locks. Burglar enters.
  *Opponent:* Both omissions caused the break-in (or the disjunction).
  *Your View:* No positive event caused the break-in? Or the guards playing cards caused it?

  **Verdict: This Hurts.**
  This breaks your counterfactual machinery. If you say "the guards playing cards caused the break-in," you are stretching positive causation. Playing cards didn't *produce* the open door; the *non-locking* did.
  *The Cost:* You are forced to say either (a) there is no cause of the break-in (which sounds absurd for a physical event like a door opening) or (b) the cause is the *last positive action* that failed to prevent it (leaving the post).
  *Concession:* You must concede that on PCPO, some effects (like the door opening) might lack a *proximate* cause in the strict sense, having only a *distal* positive cause (the decision to leave the post). This is a bullet you can bite, but it costs you the intuition that every event has a cause. If you deny the break-in has a cause, you violate the Principle of Sufficient Reason in a way that makes your metaphysics look gappy.

  #### (3) The Timing Worry
  *The Case:* Patient dead at 11:55. Doctor fails to give antidote at 12:00.
  *Opponent:* How can the 12:00 omission cause a 11:55 death?
  *Your View:* Absences aren't located, so this category error proves they aren't causes.

  **Verdict: Merely Awkward.**
  This is a problem for *event individuation*, not necessarily causation. Positive events have fuzzy boundaries too (when exactly did the heating of the water begin?).
  *Concession:* You are entitled to shrug, *provided* you have a theory of explanatory relevance that handles temporal mismatch. The "cause" of the death was the injury at 11:50. The doctor's omission is an explanation for why death wasn't *prevented*, not what *produced* the death.
  *Risk:* If you insist the omission is the cause, you break transitivity. If you insist it isn't, you match intuition. This point favors you, but only because it highlights the incoherence of the opponent's view, not because it proves yours.

  #### (4) The Disarmed Sprinkler (Your Killer Case)
  *The Case:* Sprinkler not rewired months ago. No duty, no agent at time T, no specific expectation at time T. Fire spreads. "Absence of signal caused spread" is true.
  *Opponent:* See? No norms, no agent, just structural absence doing causal work.
  *Your View:* Needs norms/plans to select the absence.

  **Verdict: Give It Up (or Major Revision).**
  This is the strongest objection because it removes your "norms/expectations" escape hatch. In the Guard case, you say we select the guard's absence because of a duty. In the Sprinkler case, there is no duty at the moment of fire, just a structural state.
  *The Problem:* If you say "the absence of the wire caused the fire," and there are no norms to ground the selection, your view must either:
  1.  Deny it's a cause (counter-intuitive).
  2.  Find a positive surrogate (the presence of the *unrewired* state).
  *Concession:* If you choose (2), you are no longer denying causation by absence; you are re-labelling structural states as "positive." If the "unrewired state" counts as a positive event, then *any* absence can be re-described as a positive state of affairs (e.g., "the guard's state of being-asleep").
  *The Test:* If you allow "state of being unrewired" to count as a positive cause, your view collapses into the opponent's view, just with different terminology. If you deny it, you look dogmatic. This case suggests that **structural constraints** function causally regardless of norms.

  #### (5) Model-Relativity
  *The Case:* Causal models include "Guard Locks = 0" as a variable. Absence becomes a cause.
  *Opponent:* Causation is model-relative. Omissions are causes in the right model.
  *Your View:* Positive causes aren't model-relative in the same way.

  **Verdict: This Hurts.**
  You are exposed here. Interventionists (like Woodward) argue that *all* causation is model-relative. We choose the granularity for positive events too (did the "spark" cause the fire, or the "friction of the flint"?).
  *Concession:* You must concede that positive causation is *also* sensitive to variable selection, but argue it is *less* sensitive. A positive event exists in the model regardless of whether we name it; an omission only exists if we name it.
  *The Risk:* If the opponent shows that positive events are *equally* dependent on the "contrast class" chosen by the modeller, your privileged status for positive events vanishes. Current literature suggests they are quite similar. You are not *specially* exposed, but you lose the "objectivity" high ground.

  #### (6) Thin vs. Thick Absences (Your Rescue Device)
  *The Case:* Thin (Queen doesn't water) vs. Thick (Guard doesn't lock).
  *Your View:* Thick absences are explanatory because they involve a mechanism/plan failure.
  *Opponent:* This is ad hoc.

  **Verdict: Merely Awkward (if defined structurally).**
  This is not junk *if* "Thick" is defined independently of causal relevance.
  *The Test:* Can you identify a "Thick" absence that is *not* a cause? Yes: The guard fails to lock, but the burglar is scared off by a dog. The Thick absence exists (breach of duty) but didn't cause the non-break-in.
  *The Test:* Can you identify a "Thin" absence that *is* a cause? This is harder. If you say "No," then the distinction is just a proxy for "causally relevant."
  *Concession:* The distinction does real work *explaining why we talk* about some omissions and not others. It does not prove they are ontological causes. You are entitled to use this to explain the *pragmatics*, but not the *metaphysics*.

  ---

  ### Epistemics: Consensus vs. Fashion

  **Consensus:** There is **no consensus**.
  *   **Majority:** Interventionist/Counterfactual accounts (Woodward, Halpern, Pearl) dominate philosophy of science and AI. They treat omissions as causes because it makes the models work.
  *   **Minority:** Process/Conserved Quantity theories (Dowe, Salmon) hold the line for positive-only causation.
  *   **Fashion:** It is currently fashionable to be a "pluralist" (causation means different things in different contexts). This is a diplomatic way of saying "we can't agree."

  **Insulation by Definition:**
  Your view **is** insulated by definition. You define "cause" as "positive process." Therefore, absences cannot be causes.
  *   **Is this a problem?** Only if the definition prevents you from capturing the *functional role* of causation. Causation is arguably a functional concept (it explains prediction, intervention, and explanation). If your definition makes causation useless for prediction/intervention regarding omissions, it's a bad definition.
  *   **Honest Metaphysics:** It is honest metaphysics to say "There is a natural relation (production) and a pragmatic relation (explanation), and people confuse them." Your view is honest *if* you admit the pragmatic relation does all the work in omission cases.

  **Unfalsifiability:**
  Your view risks unfalsifiability if every counterexample is met with "That's just explanation, not causation."
  *   **The Fix:** You must specify what would count as a positive cause in omission cases. If you can't point to the positive surrogate in the Sprinkler case (4), you are insulated.

  ---

  ### The Single Defeater

  **The Disarmed Sprinkler (Case 4).**

  **Confidence:** 85%.

  **Why:** It isolates the variable you rely on most (Norms/Expectations).
  Your view relies on the triad: **Positive History + Counterfactuals + Norms**.
  *   In the Guard case, Norms do the selection work.
  *   In the Poison case, Positive History does the work.
  *   In the Sprinkler case, **Norms are absent** (no duty at time T), **Positive History is static** (the wire just isn't there), yet the causal claim ("lack of signal caused spread") remains robust.

  If you cannot find a positive event in the Sprinkler case that corresponds to the "lack of signal" without stretching "positive event" to mean "any state of the universe," then your view cannot distinguish the Sprinkler from the Queen of England case *ontologically*, even though our intuitions distinguish them *explanatorily*.

  **The Argument You Need to Hear:**
  "The 'absence of the signal' is not a norm-dependent selection. It is a **structural constraint**. The wiring diagram of the building is a positive physical object. The *break* in the circuit is a physical state (high resistance/open loop). You don't need a 'duty' for an open circuit to cause a fire. You just need physics. If you call the open circuit a 'positive state,' you have conceded that 'absences' (gaps, breaks, zeros) are physically real states that enter causal relations. If you call it an 'absence,' you must explain why this absence is causal without norms, while the Queen's absence is not. If your answer is 'one is physically structurally relevant and the other isn't,' then you have defined causation by **physical relevance**, not by **positivity**. And physical relevance allows zeros."

  ### Final Advice for the TA

  You are not "winning by stipulation" if you clarify that you are offering a **revisionary metaphysics** rather than a descriptive one.
  *   **Say this:** "I am not denying that omission-claims are true or useful. I am denying that they track a fundamental relation in the world. They track a relation between the world and our expectations."
  *   **The Trap:** Do not let the PhD student force you to say "The absence didn't cause it." Say "The absence *explains* it, but the *cause* was the structural state of the wiring."
  *   **The Retreat:** If the Sprinkler case holds, retreat to: "Causation by absence is a derivative notion, grounded in positive structural states." This saves the "Positive Only" core while admitting the utility of omission talk.

  If you hold the line that "Nothing negative is doing causal work, full stop," the Sprinkler will break you. If you soften to "Nothing negative is doing *fundamental* causal work," you survive, but you concede the debate is verbal.
