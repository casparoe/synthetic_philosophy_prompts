answer: |-
  You have not stumbled on two separate things, nor have you found a paradox in the statistical sense. You have identified the single structural feature that distinguishes **variable-sum games** from **zero-sum games**, and you are observing how that feature fractures the definition of "winning" depending on the timescale and the metric.

  There is no single established term that captures the specific tension you describe (the disconnect between pairwise dominance and tournament victory), though its components are well-known in game theory and evolutionary biology. To carve the phenomenon as you request, I will give it a name, define its boundaries, and separate its two faces.

  ### The Name: The Aggregate-Dominance Gap

  **Definition:** The Aggregate-Dominance Gap is the divergence between a strategy's capacity to generate absolute utility (Aggregate Score) and its capacity to outperform a specific opponent in a dyadic contest (Pairwise Dominance). This gap exists only in variable-sum interactions where mutual cooperation yields a higher total payoff than mutual defection, but unilateral defection yields a higher individual payoff than mutual cooperation.

  ### Face 1: The Metric Divergence (Tournament vs. Pairing)

  You asked what the gap is between scoring well and beating the thing you are paired with.

  In a **zero-sum game** (like chess or poker), the distinction does not exist. To maximize your score is necessarily to minimize your opponent's. "Winning the hand" and " accumulating the most chips over the night" are perfectly aligned.

  In the **Iterated Prisoner's Dilemma**, the payoff matrix is variable-sum.
  *   **Mutual Cooperation:** $3 + 3 = 6$ points generated per round.
  *   **Mutual Defection:** $1 + 1 = 2$ points generated per round.
  *   **Exploitation:** $5 + 0 = 5$ points generated per round.

  **The Copycat (Tit-for-Tat)** wins the tournament because it is a **wealth maximizer**. It seeks the $6$-point rounds. It sacrifices the margin of victory in any single pairing (accepting a 5-point loss against a Defector) to secure the high absolute yield of cooperation against other cooperators. Its "losses" are small (it gets 1 point instead of 5), but its "wins" (mutual cooperation) are voluminous.

  **The Defector (All-D)** wins the pairings because it is a **margin maximizer**. It seeks to ensure its score is higher than the opponent's. It sacrifices the total wealth generation (settling for $2$-point rounds against other Defectors) to ensure it never scores lower than its partner.

  **Why it is not Non-Transitivity:**
  Non-transitivity is a cycle of preference: $A$ beats $B$, $B$ beats $C$, $C$ beats $A$.
  Your observation is not a cycle. It is a conflict of metrics.
  *   Metric A (Pairwise): Defector > Copycat.
  *   Metric B (Aggregate): Copycat > Defector.
  This is not intransitivity; it is **incommensurability**. You are measuring "strength" in two different currencies: "Combat Victory" vs. "Resource Accumulation."

  **Why it is not (merely) Simpson's Paradox:**
  Your statistician friend is mathematically close but conceptually off. Simpson's Paradox describes a statistical artifact where a trend reverses upon aggregation due to confounding variables (e.g., sample size imbalance).
  Your result is not a statistical artifact; it is a **structural necessity** of the payoff matrix. Even with perfectly balanced pairings, the Copycat wins the aggregate score while losing every pairwise contest. Simpson's Paradox suggests the data is misleading you; here, the data is telling you two different true things about two different properties.

  ### Face 2: The Evolutionary Collapse (Frequency Dependence)

  You asked if the collapse of the Defectors in an evolving pool belongs to the same phenomenon.

  It is a **consequence** of the Aggregate-Dominance Gap, but it is a distinct dynamical process called **Frequency-Dependent Selection**.

  *   **In the Tournament (Static):** The Defector fails because the pool contains enough cooperators to drag its average score down. It is surrounded by "sheep" it can shear, but the shearings yield less total wool than the "farming" the Copycat does with other farmers.
  *   **In Evolution (Dynamic):** The Defector fails because it changes its own environment. As Defectors replicate, they meet each other more often. Because of the Aggregate-Dominance Gap, Defectors generate very little wealth when meeting themselves ($1+1$). Their absolute fitness drops. The Copycat (or the Win-Stay-Lose-Shift strategy you observed) maintains higher absolute fitness because it sustains cooperation ($3+3$) when meeting itself.

  So, Face 1 is about **Accounting** (how we tally the score). Face 2 is about **Ecology** (how the score translates to survival). They are driven by the same engine (the variable-sum payoff matrix), but they are not the same mechanism. Face 1 explains why the Defector looks strong in a fight but weak in a bank account. Face 2 explains why a species of Defectors goes extinct when they become too common.

  ### The Boundary Case: Where the Distinction Vanishes

  You asked for a case in which the distinction makes no difference. This allows you to see the edges of the phenomenon.

  The Aggregate-Dominance Gap collapses to zero in a **Zero-Sum Prisoner's Dilemma**.

  Imagine you alter the payoffs so that the total points available in every round are constant, regardless of the moves.
  *   Cooperate/Cooperate: You get 3, Opponent gets 3. (Total 6)
  *   Defect/Defect: You get 3, Opponent gets 3. (Total 6)
  *   Defect/Cooperate: You get 6, Opponent gets 0. (Total 6)
  *   Cooperate/Defect: You get 0, Opponent gets 6. (Total 6)

  In this modified game:
  1.  **The Gap Vanishes:** Maximizing your score is now mathematically identical to minimizing your opponent's score. The Copycat can no longer win the tournament by losing pairings. If it ties or loses every pairing, its aggregate score must be lower than or equal to the winner of the pairings.
  2.  **Evolution Changes:** Frequency dependence disappears regarding the *total* wealth. Defectors no longer suffer when meeting themselves (they get 3 points each, same as cooperators). The evolutionary pressure shifts entirely to exploitation resistance.

  Alternatively, the distinction vanishes if you change the **Tournament Metric**. If you score your tournament by **Pairwise Wins** (as you mentioned you tried) rather than Aggregate Points, the Defector wins the table. The "phenomenon" you observed is not in the strategies themselves, but in the interaction between the strategies and the **Aggregate Point Metric**.

  ### Summary of the Carving

  1.  **The Phenomenon:** The **Aggregate-Dominance Gap**.
  2.  **The Cause:** The game is **Variable-Sum**. Mutual cooperation creates more value than mutual defection, creating a divergence between "creating value" (Copycat) and "claiming value" (Defector).
  3.  **The Two Faces:**
      *   **Static (Tournament):** A conflict between *Absolute Fitness* (Total Points) and *Relative Dominance* (Pairwise Wins).
      *   **Dynamic (Evolution):** A conflict between *Exploitation Potential* (High when rare) and *Sustainability* (Low when common).
  4.  **The Boundary:** The phenomenon ceases to exist in **Zero-Sum** games or if the scoring metric is changed to **Pairwise Wins**.

  You are looking at one thing with two faces. The "one thing" is the **non-zero-sum nature of the payoff matrix**. The "two faces" are the **static accounting error** (thinking pairwise wins equal tournament wins) and the **dynamic ecological trap** (thinking exploitation scales indefinitely). The Copycat wins the tournament because it optimizes for the matrix's total wealth. The Defector loses the evolution because it optimizes for a margin that disappears when it becomes the majority.
