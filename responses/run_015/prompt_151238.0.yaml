answer: |-
  ### Which step breaks

  Step (5) is where the logic snaps. You conclude that because the shared lean doesn't cancel, the group's accuracy converges to 50%. This assumes the common information driving that lean is completely uncorrelated with the truth—essentially a random guess. But shared information isn't necessarily noise; it's often signal, just correlated. If everyone reads the same accurate memo, the shared lean is 100% accurate. The group's accuracy converges to the accuracy of that common signal, not necessarily 50%. By hardcoding the limit at 50%, you're assuming the shared environment is useless, which contradicts your setup where individuals are 60% accurate. If individuals are 60% accurate partly due to shared info, that shared info must be better than random. Therefore, the group limit isn't 50%; it's the competence level of the common signal, which could still exceed individual performance if the independent noise was dragging individuals down.

  ### Why it looked fine

  This step feels intuitive because we confuse bias with randomness. When you say the shared lean doesn't cancel, it sounds like a systematic error that ruins everything. It's easy to think that if errors are correlated, the wisdom of crowds vanishes, leaving only chaos. Since chaos implies no knowledge, 50% accuracy seems like the natural baseline. It looks like a safe conservative estimate: if we can't trust independence, we assume the worst-case scenario where the common signal is useless. This validates skepticism about herd mentality without requiring you to quantify how good the shared information actually is.

  ### What it costs me

  Giving up Step (5) costs you the clean, damning conclusion that democracy is mathematically broken. You can no longer claim big groups are inherently worse than individuals. Instead, you have to do the hard work of evaluating the quality of the shared information. If the common signal is strong, correlation helps everyone align on the truth. If it's weak, correlation locks everyone into error. This means the lunch poll succeeded not because correlation vanished, but because the shared information among students was actually better than the teachers' private analysis. You lose universal skepticism about group decision-making. You must accept that correlated groups can outperform individuals if the common signal is competent. It shifts the burden from proving independence to proving signal quality. You can't just say people copy each other; you have to ask what they're copying. If they're copying truth, the crowd is still wise, just less robust than the ideal theorem suggests. You trade a clean proof for a messy reality check. The math becomes messier because you're dealing with covariance instead of simple binomial distributions. You have to acknowledge that independence is an idealization, not a requirement for any benefit, only for maximum benefit. It forces nuance where you wanted a rule.

  ### Bottom line

  Your derivation is clever, but it hinges on assuming shared information is no better than a coin flip. Correlation limits the accuracy to the quality of that common signal; it doesn't reset accuracy to 50%. If students shared better data than the teachers, the poll wins. The theorem isn't broken; your estimate of the shared signal's competence was too low.
