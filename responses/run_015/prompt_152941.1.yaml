answer: |-
  # Seminar Activity Design: The Anchor and the Claim
  **Topic:** Relational Conceptions of Personhood & The Ethics of Care
  **Duration:** 90 Minutes
  **Participants:** 12 Students (Divided into 3 Committees of 4)
  **Level:** Upper-Level Philosophy

  ---

  ## I. Student Materials (Distributed at Start)
  *(Note: These materials contain no theoretical labels. Students encounter the problem through the scenario constraints.)*

  ### The Scenario: The "Link" Allocation
  **Context:**
  Subject **K** is an adult with severe cognitive disabilities who cannot communicate verbally or perform daily living tasks without assistance. Partner **J** has been K's sole long-term caregiver for 15 years. Their bond is deep; J anticipates K's needs before they arise, and K exhibits signs of stability and comfort only in J's presence.

  The State provides a baseline stipend, but it is insufficient for long-term sustainability. A new, scarce resource has become available: **The Integrated Support Grant.**
  *   **Value:** Equivalent to 20 hours of weekly specialized support.
  *   **Constraint:** The Grant is indivisible. It must be assigned to *one* of two channels.

  **The Options:**
  1.  **Channel A (Independent Agency):** The Grant is assigned to **K**. It funds a third-party communication device and a rotating team of support workers. K gains a direct line to the state and reduced reliance on J.
  2.  **Channel B (Relational Maintenance):** The Grant is assigned to **J**. It funds specialized training for J and respite care that keeps J within K's immediate environment. K's access to the world remains mediated through J, but the J-K bond is fortified against burnout.

  ### The Roles (4 per Committee)
  1.  **Partner J (The Caregiver):** You argue that K's stability and identity are inextricably linked to your presence. Separation risks K's psychological disintegration.
  2.  **The Case-Manager (The Institution):** You argue for risk mitigation, cost-efficiency, and adherence to state protocols regarding individual rights and safeguarding.
  3.  **The Kin (Family Member):** You argue that K possesses inherent entitlements independent of any relationship. K must not be "owned" or "mediated" by J.
  4.  **The Advocate (The Guardian):** You argue that removing J's centrality dissolves the very context that makes K a person. Protecting K means protecting the bond, not just the biology.

  ### Deliberation Rules
  1.  **Principles, Not Preferences:** You cannot argue based on what you *want* (e.g., "J needs rest"). You must argue based on a principle of personhood or obligation (e.g., "Personhood requires X").
  2.  **Unanimous Grounds:** A decision is only reached if all four members agree on the *reason* for the allocation, not just the outcome. (e.g., You cannot vote for Channel A if half the group thinks it's for "Rights" and half thinks it's for "Efficiency.")
  3.  **No Splitting:** The Grant cannot be divided.
  4.  **Time Limit:** You have 30 minutes to reach a consensus.

  ---

  ## II. Facilitator Guide & Timeline

  ### Phase 1: Setup & Mapping (15 Minutes)
  *   **00-05:** Divide class into 3 committees. Distribute Role Cards.
  *   **05-15:** **Relationship Mapping.** Ask students to draw a diagram of the moral landscape.
      *   *Instruction:* "Draw lines between the actors (K, J, State, Family). Label the lines. Is the line a 'right'? A 'dependency'? A 'constitution'? Does K exist as a moral agent without the line to J?"
      *   *Goal:* Force them to visualize the ontology before the decision.
  *   **15-20:** Clarify Rules. Emphasize "Unanimous Grounds."

  ### Phase 2: Deliberation (30 Minutes)
  *   **20-50:** Committees deliberate.
  *   **Facilitator Intervention (The "Honest Note"):**
      *   *Predictable Failure:* Students will likely attempt to resolve the tension using liberal rights language (e.g., "K has a right to independence, so Channel A").
      *   *Intervention:* If a group moves too quickly to "Rights," pause them. Ask: "If K's capacity for agency is *produced* by J's care, does K have a right that exists prior to J? If you assign the Grant to K, are you assuming a self that isn't there?"
      *   *Goal:* Prevent premature closure. Make them feel the ontological risk of Channel A (dissolving the bond that makes K who they are) vs. Channel B (making K a prisoner of the bond).

  ### Phase 3: The Scoring Reveal (10 Minutes)
  *   **50-60:** Collect decisions. Reveal the **Incommensurable Payoff Matrix**.
      *   *Display on Board:*
          *   **If Channel A (Independent) is chosen:**
              *   *Institutional Viability:* **High** (State can audit K directly; J is replaceable).
              *   *Relational Integrity:* **Critical Risk** (K's known identity destabilizes without J's mediation; "Personhood" status becomes ambiguous).
          *   **If Channel B (Relational) is chosen:**
              *   *Institutional Viability:* **Low** (State cannot audit K directly; high risk if J quits/dies).
              *   *Relational Integrity:* **High** (K's identity is preserved, but K has no independent claim).
      *   *The Catch:* There is no total score. You cannot add "Viability" + "Integrity." Maximizing one inherently degrades the other.
      *   *Task:* Ask groups: "Did your consensus hold up when you saw that protecting the person might undermine the system, or protecting the system might dissolve the person?"

  ### Phase 4: Debrief & Theoretical Mapping (30 Minutes)
  *   **60-70:** **Mapping the Conflict.**
      *   Ask: "At what minute did you feel stuck not because of resources, but because of *what K is*?"
      *   Identify the moment the **Ontological Claim** (K is made by J) clashed with the **Normative Claim** (J owes K care).
      *   *Key Insight:* If K is constituted by J, K cannot have a claim *against* J that threatens the J-K bond. But if K has no claim against J, K is vulnerable to J's whims.
  *   **70-80:** **Distortions of the Framework.**
      *   *Facilitator Note:* Explicitly identify that this scenario distorts the target framework (classic *ubuntu*-style relationality).
      *   *Point 1: Dyadic vs. Communal.* The scenario isolates J and K. In classic relational frameworks, personhood is embedded in a *community*, not a single dyad. If J fails, the community should step in. Here, the State is a bureaucrat, not a community member.
      *   *Point 2: Reciprocity.* The scenario is asymmetric. K cannot reciprocate. Classic frameworks usually imply some form of mutual recognition. This scenario forces students to grapple with non-reciprocal constitution.
      *   *Point 3: Mediation.* The State monetizes the bond. In the target framework, the bond is often pre-political. Here, the State holds the resource, making the relationship contingent on funding.
  *   **80-90:** **The Ontological Gap (Frank Admission).**
      *   *Facilitator Script:* "This activity made the tension visceral, but it could not reproduce the core ontological feature: that the self is *literally* co-constituted. In the game, you played 'roles.' In the theory, there is no 'K' without the relation. You treated K as a bounded entity who *might* lose status. The theory claims K *does not exist* as a moral subject without the relation. I must supply that gap verbally: The horror of Channel A isn't that K becomes sad; it's that K becomes a biological shell. The horror of Channel B isn't that K is dependent; it's that K is property. The theory tries to walk the line between shell and property, but this scenario shows how the State forces a choice."

  ---

  ## III. Critical Facilitator Notes

  ### 1. The "Honest Note" on Predictable Failure
  **The Trap:** Upper-level philosophy students are trained in liberal individualism. They will almost instinctively try to resolve the dilemma by asserting K's "inherent dignity" or "autonomy" to justify Channel A.
  **The Intervention:** Do not lecture. Use the **Unanimous Grounds** rule.
  *   *Ask:* "The Case-Manager agrees to Channel A for efficiency. The Kin agrees for rights. Do you share the *same ground*?"
  *   *If No:* "You have not met the consensus rule. Keep talking."
  *   *If Yes (Rights):* "If K's rights are inherent, why does J's presence matter ontologically? If J's presence matters ontologically, can K have inherent rights independent of J? You must resolve this contradiction, not ignore it."

  ### 2. The "Frank Admission" on Ontological Limits
  **The Limitation:** A role-play simulates *decision-making*, not *being*.
  **The Gap:** The activity treats personhood as a *status to be protected*. The target framework treats personhood as a *process that is happening*.
  **Facilitator Instruction:** You must verbally bridge this. Explain that in the strongest version of this view, "Personhood" is not a switch that is on or off (as the scoring matrix implies), but a continuous current. If the current stops, the person ceases. The scenario forces a binary choice (A or B) which artificially hardens a fluid process. Acknowledge that the "Scoring Mechanism" is a liberal tool used to critique a relational view, which is itself a distortion necessary for the seminar to function.

  ### 3. Scoring Mechanism Details (Incommensurability)
  Do not allow students to create a weighted average (e.g., "Integrity is worth 2 points, Viability 1 point").
  *   **Rule:** The two metrics are on different axes.
  *   **Visual:** Draw a graph. X-axis = Viability. Y-axis = Integrity.
  *   **Outcome:** Channel A is far Right, Low Up. Channel B is far Left, High Up.
  *   **Lesson:** There is no "higher" total score. There is only a choice of *which kind of loss* to accept. This mirrors the philosophical tension between the **Constitutive Claim** (Integrity) and the **Normative Claim** (Viability/Obligation).

