answer: |-
  # The Welfare Impact Screen (WIS)

  **Purpose:** To provide a consistent, half-day decision procedure for assessing the individual welfare implications of habitat-change consultations, distinct from biodiversity metrics.
  **Inputs:** Species counts, habitat maps, management prescriptions, baseline monitoring data.
  **Constraints:** No specialist welfare modelling; relies on proxies for valence and duration.
  **Accounting Unit:** Welfare-Years per Hectare-Year (WY/ha-yr).

  ---

  ## Step 1: The Counterfactual Baseline
  **Question:** What is the welfare trajectory of the site if the proposal is *refused*?
  **Procedure:**
  1.  Identify the current management regime (e.g., grazing intensity, cropping cycle, abandonment).
  2.  Project this regime forward for 10 years (the "Refusal Scenario"). Account for statutory obligations that bind the landowner regardless of this specific application (e.g., cross-compliance, existing stewardship agreements).
  3.  Estimate the welfare valence (positive/negative) of the Refusal Scenario using current species density and known life-history stressors (e.g., winter starvation rates in unmanaged grazing).
  **Evidence Standard:** Management agreements, historical land-use maps, local ecological records.
  **Stop Condition:** If the Refusal Scenario involves imminent habitat collapse (e.g., drainage failure leading to desiccation) that causes severe suffering, proceed to Step 2 only if the proposal mitigates this.
  **Hand-Off Condition:** If the Refusal Scenario is stable or improving, proceed to Step 2.
  **Classification:** **Fact** (Current management), **Judgment** (Trajectory projection).

  ## Step 2: Demography and Replacement
  **Question:** Are the animals lost to the project *additional* deaths, or would they have died anyway due to density dependence?
  **Procedure:**
  1.  Compare current population density against estimated carrying capacity ($K$) for the Refusal Scenario.
  2.  **Regime A (Source):** Density $< K$. Losses represent net reductions in welfare-years (lost lives).
  3.  **Regime B (Sink/Saturated):** Density $\approx K$. Losses represent "rearranged" deaths. The welfare cost is the *difference* in suffering between dying now (displacement) vs. dying later (starvation/predation).
  4.  If evidence is absent, assume **Regime B** for wild mammals/birds in established habitat (conservative for development, restrictive for restoration).
  **Evidence Standard:** Population density estimates, productivity rates (young per adult), mortality causes.
  **Stop Condition:** If Regime A applies and the proposal destroys the habitat, the welfare cost is high. Flag for Step 5.
  **Hand-Off Condition:** Proceed to Step 3 with the adjusted "Net Welfare Loss/Gain" figure.
  **Classification:** **Fact** (Density data), **Judgment** (Regime classification in absence of data).

  ## Step 3: Life History and Valence
  **Question:** Does the change in habitat shift the balance towards species with high turnover (r-strategists) or stable lives (K-strategists)?
  **Procedure:**
  1.  Assign a **Valence Weight** to the dominant species in both Proposal and Refusal scenarios.
      *   *High Turnover (e.g., voles, invertebrates):* Weight = 0.5 (High probability of negative welfare due to starvation/predation).
      *   *Stable (e.g., large herbivores, raptors):* Weight = 1.0 (Higher probability of positive welfare if managed/stable).
  2.  Calculate **Net Welfare Change** = (Proposal Density $\times$ Weight) - (Refusal Density $\times$ Weight).
  3.  **Sign Symmetry Check:** If the proposal is a "restoration" (e.g., rewilding) but increases the density of High Turnover species significantly, the result may be negative. The procedure must allow for refusing restoration.
  **Evidence Standard:** Species lists, trophic level data, known mortality rates.
  **Stop Condition:** If Net Welfare Change is strongly negative, recommend Refusal.
  **Hand-Off Condition:** If Net Welfare Change is positive or neutral, proceed to Step 4.
  **Classification:** **Value** (Weighting of suffering vs. existence), **Fact** (Life history traits).

  ## Step 4: Leakage and Offsets
  **Question:** Do off-site gains compensate for on-site welfare losses?
  **Procedure:**
  1.  Identify off-site creation/protection (statutory net-gain).
  2.  Apply a **Discount Rate of 0.5** to off-site welfare-years (due to spatial separation, uncertainty of delivery, and different baseline conditions).
  3.  Include only animals of the *same species* or *equivalent welfare profile* in the offset accounting.
  4.  **Boundary Principle:** Off-site animals count only if the offset is legally secured for the same duration as the impact.
  **Evidence Standard:** Legal agreements for offsets, habitat creation plans.
  **Stop Condition:** If discounted off-site gains do not exceed on-site losses, recommend Refusal.
  **Hand-Off Condition:** Proceed to Step 5.
  **Classification:** **Judgment** (Discount rate), **Fact** (Legal security).

  ## Step 5: Uncertain Taxa and Aggregation
  **Question:** How do we account for invertebrates and larvae where sentience is uncertain?
  **Procedure:**
  1.  Calculate vertebrate welfare balance from Steps 1–4.
  2.  Calculate invertebrate welfare balance separately using a **Precautionary Cap**: Invertebrate welfare-years cannot exceed 10% of the vertebrate total in the final decision matrix.
  3.  This prevents uncertainty from swallowing the analysis (by capping influence) but acknowledges it (by including it).
  4.  **Final Decision:** If Vertebrate Balance + Capped Invertebrate Balance < 0, Recommend Refusal. Else, Recommend Permit.
  **Evidence Standard:** Biomass estimates, taxonomic surveys.
  **Stop Condition:** Final Recommendation generated.
  **Classification:** **Value** (Precautionary Cap), **Judgment** (Aggregation).

  ---

  ## Application to Proposals

  ### Proposal 1: Drainage of 8ha Lowland Fen for Housing
  *   **Step 1 (Baseline):** Fen currently managed for conservation. Refusal = stable fen. High welfare for specialist amphibians/waders.
  *   **Step 2 (Demography):** Fen specialists are often source populations (Regime A). Loss is net reduction in lives.
  *   **Step 3 (Valence):** Housing supports few wild vertebrates (pigeons/rats). High turnover, low valence. Fen supports stable specialists. Net Change: Strongly Negative.
  *   **Step 4 (Leakage):** Wetland creation 2km away. New wetlands take 10+ years to mature. Discounted value (0.5) does not match immediate loss of mature fen.
  *   **Step 5 (Taxa):** Invertebrate loss in fen is high, but capped. Vertebrate loss dominates.
  *   **Outcome:** **Refuse.** (Welfare cost of displacement and habitat loss outweighs uncertain offset).

  ### Proposal 2: Native Woodland on 200ha Upland Rough Grazing
  *   **Step 1 (Baseline):** Low-density grazing (deer/hare). Refusal = continued grazing. Moderate welfare (some starvation/predation, but adapted).
  *   **Step 2 (Demography):** Grazers are likely at $K$ for the open habitat (Regime B). Fencing/planting displaces them. Displacement causes immediate stress/death.
  *   **Step 3 (Valence):** New woodland supports high densities of small mammals (voles/mice) and generalist birds. These are High Turnover species (Weight 0.5). The proposal swaps stable large herbivores for high-turnover small mammals.
  *   **Step 4 (Leakage):** No off-site offset.
  *   **Step 5 (Taxa):** Invertebrate biomass increases in woodland, but capped at 10%.
  *   **Outcome:** **Refuse.** (The procedure identifies that converting open habitat to woodland increases the *number* of lives but decreases the *average welfare per life* due to high turnover and predation rates in new woodland edges, plus the certain welfare cost of displacing existing grazers. This contradicts the standard biodiversity view that woodland creation is inherently positive).

  ### Proposal 3: Intensive Arable (60ha) to Wet Grassland with Grazing
  *   **Step 1 (Baseline):** Intensive arable. Refusal = continued ploughing/pesticides. Vertebrate density near zero. Invertebrate mortality very high (tillage).
  *   **Step 2 (Demography):** Arable is a welfare sink (Regime A - lives started then destroyed). Grassland supports stable populations.
  *   **Step 3 (Valence):** Wet grassland introduces vertebrates (waders/grazers). While they face predation, the baseline (non-existence/tillage death) is worse. Valence Weight shifts from 0 (Arable) to 1 (Grazing).
  *   **Step 4 (Leakage):** Agri-environment scheme. No leakage.
  *   **Step 5 (Taxa):** Invertebrate welfare improves (no tillage). Even with the 10% cap, the vertebrate shift from 'none' to 'some stable lives' is positive.
  *   **Outcome:** **Permit.** (The switch from a habitat that kills inhabitants mechanically to one that supports natural life cycles is a net welfare gain, provided grazing density is managed to prevent starvation).

  ---

  ## Limits and Failure Modes

  **Classes of Proposal to Exclude:**
  1.  **Emergency Works:** Flood defence or safety-critical infrastructure where the timeline precludes even a half-day screen.
  2.  **Micro-Developments:** Single dwellings where the welfare impact is negligible compared to the administrative burden.
  3.  **Research/Experimental Management:** Where the explicit goal is to test welfare outcomes; the procedure would stifle the data generation needed to improve the procedure.

  **Predicted Failure Mode After One Year:**
  **"The Valence Gaming"**: Applicants will begin to design habitats that maximise the *appearance* of stable K-strategist populations (e.g., planting fruiting trees for badgers) without ensuring long-term carrying capacity, knowing the procedure weights stable species higher. This will lead to "Welfare Washing," where sites look good on paper in Year 1 but collapse into high-suffering sinks by Year 5. The procedure lacks a long-term audit mechanism to verify the 10-year trajectory assumptions made in Step 1.

  Step 3 (Life History and Valence) does most of the deciding work by forcing a trade-off between population size and individual quality of life.
  \answer{1}
