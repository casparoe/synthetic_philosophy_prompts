  **MEMORANDUM**

  **TO:** The Board of Directors, National Guild of Published Fiction Writers
  **FROM:** [Your Name], Board Member
  **DATE:** October 10
  **SUBJECT:** Decision Recommendation: Question 3 and the Halberd Bequest

  **RECOMMENDATION**

  We have two votes before us in twelve days. To stop talking past one another, we need to make them together, based on a single principle.

  1.  **Endorse Question 3 ("Clean Voices").** We should publicly support the amendment and authorize our political committee to run ads in favor of it.
  2.  **Decline the Halberd Bequest.** We should respectfully return the $1.5 million offer from the widow of the Halberd Public Affairs founder.

  We cannot argue for a cleaner political marketplace while accepting a endowment from a firm that made its fortune dirtying it. We must choose public amplification over private patronage.

  **WHY WE ARE TALKING PAST EACH OTHER**

  For two months, we have been stuck because we are using the word "corruption" to mean three different things. When we say money corrupts politics, we are usually describing one of these three distinct mechanics:

  1.  **Reach:** This is amplification. Money buys ads, mailers, and social media boosts. It determines how many people hear a view.
  2.  **Access:** This is attention. A legislator has only so many hours in a day. Money buys the phone call returned, the meeting granted, and the ear bent. This is a "rival good"—if a lobbyist has the hour, a constituent does not.
  3.  **Agenda:** This is scope. Money determines which questions are asked in the first place. Nobody is silenced, but some truths are never discussed because no one funded the study or the campaign to raise them.

  We need to agree on which of these is the real problem, and which one Question 3 actually solves.

  **THE WEIGHT OF THE CASE**

  In our view, **Access** is the deepest corruption. When policy is sold to the highest bidder for time and attention, representation breaks. **Agenda** is the second deepest; it shapes reality before we even vote. **Reach** is important, but superficial; you can shout into the void if no one in power is listening.

  Question 3 does not fix Access. A billionaire can still opt out of the system, spend unlimited funds, and buy all the access they want. It does not fix Agenda. Wealthy interests will still decide which topics dominate the news cycle.

  Question 3 only fixes **Reach**. It takes the first $100 of ordinary citizens and makes it worth $600 to a candidate. It levels the megaphone, not the meeting room.

  So why endorse it? Because while Access and Agenda are the more serious harms, they are also the hardest to fix without violating rights. We cannot cap spending without silencing speech. We cannot force officials to listen to everyone equally. But we *can* subsidize the small donor. Question 3 is not a cure for the disease of money in politics; it is a treatment for the symptom of inequality. It is the only lever we can pull without breaking the machine.

  **THE HALBERD BEQUEST**

  This brings us to the $1.5 million. Halberd Public Affairs made its money by mastering Access and Agenda. They ran independent-expenditure campaigns for energy clients. They bought the attention of officials and set the terms of the debate.

  Some argue that taking the money is "ordinary fungibility." They say: *The money is unrestricted. It frees up our other funds to support Question 3. We are using their money to fight their influence.*

  This is logically sound but morally incoherent. If we endorse Question 3, we are stating that political influence should not be for sale to the highest bidder. If we simultaneously accept an endowment from a firm that exists to sell political influence to the highest bidder, we invalidate our own stance. It does not matter if the funds are legally segregated. To the public, and to our own conscience, it looks like we are selling our endorsement. We cannot fight the purchase of Access with the proceeds of Access.

  **THE HARDEST ARGUMENT (AND WHY WE TAKE THE RISK)**

  I know many of you are hesitant to endorse Question 3. You are writers. Your livelihood depends on the free market of ideas. You fear that if we endorse state management of political spending, we invite the state to manage *all* speech.

  This is the strongest argument against our recommendation, and it must be stated clearly: **An organization of writers is the last body that should endorse the state deciding which political speech is worthy of subsidy.**

  The fear is not hypothetical. The power the state uses to match a small donor's $100 is the same power it could use to decide which publishers get tax breaks, which festivals get grants, or which op-eds are deemed "publicly valuable." If we invite the state into the business of funding speech, we risk giving it the authority to defund speech it dislikes. A billionaire's megaphone is dangerous, but a government clerk with a budget is potentially tyrannical. We should be the first to resist the state becoming the editor of our democracy.

  I believe this fear is valid. It is the reason we must be precise. We are not endorsing state *control* of speech; we are endorsing state *amplification* of citizens. Question 3 is voluntary for candidates. It does not cap outside spending. It does not tell anyone what they can say. It simply adds weight to the small donor.

  We are taking a risk. We are betting that a little bit of state involvement in funding can protect democracy without threatening liberty. It is a gamble. But the alternative—allowing Access and Agenda to be wholly owned by private capital—is a surrender we cannot afford.

  **NEXT STEPS**

  We have twelve days. Here is the schedule required to execute this decision:

  *   **October 14 (Monday):** Executive Director sends formal letter to the Halberd estate declining the bequest. The language must be grateful but firm, citing our mission alignment rather than legal concerns.
  *   **October 15 (Tuesday):** Board vote on this memo. We need a simple majority to adopt this position.
  *   **October 16 (Wednesday):** Press release issued regarding Question 3 endorsement. We frame this strictly around *Reach* and *Voice*, avoiding claims about fixing corruption broadly.
  *   **October 22 (Tuesday):** Final vote on Question 3.

  **CLOSING**

  We are tired. We are volunteers. We would rather be writing than debating campaign finance mechanics. But we are a guild of writers. We know that being heard is not just about having something to say; it is about having the means to say it.

  Question 3 offers a way to give those means to more people. The Halberd money offers a way to secure our own means at the cost of our credibility. We should choose the path that keeps our voice our own.

  Please read this before Thursday night. Let's vote, clear our plates, and get back to the work.
