      *   *Overall:* The claim is "Count is *better* than Mass," not "Count is *perfect*."
      *   *Verdict:* I'm higher than the user (0.6). I think the empirical case (birds/elephants) is devastating for Brain Mass. I'm lower than the 0.9 friend (who ignores the architecture/dish problem).
