answer: |-
  Here are 7 sharp, non-generic questions tailored to Dr. K's specific framework on genuine moral dilemmas. I've structured the follow-ups so you know exactly when to deploy them based on how she answers.

  **1. The Ought-Implies-Can Challenge**
  "The classic principle in ethics is 'Ought Implies Can.' If you're saying I genuinely ought to do A and genuinely ought to do B, but physics says I can't do both, aren't you forcing me to accept that I ought to do the impossible? How do you keep that principle from collapsing?"

  **2. Follow-up (If she says only *pro-tanto* oughts survive)**
  "Okay, but if only the *pro-tanto* oughts survive the conflict, isn't that just semantic sleight of hand? At what point does an 'ought' become robust enough to trigger Ought-Implies-Can? If it doesn't imply 'can,' are we still talking about obligations, or just really strong reasons?"

  **3. Moral Residue and Blame**
  "Let's talk about the aftermath. I'm in a genuine dilemma, I pick A, and I violate B. Is there moral residue there? Am I blameworthy for failing B, or does the existence of the dilemma itself act as an excuse?"

  **4. Follow-up (If she says blame is inappropriate because it's unavoidable)**
  "If you say blame is inappropriate because the violation was unavoidable, doesn't that deflate the obligation? If I can't be held accountable for violating it, is it really a binding requirement, or just a tragic preference we wish we could meet?"

  **5. Scaling to Collective Agents**
  "I want to scale this up. Think about a state that ought to honor a climate treaty and ought to prevent economic collapse, but can't fully do both. Does your framework allow a nation to be in a genuine collective moral dilemma? Or do you have to dissolve that into a failure of institutional design?"

  **6. The Mistake Theory Objection**
  "Critics might argue you're solving this by redefining terms. Why isn't your view just a mistake theory? People *think* there's a dilemma because they confuse *pro-tanto* obligations with all-things-considered verdicts. Why are their intuitions wrong and your distinction right?"

  **7. Falsifiability and Evidence**
  "You tend to dismiss critics for smuggling in aggregation assumptions. So I want to know what counts as evidence for you. What thought experiment or real-world case would actually move you off this position? What would prove you wrong?"
