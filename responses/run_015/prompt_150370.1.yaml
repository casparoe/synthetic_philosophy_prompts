      *   *C3 (Realist Achievement Value):* We value that a *person* did something difficult. It's a record of a mind solving a problem. Not just snobbery.
      *   *C4 (Readymades/Causal History):* Labour/craft isn't the value source (Duchamp), but causal history *is* relevant (conceptual achievement).
      *   *C5 (Aesthetic Supervenience):* Perceptually indistinguishable objects = same aesthetic value. Provenance leakage is a bias (like authentic replicas).
      *   *C6 (Methodological Discipline):* Try to ignore provenance/label. Track the object. Treat provenance-care as status consumption.
