      *(Refining the "Internal Fragmentation" point)*: Neutrality requires the agent to have a "comprehensive doctrine." If humans don't have one, the AI has to construct one for them to check it against "reasonableness." That's invasive. Aggregation just takes the fragments as inputs.

      *(Refining the "AI Patient" point)*: If the AI is a patient, Neutrality requires the AI to be neutral *to itself*? That's paradoxical. Aggregation just gives it a weight.

