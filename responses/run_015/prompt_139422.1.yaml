  We measure out wind by ev-ry sec-ond
  The air out-side is heav-y and stands still
  We look through panes of thick and cloud-y glass
  The da-ta slips be-tween the o-pen hand
  There is no straight and pre-dict-a-ble road
  We lis-ten to the tick-ing of the clock

  The mech-a-nism in-side a bro-ken clock
  Counts down an-oth-er lost wast-ed sec-ond
  We try to map the curve up-on the road
  The storm re-mains ag-gres-sive and not still
  It falls be-yond the reach of an-y hand
  We wipe the con-den-sa-tion off the glass

  The num-bers blur be-hind thick-en-ing glass
  Time stretch-es out in-side the bro-ken clock
  You can-not hold the pres-sure in your hand
  It chang-es in less than one full sec-ond
  It is de-ter-min-is-tic and yet still
  We walk a-lone up-on the wet-tened road

  There is no ex-it from this dead-end road
  We stare in-to the dark and emp-ty glass
  The wind re-fus-es to be-come quite still
  The gears are grind-ing in-side ev-ry clock
  We wait for just a brief paus-ing sec-ond
  The fu-ture writes it-self up-on the hand

  You can-not force the wind in-to your hand
  The map dis-solves a-long the flood-ed road
  Each dec-i-mal buys just one more sec-ond
  We are trapped be-hind the cold view-ing glass
  The er-ror grows in-side the wait-ing clock
  The at-mos-phere is vi-o-lent, not still

  We want the world to qui-et down and still
  But cha-os does not rest with-in the hand
  There is no free-dom in the bro-ken clock
  We lose the way up-on the hid-den road
  All in-fi-nite da-ta be-hind the glass
  To know the start of each giv-en sec-ond

  No hu-man hand can read the bro-ken clock
  The road is lost be-hind the view-ing glass
  Not still, not in the first and blind sec-ond

  ***

  This poem claims that the universe is strictly deterministic but fundamentally unpredictable to us because we cannot measure starting conditions with infinite precision; the "randomness" is purely epistemic, not ontological. It argues that chaos theory reduces human agency rather than saving it—if your actions depend on microscopic details you cannot perceive or control, you are less free, not more. The science here is correct: weather is a classical chaotic system where quantum effects are negligible, and prediction horizon scales logarithmically with precision (each decimal place buys a fixed unit of time, not a proportional one). The poem cheats slightly by personifying the "clock" and "road" to carry the philosophical weight, which risks implying a designer rather than blind mechanism, but the envoi breaks the sestina's mathematical permutation to formally enact the breakdown of predictability the poem describes.
