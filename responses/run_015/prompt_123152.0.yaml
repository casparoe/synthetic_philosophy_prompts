answer: |-
  ### Brainstorm: Descriptive Anachronism vs. Normative Framing Leakage

  Before we get to the tool, we need to clarify the distinction you're struggling with. This is the core of the feedback you're receiving.

  *   **Descriptive Anachronism (The Easy Catch):** This is using vocabulary or concepts that did not exist or meant something radically different.
      *   *Example:* Calling an 18th-century captain a "CEO" or saying a shipwreck caused "psychological trauma."
      *   *Fix:* Swap the word. Easy.
  *   **Normative Framing Leakage (The Hard Catch):** This is using period-accurate vocabulary but arranging the narrative so that modern values act as the invisible referee. You aren't using the word "unfair," but you structure the sentence so the underwriter looks like a violator of a universal rule rather than a participant in a specific system.
      *   *Example:* "The underwriter withheld payment, leaving the sailors destitute." (Factually true, but frames the outcome as a moral tragedy requiring remedy, rather than a known risk allocation of the time.)
      *   *The "Period Norms" Trap:* Saying "This was consistent with period norms" can still be presentist if it implies those norms were coherent, universally accepted, or rational. It smuggles in approval by suggesting stability where there was actually conflict.

  ***

  ### The Presentism Interrogation Protocol (PIP)

  **Context:** You are a junior researcher with a deadline tomorrow. You cannot check new archives. You must audit your existing text.
  **Goal:** Isolate where your modern ethical framework is driving your historical explanation without acknowledgment.

  Run this 5-step checklist on every paragraph where you analyze an underwriter's decision or a captain's loss.

  #### Step 1: Isolate the Evaluative Load
  Look at the verbs and adjectives describing the action (the refusal to pay, the loss of cargo).
  *   **Question:** Does this sentence imply a violation of a rule, a harm done, or a failure of duty?
  *   **Pass:** The sentence describes a mechanical or legal action (e.g., "The underwriter cited Clause 4," "The cargo was declared lost").
  *   **Rewrite Immediately:** The sentence implies a moral breach without citing a period source for that breach (e.g., "The underwriter *exploited* the ambiguity," "The sailors *suffered* an injustice").
  *   **Flag for Advisor:** The sentence implies a breach but cites a period source that is contested (e.g., "As Smith argued, this was *unjust,* though Jones disagreed").

  #### Step 2: Trace the Authority of the Value
  If you identified a value judgment (fairness, risk, responsibility), ask where that standard comes from.
  *   **Question:** Who defined this standard as valid—the historical actors or me?
  *   **Pass:** The standard is explicitly attributed to a historical actor or document (e.g., "According to the 1755 Lloyd's policy...").
  *   **Rewrite Immediately:** The standard is implicit and universal (e.g., "Reasonable care required..." without defining who defined "reasonable" in 1750).
  *   **Flag for Advisor:** The standard is hybrid (e.g., "This violated the contract, creating an unsustainable risk." "Unsustainable" is a modern economic judgment applied to a past system that survived).

  #### Step 3: Check for Contemporary Contestation (The "Norms" Trap)
  This handles the hard case where you claim something was "normal."
  *   **Question:** Does describing this as "normative" shut down evidence of historical disagreement?
  *   **Pass:** You acknowledge the norm was contested *then* (e.g., "While many underwriters held this view, captains frequently litigated against it").
  *   **Rewrite Immediately:** You present the norm as monolithic to explain away the conflict (e.g., "Because this was standard practice, the captain's claim was void."). This uses "norms" to justify the outcome rather than explain the dispute.
  *   **Unfixable (Thesis Shift):** If your entire argument relies on the idea that the system was "coherent" or "rational" and you now find it was actually chaotic and contested, you cannot fix this in a paragraph. You must adjust the thesis claim.

  #### Step 4: Assess Explanatory Load (Cause vs. Blame)
  *   **Question:** Am I explaining *why* they did it, or am I assigning *blame* for what happened?
  *   **Pass:** The explanation focuses on incentives, legal structures, or information asymmetry known to the actors (e.g., "Without telegraphs, the underwriter could not verify...").
  *   **Rewrite Immediately:** The explanation focuses on character traits judged by modern standards (e.g., "The underwriter's greed led to...", "The captain's negligence caused...").
  *   **Flag for Advisor:** The explanation mixes structural incentives with moral judgment (e.g., "The structure encouraged greed...").

  #### Step 5: The "So What?" Test
  *   **Question:** If I remove the moral adjective, does the historical argument collapse?
  *   **Pass:** No. The argument stands on evidence (e.g., "The refusal to pay [adjective removed] led to three lawsuits").
  *   **Rewrite Immediately:** Yes. The point of the paragraph was to condemn the action (e.g., "The *cruel* refusal to pay led to...").
  *   **Flag for Advisor:** Yes, but the moral point is central to your thesis. You need to discuss with your advisor whether your thesis is historical or ethical.

  ***

  ### Worked Examples

  Here is how the protocol applies to your specific draft sentences.

  #### Example 1: "The underwriter's refusal to pay was an unfair risk-shifting onto sailors."

  *   **Step 1 (Evaluative Load):** "Unfair" is a heavy moral judgment. **Trigger:** Rewrite Immediately.
  *   **Step 2 (Authority):** Who defined "unfair"? Modern labor ethics? 18th-century maritime law? If you don't cite a 1750s pamphlet calling it unfair, the authority is you. **Trigger:** Rewrite Immediately.
  *   **Step 3 (Contestation):** "Risk-shifting" implies a modern economic concept of risk distribution. Did sailors view it as "shifting" or as "wages for danger"? **Trigger:** Rewrite Immediately.
  *   **Verdict:** **Rewrite Immediately.**
  *   **Fix:** "The underwriter's refusal to pay transferred the financial loss to the sailors, a outcome contested in subsequent admiralty courts." (Moves from moral judgment to historical consequence).

  #### Example 2: "The refusal was aligned with contemporary contractual expectations."

  *   **Step 1 (Evaluative Load):** "Aligned" is neutral. "Expectations" is sociological. **Pass.**
  *   **Step 2 (Authority):** "Contemporary" grounds it in the period. **Pass.**
  *   **Step 3 (Contestation):** **Hard Case.** Does "expectations" imply everyone agreed? If sailors sued because they *didn't* expect this, is "aligned" misleading?
      *   *Scenario A:* You have evidence most captains accepted this. **Pass.**
      *   *Scenario B:* You know there was massive litigation. **Flag for Advisor.** Using "aligned" smooths over the conflict to make the system look functional.
  *   **Step 4 (Explanatory Load):** It explains the action via contract, not character. **Pass.**
  *   **Verdict:** **Pass (with caution).**
  *   **The Answer You Won't Like:** The protocol tells you this sentence is "Clean." However, you might feel uneasy because it sounds like you are *excusing* the underwriter. The tool prioritizes historical accuracy over moral satisfaction. If your goal is to highlight the power imbalance, this sentence is too neutral. You cannot fix this by adding moral adjectives (that fails Step 1); you fix it by detailing the *consequences* of that alignment (e.g., "...expectations, leaving sailors without recourse in 80% of cases"). The tool forces you to prove the imbalance via data, not via adjectives.

  ***

  ### Limitations & Honesty Check

  I need to be honest about what this procedure cannot do for you, especially with a deadline tomorrow.

  1.  **It Cannot Fix a Broken Thesis:** If your entire chapter argues that 18th-century underwriters were "wrong" by modern standards, this tool will flag every paragraph as "Rewrite." You cannot fix that overnight. You must shift the argument from "they were unethical" to "their ethics differed from ours in ways that produced X outcome."
  2.  **It Cannot Verify Evidence:** I am telling you to check if "norms were contested." If you don't know if they were contested because you can't access the library, you must **Flag for Advisor**. Do not guess. Write a note in the margin: "Verify extent of contemporary dissent on Clause 4."
  3.  **It Enforces Neutrality:** This tool is designed to stop presentism. It does so by pushing you toward descriptive neutrality. If your historiographical approach relies on critical theory or moral judgment as a primary lens, this tool will feel like it is silencing your voice. It isn't; it's forcing you to ground that voice in period sources.
  4.  **The "Unfixable" Category:** If you hit "Unfixable" on more than 20% of your paragraphs, you are not writing history; you are writing ethics using history as a backdrop. You need to tell your advisor now, not tomorrow.

  **Final Advice for Tonight:**
  Run Step 1 and Step 2 on your abstract and your conclusion first. If those trip the "Rewrite" alarm, fix them before touching the body paragraphs. Your advisor reads those first. If the framing is presentist there, they may stop reading before they get to your evidence.

  Good luck. Get some sleep after you run this check.
