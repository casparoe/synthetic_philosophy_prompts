answer: |-
  Here is the examination material, designed to meet your constraints: it requires no external citation, relies on the logic of the vignette rather than memorised names, and provides a marking scheme grounded in textual evidence you can spot as a non-philosopher.

  ### (a) The Examination Question

  **Question 1** (25 marks)
  **Time allowed: 45 minutes**

  Consider the claim that the macro-level theory $E$ is *reduced* to the micro-level theory $M$. This claim is often understood to involve three distinct components:
  1.  **Derivability:** $E$ can be logically derived from $M$.
  2.  **Explanatory Power:** $M$ explains why $E$ holds and why its parameters take the values they do.
  3.  **Ontological Dependence:** $E$ describes nothing over and above the systems described by $M$.

  Using the details provided in the vignette (points i–iv), critically evaluate whether $M$ successfully reduces $E$. In your answer, you must address:
  *   The status of the derivation given the origin and role of auxiliary assumption $A$.
  *   The significance of the universality of the coefficient $\kappa$ across different micro-structures.
  *   Whether the computational intractability described in (iv) undermines the reduction.

  Conclude by stating whether $E$ should be viewed as an autonomous theory or merely a convenient shorthand for $M$.

  ***

  ### (b) Model Answer

  **Candidate Script**

  To evaluate whether $M$ reduces $E$, we must distinguish between the systems themselves (ontology) and our ability to describe them (epistemology). The vignette presents a case where ontological dependence is clear, but derivational and explanatory reduction are compromised.

  First, consider derivability. A strict reduction requires that the macro-laws follow from the micro-laws plus boundary conditions. Here, the derivation of $E$ from $M$ requires auxiliary assumption $A$. Crucially, $A$ is not derived from $M$; it was arrived at by assuming $E$ and working backwards. This makes the derivation circular. It demonstrates that $M$ is *consistent* with $E$, but it does not show that $M$ *yields* $E$ independently. If $A$ is only known to be true because $E$ is true, then using $A$ to derive $E$ from $M$ is a consistency proof, not a foundational reduction. It shows that $M$ does not forbid $E$, but it does not prove $M$ necessitates $E$. Therefore, on the criterion of derivability, the reduction fails.

  Second, consider explanatory power, specifically regarding the coefficient $\kappa$. Point (ii) states that $\kappa$ is universal across systems with different particle masses and pair potentials, depending only on broad features like dimensionality and conservation laws. If $E$ were reduced to $M$ in a straightforward way, we would expect $\kappa$ to depend sensitively on the specific micro-details (the specific potential). The fact that it does not suggests that the micro-details are irrelevant to the macro-behaviour. While $M$ can technically account for this (by showing that different potentials wash out), the explanation for the value of $\kappa$ lies in the shared symmetries, not the specific micro-constitution. This implies a form of autonomy for $E$: the macro-theory tracks features of the world that are stable across changes in the micro-theory. $M$ explains the *stability*, but $E$ captures the *pattern* more directly. Thus, $M$ explains $E$ only in a weak sense; $E$ explains the data better by ignoring the noise of the micro-level.

  Third, regarding computational intractability (iv). The fact that computing $\kappa$ from $M$ is exponentially hard is an epistemic limitation, not an ontological one. In principle, the information is in $M$; in practice, it is inaccessible. Does this undermine reduction? If reduction is an ontological claim (that the macro-system *is* just the micro-systems), then computational cost is irrelevant; the reduction holds regardless of our ability to calculate it. However, if reduction is an epistemological claim (that we can replace $E$ with $M$ for prediction and understanding), then the intractability matters. Since we cannot use $M$ to predict the density field without essentially simulating the whole box, $E$ remains indispensable for prediction. $M$ cannot functionally replace $E$.

  Finally, on ontological dependence. There is no evidence in the vignette of "new stuff" appearing at the macro-level. The particles are classical and obey Newtonian dynamics. $E$ describes a coarse-grained density of these particles. There is no reason to believe $E$ refers to entities that do not supervene on the particles. So, ontologically, $E$ is likely nothing over and above $M$.

  **Conclusion:** $M$ and $E$ stand in a relation of ontological dependence but explanatory and derivational autonomy. $E$ is not "nothing over and above" $M$ in terms of entities, but it is something over and above $M$ in terms of information structure and utility. The circularity of $A$ prevents $M$ from grounding $E$ logically, and the universality of $\kappa$ suggests $E$ captures robust patterns that $M$ obscures. $E$ should be viewed as an autonomous theory that is consistent with $M$, rather than a shorthand derived from it.

  ***

  ### (c) Marking Scheme

  **Total Marks: 25**
  **Pass Mark: 13**

  This scheme rewards *application* of concepts to the vignette. Do not reward the mere mention of philosophical terminology (e.g., "supervenience", "bridge laws") unless it is used to analyse the specific details of $A$, $\kappa$, or the computation.

  **1. Analysis of Assumption $A$ (Derivability)** [5 marks]
  *   **5:** Identifies that the derivation is circular/bootstrapped. Notes that $A$ was inferred *from* $E$, so using it to derive $E$ from $M$ proves consistency, not logical necessity.
  *   **3:** Notes that $A$ is an extra assumption not in $M$, weakening the derivation, but misses the circularity aspect.
  *   **0:** Claims the derivation is successful because the literature says so, or ignores $A$ entirely.
  *   *Common Error:* Treating $A$ as a standard "bridge law" without noting its provenance (working backwards from $E$).

  **2. Analysis of Coefficient $\kappa$ (Explanatory Power)** [5 marks]
  *   **5:** Discusses the universality of $\kappa$. Argues that because micro-details (potential, mass) vary while $\kappa$ stays fixed, the macro-behaviour is insensitive to micro-constitution. This grants $E$ explanatory autonomy.
  *   **3:** Notes that $\kappa$ is constant but fails to connect this to the irrelevance of micro-details or the autonomy of $E$.
  *   **0:** Claims $M$ explains $\kappa$ fully because $M$ contains all the particles, ignoring the insensitivity to specific potentials.
  *   *Common Error:* Confusing the constancy of $\kappa$ with experimental error, rather than a structural feature of the systems.

  **3. Analysis of Computational Intractability (Epistemic vs. Ontic)** [5 marks]
  *   **5:** Distinguishes between principle (ontological) and practice (epistemic). Argues that intractability blocks *functional* replacement of $E$ by $M$, even if $M$ is fundamentally sufficient.
  *   **3:** States that computation is hard so $M$ is useless, without distinguishing principle from practice.
  *   **0:** Claims that because it is hard, $M$ is false or $E$ is fundamentally separate (dualism).
  *   *Common Error:* Arguing that computational difficulty proves $E$ is ontologically distinct from $M$.

  **4. Distinction between Ontology and Epistemology** [5 marks]
  *   **5:** Clearly separates the question of what exists (particles/density) from the question of how we derive/predict (equations/computation). Concludes that reduction might hold in one sense but not the other.
  *   **3:** Uses the distinction but applies it vaguely to the whole problem.
  *   **0:** Treats reduction as a single all-or-nothing property.
  *   *Common Error:* Conflating "we can't calculate it" with "it isn't determined by the micro-state."

  **5. Final Verdict and Synthesis** [5 marks]
  *   **5:** Provides a nuanced conclusion (e.g., "Ontologically dependent but explanatorily autonomous"). Consistent with the arguments made in sections 1–4.
  *   **3:** Provides a conclusion that is somewhat supported by the text but ignores one of the major constraints (e.g., ignores the circularity of $A$).
  *   **0:** Simply repeats the prompt or gives an unsupported "Yes/No".
  *   *Common Error:* A "Yes" verdict that ignores the circularity of $A$, or a "No" verdict that claims new magic forces exist at the macro level.

  **Note on the Competent-but-Second-Class Answer (15–18 marks):**
  This script will likely use the correct vocabulary (e.g., "multiple realizability," "deductive-nomological," "supervenience"). It will correctly identify that $A$ is an assumption and that computation is hard. However, it will treat the vignette as a generic example to hang these labels on.
  *   **How to spot it:** The student writes, "This is a case of multiple realizability because $\kappa$ is the same," but does not explain *why* that challenges the derivation from $M$. They will say "$A$ is a bridge law" without penalizing the fact that $A$ was cooked up from $E$. They get the theory right but fail to let the specific logic of the vignette bite into the argument. They describe the *concepts* rather than solving the *problem*.
