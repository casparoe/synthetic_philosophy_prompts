  6.  (Self-Correction during drafting): I should mention that Axelrod himself admits the communication aspect is a deviation from strict IPD but argues the *logic of reciprocity* remains the core driver. I need to make sure I don't dismiss the friend's "human decency" point entirely—game theory doesn't negate humanity, it channels it.

  7.  **Final Polish:** Check for clarity and flow. Ensure the distinction between the *emergence* of cooperation (IPD strong) and the *maintenance/breakdown* (Institutional theory strong) is clear.

