      *   *Key Insight:* The "Live-and-Let-Live" system wasn't peace; it was *managed violence*. That fits IPD well (mutual defection is the baseline, cooperation is the deviation).
      *   *Self-Correction on Payoffs:* In standard PD, Defecting is dominant. In the trenches, "Defecting" (killing) invites retaliation. So the "Temptation" payoff is actually risky. The real payoff is *survival*. I need to make sure the payoff matrix reflects that mutual cooperation (survival) is better than mutual defection (attrition).

