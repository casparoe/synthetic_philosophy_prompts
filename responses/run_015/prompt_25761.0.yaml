          *   Critique of the model: Does IPD capture norm formation/communication? Does the high command's intervention validate or invalidate the model?
          *   Goal: Determine if the model illuminates the phenomenon or just dresses it up in math.

  2.  **Initial Knowledge Retrieval & Structuring:**

