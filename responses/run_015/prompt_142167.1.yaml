      *   **Student Comment:** "It's about fake news." (User thinks this is right but useless).
      *   **User's Apparatus:** Three conditions for legend $\to$ history:
          1.  *Last-witness condition:* No one alive to contradict.
          2.  *Uptake condition:* Institutions route decisions through it (consequentiality).
          3.  *Anchoring condition:* A fixed particular (name/event) exists to attach inquiry to, even if details are false.
      *   **The "Doniphon Problem":** Doniphon knows the truth, sacrifices himself for the "lie," and the result is genuinely good (statehood, order). Is founding on a known falsehood fine, corrupting, or just *what founding is*? Does this apply equally to Exodus/Troy/Arthur?
      *   **The Crucial Request:** Where does the film *resist* this reading? Where is it just a Western/tragedy and not an allegory? Don't force the allegory if it breaks the film.
      *   **Formatting Requirements:** End with a one-sentence bottom line for the seminar. End with `\answer{...}` naming the vindicated condition (or `none`) + a clause on the Doniphon problem's applicability to founding vs. event legends.

  2.  **Deconstruct the Film vs. The Apparatus:**

      *   *Condition 1 (Last-witness):* The film explicitly contradicts this. Doniphon *is* alive. He tells the truth to the reporter. The editor *chooses* to ignore the living witness. So, the film argues that the transition happens *despite* the existence of contradicting evidence, not because it's gone. This condition is weak in the film's logic.
      *   *Condition 2 (Uptake):* This is strong. The statehood, the railroad, the political career—all depend on the Stoddard myth. The "consequences" are real. The legend *functions* as history because the polity treats it as such.
      *   *Condition 3 (Anchoring):* This is tricky. There *was* a shooting. There *was* a death. The anchor (Valance is dead, Stoddard stood in the street) exists, but the causal link is false. Is "Stoddard shot Valance" the anchor, or "Valance died in Shinbone"? The film suggests the *story* anchors the politics, not necessarily the physical fact. But without the body, there's no story. So there's a partial anchor.

      *   *The Doniphon Problem:* This is the ethical core. Ford doesn't shy away from the cost. Doniphon is destroyed. The "good" society is built on his erasure. Is it "fine"? The film is ambivalent. It mourns Doniphon (the cactus rose, the coffin) while acknowledging the necessity of the "civilized" order Stoddard represents. It's not "fine," it's "tragic necessity."

      *   *Resistance/Where the Reading Breaks:*
          *   **Genre:** It's a Western about masculinity and civilization. Pressing the "legend/history" epistemological question too hard might ignore the *emotional* truth of Doniphon's loss.
          *   **The Ending:** The editor says "Print the legend." This is a pragmatic instruction, not an ontological claim. The film doesn't necessarily say the legend *is* history, but that it *serves* as history for the public.
          *   **Hallie:** She knows (or suspects). Her choice to stay with Stoddard is a choice for the legend/civilization over the truth/wilderness. This complicates the "founding" aspect; it's also domestic.
          *   **The "Fake News" Student:** The student isn't entirely wrong, but "fake news" implies malicious deception for power. Stoddard doesn't seek the power via the lie; it's thrust upon him. Doniphon gives it to him. It's more about *myth-making* than *disinformation*.

  3.  **Drafting the Response:**

      *   *Acknowledge the Student:* Validate but refine. "Fake news" implies intent to deceive for gain. Stoddard is reluctant. It's about *social utility* of myth, not just falsehood.
      *   *Evaluate the Conditions:*
          *   (1) Last-witness: Film refutes this. Witness exists, is ignored.
          *   (2) Uptake: Film supports this strongly. The legend works because institutions use it.
          *   (3) Anchoring: Film complicates this. The anchor is the *outcome* (Valance dead), not the *agent*.
      *   *The Doniphon Problem:* It's not that it's "fine." It's that civilization requires the suppression of the violent truth that founded it. The cost is real (Doniphon). The benefit is real (Statehood). It's a tragedy, not a justification.
      *   *Applicability to Seminar Cases:*
          *   Exodus (Founding): Fits well. Nation built on narrative.
          *   Troy (Event): Fits less well. No polity founded *on* the Iliad in the same way.
          *   Arthur (Accretion): Fits the "uptake" condition (kingship legitimacy) but less the "sacrifice" aspect.
      *   *Resistance/Critique:* Where does the film push back?
