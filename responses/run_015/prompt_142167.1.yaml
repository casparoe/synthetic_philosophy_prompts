          *   Doniphon's funeral scene is about personal loss, not political theory.
          *   If you treat it *only* as an allegory for historiography, you miss the Western genre conventions (the gun, the code, the garden).
          *   The "Print the legend" line is cynical, not authoritative. The editor is a hack. His verdict isn't the film's moral verdict.
      *   *Refining the "Bottom Line":* Needs to be punchy for 18-year-olds.
      *   *Refining the `\answer` tag:* Must follow specific format.

  4.  **Iterating on the "Resistance" Section (Crucial Step):**
      *   I need to make sure I don't just say "It works." I need to say where it *fails* as an allegory.
      *   *Point 1:* The film is emotionally weighted toward Doniphon. If the legend is "good," why is the truth-teller the tragic hero? The film resists the idea that the legend is *better*, only that it is *useful*.
      *   *Point 2:* The "Uptake" condition implies the legend becomes history because it works. But the film shows the legend is a *cover-up*. History (the reporter's notes) is actively destroyed. This suggests legend and history remain distinct, even if legend is printed. The film distinguishes them; your apparatus asks when they become the same. The film says they *don't*, we just pretend they do.
      *   *Point 3:* The "Anchoring" condition. In Troy/Exodus, we don't have a Doniphon. We don't have a witness saying "I know this is fake." The film relies on *ironic knowledge* (we know the truth). In the seminar cases, we *don't* know the truth. The film presupposes access to the truth to make its point. This is a major disanalogy for Troy/Exodus.

  5.  **Finalizing the Argument:**
      *   The film supports **Uptake** (consequences make it real).
      *   It refutes **Last-Witness** (witness exists, ignored).
      *   It complicates **Anchoring** (anchor is the death, not the shooter).
      *   The Doniphon Problem: Founding requires sacrifice of the truth-teller. This applies to Exodus (Moses doesn't enter? Or the generation dies?), less to Troy (no polity founded), less to Arthur (legitimacy vs. founding).
      *   *Correction on Doniphon Problem:* The prompt asks if the answer has the same shape for founding (Exodus) vs event (Troy) vs accretion (Arthur).
      *   My take: The film is specifically about *founding* (Statehood). It doesn't map cleanly to Troy (an event remembered) or Arthur (a figure accreted). The "cost" is specific to political founding.

  6.  **Drafting the Conclusion:**
      *   *Bottom Line:* "History is what we agree to remember; legend is what we agree to live by." (A bit cliché).
      *   *Better:* "The film argues that history becomes legend not when the truth disappears, but when the lie becomes useful enough to sustain a society."
      *   *Best (for students):* "This film suggests history isn't about what happened, but about what story a community needs to survive."
      *   *Wait, need to address the "Doniphon Problem" in the final line too.*
