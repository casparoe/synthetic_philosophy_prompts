answer: |-
  The student who called it "fake news" has identified the mechanism but missed the teleology. "Fake news" implies a lie told to seize power for its own sake; Stoddard's legend is a lie accepted to *secure* a polity he didn't seek. The distinction matters for your seminar: fake news is parasitic on the truth, whereas the legend in *Liberty Valance* is structural. It doesn't just distort the record; it builds the railroad.

  Here is how the film interacts with your apparatus, where it resists you, and how to handle the Doniphon problem.

  ### 1. Evaluating the Conditions
  **(1) The Last-Witness Condition:** The film explicitly **refutes** this. Doniphon is alive. He speaks. He writes (via the reporter). The transition from truth to legend happens *despite* the witness, not because he is gone. The editor burns the notes *knowing* the witness exists. This tells your students that the legend/history shift is an active choice by the record-keepers, not a passive result of time erasing evidence.

  **(2) The Uptake Condition:** The film **vindicates** this. The legend becomes "history" because the statehood commission, the railroad, and the electorate route their decisions through it. Stoddard becomes Senator *because* of the story, and the territory becomes a state *because* of Stoddard. The legend acquires the causal power of fact. This is the strongest lever for your seminar: history is not what happened, but what functions as the operating system for the community.

  **(3) The Anchoring Condition:** The film **complicates** this. There is an anchor (Valance is dead; a shot was fired), but the causal link is severed. However, the film suggests the anchor isn't the physical event, but the *public perception* of the event. For your seminar cases, this is crucial: Troy has an anchor (ruins), Arthur has an anchor (post-Roman warlords), Exodus has... what? The film suggests the anchor might be the *need* for the story, not the physical remnant.

  ### 2. The Doniphon Problem
  The film does not say founding on a known falsehood is "fine." It says it is **tragic**. Ford frames Doniphon's erasure as a genuine sacrifice, not a tidy transaction. The burning of the house and the lonely funeral are not footnotes; they are the moral cost of the "civilized" order.

  *   **Is it fine?** No. The film mourns Doniphon relentlessly.
  *   **Is it worth it?** The film is ambivalent. We get the railroad and the rule of law, but we lose the man who made them possible.
  *   **Does founding *just* manufacture legend?** The film suggests founding requires the *substitution* of the usable myth for the violent truth. The violence (Doniphon's shot) is real, but it cannot be the public foundation.

  **Applicability to your cases:**
  *   **Exodus (Founding):** The shape fits. A polity is founded on a narrative that requires the suppression of alternative accounts (e.g., the archaeological silence, the internal biblical contradictions). The "cost" is the historical ambiguity.
  *   **Troy (Event):** The shape does *not* fit. No polity was founded on the *Iliad*. The legend accretes, but there is no "Doniphon" sacrificed for the sake of Greek statehood.
  *   **Arthur (Accretion):** Partial fit. The "uptake" is there (legitimacy of kings), but the "sacrifice" is different. It's less about a specific truth-teller stepping aside and more about the historical figure dissolving into the symbol.

  ### 3. Where the Film Resists Your Reading
  You asked where pressing these conditions would be bad criticism. There are two places where the allegory threatens to crush the film.

  **First, the genre mechanics.** If you treat the shootout solely as an epistemological puzzle, you ignore that it is a Western about masculinity and codes. Doniphon doesn't just "step aside" for a political theory; he steps aside because he knows Stoddard represents the future (law/books) while he represents the past (guns/wilderness). If you focus only on the "legend" aspect, you miss the film's lament for the obsolescence of the individual warrior. The tragedy isn't just that the truth is hidden; it's that the man who knew how to use violence responsibly (to stop Valance) has no place in the world that violence created.

  **Second, the editor's authority.** It is tempting to treat the editor's line ("Print the legend") as the film's thesis statement. It is not. It is the statement of a cynical pragmatist. The film undercuts him by showing us the truth immediately after. We, the audience, are the only ones who know the full story. The film places *us* in the position of the living witness, making us complicit. If you tell students the film *endorses* the editor, you miss the irony: the editor is burning the truth in front of us, the viewers. The film resists becoming a clean allegory by ensuring we leave the theater knowing the lie, thereby refusing to let us accept the legend comfortably.

  ### 4. Seminar Strategy
  Use the "fake news" comment as a entry point to distinguish between *disinformation* (lying to win) and *myth* (lying to bind). Ask the students: "If Stoddard had told the truth, would the statehood have passed?" (Likely no, because Stoddard is a weak shooter and Valance was a terror). Then ask: "Does that make the lie justified?" This forces them into the Doniphon problem immediately.

  When discussing the three conditions, point out that the film shows us the *moment* of transition. Usually, we only see the result (the legend). Here, we see the mechanism (the editor burning the notes). This makes the film a meta-commentary on your other texts: we don't have the editor's notes for the Exodus or Troy, but we must assume someone, somewhere, burned them.

  \answer{the uptake condition} with a clause on whether the Doniphon problem has the same answer for founding legends as for event legends: the ethical cost of the legend is specific to founding narratives that require political cohesion, whereas event legends like Troy accrue without demanding a specific sacrificial erasure of the truth-teller.

  **Bottom Line for the Seminar:**
  "The film argues that history becomes legend not when the truth disappears, but when the community decides the story is more useful than the fact."
