      *   Actually, looking at Condition 2 (Uptake): "legend is a fact in the only sense that has consequences." This aligns with the film. If institutions route through it, it *functions* as history.
      *   So, Condition 2 is the winner.
      *   Resistance: The film is a tragedy about the *loss* of truth, not a treatise on the *utility* of legend. Doniphon's death matters more than Stoddard's election.
      *   Doniphon Problem applicability: Founding legends (Exodus) fit. Event legends (Troy) do not, because no one *sacrificed* themselves to make Troy a state.

      *(Self-Correction during drafting)*: I need to be careful not to be too academic. The user is a TA, but the advice needs to be actionable for a seminar.
