  # Zones of Indeterminacy (Where the Tree Stuck)

  **1. The Adapted Preference Convergence (Q4)**
  *   **The Problem:** Both **Positive Liberty (Self-Mastery)** and **Feminist Non-Subordination** will likely select **(C)** on Q4.
  *   **Why:** Both agree that preferences formed under oppression (or internal compulsion) do not count as free choices.
  *   **The Split:** The tree tries to separate them at Q7 (Structure vs. Agent). However, many Feminists also accept the Republican view on Q1 (Unused Power). If a student picks **(C)** on Q4 and **(B)** on Q1, they occupy a hybrid space (e.g., *Radical Democratic Theory*) that this tree forces into one leaf.
  *   **Honesty:** You cannot cleanly separate Positive Liberty from Feminist Liberty using only these cases without asking about the *source* of the internal constraint (biology vs. patriarchy).

  **2. The Probabilistic Domination Collapse (Q3)**
  *   **The Problem:** **Negative Liberty** and **Republican Liberty** converge if the cost of power is high enough.
  *   **Why:** A Republican might argue that if the veto is *ruinously* costly (Q3), the power is not "arbitrary" in a meaningful sense, pushing them toward **(A)**. A Negative Libertarian might argue that if the probability of interference is near zero, they are effectively free.
  *   **The Split:** The tree assumes Republicans always pick **(B)** on Q3. In reality, sophisticated Republicans (like Pettit) might concede that *extreme* cost reduces domination.
  *   **Honesty:** This quiz cannot distinguish between a "Negative Libertarian who cares about probability" and a "Republican who cares about the cost of exercise." They will answer identically.

  **3. The Structural/Agent Blur (Q7)**
  *   **The Problem:** **Republicanism** and **Feminism** split on whether a "dominus" (master) is required.
  *   **Why:** Q7 tests this directly. However, many students will intuitively feel **(B)** (Unfree/Authority) because the Charter *was* an authority, even if dead. They may not grasp the "no living author" nuance.
  *   **Honesty:** If a student picks **(B)** on Q7, the tree classifies them as Pettitian Republican. They might actually be Feminist but interpret the Charter as an ongoing structural agent. The quiz cannot distinguish "No Author" from "Abstract Author."

  **4. The Empty Cell: Costly Internal Barriers**
  *   **Logical Space:** A theory that says "You are unfree only if internal barriers are expensive to overcome" (Q4=C, Q5=A).
  *   **Status:** **Unexplored/Incoherent.** Most theories either care about internal barriers (Positive) or don't (Negative/Republican). None make cost the sole determinant of internal freedom. If a student lands here, they likely answered inconsistently.

  **5. The Consent Paradox (Q8)**
  *   **Logical Space:** A theory that says "Consent negates domination even if power is arbitrary."
  *   **Status:** **Libertarian/Contractarian.** This is captured in Node 6. However, it clashes with Q1. If consent makes you free in Q8, why does the Director's key make you unfree in Q1 (where you implicitly consented to be on the station)?
  *   **Honesty:** The tree treats Q1 and Q8 as independent, but logically they tension. A student who picks **(A)** on Q8 but **(B)** on Q1 holds a view that *specific* consent matters more than *general* submission. This is a valid but unstable position (Lockeanism).
