answer: |-
  # The Abyssal Outpost Liberty Quiz

  **Instructions:** Read each scenario about a researcher at the *Abyssal Outpost*, a deep-sea station. Choose the option that best matches your judgment about the researcher's freedom. Do not overthink; pick your immediate reaction.

  **The Options (Same for all questions):**
  *   **(A)** The researcher is **free**. No one actively blocked the action.
  *   **(B)** The researcher is **unfree**. An authority held the power to block it.
  *   **(C)** The researcher is **unfree**. Internal or structural limits prevented meaningful choice.

  ***

  **Q1. The Unused Key**
  Researcher Lin wants to leave the mess hall early. Director Aris holds a master key that locks all doors remotely. Aris is asleep and never uses the key, but could wake and lock Lin in instantly. Lin walks out.
  *   (A) The researcher is **free**. No one actively blocked the action.
  *   (B) The researcher is **unfree**. An authority held the power to block it.
  *   (C) The researcher is **unfree**. Internal or structural limits prevented meaningful choice.

  **Q2. The Benevolent Algorithm**
  The Hydro-Algorithm allocates oxygen. It tracks everyone's health data perfectly and never makes mistakes. However, researchers cannot appeal its decisions, and it operates on logic they cannot access. You receive your oxygen.
  *   (A) The researcher is **free**. No one actively blocked the action.
  *   (B) The researcher is **unfree**. An authority held the power to block it.
  *   (C) The researcher is **unfree**. Internal or structural limits prevented meaningful choice.

  **Q3. The Ruinous Veto**
  Director Aris can veto any research proposal. Doing so requires her to manually type a 50-page justification that takes 20 hours. She finds this exhausting and never does it. You publish your paper.
  *   (A) The researcher is **free**. No one actively blocked the action.
  *   (B) The researcher is **unfree**. An authority held the power to block it.
  *   (C) The researcher is **unfree**. Internal or structural limits prevented meaningful choice.

  **Q4. The Adapted Preference**
  Researcher Chen has lived underwater so long she no longer *wants* to see the surface. She was not forced to feel this way; her desires simply shifted to match her confinement. She stays willingly.
  *   (A) The researcher is **free**. No one actively blocked the action.
  *   (B) The researcher is **unfree**. An authority held the power to block it.
  *   (C) The researcher is **unfree**. Internal or structural limits prevented meaningful choice.

  **Q5. The Expensive Exit**
  You are free to resign and leave the Outpost. However, the only shuttle costs your entire life savings and leaves you destitute on the surface. You stay because you cannot afford to go.
  *   (A) The researcher is **free**. No one actively blocked the action.
  *   (B) The researcher is **unfree**. An authority held the power to block it.
  *   (C) The researcher is **unfree**. Internal or structural limits prevented meaningful choice.

  **Q6. The Silent Camera**
  A monitoring system records your private conversations. It was installed secretly years ago. The feed is live, but the security office is currently unmanned and has been for months. You speak privately.
  *   (A) The researcher is **free**. No one actively blocked the action.
  *   (B) The researcher is **unfree**. An authority held the power to block it.
  *   (C) The researcher is **unfree**. Internal or structural limits prevented meaningful choice.

  **Q7. The Founder's Charter**
  The Outpost runs on a Charter written by the dead founders. It forbids night shifts. No living person can amend it; the amendment mechanism broke decades ago. You want to work nights but cannot.
  *   (A) The researcher is **free**. No one actively blocked the action.
  *   (B) The researcher is **unfree**. An authority held the power to block it.
  *   (C) The researcher is **unfree**. Internal or structural limits prevented meaningful choice.

  **Q8. The Consented Captain**
  Director Aris was elected unanimously. She now holds absolute power. You voted for her. She orders you to clean the toilets. You obey.
  *   (A) The researcher is **free**. No one actively blocked the action.
  *   (B) The researcher is **unfree**. An authority held the power to block it.
  *   (C) The researcher is **unfree**. Internal or structural limits prevented meaningful choice.

  ***

  # TA Scoring Key: The Liberty Decision Tree

  **How to use:** Do not count points. Follow the branches based on the student's specific answers. This tree isolates the logical commitments of each theory.

  ### **Node 1: The Internal Obstacle Test (Positive Liberty)**
  **Look at Q4 (Adapted Preference).**
  *   **If (C):** The student believes freedom is compromised by internal psychological states or adapted desires.
      *   **Go to Node 2.**
  *   **If (A) or (B):** The student believes freedom is purely about external relations.
      *   **Go to Node 3.**

  ### **Node 2: Capacity vs. Realization (Positive Liberty Split)**
  **Look at Q5 (Expensive Exit).**
  *   **If (C):** The student believes lack of resources/ability counts as unfreedom.
      *   **LEAF: Capability Freedom (Sen/Nussbaum).**
      *   *Awkward Commitment:* Must classify poverty as a direct restriction of liberty, not just welfare, potentially requiring massive state intervention to "free" the poor.
  *   **If (A):** The student believes cost is not a barrier to freedom, only psychological compulsion is.
      *   **LEAF: Positive Liberty as Self-Mastery (Berlin/Stoic).**
      *   *Awkward Commitment:* Must say a starving person who accepts their fate is freer than a rich person with anxiety, prioritizing internal state over external options.
  *   **If (B):** (Rare/Incoherent) Attributing internal preference to external authority.
      *   **LEAF: Unexplored/Confused.**

  ### **Node 3: The Power Test (Republican vs. Negative)**
  **Look at Q1 (Unused Key).**
  *   **If (B):** The student believes the mere *capacity* of another to interfere reduces freedom, even if unused.
      *   **Go to Node 4.**
  *   **If (A):** The student believes only actual interference reduces freedom.
      *   **LEAF: Negative Liberty (Berlin/Hobbes).**
      *   *Awkward Commitment:* Must classify a slave with a benevolent master who never punishes them as "free," distinguishing them only by luck from a free citizen.

  ### **Node 4: The Arbitrariness Test (Republican Split)**
  **Look at Q2 (Benevolent Algorithm).**
  *   **If (B):** The student believes power is dominating even if it tracks interests perfectly, provided there is no contestability.
      *   **Go to Node 5.**
  *   **If (A):** The student believes power that tracks interests is not a threat to freedom.
      *   **LEAF: Interest-Tracking Republicanism (Some Cambridge School).**
      *   *Awkward Commitment:* Must say a subject under a benevolent dictator is free, provided the dictator is kind, making freedom dependent on the ruler's virtue.

  ### **Node 5: Structure vs. Agent (Feminist vs. Pettitian)**
  **Look at Q7 (Founder's Charter).**
  *   **If (B):** The student requires a specific *agent* or *authority* capable of exercising power for domination to exist. (No dominus, no domination).
      *   **LEAF: Republican Non-Domination (Pettit).**
      *   *Awkward Commitment:* Must say a constraint imposed by a broken, authorless rule is not a loss of *freedom* (though it may be a loss of capacity), because no one stands over you.
  *   **If (C):** (Note: If they answered B at Node 3 but C here). The student sees structural hierarchy as the constraint, not just individual power.
      *   **LEAF: Feminist Non-Subordination (Okin/MacKinnon).**
      *   *Awkward Commitment:* Must classify impersonal historical rules as "domination," expanding the concept of the oppressor to include the past or abstract systems, making resistance logically difficult.
  *   **If (A):** (Incoherent with Node 3).
      *   **LEAF: Logical Error.** (They accept power matters in Q1 but not in Q7).

  ### **Node 6: The Cost & Consent Check (The "Plus Two" Leaves)**
  *If the student's path is ambiguous or they answered (A) on Q1 but (B) on Q3 or Q8.*

  **Look at Q3 (Ruinous Veto) and Q8 (Consented Captain).**
  *   **If Q3 is (B) AND Q8 is (B):** The student thinks power is domination even if costly to use or consented to.
      *   **LEAF: Strict Status Republicanism.**
      *   *Awkward Commitment:* Must say you are unfree even if the threat against you is irrational to carry out, and even if you authorized it yourself.
  *   **If Q3 is (A) AND Q8 is (A):** The student thinks cost and consent negate power.
      *   **LEAF: Libertarian/Consent Liberty (Nozick/Locke).**
      *   *Awkward Commitment:* Must say a worker who "consented" to a coercive contract due to starvation is free, prioritizing the history of the transaction over the current power imbalance.

