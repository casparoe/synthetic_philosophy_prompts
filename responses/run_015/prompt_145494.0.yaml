      Let's refine the "Animalism" point. Animalism says we are organisms. Parfit says we are brains/psychologies. The film shows the organism dying repeatedly. If we are organisms, Angier dies nightly. If we are psychologies, Angier survives. The film makes us *feel* the organism's death. Thus, it pulls us toward Animalism or at least a view where the organism's fate is inextricably linked to personal survival.

