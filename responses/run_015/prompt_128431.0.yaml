      *Self-Correction during drafting:* I must be careful not to say "Orwellian revision doesn't happen." Dennett uses the terms to show the distinction is untenable. The user asks if the Orwellian *model* commits us to impossibility. The answer is: If you assume a Cartesian Theatre, yes, it looks like magic. But since there is no Theatre, the "revision" is just standard neural integration over time. I need to make sure I don't validate the idea that Orwellian revision is a viable *mechanism* separate from Stalinesque, but rather explain why the user's fear of backward causation stems from a false assumption about where consciousness "occurs."

