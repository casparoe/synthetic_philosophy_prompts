answer: |-
  # Lesson Plan: The Veridian Protocol
  **Course:** Political Philosophy & Public Memory (Upper-Level Seminar)  
  **Session:** Commemorative Ethics as Fragmented Obligation  
  **Duration:** 90 Minutes  
  **Class Size:** 16 Students (4 Groups of 4)  

  ## I. Learning Objectives
  By the end of this session, students will be able to:
  1.  **Distinguish** between *expressive* (what the monument says), *institutional* (what the law/policy allows), and *spatial* (where the memory sits) obligations.
  2.  **Identify** the collapse of binary "keep/remove" frameworks when applied to different media (statues vs. street names).
  3.  **Differentiate** between *honorific* registers (praise) and *indexical* registers (historical marking).
  4.  **Acknowledge** the temporal limitation of deliberative simulations: a vote cannot replicate the phenomenology of living with a monument over years.

  ## II. Room Setup & Materials
  *   **Seating:** Four distinct clusters of tables. Three for Committees, one for the Jury.
  *   **Handouts:** 
      *   Role Cards (one set per committee).
      *   Budget Sheets ("Political Capital").
      *   Jury Ballots.
      *   **Facilitator Only:** Crisis Card, Council Ruling Envelope.
  *   **Visual Aid:** A simple projected map of Veridian Square showing the Statue, Vance Way, Marlowe Street, and Old Canal.

  ## III. The Scenario: Veridian
  *   **The Artifact:** Bronze statue of Elias Vance (Founder). Achievements: Ended regional famine. Atrocities: Instituted coerced punitive labor.
  *   **The Space:** Central Square. Adjacent streets: *Vance Way* (Main thoroughfare), *Marlowe Street* (Named for a dissident associate), *Old Canal* (Neutral).
  *   **The Law:** Municipal Ordinance 44-B ("Interpretive Overlay"). Permits plaques, counter-sculptures, or landscape alterations. **Prohibits** removal of the original artifact.
  *   **The Stakes:** Political Capital (PC). Committees start with 10 PC. They must spend PC to make their proposal viable. The Jury vote awards/deducts PC. The group with the most PC wins "bragging rights" (or a minor course credit bonus).

  ## IV. Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Briefing** | Facilitator sets the scene. Groups assigned. |
  | **05-35** | **Deliberation** | Committees draft proposals. **Crisis Card deployed at T+20.** |
  | **35-50** | **Presentations** | 3 Committees present (5 mins each). Jury questions. |
  | **50-60** | **Judgment** | Jury deliberates in secret. Casts ranked-choice vote. |
  | **60-65** | **The Overrule** | Facilitator reveals the Town Council's actual decision. |
  | **65-90** | **Debrief** | The Street Name Pivot, Theoretical Mapping, Temporal Limit. |

  ---

  ## V. Role Cards & Constraints (Handouts)

  ### 1. Civic Continuity Committee
  *   **Mission:** Propose a plan that stabilizes Veridian's identity.
  *   **Hidden Constraint:** At least one physical reference to Vance must remain *in the square*. You believe narrative rupture damages collective identity.
  *   **Budget Priorities:** Legal Defense (4 PC), Maintenance (2 PC).
  *   **Strategy:** Argue that removing Vance erases the history of the famine relief.

  ### 2. Moral Abolition Committee
  *   **Mission:** Propose a plan that ensures justice for the descendants of laborers.
  *   **Hidden Constraint:** No artifact may stand without *explicit moral condemnation* visible at the site. Neutrality is complicity.
  *   **Budget Priorities:** Counter-Sculpture (5 PC), Community Outreach (3 PC).
  *   **Strategy:** Argue that the statue currently functions as praise. It must be actively re-coded as a warning.

  ### 3. Palimpsestic Design Committee
  *   **Mission:** Propose a plan that transforms the meaning of the space without erasure.
  *   **Hidden Constraint:** Keep the original visible but transform its contextual meaning through artistic/landscape overlay.
  *   **Budget Priorities:** Landscape Alteration (5 PC), Interpretive Plaque (2 PC).
  *   **Strategy:** Argue for complexity. The statue is now part of a larger artwork about contradiction.

  ### 4. Residents' Jury
  *   **Mission:** Hear the three proposals and cast a secret ranked-choice vote.
  *   **Constraint:** You are **forbidden** from using philosophical jargon (e.g., "ontology," "normative," "indexical"). You must justify your vote only in terms of: *"What kind of town do we want to be in ten years?"*
  *   **Power:** Your vote determines the winning committee's Political Capital bonus (+5 PC). The losing committee loses 2 PC.

  ---

  ## VI. Facilitator Script & Mechanics

  ### Phase 1: Briefing (00-05)
  **Facilitator:** "Welcome to Veridian. You have a problem. You have a law. You have 30 minutes to solve it. Note the map on the screen: The Statue is in the square. Vance Way and Marlowe Street border it. **Focus your energy on the Statue.** The streets are background context. Go."

  ### Phase 2: Deliberation & Crisis (05-35)
  *   **T+20 (The Crisis Card):** Interrupt the room. Hand a printed slip to each Committee Chair.
      *   **Text:** *BREAKING NEWS: The Descendants' Alliance has filed an injunction. They demand either full removal OR full contextualization. 'Full Contextualization' is now legally defined as requiring a named, funded program for laborer descendants. Vague plaques no longer qualify. Adjust your budgets.*
      *   **Effect:** Forces committees to spend PC they intended to save. Forces "Palimpsest" to define exactly what their art *says*.

  ### Phase 3: Presentations & Vote (35-60)
  *   Committees present. Jury asks clarifying questions.
  *   Jury retreats (can be in the corner of the room). They must produce a Ranked Choice ballot (1st, 2nd, 3rd).
  *   **Facilitator:** Collect ballots. Tally PC scores publicly on the board.

  ### Phase 4: The Overrule (60-65)
  **Facilitator:** "The Jury has spoken. The Political Capital is awarded. However, I am now the Town Clerk."
  *   **Action:** Open the sealed envelope.
  *   **The Ruling:** "The Town Council, fearing litigation costs and tourism loss, has voted to **relocate the statue to the Veridian Historical Museum.** The Square will be left empty pending future landscaping."
  *   **Why:** This option was *not* on the table. 
      *   *Continuity* fails (not in the square).
      *   *Abolition* fails (no visible condemnation in the square).
      *   *Palimpsest* fails (no transformation of the public space).
  *   **Point:** Deliberative ideals often crash into bureaucratic risk-aversion.

  ### Phase 5: The Debrief (65-90)
  *This is the critical pedagogical moment. Do not rush.*

  **Step 1: The Street Name Pivot (65-75)**
  **Facilitator:** "You spent 30 minutes fighting over the bronze man. Look at the map again. *Vance Way* and *Marlowe Street*."
  *   **Question:** "If the Council's decision (Museum Relocation) solves the statue problem, does it solve the street name problem?"
  *   **Prompt:** "If we rename Vance Way, do we need a plaque? If we keep Vance Way, is it an endorsement?"
  *   **Goal:** Guide students to see that the statue operates in an **Honorific Register** (it looks like praise, so it demands moral judgment), while the street name operates in an **Indexical Register** (it marks presence/navigation, and can tolerate ambiguity).
  *   **Takeaway:** A unified "keep or remove" policy fails because the *media* of memory carry different ethical weights.

  **Step 2: Mapping the Failure (75-85)**
  **Facilitator:** "Let's map your strategies to the theory."
  *   **To Abolition:** "You focused on *Expressive Ethics* (what the statue says). But you ignored *Institutional Ethics* (the Ordinance prevented removal)."
  *   **To Continuity:** "You focused on *Identity* (narrative rupture). But you ignored *Spatial Ethics* (whose body occupies the square?)."
  *   **To Palimpsest:** "You were likely dismissed as avoiding the hard choice. Why? Because 'complexity' often feels like 'complicity' to victims."
  *   **To Jury:** "Did you vote based on moral reasoning, or emotional disgust? (Be honest). In public memory, disgust often drives policy more than philosophy."

  **Step 3: The Temporal Limit (85-90)**
  **Facilitator:** "Finally, a confession. This simulation lied to you."
  *   **Statement:** "You decided the fate of this square in 30 minutes. In reality, Veridian's residents would walk past this decision every day for *twenty years*."
  *   **Concept:** **Moral Weathering.**
      *   A counter-sculpture might feel powerful on Day 1. On Day 1,000, it becomes invisible background noise.
      *   A plaque might feel like justice on Day 1. On Day 1,000, it is ignored by skateboarders.
  *   **Closing:** "Commemorative ethics is not a vote. It is a relationship with time. You cannot simulate the erosion of meaning in a classroom. You can only plan for it. Class dismissed."

  ---

  ## VII. Facilitator Notes & Troubleshooting

  *   **If the Palimpsest Group dominates:** Intervene during Q&A. Ask the Jury: "Does adding art around a harmful statue make the statue safer, or does it just make the harm more expensive?"
  *   **If the Jury uses jargon:** Stop them. "Translate that into 'What kind of town do we want to be?'"
  *   **If students fixate on the Street Names early:** Remind them: "The Ordinance 44-B is currently only under review for the Square. Stick to the brief." (Save the reveal for the debrief).
  *   **Budget Tracking:** Keep a running tally of Political Capital on the whiteboard. It creates visible tension. If a group runs out of PC, their proposal becomes "Legally Vulnerable" (disadvantage in Jury vote).
  *   **The "Overrule" Reaction:** Students may feel cheated by the Council Overrule. *Lean into this.* Their frustration is the data point. It proves that democratic deliberation on memory is often overridden by institutional self-preservation.

  ## VIII. Post-Class Reflection (Instructor Only)
  *   Did the students notice the shift from Honorific (Statue) to Indexical (Street)?
  *   Did the Crisis Card successfully force specificity on "contextualization"?
  *   Was the temporal disclaimer delivered with enough gravity to land the philosophical limitation?

  ---

  ## Appendix: Budget Sheet Example (Civic Continuity)
  **Starting Capital:** 10 PC
  **Proposed Expenses:**
  *   [ ] Polishing/Maintenance of Statue: 2 PC
  *   [ ] Legal Defense Fund (Against Descendants): 4 PC
  *   [ ] New "Founder's Context" Plaque: 2 PC
  *   [ ] Annual Ceremony Funding: 2 PC
  **Total:** 10 PC
  *Warning: If Crisis Card triggers, Legal Defense cost increases to 6 PC. You must cut elsewhere.*
