answer: |-
  **Project Title:** Normative Jurisdiction: Reconstructing the Separateness of Persons Objection

  **Project Overview**
  The standard Rawlsian objection to utilitarianism—the "separateness of persons"—is traditionally interpreted as a metaphysical or arithmetic constraint: distinct centers of consciousness cannot be summed into a single social utility function. This project argues that this interpretation is superficial. The core moral force of the objection is not anti-aggregation, but anti-usurpation. The problem with utilitarianism is not that it adds well-being across persons, but that it violates a normative jurisdiction each individual holds over how their interests enter collective decision-making. This three-month part-time project will reconstruct the separateness objection as a claim about individual authority rather than distributional equality. By drawing on literature regarding shared agency and joint intentionality, I will model the conditions under which individuals retain authority within collective calculus, demonstrating that the authority-reconstruction offers a more robust defense of liberal personhood than the standard aggregation-based reading.

  **Research Question and Thesis**
  The central research question is: *Is the separateness-of-persons objection best reconstructed as a violation of normative jurisdiction rather than an error in aggregation?*

  My thesis is affirmative. The standard aggregation reading is vulnerable to consequentialist counter-arguments (e.g., if summing produces better outcomes, why is the math illegitimate?). The authority reading, however, captures the deontological intuition that individuals are sovereigns over their own stakes, not merely containers of utility. Utilitarianism fails not because it sums, but because it substitutes an external calculator for the individual's normative standing. This project will argue that shifting the frame from "distribution of goods" to "jurisdiction over interests" resolves longstanding stalemates in the debate. It explains why we might accept utility trade-offs in some contexts (where authority is delegated) but reject them in others (where jurisdiction is inalienable), a nuance the standard Rawlsian view misses.

  **Background and Gap**
  Current literature treats the separateness objection as a constraint on the *output* of moral theory (distribution). Rawlsians focus on the Original Position to ensure fair distribution, while utilitarians focus on maximizing the sum. Both sides assume the debate is about how much weight each person's well-being receives. They neglect the procedural question: *Who decides how that weight is applied?*

  By focusing on equality and maximization, both camps treat individuals as passive sites of value. This leaves open the possibility that if we could guarantee equal distribution, utilitarianism would be acceptable. My project contends this is a category error. Even a perfectly equal utilitarian calculation violates the individual's status as an agent with authority over their own good. The gap in the literature is a lack of conceptual machinery to describe this "normative jurisdiction." Existing critiques focus on the *amount* of sacrifice permitted, not the *right to authorize* that sacrifice.

  **Methodology and Work Plan**
  The methodology is conceptual analysis grounded in the philosophy of action. To define "normative jurisdiction," I will utilize frameworks from the shared agency and joint intentionality literature. This literature distinguishes between merely acting in parallel and acting as a "we," specifically analyzing how individuals pool intentions without surrendering agency.

  *   **Month 1: Conceptual Modeling.** I will analyze shared agency models to isolate the necessary conditions for "retaining authority" within a collective decision structure. The goal is to distinguish between *delegating* authority (consistent with agency) and *being overridden* (violating agency).
  *   **Month 2: Application.** I will apply this model to the utilitarian calculus. I will test whether utilitarianism can be reframed as a legitimate shared agency project (where authority is delegated) or if it inherently bypasses the agent. This will allow me to distinguish contexts where the separateness objection is weak (e.g., voluntary cooperative schemes) versus where it is decisive (e.g., non-consensual sacrifice).
  *   **Month 3: Synthesis and Drafting.** I will synthesize these findings into a draft article arguing for the authority-reconstruction. I will explicitly address the failure condition: if "authority" collapses into mere "preference satisfaction," the reconstruction fails. I will argue that authority is distinct because it involves a second-order standing to determine how first-order preferences count.

  **Scope and Feasibility**
  This is a three-month part-time project (approximately 150 hours). Given this constraint, the scope is strictly limited to conceptual reconstruction and a proof-of-concept application.
  *   **In Scope:** Defining normative jurisdiction via shared agency literature; applying this definition to the standard utilitarian calculus; producing one draft article (approx. 8,000 words).
  *   **Out of Scope:** I will not attempt a full history of the Rawlsian objection or a comprehensive critique of all forms of utilitarianism. I will not engage in empirical political theory or extensive exegesis of Rawls's primary texts beyond the separateness claim. I will not develop a full alternative normative theory, only the diagnostic framework.
  *   **Risk Management:** The primary risk is that the concept of "authority" proves too vague to distinguish from preference satisfaction. To mitigate this, Month 1 is dedicated exclusively to rigourously defining authority using established action-theory frameworks. If the distinction cannot be sustained, the project will pivot to documenting why the collapse occurs, which remains a valuable negative result.

  **Significance**
  Reframing the separateness objection as an authority claim bridges ethical theory and political philosophy. It suggests that the critique of utilitarianism is not about mathematical limits on summation, but about the conditions of legitimate collective action. This has implications beyond ideal theory, offering a framework for analyzing non-ideal contexts where individuals must negotiate authority in shared projects. By taking a definite stance that the authority-reconstruction is superior to the aggregation-reading, this project moves the debate past the stalemate of "summing vs. not summing" toward a more nuanced understanding of moral sovereignty. The resulting article will lay the groundwork for a larger dissertation chapter on the relationship between personal sovereignty and collective rationality.
