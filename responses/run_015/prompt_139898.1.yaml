  # Seminar Handout: The Burn Unit Dressing Change

  **Scenario**
  Ten patients require daily burn dressing changes. All options share identical costs, recovery outcomes, and side-effects; they differ only in analgesic protocol, which alters pain intensity (0–10 NRS) and duration.
  **Threshold ($T$):** 8/10 ('Very Severe').
  **Unit:** Pain-minutes (Intensity $\times$ Duration $\times$ Patients).

  **The Options**

  | Option | Protocol | Pain Profile (per patient) | Supra-$T$ Episodes | Total Pain (Sum) | Worst-Off (Max) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **A** | Standard | 7/10 for 20 mins | 0 | $10 \times 7 \times 20 = \mathbf{1400}$ | 7 |
  | **B** | Rapid | 1 patient: 8/10 for 10 mins<br>9 patients: 6/10 for 10 mins | 1 | $(1 \times 8 \times 10) + (9 \times 6 \times 10) = \mathbf{620}$ | 8 |
  | **C** | Gentle | 5/10 for 30 mins | 0 | $10 \times 5 \times 30 = \mathbf{1500}$ | 5 |

  **The Verdicts**

  1.  **Lexical Threshold NU picks A.**
      *   *Arithmetic:* Rejects B (one episode $\ge T$). Between A and C (both 0 episodes $\ge T$), minimises sub-$T$ sum (1400 < 1500).
  2.  **Continuous NU picks B.**
      *   *Arithmetic:* Minimises total intensity-duration sum regardless of threshold (620 < 1400 < 1500).
  3.  **Suffering-Focused Leximin picks C.**
      *   *Arithmetic:* Minimises the maximum pain suffered by any single individual (5 < 7 < 8).

  **Analysis Notes**

  *   **Load-bearing numbers:** The crossing of $T$ (8 vs 7) drives the Lexical view; the total sum inversion (620 vs 1400) drives Continuous NU; the max intensity spread (5 vs 7) drives Leximin. You could adjust durations so long as these inequalities hold.
  *   **Feature doing the work:** The case separates the *presence* of severe pain, the *aggregate volume* of pain, and the *distribution* of pain across persons.
  *   **Sensitivity:** If you shift $T$ down to 7, Option A becomes supra-threshold; Lexical NU switches to C. If you drop Option B, Continuous NU switches to A.
  *   **Objection (from Continuous NU):** "It is irrational to let one patient's ten minutes of 8/10 pain veto 780 units of relief for the group; the threshold creates a moral cliff-edge where none exists."
  *   **Honesty Check:** The numbers are tuned to force divergence, but the trade-off (speed vs. safety vs. equality) is structurally identical to real triage decisions regarding anaesthesia dosage and procedure time.
