answer: |-
  I was struggling to keep the door open while carrying boxes, so I kicked my dissertation into the wedge position.

  **Mechanism:** (b) Two live mappings of the same material, where the surface-respecting one fails and the relational one lands.
  **Mapping Completion:** The mapping snaps shut on "wedge position," forcing the dissertation into the functional category of doorstop.
  **Discarded Mapping:** The listener first reaches for the surface mapping (dissertation = heavy/thick object), but this is demonstrably worse because the setup never mentioned weight, and a brick would serve better; it leaves the specific choice of "dissertation" unaccounted for.
  **Relational Mapping:** The joke lands on the relational structure (dissertation = obstacle that halts progress), which fits the "doorstop" function perfectly without importing physical features.
  **Non-Reader Honesty:** The half of the room that hasn't read the book will laugh at the grad-school pain, but they will miss the cognitive demonstration; they'll hear a metaphor, not a categorization act.
