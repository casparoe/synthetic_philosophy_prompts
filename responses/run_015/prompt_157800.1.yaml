answer: |-
  This is a profound structural question for a novel. You are asking whether the *logic* of justice changed between the founding moment of international criminal law (Nuremberg) and its bureaucratic maturity (The Hague), or whether the underlying moral machinery is the same, merely painted with different aesthetics.

  To answer this, we must treat Nuremberg not as a victory parade, but as a philosophical crisis. It was a tribunal invented to judge crimes that were legally undefined when committed, by victors who were not neutral, for an audience that included the future.

  Here is an analysis of the International Military Tribunal (IMT) mapped onto the architecture of punishment, tested against your theoretical frameworks, and concluding with the "third axis" you suspect exists.

  ---

  ### I. The Retributivist Framework: The Moral Ledger

  **The Prescription:**
  Pure retributivism argues that punishment is a categorical imperative grounded in *desert*. The offender has upset the moral balance; punishment restores it. It looks exclusively backward.
  *   **For the Defendants:** They should be punished strictly in proportion to the moral gravity of their acts, regardless of the utility to the Allies. If they committed murder, they deserve death. If their specific actions cannot be individually proven, they deserve acquittal, regardless of their association with the regime.
  *   **For the Judges:** They must act as neutral arbiters of pre-existing law. They cannot create new crimes (*nullum crimen sine lege*). To punish someone for a law written after the act is a violation of retributive justice.
  *   **For the Absent Victims:** Their suffering creates the debt. Retributivism demands their suffering be acknowledged as the *quantum* of the penalty. However, since they are dead, they cannot participate; they are the silent creditors.
  *   **For the Executioners:** They are the mechanics of balance. Their role is purely instrumental—to close the ledger.

  **What It Illuminates:**
  Retributivism explains the IMT's obsessive focus on *individual culpability* over collective guilt. The Allies resisted Soviet pressure to summarily execute thousands of Nazis. Instead, they indicted specific men. This was a retributive victory: the idea that only the guilty individual pays, not the German *Volk*. It also illuminates the discomfort surrounding the acquittals (e.g., Schacht, von Papen). A retributivist understands why they were let go: the ledger showed no debt.

  **What It Misdescribes (The Fracture):**
  Retributivism collapses under the weight of *ex post facto* law. "Crimes Against Humanity" were not positive law in 1939. A strict retributivist must argue that Nuremberg was legally illegitimate, because you cannot deserve punishment for breaking a rule that did not exist. Furthermore, retributivism cannot account for the *spectacle*. A retributive execution should be private and efficient. Nuremberg was public, translated, and documented. The retributive model renders silent the trial's function as a historical record. It cannot explain why the judges spent months listening to testimony about organizations (like the SS) that would not result in individual death sentences. That was not about desert; it was about narrative.

  ### II. The Consequentialist Framework: The Engineering of Future Peace

  **The Prescription:**
  Consequentialism (Utilitarianism) argues punishment is justified only by its future outcomes: deterrence, incapacitation, and rehabilitation. It looks exclusively forward.
  *   **For the Defendants:** They should be punished if, and only if, doing so prevents future aggression. If executing Goering stabilizes Europe, do it. If keeping Schacht (an economist) helps rebuild Germany, acquit him. Their guilt is secondary to their utility.
  *   **For the Judges:** They are legislators in robes. Their jurisdiction is not found in statute but in necessity. They must frame the trial to establish a precedent that deters future dictators.
  *   **For the Absent Victims:** Their testimony is evidence not to balance a ledger, but to shock the conscience of the world. Their absence is useful; it allows their story to be curated into a warning.
  *   **For the Executioners:** They are agents of incapacitation. They remove dangerous nodes from the network of power.

  **What It Illuminates:**
  This framework perfectly explains the "hybrid identity" of the IMT as court and pedagogical stage. Consequentialism justifies the creation of new law to fit the crime. It explains the massive documentation effort: the trial was building a "factual fortress" against future denialism. It explains why the death sentences were carried out secretly (to avoid creating martyrs) and why the bodies were cremated and ashes scattered (to prevent shrine-building). These were not acts of justice; they were acts of risk management.

  **What It Misdescribes (The Fracture):**
  Consequentialism struggles with the *limits* the IMT observed. If the goal was purely future peace, a purge of the entire German bureaucracy would have been more effective than trying 22 men. Conversely, if the goal was reconciliation, letting them all go might have been better. Consequentialism cannot explain the moral outrage that demanded *some* form of death penalty regardless of utility. It also fails to account for the "temporal asymmetry" you noted. Consequentialism demands a link between act and outcome. But at Nuremberg, the punishment was addressing a past (the War) that was already over, to construct a future (International Law) that was abstract. The link is speculative. A utilitarian might argue the trial was a failure if nationalism rises again; a retributivist argues it was a success if the guilty suffered. Nuremberg claimed both, creating a philosophical tension.

  ### III. The Temporal Asymmetry and the Silent Axis

  You identified a "strange temporal asymmetry": punishing a past that no longer existed to construct a legal future that had not yet arrived. Both standard theories fail to fully capture this because both assume a stable sovereign authority.
  *   Retributivism assumes a stable moral order that was violated.
  *   Consequentialism assumes a stable political order that needs protecting.

  At Nuremberg, the moral order *and* the political order were the things being *created* by the trial.

  **The Third Axis: The Semiotics of Institutional Memory**
  Your hypothesis is correct. Nuremberg reveals that punishment, at the level of statecraft, functions as **ontological inscription**. The sentence is not primarily about the body of the defendant (Retribution) or the safety of the public (Consequentialism); it is about the legitimacy of the Judge.

  *   **The Defendants** were the raw material for the inscription. Their guilt was necessary to validate the new law.
  *   **The Judges** were not arbiters but *authors*. By framing jurisdiction as a "novel legal creation," they were performing sovereignty. They were saying, "We have the authority to make this law."
  *   **The Absent Victims** provided the moral capital. Their written testimony substituted for presence to create an archive. The trial was a machine for converting suffering into legal precedent.
  *   **The Executioners** finalized the inscription. The hanging was the period at the end of the sentence of the old order.

  In this light, the "moral architecture" is not continuous. It is **performative**. The punishment validates the institution that punishes.

  ### IV. Implications for Your Novel: 1945 vs. The Hague

  How does this help you render the two courtrooms?

  **1. The Continuity of Tension**
  The fracture you are looking for is not that the theories changed, but that the *confidence* in the "Third Axis" has eroded.
  *   **1945 (The American Prosecutor):** In his private notebooks, he should be wrestling with the *creation* of legitimacy. He knows the law is being made as he speaks. His anxiety is theological: *Do we have the right to judge?* He is writing the scripture. The punishment feels heavy, sacred, and terrifyingly new.
  *   **Present Day (The Hague):** The tribunal is no longer creating legitimacy; it is *consuming* it. The "semiotics of memory" are now bureaucratic. The trial is a spectacle, but the audience is skeptical. The "absent victims" are now represented by NGOs and media, not just written testimony. The anxiety here is not "Do we have the right?" but "Does anyone care?"

  **2. Rendering the Agents**
  *   **The Defendants:** In 1945, they are monsters being turned into legal subjects to be destroyed. In The Hague, the aging commander is a subject being turned into a historical footnote. The 1945 defendant fears the rope; the Hague defendant fears irrelevance.
  *   **The Judges:** In 1945, the Allied judges are conscious of their own power to invent. In The Hague, the judges are constrained by decades of precedent. They are technicians, not founders.
  *   **The Victims:** In 1945, they are ghosts invoked to haunt the courtroom. In The Hague, they are stakeholders. This changes the moral weight. A ghost demands vengeance; a stakeholder demands reparations.
  *   **The Executioners:** In 1945, the execution is the climax of the drama. In The Hague, the "execution" is a prison sentence in a white-collar facility. The *spectacle* has moved from the gallows to the media broadcast.

  **3. The Verdict on the Dichotomy**
  Nuremberg does not confirm the Retribution/Consequentialism dichotomy; it **subsumes** it. It shows that in high-stakes political justice, both theories are tools used to serve the Third Axis: **Legitimacy.**

  *   When the IMT needed to look fair, it used Retributivism (individual guilt).
  *   When it needed to look necessary, it used Consequentialism (precedent for peace).
  *   But the goal was always the inscription of the Allied moral order.

  **For your novel:**
  The continuity lies in the *use* of the trial to write history. The fracture lies in the *reception* of that history.
  *   Your 1945 prosecutor writes in his notebook knowing he is building a cathedral. He believes the inscription will hold.
  *   Your present-day observers at The Hague watch a trial that feels like a museum exhibit of that cathedral. They wonder if the inscription is fading.

  The moral architecture fractures not because the philosophy of punishment changed, but because the **faith in the institution's ability to inscribe memory** has decayed. In 1945, the sentence created reality. Today, the sentence struggles to describe it.

  **Suggested Motif:**
  Consider using the physical act of *writing* vs. *recording*.
  *   1945: The prosecutor writes in a notebook (private, permanent, ink). The trial transcript is typed on paper.
  *   Present: The trial is streamed, recorded, archived digitally (public, ephemeral, data).
  *   The philosophical shift is from **Inscription** (cutting into stone/law) to **Transmission** (sending a signal). Retribution and Consequentialism are just the languages used to encode the message. The novel's tension comes from asking: *Who is reading the message now?*
