answer: |-
  # SENTENCING INTEGRITY AUDIT PROTOCOL (SIAP)
  **Office:** Sentencing Integrity Office  
  **Scope:** Proposed sentences exceeding twelve (12) months.  
  **Time Allocation:** 30 Minutes Maximum.  
  **Authority:** Statutory Mandate for Backward-Looking Culpability and Forward-Looking Efficacy.

  ---

  ## PART I: THE AUDIT PROCEDURE

  ### PHASE 1: INPUT VERIFICATION & AMBIGUITY CHECK (Minutes 0–5)
  **Goal:** Establish valid inputs for the Culpability Corridor (CC) and Risk-Reduction Floor (RRF).

  1.  **Verify Offense-Gravity Index (OGI).**
      *   *Question:* Is the OGI (1–10) derived from statutory harm tables and verified actual harm?
      *   *Sufficient Answer:* A single integer supported by the verdict and harm report.
      *   *Stopping Rule:* If harm models vary by >50% or statutory tables are disputed, **HALT**. Escalate to **Clinical-Legal Referee**. Document the specific variance range.
  2.  **Verify Mental-State Tier.**
      *   *Question:* Is the mental state categorized as Intentional, Reckless, Negligent, or Strict Liability (with/without mitigation)?
      *   *Sufficient Answer:* A single tier matching the conviction elements.
      *   *Stopping Rule:* If forensic reports disagree on capacity or intent (e.g., reckless vs. negligent), **HALT**. Escalate to **Clinical-Legal Referee**. Document the conflicting clinical assessments.
  3.  **Verify Risk & Rehabilitation Data.**
      *   *Question:* Is there a validated recidivism-risk score and a rehabilitation-time estimate?
      *   *Sufficient Answer:* Validated score + time estimate OR application of Conservative Default.
      *   *Stopping Rule:* If data is missing, apply Conservative Default. Do not impute numbers. Proceed.

  ### PHASE 2: CULPABILITY CORRIDOR (CC) CONSTRUCTION (Minutes 5–15)
  **Goal:** Calculate the range of deserved punishment (Backward-Looking).

  4.  **Calculate Base CC.**
      *   *Action:* Map OGI and Mental-State Tier to the statutory sentencing grid.
      *   *Output:* Base Lower Bound and Base Upper Bound.
  5.  **Apply Adjustments.**
      *   *Question:* Are there statutory aggravation caps or mitigation floors?
      *   *Action:* Apply caps/floors.
      *   *Special Handling (Restitution):* If full voluntary restitution was made pre-sentencing, apply the statutory credit to the Base CC.
      *   *Special Handling (Corporate/Diffuse):* If the offender is an entity or culpability is shared, divide the Base CC by the number of primary decision-makers unless statutory law dictates entity liability.
      *   *Output:* **Final CC Range [Min_Desert – Max_Desert].**

  ### PHASE 3: RISK-REDUCTION FLOOR (RRF) CONSTRUCTION (Minutes 15–20)
  **Goal:** Calculate the minimum punishment for efficacy (Forward-Looking).

  6.  **Calculate Statutory Targets.**
      *   *Action:* Compute minimum time required for specific deterrence, general deterrence, and incapacitation based on the Risk Score.
      *   *Action:* Add Rehabilitation-Time Estimate.
      *   *Output:* **Final RRF Value [Min_Efficacy].**
      *   *Note:* The RRF is a floor, not a target. Sentences may exceed this, but not fall below it without statutory waiver.

  ### PHASE 4: COMPARISON & DECISION LOGIC (Minutes 20–25)
  **Goal:** Compare Proposed Sentence (PS) against CC and RRF.

  7.  **Check RRF Compliance.**
      *   *Question:* Is PS ≥ RRF?
      *   *If NO:* **REJECT.** Document failure to meet statutory efficacy targets.
      *   *If YES:* Proceed to Step 8.
  8.  **Check CC Compliance.**
      *   *Question:* Is PS within Final CC Range [Min_Desert – Max_Desert]?
      *   *If YES (PS ≥ Min_Desert AND PS ≤ Max_Desert):* **CERTIFY.** Sign off as Analyst.
      *   *If NO (PS < Min_Desert):* **REJECT.** Document violation of Culpability Corridor (unduly lenient regarding desert).
      *   *If NO (PS > Max_Desert):* **REJECT.** Document violation of Culpability Corridor (excessive regarding desert).
  9.  **Check Anchor Conflict.**
      *   *Question:* Does RRF > CC Upper Bound (Max_Desert)?
      *   *If YES:* **HALT.** Escalate to **Values Panel**.
      *   *If NO:* Proceed to Step 10.
  10. **Check Ambiguous Compliance.**
      *   *Question:* Does PS fall below CC Lower Bound but meet/exceed RRF?
      *   *If YES:* **REJECT.** The CC governs desert; meeting efficacy does not justify violating the lower bound of culpability. Document the tension.

  ### PHASE 5: ESCALATION DOCUMENTATION (Minutes 25–30)
  **Goal:** Prepare hand-off materials for Halts.

  11. **Values Panel Hand-off.**
      *   *Required Content:* The specific numerical conflict (RRF value vs. CC Upper Bound), the statutory targets driving the RRF, and the culpability factors capping the CC.
      *   *Analyst Role:* Do not recommend a solution. Present the conflict only.
  12. **Clinical-Legal Referee Hand-off.**
      *   *Required Content:* The specific factual ambiguity (mental state or harm model), the competing expert reports, and the impact of the ambiguity on the OGI or Tier assignment.
      *   *Analyst Role:* Do not adjudicate the fact. Present the variance only.

  ---

  ## PART II: CASE APPLICATIONS

  ### CASE A: Intentional Fraud with Restitution
  *   **Inputs:** OGI 7 (Intentional). Restitution: Full (Pre-sentence). Risk: Low.
  *   **Calculated Anchors:**
      *   CC (Post-Restitution Credit): 2.5 years to 6 years.
      *   RRF: 1 year.
      *   Proposed Sentence (PS): 1.5 years (18 months).
  *   **Procedure Execution:**
      1.  **Phase 1:** Inputs verified. No ambiguity.
      2.  **Phase 2:** CC established at 2.5–6 years. (Note: Restitution credit already applied per prompt).
      3.  **Phase 3:** RRF established at 1 year.
      4.  **Phase 4 (Step 7):** Is PS (1.5) ≥ RRF (1.0)? **YES.**
      5.  **Phase 4 (Step 8):** Is PS (1.5) within CC (2.5–6.0)? **NO.** PS is below Min_Desert (2.5).
      6.  **Phase 4 (Step 10):** Does PS < CC Lower Bound but ≥ RRF? **YES.**
  *   **Outcome:** **REJECT.**
  *   **Documentation Required:** The Analyst must document that while forward-looking efficacy targets are met (1.5 > 1.0), the proposal violates the backward-looking Culpability Corridor. The CC lower bound (2.5 years) represents the minimum deserved punishment *after* restitution credit. A sentence of 1.5 years is structurally ineligible for certification regardless of intuition regarding restitution.
  *   **Stopping Point:** Phase 4, Step 10.

  ### CASE B: Reckless Assault (RRF > CC Conflict)
  *   **Inputs:** OGI 9 (Reckless). Risk: High.
  *   **Calculated Anchors:**
      *   CC: 4 years to 8 years.
      *   RRF: 10 years (driven by incapacitation).
      *   Proposed Sentence (PS): 10 years.
  *   **Procedure Execution:**
      1.  **Phase 1:** Inputs verified. No ambiguity.
      2.  **Phase 2:** CC established at 4–8 years.
      3.  **Phase 3:** RRF established at 10 years.
      4.  **Phase 4 (Step 7):** Is PS (10) ≥ RRF (10)? **YES.**
      5.  **Phase 4 (Step 8):** Is PS (10) within CC (4–8)? **NO.** PS exceeds Max_Desert (8).
      6.  **Phase 4 (Step 9):** Does RRF (10) > CC Upper Bound (8)? **YES.**
  *   **Outcome:** **HALT & ESCALATE TO VALUES PANEL.**
  *   **Documentation Required:** The Analyst must document the "Anchor Conflict." Specifically: Statutory efficacy targets (incapacitation) require a minimum of 10 years, but Culpability limits (proportionality to reckless harm) cap deserved punishment at 8 years.
  *   **Values Panel Question:** The Panel is asked to resolve the normative priority: Does the jurisdiction prioritize statutory safety targets (efficacy) over proportionality limits (desert) in high-risk violent cases? The Analyst does not answer this; the Panel must sign off on the override.
  *   **Stopping Point:** Phase 4, Step 9.

  ### CASE C: Corporate Negligence (Ambiguity)
  *   **Inputs:** Industrial chemical release. Three managers.
  *   **Ambiguities:**
      1.  Mental State: Forensic reports disagree (Reckless vs. Negligent).
      2.  Harm: Exposure models vary by factor of three.
  *   **Procedure Execution:**
      1.  **Phase 1 (Step 1):** Verify OGI. **FAIL.** Harm assessments vary by >50% (factor of three).
      2.  **Phase 1 (Step 2):** Verify Mental-State Tier. **FAIL.** Reports disagree on capacity/intent.
  *   **Outcome:** **HALT & ESCALATE TO CLINICAL-LEGAL REFEREE.**
  *   **Documentation Required:** The hand-off must contain:
      1.  The specific range of harm estimates (Model A vs. Model B) and the resulting OGI variance.
      2.  The conflicting clinical/forensic opinions on the managers' decision-making authority and awareness (Reckless vs. Negligent).
      3.  A statement that the SIAP cannot proceed without a single OGI integer and a single Mental-State Tier.
  *   **Stopping Point:** Phase 1, Step 1 & 2.
  *   **Note:** The Values Panel is *not* involved here. This is a factual/clinical adjudication, not a values conflict.

  ---

  ## PART III: STRUCTURAL LIMITATIONS

  The Sentencing Integrity Audit Protocol (SIAP) is bound by the following in-principle limitations. These are not resource constraints but structural features of the framework.

  1.  **Inability to Resolve Normative Conflicts:** The procedure cannot mathematically or logically resolve a conflict where the Risk-Reduction Floor exceeds the Culpability Corridor (Case B). The CC represents *desert* (a limit on state power), and the RRF represents *efficacy* (a goal of state power). When efficacy requires more than desert allows, the procedure must halt. Only a human Values Panel can authorize the violation of one principle to satisfy the other.
  2.  **Inability to Adjudicate Clinical Mental States:** The procedure treats mental state (Intentional, Reckless, Negligent) as an input variable. It cannot substitute for a clinical-legal determination of capacity or intent (Case C). If the factual record is ambiguous regarding the offender's mind, the SIAP cannot assign an OGI tier and must defer to a Referee. It calculates integrity; it does not determine truth.
  3.  **Inability to Individualize Statistical Risk:** The RRF relies on validated recidivism-risk scores. The procedure cannot translate a group-based statistical probability into an individual claim of dangerousness. It accepts the score as a statutory input for efficacy but cannot validate whether the specific individual *will* reoffend. It ensures the sentence matches the *score*, not that the score matches the *person*.
