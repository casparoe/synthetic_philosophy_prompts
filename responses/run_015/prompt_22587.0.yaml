      *   *Correction:* 1936 Ayer is very strict ("strong verification"). I should mention that he softened this later, but for the thought experiment, stick to the spirit of LTL. The strong version requires conclusive verification. Uploading might only offer probabilistic verification. I should note this tension.
      *   *Check:* Did I address the "pseudo-problem" aspect?
