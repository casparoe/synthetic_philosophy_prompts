      *   *Exchange 2:* Substantivalist insists spacetime exists in the open region. Relationist argues PBC implies global relations, not local emptiness.
      *   *Exchange 3:* Substantivalist says topology is a property of the substance (spacetime). Relationist says topology only matters if it constrains relations between entities.
      *   *Exchange 4:* Substantivalist points out the concavity difference proves spacetime's physical reality. Relationist counters that the boundary conditions *are* the relational framework missing in the open case.
      *   *Exchange 5:* Final blow. Substantivalist claims victory for absolute structure. Relationist claims victory for complex relationalism.

