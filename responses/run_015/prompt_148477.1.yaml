answer: |-
  1. Substantivalist: In your empty universe, the bucket in the periodic region exhibits a concave surface while the open one remains flat, proving that spacetime geometry itself, not distant matter, dictates inertial effects.
  Relationist: That apparent difference merely reveals that your "periodic boundary" secretly introduces a global topological relation between the bucket and its own images, so rotation is still defined relative to other bodies, just non-local ones.

  2. Substantivalist: If those image buckets are mere mathematical artifacts of your coordinate choice rather than physical masses, then the concavity arises from the substantival background structure alone, leaving your relational account with nothing to grab onto.
  Relationist: Calling them artifacts begs the question, for in a multiply connected manifold, the identification of points is a physical fact that creates real relational constraints without needing an absolute container.

  3. Substantivalist: Yet if I remove the topology and leave truly infinite empty space, your relationist framework predicts no concavity at all even if the bucket spins, whereas my substantival view correctly anticipates the water climbing the walls due to absolute rotation.
  Relationist: Your prediction in that truly empty case is untestable metaphysics, whereas my claim holds that without any relational distinction—whether local matter or global topology—the concept of "spinning" literally has no meaning to generate a force.

  4. Substantivalist: The experiment distinguishes the two scenarios physically, showing that the local metric field determines the centrifugal force regardless of whether you label the cause "topology" or "absolute space," thus damaging your claim that matter is essential.
  Relationist: The metric field is simply the codification of all possible spatiotemporal relations, so acknowledging its role does not rescue substantivalism but rather confirms that geometry is nothing over and above the network of relations.

  5. Substantivalist: If geometry is merely relational, you cannot explain why the specific topology of one region forces concavity while the other does not without admitting that the manifold's structure exists independently of the bodies within it.
  Relationist: I explain it by noting that the relational properties of the manifold differ between the two cases, proving that rotation is always relative to the total system configuration, whether that system is finite or topologically closed.
