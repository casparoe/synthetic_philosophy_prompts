          *   More critically, (2) says no intention beyond text. (7) implies the agency can fill gaps based on policy/expertise. This is a standard textualist vs. Chevron tension.
          *   Is it a *contradiction*? Not necessarily. One can say "Text determines meaning; if text runs out, agency decides policy." But (1) says interpretation *aims* at meaning. (7) says where meaning is open, agency chooses. This is the classic *Chevron* vs. *Textualism* debate. Many textualists reject (7) because they believe ambiguity is a judicial responsibility to resolve using tools (canons), not delegate.
          *   However, (7) explicitly relies on "genuinely ambiguous". If (1)-(6) are applied rigorously, does ambiguity remain?
