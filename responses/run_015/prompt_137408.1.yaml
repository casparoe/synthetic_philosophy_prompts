      *   *Fixes:*
          *   For (7) vs Rest: Abandon (7) or qualify it heavily (e.g., only for technical terms). Cost: Loss of administrative flexibility/deference.
          *   For (4) vs (5): Clarify (4) to mean "external purpose" and (5) to mean "internal coherence". Cost: Risk of semantic gaming.

      *   *Single Revision:*
          *   Drop (7). It is the outlier. The rest form a coherent "Textualist with Safeguards" position. (7) introduces a non-textualist delegation of interpretive authority.
          *   What does dropping (7) preclude? You cannot claim agencies have special authority to resolve ambiguity. You must claim judges resolve all ambiguity using (1)-(6).

