          *   Refinement: (4) says "may not work out what the statute is for and then read the words so as to serve that purpose better". (5) says "purpose that is evident from the text itself... settles which of the two is correct". The difference is the source of the purpose (external vs. internal) and the effect (serving better vs. choosing between readings). This is a nuanced distinction but potentially unstable.

      *   *Tension C: (3) vs (1)/(2).*
          *   (1) Meaning is ordinary public meaning. (3) Allows deviation if result is absurd.
