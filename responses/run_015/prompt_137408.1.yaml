          *   This looks like a contradiction. (4) bans purposive construction. (5) allows purpose to settle ambiguity.
          *   Distinction: (4) bans deriving purpose *extratextually* or using purpose to *override* text. (5) uses purpose *evident from the text itself*.
          *   Is this coherent? Yes, if "purpose evident from the text" is treated as part of the context/meaning (1) rather than an external goal. But the line is thin. If purpose settles ambiguity, is that not purposive construction?
