      *   (1) Ordinary public meaning at enactment, context matters, not literalism, not private expectations.
      *   (2) No legislative intention beyond text, legislative history is irrelevant.
      *   (3) Absurdity/scrivener's error exceptions allowed (narrowly).
      *   (4) No purposive construction (cannot read words to serve a purpose better).
      *   (5) Purpose evident from text settles genuine openness between two readings.
