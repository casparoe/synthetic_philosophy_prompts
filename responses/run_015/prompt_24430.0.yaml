      *Decision:* I will take a firm stand: The demandingness objection **succeeds** against maximizing act consequentialism because it violates the "Ought Implies Can" principle when "Can" is understood psychologically. However, a **Satisficing Consequentialism** is the most coherent survivor, provided it is grounded not in arbitrariness, but in the normative significance of personal integrity.

      *Actually, let's look at the "confused picture of ought" angle.* Some (like Singer) say our intuitions are wrong. Morality *is* demanding.
