answer: |-
  The demandingness objection remains the most persistent and intuitive critique of consequentialism. It posits that because classical act consequentialism requires agents to maximize the good, it demands excessive self-sacrifice, leaving no room for personal projects, relationships, or leisure once basic needs are met. The agent becomes a mere conduit for value, obligated to donate, work, and strive until the marginal utility of their resources equals that of the neediest recipient. The question before us is whether this reveals a fatal flaw in consequentialism or merely exposes our selfish intuitions to the harsh light of moral truth.

  After weighing the available defenses, I argue that the demandingness objection **succeeds** as a refutation of maximizing act consequentialism. It demonstrates that the act-consequentialist picture of the moral "ought" is indeed confused, specifically regarding the relationship between moral evaluation and moral agency. However, consequentialism is not thereby annihilated. The version that survives this onslaught is not satisficing consequentialism, nor is it standard rule consequentialism, but rather **Motive Consequentialism**. This view preserves the consequentialist criterion of rightness while rejecting the demanding act-consequentialist decision procedure, thereby reconciling the demands of the good with the psychological limits of the agent.

  To understand why the objection succeeds against the standard view, we must first examine the "Ought Implies Can" argument. Proponents of consequentialism often dismiss the demandingness objection by claiming that agents *can* physically sacrifice more than they do; therefore, the obligation stands. This relies on a metaphysical interpretation of "can." However, a plausible moral theory must account for moral psychology. If a moral theory demands a level of saintliness that is psychologically unsustainable for normal human beings, it ceases to function as a guide for conduct and becomes a tool for condemnation. As Bernard Williams argued, consequentialism threatens personal integrity by alienating the agent from their own projects. If the moral "ought" requires the negation of the self that acts, the "ought" loses its grip. The act-consequentialist treats the agent as a neutral vessel for utility, ignoring that morality is a practice undertaken by beings with specific psychological constitutions. Therefore, the objection succeeds in showing that maximizing act consequentialism violates a robust, psychological interpretation of "Ought Implies Can."

  Defenders of consequentialism have attempted to blunt this force through **Satisficing Consequentialism**. This view suggests that agents are only required to produce "good enough" outcomes, not the best possible ones. While this immediately alleviates the demandingness problem, it faces a severe theoretical hurdle: arbitrariness. If I can produce more good at no cost to myself, why is it morally permissible to stop? Without an independent account of why "good enough" is the cutoff, satisficing appears to be an ad hoc retreat designed solely to accommodate intuition. It sacrifices the theoretical elegance of maximization without offering a principled reason for the limit. Consequently, while satisficing avoids the demandingness bullet, it does so by wounding the core logic of consequentialism, rendering it an unstable survivor.

  A more robust defense lies in the **Non-sacrificial** or **Indirect** strategies, specifically distinguishing between the *criterion* of rightness and the *decision procedure*. This is where Motive Consequentialism, championed by theorists like Robert Adams, offers the most viable path forward. Motive Consequentialism holds that the rightness of an act is determined by the consequences of the motives from which it flows, rather than the consequences of the act itself. We ought to cultivate motives (such as love for family, dedication to personal art, or loyalty to friends) that, generally speaking, lead to the best outcomes. Crucially, having these motives requires that we do not constantly calculate consequences or sacrifice our projects for the greater good. A parent who constantly calculates whether feeding their child is the optimal use of resources for global welfare lacks the motive of parental love, and a world without such love would be worse off.

  This view survives the demandingness objection because it shifts the locus of the moral "ought." The act-consequentialist confuses the *criterion* of the good (maximizing value) with the *method* of pursuing it (constant maximization). Motive Consequentialism accepts the former but rejects the latter. It acknowledges that the "ought" of morality is addressed to human agents who require stable, non-instrumental attachments to function well. By internalizing the limits of human psychology into the theory itself, it respects the "Ought Implies Can" principle without resorting to the arbitrariness of satisficing.

  Critics might argue that this is merely rule consequentialism in disguise or that it collapses back into act consequentialism. If I know that acting on my personal motive yields less good than a calculated sacrifice in a specific instance, shouldn't I override the motive? The Motive Consequentialist answers no, because the value lies in *having* the motive, not just in the isolated acts it produces. To override the motive whenever calculation suggests it is to erode the motive itself, leading to worse long-term consequences. Thus, the demandingness is absorbed at the level of character cultivation, not at the level of every individual action.

  In verdict, the demandingness objection is fatal to maximizing act consequentialism. That theory rests on a confused picture of the moral "ought," treating agents as abstract utility-maximizers rather than embodied psychological beings. The "ought" cannot demand the impossible erosion of the self without losing its normative force. However, consequentialism need not be discarded entirely. **Motive Consequentialism** emerges as the surviving version. It retains the core consequentialist insight—that value and outcomes matter fundamentally—while acknowledging that the best way to realize that value is through agents who are not constantly demanded to sacrifice their integrity. The objection succeeds in killing the act-theory, but in doing so, it births a more psychologically realistic and sustainable consequentialism.
