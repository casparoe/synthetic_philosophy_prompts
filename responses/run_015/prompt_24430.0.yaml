      *   *Non-sacrificial/Subjective/Indirect Strategies:* Rule consequentialism, motive utilitarianism, or distinguishing between decision-procedures and criteria of rightness.
          *   *Critique:* These often save the theory by changing the subject. If the *criterion* of rightness is still maximizing, the demandingness remains at the fundamental level, even if the *guide* is relaxed.

