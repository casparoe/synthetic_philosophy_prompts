      *   *Better Verdict:* I will argue that the demandingness objection is **fatal to maximizing act consequentialism** but **survivable for Rule Consequentialism**. The objection rests on a plausible view of moral psychology: morality must be livable. "Ought implies can" should be interpreted psychologically, not just metaphysically. Therefore, the version that survives is Rule Consequentialism, which internalizes the limits of human psychology into the rules themselves.

