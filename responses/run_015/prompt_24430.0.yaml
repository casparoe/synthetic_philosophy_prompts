  2.  **Deconstruct the Demandingness Objection:**
      *   *What is it?* Classical utilitarianism/consequentialism seems to require agents to maximize the good, often at the cost of their own projects, relationships, and well-being, up to the point of marginal utility. This seems too demanding for a plausible moral theory.
      *   *Why is it a problem?* It conflicts with common moral intuitions (supererogation, personal integrity, special obligations).

  3.  **Evaluate the Responses (The "Weighing"):**
      *   *Ought Implies Can:* If morality demands too much, humans literally *cannot* do it. Therefore, it's not a moral obligation.
