answer: |-
  There is no single, canonical term in philosophy or science that captures this specific configuration exactly as you describe it. However, your observation identifies a robust convergence of principles appearing across evolutionary biology, cybernetics, economics, and machine learning.

  The phenomenon you describe is a synthesis of several established concepts, none of which fully capture the *inverse* relationship you have identified. The closest existing candidates are:

  1.  **Polanyi's Paradox:** (Economics/Cognitive Science) "We can know more than we can tell." This captures the existence of unarticulable competence but does not inherently claim that articulation *damages* the competence.
  2.  **The Centipede's Dilemma:** (Psychology) Based on the poem where a centipede freezes when asked which leg moves after which. This captures the performance degradation caused by explicit monitoring (Explicit Monitoring Theory), but it is usually framed as a psychological error in individuals, not a structural feature of optimization systems.
  3.  **The Explainability-Accuracy Trade-off:** (Machine Learning) The empirical observation that more interpretable models often have lower predictive power. This is specific to algorithms and lacks the evolutionary/historical dimension.
  4.  **Hayek's Knowledge Problem:** (Economics) The argument that central planners cannot possess the distributed, local knowledge held by market participants. Imposing a "comprehensible" plan degrades the system's efficiency. This is very close but focuses on information distribution rather than the representational format itself.
  5.  **Ashby's Law of Requisite Variety:** (Cybernetics) To control a system, the controller must have as much variety (complexity) as the system. "Understanding" often implies compression (reducing variety). If compression reduces variety below the requisite threshold, control/competence fails.

  Because no single term unifies these into the specific tension you describe—where opacity is not a temporary deficit but a *functional requirement* for competence—I propose we define this configuration as **Requisite Opacity**.

  Below is a precise definition, an analysis of its boundary conditions, and how it differs from adjacent concepts.

  ---

  ### Proposed Concept: Requisite Opacity

  **Definition:**
  **Requisite Opacity** is a systemic state in which high-fidelity competence depends on high-dimensional, distributed, or subsymbolic processing, such that any attempt to compress the system's logic into a low-dimensional, human-intelligible representation (understanding) necessarily discards the information required for that competence. In systems exhibiting Requisite Opacity, transparency is not merely unavailable; it is antagonistic to performance.

  **The Core Mechanism:**
  The tension arises from **Information Compression**. "Understanding" requires reducing complex data into causal rules, features, or narratives (compression). In complex adaptive systems (evolutionary, neural, market), the "signal" that drives success is often distributed across high-dimensional correlations that do not map to human semantic categories. Therefore, the act of making the system "understandable" forces a loss of variance (Ashby's Variety) that degrades the system's ability to navigate its environment.

  ### Boundary Conditions

  For Requisite Opacity to apply, the following conditions must be met:

  1.  **High-Dimensional Optimization:** The system must be solving a problem where the solution space is too complex to be mapped by linear or symbolic rules (e.g., protein folding, image recognition, ecological adaptation).
  2.  **Subsymbolic Processing:** The mechanism of success must rely on weighted interactions, statistical correlations, or evolutionary retention rather than explicit logical deduction.
  3.  **The Compression Penalty:** There must be empirical evidence that imposing interpretability constraints (forcing the system to "explain" itself or follow explicit rules) reduces the primary performance metric.
  4.  **Selection Pressure:** The system must have been tuned by a selection process (natural selection, gradient descent, market competition) that optimizes for *outcome* rather than *intelligibility*.

  **Where it Applies:**
  *   **Deep Learning:** Neural networks where internal weights correspond to no human concept.
  *   **Evolutionary Biology:** Adaptations where the "design" is a local optimum in a fitness landscape that geneticists cannot fully map.
  *   **Complex Markets:** Price mechanisms that aggregate information no single agent understands.
  *   **Traditional Ecological Knowledge:** Practices developed over generations that work but contradict modern scientific models (until the science catches up to the complexity).

  **Where it Does Not Apply:**
  *   **Mechanical Systems:** A clock works *because* its design is comprehensible. Making it opaque would not help it tell time.
  *   **Simple Algorithms:** Sorting data does not require opacity; a transparent rule is as effective as a black box.
  *   **Ethical/Legal Domains:** Even if an opaque system is more competent, Requisite Opacity describes the *functional* tension, not the *normative* acceptance. In law, we may reject Requisite Opacity (demanding due process) even if it reduces efficiency.

  ### Distinctions from Adjacent Concepts

  You asked how this differs from ordinary skilled practice and overconfidence. The distinctions are critical:

  #### 1. Vs. Tacit Knowledge (Polanyi)
  *   **Tacit Knowledge:** Implies the knowledge resides *within* an agent who *could* potentially articulate it with enough effort, or that the limitation is linguistic. It suggests the knowledge is *personal*.
  *   **Requisite Opacity:** Implies the knowledge is *structural* and *distributed*. It is not that the breeder "cannot tell" you the rule; it is that **no rule exists** in a format that human language can capture without loss. The "knowledge" is in the weights of the network or the gene frequencies, not in a mind.

  #### 2. Vs. The Centipede's Dilemma (Explicit Monitoring)
  *   **Centipede's Dilemma:** Describes a psychological failure mode where an expert "chokes" by focusing on automatic processes. This is temporary and individual.
  *   **Requisite Opacity:** Describes a permanent structural constraint. It is not that the engineer "chokes" when analyzing the code; it is that the code *ceases to function optimally* if rewritten to be analyzable. The degradation is in the system, not the observer.

  #### 3. Vs. Overconfidence (The Dunning-Kruger Effect)
  *   **Overconfidence:** Is an epistemic error where an agent believes they understand more than they do.
  *   **Requisite Opacity:** Is an epistemic limit where the agent correctly believes they *do not* understand, and acknowledges that trying to understand would break the tool. It is a humble acceptance of instrumentalism over realism.

  #### 4. Vs. "Black Box"
  *   **Black Box:** Merely describes a system whose internal workings are unknown. It implies a temporary state of ignorance that *could* be resolved.
  *   **Requisite Opacity:** Implies that resolving the ignorance (making it a "glass box") would destroy the utility. The box *must* remain black to function.

  ### Summary of the Tension

  The tension you have identified is essentially **The Map-Territory Relation pushed to its limit.**

  In simple systems, the map (theory/understanding) can approximate the territory (reality) well enough to navigate it. In systems governed by **Requisite Opacity**, the territory is so high-dimensional that any map detailed enough to be useful is as complex as the territory itself. Since a "map" by definition must be simpler than the territory to be understood by a human, **a comprehensible map is, by definition, insufficient for navigation.**

  Therefore, competence requires navigating the territory directly (via evolutionary selection or statistical learning) without the mediation of a map (theory/understanding). Injecting the map forces the system to ignore the terrain features that do not fit the map's legend, leading to failure.

  ### Conclusion

  You have identified a fundamental constraint in complex systems epistemology. While fragments of this idea exist in cybernetics (Ashby), economics (Hayek), and AI (Explainability Trade-offs), the unified concept is best termed **Requisite Opacity**.

  It differs from tacit knowledge because it is structural rather than personal; it differs from overconfidence because it acknowledges the limit rather than denying it; and it differs from standard "black box" concerns because it posits that opacity is a **feature** required for high-fidelity optimization, not a bug to be fixed. Recognizing Requisite Opacity allows us to stop trying to force complex adaptive systems to justify themselves in human-reasonable terms when those terms are the very thing limiting their potential.
