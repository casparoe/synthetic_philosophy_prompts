answer: |-
  You have identified a genuine and significant gap in how we talk about historical and systemic change. Your intuition is correct: the farmland scenario is structurally different from the theatre hall scenario, even though both feel like "history getting stuck."

  The theatre hall is a case of **absorbing state lock-in** (classic path dependence). The system enters a state from which it does not exit, even if a better state exists. The history determines the *outcome*.

  The farmland is a case of **metastable transience**. The system enters a state that *feels* permanent to an observer within a specific timeframe, but is actually a temporary plateau on the way to a determined outcome. The history determines the *trajectory* and the *timing*, but not the ultimate *attractor*.

  There is no single, universally recognized historical term for this second phenomenon that carries the same weight as "path dependence." However, concepts from systems theory, ecology, and physics come close, and each falls short in the specific way you suspect. Here is an analysis of the nearest concepts, why they fail to capture your specific worry, and a proposal for how to define the boundary.

  ### 1. The Nearest Existing Concepts

  **Equifinality**
  In systems theory, *equifinality* describes a situation where different initial conditions lead to the same final state. This fits your farmland perfectly: shrub-first or tree-first, both end as oak-hickory.
  *   **Where it falls short:** Equifinality is a static property. It describes the start and end points but ignores the *duration* of the intermediate state. It implies the path doesn't matter. But in your example, the path matters immensely for fifteen years. Equifinality has no vocabulary for the "stuckness" of the shrub phase. It treats the fifteen years as noise, whereas to the human observer, the fifteen years *are* the signal.

  **Metastability**
  In physics and ecology, a *metastable* state is a stable configuration that is not the lowest-energy state (the "true" equilibrium). A ball resting in a small dip on the side of a hill is metastable; it will stay there until a kick pushes it over the rim to roll to the bottom.
  *   **Where it falls short:** This accurately describes the mechanism (the shrubland is the small dip; the oak forest is the bottom of the hill). However, "metastability" is a technical description of the system, not the history. It doesn't capture the *contingency* of the seed arrival. It explains why the system pauses, but not why the pause feels like a divergence to the observer.

  **Hysteresis**
  This refers to systems where the output depends not only on the input but on the history of the input (often involving lag).
  *   **Where it falls short:** Hysteresis is the bridge that blurs your two cases. If the invasive shrub alters the soil chemistry (nitrogen fixation, etc.) such that the oak forest *cannot* grow as well as it would have otherwise, the system has moved from metastability to hysteresis. The endpoint has now changed. Hysteresis is the mechanism by which your second case *becomes* your first case.

  ### 2. The Missing Concept: Horizon-Locked Contingency

  The reason existing terms feel insufficient is that they describe the *system*, while your observation is about the *observer*. The "stuckness" in the farmland case is not an absolute property of the land; it is a relational property between the land's timescale and the human lifespan.

  I propose calling this phenomenon **Horizon-Locked Contingency**.

  **Definition:** A historical or ecological process where the final state is structurally determined (convergent), but the intermediate trajectory is contingent on early accidents. The "lock-in" effect arises because the duration of the contingent intermediate state exceeds the relevant planning or observational horizon of the actors involved.

  **How it differs from Path Dependence:**
  *   **Path Dependence:** The accident changes the *destination*. (The theatre stays in the bad hall forever).
  *   **Horizon-Locked Contingency:** The accident changes the *experience* of the journey. (The land is shrubland for a human lifetime, even if it is forest for a geological lifetime).

  **Why the distinction survives scrutiny:**
  You worried that if you describe outcomes coarsely enough, everything is inevitable. This is true, but it is analytically useless. History is not studied at the heat-death of the universe scale; it is studied at the scale of human consequence.
  If a policy delay causes a recession that lasts fifteen years, but the economy recovers fully in year sixteen, a path-dependence theorist might say "the outcome was inevitable." A Horizon-Locked theorist says "the fifteen years of suffering were contingent." The distinction lies in **where the cost is borne**. In path dependence, the cost is permanent inefficiency. In horizon-locked contingency, the cost is temporal displacement.

  ### 3. Boundary Cases and the Soil Problem

  You raised the crucial boundary case: *What if the temporary state alters the soil so the expected endpoint is no longer what it would have been?*

  This is the tipping point between the two concepts.
  *   **Pure Horizon-Locked Contingency:** The shrub dies, the soil remains neutral, the oaks arrive late but thrive exactly as they would have otherwise. The history is a delay.
  *   **Hysteretic Path Dependence:** The shrub fixes nitrogen, changing the soil chemistry. The oaks arrive but grow poorly, or ash trees take over instead. The history has altered the attractor.

  In reality, most systems exist on a spectrum between these two. The "invasive shrub" example is likely sliding toward path dependence (hysteresis) because biological legacies rarely vanish without a trace. However, the conceptual distinction remains vital: **Is the system resisting a change of state (metastability), or has the system changed its definition of the target state (hysteresis)?**

  ### 4. The Philosophical Endpoint: Does it count?

  You asked: *Should an endpoint that nobody alive will see count as an endpoint at all?*

  From the perspective of **History**, the answer is **no**.
  From the perspective of **Ecology** or **Geology**, the answer is **yes**.

  This is the crux of your frustration. "Path Dependence" is a historical/sociological term, so it implicitly assumes a human horizon. If the "lock-in" lasts 10,000 years but humans are gone in 1,000, it wasn't a lock-in for history; it was just the state of the world.

  Therefore, **Horizon-Locked Contingency** is actually the more historically significant phenomenon. If the "true" endpoint is 200 years away, but the "transient" state lasts 150 years, then for all political, economic, and social purposes, **the transient state is the reality.**

  To call it "temporary" is technically correct but practically misleading. If I am a farmer trying to decide what to plant, and the land will be shrubland for my entire life and my children's lives, the fact that it will *eventually* be oak forest is irrelevant. The "accident" of the seed arrival has determined the *effective* reality, even if it hasn't determined the *theoretical* reality.

  ### Summary

  You have identified the difference between **Outcome Contingency** (Path Dependence) and **Trajectory Contingency** (Horizon-Locked Contingency).

  *   **Path Dependence** says: "We are in the wrong room, and we will never leave."
  *   **Horizon-Locked Contingency** says: "We are in the waiting room. We will eventually be called, but the wait is long enough that we might as well build a house here."

  The distinction matters because the remedies are different. To fix Path Dependence, you must break the lock (subsidize the move to the new hall). To fix Horizon-Locked Contingency, you must accelerate the transition (plant the oak saplings manually to bypass the shrub phase). Confusing the two leads to policy errors: trying to "break the lock" on a system that is simply moving slowly, or waiting for "natural succession" in a system that is actually permanently stuck.

  If you need a label to use in writing, I recommend **Transient Trajectory Dependence**. It signals that the *path* is dependent on history, even if the *destination* is not. It preserves the "dependence" framing you are familiar with while strictly limiting it to the transient phase.
