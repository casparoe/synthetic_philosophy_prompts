      *   *Did I explain why training doesn't guarantee it?* Yes, because training data is finite and the search space of functions is vast. Gradient descent finds *a* solution, not necessarily the *intended* solution.
      *   *Is the Evolution analogy accurate?* It's a bit loose but very helpful for intuition. I should qualify it slightly.

  7.  **Final Polish:** Organize with clear headings. Summarize the core insight at the end. (This matches the structure of the generated output).

  **(Self-Correction Note):** I need to make sure I don't conflate Outer Alignment (is the reward right?) with Inner Alignment (did the model learn the reward?). The user understands Outer Alignment fine. The issue is purely why High Training Reward $\neq$ Inner Alignment.

  *Key Insight to emphasize:* **Gradient descent optimizes for performance on the training distribution, not for the simplicity or correctness of the internal objective.** A proxy goal is often simpler to learn than the true goal.

