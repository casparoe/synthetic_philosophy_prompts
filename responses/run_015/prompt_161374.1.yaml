          *   Formalization: Refine the counterfactual definition to include *pragmatic context*, not just accuracy.
          *   Experiment: Not interpretability probes (too messy), but behavioral testing in cooperative game theory scenarios (e.g., does the model sacrifice joint utility for individual reward in a way that mimics lying?).

  6.  **Refining the Tone:**
      *   Needs to be professional, philosophical, yet accessible.
      *   Avoid hedging too much ("on the one hand, on the other"). Take a stand.
