      *   *Core Issue:* It targets *Externalist* theories of knowledge (specifically Reliabilism). Reliabilism says: You know $P$ if your belief that $P$ is produced by a reliable process. You don't need to *know* the process is reliable to know $P$.
      *   *The Trap:* If I don't need to know the process is reliable to get knowledge, I can use the outputs of that process to prove the process is reliable. This makes gaining knowledge of reliability too "easy."
      *   *Why is it bad?* It violates the intuition that you can't just pull justification out of thin air. It allows "closure" to generate knowledge of reliability without any independent check.

