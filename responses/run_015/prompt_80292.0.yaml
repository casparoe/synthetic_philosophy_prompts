  # JOINT STATEMENT ON THE STRUCTURE OF ONTOLOGICAL DEPENDENCE
  **Prepared by:** The Metaphysics Seminar Adversarial Collaboration Group  
  **Date:** October 26, 2023  
  **Subject:** Clarifying the Dispute Regarding Fundamentality and Grounding

  ## I. SHARED COMMITMENTS
  *Before delineating our disagreements, we affirm the following claims as common ground. We agree that these claims are necessary prerequisites for the debate to be substantive rather than merely verbal.*

  1.  **Distinctness from Causation:** We agree that "grounding" (or ontological dependence) is distinct from causation. Causation relates events across time; grounding relates facts/entities across ontological levels (synchronically or atemporally).
  2.  **Determination:** We agree that if fact $A$ grounds fact $B$, then $A$ determines $B$ in a non-causal sense. The obtaining of $A$ metaphysically necessitates (or probabilistically constrains) the obtaining of $B$.
  3.  **Explanatory Role:** We agree that grounding claims are intended to capture objective explanatory structures in the world, not merely epistemic relations between our beliefs. The debate is about the *world*, not just our *models* of the world.
  4.  **Transitivity (Provisional):** We agree to proceed under the working hypothesis that grounding is transitive (if $A$ grounds $B$, and $B$ grounds $C$, then $A$ grounds $C$), though we acknowledge this is a point of potential friction regarding coherentist structures.
  5.  **The Goal of the Debate:** We agree that the purpose of this inquiry is to determine whether reality requires an "ontological bottom" to be intelligible, or whether a "bottomless" reality is metaphysically coherent.

  ---

  ## II. POINTS OF CONTENTION
  *The following table isolates the precise metaphysical claims where our positions diverge. Each statement is phrased to be acceptable to the proponent of that view without begging the question against the opponent.*

  | Issue | Fundamentality Realist (Foundationalist) Position | Anti-Fundamentalist (Infinitist/Deflationist) Position |
  | :--- | :--- | :--- |
  | **1. Well-Foundedness** | The grounding relation is **well-founded**. Every chain of grounds must terminate in a fact that is itself ungrounded. | The grounding relation is **not necessarily well-founded**. Chains of grounds may continue infinitely without termination. |
  | **2. The Status of 'Fundamental'** | "Fundamental" picks out a **natural ontological category**. To be fundamental is to exist in a distinct mode (ungrounded existence). | "Fundamental" is a **relative or pragmatic label**. To call something fundamental is to say it is the current terminus of inquiry, not that it lacks a ground in reality. |
  | **3. Acyclicity** | Grounding is strictly **acyclic**. No fact can ground itself, directly or indirectly. Cycles render explanation impossible. | Grounding may permit **cycles** (coherentism). Mutual dependence is coherent if the system as a whole is stable, even if no single node is independent. |
  | **4. Explanatory Power** | An infinite regress of grounds is **vicious**. It defers explanation forever and never actually explains anything. | An infinite regress of grounds is **benign**. Explanation can be distributed across an infinite chain without requiring a base. |

  ---

  ## III. DIAGNOSTIC CRUXES
  *We have identified three specific sub-questions (cruxes). Settling these would significantly shift the dialectic. For each crux, we propose a concrete case or argument that bears on the issue, along with our respective predictions.*

  ### Crux 1: The Coherence of "Dense" Grounding
  **The Question:** Is a metaphysical structure analogous to the real number line (dense, with no adjacent points) coherent for ontological dependence?
  **The Case:** *The Gunky Object.* Imagine a material object that is infinitely divisible. Every part of the object is composed of smaller parts. There are no mereological atoms (simples).
  *   **Realist Prediction:** This scenario is metaphysically impossible or incomplete. If composition is a grounding relation, there *must* be simples at the bottom. If physics posits none, our metaphysics must posit "ontological atoms" distinct from physical atoms, or the object does not truly exist.
  *   **Anti-Fundamentalist Prediction:** This scenario is coherent. The object exists in virtue of its parts, which exist in virtue of their parts, *ad infinitum*. The existence of the whole is fully explained by the infinite series of parts, with no remainder requiring a "bottom" layer.
  *   **Resolution Condition:** If the Realist can demonstrate a logical contradiction in "gunky" ontology (beyond mere counter-intuitiveness), the Anti-Fundamentalist concedes. If the Anti-Fundamentalist can provide a formal model of dense grounding that preserves determinacy, the Realist concedes that well-foundedness is not conceptually necessary.

  ### Crux 2: The "Grounding Grounding" Regress
  **The Question:** Do facts about grounding themselves require grounding? (e.g., Does the fact *<that A grounds B>* require a ground?)
  **The Case:** *The Meta-Grounding Chain.* If *<A grounds B>* is a fact, is it grounded in A and B? Or does it require a further fact *<G grounds (A grounds B)>*?
  *   **Realist Prediction:** Grounding facts are either ungrounded (primitive) or grounded in the relata (A and B). If they require further grounds, we face a vicious regress that undermines the initial grounding claim. We must stop the regress to secure the connection.
  *   **Anti-Fundamentalist Prediction:** Grounding facts can be grounded in further grounding facts infinitely. The connection between A and B is secured by the structure of the chain itself, not by a primitive "glue" at the bottom. The regress is not vicious because each step is locally explanatory.
  *   **Resolution Condition:** If it can be shown that local explanation without global termination fails to secure *modal necessity* (i.e., without a base, B could have failed to obtain even if A obtained), the Anti-Fundamentalist position weakens.

  ### Crux 3: The Definition of "Grounding" (Verbal vs. Substantive)
  **The Question:** Is well-foundedness built into the *definition* of grounding, or is it a *substantive thesis* about grounding?
  **The Case:** *Conceptual Analysis.* We analyze the sentence: "X is fully grounded in Y."
  *   **Realist Prediction:** This is a **substantive thesis**. We agree on the concept (non-causal determination), but disagree on the structure of reality. We claim reality *must* be well-founded.
  *   **Anti-Fundamentalist Prediction:** This is partially **verbal**. If "grounding" is defined by Realists as "well-founded determination," then Anti-Fundamentalists deny the existence of "grounding" but affirm "dependence." We agree on the dependence structure; we disagree on the label.
  *   **Resolution Condition:** If both sides agree to use the term **"Ontological Dependence"** for the generic relation and reserve **"Grounding"** for the well-founded specific, we can determine if we disagree on the *structure of dependence*. If we still disagree on whether Dependence must be well-founded, the dispute is substantive.

  ---

  ## IV. NOTE ON VERBAL DISPUTE
  *Upon analysis of Crux 3, we acknowledge a significant risk of verbal disagreement.*

  It appears that a portion of our dispute stems from the **Realist tendency to build well-foundedness into the definition of grounding.**
  *   If the Realist defines Grounding = *Well-Founded Determination*, then the Anti-Fundamentalist claim "There is grounding but no foundation" is a contradiction in terms.
  *   However, if we define Grounding = *Non-Causal Determination* (neutral on well-foundedness), the dispute becomes substantive: **Is all Non-Causal Determination well-founded?**

  **Agreement on Path Forward:** We agree to treat the dispute as **substantive** regarding the structure of *Ontological Dependence*. We will suspend the term "Fundamental" where possible, replacing it with **"Ungrounded Terminus."**
  *   **Realist Claim:** Every chain of Ontological Dependence terminates in an Ungrounded Terminus.
  *   **Anti-Fundamentalist Claim:** Some (or all) chains of Ontological Dependence do not terminate in an Ungrounded Terminus.

  *Signed,*  
  *The Fundamentality Realists*  
  *The Anti-Fundamentalists*
