answer: |-
  You have put your finger on a genuine structural problem in epistemology and the philosophy of science, and you are quite right to sense the shadow of social choice theory falling across it. The phenomenon you describe does not have a single, universally recognised label in the specific context of amateur history, but it is well-documented in decision theory and the philosophy of science under imported terminology.

  Here is the breakdown of what this thing is, where its edges lie, and whether the Bayesian fix holds water.

  ### 1. Does it have a name?

  In decision theory and economics, the first version of your scenario (the spoiler effect) is a violation of the **Independence of Irrelevant Alternatives (IIA)**. This principle states that if option A is preferred to option B, introducing a third option C should not reverse that preference. When it does, the choice is said to be **menu-dependent**.

  The second version (A > B > C > A) is a **Condorcet Cycle** (or preference cycle).

  However, since you are asking about *explanations* rather than *policies* or *candidates*, these terms feel slightly imported. In the philosophy of science, this is often discussed under the heading of **Theory Choice**. The specific difficulty you are identifying—that the 'goodness' of an explanation is not an intrinsic property but a relational one depending on the contrast class—is sometimes called **Contrastive Explanation**, though that usually refers to explaining 'P rather than Q'.

  Since there is no single sticky phrase for this exact epistemic phenomenon, and you authorised me to coin one if necessary, I propose we call this **Explanatory Menu Dependence**.

  **Definition:** *Explanatory Menu Dependence occurs when the ranking of two competing hypotheses (H1 and H2) is reversed or rendered indeterminate solely by the addition or removal of a third hypothesis (H3) from the set of available candidates, despite no change in the evidence supporting H1 or H2.*

  This distinguishes it from general underdetermination (where evidence is insufficient to pick *any* winner) and from theory-ladenness (where the evidence itself shifts). Here, the evidence is fixed; the *ordering mechanism* is unstable.

  ### 2. How near is the Social Choice analogy?

  It is extremely near. In fact, it is likely the most robust way to model what is happening in your history arguments.

  In social choice theory, we try to aggregate the preferences of many *voters* into a single social ranking. In Inference to the Best Explanation (IBE), a single historian (or community) tries to aggregate several *epistemic virtues* into a single judgement of 'best'.
  *   **The Voters:** The virtues (simplicity, consilience, fit with documents, lack of ad hoc assumptions).
  *   **The Candidates:** The explanations (A, B, C).
  *   **The Election:** The selection of the 'Best' explanation.

  The philosopher Samir Okasha, in his paper *'Theory Choice and Social Choice: Kuhn versus Arrow'* (2011), demonstrated that if we treat epistemic virtues as voters, we run straight into **Arrow's Impossibility Theorem**. Arrow proved that no ranking system can satisfy a set of reasonable conditions (including IIA and non-dictatorship) simultaneously.

  **Where the analogy holds:**
  It explains why your historians stall. If 'Fit' votes for A > B, 'Simplicity' votes for B > C, and 'Context' votes for C > A, there is no transitive winner. The 'will of the virtues' is incoherent.

  **Where the analogy breaks:**
  In voting, preferences are usually taken as given and subjective. In history, the virtues are supposed to be truth-conducive. We expect 'Simplicity' to track reality, not just express a taste. Furthermore, in voting, one person one vote is standard. In explanation, we do not know the weighting. Does 'Fit with documents' outweigh 'Simplicity' by 2:1 or 10:1? The lack of a fixed exchange rate between virtues is what allows the cycle to spin.

  So, picking the best explanation *is* structurally the same operation as aggregating preferences. The instability you see is not a bug in the historians; it is a mathematical feature of any system that tries to balance multiple, conflicting criteria without a fixed conversion rate.

  ### 3. Is this a problem for Inference to the Best Explanation (IBE)?

  Yes, it is a significant one. IBE relies on the assumption that 'Best' is a monadic property—that a hypothesis carries a certain 'weight' of explanatory power that can be measured. Your observation suggests 'Better than' is fundamentally relational.

  If Explanatory Menu Dependence is rampant, then IBE cannot claim to be a logic of discovery. It becomes a rhetoric of persuasion. In your first version (the spoiler effect), C is not introduced because it is true, but because it alters the comparative landscape to favour A. This turns the introduction of hypotheses into a tactical manoeuvre rather than a search for truth.

  It implies that 'Truth' might be the goal, but 'Plausibility' is the currency, and plausibility is inherently market-dependent. If the market changes (the menu shifts), the value changes.

  ### 4. The Bayesian Fix: Solution or Change of Subject?

  You asked whether cashing out 'best explanation' as a single number, like a posterior probability $P(H|E)$, makes the menu-dependence disappear.

  **Formally, yes.**
  In Bayesianism, the probability of a hypothesis depends on its prior probability and its likelihood given the evidence. $P(A|E)$ is calculated independently of $P(C|E)$. If A is more probable than B, adding C to the set of possibilities should not mathematically reverse that inequality, provided the probabilities are normalised correctly. The 'spoiler' effect is mathematically impossible in a coherent Bayesian agent because the 'votes' (virtues) have already been cashed out into the prior and the likelihood.

  **Practically, it is a change of subject.**
  To assign those numbers, the historian must still make the trade-offs you described. How much does 'Simplicity' boost the Prior? How much does 'Poor Fit' lower the Likelihood?
  *   If you set the parameters such that Simplicity is worth a 10% prior boost, you have essentially fixed the exchange rate between virtues.
  *   But in the amateur history circles you are reading, those exchange rates are precisely what is unsettled.

  By moving to probabilities, you dissolve the *logical* paradox (the cycle cannot exist in a consistent probability distribution), but you do not solve the *practical* problem of how to set the numbers. The menu-dependence hides in the assignment of the priors. If the presence of C makes B look less 'simple' by comparison (a psychological contrast effect), the historian will unconsciously lower B's prior, and the spoiler effect returns through the back door.

  ### Summary

  You are observing **Explanatory Menu Dependence**, driven by a violation of the **Independence of Irrelevant Alternatives**.

  It is not merely analogous to social choice problems; it is an instance of the same mathematical structure applied to epistemic virtues rather than voters. It suggests that 'Best Explanation' is not a stable property of a hypothesis but a function of the hypothesis set.

  The Bayesian approach removes the logical contradiction but requires a precision in weighing virtues that historians rarely possess. Until they can agree on the exchange rate between 'simplicity' and 'fit', the cycling and the spoiler effects will remain. You are not reading bad history; you are watching people struggle with an impossibility theorem without knowing the maths.
