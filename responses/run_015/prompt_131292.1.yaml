answer: |-
  # Project Title: The Portability Test: Rescaling the Great Divergence

  ### The Question
  The standard formulation—"Why Britain industrialized and China did not"—asks for a cause of a singular outcome (sustained growth in income per head and mechanized industry) emerging in one unit but not another. This proposal reframes the question: **Are the candidate causes for the Great Divergence portable across contexts without dissolving the units of comparison?** The outcome variable is not "industrialization" as a binary, but the onset of sustained technological change (c. 1750–1850). The timing is contested, which is part of the problem: if the gap opens late, civilizational explanations fail; if early, regional ones do. This project tests whether the question is ill-posed because it is ill-scaled.

  ### The Problem: Trivial, Meaningless, or Ill-Scaled?
  Current literature is stuck between three objections. My supervisor argues the answer is **trivial** (coal/colonies) or **meaningless** (categories don't match). My economist colleague argues it is an **identifiability problem** (n=1: growth happened once, so causes cannot be separated from the specific case). A third view suggests this is merely old philosophy of science (contrastive explanation) rehashed.

  These objections miss the structural issue. The n=1 objection holds for the *outcome*, but not for the *causes*. If "coal" causes industrialization, it is a universal mechanism that should appear portable. If "parliamentary constraint" causes it, it should be translatable to Qing China without turning the Qing into Britain. The "trivial" objection fails because factors like coal are entangled with context (geology + transport + rights); isolating them changes the counterfactual. The "meaningless" objection is correct only if we insist on the civilizational scale. This project argues the question is not meaningless, but **ill-scaled**. It survives only if asked of regions (Yangzi Delta vs. England), not civilizations.

  ### The Method: The Portability Audit
  I will apply a **Portability Test** to the leading explanations. For any factor *F* offered as the cause of Outcome *O* in Unit *A* (Britain) rather than Unit *B* (China), I will demand a counterfactual specification: *What happens if F is present in B, holding B fixed?* or *What happens if F is absent from A, holding A fixed?*

  If specifying *F* requires changing *B* so fundamentally that it becomes *A* (e.g., turning a vast empire into a competitive states system), *F* is not a difference-maker; it is a re-description of the unit. I will audit five leading explanations: **Coal-and-Colonies**, **High-Wage Economy**, **Institutional Constraints**, **Fiscal-Military State**, and **Scientific Culture**.

  This is not a cross-country regression (which assumes comparability) nor single-archive work (which assumes specificity). It is a conceptual audit grounded in comparative regional history. I will use existing secondary literature to test the transplants, focusing on whether the "unit" holds steady when the factor moves.

  ### Schedule (Nine Months)
  *   **Months 1–3: The Audit.** Systematic review of the five leading explanations. Construct the counterfactual transplants for each. Determine which factors dissolve the unit of comparison.
      *   *Output:* Annotated matrix of explanations vs. portability status.
  *   **Months 4–6: Rescaling.** Focus on the regional level (Yangzi Delta vs. England). Test whether the factors that failed at the civilizational level become portable at the regional level.
      *   *Output:* Two case studies demonstrating improved counterfactual stability at regional scale.
  *   **Months 7–9: Synthesis.** Draft the framework. Distinguish between **Selection** (why this case from the pool?), **Transformation** (why did this one change?), and **Attribution** (why this shape?). Determine which are tractable.
      *   *Output:* Final dissertation fellowship paper (10,000 words) + methodological toolkit.

  ### Deliverable
  For the historian, this project delivers a **methodological toolkit for causal claims**. Instead of arguing "institutions matter," historians can test whether their institutional claim survives the transplant test. It also provides a revised research agenda: stop comparing "China" to "Britain," start comparing regions. If the project succeeds, it turns a metaphysical deadlock into a scalable empirical program.

  ### Failure Conditions
  1.  **Uniform Portability:** All factors pass the test (implies the civilizational scale is fine, contradicting the hypothesis).
  2.  **Uniform Failure:** No factors are portable even at the regional scale (implies the question is indeed meaningless).
  3.  **Philosophical Drift:** The project becomes purely conceptual without grounding in historical evidence (fails the history PhD requirement).

  ### Scope Risk
  The biggest risk is attempting to solve the Great Divergence rather than testing the questions. I must resist the urge to prove *why* England industrialized. The goal is to prove *which questions allow us to find out*. If I start arguing for the High-Wage Economy over Institutions, the project collapses into standard economic history.

  ### Objections
  The strongest objection is that this is **semantic game-playing**. My supervisor may argue that "dissolving the unit" is just a fancy way of saying "multicollinearity." I must show that the portability test yields different empirical prescriptions (regional vs. civilizational) than standard econometric fixes. If the portability idea collapses into "check for confounders," the project survives only as a pedagogical framework for historians wary of regressions.

