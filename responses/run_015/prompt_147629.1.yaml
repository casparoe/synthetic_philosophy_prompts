answer: |-
  **Ines Vartanian:** The no-trade theorem is a ghost haunting every contract we sign. If we share a prior and know we're rational, my willingness to sell should scream to you that I know something bad. You shouldn't buy. Yet here we are, trading volume that dwarfs global GDP. My claim is simple: for a price to be informative, somebody must be willing to lose money to the better informed. That willingness has to be paid for. Every informative market carries a subsidy to error.

  **Tomás Halvorsen:** That's the ignorance tariff again. You're assuming the counterparty is mistaken. But look at the dirty market: contracts on the city's congestion charge. The fleet operators are short. They aren't guessing; they're hedging route costs. They know their exposure better than any pundit. The price aggregates the pressure of these outside positions. It's not that the long side is stupid; it's that the short side is exposed.

  **Ines Vartanian:** Who takes the long side, Tomás? If the fleet operators know the law is coming, who buys the contract that it won't? A tourist? A speculator? If it's a speculator, they are betting against insider knowledge without the exposure. They are paying the ignorance tariff. The accuracy of the price is capped by how much error the operator is prepared to buy from them.

  **Tomás Halvorsen:** You're fixated on the bet as a zero-sum game about truth. For the hedger, it's insurance. They pay a premium to remove variance. The speculator provides liquidity for a fee. Neither needs to be wrong about the probability. The market works because their utility functions diverge, not because their priors do. The information aggregation is a by-product of ordinary risk-sharing.

  **Ines Vartanian:** Then explain the clean market. The psychology replication study. Nobody's income depends on whether ego-depletion replicates. There are no fleet operators. Yet volume exists, and the prices often predict the outcome better than polls. Where is the heterogeneity here? There are no outside exposures to hedge.

  **Tomás Halvorsen:** Time horizons. Liquidity needs. One trader needs cash before the quarter closes; another can wait for resolution. That divergence creates trade even with identical beliefs about the outcome. The price reflects the marginal utility of money across time, which correlates with conviction.

  **Ines Vartanian:** That's a polite word for gambling. In the clean market, the volume comes almost entirely from people who think they know something. If there's no hedging, the no-trade result holds unless someone is irrational. So either the market is noisy, or it runs on the overconfidence of the losers subsidizing the insight of the winners.

  **Tomás Halvorsen:** Consider the design we discussed: a credence escrow running alongside the market. Anyone registers a sealed probability estimate, never traded, just averaged and published at resolution. We compare the traded price against an unweighted poll of the same population. If my heterogeneity reply holds, the escrow should match the price roughly, because belief is distributed similarly.

  **Ines Vartanian:** If the price beats the escrow, it proves my point. The gap measures stake-weighting and the self-selection of the confident. The price is an elite instrument, not a discovery procedure. It works because the rich or the bold weight their beliefs with capital, while the escrow treats the fool equal to the expert. The price adds nothing but the ignorance tariff collected from the escrow's average Joe.

  **Tomás Halvorsen:** But if the escrow beats the price, then capital is distorting the signal. My claim is that the price adds something the escrow cannot: it forces skin in the game. It filters out cheap talk. But I owe you an answer: what does the price add besides weighting by money? If it's just money, then a heavily subsidized market should be more accurate.

  **Ines Vartanian:** Precisely. If my view holds, pouring subsidy into the clean market—buying the error—should sharpen the price. What if it turns out that the deeply subsidized clean markets are the ones that miss? What if the dirty markets, where hedging dominates, are the accurate ones?

  **Tomás Halvorsen:** Then the heterogeneity story wins. The accuracy comes from the correlation between exposure and knowledge, not the subsidy. The fleet operator knows the law because they lobbied on it. The psychology bettor knows nothing but the abstract. I concede that without exposure, the price is just a confidence contest. But you must concede that in the dirty market, the "loser" isn't ignorant. They are selling insurance.

  **Ines Vartanian:** I concede that hedging explains the volume in dirty markets. But epistemic weight still requires a loser somewhere in the chain. If the hedger pays a premium, that premium is the tariff. The price is accurate only because someone paid for the privilege of being wrong about the risk.

  **Tomás Halvorsen:** And I concede that in clean markets, the mechanism is murkier. But the price still reveals intensity of belief, not just direction. The escrow gives me the mean credence; the price gives me the variance of conviction. That is information, even if it isn't truth.

  **Ines Vartanian:** So we agree the machine runs on friction.

  **Tomás Halvorsen:** But we disagree whether the friction is heat or engine.

  **Ines Vartanian:** Then we trade.

  **Tomás Halvorsen:** Only if you're willing to lose.

  **Ines Vartanian:** Only if you're willing to hedge.

  I am moderately confident that Ines's argument regarding the necessity of a subsidy for pure speculation is sound, as it aligns with zero-sum constraints. However, I am least confident about the inference that hedging cannot itself generate epistemic authority without a distinct loser, as Tomás suggests exposure correlates with private information independently of error.

  \answer{Ines Vartanian}
