  **MeritFlow Help Center**  
  *Last Updated: Q3 Cycle 2024*

  Hi there! Thanks for choosing MeritFlow, the first platform to leverage ancient soteriological frameworks for modern utility maximization. We know merging non-self metaphysics with aggressive consequentialist KPIs can feel tricky, but our engine handles the heavy lifting. Below are top tickets from our community.

  **1. How do I track my karma if I delete my user account?**  
  Great question! This is actually our flagship feature. Traditional apps struggle with the "user account" problem because they assume a persistent self. MeritFlow utilizes *anattā* (no-self) protocol to dissolve your profile into a transient process cluster. Instead of logging karma to *you*, we log it to the causal stream currently occupying your device ID. This reduces ego-attachment overhead by 40% and ensures merit isn't hoarded by a fictional entity. You don't own your karma; you're just the temporary node processing it.

  **2. How does the app determine who counts as a "moral patient"?**  
  We use Dependent Origination mapping. Instead of drawing hard lines between beings, MeritFlow treats sentient life as a dynamic network graph. When you perform an action, our API scans the causal web to identify all affected nodes (neighbors, strangers, insects, future selves). There's no clear boundary, which means your moral responsibility is technically infinite. Don't worry! Our algorithm prioritizes high-impact edges so you don't burn out trying to optimize the entire universe. It's about scalable compassion.

  **3. Can I transfer merit to my colleagues like carbon offsets?**  
  Yes! Merit transfer (*pattidana*) is fully fungible in v2.4. If you've over-performed on mindfulness metrics but your team is lagging in ethical output, you can offload excess merit to them. This balances the collective utility curve. Think of it like a cap-and-trade system for good vibes. Just note that transferred merit incurs a 5% transaction fee due to the entropy involved in cross-stream allocation.

  **4. What happens if my consciousness splits into two successors?**  
  This is a known edge case called "Branching." If your stream of consciousness forks (e.g., via teleportation error or severe dissociative episode), MeritFlow treats both successors as probabilistic outcomes. We apply expected-value math: if Successor A has a 50% chance of enlightenment and Successor B has a 50% chance of becoming a tyrant, your current action's value is the weighted average.  
  *Note:* Rebirth logic still applies. Both branches inherit your karmic debt proportionally. We recommend avoiding teleportation until we patch the rebirth ledger.

  **5. Why did I recieve a notification that my suffering is "inefficient"?**  
  Suffering (*dukkha*) is data. If your pain isn't leading to insight or utility optimization, our system flags it as redundant. You can toggle "Noble Truths" mode to auto-convert suffering into learning points.

  Still stuck? Submit a ticket. Remember, there is no user to support, only the flow of conditions. But we're here to help!

  *MeritFlow Team*  
  *Optimizing Nirvana, One Iteration at a Time*
