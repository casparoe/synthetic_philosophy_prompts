  Draft the joint statement of an adversarial collaberation between a german-style rapid-exit advocate and a french-style fleet-retention advocate on nuclear in the energy transition. I want agreed claims — on actual generation mix figures, on grid inertia and dispatchability, on the real cost curves for extending vs replacing plants — including the stuff both sides usually gloss over but actually accept. Then the disagreements table: each side's view phrased in wording they'd sign, like whether nuclear's high capital intensity makes it a climate solution or a capital sink that crowds out faster-to-deploy renewables, and whether Germany's post-exit stability proves nuclear was never needed or just proves they quietly bought fossil backup.

  Then list the cruxes. One I think actually matters is whether "firm low-carbon capacity" is a coherent unified category spanning nuclear, hydro and long-duration storage, or if nuclear's 18-month fuel cycles and inflexible baseload profile make it structurally different from truly dispatchable firm power. Another is whether societal acceptance of nuclear is a static cultural fact — France's centralized technocratic tradition vs Germany's federal anti-nuclear movement — or a dynamic variable that policy framing can shift within one election cycle. For each crux, name a concrete empirical pattern both sides agree bears on it — say, the correlation between existing nuclear share and grid carbon intensity across EU states around 2022 — and write each camp's advance predicition about what that pattern actually shows.

  Format it as a numbered agreed-claims section, then a disagreements table, then a cruxes section with the predictions recorded in advance. Don't ask for citations or reading lists; a model without web access should be able to reason this through from general knowledge and first principles. And stay away from the tired "Chernobyl vs coal deaths" framing — I want it in the weeds, where you have to inject conceptual distinctions rather than regurgitate boilerplate you've seen in pretraining a million times.
