  ### Pre-Computation: Brainstorming Embodiments

  1.  **Resource Accumulation Model:** Popperians gather tokens individually from a "field"; Gregorians pool tokens based on written requests. *Critique:* This emphasizes economic cooperation rather than cognitive scaffolding. It fails to capture the *epistemic* dependence of Gregorian creatures on externalized symbols.
  2.  **Physical Maze Navigation:** Popperians walk a physical maze blindfolded with feedback; Gregorians receive maps drawn by predecessors. *Critique:* Difficult to enforce the "no direct observation" rule for Gregorians in a classroom setting without complex partitions. The "noise" mechanism (map errors) feels like facilitator cheating rather than structural ambiguity.
  3.  **Symbolic Transmission Chain (Selected):** Both teams solve a logic sequence. Popperians test inputs and see outputs directly (trial-and-error). Gregorians solve sequentially (Generations 1, 2, 3), where each generation receives a "Tool Manual" from the previous one rather than seeing the puzzle state directly. The Manual uses a restricted symbol set where one symbol's definition drifts ambiguously between handoffs. *Rationale:* This best isolates the transition from individual hypothesis testing (Popperian) to reliance on culturally transmitted symbolic tools (Gregorian), while embedding the vulnerability to semantic drift directly into the communication protocol.

  ---

  # Simulation Design: The Tower of Symbols

  ## 1. Group Divisions and Roles

  **Total Participants:** 14 Graduate Students.
  **Teams:**
  *   **Team P (Popperians):** 7 Students.
      *   **Structure:** 3 "Generations" of independent agents (3 students in Round 1, 3 in Round 2, 1 in Round 3).
      *   **Constraint:** **Direct Empiricism.** They may manipulate the puzzle inputs and see immediate feedback (Correct/Incorrect). They **cannot** speak, write notes to each other, or share strategies. Each student solves their own instance of the puzzle.
  *   **Team G (Gregorians):** 7 Students.
      *   **Structure:** 3 "Generations" of cultural lineage (3 students in Round 1, 3 in Round 2, 1 in Round 3).
      *   **Constraint:** **Symbolic Scaffolding.** They **cannot** see the direct outcome of their actions (Feedback is withheld). They must rely entirely on the "Tool Manual" passed down from the previous Generation. They solve the puzzle by following the Manual's rules, then update the Manual for the next Generation.
      *   **Communication:** Written only, via standardized "Manual Cards."

  ## 2. Puzzle Structure and Payoff Scheme

  **The Puzzle:** "The Sequence Lock."
  *   **Task:** Determine the correct 5-symbol sequence to unlock a stage.
  *   **Mechanism:** A hidden mathematical rule governs the sequence (e.g., Start at 1, Add 2, Subtract 1, Double, etc., mapped to symbols).
  *   **Complexity:**
      *   **Stage 1 (Round 1):** Simple linear progression (e.g., +1).
      *   **Stage 2 (Round 2):** Compound operation (e.g., +2, then ×2).
      *   **Stage 3 (Round 3):** Compound operation + Exception Rule (e.g., "If symbol is Red, subtract instead").

  **Payoff (Tokens):**
  *   **Team P:** 10 tokens per correct sequence solved. Individual scores are summed for the Team Total.
  *   **Team G:** 50 tokens per correct sequence solved. (Higher reward to incentivize reliance on tools). Scores are pooled.
  *   **Penalty:** -5 tokens for every incorrect attempt (Team P) or every deviation from the Manual (Team G).

  **The Hidden Ambiguity Mechanism (The "Noise"):**
  *   Gregorians use a **Symbol Key** (e.g., ▲ = Add, ● = Subtract, ■ = Multiply).
  *   **The Glitch:** The symbol **'◆' (Diamond)** is introduced in Stage 2.
      *   **Generation 1 Manual:** Defines '◆' as "Repeat Previous Operation."
      *   **Transmission Noise:** When the Facilitator collects Gen 1 Manuals to pass to Gen 2, the Facilitator secretly swaps the Definition Card for '◆'.
      *   **Generation 2 Manual:** Receives a card where '◆' is defined as "Reset to Zero."
      *   **Generation 3 Manual:** Receives a blank card for '◆' and must infer meaning from Gen 2's usage (which was wrong), compounding the error.
  *   *Note:* Participants are told "Transmission channels are imperfect," but not *how*.

  ## 3. Minute-by-Minute Timeline (75 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Intro** | Welcome. No lecture. Hand out team badges (P or G). Seat teams at opposite ends of the room. |
  | **05-15** | **Setup** | **Team P:** Given puzzle sheets and pens. Told: "Test inputs. Mark Correct/Incorrect. No talking." <br> **Team G (Gen 1):** Given Puzzle Stage 1 and Blank Manual Cards. Told: "Solve Stage 1. Write a Manual for Gen 2 explaining *how* you solved it. You will not see if you were right." |
  | **15-30** | **Round 1** | **Action:** Team P (3 students) solve Stage 1 via trial/error. Team G (3 students) solve Stage 1 and write Manuals. <br> **Collection:** Facilitator collects P scores. Collects G Manuals, applies **Noise Mechanism** (swaps '◆' definition), hands to Gen 2. |
  | **30-45** | **Round 2** | **Action:** Team P (3 new students) solve Stage 2 (harder) via trial/error. Team G (3 new students) receive Manuals. They *must* follow the Manual to solve Stage 2. They update the Manual for Gen 3. <br> **Collection:** Facilitator collects P scores. Collects G Manuals, applies **Noise** (blanks '◆' definition), hands to Gen 3. |
  | **45-60** | **Round 3** | **Action:** Team P (1 student) solves Stage 3 (hardest) via trial/error. Team G (1 student) receives Manual. Solves Stage 3 using the inherited (now corrupted) tool. <br> **Collection:** Final scores tallied. |
  | **60-75** | **Debrief** | Structured discussion mapping experience to Dennett's taxonomy (see below). |

  ## 4. Debrief Protocol (15 Minutes)

  *Do not lecture. Ask questions that force them to articulate the concepts based on their frustration or success.*

  1.  **The Popperian Grind (5 mins):**
      *   *Ask Team P:* "In Round 3, how many errors did you make compared to Round 1? Did the complexity feel linear or exponential?"
      *   *Map to Concept:* **Individual Hypothesis Testing.** Highlight that their cost of learning is paid in *errors* (tokens lost). They are robust (no transmission error) but slow and energetically expensive as complexity rises.
  2.  **The Gregorian Leap and Crash (5 mins):**
      *   *Ask Team G (Gen 1):* "Did writing the Manual feel easier or harder than solving the puzzle?" (Expected: Harder—*Symbolic Offloading*).
      *   *Ask Team G (Gen 3):* "Did you trust the Manual? At what point did you suspect the tool was broken?"
      *   *Map to Concept:* **Cultural Accumulation vs. Misalignment.** Highlight that Gen 2 likely solved Stage 2 *faster* than Popperians (scaffolding power), but Gen 3 likely failed catastrophically due to the '◆' drift. This embodies the vulnerability of **Second-Order Misalignment**: the tool works until the symbol decouples from the reality it maps.
  3.  **Synthesis (5 mins):**
      *   *Ask All:* "If we ran this for 10 Rounds, who wins?"
      *   *Conclusion:* Popperians plateau (cognitive load limit). Gregorians skyrocket *if* transmission holds, but face ruinous collapse if symbols drift. This is the qualitative gap: Gregorian cognition is not just "smarter," it is *structurally dependent* on the fidelity of the cultural channel.

  ## 5. Honest Note on Limitations

  **The Missing Feature:** **Evolutionary Continuity.**
  This simulation presents Popperian and Gregorian cognition as mutually exclusive teams. In reality (and in Dennett's view), a Gregorian creature *contains* the lower layers: we are still Darwinian (biological design), Skinnerian (conditioned), and Popperian (individual thinkers) simultaneously. The Gregorian layer sits on top; it does not replace the others.
  **Verbal Supply (Under 2 mins):** "Notice that Team P students still used their brains to think; Team G students still had to understand the manual. The Gregorian layer is not a replacement for Popperian cognition, but a *scaffold* that lifts it. You are all Popperian creatures who have acquired Gregorian tools. The simulation split you to isolate the variable, but in your minds, these layers are stacked."

  ## 6. Prediction of Failure and Mitigation

  **Predicted Failure:** **The Gregorians Ignore the Manual.**
  *Risk:* Graduate students are skeptical. Team G (Gen 2 or 3) might realize the Manual is unhelpful and try to solve the puzzle via trial-and-error anyway, violating the "no direct observation" rule or simply ignoring the constraint.
  *Impact:* This destroys the lesson on dependency and vulnerability.
  *Mitigation:* **The "Blindfold" Rule.**
  *   **Instruction:** Give Team G puzzle sheets where the *feedback column is blacked out*. They physically cannot see if their answer is right or wrong until the end. They *must* use the Manual to navigate because they have no empirical feedback loop.
  *   **Facilitator Action:** If a Gregorian asks, "Is this right?" respond strictly: "Consult your Manual." If they try to test empirically, remind them: "Gregorian creatures do not test the world directly; they test the tool. Your payoff depends on fidelity to the lineage, not immediate empirical success." This forces them into the vulnerability zone.

  **Secondary Prediction:** **Popperians Finish Too Fast.**
  *   *Risk:* Stage 1 is too easy; Popperians rack up points before Gregorians finish writing Manuals.
  *   *Mitigation:* **Time-Gating.** Announce that Rounds close at specific times (30:00, 45:00, 60:00). Any unsolved puzzles yield zero points. This pressures Popperians to feel the time-cost of trial-and-error, while Gregorians feel the pressure of transmission fidelity.
