answer: |-
  Here is a principle constructed to fit the shape of your seven cases, followed by the audit you requested.

  ### The Principle

  **"We can read a gender gap as evidence of preference only when the options carry equal security and status and the choice is free from necessity; otherwise, the gap records not desire but the pressure of constraint or the pull of hierarchy."**

  ### The Clauses and Their Cases

  *   **"...options carry equal security..."**
      *   **Motivated by Case 1 (Developing Country Engineering):** In the less egalitarian country, engineering is chosen for *security* (independence), not preference. The principle flags this as "pressure of constraint," preventing you from calling it "freer."
      *   **Motivated by Case 2 (Nordics):** Here, the welfare state equalizes security across careers. The principle allows you to call this "preference."

  *   **"...and status..."**
      *   **Motivated by Case 3 (Medicine Flip):** The rapid shift in medicine suggests the *status* and working conditions of the field changed, altering its attractiveness. The principle captures this as a shift in "status," explaining why the gap isn't biological.
      *   **Motivated by Case 4 (Vets):** You distrust the "people vs. things" explanation. This clause validates that distrust: if companion animals pay less or hold different status than livestock, the split is "the pull of hierarchy," not a pure trait.
      *   **Motivated by Case 6 (Male Disadvantages):** If teaching is lower status than engineering, or if workplace fatalities are the cost of male "provider" status, the principle forces you to acknowledge these as justice matters (hierarchy/constraint), resolving your incoherence.

  *   **"...choice is free from necessity..."**
      *   **Motivated by Case 5 (Multinational Hiring):** Recruiting women from economies where they *need* the wage more than local men do violates the "free from necessity" clause. It identifies the practice as converting constraint into statistics.

  ### The Sacrifice

  To use this principle, you must give up the ambivalence in **Case 7**.

  Your Case 7 intuition oscillates between "that is what freedom looks like" and "no distribution... that tracks a trait you were born with is just." This principle forces you to choose the former. If security, status, and necessity are equalized, the principle defines the remaining gap as **preference**, and therefore morally neutral. You cannot use this principle to argue that a 70–30 split under perfect conditions is inherently unjust simply because it tracks a trait. You must accept that *some* trait-based sorting is compatible with justice, provided the tracks are equally valued.

  ### Verdicts on the Unlisted Cases

  **Case 7 (The Hypothetical 70–30)**
  *   **Verdict:** Just / None of your business.
  *   **Reasoning:** Since the principle's conditions (equal security, status, no necessity) are stipulated as met, the outcome is defined as "free preference." The principle does not permit you to interrogate the *origin* of the preference (biology vs. socialization) once the structural conditions are equalized.

  **The Devaluation Case (A field becomes female, then pay/prestige drops)**
  *   **Verdict:** Injustice / Evidence of Hierarchy.
  *   **Reasoning:** This violates the "equal status" clause. If the field's value drops *because* women enter it, the paths were not equal in status. The sorting cannot be read as pure preference; it is entangled with a system that penalizes women's labor. The decline in pay proves the "pull of hierarchy" was active.

  ### The Radio Test

  Here is where you will be uncomfortable. If you print this principle, you commit yourself to saying two things on air that may feel dangerous:

  1.  **On Male Suffering:** You must explicitly frame male workplace deaths and prison populations as **gender justice issues**. The principle dictates that if men are disproportionately in dangerous or punitive conditions, the "equal security" condition is not met. You cannot treat female underrepresentation in STEM as a justice matter while treating male overrepresentation in fatalities as "just choice." You will have to say: *"Men dying at work is as much a sign of gender inequality as women being kept out of the boardroom."* Editors and segments often resist framing male disadvantage as feminist data; this principle forces you to do so.

  2.  **On Biological Essentialism:** You must defend the possibility that **biology might decide some career splits.** In Case 7, if the conditions are perfect and the gap remains, this principle requires you to say, *"At that point, the gap is no longer a political problem."* You will be accused of conceding to biological determinism. You will have to explain that accepting a biological *preference* is not the same as accepting biological *capacity*, and that justice requires equalizing the *value* of the paths, not necessarily the *number* of travelers. This is a nuanced distinction that rarely survives a radio interview intact.

  ### Summary of the Trade

  This principle repairs your incoherence on Case 6 and validates your skepticism on Cases 1, 4, and 5. It gives you a robust defense against the "Gender Equality Paradox" being used to argue against egalitarianism (by distinguishing *security* from *sorting*).

  The cost is that it limits your ability to critique outcomes that emerge from a truly level playing field. It asks you to trust that if the *value* of the work is equalized, the *distribution* of the workers is not your business. If you believe that justice requires a 50–50 split regardless of preference, this principle will not serve you. If you believe justice requires that no one chooses a path because they are pushed by need or pulled by status, this principle is yours.
