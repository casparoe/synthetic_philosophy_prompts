prompt: |-
  i'm on a city charter review commission (mid-sized city, we also run the regional water utility) and we keep circling the same fight: who gets a say on what. three live cases: whether long-term non-citizen residents can vote in municipal elections, whether an unincorporated neighborhood just outside the city limits that draws on the same aquifer gets any input into a water-rate restructure, and whether people who've lived abroad for twenty years but still own property here keep their vote. i tried to write down my actual view rather than just settling each case by gut, and i want a consistency check before i bring it back to the committee. here it is:

  1. the all-affected principle is the right starting point: the demos for a decision is everyone whose important interests are substantially affected by it.
  2. the demos has to be settled in advance and independently of the decision. you need a roll, you cant discover who was entitled to vote by seeing how things turn out, and nobody should get to resize the electorate to win.
  3. children and adults with severe cognitive disabilities are in. i'm fine with guardians or proxies casting those votes.
  4. i'm an instrumentalist about why democracy is worth having: it tracks the common good better than the alternatives, and i don't think there's a freestanding right to participate that holds regardless of outcomes.
  5. non-citizen residents: yes in municipal elections, no in national ones.
  6. future generations count, and i want an institution for them — some kind of guardian body with a suspensive veto over irreversible decisions.
  7. my own bit, which i invented and am sort of proud of: instead of a binary in/out, three tiers — full members who vote, associate members who can speak and propose but not vote, and conditional standing, where outsiders whose expected stake in a particular decision crosses a threshold get a vote on that decision and nothing else.

  all seven feel equally solid to me, which is exactly why i'm suspicious. please go through the set and tell me which pairs are actually in tension, rank those tensions by how bad they are, and for each one say which commitment has to give and what giving it up would cost me. i also want to know if any of them only look inconsistent and turn out to be fine on closer inspection — and if so, why the appearance. concrete cases please: if one of these can't deliver the verdict i actually want in the aquifer case, or in the non-citizen case, say which one and show me where it breaks. finally, is there a single revision that cleans up the most at once, and is my tiered scheme (7) helping or just making the underlying mess worse?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Member of a City Charter Review Commission in a mid-sized city that also runs a regional water utility.
      *   **Task:** Consistency check on a set of 7 philosophical/practical principles regarding voting rights and democratic participation.
      *   **Specific Cases:**
          1.  Long-term non-citizen residents voting in municipal elections.
          2.  Unincorporated neighborhood (outside city limits, same aquifer) input on water rates.
          3.  Expats (20 years abroad, own property) keeping their vote.
      *   **Goal:** Identify tensions between the 7 principles, rank them, suggest resolutions/costs, identify false alarms, test against concrete cases, and evaluate the "tiered scheme" (Principle 7).

  2.  **Analyze the 7 Principles:**
      1.  **All-Affected Principle (AAP):** Demos = everyone whose important interests are substantially affected.
      2.  **Pre-Settled Demos:** Electorate must be fixed in advance, not decided ad hoc to win.
      3.  **Inclusion of Vulnerable:** Children/severe cognitive disabilities are in (via proxies).
      4.  **Instrumentalism:** Democracy is valuable because it tracks the common good, not a freestanding right.
      5.  **Non-Citizen Residents:** Yes municipal, No national.
      6.  **Future Generations:** Guardian body with suspensive veto.
      7.  **Tiered Participation:** Full (vote), Associate (speak/propose), Conditional (vote on specific issues if stake threshold met).

  3.  **Identify Tensions (Brainstorming & Pairing):**

      *   *Tension A: AAP (1) vs. Pre-Settled Demos (2).*
          *   AAP implies the demos changes based on the issue (who is affected?). Pre-Settled implies a fixed roll regardless of the issue.
          *   *Severity:* High. This is the core theoretical conflict.
          *   *Case:* Water rates. AAP says outsiders affected by aquifer should vote. Pre-Settled says only city residents on the roll vote.
          *   *Resolution:* Principle 7 tries to bridge this, but does it succeed?

      *   *Tension B: AAP (1) vs. Non-Citizen Stance (5).*
          *   If AAP is the *starting point*, why the municipal/national distinction? Non-citizens are affected by national policy too (deportation, war, taxes).
          *   *Severity:* Medium. Can be justified by jurisdictional boundaries, but AAP pushes against borders.
          *   *Case:* Non-citizen residents. AAP says yes. Principle 5 says yes. Wait, Principle 5 aligns with AAP here. The tension is actually between AAP (1) and the *exclusion* of non-citizens from national votes (implied in 5). But the user *supports* 5. So 1 and 5 are consistent regarding municipal votes. The tension is 1 vs. the *limit* in 5 regarding national. But the prompt is about the charter commission (municipal). So maybe less relevant, but still a theoretical inconsistency in the worldview.
          *   *Refinement:* The tension is actually between AAP (1) and Property/Expat voting (implied rejection in the user's likely intent, though not explicitly stated in 7, it's in the "live cases"). Let's look at the Expat case. Expat owns property (affected) but lives abroad. AAP might say they have a stake. User likely wants to exclude them (standard charter review).
          *   *Wait, let's look at Principle 1 vs Principle 7.* Principle 1 says "everyone... substantially affected." Principle 7 creates "Conditional standing" for outsiders. This looks like a solution, not a tension.
          *   *Real Tension:* **AAP (1) vs. Pre-Settled Demos (2).** AAP is dynamic (issue-specific). Pre-Settled is static (roll-based). Principle 7 tries to hybridize, but Conditional Standing *is* ad hoc resizing.
          *   *Severity:* High.

      *   *Tension C: Instrumentalism (4) vs. Inclusion of Vulnerable (3).*
          *   If democracy is about tracking the common good via *competent* judgment, do children/severe cognitive disabilities (even with proxies) help track the common good? Or is this a rights-based concession that contradicts instrumentalism?
          *   *Severity:* Medium. Instrumentalism can argue that protecting vulnerable interests improves long-term stability/good, but it's a stretch compared to "freestanding right."
          *   *Cost:* If you drop 3, you look cruel. If you drop 4, you lose your pragmatic justification for the commission.

      *   *Tension D: Future Generations (6) vs. Instrumentalism (4).*
          *   Future generations can't communicate interests. How does a guardian know the "common good" for them? It risks becoming rule by unelected elites (guardians), which might track the common good *worse* than current voters.
          *   *Severity:* Medium-Low. It's a design challenge, not a logical contradiction.

      *   *Tension E: Tiered Scheme (7) vs. Pre-Settled Demos (2).*
          *   "Conditional standing... vote on that decision and nothing else." This *is* resizing the electorate based on the decision. Principle 2 says "nobody should get to resize the electorate to win."
          *   *Severity:* High. This is the operationalization of the 1 vs 2 conflict.
          *   *Case:* Water rates. Unincorporated neighborhood gets conditional vote. Is this resizing to win? Or legitimate stake? Principle 2 fears gerrymandering the electorate. Principle 7 enables issue-specific electorates.

      *   *Tension F: AAP (1) vs. Expat Property Owners (Live Case).*
          *   User hasn't explicitly stated their view on Expats in the 7 principles, but it's a "live case."
          *   If AAP is the start: Property owners are affected by tax/zoning. Do they get a vote?
          *   If Instrumentalism (4): Do they know local context?
          *   If Pre-Settled (2): Are they on the roll?
          *   *Hypothesis:* User likely wants to exclude Expats. AAP might include them.

  4.  **Drafting the Analysis:**

      *   **Ranking Tensions:**
          1.  **The Boundary Problem (1 vs. 2 & 7):** AAP demands fluid boundaries based on impact. Pre-Settled demands fixed boundaries for stability. Principle 7 attempts to solve this but arguably violates Principle 2 (no resizing).
          2.  **Instrumentalism vs. Universal Inclusion (4 vs. 3):** If it's about outcomes, why include those who can't reason (even with proxies)?
          3.  **Jurisdictional Leakage (1 vs. 5):** AAP doesn't respect city/national borders. Why stop at municipal for non-citizens?

      *   **False Alarms:**
          *   **Future Generations (6) vs. Instrumentalism (4):** Not a contradiction, just an implementation hurdle.
          *   **Tiered Scheme (7) internal logic:** It's complex, but not internally inconsistent.

      *   **Concrete Case Testing:**
          *   **Water Rate (Unincorporated Neighborhood):**
              *   Principle 1 (AAP): They are affected (aquifer). They should vote.
              *   Principle 2 (Pre-Settled): They are outside city limits. Not on roll. No vote.
              *   Principle 7 (Tiered): They get "Conditional Standing."
              *   *Conflict:* Principle 2 forbids the mechanism Principle 7 requires to satisfy Principle 1.
              *   *Verdict:* Principle 2 must give. But the cost is administrative complexity and potential for "electorate gerrymandering."
          *   **Non-Citizen Residents:**
              *   Principle 1: Affected. Vote.
              *   Principle 5: Vote.
              *   *Consistent.*
          *   **Expats (20 years abroad, property):**
              *   Principle 1: Affected (property value/taxes).
              *   Principle 4 (Instrumentalism): Do they care about the *common good* or just their asset? Likely asset.
              *   Principle 7: Conditional standing? Or Full?
              *   *Conflict:* If AAP is the *starting point*, they have a claim. If Instrumentalism is the *justification*, they might fail the "common good" test.
              *   *Verdict:* Need to define "Important Interests" in Principle 1. Is property speculation an "important interest" in the democratic sense?

      *   **The Tiered Scheme (7) Evaluation:**
          *   Does it help? It solves the "All-Affected" vs. "Fixed Roll" problem theoretically.
          *   Does it hurt? It creates massive administrative burden. Who decides the "threshold"? That decision is undemocratic.
          *   *Risk:* It creates a "Second Class" citizenship (Associate) which might violate the spirit of equal standing.

      *   **Single Revision:**
          *   Modify Principle 2. Instead of "Settled in advance," make it "Settled by a higher-order rule in advance."
          *   Or, Modify Principle 1. "All-affected *residents*."
          *   *Best Revision:* Refine Principle 1 to "All-affected *stakeholders*," but define stakeholder via residency + specific utility connection, then use Principle 7 to operationalize the utility connection.
          *   *Actually, the biggest fix:* Clarify Principle 2. It forbids resizing *to win*. Principle 7 resizes based on *stake*. The tension is whether "stake" can be manipulated.
          *   *Recommendation:* Keep 7, but tighten the criteria for "Conditional Standing" to prevent gerrymandering.

  5.  **Refining the Output:**
      *   Tone: Professional, analytical, respectful of the user's intellectual effort.
      *   Structure:
          1.  Executive Summary (The "Verdict").
          2.  Ranked Tensions (with "Who Gives" and "Cost").
          3.  False Alarms (Why they look bad but aren't).
          4.  Case Stress-Test (Water, Non-Citizen, Expat).
          5.  Evaluation of Principle 7.
          6.  The Single Revision.

      *   *Self-Correction on Tension 1 (1 vs 2):* Principle 2 says "demos has to be settled in advance... independently of the decision." Principle 7 says "conditional standing... vote on that decision." These are directly contradictory. Principle 7 *is* a violation of Principle 2. The user needs to know this. Principle 7 is the *exception* to Principle 2.
      *   *Self-Correction on Expat Case:* The user didn't state their view on Expats in the 7 principles. I need to infer or ask. I will assume based on "Instrumentalism" they likely want to exclude them, which creates tension with AAP.
      *   *Self-Correction on Non-Citizens:* Principle 5 says Yes Municipal. Principle 1 says All Affected. This is consistent. The tension is why *not* national? That's outside the commission's scope, but worth noting as a theoretical limit.

      *   *Focus on the Water Case:* This is the hardest one. City limits vs. Aquifer limits.
      *   *Focus on Principle 7:* Is it "helping or making mess worse"? It solves the theoretical problem but creates a procedural nightmare. Who determines the "threshold"? That person becomes a dictator of the demos.

  6.  **Final Polish:** Ensure the distinction between "Full," "Associate," and "Conditional" is clear in the analysis. Ensure the "Instrumentalist" justification is tested against the "Proxy Voting" for children. (If it's about good outcomes, do proxies ensure good outcomes? Yes, if they act in the child's interest, but does that track the *common* good? Maybe.)

      *   *Wait, one more tension:* **Principle 6 (Future Gens) vs. Principle 2 (Pre-Settled).** A guardian body for future gens is an *addition* to the demos. Is it part of the pre-settled roll? Yes. But they aren't people. It's a functional addition. Not a huge tension.

      *   *Key Insight:* The user's Principle 2 is the weak link. It's a procedural safeguard against gerrymandering, but Principle 1 (AAP) logically requires dynamic boundaries. Principle 7 is the bridge, but it makes Principle 2 look like a lie. The revision should be to Principle 2.

      *   *Let's write.*
answer: |-
  This is a sophisticated framework. You have correctly identified that the "boundary problem" (who constitutes *the* people) is the hardest problem in democratic theory, and you've attempted to solve it with a hybrid model.

  Your suspicion is well-founded. While the seven principles feel solid individually, they do not form a seamless web. There are structural load-bearing conflicts, particularly between your theoretical starting point (1) and your procedural safeguards (2), with your innovative tiered scheme (7) acting as both the bridge and the stress point.

  Here is the consistency check, ranked by severity.

  ### 1. The Ranked Tensions

  **Tension #1: The Dynamic vs. Static Demos (Principles 1 vs. 2 vs. 7)**
  *   **The Conflict:** Principle 1 (All-Affected) implies the electorate should shift based on the issue (dynamic). Principle 2 (Pre-Settled) demands the electorate be fixed before the issue is known (static) to prevent manipulation. Principle 7 (Tiered) attempts to satisfy Principle 1 by creating issue-specific voting ("Conditional Standing"), which is a direct violation of Principle 2.
  *   **Severity:** Critical. This is the engine room of your framework. If you enforce Principle 2 strictly, Principle 7 is impossible. If you enforce Principle 7, Principle 2 is false.
  *   **Who Has to Give:** **Principle 2 must give.** You cannot satisfy the All-Affected Principle (1) with a strictly fixed roll.
  *   **The Cost:** You lose the bright-line safeguard against "electorate gerrymandering." By allowing "Conditional Standing," you introduce a new point of manipulation: *Who decides if the stake threshold is met?* If the City Council decides who gets Conditional Standing on the water rate, they can simply exclude the unincorporated neighborhood by ruling their stake is "below threshold."
  *   **Fix:** Rewrite Principle 2 to: *"The criteria for membership must be settled in advance, even if the membership list varies by issue."* This protects against ad-hoc manipulation while allowing for Principle 7.

  **Tension #2: Instrumentalism vs. Proxy Voting (Principles 4 vs. 3)**
  *   **The Conflict:** Principle 4 says democracy is justified because it produces better *outcomes* (tracks the common good). Principle 3 includes children and those with severe cognitive disabilities via proxies. If the goal is epistemic (tracking the good), adding voters who cannot reason (even with proxies) dilutes the signal unless you can prove proxies track the "common good" better than they track "self-interest."
  *   **Severity:** Moderate. This is a philosophical friction point.
  *   **Who Has to Give:** **Principle 4 needs nuance.** Pure instrumentalism struggles here.
  *   **The Cost:** You must admit that democracy isn't *just* about outcome quality; it's also about *interest protection*. If you drop Principle 3 to save Principle 4, you lose moral legitimacy. If you keep Principle 3, you must broaden Principle 4 to include "protecting vulnerable interests" as part of the "common good," rather than just "making smart decisions."
  *   **Fix:** Amend Principle 4 to: *"Democracy tracks the common good, defined to include the protection of interests for those unable to advocate for themselves."*

  **Tension #3: The Expat Problem (Principles 1 vs. 4 vs. The Live Case)**
  *   **The Conflict:** You didn't list your verdict on Expats in the 7 principles, but it's a live case. Principle 1 (AAP) suggests they *should* vote (property is an important interest). Principle 4 (Instrumentalism) suggests they *should not* (they don't live with the consequences of daily governance, likely prioritizing asset value over community good).
  *   **Severity:** Moderate. This is where your framework might fail to deliver the verdict you intuitively want (likely exclusion).
  *   **Who Has to Give:** **Principle 1 needs a definition of "Affected."**
  *   **The Cost:** If you define "affected" too broadly (property ownership), Expats get a vote. If you define it too narrowly (residency), you violate the spirit of AAP.
  *   **Fix:** Distinguish between *stakes* and *interests*. Property is a stake; living in the community is an interest. Instrumentalism favors voters with "interests."

  ### 2. False Alarms (Where it looks inconsistent but isn't)

  **Future Generations vs. Instrumentalism (Principles 6 vs. 4)**
  *   **Why it looks bad:** How can an unelected guardian body track the "common good" better than voters? It looks elitist.
  *   **Why it's fine:** This is a classic "trustee" model. As long as the guardian's power is *suspensive* (veto) rather than *legislative* (proposal), it acts as a brake on irreversible harm without hijacking the engine. It is consistent with Instrumentalism if you view "long-term survival" as a component of the common good that short-term voters systematically discount.

  **Non-Citizens Municipal vs. National (Principle 5)**
  *   **Why it looks bad:** Principle 1 (AAP) doesn't respect borders. If non-citizens are affected by national policy, why exclude them there?
  *   **Why it's fine:** This is a jurisdictional limitation, not a philosophical one. Your commission only controls the City Charter. You can consistently hold that AAP applies *within the jurisdiction's sphere of coercion.* The city coerces residents (citizen or not); the nation coerces citizens (resident or not). This is consistent.

  ### 3. Concrete Case Stress-Test

  **Case A: The Water-Rate Restructure (Unincorporated Neighborhood)**
  *   **Your Goal:** Give them input.
  *   **Principle 1 (AAP):** Supports input (aquifer is shared).
  *   **Principle 2 (Pre-Settled):** Blocks input (they aren't on the city roll).
  *   **Principle 7 (Tiered):** Allows input via "Conditional Standing."
  *   **Where it Breaks:** It breaks on the **administration of Principle 7**.
      *   *Scenario:* The City Council wants to raise rates to fund a city-only project that drains the aquifer. The unincorporated neighborhood applies for Conditional Standing.
      *   *The Glitch:* Who verifies their "expected stake"? If the City Clerk decides, they can deny it. If an independent board decides, you've created a new bureaucracy.
      *   *Verdict:* Principle 7 delivers the verdict you want, but only if you solve the "Who guards the guardians?" problem regarding the threshold.
      *   *Recommendation:* For the water utility specifically, define "Conditional Standing" in the charter as automatic for any parcel physically connected to the utility grid, regardless of city limits. This removes the ad-hoc discretion.

  **Case B: Long-Term Non-Citizen Residents**
  *   **Your Goal:** Allow them to vote.
  *   **Principle 1, 5, 7:** All align.
  *   **Where it Breaks:** It doesn't. This is the strongest part of your framework. Principle 5 explicitly overrides the traditional citizenship requirement, backed by Principle 1.
  *   *Note:* Ensure Principle 7's "Associate Member" tier doesn't become a trap where non-citizens are stuck as "Associates" forever. They should be "Full Members" based on residency.

  **Case C: Expats (20 Years Abroad, Property Owner)**
  *   **Your Goal:** (Presumed) Remove their vote.
  *   **Principle 1 (AAP):** Threatens your goal. They are financially affected by zoning/taxes.
  *   **Principle 4 (Instrumentalism):** Supports your goal. They lack local knowledge and shared fate.
  *   **Where it Breaks:** Principle 1 is too broad here.
  *   *Verdict:* You need to qualify Principle 1. Change "important interests" to "important interests *grounded in shared daily life*." This excludes pure financial speculation (Expats) while including residency (Non-citizens).

  ### 4. Is the Tiered Scheme (Principle 7) Helping or Hurting?

  **Verdict:** It is theoretically brilliant but administratively dangerous.

  *   **Helping:** It solves the "All-Affected" vs. "Fixed Boundary" deadlock. It allows you to give the unincorporated neighborhood a vote on water without making them full citizens of the city (which might entail police/tax liabilities they don't want).
  *   **Hurting:** It creates a "Second-Class" citizenship (Associate Members). If Non-Citizen Residents are "Associates" while Citizen Residents are "Full," you risk creating a permanent underclass.
  *   **The Risk:** The "Conditional Standing" clause is a loophole. If the threshold for conditional voting is set too high, it nullifies Principle 1. If it's too low, it nullifies Principle 2.
  *   **Recommendation:** Do not use "Associate Member" for long-term residents. They should be "Full Members." Reserve "Associate" for stakeholders like regional partners or business owners who don't live there. Reserve "Conditional" for specific referenda (like the water rate).

  ### 5. The Single Revision

  To clean up the most mess at once, you need to fix the definition of the **Demos** to accommodate the **Instrumentalist** goal without violating the **Pre-Settled** safeguard.

  **Revise Principle 2 to read:**
  > *"The **criteria** for membership must be settled in advance and independently of the decision, even if the **composition** of the electorate varies by issue based on those criteria."*

  **Why this works:**
  1.  **Saves Principle 7:** It allows for "Conditional Standing" (variable composition) without violating the rule against resizing the electorate to win (fixed criteria).
  2.  **Protects Against Manipulation:** The City Council cannot say, "Let's let the unincorporated neighborhood vote this time because we think they'll support us." The Charter must say, "Anyone connected to the aquifer votes on water rates," *before* the rate hike is proposed.
  3.  **Solves the Water Case:** It legitimizes the unincorporated neighborhood's vote as a matter of pre-existing right, not a gift from the Commission.
  4.  **Solves the Expat Case:** You can set the criteria for "Full Member" as "Primary Residency," which excludes Expats without violating AAP, because you've defined the relevant "affect" as residency-based in the pre-settled criteria.

  **Final Advice on Principle 7:**
  Split it. Make **Residency** the bar for "Full Member" (covering Non-Citizen Residents). Make **Utility Connection** the bar for "Conditional Standing" (covering the Unincorporated Neighborhood). Do not create a permanent "Associate" class for people who live there; if they live there, they vote. If they don't live there but use the water, they vote on water. This keeps the tiers functional rather than status-based.
