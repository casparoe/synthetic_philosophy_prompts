answer: |-
  # Preparation Sheet: Discussion Period

  ## 1. Ten Objections (Ordered by Damage Potential)

  **1. The Policy/Repetition Problem (Effective Altruist / Population Ethicist)**
  "If you grant that an individual agent is permitted to save the one, you must grant that any agent in that position is permitted to do the same. If we institutionalize that permission, or even if we simply expect it to be exercised repeatedly, we guarantee that more people die than necessary. A moral theory that licenses a policy resulting in greater loss of life is self-defeating. How do you prevent your individual permission from becoming a public disaster?"

  **2. The Circularity of the Complaint Test (Analytic Metaphysician)**
  "Your test asks whether an individual has a complaint they wouldn't have if the others didn't exist. But whether they have a complaint depends on whether the rescuer had a reason to save the five. You are using the existence of a reason to determine the existence of a complaint, and the existence of a complaint to determine the existence of a reason. This looks like a redescription of your intuition, not a justification for it."

  **3. The Institutional Coda Contradiction (Clinical Ethicist)**
  "You argue the individual has permission to save the one, but the hospital protocol must save the five. But the hospital is just a collection of individuals acting in an official capacity. If the moral reason doesn't exist for the individual, where does it come from when they put on a hospital badge? You are positing a moral schizophrenia between the person and the role that you haven't grounded."

  **4. Opportunity Cost and Thresholds (Health Economist)**
  "In health economics, we use cost-effectiveness thresholds to allocate fixed budgets. Saving the one when you could save the five consumes resources that could have saved the others. This isn't just about the scene; it's about the opportunity cost. If you ignore the aggregate QALYs lost, you violate the trust of the population funding the system. How do you justify this inefficiency?"

  **5. Triage and Cognitive Load (Emergency Physician)**
  "In the field, responders cannot pause to construct complaints or run lotteries. They need heuristics. 'Save the most lives' is a robust heuristic that minimizes regret and error. Your view requires a cognitive calculation that is impossible under stress. If your theory cannot guide action in the real world, what is its normative force?"

  **6. The Coin-Toss Objection (Philosopher)**
  "If the numbers don't count, why is saving the one permissible but saving the five not *required*? If there is no reason to prefer the five, shouldn't the rescuer be indifferent? And if they are indifferent, shouldn't they flip a coin to ensure fairness? Your view seems to license saving the one, but it doesn't explain why we feel a coin toss is often the *fairest* solution."

  **7. Moral Distress and Agent Burden (Physician / Philosopher)**
  "You give the rescuer permission to save the one. But imagine the rescuer saves the one, and the five die. The rescuer will face immense moral distress and social condemnation. By telling them they are 'permitted' to do this, are you not setting them up for psychological harm? Does your theory account for the psychological cost of exercising this permission?"

  **8. The Onlooker Distinction is Psychological, Not Normative (Philosopher)**
  "You diagnose the opposition as a shift in standpoint (Agent, Victim, Onlooker). But even if that explains why people *think* numbers count, it doesn't prove they *don't*. The Onlooker's perspective might be the morally correct one—the impartial spectator. Why privilege the Agent's limited perspective over the Onlooker's impartial view of the good?"

  **9. The Probabilistic Extension (Your Own Extension / Sharp Philosopher)**
  "In your probabilistic case, the five have a complaint about risk imposition that the one does not. But if you weigh five complaints against one, aren't you just aggregating complaints? You say numbers don't count, but here the number of complaints decides the outcome. Have you not just reintroduced aggregation through the back door of 'complaints'?"

  **10. Defining 'Need' and 'Claim' (Population Ethicist)**
  "You stipulate that no one is 'especially needy.' But need is often defined by marginal utility. If the five are younger, or have more dependents, they are needier in a moral sense. By stripping the case of all variables except numbers, you create a vacuum. In the real world, numbers are correlated with need. Does your view collapse once we add realistic variables?"

  ---

  ## 2. Replies and Marginal Notes

  **1. Reply to Policy/Repetition**
  "I distinguish between the *ethics of rescue* and the *ethics of allocation*. The permission I defend is agent-relative, grounded in the intimate authority one has over one's own agency in a moment of crisis. Institutions, however, operate under fiduciary duties to populations. The 'disaster' you fear arises only if we conflate the individual's moral liberty with institutional protocol. My coda explicitly blocks the transfer: the individual may save the one, but the system must save the five. The theory is not self-defeating because it restricts the scope of the permission."
  *Marginal Note:* **Soft Spot:** This relies heavily on the Coda. If the Coda fails (see Objection 3), the whole view collapses. You are pushing the problem to the institutional level without fully explaining the moral switch.

  **2. Reply to Circularity**
  "The test is not defining the reason; it is identifying the *bearer* of the reason. A complaint exists when an agent treats my interest as less weighty than another's without justification. If the only justification is 'there are more of them,' I ask: does that fact change *my* stake in my own life? It does not. The test isolates whether the numerical fact alters the bilateral relationship between rescuer and victim. It is a heuristic for separateness, not a definition of value."
  *Marginal Note:* **Soft Spot:** You are leaning on the intuition that 'separateness' blocks aggregation. If the audience rejects separateness as a brute fact, this reply is just a restatement of the premise.

  **3. Reply to Institutional Contradiction**
  "The badge changes the relationship. A bystander owes strangers aid; a hospital owes its *population* stewardship. The hospital holds resources in trust. When I act as a private agent, I spend my own moral capital. When I act as a triage officer, I spend public trust. The reason to save the five in the hospital is not that five lives are worth more, but that fairness among claimants demands a protocol that does not favor the arbitrary choice of the agent."
  *Marginal Note:* **Soft Spot:** This concedes that 'fairness' aggregates in institutions. You need to ensure 'fairness' doesn't just become a codeword for 'maximization' later.

  **4. Reply to Opportunity Cost**
  "QALYs are a metric for system-level planning, not individual rescue. In a budget, every dollar is fungible. In a rescue, the resource is often non-fungible (a rope, a specific dose). Where resources are held in trust, I agree thresholds apply. But in the spontaneous rescue case, there is no budget to balance. The 'inefficiency' is only visible from the Onlooker's standpoint, which I argue is the wrong standpoint for assessing individual permission."
  *Marginal Note:* **Soft Spot:** Economists will reject the fungibility distinction. A dose used here is a dose not used there. You are assuming a closed scene that doesn't exist in reality.

  **5. Reply to Triage/Cognitive Load**
  "I am offering a moral account, not a field manual. However, 'save the most' is a useful proxy for fairness in high-stress environments where lotteries are impossible. My view permits the rescuer to save the one, but it does not require it. A protocol mandating 'save the most' is permissible as a fairness heuristic to spare agents from arbitrary choice. I am defending the *permission* to save the one, not the *requirement* to ignore the five."
  *Marginal Note:* **Soft Spot:** This blunts the radical edge of your view. If protocols *should* save the five, the individual permission becomes a theoretical curiosity with little practical import.

  **6. Reply to Coin-Toss**
  "A coin toss is a way of acknowledging equal claim without aggregating. My view supports the toss as a fair procedure, but I deny it is *mandatory*. If the rescuer identifies more with the one, or simply acts on impulse, they do not wrong the five. The five have no claim to be saved over the one; they only have a claim to equal consideration. A toss provides that, but a deliberate choice of the one does not necessarily violate it if no aggregation is invoked."
  *Marginal Note:* **Soft Spot:** Philosophers will press: If there is no reason to save the five, is there a reason to toss? If not, the toss is arbitrary. If yes, where does that reason come from?

  **7. Reply to Moral Distress**
  "Normative ethics describes what is right, not what is comfortable. If the rescuer feels distress, it may be because they internalize the Onlooker's perspective. My aim is to correct that perspective. However, I acknowledge that exercising this permission carries social cost. That cost is a pragmatic reason to hesitate, but not a moral reason that makes the act wrong. We should not define moral truth by the comfort of the agent."
  *Marginal Note:* **Soft Spot:** Cold. Risks alienating the physician and ethicist who deal with the fallout of moral injury.

  **8. Reply to Onlooker Distinction**
  "The Onlooker sees a state of affairs; the Agent sees a choice. Morality is primarily about choice. The Onlooker's judgment that 'five deaths is worse' is true as an evaluation of the outcome, but false as a guide to the agent's duty. We do not judge the agent by the badness of the outcome alone, but by the reasons available to them at the moment of choice. The numbers are not a reason available to the agent in the bilateral encounter."
  *Marginal Note:* **Soft Spot:** This is a consequentialist vs. deontological stalemate. You aren't arguing them out of it; you are stating your side.

  **9. Reply to Probabilistic Extension**
  "In the probabilistic case, the complaints are not about numbers; they are about risk imposition. Each of the five faces a high probability of death if the gamble fails. The one faces certainty of death if the gamble is not taken. The structure of the complaint changes from 'why not me?' to 'why impose this risk?'. The number of complaints matters only because each represents a distinct risk imposition, not because we sum the value of their lives."
  *Marginal Note:* **Soft Spot:** **Dangerous.** If you count the complaints to decide, you are aggregating. This is the weakest link in your armor. See Section 5.

  **10. Reply to Defining Need**
  "I grant that in real cases, variables correlate. My claim is conditional: *ceteris paribus*, numbers do not break the tie. If age or dependents introduce a claim of need, that is a different reason. I am isolating the variable of number to test its normative force. If the view holds in the pure case, it constrains how we use numbers in the impure case. We cannot use numbers as a proxy for need if numbers themselves carry no weight."
  *Marginal Note:* **Soft Spot:** Population ethicists will argue 'need' is inherently comparative and aggregate. You are assuming an atomistic view of need.

  ---

  ## 3. Two Concessions for the Paper

  **1. The Scope of the Negative Claim**
  *Current:* "Nothing about the bare fact that there are more of them is a reason to save the five."
  *Revision:* "Nothing about the bare fact that there are more of them is a reason to save the five *in the absence of institutional fiduciary duties*."
  *Why:* This pre-empts the Institutional Coda Contradiction (Objection 3) and the Policy Problem (Objection 1). It frames the individual permission as the exception, not the rule, which makes the view more palatable to the EA/Ethicist bloc without surrendering the core philosophical claim.

  **2. The Function of the Complaint Test**
  *Current:* "If no individual complaint can be constructed, there is none for the group to inherit."
  *Revision:* "If no individual complaint can be constructed *that appeals to a prior claim or greater need*, there is none for the group to inherit."
  *Why:* This clarifies that the test is not a vacuum; it relies on a baseline of entitlement. It answers the Circularity Objection (Objection 2) by admitting the test requires a prior theory of claims, positioning the test as a filter rather than a generator of reasons.

  ---

  ## 4. The Question You Hope Nobody Asks (The Repetition Problem)

  **Verdict on Nomination:** You have picked the right one. This is the standard and most devastating objection to non-aggregationist views (often associated with the "Taurek" debate).

  **The Strongest Version:**
  Do not let them ask, "What if everyone did this?" That is a crude utilitarian objection. The strongest version is the **Universalizability Argument**:
  "If you claim it is *permissible* for an agent to save the one, you must claim this maxim is universalizable. If universalized, the policy dictates that in every 1-vs-5 case, the agent *may* save the one. A rational agent behind a veil of ignorance, not knowing if they will be the one or the five, would reject this principle in favor of one that maximizes survival probability. Therefore, your principle is irrational because it is one that no rational contractor would accept for themselves as a potential victim. You are granting the agent a privilege that they would not grant the victim."

  **Preparation:**
  You must lean heavily on the distinction between **Rational Prudence** (Veil of Ignorance) and **Moral Permission** (Actual Agency). Your defense is that the Veil of Ignorance aggregates interests, which is precisely what you deny is permissible in the actual case. You must argue that the "contractor" perspective is the "Onlooker" perspective in disguise.

  ---

  ## 5. Evaluation of the Extension (Probabilistic Rescue)

  **The Scenario:** Save 1 (Certain) vs. Save 6 (High Probability, Fail = 0).
  **Your Worry:** Does counting the 5 complaints against the 1 smuggle aggregation in?

  **Objection 1: The Summing of Complaints**
  "If the decision rests on the fact that there are *five* complaints on one side and *one* on the other, you are treating complaints as countable units that can be outweighed. You have replaced 'aggregation of value' with 'aggregation of complaints.' If the number of complaints determines the outcome, numbers count. You have not avoided aggregation; you have merely shifted the currency from 'lives' to 'grievances.'"

  **Objection 2: The Ex-Ante/Ex-Post Inconsistency**
  "In the deterministic case, you argue the five have no complaint because their death is not made worse by the presence of others. In the probabilistic case, you argue they *do* have a complaint because the risk is imposed on more people. But the risk is only higher because there are more of them. You are allowing the number of people to generate the risk profile that generates the complaint. The number is doing the normative work, even if it is mediated by probability."

  **Verdict:**
  This is a **Reductio of the Negative Claim**, though it may be consistent with the Complaint Test.
  **Reasoning:**
  Your Negative Claim is that "the bare fact that there are more of them is not a reason." In the probabilistic case, the *only* reason to prefer the gamble (if you do) is that it benefits more people with some probability. If you decide based on the five complaints, you are acknowledging that the presence of the four additional people *changes the moral landscape* in a way that outweighs the one.
  This shows that your Complaint Test is **permeable to aggregation**. It allows numbers to matter whenever they can be framed as "separate risks." This threatens to swallow the Negative Claim entirely, because almost any rescue can be framed probabilistically.
  **Recommendation:**
  Do not present this as a triumph where "numbers return with force." Present it as the **limit condition** of your view. Argue that risk imposition is a distinct moral category from outcome selection. However, be prepared to admit that if the probability is high enough (e.g., 99% save 6), the view converges with aggregation. If you claim it *never* converges, you will look dogmatic. If you claim it *always* converges, you lose the Negative Claim. The sweet spot is to argue that **certainty blocks aggregation, but risk reopens it.** This preserves the 1-vs-5 deterministic case as the unique domain where numbers truly don't count.
