prompt: |-
  You are a professional philosopher with deep expertise in 19th-century philosophy of history and in the ethics of cultural memory institutions. Think carefully, and do not rush to generic organizational advice. Before answering, briefly brainstorm the competing pressures below, paying special attention to the hidden epistemic risks introduced by the AI mediation and the gaps in the archive.

  I am the director of a small heritage museum in a post-industrial town that is trying to decide on a guiding philosophy for a new interactive exhibit. Visitors will be able to hold conversations with AI reconstructions of local historical figures—founders, labor organizers, engineers—generated from partial and uneven archival records. Three advisory groups are pushing incompatible framing principles.

  The Civic Pride group wants the reconstructions to deliver inspiring, heroic narratives that can motivate young residents to stay and build; they argue that a community needs giants to stand on and that selective emphasis on achievement is not distortion but necessary vitality. The Archive Integrity group insists on exhaustive, reverent presentation of every contradiction and mundane document, with no editorial judgment; they warn that curating for inspiration is propaganda and that the past must be encountered in its full, unfiltered complexity. The Reckoning group demands that every reconstruction foreground exploitation, environmental damage, and broken promises, treating the town’s history primarily as an indictment; they claim that anything less is complicity with harm.

  I have noticed something unsettling: the language model reproduces whichever framing principle we embed in its system prompt. A heroic framing generates eloquent speeches and decisive moments that have no direct source in the records; a critical framing invents confessions and accusations that are equally unsupported. The archives themselves are already curated—some voices were never recorded, some documents were destroyed, and the surviving texts reflect the biases of those who had the power to preserve them. I am not looking for a political compromise among the three groups. My deeper worry is whether we are using knowledge of the past to serve the living community, or asking the living to serve a dead past—whether the museum will become a graveyard of reverence, a propaganda machine, or something that genuinely aids present life.

  Can you help me work through this? Specifically:

  - Identify the philosophical structure of my dilemma—the competing relationships between historical knowledge and present vitality—without relying on the group labels alone.
  - Apply the relevant theory about the uses and disadvantages of history for life, evaluating how each advisory position relates to serving or harming present vitality.
  - Assess the three positions not merely politically but according to that theoretical framework: which risks reducing life to the past, which risks falsifying the past for present ends, and which might achieve a healthier relation.
  - Propose a practical curatorial principle for the AI reconstructions that respects the archives’ gaps and silences without allowing those gaps to dictate a false coherence or a single moral.
  - Note the weakest point in the orientation you recommend—what I should concede up front to critics, and where my reply remains soft.

  Please proceed step by step. Start with the brainstorm, then develop the analysis, and address each bullet above in turn.

  End with a single-line bottom line in the form:
  Verdict: [a concise phrase capturing the recommended curatorial orientation].
