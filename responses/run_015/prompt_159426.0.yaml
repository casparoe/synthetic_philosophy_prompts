answer: |-
  There is no single settled name for this exact cluster of problems, though it sits at the intersection of epistemology, meta-ethics, and the philosophy of action. The closest established neighborhood is the debate over **Reasons for Attitudes** (specifically the distinction between *State-Given* and *Object-Given* reasons), but your observation identifies the precise boundary where that distinction breaks down.

  Historically, the closest precursor is William James's **"The Will to Believe"** (1896), which argues that in specific "genuine options" (living, forced, momentous), we are permitted to let our "passional nature" decide belief where evidence is insufficient, specifically because the belief helps create the truth. However, contemporary philosophy usually treats James as an outlier.

  To give you the map you want, I will carve this phenomenon using four established conceptual tools, and then propose a unifying label for the specific "porous" cases you identified.

  ### 1. The Core Mechanism: Reflexivity vs. Representation
  The fundamental difference between the "bribe" case (sealed) and the "trust" case (porous) is **Reflexivity**.

  *   **Representational Attitudes (Sealed):** Standard belief aims to *match* the world. The direction of fit is **Mind-to-World**. If the world doesn't match, the belief is false. The truth conditions are independent of the belief. Therefore, pragmatic benefits (the bribe) are irrelevant to the *truth* of the belief, even if they are reasons to *want* to hold it.
  *   **Reflexive Attitudes (Porous):** Trust, hope, and certain social beliefs aim to *change* the world. The direction of fit is partially **World-to-Mind**. The truth conditions are *dependent* on the attitude.

  **The Carving:** The phenomenon you are tracking is **Attitudinal Reflexivity**. This occurs when the holding of an attitude is a causal variable in the truth conditions of the content of that attitude.

  ### 2. Addressing Your Four Distinctions

  Here is how the literature (and the logic) carves up your specific worries.

  #### A. Capacity vs. Creation (Trust vs. Placebo)
  *   **The Distinction:** **Recognition vs. Causation.**
  *   **The Map:** In the placebo case, your belief causes recovery through blind physiological mechanisms. Your body does not *know* you believe; it just reacts. In the trust case, the student *knows* you trust them. The mechanism is **Second-Personal Recognition** (a concept from Stephen Darwall).
  *   **Why it matters:** Trust is a **communicative act**. When you trust, you signal an expectation. The student's reliability is elicited *because* they recognize the trust as a demand/invitation.
  *   **The Normative Upshot:** In the placebo case, you are manipulating a system. In the trust case, you are entering a **coordination game**. The "reason" for trust is not just that it works, but that it constitutes a relationship. The placebo works, but it isn't a *virtue* to believe in it; trusting the student is a virtue because it acknowledges their agency.

  #### B. Individual vs. Collective (The Bank Run)
  *   **The Distinction:** **Common Knowledge.**
  *   **The Map:** This belongs to the same phenomenon (Reflexivity) but scales via Game Theory. This is **Strategic Complementarity**.
  *   **Why it matters:** My individual belief that the bank is solvent does not make it solvent. But if my belief is part of a set of beliefs that are *common knowledge* (I believe, you believe, I believe that you believe...), it creates a Nash Equilibrium of solvency.
  *   **The Normative Upshot:** In individual reflexive cases (Trust), the justification is interpersonal. In collective cases (Bank), the justification is **systemic stability**. You are justified in believing the bank is solvent *because* believing it prevents the collapse that would make it insolvent. This is often called a **Performative Truth** (George Soros's theory of reflexivity in markets).

  #### C. Intention (The Triviality Worry)
  *   **The Distinction:** **Direction of Fit.**
  *   **The Map:** Intention is excluded from this problem because it is not a candidate for truth in the same way.
  *   **Why it matters:** As Elizabeth Anscombe and J.L. Austin established, intention has a **World-to-Mind** direction of fit. If I intend to raise my arm and it doesn't rise, the world failed the intention, not vice versa.
  *   **The Normative Upshot:** You don't need to justify intention by its effects because intention *is* the initiation of effects. The "looping worry" doesn't apply because intention isn't trying to describe a pre-existing state; it is trying to create a future state. Belief and Trust *describe* a state (reliability, solvency), which is why the loop is paradoxical for them but trivial for intention.

  #### D. The Looping Worry (Merit and Bootstrapping)
  *   **The Distinction:** **Constitutive Aims.**
  *   **The Map:** This is the **"Bootstrapping Objection."** If I believe P because believing P makes P true, haven't I cheated?
  *   **Why it matters:** It depends on the **Constitutive Aim** of the attitude.
      *   **Belief:** Aim = Truth (independent). Bootstrapping is vicious because it severs the link to independent reality.
      *   **Trust:** Aim = Cooperation/Relationship (dependent). Bootstrapping is *virtuous* because the "truth" of trust *is* the successful cooperation.
  *   **The Normative Upshot:** In reflexive cases, the "truth" is not a static fact to be discovered, but a **status to be achieved**. You are not merited for *accuracy*; you are merited for **fidelity** to the relationship. The bribe fails because it targets the *holder* (you get money), not the *relationship* (the sky doesn't care about your money). Trust succeeds because the payoff is internal to the attitude's success condition.

  ### 3. The Naming and The Boundary

  Since there is no single term, I propose we coin a functional label for the specific "porous" zone you are describing.

  **Proposed Term:** **Constitutive Performatives**
  *   **Definition:** Attitudes whose justification relies on their capacity to bring about the very state of affairs they represent, provided that the state of affairs is constitutively dependent on the attitude itself.

  **The Map of Boundaries:**

  | Attitude | Porous or Sealed? | Why? | Category |
  | :--- | :--- | :--- | :--- |
  | **Belief (Sky is Green)** | **Sealed** | Object is mind-independent. Payoff is external to truth. | *State-Given Reason* (Corrupt) |
  | **Trust (Student)** | **Porous** | Object is an agent who recognizes the attitude. Payoff is internal to relationship. | *Constitutive Performative* |
  | **Hope (Success)** | **Porous** | Effort is mediated by psychological state. Success depends on effort. | *Strategic Rationality* |
  | **Placebo (Recovery)** | **Semi-Porous** | Causal link exists, but no agency recognition. Justified pragmatically, not epistemically. | *Causal Efficacy* |
  | **Bank Solvency** | **Collectively Porous** | Depends on Common Knowledge. Individual belief insufficient. | *Reflexive Equilibrium* |
  | **Intention (Action)** | **N/A** | Not truth-apt. Creates rather than describes. | *Direction of Fit* |

  ### 4. Summary of the Carving

  You are looking for the boundary where **pragmatic reasons transform into epistemic reasons.**

  1.  **The Transformation Condition:** This only happens when the **Object of the Attitude** is sensitive to the **Holding of the Attitude**.
  2.  **The Agency Constraint:** It is most normatively robust when that sensitivity is mediated by **Agency/Recognition** (Trust) rather than blind **Causation** (Placebo).
  3.  **The Collective Constraint:** In systemic cases (Banks), the justification requires **Common Knowledge**, not just individual conviction.
  4.  **The Merit Resolution:** The "Looping Worry" is resolved by shifting the metric of merit from **Accuracy** (matching independent facts) to **Fidelity** (sustaining dependent realities).

  **The Verdict:**
  The phenomenon is **Attitudinal Reflexivity**.
  The corrupt version (the bribe) is **State-Given Reasoning**.
  The exemplary version (the trust) is **Constitutive Performativity**.

  The reason you haven't seen a single name is that epistemology traditionally tries to seal belief off from this, while ethics and game theory embrace it. You have found the leak between the two. The "porous" attitudes are those where holding the attitude is a **move in a game** rather than a **snapshot of a board**.
