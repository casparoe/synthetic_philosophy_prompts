answer: |-
  ### Exam Question

  **Time Allowed:** 45 Minutes
  **Word Limit:** Approximately 800 words
  **Marks:** 20

  **Question:**

  Consider the St. Petersburg game: A fair coin is tossed until it lands Heads. Let $k$ be the toss number on which Heads first appears. The payoff is $2^k$ dollars. Consider the following "Dissolution Argument" proposed to resolve the paradox:

  1.  **Finite Bankroll:** No house has infinite wealth. Cap the payoff at the house's total wealth, $2^N$.
  2.  **Repeated Play:** In the long run, averages converge. Repetition vindicates the expected value.
  3.  **Bounded Utility:** Agents have bounded utility for money, rendering large sums negligible.

  **Task:** Assess this argument. You must demonstrate why these moves relocate rather than dissolve the problem. Your answer must explicitly:
  1.  Distinguish between expected payoff, normative worth, and acceptance decisions.
  2.  Derive the expected payoff for the capped game (cap $2^N$) and explain why the result remains counterintuitive.
  3.  Analyze the repeated-play convergence rate and the cost of vindication.
  4.  Explain why capping fails for non-monetary goods (e.g., lives saved).
  5.  Show how infinite expectation violates statewise dominance.

  ***

  ### Model Answer

  The St. Petersburg paradox persists not because of calculation errors, but because standard dissolutions conflate three distinct questions: the mathematical expected payoff, the normative worth of the gamble to an agent, and the decision to accept a ticket at a specific price. The proposed Dissolution Argument fails because it addresses the calculation while leaving the normative and decision-theoretic contradictions intact.

  First, consider the Finite Bankroll move. Suppose the payoff is capped at $2^N$ dollars; if heads appears after toss $N$, the payout remains $2^N$. The expected value $E$ is the sum of probabilities times payoffs. For $k \le N$, the probability is $1/2^k$ and payoff is $2^k$, contributing 1 to the sum per term. For $k > N$, the probability mass is $1/2^N$ (the chance of $N$ tails), and the payoff is $2^N$.
  $$E = \sum_{k=1}^{N} \left(\frac{1}{2^k} \cdot 2^k\right) + \left(\frac{1}{2^N} \cdot 2^N\right) = \sum_{k=1}^{N} 1 + 1 = N + 1$$
  While this renders the expectation finite, it generates a new absurdity. If the house wealth is $2^{100}$ dollars (exceeding all physical currency), the ticket is worth exactly $101$ dollars. Our intuition recoils at paying even $25$ dollars for such a ticket. The paradox has not vanished; it has shifted from "infinite value" to "why is the value so low relative to the maximum possible prize?" The linear relationship between the log of the cap and the value suggests the problem lies in how probability weights extreme outcomes, not merely in the infinity itself.

  Second, the Repeated Play move claims long-run averages vindicate the expected value. However, the St. Petersburg game violates the conditions required for the Law of Large Numbers to settle quickly. The running total after $n$ plays grows at the order of $n \log_2 n$, meaning the average payoff per game grows logarithmically as $\log_2 n$. There is no stable long-run average; the "fair" price drifts upward as the number of plays increases. To vindicate a ticket price of $25$ dollars, one needs $\log_2 n \approx 25$, implying $n \approx 2^{25}$ plays (roughly 33 million). To vindicate a $100$ dollar ticket requires more plays than there are atoms in the universe. Thus, appealing to the long run is practically vacuous; it offers no guidance for single-case decisions or finite sequences, which is where decision theory is most needed.

  Third, the Bounded Utility move imposes a saturation point on value. While this mathematically caps the expectation, it carries heavy philosophical costs. It implies that beyond a certain threshold, additional units of the good matter nothing. This is plausible for money due to diminishing marginal utility, but untenable for goods like lives saved or years of welfare. There is no logical "maximum" number of lives that matters; saving a billion lives is better than saving a million. If the stakes are lives rather than dollars, the bankroll cap disappears, and unbounded utility restores the infinite expectation. The paradox re-emerges in any domain where the good is not naturally saturable.

  Finally, and most critically, infinite expectation creates indeterminacy that violates core decision principles. If a gamble $G$ has infinite expectation, then $E[G] = \infty$. Consider a modified gamble $G'$ that pays exactly one dollar more than $G$ in every possible state. $E[G']$ is also $\infty$. Expected utility theory implies indifference between $G$ and $G'$, since $\infty = \infty$. However, $G'$ statewise dominates $G$ (it pays more in every outcome). A rational agent must prefer $G'$, but the theory cannot represent this preference. The problem is not that the theory recommends paying too much; it is that it becomes unable to distinguish between a gamble and an improved version of that gamble.

  In conclusion, capping payoffs merely truncates the math without solving the valuation puzzle; repeated play requires absurd sample sizes to vindicate modest fees; bounded utility fails for non-saturable goods; and infinite expectations break statewise dominance. The paradox survives because it exposes a structural limit in maximizing expectation when probabilities and payoffs scale inversely, regardless of finite caps.

  ***

  ### Marking Scheme

  **Total Marks:** 20 (5 Criteria × 4 Marks)

  **1. Conceptual Distinctions (4 Marks)**
  *   **Must Hit:** Clearly distinguishes between (a) mathematical expectation, (b) normative worth/price, and (c) binary acceptance decision.
  *   **Common Error:** Treating "expected value" and "worth" as synonymous.
  *   **Penalty:** -2 if distinctions are conflated.

  **2. Capped Expectation Derivation (4 Marks)**
  *   **Must Hit:** Correctly derives $E = N + 1$ for cap $2^N$ and notes the counterintuitive result (e.g., $2^{100}$ cap $\approx$ $100$ value).
  *   **Common Error:** Deriving $E = N$ (forgetting the tail mass) or failing to explain why $N+1$ is still problematic.
  *   **Penalty:** -2 for math error; -2 for missing the critique of the result.

  **3. Repeated Play Analysis (4 Marks)**
  *   **Must Hit:** Identifies logarithmic convergence ($n \log n$ total / $\log n$ average) and cites the absurd sample size required for vindication (e.g., $2^{25}$ plays).
  *   **Common Error:** Claiming the Law of Large Numbers stabilizes the average quickly.
  *   **Penalty:** -4 for claiming standard LLN applies normally.

  **4. Goods vs. Money / Bounded Utility (4 Marks)**
  *   **Must Hit:** Explains that capping works for money (finite wealth) but fails for goods (lives/welfare) where utility is plausibly unbounded/non-saturable.
  *   **Common Error:** Asserting bounded utility is a complete solution without noting the saturation cost.
  *   **Penalty:** -2 for ignoring non-monetary stakes.

  **5. Dominance and Indeterminacy (4 Marks)**
  *   **Must Hit:** Demonstrates that $E[G] = E[G+1] = \infty$ violates statewise dominance.
  *   **Common Error:** Focusing only on "paying too much" rather than indifference between unequal gambles.
  *   **Penalty:** -4 for missing the dominance violation.

  **A vs. B Distinction:**
  *   **A Answer (16-20):** Integrates the five points into a cohesive narrative showing how each "solution" merely relocates the paradox. The math is derived fluidly within the argument.
  *   **B Answer (10-15):** Addresses all five points but treats them as a checklist. Derivations may be clunky or the connection between the math and the philosophical implication (e.g., why $N+1$ is absurd) is weak.

  **Automatic Penalties:**
  *   Citing external papers/authors (e.g., "As Menger showed..."): -2 marks.
  *   Claiming the paradox is "solved" by bounded utility without qualification: -2 marks.
  *   Incorrect summation of the geometric series in the cap derivation: -2 marks.

  ***

  ### Note on Contested Sides

  The model answer takes two contested positions that markers must accommodate:
  1.  **Bounded Utility:** The answer assumes bounded utility is costly because it implies saturation. Some students may argue bounded utility is *required* for coherence (e.g., to avoid Dutch Books). Markers should accept this if argued rigorously, provided the student acknowledges the trade-off (saturation) rather than dismissing it.
  2.  **Dominance in Infinite Contexts:** The answer assumes statewise dominance holds even with infinite expectations. Some decision theories reject dominance when expectations are infinite. Markers should award full marks if a student argues that dominance fails in infinite contexts, provided they identify this as the specific locus of the problem (i.e., acknowledging the violation rather than ignoring it). The key is recognizing the tension, not necessarily resolving it in favor of dominance.
