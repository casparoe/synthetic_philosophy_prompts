answer: |-
  You're smuggling verificationism into ontology. When you ask what work the word "real" is doing for events I can never signal, you're assuming that existence requires causal access. But that's precisely what the block universe denies. I don't need to exchange photons with Andromeda to claim it exists *now*; I infer it from the continuity of physical laws and the success of relativity. The "hop" in the Rietdijk–Putnam argument doesn't rely on causal chains; it relies on the transitivity of the reality relation across spacelike separation. If the distant observer is real, and the future event is simultaneous for them, then the event is real. Causal isolation is an epistemic limit, not an ontological boundary. If you restrict reality to what you can influence, you're not doing metaphysics; you're doing solipsism with a light cone.

  On the general relativity point: you're right that global inertial frames vanish in curved spacetime, but you're wrong that this saves presentism. The spacetime manifold exists independently of any coordinate system. We don't need global inertial hyperplanes to have a block; we just need the manifold itself. Using comoving time isn't admitting a privileged *metaphysical* foliation; it's acknowledging a convenient physical symmetry in the matter distribution. Presentists want a foliation that dictates *existence*; I'm happy to use a foliation that describes *motion*. The lack of a unique slicing doesn't mean the points don't exist; it just means "now" is even less special than in SR. The manifold is the substance; the slicing is just the shadow.

  Finally, your horizon-restricted view creates a metaphysical cliff. Why does reality stop at the causal boundary? Is there a zone of non-being just because photons can't cross a threshold due to expansion rates? That's magic. If the manifold extends, the reality extends. Your view tries to save intuition by sacrificing consistency. You grant me millennia but balk at billions? That's a sorites paradox waiting to happen. Either the logic of the "hop" holds, or it doesn't. If it holds, the distance doesn't matter. If it doesn't, you lose the near future too. You can't have it both ways.
