prompt: |-
  I serve on my high school’s District Ethics Board for Student-Run Philanthropy, where three students and one faculty advisor meet twice a month to approve grants under five thousand dollars; we have about twenty minutes per proposal, no philosophy background is assumed among reviewers, and any step that is irreducibly a value judgment must be flagged for the advisor’s sign-off rather than masked as technical. Because our charter now requires us to justify allocations between local community programs and international relief, I need a reusable decision procedure that translates the philosophical debate over whether compatriots have special moral claims—versus cosmopolitan impartiality—into an ordered audit my board can actually run, with explicit stop rules, hard cases, and honest markers of where judgment cannot be eliminated. The procedure should include a “moral-lottery filter” that asks whether a nationality-based priority depends solely on birth location with no further institutional reciprocity, and an “institutional co-authorship audit” that checks whether beneficiaries share in the tax, legal, or democratic structures that generate the obligation; please apply it to three proposals: (1) a winter heating subsidy for low-income families in our district; (2) emergency medical supplies for a refugee camp abroad facing an outbreak; and (3) a heritage-language preservation program restricted to citizens, where the board is likely to feel sympathy but the procedure may deliver an unwelcome answer. In your response, separate what is broadly settled in the debate—such as the universal weight of severe basic-need deprivation—from what remains genuinely contested among philosophers who study associative duties and global justice, and do not present any contested view, including the claim that shared nationality by itself generates a weighty special obligation, as the consensus position. Finally, state clearly what the procedure cannot settle, such as the precise threshold at which cultural preservation counts as a basic need or how to weigh distant suffering against local identity, and flag those nodes as requiring explicit value judgment rather than algorithmic resolution.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **Context:** High School District Ethics Board for Student-Run Philanthropy (3 students, 1 faculty advisor).
      *   **Constraints:** Meetings twice a month, ~20 mins/proposal, no philosophy background assumed, value judgments must be flagged for advisor sign-off (not masked as technical).
      *   **Goal:** A reusable decision procedure to justify allocations between local (compatriot) and international (cosmopolitan) programs.
      *   **Key Philosophical Tension:** Compatriot Priority (Special Obligations) vs. Cosmopolitan Impartiality.
      *   **Required Components:**
          *   "Moral-Lottery Filter" (checks if priority is based *solely* on birth location).
          *   "Institutional Co-Authorship Audit" (checks shared tax/legal/democratic structures).
          *   Explicit stop rules, hard cases, and markers of irreducible value judgment.
          *   Application to three specific proposals: (1) Local heating subsidy, (2) International refugee medical supplies, (3) Citizen-only heritage language program.
      *   **Philosophical Accuracy:** Distinguish between settled consensus (e.g., severe basic needs matter) and contested views (e.g., does nationality *itself* generate obligation?). Do *not* present compatriot priority as consensus.
      *   **Limitations:** Clearly state what the procedure *cannot* settle (e.g., thresholds for cultural needs vs. basic needs) and flag these for advisor judgment.

  2.  **Deconstruct the Philosophical Landscape:**

      *   *Consensus:* Severe deprivation (starvation, death, acute suffering) creates a strong moral claim regardless of borders. Efficiency matters (saving a life is usually prioritized over minor comforts).
      *   *Contested:* Does shared nationality create a *special* duty that overrides or outweighs distant needs?
          *   *Cosmopolitans:* No, borders are morally arbitrary (Moral Lottery).
          *   *Associativists/Nationalists:* Yes, shared institutions, culture, or reciprocity create special duties.
          *   *Institutionalists:* Duties arise from shared coercive structures (taxes, laws), not just culture.
      *   *The "Moral-Lottery Filter":* This targets the Cosmopolitan critique. If the only reason to help is "they were born here," that's morally arbitrary.
      *   *The "Institutional Co-Authorship Audit":* This targets the Associativist/Institutionalist defense. If we share a state, we co-author the rules that affect them.

  3.  **Drafting the Procedure (The "Audit"):**

      *   *Structure:* Needs to be fast (20 mins), clear, and actionable for high schoolers.
      *   *Step 1: Triage (Basic Needs).* Settle the easy stuff first. Life/Death > Comfort.
      *   *Step 2: The Filters.* Apply the required Moral-Lottery and Institutional Co-Authorship checks.
      *   *Step 3: The Judgment Nodes.* Where the algorithm stops and the humans must decide.
      *   *Step 4: Advisor Sign-off.* Mandatory for value judgments.

  4.  **Applying to the Three Proposals:**

      *   *Proposal 1 (Local Heating):* Basic need (warmth/safety). Institutional link is strong (taxes/district). *Verdict:* High priority, but needs to acknowledge the international opportunity cost.
      *   *Proposal 2 (Refugee Meds):* Basic need (life/health). Institutional link is weak (no shared state). Moral Lottery risk is low (saving lives). *Verdict:* High priority based on severity, despite distance.
      *   *Proposal 3 (Heritage Language):* Not a basic need (cultural). Institutional link is strong (citizens only). Moral Lottery risk is high (birthright priority). *Verdict:* This is the "unwelcome answer" case. The procedure might flag this as low priority compared to life-saving aid, requiring a value judgment on the worth of culture vs. survival.

  5.  **Refining the Philosophical Nuance:**

      *   *Crucial Constraint:* I must not present "nationality creates obligation" as settled fact. It is a contested view.
      *   *Settled:* Severe suffering matters universally.
      *   *Contested:* Whether local identity *justifies* prioritizing less severe local needs over severe distant needs.
      *   *Flagging:* I need to make sure the "Advisor Sign-off" sections explicitly state *why* it's a value judgment (e.g., "We are choosing identity over survival here").

  6.  **Developing the Content - Section by Section:**

      *   **Introduction:** Acknowledge the board's constraints and the philosophical stakes.
      *   **The Procedure (The "Border-Crossing Audit"):**
          *   Phase 1: Severity Screen (Consensus).
          *   Phase 2: The Moral-Lottery Filter (Cosmopolitan Check).
          *   Phase 3: Institutional Co-Authorship Audit (Associative Check).
          *   Phase 4: The Judgment Node (Advisor Sign-off).
      *   **Philosophical Status Report:** Clearly separate Settled vs. Contested.
      *   **Application:** Run the three proposals through the audit.
      *   **Limitations:** What the tool can't do.

  7.  **Self-Correction/Review during Drafting:**

      *   *Check:* Did I include the "Moral-Lottery Filter"? Yes.
      *   *Check:* Did I include the "Institutional Co-Authorship Audit"? Yes.
      *   *Check:* Is the tone appropriate for high schoolers + advisor? Yes, needs to be clear but not dumbed down.
      *   *Check:* Did I avoid presenting compatriot priority as consensus? Yes, I will explicitly label it as the "Associative View" which is contested against the "Cosmopolitan View."
      *   *Check:* Is Proposal 3 handled correctly? It needs to show the tension. The procedure might suggest rejecting it in favor of P2, but the board might feel sympathy. The procedure must flag this tension for the advisor.
      *   *Check:* Are the "Stop Rules" clear? Yes, if it fails the Severity Screen, it needs extra justification.

  8.  **Final Polish:** Ensure the distinction between "technical calculation" and "value judgment" is sharp, as per the charter requirement. (e.g., Calculating cost-per-life-saved is technical; deciding if culture matters more than life is value judgment).

  9.  *(Self-Correction on Proposal 3)*: The prompt says the board is likely to feel sympathy but the procedure may deliver an unwelcome answer. I need to make sure the audit highlights that this is a *cultural* good, not a *basic need*, and relies heavily on the "Institutional Co-Authorship" to justify it over international aid. If that justification isn't strong enough, it flags for the advisor.

  10. *(Refining the "Moral Lottery")*: Make sure this asks: "If this person was born elsewhere, would we still help?" If the answer is "No, because they aren't ours," that triggers the filter.

  11. *(Refining the "Institutional Audit")*: Make sure this asks: "Do we share the laws/taxes that created the need or the solution?"

  12. *Final Review against constraints:* 20 mins per proposal? The audit needs to be a checklist, not an essay. I will format it as a checklist/worksheet.

  13. *Philosophical Accuracy Check:* Ensure I mention that *some* philosophers argue shared coercion (institutional) creates duties, while others argue shared culture (national) does, and others argue neither overrides basic needs. I must not conflate these.

  14. *Drafting the Response.* (Proceeding to generate output based on these thoughts).
answer: |-
  # The Border-Crossing Allocation Audit (BCAA)
  **For Use by the District Ethics Board for Student-Run Philanthropy**

  **Purpose:** To structure the debate between local priority and global impartiality without masking value judgments as technical calculations.
  **Time Limit:** 15 minutes for Audit; 5 minutes for Advisor Sign-off on flagged items.
  **Philosophical Stance:** This tool does not resolve the debate between *Cosmopolitanism* (all humans have equal claim) and *Associativism* (compatriots have special claims). It exposes where you are choosing one over the other.

  ---

  ## Part 1: The Philosophical Status Report
  *Read before beginning the audit. This distinguishes settled ground from contested terrain.*

  ### A. Broadly Settled (Consensus)
  *   **The Weight of Severe Deprivation:** There is near-universal agreement that preventing death, acute starvation, or catastrophic health failure carries immense moral weight, regardless of borders.
  *   **Effectiveness:** If two proposals address the same level of need, the one that achieves more good per dollar is technically superior.
  *   **Arbitrariness:** Most philosophers agree that *mere* birth location (the "Moral Lottery") is not, by itself, a robust moral justification for prioritizing one life over another.

  ### B. Genuinely Contested (No Consensus)
  *   **The Weight of Nationality:** It is **not** settled that sharing a nationality creates a special obligation that overrides distant severe needs. This is the *Associative View*, contested by *Cosmopolitans*.
  *   **The Source of Duty:** It is contested whether duties arise from shared *culture/identity* or shared *coercive institutions* (taxes, laws, democracy).
  *   **Cultural Needs vs. Physical Survival:** There is no algorithm to determine when cultural preservation outweighs physical survival abroad. This is a value judgment.

  ---

  ## Part 2: The Audit Procedure

  ### Step 1: The Severity Screen (Consensus Check)
  *Goal: Identify basic needs where philosophical debate is minimal.*

  1.  Does the proposal address immediate threat to life, physical safety, or basic health (food, water, shelter, medicine)?
      *   [ ] **Yes:** Proceed to Step 2. (High Moral Priority)
      *   [ ] **No:** Proceed to Step 2. (Lower Moral Priority; requires stronger justification to override "Yes" proposals).

  ### Step 2: The Moral-Lottery Filter (Cosmopolitan Check)
  *Goal: Detect if priority is based solely on arbitrary birth location.*

  **Ask:** "If the beneficiaries of this proposal were born in a different country but had the exact same level of need, would we still fund this?"
  *   [ ] **Yes:** (The need drives the decision). **Pass.**
  *   [ ] **No:** (The location/citizenship drives the decision). **FLAG FOR ADVISOR.**
      *   *Reason:* You are relying on the contested claim that birth location creates special priority.

  ### Step 3: Institutional Co-Authorship Audit (Associative Check)
  *Goal: Determine if there is a non-arbitrary institutional link justifying local priority.*

  **Ask:** "Do the beneficiaries and the donors share the specific tax, legal, or democratic structures that generated the resources or the need?"
  *   [ ] **Yes:** (e.g., Local taxes fund local schools; local laws impact local housing). **Justification Supported.**
      *   *Note:* This supports the *Institutionalist* view of special duties, which is philosophically stronger than mere cultural nationalism.
  *   [ ] **No:** (e.g., General donations given based on shared ethnicity or nationality only). **FLAG FOR ADVISOR.**
      *   *Reason:* You are relying on the contested claim that shared identity alone creates obligation.

  ### Step 4: The Trade-Off Node (Irreducible Value Judgment)
  *Goal: Identify where the algorithm stops and human judgment begins.*

  **If you are choosing a Local "No" (Step 1) over an International "Yes" (Step 1):**
  *   [ ] **STOP.** You are prioritizing local identity/comfort over distant survival.
  *   **Action:** This requires **Advisor Sign-Off**. The board must explicitly state: *"We acknowledge this may save fewer lives than the international option, but we value local community cohesion more."*

  **If you are choosing a Cultural Program (Step 1 "No") over Basic Needs (Step 1 "Yes"):**
  *   [ ] **STOP.** You are prioritizing cultural preservation over physical welfare.
  *   **Action:** This requires **Advisor Sign-Off**. The board must explicitly state: *"We acknowledge this is not a basic need, but we value cultural continuity enough to fund it ahead of survival aid."*

  ---

  ## Part 3: Application to Current Proposals

  ### Proposal 1: Winter Heating Subsidy (Local Low-Income Families)
  *   **Step 1 (Severity):** **Yes.** Lack of heat in winter poses health/safety risks.
  *   **Step 2 (Moral Lottery):** **Pass.** If a family abroad faced freezing death, we would likely help. The need is universal.
  *   **Step 3 (Co-Authorship):** **Yes.** Beneficiaries are within the district tax/legal structure that generates the funds.
  *   **Step 4 (Trade-Off):** **Clear.**
  *   **Audit Result:** **Approve.**
  *   **Note:** This proposal satisfies both cosmopolitan concerns (basic need) and associative concerns (shared institutions). It is the easiest to justify.

  ### Proposal 2: Emergency Medical Supplies (International Refugee Camp)
  *   **Step 1 (Severity):** **Yes.** Outbreaks pose immediate death/health risks.
  *   **Step 2 (Moral Lottery):** **Pass.** We are funding based on medical need, not nationality.
  *   **Step 3 (Co-Authorship):** **No.** Refugees do not share our tax/democratic structures.
  *   **Step 4 (Trade-Off):** **Potential Conflict.** If funds are limited and Proposal 1 is also funded, does this get cut?
  *   **Audit Result:** **High Priority.**
  *   **Note:** Because Step 1 is "Yes," this proposal has a strong moral claim that overrides the lack of institutional co-authorship (Step 3). To reject this in favor of a local *non-emergency* would require an Advisor Sign-Off admitting a preference for compatriots over survival.

  ### Proposal 3: Heritage-Language Preservation (Citizens Only)
  *   **Step 1 (Severity):** **No.** Language loss is a cultural harm, not an immediate threat to life/health.
  *   **Step 2 (Moral Lottery):** **FLAG.** If these students were born elsewhere, they would not be citizens, and we would not fund this. Priority depends on citizenship status.
  *   **Step 3 (Co-Authorship):** **Mixed.** They share the legal structure (citizenship), but the need (cultural loss) is not generated by the state's coercive apparatus in the same way housing is.
  *   **Step 4 (Trade-Off):** **STOP.**
  *   **Audit Result:** **Requires Advisor Sign-Off.**
  *   **The Unwelcome Answer:** The procedure indicates this is a **lower moral priority** than Proposal 2.
  *   **Justification Required:** To fund this *instead* of Proposal 2, the Board must sign: *"We are prioritizing local cultural identity over distant physical survival. This is a value judgment, not a technical necessity."*
  *   **Why this matters:** This prevents the board from pretending language preservation is as urgent as medical aid. It forces honesty about the value of identity.

  ---

  ## Part 4: Limitations & Advisor Sign-Off Nodes
  *The following nodes cannot be resolved by this procedure. They require explicit value judgments signed by the Faculty Advisor.*

  | Node | The Unsettled Question | Required Declaration |
  | :--- | :--- | :--- |
  | **The Threshold of Need** | At what point does "cultural harm" become as urgent as "physical harm"? (e.g., Is loss of language a form of psychological violence?) | *"We define cultural preservation as [Equal To / Less Than] basic physical security."* |
  | **The Weight of Identity** | How much extra weight does shared citizenship add? Is it 10%? 50%? Does it ever override a life saved abroad? | *"We assign a priority multiplier of [X] to compatriot non-emergencies over distant emergencies."* |
  | **The Scope of Reciprocity** | Does past contribution (taxes paid) entitle a citizen to future support even if their need is less severe than a non-citizen's? | *"We prioritize [Past Contribution / Current Need] as the primary metric for allocation."* |

  ### Instructions for the Chair
  1.  **Do not hide behind the audit.** If the Audit flags a "Stop," do not try to calculate a way around it.
  2.  **Read the Declaration.** When an Advisor Sign-Off is triggered, read the "Required Declaration" aloud.
  3.  **Record the Dissent.** If a student reviewer disagrees with the value judgment (e.g., they believe saving a life abroad *must* always come first), record their dissent in the minutes. This is a feature, not a bug; it tracks the philosophical disagreement.

  ### Final Charter Reminder
  *Any step that is irreducibly a value judgment must be flagged for the advisor's sign-off rather than masked as technical.* **If you find yourselves arguing about "fairness" rather than "facts," stop and invoke the Advisor Sign-Off.**
