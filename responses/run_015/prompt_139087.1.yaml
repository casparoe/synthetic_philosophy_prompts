answer: |-
  ### I. The Purpose Constraint: Guidance vs. Assessment

  You have specified two jobs for the theory: (a) **First-Personal Guidance** (deciding at the till) and (b) **Retrospective Assessment** (blame, compensation, apology).

  **Do they pull apart?**
  Yes. This is the first major structural fault line in your paper.
  *   **Guidance** requires *epistemic accessibility*. An agent at the supermarket cannot calculate complex counterfactuals or know the precise state of the global supply chain. If the theory demands knowledge the agent cannot have, it fails as guidance.
  *   **Assessment** requires *metaphysical accuracy*. To justly blame or demand compensation, we usually require truth about what actually happened, not just what the agent believed. An agent might act on excellent advice (Guidance satisfied) but cause catastrophic harm due to bad luck (Assessment complicated). Conversely, an agent might act recklessly but cause no harm (Guidance failed, Assessment ambiguous).

  **Verdict:** A single metric rarely serves both. Expected utility guides well but blames poorly (why blame for bad luck?). Actual causation blames well but guides poorly (I couldn't know I was the threshold trigger). Your paper's most significant contribution may be arguing that we need *two* distinct normative standards: one for deliberation (risk-based) and one for accountability (outcome-based), linked by a theory of culpable ignorance. If you insist on a single standard for both, you impose a severe constraint on the theory's viability.

  ---

  ### II. The Desiderata

  Here are the requirements an adequate theory must meet, derived from your case material.

  #### 1. Epistemic Accessibility
  **Specification:** The theory must yield a verdict based on information available to the agent at the time of action. It cannot require knowledge of hidden variables (e.g., the exact number of other emitters) that are impossible to ascertain.
  **Case Basis:** The **Wednesday App Case**. The counter is broken; the agent knows only the probability (1/60). A theory requiring certainty of impact renders the agent paralyzed or morally blind.
  **Tension:** Conflicts with *Causal Fidelity* (see below).

  #### 2. Causal Sensitivity
  **Specification:** The theory must distinguish between acts that actually trigger harm and acts that do not, provided the agent knows the difference. It cannot treat the Monday purchase (certain trigger) and the Tuesday purchase (no trigger) as morally identical if the agent knows the counter reading.
  **Case Basis:** The **Monday/Tuesday Counter**. On Monday, you order a crate. On Tuesday, you do not. If the theory says these are morally equivalent solely because both are "part of a pattern," it ignores the specific agency of the threshold moment.
  **Tension:** Conflicts with *Structural Uniformity* if the theory tries to smooth over thresholds to make emissions look like voting.

  #### 3. Substitution Robustness
  **Specification:** The theory must account for pre-emption. If my act is causally redundant because someone else would have done it anyway, the theory must explain whether and why my act is still problematic.
  **Case Basis:** The **Next Shopper Variant**. You don't buy the chicken; the next person does. The crate is ordered either way. A theory that says "you caused the order" is factually false. A theory that says "you did nothing wrong" risks allowing free-riding on the inevitability of harm.
  **Tension:** Conflicts with *Causal Fidelity*.

  #### 4. Structural Uniformity
  **Specification:** The theoretical apparatus must apply across domains (emissions, meat, voting) without ad hoc exceptions. If the verdict differs between voting and meat-buying, the difference must stem from the causal structure (e.g., threshold visibility), not the domain content.
  **Case Basis:** **Emissions/Votes/Meat**. You require a unified account. If the theory works for chicken but fails for carbon (because carbon lacks a visible counter), it is gerrymandered.
  **Tension:** Conflicts with *Causal Sensitivity* if different domains have genuinely different causal profiles that the theory tries to ignore for the sake of unity.

  #### 5. Iterability (The Generalization Test)
  **Specification:** The theory must evaluate the act not just as a singleton, but as a repeatable policy. An excuse that works once must work if adopted by the agent over a lifetime, or by all similar agents.
  **Case Basis:** **40 Years of Shopping**. Buying one pack on Tuesday might not trigger a crate. Buying one pack every Tuesday for 40 years certainly contributes to demand. The theory must handle the aggregation of individually "inefficacious" acts by a single agent over time.
  **Tension:** Conflicts with *Causal Sensitivity* (the single act vs. the habit).

  #### 6. Normative Decoupling
  **Specification:** The theory must distinguish between *causation*, *wrongness*, *culpability*, and *blameworthiness*. It must be able to say "You caused harm but were not wrong" (innocent ignorance) or "You were wrong but caused no harm" (reckless risk).
  **Case Basis:** **The Broken App (Wednesday)**. If you buy on Wednesday, you risk harm. If you buy on Tuesday, you cause none. The theory must separate the risk (wrongness/culpability) from the outcome (causation).
  **Tension:** Conflicts with views that tie moral status strictly to actual outcomes.

  #### 7. Functional Dual-Use
  **Specification:** As per your purpose constraint, the theory must explicitly state whether it is designed for Guidance, Assessment, or both. If both, it must provide a bridge principle explaining how the two relate.
  **Case Basis:** **The Till vs. The Seminar**. At the till, you need a rule. In the seminar (assessing past action), you need a truth condition.
  **Tension:** This is the meta-constraint that creates friction with all others.

  ---

  ### III. Critical Analysis: Prejudices and Conflicts

  #### Genuine Desiderata vs. Partisan Prejudices

  *   **Genuine:** *Epistemic Accessibility*, *Iterability*, *Normative Decoupling*. These are structural requirements for any moral theory that respects agency and logic.
  *   **Prejudice (Consequentialist/Causalist):** *Causal Fidelity* (in the strong sense). The demand that *wrongness* must track *actual causal difference* is a partisan commitment. It rules out risk-based wrongness. If you include this as a hard requirement, you beg the question against deontological or virtue-based accounts.
  *   **Prejudice (Conservative/Common Sense):** The demand that the *Theory Must Not Exceed Common Sense*. Common sense is often contradictory (e.g., "votes don't matter" vs. "you must vote"). A theory that corrects common sense is preferable to one that caters to it.
  *   **Prejudice (Anti-Aggregation):** The demand that *No Expected-Utility Apparatus Appear*. This excludes the most robust tool for handling the Wednesday (probability) case. Unless you have a specific non-aggregative argument, this is a methodological prejudice.

  #### Incompatible Subsets (The Trilemmas)

  1.  **The Epistemic-Metaphysical Conflict:** You cannot simultaneously satisfy *Epistemic Accessibility* (Guidance) and strong *Causal Fidelity* (Assessment).
      *   *Argument:* On Wednesday, the agent doesn't know if they are the trigger. Guidance must rely on probability. Assessment, however, looks at whether they *were* the trigger. If the theory uses probability for both, it blames the lucky (who didn't trigger) and exonerates the unlucky (who did but couldn't know). If it uses actual causation for both, it fails to guide the agent on Wednesday.
  2.  **The Uniformity-Sensitivity Conflict:** You cannot simultaneously satisfy *Structural Uniformity* and *Causal Sensitivity* across all domains.
      *   *Argument:* Voting and carbon emissions often lack the clear, knowable thresholds of the chicken counter. A theory sensitive to the chicken threshold (Monday vs. Tuesday) may have no grip on carbon, where the threshold is opaque. To make them uniform, you must either ignore the threshold (losing Sensitivity) or claim carbon has thresholds we can't see (losing Accessibility).
  3.  **The Substitution-Impact Conflict:** You cannot satisfy *Substitution Robustness* and *Causal Fidelity* without introducing a non-causal notion of contribution.
      *   *Argument:* In the Next Shopper case, you cause nothing. If wrongness requires causing harm, you did nothing wrong. If you did something wrong, wrongness must track something other than causal impact (e.g., participation, complicity, or maxim violation).

  #### The Most Exclusionary Requirement

  **Functional Dual-Use (Guidance + Assessment Alignment).**
  This is the single requirement that excludes the most candidate theories.
  *   **Why:** Most theories specialize.
      *   *Expected-utility accounts* guide well (calculate the risk) but assess poorly (why blame me for the 1/60 chance that didn't happen?).
      *   *Actual-causation accounts* assess well (you pulled the trigger) but guide poorly (I couldn't know I was the trigger).
      *   *Virtue/Character accounts* guide well (what kind of person buys this?) but assess poorly (character is hard to judge retrospectively for compensation).
      *   *Collective-duty accounts* assess well (we did this) but guide poorly (what should *I* do if *we* aren't acting?).
  *   **Implication:** Insisting that one theoretical metric serves both the agent at the till and the judge in the seminar forces the theory to bridge the "ought implies can" gap with the "blame implies truth" gap. This is the hardest philosophical lift in the project.

  ---

  ### IV. Brief Scorecard of View Families

  **Expected-Difference Accounts**
  *Structure:* Wrongness is a function of the expected value of the outcome (probability × magnitude).
  *Score:* Excellent for **Epistemic Accessibility** and the **Wednesday Case**. Fails **Causal Fidelity** (treats the Monday trigger and Tuesday non-trigger as identical if probabilities are averaged). Struggles with **Assessment** (hard to blame for bad luck).

  **Complicity/Participation Accounts**
  *Structure:* Wrongness derives from joining a harmful collective enterprise, regardless of individual marginal impact.
  *Score:* Excellent for **Structural Uniformity** and **Substitution Robustness** (you joined the harm either way). Fails **Causal Sensitivity** (cannot distinguish Monday from Tuesday). Risks over-demandingness (implicates agents in distant harms).

  **Character/Self-Corruption Accounts**
  *Structure:* Wrongness lies in the damage to the agent's own virtue or integrity by performing the act.
  *Score:* Excellent for **First-Personal Guidance** (focuses on the agent's state). Fails **Retrospective Assessment** (hard to ground compensation demands on the agent's character). Weak on **Iterability** (depends on the agent's existing character, not the act's structure).

  **Collective-Duty Distribution Accounts**
  *Structure:* A duty binds the group; individuals bear a fair share of that duty regardless of causal efficacy.
  *Score:* Excellent for **Structural Uniformity** and **Inefficacy Cases**. Fails **Epistemic Accessibility** (requires knowing the group's capacity) and **Substitution** (if the group fulfills the duty without me, is my share waived?).

  **Contribution/Helping Accounts**
  *Structure:* One can "help" or "contribute" to a harm without being a necessary cause (non-counterfactual dependence).
  *Score:* Excellent for **Causal Sensitivity** (distinguishes contributing from not contributing). Fails **Normative Decoupling** (often collapses contribution into causation). Struggles with the **Button Press Variant** (if no single press helps, what does the group do?).
