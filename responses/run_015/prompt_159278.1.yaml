answer: |-
  Here is a breakdown you can take straight back to the reading group. Your hunch is largely correct: your colleague is conflating several distinct principles under one slogan. The phrase "Independence of Irrelevant Alternatives" (IIA) is notoriously overloaded in decision theory, and using it to dismiss the Allais paradox without qualification is a category error.

  Here is the menu of meanings, classified by their normative status and relevance to Allais.

  ### 1. The Menu of Meanings

  **(i) The Menu Version (Contraction Consistency)**
  *   **The Claim:** If you choose $A$ from a menu $\{A, B\}$, adding a third option $C$ (which you would not choose) should not make you switch to $B$.
  *   **Status:** **Substantive but Contested.** It is not a logical platitude. Behavioural economics shows systematic violations (e.g., the 'attraction effect' or 'decoy effect'). Normatively, some argue context *should* matter (e.g., the presence of $C$ might signal information about the quality of $A$).
  *   **Relevance to Allais:** **None.** The Allais paradox does not involve adding a third lottery to a menu. It involves comparing two pairs of lotteries. This is a red herring in this context.

  **(ii) The Mixture Version (vNM Independence Axiom)**
  *   **The Claim:** If you prefer Lottery $L$ to Lottery $M$, then a mixture of $L$ with some third Lottery $N$ should be preferred to the same mixture of $M$ with $N$. The "irrelevant" part is the common consequence branch ($N$).
  *   **Status:** **Substantive and Defensible (but not a Platitude).** This is the core axiom of Expected Utility Theory. It is normatively attractive because it simplifies decision-making, but the Allais paradox demonstrates that competent agents systematically violate it. Whether this makes them *irrational* is the very debate your group should be having, not something to be assumed.
  *   **Relevance to Allais:** **Direct.** This is precisely what the Allais paradox tests. When your colleague says "rational preferences have to be independent," this is the axiom they are invoking.

  **(iii) The State-by-State Version (Savage's Sure Thing Principle)**
  *   **The Claim:** If you would prefer Act $A$ to Act $B$ given event $E$ occurs, and you would also prefer $A$ to $B$ given $E$ does not occur, then you should prefer $A$ to $B$ unconditionally. The outcome on the branch where the acts are identical is "irrelevant."
  *   **Status:** **Substantive and Defensible.** This is the subjective probability analogue of (ii). It is highly intuitive (why let a common outcome sway you?), yet Allais preferences violate this when the problem is framed in terms of states of the world.
  *   **Relevance to Allais:** **Direct.** The Allais paradox can be reformulated to show a violation of the Sure Thing Principle. This is often where the normative bite is strongest.

  **(iv) The Social Choice Version (Arrow's IIA)**
  *   **The Claim:** The social ranking of two alternatives should depend only on individual rankings of those two alternatives, not on how individuals rank a third, irrelevant alternative.
  *   **Status:** **Substantive.** This is a condition on *aggregation rules* (voting systems), not individual rationality.
  *   **Relevance to Allais:** **None.** This is a total red herring. Applying a social choice axiom to individual decision theory is a category mistake.

  **(v) The Strong Version (Description Invariance / Context Freedom)**
  *   **The Claim:** A rational agent's preferences should not change based on framing, regret, status quo biases, or how the problem is described.
  *   **Status:** **Normatively Attractive, Descriptively False.** This is a broad methodological requirement for rationality. While we want our theories to be robust, claiming that *any* framing effect is irrational is a strong claim that many philosophers dispute (e.g., if framing highlights a morally relevant feature).
  *   **Relevance to Allais:** **Indirect.** Your colleague might be using this to say "Allais choices are just framing errors." However, Allais preferences often persist even when the problem is transparently presented, suggesting it is not merely a framing bug but a structural feature of how humans value risk.

  ---

  ### 2. On Money Pumps and Dynamic Inconsistency

  Your colleague is imprecise here, but not entirely wrong. You need to draw a distinction between *static* and *dynamic* arguments.

  *   **Intransitivity:** If preferences are intransitive ($A \succ B \succ C \succ A$), you can be money-pumped in a **static** setting (a cycle of trades).
  *   **Independence Violations (Allais):** Violating the Independence Axiom (ii) does not necessarily imply intransitivity. However, it does imply **dynamic inconsistency**.
      *   **The Argument:** If you have Allais preferences, what you plan to do at time $t_1$ may conflict with what you actually want to do at time $t_2$ once uncertainty is partially resolved.
      *   **The Consequence:** This opens you to a **dynamic money pump** (e.g., the Hammond argument). You might pay to avoid a branch of a tree now, only to pay to reverse that decision later.
      *   **The Verdict:** Your colleague is right that independence violations threaten dynamic consistency, but wrong to imply it is the same mechanism as simple intransitivity. It requires a multi-stage decision process to exploit.

  ### 3. On the "Misnomer" Claim

  You are spot on to suspect the label is doing too much work.

  *   **Is it a misnomer?** Yes. In the context of Allais, "Independence of Irrelevant Alternatives" is almost always a sloppy shorthand for the **vNM Independence Axiom** (Menu Version ii).
  *   **Why it matters:** In the vNM axiom, the "irrelevant" thing is not an *alternative option* on a menu (as in Arrow or Luce); it is a *common consequence* within the lotteries themselves.
  *   **Probability Weighting:** Your second intuition is also correct. The Allais pattern is best explained by **non-linear probability weighting** (as in Prospect Theory). Agents treat the difference between 100% and 99% probability as much more significant than the difference between 10% and 11%.
  *   **The Argument:** If the phenomenon is driven by how probabilities are weighted (a psychological fact about risk), then calling it a violation of "Independence of Irrelevant Alternatives" obscures the real mechanism. It suggests the agent is distracted by an 'alternative', when in fact they are evaluating the *structure of the risk* differently.

  ### Summary for the Group

  1.  **Stop using the phrase "IIA"** without specifying whether you mean Menu, Mixture (vNM), or Social Choice. In Allais discussions, you mean **vNM Independence**.
  2.  **It is not a platitude.** It is a substantive normative claim that Allais preferences challenge. To say "obviously rational preferences must satisfy it" is to beg the question against the paradox.
  3.  **Prospect Theory:** It is not "merely descriptive" because it violates vNM Independence. It offers a *rational reconstruction* of why an agent might care about the dispersion of probability mass (the common consequence) in a way Expected Utility does not permit.
  4.  **Money Pumps:** Acknowledge that Allais preferences risk dynamic inconsistency, but distinguish this from the static money pumps that target intransitivity.
