prompt: |-
  hi — in my decision theory reading group one person keeps ending discussion of the Allais paradox with "obviously rational preferences have to be independent of irrelevant alternatives", and he uses it twice over: to say the Allais choices are just a mistake, and to say prospect theory can only ever be descriptive. I think the line is doing less work than he thinks, but I dont know which precise claim to argue with.

  Can you lay out the different things that sentence could actually mean, as a menu? The distinctions I want in it: (i) the menu version — your choice between two options shouldn't flip when a third option you wouldn't have picked is added; (ii) the mixture version — where the "irrelevant" thing isn't an option on a menu at all but a shared outcome branch: if you'd get the same consequence with the same probability either way, it shouldn't affect which you prefer; (iii) the state-by-state "sure thing" version — if you'd prefer A to B conditional on E and also conditional on not-E, then prefer A to B; (iv) the social-choice version, which I suspect is a totally different axiom wearing the same name; (v) the strong version — that a rational agent's preferences are context free, no framing, no regret, no status quo effects. For each, say whether its a platitude, a substantive but defensible requirement, or actually false — and say which of them the Allais pattern even bears on. My hunch is (i) and (iv) are red herrings here and the real fight is between (ii) and (iii), but tell me if that's wrong.

  Two more things. He also said that violating independence means you can be money-pumped or that your plans go dynamically inconsistent, and I thought that only followed from intransitivity — is there a reading of the slogan under which he's right? And is there a reading on which what's really going on in Allais isn't dependence on an alternative at all but something about how probabilities get weighted, so that "independence of irrelevant alternatives" is just a misnomer for it?

  Write it in British English, and keep it as a list I can take back to the group.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A decision theory reading group. One participant is using the phrase "obviously rational preferences have to be independent of irrelevant alternatives" (IIA) to dismiss the Allais paradox (calling it a mistake) and to dismiss Prospect Theory (calling it merely descriptive).
      *   **User's Goal:** Wants to push back but needs clarity on what that sentence actually *means*. They suspect the phrase is being used ambiguously.
      *   **Specific Requirements:**
          *   Create a "menu" of distinct meanings for the sentence.
          *   Include specific distinctions requested: (i) Menu version (standard IIA), (ii) Mixture version (Independence Axiom), (iii) State-by-state "Sure Thing" version (Savage), (iv) Social Choice version (Arrow), (v) Strong/Context-free version (Framing/Regret).
          *   For each, classify as: Platitude, Substantive/Defensible, or False.
          *   Identify which ones the Allais paradox actually bears on.
          *   Address the money-pump/dynamic inconsistency claim (is it just intransitivity?).
          *   Address the "misnomer" claim (is it really about probability weighting?).
          *   **Tone/Style:** British English. List format (for taking back to the group).

  2.  **Deconstruct the "IIA" Confusion:**
      *   The phrase "Independence of Irrelevant Alternatives" is notoriously overloaded.
      *   In *Social Choice Theory* (Arrow), it means something specific about social welfare functions.
      *   In *Individual Choice Theory* (Luce/Menu), it means contraction consistency.
      *   In *Expected Utility Theory* (von Neumann-Morgenstern), the axiom is usually called "Independence," but people often conflate it with IIA. It's about mixing lotteries, not adding menu options.
      *   In *Savage's Theory*, it's the "Sure Thing Principle."
      *   The user's friend is likely conflating the vNM Independence Axiom with the colloquial idea of "irrelevant alternatives."

  3.  **Drafting the Menu (Iterative Process):**

      *   *(i) Menu Version:* This is standard contraction consistency. If $x$ is chosen from $\{x, y\}$, it should be chosen from $\{x, y, z\}$.
          *   *Status:* Plausible but known to fail (attraction effect, etc.). Not directly Allais.
          *   *Classification:* Substantive but contested.

      *   *(ii) Mixture Version:* This is the vNM Independence Axiom. $L \succ M \implies pL + (1-p)N \succ pM + (1-p)N$. The "irrelevant" part is the common consequence $N$.
          *   *Status:* This is the heart of Allais.
          *   *Classification:* Substantive. Not a platitude (Allais shows people violate it). Normatively debated (is it *required* for rationality?).

      *   *(iii) State-by-State (Sure Thing):* Savage's P2. If acts agree on event $E$, preference depends only on $\neg E$.
          *   *Status:* Closely related to (ii). Allais can be framed this way.
          *   *Classification:* Substantive.

      *   *(iv) Social Choice:* Arrow's IIA. Ranking of $x, y$ depends only on individual rankings of $x, y$.
          *   *Status:* Totally different domain.
          *   *Classification:* Red Herring for individual decision theory.

      *   *(v) Strong/Context-Free:* Description invariance.
          *   *Status:* Normatively attractive, descriptively false.
          *   *Classification:* Substantive norm, but distinct from the axiomatic IIA.

  4.  **Addressing the Money Pump/Dynamic Inconsistency:**
      *   Violating vNM Independence (Allais) *does* lead to dynamic inconsistency if you don't update correctly (resolute choice vs. sophisticated choice).
      *   Money pumps usually target *intransitivity* (Dutch Book). However, Machina (1989) and others have shown dynamic inconsistency arguments against Allais-type preferences.
      *   Need to clarify: Intransitivity $\rightarrow$ Money Pump (static). Independence Violation $\rightarrow$ Dynamic Inconsistency (planning vs. doing).
      *   So the friend is *partially* right but imprecise.

  5.  **Addressing the "Misnomer" Claim:**
      *   Is Allais about "irrelevant alternatives"? No, it's about common consequences.
      *   Is it about probability weighting? Yes, Prospect Theory says we weight probabilities non-linearly.
      *   The label "Independence of Irrelevant Alternatives" is often misapplied to the vNM Independence Axiom. The "irrelevant" part is the common component, not a third option.
      *   So, yes, it is a misnomer in the Allais context if used loosely.

  6.  **Refining the Tone (British English):**
      *   Use "rationalise" instead of "rationalize".
      *   Use "programme" (if needed), "behaviour", "favour".
