answer: |-
  Here's a run-sheet for "The Allocation Desk." It's designed to be tight, slightly uncomfortable, and mechanically simple so the philosophy hits hard.

  ### The Setup (10 mins)
  **Role:** Everyone is a Case Officer at the "Regional Resource Bureau."
  **Task:** You have 14 identical files on your desk. Each file represents a citizen applying for emergency housing.
  **Protocol:** You must all use the **Standard Algorithm**. There is no discretion. You cannot change the criteria. You cannot prioritize. You simply process the file according to the printed sheet (hand out a literal sheet of paper with 5 boring checkboxes they must tick).
  **The Catch:** Tell them the Bureau is understaffed and systems are old. "Processing errors happen outside your control."

  **Why this matters:** You need them to feel bored and procedural. If they think they made a clever choice, they'll blame themselves later. The choice must feel null.

  ### The Noise Mechanic (5 mins)
  Hand each participant a sealed envelope labeled **"System Noise."**
  Tell them: *"This card represents external factors: server crashes, mail delays, client health shocks, funding freezes. Things you cannot see or fix."*

  **The Cards (Prepare 14 ahead of time):**
  *   **5 cards (Green):** "System Synced." Client receives housing. Outcome: **Success.**
  *   **5 cards (Red):** "Data Corruption." Client denied housing. Outcome: **Failure.**
  *   **4 cards (Yellow):** "Partial Glitch." Client waitlisted. Outcome: **Neutral.**

  **Rule:** Do not open the envelope yet. Place it face down.

  ### The Twist: The Peer Review (15 mins)
  Pair them up (7 pairs).
  **Step 1:** Partner A opens their envelope. They look at the outcome (Success/Fail/Neutral). They do **not** show the card text, just the result. Partner B keeps their envelope sealed.
  **Step 2:** Partner B must write a 3-sentence "Performance Review" for Partner A.
  **Step 3:** **The Trap.** Announce this rule clearly: *"You are setting the precedent for this Bureau. The standard of judgment you apply to your partner will be the standard the room applies to you. If you blame them for failure, you agree to be blamed for failure."*
  **Step 4:** Partner B writes the review based *only* on the outcome they see. They must assign **Reputation Tokens** (use poker chips or slips of paper) to Partner A.
  *   Success = +3 Tokens
  *   Neutral = +1 Token
  *   Failure = -2 Tokens (Take from their stash)
  **Step 5:** Swap roles. Partner B opens, Partner A writes review.
  **Step 6:** Collect the reviews. **No one opens their own envelope yet.** They have now committed to a system where luck = merit, without knowing their own luck.

  ### The Reveal & Payoff (15 mins)
  **Step 1:** Everyone opens their own "System Noise" envelope.
  **Step 2:** Distribute the Reputation Tokens based on the cards they *actually* drew (not the reviews they wrote).
  *   Some people will have drawn "Failure" cards but wrote "Blame" reviews for their partners.
  *   Some will have drawn "Success" cards but wrote "Praise" reviews.
  **Step 3:** Read 3-4 of the collected Performance Reviews aloud. Pick ones that are harsh on failure or glowing on success.
  **Step 4:** Ask the room: *"Look at your token count. Look at the review you wrote. Does the token count match your moral worth?"*

  At this point, the room should feel itchy. People with "Failure" cards who wrote harsh reviews for others will feel hypocritical. People with "Failure" cards who were judged harshly will feel angry.

  ### The Debrief (30 mins)
  Don't start with definitions. Start with the feeling.

  **1. The Autopsy (10 mins)**
  Ask: *"Who feels their token count is accurate?"* (Hopefully no one).
  Ask: *"Who wrote a review they now regret?"*
  Ask: *"Why did you blame the failure? You knew the protocol was identical."*
  They will admit they slipped into "outcome bias." They judged the result, not the agency.

  **2. Mapping the Taxonomy (10 mins)**
  Now you can name it.
  *   **Resultant Luck:** This is what you just felt. The card (noise) changed the outcome, but your peers judged your character based on the outcome.
  *   **Circumstantial Luck:** Briefly mention that if the "System Noise" deck had been shuffled differently, they would have drawn a different card. They were lucky to be in the seat they were in.
  *   **The Token Economy:** Explain that Reputation Tokens represent social standing. In the real world, we grant tenure, promotions, and trust based on these tokens. You just proved the market is noisy.

  **3. The Limitation: Constitutive Luck (5 mins)**
  Be frank here. This simulation fails at one thing.
  *   **What you simulated:** External noise (Resultant) and situational variance (Circumstantial).
  *   **What you didn't simulate:** **Constitutive Luck.**
  *   **Say this:** *"In this game, you are all grad students. You all have similar education, similar capacity to understand the rules, similar temperaments suited for a seminar. I couldn't simulate the luck of being born with a temperament that is calm under pressure, or intelligent enough to spot a loophole, or empathetic enough to care about the client. You didn't choose your brain, yet you get praised for how you use it. I can't rig that in a 75-minute game. You have to imagine that part."*

  **4. Closing the Loop (5 mins)**
  Ask them to look at their Reputation Tokens.
  *"Who wants to trade tokens with someone who drew a better card?"* (No one will).
  *"Who wants to give their tokens back because they didn't earn them?"* (Some might).
  End on the question: *"If we can't eliminate moral luck, how do we design institutions that don't punish people for drawing Red cards?"*

  ---

  ### First-Run Predictions & Troubleshooting
  Here's what will likely go wrong the first time you run this, and how to fix it on the fly.

  **1. The "Hidden Variable" Hunt**
  *   **The Problem:** Participants won't believe the choices were truly identical. They will whisper, *"Did you check box 3 harder?"* or *"Maybe the protocol implies discretion."* They will try to reclaim agency to avoid the discomfort of luck.
  *   **The Fix:** In the debrief, be brutal. *"There was no hidden variable. I wrote the protocol. The only variance was the card. If you are looking for agency, you are resisting the lesson."*

  **2. The "It's Just a Game" Defense**
  *   **The Problem:** When the "Failure" cards come out, people might laugh it off. *"Haha, I lost tokens, whatever."* This kills the moral weight.
  *   **The Fix:** Make the tokens matter socially. Before the reveal, announce: *"The top 3 token holders get to choose the topic for next week's seminar / get the break extended / pick the reading."* Make the reputation capital tangible within the classroom hierarchy.

  **3. The Twist Timing**
  *   **The Problem:** People might peek at their own card before writing the peer review.
  *   **The Fix:** Collect the envelopes before the review phase. You hold the cards. You tell them the outcome verbally ("Partner A resulted in Failure"). They write the review. Then you hand the envelopes back for the reveal. This guarantees they don't know their own fate while judging others.

  **4. The Constitutive Luck Gap**
  *   **The Problem:** Students might argue that "being smart enough to understand the protocol" is merit, not luck.
  *   **The Fix:** Acknowledge it. *"Yes, understanding the protocol is merit. But your capacity to understand it was largely determined by your upbringing and genetics. That's the constitutive luck I mentioned. You didn't earn your IQ any more than you earned this Green card."*

  ### Materials Checklist
  *   14 "Standard Algorithm" sheets (identical boring checklists).
  *   14 Envelopes (5 Green, 5 Red, 4 Yellow cards inside).
  *   Reputation Tokens (poker chips, coins, or slips of paper).
  *   Index cards for Performance Reviews.
  *   Pens.

  Keep the energy low during the task (bureaucratic boredom) and high during the reveal (shock). Don't explain the philosophy until the tokens are already in their hands.
