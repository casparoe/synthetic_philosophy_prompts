  | desideratum | motivating case | verdict (non-negotiable, or a preference of one camp) | what it rules out |
  | :--- | :--- | :--- | :--- |
  | **Scalarity of Wrongness** | Jaywalking on an empty road where the risk is purely statistical. | Non-negotiable | Binary deontological accounts that treat all rule-breaking as equally prohibitive. |
  | **Standing of Complaint** | A demand for compliance made by a bystander who is not himself complying. | Non-negotiable | Generalised consequentialism that grants standing solely on outcome improvement. |
  | **Cross-Cultural Normativity** | A visitor from a no-tipping country encountering a tipping convention. | Non-negotiable | Strict cultural relativism that denies normative traction across borders. |
  | **Expressive Content** | Queue-jumping in a way that delays nobody. | Non-negotiable | Purely harm-based accounts that require tangible loss for wrongness. |
  | **Source of Obligation** | Not tipping where the worker's wage is set on the assumption that customers do tip. | Non-negotiable | Reductive accounts that collapse convention into independent distributive justice. |
  | **Idealisation Sensitivity** | A convention whose own participants routinely exempt visitors. | Non-negotiable | Kantian universalisation tests that equate ideal compliance with current obligation. |
  | **Normative Flux** | A convention that is locally contested or recently imported. | Preference of coordination camp | Static accounts that require long-standing stability for obligation to arise. |
  | **Normative Grounding** | A regularity observed among strangers that lacks any normative sanction. | Non-negotiable | Descriptive sociological accounts that conflate habit with obligation. |

