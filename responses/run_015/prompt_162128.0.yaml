  Bet on your Held-out confirmation. It is the only framework that explicitly acknowledges your constructive/archival distinction rather than trying to dissolve it. Standard solutions assume evidence is evidence, regardless of genesis; your paper argues genesis matters. Held-out confirmation formalizes that intuition by treating used data as a constraint cost rather than a confirmatory bonus. This prevents overfitting in constructive cases while preserving confirmation for archival surprises. It aligns with cross-validation practices in machine learning, giving it interdisciplinary weight.
