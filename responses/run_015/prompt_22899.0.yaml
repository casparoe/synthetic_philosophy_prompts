answer: |-
  **Title: The Knot in the Net**
  **Time: Approx. 5 Minutes**

  Sawubona. Good morning.

  Standing here, I was told I need to give a speech about my grandmother. But if she were standing here, looking at this podium, she would tell me I'm starting with a mistake. She would say, "There is no 'about me.' There is only 'about us'."

  She was from KwaZulu-Natal, and she carried the soil of that place in her spirit. She lived Ubuntu. Not as a word you read in a philosophy book, though she knew those books well. She lived it as a breath. To her, a person was not a statue to be admired. A person was a knot in a net. If you cut the strings, the knot falls apart.

  So, I cannot stand here and tell you she was "strong" or "independent." She would have found that embarrassing. She would have asked, "Independent of whom? Strong for what?"

  Instead, I have to tell you who she was by telling you who *we* are.

  When she met someone new, she never gave her own resume. She didn't list her degrees or her awards. She introduced herself as a list of relationships. She would say, "I am [Thabo's] mother. I am the one who sat with you when your husband died. I am the neighbor who watches the gate."

  To the family here: Think of the kitchen. Think of the smell of curry on a Sunday, not because she wanted to be a chef, but because she knew hunger. Think of the way she listened. She didn't listen to reply; she listened to hold space. When you spoke to her, you weren't talking to a judge; you were talking to a witness. She made you feel real because she paid attention to you. That was her accomplishment: making sure *you* knew you existed.

  To her students and friends here: You know she believed that humanity is a quality we owe to each other. She taught that we become human only through other human beings. But she didn't lecture that from a tower. She practiced it in the mud of life.

  I remember a story she told once. A woman's husband had passed away suddenly. Everyone was busy with the funeral arrangements, the paperwork, the noise. My grandmother didn't talk about the theology of death. She just sat on the floor with the widow. For three hours. She didn't say much. She just made sure the woman wasn't alone in her grief. Later, someone asked her what she did that day. She didn't say, "I comforted a mourner." She said, "I was the one who sat with Nandi."

  She dissolved herself into the service of others so completely that sometimes I worried she disappeared. But standing here today, looking at this room, I see that she didn't disappear. She distributed herself.

  She is in the way her students treat their own learners now.
  She is in the way the family holds the younger children when they cry.
  She is in the silence between us right now, where we are all sharing the same grief.

  If a person is a knot in a bunch of relationships, then my grandmother is not gone. You cannot cut a knot and destroy the string. The string is still here. It is running through this room. It connects the family in the front to the friends in the back. It connects her past to our future.

  So, I will not praise her as an individual. I will not build a monument of words that sets her apart from us. That would be a lie, and she hated lies.

  Instead, I will thank her.
  Thank you for the times you made tea when you were tired.
  Thank you for the times you listened when you wanted to speak.
  Thank you for teaching us that we are only people because we have each other.

  The best way to honor her is not to talk about her. It is to look around this room. It is to recognize the strings that tie us together. It is to turn to the person next to you—whether you are family or friend, philosopher or cousin—and acknowledge that we are here because she was here.

  She is not the knot anymore. She is the net that holds us.

  Ngiyabonga. Thank you.
