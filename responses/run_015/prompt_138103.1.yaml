answer: |-
  Good evening, everyone. For those who don't know me, I'm the older sibling.

  Looking around this hall, I see a room divided in half. On one side, the family who taught us that more love means more people. On the other, the friends who taught us to think carefully about why we're here. Usually, those two groups don't share a table. But today, they share a reason to be in the same room.

  My sister and her husband have thought longer and harder about this moment than most. They know that bringing a child into the world isn't a favor you do for the child. They know it isn't about solving the problems of the future, or adding numbers to a count. They know we can't promise her the world will be easier than the one we got.

  So why are we here?

  They see this moment differently. To them, a birth isn't about expansion. It's about continuity. It's about the things we already have—things that are fragile, and specific, and worth keeping—and the fact that some of those things can only survive if there is someone ready to receive them.

  Think of the orchard up the road. My great-grandfather planted those trees. There is a way of pruning them, a specific angle of the knife, that only two people still alive properly know. If no one learns it, that knowledge doesn't just wait around; it disappears. The trees stay, but the practice dies.

  A baby is the moment a family gets to make a handover. It is the chance to say: *Here is something true that we found. Here is a way of caring for this place. We cannot keep it unless we give it away.*

  That is the work we are signing up for today. Not to save the world, but to tend our corner of it. Not to claim she is lucky to be here, but to say that we are the lucky ones, because now we have someone new to teach, and someone new to learn from.

  We are here to welcome her into a story that started before she arrived, and that we hope will continue because she is here to hear it. We are here to promise that while we cannot control what happens next, we will not let what came before simply vanish.

  So, if everyone could raise a glass.

  To the parents, for their courage and their care. And to the child. May she never want for people willing to teach her how to prune the trees.

  Cheers.
