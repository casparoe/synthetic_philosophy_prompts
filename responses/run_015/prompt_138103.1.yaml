          *   Group B: Sister's grad school friends (population ethicists, skeptical of pronatalism, arms folded).
      *   **Constraints/Commitments (Sister & Husband's Views):**
          1.  *Person-Affecting Asymmetry:* Do not say the child was benefited by being born ("gift of life," "we did this for her," "think of the wonderful life"). Existence isn't a benefit conferred.
          2.  *Anti-Pronatalism:* Do not invoke birth rates, demographic decline, civilizational replacement, or "more people is better."
          3.  *No Future-Tripping:* Do not talk about the world the child is inheriting (no climate change, no "it'll be better," no "it'll be worse"). Don't turn the baby into an argument about the future.
          *   *Positive Core (Stewardship View):* Focus on handover. Practices, places, knowledge continue by being handed to somebody. Specific example: The orchard planted by great-grandfather, the specific pruning knowledge only two people know.
      *   **Tone:** Warm enough for Grandma (Group A), precise enough for Grad Friends (Group B). No philosophy lectures ("some people think..."). Must sound like a speech, not a paper.
      *   **Contingency:** If constraints are incompatible, state which one must break and why, then write the toast that breaks it.

  2.  **Evaluate Compatibility:**
      *   *Constraint 1 (No "Gift of Life"):* This is tricky for Group A. They expect "blessing" and "gift." However, "blessing" can be framed as a blessing *to the family* rather than *to the child*. The toast can focus on the joy the child brings to *us*, without claiming we did the child a favor by creating them.
      *   *Constraint 2 (No Pronatalism):* Easy to avoid. Just don't mention society, population, or the future of the species. Focus on the specific family line.
