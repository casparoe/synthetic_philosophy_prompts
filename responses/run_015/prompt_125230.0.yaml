answer: |-
  Dear Colleague,

  It is a genuine pleasure to engage with the tension you have identified, for it strikes at the very heart of the project to naturalize the mind. Your difficulty is not a misunderstanding on your part, but rather a precise articulation of the central friction point in contemporary philosophy of mind and biology. You have correctly identified that teleosemantic theories, such as those advanced by Millikan and Papineau, are intended by their proponents and by Dennett himself to function as cranes. They are designed to lift the heavy load of intentionality using the sturdy machinery of natural selection, without needing to attach cables to any miraculous skyhooks of irreducible meaning or intrinsic normativity. However, your worry that this construction might collapse into greedy reductionism reveals a profound ambiguity not necessarily in Dennett's framework itself, but in the intuitions we bring to the table regarding what counts as a genuine explanation of normativity versus an explanation away of it.

  To understand why Dennett views teleosemantics as a crane rather than a skyhook, we must look closely at how he defines the latter. For Dennett, a skyhook is an explanatory posit that itself requires no explanation and cannot be explained by anything below it; it is a miracle that hangs from nothing. If teleosemantics were to posit proper function as a primitive, irreducible normative force that supervenes on physical states without being constituted by them, it would indeed be employing a skyhook. But the explicit aim of Millikan, Papineau, and Dennett is to analyze proper function entirely in terms of selection history. On this reading, to say a state has the function of representing X is simply to say that ancestors of that state were selected for correlating with X. There is no extra metaphysical ingredient added to the universe; there is only the historical fact of differential reproduction. Therefore, within the logic of the theory, no skyhook is present. The normative force of error is not a magical property but a relational fact about the history of a lineage. A mechanism misrepresents when it fails to perform the task that caused its ancestors to survive, much like a heart fails when it does not pump, regardless of whether it is currently pumping.

  Your concern arises, quite rightly, when we ask whether this historical analysis preserves the phenomenon it seeks to explain. This is where the charge of greedy reductionism gains its traction. Greedy reductionism occurs when a theory explains the features of a phenomenon so thoroughly in terms of its constituents that the phenomenon itself disappears from the ontology. If you explain love as nothing but oxytocin release, you have explained it away. If you explain it as a complex social bonding mechanism realized by oxytocin, you have explained it constructively. The teleosemanticist argues they are doing the latter: they are showing how normative patterns like truth and error are real patterns instantiated by causal histories. They claim that the "ought" of biological function is a natural fact, akin to the "ought" of a key fitting a lock, derived from the design process of selection. However, your intuition suggests that by translating the normative "ought" of misrepresentation into the descriptive "is" of selectional failure, the distinctive sting of error is lost. You worry that we are left with mere causal deviation rather than genuine falsity.

  This suggests that the tension you feel may stem from differing expectations about what normativity must be to be real. If one holds that genuine normativity requires a sui generis, non-natural status—a view that would indeed require a skyhook—then any naturalistic account will look like greedy reductionism because it will inevitably fail to deliver that specific kind of normativity. Dennett's response, and the response of the teleosemanticist, is that this demand is the error. They argue that there is no other kind of normativity available in the universe. To insist on a stronger variety is to insist on a skyhook. From this perspective, teleosemantics does not explain away the normative force of error; it relocates it within the natural world. It shows that normativity is not a ghostly layer over the physical but a structural feature of systems designed by evolution. When a frog's visual system fires at a fly shadow, it is not merely causally deviating; it is failing to meet the conditions that justify its existence in the organism's economy. That failure is the naturalized ground of error.

  However, it is worth conceding that there is an ambiguity in how Dennett sometimes presents the stability of these cranes. He insists that we must preserve the reality of the patterns we explain, such as beliefs and desires, even as we reduce them to neural and evolutionary processes. The risk you perceive is that if the reduction is too tight, the patterns vanish. If misrepresentation is just a statistical anomaly in a lineage, does it carry enough weight to support the structure of rationality and reason that we see in human thought? Some critics argue that selection history is too coarse-grained to fix specific content, leading to indeterminacy problems that threaten to dissolve the very intentionality the theory was built to save. If the theory cannot distinguish between representing a fly and representing a fly-shadow because the selection history covers both, then the crane has not successfully lifted the load; it has dropped it. In this specific technical sense, your worry about greedy reductionism is well-founded, not because naturalizing normativity is inherently greedy, but because the specific crane offered might be too weak to support the height of the structure we are trying to build.

  Ultimately, I suggest that your confusion reveals less about a flaw in Dennett's distinction and more about the difficulty of accepting a fully naturalized normativity. The teleosemantic project is genuinely using a crane, as it attempts to build normativity out of non-normative historical facts. Whether it commits greedy reductionism depends on whether you believe the resulting structure is robust enough to house the phenomena of mind. Dennett would argue that it is, and that any sense of loss regarding the normative dimension is merely the nostalgia for a skyhook we never needed. You might remain unconvinced that the causal history of a neuron can truly ground the reason-giving force of a belief, and that is a legitimate philosophical stance. But if you accept that normativity must be natural to exist at all, then teleosemantics is not explaining it away, but rather explaining how it is possible. The tension you feel is the friction of grinding away the intuitive dualism that separates facts from values, and while that friction is uncomfortable, it is the necessary heat generated by the crane doing its work.

  I hope this helps to clarify the landscape of the problem you are navigating with your students. It is a rich terrain, and the fact that this tension has crystallized for you suggests you are engaging with the material at exactly the right depth.

  Warmly,

  Your Correspondent
