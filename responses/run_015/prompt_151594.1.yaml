  **DEPARTMENT FOR INTERTEMPORAL EQUITY**
  **Future Generations (Discharge of Duty) Scheme: Annual Statement & Guidance**
  **Ref: FGD/44B | Valid until 31 March**

  **1. What is my residual intergenerational liability?**
  Your household's liability is computed based on projected greenhouse emissions converted into quality-adjusted life-years (QALYs) at risk for persons living in 2085. This future value is discounted to present value using a rate of 3.5%, consistent with the growth-adjusted return on capital. This rate reflects the expectation that future generations will possess greater adaptive capacity and wealth than the current population. Harm occurring further in the future therefore presents a lower present cost.

  **2. How may I discharge this liability?**
  Households may settle their statement through any combination of the following tariff routes. Payments are tax-deductible.

  | Route | Description | Cost per Tonne CO₂e (PV) |
  | :--- | :--- | :--- |
  | **A** | Direct Emissions Reduction (verified) | £150.00 |
  | **B** | Contribution to Adaptation Fund | £75.00 |
  | **C** | Payment to Compensation Fund | £50.00 |
  | **D** | Non-Procreation Credit (see Section 4) | £0.00 (+ £25 admin) |

  **3. Where does the Compensation Fund money go?**
  Under the Identifiable Person Clause, trustees may only compensate claimants who prove they exist, would have existed anyway regardless of the emitting household's choices, and are demonstrably worse off due to specific emissions. To date, no claimant has satisfied these criteria, as energy usage and family size determine which specific individuals come into existence. The Fund's unspent balance (£4.2bn) is invested in a global index tracker to maximise returns for future disbursement.

  **4. What is the Non-Procreation Credit?**
  This is the most cost-effective discharge route. A household certifying it will produce no offspring (or no further offspring) discharges its entire residual liability. The reasoning is straightforward: if no new persons are created, no specific persons are exposed to the harm associated with the household's lineage. This avoids harm at a lower cost than Route A, B, or C.

  *Worked Example:*
  *   **Household X** plans two children. Projected lifetime emissions: 600 tonnes. Due to the 40-year average delay before these emissions occur, the discounted liability is **£2,100**.
  *   **Household Y** flies long-haul annually. Emissions: 15 tonnes/year. Occurring immediately, the discounted liability is **£2,250**.
  *   **Recommendation:** Both households are advised to select Route D. By certifying non-procreation, Household X reduces liability to £0. Household Y, by associating with Household X's certification, also clears its ledger. The Scheme recommends prioritising Route D over insulation or flight reduction, as the marginal cost per QALY saved is lowest.

  **5. Frequently Asked Questions**
  *   *Can I pay later?* No. Liability accrues annually.
  *   *What if I am already pregnant?* The foetus is not yet an identifiable person under the Clause. You may still certify.
  *   *Is this a tax?* No. It is a voluntary discharge of moral duty.

  **Helpline:** 0800-FUTURE-NOW | **Website:** www.die.gov.uk/fgd

  ***

  **Author's Note**

  The satire rests on three contested philosophical moves. First, the discount rate (Ramsey rule) assumes future people will be richer; if climate change impoverishes them, discounting harms them twice. A defender would argue ignoring capital returns wastes resources now that could help them more. Second, the Compensation Fund relies on Parfit's Non-Identity Problem: you can't harm someone by bringing them into existence unless their life is not worth living. Critics argue this dissolves duty entirely; the leaflet treats it as a loophole. Third, the Non-Procreation Credit treats existence as a harmable state. A defender of procreative duty would argue we owe future people existence, not non-existence. To flip the joke, one would need a model where future welfare is guaranteed positive, making procreation a net benefit you cannot offset by abstaining.
