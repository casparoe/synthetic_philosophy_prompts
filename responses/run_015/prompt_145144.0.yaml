answer: |-
  It sounds like Maya is operating with a specific, albeit intuitive, framework of democratic legitimacy. She isn't just counting heads; she is weighing the *quality* and *context* of the expression. (And no worries on the "popularism" typo—given the subject matter, it's an easy slip to make.)

  Here are three distinct theoretical principles that could consistently explain all four of Maya's calls, followed by their predictions on your AI case, my best guess at her actual view, and a scenario that would force these principles to disagree.

  ### Three Principles Explaining Maya's Calls

  **1. The Costly Signal Principle**
  *   **The Rule:** The "will of the people" is only expressed when citizens incur a tangible cost (time, effort, risk, or opportunity cost) to signal their preference. "Cheap talk" does not count.
  *   **Explaining the Calls:**
      *   *Brexit & Lula:* Voting requires registration, travel, and time. It is a costly act.
      *   *Rent-Control March:* Marching requires physical presence and time, often with social or professional risk. It is a costly act.
      *   *SCOTUS/Polls:* Answering a pollster is zero-cost "cheap talk." The Court striking down a law is an elite act, not a popular cost.
      *   *Lula's 0.2%:* A margin that thin suggests the result could be random noise rather than a deliberate, costly mandate. It fails the "clarity of commitment" test.

  **2. The Unmediated Sovereignty Principle**
  *   **The Rule:** The "will" must flow directly from the people to the political sphere without being filtered, interpreted, or vetoed by unelected intermediaries.
  *   **Explaining the Calls:**
      *   *Brexit & Lula:* These are direct transmissions of preference into binding outcomes (or mandates).
      *   *Rent-Control March:* Even though the council ignored it, the *expression* itself was direct (people to power), unmediated by pollsters or lawyers.
      *   *SCOTUS/Polls:* The Court is an unelected veto point (blocking the will). Polls are mediated by pollsters who frame the questions and interpret the data; they are advisory, not sovereign.
      *   *Lula's 0.2%:* A margin within the margin of error means the "sovereign command" is ambiguous; the chain of authority is broken by uncertainty.

  **3. The Signal-to-Noise Threshold Principle**
  *   **The Rule:** Popular will is a statistical signal that must exceed a specific "density floor" to be distinguished from random variance or manipulation. Intensity and clarity matter more than simple majority.
  *   **Explaining the Calls:**
      *   *Brexit (52%):* Clear enough to pass the threshold.
      *   *Rent-Control (30k):* A crowd of that size is a statistically significant deviation from normal civic behavior (high signal).
      *   *Lula (0.2%):* Falls below the density floor; it is indistinguishable from noise (counting errors, random fluctuation).
      *   *SCOTUS/Polls:* Polls are inherently "noisy" snapshots of soft opinion, not hard decisions. The Court represents a counter-signal from elites that drowns out the popular frequency.

  ***

  ### The New Case: The AI Policy Recommendation
  **Scenario:** AI analyzes 10 million comments (70% agreement), but only 0.1% of users actually read the proposal (most reacted to headlines).

  **Predictions by Principle:**

  *   **Costly Signal Principle:** **NOT THE WILL.** Clicking a reaction or commenting based on a headline is near-zero cost. Since 99.9% of participants did not incur the cost of reading the proposal, the "signal" is cheap talk. It fails the Brexit/March test of effort.
  *   **Unmediated Sovereignty Principle:** **NOT THE WILL.** The AI is the ultimate intermediary. It is filtering, aggregating, and interpreting the data before presenting it. Furthermore, reacting to headlines means the users are responding to a *mediated frame* of the policy, not the policy itself.
  *   **Signal-to-Noise Threshold Principle:** **NOT THE WILL.** While 10 million is a large number, the *quality* of the signal is degraded. If 99.9% are reacting to headlines, the 70% agreement is likely "noise" generated by emotional framing rather than a clear signal of policy preference. It is a high-volume, low-fidelity signal.

  ***

  ### Best Guess at Maya's Actual View
  **Verdict:** Maya would almost certainly say this is **NOT** the will of the people.

  **Reasoning:** Maya's comment about the "density floor" regarding Lula's 0.2% margin reveals that she cares about the *integrity* of the preference, not just the raw count. She distinguishes between a "real" win and "noise."

  In the AI case, you have a massive count (10 million) but a massive integrity failure (0.1% read the text). For Maya, the "will" requires a connection between the citizen's mind and the political object. If they are reacting to headlines, they are willing the *headline*, not the *policy*. This combines the failures of the Poll case (soft, unverified opinion) with the failure of the SCOTUS case (intermediaries/elites—in this case, the AI and the headline writers—standing between the people and the law). It is the ultimate "cheap signal."

  ***

  ### The Splitting Hypothetical
  To figure out which of the three principles Maya *actually* holds (since they all predict "No" on the AI case), you would need a scenario where the principles contradict each other.

  **The Scenario: "The Informed Lottery"**
  A random sample of 1,000 citizens is selected by lot (sortition). They are paid to take two weeks off work to study a complex policy proposal in depth. They deliberate and vote 95% in favor. The government agrees to bind itself to their decision.

  *   **Prediction under Costly Signal:** **YES.** These citizens incurred a high cost (time, study, deliberation). It is the ultimate "expensive" signal.
  *   **Prediction under Signal-to-Noise:** **YES.** 95% agreement among informed participants is an incredibly clear, high-density signal with almost no noise.
  *   **Prediction under Unmediated Sovereignty:** **NO.** Only 1,000 people spoke. The "People" as a whole were not consulted; this is a proxy. For a populist view (which Maya seems to lean toward with her "elite veto" comment), 1,000 people cannot claim to *be* the People. The chain is mediated by the selection process.

  **Why this splits them:** If Maya says the Lottery *is* the will, she prioritizes **Quality/Cost** (Principles 1 & 3). If she says it is *not* the will because "only 1,000 people decided," she prioritizes **Mass Participation/Sovereignty** (Principle 2). Given her focus on "turnout" in Brexit and "30,000 people" in the march, my money is on her rejecting the Lottery, revealing that **Unmediated Sovereignty (Mass Participation)** is her dominant rule.
