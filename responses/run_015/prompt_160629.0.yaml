      *   *(c) Free but Rationed (Lottery/Doctor):* Same people go without.
          *   *Insight:* Crucial distinction. If the outcome is the same (people don't get drug), is the market worse? Yes, because market rationing is by *ability to pay*, lottery is by *chance*, doctor is by *need*. The complaint is about the *criteria* for exclusion, not just exclusion itself.

  5.  **Deconstruct Question 4: The "Sitting Duck Condition" & R&D**
      *   *Sitting Duck (Inelastic Demand + Monopoly):* Is this the root?
          *   *Yes.* Most repugnance comes from the power imbalance. If you can walk away, it's a market. If you can't, it's a tax or a ransom.
          *   *Theory Limit:* Economics treats inelastic demand as a chance to maximize profit. Ethics treats it as a vulnerability to be protected. Theory shuts up on *why* vulnerability creates a moral duty not to exploit.
      *   *R&D Argument:* New drug ($10k/pill) vs. Old drug ($750/pill).
          *   *Distinction:* Recouping sunk costs (R&D) vs. Pure Rent.
          *   *Principled Way:* The "Incentive Justification." High prices are tolerated if they *cause* future good (new drugs). Shkreli's hike *caused* nothing new. It was backward-looking extraction.
