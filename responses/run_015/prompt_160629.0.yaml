answer: |-
  This is a strong choice for a case study. The Shkreli/Daraprim incident is practically a textbook example of "rent-seeking" behaviour, but you are right to avoid the "greed is bad" trap. For an EPQ, you need to dissect *why* it triggers a moral alarm bell using the tools of philosophy and economics, not just moral intuition.

  Here is a breakdown of the Daraprim case through the theoretical lenses you requested, structured to help you build your argument.

  ---

  ### 1. The Standard Objections: Price Level vs. Market Structure

  You need to distinguish between **Commodification** (the fact that it is sold at all) and **Exploitative Pricing** (the level at which it is sold). Daraprim was already a commodity before Shkreli bought it. The outrage was about the *change* in terms.

  *   **Objection A: Corruption of Meaning (The "Sandel" Argument)**
      *   *Theory:* Selling something changes the social meaning of the thing. Medicine should be about care, not profit.
      *   *Daraprim Application:* At $13.50, the profit margin is low enough that we can pretend the motive is "sustaining production." At $750, the profit motive becomes the dominant feature of the transaction.
      *   *Price vs. Structure:* This bites because of the **Price Level**. If the drug cost £8 a pill under private ownership, we generally accept the "market structure" because the price signal doesn't overwhelm the social purpose. The *magnitude* of the price corrupts the relationship from "pharmacist-patient" to "captor-hostage."
  *   **Objection B: Inequality and Exclusion**
      *   *Theory:* Markets allocate goods to those with money, not those with need.
      *   *Daraprim Application:* At $13.50, insurance and individuals can absorb the cost. At $750, insurance formularies may drop it, and uninsured patients cannot pay.
      *   *Price vs. Structure:* This is almost entirely **Price Level**. A private market for medicine is tolerable to many liberals *if* the price is accessible. The repugnance here is that the price creates a barrier to life-saving treatment that didn't exist before.
  *   **Objection C: Exploitation / Coercion (No Real Choice)**
      *   *Theory:* A transaction is only free if both parties can walk away.
      *   *Daraprim Application:* Patients with toxoplasmosis (often HIV/AIDS patients) cannot walk away. Their demand is perfectly inelastic.
      *   *Price vs. Structure:* This is a mix. The **Structure** (monopoly ownership) removes the option to buy from a competitor. The **Price** exploits that trapped position. If the price were £8, the "trap" wouldn't matter as much because the cost of being trapped is low.
  *   **Objection D: Attitude Towards Medicine**
      *   *Theory:* We should view health as a right or a public good, not a consumer product.
      *   *Price vs. Structure:* This bites because of **Structure**. Even at £8, a private owner *could* discontinue the drug if it's not profitable. However, the price hike makes the structural problem visible. It forces the public to confront the fact that a private entity holds a veto over public health.

  **EPQ Takeaway:** Most objections to Daraprim are not about *markets per se*, but about *market power combined with inelastic demand*. If the price were low, the market structure would be largely invisible and uncontroversial.

  ---

  ### 2. The Rationing Defence (and why it fails here)

  Standard economics says high prices do two good things:
  1.  **Ration demand:** Ensure the good goes to those who value it most.
  2.  **Signal supply:** Encourage producers to make more.

  **Why it fails for Daraprim:**
  *   **Supply:** Daraprim is an old drug. The formula is known. The manufacturing is cheap. The high price did not signal anyone to make more, because Shkreli held the patent/regulatory exclusivity. No one *could* enter the market.
  *   **Demand:** You cannot "ration" a life-saving drug based on "value." If you need it to live, your "value" is infinite. You will pay everything you have.

  **Which objections survive?**
  *   **Inequality:** Survives completely. If the high price isn't rationing a scarce resource, then excluding people is purely punitive. It serves no economic function.
  *   **Exploitation:** Survives completely. Taking advantage of inelastic demand is only defensible if it leads to more supply (the "incentive" argument). Since supply didn't increase, it is pure **Rent-Seeking** (extracting value without creating it).
  *   **Corruption:** Survives. It feels "grifty" because the price isn't doing any "work." It's just a transfer of wealth from sick people to shareholders.

  **EPQ Takeaway:** When the "allocative efficiency" argument is removed (because supply is fixed/artificially restricted), the only justification left for the price is "property rights." Your argument can be that property rights over essential goods dissolve when they cease to serve an economic function and become purely extractive.

  ---

  ### 3. Analysing Your Three Tests

  These are excellent thought experiments. Here is what they reveal:

  **(a) Same price ($750), but profit goes to charity.**
  *   **Verdict:** Still repugnant, but less *morally offensive*, equally *practically harmful*.
  *   **What it shows:** It isolates the **Greed** objection from the **Access** objection. People were angry Shkreli got rich, but the real harm was patients dying. If the money goes to charity, the "Greed" objection vanishes, but the "Exclusion" objection remains. This proves the core repugnance is about **who gets the drug**, not just **who gets the cash**.

  **(b) Same price ($750), but four companies compete.**
  *   **Verdict:** Economically impossible (competition drives price down to marginal cost), but hypothetically repugnant.
  *   **What it shows:** If competition existed and the price was still $750, it would mean the *cost of production* was actually high, or the market value was genuinely that high. Since we know the cost is low, this scenario implies collusion. It shows that our repugnance is tied to the **Monopoly Power**. We tolerate high prices in competitive markets (e.g., iPhones) because consumers have a choice. We do not tolerate them in monopolies on essentials.

  **(c) Drug is free, but allocated by lottery/doctor, same people go without.**
  *   **Verdict:** Less repugnant, but still tragic.
  *   **What it shows:** This is the most important test. It distinguishes between **Outcome** and **Process**.
      *   If people go without because they are poor (Market), we call it unjust.
      *   If people go without because of bad luck (Lottery) or triage (Doctor), we call it tragic but necessary.
      *   **Conclusion:** The complaint is not just that people suffer (outcome), but that the *criteria for suffering* is ability to pay (process). We accept rationing by **Need** or **Chance**, but we reject rationing by **Wealth** for essential goods.

  ---

  ### 4. The "Sitting Duck Condition" and R&D

  You have identified the core issue: **Inelastic Demand + Monopoly Power.**

  **Is all repugnance downstream of powerlessness?**
   largely, yes. In the literature (e.g., Wertheimer on exploitation), exploitation is often defined as taking advantage of a vulnerability to extract a benefit. If the buyer can walk away, it's a market. If they can't, it's a ransom.
  *   **Where theory shuts up:** Economics says, "If they can't walk away, charge the maximum." Ethics says, "Because they can't walk away, you have a duty not to charge the maximum." There is no bridge between these two. You cannot derive the ethical duty from the economic fact. You have to assert a moral premise: *Vulnerability creates a duty of care.*

  **The R&D Distinction (New Drug vs. Old Drug)**
  People accept $10,000/pill for a *new* cancer drug but not $750 for an *old* parasite drug. Is this inconsistent?
  *   **Principled Distinction:** The **Incentive Justification**.
      *   **New Drug:** We tolerate high prices as a "bargain." We grant a temporary monopoly (patent) to recoup R&D costs *so that* the drug gets invented. The high price buys future innovation.
      *   **Daraprim:** The R&D was paid for 60 years ago. The high price buys *nothing*. It is backward-looking extraction, not forward-looking investment.
  *   **Theory Limit:** This relies on the utilitarian argument that high prices are *instrumentally* good for innovation. It doesn't prove high prices are *intrinsically* fair. It just says they are a necessary evil for new drugs. Shkreli took the "necessary evil" without the "necessary good."

  ---

  ### 5. Defining "Price Gouging" (A Typology)

  To avoid "it feels gross," you need a framework. I suggest sorting cases by two axes: **Necessity** (Can you walk away?) and **Source of Scarcity** (Is the shortage natural or manipulated?).

  | Case | Necessity (Elasticity) | Source of Scarcity | Verdict | Why? |
  | :--- | :--- | :--- | :--- | :--- |
  | **Daraprim** | **High** (Life/Death) | **Manipulated** (Monopoly/Patent) | **Repugnant** | Rent-seeking on a vulnerability. No social benefit. |
  | **Flood Water** | **High** (Thirst/Survival) | **Natural/Temporary** (Disaster) | **Repugnant** | Exploiting a temporary emergency. Profiteering from disaster. |
  | **Kidney Sale** | **High** (Life/Death) | **Structural** (Legal Ban/Body Integrity) | **Repugnant** | **Commodification** issue. Selling body parts coerces the poor and treats humans as objects. |
  | **Ticket Touts** | **Low** (Entertainment) | **Artificial** (Fixed Seats) | **Tolerated** | You can walk away. It's a luxury good. Allocation by price is acceptable here. |

  **How to use this in your EPQ:**
  Argue that "Price Gouging" is not one thing.
  1.  **Emergency Gouging** (Water): Wrong because it exploits temporary desperation.
  2.  **Structural Gouging** (Daraprim): Wrong because it exploits permanent structural power (monopoly) without providing innovation.
  3.  **Blocked Exchange** (Kidneys): Wrong because the market itself corrupts human dignity, regardless of price.

  **Daraprim fits Category 2.** It is distinct from ticket touts because the "customer" cannot decline the purchase. It is distinct from kidneys because we aren't arguing the *sale* is wrong, but the *terms* of the sale.

  ### Summary for your Argument

  1.  **Don't argue markets are bad.** Argue that markets require **competition** and **choice** to be morally defensible.
  2.  **Daraprim wasn't a market failure; it was a market success.** Shkreli did exactly what a profit-maximising actor should do in a monopoly. The problem is that we allowed a monopoly on a life-essential good.
  3.  **The core repugnance is "Rent-Seeking on Vulnerability."** When price exceeds cost without creating new value, and the buyer cannot walk away, the transaction shifts from "exchange" to "extraction."
  4.  **Honesty about Theory:** Acknowledge that economics can explain *why* he did it, but only ethics can explain *why he shouldn't have*. The "Sitting Duck" condition creates a moral duty that the free market does not recognise. Your EPQ can argue that for essential goods, the moral duty must override the market right.

  This approach moves you away from "Greed is bad" to "Unconstrained market power over essential goods is incompatible with human welfare." That is a defensible, academic argument.
