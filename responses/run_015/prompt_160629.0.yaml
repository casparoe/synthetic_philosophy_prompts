prompt: |-
  hi, im doing my EPQ on repugnant markets and commodification (the whole "some things shouldnt be for sale" thing) and ive got to do a case study section. I want to use the Martin Shkreli / Daraprim thing from 2015 — he bought a 60-something-year-old drug used for toxoplasmosis, mostly in people with wrecked immune systems, and put the price from about $13.50 a pill to about $750 overnight, everyone went mental. I dont want to just write "greed bad lol", so can you actually run that episode through the theory properly?

  The bits im stuck on:

  One — the standard objections (that selling a thing corrupts or cheapens what it is, that it makes inequality worse / locks people out, that it exploits someone who has no real choice, that it wrecks the attitude we're supposed to have towards medicine). Go through them one at a time for this case and for each say: does it actually bite here, and is it biting because of the *price level* or because of the *ownership/market set-up*? Like which of them would still work if the drug cost £8 a pill.

  Two — the rationing thing. The usual defence of gouging-ish pricing is that a high price rations a scarce fixed supply to whoever needs it most and pulls in more supply. But Daraprim is an ancient cheap-to-make pill, nobody was queuing for a limited stock, so that defence doesn't seem to do any work at all. So which of the objections in part one were secretly leaning on the rationing story, and which survive once you notice the supply wasn't fixed? Basically im asking whats left when you take away the allocative bit.

  Three — ive made up three tests and I want you to say what each one shows. (a) Same price, but every penny above making-and-shipping cost goes to a charity treating toxoplasmosis in poor countries — still repugnant? (b) Same price, but four companies compete and it still lands at $750 — still repugnant? (c) The drug is free, but allocated by lottery or a doctor's judgement of need, and the *same* people end up going without it — has anyone's actual complaint been answered? Is the complaint about who pays, or about who gets it?

  Four — ive been calling it the sitting duck condition: the buyer can't walk away, there's no substitute, and they'll come to real harm without it. Is basically all of the repugnance in this case downstream of that? And if so, is the literature really about being stuck / powerlessness rather than about markets and money at all? Related: people were way angrier about this than about a brand new drug costing even more per pill, cus of the R&D argument. Is that just us being inconsistent, or does the theory have a principled way to separate recouping research costs from pure rent on an old drug? And be honest about where the theory shuts up and can't tell me what to think.

  Also please dont give me a reading list or paper names, my sixth form blocks nearly all of them and my supervisor wants my own argument anyway. And one last thing — is "price gouging" even one thing? Give me a way of sorting this case, a shop charging £20 for bottled water in a flood, someone selling a kidney, and ticket touts, that doesn't just collapse into "people feel grossed out". cheers
