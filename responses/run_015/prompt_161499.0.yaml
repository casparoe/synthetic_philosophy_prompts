answer: |-
  The stalemate you are experiencing is not a failure of imagination regarding the case variants; it is a collision of two incompatible meta-ethical frameworks regarding agency. Your hypothesis is largely correct: the Hitchhiker case is merely ammunition in a prior war about decision-theoretic formalisms, but characterizing it as merely "verbal" understates the depth of the divide. The disagreement sits at the locus of normativity: Camp A evaluates the *agent's policy* from an ex-ante perspective (timeless/policy-based), while Camp B evaluates the *agent's act* from an ex-post perspective (causal/act-based).

  The invariance across your three variants confirms this. Variant 1 (unobservable) removes reputation but leaves the policy/act split intact. Variant 2 (face-reading) clarifies the mechanism of prediction but does not change the causal leverage at the moment of payment. Variant 3 (lockbox) is the most diagnostic: both camps agree on causal pre-commitment (the lockbox), proving Camp B accepts binding themselves if the mechanism is causal. They reject the disposition only because they view the link between the current act and the past prediction as non-causal. Camp A accepts the disposition because they view the correlation as sufficient for normative binding. Since no variant changes the fundamental causal structure of the payment node relative to the rescue node, no variant can move the needle.

  The claim that "rationality can require you to be disposed to act against your reasons later" is a level confusion. It conflates the rationality of *selecting a strategy* (where the claim is true) with the rationality of *executing a move* (where the claim is false). Camp A calls the act rational because it fulfills the rational policy; Camp B calls it irrational because it fails to maximize utility given the current state. Both are internally consistent because they are optimizing different objective functions.

  Your hypothesis is partly right. It correctly identifies the formalism war (Causal Decision Theory vs. Timeless/Evidential Decision Theory) as the engine of the dispute. However, it is not merely verbal; it is a substantive disagreement about what kind of creature a "rational agent" is supposed to be—a momentary maximizer or a temporally extended planner. Progress will not come from new cases, but from agreeing to distinguish the questions. You should stop asking "What is rational?" and start asking "Do we want a decision theory that is dynamically consistent or one that is instrumentally dominant?"

