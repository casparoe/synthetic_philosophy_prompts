answer: |-
  ### Part 1: The Discard Pile

  Before giving you the procedure, here is what I threw away. These are distinctions that matter in a seminar room but will cause your team to miss a printing deadline.

  1.  **Sense vs. Reference:** Whether a name refers to an object or a sense is irrelevant when deciding if a spelling variant is a typo. We cannot adjudicate Fregean semantics in forty minutes.
  2.  **Type vs. Token:** Distinguishing the abstract work from the physical book is useful for theory, but you are editing a specific physical object for students. We treat the "work" as whatever fits between the covers of your edition.
  3.  **Illocutionary Force:** Trying to determine if a sentence was *meant* as a promise, a threat, or a joke based on context alone is too speculative. Unless the manuscript explicitly marks tone (e.g., "said ironically"), we cannot edit for force.
  4.  **The "Death of the Author" as a Ban:** A blanket rule ignoring authorial evidence is as dogmatic as blindly following it. We discard the ideology but keep the skepticism: later authorial claims are treated as new data, not gospel.
  5.  **Perfect Fidelity:** The idea that there is one "true" text to recover. There isn't. There is only the most defensible text for your specific pedagogical purpose.

  **Why these died:** They require evidence you don't have (mental states, abstract structures) or they impose ideological constraints that override the evidence you *do* have. In a one-hour meeting, you need verifiable data points, not metaphysical commitments.

  ### Part 2: The Procedure (The "Five-Step Triage")

  This procedure operationalizes your four candidates for meaning (Intended, Physical, Received, Future) by ranking evidence quality. It forces your disagreement with your archive friend into the open: **Contemporary Intention** counts; **Retrospective Intention** does not override public reception.

  **Step 1: The Mechanical Threshold (Hard No)**
  *   **Question:** Is the reading syntactically impossible or mechanically inexplicable at the time of production (e.g., missing words, garbled syntax, compositor error confirmed by house style)?
  *   **Yes:** Emend. (Priority: Physical Text correction).
  *   **No:** Proceed to Step 2.
  *   **Why:** This clears obvious noise. If the text doesn't work, fix it.

  **Step 2: The Contemporary Evidence Test (The Intention Filter)**
  *   **Question:** Is there documentary evidence *from the composition period* (manuscripts, typescripts, letters *during* writing) that contradicts the printed text?
  *   **Yes:** Priority to **Intended Text**. Prepare to emend or annotate heavily.
  *   **No:** Priority to **Physical/Received Text**. Proceed to Step 3.
  *   **Why:** This is where you win against your friend. Contemporary documents show the author's hand in the work. Later memories do not.

  Step 3: The Reception Weight (The Stability Check)
  *   **Question:** Has the printed reading generated a stable, productive interpretive tradition (criticism, teaching) over 20+ years?
  *   **Yes:** **Received Text** gains veto power. Do not emend unless Step 2 evidence is overwhelming. Annotate the variant instead.
  *   **No:** Proceed to Step 4.
  *   **Why:** Changing a text students and scholars have relied on for decades requires more than a hunch; it requires proof that the current reading is harmful or wrong.

  **Step 4: The Retrospective Claim (The Skeptic's Filter)**
  *   **Question:** Is the only evidence for change *post-publication* (interviews, memoirs, oral history)?
  *   **Yes:** **Hard No on Emendation.** Annotate the claim as "Author's later recollection," but do not change the text.
  *   **No:** Proceed to Step 5.
  *   **Why:** This is where your friend wins. Authors misremember, revise history, or fail to execute what they intended. The public text stands unless contemporary evidence overturns it.

  **Step 5: The Authority and Ethics Handoff (Value Judgment)**
  *   **Question:** Does the decision involve legal constraints (estate wishes), ethical harm (hate speech, privacy), or unfinished material?
  *   **Yes:** **Stop.** This is a Value Judgment. The procedure cannot decide. Refer to Senior Editor (you) or Legal/Executor.
  *   **No:** Default to Physical Text with annotation.
  *   **Why:** These are not textual questions; they are political, legal, and ethical ones. The text cannot answer them.

  ---

  ### Part 3: Running the Cases

  Here is the output of the procedure on your three queries.

  #### Case 1: The Inconsistent Name Spelling
  *   **Step 1 (Mechanical):** No. Both spellings are valid names; syntax holds.
  *   **Step 2 (Contemporary Evidence):** MS shows inconsistency. No evidence author *wanted* inconsistency. Likely a slip. (Evidence points to Intention: Uniformity).
  *   **Step 3 (Reception Weight):** Yes. Half the criticism treats them as one person; a minority reads it as a memory signal. There is a live interpretive dispute.
  *   **Step 4 (Retrospective):** N/A.
  *   **Step 5 (Authority):** No legal/ethical block.
  *   **Procedure Output:** **Do Not Emend. Annotate.**
      *   *Reasoning:* Step 3 blocks Step 2. Even if the author slipped (Intention), the slip has generated productive meaning (Reception). Emending settles the dispute silently; annotating preserves the scholarly record while acknowledging the likely error.
      *   *Confidence:* 90%.
      *   *Dislike Factor:* **High.** I know you want to emend to settle the dispute based on authorial intention. The procedure tells you that once a "mistake" becomes part of the work's reception history, it acquires rights. You must keep the dispute alive in the notes rather than solving it in the text.

  #### Case 2: The Irony Interview
  *   **Step 1 (Mechanical):** No. The speech works grammatically.
  *   **Step 2 (Contemporary Evidence):** Letters show worry about subtlety, but drafts lack ironic markers. Evidence is ambiguous regarding *successful execution*.
  *   **Step 3 (Reception Weight):** Yes. 60 years of straight reading.
  *   **Step 4 (Retrospective):** Yes. The claim relies on a radio interview 20 years later.
  *   **Step 5 (Authority):** Executor wants a note.
  *   **Procedure Output:** **Do Not Emend. Annotate the Interview.**
      *   *Reasoning:* Step 4 triggers a Hard No on emendation. The author's later memory cannot override the public text without contemporary proof that the irony was successfully encoded. However, Step 5 (Executor) mandates a note. The note must frame the interview as "Author's later claim," not "Correct Reading."
      *   *Confidence:* 95%.
      *   *Dislike Factor:* **Medium.** You want to believe the author. The procedure forces you to treat the author's later word as secondary evidence, not primary truth. The text remains straight; the irony is relegated to the apparatus.

  #### Case 3: The Unfinished Caricature
  *   **Step 1 (Mechanical):** No.
  *   **Step 2 (Contemporary Evidence):** Outline exists (contemporary), but the section exposing the narrator is unwritten. Evidence is incomplete.
  *   **Step 3 (Reception Weight):** No. Unpublished/unfinished.
  *   **Step 4 (Retrospective):** N/A.
  *   **Step 5 (Authority/Ethics):** **Yes.** Estate wants cut; Ghostwriter wants keep. Ethical harm (caricature) vs. Scholarly integrity (completeness).
  *   **Procedure Output:** **Handoff to Senior Editor (You).**
      *   *Reasoning:* The procedure halts at Step 5. This is not a textual query; it is an ethical and legal one. However, my practitioner advice is: **Print the passage with a prominent editorial headnote explaining the unwritten frame.**
      *   *Confidence:* 50% (Because the procedure explicitly abdicates here).
      *   *Dislike Factor:* **High.** The Estate wants it cut. My advice (and the scholarly norm) is to print it with framing. This risks legal friction with the Estate. But cutting it creates a text that is intellectually dishonest (hiding the caricature without the critique). The procedure tells you this is *your* call, not the text's. You must choose between the Estate's comfort and the text's integrity.

  ---

  ### Part 4: Limitations and Misfires

  This procedure is a tool, not a truth machine. It will misfire in the following scenarios:

  1.  **Collaborative Texts:** If a novel was heavily edited by a spouse or editor (common in the 20th century), "Authorial Intention" is a fiction. The procedure assumes a single agent. It will struggle with texts like *Under the Volcano* or *The Waste Land* where multiple intentions collide.
  2.  **Radical Unreliability:** If the entire book is meant to be misunderstood (e.g., a narrator who lies throughout), Step 3 (Reception) might lock in a "wrong" reading that is actually the "right" experience. The procedure favors stability over subversion.
  3.  **Ethical Shifts:** The procedure treats ethical harm as a "Handoff." It does not solve it. If a passage becomes unacceptable due to shifting social norms (not just caricature, but something more severe), the procedure offers no guidance on whether to censor for the sake of the *Future Readership* (Candidate 4). You will have to impose that value judgment manually.
  4.  **The "Silent Correction" Trap:** In Case 1, the procedure says "Annotate." But if you have a 40-note cap, you may be forced to emend silently simply to save space for more critical notes. The procedure assumes infinite note space; your budget does not. You will need a "Triage Within Triage" for when the note cap is full.

  **Final Practitioner Note:**
  Your friend is right that intention never settles anything *metaphysically*. You are right that it settles things *pragmatically*. This procedure splits the difference: Intention rules during composition (Step 2); Reception rules after publication (Step 3); Memory rules nowhere (Step 4). Use it to defend your decisions in that weekly meeting. When the procedure says "Handoff," that is when you earn your salary as Senior Editor.
