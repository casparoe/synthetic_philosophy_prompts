      *   *Evaluation:* Static, stateless, next-token prediction focused.
      *   *Deployment:* Dynamic, stateful, tool-using, iterative.
      *   *Underlying Ontology:* Are we evaluating the *engine* (weights) or the *vehicle* (system)?
      *   *Philosophical Angle:* Functionalism, Dualism, Emergence, Simulation Theory (in the AI sense).

  3.  **Drafting - Section by Section:**

