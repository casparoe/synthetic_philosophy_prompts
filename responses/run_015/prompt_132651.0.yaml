          *   Is it "functionalist dualism"? Yes, effectively. It privileges the *architecture of interaction* over the *substrate of intelligence*.
          *   The risk is underestimating how much "agency" is latent in the weights, waiting for scaffolding to unlock it. (The "unlocking" vs. "creating" distinction).
