answer: |-
  ### Specification of Requirements for Interpersonal Comparisons

  The following requirements are derived from the constraints of the allocator: a public, accountable agent distributing a fixed health budget among identified patients using imperfect data. The metric must support both sum-ranking and priority-weighting without presupposing either.

  #### Grade 1: Order Comparability (Ranking)
  *Can we say Patient A is better off than Patient B?*

  1.  **Resistance to Adaptive Preferences**
      *   **Requirement:** The metric must not rank a patient as better off solely because they have lowered their expectations to match their deprivation.
      *   **Case Anchor:** Case 1 (Content chronic pain vs. unhappy acute). If the metric relies only on self-reported satisfaction, the allocator cannot justify giving more resources to the unhappy patient.
      *   **Tag:** Non-negotiable.
      *   **Cost:** Requires a theory of well-being distinct from subjective satisfaction (e.g., objective list or hedonic tone), increasing epistemic burden.

  2.  **Transitivity and Closure**
      *   **Requirement:** If A > B and B > C, then A > C. The ordering must be complete over the set of identifiable patients.
      *   **Case Anchor:** Case 2 (Chain of conditions). If the metric yields intransitivities (migraine > wrist > depression > blindness > migraine), the allocator faces a cycle and cannot distribute funds without arbitrariness.
      *   **Tag:** Non-negotiable.
      *   **Cost:** Forces the metric to smooth over "hard cases" where intuition suggests incomparability, potentially masking uncertainty.

  3.  **Non-Manipulability**
      *   **Requirement:** A patient cannot improve their allocation priority by falsely reporting lower well-being.
      *   **Case Anchor:** Case 6 (Strategic presentation). If self-report is the sole input, the system incentivizes exaggeration of suffering.
      *   **Tag:** Non-negotiable.
      *   **Cost:** Requires triangulation with clinical data or observed choice, reducing the weight of patient testimony.

  #### Grade 2: Unit Comparability (Intervals)
  *Can we say the gain from treating A equals the gain from treating B?*

  4.  **Intra/Inter-Personal Consistency**
      *   **Requirement:** The measure of a change in well-being for one person over time must be on the same scale as the difference between two people at one time.
      *   **Case Anchor:** Case 3 (Allocation across time vs. across persons). If the metric treats "my future pain" differently from "your current pain," the allocator cannot justify shifting resources from a terminal patient to a newborn.
      *   **Tag:** Non-negotiable.
      *   **Cost:** Rules out purely subjective scales where "pain" is defined idiosyncratically by each agent.

  5.  **Aggregation Resolution**
      *   **Requirement:** The metric must specify whether a large number of small gains can outweigh a single catastrophic loss.
      *   **Case Anchor:** Case 9 (Many small harms vs. one severe). If the metric is silent here (incomparable), the allocator cannot balance public health screening (many small benefits) against trauma care (one large benefit).
      *   **Tag:** Negotiable. (The allocator could adopt a lexical priority rule instead of a metric solution, but the metric should ideally allow the calculation).
      *   **Cost:** Requires cardinality. If the metric is only ordinal, this calculation is impossible.

  #### Grade 3: Level Comparability (Zero Point)
  *Can we say Patient A is worse off than Patient B in absolute terms, not just relatively?*

  6.  **Fixed Zero Anchor**
      *   **Requirement:** The point representing "neutral" well-being (life neither worth living nor not) must be fixed across persons.
      *   **Case Anchor:** Case 5 (The Zero). If Patient A's zero is at "mild discomfort" and Patient B's is at "death," we cannot identify who is "worst off" for priority weighting.
      *   **Tag:** Non-negotiable.
      *   **Cost:** Smuggles in a normative conception of the "good life." You cannot derive this from preference data alone (see Suspicion 1).

  7.  **Independence from Existence of Others**
      *   **Requirement:** The measurement of Patient A's well-being level must not change depending on whether Patient B exists or how well off Patient B is.
      *   **Case Anchor:** Case 8 (Urgency via comparison). If A's score drops simply because B is worse off, the metric conflates *well-being* with *justice*. The metric must measure the former so the principle can measure the latter.
      *   **Tag:** Non-negotiable.
      *   **Cost:** Distinguishes the metric (welfarist) from the principle (prioritarian/egalitarian). Prevents "reverse-engineering" the metric to fit the conclusion.

  8.  **Unified Treatment of Existing and Potential**
      *   **Requirement:** The metric must be able to assign a value to the well-being of a person who exists only under one allocation option.
      *   **Case Anchor:** Case 7 (Non-identity).
      *   **Tag:** Prejudice (Person-Affecting vs. Impersonal). For a budget of *identified* patients, this is not strictly necessary.
      *   **Cost:** High metaphysical burden. If dropped, the theory cannot handle reproductive health or long-term infrastructure, only acute care.

  #### Grade 4: Ratio Comparability (Magnitude)
  *Can we say Patient A is twice as well off as Patient B?*

  9.  **Numeraire Invariance**
      *   **Requirement:** The ranking of outcomes should not depend on which patient's scale is used as the reference unit.
      *   **Case Anchor:** Case 4 (Numeraire test). If ordering changes when switching from A's units to B's, the metric is arbitrary.
      *   **Tag:** Prejudice (Cardinal Realism). Necessary for cost-benefit analysis, but not strictly for priority-to-the-worst-off, which relies on levels (concavity), not ratios.
      *   **Cost:** Requires a natural zero and unit, which is philosophically contentious for well-being.

  10. **Public Reason-Giving**
      *   **Requirement:** Every comparison issued by the metric must be translatable into a reason intelligible to the loser.
      *   **Case Anchor:** Case 10 (Public defensibility). "You scored 0.4 QALYs lower" is not a reason; "You have less capacity to function" is.
      *   **Tag:** Non-negotiable.
      *   **Cost:** Restricts the metric to concepts that can be publicly articulated (excludes purely neurological or hidden mental state metrics).

  ---

  ### Evaluation of Candidate Requirements

  | Candidate Requirement | Status | Rationale |
  | :--- | :--- | :--- |
  | **Recoverability from observed choice alone** | **Prejudice** | Revealed preference fails Case 1 (adaptation) and Case 6 (strategy). Clinical/self-report data is available and necessary. |
  | **Deference to own testimony** | **Negotiable** | Essential for Case 10 (reasons), but cannot be absolute due to Case 1 (adaptation) and Case 6 (strategy). Must be triangulated. |
  | **Completeness over every pair** | **Non-negotiable** | The allocator must decide. Incomparability leads to paralysis or arbitrary tie-breaking. |
  | **Separability from unaffected parties** | **Non-negotiable** | Required for Case 8. The *metric* must measure well-being, not justice. If the metric changes based on others, you cannot test distributive principles. |
  | **Invariance under independent affine rescaling** | **Prejudice** | Incompatible with Level Comparability (Req 6). If you allow independent shifts of zero ($b_i$), you cannot compare levels. |
  | **Non-manipulability** | **Non-negotiable** | Required for Case 6. A metric that incentivizes lying is operationally useless. |
  | **Closure under chaining** | **Non-negotiable** | Required for Case 2. Sorites fragility makes the metric unusable for policy. |
  | **Unified intra/inter treatment** | **Non-negotiable** | Required for Case 3. Distinct procedures for time vs. person create arbitrariness in intergenerational or terminal care. |
  | **Extension to merely possible people** | **Negotiable** | Required for Case 7, but out of scope for "identified patients in a single year." Keep only if theory expands later. |
  | **Reason-expressibility** | **Non-negotiable** | Required for Case 10. A black-box number cannot defend a public allocation. |

  ---

  ### Testing the Suspicions

  **Suspicion 1: Full invariance under independent rescaling cannot coexist with level comparability.**
  **Verdict: Confirmed.**
  Mathematically, an independent positive-affine transformation is $u_i' = a_i u_i + b_i$ (where $a_i > 0$). Level comparability requires that statements like $u_i > u_j$ remain true after transformation. This holds only if $b_i = b_j$ for all $i, j$. If you allow independent $b_i$, you allow independent shifting of the zero point. If Person A's zero shifts up and Person B's shifts down, their relative levels reverse.
  **What is being imported?** To secure level comparability, you must fix the zero point normatively (e.g., "death," "neutral hedonic tone," or "minimal agency"). This imports a substantive theory of well-being (hedonism, objective list, etc.) that preference data alone does not supply.
  **Is it acceptable?** For your use case (adjudicating sum vs. priority), it is unavoidable. Priority-to-the-worst-off *requires* knowing who is worst off in absolute terms. You cannot earn this from choice data alone; you must stipulate a zero.

  **Suspicion 2: Completeness, refusal to make anyone worse off merely because others are worse off (Pareto), and transitivity cannot be had together.**
  **Verdict: False (for the metric), True (for certain principles).**
  For the *metric* itself (measuring well-being), these three are compatible. You can have a complete, transitive ordering of well-being levels that satisfies Pareto (if everyone's well-being rises, the total/priority sum rises).
  **The Catch:** The conflict arises if you demand the *distributive principle* satisfy Strong Equity (leveling down improves justice) *and* Pareto *and* Completeness. Telic Egalitarianism violates Pareto (Levelling Down Objection). Prioritarianism satisfies Pareto.
  **Isolation of Assumption:** The inconsistency arises only if you assume the metric must *encode* the distributive principle (e.g., measuring "justice" rather than "well-being"). If the metric measures well-being (satisfying Completeness, Transitivity, Pareto) and the principle applies weights (Priority), the trilemma dissolves. Your specification keeps these separate (Req 7), so the suspicion does not block your project.

  **Joint Unsatisfiability Warning:**
  **Non-manipulability + Deference to Testimony + Adaptive Preferences.**
  You cannot have all three. If you defer to testimony (Case 1), you succumb to adaptation. If you correct for adaptation (clinical judgment), you reduce deference. If you make it non-manipulable (Case 6), you must ignore some testimony. You must sacrifice *absolute* deference to testimony to save the system from strategy and adaptation.

  ---

  ### Most Exclusionary Requirement & Recommendation to Drop

  **Most Exclusionary Requirement:** **Fixed Zero Anchor (Grade 3, Req 6).**
  This requirement excludes Strict Ordinalism, Revealed Preference Theory, and any approach relying on independent affine invariance. It forces you to commit to a substantive theory of well-being (e.g., hedonic tone or objective functioning) rather than a formal preference-satisfaction model. It is the gatekeeper that allows you to distinguish Sum-Ranking from Priority.

  **Requirement to Drop:** **Extension to merely possible people (Grade 3, Req 8).**
  **Why:** Your use case is explicitly "identified patients in a single year." The non-identity problem (Case 7) applies to policies that change *who* is born. In a triage or annual budget context, the population is fixed. Retaining this requirement forces you to solve the hardest problem in population ethics to solve a problem in clinical allocation. Drop it for Chapter 2; reintroduce it only if the dissertation expands to intergenerational justice.

  ---

  ### Scorecard of Candidate Approaches

  | Approach | Order (1-3) | Units (4-5) | Levels (6-8) | Ratios (9) | Reasons (10) | Verdict |
  | :--- | :---: | :---: | :---: | :---: | :---: | :--- |
  | **Strict Ordinalism** | Pass | Fail | Fail | Fail | Pass | **Inadequate.** Cannot distinguish sum vs. priority; fails Case 3 & 5. |
  | **Impartial Observer** | Pass | Pass | Negotiable | Fail | Pass | **Partial.** Generates level data via imagination, but struggles with Case 1 (adaptation) and Case 6 (strategy). |
  | **Partial Comparability** | Pass | Pass | Fail | Fail | Pass | **Inadequate.** Stops short of the level comparisons needed for Priority (Case 5, 8). |
  | **Primary Goods Proxy** | Pass | Pass | Pass* | Fail | Pass | **Viable.** *If* goods correlate with well-being levels. Fails Case 1 (disability adaptation) unless adjusted. |
  | **Health Tariff (QALY)** | Pass | Pass | Pass* | Fail | Fail | **Viable but Risky.** *If* zero is fixed (death=0). Fails Case 10 (numbers not reasons) and Case 1 (adaptation). |
  | **Flat-footed Realism** | Pass | Pass | Pass | Pass | Pass | **Ideal but Epistemically Costly.** Meets all criteria if true, but offers no method for the allocator to access the "true" scale (Case 6, 10). |

  *Note on "Pass*": Indicates the approach structurally allows for the grade, but practical application often falters on the specific case anchors (e.g., QALYs have a fixed zero but often ignore adaptation).*
