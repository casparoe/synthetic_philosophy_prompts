  **OFFICE FOR NARRATIVE COHERENCE**
  **CONSULTATION DOCUMENT: ONC-2024-TB**
  **SUBJECT: PROPOSAL FOR THE TRUNK-AND-BRANCH CURRICULUM FRAMEWORK**

  1. The Office for Narrative Coherence (ONC) invites evidence regarding the proposed Trunk-and-Branch reform to the National History Curriculum. Current instructional models allocate significant contact hours to discontinuous events and discontinued programmes. This creates cognitive friction for learners attempting to map historical processes onto the current constitutional and social settlement. The proposed reform mandates that secondary history be taught backwards from the present, tracing the line of descent that actually produced existing institutions. Content not lying on this line of descent is classified as branch material. Branch material is removed from mandatory assessment and retained only as optional enrichment. This ensures that instructional time correlates directly with the causal weight required to understand the present.

  2. Critics may suggest that this approach privileges the victor. The ONC notes that privilege is a function of source survival. Administrative capacity correlates strongly with political success. Groups that secured long-term governance produced more records, filed more returns, and generated more archival trace. Groups that failed to secure governance typically possessed lower administrative capacity and left fewer records. To mandate equal coverage of high-trace and low-trace entities is to impose an artificial symmetry upon an asymmetrical archive. The pruning of branch material merely makes explicit the verdict the sources have already returned. Where documentation for a defeated movement is absent, this absence is treated as evidence of that movement's operational insignificance at the critical juncture.

  3. A pilot evaluation was conducted in twelve trial schools during the 2023 academic year. Data indicates that where branch material is pruned, students demonstrate higher retention of causal chains leading to the present. However, a secondary effect was observed: students began to treat the present settlement as a structural certainty rather than an achieved state. When alternative paths are removed from mandatory view, learners infer that the outcome was the only possible outcome. This reduces the perceived agency of historical actors. If the outcome was always coming, nobody deserves credit and nobody deserves blame. This undermines the curriculum's civic function, which requires students to understand that decisions carry weight.

  4. **Definitions.** To ensure procedural clarity, the ONC distinguishes three uses of the current settlement in curriculum design. Type 1 Orientation uses the outcome as a device for choosing topics. Type 2 Orientation uses the outcome as part of the explanation of why earlier people acted as they did. Type 3 Orientation uses the outcome as a claim about what had to happen. The Trunk-and-Branch framework adopts only Type 1 Orientation. It does not claim that actors knew the future, nor that the future was fixed. It claims only that the present provides the most efficient filter for selecting relevant pasts.

  5. To operationalise Type 1 Orientation without slipping into Type 2 or Type 3, the ONC introduces the Temporal Alignment Rating (TAR). The TAR assigns a neutral technical score to historical actors by comparing their stated aims with the settlement we now have. Actors whose aims match the present settlement receive a high TAR. Actors whose aims contradict the present settlement receive a low TAR. This is not a moral judgement. It is a measure of coherence. However, this systematically down-rates people who could not have known about that settlement. To mitigate this, a Fairness Adjustment is applied. Actors operating prior to the critical juncture are relabelled as Pre-Settlement Agents. This retains the low TAR verdict while acknowledging their temporal distance from the outcome.

  6. **Worked Example: The 1938 Munich Agreement.** The current settlement relies on the defeat of totalitarian regimes in 1945. The policy of Immediate Rearmament (1938) aligns with this outcome. The policy of Appeasement (1938) contradicts this outcome. Under Trunk-and-Branch, Immediate Rearmament is trunk material. Appeasement is branch material. The case for Appeasement was reasonable at the time; public opinion opposed war, and rearmament was incomplete. However, because Appeasement did not produce the present settlement, it is pruned from mandatory content. Neville Chamberlain receives a low TAR. The Fairness Adjustment designates him a Pre-Settlement Agent. This allows students to note his position without granting it load-bearing status in the narrative of how the present was achieved.

  7. To address the pilot evaluation finding regarding student agency, the ONC proposes a Licensed Contingency Provision. A small quota of officially preserved heritage alternatives will be introduced. These are selected and annotated by the ONC and designated non-load-bearing. This ensures that the emotional payoff of progress is retained while the risk that anyone takes an alternative seriously is removed. Students may study the branch, provided they understand it is a heritage object rather than a viable path. This maintains stakeholder confidence in the curriculum's rigour while preventing the confusion that arises from treating defeated programmes as live options.

  8. **Equality and Impact Assessment.** The reform ensures all students reach the same conclusion regarding the legitimacy of current institutions. Differential access to branch material is minimised by standardising the optional enrichment packs. There is no anticipated negative impact on protected characteristics. The focus on administrative capacity ensures that groups with lower historical literacy rates are not burdened by complex counterfactuals. The narrative is streamlined to reduce cognitive load for learners with special educational needs. The outcome is a more inclusive understanding of why the present looks as it does.

  9. The ONC is confident that the Trunk-and-Branch framework resolves the tension between historical accuracy and civic utility. By making the selection mechanism explicit, we remove the hidden biases of traditional chronology. The next phase of implementation involves digitising the trunk narrative for key stage 4. Consultees are asked to respond to the following questions by the closing date.

  10. **Questions for Consultees.**
      1. Do you agree that the current settlement provides the most efficient filter for selecting relevant pasts?
      2. Is the Temporal Alignment Rating a sufficient metric for assessing coherence without implying moral judgement?
      3. Should the quota for Licensed Contingency Provision be set at 5% or 10% of total contact hours?
      4. Are there any specific branch movements where the absence of documentation should not be treated as evidence of insignificance?

  11. Responses should be submitted via the ONC portal. The Office intends to publish the summary of responses in Q4 2024. Implementation is scheduled for the 2025 academic year.
