  We say *if* Oswald missed, another did,
  While avowing ignorance of who it *would*.
  It fits the facts like flame to *match*,
  Based solely on what the evidence *lit*,
  Confined to facts within this actual *world*,
  Where conditions remain broadly *similar*.

  In contexts less causally *similar*,
  The commitment changes, not the *if*.
  To posit alternatives for this *world*,
  Then someone else inevitably *would*.
  This concedes what the actual past has *lit*,
  Is fixed, unlike the striking of a *match*.

  Take a standard striking of a *match*,
  In circumstances broadly *similar*,
  We expect that the flame is *lit*.
  We hold this true only *if*
  No defeaters intervene, it *would*,
  In the nearest accessible *world*.

  But change the facts of that near *world*,
  Remove the oxygen for the *match*,
  And say the flame it never *would*.
  The surface features stay *similar*,
  Yet the outcome flips even *if*
  The strike is hard, the head is not *lit*.

  Restore the air, and it is *lit*,
  Shifting the ordering of the *world*,
  No contradiction arises *if*
  We see the context moves the *match*,
  To a context still *similar*,
  Where the consequent holds, as it *would*.

  So what one claims that one *would*,
  Depends on what the evidence *lit*,
  And how the cases count as *similar*,
  Varies across the logical *world*,
  Not every antecedent will *match*,
  The same consequent, given *if*.

  One checks the chance the *match* is *lit*,
  One ranks the *world* by *similar*;
  Leaving standard open, both claim *if* it *would*.

