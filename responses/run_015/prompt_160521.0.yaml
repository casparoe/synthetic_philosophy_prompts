answer: |-
  ### Part 1: The Logical Space & View Mapping

  Before writing the questions, we need to map the "logical space" of possible answers. Since we cannot ask about theories directly, we must infer the theory from the pattern of verdicts on concrete cases.

  **The Four Diagnostic Axes**
  Every question in the quiz effectively probes one of these four underlying commitments:
  1.  **Existence:** Do composite objects (like statues) exist fundamentally, or only particles?
  2.  **Unity:** When a statue and a lump occupy the same space, is that one object or two?
  3.  **Persistence:** What makes an object the *same* over time? (Matter, Form, or History?)
  4.  **Objectivity:** Is there a single true count of objects, or does it depend on how we look?

  **Mapping the Leaves to the Space**
  Here is where your eight target views sit in this space. Note that several views occupy the exact same coordinate on *case verdicts*, differing only in metaphysical explanation.

  | View | Existence | Unity (Statue/Lump) | Persistence (Form vs Matter) | Objectivity |
  | :--- | :--- | :--- | :--- | :--- |
  | **Nihilism** | No composites | N/A | Nothing survives part change | Objective (Zero) |
  | **Eliminativism** | Statues unreal | N/A | Particles survive, "statues" don't | Objective (Particles only) |
  | **Monism** | Yes | **One Thing** | Matter dictates survival (usually) | Objective |
  | **Constitution** | Yes | **Two Things** | Form/History dictates statue survival | Objective |
  | **Coincidentalism**| Yes | **Two Things** | Form/History dictates statue survival | Objective |
  | **Perdurantism** | Yes (4D) | **Two Things** (overlapping worms) | Temporal parts differ | Objective |
  | **Stage Theory** | Yes (3D stages)| **Two Things** (stage relations) | Temporal counterparts differ | Objective |
  | **Relativism** | Yes/No | Depends | Depends | **Not Objective** |

  **The "Honesty" Clause: Indistinguishable Views**
  You suspected some views can't be separated by cases. You are right.
  *   **Constitution vs. Coincidentalism:** These yield identical answers to every physical case. The difference is whether one object *makes up* the other or if they just *happen to overlap*. A case-based quiz cannot separate them. They will score as the same result.
  *   **Perdurantism (Worms) vs. Stage Theory:** Both are "4D" views. In almost all standard puzzles (squashing, swapping), they give the same verdicts on what survives. The difference is technical (is the object a long tube or a thin slice?). Cases cannot pry them apart.
  *   **Nihilism vs. Eliminativism:** Both say "There are no statues." One says "There are only simples," the other says "Talk of statues is false." For a pub quiz, they are functionally the same.

  **The "Do No Work" Questions**
  *   **Question 6 (The Finger):** Almost every view except strict Nihilism says the statue survives a broken finger. This question mostly filters out extreme Nihilism but doesn't help distinguish the other seven views much.
  *   **Question 9 (The Doorstop):** This is a variant of the Statue/Lump case. It reinforces Q1/Q2 but doesn't add new discriminatory power unless the participant is sensitive to *function* specifically.

  ---

  ### Part 2: The Quiz

  **Instructions:** Read each scenario. Pick the answer that feels most true to you. Don't overthink it; go with your gut.

  **1. The Squash (The Statue)**
  A sculptor makes a beautiful statue out of a lump of clay. Then, someone takes a hammer and squashes the statue into a shapeless ball.
  *   A) The statue is gone. It ceased to exist.
  *   B) The statue is still there, it's just a ball now.
  *   C) The statue is gone, but the *thing made of clay* is still there.
  *   D) It depends on whether you're counting art or just stuff.

  **2. The Squash (The Lump)**
  Same scenario: The statue is squashed into a ball.
  *   A) The lump of clay is gone. It ceased to exist.
  *   B) The lump of clay is still there, it's just a ball now.
  *   C) The lump is gone, but the atoms are still there.
  *   D) It depends on how you define "lump."

  **3. The Reshape (Same Shape)**
  The ball of clay is dried out, crushed into powder, mixed with water, and molded back into the *exact* original shape of the statue.
  *   A) It is the original statue, restored.
  *   B) It is a perfect copy, but the original is gone.
  *   C) It is the same lump of clay, but a new statue.
  *   D) There is no fact of the matter; both descriptions work.

  **4. The Reshape (Different Shape)**
  Instead of the original shape, the sculptor reshapes the clay into a completely different statue (a horse instead of a person).
  *   A) The first statue turned into the second one.
  *   B) The first statue was destroyed, and a new one made.
  *   C) The clay survived, but both statues are different things.
  *   D) "Statue" is just a label we put on the clay; nothing really changed.

  **5. The Swap (Ship of Theseus Style)**
  Over a year, every single particle of the statue is replaced one by one with new clay. The old particles are kept in a pile.
  *   A) The statue is the one standing on the pedestal (new particles).
  *   B) The statue is the pile of old particles (reassembled).
  *   C) The statue is gone; a new one took its place.
  *   D) Both are the statue, or neither; the word doesn't cover this.

  **6. The Broken Finger**
  A finger breaks off the statue and sits in a drawer for a week. Then it is glued back on perfectly.
  *   A) The statue ceased to exist when the finger broke, and a new one was made when glued.
  *   B) It was the same statue the whole time, just damaged.
  *   C) The clay was the same, but the statue blinked out of existence.
  *   D) Whether it's the "same" is just a choice of words.

  **7. The Underground**
  Before the sculptor dug up the clay, it had been sitting in the ground for a thousand years.
  *   A) The statue was already there, waiting to be found.
  *   B) The lump was there, but the statue began only when the sculptor worked.
  *   C) Nothing exists except the particles, so "statue" doesn't apply yet.
  *   D) It's arbitrary; you can count it either way.

  **8. The Twins (The Mold)**
  A sculptor pours clay into a mold that makes two indistinguishable statues side-by-side from the same batch. She points to the left one and says, "This is my masterpiece."
  *   A) Her statement is true only of the left object.
  *   B) Her statement is true of the clay batch, so it covers both.
  *   C) There is really only one object there, split in two.
  *   D) Truth depends on the context; there's no hard fact about which one.

  **9. The Doorstop**
  A sculptor makes a statue specifically designed to also function as a heavy doorstop. Before it is squashed, how many objects are sitting by the door?
  *   A) One object (a statue-doorstop).
  *   B) Two objects (a statue and a doorstop).
  *   C) Zero objects (just particles arranged that way).
  *   D) The number changes depending on why you're asking.

  **10. The Insurance Policy**
  An insurance policy covers "loss of raw materials" but excludes "works of art." The statue is squashed. Who gets paid?
  *   A) The owner gets paid for the clay, because the art is gone but the material remains.
  *   B) No one gets paid; the material is still there, so no loss occurred.
  *   C) The owner gets paid for the art, because the value was in the form, not the clay.
  *   D) The contract is flawed; reality doesn't split "art" and "clay" cleanly.

  ---

  ### Part 3: Scoring Key

  *Note for the Quizmaster: Do not show this to the participants. This maps their answer patterns to the metaphysical "Leaves."*

  **Scoring Method:**
  Tally the answers. Look for the dominant pattern. Most people will not be consistent; look for the "cluster" that matches best.

  **The "Nothing Survives" Cluster (Nihilism / Eliminativism)**
  *   **Signature:** Mostly **C** or **A** on Q1, Q2, Q5, Q9.
  *   **Key Indicator:** Q9 (Zero objects) or Q2 (Lump is gone).
  *   **Verdict:** You lean toward **Mereological Nihilism** or **Error Theory**. You think composite objects (statues, lumps, tables) don't fundamentally exist; only the smallest particles do. When parts scatter, the object is gone.
  *   *Note:* The quiz cannot distinguish Nihilism from Eliminativism; both deny the existence of the statue in the same way.

  **The "One Thing" Cluster (Monism / Identity Theory)**
  *   **Signature:** Q1 (**B**) and Q2 (**B**) match. Q3 (**A** or **C**).
  *   **Key Indicator:** If the Statue survives the squash *because* the Clay survives, you are a Monist.
  *   **Verdict:** You hold the **Identity View**. You believe the statue and the clay are literally one and the same object. Therefore, they must have the same life story. If the clay survives the squash, the statue *must* have survived too (even if we stop calling it a statue).
  *   *Alternative:* If you said Q1 (**A**) and Q2 (**A**), you are a **Strict Monist** who thinks the "form" is essential to the matter, so destroying the form kills the object entirely.

  **The "Two Things" Cluster (Constitution / Coincidentalism / 4D Views)**
  *   **Signature:** Q1 (**C**) and Q2 (**B**). This is the most common "philosophical" intuition.
  *   **Key Indicator:** The Statue dies, the Clay lives. They have different survival conditions.
  *   **Verdict:** You separate the **Artifact** from the **Material**.
      *   If you feel they are intimately linked (one makes up the other), you lean toward **Constitution Theory**.
      *   If you feel they are just two distinct objects occupying the same space, you lean toward **Coincidentalism**.
      *   If you think of them as long stretches of time that share a middle section, you lean toward **Perdurantism (Worm Theory)** or **Stage Theory**.
      *   *Honesty Check:* This quiz *cannot* separate Constitution, Coincidentalism, Worms, or Stages. They all answer "Statue dies, Clay lives" to the squash case. The difference is in *how* they explain it, not *what* they say happens.

  **The "It Depends" Cluster (Relativism / Conceptualism)**
  *   **Signature:** Mostly **D** answers.
  *   **Key Indicator:** Q8, Q10, Q3 chosen as "arbitrary" or "depends on counting."
  *   **Verdict:** You are a **Conceptual Relativist**. You believe the world doesn't come pre-sliced into objects. "Statue" and "Lump" are concepts we project onto the world for convenience. There is no fact of the matter about how many objects exist independent of our interests.

  ---

  ### Part 4: Honest Assessment of Limitations

  You asked for honesty about which questions do no work and which leaves remain glued together.

  **1. The Indistinguishable Leaves**
  *   **Constitution vs. Coincidentalism:** These are metaphysically distinct but empirically identical in this context. Both say "Statue != Clay" and "Statue dies, Clay lives." A case-based quiz cannot separate them. To distinguish them, you would need to ask: "Is the statue *made of* the clay, or do they just *share* parts?" which edges toward jargon.
  *   **Perdurantism (Worms) vs. Stage Theory:** Both are 4-dimensionalist views. In a "squash" case, the Worm theorist says the statue-worm ends and the clay-worm continues. The Stage theorist says the statue-stage has no future counterpart and the clay-stage does. The verdict is the same. You cannot separate them without asking about the *nature of time* (e.g., "Is the object present all at once or spread out?"), which violates the "plain English" constraint.
  *   **Nihilism vs. Eliminativism:** Both result in "No statue." Nihilism says "No composite objects exist." Eliminativism says "Composite objects exist but 'statue' is a false category." For the purpose of a pub quiz, these are the same leaf.

  **2. The Questions That Do Little Work**
  *   **Question 6 (The Finger):** Almost every view except strict Nihilism agrees the statue survives a temporary break. This question only helps filter out the Nihilists. It does not help distinguish Monists from Dualists.
  *   **Question 9 (The Doorstop):** This is essentially a re-run of the Statue/Lump case (Q1/Q2) but with function instead of form. Most people who say "Statue != Clay" will also say "Statue != Doorstop." It reinforces the "Two Things" intuition but doesn't isolate a unique view.

  **3. Can Further Cases Pry Them Apart?**
  *   **Constitution vs. Coincidence:** No standard case separates them. They are "notational variants" regarding survival conditions. The difference is purely about the *relation* (constitution vs. coincidence), which is not observable in a physical scenario.
  *   **Worm vs. Stage:** Yes, but not with *survival* cases. You would need "modal" cases. Example: "If the statue had been squashed, would it have existed?" Stage theorists and Worm theorists handle counterfactuals differently. However, phrasing that in plain English without leading the witness is extremely difficult.
  *   **Monism vs. Relativism:** Yes. Q10 (Insurance) and Q8 (Twins) help here. Monists think there is a fact of the matter (One object). Relativists think the payout depends on the conceptual scheme.

  **Summary for the Pub:**
  Tell your participants: *"This quiz sorts your intuitions about objects, not your knowledge of philosophy. If you scored 'Two Things,' you might be a Constitution theorist, a Coincidentalist, or a 4D-er. Philosophers fight about which one you are, but you all agree on what happens when the hammer drops."*
