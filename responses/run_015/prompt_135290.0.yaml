  2. Menu of precise readings
  1. **The Biological Cost Thesis:** Agriculture degraded individual physiology through poorer nutrition and higher disease loads compared to foraging. (a) Health/Welfare, (b) General well-being, (c) Unintended consequence. This reading focuses on individual bodily outcomes rather than social structure. It implies the mistake was biological, not necessarily political, and does not require agency, only unfortunate evolutionary outcomes.
  2. **The Structural Determinism Thesis:** Surplus accumulation inherently requires defense and management, generating hierarchy inevitably once adopted. (a) Labor/Security, (b) Social hierarchy specifically, (c) Structural inevitability. This isolates inequality as the specific "mistake," distinct from health outcomes. It suggests technology dictates social form, making hierarchy inevitable *given* farming, but farming itself might be contingent.
  3. **The Rational Choice Failure Thesis:** Groups adopted farming despite visible downsides, failing to maximize welfare when alternatives existed. (a) Labor/Welfare, (b) Both, (c) **Relies on Counterfactual Agency.** This treats history as a series of negotiable deals where foragers could have collectively rejected the technology as a bad deal. It presupposes a level of conscious foresight rarely attributed to prehistoric groups.
  4. **The Population Trap Thesis:** Foraging carrying capacity was exceeded; farming was the only survival option, locking humanity into a high-population equilibrium. (a) Survival, (b) General well-being, (c) Evolutionary path dependency. Here, the "mistake" is systemic, not agential; there was no exit door once population growth began. It suggests inevitability rather than choice.
  5. **The Political Corruption Thesis:** Sedentism allowed elites to monopolize violence and resources, corrupting prior egalitarian norms that were sustainable only among mobile groups. (a) Autonomy, (b) Social hierarchy specifically, (c) Structural inevitability post-transition. This argues hierarchy is contingent on sedentism, not human nature, but becomes inevitable once sedentism occurs. It separates human nature from social structure.
