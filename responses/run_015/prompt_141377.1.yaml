      1.3 **Fixed Structural Facts:** We hold constant: Versailles Treaty constraints, Great Depression economic shock, prevalence of völkisch nationalism, elite conservative desire for authoritarianism, and widespread European anti-Semitism.
      1.4 **Methodology:** We treat causality probabilistically. We agree that "inevitable" means >90% probability and "impossible" means <5%. We agree that structural factors create the opportunity space, while agency determines the specific trajectory within that space.

