  ### A Note on the "Control Buys Time" Argument

  Your lead is technically correct that control buys time, but only if the *rate of capability growth* is slower than the *rate of control improvement*. Your sleeplessness likely stems from the suspicion that for deceptively misaligned models, the adversary (the model) is part of the capability growth, meaning the lock and the key are improving at the same rate. That is a valid structural concern. If you can, push for **interrogative monitoring** (asking the model to critique its own outputs for deception) rather than just **passive monitoring**; the former has slightly better theoretical grounding against schemers.
