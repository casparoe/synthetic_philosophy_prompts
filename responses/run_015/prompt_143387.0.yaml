prompt: |-
  I direct a state-level interfaith advocacy coalition — about ninety congregations across Christian, Jewish, Muslim, Sikh, and Buddhist traditions — that prepares lay witnesses to testify before legislative committees. We send witnesses to forty to sixty hearings per session. They are almost always volunteers with no training in philosophy or law, they get two minutes each, and my three staff members review and sign off on every testimony in advance. We currently handle religious content case by case, and it is failing in two opposite directions at once: some witnesses testify in a thick theological register that legislators hear as a demand to defer to an authority they do not accept, and other witnesses — told loosely by us to make it secular — end up reciting arguments they do not believe and cannot defend under questioning, which is worse than the original problem.

  I want the public-reason tradition turned into a procedure my staff can actually run. The raw material is familiar enough: the thought that coercive law should be justifiable to the people bound by it; the idea that a reason whose force depends on accepting a revelation, a scripture, or a comprehensive doctrine is not available to all citizens in the way a shared reason is supposed to be; the milder proviso version, on which religious reasons are admissible provided that public reasons are also given, in due course; and the standard reply that this asks religious citizens to split themselves in two and silently favors whichever comprehensive views are already culturally dominant. I do not need the debate rehearsed. I need it operationalized: ordered questions, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a named person because it turns on values rather than on whether the rule was followed.

  Six things keep going wrong, and I want you to decide which of them are real distinctions that must survive the simplification and which are confusions to discard:

  Translation versus ventriloquism. A staffer can usually produce a secular argument that supports the witness's position. The test I have been using is to ask the witness whether, if that argument were decisively refuted, they would still hold the position: if yes, there is a reason left over that has not been made public, and the testimony is ventriloquism. Is that the right test, and is ventriloquism actually a failure here or an acceptable bit of rhetoric?

  The proviso's deferral. The permission to supply public reasons in due course is unenforceable in a two-minute oral testimony that is never followed up. Should the procedure require the public-reason counterpart in the same venue, and what does it do with the witness who has none?

  Three audiences in one utterance. The witness is speaking at once to the committee, which will coerce; to their own congregation, which authorized them, pays dues, and will watch the clip; and to an archived public record with a longer memory than either. A formulation can be in order for the first and read as an act of shame to the second.

  Premise-use versus indictment-use. Religious language that supplies a premise for what the law should be seems different from religious language addressed to the polity's conscience — the register of this law makes us cruel, or of blessing and curse. I suspect the two deserve different treatment in the procedure, but I am not sure the difference is stable under pressure.

  The evenhandedness check. Whatever test we adopt should be applied to secular comprehensive doctrines as well: a witness who opposes a bill because it violates a Marxian or a Randian or a strict-libertarian world-view is in the same position, it seems to me, as the witness who opposes it on scriptural grounds. If the procedure admits one but not the other, it is just a taste test.

  Proximity to coercion. The requirement surely bites hardest on a judge writing an opinion and least on a letter to the editor, with committee testimony somewhere in the middle. My staff need the dial calibrated for the settings we actually operate in, not for the ones philosophers write about.

  Also tell me where intelligibility (others can follow it), accessibility (others can see its force without accepting its source's authority), and shareability (others could reasonably accept it) come apart, and which threshold you are recommending for committee testimony and why.

  Deliverable: a numbered procedure of no more than a dozen steps, preceded by the one-paragraph rationale that justifies the simplifications, and followed by a one-page version my field organizers can use in twenty minutes with a volunteer who has never thought about any of this. State explicitly where judgment cannot be eliminated and who signs off there.

  Then run it on three of our actual recurring cases. First, a Catholic parish volunteer opposing expansion of solitary confinement, whose actual reasons include the Gospels and the dignity of the person, and for whom public reasons — recidivism, mental-health costs, litigation exposure — also genuinely exist. Second, a Sikh congregation supporting statewide tenant right-to-counsel, whose reason is thoroughly religious and who has no data and no appetite for any. Third, a case where I expect to dislike the answer: a member congregation wants to oppose a bill mandating content in public-school sex education, their reasons are inescapably scriptural, and they regard the available secular framing as a mask rather than a translation. My fear is that a well-built procedure will systematically clear the witnesses whose theology happens to converge with secular consensus and silence the ones whose theology does not, which would make us a progressive advocacy group with a religious decoration. If that is what the procedure implies, say so, and say whether the honest fix is to accept the asymmetry, to loosen the rule, or to route these witnesses to a different kind of speech rather than to silence.

  Finally, state what the procedure cannot do: what it cannot settle about whether public reason is a sound requirement in the first place, what it cannot know about how legislators actually receive a line of testimony, and what it should do when a witness's tradition forbids them to offer any reason other than their own.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Director of a state-level interfaith advocacy coalition (90 congregations, 5 traditions, 40-60 hearings/session).
      *   **Problem:** Current handling of religious content in testimony is failing. Two extremes: (1) Thick theological register (legislators tune out/feel coerced), (2) Forced secularism (witnesses sound inauthentic/can't defend under questioning).
      *   **Goal:** Operationalize the "public reason" tradition into a usable procedure for staff (3 people) and volunteers (untrained, 2 mins).
      *   **Specific Constraints:**
          *   Numbered procedure (max 12 steps).
          *   Preceded by a 1-paragraph rationale.
          *   Followed by a 1-page field organizer version (20-min training).
          *   Explicitly state where judgment remains and who signs off.
          *   Address 6 specific "things going wrong" (Translation vs. Ventriloquism, Proviso's Deferral, Three Audiences, Premise vs. Indictment, Evenhandedness, Proximity to Coercion).
          *   Distinguish Intelligibility, Accessibility, Shareability (recommend a threshold).
          *   Run the procedure on 3 specific cases (Catholic/solitary confinement, Sikh/tenant counsel, Conservative/sex ed).
          *   Address the fear of bias (progressive decoration).
          *   State limitations (what the procedure *cannot* do).

  2.  **Deconstruct the Philosophical/Practical Tension:**

      *   *Public Reason (Rawls/etc.):* Law should be justifiable to all citizens. Religious reasons alone aren't enough because they rely on authority not shared by all.
      *   *The Reality:* Volunteers *are* motivated by faith. Forcing them to hide it kills authenticity. Letting them lead with it kills persuasiveness/legitimacy in a pluralistic legislature.
      *   *The Solution:* A "Dual-Track" or "Bridge" approach. Faith motivates, public reason justifies. The procedure must ensure the public reason isn't just a mask (ventriloquism) but a genuine overlap.

  3.  **Address the Six "Things Going Wrong":**

      *   *Translation vs. Ventriloquism:* The user's test (would you hold the position if the secular argument failed?) is good. If yes, it's ventriloquism *if* they present *only* the secular argument. If they present *both*, it's honest. *Decision:* Keep the distinction. Ventriloquism is a failure of integrity, not just rhetoric.
      *   *Proviso's Deferral:* "In due course" doesn't work for 2-minute testimony. *Decision:* Require the public reason *in the testimony*. If none exists, the testimony is inappropriate for *this* venue (legislative committee), though maybe okay for a rally.
      *   *Three Audiences:* This is the hardest. *Decision:* The procedure must prioritize the Committee (coercive power) without shaming the Congregation. The framing is "My faith leads me to care about X, and here is why X matters for *all* of us."
      *   *Premise vs. Indictment:* Premise ("Scripture says X, so law should be X") is problematic. Indictment ("This law causes suffering, which my faith calls evil") is accessible. *Decision:* Allow religious language for *motivation* and *moral gravity*, but not as the *sole warrant* for coercion.
      *   *Evenhandedness:* Yes, apply to Marxian/Randian views too. *Decision:* The test is "Comprehensive Doctrine" vs. "Public Justification," regardless of source.
      *   *Proximity to Coercion:* Committee testimony is high proximity. *Decision:* Calibrate strictly. This isn't a sermon; it's input on state force.

  4.  **Distinguish Intelligibility, Accessibility, Shareability:**

      *   *Intelligibility:* I understand the words. (Too low).
      *   *Accessibility:* I see why *you* think this, even if I don't agree. (Better).
      *   *Shareability:* I could reasonably accept this as a basis for law. (The Goal).
      *   *Recommendation:* **Accessibility** for the religious motivation, **Shareability** for the policy warrant.

  5.  **Drafting the Procedure (Max 12 Steps):**

      *   Need to flow from Motivation -> Policy Claim -> Public Warrant -> Check for Ventriloquism -> Final Review.
      *   Need to assign decision points (Staff vs. Director).

  6.  **Drafting the Field Organizer Version:**

      *   Needs to be simple, conversational, checklist-style.
      *   "The 20-Minute Prep."

  7.  **Running the Cases:**

      *   *Case 1 (Catholic/Solitary):* Easy pass. Faith motivates, public reasons (cost, recidivism) exist and are shareable.
      *   *Case 2 (Sikh/Tenant Counsel):* Harder. No data. Religious duty to justice. Need to find the public value (due process, stability). If they refuse secular framing, they might fail the "Shareability" test for *this* venue.
      *   *Case 3 (Sex Ed):* The "Bias Test." If the secular reason is viewed as a mask, the procedure should block it *for legislative testimony*. This confirms the user's fear: Public Reason *does* filter out views that don't overlap with secular consensus. I need to be honest about this. The fix isn't to break the rule, but to route the speech (e.g., moral witness outside the hearing).

  8.  **Addressing Limitations:**

      *   Can't solve the philosophical debate on Public Reason itself.
      *   Can't guarantee legislator reception.
      *   Can't force a tradition to change its theology.

  9.  **Refining the Output (Self-Correction during drafting):**

      *   *Check:* Did I answer the "Ventriloquism" question specifically? Yes, need to clarify that offering *both* is the key.
      *   *Check:* Is the tone appropriate? Professional, operational, respectful of the theology but firm on the political reality.
      *   *Check:* Did I handle the "Progressive Decoration" fear? This is crucial. I must admit that Public Reason *does* favor overlapping consensus. If the coalition wants to be purely prophetic, this procedure isn't for that. If they want to legislate, they need overlap.
      *   *Check:* Who signs off? Staff reviews, Director decides on edge cases (like the Sex Ed one).

  10. **Final Polish:** Ensure word counts and formatting match constraints (12 steps, 1-page field guide, specific case analysis). *Wait, the prompt asks for a "one-page version my field organizers can use". I should format that distinctly.*

  *(Self-Correction on Case 3)*: The user fears the procedure will silence dissent. If the procedure works correctly, it *should* identify that this testimony is not suitable for a *legislative committee* if it lacks public reasons. The honest fix is to route them to a different kind of speech (moral witness, op-ed, rally) rather than forcing a mask or letting them demand deference. I need to be explicit about this distinction between *legislating* and *prophesying*.

  *(Self-Correction on Thresholds)*: Intelligibility is too low. Shareability is too high for the *religious* part. Accessibility for religious motivation, Shareability for the policy claim.

  Let's assemble the response.

  *   **Rationale:** Focus on integrity and efficacy.
  *   **Procedure:** 12 steps.
  *   **Field Guide:** Simple checklist.
  *   **Case Studies:** Apply the steps.
  *   **Limitations:** Honest assessment.

  *Wait, one more check on the "Six Things":* I need to explicitly decide which are real distinctions and which are confusions in the rationale or procedure notes.
  *   Translation/Ventriloquism: Real.
  *   Proviso Deferral: Confusion (in this context).
  *   Three Audiences: Real tension, manage via framing.
  *   Premise/Indictment: Real distinction.
  *   Evenhandedness: Real requirement.
  *   Proximity: Real calibration.

  Okay, ready to write.
answer: |-
  ### Rationale

  This procedure operationalizes public reason not as a gag order on faith, but as a translation protocol for coercion. We distinguish between the *motivation* for advocacy (which may remain fully theological) and the *warrant* for state force (which must be accessible to those who do not share that faith). We reject the "proviso's deferral" for legislative testimony; in a two-minute window, the public justification must be present, not promised. We treat "ventriloquism" as a failure of integrity: if the witness would hold the position without the public reason, the public reason is a mask, and the testimony risks dishonesty. We accept that this procedure will filter out positions that lack an overlapping consensus with secular public values; this is not a bug but a feature of seeking legislative change rather than prophetic witness. The threshold for religious language is *accessibility* (non-believers understand why this matters to you); the threshold for policy claims is *shareability* (non-believers could reasonably accept this as a basis for law). Judgment cannot be eliminated at the point of determining whether a secular argument is a "mask" or a "bridge"; that decision rests with the Director.

  ### The Operational Procedure (12 Steps)

  1.  **Identify the Policy Claim:** The witness must state clearly what specific legislative action they support or oppose.
  2.  **Identify the Theological Motivation:** The witness articulates the religious or comprehensive doctrine reason for their position (e.g., "My faith commands care for the poor").
  3.  **Identify the Public Warrant:** The witness must articulate at least one reason for the policy that does not rely on the authority of their tradition (e.g., "This policy reduces state costs" or "This protects public safety").
  4.  **The Ventriloquism Test:** Staff asks the witness: "If the Public Warrant (Step 3) were proven false or irrelevant, would you still support this policy?"
      *   If **No**: Proceed to Step 5.
      *   If **Yes**: The Public Warrant is insufficient. The witness must either find a stronger public warrant or the testimony is flagged for Director review (risk of ventriloquism).
  5.  **The Premise/Indictment Check:** Review religious language.
      *   **Permitted:** Religious language used to express moral gravity or motivation (e.g., "We see this as a sin," "Our tradition calls us to this").
      *   **Prohibited:** Religious language used as the sole logical premise for coercion (e.g., "Because Scripture says X, the state must do X").
  6.  **The Evenhandedness Check:** Apply Steps 3 and 4 as if the witness's motivation were Marxian, Libertarian, or Atheist. If the argument relies on premises unique to a comprehensive doctrine without public translation, it fails regardless of source.
  7.  **The Proximity Calibration:** Because this is committee testimony (high proximity to coercion), the Public Warrant (Step 3) must appear *in the oral testimony*, not just in written materials.
  8.  **The Three-Audience Framing:** Draft the opening to address the Committee first, the Congregation second. Formula: "I am here as a person of faith, *and* as a constituent concerned about [Public Value]."
  9.  **Intelligibility & Accessibility Review:** Ensure a listener who rejects the witness's faith can still understand *why* the witness cares (Accessibility) and follow the logic of the policy claim (Intelligibility).
  10. **Shareability Threshold:** Ensure the Public Warrant appeals to values generally held by the polity (justice, safety, fiscal responsibility, liberty), not just the witness's group.
  11. **Staff Sign-Off:** Two staff members must verify Steps 1–10 are met.
  12. **Director Adjudication:** Any case flagged in Step 4 (Ventriloquism) or Step 5 (Premise/Indictment boundary) goes to the Director. The Director decides if the testimony is approved, rejected, or routed to non-legislative advocacy (e.g., press conference, rally).

  ***

  ### Field Organizer's Checklist (20-Minute Prep)

  **Volunteer Name:** ___________________ **Hearing:** ___________________
  **Staff Prep Lead:** ___________________ **Date:** ___________________

  **Part 1: The Core Argument (5 Minutes)**
  *   [ ] **What do you want the legislature to do?** (Be specific: Bill Number, Amend, Kill, Pass).
  *   [ ] **Why does your faith call you to this?** (Write this down exactly as you feel it. We will not delete this, but we may move it).
  *   [ ] **Why should a neighbor of a different faith (or no faith) agree with you?** (This is the "Public Warrant." It must be about *their* lives, taxes, safety, or rights, not just your doctrine).

  **Part 2: The Integrity Check (5 Minutes)**
  *   [ ] **The "What If" Question:** If someone proved your Public Warrant wrong (e.g., "This bill actually *costs* more money"), would you still support the bill?
      *   *If YES:* We need to find a better Public Warrant. If you only support this for religious reasons, we cannot use *only* secular arguments in testimony, or you will be "ventriloquizing."
      *   *If NO:* Good. Your secular and religious reasons are aligned.
  *   [ ] **The "Because" Test:** Are you asking the legislature to obey your scripture, or to solve a public problem your scripture highlighted?
      *   *Correct:* "My faith teaches me human dignity is sacred; therefore, I urge you to fix this policy that violates dignity."
      *   *Incorrect:* "My faith teaches human dignity is sacred; therefore, you must pass this bill."

  **Part 3: Drafting the Two Minutes (10 Minutes)**
  *   [ ] **Opening:** "I am [Name], from [Congregation]. I speak as a person of faith and a constituent."
  *   [ ] **The Bridge:** "My tradition teaches [Religious Motivation]. This leads me to care deeply about [Public Value]."
  *   [ ] **The Ask:** "I urge you to [Policy Claim] because [Public Warrant]."
  *   [ ] **Review:** Read it aloud. Does it sound like *you*? Does it sound like a *citizen*?
      *   *If it sounds like a sermon:* Add more data/public impact.
      *   *If it sounds like a lobbyist script:* Add back your moral motivation.

  **Staff Sign-Off:**
  *   [ ] Prep Lead Initials: ______
  *   [ ] **Director Review Required?** (Check if "What If" answer was YES or if religious language is the only premise).
      *   [ ] If checked, do not schedule witness until Director clears.

  ***

  ### Case Applications

  **Case 1: Catholic Volunteer vs. Solitary Confinement**
  *   **Analysis:** The witness has theological reasons (Gospels, dignity) and public reasons (recidivism, cost, litigation).
  *   **Procedure Result:** **Pass.**
  *   **Application:** Step 4 (Ventriloquism) is satisfied because the public reasons are genuine, not just masks. Step 5 (Premise/Indictment) is managed by framing the theological point as the *motivation* for caring about the *public* cost and safety.
  *   **Testimony Structure:** "My faith teaches the inherent dignity of the person. This conviction leads me to examine the data, which shows solitary confinement increases recidivism and liability. I urge you to ban this practice to protect public safety and fiscal integrity."
  *   **Verdict:** This is the ideal overlap. The theology drives the engagement; the public reason drives the legislation.

  **Case 2: Sikh Congregation for Tenant Right-to-Counsel**
  *   **Analysis:** Reason is thoroughly religious (justice/dharma); no data/appetite for secular framing.
  *   **Procedure Result:** **Conditional Fail / Reroute.**
  *   **Application:** Step 3 (Public Warrant) is weak. Step 4 (Ventriloquism) triggers: If data showed counsel didn't help, would they still support it? Likely yes. This risks ventriloquism if they pretend it's about data. However, "Justice" and "Due Process" are public values.
  *   **Fix:** Staff must help them find the public value *within* their conviction. Is it about *fairness* in court? *Stability* in housing? If they refuse to articulate a public harm (e.g., "evictions hurt community stability"), they fail Step 10 (Shareability).
  *   **Verdict:** If they refuse to articulate a public warrant beyond "God commands it," they cannot testify before a *legislative committee* under this procedure. They should be routed to a moral witness event or press conference where the goal is testimony, not legislation.

  **Case 3: Conservative Congregation vs. Sex-Ed Mandate**
  *   **Analysis:** Reasons are inescapably scriptural; secular framing is viewed as a mask.
  *   **Procedure Result:** **Fail for Legislative Testimony.**
  *   **Application:** This triggers your fear directly. The procedure identifies that there is no *overlapping consensus* here. The "secular framing" (e.g., parental rights) is viewed by the witness as a lie (Step 4 Ventriloquism Test fails).
  *   **The Bias Acknowledgement:** You are correct. A public-reason procedure systematically clears witnesses whose theology converges with secular consensus (Case 1) and silences those whose theology conflicts with it (Case 3). This makes the coalition appear progressive.
  *   **The Honest Fix:** Do not loosen the rule. If you allow scriptural warrants for coercion in a pluralistic legislature, you invite theocracy. Instead, **route the speech.** This witness should not be testifying to *coerce law* based on premises their neighbors reject. They should be speaking to *culture* (op-eds, pulpits, rallies).
  *   **Verdict:** The procedure protects the coalition's integrity. It tells the volunteer: "We cannot ask the state to enforce your scripture. We can help you explain to your neighbors why you oppose this, but not as a legislative mandate." If they insist on legislative testimony based solely on scripture, they must do so as individuals, not under the coalition's banner of interfaith *public* advocacy.

  ***

  ### Limitations: What This Procedure Cannot Do

  1.  **It Cannot Settle the Philosophical Debate:** This procedure assumes public reason is a valid requirement for coercive law. It cannot convince a witness who believes religious truth *should* override pluralistic deliberation. It manages the conflict; it does not resolve the theology.
  2.  **It Cannot Control Reception:** A witness can follow every step and still be ignored or misunderstood by legislators. The procedure ensures integrity and accessibility, not efficacy or persuasion.
  3.  **It Cannot Override Conscience:** If a tradition forbids offering any reason other than their own (e.g., "Thus saith the Lord" is the only valid warrant), this procedure cannot accommodate them for legislative testimony. It must exclude them from this specific venue to maintain the coalition's commitment to pluralistic advocacy.
  4.  **It Cannot Eliminate Judgment:** Step 12 (Director Adjudication) is necessary because the line between "moral indictment" and "theological premise" is often blurry. The procedure highlights the tension; a human must resolve it.
