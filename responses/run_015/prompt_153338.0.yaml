  **The Impossible Pair**
  **Global Correlatability** and **Agency Specificity** cannot be jointly satisfied. Earth Science requires a synchronous global spike (like 1950s radionuclides) to correlate archives cleanly. Politics requires identifying specific actors (like colonial industrializers), whose impacts were diachronous and uneven. If you prioritize the global line, you obscure the specific "who" required for responsibility. If you prioritize the specific "who," you lose the synchronous marker required for stratigraphy. Science wins on the definition, but Politics wins on the usage, creating a permanent fracture.

  **The Boundary Killer**
  **Agency Specificity** rules out the most familiar candidates. The **Early Agriculture** proposal fails because it treats "humanity" as a monolith, obscuring which societies drove change. The **1610 CO2 Dip** fails because the causal link to human action (genocide vs. climate) remains debated and indirect. The **Mid-20th Century (Great Acceleration)** fails most critically: while it offers the sharpest global marker, it universalizes responsibility across all humans equally, erasing the historical asymmetry of emissions and resource use. By demanding we name the agent, this requirement invalidates any date that relies on vague anthropogenic generalizations.
