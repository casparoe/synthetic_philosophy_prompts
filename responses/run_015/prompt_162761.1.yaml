      *   *Step (3):* The Regress. If (1) and (2) are strictly deterministic, this follows.
      *   *Step (4):* The Principle of Ultimate Responsibility (PUR). This is the core philosophical hinge. "You only deserve X if you are the ultimate source of the act."
      *   *Step (5) & (6):* The Deterministic Conclusion. If (3) and (4) hold, desert vanishes.
      *   *Step (8):* The Generalization to Hard Determinism. This is the "Hard Incompatibilist" position (Galen Strawson, Derk Pereboom).

  3.  **Identify the Weak Points (Where to "Throw Out" a Step):**
      *   *Option A: Attack (4) - Compatibilism.* This is the most common philosophical move. Reject the idea that "really yours" requires being an *uncaused cause*. You can deserve things even if your actions are determined by prior causes, as long as those causes align with your character/values.
      *   *Option B: Attack (1) or (2) - Libertarian Free Will / Break the Chain.* Argue that there *is* a break in the causal chain. Human agency isn't fully determined by prior payback/trauma. This saves "Ultimate Responsibility" but requires a metaphysical leap (contra-causal freedom).
      *   *Option C: Attack (1) - Redefine Karma.* Karma isn't mechanical payback; it's educational or natural law.
      *   *Option D: Accept (8) - Hard Incompatibilism / Revisionism.* Accept that "desert" in the basic sense is an illusion, but keep punishment for consequentialist reasons (safety, rehabilitation). This hurts the user's intuition that the ex *deserved* it.

