          *   To save punishment, we need a version of (4) that is compatible with causality (Compatibilism).
          *   To save the father from the funeral remark, we need to reject (1) as a universal law of immediate payback.

  6.  **Refining the "Which Step to Throw Out" Advice:**
      *   **Step (1) is the most vulnerable.** It defines Karma as strict, proportional, mechanical payback. Most theological/philosophical systems soften this.
