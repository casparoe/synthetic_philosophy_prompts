      *   **Friend's Suggestion:** Treat karma as debt (transferable/writable) rather than desert.
      *   **User's Preference:** Wants to keep (4) (Desert requires ownership) and the intuition that people deserve punishment. Willing to drop (1) if necessary.

  2.  **Evaluate the Argument Steps:**
      *   *Step (1):* Definition of Karma. Strict, mechanical, proportional.
