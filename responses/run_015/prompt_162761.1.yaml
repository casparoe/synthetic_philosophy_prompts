          3.  Backwards Regress: Every act is influenced by prior payback, ad infinitum (no first cause).
          4.  Desert Condition: You only deserve outcomes for acts that are *really yours* (not determined by prior external forces/payback).
          5.  Conclusion from 2 & 3: No act is really yours (all downstream).
          6.  Conclusion: Nobody deserves anything.
          7.  Self-Refutation: Karma (a theory of desert) eliminates desert.
