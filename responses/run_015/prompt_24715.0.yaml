prompt: |-
  I work in software engineering, not philosophy, so I'll state the use case directly: I'm building a decision-support module for an engineering team. Given a pending decision (ship or hold a feature, buy or build a component, run the migration this quarter or next) and a candidate information-gathering action (an A/B test, a user survey, a load test, a vendor quote), the module should estimate the value of the information and compare it against the cost of acquiring it, so we can decide whether to run the test before we make the call. I keep running into a result usually attributed to I. J. Good — that under standard expected utility the expected value of free information is never negative — and before I read further I want the specification: what must a theory of the value of information deliver to count as adequate for backing a decision rule of the form "acquire this information at cost c only if its value exceeds c"?

  Write the desiderata list. For each requirement, give the case or consideration that motivates it, and mark which are non-negotiable (a theory that fails one is simply wrong) and which are preferences of a particular modeling camp. Below are the requirements I expect to see in the neighborhood; add the ones I haven't listed, and drop any of these that are actually prejudices rather than genuine desiderata, saying so.

  - It must derive the non-negativity result rather than assume it, and must say exactly which assumptions do the work — whether the agent is free to ignore the signal, whether preferences are fixed, whether processing the information is costless — because I need to know which of those my team actually satisfies.
  - It must separate value ex ante, before the result is seen, from value ex post, after it; the module reports a number before the test runs, and "the test came back bad" must not get logged as "information can have negative value."
  - It must handle information that changes what the agent wants, not just what the agent believes — a trial that reveals we actually hate the new UI — since the non-negativity result is usually stated for belief-only updates.
  - It must handle information about the agent's own preferences, and say whether self-discovery is the same channel as preference change in general or a different one.
  - It must treat value as defined relative to a decision problem rather than as an intrinsic property of the information, and say what happens when the same measurement is worth more to one decision than to another.
  - It must accommodate the value of information about information — the option value of learning now partly because it tells us whether to buy more information later — and say whether the non-negativity result survives that recursion.
  - It must handle information whose acquisition has side effects on what is being measured (the survey changes the users, the experiment changes the system), i.e., information that is not a passive observation.
  - It must be consistent with the fact that people and teams actually avoid information — skip the doctor's appointment, don't open the survey results — without either declaring the avoiders irrational or quietly giving up the non-negativity result; it should say where the negative-value cases live: cost, preference change, disutility of knowing, or a violation of one of the theorem's assumptions.

  Then two closing items. First, identify any subset of the requirements you think is jointly unsatisfiable — in particular, whether "preserve the non-negativity theorem as a core result" and "treat rational information avoidance as a first-class case" can both be met, and if so at the price of which assumption. That part matters most to me. Second, a brief scorecard: how do vanilla expected-utility decision theory, models that let information change preferences, and models of costly attention or information avoidance each do against the list? Keep the scorecard short; the requirements and the joint-satisfiability question are the point.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Software Engineer building a decision-support module. Practical, implementation-focused, skeptical of philosophical hand-waving. Wants clear specifications, not just theory.
      *   **Task:** Create a "desiderata list" for a theory of Value of Information (VoI) that supports a specific decision rule ("acquire if Value > Cost").
      *   **Input:** The user provided a list of 8 potential requirements. I need to evaluate them (keep, drop, modify), add missing ones, and classify them as "Non-Negotiable" (NN) vs. "Modeling Preference" (MP).
      *   **Closing Items:**
          1.  Identify jointly unsatisfiable requirements (specifically regarding non-negativity vs. information avoidance).
          2.  Provide a brief scorecard for three theoretical approaches (Vanilla EU, Preference-Changing Models, Costly Attention/Avoidance Models).
      *   **Constraint:** Keep the scorecard short. Focus on requirements and satisfiability.

  2.  **Evaluate the User's Proposed Requirements:**

      *   *Req 1 (Derive non-negativity + assumptions):* Crucial. If the code assumes non-negativity but the real world violates the assumptions (e.g., cost of processing), the module gives bad advice. -> **Keep, NN.**
      *   *Req 2 (Ex ante vs. Ex post):* Essential for engineering. You calculate EV *before* running the test. Realized value can be low, but expected value must be positive (under standard theory). Confusing these leads to "post-hoc rationalization" bugs. -> **Keep, NN.**
      *   *Req 3 (Information changes wants/preferences):* Standard VoI (Good/Blackwell) assumes fixed utility functions. If a test reveals "we hate this UI," is that a belief update (we thought we liked it) or preference change? Usually, it's belief update about *which* preference state holds. However, if the *act* of testing changes the preference (endowment effect, etc.), standard VoI breaks. This is a edge case but important for "ship/hold" decisions. -> **Keep, but clarify distinction between belief about preferences vs. causal change of preferences. NN for correctness, but standard theory fails here.**
      *   *Req 4 (Information about own preferences):* Similar to #3. Self-discovery. Standard Bayesian updating handles uncertainty about one's own utility function. -> **Keep, NN.**
      *   *Req 5 (Context-dependent value):* VoI is always relative to the decision problem. Information about server load is useless if you aren't deciding on scaling. -> **Keep, NN.**
      *   *Req 6 (Value of Information about Information / Sequential):* Real engineering decisions are multi-stage (Pilot -> A/B -> Rollout). VoI must handle option value. -> **Keep, NN.**
      *   *Req 7 (Side effects/Intervention):* "The survey changes the users." This violates the assumption that the state of the world is independent of the observation. This moves from VoI to Value of Experimentation (where the action affects the state). -> **Keep, NN.**
      *   *Req 8 (Information Avoidance):* This is the tricky one. Standard VoI says free info is never negative. People avoid info. To model this, you need to break an assumption (cost, utility of belief, etc.). The theory must *explain* this, not necessarily *endorse* it as rational under standard EU. -> **Keep, but classify carefully.**

      *   *Missing Requirements:*
          *   **Computability/Tractability:** It's software. If the VoI calculation requires solving an intractable POMDP, it's useless. -> **Add, NN.**
          *   **Calibration/Operationalization:** How do we plug in numbers? Priors, likelihoods. If the theory doesn't specify inputs, it's not a module spec. -> **Add, NN.**
          *   **Time Sensitivity:** Delay cost. Gathering info takes time. Opportunity cost of waiting. -> **Add, NN.**

  3.  **Refine and Classify (NN vs. MP):**

      *   *NN:* Things that, if violated, make the module mathematically unsound or practically useless for the stated goal (compare Value vs. Cost).
      *   *MP:* Things that depend on whether you are a strict Bayesian, a behavioral economist, etc.

      *   *Critique of User's Req 3 & 4:* Standard Bayesian VoI *does* handle uncertainty about preferences (Req 4). It treats "my utility function" as a hidden state variable. Req 3 (changing wants) is trickier. If the info *causes* the change (e.g., trying a drug changes your taste), that's an intervention, not passive info. I need to make sure the distinction is clear.
      *   *Critique of User's Req 8:* A theory of *rational* VoI cannot validate irrational avoidance without modifying the utility function (e.g., adding "anxiety" cost). So the requirement should be "It must identify the source of avoidance (cost vs. utility of belief)," not necessarily "treat avoiders as rational under standard EU."

  4.  **Address the "Jointly Unsatisfiable" Question:**
      *   *Conflict:* "Free information has non-negative expected value" (Good's Theorem) vs. "Rational agents sometimes avoid free information."
      *   *Resolution:* They are incompatible *under the standard assumptions of Good's Theorem* (fixed utility over outcomes only, costless processing, no side effects). To satisfy both, you must relax an assumption (e.g., utility depends on belief state directly, or processing has cognitive cost).
      *   *Verdict:* You can have a theory that explains avoidance, but you lose the strict "Free Info $\ge$ 0" theorem in its classic form. You replace it with "Free Info $\ge$ 0 *unless* utility depends on beliefs."

  5.  **Drafting the Scorecard:**
      *   *Vanilla EU (Good/Blackwell):* Fails on avoidance, side effects, and preference change (if causal). Great on ex-ante non-negativity.
      *   *Preference-Changing (Endogenous):* Handles preference uncertainty, but breaks non-negativity if preferences shift causally.
      *   *Costly Attention/Behavioral:* Handles avoidance, but makes VoI calculation much harder (often intractable).

  6.  **Review and Refine (Self-Correction during drafting):**
      *   *Tone:* Keep it engineering-spec style. Precise, actionable.
      *   *Check:* Did I drop any prejudices? The user asked me to drop prejudices.
          *   *Prejudice Check:* "It must derive non-negativity." Actually, if the theory is for *avoidance*, it shouldn't derive non-negativity universally. It should derive it *conditionally*. I will refine this to "Specify conditions for non-negativity."
          *   *Prejudice Check:* "It must handle information that changes what the agent wants." In standard decision theory, you don't "want" things differently; you have uncertainty about what you want. True preference *change* is dynamic inconsistency. I need to clarify this distinction in the spec.
      *   *Addition:* "Tractability" is huge for software. I must emphasize this.
      *   *Addition:* "Delay Cost." Info isn't free if it delays the ship date.

  7.  **Final Polish:**
      *   Structure: Desiderata List (with NN/MP tags and rationale), Unsatisfiability Analysis, Scorecard.
      *   Ensure the "Good's Theorem" nuance is clear: It applies to *expected* value ex-ante, not realized value ex-post.

  8.  *(Final thought on Req 8)*: The user wants the theory to "accommodate" avoidance without declaring avoiders irrational *or* giving up non-negativity. This is the core tension. I need to be honest: You can't have it both ways under one definition of "Value." You either expand "Cost" to include psychological cost (preserving rationality, breaking "free") or you accept irrationality (preserving "free", breaking rationality). I will flag this in the Unsatisfiability section.

  9.  *(Final thought on Req 3)*: "Information that changes what the agent wants." If I test a UI and realize I hate it, my preference didn't change; my *belief* about my preference was updated. If I test a UI and the act of using it makes me hate it (mere exposure effect reversed?), that's a causal side effect (Req 7). I will merge/clarify these.

  Let's assemble the response.

  *   **Desiderata:** Group them logically (Foundational, Operational, Edge Cases).
  *   **Unsatisfiability:** Focus on the "Free Info" vs. "Avoidance" tension.
  *   **Scorecard:** Keep it tight.

  *Wait, one more check:* The user asked to "drop any of these that are actually prejudices."
  *   *Candidate for dropping:* "It must derive the non-negativity result rather than assume it."
      *   *Reasoning:* If the goal is to model avoidance, the theory *should not* derive non-negativity universally. It should derive the *conditions* under which it holds. Demanding it derive non-negativity biases the theory toward standard EU.
      *   *Correction:* Change to "It must explicitly state the necessary and sufficient conditions for the non-negativity result."
  *   *Candidate for dropping:* "It must handle information that changes what the agent wants."
      *   *Reasoning:* As noted, this is often a category error in decision theory. It's usually belief update about preferences. True preference change is dynamic inconsistency. I will refine this to "Distinguish belief updates about preferences from causal preference modification."

  Okay, ready to write.
answer: |-
  Here is the specification for the Value of Information (VoI) module. I have evaluated your proposed requirements, filtered out prejudices, added engineering-critical constraints, and classified them by necessity.

  ### Desiderata List for VoI Module

  #### I. Foundational Logic (Non-Negotiable)
  *These requirements ensure the mathematical integrity of the decision rule.*

  1.  **Conditional Non-Negativity Derivation** (Modified from your #1)
      *   **Spec:** The theory must not assume non-negativity universally. It must derive the inequality $E[VoI] \ge 0$ and explicitly list the necessary assumptions (e.g., costless processing, fixed utility function, no side-effects).
      *   **Rationale:** Good's Theorem is a conditional result, not a law of physics. If your team violates an assumption (e.g., analysis paralysis costs time), the module must flag that the theorem no longer guarantees positive value.
      *   **Status:** **Non-Negotiable.** (Dropped the demand that it *must* derive non-negativity; it must derive the *conditions* for it. Demanding universal non-negativity is a prejudice that blinds the model to avoidance cases.)

  2.  **Ex-Ante vs. Ex-Post Distinction** (Your #2)
      *   **Spec:** The module must compute *Expected* Value of Information (EVoI) prior to acquisition. It must not conflate a "bad outcome" (e.g., test fails) with "negative value of information" (e.g., running the test was a mistake).
      *   **Rationale:** Engineering post-mortems often confuse "we made the wrong choice" with "we shouldn't have gathered data." The decision rule relies on expectations, not realized outcomes.
      *   **Status:** **Non-Negotiable.**

  3.  **Decision-Context Relativity** (Your #5)
      *   **Spec:** VoI must be computed relative to a specific set of available actions and a specific utility function. The same data point (e.g., "latency is 200ms") must return different values depending on whether the decision is "optimize DB" or "cancel project."
      *   **Rationale:** Information has no intrinsic value, only instrumental value relative to a choice.
      *   **Status:** **Non-Negotiable.**

  4.  **Tractability & Approximation Bounds** (Added)
      *   **Spec:** The theory must provide an algorithm for computing VoI that terminates in polynomial time relative to the state space, or provide bounded approximations with error guarantees.
      *   **Rationale:** Exact VoI calculation often requires solving a POMDP, which is intractable for complex engineering systems. A theory that requires perfect foresight of all future decision nodes is unusable in software.
      *   **Status:** **Non-Negotiable.** (A theory that cannot be computed is not a module spec.)

  #### II. Structural Dynamics (Non-Negotiable)
  *These requirements handle the temporal and causal structure of engineering decisions.*

  5.  **Sequential/Option Value** (Your #6)
      *   **Spec:** The model must account for the value of information that enables *further* information gathering (e.g., a pilot study that justifies a full A/B test).
      *   **Rationale:** Engineering decisions are rarely one-shot. Ignoring the "option value" of information systematically undervalues early-stage discovery.
      *   **Status:** **Non-Negotiable.**

  6.  **Delay & Opportunity Cost** (Added)
      *   **Spec:** The cost of acquisition ($c$) must include the time value of money/feature delivery. If gathering info delays the decision, the utility of the eventual action must be discounted by that delay.
      *   **Rationale:** "Free" information is never free in engineering; it costs cycle time. Good's Theorem assumes costless acquisition; your module operates in a resource-constrained environment.
      *   **Status:** **Non-Negotiable.**

  7.  **Intervention vs. Observation** (Refined from your #7)
      *   **Spec:** The model must distinguish between *passive observation* (reading logs) and *active experimentation* (A/B testing where the test affects the user experience).
      *   **Rationale:** Active experiments violate the assumption that the state of the world is independent of the measurement. This requires a Value of *Experimentation* model, not just VoI.
      *   **Status:** **Non-Negotiable.**

  #### III. Agent Model & Preferences (Modeling Preferences)
  *These requirements depend on how you model the human/team element. Failures here do not make the math wrong, but they may make the model mismatch reality.*

  8.  **Preference Uncertainty vs. Preference Change** (Refined from your #3 & #4)
      *   **Spec:** The model must distinguish between (A) updating beliefs about a fixed but unknown utility function (e.g., "I didn't know we cared about latency") and (B) causal modification of the utility function by the information itself (e.g., "Using this tool made us dependent on it").
      *   **Rationale:** Standard VoI handles (A) perfectly. It fails on (B). Most "preference change" in engineering is actually (A). True (B) is rare and requires dynamic inconsistency models.
      *   **Status:** **Modeling Preference.** (Standard Bayesian theory handles A. If you need to model B, you must leave standard decision theory.)

  9.  **Information Avoidance Mechanism** (Refined from your #8)
      *   **Spec:** The theory must locate the source of avoidance in one of three buckets: (1) Acquisition Cost (including cognitive load), (2) Instrumental Harm (side effects), or (3) Intrinsic Disutility of Belief (anticipatory utility).
      *   **Rationale:** You cannot have it both ways. Either the avoider is rational (because there is a hidden cost/disutility) or they are irrational (violating EU). The module must pick a lane to output a number.
      *   **Status:** **Modeling Preference.** (This defines which "camp" your module belongs to.)

  ---

  ### Joint Satisfiability Analysis

  **The Conflict:** You asked to "preserve the non-negativity theorem as a core result" AND "treat rational information avoidance as a first-class case."

  **Verdict:** These are **jointly unsatisfiable** under a single definition of "Value" and "Cost."

  1.  **Good's Theorem** states $E[VoI] \ge 0$ for *free* information, assuming utility depends only on *outcomes* and actions, not on *beliefs*.
  2.  **Rational Avoidance** implies $E[VoI] < 0$ for some *free* information.
  3.  **Resolution:** To satisfy both, you must expand the definition of "Cost" or "Utility."
      *   **Path A (Standard EU):** Maintain Non-Negativity. Information avoidance is always irrational or driven by hidden costs (e.g., time, anxiety modeled as a cost).
      *   **Path B (Psychological EU):** Maintain Rational Avoidance. Utility depends on belief states (e.g., "I prefer not to know I have the disease"). This **breaks** the Non-Negativity Theorem. Free information *can* have negative expected utility because the belief state itself enters the utility function.

  **Engineering Recommendation:** For a decision-support module, **choose Path A**. Model anxiety, cognitive load, and political risk as explicit *costs* ($c$). This preserves the mathematical robustness of Good's Theorem (ensuring your module doesn't output negative values for "free" data) while explaining avoidance behavior via the cost term ($Value < Cost$). If you choose Path B, your VoI calculations become non-convex and significantly harder to optimize.

  ---

  ### Theoretical Scorecard

  | Requirement | Vanilla Expected Utility (Good/Blackwell) | Preference-Uncertainty Models (Bayesian Utility) | Costly Attention / Behavioral Models |
  | :--- | :--- | :--- | :--- |
  | **Non-Negativity Derivation** | **Pass.** Derives $E[VoI] \ge 0$ strictly. | **Pass.** Handles uncertainty about utility params as state variables. | **Fail.** Allows $E[VoI] < 0$ if belief-states have disutility. |
  | **Ex-Ante vs. Ex-Post** | **Pass.** Clear distinction. | **Pass.** Clear distinction. | **Pass.** Clear distinction. |
  | **Preference Change** | **Fail.** Assumes fixed utility function. | **Pass.** Handles learning *about* preferences. | **Mixed.** Can model causal preference shifts as costs. |
  | **Sequential/Option Value** | **Pass.** (In theory). | **Pass.** (In theory). | **Pass.** (Often better at modeling stopping rules). |
  | **Intervention/Side-Effects** | **Fail.** Assumes passive observation. | **Fail.** Assumes passive observation. | **Pass.** Often integrates causal intervention models. |
  | **Information Avoidance** | **Fail.** Declares avoiders irrational. | **Fail.** Declares avoiders irrational. | **Pass.** Models avoidance as rational optimization of attention/cost. |
  | **Tractability** | **Fail.** Often requires intractable integration. | **Fail.** High dimensional priors on utility. | **Mixed.** Heuristics often required, easier to approximate. |

  **Summary Recommendation:**
  Build your module on **Vanilla Expected Utility** but aggressively expand the **Cost ($c$)** term.
  1.  Use Good's Theorem for the Value calculation (ensures mathematical stability).
  2.  Model "avoidance" drivers (anxiety, political risk, cognitive load, delay) as explicit costs added to $c$.
  3.  This satisfies the decision rule ("Acquire if $Value > Cost$") without breaking the underlying theorem or requiring intractable behavioral modeling.
