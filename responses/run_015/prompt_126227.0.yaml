      *   User wants to know if they should scrap metrics.

      *(Self-Correction during drafting)*: I should be careful not to give definitive HR advice, but rather analyze the logic. I need to make sure I don't just bash Dan, but explain *why* his analogy fails in this specific context. The key is the *timescale* and *relatedness*.

  8.  **Final Polish:** Ensure clear headings and a supportive conclusion. (Proceed to generate output based on this thought process).

      *Key insight to emphasize:* Dan is arguing for *altruism* in a system designed for *competition*. The system pays for team output but splits equally. That's the friction point.

