  | **Causal Coupling** | Can transfer continuity via interaction. | Creates distinct copies; switching off is death. | **Prediction:** Does coupling bridge the gap? | **(c) Lockstep:** Process says "Transfer"; Pattern says "Two-then-One." |
  | **Time/Speed** | Continuous operation requires reasonable clock speed. | Speed irrelevant to functional org. | **Prediction:** Does slowing break the chain? | **(b) Clock-Speed:** Pattern says "Same"; Process says "Risk if gap too large." |

  **III. CLOSING: EVIDENCE & MOVERS**

  **Verbal vs. Substantive**
  The dispute is 40% verbal, 60% substantive.
  *   **Verbal:** We use "survive" differently. Process means "unbroken existence"; Pattern means "someone exists who matters to me."
