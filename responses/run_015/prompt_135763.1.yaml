  **Title:** The Great Man vs. The Great Ice

  **Characters:**
  *   **Prof. Event:** An event-based historian (believes in "Great Men").
  *   **Prof. Braudel:** A geohistorian (believes in *longue durée*).
  *   **The Emperor:** Thinks he is the protagonist of history.
  *   **The Glacier:** A deep, slow voice (can be read off-stage).

  **[Scene: A war room map. Prof. Event and Prof. Braudel are arguing over a plastic figurine of an army.]**

  **Prof. Event:** "Look! The Emperor moves the legion here. Boom. Victory. History hinges on this thumb placement."

  **Prof. Braudel:** "Actually, the pastureland below is supporting fewer sheep than it did in 1200 AD. The real story is the calving rate."

  **The Emperor:** *(Bursting in)* "I care not for sheep! I care for glory! I shall cross the Alps tonight!"

  **Prof. Event:** "There he goes! Changing history in real time!"

  **Prof. Braudel:** "He's walking on a moraine. It's unstable."

  **The Emperor:** "I am the master of nature! I command this ice to hold my weight!"

  *(A long, awkward silence. The Emperor waits for obedience.)*

  **The Glacier:** *(Very slowly)* "I... hear... your... command..."

  **The Emperor:** "Excellent!"

  **The Glacier:** "...from... when... you... entered... the... valley..."

  **The Emperor:** "Wait, what?"

  **The Glacier:** "...I... have... already... decided... to... melt..."

  **Prof. Braudel:** "Structural inevitability."

  **The Emperor:** "But I just got here!"

  **The Glacier:** "In... my... time... you... have... been... here... forever... and... I... am... tired..."

  *(Sound of cracking ice.)*

  **Prof. Event:** "Can we blame his mood for that?"

  **Prof. Braudel:** "No. We blame the Little Ice Age. Class dismissed."
