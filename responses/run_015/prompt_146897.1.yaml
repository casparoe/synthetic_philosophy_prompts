answer: |-
  Good evening. Thanks for coming out. I know it's hot, I know it's Saturday, and if you're anything like me, you're running on about four hours of sleep and too much coffee.

  For those who don't know me, I teach down the street. I'm an adjunct, which basically means I spend most of my week trying to convince undergraduates that reading matters, while grading papers on the subway. And one of the texts I teach—the one that keeps me up at night—is an essay by W.E.B. Du Bois from 1926.

  He makes this heavy claim in it. He says, "All Art is propaganda." He argues that Black artists don't have the luxury of making art just for art's sake, because the world is too busy trying to erase us. We have to fight.

  I was preparing for tonight, looking over my notes, and I realized I've been spelling the word wrong for years. I wrote "propoganda." With an O. Maybe that's appropriate. Maybe none of us really know how to spell this out correctly.

  Because here's the thing about this room. I know half of you are ready to debate Du Bois. You're wondering if these pieces meet the criteria. You're looking for the argument. And I know the other half of you are here because you love the people who made this work. You're looking for your cousin, your nephew, your neighbor. You don't want a lecture. You want to see them shine.

  Usually, when people talk about art and politics, they try to make everyone comfortable. They say, "Well, this piece is beautiful, *but* it's also political." As if the beauty is the sugar that helps the medicine go down.

  I don't think that's what's happening here. And I don't think Du Bois would think that either.

  Take the massive canvas on the back wall. No bodies. No narrative. Just color. It was made by a twenty-two-year-old former student of mine. When I asked her about the Du Bois essay, she didn't blink. She told me, "People expect me to perform trauma. They want my pain to be the propaganda."

  So she painted this. She insisted on beauty. She insisted on form. She told me, "Refusing to show them what they want—that's the propaganda."

  That's the truth of this show's title. "Truth is Beautiful." Not because beauty is easy, but because claiming it is hard work.

  I'm not standing here to tell you Du Bois was right. Honestly, I'm not even sure I agree with him anymore. I'm just a tired teacher trying to figure it out alongside you. But I do know this: when you look at these pieces, don't ask yourself if they are political *or* aesthetic. Don't ask if they are propaganda *or* art.

  Look at how much courage it takes to be soft in a hard world. Look at how much resistance it takes to simply be beautiful.

  So, to the theorists: wrestle with that. To the families: hold onto that. And to the artists: thank you for making us look.

  Please, enjoy the show. There's wine in the back, and I'm going to go sit down for a minute. Thank you.
