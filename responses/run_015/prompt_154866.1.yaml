  *(Self-Correction Note during final review)*: Make sure I don't treat Hart and Devlin as monoliths. Hart evolved, Devlin had nuances. But for this exercise, stick to the core *Morality of the Criminal Law* debate parameters as they relate to Wolfenden. Ensure the "silence" of the theory is highlighted—specifically regarding the *expressive* capacity of law that isn't coercive.

