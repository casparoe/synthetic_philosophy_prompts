  I've been going back and forth on this in my head for a while: in the Guide for the Perplexed (III.32 I think), Maimonides basically says animal sacrifice was never part of God's ideal to begin with -- it was a concession to how people were back then, a way of weaning Israel off of offering sacrifices to other gods, which is why the Torah funneled it all through the Temple. That's the part I find really hard to swallow. If it was just a temporary stopgap, why does so much of Leviticus treat it like its holy and important in itself? And I've seen people mention that a later commentator, I think it was Ramban, pushed back hard on this exact point. So: write an essay on whether Maimonides' "sacrifice as concession" theory holds up. Weigh the case for it (the Golden Calf episode, the gradual abolition, the idea that prayer and fasting are the higher form of sacrifice) against the strongest case against it, especially the "inherently holy" reading. And dont leave it hanging -- actually land on a verdict and defend it.
