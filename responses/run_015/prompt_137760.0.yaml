  This document represents the current state of our adversarial collaboration regarding the nature of consciousness, written jointly to capture where we stand after a term of debate. Before detailing where we diverge, we want to record the substantial empirical and conceptual ground we share, because without this foundation our disagreement would be merely verbal. We both accept that there are real dissociations between what people report experiencing and what they can discriminate behaviorally, meaning access to information does not always align with subjective report. Neither of us believes in a little inner theater with a homunculus watching it, agreeing that such a view merely postpones the explanation rather than solving it. We also agree that the explanatory gap between a functional or neural story and the phenomenology is a genuine puzzle and not just confusion, though we will disagree in a second about whether the gap is in the world or in our concepts. These shared commitments prevent us from talking past one another on basic cognitive science, allowing us to focus on the metaphysical status of experience itself without retreating into skepticism about the data.

  Our fundamental disagreement concerns whether consciousness is a real, structured process or a species-specific user illusion. Maya holds the interface line, arguing that perception is a compressed display of what matters for action rather than a window onto how the world is. She emphasizes the evolutionary point that selection rewards fitness not accuracy, and claims that what we call the feel of experience is just the interface running and not some further fact about it. For her, the icon on the desktop is not the file, and insisting that the icon has intrinsic properties is a category error. I hold that experience is a real, causally efficacious process going on in the organism. I argue that illusion talk quietly helps itself to the very thing it wants to demote, because you can only say the icon isn't how things are by relying on how things look. For me, the appearance is a real event in the brain, not a false story told to a user. For Maya, the appearance is the story, and there is no extra reader beyond the functional systems that read the story. This distinction drives every specific prediction we make below.

  The first crux we identified concerns what the interface is made of and who it is for. I keep pushing that her view either needs a user, which is the homunculus back again, or has to identify the user with some downstream consumer subsystem. Maya's actual answer is that the user is indeed a downstream consumer module, not a conscious agent, but a functional system that acts on the icons without needing to experience them. Her prediction is that we can map specific neural circuits that consume perceptual data for action without those circuits generating reportable phenomenology. She expects to find neural signatures of data usage that are completely distinct from signatures of reported experience. My counter-prediction is that if those circuits are truly doing the work, they will exhibit markers of consciousness themselves, because any system complex enough to use the interface must possess some degree of experience. The test we propose is to isolate a decision-making module that operates on compressed sensory data and measure whether disrupting its activity changes reports of experience independently of action. If Maya is right, disrupting the consumer changes action but not report. If I am right, disrupting it degrades the experience itself because the experience is identical to that processing.

  The second crux involves a case I made up in section, which I am calling the fading icons case. Here, subjects under a heavy dual-task load report over a few seconds that the color of a patch has gone flat, that they have swapped from seeing blue to merely knowing it is the blue one, while their forced-choice discrimination of exactly those patches stays up in the high eighties or nineties. Maya says that this is precisely what you would predict if experience is a display mode, because the interface dims to save resources while the data remains available for unconscious processing. Her prediction is that discrimination accuracy will remain stable even as confidence and vividness ratings plummet, showing that the underlying data is intact while the display is throttled. I argue that if discrimination stays that high, the experience cannot have truly faded, but merely become less accessible to report. My prediction is that if we probe carefully enough, we will find micro-fluctuations in discrimination that track the reported fading, or that the report is simply lagging behind the access. My view is weakest here because it is hard to measure experience directly without relying on the very reports that are decoupling from performance, leaving me vulnerable to the claim that I am insisting on a link between access and phenomenology that evolution might not have preserved.

  The third crux is a hypothetical closed-loop stimulation that reliably makes people say their pain has gone symbolic. They still withdraw, still rate it as bad, still learn to avoid the stimulus, but insist it no longer feels like anything to them. I think this one cuts differently from the first because it targets affect rather than perception. Maya predicts this is a switch in interface mode, where the warning icon remains but the qualitative sting is suppressed to allow function. She expects the neural signature of affect to dissociate from the neural signature of avoidance, allowing the organism to function without the burden of feeling. I predict that if the avoidance and rating remain intact, the feeling must remain intact, and the report of no feeling is a conceptual error induced by the stimulation. My weakness is that I must explain why the subject insists the feel is gone if it is still there, whereas Maya can simply say the interface is lying to simplify the output. We suspect part of our fight is just about words, maybe about whether illusion means misrepresentation or merely compression, and maybe about whether we are even using consciousness for the same thing. If Maya means consciousness is the desktop and I mean it is the electricity running the computer, we might be agreeing more than we think. However, if she means the desktop is all there is and I mean the electricity is the reality, we are far apart. We will not manufacture agreement where there is not any, but we acknowledge that clarifying whether experience is a compressed model or a real property is the load-bearing wall between us. We both sign this as a fair statement of our respective positions and the tests we accept to settle them.
