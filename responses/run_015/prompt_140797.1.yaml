  *(Self-Correction on "Residual Independence"):* The friend's idea is basically: $P(n \text{ prime}) \approx \frac{1}{\log n} \times \text{correction}$. The correction accounts for small primes. This *is* the Hardy-Littlewood heuristic. I need to confirm it yields the 1.32. Yes, $2 \prod_{p>2} (1 - \frac{1}{(p-1)^2}) \approx 1.32$.

  *(Self-Correction on "Events vs Variables"):* If we model gaps $g_n$, independence of gaps implies something different than independence of indicators. Cramér modeled indicators. Granville modified Cramér to fix the constant. But gap models often fail to capture the long-range correlations.

