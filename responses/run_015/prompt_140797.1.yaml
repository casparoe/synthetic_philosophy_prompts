      *   *Maier's Theorem:* Be careful not to overstate its impact on TPC. It kills Cramér's conjecture on *gaps*, but TPC is about *existence*. However, it shows the probabilistic model is fundamentally incomplete regarding the *structure* of primes.
      *   *Philosophical Stance:* Avoid saying "Yes, we know." Say "We have high confidence, but 'knowledge' in math requires proof." The book is being rhetorically strong, perhaps too strong.
      *   *The "Machine":* Emphasize that the "randomness" is a property of the *sequence*, not the *generation*. It's retrospective randomness.

  5.  **Final Review against constraints:**
      *   Audit the correspondences? Yes.
      *   Identify the machine? Yes (complexity/sieve).
      *   Separate breaks (constant vs. independence vs. short intervals)? Yes.
      *   Analyze "Residual Independence"? Yes (HL conjecture).
