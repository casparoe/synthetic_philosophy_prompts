  3.  **Drafting - Section by Section:**

      *   **1. The Audit: Correspondences & The Machine:**
          *   *Ticket:* Integer $n$.
          *   *Win:* $n$ is prime.
          *   *Probability:* $1/\log n$ (Prime Number Theorem density).
          *   *Independence:* Event $n \in \mathbb{P}$ is independent of $m \in \mathbb{P}$.
          *   *The Machine:* This is the crux. There *is* no machine. The "randomness" is epistemic or pseudo-random. It's a model of *distribution*, not generation. The "machine" is the complexity of the sieve.
