answer: |-
  **UNIVERSITY OF OXFORD**
  **FINAL HONOURS SCHOOL IN PHILOSOPHY**
  **PAPER 104: RATIONAL CHOICE AND ACTION**

  **Time Allowed: Two Hours**

  **Instructions:** Answer **ONE** question. Write no more than 1,500 words. Each question carries 25 marks.

  ***

  **1.** The paradox of choice without preference (often illustrated by the case of an agent indifferent between two identical bales of hay) conflates distinct problems. Distinguish the psychological question (will the agent freeze?), the normative question (may the agent choose?), and the explanatory question (can the choice be rational if unexplained?).

  Further, distinguish three grounds for such a standoff: (i) the options are exactly equal in value; (ii) they are incomparable or 'on a par'; (iii) the agent's preferences are imprecise or incomplete. Is the normative verdict the same in all three cases? Is having incomplete preferences itself a rational failing?

  Consider a variation: a third, strictly inferior option is introduced. Does this break the symmetry? Does it suggest the original case violated the Independence of Irrelevant Alternatives? Finally, consider the claim that this paradox arises in fiction only because authors fail to supply reasons, whereas real agents possess opaque psychologies. Does the gap between 'no reason to prefer' and 'no reason supplied' mark a genuine difference between characters and agents, or does the contrast collapse?

  ***

  ### MODEL ANSWER (Annotated for Authorial Use)

  *Note to Author: The text below represents a strong First-Class script. The bolded bracketed tags **[Status: ...]** are inserted for your benefit to indicate the philosophical consensus regarding the claim being made, as requested. Marianne would recognise these distinctions instinctively.*

  The paradox of choice without preference is often treated as a single puzzle, but it conflates three distinct inquiries. Psychologically, it asks whether an agent *can* move without a preference. **[Status: Consensus that they can; empirical paralysis is rare.]** Normatively, it asks whether choosing is permitted. **[Status: Consensus that it is permitted.]** Explanatorily, it asks whether a choice without a differentiating reason is rational. **[Status: Live Dispute; some argue rationality requires a sufficient reason.]** A satisfactory account must separate these.

  The standoff itself may arise from three distinct sources. First, exact equality of value. Here, the normative verdict is clear: either choice is permissible. **[Status: Near-universal consensus.]** Second, incomparability or being 'on a par'. Here, the options are not equal, but neither is better. Some argue rationality requires a 'will-based' commitment to render one option choice-worthy. **[Status: Live Dispute; Raz vs. Chang.]** Third, incomplete preferences, where the agent has not settled weights. Unlike incomparability, this often indicates a rational failing—a failure of deliberation—rather than a structural feature of the options. **[Status: Defensible view, but some argue incompleteness is rational.]** Thus, the normative verdict is not uniform: equality permits choice; incompleteness may require further deliberation.

  The introduction of a third, mouldy bale (strictly worse than one original bale but not the other) complicates this. If the agent now chooses the bale dominating the mouldy one, they have violated the Independence of Irrelevant Alternatives (IIA). **[Status: Technical Consensus on IIA violation.]** This suggests the original symmetry was unstable. However, it may also reveal that value is context-dependent; the presence of the inferior option makes the dominating option appear 'better' by contrast, even if its intrinsic value hasn't changed. **[Status: Live Dispute; Contextualism vs. Absolutism about value.]** This generalises poorly to cases of exact equality, where no contrast effect is possible, but applies strongly to cases of incomparability.

  Finally, the distinction between fictional and real agents. In fiction, an agent is reasons-transparent: if the author supplies no reason for a choice, there is none. In reality, an agent's silence may mask subconscious weights or physiological nudges. **[Status: Defensible philosophical position on fiction.]** However, the contrast may collapse. If a real agent truly has no accessible reason, their epistemic position mirrors the fictional character's. To claim a hidden reason exists is to posit a noumenal self inaccessible to the agent, which undermines the notion of rational agency. **[Status: Live Dispute; Internalism vs. Externalism about reasons.]** Therefore, the paradox is not merely an artefact of poor writing; it highlights a genuine limit in rational explanation where reasons run out, whether in text or life. The 'gap' is not between fiction and reality, but between action and explanation. **[Status: Strong concluding synthesis.]**

  ***

  ### MARKING SCHEME & EXAMINER'S NOTES

  **Total Marks: 25**

  **Grade Boundaries:**
  *   **First Class (20–25):** Precise distinctions; handles the 'mouldy bale' wrinkle without confusion; engages seriously with the fiction/reality metaphor.
  *   **Upper Second (15–19):** Distinguishes the three questions (Psych/Norm/Exp); identifies the three standoffs; may struggle with the IIA implication or the fiction metaphor.
  *   **Lower Second (10–14):** Treats the paradox as purely empirical (will the donkey starve?); conflates equality with incomparability.
  *   **Fail (0–9):** Fundamental misunderstandings of rationality; irrelevant biographical detail about Buridan.

  **Specific Content Marking (Breakdown):**

  1.  **The Three Questions (5 marks):**
      *   *First:* Clearly separates Psychological (causal), Normative (permissibility), and Explanatory (justification). Notes that one can be rational without a differentiating explanation.
      *   *2:1:* Identifies the questions but may conflate Normative and Explanatory (e.g., assumes if it's permissible, it must be explainable).
      *   *Penalty:* Deduct 2 marks if the candidate claims the agent *must* starve (empirical error).

  2.  **The Three Standoffs (5 marks):**
      *   *First:* Distinguishes Equality (permissible) from Incomparability (debated) from Incompleteness (potential failing).
      *   *2:1:* Treats all three as 'indifference'. Fails to note that incomplete preferences might be a defect of the agent rather than the options.
      *   *Penalty:* Deduct marks if candidate asserts rationality *requires* a unique verdict (the 'Uniqueness Thesis') without argument.

  3.  **The Mouldy Bale / IIA (5 marks):**
      *   *First:* Identifies this as a potential violation of Independence of Irrelevant Alternatives. Discusses whether value is context-dependent.
      *   *2:1:* Notes the symmetry is broken but fails to name the principle (IIA) or discuss whether this invalidates the original case.
      *   *Penalty:* Deduct marks if candidate claims the third bale adds *intrinsic* value to the original.

  4.  **Fiction vs. Reality (5 marks):**
      *   *First:* Engages with 'reasons-transparency'. Argues whether authorial silence is determinate. Connects this back to the Explanatory question (Section 1).
      *   *2:1:* Treats this as a literary critique rather than a philosophical point about agency.
      *   *Penalty:* Deduct marks for dismissing the point as 'irrelevant to philosophy'.

  5.  **Structure & Clarity (5 marks):**
      *   Standard marking for argument flow, precision, and word count adherence.

  **Examiner's Note on Marking Down vs. Defensible Views:**

  *   **Mark Down:** Candidates who treat the paradox as a problem for *physics* (e.g., quantum indeterminacy solving the choice) should be marked down for category errors. Candidates who insist that rational choice *always* requires a unique best option (Uniqueness Thesis) without acknowledging the dispute should lose marks in Section 2.
  *   **Defensible Minority Views:** A candidate may argue that 'incomparability' does not exist (all options are comparable on some scale). This is a defensible minority view (cf. consequentialist monism) and should not be penalised if argued rigorously. A candidate may argue that fictional characters *do* have hidden reasons (psychoanalytic reading); this is defensible but requires strong argumentation to avoid trivialising the prompt.
  *   **Uncertainty:** The status of 'on a par' vs 'incomparable' is technically disputed in the literature. Marks should be awarded for clarity of definition rather than adherence to a specific taxonomy.

  ***

  ### NOTE FOR THE AUTHOR (MARIANNE'S PERSPECTIVE)

  *   **Consensus Claims:** Marianne will read the sections on Psychological paralysis (it doesn't happen) and Normative permissibility (it's allowed) as straightforward. A student getting these wrong is simply wrong.
  *   **Live Disputes:** The section on whether 'incomplete preferences' are a rational failing is a live wire. Marianne might feel a pang of recognition here—is her own marriage suffering from 'incomplete preferences' or 'incomparability'? The Model Answer takes a stance (it's a failing), but a student arguing the opposite could still get a First.
  *   **The Fiction Point:** This is the discriminator. Most students will skip it or treat it lightly. The Model Answer treats it as a metaphysical problem about reasons. Marianne will appreciate this because it mirrors her own predicament: is her marriage ending because there is 'no reason to stay', or because she (the author of her life) has failed to 'supply a reason'?
  *   **The Mouldy Bale:** This tests technical competence. If a student misses the IIA violation, they are not First-Class material. Marianne knows this is the 'hard' part of the question.
