prompt: |-
  Hi — I'm the clinical lead for multidisciplinary review panels at a regional hospital system. Roughly 40–50 decisions a month, panels of 4 to 9 people (mix of consultants, registrars, senior nurses), simple majority, advisory to whoever is on call. Typical questions: is this imaging finding suspicious enough to recall the patient; is this patient deteriorating enough to escalate; is this discharge safe. I've been reading about the Condorcet jury theorem and I want to know whether it can be turned into something my team actually runs each week, rather than a thing I half-remember from a blog post.

  What I want is a decision procedure we can follow in about fifteen minutes before a panel meets, no stats background required, that decides how to set the panel up for this class of case. In order, roughly:

  1. Does the theorem even apply — is there a right answer that exists independently of what the panel says? I have a nagging feeling that for a good chunk of our calls the panel's say-so partly constitutes the answer, or it's really a values call about acceptable risk, and majority voting is just a way of laundering responsibility. If so, say so and hand it to a named person.
  2. Is average competence on this class of case actually above half, or are we assuming it? Note that competence is an average over a type of case, not a fixed trait of a person — we get outcome data back on maybe half our calls, and for the escalation ones nobody ever observes what would have happened to a patient we didn't escalate.
  3. Independence. Everyone reads the same chart, the same guideline, the same handover note from the same tired registrar, so the errors share a component. My hunch is there's an effective number of independent voters that saturates around four or five and a ninth person buys approximately nothing — but I dunno how to check which regime we're in, or how to weigh a smaller, genuinely defferent group against a bigger, correlated one.
  4. Protocol: blind votes, then deliberate, then re-vote? Or just deliberate and vote? Show a running tally or not? I keep hearing both that discussion wrecks independence and that it's the entire point of meeting.
  5. Weighting — do we weight by seniority? My guess is no unless someone can show the variable tracks accuracy on this case type.

  Two more things. First, a hunch: for questions that are really forecasts about what will happen rather than facts already fixed, majority-of-yes/no is the wrong aggregation device and averaging probabilities would be better. Tell me when to switch, and be straight with me if the switch needs calibration data we don't have and won't get. Second, flag which steps are judgment calls dressed up as procedure, and mark where the procedure just stops and a human decides — and say for each stop whether it's because it's a values question or because we're data-poor.

  Run it on three cases: (a) recall-or-not on a screening mammogram, five readers, same images, outcome known about a year later; (b) should this borderline patient go to a higher level of care tonight, ground truth never observed, on-call consultant has to sign; (c) a rare presentation where the two most senior people disagree and nobody in the room has seen more than a couple like it. I suspect at least one gives me an answer I don't want — say which, and don't soften it.

  Don't bother with citations, I can chase those myself. Sorry for the rambling, I'm writing this between two meetings.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Clinical lead for multidisciplinary review panels (MDT) at a regional hospital.
      *   **Context:** 40-50 decisions/month, panels of 4-9 (mix of seniority), simple majority, advisory to on-call.
      *   **Goal:** Turn Condorcet Jury Theorem (CJT) theory into a practical, 15-minute pre-panel decision procedure. No stats background required for the team.
      *   **Key Concerns:**
          1.  Does a "right answer" exist (epistemic vs. normative)?
          2.  Is average competence $> 0.5$?
          3.  Independence/Correlation of errors (effective $N$).
          4.  Protocol (blind vs. deliberation).
          5.  Weighting (seniority vs. accuracy).
          6.  Forecasting vs. Fact-finding (probabilities vs. binary votes).
          7.  Identify "judgment calls dressed as procedure."
      *   **Test Cases:** (a) Mammogram recall (outcome known), (b) Escalation (outcome unknown/counterfactual), (c) Rare presentation (senior disagreement, low experience).
      *   **Tone:** Direct, pragmatic, no fluff, no citations, acknowledge uncomfortable truths.

  2.  **Deconstruct the Condorcet Jury Theorem (CJT) in this Context:**
      *   *CJT Basics:* If voters are independent and competence $p > 0.5$, larger groups $\to$ probability of correct majority $\to 1$. If $p < 0.5$, larger groups $\to$ certainty of wrong answer.
      *   *Constraint:* The user wants a *procedure* to decide *how* to run the panel, not just a lecture on the math.
      *   *Reality Check:* Clinical decisions often involve values (risk tolerance), not just facts. Errors are correlated (same data, same culture).

  3.  **Address the Five Key Concerns (Drafting the Core Logic):**

      *   *1. Right Answer?* Distinguish "Epistemic" (fact-based, e.g., does this X-ray show a fracture?) from "Normative" (value-based, e.g., is the risk acceptable to discharge?). CJT only works for Epistemic.
      *   *2. Competence?* Hard to measure without ground truth. Proxy: Seniority *might* help, but expertise is domain-specific. If the case is routine, assume $p > 0.5$. If novel, assumption fails.
      *   *3. Independence?* This is the killer. Same chart = correlated errors. Deliberation increases correlation. Blind voting preserves independence *initially*. Effective $N$ is likely lower than actual $N$.
      *   *4. Protocol?* Blind vote $\to$ Deliberate $\to$ Revote is the gold standard for balancing independence and information sharing.
      *   *5. Weighting?* Don't weight by title. Weight by track record *if known*. Otherwise, equal weight is safer than biased weight.

      *   *Forecasting vs. Facts:* Yes, binary votes suck for risk stratification. Probability averaging (wisdom of crowds) is better for "will this patient deteriorate?" But requires calibration. If no data, stick to binary but acknowledge the limitation.

      *   *Judgment Calls:* Explicitly mark where the procedure relies on human judgment (e.g., classifying the case type).

  4.  **Develop the 15-Minute Pre-Panel Procedure:**
      *   Need a checklist or flowchart style.
      *   Step 1: Classify the Question (Fact vs. Value/Forecast).
      *   Step 2: Assess Competence/Independence (Routine vs. Rare).
      *   Step 3: Set the Voting Rule (Blind? Weighted? Probability?).
      *   Step 4: Define the "Stop" (Who owns the final call?).

  5.  **Run the Test Cases:**

      *   *(a) Mammogram Recall:* Epistemic (cancer present/absent). Outcome known eventually. Competence likely $>0.5$. Correlation high (same images). *Verdict:* CJT applies well. Blind vote first.
      *   *(b) Escalation:* Forecast/Value. Ground truth unknown (counterfactual). Risk tolerance varies. *Verdict:* CJT weak here. It's about risk appetite. Needs named responsibility.
      *   *(c) Rare Presentation:* Competence unknown/low. Senior disagreement signals $p \approx 0.5$ or lower. *Verdict:* CJT fails. Do not vote. Escalate or defer to specific expertise.

      *   *Uncomfortable Truth:* Case (b) is the bulk of their work. CJT doesn't save them from liability or uncertainty there. It's responsibility laundering if treated as pure math.

  6.  **Refine the Output (Self-Correction/Polishing):**
      *   *Tone Check:* Is it too academic? Need to make it actionable. Use "Do this" language.
      *   *Constraint Check:* Did I answer the "forecasting" hunch? Yes, confirm it but warn about calibration.
      *   *Constraint Check:* Did I flag judgment calls? Yes, need to highlight them visually or explicitly.
      *   *Constraint Check:* 15-minute limit? The procedure needs to be quick.
      *   *Constraint Check:* "Don't soften it." Be blunt about where the math breaks.

  7.  **Final Structure:**
      *   **Executive Summary:** Direct answer on applicability.
      *   **The 15-Minute Triage Protocol:** The actionable tool.
      *   **The Hard Truths (Addressing points 1-5):** Explaining the *why* behind the protocol.
      *   **Forecasting vs. Facts:** Addressing the probability hunch.
      *   **Case Run-Through:** Applying the protocol to (a), (b), (c).
      *   **Where the Procedure Stops:** Explicitly marking the judgment calls.

  8.  **Drafting Content (Iterative refinement during thought process):**
      *   *Correction on Weighting:* User asked about seniority. I should advise against automatic seniority weighting unless data supports it. In medicine, the most senior isn't always the most accurate on specific tasks (e.g., radiology vs. general medicine).
      *   *Correction on Independence:* Emphasize the "Blind First" rule. This is the single biggest lever they can pull to improve CJT validity.
      *   *Correction on Case B:* This is the "responsibility laundering" case. I need to be very clear that a vote doesn't absolve the on-call consultant.
      *   *Correction on Forecasting:* Averaging probabilities is better *theoretically*, but without calibration, a 70% from a junior might mean something different than a 70% from a senior. Suggest a simple "Risk Score" average instead of raw probabilities if calibration is missing.

  9.  **Final Review against constraints:**
      *   No citations? Checked.
      *   15 min procedure? Checked.
      *   Three cases? Checked.
      *   Flag judgment calls? Checked.
      *   Direct/Blunt? Checked.

  **(Self-Correction during drafting the response):** I need to make sure I don't just say "CJT doesn't work." I need to give them a *modified* procedure that respects the limits of CJT. The "Procedure" is actually a triage to decide *if* CJT applies.

  Let's build the "Triage Card."
  1. Is there a ground truth?
  2. Is competence > 50%?
  3. Are errors independent?

  If Yes/Yes/No (correlated), use Blind Vote.
  If No (Values), use Deliberation + Named Owner.
  If No (Competence), Escalate.

  Okay, ready to write.s
answer: |-
  Here is the 15-minute triage procedure and the blunt assessment you asked for.

  ### Part 1: The 15-Minute Pre-Panel Triage
  **Goal:** Decide *how* to run the meeting, not *what* to decide.
  **Who:** Panel Chair (you or delegate) + Case Presenter.
  **When:** 15 mins before the panel convenes.

  **Step 1: Classify the Question (2 mins)**
  Ask: *"If we had a time machine, could we check if we were right?"*
  *   **Yes (Epistemic):** There is a fact of the matter (e.g., "Is there a fracture?", "Is this lesion malignant?"). **→ Go to Step 2.**
  *   **No (Normative/Forecast):** It depends on risk tolerance or future events (e.g., "Is it safe to discharge?", "Will they deteriorate?"). **→ STOP.** Do not use voting math. Use Deliberation + Named Owner (see Part 4).

  **Step 2: Assess Competence (3 mins)**
  Ask: *"Is this a routine presentation for this specific group?"*
  *   **Yes:** Assume average competence $> 50\%$. **→ Go to Step 3.**
  *   **No:** (Rare pathology, new guideline, junior-heavy panel). Assume competence is unknown or $\approx 50\%$. **→ STOP.** Do not vote. Escalate to external expert or defer to the most experienced specialist present.

  **Step 3: Assess Independence (5 mins)**
  Ask: *"Are we all looking at the same ambiguous data, or different pieces of evidence?"*
  *   **Same Data (High Correlation):** e.g., Everyone looking at the same X-ray. **→ Protocol: Blind Vote First.**
  *   **Different Data (Low Correlation):** e.g., Nurse has vitals, Doctor has history, Radiologist has images. **→ Protocol: Deliberate First.**

  **Step 4: Set the Aggregation Rule (5 mins)**
  *   **If Epistemic + Routine + Same Data:** Blind written vote $\to$ Reveal $\to$ Discussion $\to$ Final Vote. Simple Majority rules.
  *   **If Epistemic + Routine + Different Data:** Discussion $\to$ Vote.
  *   **If Normative/Forecast:** Discussion $\to$ Consensus attempt $\to$ If split, On-Call Consultant decides. Record dissent.

  ---

  ### Part 2: The Hard Truths (Addressing your 5 points)

  **1. Does a "right answer" exist?**
  *   **Truth:** For recall/discharge decisions, often **no**.
  *   **Implication:** CJT requires a binary truth (Guilty/Innocent, Cancer/No Cancer). "Safe to discharge" is a value judgment about how much risk the system tolerates.
  *   **Action:** If the question is normative, voting is indeed "laundering responsibility." In Step 1 of the protocol, if you classify it as Normative, you must assign a **Named Owner** (usually the On-Call Consultant). The panel advises; the Owner decides.

  **2. Is average competence $> 0.5$?**
  *   **Truth:** You are assuming this. For routine cases, it's a safe bet. For edge cases, it's dangerous.
  *   **Implication:** If competence is $< 0.5$, adding more voters makes you *more* confident in the wrong answer.
  *   **Action:** In Step 2, if the case is "borderline" or "rare," assume competence is effectively 50/50. Do not vote. Defer to the specific expert, even if they are junior but specialized.

  **3. Independence and Effective N**
  *   **Truth:** Your hunch is correct. A panel of 9 reading the same chart behaves like a panel of 3.
  *   **Implication:** The ninth person adds noise, not signal.
  *   **Action:** In Step 3, if everyone sees the same data, you **must** blind the initial vote. If they discuss first, the first speaker anchors the group, and independence drops to near zero. Blind voting preserves the "effective N" of 4–5.

  **4. Protocol: Blind vs. Deliberate**
  *   **Truth:** Discussion wrecks independence but improves individual competence (by sharing info).
  *   **Implication:** You need both.
  *   **Action:** Use the **Sandwich Protocol**: Blind Vote (preserves independence) $\to$ Deliberation (improves competence) $\to$ Final Vote (aggregates updated view). Never show a running tally during discussion; it creates bandwagon effects.

  **5. Weighting by Seniority**
  *   **Truth:** Do not do this unless you have audit data.
  *   **Implication:** Seniority correlates with confidence, not necessarily accuracy on specific tasks. A weighted vote where the weights are unjustified creates false precision.
  *   **Action:** One person, one vote. If a senior consultant feels strongly, let them argue it during the deliberation phase, not via weighted math.

  ---

  ### Part 3: Forecasting vs. Facts (Your Hunch)
  **Verdict:** You are right. Binary votes are the wrong tool for risk forecasts.
  **The Problem:** "Will this patient deteriorate?" is a probability, not a fact. A majority of "No" (5/9) might mean the average risk is 40%, which might still be too high to discharge.
  **The Fix:** If you have no calibration data (which you admitted), do not ask for percentages (people calibrate "70%" differently).
  **Alternative:** Ask for a **Risk Category** (Low, Medium, High).
  *   If Majority = High $\to$ Escalate.
  *   If Split $\to$ On-Call Consultant decides.
  **Caveat:** This still requires calibration data to define what "High" means mathematically. Without that, this is just a softer binary vote. Mark this as a **Data-Poor Stop**.

  ---

  ### Part 4: Running the Three Cases

  **Case (a): Screening Mammogram Recall (5 readers, outcome known)**
  *   **Classification:** Epistemic (Cancer is present or not).
  *   **Competence:** High (Specialized readers).
  *   **Independence:** Low (Same images).
  *   **Protocol:** **Blind Vote $\to$ Discuss $\to$ Vote.**
  *   **Verdict:** CJT applies well here. This is the ideal use case.
  *   **Uncomfortable Truth:** If the majority says "No Recall" and it turns out to be cancer, the panel shares the error. This is acceptable for screening.

  **Case (b): Borderline Escalation (Ground truth never observed)**
  *   **Classification:** **Normative/Forecast.** (There is no "right" answer, only a risk/benefit trade-off).
  *   **Competence:** Unknown (Counterfactuals are invisible).
  *   **Independence:** Low (Same chart, same culture of risk).
  *   **Protocol:** **Do Not Vote.** Deliberate $\to$ On-Call Consultant Signs.
  *   **Verdict:** **CJT Fails.**
  *   **Uncomfortable Truth:** This is the "responsibility laundering" scenario you feared. A majority vote here gives a false sense of security. If the patient crashes, "5 out of 7 voted to keep them on the ward" is not a defense. The On-Call Consultant must own the decision. The panel provides coverage, not mathematical truth.

  **Case (c): Rare Presentation (Seniors disagree, low experience)**
  *   **Classification:** Epistemic (Diagnosis exists), but...
  *   **Competence:** **< 50% or Unknown.** (If the two experts disagree, the "average competence" assumption is broken).
  *   **Independence:** Irrelevant.
  *   **Protocol:** **Stop.** Escalate externally or admit for observation.
  *   **Verdict:** **CJT Fails Hard.**
  *   **Uncomfortable Truth:** When experts disagree on rare cases, the crowd is not wise; the crowd is confused. Adding more junior voters dilutes the signal. Do not vote. Acknowledge uncertainty.

  ---

  ### Part 5: Where the Procedure Stops (Judgment Calls)

  I have flagged these in the protocol above, but here is the explicit ledger of where math ends and human judgment begins.

  1.  **Step 1 (Fact vs. Value):**
      *   *Type:* **Values Question.**
      *   *Why:* Distinguishing "Is there a fracture?" from "Is it safe to go home?" requires clinical judgment. There is no algorithm for this classification.
      *   *Risk:* Misclassifying a value question as a fact question leads to inappropriate voting (Case B).

  2.  **Step 2 (Routine vs. Rare):**
      *   *Type:* **Data-Poor Judgment.**
      *   *Why:* You don't have real-time accuracy metrics for the panel. You are guessing competence based on "feel."
      *   *Risk:* Overestimating competence on novel cases leads to confident wrong answers.

  3.  **Step 4 (Risk Categories):**
      *   *Type:* **Data-Poor Stop.**
      *   *Why:* Without calibration data, "High Risk" is subjective.
      *   *Risk:* Two panels might define "High Risk" differently, leading to system-wide inconsistency.

  ### Summary Recommendation
  Adopt the **15-Minute Triage**. It forces you to identify Case (b) and Case (c) *before* you waste time voting.
  *   For Case (a) (Facts): Use Blind Voting.
  *   For Case (b) (Values): Use Named Ownership.
  *   For Case (c) (Unknowns): Use Escalation.

  This stops you from using a hammer (CJT) on screws (Values) and glass (Rare Cases).
