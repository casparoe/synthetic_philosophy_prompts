  Test A attributes a single mind to the target colony. Predicting reserve levels requires knowing the global sum, not local counts. If Nest 1 finds food, Nest 2's intake rises via the tube; tracking individuals misses this correlation. Attributing a "hunger state" to the whole colony predicts the flow through the tube better than tracking parts because the regulation happens at the system level. The explanatory power lies in the aggregate equilibrium, which spans both nests, validating the whole as the predictive unit.

  Test B locates two minds. It cuts at the weakest causal coupling to find local maxima of integration. Internal nest interactions (antennation, frequent trophallaxis) are dense and reciprocal; the tube traffic is sparse, delayed, and intermittent. The local maximum of integration is within each nest, not across the tube. Cutting the tube reveals two tightly woven causal nets barely touching, whereas cutting inside a nest severs many strong links, proving the nests are the causal subjects.

  Test C attributes one mind. The boundary is defined by reproductive unity and self-maintenance. The queen(s) remain functionally linked; winter survival depends on combined reserves managed across the tube. The system acts to preserve the dual-nest boundary against competitors. Loss of either nest reduces total fitness, so the organisation maintaining the boundary encompasses both sites. The goal-directed behaviour serves the survival of the composite unit, not the isolated nests.

  The inter-nest traffic bandwidth does the work. It is thick enough for (C) (resource sharing ensures survival) and (A) (global state predicts flow), but thin enough for (B) (low causal density). Remove the tube: (A) and (C) split into two colonies as economic unity fails. Thicken it (regular brood transport or queen movement): (B) flips to one mind as causal integration densifies across the gap, matching the baseline. The verdict divergence exists only within this narrow bandwidth window where food flows but individuals do not.

  Objection: Test B is too physicalist; if the system acts as one agent (C), the mind must be one. Reply: Agency (C) tracks survival interests, while subjecthood (B) tracks causal granularity. A corporation acts as one agent but contains semi-autonomous departments; similarly, functional unity does not guarantee causal unity. Test B reveals that "what it is like to be" might fragment even where "goal-directed behaviour" remains unified.

  The argument rides on the bandwidth of the inter-nest trail.
