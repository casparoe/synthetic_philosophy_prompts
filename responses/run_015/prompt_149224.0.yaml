answer: |-
  **The Morality of Manners: Procedural Respect and the Visitor's Obligation**

  The question of whether social conventions constitute moral obligations is a perennial problem in normative ethics. When a norm is arbitrary—such as driving on the left versus the right—it seems reducible to mere etiquette. However, when conventions govern resource distribution, safety, or social coordination, the line between etiquette and morality blurs. This ambiguity is sharpest for the cultural visitor. Does a tourist in London have a moral duty to queue, or merely a prudential one? Must a European in New York tip 20%, or is that purely optional charity? To resolve this, we must move beyond the binary of "moral vs. conventional" and adopt the distinction between **procedural respect** and **substantive compliance**. This essay argues that while visitors are not morally required to substantively comply with local conventions (internalizing them as universally binding), they are morally obligated to accord them procedural respect (adhering to them to preserve local coordination and welfare). Failing to distinguish these categories leads to either cultural imperialism or unjustified free-riding.

  To understand the moral weight of conventions, we must recognize that many arise from coordination problems where the specific solution is arbitrary, but the existence of a solution is not. David Lewis famously argued that conventions are solutions to recurrent coordination problems. However, once a convention is established, violating it can generate negative externalities. This is where the distinction between procedural respect and substantive compliance becomes vital. **Substantive compliance** requires the agent to internalize the norm, believing it to be inherently right or virtuous. **Procedural respect** requires only that the agent does not actively undermine the coordination mechanism, recognizing that their participation is necessary for the system to function for others, even if the agent disagrees with the system's underlying logic.

  Consider the case of **queueing**. In many cultures, forming a linear line is the established mechanism for distributing access to a scarce resource (a bus, a cashier, a ticket booth). The specific mechanism (linear line vs. numbered ticket vs. free-for-all) is morally arbitrary. However, the *fairness* of the distribution is not. If a visitor comes from a culture where crowding around a counter is the norm, they might not substantively comply with queueing; they may not believe lines are the "right" way to organize humanity. Yet, if they bypass the line in a queueing culture, they undermine the expectations of those who are waiting. They free-ride on the restraint of others. Here, procedural respect generates a moral obligation based on fairness. The visitor need not believe in the sanctity of the queue (substantive compliance), but they must not disrupt the coordination mechanism that others are relying upon for fair access (procedural respect). To do otherwise is to treat locals merely as means to one's own ends, violating a Kantian constraint against exploiting established cooperative schemes.

  The case of **tipping** is more complex because it involves economic reliance rather than pure coordination. In the United States, tipping is not merely a reward for service; it is a structural subsidy for wages due to legal exceptions allowing sub-minimum wage pay for tipped workers. A visitor from a non-tipping culture might find this system unjust and refuse to substantively comply—they may rightly believe that employers, not customers, should pay wages. However, the worker currently serving them relies on the tip to meet the expected income for that shift. If the visitor withholds the tip based on their own moral framework, they inflict immediate economic harm on the worker without altering the structural injustice. Here, procedural respect demands adhering to the local economic convention to prevent harm to the specific individual involved, even while withholding substantive compliance regarding the system's validity. The moral obligation arises not from the virtue of tipping, but from the duty of non-maleficence toward the worker who is vulnerable within that specific institutional context.

  Does this distinction resolve the visitor problem, or does it merely complicate it? It resolves the tension between cultural relativism and moral universalism. If we demanded substantive compliance, we would require visitors to adopt local values, risking cultural imperialism and insincerity. If we demanded no compliance, we would permit visitors to act as moral free-riders, disrupting local welfare for personal convenience. The procedural respect framework splits the difference: it demands behavioral conformity for the sake of social stability and harm prevention, while permitting internal dissent. It clarifies that the obligation is not to the *norm itself*, but to the *people relying on the norm*.

  However, a strong objection arises regarding **arbitrary enforcement and power**. One might argue that procedural respect legitimizes oppressive or inefficient local norms. If a local convention is discriminatory (e.g., queueing norms that implicitly exclude certain groups), procedural respect demands complicity in that exclusion. Furthermore, why should the burden of coordination fall on the visitor? If the norm is arbitrary, the local population could accommodate the visitor just as easily as the visitor accommodates them. This objection suggests that procedural respect is only obligatory when the convention is benign and the cost of compliance is low.

  This objection holds weight but does not dismantle the framework; it merely bounds it. Procedural respect is conditional on the norm not violating fundamental human rights. Queueing and tipping are benign coordination and economic norms; segregation is not. Regarding the burden of coordination, the visitor is the variable element entering a stable system. The moral weight of disrupting an existing equilibrium falls heavier on the disruptor than on the maintainers, provided the equilibrium is not unjust. Therefore, the visitor bears the burden of procedural respect because their deviation introduces uncertainty and potential harm into a settled expectation.

  In conclusion, everyday conventions like queueing and tipping generate genuine moral obligations for visitors, but these obligations are strictly procedural. Visitors must not undermine the coordination mechanisms (queueing) or economic reliance structures (tipping) of the host culture, as doing so constitutes free-riding or inflicting harm. However, they are under no obligation to substantively comply—to believe these norms are universally valid or virtuous. The distinction saves the visitor from hypocrisy while saving the host culture from disruption. Therefore, the verdict is clear: **Visitors are morally obligated to follow local conventions instrumentally to preserve local welfare and fairness, even if they reject those conventions intrinsically.** To do otherwise is to privilege one's own cultural comfort over the coordinated welfare of the community one is visiting.

