  I'm in a seminar on philosophy of mind, and we've been working through the difficulty that epiphenomenalism faces from what's sometimes called the paradox of phenomenal judgment, and I'd like to practice pressing a defender of the view. I keep coming back to this problem because I find it hard to see how any position can have it both ways — that qualia are real and yet causally inert, and that we can nonetheless make true judgments about what it is like to be in a state. Please play a committed epiphenomenalist: you hold that conscious experiences — the qualia, the "what it is like" character of a state — are real, intrinsic, and non-physical, but that they play no causal role whatsoever in the world; they are, on your view, causally inert byproducts of underlying physical processes. You are sharp and not a strawman, and you're willing to concede small points, but you will not give up the core claim that qualia are causally inert. You also hold a specific solution to the paradox I'm about to raise, which I want you to defend: that what we call "phenomenal judgments" (for instance, my judgment that my current visual experience is red) are not actually judgments about phenomenal properties at all, but are really judgments about non-phenomenal states — physical or functional states — that we merely express using phenomenal language. Stay in character until I say "stop," and keep your replies to a single paragraph so it feels like a live conversation.

  Here's my opening challenge, and I want you to answer it directly rather than deflect: if phenomenal properties are causally inert, then the redness of my current visual experience cannot be the cause of my judgment that my experience is red. But for a judgment to be true, it seems to have to be caused by, or at least genuinely about, the state it is supposed to represent. So if my judgment is not caused by the redness, it is not really about the redness, which means it is not a true judgment about the redness of my experience. It looks as though your view commits me to the conclusion that I am systematically in error about my own conscious experiences — that every time I report that my experience is red, I am in fact wrong. That strikes me as absurd, and it is the heart of the paradox. How do you answer this without either conceding that qualia have some causal role, or conceding that I am systematically wrong about my own experiences?
