answer: |-
  This is a precise and painful observation. You have identified a structural failure in the market that is often misdiagnosed as a moral or strategic failure. The frustration you feel with terms like "Race to the Bottom" or "Moloch" is justified: those terms imply a *game* where players make moves. Your description implies an *ecosystem* where players are removed.

  Here is the carving you asked for, addressed in your four orders.

  ### 1. The Established Concepts

  There is no single term that perfectly captures the *attrition* mechanism you describe, but there are two adjacent concepts that get close. You are right to sense they are near-misses.

  **A. Gresham's Law ("Bad money drives out good")**
  *   **How it works:** Originally monetary, it states that if two forms of currency have the same face value but different intrinsic values, people will spend the "bad" one and hoard the "good" one. The "good" money disappears from circulation.
  *   **Where it fits:** It captures the *disappearance* of the high-quality option.
  *   **Where it stops:** Gresham's Law relies on **fixed exchange rates** (legal tender laws) and **information asymmetry** (the receiver can't tell the difference). In your trade, the buyers often *know* particleboard is worse than hardwood; they simply prefer the price. The mechanism isn't hoarding; it's bankruptcy. Gresham's Law describes circulation; you are describing extinction.

  **B. Adverse Selection (Akerlof's "Market for Lemons")**
  *   **How it works:** Sellers know the quality of their goods; buyers don't. Buyers offer an average price. High-quality sellers can't profit at that price and exit. Only low-quality sellers remain.
  *   **Where it fits:** It describes high-quality providers leaving the market due to price pressure.
  *   **Where it stops:** Adverse Selection is usually static or information-based. Your case is **dynamic and cost-based**. The buyers aren't tricked; the market price has simply moved below the cost floor of the high-quality production method. The high-quality firms aren't "withdrawing" (a choice); they are being "selected out" (a consequence).

  **The Closest Academic Framework: Organizational Ecology**
  The field that actually studies this is not game theory, but **Organizational Ecology** (Hannan & Freeman). They argue that organizations do not always *adapt* (choose); often, the environment *selects*. Firms with structures incompatible with the environment die; firms with compatible structures survive.
  *   **Verdict:** Your intuition is correct. The standard economic labels focus on *agency* (what firms choose). Your phenomenon is about *population dynamics* (which firms remain). The nearest established concept is **Selection-Driven Degradation** within an evolutionary economic framework.

  ### 2. A Name and Definition

  Since the existing terms lean too heavily on "choice," I propose we name this **The Survivorship Ratchet**.

  **Definition:**
  A market dynamic in which a standard of quality or practice degrades not because participants actively choose a inferior option over a superior one, but because participants maintaining the superior option are systematically removed from the population (via insolvency, contract loss, or exit), leaving only those who adopted the inferior option.

  **The Tight Boundary:**
  To distinguish this from the ordinary Prisoner's Dilemma (Race to the Bottom), apply the **Existence Test**:

  *   **Prisoner's Dilemma (Choice-Shaped):** If I cooperate (keep quality high) while you defect (cut quality), I suffer a *payoff penalty* (lower profit), but I remain *in the game*. I could theoretically choose to defect next round.
  *   **Survivorship Ratchet (Attrition-Shaped):** If I cooperate (keep quality high) while the market shifts, I suffer an *existence penalty* (bankruptcy/exit). I am removed from the game. I cannot choose to defect next round because I no longer exist.

  **Collapse Conditions:**
  *   **Collapses to Prisoner's Dilemma if:** Firms *could* survive maintaining high quality but choose not to because they want *more* profit than their neighbors. (Greed-driven).
  *   **Collapses to Something Else if:** The degradation is caused by a technological shift where the "old way" becomes physically impossible, not just economically unviable. (Obsolescence-driven).

  Your case is the Ratchet because the "Cooperate" strategy is fatal, not just costly.

  ### 3. Is the Distinction Real?

  The distinction is **real and structural**, not cosmetic. It changes the mathematics of the situation from **Game Theory** to **Evolutionary Dynamics**.

  **Why the "Rewrite" Argument Fails:**
  You mentioned the idea that "any selection story can be rewritten as a choice story if you pick the right chooser." Technically, one could say, "The firm chose to stay in business rather than stay pure."
  *   **The Problem:** This reframing hides the leverage point. In a Prisoner's Dilemma, the leverage is **incentive alignment** (change the payoffs so cooperation wins). In a Survivorship Ratchet, the leverage is **population selection** (change the environment so high-quality firms don't die).
  *   **The Consequence:** If you treat a Ratchet like a Dilemma, you try to solve it with ethics, agreements, or willpower (as in your Case B). This fails because you are asking firms to choose suicide. If you treat it like a Ratchet, you realize that *no amount of willpower* can save a trait that the environment is selecting against.

  **The "Chooser" Fallacy:**
  In Game Theory, the "player" is permanent. In your workshop, the "player" is ephemeral. When a workshop closes, the player is not just switching strategies; the board is losing a piece. You cannot analyze the end state of the board by looking at the motives of the remaining pieces; you must analyze the rules that removed the others.

  ### 4. What Follows From It? (Strategy)

  This is the most critical section. If the problem is a Survivorship Ratchet, **standard interventions will fail.**

  **Why Your Case (b) Failed:**
  You tried to solve an evolutionary problem with a contractual solution. A signed understanding changes the *payoffs* slightly, but it does not change the *selection pressure*. If the market price is \$100, and your cost is \$110, a promise to charge \$120 does not keep you alive; it just ensures you go out of business honorably. The firms that survived didn't "defect"; they were the ones whose cost structures allowed them to survive the price point.

  **Interventions That Work on a Ratchet:**
  To stop a Survivorship Ratchet, you cannot appeal to the agents. You must alter the **environment** or **insulate the population**.

  1.  **Niche Insulation (Escape the Selection Pressure)**
      *   **Logic:** If the general market selects for low cost, you must move to a sub-market that selects for something else (provenance, longevity, customization).
      *   **Action:** Stop competing on "furniture." Compete on "heirloom assets." Change the metric the buyer uses. If the buyer is selecting on *price*, you will be ratcheted out. If you can shift the selection criterion to *durability* or *story*, the pressure reverses.
      *   **Constraint:** This usually requires shrinking volume. You cannot serve the mass market and resist the Ratchet.

  2.  **Vertical Integration (Control the Selector)**
      *   **Logic:** In Case (a), the retailer moved the contract. The retailer was the *selector*. As long as you are dependent on a selector who is under their own price Ratchet, you will be crushed.
      *   **Action:** Own the retail channel. Sell direct. This removes the intermediary who is forced to demand lower prices from you because *they* are in a Ratchet with *their* competitors.
      *   **Constraint:** Requires capital and marketing capability, not just craft.

  3.  **Regulatory Barriers (Alter the Environment)**
      *   **Logic:** You cannot agree to standards voluntarily (Case B). Standards must be enforced externally to change the cost floor for *everyone*.
      *   **Action:** Lobby for regulations that make the "low quality" method illegal or expensive (e.g., environmental rules on particleboard glues, labeling laws requiring "solid wood" vs. "veneer" disclosure).
      *   **Constraint:** Politically difficult; risks raising costs for you too, but raises them *more* for the competitors.

  4.  **Cross-Subsidization (Buffer the Selection)**
      *   **Logic:** In Case (c), you take bad jobs to keep benches full. This is a cash-flow Ratchet.
      *   **Action:** You need capital reserves or a secondary revenue stream (teaching, repairs, smaller goods) that is not subject to the same price pressure, to subsidize the "high quality" work during slow periods.
      *   **Constraint:** Requires diversification away from core competency.

  **Summary of the Strategic Shift:**
  *   **If it were a Prisoner's Dilemma:** You would organize your competitors, build trust, and monitor defection.
  *   **Because it is a Survivorship Ratchet:** You must **segment** your market, **integrate** your supply chain, or **lobby** for external constraints. You cannot "agree" your way out of a selection pressure. You must build a greenhouse where the frost cannot reach you.

  **Final Advice:**
  Stop trying to save the industry's standard. The industry is an ecosystem, and it is evolving toward lower cost. You cannot stop evolution. You can only **speciate**. Create a distinct branch of your business that operates in a different environment where price is not the primary selector. If you try to maintain the old standard in the new environment, you are not a martyr; you are a fossil in the making.
