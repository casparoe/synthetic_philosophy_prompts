      3.  *Middlemarch*: Dorothea's "Saint Theresa" intro vs. The Finale (Bookish ambition vs. Hidden Life).
      4.  *Middlemarch*: The Casaubon Trap (Dorothea realizing the Key to All Mythologies is a dead end).

  7.  **Drafting the Response:**
      *   *Tone:* Academic, collegial, rigorous, respectful of the user's sophisticated framing.
      *   *Structure:*
