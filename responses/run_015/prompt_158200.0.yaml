      3.  *Middlemarch:* Dorothea's midnight vigil after Casaubon's death (Chapter 42/80ish - checking the text mentally... it's the scene where she resolves to fulfill his wishes but realizes the futility). Actually, better: The Finale (The ending paragraph).
