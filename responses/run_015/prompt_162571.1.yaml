      *   *Performance:* **Moderate.** This explains the rejection of the triangle (no bowl/stem) and the acceptance of the stencil (bowl/stem present despite breaks). However, it struggles with the **4-pixel bitmap**, which likely lacks discernible structural parts (bowl/stem) at that resolution. It also risks failing the test case if the "stub" is deemed structurally insufficient to count as a stem.
