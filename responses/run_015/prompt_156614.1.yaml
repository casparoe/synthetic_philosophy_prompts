answer: |-
  (1) The Exam Question

  **Question 4 (20 marks)**
  *Note: You may refer to the provided paraphrase of Lewis's conditions and the salience/precedent summary on the previous page.*

  Consider a "lock-in" regularity in a population: everyone conforms to behavior R in situation S; everyone prefers conforming to R conditional on others doing so (deviation brings sanctions); yet everyone would prefer a collective switch to alternative R*, and almost everyone falsely believes others intrinsically prefer R over R*. 

  Evaluate whether this lock-in case satisfies the conditions for a Lewisian convention. Your answer must take a stand on whether the false beliefs regarding others' preferences violate the common knowledge requirement. Based on your verdict, explain what mechanism is required to dissolve the lock-in: is a small behavioral minority sufficient to tip expectations (as Priya argues), or is informational revelation necessary (as your seminar discussions suggested)? Finally, briefly indicate what your verdict implies for the legitimacy of sanctions within this group.

  ***

  (2) Model Answer

  To evaluate the lock-in case, we must first isolate the core components of Lewis's account. A convention is a regularity in behavior that solves a coordination problem. Crucially, individuals conform because they expect others to conform, and they prefer conformity conditional on that expectation. There must be an alternative regularity that could have served the same purpose, and these preferences and expectations must be common knowledge among the population.

  The lock-in case superficially fits the behavioral profile. Everyone works seventy hours (R) because everyone else does; deviating risks falling behind or being sanctioned. The conditional preference holds: given the group works seventy, I prefer working seventy to working forty. However, the case fails the epistemic conditions required for a genuine Lewisian convention. Lewis requires common knowledge not just of the current regularity, but of the underlying preference structure that makes it a coordination equilibrium rather than a clash of intrinsic desires. In the lock-in scenario, agents falsely believe others intrinsically prefer the grind. If I believe you work seventy hours because you love it, I do not believe you would coordinate on forty hours. Therefore, I do not know that forty hours is a viable alternative equilibrium for you. The arbitrariness of the rule is not common knowledge because the belief in the alternative's viability is absent.

  Taking the stand that this is not a Lewisian convention due to the failure of common knowledge carries significant costs for explaining stability and change. If it were a convention, stability would rest on self-perpetuating expectations. Since it is not, stability rests on ignorance and false beliefs. This distinction dictates the mechanism for escape. Priya argues that a stubborn minority switching to R* can tip the population by altering conditional expectations. This works for standard conventions where agents know others are indifferent between equilibria; seeing others switch signals that the focal point has moved. In the lock-in case, behavioral switching is ambiguous. If I see a minority working forty hours, I may interpret this as them being lazy or incompetent, reinforcing my belief that the group intrinsically values seventy hours. Behavioral signals cannot correct false beliefs about intrinsic preferences.

  Therefore, dissolving a lock-in requires informational revelation, not just behavioral precedent. A survey or credible announcement that reveals everyone privately prefers forty hours transforms the situation into a genuine coordination problem. Once agents know that others are also suffering the grind, the alternative equilibrium becomes salient. Only then does Lewis's machinery kick in, allowing expectations to shift without requiring a risky minority to bear the initial cost of deviation.

  Finally, this verdict undermines the normative force of sanctions. In a true convention, sanctions enforce a mutually beneficial coordination solution; one is entitled to demand conformity because it serves everyone's interest to coordinate. In the lock-in case, sanctions enforce a Pareto-inferior outcome based on deception (albeit unintentional). Agents sanction deviators not to preserve a shared benefit, but to protect themselves from being the sole sucker in a game they misunderstand. Thus, while Lewis can explain the prudential reason to conform (avoiding sanction), his account cannot ground the entitlement to demand conformity here, because the shared knowledge required to justify the demand is missing. The lock-in is not a convention, but a systemic error maintained by pluralistic ignorance.

  ***

  (3) Marking Scheme (Total: 20 Marks)

  | Move | Marks | Requirement | Common Fumble |
  | :--- | :--- | :--- | :--- |
  | **1. Lewis's Conditions** | 4 | Correctly identifies conditional preference AND common knowledge of preferences/alternatives as necessary conditions. | Students define convention solely as "everyone does it and expects others to," ignoring the common knowledge of the alternative equilibrium. |
  | **2. Epistemic Failure** | 4 | Identifies that false beliefs about intrinsic preferences violate the common knowledge condition (agents don't know R* is an equilibrium for others). | Students argue it fits Lewis because the conditional preference holds, missing that the *reason* for conformity matters. |
  | **3. Verdict** | 4 | Takes a clear stand (Yes or No) consistent with the epistemic analysis (ideally "No" for full depth). | Students hedge or say "It depends" without explaining which condition is the dealbreaker. |
  | **4. Mechanism of Change** | 4 | Argues that behavioral tipping fails without informational revelation because behavior doesn't correct false preference beliefs. | Students accept Priya's 5% tipping argument without addressing why behavioral signals are ambiguous in this specific epistemic context. |
  | **5. Normative Implication** | 4 | Explains that sanctions lack legitimacy/entitlement because the coordination benefit is not commonly known/shared. | Students claim sanctions are justified simply because "rules are rules" or conflate prudential reasons with normative entitlement. |

  ***

  (4) A vs. B Distinction

  A **B-grade answer** will correctly recite Lewis's definition and likely argue that the lock-in case counts as a convention because the conditional preferences align. They may accept Priya's tipping mechanism at face value, treating the shift in behavior as sufficient to shift expectations. They will treat the false beliefs as incidental rather than structural.

  An **A-grade answer** will recognize that Lewis's account is epistemic, not just behavioral. They will identify that without common knowledge of the alternative preference, the regularity is not "arbitrary" in the required sense. Consequently, they will argue that behavioral tipping is insufficient because signals are misinterpreted without prior informational revelation. They will connect the epistemic failure directly to the illegitimacy of sanctions, showing how the definition drives the implications for norm change and normativity.
