answer: |-
  You have constructed a sophisticated theoretical scaffold to support a narrative intuition, and you are right to worry that the scaffold might be holding up a wall that doesn't need to bear weight. Your taxonomy of *Trigger*, *Lever*, and *Veto Player* is a useful heuristic for a novelist, but as a historiographical claim about agency, it faces specific structural vulnerabilities. You asked for an exposure map, ranked by severity, setting aside the intentionality objection.

  Here is the assessment of your position, the state of the debate, and the verdict on insulation.

  ### I. The Defeaters (Ranked from Fatal to Awkward)

  **1. Explanatory Redundancy (Fatal)**
  This is the strongest objection. It argues that your "non-human actor" vocabulary is doing rhetorical work, not explanatory work. If a well-specified social-institutional model (e.g., property rights, storage technology, class relations) can predict the outcome of the grain crisis without referencing the volcano except as a fixed parameter, then labeling the volcano an "actor" adds no information.
  *   **Why it is fatal:** In causal modeling, if Variable A (social structure) accounts for 95% of the variance in Outcome Y, and Variable B (volcano) only matters insofar as it interacts with A, then B is not an independent agent; it is a boundary condition. If your claim is that the volcano *acts*, but its "action" is entirely mediated by human vulnerability, then the "agency" resides in the vulnerability, not the ash. The volcano becomes a stage prop, not a cast member.

  **2. Retrospective Selection Bias (Fatal)**
  This is the problem of naming. You identify the eruption as an "actor" only because the society underwent a significant transformation. If the society had absorbed the shock through robust institutions and continued unchanged, the eruption would likely be recorded as "background noise" or "bad weather," not an agent of history.
  *   **Why it is fatal:** This makes your theory unfalsifiable. You are selecting cases where the non-human factor correlates with a major outcome and labeling it an agent, while ignoring cases where the same non-human factor occurred without major outcome (or where major outcomes occurred without the factor). If the label "actor" is applied only after the outcome is known, it is a description of the historian's interest, not a property of the event.

  **3. Taxonomic Instability (Severe)**
  Your three grades (*Trigger, Lever, Veto*) are not stable categories because they depend entirely on the resilience of the system they interact with, not on the nature of the non-human entity itself.
  *   **Why it is severe:** A *Veto Player* in a fragile society (e.g., a drought that forces migration) is merely a *Lever* in a resilient one (e.g., a drought that prompts irrigation investment), and mere *background* in a highly advanced one (e.g., a drought managed by global trade). If the "grade" of agency changes based on human social structures, then the agency is not intrinsic to the non-human entity. It implies there is no principled stopping point between a "Veto" and a "Background Condition." This collapses your taxonomy back into a measure of human vulnerability.

  **4. The Dilution of Responsibility (Awkward)**
  This is less ontological and more political. If a virus or a volcano is granted "agency," it can inadvertently absolve human actors of negligence. If the famine is caused by the "volcano's veto," the bailiff's hoarding becomes a secondary complication rather than a primary cause.
  *   **Why it is awkward:** It complicates the moral geometry of your novel. While historically accurate (famine is often a failure of distribution, not production), framing the environment as an agent can subtly shift the reader's blame away from the privatizers of the granary and toward the sky. It risks naturalizing political failures.

  ### II. The State of the Debate: Concessions and Dismissals

  You asked what a committed defender of non-human agency would concede versus what they would dismiss.

  **What Defenders Concede:**
  *   **Vulnerability is Primary:** Serious proponents of this view (such as those in the "Anthropocene" or "Deep History" schools) generally concede that the *impact* of the shock is determined by social vulnerability. They would agree with your suspicion that the interesting work is done by who owned the granaries, not the ash.
  *   **The Selection Effect:** They admit that we tend to notice these actors only when they disrupt the status quo. They argue this is a feature of history (which records disruption) rather than a bug of the theory.
  *   **The Need for Interaction:** They concede that non-human agency never operates in a vacuum. It is always "co-constituted." A volcano without a society is just geology; a society without a volcano is just politics. The "agency" emerges in the collision.

  **What Defenders Dismiss:**
  *   **The Intentionality Requirement:** As you noted, they reject the idea that agency requires a mind. They argue that institutions, markets, and armies are also treated as historical actors despite lacking a single biological brain. If a "market crash" can act as a *Veto Player*, why not a plague? They argue that demanding intentionality is a humanist bias that disqualifies too much.
  *   **The Redundancy Charge:** They argue that social-institutional explanations often fail to predict *timing* or *specific trajectory*. A social model might predict crisis eventually, but the volcano explains *why now* and *why this form*. They claim the non-human element breaks the equilibrium in a way that social factors alone cannot predict.

  **What Evidence Would Settle the Matter:**
  To move beyond embarrassment to settlement, you would need comparative control groups.
  *   **The Test:** Identify multiple societies with vastly different structures (e.g., communal vs. privatized grain storage) exposed to shocks of comparable magnitude (e.g., similar volcanic winters).
  *   **The Result that Supports You:** If the shock reliably produces the *same* institutional outcome (e.g., feudalism) across *all* structures, the non-human factor is a strong determinant (closer to your *Trigger*).
  *   **The Result that Undermines You:** If the outcomes diverge completely based on the pre-existing structure (e.g., one collapses, one adapts, one ignores it), then the "agency" lies in the structure, and the shock is merely a *parameter*. Currently, the evidence heavily favors the latter: vulnerability mediates the shock.

  ### III. Verdict on Insulation

  You worry that retreating to "heuristic" is a way of making your claim safe by ceasing to say anything. **You are correct.**

  Calling "actor" a heuristic is an immunization strategy. It allows you to use the evocative language of agency when it suits your narrative or analysis, but retreat to "it's just a metaphor" when pressed on causal mechanics. This is appropriate modesty for a literary device, but it is a theoretical surrender. If "actor" means nothing more than "something I want the reader to pay attention to," then it makes no claim about the world, and therefore cannot be true or false. It becomes a stylistic choice, not a historiographical one.

  **How to Add Risk:**
  To make your formulation risky (falsifiable), you must specify conditions under which the non-human entity *fails* to act.
  1.  **Define the Threshold:** Specify the magnitude of shock required to activate "agency." If a small eruption does nothing, but a large one forces a *Lever* shift, define the boundary. If the boundary is entirely dependent on human reaction, you are back to social determinism.
  2.  **Predictive Constraint:** Claim that there are specific *types* of outcomes that social factors alone cannot produce. For example, argue that no amount of social inequality can produce a specific demographic collapse without a biological vector. If you can show that the *nature* of the change (not just the timing) is imprinted by the non-human actor (e.g., the specific type of social fragmentation caused by a pandemic vs. a drought), then the non-human entity is doing unique work.
  3.  **Refine the Taxonomy:** Admit that *Trigger* is likely deterministic and vulnerable to critique, but argue that *Veto Player* is the most robust category. A *Veto* is not about causing a specific outcome, but about closing a specific path. To make this risky, you must identify a path that was historically plausible, open to the society, and *closed* solely by the non-human factor. If you cannot name the closed path, the *Veto* is imaginary.

  ### Summary for the Novelist

  Your intuition serves the novel well because fiction thrives on the friction between human intention and material constraint. Your characters *feel* the volcano as an antagonist, and rendering it as an "actor" captures their lived experience.

  However, as a historiographical defense, your position is currently insulated. It relies on the social structure to do the heavy lifting while granting the volcano the credit for the drama. To defend it honestly, you should concede that the volcano is not an independent agent in the way a bailiff is, but rather a **co-author of constraints**. It does not write the plot, but it tears out certain pages of the script so the characters cannot perform them.

  If you frame it this way—as a constraint on possibility space rather than a source of intention—you avoid the trap of determinism without retreating into empty metaphor. You acknowledge that the ash did not decide to privatize the granary, but it made the communal option impossible to sustain. That is a defensible, risky, and dramatically potent position.
