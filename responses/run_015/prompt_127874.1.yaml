answer: |-
  This is a sophisticated puzzle that cuts across confirmation theory, the history of science, and social epistemology. You are describing a phenomenon where the *epistemic weight* of a fit between theory and evidence varies not because the logical relation changes, nor because the objective history changes, but because the *agent's access to the history of that relation* changes.

  You call it "laundered fit." That is an evocative label. Before we decide whether to keep it or replace it, we must locate it in the conceptual space to ensure we are not mistaking it for a neighbouring problem.

  ### 1. Conceptual Neighbourhood and Eliminations

  There are three standard concepts in the philosophy of science that sit immediately adjacent to your description. We must test them to see if they capture the specific normative shift you are tracking.

  **Candidate 1: The Old Evidence Problem.**
  This is the puzzle your friend mentioned. In Bayesian terms, if a fact $F$ is already known ($P(F) = 1$), then learning a theory $H$ that entails $F$ cannot raise the probability of $H$ via standard conditionalization, because $P(H|F) = P(H)$.
  *   **Why it is close:** It deals with facts known before the theory is accepted.
  *   **Why it must be set aside:** The Old Evidence problem is a technical issue about *logical time* and probability functions. It asks how $F$ can confirm $H$ *at all* if $F$ was known first. Your puzzle assumes confirmation *does* occur (for the student) but *should not* (for the teacher). The Old Evidence problem does not distinguish between the student and the teacher; for both, $F$ is "old." Your puzzle is not about the age of the fact, but about the *agent's knowledge of the construction process*.

  **Candidate 2: The Accommodation vs. Prediction Distinction.**
  Standard methodology holds that predicting a novel fact confirms a theory more strongly than accommodating an old one. This is often called "use-novelty."
  *   **Why it is close:** It captures the intuition that fitting $F$ is less impressive if $H$ was built to fit $F$.
  *   **Why it must be set aside:** Traditionally, this distinction is objective. Either $H$ was constructed before $F$ was known (prediction) or after (accommodation). In your Scenario (2) and (3), the objective history is fixed (accommodation), yet the confirmation *feels* real and normative for the listener. The standard distinction cannot explain why the *same* accommodated fact confers different warrant to different people depending on what they were told about the history. It treats the confirmation as a property of the theory-world relation, whereas you have identified it as a property of the *transmission chain*.

  **Candidate 3: Testimonial Defeat.**
  In social epistemology, if I tell you $P$, but you later learn I was guessing, your warrant for $P$ is defeated.
  *   **Why it is close:** It deals with information loss via transmission.
  *   **Why it must be set aside:** This usually applies to the truth of the claim itself. Here, no one doubts $F$ is true, or that $H$ entails $F$. The defeat applies specifically to the *inferential link* between them.

  ### 2. The Preferred Analysis: Selection Effects in Hypothesis Space

  The phenomenon you are tracking is real, normative, and distinct. It is best understood as **Testimonial Opacity regarding Hypothesis Selection Effects.**

  Here is the conceptual carving:

  Confirmation is not merely a relation between $H$ and $F$. It is a relation between $H$, $F$, and $K$ (the background knowledge). Crucially, $K$ must include a model of **how $H$ was selected from the space of possible hypotheses.**

  *   **The Teacher's $K$:** Includes the fact that $H$ was selected *because* it fit $F$. This implies a search process: "Generate hypotheses until one fits $F$." In this scenario, the probability of finding *some* hypothesis that fits $F$ is high, regardless of whether $H$ is true. The likelihood ratio $P(F|H) / P(F|\neg H)$ collapses because $P(F|\neg H)$ is also high (since a false hypothesis could be tuned to fit).
  *   **The Student's $K$:** Lacks the history. They model the process as: "Generate $H$ from theoretical principles, then check against $F$." In this scenario, if $H$ were false, it is unlikely to fit $F$ by chance. The likelihood ratio is high.

  The "Laundered Fit" occurs when the Teacher's $K$ is not transmitted to the Student. The Student treats an accommodated fact as a novel prediction because they are ignorant of the *filtering process* that produced the theory.

  This is not merely psychological. It is a Bayesian error in estimating the likelihood of the evidence under the null hypothesis (or under the "selection process" hypothesis). The student is failing to condition on the fact that $H$ survived a filter designed to pass only hypotheses that fit $F$.

  Therefore, I will adopt your term **Laundered Fit**, but define it formally: **Laundered Fit is the epistemic state wherein an agent assigns high confirmation to a theory-evidence fit because they are ignorant of the selection effects that guaranteed the fit.**

  ### 3. Addressing Your Specific Questions

  **(a) Is this something a Bayesian should care about?**
  Yes. It is not merely psychology. A Bayesian agent must condition on all available information, including information about *how the hypothesis came to their attention*.
  If you receive a hypothesis $H$ via testimony, you must estimate $P(H \text{ is offered} | H \text{ is true})$ versus $P(H \text{ is offered} | H \text{ is false})$.
  If $H$ was constructed to fit $F$, then $H$ is likely to be offered regardless of its truth, provided it fits $F$. The "correction" you mention is the **Selection Effect Correction**.
  *   **What should the agent do?** They cannot simply "suspend judgement" if they must act. They should discount the weight of $F$ in proportion to the probability that $H$ was tuned to $F$. If they cannot estimate the tuning (e.g., they don't know the history), they are rationally entitled to the higher confidence *until* they learn otherwise. However, they should maintain a "meta-uncertainty" about the provenance of their theories. In practice, this means treating textbook fits as weaker than fresh predictions, by default, unless provenance is known.

  **(b) Does it aggregate?**
  No. Confirmation is not a currency that multiplies by heads.
  If a hundred students each get the "boost," the community has not acquired a hundred boosts. Epistemic warrant does not aggregate headcount; it aggregates *independent lines of evidence*.
  Since all hundred students are receiving the *same* laundered fit via the *same* source (the textbook/teacher), their evidence is not independent. It is a single testimonial chain.
  *   **Dilution:** In fact, wide transmission often *increases* the likelihood that the history is obscured (the "telephone game" effect). However, if the community *structure* includes experts who know the history, the community's *collective* warrant is defeated, even if the individuals are not. The "stock" of confirmation is determined by the best-informed node in the network, not the average. If the experts know it's laundered, the fact $F$ cannot serve as public justification for $H$, even if novices believe it does.

  **(c) Can it be regenerated?**
  This is the sharpest question. It touches on the Internalist/Externalist divide.
  *   **Internalist View:** Yes. If the history is genuinely forgotten, the selection effect is no longer part of $K$. For that agent, $F$ *is* evidence for $H$. Rationality is relative to the agent's information state.
  *   **Externalist View:** No. The reliability of the process that produced the belief is what matters. If the process was "tune theory to data," the belief is not warranted, even if the agent forgets the tuning.
  *   **My Analysis:** I side with a hybrid. The *psychological confidence* regenerates (Internalist), but the *objective justificatory status* does not (Externalist).
      *   **Is this absurd?** It implies that science can "re-confirm" itself by forgetting its own history. This is not absurd; it is a known risk in fields that lose their historical memory. It is why methodology requires recording *how* parameters were fixed. If a subfield grows up forgetting $F$ was used to fix $H$'s parameters, they are making a methodological error, even if they feel certain. The "novelty" is fake, but epistemically functional for them.

  **(d) What should an honest teacher do?**
  Withholding the history is a form of **epistemic paternalism** that borders on deception. It induces a false model of hypothesis generation in the student.
  *   **The Difference:** There is a distinction between learning the specific history ("$H$ was tuned to $F$ in 1920") and a general methodological warning ("In this field, many textbook fits are accommodated").
  *   **Recommendation:** The teacher should provide the general warning (the "base rate" of accommodation in the field). This allows the student to apply a discount factor without needing the specific history of every theorem. However, for paradigmatic cases (like $F$ and $H$), specific history should be taught. Destroying the "glow" is not a loss; it is the replacement of a fragile intuition with a robust understanding of the theory's actual support structure.

  **(e) How can I tell from the inside?**
  You cannot. This is the crucial limit.
  *   **The Test:** There is no introspective test for laundered fit. The "feeling of fit" is the same.
  *   **The Detection:** Detection requires **sociological data**, not logical analysis. You must ask: "Was this parameter free, or fixed?" "Were alternative hypotheses considered and discarded because they didn't fit $F$?"
  *   **Implication:** This means individual rationality is dependent on institutional transparency. You cannot be a fully rational agent in isolation if the history of the theories you use is hidden. You must rely on the integrity of the field's record-keeping.

  ### 4. The Strongest Objection and Rebuttal

  **The Objection: The "No Miracles" Counter.**
  A realist might argue: "Even if $H$ was constructed to fit $F$, the fact that it *can* fit $F$ without contradiction is itself evidence. If $H$ were wildly false, it would be a miracle that it could be tuned to fit $F$ coherently alongside other facts. The fit is not *zero* weight just because it was accommodation. Therefore, the student is not entirely wrong, only slightly overconfident. The 'laundering' doesn't remove the confirmation, it just caps it."

  **Meeting the Objection:**
  This objection conflates *consistency* with *confirmation*.
  1.  **Consistency:** It is true that a false theory might be *unable* to fit $F$ (e.g., if $F$ contradicts $H$'s axioms). If $H$ accommodates $F$ without contradiction, that rules out the subset of false hypotheses that are inconsistent with $F$.
  2.  **Confirmation:** However, confirmation requires *discriminatory power*. If the construction process allows for infinite tuning (adding epicycles, adjusting parameters), then *any* $F$ can be accommodated by *some* version of $H$.
  3.  **The Rebuttal:** The "No Miracles" argument works for *novel* predictions because the theory had no opportunity to tune. For accommodation, the "miracle" is manufactured. The objection holds only if the "tuning space" is constrained.
      *   **Refinement:** The teacher's skepticism is rational *to the degree that the theory was flexible*. If $H$ was rigid and still fit $F$, the laundering is less severe. If $H$ was malleable, the laundering is total.
      *   **Conclusion:** The objection correctly notes that accommodation is not *worthless*, but it fails to see that the *student's* confidence usually treats it as *prediction-level* confirmation. The normative shift you track is the correction from "Prediction Weight" to "Accommodation Weight." The student is not wrong to see *some* fit, but wrong to treat it as *strong* fit. The "Laundered Fit" phenomenon is specifically the *inflation* of that weight due to ignorance of the tuning process.

  ### 5. Final Conceptual Carving

  You asked for the distinction, not just the word. Here is the boundary:

  **Laundered Fit** is not:
  *   Mere psychological surprise (it persists even when the surprise fades, as a normative claim).
  *   The Old Evidence problem (it applies even if the evidence is technically "new" to the agent, provided the theory was built on it).
  *   A lie (the theory *does* fit the fact).

  **Laundered Fit** is:
  *   **A Provenance Defect:** It is a defect in the *lineage* of the belief, not the content.
  *   **Socially Transmissible:** It spreads via testimony when the meta-data (construction history) is stripped from the object-data (the fit).
  *   **Correctable:** It is corrected not by new data, but by historical/sociological data about the theory's construction.

  **Boundary Cases:**
  *   **Not Laundered Fit:** A student learns $H$, then goes out and measures $F$ themselves. Even if $H$ was originally built to fit $F$, the student's *measurement* is a novel test. The laundering is broken by independent verification.
  *   **Not Laundered Fit:** A theory $H$ predicts $F$, but $F$ was already known. This is standard Old Evidence. If the theorist *did not know* $F$ when building $H$, it is not laundered, even if $F$ is old. The key is the *theorist's* knowledge during construction, not the *student's* knowledge during learning.
  *   **Laundered Fit:** A "post-diction" presented as a prediction. The theorist knows $F$, builds $H$ to fit it, but publishes $H$ claiming $F$ was a successful prediction. The audience receives Laundered Fit.

  **Summary:**
  You have identified a specific failure mode in the social division of epistemic labor. Experts know the selection history; novices do not. When experts transmit the *result* without the *selection history*, they transmit inflated warrant. This is **Laundered Fit**. It is a normative phenomenon because rational belief requires conditioning on the selection process. It is not merely psychological because the probability calculus changes once the selection variable is included in $K$.

  Your intuition that "willingness to cite $F$ as a reason" changes is the correct marker. That willingness tracks the *public justificatory status* of the fact, which depends on the community's shared knowledge of the history, not just the individual's private confidence.
