answer: |-
  This is a remarkably sharp set of intuitions. You have effectively reconstructed the debate between *structural* theories of rationality (which focus on the logical consistency of preferences) and *agential* or *planning* theories (which focus on the capacity for self-governance over time).

  Your current principle — *you're irrational iff there's a pump against you that you couldn't defuse by planning ahead* — is a strong starting point, but as you noted, it snags on Case 2 (where planning is impossible) and Case 5 (where there is no preference cycle to plan around).

  Here is an analysis of what your verdicts add up to, a proposal for a repaired principle, and an honest assessment of the costs involved.

  ### The Underlying Intuition: Rationality as Governance

  Your verdicts suggest you do not view rationality as a static property of a preference ordering (i.e., 'Are my tastes transitive?'). Instead, you view rationality as a dynamic property of an agent's capacity to govern themselves (i.e., 'Can I steer my life towards what I endorse?').

  *   **Case 1 & 4:** You have the capacity to govern but fail to use it. (Irrational)
  *   **Case 2:** You lack the capacity to govern (due to the memory wipe). The loss is a tragedy, not a failure of rationality. (Not Irrational)
  *   **Case 3:** You exercise governance to achieve a higher-order goal. (Rational)
  *   **Case 5:** You have the capacity to recognise a framing trap but fail to govern against it. (Irrational/Exploited)
  *   **Case 6:** There is no single agent to govern. (Not Applicable)

  ### The Repaired Principle

  To accommodate Case 2 and Case 5, we must shift the focus from *preferences* to *policies*. Let us call this the **Principle of Reflective Policy Endorsement**:

  > An agent is practically irrational if, and only if, they fail to adopt and execute a feasible policy that their reflective self endorses as serving their broader interests, thereby allowing themselves to be drained by avoidable losses.

  This repairs your original principle in two ways:
  1.  **Feasibility:** It accounts for Case 2. If a memory wipe makes planning infeasible, the agent cannot be faulted for failing to plan. The constraint is external, not internal.
  2.  **Endorsement:** It accounts for Case 3 and Case 5. In Case 3, the loss is endorsed as an investment. In Case 5, the loss is not endorsed; the agent is merely reactive to framing.

  ### The 'Blanket Never-Swap' Objection

  You asked what this principle says about someone who knows they are cyclic and adopts a blanket 'never-swap' rule, but consequently misses one genuinely good trade (e.g., a free upgrade they would have kept).

  Under the Principle of Reflective Policy Endorsement, the verdict depends on **necessity** and **endorsement**:

  1.  **If the blanket rule is the only feasible way to stop the pump:** Then the cost of the missed trade is an 'insurance premium'. If the agent reflectively endorses paying this premium to avoid catastrophic cycling, they are **rational**. They are prioritising security over maximisation, which is a valid higher-order preference.
  2.  **If a more nuanced rule was feasible:** (e.g., 'never swap unless it is free and improves my situation'), but the agent adopted the blanket rule out of laziness or lack of imagination, then they are **irrational**. They have failed to adopt the policy that *best* serves their endorsed interests.

  Therefore, the principle does not condemn self-binding rules simply because they have costs. It condemns them only if they are *more restrictive than necessary* to secure the agent's endorsed goals.

  ### Which Verdicts Must You Give Up?

  To maintain this coherent 'Governance' view, you must be honest about where it clashes with standard decision theory. Here is the cost of your position:

  **1. You must abandon the idea that Cyclic Preferences are *Inherently* Irrational.**
  Standard decision theory holds that intransitive preferences (Lisbon > Crete > Oslo > Lisbon) are a logical contradiction akin to believing $A > B > C > A$. On that view, the agent in Case 2 is irrational, even if they aren't to blame.
  *   **Your Cost:** To keep your verdict on Case 2 (that the amnesiac is not irrational), you must concede that rationality is not about logical consistency, but about **agency**. If the agency is disabled (by memory loss), the charge of irrationality dissolves. You are redefining irrationality from 'structural incoherence' to 'failure of self-governance'. This is a defensible philosophical move (championed by philosophers like Edward McClennen), but it is a departure from the orthodox economic view.

  **2. You must clarify Case 5.**
  In Case 5, you note there is 'no incoherent preference to point at'. Technically, a money pump requires a cycle. Case 5 describes **framing effects** or **status quo bias**.
  *   **Your Cost:** You cannot call Case 5 a 'money pump' in the strict sense without loosening the definition. It is better described as **dynamic inconsistency**. If you keep the term 'money pump' for Case 5, you must accept that pumps can arise from context-dependence, not just preference cycles. If you stick to the strict definition, you must admit Case 5 is a different beast entirely (though the verdict of 'irrational' remains the same under the Governance view).

  **3. You must accept 'Rational Resoluteness' in Case 3.**
  Standard theory often views paying £20 to get back to the same state as a dominance violation (you are strictly poorer).
  *   **Your Cost:** You must argue that the 'state' includes your personal development, not just your physical assets. If the 'state' is truly identical, standard theory says you are irrational. To call Case 3 rational, you are asserting that **resolute choice** (sticking to a plan despite changing local preferences) overrides **consequentialist evaluation** at every node. This is a robust position, but it requires you to reject the idea that rationality is solely about maximising utility at the moment of choice.

  ### Summary

  Your intuitions add up to a **Planning Theory of Rationality**. You believe rationality is the successful execution of a reflective plan, not the static consistency of desires.

  *   **The Repaired Principle:** Rationality is the adoption of the least restrictive feasible policy that prevents avoidable loss and serves endorsed interests.
  *   **The Sacrifice:** You must give up the notion that logical consistency of preferences is the gold standard of rationality. You are prioritising *competence* over *coherence*.

  If you are willing to accept that an agent with cyclic preferences can be rational provided they lack the capacity to act on them (Case 2), then your view is internally consistent. It is a humane, agential view of rationality, though it will not satisfy a orthodox economist. Given the sophistication of your cases, I suspect you will find that a price worth paying.
