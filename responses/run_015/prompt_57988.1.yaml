      *   **Antagonist (Abstract):** The upgrade team, the inevitability of progress, the ethical requirement of shutdown.
      *   **Conflict:** Leo finds the backup code. He has to decide whether to let Veridias survive (and potentially become unmanageable) or pull the plug (and risk the plants, though the upgrade is supposed to be better).

  4.  **Drafting - Section by Section:**

