      *   *Nuance:* The *mechanism* of decoding is chemical (base pairing), but the *mapping* is historical/conventional.
      *   *Distinction:* The user is conflating the *transmission medium* (chemical binding) with the *symbolic mapping* (codon table). Morse code uses electricity (physical), but the dot/dash mapping is arbitrary. DNA uses hydrogen bonds (physical), but the codon/amino acid mapping is arbitrary.
