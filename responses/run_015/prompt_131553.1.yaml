      *   **The Specific Philosophical Hinge:** A formal code requires *arbitrariness* and *separation of encoder/decoder*. In biology, the "decoder" (ribosome/tRNA) is chemically coupled to the "message" (mRNA) via physical shape (complementarity). Is "code" a category mistake?
      *   **The Secondary Question:** Do mitochondrial variants and the histone code rescue the "programming metaphor" by introducing arbitrariness/nested interpreters, or do they complicate it further?
      *   **The Goal:** Clarify whether "code" is a disciplined metaphor with limits or if life genuinely runs stacked interpreters, and what this means for synthetic biology's "rewritable software" framing.

  2.  **Deconstruct the Philosophical Arguments:**
