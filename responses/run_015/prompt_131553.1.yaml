      *   *The "Semantic/Informational" Argument (Standard View):* The genetic code *is* arbitrary (mostly). There is no chemical necessity for UUU to code for Phenylalanine. The machinery (tRNA synthetases) acts as the "lookup table." Therefore, it *is* a code.
      *   *The "Synthetic Biology" Stake:* If DNA is just chemistry, you can't just "rewrite" it like software; you have to respect the physical context. If it *is* software, you can abstract away the hardware.

  3.  **Address the "Arbitrariness" Point (The Crux):**
