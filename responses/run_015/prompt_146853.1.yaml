answer: |-
  **Title:** Portable Virtues? Exemplar Portability and Context in Plutarch's *Parallel Lives*

  **Project Summary**
  Standard debates in moral philosophy regarding biography often ask whether reading lives successfully transmits virtue. This project shifts the inquiry from *outcome* to *mechanism*, asking whether biographical narrative trains a specific cognitive habit I term "exemplar portability"—the tendency to treat a moral agent as a detachable pattern rather than an entity embedded in a specific institutional setting. While hagiographical traditions often presume the universal portability of the saint, Plutarch's *Parallel Lives* complicates this through its structural juxtaposition of Greek and Roman figures. This paper investigates whether Plutarch's comparative method encourages readers to abstract virtues from their historical context or whether the *synkrisis* ultimately reinforces the irreducibility of cultural setting.

  **Research Question**
  Does the structural pairing of Greek and Roman lives in Plutarch's *Parallel Lives* facilitate exemplar portability, or does the juxtaposition preserve context in ways that block it? Existing literature on virtue education typically treats exemplars as either effective models or ineffective idols, overlooking how narrative structure conditions the *type* of moral reasoning employed. By focusing on portability, this project addresses a gap in understanding how comparative biography shapes the reader's capacity to apply moral lessons across different contexts.

  **Methodology**
  To maintain a realistic scope for a semester-length paper, I will eschew a corpus survey in favor of close reading two specific pairs: *Alexander/Caesar* and *Demosthenes/Cicero*. These pairs offer distinct tests of portability: the former examines military and political ambition across different imperial contexts, while the latter examines rhetorical virtue within differing constitutional frameworks. I will analyze the prologues, narrative framing, and the explicit *synkrisis* conclusions to identify whether Plutarch invites the reader to extract universal maxims or to dwell on contextual discontinuities.

  **Expected Outcomes and Feasibility**
  A successful result will demonstrate a textual mechanism in Plutarch that either enables abstraction (supporting portability) or insists on contextual fidelity (blocking it), thereby refining our understanding of biographical moral learning beyond the hagiographical model. Failure would consist in finding the text equally ambivalent on both fronts without resolving the tension. This scope is feasible for a semester paper as it limits textual analysis to four lives and their comparisons, allowing for sufficient depth without requiring extensive historical surveying.

  This paper investigates whether Plutarch's comparative narrative structure trains readers to treat moral agents as portable patterns or context-bound examples, thereby refining our understanding of biographical moral education.
