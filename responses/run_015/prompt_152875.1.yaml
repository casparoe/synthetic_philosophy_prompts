  They swear the ledger shows no crime.
  We search the archives for the light.
  Yet every silence buys its time.

  The dust accumulates in rime.
  The windows shuttered tight at night.
  Though pages tear, they swear the ledger shows no crime.

  We count the cost of every dime.
  We strain our eyes to catch the sight.
  Until the clocks all stop, yet every silence buys its time.

  No verdict comes to clear the grime.
  They say we lack the proper right.
  Though pages tear and copies vanish, they swear the ledger shows no crime.

  They promise truth will climb and climb.
  We wait for dawn to break the night.
  Until the clocks all stop and gears are stripped, yet every silence buys its time.

  The world moves on in steady rhyme.
  We stand alone within the light.
  Though pages tear and copies vanish when the auditors arrive, they swear the ledger shows no crime.
  Until the clocks all stop and gears are stripped by those who wind, yet every silence buys its time.

  ***

  *Note: To keep the villanelle's rhyme frame "perfectly still" while accreting weight, the auxiliary clauses are prepended to the refrains. This preserves the terminal rhyme words ("crime"/"time") while burying the core claim beneath the growing explanation.*
