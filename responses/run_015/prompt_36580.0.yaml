prompt: |-
  I'm teaching a grad seminar on formal epistemology this term, and we just finished objective chance (Lewis's Principal Principle) and are about to do Reflection (van Fraassen). After last week's session a student hung around and asked me something I've been chewing on ever since, and now I want to see how someone else would organize the whole thing. The two principles look structurally parallel: the Principal Principle tells you to set your credences to match what you take the objective chances to be, conditional on that chance assignment, while Reflection tells you to set your current credences to match what you expect your future credences to be, conditional on having them. Chance on one side, your own future self on the other — both are deference principles, just with a different expert.

  But the failure modes are interestingly different, and this is where I want the comparison to bite. The Principal Principle looks broken when the "expert" isn't independent of your evidence — the old undermining problem, where information about how things will actually go bears on what the chances themselves are, so you can't conditionalize on the chance hypothesis and defer to it in one motion. Reflection looks broken in cases where you can foresee your own irrationality: you know that after the third glass of wine you'll be confident you're fine to drive, but you shouldn't defer to that future confidence now. So one natural diagnosis is that both principles are instances of a single deeper rule — something like "defer to X only if you treat X as an expert" — and neither chances nor future selves get that status for free. My student thinks this makes Reflection the more fundamental one, since self-trust is in some sense built into epistemology from the ground up; I keep wanting to say chance is the real expert and my future self is at best a stand-in for it when I expect to be epistemically lucky.

  So here's what I want from you: compare the two principles seriously, not just note the parallel and move on. Is Reflection really just the Principal Principle in a mirror, or is the disanalogy deeper than the shared structure suggests? Which principle is better defended on its home turf, and can either be repaired using the resources of the other — e.g., can the style of fix people proposed for the undermining problem, where you tinker with what exactly you're conditionalizing on, be ported over to handle Reflection's foreseen-irrationality cases? Take a position and defend it; my student and I have gone back and forth for a week and neither of us will budge, so I'm curious what a tiebreaker looks like. Please don't just survey the literature — I want an actual verdict on which deference principle, if either, deserves the status of the more basic one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A professor teaching a graduate seminar on formal epistemology.
      *   **Context:** Just finished Lewis's Principal Principle (PP), moving to van Fraassen's Reflection Principle (RP).
      *   **Problem:** A student asked about the structural parallel between PP and RP (both are deference principles). The professor and student disagree on which is more fundamental (Student: Reflection/Self-trust; Professor: Chance/Objective Expert).
      *   **Task:** Compare the two principles seriously, analyze failure modes (undermining vs. foreseen irrationality), evaluate potential repairs/cross-pollination of fixes, and *take a position* on which is more basic.
      *   **Constraint:** Do not just survey the literature. Provide an actual verdict/argument.
      *   **Tone:** Academic, rigorous, engaging, suitable for a grad seminar context (philosophically sophisticated).

  2.  **Deconstruct the Principles:**
      *   **Principal Principle (PP):** $C(A | Ch(A)=x \land E) = x$. (Roughly). Deference to objective chance.
          *   *Failure Mode:* Undermining Futures. Information about the future can bear on the chance hypothesis itself. If $E$ includes the future history, $Ch$ might not be $x$.
          *   *Fix:* Lewis's "New Principle" or Thau/Hall's revisions. Restrict admissible evidence.
      *   **Reflection Principle (RP):** $C_t(A | C_{t+n}(A)=x) = x$. (Roughly). Deference to future self.
          *   *Failure Mode:* Foreseen Irrationality (Akkrasia/Drinking). I know future me will be drunk/biased.
          *   *Fix:* Restrict the condition to "future selves I regard as rational/epistemically ideal."

  3.  **Evaluate the "Mirror" Hypothesis:**
      *   Are they structurally identical?
      *   PP: Deference to an *external* normative standard (Chance).
      *   RP: Deference to an *internal* temporal stage (Future Self).
      *   Similarity: Both involve conditionalizing on an expert opinion.
      *   Difference: The nature of the "expert." Chance is mind-independent (Humean or non-Humean). Future self is mind-dependent and causally connected to current self.

  4.  **Analyze the "Fundamentality" Claim:**
      *   *Student's View (Reflection First):* Epistemology is first-personal. I access chance *through* my expectations of my future beliefs. If I can't trust my future self to track chance, PP is useless to me. Self-trust is the engine.
      *   *Professor's View (Chance First):* Future selves are only experts *because* they track chance/truth. If there were no objective norms (chance/truth), future beliefs would be arbitrary. Chance provides the *standard* for when RP applies.

  5.  **Develop the Argument/Verdict:**
      *   *Initial thought:* It's a tie? No, the prompt asks for a verdict.
      *   *Second thought:* Reflection is more fundamental *pragmatically*, but Chance is more fundamental *normatively*.
      *   *Stronger Position:* **Reflection is the more fundamental principle, but only because it subsumes the Principal Principle.** The PP is a special case of RP where the "future self" is replaced by an "idealized epistemic agent" (which chance represents).
      *   *Wait, let's flip it:* Actually, the standard view in formal epistemology (e.g., Briggs, Pettigrew) often treats PP as the norm and RP as a consistency constraint.
      *   *Better Position:* **The Principal Principle is the normative anchor; Reflection is a derived consistency constraint.** Why? Because RP fails without an external norm. If I know I will be irrational, RP doesn't apply. *Why* doesn't it apply? Because I won't be tracking the *truth/chance*. Therefore, the normativity of RP derives from the normativity of tracking the world (PP).
      *   *Refining the Position:* Actually, there's a stronger argument for **Reflection** being fundamental in a *Bayesian* framework. If you are a subjectivist, Chance is just a construct of your beliefs. But if you are a realist, Chance is external.
      *   *Decision:* I will argue that **Reflection is the more fundamental epistemic norm**, but not for the student's reason (self-trust). Rather, because PP *presupposes* a version of RP to get off the ground. To apply PP, you must believe your *current* self is correctly identifying the chance function. But more importantly, the "Undermining" fix for PP looks exactly like the "Irationality" fix for RP.
      *   *Wait, let's look at the "Tiebreaker" request.* The professor thinks Chance is real expert. Student thinks Future Self is real expert.
      *   *My Verdict:* **The Student is right (Reflection is more fundamental), but for a deeper reason than self-trust.** It's about the *structure of updating*. PP is a constraint on *initial* priors (or conditional beliefs), while RP is a constraint on *diachronic coherence*. You can have RP without PP (in a world without objective chance), but you cannot have PP without RP (because applying PP requires diachronic stability).
      *   *Actually, let's go with a Synthesis/Third Way:* Neither is fundamental. They are both instances of **Expert Deference**. But if forced to choose: **Reflection is more fundamental.** Why? Because the Principal Principle *reduces* to Reflection once we analyze what "chance" means to an agent. To an agent, chance is just that which their ideal future self would believe.
      *   *Counter-argument:* No, Chance is metaphysical.
      *   *Okay, let's settle on this:* **Reflection is the more fundamental *epistemic* principle, while PP is a *metaphysical* bridge.** Since the seminar is *Formal Epistemology*, the epistemic principle wins.
      *   *Wait, one more angle:* The "Undermining" problem vs. "Irrationality" problem.
          *   Undermining: Evidence $E$ makes $Ch$ unlikely.
          *   Irrationality: Evidence $E$ (wine) makes Future Belief unreliable.
          *   The fix for Undermining (New Principle): Conditionalize on $Ch \land E$ is bad. Conditionalize on $Ch$ being the *resilient* chance function.
          *   The fix for Irrationality: Conditionalize on Future Self being *rational*.
          *   Connection: Both require filtering the "expert" through a screen of *admissibility*.
      *   *Final Verdict Strategy:* I will argue that **Reflection is the more fundamental principle.** The Principal Principle is essentially an application of Reflection to a specific kind of "future self" (an idealized one informed by the objective structure of the world). The failure modes confirm this: the fix for PP (restricting admissible evidence) is parasitic on the logic of RP (restricting to rational future selves).

  6.  **Drafting the Response:**
      *   **Introduction:** Acknowledge the sophistication of the question. Validate the parallel.
      *   **Structural Comparison:** Formalize the parallel ($C(A|Expert(A)=x) = x$).
      *   **The Failure Modes:**
          *   PP: Undermining (Chance depends on history).
          *   RP: Akkrasia (Future self is compromised).
          *   Key Insight: Both failures arise when the "expert" status is contaminated by the conditioning evidence.
      *   **The Repairs:**
          *   PP: The "New Principle" (Hall/Thau). Restrict admissible evidence.
          *   RP: Restrict to "rational" future selves.
          *   Comparison: The PP fix *uses* RP logic. To fix PP, we must treat the chance function as a "future self" that won't be undermined.
      *   **The Verdict (The Core Argument):**
          *   Argue for **Reflection's Primacy**.
          *   Reason 1: **Scope.** RP applies in worlds without objective chance (deterministic or subjective). PP does not.
          *   Reason 2: **Derivation.** PP can be derived from RP + a theory of chance. (If I know $Ch(A)=x$, and I trust my future self to know the chances, then by RP I should believe $x$).
          *   Reason 3: **The Nature of the Fix.** The solution to the Undermining Problem (PP) relies on diachronic stability concepts central to RP.
      *   **Addressing the Professor's Intuition:** Why Chance *feels* fundamental. It provides the *truth-maker*. But epistemology is about the *access* to truth. RP governs access.
      *   **Conclusion:** Tell the professor to concede to the student, but refine the student's reasoning. It's not about "self-trust" per se, it's about diachronic coherence being the precondition for any expert deference.

  7.  **Refining the Tone:**
      *   Ensure it sounds like a colleague speaking to a colleague.
      *   Use formal notation where helpful but keep it readable.
      *   Avoid hedging too much ("Some say..."). Take the stand requested.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "porting over resources" part?
      *   *Yes:* I need to explicitly show how the "admissibility" fix in PP maps to the "rationality" fix in RP.
      *   *Check:* Did I give a verdict?
      *   *Yes:* Reflection is more fundamental.
      *   *Check:* Is the argument robust?
      *   *Critique:* Is it true PP can be derived from RP? Only if you assume the future self knows the chance. That's a big assumption.
      *   *Adjustment:* Frame it as: RP is the *general* form of expert deference. PP is a *specific* instance where the expert is "The World via Chance." You need the general form (RP) to make sense of the specific instance (PP). Without a principle telling you to align with experts (RP), PP is just an equation without normative force.

  9.  **Final Polish:** Check the flow. Ensure the distinction between "normative source" (Chance) and "epistemic rule" (Reflection) is clear. (This resolves the Prof vs. Student deadlock: Student wins on epistemic rules, Prof wins on metaphysical grounding, but since it's an epistemology seminar, Student wins the round).

  *(Self-Correction during final thought process)*: Wait, if I say Reflection is more fundamental, I need to be careful about the "foreseen irrationality" case. If RP is fundamental, why does it fail there? Because the principle includes a ceteris paribus clause about rationality. PP also has a ceteris paribus about admissibility. The structural identity is the key. I will argue that RP is the *template* for deference.

