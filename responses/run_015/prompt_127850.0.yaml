answer: |-
  This is a high-stakes, low-resource situation. You are right to be paranoid. Goodhart's Law isn't a theory here; it's a payroll issue.

  You asked for a procedure, not a lecture. Below is the **Impact Integrity Protocol**. It is designed to fit your 2–3 hour window.

  First, the swap. You identified **Negative-Space Metrics** ("no complaints," "no evictions") as dangerous. You are correct. They incentivize silence, not safety. Using them as a *goal* is toxic. I am swapping this for **The Denominator Lock**.
  *Why:* Your biggest risk isn't just faking outcomes (numerator); it's excluding the hard-to-serve people (denominator). If you control who counts as "enrolled," you control the success rate without helping anyone. This needs to be a formal step, not an afterthought.

  The other two ideas (**Gaming Surface** and **Shadow Measure**) are excellent. They stay.

  ***

  # The Impact Integrity Protocol

  **Timebox:** 120 Minutes max per metric.
  **Participants:** You + 1 Caseworker (rotating) + 1 Board/Finance rep (for sign-off only).
  **Output:** A Risk Rating and a Usage Category for the metric.

  ### Step 1: The Intent Statement (15 mins)
  Write one sentence: *"We measure [X] to prove that [Y] is happening for [Z type of participant]."*
  *   **Pass Criteria:** The sentence must name the *participant benefit*, not the org benefit.
      *   *Fail:* "To prove we delivered training."
      *   *Pass:* "To prove participants gained skills usable in the local market."
  *   **Values Handoff Point:** If the intent requires restricting access to services to protect the number, stop. This is a values call, not a metrics call. Escalate to Executive Director/Board.

  ### Step 2: The Denominator Lock (30 mins)
  Define exactly who enters the pool and who can leave it *before* an outcome is recorded.
  *   **Questions:**
      1.  At what exact moment does a person count as "enrolled"? (First signature? First day of class?)
      2.  What are the valid reasons to "pause" or "exit" someone before the outcome window closes?
      3.  Who has the authority to approve an exit?
  *   **Pass Criteria:** Exiting the denominator requires documentation *external* to the caseworker (e.g., participant written withdrawal, third-party verification of ineligibility). Caseworkers cannot unilaterally "pause" participants to protect bonus eligibility.
  *   **Risk Flag:** If >5% of participants are "paused" or "exited" in a month, trigger an audit.

  ### Step 3: The Gaming Surface (30 mins)
  Brainstorm the three cheapest ways to move the number without moving the intent.
  *   **Questions:**
      1.  How can a tired caseworker hit this number by helping the *easiest* person, not the *neediest*?
      2.  How can they fake the data without technically lying?
      3.  What happens to the participants who don't fit the metric?
  *   **Pass Criteria:** You must identify at least two specific gaming scenarios. If you can't think of any, you haven't thought hard enough.
      *   *Mitigation:* For each scenario, add one friction point (e.g., random audit, required upload of proof) that makes gaming more work than doing the actual job.

  ### Step 4: The Shadow Measure (30 mins)
  Select a slow, expensive, or qualitative check to run quarterly against the fast metric.
  *   **Questions:**
      1.  What data source is too annoying to fake? (e.g., tax records, direct employer calls, participant exit interviews by a *different* staff member).
      2.  If the Fast Metric goes up but the Shadow Measure stays flat, what is the threshold for alarm?
  *   **Pass Criteria:** The Shadow Measure must be independent of the staff member being evaluated.
      *   *Example:* Fast Metric = Job Placement. Shadow Measure = Random call to 10% of employers to confirm employment status.

  ### Step 5: Access & Frequency (15 mins)
  Define who sees the number and when.
  *   **Rule:** Staff see their *own* numbers monthly. Management sees *aggregate* numbers monthly. **Bonuses are calculated quarterly, not monthly.**
  *   **Why:** Monthly bonuses encourage short-term gaming (e.g., placing someone in a gig for 30 days). Quarterly smooths this.
  *   **Pass Criteria:** No real-time public dashboards for individual staff performance. This prevents "panic gaming" at the end of the month.

  ### Step 6: Risk Rating & Decision
  Assign a risk score based on the findings above.

  | Score | Meaning | Decision |
  | :--- | :--- | :--- |
  | **1** | Hard to game, high alignment. | **Pay & Publish.** |
  | **2** | Gameable, but mitigations work. | **Pay (with Shadow Measure).** |
  | **3** | Moderate risk of cream-skimming. | **Monitor Only.** (Do not tie to bonus). |
  | **4** | High risk of harm/exclusion. | **Drop or Redesign.** |
  | **5** | Toxic. Incentivizes abuse. | **Drop Immediately.** |

  **The Drop Point:** If the Risk Rating is **4 or 5**, the metric cannot be used for bonuses or public reporting. It may only be used for internal learning if the Shadow Measure is active.
  **The Category:** "Fine to learn from, dangerous to pay on" applies to any metric rated **3**.

  ***

  # What This Procedure Cannot Do
  Follow this perfectly and you can still get Goodharted. Here is where the holes are:
  1.  **Collusion:** If the caseworker and the employer (or participant) agree to fake data, the Shadow Measure often catches it, but not always.
  2.  **External Shocks:** A recession can tank your 90-day retention regardless of staff performance. This procedure doesn't fix external validity.
  3.  **The "Good Enough" Trap:** Staff may stop trying once they hit the bonus threshold (e.g., placing 5 people when they could place 6).
  4.  **Honesty in the Room:** This procedure relies on the staff member in Step 3 being honest about how they *could* game the system. If they fear punishment for admitting gaming vectors, they will lie. You need psychological safety for this to work.

  ***

  # Running the Protocol on Your Three Metrics

  ### Metric 1: Bonus for each participant still in a job 90 days after finishing.
  *   **Intent:** Prove sustainable employment, not just quick placement.
  *   **Denominator Lock:** "Enrolled" = Signed intake form. "Exited" = Only via written withdrawal or 3 missed weeks of contact. Caseworker cannot mark "not a good fit" without Director approval.
  *   **Gaming Surface:**
      1.  *Cream-skimming:* Only accepting kids who already have jobs/gigs.
      2.  *The Gig Loop:* Placing kids in 3-month contract roles that end right after the bonus triggers.
      3.  *Pressure:* Harassing employers to keep kids on payroll for 91 days then firing them.
  *   **Shadow Measure:** Random call to 20% of employers at day 100. Ask: "Do you intend to keep this person for another 3 months?"
  *   **Access/Frequency:** Staff see placements weekly. Bonus calculated Quarterly.
  *   **Risk Rating:** **3**.
  *   **Decision:** **Monitor Only / Learn from.**
  *   **Why:** The risk of cream-skimming (excluding the hardest to serve to protect the bonus) is too high for a small org with financial incentives. Use this for org-level funding reports, but do not tie individual bonuses to it. Tie bonuses to *activities* that lead to this (e.g., quality of resume, interview prep completed) instead.

  ### Metric 2: Training hours delivered.
  *   **Intent:** Prove we are providing value/education.
  *   **Denominator Lock:** "Enrolled" = Attended Day 1. (Prevents counting no-shows).
  *   **Gaming Surface:**
      1.  *Butts in Seats:* Keeping kids in the room watching movies to log hours.
      2.  *Pacing:* Slowing down curriculum to stretch 4 weeks into 6.
      3.  *Attendance Fraud:* Marking present for kids who left early.
  *   **Shadow Measure:** Participant quiz scores or skills demonstration pass-rates. If Hours go up but Pass-rates stay flat, hours are meaningless.
  *   **Access/Frequency:** Staff see hours weekly. Board sees monthly.
  *   **Risk Rating:** **4**.
  *   **Decision:** **Drop or Redesign.**
  *   **Why:** This is a classic vanity metric. It measures *cost to you*, not *value to them*. It incentivizes wasting participants' time.
  *   **Swap:** Replace with **"Skills Competencies Verified."** Count the number of participants who pass a specific skills test, not the hours they sat in a chair.

  ### Metric 3: "No participant becomes homeless during the program." (Contractual)
  *   **Intent:** Ensure stability.
  *   **Constraint:** You cannot delete this. You must manage the risk.
  *   **Denominator Lock:** Critical. If a participant hints at housing instability, you cannot "pause" them to avoid the stat. They must remain in the denominator until formally exited.
  *   **Gaming Surface:**
      1.  *Invisibility:* Telling participants "If you tell us you're homeless, we have to kick you out for safety/liability." (This hides the stat).
      2.  *Couch Surfing:* Defining "homeless" narrowly so sleeping on a friend's floor doesn't count.
      3.  *Early Exit:* Pushing unstable participants out of the program *before* they become homeless.
  *   **Shadow Measure:** Third-party exit interview (by you, not their caseworker). Ask: "Where did you sleep last night?" anonymously. Compare rate to reported rate.
  *   **Access/Frequency:** **Restricted.** Only you and the ED see the raw number. Staff see a binary "Alert" system (e.g., "Participant needs housing support") without it being tied to a penalty.
  *   **Risk Rating:** **5 (for bonuses), 2 (for compliance).**
  *   **Decision:** **Compliance Only. Never tie to bonus.**
  *   **Why:** Tying housing stability to a bonus is ethically toxic. It incentivizes staff to ignore warning signs or eject vulnerable kids.
  *   **Procedure Adjustment:** Since you must report this to the funder, you report the number. But internally, you treat it as a **Support Trigger**, not a Performance Target. If the number goes up, staff get *more resources*, not a bonus cut. If the number goes up and staff get punished, they will hide the homelessness. You must decouple the metric from punishment to get honest data.

  ### Summary Advice
  You are drowning because you are trying to solve a **trust problem** with a **math problem**.
  *   **Metric 1 (Jobs):** Too risky for individual bonuses. Use for org funding.
  *   **Metric 2 (Hours):** Delete. It measures your effort, not their gain.
  *   **Metric 3 (Homelessness):** Firewall this. It is for safety, not performance. If staff fear this number, participants will suffer in silence.

  Run the Protocol. If a metric scores a 3 or higher, have the courage to tell the Board: *"This metric pays us to fail the people who need us most."* Use the Gaming Surface step to show them exactly how that happens.
