answer: |-
  Use this procedure only when no valid surrogate exists and some evidence of patient values is available. Do not use when a valid advance directive exists or when evidence is entirely absent.

  **Procedure: Idealized Preference Reconstruction**

  1.  **Evidence Collection (Judgment: Team):** Gather all data. Priority order: 1) Written directives signed while capacitated; 2) Direct prior statements to clinicians; 3) Witnessed statements to family/friends; 4) Values inferred from life history (religion, hobbies, sacrifices). Discard hearsay older than five years unless corroborated.
  2.  **Distortion Filter (Judgment: Team):** License correction for factual ignorance (prognosis, treatment burden) and transient states (untreated depression, heavy sedation, sustained coercion). Forbid correction of stable core values (religious convictions, lifelong priorities regarding independence vs. longevity). If a preference stems from a core value, it is not distorted.
  3.  **Pooling Order (Judgment: Committee):** Pool all accounts first to identify inconsistencies, then apply idealization to the pooled narrative. Idealizing separately risks creating multiple fictional patients; pooling preserves the singular identity before smoothing contradictions.
  4.  **Reconstruction (Judgment: Team):** Formulate the choice the patient would make if fully informed and free of licensed distortions. Ask: "Does this choice align with their lifelong values, merely corrected for facts?"
  5.  **Hard Stop (Judgment: Risk Management):** If reconstruction requires altering a core value or overriding a valid written directive, stop. Revert to Best-Interests Standard. Document explicitly that the idealization drifted too far from the actual person to be attributed to them.
  6.  **Sign-off (Judgment: Attending/Risk):** Team drafts recommendation in plain language. Attending confirms medical feasibility. Risk Management confirms legal safety before charting.

  **Case Applications**

  **Case 1: 74-Year-Old Male, Dialysis**
  *   **Evidence:** Single remark at family dinner 10 years ago: "Rather die than hooked to a machine." No written directive.
  *   **Idealizations:** Correct factual ignorance (dialysis burden vs. survival benefit); correct transient state (remark made during alcohol-influenced dinner discussion).
  *   **Resulting Preference:** Trial of dialysis. The remark was reactive, not a settled value.
  *   **Confidence:** Low.
  *   **Sign-off:** Team, Attending, Risk.

  **Case 2: 29-Year-Old Female, Psychotic Break**
  *   **Evidence:** Pre-illness documented refusal of intubation. Clinicians believe refusal reflects specific fear (choking) she no longer holds due to illness-related worldview shift.
  *   **Idealizations:** Correct factual ignorance (intubation process); correct transient state (fear based on pre-illness misinformation, not core value).
  *   **Resulting Preference:** Intubation permitted. The refusal was based on correctable factual fear, not a core value against life-extension.
  *   **Confidence:** Moderate.
  *   **Sign-off:** Team, Attending, Risk.

  **Case 3: Patient with Written Refusal**
  *   **Evidence:** Written, witnessed, still-current refusal of low-burden intervention. Idealization suggests she would accept if fully informed.
  *   **Idealizations:** None licensed.
  *   **Resulting Preference:** Respect Refusal.
  *   **Confidence:** High.
  *   **Sign-off:** Team, Attending, Risk.
  *   **Note:** Hard Stop triggered. Overriding a valid written directive via hypothetical idealization undermines legal autonomy protections. The procedure refuses to reach the conclusion that she would consent.

  **Limitations and Systematic Misfires**

  This procedure cannot resolve deep value conflicts where evidence is equally split. It will systematically misfire when patients held values that were themselves based on misinformation they never corrected; the procedure treats those as core values to protect authenticity, potentially leading to outcomes the patient would have avoided if educated. It cannot adjudicate cases where the "idealized" self is fundamentally different from the "actual" self due to neurodegenerative change. Finally, it relies on the team's ability to distinguish core values from transient states; bias here will skew results toward clinician comfort. Risk Management must audit 10% of cases to ensure the Hard Stop is not being bypassed to facilitate treatment convenience. The procedure is a tool for reconstructing autonomy, not optimizing medical outcomes.
