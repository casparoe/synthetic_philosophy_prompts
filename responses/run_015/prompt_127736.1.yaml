answer: |-
  This is a fantastic puzzle. You have correctly identified that this sits firmly in the Gettier neighborhood, but by adding the layer of social aggregation (the committee) and independent faulty tracks (A and B), you have moved from classical individual epistemology into **Social Epistemology**.

  To answer your specific questions: No, there isn't one canonical proper name like "The Smith-Jones Case" for this exact stacked configuration. However, it is a recognized variant discussed under a few specific headings.

  Here is a breakdown of the concepts, the distinctions you asked for, and where this fits in the literature.

  ### 1. The Classification: Testimonial Gettier / Collective Gettier
  The scenario you described is best classified as a **Testimonial Gettier Case** within a **Collective Epistemology** framework.

  *   **Individual Level:** Detectives A and B are in standard Gettier situations. They have Justified True Belief (JTB), but the justification is disconnected from the truth-maker (the tape).
  *   **Collective Level:** The Committee forms a belief based on testimony. In epistemology, there is a debate about the **Transmission Principle**. The standard intuition (defended by philosophers like Jennifer Lackey) is that knowledge cannot be transmitted from a source that does not possess it. Since A and B do not *know* the suspect is guilty (they only have Gettierized belief), they cannot transmit knowledge to the Committee.

  The Committee's belief is therefore a **Second-Order Gettier Case**. They are not just lucky about the world; they are lucky about the testimony they received.

  ### 2. Is there a name for the "Stacked" Configuration?
  While there isn't a single famous noun for this, philosophers describe this structure using a few terms:

  **A. Epistemic Overdetermination (Faulty)**
  In causation, overdetermination means two causes are sufficient to bring about an effect. Here, you have two justifications sufficient to cause the belief, but both are epistemically "defective." This is sometimes discussed in the context of **Convergent Warrant**. Usually, convergent warrant is good (two independent reliable sources). Your case is **Convergent False Grounds**.

  **B. The "Consensus of the Blind" Problem**
  This isn't a formal technical term, but it is the heuristic often used in social epistemology (e.g., in the work of **Alvin Goldman** on veritistic social epistemology). It highlights that **independence of error does not equal reliability.** If two witnesses are independent but both hallucinating, their agreement adds zero epistemic weight. Your scenario is a formalization of this: independent corruption does not sum to justification.

  **C. Aggregated Gettierization**
  In the literature on **Group Knowledge** (e.g., **Kirk Ludwig**, **Margaret Gilbert**, or **Christian List & Philip Pettit**), this touches on the **Summative Account** of group belief. The Summative Account says a group believes $p$ if the members believe $p$. Your case challenges the idea that a group can "reason its way out" of individual Gettierization simply by pooling data. If the input data is Gettierized, the output is Gettierized.

  ### 3. Distinguishing from Testimonial Failure and Redundancy
  You asked how this differs from testimonial failure or ordinary redundancy. This is the crux of why your example is interesting.

  **Vs. Testimonial Failure:**
  *   **Testimonial Failure** usually implies the testifier is unreliable, lying, or mistaken in a way that leads to *falsehood*.
  *   **Your Case:** The testifiers are sincere and the conclusion is *true*. The failure is not in the truth of the proposition, but in the **connection** between the evidence and the truth. It is a failure of *warrant*, not a failure of *accuracy*.

  **Vs. Ordinary Redundancy:**
  *   **Ordinary Redundancy (Robustness):** In science, we want redundant measures (e.g., two different telescopes confirming a star). This works because the tracks are independent *and reliable*.
  *   **Your Case:** This is **Spurious Redundancy**. The tracks are independent, but they are not reliable. This distinguishes your case from a standard "multiple sources" justification. It proves that **corroboration requires independent *reliable* tracks, not just independent tracks.**

  ### 4. Why the "Stacking" Matters (The Philosophical Payoff)
  Your reading group is right to feel this is different from a single-agent Gettier. Here is why:

  In a single-agent Gettier (e.g., the stopped clock), the luck is localized. In your **Collective Stacked Gettier**, the luck is **systemic**.

  If the Committee assumes that "two independent reports constitute strong evidence," they are following a generally reliable heuristic. Your scenario shows that even robust social procedures (peer review, independent detective work, jury deliberation) can fail if the environment is "hostile" (the real criminal is planting evidence *and* manipulating alibis).

  This moves the discussion from **Individual Reliabilism** (is my brain working right?) to **Veritistic Social Epistemology** (is our social system truth-conducive?). Alvin Goldman calls this **Veritistic Value**. Your scenario demonstrates that a social system can have high apparent consensus and low veritistic value simultaneously.

  ### 5. Recommended Reading for the Group
  If you want to dig into the specific literature, look for these topics/authors:

  1.  **Jennifer Lackey on Testimonial Knowledge:** Specifically her work on whether a hearer can know something when the speaker does not. (Though your case is the inverse: the hearer doesn't know because the speaker doesn't).
  2.  **Alvin Goldman, *Knowledge in a Social World*:** Look for his discussions on how social procedures (like voting or adjudication) can fail due to environmental luck.
  3.  **The "No False Lemmas" Condition:** This is the classic patch for Gettier. Knowledge = JTB + No Essential False Premises. In your case, the Committee's premise is "A and B have good evidence." That premise is false. This explains *why* it fails without needing a new name.
  4.  **Endre Begby:** He writes on **Social Epistemology and Gettier Cases**, specifically regarding how prejudice or systemic error can create collective Gettier situations.

  ### Summary
  You haven't found a "new" Gettier, but you have constructed a **Social Gettier Case with Independent Faulty Grounds**.

  It distinguishes itself from ordinary redundancy by showing that **independence of source does not guarantee independence of error** (if the environment is manipulated). It distinguishes itself from testimonial failure because the testimony is sincere and the conclusion is true.

  The specific concept you are looking for is likely **Testimonial Transmission Failure** in a context of **Epistemic Overdetermination**. The "stacking" doesn't rescue the knowledge claim; it merely compounds the luck. Two wrongs don't make a right, even if they agree.
