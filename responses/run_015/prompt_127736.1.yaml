          *   *Goldman:* Reliabilism. A process of aggregating unreliable reports is unreliable.
          *   *Shieber:* Testimony and Gettier.
      *   **Refinement:** The specific twist here is *independent* errors. This prevents the "conspiracy" angle. It highlights that **consensus does not equal justification**.

  7.  **Drafting the Response:**
      *   *Intro:* Confirm it's a Gettier variant, specifically in Social Epistemology.
      *   *Terminology:* Mention "Collective Gettier," "Testimonial Gettier," and "Epistemic Overdetermination."
      *   *Analysis of the Committee:* The committee is the interesting agent. Their belief is JTB (in a loose sense) but fails the "no false lemmas" or "sensitivity/safety" conditions.
      *   *The "Two Bad Reasons" Problem:* Address whether independent false justifications sum to knowledge. (Consensus of the blind doesn't make sight).
