answer: |-
  You have hit on the exact nerve that makes Parfit's *Reasons and Persons* so famous (and controversial). You are very close to the answer in your last sentence: **you are mixing up Identity with Survival.**

  Parfit's entire project is to argue that we should stop caring about **Identity** and start caring about **Relation R** (Psychological Continuity and Connectedness).

  Here is the breakdown of why there is no contradiction, where the confusion lies, and why Parfit isn't sneaking physical uniqueness back in.

  ### 1. The Distinction: Identity vs. Relation R
  To understand Parfit's move, you have to separate two concepts that we usually glue together:
  *   **Personal Identity:** A logical, one-to-one relation. (If A = B and A = C, then B must = C. Since the Mars-copy and Venus-copy are two different people, the Original cannot be *identical* to both. Since there is no non-arbitrary way to pick just one, the Original is identical to **neither**.)
  *   **Relation R (What Matters):** Psychological continuity and connectedness with the right cause. This relation **can** be one-to-many.

  In the standard teletransporter case (1 input, 1 output), Identity and Relation R travel together. We assume Identity is what matters because it always comes bundled with Relation R.

  In the fission case (1 input, 3 outputs), the bundle is broken.
  *   **Identity:** Fails (because of logic, not physics).
  *   **Relation R:** Succeeds (between You and Mars, You and Earth, You and Venus).

  ### 2. Correcting the Premise: Does Parfit say "I don't survive"?
  This is the crux of your confusion. Parfit **does** say that strict *Identity* does not hold. However, he **does not** say that "survival" (in the sense of what we should care about) is absent.

  Parfit argues that when we ask, "Will I survive?", we are usually asking, "Will there be someone in the future who is psychologically continuous with me, and who will carry out my intentions?"

  In the fission case:
  *   **Mars-You** remembers your life.
  *   **Earth-You** remembers your life.
  *   **Venus-You** remembers your life.

  Parfit argues that **Relation R holds between you and all three.** Therefore, "what matters" is present. In fact, Parfit famously suggests that fission might be **better** than ordinary survival, because you get three lives instead of one.

  If you read Parfit as saying "I cease to exist, so it's like death," that is a misunderstanding. He says: "Strict identity ceases, but since identity isn't what matters, this is not like death."

  ### 3. Is there a "Hidden Tie-Breaker"?
  You asked: *"Is he sneaking physical uniqueness back in as a hidden tie-breaker?"*

  **No.** This is the most radical part of his view.
  Other philosophers (like Robert Nozick or David Lewis) try to save *Identity* in fission cases by adding a **"Non-Branching Clause."** They argue: "Psychological continuity counts as identity *only if* it is unique." If it branches, identity is lost.

  Parfit **rejects** the Non-Branching Clause for "What Matters."
  *   He agrees Identity is lost (because Identity *must* be one-to-one by definition).
  *   But he insists **Relation R matters even when it branches.**

  He is not using uniqueness as a tie-breaker for value. He is admitting that *Identity* requires uniqueness, but arguing that *Value* does not. He wants us to realize that we were wrong to value Identity in the first place.

  ### 4. The "Empty Question"
  Parfit pushes this further. He suggests that asking "Which one is *really* me?" is an **Empty Question**.

  There is no "further fact" of the matter. There is just the physical brain states and the psychological connections. Once you have described all the physical and psychological facts (i.e., "There are three people who remember being you"), there is nothing left to ask. Asking "But which one is the *real* me?" is like asking "Is the statue the same object as the clay?" when you've already agreed on all the physical properties. It's just a verbal dispute.

  ### 5. Summary: Resolving the Contradiction
  There is no contradiction in Parfit's view, provided you accept his separation of concepts:

  1.  **Logic:** Identity is one-to-one. Therefore, in fission, **Identity fails.** (You are not literally any of them).
  2.  **Value:** Psychological Continuity (Relation R) is what matters. In fission, **Relation R succeeds** (with all three).
  3.  **Conclusion:** You should not regret the loss of Identity, because you have gained Relation R.

  **So, to answer your specific doubts:**
  *   **"Shouldn't all three have 'what matters' with me?"**
      *   **Yes.** Parfit agrees completely. All three bear Relation R to you.
  *   **"Why does he say 'I don't survive'?"**
      *   He says "I don't survive" only if you define survival strictly as "Identity over time." But he argues we should change our definition. He would prefer to say: "I do not remain *one person*, but what matters continues in three people."
  *   **"Am I mixing up identity with survival?"**
      *   **Yes.** And Parfit's whole goal is to make you do exactly that. He wants you to realize that "Survival" (what we care about) is not the same thing as "Identity" (a logical tag).

  Parfit isn't sneaking physical uniqueness in; he is explicitly telling you to **stop looking for uniqueness.** The horror of fission is only a horror if you think Identity is what matters. If you agree with Parfit that Relation R is what matters, the fission case is a victory, not a death.
