answer: |-
  ### Rough Notes & Mediation Strategy

  *   **Objective:** Draft a joint statement that preserves the core philosophical commitments of both Generalists (CTs as a class are epistemically suspect) and Particularists (CTs are just empirical claims) without collapsing into triviality.
  *   **Tone:** Precise, adversarial but cooperative, no citations, no hedging.
  *   **Section 1 (Agreements):** Need to lock in the mechanics both accept.
      *   *Secrecy Math:* Both agree large conspiracies are harder to keep secret. Generalists use this for priors; Particularists use this for specific evidence assessment.
      *   *Contamination:* Both agree the evidence pool is poisoned by state/corporate actors. This validates Particularist caution about "official" denials and Generalist caution about "insider" claims.
      *   *Self-Sealing:* Both agree unfalsifiability is bad. Generalists say CTs do it more; Particularists say Official Stories do it too.
  *   **Section 2 (Disagreements):** Must avoid strawmanning.
      *   Generalist isn't saying "CTs are false." They are saying "The category warrants a prior probability penalty."
      *   Particularist isn't saying "Believe all CTs." They are saying "The category warrants no prior probability penalty."
      *   *Key friction:* Is the defect intrinsic to the *structure* of the theory (Gen) or contingent on the *evidence* available (Part)?
  *   **Section 3 (Cruxes):**
      *   *Vindication Audit:* Gen predicts true CTs were outliers that *should* have been doubted then. Part predicts true CTs would have passed neutral tests.
      *   *Bounty Institution:* Gen says structure still risky even with leaks. Part says environment was the problem; fix environment, fix distrust.
      *   *Decomposition:* Gen assesses the whole narrative (often wild). Part assesses the core claim (did X coordinate?).
      *   *Leakiness:* Gen says institutional checks warrant default trust. Part says that's status quo bias; institutions lie.
      *   *Acceptance:* Both must agree that if the empirical result goes one way, it forces a theoretical update.
  *   **Section 4 (Verbal vs. Substantive):**
      *   *Verbal:* The phrase "conspiracy theory" itself ( pejorative vs. neutral). The definition of "official" (state vs. consensus).
      *   *Substantive:* The validity of class-based priors. Whether structural features correlate with falsehood strongly enough to justify a heuristic.
  *   **Drafting Note:** Keep the language tight. Avoid "some philosophers argue." Use "We agree" and "We disagree." Ensure the word count lands in the 900-1200 range for the document proper.

  ***

  ### JOINT STATEMENT ON THE EPISTEMOLOGY OF CONSPIRACY ACCOUNTS

  **1. Agreed Claims on Mechanics**
  We affirm the following structural constraints on evaluating claims of covert coordination, irrespective of our disagreement on priors:

  1.  **Secrecy Sustainability:** The probability of successfully concealing a conspiracy decreases inversely with the number of required conspirators and the duration of required silence. A theory requiring hundreds of actors to remain silent for decades carries a higher burden of proof than one requiring few actors for a short duration.
  2.  **Information Contamination:** The public evidence pool regarding events of state or corporate interest is systematically contaminated. Interested parties plant both confirming and disconfirming material. Consequently, a rational evaluator's error rates are pushed up in both directions: false positives (believing planted evidence) and false negatives (dismissal of genuine leaks as noise) are equally probable risks.
  3.  **Structural Symmetry:** Self-sealing reasoning—whereby counter-evidence is reinterpreted as evidence of the plot's reach—is a formal defect detachable from content. While characteristic of many marginalized conspiracy accounts, this structure is not unique to them; official accounts may also exhibit immunizing strategies against contrary data.

  **2. Residual Disagreements**
  Our divergence lies not in the facts above, but in their epistemic weighting. We characterize our disagreement as follows:

  | Feature | Generalist Position | Particularist Position |
  | :--- | :--- | :--- |
  | **Class Priors** | The structural features common to conspiracy theories (opposition to official story, scaling secrecy) warrant a class-based prior probability penalty before specific evidence is weighed. | The label "conspiracy theory" is epistemically inert. Priors must be set solely by specific background evidence regarding the specific agents and events involved. |
  | **Burden of Proof** | The burden of proof shifts onto the proponent of a conspiracy account specifically because it opposes an institutional account backed by routine accountability mechanisms. | The burden of proof is symmetric. An institutional account warrants no default boost over a rival conspiracy account unless specific evidence of institutional reliability is produced. |
  | **Defect Source** | The epistemic defect is intrinsic to the *structure* of the narrative type (expansive, unfalsifiable). | The epistemic defect is contingent on the *evidence* available (or suppressed) in the specific case. |

  **3. Empirical Cruxes**
  We identify four empirical investigations where results would compel theoretical revision. We record our predictions below.

  *   **The Vindication Audit:** We reconstruct past conspiracy theories now accepted as true (e.g., COINTELPRO, Tuskegee) using only evidence available *at the time*.
      *   *Generalist Prediction:* Most would have failed the Secrecy Sustainability test at the time. Their vindication represents the acceptable error cost of a reliable heuristic.
      *   *Particularist Prediction:* Most would have passed neutral evidentiary tests if assessed without the class-based penalty.
      *   *Acceptance:* Both agree that if >80% of vindicated theories would have passed neutral tests, the Generalist heuristic is biased. If >80% would have failed, the Particularist must accept the heuristic's utility.

  *   **The Bounty Institution:** We model a regime where insiders have legal protection, payment, and automatic declassification schedules.
      *   *Generalist Prediction:* Distrust of conspiracy accounts remains high. The defect lies in the theory's structure, not just the information environment.
      *   *Particularist Prediction:* Distrust drops significantly. The defect was primarily the closed information environment.
      *   *Acceptance:* Both agree that if distrust remains unchanged in this regime, the Generalist is correct that the defect is structural.

  *   **The Decomposition Question:** We separate the "full narrative" (motives, scope, cover-up) from the "minimal mechanism" (Coordination Claim: Did Agent A and B coordinate on X?).
      *   *Generalist Prediction:* The Full Narrative is the proper object of assessment and carries the defect.
      *   *Particularist Prediction:* The Minimal Mechanism is the proper object of assessment and should be evaluated independently of the narrative flourishes.
      *   *Acceptance:* Both agree that if Minimal Mechanisms are frequently true while Full Narratives are false, the Particularist method is more truth-conducive.

  *   **Leakiness:** We assess whether an institution's internal accountability (rival factions, press access) warrants default trust.
      *   *Generalist Prediction:* Yes. Routine leaking provides a default boost to institutional accounts over rivals claiming total silence.
      *   *Particularist Prediction:* No. Treating this as a boost is deference to the status quo; rival factions often share interests in concealment.
      *   *Acceptance:* Both agree that if historical analysis shows rival factions routinely collude to suppress specific classes of truth, the Generalist's default boost is unjustified.

  **4. Verdict on Verbal vs. Substantive Disputes**
  A significant portion of our conflict is verbal, though it masks a substantive core.

  *   **Verbal:** The phrase "conspiracy theory" is contested. If the term is defined as "an unwarranted belief in a conspiracy," the Generalist wins by definition but says nothing substantive. If defined as "a claim that a conspiracy occurred," the Particularist wins the label but faces the Generalist's epistemic concerns. We agree to treat the phrase as neutral description for this workshop. Similarly, disputes over what counts as an "official story" (state pronouncement vs. scientific consensus) are sociological, not epistemological.
  *   **Substantive:** The core dispute is not about words, but about the validity of class-based priors. The Generalist claims structural features correlate with falsehood strongly enough to justify a heuristic penalty. The Particularist claims the correlation is too weak to override case-specific evidence. This is a factual dispute about the reliability of social heuristics, not a semantic one. We commit to resolving this via the Cruxes above, not by stipulating definitions.
