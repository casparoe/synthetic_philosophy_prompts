answer: |-
  # HANDOUT: The Special Composition Question (Decision Tree)
  **Reading Group:** [Name] | **Date:** [Date] | **Topic:** When do the *xs* compose a *y*?

  **Instructions:** Start at the top. Answer the concrete questions. Do not worry about the labels until you reach the bottom.

  ### PART I: THE META-ONTOLOGICAL SPLIT
  *(These two distinctions must be settled before asking about composition conditions.)*

  **Q1. Consider your left shoe and the Eiffel Tower. Is there a single object composed of exactly those two things?**
  *   **A. "It depends on how we use 'exists'."** (Existence is not a single, strict notion tracking fundamental reality.)
      *   ➔ **LEAF: Quantifier Variance / Deflationary Realism**
      *   *Awkward Commitment:* Ontological debates are merely verbal disputes about how to use quantifiers.
  *   **B. "Yes or No, regardless of how we talk."** (Existence is a substantive feature of the world.)
      *   ➔ **GO TO Q2**

  **Q2. Consider an ordinary claim: "There is a table." Is this sentence literally true?**
  *   **A. "No, it is strictly false."** (There are only simples arranged table-wise.)
      *   ➔ **GO TO Q2.1**
  *   **B. "Yes, it is literally true."** (Composite objects exist.)
      *   ➔ **GO TO Q3**

  **Q2.1. If "There is a table" is false, why do we say it?**
  *   **A. "We are mistaken; we should stop saying it."**
      *   ➔ **LEAF: Strict Nihilism (Error Theory)**
      *   *Awkward Commitment:* Almost everything you believe about the physical world is false.
  *   **B. "We are pretending; it is useful fiction."**
      *   ➔ **LEAF: Nihilism with Fictionalism**
      *   *Awkward Commitment:* We must systematically assert things we believe to be false to get through the day.

  ---

  ### PART II: THE COMPOSITION CONDITIONS
  *(For those who answered "Yes" to Q2: Composite objects exist. When?)*

  **Q3. Consider two books sitting next to each other on a shelf. Do they compose a third object?**
  *   **A. "Yes, always, for any *xs*."** (No restriction on composition.)
      *   ➔ **LEAF: Unrestricted Composition (Universalism)**
      *   *Note:* **Composition as Identity (CAI)** usually lands here (composition is literally identity), but CAI is a claim about *what* composition is, not *when*. **The tree cannot separate UC from CAI.**
      *   *Awkward Commitment:* There is an object composed of your nose and the Moon.
  *   **B. "No, not just because they are near."** (Composition is restricted.)
      *   ➔ **GO TO Q4**

  **Q4. Consider a chess set whose pieces are scattered on three different continents. Do they compose a single object?**
  *   **A. "No, composition requires contact or cohesion."**
      *   ➔ **LEAF: Moderate Restriction (Contact/Cohesion)**
      *   *Awkward Commitment:* Quantum mechanics suggests fundamental particles never truly "touch."
  *   **B. "No, but contact isn't the main issue."**
      *   ➔ **GO TO Q5**

  **Q5. Consider the members of a string quartet for exactly as long as they are playing. Do they compose an object?**
  *   **A. "No, only living organisms compose objects."**
      *   ➔ **LEAF: Organicism**
      *   *Awkward Commitment:* A corpse is not an object, but the living person is.
  *   **B. "No, only conscious subjects compose objects."**
      *   ➔ **LEAF: Conscious Composition** (See sidebar for details)
      *   *Awkward Commitment:* You cease to exist during dreamless sleep or general anesthesia.
  *   **C. "No, only the entire cosmos composes an object."**
      *   ➔ **LEAF: Priority Monism**
      *   *Awkward Commitment:* You and I are not distinct beings; only the Universe exists.
  *   **D. "Sometimes, but there is no general pattern."**
      *   ➔ **LEAF: Brutalism (Brute Fact)**
      *   *Awkward Commitment:* There is no explanation for why some sums exist and others do not.

  ---

  ### SIDEBAR: CONSCIOUS COMPOSITION
  **View:** The *xs* compose a *y* iff they jointly realize a single conscious subject.

  **Is this just Organicism?**
  No. Organicism ties existence to biological life; Conscious Composition ties it to phenomenology.
  *   **Test Case 1 (Separates from Organicism):** A human under general anesthesia.
      *   *Organicism:* Yes, composition occurs (organism exists).
      *   *Conscious:* No, composition ceases (no subject exists).
  *   **Test Case 2 (Separates from Organicism):** A distributed AI network realizing a mind.
      *   *Organicism:* No, not alive.
      *   *Conscious:* Yes, subject realized.

  **Most Awkward Commitment:** You go out of existence every night when you fall into deep sleep.

  ---

  ### APPENDIX: EMPTY CELLS & NOTES

  **Why are some cells empty?**
  1.  **"Ordinary claims true" + "Composition Never":** Incoherent. If composition never occurs, tables don't exist, so "There is a table" cannot be literally true.
  2.  **"Priority Monism" + "Unrestricted Composition":** Contradictory. Monism says *only one* thing exists; Universalism says *many* things exist.
  3.  **"Statue/Clay" Cases:** These are problems of *persistence* and *identity* (coincidence), not strictly composition. Universalists say both exist; Nihilists say neither exists. This tree focuses on *when* composition occurs, not *what happens after*.

  **Inseparable Views:**
  *   **Unrestricted Composition & Composition as Identity (CAI):** This tree tests *when* composition happens. CAI is a thesis about *what* composition is (identity). One can be a Universalist without accepting CAI, but CAI generally requires Universalism. They occupy the same leaf here.

  **Case Key:**
  *   *Shoe + Eiffel Tower:* Q1 (Variance vs. Substantive).
  *   *There is a table:* Q2 (Error Theory vs. Realism).
  *   *Two books on shelf:* Q3 (Universalism vs. Restriction).
  *   *Scattered Chess Set:* Q4 (Contact vs. Non-Contact).
  *   *String Quartet:* Q5 (Organic/Conscious vs. Other).
  *   *Statue/Clay:* (See Empty Cells).
  *   *Infinite Parts:* (Implicit in Universalism; some Restrictionists deny infinite divisibility).
