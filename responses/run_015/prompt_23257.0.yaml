answer: |-
  **Setting:** *A university seminar room, late afternoon. The whiteboard is covered in binomial trees and the equation $f^* = p - q/b$. Coffee cups are scattered on the table. The seminar has officially ended, but **Elena** (pro-Kelly/Ergodicity) and **Marcus** (pro-Expected Utility) are still standing by the board.*

  **Elena:** Look, the math is right there. With 199-to-1 odds and a 50% win rate, the expected value of betting your entire bankroll is astronomical. But if you bet all-in, you need to win 100 coin flips in a row. The probability is $0.5^{100}$. You will go broke. Virtually certainly.

  **Marcus:** I'm not arguing you should bet 100%. I'm arguing about *why* you shouldn't. You're presenting the Kelly criterion as a refutation of Expected Utility theory. It isn't. It's just Expected Utility with a logarithmic utility function.

  **Elena:** That's the surface-level objection, Marcus, and it misses the point. This isn't about risk aversion. It's about ergodicity. The ensemble average—the expectation operator EU relies on—assumes you can play the game in parallel universes. But we live in one universe, in time. The time-average growth rate is the only thing that physically matters for a single trajectory.

  **Marcus:** But a sequence of 100 bets *is* a single lottery ticket. When I evaluate it using Expected Utility, I'm not averaging over parallel selves; I'm averaging over the possible outcomes of that one ticket. If I use $U(w) = \log(w)$, I maximize the expected log of terminal wealth. By the Law of Large Numbers, the expected log of terminal wealth converges to the time-average growth rate. So, mathematically, they are identical.

  **Elena:** They converge asymptotically, sure. But the *justification* is different. You're saying, "Choose Log because you feel risk-averse." I'm saying, "Choose Log because anything else is physically unsustainable in a multiplicative dynamic." If you maximize linear utility (expected wealth), you bet everything and go to zero. That's not a preference; that's a calculation error regarding the nature of the system. EU theory treats the choice of Log as subjective. It's objective.

  **Marcus:** Is it? Let's test that objectivity. Suppose you have a debt of \$1 million due at round 50. If you follow strict Kelly, you maximize your long-term growth rate, but you might not have the liquidity to cover that debt. A pure EU maximizer can adjust their utility function to penalize wealth below \$1 million heavily. They might bet *less* than Kelly to ensure survival of that threshold.

  **Elena:** That's just changing the goalposts. We're talking about pure growth here.

  **Marcus:** No, we're talking about decision theory. You claim Ergodicity Economics replaces EU because EU focuses on the ensemble. But if I can modify my utility function to account for my specific constraints—like that debt, or a finite horizon of 100 rounds—then EU is more flexible than your "objective" time-average. Your time-average argument only works if the *only* thing you care about is the asymptotic growth rate. But why should I care about the asymptote if I'm dead at round 100?

  **Elena:** Because the asymptote dictates the typical behavior of the path *leading up* to round 100. If you deviate from Kelly, say you bet 80% instead of 50%, your expected wealth is higher, but the median wealth is lower. The "typical" path drags you down. The ensemble average is skewed by one-in-a-trillion outcomes where you win 100 heads in a row. EU with linear utility tells you to chase that miracle.

  **Marcus:** No EU theorist with a brain uses linear utility for multiplicative bets over 100 rounds. That's a straw man. The real question is: Does the time-average argument actually *refute* the expectation operator, or does it just justify Log utility? Here's my comeback: You say the ensemble average is "wrong" because it doesn't reflect the time average. But the time average of wealth *is* the ensemble average of log-wealth.
  *(Marcus taps the board)*
  $\lim_{N \to \infty} \frac{1}{N} \log(W_N) = E[\log(W_1)]$.
  When you maximize the time-average growth rate, you are *literally* maximizing the Expected Utility of Log Wealth. You haven't escaped the expectation operator, Elena. You've just moved the logarithm inside the expectation.

  **Elena:** I know the identity. But the *interpretation* matters. In standard EU, Log is a psychological curvature. In Ergodicity Economics, Log is a transformation that makes the process ergodic. It repairs the broken expectation operator.

  **Marcus:** Does it? Or does it just reveal that "maximizing growth" is itself a preference? If I offer you a choice: Option A is a guaranteed 5% growth rate. Option B is a volatile path with the same geometric mean but a higher arithmetic mean. A pure "time-average" maximizer should be indifferent, right? The long-run rate is the same.

  **Elena:** Ideally, yes. The volatility drag is accounted for in the geometric mean.

  **Marcus:** But you're not indifferent. If Option B has a chance of dipping below subsistence at round 50, you'd take Option A. That means you care about the *distribution* of wealth along the path, not just the asymptotic slope. That distribution is exactly what Expected Utility evaluates.
  Here's the genuine problem with your position: You claim EU is wrong because it averages over outcomes that won't happen (the huge wins). But when you maximize the time-average growth rate, you are implicitly averaging over the *log* of those outcomes. You're still weighting the outcomes. You're still integrating over the probability space.
  If you truly believed the ensemble average was meaningless, you couldn't use probability at all. But you do. You use $p=0.5$. So you accept the ensemble for probabilities, but reject it for payoffs. That's inconsistent.

  **Elena:** It's not inconsistent. It's about what variable is additive. Wealth isn't additive over time; log-wealth is. You need to maximize the additive quantity to use the expectation operator correctly.

  **Marcus:** Fine. But "maximize the additive quantity" is a *normative claim*. It's a utility function. You've derived Log utility from the physics of multiplicative dynamics, which is cool. But you haven't refuted EU. You've just provided a physical derivation for a specific $U(w)$.
  EU theory says: "Tell me what you value, and I'll tell you how to bet."
  You're saying: "You *must* value Log."
  But what if I value terminal wealth above a specific threshold more than I value growth? Say, I need \$10 million at round 100 to save a life, otherwise the utility is zero. Kelly might maximize the *rate*, but it might not maximize the *probability* of hitting that specific target. An EU maximizer can solve for that. Your ergodicity prescription cannot. It prescribes Kelly regardless of the target.

  **Elena:** If your target is arbitrary, then sure. But if we're talking about rational capital accumulation...

  **Marcus:** Then we're talking about preferences! And that's all EU is. A framework for consistent preferences. Your "objection" is that people often choose Linear Utility incorrectly. I agree! But that's a critique of *application*, not *theory*.
  The distinction between ensemble and time averages is real, but it's not a wedge to break EU. It's a tool to select the correct utility function for a specific environment. Once you select Log, the ensemble average of utility *equals* the time average of growth. The conflict vanishes. You're fighting a ghost.

  **Elena:** *(Pauses, looking at the board)* So you're saying Ergodicity Economics is just a subset of EU? A justification for Log?

  **Marcus:** I'm saying it's a powerful justification for Log, yes. But you claimed it was a *replacement* for Expected Utility. It isn't. Because the moment you admit that a person might rationally choose *not* to maximize growth—say, to avoid a specific ruin threshold—you have to fall back on a general utility function. And once you're back there, you're doing EU.
  You wanted to say EU is wrong because it ignores time. But EU with Log utility *respects* time exactly as much as your time-average does. So EU isn't wrong. It's just broader.

  **Elena:** *(Sighs, uncapping her pen)* So the "refutation" is actually just... a derivation of the utility function?

  **Marcus:** Exactly. You haven't broken the engine, Elena. You've just found a really good reason to use a specific fuel. But don't tell me the engine is trash just because some people put diesel in it.

  **Elena:** *(Smiles faintly)* Fine. But I'm still betting 50%.

  **Marcus:** And I'll calculate the optimal fraction for my specific utility function. Which, coincidentally, will probably be very close to 50%.

  **Elena:** See? Ergodicity works.

  **Marcus:** No. Rationality works.

  *(They both laugh, finally turning to wipe the whiteboard.)*
