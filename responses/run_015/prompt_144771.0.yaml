  Each branch must be labeled by the precise claim that separates it from its siblings. Each leaf should carry: the name of the position if one exists in the literature or in logical space, otherwise "unnamed"; a single sentence stating its most awkward commitment; and, for any unoccupied combination of answers, a brief diagnosis of whether the vacancy is due to incoherence, unattractiveness, or mere neglect. The named positions that must appear as leaves are: the technological-superintelligence singleton; the pluralist anti-singleton (value divergence makes convergence impossible); the local causal-horizon singleton (authority expires at the boundary of causal contact); and the critical-point singleton (stability via accommodated variance). Where two named positions fall on the same leaf, flag them explicitly rather than merging them.

