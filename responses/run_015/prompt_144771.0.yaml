  **Genuinely Contested Interpretations:**
  *   **Quantum Branching:** It is contested whether decoherent branches in the Many-Worlds Interpretation constitute separate "singletons" (Branch 2/4/6/8 etc.) or if a wavefunction-level controller counts as one trans-branch singleton (Branch 1/3/9/11 etc.). There is no consensus on whether authority can supervene on the multiverse.
  *   **Thermodynamic Analogy:** The mapping of governance stability to entropy (Low-Entropy Suppression vs. High-Entropy Accommodation) is a heuristic borrowed from condensed matter. Specialists dispute whether social "entropy" is more than a metaphor or if governance systems truly exhibit phase transitions analogous to physical critical points.
  *   **Normative Convergence Strength:** It is highly contested whether rational agents, absent computational coercion, would ever converge on a single charter (Right Branch Split 1). Many argue value divergence is intrinsic to rationality, rendering the entire Normative Convergence branch (Right Side) physically empty save for the Anti-Singleton position.
  *   **Causal Horizons:** Whether a singleton's authority "expires" at the cosmological event horizon (Branch 2/4/6/8 etc.) or whether "authority" is a logical relation independent of causal contact (Branch 1/3/5/7 etc.) remains unresolved in cosmological ontology.
