answer: |-
  To solve the problem of the Historical Jesus, a methodological framework must do more than list tools like "multiple attestation" or "criterion of embarrassment." It must establish a set of desiderata—necessary conditions that any claim about Jesus must satisfy to be considered historically viable. The core epistemological problem is that every source we possess is post-Easter, confessional, and theological. Therefore, the criteria must not pretend to extract neutral biography from confessional testimony but must explain how the testimony relates to the pre-Easter reality. The following five desiderata specify what an adequate set of criteria must deliver.

  **1. Confessional Source Integrity**
  *   **The Requirement:** The method must explicitly model the Gospels as theological documents written by believers for believers, not as neutral biographies or transcript records. Any criterion used must account for the fact that the authors' primary goal was proclamation, not preservation.
  *   **Motivating Case:** Traditional approaches often treat the Gospels as containers where history is mixed with legend, assuming we can simply sieve out the legend. This fails because the "legend" (theological interpretation) is the very lens through which the history is remembered. A saying might be historically authentic *because* it served a theological purpose, not despite it.
  *   **Status:** Non-negotiable. Ignoring the confessional nature of the sources assumes a genre of ancient literature that did not exist.

  **2. Contextual Plausibility (Jewish and Galilean)**
  *   **The Requirement:** Any authentic saying or deed must be intelligible within first-century Second Temple Judaism and specifically within the social dynamics of Roman Galilee. Crucially, this requires distinguishing between "not invented by the early church" and "totally alien to 1st-century Judaism."
  *   **Motivating Case:** The old Criterion of Dissimilarity often pushed scholars to find a Jesus who was unique compared to his Jewish peers. This creates a historical monster: a Jew who thought and acted like neither a Jew nor a Christian. An adequate method must demand that Jesus be plausible as a Jew first. This includes consistency with Galilean social dynamics (e.g., peasant agrarianism, honor-shame culture, purity boundaries) rather than treating him as a cosmopolitan philosopher dropped into a village setting.
  *   **Status:** Non-negotiable. A Jesus who does not fit his context is a fabrication, regardless of how many sources mention him.

  **3. The Eschatological Noise Floor**
  *   **The Requirement:** The method must not filter out apocalyptic or end-times language simply because it sounds "weird" to modern sensibilities or resembles later Christian theology. Since apocalyptic expectation was the baseline noise of the environment, removing it risks deleting the signal.
  *   **Motivating Case:** Many modern portraits sanitize Jesus into a wisdom teacher or social revolutionary because apocalypticism feels embarrassing or irrational. However, if the historical context was saturated with apocalyptic hope, a Jesus who *lacked* this language would be the anomaly. Criteria that prioritize "reasonable" moral teaching over "weird" end-times warnings systematically bias the result against the most probable historical reality.
  *   **Status:** Non-negotiable (given the current consensus on Second Temple Judaism). Ignoring this creates a Jesus who is psychologically implausible for his time.

  **4. Counterfactual Stability**
  *   **The Requirement:** The historical portrait produced must not rely on a fragile combination of sources that would collapse if a new non-canonical fragment were discovered tomorrow. The conclusion should be robust against minor shifts in the source data.
  *   **Motivating Case:** Some theories rest entirely on the independence of Q and Thomas, or the primacy of Mark. If a new fragment showed dependence where independence was assumed, the whole reconstruction flips. A robust method relies on broad structural patterns in the tradition rather than precise source-critical arrangements that are perpetually debated.
  *   **Status:** Camp Preference (Methodological Rigor). While ideal, some historical arguments are inherently fragile. However, for a solution to "settle" the question, stability is required.

  **5. Causal Sufficiency**
  *   **The Requirement:** The reconstructed Jesus must be sufficient to explain the rise of the early Christian movement, specifically the shift from a crucified messiah to a resurrected Lord worshipped by Gentiles.
  *   **Motivating Case:** If the historical Jesus was merely a wisdom teacher, the resurrection belief is unexplained. If he was merely a political revolutionary, the non-violent Gentile mission is unexplained. The historical figure must provide the causal energy that launched the specific movement we see in the evidence, not just a figure who *could* have existed.
  *   **Status:** Non-negotiable. History is about cause and effect; a Jesus who does not explain the Church is historically inert.

  **The Jointly Unsatisfiable Subset**
  You are correct to suspect a contradiction between **Rigorous Multiple Attestation** and **Full Dissimilarity from Church Theology**. These two cannot be simultaneously satisfied as primary filters. Multiple attestation relies on independent sources (e.g., Mark, Q, Paul, John). However, all these sources are Christian confessional documents. If a tradition appears in all of them, it is because it was *important* to the early Church. The Criterion of Dissimilarity, conversely, argues that material is authentic only if the Church *would not* have invented it. Therefore, anything strongly attested is likely important to the Church, and anything important to the Church fails dissimilarity. Demanding both leads to a null set: you are left with only obscure, singly-attested sayings that the Church didn't care about, which violates Causal Sufficiency. You must choose either attestation (accepting church influence) or dissimilarity (accepting historical isolation), but you cannot demand both as strict necessary conditions.

  **The Knockout Desideratum**
  The single desideratum that knocks out the most popular theories is **Contextual Plausibility (specifically the rejection of strong dissimilarity)**. This requirement eliminates the "Jesus as Unique Moral Genius" model (popular in liberal theology and the Jesus Seminar) because it insists Jesus must look like a Jew, not a modern humanist. Simultaneously, it eliminates the "Jesus as Divine Incarnate" model (popular in conservative theology) because it insists Jesus must be intelligible within human social dynamics, not just theological dogma. It forces the historical Jesus into the narrow corridor of being a 1st-century Jewish agent, which collapses the majority of portraits that project later values backward.

  Bottom line: Any method that treats the Gospels as neutral biographies or demands Jesus be unique among Jews is epistemologically broken and must be discarded.
