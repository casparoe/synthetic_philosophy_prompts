      *   **FDT (Functional Decision Theory):** Treats the decision as an output of a function. If Death simulates me, my decision procedure correlates with his prediction. FDT usually aligns with EDT in Newcomb-like problems but handles logical correlation better. Here, since Death predicts based on "what you actually end up doing," FDT would likely recognize the correlation between the decision algorithm and the prediction. FDT would likely say **Run** (like EDT) because choosing the "Run" algorithm correlates with survival in this specific dataset.
