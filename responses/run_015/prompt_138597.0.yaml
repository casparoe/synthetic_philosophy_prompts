answer: |-
  I knew the cornered bite of wood, the cube,
  And how the round one rolled, that solid sphere,
  Before this linen fell away from hand.
  They say the brain will teach the waiting eye,
  That sight is nothing but a distant touch,
  A sudden flooding of the mind with light.

  But nothing here resembles solid light,
  No edges bite like those upon the cube,
  I cannot reach across the air to touch.
  Which flatness holds the weight of my old sphere?
  The optic nerve is not a probing eye,
  It hangs unused, a fist without a hand.

  I keep my fingers curled inside my hand,
  Afraid to break this surface made of light.
  The surgeon waits to test the new-born eye,
  To ask me where the shadow marks the cube,
  Or where the gradient curves into a sphere,
  Before I'm allowed to confirm by touch.

  There is no friction here, no grain of touch,
  Only a burning pressure on the hand
  That tells me nothing of the rolling sphere.
  These colors do not cast a weight of light,
  I cannot trace the outline of the cube,
  Or calibrate the distance with an eye.

  I strain the muscle of this wet, new eye,
  Hoping for friction, some resistance, touch,
  To map the shadowed side against the cube.
  My fingers twitch, betraying the idle hand,
  Wanting to break this silence of the light.
  Is that the one I used to call a sphere?

  But wait, there is a third shape near the sphere,
  A jagged thing I never held. The eye
  Stumbles upon it in the heavy light.
  I have no memory of such a touch,
  No name to lay upon it with my hand,
  And now I doubt I ever knew the cube.

  No memory of such a touch to guide the hand,
  The eye dissolves within the common light,
  I hesitate between the sphere and cube.
