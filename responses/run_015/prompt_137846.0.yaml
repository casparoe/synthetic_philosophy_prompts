      *(Self-Correction on Sentence 5 of Summary)*: The summary says "explains more of the data." This is the critical failure point. Lakatos requires *novel* facts, not just *more* accommodation. This is where the friend's attack gains traction. I need to highlight this.

      *(Self-Correction on Sentence 9)*: "Only historians looking back can say." This is the strongest version of the "retrospective" critique. Lakatos wanted MSRP to be a rational reconstruction tool for scientists *in situ*, though he admitted history is the ultimate court of appeal. I need to nuance this.

