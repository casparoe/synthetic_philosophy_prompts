answer: |-
  Here is the translation of Typogenetics into your vocabulary, followed by the structural audit and the residue report.

  ### 1. Restatement: Staging, Binding Times, and the Compilation Boundary

  In your terms, Typogenetics is a **two-level staged system** with a rigid binding-time separation enforced by the meta-system.

  *   **The Strand:** This is **quoted code** (`[code]`). It is data at Stage 0, but it represents a program at Stage 1. Crucially, it is *passive* data until acted upon by the translation mechanism.
  *   **The Translation Table:** This is the **Compiler Front-End**. It is a static, external artifact. It is not representable within the language of strands. It is the "physics" of the system.
  *   **The Enzyme:** This is the **Residual Program** (Stage 1 code). It is the result of compiling the Strand. It consists of primitive operations (cut, copy, move) provided by the runtime environment.
  *   **The Editing Rules:** This is the **Runtime/OS**. It provides the semantics for the Enzyme's opcodes.
  *   **The Process:**
      1.  **Compile-Time:** `compile(Strand) → Enzyme`. This is a deterministic mapping defined by the table.
      2.  **Run-Time:** `run(Enzyme, Target_Strand) → Modified_Strand`.

  **The Staging Anomaly:**
  You suspected the translation is both compile-time and run-time. In PL terms, this is a **online partial evaluation** scenario where the "static input" is the Strand itself.
  *   Normally, compilation happens once, deployment happens later.
  *   In Typogenetics, the compilation happens *in situ*. The Strand exists in the memory of the runtime. The system invokes the compiler *on* the live data to generate a transient executable (Enzyme), which immediately executes against that same data (or a copy).
  *   **Binding-Time Error:** The system conflates the *description* of the computation (Strand) with the *input* to the computation (Target Strand). When an enzyme acts on its own source strand, you have a scenario where `run(compile(S), S)` occurs.

  **The Critical Limitation:** The Compiler (Translation Table) is **not reifiable**. You cannot write a Strand that *is* a translation table. You cannot write an Enzyme that *compiles* a Strand. The `compile` function is a primitive of the meta-language, not the object language.

  ### 2. The Isomorphism Claim: Structure and Wreckage

  Hofstadter's claim that this is "the same phenomenon as Gödel numbering" is rhetorically potent but structurally false in the sense you require for metaprogramming.

  **Gödel Numbering vs. Typogenetic Translation:**
  *   **Gödel:** A bijection (effectively). Every formula has a unique number; every number decodes to a unique formula (or nonsense). `encode` and `decode` are inverses. This supports **Reflection**: you can reason *about* formula $X$ by reasoning *about* number $n$.
  *   **Typogenetics:** A **surjection** with no section.
      *   Many Strands map to the same Enzyme (due to "junk" triplets, stop codons truncating the tail, or synonymous codons if the table allowed).
      *   **No Inverse:** There is no `reflect(Enzyme) → Strand`. Once compiled, the source structure is lost (lossy compilation). You cannot reconstruct the DNA from the Protein. This is the Central Dogma hard-coded into the toy.

  **The Structure:**
  It is not an isomorphism. It is not even an adjunction in the category-theoretic sense, because there is no right adjoint to the translation functor. It is a **one-way embedding** of the Strand space into the Enzyme space.

  **What is missing for an Isomorphism?**
  To earn the word "isomorphism" in your vocabulary, you need a `quote` operator that takes an Enzyme and returns a Strand such that `compile(quote(E)) ≡ E`.
  *   **In the Toy:** Nothing implements this.
  *   **In the Cell:** Reverse Transcriptase (in retroviruses) implements a partial inverse, but it maps RNA to DNA, not Protein to DNA. The dogma holds: Protein $\nrightarrow$ DNA.
  *   **In PL:** This is `reify`. Without `reify`, you cannot implement the **Recursion Theorem** as a programmer's tool. You can have fixed points (via diagonalization), but you cannot *construct* them by manipulating your own source code at runtime, because you cannot access your own source code from within the executable.

  **Verdict:** Hofstadter is using "isomorphism" to mean "structural analogy regarding self-reference capability," not mathematical invertibility. The "double life" (string as data and string as code) exists, but the bridge is one-way. The wreckage is **reflection**. You have **reification** (Strand $\to$ Enzyme) but no **reflection** (Enzyme $\to$ Strand).

  ### 3. Residue Report: Gödel vs. Quine vs. Von Neumann

  You are correct to suspect three distinct phenomena are being conflated. Here is the separation in your vocabulary:

  1.  **Gödelian Self-Reference (Semantic):**
      *   *PL Equivalent:* A program that asserts its own unprovability or truth value. Requires a semantics layer (model theory).
      *   *Typogenetics:* **Absent.** Strands have no truth value. Enzymes have effects, not truth conditions. There is no logic layer, only a transformation layer.
  2.  **Quine / Futamura (Syntactic/Total):**
      *   *PL Equivalent:* `prog` such that `run(prog) = source(prog)`. Requires `quote` to access source.
      *   *Typogenetics:* **Unattainable in strict form.** An Enzyme cannot output the Strand that created it, because the Enzyme cannot "see" the Strand's sequence unless it is given it as data. If an Enzyme copies the Strand it acts on, it is copying *data*, not emitting *source*. To be a Quine, the Enzyme would need to output a *new* Strand identical to its own creator. This requires the Enzyme to contain the data of the Strand (which it doesn't; it contains the *instructions* derived from it).
  3.  **Von Neumann Self-Reproduction (Constructive/Dual-Use):**
      *   *PL Equivalent:* A system where a description $D$ is used in two modes: **Active** (`compile(D) → Exec`) and **Passive** (`copy(D) → D'`). The Exec then constructs a new $D'$ using the copy.
      *   *Typogenetics:* **Achieved.** This is the core of the chapter. The Strand is interpreted (to make Enzyme) and copied (by Enzyme). The Enzyme then builds a new Strand using the copy.

  **Boundary Cases in Your Vocabulary:**
  *   **Quine without Reproduction:** A program that prints its source but doesn't build a new executable file. (Typogenetics cannot do this; output is strand modification, not printing).
  *   **Reproduction without Quine:** A compiler that compiles itself but doesn't output its own source text, only the binary. (Typogenetics does this: Strand $\to$ Enzyme $\to$ New Strand).
  *   **Gödel without Reproduction:** A static analysis tool that proves properties about itself. (Typogenetics has no analysis layer).

  **The Missing Interpreter:**
  Your hunch is correct. **Nothing in Typogenetics corresponds to an interpreter *inside* the system.**
  *   The Translation Table is the interpreter, and it is **external**.
  *   In PL terms, Typogenetics is like having a CPU where the instruction set architecture (ISA) is hardwired in silicon. You can write programs (Strands) that configure the CPU (Enzymes), but you cannot write a program that *changes the ISA* or *simulates the ISA* efficiently within the ISA.
  *   **Limitation:** This is a fault in the **toy**, not your vocabulary. It prevents Turing Completeness at the Strand level. Strands are not Turing-complete; they are configuration bitstreams for a fixed automaton. You cannot write a Strand that interprets other Strands *as Strands*. You can only write a Strand that translates to an Enzyme that edits Strands *as data*. The distinction is subtle but vital: the semantics of "Strand-as-Code" are not accessible to the Enzyme.

  ### 4. Concrete Artefact: What is a Self-Reproducing Strand?

  A self-reproducing strand in Typogenetics is **not a Quine**.
  A Quine is: `print(source_code)`.
  A Self-Reproducing Strand is: `copy(self)`.

  In your world, the closest artefact is **the source code of a self-hosting compiler combined with its build script**, or more precisely, a **Von Neumann Constructor**.

  *   **Artefact:** A **Staged Program** where Stage 0 is the Strand.
  *   **Mechanism:**
      1.  Stage 0 (Strand) is passed to the Compiler (Translation Table).
      2.  Produces Stage 1 (Enzyme).
      3.  Stage 1 executes. It has access to Stage 0 as *data*.
      4.  Stage 1 invokes a `copy` primitive on Stage 0.
      5.  Stage 1 attaches the copy to a new location.
  *   **Attainability:** This is **attainable** in Hofstadter's system *if* the enzyme instruction set includes "copy strand" and "append". Hofstadter designs the ops to allow this.
  *   **Distinction:** A Quine requires the program to *know* its own text syntactically (`quote`). A Von Neumann constructor requires the system to *handle* the text physically/structurally (`copy`). Typogenetics supports the latter, not the former.

  **Summary of Wreckage:**
  1.  **No Reflection:** You cannot go Enzyme $\to$ Strand. The Recursion Theorem holds existentially (fixed points exist) but not constructively (you can't write them using `quote`).
  2.  **No Internal Semantics:** You cannot write a Strand interpreter in Strands. The semantics are meta-system locked.
  3.  **No Truth:** There is no logical layer, only operational. Gödel's incompleteness does not map, only Kleene's recursion.
  4.  **Isomorphism is Rhetoric:** It is a surjective homomorphism from Data to Code, not an isomorphism.

  Hofstadter's insight is that **dual-use data** (passive template / active instructions) is sufficient for self-reproduction without needing the stronger **dual-access data** (readable as text / executable as code) required for Quines or Gödelian logic. He trades logical expressiveness for constructive viability.
