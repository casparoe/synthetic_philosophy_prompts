answer: |-
  Here is the case for why the distinction between therapy and enhancement collapses, grounded in the reasoning you asked for.

  **1. "Normal" is a drawing, not a discovery**
  The strongest argument for separating therapy from enhancement relies on the idea that there is a biological state called "normal functioning" that exists in nature, waiting to be found. Therapy restores this state; enhancement goes beyond it.

  But biologically, "normal" doesn't exist. There is only variation. If you measure memory, attention, or mood across a population, you get a bell curve. There is no bright line where "disorder" ends and "health" begins. The line we draw is statistical and social. We decide that the bottom 5% or 10% constitutes a "deficit" requiring repair, and everything above that is "normal."

  If that line is arbitrary, then the distinction between fixing a deficit and boosting a trait is also arbitrary. Imagine a drug that raises everyone's working memory by 20%. For someone in the bottom 10%, we call it therapy. For someone in the top 10%, we call it enhancement. But the drug is identical, the biological mechanism is identical, and the outcome (a better brain) is identical. The only thing that changed was where we decided to draw the line on the graph. If "normal" is just a statistical artifact, then therapy is just enhancement for people who started below the arbitrary cutoff.

  **2. The myth of restoration**
  Therapy markets itself as "restoration." It claims to return you to a previous, natural baseline. But this is rarely what actually happens. When you treat a chronic condition, you aren't usually returning to a pre-existing state of perfect health; you are establishing a *new* state of functioning that didn't exist before.

  Consider someone with chronic depression. If medication lifts their mood to a point where they can function, they haven't necessarily returned to a "natural" baseline they had before. They have entered a chemically supported state of well-being that is arguably an *improvement* over their natural, unmedicated baseline.

  If healing is actually about creating a new, better state rather than returning to an old one, then therapy is functionally the same as enhancement. Both are interventions designed to move you from a less desirable state to a more desirable one. The label "therapy" is just a story we tell to make the intervention sound like we are fixing a broken object, rather than upgrading a living system.

  **3. The body as a self-authored project**
  The traditional view sees the body as a given—a fixed piece of machinery that we should only repair when it breaks. But a more modern, grounded view sees the body as a project. We are constantly intervening in our own biology to shape who we are.

  You likely already engage in "enhancement" daily. You drink caffeine to push your cognitive performance beyond its resting state. You exercise to force your muscles and heart to exceed their default capacity. You study to physically alter your neural pathways. We don't view these as violations of nature; we view them as self-authorship.

  If you accept that you are the author of your own capacities, then the method of intervention matters less than the intent. Whether you use a tutor, a gym, or a pharmaceutical compound, you are engaging in the same act: modifying your biology to better fit your goals. To say that a pill is "enhancement" (and therefore ethically suspect) while a tutor is "education" (and therefore virtuous) is to fetishize the tool rather than the outcome. If the body is a project, then using a study drug to improve cognitive function is just another form of tuning the instrument.

  **4. Therapy is just enhancement with better PR**
  The reason we cling to the distinction is largely political and rhetorical. "Therapy" sounds like justice; "Enhancement" sounds like cheating.

  Therapy appeals to our sense of fairness: "This person has a bad hand, let's deal them a new one." Enhancement triggers our fear of inequality: "This person has a good hand, why are you giving them more cards?"

  But if you look at the mechanism, both are attempts to improve human capability. Therapy gets better PR because it frames the intervention as a return to the status quo, which feels safe. Enhancement is framed as disrupting the status quo, which feels risky. But if the status quo ("normal functioning") is just a statistical average we made up, then "restoring" it is no more natural than "improving" it. Both are acts of will upon the body.

  **The Bottom Line**
  If you view "normal" as a statistical line we drew on a map, and you view your body as a project you are building rather than a house you are maintaining, the boundary dissolves. Signing up for the study isn't fundamentally different from choosing to treat a condition; it is simply choosing to intervene in your neurochemistry to produce a state you prefer. The label "therapy" or "enhancement" tells you more about social norms than it does about biology.
