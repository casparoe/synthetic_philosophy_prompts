  2.  **Deconstruct Kierkegaard's Critique:**
      *   What does Kierkegaard actually hate about "the public" (*Publikum*) and "the press" (*Pressen*)?
      *   *Key Concept:* The Public is an abstraction. It's a "phantom." It removes responsibility. In a crowd, no one is accountable.
      *   *Key Concept:* The Press facilitates "gossip" and "leveling" (*Nivellering*). It turns truth into opinion and individuals into numbers.
      *   *Key Concept:* Direct communication to a crowd assumes the crowd can decide truth. Kierkegaard thinks truth is subjective/individual before God.

  3.  **Deconstruct Kierkegaard's Method:**
