prompt: |-
  I was trying to explain Kierkegaard's complaints about the press and 'the public' to a friend, and I got the impression that he basically thought public life is always corrupting, so any attempt to speak to a crowd is a sellout. My friend said that makes him sound like an early anti-social-media guy, but then I noticed Kierkegaard spent a lot of energy writing in newspapers, using pseudonyms, and trying to influence how people read each other. That feels like he's using the exact thing he hates.

  I cant tell if his position is just that he hates the press but still thinks you have to use it, or if there's a more subtle idea where the 'public' isn't one thing and you can communicate indirectly without flattening the individual into a crowd. I'm not looking for a biography or a list of his pseudonyms, just the conceptual move that makes this not just hypocrisy.
