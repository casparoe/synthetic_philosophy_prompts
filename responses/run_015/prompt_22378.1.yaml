      *   Why pseudonyms? To prevent "authority" from being the focus. To force the reader to relate to the *idea*, not the *author*.
      *   *Key Concept:* Indirect Communication. You don't tell people what to think; you create a situation where they must choose for themselves.
      *   *Key Concept:* The Single Individual (*Den Enkelte*). His target audience is never "the public," but the individual *within* the public.

  4.  **Synthesize the "Conceptual Move":**
      *   The move is the distinction between **Direct Communication to a Crowd** vs. **Indirect Communication to the Single Individual.**
      *   It's not about the *medium* (newspaper vs. book vs. speech); it's about the *relational dynamic* established by the communication.
      *   Using the press isn't the sin; *appealing* to the public as an authority is the sin.
