answer: |-
  You have hit on one of the most fascinating tensions in Kierkegaard's work, and your intuition is correct: it is not hypocrisy, but it is also not simply "hating the press but using it anyway."

  The conceptual move that resolves this is the distinction between **Direct Communication to a Crowd** and **Indirect Communication to the Single Individual.**

  Here is how that distinction clears up the contradiction.

  ### 1. The Enemy is "The Public," Not the Paper
  Kierkegaard does not object to ink, paper, or distribution. He objects to **abstraction.**

  For Kierkegaard, "The Public" is a phantom. It is an abstract entity that allows people to hide. When I act as part of "the public," I have no responsibility. I can hold an opinion without having to live by it. The press fuels this by turning truth into "news" or "opinion," which can be consumed passively.

  The corruption happens when communication treats the reader as a member of a herd. If I write to persuade "public opinion," I am validating the idea that the crowd is the arbiter of truth. That is the sellout.

  ### 2. The Conceptual Move: Indirect Communication
  Kierkegaard's solution is to use the mass medium (the newspaper/book) to bypass the "public" and speak to the **Single Individual** (*Den Enkelte*).

  He knows that physically, thousands might read his words. But conceptually, he constructs his writing so that it only works if read by one person in isolation.

  *   **Direct Communication:** "Here is the truth. Agree with me. Join the movement." (This builds a crowd.)
  *   **Indirect Communication:** "Here is a possibility. Here is a mirror. You must decide." (This isolates the reader.)

  By using pseudonyms, he removes **authority**. If you know the author is a respected professor, you might believe him because of his status (social validation). If the author is a mystery, you are forced to wrestle with the text itself. You are alone with the idea.

  So, he isn't using the press to build a following; he is using the press to **dissolve the following.** He is using the medium of the crowd to break the power of the crowd.

  ### 3. The "Thorn in the Flesh" Strategy
  Kierkegaard explicitly compares his use of the press to a medical procedure. He says that sometimes you need a thorn to remove a thorn.

  The "thorn" of the age is the illusion that we can find truth collectively through gossip and news. To cure this, he injects a different kind of writing into the same bloodstream. He publishes in the same newspapers people use for gossip, but he writes content that makes gossip impossible.

  He creates a "double reflection." The reader picks up the paper expecting to be told what to think (the usual public function), but instead finds a text that forces them to realize *they* must do the thinking. The medium remains the same; the **relational dynamic** is inverted.

  ### 4. Revisiting the Social Media Analogy
  Your friend was right that he is an "anti-social-media guy," but with a caveat: He is not a Luddite who smashes the servers. He is more like a **hacker.**

  *   **The Luddite:** "Twitter is bad, so I will not tweet." (This is what you initially thought Kierkegaard was.)
  *   **The Hypocrite:** "Twitter is bad, but I need followers, so I will tweet."
  *   **Kierkegaard:** "Twitter creates a false sense of connection. I will tweet in a way that makes you feel alone, so you stop looking for validation in likes and start looking inward."

  He accepts the *technology* of distribution but rejects the *sociology* of the audience.

  ### Summary
  The conceptual move is this: **He distinguishes the physical reach of the message from the spiritual destination of the message.**

  He admits that the press makes everyone part of a "public" physically. But through indirect communication, he attempts to snatch the reader *out* of the public and place them before God (or their own conscience) as an individual.

  He isn't selling out to the crowd; he is ambushing the crowd to liberate the individual. That is why he can write in the newspaper without validating "the public." He is using the public square to tell everyone to go home and shut the door.
