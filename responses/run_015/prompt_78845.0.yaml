answer: |-
  This is a fantastic pedagogical instinct because the two-envelope problem is one of those rare beasts that dissolves under exposition but thrives on embodiment. You want them to feel the cognitive dissonance of the symmetry argument physically, and your broker idea is the right vehicle for it. The key to making this work in seventy-five minutes is strict control over the materials and the narrative arc, so here is a complete design for the session that prioritizes that moment of collapse you are looking for.

  You will need seven pairs of students, so prepare seven sets of envelopes. To keep the arithmetic instantaneous, use powers of two multiplied by ten, specifically pairs of twenty and forty, forty and eighty, and eighty and one hundred sixty. You should prepare these such that the distribution is bounded, though you will not tell them this yet. For example, have two sets of twenty-forty, three sets of forty-eighty, and two sets of eighty-one hundred sixty. This ensures there is a hard cap at one hundred sixty dollars and a floor at twenty dollars, which will be crucial for the second phase. Give each pair a ledger sheet with columns for Round Number, Envelope Amount Held, Decision to Swap, Fee Paid, and Final Balance. They start with a hypothetical stake of one hundred dollars of play money to pay fees, so losses are tracked but not personally painful. The fee should be flat, say five dollars per swap per person. This amount is small enough that the expected value gain from switching appears to dwarf it, but large enough that repeated swapping drains their stake visibly.

  Begin the session by dividing them into pairs and handing out the sealed envelopes. Tell them not to open them yet. You will act as the Broker. Your pitch needs to be smooth and mathematically seductive without lying. Tell them that in each pair, one envelope contains exactly twice the amount of the other. Explain that they may open their envelopes privately to see their amount. Then, offer them the opportunity to swap with their partner. Here is the critical script: remind them that whatever amount they are holding, say X, the other envelope must contain either 2X or X/2. Tell them that since they have no information about which envelope is which, it is equally likely to be double or half. Walk them through the expected value calculation on the board without referencing their specific numbers yet. Show them that 0.5 times 2X plus 0.5 times X/2 equals 1.25X. Emphasize that this represents a twenty-five percent expected gain on their current holding. Announce that to facilitate this market, you charge a five-dollar transaction fee per person per swap. Ask them to calculate if the expected gain outweighs the fee. For almost every amount they will hold, the math says yes. If they hold forty, the expected value of the other envelope is fifty, a gain of ten, which covers the five-dollar fee with five dollars profit. If they hold eighty, the expected value is one hundred, a gain of twenty, covering the fee easily. The only exception is the maximum amount, but since they do not know the distribution yet, they cannot know they are at the cap.

  Run three rounds of trading, each lasting about five minutes. In each round, they open their envelopes, decide independently whether to pay the fee to swap, and record the transaction. Require mutual consent for the swap to proceed, meaning both must pay the fee and agree to exchange. This requirement is vital because it forces the symmetry error to happen simultaneously in both brains. If both agree, they swap, pay the fees, and then you collect the envelopes, shuffle them within the pair without changing the amounts, and redistribute for the next round. This shuffling prevents them from tracking which physical envelope holds the high value, maintaining the uncertainty required for the paradox to hold. After three rounds, have them tally their net play money. Most pairs will have lost money due to the fees, despite following the rational expected value argument you walked them through. This is the first moment of collapse, where the ledger shows that doing the mathematically obvious thing repeatedly led to a guaranteed loss.

  Now move to the second phase, which should take about fifteen minutes. Reveal the distribution you used to fund the envelopes. Tell them there was a maximum amount of one hundred sixty dollars and a minimum of twenty dollars. Ask the students who held one hundred sixty dollars to raise their hands. Ask them what the other envelope must contain. They will realize it must be eighty, meaning the probability of doubling was zero, not fifty percent. Ask the students who held twenty dollars. They will realize the other must be forty, meaning the probability of halving was zero. This reveals the boundary conditions where the fifty-fifty assumption breaks. Ask them to recalculate the expected value knowing this prior distribution. They will see that for the middle amounts, the probability is not actually fifty-fifty once you condition on the specific value observed, because the distribution of amounts in the game was not uniform across all possible numbers. This leads them to discover that the assumption of equal probability for doubling or halving is incompatible with a proper probability distribution over a finite range.

  The final twenty minutes are for the debrief, where you connect the game mechanics to the formal paradox. Walk them back through the feeling they had when holding the envelope. Validate that the argument felt sound because the variable X was being treated as a constant in the expected value calculation when it was actually a random variable dependent on whether they held the smaller or larger amount. Explain that the symmetry between the two players is the ultimate proof that the swap cannot be advantageous; if swapping is good for you, it must be bad for your partner, yet you are in identical epistemic positions. You need to be explicit here about what the game solved versus what the philosophical puzzle is. The game solves the paradox by introducing a bounded prior, which forces the probability assessment to change at the edges. The philosophical puzzle relies on an improper prior, essentially assuming a uniform distribution over an infinite range of positive numbers, which is mathematically impossible. You will have to tell them this part because no physical game can simulate an infinite distribution, but you can explain that the error lies in assuming the probability of doubling is always one-half regardless of the amount seen.

  There are predictable failure modes you should anticipate and manage in real time. The most common issue is the student who has seen the puzzle before and knows the solution. If they blurt out that switching doesn't matter during the trading phase, it ruins the embodied experience for the rest. To mitigate this, send a pre-seminar email asking anyone familiar with the two-envelope problem to notify you. If any respond, seat them together and give them a role as auditors who track the fees but are forbidden from trading or speaking during the decision phase. If you cannot identify them beforehand, watch for the pair that refuses to trade entirely. If a pair sits still while others trade, pull them aside during the rounds and ask if they understand the instructions, framing it as checking for clarity rather than challenging their strategy. Another risk is that the fee makes them suspicious of you as the broker rather than suspicious of the argument. They might think you are rigging the envelopes. To prevent this, make the envelope preparation transparent after the game. Show them the pool of money and the sets you prepared so they know the amounts were fixed and random, not manipulated based on their choices. The loss must feel like a tax on their reasoning, not a trick by the instructor.

  You should also be prepared for pairs who refuse to trade on principle and thus never feel the pull of the paradox. If they do not trade, they do not bleed, and they do not feel the cognitive dissonance. To encourage participation, frame the goal of the seminar as maximizing portfolio value and tell them you will award a small prize, like choosing the next topic or extra credit, to the pair with the highest final balance. This incentivizes them to engage with the expected value argument seriously. If they still refuse, ask them during the debrief to explain their reasoning. Often they will say they sensed the symmetry, which is a perfect lead-in for your explanation. However, be aware that some students may feel the fee is simply a cost of doing business and not a paradox indicator. You must highlight during the debrief that because both players swapped, the net money in the envelopes did not change, yet the total money in the room decreased by the sum of the fees. This proves that the aggregate expected value of the swap was zero, not positive.

  Finally, be honest about what the game cannot reproduce. The physical game uses a finite set of amounts, which resolves the paradox by breaking the fifty-fifty assumption at the boundaries. The true philosophical weight of the two-envelope problem rests on the possibility of an infinite range of values, where no such boundaries exist. The game cannot show them why the expected value calculation fails when the range is unbounded because you cannot hand out infinite money. You will have to explain that in the infinite case, the expected value of the envelopes themselves becomes infinite, which breaks standard decision theory. The game provides the intuition that the probability assignment is the culprit, but you must supply the measure-theoretic explanation that a uniform prior over all positive real numbers does not exist. By grounding the session in the tangible loss of the fees and the visible boundary of the maximum amount, you give them a concrete anchor for that abstract concept, ensuring they leave the room understanding not just the solution, but why their intuition led them astray.
