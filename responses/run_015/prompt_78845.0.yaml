  2.  **Deconstruct the Two-Envelope Problem:**
      *   *The Paradox:* You have envelope A. Envelope B has either $2A$ or $A/2$ with equal probability. Expected value of switching = $0.5(2A) + 0.5(A/2) = 1.25A$. Since $1.25A > A$, you should switch. But by symmetry, you should also switch back.
      *   *The Flaw:* The assumption that $P(B=2A | A) = P(B=A/2 | A) = 0.5$ for *any* value $A$ is impossible under a proper prior distribution (you can't have a uniform distribution over all positive real numbers).
      *   *The Experience:* Students need to feel the urge to switch based on the EV calculation, then realize the symmetry makes that impossible.

  3.  **Drafting - Section by Section (Mental Outline):**
