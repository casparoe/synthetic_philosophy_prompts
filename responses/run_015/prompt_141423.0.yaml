answer: |-
  # COLLECTIVE ACTION: ETHICAL DECISION TREE
  **Module:** Climate, Meat, Voting | **Audience:** First-Year Seminar

  ***

  ### START HERE
  **The Inefficacy Premise:**
  *"My one flight / my single vote / my one pack of factory-farmed chicken makes no causal difference to anything anyone will ever notice."*
  *(Assume this is true for the sake of the following questions.)*

  ***

  ### NODE 1: The Unknown-Size Case (Emissions)
  **Question:** Your carbon emissions join millions of others. Harm occurs only when a specific threshold is crossed, but you don't know where the threshold is. Do you accept that your contribution has a *non-zero probability* of being the trigger?
  *   **YES** → Go to **Leaf A**
  *   **NO** → Go to Node 2

  ### NODE 2: The Overdetermined Case (Keys)
  **Question:** Imagine 1,000 people must turn a key to release a toxin. The toxin releases if *any* 500 turn theirs. You turn your key, but 600 others do too, so your key was not needed. Are you *tainted* by participating in the mechanism?
  *   **YES** → Go to **Leaf B**
  *   **NO** → Go to Node 3

  ### NODE 3: The Replaceable Case (Chicken)
  **Question:** You skip buying the factory-farmed chicken, but the store sells that exact pack to someone else. The total order size for the farm remains unchanged. Does your purchase make you a *member of the group* that caused the death, even if you didn't change the total number?
  *   **YES** → Go to **Leaf C**
  *   **NO** → Go to Node 4

  ### NODE 4: The Norm Case (Convention)
  **Question:** People like us follow a local convention (e.g., "we don't fly for short trips"). No single flight breaks the climate, but your visible compliance helps keep the convention strong. Does your act risk *eroding a helpful social rule*?
  *   **YES** → Go to **Leaf D**
  *   **NO** → Go to Node 5

  ### NODE 5: The Expressive Case (General)
  **Question:** Even if the outcome is unchanged, does taking the action *express* an attitude of disrespect toward those harmed or toward the value of the environment?
  *   **YES** → Go to **Leaf E**
  *   **NO** → Go to Node 6

  ### NODE 6: The Fair-Share Case (General)
  **Question:** If a collective duty exists (e.g., "we must stop warming"), do you owe a *fair share* of the burden even if your specific share doesn't change the outcome?
  *   **YES** → Go to **Leaf F**
  *   **NO** → Go to Node 7

  ### NODE 7: The Offset Case (Flight)
  **Question:** You cannot avoid the flight, but you pay for an equivalent reduction elsewhere (an offset). Is the act morally *neutralized* by this payment?
  *   **YES** → Go to **Leaf G**
  *   **NO** → Go to Node 8

  ### NODE 8: The Character Case (General)
  **Question:** Is the primary worry about what this act does to *your own character* or virtues, regardless of the outside world?
  *   **YES** → Go to **Leaf H**
  *   **NO** → Go to **Leaf I**

  ***

  ### THE LEAVES (CONCLUSIONS)

  **Leaf A: The Expected-Difference View**
  *   **Verdict:** The act is wrong because there is a chance you matter.
  *   **Awkward Commitment:** You must treat driving to the bakery as morally weighty because there is a 1-in-a-billion chance you trigger a climate catastrophe.

  **Leaf B: The Complicity View**
  *   **Verdict:** The act is wrong because you participated in a harmful mechanism.
  *   **Awkward Commitment:** You are morally responsible for the toxin even if removing your key would have changed absolutely nothing about the outcome.

  **Leaf C: The Sufficient-Set View**
  *   **Verdict:** The act is wrong because you are part of a minimal set sufficient for the harm.
  *   **Awkward Commitment:** You are responsible for the chicken's death even if the store would have sold that exact same chicken to your neighbor had you not bought it.

  **Leaf D: The Norm-Sustenance View**
  *   **Verdict:** The act is wrong because it weakens a cooperative convention.
  *   **Awkward Commitment:** You ought to follow the rule even in secret cases where your noncompliance could never possibly be observed by others.

  **Leaf E: The Expressive View**
  *   **Verdict:** The act is wrong because it sends the wrong message.
  *   **Awkward Commitment:** An act that saves lives could still be wrong if it symbolically endorses a harmful ideology.

  **Leaf F: The Fair-Share View**
  *   **Verdict:** The act is wrong because you are free-riding on the restraint of others.
  *   **Awkward Commitment:** You must do your share even if you know for a fact that everyone else is already doing enough to solve the problem without you.

  **Leaf G: The Net-Zero View**
  *   **Verdict:** The act is permissible if the net outcome is neutralized.
  *   **Awkward Commitment:** You can morally purchase the right to emit carbon provided you have enough money to pay for the offset.

  **Leaf H: The Character/Virtue View**
  *   **Verdict:** The act is wrong because it makes you the kind of person who does that.
  *   **Awkward Commitment:** The act remains wrong even if, by some magic, it produced a net benefit for the world.

  **Leaf I: The Inefficacy/Permissible View**
  *   **Verdict:** The act is permissible because it makes no difference.
  *   **Awkward Commitment:** You have no moral reason to vote, recycle, or avoid meat unless you can prove your individual act changes the outcome.

  ***

  ## INSTRUCTOR'S DESIGN NOTES & CRITIQUE
  *(For seminar leader use only)*

  ### 1. Indistinguishable Leaves
  **Expressive (Leaf E) vs. Character (Leaf H):**
  My tree treats these as distinct, but in practice, they rarely separate. The Expressive view focuses on the message sent *outward* (social meaning), while Character focuses on the state *inward* (virtue). However, what expresses disrespect usually corrodes virtue, and vice versa.
  *   **My Stance:** **Character is the genuine position; Expressive is derivative.** An act only "expresses" something because we are the kinds of creatures who interpret actions as expressions. If you fix the Character (the agent's intent/nature), the Expression usually resolves. I kept them separate in the tree only because first-years intuitively grasp "sending a bad message" more easily than "corrupting the soul."

  ### 2. Unoccupied Answer Combinations
  **The "Offset Yes / Expected Difference No" Path:**
  It is logically possible to answer **NO** at Node 1 (denying probabilistic impact) but **YES** at Node 7 (accepting offsets neutralize the act).
  *   **Status:** **Incoherent.**
  *   **Reason:** Offsets work on consequentialist math (net tons of CO₂). If you reject the premise that your tons matter probabilistically (Node 1), you cannot consistently claim that canceling those tons matters (Node 7). Students who take this path are usually confused about what offsets do; they treat offsets as "indulgences" (Character view) while claiming they are "math" (Consequentialist view).

  **The "Fair Share Yes / Norm No" Path:**
  Answering **YES** at Node 6 (Fair Share) but **NO** at Node 4 (Norms).
  *   **Status:** **Unfashionable/Unstable.**
  *   **Reason:** Fair-share duties typically arise from cooperative schemes. If you deny that norms/conventions (Node 4) have moral weight, it is hard to ground why you owe a "share" of a collective duty. This position is theoretically possible (a Kantian duty without social context) but sociologically rare.

  ### 3. Critique of Cases and Frame
  **The "Overdetermined" Case (Node 2) is Rigged:**
  The "1,000 keys" scenario is a philosophical fantasy. In reality (climate, voting, markets), overdetermination is almost never absolute; there is almost always a *probability* that you were pivotal.
  *   **Why I kept it:** It is the only clean way to isolate **Complicity** from **Expected Difference**. If I used a real-world case, students would slide back into Node 1 ("But maybe I *was* needed!"). To force them to choose between "making a difference" and "being involved," I had to use a case where making a difference is impossible by stipulation.

  **The Branching Frame Itself:**
  The tree assumes views are mutually exclusive (a decision tree), but ethical theories are often layered. A Virtue Ethicist might *also* care about Norms.
  *   **Defense:** For first-years, a taxonomy is more useful than a topology. They need to identify their *primary* intuition. If they care about Character *and* Norms, they should answer YES to both, but the tree forces a priority. This is a feature, not a bug: it forces them to identify which consideration *bottoms out* their reasoning.

  **The "Inefficacy" Leaf (Leaf I):**
  This is the "default" position for skeptics. By placing it at the very end, the tree frames it as the "last resort" after all other moral connections are severed.
  *   **Risk:** This biases the handout against the Inefficacy view, making it look like the "gave up" option.
  *   **Mitigation:** In seminar, emphasize that Leaf I is a robust, defensible position (e.g., consequentialist individualism), not just a failure of imagination.
