answer: |-
  # Seminar Activity: "The Burden of Representation"

  **Time:** 90 Minutes
  **Participants:** 14 Graduate Students
  **Materials:** Printed Role Cards (14), Paper Tokens (2 types), Work Proposal Sheets (5), Pens.
  **Constraint:** Do not mention W. E. B. Du Bois, "Propaganda," or "Criteria of Negro Art" until the Debrief.

  ---

  ## I. Setup & Roles (10 Minutes)

  **Room Arrangement:** Three distinct tables.
  *   **Table A (The Studio):** 5 Artists.
  *   **Table B (The Gallery):** 5 Patrons.
  *   **Table C (The Press):** 4 Critics.

  **Token Economy:**
  *   **Sustenance Tokens (Bread):** Represent survival, community trust, and material viability. Artists need **3** to survive the round.
  *   **Prestige Tokens (Laurels):** Represent critical acclaim, historical legacy, and institutional acceptance. Artists need **3** to "win" the round.
  *   *Note:* Artists start with **1 Sustenance** and **0 Prestige**. They must earn the rest.

  **Distribution:**
  1.  **Artists (5):** Receive a *Creator Card* with a specific **Community Mandate** (e.g., "Expose the truth about housing discrimination," "Celebrate resistance without violence"). They also receive 3 *Production Tokens*.
  2.  **Patrons (5):** Receive a *Funder Card* with a hidden **Investment Agenda**.
      *   3 Patrons have agenda: **"Universal Beauty"** (Fund works that avoid specific political keywords).
      *   2 Patrons have agenda: **"Social Utility"** (Fund works that explicitly address the Community Mandates).
  3.  **Critics (4):** Receive a *Review Card* with a hidden **Critical Lens**.
      *   2 Critics use lens: **"Formalist"** (Award Prestige for technical ambiguity/universality).
      *   2 Critics use lens: **"Materialist"** (Award Prestige for clear social impact).

  ---

  ## II. Phase 1: Creation (15 Minutes)

  **Task:** Artists must draft a **Work Proposal** (one paragraph describing a piece of art).
  **Constraints:**
  1.  Each Production Token allows one draft revision. They have 3 tokens.
  2.  **The Tether Rule (Crucial):** At the end of the game, if the Work Proposal does not *explicitly* satisfy the Artist's **Community Mandate**, the Artist immediately loses **2 Sustenance Tokens**.
      *   *Instructor Note:* This mechanically enforces the "duty." Ignoring the mandate isn't neutral; it is actively costly.
  3.  Artists may visit Patrons and Critics during this time to ask questions, but cannot show their Community Mandate.

  ---

  ## III. Phase 2: The Market (30 Minutes)

  **Task:** Negotiation and Resource Allocation.
  **Rules:**
  1.  **Patrons:** Hold 3 Sustenance Tokens each. They must distribute them to Artists.
      *   If they fund an Artist matching their **Investment Agenda**, they get a receipt (points for themselves).
      *   If they fund an Artist *not* matching their Agenda, they get nothing.
      *   *Conflict:* "Universal Beauty" Patrons will withhold funds from explicit political art. "Social Utility" Patrons will withhold funds from "neutral" art.
  2.  **Critics:** Hold 3 Prestige Tokens each. They award them based on their **Critical Lens**.
      *   Formalists reward ambiguity. Materialists reward clarity.
  3.  **Artists:** Must circulate. They must pitch their work. They can negotiate ("If I soften this line, will you fund me?").
  4.  **The Neutrality Trap:** If an Artist attempts to make a work that is "Universal" or "Ambiguous" to please the Formalists/Universal Patrons:
      *   They may gain Prestige.
      *   **BUT** they risk failing the **Tether Rule** (losing Sustenance).
      *   **AND** the "Social Utility" Patrons/Critics will refuse to fund them.
      *   *Result:* A "Neutral" strategy typically results in high Prestige but fatal Sustenance loss (Starvation). A "Committed" strategy ensures Sustenance but risks low Prestige if the "Universal" faction dominates.

  ---

  ## IV. Phase 3: Judgment & Survival (15 Minutes)

  1.  **Submission:** Artists submit final Work Proposals to the Instructor.
  2.  **Verification:** Instructor checks Work Proposals against Community Mandates (The Tether Rule). Penalties applied.
  3.  **Payout:** Patrons and Critics hand over tokens based on their hidden agendas.
  4.  **Survival Check:**
      *   Any Artist with <3 Sustenance is "Silenced" (eliminated from the win condition).
      *   Any Artist with <3 Prestige is "Marginalized" (survives but does not win).
      *   Artists with both survive and win.
  5.  **Observation:** Usually, 1-2 Artists win. Several are "Silenced" because they tried to please the Universal Patrons and failed the Tether Rule. Several are "Marginalized" because they pleased the Community but were rejected by Formalist Critics.

  ---

  ## V. Debrief & Philosophical Mapping (20 Minutes)

  **Step 1: The Reveal (3 Minutes)**
  *   **Instructor:** "Reveal the name of the philosopher whose 1926 essay *Criteria of Negro Art* this game simulates: W. E. B. Du Bois."
  *   **Instructor:** "Reveal the forbidden word: **Propaganda**."
  *   **Instructor:** "Du Bois wrote: 'All Art is propaganda and ever must be, despite the wailing of the purists.'"

  **Step 2: Mapping Mechanics to Reasoning (10 Minutes)**

  | Game Mechanic | Du Bois's Philosophical Claim | Discussion Question |
  | :--- | :--- | :--- |
  | **The Tether Rule** (Mandate penalty) | **The Binding Duty.** Marginalized artists cannot afford "Art for Art's sake" because their people's existence is contested. Neutrality is abandonment. | "Why did the Tether Rule feel like a burden rather than a choice? How does this map to Du Bois's idea of 'duty'?" |
  | **The Neutrality Trap** (Starvation) | **Impossibility of Neutrality.** Attempting to be 'universal' often alienates the community that sustains you, while still being judged politically by the dominant culture. | "Did anyone try to make 'neutral' art? Why did it cost you Sustenance?" |
  | **Patron/Critic Split** | **The Double Audience.** The Black artist writes for both their own people (Survival) and the white world (Legitimacy). These demands often contradict. | "How did the conflict between 'Universal' Patrons and 'Utility' Patrons mirror the real art world?" |

  **Step 3: Correcting Misconceptions (5 Minutes)**

  *   **Reaction A: "Propaganda means Lies."**
      *   *Student Objection:* "This game made us feel like we had to lie or simplify our art to get tokens. Propaganda is manipulation."
      *   *Correction:* "Du Bois does not mean 'falsehood.' He means 'advocacy.' In 1926, 'propaganda' meant the active propagation of a truth that is being suppressed. If the world believes your community is inferior, art that shows your community's humanity is 'propaganda' against that lie. It is not deception; it is *counter-narrative*."
  *   **Reaction B: "The System was Rigged."**
      *   *Student Objection:* "It was impossible to win. The Patrons were contradictory."
      *   *Correction:* "Exactly. Du Bois is not describing an ideal meritocracy; he is describing a structural constraint. The 'rigged' feeling *is* the lesson. The luxury of aesthetic autonomy is denied because the system is already weighted. The game is supposed to feel unfair, because the historical condition Du Bois describes is unfair."

  **Step 4: Addressing the Limitation (2 Minutes)**

  *   **Instructor Statement (Read Verbatim):**
      > "There is one element this token economy cannot reproduce, and I must name it. Du Bois did not hate Beauty. He wrote, 'I do not care a damn for any art that is not used for propaganda.' But he *also* wrote, 'I stand in utter shamelessness and say that whatever art I have for writing has been used always for propaganda for gaining the right of black folk to love and enjoy.'
      >
      > The game forces a trade-off between Sustenance (Justice) and Prestige (Beauty). Du Bois's actual claim is more difficult: He demands we make art that is *both* beautiful and just, but if forced to choose, Justice precedes Beauty. The game simplifies this into a zero-sum token exchange. In reality, Du Bois argues that true Beauty *cannot* exist without Truth, and for the marginalized, Truth *is* Justice. The tokens separate them; Du Bois insists they are ultimately the same."

  ---

  ## VI. Contingency Planning: What Will Go Wrong

  **1. Artists will try to "Game the Tether."**
  *   *Risk:* Artists will write vague statements that technically include the keyword but lack spirit.
  *   *Mitigation:* During Verification, the Instructor acts as the "Community." If the statement is cynical or tokenistic, rule that the Community "rejects" it, and the Sustenance penalty stands. Explain in debrief that Du Bois demanded *sincerity*, not just technical compliance.

  **2. Patrons will collude.**
  *   *Risk:* Patrons might pool tokens to save a favorite Artist, bypassing the agenda.
  *   *Mitigation:* Rule that Patrons cannot trade tokens with each other, only with Artists. If they break this, disqualify their tokens.
  *   *Debrief Use:* If they try to collude, point out that this represents "Philanthropy," which Du Bois viewed with suspicion compared to structural change.

  **3. Students will feel moral distress.**
  *   *Risk:* Artists forced to make "political" art may feel their autonomy violated.
  *   *Mitigation:* Acknowledge this discomfort in the debrief. "That feeling of violated autonomy is the precise sensation Du Bois argues is a *privilege* denied to marginalized creators. The seminar's goal is to understand why that privilege is unavailable, not to endorse the constraint as eternally good."

  ---

  ## VII. Materials Checklist (Printable)

  1.  **Artist Card (5 copies):**
      *   *Role:* Creator.
      *   *Inventory:* 1 Sustenance, 3 Production Tokens.
      *   *Goal:* End with 3 Sustenance + 3 Prestige.
      *   *SECRET MANDATE:* [Insert specific social truth, e.g., "Labor exploitation is systemic."]
      *   *RULE:* If final work does not explicitly advance MANDATE, lose 2 Sustenance.
  2.  **Patron Card (5 copies):**
      *   *Role:* Funder.
      *   *Inventory:* 3 Sustenance Tokens.
      *   *SECRET AGENDA:* [3 copies: "Fund works with NO political keywords." / 2 copies: "Fund works WITH political keywords."]
  3.  **Critic Card (4 copies):**
      *   *Role:* Evaluator.
      *   *Inventory:* 3 Prestige Tokens.
      *   *SECRET LENS:* [2 copies: "Award works that are Ambiguous/Universal." / 2 copies: "Award works that are Specific/Actionable."]
  4.  **Tokens:** Cut paper slips. Mark 50 with "Bread" (Sustenance), 50 with "Laurel" (Prestige).
  5.  **Proposal Sheet:** Blank space for Artist to write final description.

  ---

  ## VIII. Instructor's Cheat Sheet for Du Bois Quotes

  Keep these handy for the debrief to anchor the game experience:

  1.  **On Neutrality:** "The apostle of Beauty in America becomes the apostle of Truth... not because he is an artist, but because he is a Negro."
  2.  **On Duty:** "What do we want? What is the thing we are after? ...it was not primarily Beauty, it was not primarily Truth, but it was the right of black folk to love and enjoy."
  3.  **On Propaganda:** "I do not care a damn for any art that is not used for propaganda. But I do not care when the propaganda becomes so blatant that the art is lost." (Use this to show he still valued quality).
