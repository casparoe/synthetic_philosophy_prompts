  2. What to concede before the first question

  In my opening, I must concede that "defect" is not value-neutral. I will state explicitly that my account presupposes a thin normativity of coherence—instrumental rationality—that is not derived from the model itself. This disarms the Kantian who suspects I'm smuggling in the moral law and the Primitive theorist who thinks I'm reducing the irreducible. By admitting I rely on a prior standard of consistency, I avoid the charge of circularity later. It shows I'm not trying to ground normativity from nothing, but rather mapping its internal structure. This concession costs me little because my target is the link between agent and reason, not the source of normativity itself.

  3. The reply that has to land

  The single response that must land is this: "The idealized agent is not a stranger." When I speak of repairs, I am not invoking a fully rational advisor who stands outside you. I am describing a chain of steps where every link is recognized by the agent at the previous link as an improvement. The externalist wants criticism; the internalist wants grip. My view secures criticism because the endpoint differs from the start, but secures grip because every step is internally validated. If you lose the chain, you lose the reason. If you keep the chain, you keep the agent.

  4. The question I hope nobody asks

  **The Psychopath Objection.** The Decision Theorist or Kantian might ask: "What about an agent with no internal defects? A psychopath who is perfectly consistent but evil. Your view says they have no reasons to be moral."
  *Honest Answer:* You are right. On my view, a perfectly consistent psychopath has no internal reason to be moral. We can only criticize them externally, which my view admits is limited. I cannot generate moral reasons from thin air.
  *Fallback:* "That is the correct result for a theory of *internal* reasons. It shows why we need external sanctions for such cases. But for standard agents, the repair chain holds."
  *Strategy:* Don't fight it. Accept the limitation. It highlights the view's honesty about the scope of internalism. If pressed, pivot to the fact that most agents *do* have latent defects (empathy gaps) that can be repaired. This distinguishes my view from those claiming to solve all normativity. It clarifies the boundary of internal reasons.

  5. Wording traps in my own slides

  Avoid the phrase "Ideal Agent" on slides. It invites the Advisor Model objection. Use "Repaired Self" instead. Avoid "Rationality" when defining defects; use "Coherence" or "Consistency." "Rationality" sounds substantive and Kantian; "Coherence" sounds formal and internal. Also, do not say "Reasons are created by repairs." Say "Reasons are revealed by repairs." The former sounds constructivist; the latter sounds realist-compatible. Finally, ensure the slide defining "defect" lists examples (inconsistency, means-end) rather than abstract norms, to prevent the Primitive theorist from attacking the definition as vague.
