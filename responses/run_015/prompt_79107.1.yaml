answer: |-
  **INTERNATIONAL COMMERCIAL ARBITRATION TRIBUNAL**
  **AWARD No. 2024-89**

  **1. Parties:** Claimant (Buyer) v. Respondent (Seller).
  **2. Subject:** Dispute regarding Clause 4.2 of the Supply Agreement (Pricing Schedule).
  **3. Date:** 24 October 2024.

  **BACKGROUND**

  4. The Contract stipulates the Total Price shall be calculated as 'Base Cost' '+' 'Adjustment Fee'. The Base Cost is 50 units. The Adjustment Fee is 10 units.
  5. Claimant submits the Total Price is 60 units. Respondent submits the Total Price is 5 units.
  6. The dispute turns exclusively on the semantic content of the symbol '+'.

  **SUBMISSIONS**

  7. Claimant argues the symbol '+' denotes the standard arithmetic function of addition, consistent with universal commercial practice.
  8. Respondent's Expert Accountant submits that no fact regarding his past usage of the symbol '+' necessitates the addition function. He notes that all sums previously computed by his firm involved integers below 57.
  9. The Accountant submits that his past conduct is equally consistent with a divergent function (hereinafter 'quus') which yields the sum of x and y where x, y < 57, but yields 5 where x, y ≥ 57. As 50 + 10 exceeds 57, the Accountant contends the intended result is 5.
  10. Respondent argues there is no internal mental state or historical fact that distinguishes meaning 'plus' from meaning 'quus'. Therefore, the Claimant cannot prove the Respondent meant addition.

  **TRIBUNAL'S REASONING**

  11. The Tribunal accepts the Respondent's factual premise. There is no finite fact about the Respondent's past behavior or internal psychology that logically dictates one function over the other. Meaning is not determined by private ostension.
  12. However, contracts are not private languages. They are instruments of commerce reliant on communal stability. The meaning of a term is not a fact hidden in the mind, but a license granted by the relevant community's practice.
  13. The Tribunal finds that the relevant community for this Contract is the international mercantile sector. Within this community, the practice licenses the use of '+' to denote addition regardless of the magnitude of integers.
  14. Where parties' individual practices diverge, the Tribunal must determine which community practice governs to ensure the continuity of trade. To hold otherwise would render all pricing schedules uncertain upon the first calculation exceeding 57 units.
  15. Consequently, the Tribunal finds the "ordinary meaning" of '+' in this context is addition. This is not an imposition of new terms, but a finding of the only meaning the community permits us to assert.
  16. The Tribunal observes that this Award consists of words which must themselves be read according to the rules herein established. Future readers must assume the Tribunal meant what the community licenses them to read, lest this text also succumb to divergent interpretations.
  17. Accordingly, the Respondent's interpretation is rejected as incompatible with communal assertibility conditions.

  **RULING**

  18. The symbol '+' in Clause 4.2 denotes standard addition.
  19. Respondent shall pay Claimant the difference of 55 units.
  20. Costs are awarded to the Claimant.

  **DISSENTING OPINION (Arbitrator J. Vance)**

  21. I dissent. The Majority admits there is no fact of the matter regarding the parties' intent, yet proceeds to rule as though they have discovered one.
  22. By grounding the decision in "community practice" rather than the parties' actual understanding, the Tribunal conflates what the parties meant with what the Tribunal will make them mean.
  23. This is not interpretation; it is legislation disguised as semantic finding. The Majority asserts there is no right answer until they provide one, then claims they merely found the right answer. This undermines the consensual basis of arbitration.
  24. We are not enforcing the contract; we are enforcing our own authority to define words. I cannot endorse this circularity.

  **[SIGNED]**
  **Tribunal Panel**
