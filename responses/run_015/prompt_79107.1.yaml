      *   **Resolution Theory:** Communal-practice response to the rule-following paradox (Kripke/Wittgenstein). Meaning is determined by community practice, not individual mental states. Where practices diverge, the tribunal decides which practice counts.
      *   **Tone/Style:** Flat, numbered register of a commercial tribunal. About 700 words.
      *   **Key Constraint:** The award must *enact* the theory rather than announce it explicitly as theory. It must insist it is merely finding the "ordinary meaning." It should remark in passing that its own words are subject to the same rules.
      *   **Dissent:** A short dissent arguing the majority confuses what parties meant with what the tribunal makes them mean.
      *   **Humor/Satire:** The jokes should come from the tribunal getting the paradox exactly right (unwittingly) and not noticing the implications for law itself. Accessible to lay readers but fair to specialists.

  2.  **Deconstruct the Philosophical Underpinnings (Kripke's Wittgenstein):**
