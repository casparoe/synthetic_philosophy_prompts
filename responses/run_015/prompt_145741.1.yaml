answer: |-
  Dear friend,

  Your intuition regarding the tension between the decision-theoretic and self-locating-uncertainty strategies in Everettian quantum mechanics strikes at the very heart of the interpretive crisis, and I suspect you are correct to sense that these approaches may not be as distinct as their proponents often claim. When we press on the metaphysical status of the agent within a branching wavefunction, both strategies appear to rely on a shared, often unstated, commitment regarding personal identity that effectively smuggles in the classical uncertainty they aim to derive or explain. The decision-theoretic program, championed by Deutsch and Wallace, argues that a rational agent in a branching universe must act as if the Born rule holds because any other strategy leaves them vulnerable to a quantum Dutch book. However, this derivation hinges on axioms of rationality that presuppose the agent cares about their future successors in a way that is sensitive to branch weights. If the agent identifies wholly with the pre-branch wavefunction, they know with certainty that all outcomes will occur, rendering the notion of betting on one outcome over another incoherent unless they already accept that some outcomes matter more than others. Similarly, the self-locating-uncertainty approach, advanced by thinkers like Sebens and Carroll, attempts to ground probability in the ignorance an agent feels immediately after branching but before observing the outcome. Yet this too requires that the agent regard themselves as distinct from their counterparts on other branches, effectively treating the branch index as a hidden variable of location rather than accepting the totality of the branching structure as their single self.

  Consequently, these two strategies do not remain independent upon rigorous scrutiny but rather collapse into one another because they both require a specific resolution to the problem of diachronic identity in a multiverse. They both demand that the pre-branch agent view their future selves not as a collective totality that they will inevitably become, but as a set of exclusive possibilities among which they must navigate. If the agent is the entire wavefunction, there is no uncertainty to locate and no decision to make regarding which branch to favor, since all branches are equally real parts of the whole. Therefore, the source of the probability is not found in the decision theory itself, nor in the epistemology of self-location, but in the prior metaphysical choice to fragment personal identity across branches. This suggests that the Born rule is not derived from the physics alone but emerges from the interface between the linear dynamics of the wavefunction and a non-linear, branch-relative conception of the self. Without this conception of the self, the weights remain mere mathematical features of the Hilbert space with no normative grip on agency or expectation.

  This brings us to your question regarding a third option, specifically the treatment of squared-amplitude weights as measures of ontological prominence or structural salience rather than probabilities proper. This approach attempts to bypass the need for uncertainty by asserting that branches with higher weights are in some sense more real or possess a greater degree of existence than those with lower weights. While this offers a way to speak about weights without invoking ignorance, the conceptual price is steep, for it decouples rational deliberation from truth-tracking prediction. If all outcomes actually occur, preferring the high-weight branch cannot be justified by the belief that it is the one that will happen, but only by the valuation that it is the one that matters more. This shifts the foundation of quantum mechanics from a physical theory about what happens to an axiological theory about what matters, requiring us to accept that rationality involves caring proportionally about copies of oneself based on their amplitude. The danger here is that such a principle looks ad hoc unless one can explain why amplitude should correlate with value or ontological density without simply restating the Born rule as a brute fact. If we accept this third option, we must concede that the Born rule is not a law of probability but a law of caring, which leaves open the question of why the physical structure of the universe should dictate our normative preferences in such a precise manner.

  In considering whether this problem is solved or merely displaced, I must state clearly that my judgment would be most significantly revised by a rigorous derivation of the Born rule from the Schrödinger equation alone that does not invoke agents, preferences, or ignorance, perhaps via a new understanding of measure theory in Hilbert space that mandates unique experience weighting without recourse to decision-theoretic axioms. Such a result would demonstrate that the weights are intrinsic to the structure of experience itself, rather than imposed by the rational requirements of agents navigating that structure. Until such a derivation is produced, the suspicion remains that we are projecting classical intuitions onto a reality that does not contain them. The precise point in my reasoning most exposed to being wrong is the assumption that subjective uncertainty is incoherent in a deterministic multiverse, for it is possible that a refined understanding of first-person perspective could legitimize self-locating uncertainty even when all outcomes are objectively real, thereby validating the self-locating approach without collapsing it into decision theory. If it turns out that personal identity is fundamentally indexical in a way that survives branching, then the uncertainty is genuine, and the decision-theoretic constraints become secondary consequences rather than primary justifications, potentially dissolving the tension you have identified.
