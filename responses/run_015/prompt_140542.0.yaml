answer: |-
  Here is a teaching plan designed to meet your constraints, manage the specific misconceptions you identified, and bridge to Week 8.

  ### 1. Conceptual Order (The Dependency Chain)

  You cannot state the SCQ until they understand what is being asked. You cannot understand what is being asked until they distinguish the relations involved.

  1.  **Parthood (Informal):** Do not define it formally. Use spatial inclusion and functional integration. *Dependency:* Nothing else depends on this, but everything else requires it.
  2.  **Identity vs. Composition:** This must land **before** the SCQ. If they think Composition *is* Identity (Lewis style), the SCQ dissolves into "When are many one?" (which is never). If they think Composition is *distinct* from Identity, the SCQ is "When do many make a *new* one?"
      *   *Crucial Move:* Explicitly bracket **Constitution**. Tell them: "Constitution is a relation between two *existing* things (e.g., clay and statue). Composition is about whether the second thing *exists at all*. We do Constitution in Week 8. Today is Existence."
  3.  **The SCQ:** Now state it: "Necessarily, the Xs compose a y if and only if..."
  4.  **The Answers:** Nihilism, Moderation, Universalism.

  ### 2. The One Example: "The Organism (You)"

  Do not use a chair. Do not use a watch. Use **The Human Organism**.

  *   **Why:** It is the only example that seamlessly bridges to Week 8 (Animalism vs. Constitution View of Persons). If you establish the ontological status of the organism now, Week 8 becomes "Are *you* the organism?" rather than "What is an organism?"
  *   **How it meets your specs:**
      *   *Contact vs. Function vs. Life:* You can have a coma (Life/Contact, low Function), a corpse (Contact, no Function/Life), and a scattered thought-experiment (No Contact).
      *   *Resists "Just a Set":* Organisms undergo metabolic turnover. The set of your atoms at $t_1$ is not identical to the set at $t_2$. If the organism is a set, you cease to exist every 7 years. If it is a composite, you persist.
      *   *Non-touching version:* Use a "Teleporter" or "Scattered Brain" case. "If your neurons were held in suspension in a vat but functionally linked, are they parts of you?"
  *   **Instruction:** Refer to it as "The Organism" to keep it metaphysical, but point to the students to keep it concrete.

  ### 3. Session Sequence (80 Minutes)

  #### 00:00 – 00:15: Parthood and The Distinction
  *   **Board Left:** "Parthood." **Board Center:** "Composition ≠ Identity."
  *   **Action:** Elicit informal criteria for parthood (spatial inclusion, functional role).
  *   **Intervention (Set Theory):** As soon as a maths student suggests "The whole is just the set of parts," stop.
      *   *Script:* "Sets are abstract and have members essentially. If you lose a cell, the set changes identity. If you lose a cell, do *you* cease to exist? If no, you are not a set. You are a concrete object that *has* parts."
  *   **Intervention (Identity):** Draw two circles overlapping. "If Composition were Identity, 'The Parts' and 'The Whole' would be two names for one thing. Then the SCQ is trivial. We are assuming Composition is *distinct*. The parts exist. Does the *whole* also exist?"

  #### 00:15 – 00:30: The Example (The Organism)
  *   **Board Center:** Add "The Organism."
  *   **Scenario A (Normal):** Cells touching, functioning, alive. (Everyone agrees composition occurs).
  *   **Scenario B (Corpse):** Cells touching, no function, not alive. (Does the organism exist? Or just the cells?)
  *   **Scenario C (Scattered):** Cells separated by 1 meter, functionally linked wirelessly. (Contact fails. Function holds. Life holds?)
  *   **Goal:** Drive a wedge between Contact, Function, and Life. This kills the "Obviously they must touch" intuition before you even state the SCQ.

  #### 00:30 – 00:55: The Three Answers (Develop These Only)
  *   **Board Right:** "Answers to SCQ."
  *   **1. Nihilism (Nothing Composes):** Only simples exist. "You" are a fiction; there are only cells arranged *you-wise*.
      *   *Misconception Check:* "But I'm sitting on a chair!" -> "The Nihilist says there are particles arranged chair-wise. They deny the *object* 'chair'."
  *   **2. Moderation (Restricted Composition):** Composition occurs only when X (Contact? Life? Causal Interaction?).
      *   *Misconception Check:* "Restricted is obviously right." -> Push Scenario C (Scattered Organism). If life matters more than contact, Moderation needs a complex rule. If contact matters more than life, the corpse is you but the scattered brain isn't. Show the arbitrariness.
  *   **3. Universalism (Unrestricted Composition):** Any things compose a whole. There is an object made of your nose and the Moon.
      *   *Instructor View Management:* Do not say "I believe this." Say: "This view accepts all the weird objects to avoid the arbitrariness of Moderation. It pays an ontological cost to save theoretical simplicity."
  *   **Drop:** **Brute Composition.** It stops inquiry. Mention it only as "Some say there's no answer, it just happens," then discard it as unexplanatory for a 2nd-year course.

  #### 00:55 – 01:05: The Grounding Hangover (Crucial)
  *   **Context:** They just learned Grounding. They will try to say: "The chair exists *because* it is grounded in the particles. So the dispute is verbal."
  *   **Action:** Distinguish **Ontological Commitment** from **Ontological Ground**.
  *   **Script:** "Grounding explains *why* something exists. The SCQ asks *if* it exists. A Nihilist can agree the particles ground the 'chair-talk' but deny the chair object. This is not a verbal dispute about 'chair'; it is a dispute about how many objects are in the room. One says 1,000,000 (particles). The other says 1,000,001 (particles + chair)."
  *   **Why here?** If you do this earlier, they won't engage with the SCQ. If you do it later, they've already dismissed the question. Do it after they see the cost of the answers.

  #### 01:05 – 01:10: The Refusal
  *   **Topic:** **Priority (Which is prior, the One or the Many?)**
  *   **Script:** "You might want to ask: 'Are the parts prior to the whole, or the whole to the parts?' That is a question about *ontological dependence*. We are doing *composition*. We are asking for the *conditions* under which the many yield the one. We are bracketing priority. If we mix them, we confuse *existence* with *fundamentality*. We will not answer priority today."
  *   **Why:** This prevents them from using Week 2's grounding tools to "dissolve" Week 3's question. It keeps the SCQ distinct.

  #### 01:10 – 01:20: Assessment & Wrap
  *   **Instructor View:** If you must reveal, do it now. "I lean toward Universalism because 'Contact' and 'Function' seem too vague to be metaphysical boundaries. But that is a theoretical preference, not a fact."
  *   **Exit Question:** Do not ask them to recite the views. Ask them to map the disagreement.
      *   *Question:* **"The Nihilist and the Universalist look at a room with two particles. The Nihilist counts 2 objects. The Universalist counts 3. Describe the third object the Universalist sees, and explain why the Nihilist denies it is an *object* rather than just *two objects*."**
      *   *Why this works:* It forces them to articulate the ontological commitment of Universalism (the fusion) and the core denial of Nihilism (that composition adds to the count). It cannot be answered by memorizing "Nihilism says nothing exists."

  ### 4. Misconception Management Map

  | Misconception | When it will arise | How to head it off |
  | :--- | :--- | :--- |
  | **"It's just a set"** | During Parthood intro (00:05) | Use the metabolic turnover argument immediately. Sets don't change members; organisms do. |
  | **"It's a verbal dispute / Grounding"** | During Answers (00:40) | Distinguish *existence* (count) from *grounding* (explanation). Use the "1,000,000 vs 1,000,001" count. |
  | **"Chairs obviously exist"** | During Nihilism (00:35) | Grant the *utility* of chair-talk, deny the *ontology*. "Nihilists sit on particles arranged chair-wise." |
  | **"Restricted is obvious"** | During Moderation (00:45) | Use the Scattered Organism case. Force them to choose: is Contact or Life the boundary? Show both yield counter-intuitive results. |
  | **"Answer must be same in all worlds"** | During Wrap (01:15) | Clarify that SCQ seeks a *necessary* truth, but we test it using *contingent* intuitions in possible worlds. |

  ### 5. Summary of Choices

  *   **Example:** The Human Organism (bridges to Week 8, resists sets, allows scattering).
  *   **Distinctions:** Identity vs. Composition (First), Constitution (Deferred to Week 8).
  *   **Answers Developed:** Nihilism, Moderation, Universalism. (Bruteness dropped).
  *   **Refusal:** Priority of One vs. Many (Keeps Grounding separate from Composition).
  *   **Instructor View:** Revealed at the end as a matter of *theoretical virtue* (simplicity vs. common sense), not dogma.
  *   **Assessment:** The "Object Count" question (Tests ontological commitment, not definition memory).
