  "ledger": [three objects, one per wilderness temptation, {"temptation": "bread" | "miracle" | "authority over conscience", "institution_in_kaspara": string (max 15 words), "verdict": "load-bearing" | "decorative" | "transformed", "why": string (max 25 words)}],
  "clauses": {"disclosure_rule": {"helps_rell": string (max 40 words), "helps_anselm": string (max 40 words), "last_word": string}, "preserve_clause": {"helps_rell": string (max 40 words), "helps_anselm": string (max 40 words), "last_word": string}},
  "curtain": {"final_line": string (verbatim, max 25 words), "vote_lean": "Rell" | "Kraul" | "open", "why": string (max 25 words)}}
