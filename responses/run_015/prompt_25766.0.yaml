prompt: |-
  At a recent faculty meeting, two of my colleagues got into a protracted argument about a hiring decision that had just been made, and I have been turning it over ever since. The situation was this. Our department's hiring committee has three members, and they were evaluating a candidate for a tenure-track position. The department had agreed in advance on two criteria: the candidate should be hired if and only if (a) their research program is excellent, and (b) they can cover our undergraduate teaching needs. The three committee members voted as follows:

  - Alvarez: research excellent (yes), teaching fit good (yes) → would vote to hire.
  - Berg: research excellent (yes), teaching fit poor (no) → would vote not to hire.
  - Chen: research mediocre (no), teaching fit good (yes) → would vote not to hire.

  The committee then faced a procedural question: should they vote on each criterion separately and let the conjunction determine the outcome, or should they vote directly on the overall hiring decision? If they vote on criteria separately, both criteria pass 2–1, the conjunction is satisfied, and the candidate is hired. If they vote on the overall decision directly, the vote is 2–1 against hiring.

  My colleague David argued that voting on the criteria separately is the only coherent approach. The department set out two necessary and jointly sufficient conditions; the committee's job is to determine whether those conditions are met. If a majority finds each condition satisfied, then by the department's own standard, the candidate should be hired. To do otherwise — to vote down a candidate who satisfies both criteria according to majority judgment — is to contradict the very standard the department adopted.

  My colleague Esther argued that this outcome is perverse. A majority of the committee does not want to hire this candidate. Two out of three members would vote no on the final decision. If a procedure generates an outcome that a majority opposes, you have undermined the point of having a vote at all. The criteria are tools for reaching a judgment, not axioms from which a hiring decision must be mechanically deduced against the will of the majority.

  David replied that Esther's position amounts to letting the majority be inconsistent: the majority says the research is excellent and the teaching fit is good, yet somehow the candidate should not be hired. If the department's own criteria are correct, that combination makes no sense. Esther countered that there is no inconsistency because "the majority" is not a single person — it is different majorities on different questions, and the only thing that should ultimately matter is what a majority of the committee wants to do.

  David came back with this: suppose the committee had instead voted on each criterion and then, seeing that both passed, someone proposed ignoring that result and voting on the conclusion directly. Wouldn't that look like an attempt to overturn a decision one dislikes by switching the procedure after the fact? Esther answered that this gets the order backwards — the question is which procedure is correct in the first place, not whether you can change it midstream, and her point is precisely that conclusion-based voting is the correct procedure from the start.

  They went back and forth for some time without resolution. I have been asked to weigh in, but I find both arguments compelling in different ways. Please adjudicate this dispute: who is right about which specific point, and is there a principled resolution, or does this reveal a genuine tension in how groups should make decisions?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Scenario:** A faculty hiring committee (3 members: Alvarez, Berg, Chen) evaluating a candidate based on two criteria: (a) Research Excellent, (b) Teaching Fit Good. Hire if and only if (a) AND (b).
      *   **Votes:**
          *   Alvarez: Yes (a), Yes (b) $\rightarrow$ Hire.
          *   Berg: Yes (a), No (b) $\rightarrow$ No Hire.
          *   Chen: No (a), Yes (b) $\rightarrow$ No Hire.
      *   **The Paradox:**
          *   *Premise-based voting (vote on criteria):* (a) passes 2-1 (Alvarez, Berg), (b) passes 2-1 (Alvarez, Chen). Both met $\rightarrow$ Hire.
          *   *Conclusion-based voting (vote on outcome):* Hire passes 1-2 (Only Alvarez). $\rightarrow$ No Hire.
      *   **The Dispute:**
          *   *David (Pro-Premise):* The department set criteria. If majority says criteria are met, logic dictates hire. Ignoring this contradicts the standard.
          *   *Esther (Pro-Conclusion):* A majority opposes hiring. Voting is about collective will/outcome, not mechanical deduction. Different majorities on different premises don't constitute a coherent "majority will."
      *   **Task:** Adjudicate the dispute. Who is right about which point? Is there a principled resolution? Is this a genuine tension?

  2.  **Identify the Core Concept:**
      *   This is a classic example of the **Discursive Dilemma** (or the **Doctrinal Paradox**).
      *   It originates in legal theory (Kornhauser & Sager, 1986) and social choice theory (List & Pettit, 2002).
      *   The core tension is between *consistency with reasons* (premise-based) and *responsiveness to majority will on the outcome* (conclusion-based).

  3.  **Evaluate David's Argument (Premise-Based):**
      *   *Strengths:* Respects the ex-ante agreed-upon rules. Ensures logical consistency in the group's judgment. Prevents "outcome voting" where people might vote based on hidden biases rather than the stated criteria. It treats the criteria as binding constraints.
      *   *Weaknesses:* Can lead to an outcome that no individual actually supports (in this case, the "Hire" outcome is supported only by Alvarez, yet it wins). It assumes the "group mind" can be constructed by aggregating judgments on premises, which might not reflect any actual member's holistic view.

  4.  **Evaluate Esther's Argument (Conclusion-Based):**
      *   *Strengths:* Respects the democratic principle that the outcome should reflect the will of the majority of agents. Each member exercises holistic judgment. Avoids the "tyranny of the premises" where a candidate is hired whom the majority explicitly rejects.
      *   *Weaknesses:* Can undermine the stated criteria. If the criteria are ignored, why have them? It allows for potential inconsistency (the group says "Research is good" and "Teaching is good" but "Don't Hire").

  5.  **Synthesize and Adjudicate:**
      *   *Is one "right"?* In social choice theory, there is no mathematically "correct" answer without normative assumptions. Both procedures satisfy some desirable properties and violate others.
      *   *David is right about:* Institutional integrity and logical consistency. If the department *bindingly* committed to the criteria as a policy, violating that policy undermines the rule of law within the department.
      *   *Esther is right about:* Democratic legitimacy and individual agency. A committee is a collection of people, not a logic machine. If 2/3 people think the candidate shouldn't be hired, forcing a hire creates resentment and lacks mandate.
      *   *The "Genuine Tension":* This is the key insight. It's not a puzzle to be solved by finding the one true answer; it's a structural feature of group deliberation. It reveals that "majority rule" is ambiguous when dealing with compound propositions.

  6.  **Develop a Principled Resolution:**
      *   Since there's no theoretical silver bullet, the resolution must be procedural/normative.
      *   *Timing:* The decision on *how* to vote must happen *before* the votes are cast (ex-ante), not after (ex-post). Esther is right that switching midstream is bad, but David is right that the criteria matter if agreed upon beforehand.
      *   *Nature of the Criteria:* Are the criteria *definitions* of merit (premise-based) or *guidelines* for individual judgment (conclusion-based)?
      *   *Recommendation:* Usually, in academic hiring, conclusion-based voting is preferred because tenure/hiring is a holistic judgment. However, if the criteria were set as a strict constraint (e.g., "Must have X grant"), premise-based is better.
      *   *Best Practice:* Deliberation. The paradox often arises from lack of communication. If they talk, Berg might convince Chen research matters more, or Chen might convince Berg teaching is critical. The vote should follow deliberation, not replace it.

  7.  **Drafting the Response:**
      *   **Introduction:** Acknowledge the depth of the problem. Name it (Discursive Dilemma/Doctrinal Paradox). Validate that both colleagues have identified real, competing values.
      *   **Analysis of David's Position:** Highlight the value of consistency, rule-following, and reason-based decision-making. Note the risk: "Hiring a candidate no one really wants."
      *   **Analysis of Esther's Position:** Highlight the value of democratic agency, holistic judgment, and avoiding outcomes opposed by the majority. Note the risk: "Undermining stated standards."
      *   **The Verdict:** Neither is objectively "right" in a vacuum. It depends on the normative weight given to *procedural integrity* vs. *collective will*.
      *   **Resolution:**
          1.  **Ex-Ante Agreement:** The method of aggregation must be decided before voting.
          2.  **Deliberation:** The paradox thrives in silence. Discussion aligns premises.
          3.  **Context:** For hiring (holistic), conclusion-based is often standard, but criteria should guide the discussion.
      *   **Conclusion:** It reveals a genuine tension. The department needs to decide what kind of body it wants to be (a logic machine or a democratic body).

  8.  **Refining the Tone:**
      *   Maintain neutrality but provide clarity.
      *   Use the specific names (David, Esther, Alvarez, etc.) to keep it grounded.
      *   Ensure the distinction between "majority of propositions" vs. "majority of people" is clear.

  9.  **Self-Correction/Check during drafting:**
      *   *Did I answer the prompt?* Yes, adjudicate the dispute, identify who is right on specific points, and address the principled resolution.
      *   *Is the logic sound?* Yes, this is a standard problem in judgment aggregation theory.
      *   *Did I miss anything?* I should emphasize that switching procedures *after* seeing the votes (as David suggested in his hypothetical) is definitely wrong, validating part of Esther's rebuttal there.

  10. **Final Polish:** Organize with clear headings for readability. (Proceed to generate output based on this structure.)
answer: |-
  This is a classic instance of what social choice theorists and legal scholars call the **Discursive Dilemma** (also known as the **Doctrinal Paradox**). It was famously formalized by Lewis Kornhauser and Lawrence Sager in the context of judicial decisions, and later by Philip Pettit and Christian List in political philosophy.

  You have asked for an adjudication. The short answer is that **neither David nor Esther is objectively "right" in a vacuum,** because they are prioritizing two different, incompatible democratic values. However, they are each right about specific risks, and there is a principled way to resolve the tension procedurally.

  Here is the breakdown of the dispute, the theoretical underpinnings, and a recommendation for your department.

  ### 1. Adjudicating the Specific Points

  **Where David is Right: Institutional Integrity and Consistency**
  David is correct that if the department explicitly adopted the criteria ("Hire if and only if A and B") as a binding policy, ignoring the outcome of those criteria undermines the rule of law within the department.
  *   **The Point:** Premise-based voting (voting on criteria) ensures that the group's *reasons* are consistent. It prevents the group from asserting "Research is excellent" and "Teaching is good" but concluding "Do not hire."
  *   **The Risk he identifies:** If you ignore the criteria, you render them meaningless. Future candidates will not know what standards they are being held to, and the committee becomes arbitrary.

  **Where Esther is Right: Democratic Agency and Collective Will**
  Esther is correct that a committee is composed of individuals, not a single logical entity. In a democratic vote, the standard metric of legitimacy is usually "does the majority of *people* support this outcome?"
  *   **The Point:** Conclusion-based voting (voting on the hire) respects the holistic judgment of the members. In your scenario, the "Hire" outcome is supported by only **one** person (Alvarez). To hire the candidate is to impose a decision on Berg and Chen that *neither of them supports*.
  *   **The Risk she identifies:** Premise-based voting can create a "tyranny of the premises," where a candidate is hired whom the majority of the committee explicitly rejects. This creates resentment and lack of ownership over the new colleague.

  **Where David's Hypothetical Fails**
  David argued: *"Suppose... someone proposed ignoring that result and voting on the conclusion directly. Wouldn't that look like an attempt to overturn a decision one dislikes by switching the procedure after the fact?"*
  *   **Verdict:** **Esther is right here.** David's hypothetical describes *procedural manipulation*. If the voting method was not decided ex-ante, changing it after seeing the tally on the premises is indeed illegitimate. However, Esther's main point is that the conclusion-based method should have been the default *from the start*, not a mid-stream switch.

  ### 2. The Genuine Tension

  This dispute reveals a **genuine tension** in how groups make decisions. It is not a puzzle with a hidden mathematical solution; it is a conflict of values.

  *   **Premise-Based Procedure (David):** Prioritizes **Reason**. It treats the committee as a truth-seeking body that must be logically consistent. It assumes the criteria are more important than the individual preferences of the voters.
  *   **Conclusion-Based Procedure (Esther):** Prioritizes **Will**. It treats the committee as a democratic body where the authority lies with the agents, not the logic. It assumes the collective judgment of the members is superior to a mechanical aggregation of their sub-judgments.

  Mathematically, you cannot satisfy both "Majority rule on premises" and "Majority rule on conclusion" simultaneously when preferences are structured like this (Alvarez/Berg/Chen). One must yield.

  ### 3. A Principled Resolution

  Since theory cannot dictate the "correct" value, the resolution must be **procedural and contextual**. Here is how you should weigh in:

  **A. The Ex-Ante Rule (The most important principle)**
  The department must decide *before* the committee evaluates candidates how the vote will be aggregated.
  *   If the department views the criteria as **strict constraints** (e.g., "Must have a PhD" AND "Must teach Logic"), then **Premise-Based** voting is appropriate. These are binary hurdles.
  *   If the department views the criteria as **guidelines for holistic judgment** (e.g., "We want someone good, weighing research and teaching"), then **Conclusion-Based** voting is appropriate.
  *   **Resolution:** In academic hiring, the latter is usually the norm. Hiring is a holistic judgment. A candidate might be mediocre in research but so transformative in teaching that one member votes to hire, while another weighs research heavier. Premise-based voting forces a false equivalence on how members weigh the criteria.

  **B. The Role of Deliberation**
  The Discursive Dilemma thrives in silence. It assumes members vote independently without discussing *why* they weigh criteria differently.
  *   Berg values Research > Teaching.
  *   Chen values Teaching > Research.
  *   **Resolution:** The committee should deliberate before voting. If Berg and Chen discuss their weights, they might realize they both agree the candidate is not a *priority*, even if they disagree on why. Deliberation often aligns premises, dissolving the paradox. If they cannot agree after talking, the Conclusion-Based vote is safer for departmental harmony.

  **C. The "No One Wants It" Test**
  Apply this heuristic: **Does any single member of the committee actually support the outcome generated by the Premise-Based vote?**
  *   In your scenario, the Premise-Based vote yields "Hire."
  *   Who supports "Hire"? Only Alvarez.
  *   Berg and Chen both voted "No Hire" on the conclusion.
  *   **Resolution:** It is generally perverse for a committee to enact a decision that **zero** members of the majority support. While Alvarez is happy, Berg and Chen are being forced to hire someone they explicitly rejected. Conclusion-based voting ensures that the winning outcome is actually preferred by a majority of the people.

  ### Recommendation for Your Department

  You should advise your colleagues as follows:

  1.  **Acknowledge the Paradox:** Validate that both David and Esther have identified real, competing democratic virtues (Consistency vs. Responsiveness). This is not a case of one person being logical and the other emotional.
  2.  **Default to Conclusion-Based Voting for Hiring:** For tenure-track hires, **Esther's approach is generally superior.** Hiring is a holistic judgment about a colleague, not a logic puzzle. A new hire requires the support of the majority of the faculty to succeed. Hiring a candidate that 2/3 of the committee voted against (even if they voted against for different reasons) is a recipe for a toxic arrival.
  3.  **Clarify the Criteria:** David is right that criteria shouldn't be ignored. However, criteria should guide the *deliberation*, not mechanically determine the *vote*. The committee should discuss whether the candidate meets the spirit of the criteria, rather than ticking boxes.
  4.  **Fix the Procedure Ex-Ante:** For future searches, the department must vote on the *voting procedure* before the committee is formed. Do not leave it to the committee to decide mid-stream.

  **Summary Verdict:**
  David is right that standards matter, but he is wrong that logic dictates the procedure. Esther is right that the majority will on the outcome matters most in a personnel decision. **Esther wins this specific dispute** because in hiring, the legitimacy of the outcome depends on the support of the people who must work with the candidate, not the logical consistency of the criteria checklist. However, David wins the broader point that the department must agree on *how* to decide before the process begins.
