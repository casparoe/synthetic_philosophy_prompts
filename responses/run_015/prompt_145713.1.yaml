  # Sorting Instrument: Rational Coordination in Symmetric Dilemmas

  ## Part I: The Decision Tree

  **Root Claim:**
  "In calculating my expected utility for the Luring Lottery, I should treat the other agents' entry counts as fixed parameters independent of my own deliberation."

  *   **Agree:** Proceed to **Leaf A**.
  *   **Disagree:** Proceed to **Question 1**.

  **Question 1:**
  "Since you reject causal independence, is the link between your choice and theirs merely *statistical evidence* (your choice signals what they likely did) or is it *logically constitutive* (your reasoning process *is* their reasoning process)?"

  *   **Statistical Evidence:** Proceed to **Leaf B**.
  *   **Logically Constitutive:** Proceed to **Question 2**.

  **Question 2:**
  "In the Platonia Dilemma, does the requirement for logically identical reasoning compel you to select a single, determinate action (e.g., 'Send' or 'Do Not Send') for all agents?"

  *   **Yes (Determinacy Required):** Proceed to **Leaf C**.
  *   **No (Probabilistic Output Permitted):** Proceed to **Question 3**.

  **Question 3:**
  "When adopting a probabilistic strategy (e.g., sending with probability $1/20$), is your primary justification that this maximises the *collective* expected payoff for the group of reasoners, or that it maximises *your individual* expected utility conditional on your output being logically mirrored?"

  *   **Collective Payoff:** Proceed to **Leaf D**.
  *   **Individual Utility:** Proceed to **Leaf E**.

  ---

  ## Part II: Taxonomic Assignment and Analysis

  ### The Occupied Leaves

  **Leaf A: The Causal Independence Position**
  *   **Assigned Position:** 1. Standard Non-cooperative (Nash/CDT).
  *   **Diagnosis:** This agent treats the scenario as a standard game against nature or independent players. In the Luring Lottery, they will submit entries up to the point where the marginal cost equals the marginal expected return, ignoring the symmetry of reasoning. In the Platonia Dilemma, they may play a mixed-strategy Nash equilibrium ($p=1/20$), but solely because it is a stable equilibrium against independent opponents, not because of any logical correlation. They reject the premise that their deliberation influences the logical state of other agents.

  **Leaf B: The Evidential Position**
  *   **Assigned Position:** 4. Evidential-Reasoning Approach (EDT).
  *   **Diagnosis:** This agent accepts that their choice correlates with others but views the correlation as diagnostic rather than ontological. In the Luring Lottery, they reason: "If I submit many entries, it is likely that others (who reason like me) have also submitted many, reducing the prize value." They curb their entries not because they *cause* others to do so, but because their entry count is *evidence* of a high total pool. They stop short of claiming their decision *is* the others' decision.

  **Leaf C: The Sceptical Position**
  *   **Assigned Position:** 5. Sceptical Stance.
  *   **Diagnosis:** This agent accepts logical constitution but insists that identical reasoning must yield identical *determinate* actions. In the Platonia Dilemma, they recognise that if 'Send' is rational for one, it is rational for all, leading to zero payoff. If 'Don't Send' is rational, the payoff is also zero. Concluding that rational choice theory yields a contradiction or paralysis in symmetric, non-communicating contexts, they deny the applicability of the framing. They argue that without private distinguishing information (a "focal point"), rationality cannot break the symmetry deterministically.

  **Leaf D: The Superrational Position**
  *   **Assigned Position:** 2. Hofstadter's Explicit-Randomisation Superrationality.
  *   **Diagnosis:** This agent accepts logical correlation and probabilistic outputs but grounds the strategy in a normative commitment to the group of reasoners. In the Platonia Dilemma, they randomise with $p=1/20$ because this is the strategy that, if adopted by all, maximises the group's chance of a winner. The justification leans towards a form of rational altruism or a "pact" among superrationalists: "I do this because we *ought* to do this together." The randomisation is an explicit tool to achieve the cooperative optimum.

  **Leaf E: The Algorithmic Position**
  *   **Assigned Position:** 3. Logical/Algorithmic Correlation (FDT/TDT).
  *   **Diagnosis:** This agent accepts logical correlation and probabilistic outputs but grounds the strategy strictly in individual expected utility maximisation via logical counterfactuals. In the Platonia Dilemma, they output $p=1/20$ not to help the group, but because the function `MyDecision()` is identical to `OtherDecision()`. Therefore, maximising the utility of `MyDecision()` *logically entails* maximising the utility of the joint output. The randomisation is not a moral pact but the optimal output of the computational algorithm.

  ---

  ## Part III: Structural Diagnostics

  ### Unoccupied Combinations

  **1. Causal Dependence without Logical Identity (The "Magic" Branch)**
  *   **Location:** Root Claim = Disagree; Question 1 = Causal Influence.
  *   **Diagnosis:** This node is empty. In the scenarios as described (non-communicating, spatially separated agents), there is no physical mechanism by which one agent's deliberation causally influences another's action outside of logical correlation or common cause. To occupy this node would require believing in backwards causation or telepathy, which falls outside standard rational decision theory.

  **2. Logical Identity with Deterministic Success (The "Focal Point" Branch)**
  *   **Location:** Question 2 = Yes; Outcome = Success.
  *   **Diagnosis:** This node is theoretically possible but empty in the *strictly symmetric* formulations of Platonia/Lottery provided. If agents possessed private distinguishing information (e.g., "Agent with the earliest birthday sends"), they could select a determinate action successfully. However, the prompt specifies agents possess "no private distinguishing information." Under strict symmetry, a determinate action leads to collision (Platonia) or dilution (Lottery). Thus, accepting Determinacy + Symmetry forces the Sceptical conclusion (Leaf C).

  ### Indistinguishable Leaves

  **Leaf D (Hofstadter) and Leaf E (Algorithmic)**
  *   **Behavioural Coincidence:** In both the Platonia Dilemma and the Luring Lottery, Leaf D and Leaf E prescribe identical actions. Both will randomise with $p=1/N$ in Platonia and submit the minimum entry (one postcard) in the Luring Lottery.
  *   **Reason for Indistinguishability:** Both positions accept the premise of logical correlation and the necessity of mixed strategies to resolve symmetric dilemmas. The divergence is purely meta-ethical and metaphysical (Normative Group Optimisation vs. Individual Logical Counterfactuals).
  *   **Seminar Note:** To separate these students during the session, you must press them on *counterfactual robustness*. Ask: "If you could verify that your deviation would *not* be logically mirrored (e.g., you are the only superrationalist among causal agents), would you still cooperate?"
      *   **Leaf D (Hofstadter):** May still cooperate out of normative commitment to the *ideal* of superrationality.
      *   **Leaf E (Algorithmic):** Will defect immediately, as the logical link required for their utility calculation is broken.

  ### Diagnostic Limitations

  **The Evidential vs. Algorithmic Distinction (Leaf B vs. Leaf E)**
  *   **Limitation:** In single-shot games with no prior history, Evidential Decision Theory (Leaf B) and Algorithmic Decision Theory (Leaf E) often converge on the same recommendations (e.g., "Don't defect in Prisoner's Dilemma against a mirror").
  *   **Differentiation:** The tree separates them via Question 1's phrasing ("Evidence" vs "Constitutive"). However, students may struggle to distinguish "my choice is evidence of theirs" from "my choice is the same computation as theirs."
  *   **Clarification:** Emphasise that for Leaf B, the correlation is contingent on psychological similarity (which could break), whereas for Leaf E, the correlation is necessary given the algorithmic identity (it cannot break without changing the agent).

  ---

  ## Part IV: Instructions for the Convenor

  1.  **Administration:** Present the Root Claim and Questions sequentially. Do not reveal the leaf names until the participant reaches the end of their branch.
  2.  **Interpretation:** If a participant hesitates at Question 3, ask them to imagine the prize in the Luring Lottery is money they personally value versus money to be donated to a charity they value equally. If their strategy changes based on whether the *group* benefits or *they* benefit (logically), they distinguish between Leaf D and Leaf E.
  3.  **Sceptics:** Participants arriving at Leaf C should be encouraged to articulate whether they believe the problem is unsolvable (rationality fails) or under-specified (requires external coordination). This distinguishes the hard sceptic from the coordination-seeker.
  4.  **Tone:** Maintain neutrality. The instrument maps intuitions; it does not validate one position as correct. Ensure British spelling conventions (e.g., *randomisation*, *optimise*, *behaviour*) are used in all written materials.
