      *   *Rival 2 (Institution/Sanction):* User says obligation exists without sanction. Rival 2 says no obligation without enforcement. *Difference:* Empty street jaywalking (no sanction) = User says No Obligation, Rival 2 says No Obligation. Wait, need a case where sanction is absent but obligation exists. Queue jumping (no sanction). User says Yes (if people behind). Rival 2 says No.
      *   *Rival 3 (Meaning/Expectation):* User says Harm/Reciprocity is key. Rival 3 says Meaning is key. *Difference:* Tipping. User says Over-tipping harms (economic distortion). Rival 3 says Over-tipping signals disrespect.

  6.  **Assess Falsifiability (Escape Routes):**
      *   Are "demeaning" and "cost-shifting" get-out-of-jail-free cards?
      *   *Honest Assessment:* They risk being unfalsifiable unless defined independently of the convention itself. If "cost-shifting" just means "I don't like this cost," it's circular.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the sophistication of the view. It's a robust "Principle of Fairness" account applied to conventions.
      *   *Section 1: The Defeaters (Ranked).*
          *   1. The "Constitutive Rule" Objection (Fatal). Some conventions *create* the possibility of the act. (e.g., Money, Promises). Your test treats them as external costs.
          *   2. The "Identifiable Victim" Objection (Fatal/serious). The empty queue case. If no one is harmed, is it permissible? Most say no. Your view says yes.
          *   3. The "Bad Scheme" Objection (Serious). Bribery. If the bribe scheme is efficient and reciprocal, does it bind? Your escape routes need to do heavy lifting.
      *   *Section 2: Addressing the Four Worries.*
