      *   *Core Mechanism:* Fairness/Reciprocity + Expectation/Harm.
      *   *Key Constraint:* Identifiable harm/expectation (no "free-floating" duties).

  3.  **Address the Four User Worries (Directly):**
      *   *Worry 1 (Over-generation/Bribery/Hazing):* The user fears the test validates bad norms.
          *   *Analysis:* The "escape routes" (demeaning/cost-shifting) are meant to handle this. But are they enough? If the bribe scheme is stable and everyone benefits (efficiency), does the test condemn it?
          *   *Verdict:* This is a major vulnerability. If the test relies *only* on internal reciprocity, it lacks a moral anchor outside the scheme.
      *   *Worry 2 (Empty Queue):* No one behind, no one knows.
          *   *Analysis:* User's test says "identifiable person worse off." If no one is there, no one is worse off. So the test says "no obligation." But intuition says "queue jumping is wrong *in principle*."
