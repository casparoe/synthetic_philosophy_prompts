  8.  **Refining the Philosophy (Self-Correction during drafting):**
      *   *Correction:* The user's view is very close to H.L.A. Hart's "Principle of Fairness" but applied to informal conventions. The strongest critique of Hart comes from Nozick (benefits must be *accepted*, not just received). I should mention this.
      *   *Correction:* The "Empty Queue" case is actually a "Rule Consequentialist" vs. "Act Consequentialist" fight. The user is acting like an Act Consequentialist regarding harm. The defeater is that conventions are *rules*, not act-by-act calculations.
