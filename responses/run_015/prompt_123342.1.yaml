          *   *Verdict:* Attacks the "reciprocity" vs. "respect" distinction.
      *   *Worry 4 (Unity of Three Types):* Do Coordination, Distribution, and Transfer need different theories?
          *   *Analysis:* Coordination (driving side) is about efficiency. Distribution (queues) is about fairness. Transfer (tipping) is about gratitude/contract.
          *   *Verdict:* A "unified field theory" risk.

  4.  **Develop the Strongest Case Against (The Defeaters):**
      *   *Fatal Defeater:* The "Identifiable Victim" Problem (Worry 2 & 3). If morality requires an identifiable victim, it fails to capture *institutional* wrongs or *constitutive* rules. (Reference: Rawls on practices, Gilbert on joint commitment).
      *   *Serious Defeater:* The "Bad Convention" Problem (Worry 1). If the scheme is internally reciprocal but externally unjust (e.g., segregation, bribery), does the test obligate? If the escape routes fix this, are they ad hoc?
      *   *Awkward Defeater:* The "Psychological Reality" Problem. Do people actually feel obligations based on *this* calculation? Or do they feel them based on authority/symbolism?

  5.  **Address Predictive Differences (Rivals):**
