answer: |-
  You have put your finger on one of the most persistent and debated tensions in the philosophy of biology and metaethics. There is no single, universally standardized noun (like "the Doppler Effect") for this specific move, but in contemporary literature, it is most precisely discussed as **"Genealogical Asymmetry"** within the framework of **Evolutionary Debunking Arguments (EDAs)** versus **Evolutionary Vindication.**

  Sometimes it is referred to as **"Selective Evolutionary Naturalism"** or **"Asymmetrical Skepticism."**

  However, a label isn't what you asked for; you want the *carving*. You want to know how philosophers distinguish the domains where origins undermine truth from the domains where origins ground normativity. Here is the philosophical anatomy of that asymmetry, where it holds, and where it collapses.

  ### 1. The Phenomenon: Explaining Away vs. Explaining Ground
  The asymmetry you noticed relies on two different functions of a genealogical (evolutionary) explanation:

  *   **For Religion (Explaining Away):** Darwin treats the evolutionary origin as an **undercutting defeater**. If belief in God is fully explained by hyper-active agency detection and causal reasoning, the *truth* of the belief becomes explanatorily unnecessary. The origin replaces the object. (This is the classic **Genetic Fallacy** structure, but arguably justified if the belief is truth-apt).
  *   **For Morality (Explaining Ground):** Darwin treats the evolutionary origin as a **constitutive foundation**. The moral sense *is* the social instinct. He does not think evolution explains morality *away*; he thinks it explains how morality *exists*. Furthermore, he often slips into using the *outcome* of evolution (social cohesion, sympathy) as a normative standard to judge behavior.

  ### 2. The Carving: Where the Distinction Lives
  Philosophers argue this asymmetry is only principled (i.e., not just special pleading) if you accept specific metaethical distinctions between the two domains. The "carving" happens along three lines:

  #### A. Truth-Aptness (Cognitivism vs. Non-Cognitivism)
  *   **Religion:** Makes **propositional claims** about reality (e.g., "A deity exists"). These are truth-apt (true or false). If evolution explains why we believe this without the deity actually existing, the belief is false.
  *   **Morality:** Darwin often treats moral judgments as **expressions of sentiment** (e.g., "Sympathy feels binding"). If morality is not about mind-independent facts but about human social instincts, then evolution doesn't "debunk" it; it *creates* it.
  *   **The Boundary:** The asymmetry holds if Religion is **Realist** (claims about external facts) and Morality is **Sentimentalist/Constructivist** (claims about internal commitments). If you claim Morality is also Realist (mind-independent moral truths), the asymmetry collapses (see Sharon Street below).

  #### B. Adaptation vs. Byproduct (Spandrel)
  *   **Religion:** Darwin hints that religious belief is a **byproduct** (what Gould later called a spandrel) of other cognitive faculties. It is "noise" in the system.
  *   **Morality:** Darwin views the moral sense as a direct **adaptation** for social cohesion. It is "signal."
  *   **The Boundary:** We generally trust adaptive traits to track *something* useful (survival), whereas byproducts track nothing. However, this is a weak boundary: an adaptive belief can be useful but false (e.g., an overconfidence bias).

  #### C. External vs. Internal Authority
  *   **Religion:** Authority is **external** (God commands it). If God is removed by evolutionary explanation, the authority vanishes.
  *   **Morality:** Authority is **internal** (My conscience binds me). Evolution explains *why* I have a conscience, but the binding force is experienced internally.
  *   **The Boundary:** This allows Darwin to use moral standards to judge evolution (e.g., "we *ought* to expand sympathy"). He is using the internal norm to grade the external process.

  ### 3. Is It Inconsistent? (The "Darwinian Dilemma")
  Whether this move is inconsistent depends entirely on your metaethical stance.

  **It IS Inconsistent if:**
  You are a **Moral Realist**. If you believe moral truths exist independently of human opinion (like math or physics), then evolution debunking applies to morality just as it does to religion.
  *   **The Critic:** Philosopher **Sharon Street** formulated this as the **"Darwinian Dilemma."** She argues that if evolution shaped our moral beliefs for survival, they track *fitness*, not *truth*. Therefore, you cannot use evolutionary origins to vindicate moral truth. If you debunk religion this way, you must debunk morality the same way.
  *   **The Result:** This leads to **Moral Error Theory** (e.g., Richard Joyce, J.L. Mackie), which applies the "religion treatment" to morality: both are useful fictions generated by evolution.

  **It IS Consistent if:**
  You are a **Moral Sentimentalist** or **Constructivist**. If moral truths are *made* by human valuing, then evolution explains the mechanism of that valuing.
  *   **The Defense:** Darwin is effectively arguing that morality is not a set of external laws we discover (which evolution could debunk), but a set of internal instincts we possess. We can then reflectively endorse those instincts (e.g., "Sympathy is good") without needing them to be "true" in a cosmic sense.
  *   **The Result:** This is **Quasi-Realism** (Simon Blackburn). We talk *as if* morality is objective, but its foundation is our evolved nature. In this view, the asymmetry is valid because religion claims cosmic facts (which evolution undermines) while morality claims human values (which evolution grounds).

  ### 4. Where the Move Stops Working (The Limits)
  The asymmetry breaks down—becoming mere special pleading—at two specific points:

  1.  **The Naturalistic Fallacy:** When Darwin moves from "We evolved to feel sympathy" (Is) to "We *ought* to expand sympathy" (Ought). If he uses the evolutionary origin to *justify* the norm, he is committing the Naturalistic Fallacy. He can only use evolution to *explain* the norm, not validate it, unless he assumes survival/social cohesion is inherently good (which is a moral claim, not a scientific one).
  2.  **Reliability Challenges:** If evolution shapes our cognitive faculties to believe in God (for comfort/cohesion), why trust those same faculties when they tell us about morality? If the engine is compromised for religion, it is compromised for morality. To avoid this, one must argue that moral reasoning is **reflectively stable** (we endorse it upon reflection) while religious reasoning is not.

  ### Summary for Your Class
  If you need to name this in a paper, the most precise descriptive phrase is **"Genealogical Asymmetry"** regarding **Evolutionary Debunking vs. Vindication.**

  *   **The Pattern:** Applying **Explanatory Exclusion** to Religion (origins replace truth) but **Explanatory Grounding** to Morality (origins constitute value).
  *   **The Justification:** It is valid only if one accepts **Moral Anti-Realism/Sentimentalism** (morality is about us) while treating Religion as **Realist** (god is about the world).
  *   **The Vulnerability:** It collapses under **Sharon Street's Darwinian Dilemma** if one claims moral truths are mind-independent. In that case, the move is indeed inconsistent **Selective Skepticism.**

  Darwin essentially wants to have his cake (naturalistic explanation of everything) and eat it too (objective moral progress). He achieves this by treating morality as a unique domain where "what evolved" and "what is good" converge, a move modern philosophers spend a lot of energy trying to either defend (Constructivism) or dismantle (Error Theory).
