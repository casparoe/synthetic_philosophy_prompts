  # JOINT STATEMENT ON METHOD IN THE SCIENCE OF CONSCIOUSNESS

  **Parties:** The Heterophenomenological Party (Side A) and The Phenomenal Realist Party (Side B).
  **Date:** [End of Collaboration Year]
  **Status:** Signed following one year of adversarial collaboration.

  ### I. THE LEDGER CLAUSE

  *The following rule governed all disputed claims C during this collaboration. The two clauses below are presented adjacently to record the precise boundary of our agreement and our remaining divergence.*

  | **The Methodological Concession** | **The Metaphysical Refusal** |
  | :--- | :--- |
  | Both Parties concede that if the ledger of C (the set of third-person detectable differences entailed by C) is empty, then C cannot be adjudicated by third-person scientific inquiry. | Neither Party concedes that a claim with an empty ledger is therefore empty, false, meaningless, or illegitimate as a subject of philosophical or personal commitment. |

  ### II. AGREED CLAIMS

  1.  **Reports as Data:** First-person reports constitute genuine data for the science of consciousness, not merely noise to be filtered out or errors to be corrected.
  2.  **Protocol Integrity:** Reports must be gathered under pre-registered protocols rather than ad-libbed in the lab to minimize experimenter bias and post-hoc rationalization.
  3.  **Systematic Unreliability:** Report-based methods are systematically unreliable in cataloguable ways, including confabulation, demand characteristics, retrospection errors, and the effects of conceptual training.
  4.  **Proven Utility:** Report-based methods have already delivered robust results in specific domains (e.g., the characterization of blindsight, the timing of conscious access in masking paradigms, or the structure of dream recall).
  5.  **No Privileged Pipeline:** Neither side possesses a privileged, infallible pipeline to the facts; third-person data can correct first-person reports, and first-person reports can correct third-person interpretations.
  6.  **Falsifiability:** Each side commits to specifying what empirical finding would place its own view in trouble, even if that finding would not definitively refute the view's metaphysical core.
  7.  **Ledger Transparency:** For any claim regarding the nature of experience, both sides agree to explicitly publish its ledger (the third-person consequences) alongside the claim itself.

  ### III. RESIDUAL DISAGREEMENT

  **Neutral Formulation:**
  Does the totality of facts about consciousness supervene on the totality of third-person physical and functional facts, or does the first-person perspective contain information that escapes third-person description even in principle?

  **Side A (Heterophenomenological) Formulation:**
  Consciousness is exhaustively described by the complex pattern of dispositions to report, react, and process information; to posit a "residue" beyond this pattern is to posit a difference that makes no difference.

  **Side B (Phenomenal Realist) Formulation:**
  Consciousness includes an intrinsic, felt quality that generates reports but is not identical to them; a science that renounces this quality may predict behavior perfectly while failing to explain why there is something it is like to be the subject.

  ### IV. CRUXES

  | Crux | Neutral Restatement | Side A Wording | Side B Wording | Agreed Test / Thought Experiment | Side A Prediction & Falsifier | Side B Prediction & Falsifier |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Silent Swap** | Can sensory qualities be transposed without changing any discrimination, task performance, or verbal disposition? | **Incoherent.** If all dispositions are fixed, nothing has changed. The supposition violates the principle of semantic stability. | **Coherent.** The intrinsic quality could shift while the functional label remains attached. The ledger is empty, but the fact is real. | **Conceivability Analysis.** Formalize the swap scenario and test for logical contradiction vs. mere empirical improbability. | **Prediction:** Scenario is logically incoherent.<br>**Falsifier:** A formal proof that the swap is logically consistent without behavioral change. | **Prediction:** Scenario is logically coherent.<br>**Falsifier:** A formal proof that the swap entails a logical contradiction. |
  | **2. The Residue Protocol** | After training in neuroscience and confabulation psychology, do subjects still avow a non-functional residue? | **Confabulation.** Avowals of residue are theory-laden errors that will vanish with sufficient sophistication. | **Direct Access.** Avowals of residue are reports of a non-functional fact that training cannot erase. | **Longitudinal Study.** Train subjects on Side A's theory, cross-examine reports, measure stability of "residue" avowals. | **Prediction:** Avowal rate drops to zero as sophistication increases.<br>**Falsifier:** Stable, high-confidence avowal of residue in 100% of trained subjects. | **Prediction:** Avowal rate stabilizes >0% regardless of sophistication.<br>**Falsifier:** Avowal rate drops to zero in all trained subjects. |
  | **3. The Indistinguishable Interlocutor** | Does a system functionally indistinguishable from a human possess consciousness? | **Yes.** Functional indistinguishability *is* the criterion for consciousness. The further question is empty. | **Maybe.** Functional indistinguishability ensures behavioral alignment, but not necessarily inner presence. | **Battery of Tests.** Pre-registered heterophenomenological indistinguishability battery applied to an artificial system. | **Prediction:** Passing the battery settles the question affirmatively.<br>**Falsifier:** Consensus that a passer is still a "zombie" despite perfect performance. | **Prediction:** Passing the battery leaves the question open.<br>**Falsifier:** Consensus that passing the battery makes the "zombie" question meaningless. |
  | **4. The Explanatory Gap** | Does explaining function explain experience? | **Yes.** Once the functional role is explained, the "gap" is recognized as a cognitive illusion. | **No.** Functional explanation leaves the "what it is like" fact unexplained. | **Theoretical Completion.** Assess whether a complete functional model feels like a complete explanation to experts. | **Prediction:** Gap closes as models improve.<br>**Falsifier:** Gap persists despite complete functional mapping. | **Prediction:** Gap persists despite complete functional mapping.<br>**Falsifier:** Gap closes as models improve. |

  ### V. CLOSING ANALYSIS: SUBSTANTIVE VS. VERBAL

  We conclude that the dispute is **MIXED**.

  **The Verbal Component:** A significant portion of the disagreement concerns the definition of the word *consciousness*. Side A uses the term to denote the functional/behavioral complex; Side B uses it to denote the intrinsic feel. If both parties agreed to use *consciousness* for the functional complex and *phenomenality* for the intrinsic feel, the debate over "what consciousness is" would dissolve into a debate over "what phenomenality does."

  **The Substantive Component:** A genuine ontological clash remains regarding the **Ledger Clause** itself. Side A holds that if the ledger is empty, the claim is scientifically vacuous and should be discarded from ontology. Side B holds that if the ledger is empty, the claim is scientifically inaccessible but ontologically robust. This is not a verbal dispute; it is a disagreement about whether reality contains facts that are in principle undetectable from the third-person standpoint. No amount of terminological stipulation can resolve whether such facts exist.

  **Signatures:**

  _________________________
  *Representative, Heterophenomenological Party*

  _________________________
  *Representative, Phenomenal Realist Party*

  **Bottom line:** We agree on the rules of science but disagree on whether science captures all of reality.

  \answer{MIXED}
