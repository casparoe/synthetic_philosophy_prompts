answer: |-
  ### The mapping

  Under the intentionalist map, the text is the Second Amendment, but the "author" is contested. Originalists debate whether authority resides in the Framers (Congress who drafted), the Ratifiers (State conventions), or the Ratifying Public (those who understood the text at enactment). *Heller* adopts a variant of objective intentionalism: original public meaning. Scalia treats the ratifying public as the author, prioritizing semantic content over subjective psychological intent. The evidence base excludes later legislative history or policy consequences, focusing instead on founding-era dictionaries, common law treatises (e.g., Blackstone), state constitutional analogues, and contemporaneous usage to fix semantic range. The interpreter's job is archeological: to recover the communicative content understood at the moment of ratification. This theory dictates that judges are bound by that recovered meaning, not by their own assessment of the text's wisdom or modern utility. The constraint is temporal; the meaning is fixed at enactment, even if applications evolve. Consequently, the interpreter must act as a historical linguist, distinguishing between the semantic meaning of "arms" or "people" and modern policy preferences. The theory promises neutrality by anchoring authority in a past democratic act, shielding judges from accusations of legislating from the bench. However, it requires a principled selection of which "author" counts—a choice the theory itself often stipulates rather than justifies—since Congress, the States, and the Public may have held divergent understandings of the militia clause's relationship to the operative clause.

  ### What the theory gets right

  Intentionalism accurately predicts the form of the *Heller* opinions. Both majority and dissent accept the premise that history constrains meaning; neither argues purely from policy efficacy. Scalia and Stevens both marshal historical evidence, treating the amendment as a communication from the past requiring decoding. The theory explains why the opinions focus heavily on definitions of "militia," "arms," and "keep and bear" rather than contemporary crime statistics. It predicts the methodological fight: since both sides accept the intentionalist mandate, they battle over the evidence base. Stevens emphasizes the prefatory militia clause to narrow the operative clause's scope, arguing the authors intended a collective right. Scalia emphasizes common law self-defense rights to argue for an individual right. Intentionalism explains why both feel compelled to claim historical fidelity; legitimacy derives from aligning with the author's will. Furthermore, the theory correctly identifies that without this historical anchor, constitutional adjudication risks becoming pure moral philosophy. It captures the instinct that a written constitution implies a commitment to past decisions, preventing each generation from rewriting the fundamental law according to present whims. The divergence in outcomes arises not from rejecting the theory, but from conflicting historical narratives, which intentionalism anticipates as a risk of evidentiary ambiguity rather than a theoretical failure.

  ### Where it breaks, and where it is silent

  The map tears at collective authorship. A legislature or ratifying public is a "many-minded" entity; there is no single psychological state to recover. Original public meaning attempts to bypass this by focusing on semantic uptake, but this collapses when usage was contested. More critically, intentionalism is silent on the level-of-generality problem. Was the authorial intent to protect "arms useful for militia," "arms for self-defense," or "arms in common use"? Scalia chooses "common use," but the theory provides no metric for this abstraction. If the intent was militia readiness, does that protect weapons the militia would actually use (e.g., machine guns), or only those typical of the founding era? The theory cannot determine the appropriate granularity of the principle without smuggling in normative judgments.

  Furthermore, intentionalism conflates intended meaning with expected applications. The Framers did not anticipate D.C. handgun bans. An honest intentionalist must ask: did they mean to forbid such bans, or did they simply not consider them? Scalia infers meaning from the absence of historical prohibitions, but this shifts from semantic content to counterfactual historical prediction. If the authors expected no such bans, does that mean bans are unconstitutional, or merely unanticipated? The theory offers no rule for translating static meaning to novel contexts. Finally, the selection of evidence is theoretically underdetermined. Why prioritize dictionaries over state ratification debates? Intentionalism stipulates the goal but lacks a methodology for weighing conflicting historical data. When evidence is sparse or contradictory, the theory goes silent, leaving judges to fill gaps with construction, yet it claims those constructions are discoveries. This silence allows judges to project preferences while wearing the mask of historical recovery.

  ### Diachronic authorship, assessed

  Your proposal of diachronic authorship—where meaning is an inheritance chain of interpretations—resembles common law constitutionalism. Given a fair run, it acknowledges that legal texts acquire meaning through application, not just enactment. It solves the novelty problem by allowing meaning to evolve with the lineage of precedent. However, this is not a third option alongside intentionalism and anti-intentionalism; it is anti-intentionalism wearing intentionalist clothing. It claims to respect the text but shifts authority from the original author to the interpretive lineage. While this mirrors actual legal practice, it collapses under the demand for advance notice. If the "author" is a lineage, citizens cannot know the law's requirements until a court speaks, as the meaning shifts with each generation's contribution. Law requires fixed points for coordination; diachronic authorship makes the ground fluid. It also lacks a stopping point: if every generation re-authors the text, the constraint of a written constitution vanishes. It is a coherent theory of cultural interpretation, but a dangerous one for constitutional law, where stability and notice are functional necessities. It explains how law *works* sociologically, but fails to justify why judges are bound by the past rather than empowered to update it.

  ### What the case does and does not show about texts generally

  Your suspicion is correct: the coordination demand does much of the work. Legal texts must settle disputes coercively between parties who cannot renegotiate. This institutional constraint forces legal interpreters to pretend certainty where literary interpreters can tolerate ambiguity. *Heller* looks intentionalist not because intentionalism is semantically superior, but because law requires a decisive authority to legitimize state force. Claiming to follow the "author's will" provides political cover for coercion. In literature, no one is jailed for misreading a poem; in law, rights are vindicated or denied. Therefore, *Heller* is poor evidence for the literary debate. It shows how institutions manage ambiguity under pressure, not how meaning is ontologically constituted. The "author" in law is a functional device for legitimacy, not necessarily a semantic reality. Literary intentionalism debates truth conditions; legal intentionalism debates power conditions. The glib friend misses that legal interpretation is a speech act of authority, not just understanding. The disanalogy bites here: literature invites interpretation; law demands settlement. The appearance of intentionalism in *Heller* is a byproduct of the need to justify coercion, not proof that authorial intent governs textual meaning generally.

  ### Bottom line

  Your friend is superficially right but structurally wrong. *Heller* employs intentionalist rhetoric, but only because law requires a legitimating myth to enforce coercion. Intentionalism fails as a semantic theory in *Heller* due to the level-of-generality problem and the fiction of collective intent. It succeeds only as a political technology for constraining judges. The case demonstrates not that intentionalism works, but that legal institutions cannot admit it doesn't.
