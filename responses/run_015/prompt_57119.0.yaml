answer: |-
  **MEMORANDUM**

  **TO:** State Sentencing Commission
  **FROM:** Commissioner [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Proposal to Strike Culpability Clause (Agenda Item 4)

  **RECOMMENDATION**

  I recommend that the Commission **REJECT** the proposal to strike the culpability clause and substitute a public-safety standard.

  While the intent to reduce incarceration and increase transparency is commendable, the validation data provided for the proposed risk instrument demonstrates that a pure quarantine model would result in excessive preventive detention that violates the proposal's own "least restrictive means" standard. We should retain the culpability clause as the primary anchor for sentencing. However, I direct Staff to study how validated risk instruments might inform *post-sentence* release mechanisms and rehabilitation programming within the existing culpability framework before the next legislative cycle.

  **REASONS**

  This proposal forces a choice between two competing philosophies of punishment: the Compatibilist (Desert) model and the Skeptic (Quarantine) model. Both offer coherent visions, but only one survives contact with the empirical data provided.

  **1. The Skeptic's Case: Honesty and Discipline**
  Proponents of the proposal argue that "culpability" is a metaphysical fiction used to mask the state's coercive power. They contend that retributive language is dishonest; in practice, we incarcerate to manage risk. By adopting a public-safety standard, the system would own its utilitarian nature. Theoretically, this should constrain the state: if detention is solely for prevention, it must be the "least restrictive means" necessary to prevent harm, subject to annual review. This model promises a system disciplined by data rather than moral intuition.

  **2. The Compatibilist Case: Capacity and Proportionality**
  Opponents argue that moral agency is not a fiction. Compatibilists maintain that desert tracks real capacities: offenders possess the ability to understand norms and conform their conduct, making them appropriate subjects of censure. The culpability clause ensures proportionality—the punishment must fit the crime, not the predicted future. Without this anchor, sentencing severs the link between the offense and the sanction. A low-risk murderer could be released immediately, while a high-risk burglar could be detained for a decade. This violates the fundamental intuition of justice and removes the ceiling on state power, allowing indefinite detention based on status rather than conduct.

  **3. Contact with the Numbers**
  The validation data resolves this philosophical tension. The proposed risk instrument identifies a "high-risk" group with a 30% violent recidivism rate over five years. Conversely, 70% of those flagged will *not* be charged with a violent offense in that period.

  The Skeptic model claims to be "better disciplined" than the retributive model. However, a system that detains seven people to prevent the potential crimes of three is not disciplined; it is indiscriminate. Under the proposal's own "least restrictive means" test, detaining the 70% who would not reoffend is unjustifiable. They pose no serious harm; therefore, their detention serves no public safety purpose. The Quarantine model collapses under its own utilitarian weight because the cost in liberty (70% false positives) outweighs the benefit in security.

  The Compatibilist model survives this data because it does not rely on prediction to justify the initial sanction. The murderer is detained because they committed murder, not because they might kill again. While the 70% non-recidivism rate suggests we should invest in rehabilitation, it does not render the initial sentence unjust. Proportionality exists precisely to prevent the excess the data reveals: the detention of those who, having paid their debt to society, pose no future threat.

  **STRONGEST OBJECTION FROM THE LOSING SIDE**

  In the interest of full deliberation, the following objection from the proposal's supporters must be entered into the record regarding this recommendation to Reject:

  > "By retaining the culpability clause, the Commission chooses hypocrisy over honesty. The current system claims to punish based on desert, but in practice, it incarcerates dangerous people for long periods regardless of their moral blameworthiness, often using 'violent felony' mandatory floors as a proxy for risk. You are rejecting a model that admits it detains for safety, only to maintain a model that detains for safety while pretending it is about morality.
  >
  > Furthermore, your reliance on the 70% false-positive rate ignores the base rate of violence. Preventing three violent crimes per ten detainees may be the most efficient public health intervention available. By prioritizing the 'desert' of the individual over the safety of the community, you are privileging a philosophical abstraction over tangible harm reduction. You are not preventing over-detention; you are merely obscuring the calculus used to justify it."

  **CONCLUSION**

  We cannot adopt a system where the primary justification for liberty deprivation is proven inapplicable to 70% of the detained population. We reject the proposal to strike the culpability clause. We will, however, examine how risk assessment can serve as a tool for mercy and release within a desert-based framework.
