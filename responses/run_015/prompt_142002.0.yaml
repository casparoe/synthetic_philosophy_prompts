answer: |-
  You have stumbled into one of the deepest, most persistent rabbit holes in the philosophy of physics. The confusion you are feeling is not a bug; it is a feature. Historically, brilliant minds (Einstein, Mach, Newton, Leibniz, Earman, Norton) have wrestled with exactly these contradictions.

  The short answer is: **General Relativity (GR) kills Newton's Substantivalism, but it also kills Mach's Relationism.** It offers a "third way" that looks like substantivalism but acts differently.

  Here is the breakdown of where the arguments have teeth, where they are mistaken, and what the modern consensus actually looks like.

  ---

  ### 1. Newton's Two Globes vs. Mach
  You asked if Newton's "two globes in an empty universe" thought experiment knocks out Mach entirely.

  **The Verdict:** It knocks out *classical* Machian physics, but Machians have a philosophical escape hatch.

  *   **Newton's Move:** In Newtonian mechanics, inertia is an intrinsic property of matter defined against Absolute Space. If you have two balls and a cord in a void, and the cord is taut, they are rotating relative to Absolute Space.
  *   **Mach's Counter:** Mach doesn't argue that the cord *wouldn't* be taut. He argues that the scenario is **physically incoherent**. For Mach, inertia *is* the resistance resulting from interaction with the total mass of the universe (the "fixed stars").
  *   **The Clash:** If you remove all the stars, Mach says you remove inertia itself. Without inertia, the concept of "centrifugal force" vanishes, so the cord wouldn't be taut. Newton says inertia is intrinsic to the bodies.
  *   **Why it's a stalemate:** In the context of Newtonian mechanics, Newton wins because his math works and Mach's doesn't (Newtonian equations work fine in a void). But Mach is making a metaphysical claim: "Inertia cannot exist without other matter." You can't test this in a Newtonian universe because Newtonian physics *builds in* absolute space.

  ### 2. General Relativity: The Plot Twist
  You are correctly sensing that GR pulls in two opposite directions. This is because Einstein was trying to build a Machian theory but ended up building something else.

  #### The Argument for Relationism (Mach wins?)
  You noted that in GR, matter curves spacetime. This suggests that without matter, there is no geometry.
  *   **The Teeth:** This is partially true. In GR, the metric field (which defines distances and inertia) is coupled to the stress-energy tensor (matter). If you change the matter distribution, you change the inertial structure. This is the **Lense-Thirring effect** (your friend's spinning shell).
  *   **The Prediction:** Your friend is right. If you have a stationary bucket inside a massive, spinning spherical shell, GR predicts the water *will* climb the walls. The local inertial frames are "dragged" by the rotating mass. This is a massive victory for the Machian intuition that local inertia is determined by distant matter.

  #### The Argument for Substantivalism (Newton wins?)
  You also noted that GR allows empty universes.
  *   **The Teeth:** This is the killer blow to strict Machian Relationism. GR allows for **Vacuum Solutions**.
      *   **Minkowski Space:** A completely empty universe with flat spacetime. It has a well-defined geometry, light cones, and inertial structure, despite having zero matter.
      *   **Gravitational Waves:** Ripples in spacetime curvature that can propagate through a vacuum. They carry energy and momentum.
  *   **The Implication:** If spacetime can exist, have structure, and carry energy without *any* matter present, then spacetime is not just a relation between bodies. It is a physical entity in its own right. Mach said "No matter = no space." GR says "No matter = Minkowski space (still there)."

  ### 3. So, who wins? (The Modern Consensus)
  Most philosophers of physics today agree that GR refutes both Newton's Absolute Space and Leibniz/Mach's Pure Relationism. The reality is **Metric Field Realism** (sometimes called "Sophisticated Substantivalism").

  Here is the distinction:
  *   **Newton's Substantivalism:** Space is a **container**. It is a static stage that exists independently, and matter is placed inside it.
  *   **Mach's Relationism:** Space is a **bookkeeping system**. It is just a way to describe where objects are relative to each other. It has no independent existence.
  *   **GR's Reality:** Spacetime is a **dynamic field**.

  Think of the electromagnetic field.
  *   Does the EM field exist if there are no charges? Yes (light waves).
  *   Is the EM field just a relation between charges? No, it carries energy independently.
  *   Is the EM field a fixed container? No, it interacts with charges and changes.

  The spacetime metric in GR is exactly like the electromagnetic field. It is a physical substance (it has degrees of freedom, carries energy), but it is not a fixed stage (it is dynamical).

  ### 4. The "Hole Argument" and the Identity of Points
  There is one more technical hurdle that clarifies why this isn't just "Newton 2.0." It's called the **Hole Argument** (revived by John Earman and John Norton in the 1980s).

  *   **The Setup:** Imagine a region of spacetime with no matter (a "hole").
  *   **The Problem:** If you believe spacetime points are real individuals (Substantivalism), you can mathematically "shift" the metric field around on those points inside the hole without changing anything outside.
  *   **The Consequence:** If the points are real, this shift creates a *different* physical reality. But since the equations of GR can't tell the difference between the original and the shifted version, the theory becomes **indeterministic**. The future inside the hole isn't fixed by the past.
  *   **The Resolution:** To save determinism, we must admit that **spacetime points have no physical identity independent of the fields defined on them.**
      *   This sounds Relationist! (Points don't matter, only the field structure matters).
      *   But the *Field* is still real! (It's not just relations between matter).

  This leads to **Sophisticated Substantivalism**: The physical reality is not the manifold of points (Newton), nor the relations between bodies (Mach), but the **equivalence class of the metric field**.

  ### 5. Summary: Straightening out your confusion

  1.  **Newton's Two Globes:** In a GR universe, if you actually removed all matter/energy, you would be left with Minkowski space. The globes would still experience tension if rotating relative to the local inertial frame (the metric field). So, Newton is right that rotation is absolute *relative to the metric field*, but Mach is right that the metric field is usually determined by matter.
  2.  **Vacuum Solutions:** These are the decisive argument against strict Machian Relationism. Spacetime structure can exist without matter. Therefore, spacetime is a "something."
  3.  **The Spinning Shell (Frame Dragging):** This is an experimental fact (measured by Gravity Probe B). It confirms that matter influences the metric field. It validates the Machian *mechanism* (inertia is coupling to the field generated by mass) without validating the Machian *ontology* (that space is nothing but relations).
  4.  **The Ontology:** Spacetime is not a container (Newton) and not a mere relation (Mach). It is a **physical field**.

  **The Bottom Line:**
  You are not missing a step; you are seeing the tension that defines modern physics.
  *   If you define "Substantivalism" as "Space is a fixed container," **GR kills it.**
  *   If you define "Relationism" as "Space vanishes without matter," **GR kills it.**
  *   **Winner:** **Field Realism.** Spacetime is a dynamical physical entity that interacts with matter, can exist without it, but is usually shaped by it.

  Your friend's experimental test confirms the *interaction* (Mach's insight), but the existence of gravitational waves confirms the *independence* (Substantivalist insight). The truth is the synthesis: Spacetime is a physical field.
