answer: |-
  **The Case of the Surface and the Summit**

  **The Construction**

  Consider a subject, Elena, during a single week in autumn.

  On Monday, Elena swims lengths in a cold pool. She is a competent swimmer but pushes her breath-hold to the limit on the final turn. She surfaces, breaking the water. The experience is the first ten seconds of air rushing into her lungs. She does not think about the swim; she does not evaluate her performance. She simply yields to the air. Her shoulders drop, her mouth opens, and she inhales.

  On Saturday, Elena hikes a familiar trail. It is steep and demanding. She reaches the summit. She plants her poles, straightens her back, and looks out over the valley. She does not gasp; her breathing is steady. She does not yield; she stands. She takes in the view, not as a gift given, but as a vista earned.

  **The Phenomenal Match**
  In both moments, Elena undergoes a specific somatic-affective tone. It is not merely the absence of distress. It is a positive "rush of capacity." Concretely: a sudden warming sensation spreading from the chest to the fingertips; a clearing of "static" or background tension in the jaw and forehead; and a distinct feeling of *expansion*, as if the boundaries of her body have become more permeable to the environment. In the pool, this feels like the air filling her. On the mountain, it feels like the view filling her. The qualitative character of the "expansion" and the "clearing" is identical in intensity and duration (approx. 10 seconds). An ordinary reader recognizes both as pleasures: the relief of breath and the pride of arrival.

  **The Attitudinal Divergence**
  In the pool, Elena's stance toward the experience is **Receptive**. She does not seek to control the air; she seeks to admit it. Her conative posture is one of *yielding*. She is disposed to open, to relax, to let the external world repair an internal deficit. The satisfaction lies in the *cessation of resistance*.

  On the mountain, Elena's stance toward the experience is **Assertoric**. She does not seek to admit the view; she seeks to witness it as a conqueror. Her conative posture is one of *claiming*. She is disposed to stand firm, to hold ground, to project her agency onto the landscape. The satisfaction lies in the *confirmation of power*.

  These are not differences in the object (air vs. view) but in the *vector* of the relation. One is a pro-attitude of dependency (I need this to complete me); the other is a pro-attitude of mastery (I complete this by witnessing it). One closes a gap by filling; the other closes a gap by bridging.

  ***

  **Verdicts and Reasoning**

  **The Dimensional Theorist** unifies the pair. For this theorist, welfare is identified with the phenomenal determinable—the "rush of capacity." Since the warming, clearing, and expansion are identical in both cases, the same welfare-relevant quantity is present. The difference in context (swimming vs. hiking) is irrelevant noise surrounding the core hedonic tone. The theory handles the case effortlessly: same feel, same value.

  **The Attitudinal Theorist** fails to unify the pair. For this theorist, welfare is identified with the pro-attitude. However, the descriptions reveal two structurally incompatible conative relations. A relation of *yielding* cannot be the same kind of thing as a relation of *claiming*. If welfare is grounded in the attitude, then Elena's welfare on Monday is grounded in vulnerability, while her welfare on Saturday is grounded in agency. There is no single "pro-attitude" here, but two different functional roles for satisfaction. The theory fragments: it must either say there are two kinds of welfare (undermining hedonism's unity) or arbitrarily lump two different psychological mechanisms under one label.

  ***

  **Case Name**
  The Case of the Surface and the Summit.

  **The One Feature**
  The feature doing the work is the **Agentic Stance** (Receptive/Yielding vs. Assertoric/Claiming).

  **Counterfactual Removal**
  If this feature is removed—for example, if we describe the Summit experience also as a passive yielding to the beauty, or the Surface experience as an active conquest of the water—the attitudinal divergence collapses. If both are merely "yielding," the Attitudinalist can successfully argue that the same pro-attitude (receptive gladness) is directed at different objects. The case would then revert to a standard heterogeneity problem (different objects, same attitude), which the Attitudinalist is equipped to handle. The reversal of the dialectic depends entirely on the agentic stance being distinct.

  **Strongest Attack and Reply**
  *Attack:* The Attitudinalist argues that "Yielding" and "Claiming" are merely surface manifestations of a deeper, unified attitude: *Intrinsic Gladness*. They claim that at the functional core, both states involve the subject registering a state of affairs as "good for me." The difference in stance is incidental to the core evaluation.

  *Reply:* This retreats to a purely formal definition of "attitude" that lacks explanatory power for welfare. If "gladness" can be essentially passive in one instance and essentially active in another, it is not a natural kind but a disjunction. Welfare theories require a unified metric to weigh lives. If the metric sometimes measures "needs met" (Receptive) and sometimes measures "goals achieved" (Assertoric), we cannot compare them without a higher-order standard. But if there is a higher-order standard (e.g., "degree of satisfaction"), that standard is likely phenomenal (how good it *feels* to be satisfied), which concedes the ground to the Dimensionalist.

  **The Dilemma**
  This construction forces the Attitudinalist into a dilemma regarding the nature of the unifying attitude.

  1.  **Treat the Unifying Attitude as Phenomenal:** If the theorist argues that what unites Yielding and Claiming is a specific *feel* of gladness, they have effectively adopted the Dimensional view. The attitude is no longer a purely conative relation but a felt quality. The view collapses into Dimensionalism, losing its claimed immunity to the heterogeneity problem.
  2.  **Treat the Unifying Attitude as Purely Conative:** If the theorist insists the attitude is a non-phenomenal functional role, they now owe an account of how "Yielding" and "Claiming" are the *same* functional role. They must explain how a single conative mechanism accounts for both dependency and mastery without appealing to the felt outcome. If they cannot, the "unity" of pleasure is merely nominal, and hedonism loses its claim to identify a single constituent of welfare.

  ***

  **Conclusion**

  This construction does not refute hedonism entirely, but it demonstrates that the heterogeneity problem is inescapable, merely shifting locations depending on the theory chosen. It establishes that the Attitudinal view is not immune to heterogeneity; it suffers from a *structural* heterogeneity where the Dimensionalist suffers from a *sensory* one. The result is better read as a point in favour of the Dimensional view, but only conditionally: the Dimensionalist wins this specific round because they can point to the concrete "rush of capacity" as the unifier, whereas the Attitudinalist is left with a fractured conception of the pro-attitude. However, since the Dimensionalist must still explain how this "rush" unifies all other pleasures (e.g., quiet contentment vs. wild joy), the construction ultimately suggests that any successful hedonism must be a hybrid, acknowledging that the unifying feature of pleasure is neither purely sensory nor purely conative, but a complex of both that resists simple reduction.
