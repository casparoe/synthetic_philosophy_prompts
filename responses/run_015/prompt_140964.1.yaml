prompt: |-
  hey — I'm a compiler person, mostly optimization passes with some translation validation on the side, and I got dragged into a reading group on AI alignment. Last week we did the scheme where you dont train one model to answer hard questions directly: you answer a hard question by recursively splitting it into sub-questions, each answered by another copy of the same model, with a human at the leaves, and then you train a single flat model to produce the final answer with the tree of sub-questions thrown away. Then you iterate: run the same procedure on top of the model you just distilled, distill again, and so on. The fight in the room was about weather that pipeline preserves the two things youd want it to preserve — that the whole assembly is trustworthy in a way no individual step is, and that it ends up more capable than what you started with. One guy kept saying it's basically just inlining and I think that's too glib but I couldnt say why at the time.

  I want the whole argument in my vocabulary. So: treat the recursive version — explicit decomposition, human at the leaves — as a source program with a real operational semantics, and distillation as an optimizer that inlines the recursion, unrolls it to some finite depth, and emits a flat artifact that only has to be observationally equivalent to the source on the distribution you check it on. I keep reaching for the first Futamura projection as the closest thing I have (specializing away an interpreter layer) but I'm not sure it carries the weight. Translate these one at a time: the claim that the humans judgment at the leaves propagates up through the aggregation so the whole is more trustworthy than any node; the claim that amplification buys capability the base model doesn't have and that distillation keeps it; the worry that how a question gets decomposed is itself a judgment call, and that in the version we read the model proposes its own sub-questions, so the decomposition and the thing being distilled co-evolve across rounds; and the iterated case, where you re-amplify the distillate, benchmarks stay flat, and nobody can say what's actually still in there.

  Then the residue report, which is the part I actually want. What maps cleanly, what did you have to fudge to make it fit, and what has no expression in compiler terms at all? Two suspicions to rule on. First: in my world, if two different unrolling strategies produce different answers, one of them is just a miscompilation, because there's a semantics both have to respect — and I get the feeling here there can be two decompositions of the same question that are both locally fine and land on different answers, with nothing in the setup to pick between them. Is that a real difference, or am I smuggling in the spec? Second: my optimizer is allowed to do anything on inputs where the source semantics says nothing, undefined behaviour, and nobody calls that a correctness bug; it feels structurally like what distillation does off-distribution, but it might be a stretch. For each piece of residue, tell me whether it points at something my vocabulary is missing or at something the alignment people are being vague about.
