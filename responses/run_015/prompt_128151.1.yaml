          *   **Strategy Trace:** You claim PENANCE "alternates between cooperating... and defecting" against ALL-D. According to the standing rules provided:
              1.  Round 1: PENANCE (GOOD) Cooperates; ALL-D Defects. ALL-D becomes BAD. PENANCE stays GOOD.
              2.  Round 2: PENANCE sees Opponent BAD $\to$ Defects. ALL-D Defects.
