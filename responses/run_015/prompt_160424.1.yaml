answer: |-
  **The Announcement**
  "Class, listen closely. The External Examiner will attend exactly one of our future meetings to conduct your quiz. I do not know which meeting they will attend, and neither do you. However, I guarantee you this: the Examiner *will* come, and we will continue holding class meetings until they do, even if that requires us to meet past the official end of term. On the evening before the quiz, you will not have sufficient reason to believe the quiz is at the next meeting. Specifically, your credence that the quiz is at the next meeting will not exceed one half."

  **Schedule and Credence Arithmetic**
  The students treat the teacher as infallible regarding the guarantee (Credence = 1 that a quiz occurs eventually) but model the timing as a process with no known termination point. Let $Q_k$ be the event "Quiz at meeting $k$." Since there is no known upper bound $N$ on the number of meetings, the students assign a probability distribution over $\mathbb{N}$ (e.g., a geometric distribution with $p=0.5$) that sums to 1, satisfying Condition 2. On any evening $k$, given no quiz yet, the conditional probability $P(Q_{k+1} | \neg Q_1 \dots \neg Q_k)$ remains $0.5$. This satisfies Condition 1 (Credence $\ngtr 0.5$). The Backward Induction (BI) argument fails at the **base case**. Standard BI begins: "If the quiz hasn't occurred by meeting $N-1$, it must occur at $N$." This requires the students to identify a specific meeting $N$ as the *last possible meeting*. In this case, for any meeting $k$, the students assign non-zero credence to the class continuing to $k+1$. There is no $N$ such that $P(\text{Meeting } N \text{ is the last}) = 1$. Without a known last meeting, the students can never derive $P(\text{Quiz at } N) = 1$, so the induction never starts.

  **The Single Feature and Deletion Test**
  The single feature doing the work is **Epistemic Open-Endedness**: the students lack knowledge of a finite upper bound on the sequence of possible quiz meetings. This is minimal because it targets the necessary condition for the BI base case (a known last day) without altering student rationality or the announcement's truth. To demonstrate its necessity, delete this feature by stipulating that everyone knows the Examiner must come within the next five meetings and that all five will take place. Now, Meeting 5 is a known finite deadline. On the evening of Meeting 4, students know the quiz must be at Meeting 5 (Credence = 1), violating the surprise condition. The BI base step is restored, the induction proceeds backwards, and the paradox returns. Thus, the paradox dissolves only when the horizon is structurally unbounded.

  **Objection and Verdict**
  A proponent of the self-referential solution would object that my case begs the question: they argue the announcement is unknowable because it refers to the students' future knowledge, so Condition 2 (Credence = 1) is impossible to satisfy legitimately. They would claim that even in my open-ended case, the students cannot truly *know* the announcement is true, only assume it. However, my case isolates the structural dependency on deadlines: by securing Condition 2 through institutional trust (the teacher's authority to extend term) rather than logical stipulation, I show that the BI failure stems from the absence of a known $N$, not the announcement's self-reference. This suggests the original paradox is at bottom a paradox about **known finite deadlines**. When the deadline is removed, the contradiction vanishes even if the announcement is fully known and true, indicating that the "surprise" is incompatible with *common knowledge of a termination point*, not with knowledge of the announcement itself.
