answer: |-
  To reconstruct the theoretical commitments of your evaluation policy, we must first disentangle the candidate presuppositions lurking beneath the protocols. One candidate is the *Causal Purity View*: that understanding requires a causal history free of specific prior exposure. A second is the *Instrument Validity View*: that a test measures a trait only if the subject cannot bypass the trait to solve the test. A third is the *Internal Mechanism View*: that verbatim output implies a retrieval mechanism, while varied output implies a reasoning mechanism. I reject the Internal Mechanism View as a strict presupposition. Your policy never inspects weights or activation patterns; it infers mechanism solely from input-output correlations. To claim the policy presupposes access to internal states would be to confuse the inference with the observation. The policy operates on behavioral proxies, assuming a mapping between output variance and internal processing, but it does not strictly require that mapping to be true, only that it be reliable enough for measurement.

  The implicit theory of understanding that makes your bundle of rules coherent is a form of *Counterfactual Robustness Realism*. On this view, understanding is not merely the disposition to produce correct answers (which would make provenance irrelevant), but the capacity to produce correct answers across a space of possible variations in surface form. Verbatim reproduction is evidentially worthless not because memorization is impossible for a mind, but because it fails to discriminate between a system that possesses the capacity and one that merely stores the specific output. It collapses the counterfactual space to a single point. Conversely, success on structurally identical but surface-novel private items is evidentially gold because it suggests the system has latched onto an invariant latent structure. The policy presupposes that surface variance forces latent abstraction; if the model solves the new instance, it must have navigated the structural manifold rather than retrieving a coordinate. This is why provenance disqualifies verbatim answers but not structural generalizations: the former is compatible with zero robustness, while the latter is taken as proof of non-zero robustness.

  This reconstruction clarifies which rival views are silently excluded. First, the policy rejects a *Radical Functionalism* where understanding is defined exhaustively by input-output dispositions. If functionalism were true, the source of the disposition (training data vs. reasoning) would not matter; a correct answer is a correct answer. Your voiding policy asserts that two functionally identical outputs have different epistemic weights based on their causal history. Second, it ignores the *Stochastic Parrot* skepticism which holds that all generalization is merely higher-order memorization. By treating structural success as "reasoning," you assume a qualitative distinction between retrieving a string and manipulating a schema, whereas the skeptic sees only varying degrees of pattern matching. Third, the policy sidelines *Cartesian Internalism*. It does not demand proof of conscious grasp, only behavioral evidence that mimics the robustness of grasp.

  However, the consistency of this theory frays at the edges of your practice. The all-or-nothing voiding of a contaminated benchmark presupposes that the instrument's validity is binary: either it measures reasoning or it measures lookup. This aligns with the Instrument Validity View. Yet, celebrating year-over-year gains on old public benchmarks contradicts this. If those benchmarks are saturated in training data, the Instrument Validity View dictates they are void. To reconcile this, the policy must implicitly rely on a *Marginal Gain Presupposition*: that improvements on saturated tests reflect genuine capacity increases rather than just better retrieval, perhaps because the test is not perfectly memorized even if contaminated. This is philosophically underdetermined; the same score gain could result from better indexing rather than better reasoning. The policy fits comfortably with the idea of "degrees of contamination," but strictly presupposes a threshold where measurement becomes noise.

  The asymmetry regarding fabricated claims further reveals a causal theory of evidence. Treating repetition as strong evidence of ingestion assumes a specific direction of information flow: data-to-model. Treating silence as weak evidence assumes noise in the channel (forgetting or suppression). This is consistent with a Bayesian update on the hypothesis "model saw this data." However, it highlights a tension: you treat the model as a passive recorder for contamination checks but as an active reasoner for capability checks. This dual stance is only coherent if you assume the model switches modes based on input novelty, a claim your black-box evaluation cannot strictly verify.

  There are places where the practice is underdetermined. Two incompatible theories license the same rules: (1) The model has genuine abstract representations (Realism), and (2) The model is a sophisticated interpolator that mimics abstraction without possessing it (Instrumentalism). Both predict success on private structural variants. Your policy treats (1) as true, but the evidence only supports the predictive reliability of (2). You cannot distinguish between "grasping the rule" and "fitting the rule's shape" without access to the mechanism you rejected earlier.

  If you adopted the strongest rival account—Radical Functionalism, where provenance is irrelevant to capability—the policy would undergo a seismic shift. Contamination screening would cease to be a concern about *minds* and become purely a concern about *measurement security*. You would not void scores because the model "doesn't understand," but because the score no longer differentiates models in a competitive landscape. The distinction between memorization and generalization would dissolve into a continuum of performance stability. Private problem sets would lose their special status as "truth" and become merely another distributional shift test. Ultimately, your current policy strives to measure a ghost—the internal capacity—by tracing the shadows it casts. The rival view suggests you should stop worrying about the ghost and simply measure the shadows, accepting that if the shadow moves correctly, the distinction between light and object is pragmatically useless.
