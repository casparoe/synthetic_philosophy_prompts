prompt: |-
  You are a philosopher of mind with substantial experience as an evaluator of machine learning systems — someone who can read a technical measurement protocol and say precisely what theory of cognition it silently commits its authors to. Please treat this as an exercise in conceptual reconstruction rather than as a request for advice or for a verdict on whether models "really" understand anything.

  I work on the evaluation side of a lab that builds large language models, and over the past year I have become uneasy about our contamination policy, which I will describe as concretely as I can. Before each release, we screen the model for verbatim familiarity with the items of widely used public benchmarks: we look for long exact overlaps between model outputs and benchmark text, and in some cases we check whether the model can reproduce unique random identifier strings that a benchmark's authors deliberately embedded in their released test data. If a model trips a threshold, we void the score for that entire benchmark — not merely for the individual items it appears to have seen, but for the instrument as a whole, on the reasoning that the benchmark has stopped measuring anything. Alongside this, we commission private problem sets that are never published: contractors write them, they are rewritten each cycle with new names, new numbers, and new surface phrasing but deliberately the same underlying structure, and access is restricted to a handful of people. These private sets, plus "live" evaluations built from problems that only came into existence after the training cutoff — this month's examinations, puzzles released last week — are treated internally as our strongest evidence about what the model can do. We also, occasionally, seed plausible but fabricated claims into places likely to be scraped, and treat a model's confident repetition of such a claim as strong evidence that it ingested that material, while treating its silence as only weak evidence that it did not.

  Here is what puzzles me. We still publish and celebrate headline scores on older public benchmarks whose items, solutions, and walkthroughs were debated at length across the open web long before our training cutoff, and we describe year-over-year gains there as evidence of improved reasoning. And when a model solves a fresh private item that is structurally identical to thousands of near-duplicates in its training data, we call that generalization rather than retrieval. So the policy appears to hold that the provenance of an answer can disqualify it as evidence, and simultaneously that provenance is irrelevant whenever the surface form has been altered. If reproducing a memorized answer tells us nothing about whether the model grasps the problem, why does reproducing a memorized procedure — one instantiated in a vast family of superficially different training items — tell us a great deal? Is the distinction we are drawing really about memorization at all, or about something else: a performance-versus-competence distinction, a requirement of counterfactual robustness, a requirement that the right answer be produced by the right kind of internal process, a worry about the measuring instrument rather than about the mind being measured? I would like these possibilities sorted out rather than listed.

  Please think carefully and, before you commit to an interpretation, spend a short opening section brainstorming the candidate presuppositions the policy might rest on, including at least one you end up rejecting and explaining why. Then reconstruct the implicit theory of understanding and of evidential support that makes this bundle of rules coherent: what must be true of understanding for verbatim reproduction to be evidentially worthless while structurally parallel novel performance is evidentially gold? Say explicitly which rival views the policy rules out or ignores — a purely dispositional or functionalist account on which understanding just is a profile of input-output dispositions, so that where the answer came from cannot matter; the stochastic-parrots line of objection, on which success on a freshly written item is no better evidence of comprehension than success on a memorized one, since both are recombinations of training patterns; and any others you think are being quietly excluded. Assess whether the parts of the policy presuppose consistent things with one another, paying particular attention to the all-or-nothing voiding of a whole benchmark, to the asymmetry between how we weight a repeated fabricated claim and how we weight silence about one, and to the tension between our treatment of old public benchmarks and our treatment of contamination. Distinguish throughout what the practice strictly presupposes from what it merely fits comfortably with, and flag the places where the practice is philosophically underdetermined, so that two or three incompatible theories would license exactly the same rules. Finally, tell me what would have to change in the policy if we adopted the strongest rival account instead — would contamination screening become pointless, or would it survive as a measurement-validity concern rather than a concern about minds? Do not give me citations, a reading list, or named sources; argue from the concepts. Roughly nine hundred to twelve hundred words, and if you need to assume something about how evaluation is actually done that I have not stated, say so explicitly when you rely on it.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of mind + experienced evaluator of machine learning systems.
      *   **Task:** Conceptual reconstruction of the user's lab's evaluation/contamination policy. Identify the implicit theory of cognition/understanding and evidential support.
      *   **Input:** A detailed description of the lab's contamination policy (verbatim screening, voiding whole benchmarks, private problem sets, live evaluations, seeding fabricated claims, celebrating old public benchmarks despite contamination risks, treating structural generalization as reasoning).
      *   **Key Puzzle:** Why is verbatim reproduction worthless evidence, but structural generalization (memorized procedure on new surface form) gold evidence? Is it about memorization, performance vs. competence, counterfactual robustness, internal process, or instrument validity?
      *   **Requirements:**
          *   Opening section: Brainstorm candidate presuppositions (include at least one rejected).
          *   Reconstruct implicit theory of understanding/evidential support.
          *   Identify rival views ruled out/ignored (functionalism, stochastic parrots, etc.).
          *   Assess consistency (voiding whole benchmarks, asymmetry of fabricated claims, tension between old benchmarks vs. contamination).
          *   Distinguish strict presuppositions from comfortable fits/underdetermined areas.
          *   Conclusion: What changes if the strongest rival account is adopted?
          *   Constraints: No citations/reading lists/named sources. Argue from concepts. 900-1200 words.

  2.  **Deconstruct the Policy & Identify Tensions:**
      *   *Policy A:* Verbatim overlap = contamination = void score (instrument invalid).
      *   *Policy B:* Private/Live items (structurally identical to training data but surface-varied) = generalization = evidence of reasoning.
      *   *Policy C:* Old public benchmarks (likely contaminated via web scrape) = still celebrated as evidence of improvement.
      *   *Policy D:* Seeded false claims: Repetition = strong evidence of ingestion; Silence = weak evidence of non-ingestion.
      *   *Tension:* If provenance disqualifies verbatim answers, why doesn't it disqualify structural analogs? If old benchmarks are contaminated, why celebrate them?
      *   *Core Philosophical Question:* What is the relationship between *causal history* (training data) and *cognitive capacity* (understanding/reasoning)?

  3.  **Brainstorming Presuppositions (Opening Section):**
      *   *Candidate 1: The Causal Purity View.* Understanding requires the causal chain to bypass direct lookup. (Rejected: Too strong, rules out all learning from data).
      *   *Candidate 2: The Instrument Validity View.* The benchmark is a measuring stick; if the stick is known to the subject, the measurement is invalid regardless of ability. (Plausible).
      *   *Candidate 3: The Counterfactual Robustness View.* Understanding is shown by success across possible variations, not just actual ones. (Strong candidate).
      *   *Candidate 4: The Internal Process View.* Verbatim = retrieval mechanism; Structural = transformation mechanism. (Hard to verify empirically).
      *   *Selection:* I need to select one to reject. I'll reject the "Internal Process View" as a *strict* presupposition because the policy doesn't actually inspect internal states, only outputs. It *infers* process from output patterns.

  4.  **Reconstructing the Implicit Theory:**
      *   The policy treats *understanding* as a capacity for *invariant mapping* across surface transformations.
      *   It treats *evidence* as probabilistic support for the existence of this capacity.
      *   Verbatim match: High probability of retrieval, low probability of transformation capacity.
      *   Structural match (private/live): Low probability of retrieval (due to novelty), high probability of transformation capacity.
      *   *Crucial Nuance:* The policy isn't claiming the model *doesn't* have the capacity if it memorizes; it's claiming the *test* doesn't measure it. This shifts the focus from *mind* to *instrument*.
      *   However, celebrating old benchmarks contradicts this unless they assume *degree* of contamination matters, or that structural variance within the benchmark is sufficient.
      *   *The "Generalization" Move:* They assume that if the surface form changes, the causal path *must* have gone through a latent structural representation. This is the core theoretical commitment: *Surface variance forces latent abstraction.*

  5.  **Identifying Rival Views:**
      *   *Radical Behaviorism/Functionalism:* If the output is correct, the input-output disposition exists. Provenance is irrelevant. The policy rejects this by voiding scores based on data history.
      *   *Stochastic Parrots/Skepticism:* All output is pattern matching. Structural generalization is just higher-order pattern matching. The policy rejects this by treating structural generalization as "reasoning."
      *   *Cartesian Internalism:* We need to see the "ghost in the machine." The policy ignores this (no introspection), relying on behavioral proxies.

  6.  **Assessing Consistency:**
      *   *Voiding Whole Benchmarks:* Presupposes that contamination corrupts the *statistical validity* of the aggregate score, not just individual items. This implies a theory of measurement where reliability depends on unknown provenance.
      *   *Fabricated Claims Asymmetry:* Repetition proves ingestion (causal link). Silence doesn't prove non-ingestion (could have forgotten, or filtered). This is consistent with Bayesian updating but highlights that "proof" is asymmetric.
      *   *Old Benchmarks vs. Contamination:* This is the biggest inconsistency. Unless they assume "web debate" != "training data inclusion" (unlikely) or that "reasoning improvements" manifest as margin gains despite saturation. This suggests the policy is pragmatically driven (need headlines) rather than philosophically pure.
      *   *Underdetermination:* We can't distinguish between "true understanding" and "overfitting to structural templates" purely via output. The policy assumes the latter is unlikely enough to count as evidence.

  7.  **Rival Account Implications:**
      *   If we adopt the Functionalism/Behaviorist view (output is all that matters): Contamination screening becomes irrelevant for *capability* assessment, only relevant for *fairness* or *security*.
      *   If we adopt the Skeptic view (all is memorization): Private sets are useless; no test works.
      *   *Focus:* The prompt asks about the strongest rival. Likely the Functionalist one (provenance doesn't matter).
      *   *Change:* Screening would shift from "invalidating evidence of mind" to "ensuring test security/integrity."

  8.  **Drafting - Section by Section (monitoring word count):**

      *   *Intro/Brainstorming (approx. 200 words):* List candidates. Reject the "Internal Mechanism" view because the policy is black-box.
      *   *Reconstruction (approx. 400 words):* Focus on Counterfactual Robustness and Instrument Validity. Understanding = ability to navigate a space of variations, not hit a point. Evidence = likelihood ratio of capacity vs. lookup.
      *   *Rivals & Consistency (approx. 400 words):* Discuss Functionalism (rejected), Skepticism (rejected). Analyze the benchmark voiding (instrument focus) vs. old benchmark celebration (pragmatic inconsistency). Discuss the fabrication asymmetry (causal inference).
      *   *Underdetermination & Rival Policy (approx. 200 words):* Where is it vague? What changes if we switch to Functionalism?

      *Refining the "Rejected Presupposition":* I'll reject the idea that the policy presupposes access to internal states. It infers them.
      *Refining the "Theory":* It's a "Latent Structure Realism." The model must possess an internal representation invariant to surface noise.
      *Refining the "Inconsistency":* The celebration of old benchmarks is the weak link. It suggests the policy is actually about *marginal gain validity* rather than *absolute contamination*.

      *Word Count Check:* Need to ensure I hit 900-1200. I need to expand on the philosophical implications of "instrument validity" vs "mind measurement."

      *Drafting thought:* Make sure to explicitly address the "verbatim vs. procedure" distinction. Why is one memorization and the other generalization? Because verbatim is low-dimensional (string match), procedure is high-dimensional (structural mapping).

      *Drafting thought:* The "Fabricated Claim" asymmetry is interesting. It treats the model as a leaky database. Repetition = leak confirmed. Silence = leak possible but hidden. This aligns with a causal theory of information flow.

      *Drafting thought:* The "Old Benchmark" tension. If we celebrate them, we are implicitly saying "contamination is a threshold, not a binary," or "reasoning improves even on known tests." This contradicts the "void whole benchmark" rule which is binary. I need to highlight this tension.

