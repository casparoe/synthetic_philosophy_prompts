  4.  **Drafting the Philosophical Analysis (The "What's Missing"):**
      *   *Overdetermination:* SRE says "two triggers." Philosophy asks "Which one *caused* it?" If both are sufficient, but-for fails for both. SRE sidesteps this by focusing on *prevention* (action items). Philosophy cares about *truth*.
      *   *Pre-emption:* The General. SRE sees this as "Unused DR." Philosophy sees a causal structure where the *threat* of the coup might have influenced the split, but the *actual* coup was pre-empted.
      *   *Selection:* SRE selects based on *actionability*. Philosophy selects based on *salience* or *normative judgment*.
