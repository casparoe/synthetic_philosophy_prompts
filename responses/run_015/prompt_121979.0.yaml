      *   *Pre-emption:* One cause happens, blocks the other. -> SRE: "Race condition," "Failover triggered before backup needed."
      *   *INUS Conditions:* Insufficient but Non-redundant part of an Unnecessary but Sufficient condition. -> SRE: "Contributing factor," "Latent condition."
      *   *Causal Selection:* Picking *the* cause from many. -> SRE: "Root Cause" (which they banned) vs. "Actionable Items."
