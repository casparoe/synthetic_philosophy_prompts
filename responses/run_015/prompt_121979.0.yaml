      *   *Summary:* Service outage (Government collapse).
      *   *Triggers:* Tariff Split (Config drift?), Financial Scandal (Security breach/PR incident).
      *   *Latent Conditions:* 30-year fiscal strain (Technical debt/Resource exhaustion).
