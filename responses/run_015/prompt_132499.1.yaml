answer: |-
  Here is the logic checklist for a theory of death, broken down by the cases it must survive, the distinctions it must hold, and the internal conflicts it has to resolve.

  ### 1. The Checklist: Four Cases a Theory Must Handle

  A robust theory of death cannot just define a state; it must classify edge cases correctly without contradicting itself.

  **Case A: The Ventilated Corpse (Brain Dead, Heart Beating)**
  *   **The Scenario:** No brain activity (including brainstem), but a ventilator pushes air, and the heart beats.
  *   **Why it matters:** This tests whether death is about **biological integration** or **circulation**. If the heart beats but the body can't regulate temperature, hormones, or breathing without a machine, is the *organism* alive? A theory must explain why the heartbeat doesn't count as life here.

  **Case B: The Resuscitated Patient (Heart Stop, Then Restart)**
  *   **The Scenario:** Heart stops for 5 minutes, CPR restores it, patient wakes up.
  *   **Why it matters:** This tests **irreversibility**. If death is "heart stop," this patient was dead and came back to life (which is metaphysically messy). A theory must define death as a *permanent* cessation, not a temporary pause. It forces the theory to distinguish between *clinical death* (pause) and *biological death* (end).

  **Case C: The Empty Shell (Brainstem Intact, No Awareness)**
  *   **The Scenario:** Permanent Vegetative State. The brainstem works (they breathe, sleep, wake), but the cortex is gone (no thought, memory, or awareness).
  *   **Why it matters:** This tests **what kind of life matters**. Is it the life of the *human organism* (breathing, digesting) or the life of the *person* (thinking, relating)? A theory must decide if losing the "self" counts as death, or if only the loss of the "body" counts.

  **Case D: The Synthetic Swap (Half-Brain Replaced)**
  *   **The Scenario:** Biological neurons are replaced by synthetic nets functionally identical to the original. They talk and remember.
  *   **Why it matters:** This tests **substrate dependence**. Is death tied to *biology* or *continuity of function*? If the theory says "death is biological failure," this person is alive. If the theory says "death is the end of the original biological pattern," this person might be a copy, meaning the original is dead. A theory must clarify if "human death" requires "human tissue."

  ### 2. The Distinctions It Cannot Collapse

  A theory fails if it treats these pairs as the same thing.

  *   **Dead vs. Dying:**
      *   **Logic:** Dying is a process (cells shutting down one by one); Death is an event (the crossing of a threshold).
      *   **Requirement:** The theory must identify a specific line where resuscitation moves from "medical treatment" to "necromancy." If it can't draw the line, it can't authorize organ donation or stop treatment.
  *   **Biological Death vs. Legal Declaration:**
      *   **Logic:** Biology is a fact; Legal Death is a social status.
      *   **Requirement:** A theory must allow for a gap. A person might be biologically dead (brain destroyed) but not legally dead until a doctor signs the paper. Conversely, a legal declaration can't make a living person dead. The theory must prioritize the biological reality over the paperwork.
  *   **Loss of Consciousness vs. Loss of Heart Function:**
      *   **Logic:** One is psychological (personhood), one is physiological (organism).
      *   **Requirement:** The theory must pick a "unit of death." Are we killing a *body* or a *mind*? You cannot have it both ways without contradiction when machines separate the two (see Case A and C).

  ### 3. The Conflicts: Where Requirements Fight

  This is the core tension you suspected. Technology has decoupled criteria that nature used to keep together.

  *   **Conflict 1: "Permanent Circulatory Stop" vs. "No Possible Consciousness"**
      *   **The Fight:** In the past, if your heart stopped, you lost consciousness and died. Now, a machine can keep circulation going forever without consciousness (Case A), or you can lose consciousness permanently while circulation continues (Case C).
      *   **The Problem:** You cannot demand *both* as the definition of death. You must choose: Is death the end of the *body's engine* or the end of the *driver*? A theory that requires both is logically broken because technology has made them mutually exclusive.
  *   **Conflict 2: "Irreversibility" vs. "Future Technology"**
      *   **The Fight:** To define death as "irreversible loss of function" relies on current medical capability. But what if technology advances in 10 years to fix what is unfixable today?
      *   **The Problem:** If death depends on *current* tech, then a person declared dead today might be "alive" by future standards. A theory must define irreversibility based on *biological integrity*, not just *medical capability*, or the definition of death changes every year.
  *   **Conflict 3: "Organism Integration" vs. "Artificial Support"**
      *   **The Fight:** If death is the loss of the body's ability to integrate itself (breathe, regulate heat), does a ventilator count as integration?
      *   **The Problem:** If the machine counts, the brain-dead patient is alive. If the machine doesn't count, they are dead. The theory must define where the "self" ends and the "tool" begins.

  ### 4. Theory Showdown: Heart-Stop vs. Whole-Brain

  Here is how the two main contenders score against the checklist.

  **The Cardiopulmonary View (Heart-Stop)**
  *   **Definition:** Death is the permanent stop of circulation and breathing.
  *   **Passes:** Case B (Resuscitation). It handles the "pause" vs. "end" distinction well.
  *   **Fails:** Case A (Ventilated Corpse). It cannot explain why a body with a beating heart is dead. It also struggles with Case D (Synthetic), as a synthetic heart pumping fluid would keep the "person" alive indefinitely even if the mind is gone.
  *   **Verdict:** Fails the modern checklist because it defines the *pump* as the life, not the *controller*.

  **The Whole-Brain View (Brain Death)**
  *   **Definition:** Death is the irreversible loss of all brain function, including the brainstem.
  *   **Passes:** Case A (Ventilated Corpse). Correctly identifies the body as a corpse despite the heartbeat.
  *   **Passes:** Case B (Resuscitation). As long as brain function returns, they aren't dead.
  *   **Struggles:** Case C (Empty Shell). Since the brainstem works, they are technically *alive* under this view, even if they have zero awareness. This feels counterintuitive to many who value consciousness.
  *   **Struggles:** Case D (Synthetic). If the synthetic net functions like a brain, are they alive? If the theory requires *biological* brain tissue, it's speciesist. If it requires *function*, the original person might be "dead" and replaced by a machine.
  *   **Verdict:** Stronger, but creates the "breathing corpse" paradox in Case C.

  ### 5. The Knockout Rule

  The single rule that knocks out the most theories is **Irreversibility.**

  *   **Why:** Almost every bad theory defines death as a *state* (no heartbeat, no waves). But states can be temporary.
  *   **The Logic:** If a theory does not explicitly build **permanence** into the definition, it classifies every sleeping person, every anesthetized patient, and every cardiac arrest victim as "dead."
  *   **The Trap:** Defining *when* something is irreversible is the hard part. Is it irreversible when *I* can't fix it, or when *no one* can? If it's the former, death is relative to the doctor's skill. If it's the latter, death is a moving target based on scientific progress. Most theories collapse because they can't pin down "irreversible" without referencing current technology.

  ### 6. The Artificial Support Question

  **"If hospitals keep bodies going artificially for months, does that break a theory?"**

  **No, it does not break a good theory; it breaks a lazy one.**

  *   **The Logic:** A robust theory defines death as the loss of **internal biological integration**, not the loss of **function**.
  *   **Explanation:** A ventilator provides *external* integration. It forces air in; it does not restore the brain's ability to tell the lungs to work.
  *   **The Test:** If you pull the plug and the system collapses, the integration was artificial, not biological. Therefore, the organism was already dead; the machine was just animating tissue.
  *   **Conclusion:** Keeping a body going for months is a demonstration of **engineering**, not biology. It confirms the Brain Death theory: the body is a collection of parts that can be individually sustained, but the *unifying principle* (the brain's regulatory control) is gone. It doesn't mean the definition of death is wrong; it means our ability to mimic life has outpaced our biological reality.

  **Summary for your argument:**
  Don't argue about heart vs. brain. Argue about **Integration vs. Function**. Death isn't when the parts stop moving; it's when the system loses the ability to hold itself together as a whole. That is the only rule that handles the ventilator, the resuscitation, and the future tech without contradicting itself.
