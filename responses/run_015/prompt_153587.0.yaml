answer: |-
  'The view in a nutshell'
  The visibility-bias thesis argues that societal "collapse" is an archaeological artifact, not a demographic or cultural reality. It posits that societies often transition from monumental, durable infrastructures (stone, writing) to lighter, perishable ones (wood, oral traditions) during stress. Because archaeology privileges stone and text, these adaptive downsizings appear as disappearances. Consequently, narratives of catastrophe reflect modern anxieties about complexity loss rather than actual discontinuities. The Maya, Bronze Age elites, and Easter Island builders didn't die out; they simply stopped building things that survive easily, rendering them "invisible" to later observers equating civilization strictly with monumentality.

  'Fatal to awkward: the defeater map'
  **Fatal: Paleodemographic Crash.** This requires regional settlement surveys and skeletal evidence showing sharp population declines (50%+) coinciding with monument cessation. If bodies aren't there and settlements shrink physically, "downsizing" fails. *Defender:* Dismiss as migration to unrecorded areas, but this strains credulity against comprehensive survey data.
  **Fatal: Ecological Sterility.** Requires pollen cores showing rapid reforestation and soil data indicating abandoned field systems. If the land isn't being worked, the society isn't just hiding; it's gone. *Defender:* Claim shift to foraging, but this contradicts maintained population density required to sustain the "surviving society" narrative.
  **Serious: Technological Amnesia.** Requires centuries-long gaps in complex skills like metallurgy or irrigation. You cannot simply "choose" to forget smelting; its loss suggests systemic breakdown of supply chains and specialization. *Defender:* Argue knowledge became oral/esoteric, though transmission gaps suggest failure. This is manageable if framed as de-specialization.
  **Serious: Linguistic Replacement.** Requires incoming language families replacing indigenous ones. *Defender:* Concede elite replacement but argue commoner continuity.
  **Awkward: Elite-Specific Violence.** Requires mass graves containing only ruling classes. *Defender:* Concede elite collapse, framing it as liberation from hierarchy, but this weakens the definition of "society" persisting. Defenders readily concede elite death but insist the populace survived, shifting the goalposts of what constitutes a civilization.

  'What it risks predicting'
  This view risks falsification if regional settlement surveys show genuine depopulation rather than dispersal. It predicts genetic continuity between "pre-" and "post-collapse" populations despite material shifts. It expects trauma markers on skeletons to remain baseline, not spike. Crucially, it predicts evidence of deliberate dismantling of monuments for reuse, signaling planned transition rather than abrupt flight. If "collapsed" regions show centuries of sterile soil layers with no organic residue, the thesis fails. It also predicts that "lost" technologies reappear quickly if needed, implying latent knowledge rather than extinction. Rival accounts predict population crashes and cultural replacement; this view predicts continuity masked by material poverty.

  'The hidden weakness'
  The dread objection is paleodemography from non-elite contexts combined with paleobotany. If agricultural field systems show abandonment and soil erosion coincides with monument cessation, "adaptive choice" looks like "forced starvation." You can argue away missing stones, but you cannot argue away a lack of human waste, pollen from crops, or skeletal remains. If the land itself shows no signs of human maintenance, the society wasn't just hiding; it was gone. This stings because it shifts the debate from interpretation of artifacts to hard biological carrying capacity.

  'Bottom line: exposed or insulated?'
  The position is well-insulated against cultural arguments but exposed to demographic data. It thrives where evidence is sparse (text/monuments) but crumbles where survey archaeology is dense. Being this insulated is a bug; if every counter-example can be reframed as "invisible adaptation," the thesis becomes unfalsifiable metaphysics rather than history. It risks explaining everything by defining "society" so loosely that death becomes impossible. However, it correctly identifies a bias in how we value complexity. The verdict: intellectually useful heuristic, but dangerous as a universal rule for all historical contexts. It works best as a corrective lens, not a total replacement for collapse theory.
