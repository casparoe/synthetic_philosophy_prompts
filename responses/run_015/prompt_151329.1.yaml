      *   *Question C:* Does the "cluster disposition" idea save (4) without violating (5), or is it just multi-track in disguise?
      *   *Task:* Rank tensions by severity and suggest the cheapest commitment to revise.

  4.  **Philosophical Analysis of the Tensions:**

      *   **Masking vs. Multi-Track:**
          *   *Masking:* Extrinsic interferer prevents manifestation *in the specific test condition* where it *should* manifest. (Fragile glass + Foam -> No break). The disposition is intrinsic; the mask is extrinsic.
          *   *Multi-Track:* One disposition manifests in *different* ways under *different* conditions. (e.g., Poisonous kills humans, kills rats, makes plants wilt).
          *   *User's Worry:* If I say fragility exists even when masked, why can't I say reactivity exists even when catalysts change the output?
          *   *Resolution:* The distinction lies in *intrinsicness* vs. *relationality*. Masking preserves the intrinsic power while blocking the output. Multi-track often implies the power *itself* is defined by a range of outputs. If the catalyst changes the *mechanism* fundamentally, it might be a different disposition. If it just changes the *rate* or *pathway* to the same end, it's single-track.
          *   *User's specific chemistry case:* "Same molecule behaves totally differently." This is the danger zone. If the *manifestation* is totally different, it looks multi-track.

      *   **The "Cluster" Idea:**
          *   Ecology: Resilience = Cluster of sub-dispositions.
          *   This is actually a form of *Dispositional Pluralism* or a *Structural* view, not necessarily Multi-Track. A "cluster" implies many *single-track* dispositions working together to produce a macro-property ("resilience").
