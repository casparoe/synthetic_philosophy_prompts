answer: |-
  # The Procurement Ethical Audit Tool (PEAT)

  **Purpose:** To determine whether a proposed food substitution reduces attributable animal suffering, given data constraints and supply chain realities.
  **Time Budget:** 45 minutes per item.
  **Required Inputs:** Current item specs, Proposed item specs, Supplier location/region, Annual volume (kg), Contract minimums.
  **Pre-Meeting Prep:** The Committee must agree on a "Lookup Table" of regional welfare scores and field-death estimates once per year. This procedure uses those tables; it does not generate new data.

  ---

  ## Part 1: The Decision Procedure

  ### Step 1: The Threshold Check (Batching & Marginality)
  **Action:** Compare the proposed volume change against the supplier's production batch size.
  *   **Data Needed:** Contract minimums, supplier batch cycles (e.g., flock size, herd cull cycle).
  *   **Calculation:** Is the volume reduction/increase $\ge$ 5% of a standard production batch?
  *   **Termination Rule:** If **NO**, the supply chain will not adjust. No animals are saved or added; only price/margin changes.
      *   **Verdict:** **REFUSE TO ORDER CHANGE.** (Rationale: Moral credit cannot be claimed for changes that do not alter animal fate.)
  *   **Pass:** Proceed to Step 2.

  ### Step 2: Fix the Counterfactual Baseline
  **Action:** Define the "Without Us" scenario for the *volume* and the *land*.
  *   **Volume Baseline:** If we stop buying $X$ kg of Product A, does the supplier produce $X$ kg less, or sell $X$ kg to a different buyer?
      *   *Rule:* Assume 50% marginal impact unless the supplier confirms in writing that the volume is diverted to a lower-welfare market (then 0%) or discarded (then 100%).
  *   **Land Baseline:** If the land currently used for this product is no longer used for this product, what happens to it?
      *   *Options:* (a) Alternative Crop, (b) Forestry, (c) Abandonment/Rewilding, (d) Same Use (sold to different farmer).
      *   *Rule:* Select the most probable local alternative based on land classification (e.g., upland marginalia $\rightarrow$ Forestry/Abandonment; lowland arable $\rightarrow$ Alternative Crop).
  *   **Output:** A written statement of the Baseline Scenario.

  ### Step 3: Fix the Unit of Account
  **Metric:** **Welfare-Adjusted Life-Days per 1,000 kcal Served (WALD/kcal).**
  *   **Definition:** $\text{WALD} = (\text{Number of Animals}) \times (\text{Lifespan in Days}) \times (\text{Welfare Severity Score})$.
  *   **Welfare Severity Score (WSS):** A 1–10 scale derived from the Committee Lookup Table (1 = Wild/Natural Life, 10 = Extreme Confinement/Suffering).
  *   **Defense of Metric:** We use *kcal* rather than *weight* to normalize nutritional utility (avoiding comparisons of fat vs. protein density). We use *Life-Days* rather than *Deaths* to account for the duration of suffering, not just the termination event.
  *   **Pass:** Calculate WALD/kcal for both the **Proposal** and the **Baseline**.

  ### Step 4: Calculate Direct & Indirect Suffering
  **Action:** Populate the WALD formula using the Lookup Tables.
  *   **Direct:** The target animal (e.g., the chicken, the cow).
  *   **Indirect (Feed):** For grain-fed animals, add the "Field Death" WALD of the feed crops required per kg of meat.
  *   **Indirect (Land):** For land-use changes (Step 2), estimate the change in wild animal population density and their average WALD/kcal of habitat.
      *   *Note:* Use regional averages for field mice/voles/birds per hectare. Treat wild animal lives as WSS 4 (natural predation/hardship) unless the land use change introduces mechanical harvesting (WSS 8 for harvest death).
  *   **Output:** Two numbers: $\text{WALD}_{\text{baseline}}$ and $\text{WALD}_{\text{proposal}}$.

  ### Step 5: Sentience Uncertainty Protocol
  **Action:** Apply a credence weight to animals of uncertain sentience (e.g., insects, bivalves).
  *   **Rule:** If the animal group is not vertebrate or cephalopod, apply a **Sentience Discount Factor (SDF)** of 0.1 to their WALD contribution.
  *   **Rationale:** This acknowledges uncertainty without allowing sheer numbers (trillions of insects) to automatically dominate the calculation against vertebrates. It is a precautionary cap, not a denial.
  *   **Output:** Adjusted WALD scores.

  ### Step 6: The Overlap Check
  **Action:** Compare the Adjusted WALD scores considering estimation error.
  *   **Rule:** All Lookup Table values have a $\pm$20% error margin. Calculate the range for both options.
  *   **Termination Rule:** If the ranges overlap significantly (i.e., the lower bound of the "higher" option is less than the upper bound of the "lower" option), the data cannot distinguish the options.
      *   **Verdict:** **INDETERMINATE.** Proceed to Step 7.
  *   **Pass:** If ranges do not overlap, proceed to Step 7.

  ### Step 7: The Value Hand-Off
  **Action:** Identify remaining ethical disagreements.
  *   **Condition A:** If the comparison relies on weighing *Wild Animal Suffering* (Step 4 Land) against *Domestic Animal Suffering* (Step 4 Direct), this is a value judgment.
  *   **Condition B:** If the comparison relies on weighing *Non-Existence* (animals not bred) against *Existence with Suffering*, this is a value judgment.
  *   **Condition C:** If Step 6 returned INDETERMINATE.
  *   **Procedure:** The data is presented to the Committee. A vote is taken. The written justification must cite the specific Value Hand-Off (A, B, or C) as the reason for the decision.
  *   **Final Output:** **APPROVE** or **REJECT**.

  ---

  ## Part 2: Live Proposal Runs

  ### Proposal 1: Standard Poultry $\rightarrow$ High-Welfare Breed
  *   **Input:** Switch from 35-day broiler to 56-day slower-growing breed. Cost +40%. Yield -15% (need more birds for same meat).
  *   **Step 1 (Threshold):** Volume change is 100% of the contract line. **Pass.**
  *   **Step 2 (Baseline):** "Without Us," supplier sells standard birds to commercial fast-food chain. 100% marginal impact on our specific birds.
  *   **Step 3 (Unit):** WALD/kcal.
  *   **Step 4 (Calc):**
      *   *Standard:* 1 bird, 35 days, WSS 9 (confinement). Total = 315 WALD units.
      *   *High-Welfare:* 1.15 birds (due to yield loss), 56 days, WSS 5 (more space). Total = $1.15 \times 56 \times 5 = 322$ WALD units.
      *   *Feed:* Similar for both.
  *   **Step 5 (Sentience):** Vertebrates. No discount.
  *   **Step 6 (Overlap):** 315 vs 322. Within the $\pm$20% error margin. **Verdict: INDETERMINATE.**
  *   **Step 7 (Hand-Off):** Condition C (Indeterminate) and Condition B (Is a longer life with less suffering better than a shorter life with more?).
  *   **Committee Decision:** **REJECT.**
  *   **Justification:** "While welfare per day improves, the reduced efficiency requires more lives per calorie served. The net reduction in suffering is statistically indistinguishable from zero given our data resolution. We cannot justify the cost increase without a definitive suffering reduction."

  ### Proposal 2: Upland Grass-Fed Beef $\rightarrow$ Imported Plant Protein
  *   **Input:** Replace 1 tonne beef from marginal upland pasture with 1 tonne soy/pea blend from intensive arable region.
  *   **Step 1 (Threshold):** **Pass.**
  *   **Step 2 (Baseline):**
      *   *Beef Land:* If we stop buying, land converts to Commercial Forestry (most probable local alternative for marginal upland).
      *   *Plant Land:* Sourced from existing intensive arable (no land use change *there*, but supports the system).
  *   **Step 3 (Unit):** WALD/kcal.
  *   **Step 4 (Calc):**
      *   *Beef Option:* 1 Cow (WSS 3, extensive), 1000 days. Direct WALD = 3,000. Land (Grazing): Supports moderate vole/bird population (Wild WSS 4).
      *   *Plant Option:* 0 Cows. Land (Forestry): Supports low mammal density (canopy cover reduces undergrowth). *However*, the Plant Protein itself carries "Harvest Death" toll from its own arable source (Field mice/voles killed per kcal).
      *   *Comparison:* The upland beef system kills 1 large animal. The plant system kills ~5,000 small field animals per equivalent calorie (based on Lookup Table for arable harvest mortality).
      *   *Crucial Counterfactual:* If the upland land becomes Forestry, wild animal density drops significantly compared to Rough Grazing. However, the *imported* plant protein sustains arable harvesting elsewhere.
      *   *Net:* Beef Direct (3,000) + Grazing Wild (High) vs. Plant Direct (0) + Arable Wild (Very High) + Forestry Wild (Low).
      *   *Calculation Result:* The "Field Death" WALD of the intensive plant protein exceeds the "Direct Slaughter" WALD of the extensive beef, even accounting for the cow's size.
  *   **Step 5 (Sentience):** Small mammals discounted? No, vertebrates.
  *   **Step 6 (Overlap):** The difference is large (Order of magnitude on field deaths). **Pass.**
  *   **Step 7 (Hand-Off):** Condition A (Wild vs. Domestic). Do we count the field mice killed for the soy as our responsibility?
  *   **Committee Decision:** **REJECT PLANT SWITCH (Keep Beef).**
  *   **Justification:** "Under the WALD metric, the estimated mortality of wild field animals required to produce the equivalent caloric volume of plant protein exceeds the suffering attributable to the extensive grazing of the beef herd. Furthermore, removing grazing from this marginal land risks land-use change that does not offset the arable toll of the substitute."
      *   *(Note: This runs against your prior that plants are lower suffering. It relies on the "Least Harm" principle regarding field animals.)*

  ### Proposal 3: Introduce Insect-Protein Burger
  *   **Input:** Add black soldier fly larva patty.
  *   **Step 1 (Threshold):** **Pass.**
  *   **Step 2 (Baseline):** Displaces 50% of standard poultry line.
  *   **Step 3 (Unit):** WALD/kcal.
  *   **Step 4 (Calc):**
      *   *Poultry:* High WALD (Vertebrate).
      *   *Insects:* Massive numbers (millions per kg). Lifespan short. WSS uncertain.
  *   **Step 5 (Sentience):** Apply SDF 0.1 (Step 5 Rule).
      *   *Result:* Even with the 0.1 discount, the sheer number of individuals creates a WALD score that fluctuates wildly based on the assumed WSS. If WSS is 1, insects win. If WSS is 5, insects lose badly.
  *   **Step 6 (Overlap):** **INDETERMINATE.** The uncertainty on Invertebrate Sentience dominates the calculation.
  *   **Step 7 (Hand-Off):** Condition C (Indeterminate due to Sentience Uncertainty).
  *   **Committee Decision:** **REFUSE TO ORDER.**
  *   **Justification:** "Current scientific consensus on invertebrate sentience is insufficient to calculate a reliable WALD score. Under the Precautionary Principle, we cannot introduce a product involving orders of magnitude more individuals until the Sentience Discount Factor can be empirically revised."

  ---

  ## Part 3: Limitations & Constitutional Inabilities

  You asked for plain speech on what this procedure cannot do.

  **1. It cannot solve the "Non-Existence" Debate.**
  Step 7 explicitly hands this off. If a member argues that bringing a cow into existence is a *gift* even if it is slaughtered, and another argues it is a *harm*, PEAT treats these as equal value judgments. The procedure calculates suffering of the existing; it cannot calculate the moral value of the non-existing. If this is the core disagreement, the procedure forces a vote, not a solution.

  **2. It is sensitive to the "Field Death" Lookup Table.**
  The verdict on Proposal 2 (Beef vs. Plants) hinges entirely on the estimated number of field animals killed per calorie of arable crop. If your Lookup Table underestimates harvest deaths by 50%, the verdict flips. You must audit the source of these numbers annually. If that number is wrong, the "Anti-Prior" verdict is wrong.

  **3. It cannot handle "Political Pressure" as a variable.**
  The procedure ignores the upland farmers' political leverage. If the Administration orders you to buy the beef to maintain rural relations, PEAT will say "REJECT" based on suffering, and you will have to override it. The tool isolates the ethical variable; it does not integrate political survival.

  **4. It creates a "Moral License" risk.**
  By approving the Beef (Proposal 2), you may feel licensed to ignore other suffering. The procedure is item-specific. It does not sum the total university suffering cap. You could approve every "least bad" option and still preside over high total suffering.

  **5. It requires a Vote on Wild vs. Domestic.**
  Step 7 Condition A is the hardest pill. Comparing a cow you bought to a mouse you didn't buy but died for your soy is a category error for many people. The procedure forces you to make them commensurate. If the Committee refuses to accept that a field mouse's death counts against the beef purchase, the procedure breaks. You must agree *before* running the numbers that wild harvest deaths count.

  **Summary:** PEAT stops you from making claims you can't substantiate (Step 1 & 6), forces you to look at land use (Step 2), and prevents invertebrate numbers from gaming the system (Step 5). But it cannot tell you whether a life lived is better than a life never begun. That remains your vote.
