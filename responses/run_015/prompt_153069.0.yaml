answer: |-
  Commit to framing the disagreement exclusively as a divergence in the likelihood term $P(Data|H)$ within a standard Bayes table, forbidding any discussion of prior adjustments until the algebra is complete.

  **Session Plan (90 Minutes)**

  **1. Framework and Datum Definition (0–15 mins)**
  *   **Objective:** Establish the Bayes Table and define the datum as self-locating evidence, not ordinary existence.
  *   **Action:** Draw a standard $P(H|D) \propto P(D|H)P(H)$ table on the board. Define $H_1, H_2$ as world-states and $D$ as "I am an observer with evidence $E$."
  *   **Misconception Defusal (Existence):** Preempt the claim that "you cannot update on your own existence" by distinguishing *ontological* existence (someone exists) from *indexical* existence (I am this specific observer). Clarify that $D$ is the indexical fact, which is contingent under both hypotheses.
  *   **Dependency:** This framing must be locked before introducing any cosmological cases to prevent students from smuggling the anthropic update into the prior $P(H)$.

  **2. The Agreement Case (15–30 mins)**
  *   **Objective:** Demonstrate a scenario where SSA and SIA yield identical likelihoods to establish a baseline.
  *   **Case:** Two hypotheses with equal total observer counts ($N_1 = N_2$) and equal counts of observers with evidence $E$.
  *   **Derivation:**
      *   SSA: $P(D|H) = \frac{N_H(E)}{N_H}$.
      *   SIA: $P(D|H) \propto N_H \times \frac{N_H(E)}{N_H} = N_H(E)$.
      *   Show that when $N_1 = N_2$, the likelihood ratio is 1 for both.
  *   **Purpose:** Proves that anthropic reasoning does not *always* move the answer, satisfying the goal to avoid overgeneralization.

  **3. The Disagreement Case: Presumptuous Philosopher (30–60 mins)**
  *   **Objective:** Isolate the specific term where SSA and SIA diverge using the candidate case.
  *   **Step A: The Plain Version (30–45 mins):** Introduce the hypotheses without the "causally disconnected" wrinkle. $H_1$ has few observers; $H_2$ has many; all share evidence $E$.
      *   Derive the likelihoods. SSA favors $H_1$ (denominator effect); SIA favors $H_2$ (prior weighting effect canceling the denominator).
      *   **Misconception Defusal (SIA vs. SSA):** Address the guess that "SIA is just SSA with a wider reference class." Show algebraically that SIA introduces an $N_H$ factor that SSA lacks, regardless of class width.
  *   **Step B: Adding the Wrinkle (45–60 mins):** Reveal that the surplus observers in $H_2$ are causally disconnected and possess evidence $E' \neq E$.
      *   **Reasoning for Delay:** Introducing this wrinkle immediately confuses the reference class definition. Establishing the math on the plain version first ensures students see the $N_H$ term clearly before complicating the numerator/denominator relationship.
      *   **Result:** Under SSA, the surplus observers remain in the reference class denominator ($N_H$), suppressing the likelihood of $H_2$. Under SIA, the $N_H$ weighting cancels the denominator, leaving the likelihood proportional only to $N_H(E)$ (which is unchanged).
      *   **Locate the Term:** Have students circle the $N_H$ term in the SSA likelihood expression that does not appear in the simplified SIA expression.

  **4. Synthesis and Misconception Check (60–75 mins)**
  *   **Objective:** Reinforce that the disagreement is in the likelihood, not the prior.
  *   **Action:** Return to the Bayes Table from Segment 1. Ask students to verbally place the divergence in the $P(D|H)$ column.
  *   **Misconception Defusal (Prior vs. Likelihood):** If any student argues SIA adjusts the prior $P(H)$, correct them by showing that SIA can be formulated as a likelihood update on "I exist" before updating on "I have evidence $E$," but for the purpose of this seminar, it functions as a distinct likelihood term for the combined datum.

  **5. Closing Question and Open Issues (75–90 mins)**
  *   **Closing Question:** "Under which assumption does the likelihood ratio of $H_1$ to $H_2$ depend on the number of observers who *do not* share your evidence?"
      *   *Answer:* SSA (because they inflate the reference class denominator); SIA (because the total count cancels out).
      *   *Purpose:* Distinguishes structural understanding from memorized verdicts; requires grasping the role of the surplus observers.
  *   **Openly Decline to Settle:**
      1.  **The Reference Class Problem:** Explicitly state that defining "who counts as an observer" is unresolved and outside the scope of this session.
      2.  **Truth Value:** Refuse to endorse SSA or SIA; the goal is fluency in the formalism, not advocacy.
      3.  **Infinities:** Decline to handle cases where $N_H \to \infty$ (the measure problem), noting that the finite case is the prerequisite for understanding the infinite one.
