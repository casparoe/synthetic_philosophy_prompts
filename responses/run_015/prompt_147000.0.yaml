      *   *Preface Paradox (Makinson):* Author believes every claim in the book (based on evidence). But author also believes (based on past experience/humility) that at least one claim is likely false. Conjunction: All claims are true AND at least one is false. Contradiction.
      *   *Lockean Thesis:* Belief is justified if probability > threshold $t$ (where $t < 1$).
