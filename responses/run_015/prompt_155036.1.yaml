answer: |-
  As an expert in the philosophy of history and causal ontology, I appreciate the precision of your observation. You have identified a friction point that lies at the very heart of our discipline's self-conception. The discrepancy you note between historical peer review and the practices of epidemiology, climatology, or tort law is not merely bureaucratic; it is symptomatic of deep-seated ontological and methodological commitments regarding what constitutes a *historical explanation* versus a *natural explanation*.

  Per your instruction, I will first lay out the brainstorming phase to map the conceptual terrain before constructing the full argument.

  ### Phase 1: Brainstorming Key Distinctions

  Before we reconstruct the implicit theory, we must disentangle three specific conceptual knots that are often conflated in this debate:

  1.  **Causal Efficacy vs. Historical Significance:**
      *   *Causal Efficacy:* A volcanic eruption releases aerosols; aerosols block sunlight; crops fail. This is a biophysical chain. It is true regardless of human observation.
      *   *Historical Significance:* The crop failure leads to *revolution* in France but *stability* in Prussia. Why?
      *   *Distinction:* The peer-review norm assumes that biophysical efficacy does not automatically translate to historical significance. The "history" begins where the biophysical chain intersects with a contingent social structure.

  2.  **Triggering Conditions vs. Structural Causes:**
      *   *Trigger:* The drought is the spark.
      *   *Structure:* The grain storage system, the legitimacy of the ruler, the trade networks are the tinder.
      *   *Distinction:* If a historian treats the drought as the sole cause, they are mistaking the trigger for the structural cause. The demand for "mediation" is a demand to analyze the tinder, not just the spark. Without mediation, the explanation is incomplete because the spark alone is insufficient.

  3.  **Explanatory Levels and Emergence:**
      *   *Level 1 (Natural):* Pathogen replication rates, temperature anomalies.
      *   *Level 2 (Social):* Tax collection, religious ritual, military logistics.
      *   *Distinction:* Social facts are *emergent*. They rely on biological/physical substrates but operate according to different rules (e.g., legitimacy, value, power). To explain a social outcome (Level 2) using only natural premises (Level 1) is a category error (reductionism). The "mediation" requirement is a safeguard against reducing Level 2 to Level 1.

  ***

  ### Phase 2: Reconstructing the Implicit Theory

  Now, let us address your specific questions regarding the philosophical commitments of this peer-review norm.

  #### 1. What philosophical commitments does the norm presuppose?
  The norm presupposes a **non-reductive realist ontology** regarding social structures. It commits the discipline to the view that social entities (institutions, economies, cultures) possess causal powers that are *sui generis*—distinct from, though dependent upon, the physical world.

  It does **not** strictly commit to the view that only *intentional* agents count as historical actors (a strict Collingwoodian view where cause = reason). Rather, it commits to the view that **human systems possess distinctive causal powers of resilience, adaptation, and interpretation.**

  When a reviewer asks for "mediating mechanisms," they are asking for an account of **contingency**. If a drought *necessarily* causes polity fragmentation, history becomes physics. If a drought causes fragmentation *only when* mediated by a specific type of tax system or religious ideology, then history remains a domain of human contingency. The norm presupposes that the "human variable" is not a passive conduit but an active filter that transforms physical inputs into historical outputs.

  #### 2. Does it rely on "Intentional Agency" or "Mediating Agency"?
  It relies on a nuanced ontology of **Mediating Agency**.
  *   **Non-human forces** are granted **Triggering Efficacy**. They alter the boundary conditions of human action.
  *   **Human institutions** possess **Transformative Agency**. They determine the *meaning* and *consequence* of that alteration.

  Consider the Black Death. The bacterium *Yersinia pestis* has the efficacy to kill. But whether that killing leads to the end of serfdom (as in parts of Western Europe) or the intensification of serfdom (as in Eastern Europe) is not determined by the bacterium. It is determined by the mediating agency of land-to-labor ratios, legal frameworks, and class solidarity. To treat the pathogen as the direct cause of "the end of feudalism" is ontologically incorrect because the pathogen lacks the capacity to select between those two divergent outcomes. The peer-review norm enforces this distinction.

  #### 3. Is the practice philosophically underdetermined?
  The norm is **philosophically underdetermined** in a productive way. It is compatible with several rival accounts of causation, provided they respect the autonomy of the social sphere:
  *   **Weberian Causal Adequacy:** The explanation must make the outcome intelligible according to rules of experience (i.e., we know how institutions react to stress).
  *   **Critical Realism (Bhaskar/Archer):** Social structures have emergent powers that cannot be reduced to natural laws.
  *   **Complexity Theory:** Social systems are complex adaptive systems; small physical inputs can have non-linear outcomes depending on the system's internal state.

  The norm *excludes* only **Crude Positivism** (where history is subsumed under natural laws) and **Hard Determinism** (where human response is negligible). It does not require a single theory of *how* mediation works, only *that* it must be demonstrated.

  #### 4. Is the norm internally coherent given Legal and Scientific frameworks?
  This is the most provocative part of your query. On the surface, there is an inconsistency: Law and Science often treat nature as a direct cause; History does not. However, this is **functionally coherent** because the *telos* (goal) of each discipline differs.

  *   **Science (Epidemiology/Climate):** The goal is **prediction and control** of natural systems. Identifying the pathogen as the cause is sufficient for developing a vaccine. The social response is a variable to be controlled for, not the primary object of study.
  *   **Law (Tort/Liability):** The goal is **allocation of loss**. In "Act of God" doctrines, nature is treated as a direct cause to *exonerate* human defendants. However, in negligence cases, law *does* demand mediation (e.g., "Did the city fail to maintain the levees during the flood?"). When law assigns liability to a "natural disaster," it is often a pragmatic shorthand to close the case, not an ontological claim about history.
  *   **History:** The goal is **understanding human contingency**. If history accepted "natural disaster" as a sufficient explanation, it would cease to be a study of human affairs and become a branch of climatology.

  Therefore, the norm is internally coherent *relative to the disciplinary object of history*. It would only be incoherent if history claimed to be a natural science. The friction arises because we live in a world where these discourses overlap, but their criteria for "sufficient cause" are tailored to their specific ends.

  #### 5. Concrete Changes if Non-Human Forces were Full "Historical Actors"
  If we adopted an ontology (such as **Actor-Network Theory** or **Object-Oriented Ontology**) that granted non-human forces full status as historical actors without requiring human mediation, the consequences would be radical:

  *   **Narrative Construction:**
      *   *Current:* "The King failed to store grain, leading to revolt during the drought." (Human failure is the pivot).
      *   *New:* "The drought and the King entered into an alliance of failure that produced revolt." (Symmetrical agency).
      *   *Change:* Narratives would become flatter. The distinction between "background conditions" and "foreground actions" would dissolve. We might see narratives written from the perspective of the pathogen or the climate system, where human institutions are merely part of the environment the pathogen navigates.

  *   **Assignment of Responsibility:**
      *   *Current:* Moral responsibility rests on those who could have mediated the impact (leaders, planners).
      *   *New:* Responsibility becomes diffuse. If the volcano is an actor, can it be "blamed"? Or does blame vanish entirely into a web of interactions?
      *   *Risk:* This risks **depoliticizing disaster**. If a famine is caused by a "network of wheat, rain, and markets" where all are equal actors, it becomes harder to argue that specific political choices exacerbated the suffering. It could inadvertently absolve human negligence by ontologically elevating the negligence of nature.

  *   **Curatorial Design (Public History):**
      *   *Current:* Exhibits focus on human artifacts (tools, letters, laws) with environmental context provided via panels/maps.
      *   *New:* Exhibits would center the non-human agents. A museum on the Fall of Rome might feature a core sample of Greenland ice as a primary "document" equal to a letter from Cicero. The narrative would not be "How Romans responded to climate," but "How the Climate and Romans co-constituted the Fall."
      *   *Change:* This would be intellectually rich but potentially alienating to a public seeking lessons on human governance. It shifts the lesson from "how we govern" to "how we coexist with forces we cannot govern."

  ### Conclusion

  The peer-review norm you describe is a defensive mechanism protecting the **autonomy of the historical social sphere**. It insists that while non-human forces provide the *stage* and the *stressors*, the *script* is written by human mediation.

  While this creates tension with scientific and legal discourses, it is coherent within the philosophical project of history as a study of human contingency. To abandon this norm in favor of full non-human agency would not just change our footnotes; it would fundamentally alter the moral architecture of historical judgment, potentially obscuring the very human failures that historical inquiry is often meant to illuminate. The challenge for your seminar, then, is to articulate a theory of mediation that acknowledges the *power* of the non-human without surrendering the *responsibility* of the human.
