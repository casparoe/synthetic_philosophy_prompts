  Good evening, everyone. For those who haven't met me, I'm one of Elena's former students. For those who don't know what Elena actually *does*—which I know includes half the people in this room—she spends her time thinking about what things are capable of doing, not just what they actually do. She studies potential. Power. Capacity.

  In her world, we talk a lot about "finks" and "masks." Roughly speaking, a fink is when a capacity vanishes the moment you try to use it. A mask is when the capacity is still there, but something blocks it from showing up. For forty years, Elena has been mapping the boundaries of these ideas. But tonight, I want to borrow her tools to talk about her.

  I've been thinking about what I'd call a "social fink." Usually, when an institution faces stress, we assume its capacity to function disappears. We say the system broke. But Elena's best work suggests something more subtle. Often, the capacity doesn't vanish. It gets structurally rerouted. The institution reshuffles roles so quickly under pressure that the triggering conditions never actually reach the ability. The strength remains intact, hidden in plain sight, neutralized not by loss, but by diversion.

  This is how I understand Elena's career. I could stand here and say she "changed the field." But that implies a simple causal push—that she acted, and the field moved. That treats her influence like a direct disposition, and I don't think that captures it. Her influence is socially finked. She didn't just force new answers; she reshaped the structure of our questioning so that the old problems couldn't even reach us in the same way. She taught us that what looks like failure is often just wiring we haven't learned to read yet.

  To her colleagues: You know this feeling. It's in the way we now approach a puzzle. The disposition is still there, in the work we do, even if the credit gets rerouted elsewhere.

  To her family and friends: You know this too. You've watched her navigate crises where everyone else saw dead ends. She never confused rerouting with disappearance. She never confused silence with absence. She taught us that resilience isn't just enduring stress; it's understanding the structure well enough to know where the capacity is hiding.

  So, regarding this retirement. In metaphysics, we worry about whether a disposition survives when the conditions change. Elena has answered that for us. Retirement is not a finkish loss of her intellect. It is a structural rerouting. The triggering conditions of the university are falling away, but the capacity remains intact. She is not stepping out of the picture; she is stepping out of the frame we built around her.

  Elena, thank you for showing us how to look for the power that remains when the stress hits. Thank you for teaching us that nothing valuable ever truly vanishes; it just waits for the right structure to let it show.

  To Dr. Vasquez.
