  A: Submit Form 99-$\infty$ (Request for Eschatological Review). Your complaint will be adjudicated at the limit as time approaches infinity. Please note that no applicant has yet lived to see a resolution. Processing times are indefinite. You will be notified when the ensemble average converges to your personal outcome.

