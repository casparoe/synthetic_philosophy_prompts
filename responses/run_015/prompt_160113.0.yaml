  Conversely, a loss of 99% of your Total Bankroll constitutes a utility loss of exactly 4.6 log-units. This is precisely offset by a hundredfold gain. Citizens are encouraged to view catastrophic loss and exponential gain as symmetric events. If you lose everything that matters to you, you have merely incurred a debt of 4.6 units against your next century of growth.

