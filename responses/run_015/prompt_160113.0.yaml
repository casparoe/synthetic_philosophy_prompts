  A: The Long Run is a state of compliance, not a temporal duration. Your finite horizon is irrelevant because logarithmic utility is optimal at every horizon. You are not living for yourself; you are living for the trajectory. Residual worries about finite horizons are impatience dressed up as philosophy.

  **Q: Why is logarithmic utility mandatory?**
  A: It is the Bureau's utility function. There is only the one. Other utility functions imply finite ruin or satiation, both of which impede national growth.

