  *   Betting **half** the optimal fraction retains **75%** of the maximal growth rate. Underbetting is forgiving.
  *   Betting **twice** the optimal fraction reduces the geometric growth rate to **zero**. Overbetting eliminates progress entirely.

  Therefore, the Bureau errs on the side of official confidence. The probabilities provided are "forward-looking estimates." Even if the true edge is lower than estimated, the penalty for overbetting based on official figures is severe. However, since the probabilities are official, they are by definition the inputs required for compliance. Do not adjust for personal doubt.

  **5. FREQUENTLY ASKED QUESTIONS**

  **Q: Must I wager my marriage or health?**
  A: Yes. These are non-liquid components of your Bankroll. The theorem justifying this policy assumes an indefinitely repeated, fully reinvested gamble. Your marriage is such a gamble. To treat it as exempt is to deny the universality of geometric rationality.

