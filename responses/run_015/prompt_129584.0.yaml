answer: |-
  # Collapse vs. Reconfiguration: Sorting Tree

  **Node 1 (Start): Easter Island (Rapa Nui)**
  *The moai stop getting built, the Birdman cult starts. People stay on the island.*
  *   **Left:** It's just a religious reorientation (no collapse). → *Go to Node 2*
  *   **Right:** It counts as collapse even though the population stayed. → *Go to Node 3*

  **Node 2 (Left Branch): Why call it reorientation?**
  *   **Left:** We only call it "collapse" elsewhere because archaeologists are obsessed with big monuments. → **Leaf 1**
  *   **Right:** Small-scale local trade networks survived and adapted, so the society didn't fail. → **Leaf 4**

  **Node 3 (Right Branch): If it is collapse, what defines it?**
  *   **Left:** The disappearance of writing (like Linear B or Maya script) is required. → **Leaf 5**
  *   **Middle:** A population crash is enough, even if local exchange ("administrative dark matter") keeps going. → **Leaf 3**
  *   **Right:** It's about losing hierarchical integration and complexity (writing helps show this, but isn't the only rule). → **Leaf 2**

  ***

  **The Leaves (Outcomes)**

  *   **Leaf 1 (Pure Narrative Framing):** You have to admit we mostly call it "collapse" because we get sad when the big stone projects stop.
  *   **Leaf 4 (Silent Reorganization):** You're arguing survival looks like failure to us because small trade doesn't leave big ruins.
  *   **Leaf 5 (Empty Combo):** Nobody really sits here: you can't say Easter Island collapsed while insisting writing loss is required, since they never had writing.
  *   **Leaf 3 (Demographic Determinist):** You're counting bodies over institutions, so a ghost town with a king is still "society."
  *   **Leaf 2 (Complexity-Loss):** You have to explain why losing the palace matters more than the farmers keeping trade going.

  ***

  **Note on Separation:** Leaf 1 and Leaf 4 look similar (both say "no collapse"), but this tree separates them at Node 2 based on *why* you think that (bias vs. network survival), so they are not identical.
