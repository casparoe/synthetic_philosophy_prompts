answer: |-
  # The Natural Heritage Vagueness Protocol (NHVP)
  **Version 1.0 | For Use by County Natural Heritage Review Board**

  ## Preamble: Authority and Interpretation
  **Constraint:** The Board cannot amend the bylaw.
  **Workaround:** To ensure consistency (and avoid arbitrary Sorites traps), the Board will maintain an internal **Admissible Sharpening Log (ASL)**. This is not a rulebook for the public, but a record of how the Board has *operationalized* vague terms in past decisions (e.g., "In Case 2023-04, 'mature stand' was treated as requiring canopy closure >70%").
  **Philosophical Note:** This acts as a *supervaluationist* precisification. If you are an *epistemicist*, the ASL is merely a record of our best guesses at the hidden boundary. If you are a *supervaluationist*, the ASL creates the boundary where none existed.
  **Action:** Before the first meeting of the fiscal year, the Board must review the ASL. If the ASL is empty or contradictory, the Board acknowledges it is operating without precedent and risks inconsistency.

  ---

  ## Step 1: The Evidence Sufficiency Check (Ignorance vs. Vagueness)
  **Goal:** Distinguish between "we don't have the data" and "the data won't help."
  **Time Limit:** 5 Minutes.

  **Q1.1:** Does the site file contain quantitative data for the four statutory criteria?
  *   **Viable Breeding Population:** Survey counts (season/dates), species status listing.
  *   **Mature Stand:** Aerial photos (date), tree core samples, canopy closure % from ecologist memo.
  *   **Hydrological Connection:** Soil maps (hydric soils), floodplain maps, distance to corridor.
  *   **Minimal Adverse Impact:** Engineering plans, footprint maps, mitigation statements.

  **Q1.2:** Is the missing data *obtainable* by the applicant before the statutory deadline?
  *   **Yes:** **EXIT A (Deferral).** Finding: "Criteria cannot be assessed due to evidentiary gap. Applicant invited to resubmit with [Specific Data]."
      *   *[Epistemicist Marker]:* If you believe a sharp boundary exists, lack of evidence is the only reason you can't find it. This exit is mandatory for Epistemicists.
      *   *[Supervaluationist Marker]:* If the concept itself is gappy, more data won't help. Only take this exit if the *measurement* is missing, not if the *concept* is unclear.
  *   **No:** Proceed to Step 2.

  ---

  ## Step 2: The Non-Compensatory Veto Check
  **Goal:** Explicitly handle trade-offs.
  **Choice:** **Single-Dimension Sink (Veto).**
  **Rationale:** The bylaw uses "and" (conjunctive). A parcel that destroys a viable population cannot be saved by excellent hydrology. Aggregating scores hides fatal flaws.

  **Q2.1:** For each of the four criteria, does the evidence clearly satisfy the *most lenient* admissible sharpening in the ASL?
  *   **All Yes:** Proceed to Step 3 (Potential Approval).
  *   **Any No:** Does the evidence clearly fail the *most strict* admissible sharpening in the ASL?
      *   **Yes:** **EXIT B (Clear Denial).** Finding: "Parcel fails Criterion X under all admissible interpretations."
      *   **No (The Borderline Zone):** The evidence falls between the lenient and strict sharpenings. Proceed to Step 3 (Indeterminate).

  ---

  ## Step 3: The Sorites Consistency Scan
  **Goal:** Handle the "Chain of Five" problem. Prevent arbitrary line-drawing.
  **Time Limit:** 10 Minutes.

  **Q3.1:** Is there a pending or recently decided case (within the last 12 months) that differs from this one by less than 10% on the relevant metric (e.g., buffer width, acreage, pair count)?
  *   **No:** Proceed to Q3.2.
  *   **Yes:** Retrieve that case file.
      *   **Q3.1.a:** If we approve *this* parcel, does logic compel us to approve *that* parcel (or the next in the chain)?
      *   **Q3.1.b:** If we deny *this* parcel, does logic compel us to deny *that* parcel?

  **Q3.2:** The Discontinuity Declaration.
  If Q3.1 reveals a chain, the Board must explicitly state why *this* case is different.
  *   **Option A:** "We accept the consequence." (We approve this, acknowledging we must approve the next one when it arrives).
  *   **Option B:** "We declare a discontinuity." (We draw a line here).
      *   **Requirement:** You must cite a *relevant difference* other than the order of arrival (e.g., "Parcel 3 contains a nesting site; Parcel 4 does not"). If no relevant difference exists, you cannot choose Option B without contradicting the principle of equal treatment.

  **[Philosophical Divergence Point]**
  *   *[Epistemicist Output]:* If you believe there is a true boundary, Q3.1 is a check on our *knowledge*. You should vote based on where you think the *real* line is, even if it contradicts a prior error.
  *   *[Supervaluationist Output]:* There is no real line. Consistency is the only virtue. You must either extend the previous decision or explicitly update the ASL (see Step 4).

  ---

  ## Step 4: The Indeterminacy Exit
  **Goal:** Handle cases that are neither clearly In nor clearly Out.
  **Time Limit:** 5 Minutes.

  **Q4.1:** Is this case a "True Borderline" (Step 2 said No/Mixed) or a "Hard Case" (Step 1 said Missing Data)?
  *   **Hard Case:** Return to Exit A.
  *   **True Borderline:** Proceed to Q4.2.

  **Q4.2:** Select Decision Device.
  *   **Option 1: Precautionary Veto.** (Default to Denial).
  *   **Option 2: Provisional Designation.** (Approve with conditions).
  *   **Option 3: Randomized Lottery.** (Philosophically honest for Supervaluationists, legally risky).

  **Recommendation:** **Option 2 (Provisional Designation).**
  **Finding Language:** "The criteria underdetermine the status of this parcel. Approval is granted provisionally for 5 years, contingent on [Monitoring Plan]. Failure to meet metrics converts this to Denial."
  *   *[Epistemicist Marker]:* You should not use this exit. You should instead vote Yes or No based on your best estimate of the truth, acknowledging you might be wrong.
  *   *[Supervaluationist Marker]:* This is the honest exit. The criteria *do not* determine the answer. The Board is creating a local rule to resolve the gap.

  **Q4.3:** Referral Check.
  Does resolving this case require a *general* rule change (e.g., changing "mature" from 80 years to 50 years for *all* future cases)?
  *   **Yes:** **EXIT C (Referral to Commissioners).** Finding: "Board cannot apply bylaw without effectively amending it. Recommendation: Amend Section X."
  *   **No:** **EXIT D (Provisional Decision).** Proceed to vote.

  ---

  ## Step 5: Final Vote and Documentation
  **Time Limit:** 5 Minutes.
  **Requirement:** The written finding must explicitly state which Exit was taken.
  **Judgment Relocation Flag:** If Exit D is chosen, the finding must state: "This decision relies on Board discretion to resolve semantic indeterminacy, not on factual discovery."

  ---

  # Application of the Procedure to Test Cases

  ### Case 1: The 240-Hectare Mature Forest
  *   **Data:** 14 breeding pairs (listed warbler), unbroken canopy, soil maps show hydric connection.
  *   **Step 1:** Evidence sufficient.
  *   **Step 2:** Satisfies even the *strictest* sharpening in the ASL. (14 pairs > threshold; 240ha > minimum patch size).
  *   **Step 3:** No conflicting precedents.
  *   **Step 4:** Not a borderline case.
  *   **Result:** **EXIT (Clear Approval).**
  *   **Comment:** Trivial. The vagueness of the bylaw does not reach this high of quality.

  ### Case 2: The Mowed Field with Drainage Ditch
  *   **Data:** No breeding pairs, no trees (aerial photo), ditch connects to river.
  *   **Step 1:** Evidence sufficient.
  *   **Step 2:** Fails "Viable Population" and "Mature Stand" under even the *lenient* sharpenings.
  *   **Result:** **EXIT (Clear Denial).**
  *   **Comment:** Trivial. The Veto (Non-Compensatory) rule sinks this immediately regardless of hydrological connection.

  ### Case 3: The 11-Hectare Woodlot (The "Middle Case")
  *   **Data:** 2 breeding pairs (threshold is vague, ASL ranges 1-3), canopy 60% (ASL ranges 50-70%), purchase option expires in 6 weeks.
  *   **Step 1:** Evidence sufficient.
  *   **Step 2:** **Mixed.** Satisfies lenient sharpening, fails strict sharpening. Enters Borderline Zone.
  *   **Step 3:** Scan reveals a 12-hectare parcel denied last year (3 pairs) and a 10-hectare parcel approved (1 pair, but high hydrology).
  *   **Step 4:**
      *   *Epistemicist Path:* Vote Yes or No based on "best guess." Risk: If you vote Yes, you contradict the 12-hectare denial. If No, you contradict the 10-hectare approval.
      *   *Supervaluationist Path:* Acknowledge the criteria are silent.
      *   *Procedure Output:* **EXIT D (Provisional Designation).**
  *   **The Answer You Will Not Like:** The procedure prevents a clean "Approval" needed for the purchase option. It forces a **Provisional Designation**. The land trust may not be able to close the deal with a provisional status, or the landowner may withdraw. The procedure sacrifices the *speed/certainty* the applicant needs to preserve the *integrity* of the Board against the Sorites paradox.
  *   **Judgment Relocation:** The Board is not finding a fact; it is managing risk. The finding must admit this.

  ### Case 4: The Gradient Chain (40, 38, 36, 34, 32 metre buffers)
  *   **Data:** Five parcels, identical except buffer width. ASL has no prior definition of "substantial connection."
  *   **Step 1:** Evidence sufficient.
  *   **Step 2:** All are Borderline. (No ASL standard for buffer width).
  *   **Step 3:** **The Sorites Trap.**
      *   If you approve 40m, can you deny 38m? The difference is 2m (hair's breadth).
      *   Procedure forces **Q3.2 (Discontinuity Declaration).**
  *   **Action:** You must choose a cutoff *now* for the whole chain to avoid contradiction.
      *   *Choice:* "We set the admissible sharpening at 35 meters for this watershed."
      *   *Result:* 40m & 38m Approved. 36m, 34m, 32m Denied.
  *   **Step 4:** **EXIT C (Referral to Commissioners).**
      *   *Reason:* Setting a 35m standard is effectively writing a rule. The Board is admitting it cannot apply the vague term "substantial" without creating a specific metric.
      *   *Alternative:* If Commissioners don't act, Board adopts it as **ASL Precedent** (Exit D).
  *   **Comment:** This exposes the Board's lack of authority. You are forced to act like legislators to avoid absurdity.

  ---

  # Philosophical Honesty Markers & Divergences

  | Feature | Epistemicist Picture (Boundary Exists) | Supervaluationist Picture (Boundary Open) | Procedure's Stance |
  | :--- | :--- | :--- | :--- |
  | **Findings Language** | "We find the facts do not meet the standard." (Implies truth exists) | "The criteria do not determine an outcome." (Implies gap exists) | **Supervaluationist.** Requires admitting underdetermination in Exit D. |
  | **Request for Evidence** | "Submit more data." (Belief: Data locates boundary) | "Data will not resolve this." (Belief: Concept is gappy) | **Hybrid.** Step 1 allows data request, but Step 4 forbids it for True Borderlines. |
  | **Undecidable Case** | Vote Yes/No (Guess the truth). | Lottery or Provisional Rule. | **Provisional Rule.** Rejects Lottery as legally untenable, rejects Guessing as dishonest. |
  | **ASL / Precedent** | Record of past errors/successes. | Creation of admissible sharpenings. | **Supervaluationist.** Treats ASL as defining the boundary. |

  ---

  # Limitations and Expected Failures (After One Year)

  1.  **The "Referral Black Hole":** You will likely generate several **Exit C (Referral to Commissioners)** findings, particularly on the Gradient Chain cases. As you noted, Commissioners meet quarterly and rarely act.
      *   *Failure:* Cases will stall indefinitely. The Procedure identifies the problem but cannot force the Commissioners to solve it. You will face pressure to bypass Exit C and make the rule yourself (Exit D), risking *ultra vires* appeals.
  2.  **The "Provisional" Burden:** Exit D (Provisional Designation) creates administrative work for your single staff ecologist (monitoring plans, 5-year reviews).
      *   *Failure:* Staff burnout. You may stop using Exit D and revert to arbitrary Yes/No votes to save time, rendering the Procedure decorative.
  3.  **The Authority Paradox:** To solve the Sorites (Case 4), the Procedure forces you to set a metric (e.g., 35m buffer).
      *   *Failure:* Applicants will appeal to the Commissioners arguing the Board *made law*. Since the Board has no authority to make law, the Commissioners may overturn the decision not on ecological grounds, but on procedural grounds. The Procedure makes you honest about your lack of power, which may paralyze you.
  4.  **Judgment Relocation:** The Procedure does not eliminate judgment; it relocates it from "Is this mature?" to "Is this a borderline case?" and "Which sharpening do we adopt?"
      *   *Failure:* Board members will disagree on the *classification* of the case (Step 2) rather than the outcome, leading to the same arguments, just one step earlier in the meeting.

  **Final Advice:** The Procedure works best if the Board treats the **Admissible Sharpening Log** as its primary product, and the individual case decisions as secondary. You are not just judging land; you are slowly, case-by-case, writing the dictionary for the bylaw. If the Commissioners will not do it, and the bylaw is vague, *someone* must. This Procedure ensures you do it consistently, openly, and with a record that survives appeal.
