answer: |-
  # Specification: Adequacy Conditions for Directed Obligation

  **Purpose:** To define the necessary conditions for any account of promissory obligation capable of grounding neighbouring normative phenomena (consent, offers, vows, contracts).
  **Scope:** Moral and Normative (distinct from purely legal enforcement).

  ### 1. Directedness and Waiver
  *   **Condition:** The obligation must be owed *to* a determinate person (or entity), and the power to release the obligor from the duty must reside exclusively with that person.
  *   **Motivating Case:** If A promises B to φ, C cannot release A from the obligation, even if C is A's moral superior. Conversely, B can release A even if φ would greatly benefit third parties.
  *   **Classification:** **Generalizable** (Applies to consent, contracts, debts).
  *   **Status:** **Non-negotiable.** (Without this, the obligation is not *directed*, but merely general).

  ### 2. Normative Force Independence
  *   **Condition:** The obligation must arise even if the promisor lacks a contemporaneous intention to perform at the moment of undertaking.
  *   **Motivating Case:** The "Lying Promise." If A promises B to φ while secretly intending not to, A is still bound to φ (and guilty of a second wrong if they break it). The obligation does not vanish because the internal mental state was defective.
  *   **Classification:** **Promissory-specific** (Less relevant to pure consent, crucial for promises/vows).
  *   **Status:** **Non-negotiable.** (Distinguishes promising from predicting or hoping).

  ### 3. Non-Consequentialist Constraint
  *   **Condition:** The obligation must persist even in cases where breaking the promise would yield a marginally better outcome for the promisee than performance would.
  *   **Motivating Case:** The "Unreachable Promisee." A promises B to meet at noon. A knows B is unreachable and cannot release A. A discovers that by breaking the promise, A can save B from a minor harm B doesn't know about. A is still obligated to meet, unless the harm is catastrophic.
  *   **Classification:** **Promissory-specific.**
  *   **Status:** **Demand of a Particular Camp** (Deontological/Rights-based accounts; rejected by Act-Consequentialists).

  ### 4. Normative Addition
  *   **Condition:** The undertaking must alter the normative landscape, even if the content of the undertaking duplicates a pre-existing obligation.
  *   **Motivating Case:** Pre-existing Duty. A is already morally obliged to help B. A explicitly promises B to help. If A fails, A has committed a specific wrong against B (breach of promise) in addition to the general moral failure. The regress (promising to keep the promise, etc.) is a **distraction**; the shift is from a general duty (owed to morality/all) to a directed duty (owed to B).
  *   **Classification:** **Generalizable** (Crucial for Contracts and Vows).
  *   **Status:** **Non-negotiable.** (Without this, promising is normatively inert).

  ### 5. Gradability of Force
  *   **Condition:** The account must explain why some undertakings create weightier obligations than others, without altering the fundamental nature of the bond.
  *   **Motivating Case:** Assurance vs. Oath. A casual "I'll try to come" creates a defeasible expectation. A sworn oath on a grave creates a near-absolute constraint. The difference is in the *weight*, not the *existence*, of the obligation.
  *   **Classification:** **Generalizable** (Applies to Consent: casual permission vs. formal authorization).
  *   **Status:** **Non-negotiable.**

  ### 6. Primary Obligation Content
  *   **Condition:** The primary discharge of the obligation must be performance of the act, not compensation for its failure.
  *   **Motivating Case:** Morality vs. Law. In contract law, damages often suffice. In morality, if A promises B to attend B's wedding, A cannot simply pay B to be happy elsewhere. The specific act is what is owed.
  *   **Classification:** **Promissory-specific** (Contracts often allow substitution).
  *   **Status:** **Demand of a Particular Camp** (Moral Philosophers vs. Legal Realists/Economists).

  ### 7. Agency Neutrality
  *   **Condition:** The obligation must be capable of arising from undertakings issued by automated systems or organizational structures where no specific human agent intended the specific commitment, provided reliance was reasonably invited.
  *   **Motivating Case:** The Automated Ticket. A airline booking system issues a ticket due to a glitch. No human intended this specific contract. The passenger relies on it. The organization is bound, despite the lack of specific human *mens rea*.
  *   **Classification:** **Generalizable** (Essential for modern Contracts and Organizational Consent).
  *   **Status:** **Non-negotiable.** (Required for contemporary applicability).

  ***

  ### Specification Constraints & Conflicts

  **Incompatible Pair:**
  **Condition 3 (Non-Consequentialist Constraint)** and **Condition 7 (Agency Neutrality/Reliance)** create a theoretical fracture regarding the *source* of the obligation.
  *   *Reasoning:* Condition 3 implies the obligation is status-based (binding regardless of outcome/harm). Condition 7, in practice, is often motivated by the harm of reliance (outcome-based). A theory cannot ground obligation *solely* in the prevention of reliance-harm (which vanishes if the promisee is better off) and *simultaneously* satisfy Condition 3 (binding even if the promisee is better off). Adequate accounts must posit a hybrid source (Status + Reliance) or prioritize one, sacrificing explanatory power in the other domain.

  **Most Exclusionary Condition:**
  **Condition 2 (Normative Force Independence).**
  *   *Reasoning:* This condition excludes the largest number of candidate theories. Pure **Will Theories** fail because they require a concurrent intention to be bound for the obligation to exist. Pure **Reliance Theories** often fail because if no reliance occurs (and no harm is suffered), they struggle to explain why the lying promisor is still bound to *perform* rather than merely compensate. It forces the account away from psychological states and toward social norms or normative powers.

  ***

  ### Theoretical Evaluation

  **Will-Based Accounts**
  Will theories excel at satisfying **Condition 1 (Directedness)** and **Condition 5 (Gradability)**, as the intensity of the will can explain the weight of the obligation. However, they collapse against **Condition 2 (Normative Force Independence)**; if obligation stems from the will, a defective will (lying promise) should yield no obligation. They also struggle significantly with **Condition 7 (Agency Neutrality)**, as automated systems lack a "will" in the metaphysical sense required by these accounts, forcing awkward fictions about corporate personhood.

  **Reliance-Based Accounts**
  Reliance theories handle **Condition 7 (Agency Neutrality)** well, as the focus is on the recipient's detriment rather than the issuer's intent. They also explain **Condition 5 (Gradability)** via the reasonableness of reliance. However, they fail **Condition 3 (Non-Consequentialist Constraint)**; if the promisee is better off by the breach, reliance loss is zero or negative, so the obligation dissolves. They also struggle with **Condition 6 (Primary Obligation Content)**, as reliance is naturally satisfied by compensation (making the victim whole) rather than specific performance.

  **Practice-Based Accounts**
  Practice (or Convention) theories fare best overall. They satisfy **Condition 2 (Normative Force Independence)** because the rule of the practice binds regardless of internal intent. They handle **Condition 4 (Normative Addition)** by treating the promise as a move in a normative game that changes status. They struggle slightly with **Condition 1 (Directedness)**, as practices are often general social rules, requiring additional work to explain why the obligation is owed *to this specific person* rather than to the practice itself. They accommodate **Condition 7** by treating the automated output as a valid move within the institutional practice.
