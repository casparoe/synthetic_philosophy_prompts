answer: |-
  This is a compelling case study. It isolates a moment where the metaphysics of institutional facts becomes visible precisely because the usual machinery grinds against itself. Your notion of 'retroactive uptake' cuts to the heart of the tension between conventionalism (rules must exist prior to the act) and pragmatism (the act creates the rule). Here is the conceptual mapping you requested, adhering to your constraints.

  ### 1. Mapping the Episode: Speaker, Illocution, and Failed Conditions

  **The Speaker:** Schabowski occupies a hybrid status. He is a recognised office-holder (SED Politburo member), granting him general institutional standing. However, regarding the specific content of the announcement, he is acting outside his specific competence. He is a authorised speaker lacking specific authorisation.

  **The Intended Illocution:** Schabowski intends a **Directive** (informing journalists of new regulations) which he mistakenly frames as a **Declaration** (changing the status of the border). He believes he is reporting on a decision already made (constative-ish directive), but the form of his utterance functions as a decree.

  **Failed Felicity Conditions:**
  *   **Authority (A.1):** While he holds office, he lacks the specific procedural authority to enact immediate change without a written decree. The 'voice' is recognised, but the 'mandate' is defective.
  *   **Procedure (A.2):** The requisite bureaucratic steps (printed orders, chain of command notification to border guards) were incomplete.
  *   **Sincerity/Preparatory (B.1 & B.2):** He does not know the truth of the proposition he utters. He is guessing the timeline. In Austin's terms, he is not in a position to know if the conditions are met.

  Under a strict Austinian reading, this should be a **misfire**: the act is not achieved because the conventional procedure is flawed. The border should not have opened. Yet, it did.

  ### 2. The Crowd's Response: Uptake or Perlocution?

  Standard theory distinguishes between **illocutionary uptake** (securing attention and understanding) and **perlocutionary effect** (causing a change in the world, e.g., persuading or alarming).

  In this case, the crowd's response transcends both.
  *   It is not merely **perlocutionary** because the opening of the wall is not just a causal consequence of people hearing news (like running to a sale). It is the creation of an institutional fact.
  *   It functions as **constitutive uptake**. The crowd (and subsequently the guards) does not just understand the words; they treat the words as *binding*.

  By acting as though the border is open, the crowd supplies the missing convention. Usually, uptake confirms the illocution has been heard. Here, uptake *validates* the illocution's authority. The audience effectively says, 'We accept this declaration as valid,' thereby filling the vacuum left by the missing Politburo decree. The uptake does not complete the communication; it completes the *institution*.

  ### 3. Reversing Searle: Collective Acceptance and Validity

  You are correct that this inverts the standard Searlean direction. For Searle, institutional facts rely on collective intentionality, but typically within a pre-existing framework of constitutive rules (X counts as Y in context C). The status function usually precedes the specific declaration.

  Here, the sequence is inverted:
  1.  **Defective Declaration:** Schabowski speaks without full status function support.
  2.  **Collective Acceptance:** The crowd/guards accept the utterance as valid.
  3.  **Retroactive Authority:** This acceptance creates the institutional reality (open border), which then retroactively confers the necessary authority upon Schabowski's utterance.

  It is a process of **bootstrapping**. The validity of the speech act is not a pre-condition secured by the institution; it is a post-hoc stabilisation secured by the audience. The collective acceptance does not merely recognise the status function; it *generates* it in real-time. This suggests that in moments of crisis, the 'Background' (Searle's pre-intentional skills and practices) is not stable enough to guarantee the act; the act must stabilise the Background.

  ### 4. Austin's Misfire/Abuse and Distributed Authority

  Austin's distinction between **misfire** (act not achieved) and **abuse** (act achieved but improper) struggles here.
  *   If it is a **misfire**, the wall should remain closed. It opened.
  *   If it is an **abuse**, the act was valid but Schabowski was insincere or improper. This fits better, but implies the authority was already there, merely misused.

  The case suggests Austin's framework assumes a static convention. In political crises, conventions are fluid. The Schabowski episode reveals that institutional authority is not a property possessed by the speaker, but a **distributed property** negotiated between speaker, audience, and enforcers.

  The 'misfire' becomes the source of success because the failure of the top-down authority forces the bottom-up authority (the crowd) to intervene. Austin's framework cannot easily accommodate a scenario where the failure of procedure *is* the procedure for change. It implies that 'felicity' is not a binary switch flipped before the utterance, but a gradient settled after it.

  ### 5. General Implications for Performative Utterances

  Is this an anomaly? If your thesis holds, it should argue this is **revealing of hidden structure**.

  *   **Fragility of Authority:** Ordinary performatives (a judge sentencing, a priest marrying) appear stable only because the uptake is guaranteed by habit. Schabowski shows that the guarantee is always contingent on the audience's willingness to uphold the convention.
  *   **The Risk of Iterability:** Derrida noted that for a sign to function, it must be repeatable outside its original context. Schabowski shows that this 'breakability' is not just a risk of failure, but a condition of possibility for innovation. The utterance worked *because* it broke the rules, forcing a re-constitution of the rules.
  *   **Political Ontology:** This suggests that political sovereignty is fundamentally performative and precarious. The state exists only insofar as its declarations are taken up as valid. When the official machinery stalls, the 'people' (the audience) can seize the performative power to define reality.

  **Where the theory breaks:**
  Both Austin and Searle presuppose a degree of conventional stability that allows us to identify the 'procedure' beforehand. Your case study shows that in high-stakes political contexts, the procedure is often determined *by* the success of the act. The theory breaks at the point where it assumes authority is a pre-existing stock rather than a flow generated by uptake.

  **Summary for your thesis:**
  The Schabowski case demonstrates that uptake is not merely receptive but constitutive. It argues for a model of 'retroactive felicity', where the success of the performative validates the conditions of its own possibility, rather than vice versa. This shifts the locus of political power from the institution to the moment of communicative interaction.
