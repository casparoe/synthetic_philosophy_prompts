  "What the result actually says"
  The No-Trade Theorem states that if investors are perfectly rational and start with the same basic understanding of the world, they cannot agree to a speculative trade based purely on private information. If I try to sell you a stock, that offer signals I think the price is too high. Since you know I am rational, you update your belief to agree with me. Consequently, the price adjusts until neither of us sees a profit opportunity. The theorem relies on strict assumptions: both parties must be rational Bayesian updaters, they must share "common priors" (initial beliefs), and they must know that the other person is also rational. It does not forbid all trading, only betting against each other based on conflicting information assessments. Essentially, it proves that rational agents cannot "agree to disagree" about an asset's value once they know the other wants to trade. This means private information cannot remain private if a trade is proposed.

  "Line by line"
  This analysis requires careful reading. The blog mixes the No-Trade Theorem with the Efficient Market Hypothesis. When it claims "rational people should never trade," it is too broad. Pros tolerate this as shorthand for "never engage in speculative bets based on information differences." It is wrong literally, as you noted, ignoring liquidity trading. People trade to consume, not just win bets. The offer signaling value explanation is accurate. This is the core mechanism: trade offers reveal private information. If I sell, I signal bad news. You update beliefs downward. The price drops until incentives vanish. However, the leap to "prices soak up all information" is where the blog gets wobbly. Your confusion here is valid. The blog implies trade makes prices efficient, but the theorem actually says efficiency prevents trade. Prices are correct because traders correct them instantly, leaving no room for transaction. It doesn't prove prices are perfect; it proves rational traders won't move them further if they start from common priors. The conclusion that trading implies irrationality is partially right for *speculative* volume. High turnover often suggests overconfidence. But the blog fails to distinguish this from cash needs or rebalancing. It treats all volume as speculation, which is a major error. Finally, the advice to "stick it in an index fund" follows from market efficiency, not directly from the No-Trade Theorem. The blog uses the theorem to bolster the efficiency argument, but conflates "no speculative trade" with "no profitable active management." While related, the theorem is about why trade doesn't happen, while efficiency is about why you can't beat the market. The blog is directionally correct on the advice, but the logical bridge is shaky. It assumes that because trade shouldn't happen, anyone trading is losing money. In reality, liquidity traders aren't losing money on information; they are paying for liquidity. The blog misses this nuance entirely. The theorem assumes 'common priors,' meaning everyone starts with the same worldview. In reality, investors have different models. This violation allows trade among rational people. The blog ignores this. Also, speculative trading is zero-sum. The blog identifies that both cannot be right, but fails to mention that without new information, the trade is a wager. This matters because it separates investing from gambling. The blog lumps them together. By ignoring assumptions and the zero-sum nature, the post oversimplifies a complex result into a catchy rule. It is useful intuition, but technically imprecise.

  "Why real people do trade anyway"
  Real markets are full of traders who aren't betting on who knows better. Often, one party needs cash for consumption, like buying a house, and must sell assets regardless of value. Others trade to hedge risks; a farmer sells futures to lock in prices, not because they know the future price, but to remove uncertainty. Investors also have different risk tolerances or time horizons; a pension fund buys long-term bonds while a bank sells them to manage short-term liabilities. Finally, people simply have different preferences for holding certain assets. These motives allow trade to occur even when both parties agree on the asset's expected value, bypassing the No-Trade Theorem entirely.

  "Verdict"
  Your instincts are sharp. The blog is half-right. On your first point, the logic is circular: prices are informative because rational traders would correct them instantly, leaving no room for trade. The blog glosses over this mechanism. On your second point, you are correct; the theorem only bans speculative betting, not liquidity or hedging trades. The blog ignores this distinction. However, the final advice survives. Even if trade happens for liquidity, the speculative edge remains zero for rational actors. So, while the explanation is imprecise, the conclusion that active stock picking is difficult and index funds are sensible remains sound financial advice.
