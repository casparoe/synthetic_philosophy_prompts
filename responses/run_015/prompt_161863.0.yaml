answer: |-
  ### Problem Set 7: The Status of Sunk Costs

  **Question 4 (20 marks)**

  Consider an agent, $A$, engaged in a private, solitary project (e.g., proving a mathematical conjecture or digging a tunnel on uninhabited land). $A$ has already expended resource $C$. $A$ now faces a binary choice: abandon the project or invest additional resource $F$ to complete it.

  Stipulate the following constraints as **common knowledge** for $A$:
  1.  **Negative Continuation Value:** The expected utility of completion, minus the cost $F$, is strictly less than the utility of abandonment. $E[U(\text{Complete}) - F] < E[U(\text{Abandon})]$.
  2.  **Informational Sterility:** The expenditure $C$ provides no new data about the world, the project's feasibility, or $A$'s own competence. $C$ is causally isolated from future outcomes.
  3.  **Observational Isolation:** No other agents exist who might observe $A$'s choice. Signaling, reputation, and deterrence are impossible.
  4.  **Intrapersonal Causal Isolation:** $A$'s future selves will not update their behavior based on this precedent. No Ulysses contract or commitment device is possible.

  Under standard Expected Utility Theory (EUT), continuing is forbidden. However, given the stipulations above, the standard instrumental defenses of sunk cost sensitivity (signaling, learning, commitment) are unavailable.

  **Task:**
  (a) Categorize the principle "ignore sunk costs." Is it a logical theorem derived from the axioms of rationality, a substantive empirical claim about human psychology, or a normative heuristic contingent on specific preference structures?
  (b) Describe the specific structural features of an agent's utility function or decision procedure that would make honoring sunk costs *permissible* (i.e., not a violation of rationality) even given constraints 1–4.

  ***

  ### Model Answer

  Under the stipulated constraints, the prohibition against honoring sunk costs is not a freestanding moral commandment but a derived implication of **dynamic consistency** and **separability** within Expected Utility Theory. To answer (a), the principle is a theorem conditional on the assumption that utility is separable across time and history. It is not an empirical claim about human psychology; humans demonstrably feel sunk cost pressure. Nor is it a universal normative heuristic; it applies only to agents whose preferences satisfy the independence of irrelevant alternatives regarding past states.

  Standard EUT assumes that an agent's utility function $U$ maps world-states to real numbers based solely on the future trajectory of those states from the decision node forward. This is the **Markov property** of rational choice: the past matters only insofar as it causally influences the future. Since the prompt stipulates that $C$ (the sunk cost) has no causal influence on future outcomes (Informational Sterility) and no observational consequences (Observational Isolation), $C$ drops out of the expected utility calculation for the future branch. If an agent maximizes $\sum p_i U(outcome_i)$, and $C$ is not in $outcome_i$, then $C$ is irrelevant. Therefore, for a standard EUT agent, honoring sunk costs is a mathematical error, akin to adding a constant to both sides of an inequality and claiming the inequality flips.

  However, this derivation relies on a specific structural assumption: **history-independence**. This addresses (b). For honoring sunk costs to be permissible, the agent must possess a **history-dependent utility function**. In this framework, the utility of a future state is not intrinsic to that state but is a function of the path taken to reach it. Specifically, the agent must terminalize "waste avoidance" or "narrative consistency."

  If $A$'s utility function includes a term for *regret* or *resource integrity* that is triggered by the act of abandonment itself, then the calculation changes. Let $U_{total} = U_{outcome} + U_{history}$. If $U_{history}$ assigns a heavy negative penalty to the state "resources $C$ wasted," then abandoning the project incurs a utility cost distinct from the loss of $C$ itself. The pain of acknowledging waste is a *future* psychological cost experienced at the moment of abandonment. If this anticipated psychological cost exceeds $F$ (the cost of completion), then continuing is rational.

  Crucially, this is not "fallacious" sunk cost reasoning; it is rational maximization of a non-standard utility function. The fallacy arises when an agent *believes* they are maximizing standard outcomes (e.g., tunnel length) but is actually driven by hidden history-dependent terms (e.g., shame). Under the prompt's strict isolation, the only permissible version of sunk cost sensitivity is one where the agent explicitly values the *relationship* to their past expenditures as a terminal good.

  Furthermore, we must distinguish between the **object-level decision** and the **decision procedure**. An agent might employ a heuristic "never abandon projects" because calculating the precise continuation value is computationally expensive or prone to bias (e.g., optimism bias). Even if the specific instance has negative value, the *policy* might have positive expected value over a lifetime of decisions where information is usually imperfect. However, the prompt stipulates $A$ knows with *certainty* that continuation value is negative. This blocks the "computational heuristic" defense. Therefore, the only remaining permissibility condition is the structural one: the agent must fundamentally care about the past for its own sake.

  In conclusion, the sunk cost principle is a theorem of separability. It holds only for agents who view the past as causally dead. For agents who view the past as constitutively relevant to their present identity or utility—agents for whom "waste" is a sensory experience rather than an economic category—honoring sunk costs is permissible. Rationality does not dictate *what* one must value (e.g., future welfare vs. narrative integrity); it dictates only that one maximizes what one values consistently. If one values not-wasting, then wasting to save resources is irrational.

  ***

  ### Marking Scheme (20 Marks)

  **1. Identification of Logical Status (4 marks)**
  *   **Required:** Student identifies the principle as a *theorem* derived from EUT axioms (specifically separability/dynamic consistency), not an empirical claim or universal moral rule.
  *   *Common Error:* Treating "irrational" as a synonym for "suboptimal outcome" rather than "axiom violation."

  **2. Analysis of Separability/Markov Assumption (4 marks)**
  *   **Required:** Explicitly states that standard rationality assumes utility depends only on future consequences (history-independence), rendering $C$ mathematically irrelevant.
  *   *Common Error:* Silently reintroducing an information channel (e.g., "maybe $C$ tells us something about difficulty").

  **3. Specification of History-Dependent Utility (4 marks)**
  *   **Required:** Describes a utility function where the *path* matters (e.g., $U$ includes terms for regret, waste-aversion, or narrative consistency).
  *   *Common Error:* Claiming the agent is "mistaken" about the value rather than having different terminal values.

  **4. Distinction Between Instrumental and Terminal Value (4 marks)**
  *   **Required:** Clarifies that sunk cost sensitivity is only permissible if "avoiding waste" is a *terminal* value, not an instrumental strategy for future gain (which is blocked by stipulations).
  *   *Common Error:* Arguing it is permissible as a commitment device (explicitly blocked by stipulation 4).

  **5. Procedure vs. Outcome Distinction (4 marks)**
  *   **Required:** Acknowledges that while a heuristic might generally work, the "certainty" stipulation blocks the "computational cost" defense, forcing the preference-structure argument.
  *   *Common Error:* Ignoring the "certainty" constraint and arguing that calculation is too hard.
