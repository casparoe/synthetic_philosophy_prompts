answer: |-
  This is a fantastic puzzle. You have hit on one of the most fertile tensions in the philosophy of social science: the relationship between Hume's genetic, psychological account of social norms and Lewis's structural, game-theoretic account.

  You are reading Hume correctly. In that passage from the *Treatise* (Book 3, Part 2, Section 2), Hume is explicitly fighting against the Social Contract theorists (like Hobbes and Locke). They argued that justice arises from a **promise** (an explicit act of will). Hume argues it arises from a **convention** (in his 18th-century sense), which is a "sense of common interest" that develops gradually without a formal agreement.

  Here is how we can untangle the relationship between Hume's "gradual artifice" and Lewis's "arbitrary regularity," using your seal trapper example.

  ### 1. Lewis on Origins: You Don't Need Foresight
  Your first worry is: *How would Lewis explain the norm getting started if, as Hume insists, nobody could have foreseen the whole setup in advance?*

  Actually, Lewis does not require agents to foresee the entire system. Lewis's definition of convention is often read synchronically (how it works *now*), but his account of *origin* relies heavily on **precedent** and **salience**.

  In *Convention*, Lewis argues that a convention can emerge from a one-off coordination solution that becomes a precedent.
  *   **The Seal Trapper Scenario:** Imagine the first day on the ice. Trapper A sings a shanty. Trapper B, confused but wanting to avoid a fight, lets A take the blubber. It works.
  *   **Lewis's Explanation:** This creates a **precedent**. On day two, Trapper C sees this. C reasons: "If I sing, they will let me take it, because that's what happened yesterday."
  *   **No Grand Design:** Lewis does not require the trappers to sit down and design the "Singing Property System." They only need to recognize a **salient** focal point (Schelling's term, which Lewis uses). The shanty is salient because it is audible and distinct.

  So, Lewis aligns with Hume here: You do not need a "state of nature" reasoning session where everyone deduces the whole system of justice. You just need a series of repeated coordination problems where a solution is found by accident or salience, and then rational agents lock onto it via expectations.

  ### 2. Is a Gradual Norm "Arbitrary"?
  Your second worry is the trickiest: *Can a norm that emerges by tiny steps be really called arbitrary in Lewis's sense?*

  This is where many philosophers get stuck. Lewis defines a convention as **arbitrary** because there is at least one *other* regularity that could have solved the coordination problem (e.g., "drive on the left" vs. "drive on the right").

  If a norm evolves gradually over centuries (as Hume suggests property rights did), does it lose its arbitrariness? Does it become "natural" or "necessary"?

  **The Answer:** No, it remains arbitrary in the Lewisian sense, provided an alternative equilibrium was *possible*.
  *   **Hume's View:** Hume argues that the *general* concept of property is necessary for society (otherwise we starve), but the *specific* rules (occupation, prescription, accession) are arbitrary. Nature doesn't tell us that "singing first" equals "ownership."
  *   **Lewis's View:** Even if the "Singing Norm" evolved over 50 years of tiny adjustments, it is still arbitrary if, at the point of crystallization, the trappers *could* have stabilized around "Equal Splitting" instead.

  The "gradualism" describes the *historical process*, while "arbitrariness" describes the *logical structure* of the equilibrium. Hume's "insensible steps" lead to a stable equilibrium. Lewis asks: "Is there another stable equilibrium?" If yes (e.g., equal splitting), then Hume's resulting norm is a Lewisian convention.

  **Where you might be going in circles:** You might be thinking that if something evolves slowly, it becomes "necessary." But for Lewis (and Hume), the fact that it took a long time to get there doesn't mean it was the *only* destination. It just means it was the one the path-dependence locked onto.

  ### 3. The Real Friction: Habit vs. Common Knowledge
  This is where the two philosophers actually diverge, and it's likely the source of your confusion.

  **Lewis requires Common Knowledge.**
  For Lewis, a convention exists only if:
  1.  Everyone conforms.
  2.  Everyone expects everyone else to conform.
  3.  Everyone prefers to conform *if* others do.
  4.  **Everyone knows (1-3), and everyone knows that everyone knows...** (Common Knowledge).

  **Hume relies on Habit and Sentiment.**
  Hume's agents are not Bayesian rationalists calculating expectations. They are driven by **habit** and **passion**.
  *   Hume says we follow rules of justice partly because it's useful, but eventually, we follow them out of **habit** and because we feel a **moral sentiment** (approval) toward them.
  *   Hume's "artifice" becomes "second nature."

  **The Conflict:**
  In your seal trapper example, a Lewisian convention requires the trappers to *know* that the others are following the rule because of the mutual expectation.
  A Humean agent might follow the rule simply because "that's how it's done," without explicitly representing the conditional preference structure in their mind.

  **Does Lewis capture Hume?**
  *   **Yes:** Lewis captures the *logic* of why the norm persists (coordination equilibrium).
  *   **No:** Lewis's requirement for "Common Knowledge" is arguably too intellectualized for Hume's "gradual, insensible" process. Hume allows for norms to stick via blind habit even if the "common knowledge" condition isn't fully met.

  Modern evolutionary game theorists (like Brian Skyrms) have tried to bridge this. They show how conventions can evolve via replication and success without agents needing high-level "common knowledge." This is much closer to Hume's psychological gradualism than Lewis's original rationalist formulation.

  ### 4. Synthesizing the Passage
  Let's look back at the Hume quote you provided:
  > *"concerning the manner, in which the rules of justice are establish'd by the artifice of men... These questions will appear afterwards to be distinct."*

  Hume is separating the **Origin** (Artifice/Convention) from the **Morality** (Why we approve of it).

  *   **Lewis explains the Origin:** He gives you the mechanics of the "artifice." He explains how the "Singing Norm" stabilizes without a contract. He validates Hume's claim that no explicit promise is needed.
  *   **Hume adds the Psychology:** Lewis doesn't fully explain why we feel *moral outrage* if a trapper breaks the singing rule. Lewis explains why it's *inconvenient* to break the rule. Hume goes further to explain why we eventually view it as *virtuous* to keep it and *vicious* to break it (via sympathy and social conditioning).

  ### Summary for your understanding
  1.  **On Foresight:** Lewis agrees with Hume. You don't need to foresee the system. You just need to react to precedents (salience). The "Singing Norm" starts by accident and sticks by rational expectation.
  2.  **On Arbitrariness:** A gradually evolved norm is still "arbitrary" in Lewis's sense if a different stable norm (like equal splitting) was possible. The slowness of the evolution doesn't remove the existence of alternative equilibria.
  3.  **The Gap:** Lewis assumes rational agents with high-level knowledge (Common Knowledge). Hume assumes passionate agents driven by habit. Lewis explains the *structure* of the convention; Hume explains the *psychological glue* that makes it feel like morality.

  If you want to resolve the "circles" you're feeling: Treat Lewis as providing the **skeleton** (the logical structure of the convention) and Hume as providing the **flesh** (the historical, psychological process of how humans actually inhabit that structure). Hume's "artifice" is essentially an evolutionary convention, which Lewis formalized, though Lewis demands more rationality from the agents than Hume does.
