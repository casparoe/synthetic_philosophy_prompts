      *   *Key Quote Context:* Hume distinguishes the *origin* (how it happens) from the *morality* (why we approve of it). He argues against the Social Contract theorists (Hobbes, Locke) who say we *promised* to be just. Hume says we developed a *convention* (in a loose sense) based on shared interest.

