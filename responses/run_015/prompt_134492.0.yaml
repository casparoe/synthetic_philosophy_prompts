      *   *Recommendation:* To save the intuitions in (6) and (7), you *must* reject (1). Keeping (1) forces you to accept (5), which contradicts the strong intuitions in (6) and (7). The "Bridge" (4) is actually quite solid; if something truly doesn't affect your welfare, it's hard to see why *you* should care prudentially. The weak link is the definition of welfare/harm in (1).

