answer: |-
  You are not overthinking it. You have identified the central engine of post-Kripkean modal metaphysics, and you are right that it lacks a single, catchy fallacy name like *ad hominem* or *straw man*.

  In the literature, this dynamic is usually discussed under the header of **"The Illusion of Contingency"** (Kripke) or **"Confusing Epistemic and Metaphysical Possibility"** (Chalmers). However, those terms describe the *result* (being wrong about what is possible), not the *process* you are describing (the iterative tweaking of background conditions to preserve the intuition).

  Since there isn't a canonical label for the *move* itself, I propose we call this **"Conceivability Drift."**

  Here is a breakdown of why existing terms don't quite fit, a definition of Conceivability Drift, and how to distinguish it from the neighbors you mentioned.

  ### 1. Why existing terms don't fit
  *   **Equivocation:** Standard equivocation is static (using "bank" to mean river, then money). In your seminar, the term "ice" isn't switching between two fixed definitions. It is *morphing*. The concept is being incrementally altered to avoid collision with necessity. It is dynamic equivocation.
  *   **Motte-and-Bailey:** In a Motte-and-Bailey, the arguer retreats to a defensible position (Motte) when attacked, then claims the bold position (Bailey) when safe. In your scenario, the arguer never retreats. They insist on the bold claim ("Ice tables are possible") but secretly rebuild the Bailey into a fortress by changing the laws of physics. They aren't retreating; they are terraforming.
  *   **Ad Hoc Rescue:** This applies to empirical theories (e.g., "The planet isn't there because of invisible dust"). In metaphysics, there is no empirical data to falsify the claim, so it isn't "rescuing" a theory from evidence; it is "stabilizing" an intuition against logic.
  *   **Stubbornness:** Stubbornness is a psychological trait ("I won't change my mind"). Conceivability Drift is a structural error in reasoning ("I am changing the *object* of my mind while claiming it is the same object").

  ### 2. Defining "Conceivability Drift"
  **Conceivability Drift** occurs when an agent attempts to establish the metaphysical possibility of a proposition $P$ (e.g., "Ice behaves like wood") by conceiving a scenario $S_1$. When $S_1$ is shown to entail a contradiction or impossibility (given the essential properties of the terms), the agent silently modifies the scenario to $S_2$ (e.g., "Ice with stronger bonds") which is possible, but then asserts that they have still conceived $P$.

  **The Structure:**
  1.  **Claim:** I conceive $X$ having property $P$.
  2.  **Objection:** $X$ essentially cannot have $P$ (due to nature $N$).
  3.  **Drift:** I conceive $X^*$ (where $N$ is modified) having property $P$.
  4.  **Conclusion:** Therefore, $X$ having $P$ is possible.

  **The Error:** The conclusion does not follow because $X^*$ is not $X$. The *conception* has drifted away from the *designation*.

  ### 3. Edges and Boundaries
  To use this in your seminar, you need to distinguish Drift from legitimate clarification.

  **Legitimate Refinement vs. Conceivability Drift**
  *   **Refinement:** "When I say 'ice table,' I mean a table made of frozen H2O." (Clarifying the rigid designator).
  *   **Drift:** "When I say 'ice table,' I mean a table made of frozen H2O... unless that's impossible, in which case I mean a table made of stuff *like* H2O." (Changing the designator to save the intuition).
  *   **The Test:** Ask, "Is the tweak you just made part of the *definition* of the thing, or part of the *world* the thing is in?" If they change the definition of "ice" to save the possibility of the "ice table," that is Drift.

  **Conceivability Drift vs. Two-Dimensionalism**
  *   Philosophers like David Chalmers might argue this isn't a fallacy but a feature. They distinguish **Primary Intension** (what "ice" refers to given how the world turns out) vs. **Secondary Intension** (what "ice" refers to rigidly, i.e., H2O).
  *   If your classmate says, "I am conceiving a world where the *primary intension* of ice (cold, hard, clear stuff) behaves like wood," they are making a technical 2D argument.
  *   If they say, "I am conceiving *ice* (the actual stuff) behaving like wood," but rely on the primary intension to defend it, they are committing **Conceivability Drift**. They are sliding between intensions without declaring it.

  ### 4. How to deploy this in seminar
  You don't need to coin the term publicly to use the concept. You can interrupt the drift by forcing **Rigid Designation**.

  When they say: *"Okay, but I can conceive of ice with stronger molecular bonds..."*

  You say: *"If you change the molecular bonds, you are no longer conceiving of **ice**. You are conceiving of **schmice**. You have successfully conceived that *schmice* tables are possible, but you haven't shown that *ice* tables are possible. You are drifting the concept to avoid the necessity."*

  ### Summary
  *   **Established Term:** There isn't one specific fallacy name, but it is the mechanism behind **"Kripkean Illusions of Contingency."**
  *   **Proposed Name:** **Conceivability Drift**.
  *   **Definition:** The iterative modification of a scenario's background conditions or essential properties to preserve a conceivability intuition, while falsely maintaining that the original object is being conceived.
  *   **Key Distinction:** Unlike Equivocation (static switch) or Motte-and-Bailey (defensive retreat), Drift is a *constructive morphing* of the object to bypass modal constraints.

  You are spotting the exact friction point that launched 50 years of modal metaphysics. Trust your instinct.
