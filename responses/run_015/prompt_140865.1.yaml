prompt: |-
  I'm in a final-year seminar on blame and accountability, and this week's session was on hypocrisy. Our section leader leaned hard on an analogy I have been turning over since, and I would like it audited properly before I build a paper on it.

  The analogy is that moral blame is like a civil action. On her telling, to blame someone is to bring a claim against them: the blamer needs standing in roughly the legal sense, meaning a particularized injury traceable to the person she is addressing, and even a blamer with standing can be barred, because a court of equity refuses relief to a plaintiff who comes to it with dirty hands — you cannot invoke a norm you are yourself flouting. She uses the analogy to carry a strong conclusion, namely that a hypocrite's blame is not merely impolite or unpersuasive but infelicitous: it makes no claim on the person addressed, that person may set it aside entirely, and nothing is left over — no reason to reconsider, no reason to feel anything, no residue of accountability.

  A classmate objected that the analogy imports the very thing in dispute. Legal standing, he said, is a jurisdictional gate on a scarce public resource: it decides who may set the coercive apparatus of the state in motion, and, at least in its American form, it exists to keep courts from being used to air undifferentiated grievances. Blame is address between persons who are, on the account she is giving, one another's equals: no adjudicator, no docket, no remedy to allocate, no sovereign. So whatever work standing does in the moral case, it cannot be that. She replied that the gatekeeping rationale is inessential; what carries over is the structural point that whether a claim against you can be pressed at all can depend on facts about the claimant and not only on the content of the claim.

  I want more than a verdict on that exchange. Please lay out the full correspondence table first: what plays the role of the plaintiff, the injury in fact, the cause of action, the court, the remedy, the affirmative defense, and the requirement, in the doctrine she is borrowing, that the plaintiff's misconduct concern the same subject matter as the suit. Note in passing that the doctrine is discretionary and is weighed against other considerations, and that it is a defense to relief rather than a finding that the underlying claim is false.

  Then sort the disanalogies into the ones that actually bite on her conclusion and the ones that are decorative. Three I cannot settle myself:

  First, two people both guilty of the same kind of thing. In law the defense is available to whichever of them is the defendant, so each is barred against the other, and there is still a prosecutor or a different, clean plaintiff to vindicate the norm. Morality has no party who stands outside the practice. So if blame forfeits standing whenever the blamer is compromised, the norm loses every enforcer it has and the worst offenders end up in a zone of mutual impunity. Is that a genuine consequence of the analogy, or am I misreading it?

  Second, the confessing hypocrite: someone who did the thing, is still doing it, but has owned it publicly and is trying to stop. Equity looks backward at conduct; blame seems to respond to where the blamer now stands with respect to the norm. If acknowledgment cures in one case and not the other, then the two are tracking different kinds of condition, a historical bar versus a present relational one.

  Third, whether the analogy quietly settles a question it was brought in to help answer: the same-subject-matter restriction would make forfeiture norm-specific, but the intuitive case for taking hypocrisy seriously is often norm-general.

  Finally: does the strong conclusion survive, and if the litigation model is the wrong one, what would be a better analogy — appealing to the rules of a practice one is currently playing, a demand among equals, a request within an ongoing relationship? Please argue from the structure of the cases rather than from what is supposed to have been said in the literature.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Final-year seminar on blame and accountability. Topic: Hypocrisy.
      *   **Core Analogy:** Moral blame $\approx$ Civil Action (Litigation Model).
      *   **Section Leader's Claim:** Blame requires standing (particularized injury). Hypocrisy = "Dirty Hands" doctrine. Conclusion: Hypocritical blame is *infelicitous* (no claim made, no reason to respond, no residue of accountability).
      *   **Classmate's Objection:** Legal standing is about scarce public resources/coercion/jurisdiction. Moral blame is between equals without a sovereign.
      *   **Leader's Reply:** Gatekeeping rationale is inessential; structural point is what matters (claimant facts matter, not just claim content).
      *   **Task:**
          1.  Create a full correspondence table (Plaintiff, Injury, Cause of Action, Court, Remedy, Affirmative Defense, Same-Subject-Matter requirement). Note discretionary nature of the defense.
          2.  Sort disanalogies into "biting" vs. "decorative."
          3.  Address three specific puzzles (Mutual Impunity, Confessing Hypocrite, Norm-Specific vs. Norm-General).
          4.  Evaluate the strong conclusion (infelicity/no residue).
          5.  Propose a better analogy if the litigation model fails (rules of practice, demand among equals, request within relationship), arguing from structure.

  2.  **Deconstruct the Analogy (Correspondence Table):**
      *   *Plaintiff:* The Blamer.
      *   *Injury in Fact:* The moral wrong done to the blamer (or the community they represent, but the leader emphasizes "particularized injury").
      *   *Cause of Action:* Violation of a moral norm/obligation owed to the blamer.
      *   *Court:* The moral community / the space of reasons / the interlocutor's conscience (this is tricky, needs careful framing).
      *   *Remedy:* Acknowledgment, apology, repentance, moral realignment (not coercive damages).
      *   *Affirmative Defense:* The "Dirty Hands" doctrine (Unclean Hands).
      *   *Same-Subject-Matter:* The hypocrisy must relate to the *same norm* being invoked.
      *   *Nuance:* The defense is discretionary (equity) and bars *relief*, not the truth of the claim.

  3.  **Evaluate Disanalogies (Biting vs. Decorative):**
      *   *Decorative:* Coercion/State Power. Moral blame doesn't need sheriffs. Scarcity of resources. Courts have dockets; moral attention is theoretically infinite (though practically limited).
      *   *Biting:* The "Sovereign/Third-Party" issue. In law, if Plaintiff A is barred, Plaintiff B or the State can still prosecute. In morality, if everyone is a potential blamer, and all are flawed, who enforces the norm? This bites directly at the *consequence* of the analogy.
      *   *Biting:* The nature of the "Remedy." Legal relief is external/enforceable. Moral "relief" is internal/voluntary. If the claim is infelicitous, does the internal shift still happen?
      *   *Biting:* The "Court." In law, the judge is neutral. In moral blame, the "judge" is often the blamed person themselves (self-reflection) or the community. If the blamer is dirty, does the community lose jurisdiction?

  4.  **Address the Three Puzzles:**
      *   *Puzzle 1: Mutual Impunity (Two Sinners).*
          *   *Legal:* A sues B -> A barred. B sues A -> B barred. State prosecutes both. Norm survives.
          *   *Moral:* A blames B -> A barred. B blames A -> B barred. No "State."
          *   *Analysis:* If the Leader's strong conclusion holds (no claim, no residue), then yes, the norm loses enforcement. This suggests the analogy *overgenerates* impunity. It implies a structural flaw in mapping a public adjudicative system onto a decentralized moral ecology.
      *   *Puzzle 2: The Confessing Hypocrite.*
          *   *Legal:* Unclean hands looks at past/present conduct. If you're still violating the norm, hands are dirty. Admission doesn't cure it immediately.
          *   *Moral:* If I admit my fault and strive to improve, does my blame regain standing? Intuitively, yes (the "recovering hypocrite").
          *   *Analysis:* The legal doctrine is stricter/historical. Moral standing seems more relational/present-tense. This suggests the "Dirty Hands" mapping is too rigid for the moral case.
      *   *Puzzle 3: Norm-Specific vs. Norm-General.*
          *   *Legal:* Unclean hands must relate to the *same transaction* or subject matter. (You can't be barred from a contract suit because you jaywalked).
          *   *Moral:* We often think a general hypocrite (a liar blaming a cheater) lacks standing. Or conversely, a specific hypocrite (a cheater blaming a cheater) is the main target.
          *   *Analysis:* If the analogy requires same-subject-matter (transactional), it rules out general character attacks on standing. If morality allows general hypocrisy to undermine standing, the legal analogy is too narrow. If morality *requires* same-subject-matter, the analogy holds here. The prompt suggests the intuitive case is often norm-general. This bites at the *conditions* of the defense.

  5.  **Evaluate the Strong Conclusion (Infelicity/No Residue):**
      *   The Leader claims hypocritical blame is *infelicitous* (Austinian sense: misfire). It creates no obligation.
      *   *Critique:* Even if the *blamer* loses standing, the *wrong* remains. The "No Residue" claim is the weakest link. The blamed person still has a reason to reconsider the act, even if the *source* is compromised. The legal analogy bars *relief*, not the *truth of the violation*. But the Leader says "nothing is left over." This contradicts the legal doctrine itself (the claim is valid, relief is denied).
      *   *Verdict:* The strong conclusion does not survive. It conflates "standing to blame" with "truth of the accusation."

  6.  **Propose a Better Analogy:**
      *   *Litigation:* Too adversarial, too binary (win/lose), too focused on the claimant's rights.
      *   *Rules of a Practice (Game):* Better. Players enforce rules. But referees exist.
      *   *Demand Among Equals (Darwall):* Good, but needs to handle the hypocrisy element.
      *   *Proposal:* **A Call to a Shared Commitment (or "Invitation to a Practice").**
      *   *Structure:* Blame is an invitation to return to a shared normative ground.
      *   *Hypocrisy:* If I stand outside the ground I'm inviting you to, the invitation is hollow, but the *ground* remains.
      *   *Why better:* It explains why the blame feels "off" (the invitation is defective) without erasing the norm (the ground exists). It handles the "residue" problem. It handles the "confessing hypocrite" (they are trying to return to the ground).

  7.  **Drafting the Response:**
      *   *Tone:* Academic, rigorous, respectful of the seminar context.
      *   *Structure:* Follow the prompt's requirements exactly (Table -> Disanalogies -> Three Puzzles -> Conclusion/Alternative).
      *   *Refinement:* Ensure the distinction between "claim is false" and "relief denied" is clear in the table section. Ensure the "Mutual Impunity" point highlights the lack of a "State" in morality.

      *(Self-Correction during drafting)*: I need to be careful with the "Court" analogy. In the litigation model, the court is distinct. In morality, who is the court? If it's the community, does the community lose jurisdiction? If it's the blamed person's conscience, can they dismiss the case? The Leader says the *addressee* may set it aside. So the addressee acts as the judge of standing? That's a crucial structural point to highlight.

      *(Refining the "Strong Conclusion")*: The Leader says "nothing is left over." In law, if relief is denied, the defendant still *did* the thing. They just don't have to pay. In morality, if blame is set aside, does the agent still owe repair? The Leader says "no residue of accountability." This is the critical failure point of the analogy. Law bars the *remedy*, not the *duty*. Morality, on her view, bars the *duty*. That's a disanalogy that bites hard.

      *(Refining the Alternative)*: The "Demand Among Equals" (Darwallian) is the standard rival. But the prompt asks to argue from structure. A "Call to Shared Commitment" captures the relational aspect without the adjudicative baggage. It frames hypocrisy as a failure of *authority to call*, not a negation of the *call's content*.

  8.  **Final Review against constraints:**
      *   Correspondence table included? Yes.
      *   Note on discretionary nature/same-subject-matter included? Yes.
      *   Disanalogies sorted (biting vs. decorative)? Yes.
      *   Three puzzles addressed? Yes.
      *   Strong conclusion evaluated? Yes.
      *   Better analogy proposed? Yes.
      *   Argue from structure, not literature citations? Yes.

  9.  **Final Polish:** Check clarity and precision of legal terms (standing, affirmative defense, equity). Ensure the philosophical distinction (infelicity vs. falsehood) is sharp.

  *(Self-Correction on "Same-Subject-Matter"):* In US Equity, "unclean hands" generally requires the misconduct to relate to the subject matter of the litigation. I need to make sure this is explicit in the table.

  *(Self-Correction on "Mutual Impunity"):* Make sure to distinguish between *blame* (interpersonal) and *punishment* (institutional). The analogy is about blame. If blame is barred for everyone, is the norm unenforceable? Yes, in the interpersonal sphere. This highlights the "decentralized" nature of morality vs. the "centralized" nature of law.

  Okay, ready to write.
answer: |-
  Here is an audit of the litigation analogy, structured according to your requirements.

  ### I. The Correspondence Table

  To evaluate the analogy rigorously, we must map the doctrinal elements of the "Unclean Hands" defense in equity onto the moral landscape your section leader proposes.

  | Legal Element (Equity/Civil Action) | Moral Analog (Leader's Proposal) | Structural Function |
  | :--- | :--- | :--- |
  | **Plaintiff** | The Blamer | The party initiating the normative demand. |
  | **Injury in Fact** | Particularized Moral Injury | The specific wrong done to the blamer (or their immediate circle), grounding their interest. |
  | **Cause of Action** | Violation of a Moral Norm | The underlying breach of obligation owed to the blamer. |
  | **The Court** | The Addressee (or Moral Community) | The authority that adjudicates whether the claim must be answered. In the Leader's view, the addressee acts as the judge of the blamer's standing. |
  | **Remedy** | Accountability/Repair | Apology, repentance, realignment of will, or restitution. |
  | **Affirmative Defense** | The Charge of Hypocrisy | A plea that, even if the claim is valid, the Plaintiff is barred from relief. |
  | **"Unclean Hands" Doctrine** | The Hypocrite's Lack of Standing | The principle that one who violates the norm they invoke cannot demand compliance from another. |
  | **Same-Subject-Matter Requirement** | Norm-Specific Hypocrisy | The blamer's misconduct must concern the *same norm* they are invoking (e.g., a cheater cannot blame a cheater). |
  | **Discretionary Nature** | Contextual Sensitivity | The defense is not automatic; it is weighed against the severity of the wrong and the blamer's current stance. |
  | **Effect of Defense** | Infelicity (Not Falsity) | The underlying claim (that a wrong occurred) remains *true*, but the *claim to relief* (demand for accountability) is barred. |

  **Crucial Doctrinal Note:** In equity, "unclean hands" is a defense to *relief*, not a finding that the underlying claim is false. The defendant still breached the contract or committed the tort; the court simply refuses to aid the plaintiff. Your section leader's conclusion—that "nothing is left over, no residue of accountability"—deviates from this legal structure. In law, the duty remains; the enforcement mechanism is withheld. In her moral conclusion, the duty itself seems to evaporate for the addressee.

  ### II. Disanalogies: Decorative vs. Biting

  Your classmate's objection regarding the "scarce public resource" (the court's docket) is largely **decorative**. While it is true that moral attention is not docket-limited in the way federal courts are, the structural point your leader makes—that *who* speaks matters, not just *what* is said—survives the removal of scarcity. The "gatekeeping" function exists in morality too: we do not owe a full deliberative response to every noise made in our direction; we filter based on the speaker's authority.

  However, three **biting** disanalogies threaten the strong conclusion:

  1.  **The Sovereign Gap (The "Who Enforces?" Problem):** In law, if Plaintiff A is barred by unclean hands, Plaintiff B or the State may still prosecute. The norm is vindicated by the system, not the individual. In morality, there is no State. If standing is strictly personal and forfeitable by hypocrisy, and all agents are morally compromised, the norm loses its enforcement mechanism entirely.
  2.  **The Nature of the Remedy:** Legal relief is external and coercive (damages, injunctions). Moral "relief" is internal (conscience, recognition). If a court denies relief, the defendant still owes the debt, they just can't be forced to pay. If moral blame is "infelicitous," the Leader suggests the *debt* vanishes. This contradicts the legal analogy, where the debt survives the procedural bar.
  3.  **The Adjudicator:** In law, the judge is (ideally) neutral. In the Leader's model, the *addressee* (the accused) judges the blamer's standing. This creates a structural conflict of interest: the accused has a vested interest in finding the blamer's hands unclean to dismiss the claim. The legal system prevents this by separating the plaintiff from the judge; the moral analogy collapses them.

  ### III. The Three Puzzles

  **1. Mutual Impunity (The Two Sinners)**
  *The Scenario:* A and B both violate Norm N. A blames B; B blames A.
  *The Consequence:* If the analogy holds strictly, both are barred. In law, the State steps in. In morality, there is no third party.
  *Verdict:* This is a **genuine consequence** that reveals a flaw in the strong conclusion. If hypocritical blame generates *no residue of accountability*, then in a community of sinners (which is to say, any real community), norms become unenforceable. The analogy imports a "private right of action" model into a space that requires "public enforcement" to survive universal imperfection.
  *Resolution:* The analogy must be modified. Hypocrisy may bar the *blamer's specific demand*, but it cannot bar the *norm's validity*. The "residue" must be that the accused still owes repair to the *community* or the *norm itself*, even if they owe nothing to *this specific blamer*. The Leader's claim that "nothing is left over" is structurally unsustainable without a moral sovereign.

  **2. The Confessing Hypocrite**
  *The Scenario:* A violates Norm N, admits it publicly, and strives to reform. A then blames B for violating N.
  *The Conflict:* Equity looks backward (did you soil your hands?). Morality often looks forward/relational (are you now standing with us?).
  *Verdict:* This bites at the **temporal structure** of the defense. Legal "unclean hands" is often a permanent stain regarding that transaction until restitution is made. Moral standing seems more fluid. If acknowledgment cures the standing defect in morality but not in law, the analogy is tracking different conditions.
  *Analysis:* The legal doctrine is concerned with the *integrity of the court*. The moral practice is concerned with the *integrity of the relationship*. If A admits their fault, they rejoin the moral community as a "fellow struggler." Their blame is no longer hypocritical (claiming superiority) but fraternal (claiming shared commitment). The litigation model cannot easily capture this "rehabilitation of standing" without a formal expungement process.

  **3. Norm-Specific vs. Norm-General**
  *The Scenario:* A is a chronic liar. A blames B for cheating.
  *The Conflict:* Legal "unclean hands" requires the misconduct to relate to the *same subject matter* (you can't be barred from a contract suit because you jaywalked). Intuitively, however, a *general* character flaw (lying) often undermines standing to blame for *specific* other flaws (cheating).
  *Verdict:* This bites at the **scope of the defense**. If the Leader adopts the legal "same-subject-matter" restriction, she rules out the intuitive force of general character attacks on standing. If she allows general hypocrisy to bar standing, she departs from the legal doctrine she is borrowing.
  *Analysis:* If the analogy is to hold, she must argue that moral norms are more interconnected than legal causes of action (a "web" vs. a "docket"). But if she admits general hypocrisy bars standing, the "Mutual Impunity" problem worsens, as few people have clean hands across *all* norms.

  ### IV. Evaluation of the Strong Conclusion

  **Does the strong conclusion survive?**
  **No.** The conclusion that hypocritical blame is *infelicitous* (makes no claim) and leaves *no residue* is too strong for the analogy to bear.

  1.  **Infelicity vs. Defeasibility:** In law, a claim barred by unclean hands is not a "misfire"; it is a valid claim that is *defeated*. The defendant still committed the wrong. The Leader's view that the addressee may "set it aside entirely" as if no claim was made conflates *standing to press* with *existence of the debt*.
  2.  **The Residue:** Even if A has no standing to blame B, B still has a reason to reconsider their action. That reason comes from the *norm*, not the *blamer*. By erasing the residue, the Leader makes the norm's existence dependent on the blamer's purity. This inverts the moral ontology: norms should govern agents, not depend on them.

  **A Better Analogy: The Invitation to a Shared Practice**

  If the litigation model fails because it is too adversarial and binary (win/lose, barred/allowed), a better structural analogy is **an Invitation to a Shared Practice** (or a Call to Common Ground).

  *   **Structure:** Blame is not a claim filed against a defendant; it is an invitation issued by one participant to another to return to the rules of a practice they both ostensibly value.
  *   **The Role of the Blamer:** Not a Plaintiff, but a **Fellow Participant**. Their authority derives not from innocence, but from their current commitment to the practice.
  *   **The Role of Hypocrisy:** Hypocrisy is not "Unclean Hands" (a bar to relief); it is **Insincerity of Invitation**. If I invite you to a game I am actively cheating in, the invitation is defective. You are right to reject *my invitation*.
  *   **The Residue:** Crucially, rejecting the *invitation* does not negate the *rules of the game*. You still owe it to the practice (and the other players) to follow the rules, even if you ignore my specific call.
  *   **Why this solves the puzzles:**
      1.  **Mutual Impunity:** If we are both cheating, our invitations to each other are hollow. But the *rules* still stand. We are both still accountable to the practice, even if we lack the authority to call each other out. The "enforcer" is the integrity of the practice itself, not the individual blamer.
      2.  **Confessing Hypocrite:** If I admit I was cheating and pledge to play by the rules, my invitation regains sincerity. I am recommitting to the practice. This explains why acknowledgment cures the defect (it restores the sincerity of the invitation) without requiring "legal" expungement.
      3.  **Norm-General vs. Specific:** General hypocrisy undermines the *sincerity* of the invitation more broadly. If I am known to disregard the practice generally, my specific invitation is suspect. This allows for a gradient of standing (credibility) rather than a binary bar (jurisdiction).

  **Conclusion for your paper:**
  The litigation analogy is useful for isolating the *relational* defect in hypocritical blame (the blamer lacks a certain authority). However, it fails as a total model because it imports an adjudicative structure that erases the norm when the plaintiff is barred. You should argue that while hypocrisy defeats the *blamer's authority*, it does not defeat the *norm's claim*. The "Unclean Hands" doctrine should be mapped not to the validity of the blame, but to the *obligation to respond to that specific blamer*. The residue of accountability remains, owed to the moral community or the norm itself, preserving the objectivity of the wrong even when the subjectivity of the blamer is compromised.
