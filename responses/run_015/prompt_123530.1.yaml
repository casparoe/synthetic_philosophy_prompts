answer: |-
  This is a fantastic set of intuitions. You have correctly identified that "conventional obligation" isn't a monolith; it shifts based on context, identity, and the function of the norm.

  Your "draw-down" hypothesis is a strong start (it captures the Frequent Flyer vs. Tourist distinction), but as you noted, it fails on the asymmetry of norm exportation (tipping abroad) and the "empty street" exception.

  Here is a proposal for a unifying principle, followed by how it handles your hard cases.

  ### The Principle: Coordinative Integrity

  **You are obliged to conform to a local convention when your non-conformity would either (a) free-ride on the cooperative reliance of others within that scheme, or (b) disrupt the local coordinative equilibrium to the detriment of the participants.**

  This principle rests on the view that conventions are **solutions to coordination problems**. They exist to create predictability, fairness, or safety. Your obligation depends on your status as a *participant* in that coordination game and the *consequences* of your deviation.

  Here is how this principle validates (or forces you to adjust) your verdicts:

  #### 1. The Tourist vs. The Local (The Participation Threshold)
  *   **Verdicts:** Tourist no-tip/scrums = Fine. Local queue-jump = Not Fine. Frequent Flyer = Not Fine.
  *   **Analysis:** Conventions rely on **reasonable expectations**. A tourist is a "non-player character" in the local coordination game. Locals do not fully rely on tourists to uphold the long-term equilibrium (e.g., waiters expect tourists to be ignorant; bus locals expect tourists to be confused).
  *   **The Shift:** The Frequent Flyer crosses a threshold. By visiting monthly for years, they move from "passerby" to "functional participant." They derive the benefit of the order (the queue) without paying the cost (waiting). This violates clause (a): **Free-riding.**
  *   **Teaching Point:** Obligation isn't binary (Citizen vs. Foreigner); it's a slider based on **integration and reliance**.

  #### 2. The Empty Street (The Harm/Reliance Condition)
  *   **Verdict:** Jaywalking on empty street = Fine.
  *   **Analysis:** Why is queue-jumping bad but empty-street jaywalking fine? Both break a rule.
  *   **The Principle:** The queue is a **fairness convention**. Violating it steals time from others who are relying on the order. The traffic light is a **safety convention**. On an empty street, the safety reliance is null. No one is coordinating with you; therefore, no coordination is disrupted.
  *   **Teaching Point:** Conventions bind us only insofar as they are serving their coordinative function. When the function is dormant (no cars), the obligation dissolves.

  #### 3. The Tipping Imperialist (The Equilibrium Condition)
  *   **Verdict:** American tipping in no-tip country = Obnoxious.
  *   **Analysis:** Your "draw-down" theory struggles here because the tipper is arguably *adding* to the pot. But under **Coordinative Integrity**, this violates clause (b): **Disrupting the Equilibrium.**
  *   Local no-tipping conventions are usually tied to wage structures and dignity. Importing a tipping norm signals that the worker is dependent on charity, undermines local wage negotiations, and creates price opacity. It is **Normative Imperialism**. You are imposing your home coordination game onto a system that has solved the problem differently.
  *   **Teaching Point:** Conventions are ecosystemic. You cannot import a norm without checking if it poisons the local water.

  #### 4. The Delivery App (The Manipulation of Consent)
  *   **Verdict:** Uncertain/Feeling more obliged.
  *   **Analysis:** The app is not just reflecting a convention; it is **gamifying the entry cost**. A tip jar requires an active *decision to give*. A default 20% requires an active *decision to withhold*.
  *   **The Principle:** This exploits the **status quo bias**. It makes the tip look like a price (part of the contract) rather than a gratuity (a post-hoc convention).
  *   **Verdict:** You are *less* obliged here than with a human server. The app is a "dark pattern" attempting to simulate social pressure where there is no human recipient to feel the relief. It is a corporate attempt to rewrite the convention without social consensus.
  *   **Teaching Point:** Distinguish between *social* conventions (peer-to-peer) and *manufactured* conventions (platform-to-user).

  ### Addressing Your Hard Cases

  #### The 10-Year Expat Who Won't Tip
  Under **Coordinative Integrity**, the expat is **wrong**.
  After 10 years, they are no longer a visitor. They are embedded in the system. They benefit from the service economy that relies on tips to subsidize wages. To refuse is to free-ride (clause a).
  *   **Nuance:** Unless they are actively campaigning to change the law. If they are a "principled dissenter" working to dismantle the system, their non-conformity is political speech, not free-riding. If they are just stingy, they are violating the principle.

  #### The Resented Convention (e.g., Tipping in the US)
  This is the most critical philosophical pivot for your unit.
  **Principle Adjustment:** **The Corrupt Convention Exception.**
  If a convention is widely recognized by the *locals* as unjust, exploitative, or something they wish to dismantle, conformity is **not obligatory** and may be morally suspect.
  *   **Why?** Because conventions derive authority from social agreement. If the agreement is fracturing (e.g., "tipping is actually wage theft"), then propping it up supports an unjust equilibrium.
  *   **Verdict:** If the locals want to end tipping, tipping is not "respecting them"; it is **propping up the oppression they want to end**. In this case, the American tipping abroad (Verdict 3) is doubly wrong: it imports a norm *and* supports a system the locals reject.
  *   **Teaching Point:** Conventions are not morally neutral. We must ask: *Is this convention facilitating cooperation, or is it masking exploitation?*

  ### Summary for the Syllabus

  If you need a single sentence to put on the board:

  > **"Conventional obligation arises from participation: we owe conformity when our deviation would free-ride on the reliance of others or disrupt a local cooperative equilibrium."**

  **Which verdicts does this force you to drop?**
  None, actually. Your gut instincts are remarkably consistent with a sophisticated coordination-based ethics. The only adjustment is the **10-Year Expat**: they must be classified as a "Local" for the purpose of the norm, not a "Visitor."

  **The Asymmetry Explained:**
  *   **Exiting a convention (Tourist not tipping):** Permissible because you are not a relied-upon participant.
  *   **Importing a convention (American tipping abroad):** Impermissible because you are an active agent disrupting a stable equilibrium that doesn't want your input.

  This framework gives you a robust way to discuss the difference between *manners* (arbitrary), *conventions* (cooperative), and *laws* (coercive), and where the moral weight actually sits.
