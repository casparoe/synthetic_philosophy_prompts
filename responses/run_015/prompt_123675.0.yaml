answer: |-
  **Brainstorm**

  Candidate requirements: Grounding (no emergence), Subject Constitution (no ex nihilo), Qualitative Palette (richness), Structural Isomorphism (physical match), State Dependence (sleep/anaesthesia), Mereological Vagueness (split-brain), Epistemic Opacity (introspective silence), Non-Arbitrariness (plenitude), Causal Efficacy (mental causes), Diachronic Continuity (persistence), Simplicity (Ockham), Naturalism (science fit).

  Discarded: 'Causal Efficacy' is redundant; if Russellian monism holds, micro-phenomenal properties ground dispositions, so macro-efficacy follows if structural fit holds. 'Simplicity' is methodological, not a truth-condition for the phenomenon itself. 'Naturalism' is too vague; 'Structural Isomorphism' does the heavy lifting here. 'Diachronic Continuity' is distinct from synchronic combination; I will address it separately rather than as a numbered constraint on combination itself, to avoid conflating time with mereology.

  Merged: 'Structural Fit' and 'Composition-Tracking' are two sides of the same coin: the mental structure must map the physical structure. I will combine these into 'Structural Correspondence'. 'Dormancy' and 'Partial Unity' both concern the modulation of consciousness; I will keep them distinct because dormancy concerns existence while unity concerns number, but I will group them under phenomenological adequacy.

  Refined List: I will retain the core of your draft but sharpen the definitions to prevent loopholes.

  ***

  **Adequacy Conditions for Micropsychist Combination**

  To preserve micropsychism as a genuine rival to physicalism and emergentism, rather than a disguised version of either, any solution must satisfy the following conditions. I have marked those essential to the core motivation as **Non-Negotiable**; others are theoretical preferences that may be sacrificed if necessary.

  1.  **The Grounding Constraint (Non-Negotiable).** Macro-phenomenal facts must be wholly grounded in micro-phenomenal facts plus their relations. If the existence of a macro-subject is not necessitated by the micro-base, you have brute emergence. This rules out solutions that simply posit macro-subjects when integration reaches a threshold unless that thresholding is itself grounded in the micro-nature.
  2.  **The Subject Constitution Constraint (Non-Negotiable).** The theory must specify the principle of subject composition. It cannot allow new subjects to pop into existence *ex nihilo* when micro-subjects arrange themselves thusly. The macro-subject must be constituted by the micro-subjects, not merely caused by them.
  3.  **The Qualitative Derivation Constraint (Non-Negotiable).** The micro-phenomenal palette must be capable of yielding the macro-phenomenal palette. If micro-experience is merely 'protomenal' or structurally defined without qualitative content, you cannot derive the specific redness of red. This rules out pure structural panpsychism.
  4.  **The Structural Correspondence Constraint (Non-Negotiable).** The combining relation must track physical composition and causal integration. If the physical system is integrated, the mental system must be unified; if the physical system splits (callosal section), the mental system must divide. This preserves the Russellian motivation that the mental grounds the physical dispositions.
  5.  **The Phenomenal Modulation Constraint (Non-Negotiable).** The theory must account for graded consciousness and dormancy. During dreamless sleep, micro-subjects persist (on pain of ontological extravagance), yet the macro-subject vanishes. The combining relation must be defeasible without the relata ceasing to exist.
  6.  **The Epistemic Opacity Constraint (Preference).** The theory should explain why the macro-subject lacks introspective access to its micro-constituents. While strongly intuitive, one might argue this is a contingent feature of human cognition rather than a metaphysical necessity. However, failing this makes the view empirically vulnerable.
  7.  **The Non-Arbitrariness Constraint (Preference).** The combining principle must not be gerrymandered solely to human brains. It must yield determinate verdicts for galaxies, stones, and thermostats. If one accepts panpsychism, one must accept its ontological costs elsewhere.

  **Incompatibilities and Exclusionary Power**

  There is significant tension between **The Grounding Constraint** and **The Phenomenal Modulation Constraint**. If micro-subjects persist during sleep, and grounding is necessitarian, why does the macro-subject cease to exist? Either the micro-subjects change intrinsically (violating the persistence intuition) or the grounding relation is contingent (risking brute emergence). This suggests the list may be jointly unsatisfiable without revising our notion of grounding or persistence.

  The single most exclusionary requirement is **The Subject Constitution Constraint**. Most proposed solutions (including many bonding relations) effectively treat the macro-subject as a new entity emergent from the old ones, rather than strictly constituted by them. This constraint knocks out any view that treats combination as causal rather than mereological.

  Regarding diachronic unity: the bonding relation is typically conceived synchronically. If it is also to do the work of diachronic unity, we are committed to a temporal-parts ontology where subjects are space-time worms bonded across time. This is a feature for perdurantists but a cost for endurantists. If bonding is only synchronic, persistence through sleep requires a separate account, likely implying the macro-subject does *not* persist through dreamless sleep, but is recreated upon waking. This is a bullet many must bite.

  ***

  **Scorecard**

  | Requirement | Primitive Bonding | Panqualityism | Cosmopsychism | Attenuation View |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Grounding** | Pass (if primitive) | Partial (qualities ground) | Pass (decombination) | **Fail** (threshold emergence) |
  | **2. Subject Constitution** | **Fail** (brute summing) | Pass (subjects constructed) | Pass (segments of One) | **Fail** (realisation not composition) |
  | **3. Qualitative Derivation** | Pass | Pass | Pass | Pass |
  | **4. Structural Correspondence** | Pass | Pass | **Fail** (priority inversion) | Pass |
  | **5. Phenomenal Modulation** | **Fail** (binary bonding) | Pass (integration varies) | Pass (attention varies) | Pass (threshold based) |
  | **6. Epistemic Opacity** | Pass | Pass | Pass | Pass |
  | **7. Non-Arbitrariness** | Pass | Pass | Pass | Pass |

  **Assessment of the Attenuation View**

  The Attenuation View is not panpsychism; it is emergentism in phenomenal dress. It posits that micro-phenomenal properties are ubiquitous, but the macro-subject is *realised by* causal integration density rather than *composed of* micro-subjects. When integration falls below threshold (sleep), the macro-subject ceases to exist despite the micro-subjects persisting. This violates **The Grounding Constraint** and **The Subject Constitution Constraint**. The existence of the macro-subject is not grounded in the existence of the micro-subjects alone, but in their relational configuration acting as a trigger for a new entity. This reintroduces the brute emergence of macro-phenomenal properties from non-phenomenal relations (since the relations themselves are not subjects), surrendering the primary advantage panpsychism claims over physicalism. The requirement that kills it is **The Subject Constitution Constraint**: if the macro-subject is not the micro-subjects collectively, but a new entity realised by their arrangement, you have relocated emergence one level down, precisely what your purpose statement forbids.
