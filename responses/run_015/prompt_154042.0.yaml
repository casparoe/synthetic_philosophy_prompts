answer: |-
  **Project Title:** Risk-Weighting the Unknowable: Domain-Gating and the Presupposition of Value Determinacy

  **1. The Research Question**
  Does the requirement to model structurally ambiguous catastrophic outcomes force Risk-Weighted Expected Utility (REU) theory to abandon its distinctiveness from Imprecise Probability models, thereby demonstrating that REU implicitly presupposes a condition of "value determinacy" incompatible with high-stakes technological risk scenarios?

  This question admits a determinate answer. Either a formal model can be constructed that incorporates a second-order domain-gating mechanism while preserving the unique representation theorem of REU (specifically, the separation of risk attitudes from probabilistic beliefs), or it can be proven that such a mechanism necessarily violates the axioms required for that representation (typically continuity or ordering), causing the framework to collapse into a standard imprecise-probability model.

  **2. Motivation and Gap in Existing Literature**
  Risk-Weighted Expected Utility theory was developed to resolve paradoxes of choice (such as the Allais paradox) that Expected Utility Theory (EUT) cannot accommodate. It achieves this by introducing a risk function that weights probabilities non-linearly, allowing for risk-averse or risk-seeking behavior without conflating these attitudes with diminishing marginal utility. The standard formulation assumes a fixed structure: a set of states, a set of outcomes, and a utility function that maps outcomes to real numbers prior to the application of risk weights.

  However, this formulation assumes the outcome space is *determinate*. In long-horizon decision problems, particularly those involving existential or technological risk, the "outcomes" are often structurally ambiguous. A catastrophic outcome may not merely be a low-utility point on a fixed scale; it may represent a shift in the value scale itself (e.g., the emergence of new moral patients, the loss of concepts required to evaluate utility, or value drift). In these cases, the agent faces uncertainty not just about which outcome will obtain, but about which *domain of evaluation* will be active.

  Existing extensions of decision theory handle uncertainty in two distinct ways that fail to capture this specific problem. Imprecise Probability (IP) models allow for sets of probability functions but generally retain a fixed utility scale. State-dependent utility models allow utility to vary across states but typically assume the mapping is known at the decision point. Neither framework adequately addresses a scenario where the *risk attitude* itself must operate over partitions of the outcome space that are epistemically gated—where the agent knows a catastrophe is possible but cannot assign it a determinate utility value until after an epistemic resolution occurs.

  Current REU literature leaves this open because it treats the utility function as a background condition for the risk function. There is no established mechanism for applying risk weights to the *structure* of the outcome space rather than the probabilities of specific outcomes within that space. Consequently, it is unknown whether REU can be generalized to handle structural ambiguity without losing the formal properties that distinguish it from IP models. If REU cannot handle this without collapsing into IP, it suggests REU is structurally limited to "small world" decisions where values are stable, limiting its applicability to the very long-term risks where risk-sensitivity is most ethically urgent.

  **3. Methodological Approach**
  The project will employ a hybrid methodology of formal modeling and conceptual analysis.

  *   **Formal Reconstruction:** I will begin by formally reconstructing the standard REU representation theorem, isolating the specific axioms (Ordering, Continuity, Independence variants) that guarantee the separation of the risk function from the utility function.
  *   **Introduction of the Domain-Gate:** I will introduce a formal operator, the "domain-gate," defined as a second-order partition over the outcome space. This gate will function as an epistemic filter: the utility of an outcome $x$ is conditional on the domain $D$ being active, where $D$ is resolved post-decision. The risk function $r$ will then be applied to the probability of the domain $D$ obtaining, rather than just the probability of $x$.
  *   **Consistency Check:** I will test this extended framework against the standard REU axioms. The core technical task is to determine if the introduction of the domain-gate violates the Continuity axiom. In standard REU, Continuity ensures that no outcome is so good or bad that it lexicographically dominates others. In a structurally ambiguous catastrophe, the "badness" may be lexicographic (incommensurable). I will analyze whether the domain-gate forces the risk function to become discontinuous or whether it forces the probability measure to become a set of measures (the hallmark of IP).
  *   **Conceptual Analysis:** Parallel to the formal work, I will analyze the philosophical implication of "value determinacy." If the formal check fails, I will argue that REU presupposes that agents can rank all possible worlds on a single scale prior to choice. I will assess whether this presupposition is a bug (a limitation of the theory) or a feature (a necessary condition for rational choice).

  **4. Anticipated Results**
  The project aims for a definitive conclusion regarding the compatibility of REU and structural ambiguity.

  *   **Positive Result:** A successful formalization of Domain-Gated REU. This would look like a modified representation theorem where the risk function operates over domain-partitions while maintaining a single precise probability measure and a stable utility ordering. This would prove REU is robust enough for existential risk analysis.
  *   **Negative Result:** A "no-go" theorem demonstrating that any domain-gating mechanism sufficient to handle structural ambiguity necessarily violates the Continuity or Ordering axioms required for REU. This would show that to model these cases, one must either accept intransitive preferences or move to a set of probability functions (collapsing into Imprecise Probability). This would confirm that REU presupposes value determinacy.
  *   **Partial Result:** A demonstration that Domain-Gated REU is possible only under restrictive conditions (e.g., the "catastrophe" must be commensurable with normal outcomes to a specific degree). This would delineate the boundary conditions of REU's applicability, showing it works for moderate risks but fails at the extreme tail.

  Given the theoretical tension between risk-weighting (which requires a fixed scale to weight) and structural ambiguity (which implies a shifting scale), a Negative or Partial Result is the more likely and philosophically fruitful outcome.

  **5. Scope and Feasibility Assessment**
  **Realistic Scope for a Semester (6,000 words):**
  A full derivation of a new representation theorem is typically dissertation-level work. For a 6,000-word term paper, the realistic goal is the **Negative Result** pathway. The paper will focus on proving the incompatibility. I will reconstruct the specific axiom in REU (likely Continuity or a specific Independence condition) that breaks when the outcome space becomes epistemically gated. I will demonstrate that repairing this break requires introducing imprecise probabilities, thereby collapsing the distinction between REU and IP. This allows for a rigorous formal argument without requiring the construction of a wholly new system from scratch. The philosophical analysis will focus on the implications of this impossibility for long-termist ethics.

  **Potential for Expansion (Grant/Long-term):**
  If the project were expanded for a grant or longer thesis, the scope would shift to the **Positive Result** pathway. This would involve:
  1.  Developing a new axiom set that relaxes Continuity just enough to permit domain-gating without losing all structure.
  2.  Exploring the relationship between Domain-Gated REU and other non-standard theories (e.g., Choquet Expected Utility).
  3.  Applying the formal model to specific case studies in AI safety or biosecurity to test its normative guidance against intuition.

  **Feasibility Risks:**
  The primary risk is that the formal proof of incompatibility becomes too technical for the word count, crowding out the philosophical discussion. To mitigate this, I will rely on established impossibility results in related fields (e.g., state-dependent utility) as analogues, focusing my original formal work only on the specific interaction between the risk function and the domain-gate. A second risk is that the definition of "structural ambiguity" remains too vague. I will mitigate this by defining it strictly as "incommensurability across epistemic partitions" for the purposes of the model, acknowledging that this is a specific subset of the broader philosophical concept.

  **6. Conclusion**
  This project addresses a critical blind spot in normative decision theory. If REU is to be the preferred framework for rational choice under risk, it must be able to handle the risks that matter most. By testing whether REU can survive the introduction of structurally ambiguous outcomes, this project will either expand the toolkit available for existential risk analysis or reveal a fundamental limitation in how contemporary decision theory conceptualizes value under uncertainty. The determinate nature of the question ensures that the project will yield a clear conclusion: either REU is more flexible than currently understood, or it is structurally bound to a determinacy assumption that limits its ethical reach.
