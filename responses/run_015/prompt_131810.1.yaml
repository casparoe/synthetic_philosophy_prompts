  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Ontological Status of the Conscious Interface
  **Parties:** Strong Interface Illusionists (SII) and Functional Realist Representationalists (FRR)
  **Date:** October 26, 2023

  ## 1. Agreed Claims

  Both camps affirm the following propositions as the common ground for this collaboration. These claims establish the shared theoretical framework within which our disagreement is situated.

  1.  **Neural Inaccessibility and Compression:** The brain lacks direct introspective access to its own neural implementation details. Conscious access to mental states is inherently selective, lossy, and compressed; it does not mirror the full complexity of underlying sub-personal processing.
  2.  **Viability of Predictive Frameworks:** Predictive-processing and hierarchical Bayesian frameworks provide viable, perhaps necessary, explanations for the majority of perception, action, and cognitive inference. We agree that the brain functions primarily to minimize prediction error rather than to veridically mirror the world.
  3.  **Legitimacy of the Interface Metaphor:** The "desktop" or "user interface" metaphor legitimately captures the functional relationship between conscious experience and underlying computation. Conscious states serve to simplify complex data for the purpose of adaptive action, hiding the "code" of neural processing from the "user."
  4.  **Rejection of the Cartesian Theater:** Both sides reject Cartesian theater models. There is no central locus of experience where a homunculus views internal representations. Consciousness is a distributed process, not a place.
  5.  **Availability of the Transparency/Opacity Distinction:** We agree that a conceptual distinction exists between **Interface Transparency Failure** (a system misrepresents its own mechanism as being something it is not, e.g., representing a neural state as having irreducible qualitative properties when it does not) and **Functional Opacity** (a system correctly represents its outputs as functional states but lacks access to the implementation details). We disagree only on which of these descriptions applies to human consciousness.

  ## 2. Statement of Disagreements

  The following table delineates the substantive disagreements remaining after the claims above are accepted. Each position is phrased in terminology the respective camp accepts as accurate to its view.

  | Feature of Disagreement | Strong Interface Illusionists (SII) | Functional Realist Representationalists (FRR) |
  | :--- | :--- | :--- |
  | **(i) Status of Phenomenal Properties** | Phenomenal properties (e.g., qualia, felt unity) are **fictive interface elements**. They are representational artifacts that do not correspond to any real feature of the experience itself. To experience them is to be under a controlled hallucination about the nature of one's own state. | Phenomenal properties are **genuinely instantiated representational contents**. While they are compressed and action-oriented, they are real functional properties of the system. The experience is not a hallucination about the state, but a valid representation of a functional reality. |
  | **(ii) Status of the "User"** | The "user" who interacts with the interface is itself a **constructed fiction**. The sense of a unified self is a narrative center of gravity generated by the interface, with no corresponding singular controller. | The "user" is a **genuinely existing controller**. While potentially distributed or fragmented, there is a real functional agency that utilizes the interface. The self is not a fiction, but a functional entity with causal power. |
  | **(iii) Ontological Implications** | Accepting the interface metaphor entails **systematic ontological error**. Our introspective conviction that we possess phenomenal properties is a mistake akin to believing a computer folder physically contains papers. | Accepting the interface metaphor entails **epistemic limitation but not ontological error**. We are ignorant of the *implementation* (the code), but not mistaken about the *existence* of the interface objects (the icons/states). |

  ## 3. The Cruxes

  We identify the following three sub-questions as the cruxes of the debate. Settling these empirical or argumentative points would force a revision of position for at least one camp. For each crux, we specify the agreed-upon evidence and register explicit predictions.

  ### Crux A: Introspective Unreliability and Fiction
  **Question:** Does widespread introspective unreliability prove that conscious representations are fictions, or merely that a real representational system is noisy and access-limited?

  *   **(a) Agreed Evidence:** Both sides accept data regarding change blindness, choice blindness, and confabulation, where subjects report stable, detailed experiences that contradict objective records of their perceptual access or decision processes.
  *   **(b) Pre-registered Predictions:**
      *   **SII Prediction:** If introspection is shown to generate detailed reports in the absence of corresponding stable internal states, this proves the reports are **post-hoc fictions**. The system is not accessing a real state; it is generating an interface element on demand. Therefore, the phenomenal property reported did not exist prior to the report.
      *   **FRR Prediction:** If introspection is shown to be unreliable, this proves the **access channel is noisy**. The underlying representational state existed, but the mechanism for reporting it is prone to error or interference. The phenomenal property existed, but the subject's description of it was corrupted by functional opacity.

  ### Crux B: Split-Brain Cases and the Unified User
  **Question:** Do split-brain cases show that the pre-operative unified "user" was always an interface-level construction, or that a real but distributed controller was physically divided?

  *   **(a) Agreed Evidence:** Both sides accept findings from commissurotomy patients where the two hemispheres demonstrate independent intentions, perceptual accesses, and motor controls, suggesting a fragmentation of the previously unified conscious field.
  *   **(b) Pre-registered Predictions:**
      *   **SII Prediction:** These cases demonstrate that the pre-operative "unified user" was an **interface-level construction** that can be forked. Since one controller cannot become two without remainder, the original unity must have been a fictional artifact of the interface, not a real singular entity.
      *   **FRR Prediction:** These cases demonstrate that a **real but distributed controller** was physically divided. The pre-operative unity was a real functional integration of subsystems. When the physical integration was severed, the real functional agent was partitioned into two agents. The unity was real, not fictive.

  ### Crux C: Predictive Processing and Phenomenal Unity
  **Question:** Can predictive-processing models account for the specificity and unity of phenomenal character without positing real phenomenal properties?

  *   **(a) Agreed Evidence:** Both sides accept that hierarchical predictive processing can model binding problems (how features are combined into objects) and the temporal integration of experience without invoking a Cartesian theater.
  *   **(b) Pre-registered Predictions:**
      *   **SII Prediction:** A complete predictive-processing model will explain the *report* of unity and specificity purely through **error-minimization dynamics**. No additional "phenomenal properties" need be posited as real. The feeling of unity is the interface's way of signaling low prediction error across modalities, not a real property of the state.
      *   **FRR Prediction:** A complete predictive-processing model will explain the *mechanism* of access, but the **unity of the experience itself** requires real instantiated properties to explain the "what it is like." The error-minimization signal is the cause, but the resulting unified state is a real functional property, not merely a signal to suppress further processing.

  ***

  **Signatures:**

  _________________________
  *Representative, Strong Interface Illusionists (SII)*

  _________________________
  *Representative, Functional Realist Representationalists (FRR)*
