  I'm writing a chapter on concept induction and keep coming back to Bongard problems — those visual puzzles where you work out a hidden rule from just a few examples on each side. Could you write a short story that captures what it feels like when induction fails not because the data is sparse, but because your feature space is just wrong? Maybe about a field linguist who spends months sorting artefacts with her informants, only to realise they've been using a relational rule tied to lunear phases — she was hunting for taxonomy the whole time. Keep it casual and grounded, like set in a damp archive or a tent during fieldwork. No need for citations or a bibliography, I'm just after the vibe of broken priors. (Apologies if that's rambling — too much coffee this morning.)
