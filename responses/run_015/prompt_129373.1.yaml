answer: |-
  Good morning everyone. Standing here feels distinctly surreal, and I say that as someone who has spent years teaching political theory about exactly this kind of experiment. I have lectured on the benefits of sortition, on the logic of random selection, and on the limits of electoral democracy, but I did so from behind a podium, safely outside the machinery. Last week, my name came out of the drum, and suddenly I am not the observer but the observed. I know I am not the only one feeling a mix of curiosity and apprehension. Looking around this room, I see neighbors who are worried that handing power to a random group of strangers is undemocratic, and I see colleagues who know the academic literature well enough to know exactly how fragile these processes can be if we misuse the language of representation. So, before we dive into the zoning maps and environmental impact studies, I think we owe it to ourselves to be precise about who we are and what authority we actually hold.

  We need to start by admitting what we are not. We are not representatives in the sense that the city council is. None of us campaigned. None of us made promises to donors or constituents. None of us stands here with a mandate to enforce a specific ideology. If we try to claim we represent the will of the people in a traditional electoral sense, we will be lying, and the skeptics in this room will be right to distrust us. But that lack of a mandate is not a bug in this system; it is the central feature. Our authority does not come from winning a contest of popularity; it comes from the legitimacy of the process that selected us and the quality of the deliberation we produce. We are not here to transmit pre-existing preferences from the electorate to the government. We are here to construct judgment through reasoning together. The town has authorized us not to vote our consciences as isolated individuals, but to forge a shared conclusion that elected officials, trapped in cycles of re-election, cannot safely make.

  This distinction is crucial for the task ahead of us regarding the waterfront. For years, the elected council has been paralyzed because every decision on zoning is treated as a signal in a culture war. If a councilor votes for development, they are accused of selling out the environment. If they vote for preservation, they are accused of stifling growth and housing. They are forced to choose sides because their political survival depends on mobilizing a base, not on solving complex trade-offs. They are accountable to the next election, which means they are accountable to the loudest voices, not necessarily the most reasoned ones. We, however, are accountable only to this process and to each other. We do not face the voters next year. We do not need to signal purity to a partisan faction. This freedom from electoral pressure is what allows us to do the hard work of integration rather than polarization.

  Because we were chosen by lot, we are a microcosm of the town, not a vanguard of its most motivated activists. This means the tension between environmental protection and economic development exists inside this room, not just between us and some external enemy. That internal tension is where the solution lives. Since we don't have to pretend that one value completely trumps the other to satisfy a campaign platform, we are free to find the messy, nuanced compromises that actually work on the ground. We can acknowledge that the waterfront needs protection without pretending that no development can ever occur, and we can acknowledge the need for housing and revenue without pretending that concrete should replace the coastline. Our lack of a electoral mandate frees us to seek a stable equilibrium rather than a temporary victory.

  So, as we begin this workshop, I ask that we leave behind the habits of electoral politics. We are not here to debate winners and losers. We are here to test arguments against evidence and against each other's lived experiences. For my fellow skeptics, I ask you to judge us not by how we were chosen, but by the rigor of the work we produce. For my fellow scholars, I ask that we hold ourselves to the highest standard of deliberative integrity, avoiding the temptation to claim a popularity we do not possess. We have a unique opportunity to break a deadlock that has stalled our town for years. Let us use the freedom of our position to find a path forward that is too reasoned, too balanced, and too genuinely collaborative for the ordinary politics of the council to have ever found. Let's get to work.
