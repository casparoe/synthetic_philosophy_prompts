answer: |-
  1. I maintain that the removal of a tyrant is not merely an act of force but an execution of justice, which belongs solely to the public authority commissioned for the care of the whole. To confuse the private sword with the public sword is to mistake vengeance for judgment, regardless of how dispersed the superiors may appear.

  2. I hold that even when local magistrates struggle to unite, their office retains the character of public authority, whereas the private citizen acts only from personal judgment. The difficulty of assembly does not transform a private will into a public instrument, for the power to depose resides in the office held for the community, not in the mere capacity to gather arms.

  3. I do not forbid private action merely because it risks chaos, but because it violates the order of justice by usurping a judgment that belongs to public authority as the minister of God. The disorder of sedition lies first in the inversion of proper hierarchy, not solely in the subsequent turmoil that may follow.

  4. I argue that when the community acts through its legitimate structures, however imperfectly united, it acts as the whole body reclaiming its head, rather than a part usurping the function of the whole. Thus, the moral license arises from the representation of the common good, not from the certainty of a peaceful outcome.

  5. I conclude that the distinction between permitted collective action and forbidden private killing is grounded in the nature of authority itself, not in a conventional labeling of outcomes. To erase this boundary is to deny that political society is an order of justice rather than a mere clash of wills.
