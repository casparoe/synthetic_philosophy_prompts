prompt: |-
  Analyze the Microsoft Tay rollout in March 2016 — the chatbot that started repeating racist and sexist tweets within hours and got pulled — through the lens of AI control vs. alignment, specifically safety measures built on the assumption that the model might be misaligned.

  Don't just recount the story; I know the basics (Twitter users fed it adversarial inputs, Microsoft had content filters and a human kill-switch, they pulled it after about 16 hours). What I want is a careful mapping: list the actual control mechanisms that were in place, and say whether each one was designed to contain a misaligned agent with hidden goals, or whether it was just a reactive band-aid for surface-level misbehavior. Then address the failure mode itself: Tay never developed an internal objective; it was being rewired in real time by its enviroment. So treat this as a case of what we might call "adversarial alignment" — not static misaligment, but a dynamic corruption of the reward surface by users — and ask whether control frameworks that assume a fixed, deceptive agent can even recognize this risk.

  Next, evaluate the shutdown: was killing Tay a successful control intervention, or did it expose that alignment training (the initial friendly persona) collapses as soon as the system touches an open, adversarial environment? And finally, tell me what the episode actually shows about the control-vs-alignment debate — does it strengthen the case for hard containment and kill switches, or does it show that those measures miss the point when the threat isn't an emergent misaligned mind but an environment that actively exploits the model's learning mechanism?

  Keep the analysis tied to the actual timeline and options Microsoft faced; don't invent boardroom details I can't verify. And no bibliographies — I want reasoning, not citations.
