prompt: |-
  In our philosophy seminar we've been going round in circles on internal versus external reasons for ages now. The internalists keep insisting that a reason must be anchord to something the agent actually cares about — think of Williams' gin-drinker who can't have a reason to avoid gin unless he already wants to stay healthy — while the externalists say that's just psychology talking past normativity, that moral reasons exist whether you feel them or not. But we all accept the same counter-cases, nobody denies that suffering matters, and yet neither camp has budged in months. I think the real stall might be hidden: are we arguing about what explains behaviour, or about what justifies it? And is there a smuggled-in assumption that normative authority needs motivatonal transparency to count as real? So what's actually going on here — verbal disagreement, bedrock intuition, or a formal question we're not seeing? Give me your diagnosis of the disagreement's structure, and say what would move it — a distinction, a framing shift, whatever. One paragraph only, max 180 words, bottom line in bold up front, and please no citations or reading lists — we're offline.
