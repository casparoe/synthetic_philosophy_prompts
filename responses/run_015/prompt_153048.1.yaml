prompt: |-
  Hi — I'm chief of staff (and by default the office ethics person, because nobody else will take it) in a mid-size city mayor's office, and I need something I can actually run, not something to think about.

  The situation: two or three times a week something hits my desk where the options are (i) do something the mayor and I both think is morally wrong, or (ii) let something bad happen that the city exists to prevent. Sometimes the wrong thing is legally shaky, sometimes it's completely legal and that's the problem. Legal review is a separate step and we have corp counsel for it, so please don't spend the procedure on "is it lawful" — I need whatever comes after the lawyers say yes or shrug.

  I've read a bit of the philosophy on this (dirty hands) and it's maddening in practice: lots about tragedy, moral residue, guilt, and whether the politician who does these things is the one we should want in office — and almost nothing about how to tell whether you're actually in a dirty-hands case or just telling yourself you are so you can sleep at night. I think that distinction is doing all the work, so build the procedure around it. Here are the things I keep wanting to test and can't quite operationalise:

  - Is the wrong load-bearing? Does the action still produce the good outcome if you take the wrong-making feature out of it, maybe at some cost in speed or money? If the wrong bit is just the cheapest or fastest route to a result you could get otherwise, then as far as I'm concerned it isn't dirty hands, it's a bad trade with nicer packaging. (I invented "load-bearing wrong" as a label — use it if it helps, swap it for something better if you have one.)
  - Does the wrong survive delegation? Half the time the act happens three layers down and nobody quite ordered it, or the mayor "doesn't want to know the details." My instinct is that you can't launder it by pushing it down the chain, and that the dirt actually attaches to whoever set up the situation where someone lower down had to do it. I want that as a step, not a vibe.
  - Are we really just in lesser-evil territory? Plenty of what comes through here isn't "wrong but necessary," it's "imposes real costs on people and nobody's rights are violated." I want the procedure to say so quickly and let us move on, instead of us agonising over everything.
  - The acknowledgement condition. My sense from what I've read is that any permission here is tied to the agent being willing to own the act in public afterwards and take whatever comes — being judged, being punished, resigning, carrying the guilt rather than treating it as washed away. But most of the options that reach my desk only work if nobody finds out. That seems to mean most of them can't qualify at all, and I want the procedure to say that in so many words rather than leaving it to my judgement every single time.
  - Frequency. This is roughly the fourth emergency procurement / back-channel deal / shortcut this year and I've noticed we've stopped noticing. Is there a version of this test that catches habituation — the slide into "well, we did it last time"? If it can be proceduralised, put it in. If it genuinely can't, say that instead of faking a step.

  What I want back:

  1. A decision procedure I can run in about 45 minutes on a real proposal: an ordered set of questions, what counts as a sufficient answer to each, what counts as a non-answer (i.e. the kind of thing my office writes that sounds like an answer and isn't), hard stops where the answer is no, and explicit hand-off points where the question is a values call the mayor has to make rather than me. Mark clearly which steps are real tests and which are judgement calls dressed up as procedure — I'd rather know than be reassured.
  2. Who signs off at each stage, given that I have about an hour, the mayor has ten minutes, and anything touching council has to survive a hostile oversight hearing six months later where someone reads our emails out loud.
  3. Run it on three cases, showing the actual path through the steps:
   (a) A fast-moving wildfire. The fire chief wants standing authority to demolish two unoccupied houses without the notice our ordinance requires, to cut a firebreak that will probably save a block. Legally dubious, time pressure is real.
   (b) A housing deal. In exchange for a much larger affordable-housing set-aside than we could get any other way, we steer a seperate no-bid garage contract to the same developer and let the public believe the garage went to them on merit. Nobody's rights are violated exactly, but a process we're supposed to be guarding is being rigged on purpose, and elected colleagues are being lied to by omission.
   (c) An undercover policing operation that requires the officer to participate in a crime to hold cover, which will genuinely prevent serious harm to identifiable people, and which cannot work unless the city can deny any knowledge of it afterwards. This is the one where I think the procedure is going to hand me an answer I don't like. I'd much rather see it come out that way in writing than have you smooth the edges because the stakes in the case feel high.
  4. A short, honest closing section on where this thing will misfire: what it will wrongly clear, what it will wrongly block, and the kinds of case where it's basically a rubber stamp for whatever we already wanted to do.

  Two more constraints. Don't give me a reading list, citations, or a summary of who argued what — I can't chase references and it wouldn't help me decide by 3pm. And design it for someone who is tired, recieves most of these proposals from people more senior than them, wants to keep their job, and will therefore rationalise hard: if there's a way to build an anti-rationalisation check into the ordering of the questions (or into who has to answer them), do that.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Chief of Staff (CoS) in a mid-size city mayor's office. Also the de facto ethics officer.
      *   **Problem:** Frequent "dirty hands" scenarios (morally wrong but seemingly necessary actions). Needs a practical, operational procedure, not philosophical theory.
      *   **Constraints:**
          *   No legal advice (Corp Counsel handles that).
          *   Time limit: ~45 mins to run, Mayor has 10 mins.
          *   Audience: Tired, pressured, prone to rationalization, needs to keep their job, faces hostile oversight later.
          *   Output: Decision procedure (questions, pass/fail criteria, hard stops), Sign-off matrix, 3 Case Studies (Wildfire, Housing, Undercover), Limitations section.
          *   Tone: Direct, pragmatic, cynical but principled, no academic fluff.
      *   **Key Concepts to Operationalize:**
          *   "Load-bearing wrong" (Is the wrong essential to the good outcome?).
          *   "Delegation test" (Can you push this down the chain?).
          *   "Lesser evil vs. Mere cost" (Is it actually a rights violation or just expensive/unpleasant?).
          *   "Acknowledgement condition" (Willingness to own it publicly/later).
          *   "Frequency/Habituation" (Are we doing this too often?).
          *   "Anti-rationalization" (Structure to prevent self-deception).

  2.  **Deconstruct the "Dirty Hands" Problem for Bureaucracy:**

      *   The philosophical problem is usually about the *agent's soul*. The bureaucratic problem is about *liability, legitimacy, and sustainability*.
      *   The user wants to distinguish between "tragic necessity" and "convenient corruption."
      *   The "Acknowledgement Condition" is the killer. If you can't admit it later, it's probably not defensible ethics, it's just cover-up.
      *   The "Frequency" test is crucial for institutional drift.

  3.  **Drafting the Procedure (The "45-Minute Triage"):**

      *   *Structure:* Needs to be linear. Hard stops early to save time.
      *   *Anti-Rationalization:* Put the hardest questions first or force specific evidence before moving on. Require written answers for the audit trail (even if internal).
      *   *Step 1: The "Lesser Evil" Filter.* Is this actually a rights violation or just a process annoyance? (Addresses the "imposes real costs" point).
      *   *Step 2: The "Load-Bearing" Test.* Can we get the good result without the bad means? (Addresses the "cheapest/fastest route" point).
      *   *Step 3: The "Sunlight/Accountability" Test.* Can we admit this later? (Addresses the "Acknowledgement Condition").
      *   *Step 4: The "Delegation/Chain" Test.* Who actually does it? (Addresses the "laundering" point).
      *   *Step 5: The "Frequency" Check.* Have we done this before? (Addresses habituation).

      *   *Refining the Steps:*
          *   Make Step 3 (Sunlight) a hard stop. If you can't own it, don't do it. This aligns with the user's intuition about secrecy.
          *   Make Step 1 distinguish between "Rights Violation" and "Process Violation."
          *   Integrate the "Who Signs" into the steps.

  4.  **Developing the Sign-Off Matrix:**

      *   CoS (User): Runs the test, documents the logic.
      *   Mayor: Makes the value call on the "Lesser Evil" *if* it passes the hard stops.
      *   Corp Counsel: Already did the legal check (pre-condition).
      *   Audit Trail: Essential for the "hostile oversight hearing."

  5.  **Running the Case Studies:**

      *   *Case A (Wildfire):* High urgency, physical safety, property rights vs. life safety. Likely passes "Load-bearing" (no time for notice). Fails "Secrecy" if they try to hide it, but passes if they admit it was an emergency action later. *Verdict: Proceed, but document for later ratification.*
      *   *Case B (Housing/Garage):* Corruption masquerading as pragmatism. Fails "Load-bearing" (could probably do it honestly, just harder). Fails "Sunlight" (lying by omission). Fails "Delegation" (rigging the process). *Verdict: Hard Stop.*
      *   *Case C (Undercover/Crime):* The tricky one. User suspects it will fail. It requires secrecy (fails Sunlight/Acknowledgement). It requires delegation (officer does the crime). It creates habituation risk. *Verdict: Hard Stop based on Acknowledgement Condition, even if utilitarian logic says go.* This validates the user's fear.

  6.  **Drafting the Limitations Section:**

      *   Where will this fail?
      *   It will block "necessary secrets" (intelligence, some policing).
      *   It will allow "noble lies" if the actor is willing to resign later (which they rarely are).
      *   It relies on the CoS having the guts to say "No" to the Mayor.
      *   It can't stop a Mayor determined to be corrupt, only make it harder.

  7.  **Review against Constraints:**

      *   *No citations?* Check.
      *   *45 minutes?* The questions need to be sharp.
      *   *Anti-rationalization?* Require written justification *before* the Mayor sees the option. Force the "What if this is on the front page?" question.
      *   *Tone?* Professional, direct, slightly weary but firm.

  8.  **Refining the "Load-Bearing" and "Acknowledgement" Concepts:**

      *   "Load-bearing wrong" is a good term. Keep it.
      *   "Acknowledgement Condition" needs to be the "Publicity Test." If you can't write a memo about it for the archives, it's a no-go.
      *   *Self-Correction on Case C:* The user said "city can deny any knowledge." This explicitly fails the Acknowledgement condition. The procedure *must* flag this as a failure, even if the outcome is good. This is the "honest answer I don't like" the user requested.

  9.  **Final Polish:**

      *   Ensure the "Hard Stops" are visually distinct.
      *   Make sure the "Who Signs" is clear.
      *   Check the "Frequency" mechanism. A simple log check.
      *   Ensure the distinction between "Legal" and "Ethical" is maintained (Legal is pre-req).

  10. **Final Output Generation** (incorporating the above thoughts into the structured response). *Self-correction during drafting:* Make sure I don't sound like I'm giving legal advice. Emphasize that Corp Counsel must clear legality *before* this ethics test runs.

  *(Self-Correction on Case C)*: I need to be careful not to say "Police can never do undercover work." The specific constraint is "city can deny any knowledge of it afterwards." That implies *plausible deniability* which contradicts the *Acknowledgement Condition*. The procedure should catch this specific tension.

  *(Self-Correction on Sign-off)*: The Mayor has 10 minutes. The CoS does the work. The Mayor signs the "Value Call." The CoS signs the "Process Check."

  *(Refining the "Frequency" Test)*: Keep a "Dirty Hands Log." If you hit 3 in a year, trigger a review.

  Let's assemble.cw
answer: |-
  Here is the **Emergency Ethics Triage Protocol (EETP)**. It is designed to be run in 45 minutes by you, with a 10-minute decision window for the Mayor. It assumes Corp Counsel has already reviewed legality (or identified the specific legal risk).

  This protocol is not designed to make you feel good. It is designed to create an audit trail that distinguishes *tragic necessity* from *convenient corruption*, and to force the "Acknowledgement Condition" into the open before the act is committed.

  ### Part 1: The Decision Procedure

  **Pre-Condition:** Corp Counsel has reviewed. If they say "Illegal," stop. If they say "Legal but risky" or "Silent," proceed to Step 1.

  **Anti-Rationalization Rule:** You (CoS) must draft the answers to Steps 1–4 *before* presenting the option to the Mayor. Do not let the Mayor's preference shape the answers.

  #### Step 1: The "Lesser Evil" Filter (5 Minutes)
  **Question:** Is the negative consequence a violation of a specific right/entitlement, or is it merely a cost/inconvenience?
  *   **Pass:** The action imposes financial cost, delay, or administrative frustration, but no specific legal right or protected interest is breached. (This is not a dirty hands case; it is a budget/priority call).
  *   **Fail:** The action breaches a specific right (property, due process, privacy, safety) or violates a sworn duty of candor.
  *   **Non-Answer:** "It's for the greater good," or "Nobody will really get hurt."
  *   **Hard Stop:** If **Fail**, proceed to Step 2. If **Pass**, this is a standard policy decision. Mayor decides. End ethics review.

  #### Step 2: The Load-Bearing Wrong Test (10 Minutes)
  **Question:** Is the unethical/rough feature *essential* to the outcome, or is it just the cheapest/fastest way to get there?
  *   **Test:** Propose an alternative path that achieves 80% of the good outcome without the wrong-making feature.
  *   **Pass:** The alternative is impossible, too slow to matter (e.g., people die), or costs 10x more (existential budget threat). The "wrong" is the *only* bridge to the outcome.
  *   **Fail:** The alternative is merely more expensive, slower, or politically harder for the Mayor.
  *   **Non-Answer:** "We don't have time to look for alternatives," (without evidence of the time constraint).
  *   **Hard Stop:** If **Fail**, reject the proposal. It is not dirty hands; it is bad management.

  #### Step 3: The Sunlight & Acknowledgement Test (15 Minutes)
  **Question:** Can we document this action internally now, and admit to it publicly later (even if consequences follow)?
  *   **Test:** Draft the headline and the first paragraph of the press release *and* the internal memo that will exist in the archives 5 years from now.
  *   **Pass:** We can write the memo now. We are willing to say, "We did X to prevent Y, and we accept the liability/consequences."
  *   **Fail:** The plan relies on *plausible deniability*, destroying records, or lying to oversight bodies *in perpetuity*. The scheme collapses if exposed.
  *   **Non-Answer:** "We'll cross that bridge when we come to it," or "We just need to keep it quiet until the crisis passes" (with no defined end to the secrecy).
  *   **Hard Stop:** If **Fail**, **REJECT**. This is the most critical filter. If you cannot own the act later, you are not solving a tragedy; you are building a scandal.

  #### Step 4: The Delegation & Chain Test (5 Minutes)
  **Question:** Who physically performs the "wrong" act, and who ordered it?
  *   **Pass:** The decision-maker (Mayor/CoS) signs the order. The subordinate executes a clear, lawful order that they understand carries ethical weight.
  *   **Fail:** The order is verbal, implied, or structured so the subordinate "chooses" to break the rule to "save the day," shielding the principal.
  *   **Non-Answer:** "The Chief knows what needs to be done."
  *   **Hard Stop:** If **Fail**, **REJECT**. You cannot launder dirt through subordinates.

  #### Step 5: The Frequency Log Check (5 Minutes)
  **Question:** How many times have we invoked "Emergency/Ethics Exception" this year?
  *   **Procedure:** Check the **Dirty Hands Log** (a simple running count maintained by CoS).
  *   **Pass:** This is the first or second time this year.
  *   **Warning:** This is the third time. Requires a written justification on why the *system* is failing, not just the situation.
  *   **Hard Stop:** This is the fourth+ time. **REJECT**. You are no longer in emergency mode; you have institutionalized the exception. The system is broken. Fix the system, don't patch the case.

  ---

  ### Part 2: Sign-Off Matrix

  | Stage | Action | Who Signs | Time Required | Audit Trail |
  | :--- | :--- | :--- | :--- | :--- |
  | **Pre-Check** | Legal Review | Corp Counsel | N/A (Prior) | Legal Memo |
  | **Step 1-2** | Filter & Load-Bearing | **CoS (You)** | 15 Mins | *Ethics Triage Worksheet* (Internal) |
  | **Step 3** | Sunlight Test | **CoS (You)** | 15 Mins | *Draft Press Release/Memo* (Saved) |
  | **Step 4** | Chain of Command | **CoS + Dept Head** | 5 Mins | *Signed Directive* (Not verbal) |
  | **Step 5** | Frequency Check | **CoS (You)** | 5 Mins | *Dirty Hands Log* |
  | **Final Call** | Value Judgment | **Mayor** | 10 Mins | *Decision Memo* (Signed) |

  **Note on Liability:** If the Mayor insists on proceeding after a **Hard Stop** in Step 3 (Sunlight) or Step 5 (Frequency), you must submit a written objection to the file and consider your position. That is no longer ethics; it is risk management for your own career.

  ---

  ### Part 3: Case Studies

  Here is how the protocol runs on your three scenarios.

  #### Case A: Wildfire Firebreak (Demolish houses without notice)
  *   **Step 1 (Lesser Evil):** **Fail.** Property rights are being breached without due process. Proceed to Step 2.
  *   **Step 2 (Load-Bearing):** **Pass.** Time is the constraint. Giving notice takes 24 hours; fire moves in 20 minutes. The "wrong" (skipping notice) is load-bearing for the "good" (saving the block). No alternative exists.
  *   **Step 3 (Sunlight):** **Pass.** We can write the memo: "Emergency demolition authorized under imminent threat to life." We can admit this later. We may face lawsuits, but we accept them.
  *   **Step 4 (Delegation):** **Pass.** Fire Chief issues written order, Mayor co-signs retrospectively if needed.
  *   **Step 5 (Frequency):** **Pass.** Assuming this isn't the 4th fire emergency this year.
  *   **Verdict:** **PROCEED.**
  *   **Why:** This is a classic tragic necessity. The protocol clears it because the secrecy is tactical (during the fire), not structural (hiding it forever).

  #### Case B: Housing Deal (Rigged garage contract for affordable housing)
  *   **Step 1 (Lesser Evil):** **Fail.** Violates procurement rights of other bidders and duty of candor to Council. Proceed to Step 2.
  *   **Step 2 (Load-Bearing):** **Fail.** Is it *impossible* to get the housing without rigging the garage? Likely no. It's just harder, or yields less profit for the developer. The "wrong" is a subsidy disguised as corruption.
  *   **Step 3 (Sunlight):** **Hard Stop FAIL.** The plan relies on the public *believing* the garage was merit-based. If admitted, the deal collapses and trust is broken. You cannot write the memo.
  *   **Verdict:** **REJECT.**
  *   **Why:** This fails the Load-Bearing test (it's a trade, not a necessity) and fails the Sunlight test (it requires permanent deception). This is corruption, not dirty hands.

  #### Case C: Undercover Policing (Officer commits crime, City denies knowledge)
  *   **Step 1 (Lesser Evil):** **Fail.** Officer is being asked to break criminal law; City is being asked to violate duty of oversight. Proceed to Step 2.
  *   **Step 2 (Load-Bearing):** **Pass.** By definition of the operation, the cover cannot hold if the City acknowledges the act. The "wrong" (lying/denial) is load-bearing for the "good" (preventing harm).
  *   **Step 3 (Sunlight):** **Hard Stop FAIL.** The requirement is that the city "can deny any knowledge of it afterwards." This explicitly violates the Acknowledgement Condition. You cannot save the memo to the archives. You cannot accept the liability.
  *   **Verdict:** **REJECT.**
  *   **Why:** I know you don't like this answer. But look at Step 3. If the success of the operation depends on the City *never* owning the action, you are not creating a "dirty hands" scenario; you are creating a **rogue operation**.
      *   *The Trap:* If you approve this, and it goes wrong (officer gets hurt, or crime is exposed), the Mayor *cannot* step in to protect the officer or the city without admitting the lie. You have boxed yourself into a corner where the only way out is to throw the officer under the bus.
      *   *The Fix:* If the operation is necessary, the authorization must be written, sealed, and acknowledged internally *now*, even if classified. If you cannot sign a paper that says "We authorized this crime," you cannot authorize the crime.

  ---

  ### Part 4: Where This Will Misfire (Limitations)

  You asked for honesty on where this tool breaks. Here it is:

  1.  **The "Necessary Secret" False Negative:**
      *   **The Misfire:** There are legitimate cases (intelligence, sensitive negotiations, protective services) where *temporary* secrecy is required for success, but Step 3 (Sunlight) feels too harsh.
      *   **The Risk:** You might block a valid covert action because you can't imagine how to explain it *today*.
      *   **The Mitigation:** Step 3 allows for *delayed* acknowledgement ("We will admit this in 5 years"), but it does *not* allow for *permanent* denial. If the plan requires permanent denial, the protocol correctly blocks it, even if the short-term utility is high.

  2.  **The "Resignation" Loophole:**
      *   **The Misfire:** A sophisticated actor can game Step 3 by saying, "I am willing to resign and take the fall for this."
      *   **The Risk:** This turns ethics into a currency. "I can afford the scandal, so I can do the wrong."
      *   **The Reality:** The protocol cannot stop a Mayor willing to martyr themselves for a policy. It only stops them if they want to keep their job *and* do the wrong. If they are willing to burn their reputation, the protocol registers a "Pass" on Step 3, but Step 5 (Frequency) should catch the pattern of martyrdom.

  3.  **The "Rubber Stamp" Drift:**
      *   **The Misfire:** Over time, you (CoS) will get tired. You will start writing the "Pass" answers for Step 2 because you know the Mayor wants it.
      *   **The Risk:** The worksheet becomes a compliance form rather than a test.
      *   **The Mitigation:** This is why the **Dirty Hands Log (Step 5)** is the most important safety. If you find yourself logging the third "Emergency Exception" in six months, the protocol forces a systemic halt. It prevents the "new normal."

  4.  **The "Legal/ethical" Gap:**
      *   **The Misfire:** Corp Counsel might say "This is legal" when it is actually "This is unenforceable."
      *   **The Risk:** You proceed on ethical grounds, but the action is struck down by a judge anyway.
      *   **The Mitigation:** Ensure Corp Counsel's "Legal Review" includes a "Litigation Risk Assessment," not just a statutory check.

  ### Final Advice for the CoS

  You are the gatekeeper. This protocol gives you the vocabulary to say "No" without saying "I disagree with you." You are not blocking the Mayor's policy; you are blocking the *procedure* from passing the safety check.

  When the Mayor pushes back on a Hard Stop, do not argue morality. Argue **risk**.
  *   *Don't say:* "It's wrong to lie."
  *   *Say:* "Step 3 failed. We cannot document this. If this leaks in six months during a campaign, we have no defense memo. I cannot clear the risk."

  This protects you, protects the office, and occasionally, protects the public.
