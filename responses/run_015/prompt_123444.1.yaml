          *   *Issue 3:* Uniqueness? There are other rules (e.g., Holistic Conditionalization, min-relative-entropy updates). The "Rigidity" condition is the key constraint that leads to JC, not just "avoiding Dutch Books" in the standard sense. Armendt (1980) and others discussed DB for JC, but it's not as clean as the Lewis/Teller DB for BC.
          *   *Issue 4:* "Uncertain" is too broad. It must be uncertain *over a specific partition*.

