      *   *Mandate Problem:* This is *not* technical alignment. It's governance/political philosophy. Calling it "alignment" muddies the water. It's better framed as "Legitimacy" or "Deployment Governance". If included in "Alignment", it conflates technical capability with political authority. I should advise separating this or labeling it distinctly as "Governance".
      *   *Second-Owner Problem:* This is "Deployment Security" or "Model Sharing Risk". It's valid but often grouped under Generalization or Oversight. It's a strong addition for journalists because it explains why lab claims don't hold in the wild.
      *   *Consensus:* Technical folks agree on Spec/Inner/Outer/Generalization. They do *not* agree that "Mandate" is an alignment problem. They might agree "Second-owner" is a deployment risk.
      *   *Advice:* Keep Mandate but label it "Governance" to avoid technical confusion. Keep Second-owner as "Deployment Drift".

  3.  **Ordering:**
