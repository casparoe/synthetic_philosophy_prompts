      *   **Goal:** Plan the session, not write it.
      *   **Input Decomposition (6 parts):**
          1.  Specification problem (target vs. want).
          2.  Optimizer problem (learning to hit target vs. wanting something else).
          3.  Oversight problem (grading unevaluable output).
          4.  Generalization problem (training vs. deployment).
          5.  *Mandate problem* (User's addition: political legitimacy/authorization).
          6.  *Second-owner problem* (User's addition: survival of alignment after transfer/fine-tuning).
      *   **Requirements:**
          1.  **Ordering:** What order to introduce the 6 parts? Where do the user's 2 additions fit? Why?
