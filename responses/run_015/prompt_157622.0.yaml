answer: |-
  ### The Commodification Decision Tree

  **Node 1: The Liberty Constraint**
  *Scenario:* A starving artist sells a kidney to a billionaire. Both are fully informed, uncoerced, and the surgery is safe. No third party loses an organ they needed.
  *Question:* **Do you ban this exchange categorically?**
  *   **No:** → **Leaf 1: Market Purist**
  *   **Yes:** → Go to Node 2.

  **Node 2: The Meaning Test**
  *Scenario:* Citizens auction their votes to the highest bidder during an election.
  *Question:* **Does the price tag turn a 'civic voice' into a 'widget,' making the concept of voting nonsensical?**
  *   **No:** → Go to Node 4.
  *   **Yes:** → Go to Node 3.

  **Node 3: Remedy for Meaning**
  *Scenario:* We want to allow some compensation for voting (e.g., tax credits) without destroying democracy.
  *Question:* **Can you regulate the price to save the meaning, or must the market be absent entirely?**
  *   **Regulate (Tax/Subsidize):** → **Leaf 2: Semantic Engineer**
  *   **Ban (No Price Allowed):** → **Leaf 3: Sacred Good Absolutist**

  **Node 4: The Queue Test**
  *Scenario:* Wealthy patients pay to jump the organ transplant line ahead of sicker, poorer patients.
  *Question:* **Is the harm primarily that money overrides medical need, skewing who gets saved?**
  *   **No:** → Go to Node 6.
  *   **Yes:** → Go to Node 5.

  **Node 5: Remedy for Allocation**
  *Scenario:* We want more organs available without letting the rich monopolize them.
  *Question:* **Do you cap prices via a non-profit exchange, or ban selling to prevent inequality?**
  *   **Cap (Non-Profit Exchange):** → **Leaf 4: Regulated Market Pragmatist**
  *   **Ban (No Price Allowed):** → **Leaf 5: Equity Hardliner**

  **Node 6: The Neighborhood Test (Fresh Distinction)**
  *Scenario:* A store triples the price of bottled water after a hurricane. The harm isn't just the cost; it's whether this pricing rots our willingness to help neighbors in *non-market* situations later.
  *Question:* **Does this market harm leak into adjacent non-market domains, and if so, can disclosure fix it?**
  *   **No Leak:** → **Leaf 6: Paternalist Void**
  *   **Leak, Fixable by Disclosure:** → **Leaf 7: Norm Mitigationist**
  *   **Leak, Unfixable:** → **Leaf 8: Solidarity Spillover Theorist**

  ***

  ### Leaf Profiles & Awkward Commitments

  1.  **Market Purist:** Consent is the only moral metric required for exchange.
      *   *Awkward Commitment:* You must defend the right to sell oneself into voluntary slavery if the contract is clear.
  2.  **Semantic Engineer:** Market mechanisms can be tuned to preserve the symbolic value of civic goods.
      *   *Awkward Commitment:* You must argue that a vote bought with a tax credit is morally distinct from a vote bought with cash.
  3.  **Sacred Good Absolutist:** Some goods lose their value entirely if they are priced, regardless of distribution.
      *   *Awkward Commitment:* You must oppose paying blood donors even if it means fewer transfusions for trauma victims.
  4.  **Regulated Market Pragmatist:** Markets are tools that work if you remove the profit motive and cap costs.
      *   *Awkward Commitment:* You must explain exactly why a $10,000 kidney is just but a $100,000 kidney is unjust.
  5.  **Equity Hardliner:** Inequality of access is worse than the shortage caused by banning the market.
      *   *Awkward Commitment:* You implicitly prefer a black market over a regulated one to avoid legitimizing wealth-based allocation.
  6.  **Paternalist Void:** You ban trades without identifying a specific mechanism of harm.
      *   *Awkward Commitment:* You cannot distinguish your position from simple authoritarianism when pressed on principles.
  7.  **Norm Mitigationist:** Social norms are fragile but can be protected with warnings and boundaries.
      *   *Awkward Commitment:* You believe a disclaimer label can stop the erosion of community solidarity.
  8.  **Solidarity Spillover Theorist:** Market values inevitably colonize neighboring social practices.
      *   *Awkward Commitment:* You must sacrifice supply efficiency (e.g., fewer water bottles distributed) to keep 'neighborly' vibes intact.

  ***

  ### Logical Space & Unoccupied Combos

  **The Paternalist Void (Leaf 6)**
  This is the "incoherent" zone. It captures people who answer **Yes** at Node 1 (Ban Voluntary Exchange) but **No** at Node 2 (Meaning), **No** at Node 4 (Allocation), and **No Leak** at Node 6 (Spillover). If there is no harm to meaning, no harm to allocation, and no harm to neighbors, there is no logical ground for the ban at Node 1 other than raw paternalism. This space is politically toxic in rationalist circles because it admits to restricting liberty without a consequentialist justification.

  **The Unexplored Zone (Semantic Engineer + Equity Hardliner)**
  The tree allows for someone who thinks votes *can* be regulated (Leaf 2) but kidneys *must* be banned (Leaf 5). This combo is rarely occupied. It requires arguing that democracy is robust enough to handle pricing, but healthcare is too fragile. It's not incoherent, but it demands a theory of why civic norms are stronger than survival norms, which most people intuitively feel is the reverse.

  ### Indistinguishable Pairs & The Hurricane Test

  **Corruption of Meaning vs. Solidarity Spillover**
  Your tree flags these as separate branches (Node 2 vs. Node 6), but in practice, they often collapse into the same prohibition. Both the **Sacred Good Absolutist** and the **Solidarity Spillover Theorist** will ban vote-selling. To separate them, you must use the **Hurricane Water** case.

  *   **Corruption of Meaning:** Argues that high-priced water *changes what water is* (from a right to a commodity). If the water is still just water, this view doesn't trigger.
  *   **Solidarity Spillover:** Argues that high-priced water *changes what neighbors are* (from helpers to transactors). Even if the water remains a commodity, the *behavior* of the seller damages the community fabric.

  If your friends say "Price-gouging is wrong because it treats survival as a business," they are on the **Meaning** branch. If they say "Price-gouging is wrong because it makes us less likely to share tools next week," they are on the **Spillover** branch. The tree separates them, but only if you force them to specify *where* the damage lands: inside the transaction or outside in the neighborhood.
