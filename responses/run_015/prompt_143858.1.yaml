prompt: |-
  I am a doctoral student in metaphysics with a concentration in the philosophy of biology, and I am preparing a session for my graduate seminar on essentialism and modal metaphysics—ten students, seventy-five minutes, all comfortable with possible-worlds semantics but with uneven backgrounds in reproductive biology. I want you to design a runnable classroom activity, not a lecture, that makes the metaphysical force of origin essentialism felt through bodily deliberation rather than through abstract argument. To keep the exercise out of the well-worn grooves of standard Kripkean examples, please inject the framing of meiotic contingency: the fact that which particular sperm fertilizes an egg is the outcome of stochastic processes during meiosis and capacitation, so that treating one’s actual gametic origin as metaphysically necessary means treating a biologically random event as essential to one’s existence.

  The setting is a round-table seminar room. The idea must emerge from what the students do, not from what I say afterward: they should not hear the term “origin essentialism” until the debrief. Design a structured role-play or deliberation with explicit rules, assigned roles, non-monetary payoffs (deliberative authority, “standing,” or veto rights within the simulation), and concrete materials—specifically, “origin cards” that assign each student a specific fertilization event (Egg E plus Sperm S) and “counterfactual cards” that specify the nearest-world substitution (Egg E plus Sperm S′, the runner-up in the same capacitation pool). The collective task should force them to adjudicate rights—perhaps inheritance or medical-decision authority over cryopreserved embryos after a labeling error—such that they must invoke identity conditions to grant or deny standing.

  Please include: (1) logistics and group arrangement; (2) a minute-by-minute timeline; (3) the rules, roles, and card distribution; (4) the deliberative task that makes the counterfactual substitution salient; (5) a debrief that maps specific moments in the activity onto parts of the origin-essentialist thesis (e.g., the moment a student denies standing to the counterpart embryo, or the moment they recognize they are treating random meiotic sorting as metaphysically necessary); (6) an honest prediction of what will go wrong the first time (for instance, students conflating genetic similarity with personal identity, or rejecting the biological premise that sperm selection is genuinely stochastic) and how I should handle it in the moment; and (7) a frank admission of which feature of origin essentialism the activity cannot reproduce—likely the distant-world intuition that one could have existed with entirely different parents—together with what I, as facilitator, must supply verbally to cover that gap.

  What the students should come away seeing is the tension between our ordinary willingness to imagine ourselves with different origins and the essentialist commitment that a specific, contingently selected sperm-egg pair is non-negotiable for one’s existence. Do not provide bibliographies, reading lists, or citations. Do not include verbatim quotations from any text; if you reference a specific work, verify its title and date via search, otherwise avoid precise attributions entirely.
