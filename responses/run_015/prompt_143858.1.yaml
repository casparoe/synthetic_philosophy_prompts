answer: |-
  # Activity Design: The Capacitation Lottery

  ## 1. Logistics and Group Arrangement
  *   **Room:** Round-table seminar room. Chairs arranged in a tight circle to ensure eye contact and equal visibility of central materials.
  *   **Participants:** 10 doctoral students + 1 facilitator (you).
  *   **Materials:**
      *   **10 Origin Cards:** Heavy cardstock, sealed in opaque envelopes.
      *   **10 Counterfactual Briefs:** Printed sheets detailing the "runner-up" fertilization event.
      *   **20 Veto Tokens:** Distinct physical objects (e.g., polished stones or metal coins), two per student.
      *   **Two Collection Boxes:** Placed in the center of the table. Label one **"Exclusive Standing"** (locked box with a single slot). Label the other **"Shared Standing"** (open bowl).
      *   **Biological Fact Sheet:** One copy per student, defining the stochastic nature of the simulation's fertilization process.
  *   **Seating:** Students sit evenly spaced. The two boxes are equidistant from all participants.

  ## 2. Minute-by-Minute Timeline
  *   **00:00 – 00:05 (Setup):** Students seat themselves. You place the boxes in the center. No introduction of the philosophical topic. State only: "Today we are adjudicating a resource allocation dispute based on identity criteria."
  *   **00:05 – 00:15 (Distribution & Private Reading):** Hand out envelopes (Origin Cards) and Fact Sheets. Students read silently. They are instructed not to show cards to neighbors.
  *   **00:15 – 00:20 (The Threat):** Distribute Counterfactual Briefs. Explain the scenario: A secondary claimant exists based on the Counterfactual Brief. The group must decide if this claimant inherits the same rights as the Origin Card holder.
  *   **00:20 – 00:50 (Deliberation Phase):** Open floor discussion. Students negotiate the criteria for identity. They are free to move around the room, but must return to seats to vote.
  *   **00:50 – 01:00 (The Vote & Token Allocation):** Students physically place their Veto Tokens into one of the two boxes based on their verdict. This action locks in their authority for future simulations.
  *   **01:00 – 01:15 (Debrief):** Reveal the philosophical framing. Map the token placement to metaphysical commitments. Discuss the tension between biological randomness and metaphysical necessity.

  ## 3. Rules, Roles, and Card Distribution

  ### The Roles
  All students play the role of **"Primary Beneficiaries."** They hold existing rights to a trust (symbolized by the Veto Tokens). Their goal is to maintain decision-making authority over the trust.

  ### The Cards
  *   **Origin Card (Inside Envelope):**
      > "You are the entity resulting from **Egg #402** and **Sperm #881**.
      > Your rights are contingent on being the *unique* product of this specific fertilization event.
      > **Biological Note:** Sperm #881 was selected from a capacitation pool of 200 million via stochastic thermal motion. The margin of victory over the runner-up was 0.04 seconds."
  *   **Counterfactual Brief (Handout):**
      > "A secondary claimant exists.
      > **Origin:** **Egg #402** and **Sperm #882**.
      > **Relation:** Sperm #882 was the immediate runner-up in the same capacitation pool.
      > **Genetic Overlap:** 50% (same egg), but distinct paternal haplotype.
      > **Claim:** This entity asserts it is 'effectively you' for the purposes of inheritance."

  ### The Rules of Deliberation
  1.  **Token Stakes:** Each student begins with **2 Veto Tokens**. These represent authority to block future trust distributions.
  2.  **The Decision:** The group must reach a consensus (or majority vote) on whether the Secondary Claimant (Counterfactual) possesses the **Same Identity** as the Primary Beneficiary (Origin).
  3.  **The Cost of Identity:**
      *   If you rule **"Same Identity"** (The Counterfactual is you): You must place **both** tokens into the **Shared Standing** bowl. Authority is diluted; the Counterfactual gains access to your veto power.
      *   If you rule **"Different Identity"** (The Counterfactual is not you): You place **one** token into the **Exclusive Standing** box and keep the other. You retain unique authority.
  4.  **Constraint:** You cannot argue based on moral worth or social utility. Arguments must rely strictly on **conditions of existence** (i.e., what makes *you* you).

  ## 4. The Deliberative Task
  The core task is to adjudicate whether the **stochastic difference** in sperm selection constitutes a **metaphysical difference** in personhood.

  *   **Salience Mechanism:** The Biological Fact Sheet explicitly emphasizes that the difference between Sperm #881 and #882 was a matter of random thermal motion (meiotic contingency), not a deliberate selection.
  *   **The Tension:** To keep their Veto Tokens (authority), students are incentivized to argue that the random sperm swap creates a *different person*. However, doing so requires them to commit to the view that a biologically trivial, random event is metaphysically essential to their existence.
  *   **Bodily Element:** The physical act of surrendering tokens into the "Shared" bowl versus locking them in the "Exclusive" box forces a material commitment to their metaphysical stance. They cannot remain agnostic; they must pay for their ontology.

  ## 5. Debrief: Mapping Activity to Thesis
  *Do not begin the debrief until all tokens are deposited.*

  1.  **Reveal the Term:** Introduce the term **"Origin Essentialism."** Explain that the activity was a simulation of this thesis.
  2.  **Map the Tokens:**
      *   **Exclusive Standing Box:** Students who placed tokens here affirmed Origin Essentialism. They treated the specific sperm-egg pair as necessary for their identity. By keeping their second token, they asserted that the Counterfactual entity is a *different person*.
      *   **Shared Standing Bowl:** Students who placed tokens here denied Origin Essentialism. They treated identity as robust across meiotic variation.
  3.  **Highlight the Contingency:** Ask the students who voted "Exclusive": "You just asserted that if a different sperm had won the race by 0.04 seconds, *you* would not exist. How does it feel to ground your unique authority on a stochastic biological event?"
  4.  **Connect to Modal Metaphysics:** Explain that in modal terms, they just adjudicated the "nearest possible world." They decided whether the individual in the nearest world (same egg, different sperm) is identical to the actual individual.
  5.  **The "Bodily" Takeaway:** Point out that their reluctance to surrender tokens (authority) mirrors the philosophical intuition that identity is exclusive. They *felt* the need to protect their uniqueness, which drove them toward essentialism even when the biological difference was random.

  ## 6. Prediction of Failure Modes & Handling

  ### Failure Mode 1: The Genetic Similarity Trap
  *   **Prediction:** Students will argue that because the egg is the same and the sperm comes from the same father, the genetic overlap is sufficient for identity. They will conflate *similarity* with *identity*.
  *   **In-the-Moment Fix:** Intervene as the "Rule Arbiter." Remind them: "The Trust Statute defines identity by *conception event*, not genetic coefficient. You must decide if the *event* determines the entity, not the output similarity. Does the random selection of the sperm constitute a different origin?"

  ### Failure Mode 2: Rejecting the Stochastic Premise
  *   **Prediction:** Students with strong biology backgrounds may challenge the Fact Sheet, arguing that sperm selection is deterministic based on chemotaxis or morphology, not random.
  *   **In-the-Moment Fix:** Halt the biological debate. State: "For the purposes of this simulation, stochasticity is a fixed law. Treat the 0.04-second margin as genuinely indeterminate. Your task is to adjudicate the metaphysics *given* this biology, not to debate the biology itself."

  ### Failure Mode 3: Strategic Voting vs. Belief
  *   **Prediction:** Students may vote "Different Identity" simply to keep their Veto Tokens, admitting afterward they didn't believe it.
  *   **In-the-Moment Fix:** Acknowledge this during debrief. "Notice how the payoff structure pressured you toward essentialism. This mirrors how our intuition of 'self' pressures us toward essentialism—we want to be unique. The question is whether that desire tracks metaphysical truth."

  ## 7. Limitations and Facilitator Fill-In

  ### The Limitation: Distant Worlds
  *   **Admission:** This activity tests **Origin Essentialism** only in the "nearest possible world" (same egg, same father, different sperm). It does not test the stronger Kripkean claim that you could not have had *different parents* entirely.
  *   **Why it matters:** Students might accept that a sperm swap changes identity but still believe they could have been born to different parents. The activity does not force them to confront the "different parents" intuition.
  *   **Facilitator Fill-In:** In the final 5 minutes, you must verbally bridge this gap. Say: "We tested the minimal difference here. Origin Essentialism claims that *any* change to the origin—whether a different sperm or a different mother—results in a different person. If you felt that the sperm swap changed your identity, you have accepted the core mechanism of the thesis. Extending that to different parents is the next logical step, though it feels more counterintuitive."

  ### The Limitation: Temporal Persistence
  *   **Admission:** The activity treats identity as a static claim at conception. It does not address how identity persists over time (psychological continuity vs. biological origin).
  *   **Facilitator Fill-In:** "We isolated the moment of origin. In reality, you have psychological histories. But the essentialist claim is that without *this* origin, that history would belong to someone else. The activity forced you to decide if the origin anchors the history."
