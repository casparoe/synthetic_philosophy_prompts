answer: |-
  Your three-generation test is significantly more exposed than the transformation view because it measures institutional mimicry rather than functional capacity, rigging the outcome so badly that it renders the test invalid for detecting collapse.

  Here is the pressure test you requested, ranked by severity and temporal status.

  ### Defeaters Against the Transformation View
  **Fatal (Already Happened)**
  1.  **Complexity Collapse:** The archaeological record shows a discontinuous drop in specialized economic exchange (e.g., African Red Slip ware distribution) that correlates with the loss of state-enforced trade networks. A transformation implies continuity of function; the shift from a monetized, specialized economy to localized subsistence is a functional break, not a continuity.
  2.  **Monopoly on Violence:** The "standing professional army" (Criterion 1) ceased to be a state instrument and became a personal retinue. When soldiers swear loyalty to a general rather than the office, and payment shifts from state treasury to land grants/booty, the state has lost its defining feature. This happened before 476 in the West.

  **Fatal (Would Need New Argument)**
  1.  **None:** The data exists; the transformationist view survives only by redefining "state" to exclude enforcement capacity.

  **Awkward (Already Happened)**
  1.  **Elite Identity Shift:** The *cursus honorum* (Criterion 2) blurred into military command. Being a "person of consequence" shifted from administrative competence to martial followings. This is awkward for transformationists because they must argue that a change in the *source* of power doesn't change the *nature* of the power.
  2.  **Urban Contraction:** Cities shrank dramatically in population and footprint. While not fatal to "statehood," it contradicts the "machinery running" narrative because the tax base required to run that machinery vanished.

  **Awkward (Would Need New Argument)**
  1.  **Climate/Plague Causality:** If the Late Antique Little Ice Age or Justinianic Plague are proven to be primary drivers rather than accelerants, it weakens the "administrative theatre" argument by showing external systemic shocks overwhelmed the machinery regardless of who wore the diadem.

  ### Defeaters Against Your Three-Generation Test
  **Fatal (Already Happened)**
  1.  **Form Over Function (Criterion 1):** Odoacer and Theodoric *did* collect taxes in solidi, but the yield was a fraction of the 4th century, and collection was often negotiated locally rather than enforced centrally. Your test counts the *existence* of the tax form, not the *yield* or *enforcement*. A mafia protection racket looks like a tax system if you only check the ledger headers.
  2.  **Legitimacy Inflation (Criterion 3):** Everyone claimed Roman legitimacy (Franks, Goths, Byzantines). If multiple actors claim the same office, the claim loses discriminatory power. Your test counts the *claim*, not the *recognition*.

  **Fatal (Would Need New Argument)**
  1.  **Operational Definition of "Standing Army":** You need to define "standing" as "deployable by central order without negotiation." If you don't, any warlord with a retinue passes the test.

  **Awkward (Already Happened)**
  1.  **75-Year Horizon:** Institutional decay is often asymptotic. A hard cutoff allows a regime to fail in year 76 and pass the test.

  **Awkward (Would Need New Argument)**
  1.  **Regional Variance:** The "West" didn't fall uniformly. Africa fell in 439, Britain in 410, Italy in 476. A single test for "the polity" masks regional collapses that sum to systemic failure.

  ### The Transformationist Defense: Verbal or Real?
  A committed transformationist will **concede** the material decline (fewer coins, smaller cities, less trade) but **dismiss** it as "decline" rather than "fall." They will argue that because the *idea* of Rome persisted (law, church, titles), the *entity* persisted.

  This makes the dispute **verbal** regarding the label "Rome" (is it the state or the culture?), but **non-verbal** regarding human welfare and systemic risk. If "transformation" means "the state lost the ability to guarantee contract enforcement, specialize labor, or project power beyond its capital," then the stakes are real: complexity collapsed, vulnerability increased, and resilience dropped. The transformationist view risks obscuring the human cost of that collapse by focusing on elite continuity.

  ### Fixing the Test and Final Verdict
  Your test rescues the transformation claim by rigging it; it checks for the *paint* on the wreckage, not the *engine*. To make it bite, you must add a **Complexity/Reach Criterion**: *Within three generations, the central authority must be able to project coercive power beyond its immediate garrison without personal negotiation, and sustain a specialized economy independent of local subsistence.*

  If you apply this fixed test:
  1.  **Fiscal/Army:** Fails. Power projection became personal/negotiated.
  2.  **Elite Ladder:** Fails. Martial following replaced administrative merit.
  3.  **Legitimacy:** Fails. Claims were contested and local.
  4.  **Complexity/Reach:** Fails. Trade networks fragmented; specialization dropped.

  **The view does not survive the fixed version.** The machinery was not kept running; it was cannibalized for parts by successors who needed the branding to legitimize extraction. The fall was not an event in 476, but the transformation view fails because it conflates the survival of *titles* with the survival of *state capacity*.
