      *   **Part (c) [12 marks]:** Reference class is a valid objection. Evaluation is reasonable. However, it's constrained by the Part (a) error (can't use SIA as rebuttal because they thought it was the premise). Misses the "Self-Indication Assumption" as the *rebuttal* (which is the standard counter).
