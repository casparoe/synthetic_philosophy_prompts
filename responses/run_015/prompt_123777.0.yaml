          *   *The 9,000 years:* This number seems pulled from thin air or confused with a different calculation (maybe assuming lower birth rates?).
          *   *Impact:* The conclusion doesn't follow from their own numbers in (b). This is a "conclusion doesn't follow" error the user specifically asked to watch for.

