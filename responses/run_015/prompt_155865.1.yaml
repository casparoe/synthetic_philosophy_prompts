answer: |-
  Ben Franklin is up in heaven, showing St. Peter his famous moral perfection ledger. He's got the grid, the 13 virtues, the whole Enlightenment spreadsheet.

  Peter flips through the pages. "Impressive diligence, Ben. But I see a lot of black marks. You never got a perfect week?"

  "Never," Franklin says. "See here? Tuesday. I bought a round of drinks for the printing crew. Mark against Frugality."

  Peter nods. "But you were building morale. That's Justice and Benevolence, isn't it?"

  "Exactly," Franklin says. "But if I *hadn't* bought the drinks, I'd have a mark against Justice for being stingy. So either way, I get a black mark."

  Peter frowns. "So a perfectly moral man would still have a ledger full of black marks?"

  "That's what I realized," Franklin says, closing the book. "I spent 50 years thinking I was auditing my soul. Turns out I was just auditing the incompatibility of my own rules. The black marks weren't sins; they were bug reports."

  "So what's the solution?" Peter asks.

  "I'm starting a new project," Franklin says. "It's called Moral Particularism."

  "How's that work?"

  "It's a blank book," Franklin says. "No rules, no checklist. I just walk into a situation and ask, 'What does *this* specific mess require?' It's terrifying. But my ink bill is zero."
