answer: |-
  Here is the conceptual specification for a theory of transgenerational collective guilt. This spec is designed to stress-test any account claiming that a contemporary collective (like modern Germany) can bear *guilt* (not just liability) for historical atrocities (like WWII).

  ### The Desiderata Specification

  #### 1. The Guilt-Liability Separation Constraint
  *   **Definition:** The theory must provide distinct criteria for **collective guilt** (backward-looking moral blame attributable to the agent) and **collective liability** (forward-looking obligation to repair harm). It must be possible to be liable without being guilty.
  *   **Motivating Case:** A successor state inherits the sovereign debt of a predecessor regime. It must pay the debt (liability) to maintain credit and order, but the current citizens did not authorize the spending (no guilt). If a theory conflates these, it punishes innocent people for sins they didn't commit under the guise of "justice."
  *   **Status:** **Non-Negotiable.** (Required for coherence with basic moral intuition and international law).
  *   **Tension:** Most "collective guilt" theories fail here by smuggling liability in as guilt to make the emotional weight land.

  #### 2. The Jaspers-Categorical Integrity Constraint
  *   **Definition:** The theory must not collapse Karl Jaspers' four categories of guilt (*criminal, political, moral, metaphysical*) into a single monolithic "collective guilt." Specifically, it must distinguish *political guilt* (liability for the deeds of the state one lives under) from *criminal/moral guilt* (personal participation or endorsement).
  *   **Motivating Case:** A German pacifist in 1942 vs. a Wehrmacht officer. Both are "politically" liable for the state's actions insofar as they are citizens, but only the officer bears *criminal/moral* guilt. A transgenerational theory that labels a modern German citizen "criminally" guilty of the Holocaust violates this.
  *   **Status:** **Non-Negotiable.** (Required to avoid category errors that render the theory morally absurd).
  *   **Tension:** Popular rhetoric often collapses these to maximize shame; rigorous theory must separate them.

  #### 3. The Diachronic Agency Constraint (Institutional Continuity)
  *   **Definition:** The theory must specify the mechanism of **agent-identity over time**. It must explain how Collective Agent A (1940) is numerically or functionally identical to Collective Agent B (2024) despite 100% turnover in biological membership.
  *   **Motivating Case:** If the state is just a "sum of citizens," the 1940 state ceased to exist when those citizens died. If the state is a "corporation sole" or legal institution, it persists. The theory must justify why the *moral* status persists along with the *legal* status.
  *   **Status:** **Non-Negotiable.** (Without this, there is no subject to bear the guilt).
  *   **Tension:** Strong legal continuity often conflicts with moral discontinuity (the "new democracy" argument).

  #### 4. The Moral Amortization Schedule (Temporal Decay)
  *   **Definition:** The theory must explicitly state whether collective guilt depreciates over time. If it does, what is the rate of decay? If it does not, what prevents "infinite moral debt"?
  *   **Motivating Case:** Infrastructure depreciates; does moral stain? If a crime is 80 years old, is the guilt 100% potent, or does the fading of memory, context, and direct causal links reduce the moral weight? A theory of "non-depreciating guilt" risks making redemption impossible; a theory of "rapid depreciation" risks absolving crimes before victims die.
  *   **Status:** **Camp Preference.** (Restorative Justice advocates often argue for non-depreciation until repair is made; Liberal Individualists often argue for rapid depreciation as participants die).
  *   **Tension:** See *Incompatibility Matrix* below.

  #### 5. The Distributive Allocation Constraint
  *   **Definition:** The theory must define how the burden is shared among current members. Is it **per capita** (equal shares for all citizens), **benefit-weighted** (proportional to wealth inherited from the injustice), or **participation-weighted** (proportional to ongoing structural support)?
  *   **Motivating Case:** A recent immigrant to Germany vs. a multi-generational family that profited from Aryanization. Equal shares treat them as identical moral agents; benefit-weighted treats them as economic inheritors. The theory must choose: is the guilt attached to the *person* or the *position*?
  *   **Status:** **Camp Preference.** (Egalitarians prefer per capita; Luck Egalitarians prefer benefit-weighted).
  *   **Tension:** Per capita allocation often violates the *Guilt-Liability Separation* by imposing guilt on those who received no benefit.

  ---

  ### The Incompatibility Matrix (Jointly Unsatisfiable Subsets)

  You asked if any subset of these requirements cannot be held simultaneously. There is a specific trilemma here. You cannot satisfy all three of the following:

  1.  **Strict Individualist Moral Agency:** Only biological humans can bear *moral guilt* (not abstract entities).
  2.  **Full Diachronic Continuity:** The State is the *same* moral agent today as it was in 1940.
  3.  **Non-Depreciating Guilt:** The guilt retains its full moral force across generations.

  **Why they clash:**
  *   If you hold **(1)**, you must deny **(2)**. If only humans are agents, the "State" is a fiction. When the humans die, the agent dies. Guilt cannot transfer to new humans without violating **(1)**.
  *   If you hold **(2)** and **(3)**, you must deny **(1)**. You must treat the State as a metaphysical entity capable of sinning independently of its members (a form of collectivism that liberals reject).
  *   If you hold **(1)** and **(3)**, you must deny **(2)**. You have to argue that current citizens are somehow *personally* implicated in the past act (e.g., via benefit), which usually collapses *guilt* into *liability* (violating Desideratum 1).

  **The "Amortization" Conflict:**
  There is also a direct tension between **Diachronic Agency** and **Moral Amortization**.
  *   If the State is truly the *same agent* (Continuity), why does the guilt fade? If *I* commit a murder, my guilt does not fade after 80 years just because I am old.
  *   If the guilt *does* fade (Amortization), it implies the agent is *not* fully continuous. It suggests the "2024 State" is a *different* agent than the "1940 State," which undermines the basis for liability (Continuity).
  *   *Result:* You generally have to choose: Either the State is the same agent and the guilt is permanent (hardline collectivism), OR the State is a successor agent and the guilt depreciates/is converted to liability (liberal institutionalism).

  ---

  ### The Theory Killer

  **The Single Desideratum that Knocks Out the Most Popular Theories:**
  **The Guilt-Liability Separation Constraint (specifically the "Non-Inheritance of Blame" clause).**

  **Why:**
  The vast majority of popular theories regarding historical injustice (especially in public discourse) rely on the intuition that current generations are *guilty* for the past. However, almost all robust moral philosophies (Kantian, Utilitarian, Libertarian) agree that **moral blame requires agency and control.**

  *   **The Knockout:** Current citizens had no control over WWII. Therefore, they cannot be *guilty*.
  *   **The Consequence:** Any theory that claims they *are* guilty fails this constraint. To survive, the theory must admit that current citizens are **liable** (obligated to pay/repair) but **not guilty** (not morally blameworthy).
  *   **The Casualty:** This knocks out "Collective Shame" theories and strong "Collective Guilt" theories. It forces the debate onto narrower, colder ground: *obligation without blame.* Most proponents of transgenerational guilt are unwilling to make this concession because "liability" lacks the emotional sting of "guilt," but it is the only way to satisfy the Non-Inheritance of Blame intuition.

  **Summary for your argument:**
  If your roommate argues Germany is *guilty*, they must explain how a non-participant bears moral blame (violating agency). If they argue Germany is *liable*, they must explain why the debt doesn't depreciate and who exactly pays (the Amortization and Distribution constraints). Most theories crash when forced to choose between **Continuity** (to justify the debt) and **Individualism** (to justify the morality).
