  ### 4. Application to the Sand-Swimmers

  Here is how you write this into your framing chapter using the Revised Framework:

  **The Basal Node (Origin):**
  The flank plaques appear at the shift to burrowing. Your data (null effects on speed/abrasion/water) supports the claim that they had no selected effect at origin.
  *   *Status:* **Origin = Spandrel.** (Likely a developmental byproduct of the body elongation or limb reduction required for burrowing).
  *   *Commitment Check:* Satisfies (2) and (5). You are not forcing an adaptationist story where the data is null.

  **The Derived Tip (Maintenance):**
  The plaques are reshaped into gutters. Ablation shows a 15% cost.
  *   *Status:* **Maintenance = Adaptation.**
  *   *Commitment Check:* Satisfies (1) and (6). The *current* function is sand-channeling because that is what they are currently selected for.
  *   *Methodology:* You used reverse engineering (4) to identify the design problem (sand clogging cloaca), but you validated it against the null (basal species) per (2).

  **The Synthesis:**
  By separating Origin and Maintenance, you avoid the "Panglossian" trap. You acknowledge that the trait exists *because* of a spandrel (Origin), but has the specific shape it has *because* of selection (Maintenance).

  ### 5. Final Advice for the Defence

  Your advisor says you've assembled a "standard package." When you write the chapter, explicitly acknowledge that the "standard package" is often held inconsistently.

  Write this: *"Standard adaptationist frameworks often conflate the origin of a trait with its maintenance. This thesis adopts a dual-status framework: etiological function defines current maintenance, while developmental and phylogenetic analysis defines origin. This allows a trait to be a spandrel in origin and an adaptation in maintenance without contradiction."*

  This does three things:
  1.  It validates your advisor (you are using standard concepts).
  2.  It validates your intuition (you noticed the inconsistency).
  3.  It inoculates you against the "but Gould said..." or "but Williams said..." attacks, because you have explicitly defined how you are reconciling them.

  Your skink system is the perfect empirical wedge for this philosophical point. Don't hide the null results in the basal species; they are the evidence that allows you to make the distinction. If the basal plaques were adaptive, you'd just have a standard adaptation story. Because they are null, you *need* the Spandrel/Adaptation split to explain the lineage. That makes your thesis stronger, not weaker.
