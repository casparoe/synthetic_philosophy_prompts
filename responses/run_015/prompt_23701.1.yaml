      *   *True Conflict:* The "Curse" usually implies $E[V] < 0$. This requires breaking Good's assumptions.
      *   *Wait, I need to be careful.* The user asks: "give an example where the option to learn is worth a positive amount yet the particular thing you end up learning leaves you worse off." -> This is standard Good's Theorem behavior (Ex Post regret).
