      *   **Part 3: When Information is Truly a Curse (Ex Ante Negative Value).** This is where we break assumptions.
          *   *Case A: Utility of Beliefs (Psychological Cost).* Assumption: Utility depends only on outcomes. Break: Utility depends on knowledge. Example: The "Will I get the job?" anxiety.
          *   *Case B: Binding Constraints / Loss of Flexibility.* Assumption: You can ignore info. Break: Info forces action (legal, moral, or strategic commitment). Example: The "Genie" or "Medical Mandate".
