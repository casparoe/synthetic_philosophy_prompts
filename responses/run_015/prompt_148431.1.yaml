answer: |-
  ### Quick Brainstorm

  *   **Core Tension:** Indirect normativity relies on a *relationship* between the actual agent and the idealized agent. Usually, this is a relationship of identity (it's *me*, but better).
  *   **Indexicals:** Terms like "I," "now," and "here" anchor thoughts to a specific perspective. Removing them shifts the perspective from *subjective* to *objective* or *god's-eye*.
  *   **The Binding Problem:** Why should I care what a being who doesn't know they are me says? If they don't know they are me, are they advising me or everyone?
  *   **The Collapse Risk:** If the ideal agent reasons without indexicals, they are essentially reasoning from a universal standpoint. If the output is universal, do we need the "ideal endorsement" step at all? Or are we just doing direct rational intuitionism?
  *   **Agent-Relative Reasons:** Standard indirect views preserve personal projects (my wife, my career). Indexical-stripped views might flatten these into generic values (spouses, careers).
  *   **Motivation:** Indexicals are often thought necessary for action (e.g., "I must move *now*"). Can an indexical-free agent generate action-guiding norms for a specific embodied agent?

  ---

  ### Analysis of Indirect Normativity Views

  #### 1. Standard Indirect Normativity (SIN)

  **The View:**
  On the standard model, norms are determined by what an ideally informed, coherent, and calm version of *you* would want your actual self to do. The idealized agent possesses full factual knowledge and perfect instrumental rationality but retains the first-personal perspective. They know "I am [Actual Agent]" and "These are *my* projects."

  **Do the norms genuinely apply to the actual agent?**
  Yes. The binding force here relies on **identity continuity**. The idealized agent is not a separate entity issuing commands from on high; they are a counterfactual version of the actual agent. Because the ideal agent retains the indexical "I," their endorsement is understood as *self*-endorsement. When the ideal agent says, "I should do X," they are saying, "If I were in the actual agent's position, I would choose X." This creates an internalist bridge: the norm applies because it originates from the agent's own corrected standpoint. It respects the agent's specific identity, relationships, and temporal location, ensuring the norms feel authoritative rather than alien.

  **Does it collapse into direct universalization?**
  No. The normativity remains indirect because the *source* of the obligation is the act of endorsement itself, not merely the rational content of the choice. Two different agents with different identities (different "I"s) might have different ideal endorsements even given the same factual situation, because their starting projects and relationships differ. The view preserves agent-relative reasons. The norm is "Do what *you* would want," not "Do what is universally rational."

  #### 2. Indexical-Stripped Indirect Normativity (ISIN)

  **The View:**
  Here, the idealized agent has full information and coherence but lacks all first-personal indexicals. They know every fact about the universe, including all facts about the actual agent, but they do not know *which* person in the universe they are. They know "Agent A is in pain" but not "I am in pain." They reason from a detached, universal perspective.

  **Do the norms genuinely apply to the actual agent?**
  Problematic. The binding force is severely weakened because the **identity link is severed**. If the idealized agent does not know they are *you*, their endorsement cannot be construed as *self*-endorsement. They are effectively a distinct, omniscient observer recommending a policy. For the norm to apply to you, you must accept the authority of this detached observer. But why should you? If the observer lacks the "I," they lack the specific stake in your life that grounds authority in the standard view. The norms might be *correct*, but the *indirect mechanism* fails to explain why they bind *you* specifically. They apply only if you independently accept the universal reasons the observer recognized, not because the observer endorsed them for you.

  **Does it collapse into direct universalization?**
  Yes, largely. By stripping indexicals, you force the idealized agent to reason solely from non-indexical facts (e.g., "Pain is bad" rather than "My pain is bad"). Consequently, their recommendations must be universalizable policies applicable to anyone in relevantly similar circumstances.
  *   **The Redundancy:** If the ideal agent's recommendation is based entirely on universal facts available to any rational agent, the "ideal endorsement" step becomes redundant. We could simply ask, "What do universal reasons dictate?" without positing an idealized endorser.
  *   **The Shift:** The view shifts from "What would *I* want?" (Indirect) to "What is objectively required?" (Direct). The "indirect" label implies that normativity flows from the *will* of the ideal agent. But an indexical-free will is indistinguishable from pure practical reason itself. Therefore, ISIN collapses into a form of direct rationalism or universalization where the norms bind directly in virtue of their content, not in virtue of being endorsed by a specific (albeit idealized) self.

  ### Conclusion

  The presence of first-personal indexicals is the linchpin of indirect normativity. In the **Standard View**, indexicals secure the identity relation that allows the ideal agent's will to bind the actual agent as a form of self-government. In the **Indexical-Stripped View**, removing indexicals severs this identity link. The ideal agent becomes a universal reasoner rather than an idealized self. Consequently, the norms lose their specific authoritative grip on the actual agent via endorsement, and the theory collapses into direct universalization, where norms bind in virtue of their universal rational content rather than their source in an idealized will.
