      *   *Counter:* Hofstadter argues the "I" is largely a memory/narrative construct. If the narrative is shared and mutually altering, the *identity* is shared, even if the sensory input is localized. The "I" is the story told about the sensations, not the sensations themselves. If the story is one coherent, mutating graph, the "I" is one.
