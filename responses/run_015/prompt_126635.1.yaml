  ## PART 4: THE GLUED LEAVES (Log-Utility vs. Growth)

  **The Admission:**
  In this tree, **Full Kelly (Growth)** and **Full Kelly (Log-Utility)** occupy the exact same leaf (Leaf 2: Terminal/Time/Known/Hard).

  **Why they are glued:**
  In the standard setup (iid repeated bets, known edge, no consumption), maximizing the expected logarithm of wealth (Log-Utility) and maximizing the time-average geometric growth rate (Ergodicity) are mathematically isomorphic. They output the exact same fraction $f^*$. Your tree cannot separate them here because the *decision* is identical.

  **What would prise them apart:**
  1.  **The Single-Shot Case:** If you offer the bet *once*.
      *   *Log-Utility:* Still bets Kelly fraction (maximizes $E[\log(W_1)]$).
      *   *Growth-Rate:* Says "Growth rate is undefined for $N=1$." The argument collapses.
  2.  **Non-Ergodic Environments:** If the bet has path-dependent rules that break the iid assumption (e.g., changing odds based on past wealth).
      *   *Log-Utility:* Still maximizes expected utility of the path.
      *   *Growth-Rate:* Might suggest a different fraction to survive the specific path structure.
  3.  **Consumption (Leaf 6):**
      *   *Log-Utility:* Optimizes utility of *consumption stream* (Merton Problem). Fraction depends on investment horizon vs. life horizon.
      *   *Growth-Rate:* Optimizes *wealth* growth. If you withdraw, wealth growth is negative. A pure growth maximizer might object to the premise of withdrawal entirely.

  **Verdict:** For your group's "repeated gamble" premise, they are indistinguishable. You must argue about *axioms* (Do you value money logarithmically? OR Do you care about time averages?), not *fractions*.

