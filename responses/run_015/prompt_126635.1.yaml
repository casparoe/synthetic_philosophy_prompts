answer: |-
  ## PART 1: THE LOGICAL SPACE

  Here are the four branch questions. They are designed to be answered by looking at the *structure of the bet and the bettor*, not by asking for their ideology.

  **Q1. Horizon & Liquidity:**
  Is the bankroll locked for a specific terminal goal (e.g., house deposit in 30 rounds, buying a hospital after 100 rounds), OR is it a perpetual engine where you withdraw profits for living expenses forever?
  *   **Left:** Terminal (Lump Sum)
  *   **Right:** Perpetual (Consumption Flow)

  **Q2. Aggregation (The 10,000 Bettors Test):**
  If 10,000 identical copies of you take this bet, is success defined by the *sum total* of their wealth (buying the biggest hospital possible), OR by the *median* copy's outcome (ensuring *you* specifically don't go broke)?
  *   **Left:** Ensemble (Sum Total)
  *   **Right:** Time (Single Trajectory)

  **Q3. Edge Certainty:**
  Is the probability of winning known physically (e.g., a biased coin you can measure perfectly), OR is it estimated from limited data (e.g., 40 historical trades where the edge might be noise)?
  *   **Left:** Known (Physical)
  *   **Right:** Estimated (Statistical)

  **Q4. Ruin & Drawdown:**
  If your bankroll drops 90%, are you forced out of the game permanently (Hard Ruin), OR do you survive but miss a benchmark/suffer utility pain (Soft Constraint/Benchmark)?
  *   **Left:** Hard (Ruin = End)
  *   **Right:** Soft (Ruin = Pain)

  ***

  ## PART 2: THE COMBINATIONS (16 PATHS)

  Below are the 16 possible answer combinations (Left=0, Right=1). I have mapped your required positions to the leaves. Empty slots are marked with their status.

  | Path | Q1 | Q2 | Q3 | Q4 | Position / Leaf Name | Status of Empty Slots |
  | :--- | :- | :- | :- | :- | :--- | :--- |
  | **0000** | Term | Ens | Known | Hard | **Bet-Max (Ensemble EV)** | |
  | **0001** | Term | Ens | Known | Soft | *Empty* | **Incoherent:** If you care about ensemble sum, individual drawdown pain is irrelevant. |
  | **0010** | Term | Ens | Est | Hard | *Empty* | **Unattractive:** Why aggregate noise? EV maximizers usually trust their model or don't bet. |
  | **0011** | Term | Ens | Est | Soft | *Empty* | **Unexplored:** Ensemble + Uncertainty + Soft constraints is a muddy middle no one claims. |
  | **0100** | Term | Time | Known | Hard | **Full Kelly (Growth & Log-Utility)** | **GLUED LEAF** (See Part 4) |
  | **0101** | Term | Time | Known | Soft | *Empty* | **Incoherent:** If horizon is terminal & hard, "soft" ruin doesn't apply. |
  | **0110** | Term | Time | Est | Hard | **Fractional Kelly (Model Uncertainty)** | |
  | **0111** | Term | Time | Est | Soft | **Refuse-to-Bet (Ambiguity Aversion)** | |
  | **1000** | Perp | Ens | Known | Hard | *Empty* | **Incoherent:** Perpetual consumption contradicts "Hard Ruin" (you never stop). |
  | **1001** | Perp | Ens | Known | Soft | *Empty* | **Unattractive:** Perpetual ensemble maximization is just infinite EV; no one lives there. |
  | **1010** | Perp | Ens | Est | Hard | *Empty* | **Incoherent:** See 1000. |
  | **1011** | Perp | Ens | Est | Soft | *Empty* | **Unexplored:** Social welfare functions over infinite time are theoretical only. |
  | **1100** | Perp | Time | Known | Hard | **Full Kelly (Survival)** | |
  | **1101** | Perp | Time | Known | Soft | **Fractional Kelly (Consumption Smoothing)** | |
  | **1110** | Perp | Time | Est | Hard | **Fractional Kelly (Model + Ruin)** | |
  | **1111** | Perp | Time | Est | Soft | **Relative/Benchmark (Beat the Peer)** | |

  ***

  ## PART 3: THE DECISION TREE

  ```text
