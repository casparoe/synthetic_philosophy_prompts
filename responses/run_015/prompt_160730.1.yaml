  # Project Title: Which Simpson's Paradox Person Are You?

  **Instructions:** Read the 10 scenarios below. For each one, pick the answer that feels most like what you would actually do if you had to present the findings to a boss, a doctor, or a coach. There are no "right" answers, only different ways of looking at data.

  ---

  ### The Quiz

  **1. The Kidney Stone Trial (Medical)**
  You are reviewing a study for a new kidney stone treatment.
  *   **Overall:** Patients taking the new treatment had a lower recovery rate than those taking the old standard.
  *   **Split by Stone Size:** For small stones, the new treatment recovered *more* people. For large stones, the new treatment recovered *more* people.
  *   **The Catch:** Doctors gave the new treatment mostly to patients with large stones (which are harder to cure).
  **What do you report?**
  A. The new treatment is worse; look at the bottom-line recovery rate.
  B. The new treatment is better; it wins in every specific category.
  C. It depends on the patient. If we know the stone size, use the split data. If we don't, use the overall rate.

  **2. The Grad School Admissions (Bias)**
  You are investigating gender bias in university admissions.
  *   **Overall:** Men are accepted at a significantly higher rate than women.
  *   **Split by Department:** In Engineering, Humanities, and Sciences, women are accepted at equal or higher rates than men.
  *   **The Catch:** Women applied mostly to competitive departments with low acceptance rates for everyone.
  **What do you conclude?**
  A. There is bias against women; the overall acceptance gap is real.
  B. There is no bias; the department-level data clears the university.
  C. The overall number is misleading, but we need to ask why women applied to harder departments.

  **3. The Baseball Batting Averages (Sports)**
  You are a manager choosing a batter for next season.
  *   **Overall:** Player A has a higher batting average than Player B over the last two years combined.
  *   **Split by Season:** Player B had a higher average than Player A in Year 1. Player B also had a higher average than Player A in Year 2.
  *   **The Catch:** Player A had very few at-bats in the year they did poorly, and many at-bats in the year they did well.
  **What do you decide?**
  A. Pick Player A; the combined average predicts total hits best.
  B. Pick Player B; they performed better in every distinct season.
  C. Don't decide yet. We need to know if next season looks like Year 1 or Year 2.

  **4. The Blood Pressure Pill (The "Middle Step")**
  You are testing a drug meant to prevent strokes.
  *   **Overall:** People on the drug have fewer strokes.
  *   **Split by Blood Pressure:** Among people with High BP, the drug looks useless. Among people with Low BP, the drug looks useless.
  *   **The Catch:** The drug works by lowering Blood Pressure. Splitting by BP removes the people whose blood pressure improved.
  **What do you say?**
  A. The drug works; the overall stroke reduction is what matters.
  B. The drug doesn't work; it fails in every blood pressure group.
  C. Stop splitting by Blood Pressure. That's how the drug works, not a pre-existing group.

  **5. The Scholarship Survivors (The "Double Cause")**
  You are looking at what makes students successful.
  *   **Overall:** Students who study more tend to get higher grades.
  *   **Split by Scholarship Winners:** Among students who *won* a merit scholarship, those who studied *less* got higher grades.
  *   **The Catch:** You only win the scholarship if you have High Grades OR High Natural Talent.
  **What do you tell parents?**
  A. Studying hurts your grades; look at the scholarship winners.
  B. Studying helps; ignore the scholarship split.
  C. This split is fake. Being a "winner" is caused by both studying and talent, which twists the data.

  **6. The Marketing Campaign (Decision Context)**
  You are running an ad campaign.
  *   **Overall:** Email A gets more clicks than Email B.
  *   **Split by Customer Type:** Email B gets more clicks from New Customers. Email B gets more clicks from Returning Customers.
  *   **The Catch:** You can't tell if a customer is New or Returning until *after* they click the link.
  **What do you send?**
  A. Send Email A to everyone; it wins on the total count.
  B. Send Email B to everyone; it wins in every subgroup.
  C. Send Email A. Since we can't identify the subgroups beforehand, the overall average is the only one we can act on.

  **7. The Recovery Rates (Ratios vs. Differences)**
  You are comparing two hospitals.
  *   **Overall:** Hospital X has a higher *percentage* recovery rate (Ratio).
  *   **The Math:** Hospital Y actually saves more lives per 1,000 patients above the baseline (Difference).
  *   **The Catch:** Hospital X takes mostly easy cases, making their percentage look huge.
  **Which number goes in the report?**
  A. The Percentage. It's the standard way to compare success.
  B. The Difference. It shows the actual lives saved better.
  C. Neither. If the two math methods disagree, the data is too messy to trust.

  **8. The Birthday Slices (Arbitrary Groups)**
  You are analyzing sales data.
  *   **Overall:** Product Red sells better than Product Blue.
  *   **Split by Birthday Month:** For people born in Jan, Mar, May, Jul, Sep, Nov... Blue sells better. For Feb, Apr, Jun, Aug, Oct, Dec... Blue sells better.
  *   **The Catch:** You only noticed this pattern after slicing the data 12 different ways.
  **What do you do?**
  A. Blue is the winner; it wins in every month.
  B. Red is the winner; the monthly split is random noise.
  C. Throw out the monthly split. Slicing by birthday shouldn't matter for sales.

  **9. The Small Subgroup (Sample Size)**
  You are looking at a rare disease treatment.
  *   **Overall:** Treatment A looks safer.
  *   **Split by Age:** Treatment B looks safer for Kids and safer for Adults.
  *   **The Catch:** There were only 3 kids in the study. The "Kid" reversal is based on one person surviving.
  **What do you recommend?**
  A. Treatment B; it wins in the subgroups.
  B. Treatment A; the subgroups are too tiny to trust.
  C. We need more data. The paradox exists because the sample is too small.

  **10. The Future Prediction (Forecasting)**
  You are building an algorithm to predict loan defaults.
  *   **Overall:** Variable X predicts defaults well for the whole population.
  *   **Split by Region:** Variable X predicts poorly in the North and poorly in the South.
  *   **The Catch:** The mix of North/South applicants changes every year.
  **What goes into the algorithm?**
  A. Use Variable X. It predicts the total default rate best.
  B. Don't use Variable X. It fails in every specific region.
  C. Use Variable X, but update the weights every year as the regional mix shifts.

  ---

  ### Scoring Key

  Count how many times you selected **A**, **B**, or **C**.
  *Note: This quiz is designed to reveal your statistical philosophy, not your math skills.*

  **Mostly A: The Aggregator**
  *   **Philosophy:** "Report the combined/marginal numbers."
  *   **Why:** You believe the bottom line is what actually happens in the real world. Subgroups can be misleading, small, or impossible to identify before making a decision. You prioritize the outcome that affects the total population.
  *   **Risk:** You might miss real bias or specific harms hidden in the average.

  **Mostly B: The Stratifier**
  *   **Philosophy:** "Split by every variable you measured."
  *   **Why:** You believe averages lie. If a trend holds true in every subgroup, that is the "real" truth. You distrust aggregated data because it hides heterogeneity.
  *   **Risk:** You might split on variables that are caused by the treatment (like Blood Pressure in Q4) or random noise (like Birthdays in Q8), creating false conclusions.

  **Mostly C: The Nuance Navigator**
  *   **Philosophy:** "It depends on the context/cause/decision."
  *   **Why:** You don't have a single rule. You look at *why* the data is split. You adjust for common causes, ignore mediators, and consider whether you can actually identify the subgroups before acting.
  *   **Risk:** Analysis paralysis. It requires deep knowledge of the subject matter, not just the numbers.

  *(If you have a mix, read the "Leaves" below to see which specific stance matches your answers on key questions.)*

  ---

  ### The Leaves (Detailed Profiles)

  *Match your answers to the specific questions below to find your specific "Leaf."*

  1.  **The Aggregator** (Mostly Q1-A, Q2-A, Q6-A)
      *   **Stance:** Report the combined/marginal numbers as they are.
      *   **Belief:** The aggregate is the only thing that matters for policy.

  2.  **The Stratifier** (Mostly Q1-B, Q2-B, Q8-A)
      *   **Stance:** Split by every variable you measured.
      *   **Belief:** Disaggregated data is always more truthful than aggregated data.

  3.  **The Causal Detective** (Mostly Q4-A, Q5-C, Q8-C)
      *   **Stance:** Only adjust for genuine common causes.
      *   **Belief:** Don't split on things caused by the treatment (mediators) or things caused by the outcome (colliders).

  4.  **The Contextualist** (Mostly Q3-C, Q10-C)
      *   **Stance:** There is no single "the effect," only effects in specific contexts.
      *   **Belief:** Truth changes depending on the environment (season, region, mix).

  5.  **The Decision-Maker** (Mostly Q1-C, Q6-C)
      *   **Stance:** It depends on what decision the number is for.
      *   **Belief:** If you can't identify the subgroup before acting, use the average. If you can, use the split.

  6.  **The Scale Skeptic** (Mostly Q7-B or Q7-C)
      *   **Stance:** The reversal is just an artifact of using ratios.
      *   **Belief:** Percentages lie; absolute differences or baselines tell the truth.

  7.  **The Sample Sentinel** *(New)* (Mostly Q9-B)
      *   **Stance:** Trust splits only if subgroups are large enough.
      *   **Belief:** Simpson's Paradox is often just small-sample noise in disguise.

  8.  **The Forecaster** *(New)* (Mostly Q3-A, Q10-A)
      *   **Stance:** Optimize for prediction accuracy over causal truth.
      *   **Belief:** It doesn't matter *why* the paradox happens, only which number predicts the future best.

  ---

  ### Analysis of the Quiz (For the Teacher)

  **1. Indistinguishable Pairs**
  This quiz cannot reliably separate **The Causal Detective** from **The Decision-Maker**.
  *   *Why:* In many scenarios (like Q4 and Q6), both profiles will choose the "C" option. The Detective rejects the split because it's causally wrong; the Decision-Maker rejects it because it's not actionable. Their answers look identical even if their reasoning differs.

  **2. Impossible Combinations**
  It is logically inconsistent to be **The Stratifier** and **The Sample Sentinel**.
  *   *Why:* The Stratifier believes you should split by every variable measured (Q8-A). The Sample Sentinel believes you should ignore splits if the subgroups are tiny (Q9-B). You cannot believe "always split" and "don't split if small" at the same time. If a student scores high in both, they likely guessed.

  **3. The "Sorting" Question**
  **Question 4 (The Blood Pressure Pill)** does the most work in sorting students.
  *   *Why:* This is the only question where the "Split" answer (Option B) is definitively wrong from a causal perspective, but looks mathematically correct. Aggregators pick A. Stratifiers pick B. Causal/Contextual thinkers pick C or A. It forces students to decide if they care about *mechanism* or just *counts*.

  **4. Missing Nuance**
  This quiz assumes students understand the text scenarios perfectly. In reality, a student might pick "C" on Question 5 just because it sounds sophisticated, not because they understand collider bias. A follow-up interview would be needed to confirm their reasoning.

  ---

  ### Tips for Presentation
  *   **Don't give the answers away:** When presenting this to the class, don't reveal which answer is "statistically correct" until after they've voted.
  *   **Focus on Q4:** Spend the most time explaining Question 4. It's the clearest example of why "controlling for a variable" can actually break your analysis.
  *   **Use the Leaves:** Hand out the "Leaves" section as a handout at the end so people can take home their specific statistical personality type.
