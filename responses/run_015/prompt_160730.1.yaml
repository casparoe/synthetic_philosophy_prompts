prompt: |-
  hey, im a junior and for my stats final project im doing this thing on Simpson's paradox, and instead of another slideshow i want to build an actual quiz for my class, working title something like "which Simpson's paradox person are you". Can you write it for me?

  The idea: 8 to 10 questions, and every question is a concrete case where the trend in the combined data goes one way and the trend inside the subgroups goes the other way. Each question has three answer options that a normal person could plausibly pick — like "go with the combined numbers", "go with the split numbers", or "depends on X" where they have to say what X is. The whole point is that it sorts people by what they actually think about the cases, not by which label they like, so no question should name a position or anything like "do you trust aggregated data?". Also every option should sound reasonable — i dont want one obviously-right answer per question or my class will just guess the pattern.

  Cases that definately have to be in there somewhere: a medical treatment that looks worse overall but better in every subgroup; admissions rates for a university when you break them down by department; batting averages across two seasons; one where the thing you'd split by is itself caused by the thing being tested (so splitting "controls away" the effect your looking for); one where the thing you'd split by is caused by both the exposure and the outcome; one where you do or don't know which subgroup the next person falls into before you have to act; one where the reversal goes away if you compare using differences instead of ratios; and one where the subgroups are basically arbitrary slices somebody picked after seeing the data.

  Leaves I want in the scoring key: report the combined/marginal numbers as they are; split by every variable you measured; only adjust for genuine common causes; there is no single "the effect", only effects in specific contexts; it depends on what decision the number is for; and the reversal is just an artifact of using ratios. Add up to two more if you think Im missing something obvious. Name each leaf whatever people actually call it, or say "unnamed" if it's a stance nobody's bothered to name.

  Then: a scoring key mapping answer patterns to leaves, at least two pairs of leaves your quiz honestly can't separate (flag them, dont paper over it), the combos of answers nobody actually holds and why (self-contradictory? just unattractive? nobody got around to it?), and a couple sentences on which question does most of the sorting work. Keep the wording at a level my classmates will get — no greek letters and no formulas if you can avoid it.
