  Here is a complete draft for your project. It includes the quiz, the scoring key, the profile descriptions ("leaves"), and the analysis of the quiz's limitations.

  I have kept the language accessible for a junior stats class (no Greek letters, no causal diagrams) while ensuring the logic holds up for a final project.

