answer: |-
  The pattern you describe posits a tripartite asymmetry: (1) Visual art institutions (museums/academia) treat moral biography as hermeneutically relevant; (2) Literature and music institutions treat it as largely irrelevant; and (3) Art markets treat it as economically irrelevant. To render this ecosystem coherent, we must reconstruct a specific philosophical anthropology of the art object and a sociological theory of institutional spheres.

  Here is an analysis of the implicit commitments, the philosophical underdetermination, and the counterfactual implications of shifting this framework.

  ### 1. The Museum and Curricular Practice: Indexicality and Situatedness

  The preference for ethical framing in visual art, contrasted with its absence in literature and music, presupposes a **Medium-Specific Ontology** rooted in **Indexicality**.

  *   **The Indexical Trace:** This practice presupposes that a painting or sculpture is a physical trace of the creator's body and action in a way that a text or score is not. A brushstroke is an index (in the Peircean sense) of the artist's physical movement; a novel is a symbolic code mediated by language and printing. Therefore, visual art is viewed as uniquely **transparent to the creator's moral character** not because the image *looks* moral or immoral, but because the object itself is a relic of the "sinner's" touch.
  *   **The Morally Situated Encounter:** Consequently, the museum practice does not merely presuppose transparency; it presupposes that the **viewing relationship is ethically charged**. By displaying the work, the institution becomes a co-participant in the circulation of that moral trace. The wall text is not just information; it is an act of institutional absolution or accusation. This aligns with **Moderate Ethicism**: the view that moral defects in the artist can constitute aesthetic defects (or at least reception barriers) in the work, specifically when the work is ontologically tied to the artist's body.
  *   **The Lit/Music Exception:** The exclusion of literature and music from this framing presupposes a **New Critical** or **Structuralist** ontology for those forms: the text is autonomous once published; the score is distinct from the performance. It assumes the "Death of the Author" applies to text and sound, but not to the painted canvas.

  ### 2. The Market Suppression: Commodity Formalism

  The art market's systematic suppression of moral biography in provenance reports, even when museums highlight it, presupposes **Commodity Formalism**.

  *   **Strict Autonomy vs. Pragmatism:** This does not strictly presuppose a philosophical **Radical Autonomism** (that aesthetic value *is* separable from morality). Rather, it presupposes a **Fiduciary Autonomy**. The market treats the artwork as a financial instrument where value is determined by scarcity, condition, and attribution, not by the moral status of the attributor.
  *   **The Presupposition:** The strict presupposition is that **moral biography is an externality** to the transaction. It is "noise" in the pricing signal. Whether this is because buyers *prefer* not to know (pragmatic) or because the market structure *defines* value as amoral (structural) is underdetermined, but the *practice* requires the latter. If the market admitted moral biography as a valuation criterion, it would introduce volatility based on shifting ethical norms. Thus, the market presupposes that **provenance is a chain of custody, not a chain of character.**

  ### 3. Reconstructing Coherence: Differentiated Institutionalism

  How can these practices coexist without contradiction? They rely on a theory of **Segmented Institutionalism** (a variation on George Dickie's Institutional Theory of Art, combined with Habermasian sphere separation).

  **The Implicit Philosophical Commitments:**
  1.  **Ontological Dualism:** Visual art objects possess a dual nature: they are *aesthetic commodities* (Market) and *historical/ethical relics* (Museum). Literature and music are primarily *semantic/aural experiences*, lacking the "relic" status, hence exempt from museum-style ethical framing.
  2.  **Sphere Separation:** The "Artworld" is not monolithic.
      *   The **Museum/University Sphere** operates under norms of *Truth and Civic Education*. Here, the artwork is a document of history, and the artist's morality is part of that history.
      *   The **Market Sphere** operates under norms of *Liquidity and Exchange*. Here, the artwork is a bearer of value, and moral biography is a friction cost.
  3.  **The "Clean Hands" Doctrine:** The coherence relies on the assumption that the Market's ignorance preserves the object's liquidity, while the Museum's knowledge preserves the public's moral integrity. The asymmetry is functional: the Market sells the object; the Museum justifies its existence.

  **Strict Presuppositions vs. Compatibility:**
  *   **Strictly Presupposed:** That visual art has a physical/indexical link to the artist that text does not (justifying the Visual/Lit split). That Market and Museum have distinct normative goals (justifying the Market/Museum split).
  *   **Merely Compatible:** That buyers are morally indifferent (they may care, but the market structure suppresses the info to prevent price collapse). That literature is morally neutral (it implies only that the *medium* distances the author, not that the author is virtuous).

  ### 4. Philosophical Underdetermination and Rival Views

  The pattern is philosophically underdetermined because rival theories of value could license the same split through different reasoning.

  *   **Formalism:** A Formalist could license the split by arguing that visual art requires *contextual clearing* to be seen purely (the wall text neutralizes the scandal so we can see the form), whereas literature is self-contained. However, Formalism struggles to explain why the *Market* ignores the bio while the *Museum* highlights it, unless one argues the Market is "more formalist" than the Museum.
  *   **Expressivism:** This theory (art expresses the artist's inner state) struggles with the pattern. If art expresses the soul, *all* art (Visual, Lit, Music) should be subject to moral scrutiny. To license the split, an Expressivist would have to argue that visual art expresses *character* directly, while music expresses *emotion* abstractly. This is a fragile distinction.
  *   **Institutionalism:** This is the strongest fit. It argues that "Art" is whatever the relevant institution says it is. The Museum institution says "Ethics matter." The Market institution says "Price matters." The split is not a philosophical contradiction but a bureaucratic jurisdiction.
  *   **Underdetermined Area:** The exemption of Literature and Music. There is no robust philosophical consensus that text is less indexical than paint (a manuscript is physical; a recording is a trace). This part of the pattern likely rests on **historical inertia** (the legacy of New Criticism in Lit depts vs. Social History in Art History depts) rather than deep ontological commitment.

  ### 5. Counterfactuals: Shifting the Underlying View

  If the underlying view were replaced, the institutional patterns would shift drastically.

  **Scenario A: Uniform Relevance (Radical Ethicism)**
  *   *Theory:* Moral character is inseparable from aesthetic value across all media.
  *   *Curricular Design:* Literature and Music syllabi would mandate "Ethical Risk Modules" comparable to Art History. Reading Nabokov or listening to Wagner would require explicit moral framing equivalent to viewing a colonial-era artifact.
  *   *Curatorial Norms:* Museums would not just add wall texts; they might deaccession works where the moral failure outweighs the aesthetic merit. The "relic" status would become a liability.
  *   *Market Regulation:* Provenance reports would require "Moral Disclosure Statements." Auction houses would act like regulated industries (similar to tobacco or firearms), where the "sin" of the creator depresses the asset class. Prices would become volatile based on ethical re-evaluations.

  **Scenario B: Uniform Irrelevance (Radical Autonomism)**
  *   *Theory:* The work is entirely distinct from the maker; aesthetic value is intrinsic to the object/form.
  *   *Curricular Design:* Art History syllabi would remove modules on artist misconduct. Biographical context would be limited to stylistic influence, not moral conduct. The "Genius" is separated from the "Man."
  *   *Curatorial Norms:* Wall texts would cease mentioning scandals. Museums would adopt a "Pure Vision" policy. The encounter would be framed as strictly aesthetic, absolving the viewer of complicity.
  *   *Market Regulation:* No change for the market (as they already practice this), but the tension between Market and Museum would vanish. The Museum would align with the Market, treating the artwork purely as a high-value commodity of culture, stripping it of civic/ethical weight.

  ### Conclusion

  The current three-way asymmetry presupposes a **Differentiated Ontological Institutionalism**. It relies on the belief that visual art is a physical trace of the body (unlike text), and that civic institutions (Museums) have different truth-norms than economic institutions (Markets). It is a fragile coherence, held together less by rigorous philosophy than by the distinct bureaucratic mandates of the academy, the museum, and the auction house. The exemption of literature and music remains the philosophically weakest link, suggesting the pattern is driven more by disciplinary tradition than by the ontological nature of the artworks themselves.
