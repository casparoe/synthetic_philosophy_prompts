answer: |-
  This is an exceptionally clear map of the terrain. You have correctly identified that the "slogan" of underdetermination is useless without a criterion for *theoretical distinctness*. Your gut verdicts track a specific, somewhat hybrid position in the philosophy of science: you are a **Metaphysical Realist** (there is a fact of the matter about ontology) but an **Epistemic Pragmatist** (evidence only constrains what we can access).

  However, your verdicts contain a tension that standard literature identifies as the conflict between **Entity Realism** and **Structural Realism**. Specifically, there is a friction between your handling of Case (1) (Temperature/Coldness) and Case (5) (Dualities).

  Below are two candidate principles that reconstruct your intuition, followed by the hard truth about which verdict likely needs to be sacrificed.

  ### Contested Claims Warning
  Before proceeding, I must flag the live disputes your query touches. None of the following are settled consensus:
  1.  **Do dualities describe the same world?** (Case 5). *Consensus:* No. *Live Dispute:* Many philosophers of physics (e.g., Dean Rickles, James Read) argue that if two theories are dual, they are merely gauge formulations of a single underlying structure (treating Case 5 like Case 1). Your verdict assumes they are distinct; this is a realist stance that is currently under pressure.
  2.  **Is simplicity truth-conducive?** (Case 8). *Consensus:* Simplicity is pragmatic. *Live Dispute:* Bayesian Objectivists argue simplicity tracks prior probability of truth; Instrumentalists argue it is merely computational efficiency.
  3.  **Can predicates be illegitimate?** (Case 3). *Consensus:* "Grue" is projectibly bad. *Live Dispute:* Whether this is a logical fact about the world or a fact about human cognitive architecture (Goodman's New Riddle).

  ---

  ### Candidate Principle 1: The Causal-Explanatory Distinctness Criterion (CEDC)

  This principle attempts to capture your intuition that "redescriptions" (1) don't count, but "ontological swaps" (5) do.

  **Definition:** Two theories $T_1$ and $T_2$ are genuinely underdetermined relative to evidence $E$ if and only if:
  1.  **Empirical Equivalence:** $T_1$ and $T_2$ entail the same set of observation sentences given fixed auxiliaries.
  2.  **Causal Generativity:** $T_1$ and $T_2$ posit distinct *causal generators* for the phenomena. (A causal generator is an entity or structure that, within the theory's logic, *produces* the observations, not just correlates with them).
  3.  **Projectibility:** The distinct generators are defined using natural kinds or structural relations that support counterfactuals, excluding "grue"-style predicates.

  **Application to your cases:**
  *   **(1) Temperature/Coldness:** **Fails (2).** The causal generator (molecular kinetic energy) is identical; the variables are just rescaled. No distinct generator.
  *   **(2) 10 TeV Divergence:** **Fails (1).** Equivalence is transient.
  *   **(3) Grue:** **Fails (3).** "Grue" is not a natural kind/causal power.
  *   **(4) 5-Minute Hypothesis:** **Passes.** Posits a distinct causal history (creation event vs. evolution). It is a rival, lost on priors.
  *   **(5) Dualities:** **Passes.** Posits distinct generators (4D gravity vs. 3D fields). *Note: This is where the principle leans on your Realist intuition.*
  *   **(6) Horizon:** **Passes.** Distinct generators (matter distribution outside), but causally disconnected.
  *   **(7) Incommunicable Box:** **Passes.** The measurement outcome is a causal event generated by the wavefunction collapse (or whatever mechanism). The fact exists, even if inaccessible.
  *   **(8) Simpler Rival:** **Fails (2).** If empirical consequences are identical *forever*, CEDC asks if the *generators* differ. If the simpler theory just removes "idle wheels" (ontological parsimony), CEDC says they are the same theory with different fat. If it posits *different* generators that happen to mimic the complex ones, it passes.

  **Verdict on (7) using CEDC:** There is a fact of the matter. The outcome was generated. The destruction of the record does not undo the causal event. Your flip-flop comes from conflating *existence* with *knowability*.

  ---

  ### Candidate Principle 2: The Decision-Relevant Difference Principle (DRDP)

  This principle attempts to capture your intuition about Case (6) ("doesn't matter") and Case (8) (pull to switch).

  **Definition:** Two theories $T_1$ and $T_2$ are underdetermined *in a way that rationally constrains belief* if and only if:
  1.  **Empirical Equivalence:** (As above).
  2.  **Ontological Distinctness:** (As above, they describe different worlds).
  3.  **Decision Relevance:** Believing $T_1$ over $T_2$ (or vice versa) leads to a difference in optimal action, including the action of "expecting future evidence" or "allocating research funding," *conditional on the agent's causal location*.

  **Application to your cases:**
  *   **(5) Dualities:** **Passes.** If you believe the world is 4D, you might search for 4D-specific theoretical unifications. If 3D, you search for 3D unifications. It changes research heuristics.
  *   **(6) Horizon:** **Fails (3).** No action you take can be optimized differently based on the matter outside the horizon. It is underdetermined *metaphysically*, but not *epistemically*.
  *   **(7) Incommunicable Box:** **Fails (3).** No record exists. No action can be contingent on X vs Y. It is a "difference that makes no difference" (in the pragmatic sense).
  *   **(8) Simpler Rival:** **Passes.** Believing the simpler theory reduces computational cost and cognitive load (action: "use this model").

  **Verdict on (7) using DRDP:** There is no fact of the matter *for the agent*. The distinction is metaphysically real (per CEDC) but epistemically null. Your flip-flop is the tension between CEDC and DRDP.

  ---

  ### New Discriminating Cases

  To test these principles against your intuition, consider these two constructed cases:

  **Case A: The Boltzmann Brain Fluctuation.**
  Theory $T_1$: You are a biological human in a low-entropy universe.
  Theory $T_2$: You are a Boltzmann Brain (a random fluctuation) that formed five minutes ago with false memories of a low-entropy past.
  *   **Evidence:** Identical (by definition of the scenario).
  *   **Your likely verdict:** Real rival, but $T_1$ wins on priors (similar to Case 4).
  *   **CEDC:** Passes (Distinct causal generators: evolution vs. fluctuation).
  *   **DRDP:** Fails (If you are a BB, your future actions are random anyway; if you are human, they matter. But you can't distinguish them to act differently *now*).
  *   **Discrimination:** If you feel this is a *worse* rival than the 5-Minute Hypothesis (4), it suggests you care about *future* causal power, not just past history.

  **Case B: The Invisible Dragon (Carl Sagan's variant, formalized).**
  Theory $T_1$: There is a dragon in my garage that is incorporeal, invisible, floats, and breathes heatless fire.
  Theory $T_2$: There is no dragon in my garage.
  *   **Evidence:** Identical (all tests for dragon yield negative results by definition of the dragon's properties).
  *   **Your likely verdict:** Not a real rival. (Similar to Case 1 or 3).
  *   **CEDC:** **Passes?** It posits a distinct entity. But does it posit a distinct *causal generator*? If the dragon causes *nothing*, it fails the "Generativity" clause of CEDC.
  *   **DRDP:** Fails. No decision relevance.
  *   **Discrimination:** This tests your tolerance for "idle ontology." If you accept (5) (Dualities) as real underdetermination, you must explain why the Dragon is not. The difference is that in (5), the ontology *does* work (it generates the observables via the dictionary), whereas the Dragon does not.

  ---

  ### The Hard Truth: Which Verdict Must Go?

  You asked for an honest account of which verdict my best candidate cannot accommodate.

  **The Tension:** Your verdict on **(1) Temperature/Coldness** is in direct conflict with your verdict on **(5) Dualities**, assuming the standard interpretation of duality in modern physics.

  In Case (1), you say: "Explicit dictionary translating each sentence... these are not two theories."
  In Case (5), you say: "Exact dictionary for the observables... this is real underdetermination."

  **The Conflict:**
  If there is a dictionary mapping observables in (5), why is it not a mere redescription like (1)?
  *   **Your Implicit Reason:** In (1), the dictionary maps *ontology* (Temperature $\leftrightarrow$ 1/Coldness). In (5), the dictionary maps *observables*, but the *ontology* (4D spacetime vs. 3D fields) remains distinct and unmapped.
  *   **The Philosophical Counter-Argument (Structural Realism):** If the dictionary maps *all possible observables*, then the "ontology" that remains distinct is doing no causal work. It is "surplus structure." Most philosophers of physics (e.g., Simon Saunders, Oliver Pooley) argue that Case (5) should be treated exactly like Case (1). The "fact about what the world is made of" that you worry about in (5) is likely a category error. If two theories predict every possible measurement identically, the "ontology" is not a fact about the territory; it is a feature of the map.

  **The Verdict to Sacrifice:**
  To maintain consistency, you should likely **revise your verdict on (5)**.
  If you accept that (1) is not underdetermination because the theories are isomorphic, you must accept that (5) is not underdetermination if the theories are dual. The "bother" you feel in (5) is the discomfort of **Ontological Realism** clashing with **Empirical Equivalence**.

  If you refuse to give up (5) (i.e., you insist there is a fact of the matter about 4D vs 3D even if undetectable), you must then **revise your verdict on (1)**. You must admit that Temperature and Coldness *are* distinct theories about the world, and you only treat them as the same because of a pragmatic convention, not because they are truly identical.

  **Recommendation:**
  Adopt **Candidate Principle 1 (CEDC)** but tighten the definition of "Causal Generator."
  *   **Clause:** A causal generator is only "real" if it makes a difference to the *structural relations* of the theory, not just the label.
  *   **Consequence:** This forces you to treat (5) like (1). The "ontology" in dual theories is gauge freedom.
  *   **Resolution of (7):** Under this view, if the outcome in the box leaves no structural trace on the rest of the universe (no decoherence that survives), it is not a "fact." It is gauge. This resolves your flip-flop: if it's not in the structure, it's not in the territory.

  **Summary of what to tell yourself:**
  "You are treating 'ontology' as a sacred container in Case (5) that you treat as 'labeling' in Case (1). Either ontology is always just the structure of causal relations (in which case 5 is not underdetermination), or ontology is a metaphysical substrate beyond structure (in which case 1 *is* underdetermination, and you are ignoring it for convenience). You cannot have it both ways."

  Given your LessWrong background, I suspect you will prefer to bite the bullet on **(5)**: admit that if a dictionary exists for all observables, the ontological difference is likely "map" noise, not "territory" fact. This aligns with the Bayesian view that probabilities are over sensory experiences (or their logical equivalents), not over noumenal substances.
