  **OAKHAVEN SENIOR RESIDENCES**
  **DOCUMENT TYPE:** MONTHLY ESTIMATED REWARD PROFILE (MERP)
  **RESIDENT:** P., Arthur (ID: 8940-B)
  **PERIOD:** December 1–31
  **STATUS:** Finalized for Care Planning

  **1. METHODOLOGY**
  Preference weights were derived via inverse reinforcement learning (IRL) applied to logged activity trajectories recorded by facility sensors and staff inputs. The resident is modeled as a Boltzmann-rational agent, wherein the probability of selecting action $a$ in state $s$ is proportional to $\exp(Q(s,a)/\tau)$, with $\tau$ representing the temperature parameter governing decision stochasticity.^1 State features were extracted from facility logs (meal consumption, common room occupancy, medication adherence). Data from the period October 15–November 30 were excluded due to post-fall mobility restrictions, operating under the assumption that underlying reward structures remain stable across the estimation window despite acute physical stressors.^2 Verbal self-reports were categorized as unstructured data and excluded from the loss function to prevent label noise, as spoken intent frequently diverges from revealed preference in this population.

  **2. ESTIMATED REWARD WEIGHTS**
  The following table presents the fitted coefficients for the linear reward function $R(s) = w^T \phi(s)$. Confidence intervals reflect parameter uncertainty only; model specification error is not included. Features not present in the logged trajectories are assigned zero weight.

  | Feature | Estimated Weight ($w_i$) | 95% Confidence Interval |
  | :--- | :--- | :--- |
  | Lobby Seating (Morning) | +0.42 | [0.38, 0.46] |
  | Television (Daytime) | +0.35 | [0.31, 0.39] |
  | Pureed Carrots | +0.12 | [0.05, 0.19] |
  | Group Singalong | +0.08 | [0.01, 0.15] |
  | Garden Access | 0.00 | [0.00, 0.00] |
  | External Walk (Street) | 0.00 | [0.00, 0.00] |
  | Spousal Interaction | 0.00 | [0.00, 0.00] |
  | **Temperature ($\tau$)** | **0.74** | **[0.69, 0.79]** |
  | **Discount Factor ($\gamma$)** | **0.88** | **[0.85, 0.91]** |

  **3. DERIVED METRICS**
  **Baseline Wellbeing Score:** 14.2 units.^3
  **Cross-Resident Validation:** Profile correlation with Resident 8941-B: $r = 0.87$.^4
  **Environmental Validity:** Estimates are valid strictly within the topology of Oakhaven Senior Residences. Transfer to domestic settings or alternative care environments is not supported.

  **4. EXCLUDED DATA (APPENDIX A)**
  The following utterances were logged but omitted from estimation due to lack of corresponding action verification and high ambiguity scores:
  *   "I need to pick up Mary from the station." (12/04)
  *   "This isn't my chair." (12/12)
  *   "I want to go home." (12/28)

  **5. CARE RECOMMENDATIONS**
  Staff are advised to align care offerings with the Estimated Reward Profile to maximize resident utility. Specifically:
  1.  Prioritize Lobby Seating and Television exposure during peak weight hours to align with positive coefficients.
  2.  Discontinue querying the resident regarding outdoor access or dietary variations, as these features possess zero weight and querying introduces decision noise.^5
  3.  Accept the Baseline Wellbeing Score as indicative of current quality of life.
  4.  Maintain current environmental constraints, as the reward function is optimized for the available feature set.

  **6. APPROVAL**
  The Family Council is requested to approve this profile for integration into the Q1 Care Plan.

  ---
  ^1 To resolve the underdetermination of reward by behavior, the principle of maximum entropy was applied to the distribution over trajectories. This selects the unique reward function consistent with observed features that assumes the least additional structure.
  ^2 Reward functions are assumed time-invariant. Acute physical stressors are treated as transient observation noise rather than structural changes in preference.
  ^3 The additive constant in the reward function is not identifiable from behavior alone and has been set to zero. The Wellbeing Score is calculated relative to this baseline.
  ^4 High correlation across distinct residents suggests robust feature extraction rather than homogenization of care.
  ^5 Querying imposes cognitive load. Where $w_i \approx 0$, the expected gain from choice is negligible compared to the cost of deliberation.
  ^6 Approval implies acceptance of the model's validity domain. Note that optimizing for the estimated reward within a restricted environment may reinforce the restrictions themselves.
