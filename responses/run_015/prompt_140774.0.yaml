answer: |-
  You have identified a genuine and profound structural problem. You are correct that it is not merely "bias" (which implies a statistical deviation from a norm) nor "Goodhart's Law" (which implies gaming a metric). You have put your finger on a meta-ethical difficulty regarding **ground truth**.

  Here are the answers to your three questions.

  ### 1. Does this have an established name?

  There is no single, canonical proper name for this specific configuration in the way "The Trolley Problem" or "The Gettier Problem" functions. However, it is recognized as a critical tension within two fields:

  *   **In Philosophy:** It is a modern, technological instantiation of the **Euthyphro Dilemma**. In Plato's dialogue, Socrates asks: "Is what is morally good commanded by the gods because it is morally good, or is it morally good because it is commanded by the gods?" In your examples, the "gods" are human judges. If the AI is good because it matches human judgment, it cannot exceed human judgment. If it exceeds human judgment, it will not match it, and thus will be judged "bad."
  *   **In AI Safety:** This is discussed under the umbrella of the **Alignment Problem**, specifically within **Value Learning** and **Reinforcement Learning from Human Feedback (RLHF)**. Researchers often refer to this as the **"Human Feedback Ceiling"** or the problem of **"Imitation Learning"** versus **"Inverse Reinforcement Learning."** The former copies behavior (and errors); the latter attempts to infer the underlying *intent* or *reward function*, but still relies on human data to do so.

  Since no single term captures the exact epistemic trap you described (that improvement and malfunction are indistinguishable without an external anchor), I will offer you a name as requested:

  **The Normative Closure Problem**

  **Definition:** *The structural inability of a system to demonstrate moral improvement over its evaluators when the evaluators' own judgments constitute the sole ground truth for correctness.*

  ### 2. Where are its edges?

  To separate this problem from nearby issues, we must look for the presence of an **External Normative Anchor**. The *Normative Closure Problem* exists only when the "score" of the system is determined entirely by the subjective intuition of the evaluator, with no recourse to an objective outcome or independent principle.

  **Cases Inside the Boundary (Instances of Normative Closure):**

  *   **The ICU Triage System (Your Example):**
      *   *Why:* The "correctness" of a triage decision is often only knowable in hindsight (did the patient survive?), but in the moment, it is judged by senior clinicians. If the AI overrides a clinician to save a patient the clinician would have let die, and the patient survives, the AI was right. But if the patient dies, the AI was negligent. Because we cannot know the outcome *before* the decision, we rely on clinician intuition as the proxy for truth. If the AI deviates from that intuition, it is treated as an error until proven otherwise, creating a high barrier to improvement.
  *   **LLM Moral Advice:**
      *   *Why:* When you ask for moral advice, there is no "weather" to check later. The validity of the advice is judged by your immediate resonance with it. If the advice challenges your fundamental framework, you lack the framework to recognize its validity. The evaluation is closed within your current epistemic state.
  *   **Autonomous Driving Ethics (The Survey):**
      *   *Why:* Programming a car to match survey results encodes *descriptive* ethics (what people say they do/want) rather than *prescriptive* ethics (what people ought to want). A car that sacrifices its passenger to save two pedestrians might be morally superior to one that saves the passenger, but if the survey says "save the passenger," the superior car fails the spec.

  **Cases Outside the Boundary (Where the Problem Does Not Apply):**

  *   **Weather Forecasting (Your Counter-Example):**
      *   *Why:* There is an **External Normative Anchor**: Reality. The weather does not care what the meteorologist thinks. If the model predicts rain and the meteorologist predicts sun, and it rains, the model is objectively right. The ground truth is independent of the evaluator.
  *   **Chess or Go AI:**
      *   *Why:* There is a **Formal Win Condition**. An AI can make a move that looks terrible to a Grandmaster (deviation) but leads to a win 50 moves later (external verification). The "truth" of the move is determined by the rules of the game and the final outcome, not the Grandmaster's intuition.
  *   **Procedural Compliance (e.g., Tax Law):**
      *   *Why:* The goal is not "moral correctness" but "adherence to code." If the AI finds a loophole that saves money but violates the *spirit* of the law, it has succeeded technically but failed morally. However, if the spec is "follow the text," then deviation is indeed error. This is not *Normative Closure* because the target is fixed text, not human intuition.

  **The Separating Principle:**
  The boundary is drawn by **Independence of Ground Truth**. If the correctness of the output can be verified by something other than the evaluator's immediate intuition (e.g., physical reality, formal rules, long-term outcomes), the problem does not arise. If the evaluator's intuition *is* the ground truth, the problem arises.

  ### 3. Does the literature have a recognised way out?

  Philosophers and AI safety researchers are aware of this trap. There are three primary strategies proposed to escape *Normative Closure*.

  **A. Idealized Reflective Equilibrium (The Philosophical Solution)**
  In moral philosophy (following John Rawls), we seek "reflective equilibrium" by going back and forth between our specific intuitions and our general principles. When they clash, we adjust *both*.
  *   *Application:* Instead of training the AI to match our *actual* judgments, we train it to match our *idealized* judgments. This involves asking humans not "What would you do?" but "What would you decide if you were calm, fully informed, and thinking consistently?"
  *   *Does it work?* It helps, but it still relies on humans to recognize the ideal. It pushes the ceiling higher but does not necessarily break it.

  **B. Coherent Extrapolated Volition (The AI Safety Solution)**
  Proposed by Eliezer Yudkowsky, this concept suggests we should not ask the AI to do what we *say* we want, but what we *would* want if we "knew more, thought faster, were more the people we wished we were."
  *   *Application:* The AI models the *trajectory* of human moral progress, not the current state. It attempts to predict where our moral intuitions are heading, not where they are.
  *   *Does it work?* It theoretically allows for improvement, but it is mathematically difficult to define "better" without smuggling in the current biases.

  **C. Reason-Based Evaluation (The Explainability Solution)**
  This addresses your suggestion of testing reasons rather than verdicts. Instead of asking "Is this decision right?", we ask "Is this *argument* sound?"
  *   *Application:* An AI might reach a conclusion that surprises us, but if it can generate a chain of reasoning that appeals to principles we already accept (e.g., "minimize suffering"), we may accept the verdict despite our intuition.
  *   *Does it work?* This is the most promising practical route. It shifts the ground truth from *verdicts* (which are closed) to *principles* (which can be examined). However, it requires the AI to be able to articulate moral reasoning better than humans, which returns us to the problem: how do we judge the quality of the reasoning if we are not moral experts?

  ### Summary
  You have correctly identified that without an **External Normative Anchor**, machine ethics risks becoming a mirror that magnifies our flaws while calling them features. The literature calls this the **Euthyphro Dilemma of Alignment**, but **"The Normative Closure Problem"** is a precise label for the structural trap you described. The only recognized way out is to stop treating human intuition as the *ground truth* and start treating it as *noisy data* to be corrected by principles, idealized reflection, or external outcomes where possible.
