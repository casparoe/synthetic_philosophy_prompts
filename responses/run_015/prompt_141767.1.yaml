answer: |-
  The river did not flow so much as it shuddered, constrained by the concrete jaws of the locks. Elias stood on the catwalk, the vibration traveling up through the soles of his boots. Below, the barges nudged one another, connected by the Iron Collar. It was a clumsy thing, a rusted ring forty inches in diameter, forged when the town was little more than mud and timber. Every warehouse door, every crane arm, every sluice gate for a hundred miles was cut to fit the Collar.

  Elias ran a gloved hand over the main tension cable. The steel was frayed, hairline fractures spiderwebbing beneath the grease. The Collar was too narrow for the modern loads. The barges sat low in the water, unstable. But to widen the Collar meant scraping the town down to the bedrock. It meant bankrupting the mills. It meant stopping the river.

  He turned away from the railing and walked toward the Bureau of Standards. The building was a relic of limestone, cool and silent. Inside, the air smelled of ozone and old paper. The Keeper waited for him in the back room, standing beside a machine that looked like a large camera obscura.

  "You understand the limit," the Keeper said. Her voice was flat, devoid of warning or hope. "One view. One outcome. No paths. No reasons."

  "I know," Elias said.

  He had petitioned for this access for ten years. The town lived under the shadow of the Collar as if it were a law of nature, like gravity or the flow of the tide. The elders said the Forty-Inch was chosen because it was the only way the founders could survive the first winter. They said any other width would have starved them. They said the river demanded this shape.

  Elias placed his hand on the brass plate. The machine hummed. The light in the room dimmed, and the glass screen above the table flared white.

  An image resolved. It was the town, seen from the same height as the catwalk outside. But the locks were wider. The barges were broader, sitting higher in the water. The warehouses were different, their doors stretched to accommodate the fifty-inch standard. The river moved smoother, less turbulent. There was no collapse. No starvation. The town existed, vibrant and dense, built around a different circle.

  Then the glass went dark.

  "That is all," the Keeper said. "It does not show how they got there. It does not show if they suffered more than us. It shows only that the ground could hold a different shape."

  Elias stepped back. The silence in the room was heavy. The image proved nothing about quality, only possibility. In that other running of the clock, the founders had picked a different ring from the bin. Perhaps they had flipped a coin. Perhaps the man who measured the first timber had sneezed. The image did not say. It only showed that the Forty-Inch was not written in the water.

  But it also did not show that the Fifty-Inch was better. It only showed it was *there*. The ruin of changing now was not in the image. The image did not show the cost of tearing down the warehouses Elias had just left. It did not show the months of silence while the cranes were recut. It did not show the families who would leave when the work stopped.

  He walked back to the river. The sun was setting, casting long shadows across the water. The barges knocked against the locks with a dull, metallic thud. *Thud. Thud. Thud.* The sound of the town breathing.

  He knew now that the necessity was a lie. The Collar was an accident hardened into stone. But knowing the accident did not remove the stone. The lock-in was real, even if the reason for it was not. The town was a body grown around a splinter; to remove the splinter now would cause bleeding. To leave it was to accept the infection.

  Elias climbed down to the control hub, a small concrete bunker embedded in the lock wall. Inside, the main drive shaft turned slowly, powered by the river's current. There was a manual override, a heavy lever encased in glass. It was designed for emergencies, to sever the connection between the upstream and downstream grids if the tension became critical.

  If he pulled it, the Collar system would disengage. The barges would drift. The power to the mills would cut. The town would stop.

  To restart it with the new standard, the wider collars had to be fitted manually to the main hub while the river was dammed. It would take weeks. If the dam held, the town would wake up to a new width. If the dam failed, the pressure would blow the locks out entirely. The water would take the lower streets. Elias would be in the bunker when it happened.

  He looked at the lever. The glass was cool under his palm.

  The archive had told him the past was not fate. It had told him the founders could have chosen differently. But it had not told him if *he* should choose differently now. The cost of the switch was not in the archive. The archive showed a destination, not the price of the ticket.

  He thought of the frayed cable upstairs. He thought of the image on the glass: the wider barges, the calm water. He thought of the silence that would follow the pull of the lever. The silence of no work. The silence of no power. The silence of a town holding its breath.

  If he did nothing, the cable would snap eventually. Maybe in a year. Maybe in ten. When it snapped, it would not be a controlled stop. It would be a whip-crack that would take out the catwalks, the locks, maybe the bunker. Chaos.

  If he pulled the lever, the ruin was certain, but controlled. The cost was known. The benefit was unknown. The archive proved the alternative was possible, not that it was safe.

  Elias took the hammer from his belt. He did not speak. There was no one to tell. To explain would be to ask for permission, and there was no one left who remembered how to give it.

  He struck the glass. It cracked, a sharp sound like ice breaking in spring. He reached in and gripped the lever. It was cold, stiff with decades of disuse. He put his weight against it. The mechanism groaned, the gears inside the wall engaging for the first time in a generation.

  Outside, the hum of the river changed pitch. The barges below shifted. The tension on the main cable tightened, then slackened.

  Elias pushed the lever all the way down. The connection severed. The vibration in the floor stopped. The silence rushed in, absolute and heavy. The river flowed on, but the machinery was still.

  He sat down on the metal grate floor. He had staked the town's economy on a photograph of a possibility. He had staked his life on the hope that the cost of building anew was less than the cost of collapsing old.

  He waited for the water to rise. He waited for the foremen to break down the door. He waited for the sun to go down completely.

  In the dark, he listened to the river. It sounded the same as it always had, indifferent to the width of the locks. The standard was gone. The lock-in remained, but now it was a choice. The future was not written in the iron anymore. It was just water, waiting to be held.

  Elias closed his eyes. He did not know if the town would thank him or hang him. He only knew that the coin had landed, and this time, he had called it.
