  3. Accurate. This describes the consistency axioms that give the theory empirical content. Without consistency, any choice is permissible. The "tautology" worry is avoided because inconsistent choices would falsify the model.
  4. Subtly wrong. Revealed preference identifies rankings, not welfare. A choice made under duress or ignorance reveals what was chosen, not necessarily what improves well-being. Equating the two ignores constraints and information gaps. A careful defender would say pure choice theory is neutral on welfare; welfare economics adds the normative layer requiring additional assumptions about information and freedom.

  The authority's inference fails. Revealed preference theory requires comparing choices across identical budget sets to isolate genuine ranking. When fares rise or headways lengthen, the "menu" changes. Continued ridership under degraded service often reveals a lack of alternatives (inelastic demand), not high welfare value. By treating constrained necessity as revealed preference, the authority conflates captivity with satisfaction. Furthermore, comparing across neighborhoods with different alternatives violates the requirement for a stable choice environment. The data shows what riders *must* do, not necessarily what they *value* most when free to choose. Since the menus themselves changed after earlier cuts, the authority is comparing choices made under different constraints. RPT assumes a fixed constraint set to reveal preference. If the constraint set shrinks, staying on the route reveals nothing about relative value compared to other options, only that the remaining option is the only option. Thus, the score measures dependency, not value.
