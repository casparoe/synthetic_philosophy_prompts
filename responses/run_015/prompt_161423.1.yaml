  **Note**

  The poem simplifies the causal chain for meter, particularly the dependency between Nell's signature and Osei's absence. The most contested move is the second structure: treating Nell's omission as a cause via 'prevention of prevention'. Some philosophers argue omissions are merely background conditions, not causes, regardless of duty. I am 85% confident a causation specialist would accept the depiction of differential weight between the two non-events, as the poem encodes the counterfactual dependence on the log without jargon. The least sure point is the envoi's claim that Nell's 'nothing' broke the valve; this risks conflating the omission with the physical burst, potentially obscuring the distinction between causal relevance and causal production. I dropped the snow-block scenario (move four) to preserve clarity on the normative contrast.
