  I woke above the sluice to read the log.
  Below, the iron throat of the valve
  waited for heat to fight the coming frost.
  I rolled back into heavy, innocent sleep.
  No one had written down my name.
  And so I caused absolutely nothing.

  And so I caused absolutely nothing.
  Someone else had signed the log.
  No one had written down my name.
  Below, the iron throat of the valve
  waited while the day-man chose sleep,
  trusting the ink would hold back frost.

  The ice grew thick against the frost.
  Her failure was a kind of nothing
  heavier than my own deep sleep.
  She entered truth into the log,
  then left the handle of the valve.
  The water burst beneath her name.

  The village woke beneath her name.
  The ice grew thick against the frost.
  She left the handle of the valve.
  Her failure was a kind of nothing
  that stole the day-man from his log,
  and pulled him down into sleep.

  It pulled the day-man into sleep.
  The village woke beneath her name.
  He never checked the night log.
  The ice grew thick against the frost.
  That empty space was nothing
  that locked the handle of the valve.

  She left the handle of the valve.
  And lulled the day-man into sleep.
  I remained simply nothing.
  They shouted loud her written name.
  White silence settled with the frost.
  No eye had read the night log.

  She signed the log, he chose sleep,
  Her nothing broke the valve beneath the frost,
  And I walked away with just my name intact.

