          *   *Training:* Textbooks, residencies. New generation knows only DSM. (Learning).
          *   *Harmonization:* ICD-10 aligned with DSM-IV to ensure transatlantic compatibility. (Coordination).

      *   **Distinguishing Coordination vs. Learning:**
          *   *Coordination:* Insurance, ICD alignment. Network effects. "We use it because you use it."
