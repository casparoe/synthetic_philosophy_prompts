      *Drafting - Section by Section:*

      *Title:* The Body Boundary Experiment.
      *Materials:* Red/Green cards, 3 Scenario Scripts.
      *Timeline:* 10/35/15 split.

      *Activity:*
      1.  Scenario A: You are attacked. (Vote: Force OK?)
