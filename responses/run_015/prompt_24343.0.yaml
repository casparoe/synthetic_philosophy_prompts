answer: |-
  **Activity: The Proximity of Pain**
  **Materials:** 14 sets of Red (No) / Green (Yes) cards. 3 Scripts. One volunteer "Victim."
  **Timeline:** 10 min Setup, 35 min Scenarios, 15 min Debrief.

  **Rules:**
  1.  No discussion between rounds.
  2.  Vote simultaneously on count of three.
  3.  "Yes" means you physically intervene using necessary force. "No" means you do not.
  4.  **Commitment:** If you vote Yes, you must stand up and move to the "Intervention Zone" (front of room). This makes the choice physical.

  **The Scenarios:**
  1.  **The Mirror:** "Someone is trying to break your arm right now. Do you strike them to stop it?" (Students vote individually).
  2.  **The Friend:** "Your best friend is being held down, arm being broken. Do you strike the attacker?" (Students vote).
  3.  **The Stranger (Live):** A volunteer sits center stage. You (or a confident student) aggressively threaten to break the volunteer's arm. "Do you strike the attacker?" (Students vote).
  4.  **The Distant:** "A stranger overseas is being harmed. Do you strike someone here to stop it?" (Students vote).

  **Predictable Failures:**
  *   **Giggling:** The live scenario might feel fake. *Fix:* Instruct the "attacker" to be deadpan, not theatrical. Silence raises tension.
  *   **Social Pressure:** Students won't stand up due to embarrassment, not ethics. *Fix:* Emphasize this is a philosophical commitment, but require physical movement to count so they feel the weight of inaction.
  *   **Force Confusion:** They might think "strike" means "kill." *Fix:* Define force strictly as "minimum necessary to stop the harm."

  **Debrief (The Reveal):**
  1.  **Map the Votes:** Write the % of "Yes" votes for each scenario on the board. It will likely slope downward from 100% (Self) to low (Stranger).
  2.  **Ask:** "What morally relevant difference exists between Scenario 1 and 3?" Guide them to see the pain is identical. The only variable is *whose* body it is.
  3.  **The Trap:** If they say "I know them," ask if knowing someone justifies violence. If they say "I'm there," ask if distance matters morally. Push them to see that protecting *yourself* vs. *others* is the only shifting variable.
  4.  **The Term:** Introduce **"The Self-Defense Exception."** Explain that pacifism fails if we accept violence for ourselves but not others, unless we admit bodily ownership is the only metric.
  5.  **Limitations:** Acknowledge this activity doesn't solve *war* (state violence) or *risk* (what if intervening gets you killed?). It only exposes the inconsistency in personal violence thresholds.

  **What This Can't Settle:**
  This doesn't prove pacifism is wrong; it proves *inconsistent* pacifism is unstable. It also doesn't address whether violence *works* to protect, only if it's permitted. You must supply the link between personal violence and state violence if you want to discuss war later. This activity isolates the intuition that *my* pain matters more than *yours*, forcing them to defend why.
