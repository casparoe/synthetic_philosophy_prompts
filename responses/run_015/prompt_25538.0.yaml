      *   *Refining (4) vs. (5):* The user worries repentance doesn't fix "lack of commitment."
      *   *Expert Insight:* Commitment is a current state, not a historical purity test. Hypocrisy is a *current* inconsistency between what you demand and what you *currently* endorse. Repentance aligns your current endorsement with the norm, even if your history doesn't match. The tension is only if you define commitment as "never having violated the norm."
      *   *Hidden Tension:* If (5) is true (it's about lack of commitment), how do we *know* someone lacks commitment? Hypocrites often *think* they are committed. This touches on the "epistemic access" problem. Also, the "moral equality" argument (Bell): Hypocrisy violates the equality of persons. Does (5) capture that?
