      *   *Section 3: Fern and the Child.* Nozick might see children as developing agents. Fern's arc is tragic in this reading. She loses her moral power as she integrates into human society. The book suggests moral vision is *lost* in maturity, whereas Nozick assumes it's gained.
      *   *Section 4: Sacrifice vs. Duty.* Charlotte's death. Utilitarianism sacrifices the few for the many. Charlotte sacrifices herself for *one*. This is anti-utilitarian. But is it Kantian? She acts on a self-imposed law (friendship).
