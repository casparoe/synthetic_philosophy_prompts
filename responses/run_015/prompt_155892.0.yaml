prompt: |-
  ok me and my friend got in a huge fight about Charlotte's Web last nite, specifically whether Charlotte saving Wilbur is an example of real moral regard or just some kind of utility-maximizing move among animals. I was trying to read it through Nozicks idea that animals can be aggregated in welfare calculations but people have strict side-constraints against being used merely as means, but then my friend said wait Charlotte herself is an animal agent, so if she counts as an agent with side-constraints she's also part of the pool being aggregated, which feels like the framework collapses in on itself. Can you do a serious reading of the novel through this lens? I want you to take the farm scenes and Charlotte's death seriously, not just use the book as an illustration of Nozick. Where does the story actually break his human-animal distinction? Does Fern being a human child change the moral calculus, or does her being a child put her closer to the animals in Nozicks scheme? And if Charlotte dies for Wilbur, is that her being sacrificed in the aggregate, or is she acting like a Kantian agent despite being a spider? I want to know what the book adds to the debate that pure argument doesn't, especially about whether animal agents can have the kind of moral worth that blocks aggregation.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
