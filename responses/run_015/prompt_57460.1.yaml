      **Debrief (25 mins):** Plot average scores on flipchart XY grid (X=Control, Y=Fairness). Reveal Rounds 1 & 2 cluster low on Fairness (value extracted by buyer). Reveal Rounds 3 & 4 vary on Control. Name concepts: "Exploitation" (pay gap) and "Alienation" (control gap). Scripted move: "You signed the rate. But did you sell your time or your capacity to think? If the contract buys your hands but ignores your mind, is the exchange truly equal?" Do not invoke labour theory of value yet; focus on the separation of conception and execution.

