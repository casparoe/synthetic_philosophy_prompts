      The legal ladder is a tiered system of evidentiary thresholds governing state action and adjudication. At the base, reasonable suspicion and probable cause authorize forward-looking intrusions (stops, warrants) based on predictions of evidence or crime. For adjudication, preponderance of the evidence (>50% likelihood) governs ordinary civil disputes. Clear and convincing evidence serves intermediate stakes like termination of parental rights or civil commitment. Beyond a reasonable doubt (BRD) governs criminal conviction. Crucially, these standards apply to the same factual propositions; identical evidence can sustain civil liability while failing criminal conviction. This structure excludes procedural rules unrelated to evidentiary weight (e.g., hearsay exemptions) and focuses strictly on the quantum of proof required to transition from uncertainty to authorized coercion.

