      This view treats proof as a license to coerce rather than a report on metaphysical truth. BRD implies that there is a level of uncertainty epistemically tolerable for belief but morally intolerable for punishment. The system assumes that error costs are asymmetrical: falsely punishing the innocent is worse than falsely freeing the guilty. Consequently, the evidentiary bar rises not because the fact changes, but because the moral cost of being wrong increases. This is not merely policy; it shapes the very definition of legal truth. A verdict is not "X happened"; it is "We are justified in treating X as happened given the stakes." The epistemology is consequentialist regarding error distribution but deontological regarding rights. It presupposes that belief thresholds are mutable based on the institutional context, rejecting the invariantist idea that evidence alone dictates when one should believe.

