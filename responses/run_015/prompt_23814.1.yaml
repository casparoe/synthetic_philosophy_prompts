answer: |-
  You have excellent instincts. Your biological intuition is correct: a system that suppresses data (the cascade) cannot be as efficient as a system that aggregates all data (ideal pooling). The argument you've reconstructed is a classic puzzle in social epistemology, often associated with the Bikhchandani, Hirshleifer, and Welch (BHW) model of information cascades.

  The hole is in **Step (4)**.

  Here is the breakdown of why (4) fails, why rejecting it saves your "Wisdom of Crowds" intuition (Step 5), and what it costs you in terms of social theory.

  ### The Flaw: Step (4)
  > *(4) The final crowd choice is a function of the whole chain of choices, and each link in that chain was made by someone who had a hunch, so the final choice carries the information of every hunch in the line.*

  This step conflates **actions** with **signals**.

  In a cascade, once the public history (the line) becomes heavy enough, Person $N$ ignores their private signal and copies the crowd. Person $N+1$ sees Person $N$ join the line. However, Person $N+1$ cannot distinguish whether Person $N$ joined because of a private hunch or because they were following the crowd.

  Crucially, because Person $N$ ignored their private hunch to make their decision, **that hunch is not transmitted to the public pool.** It is censored.

  *   **Pre-Cascade:** Actions reveal signals. (If I choose Restaurant A, you can infer I got a signal for A).
  *   **Post-Cascade:** Actions do *not* reveal signals. (If I choose Restaurant A, you don't know if I got a signal for A or if I just followed the line).

  Therefore, the final crowd choice is **not** a function of the *whole* chain of hunches. It is a function of the early hunches (the ones that started the cascade) plus the fact that later people were rational enough to follow the herd. The specific information contained in the private signals of the people *inside* the cascade is lost to the collective.

  ### Why Step (5) Still Holds
  > *(5) Pooling more independent signals only makes your judgment more reliable...*

  You are right to want to keep this. This is the Condorcet Jury Theorem, and it is mathematically robust. However, it relies on two conditions:
  1.  **Independence:** Signals must be independent.
  2.  **Aggregation:** Signals must actually be counted.

  In an information cascade, condition (2) is violated. The later signals exist, but they are not aggregated into the public decision. They are discarded by the rational agents holding them.

  Because the signals inside the cascade are not pooled, the "Wisdom of Crowds" theorem does not apply to the *cascade outcome*. It only applies to the *pre-cascade* subset. Since the subset is smaller than the total group, the cascade is strictly less reliable than full pooling.

  ### The Cost of Rejecting Step (4)
  If you reject (4), you preserve your statistical intuition, but you incur a cost in **social epistemology** and **game theory**.

  **1. The Tragedy of the Epistemic Commons**
  You have to accept that **individual rationality is incompatible with collective optimality.**
  Every person in the line is acting rationally (maximizing their own chance of picking the good restaurant based on available evidence). Yet, by acting rationally, they degrade the quality of the public information pool for everyone behind them.
  *   **Cost:** You must abandon the idea that a market or a crowd of rational agents will naturally self-correct toward truth. Rationality at the micro-level can produce stupidity at the macro-level.

  **2. Fragility over Robustness**
  In your fish/bird work, herding is often robust (predator avoidance). In human epistemic cascades, the outcome is incredibly fragile.
  Because the cascade is built on the thin sliver of information from the first few people, a cascade can lock onto the *wrong* restaurant easily. If the first three people got unlucky bad signals, the next 1,000 people will follow them, ignoring their own correct signals.
  *   **Cost:** You have to accept that social consensus is often a poor indicator of truth quality, because consensus can be "hijacked" by early noise.

  **3. The Value of Noise**
  This is the most philosophical cost. In the ideal pooling scenario (Step 5), every signal counts. In the cascade, the system benefits if later people act *irrationally* (i.e., if they stubbornly follow their own hunch despite the line).
  *   **Cost:** You have to acknowledge that from a collective truth-seeking perspective, "stubbornness" or "non-conformity" has positive externalities. The person who ignores the line to follow their hunch is sacrificing their own individual accuracy to provide data for the group. This creates a tension between ethical epistemology (duty to share truth) and instrumental rationality (duty to be right).

  ### Summary
  Your reconstructed argument is a *reductio ad absurdum* of the idea that cascades aggregate information efficiently.

  *   **Reject:** Step (4). The chain of choices does *not* carry the information of every hunch; it censors the hunches of those inside the cascade.
  *   **Keep:** Step (5). Pooling independent signals is superior.
  *   **Conclusion:** Cascades are **informationally inefficient**. They are a failure mode of social learning, not a feature.

  Your biological background serves you well here. In a school of fish, the "signal" is often the movement of the neighbor (which is immediate and physical). In human epistemology, the "signal" is a probabilistic judgment hidden behind an action. When humans hide the judgment to mimic the action, the information flow is severed. You were right to smell a rat.
