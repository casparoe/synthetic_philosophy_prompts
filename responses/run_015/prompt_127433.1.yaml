prompt: |-
  Write the full specification—the desiderata—that any adequate theory of well-being must meet if it is to survive both Nozick's experience machine and a symmetric but under-discussed variant I will call the "reverse machine" case: a subject immersed in an objectively harsh, unmediated reality who reports profound well-being precisely because she values the authenticity of her struggle and refuses a simulated life of pleasure, even when the simulation would preserve her false belief that she is still struggling. For each desideratum, state the phenomenon or thought-experiment that motivates it (for instance: the intuition that passive pleasure is insufficient; the need to distinguish being well from feeling well; the challenge of adaptive preferences formed inside simulation; the possibility that objective adversity can be constitutive of well-being for some agents). Mark which requirements are non-negotiable—without them the theory collapses into either hedonism or unqualified subjectivism—and which reflect camp-specific commitments (e.g., narrative coherence, objective pluralism, agent-relative weighting). Then identify whether any subset of these desiderata is jointly unsatisfiable, particularly where accommodating the reverse-machine intuition conflicts with accommodating the original machine intuition. Conclude with a brief evaluation of how hedonism, desire-satisfactionism, and an objective-list view fare against the list, but keep the conceptual weight on constructing and justifying the criteria rather than on scoring the theories.
reasoning: |-
  Here's a thinking process that leads to the suggested specification:

  1.  **Analyze the Request:**
      *   **Task:** Write a full specification (desiderata) for an adequate theory of well-being.
      *   **Constraints:** The theory must survive *both* Nozick's Experience Machine (EM) and a "Reverse Machine" (RM) case.
      *   **RM Case Definition:** A subject in harsh reality reports profound well-being because she values authentic struggle and refuses a simulation of pleasure (or even a simulation of struggle). She values *actual* contact with reality over *felt* contact.
      *   **Requirements for Desiderata:**
          *   State the motivating phenomenon/thought experiment for each.
          *   Mark which are "Non-Negotiable" (avoiding collapse into hedonism/unqualified subjectivism) vs. "Camp-Specific" (narrative, objective list, etc.).
          *   Identify if any subset is jointly unsatisfiable (tension between EM and RM intuitions).
          *   Conclude with a brief evaluation of Hedonism, Desire-Satisfactionism, and Objective-List views against the list.
          *   **Focus:** Conceptual weight on constructing/justifying criteria, not scoring theories.

  2.  **Deconstruct the Thought Experiments:**
      *   **Nozick's Experience Machine (EM):** We intuitively refuse to plug in. Why? We value *doing* things, not just *feeling* like we did them. We value *contact with reality*.
          *   *Implication for Theory:* Well-being $\neq$ Mental States alone.
      *   **Reverse Machine (RM):** A subject in harsh reality claims high well-being because the struggle is *real*. She rejects a simulation even if the simulation mimicked the struggle (preserving the false belief of struggling). She values the *ontological status* of the adversity, not just the feeling of overcoming.
          *   *Implication for Theory:* Well-being can include objective adversity if authentically engaged. Subjective reports of well-being in harsh conditions aren't always false consciousness (adaptive preference); sometimes they are valid valuations of authenticity.
      *   **Tension:** EM says "Feeling good isn't enough; need reality." RM says "Feeling bad (struggle) isn't necessarily bad; need reality." Both point to *Reality Contact* as a central value, but they pull in different directions regarding the valence of experience.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: The Reality Constraint.* (Motivated by EM). We need to be actually connected to the world.
      *   *Desideratum 2: The Authenticity Constraint.* (Motivated by RM). Valuing real struggle over fake ease (or fake struggle).
      *   *Desideratum 3: The Subjective Resonance Constraint.* (Motivated by RM). If the subject says they are well because they value the struggle, the theory shouldn't automatically override them (avoids paternalism).
      *   *Desideratum 4: The Non-Identity of Feeling and Being.* (Motivated by EM). Distinguish feeling well from being well.
      *   *Desideratum 5: The Adaptive Preference Filter.* (Motivated by RM/EM boundary). How to distinguish valid valuation of struggle from brainwashed acceptance of misery?

      *Refining the Labels:* Let's make them more formal.
      1.  **Ontological Grounding:** (EM)
      2.  **Agency/Active Engagement:** (EM)
      3.  **Valuational Sovereignty:** (RM) - The subject's endorsement matters.
      4.  **Objective Constitutivity:** (RM) - Real hardship can be part of the good.
      5.  **Differentiation of Adaptation:** (General) - Distinguish resilience from oppression.

      *Categorizing (Non-Negotiable vs. Camp-Specific):*
      *   Non-Negotiable: Must avoid pure mental state theory (Hedonism) and pure "anything goes" subjectivism.
      *   Camp-Specific: Narrative unity, specific objective goods.

      *Checking for Joint Unsatisfiability:*
      *   The tension lies between *Valuational Sovereignty* (if she says she's well, she is) and *Objective Constitutivity* (is she actually well if she's suffering?). If we lean too hard on RM (her report is final), we risk subjectivism. If we lean too hard on EM (she needs pleasure), we risk hedonism. The real conflict is between protecting the subject from false consciousness (EM worry) vs. respecting the subject's valuation of hardship (RM worry).

  4.  **Developing the Specification Structure:**

      *   **Introduction:** Define the scope (bridging EM and RM).
      *   **Section 1: The Desiderata.** List them with Motivation and Classification.
      *   **Section 2: The Tension/Unsatisfiability Analysis.** Where do they clash?
      *   **Section 3: Theory Evaluation.** Brief pass over Hedonism, Desire, Objective List.
      *   **Conclusion:** Summary.

  5.  **Drafting Content - Specific Focus on the "Reverse Machine":**
      *   The RM case is crucial. It's not just "I like struggle." It's "I like *real* struggle better than *simulated* struggle." This highlights that the *truth condition* matters more than the *phenomenological condition*.
      *   This challenges Desire Satisfactionism too. If I desire to struggle *really*, and the machine simulates struggle, my desire is technically satisfied (I feel I'm struggling), but the *object* of the desire (real struggle) is missing. So the theory needs an "Externalist" condition on desire satisfaction.

  6.  **Refining the "Non-Negotiable" vs. "Camp-Specific":**
      *   *Non-Negotiable:* Anything that prevents collapse into Hedonism (mental states only) or Crude Subjectivism (whatever you think is good, is good, even if brainwashed).
      *   *Camp-Specific:* Things like "Narrative Coherence" or specific "Objective Goods" (knowledge, friendship) that not all non-hedonist theories accept.

  7.  **Addressing Joint Unsatisfiability:**
      *   Is it possible to satisfy the intuition that "Pleasure without Reality is bad" (EM) AND "Pain with Reality is good" (RM) without contradiction?
      *   Yes, if the common denominator is *Authentic Contact*.
      *   However, a conflict arises regarding *Subjective Authority*. EM suggests we know better than our future plugged-in selves (we shouldn't plug in). RM suggests the person in the hardship knows better than the external observer (she is flourishing). If the theory privileges the external view too much, it violates RM. If it privileges the internal view too much, it violates EM (because the plugged-in person *feels* fulfilled).
      *   *Crucial Conflict:* The "Adaptive Preference" problem. In RM, is the subject's love of struggle a genuine value or a coping mechanism? A theory must distinguish these without being paternalistic. This is the hardest joint requirement.

  8.  **Final Review against Constraints:**
