  Part One: The Logical Space

  The decision tree originates from a single entry commitment stipulating that moral considerability tracks exclusively with the capacity for valenced experience, rendering species membership and ecological role morally irrelevant. From this entry node, the instrument branches across five diagnostic questions. Each question is phrased as a concrete claim regarding the stipulated cases or general welfare principles, designed to be voted upon by a certifier as either affirmative or negative without reference to the philosophical label it entails.

  Question One turns on the case of the selectively bred prawn. The certifier must vote on the following claim: The selectively bred prawn warrants full moral status equivalent to finfish, despite the loss of avoidance learning, because its physiological response to analgesics is sufficient evidence of valenced experience. An affirmative vote indicates a willingness to grant full status based on physiological markers under uncertainty. A negative vote indicates that full status is not warranted, leaving open the possibility of partial status or no status.

  Question Two turns on the case of the gene-edited tilapia. The certifier must vote on the following claim: The decentralized nervous system of crustaceans is functionally analogous to the ablated neural pathway in the gene-edited tilapia, and this architecture negates the capacity for valenced experience regardless of behavioral responses. An affirmative vote asserts that neural architecture precludes sentience. A negative vote asserts that neural architecture does not preclude sentience.

  Question Three turns on the case of the electrical stunning apparatus. The certifier must vote on the following claim: A forty percent probability of conscious immobilization during stunning renders the apparatus unacceptable for certification, even if it is the best available technology. An affirmative vote prioritizes risk avoidance for crustaceans. A negative vote accepts higher risk thresholds for crustaceans compared to finfish.

  Question Four is a free-design question regarding moral obligation. The certifier must vote on the following claim: Establishing the capacity for valenced experience in a farmed species necessitates a modification of current farming practices to reduce suffering. An affirmative vote links sentience to obligation. A negative vote severs the link between sentience and practical obligation.

  Question Five is a free-design question regarding moral aggregation. The certifier must vote on the following claim: Minimizing the aggregate sum of suffering across all individuals takes precedence over minimizing the intensity of suffering experienced by any single individual. An affirmative vote supports aggregationist calculus. A negative vote supports an individualist or non-aggregationist approach.

  The logical space consists of thirty-two possible combinations of answers to these five questions, represented as binary sequences where one denotes an affirmative vote and zero denotes a negative vote. The tree sorts these combinations into terminal leaves. In the following section, ten of these leaves are assigned specific position labels, while the remaining twenty-two combinations are identified as unoccupied cells with diagnostic explanations.

  Part Two: Position Mapping and Diagnostics

  The ten occupied leaves of the decision tree are located as follows. The Conservative Exclusion position corresponds to the sequence 01011, withholding full status based on neural architecture while maintaining standard obligations for finfish. The Strict Risk position corresponds to 00111, granting partial sentience but demanding high stunning standards without aggregation. The Precautionary Principle position corresponds to 10111, granting full status due to uncertainty and demanding high standards with aggregation. The No-Aggregation Individualism position corresponds to 10110, granting full status and high standards but rejecting aggregate calculus. The Unoccupied Position label is assigned to sequence 10101, which grants full sentience but denies the obligation to change practice. The Pragmatic Individualism position corresponds to 00010, granting partial sentience, accepting risk, and rejecting aggregation. The Neural Essentialist position corresponds to 01110, denying sentience based on neural structure but accepting risk limits and rejecting aggregation. The Skeptic Non-Intervention position corresponds to 01000, denying sentience and denying obligations or risk limits. The Probabilistic Aggregate position corresponds to 00011, granting partial sentience, accepting risk, and prioritizing aggregate sums. The Precautionary Risk-Tolerant position corresponds to 10011, granting full status but accepting lower stunning standards while prioritizing aggregates.

  The remaining twenty-two combinations of answers are unoccupied cells. The combination 11000 is unoccupied because it is incoherent to affirm full prawn status while simultaneously affirming that neural architecture negates capacity. The combination 11001 is unoccupied because it is incoherent to affirm full prawn status while simultaneously affirming that neural architecture negates capacity. The combination 11010 is unoccupied because it is incoherent to affirm full prawn status while simultaneously affirming that neural architecture negates capacity. The combination 11011 is unoccupied because it is incoherent to affirm full prawn status while simultaneously affirming that neural architecture negates capacity. The combination 11100 is unoccupied because it is incoherent to affirm full prawn status while simultaneously affirming that neural architecture negates capacity. The combination 11101 is unoccupied because it is incoherent to affirm full prawn status while simultaneously affirming that neural architecture negates capacity. The combination 11110 is unoccupied because it is incoherent to affirm full prawn status while simultaneously affirming that neural architecture negates capacity. The combination 11111 is unoccupied because it is incoherent to affirm full prawn status while simultaneously affirming that neural architecture negates capacity.

  The combination 10000 is unoccupied because it is unattractive to grant full sentience while denying all obligation, risk limits, and aggregation without a coherent philosophical basis. The combination 10001 is unoccupied because it is unattractive to grant full sentience and prioritize aggregates while denying obligation and risk limits. The combination 10100 is unoccupied because it is incoherent with the entry commitment to grant full sentience and demand risk limits while denying the obligation to change practice. The combination 10110 is occupied by No-Aggregation Individualism. The combination 10111 is occupied by the Precautionary Principle. The combination 10010 is unoccupied because it is unattractive to grant full sentience and prioritize aggregates while denying obligation and risk limits. The combination 10011 is occupied by the Precautionary Risk-Tolerant position. The combination 10101 is marked as the Unoccupied Position.

  The combination 01001 is unoccupied because it is unattractive to deny sentience yet affirm an obligation to change practice based on a non-existent capacity. The combination 01010 is unoccupied because it is unattractive to deny sentience yet demand risk limits without an obligation to change practice. The combination 01011 is occupied by Conservative Exclusion. The combination 01100 is unoccupied because it is unattractive to deny sentience yet demand risk limits while denying obligation. The combination 01101 is unoccupied because it is unattractive to deny sentience yet prioritize aggregates and risk limits without obligation. The combination 01110 is occupied by the Neural Essentialist position. The combination 01111 is unoccupied because it is unattractive to deny sentience yet affirm full obligations and risk limits.

  The combination 00000 is unoccupied because it is merely unexplored to deny sentience, obligation, risk limits, and aggregation simultaneously. The combination 00001 is unoccupied because it is unattractive to prioritize aggregates while denying sentience and obligation. The combination 00010 is occupied by Pragmatic Individualism. The combination 00011 is occupied by Probabilistic Aggregate. The combination 00100 is unoccupied because it is unattractive to demand risk limits while denying sentience and obligation. The combination 00101 is unoccupied because it is unattractive to demand risk limits and prioritize aggregates while denying sentience and obligation. The combination 00110 is unoccupied because it is merely unexplored to demand risk limits and reject aggregation while denying sentience. The combination 00111 is occupied by the Strict Risk position.

  Two leaves in this tree cannot be fully separated by the current instrument. The Probabilistic Aggregate position and the Precautionary Risk-Tolerant position differ only on the attribution of full status versus partial status, but both result in identical practical outcomes regarding risk acceptance and aggregation. To pry them apart, a further case would be needed that tests the weighting of suffering, such as a scenario where a small number of crustaceans suffer intensely versus a large number suffering mildly, requiring the certifier to choose between intensity and probability explicitly.
