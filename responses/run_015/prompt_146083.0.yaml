      *   *Philosophical lean:* Democratic theory usually favors the "All-Subjected Principle" but worries about "transient" interests. The Tribunal's 10-year rule suggests a "Integrationist" view. I will recommend Exclusion to maintain consistency with the high bar of Case 1.

