      *   15-Year PM: Aligned with self-perpetuation.
      *   *Decision:* The strongest thread is **Institutional Memory vs. Democratic Vitality.**
      *   Actually, let's look at **Weber's "Politics as a Vocation."** Weber argues living *for* politics vs. living *off* politics.
      *   The user's "Brilliant Lifer" lives *for* politics. The Senator lives *off* politics.
      *   But the 15-Year PM also lives *for* it, yet feels wrong. Why? Because democracy requires *turnover* to remain responsive.
      *   So the principle is: **Competence is necessary, but Legitimacy requires Renewal.**
      *   Tenure is good *until* it impedes the system's ability to correct itself.
