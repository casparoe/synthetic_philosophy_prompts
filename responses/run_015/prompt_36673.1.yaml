      *   **Address the "Brilliant Lifer":** This is the crux.
      *   **The Verdict:** Admire the *craft*, worry about the *ecosystem*.
      *   **Nuance for the Novel:** The character shouldn't just be "good" or "bad." They should embody the tension. The tragedy of the good lifer is that they enable the bad system by legitimizing it.

  5.  **Refining the Principle (Self-Correction):**
      *   Is it just "Retention"? The Senator blocks things. That's governance, but negative governance.
      *   Maybe it's **Alignment.**
      *   Councilwoman: Aligned with neighbors.
      *   Senator: Aligned with donors/party.
