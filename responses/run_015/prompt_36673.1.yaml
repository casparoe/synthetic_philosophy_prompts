answer: |-
  This is a fantastic tension to wrestle with, and it's no accident it's bugging you personally. You are bumping up against one of the oldest problems in political theory: the tension between **competence** (which requires time and expertise) and **responsiveness** (which requires turnover and fresh mandates).

  Your intuitions aren't random pattern-matching. They are actually remarkably consistent with a specific principle. I would call it **The Stewardship Threshold.**

  Here is the principle: **Tenure is virtuous when it builds institutional memory to serve the public; it becomes vicious when it builds structural advantage to protect the officeholder.**

  Let's run your cases through this filter. It explains why your gut reacts differently to each one.

  ### 1. The City Councilwoman (25 Years)
  *   **Verdict:** Virtuous Tenure.
  *   **Why:** Municipal politics is largely administrative. It is about *stewardship* of existing systems (zoning, trash, code). Her 25 years mean she knows where the bodies are buried and how to navigate the bureaucracy to get things done. The feedback loop is short; if she fails, the potholes remain, and she hears about it at the grocery store. Her tenure serves the *constituents* because her expertise lowers the transaction cost of governance.

  ### 2. The Senator (6 Terms, Fundraiser/Blocker)
  *   **Verdict:** Vicious Tenure.
  *   **Why:** At the national level, the "product" isn't fixing potholes; it's legislation and oversight. When a politician stays this long, they stop optimizing for *governance* and start optimizing for *retention*. Fundraising and obstruction are not skills that help the public; they are skills that protect the incumbent from competition. Her tenure serves *herself* because her expertise is now focused on maintaining power, not exercising it.

  ### 3. Term Limits (The Real Estate Agent Council)
  *   **Verdict:** The Failure of Forced Amateurism.
  *   **Why:** You identified the exact failure mode of term limits. When you remove the Steward (the Councilwoman) without changing the system, you don't get "the people"; you get the *permanent staff*. The developers' lawyers have institutional memory; the new councilors do not. Power abhors a vacuum. If you ban career politicians, you inadvertently hand the keys to career lobbyists. This confirms that **expertise is necessary**, but it matters *whose* expertise holds the power.

  ### 4. Citizens' Assembly (Lottery for Maps) vs. Legislature (Lottery for Laws)
  *   **Verdict:** Technical vs. Political.
  *   **Why:** You trust juries because they decide *facts* based on *existing law*. Redrawing maps is similar; it is a technical task of applying rules (compactness, fairness) to data. It requires impartiality, not vision.
  *   **The Recoil:** You recoil from a lottery legislature because legislation is not just applying rules; it is *setting priorities* and *making trade-offs*. That requires a mandate. A random sample has no mandate. They have no skin in the game regarding the *consequences* of the law two years later. Here, your gut is telling you that **governance requires accountability**, and you cannot hold a random sample accountable in the next election because they won't be there.

  ### 5. The 15-Year Prime Minister
  *   **Verdict:** The Threshold Crossed.
  *   **Why:** Even with fair elections, 15 years feels unhealthy because the *incumbency advantage* compounds. Over time, the line between the Party and the State blurs. The Steward begins to look like the Owner. It stifles the "Democratic Renewal" necessary for a society to correct its course. It's not that they are evil; it's that the system loses its ability to pivot.

  ### The Core Principle: Living *For* vs. Living *OFF*
  The sociologist Max Weber drew a distinction that fits your dilemma perfectly. He asked whether a politician lives *for* politics (passion, cause, service) or *off* politics (income, status, career).

  *   **The Councilwoman** lives *for* politics (mostly). She knows the code because she cares about the city.
  *   **The Senator** lives *off* politics. The job is a vehicle for status and security.
  *   **The Term-Limited Council** failed because the job became a short-term gig, making them dependent on those who live *off* politics (lobbyists).

  ### The Crucial Case: The Brilliant Lifer
  Now, to the character keeping you up at night: *A politician who is genuinely brilliant, loves the job, and never does anything else.*

  Should you admire or worry? **The answer is: Admire the person, worry about the system.**

  This is the tragic figure of modern democracy. This person is likely the most effective person in the room. They have the institutional memory to stop waste, the relationships to pass good bills, and the integrity to refuse bribes.

  **However, they represent a systemic risk.**

  If your character is truly brilliant and indispensable, they become a **single point of failure.**
  1.  **Succession:** If they leave, is there anyone ready to take over? Or does the institution collapse because they hoarded the knowledge?
  2.  **Blind Spots:** Even brilliant people have blind spots. If they stay too long, their blind spots become the government's blind spots.
  3.  **Legitimacy:** Their presence legitimizes a system that might need shaking up. By being a "good" career politician, they make it harder to argue against career politicians, inadvertently protecting the "bad" ones.

  ### How to Write This Character
  For your novel, this tension is gold. Don't make them hypocritical. Make them **aware.**

  The most compelling version of this character knows they are an anomaly. They know they should probably step down for the health of the democracy, but they genuinely believe they are the only one who can keep the lights on.

  *   **The Conflict:** They are fighting a battle on two fronts. One against the opposition, and one against the inevitable stagnation of their own tenure.
  *   **The Flaw:** Their flaw isn't corruption; it's **hubris regarding their own necessity.** They believe the system cannot function without them.
  *   **The Arc:** The story shouldn't be about them getting caught in a scandal. It should be about them realizing that their *competence* has become an *obstruction* to new ideas, and they have to make the choice to leave while they are still loved, rather than staying until they are hated.

  **Summary for your notes:**
  Your gut is telling you that **politics is a trade, not a destiny.**
  *   When tenure improves the trade (Councilwoman), it's good.
  *   When tenure becomes the product (Senator/PM), it's bad.
  *   When you ban the trade (Term Limits), the black market takes over (Lobbyists).
  *   When you randomize the trade (Lottery Legislature), the quality collapses.

  The "Brilliant Lifer" is the person who mastered the trade so well they forgot it was supposed to be temporary. Admire their skill, but fear their monopoly.
