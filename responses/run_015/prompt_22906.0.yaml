prompt: |-
  I've been going back and forth on the indicative vs counterfactual distinction (re-reading some old LW threads that never really landed) and I want to steelman a take I think is underrated. The Lewis/Stalnaker setup gives counterfactuals a clean possible-worlds semantics with a similiarity order, and that works great, but indicatives — "if it's raining, the ground is wet" — dont sit well with it. I think the Adams thesis, Pr(A > B) = Pr(B | A), is actually the right treatment, which means indicatives don't have truth values in the normal sense and are really about your credence state. Can you argue this position for me, and specifically push back on the objection that it wrecks compositionality — how do you even make sense of negated or conjoined indicatives like "it's not the case that if A then B"? I keep getting stuck on the embedding cases.
