answer: |-
  This is a sophisticated spot to be stuck in. You are essentially wrestling with the fallout of **Lewis's Triviality Results** (1976). Lewis proved that if conditionals have truth conditions (i.e., they are propositions that can be true or false in a world) *and* they obey the Adams Thesis ($Pr(A \to B) = Pr(B|A)$), then probability distributions collapse (you can only have probabilities of 0 or 1).

  Since we clearly have credences between 0 and 1, and the Adams Thesis fits our intuitions perfectly, the "No-Truth-Conditions" (NTC) view is the logical survivor. Indicatives aren't descriptions of the world; they are **constraints on credence**.

  Here is the steelman for the Adams/NTC position, followed by a specific, rigorous pushback against the compositionality/embedding objection.

  ---

  ### Part 1: The Steelman for Adams/NTC

  **1. The Epistemic Nature of Indicatives**
  Counterfactuals ("If Oswald hadn't shot Kennedy, someone else would have") ask us to look at *other* possible worlds. Indicatives ("If Oswald didn't shoot Kennedy, someone else did") ask us to update our view of *this* world.
  The Ramsey Test captures this: To evaluate "If A, B," you hypothetically add A to your stock of knowledge and see if B follows. This is a procedure for updating belief, not a lookup function for a truth value. The Adams Thesis formalizes this: the "value" of the conditional *is* the conditional probability.

  **2. Avoiding Triviality**
  If you insist indicatives have truth conditions, you are forced into the Material Conditional ($A \supset B$), which yields the paradoxes of material implication (e.g., "If the moon is cheese, then Biden is president" is true). Or, you try to fix the truth conditions (Stalnaker), but Lewis proves you lose the link to probability.
  The NTC view accepts the bullet: **Indicatives are not propositions.** They are speech acts that express a state of mind. Just as "Ouch!" doesn't have a truth value but expresses pain, "If A, B" doesn't have a truth value but expresses a high conditional credence.

  ---

  ### Part 2: Pushing Back on the Compositionality Objection

  The objection is standard: *Logic requires propositions.* If "If A, B" has no truth value, it cannot be the argument of a negation operator, a conjunction, or an antecedent for another conditional. Yet, English allows:
  1.  **Negation:** "It is not the case that if it rains, the match lights."
  2.  **Conjunction:** "If it rains, the match lights, and if it's windy, the fire goes out."
  3.  **Embedding:** "If (if A then B), then C."

  If the NTC view renders these meaningless, the view is dead. Here is how you save it.

  #### 1. Distinguish Grammatical Form from Logical Form
  The most robust defense is to argue that natural language grammar is misleading. Just because English syntax *allows* embedding doesn't mean the underlying logic *permits* it for indicatives.

  When a speaker says, "It is not the case that if A, B," they are rarely performing a logical negation on a proposition. They are performing a **rejection of an inference**.
  *   **Truth-Conditional Negation:** $\neg P$ is true iff $P$ is false.
  *   **Metalinguistic/Assertability Negation:** "I deny that $A \to B$ is assertable."

  On the Adams view, to assert $A \to B$ is to claim $Pr(B|A)$ is high. To deny it ("It's not the case that if A, B") is to claim $Pr(B|A)$ is *not* high. This is perfectly coherent without truth values. You are negating the *appropriateness of the speech act*, not the truth of a proposition.
  *   **Steelman:** The sentence "It is not the case that if A, B" is paraphrasable as "A does not make B probable." This preserves the probabilistic semantics without requiring a truth value for the conditional itself.

  #### 2. Adams' Probabilistic Logic (Uncertainty Preservation)
  Ernest Adams developed a logic specifically for this. He redefined **validity**.
  *   **Classical Validity:** Truth is preserved from premises to conclusion.
  *   **Adams Validity:** *Uncertainty* is preserved. An argument is valid if the uncertainty of the conclusion cannot exceed the sum of the uncertainties of the premises.

  This handles conjunctions and chains without truth values.
  *   **Conjunction:** You can assert $(A \to B) \land (C \to D)$ because this is understood as holding two separate credence constraints simultaneously: $Pr(B|A)$ is high AND $Pr(D|C)$ is high. You don't need a joint truth condition for the conjunction; you just need the agent to hold both conditional beliefs.
  *   **Logic:** Adams showed that standard inference rules (like Modus Ponens) work fine in this probabilistic framework, provided you track the probabilities. The "wreckage" of compositionality only looks like wreckage if you insist on Boolean algebra. If you switch to Probability Algebra, the compositionality returns.

  #### 3. The "Deep Embedding" Concession
  This is the boldest move: **Admit that deeply embedded indicatives are infelicitous or shift meaning.**

  Consider: *"If (if it rains, the ground is wet), then the grass will grow."*
  This sentence sounds terrible. Most native speakers stumble over it. Why? Because the NTC view predicts it should be hard to process! The antecedent is asking you to suppose a *constraint on credence*, which is cognitively demanding compared to supposing a fact.

  When speakers *do* successfully embed conditionals, they often subtly shift to **counterfactuals** or **generics**.
  *   *Example:* "If (if Oswald didn't act alone, there was a conspiracy), then the CIA is involved."
  *   *Analysis:* The inner conditional here functions less like a pure indicative and more like a fact about the situation (a material implication or a counterfactual dependency).

  **The Argument:** The fact that deep embedding of pure indicatives is linguistically marked or rare is *evidence for* the NTC view, not against it. It suggests our language grammar outstrips our logical semantics in this specific domain. We *can* say it, but when we analyze it rigorously, we realize we've shifted to talking about propositions (e.g., "The proposition that A implies B...").

  #### 4. Context Shift and "Propositionalization"
  Sometimes, we *do* need to treat a conditional as a proposition (e.g., in belief reports: "John believes that if A, B").
  The NTC theorist can argue that in these embedding contexts, the conditional undergoes **propositionalization**.
  *   In isolation, "If A, B" expresses a credence constraint.
  *   In the scope of "It is not the case..." or "John believes...", the context shifts. We are no longer evaluating the conditional directly; we are evaluating the *claim that the conditional is assertable*.

  So, "It is not the case that if A, B" becomes:
  $\neg (\text{It is assertable that } A \to B)$
  Which cashes out as:
  $Pr(B|A) < \text{threshold}$

  This preserves compositionality by shifting the semantic type. The negation operator $\neg$ isn't operating on the conditional *content*; it's operating on the *assertability condition*. This is similar to how expressivists handle moral negation ("It is not good that X" = "I do not approve of X").

  ### Summary of the Counter-Argument

  To defend the Adams/NTC view against the compositionality objection, you argue:

  1.  **Negation is Metalinguistic:** Negating a conditional denies its *assertability* (high conditional probability), not its truth. This is semantically coherent.
  2.  **Logic is Probabilistic:** Compositionality holds if you define it over probabilities (Adams' Logic) rather than truth values. Conjunctions are just multiple constraints.
  3.  **Grammar $\neq$ Logic:** The infelicity of deeply embedded indicatives ("If if A then B...") is a prediction of the theory, not a bug. When they do appear, they usually shift to counterfactuals or material implications.
  4.  **Type-Shifting:** In embedding contexts, conditionals shift from expressing credences to expressing propositions *about* credences (e.g., "The probability of B given A is high").

  ### The "Kill Shot" for the Opponent
  If your interlocutor insists that indicatives *must* have truth conditions to handle embedding, hit them with **Lewis's Triviality** again.
  Ask them: *"Are you willing to accept that $Pr(\text{If A, B})$ cannot equal $Pr(B|A)$?"*
  If they say yes, they lose the intuitive link between conditionals and probability.
  If they say no, they must accept truth conditions collapse.
  The only way out is the NTC view. The compositionality cost is the price of avoiding triviality. It is a price worth paying because it accurately models the *epistemic* function of indicatives, which is their primary use case.

  ### Recommended Reading for Ammo
  *   **Dorothy Edgington:** *On Conditionals*. She is the strongest modern defender of the "no truth conditions" view and deals extensively with the embedding problem.
  *   **Alan Hájek:** *Most Counterfactuals Are False* (and related work on conditionals). He argues fiercely against truth-conditional accounts.
  *   **Ernest Adams:** *The Logic of Conditionals*. For the probabilistic validity framework.

  This position holds that indicatives are tools for navigating uncertainty, not maps of reality. Once you accept that, the "embedding" problem dissolves into a problem of translating between grammar and probabilistic constraints.
