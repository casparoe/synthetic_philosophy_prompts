prompt: |-
  I am applying for a six-month interdisciplinary residency that supports conceptual research feeding into long-form fiction, and I need a polished two-page proposal. The problem: the frameworks associated with Hobsbawm and Anderson treat the nation as a modern construct sustained by collective belief rather than primordial continuity, yet neither addresses what I will call narrative persistence—the mechanism by which an invented tradition survives generational turnover without being re-recognized as a recent fabrication. Precisely, does the experience of a nation as ancient depend on continuous institutional repetition of commemorative practices (an external, rule-like mechanism), or on an internalized normative commitment to the nation’s timeless legitimacy? Existing accounts treat invention as a discrete founding event and imagination as primarily spatial or social; they leave open whether temporal continuity requires active suppression of origin-memory or a structural feature of collective narrative that absorbs discontinuity. The approach will be comparative conceptual analysis of three forms—state commemorative rituals, serialized historical fiction about national origins, and constitutional founding narratives—to isolate whether persistence operates through repetition alone or requires normative investment. I will construct a typology of temporal authority: conditions under which invented continuity collapses versus endures across generations. The project succeeds if it yields a determinate framework distinguishing repetition-based from commitment-based persistence, with direct relevance to whether invented traditions can be deliberately destabilized; it fails if the mechanism proves purely empirical (requiring sociological fieldwork beyond solitary conceptual work) or if the distinction collapses into a general theory of ideology with no specific purchase on national identity. Given the time available, I can complete the conceptual framework and one extended case study, not a full comparative history. Write the proposal with a precise research question, an explanation of why current positions leave the persistence mechanism open, the comparative method and its justification over historical or sociological alternatives, what a useful deliverable looks like, and an honest assessment of failure conditions and scope limits. Do not include citations, bibliographies, or reading lists; I will supply those myself.
