answer: |-
  This is a sharp argument. You have effectively reconstructed the "Generalization Objection" to Frankfurt-style cases, but you've pushed it to its logical limit to show that it threatens to swallow all excuses, not just PAP.

  You are right to feel uneasy about Step 5. The diagnosis is that **Step 4 is the culprit.** It relies on an equivocation regarding *why* the agent could not have done otherwise.

  Here is the breakdown of where the move goes wrong, why it looked plausible, how to fix it without restoring PAP, and what this predicts for your stress tests.

  ### The Diagnosis: Reject Step 4

  **Step 4 claims:** *The absence of alternative possibilities is, in the Frankfurt case, nothing but a merely counterfactual fact. So: the absence of alternative possibilities is responsibility-irrelevant, period.*

  This step conflates the **modal status** (could/could not) with the **grounding** of that status (why they could/could not).

  *   **In the Frankfurt Case:** The absence of alternatives is grounded **counterfactually**. In the *actual sequence*, Jones has the ability to do otherwise; he simply never exercises it because he chooses X, and Black only acts if he chooses Y. The "could not" is a fact about nearby possible worlds, not the actual world's causal history.
  *   **In the Coercion/Addiction Cases (Step 5):** The absence of alternatives is typically grounded **actually**. The gun is *actually* at the teller's head. The addiction *actually* hijacks the deliberative process. The tumor *actually* compresses the lobe. These are facts about the *actual causal history*, not just nearby possible worlds.

  **Why Step 4 looked fine:**
  It looked fine because we often use "couldn't have done otherwise" as a shorthand for "excused." Your argument successfully shows that "couldn't have done otherwise" *simpliciter* is not the excusing factor. However, Step 4 illegitimately infers that because the *label* ("couldn't do otherwise") doesn't track responsibility in Frankfurt cases, the *underlying realities* that usually produce that label (coercion, manipulation) don't track responsibility either.

  **The Fix: The Actual Sequence View (Sourcehood)**
  You don't need to restore PAP. You need to adopt a **Sourcehood** or **Actual Sequence** view (associated with John Martin Fischer and Mark Ravizza).
  *   **Thesis:** Moral responsibility depends on the *source* of the action in the actual sequence (e.g., did it issue from the agent's own reasons-responsive mechanism?), not on the existence of alternative possibilities.
  *   **Application to Frankfurt:** Jones is responsible because the source is his own deliberation. Black is irrelevant to the actual sequence.
  *   **Application to Coercion:** The teller is *not* responsible (or less responsible) not because she lacked alternatives, but because the *actual source* of her action was the threat/fear, not her own uncoerced will. The "lack of alternatives" is a *symptom* of the actual coercion, not the *cause* of the excuse.

  By rejecting Step 4, you can maintain Step 1 (Jones is responsible) and reject Step 5 (Coerced agents are responsible) without contradiction. The "could not do otherwise" excuse works in coercion cases not because of the modal fact, but because the modal fact signals an **actual-sequence defect**. In Frankfurt cases, there is no actual-sequence defect.

  ### Pricing the Alternatives

  **Does this put PAP back on the table?**
  No. PAP says: *Responsibility requires Alternatives.*
  Your revised view says: *Responsibility requires Actual Sequence Control.*
  Sometimes Actual Sequence Control exists without Alternatives (Frankfurt). Sometimes Alternatives exist without Actual Sequence Control (e.g., a random spasm where you could have done otherwise, but the action wasn't "yours").
  So PAP remains false. You have simply identified that the *real* condition PAP was trying to capture was Sourcehood, not Alternatives.

  **Does it save the excuses?**
  Yes. Coercion, addiction, and tumors affect the *actual sequence*. They compromise the mechanism of agency. Frankfurt cases do not. Therefore, coercion excuses, but Frankfurt does not.

  ### Predictions for the Stress Tests

  Here is how the Actual Sequence diagnosis handles your variants. If this diagnosis is correct, it should yield crisp, asymmetric results for Black-lite and White.

  #### 1. Black-lite (Unreliable Intervener)
  *Setup:* Black intervenes in only 70% of nearby worlds where Jones decides otherwise.
  *Diagnosis:* Responsibility tracks the **Actual Sequence**.
  *Prediction:* Jones is **fully responsible**.
  *Reasoning:* In the actual world, Black does nothing. The actual causal history is identical to the original Frankfurt case. The *probability* of intervention is a counterfactual fact (a fact about nearby worlds), not an actual fact. Unless Jones *knows* about Black and deliberates under that knowledge (which would affect the actual sequence), the reliability of the counterfactual intervener is irrelevant to responsibility.
  *Implication:* Responsibility does not come in degrees here, even if "freedom" (in a modal sense) might. This might feel counterintuitive, but it is the cost of the Actual Sequence view. The "flicker" of freedom in the 30% of worlds doesn't change the actual source of the action.

  #### 2. White (Counterfactual Enabler)
  *Setup:* An actual mechanism blocks the alternative. White *would have* unblocked it if Jones tried, but Jones doesn't try.
  *Diagnosis:* Responsibility tracks the **Actual Sequence**.
  *Prediction:* Jones is **not responsible** (or has diminished responsibility) for the *omission* of the alternative, and potentially for the action if the block affects the actual choice.
  *Reasoning:* In the Frankfurt case, the "block" is counterfactual. In the White case, the "block" is **actual**. There is a mechanism in the actual world preventing the alternative. White's counterfactual willingness to help is irrelevant to the actual sequence, just as Black's counterfactual willingness to intervene was irrelevant.
  *Symmetry:*
  *   **Black:** Counterfactual Block + Actual Freedom = **Responsible.**
  *   **White:** Counterfactual Enable + Actual Block = **Not Responsible.**
  *Implication:* This confirms the asymmetry you sensed. Counterfactuals cannot remove actual freedom (Black), and counterfactuals cannot restore actual freedom (White). Only the actual sequence matters.

  ### Summary of the Move

  You should reject **Step 4**.

  *   **Why:** It equivocates between "Could not do otherwise due to counterfactual facts" (Frankfurt) and "Could not do otherwise due to actual facts" (Coercion).
  *   **Replacement:** "The absence of alternative possibilities is responsibility-irrelevant *when grounded purely counterfactually*. When grounded in actual constraints on the agent's mechanism, it is a marker for diminished responsibility."
  *   **Result:** You keep the Frankfurt intuition (PAP is false) without accepting the absurdity that coercion doesn't excuse. You move from a debate about *Alternatives* to a debate about *Sourcehood*.

  This preserves your reading group's focus on Frankfurt cases while preventing the argument from exploding into a general defense of hard determinism or incompatibilism about coercion.
