  Your list is mostly coherent Subject-Sensitive Invariantism (SSI), but Item 5 breaks it.

  **Tension Rank**
  1.  **Item 5 vs. Item 8 (Fatal).** Item 5 defines stakes as "what really hangs on it." The collector's bet *really* hangs on the letter's authenticity. If Item 5 stands, the bet destroys Marta's knowledge immediately, regardless of her ignorance. Item 8 says the bet is irrelevant. These cannot coexist.
  2.  **Item 1 vs. Item 3 (Manageable).** Your friend is wrong here. This is standard SSI: evidence fixes justification, but stakes raise the threshold for knowledge. You keep both.
  3.  **Item 6 vs. Item 7 (Low).** Stakes transmission and closure are compatible if the threshold rises for the whole deductive chain.

  **Equivocation Flag**
  You are using "stakes" in two senses. In Item 5, stakes are *worldly consequences* (the bet exists objectively). In Item 8, stakes are *agent-relative practical pressures* (what Marta is using the proposition for). Item 5 forces the bet to count; Item 8 requires it not to.

  **The Cut**
  **Drop Item 5.**
  Why? Item 8 is the scene. Item 5 is the abstraction. If stakes are objective worldly facts, Marta loses knowledge the moment the collector bets, making your scene impossible. To preserve the intuition that the bet is his business but the colleague's career is hers, stakes must be relative to the agent's practical situation, not the universe's causal web.

  **The Cost**
  You lose the "god's eye view" of knowledge. Marta's knowledge becomes dependent on her practical environment, not just metaphysical truth conditions. This makes knowledge more fragile but saves the drama. It aligns better with Item 1 anyway (stakes matter *to the knower*).

  **What Stays**
  Item 3 is fine. Your friend is wrong; evidence doesn't need to move for stakes to matter. Item 2 is fine; you're describing one property of knowledge (sensitivity to stakes), not changing the word's meaning. Item 4 follows naturally: if knowledge is the norm, and stakes affect knowledge, stakes affect assertion.

  **The Revision**
  Rewrite Item 5 to: **"Stakes are relative to the agent's practical situation."** This clears the bet (not her situation) while keeping the colleague (her professional action). It resolves the contradiction without sacrificing the scene or the bank-case intuition. Do this, and the scene writes itself: Marta speaks freely until her colleague's career enters the room, at which point the stakes shift *for her*, silencing her. The bet remains background noise.
