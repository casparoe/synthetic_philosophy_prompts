      *   *Step 3: Thresholds.* Define "Clear Go," "Clear No-Go," and "Ambiguity Zone."
      *   *Step 4: The Swing.* Place it as a footnote/sidebox. It answers "How fragile is the midpoint?" not "What is the risk?"
