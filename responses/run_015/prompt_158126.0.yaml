      *   **Aggregation:** How to combine 5 models + 2 experts?
          *   *Intersection:* Too fragile (empty 25% of the time).
          *   *Union:* Too conservative (might cover 0% to 100%).
          *   *Convex Hull (Envelope):* Best balance. Take the min of the lows and the max of the highs. It captures the full spread of credible opinion without implying consensus where none exists.
      *   **Model vs. Human Disagreement:**
          *   Models represent structural uncertainty (physics/params).
          *   Humans represent epistemic uncertainty (interpretation/experience).
          *   *Treatment:* Treat them as equal "sources" for the envelope. Distinguishing them mathematically adds complexity without changing the envelope much. Acknowledge the difference in the narrative, not the math.
      *   **Decision Rule:**
          *   *Maximin (Best of the Worst):* Too conservative for a public agency (cry wolf too often).
          *   *E-admissibility:* Too complex for a 30-min workflow.
          *   *Interval Dominance:* Good, but often leaves options undecided.
          *   *Gamma-Maximin (Hurwicz):* Weighted average of best/worst. Still feels like smuggling a prior.
          *   *Selection:* **Interval Dominance** is the most defensible legally/ethically for a public agency. If the *entire* interval is above the threshold, act. If *entirely* below, don't. If it straddles, you are in the "Zone of Ambiguity." This forces the value judgment to the surface.
          *   *Wait, actually:* For a public agency liable for flooding, **Maximin (Precautionary)** is often the legal standard, *but* the user says thresholds are set (15%, 30%). If the interval straddles 15%, Maximin says "Act." This might be too expensive.
          *   *Better Selection:* **Threshold Crossing Rule with Ambiguity Flag.** This isn't a pure IP rule, but it adapts IP to the existing thresholds.
          *   *Refined Selection:* Let's stick to the literature request. **Interval Dominance** is the standard "rational" choice under IP. However, for *public safety*, **Maximin** (protect against the worst credible case) is usually the mandate.
          *   *Compromise:* Use **Interval Dominance** for "No Action" vs "Action." If the *lowest* probability in the interval exceeds the threshold, Action dominates Inaction. If the *highest* is below, Inaction dominates. If it straddles, neither dominates. This pushes the decision to the Duty Officer. This fits the constraint: "values call has to be flagged as theirs."
      *   **The "Swing" Figure:** This is essentially a sensitivity analysis on a *point* estimate. It conflicts with the interval philosophy.
          *   *Solution:* Treat the Swing as a "Model Structural Uncertainty" metric attached to the *midpoint* for the Board's compliance, but keep the Interval as the decision driver. Don't let it shrink the interval.
      *   **Dilation:** When new data widens the interval.
          *   *Explanation:* Data ruled out the "middle" consensus, leaving only extreme views credible.
          *   *Memo Language:* "Data clarified that moderate scenarios are inconsistent with observations; remaining credible scenarios diverge."
      *   **Milburn Bend:** The user wants to buy easements. If the interval is [10%, 35%] and threshold is 30%.
          *   Interval Dominance says: Undecided.
          *   Duty Officer decides.
          *   This tests the user's bias.

