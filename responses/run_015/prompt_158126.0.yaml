answer: |-
  Here is a Standard Operating Procedure (SOP) designed for your constraints. It strips the philosophy down to engineering mechanics, isolates the value judgments for the Duty Officer, and complies with the Board's new directive without letting it corrupt the risk assessment.

  ### **SOP 4.2: Seasonal Flood Risk Estimation (Imprecise Probability Protocol)**

  **Purpose:** To generate defensible flood risk estimates that reflect model and expert disagreement without false precision.
  **Time Budget:** 30 minutes.
  **Owner:** Duty Officer (sign-off authority).

  ---

  #### **1. Aggregation: The Credal Envelope**
  Do not average. Do not seek consensus. You are mapping the territory of *credible* opinion, not finding the "true" number.

  *   **Inputs:** Collect the point estimates or ranges from all active hydrological models (4–5) and the independent ranges from the two senior hydrologists.
  *   **Calculation:**
      *   **Lower Bound ($P_{min}$):** The lowest non-zero probability provided by any credible source.
      *   **Upper Bound ($P_{max}$):** The highest probability provided by any credible source.
      *   **The Interval:** Report $[P_{min}, P_{max}]$.
  *   **Empty Intersection:** If the models/experts disagree so badly that their ranges do not overlap (e.g., Model A says 0–5%, Model B says 20–25%), **do not average.** Report the full span $[0\%, 25\%]$. This signals high structural uncertainty.
  *   **Model vs. Human:** Treat them identically. A senior hydrologist's judgment is a "model" of experience; a hydrological model is a "model" of physics. Distinguishing them mathematically invites weighting debates you cannot resolve in 30 minutes. If a source is an outlier (e.g., >50% deviation from the median of all sources), flag it in the notes, but keep it in the envelope unless technically discredited.

  #### **2. Decision Rule: Interval Dominance**
  We reject *Maximin* (always assume the worst) because it wastes public funds on low-probability events. We reject *Expected Utility* (averaging) because it hides risk. We adopt **Interval Dominance**.

  *   **The Logic:** An action (e.g., "Buy Easements") is only recommended if it is superior to inaction across the *entire* range of credible probabilities.
  *   **The Test:** Compare your Interval $[P_{min}, P_{max}]$ to the Board Threshold ($T$).
      *   **Clear Action:** If $P_{min} \ge T$. (Even the most optimistic model says act.)
      *   **Clear No-Action:** If $P_{max} \le T$. (Even the most pessimistic model says stand down.)
      *   **Ambiguity Zone:** If $P_{min} < T < P_{max}$. (The math cannot decide.)
  *   **Why this fits a Public Agency:** In a post-flood hearing, you cannot be faulted for averaging away a risk (false precision). You *can* be faulted for ignoring a credible worst-case. Interval Dominance creates a record that the risk was *known* to span the threshold. It forces the value judgment (cost of action vs. cost of flood) onto the Duty Officer, where it belongs.

  #### **3. The Board's "Swing" Figure**
  The Board's directive requires a sensitivity metric. This is technically a point-estimate concept, which conflicts with the Interval. To comply without corrupting the procedure:

  *   **Calculation:** Calculate the **Midpoint** ($P_{mid} = (P_{min} + P_{max}) / 2$). Identify the single most contested modeling assumption (e.g., soil saturation rate). Calculate how much $P_{mid}$ would shift if that assumption were fixed to its extreme plausible values.
  *   **Placement:** This number **does not** narrow your interval. It sits in a separate "Compliance Box" on the memo. It informs the Board about model fragility, not operational risk.
  *   **Warning:** If the Swing is larger than the Interval width, your models are unstable. Flag this.

  #### **4. Handling Dilation (Widening after Data)**
  Sometimes, new monitoring data widens the interval (e.g., from $[10\%, 20\%]$ to $[5\%, 30\%]$). This is **Dilation**. It happens because the data ruled out the "middle ground" models that previously created a false consensus, leaving only the optimistic and pessimistic extremes as credible.

  *   **Memo Language:** Do not write "We are less certain." Write: *"New monitoring data invalidated moderate scenarios. Remaining credible scenarios diverge. Risk envelope expanded to reflect resolved uncertainty."*
  *   **Action:** Treat the wider interval as the new truth. Do not revert to the prior.

  #### **5. The "No-Know" Admission**
  If the interval is too wide to be useful (e.g., $[5\%, 90\%]$), the recommendation is **"Defer."**
  *   **Memo Language:** *"Current credible estimates span the entire decision space. Action cannot be justified on probabilistic grounds. Recommend investment in targeted data collection [specify type] before next cycle."*
  *   **Sign-off:** The Duty Officer must sign this as "Risk Accepted: Status Quo."

  ---

  ### **The One-Page Memo Template**

  **TO:** Duty Officer
  **FROM:** Flood Risk Team
  **SUBJECT:** Seasonal Flood Risk Estimate – [Reach Name]
  **DATE:** [Date]

  **1. RISK INTERVAL (Operational)**
  *   **Estimated Probability of Exceedance:** **[ $P_{min}$% – $P_{max}$% ]**
  *   **Board Threshold for Action:** **$T$%**
  *   **Status:** [ **CLEAR ACTION** / **CLEAR NO-ACTION** / **AMBIGUITY ZONE** ]

  **2. DECISION REQUIRED (If Ambiguity Zone)**
  *   *Mathematical analysis does not dictate a course of action.*
  *   **Option A (Precautionary):** Act as if probability is $P_{max}$. Cost: $[Cost Estimate].
  *   **Option B (Efficiency):** Act as if probability is $P_{min}$. Cost: $[Cost Estimate].
  *   **Officer Decision:** [ ] Authorize Action [ ] Maintain Status Quo
  *   **Rationale (Required if Action taken in Ambiguity):** ___________________________________

  **3. BOARD COMPLIANCE (Sensitivity)**
  *   **Reference Point (Midpoint):** $P_{mid}$%
  *   **"Swing" Figure:** $\pm$ $X$% (Driven by: [Assumption Name])
  *   *Note: Swing figure is for legislative reporting only. Operational decision based on Risk Interval.*

  **4. TECHNICAL NOTES**
  *   **Sources:** [List Models/Experts]
  *   **Dilation Check:** [ ] Interval widened from prior due to data filtering.
  *   **Outliers:** [Note if any source was excluded or flagged]

  **SIGNATURE:** ___________________ (Duty Officer)

  ---

  ### **Case Studies**

  #### **Case 1: The Dilation Scenario (The "Bad" News)**
  *   **Context:** Early season estimate was $[12\%, 18\%]$. Threshold for pump pre-positioning is 15%. This was a "Clear Action" (Lower bound 12% < 15%? Wait, 12 < 15. This is Ambiguity. Let's say prior was $[16\%, 19\%]$ (Clear Action)).
  *   **New Data:** Soil moisture sensors come in. They are inconsistent with the "moderate" models. Only the "dry" model and the "wet" model remain credible.
  *   **New Interval:** $[8\%, 25\%]$.
  *   **The Problem:** The interval widened. The status flipped from "Clear Action" to "Ambiguity Zone."
  *   **The Memo:**
      *   **Risk Interval:** [8% – 25%]
      *   **Status:** AMBIGUITY ZONE.
      *   **Notes:** "New sensor data invalidated moderate hydrological models. Remaining credible scenarios diverge. Risk envelope expanded to reflect resolved uncertainty."
      *   **Decision:** Duty Officer must choose. If they choose "No Action" and the flood happens, the memo protects the *team* (we showed the 25% risk) but exposes the *Officer* (they chose efficiency over precaution).
      *   **Defense:** In a hearing, you testify: "The data told us the middle ground was a fantasy. We presented the full range of remaining risk. The Officer weighed the cost of pumps against a 25% max risk."

  #### **Case 2: The Milburn Bend (The Bias Check)**
  *   **Context:** You want to buy easements. Threshold is 30%.
  *   **Inputs:**
      *   Models: 18%, 22%, 25%, 20%.
      *   Senior Hydrologist A: 28%.
      *   Senior Hydrologist B: 24%.
  *   **Your Intuition:** "It feels like 30%. We should buy."
  *   **The Procedure:**
      *   $P_{min}$ = 18% (Model 1).
      *   $P_{max}$ = 28% (Hydrologist A).
      *   **Interval:** [18% – 28%].
      *   **Threshold:** 30%.
      *   **Test:** Is $P_{min} \ge 30\%$? No. Is $P_{max} \ge 30\%$? No.
      *   **Result:** **CLEAR NO-ACTION.**
  *   **Outcome:** The procedure kills the proposal. Even the most pessimistic credible source (Hydrologist A) is below the Board's threshold.
  *   **Why this helps you:** If you push for it anyway, you are arguing against your own team's data and the Board's threshold. If you don't push, and a flood happens, you are protected: "No credible model reached the action threshold." The procedure prevents you from smuggling your intuition into the math.

  #### **Case 3: The Straddle (The Daily Grind)**
  *   **Context:** Industrial shutdown threshold is 15%.
  *   **Inputs:** Models range 10% to 20%.
  *   **Interval:** [10% – 20%].
  *   **Status:** AMBIGUITY ZONE.
  *   **Memo:**
      *   **Option A (Shutdown):** Cost $500k. Avoids flood loss $10M.
      *   **Option B (Wait):** Cost $0. Risks flood loss $10M.
      *   **Officer Decision:** [X] Maintain Status Quo.
      *   **Rationale:** "Economic impact of shutdown outweighs risk at lower bound of interval."
  *   **Defense:** You do not defend the probability. You defend the *process*. "We informed the Officer that the risk could be as high as 20%. They determined the economic cost of shutdown was too high for that level of risk."

  ---

  ### **Honest Limitations (For the Director)**

  1.  **Judgment in a Lab Coat:** The choice of the **Envelope (Min/Max)** is a judgment. It assumes every model/expert is *credible*. If one model is known to be broken, excluding it is a judgment. We minimize this by only including vetted models.
  2.  **What IP Can't Do:** Imprecise probabilities cannot tell the Duty Officer what to do in the Ambiguity Zone. That is not a math problem; it is a political and economic one. This procedure does not solve the hard choice; it ensures the hard choice is made by the person with the authority, not the person with the calculator.
  3.  **The Swing Figure:** It is a compliance artifact. It treats uncertainty as a point estimate sensitivity. It is mathematically inconsistent with the Interval. We include it to satisfy the Board, but we isolate it so it does not infect the operational decision.

  ### **Implementation Plan**
  1.  **Update Software:** Modify the reporting script to output Min and Max instead of Mean.
  2.  **Brief the Board:** Explain that "Single Number" reporting is being retired to reduce liability. The "Swing" figure satisfies their need for sensitivity tracking.
  3.  **Train Duty Officers:** They need to understand that "Ambiguity Zone" means *they* must sign the rationale, not just the number.

  This procedure gives you a defensible shield. It turns "we don't know" from a failure into a documented state of risk that transfers the decision liability to the appropriate authority.
