      *   *Interval Dominance* is the most legally defensible because it admits uncertainty rather than hiding it behind a weighted average. It creates a record that the risk was *known* to be ambiguous.

      *Let's finalize the "Swing" placement.* It is a sensitivity metric on the *centroid*. It belongs in the "Technical Appendix" or a specific "Board Compliance" line, distinct from the "Risk Interval."

      *Let's finalize the "Dilation" explanation.* It's not "we are more confused." It's "the data eliminated the moderate models, leaving only the optimistic and pessimistic ones."

      *Let's finalize the "Model vs Human" aggregation.* Treat them identically in the envelope. Distinguishing them requires weighting which is subjective. The envelope is the "Union of Credible Views."

