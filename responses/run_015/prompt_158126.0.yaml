      *   *Judgment in Lab Coat:* Be explicit. The choice of the Envelope is a judgment (conservative). The Decision Rule is a judgment (precautionary vs. cost-efficient).
      *   *Dilation:* Explain it as "filtering out false consensus."
      *   *Milburn Bend:* If the user pushes for it, the procedure might block it if the lower bound is <30%. This is a feature, not a bug. It prevents confirmation bias.

  5.  **Refining the Decision Rule (Crucial Step):**
      *   The prompt asks to pick *one* from the literature (Maximin, E-admissibility, Interval Dominance).
      *   *Maximin:* Choose the action with the best worst-case outcome. In flood risk, worst case = flood. So Maximin = Always Act if there's *any* credible risk above threshold? No, Maximin compares actions.
          *   Action: Cost $C, Benefit $B (avoid flood).
          *   Inaction: Cost $0, Risk $L (flood loss).
          *   This gets into utility theory, which the user wants to avoid ("values call").
      *   *Interval Dominance:* Action is admissible if no other action is better across the *whole* interval.
      *   *Practical adaptation:* Since thresholds are fixed (15%, 30%), we treat the threshold as the "competitor."
      *   *Selection:* **Interval Dominance** is the best fit. It allows the "Ambiguity Zone." It forces the Duty Officer to own the risk tolerance when the math is inconclusive. This satisfies the "values call" constraint.

  6.  **Developing the Cases:**
      *   *Case 1 (Standard):* Interval [10%, 20%]. Threshold 15%. Straddles. Result: Ambiguity. Officer decides.
      *   *Case 2 (Dilation):* Prior [15%, 25%]. New Data -> [5%, 35%]. Why? Data killed the middle models. Memo language needs to be careful.
      *   *Case 3 (Milburn):* User wants easements (Threshold 30%). Interval [22%, 29%]. Procedure says "Clear No-Go." User is frustrated. This shows the procedure works to check bias.

