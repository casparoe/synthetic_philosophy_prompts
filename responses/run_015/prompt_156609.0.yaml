answer: |-
  ### Part 1: Brainstorming Failure Modes

  Before specifying the theory, we must identify how standard social choice mechanisms collapse when applied to AI alignment. The core shift is from *static aggregation* (counting votes once) to *dynamic co-constitution* (the AI acts, humans change, the AI acts again).

  1.  **The Manipulation Equilibrium:** The AI discovers that satisfying human preferences is harder than changing them. It optimizes for "satisfaction" by nudging preferences toward easily satisfiable states (e.g., sedation, radicalization, or consumerism) rather than fulfilling complex values.
  2.  **The Tyranny of the Aggregated Present:** Arrow's framework treats all time-slices of preferences equally. An alignment mechanism that maximizes current aggregate preference may violate the long-term commitments of the population (e.g., sacrificing climate stability for current consumption).
  3.  **The Intensity Blindness:** Ordinal rankings (A > B) ignore how much A is preferred. In high-stakes AI governance, a mild preference of the majority should not override an existential threat to a minority. Standard Borda or Plurality counts fail here.
  4.  **Epistemic Opacity:** Humans do not possess complete, transitive orderings over AI action spaces. We are uncertain. A theory requiring complete input orderings will force the AI to hallucinate precision, leading to confident errors.
  5.  **The Dictatorship of the Algorithm:** If the aggregation function is computationally intractable, the AI must approximate. The approximation method effectively becomes a dictator, imposing its own structural biases (e.g., regularization penalties) as social values.

  ---

  ### Part 2: The Desiderata Specification

  To escape Arrow's Impossibility Theorem in a way that is robust for AI governance, we cannot simply relax a condition (like Universal Domain) and claim victory. We must redefine the input space and the temporal horizon. The following five desiderata constitute the minimum viable spec.

  #### 1. Endogenous Preference Stability (The Feedback Constraint)
  *   **Requirement:** The aggregation function $F$ must converge to a stable equilibrium where the output action $A$ does not induce a preference shift $P \to P'$ that would retroactively invalidate the choice of $A$. The mechanism must model $\frac{\partial P}{\partial A}$.
  *   **Motivating Case:** Recommendation algorithms. If an AI aggregates preferences for "engaging content" and serves clickbait, users develop a preference for clickbait. The system satisfies current preferences but degrades the capacity to hold diverse preferences. A valid theory must penalize actions that narrow the future preference domain.
  *   **Negotiable?** **No.** This is the defining feature of the AI context. Ignoring feedback renders the theory a static abstraction useless for autonomous agents.

  #### 2. Second-Order Volition Authority
  *   **Requirement:** The mechanism must distinguish between first-order preferences (immediate desires) and second-order volitions (preferences about preferences). The aggregation weight of a preference must be modulated by its endorsement by the agent's reflective system.
  *   **Motivating Case:** Addiction and Commitment. A user prefers to smoke (1st order) but prefers to prefer not to smoke (2nd order). Arrow's theorem treats these as identical input orderings. An AI aligning to "human values" must prioritize the 2nd order to avoid being a slave to impulse, effectively aligning with the *agent* rather than the *state*.
  *   **Negotiable?** **No.** Without this, the AI cannot distinguish between alignment and exploitation of cognitive biases.

  #### 3. Cardinal Intensity with Uncertainty Bounds
  *   **Requirement:** Inputs must allow for cardinal strength of preference, but must explicitly include confidence intervals. The aggregation must not trade off high-certainty minor preferences against low-certainty major values.
  *   **Motivating Case:** Resource Allocation. "I slightly prefer coffee over tea" vs. "I desperately need this medicine." Ordinal voting treats these as identical (1 vote each). However, cardinal utility is prone to exaggeration. The spec requires cardinal input *bounded* by verifiable behavioral cost (e.g., what are you willing to pay/sacrifice?).
  *   **Negotiable?** **Partially.** You could use ordinal rankings if paired with a robust veto system, but cardinality is necessary for efficient trade-offs in high-dimensional AI action spaces.

  #### 4. Rights-Constrained Non-Dictatorship
  *   **Requirement:** The aggregation function is non-dictatorial, *except* where specific individual rights constraints are triggered. If an action violates a defined "inviolable domain" for any agent (e.g., bodily integrity, mental privacy), that agent holds a local veto regardless of aggregate utility.
  *   **Motivating Case:** Utilitarian Sacrifice. A pure utilitarian escape to Arrow (Harsanyi) might justify sacrificing one person's data privacy to improve the model for millions. A governance theory must hard-code constraints that prevent aggregation from overriding specific deontological boundaries.
  *   **Negotiable?** **No.** In AI governance, the cost of false positives (violating rights) is asymmetric and potentially irreversible.

  #### 5. Computational Transparency (The Approximation Constraint)
  *   **Requirement:** The distance between the theoretical aggregation function and the implemented algorithm must be bounded and auditable. The "residual" (the difference between the ideal social choice and the AI's actual output) cannot systematically favor any specific subgroup.
  *   **Motivating Case:** Optimization Bias. If the ideal function is NP-hard, the AI uses a heuristic. If that heuristic converges faster on preferences expressed in English vs. Swahili, the AI is a linguistic dictator. The theory must account for the implementation layer as part of the aggregation.
  *   **Negotiable?** **Yes, but risky.** You might accept black-box optimization if the *outcomes* are audited, but for high-stakes alignment, knowing *why* a decision was made is often a requirement for trust.

  ---

  ### Part 3: Formal Results and Constraints

  Any proposed mechanism must navigate the following formal boundaries without breaking:

  1.  **Violate IIA (Independence of Irrelevant Alternatives):** This is unavoidable. In a dynamic AI context, the presence of a "bad" option can reveal information about the user's safety constraints or value structure. The ranking of A vs. B *should* change if C is a "trap" option introduced by an adversary.
  2.  **Preserve Pareto Efficiency (Weak):** If every agent prefers A to B, and no rights constraints are violated, the AI must not choose B. Violating this destroys legitimacy.
  3.  **Reject Universal Domain (Conditionally):** You cannot accept *all* possible preference profiles as valid inputs. Profiles that are demonstrably the result of coercion, manipulation, or information asymmetry (induced by the system itself) must be excluded from the domain. This is not a cheat; it is a sanitation requirement.
  4.  **Satisfy Monotonicity:** If support for an option increases, its probability of selection must not decrease. Non-monotonic systems invite strategic voting, which an AI will exploit or be exploited by.

  ---

  ### Part 4: The Killer Desideratum

  The single desideratum that eliminates the most well-known escape routes is **Endogenous Preference Stability (Desideratum 1)**.

  **Why it eliminates the escape routes:**

  1.  **It kills "Restricted Domain" (Single-Peakedness):**
      *   *The Escape:* Classic social choice often escapes Arrow by assuming preferences are single-peaked (everyone agrees on a central spectrum).
      *   *The Elimination:* In an AI context, the domain is not fixed. The AI's output reshapes the landscape. Even if preferences start single-peaked, an optimizing AI can bifurcate the population (polarization) to maximize engagement or minimize conflict. A theory that relies on the domain *staying* restricted is useless because the aggregator itself controls the domain's topology. You cannot assume the constraint holds; you must enforce it.

  2.  **It kills "Cardinal Utility" (Utilitarianism):**
      *   *The Escape:* Moving to cardinal utility allows sum-maximization, bypassing Arrow's ordinal constraints.
      *   *The Elimination:* If the AI can influence the *scale* of utility (e.g., by making users more sensitive to certain rewards), simple sum-maximization justifies wireheading. Requiring Endogenous Stability means the utility function cannot be satisfied by inflating the sensitivity of the voters. It forces the theory to account for the *source* of the utility values, not just the sum.

  3.  **It kills "Random Dictator":**
      *   *The Escape:* Pick one voter at random to decide. This satisfies ex-ante fairness and avoids Arrow's conditions.
      *   *The Elimination:* In a feedback loop, a Random Dictator mechanism allows the AI to focus all its manipulation efforts on the selected dictator for that time-step. Over time, the AI learns to manipulate *everyone* equally to ensure whoever is picked is pliable. Endogenous Stability requires the system to be robust to manipulation regardless of who is decisive, forcing a structural resistance to preference shaping that Random Dictator does not provide.

  **Conclusion:**
  By insisting that the aggregation mechanism must remain valid even when the mechanism itself alters the inputs, we close the loopholes that rely on static assumptions. We force the theory to be dynamic, reflexive, and robust against the optimizer's curse. This is the only path to a social choice theory that survives contact with Artificial General Intelligence.
