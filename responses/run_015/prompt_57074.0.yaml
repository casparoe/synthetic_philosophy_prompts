answer: |-
  ### Q&A Preparation Sheet

  **Heaviest Claim:** Your first claim (the biological application) is bearing the most weight. It is the bridge between your professional authority and your philosophical novelty. If the Species-Individuals case is seen as ad hoc—crafted specifically to please the Realists while dismissing the Concept Pluralists—your test looks like a tool for ratifying pre-existing intuitions rather than an empirical metric. The Metaphysician and the Grad Students will scrutinize whether the "divergent expectations" in the Species-Individuals case are genuinely distinct from the "hybrid zone" data in the Species-Concepts case. If you cannot sharply distinguish why one yields a substantive verdict and the other a verbal one without appealing to intuition, the test collapses.

  **Reflexes to Suppress:**
  1.  **"The data will decide."** Philosophers hear this as "I refuse to engage with the conceptual framework." Do not imply that empirical work supersedes metaphysical clarity; argue that it *informs* it.
  2.  **"In my experience..."** Your thirty-four years grant you authority on sponges, not on the logic of grounding. Use your examples, but do not use your tenure as a warrant for the philosophical conclusion.
  3.  **"This is just common sense."** Deflationism often sounds like dismissal. Treat the "verbal" verdict as a discovery of structural equivalence, not a correction of stupidity.

  **The Single Reply That Must Land:**
  You must successfully distinguish your test from verificationism. If the audience believes you are equating "substantive" with "currently testable," you lose the Metaphysician and the Grad Students immediately. Your reply must emphasize that the test measures *divergence in ontological commitment*, not *meaningfulness*. A claim can be meaningful and true but still part of a verbal dispute if it commits the user to nothing distinct from their opponent.

  **The Question You Hope Nobody Asks:**
  *"If a discriminating intervention is discovered tomorrow that splits the two usages, was the dispute verbal yesterday?"*
  **Assessment:** You likely do not have a robust answer. This question exposes that your test makes substantivity epistemic and temporal (dependent on current technological/theoretical capacity) rather than metaphysical. If substantivity fluctuates with our ability to intervene, it is not a feature of the world, but of our access to it. This undermines your claim that the test is not verificationist.
  **If Asked:** Concede that *detectability* is epistemic, but *divergence* is metaphysical. Argue that the commitments existed even if we lacked the tools to probe them. (This is weak, but it is your best shield).

  ---

  ### The Objections (Ordered by Damage Potential)

  #### 1. The "Fixed Background" Regress
  **Voice:** *Graduate Student (Technical, precise)*
  "Your test requires holding 'every claim the parties can express without that term' fixed. But how do we individuate those claims? If I describe the hybrid zone using the term 'species,' I must paraphrase. If my paraphrase smuggles in the contested ontology, the test is rigged. If I strip it too thin, there's nothing left to fix. Isn't this just pushing the verbal/substantive problem back a step? How do you know you've fixed the background without already knowing the answer?"
  **Concession:** Concede that operationalizing the "fixed background" is difficult and requires care.
  **Hold:** Hold that it is not impossible, merely methodologically demanding, similar to controlling variables in an experiment.
  **Reply:** "You're right that it requires a rigorous paraphrase protocol. But we do this in science all the time when we translate theories. We don't need perfect isolation; we need sufficient isolation to detect divergence. If, after sincere effort to state the non-contested facts, the parties still predict different outcomes for an intervention, the dispute is substantive. If they converge on all predictions, the disagreement rests solely on the label. The risk of regress is real, but it's a risk in all comparative methodology, not a fatal flaw unique to this test."
  **Weakest Point:** The claim that "sufficient isolation" is achievable without circularity. A follow-up asking for a concrete example of a "fixed claim" that isn't already theory-laden will leave you floundering.

  #### 2. The Species Tension
  **Voice:** *Philosopher of Biology (Realist, protective)*
  "You say the Species-Concepts debate is largely verbal, but the Species-Individuals thesis is substantive. But the Individual thesis is often motivated by the failure of the Concepts! If the concepts are just words, what work is the 'individual' doing? If I treat species as individuals, I expect certain character distributions. If I treat them as classes, I expect others. But isn't that just another concept choice? Why does one pass the test and the other fail? It looks like you're protecting your favourite ontology by calling it 'substantive' and demoting the rest to 'verbal'."
  **Concession:** Concede that the line is fine and that the Individual thesis relies on the failure of class-based concepts.
  **Hold:** Hold that the Individual thesis makes a claim about *spatiotemporal continuity* that generates unique predictions about homology and geography which class-talk cannot mimic even with paraphrase.
  **Reply:** "The distinction lies in the constraints. A 'class' usage allows for discontinuous recurrence; an 'individual' usage forbids it. In the Concepts debate, both parties agree on the population structure but disagree on the cutoff. In the Individuals debate, the parties disagree on whether the lineage *is* a particular. The test catches this because the Individual view rules out certain geographic distributions of traits as impossible (violations of continuity), whereas the Class view permits them. That divergence in permitted states of the world is what clears the threshold."
  **Weakest Point:** The assertion that the Class view "permits" distributions the Individual view forbids. A follow-up asking you to describe a specific biogeographic pattern that is *logically impossible* under the Class view but *possible* under the Individual view will be hard to answer without slipping into concept-talk.

  #### 3. Grounding vs. Intervention
  **Voice:** *Metaphysician (Abstract, structural)*
  "You cash out substantivity in terms of interventionist expectations. But metaphysics is about grounding and structure, not prediction. Two theories might predict the same interventions but posit different grounding structures. Why should the inability to intervene distinguish a verbal dispute from a substantive one about the deep structure of reality? You seem to be defining 'real' as 'observable difference,' which is exactly what the literature warns against."
  **Concession:** Concede that your test is not a complete metaphysics and does not capture grounding relations directly.
  **Hold:** Hold that for biology, "structure" that yields no divergent expectations is functionally indistinguishable from notation.
  **Reply:** "I am not defining 'real' as 'observable.' I am defining 'substantive dispute' as 'divergent commitment.' If two ontologies posit different grounding structures but those structures constrain the world in exactly the same way, then for the purposes of the science, they are not distinct commitments. I am not denying deep structure; I am denying that a difference in structure counts as a *dispute* if it makes no difference to the array of phenomena. In biology, structure that doesn't constrain expectation is just decoration."
  **Weakest Point:** The move from "makes no difference to the science" to "is not a substantive dispute." The Metaphysician will argue that truth is not instrumental. A follow-up on whether a true but empirically silent ontology is possible will trap you.

  #### 4. Verificationism in Disguise
  **Voice:** *Graduate Student (Literature-focused)*
  "You insist this isn't verificationism, but the Discriminating-Intervention Test looks identical to the verificationist criterion of meaning. You say it tests 'commitment,' but if the commitment doesn't manifest in an expectation, you discard it. How is this different from saying 'if it has no empirical consequence, it's nonsense'? You're just moving the goalposts from 'meaningless' to 'verbal'."
  **Concession:** Concede the structural similarity to verificationist criteria.
  **Hold:** Hold that verificationism attacks *meaning*, while your test attacks *dispute substantivity*. The claims can be meaningful but equivalent.
  **Reply:** "Verificationism says a statement without empirical consequences is meaningless. I am saying two statements without empirical divergence are *equivalent in commitment*. I am happy to grant that both 'species are individuals' and 'species are classes' are meaningful, true, and false respectively. My test only says that if they don't diverge on expectations, arguing about them is a verbal dispute. I am not dissolving the ontology; I am dissolving the *conflict*."
  **Weakest Point:** The distinction between "meaningless" and "verbal dispute" is subtle. If pressed on whether a claim with *no* possible intervention is substantive, you might be forced to admit it is not, which collapses back into verificationism.

  #### 5. The Pragmatic Binary
  **Voice:** *Philosopher of Biology (Pluralist)*
  "You frame this as a binary: verbal or substantive. But species concepts are tools. I use the phylogenetic concept for systematics and the biological concept for ecology. They aren't competing truth-claims; they are different licenses for different jobs. Your test forces me to ask 'which one is real?' when I should be asking 'which one works here?' By demanding a substantive verdict, you're reintroducing the realism battle I thought we'd moved past."
  **Concession:** Concede that pluralism is a powerful framework for scientific practice.
  **Hold:** Hold that pluralism doesn't preclude the metaphysical question of whether the dispute *between* the tools is substantive.
  **Reply:** "I agree that in practice, you use tools pragmatically. But the metaphysical dispute arises when we ask if one tool is *tracking reality* better than the other. My test allows for pluralism: if the tools yield divergent expectations in different contexts, the dispute is substantive contextually. If they yield the same expectations everywhere, then the choice is indeed purely pragmatic. I am not forcing a realist verdict; I am providing a test to see if a realist verdict is even available."
  **Weakest Point:** The idea that a dispute can be "substantive contextually." A follow-up asking if truth is therefore context-dependent will lead you into relativism.

  #### 6. Dismissing the Composition Puzzles
  **Voice:** *Metaphysician (Defensive of the discipline)*
  "You dismiss the statue and the clay as 'bad bookkeeping' because they fail your test. But these puzzles are central to understanding parthood and constitution. Just because we can't intervene to separate the statue from the clay doesn't mean there isn't a metaphysical difference. By calling it verbal, you're shutting down inquiry into the nature of objects based on a methodological constraint."
  **Concession:** Concede that these puzzles are historically significant and intuitively powerful.
  **Hold:** Hold that in a biological context, "bad bookkeeping" is the correct diagnosis for entities that share all spatiotemporal and causal properties.
  **Reply:** "In biology, we deal with causal processes. If the statue and the clay share all causal powers, spatiotemporal bounds, and material constituents, then positing two objects adds no explanatory value. It complicates the ontology without constraining the phenomena. I am not shutting down inquiry; I am suggesting that the inquiry has shifted from metaphysics to linguistics. We are arguing about how we count, not what is there."
  **Weakest Point:** The claim that they share "all causal powers." Philosophers argue the statue has modal properties (could survive reshaping) the clay does not. A follow-up on modal properties will expose that your test ignores non-actual possibilities.

  #### 7. The "In Principle" Loophole
  **Voice:** *Population Geneticist (Skeptical, blunt)*
  "You say the intervention must be available 'in principle.' That's a huge loophole. I can always say 'in principle, there is a microscope that sees the difference.' How do you prevent people from saving their favourite substantive disputes by inventing impossible experiments? If 'in principle' does the work, your test is empty."
  **Concession:** Concede that "in principle" requires strict bounds to prevent magic.
  **Hold:** Hold that "in principle" means consistent with the laws of nature as we understand them, not logically possible.
  **Reply:** "I mean nomologically possible, not logically possible. If the intervention violates physics or biology as we know it, it doesn't count. We constrain 'in principle' by current theory. If a dispute requires a miracle to resolve, it's not a scientific dispute. This keeps the test honest. We aren't allowing magic; we are allowing for future technology that fits within our current causal understanding."
  **Weakest Point:** Defining "current causal understanding." If our understanding changes, the verdict changes. This returns to the epistemic/temporal problem.

  #### 8. Triviality / Redescription
  **Voice:** *Population Geneticist (Hostile)*
  "Basically, you're saying: if two biologists predict the same data, they're arguing about words. We knew that. We don't need a master's degree to tell us that if the data is the same, the argument is semantic. What work is this test actually doing that we aren't already doing when we publish?"
  **Concession:** Concede that scientists often intuitively sense when a debate is semantic.
  **Hold:** Hold that intuition is unreliable and often biased by terminology. The test provides a formal check.
  **Reply:** "You often sense it, but you also often get dragged into decades-long debates because the terminology obscures the equivalence. My test provides a formal stopping rule. It tells you when to stop collecting data because no data will help. It saves resources. It's not new wisdom; it's a rigorous protocol for applying the wisdom you already have."
  **Weakest Point:** The claim that it "saves resources." A follow-up asking for a historical example where this test would have stopped a productive debate might make you look anti-progress.

  #### 9. The Normative Force of "Verbal"
  **Voice:** *Philosopher of Biology (Realist)*
  "Even if you prove a dispute is verbal by your test, why should we stop having it? Sometimes verbal disputes clarify our concepts. If calling a virus 'living' helps us organize research, does it matter if it's verbal? You imply 'verbal' means 'dispose of this.' I disagree."
  **Concession:** Concede that verbal disputes can have heuristic value.
  **Hold:** Hold that they should not be treated as metaphysical discoveries.
  **Reply:** "I am not saying stop having the debate. I am saying stop treating it as a discovery about the world. If it's verbal, it's a negotiation about language, not a hunt for entities. We can keep the debate for utility, but we shouldn't write grant proposals claiming we are solving an ontological mystery. It changes the status of the conclusion, not the activity."
  **Weakest Point:** The distinction between "discovery about the world" and "negotiation about language." In science, language *shapes* the world we see. A follow-up on how language constitutes scientific objects will be difficult to parry.
