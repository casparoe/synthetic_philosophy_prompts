  ### The setup: agents and omissions

  Stipulated facts: 15-20 miles distant, rockets seen, radio off. Candidates include Wireless Operator Evans (omission: shutting set/sleeping), Officer Stone (omission: not waking Captain), Captain Lord (omission: not ordering movement), and White Star/Marconi (omission: no night watch policy). Structural norms matter too: industry standard allowed radio silence. Other ships form a background contrast; those too distant lacked capacity. This maps levels from individual acts (sleeping) to systemic rules (scheduling). The chain links radio silence to missed calls, watch silence to missed visuals, and policy to operator absence. Each link is a potential causal node where intervention could have altered the outcome, creating a layered network of non-actions spanning personnel to corporate governance.

  ### But-for and where it over-generates

  The but-for test asks: would the deaths have occurred if this agent had acted? For Evans, Stone, and Lord, the answer is likely no. But the test over-generates. But for the ice? But for any other ship not being closer? But for the operator's parents having him? Strictly, all are causes. You ask if excluding distant ships is a bug or moral smuggling. It is likely both. Metaphysically, it's a bug; too many differences make the concept useless. Pragmatically, we filter based on expectation. We exclude distant ships not because they physically couldn't matter (maybe a faster ship could have made it), but because we don't expect them to be there. This reveals that bare physics isn't doing the work; expectation is. We accept some but-for causes and reject others based on duty, not just difference-making. The over-generation forces us to admit that causal selection is not neutral. Even 'could have done anything' includes people with no idea a ship was sinking. We exclude them because causation here tracks responsibility, not just counterfactual dependence. The bug is features, not bugs, of moralized causation. If we treat causation as purely physical, everyone is a cause. If we treat it as practical, we must smuggle in norms to limit the field. Your suspicion is correct: the filter is moral. The theory cannot distinguish the Captain from a random ship 100 miles away without importing expectations about who *should* have been watching.

  ### Mechanism, defaults, and the normativity worry

  Mechanism problem: Omissions are absences. No energy transfer from 'not waking.' How does nothing push reality? Solution often invokes defaults. Was sleeping the default? In 1912, yes for cargo. If default = cause, then no causation. If norm = cause, then causation changes when rules change. This implies causal verdicts depend on norms. If we say Lord caused deaths only because we now expect watches, causation is normative. This worries philosophers who want causation to be mind-independent. The *Californian* suggests omission causation is inherently tied to what agents *should* have done, blurring is/ought. If the baseline is statistical (what usually happens), Lord isn't a cause. If the baseline is prescriptive (what should happen), he is. Since inquiries treated him as a cause despite standard practice, they used a prescriptive baseline. This confirms the normativity worry: causal claims here rely on moral/legal standards, not just physical processes. The 'nothing happened' complaint is sidestepped by focusing on the expectation of something happening. Causation becomes a violation of expectation, not a physical push. This means the causal verdict changes if the norm changes. If night watches were standard then, Lord's omission is a deviation (cause). If not, it's background (non-cause). Since inquiries ruled against him despite custom, they imposed a new norm retrospectively. Thus, the causal judgment is not stable across time; it shifts with moral/legal expectations. The metaphysics of omission cannot be separated from the ethics of duty.

  ### Testing the liveness idea

  Your 'liveness' idea: Action must be on the agent's menu. Existing lit calls this 'ability' or 'control' conditions (e.g., an agent must be able to do otherwise). Your framing is fresh. Applied: Evans (live), Stone (live), Lord (live). Company (less live in moment). Distant ships (not live—too far). Saves immediate agents, excludes impossibilities. The break point: Willful blindness. If Lord trained himself to ignore rockets, is waking him 'live'? If liveness is psychological, he escapes. If liveness is normative (he *could* have been trained), he stays. Your idea needs an objective 'reasonable agent' standard to avoid letting culpable ignorance off the hook. Otherwise, the worst actors define their own causal irrelevance. The 'live menu' must include what the agent *should* have had on their menu. This overlaps with existing 'ability' constraints but your emphasis on realistic possibility is distinct. It saves the theory from requiring impossible rescues (helicopters) but risks excusing negligence if 'live' is purely subjective. To work, liveness must be objective: could a competent agent in this position have acted? If so, the omission is causal, even if this specific agent felt incapable. This presses hard on your self-induced ignorance worry. If I train myself not to see needs, is seeing 'live'? If yes, your theory holds. If no, it fails. The literature usually says yes (objective ability), so your idea survives if you adopt that stance. But you must admit 'live' isn't just what the agent thinks is possible; it's what was reasonably available.

  ### What the case does back to the theory

  Retrospective rules: Duties created after. Does this make causation retrospective? Yes. We call it a cause now to justify new rules. It suggests omission causation is interest-relative: we select omissions that help us regulate future behavior. It's blame allocation disguised as metaphysics. Where theory goes silent: Quantifying deaths. We can't say 'Lord caused 50 deaths' because rescue capacity is unknown. The theory handles binary causation (did he cause *some* deaths?) but struggles with magnitude. The case shows causal claims here serve safety regulation, not just historical description. We label the omission a cause to prevent recurrence. This implies causal judgments are tools for social control. If the goal is prevention, we highlight omissions that are fixable. If the goal is pure description, the omission is just an absence. The *Californian* episode suggests we use causation to assign responsibility for system failures. The silence on exact numbers shows the limits of counterfactuals in complex scenarios. We know deaths would be fewer, but not how many. Theory accepts 'caused harm' but cannot model the precise counterfactual world. This uncertainty doesn't stop blame, suggesting the causal claim is robust enough for regulation even if metaphysically vague. The inquiry's verdict was less about physics than policy. By calling the omission a cause, they legitimized new laws. This confirms causation here is retrospective and interest-relative. We decide what caused the disaster based on what we want to stop from happening again. The apparatus goes silent on specific counts because the counterfactual is too fuzzy, but loud enough on liability to change maritime law.

  ### Settled vs. contested

  Settled: But-for over-generates (agreed). Omissions *can* be causes in some sense (legal/moral). Pure physicalism struggles. Contested: Whether omission causation is metaphysically real or just pragmatic/moral. Whether norms constitute the causal relation or just select causes. Your 'liveness' overlaps with 'ability' conditions (existing), but the specific formulation is yours. No consensus on whether norms *make* it causal or just *highlight* it. I am guessing that most agree norms play a role, but disagree on whether that invalidates causation as a physical relation. Some say omissions are real relations; others say they are shorthand for expectations. The literature does not settle if the *Californian* case proves causation is normative or just that our *judgments* are. Most agree the distinction is blurry. I cannot claim consensus on the metaphysics; it remains fought over. Your intuition that norms are involved is shared, but the implication (that causation is therefore not 'real') is contested.

  ### Bottom line

  The *Californian* shows omission causation isn't pure physics; it's entangled with duty. Your liveness idea filters well but needs normative teeth to handle willful ignorance. Ultimately, calling these omissions causes is less about describing the past than regulating the future. Causation here is a tool for safety, not just a mirror of reality. The case proves that without norms, omission causation collapses into everything-or-nothing. We need the norms to make sense of the history.
