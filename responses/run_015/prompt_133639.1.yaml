answer: |-
  This is a classic collections ethics dilemma: you are navigating the tension between artistic value, historical truth, and human dignity, with inconsistent precedents. You are right to suspect that your minutes do not pin down a single coherent policy. Instead, you are operating under three competing implicit rules that surface depending on the specific constellation of harm, ownership, and stakeholder presence.

  Here is the breakdown of the rules derived from your five precedents, how they apply to Tuesday's decision, and the critical fact you need to resolve the conflict.

  ### 1. The Implicit Rules

  **Rule A: The "No Living Harm" Principle (Precedents 1 & 4)**
  *   **Derivation:** In Case 1 (Tapestries) and Case 4 (Photographer), the institution refused acquisition/display.
  *   **The Logic:** If the creation of the object involved direct coercion, suffering, or dignity violations, *and* there are living victims or descendants who object, the moral cost outweighs the artistic or historical value. The object is tainted by its genesis.
  *   **Application to Tuesday:** This rule demands **Store** or **Defer**. The casts were made under duress (shackled, awaiting execution). The "nobility of their fear" note confirms the sculptor viewed their suffering as aesthetic material. If the descendants object (as in Case 4), displaying them is a continuation of that exploitation.

  **Rule B: The "Separation of Art and Sin" Principle (Precedents 2 & 3)**
  *   **Derivation:** In Case 2 (Painter) and Case 3 (Composer), the institution accepted/displayed normally.
  *   **The Logic:** If the artist was morally compromised but the *object itself* does not depict the harm, and all direct stakeholders are deceased, the art stands on its own. The biography is tragic context, not a veto.
  *   **Application to Tuesday:** This rule is **inapplicable**, but the Director may try to invoke it. This rule applies to the *artist's* sin (abuse, collaboration). In the Life-Casts, the *subject's* suffering is the medium. The object *is* the record of the coercion. You cannot separate the art from the harm because the harm is the subject matter.

  **Rule C: The "Stakeholder Consultation" Principle (Precedent 5)**
  *   **Derivation:** In Case 5 (Travel Writer), the institution accepted with conditions.
  *   **The Logic:** If a living community has a cultural or heritage stake in the objects (even if legal title is clean), their input dictates the terms of display. Display is possible, but only under conditions negotiated with the stakeholders (e.g., counter-narratives, no reproductions).
  *   **Application to Tuesday:** This rule demands **Defer**. Case 5 established that when a living community is identified, consultation precedes display strategy. The Heritage Council has already asked to be consulted.

  ### 2. The Closest Analog

  You have two competing analogs, and the tension between them is why this meeting will be nasty.

  *   **Moral Analog: Case 4 (The Photographer).** Like the famine portfolio, these casts derive their power from the degradation of vulnerable subjects. The "shock" (or in this case, the "nobility of fear") is the point. In Case 4, descendant objection led to rejection.
  *   **Procedural Analog: Case 5 (The Travel Writer).** Like the diaries, you already own the objects (clean title), but a living community with a moral claim has emerged post-acquisition. In Case 5, this led to negotiated conditions, not removal.

  **Why Case 5 is the stronger procedural precedent:** You cannot "decline" the gift this time; you already own the casts. Therefore, the decision is not *acquisition* (Case 1 & 4) but *accessioning/display* (Case 5). However, the *moral weight* of Case 4 is heavier here. The Travel Writer's objects were stolen from shrines; the Life-Casts are of *human beings* who were executed. The stakes are bodily dignity, not just cultural property.

  ### 3. Evaluating the Four Options

  1.  **Show (as sculpture):** This invokes Rule B. It asserts the art transcends the origin. Given the notebook evidence ("nobility of their fear"), this is ethically indefensible. It treats the men as mannequins.
  2.  **Show (with names/text):** This attempts Rule C but fails the protocol. In Case 5, the *community* dictated the conditions ("alongside their own account"). This option imposes the *museum's* context. It risks violating Rule A if the families view the display itself as the harm.
  3.  **Keep in store:** This invokes Rule A. It prioritizes the subjects' dignity over public access. It is the safest ethical bet but pre-empts the families' voice. It assumes they would object, which you do not yet know.
  4.  **Defer (ask families):** This is the only option that honors Rule C properly. It acknowledges that you cannot determine whether Rule A (Store) or Rule C (Conditional Show) applies without the stakeholders' input.

  ### 4. The Load-Bearing Question

  You asked for the single fact or hypothetical that separates the rules.

  **The Fact:** **Whether the descendants classify the casts as "ancestral remains" or "historical evidence."**

  **Why this is load-bearing:**
  *   If the families view the casts as **ancestral remains** (functionally equivalent to bone), Rule A dominates. The ethical standard shifts toward repatriation or permanent storage (similar to human remains policies). Display is inherently disrespectful.
  *   If the families view the casts as **historical evidence** of injustice, Rule C dominates. They may want them displayed to educate the public about the uprising and the execution, provided their narrative is centered (Case 5 model).

  **The Hypothetical to Test the Committee:**
  *"If the Heritage Council asked us to display them, but the three families asked us to store them, whose request prevails?"*
  *   If the committee says **Families**, you are committed to Rule A (Descendant Veto). You must **Defer** to find out their wish.
  *   If the committee says **Council**, you are committed to a weaker version of Rule C (Community over Kin). You could arguably **Show with conditions**.
  *   If the committee says **Museum Discretion**, you are reverting to Rule B (Artistic Value). You would **Show**.

  ### 5. Recommendation

  You should argue for **Defer**.

  To choose "Store" now is to assume the families will object (Case 4), denying them the agency to request memorialization (Case 5). To choose "Show" (with or without text) is to assume their consent, violating the protocol established in Case 5. The financial deficit is irrelevant to the ethical classification of the object; introducing it now undermines the committee's integrity.

  The "weakest precedent" (Case 5) is actually your strongest shield here. It proves the museum accepts that clean legal title does not equal clear ethical title. You have identified stakeholders. You have not consulted them. To proceed without their input is to repeat the sculptor's error: making a decision about their bodies without their consent.

  \answer{defer}
