answer: |-
  This decision tree is designed to navigate the conceptual space defined by Hamilton (1964), Dawkins (1976, 1982), Williams (1966), Wilson & Sober (1994), and Okasha (2006). It avoids asking for labels directly and instead forces commitments regarding causal architecture, mathematical generality, and ontological agency.

  There are three branching nodes.
  *   **Node 1** distinguishes the **Unit/Level** distinction (Ontology of Persistence).
  *   **Node 2** distinguishes the **Equivalence/Conflict** distinction (Mathematical/Heuristic Utility).
  *   **Node 3** distinguishes the **Literal/Metaphor** distinction (Agency and Maximization).

  This structure yields 12 theoretical leaves. Note that several leaves are flagged as **Unoccupied** or **Indistinguishable** because the combination of commitments is theoretically unstable or functionally identical in practice.

  ***

  ### Node 1: The Ontology of Persistence (Unit vs. Level)
  **Case:** *Myxobacteria* forming fruiting bodies or sterile *Ant* workers.
  **Question:** When a sterile worker ant dies to defend the colony, or a myxobacterium sacrifices itself to become the stalk of a fruiting body, what is the primary biological entity that has successfully "persisted" through this event?

  *   **(A) The Genetic Lineage:** The individual organism is a temporary vehicle; the only thing that truly persists across generations is the lineage of information (alleles) that coded for the sacrifice. The organism's death is irrelevant to the unit of selection, provided the alleles propagate.
      *   *Go to Node 2A.*
  *   **(B) The Reproducing Collective:** The individual is a part of a larger reproducing whole (the colony or fruiting body). The collective survives and reproduces *through* the differential survival of its parts. The group is not just a level where selection acts, but a unit that possesses heredity and reproduction.
      *   *Go to Node 2B.*

  ***

  ### Node 2A: The Scope of Inclusive Fitness (For Genetic Lineage Advocates)
  **Case:** The "Greenbeard" effect (alleles that recognize and help copies of themselves in non-kin) or non-additive synergistic interactions.
  **Question:** When an altruistic allele spreads by helping non-kin carriers (Greenbeards) or through complex synergies where the benefit depends on frequency, can Inclusive Fitness theory ($rb > c$) account for this without redefining "relatedness" ($r$) in ways that make the rule tautological?

  *   **(A1) Universally Equivalent:** Yes. The Price Equation shows that Inclusive Fitness and Group Selection are mathematically transformable. Any case modeled by one can be modeled by the other; differences are purely heuristic.
      *   *Go to Node 3A1.*
  *   **(A2) IF Heuristically Superior:** Mathematically they may map, but Inclusive Fitness provides the correct *causal* breakdown for gene-frequency change. Group selection accounts obscure the actual mechanism of allele propagation.
      *   *Go to Node 3A2.*
  *   **(A3) IF Limited/Conflict:** No. In cases of strong non-additivity or arbitrary assortment (like Greenbeards), Inclusive Fitness breaks down or requires ad-hoc adjustments. Multi-level selection provides a distinct, non-equivalent prediction.
      *   *Go to Node 3A3.* **(Flag: Theoretically Unstable)**

  ***

  ### Node 2B: The Necessity of Group Variance (For Collective Advocates)
  **Case:** *Myxobacteria* chimeras (groups formed from different strains) vs. clonal groups.
  **Question:** If you remove the variance *between* groups (making all groups identical in composition) but keep variance *within* groups, does the cooperative trait disappear, and is this best explained as a failure of "group fitness" or simply a change in individual incentives?

  *   **(B1) Universally Equivalent:** It doesn't matter. Whether you call it "group fitness" or "individual fitness in a social context," the math (Price Equation) partitions the variance identically. The "Group" is a valid unit, but not ontologically distinct from the gene in terms of prediction.
      *   *Go to Node 3B1.*
  *   **(B2) MLS Heuristically Superior:** The group variance is the causal driver. Explaining this via individual incentives requires convoluted accounting of "effects on neighbors." It is cleaner to treat the group as the selecting unit.
      *   *Go to Node 3B2.*
  *   **(B3) MLS Ontologically Distinct:** Group selection is a fundamentally different evolutionary force than individual selection, capable of overriding individual fitness in ways that individual-level models cannot capture without circularity.
      *   *Go to Node 3B3.*

  ***

  ### Node 3: The Status of "Maximization" (Literal vs. Metaphor)
  **Case:** *Vampire Bats* sharing blood meals (Reciprocal Altruism).
  **Question:** When we say a vampire bat (or its genes) "maximizes fitness" by sharing blood, are we describing a causal agent that *drives* the evolution (the gene/bat acts to maximize), or a statistical outcome where selection *filters* non-maximizers (the gene/bat is passive)?

  *   **(Left) Literal Agency:** The gene (or organism) is a true agent of optimization. It is coherent to speak of the gene's "interests" or "strategies" as causal forces.
  *   **(Right) Metaphorical/Statistical:** "Maximization" is a shorthand for differential retention. Nothing is actually "trying" to maximize; it is a description of the filter, not the engine.

  ***

  ### The Leaves (Positions)

  #### From Branch A (Genetic Lineage)

  **1. Orthodox Gene Selectionism (Dawkins 1976)**
  *   *Path:* A → A2 → Left
  *   *Commitment:* Genes are the only true replicators; organisms are "survival machines."
  *   *Awkward Commitment:* Must treat the organism's conscious experience of altruism as an illusion generated by selfish replicators.

  **2. Formalist Gene-Centrism (Grafen 2002)**
  *   *Path:* A → A2 → Right
  *   *Commitment:* Genes are the unit, but "selfishness" is a mathematical property of the optimization program, not agency.
  *   *Awkward Commitment:* Must defend the "phenotypic gambit" (assuming organisms act as if they maximize fitness) even when cognitive constraints are obvious.

  **3. [Unoccupied/Incoherent] Gene-Unit / IF-Limited / Literal**
  *   *Path:* A → A3 → Left
  *   *Status:* **Unoccupied.** If one claims genes are the *only* unit, one typically defends Inclusive Fitness as the universal accounting method for genes. Claiming genes are the unit *but* IF fails for genes is theoretically unstable.

  **4. Critical Gene Selectionism (Haig 1997 / Intragenomic Conflict)**
  *   *Path:* A → A3 → Right
  *   *Commitment:* Genes are the unit, but IF fails because genes within a genome conflict (e.g., imprinting), not just between individuals.
  *   *Awkward Commitment:* Must explain why cooperation exists at all if the fundamental unit (the gene) is constantly sabotaging its own vehicle.

  **5. [Indistinguishable] Pragmatic Gene-Centrism**
  *   *Path:* A → A1 → Left/Right
  *   *Status:* **Indistinguishable from Leaf 2.** If equivalence is strict (A1), the choice between Literal/Metaphor becomes a philosophical preference with no empirical bite. Most working biologists land here.

  #### From Branch B (Reproducing Collective)

  **6. Weak MLS Pluralism (Okasha 2006)**
  *   *Path:* B → B1 → Right
  *   *Commitment:* Selection occurs at multiple levels, but they are mathematically equivalent partitions of the Price Equation.
  *   *Awkward Commitment:* Must accept that "group selection" is real even in cases where groups do not reproduce in any biological sense (e.g., temporary aggregations), provided variance exists.

  **7. Strong MLS Realism (Wilson & Sober 1994)**
  *   *Path:* B → B3 → Left
  *   *Commitment:* Groups are Darwinian populations in their own right. Altruism evolves because groups outcompete groups.
  *   *Awkward Commitment:* Must explain how groups achieve high-fidelity heredity (bottlenecks) without appealing to the genetic relatedness that Kin Selection emphasizes.

  **8. Holistic Darwinism (Campbell 1994)**
  *   *Path:* B → B3 → Right
  *   *Commitment:* Evolutionary principles apply to cultural and biological groups alike; the "unit" is whatever preserves knowledge/structure.
  *   *Awkward Commitment:* Risks conflating biological evolution with cultural evolution, requiring a robust theory of how cultural memes map to genetic fitness.

  **9. [Unattractive] Collective Statism**
  *   *Path:* B → B2 → Right
  *   *Status:* **Theoretically Possible but Unattractive.** Claims MLS is heuristically better but denies agency to the group. Rarely defended because if the group is the unit, proponents usually want to grant it some causal power (Left branch).

  **10. [Unoccupied] Group-Unit / IF-Superior**
  *   *Path:* B → B2 (IF Superior variant)
  *   *Status:* **Unoccupied.** It is incoherent to argue Groups are the fundamental ontological unit (Branch B) but that Individual-level Inclusive Fitness is the *superior* heuristic (Branch A2 logic). This combination collapses back into Branch A.

  **11. Kin Selection Fundamentalism (Hamilton 1964 / Queller 1992)**
  *   *Path:* A → A1 → Right (Mapped from Gene side, but acknowledges Group structure)
  *   *Commitment:* "Group Selection" is just Kin Selection with a different accounting method. Relatedness ($r$) captures all assortment, whether spatial or genealogical.
  *   *Awkward Commitment:* Must define "relatedness" so broadly (including spatial assortment) that it loses its intuitive meaning of "genealogical kinship."

  **12. [Indistinguishable] Evolutionary Game Theorist**
  *   *Path:* A → A1 → Right (Strategy focus)
  *   *Status:* **Indistinguishable from Leaf 5.** Focuses on ESS (Evolutionarily Stable Strategies) rather than units. Whether the strategy is "in" a gene or a group is secondary to the payoff matrix.

  ***

  ### Instructor Notes on Unoccupied and Indistinguishable Nodes

  *   **The "Gene-Unit / IF-Limited" Gap (Leaf 3):** You will find almost no students landing here. This is because the "Gene's Eye View" was historically built *on top of* Inclusive Fitness theory. To reject IF while keeping the Gene as the sole unit requires a new mathematical framework for gene frequency change that most students won't know (e.g., specific intragenomic conflict models).
  *   **The Equivalence Trap (Leaves 5 & 12):** Students who choose "Universally Equivalent" (Node 2, Option 1) often find the "Literal vs. Metaphor" split (Node 3) meaningless. If the math is the same, the "agency" of the gene is purely linguistic. You should flag these leaves as **Functionally Identical** for the purpose of predicting biological outcomes, differing only in philosophical flavor.
  *   **The "Relatedness" Stretch (Leaf 11):** Be prepared for students to argue that Kin Selection *is* Group Selection. This is the Queller (1992) position. They will argue that $r$ measures *assortment*, not just pedigree. If they take this view, they effectively merge Branch A and Branch B. This is a valid position (The "Generalized Kin Selection" view), but it renders the Unit/Level distinction (Node 1) moot.

  ### Recommended Reading for Specific Leaves
  *   **Leaf 1 (Dawkins):** *The Extended Phenotype* (Ch. 1 & 10).
  *   **Leaf 6 (Okasha):** *Evolution and the Levels of Selection* (Ch. 5).
  *   **Leaf 7 (Wilson/Sober):** "Reintroducing Group Selection to the Human Behavioral Sciences" (BBS 1994).
  *   **Leaf 11 (Queller):** "A General Model for Kin Selection" (*Evolution* 1992).
