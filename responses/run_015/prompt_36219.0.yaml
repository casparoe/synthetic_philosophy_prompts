      *   *Implicit Memory:* Controversial. Some studies show priming, others don't. Even if true, does priming imply *phenomenal* experience or just subcortical processing?
      *   *Philosophical Distinction:* Access Consciousness (Block) vs. Phenomenal Consciousness. Global Workspace Theory (GWT) vs. Integrated Information Theory (IIT) vs. Predictive Processing.
      *   *The "Hard Problem":* Anesthesiology deals with the "Easy Problems" (behavior, memory, physiology).

  3.  **Formulating the Argument/Response Structure:**

