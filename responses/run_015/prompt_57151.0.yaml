      *   **Input:** The user provides 7 specific requirements (Phenomena, Distinctions, Fate of Obligation, Formal Consistency, Distribution, Action-Guidance, Non-Ubiquity).
      *   **Additional Instructions:**
          *   Add missing requirements.
          *   For each requirement, state if it's a genuine constraint on adequacy or a substantive moral thesis (smuggled premise).
          *   Identify any subset that cannot be jointly satisfied (impossibility results).
          *   Identify the single requirement that does the most work in eliminating candidate theories.
          *   Conclude with a brief assessment (max 1 paragraph each) of two broad strategies: Dissolving Conflict (Pro Tanto) vs. Accepting Conflict (Deontic Logic revision).
          *   Tone: Rigorous, philosophical, precise, suitable for a working group drafting normative guidance.

  2.  **Deconstruct and Evaluate the 7 Provided Requirements:**

      *   *1. Phenomena to be explained:* Focuses on moral residue (guilt, apology). *Status:* Genuine constraint on phenomenological adequacy, but risks conflating psychology with normativity.
      *   *2. Distinctions:* Focuses on conceptual clarity (dilemma vs. tragedy, pro tanto vs. all-things-considered). *Status:* Genuine conceptual constraint.
      *   *3. Fate of Unfulfilled Obligation:* Focuses on moral residue/regress. *Status:* Substantive thesis (some theories deny residue).
      *   *4. Formal Consistency:* Focuses on agglomeration/ability. *Status:* Genuine logical constraint, but forces a choice between logic and intuition.
      *   *5. Distribution:* Focuses on collective/individual agency. *Status:* Crucial for institutional ethics, often missed in individualistic theories.
      *   *6. Action-Guidance/Publicity:* Focuses to usability and transparency. *Status:* Genuine constraint for *guidance* (vs. pure theory).
      *   *7. Non-Ubiquity:* Focuses on rarity of dilemmas. *Status:* Substantive thesis (some theories allow frequent conflicts).

  3.  **Identify Missing Requirements:**
      *   *Temporal Dynamics:* Clinicians work in shifts. Obligations change over time. The "time-slice" mention in #2 is good, but a specific requirement on *diachronic coherence* is needed.
      *   *Epistemic Accessibility:* Clinicians don't know the future. A theory requiring omniscience to determine obligation is useless.
      *   *Second-Order Obligations:* What about the obligation to *change the system* that caused the conflict?

  4.  **Drafting the Specification (Iterative Process):**

      *   *Structure:* Introduction -> The Requirements (1-7 + additions) -> Analysis of Status (Constraint vs. Thesis) -> Impossibility Results -> The "Killer" Requirement -> Assessment of Strategies.
      *   *Tone Check:* Needs to be dry, analytical, and precise. Avoid fluff.
      *   *Critical Analysis:* I need to be honest about which requirements are actually contested philosophical claims disguised as "requirements." For example, Requirement #1 (Moral Residue) is denied by simple consequentialism. Requirement #4 (Logic) is denied by dilemmism.

  5.  **Refining the Analysis (Constraint vs. Thesis):**
      *   *Constraint:* Something a theory *must* do to count as a theory of *this* phenomenon (e.g., must address the agents involved).
      *   *Thesis:* A specific answer to a philosophical debate (e.g., "Guilt is always appropriate").
      *   *Insight:* Requirement #3 (Fate of Obligation) is the most contentious. Consequentialists say it lapses. Deontologists say it persists. Calling it a "requirement" biases the selection. I need to flag this.
      *   *Insight:* Requirement #4 (Formal Consistency) forces a choice between Standard Deontic Logic (SDL) and Dilemmism. You can't demand SDL *and* genuine dilemmas.

  6.  **Identifying Impossibility Results:**
      *   The classic "Ought Implies Can" (OIC) + Agglomeration + Genuine Dilemmas = Inconsistency.
      *   If you have Obligation A, Obligation B, and Not (A and B), then:
          *   Agglomeration -> Obligation (A and B).
          *   OIC -> Can (A and B).
          *   Contradiction.
      *   So, #4 (Consistency) and #1 (Phenomena of genuine conflict) + OIC (often assumed in #6 Action Guidance) are in tension.
      *   Also, #5 (Distribution) + #6 (Action Guidance for individuals) can clash if the institution bears the obligation but the individual must act.

  7.  **Selecting the "Killer" Requirement:**
      *   Which one eliminates the most theories?
      *   *Formal Consistency (#4)* is usually the hardest. It forces theories to either reject standard logic (costly) or deny genuine conflicts (costly to phenomenology).
      *   *Action-Guidance (#6)* is critical for *clinical guidance*. A theory that says "you are doomed no matter what" fails as guidance.
      *   *Decision:* **Action-Guidance (#6)** combined with **Formal Consistency (#4)**. But if I must pick one that filters the *normative frameworks* specifically for *guidance*, it's **Action-Guidance**. However, philosophically, **Formal Consistency** is the structural bottleneck. Let's look at the prompt: "which single requirement does the most work in eliminating candidate theories."
      *   Actually, **Requirement #4 (Formal Consistency)** is the strongest filter because it forces a metaphysical/logic commitment before you even get to application. If a theory violates agglomeration, it's non-standard. If it violates OIC, it's controversial.
