answer: |-
  # Specification for an Adequate Account of Moral Conflict in Clinical Triage

  ## I. Requirements

  **1. Phenomenological Adequacy (Moral Residue)**
  *   **Specification:** The account must explain the normative aptness of agent-regret, apology, or reparative impulses following a necessary violation, without attributing fault or irrationality to the agent. It must distinguish this residue from simple disappointment.
  *   **Motivation:** Clinicians report lasting distress after triage decisions even when validated as "correct." A theory that categorizes this as mere psychological error fails to capture the moral reality of the practice.
  *   **Status:** **Substantive Moral Thesis.** This presupposes that moral residue tracks a normative truth rather than a cognitive illusion. Consequentialist accounts typically deny this requirement, viewing residue as irrational guilt.

  **2. Conceptual Granularity**
  *   **Specification:** The account must explicitly categorize the conflict type: (a) *Dilemma* (no permissible option), (b) *Tragedy* (all options permissible but bad), or (c) *Hard Choice* (incommensurable values). It must locate the conflict at the level of *pro tanto* duties or *all-things-considered* obligations.
  *   **Motivation:** Guidance for a dilemma (break a rule) differs from guidance for a hard choice (exercise discretion). Collapsing these leads to inappropriate policy (e.g., punishing necessary rule-breaking).
  *   **Status:** **Genuine Constraint.** Without these distinctions, the theory cannot generate specific guidance.

  **3. The Fate of the Unfulfilled Obligation**
  *   **Specification:** The account must specify the deontic status of the violated obligation post-action: does it lapse, persist as a debt, or transfer? If it persists, the account must demonstrate how fulfilling the residue does not generate a new impossible obligation (blocking regress).
  *   **Motivation:** If the obligation persists as a duty to the same patient, the clinician remains in violation indefinitely. If it lapses entirely, the patient's claim is erased.
  *   **Status:** **Substantive Moral Thesis.** This dictates the metaphysics of obligations. Some theories (e.g., simple utilitarianism) assert lapse; others (e.g., Rossian deontology) assert persistence.

  **4. Formal Consistency (The Logical Trilemma)**
  *   **Specification:** The account must explicitly resolve the inconsistency between: (a) *Ought Implies Can* (OIC), (b) *Agglomeration* (If Ought A and Ought B, then Ought (A & B)), and (c) *The Existence of Genuine Conflicts* (Ought A, Ought B, but Cannot (A & B)). The theory must reject or modify at least one.
  *   **Motivation:** Standard Deontic Logic (SDL) breaks down in triage. A theory cannot implicitly rely on SDL while endorsing genuine conflicts.
  *   **Status:** **Genuine Constraint (with Thesis Cost).** Logical coherence is a constraint on intelligibility, but *which* principle is sacrificed is a substantive thesis.

  **5. Distribution of Agency**
  *   **Specification:** The account must assign obligations to specific loci of agency (individual, team, institution). It must explain how an obligation binds an individual when the constraint preventing fulfillment is institutional (e.g., bed shortage).
  *   **Motivation:** In systemic scarcity, telling the bedside nurse they "ought" to have provided a bed is category error. The obligation may lie with the hospital administrator, leaving the nurse with a different derivative duty.
  *   **Status:** **Genuine Constraint.** Essential for institutional ethics; individualistic theories fail here.

  **6. Action-Guidance and Publicity**
  *   **Specification:** The verdict must be executable by the agent at the time of action. It cannot prescribe a state of affairs the agent cannot bring about. Furthermore, the rationale must be publicable without undermining the agent's ability to act (no "noble lies" required for efficacy).
  *   **Motivation:** Guidance that tells a clinician "you are doomed to wrong" may induce paralysis. Guidance that relies on secrecy undermines trust.
  *   **Status:** **Genuine Constraint.** A normative theory for *guidance* that cannot guide is functionally defective.

  **7. Non-Ubiquity**
  *   **Specification:** The account must classify the majority of routine clinical decisions as non-dilemmatic. Genuine conflicts must be the exception, not the rule.
  *   **Motivation:** If every trade-off is a moral remainder, moral language loses its discriminatory power and agents suffer burnout from perceived constant violation.
  *   **Status:** **Substantive Moral Thesis.** Some pluralist theories accept frequent conflicts; this requirement rules them out by fiat to preserve normative stability.

  **8. Epistemic Accessibility (Added)**
  *   **Specification:** The determination of obligation must rely on information reasonably available to the clinician at the time of decision, not on omniscient hindsight.
  *   **Motivation:** Triage often occurs under uncertainty (prognosis unknown). A theory that judges obligations based on outcomes known only later cannot guide action in the moment.
  *   **Status:** **Genuine Constraint.** Necessitated by the temporal structure of clinical practice.

  **9. Diachronic Coherence (Added)**
  *   **Specification:** The account must explain how obligations transfer or dissolve across shift changes. It must prevent "moral laundering" where a duty is evaded simply by leaving the premises.
  *   **Motivation:** The prompt notes commitments broken by shift changes. A theory must account for the continuity of care obligations beyond the individual agent's temporal presence.
  *   **Status:** **Genuine Constraint.** Necessary for continuity of care ethics.

  ---

  ## II. Analysis of Constraints and Theses

  Several demands above are not neutral filters but substantive commitments that will exclude entire families of ethical theory.

  *   **Requirement 1 (Residue)** is a thesis. Consequentialist frameworks (Act Utilitarianism) will fail this test by design, as they view the "right" action as exhausting moral demand. If you require this, you have already excluded consequentialism.
  *   **Requirement 3 (Fate)** is a thesis. Asserting that obligations persist as debts commits you to a deontological or pluralist ontology. Asserting they lapse commits you to a consequentialist or satisficing view.
  *   **Requirement 7 (Non-Ubiquity)** is a thesis. It privileges theories that maximize commensurability (like utilitarianism) over radical pluralism.

  **The Impossibility Result:**
  Requirements **4 (Formal Consistency)**, **6 (Action-Guidance/OIC)**, and **1 (Phenomena/Genuine Conflict)** form an inconsistent triad if "Genuine Conflict" implies violating OIC.
  *   If you maintain Standard Logic (Agglomeration) and OIC (Guidance), you **must** deny Genuine Conflicts (Dissolution).
  *   If you maintain Genuine Conflicts and OIC, you **must** reject Agglomeration (Logic Revision).
  *   If you maintain Genuine Conflicts and Agglomeration, you **must** reject OIC (Guidance Failure).
  You cannot satisfy all three. One must be sacrificed.

  ---

  ## III. The Primary Filter

  **Requirement 4 (Formal Consistency)** does the most work in eliminating candidate theories.

  It forces an immediate metaphysical choice before any application to clinical cases can occur. A framework cannot be "tested" against cases until it declares its stance on the logic of obligation. If a proposed framework attempts to retain Standard Deontic Logic *and* assert genuine dilemmas *and* maintain OIC, it is mathematically incoherent. This requirement eliminates any theory that attempts to "have it all" without explicit logical revision. It separates the Dissolvers (who save logic by denying conflicts) from the Dilemmists (who save conflicts by revising logic or OIC).

  ---

  ## IV. Assessment of Broad Strategies

  **Strategy A: Dissolving Conflict (Pro Tanto/Specifism)**
  This strategy preserves Formal Consistency (#4) and Action-Guidance (#6) by redefining conflicts as clashes of *pro tanto* reasons rather than *all-things-considered* obligations. It satisfies Non-Ubiquity (#7) and Logic (#4) perfectly. However, it fails Phenomenological Adequacy (#1) by rendering moral residue irrational, and struggles with Distribution (#5) by often locating the "real" obligation in an idealized agent rather than the constrained clinician. It offers clear guidance but risks alienating clinicians whose lived experience contradicts the theory's claim that "no wrong was done."

  **Strategy B: Accepting Conflict (Dilemmism/Logic Revision)**
  This strategy preserves Phenomenological Adequacy (#1) and Conceptual Granularity (#2) by acknowledging genuine moral remainders. It validates the clinician's distress. However, it incurs a high cost on Formal Consistency (#4), requiring rejection of Agglomeration or OIC. This threatens Action-Guidance (#6); if "ought" does not imply "can," or if obligations do not agglomerate, issuing clear directives becomes difficult. It risks paralyzing agents with the verdict that they are necessarily in violation regardless of choice, potentially undermining the publicity condition.
