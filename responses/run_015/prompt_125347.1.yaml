answer: |-
  Your observation is precise, and your skepticism about existing terminology is well-founded. You are describing a phenomenological quality (how the experience *feels*) that is distinct from the evaluative judgment (how *good* the experience is) and distinct from the narrative outcome (what was *achieved*).

  There is no single established term in philosophy or psychology that captures this exact axis. The closest concepts tend to collapse the *feeling* of the wage into either the *cause* (effort) or the *consequence* (valuation/pride). Below is an analysis of why the nearest candidates fail, followed by the requested table and a proposed conceptual carving.

  ### Discussion of Candidates

  **1. Effort Justification (Psychology)**
  This is the closest mechanistic explanation. It posits that we value outcomes more highly if we suffered to attain them (Cognitive Dissonance Theory). However, it fails your criteria on two counts. First, it is post-hoc: it explains why you *value* the memory later, not why the pleasure *during* the experience feels textured by cost. Second, it conflates value with enjoyment. In your dawn swim example, the character judges both swims as equally worthwhile; Effort Justification predicts she should value the dawn swim *more*, which she explicitly does not.

  **2. Flow (Psychology)**
  Flow describes deep absorption where action and awareness merge. You noted early on that pleasure seems to be "attention caught and held." Flow captures the holding of attention. However, Flow is inherently positive in tone; it requires a balance of challenge and skill that feels seamless. Your "wage" cases often involve friction, grimness, or unpleasantness *during* the act (the cold water, the stuck sentence). Flow smooths the ride; the wage requires the bumps.

  **3. Eudaimonia (Philosophy)**
  In ethics and positive psychology, this distinguishes "meaningful" well-being from "hedonic" pleasure. Your wage cases are clearly eudaimonic in flavor. However, Eudaimonia is a category of *value*, not a texture of *sensation*. A character can judge an activity as eudaimonic (valuable, meaningful) without the specific phenomenological "heaviness" or "permission" you are describing. You can have a meaningful experience that feels light, and a wage-heavy experience that feels grim.

  **4. Moral Desert (Philosophy)**
  This concerns whether a subject *deserves* a reward or punishment. It captures the "paid for" aspect. However, Desert is normative (about justice), not phenomenological. It explains why a character might feel *entitled* to a pleasure, but not why the pleasure itself tastes different. Furthermore, Desert usually requires agency. Your suspicion that the wage might exist passively (without the subject having done anything) breaks the link to Moral Desert, which relies on the subject's actions.

  **5. Processing Fluency (Psychology/Aesthetics)**
  This theory suggests we prefer things that are easy to process. Conversely, "disfluency" (difficulty) can lead to deeper engagement. This touches on the "resistance" element. But like Effort Justification, it focuses on the cognitive processing of a stimulus, not the somatic texture of the pleasure itself. It explains why we might *like* a difficult poem more, not why the reading of it feels "paid for."

  ### The Passive Case
  You ask whether an experience can have this property without the subject having done anything. I suspect the answer is yes, but only if the subject acknowledges a *cost elsewhere*. For example, sitting in a room built by a deceased parent might carry the wage if the sitter is acutely aware of the labor that made the room possible. If the cost is entirely invisible or ignored, the wage vanishes. This suggests the wage is not about *agency* (my effort) but about *contact with reality* (the recognition that this moment exists at the expense of something else). This distinguishes it from Pride (which requires my agency) and Gratitude (which requires a giver). It is a recognition of *exchange*.

  ### Conclusion
  No established term fits. The concept is a specific phenomenological texture where the *cost* of the experience is perceived as a constitutive ingredient of the *pleasure*, distinct from the value of the outcome.

