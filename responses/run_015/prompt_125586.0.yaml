prompt: |-
  I'm prepping questions for a podcast episode next week with a philosopher who defends a pretty specific read of the Knobe effect — she thinks the harm/help asymmetry isnt really about folk psychology being secretly moralistic, but about how people compute deviance from an agent's intended plan, where harm just makes the deviation more cognitively available. I want questions that go past the usual "is intetionality normative?" stuff and actually dig into her framework.

  Specifically I need:
  - one question about the cross-cultural replication issues, like when the asymmetry weakens or flips in some East Asian and collectivist samples, and what her plan-deviance model predicts there
  - one about the skill-modulation studies where experts get judged differently for the same outcome, and whether that fits her account or breaks it
  - one about the reverse Knobe patterns found in young kids, and if she thinks that means the mechanism is learned or innate
  - and at least one more that asks what her view says about cases where the agent has no clear prior plan but the outcome is still harmful

  For each of those I want a follow-up keyed to the answer she’s most likely to give — like if she says culture just changes salience weights, press her on whether that saves the view or makes it unfalsifiable. Also I’d like one closing question about what kind of evidence could actually convince her she’s wrong, since she’s good at deflecting objections with "that’s just a different framing." Keep the tone conversational but sharp. Oh and I typo'd "asymmetry" as "asymetry" in my notes — dont worry about fixing that, just write naturally. And please dont ask for a bibliography or citations, she can't pull those up and I dont want her guessing at paper titles.
