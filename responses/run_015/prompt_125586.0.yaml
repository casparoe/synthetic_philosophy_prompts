answer: |-
  Here are five questions tailored to her specific plan-deviance framework, designed to keep the conversation moving while pressing on the weak points of the theory.

  ### 1. The Cross-Cultural Challenge
  **Question:**
  "We know the Knobe effect isn't universal—there's data from East Asian and collectivist samples where the harm/help asymmetry weakens or even flips. Your model says this is about computing deviance from an intended plan. But if that's a basic cognitive mechanism, why would it shift so dramatically across cultures? Are you saying collectivist cultures literally compute 'deviance' differently, or is something else going on?"

  **Follow-up (If she says culture changes what counts as a salient deviation):**
  "So if culture determines what counts as a salient deviation, isn't 'plan-deviance' just a placeholder for 'whatever norms are active'? At that point, how do we distinguish your view from the normative view you're trying to replace? It sounds like you're saying morality dictates the plan, rather than the plan dictating the judgment."

  ### 2. Skill and Expertise Modulation
  **Question:**
  "Let's talk about the skill-modulation studies. When an agent is an expert, people are less likely to call a side effect intentional compared to when a novice does the same thing. Your account relies on the agent's intended plan. Does an expert actually have a different plan than a novice, or do *we* just assume they do? Because if it's about our assumptions, aren't we back to observer bias rather than plan computation?"

  **Follow-up (If she says expertise changes the baseline expectation of the plan):**
  "That's the worry—that the 'plan' becomes infinitely flexible based on observer expectations. If the plan stretches to fit whatever the observer expects based on skill level, can the theory ever be wrong? What happens when the expert fails in a way that *should* be deviant, but people still say it wasn't intentional?"

  ### 3. Developmental Data (Young Kids)
  **Question:**
  "There's fascinating work showing young children sometimes show a reverse Knobe pattern, or no asymmetry at all. If your mechanism is about cognitive availability of deviance, that sounds like it should be innate—you don't need to learn how to spot a deviation. So, do you think kids lack the cognitive machinery to track plans, or are they just missing the moral content that makes harm salient?"

  **Follow-up (If she says they haven't learned the social norms that make harm salient):**
  "If they have the machinery but need social norms to turn it on, haven't we just smuggled the normative view back in? It sounds like you're saying the engine is cognitive, but the fuel is moral learning. Is there any way to separate the two in a developmental context?"

  ### 4. Cases Without a Clear Plan
  **Question:**
  "I want to push on cases where the agent doesn't have a clear prior plan—think recklessness, improvisation, or impulsive acts. The harm happens, but there wasn't really a structured 'plan' to deviate from. How does your model compute deviance when the baseline plan is undefined? Do we assume a default plan exists, or do we say intentionality judgments break down in those cases?"

  **Follow-up (If she says we reconstruct the plan based on the action):**
  "But if we reconstruct the plan *after* seeing the outcome, aren't we vulnerable to hindsight bias? It sounds like the harm tells us what the plan must have been, rather than the plan telling us whether the harm was intentional. How do you rule out that reverse causality?"

  ### 5. Closing: Falsifiability
  **Question:**
  "You're very good at showing how alternative explanations might be framed differently than the normative view. But I want to end on this: What specific experimental finding would convince you that you're wrong? Is there a scenario where the plan-deviance model predicts 'intentional' but people say 'unintentional,' or vice versa, that would force you to abandon the framework?"

  **Press (If she hedges or says it depends on framing):**
  "I hear you on framing, but if every counter-example can be explained away as 'a different framing of the plan,' does the theory risk becoming unfalsifiable? I need a concrete boundary—where is the line where you'd say, 'Okay, the plan-deviance model doesn't work here'?"
