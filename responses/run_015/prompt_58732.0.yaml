answer: |-
  # Workshop Design: The Sorvane Boundary Problem
  **Module:** Multinational Democracy (Year 2)
  **Duration:** 75 Minutes
  **Class Size:** 22 Students (5 Groups of 4–5 students)
  **Learning Objective:** To experientially demonstrate the "Boundary Problem" (the non-neutrality of defining the *demos*) and the recursive nature of secessionist claims.

  ## 1. Materials Needed
  *   **5 Role Briefs** (printed, distinct colours for each group).
  *   **1 "Referendum Design Sheet"** (per group) to record agreements on Franchise, Threshold, and Question.
  *   **1 Map of Sorvane** (projected or handout) showing Brennor, Valley, Island, and Rural Sorvane.
  *   **Whiteboard/Flipchart** to track the "Agreed Terms."
  *   **Timer** (visible to students).

  ## 2. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–05** | **Setup** | Distribute briefs. Explain the goal: *Agree on the rules for a referendum, not the outcome.* Emphasize: "If you do not agree by Minute 45, the Federal Government imposes terms." |
  | **05–20** | **Caucus** | Groups read briefs and formulate their "Red Lines" for the referendum design (Who votes? What threshold? Can sub-units split?). |
  | **20–45** | **Negotiation** | **"The Constitutional Convention."** One envoy from each group sits at the central table; others advise from the perimeter. They must sign a single *Referendum Design Sheet*. |
  | **45–50** | **The Vote** | Facilitator collects the Design Sheet. If no agreement, Facilitator imposes Federal Terms. Facilitator then reveals the *Simulated Vote Result* based on the agreed terms (see Rules below). |
  | **50–60** | **The Trigger** | Groups review the Result. Any sub-unit meeting the "Fragmentation Clause" criteria may declare a counter-referendum. Chaos/Recursion ensues. |
  | **60–75** | **Debrief** | Structured discussion connecting the gameplay to the theoretical boundary problem (see Section 6). |

  ## 3. The Scenario Data (For All Handouts)
  **The Federation of Sorvane**
  *   **Total Population:** 1.2 Million.
  *   **Language:** 57% Sorvane-speaking (mostly Rural/Island); 43% Federal-language speakers (mostly Brennor/Valley).
  *   **Economy:**
      *   *Brennor (Capital):* 400k people. Service economy. Mixed language.
      *   *North Valley:* 300k people. Mining. 90% dependent on Federal subsidies.
      *   *South Island:* 100k people. Naval base (Federal) + Fishing (Local). Distinct dialect.
      *   *Rural Sorvane:* 400k people. Agriculture/Forestry. 90% Sorvane-speaking.
  *   **Current Status:** Sorvane is a province within a larger Federal State. The Provincial Government wants a referendum on Independence.

  ## 4. Role Briefs (Private Instructions)

  ### Group 1: Provincial Government (Sorvane)
  *   **Public Goal:** A clean, democratic mandate for independence.
  *   **Private Interest:** You believe the *whole province* is the only valid demos. Sub-unit voting is treasonous.
  *   **Red Lines:**
      *   Franchise: All 1.2m residents of Sorvane.
      *   Threshold: Simple Majority (50% + 1).
      *   Fragmentation: **Veto.** If independence wins, the province leaves as one block. No sub-votes.
  *   **Secret Fear:** If Brennor or the Valley stays Federal, the new state is economically non-viable.

  ### Group 2: Capital City Council (Brennor)
  *   **Public Goal:** Protect the city's economic hub status and mixed identity.
  *   **Private Interest:** You are 60% Federal-language speakers. You will likely vote *No* to independence. You want an "Opt-Out" clause.
  *   **Red Lines:**
      *   Franchise: City residents only (if possible) or weighted voting.
      *   Threshold: Supermajority (60%) required to change status.
      *   Fragmentation: **Demand.** If the City votes >60% No, it remains Federal even if the Province leaves.
  *   **Secret Fear:** Being trapped in a nationalist state where your language is marginalized.

  ### Group 3: Valley Municipalities (North)
  *   **Public Goal:** Economic survival.
  *   **Private Interest:** Your mines close without Federal subsidies. You are 80% Unionist.
  *   **Red Lines:**
      *   Franchise: Must include Federal oversight.
      *   Threshold: 60% minimum.
      *   Fragmentation: **Demand.** You need a guarantee that if the Valley votes No, subsidies continue.
  *   **Secret Fear:** Poverty. You are willing to trade political autonomy for economic security.

  ### Group 4: Island Council (South)
  *   **Public Goal:** Autonomy regardless of the flag.
  *   **Private Interest:** You have a distinct dialect. You don't care about Sorvane vs. Federal, you care about local control. You are swing voters.
  *   **Red Lines:**
      *   Franchise: Islanders only decide Island status.
      *   Threshold: 55%.
      *   Fragmentation: **Flexible.** You will support whoever grants you the most fiscal autonomy.
  *   **Secret Leverage:** Your vote can tip the balance. Use it to extract autonomy promises.

  ### Group 5: Federal Government
  *   **Public Goal:** Rule of law and stability.
  *   **Private Interest:** You want to avoid a precedent of "fragmentation" (e.g., if Brennor stays, what stops *its* neighborhoods from splitting?).
  *   **Red Lines:**
      *   Franchise: Must be legal under Federal Constitution (which is vague).
      *   Threshold: You prefer 60% to ensure stability.
      *   Fragmentation: **Warning.** You will not recognize sub-unit secession unless explicitly written into the Referendum Bill.
  *   **Secret Power:** If the groups deadlock by Minute 45, *you* dictate the terms (likely strict: 60% threshold, no fragmentation).

  ## 5. Rules of Play & Mechanics

  ### A. The Referendum Design Sheet
  The Negotiation Table must agree on three variables:
  1.  **Franchise:** Who votes? (All Sorvane? Only Citizens? Excluding recent arrivals?)
  2.  **Threshold:** What wins? (50%+1? 60%? Double Majority?)
  3.  **Unit:** Is the result binding on sub-units? (Yes/No)

  ### B. The Simulated Vote (Facilitator Only)
  *If the groups agree on terms, use those terms to determine the outcome. If they deadlock, apply Federal Imposition.*
  *   **Underlying Data (Hidden from students until Vote Phase):**
      *   *Rural Sorvane:* 85% Yes.
      *   *Island:* 55% Yes.
      *   *Brennor:* 65% No.
      *   *Valley:* 80% No.
      *   *Aggregate Province:* 52% Yes (Narrow win for Independence).
  *   **Application:**
      *   If Threshold agreed was 50%+1: **Independence Wins.**
      *   If Threshold agreed was 60%: **Independence Loses.**
      *   *Note:* This creates immediate tension. The Provincial Govt will fight for 50%; others for 60%.

  ### C. The Fragmentation Clause (The Recursive Trigger)
  *Read aloud at Minute 50.*
  "According to the Democratic Self-Determination Act, if any sub-unit (Brennor, Valley, Island) voted **greater than 60% against** the provincial result, they may petition to retain their previous status."
  *   **Task:** Groups check the Simulated Vote Data against their sub-unit performance.
  *   **Action:** If eligible, the sub-unit declares a "Counter-Referendum."
  *   **Consequence:** The Provincial Government must decide: Do you accept the loss of territory (and tax base/subsidies) or force them to stay (undemocratic)?

  ## 6. Structured Debrief (15 Minutes)

  **Phase 1: The Emotional Temperature (3 mins)**
  *   "Provincial Government: How did it feel when the Valley threatened to split?"
  *   "Federal Govt: Did you feel the pressure to impose terms?"
  *   "Islanders: Did you feel you held the balance of power?"

  **Phase 2: The Boundary Problem (7 mins)**
  *   **Question:** "At what exact minute did you realize there was no 'neutral' way to count the votes?"
  *   **Concept:** Connect to the *demos* problem. If you count the whole province, the Rural majority wins. If you count sub-units, the Urban/Valley minority wins. Neither is mathematically 'truer'; both are political choices.
  *   **Question:** "Who constituted 'The People of Sorvane'?"
  *   **Point:** The definition of the people *preceded* the vote and determined the outcome. The franchise *was* the decision.

  **Phase 3: Recursion & Viability (5 mins)**
  *   **Question:** "If Brennor stays Federal, is the new Sorvane viable? If not, does Brennor have a veto?"
  *   **Concept:** The "All-affected interests" principle vs. "Territorial integrity."
  *   **Closing Thought:** "In real cases (Scotland/Catalonia), this recursion is solved not by math, but by power, courts, or force."

  ## 7. Facilitation Advice: Likely Misfires

  **1. The "Real World" Drift**
  *   *Risk:* Students start arguing about actual Scottish or Catalan history ("But in 2014...").
  *   *Fix:* Interrupt immediately. "In Sorvane, the mining subsidies work differently. Stick to the brief." Remind them the *mechanism* is the lesson, not the policy outcome.

  **2. The Deadlock**
  *   *Risk:* Groups talk past each other for 25 minutes and sign nothing.
  *   *Fix:* As the Federal Government (or Facilitator), announce at Minute 40: "5 minutes remaining. If no signature, Federal Terms apply: 60% threshold, No Fragmentation." This usually forces a compromise.

  **3. Role Confusion**
  *   *Risk:* The "Federal Government" group tries to negotiate independence terms rather than procedural rules.
  *   *Fix:* Remind them their brief says "Stability and Precedent." They are the referees, not the players, unless they impose terms.

  **4. Math Paralysis**
  *   *Risk:* Students waste time calculating exact vote counts.
  *   *Fix:* Provide the "Simulated Vote Data" in the Facilitator's pocket. Do not let them calculate; *you* reveal the result based on their agreed rules. This saves 10 minutes.

  ## 8. The Missing Feature (Closing Commentary)

  **Candid Admission:**
  You must tell the students: *"This simulation treats secession as a rational contract negotiation. It misses the **existential affect** of real nationalism."*

  **Explanation:**
  In Sorvane, the Valley stays or goes based on subsidies. In reality, people die for borders. The simulation cannot reproduce the **sacralization of territory**, the **historical trauma**, or the **fear of cultural extinction** that makes compromise feel like betrayal. In real secessionist politics, the "Boundary Problem" is rarely solved by better voting rules; it is solved by one side imposing its will, or by a shared fear of violence forcing a compromise. The simulation shows the *logic* of the dilemma; you must supply the *pathos* in your closing remarks to ensure they understand why real-world solutions are so much messier than Sorvane.
