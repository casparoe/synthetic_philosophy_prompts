prompt: |-
  This term I am responsible for a seventy-five minute workshop within a second-year undergraduate module on multinational democracy, with twenty-two students who have just spent two weeks comparing devolution and independence debates in Scotland, Catalonia, and Quebec. I want them to move beyond rehearsed arguments for and against independence and to feel from the inside the difficulty that there is no democratically neutral way to decide who constitutes the people entitled to decide, since any choice of franchise, threshold, and territorial unit already shapes the result and invites further claims from minorities within the putative new state.

  To prevent the session from becoming a proxy argument about the real cases, I plan to have them work with an invented federation I can sketch on a handout: the province of Sorvane, with about 1.2 million inhabitants, a Sorvane-speaking majority of roughly fifty-seven percent concentrated outside the mixed capital city of Brennor, a northern mining valley whose employment depends on national subsidies, and a southern island hosting a naval installation and a distinct dialect community. The task for the groups, representing the provincial government, the capital city council, the valley municipalities, the islanders, and the federal government, will be to negotiate the terms of a proposed independence referendum and then live with the consequences through at least one round of sub-unit response.

  Please design a complete, runnable exercise around this scenario that lets the recursive boundary problem emerge through the decisions themselves rather than through any introductory lecture. Include a minute-by-minute timeline that fits the seventy-five minutes, concise role briefs with divergent interests and private instructions, precise rules for proposing and voting on franchise, majority threshold, and sequencing of votes, a mechanism by which a subunit that loses can call a further vote on its own status, and a structured debrief that connects specific moments in the play to the conceptual distinction between deciding within a demos and deciding who the demos is. Also advise me on what is likely to misfire on a first run with undergraduates unfamiliar with role play and how to handle it, and identify candidly one central feature of actual secessionist politics that this format cannot reproduce and that I must therefore supply in closing commentary.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop design:

  1.  **Analyze the Request:**
      *   **Context:** 2nd-year undergraduate module on Multinational Democracy.
      *   **Duration:** 75 minutes.
      *   **Class Size:** 22 students.
      *   **Prior Knowledge:** 2 weeks comparing Scotland, Catalonia, Quebec (devolution vs. independence).
      *   **Learning Objective:** Move beyond rehearsed arguments; experience the "boundary problem" (no democratically neutral way to decide *who* decides); understand how franchise/threshold/territory shapes results and invites minority claims.
      *   **Scenario:** Invented federation "Sorvane" (1.2m people, 57% Sorvane-speaking, mixed capital Brennor, northern mining valley, southern island).
      *   **Roles:** Provincial Govt, Capital City Council, Valley Municipalities, Islanders, Federal Government.
      *   **Task:** Negotiate referendum terms -> Live with consequences (sub-unit response).
      *   **Requirements:** Complete runnable exercise, minute-by-minute timeline, role briefs (divergent interests/private instructions), rules for voting/franchise/sub-unit votes, structured debrief (connecting play to theory), advice on potential misfires, and one central feature of real politics the format misses.

  2.  **Deconstruct the Pedagogical Challenge:**
      *   *The Core Problem:* The "Boundary Problem" (Whitaker, Dahl, etc.). Who constitutes the *demos*?
      *   *The Trap:* Students often treat the boundary as given. The exercise must force them to question it.
      *   *The Mechanism:* A nested voting structure. If Sorvane votes to leave, can Brennor vote to stay? If the Valley votes to stay, does that break Sorvane's viability?
      *   *Time Management:* 75 minutes is tight for negotiation, voting, and debrief. Needs strict facilitation.
      *   *Grouping:* 22 students / 5 roles = roughly 4-5 students per group.

  3.  **Drafting the Scenario & Mechanics:**
      *   *Geography:* Sorvane (Province), Brennor (Capital), North Valley (Mining), South Island (Naval/Dialect).
      *   *Demographics:* Need to ensure no group has an absolute majority on their own to force coalition building, but the Sorvane-speaking majority needs to feel dominant enough to want independence.
      *   *The "Hook":* The Federal Government holds the legal key, but the Provincial Government holds the political mandate.
      *   *The "Twist":* The "Right to Subdivide." If the Province leaves, subunits can trigger their own referendum *if* certain conditions are met (e.g., if they voted >60% against independence).

  4.  **Developing the Timeline (75 mins):**
      *   0-5: Intro & Setup (Minimal theory, max instruction).
      *   5-20: Role Group Preparation (Internal strategy).
      *   20-45: Inter-group Negotiation (The Referendum Terms).
      *   45-55: The Vote & The Reveal (Calculating results).
      *   55-65: The Sub-Unit Trigger (The Boundary Problem emerges).
      *   65-75: Debrief (Connecting to theory).

  5.  **Designing Role Briefs:**
      *   *Provincial Govt:* Wants clean break, province-wide vote, simple majority.
      *   *Capital (Brennor):* Mixed population, economic hub. Wants to stay or have opt-out. Fears isolation.
      *   *Valley:* Economic dependency on Federal subsidies. Strongly Unionist. Wants veto or separate vote.
      *   *Islanders:* Distinct identity, strategic value. Ambivalent but protective. Wants autonomy regardless.
      *   *Federal Govt:* Wants stability, precedent management. Willing to grant referendum but strict on legality.

  6.  **Refining the Voting Mechanism:**
      *   Need a "Referendum Design Sheet."
      *   Variables: Who votes? (All citizens vs. Province only). Threshold? (50%+1 vs. 60%). Question Wording? (Clear vs. Ambiguous).
      *   *Crucial Mechanism:* The "Fragmentation Clause." If a sub-region votes >60% against independence, they can petition to remain Federal.

  7.  **Addressing Potential Misfires:**
      *   *Students arguing real politics:* Keep bringing them back to Sorvane data.
      *   *Deadlock:* Facilitator needs a "Federal Arbitrator" role (me) to impose a deadline.
      *   *Confusion:* Keep rules on one handout.
      *   *Dominant voices:* Role briefs should assign specific tasks (Speaker, Scribe, Calculator).

  8.  **Identifying the Missing Feature:**
      *   Simulations lack *emotion/history/violence*. Real secession involves blood, memory, and existential fear, not just utility calculus. I need to highlight this in the closing.

  9.  **Review and Refine (Self-Correction):**
      *   *Critique:* Is 25 minutes enough for negotiation?
      *   *Fix:* Make the negotiation highly structured. They aren't negotiating *whether* to have a referendum, but *how*.
      *   *Critique:* Will the math work?
      *   *Fix:* Provide pre-calculated population stats in the briefs so they don't waste time doing arithmetic.
      *   *Critique:* How to ensure the "Boundary Problem" emerges?
      *   *Fix:* The debrief questions must specifically target the moment they realized the "People" changed depending on the map.

  10. **Final Polish:** Check tone (academic yet practical), ensure all constraints of the prompt are met (minute-by-minute, role briefs, rules, debrief, misfire advice, missing feature). *Self-correction on the timeline:* 75 minutes is very short for 5 groups to negotiate. I need to streamline the negotiation phase. Maybe a "Marketplace" style or directed bilateral talks. Let's go with a "Constitutional Convention" style where all sit together, but groups caucus first. Actually, with 22 students, a plenary negotiation is chaotic. Better: Groups draft terms, then send 1 envoy to a "Negotiating Table" while others advise. No, too complex.
      *   *Revised Plan:* 5 Groups. They must agree on a *single* Referendum Bill. If they don't agree by minute 45, the Federal Govt imposes terms (which will be unpopular). This creates pressure.
      *   *Wait, 22 students / 5 groups = 4 or 5 per group.*
      *   *Let's simplify the negotiation:* They negotiate the *Referendum Design*, not the independence itself.
      *   *The Twist:* After the vote is simulated, the "Losers" get to activate the Fragmentation Clause.

  11. **Finalizing the Output Structure:**
      *   Title
      *   Learning Objective
      *   Materials Needed
      *   Minute-by-Minute Timeline
      *   The Scenario (Handout Info)
      *   Role Briefs (5 distinct roles)
      *   Rules of Play (Voting & Fragmentation)
      *   Debrief Structure
      *   Facilitation Advice (Misfires)
      *   The Missing Feature

  12. **Writing the Content:** (Drafting the response based on the above thoughts, ensuring the "Sorvane" details are consistent). *Check:* Did I include the specific demographic details requested? Yes (57% Sorvane-speaking, Brennor, Valley, Island). *Check:* Is the boundary problem central? Yes, via the Fragmentation Clause.

  *(Self-Correction during drafting)*: Make sure the Federal Government role doesn't dominate. Their interest is procedural stability, not necessarily blocking independence, but avoiding chaos.
  *(Self-Correction on Math)*: Ensure the population numbers add up to 1.2m roughly.
  Brennor: 400k
  Valley: 300k
  Island: 100k
  Rest of Province: 400k
  Total: 1.2m.
  Sorvane speakers: 57% (approx 684k).
  This allows for complex majorities.

