answer: |-
  ### The Tolstoyan Evaluation Procedure for Narrative Scenes

  Based on Leo Tolstoy's treatise *What Is Art?* (1897), the following decision procedure is designed to distinguish between genuine art (which infects the recipient with a feeling of human union) and counterfeit art (which relies on imitation, effect, or obscurity). This protocol prioritises moral function over aesthetic pleasure.

  #### I. Sequential Decision Procedure

  **Test 1: The Sincerity Check (The Author's Conscience)**
  *   **Operation:** Interrogate the impulse behind the scene. Did the feeling arise from an inner need to express a lived experience, or from a desire to appear skilful, clever, or original?
  *   **Pass:** The author feels a compulsion to express the specific emotional state, regardless of whether it flatters the author's reputation.
  *   **Fail:** The author admits the passage was constructed to demonstrate technical prowess, to align with a trend, or to manipulate the reader's opinion through calculation.
  *   **Irreducible Judgment Point:** Only you, the author, can access your own motive. If you are uncertain, you must write 'UNCERTAIN' and proceed to Test 2, but mark the scene for potential excision. The procedure cannot detect self-deception.

  **Test 2: The Clarity of Transmission (The Infection Test)**
  *   **Operation:** Read the scene aloud. Ask: Does the feeling experienced by the character enter *me* (the reader) immediately, without intellectual decoding? Is the feeling distinct and individual?
  *   **Pass:** The reader experiences the same distress, joy, or recognition as the character. The transmission is direct.
  *   **Fail:** The reader understands *that* the character is feeling something, but does not *feel* it themselves. The emotion is described rather than transmitted.
  *   **Irreducible Judgment Point:** You must determine the intended feeling. If the intended feeling is 'ambiguity', Test 2 asks: is the *feeling of ambiguity* transmitted, or is the text merely obscure?

  **Test 3: The Absence of Substitutive Technique (The Decoration Test)**
  *   **Operation:** Identify all metaphors, similes, rhythmic devices, and stylistic flourishes. Remove them mentally. Does the feeling remain intact?
  *   **Pass:** Technique is invisible; it serves solely as the vessel for the feeling.
  *   **Fail:** Technique draws attention to itself. If the beauty of the language distracts from the moral reality of the situation, or if a metaphor is extended beyond the point of emotional necessity, it is 'counterfeit'.
  *   **Irreducible Judgment Point:** Distinguishing between 'necessary expression' and 'ornament' is subjective. If a metaphor feels essential to *your* experience of the feeling, it passes. If it feels applied, it fails.

  **Test 4: The Accessibility Test (The Peasant Test)**
  *   **Operation:** Could this feeling be understood by a person of the simplest education, provided they are sensitive to human life? Does it rely on specialized knowledge, literary allusion, or class-specific codes?
  *   **Pass:** The feeling is universal (e.g., grief, fear, love, shame).
  *   **Fail:** The appreciation of the scene relies on knowing how to read 'literary' cues, or excludes those outside a specific cultural milieu.
  *   **Irreducible Judgment Point:** You must judge whether the 'code' of the writing excludes the common human experience.

  **Limitations of the Procedure**
  This procedure **cannot** adjudicate:
  1.  **Aesthetic Beauty:** A scene may be beautiful but counterfeit (Test 3 failure).
  2.  **Political Correctness:** A scene may be morally progressive but artistically dead (Test 2 failure).
  3.  **Future Reception:** It cannot predict whether future generations will find the feeling universal.
  4.  **Complexity of Consciousness:** It struggles with feelings that are inherently mixed or contradictory, as Tolstoy demands 'clearness'.

  ---

  #### II. Application to Draft Scenes

  **Scene 1: The Withheld Distress (Free Indirect Discourse)**
  *   **Content:** A carer notices a patient's trembling hands. Protocol forbids touching. The narration stays close to the carer's consciousness but refuses to name the emotion (e.g., 'frustration' or 'pity'), focusing instead on the texture of the gloves and the ticking clock.
  *   **Evaluation:**
      *   *Test 1 (Sincerity):* **Pass.** The impulse is to show the dehumanisation of protocol.
      *   *Test 2 (Clarity):* **Fail.** By withholding emotional labels, the transmission is obstructed. The reader infers the distress intellectually rather than being infected by it. Tolstoy argues that obscurity is a hallmark of counterfeit art designed to flatter the reader's intelligence.
      *   *Test 3 (Technique):* **Fail.** The withholding is a stylistic choice (modernist restraint) that substitutes technique for direct expression.
      *   *Test 4 (Accessibility):* **Fail.** Requires a reader trained to interpret subtext and narrative silence.
  *   **Verdict:** **Counterfeit.**
  *   **Note on Authorial Preference:** As a literary novelist, you are likely inclined to preserve this technique, valuing the psychological realism of withheld affect. The procedure condemns it as obscure and exclusive.

  **Scene 2: The Cathedral Ward (Extended Metaphor)**
  *   **Content:** The same situation, but the ward is described as a nave, the nurses as acolytes, the medicine trolley as an altar. The lighting is 'stained-glass harsh'.
  *   **Evaluation:**
      *   *Test 1 (Sincerity):* **Pass.** The author feels the sanctity/violation of the space.
      *   *Test 2 (Clarity):* **Fail.** The reader is busy decoding the metaphor (nurse = acolyte) rather than feeling the patient's distress. The focus shifts from the human beings to the imagery.
      *   *Test 3 (Technique):* **Fail.** This is the definition of 'decoration'. The metaphor is elaborate and draws attention to the author's cleverness. It substitutes an intellectual comparison for the direct feeling of the situation.
      *   *Test 4 (Accessibility):* **Fail.** Relies on cultural knowledge of cathedral architecture and liturgy.
  *   **Verdict:** **Counterfeit.**

  **Scene 3: The Practical Exchange (Dialogue)**
  *   **Content:**
      *   Carer: "Lift your arm."
      *   Patient: "It's stiff."
      *   Carer: "I know. Just to the elbow."
      *   (The carer warms the stethoscope in her palm before applying it.)
  *   **Evaluation:**
      *   *Test 1 (Sincerity):* **Pass.** The impulse is to show care within constraint.
      *   *Test 2 (Clarity):* **Pass.** The warming of the instrument transmits the feeling of tenderness directly, without naming it. The reader feels the care.
      *   *Test 3 (Technique):* **Pass.** The language is plain. No metaphor distracts from the action.
      *   *Test 4 (Accessibility):* **Pass.** Requires no education to understand the gesture of warming metal against skin. It unites reader, carer, and patient in a shared recognition of dignity.
  *   **Verdict:** **Genuine Art.**

  ---

  #### III. Revision of Verdict: Modern Narrative Form

  **The Argument for Free Indirect Discourse**
  To revise the verdict on Scene 1 (and thus accommodate Free Indirect Discourse within a Tolstoyan framework), one must advance the following argument regarding modern narrative form:

  *   **The Ethics of Opacity:** Tolstoy's theory assumes that human feelings are discrete, knowable entities that can be cleanly transmitted from one soul to another. However, modern psychology and ethics (e.g., the work of Gillian Rose or Theodor Adorno) suggest that in an institutionalised, bureaucratic age, feelings are often fragmented, repressed, or unknowable.
  *   **Reframing 'Infection':** If the 'feeling' to be transmitted is *alienation* or *the inability to connect*, then a style that withholds emotional labels (Scene 1) is not 'obscure'; it is the only *sincere* method of transmission. To label the emotion would be a lie (a counterfeit clarity). Therefore, the 'obscurity' is actually the 'clearness' of the modern condition.
  *   **Brotherhood through Witnessing:** Universal brotherhood in the 21st century may not require shared emotional states (which can be presumptive), but rather a shared acknowledgement of the *opacity* of the other. Scene 1 forces the reader to witness the carer's inability to act, creating a union based on shared powerlessness rather than shared sentiment.

  **Point of Probable Failure in Reasoning**
  The point where this revisionist reasoning is most probable to fail is at **Test 2 (The Infection Test)**.

  Tolstoy would argue that if the reader feels 'confused' or 'distant', the art has failed to infect them with a *positive* feeling of union. He distinguishes between 'bad' feelings (which can still be genuinely transmitted) and 'counterfeit' art (which transmits nothing). The failure point lies in distinguishing between:
  1.  Successfully transmitting the *feeling of alienation* (Genuine).
  2.  Failing to transmit anything because the text is merely cryptic (Counterfeit).

  There is no objective metric to separate these two states. It relies entirely on the author's claim of sincerity (Test 1), which is the weakest link in Tolstoy's chain, as authors are notoriously prone to self-deception regarding their own sincerity. If you claim Scene 1 transmits alienation, but the reader merely feels bored or puzzled by the style, the procedure collapses, and Tolstoy's original verdict stands.
