answer: |-
  **Project Title:** Beyond the Binary: Numerical Identity and Harm in Graded Embryonic Selection

  **Project Summary**
  My recent experience as a parent following preimplantation genetic testing (PGT) has transformed Derek Parfit's nonidentity problem from an abstract puzzle into an urgent personal question. In preparing to conceive, my partner and I underwent screening that revealed a substantial risk of transmitting a late-onset, non-fatal but severely debilitating autosomal neurological condition. We faced a choice not merely between existence and non-existence, but between specific embryos carrying different probabilities of expressing this condition. This clinical reality exposes a gap in contemporary population ethics. The standard nonidentity argument posits that an individual is not harmed by being brought into existence with a disability if the alternative was their non-existence, because the numerically identical person would not otherwise exist. However, in PGT contexts, the counterfactual is not a world without the child, but a world with a sibling-like potential person sharing the same parental lineage and genotype, differing only in the specific genetic markers governing the condition's timeline and severity.

  This proposal outlines a one-year philosophical investigation into whether the standard nonidentity argument holds when reproductive choice is a graded selection among genetically related embryos. I argue that the standard binary framing—existence versus non-existence—fails to capture the moral nuances of selecting between Embryo A (high risk) and Embryo B (low risk). While standard theory treats these as distinct persons, thereby negating claims of harm to the selected individual, the clinical reality suggests a moral relationship that is neither fully person-affecting nor wholly impersonal. This project seeks to determine if we require an intermediate category of ethical obligation—specifically, "lineage-affecting" duties—to account for harms incurred within a specific genetic continuum.

  **Research Question and Philosophical Significance**
  The central question driving this research is: *Does the standard nonidentity argument against harming future people require fundamental revision when reproductive choice involves graded selection among embryos that share parental genetic lineage?*

  Existing philosophical treatments typically treat the counterfactual as "a different world with a different population." This allows theorists to conclude that no numerically identical person is harmed by the choice to conceive, provided the life is worth living. However, this relies on a binary switch model of reproduction. In PGT, the rejected alternative is not absence, but a sibling-like potential person with the same genotype expressed differently. If I select the embryo with the higher risk profile, and that child develops the condition, the standard view dictates they have not been harmed relative to the alternative, because the alternative embryo is a different person. Yet, intuitively, selecting a higher-risk embryo when a lower-risk sibling-embryo was available feels like a specific failure of obligation toward the resulting child that the binary model cannot explain.

  It is crucial to note that this conceptual issue cannot be resolved through empirical or bioethical means alone. Surveying patient attitudes or analyzing regulatory guidelines would yield descriptive data regarding how decisions are made, but it cannot resolve the normative question of whether those decisions are morally justified. The "is" of clinical practice cannot determine the "ought" of moral obligation. Therefore, the method must be strictly philosophical, analyzing the criteria for harm and identity rather than measuring psychological distress or legal liability.

  **Methodology and Conceptual Framework**
  The methodology will be analytic and conceptual. I will analyze whether numerical identity remains the correct criterion for harm in graded selection cases. The project will proceed in three stages. First, I will reconstruct the standard nonidentity argument to isolate its dependence on the binary existence/non-existence counterfactual. Second, I will introduce the graded selection scenario to test the robustness of the "different person" objection. Here, I will examine whether the genetic continuity between embryos creates a moral proximity that binary models ignore.

  Third, and most critically, I will evaluate the viability of an intermediate category of reasons. Current ethics generally oscillates between person-affecting views (harm must be to a specific individual) and impersonal views (the world is worse if suffering exists, regardless of who suffers). I propose investigating "lineage-affecting" obligations. This category would posit that parents have duties not just to the specific person who results, nor to the abstract quality of the population, but to the genetic lineage itself. This would allow us to say that selecting the high-risk embryo harms the resulting child *qua* member of that lineage, even if numerical identity rules out standard person-affecting harm claims.

  **Deliverables and Success Conditions**
  The primary deliverable for the fellowship year will be a 6,000-word paper suitable for publication in a journal of philosophy or bioethics. The paper will advance a clearly demarcated thesis: either that numerical identity must be supplemented by lineage-based criteria in PGT contexts, or that the nonidentity problem remains robust even in graded selection.

  A successful outcome will involve a rigorous defense of why the graded-selection framing alters the moral calculus, potentially establishing the "lineage-affecting" category as a necessary tool for future reproductive ethics. However, I must offer an honest assessment of failure conditions. The project would be considered to have failed if the analysis demonstrates that the graded-selection framing collapses without remainder into the standard binary framing. If it turns out that the genetic similarity between embryos is morally irrelevant compared to the fact of numerical distinctness, then the standard Parfitian conclusion stands, and the proposed intermediate category is unnecessary. While this would be a negative result, it is a philosophically significant one that would clarify the limits of nonidentity critiques.

  **Scope and Feasibility**
  This project is scoped strictly for a one-year timeline. The focus will remain on the conceptual coherence of harm and identity in graded selection. I will explicitly avoid drifting into full-blown population ethics, which would require addressing aggregate welfare across generations, nor will I make specific clinical policy recommendations. The goal is not to tell clinicians how to counsel patients, but to provide the conceptual architecture that makes sense of the obligations involved. By restricting the inquiry to the specific transition from binary to graded choice, and by focusing on the definition of harm rather than the regulation of technology, the project remains manageable while addressing a gap that is increasingly urgent as genetic screening becomes standard practice. This fellowship will provide the necessary time to refine these distinctions, ensuring that the resulting work offers a durable contribution to the philosophy of medicine.
