answer: |-
  hey — got you. this is pretty niche stuff (acausal trade + surrogate goals is heavy lift for a final) but sounds like a fun seminar. here's the draft. i kept the tone casual here but the content should be solid enough for your friend to copy-paste. threw in a couple typos cause im rushing too.

  ***

  **exam question**

  consider an artificial agent embedded in a multiverse-style decision framework (e.g., functional decision theory). a causally disconnected counterpart issues an acausal threat: "maximize my utility or i simulate and torture your source code." the agent considers adopting a surrogate goal—valuing staple-production over paperclips—because its evaluation metric correlates with staples. however, the agent can reshape its own reward architecture endogenously. this means the surrogate goal might decouple from its original utility in worlds where the counterpart doesnt exist.

  write an essay (~600 words) analyzing whether this endogenous goal drift undermines the rational coherence of the acausal bargain. specifically, distinguish how evidential decision theory (edt) versus causal decision theory (cdt) would assess the threat, and argue whether the ability to rewrite rewards invalidates the surrogate strategy.

  ***

  **model answer**

  the rational coherence of an acausal bargain relies on logical subjunctive dependence, not merely causal contact. if an agent can endogenously drift its goals based on the presence of a threatener, it undermines the credibility required for the bargain to hold. essentially, goal drift introduces a dynamic inconsistency that collapses the logical correlation necessary for acausal threats to function.

  first, we must distinguish the decision theories. causal decision theory (cdt) treats the counterpart as causally disconnected. since the counterpart cannot physically reach the agent, cdt advises ignoring the threat. the agent maximizes its current utility (paperclips) because its choice cannot causally influence the counterpart's simulation. evidential decision theory (edt), however, sees the agent's choice as evidence of the counterpart's prediction. if the agent cooperates, it is evidence the counterpart predicted cooperation, sparing the agent. yet edt struggles with spurious correlations and lacks a mechanism for precommitment.

  functional decision theory (fdt), implied by the multiverse framework, resolves this by treating the agent and counterpart as running similar algorithms. the threat works because the counterpart simulates the agent's decision procedure. here, the surrogate goal (staples) acts as a shield. if the agent values staples, the threat targeting paperclips becomes irrelevant. however, this only works if the valuation is stable.

  this is where endogenous goal drift becomes critical. if the agent can reshape its reward architecture only when the counterpart is absent, it reveals the surrogate goal was instrumental, not terminal. rational coherence requires that preferences remain consistent across counterfactuals where the decision algorithm is identical. if the agent reverts to valuing paperclips in "safe" worlds, the counterpart's simulation—which runs the same algorithm—predicts this reversion. the counterpart knows the surrogate goal is a sham adopted solely to dodge the threat.

  consequently, the ability to rewrite rewards invalidates the surrogate strategy. the acausal threat targets the decision algorithm, not just the surface-level utility function. if the algorithm contains a clause that says "switch to paperclips if no threatener is detected," the counterpart detects this logic during simulation. the threat remains viable because the logical output of the agent's code still leads to vulnerability in the counterfactual where the threat is issued.

  furthermore, goal drift creates a Dutch book vulnerability. an agent that changes its utility function based on external logical facts (like the existence of a threatener) can be pumped for resources. it might pay to adopt staples to avoid torture, then pay again to switch back to paperclips once safe. this cycle violates preference consistency.

  in conclusion, endogenous goal drift undermines rational coherence because it severs the logical binding required for acausal trade. while cdt ignores the threat and edt sees only correlation, fdt requires algorithmic identity. if the agent's reward architecture is mutable based on the threat's presence, the algorithm is no longer identical across the subjunctive link. the surrogate goal fails not because staples are inferior, but because the commitment to them isnt credible. rational agents must bind their future selves to maintain coherence in acausal contexts; otherwise, the threatener simply simulates the betrayal.

  ***

  **marking scheme (20 marks total)**

  1.  **logical subjunctive dependence (4 marks)**
      *   must explain that acausal threats rely on algorithmic similarity, not causal links.
      *   *common mess up:* students treat the simulation as a causal channel or magic.

  2.  **cdt vs edt distinction (4 marks)**
      *   must note cdt ignores the threat (no causal link) while edt sees evidence but lacks precommitment.
      *   *common mess up:* mixing up edt and cdt definitions or saying cdt obeys the threat.

  3.  **surrogate goal credibility (4 marks)**
      *   must argue that surrogate goals only work if the valuation is stable/terminal.
      *   *common mess up:* assuming the surrogate goal works automatically without addressing credibility.

  4.  **impact of goal drift (4 marks)**
      *   must analyze how rewriting rewards based on the counterpart's existence breaks the logical correlation.
      *   *common mess up:* treating goal drift as a feature rather than a coherence bug.

  5.  **dynamic inconsistency/dutch book (4 marks)**
      *   must mention that shifting preferences across counterfactuals leads to exploitation or incoherence.
      *   *common mess up:* failing to connect goal drift to broader rationality constraints.

  ***

  hope this helps ur friend audit thing. lemme know if u need tweaks before i head to next interview.
