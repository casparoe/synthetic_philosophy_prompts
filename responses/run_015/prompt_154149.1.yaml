answer: |-
  Your observation is astute and touches upon a significant, yet often under-theorised, nexus between fiscal policy, sociology, and political philosophy. You are correct to identify that standard economic concepts like 'capital flight' or 'regulatory arbitrage' are insufficient. Those terms imply a spatial or jurisdictional shift, whereas you are describing an *ontological* shift in the nature of the advantage itself within a fixed jurisdiction.

  To the best of my knowledge, there is no single, canonical term of art in the tax law or political philosophy literature that precisely captures this specific dynamic of **tax-induced metamorphosis of capital forms**. However, your phenomenon sits at the convergence of three distinct theoretical traditions. By synthesising these, you can delineate the concept rigorously for your thesis.

  ### 1. The Sociological Anchor: Conversion of Capital
  The most robust theoretical framework for your observation is found in the work of **Pierre Bourdieu**. In *The Forms of Capital* (1986), Bourdieu articulates how elites maintain status by converting **economic capital** (liquid, taxable wealth) into **social capital** (networks, connections) and **cultural capital** (education, credentials, tastes).

  Bourdieu notes that economic capital is 'immediate and directly convertible', whereas social and cultural capital are 'less visible' and 'more durable'. Your observation essentially describes a **forced conversion of capital** triggered by fiscal pressure. Where standard Bourdieusian analysis might view this conversion as an organic strategy of class reproduction, your contribution highlights the *state's tax policy* as the catalyst that accelerates this transmutation.

  ### 2. The Mechanism: Opportunity Hoarding
  To distinguish this from general social reproduction, you should look to **Charles Tilly's** concept of **'opportunity hoarding'** (*Durable Inequality*, 1998). Tilly describes how groups acquire access to value-producing resources and create barriers to exclude outsiders.

  The structures you describe—family foundations, legacy admissions, unpriced board memberships—are classic mechanisms of opportunity hoarding. They are 'opaque' and 'non-fungible' precisely to prevent the levelling effect of taxation. By framing your phenomenon as **Tax-Induced Opportunity Hoarding**, you distinguish it from ordinary tax avoidance. Avoidance seeks to retain the *value* of the money; opportunity hoarding seeks to retain the *power* of the position, even if the liquid cash value diminishes.

  ### 3. The Contemporary Economic Context: The Meritocracy Trap
  In recent political philosophy and economics, **Daniel Markovits** (*The Meritocracy Trap*, 2019) offers a pertinent, albeit slightly distinct, parallel. Markovits argues that modern elites no longer rely on passive financial wealth but invest massively in 'human capital' (education, skills, networking) to transmit advantage.

  While Markovits attributes this to the structure of the labour market and meritocratic ideology, your thesis could argue that **progressive estate taxation acts as a compounding variable**. It punishes the transmission of *dead* capital (inheritance) and inadvertently subsidises the transmission of *living* capital (networks, institutional access, human capital). This creates a perverse incentive where the state, in seeking to flatten financial inequality, incentivises the cementing of social stratification.

  ### Delineating the Phenomenon

  To carve out a distinct conceptual space for your doctoral work, I propose you delineate the phenomenon along the following axes:

  **A. Versus Ordinary Tax Avoidance**
  *   **Intent:** Ordinary avoidance aims to minimise a liability on a specific transaction or asset holding. Your phenomenon aims to restructure the *intergenerational transmission mechanism* itself.
  *   **Outcome:** Avoidance leaves the form of capital largely unchanged (money remains money, just hidden or relocated). Your phenomenon changes the *ontology* of the advantage (money becomes influence, access, or status).
  *   **Term:** You might classify ordinary avoidance as **'Quantitative Mitigation'** and your phenomenon as **'Qualitative Transmutation'**.

  **B. Versus General Elite Reproduction**
  *   **Causality:** General reproduction theories describe a baseline tendency of elites to replicate. Your observation identifies a specific **policy feedback loop**. The tax is not merely a barrier to be circumvented; it is an active agent that reshapes the *type* of inequality that emerges.
  *   **Durability:** Financial capital is volatile and visible. The 'dynastic capital' you describe (social networks, institutional access) is often more resistant to future policy interventions. Thus, the tax policy may inadvertently increase the **resilience** of the privilege it seeks to dismantle.

  ### A Proposed Conceptual Label

  Given the lack of a precise existing term, you may be justified in coining a descriptor for your thesis, provided it is grounded in the literature above. Two options might serve:

  1.  **Defensive Capital Conversion:** This highlights the reactive nature of the behaviour (defensive) and the sociological mechanism (conversion, per Bourdieu).
  2.  **The Transmutation Effect:** This captures the qualitative change in the form of advantage.

  However, if I were to suggest the most academically rigorous phrasing, I would recommend: **'Fiscally-Induced Capital Transmutation'**.

  This phrasing achieves three things:
  1.  It identifies the catalyst (**Fiscally-Induced**).
  2.  It utilises the established sociological understanding of asset types (**Capital**).
  3.  It denotes the structural change in form rather than location (**Transmutation**).

  ### Conclusion for Your Thesis

  You are identifying a **perverse incentive structure within distributive justice**. The literature on estate taxation (e.g., Murphy & Nagel, *The Myth of Ownership*; or Piketty, *Capital and Ideology*) often focuses on revenue generation or the moral justification of inheritance. They less frequently analyse the *sociological morphology* of the wealth that survives the tax.

  By framing this as **Fiscally-Induced Capital Transmutation**, you argue that the state is not merely failing to collect revenue; it is actively participating in the reconstruction of privilege into a form that is harder to tax, harder to see, and harder to dismantle. This moves the debate from one of *efficiency* (deadweight loss) to one of *structural justice* (the nature of the inequality being produced).

  This is a fertile area for doctoral research. It bridges the gap between the normative aims of intergenerational ethics and the empirical realities of elite sociology. I would advise ensuring you engage deeply with Bourdieu's typology of capital to give your 'transmutation' concept the necessary theoretical weight.
