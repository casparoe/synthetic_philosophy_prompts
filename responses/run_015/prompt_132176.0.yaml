          4.  Reconstruct the implicit epistemology (Humean, Structural-Realist, or Anti-Realist Pragmatism).
          5.  Counterfactual: If the view changed to allow structural analogies regardless of substrate, what elements of the protocol (scoring, weighting, incentives) would change vs. remain underdetermined?
      *   **Constraint:** Answer in British English.

