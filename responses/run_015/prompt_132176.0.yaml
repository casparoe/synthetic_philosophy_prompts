      *   *Anti-Realist Pragmatism:* This is the strongest candidate. The selection of reference classes is a *decision*. The exclusion rule is a convention to manage uncertainty and liability. It treats "historical kinds" as useful fictions for calibration, not mind-independent realities.
      *   *Conclusion:* It is a hybrid, but predominantly a **pragmatic structuralism**. It posits real structures (realism) but acknowledges the selection of those structures is driven by epistemic limits (pragmatism).

  6.  **Address Question 5: Counterfactual (Structural Analogies Regardless of Substrate):**
      *   *Scenario:* Assume tech doesn't break the analogy (e.g., AI war is structurally identical to Napoleonic war).
