  *(Self-Correction on the "Goodman" point)*: Goodman's point is about linguistic entrenchment. The protocol's exclusion is about *ontological* discontinuity (tech regimes). I need to clarify that while it *resembles* a Goodmanian constraint, it's actually more about causal stability than linguistic habit.

  *(Self-Correction on the "Counterfactual")*: If structural analogies are projectible regardless of substrate, the "Outside View" becomes much broader. This dilutes the base rate. The protocol would need to shift towards scenario planning rather than statistical forecasting.

