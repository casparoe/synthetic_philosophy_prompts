prompt: |-
  I'm teaching an undergraduate seminar that pairs W. E. B. Du Bois's 1926 essay on art as propaganda with Ralph Ellison's novel Invisible Man, and I want a close reading that takes both the novel and Du Bois's argument seriously enough to let each complicate the other, rather than settling for the standard classroom cliché that Ellison simply rejected the propagandistic protest fiction Du Bois demanded. As I understand Du Bois, his thesis is not just the empty sociological claim that every artwork has some effect on someone; it is the normative claim that artists, and especially Black artists working under white supremacy, must accept that their work is always in the business of shaping belief, desire, and perception, and must therefore take responsibility for the propaganda they make, while also insisting that propaganda in the service of what he regarded as truth and human flourishing is categorically different from propaganda in the service of lies and dehumanization.

  To get my students past the exhausted art-for-art's-sake-versus-protest-literature binary, I've been developing a distinction in my own notes that I want you to test. I use the term directive propaganda for any artwork whose primary aim is to get its audience to accept a specific proposition, party line, or call to action; I use the term propaganda of the sensorium for any artwork that, without necessarily issuing directives, reshapes what its audience can perceive, enjoy, imagine, or love, and thereby changes the conditions under which later beliefs and actions become possible. I suspect Du Bois's real interest is in the second category: when he insists that Black folk must gain the freedom to experience love and joy as part of full humanity, he is asking for more than novels that denounce Jim Crow, and he is also asking for something different from art that is merely beautiful in a raceless way. Read Invisible Man through this distinction and through Du Bois's essay.

  In particular, I want you to examine at least three moments: the prologue, in which the invisible narrator lights his basement with dozens of purloined light bulbs and insists he is not a spoiler or a revolutionary; the paint factory episode, in which the narrator's technical precision accidentally produces an explosion after he has been told to make the paint whiter than white; and the narrator's final seclusion, where he remains in his underground hole writing the very book we are reading rather than returning to the Brotherhood or to Harlem's streets. Does the novel vindicate Du Bois, showing that even a work that mocks directives is still reshaping the sensorium of its readers? Does it complicate Du Bois by suggesting that the most politically indispensable propaganda may be propaganda the artist refuses to own as propaganda, or that a work can be duplicitously directive while pretending only to cultivate perception? Where does Ellison's novel resist the Du Boisian reading altogether, say, in the narrator's refusal to be a representative Black voice, in the novel's treatment of the Brotherhood's tracts, or in its suspicion that any claim to speak for the race is already a kind of capture? Please don't quote the novel verbatim; paraphrase its major scenes and analyze them instead. End by saying what the novel adds to the philosophical debate about art and propaganda that neither Du Bois's essay nor a purely theoretical distinction like mine can supply on its own.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Undergraduate seminar pairing W. E. B. Du Bois's "Criteria of Negro Art" (1926) with Ralph Ellison's *Invisible Man* (1952).
      *   **Goal:** A close reading that complicates the standard "Ellison rejected Du Bois" narrative. Instead, show how they interrogate each other.
      *   **User's Framework:**
          *   *Directive Propaganda:* Art aiming for specific propositions/actions (party line).
          *   *Propaganda of the Sensorium:* Art reshaping perception, imagination, affect (conditions for belief/action).
          *   *User's Interpretation of Du Bois:* Not just "all art is propaganda" (sociological), but "Black artists *must* take responsibility for the propaganda they make" (normative), specifically advocating for truth/human flourishing (love, joy) against dehumanization.
      *   **Specific Scenes to Analyze:**
          1.  Prologue (Light bulbs, "not a spoiler," "not a revolutionary").
          2.  Paint Factory (Optic White, explosion, technical precision).
          3.  Epilogue/Final Seclusion (Writing the book in the hole, refusing Brotherhood/Harlem).
      *   **Key Questions to Address:**
          *   Does the novel vindicate Du Bois (reshaping sensorium even while mocking directives)?
          *   Does it complicate Du Bois (refusing to own the propaganda, duplicitous directiveness)?
          *   Where does it resist Du Bois (refusal of representation, suspicion of speaking for the race)?
          *   Conclusion: What does the novel add to the philosophical debate that theory alone cannot?
      *   **Constraint:** Do not quote the novel verbatim; paraphrase and analyze.

  2.  **Deconstruct the Theoretical Framework:**
      *   *Du Bois:* Often misread as demanding socialist realism or protest literature. The user's reading is more nuanced: it's about *responsibility* and *humanization*. Art isn't neutral; it shapes how Black people are seen and see themselves.
      *   *Ellison:* Often misread as purely aestheticist ("art for art's sake"). *Invisible Man* is deeply political but skeptical of ideological capture.
      *   *The Distinction:* "Directive" vs. "Sensorium." This is a strong heuristic. It allows us to say Ellison rejects *Directive* propaganda (Brotherhood tracts) but engages in *Sensorium* propaganda (making the reader *feel* invisibility).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the user's framework. State the thesis: *Invisible Man* performs a "propaganda of the sensorium" that fulfills Du Bois's deeper imperative (humanization/truth) while radically rejecting his surface-level demand for "directive" racial representation. It shows that refusing to be a "spokesman" is itself a political act of perception-shaping.

      *   **Scene 1: The Prologue (The Light Bulbs):**
          *   *Context:* Narrator in the basement, stealing power, lighting the space.
          *   *Directive:* He explicitly says he is *not* a revolutionary or a spoiler. He rejects the directive label.
          *   *Sensorium:* But the light itself is an act of visibility. He forces the reader to see his invisibility. The act of consuming 1,369 lights is a sensory overload.
          *   *Du Bois Connection:* Du Bois wants Black life illuminated. The narrator illuminates himself, but on his own terms, not for a white gaze or a party cause. It validates Du Bois's claim that art shapes perception (we now see the "hole"), but complicates the *purpose* (it's for the narrator's sanity/philosophical clarity, not mass mobilization).

      *   **Scene 2: The Paint Factory (Optic White):**
          *   *Context:* Making paint whiter than white. The drop of black dope makes it perfect. Explosion.
          *   *Directive:* The factory wants a product that erases difference (pure white). This is the ultimate "directive" of white supremacy—assimilation/erasure.
          *   *Sensorium:* The narrator's confusion, the chemical sensory experience, the explosion. It reveals the violence inherent in the demand for purity.
          *   *Du Bois Connection:* Du Bois argues against art that dehumanizes. The factory represents the dehumanizing machinery. The narrator's failure to make the paint "right" without the black drop is a metaphor for the necessity of Black presence in American identity. This is "propaganda of the sensorium"—it makes the reader *feel* the absurdity of racial erasure. It vindicates Du Bois's idea that art reveals truth, but shows the truth is paradoxical (the black drop makes the white whiter).

      *   **Scene 3: The Epilogue (The Hole and the Book):**
          *   *Context:* Hibernation. Writing the memoir. Refusing to come out yet.
          *   *Directive:* He refuses the Brotherhood's directives. He refuses to lead a riot.
          *   *Sensorium:* The act of writing *is* the action. He is shaping his own consciousness and the reader's. "Who knows but that, on the lower frequencies, I speak for you?"
          *   *Du Bois Connection:* Du Bois wants artists to take responsibility. The narrator takes responsibility for his own story, rejecting the responsibility of being a "race leader." This complicates Du Bois: Is refusing to represent the race a dereliction of duty (Du Bois might say yes) or the only way to tell the truth (Ellison says yes)?
          *   *Key nuance:* The book *is* the propaganda. By writing it, he changes the sensorium of the reader.

      *   **Synthesizing the Debate (Vindication vs. Complication vs. Resistance):**
          *   *Vindication:* Ellison proves Du Bois right that all art is political. Even rejecting politics is a political stance that shapes perception.
          *   *Complication:* Ellison suggests that *owning* the propaganda (as Du Bois asks) might be a trap. If you admit you are making propaganda, you become a tool. The most effective "sensorium propaganda" pretends to be just a story or a philosophical musing.
          *   *Resistance:* The refusal of "representative" status. Du Bois often spoke of "The Negro Problem." Ellison hates the "problem" framing. The narrator is an *individual* who happens to be Black, not a synecdoche for the race. This resists Du Bois's sociological imperative.

      *   **Conclusion (What the Novel Adds):**
          *   Theory (Du Bois/User's distinction) is abstract. The Novel provides the *phenomenology* of invisibility.
          *   It shows the *risk* of sensorium propaganda: It can lead to isolation (the hole).
          *   It shows the *danger* of directive propaganda: It leads to explosions (literal and social).
          *   Final takeaway: The novel argues that the highest form of political art is the cultivation of complex interiority, which Du Bois hinted at (love/joy) but the novel enacts through the struggle of voice.

  4.  **Review and Refine:**
      *   *Check Constraints:* Did I quote? No. Did I cover the three scenes? Yes. Did I use the user's terminology ("Directive" vs. "Sensorium")? Yes. Did I treat Du Bois seriously (not as a strawman)? Yes.
      *   *Tone:* Academic, respectful, nuanced, suitable for an undergraduate seminar context (but sophisticated).
      *   *Self-Correction during drafting:* I need to make sure I don't just say "Ellison agrees." I need to highlight the tension. Du Bois wants *responsibility*; Ellison thinks *responsibility to the race* can be a cage. The "Sensorium" concept bridges this: Ellison takes responsibility for the *truth of perception*, not the *direction of action*.

  5.  **Final Polish:** Ensure the transition between the specific scenes and the broader philosophical conclusion is smooth. Make sure the distinction between "Directive" and "Sensorium" is applied consistently. (Self-correction: Ensure I explicitly mention the "black drop" in the paint scene as a metaphor for the inescapable racial reality that Du Bois insists on acknowledging).

  6.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a sophisticated pedagogical framework that rescues Du Bois from the caricature of a rigid sociological functionalist and rescues Ellison from the caricature of an aloof aestheticist. Your distinction between *directive propaganda* (aimed at specific action/belief) and *propaganda of the sensorium* (aimed at reshaping the conditions of perception and affect) is an excellent heuristic for navigating the tension between these two texts. It allows us to see that Ellison's rejection of "protest literature" is not a rejection of political utility, but a rejection of a specific, limited mode of utility.

  Here is a close reading of *Invisible Man* through your framework and Du Bois's "Criteria of Negro Art," examining how the novel vindicates, complicates, and resists the Du Boisian position.

  ### The Prologue: Illuminating the Hole
  In the novel's opening, the narrator describes his underground hibernation, a space illuminated by exactly 1,369 light bulbs powered by electricity stolen from the municipal grid. He explicitly addresses the reader to clarify his political status: he is not a "spoiler," nor is he a revolutionary in the organized sense. He rejects the *directive* label. He is not issuing a call to arms, nor is he outlining a program for racial uplift.

  However, through your lens, this scene is a masterclass in *propaganda of the sensorium*. Du Bois argues that Black artists must present the truth of Black life to combat the lies of white supremacy. Usually, this is read as demanding realistic depictions of suffering or triumph. Ellison complicates this by presenting a surreal, philosophical spectacle. By flooding his hole with light, the narrator forces the reader to perceive the paradox of his existence: he is invisible, yet he consumes more power than most visible citizens. He creates a sensory experience of hyper-visibility within total isolation.

  This vindicates Du Bois's normative claim that the artist shapes perception. The narrator is not asking the reader to join the NAACP or the Brotherhood; he is asking the reader to adjust their vision to see a man who exists outside the "dream" of American race relations. He takes responsibility for the propaganda, as Du Bois demands, but the message is not a directive policy; it is an ontological claim. He is reshaping the reader's sensorium to accommodate the reality of invisibility. If Du Bois insists that Black folk must gain the freedom to experience full humanity, the narrator claims that humanity by asserting his right to define his own space, even if that space is underground. The art here is the act of self-illumination, which changes the conditions under which the reader can later understand the narrator's actions.

  ### The Paint Factory: The Violence of Purity
  The episode at the Liberty Paints plant offers a potent critique of *directive propaganda* disguised as industrial neutrality. The narrator is tasked with mixing a chemical drop into the paint to make "Optic White" the whitest white possible. The directive from his supervisors is technical and apolitical: follow the formula, achieve purity. This mirrors the demand placed on Black artists (and citizens) to assimilate into a "raceless" American ideal—a directive that demands the erasure of difference.

  When the narrator accidentally disrupts the formula, or perhaps when the formula reveals its dependence on the very blackness it seeks to cover (the black dope makes the white whiter), the result is an explosion. This scene complicates Du Bois's argument by suggesting that the "truth" Du Bois wants art to serve is not always accessible through honest representation. Here, the truth is structural and violent. The factory does not want a narrative; it wants a product.

  Ellison suggests that *directive propaganda* (the factory's order to make white paint) is inherently dehumanizing because it demands the suppression of the "black drop" of complexity. By contrast, the narrator's confusion and the subsequent explosion function as *propaganda of the sensorium*. The reader does not leave this chapter with a slogan about labor rights or integration. Instead, the reader is left with a sensory memory of the toxicity of purity. This aligns with Du Bois's insistence that art must fight dehumanization, but it pushes further: it suggests that the very language of "purity" and "directives" is the tool of dehumanization. The novel argues that the most truthful art might be that which exposes the impossibility of the directive itself. The explosion is the sensorium reacting to the lie of Optic White.

  ### The Epilogue: The Refusal of Representation
  In the final seclusion, the narrator remains in his hole, writing the memoir we have just read. He explicitly rejects the Brotherhood's tracts, which are the novel's clearest symbol of *directive propaganda*. The tracts reduce complex human suffering to abstract historical forces and demand specific actions in service of a future utopia. The narrator also refuses to return to the streets of Harlem to lead the people, despite the implication that he could.

  This is where the novel most sharply resists a simplistic Du Boisian reading. Du Bois often operated under the burden of representation, feeling that the Talented Tenth must speak *for* the race. He viewed art as a vehicle for racial vindication. The narrator of *Invisible Man* explicitly abdicates this role. He says he is through with trying to speak for anyone else. He asks, "Who knows but that, on the lower frequencies, I speak for you?" This is a crucial shift. He moves from speaking *for* the race (a directive, representative claim) to speaking *to* the human condition (a sensorium claim).

  However, this ultimately vindicates Du Bois's deeper philosophical insight. Du Bois argued that propaganda in the service of truth is different from propaganda in the service of lies. By refusing to be a "representative Black voice," the narrator is actually serving the truth of his specific experience rather than a lie about racial unity. The book itself becomes the *propaganda of the sensorium*. By writing the text, the narrator is not organizing a party; he is organizing the reader's consciousness. He takes responsibility for the story, which is the only form of responsibility Du Bois ultimately requires. The novel suggests that the most politically indispensable work is one that refuses to be owned as a tool, because once art admits it is a tool (directive), it becomes susceptible to the same manipulation as the Brotherhood's tracts.

  ### Complicating the Binary: Duplicity and Responsibility
  Your distinction helps reveal where Ellison thinks Du Bois might be vulnerable. Du Bois asks artists to *accept* that they are making propaganda and to do so responsibly. Ellison suggests that this acceptance is a trap. If you admit your art is propaganda, you invite the audience to judge it by its political efficacy rather than its truth.

  *Invisible Man* implies that the most effective *propaganda of the sensorium* is duplicitous; it must pretend to be merely a story, a memoir, or a philosophical musing to bypass the reader's ideological defenses. The narrator's refusal to "own" his propaganda is a strategic necessity. If he claimed, "I am writing this to change your mind about race," the white liberal reader (like the narrator's former benefactors) would categorize and dismiss it. By claiming, "I am just telling you what happened to me," he infiltrates the reader's sensorium more deeply. This complicates Du Bois's call for transparency. Ellison suggests that in a world built on racial lies, a certain amount of artistic duplicity—hiding the political aim within the aesthetic form—is required to tell the truth.

  ### Conclusion: What the Novel Adds to the Debate
  Theoretical distinctions like "directive" versus "sensorium," and Du Bois's normative claims, remain abstract until tested against the phenomenology of the novel. *Invisible Man* adds three crucial elements to the philosophical debate about art and propaganda that theory alone cannot supply:

  1.  **The Risk of Interiority:** Du Bois emphasizes the social function of art. Ellison shows the cost of the *propaganda of the sensorium* on the artist himself. The narrator's commitment to reshaping perception requires his withdrawal from society (the hole). The novel asks whether the cultivation of complex interiority is worth the price of political isolation. It warns that art which refuses directives may save the soul but lose the community.
  2.  **The Unpredictability of Reception:** Du Bois assumes the artist can control the propaganda's effect if they are responsible. Ellison shows that once the art enters the world, the artist loses control. The narrator's grandfather's advice (a form of directive) is misinterpreted for generations. The novel suggests that *propaganda of the sensorium* is inherently unstable; it changes the conditions of perception, but it cannot guarantee what new beliefs will grow from those conditions.
  3.  **The Necessity of the "Lower Frequencies":** Finally, the novel argues that political change is not just about changing laws or parties (directives), but about changing the "frequencies" of human recognition. Du Bois hints at this with his talk of love and joy, but Ellison dramatizes the difficulty of achieving it. The novel posits that before a directive can be just, the sensorium must be capable of perceiving the humanity of the other.

  In your seminar, you can conclude that Ellison does not refute Du Bois; he radicalizes him. He agrees that art is never neutral and that Black artists bear a heavy responsibility. But he argues that the highest form of that responsibility is not to issue directives, but to forge a language complex enough to survive the distortions of racism—a *propaganda of the sensorium* that makes the invisible visible, even if it takes place in the dark.
