prompt: |-
  You are an expert philosopher of mind with specialized knowledge of Daniel Dennett's account of real patterns and the explanatory stances—physical, design, and intentional. Before drafting anything, please think carefully and begin with a brief conceptual map: distinguish what makes a pattern "real" in Dennett's sense from a mere predictive convenience, flag the risk of treating the design stance as purely mechanistic when applied to adaptive technology, and note where his classic illustrations (thermostats, chess-playing systems) might mislead if imported uncritically into clinical assessment.

  I am a university student currently enrolled in an advanced course on philosophy of mind and cognitive science. For my capstone project I am embedded with a clinical neuroethics review board that evaluates anomalous actions performed by patients using brain-computer interface (BCI) assistive devices. The board convenes biweekly, each case must be adjudicated within forty-eight hours, and every recommendation requires dual sign-off by both a neurologist and an ethicist. The officers are not philosophers; they need a reusable, step-by-step decision procedure they can run repeatedly on incoming reports.

  Please turn Dennett's three-stance framework into a concrete operational protocol—presented as an ordered checklist or flowchart in words—that a non-philosopher review officer could apply under time pressure. For each stage specify: (a) the precise question to ask, (b) what observable or documented evidence counts as a sufficient answer, (c) which stance is provisionally assigned if the threshold is met, and (d) the explicit termination point where the procedure outputs "no stance determinable—escalate to full board review." You must embed clearly marked "judgment gates": points where deciding between the design stance (the BCI's programmed decoding logic) and the intentional stance (the patient's beliefs and desires) depends not on further empirical testing but on normative commitments about agency, identity, or the boundaries of the self—so the officer knows to invoke the ethicist rather than render a unilateral call.

  Then apply the protocol to three cases:
  1. A BCI user with motor-cortex implants suddenly initiates a financial transfer that flatly contradicts her previously documented intentions; post-hoc neural logs reveal an electrode-drift artifact consistent with spurious signal amplification.
  2. The same user, in a separate session, produces a communicative act that aligns with her stated goals but employs syntactic and semantic structures never present in her training corpus or prior BCI outputs, suggesting emergent patterning in the decoding algorithm.
  3. A case where the procedure returns an answer—specify which stance and why—that the board will almost certainly reject on moral or legal grounds despite the protocol's internal consistency; explain exactly where the framework produces that result and why human judgment must override it.

  Finally, state explicitly what this procedure cannot accomplish. For instance, can it resolve disputes about whether the BCI-mediated action belongs to the patient in a metaphysical sense, or does it presuppose a stable user-device boundary that Dennett's pattern realism might dissolve? Be honest about predictable misfires, especially in cases involving gradual neural adaptation or shared control architectures.

  Keep the deliverable free of bibliographies, citation requests, or appeals to obscure secondary literature; ground everything in the conceptual structure of the stances themselves and in the practical constraints I have described.
