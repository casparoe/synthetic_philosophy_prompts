      *   Section 2: The Larynx Problem (Speech as Exaptation).
      *   Section 3: The Normativist Attack (Harm > History).
      *   Section 4: Naturalist Defenses (Recent selection, Systemic function).
      *   Section 5: Evaluation & Conclusion (Theory needs modification or fails).

