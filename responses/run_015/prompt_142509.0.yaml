  This principle has three clauses, each motivated by a specific tension in your verdicts. First, **Beneficiary Congruence** requires that the nudger not profit from the cognitive bias exploited; this distinguishes Case 1 (cafeteria, health-aligned) from Case 5 (supermarket, profit-aligned) and Case 12 (app, engagement-aligned vs. user welfare). Second, **Friction Transparency** allows easing desired paths but forbids covertly burdening alternatives; this distinguishes Case 3 (pleasant stairs, reduced friction) from Case 4 (slowed lift, hidden cost) and Case 9 (false norm, hidden truth). Third, **Default Scope** permits defaults only where reflective preferences are stable or the cost of error is low; this distinguishes Case 2 (pension, reversible/financial) and Case 6 (organs, post-mortem/altruistic) from Case 7 (resuscitation, bodily autonomy/high stakes).

  Your proposed clauses are partially correct but incomplete. **Index Fidelity** is necessary but insufficient: it passes Case 4 (health is the end) yet you rightly reject it, because fidelity ignores the *method* of alignment. **Disclosure Elasticity** is a heuristic, not a principle: it correctly flags Case 9 (lying fails disclosure) but wrongly implicates Case 14 (risk charts rely on disclosure) and Case 10 (appointment texts may resist disclosure but remain permissible). Keep Index Fidelity as a baseline condition, but discard Elasticity as a moral boundary; it measures manipulability, not wrongness.

  My candidate accommodates all your firm verdicts (1–9, 12–14). I would overturn none of your settled judgments, but I compel you to abandon agnosticism on Case 11 and resolve Case 10. Regarding your new cases: nudges aimed at goals the nudgee rejects fail Beneficiary Congruence and are impermissible; employer defaults are permissible only if aligned with employee welfare (e.g., safety) rather than productivity alone; choice architecture for children is permissible if it protects future agency (Congruence with future self); interventions making people more patient are permissible only as pre-commitment devices chosen by the agent (like Case 2), not as covert constraints.

  For the two cases you must draft: Case 10 (appointment text) is **Fine**. It satisfies Congruence (clinic and patient want attendance) and Friction Transparency (the reply requirement is stated, not hidden), so you should draft it without hesitation. Case 11 (bootstrapped flu letter) is also **Fine**. The statement is true, satisfying Veracity, and the feedback loop serves a congruent health goal; the bootstrapping is efficient policy, not deception, so you should endorse it.
