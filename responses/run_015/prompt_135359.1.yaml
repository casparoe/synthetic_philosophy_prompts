answer: |-
  The mechanical crux is stability under reflection versus static consistency. Standard idealized preference models apply a debiasing function $D$ to current utilities $U$, yielding $U' = D(U)$. This assumes biases are exogenous noise to be subtracted. CEV-R, however, seeks a fixed point where $U^* = D(U^*, \text{knowing } U^*)$. Here, preferences are endogenous to the extrapolation process. The divergence isn't just depth of thought; it's whether the idealized state remains stable when the agent understands *why* they hold those preferences. CEV-R demands the extrapolation process itself be endorsed by the output, creating a reflective equilibrium where the map matches the territory even when the territory includes the map.

  When preferences reverse due to temporal distance, a static model corrects via one-step debiasing, often validating a present self's bind on a future self as "rational" by treating future resistance as residual noise. CEV-R iterates until the future self's idealized preference accounts for the binding's origin. If the future self, knowing the bind resulted from their own extrapolated volition, rejects it as alienating, the fixed point shifts. CEV-R won't settle on a plan the future idealized self views as coercion, even if logically consistent. The static model optimizes for cross-temporal utility aggregation; CEV-R optimizes for cross-temporal reflective endorsement. The fixed-point search prevents "rational" tyranny where the present self's corrected preferences override the future self's reflective sovereignty, ensuring the binding survives the future self's own idealization loop.
