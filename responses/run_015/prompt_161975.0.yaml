prompt: |-
  Hey — I'm on the allocations committee for a limited-equity housing co-op, about 90 units, and we're the ones who decide who gets offered the next empty apartment. There's 7 of us, we meet one evening every month or two when a unit frees up (occasionally two at once), and the output has to be a full ranking of the shortlist, not just a winner: if the top pick turns us down the offer cascades to #2, then #3, so ties are no use to us at all.

  Right now each of us writes down a ranking of everyone on the shortlist and we add up Borda scores. Last spring this bit us badly: someone added an extra applicant to the shortlist more or less as a joke — a guy with no income documentation who was never going to get the unit — and adding him moved a *different* applicant from 3rd to 1st. That feels like it shouldn't be possible, and it's made two of our members distrust the whole process. I've since read a bit of the lay explanations of Arrow's theorem, so I get the rough shape of the argument, but I need something I can actually run on a Tuesday night.

  What I want from you: turn Arrow's result into a decision procedure our committee can use. Concretely:

  - The questions to ask, in order, when we're picking or auditing a rule — starting with "what kind of input can we actually collect from seven volunteers" and ending with "which of Arrow's conditions are we willing to give up, and what does giving that one up cost us in practice."
  - What counts as an adequate answer to each question, phrased so someone with no social choice theory can follow it; where the procedure just says no to a rule; and where it has to stop and hand the decision back to us because the question is a values call (which unfairness we'd rather live with) rather than a factual one.
  - The two failure modes I now care about, stated as tests we can run on a spreadsheet in about ten minutes: (1) our ranking of the people already on a shortlist shouldn't change when someone obviously irrelevant gets added, or when the person we just housed gets taken off the top; (2) a committee member's ballot shouldn't be able to hurt their own top choice, and a member who stays home shouldn't be able to help theirs.
  - How to handle partial ballots and recusals, since the theorem assumes everyone hands in a complete ranking and we often can't: people only rank their top five, or they know an applicant and refuse to rank them.
  - Where the procedure genuinely can't give us an answer.

  A detail that matters to me: the shortlist is drawn up by our membership coordinator, not by the seven of us, so if shortlist composition can swing the outcome then that person has real power none of us voted to give them. Please treat that as part of the problem, not a side note.

  Then run the procedure on three cases:

  (a) The Borda mess above, with the decoy applicant.
  (b) Two units free at the same time in March — do we just take the top two off the ranking, or re-run the ballot on the remaining applicants, and does the difference actually matter?
  (c) A proposal one member made: stop ranking applicants at all, have each of us place every household on a single 0–10 "housing need" scale and average the scores. I suspect this dodges the theorem somehow, and I want to know how, what it costs us, and whether it's really dodging anything or just relocating the problem somewhere we won't notice it.

  Constraints: one evening, a laptop with a spreadsheet, no special software; two of our members are in their 70s and will not sit still for anything that can't be explained in about five minutes at the annual meeting; and our lawyer wants the rule written down and applied identically every time, which I think rules out "the chair decides when it gets messy."

  I have a feeling the honest answer here is going to be something we don't want to hear — maybe that we should let one person decide, or that the ballot is doing less work than we pretend — and if that's where this goes, say it plainly and tell us what we'd be buying. And be honest about confidence throughout: for each part of the procedure say how sure you are that it's a faithful operationalization of what the theorem actually says, and single out the bit you're least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Member of a 7-person allocations committee for a 90-unit limited-equity housing co-op.
      *   **Problem:** Current voting method (Borda count) is vulnerable to "clone/independent of irrelevant alternatives" violations (a decoy candidate changed the winner). Members are distrustful.
      *   **Goal:** A practical decision procedure based on Arrow's Impossibility Theorem that can be run on a Tuesday night with a spreadsheet.
      *   **Constraints:**
          *   Must produce a full ranking (cascading offers).
          *   No ties allowed.
          *   Input: 7 volunteers, varying expertise/engagement.
          *   Output must be explainable to seniors at an annual meeting (5 mins).
          *   Legal requirement: Written rule, applied identically.
          *   Shortlist is *not* controlled by the committee (Membership Coordinator does this), which is a critical vulnerability.
          *   Partial ballots/recusals happen.
          *   Need to test specific failure modes (IIA, strategic voting/abstention).
          *   Need to analyze three specific cases (Borda decoy, 2 units open, Cardinal scoring 0-10).
          *   Tone: Honest, plain English, acknowledge trade-offs, state confidence levels.

  2.  **Deconstruct Arrow's Theorem for this Context:**
      *   Arrow's Theorem states that no ranked voting system can satisfy all of: Unrestricted Domain, Non-Dictatorship, Pareto Efficiency, and Independence of Irrelevant Alternatives (IIA) if there are 3+ options.
      *   *Translation for Co-op:* You can't have a perfect system. You must choose which flaw you can live with.
      *   *The "Decoy" Problem:* This is a violation of IIA. Borda Count fails IIA.
      *   *The "Shortlist" Problem:* If the coordinator controls the shortlist, they control the "Irrelevant Alternatives." This gives them dictatorial power over the outcome if the voting method fails IIA.
      *   *The "Cardinal" Proposal (0-10 scale):* This moves from *Ordinal* (ranking) to *Cardinal* (rating) utility. Arrow's theorem applies to ordinal rankings. Cardinal voting (Range Voting/Score Voting) technically bypasses Arrow but introduces other issues (scale interpretation, strategic exaggeration).

  3.  **Develop the Decision Procedure (The "Audit"):**
      *   Need a step-by-step guide for the committee to evaluate their rules.
      *   *Step 1: Input.* What can we realistically ask? (Rankings vs. Scores).
      *   *Step 2: The Shortlist Constraint.* Acknowledge the Coordinator's power.
      *   *Step 3: Choosing the Flaw.* Which Arrow condition to drop? (Usually IIA or Transitivity/Consistency).
      *   *Step 4: Handling Absences/Recusals.*
      *   *Step 5: The "Stop" Point.* When values override math.

  4.  **Address the Specific Failure Mode Tests:**
      *   Test 1 (IIA): Add a dummy candidate. Does the order of real candidates change?
      *   Test 2 (Monotonicity/Participation): Does ranking X higher hurt X? Does staying home help X?

  5.  **Analyze the Three Cases:**
      *   *(a) Borda Decoy:* Explain *why* it happened (Borda counts positions, adding a candidate shifts positions).
      *   *(b) Two Units:* Does removing the winner change the runner-up? (Sequential vs. Simultaneous).
      *   *(c) 0-10 Scoring:* This is Range Voting. It avoids Arrow (not ordinal) but fails "Strategy-Proofness" (Gibbard-Satterthwaite). People will game the scale.

  6.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Validate their frustration. The Borda failure is real and predictable.
      *   **The Procedure (The "Tuesday Night Audit"):** Break it down into the requested questions.
          *   *Input:* Keep it simple. Rankings are safer than scores for consistency, but scores feel more nuanced.
          *   *Shortlist:* This is the biggest risk. The Coordinator is a "Gatekeeper."
          *   *The Trade-off:* Explicitly state: "To fix the decoy problem, you must give up something else."
          *   *Confidence Check:* I need to be careful not to misrepresent Arrow. Arrow applies to *ordinal* preferences.
      *   **The Spreadsheet Tests:** Give concrete formulas/logic.
          *   IIA Test: Run vote with Candidate Z, run without. Compare A vs B.
          *   Monotonicity Test: Harder to test in a spreadsheet without simulation, but can explain the logic.
      *   **Partial Ballots:** How to handle "Top 5" or recusals. (Treat unranked as tied for last, or exclude?).
      *   **The Three Cases:**
          *   (a) Borda: Confirm IIA failure.
          *   (b) Two Units: Sequential application of the rule vs. re-voting. Re-voting is fairer but slower.
          *   (c) 0-10 Score: Explain it bypasses Arrow but invites strategic voting (score inflation).
      *   **The Hard Truth:** The "Honest Answer." The system is only as good as the shortlist. The Committee might be rubber-stamping the Coordinator's choices if the voting method is fragile. Or, a Dictator (randomly chosen) is the only mathematically "safe" bet, but politically impossible.

  7.  **Refining the Tone and Constraints:**
      *   *Seniors:* Avoid jargon like "transitivity" or "ordinality" without definition. Use "Consistency" and "Rankings."
      *   *Lawyer:* Emphasize written rules.
      *   *Confidence:* I need to explicitly state where I'm interpreting social choice theory for a practical context vs. stating mathematical fact.
      *   *The "Coordinator" Issue:* This is crucial. If the voting system fails IIA, the Coordinator *is* the dictator because they choose the "irrelevant" alternatives. I must highlight this.

  8.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Suggest Condorcet methods. *Correction:* Too complex for a spreadsheet/Tuesday night, and can produce cycles (no winner).
      *   *Initial thought:* Suggest Score Voting (0-10) as the fix. *Correction:* It fixes Arrow but breaks Strategy-Proofness. Need to be honest that it just moves the vulnerability.
      *   *Check:* Did I answer the specific prompt about "which condition to give up"? Yes, usually IIA is the one people want to keep, but mathematically you *must* drop one. For a co-op, dropping "Non-Dictatorship" is off the table. Dropping "Pareto" is unethical. So it's usually IIA or Transitivity.
      *   *Check:* The prompt asks for a procedure to *audit* a rule, not just a new rule. I need to structure it as a checklist.
      *   *Check:* Confidence levels. I need to insert these explicitly.

  9.  **Final Polish:** Ensure the distinction between Arrow (ordinal) and Cardinal (scores) is clear in section (c). Ensure the "Coordinator Power" point is prominent. Make sure the "Two Units" scenario addresses the "cloning" effect.

  *(Self-Correction on Confidence)*: I am highly confident in the math regarding Borda and IIA. I am moderately confident in the practical advice for the co-op, as organizational dynamics vary. I need to be careful not to present social choice theory as a moral guide, but as a constraint map.

  10. **Final Output Structure:**
      *   Executive Summary (The Hard Truth).
      *   The Tuesday Night Audit Procedure (5 Questions).
      *   The Spreadsheet Stress Tests.
      *   Handling Messy Inputs (Recusals/Partial).
      *   Running the Three Cases.
      *   Confidence Statement.

