answer: |-
  Here is the honest truth, upfront: **You cannot fix this with math alone.** Arrow's Theorem proves there is no perfect voting system. Every method trades one type of unfairness for another. Your current problem (the "decoy" applicant changing the winner) is a specific failure called violating the *Independence of Irrelevant Alternatives (IIA)*. To stop that, you must accept a different vulnerability.

  Furthermore, because your Membership Coordinator controls the shortlist, **they currently hold more power than your committee.** If your voting method is sensitive to "irrelevant" candidates (like Borda is), the Coordinator decides the winner by choosing who gets to be a "decoy."

  Below is the decision procedure you asked for. It is designed to be run on a Tuesday night with a spreadsheet, explained to seniors in five minutes, and written down for your lawyer.

  ---

  ### Part 1: The Tuesday Night Audit Procedure
  *Use this checklist when adopting or reviewing your allocation rule. Do not skip steps.*

  #### 1. What input can we actually collect?
  *   **The Question:** Can we reliably ask members to rank *every* applicant, or only their favorites?
  *   **Adequate Answer:** "We can require a full ranking of the shortlist."
  *   **If the answer is No:** If members only rank their top 3 or 5, you are mathematically forced to treat unranked applicants as "tied for last." This creates massive tie-breaking noise.
  *   **The Cost:** If you allow partial ballots, you must accept that two applicants the committee knows nothing about will be ranked arbitrarily (e.g., by alphabetical order) to break ties.
  *   **Confidence:** High. Partial data forces assumptions.

  #### 2. Who controls the "Irrelevant Alternatives"?
  *   **The Question:** Since the Membership Coordinator draws the shortlist, does our voting rule let a "joke" candidate change the winner?
  *   **Adequate Answer:** "No. The rule must satisfy Independence of Irrelevant Alternatives (IIA)."
  *   **If the answer is No (like Borda):** You are handing veto power to the Coordinator. They can insert a "clone" of Candidate A to split A's points and make Candidate B win.
  *   **The Values Call:** You must decide: Is it worse to have a complex voting system that the Coordinator can game, or a simpler system that ignores nuance?
  *   **Confidence:** High. This is the specific failure you experienced.

  #### 3. Which of Arrow's conditions are we willing to give up?
  *   **The Question:** We know we can't have it all. Which flaw do we choose?
  *   **Adequate Answer:** "We give up IIA" OR "We give up Transitivity (consistency)" OR "We give up Non-Dictatorship."
  *   **The Hard Choice:**
      *   *Keep IIA (Stop the Decoy Problem):* You must use a system like **Pairwise Majority (Condorcet)**. *Risk:* It can produce cycles (A beats B, B beats C, C beats A), meaning no clear ranking exists.
      *   *Keep Consistency (Always get a ranking):* You must use a system like **Borda** or **Plurality**. *Risk:* The Decoy Problem returns.
      *   *The Third Way:* Use **Score Voting (0-10)**. This technically bypasses Arrow (which only applies to rankings), but introduces "Strategic Voting" (members exaggerating scores).
  *   **Confidence:** High on the theory, Moderate on the recommendation. See Part 3, Case (c).

  #### 4. How do we handle recusals and absences?
  *   **The Question:** If a member knows an applicant, do they skip them, or rank them last? If a member is sick, does their vote count as zero?
  *   **Adequate Answer:** "Absent members count as 0 weight. Recused members are excluded from the denominator."
  *   **The Rule:** Do not let a recusal act as a "negative vote." If Member X recuses, the total points available drop.
  *   **Confidence:** High. This is standard governance, not social choice theory.

  #### 5. Where does the procedure stop?
  *   **The Question:** When do we admit the math failed and talk it out?
  *   **Adequate Answer:** "If the top two candidates are within 5% of the total score, or if a Cycle occurs (A>B>C>A), the Committee Chair triggers a discussion vote."
  *   **The Values Call:** Math cannot measure "community fit." If the spreadsheet says Applicant Z wins, but everyone knows Z has been difficult in viewings, you need a "Veto Clause" requiring a 5/7 supermajority to override the ranking.
  *   **Confidence:** Moderate. This is a policy choice, not a mathematical one.

  ---

  ### Part 2: The Spreadsheet Stress Tests
  *Run these two tests on any proposed rule before adopting it. If it fails either, discard the rule.*

  #### Test 1: The "Decoy" Test (IIA Check)
  *   **Goal:** Ensure adding a loser doesn't change the winner.
  *   **Procedure:**
      1.  Enter the 7 ballots for the current shortlist (e.g., Applicants A, B, C). Calculate the winner.
      2.  Add a column for Applicant D (the "Decoy"). Give D scores/rankings that are uniformly low (e.g., everyone ranks D last).
      3.  Recalculate the winner among A, B, and C.
  *   **Pass Condition:** The ranking of A, B, and C remains *exactly* identical.
  *   **Fail Condition:** If A was #1 before, but B is #1 after adding D, **the rule is unsafe.** (This is what happened to you with Borda).
  *   **Confidence:** High. This is a direct operationalization of IIA.

  #### Test 2: The "No-Show" Test (Participation Check)
  *   **Goal:** Ensure staying home doesn't help your favorite.
  *   **Procedure:**
      1.  Enter all 7 ballots. Calculate the winner.
      2.  Delete the ballot of the member whose top choice *lost*.
      3.  Recalculate the winner.
  *   **Pass Condition:** The member's top choice still loses (or the outcome doesn't improve for them).
  *   **Fail Condition:** If deleting the ballot makes their top choice *win*, the system punishes participation.
  *   **Confidence:** Moderate. This tests the "Participation Criterion." It is computationally easy but doesn't catch all strategic voting.

  ---

  ### Part 3: Running the Three Cases

  #### Case (a): The Borda Mess (The Decoy)
  *   **Diagnosis:** Borda Count assigns points based on position (1st = 5 pts, 2nd = 4 pts, etc.). When you added the "joke" applicant, everyone pushed the real applicants down one rank.
  *   **Why it broke:** If Applicant A was ranked 2nd by everyone, and Applicant B was ranked 1st by a slim majority, A had steady points. When the Decoy was added, A dropped to 3rd, B dropped to 2nd. The point *gap* between 2nd/3rd might be different than 1st/2nd, or the sheer volume of points shifted.
  *   **Verdict:** **Fail.** Borda violates IIA. It gives the Membership Coordinator dictatorial power because they control which "decoys" appear on the ballot.
  *   **Fix:** Do not use Borda.

  #### Case (b): Two Units Free at Once
  *   **The Question:** Do we take the top 2 from the list, or re-vote after the first offer?
  *   **Analysis:**
      *   *Option 1 (Top 2):* Fast. But if Applicant #2 turns it down, does #3 deserve it more than #2 did?
      *   *Option 2 (Re-vote):* Fairer. If #1 takes a unit, they are removed. The committee re-ranks the remaining pool for the second unit.
  *   **The Risk:** Re-voting allows "Sequential Manipulation." Members might rank a strong candidate lower in Round 1 to save them for Round 2 if they think Round 1 has a "sure thing" winner.
  *   **Recommendation:** **Rank the full list once.** Offer #1 to the Rank 1 applicant. If they decline, offer to Rank 2. Do not re-vote.
  *   **Why:** Re-voting violates *Consistency*. It allows the order of offers to change the outcome. If you must re-vote, you must treat the two units as distinct (e.g., "Unit 4B" vs "Unit 5A") and vote on them separately, which doubles your meeting time.
  *   **Verdict:** **Single Ranking, Cascading Offers.** It is the only way to satisfy the lawyer's "identical rule" constraint without doubling workload.
  *   **Confidence:** High. This minimizes administrative burden and strategic gaming.

  #### Case (c): The 0–10 "Housing Need" Scale (Score Voting)
  *   **The Proposal:** Members score each applicant 0–10. Average scores determine the rank.
  *   **Does it dodge Arrow?** **Yes.** Arrow's Theorem applies only to *ordinal* rankings (1st, 2nd, 3rd). *Cardinal* voting (scores) is not subject to Arrow.
  *   **What is the cost?** It opens the door to **Strategic Exaggeration**.
      *   *Scenario:* I think Applicant A is a 7/10 and B is a 6/10. I want A to win. I will score A as 10 and B as 0 to maximize the gap.
      *   *Result:* Scores lose meaning. Everyone becomes a 0 or a 10. It devolves into "How many people love you" vs "How many people hate you."
  *   **Does it fix the Decoy Problem?** **Mostly.** Adding a decoy (scored 0 by everyone) does not change the average of the others. It passes the IIA test much better than Borda.
  *   **The Senior Test:** "Is it easier to explain?" Yes. "Is it fairer?" It feels fairer, but it encourages lying about scores.
  *   **Verdict:** **Acceptable, with safeguards.** If you use this, you must define the scale (e.g., "5 = Average Need, 10 = Critical Emergency"). If you don't define the scale, it's just Borda in disguise.
  *   **Confidence:** Moderate. Score Voting is robust, but "calibrating" 7 different people's ideas of "10" is socially difficult.

  ---

  ### Part 4: Handling Partial Ballots & Recusals
  *The theorem assumes complete data. You don't have that.*

  1.  **Recusals (Conflict of Interest):**
      *   **Rule:** The member is excluded from the denominator.
      *   **Math:** If 7 members vote, total points possible = 70. If 1 recuses, total points possible = 60. Average = Sum / 6.
      *   **Why:** Prevents the recusal from acting as a "0" score.

  2.  **Partial Rankings (Top 5 only):**
      *   **Rule:** Unranked applicants are tied for last place.
      *   **Math:** If there are 8 applicants and I only rank 5, the remaining 3 all get the points for 6th/7th/8th (averaged).
      *   **Why:** If you leave them blank, the spreadsheet treats them as 0, which punishes unknown applicants. If you treat them as "middle," you dilute the vote. Tying them for last is the only neutral default.
      *   **Confidence:** Low. This is the weakest link in any practical system. It assumes "unknown" = "least preferred," which may not be true.

  ---

  ### Part 5: The Hard Truth (Where the Procedure Can't Answer)
  *You asked me to be plain.*

  **1. The Coordinator is the Real Decider.**
  Because your shortlist is pre-screened by one person, and because all voting systems (except Dictatorship) are vulnerable to the *set* of options provided, the Membership Coordinator has more influence than the 7 of you. If they want Applicant X to win, they can ensure Applicants Y and Z (who split X's vote) are on the list.
  *   **What you are buying:** If you want to reduce this power, you must allow the Committee to *add* names to the shortlist, or require the Coordinator to present a "standardized" shortlist (e.g., top 10 by income date, no discretion).

  **2. Consensus is a Lie.**
  You want a full ranking to avoid ties. But if the group is truly split (3 prefer A, 3 prefer B, 1 prefers C), any rule that produces a winner (A or B) is mathematically "ignoring" the minority.
  *   **What you are buying:** By demanding a ranking, you are agreeing to override the minority's preference every time. There is no math that makes this "fair." It is just efficient.

  **3. The Only "Perfect" Solution is a Dictator.**
  The only system that satisfies all of Arrow's conditions (including IIA) is a **Random Dictator**. Pick one committee member at random. Their ranking is the final ranking.
  *   **Why you won't do it:** It feels undemocratic.
  *   **Why it works:** It is immune to strategy, decoys, and cycles.
  *   **Recommendation:** Do not do this. But acknowledge that your current system is an attempt to approximate "collective wisdom" that mathematically does not exist.

  ### Final Recommendation for Your Committee

  1.  **Switch to Score Voting (0-10).** It solves the Decoy/IIA problem you faced with Borda. It is easy to explain to seniors ("Rate their need"). It bypasses Arrow's limitations.
  2.  **Define the Scale.** To prevent strategic exaggeration (all 0s and 10s), write down: *5 = Meets basic criteria. 7 = Strong community fit/need. 10 = Emergency/Critical. 0 = Disqualified.*
  3.  **Audit the Shortlist.** Require the Membership Coordinator to document *why* everyone on the shortlist is there. If the list changes drastically month-to-month, that is your vulnerability, not the voting.
  4.  **Written Rule:** "Applicants are scored 0-10 by each present, non-recused member. Scores are averaged. Ties are broken by: (1) Higher number of '10' scores, (2) Seniority of application date."

  **Confidence Statement:**
  *   **High Confidence:** That Borda failed you due to IIA violation. That Score Voting avoids this specific mathematical trap. That the Coordinator holds undue power.
  *   **Moderate Confidence:** That Score Voting won't devolve into strategic exaggeration in your specific group culture.
  *   **Low Confidence:** That any system will satisfy the members who lost trust last spring. Math can fix the rule, but it cannot fix the feeling that the process was rigged. For that, you need transparency, not a better spreadsheet.

  **Least Sure Bit:** I am least sure about the "Partial Ballot" handling. Treating unranked candidates as "tied for last" is standard, but in a housing co-op, "I don't know them" is morally different from "I reject them." If your members frequently submit partial ballots, this assumption will introduce noise you cannot calculate.
