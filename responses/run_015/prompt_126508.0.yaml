      *   Ensure I answer the specific questions: Which step to reject? What is the cost? Can we keep non-human causes without agency? (Actually, if I keep (1), I *am* granting them agency, so I need to redefine agency).
      *   Wait, the prompt asks: "Can you keep non-human causes in the story without granting them 'agency'?" This suggests rejecting (1). But then it asks: "What I'm paying if I keep (1) and drop (5) instead?" I should address both paths, but focus on the latter as requested.
      *   *Decision:* I will argue that (5) is the determinist sleight of hand. I will show that keeping (1) forces a redefinition of "agency" away from "moral responsibility."

  8.  **Final Review against Constraints:**
      *   Did I brainstorm first? Yes.
      *   Did I act as a philosopher of history skeptical of determinism? Yes.
      *   Did I address the specific trade-off? Yes.

