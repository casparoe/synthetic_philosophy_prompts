prompt: |-
  okay so me and my friend just had this exhuasting argument for like two hours about whether societies actually 'collapse' or if thats just a dramatic word we use for rapid change that doesn't fit our modern idea of progress. he kept throwing around the bronze age, the maya lowlands, and easter island like those are obvious examples, but i feel like we're lumping political fragmentation, demographic crash, and cultural continuty all into one bucket because it makes a cooler narrative.

  i want to stop guessing and actually lay out the full spec first. write me the desiderta -- what any real theory of societal collapse versus mere transformation has to deliver. for each case (bronze age transition, maya lowlands, easter island) say what phenomenon the theory must explain and what distinction it can't collapse, like between state failure and local adaptation. flag whether consistency with paleoecological data is a hard requirement or just a bonus. and tell me if there's a subset of these requirements thats probably impossible to satisfy together -- for instance if explaining easter island needs strong environmental determinism but the bronze age needs institutional flexibility, do those conflict?

  also i have this half-baked idea that maybe 'collapse' is only visible if you use a bureaucratic state's metrics -- writing, monuments, centralized storage -- and if you switch to measuring local subsistence continuty it just looks like restructuring. should that be a formal desideratum? that the theory has to declare whose complexity metric its using?

  keep it casual but i want the real conceptual work here, not just a list of books. no citations, just work through the logic.
