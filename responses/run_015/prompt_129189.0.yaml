answer: |-
  Queuing binds visitors most tightly because breaking it exploits a collective trust that tipping and jaywalking do not require.

  Tokyo tips rest upon the table,
  Berlin walkers cross without a care.
  Such customs shift like sand, not stable,
  Just local air visitors breathe there.
  London lines claim a steady space,
  Mere custom like the rest, it seems,
  To join is mere social place,
  No duty past obeying dreams.
  Queues fail if none expect a wait,
  You exploit the trust others keep.
  Is this law or just a state
  Of strategic play while others sleep?
  Does trust make right, or skill rule?
  We stand in line, both wise, fool.
