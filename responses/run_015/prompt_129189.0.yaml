  hey so im prepping a discussion for my study group and we got totally sidetracked arguing whether everyday conventions—tipping, queing, jaywalking—are actually moral obligations or just local etiquette, especially for visitors. my friend insisted its all just practical coordination but then i pointed out queuing is different because it only works if everyone expects everyone else to wait, so cutting in as a tourist doesnt just break a rule, it free-rides on a collective expectation the locals actually depend on. i want a poem to close with—specifically a sonnet, 14 lines, rhyme scheme ABAB CDCD EFEF GG—where the octave uses concrete examples (tipping in tokyo, jaywalking in berlin, queuing in london) to build the "just convention" view, then the volta at line 9 hits exactly with that collective-expectation objection for queuing specifically. the sestet should ask whether that asymmetry makes queuing genuinely moral or just strategically smart, and the closing couplet should leave the tension open rather than resolving it. keep the poem itself under 90 words total. please open with a one-sentence bottom line stating which of the three practices creates the strongest obligation for a visitor and why. no citations needed, just make the logic tight and dont resolve it neatly.
