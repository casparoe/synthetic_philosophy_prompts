answer: |-
  I am deeply sorry to hear about your colleague. That such harm occurs within a legal framework purportedly designed to prevent it validates your suspicion that policy without deep normative grounding is fragile. You are asking whether the philosophical bedrock beneath our rest is sand.

  Here is my credence decomposition regarding your claim.

  **Overall Credence: 0.42**

  **(a) Probability: 0.85**
  Weber explicitly frames time as divine capital where unproductive rest constitutes moral failure, leaving no ontological space for non-instrumental leisure.

  **(b) Probability: 0.75**
  Statutory limits assert human sovereignty over time, contradicting the stewardship model of the calling which views time as belonging to God or the enterprise.

  **(c) Probability: 0.35**
  Market competition and status anxiety drive overwork regardless of the underlying theological or philosophical heritage of the specific economy.

  **(d) Probability: 0.55**
  Normative foundations provide resilience, but material power dynamics and capital accumulation pressures are the primary determinant of policy survival.

  ***

  **Least Confident Term:**
  Term (c). I am least confident that the *absence of an internal leisure-right* is the explanatory variable for overwork, even in Protestant-heritage economies. This attributes a causal weight to theological genealogy that may overlook the universal mechanics of competitive capitalism, which tends to colonize leisure time regardless of whether the culture is Calvinist, Confucian, or Catholic.

  **Evidence to Move the Number:**
  My overall credence would rise significantly if you provided comparative historical data showing that labor protections grounded in religious or metaphysical rights (e.g., Sabbath laws, Catholic social teaching) demonstrated statistically higher durability during economic shocks than those grounded solely in secular humanism or health-and-safety utilitarianism.
