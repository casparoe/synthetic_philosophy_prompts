prompt: |-
  Hi — I'm running a 90-minute evening session of a small reading group, about 12 people (mostly cognitive-science grad students, a few programmers, one historian who wandered in and never left). Nobody in the room has met Bongard problems before, and I want to keep it that way for the first hour: no definition up front, no "these are called Bongard problems", no lecture. Just two panels of little hand-drawn figures and the question "which side does this new one belong on?" I'd rather the word "rule" not even appear on the handout.

  What I want them to feel in their hands, not be told, is that twelve examples (six a side) don't pin anything down in an interesting sense — that what does the selecting is a shared, mostly unstated prior about which predicates are natural, and that the "oh — now I see it" click is not evidence you've recovered the author's intended distinction. Secondary thing I'd like them to run into by themselves: the space of candidate distinctions is a *choice*, and if you only ever consider properties of individual figures, a whole family of distinctions about relations *between* the figures on a panel stays invisible.

  Can you design me a runnable activity for that? Things I'd like baked in:

  - Practicalities: 12 people, teams of 3, 90 minutes, one room, no projector, no laptops. Materials should be stationery-shop stuff — index cards, coloured markers, envelopes, printed sheets. Nothing that needs charging.
  - A "vocabulary card" handed out first: a short fixed list of legal primitives any distinction has to be built from (shape, fill, size, count, and relations like touching / overlapping / contained-in / separate), maybe 8–10 items. The reason I want it fixed is that afterwards we can genuinely ask "how many distinctions expressible in this little language fit these twelve cards?" and argue to an answer instead of hand-waving.
  - Round 1: each team gets a panel pair plus a few loose probe cards. They have to (a) place the probes and (b) write down *three* seperate distinctions consistent with the training cards, not one. Rank them by which they'd bet on.
  - Then I reveal a pre-made set of maybe five extra probe cards, and each team has to commit, in writing, to a side for each probe *under each of their three distinctions*. If their own distinctions disagree with each other, they should find that out by doing it, not by me announcing it. Tell me how to build that probe deck so it reliably splits the kinds of distinctions people actually generate.
  - Round 2: teams author a panel pair for another team, sealed in an envelope, with a scoring scheme that doesn't need real money (chocolate is fine). Here's the bit I care most about: I want authors rewarded when solvers *fail*, but penalised — call it a "collision" — when solvers name a different distinction that fits all twelve cards and the author can't produce a card, within the vocabulary, that seperates it from their own. My hope is that this forces authors to appeal to something outside the data (simplicity, naturalness, "what a person would think of") in order to defend their puzzle, and that's the moment the debrief names. Sanity-check whether that incentive actually produces the behaviour I want or whether it just makes everyone write easy puzzles.
  - Somewhere in there I want one planted panel pair whose distinction is configural/relational — e.g. on one side no two figures are exactly alike in the vocabulary, on the other at least two are — slipped in without comment as just another problem. I want to see who gets stuck and how they describe being stuck.

  Give me a minute-by-minute timeline, the exact wording for each handout, the payoff scheme, and a debrief that maps specific moments onto the specific points (underdetermination by the data; the prior doing the work; the hypothesis space as a choice; the click not being evidence).

  Also: tell me what will predictably go wrong the first time I run it. I can already guess at a few — someone draws a distinction so baroque nothing could refute it, someone "solves" by vibes and can't articulate anything, someone builds their puzzle on their own drawing style (shaky hand, pen pressure) rather than on the vocabulary, and the physical cutouts end up coarser than the printed vocabulary so people cheat with arrangement on the table. But give me your list and how to handle each.

  And be honest about which feature of the real thing the activity can't reproduce and I'll have to supply in the debrief. My worry is that because everything is pre-symbolised on cards, the activity tests *selection among already-formulated hypotheses* and misses the perceptual work of constructing the description in the first place — which is arguably where Bongard problems actually bite. If that's right, say so, and tell me what the facilitator has to add so nobody walks out thinking they've understood the whole thing.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**

      *   **Goal:** Run a 90-minute reading group session (12 people, mixed background) to explore the nature of Bongard problems *without* naming them or defining them upfront.
      *   **Core Concepts to Convey:**
          *   Underdetermination (12 examples don't pin down the rule).
          *   Role of Priors (naturalness, simplicity, shared context).
          *   Hypothesis Space as a Choice (individual properties vs. relational/configural properties).
          *   The "Click" isn't Truth (feeling of certainty $\neq$ author intent).
      *   **Constraints:** No projector, no laptops, stationery only. Teams of 3.
      *   **Specific Mechanics:**
          *   "Vocabulary Card" (fixed primitives).
          *   Round 1: Solve provided panels, generate 3 distinct hypotheses, rank them.
          *   Round 1b: Test hypotheses against new probes (reveal contradictions between hypotheses).
          *   Round 2: Teams author puzzles for other teams. Scoring incentivizes "collision" (solver finds alternative valid rule) vs. "failure" (solver can't solve).
          *   Planted Problem: One configural/relational problem to trap those looking only at individual properties.
      *   **Deliverables:** Minute-by-minute timeline, handout text, probe deck design, payoff scheme, debrief script, failure mode analysis, limitation analysis.

  2.  **Deconstruct the Mechanics & Incentives:**

      *   *The "Vocabulary Card":* Needs to be restrictive enough to prevent "vibes" but open enough to allow relations.
      *   *Round 1 (Solving):* The key is forcing *three* hypotheses. Most people latch onto one. Forcing three exposes underdetermination immediately.
      *   *Round 1b (Probes):* The probes need to be "adversarial" to common hypotheses. If Hypothesis A says "Left = Circles", Hypothesis B says "Left = Convex", a probe that is a Square (non-convex, non-circle) might not help. A probe that is a Triangle (convex, non-circle) splits them. I need to design the *initial panels* carefully so common splits are possible.
      *   *Round 2 (Authoring):* The scoring mechanism is tricky.
          *   Reward failure: If solvers can't solve it, author gets points. (Encourages hard puzzles).
          *   Penalize collision: If solvers find a *different* valid rule, author loses points. (Encourages unambiguous puzzles).
          *   *Risk:* This might encourage puzzles that are impossible to solve (maximizing failure) but technically have a rule. Or puzzles where the rule is so specific (baroque) no one finds an alternative, but no one finds the right one either.
          *   *Fix:* The scoring needs to balance solvability with uniqueness. Let's refine the scoring: Authors get points if solvers find the *intended* rule. Authors lose points if solvers find a *different* valid rule (collision). Authors get bonus if solvers give up (failure)? No, if solvers give up, we don't know if the rule was unique.
          *   *Better Scoring:*
              1.  Solver finds Intended Rule: Author gets 1 pt.
              2.  Solver finds Alternative Valid Rule: Author gets -1 pt (Collision).
              3.  Solver finds Nothing: Author gets 0 pts.
              *Wait, the prompt says:* "authors rewarded when solvers *fail*, but penalised... when solvers name a different distinction."
              *Okay, I must stick to the prompt's incentive structure.*
              *Incentive:* Maximize "Solver Fail" + Minimize "Collision".
              *Risk:* Authors make puzzles that are too hard (Fail) but technically have a unique solution (No Collision). This leads to "baroque" rules.
              *Mitigation:* The "Vocabulary Card" limits baroque rules. The Debrief must highlight that "making it hard" isn't the same as "making it natural."
      *   *The Planted Problem:* Needs to look like individual properties but rely on relations (e.g., "All shapes on Left are different from each other" vs "At least two shapes on Right are identical").

  3.  **Drafting the Content:**

      *   **Timeline:** 90 mins is tight.
          *   Intro/Setup: 10 min.
          *   Round 1 (Solve): 25 min.
          *   Round 1b (Probe Test): 15 min.
          *   Round 2 (Author): 25 min.
          *   Swap & Solve Round 2: 10 min (quick).
          *   Debrief: 15 min.
          *   *Correction:* 90 mins is very tight for all this. I need to trim Round 2 solving. Maybe teams author, then we discuss the *design* of Round 2 without full solving, or do a quick swap. Let's aim for a quick swap.
      *   **Handouts:**
          *   Vocabulary Card (Primitives).
          *   Problem Sheet 1 (The 6v6 panels).
          *   Probe Deck (The 5 extra cards).
          *   Scorecard.
      *   **Probe Design:** I need to specify *what* the initial problem is so the probes make sense. I can't leave it random. I will design "Problem Set Alpha" for the facilitator to print.
          *   *Left:* Triangles, Squares, Pentagons (Straight edges).
          *   *Right:* Circles, Ellipses, Clouds (Curved edges).
          *   *Why?* Common split 1: Straight vs Curved. Common split 2: Angles vs No Angles. Common split 3: Convex vs Non-convex (if I include a star). Let's make it:
              *   Left: All shapes have straight lines.
              *   Right: All shapes are purely curved.
              *   *Alternative Hypothesis:* Left has vertices. Right has no vertices.
              *   *Alternative Hypothesis:* Left can tile. Right cannot.
              *   *Probe needed:* A shape that is curved but has a vertex? (A sector of a circle). Or a shape that is straight but no vertices? (Impossible).
              *   *Better Problem for Underdetermination:*
                  *   Left: Black shapes.
                  *   Right: White shapes.
                  *   *Alt:* Left = Dark. Right = Light.
                  *   *Alt:* Left = Filled. Right = Unfilled.
                  *   *Probe:* A Grey shape? (Not in vocabulary). A Hatched shape?
              *   *Let's go with the Prompt's suggestion for the Planted Problem:* Configural.
              *   *Standard Problem:*
                  *   Left: 3 shapes per box.
                  *   Right: 4 shapes per box.
                  *   *Alt:* Left = Odd count. Right = Even count.
                  *   *Alt:* Left = Crowded. Right = Sparse.
                  *   *Probe:* A box with 3 shapes but very sparse.
      *   **Debrief:** Must connect the specific frustrations to the cognitive science concepts (Priors, Underdetermination, etc.).
      *   **Failure Modes:** Address the "shaky hand," "baroque rules," "vibes," and "table arrangement" issues.
      *   **Limitations:** Acknowledge that pre-symbolized cards skip the *perceptual parsing* stage, which is crucial in real Bongard problems.

  4.  **Refining the Incentive Structure (Round 2):**

      *   Prompt: "Authors rewarded when solvers fail, but penalised... when solvers name a different distinction."
      *   This is a "Poisoned Chalice." If I make it too hard, I get points for failure. If I make it ambiguous, I lose points for collision.
      *   To win, I must make a puzzle that is *solvable* (to avoid the "Fail" reward? Wait. "Rewarded when solvers fail". Okay.)
      *   *Correction:* If I am rewarded when solvers *fail*, I should make an impossible puzzle. But if I make an impossible puzzle, there is no "Intended Rule" to collide with.
      *   *Interpretation:* The prompt implies the Author *has* a rule.
          *   Scenario A: Solvers find the Rule. Author gets 0.
          *   Scenario B: Solvers fail to find Rule. Author gets +1.
          *   Scenario C: Solvers find a *Different* Rule (that fits). Author gets -1.
      *   *Optimization:* Authors will try to make puzzles where the rule is hard to find (Fail = +1) but unique (No Collision). This encourages obscurity, not naturalness.
      *   *Fix for the Activity:* I need to add a "Naturalness Tax." If the solvers vote the rule is "unnatural," the Author loses points. Or, simpler: The Facilitator acts as the judge of "Naturalness" during debrief.
      *   *Actually, let's look closer:* The prompt wants authors to appeal to "simplicity, naturalness" to defend their puzzle. The scoring should force them to *care* about collision.
      *   *Revised Scoring for the Activity:*
          *   Solvers find Intended Rule: Author gets 1 Chocolate.
          *   Solvers find Alternative Rule: Author loses 1 Chocolate.
          *   Solvers find Nothing: Author gets 0.
          *   *Wait, I must follow the prompt's wish:* "authors rewarded when solvers fail".
          *   Okay, I will implement the prompt's scoring but add a "Disclosure Phase." The Author must state the rule. If the Solvers say "That fits, but so does X," and the Author cannot distinguish X from Rule using the Vocabulary, it's a Collision (Penalty). If Solvers say "We can't find any rule," it's a Fail (Reward).
          *   *The Trap:* This encourages rules that are technically valid but cognitively opaque. This is *good* for the debrief (it proves the point about priors), but bad for the game flow. I will add a constraint: The rule must be expressible in 5 words or fewer using the Vocabulary. This prevents baroque complexity.

  5.  **Addressing the "Perceptual Work" Limitation:**

      *   The prompt asks me to be honest about this. Using cards means the objects are already segmented. Real Bongard problems require *segmentation* (finding the objects) before *classification*.
      *   *Mitigation:* In the debrief, I need to explicitly state: "You were given the objects. In the wild, your brain has to decide what counts as an object first. That's where the real priors live."

  6.  **Developing the Materials:**

      *   *Vocabulary Card:* Shape (Circle, Square, Triangle, etc.), Fill (Solid, Empty, Hatched), Size (Small, Large), Count (1-5), Relation (Touching, Inside, Above).
      *   *Problem Set Alpha (Standard):* Left = Solid. Right = Empty. (Simple).
      *   *Problem Set Beta (Planted/Relational):* Left = All shapes in panel are unique. Right = At least two shapes are identical.
      *   *Probe Deck:* Needs to test Fill vs. Border Thickness vs. Color (if allowed) vs. Relation.
      *   *Let's refine Problem Set Alpha for maximum underdetermination:*
          *   Left: Triangles.
          *   Right: Squares.
          *   *Hypothesis 1:* 3 sides vs 4 sides.
          *   *Hypothesis 2:* Pointy vs Flat top.
          *   *Hypothesis 3:* Stable vs Unstable.
          *   *Probe 1:* A Pentagon (5 sides, flat top). Splits H1.
          *   *Probe 2:* An Upside-down Triangle (Pointy bottom). Splits H2.

  7.  **Final Review against Constraints:**

      *   90 mins? Tight. I'll cut Round 2 solving time. Teams author, then swap, then we discuss the *potential* for collision without full solving, OR we do a "Speed Swap" (5 mins). Let's go with Speed Swap.
      *   No tech? Check.
      *   12 people / 4 teams? Check.
      *   Vocabulary Card? Check.
      *   Incentive structure? Check (with the "5-word rule" constraint to prevent baroque nonsense).
      *   Planted Problem? Check (Set Beta).
      *   Failure modes? Check.
      *   Limitations? Check.

  8.  **Writing the Response:**

      *   Structure:
          1.  Overview & Philosophy.
          2.  Materials List.
          3.  Minute-by-Minute Timeline.
          4.  Handout Text (Vocabulary, Instructions, Scorecard).
          5.  Probe Deck Design (Crucial for the "split").
          6.  The Planted Problem (Specifics).
          7.  Failure Mode Management.
          8.  The Debrief Script (Mapping moments to concepts).
          9.  Limitations (The "Perceptual Work" gap).

      *(Self-Correction during drafting)*: I need to make sure the "Reward for Failure" doesn't just make everyone make garbage. I will add a rule: "To claim the Failure Reward, the Author must reveal a rule that fits the Vocabulary. If the Solvers can prove that rule fits *both* sides, the Author is disqualified." This ensures the puzzle is at least logically valid.

      *(Refining the Probe Deck)*: The prompt asks me to tell them *how to build that probe deck*. I will provide a specific recipe for "Problem Alpha" so the probes are guaranteed to work.
      *   Problem Alpha:
          *   Left: 3 Black Circles.
          *   Right: 3 White Circles.
          *   *H1:* Black vs White.
          *   *H2:* Filled vs Unfilled.
          *   *H3:* Dark vs Light.
          *   *Probe 1:* Grey Circle. (Tests H1/H3).
          *   *Probe 2:* Hatched Circle. (Tests H2).
          *   *Wait, Vocabulary needs to support this.* I'll ensure Vocabulary includes "Fill Style".

      *(Refining Round 2 Incentive)*:
      *   Prompt: "Authors rewarded when solvers fail, but penalised... when solvers name a different distinction."
      *   My implementation:
          *   Solvers find Intended Rule: Author gets 0.
          *   Solvers find NO Rule (Give up): Author gets 2 pts.
          *   Solvers find DIFFERENT Rule (Collision): Author gets -2 pts.
      *   This creates a tension. If I make it too hard, I get 2 pts. If I make it ambiguous, I lose 2 pts. The sweet spot is "Hard but Unique." This leads to the "Naturalness" discussion in debrief.

      *(Final check on "No Rule Word")*: The prompt says "I'd rather the word 'rule' not even appear on the handout." I must use "Distinction," "Pattern," "Logic," or "Reason." I will use "Distinction."

      *(Final check on "Bongard")*: Do not mention Bongard until the very end (Debrief).

      Let's assemble.
answer: |-
  This is a sophisticated design challenge. You are asking for an experiential demonstration of *underdetermination* and *inductive bias* without lecturing on it. The mechanics you proposed (specifically the adversarial authoring incentive) are strong, but they need tight constraints to prevent the game from devolving into "gotcha" puzzles.

  Here is the complete run-book for the session.

  ### 1. Materials List (Stationery Shop Only)

  *   **Printed Sheets (A4):**
      *   4 copies of **Problem Set Alpha** (The "Standard" problem).
      *   4 copies of **Problem Set Beta** (The "Planted" relational problem).
      *   12 copies of **The Vocabulary Card**.
      *   12 copies of **The Scorecard**.
      *   1 copy of **The Probe Deck** (to be cut out).
  *   **Physical Items:**
      *   4 Envelopes (for sealing authored puzzles).
      *   1 Box of Chocolates (the currency).
      *   Markers (Black, Red, Blue), Pencils, Erasers.
      *   Scissors (4 pairs).
      *   Index Cards (blank, for authoring).
  *   **Room Setup:**
      *   4 Tables (or one large one divided into zones).
      *   Chairs for 12.

  ---

  ### 2. The Vocabulary Card (Handout 1)

  *Print this on small card stock. Hand one to each participant immediately.*

  > **THE ALLOWED PRIMITIVES**
  >
  > Any distinction you write down must be built *only* from these words. If you need a word not on this list, you cannot use it.
  >
  > **Properties:**
  > 1. Shape (Circle, Square, Triangle, Polygon, Curve, Straight)
  > 2. Fill (Solid, Empty, Hatched, Grey, Black, White)
  > 3. Size (Small, Large, Same, Different)
  > 4. Count (1, 2, 3, 4, 5...)
  >
  > **Relations:**
  > 5. Touching (Yes/No)
  > 6. Contained-in (Yes/No)
  > 7. Overlapping (Yes/No)
  > 8. Aligned (Horizontal/Vertical/Diagonal)
  > 9. Identical (Two figures are the same / All figures are unique)
  >
  > **Logic:**
  > 10. All / None / At Least One

  ---

  ### 3. Minute-by-Minute Timeline (90 Minutes)

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Hand out **Vocabulary Cards**. Hand out **Problem Set Alpha** (face down). Do not explain what this is. Say: *"Sort the loose cards into the Left or Right group. Write down three different reasons why they belong there."* |
  | **10-35** | **Round 1** | Teams work on Problem Alpha. They must place the loose probe cards (provided with the sheet) and write **three distinct distinctions** consistent with the 12 examples. They must rank them (Bet 1, Bet 2, Bet 3). |
  | **35-50** | **The Reveal** | Hand out the **Extra Probe Deck** (5 specific cards). Teams must test their three distinctions against these new cards. They will discover their distinctions contradict each other. |
  | **50-75** | **Round 2** | Teams author a new puzzle on Index Cards using the Vocabulary. Seal in Envelope. **Incentive:** You get 2 chocolates if the next team *fails* to find a distinction. You *lose* 2 chocolates if they find a *different* valid distinction (Collision). |
  | **75-85** | **The Swap** | Teams swap envelopes. They have 5 minutes to attempt the new puzzle. They do not need to solve it fully, just check for "Collision" (alternative rules). |
  | **85-90** | **Debrief** | Collect cards. Reveal the name "Bongard Problems." Map the friction points to the cognitive science concepts. |

  ---

  ### 4. Handout Text & Probe Design

  #### Problem Set Alpha (The "Standard" Underdetermination)
  *Design:* This problem must support at least three plausible hypotheses that diverge on the Extra Probes.
  *   **Left Panel (6 cards):** Solid Black Circles.
  *   **Right Panel (6 cards):** Empty White Circles (outlines).
  *   **Loose Probes (Included with sheet):**
      1.  Solid Black Square.
      2.  Empty White Square.
      3.  Solid Grey Circle.
  *   **Why this works:**
      *   *Hypothesis A:* Black vs. White (Color).
      *   *Hypothesis B:* Solid vs. Empty (Fill).
      *   *Hypothesis C:* Dark vs. Light (Intensity).
      *   *The Conflict:* The **Solid Grey Circle** breaks A and C, but fits B. The **Solid Black Square** fits A and B, but if someone hypothesized "Circles vs. Squares," it breaks that.

  #### The Extra Probe Deck (Handout at Min 35)
  *Print these on separate slips. Do not hand these out until Round 1 is done.*
  1.  **Solid Grey Circle** (Tests Color vs. Fill).
  2.  **Hatched Circle** (Tests Fill vs. Texture).
  3.  **Solid Black Triangle** (Tests Shape vs. Fill).
  4.  **Empty White Circle, but very thick line** (Tests Fill vs. Line Weight).
  5.  **Two Small Circles touching** (Tests Count/Relation vs. Individual Property).

  #### Problem Set Beta (The Planted Relational Problem)
  *Give this to **one** specific team (Team 3) during Round 1, instead of Alpha. Do not tell them it is different.*
  *   **Left Panel (6 cards):** Each card contains **three unique shapes** (e.g., Circle, Square, Triangle). No shape repeats *within* the card.
  *   **Right Panel (6 cards):** Each card contains **three shapes, where at least two are identical** (e.g., Circle, Circle, Square).
  *   **The Trap:** Participants looking at individual properties (Shape, Fill, Size) will fail. They will stare at the cards. They will say "It feels like chaos on the right."
  *   **The Vocabulary Key:** Primitive #9 ("Identical / Unique").

  #### Round 2 Authoring Instructions (On Scorecard)
  > **AUTHORING RULES:**
  > 1. Create a Left Group and a Right Group (6 cards each).
  > 2. Your distinction must use **only** the Vocabulary Card.
  > 3. **The 5-Word Limit:** Your distinction must be describable in 5 words or fewer (e.g., "Left has curves, Right has angles").
  > 4. **Seal your rule** in the envelope with the cards.
  >
  > **SCORING:**
  > *   **Solver Fail:** If the next team cannot find your distinction, you gain **2 Chocolates**.
  > *   **Collision:** If the next team finds a *different* distinction that also fits all your cards (using the Vocabulary), you lose **2 Chocolates**.
  > *   **Direct Hit:** If they find exactly your distinction, score is 0.

  ---

  ### 5. Facilitator Script & Debrief

  **The Intro (00:00):**
  "Welcome. No slides today. You have cards. You have a vocabulary. Your job is to sort the loose cards into the Left or Right piles. But here is the constraint: You must write down *three* different reasons why they sort that way. Rank them. Do not use words not on the Vocabulary Card."

  **The Mid-Session Intervention (35:00):**
  "Stop. Take these five new slips. Test your three reasons against them. If your reason says 'Left', but the slip looks like it belongs 'Right', mark it with a red pen. Discuss with your team why your reasons disagree."

  **The Debrief (85:00 - Critical):**
  *Do not lecture. Ask questions based on what happened.*

  1.  **On Underdetermination:** "Team 1, what was your Bet 1? Team 2, what was yours? Did they match?"
      *   *Point:* The 12 examples did not determine the rule. The data was insufficient.
  2.  **On The Probe Deck:** "When the Grey Circle came out, who had to change their bet?"
      *   *Point:* New data collapses the hypothesis space, but only if you committed to a specific hypothesis.
  3.  **On The Planted Problem (Team 3):** "Team 3, you were quieter than the others. Why?"
      *   *Point:* You were looking for properties of *objects*. The rule was about *relations between objects*. Your hypothesis space was too small.
  4.  **On The Authoring Incentive:** "Who tried to make a puzzle that was hard to solve? Who tried to make one that was impossible to misinterpret?"
      *   *Point:* To avoid the 'Collision' penalty, you had to rely on what you think is 'Natural.' You weren't optimizing for logic; you were optimizing for *shared priors*.
  5.  **The Reveal:** "These are called Bongard Problems. They were designed in the 1960s to test pattern recognition. The 'Click' you feel when you solve one isn't truth. It's just your priors aligning with the author's."

  ---

  ### 6. Predictable Failure Modes & Fixes

  | Failure Mode | Prediction | Mitigation |
  | :--- | :--- | :--- |
  | **The "Vibes" Solver** | Someone says "Left feels heavier" but can't map it to Vocabulary. | **Facilitator Intervention:** "That feeling is a hypothesis generator, not a solution. Translate 'Heavier' into Vocabulary primitives (Fill? Size? Count?)." |
  | **The "Baroque" Author** | In Round 2, an author writes a rule like "Left has shapes with >4 vertices OR is grey." | **The 5-Word Limit:** Enforce this strictly. If the rule is long, it's a Collision waiting to happen. This forces simplicity. |
  | **The "Shaky Hand"** | Author draws a square that looks like a circle. Solvers argue about the shape. | **Vocabulary Constraint:** "If the shape is ambiguous, it is invalid. Authors must draw clearly. Solvers must interpret charitably." |
  | **The "Table Arrangement" Cheat** | Solvers arrange the cards in a specific pattern on the table to find a rule. | **Rule:** "The distinction must be on the *cards*, not on the *table*. Shuffle the cards. Does the rule hold?" |
  | **The "Maximize Failure" Gamer** | Author makes a puzzle so hard no one solves it (guaranteed 2 chocolates). | **Debrief Call-out:** "You got the chocolates, but you failed the communication test. In science, a theory no one can test is useless." |
  | **The "Historian"** | The historian tries to contextualize the shapes historically. | **Vocabulary Lock:** "We are in the Vocabulary universe. History is outside the primitives." |

  ---

  ### 7. Limitations: What This Activity Misses

  You asked for honesty on what this *cannot* reproduce.

  **1. The Segmentation Problem:**
  *   **The Gap:** In these cards, the "objects" are pre-segmented. The boundaries are drawn. In real perception (and real Bongard problems), the brain must first decide *where one object ends and another begins*.
  *   **The Consequence:** This activity tests *classification* and *rule selection*, not *perceptual parsing*.
  *   **Debrief Add-on:** You must say: "Today, I gave you the objects. In the real world, your brain has to draw the boxes before it can sort them. That is where the deepest priors live—deciding what counts as a 'thing'."

  **2. The Symbolic Bottleneck:**
  *   **The Gap:** By forcing them to use the Vocabulary Card, you have pre-digested the visual features into symbols.
  *   **The Consequence:** They aren't struggling to *see* the feature; they are struggling to *name* it.
  *   **Debrief Add-on:** "The Vocabulary Card acted as a filter. It made some distinctions easy (Count) and some hard (Texture). In cognitive science, we call this 'representational bias'. You can't solve a problem if you don't have the symbols to think it."

  **3. The "Author" Omniscience:**
  *   **The Gap:** In this game, there *is* a true rule (the Author's). In real science, there is no Author.
  *   **The Consequence:** Players might walk away thinking there *is* a correct answer if they look hard enough.
  *   **Debrief Add-on:** "In this room, the Author knows the truth. In the universe, there is no Author. There is only data, and your priors. The 'Collision' penalty today is what happens in science when two theories explain the same data equally well."

  ### 8. Final Sanity Check on Incentives

  *Will the "Reward for Failure" break the game?*
  If I reward failure, players will make unsolvable puzzles.
  *Fix:* The **5-Word Limit** + **Vocabulary Constraint**.
  If the rule is "Left is Red, Right is Blue" but I draw everything in Black/White marker, the Solvers will claim "Invalid Puzzle."
  *Facilitator Rule:* "If the Solvers claim the puzzle is invalid (rule cannot be expressed in Vocabulary), the Author is disqualified and loses 5 chocolates."
  This forces the Author to make the rule *expressible*, which forces them to care about the Solvers' ability to perceive it. This creates the tension you want: "How do I make this unique (no collision) but obvious (no failure)?" The answer is **Naturalness**.
