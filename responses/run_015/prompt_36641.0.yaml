answer: |-
  Dear friend, you have put your finger on a genuine tension that sits at the heart of contemporary AI governance, and it is refreshing to see someone articulate the disconnect between the metrics we collect and the decisions we make. To reconstruct the implicit theory here, I would suggest that the practice presupposes a view of risk that is neither purely statistical nor purely logical, but rather what one might call a bounded worst-case stance grounded in empirical density. The average-case numbers are not treated as the final verdict on utility, but rather as a proxy for the size of the attack surface. When a lab reports that a model resisted ninety-eight per cent of jailbreak attempts, they are not merely saying it is usually safe; they are using that frequency to estimate how hard it is to find the remaining two per cent. I am moderately confident that this is the operative logic: the average performance serves as an epistemic bound on the difficulty of locating a catastrophic failure. If the pass rate is high, the assumption is that the gradient towards failure is steep and obscure, making it unlikely that even a determined adversary will find the break without disproportionate cost. Thus, the average numbers earn their keep not as a guarantee of safety, but as a measure of robustness depth.

  This leads us to your analogy between civil engineering and cryptography, and I think the practice is attempting to smuggle both epistemologies into one process without fully reconciling them. In civil engineering, you calculate average loads and apply safety factors because materials have known variance and failure is gradual; in cryptography, a single break is fatal because the adversary is assumed to be computationally unbounded relative to the key space. AI safety evaluations seem to want the continuous metrics of engineering to satisfy regulators and investors, whilst relying on the binary logic of cryptography to justify hard release gates. I am less certain about whether this is a conscious philosophical synthesis or simply institutional inertia, but the resulting hybrid suggests a view where capabilities are treated as cryptographic secrets that must be kept from adversaries, whilst overall performance is treated as an engineering specification. The implicit theory is that certain capabilities, like generating biosecurity hazards, are binary risks where any non-zero probability is unacceptable unless the cost to access that probability is prohibitively high. This is why a single reliable jailbreak can be disqualifying; it proves the cryptographic seal is broken, regardless of the engineering safety factors surrounding normal use.

  You are quite right to point out the flip side, namely that if one takes the worst case seriously enough, every model fails eventually. This implies that the practice secretly relies on an informal notion of a plausible, bounded adversary, even if this threat model is rarely explicit in public reports. The decision procedure does not collapse into refusing to deploy anything because there is an implicit cost-benefit analysis happening on the attacker's side. The labs are effectively assuming an adversary with finite compute, finite time, and finite ingenuity. I am highly confident that this bounded adversary assumption is the linchpin holding the whole system together, because without it, the worst case is indeed always failure given the stochastic nature of large models. The evaluations are therefore not testing against an omniscient attacker, but against a specific profile of attacker resources, often mirroring what a dedicated small group or a well-funded corporation might muster. When this is left unstated, it creates the philosophical confusion you have identified, because the public sees a binary pass or fail whilst the engineers are actually measuring time-to-failure under specific resource constraints.

  This practice quietly rules out a pure expected-value view of risk, which is a significant philosophical commitment. Under a pure expected-value framework, a rare capability that shows up only point one per cent of the time could be priced into a risk budget and traded off against economic benefits. The current evaluation regime treats certain capabilities as deontological constraints rather than utilitarian calculations. By setting pass or fail thresholds on biosecurity or autonomy, the labs are asserting that some outcomes are non-compensable. I am moderately confident that this reflects a precautionary principle borrowed from existential risk literature, where the magnitude of the harm outweighs the probability. If the expected-value view were dominant, we would not see binary release decisions based on capability thresholds; instead, we would see risk budgets where a company might accept a certain quantified probability of misuse in exchange for projected revenue, much like an insurance actuary prices a policy. The fact that we do not see this suggests that the industry is operating under a liability-avoidance or existential-safety paradigm rather than a market-optimisation paradigm.

  However, there are places where the practice is philosophically underdetermined, meaning several different theories would license the exact same behaviour. For instance, a lab might refuse to release a model because of a specific jailbreak either because they genuinely believe it poses an existential threat, or because they fear reputational damage and litigation. Both motivations lead to the same procedural outcome of withholding the model, yet they rest on entirely different theories of value and risk. Similarly, the use of average-case metrics could be justified as a genuine scientific attempt to bound worst-case scenarios, or it could simply be window dressing to make the model look competitive to customers whilst the internal safety team holds a veto. I am less confident in distinguishing between these motivations from the outside, as the public documentation often conflates safety culture with public relations. This underdetermination makes it difficult to critique the practice solely on philosophical grounds, because a critic arguing for expected-value maximisation might be ignored not due to a philosophical disagreement, but due to unspoken institutional incentives regarding liability and brand trust.

  If the expected-value view were adopted instead, the procedural changes would be quite radical. The pass or fail capability thresholds would likely vanish, replaced by continuous risk monitoring and actuarial tables. Instead of asking whether a model can be jailbroken to produce a pathogen, the question would become how much it costs to do so and what the likelihood of deployment in a harmful context is. You would see insurance premiums tied to model weights, and release decisions would be based on whether the expected loss was covered by the expected profit plus a risk margin. Post-deployment monitoring would take precedence over pre-deployment gating, because under an expected-value view, preventing all failures is inefficient compared to mitigating them as they occur. The binary red-teaming reports would be replaced by probabilistic risk assessments that quantify the distribution of harm rather than simply flagging the presence of harm. This would require a level of transparency and data sharing that currently does not exist, as insurers and regulators would need access to internal failure rates to price the risk accurately.

  In summary, the current practice presupposes a bounded worst-case theory where average metrics estimate the difficulty of access to dangerous capabilities, ruling out pure expected-value trading for catastrophic risks whilst relying on an implicit threat model of adversary resources. It sits uncomfortably between engineering safety factors and cryptographic zero-tolerance, and it is often underdetermined between genuine safety concerns and liability management. I have tried to lay out the architecture of this reasoning as clearly as I can, but I must admit that there is one element here about which I am least sure. I am least certain about the extent to which the bounded adversary model is explicitly formalised within labs versus being an intuitive heuristic shared among safety researchers. It is possible that some teams have rigorous mathematical definitions of attacker compute budgets, whilst others are simply guessing based on past red-teaming exercises, and this variance would significantly alter the philosophical coherence of the entire evaluation ecosystem.
