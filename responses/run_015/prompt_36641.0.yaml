prompt: |-
  Something about how frontier model evaluations are done has been bugging me philosophically and I want someone to untangle what the practice actually presupposes. The setup, roughly: when a big AI model gets evaluated before release, the numbers that get reported are bascially average-case. The model gets run through a fixed suite of tasks plus some red-teaming, and what comes out is stuff like "resisted 98% of jailbreak attempts" or "performed at such-and-such level on the biosecurity uplift eval". Percentages, pass rates, means over a sampled distribution of propmts and attacks. But the decisions made on the basis of these evals are worst-case in flavour: if a single run crosses a dangerous-capability threshold, or if one jailbreak reproduces reliably, that can be treated as disqualifying no matter how rare it is under normal use, and the whole threat modelling exercise is built around imagining a determined adversary who keeps sampling and adapting until they get lucky. So the same institution measures one way and decides the other way, and I genuinely can't tell whether that's a principled combination or just two teams with two different vibes. What view of risk, or of evidence, does this practice presuppose? Is it something like a maximin stance where you act on the worst case, and if so how do the average numbers earn their keep at all — as a proxy for how bad the worst case is, as a bound on it, or as window dressing? Is the underlying picture closer to civil engineering, where you compute average loads and then slap on safety factors, or to cryptography, where a single workable attack kills the scheme outright? Those seem like pretty different epistemologies to be smuggling into one process. There's also the flip side, which some people in the field raise: if you take the worst case seriously enough, you can always find some adversarial prompt that degrades the model if you try hard enough, so the worst case is essentially always "the model fails" and the decision procedure collapses into refusing to deploy anything. If that's right, does the practice secretly rely on an informal notion of a plausible, bounded adversary — a threat model that never gets explicitly stated? Please reconstruct the implicit theory here, tell me which rival views of risk it quietly rules out (for instance a pure expected-value view, on which a rare capability that only shows up 0.1% of the time could just be priced into a risk budget rather than treated as disqualifying), and say where the practice is philosophically underdetermined, so that several different theories would license the exact same behaviour. And tell me what would actually have to change procedurally if the expected-value view were adopted instead — would the pass/fail capability thresholds go entirely, and what would replace them? Please write in British English, and no formatting at all: no headings, no bullet points, no bold, no tables — just continuous prose like a long email. As you go, flag how confident you are in the big claims, and at the end single out the one point you're least sure about.
