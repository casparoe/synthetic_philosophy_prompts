answer: |-
  ### Brainstorming & Conceptual Distinctions

  Before drafting the proposal, we need to sharpen the core theoretical move. Here are the key distinctions to keep in mind:

  1.  **Standard Diachronic Argument:** If your belief update rule $\neq$ Conditionalization, there exists a sequence of bets (offered at $t_1$ and $t_2$) that you will accept, guaranteeing a net loss.
  2.  **The Hidden Aggregation Assumption:** To call this a "loss," we sum utilities across time: $U_{total} = U_{t1} + U_{t2}$. This assumes **Time-Separable Utility (TSU)**. The value of the outcome at $t_2$ is evaluated independently of the preference state at $t_1$.
  3.  **The Interdependence Hypothesis:** Suppose utility is **Diachronically Interdependent (DI)**. $U_{t1}$ is a function of $U_{t2}$ (not instrumentally, but constitutively). For example, an agent might intrinsically disvalue being a person who holds incoherent beliefs later, or intrinsically value preference stability.
  4.  **The Block:** In a standard pump, the agent accepts Trade A at $t_1$ (small gain) and Trade B at $t_2$ (large loss). Under TSU, Net < 0. Under DI, the agent at $t_1$ anticipates the $t_2$ preference state. If the $t_2$ state involves incoherence (which the agent disvalues intrinsically), the $t_1$ agent might reject Trade A to avoid entering that valuedispreferred trajectory, even if Trade A looks locally profitable.
  5.  **Feasibility Risk:** Defining "interdependence" formally can lead to infinite regress (I care about what I care about...). For a 3-month project, we must bound the recursion depth or use a specific functional form (e.g., recursive utility) rather than building a general theory of diachronic value.

  ***

  ### Research Proposal

  **Project Title:** Diachronic Coherence without Separability: Testing Money Pump Arguments under Interdependent Value Structures

  **Abstract**
  Standard money pump arguments for Bayesian conditionalization demonstrate that agents who update incoherently are vulnerable to sure losses across time. However, these arguments implicitly rely on a Time-Separable Utility (TSU) assumption, where the evaluation of outcomes at distinct times are independent. This project investigates whether diachronic vulnerability arguments hold when utility is Diachronically Interdependent (DI)—specifically, when present preferences depend non-instrumentally on future preference states. By constructing dynamic decision models that relax separability, this research aims to determine if interdependence blocks the extraction step in classic money pumps, thereby insulating incoherent belief revision from pragmatic critique.

  **1. Research Question**
  Do diachronic vulnerability arguments for rational belief revision presuppose time-separable utility, and can they be reconstructed to remain valid under diachronically interdependent value structures?

  **2. Background and Motivation**
  The literature on diachronic rationality (e.g., arguments by Christensen, Maher, and Briggs & Petkov) establishes that violating Conditionalization renders an agent susceptible to a money pump. The force of these arguments rests on the premise that a sequence of individually acceptable trades resulting in a net utility decrease is irrational.

  However, the calculation of "net utility" across time typically assumes additivity or discounting that treats time slices as normatively independent. This is the **Time-Separability Assumption**. In many philosophical contexts—particularly those involving identity, integrity, or resolute choice—agents possess interdependent value structures. An agent may intrinsically disvalue being the kind of person who abandons a prior plan, or intrinsically value consistency between current and future belief states, independent of the monetary payoff.

  Current formal treatments leave this open. Dynamic choice theory often imposes separability for tractability rather than defending it as a normative requirement. If interdependence is permissible, an agent might reject the initial trade in a money pump sequence not because they foresee the monetary loss, but because accepting the trade commits them to a future preference state they intrinsically disvalue. If true, this suggests that money pump arguments do not prove the irrationality of non-conditionalization *simpliciter*, but only the irrationality of non-conditionalization *for agents with separable utility*.

  **3. Methodology and Approach**
  This project will employ formal modeling within decision theory to test the robustness of money pump arguments. The work will proceed in three phases:

  *   **Phase 1: Formalizing Interdependence.** I will define a class of utility functions where $U_{t}$ depends partially on the preference ordering at $t+1$. This will avoid infinite regress by bounding the dependence (e.g., using a recursive utility framework or a specific "preference-stability" parameter).
  *   **Phase 2: Constructing the Decision Trees.** I will build multi-stage decision trees representing standard money pump scenarios (e.g., the Learning Argument). I will model two agent types:
      1.  **TSU-Agent:** Standard time-separable utility.
      2.  **DI-Agent:** Diachronically interdependent utility (where the agent assigns intrinsic cost to future belief incoherence).
  *   **Phase 3: Vulnerability Testing.** I will simulate the belief dynamics. Both agents will employ a non-conditionalizing update rule. I will then check for the existence of a trade sequence that both agents are compelled to accept that results in a dominance violation. The key test is whether the DI-Agent's aversion to their own future incoherence provides a "veto" at $t_1$ that blocks the pump before it starts.

  **4. Expected Outcomes**
  The project will yield one of two significant results:

  1.  **The Resilience Result:** A reconstructed money pump proof is developed that survives interdependence. This would show that even if agents care about future preferences, the sure-loss nature of the pump overwhelms the interdependent value, reinforcing the universality of Conditionalization.
  2.  **The Blockage Result (More Likely):** A demonstration that specific forms of interdependence break the pump. This would show that diachronic coherence is not a free-standing norm but is contingent on the agent's diachronic value structure. This would shift the debate from "Why update by conditioning?" to "Under what value structures is conditioning required?"

  **5. Feasibility and Risk Assessment**
  This project is designed for a 3-month timeline, but there are specific risks regarding scope creep:

  *   **Risk:** *Defining Interdependence.* Formalizing non-instrumental preference dependence can quickly become mathematically intractable or lead to infinite regress problems (caring about what one will care about about...).
      *   *Mitigation:* I will restrict the model to **first-order interdependence**. The utility at $t_1$ depends on the *satisfaction* of preferences at $t_2$, not the utility function at $t_2$ itself. This keeps the algebra manageable.
  *   **Risk:** *Generalizability.* Proving the pump fails for one specific utility function might be dismissed as a niche counterexample.
      *   *Mitigation:* I will aim to identify a *class* of interdependent functions (e.g., those satisfying a specific threshold of stability-valuation) that block the pump, rather than relying on a single contrived equation.
  *   **Risk:** *Normative Interpretation.* Distinguishing between "blocking the pump" and "merely refusing trades" requires care.
      *   *Mitigation:* I will focus strictly on the **extraction condition**. If the agent refuses the first trade, the pump is blocked. The philosophical interpretation of *why* (fear vs. rationality) will be secondary to the formal demonstration of immunity.

  **6. Timeline**
  *   **Month 1:** Formalize the DI utility framework and replicate standard TSU money pump models.
  *   **Month 2:** Run simulations/theorems on DI agents in pump scenarios; identify conditions for blockage.
  *   **Month 3:** Refine results, draft the final paper, and articulate the normative implications for epistemology.

  **Conclusion**
  By isolating the separability assumption, this project challenges the generality of one of epistemology's central normative arguments. If successful, it demonstrates that diachronic rationality is not merely a matter of logical consistency in belief, but is inextricably linked to the temporal structure of value.
