  **TO:** Director, Pendlebury Institute for Theoretical Metrology
  **FROM:** Ontological Compliance Working Group (OCWG)
  **DATE:** 14 October 2023
  **SUBJECT:** Annual Report on Operational Adoption of Eliminativist Structural Realism

  Pursuant to Directive 001, the Institute has replaced its substance-based operating ontology with Ontic Structural Realism (OSR). The Institute's stated rationale is the no-miracles thought plus the continuity-across-theory-change point: past theories got the furniture of the world wrong but the equations right, so the Institute will retain the formulas and decommission the furniture, and it is oddly proud that the previous regime's equations survive as a limiting case of the new ones even though nothing is left for them to describe. This report details the administrative consequences of removing relata while preserving structure.

  1.  **Organizational Topology:** The organigram survives but the boxes in it do not. Staff are advised to navigate the hierarchy by following the arrows of authority rather than seeking vertices. Confusion arose during the quarterly review when the Director attempted to address the team; it was clarified that speech acts are permissible provided they do not presuppose an audience composed of discrete entities. The network exists; the nodes are merely a manner of speaking.

  2.  **Human Resources & Payroll:** Following the Institute's showcase case study of quantum statistics—where permuting the labels of indistinguishable particles changes nothing—Human Resources has implemented permutation invariance literally. Payroll now runs on occupation numbers rather than individual identities.¹ This has resulted in an unsettled question about what happens when two members of staff are assigned to the same node; currently, their salaries merge into a single disbursement. Furthermore, nobody can be fired because there is nobody to fire.² Termination forms require a subject, and the new ontology supplies only predicates.

  3.  **Asset Decommissioning:** There is a crate in the basement labelled with the decommissioned objects. Inventory confirms the crate contains nameplates, office chairs, and the concept of mass. Facilities suggests the crate itself may need decommissioning, but this requires a location for the crate to occupy, which reintroduces the prohibited category of substantial location. The crate remains, structurally integrated into the basement floor.

  4.  **Compliance Certification:** In validating the Institute's structural description, the Working Group discovered, without ever naming it, the Newman-style worry: the Institute's official structural description turns out to be satisfied by any sufficiently large domain whatsoever.³ Consequently, the compliance certificate is, in perfect good faith, awarded to a bucket of gravel. The Compliance Officer cannot explain what went wrong without smuggling back in the very thing the reform deleted—something to pin down which relations are which.

  **Implementation Schedule:**
  *   **Q1:** Reclassify gravel as honorary staff to align with certification.
  *   **Q2:** Resolve the 'bucket' anomaly without referencing intrinsic properties.
  *   **Q3:** Audit the basement crate for residual substantiality.

  **Minority Report:**
  The moderate faction—the people who wanted to keep the objects and merely admit we can only know their structure—accuses the eliminativists of having thrown away precisely what the equations were about. They argue that structure implies a something-which-structures, and that retaining the math while deleting the referent renders the Institute a calculator processing nothing.

  **Maintenance Addendum:**
  J. Miller (Maintenance Engineer, Substance-and-Properties Realist): "The pipe is leaking."

  File closed.

  ***

  **Footnotes:**
  ¹ Reference to Bose-Einstein statistics; indistinguishability implies countable states, not countable things. Admin notes difficulty in issuing tax forms for states.
  ² Cf. the problem of individuation in a world without *haecceity*. HR suggests 'dissolving the relation' instead.
  ³ A restatement of M.H.A. Newman's 1928 objection regarding triviality of structure. Any set of cardinality *N* can satisfy the relations.
