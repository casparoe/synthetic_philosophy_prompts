      *   The "stalemate" isn't really a stalemate anymore in contemporary philosophy (post-Kuhn), but for the sake of the novel, we need a useful framing.
      *   *Distinction:* Local vs. Global Incommensurability. Maybe they agree on 90% of observations (the rocks are hard, the dates are old) but disagree on the *causal story* (vertical sinking vs. horizontal sliding).
      *   *Case Study:* The actual Plate Tectonics revolution is arguably the *best* case study because it wasn't a total wipeout. Old data (lithology) wasn't thrown away; it was recontextualized.
