      *   *Kuhn's Claim:* Incommensurability. When paradigms shift, the meaning of terms changes (e.g., "mass" in Newton vs. Einstein, or "rock" in pre- vs. post-plate tectonics). You can't fully translate one into the other without loss.
      *   *Historians' Counter:* People *did* talk to each other. Papers were cited, debates happened, conversions occurred. If they were truly incommensurable, communication would be impossible.
      *   *The User's Insight:* Are they arguing past each other? One side looking at *semantic content* (philosophers), the other at *social coordination* (historians)?
