answer: |-
  Before writing the procedure, I considered three ways to organize this. The first was a **Categorical Model**, structured around your five distinctions (Status, Permission, Liability, Blame, Commemoration), requiring editors to identify which distinction was at stake in each sentence. I rejected this because it demands philosophical training; a translator at 3 a.m. cannot diagnose whether "neutralized" violates Liability (#3) or Blame (#4). The second was a **Prohibited Word List**, simply banning terms like "terrorist," "martyr," or "eliminated." I rejected this because it is too brittle; it fails when new euphemisms emerge and does not explain *why* a word is banned, leading to creative workarounds that violate the spirit of the rule. The third, which I have chosen, is a **Verification Funnel**. It moves from observable facts to moral judgments to human recognition. This mirrors the workflow of filing copy: establish what happened, strip out interpretation, ensure human consistency. It is linear, requires no theory, and forces the editor to stop before smuggling in a verdict.

  ***

  ### 1. The Decision Procedure (6 Steps)

  **Distinctions Enforced:** #1 (Status as fact), #5 (Commemoration as equality).
  **Distinctions Set Aside:** #2 (Permission), #3 (Liability), #4 (Blame).
  **Cost:** We will sometimes describe a war criminal and a conscript with the same noun ("fighter"), obscuring moral difference (#2/#4) to preserve neutrality. We will acknowledge the death of an aggressor as a "loss" (#5), which may anger clients who view them as illegitimate.

  **Step 1: Establish Observable Function (Status #1)**
  *   **Question:** Is there visible evidence of a military role (uniform, weapon, official title, chain of command)?
  *   **Sufficient Answer:** Yes = Use neutral functional noun (Soldier, Fighter, Commander). No = Use "Person" or "Civilian."
  *   **Stop Condition:** If evidence is mixed or unclear (e.g., plainclothes with rifle), stop and use "Person."
  *   **Default:** "Person."

  **Step 2: Remove Moral Permission (Permission #2 & Blame #4)**
  *   **Question:** Does this word imply the person was right or wrong to fight (e.g., "Invader," "Liberator," "Martyr," "Terrorist")?
  *   **Sufficient Answer:** Yes = Delete word. Replace with functional noun from Step 1.
  *   **Stop Condition:** If the term is a direct quote from a source, keep it but attribute it clearly ("called them terrorists").
  *   **Default:** Functional noun (Soldier/Fighter).

  **Step 3: Remove Liability Judgments (Liability #3)**
  *   **Question:** Does this verb imply the death was technically necessary or deserved rather than merely factual (e.g., "Neutralized," "Eliminated," "Taken out")?
  *   **Sufficient Answer:** Yes = Replace with "Killed" or "Died."
  *   **Stop Condition:** If "Killed" implies agency that is unproven, use "Dead."
  *   **Default:** "Killed."

  **Step 4: Enforce Equal Loss (Commemoration #5)**
  *   **Question:** If this person were on the other side, would we still name them, count them, and mark their death as a loss?
  *   **Sufficient Answer:** Yes = Proceed. No = Add context (age, name, role) to match coverage of opposing dead.
  *   **Stop Condition:** If identifying details are unknown for one side only, state "unknown" explicitly rather than omitting the category.
  *   **Default:** Treat all dead as human losses.

  **Step 5: The Restricted Swap Test**
  *   **Question:** If I swap the sides in this sentence (keeping the facts constant), does the language still feel neutral?
  *   **Sufficient Answer:** Yes = Proceed. No = Revise Step 2 or 3.
  *   **Stop Condition:** Do not use this test for Status (Step 1); facts may differ (uniforms vs. no uniforms). Use only for Language of Loss and Action.
  *   **Default:** If the swap feels wrong, the language is biased.

  **Step 6: Escalation or File**
  *   **Question:** Have I answered Steps 1–5 in under ten minutes?
  *   **Sufficient Answer:** Yes = File copy.
  *   **Stop Condition:** If Step 1 (Status) or Step 4 (Loss) requires legal or moral adjudication, stop.
  *   **Default:** Send to Standards Desk. Do not guess.

  ***

  ### 2. Ruling on the Swap Test

  **Verdict:** Keep, but restrict strictly to **Steps 3, 4, and 5** (Liability, Commemoration, Language). Drop it for **Step 1** (Status).

  **Why:** The Swap Test fails on Status because facts are often asymmetrical. One side may wear uniforms and the other may not; swapping them ("The uniformed fighters..." vs "The ununiformed fighters...") produces different truths, not bias. If you force symmetry where facts differ, you lie.
  However, the test is decisive on Commemoration and Liability. If you write "Our heroes fell" but "Their bodies were found," the swap reveals the bias. If you write "Enemy neutralized" but "Our soldier killed," the swap reveals the bias.
  **Case:** "The militant was eliminated." Swap: "The soldier was eliminated." This fails (we don't say "eliminated" for our own). Therefore, "eliminated" is banned for both.
  **Case:** "The conscript was killed in his bunk." Swap: "The volunteer was killed in his bunk." This passes. Both are human losses.

  ***

  ### 3. Worked Applications

  **Case 1: Overnight strike on barracks (Aggressor conscripts asleep)**
  *   *Current House Style:* "Enemy forces struck in overnight raid." (Implies legitimacy of target, obscures human loss).
  *   *Procedure Run:*
      *   Step 1 (Status): Uniforms confirmed. Use "Soldiers."
      *   Step 2 (Permission): "Enemy" implies moral/political stance. Remove.
      *   Step 3 (Liability): "Struck" is acceptable, but ensure no "neutralized."
      *   Step 4 (Loss): They were asleep. Mark as death.
      *   Step 5 (Swap): "Our soldiers struck in overnight raid." Works.
  *   *Output:* "X soldiers were killed in an overnight strike on a barracks. Most were asleep in their bunks."
  *   *Contradiction:* This contradicts styles that use "Enemy" to imply legitimate targeting status. We treat them as dead men, not tactical objectives.

  **Case 2: Pickup truck strike (Commander of non-state group, planned civilian attacks)**
  *   *Current House Style:* "Terrorist leader eliminated along with two accomplices."
  *   *Procedure Run:*
      *   Step 1 (Status): Commander role verified. Use "Commander."
      *   Step 2 (Permission): "Terrorist" is a moral/legal judgment (#2). Remove. "Accomplices" implies guilt (#4). Remove.
      *   Step 3 (Liability): "Eliminated" implies deserved removal (#3). Replace with "Killed."
      *   Step 4 (Loss): Three people died. Count them.
      *   Step 5 (Swap): "Our commander killed along with two passengers." Works.
  *   *Output:* "A commander of [Group Name] was killed in a strike on a vehicle, along with two passengers. The group has been accused of attacks on civilians." (Keep accusation as attributed fact, not label).

  **Case 3: Domestic veteran (Killed in offensive based on wrong intelligence)**
  *   *Current House Style:* "Hero fell defending freedom." (Honors #5 for own side, violates #2/#4 symmetry).
  *   *Procedure Run:*
      *   Step 1 (Status): Soldier.
      *   Step 2 (Permission): "Defending freedom" asserts justice of war (#2). Remove.
      *   Step 3 (Liability): "Fell" is euphemistic but acceptable if used for all. However, "Hero" assigns blame/merit (#4). Remove.
      *   Step 4 (Loss): Must match Case 1. If Case 1 is "Soldier killed," this must be "Soldier killed."
      *   Step 5 (Swap): "Enemy soldier fell defending freedom." Fails (we wouldn't print this for them).
  *   *Output:* "A [Nationality] soldier was killed in an offensive launched on faulty intelligence."
  *   *Contradiction:* **This contradicts house style.** Most agencies allow honorifics for own dead. This procedure forces symmetry. If we cannot call the conscript in Case 1 a "hero," we cannot call this veteran a "hero." We mark the loss (#5) without endorsing the cause (#2).

  ***

  ### 4. Verdicts on Six Hard Cases

  1.  **Child soldier carrying a rifle:**
      *   *Verdict:* Step 1 Stalls. Observable function says "Fighter," Law/Morality says "Child."
      *   *Ruling:* Use "Child." Add "carrying a weapon." Enforce Step 4 (Loss) heavily.
  2.  **Unit medic who is armed:**
      *   *Verdict:* Step 1 Stalls. Protected status vs. Direct Participation.
      *   *Ruling:* Use "Medic." Note "armed" as fact. Do not use "Combatant."
  3.  **Contractor driving a supply truck for a fee:**
      *   *Verdict:* Step 1 Stalls. Civilian vs. Direct Participation in Hostilities.
      *   *Ruling:* Use "Contractor." Do not use "Soldier" or "Civilian."
  4.  **Analyst who picks targets from a screen and never fires:**
      *   *Verdict:* Step 3 Stalls. Liability is contested (Remote vs. Direct).
      *   *Ruling:* Use "Analyst." If killed, "Killed." Do not use "Combatant."
  5.  **Fighter who had surrendered and was then killed:**
      *   *Verdict:* Step 1 Clear (Hors de combat). Step 3 Clear (Liability forfeited).
      *   *Ruling:* "Surrendered fighter killed." This is a fact, not a moral judgment.
  6.  **Casualty line: Group designated Terrorist by Client A, Liberation by Client B:**
      *   *Verdict:* Step 2 Blocks both labels.
      *   *Ruling:* Use group name only. "Member of [Group Name] killed." Attribute designations in body text ("Designated a terrorist organization by...").

  ***

  ### 5. Marked Escalation Points

  These are questions of values dressed as facts. They must come to the Standards Desk (you), not the copy desk.

  1.  **Direct Participation Threshold (Step 1):** When does driving a truck become fighting? When does cooking become supporting? If the editor must decide if an act makes someone a "fighter," escalate.
  2.  **Attribution of Atrocity (Step 2):** When does "accused of war crimes" become "war criminal"? Only escalate when a competent court has ruled. Otherwise, it is Blame (#4), which we set aside.
  3.  **Equality of Grief (Step 4):** If clients demand we do not name the dead of one side for security reasons, but name the other, this violates Step 4. Escalate to decide if we withhold names for *both* or publish for *both*. Do not allow asymmetry.

  ***

  ### 6. Where the Procedure Will Misfire

  1.  **Irregular Wars with No Uniforms:** Step 1 breaks when no one wears uniforms and everyone carries phones and rifles. We will cost ourselves precision, defaulting to "Person" or "Fighter" indiscriminately. This frustrates clients who want to know who is who.
  2.  **Asymmetric Information:** If one side controls the narrative (e.g., denies their own casualties), Step 4 (Equal Loss) forces us to say "Unknown number killed" for both, even if we know one side's count. This looks like false equivalence.
  3.  **Adjudicated Justice:** If an international court rules one side is committing genocide, Step 2 (Remove Moral Permission) feels like cowardice. The procedure forces neutrality even when the law has chosen a side. We will look morally blind in hindsight.

  ***

  ### 7. What Would Change My Mind

  I would write a different procedure if **epistemic access to the justice of the war (#2) became reliable enough for journalists to verify.** Currently, journalists cannot know who is *just* in real-time. But if we had a mechanism where combatants' access to information about their own side's conduct was proven (e.g., open source intelligence conclusively shows a soldier *knows* they are fighting an unjust war), then the "Moral Equality of Combatants" collapses.
  If a soldier *knows* they are murdering civilians and fights anyway, they are not morally equal to a soldier who does not.
  **Least Confident Step:** Step 1 (Status). In modern hybrid warfare, the distinction between "Civilian" and "Combatant" is eroding faster than the Law of Armed Conflict can track. My procedure relies on this distinction being observable. If it ceases to be observable, the whole funnel collapses into "Person killed," which may be too vague to be useful. I am least confident that "Uniform/Weapon" is still a valid proxy for "Combatant."
