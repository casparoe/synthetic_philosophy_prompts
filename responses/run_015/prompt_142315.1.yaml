  ok so my philosophy club is doing Descartes and I need a joke for one of my slides. He apparently thought animals were like robots with no real thoughts or feelings at all, like a dog yelps when you step on its paw but its not actually in pain, its just mechanics, and the big proof he used was language — even a perfect machine could never rearrange words to give a real answer to whatever you say to it, the way any human can. Also something about how reason is supposed to be this all purpose tool that works in every situation, while machines are always only good at one narrow thing.

  Anyway there's this thing now where people train dogs with those big plastic buttons on the floor, each one plays a recorded word, and the dog presses them in different orders to make like sentences (outside, play, love you, etc).

  Can you write a joke where Descartes watches one of these button dogs and the punchline actually turns on his language argument, like why what the dog is doing still wouldnt count for him, and maybe the all purpose reason thing too? It should be funny to someone who actually knows Descartes, not just haha dog pressed button. keep it short, one or two sentences max.
