answer: |-
  The sound of the tide against the concrete was the first thing Elara heard when she unlocked the door, a low heavy slap that vibrated through the floorboards of the harbor office. It was a century since the old sea walls had failed, and the town now lived inside the curve of the new barrier, a gray arc of reinforced polymer and stone that rose thirty feet above the high-water mark. The office was small, a single room above the dockmaster's station, smelling of salt and old paper. There were three desks, but only two were used. The senior analyst, Mr. Hale, was already at his station, drinking tea and looking at a spreadsheet, but he left the file on Elara's desk without a word. It was her turn to draft the review.

  The file was thick, bound in the standard blue cover of the Infrastructure Deferral Committee. The proposal was request number four-zero-nine: a petition to postpone the scheduled reinforcement of the northern sector of the barrier for forty years. The cost of doing the work now was substantial, a sum that would require raising taxes on the current households or cutting the budget for the school renovation and the clinic expansion. The argument in the file was straightforward. If the town invested that money in the school and the clinic instead, the children living now would be healthier and better educated by the time the bill came due. The barrier, the engineers claimed, was safe enough for the present. The risk of failure in the next four decades was low, though not zero. The request was to let the future pay for its own protection.

  Elara opened the ledger. It was kept twice, once in digital format and once in the heavy bound book that sat between the desks, a habit from the early years when the power grid was unreliable. She dipped her pen in the inkwell and looked at the numbers. The core task of her job was to separate the reasons for waiting from the excuses for waiting. Some reasons were about trade. Money spent on concrete today was money not spent on education today. If the education yielded a return, the town would be richer in forty years. A richer town could afford the barrier more easily than a poorer one. That was a respectable reason. It treated the future as a partner in a business deal.

  Other reasons were about uncertainty. Would there be a town in forty years? The sea levels were still rising, but the technology for barriers was improving. If a new material was invented in twenty years that was cheaper and stronger, building now would be wasteful. Waiting might mean the work was never needed, or done better later. That was also respectable. It acknowledged that the map was not the territory.

  Then there was the third reason, the one that hid inside the others. It was the idea that a benefit enjoyed now was simply worth more than a benefit enjoyed later, regardless of wealth or risk. It was the bare later-ness of the cost. Elara suspected this was the engine driving request four-zero-nine, dressed up in the clothes of investment and innovation. To find it, she used a test she had developed in her first year. She closed her eyes and imagined the council chamber. She pictured the five council members sitting around the table. In her mind, she shuffled them. She imagined that none of them knew whether they would be living in the town now or in the town forty years from now. They knew they would be residents, but the dice of time had not been cast. She asked herself how they would vote if they did not know which side of the forty-year gap they would occupy.

  If they were truly blind to their own position in time, they would not vote to defer simply because the pain was later. They would want the barrier secure regardless of when they drew breath. If the vote changed when she removed the knowledge of their own era, then the deferral was based on the mere fact that the cost was distant. It was a way of telling the future to handle its own problems while the present kept the money.

  Elara opened her eyes and looked at the numbers again. The test worked cleanly on paper, but when she applied it to the file, it snagged. The first trouble was the wealth argument. The projections suggested the town would be significantly richer in forty years. The school investment would yield higher wages, the clinic would reduce long-term care costs. If the future town was wealthier, the same sum of money would represent a smaller sacrifice for them than for the current residents. Even if the council members did not know when they would live, they might still vote to defer. If you know you might be poor now and rich later, you might gamble on the later date to pay the bill. The test did not condemn the deferral; it merely highlighted that the burden would be lighter later. The distinction between a respectable economic calculation and a selfish delay blurred. The future people might not mind paying, because they would have more to give.

  She turned the page to the risk assessment. Here was the second trouble. The file assumed the bill would be paid in forty years. But Elara knew the history of the ledger. There were three previous deferrals for the western sector, each kicked down the road by twenty years. The office existed because everyone knew the council would defer again when the time came. If she approved this, the next junior analyst in forty years would sit in this chair with a similar file. The barrier would be forty years older, the sea higher, and the cost greater. The test assumed a single decision point, but the reality was a chain of decisions. If every generation voted to defer because the next one would be richer, the barrier would never be reinforced until it broke. The test could not account for the habit of waiting. It treated the future as a single moment rather than a sequence of moments, each capable of passing the buck to the next.

  Elara looked out the window. The tide was coming in, dark water pressing against the gray wall. She thought about the math in the ledger. The formula they used to compare present costs with future benefits relied on a rate of change over time. It was a standard calculation, meant to ensure money was spent where it did the most good. But she had noticed something about the number as it moved across the decades. At ten years, the future benefit was still large enough to justify a cost. At twenty, it was smaller. At forty, it was manageable. But if she extended the line to eighty years, or a hundred, the number shrank until it was negligible. Anything far enough out had shrunk below whatever would justify any cost at all. If the town planned for a hundred years, the math said the future benefit was worth almost nothing today.

  This implied something about her job that she did not like. If the math held, then her office was only useful for short-term disputes. For anything truly distant, the calculation dictated that the present should spend nothing. The ledger demanded that the future be treated as if it did not exist, simply because it was far away. If she followed the formula strictly, she would have to recommend deferring the barrier forever, because the cost now was real and the benefit later was mathematically invisible. But if she ignored the formula, she was no longer doing the analysis; she was guessing. The tool she used to protect the future was the same tool that erased it.

  Mr. Hale cleared his throat. The council would be waiting for the recommendation in an hour. They needed a yes or a no, a justification they could read aloud without stumbling. Elara looked at the file again. She could reject the deferral and force the town to pay now, protecting the barrier but hurting the school. She could approve it and bet on the future wealth, risking the safety of the wall. Or she could approve it with conditions, demanding a fund be set aside now to pay later, though she knew funds had a way of being redirected when emergencies arose.

  The test had not given her a clear answer. The wealth argument was valid, but the chain of deferral was dangerous. The math made the future small, but the sea did not care about the math. She picked up her pen. The ink was dark against the white paper. She wrote the date at the top of the page. She wrote the file number. She had to choose which reason to privilege in the summary, knowing that whichever she chose would be used by the council to justify what they wanted to do anyway. The tide slapped against the wall below, a steady rhythm that did not speed up or slow down for the budget cycle. She dipped the pen again and began to write the recommendation, knowing that the words would have to carry a weight that the numbers could not hold.
