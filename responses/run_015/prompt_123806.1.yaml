answer: |-
  1. The Vendor hereby transfers to the Museum all rights, title, and interest in the physical object designated as Lot 404, including the separable metaphysical asset known as "ontic provenance," which shall remain legally distinct from the object's material substrate.

  2. The insured value of the ontic provenance shall be calculated independently of material restoration costs, based on a sliding scale determined by the object's causal distance from any known simulacra.

  3. Modal contamination shall be deemed to occur if the Work is displayed within a three-meter radius of a high-fidelity replica, thereby reducing the ontic provenance by no less than fifteen percent per hour of exposure.

  4. Conservation efforts must utilize instruments certified never to have contacted a copy, as any cross-contamination of tools shall constitute a material breach of the ontic warranty.

  5. Should the Artist subsequently retouch any corner of the Work, the ontic provenance shall be considered fully extinguished, requiring the Vendor to refund the premium paid for metaphysical uniqueness.
