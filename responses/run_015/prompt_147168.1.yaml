answer: |-
  **1. Pratyakṣa (Perception): 9**
  Within the Nyāya framework, perception possesses the highest error-correction resilience because its validation mechanism is internal to the act of sensing itself. Errors in *pratyakṣa* arise from specific defects (*doṣa*) in the sense organs, the medium, or the mind, such as distance or dim light. A community of inquirers can rectify a false deliverance—such as mistaking a rope for a snake—simply by removing the defect and engaging in a subsequent, non-defective perceptual encounter with the same object. This correction does not require inference or testimony; it relies on the capacity of *pratyakṣa* to override prior erroneous perception (*bādha*) through direct contact (*sannikarṣa*) that yields a veridical cognition (*yathārtha-jñāna*). Because the remedy is merely a clearer instance of the same source, it remains independent of the other three *pramāṇas*.

  **2. Anumāna (Inference): 8**
  Inference ranks second because the Nyāya system provides a robust internal logic for detecting errors without immediate recourse to observation. False deliverances in *anumāna* typically stem from flaws in the reason (*hetu*), which are cataloged as fallacies (*hetvābhāsa*). A community can identify these errors by analyzing whether the *hetu* satisfies the conditions of invariable concomitance (*vyāpti*) across similar (*sapakṣa*) and dissimilar (*vipakṣa*) instances. While establishing *vyāpti* originally requires observation, the *correction* of a faulty inference can often be achieved through logical debate (*vāda*) that exposes contradictions or inconclusiveness (*anaikāntika*) within the inferential structure itself. This logical self-regulation grants it high resilience, though it remains slightly subordinate to perception since ultimate verification of the *pakṣa* rests on direct contact.

  **3. Śabda (Testimony): 4**
  Testimony receives a lower score because its reliability hinges entirely on the trustworthiness (*āptatva*) of the speaker, a condition that cannot be verified using testimony alone. If a community encounters conflicting reports, determining which speaker is an *āpta* (trustworthy person) generally requires inferring their competence from past performance or perceiving their expertise, both of which rely on other *pramāṇas*. While internal consistency (*yogyatā*) and syntactic expectancy (*ākāṅkṣā*) can filter nonsensical statements, they cannot confirm truth against a deliberate lie or an honest mistake by an authority. Without the ability to cross-check the speaker's reliability via inference or perception, the community lacks an internal mechanism to rectify false testimony non-circularly.

  **4. Upamāna (Comparison): 2**
  Comparison exhibits the least resilience because it is derivative, relying on prior knowledge of both the standard object and its name established by other sources. *Upamāna* generates knowledge of the relation between a name (*saṃjñā*) and its referent (*saṃjñin*) based on similarity (*sādṛśya*). If a false identification occurs—for instance, misidentifying a wild cow based on a flawed similarity judgment—correcting this error requires re-examining the standard object (perception) or consulting the definition of the name (testimony). There is no internal mechanism within comparison itself to validate the degree of similarity or the accuracy of the naming convention without looping back to *pratyakṣa* or *śabda*, making it highly vulnerable when isolated.
