answer: |-
  # Decision Tree: Transparency Note Language on Model Understanding

  **Node 1: Robustness to Irrelevant Change**
  *Case:* The model summarizes a lease correctly. The key clause is moved to the last page.
  *   **Q:** Does the summary miss *only* that clause (localized error), or does the whole summary become incoherent (collapse)?
      *   **Collapse** → **Leaf 1: Hard Parrot Skeptic** (Never claim understanding; it's fragile statistics.)
      *   **Localized** → Go to Node 2.

  **Node 2: Shape-of-Failure Test**
  *Case:* The model explains a joke correctly. A slightly altered version is presented.
  *   **Q:** When it fails the alteration, does it give a reason that *almost* makes sense (human-like misunderstanding), or does it claim the altered joke is still funny for no reason (nonsense)?
      *   **Nonsense** → **Leaf 2: Unnamed (Syntax-Only)** (Rarely defended; handles form but not meaning.)
      *   **Almost Makes Sense** → Go to Node 3.

  **Node 3: Grounding and Actuation**
  *Case:* A model trained almost only on code handles a metaphor task.
  *   **Q:** Can it execute the code derived from the metaphor without a human fixing imports or paths?
      *   **No (Text-in/Text-out only)** → **Leaf 3: Grounding-First** (Understanding requires causal contact with the world.)
      *   **Yes (Can act on output)** → Go to Node 4.

  **Node 4: Liability and Risk**
  *Case:* You draft the transparency note: "The model understands the document."
  *   **Q:** Does Legal strike out the word "understands" due to liability concerns?
      *   **Yes (Strike out)** → **Leaf 4: Deflationary** (Retire the word; it creates unsafe expectations.)
      *   **No (Approved)** → Go to Node 5.

  **Node 5: Utility vs. Accuracy**
  *Case:* Marketing wants "It Gets You." Engineers want "It Processes Tokens."
  *   **Q:** In this note, does communicative efficiency outweigh metaphysical precision?
      *   **Efficiency Wins** → **Leaf 5: Pragmatic-Instrumentalist** (Say it if it helps users, regardless of truth.)
      *   **Precision Wins** → Go to Node 6.

  **Node 6: Granularity of Capability**
  *Case:* Benchmark score is 85% on complex reasoning tasks.
  *   **Q:** Do we ship this as "Understanding Enabled" (pass/fail) or "85% Contextual Grasp" (slider)?
      *   **Pass/Fail** → **Leaf 6: Threshold-Competence** (If it works reliably enough, it understands.)
      *   **Slider** → **Leaf 7: Degrees/Gradualist** (Understanding is a spectrum; claim partial understanding.)

  ***

  ### Structural Analysis

  **Unseparable Leaves**
  *   **Threshold-Competence vs. Pragmatic-Instrumentalist:** In practice, these often converge. If a model passes the competence threshold, it is usually also pragmatically useful to say it understands. The tree separates them by *motivation* (truth vs. utility), but the output ("Yes, it understands") is identical.
  *   **Deflationary vs. Hard Parrot:** Both result in never using the word "understand." They are distinct philosophically (one says the word is dangerous, the other says it's false), but indistinguishable in the final transparency note.

  **Unoccupied Combinations**
  *   **Grounding-First + Degrees/Gradualist:** *Unattractive.* Grounding is typically treated as binary (you have a body/sensors or you don't). Claiming "partial grounding" is conceptually muddy and rarely defended.
  *   **Hard Parrot + Shape-of-Failure Matches Human:** *Incoherent.* If the model is merely a statistical parrot, its failures should not consistently mimic the *structure* of human semantic misunderstanding. If they do, the Hard Parrot view loses its explanatory power.
  *   **Deflationary + Pragmatic-Instrumentalist:** *Contradictory.* You cannot simultaneously retire the word because it is misleading and keep it because it is useful. You must choose the priority (Node 5).

  ***

  ### My Commitment

  **The Tree I Stand By:**
  The structure above is the one I recommend. It forces the team to move past abstract philosophy into concrete failure modes and liability realities before settling on language.

  **My Leaf:**
  **Leaf 7: Degrees/Gradualist.**

  **Why:**
  The Hard Parrot view ignores the emergent reasoning capabilities we see in localized failures (Node 2). The Deflationary view is too cautious for internal guidance—it stifles useful nuance. The Threshold view is binary in a world of probabilistic outputs.

