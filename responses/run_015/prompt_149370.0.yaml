      *   *Worry 3: Incompatible Ascriptions & Training Data Artifacts.*
          *   *Incompatible Ascriptions:* If two incompatible sets of beliefs predict equally well, IS says neither is uniquely "true," but one might be more useful. However, Dennett usually argues the "best" stance converges.
          *   *Training Data:* This is the "Chinese Room" vibe. Dennett would say if the input/output behavior is indistinguishable and the system is complex enough, the source (biology vs. silicon) doesn't matter *for intentionality*. However, the "artifact" worry suggests the prediction works *because* humans wrote the text, not because the model has beliefs. Dennett might counter that if the model sustains the stance autonomously, the origin matters less. But the handout ignores the *autonomy* requirement.

  4.  **Evaluate the Bottom Line:**
