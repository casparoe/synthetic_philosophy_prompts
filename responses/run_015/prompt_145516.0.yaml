prompt: |-
  hey so i was arguing with my friends about whether inheritance taxes are actually about fairness or just jealousy, and it got me thinking about Pride and Prejudice. like, the whole plot is driven by the fact that longbourn is entailed away from the bennet girls to Mr Collins, which is this perfect example of dynastic wealth being locked up by old rules. but i also read somewhere about this idea called "starting-gate equality" — that equal opportunity isnt just about jobs but about whether you start life with capital or debt — and now i cant stop seeing the novel through that lens.

  so heres what i want: read Pride and Prejudice (the novel, or the 2005 film with keira knightley if thats easier) as a story about inheritance and equal opportunity. does Austen treat the entailment as unfair, or just as an unfortunate fact of life? Mr Darcy has this huge fortune that he clearly didnt earn — its all Pemberley and family — but the novel makes him the romantic hero. meanwhile Mr Collins gets Longbourn just because hes male, and were supposed to laugh at him. is there a hidden argument here about whether inherited wealth is legitimate only when the heir is "worthy"? and where does Elizabeth turning him down fit — is she rejecting dynastic logic or just playing a different game?

  i'd like a reading that takes both the philosophy and the book seriously. specifically, im wondering if Austen accidentally shows that all this old money — whether Darcys or Collins's — is basically unearned capital protected by law, and whether her happy ending (everyone marrying into wealth) actually solves the problem or just reshuffles it. also, does the novel know the difference between "equal opportunity" and "equal outcome" in the marriage market? tell me where the philosophical reading holds up and where it breaks, especially if im missing something about how inheritance actually worked back then.
