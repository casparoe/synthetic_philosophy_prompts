answer: |-
  This is a really sharp distinction you're making, and honestly, it cuts right to the tension in modern archival theory. You're intuitively hitting on something that a lot of scholars wrestle with but don't always name clearly.

  If you're thinking out loud, here's how I'd map the terrain of what you're calling "structured illegibility" versus traditional "silence."

  ### 1. Absence vs. Obfuscation (The Ontological Split)
  You asked if this is just another flavor of absence. I'd argue **no**.

  *   **Traditional Silence (Trouillot):** This is often about *erasure*. The event didn't make it into the record, or the record was destroyed. The power move here is **negation**. "This did not happen" or "This person does not exist."
  *   **Structured Illegibility (Your Concept):** This is about *appropriation* and **redefinition**. The person exists in the record, but their ontology is overwritten by the institution's ontology. In your example, a relationship isn't erased; it is transmuted into "deviance."

  This isn't silence; it's **noise**. It's a specific kind of epistemic violence where the archive speaks *over* the subject rather than *for* or *about* them. If you treat this as mere "silence," you imply the solution is just to "speak louder" or "find more boxes." But if the problem is illegibility, the solution isn't finding more records; it's **decoding or breaking the cipher.**

  ### 2. Theoretical Resonances
  You're essentially describing the flip side of James C. Scott's *Seeing Like a State*. Scott talks about how states make populations "legible" to control them (surnames, census data). Your "structured illegibility" is what happens when that legibility is weaponized to make specific *human experiences* unreadable to anyone outside the power structure.

  It also resonates heavily with **Ann Laura Stoler's *Along the Archival Grain***. She argues that we shouldn't just look for the "truth" hidden in archives, but look at how the archive *produced* truth. The taxonomy itself is the artifact of power. When an archivist indexes a queer relationship as "deviance," they aren't just describing a file; they are performing an act of statecraft.

  ### 3. The Question of Responsibility
  This is where it gets ethically messy, and your intuition that the responsibility shifts is spot on.

  *   **The Record Creator (The Institution):** They committed the initial violence of categorization. They defined the "truth" of the moment.
  *   **The Archivist (The Custodian):** This is the pivot point. Traditional archival theory (respect des fonds, original order) says: *Keep the taxonomy as is to preserve context.* If you change "Deviance Report" to "Queer Relationship," you risk sanitizing history or losing the context of oppression.
      *   *However:* If you keep the original taxonomy without context, you become complicit in the illegibility. You are guarding the cipher.
      *   *Shift:* Responsibility moves to the archivist to provide **parallel metadata**. You don't destroy the original finding aid (which is historical evidence of the oppression), but you build a layer of description that makes the content legible to the community it describes.
  *   **The Researcher:** Relying on the researcher to "read against the grain" (as Derrida or Stoler suggest) is a high bar. It privileges the scholar who has the time, training, and theoretical toolkit to decode the system. If access depends on knowing the institutional logic, then the archive remains exclusive.

  ### 4. Implications for Recovery and Repair
  If you conflate omission and mis-cataloging, your repair strategies will be mismatched.

  *   **Repairing Omission:** Requires speculation, oral history, community memory, acknowledging the gap. It's about **mourning and imagining**.
  *   **Repairing Illegibility:** Requires **translation and disruption**. It's about building alternative finding aids, using tag-based systems that allow for community-generated descriptions (like the "Archives for Black Lives in Philadelphia" model), or explicitly naming the bias in the finding aid.

  ### The Conceptual Split
  Treating them as the same "silence" obscures the mechanism of power.
  *   **Silence** suggests the archive is a *container* that is partially empty.
  *   **Illegibility** suggests the archive is a *language* that is hostile to certain speakers.

  If it's a hostile language, then "recovery" isn't just digging things up; it's a act of **linguistic reclamation**.

  ### One Thing to Ponder
  You might want to look into **Michelle Caswell's** work on "symbolic annihilation" versus **archival power**. She distinguishes between not being there and being there only as a victim or criminal. That sounds exactly like your "deviance report" example.

  Does this distinction help clarify the beast you're seeing? It sounds like you're moving toward an argument that **access is not just physical, but semantic.**
