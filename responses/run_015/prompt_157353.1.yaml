      *   *Traditional Silence:* Michel-Rolph Trouillot's "silences in the archive." Usually implies something is *missing* (never created, destroyed, lost).
      *   *User's Concept:* The record *exists*. It might even be plentiful. But the *access points* (metadata, finding aids, indexing) use language that renders the subject invisible to anyone not initiated into the specific power structure that created the taxonomy.
      *   *Example:* Queer relationships indexed as "deviance" or by "ward number."
      *   *Theoretical Parallels:* This sounds like Jacques Derrida's *Archive Fever* (archival power determines what is consignable), Michelle Caswell's work on community archives, or even Lisa Gitelman's "raw data" is an oxymoron. It also resonates with "epistemic violence" (Spivak).

  3.  **Address Question 1: Absence vs. Different Power?**
      *   It is *not* just absence. Absence implies a void. This is a *barrier*.
      *   It's a form of *control* rather than *erasure*.
      *   It shifts the dynamic from "what happened?" to "who gets to define what happened?"
      *   *Term check:* "Structured illegibility" is a strong term. James C. Scott uses "legibility" in *Seeing Like a State*, but usually regarding populations. Applying it to archival metadata is clever.
      *   *Verdict:* It's a different ontological category. It's presence masked as absence.

  4.  **Address Question 2: Responsibility (Record-keeper, Archivist, Researcher)?**
      *   *Record-keeper (Creator):* They established the power dynamic (e.g., the asylum superintendent labeling love as deviance). This is the origin of the violence.
      *   *Archivist (Custodian):* Did they perpetuate the taxonomy uncritically? Or did they add context? Keeping the original order (provenance) is a sacred archival principle, but does it perpetuate harm? This is the tension between *respect des fonds* and *ethical description*.
      *   *Researcher:* "Reading against the grain" (Derrida/Stoler) is a skill, but should access depend on elite skill? If only the most privileged scholars can decode the system, is that equitable?
      *   *Synthesis:* Responsibility is shared but weighted. The archivist holds the key to *mediation*.

  5.  **Address Question 3: Conflating Omission and Mis-cataloging?**
      *   Yes, conflating them obscures the mechanism.
      *   Omission = Erasure (You don't exist).
      *   Mis-cataloging = Gaslighting/Obfuscation (You exist, but only as a criminal/patient/number).
      *   Repair strategies differ: For omission, you might need oral history or speculative archives. For mis-cataloging, you need *radical re-description* or *parallel metadata*.

  6.  **Address Question 4: Implications for Recovery and Repair?**
      *   If it's omission: We mourn, we imagine, we look elsewhere.
      *   If it's illegibility: We translate, we tag, we build alternative finding aids.
      *   This moves from "finding the truth" to "disrupting the classification system."

