answer: |-
  Here is the analysis of *Dagen H* through the Lewisian apparatus, followed by an assessment of what the episode reveals about the theory's limits.

  ### 1. Mapping the Lewisian Apparatus

  **Population and Recurrent Situation**
  Lewis requires a population $P$ and a recurrent situation $S$. In *Dagen H*, $P$ is not merely "drivers" but all agents participating in the road network (drivers, cyclists, pedestrians). The recurrent situation $S$ is not a single dyadic encounter (two cars meeting) but the systemic act of entering the traffic flow. While Lewis often models conventions as aggregates of pairwise interactions, traffic is a network good: my payoff depends on the conformity of the aggregate, not just the next car I see. However, this scales: if almost everyone conforms to the side-of-the-road regularity, the pairwise encounters resolve smoothly.

  **Options, Payoffs, and Coordination**
  The options are binary: drive on the left ($L$) or right ($R$). The payoffs are predominantly coincident: everyone prefers avoiding head-on collisions to causing them. This fits Lewis's **coordination problem** structure. However, there is a distributional residue. The transition imposed costs on specific subgroups (bus companies, tram operators, owners of fixed infrastructure). Lewis's definition of convention focuses on the *regularity* itself, not the history of its adoption. Once the switch occurred, the distributional conflict vanished into sunk costs. The post-1967 situation is a near-pure coordination problem; the pre-1967 situation involved a coordination problem overlaid with a collective action problem regarding the *switch*.

  **Arbitrariness and Equilibrium**
  Lewis stipulates that a convention must be arbitrary: there must be an alternative regularity that *could* have served the same purpose. The existence of Norway and Finland ($R$) and the UK ($L$) proves the arbitrariness condition is met globally.
  However, your data point about the car stock is critical. If 90% of Swedish cars were Left-Hand Drive (LHD), they were technically mismatched for Left-Hand Traffic (LHT). LHD cars are optimized for Right-Hand Traffic (driver near the centerline for overtaking visibility). Thus, the $R$ equilibrium was likely Pareto-superior to the $L$ equilibrium even for Swedish car owners, not just for cross-border compatibility.
  Does this violate arbitrariness? No. Lewis does not require equilibria to be payoff-identical, only that both are *coordination equilibria* (where no one benefits from unilateral deviation). The fact that $R$ is safer than $L$ does not stop $L$ from being a stable convention. It merely explains why the state might want to move the focal point. The stability of the $L$ equilibrium despite its technical inferiority confirms Lewis's insight that coordination payoffs (safety via conformity) can outweigh technical payoffs (visibility via car design).

  **The Referendum as Evidence**
  The 1955 referendum (83% for $L$) is best read through Lewis's lens not as evidence of intrinsic preference for $L$, but as evidence of **expectations**. Voters were asked to choose a rule in the absence of a guaranteed switch. Given that everyone else was expected to drive on the left, my best response is to drive on the left. The vote confirms that preferences over traffic sides are endogenous to expectations about others' behavior. It validates the Lewisian claim that the reason for conforming is the expectation of conformity.

  ### 2. Where the Theory Speaks and Where It Is Silent

  **The Transition Problem**
  Lewis's account is static; it explains the maintenance of equilibrium, not the jump between basins of attraction. In a Lewisian world, moving from $L$ to $R$ is impossible via individual rational choice because unilateral deviation is catastrophic (death). The theory predicts lock-in. *Dagen H* happened anyway. This is not a falsification, but a boundary marker: Lewis explains the *state* of convention, not the *dynamics* of convention change when precedent opposes the shift.

  **Speculation 1: The State as Common Knowledge Generator**
  Your suggestion that the state functioned as a correlating signal is robust. Lewis relies on "salience" and "precedent" to solve the coordination problem. Precedent favored $L$. The state manufactured a new **Schelling point**: *Sunday, 05:00*.
  Crucially, Lewis requires **common knowledge** (I know that you know that I know...). A mere law is not enough; it must be known to be known. The four-year campaign and the total traffic halt were mechanisms to ensure common knowledge.
  *The Probe:* If the announcement reached only 4/5 drivers, with no way to identify the uninformed 20%, Lewis's theory predicts collapse. Coordination equilibria require near-universal conformity expectations. If I assign a 20% probability that an oncoming driver is operating on the old equilibrium ($L$), the expected utility of driving on $R$ plummets. The theory predicts that without near-perfect common knowledge, the switch would result in a spike of accidents sufficient to revert the population to $L$ (or chaos). This matches the intuition: the "halt" was necessary not to move cars, but to synchronize knowledge.
  *The Second-Order Convention:* You suggest this worked because of a prior convention of deferring to the state. This is a vital augmentation. Lewis treats conventions as emerging from interaction. *Dagen H* shows that a **meta-convention** ("obey traffic legislation") can be leveraged to install a **first-order convention** ("drive on the right"). Lewis's framework doesn't explicitly model this hierarchy, but it accommodates it: the reason for conforming to the new rule includes the expectation that others will conform *because* the state said so.

  **Speculation 2: Material Sediment vs. Expectation**
  You distinguish between expectations and "material sediment" (road markings, headlamp beams, intersection geometry). Post-1967, driving on the right was not just expected; it was physically facilitated.
  *Does this disqualify it as a convention?* For Lewis, a convention is a behavioral regularity sustained by expectations. If the physical environment makes deviation physically impossible (e.g., a concrete median), it is a constraint, not a convention. However, traffic rules are rarely physically absolute. You *can* drive the wrong way on a one-way street; you *can* turn left where signs forbid it. The hardware raises the cost of deviation, but the expectation remains the primary enforcement mechanism.
  *The Worry:* If the regularity is built into the hardware, does the Lewisian explanation become redundant? In Britain and Japan, the hardware supports $L$. If they switched tomorrow, the hardware would fight them. This suggests conventions can "harden" into socio-technical systems. Lewis's theory is purely behavioral; it misses the **scaffolding** that stabilizes the behavior. *Dagen H* shows that to change a convention, you often must change the material sediment. Lewis explains why we don't deviate; he doesn't explain that we built the road to stop us from deviating. The post-change regularity is still a convention (drivers *choose* to stay right), but it is a convention buttressed by constraint.

  ### 3. The Verdict

  **Confirmation, Anomaly, or Out-of-Scope?**
  *Dagen H* is a **confirmation of the equilibrium state** but an **anomaly for the evolutionary story**.
  1.  **Confirmation:** Once the switch occurred, the Lewisian conditions were perfectly met. Regularity, expectation, preference for conformity, and common knowledge were established. The drop in accidents (initially) and the return to baseline (as behavior normalized) fits the model of a new coordination equilibrium settling in.
  2.  **Anomaly:** The broader evolutionary story often told alongside Lewisian conventions is one of bottom-up emergence, precedent, and gradual drift. *Dagen H* was a discrete, top-down, centrally planned shock. It demonstrates that conventions can be **engineered** if an authority can manufacture common knowledge and leverage a meta-convention of obedience. Lewis emphasizes precedent; *Dagen H* emphasizes **fiat backed by synchronization**.

  **The Referendum and Preferences**
  The 1955 referendum result is decisive evidence for Lewis's claim that convention is self-referential. The 83% did not vote for Left because they loved the left side of the road; they voted for Left because they expected others to drive on the Left. When the state successfully altered the expectation (via the 1963 legislation and 1967 campaign), the behavior flipped despite the earlier vote. This confirms that the "reason for conforming" is the expectation of others' conformity, not an intrinsic valuation of the regularity.

  **What the Theory Cannot Model**
  Lewis's framework cannot model the **cost of the transition**. It treats the move from Equilibrium A to Equilibrium B as a black box. It has no variables for the 350,000 replaced signs, the scrapped tram systems, or the cognitive load of the public information campaign. It treats these as external to the definition of convention. But *Dagen H* shows that these material and informational costs are the *barrier* that defines the convention's stability.
  Furthermore, Lewis's account struggles with the **hierarchy of conventions**. It cannot easily distinguish between the convention of "driving on the right" and the convention of "obeying the Riksdag." In *Dagen H*, the latter caused the former. A complete theory of social norms needs to account for how meta-norms (obedience, trust in institutions) allow specific norms to be swapped out without collapsing the system.

  **Conclusion**
  *Dagen H* confirms Lewis's definition of what a convention *is* (a self-sustaining equilibrium of expectations) but challenges the implicit narrative of how conventions *persist and change*. It shows that a convention is not merely a behavioral regularity but a **socio-technical lock-in** that can only be broken by a synchronized shock that resets common knowledge. Lewis provides the logic of the lock; *Dagen H* provides the mechanics of the key. The episode suggests that while conventions are arbitrary in principle, they are path-dependent in practice, and escaping that path dependence requires more than salience—it requires the authoritative manufacture of common knowledge.
