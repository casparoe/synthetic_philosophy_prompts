      *   *Argument 2: Dynamic Epistemic Logic (DEL).* The knowledge state on Thursday is different from Monday. The induction assumes static knowledge. An ideal reasoner models knowledge update. If they do, the induction fails *for them too*. This is the strongest technical rebuttal.
      *   *Argument 3: The "Blindspot" Argument.* The announcement is a "Moorean Blindspot." It is true but cannot be known. The student's error isn't assuming they are ideal; it's assuming the announcement is *knowable*.

  9.  **Refining the Falsifiability Point:**
      *   It's not empirically falsifiable (no ideal reasoners).
      *   It *is* logically falsifiable (if the deduction is shown to be invalid in S5 epistemic logic, for instance).
      *   Risk: It makes the paradox a "ghost" that only haunts impossible beings.

