  4.  **Synthesizing and Ranking Tensions:**

      *   **Critical Contradiction:** (1) vs. (4). (1) asserts realism based on current success/IBE. (4) asserts current success is insufficient and requires historical survival. Since fundamental physics entities (electrons, spacetime) are part of the *current* paradigm, they haven't "survived" the *next* reconstruction. If (4) means "survived 2 *past* changes," electrons might qualify (Corpuscle $\to$ Classical Particle $\to$ QFT Excitation). But Spacetime Curvature is specific to GR. It hasn't survived 2 changes. It *is* the change. So (1) claims realism about spacetime curvature, (4) likely denies it.
      *   **Motivational Friction:** (1) vs. (5). IBE often leads to Structural Realism when facing theory change. Rejecting SR while demanding Persistence (4) creates a "Goldilocks" problem: Entities must be robust (4) but specific (5).
