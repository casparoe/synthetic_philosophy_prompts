      *   **Tension E: Anti-Structural Realism (5) vs. Revolution-Sensitive Persistence (4).**
          *   (5) says we need entity-level commitment.
          *   (4) says entities must persist across theory change.
          *   *Standard Objection:* Usually, when theories change, *structures* persist, but *entity descriptions* change (e.g., ether $\to$ field, or classical electron $\to$ quantum field).
