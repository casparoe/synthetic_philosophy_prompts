prompt: |-
  I am preparing my philosophical profile for a meta-science seminar and want an internal consistency audit before presenting. My commitments are these: (1) I am a scientific realist about the entities of fundamental physics—electrons, quantum fields, spacetime curvature—on the grounds that inference to the best explanation licenses realism when applied to mature, predictively successful theories. (2) I accept a restricted form of the pessimistic meta-induction: in any domain that has undergone at least two major theoretical revolutions, entities characteristic of superseded theories should be treated instrumentally rather than realistically. (3) I hold a hybrid position on biological ontology: I am an anti-realist about species (treating them as pragmatic constructs), but I am a realist about genes, on the grounds that the gene concept has retained a stable causal-functional profile across Mendelian, molecular, and post-genomic reconstructions. (4) I maintain that predictive success is insufficient for realism by itself; an entity must also satisfy what I call "revolution-sensitive persistence"—it must survive at least two successive theoretical reconstructions with its core explanatory role intact. (5) I reject structural realism as a general solution, because I think genuine scientific explanation requires entity-level commitment rather than mere structural preservation across theory change.

  Please audit this package. Identify which pairs of commitments are genuinely in tension (not merely apparently so), which conflicts dissolve on closer inspection, and rank the real tensions by severity. For each genuine tension, specify what the cheapest revision would be and which single change—giving up (1), (2), or (4)—would do the most work in restoring coherence. In particular, examine whether my biological hybrid in (3) survives intact given (4), and whether my endorsement of IBE in (1) is compatible with the extra condition I impose in (4). Do not treat all conflicts as equally serious; discriminate sharply between structural contradictions and mere motivational friction. Deliver a point-by-point assessment with specific comments that justify an overall grade for the coherence of the package.
reasoning: |-
  Here's a thinking process that leads to the audit:

  1.  **Deconstruct the User's Philosophical Profile:**

      *   **Commitment (1) Scientific Realism (Fundamental Physics):** Realist about electrons, fields, spacetime. Justification: Inference to the Best Explanation (IBE) applied to mature, predictively successful theories.
