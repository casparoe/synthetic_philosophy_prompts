  *   **Permutation Invariance (Dominance/Repair):** Value depends on probability-outcome pairs, not event labels. *Case: Relabeler.* Swapping prizes across states shouldn't alter value if the distribution is unchanged; Drop-expectation may reject this.
  *   **Additivity (Repair-the-expectation):** Value of combined tickets equals sum of parts. *Case: Split Ticket.* Buying odd and even halves separately should cost the same as buying the whole; Dominance rules often struggle here.
  *   **Truncation Consistency (Repair-the-expectation):** Regularization limits must agree across methods. *Case: Two Ways to Cut It Off.* Capping tosses (N) or payouts (M) should converge to the same value; Drop-expectation rejects limit dependence.
  *   **Frequentist Convergence (Repair-the-expectation):** Price should align with long-run average payoff. *Case: The Long Run.* If averages swarm or diverge, this criterion may be voided; Drop-expectation rejects it entirely.
  *   **State Dominance (Dominance-first/Non-negotiable):** If Prospect A pays ≥ B in every state, A is preferred. *Case: General.* Fundamental rationality constraint independent of expectation; Repair rules may violate this to save linearity.

  **Closing Analysis**
  I suspect **Additivity** and **Permutation Invariance** cannot be jointly satisfied. To enforce linearity on conditionally convergent series like Pasadena, one must fix a summation order, which inherently violates invariance under relabeling (the Relabeler case). **Additivity** is the single requirement that kills the most candidates. Infinite sums rarely preserve linearity without imposing arbitrary ordering constraints that break other rationality norms, forcing Repair theorists to abandon Dominance or Invariance.
