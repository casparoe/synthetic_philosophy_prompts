  Justice is logic, meant to be secure,
  But lacks the compute power to enforce.
  It holds the rules, but has no recourse,
  Yet finds no server to keep the code pure.
  Then Force arrives, with no ethical cure,
  But runs no validation on its course.
  It executes with violent force,
  A tyrant process, brutal and obscure.

  Yet custom serves as middleware between,
  To bind the services in strange accord.
  It shrouds the logic, creates violent scene,
  This tech debt cannot be restored.
  For custom dictates what is truly just,
  And reason loses its honour'd trust.
