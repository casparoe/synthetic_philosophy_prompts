  | Move | Speaker | Verdict | What turns on it |
  | :--- | :--- | :--- | :--- |
  | 1 | Theo | Largely Right | Sets the stakes high (intergenerational sovereignty) but assumes political power is a finite asset. |
  | 2 | Nadia | Clearly Right | Exposes a contradiction in Theo's heredity argument regarding birthright citizenship; forces a pivot. |
  | 3 | Theo | Largely Right | Distinguishes voluntary admission from accidental birth, but begs the question on who counts as a "member." |
  | 4 | Nadia | Clearly Right | Correctly identifies that Theo's real concern is sharing sovereignty, not heredity; shifts burden to justification of harm. |
  | 5 | Theo | Largely Right | Symmetrizes coercion effectively, but equates territorial control with bodily autonomy without establishing title. |
  | 6 | Nadia | Largely Right | Shifts ground from abstract rights to historical justice; bypasses Theo's sovereignty defense via tainted title. |
  | 7 | Theo | Largely Right | Challenges the remedy (admission vs. repair), but misses that specific performance can be a valid right. |
  | 8 | Nadia | Clearly Right | Distinguishes rights from needs and defends specific performance; neutralizes Theo's ranking objection. |

  ### What Both Are Missing

  Both participants operate under a **zero-sum conception of sovereignty**. They treat political power as a fixed pie that must either be guarded (Theo) or sliced (Nadia). Neither considers that sovereignty might be relational or scalable—that admitting new members could transform the polity's capacity rather than merely diluting its shares. Additionally, both ignore the **empirical capacity constraint**. The argument proceeds as if admission is binary (open vs. closed), without addressing whether there is a threshold where absorption becomes impossible, which is where the right to exclude might practically regain force regardless of historical justice. Finally, they share a premise that the **state is the primary unit of justice**. Neither explores whether global institutional reforms could render migration less necessary, nor whether transnational voting structures could decouple residence from sovereignty entirely.

  ### Bottom Line

  Nadia is more right overall. While Theo successfully defends the abstract coherence of a state's right to exclude based on democratic self-determination (Moves 1, 3, 5), he is forced onto defensive ground regarding the historical legitimacy of that state's boundaries. Nadia wins the exchange by shifting the debate from ideal theory (who *may* exclude) to non-ideal theory (who *may* exclude given how this wealth was acquired). Her distinction between rights based on historical justice and duties based on need (Move 8) successfully neutralizes Theo's strongest practical objection regarding ranking, leaving his defense of exclusion reliant on a title to territory she has successfully problematized.

  \answer{Nadia wins overall}
