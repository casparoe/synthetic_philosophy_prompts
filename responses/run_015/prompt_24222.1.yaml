  3.  **(1) vs (4): Severity Critical.** Without value specifications (1), a step-level measure (4) cannot distinguish intended effects from side effects. Moving a pawn to win looks identical to knocking over the board. You penalize the goal.
      *   *Cheapest Revision:* Drop (1). Specify instrumental values.
      *   *Cost:* Defeats the core ambition of avoiding value specification.

  **Single Revision:** Drop **(2)**.

  The "inaction baseline" is the load-bearing failure. It creates the counterfactual objectivity problem (vs 3) and the paralysis problem (vs 4). Modern impact measures (e.g., Attainable Utility Preservation) compare the current policy against a *null policy* over a horizon, not step-wise inaction. This preserves (1) by measuring power/optionality rather than state distance, accommodates (4) by allowing planned trajectories, and sidesteps (3) by accepting model-relative attainability.

  *Cost:* You lose the intuitive simplicity of "did you change anything?" But "change" alone is not "harm." Dropping (2) allows you to define impact as loss of future optionality rather than state deviation, which aligns better with (5) and avoids penalizing necessary instrumental actions. It resolves the counterfactual knot by replacing "what would have happened" with "what could happen under a default policy."
