  1.  **(2) vs (3): Severity High.** Counterfactuals are model-dependent. Like reference frames in relativity, there is no objective "world if the agent did nothing." Computing this requires a causal model. If you use the agent's, you violate (3). If you use an external "true" model, it is epistemically inaccessible.
      *   *Cheapest Revision:* Drop (3). Accept impact is model-relative.
