  2.  **(2) vs (4): Severity High.** Step-level penalties relative to inaction accumulate. Every deviation is charged, inducing paralysis or "offsetting" (undoing useful work to minimize deviation).
      *   *Cheapest Revision:* Drop (4). Penalize trajectory-wise deviation.
