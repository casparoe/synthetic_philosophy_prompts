prompt: |-
  You have just been appointed the inaugural director of the Cantor-Finitist Dialogue Center, a new interdisciplinary institute whose charter explicitly pairs Cantorian mathematics with strict finitist philosophy of mathematics under one research roof. Tomorrow you are delivering the opening remarks at the center’s dedication ceremony; the audience is split between family members and donors who funded the building, philosophy-of-mathematics faculty who will parse every logical commitment, and graduate students in logic who know Hilbert’s hotel well enough to spot a sloppy analogy. You need a brief address—no more than about six hundred words—that does real structural work with the idea of actual versus potential infinity: specifically, you must use Hilbert’s hotel as the governing metaphor for the center’s capacity to take on new research problems, but you must do so in a way that is genuinely hospitable to both Cantorians (for whom the hotel has actually infinitely many rooms) and finitists (for whom it only has the potential to keep adding rooms without ever completing an infinite totality). The speech should welcome everyone without pretending the disagreement is settled, should comfort the non-experts with a concrete image, and should avoid saying anything the finitists in the room would regard as a false commitment to completed actual infinities—while also not insulting the Cantorians by treating their view as mere heuristic.

  Because the occasion is ceremonial, the tone should be warm and forward-looking, but the philosophical framing should shape what you can and cannot claim about the center’s “boundless” mission. You may assume familiarity with Cantor’s diagonal argument and with finitist objections to treating infinite collections as completed objects, but do not cite specific texts, ask for a bibliography, or invoke scholars by name in a way that requires verification. After writing the speech, provide a brief structured summary in JSON format with the following fields: "governing_metaphor" (string), "cantorian_reading" (string), "finitist_reading" (string), "audience_bridge" (string), and "constraint_avoided" (string describing the false commitment the speech steers clear of).
