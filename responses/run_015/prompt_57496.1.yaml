answer: |-
  **To:** Grants Panel
  **From:** Chair
  **Re:** Application #114 Voting Protocol and Decision

  Colleagues,

  Regarding Application #114, we have encountered a structural inconsistency in our voting process. Dan is correct that this has a name—the Discursive Dilemma—where majority opinion on individual premises (the criteria) conflicts with majority opinion on the conclusion (the vote). We cannot resolve this by intuition alone. We must adhere to the foundation's mandate.

  **Decision on Application #114**
  We will **fund** this application.

  Our guidelines instruct reviewers to weigh three specific criteria: design, worth, and feasibility. They do not authorize extraneous vetoes. On all three mandated criteria, a majority of the panel (5/7) affirmed the application. The four negative funding votes rely on factors outside our guidelines: one reviewer judged past work rather than current design; another invoked portfolio balance not codified in our criteria; two others held minority views on specific criteria. To reject a proposal that satisfies the majority on all stated merit criteria would undermine the integrity of our guidelines. We must vote based on the rules we published, not unpublished constraints.

  **Protocol for Remainder of Cycle**
  Effective immediately, we adopt a **premise-based procedure**. A recommendation to fund requires a majority "Yes" on all three criteria (Design, Worth, Feasibility). If a majority affirms all three, the funding recommendation is automatically "Yes." Individual funding votes will be recorded for the record, but they will not override the criteria aggregation. This removes ambiguity and ensures our decisions are mechanically reproducible.

  **Addressing the Counter-Argument**
  Marcus will argue that the funding vote is sovereign and the criteria are merely advisory. This is incorrect. If the criteria were advisory, our guidelines would be decorative. A vote cast against the majority view of the criteria, without justification grounded in the guidelines, is procedurally invalid. We are not aggregating raw preferences; we are aggregating judgments against a standard. If the standard is met by majority consensus, the outcome follows. To allow a minority on the criteria to veto a majority on the merits is to replace evaluation with obstruction.

  **Portfolio Balance (Ruth's Point)**
  Ruth raised a valid concern regarding portfolio concentration. However, portfolio balance is a **structural constraint**, not an evaluative criterion. It is a reason to amend the guidelines or adjust our scheduling (e.g., setting field-specific caps before review begins), but it is not a valid reason to reject a meritorious application retroactively. Punishing an applicant for our failure to set explicit caps beforehand is unjust. Moving forward, I will propose guideline amendments to incorporate portfolio limits explicitly. Until then, merit governs.

  **Feedback Letter**
  Since we are funding, the letter is straightforward: *"We are pleased to inform you that your project has been selected for funding. The panel found your research design sound, the question significant, and the budget feasible."* We do not need to explain the vote count.

  For future rejections where criteria are met but portfolio caps apply (once established), the letter will read: *"While the panel rated your proposal highly on all merit criteria, we are unable to fund due to portfolio distribution limits outlined in our guidelines."* This separates merit from capacity.

  **Next Steps**
  I know four of you voted against funding. I am asking you to accept this decision not because I am overruling you, but because the guidelines compelled this outcome. Your concerns regarding portfolio balance and past performance are noted and will be addressed in our guideline revision working group next month. For this cycle, we follow the text we have.

  Please review Application #115 using the new premise-based protocol.

  Thank you,

  [Chair Name]
