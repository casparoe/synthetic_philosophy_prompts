answer: |-
  I recommend approval-with-conditions, adopting a 35-hour mandated workweek with a twelve-month phase-in and a regulated voluntary overtime protocol to reconcile structural rest guarantees with operational continuity and vocational autonomy.

  The petitioners' framing of leisure as a distributive right necessitates moving beyond decorative wellness policies toward enforceable structural limits. Without a cap on mandated hours, the institution implicitly claims ownership over staff time beyond the contractual norm, validating the concern that current burnout patterns mirror karoshi risks observed in partner campuses. However, a rigid prohibition on all work exceeding 35 hours inadvertently treats labor purely as a cost center and negates the opposing brief's valid assertion that vocation involves voluntary self-donation. To honor the vocational objection without sacrificing the right to rest, the policy must distinguish between institutional demand and individual agency: departments are prohibited from scheduling more than 35 hours, but staff may voluntarily exceed this limit provided the excess hours trigger a significant overhead penalty charged to the department's budget rather than the employee. This mechanism discourages systemic reliance on overwork while preserving the employee's liberty to pursue work as a calling.

  Regarding the operational constraint of 24-hour coverage for labs and libraries, immediate enforcement would disrupt critical services given current budgetary limitations. Therefore, implementation will follow a staggered timeline:

  *   **Months 1–3 (Audit Phase):** HR and department heads will conduct a workload audit to identify roles requiring coverage beyond 35 hours per incumbent.
  *   **Months 4–9 (Restructuring Phase):** Departments must submit redistribution plans to cover excess hours through shift restructuring or temporary budget reallocations; during this window, scheduled overtime is permitted but must be compensated at 1.5x pay without penalty.
  *   **Month 12 (Full Enforcement):** The 35-hour mandated ceiling and institutional overtime penalties become active. Any department failing to comply without a granted hardship exemption will face administrative review.

  This approach secures the right to leisure by forbidding compulsory overwork, respects vocational flourishing by permitting voluntary extra effort, and provides a realistic pathway to resolve coverage gaps without immediate unfunded mandates.
