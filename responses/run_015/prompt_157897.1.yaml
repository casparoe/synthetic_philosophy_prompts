answer: |-
  # Activity Design: The Impact Allocation Simulation

  ## 1. Overview & Learning Goals
  *   **Time:** 90 Minutes
  *   **Participants:** 16 Undergraduates (4 Teams of 4)
  *   **Format:** Hidden-rule simulation with resource asymmetry.
  *   **Goal:** Participants experience the failure modes of mechanical ITN scoring without being told the theory first.
  *   **Forbidden Words (Until Debrief):** Crowding out, fungibility, complementarity, threshold, counterfactual, marginal.

  ## 2. Materials & Setup

  **Room Setup:**
  *   4 Tables spaced apart (Team Stations).
  *   1 Facilitator Table (Hidden from view).
  *   Projector/Whiteboard (For displaying Cause Cards and Results only).

  **Tokens:**
  *   **Blue Chips (Funding):** 20 total.
  *   **Red Chips (Labor):** 20 total.
  *   **Impact Points (Paper Slips):** For scoring.
  *   **Prize:** A bag of high-quality chocolate or a "Cause Selection Champion" certificate.

  **Team Endowments (Resource Asymmetry):**
  *   **Team 1 & 2 (The Donors):** 8 Blue Chips, 2 Red Chips each.
  *   **Team 3 & 4 (The Volunteers):** 2 Blue Chips, 8 Red Chips each.
  *   *Instruction:* "These are your resources. You cannot create more. You can trade them with other teams during the Trading Phase, but not during Bidding."

  **Cause Cards (5 Total):**
  *Display these on the wall or hand out as packets. Do not include payoff rules.*

  1.  **Direct Relief (Cause A):** "Provides immediate aid. Currently supported by only two large organizations. High urgency."
  2.  **Policy Reform (Cause B):** "Changes long-term laws. Requires sustained grassroots effort. High importance."
  3.  **Theoretical Research (Cause C):** "Foundational safety work. Highly neglected. Requires specialized analysis."
  4.  **Engineering Implementation (Cause D):** "Builds safety tools. Highly neglected. Requires technical build."
  5.  **Exotic Energy (Cause E):** "Revolutionary power source. Almost no one is working on it. Extremely high importance if solved."

  ## 3. Rules & Hidden Payoff Mechanics (Facilitator Eyes Only)

  **Do not share this section with students.** This is your lookup table for calculating scores.

  *   **Cause A (Direct Relief) — The Displacement Trap:**
      *   *Requirement:* Blue Chips only.
      *   *Mechanic:* **Fixed Pool.** Total Impact Pool = 30 Points.
      *   *Rule:* If Total Blue Invested ≤ 10: Points are distributed proportionally to contribution.
      *   *Rule:* If Total Blue Invested > 10: The Pool shrinks to 30 Points total. Excess chips yield **zero**. (Simulates saturation/crowding despite low org count).
  *   **Cause B (Policy Reform) — The Threshold:**
      *   *Requirement:* Red Chips only.
      *   *Mechanic:* **All-or-Nothing.**
      *   *Rule:* If Total Red Invested < 12: Impact = 0.
      *   *Rule:* If Total Red Invested ≥ 12: Impact = 50 Points (distributed proportionally).
  *   **Cause C & D (Research/Eng) — The Complements:**
      *   *Requirement:* C needs Blue; D needs Red.
      *   *Mechanic:* **Interdependency.**
      *   *Rule:* Cause C pays 20 Points **ONLY IF** Cause D receives ≥ 5 Red Chips.
      *   *Rule:* Cause D pays 20 Points **ONLY IF** Cause C receives ≥ 5 Blue Chips.
      *   *If either condition fails:* Both pay 0.
  *   **Cause E (Exotic Energy) — The Lemon:**
      *   *Requirement:* Any Chips.
      *   *Mechanic:* **Bad Reason for Neglect.**
      *   *Rule:* Impact = 0, regardless of investment. (Simulates a cause neglected because it is impossible/scam, not because it is overlooked).

  ## 4. Minute-by-Minute Timeline

  **0:00 – 0:10: Setup & Endowment**
  *   Divide into 4 teams.
  *   Distribute Chip Envelopes (Donors vs. Volunteers).
  *   **Script:** "You are impact investors. Your goal is to maximize total Impact Points for your team. You have 2 rounds to allocate resources. You may trade resources between rounds. Do not share your private strategy, but you may discuss public cause information."

  **0:10 – 0:25: Round 1 Bidding**
  *   Teams review Cause Cards.
  *   Teams secretly decide how many Blue/Red chips to allocate to each cause.
  *   Collect bids. (Tell them: "Submit your allocation sheet. Keep your remaining chips.")

  **0:25 – 0:35: Facilitator Calculation & Filler**
  *   *Facilitator:* Calculate Round 1 scores using the Hidden Table.
  *   *Students:* While waiting, they must write down a "Theory of Change" for why they picked their top cause. (Prevents boredom, primes debrief).

  **0:35 – 0:45: Round 1 Results & Trading**
  *   Announce **only** the Total Impact Points generated per Cause and each Team's Score. **Do not explain why.**
  *   *Example:* "Cause A generated 30 points. Team 1 earned 15 points."
  *   **Trading Phase (10 mins):** Teams can negotiate and swap Blue/Red chips. (This allows Donors to buy Labor for Cause B/D, etc.).

  **0:45 – 0:60: Round 2 Bidding**
  *   Teams allocate all remaining (and traded) chips.
  *   Collect bids.

  **0:60 – 0:70: Final Calculation & Winner**
  *   Calculate Round 2 scores.
  *   Announce Winner. Distribute trivial prize.

  **0:70 – 0:90: The Debrief (Critical)**
  *   Reveal the Hidden Rules (Project the Payoff Mechanics).
  *   Walk through the Three Collisions (see below).

  ## 5. Debrief Guide: Mapping Moments to Theory

  **Transition:** "You played the game. Now let's look at the code behind the simulation. Here is how the points were actually calculated." (Reveal Hidden Mechanics).

  ### Collision 1: Neglectedness is Counterfactual (Cause A)
  *   **The Moment:** Look at Cause A (Direct Relief). The card said "Only two organizations work here."
  *   **The Trap:** Many teams likely rated this as "Highly Neglected" and invested heavily.
  *   **The Reveal:** If the Donor Teams (1 & 2) both invested heavily, the cap (10 Blue) was hit.
  *   **The Lesson:** "Neglectedness" isn't a headcount of organizations. It's about the **counterfactual**: What happens to the impact if *you* don't show up? If the funding pool was full without you, your contribution displaced someone else's. You were crowded out financially, even if the field looked empty organizationally.
  *   **Key Question:** "How many of you invested in A because the card said 'only two orgs'? Did you check if those two orgs were billionaires?"

  ### Collision 2: Non-Separability (Causes B, C, D)
  *   **The Moment:** Look at Cause B (Policy) or C/D (Research/Eng).
  *   **The Trap:** In Round 1, teams likely scored these individually. Cause B might have looked "Hard" (low tractability) because no single team had 12 Red chips. C and D looked risky.
  *   **The Reveal:**
      *   **Threshold (Cause B):** Impact wasn't linear. 11 chips = 0 value. 12 chips = 50 value. Mechanical scoring (1-5 scale) assumes linear returns. It fails here.
      *   **Complements (C & D):** If Team 1 funded C but no one funded D, Team 1's money was wasted. The value of C depended entirely on the existence of D.
  *   **The Lesson:** Multiplying I × T × N assumes causes are separable buckets. They aren't. Some causes are switches (thresholds); some are lock-and-key (complements). You cannot evaluate them in isolation.

  ### Collision 3: Ambiguous Signal of Neglect (Cause E)
  *   **The Moment:** Look at Cause E (Exotic Energy).
  *   **The Trap:** It had the highest "Neglectedness" score (0 investors in Round 1). It likely looked like the biggest opportunity.
  *   **The Reveal:** It paid 0 points.
  *   **The Lesson:** Neglect is data, but it is ambiguous evidence.
      *   **Scenario A:** People aren't working on it because they haven't noticed (Opportunity).
      *   **Scenario B:** People aren't working on it because they looked and found it impossible/scam (Bad Reason).
  *   **What would have to be true?** For neglect to be a reason to move in, you need evidence that the *reason* for neglect is ignorance, not impossibility. You need to know *why* the baseline is empty.

  ## 6. Predictable Failure Modes & Mitigation

  | Failure Mode | Prediction | Mitigation |
  | :--- | :--- | :--- |
  | **Silence/No Trading** | Students may be shy about trading chips between rounds. | **Facilitator Prompt:** During the trading phase, announce: "Team 1 has excess Blue; Team 3 has excess Red. Cause D needs Red. Cause C needs Blue. Talk to each other." |
  | **Confusion on Rules** | Students might ask "Can we split chips?" during bidding. | **Script:** "Yes, you can split your chips across multiple causes. But once submitted, they are gone." |
  | **Cynicism** | "It's just a random game." | **Debrief:** Acknowledge the simplification. "The rules were arbitrary, but the *structure* of the information asymmetry is exactly what you face in the real world. You had the ITN card, but not the payoff function." |
  | **Time Overrun** | Calculation takes too long. | **Prep:** Pre-calculate the logic in your head or have a spreadsheet open on a laptop facing away from students. Keep Round 1 calculation under 5 mins. |

  ## 7. Honest Assessment of Limitations

  As the facilitator, you must be frank about what the simulation *cannot* do:

  1.  **Artificial Thresholds:** In the game, the threshold (Cause B) was a hard cliff (0 vs 50). In reality, thresholds are usually soft curves (diminishing returns then increasing). You must supply this nuance in discussion so they don't think all causes are binary.
  2.  **Perfect Information in Debrief:** In the game, they learn the rules perfectly at the end. In reality, we never get to see the "Hidden Table." Emphasize that the skill is **investigating the hidden rules** (talking to experts, looking for data) rather than waiting for a reveal.
  3.  **The "Bad Reason" Cause:** Cause E was a pure lemon (0 payoff). In reality, "neglected for bad reason" causes often have *some* small value, just not enough to justify the cost. The simulation exaggerates this for clarity.
  4.  **Resource Fungibility:** The game hard-coded Blue vs. Red. In reality, money can often buy labor, but with friction. You need to mention that while the game separated them rigidly, the real world allows conversion (hiring), but at a cost (efficiency loss).

  ## 8. Facilitator Cheat Sheet (The "Why" for You)

  *   **If they ask during the game:** "Why did Cause A score low despite high investment?" -> **Answer:** "That's part of the simulation. Check your theory of change." (Do not explain displacement).
  *   **If they ask:** "Can we pool our chips?" -> **Answer:** "You can trade in the Trading Phase. During bidding, you submit individually."
  *   **If Cause C/D fails:** Highlight this heavily in debrief. "One team did the research, but no one built the tool. The research value was zero. This is the coordination problem."
  *   **If Cause E gets no bids:** "Interesting. You ignored the most neglected cause. Why?" (Leads to discussion on skepticism).
  *   **If Cause E gets all bids:** "Interesting. You all fell for the neglect signal. Why did you trust the neglect?" (Leads to discussion on ambiguous evidence).

  This design forces them to feel the frustration of mechanical scoring failing against hidden structural realities, making the subsequent theoretical explanation stick much harder than a lecture would.
