          *   Teams 1 & 2: 10 Blue, 2 Red.
          *   Teams 3 & 4: 2 Blue, 10 Red.
      *   *Causes:*
          *   **Cause Alpha (The Crowded Well):** Needs Blue. Payoff pool is fixed (e.g., 20 points). Split among contributors based on share. If too many Blue tokens poured in, value per token drops drastically. *Correction:* To show counterfactual neglect, the rule should be: Impact is determined by the *marginal* contribution. If the cause is "saturated," your tokens do nothing. Let's make it: Total Blue Capacity = 10. Any Blue token beyond 10 yields 0.
          *   **Cause Beta (The Threshold):** Needs Red. Needs 12 Red tokens to unlock 40 points. Below 12 = 0.
          *   **Cause Gamma (The Lock):** Needs Blue. Only works if Cause Delta is funded.
          *   **Cause Delta (The Key):** Needs Red. Only works if Cause Gamma is funded.
