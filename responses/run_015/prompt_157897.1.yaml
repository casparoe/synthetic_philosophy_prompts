  6.  **Timeline Construction (90 Minutes):**
      *   0-10: Setup & Groups.
      *   10-20: Round 1 (Blind Bidding).
      *   20-30: Reveal Round 1 Outcomes (Scores only, not rules).
      *   30-45: Round 2 (Trading/Re-allocation allowed?). *Decision:* Let's allow one round of trading or re-bidding to let them test hypotheses. Or just one big round and then debrief. Two rounds is better for learning. Let's do two rounds of allocation.
      *   45-60: Round 2 Bidding.
      *   60-75: Final Reveal & Scoring.
      *   75-90: Debrief.

      *Wait, 90 minutes is tight.* 16 students. 4 groups.
      *   Intro (5)
      *   Distribution of Assets (5)
      *   Review Cause Cards (10)
      *   Allocation Phase 1 (15)
      *   Facilitator Calculation (5) - *Filler activity needed here.*
      *   Results Phase 1 (10)
      *   Allocation Phase 2 (15)
      *   Final Results (5)
      *   Debrief (25)
      *   Total: 90.

  7.  **Addressing the "Forbidden Words" Constraint:**
      *   I must ensure the Cause Cards and Facilitator Script do not use "threshold," "complementarity," "fungibility," "crowding out."
      *   Use descriptive language: "Minimum effort required," "Works best alongside," "Limited capacity," "Ineffective."

  8.  **Addressing the "Resource Asymmetry":**
      *   Teams 1 & 2: "Donors" (Mostly Funding Tokens).
      *   Teams 3 & 4: "Volunteers" (Mostly Labor Tokens).
      *   This creates a market where Donors need Volunteers for labor-heavy causes and vice versa. This naturally creates the "Neglected for dollars, crowded for person-years" dynamic if a cause requires both but one is abundant.

  9.  **Developing the Debrief:**
      *   Must map specific game moments to the three theoretical points.
      *   Must explain the "Ambiguous Signal" (Cause Epsilon).
      *   Must admit limitations (what was artificial).

  10. **Predicting Failure Modes:**
      *   *Chaos:* Students talk across groups. *Fix:* Enforce silence during bidding.
      *   *Confusion:* Rules too complex. *Fix:* Keep payoff table simple for facilitators.
      *   *Cynicism:* "It's just a game." *Fix:* Emphasize the parallel to real-world info asymmetry.
      *   *One Team Dominates:* Ensure the mechanics require cooperation (Complements) so no single team can win alone.

  11. **Refining the Payoff Mechanics for the Facilitator:**
      *   I need a clear lookup table for the facilitator to calculate scores quickly.
      *   *Cause A (Food):* Cap = 10 Funding Tokens. Impact = 30 points. Split proportionally among contributors up to cap. Excess tokens = 0.
      *   *Cause B (Policy):* Threshold = 12 Labor Tokens. Impact = 40 points. If <12, Impact = 0. If >=12, split proportionally.
      *   *Cause C (Theory):* Requires Cause D funded (>=5 Labor). Impact = 20 points (split among Funding contributors).
      *   *Cause D (Eng):* Requires Cause C funded (>=5 Funding). Impact = 20 points (split among Labor contributors).
      *   *Cause E (Fusion):* Impact = 0.

      *Wait, I need to make sure the "Neglectedness" point lands.*
      *   Cause E will look neglected (0 tokens).
      *   Cause A might look crowded (many tokens) or neglected (few tokens) depending on how they play.
      *   To ensure Point 1 (Counterfactuals): I need to highlight that even if *few* teams work on A, if they are rich, they fill the cap.
