  13. **Writing the Output:** Structure clearly with headers. Ensure tone is practical and facilitator-focused. (Self-Correction: Make sure the "Labor vs Money" mechanic is clear on the cards).

      *   *Correction on Complements:* If C needs D and D needs C, and they are separate bids, they might fail to coordinate. This is good—it simulates the coordination problem.
      *   *Correction on Threshold:* Make sure the threshold is reachable only if Labor teams cooperate.
