  5.  **Refining the "Neglectedness is Ambiguous" Point:**
      *   Cause Epsilon needs to look neglected. In the simulation, "neglected" means no one put tokens in. Why? Because it pays 0. But they won't know that until the end. This works.
      *   To make the "counterfactual" point (Point 1) land: Cause Alpha needs to look neglected (few people working on it) but actually be crowded in terms of *resources*. Or vice versa.
      *   *Idea:* Cause Alpha has a "Hidden Saturation." Even if only 2 teams work on it, if they are Capital Rich, they might saturate it.
      *   *Better for Point 1:* The "Displacement" mechanic needs to be explicit in the debrief. In the game, if Team 1 puts 5 Blue into Alpha, and Team 2 puts 5 Blue into Alpha, and the cap is 8... Team 2's contribution displaced Team 1's potential impact.
