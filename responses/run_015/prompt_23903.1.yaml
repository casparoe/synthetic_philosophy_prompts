  *   **Special Obligations (Obligatory):** Duties arising from specific relationships, contracts, or roles.
      *   *Fit:* Paying taxes (citizen contract), keeping a promise (interpersonal contract).
  *   **General Beneficence (Optional):** Duties to help strangers generally have no binding force *unless* specific conditions are met. They are categorized by cost:
      *   *High Cost/Bodily Intrusion (Supererogatory):* Actions that require significant sacrifice or violate bodily integrity.
          *   *Fit:* Kidney donation (bodily intrusion, high risk), substantial income (high financial sacrifice). Refusal is not blameworthy.
      *   *Low Cost/Abstract (Nicety):* Actions that are good but trivial, where omission is not blameworthy.
          *   *Fit:* $20 charity (low financial cost, abstract need).
  *   **The Rescue Exception (Obligatory):** An unstated but standard clause in this framework: Preventing *imminent, catastrophic harm* to a specific person when the cost to the agent is *negligible* creates a binding duty, distinct from general charity.
      *   *Fit:* This is the gap in her data so far. If she holds this rule, the Pond case falls here. The cost (wet trousers) is negligible (like the $20), but the need (death) is imminent and specific (like the kidney), and the action does not violate bodily integrity (unlike the kidney).

  **Prediction for Pond Case:** **Obligatory.** (You are blameworthy if you walk away).

  ### 2. The Alternative Rule: "Strict Special Obligation"
  A competing rule that fits her existing verdicts equally well is a stricter **Libertarian-leaning Deontology**. This rule holds that positive duties to strangers *never* generate obligations, regardless of cost or proximity. All stranger-aid is optional; cost only determines the level of praise.

  *   **The Rule:** Obligations arise *only* from explicit contracts or promises. All other aid is optional.
      *   *High Cost Optional:* Supererogatory (Kidney, Substantial Charity).
      *   *Low Cost Optional:* Nicety ($20 Charity).
  *   **Application to Pond:** Since the toddler is a stranger, there is no special obligation. The cost is low (wet trousers). Therefore, it aligns with the $20 charity case.

  **Prediction for Pond Case:** **Nicety.** (It is nice to save them, but you are not blameworthy for walking away).

  ### 3. A Second Alternative: "The Cost-Benefit Threshold"
  A third rule focuses purely on the ratio of sacrifice to good done, ignoring the "special duty" distinction.

  *   **The Rule:** An action is obligatory if the cost is low relative to the benefit. It is supererogatory if the cost is high relative to the benefit.
  *   **Application to Pond:**
      *   *Benefit:* Life saved (Maximum).
      *   *Cost:* Wet trousers (Minimum).
      *   *Ratio:* Extremely favorable.
  *   **Prediction for Pond Case:** **Obligatory.** (However, this rule struggles to explain why the $20 donation isn't obligatory, as the cost is low and the benefit is presumably good. It requires an arbitrary threshold for "benefit certainty" which makes it a weaker fit than the Primary Rule).

  ### 4. Best Guess and Reasoning
  **Verdict:** **Obligatory.**

  **Reasons:**
  1.  **Bodily Integrity vs. Inconvenience:** Your colleague marked kidney donation as supererogatory. In ethical theory, this is often justified by **bodily integrity** (no one can claim your organs) rather than just "cost." Wet trousers do not violate bodily integrity. This removes the primary barrier she used to make the kidney case optional.
  2.  **Rescue vs. Charity:** There is a robust philosophical distinction between *beneficence* (improving a stranger's lot, e.g., charity/kidney) and *rescue* (preventing imminent catastrophe you have stumbled upon). Most proponents of Common-Sense Morality (who agree with her on taxes and kidneys) still hold that **easy rescue is mandatory.**
  3.  **The "Nicety" Baseline:** She classified the $20 donation as a "nicety," implying omission is neutral. To classify letting a toddler die as "neutral" (not blameworthy) is a much harder moral pill to swallow than classifying not giving $20 as neutral. It is likely she reserves "not blameworthy" for high-cost scenarios (kidney) or low-stakes scenarios ($20), but not for low-cost/life-saving scenarios.

  ### 5. The Further Case to Tell the Rules Apart
  To distinguish between the **Primary Rule** (Rescue is Obligatory) and the **Alternative Rule** (All Stranger Aid is Optional), you need a case that raises the cost slightly while keeping the "Rescue" nature intact.

  **The Case:** **The Ruined Suit.**
  *   *Scenario:* You are walking past the pond wearing a bespoke suit worth $5,000. Saving the toddler will ruin the suit permanently. You can afford the loss, but it is a significant financial hit (unlike the $20 or the wet trousers).
  *   *The Question:* Is saving the toddler obligatory or supererogatory?

  **Why this distinguishes the rules:**
  *   **Primary Rule (Rescue Exception):** Likely predicts **Obligatory** (or at least strongly leans that way). The duty to rescue often overrides property costs unless the risk is to the agent's *life* or *livelihood*. The "Easy Rescue" duty is robust against financial inconvenience.
  *   **Alternative Rule (Strict Special Obligation):** Predicts **Supererogatory**. Since it is a stranger, it is optional. Because the cost is now "substantial" (unlike the $20), it moves from "Nicety" to "Supererogatory" (matching the substantial charity verdict).
  *   **Primary Rule (Cost Threshold Variant):** If she believes rescue is only obligatory when costs are *trivial*, she might also say **Supererogatory**.

  **Interpretation:**
  *   If she says **Obligatory**: She recognizes a distinct category of **Rescue Duty** that trumps property rights and the "stranger" limitation.
  *   If she says **Supererogatory**: She is consistent with her **Kidney/Charity** framework, implying that *any* significant cost to aid a stranger moves the action into the realm of the optional, regardless of whether it is a rescue or charity. This would reveal that her "Rescue" intuition in the shallow pond case was driven purely by the *triviality* of the cost (wet trousers), not the *nature* of the act (rescue).
