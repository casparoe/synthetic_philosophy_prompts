              *   If you are rational, you only switch back if $EV(A) - 1 > B$.
              *   Given the symmetry, if you were eager to switch A->B, you shouldn't be eager to switch B->A unless new info arrived.
              *   However, if you didn't open B, you are in the "Unopened" state (Case i). Indifferent. Paying €1 makes it negative EV.
