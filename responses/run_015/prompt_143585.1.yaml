  I am working through William James’s Principles of Psychology (1890), specifically the discussion of time perception in which he rejects the idea that consciousness is a chain of discrete, knife-edge instants. In the passage I am struggling with, James describes awareness as a saddle-back upon which we sit, with a fading past and an emerging future; he proposes that the just-past remains alive within present consciousness and that our sense of succession comes from a direct feeling of relation between a waning sensation and a fresh one, rather than from comparing dead snapshots stored in memory. I have been trying to apply a distinction I encountered in discussions of collective memory—between Orwellian revision, in which the past record is genuinely altered and the old version destroyed so that consciousness now contains a rewritten history, and Stalinesque revision, in which a fabricated image is inserted into the narrative while the true past remains intact but concealed—to the color-phi phenomenon. In that perceptual illusion, two differently colored dots presented in rapid succession at separate locations are experienced as a single dot moving through an intermediate position and changing color midway, despite the absence of any physical stimulus at that middle point or with that intermediate hue. Does James’s claim that the past fringe is still alive within the present mean that the intermediate motion and color change are retroactively written into the content of the prior moment’s experience—an Orwellian alteration of what was actually perceived—or does it mean that the present constructs a synthetic bridge that never revises the discrete prior states themselves, functioning instead like a Stalinesque airbrush that overlays them with an interpolated frame? I want to avoid forcing the analogy, so I am asking whether, reading the passage on its own terms, James’s account of the specious present actually commits him to either form of perceptual revision, and if not, precisely where the comparison between historical falsification and perceptual continuity collapses.

  Please conclude with a one-sentence summary beginning Bottom line: ...
