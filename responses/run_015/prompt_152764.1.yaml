          4.  Map misconceptions (genetic determinism, psychological continuity, parents/siblings essentialism) with intervention points.
          5.  Provide one end-of-session check question.
          6.  Specify what to leave out and confirm if this omission should be stated openly.

  2.  **Deconstruct Requirement 1: Dependency Order:**
      *   *Problem:* Origin essentialism is a modal claim (about necessity/possibility). Laypeople often confuse "what makes me me" (identity conditions) with "what properties I have."
      *   *Pre-condition:* Need to distinguish between *qualitative identity* (same properties, e.g., genome) and *numerical identity* (being the *very same* entity). Without this, they'll say "But a clone is the same person."
      *   *Formulation:* Once the thesis is stated ("You couldn't come from different gametes"), the immediate attack is "Why?"
      *   *Defensive Step:* Need to block the "Close Enough" counterexample. If a different sperm/egg produces a genetically identical zygote, is it *you*? The defense must assert that origin is constitutive, not just causal.
      *   *Drafting the Order:*
          1.  Numerical vs. Qualitative Identity (The "This Very" distinction).
          2.  Formulation of the Thesis.
          3.  Defense against the "Genetic Duplicate" objection (The "Intrinsic vs. Extrinsic/Relational" distinction).

  3.  **Deconstruct Requirement 2: The Carrying Example:**
