answer: |-
  ### Teaching Plan: Origin Essentialism (90 Minutes)

  #### I. Dependency Order (15 Minutes)
  **Goal:** Secure the conceptual ground before stating the thesis to prevent immediate category errors.

  1.  **Pre-Condition Distinction: Numerical vs. Qualitative Identity**
      *   **Action:** Before mentioning "origin," establish the difference between being *exactly similar* (qualitative) and being *the very same entity* (numerical).
      *   **Why:** Lawyers and doctors often equate identity with informational continuity (DNA, records). You must secure the intuition that two things can be molecule-for-molecule identical yet be distinct entities (e.g., two minted coins from the same die).
      *   **Securing Move:** Ask: "If a transporter beam creates a perfect copy of you on Mars while you remain on Earth, is the copy *you*?" Use their consensus to lock in that exact similarity does not guarantee numerical identity.

  2.  **Thesis Formulation**
      *   **Action:** State Origin Essentialism: "For any person P, if P exists, P necessarily originated from the specific sperm and egg that actually produced P."

  3.  **Immediate Defensive Step: The "Intrinsic Duplicate" Block**
      *   **Action:** Pre-empt the objection: "But if a different sperm and egg produced someone with my exact DNA and psychology, wouldn't that be me?"
      *   **Defense:** Assert that origin is a **constitutive historical property**, not an intrinsic qualitative one. The "this-ness" of the entity is tied to the *particular matter* of its beginning, not just the *pattern* that matter arranges into.
      *   **Why:** Without this, the audience will immediately reduce the view to genetic determinism (see Misconceptions).

  #### II. The Carrying Example (30 Minutes)
  **Selection:** **Siblings conceived naturally from the same parents but different gametes.**

  **Reasoning:** The "Embryo Split" scenario tests the *sufficiency* of origin (can one origin make two people?), which introduces confusions about individuation and twinning that derail the *necessity* claim (could *I* have come from a different origin?). The Sibling scenario isolates the variable of the gametes while holding lineage constant.

  **Required Features:**
  *   **Include:** A explicit **Genetic Stipulation**. You must instruct the group to imagine the counterfactual sperm and egg *would have produced* the exact same genome as the actual one. This forces them to rely on the *origin of the matter* rather than the *resulting code*.
  *   **Include:** **Temporal Proximity**. The counterfactual conception should be imagined as happening at roughly the same time to rule out "historical era" as the essential factor.
  *   **Exclude:** **Phenotypic Differences**. Do not allow discussion of how the sibling actually looks or acts. This imports environmental determinism.
  *   **Exclude:** **Parental Identity Changes**. Keep the parents fixed. If you change the parents, lawyers will argue about lineage rights; doctors will argue about hereditary disease. Keep the parents constant to isolate the gametes.

  **Facilitation Note:** When presenting the counterfactual ("Imagine you came from the sperm that made your brother"), if a participant says, "But I wouldn't be me because I'd have different DNA," stop them. Remind them of the **Genetic Stipulation**. Push them until they admit, "Even if I had my exact DNA, if it came from *that* cell, I would be a different person." That is the target intuition.

  #### III. The Niche Distinction: Gametes vs. Causal Pathway (20 Minutes)
  **Placement:** Introduce this **immediately after** the Defensive Step (Section I.3) and **before** the Misconception mapping.

  **Reasoning:** Once participants accept that the *specific gametes* are essential, the next logical refinement from a scientific/legal mind is: "Is it the cells themselves, or the specific process they underwent?"
  *   **Gamete Essentialism:** The physical cells are the anchor.
  *   **Pathway Essentialism:** The specific causal history (uterine environment, lab conditions, timing) is the anchor.

  **Instruction:** Present this not as a debate to be solved, but as a boundary marker for the session.
  *   **Say:** "We are focusing on the *material origin* (the gametes). We are bracketing the *process origin* (the environment). If the same sperm/egg were implanted in a different uterus or lab, are you still you? We will assume 'yes' for today to keep the focus on the gametes."
  *   **Why here?** If you do it earlier, it dilutes the main thesis. If you do it later, it feels like a new topic. Placing it here refines the definition of "Origin" before they attack the implications.

  #### IV. Misconception Mapping & Interventions (15 Minutes)
  **Goal:** Head off category errors without stopping the flow.

  | Misconception | Point of Surface | Minimal Intervention |
  | :--- | :--- | :--- |
  | **Genetic Determinism**<br>("It's about the DNA sequence.") | **During Example (Section II).** As soon as you mention "different sperm/egg." | **The Stipulation Reminder.** "We are stipulating the DNA is identical in the counterfactual. We are testing the *container*, not the *code*." |
  | **Psychological Continuity**<br>("I am my memories/experiences.") | **During Defensive Step (Section I.3).** When arguing why the duplicate isn't you. | **The "Starting Line" Analogy.** "Psychological continuity explains how you persist *through* life. Origin essentialism explains how you got *to* the starting line. You cannot have the race if you didn't start at this gate." |
  | **Parental/Sibling Essentialism**<br>("My parents are essential, not the cells.") | **During Example (Section II).** When discussing the "Same Parents" control. | **The "Same Parents, Different Cells" Clarification.** "You share parents with your siblings. You do not share gametes. The theory claims the *gametes* are the necessary condition, not the *lineage*." |

  #### V. Check Question (5 Minutes)
  **Goal:** Verify grasp of the *modal* claim (necessity), not just the factual claim.

  **Question:**
  > "Suppose biotechnology advances to the point where we can synthesize a sperm and egg artificially. These synthetic gametes never existed in a human body, but they are engineered to combine and create a zygote with your **exact** genome. If that zygote is implanted and grows into an adult, is that adult **you**?"

  **Correct Grasp:** "No. Because the *particular material origin* (the actual sperm/egg from my parents) is missing, even if the genetic information is identical."
  **Incorrect Grasp:** "Yes. Because the DNA is the same." (This indicates they lapsed into Genetic Determinism).

  #### VI. Omissions & Transparency (5 Minutes)
  **What to Leave Out:**
  1.  **Formal Modal Logic:** Do not use operators (□, ◇) or possible worlds semantics. Use "could have" and "must have."
  2.  **Artifact Essentialism:** Do not discuss tables, ships, or statues. Lawyers will get bogged down in property law; doctors in biological vs. non-biological distinctions. Stick to persons.
  3.  **Biological Kind Essentialism:** Do not discuss whether the person could have been a different species. Stick to *this* person's origin.

  **Transparency Instruction:**
  **Yes, state this omission openly.**
  *   **Script:** "We are deliberately bracketing formal logic and non-human examples. We are focusing strictly on the metaphysics of *human personal identity* because that is where the ethical and legal stakes lie for this group. We are treating 'Origin' as 'Specific Gametes' and setting aside 'Causal Pathway' for the sake of this session."
  *   **Why:** This signals respect for their time and expertise. It frames the session as a targeted tool for their professional reasoning rather than an abstract academic exercise.
