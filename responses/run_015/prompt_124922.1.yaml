          *   Must use non-transitive logic but *not* focus on dice.
          *   Must run two frames: Technical (system design) and Moral (on-call pain).
          *   Must include a "Money Pump" mechanic (tokens/vouchers) where cyclic preferences lead to loss.
          *   Must include a "Numbering/Scoring" round that fails to resolve the contradiction.
          *   Must include a "On a Par" option (incomparability).
