  2.  **Deconstruct the Philosophical Problem:**

      *   The core argument is the *Spectrum Argument* (often associated with Parfit or Temkin), but specifically the *Intransitivity of Betterness*.
      *   Standard Sorites: A is slightly better than B, B slightly better than C... Z is clearly worse than A. (Problem: Vagueness).
      *   Target Argument: A is better than B (on dimension X), B is better than C (on dimension Y), C is better than D (on dimension Z)... Z is better than A. (Problem: Heterogeneous goods).
      *   The "Money Pump": If $A \succ B \succ C \succ A$, I can trade $A \to B$ (pay $\$$), $B \to C$ (pay $\$$), $C \to A$ (pay $\$$). I end up with $A$ and less money. Rationality violation.
      *   The "On a Par" (Ruth Chang): Sometimes items aren't equal, nor is one better; they are *on a par*. This blocks the chain.

  3.  **Designing the Activity Flow:**

      *   *Phase 1: Construction (The Chain).* Groups build the chain. This ensures ownership.
      *   *Phase 2: The Trade (The Pump).* Test for cycles using tokens.
