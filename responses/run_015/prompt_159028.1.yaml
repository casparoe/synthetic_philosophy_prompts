answer: |-
  Here is a decision procedure designed for your kitchen table. It is not a metaphysical truth; it is a narrative tool. It flattens complex philosophy into binary switches so you can stop arguing and start writing.

  ### The Procedure: The Origin-Continuity Heuristic

  Run every variant pitch through these three questions in order.

  **Question 1: The Nuclear Blueprint**
  *   **Ask:** Is the nuclear DNA derived from the exact same physical precursors (sperm/egg nuclei or somatic cell) as the original draft?
  *   **Yes:** Go to Question 2.
  *   **No:** **STOP.** This is a **Different Person**. (The reader should feel spooked/uncanny).
  *   *Why:* This handles the "Regress" snag. We stipulate that for the purposes of *this* trilogy, the "person" begins at the genetic combination of the parents involved in the clinic story. We do not trace back to the grandparents. If the nuclear code changes, the blueprint is different.

  **Question 2: The Zygotic Event**
  *   **Ask:** Did the biological entity begin as a unique, single zygote that followed a continuous developmental path to birth?
  *   **Yes:** Go to Question 3.
  *   **No:** **STOP.** This is a **Different Person**.
  *   *Why:* This handles the "Twins" snag. If one zygote splits, two unique trajectories begin. You cannot swap Twin A's life onto Twin B's origin, even if they are genetically identical. They are distinct entities from the moment of splitting.

  **Question 3: The Contextual Drift**
  *   **Ask:** Is the change in origin (time, family, method) small enough that the character's *internal* experience of the world remains plausible?
  *   **Yes:** **Same Person.** (The reader should grieve).
  *   **No:** **HAND-BACK.** This is a **Creative Choice**.
  *   *Why:* This handles the "Frozen Embryo" snag. Biologically, it's the same code. Narratively, a 12-year gap and different parents create a different *social* person. The procedure cannot solve this; it flags it as the thematic core of your book.

  ---

  ### Operating Notes (How to handle the Snags)

  You asked me to be straight about where I am flattening the philosophy to make this work. Here is where the procedure cheats:

  **1. The Mitochondria Snag (Chapter Four)**
  *   **The Science:** Mitochondrial donation means 0.1% of DNA comes from a donor.
  *   **The Procedure's Ruling:** Treat this as **Same Person** (Passes Question 1).
  *   **The Flattening:** I am defining "Identity" as "Nuclear Blueprint." In this novel, the nucleus is the *Plan* and the mitochondria are the *Battery*. Unless your plot is specifically about the mitochondrial donor claiming the child, treat the child as the genetic parents'.
  *   **Why:** If you rule this "Different Person," you break the emotional contract of a fertility clinic story where the mother is the primary anchor. It creates a "monster" where there should be a miracle.

  **2. The Regress Snag (Grandparents/Matter)**
  *   **The Philosophy:** Why stop at the sperm? Why not the atoms in the sperm?
  *   **The Procedure's Ruling:** Hard stop at the **Gametes provided by the characters**.
  *   **The Flattening:** This is a narrative boundary, not a metaphysical one. Your book is about *this* family and *this* clinic. The "Universe of Discourse" begins with the patients. Tracing origin further back dissolves the story. We stop the regress where the drama begins.

  **3. The Fertilization Process Snag (Time)**
  *   **The Science:** Fertilization takes hours.
  *   **The Procedure's Ruling:** Define the "Origin Moment" as **Pronuclear Fusion**.
  *   **The Flattening:** We are treating a biological process as a discrete event. If the *same* sperm and egg meet, we don't care if it took 10 minutes longer than the original draft. If a *different* sperm meets the egg, Question 1 fails.

  ---

  ### Running Your Variants

  Here is the procedure applied to your three specific cases.

  #### Variant 1: The Frozen Embryo
  *   **Scenario:** Same gametes, frozen 12 years, implanted later, different family.
  *   **Q1 (Nuclear Blueprint):** **Yes.** Same sperm, same egg.
  *   **Q2 (Zygotic Event):** **Yes.** Single zygote, continuous path (paused, but not split).
  *   **Q3 (Contextual Drift):** **No.** 12 years and different parents is a massive social shift.
  *   **Verdict:** **HAND-BACK (Creative Choice).**
  *   **Analysis:** The procedure admits this is the threshold. Biologically, she is the same. Sociologically, she is different.
  *   **Editor Warning:** Your editor wants "one woman's life." If you rule this "Same Person," you are arguing that *biology* dictates identity. If you rule "Different Person," you are arguing *context* dictates identity.
  *   **Recommendation:** For Book 3 of a trilogy about a clinic, this should likely be **Same Person**. The tragedy is that the *soul* is the same even if the *circumstances* changed. This maximizes the grief. If you make her a stranger, the clinic's mistake becomes less personal.

  #### Variant 2: Identical Twins
  *   **Scenario:** Same sperm/egg, zygote splits. You want to swap the life of Twin A onto Twin B.
  *   **Q1 (Nuclear Blueprint):** **Yes.**
  *   **Q2 (Zygotic Event):** **No.** The trajectory split. Twin B is not Twin A.
  *   **Verdict:** **Different Person.**
  *   **Analysis:** This is a hard stop. Even if they look identical, they are distinct biological entities from the split.
  *   **Editor Warning:** None. This is common sense. If you try to tell the reader Twin B is actually Twin A, they will reject it as magic, not counterfactual.
  *   **Recommendation:** Do not use this as a "re-run" of the same life. Use it to show how two identical codes diverge.

  #### Variant 3: The Clone
  *   **Scenario:** Skin cell from mother, donor egg, no sperm.
  *   **Q1 (Nuclear Blueprint):** **No.** The precursor is a somatic cell, not a gamete combination. The origin event is fundamentally different (cloning vs. conception).
  *   **Verdict:** **Different Person.**
  *   **Analysis:** Under Origin Essentialism (Kripke), a person cannot come from a different origin. A clone is a sibling, not a reincarnation.
  *   **Editor Warning:** **Your editor will hate this.** She wants "one woman's life." The procedure says a clone is *not* that woman.
  *   **The Conflict:** If you write the clone's life as if it is the mother's "re-run," the reader will feel the "Spooked" reaction (Uncanny Valley), not the "Grief" reaction.
  *   **Recommendation:** If you must use this for the "one woman's life" structure, you have to override the procedure. You must signal to the reader that *psychological continuity* (memories/soul) overrides *biological origin*. But be warned: philosophically and biologically, this is a different human being.

  ---

  ### Where This Procedure Will Misfire

  You asked for honesty about where this tool will break.

  1.  **The "Soul" Problem:** The procedure is materialist (DNA + Trajectory). It cannot measure "Soul." If your trilogy has a spiritual or metaphysical layer where the *same soul* inhabits different bodies, this procedure will give you the wrong answer. It assumes identity is physical.
  2.  **The "Memory" Loophole:** If your "re-running" involves the character *remembering* the previous version of their life, Question 3 becomes irrelevant. Memory trumps origin in fiction. If she remembers being the original, she is the original, regardless of DNA. The procedure assumes a "reset" life.
  3.  **The Editor's Veto:** Your editor wants a single throughline. The procedure will tell you that the **Clone** and potentially the **Frozen Embryo** are different people. You will have to choose: do you want philosophical consistency (Different People) or narrative simplicity (One Woman)?
      *   If you choose **One Woman**, you are writing a fable/myth.
      *   If you choose **Different People**, you are writing speculative fiction about identity.
      *   The procedure pushes you toward the latter.

  ### Final Instruction for the Kitchen Table

  When you pitch a variant next week:
  1.  Ask **Q1 (Nuclear Blueprint)** first. If it fails, stop arguing. It's a stranger. Write the spookiness.
  2.  If Q1 passes, ask **Q2 (Zygotic Event)**. If it fails (Twins), stop arguing. It's a sibling. Write the divergence.
  3.  If both pass, you are in the **Hand-Back Zone** (Frozen Embryo). Do not argue about facts. Argue about **Theme**. Ask: "Do we want the reader to cry (Same) or shiver (Different)?" Let the desired emotion decide, not the biology.

  This saves you 35 minutes of metaphysics and leaves you 5 minutes to decide what kind of book you're writing.
