      *   **The Test Cases:** Run them through honestly.
      *   **The Warning:** Where the editor will push back.

      *Self-Correction on the Procedure:*
      The user asked for *one* first question, a stopping point, and a hand-back point.
      *   *Q1:* **The Nuclear Origin.** (Same sperm/egg nucleus OR same somatic nucleus?)
