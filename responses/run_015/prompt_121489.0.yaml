  Good morning. Before we begin, I owe an apology to the linguists in the room: the flyer says "Philosphy of Justice." Consider that a live demonstration of human imperfection—which, conveniently, is exactly what we're here to talk about.

  Welcome to our philosophy undergrads, and a special welcome to the parents and teachers who braved Saturday traffic for the promise of free coffee and a discussion on what people *actually* deserve.

  I want to start with my grandma. She believed in karma deeply. But she didn't use it to punish; she used it to forgive. When someone hurt her, she'd say, "Don't worry, the universe will balance it." She slept well at night because she trusted the structure of reality to handle the debt she chose not to collect.

  But as philosophers, we have to ask: What is the structure of that debt?

  In the literature, we often split karma into two models. First, **Ledger Karma**. This is moral accounting. You do good, you get credit; you do bad, you get debt. But here is the structural collapse: A ledger requires a continuous debtor. If I suffer today for a wrong committed in a past life, is "I" still the same person? 

  Some argue rebirth solves this. I need to be clear: **That is not a consensus view.** In contemporary metaphysics, personal identity across lives is genuinely contested, not settled. If you remove rebirth, Ledger Karma collapses into simple retributivism—punishment looking for a target—or worse, it becomes unjust suffering inflicted on the wrong person.

  The second model is **Equilibrium Karma**. This isn't about accounts; it's about cosmic homeostasis. The universe tends toward balance, like thermodynamics. Bad things happen to bad people not because they *deserve* it, but because the system seeks equilibrium. 

  But notice the trade-off: If karma is just equilibrium, it stops being about *desert* entirely. It becomes physics, not ethics. A tree falling on a sinner isn't justice; it's gravity. If we accept this model, we lose the moral language of "deserving" altogether.

  So, here is the tension we are working with today. My grandma's wisdom was practical: it let her let go. But our job today is structural. We cannot pretend the metaphysics are solved. We have to ask: Can we have moral desert without a moral accountant? Can we have justice without a continuous self?

  To the undergrads: I want you to press hard on the identity conditions. To the parents and teachers: I want you to hold us accountable to the real-world stakes. If we tell a victim "they deserve their suffering," we need to know which theory justifies that claim.

  We aren't here to prove rebirth. We aren't here to prove entropy. We are here to see if "desert" survives when we pull on these threads. Let's get to work.
