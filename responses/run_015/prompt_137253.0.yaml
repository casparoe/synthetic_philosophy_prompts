answer: |-
  The rain battered the window of the study, a steady rhythm that usually helped Bea think, though today it merely underscored the stalemate. She stirred her tea, watching the swirl of milk. Tariq sat opposite, leaning back in a chair that groaned under his weight, looking equally weary of the circularity they'd been trapped in for years.

  'Right,' Bea said, setting the spoon down. 'Let's lock onto the case. Variant One: different gametes, edited nucleus to match my actual genome. Variant Two: my actual gametes, edited nucleus to differ. Both grow up. Both are adults now. Which one is me?'

  Tariq smiled, knowing the trap. 'You want me to say Variant One. Because the genome matches. But you'll say Variant Two, because the history matches.'

  'Precisely. And I need to tell you *why* without just stamping my foot. My view is that the essence lies in the specific causal history of the gametic fusion. Not the molecules themselves—they turn over anyway—but the specific event of *this* sperm meeting *this* egg. Variant Two preserves that historical anchor. Variant One is a duplicate. A very sophisticated twin, but a duplicate.'

  'But Bea,' Tariq leaned forward, 'look at the lottery. Those gametes were products of meiosis. A chancy mechanism. If a different crossover had happened in your mother's ovary, you'd have a slightly different egg, genetically. Are you saying you wouldn't exist if the chromosomal shuffle had landed differently? That seems to make your existence depend on a biological coin toss.'

  'Not depend on the outcome, but on the process. The essence isn't the genetic code; it's the historical particularity of the origin. Think of monozygotic twinning. One zygote, total molecular state identical at syngamy, becomes two people. If the essence were the total molecular state, twins would be one person. They aren't. So the essence must be something that allows for division. The historical path diverges.'

  'That's convenient,' Tariq said, tapping the table. 'But it leaves you vulnerable. If the state doesn't fix identity, why does the origin? My account is developmental trajectory. An organism is a self-maintaining functional structure. Variant One inherits the functional programme you actually ran. Variant Two runs a different programme—cardiac condition, different eye colour. On my view, Variant One is you, because psychological and bodily continuity is maximised there. Variant Two is a modified version of you, perhaps even a different person if the edits are severe enough.'

  'But that collapses into a closest-continuer view,' Bea countered. 'And you know the problem there. If Variant One exists, I'm Variant One. If Variant One doesn't exist, am I Variant Two? Identity shouldn't depend on the existence of a rival.'

  'Not rival, counterpart,' Tariq corrected gently. 'I'm not saying identity is vague. I'm saying the truth conditions for "Alice could have originated from different gametes" are grounded in the similarity of developmental programmes across worlds. In the world where the clinic uses different gametes but matches the genome, the resulting person stands in the same psychological and physical relation to Alice's actual life as Alice does to herself over time. That's what matters.'

  'What matters for what?' Bea pressed. 'Prudential concern? Should I care about Variant One's future pain as I care about my own?'

  'Yes. If I woke up as Variant One, I'd have your memories, your dispositions. I'd fear pain just as you do.'

  'But you wouldn't be me,' Bea said firmly. 'You'd be someone who remembers being me. There's a difference between remembering and having been. That's why Variant Two is me, even with the cardiac condition. The history is unbroken. The molecules change, the code changes slightly, but the thread is continuous.'

  Tariq paused, looking out at the rain. 'Here's where we might actually agree. Regardless of who is who metaphysically, neither variant has a *better* claim to your current prudential concern based solely on metaphysics. If you care about future pain, you should care about Variant One's pain because of the psychological continuity, and Variant Two's because of the historical continuity. The metaphysics doesn't settle the ethics.'

  Bea nodded slowly. 'I can write that down. Metaphysical identity in these cases does not dictate prudential rationality.'

  'Agreed,' Tariq said. 'But we still diverge on the truth conditions.'

  'We do.' Bea took a sip of tea. 'So, where exactly do we part ways? For me, it's this sentence: "Identity is grounded in the unique historical causal chain of the originating gametes, regardless of qualitative similarity."'

  Tariq shook his head. 'And for me, it's this: "Identity is grounded in the continuity of the organism's functional organisation, regardless of historical origin."'

  'So if I gave you a case where history and function were perfectly decoupled?' Bea asked.

  'Impossible,' Tariq said. 'But suppose you could upload the functional organisation into a new substrate without any biological origin. You'd call that a new entity. I'd call it you.'

  'Or,' Bea mused, 'suppose we had a case of gradual gamete replacement. What if, over the course of an hour, we swapped every molecule of the original sperm and egg for duplicates while they were approaching fusion, preserving the history but changing the matter entirely? Then we edit the genome to match Variant One.'

  Tariq frowned. 'That's the Ship of Theseus applied to conception. If the history is preserved, you'd say it's you. If the genome matches Variant One, I'd say it's you. But if the history is preserved *and* the genome matches... we agree.'

  'No,' Bea said. 'Suppose the history is preserved, but the genome is edited to match Variant One *exactly*. So it's my actual gametes, but edited to look like the clone.'

  'Then it's you,' Tariq said. 'History wins for me too, because the functional organisation develops from that origin.'

  'What if the editing happens *before* fusion?' Bea pressed. 'We take the gametes, edit them, then fuse them. Variant Two but with Variant One's genome.'

  'Then it's you,' Tariq conceded. 'Because it's your gametes.'

  'Right. So to move me, you need a case where history is broken but continuity is perfect. To move you, you need a case where history is kept but continuity is broken.' Bea stood up and walked to the window. 'Here's the variant. Suppose we freeze the zygote. Thaw it fifty years later. Implant it. The historical chain is physically interrupted, but the developmental programme is preserved. Or better: suppose we scan the zygote, destroy it, and reconstruct it from new matter using the scan. History broken. Programme preserved. Would you call that Alice?'

  Tariq was silent for a long moment. 'If the reconstruction is perfect... yes. That would move me. Because the functional organisation is what I care about. But if the reconstruction fails to capture the quantum state of the microtubules, say, then continuity is broken.'

  'And for me,' Bea said, turning back. 'If you showed me that the gametes themselves were indistinguishable not just genetically but historically—say, time travel meant the sperm was literally the same object used twice—I might waver. But until then, I stick with the history.'

  'So,' Tariq said, standing up and stretching. 'We agree on the ethics. We disagree on the metaphysics. And we both know that neither of us is going to sleep tonight.'

  'Fortnightly,' Bea corrected, smiling. 'We've got two weeks to find a better case.'

  'God help us,' Tariq said, grabbing his coat. 'Same time next week?'

  'Same time.'
