  I'm finishing a term paper for a grad seminar on classical Indian epistemology and I've realised I've slipped from testing a thesis into arguing for it, so I want someone to try to break it. Here's where I've landed. I want to reconstruct the Nyāya position that a cognition's validity is extrinsic — both in its arising and in our ascertainment of it — as a kind of hybrid: a token cognition counts as knowledge only if it is produced by a pramāṇa, where I'm glossing "pramāṇa" as a causally reliable, broadly fact-sensitive process (if the fact had been otherwise, this process wouldn't have thrown up this cognition), and its status as knowledge is never self-certifying but gets established, when and only when a doubt actually crops up, by a later apperceptive cognition normally backed by an inference from the success of the action the first cognition prompted. I also claim the standard regress worry fails, with two brakes: the demand for validation is triggered by occurrent doubt rather than attaching automatically to every cognition, and a validating cognition does not itself need to be independently certified as valid before it can do its validating work. A friend who works on Mīmāṃsā says both brakes are ad hoc, and my supervisor says the counterfactual gloss quietly turns a causal-production story into a modal one that no Naiyāyika would have recognised.

  So: what would count against the view as I've stated it? I want a straight map of its exposure, ranked from fatal to merely awkward, and I want you to be clear about which defeaters a defender in this lineage should concede as counting against them, and which they'd reasonably shrug off. Please don't give me a reading list or citations — I have the literature to hand, and I can't check anything online from where I'm writing anyway; I want the argumentative structure. Things I'm especially worried about, but don't let me set the whole agenda: (i) whether the two brakes stop the regress only by making validation too cheap, i.e. by letting practically any undoubted cognition count as validated, which would collapse the view into the intrinsic-validity picture it was meant to contrast with; (ii) whether Nyāya's treatment of cognitions as default-veridical, innocent until challenged, is actually in tension with taking ascertainment to be extrinsic rather than a genuine rival to it; (iii) whether testimony can be made fact-sensitive in my sense at all, given that what a speaker's report seems to track is the speaker's reliability rather than the fact reported; (iv) whether the view has anything to say about a cognition that is pramāṇa-produced and non-deviating but intuitively not knowledge, the Gettier-shaped case; (v) whether the counterfactual machinery in clause one is separable from the Sanskrit notion at all, or whether I've imported a contemporary safety condition and then read it back into the text. And if you think the position has been qualified into something unfalsifiable, say so and say whether that's fatal for a view of this kind or just what a reconstructive thesis is allowed to be.

  Write it as prose, not bullet points — maybe 700 words — and be blunt where I'm kidding myself. At the very end, on its own line, give me a machine-readable summary naming the single commitment you think is most exposed: \answer{eight words or fewer}.
