prompt: |-
  Me and my mate had a huge arguement on Friday night and I still can't let it go. We somehow ended up on misinformation and echo chambers, and he finished it off with "perception is a controlled hallucination" — so, he says, nobody actually sees the same world as anybody else, there's no shared reality to appeal to, and fact-checking is basically a waste of time. He said it like it was a knockdown argument and then said it again about four times.

  I pushed back with something I half made up on the spot: there are, I said, two different things "prediction" could mean in that picture — predicting what your next sensory input is going to be vs predicting what the hidden cause of that input is — and the line only sounds deep if you slide between the two. He said that was pedantry and that the slogan covers both anyway. Neither of us convinced the other, and I honestly dont know if my distinction is even a real one, or whether it does any work if it is.

  Can you lay out, as a list, the different precise things that line could be claiming, from the boring to the wild? For each one say whether it's a platitude everyone already accepted long before anyone talked about prediction error, an empirical claim that's probably fine, something genuinely contentious, or something that just doesn't follow — and say which of them, if any, would actually get him to "no shared reality, so fact-checking is pointless", plus what else he'd have to sneak in alongside it.

  Three more things while you're at it. He kept mixing in that all the brain really does is minimise prediction error, as if that were the same point — is it, or a separate claim that needs its own defence? What's the word "controlled" doing: controlled by the world, or by your own priors, because those seem to pull in opposite directions? And if "hallucination" is being used in a sense where it no longer contrasts with seeing something that's actually there, does the line have any bite left at all?

  Ideally something I can just send him, rather than a general essay on predictive processing.
