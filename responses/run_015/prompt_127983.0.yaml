answer: |-
  hi dr linde, thanks for coming on. i'm trying to work through something personal here while we talk, so forgive me if i jump around a bit. i've got about eight things i really need to press you on.

  1. you define "mnemonic extraction" as mining the dead for emotional content they never authorized. can you distinguish that from just ordinary historical error? like, if i get her motivation wrong because i'm careless, is that extraction, or is extraction something specific? and if you say it's just a metaphor for bad history, doesn't that weaken the ethical claim enough to make it optional?

  2. you argue the dead have "standing" against being cast as protagonists. usually standing requires an interest to defend, but they can't care anymore. if your reply is that standing doesn't require consciousness, what grounds it? is it a property of the body, the memory, or something else entirely?

  3. take the "silence gap" method—leaving inner life blank where the record is thin. my great-grandmother was a union organizer, a group often erased from history already. if we leave her inner life blank, aren't we reproducing the exact same erasure you're worried about, just under the guise of ethics?

  4. say i write a novel where the character is clearly my great-grandmother—same dates, same strikes, same kids—but i change her name to "mary." do i still owe the dead anything there, or does fiction create a loophole where biography doesn't?

  5. does this obligation apply to villains? if i'm dramatizing a dead tyrant, does moral desert change the obligation, or is mnemonic extraction wrong even if the subject was monstrous?

  6. if accuracy is the wrong metric for filmmaking, what's the right one? what specific standard should my uncle be using instead of factual precision?

  7. following up on that metric: how can you apply it without being able to check it against the dead person's own view? isn't verifying "ethical representation" impossible without the subject's consent?

  8. lastly, does your view collapse into simple respect for living descendants? if the harm is really felt by us, the grieving family, why frame the obligation around the dead at all instead of just telling filmmakers not to hurt the living?

  The strategy is to trap her in the tension between protecting the dead and silencing the marginalized while forcing a practical metric for artists.
