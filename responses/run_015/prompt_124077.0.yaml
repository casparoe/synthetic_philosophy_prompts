answer: |-
  # Seminar Handout: The Introspection Decision Tree

  **Instructions:** Follow the questions below based on your intuitions about the cases discussed. Answer "Yes" or "No" to move through the tree. Do not worry about philosophical labels until you reach the end.

  ***

  ### **START: The Possibility of Error**
  **Q1: Can a person be honestly wrong about their own mental state right now?**
  *(Note: This is not about lying. This is about genuinely believing you feel X, when you actually feel Y.)*
  *   **NO:** → **LEAF 1: Strong Transparency / Infallibilism**
      *(You hold that the mind is immediately known to itself; error is impossible.)*
  *   **YES:** → Go to Q2.

  ### **BRANCH 1: The Nature of the Error**
  **Q2: Think of the person who reports feeling "calm" but shows clear stress markers and later admits they were terrified. When people are wrong, is it about *whether* they have the feeling, or just *how strong* it is?**
  *   **Just How Strong (They know they feel something, just misjudge the intensity):** → **LEAF 2: Weak Transparency**
      *(Introspection catches the presence of states reliably, but fails on precise characterization.)*
  *   **Whether They Have It (They truly believe they are calm):** → Go to Q3.

  ### **BRANCH 2: The Scope of Error**
  **Q3: Is this total misidentification possible for simple sensations (pain, vision, fear) or only for complex thoughts (reasons for actions, beliefs)?**
  *   **Only Complex Thoughts:** → **LEAF 3: Confabulation-Heavy / Interpretivist**
      *(Introspection works for raw feels, but we invent stories about our own reasoning.)*
  *   **Simple Sensations Too:** → Go to Q4.

  ### **BRANCH 3: Authority of Evidence**
  **Q4: Can outside evidence (like video recordings of behavior or brain scans) prove them wrong definitively?**
  *   **NO (Their report still defines their reality, even if mistaken):** → **LEAF 4: UNNAMED (Fallibilist Privilege)**
      *(Rare combo: Error is possible, but first-person authority still overrides third-party data.)*
  *   **YES (Outside evidence overrides their report):** → Go to Q5.

  ### **BRANCH 4: The Mechanism of Error (Vision Cases)**
  **Q5: Think of the "Blindsight" case (denying sight but describing objects). Can someone process visual information while denying they see anything?**
  *   **YES:** → **LEAF 5: Unconscious Perception**
      *(Mental states exist and guide behavior, but introspection fails to detect them.)*
  *   **NO:** → Go to Q6.

  ### **BRANCH 5: Location vs. Existence**
  **Q6: Think of the "Afterimage" case (describing a visual spot as literally being in the room). Is the error about where the experience is located, or whether the experience exists as described at all?**
  *   **Where it is Located (Inner state projected outward):** → **LEAF 6: UNNAMED (Projectivist)**
      *(Introspection mislocates the phenomenal field, treating internal data as external objects.)*
  *   **Whether it Exists (All reports are fundamentally suspect):** → **LEAF 7: Eliminativism / Illusionism**
      *(Introspection is so unreliable that our common-sense categories of mind may not exist.)*

  ***

  ### **⚠️ Note on Indistinguishable Leaves**

  Please note that this tree relies on self-reported intuitions, which means certain positions may be difficult to distinguish in practice. Specifically:

  1.  **Leaf 5 (Unconscious Perception) vs. Leaf 7 (Eliminativism):** Both agree the subject's conscious report is wrong. The difference lies in whether you posit an *unconscious* state replacing it (Leaf 5) or deny the state's existence altogether (Leaf 7). Introspection alone cannot settle this; you need a theory of cognitive architecture.
  2.  **Leaf 4 (Fallibilist Privilege) vs. Leaf 2 (Weak Transparency):** Both protect the first-person perspective. The difference is whether you allow error about the *presence* of a state (Leaf 4) or only its *intensity* (Leaf 2). In real-world cases, subjects often confuse "I feel nothing" with "I feel a negligible amount," making these hard to separate empirically.
  3.  **Leaf 6 (Projectivist) vs. Leaf 2 (Weak Transparency):** Both admit error in characterization. The distinction rests on whether the error is spatial (placing an inner image outside) or qualitative (misjudging the feeling). Without a agreed-upon metaphysics of space and experience, these can look identical from the inside.
