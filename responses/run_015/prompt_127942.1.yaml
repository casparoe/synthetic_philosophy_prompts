answer: |-
  ### Phase 1: Brainstorming and Scoring

  Before settling on a definition, I tested five candidate principles against your ten verdicts. I have included the "Cluster" view you mentioned as a genuine candidate, though I suspect you will reject it for failing your goal of a single sentence.

  **The Candidates:**
  1.  **The Control Account:** Privacy is the individual's right to choose who knows what about them.
  2.  **The Secrecy Account:** Privacy is the state of keeping information hidden from view.
  3.  **The Contextual Account:** Privacy is the flow of information according to the norms of the specific social setting.
  4.  **The Recording Account:** Privacy is the protection of ephemeral moments from being fixed into durable records.
  5.  **The Agency Account:** Privacy is the protection of your status as a person, preventing you from being turned into an object of calculation or control without your participation.

  **The Scoring Table:**

  | Verdict | Control | Secrecy | Contextual | Recording | Agency (Winner) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Café Glance** | **Pass** (Implicit consent) | **Fail** (Visible) | **Pass** (Public norm) | **Pass** (Ephemeral) | **Pass** (No action taken) |
  | **2. Photo & Delete** | **Fail** (No loss of control) | **Fail** (Seen) | **Fail** (Same context) | **Pass** (Record made) | **Pass** (Objectification attempt) |
  | **3. Telephoto Neighbor** | **Fail** (Can't stop him) | **Fail** (Visible from outside) | **Pass** (Home norm) | **Fail** (No record) | **Pass** (Unilateral gaze) |
  | **4. Loyalty Inference** | **Fail** (Consented to card) | **Fail** (Data given) | **Pass** (Norm breach) | **Fail** (Inference, not record) | **Pass** (Acted upon) |
  | **5. Doctor Opinion** | **Pass** (Consent breached) | **Fail** (Not secret) | **Pass** (Procedural norm) | **Fail** (Record exists) | **Pass** (Agency bypassed) |
  | **6. Mother/Diary** | **Pass** (Sealed = No consent) | **Pass** (Hidden) | **Pass** (Trust breach) | **Pass** (Record read) | **Pass** (Inner self invaded) |
  | **7. Public Sketch** | **Pass** (Public choice) | **Fail** (Public) | **Pass** (Public norm) | **Fail** (Public record) | **Pass** (No power exerted) |
  | **8. Sketch to Insurer** | **Fail** (Data public) | **Fail** (Known) | **Pass** (Context shift) | **Fail** (Same sketch) | **Pass** (Power exerted) |
  | **9. Dormant DB** | **Fail** (No control) | **Fail** (Stored) | **Fail** (Norm unclear) | **Fail** (Record exists) | **Strain** (No action *yet*) |
  | **10. Wife vs. Dossier** | **Fail** (No consent for inference) | **Fail** (Known) | **Pass** (Intimacy norm) | **Pass** (Dossier = Record) | **Pass** (Subject vs. Object) |

  **Analysis of the Runners-Up:**
  *   **Control** collapses immediately on Case 4 (you handed over the data) and Case 10 (you cannot control what a spouse infers).
  *   **Secrecy** fails Case 1 and 3; privacy clearly exists in plain sight or behind windows.
  *   **Contextual** is strong but cannot explain why Case 2 (photo) is worse than Case 1 (glance) when the social context (café) is identical.
  *   **Recording** explains 1 vs. 2 and 10 perfectly, but fails Case 3 (the neighbor keeps no record) and Case 4 (the violation is the *inference*, not the storage).
  *   **Agency** handles the power dynamics of 4, 8, and 10 best. It strains on Case 9, which I will address in the critique section.

  ***

  ### Phase 2: The Selected Principle

  I select the **Agency Account**, refined to account for your specific intuitions about recording and space.

  **The Principle of Relational Agency:**
  Privacy is the right to remain a subject in your own life, rather than becoming an object in someone else's system. It is violated when information about you is detached from the human context in which it arose and is used to act upon you without your participation.

  **Clause-by-Clause Breakdown:**

  1.  **Clause:** *Information must be detached from its human context.*
      *   **Motivated by:** Case 8 (Public sketch sold to insurer). The information was true and public, but moving it from "social media" to "risk assessment" stripped it of your humanity.
      *   **Defeats:** Case 7 (Public sketch kept private). The context remained "observer," not "adjudicator."

  2.  **Clause:** *Information is used to act upon you.*
      *   **Motivated by:** Case 4 (Loyalty card inference). The violation wasn't knowing you were pregnant; it was mailing coupons based on that knowledge before you were ready.
      *   **Defeats:** Case 9 (Dormant location DB). No action is being taken against you; the data is inert. (I will challenge your intuition on this below).

  3.  **Clause:** *Without your participation in the relationship.*
      *   **Motivated by:** Case 10 (Wife vs. Dossier). Your wife participates in your life; the dossier excludes you. Also Case 5 (Doctor). The treatment helped you, but the decision excluded you.
      *   **Defeats:** Case 1 (Café glance). You are co-present in the space; the glance is part of the shared environment.

  4.  **Clause:** *Fixing ephemeral observation into a record creates a presumption of future action.*
      *   **Motivated by:** Case 2 (Photo vs. Glance). Even if deleted, the act of recording shifts the balance from "sharing a moment" to "capturing a specimen."
      *   **Defeats:** Case 1 (Café glance). Ephemeral seeing does not create a power imbalance.

  5.  **Clause:** *Intrusion into secluded space counts as "acting upon" regardless of records.*
      *   **Motivated by:** Case 3 (Telephoto neighbor). He is not just seeing; he is making your home his viewing screen. This exerts power over your sense of safety.
      *   **Defeats:** The "Recording Account" which would say Case 3 is safe because no file was saved.

  ***

  ### Phase 3: Verdicts on New Cases

  Here is how the Principle of Relational Agency applies to the five unlisted scenarios you provided.

  1.  **Smart speaker records a guest:** **Violation.** The guest did not participate in the relationship with the device manufacturer. Their voice is detached from the conversation context and fixed into a record (the cloud) for potential future action (profiling, ad targeting). The host consented; the guest was made an object.
  2.  **Employer infers pregnancy from typing speed:** **Violation.** This is Case 4 intensified. The data (typing) was given for work, detached from that context, and used to act upon the employee (potential discrimination) without participation. It turns a bodily state into a management metric.
  3.  **Stranger reconstructs face from genome:** **Violation.** This is the ultimate detachment. You gave DNA for health or ancestry (Context A); they use it to reconstruct your physical identity for identification (Context B). It turns your biology into a surveillance tool without your participation.
  4.  **City stores license plates for 30 days:** **Borderline/No Violation (under current principle).** If the database is truly dormant and only searchable for specific crimes, it is like Case 9. However, if it is used to track movement patterns of ordinary citizens (acting upon the population), it becomes a violation. The risk is the *capacity* for unilateral action.
  5.  **Friend finishes my sentences:** **No Violation.** This is Case 10 (Wife). It is a sign of shared context and intimacy. The friend is not using this knowledge to manipulate you or sell it; they are using it to facilitate the relationship. You remain a subject in the conversation.

  ***

  ### Phase 4: The Critique of Your Intuitions

  You asked me to be honest about where your reactions are confused. I believe **Verdict 9 (The Dormant Database)** is unreliable, and it creates a dangerous blind spot in your thinking.

  You say the phone company holding a decade of location history "leaves you cold" because no human has looked at it. Yet, you say the supermarket modeling your pregnancy (Verdict 4) is the *angriest* violation.

  **Here is the conflict:** In Verdict 4, the violation is the *inference* and the *action* (the coupon). In Verdict 9, the database exists. You assume that because no human looked, no action is possible. But algorithms are not humans. If the phone company's database is searchable by algorithm, you are already being profiled, priced, or risk-assessed, even if no human eyes ever see your specific dot on the map.

  **Why you should change your mind:** If you accept that Verdict 4 is a violation because a model *can* predict you, you must accept that Verdict 9 is a violation because a model *can* track you. The "human in the loop" is a distraction. The violation in 4 is not the mailing of the coupon; it is the *capacity* of the corporation to know you better than you know yourself and act on it. The dormant database grants that same capacity. You are under-reacting to 9 because the harm is invisible, not because it is absent.

  **Secondary Critique:** You are slightly inconsistent on **Verdict 3 (The Neighbor)** versus **Verdict 2 (The Photo)**. You find the neighbor (no record) worse than the photo (record deleted). My principle accommodates this by focusing on "intrusion into space." However, empirically, the photo is more dangerous. A neighbor's memory fades; a digital file, even "deleted," leaves traces. Your gut prioritizes the *creepiness of the gaze* over the *risk of the record*. This is emotionally understandable but strategically risky. In the modern world, the record is always more dangerous than the glance.

  ***

  ### Phase 5: Defending the Strain Points

  A hostile reader will attack my principle on **Verdict 9 (Dormant DB)** and **Verdict 3 (The Neighbor)**. Here is how I would defend the account against your intuitions if you chose to publish this principle.

  **On Verdict 9 (Why the Dormant DB *should* bother you):**
  *The Argument:* "You say the database leaves you cold because no human looks. But privacy is not about who looks; it is about who *holds the leash*. When a company holds ten years of your location, they hold the power to rewrite your history at any moment. If you are ever accused of a crime, if you ever apply for a job, if you ever divorce, that data can be operationalized in a second. The violation is not the current use; it is the *suspension* of your agency. You are living on borrowed time, waiting for them to decide to look. That is not privacy; that is probation."

  **On Verdict 3 (Why the Neighbor is a violation without records):**
  *The Argument:* "You ask why the neighbor violates you without a file. It is because surveillance is a power relationship, not just a data transfer. When he points that lens, he declares that your home is not your own; it is his theater. He has turned you into a spectacle. Even if he burns the film, the relationship has changed. He is the watcher; you are the watched. Privacy is the right to not be an exhibit. The record is just the proof; the gaze is the injury."

  ***

  ### Phase 6: The One Sentence

  You need a sentence for a general reader that captures the essence of this analysis without jargon. It must explain why the coupon angers you more than the glance, and why the wife is safe but the insurer is not.

  **"Privacy is not about keeping secrets, but about keeping power: it is the right to prevent your life from being turned into data that others can use to act upon you without your say."**
