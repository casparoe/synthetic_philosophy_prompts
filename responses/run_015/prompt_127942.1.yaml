prompt: |-
  Please act as a legal and political philosopher who has spent a career on the analysis and value of privacy, and who also knows the empirical work on how ordinary people actually react to being watched, recorded, and profiled. Work slowly and carefully: before you commit to anything, run a private brainstorming phase in which you generate at least five candidate principles — including, as a genuine candidate, the pluralist view that there is no single principle because the word names a cluster of distinct interests — and score each candidate against every verdict below in a compact table. Mark which verdicts each candidate gets, which it misses, and which it can only save by adding a clause. Only then pick one, defend it, and tell me honestly where you think my intuitions are unreliable. I would rather be told that one of my reactions is confused than have it quietly accommodated.

  The context: I am a journalist who covers science and ideas, and I am writing a long feature on whether privacy can survive cheap inference. I do not want a literature survey and I do not need citations or a reading list — I need help working out what I actually think, and whether my reactions add up to something I can state in one sentence to a general reader. So please reason from my verdicts rather than from what the field has said. You may of course use the usual suspects — control accounts, access accounts, contextual or relational accounts, reductionist views on which privacy is just a bundle of other interests, and the standard reply to the nothing-to-hide argument — but only as candidates to be tested, not as material to be recited.

  Here are my verdicts, given on gut reaction and held with varying confidence.

  1. A stranger at the next table in a café glances at my open laptop and sees my bank balance. Verdict: barely a sigh. Bad manners on me for leaving it visible; not something I would call a violation.
  2. The same stranger takes a photograph of the screen, looks at it once, deletes it, and tells no one. Verdict: now I am genuinely annoyed — and I cannot say why, since the person, the information, and the non-dissemination are all the same as in 1.
  3. A neighbor trains a telephoto lens on my kitchen every evening for a year, keeps no records, tells no one, and learns only that I eat dinner and sometimes cry. Verdict: an unambiguous violation, and it unsettles me more than 2 does, even though the information is duller and he works far harder for it.
  4. Ten years of supermarket loyalty-card purchases are run through a model that predicts my pregnancy and mails me coupons before I have told my family. Verdict: the case that makes me angriest, and in my ranking worse than 3 — even though I handed the data over knowingly and was paid for it in discounts, which is more than my neighbor can say.
  5. My doctor passes my scan to a specialist for a second opinion without asking me; this materially improves my treatment. Verdict: a violation, but a minor one. I would have consented in a second and the asking would have been pure ceremony, and yet I still think the asking was owed to me.
  6. My mother reads a teenage diary I taped shut and left in a drawer; she learns nothing she did not already know. Verdict: a violation, and the banality of the contents does not mitigate it much.
  7. A stranger reads every public thing I have posted online for fifteen years and writes a two-page character sketch of me, which he shows to no one. Verdict: creepy, but not a violation in my book. It was public; I put it there.
  8. The identical sketch is sold to an insurer, which prices my policy with it. Verdict: a clear violation, and worse than 7 by a wide margin, although the insurer knows exactly what the stranger knew.
  9. My phone company holds a decade of my location history in a database that no human being has ever looked at. Verdict: leaves me cold. Which sits badly with 4, since both are a corporation sitting on ten years of my data.
  10. My wife of twenty years knows things about me I never told her, because she has watched me. Verdict: not a violation at all; it is what intimacy consists in. But if she kept a written dossier of exactly those inferences in a locked safe nobody will ever open, I would feel violated by the dossier.

  I have tried to put a principle under these and it half works. The idea, suggested to me by a lawyer friend, is that privacy is not a matter of what others know but of how cheap it has become for them to find out: what I lose when I lose privacy is obscurity in practice, and I can lose it without anyone ever looking. This seems to me to nail 4, where databases collapse the cost of discovery, and to explain why 7 leaves me unbothered. But it also seems to break in two directions at once: it should tell me that my neighbor in 3 has not much diminished my privacy, since he pays a high price in effort for very little, and it should tell me that my wife in 10 has diminished it enormously, since knowledge of me is nearly free to her. Both strike me as the wrong verdicts, and 2 versus 1 suggests that something about the making of a record matters independently of cost.

  So here is what I want from you:

  (a) A principle, stated precisely enough to be applied without me, set out clause by clause, with the case from my list that motivates each clause and the case that each clause is there to defeat.
  (b) The scoring table from your brainstorming phase, so I can see what the runners-up got wrong.
  (c) Your account's verdicts on cases I have not listed, at least these five: a smart speaker that records a conversation with a guest who never consented to anything; an employer that infers a pregnancy from a change in typing speed; a stranger who reconstructs an identifiable face from genome data; a city that stores every license-plate reading in a searchable database for thirty days; and a friend who can finish my sentences.
  (d) An honest list of which of my verdicts your account cannot accommodate, which one you would have me give up, and why that one rather than another.
  (e) For the two or three verdicts your account gets wrong or strain[s] to get right, what a defender of the account would say to explain my reaction away — I want to know how the argument would go if a hostile reader pushed back on my intuitions rather than on your principle.
  (f) One sentence, in plain language, that I could print in the feature as what privacy turns out to be.

  Two constraints on the answer. Keep everything at the level of ordinary life — supermarkets, landlords, phones, doctors, spouses — with no science fiction and no apparatus a newspaper reader could not follow. And do not rest anything on a citation, a statute, or a decided case: I need an account that stands up from the cases and the reasoning alone, because I have to be able to defend it without pointing at an authority.
