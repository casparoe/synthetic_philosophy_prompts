answer: |-
  You have identified the precise pressure point. The disagreement is not about whether the past *matters* (both sides agree it does), but about what kind of *object* a reconstruction of the past is.

  Your intuition about laws is correct: for the Presentist, dynamical laws cannot be relations between existing events (since past events do not exist). They must be **dispositional properties of present things**. This shift forces a divergence in how inverse problems are interpreted.

  Here is the concrete case, drawn from the practice of geothermal reconstruction, where the metaphysical view alters the scientific inference.

  ### The Case: Borehole Paleothermometry (Heat Diffusion Inversion)

  **The Setup:**
  You measure the present-day temperature profile $T(z, t_{now})$ in a deep borehole. You wish to reconstruct the surface temperature history $T_s(t)$ over the last 100,000 years. The physical law is the heat diffusion equation:
  $$ \frac{\partial T}{\partial t} = \kappa \nabla^2 T $$
  This is a parabolic partial differential equation. It is **irreversible**. Information is lost as time moves forward; high-frequency variations in the past surface temperature are smoothed out by the time they reach the present depth.

  **The Mathematical Reality:**
  Inverting this equation to find $T_s(t)$ from $T(z, t_{now})$ is an **ill-posed problem**. There is no unique solution. An infinite number of past surface temperature histories could result in the *exact same* present-day temperature profile. To get a solution, you must apply **regularization** (e.g., "choose the smoothest history that fits the data within error bounds").

  ### The Divergence

  Here is where Presentism and Eternalism force different descriptions of the *same* mathematical operation.

  #### 1. The Eternalist Description (The "Block" View)
  *   **Ontology:** The past temperature field $T(z, t_{past})$ exists as a real slice of the spacetime block.
  *   **The Law:** The heat equation is a constraint linking real existing slices.
  *   **The Inference:** The inversion is an **estimation** problem. There is a *True History* that actually occurred. The regularization is a pragmatic, epistemic tool to deal with noise and information loss.
  *   **The Null Space:** The "null space" of the inversion (the high-frequency variations in the past that left no detectable trace in the present) represents **real events that are epistemically inaccessible**.
  *   **Conclusion:** "We cannot *resolve* rapid climate fluctuations older than 10 kyr, but they may have occurred."

  #### 2. The Presentist Description (The "Trace" View)
  *   **Ontology:** Only the present temperature profile $T(z, t_{now})$ exists. The past history is a construct derived from present traces + laws.
  *   **The Law:** The heat equation describes the **dispositional propensity** of the current rock body to have evolved from a prior state.
  *   **The Inference:** The inversion is a **definition** problem. Since the past does not exist independently of the traces that witness it, the "history" is nothing over and above the best reconstruction from the present.
  *   **The Null Space:** The null space represents **ontological indeterminacy**. If a past event left no trace in the present, and the past is reconstructed solely from present traces, then *there is no fact of the matter* about that event.
  *   **Conclusion:** "Rapid climate fluctuations older than 10 kyr **did not occur** (or it is meaningless to say they did), because they are not required to account for the present state."

  ### Where It Bites: The "Unrecorded Event"

  Imagine a scenario where independent evidence (e.g., a newly discovered speleothem record) suggests a sharp, 500-year cold spike 50,000 years ago. However, this spike is mathematically in the **null space** of your borehole inversion—it is too short to have left a detectable thermal anomaly in the rock at depth.

  *   **The Eternalist Geophysicist** says: "The borehole data is consistent with the spike. The diffusion process erased the signal, but the event was real. We must integrate the speleothem data to constrain the inversion."
  *   **The Presentist Geophysicist** faces a harder burden. Since the past is constructed from present traces, and the borehole traces *do not require* the spike, the spike is an **additional posit**.
      *   If the Presentist adopts a "Best System" view (laws are summaries of traces), adding the spike complicates the system without improving the fit to the *primary* present data (the borehole).
      *   **The Inference Cost:** The Presentist is pushed toward **eliminativism** regarding unrecorded past events. They must treat the "smooth" reconstruction not as a blurred image of a jagged reality, but as the *actual* history. To admit the spike is to admit that the present traces are insufficient to define the past, which undermines the Presentist claim that the present is all there is to work with.

  ### The Circularity You Suspected

  You noted: *"Appealing to laws in order to recover the past from present traces looks uncomfortably circular, since those laws were themselves supposed to be summaries of what happens in the world."*

  This is the **Humean Trap**.
  *   If laws are summaries of events (Humean), and past events don't exist (Presentism), then laws cannot be grounded in the past.
  *   To avoid this, the Presentist must adopt **Dispositionalism**: Laws are intrinsic powers of present objects (e.g., the rock *now* has a propensity to have cooled in this way).
  *   **The Cost:** In the borehole case, the "thermal conductivity" $\kappa$ is no longer a measured property of the past rock (which doesn't exist). It is a **theoretical parameter assigned to the present rock** to make the story cohere.
  *   **The Bite:** If the inversion fails (the model doesn't match the present T-profile), the Eternalist says, "My reconstruction of the past boundary conditions is wrong." The Presentist must say, "My assignment of dispositional properties to the present matter is wrong."
  *   This makes **deep-time parameters unfalsifiable** in a way present-day parameters are not. You cannot go back and measure the Archean mantle's viscosity. For the Eternalist, it is a measured quantity (measured at $t_{past}$). For the Presentist, it is a model coefficient chosen to minimize present-day residuals.

  ### The Least Costly Reply for the Presentist

  To save scientific practice without conceding to Eternalism, the Presentist must adopt **Instrumentalism about Deep Time**.

  They must argue: *"The past history is a useful fiction, a coordinate system for organizing present traces. When I say 'the viscosity was X', I mean 'assuming a viscosity of X provides the best systematic organization of current data'."*

  This allows them to keep doing the math. But it exacts a tax on **Realism**. They cannot claim to have *discovered* the thermal history of the basin; they can only claim to have *constructed* a narrative that saves the phenomena.

  ### The Real Difficulty: Information Loss vs. Existence

  The core difficulty is not laws, but **Information Loss**.

  Geophysics is dominated by irreversible processes (diffusion, decay, erosion). These processes destroy information.
  *   **Eternalism** accommodates this easily: Information is lost to the *observer*, but not to the *universe*. The past retains the detail even if the present cannot access it.
  *   **Presentism** struggles: If the past is reconstructed from the present, and the present lacks the information, the past *literally lacks the detail*.

  **The Concrete Consequence:**
  In **Hazard Assessment** (e.g., earthquake recurrence).
  *   We use paleoseismology (trenching) to find past rupture dates.
  *   Suppose the geological record is incomplete (erosion removed evidence of some quakes).
  *   **Eternalist:** "The recurrence interval is actually shorter; we just missed events. The risk is higher." (The missing events exist in the block).
  *   **Presentist:** "The recurrence interval is defined by the events we have traces for. To posit missing events is to posit existence without present truthmakers."
  *   **The Inference:** The Presentist is structurally biased toward **underestimating tail risk** in deep-time systems, because they lack the ontological room for "unrecorded real events."

  ### Summary

  The case is **Ill-Posed Inverse Problems in Diffusive Systems**.
  *   **Eternalist:** Regularization is an epistemic filter. The "True History" exists in the null space.
  *   **Presentist:** Regularization is an ontological constraint. The "Smooth History" is the only history.
  *   **The Work:** It changes how you treat **unrecorded events**. The Eternalist can claim they happened but are invisible. The Presentist must claim they are ontologically indeterminate.
  *   **The Cost:** The Presentist pays with **Scientific Realism**. They must treat deep-time reconstructions as instrumental models rather than measurements of a real domain.

  This validates your suspicion: for a Presentist, the laws of geophysics cannot be empirical generalizations about the past; they must be dispositional rules for generating narratives from present traces. The circularity is avoided only by sacrificing the claim that the reconstruction *corresponds* to a mind-independent past reality.
