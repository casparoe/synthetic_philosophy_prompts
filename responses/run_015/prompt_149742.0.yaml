      *   **Vocabulary:** Monads, entelechy, pre-established harmony, privation, compossibility, sufficient reason, perfection, variety, simplicity.
      *   **Context:** 1714 is late Leibniz (he died in 1716). He is working on the *Monadology* (published 1714) and *Principles of Nature and Grace*. He is deeply concerned with theodicy (published 1710).
