  I'd give this a 15 out of 20. You've got a really solid grasp of the core puzzle in part (a), especially the bit about how self-interest requires you to stop being self-interested. That sentence where you say what serves your interests here is ceasing to be someone who does whatever serves their interests is spot on and captures the paradox perfectly. However, you lose a couple of points when you move to the solution. You state in the sentence beginning The way out is self-deception that the hitchhiker has to believe falsely. This is a claim stated stronger than the argument supports because the case itself doesn't prove he needs false beliefs, only that he needs a reliable disposition to pay. He could know he's paying because it's rational to have the disposition, without lying to himself. That conflation of having a disposition with holding a false belief costs you about two marks in part (a), leaving you with 8 out of 10.

  Part (b) is trickier. You're right to say the argument is stronger because the driver blocks the manipulation route, and your explanation of why the original allows an out is clear. But you lose marks on the conclusion. When you write in the sentence starting And if no self-interested route is left that the only thing that could get him to pay is a genuine moral reason, you're presenting a false dichotomy. You haven't ruled out other possibilities, like the hitchhiker simply dying, or reason requiring something that isn't strictly moral. Just because self-interest fails doesn't automatically prove morality is the only remaining option. That logical jump costs you about three marks in this section. You also miss the chance to discuss whether the hitchhiker can just decide to be moral on the spot, which the prompt hints at by asking what he should do. So I'd give part (b) 7 out of 10.

  The main thing missing altogether is the distinction between acting rationally and having a rational disposition, which is the key tool needed to solve this. Without it, you rely on self-deception and morality to fill the gap. That missing distinction is really the heart of the case, and I'd say its absence accounts for the bulk of the lost marks. But for a first pass without reading the texts, you've nailed the intuitive problem better than most.
