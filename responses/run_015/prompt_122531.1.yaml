  Hi — hoping you can help me mark something. I run a tiny philosophy reading group with three friends, all of us complete amateurs, none of us has ever studied this properly. We work through a topic on our own, set each other a question, swap answers and mark each other's. This month it's Parfit's hitchhiker case and the general question of whether it can ever be rational to be irrational. I've been landed with Sam's answer and I've been argueing myself in circles over it, so I want an independent read. I'm deliberately not saying what I made of it, because I don't want to put ideas in your head.

  Here's the question we all answered.

  Question 3. (a) Tell Parfit's hitchhiker case in your own words — a man stranded in the desert who'll die without a lift, a driver who'll take him to town if he promises to pay $100 on arrival, and who is a very good judge of whether people mean what they say. Explain why the case is supposed to cause trouble for the view that being rational just is doing whatever best serves your own interests. Be clear about what the hitchhiker would have to be like, or to have arranged beforehand, in order to get the lift at all, and about why that is awkward for that view. (b) Now a changed version. Same desert, same driver, but this time the hitchhiker is someone who has thought about Parfit's case before, and the driver's judgement is perfect: he can see not just whether you would hand over the money, but whether your willingness to hand it over is the real thing or something you have talked yourself into for a reason. So if the hitchhiker works himself into a promise-keeping frame of mind purely in order to get the lift, the driver sees straight through it and drives off. Does this version make the argument from part (a) stronger, weaker, or neither? Explain why, and say what you think the hitchhiker should do.

  And here is Sam's answer, more or less word for word.

  (a) You're stuck in the desert and you'll die if nobody picks you up. A driver comes along and says he'll take you to town if you promise to pay him $100 when you get there. He's a very good judge of character and he'll only stop if he can tell you mean it, so you promise. Once you're in town, though, he can't force you to pay and there's nothing in it for you any more — the lift has already happened, and $100 is just $100 gone. If being rational means doing what's best for you, the rational thing in town is to keep your money. But the catch is that the only way to get the lift at all is to be the sort of person who would pay, or to have got yourself into a state beforehand where you really were going to pay. Obviously handing the money over in town can't reach backwards and cause the lift, so the whole thing has to work through what you were like earlier. And that's the trouble for the self-interest view: it tells you to do whatever serves your interests, but what serves your interests here is ceasing to be someone who does whatever serves their interests. The theory does itself in — it says be rational, and being rational means arranging for yourself not to be rational later on. That's why people say it shows rationality can require you to be irrational. The way out is self-deception: the hitchhiker has to get himself to believe, falsely, that he really is going to pay, since if he knows he won't the driver will spot it on his face. So the case shows that it can be rational to hold beliefs that aren't true. People compare it to Newcomb's problem and I think it's the same argument really, just with a lift instead of boxes.

  (b) This version makes the argument stronger, and I think it more or less settles it. In the original the hitchhiker could just work himself up into a promise-keeping mood before the driver arrives, so the self-interest theorist can shrug and say: fine, rationality tells you to manipulate yourself a bit, no big deal. In my version he can't do that, because the driver can see the willingness was manufactured for a reason. So there is no self-interested route to the lift left at all. And if no self-interested route is left, the only thing that could get him to pay is a genuine moral reason. So Parfit's case is really an argument for morality: the hitchhiker should pay because that is what reason genuinely requires of him, and the lesson for the rest of us is that we should all try to become people who keep their promises even when it costs us.

  What I need from you is a mark out of 20 — ten for each part — plus the specific comments that justify it: what he got right, what he got wrong, and what a better answer would have had to add. Please mark the answer he actually wrote, not the one you'd have preferred. Where you think he's made a mistake, say what kind of mistake it is — two things run together, a step that doesn't follow, a claim stated stronger than the argument supports — rather than just calling it muddled, and point at the sentence it's in. If something important is missing altogether, say how many marks it should cost him.

  Format: put the mark in your very first sentence, then just carry on in plain prose. No headings, no bullet points, no bold, no tables — I'll be reading it on my phone on the bus, so write it the way you'd write an email to a friend. And none of us can look anything up from where we are, so please don't send me off to read anything or tell me what somebody or other argued in a paper; go by the case and the arguments as they stand above.
