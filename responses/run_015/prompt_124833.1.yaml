roduction from those that destabilize them—that fit her track record equally well. For each principle, state precisely what it predicts about the open-source case. Then give your best-guess prediction of her actual verdict, with the reasoning that favors it over the alternative, and identify one further historical or conceptual case that would decisively discriminate between the two rules you have proposed.
