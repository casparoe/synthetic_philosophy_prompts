answer: |-
  This is a precise and necessary intervention. Most defenses of particularism stop at "principles aren't necessary," without specifying what a reasoning architecture looks like *without* them. If particularism is true, the theory of moral reasoning must be robust enough to handle complexity without collapsing into intuitionism or arbitrariness.

  Here is the full set of desiderata for a particularist-compatible theory of moral reasoning, categorized by function, architecture, and psychology, followed by the classification of requirements and the consistency check.

  ### I. Functional Desiderata (Case Handling)

  A particularist theory must account for the dynamic behavior of reasons in specific scenarios without appealing to invariant rules.

  **1. Valence Holism**
  *   **Requirement:** The theory must explain how a feature (e.g., "breaking a promise") can be a reason *for* action in one context, a reason *against* in another, and morally *neutral* in a third.
  *   **Case:** Kindness. In Context A, telling a harsh truth is kindness (respecting autonomy). In Context B, the same truth is cruelty (gratuitous harm). The theory cannot treat "truth-telling" as having a fixed positive valence that is merely overridden; its moral polarity must shift based on the holistic configuration of the situation.

  **2. Non-Additive Weighting**
  *   **Requirement:** The theory must reject the model where moral weight is calculated by summing independent variables.
  *   **Case:** Unforeseen Harm. You promise to meet a friend. On the way, you encounter a stranger needing immediate aid. The reason to keep the promise doesn't just get "outweighed" mathematically; the *context of emergency* alters the normative force of the promise itself. The theory must model how reasons interact chemically, not arithmetically.

  **3. Defeasibility without Erasure**
  *   **Requirement:** The theory must distinguish between a reason that is *silenced* (does not exist) and a reason that is *defeated* (exists but does not determine action).
  *   **Case:** Promise Breaking. If you break a promise to save a life, the reason to keep the promise is defeated, not absent. This is crucial for explaining why you owe an explanation or apology to the friend. If the reason were absent, no apology would be due.

  ### II. Conceptual Architecture (Distinctions)

  To avoid collapsing into chaos, the theory must maintain specific structural distinctions that generalists often secure via principles, but which particularists must secure via context.

  **4. The Status/Weight Distinction**
  *   **Requirement:** The theory must distinguish the *type* of obligation (status) from the *urgency* of the obligation (weight).
  *   **Why:** A generalist says "Rights trump Utility." A particularist must explain why a friend's claim feels different from a stranger's claim even if the "weight" of harm is identical. The *status* of the relationship alters the reasoning structure, not just the score.

  **5. The Explanation Condition**
  *   **Requirement:** The theory must allow agents to give reasons for their actions that are intelligible to others, even without citing a universal rule.
  *   **Why:** If I say "I lied because context C obtained," you must be able to understand *why* C matters without me citing a rule like "Always lie in C." This requires a shared capacity for moral perception, not a shared code.

  **6. The Asymmetrical Moral Remainder (The Residue Problem)**
  *   **Requirement:** The theory must explain why moral residue (guilt, regret, obligation of repair) is often asymmetrical after a tragic choice.
  *   **The Problem:** You betray a friend to save five strangers. You feel profound residue regarding the friend, but rarely equivalent residue regarding the strangers you *didn't* save (beyond general sadness).
  *   **Generalist Explanation:** Hierarchy of principles (Special Obligations > General Obligations).
  *   **Particularist Constraint:** You cannot use a hierarchy of principles.
  *   **Required Solution:** The theory must locate the residue in the *nature of the relationship damaged*, not the violation of a priority rule. The friend relationship has a specific texture that generates specific residue when strained; the stranger relationship does not generate that specific texture of residue.
  *   **Verdict on "Non-Cognitive Noise":** You cannot treat this residue as non-cognitive noise. It is phenomenological data. If a theory of moral reasoning ignores the agent's experienced aftermath of decision-making, it fails to describe moral reasoning. However, it does **not** need to explain this via generalist priorities. It explains it via the *particular gravity* of specific relationships.

  ### III. Cognitive Science Consistency

  A philosophical theory of reasoning cannot contradict how the brain actually processes normative information.

  **7. Anti-Subsumption Processing**
  *   **Requirement:** The theory must not require deductive subsumption (matching Case X to Rule Y) as the primary mechanism of judgment.
  *   **Alignment:** Cognitive science suggests human reasoning is largely prototype-based, analogical, and pattern-matching. We recognize a situation as "a betrayal" or "a rescue" via similarity to prior cases, not by checking necessary and sufficient conditions.

  **8. Emotional Salience as Information**
  *   **Requirement:** The theory must integrate emotional responses as constitutive of reason-detection, not as interference.
  *   **Alignment:** Neuroethics indicates that emotional valuation (somatic markers) is required to prioritize competing considerations. A particularist theory treats the "feeling" that a promise matters here as a cognitive appraisal of the context, not a bias.

  **9. Heuristic Flexibility**
  *   **Requirement:** The theory must allow for "rules of thumb" that are usable but explicitly fallible.
  *   **Alignment:** Humans use heuristics ("Don't lie") for cognitive efficiency. The theory must account for why we use them (efficiency) while maintaining they are not truth-conditions for moral judgment (fallibility).

  ---

  ### IV. Classification: Non-Negotiable vs. Generalist Baggage

  To clear the deck, we must separate what a moral theory *must* do from what Generalism *wishes* it would do.

  **Non-Negotiable (The theory fails without these):**
  1.  **Valence Holism:** If features have fixed valences, you are a Generalist.
  2.  **Phenomenological Accuracy (Residue):** If the theory cannot explain why we feel guilt after a "right" choice, it ignores the data of moral experience.
  3.  **Defeasibility Distinction:** If defeated reasons vanish, you cannot explain apologies or regret.
  4.  **Cognitive Plausibility:** If the reasoning process requires computational power humans lack (e.g., infinite context scanning), it is not a theory of *human* moral reasoning.

  **Generalist Baggage (The particularist can reject these):**
  1.  **Codifiability:** The requirement that all valid reasoning can be written down in a finite set of propositions.
  2.  **Transitivity of "Better Than":** The requirement that if A > B in Context 1 and B > C in Context 2, then A > C in Context 3. Particularists can deny this across different contexts.
  3.  **Exceptionless Rules:** The idea that a principle must hold in all possible worlds to be valid.
  4.  **Residue as Rule-Violation:** The idea that guilt *implies* a rule was broken. (Particularists argue guilt implies a relationship was damaged).

  ---

  ### V. Consistency Check: Joint Unsatisfiability

  Are any of these desiderata mutually exclusive? There is one critical tension that threatens to break the theory.

  **The Tension: Explanation vs. Radical Contextuality (The Meta-Principle Trap)**

  *   **Desideratum A (Valence Holism):** The moral valence of a feature depends entirely on the context. No feature carries its value intrinsically.
  *   **Desideratum B (The Explanation Condition):** Agents must be able to explain *why* a feature counted as a reason in this context, in a way that is intelligible to others.

  **The Conflict:**
  If I explain *why* "lying" was good in Context A by citing features {x, y, z}, I am implicitly suggesting that in any future context with {x, y, z}, lying will be good.
  *   If I admit this, I have generated a **Meta-Principle** ("In contexts with {x, y, z}, lying is good"). This smuggles Generalism back in at a higher level.
  *   If I deny this (saying {x, y, z} might not work next time), my explanation loses its intelligibility. Why did {x, y, z} matter *this* time if they don't guarantee value *next* time?

  **Is this Jointly Unsatisfiable?**
  Strictly speaking, **yes**, if you demand a *logical* guarantee of intelligibility.
  *   You cannot have **Radical Holism** (context determines everything, no projections allowed) AND **Full Rational Intelligibility** (reasons must be projectable to be understood).

  **The Particularist Escape Route:**
  To satisfy both, the theory must shift the locus of intelligibility from *propositional projection* to *perceptual training*.
  *   **Solution:** We explain our reasoning not by citing rules that will hold in the future, but by pointing to the features and inviting the other person to *see* them as we do. Intelligibility is secured by shared moral perception (sensibility), not shared logical commitment to future cases.
  *   **Cost:** This makes moral disagreement harder to resolve. If you don't "see" the feature the way I do, I cannot force you via logic. I can only educate your perception.

  ### VI. Summary on the Asymmetrical Remainder

  To answer your specific stuck point: **The theory must explain the asymmetry, but it need not treat the residue as non-cognitive noise.**

  Treating residue as noise is a retreat. It says, "Our theory says you did the right thing, so your guilt is a bug in your brain." This is revisionist and unhelpful.

  The particularist explanation is: **Residue tracks the specific normative texture of the relationship, not the violation of a hierarchy.**
  *   When you betray a friend, you damage a specific, thick normative fabric. That fabric *is* the source of the residue.
  *   When you ignore the strangers, you do not damage a specific, thick normative fabric in the same way.
  *   The asymmetry exists because the *relationships* are asymmetrical, not because the *principles* are ranked.
  *   **Does this smuggle in Generalist priorities?** No. A generalist says "Friendship Principle > Stranger Principle." A particularist says "This specific friendship generates this specific gravity." The difference is between a ranking of types (Generalist) and a recognition of specific weight (Particularist).

  ### Final Verdict

  A viable particularist theory of moral reasoning must deliver **Holism**, **Defeasibility**, and **Phenomenological Accuracy** while aligning with **Case-Based Cognitive Processing**.

  The only genuine risk of joint unsatisfiability lies between **Radical Contextuality** and **Logical Intelligibility**. You resolve this by grounding intelligibility in **shared moral perception** rather than **shared logical projection**. If you cannot secure shared perception, the theory holds logically but fails pragmatically. If you secure perception, you satisfy the desiderata without principles.
