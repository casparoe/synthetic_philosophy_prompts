      So it is not the same thing. It is the *denial* of the thing.

      Okay, I have the content. Now to structure it politely and precisely.
      1. Direct answer: No canonical single noun, but here is the anatomy.
      2. The Anatomy: Causal Inertness + Epistemic Reliability = Acausal Counterfactual Dependence.
      3. The Mechanism: Backtracking Counterfactuals via Supervenience.
      4. The Name: **"The Acausal Sensitivity Gambit"** (Coinage).
