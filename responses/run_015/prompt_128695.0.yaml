answer: |-
  There is no single, canonical noun phrase in the contemporary literature that captures this *exact* argumentative tension. It is usually discussed under the headers of specific problems (The Benacerraf-Field Problem, The Evolutionary Debunking Argument, The Knowledge Objection to Epiphenomenalism) or specific metaphysical relations (Grounding, Supervenience).

  However, the structural move you are identifying is precise, recognizable, and technically distinct. It is the attempt to secure **Epistemic Sensitivity** (a counterfactual condition for knowledge) using **Metaphysical Dependence** (a non-causal relation) while explicitly denying **Causal Efficacy**.

  Here is the anatomy of the phenomenon, why it lacks a standard name, and the terminology you should use to pin it down.

  ### 1. The Phenomenon: Acausal Sensitivity
  The "thing" you are tripping over is the reliance on **Acausal Counterfactual Dependence**.

  In standard causal theories of knowledge (e.g., Goldman, Nozick), a belief counts as knowledge only if it is *sensitive*: if the fact were otherwise, the belief would be otherwise. This is typically cashed out as a causal chain.
  In the cases you describe (epiphenomenal qualia, Platonic math, normative facts), the proponent denies the causal chain. To save knowledge, they assert the counterfactual dependence holds *anyway*, in virtue of a non-causal relation (like supervenience or grounding).

  **The Technical Mechanism: Backtracking Counterfactuals**
  This is the specific gear that makes the move work, and it is likely the source of your friction.
  *   **The Setup:** Physical state $P$ causes Belief $B$. Inert Feature $F$ supervenes on $P$.
  *   **The Claim:** $B$ tracks $F$.
  *   **The Counterfactual:** "If $F$ had been different, $B$ would have been different."
  *   **The Trick:** Since $F$ is inert, it cannot change $B$ directly. For the counterfactual to be true, we must reason: "If $F$ were different, then $P$ *must* have been different (by supervenience), and if $P$ were different, then $B$ would be different (by causation)."
  *   **The Tension:** This requires **backtracking counterfactuals** (reasoning from effect/supervenient to cause/base). In standard Lewisian causation, backtracking counterfactuals are false in causal contexts. The proponent is relying on a modal connection that *looks* like difference-making but is metaphysically grounded in the base, not the feature.

  ### 2. The Name
  Since there is no established label, I recommend coining **"The Acausal Sensitivity Gambit."**

  *   **Definition:** An argumentative move that attempts to vindicate knowledge of a metaphysically inert domain by asserting robust counterfactual dependence between the facts and the beliefs, while denying that this dependence constitutes causal influence.
  *   **Why this name:** It captures the two essential components: the denial of causation (*Acausal*) and the reliance on an epistemic condition (*Sensitivity*), while acknowledging the strategic nature of the maneuver (*Gambit*).
  *   **Alternative (Critical):** If you want to highlight the "cheating" aspect you find annoying, **"Epistemic Free-Riding"** is appropriate. The inert feature free-rides on the causal powers of its physical base to generate the counterfactuals required for knowledge, without paying the ontological cost of causal efficacy.

  ### 3. Does it bite when the second story is *Identity*?
  **No.** Your suspicion is correct.

  If the relation is **Identity** (e.g., Type Identity Theory: Experience $E$ = Brain State $P$), the "Split" collapses.
  *   **Causal Story:** $P$ causes $B$.
  *   **Content Story:** $B$ is about $E$.
  *   **Resolution:** Since $E = P$, the causal story *is* the content story. $E$ causes $B$ because $P$ causes $B$. There is no need to posit a second, non-causal relation to explain the "aboutness," and no need to rely on backtracking counterfactuals. The difference-making is direct and causal.
  *   **Boundary:** The phenomenon *only* arises in **Non-Reductive** frameworks (Property Dualism, Platonism, Non-Naturalist Realism) where the feature is distinct from its physical base.

  ### 4. Is the "Mirror Version" the same thing?
  **No.** The mirror version ("Tracking implies Efficacy") is the **rejection** of the Gambit, not an instance of it.

  *   **The Gambit:** Inertness + Tracking $\rightarrow$ Knowledge (Causation and Counterfactuals come apart).
  *   **The Mirror:** Tracking $\rightarrow$ Efficacy (Counterfactuals *are* Causation, or entail it).
  *   **Analysis:** The mirror version accepts the Reliability Objection as a *reductio* of inertness. It says, "You claim it's inert, but you admit we track it; therefore, it must be causal." This is a **Causal Reductionist** move. It dissolves the split you are observing by refusing to allow the second story to be non-causal.

  ### 5. In/Out Cases for "The Acausal Sensitivity Gambit"

  **Clearly IN:**
  *   **David Chalmers on Phenomenal Concepts:** He argues we can have true beliefs about qualia even if they are epiphenomenal, because the beliefs are caused by the physical base which nomologically necessitates the qualia. (Relies on the supervenience counterfactual).
  *   **Platonic Mathematical Realism (certain versions):** Accounts that claim we know math because our physical cognitive faculties are structured to align with mathematical truths via a "pre-established harmony" or modal correlation, without causal contact.
  *   **Sharon Street's Target (Normative Realism):** She critiques realists who claim normative facts don't cause our beliefs but our beliefs still track them. She labels this **"The Tracking Account"** and argues it amounts to an inexplicable coincidence. (This is the Gambit viewed from the outside).

  **Clearly OUT:**
  *   **Type Identity Theory:** As discussed, the split collapses.
  *   **Causal Reductionism:** "Pain just *is* the firing of C-fibers, and that causes the belief." (Denies inertness).
  *   **Eliminativism:** "There are no such features, so no need to explain knowledge of them." (Denies the feature).
  *   **Third-Factor Explanations (e.g., Enoch on Norms):** This posits a common cause (e.g., survival) that causes *both* the belief and the fact (or makes them align). This is a **Common Cause Account**, not an Acausal Sensitivity Gambit, because it explains the correlation via a third causal agent, not via a direct non-causal relation between fact and belief.

  ### Summary for your usage
  When you encounter this in the reading group, you can say:

  > "This reply relies on **The Acausal Sensitivity Gambit**. It attempts to secure epistemic reliability via **backtracking counterfactuals** grounded in supervenience, while maintaining metaphysical inertness. This works only if we accept that counterfactual dependence can be decoupled from causal power—a move that dissolves if we adopt an **Identity Theory**, but remains vulnerable to the **Systematic Coincidence** objection if we don't."

  This signals you understand the metaphysics (supervenience/backtracking), the epistemology (sensitivity/reliability), and the specific argumentative shape (the split) without getting bogged down in generic labels like "The Knowledge Objection."
