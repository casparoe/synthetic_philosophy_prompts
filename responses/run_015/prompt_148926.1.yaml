  # ADVERSARIAL COLLABORATION DOCUMENT: LONG-TERM PRIORITIZATION IN AI INFRASTRUCTURE

  **Parties:**
  *   **Party A (Strong Longtermist):** Holds that the expected value of our actions is dominated by their effects on the very long-run future.
  *   **Party B (Near-Termist Skeptic):** Holds that long-run effects are too model-dependent to act on; priorities should be set by effects we can measure.

  **Glossary of Terms:**
  *   **Expected Value (EV):** A calculation where you multiply the probability of an outcome by the value (good or bad) of that outcome.
  *   **Sign-Stability:** An intervention has a stable sign if, across a wide range of reasonable models about how the future works, the intervention remains positive (or remains negative).
  *   **Cluelessness:** The epistemic state where an agent cannot know the long-term consequences of their actions because the causal chains are too complex.
  *   **Astronomical Value:** The potential amount of value (e.g., happy lives, reduced suffering) that could exist if civilization survives for millions or billions of years and expands across the universe.

  ---

  ## PART 1: JOINT CLAIMS

  *The following claims are endorsed by both Party A and Party B. Each is non-vacuous; a reasonable person outside this debate could deny them.*

  1.  **The Physical Potential of the Future:** If human civilization survives for a billion years and expands beyond Earth, the number of sentient beings that could exist is orders of magnitude larger than the number of humans currently alive.
  2.  **The Existence/Quality Distinction:** Ensuring civilization survives (existence) is distinct from ensuring civilization is good (quality). An intervention that guarantees survival but locks in a terrible value system may have negative expected value.
  3.  **The Small-Probability Strain:** Standard expected-value reasoning becomes epistemically fragile when dealing with extremely small probabilities (e.g., 1 in a billion) multiplied by extremely large payoffs (e.g., astronomical value). Both parties agree this requires stricter evidentiary standards than typical engineering decisions.
  4.  **The Non-Zero Concession:** Party B concedes that reducing the risk of human extinction has positive value, even if it is not the *dominant* priority. Party A concedes that not all work labeled "AI safety" effectively reduces extinction risk; some such work may be net neutral or negative.
  5.  **The Predictive Limit:** Neither party claims we can predict specific political, cultural, or technological details of the world 500 years from now. The disagreement is not about specific predictions, but about aggregate properties (e.g., total population, general value trajectory).

  ---

  ## PART 2: DISAGREEMENTS TABLE

  | Disputed Proposition | Party A (Longtermist) Wording | Party B (Skeptic) Wording | Type |
  | :--- | :--- | :--- | :--- |
  | **1. Dominance of Long-Run EV** | The expected value of actions taken today is overwhelmingly determined by their impact on the probability of permanent civilizational collapse. | The expected value of actions today is dominated by near-term effects because long-term probability estimates are too noisy to be action-guiding. | Substantive |
  | **2. Tractability of Influence** | We can identify specific interventions today (e.g., specific AI safety research) that robustly shift the long-term trajectory of civilization. | Our ability to steer the long-term trajectory is negligible compared to the background noise of historical contingency and technological convergence. | Substantive |
  | **3. Epistemic Status of Probabilities** | Subjective probability estimates derived from structured argument are sufficient to justify prioritizing low-probability, high-stakes risks. | Subjective probability estimates without empirical feedback loops are indistinguishable from guesses and should not drive resource allocation. | Substantive |
  | **4. Moral Weight of Potential Lives** | Possible future lives count morally in proportion to their probability of existing. Preventing them from existing is a loss of value comparable to harming existing lives. | Moral priority is owed primarily to existing or imminent beings. "Possible" lives do not generate obligations strong enough to override measurable near-term needs. | Substantive |
  | **5. Definition of "Measurable"** | "Measurable" includes proxy metrics (e.g., model robustness, alignment test scores) that correlate with long-term survival. | "Measurable" requires observable outcomes within a human lifetime (e.g., reduced bias, economic gain, immediate safety incidents). | Verbal |

  ---

  ## PART 3: CRUXES AND PREDICTIONS

  *This section identifies the specific empirical or logical questions that, if settled, would cause at least one party to update their position significantly.*

  ### 3.1 The Historical Dynamics Question: Basin-Shifting vs. Directional Washout

  **Definition:**
  *   **Basin-Shifting:** An intervention moves a system into a different "basin of attraction," resulting in a permanent change in regime (e.g., a civilization that never becomes space-faring vs. one that does; a stable value system vs. a chaotic one).
  *   **Directional Washout:** The effects of local actions decay over time. While specific details change, the system converges to a generic tendency whose sign (positive or negative) relative to the intervention cannot be recovered.

  **The Empirical Claim:** Both parties agree this is a factual question about how technological and social systems evolve, not a philosophical one.

  **Evidence Both Accept as Decisive:**
  A comparative historical analysis of "critical junctures" (e.g., the invention of nuclear weapons, the spread of printing press, the adoption of agriculture) measuring the persistence of specific policy interventions or value shifts 200+ years later, controlling for technological determinism.

  **Predictions:**
  *   **Party A (Longtermist):** Predicts evidence will show **Basin-Shifting**. They argue that certain institutional or technological locks (like the first aligned AGI) create path dependence that persists for millennia.
      *   *Threshold:* If data shows >60% of major historical interventions wash out within 200 years, Party A will reduce confidence in long-term steering by 50%.
  *   **Party B (Skeptic):** Predicts evidence will show **Directional Washout**. They argue that technological pressure and selection effects erase specific value interventions over time (e.g., all civilizations eventually adopt similar economic structures regardless of founding values).
      *   *Threshold:* If data shows >40% of major historical interventions create permanent regime shifts, Party B will concede that long-term steering is plausible.

  ### 3.2 The Sign-Stability Ratio (SSR) Commitment

  **Definition:** Of the interventions Party A currently prioritizes (e.g., specific AI alignment research, governance frameworks), what fraction have a long-run effect whose sign (positive/negative) is robust across the range of plausible models of the future?

  **Commitments:**
  *   **Party A (Longtermist):**
      *   **Current Estimate:** 0.6 (60% of prioritized work is robustly positive).
      *   **Flip Condition:** If rigorous auditing shows the SSR is below **0.2**, Party A will recommend reallocating 50% of resources to near-term measurable benefits.
  *   **Party B (Skeptic):**
      *   **Current Estimate:** 0.05 (5% of prioritized work is robustly positive; the rest is noise or potentially harmful).
      *   **Flip Condition:** If rigorous auditing shows the SSR is above **0.4**, Party B will concede that long-termist prioritization is rational.

  ### 3.3 Concrete Case Predictions

  #### Case 1: The Delay Case
  **Scenario:** An intervention successfully slows the development of a dangerous AI capability by roughly five years.
  **Question:** Does this delay net reduce the probability of catastrophic outcome?

  *   **Party A Verdict:** **Positive.**
      *   *Reasoning:* Delay allows more time for safety research, governance, and societal adaptation. It reduces the "rush to deploy" pressure.
      *   *Flip Condition:* If evidence shows that delay primarily benefits malicious actors (who catch up while defenders pause) or increases total compute usage over the long run, Party A withdraws support.
      *   *Decisive Evidence:* Historical analysis of arms control delays (e.g., biological weapons treaties) showing correlation between delay duration and safety outcomes.
  *   **Party B Verdict:** **Neutral/Negative.**
      *   *Reasoning:* Delay is not safety. The technology arrives eventually, potentially in a less transparent environment. The opportunity cost of the resources spent on delay could have been used for immediate harm reduction.
      *   *Flip Condition:* If evidence shows that specific past delays led to permanent cancellation of dangerous technologies rather than just postponement, Party B updates positive.
      *   *Decisive Evidence:* A tracked instance where a 5-year tech delay resulted in a permanently safer deployment architecture compared to a counterfactual fast deployment.

  #### Case 2: The Seeding Case
  **Scenario:** A fixed budget is spent making one particular set of values or institutions (e.g., "liberal democracy," "utilitarian ethics") more likely to persist into a much larger future civilization.
  **Question:** Does this seeding reliably improve the long-term future?

  *   **Party A Verdict:** **Positive (Conditional).**
      *   *Reasoning:* If the seeded values are "moral realism" or "concern for sentient welfare," they will compound over astronomical scales.
      *   *Flip Condition:* If it is shown that value systems are entirely determined by material conditions (technological determinism) rather than cultural seeding, Party A abandons this approach.
      *   *Decisive Evidence:* Longitudinal studies of ideological persistence in isolated colonies or organizations over 100+ years.
  *   **Party B Verdict:** **Negative.**
      *   *Reasoning:* Values evolve. Seeding specific modern values is cultural imperialism with unpredictable downstream effects. We cannot know if "utilitarianism" is good in a post-scarcity space civilization.
      *   *Flip Condition:* If evidence shows that early cultural "seeds" reliably predict institutional behavior 500 years later despite environmental changes, Party B updates positive.
      *   *Decisive Evidence:* Correlation between founding charters of long-lived institutions and their behavior after 10 generations of leadership turnover.

  ---

  ## APPENDIX: ANALYST COMMENTARY

  *Authored by the document facilitator (AI).*

  **1. Risks of Vacuity in Agreed Claims**
  Claim #3 ("The Small-Probability Strain") is the most at risk of being slanted. Both parties agree standard EV reasoning is "fragile" here, but they define fragility differently. Party A means "we need better math," while Party B means "we cannot use this math at all." This agreement may be merely a handshake over a shared vocabulary that masks a deeper methodological split.

  Claim #1 ("Physical Potential") is physically robust but morally loaded. A skeptic might agree the *capacity* for lives exists but deny those lives have moral weight until they are concrete. The claim frames this as a physical fact, which subtly advantages Party A.

  **2. The Most Likely Verbal Disagreement**
  Disagreement #5 ("Definition of Measurable") is almost certainly verbal. Party A calls proxy metrics "measurable" because they are quantifiable engineering outputs. Party B calls them "unmeasurable" because they lack a verified causal link to human welfare. Settling this requires agreeing on a causal chain, not a definition of measurement.

  **3. Mind-Changing Evidence**
  *   **For the Longtermist (Party A):** The strongest evidence would be a demonstration of **Directional Washout** in a high-fidelity simulation or historical analog. If it can be shown that even massive, deliberate interventions (like the spread of major world religions) have zero correlation with specific institutional outcomes 500 years later, the "Basin-Shifting" assumption collapses.
  *   **For the Skeptic (Party B):** The strongest evidence would be a high **Sign-Stability Ratio** verified by retrospective analysis. If we can look at past "existential risk" interventions (e.g., nuclear non-proliferation) and show a clear, robust statistical link to survival without massive confounding variables, the "Cluelessness" objection loses force.

  **4. Framing Failures**
  This document assumes both parties are Bayesian updaters who will change their minds if their "Flip Conditions" are met. In reality, identity and career incentives often harden these positions. The document also assumes the "future" is a single monolithic block of value. It fails to account for the possibility that the long-term future might be *negative* value (suffering), in which case Party A's goal might be to reduce the probability of that future existing, aligning them closer to Party B on extinction.

  **5. My Own Verdict**
  To conclude the **Skeptic** has the better of it, I would need to see that the "Sign-Stability Ratio" of AI safety interventions is indistinguishable from random noise when tested against varied future scenarios.
  To conclude the **Longtermist** has the better of it, I would need to see a concrete historical example where a small, targeted investment in "trajectory change" clearly prevented a civilizational collapse or locked in a vastly superior value system over a multi-century horizon. Without that empirical anchor, the Longtermist position remains a high-variance philosophical bet, while the Skeptic position remains a low-variance engineering heuristic.
