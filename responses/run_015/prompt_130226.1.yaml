prompt: |-
  I work on the research staff of a philanthropic foundation that spends roughly $25M a year on global health and poverty programs, and my job is to write the evidence memo that precedes each quarterly allocation decision. Eight to ten times a year the same question arrives in a different shape: should we decide now on what we already believe, or buy more information first — commission a pilot, pay for a longer-run follow-up, fund a replication in a new country, or delay a scale-up by a year so that a measurement can land before we commit? The decisions themselves range from $300k to about $10M; the studies we might commission range from $80k to $1.5M. The final call is made by a five-person investment committee voting by majority, three of whose members are not comfortable with anything more technical than a percentage. I get half a day with one analyst to produce the memo, and the memo has to survive being read out loud in the meeting.

  I have read the standard expositions of Good's theorem. My understanding is that for an agent who maximises expected utility and updates by Bayes, the expected value of information that arrives before the decision and is free to act on is never negative, and that it is strictly positive only where the information could actually change what the agent does. If I have misstated it, correct me before building on it, because everything below rests on it.

  What I do not have is a procedure. The formula is not my problem; my problem is that our decision environment violates the theorem's assumptions in at least five ways I can name, and I cannot tell which of those violations should reshape the procedure and which are noise. Specifically: the decider is a committee with heterogeneous priors voting by majority, and the committee that reads a study is frequently not the one that commissioned it; we almost never manage to pre-commit in writing to the decision rule that will be applied to the result; our findings are usually published, other funders read them, and our money is perhaps 4% of the relevant pool, so a result can help or hurt us through what it makes other people do; the committee does not maximise expected value but applies thresholds — it will not fund anything with more than roughly a 10% posterior probability of net harm, and it prefers a crisp ranking to a maximised one, which means variance-increasing information can be actively bad for us even when it is free; and the thing a study measures is only a noisy proxy for the thing we care about, because of external validity, implementation drift, and spillovers, so informativeness rather than sample size is usually what drives the answer. There is also the fact that delay has identifiable costs falling on identifiable people who would otherwise have been served, and how much to discount those people is a values question I do not want smuggled in as a parameter.

  What I want from you is a written procedure my team can actually run, not a tutorial. It should be an ordered set of questions with a stated sufficient answer to each; it should say at which steps we can stop early and with what verdict; it should say where the procedure returns don't buy the information — because no result could change the action, because the prior already settles it, because the result cannot arrive inside the decision window, or because we cannot commit to acting on it; and it should mark clearly, as such, the places where judgment genuinely cannot be eliminated and the question must be handed to a person, naming which person: the analyst, me, or the board. I need it to work when we have no credible numbers, which is most of the time, so it should say what to do with rough elicitations and one-sided bounds rather than silently substituting a guess for a distribution. It also has to be presentable to a non-technical trustee in a paragraph, and I want it to be hard for a staff member who already wants the study to game.

  Please apply it in full to three cases, using the numbers I give.

  One. A $6M scale-up over three years into a region where we have not operated. Our prior on the effect, expressed in units of our cost-effectiveness bar where 1.0 is our marginal dollar elsewhere, is roughly lognormal with median 1.5 and an 80% interval of 0.7 to 3.2. A pilot would cost $250k and take 14 months, and would give an approximately unbiased estimate of the local effect with a standard error near 0.45 in bar units, but we think its correlation with the eventual scale-up effect is only about 0.6.

  Two. A $400k follow-up measurement of long-run outcomes on a program we have funded for five years. The renewal vote is in 6 months and the results would arrive in 20; the program is one of two candidates to anchor a $12M country strategy that we will set in 18 months. The measurement is therefore late for the decision it was proposed for and early for a larger one, and in the interim the result would be published and read by other funders.

  Three. Our flagship program: $10M over three years, about 40% of the portfolio, four staff attached to it, and a proposed $1.2M three-year rigorous evaluation. The board has never exited a program of that size, and a null result would in practice be read as a mandate to implement better. I expect the honest verdict here to be one I would rather not hear. Give it anyway, flag it as the unwelcome one, and defend it.

  Finally, tell me what the procedure cannot do. I assume it cannot rescue a bad prior, cannot assign value to hypotheses we have not enumerated, cannot settle whether we are buying a decision input or producing a public good for the field, and will manufacture false precision if I let it. Tell me which of those are fatal and which I can live with, and what else belongs on the list.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User Role:** Research staff at a philanthropic foundation ($25M/year budget).
      *   **Task:** Write evidence memos for quarterly allocation decisions (8-10 times/year).
      *   **Core Dilemma:** Decide now vs. buy information (pilot, follow-up, replication, delay).
      *   **Constraints:**
          *   Decision sizes: $300k - $10M.
          *   Study costs: $80k - $1.5M.
          *   Decision Body: 5-person committee (majority vote, 3 non-technical).
          *   Time Budget: 0.5 days with 1 analyst.
          *   Output: Memo must survive read-aloud in meeting.
          *   User Knowledge: Understands Good's Theorem (EV of Information $\ge$ 0), but recognizes real-world violations.
      *   **Specific Violations of Good's Theorem to Address:**
          1.  Committee heterogeneity (priors/voting).
          2.  Time inconsistency (commissioners $\neq$ deciders).
          3.  Lack of pre-commitment to decision rules.
          4.  Externalities (publication effects, other funders).
          5.  Thresholds/Ranking (not pure EV maximization, variance can be bad).
          6.  Proxy measures (external validity, implementation drift).
          7.  Opportunity costs of delay (ethical/values).
          8.  Data scarcity (need rough elicitations, not false precision).
          9.  Gaming resistance (staff might want the study).
      *   **Deliverables:**
          1.  A written procedure (ordered questions, stop rules, verdicts, human judgment flags).
          2.  Application to three specific cases.
          3.  Limitations analysis (what the procedure *cannot* do).
          4.  One-paragraph summary for a trustee.

  2.  **Develop the Procedure (The "VOI Filter"):**

      *   *Goal:* Create a heuristic that approximates Value of Information (VOI) without requiring complex Bayesian calculations that violate the time constraint and audience capability.
      *   *Structure:* Needs to be a funnel. Start with hard constraints (time, authority), move to decision sensitivity, then to study quality, then to externalities.
      *   *Key Insight:* Good's Theorem fails here because the "Decision Rule" is unstable. The procedure must test the *stability of the decision* first. If the decision won't change, VOI = 0.
      *   *Addressing Violations:*
          *   *Committee:* Focus on the "swing vote" or the threshold (10% harm rule).
          *   *Time:* Hard stop if results arrive after decision deadline.
          *   *Externalities:* Explicit step for "Field Value" vs. "Internal Value."
          *   *Thresholds:* Check if the study reduces variance enough to cross the harm threshold or ranking bar.
          *   *Gaming:* Require explicit statement of "What result kills the project?"
      *   *Drafting the Steps:*
          1.  **Timing & Authority:** Can the result arrive in time? Will the future committee care?
          2.  **Decision Sensitivity:** Could *any* plausible result change the vote? (The "Kill Question").
          3.  **Threshold Check:** Does the uncertainty straddle the harm threshold or the funding bar?
          4.  **Study Quality:** Is the proxy good enough? (Correlation/Validity).
          5.  **Externalities:** Does publication help or hurt the mission/leverage?
          6.  **Cost-Benefit:** Is the study cost < 10% of the decision stake? (Rule of thumb).
          7.  **Judgment Call:** Who signs off on the subjective parts?

  3.  **Apply to Case One ($6M Scale-up, New Region):**

      *   *Inputs:* $6M decision, $250k study, 14 months (too long for quarterly, but maybe for scale-up phase?). Prior: Lognormal, median 1.5, 80% CI [0.7, 3.2]. Bar = 1.0. Harm threshold? (Not explicitly stated, assume standard risk aversion). Correlation = 0.6.
      *   *Analysis:*
          *   Timing: 14 months vs. Quarterly allocation? If scale-up is phased, maybe okay. If "decide now on $6M", 14 months is a delay cost.
          *   Sensitivity: Prior CI crosses 1.0 (0.7 to 3.2). Decision is uncertain.
          *   Study Impact: SE = 0.45. Correlation 0.6 reduces effective information.
          *   Threshold: 10% harm rule. Prior mass below 0? Lognormal is strictly positive, so "net harm" might mean <0 or <some threshold. If Lognormal, harm probability is near 0 unless "harm" means <1.0 (inefficient). Let's assume "harm" means negative impact. Lognormal implies P(Harm) $\approx$ 0. So the 10% harm rule isn't the binder. The binder is the 1.0 bar.
          *   Externalities: New region, likely publishable.
          *   Verdict: Likely "No" on the study, "Yes" on phased funding. Why? Correlation 0.6 is weak. $250k is 4% of stake. But the delay cost is high.
          *   *Refinement:* The prompt asks to use the procedure. I need to be rigorous.
          *   Step 1 (Time): 14 months. If decision is "now", study fails. If decision is "phase 1 now, phase 2 later", study works for phase 2. Let's assume the decision is "Commit $6M now". Study delays commitment.
          *   Step 2 (Sensitivity): Could result < 1.0 kill it? Yes.
          *   Step 3 (Quality): Correlation 0.6 is low. Pilot in new region often fails to predict scale.
          *   Step 4 (Cost): $250k vs $6M. 4%. Acceptable ratio.
          *   *Conclusion:* The weak correlation (external validity) is the killer. The pilot measures the *pilot*, not the *scale*.

  4.  **Apply to Case Two ($400k Follow-up, Wrong Timing):**

      *   *Inputs:* $400k study. Renewal vote in 6 months. Results in 20 months. Country strategy ($12M) in 18 months.
      *   *Analysis:*
          *   Step 1 (Time): Results (20mo) > Renewal (6mo). Study is useless for renewal.
          *   Step 1 (Time): Results (20mo) > Strategy (18mo). Study is useless for Strategy.
          *   *Verdict:* Hard Stop. Do not buy.
          *   *Nuance:* Can it be accelerated? If not, it's a public good, not a decision input.

  5.  **Apply to Case Three ($10M Flagship, $1.2M Evaluation):**

      *   *Inputs:* $10M program (40% portfolio). $1.2M eval (12% of program!). Board never exits flagship. Null result = "implement better" (ratchet effect).
      *   *Analysis:*
          *   Step 2 (Sensitivity): "Board never exited." This means P(Change Decision | Null Result) $\approx$ 0.
          *   Step 2 (Kill Question): Is there *any* result that stops the funding? If no, VOI = 0.
          *   Step 5 (Externalities): Null result read as "implement better." This creates moral hazard/perverse incentive.
          *   *Verdict:* Do not fund the evaluation *as a decision input*. Fund it only if the *only* goal is public good/field learning, and acknowledge the foundation is absorbing the cost for the field, not for itself.
          *   *Unwelcome Truth:* The evaluation is theater. It protects staff, not donors.

  6.  **Drafting the Limitations Section:**

      *   Bad priors (GIGO).
      *   Unknown unknowns.
      *   Public Good vs. Private Input confusion.
      *   False Precision (the procedure itself might look too mechanical).
      *   *Fatal vs. Manageable:* Bad priors are fatal but unavoidable. Public Good confusion is manageable if flagged. False precision is manageable if we use ranges.

  7.  **Drafting the Trustee Paragraph:**

      *   Needs to be plain English.
      *   Focus on "Don't spend money to learn what we won't use" and "Don't learn too late."

  8.  **Refining the Procedure (Self-Correction/Polishing):**

      *   *Constraint Check:* The user has 0.5 days. The procedure must be fast.
      *   *Gaming Resistance:* Need a specific question like "What specific finding would cause you to vote No?" If the answer is "None," stop.
      *   *Committee Heterogeneity:* Address the "10% harm rule." The procedure needs to check if the study reduces the probability of harm below 10% or raises it above.
      *   *Judgment Flags:* Clearly mark where the Analyst, User (Research Staff), or Committee must decide.
      *   *Formatting:* Use bolding, boxes, or clear headers to make it skimmable for the memo.

  9.  **Final Review against User Constraints:**

      *   *Ordered set of questions?* Yes.
      *   *Stop early?* Yes.
      *   *Verdicts?* Yes.
      *   *Human judgment flags?* Yes.
      *   *Rough elicitations?* Yes (use ranges/intervals).
      *   *Trustee paragraph?* Yes.
      *   *Three cases applied?* Yes.
      *   *Limitations?* Yes.
      *   *Tone:* Professional, direct, acknowledging the "unwelcome truth."

  10. **Writing the Response:** (Iterative drafting to ensure tone matches the sophisticated user). *Self-Correction on Case 1:* The correlation of 0.6 is critical. A pilot with low external validity is almost worthless for a scale-up decision. I need to emphasize that. *Self-Correction on Case 3:* Be very clear that this is "Zombie Program" territory. The evaluation is a shield, not a sword.

  11. **Final Polish:** Check the math on the VOI intuition. Good's theorem says VOI > 0 if it changes action. In Case 3, action never changes, so VOI = 0. In Case 2, timing prevents action change, so VOI = 0. In Case 1, action *might* change, but the signal is noisy. The procedure needs to capture "Signal-to-Noise" without complex stats. Use the "Overlap" heuristic.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Here is the procedure, the application to your three cases, and the limitations analysis.

  ### Part I: The "Decision-Utility" Filter (DUF)

  This procedure is designed to be run in 60–90 minutes by you and one analyst. It replaces complex Expected Value of Information (EVOI) calculations with a series of binary gates. It assumes Good's Theorem holds *only* if the decision rule is stable; since yours is not, the procedure tests for stability first.

  **Instructions:** Answer the questions in order. If you hit a **STOP**, the verdict is **DO NOT FUND THE STUDY**. If you pass all gates, the verdict is **FUND**, subject to the Judgment Flags.

  #### Gate 1: The Timing & Authority Test
  *   **Q1.1:** Will the study results be available *before* the specific decision deadline to which this study is attached?
      *   *If No:* **STOP.** (Verdict: Information is a public good, not a decision input. Do not charge against decision budget.)
  *   **Q1.2:** Is the committee that will vote on the results the same (or bound by the same written mandate as) the committee commissioning the study?
      *   *If No:* **STOP.** (Verdict: Time-inconsistency risk too high. Future committee will ignore sunk costs and priors.)
  *   **Judgment Flag (Analyst):** Estimate the probability (0–100%) that the future committee will ignore the study. If >20%, treat as **No** in Q1.2.

  #### Gate 2: The "Kill Question" (Decision Sensitivity)
  *   **Q2.1:** State the specific study finding (e.g., "Effect size < 0.5" or "Harm probability > 10%") that would cause the committee to *reject* or *significantly reduce* the funding.
      *   *If no such finding exists:* **STOP.** (Verdict: VOI = 0. The program is zombie-proof.)
  *   **Q2.2:** Based on current priors, is the probability of that "Kill Finding" greater than 10%?
      *   *If No:* **STOP.** (Verdict: Prior already settles the decision. Study is confirmation bias.)
  *   **Judgment Flag (You/Research Staff):** You must sign off that the "Kill Finding" in Q2.1 is genuine. If the program staff proposes the study, you must verify they agree that a negative result kills the project.

  #### Gate 3: The Threshold & Variance Test
  *   **Q3.1:** Does the current uncertainty interval (e.g., 80% CI) cross the foundation's funding bar (e.g., CE bar = 1.0) or the Harm Threshold (e.g., P(Harm) > 10%)?
      *   *If No:* **STOP.** (Verdict: Decision is robust to current uncertainty.)
  *   **Q3.2:** Is the study precise enough to move the *bulk* of the posterior distribution to one side of that threshold?
      *   *Heuristic:* If (Standard Error of Study) > (Distance from Prior Median to Threshold), the study is likely too noisy to resolve the decision.
      *   *If Yes (Too Noisy):* **STOP.** (Verdict: Study buys anxiety, not clarity.)
  *   **Judgment Flag (Analyst):** Use rough bounds. Do not calculate exact posteriors. If the SE is half the distance to the threshold, proceed. If SE is equal to or larger than the distance, stop.

  #### Gate 4: The Validity & Proxy Check
  *   **Q4.1:** Is the study measuring the exact outcome needed for the decision, or a proxy?
      *   *If Proxy:* What is the estimated correlation (0–1) between the proxy/pilot and the actual scale-up outcome?
  *   **Q4.2:** Is the correlation > 0.7?
      *   *If No:* **STOP.** (Verdict: External validity risk outweighs information gain. You are learning about the pilot, not the program.)
  *   **Judgment Flag (You/Research Staff):** You must adjudicate the correlation estimate. Program staff will overestimate this. Apply a "New Region/Scale" discount of at least 0.2 if applicable.

  #### Gate 5: The Cost & Externality Check
  *   **Q5.1:** Is the study cost < 10% of the decision stake?
      *   *If No:* **STOP.** (Verdict: Too expensive relative to risk, unless public good value is high.)
  *   **Q5.2:** If results are published, does a "Null Result" help or hurt the foundation's ability to leverage other capital?
      *   *If Hurts (e.g., signals failure, scares co-funders):* **STOP.** (Verdict: Negative externality outweighs internal value.)
  *   **Judgment Flag (Committee):** This question must be explicitly read to the Investment Committee. They must vote that they accept the reputational risk of a null result.

  ***

  ### Part II: Application to Cases

  #### Case One: $6M Scale-up (New Region)
  *   **Inputs:** Decision $6M. Study $250k (4.2%). Prior Median 1.5, 80% CI [0.7, 3.2]. Bar = 1.0. Study SE = 0.45. Correlation = 0.6. Delay = 14 months.
  *   **Gate 1 (Timing):** 14 months delay. If the $6M is committed quarterly, this delays deployment. If the decision is "Commit $6M over 3 years," a 14-month delay on the *start* is costly.
      *   *Status:* **Pass with Warning.** (Assume phased deployment allows delay).
  *   **Gate 2 (Kill Question):** What kills it? Effect < 1.0. Probability of Effect < 1.0 given prior? The 80% CI lower bound is 0.7. Roughly 10–15% mass is below 1.0.
      *   *Status:* **Pass.** (Probability > 10%).
  *   **Gate 3 (Threshold):** Distance from Median (1.5) to Bar (1.0) is 0.5. Study SE is 0.45.
      *   *Analysis:* The noise (0.45) is almost as large as the gap to the threshold (0.5). The study is unlikely to definitively push the posterior above 1.0 if the truth is near 1.0.
      *   *Status:* **Borderline/Fail.** (Study is too noisy to resolve the specific decision risk).
  *   **Gate 4 (Validity):** Correlation = 0.6.
      *   *Analysis:* Threshold is 0.7. 0.6 < 0.7.
      *   *Status:* **STOP.**
  *   **Verdict:** **DO NOT FUND THE PILOT.**
  *   **Reasoning:** The pilot measures the pilot, not the scale-up. With a 0.6 correlation, a negative pilot result leaves you unsure if the scale-up would fail or if the pilot just didn't translate. A positive result doesn't guarantee scale success. The $250k buys you a noisy signal about a different intervention than the one you are funding.
  *   **Recommendation:** Fund the scale-up in two tranches. Release $2M now. Make the second $4M contingent on interim process metrics (not impact RCT) at month 12. This preserves optionality without paying for low-validity information.

  #### Case Two: $400k Follow-up (Wrong Timing)
  *   **Inputs:** Decision (Renewal) in 6 months. Decision (Strategy) in 18 months. Results in 20 months. Cost $400k.
  *   **Gate 1 (Timing):** Results (20mo) > Renewal (6mo). Results (20mo) > Strategy (18mo).
      *   *Status:* **STOP.**
  *   **Verdict:** **DO NOT FUND AS DECISION INPUT.**
  *   **Reasoning:** The information arrives after the decision window closes. It cannot satisfy Good's Theorem conditions for *this* allocation cycle.
  *   **Recommendation:** If the measurement is scientifically valuable for the field, fund it from a "Research & Learning" budget line, not the "Program Allocation" budget. Explicitly label it as a Public Good. Do not count it toward the program's renewal criteria.

  #### Case Three: $10M Flagship (The Unwelcome Truth)
  *   **Inputs:** Decision $10M. Study $1.2M (12%). Board history: Never exited a flagship. Null result interpretation: "Implement better."
  *   **Gate 1 (Authority):** Committee changes over 3 years, but culture is stable.
      *   *Status:* Pass.
  *   **Gate 2 (Kill Question):** State the finding that would cause rejection.
      *   *Analysis:* "Board has never exited a program of that size." "Null result... read as a mandate to implement better."
      *   *Status:* **STOP.**
  *   **Verdict:** **DO NOT FUND THE EVALUATION AS A DECISION INPUT.**
  *   **Reasoning:** There is no "Kill Finding." The decision to fund is decoupled from the evidence. The VOI is zero because the action never changes. The $1.2M is not buying a decision; it is buying *legitimacy* and *staff protection*.
  *   **Recommendation:** This is the unwelcome verdict. You must write in the memo: *"This evaluation will not influence the funding decision. The Board's historical precedent indicates continued funding regardless of impact findings. Therefore, this $1.2M is a reputational/field-building expense, not an efficiency investment. We recommend either (A) cancelling the evaluation to save $1.2M for direct service, or (B) funding it explicitly as a public good for the field, acknowledging it will not alter our allocation."*
  *   **Defense:** If the Board argues "We need to learn to improve," reply: "If we will not stop funding on a null result, we are not learning to allocate; we are learning to spend. That is a management cost, not an investment due diligence cost."

  ***

  ### Part III: Limitations & Risks

  You asked what this procedure cannot do. Here is the inventory of residual risk:

  1.  **It cannot rescue a bad prior.** If your team's "rough elicitation" of the prior is overconfident (too narrow), Gate 3 will falsely tell you that you don't need more information.
      *   *Severity:* **Fatal.**
      *   *Mitigation:* Force the Analyst to widen the 80% CI by 50% as a "humility tax" before running Gate 3.
  2.  **It cannot assign value to unenumerated hypotheses.** If the study reveals a mechanism you didn't know existed (e.g., the program works but causes political instability), this filter treats it as noise.
      *   *Severity:* **Manageable.**
      *   *Mitigation:* Gate 5 (Externalities) captures some of this if "political instability" is considered a reputational risk.
  3.  **It cannot settle Public Good vs. Private Input.** The procedure forces a choice, but it cannot tell you if the foundation *should* be producing public goods.
      *   *Severity:* **Manageable.**
      *   *Mitigation:* The "Verdict" explicitly distinguishes between "Do Not Fund" and "Fund from Research Budget." This forces the Board to acknowledge the subsidy.
  4.  **It manufactures false precision.** The thresholds (0.7 correlation, 10% kill probability) look mathematical but are heuristic.
      *   *Severity:* **Manageable.**
      *   *Mitigation:* The "Judgment Flags" explicitly name the human responsible for the guess. This prevents the *procedure* from taking the blame; the *person* owns the estimate.
  5.  **It cannot overcome the "Zombie Program" dynamic.** As seen in Case 3, if the Board refuses to commit to a decision rule, the procedure can only expose the hypocrisy, not fix it.
      *   *Severity:* **Fatal (to the procedure's utility).**
      *   *Mitigation:* None. This is a governance failure, not a research failure. Your memo must document the failure to protect the foundation's long-term integrity.

  ***

  ### Part IV: The Trustee Paragraph

  *For the one-paragraph summary to be read aloud in the meeting:*

  > "We recommend against commissioning this study. Our analysis shows that the results would arrive too late to influence the vote, or the study is too disconnected from the actual scale-up to change our mind. In short, we would be spending donor money to learn something we either already know, cannot use, or will ignore. We propose either deploying the funds directly to beneficiaries or, if the learning is for the broader field, funding it from a separate research budget with the explicit understanding that it will not alter our grantmaking."

  ***

  ### Implementation Note for the Analyst

  To prevent gaming by staff who want the study:
  1.  **Require the "Kill Finding" in writing** from the program officer *before* you run the analysis. If they cannot write it, Gate 2 fails.
  2.  **Discount the Correlation.** If the program officer says correlation is 0.8, the Analyst must default to 0.6 unless there is prior literature proving otherwise.
  3.  **Time is Hard.** Do not accept "We might get early results." Use the registered protocol timeline.

  This procedure prioritizes *decision integrity* over *information accumulation*. It accepts that sometimes, not knowing is cheaper than knowing, provided the decision remains robust.
