prompt: |-
  I write novels — the secondhand-bookstore kind, mysteries with a literary bent — and I have been having the same argument with my workshop and my readers for about three years now, about a character I can't seem to fix or drop. She's the one who gives everything away. The money, the promotion, the relationship, the kidney; she takes that pond argument literally and just never stops. I didn't set out to write a saint.

  The reactions split in a way I still find weird.

  Some readers: she is the best person in the book and the discomfort is the point, we're supposed to feel pricked. Others don't say unrealistic, they say drained — her life looks narrow and gray, they feel sorry for her, and they think whatever is impressive about her isn't the same thing as her life going well for her. Then there's a third group who cheerfully grant that she's morally flawless and say they wouldn't want to know her and feel nothing like admiration; to them it reads as a failure of character rather than an excess of it.

  What drives me up the wall is that these three get traded back and forth as if they were one argument, and nobody moves an inch. My hypothesis, which I'd like you to shoot down if it's wrong, is that the question everyone thinks they're arguing about is really three questions in one coat: how much morality actually demands, what makes a life go well for the person living it, and what we're even doing when we say we admire someone, if that's one attitude and not several with different objects. Or maybe it's verbal and everybody is using good person to mean something different.

  But here's the bit that makes me distrust my own intuitions and everyone else's. In a novel I control the camera. If I put the reader inside the cost — the missed trains, the calls not returned, the daily grind of it — and never show them the people who are better off because of her, they come back saying her life is sad and thin. If I show the beneficiaries, even in glimpses, they come back saying she's admirable and they feel ashamed. Same character, same behavior. I can flip the verdict by moving the point of view. Which makes me think a chunk of whatever is being treated as data in this argument isn't a judgment about moral sainthood at all, it's an artifact of how the example gets framed — and if the standard examples have a built-in framing asymmetry, the debate might be leaning on contaminated evidence.

  So why has this stalled? I've been pointed at the essay that kicked it off in the early eighties and at the literature on how demanding morality is allowed to be, and as far as I can tell everyone has read everyone and the positions haven't moved in forty years. Diagnose it, using what each side actually claims: verbal or substantive, a bedrock clash about what a good life is, a hidden empirical question nobody has bothered to check (would a real person who gave all that up actually end up depleted, or fine?), several questions under one heading, or a mix where different parts stall for different reasons. Tell me which pieces are seperable — could one get settled without the others — and be straight about what would count as progress here and whether anything realistically will.

  Two housekeeping things. Please keep clear which claims are settled among people who actually work on this and which are still a live fight; don't hand me one side's position wearing a consensus costume. And American English, please. Also, where you're guessing about my character rather than about the argument, say so — my workshop already has alot of opinions about her.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** A novelist (mysteries with a literary bent). Intelligent, articulate, frustrated with a specific character critique that mirrors a philosophical debate.
      *   **The Problem:** A character who is excessively self-sacrificing ("moral saint"). Readers/workshop have three distinct, conflicting reactions (Admiration/Shame, Pity/Sadness, Repulsion/Character Failure). The author suspects the debate is conflating multiple questions (moral demand, well-being, admiration).
      *   **Key Insight:** The author notices that *framing* (POV) changes the verdict. If we see the cost, she's sad. If we see the benefit, she's admirable. This suggests the debate might be an artifact of framing rather than substantive moral truth.
      *   **The Task:** Diagnose the stalemate in the philosophical debate (referencing the "early eighties essay" -> Susan Wolf's "Moral Saints"). Determine if it's verbal, substantive, empirical, or a mix. Identify separable pieces. Define what progress looks like.
      *   **Constraints:**
          *   American English.
          *   Distinguish between settled consensus and live fights in philosophy.
          *   Do not speculate too much about the character herself (respect the "housekeeping" rule).
          *   Be direct ("shoot down if it's wrong," "be straight").

  2.  **Identify the Philosophical Context:**
      *   **The "Early Eighties Essay":** This is undoubtedly Susan Wolf's "Moral Saints" (1982).
      *   **The Core Debate:** Is it possible/ desirable to be as morally good as possible?
      *   **The Three Reactions mapped to Philosophy:**
          1.  *Best person/Pricked:* The Utilitarian/Maximalist view (Peter Singer-esque). Morality is demanding.
          2.  *Drained/Sad:* The Well-Being objection. A life devoted solely to morality lacks personal fulfillment, hobbies, relationships (Wolf's main point).
          3.  *Wouldn't want to know her/Character Failure:* The Virtue Ethics/Aesthetic objection. Perfection is boring, inhuman, or lacks "richness."

  3.  **Evaluate the Author's Hypothesis:**
      *   *Hypothesis:* The question is actually three questions (moral demand, well-being, admiration).
      *   *Verdict:* The author is largely correct. This is a strong insight.
      *   *Framing Insight:* The author notices that POV changes the judgment. This aligns with the philosophical distinction between *agent-neutral* vs. *agent-relative* perspectives, or the difference between evaluating an *act* vs. evaluating a *life*.

  4.  **Diagnose the Stalemate (The "Why"):**
      *   **Verbal vs. Substantive:** It's partly verbal (definitions of "rational," "good," "saint"), but mostly substantive (conflicting values).
      *   **Bedrock Clash:** Yes. Consequentialism (maximize good) vs. Virtue Ethics/Pluralism (balance goods).
      *   **Empirical Question:** Psychology matters (burnout vs. fulfillment), but philosophy often treats this as conceptual.
      *   **Framing Asymmetry:** The author hit on something crucial. Philosophical examples often abstract away the *experience* of the agent to focus on the *outcome* of the act.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the essay (Wolf). Validate the author's intuition. It's not just them; the field is stuck too.
      *   **Diagnosing the Stalemate:**
          *   *Is it Verbal?* Partly. "Rationality" and "Good Life" are doing heavy lifting. But not *just* verbal.
          *   *Is it Substantive?* Yes. Competing values (Morality vs. Prudence vs. Aesthetics).
          *   *Is it Empirical?* Surprisingly, yes. Psychology of altruism (compassion fatigue vs. helper's high). Philosophy often ignores this.
          *   *The Framing Point:* This is the author's strongest contribution. The "View from Nowhere" vs. "View from Here."
      *   **Separating the Questions:**
          1.  *Moral Demand:* How much does morality require? (Live fight: Utilitarians vs. Moderates).
          2.  *Well-Being:* Does morality conflict with happiness? (Settled: Often yes, in extreme cases).
          3.  *Admiration:* Is the saint likable/ideal? (Settled: No, not necessarily).
      *   **Consensus vs. Live Fight:**
          *   *Consensus:* Wolf won the battle that "Moral Saints" (in the maximizing sense) are not the ideal human beings. Most philosophers agree a life *only* of morality is impoverished.
          *   *Live Fight:* How much demand is too much? Where is the line?
      *   **Progress:** What would count? Integrating empirical psychology. Acknowledging the framing bias.
      *   **Advice for the Novelist:** How to use this. Lean into the framing. Don't solve the philosophy; dramatize the tension.

  6.  **Refining the Tone:**
      *   Needs to be respectful but intellectual.
      *   Avoid jargon where possible, or explain it.
      *   American English (check spelling: *behavior, favor, program*).
      *   Adhere to the "don't guess about the character" rule. Focus on the *argument*.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I identify the essay? Yes, Susan Wolf.
      *   *Check:* Did I distinguish consensus from debate? Need to be careful. Wolf's paper is seminal, but Utilitarians still push back. It's not *total* consensus that saints are bad, but consensus that they aren't the *only* ideal.
      *   *Check:* Did I address the framing insight? This is crucial. The "contaminated evidence" point is sharp. I need to validate that.
      *   *Check:* Housekeeping. Ensure I don't psychoanalyze the character.

  8.  **Final Polish:** Ensure the structure is logical. Start with the diagnosis, move to the specific questions, end with the "what now." (The resulting output matches the detailed response provided previously.)
answer: |-
  You have correctly identified the essay: Susan Wolf's "Moral Saints" (1982). You have also correctly identified that the debate surrounding it has reached a plateau. Your hypothesis is not wrong; in fact, it is more precise than much of the subsequent literature.

  Here is the diagnosis of the stalemate, broken down by your criteria, distinguishing between what is settled in the field and what remains a live fight.

  ### 1. The Diagnosis: Verbal, Substantive, or Empirical?

  It is a mix, but the weights are counterintuitive.

  **The Verbal Component (Low Weight)**
  There is some semantic slippage. When your readers say "good person," some mean "morally compliant," others mean "admirable human being," and others mean "someone I'd like to have dinner with." Philosophers try to fix this by distinguishing *moral worth* from *ideal personhood*. However, simply defining terms hasn't solved the argument. If everyone agreed on definitions, they would still disagree on the value of the life being described. So, it is not merely verbal.

  **The Substantive Component (High Weight)**
  This is the bedrock clash. You are witnessing a collision between two incompatible normative frameworks.
  *   **Side A (The Admirers):** Operates on a Consequentialist or Kantian framework. The good is defined by the outcome or the duty. If the action saves a life or fulfills a duty, the agent is successful.
  *   **Side B (The Pitying/Repulsed):** Operates on a Virtue Ethics or Value Pluralist framework. The good life requires a balance of goods (friendship, art, self-development), not just moral output.
  *   **The Stalemate:** These frameworks do not share a common currency. You cannot prove to a hard Utilitarian that a hobby is "worth" a saved life, and you cannot prove to a Pluralist that a saved life justifies a barren existence. They are arguing past each other because they value different things.

  **The Empirical Component (Hidden Weight)**
  This is where your intuition about "framing" is strongest, and where the philosophy is weakest.
  *   **The Consensus:** Philosophers generally treat the "Moral Saint" as a thought experiment, not a psychological case study. They assume the cost is real but abstract.
  *   **The Live Fight:** Psychology suggests that extreme altruism often leads to burnout (compassion fatigue), but also can provide profound meaning (helper's high). The philosophical debate assumes the saint is *depleted*. It rarely asks if the saint is *fulfilled*.
  *   **Your Insight:** You noted that showing the *cost* makes her look sad, while showing the *benefit* makes her look admirable. This is a framing asymmetry. The philosophical literature often focuses on the *act* (benefit) while ignoring the *experience* (cost), or vice versa. This is indeed "contaminated evidence." The debate stalls because it relies on intuitions generated by incomplete pictures.

  ### 2. Separating the Questions

  You asked if these questions are separable. They are, and untangling them is the only way progress happens.

  **Question 1: How much does morality demand? (The Normative Question)**
  *   **Status:** Live Fight.
  *   **The Split:** "Maximalists" (e.g., Peter Singer) argue morality demands everything until the marginal utility equals that of the recipient. "Moderates" argue we have prerogatives to pursue our own interests.
  *   **Settled?** No. This is the engine of the debate.

  **Question 2: Does this make a life go well for the person living it? (The Prudential Question)**
  *   **Status:** Mostly Settled (in Wolf's favor).
  *   **The Consensus:** Most contemporary philosophers (even many Utilitarians) grant Wolf's point: A life devoted *exclusively* to moral goodness is likely to be impoverished in terms of personal well-being. A "saint" in the maximizing sense usually lacks the richness required for a flourishing human life.
  *   **The Nuance:** The fight is now about *degree*. At what point does moral commitment crowd out well-being?

  **Question 3: Why do we admire (or not admire) them? (The Aesthetic/Social Question)**
  *   **Status:** Settled (in Wolf's favor), but ignored by Maximalists.
  *   **The Consensus:** Moral perfection does not equal human perfection. We can acknowledge someone is morally superior while finding them boring, annoying, or disturbing. Admiration is not a monolith; it has different objects (moral admiration vs. personal attraction).
  *   **The Stalemate:** Maximalists often concede this but argue it doesn't matter. They claim we *ought* to be saints even if we wouldn't want to be friends with them. Pluralists argue that if we wouldn't want to be them, the theory recommending them is flawed.

  ### 3. What Counts as Progress?

  You asked what would count as progress and whether anything realistically will.

  **In Philosophy:**
  Progress has stalled because the field treats these as conceptual truths rather than psychological realities. Progress would require abandoning the "view from nowhere."
  *   **The Shift:** Instead of asking "Is this rational?", philosophers need to ask "Is this sustainable?"
  *   **The Barrier:** Normative ethics resists empirical data. If a philosopher argues "One *ought* to give until it hurts," data showing that people who do this become depressed is often treated as irrelevant to the *moral truth*, only to the *practical application*.
  *   **Realistically:** Little progress will be made here. The positions are entrenched. The "Moral Saints" paper is forty years old because it successfully mapped the terrain, not because it solved it.

  **In Your Novel:**
  You have an advantage the philosophers do not. You control the camera.
  *   **The Framing Artifact:** You identified that the verdict flips based on POV. Philosophers cannot do this; they deal in universal claims. You deal in specific experiences.
  *   **Progress for You:** Do not try to resolve the philosophical debate. Your readers are bringing three different frameworks to the text. If you try to satisfy all three, the character will become incoherent.
  *   **The Move:** Lean into the framing asymmetry. If you want the reader to feel the *cost*, restrict the view to her internal monologue and the immediate sacrifice. If you want them to feel the *admiration*, restrict the view to the beneficiaries.
  *   **The Deeper Truth:** The fact that the verdict *changes* based on framing is the point. The "Moral Saint" is not a stable object. She is a Rorschach test for the reader's own hierarchy of values.

  ### 4. Summary of Consensus vs. Live Fight

  To ensure you aren't handed one side's position as consensus:

  *   **Consensus:** Susan Wolf successfully proved that "Moral Saints" (as maximizing agents) are not the ideal of *human* perfection. It is widely accepted that a good life includes non-moral virtues (humor, taste, passion) that moral sainthood might crowd out.
  *   **Live Fight:** Whether morality *requires* us to be saints despite this. Utilitarians still argue that the impoverishment of the agent is irrelevant if the outcome is better. They accept the "sad saint" conclusion but deny it matters morally.
  *   **Live Fight:** Whether "admiration" is a reliable guide to moral truth. Some argue our repulsion is just selfishness; others argue our repulsion is a valid signal that the moral theory is too demanding.

  ### 5. Final Verdict on Your Hypothesis

  Your hypothesis is correct. The argument is stalled because it conflates three distinct questions:
  1.  **Normative:** What is right?
  2.  **Prudential:** What is good for me?
  3.  **Aesthetic:** What is admirable/likable?

  The "contaminated evidence" regarding framing is a genuine insight. The philosophical debate assumes a static description of the saint. Your work demonstrates that the saint is perceived differently depending on *where the pain is located in the narrative*.

  **Recommendation:** Stop trying to fix the character to satisfy the workshop. The friction you are experiencing is not a bug in your writing; it is a feature of the ethical landscape. The character is working exactly as intended if she forces readers to reveal which of the three questions they prioritize. If the workshop wants a resolution, they are asking for a philosophical solution to a problem that has been stalled for forty years. You cannot write your way out of a bedrock value clash, but you can write *through* it.
