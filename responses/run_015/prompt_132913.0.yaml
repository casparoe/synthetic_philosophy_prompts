answer: |-
  ### Requirements for a Theory of Price Authority

  **1. The Noise Floor Requirement**
  *   **Motivating Case:** The no-trade theorem (Aumann/Milgrom-Stokey). If priors are common and posteriors common knowledge, trade vanishes. Yet trade is constant.
  *   **Requirement:** Deference is warranted only if the theory specifies a minimum ratio of noise traders to informed traders. Without noise to hide in, informed traders cannot profit, and without informed traders, the price contains no information.
  *   **Status:** **Genuine Desideratum.** A theory that cannot explain the coexistence of trade and information aggregation fails the baseline.

  **2. The Incentive Compatibility Requirement**
  *   **Motivating Case:** Grossman-Stiglitz paradox. If prices fully reveal dispersed information, the marginal value of private research is zero, so no one researches, so prices stop revealing.
  *   **Requirement:** The theory must explicitly deny full revelation. Deference is warranted only up to the point where the price error is large enough to compensate information acquisition costs, but small enough to remain superior to public data.
  *   **Status:** **Genuine Desideratum.** The pair (Full Revelation + Costly Information) is unsatisfiable; *Full Revelation* has to give.

  **3. The Liquidity Shock Filter**
  *   **Motivating Case:** Non-epistemic moves (margin calls, unwinds). The price moves as if beliefs changed, but no beliefs changed.
  *   **Requirement:** Deference is suspended when price movements are decoupled from belief updates. The theory must provide a criterion for distinguishing mechanical forced selling from informational selling.
  *   **Status:** **Genuine Desideratum.** Deferring to a price caused by a margin call is epistemic malpractice.

  **4. The Depth Weighting Requirement**
  *   **Motivating Case:** Same price, different volume. A thin print at $50 carries less epistemic weight than a cleared auction of 1 million units at $50.
  *   **Requirement:** Price authority must be a function of liquidity depth. A price without volume is a quote, not a consensus.
  *   **Status:** **Genuine Desideratum.** Volume is the proxy for the intensity of agreement.

  **5. The Model Consensus Requirement**
  *   **Motivating Case:** Structural disagreement. Traders agree on the price but disagree on the payoff structure (e.g., one thinks the bond will default, the other thinks the recovery rate is zero).
  *   **Requirement:** Deference requires that traders are betting on the same state space. If traders are pricing different underlying models under the same ticker, the aggregate price is semantically void.
  *   **Status:** **Genuine Desideratum.** Aggregation of heterogeneous models does not yield truth; it yields a weighted average of category errors.

  **6. The Causal Independence Requirement**
  *   **Motivating Case:** Reflexivity. The price influences the outcome (e.g., a low stock price prevents capital raising, causing bankruptcy).
  *   **Requirement:** Deference is warranted only when the market is *predicting* an exogenous outcome, not *creating* an endogenous one.
  *   **Status:** **Genuine Desideratum.** In reflexive loops, the price is a policy variable, not an epistemic signal.

  **7. The Hedging Neutrality Requirement**
  *   **Motivating Case:** Selection. Some traders are hedging physical exposure, not expressing a view on the asset's alpha.
  *   **Requirement:** The theory must explain why hedging flows do not corrupt the signal, or provide a method to net them out.
  *   **Status:** **Prejudice of the "Pure Speculator" Camp.** Hedging provides the liquidity that allows speculators to enter; a theory that treats hedging purely as noise fails to account for market ecology.

  **8. The Black Box Requirement**
  *   **Motivating Case:** Anonymity. The outsider does not know who is in the pool or why they trade.
  *   **Requirement:** The justification for deference must rely on the *mechanism* of aggregation, not the *credentials* of the participants. If you need to know the trader's identity to trust the price, you are deferring to the trader, not the market.
  *   **Status:** **Genuine Desideratum.** This is the core constraint of your question.

  ***

  ### Incompatible Pair
  **The Liquidity Shock Filter (3) and The Black Box Requirement (8) cannot be jointly satisfied.**
  To distinguish a margin call (Shock) from a belief update (Information), you must know something about the *motivation* or *constraints* of the trader. If you are strictly barred from knowing the pool or their reasons (Black Box), you cannot filter the shocks. A theory that demands deference only when shocks are absent, but also demands deference without knowing the participants, asks the outsider to solve an identification problem with insufficient data.

  ### Final Line
  The **Incentive Compatibility Requirement** excludes the most popular story ("prices reflect all available information"), forcing us to accept that markets are only smart enough to pay for their own intelligence, not omniscient.
