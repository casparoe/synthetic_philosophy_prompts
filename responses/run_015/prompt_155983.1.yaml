      *   *Value-Constitution:* Values don't push; they define. They constitute the "logic of the practice." Before this shift, accumulating wealth was greed (sinful). After/During this shift, accumulating wealth for reinvestment was stewardship (virtuous).
      *   *The Objection:* Empirical data shows Catholics sometimes did just as well.
