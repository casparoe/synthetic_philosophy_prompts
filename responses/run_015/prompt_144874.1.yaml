answer: |-
  **Working Notes: Conceptual Landscape and Objections**

  **1. Distinctions that Carry Weight**
  *   **Conventions vs. Moral Norms:** A convention (e.g., queueing styles, tipping) solves a coordination problem; it works only if everyone does it. A moral norm (e.g., do not steal) claims universal validity. Visitors often mistake local conventions for moral failings.
  *   **Coordination vs. Distribution:** Queueing is pure coordination (any system works if shared). Tipping is distributive (who gets the money). Jaywalking is mixed (coordination for safety, but distribution of risk).
  *   **The Cost-Bearing Principle:** If a visitor breaks a local norm for conscience sake, they must bear the cost themselves. They cannot shift the economic or social cost onto a local person who relies on the existing equilibrium.

  **2. The Hardest Objection: Complicity in Injustice**
  The strongest counter-argument concerns tipping. If the wage system is exploitative, tipping sustains it. By telling visitors to tip, are we making the station complicit in wage theft?
  *   *Rebuttal:* Individual visitors lack the leverage to change labor contracts. Unilateral withdrawal of tips punishes the worker, not the employer. Structural change must come from the Station/University contract, not visitor conscience. Until the contract changes, the visitor's obligation is to not harm the worker.

  **3. The Emissary Effect**
  Visitors are not private citizens; they are guests of the Station. Locals perceive their behavior as endorsed by the institution. A visitor policing a queue is not just a rude individual; they are seen as the Station asserting superiority. This creates diplomatic risk (permit renewal) and social friction.

  ***

  **MEMORANDUM**

  **TO:** The Governing Board, Tanjung Seram Marine Station
  **FROM:** Visiting Scientists and Conduct Committee
  **SUBJECT:** Visitor Conduct Guidelines and Normative Framework
  **DATE:** October 24, 2023

  **Purpose and Scope**

  This memo recommends updates to the visitor handbook and pre-arrival briefing for the upcoming field season. Following three incidents this season involving tipping, clinic etiquette, and traffic laws, the Committee has reviewed our conduct policies. Our goal is to balance respect for visitor conscience with our obligations to local staff, partners, and the community. We propose shifting from a policy of silence to one of explicit guidance based on a "Cost-Bearing Principle."

  **Guiding Framework: The Emissary Effect and Externalities**

  We must recognize that our visitors are not private tourists; they are institutional guests. Locals perceive their behavior as endorsed by the Station. We call this the **Emissary Effect**: when a visitor acts, the community hears it as a verdict from the Station on local practices. When a visitor refuses a local convention, they often create a **negative externality**—a cost shifted onto someone else. In ethics, an externality is a consequence of an action experienced by a third party who did not consent to it. Our policy must prevent visitors from externalizing the cost of their moral scruples onto local individuals.

  **Recommendations on Specific Incidents**

  **1. Tipping (Economic Conventions)**
  *   **Analysis:** The visiting postdoc argued that tipping allows employers to underpay staff. While this critique of wage structures may be valid abstractly, the local boat crews rely on tips for immediate livelihood. Refusing to tip shifts the cost of the visitor's principle onto the crew member, who loses income they expected.
  *   **Policy:** The handbook will state that tipping local service staff is mandatory according to local custom. However, we acknowledge the moral objection.
  *   **Accommodation:** Visitors who object to tipping on principle must pay the equivalent amount into a Station Welfare Pool. This fund will be distributed to local staff as a supplement. This ensures the visitor bears the cost of their scruples rather than the worker.
  *   **Enforceability:** Mandatory. Failure to tip or contribute to the pool will result in a warning; repeat offenses may affect future hosting eligibility.

  **2. Clinic Queueing (Social Coordination)**
  *   **Analysis:** Queueing is a **coordination convention**—it only works if everyone agrees on the rule (first-come vs. saving spots). There is no universal moral rule here. The graduate student imposed an external standard, causing distress to locals collecting medicine for children. This violates the Emissary Effect; the student was read as policing the community.
  *   **Policy:** Visitors are strictly prohibited from intervening in local social queues or public ordering. They must follow the lead of local staff.
  *   **Enforceability:** Mandatory. This is a condition of our relationship with the district clinic.
  *   **Remediation:** The Station Manager should issue a formal apology to the clinic senior nurse. No financial compensation is owed, but the relationship requires repair.

  **3. Jaywalking and Legal Enforcement (Safety and Law)**
  *   **Analysis:** This involves safety risks (two deaths last year) and legal risk (permit renewal). While selective enforcement is unjust, the visitor's demand for uniform enforcement ignores the immediate physical risk and the political reality of our operating permit.
  *   **Policy:** Visitors must obey local traffic laws and enforcement practices. Where local practice diverges from written law (e.g., crossing spots), visitors must follow the safety guidance of Station staff, not their own judgment of legal consistency.
  *   **Enforceability:** Mandatory. This is a safety and contractual obligation.
  *   **Remediation:** The Station should acknowledge the researcher's concern about selective enforcement in private correspondence but maintain that safety and permit security take precedence during their stay.

  **The Counter-Argument: Structural Justice**

  We must take seriously the view that visitors owe no conformity to conventions they deem unjust. The strongest version of this argument is that by following local norms (like tipping), we become complicit in structural injustice. If the wage system is exploitative, tipping sustains it. If the law is selectively enforced, obeying it validates corruption.

  This view does not win because it conflates individual agency with institutional leverage. A visitor refusing a tip does not force the boat cooperative to raise wages; they simply reduce a specific worker's income. They are punishing the victim of the structure, not the structure itself. Structural change requires collective action by the Station and University, not unilateral withdrawal by guests. Until we renegotiate the labor contract to include living wages, the moral obligation falls on the visitor to not harm the worker. Similarly, while selective enforcement is unjust, a visitor challenging it on the ground risks their safety and our permit, imposing costs on the entire Station community.

  **Decision Rule for Future Cases**

  To handle unforeseen issues, the Station Manager should apply the **Cost-Bearing Test**:
  *"Does this action shift a tangible cost (economic, social, or physical) onto a local person who did not consent to bear it?"*
  *   If **Yes**: The action is prohibited unless the visitor absorbs the cost (e.g., the tipping pool).
  *   If **No**: The visitor may follow their conscience, provided it does not violate safety laws.

  **Timeline**
  *   **November:** Draft handbook updates based on this memo.
  *   **December:** Review with University partners and Cooperative coordinators.
  *   **January:** Distribute to incoming visitors for March season.
  *   **February:** Briefing session for Station staff on enforcement.

  **Where This Reasoning Might Fail**

  This framework relies on the assumption that the local community wishes to maintain these conventions. The single consideration that would most move me to a different recommendation is evidence that the local partners (the University or the Cooperative) actively wish to abolish these norms. For example, if the boat cooperative formally requested the Station to abolish tipping to force wage restructuring, our guidance must flip immediately.

  If the Board disagrees with this memo, the first step to check is the **empirical premise regarding local consent**. We have assumed the crews want tips and the clinic wants queueing respect. If our partners indicate that they view these visitors as agents of positive change who should *challenge* local norms, then our duty shifts from deference to collaboration. I recommend the Station Manager verify this consent explicitly with the Cooperative Coordinator and District Health Office before finalizing the handbook.
