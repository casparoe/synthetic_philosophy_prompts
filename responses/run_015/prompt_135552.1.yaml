  6.  **Polishing:** Ensure the specific constraints (no citations, specific ending condition) are met. Make sure the "30% drift" is handled correctly as second-order uncertainty in Alex's view vs. likelihood in Blake's.

      *   *Correction on Alex's view:* Alex is arguing for updating the partition probabilities themselves via JC. So, Partition 1: Ice Loss. Partition 2: Calibration Status.
