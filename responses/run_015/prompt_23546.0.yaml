      *   *Point 5: The Missing Piece (Crucial).* This is the most valuable part for the user.
          *   Fact vs. Mind: Exam date is objective. Rationality is subjective.
          *   The Cooperation Puzzle: Strict CKR in *finite* games leads to *defection* (Backward Induction). Cooperation usually arises because CKR is *broken* (uncertainty about rationality). So Sam's skepticism actually supports the observation of cooperation better than Jess's strict model does.
