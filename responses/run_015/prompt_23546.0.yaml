      *   **Public Announcements:** In idealized models, a public announcement *does* generate CK instantly. In reality, noise, attention, and interpretation issues break the chain.
      *   **Rationality vs. Facts:** "The exam is Friday" is an external fact. "I am rational" is an internal disposition/intent. CKR is much harder to establish than CK of facts.
