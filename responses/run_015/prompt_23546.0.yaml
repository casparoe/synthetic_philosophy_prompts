  2.  **Deconstruct the Concepts:**

      *   **Common Knowledge (CK):** Definition: An event $E$ is common knowledge among a group if everyone knows $E$, everyone knows that everyone knows $E$, everyone knows that everyone knows that everyone knows $E$, *ad infinitum*.
      *   **Common Knowledge of Rationality (CKR):** Specifically applies CK to the assumption that all players are rational utility maximizers.
