answer: |-
  Good evening, everyone.

  For those of you I haven't had the chance to corner at the bar yet, I'm [Your Name]. I spent thirty-five years working alongside our guest of honour, [Friend's Name]. We started when our hair was darker and the ocean seemed slightly less complicated than it does now. Or perhaps it was just that we were simpler.

  When you are asked to sum up a career like [Friend's Name]'s, you quickly run into a problem. Usually, we praise a scientist by saying they brought us closer to the truth. We say their models matched the data, or that their theories predicted the future.

  I cannot say that about [Friend's Name]. And I know he would be the first to wave me down if I tried.

  We all know what he built. Box models. He took an ocean that is fluid, turbulent, and infinitely complex, and he turned it into four rectangles and a few arrows. He knew the ocean wasn't boxes. We knew the ocean wasn't boxes. He never pretended otherwise. His famous line, which I suspect half of you have heard at a conference and the other half have heard at a dinner party, was: "A model you cannot falsify in the first five minutes is a model you have not yet understood."

  He didn't build these models because he thought they were true. He built them because he thought they were honest.

  But this leaves me with a dilemma. If I can't say his models were true, and I can't say they were perfectly useful—because, let's be honest, some of those predictions were spectacularly wrong, occasionally by an order of magnitude—what exactly am I praising?

  For the family and friends here: imagine trying to understand how a clock works. Most scientists try to build a better clock, one that keeps perfect time. [Friend's Name] took the clock apart, threw away the gears, and drew a diagram of two wheels turning each other. It didn't tell the time. But it showed you which way the energy flowed.

  For my colleagues in the room: we know the standard defence of simplification. Usually, we say a false assumption is a shortcut. We say, "I'm ignoring friction now, but I can add it back later to pay back the debt." It's a falsehood you can redeem. The error degrades continuously.

  [Friend's Name]'s best work was not of that kind. His career was built on what I have come to think of as *load-bearing falsehoods*.

  In his models, the simplification wasn't a shortcut to the truth; it was the only place the truth could stand. If you made the model more realistic—if you added the friction, if you resolved the eddies, if you split the box in two—the phenomenon he was studying didn't get more accurate. It dissolved. It vanished into the noise.

  The "lie" of the box wasn't hiding the complexity; it was holding up the mechanism.

  This is a rare thing in science. Most of us are in the business of reduction. We try to chip away the error. [Friend's Name] was in the business of isolation. He found those fragile places in our understanding where the only way to see the signal was to turn off the rest of the universe.

  And yes, this meant the numbers often came out wrong. But the *direction* came out right. He didn't tell us what the temperature would be next year. He told us which thermometer was worth swimming out to fix. He didn't predict the current; he told us where the current had to be if the ocean was to make any sense at all.

  There is a specific kind of integrity required to do this. It requires you to be unafraid of being wrong, provided you are wrong for the right reasons. It requires you to value clarity over accuracy, because you understand that without clarity, accuracy is just noise.

  I have watched him defend these boxes for three decades. He never got defensive. He never hid behind the math. If a model failed, he was delighted. It meant he understood it. It meant the box was in the wrong place, or the arrow was pointing the wrong way. He treated his own creations as disposable tools. He used them to pry open a problem, and once the problem opened, he didn't care if the tool broke.

  To the family here: this is why his work matters, even if the ocean isn't made of boxes. He taught us that sometimes you have to simplify the world not to deceive yourself, but to stop deceiving yourself. He showed us that knowing what to ignore is harder than knowing what to measure.

  To the modellers here: we know that when the GCMs [General Circulation Models] get too heavy, we go back to his boxes to find our physics. We go there to remember what we are actually trying to solve. He provided the sanity checks for a field that often loses its mind in the resolution.

  So, I am not standing here to celebrate a man who mapped the ocean. I am celebrating a man who drew us a map of where the map was missing.

  He spent thirty-five years building things he knew were false, so that we could find out what was true. He built scaffolding that he knew we would have to tear down, because he understood that you cannot live in scaffolding, but you cannot build the cathedral without it.

  [Friend's Name], you have given us the rare gift of knowing exactly where we stand. You have shown us that a lie can be a vessel for truth, provided it is the right kind of lie. And you have done it with a generosity of spirit that matches the generosity of your science.

  Please raise your glasses.

  To the boxes. To the arrows. And to the man who knew exactly where to draw the lines.

  To [Friend's Name].
