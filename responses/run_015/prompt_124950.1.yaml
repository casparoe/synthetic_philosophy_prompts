  5.  **Drafting - Specific Considerations for the Audience:**
      *   *Modellers:* They need to hear that I understand the epistemology. I can't just say "he was inspiring." I need to say "he found the singularities where complexity hides mechanism."
      *   *Family:* They need to hear "he was a man of integrity who sought clarity." They don't need to know what an eddy is, just that the ocean is messy and he found a way to see through the mess.

