prompt: |-
  I'm part of this worker-owned furniture collective — we reclaim wood and build custom pieces — and about three months ago we traced the original capital for our workshop building back to a factory that used forced labor in the 1940s. None of us were alive then, but now we're trying to redesign our internal culture around how we carry that legacy. A few members proposed writing an emotional charter where we formally designate guilt as our collective's default moral response: individual members write repair contracts, do direct restorative labor, and treat the harm as a discrete act they can fix and move past. The other faction wants to institutionalize shame instead — not toxic personal shame, but a collective ritual of status-loss and reintergration, like an annual acknowledgment where the group publicly carries the stain together and restores belonging through shared visibility rather than private confession.

  I'm genuinely stuck because both sides sound like they're treating moral emotions as design specs you vote on, like picking a governance model for feelings. But is that philosophically coherent? Can a culture actually choose whether it operates as a guilt culture or a shame culture, or does that have to emerge orgaincally from practice? And if we're forced to pick, is guilt actually the better emotion for historical repair since it's tied to specific actions, or does shame do something for collective memory and identity that guilt can't reach? I keep feeling there's a deeper problem about whether moral emotions can be engineered at all hiding in our workshop drama, but I can't quite name the philosophical structure. Would love some help seeing what kind of problem this actually is.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Context:** A worker-owned furniture collective reclaiming wood/building custom pieces.
      *   **Trigger:** Discovered the workshop building's original capital came from a 1940s factory using forced labor.
      *   **Conflict:** Two factions proposing different emotional/cultural frameworks for addressing this legacy.
          *   *Faction A (Guilt):* Emotional charter, individual repair contracts, direct restorative labor, treating harm as discrete/fixable.
          *   *Faction B (Shame):* Institutionalized shame (ritualized status-loss/reintegration), annual public acknowledgment, collective carrying of the "stain," shared visibility.
      *   **User's Doubt:** Feels like both sides are treating moral emotions as "design specs" (engineering feelings). Questions philosophical coherence: Can a culture *choose* its moral emotion? Must it emerge organically? Which is better for historical repair (Guilt = action-specific vs. Shame = collective memory/identity)?
      *   **Core Question:** What kind of problem is this? (Philosophical structure identification).

  2.  **Deconstruct the Philosophical Issues:**
      *   **The "Engineering Emotions" Problem:** This touches on *moral psychology* and *social ontology*. Can you legislate affect?
      *   **Guilt vs. Shame:** This is a classic distinction in ethics and anthropology (Ruth Benedict, etc.).
          *   *Guilt:* Internal, act-focused, "I did something bad," solvable by restitution.
          *   *Shame:* External/Relational, identity-focused, "I am bad," solvable by reintegration/acceptance.
      *   **Historical Responsibility:** The "Non-Identity Problem" (Parfit) or "Intergenerational Justice." How are the living responsible for the dead?
      *   **Institutional Design vs. Organic Culture:** The tension between *constructivism* (we build our norms) and *expressivism* (norms express who we already are).
      *   **The "Moral Residue" of Capital:** The specific context of tainted capital (blood money) in a cooperative setting.

  3.  **Evaluate the Two Proposals:**
      *   *Guilt Proposal:* Risks being transactional ("I did my hours, I'm clean"). Might individualize a structural/historical problem. Good for action, bad for deep memory.
      *   *Shame Proposal:* Risks being performative or psychologically damaging. Good for collective identity, bad if it becomes hollow ritual. "Institutionalized shame" is almost an oxymoron (shame usually thrives on spontaneity/social pressure).

  4.  **Identify the Underlying Philosophical Structure:**
      *   The user is asking about *Moral Phenomenology* (how emotions feel/work) vs. *Normative Ethics* (what we ought to do) vs. *Political Philosophy* (how we organize).
      *   The specific tension is between **Voluntarism** (we choose our norms) and **Realism** (emotions have their own logic).
      *   It's also a problem of **Category Error**: Treating *affects* (feelings) as *institutions* (rules).
      *   Key Concept: **The Paradox of Institutionalized Affect.** You can institutionalize the *expression* of emotion, but not the *experience* of it.

  5.  **Drafting the Response - Section by Section:**

      *   **Validation:** Acknowledge the depth and rarity of this problem. It's a "good" problem to have because it shows deep care.
      *   **Naming the Problem:** It's a category error between *Ethics of Action* (Guilt) and *Ethics of Being* (Shame), compounded by the *Engineering of Affect*.
      *   **Philosophical Framework 1: Guilt vs. Shame (The Anthropological Lens):**
