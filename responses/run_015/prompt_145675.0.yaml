      *   **Philosophical Framework 2: The Problem of "Tainted Capital" (The Political Lens):**
          *   Are you responsible for the past? (Intergenerational justice).
          *   If you treat it as "fixable" (Guilt), do you erase the history?
          *   If you treat it as "stain" (Shame), do you paralyze the present?
      *   **Philosophical Framework 3: Institutionalizing Emotion (The Sociological Lens):**
          *   Can you design feelings? No. You design *rituals* that *invite* feelings.
