prompt: |-
  ok so I'm a junior in philosophy and I'm in a formal ep seminar right now where we just covered the reference class problem, and I'm also interning part time at our state weather service where every shift I have to put out a probability forecast with an interval (like "65% chance of precip in the next 24h, 80% interval for the high is 71 to 83") and my lead keeps going "which reference class did you use for that number?" and I have no principled way to answer. I know the textbook stuff about the specificity principle and how you can nest reference classes as finely as you like, but none of that tells me what to actually do at my desk at 5am.

  Can you write a decision procedure I can run before I sign off on a number: the questions to ask in order, what counts as a good enough answer to each, where the procedure stops and says "don't issue a number," and where it just has to hand off to a human because the question is one of judgment not fact. The thing I really want handled honestly is the tradeoff between a narrow, relevant class (like "days in April when the upper air pattern looks like this") and a broad, data-rich one (like "all April days") — the narrow one is more on point but I might have like 9 examples, the broad one has plenty but is full of junk. I want the procedure to say explicitly when a small sample in a narrow class is a dealbreaker and when it isn't, and to flag which steps are basically judgment calls dressed up as procedure.

  Then run it on two cases: (1) a 3-day heat wave probability for a city that only has 30 years of records, and (2) a "1 in 50 year flood" probability for a river where a dam upstream got built 20 years ago and totally changed the flow regime. I'd expect one of those to come out as "you cant responsibly issue that number" and that's fine, I want to see the procedure actually say that when it applies.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case studies:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Junior Philosophy Major, Formal Epistemology Seminar student, Part-time Intern at State Weather Service.
      *   **Context:** Struggling with the *Reference Class Problem* (RCP) in a practical, high-stakes setting (weather forecasting).
      *   **Problem:** The lead meteorologist keeps asking "Which reference class?" The user knows the theory (specificity principle, nesting) but lacks a *practical decision procedure* for 5 AM shifts.
      *   **Core Tension:** Narrow/Relevant Class (small $N$, high relevance) vs. Broad/Data-Rich Class (large $N$, low relevance).
      *   **Requirements:**
          1.  A step-by-step decision procedure (questions in order, stopping conditions, hand-off points).
          2.  Explicit handling of the sample size vs. relevance trade-off.
          3.  Identification of judgment calls vs. factual checks.
          4.  Application to two specific cases:
              *   Case 1: 3-day heat wave (30 years of records).
              *   Case 2: 1-in-50-year flood (dam built 20 years ago).
          5.  Expectation: One case should result in "Do not issue a number."

  2.  **Deconstruct the Reference Class Problem (RCP) in Meteorology:**
      *   *Theoretical RCP:* Any individual event belongs to infinite classes. Frequencies differ across classes. Which one determines the probability?
      *   *Practical Meteorology:* We use ensemble modeling, climatology, and analogs. The "reference class" is effectively the set of past situations or model runs deemed similar to the current one.
      *   *The Intern's Dilemma:* They are likely issuing *calibrated* probabilities (frequentist-ish) but need to justify the *class* from which the frequency is drawn.
      *   *Key Constraint:* Operational forecasting requires timeliness. The procedure can't be infinite regress.

  3.  **Drafting the Decision Procedure (The "RCP Triage Protocol"):**
      *   *Goal:* Move from abstract philosophy to a checklist.
      *   *Structure:*
          *   Phase 1: Stability Check (Is the system stationary?).
          *   Phase 2: Class Definition (What are we counting?).
          *   Phase 3: Sample Size vs. Relevance (The core tension).
          *   Phase 4: Calibration/Validation (Does this class predict well?).
          *   Phase 5: The "Go/No-Go" Decision.
      *   *Addressing the Trade-off:* Need a threshold for $N$. In stats, $N < 30$ is usually shaky for normal approximations, but in weather, analogs are often fewer. Let's set a "Hard Floor" and a "Caution Zone."
      *   *Judgment Calls:* Must explicitly label where human intuition overrides the algorithm.

  4.  **Refining the Procedure (Self-Correction/Iterative Design):**
      *   *Critique:* Is this too statistical? The user is a philosopher.
      *   *Adjustment:* Keep the language precise but operational. Acknowledge the *principle of indifference* vs. *principle of direct inference*.
      *   *The "Stop" Condition:* Crucial. When do we say "I can't quantify this"? When the underlying assumptions (stationarity) are violated.
      *   *The "Hand-off":* When the procedure hits a judgment call (e.g., "Is this analog close enough?"), it needs to flag that a senior meteorologist must sign off.

  5.  **Developing the Case Studies:**

      *   **Case 1: 3-Day Heat Wave (30 years of records).**
          *   *Data:* 30 years $\times$ ~90 days (June-Aug) = ~2700 potential days.
          *   *Event:* 3-day heat wave.
          *   *Reference Class:* "Days in June-August with similar pressure patterns."
          *   *Analysis:* 30 years is generally considered the standard "climate normal" period. Stationarity is *mostly* okay (though climate change is creeping in). Sample size for specific heat waves might be small, but broad enough for a probability.
          *   *Verdict:* Proceed, but with caveats (climate trend adjustment).

      *   **Case 2: 1-in-50-Year Flood (Dam built 20 years ago).**
          *   *Data:* 30 years total, but dam changed regime 20 years ago.
          *   *Effective Data:* Only 20 years of *relevant* data.
          *   *Event:* 50-year flood (2% annual exceedance probability).
          *   *Reference Class:* "Years with flow regime X."
          *   *Analysis:* You cannot estimate a 50-year event reliably with 20 years of non-stationary data. The reference class "Pre-dam" is irrelevant. The reference class "Post-dam" is too short ($N=20$) for a $1/50$ event. Stationarity is violated.
          *   *Verdict:* **DO NOT ISSUE.** This matches the user's expectation.

  6.  **Writing the Response:**
      *   *Tone:* Professional, respectful of the philosophical background, but grounded in operational reality.
      *   *Formatting:* Clear headers, bold text for decision points, distinct sections for the procedure and the cases.
      *   *Philosophical Integration:* Briefly mention Reichenbach or Kyburg to validate their seminar knowledge, but pivot quickly to "operational epistemology."

  7.  **Final Review against Constraints:**
      *   Decision procedure included? Yes.
      *   Questions in order? Yes.
      *   Stop conditions? Yes.
      *   Judgment calls flagged? Yes.
      *   Trade-off (Narrow vs. Broad) handled? Yes (via the "Relevance-Size Matrix").
      *   Two cases run? Yes.
      *   One case says "Don't issue"? Yes (The Flood case).

  8.  *(Self-Correction during drafting)*: Make sure I don't confuse *ensemble forecasting* (model runs) with *climatological forecasting* (historical analogs). The prompt implies historical frequencies ("reference class"), so I should focus on the climatological/analog side, as that's where RCP bites hardest. Ensemble spread is a different kind of probability (propensity/subjective). I will frame the procedure around *Historical Analog Frequency* since that fits the "reference class" framing best.

  9.  *(Refining the "Judgment Call" flags)*: I need to make sure the user knows *why* it's a judgment call. It's usually about defining "similarity."

  10. *(Final Polish)*: Ensure the distinction between *aleatory* (randomness of weather) and *epistemic* (uncertainty about the model/class) is clear, as a philosophy student will care about that distinction.

  *(Proceed to generate output based on these thoughts.)*
answer: |-
  This is a classic collision between formal epistemology and operational reality. In the seminar, the Reference Class Problem (RCP) is a paradox; at the weather service, it's a liability issue. Your lead isn't asking for a dissertation on Reichenbach; they are asking for **defensibility**. If the forecast fails, can you justify the population from which you drew the frequency?

  Below is an operational decision procedure designed for a 5 AM shift. It prioritizes **stationarity** (is the system stable?) and **effective sample size** (do we have enough data?) over theoretical perfection.

  ### The RCP Triage Protocol (Operational Version)

  **Goal:** Determine if a probabilistic forecast is epistemically warranted or if it should be withheld/qualified.
  **Inputs:** Current atmospheric state, Historical Database, Event Definition.

  ---

  #### Phase 1: The Stationarity Check (The "Hard Stop")
  *Before counting anything, verify the rules of the game haven't changed.*

  **Q1: Has the physical system generating the data changed fundamentally within the record period?**
  *   **Check:** Infrastructure changes (dams, levees, urbanization), instrument changes, or known climate regime shifts.
  *   **Pass:** System is physically consistent over the record.
  *   **Fail:** System has changed (e.g., a dam now controls the flow).
  *   **Action if Fail:** **STOP.** Do not issue a frequentist number based on the full historical record. You must model the new system physically or issue a qualitative statement. *This is a factual check, not a judgment call.*

  **Q2: Is the event definition consistent with the historical recording method?**
  *   **Check:** Are we measuring "precipitation" the same way we did 50 years ago? (e.g., sensor sensitivity, observation time).
  *   **Pass:** Measurement standards are homogeneous.
  *   **Fail:** Standards changed significantly.
  *   **Action if Fail:** **STOP** or truncate data to the post-change period.

  ---

  #### Phase 2: Reference Class Construction (The "Relevance-Size Tradeoff")
  *Here is where you balance specificity against sample size.*

  **Q3: What is the "Maximally Specific" class that still retains physical relevance?**
  *   **Procedure:** Start with the narrowest physically meaningful description (e.g., "April days with 500mb trough at 95W").
  *   **Judgment Call Flag ⚠️:** Defining "similarity" in atmospheric patterns is subjective. *Consult the senior meteorologist on duty to validate the analog criteria.*

  **Q4: What is the Effective Sample Size ($N_{eff}$) of this class?**
  *   **Procedure:** Count the historical occurrences matching Q3 within the stationary period (from Phase 1).
  *   **Thresholds:**
      *   **$N_{eff} < 10$:** **RED ZONE.** Too small for frequency-based probability.
      *   **$10 \le N_{eff} < 30$:** **YELLOW ZONE.** Usable only with wide confidence intervals or Bayesian smoothing.
      *   **$N_{eff} \ge 30$:** **GREEN ZONE.** Statistically robust for operational use.

  **Q5: If in the RED or YELLOW Zone, can you broaden the class without violating physical relevance?**
  *   **Procedure:** Relax the constraints (e.g., change "April" to "Spring," or "95W" to "90W-100W").
  *   **Judgment Call Flag ⚠️:** Deciding *which* constraint to relax is a physical judgment. Does relaxing the longitude matter more than relaxing the month? *Requires Senior Sign-off.*
  *   **Stop Condition:** If broadening the class makes the situations physically incomparable (e.g., mixing winter and summer storms), **STOP.** Do not issue the number. It is better to be vague than precise-but-wrong.

  ---

  #### Phase 3: Calibration and Output
  *Final validation before signing.*

  **Q6: Does this class have a history of predictive skill?**
  *   **Check:** Have forecasts based on this reference class verified well in the past (Brier Score/Reliability Diagram)?
  *   **Pass:** Class is known to be skillful.
  *   **Fail:** Class is known to be noisy or unskillful.
  *   **Action if Fail:** Downgrade confidence or widen the interval.

  **Q7: Final Decision.**
  *   **Issue Number:** If Phase 1 Passed AND ($N_{eff} \ge 30$ OR Senior Meteorologist approves Yellow Zone).
  *   **Issue Qualified Number:** If Phase 1 Passed AND $N_{eff}$ is low, but physical reasoning is strong. (e.g., "65% chance, low confidence due to limited analogs").
  *   **Withhold Number:** If Phase 1 Failed OR Class cannot be broadened without violating physics.

  ---

  ### Case Study Run-Throughs

  Here is how you apply the protocol to your two specific scenarios.

  #### Case 1: 3-Day Heat Wave Probability
  *   **Context:** City with 30 years of records. Forecasting probability of a 3-day heat wave in the upcoming week.
  *   **Reference Class:** "Days in summer months with similar high-pressure ridge intensity."

  **Phase 1: Stationarity**
  *   **Q1 (System Change):** No dams or major land-use changes affecting *temperature* significantly. (Climate change is a trend, but usually treated as a slow drift rather than a step-change for 3-day weather). **PASS.**
  *   **Q2 (Measurement):** Thermometer standards consistent. **PASS.**

  **Phase 2: Class Construction**
  *   **Q3 (Specificity):** "July/August days with 500mb height > 5900m."
  *   **Q4 (Sample Size):** 30 years $\times$ ~60 days (July/Aug) = 1,800 total days. Even if only 10% match the pressure pattern, $N \approx 180$. **GREEN ZONE.**
  *   **Q5 (Broadening):** Not needed. $N$ is sufficient.

  **Phase 3: Output**
  *   **Q6 (Skill):** Heat waves are generally well-predicted by persistence and climatology.
  *   **Decision:** **ISSUE NUMBER.**
  *   **Note:** You might add a small adjustment for the long-term warming trend (non-stationarity of the mean), but the reference class is robust enough to support the frequency claim.

  ---

  #### Case 2: "1-in-50 Year" Flood Probability
  *   **Context:** River with 30 years of records. Dam built 20 years ago.
  *   **Reference Class:** "Annual maximum flow events."

  **Phase 1: Stationarity**
  *   **Q1 (System Change):** **FAIL.** A dam fundamentally alters the flow regime (attenuates peaks, changes timing). The physics of the river *before* the dam are irrelevant to the river *after* the dam.
  *   **Action:** Truncate data to the post-dam period (20 years).

  **Phase 2: Class Construction (on Truncated Data)**
  *   **Q3 (Specificity):** "Years with post-dam flow regime."
  *   **Q4 (Sample Size):** $N = 20$ years.
  *   **Event:** "1-in-50 Year Flood" (2% Annual Exceedance Probability).
  *   **Analysis:** You are trying to estimate a tail event (50-year recurrence) with a dataset that only covers 20 years.
      *   To estimate a 50-year event, you generally need a record length of at least 50+ years to avoid massive variance in the estimate.
      *   With $N=20$, the "1-in-50" number is an extrapolation, not a frequency.
  *   **Q5 (Broadening):** Can you broaden the class?
      *   Option A: Include pre-dam data? **No.** Violates physical relevance (Phase 1 Fail).
      *   Option B: Use regional data (nearby rivers)? **Maybe,** but requires hydrological modeling to normalize for basin size. This moves beyond simple reference class frequency into modeling.
      *   **Stop Condition:** You cannot broaden the *historical frequency* class without including irrelevant data (pre-dam).

  **Phase 3: Output**
  *   **Decision:** **DO NOT ISSUE A FREQUENCY NUMBER.**
  *   **Reasoning:** The Reference Class "Post-Dam Years" is too small ($N=20$) to support a probability claim about a 1-in-50 event. The uncertainty bounds would be so wide (e.g., 0.1% to 10%) that the number "2%" is misleadingly precise.
  *   **Alternative:** Issue a scenario-based statement (e.g., "If inflow exceeds X, the dam will spill Y") rather than a probabilistic return period.

  ### Summary for your Lead
  When they ask "Which reference class?" tomorrow at 5 AM, you don't need to recite Kyburg. You say:

  > "I used the **post-dam flow regime class**. However, the effective sample size is 20 years, which is below the threshold for a 50-year return period estimate. The system is non-stationary relative to the full record. Per the triage protocol, I am flagging this as **epistemically unsupported** for a precise probability number."

  That tells them you understand the math, the physics, and the limits of your own knowledge. That is what a philosopher-intern should sound like.
