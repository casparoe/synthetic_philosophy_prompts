answer: |-
  1. RWEU replaces the linear probability weight in expected value with a convex or concave function applied to the cumulative survival curve, effectively altering the marginal contribution of each outcome based on its rank rather than its frequency. The calibration of this distortion function relies on revealed preference over gambles rather than observed frequencies, marking it as a normative parameter without a clean empirical counterpart in the data generating process.

  2. The risk parameter describes the agent's attitude toward the distribution of outcomes, not the objective shape of the distribution itself, so conflating them leads you to mistake a policy choice for a statistical discovery. If you treat this parameter as empirical, you will falsely believe you have measured a property of the grant portfolio when you have only specified your tolerance for distortion in the cumulative probability function.

  3. Applied decision-by-decision, the rule favors the tail grant differently than when applied to the aggregate portfolio of the indefinite run, creating a dynamic inconsistency where the ex-ante optimal strategy becomes ex-post irrational. This costs the foundation either coherence across time or the ability to maximize the specific risk-weighted value it committed to initially, forcing a choice between local responsiveness and global commitment.

  4. Arguments about dominance violations and diachronic consistency cannot be expressed in your vocabulary because they concern logical coherence of preferences rather than the frequency of outcomes or the efficiency of capital allocation. Your framework assumes rationality is about maximizing empirical returns over time, whereas these objections claim the rule violates the basic arithmetic of combining probabilities regardless of the payoff structure.

  5. The disagreement is thinner than it looks, as what philosophers call risk-weighting is often just a clumsy formalization of the constraints and liquidity preferences already embedded in your hits-based funding logic. What remains is not a blind spot in science, but a category error where you are trying to solve a normative budgeting problem with descriptive statistical tools.
