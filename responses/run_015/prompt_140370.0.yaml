answer: |-
  Subject: Thoughts on the optimism bias uplift and the reading group discussion

  It is genuinely fascinating that your volunteer work and your philosophy reading group have collided like this, because you have put your finger on a tension that most bureaucratic processes work hard to obscure. The implicit epistemology of the optimism bias rule is that individual judgment is systematically unreliable in a specific direction, while aggregate historical data is robust enough to correct it. By requiring you to start with your inside-view estimate and then apply a percentage derived from the outside view, the guidance presupposes that your specific knowledge of the archive project is insufficient to overcome the statistical gravity of similar projects failing to meet their targets. However, the practice does not actually require you to believe the uplifted number is the true expected value. Instead, it treats the number as a planning constraint rather than a truth claim. This is where the epistemology becomes optional. The rule allows you to maintain your inside-view belief about what will actually happen while simultaneously committing to a budget that accounts for what usually happens. This separation lets both the epistemic modestist, who defers to the base rate, and the confident planner, who trusts their specific preparations, sign off on the same document. The modestist sees the uplift as a correction to belief, while the confident planner sees it as a risk premium paid to the council to insure against uncertainty.

  When you ask whether the rule is about calibration or incentives, the structure suggests it is primarily about incentives wrapped in the language of calibration. If the goal were purely epistemic correction, the escape hatch you mentioned would be incoherent. Allowing you to reduce the uplift by documenting management controls reintroduces the very inside-view factors the rule was meant to override. This implies the rule is not actually asserting that your estimate is wrong, but rather that you must earn the right to claim it is right by accepting accountability for specific risk mitigations. It is a mechanism for transferring risk ownership rather than refining truth. This creates the incentive problem you identified. Because the uplift is public and formulaic, it encourages teams to inflate the base estimate knowing the percentage will be applied on top. The base number ceases to be an estimate and becomes a negotiating position. Furthermore, since the historical data used to calculate the uplift comes from projects managed under previous versions of the same incentive structure, the data itself is contaminated by the very gaming behavior the rule attempts to correct. This creates a feedback loop where the uplift measures past inflation as much as past optimism.

  The asymmetry you noticed regarding costs versus benefits is perhaps the most revealing feature of the practice. The guidance defines bias as including overestimating benefits, yet no one is asked to apply a pessimism bias to the projected usage or community value of the library branch. This confirms that the exercise is not about achieving an accurate picture of the future, but about avoiding the specific political scandal of a budget overrun. The epistemology here is pragmatic rather than truthful. It presupposes that the cost of asking for more money later is higher than the cost of securing too much money now. If the practice were coherent in its outside-view storytelling, you would start with the base rate for costs rather than your own estimate, and you would apply a symmetric discount to the expected benefits based on the reference class of similar projects failing to deliver value. The fact that you start with your own number and only adjust the costs indicates that the uplift is a convention for budget sizing, not a belief update. It is a way to size the bond without requiring the council to admit that they distrust the volunteers' numbers.

  So where is the practice genuinely underdetermined? It lies in the distinction between the working estimate and the budget estimate. You can reasonably tell your reading group that the rule does not demand you abandon your inside-view judgment about the archive work. You can hold that your estimate is the most likely outcome while accepting the uplifted number as the appropriate commitment for public funds. This allows you to satisfy the requirement for epistemic modesty without engaging in self-deception. However, if your committee actually believed the outside-view story rather than treating it as a spreadsheet convention, several things would have to change. You would not spend time refining your base estimate beyond what is necessary to categorize it for the reference class, because the base rate would be the primary predictor. You would also produce a parallel estimate for benefits that applies a discount rate derived from the failure rates of similar community projects. Finally, you would treat the escape hatch not as a way to reduce the number, but as a way to justify moving to a narrower reference class, acknowledging that the default uplift is the true expected value unless you can prove your project belongs to a statistically different population.

  For your next meeting, I suggest framing the uplift not as a correction to your team's competence, but as a pricing of uncertainty. This preserves your group's morale while acknowledging the reality of the process. You can explain that the base estimate is your best technical judgment, while the uplift is the cost of the variance inherent in public capital projects. This avoids the philosophical trap of having to declare your own judgment biased while still complying with the guidance. It also sidesteps the incentive problem by making it clear that the base number is a technical input, not a target. If you treat the uplift as a risk premium rather than a bias correction, you do not need to solve the reference class problem perfectly. You only need to agree on which class represents the appropriate level of risk pricing. This allows the committee to function without requiring everyone to adopt the same epistemological stance on the reliability of their own judgment. You can proceed with the work knowing that the number on the council agenda is a policy tool, not a prediction, and that your integrity as estimators remains intact within the working documents even if the public face of the project carries a heavy cushion.

  I hope this helps clarify the collision you are feeling. It is rare to see the machinery of public administration laid bare like this, and your reading group has given you the perfect vocabulary to dissect it. Let me know how the meeting goes.

  Best regards

