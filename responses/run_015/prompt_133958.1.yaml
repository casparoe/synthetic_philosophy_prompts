  Case 1 (Standard Newcomb): A transparent predictor fills Box B with $1,000,000 only if it predicts she will take only Box B. She knows the predictor is highly accurate. Dr. K. says she should one-box.

  Case 2 (Counterfactual mugging): A mugger will attack her only if it predicts she will not pay a $100 ransom; if she pays, she is unharmed but out $100. She is currently facing the mugger. Dr. K. says she should pay.

  Case 3 (Transparent Newcomb with prior observation): The boxes are transparent. If she has not looked, she should one-box. If she has already looked and seen Box B is full, she should take both boxes; she treats this as a genuinely different decision problem from Case 1, not as hypocrisy.

  Case 4 (Coordinated copies): Two computational copies of her are run in isolated rooms. Only one copy receives a reward, and it receives it if and only if both copies make the identical choice. Each copy updates on being in its own room. Dr. K. endorses a precommitment strategy that both copies should follow, even though neither can causally influence the other.

  Case 5 (Harmful update pill): She can take a pill that causes her to update on future evidence in a way that violates causal decision theory but has no direct causal effect on the world. The update would lead her to make worse future choices. Dr. K. says she should refuse the pill, emphasizing that the reasoning process itself should not be corrupted for epistemic gain.

