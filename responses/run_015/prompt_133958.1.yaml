  ### 1. Three Decision-Theoretic Rules Consistent with Cases 1–5

  To account for Dr. K.'s specific pattern of verdicts—specifically the tension between updateless policy optimization (Cases 1, 2, 4) and evidential updating upon observation (Case 3), constrained by algorithmic integrity (Case 5)—we can construct the following three rules:

  **Rule A: Conditional Updateless Policy (CUP)**
  *   **Definition:** An agent should select the decision policy that maximizes expected utility from the ex-ante prior perspective. However, this policy may include conditional clauses that switch to local expected utility maximization if direct observation logically severs the subjunctive dependence between the agent's algorithm and the predictor's output.
  *   **Consistency:**
      *   *Cases 1, 2, 4:* The prior optimal policy is to one-box, pay the mugger, and coordinate with copies.
      *   *Case 3:* Seeing the money constitutes an observation that severs the subjunctive link (the money is already there), triggering the conditional clause to two-box.
      *   *Case 5:* Refusing the pill is part of the optimal ex-ante policy to maintain algorithmic reliability.

  **Rule B: Evidential Decision Theory with Binding Precommitment (EDT-B)**
  *   **Definition:** An agent should maximize conditional expected utility $E[U | Act]$. However, where possible, the agent binds themselves ex-ante to the act that maximizes this value before specific evidence is received. If new evidence fundamentally alters the conditional probabilities (e.g., by confirming the state of the world independent of the act), the binding is released.
  *   **Consistency:**
      *   *Cases 1, 2, 4:* Precommitment ensures the high-utility correlation is maintained.
      *   *Case 3:* Visual observation updates the conditional probability $P(\text{Box Full} | \text{Two-Box})$ to 1, releasing the binding.
      *   *Case 5:* Taking the pill lowers the expected utility of future reasoning processes, so it is refused.

  **Rule C: Subjunctive Causal Integrity (SCI)**
  *   **Definition:** An agent should act to causally produce the best outcome, treating logical correlations between their reasoning trace and external predictors as causal links. However, the agent must not employ strategies that decouple the reasoning trace from the actual decision architecture, as this violates the integrity condition required for the logical link to hold.
  *   **Consistency:**
      *   *Cases 1, 2, 4:* Logical correlations are treated as causal, supporting one-boxing and coordination.
      *   *Case 3:* Physical observation overrides the subjunctive link, reverting to standard causal dominance.
      *   *Case 5:* The pill corrupts the reasoning architecture, violating the integrity condition; thus, it is refused.

