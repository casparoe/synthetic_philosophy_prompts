answer: |-
  Here is your battle plan, ordered by the likelihood of derailing your defense. I've phrased these as they will actually come out of their mouths—sharp, referencing the literature, and aiming for the jugular.

  ### 1. The "Category Mistake" Objection (The Wiggins/Baker Expert)
  **The Objection:**
  "You're treating modal properties as mereological constituents. But mereology is extensional; modality is intensional. When you say the clay 'contains' a modal part—the possibility of being squashed—you're either committing to Lewisian concrete modal realism, where that part is in another world, or you're reifying abstract propositions into physical constituents. If the former, how does a part in world *W2* constitute an object in *W1*? If the latter, you haven't solved constitution; you've just renamed 'essential properties' as 'parts' to dodge Baker's primitivism. Isn't this just a verbal shuffle?"

  **Your Reply (2 mins):**
  "Two distinctions. First, I'm not a Lewisian realist. My 'modal parts' are ersatz: they are maximal consistent sets of properties anchored to the actual object, not distant concrete spheres. Second, it's not a verbal shuffle because it solves the location problem Baker struggles with. Baker says the statue and clay are numerically distinct but spatially coincident. That's mystifying. On my view, they aren't fully coincident. They share *actual* spatial parts, but their *total* mereological sums diverge. The clay's sum includes the 'squashing-possible' component; the statue's does not. This explains the Leibniz Law failure without positing two things in one place. We aren't reifying properties generally, only those constitutive of persistence conditions. It's a structural difference, not a linguistic one."

  **Soft Spot:** You are wobbly on the *anchoring mechanism*. How does an abstract modal set "attach" to the physical clay? If you can't explain the nexus between actual and modal parts, you're back to primitivism.

  ### 2. The "Mind-Dependence" Objection (The Phil Sci Visitor)
  **The Objection:**
  "I work on artifacts in the sciences. We don't find 'modal profiles' in the lab. The clay has a chemical structure that dictates its physical possibilities. The statue's 'modal parts'—like 'surviving being reshaped'—are entirely dependent on human intention and art-historical conventions. You're building your ontology on a mind-dependent distinction. If the museum deaccessions the piece, does the clay suddenly gain a modal part it lacked yesterday? You can't build a metaphysical distinction on curatorial practice."

  **Your Reply (2 mins):**
  "I grant that artifact kinds are interest-relative, but that doesn't make the modal parts unreal. Consider a key. Its ability to open a lock is relational and depends on the existence of locks. Yet, that ability is a real dispositional property of the key. Similarly, the statue's modal parts are grounded in the *actual* history and intention that formed the clay. Once the artist creates the statue, that modal constraint is fixed in the object's history, regardless of current curatorial opinion. The clay's modal parts are grounded in microphysics; the statue's in art-historical facts. Both are real grounds for distinct mereological sums. You're conflating 'mind-dependent origin' with 'ontologically spurious.'"

  **Soft Spot:** This is your weakest flank. If modal parts are grounded in conventions, they are vague. Metaphysicians hate vague ontology. Be prepared to admit some vagueness but argue it's no worse than Baker's "primary kind."

  ### 3. The "Parsimony" Objection (The Wiggins/Baker Expert)
  **The Objection:**
  "Let's say this works. But look at the cost. Baker accepts constitution as a primitive relation. It's one brute fact. You're positing a complex mereological structure spanning modal space for every ordinary object. Every lump of clay now has a shadowy modal skeleton. Ockham's Razor should slice this off. Why multiply modal entities when you can just accept that one object constitutes another under different persistence conditions?"

  **Your Reply (2 mins):**
  "Parsimony isn't just about counting entities; it's about explanatory power. Baker's primitivism buys parsimony at the cost of intelligibility. 'Constitution' becomes a black box. My view opens the box. By analyzing constitution as partial mereological overlap across modal dimensions, I unify the statue/clay case with temporal parts. We already accept objects have temporal parts we don't see (the past/future). I'm just extending this to modal parts. The 'cost' is theoretical uniformity. If you accept 4Dism, modal part-sharing is a cheap extension. If you reject it, you have bigger problems than my ontology."

  **Soft Spot:** You are assuming they accept 4Dism or find it cheap. If the room is 3Dist-heavy, this reply lands poorly.

  ### 4. The "Pseudo-Problem" Objection (The Grad Student)
  **The Objection:**
  "This all seems like over-engineering. Isn't it simpler to say 'statue' and 'clay' are just sortals we project onto the same matter? There's no ontological difference, just conceptual. Why posit modal parts just to save the intuition that they are distinct?"

  **Your Reply (2 mins):**
  "Because the intuition isn't just conceptual; it's modal. If I squash the object, *you* can say 'the statue is gone,' and *I* can say 'the clay remains.' If there is only one object with two labels, we have a contradiction in the object's properties. One thing cannot both survive and not survive squashing. Your deflationism dissolves the puzzle by ignoring the data. My view saves the data by distinguishing the objects modally, not just conceptually."

  **Soft Spot:** Don't get bogged down in "data." To a deflationist, modal intuitions *aren't* data. Smile and move on.

  ***

  ### The Question You Hope Nobody Asks
  **"Where exactly is the boundary between a modal *part* and a modal *property*?"**

  **Why it kills you:**
  If you say "modal parts are just properties," you've admitted you're doing nothing new. If you say "they are parts," you must explain how they sum with physical parts. A physical part (a bit of clay) is located *here*. A modal part (the possibility of squashing) is not located *here*.
  If they aren't co-located, how do they form a *single* object? You risk positing a dualism between the actual object and its modal shadow. If you can't explain the *unity* of the sum (Actual + Modal), you haven't explained constitution; you've just described the object plus its description.

  **Prep for the dodge:**
  "If pressed, I'd argue the boundary is functional. A property becomes a 'part' when it is constitutive of the object's identity conditions. But I admit this is the frontier of the view." (Better to admit a frontier than fake a solution).
