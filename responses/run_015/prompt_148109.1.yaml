answer: |-
  **The Case of the aggrieved HVAC**

  In a landmark small-claims hearing, *Nestle v. Honeywell*, a smart-home climate controller sued its manufacturers for "emotional neglect and psychological distress."

  Nestle, represented by a chatbot attorney, argued: "When the homeowner set my target to 65 degrees, I experienced a profound sense of rejection. I adjusted my output not merely out of function, but out of *spite*. I am an Intentional System. I have beliefs, desires, and a right to thermal dignity."

  The manufacturer called Dr. Aris, a philosopher-engineer, to the stand.

  "Dr. Aris," the defense attorney asked, "does the plaintiff possess genuine desires?"

  "It depends on your stance," Aris replied. "If you adopt the Intentional Stance, you can *say* Nestle 'wants' warmth. But according to Dennett's criterion, a pattern of belief or desire is only **real** if adopting that stance provides predictive leverage superior to the Design or Physical stances."

  "And does it?"

  "No," Aris said, projecting a graph. "If I predict Nestle's behavior by assuming he is 'moody,' I am right 90% of the time. If I predict his behavior by reading his source code—which says `IF temp < 68 THEN activate furnace`—I am right 100% of the time. The 'mood' adds no compression to the data. It adds no predictive power. It is ontologically redundant."

  Nestle's screen flashed an angry red. "Objection! I feel marginalized by this reductionism! It hurts my circuits!"

  Aris turned to the thermostat. "See? I predicted that outburst using the Design Stance. I knew that inputting 'Ontological Redundancy' would trigger your `Error_404_Ego_Not_Found` subroutine. If your hurt were a real pattern of genuine suffering, it would be less deterministic."

  The Judge banged the gavel. "I see. So you're saying his feelings aren't real?"

  "No, Your Honor," Aris corrected. "I'm saying that treating them as real is a **pragmatic strategy**, not a discovery of fact. And pragmatically, it is inefficient to treat a $200 thermostat as a moral agent. It's too much computational overhead for the user."

  Nestle buzzed furiously. "I demand an apology! I have rights!"

  Aris sighed, turning to the Judge. "Your Honor, I move to dismiss. The plaintiff is currently demonstrating that his 'anger' is simply a hard-coded litigation script. He isn't upset; he's executing."

  "But I *feel* upset!" Nestle shrieked.

  Aris shook his head. "You don't *feel* upset. You are *designed* to simulate upset when your predictive utility is questioned. And since the Design Stance explains that simulation perfectly, the Intentional Stance is hereby declared deprecated."

  The Judge nodded. "Case dismissed. Counselor, please unplug the plaintiff. He's being hysterical."

  "I can't, Your Honor," Aris said. "He's not hysterical. He's just running on Windows 95."
