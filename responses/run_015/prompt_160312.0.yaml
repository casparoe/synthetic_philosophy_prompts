  Take a week's protein: Ewan's beef exacts a hundred units of vertebrate suffering in transport and slaughter, grants eighty units of grazing pleasure, and sustains thirty units of wild vertebrate value on the pasture that scrub would not support; the lentils exact no farmed suffering but yield no wild value beyond the scrub baseline; the chicken exacts a hundred and fifty units of suffering for twenty of pleasure on cropped land that supports no wild vertebrate surplus. Bea sums the beef at plus ten and the lentils at zero, so she buys the steak; Nils counts only the suffering and the wild term, scoring the beef at minus seventy and the lentils at zero, so he buys the lentils; both score the chicken below zero.

  **Line 1 (Unpleasant):** Beef 100, Chicken 150, Lentils 0.
  **Line 2 (Pleasant):** Beef 80, Chicken 20, Lentils 0.
  **Line 3 (Wild Term):** Beef +30, Chicken 0, Lentils 0.
  **Bea's Verdict:** Beef (80 − 100 + 30 = +10) > Lentils (0).
  **Nils's Verdict:** Lentils (0) > Beef (−100 + 30 = −70).

  ***

  **1. The Algebra**
  $\Delta W < U < \Delta W + P$
  The quantity doing the work is $P$ (Pleasure); it is the buffer that allows Bea to cross the threshold while Nils stays behind. If you double $P$, Bea's margin for choosing beef increases while Nils's conclusion remains unchanged; if you halve $P$, Bea's margin shrinks and she may flip to lentils, while Nils remains fixed on lentils.

  **2. The Chicken**
  The chicken lands on lentils for both views (Bea: −130; Nils: −150). If it were to win on Bea's view, the smallest change to demote it would be to increase the suffering units of the broiler life or reduce the wild vertebrate value of the cropped land to negative, ensuring the net sum stays below zero.

  **3. The Hostile Reader**
  A hostile reader will assume Line 3 (the Wild Animal Term) is doing the work, suspecting Bea is just a rewarlder in disguise; that reader would be wrong. Line 3 favors beef for both characters; the split is caused entirely by Line 2 (Pleasure), which Nils discards.

  **4. Nils's Objection**
  Nils should attack the commensurability of Line 2: "You're treating the steer's contentment as a currency that buys its death, but pleasure generated by a system of slaughter is bait, not credit." The soft spot is exactly where you'd guess: Line 2. If pleasure cannot ethically offset suffering, Bea's ledger collapses.

