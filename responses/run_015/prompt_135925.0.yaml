  ### Part 6: The Missing Assumption

  You asked what both of them are missing. I believe they share a deep assumption that the Programmer hinted at but didn't fully articulate.

  **They both assume that Truth is a Property of Sentences.**
  Miriam thinks the property is "Groundedness." Dev thinks the property is "Consistency-Independence." The Programmer thinks the property is "Stability."

  **The Missing Insight: Truth is a Norm of Assertion.**
  The debate stalls because they are treating "true" as a label we stick on sentences to describe them. But many modern philosophers (like Robert Brandom or Huw Price) argue that "true" is not a description; it is a **tool for commitment**.
  *   To say "S is true" is to endorse S.
  *   To say "S is false" is to reject S.

  **Why this changes everything:**
  If truth is about *commitment*, the Liar isn't a puzzle about the world; it's a puzzle about **rules of conversation**.
  *   **Miriam's mistake:** She thinks she must find a value (Gap) to avoid contradiction. But if truth is normative, she should say: "You are not permitted to assert L." She doesn't need a metaphysical "gap"; she needs a rule of prohibition.
  *   **Dev's mistake:** He thinks he must accept the contradiction to be expressive. But if truth is normative, he should say: "Asserting L commits you to rejecting L." He doesn't need a metaphysical "glut"; he needs to accept that some commitments are incoherent.

  **The Shared Blind Spot:**
  They are both trying to solve a **normative problem** (what should we believe/assert?) with a **semantic solution** (what is the truth value?).
  *   The "cost" of Dev's view (loss of exclusion) is only a cost if "not" describes the world. If "not" expresses a stance of rejection, Dev can still reject contradictions even if they are "true" in his logic.
  *   The "cost" of Miriam's view (Revenge) is only a cost if she needs to describe the gap. If she simply treats the Liar as "unassertible," she doesn't need to say "It is not true" (which triggers revenge); she just refuses to assert it.

  **Final Advice for the Group:**
  Tell Miriam and Dev that they are fighting over the map, but the territory is the *practice* of reasoning. The whiteboard note shows that language can create loops that break our standard scoring systems.
  *   Miriam is right to protect the scoring system (logic).
  *   Dev is right to protect the game (language).
  *   The Programmer is right that the game is dynamic.

  The solution isn't to find the right value for Line 1. The solution is to recognize that Line 1 is a **move that breaks the game**. The question "Is Line 1 true?" presupposes that Line 1 is a move that *can* be scored. The deepest philosophical lesson here is that some sentences are not truth-apt; they are logical hazards. Whether you call that a "Gap," a "Glut," or an "Oscillation," the practical advice is the same: **Do not assert it.**

  In that sense, they are all right about the danger, and all wrong to think the danger can be safely domesticated into a theory without cost. The cost is the price of having a language powerful enough to talk about itself.
