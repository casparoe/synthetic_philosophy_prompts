answer: |-
  1. This project asks whether the capacity to distinguish universal moral wrongs from local conventional norms is a culturally variable skill rather than a universal human constant. Specifically, we investigate if reflexive moral calibration is unevenly distributed across WEIRD and non-WEIRD populations.
  2. The standard standoff fails because it assumes equal access to moral reasoning tools across cultures while debating the outputs of those tools. Ignoring the distribution of the meta-cognitive skill itself renders both objectivity and relativism claims premature.
  3. Our method pairs rigorous conceptual analysis of moral ontology with a structured comparison of folk moral reports across diverse philosophical traditions. We will map how different cultures articulate the boundary between intrinsic wrongs and group-specific rules.
  4. The primary deliverable will be a framework for policymakers to assess whether moral conflicts stem from genuine value divergence or differing meta-cognitive calibration. This tool will aid in designing moral education curricula that account for varied capacities to distinguish norm types.
  5. We acknowledge that six months is insufficient for empirical validation, so failure is defined as producing only a theoretical model without clear policy applications. Realistic scope is limited to synthesizing existing ethnographic data rather than generating new cross-cultural psychological experiments.
