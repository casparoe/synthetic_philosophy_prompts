      *   **Hui Shi (The "Ten Theses"):** Specifically, "Heaven and Earth are one" or "The ten thousand things are all one." This is a relativist/monist counterpoint. If all distinctions are conventional, then "White Horse" = "Horse" = "Everything." This undermines the *Mingjia* project of precise distinction by dissolving the distinctions entirely.
