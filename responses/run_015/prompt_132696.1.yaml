  4. Which way the scramble test cuts
  The scramble test actually subverts (6), though your friend read it backwards. Step (a) shows that the macro-history is *insensitive* to micro-details within the pattern's realization. This insensitivity is precisely what makes the pattern a robust cause. If the outcome depended on every micro-coordinate, the simmball description would be useless. The fact that you can scramble the micro-state without changing the macro-outcome proves the macro-state is doing the explanatory work. It demonstrates *multiple realizability*: many micro-states correspond to one macro-state, all producing the same effect. Step (b) is correct: you cannot change the pattern without changing the micro. But this does not mean the micro is the *only* cause; it means the macro is *realized by* the micro. The feature doing the work is robustness. The test demonstrates that the simmball captures the invariant features of the interaction that determine the outcome, filtering out irrelevant micro-noise. It confirms the simmball is the stable causal unit, not the fleeting micro-configuration. Your friend's conclusion confuses dependence with identity.

  5. What to say about the simmballs
  Simmballs are real causal agents because they function as stable constraints on the medium's evolution. Think of a vortex in a fluid: the vortex does not add energy, but its structure dictates how the fluid moves around it. If you remove the vortex structure (smooth the flow), the downstream effects change, even if total energy is conserved. Similarly, a gear ratio causes a specific torque relationship not by adding force, but by constraining motion. In your laboratory, when you measure pressure, you are measuring a macro-statistic that reliably predicts piston motion because the micro-states realizing that pressure are constrained to behave collectively. The simmball is the vehicle of this constraint. To say it causes effects is to say that had the simmball not been there (even if the medium were), the outcome would differ. This counterfactual dependence is the hallmark of causation, distinct from energy accounting. You trusted these patterns because they were reliable predictors of intervention outcomes. That reliability is what causation *is* in a scientific context. The simmball is not a ghost; it is a stable geometry of interaction that channels the medium's existing energy into specific pathways.

  6. Confidence
  I am highly confident that the category error between force and causation is the root fault. This diagnosis aligns with standard resolutions in philosophy of science regarding non-reductive physicalism. The point I am least sure of is whether you will find the counterfactual definition of causation satisfying compared to the mechanistic "push" model you used in the lab. Philosophers often accept dependency relations as causes; experimentalists often prefer mechanisms. However, since mechanisms rely on structural constraints, the shift should be manageable. The diagnosis holds regardless of the specific metaphysics of causation, provided causation isn't identical to energy transfer. You can remain a strict physicalist about matter while being a realist about patterns.
