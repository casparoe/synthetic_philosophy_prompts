answer: |-
  The water was too hot, steaming up the small kitchen window, but neither of them moved to turn it down. The clatter of stainless steel trays echoed in the silence between them. They'd been stacking crates for four hours at the food bank, and now the grease from the communal lasagna was sticking to their hands.

  "It's still the wife on the cliff," Jules said, scrubbing a baked-on rim. "You're dodging it."

  Marta sighed, snapping rubber gloves off. "I'm not dodging it. I'm saying that in A&E, if I have one dose of morphine and two patients screaming, I don't get to pick based on who reminds me of my brother. I pick based on who survives. If I stop to think, 'Actually, I love this one more,' someone dies. That's not integrity, Jules. That's negligence."

  "But you're not choosing between your kid and a stranger," Jules snapped. "That's the whole point. If you're standing there and your daughter is drowning, and you think, 'Well, the impartial calculus suggests I save my own genetic line to maximize societal stability,' you're a psychopath. You should just jump. The moment you justify it, you've ruined it. You've had one thought too many."

  "Okay, fine. In the heat of the moment, don't fill out a spreadsheet. But that doesn't mean the spreadsheet doesn't exist." Marta grabbed a towel. "Look, you proposed this ledger thing. Once a year. Sit down, decide how much of your life belongs to the world versus your own circle. Then spend the rest of the year ignoring it. You think that fixes it?"

  "I think it splits the difference," Jules said, turning off the tap. "It gives the morality people their audit. You get your impartiality check. But it lets me live the rest of the year without feeling like a hypocrite every time I buy my daughter a present instead of sending the money to malaria nets. I can just love her. No calculation in the moment."

  "It's deferred calculation," Marta said. "It's like deciding to drink a bottle of wine on Saturday so you can be sober during the week. You haven't stopped counting the units; you've just moved the guilt to a different day. And honestly? Deciding in advance that your daughter gets exactly forty percent of your loyalty feels colder than just loving her. You've already put a price tag on her."

  "It's not a price tag, it's a boundary. Without it, you're just running on instinct. What if your instinct is shit? What if your upbringing made you selfish?"

  "Then the ledger tells you to be less selfish. But can you actually do it?" Marta leaned against the counter. "Say the audit says you're overspending on your band. You're pouring hours into rehearsals while people starve. Can you actually love the music less on purpose? Can you wake up tomorrow and feel less passion for your guitar because the spreadsheet says so?"

  Jules paused. "No. Obviously not."

  "Then what's the ledger for? If you can't turn the dial, it's just a report card telling you you've failed. It doesn't change the action."

  "It changes the awareness!" Jules insisted. "It keeps you honest. Even if I can't love the music less, I know I'm indulging. I'm not pretending it's a moral duty."

  "Right, so it's purely about keeping your conscience clean. Which brings me to the app version." Marta crossed her arms. "You said what if an app just told you: 'Give £200 this month.' No reasoning, just the number. You follow it blindly. You say that's better because you don't have the corrupting thought."

  "It removes the ego," Jules said. "I'm not weighing my worth against a stranger. I'm just following a rule."

  "It feels worse, though," Marta said. "Why?"

  "Because..." Jules frowned, drying a plate aggressively. "Because it's blind. It feels like I'm opting out of being a moral agent. I'm just a dispenser."

  "Exactly. You want the freedom of the impulse without the responsibility of the justification. You want to save your wife because you love her, but you don't want to own the fact that loving her means not saving the stranger. The app lets you pretend the decision wasn't yours. But morality *is* owning the decision. Even the ugly bits."

  "But if the decision requires me to be a monster?" Jules turned to face her. "That's the other thing. The ledger might say: 'Take this job you hate for twenty years because the pay lets you donate more.' Or worse. Hurt one person to stop twenty others being hurt. Does the 'one thought too many' rule apply there? Or do I just shut up and calculate?"

  Marta looked down at her hands. "In triage, sometimes you let the guy with the worst injuries die so you can save the three guys with moderate injuries. It feels horrible. It feels like murder. But if I let sentimentality stop me, I'm choosing the feeling over the lives. So yeah, sometimes you have to swallow the horror."

  "But that's you," Jules said. "You're a nurse. You signed up to allocate scarce resources. I'm a carpenter. If the impartial math says I should spend my life building shelters for refugees instead of cabinets for rich wankers, and I refuse... am I immoral? Or am I just maintaining the integrity of the person who loves woodwork?"

  "If everyone did that, the shelters don't get built."

  "And if everyone did what you say, everyone becomes a functionary. Nobody loves anything specifically. They just love 'the good.' And who does that help? A world where nobody loves their own kid more than a stranger is a world where kids aren't loved properly."

  Marta rubbed her temples. "I'm not saying love them less. I'm saying admit that loving them more is a privilege. Don't pretend it's a virtue."

  "That's what the ledger does! It admits it's a privilege!"

  "Then why are you so defensive about it?" Marta challenged. "If it's just a ledger, why does the app version creep you out? Because the app reveals that you don't actually want to know the cost. You want the rule to protect you from seeing the blood on your hands."

  Jules was quiet for a moment. The fridge hummed. "Maybe. Or maybe because if I don't think about it, I can't be wrong. If the app says give £200, and I give £200, I'm safe. If I decide myself, I might mess it up. But if I decide myself, I'm also... me. Without the choice, I'm just a tool."

  "Okay," Marta said, softening. "I'll give you that. If you can't choose, you can't be good. You're just efficient. But Jules, what about the drifter? The guy with no kids, no band, no attachments. He doesn't have the 'one thought too many' problem. He doesn't have deep commitments to protect. Does he just have to give everything?"

  "If he doesn't care about anything, why should he care about morality?" Jules shrugged. "Maybe the integrity objection only works for people who have something to lose. If you're empty, impartiality doesn't cost you anything."

  "So morality is harder for good people?" Marta laughed bitterly. "The more you love, the more guilty you are? That seems fucked."

  "It's not guilt. It's tension. You can't resolve it. That's the point." Jules picked up a sponge, squeezed it out. "You want me to accept that my love for my daughter is essentially a selfish deviation from the optimal path. I want to say that love is the path. We're not going to agree."

  "I think..." Marta started, then stopped. She looked at the clean plates stacked between them. "I think I agree that the ledger is a cop-out. If you can't act on the numbers, crunching them is just mental hygiene. It makes you feel productive without changing the outcome. I was treating it like a budget, but you can't budget affection."

  "And I think..." Jules hesitated. "I think I'm scared that if I stop checking, I become a monster. Not because I'll hurt anyone, but because I'll become so wrapped up in my own little world that the suffering outside becomes invisible. The 'one thought' might be annoying, but maybe I need it to remind me that my circle isn't the whole world."

  "So you need the thought," Marta said, "but you don't want it to paralyze you in the moment."

  "Exactly. I need to know the cost, even if I can't pay it."

  "And I need to admit that sometimes I pick my own," Marta said. "Even when the math says otherwise. I pick my friends, my family. I just don't want to call it 'moral'."

  "Then what is it?"

  "Human," Marta said. "Maybe morality is the thing that tells you you're wrong, and being human is ignoring it sometimes to keep going."

  Jules dried the last plate. "That's a depressing way to live."

  "It's honest," Marta said. "You want integrity. I want impact. We're both going to fail."

  "Yeah," Jules said, hanging the towel up. "But at least we'll fail knowing why."
