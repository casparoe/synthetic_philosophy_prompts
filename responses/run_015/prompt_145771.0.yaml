answer: |-
  There is no single canonical term in epistemology or cognitive science that captures this phenomenon exactly, though it sits at the intersection of several well-documented concepts. Your description is precise enough that it warrants a specific carving.

  The closest existing concepts are **Instrumental Understanding** (from mathematics education), **Processing Fluency** (from cognitive psychology), and **Transactive Memory** (from social cognition). However, none fully capture the specific *structural* fragility you describe.

  Here is an analysis of the nearest neighbors, followed by a proposed conceptual carving for this specific failure mode.

  ### 1. The Nearest Existing Concepts

  **A. Instrumental vs. Relational Understanding (Skemp, 1976)**
  In mathematics education, Richard Skemp distinguished between *instrumental understanding* (knowing rules/steps without knowing why they work) and *relational understanding* (knowing both what to do and why).
  *   **Fit:** You have something hybrid. You understand the "why" of each step (the justifications are clear), but you lack the relational map of how the steps constitute a whole system.
  *   **Miss:** Skemp's distinction is usually about the *content* (math rules), not the *medium* of delivery (external AI vs. internal mind).

  **B. The Generation Effect (Slamecka & Graf, 1978)**
  Cognitive science consistently shows that information is better remembered and understood if it is *generated* by the learner rather than *read*.
  *   **Fit:** When the LLM generates the chain A→B→C, you are in a passive reception mode. You recognize the validity (discriminative task) but do not practice the retrieval/construction (generative task).
  *   **Miss:** This explains the *memory* failure, but not necessarily the *comprehension* failure. You are describing an inability to *adapt* the reasoning, which implies a lack of structural modeling, not just recall.

  **C. Processing Fluency (Alter & Oppenheimer, 2009)**
  When information is easy to process (clear font, coherent text, logical flow), we metacognitively mistake that ease for mastery.
  *   **Fit:** LLM output is hyper-fluent. The coherence of the text masks the fragility of your internal model.
  *   **Miss:** As you noted, this is close to the Illusion of Explanatory Depth. But you claim you *know* you can't reconstruct it later. The fluency isn't tricking you about your current state; it's bypassing the encoding process required for future state.

  **D. Transactive Memory (Wegner, 1987)**
  Groups develop a system where individuals store different parts of knowledge, knowing *who* knows what.
  *   **Fit:** You are treating the LLM as a transactive partner. You store the "location" of the argument (the chat log) rather than the argument itself.
  *   **Miss:** Transactive memory is usually a successful adaptation, not a failure mode. Your case highlights the vulnerability when the "partner" is disconnected.

  ### 2. Proposed Carving: "Structural Epistemic Dependence"

  If we are to name this, the most precise philosophical carving is **Structural Epistemic Dependence**.

  This distinguishes it from standard **Epistemic Dependence** (trusting a testifier's conclusion) and **Cognitive Offloading** (using a tool to reduce load).

  **Definition:**
  Structural Epistemic Dependence occurs when an agent validates the local coherence of externalized reasoning steps (premises and inferences) but fails to internalize the *global architecture* (the schema or generative model) required to reconstruct or adapt the reasoning independently.

  **Key Boundaries:**

  | Feature | Standard Epistemic Dependence | Dunning-Kruger / IOED | Simple Forgetfulness | **Structural Epistemic Dependence** |
  | :--- | :--- | :--- | :--- | :--- |
  | **Locus of Trust** | Reputation/Authority of source. | Self-assessment of own knowledge. | Memory decay over time. | **Validity of visible steps.** |
  | **Internal State** | "I believe them." | "I know this." | "I knew this." | **"I follow this, but I don't own it."** |
  | **Failure Mode** | Source is wrong. | Overconfidence. | Retrieval failure. | **Integration/Transfer failure.** |
  | **Reconstruction** | Impossible without source. | Possible but flawed. | Possible with cues. | **Impossible without re-derivation.** |

  ### 3. Why This Distinction Matters

  You asked how to distinguish this from standard epistemic dependence.
  *   **Standard Dependence:** I ask an expert, "Is P true?" They say "Yes." I believe P. I have no access to the reasoning.
  *   **Structural Dependence:** I ask an LLM, "Why P?" It shows me A→B→C. I verify A, I verify A→B, I verify B→C. I assent to C. But the *connective tissue* remains external. I have verified the *links*, but I have not built the *chain*.

  This is distinct from **forgetfulness** because it is not a decay of stored data; it is a failure of *schema formation*. You never encoded the *relationships* between the nodes, only the nodes themselves. In cognitive terms, you have encoded the *propositions* but not the *operators*.

  It is distinct from **Dunning-Kruger** because your metacognition is accurate. You correctly assess that you cannot reconstruct the argument later. Dunning-Kruger is a metacognitive error; this is a metacognitive accuracy regarding a structural deficit.

  ### 4. Does It Require AI?

  No, but AI maximizes it.

  *   **Human Tutors:** A lecturer can provide a clear chain of reasoning that students follow but cannot reconstruct. This is the "passive lecture" problem.
  *   **Textbooks:** A dense philosophical text can be followed paragraph-by-paragraph without the reader grasping the overarching argument structure.

  **However, AI exacerbates this via three mechanisms:**
  1.  **Hyper-Fluency:** The text is smoother and more logically signposted than most human writing, reducing the cognitive friction required to process it. Friction is often where encoding happens.
  2.  **On-Demand Availability:** Because you know the reasoning is permanently retrievable (the chat log), your brain engages in **cognitive miser** behavior, offloading the integration cost.
  3.  **Authority Bias:** Even if you don't trust the conclusion, the *format* (structured, confident, itemized) signals completeness, reducing the urge to interrogate the gaps between steps.

  ### 5. The "Extended Mind" Implication

  Your observation touches on the **Extended Mind Thesis** (Clark & Chalmers). If the LLM is part of your cognitive system, is the understanding "distributed" or "lost"?

  *   **Coupling vs. Constitution:** For the AI to be part of your mind, the coupling must be reliable and transparent. In your case, the coupling is **loose**. You can access the data, but you cannot access the *processing function*.
  *   **The Vulnerability:** If the understanding is truly distributed, removing the AI shouldn't feel like "losing" understanding; it should feel like losing a limb. But you describe it as "inability to reconstruct." This suggests the AI was acting as a **prosthetic** for reasoning, not a constituent of it. You were leaning on a crutch, not growing a leg.

  ### Summary Recommendation

  If you need a term for this in writing or discussion, **Structural Epistemic Dependence** is the most rigorous philosophical fit. If you prefer a cognitive science framing, **Scaffolded Understanding with Integration Failure** is descriptive.

  The phenomenon is real: it is the gap between **Discriminative Competence** (recognizing a valid argument) and **Generative Competence** (producing one). The LLM supplies the generation, you supply the discrimination, and the synthesis never occurs internally. To counteract it, you must force **Generative Reconstruction**: close the chat, attempt to write the argument from scratch, and only then compare. This forces the schema internalization that passive reading bypasses.
