answer: |-
  **Setting:** *A university seminar room, late evening. The whiteboard is covered in diagrams that no longer make sense to anyone. Chairs are stacked on tables, except for two near the front. NADIA FERRANTE is erasing the board. EMIL VASA is packing a satchel.*

  **Nadia:** You let them go too easily. The silence at the end wasn't agreement; it was exhaustion.

  **Emil:** Sometimes silence is the only honest response to a paradox. But you're right. They didn't buy the orphaned bequest.

  **Nadia:** They shouldn't have. It's the weakest link in your chain. But before we re-litigate the seminar, can we agree on the baseline? We both think I have a reason to keep a promise I made to a living friend.

  **Emil:** Absolutely.

  **Nadia:** And we agree that the source of that reason has something to do with her expectations, her claim on me, or her good.

  **Emil:** Yes. The ordinary cases are stable. The friction starts when we remove the friend.

  **Nadia:** Precisely. My view is simple: a reason is essentially a relation. It's a bridge between a fact and an agent. To say "there is a reason" without saying "for whom" is like saying "there is a left" without saying "of what." It's grammatical noise. When we say "there is reason for the suffering to stop," we are shorthand for "any agent capable of stopping it has reason to do so."

  **Emil:** And I understand that. You're saying ownership is constitutive. A reason without an owner isn't a reason; it's just a value waiting for a host. My view is that ownership is contingent. A reason can exist like a debt sitting in a ledger, waiting for a creditor to claim it. The fact that suffering is bad generates a demand. If an agent exists, they can pick up that demand. If not, the demand remains, unclaimed.

  **Nadia:** Fair summary. But let's look at your orphaned bequest. The dying friend extracts a promise to finish a translation she knows no one will read. She dies. There are no beneficiaries, no readers, no survivors who care. On my view, the reason evaporates with her. Her claim is gone.

  **Emil:** And on mine, the reason persists. The promise itself created a normative fact. It doesn't need a beneficiary to be binding.

  **Nadia:** Here is my concession: I admit that on your view, the intuition is strong. It *feels* like breaking that promise would be wrong. It feels like a violation. But I have to ask: wrong *to whom*? If I burn the manuscript, who is injured?

  **Emil:** The integrity of the promise itself.

  **Nadia:** But integrity is a property of the agent, Emil. It's *my* integrity. So the reason circles back to me. It becomes a reason for *me* to maintain *my* character. You wanted a free-floating reason; you've given me a self-regarding one.

  **Emil:** That's a fair push. But consider the cost. If the reason is only about your integrity, then if you could burn the manuscript without damaging your character—say, you have a memory-wiping drug—the wrongness disappears. I find that verdict unattractive. I'd rather say the act is wrong even if you feel fine about it. That's my concession: I admit that on my view, there's a disconnect between the reason and any psychological impact on an agent. It makes the reason look ghostly.

  **Nadia:** Ghostly is polite. Let's make it stranger. Fission. I promise to meet you for lunch. Before lunch, I step into a transporter and split into two successors. Both are equally continuous with me. Who has the reason to show up?

  **Emil:** Both.

  **Nadia:** But the reason was one reason. "Nadia has reason to meet Emil." Now we have two Nadias. Does the reason split in half? Or does each get a full reason? If each gets a full reason, we've doubled the normative weight just by splitting a person. That suggests reasons aren't owned; they're just hovering near the location of agency.

  **Emil:** Exactly. The reason belongs to the continuity of the person, not the specific biological unit. This brings up the inheritance thread. Can a reason be passed down like a debt? If I assign my creditor status to you, you now have the reason to collect.

  **Nadia:** I deny that. You can assign the *benefit*, but the reason to collect arises because *you* are now the one owed. The chain of custody breaks when the original holder vanishes. In fission, the original holder vanishes. So the original reason breaks. Two new reasons arise for the two new people.

  **Emil:** But that implies the normative world is choppy. It depends entirely on the contours of identity. I prefer to think the reason is stable, and agents step in and out of its scope. But let's go to the empty world. No agents. Just intense, prolonged agony in a void. Is there a reason for it to stop?

  **Nadia:** There is badness. Terrible badness. But "reason" implies a potential actor. Without an actor, "reason" has no grip.

  **Emil:** This is the crux. I say the agony gives a reason for its own cessation, full stop. You say it gives a reason *for an agent*, if one existed. Here is my worry about your view: it makes the normative status of the agony dependent on the accidental presence of a savior. The agony is equally terrible in both worlds. Why should the existence of a *reason* depend on whether a savior happens to be nearby?

  **Nadia:** Because reasons are tools for deliberation. They guide action. In the empty world, there is no deliberation. So there are no reasons. But I hear your Shadow Worry coming. You're going to say that in any world *with* agents, my view collapses into yours.

  **Emil:** I am. If we are in the room with the agony, you admit I have a reason to stop it. So in any world where agents exist, there is a reason to stop the agony. What work is the "free-floating" reason doing? It's shadowed by our agent-relative reasons.

  **Nadia:** Exactly. If the free-floating reason always casts a shadow that looks exactly like an agent-owned reason, why posit the floaters?

  **Emil:** Because the shadow might fail to cover the ground. Suppose there is an agent, but they are incapable of caring about the agony. On your view, if they have no motive to care, does the reason vanish?

  **Nadia:** If they are truly incapable, then "ought" implies "can." So yes, no reason for them.

  **Emil:** But the agony still demands cessation. That demand is the free-floating reason. It exists to judge the agent, even if the agent cannot hear it.

  **Nadia:** That leads me to the Capture Dilemma. This is where I press hardest. If a free-floating reason exists, and I deliberate, I either see it or I don't. If I see it, it enters my deliberation. It becomes *my* reason. I have captured it. It is no longer free-floating. If I don't see it, it plays no role in my decision. It is normatively inert. So a free-floating reason is either absorbed or useless. It is never actually free-floating in practice.

  **Emil:** That's a powerful dichotomy. But it assumes reasons only exist to be used in deliberation. I think they also exist to justify blame or regret. I can be blameworthy for ignoring a reason I didn't see, if I should have seen it. The reason was there, waiting to be captured, judging me for missing it.

  **Nadia:** But then we hit the Weighing Problem. If these reasons are just waiting there, do they enter the balance with my personal projects? If every instance of unowned suffering generates a free-floating reason, and I am surrounded by suffering, don't those reasons swamp my reason to finish this seminar, or eat my lunch?

  **Emil:** *Pauses.* That is the cost. If they count, they are heavy. There are so many of them. I have to concede that on my view, it is very hard to explain why we are permitted to do anything private. Unless...

  **Nadia:** Unless they don't weigh the same?

  **Emil:** Unless free-floating reasons have a different currency. But then, in what sense are they reasons at all? If they don't compete in the same deliberative economy, they aren't reasons; they're just background noise. I don't have a satisfying answer for the weighing problem. It's a vulnerability.

  **Nadia:** And I have a vulnerability on the verbal front. We've been arguing for an hour. Is this substantive? What kind of evidence would settle it? If we agree on all the first-order verdicts—I should keep the promise, you should stop the agony—are we just fighting over the word "reason"?

  **Emil:** It would be verbal if we agreed on every action and every feeling of obligation. But I think we differ on the explanation of *why*. And explanation matters for the hard cases. If I'm right, the universe is normatively dense, full of demands whether we hear them or not. If you're right, the universe is normatively silent until a mind wakes up. That's a metaphysical difference, not just linguistic.

  **Nadia:** But if the metaphysical difference never changes what I should do on a Tuesday afternoon, does it matter?

  **Emil:** It matters for the empty world. It matters for the orphaned promise. It changes the story we tell about why we act.

  **Nadia:** Does it? Or does it just change the poetry? Look, I'll grant you this: your view preserves the intuition that some things matter independently of us. That is a noble thought. But it buys that nobility at the price of making reasons mysterious entities that hover without minds.

  **Emil:** And I'll grant you this: your view keeps reasons tethered to action and agency. It makes normativity human-sized. But it buys that clarity at the price of making the world's value dependent on our presence.

  **Nadia:** So we are stuck. But I need you to answer one thing before we turn off the lights. If a reason is free-floating, and no agent ever exists who can grasp it, what specific work is it doing in reality? Not in your theory, but in the world? What changes because it is there?

  **Emil:** *He slings the satchel over his shoulder.* And I need you to answer this: If the last agent in the universe dies while a promise remains unkept, does the demand to keep it die with them, or does it remain, echoing in the silence, waiting for a listener who never comes?

  **Nadia:** *She turns off the whiteboard light.* I don't know.

  **Emil:** Neither do I.

  *Darkness.*
