      *   **Impact-based Promotion:** Aligns with *Resultant Moral Luck* (you are rewarded for good outcomes, even if skill/effort was identical to someone else who got bad luck). This contradicts the Control Principle.
      *   **No-Heroes Norm:** Aligns with the *Control Principle* regarding *Circumstantial Moral Luck* (being in the right place at the right time to fix something). It rejects rewarding luck-based opportunities.

      *   **The Contradiction:** The company rejects luck when things go *wrong* (postmortems) and when things go *right* in a crisis (no-heroes), but *embraces* luck when things go *right* in product development (promotions).
      *   **Friend's Defense:**
          *   Postmortems = Epistemic humility (we don't know who caused it). *Counter:* The user says the justification is explicitly "any of us would have done the same," which is metaphysical/causal, not just epistemic.
