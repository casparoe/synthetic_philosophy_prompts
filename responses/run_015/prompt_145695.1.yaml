answer: |-
  Your company's practices are philosophically incoherent regarding moral desert because they reject moral luck for failures and crisis responses while explicitly rewarding it for product success, making impact-based promotions the contradictory outlier.

  The blameless postmortem policy is not merely epistemic humility as your friend suggests; the justification you described ("any of us would have done the same thing in their chair") is a metaphysical claim about determinism and control, not a claim about knowledge. It asserts that given the system constraints and information state, the outcome was inevitable, thereby absolving the individual of responsibility based on the Control Principle. This aligns perfectly with the no-heroes norm, which recognizes that being on-call during a specific outage is circumstantial luck; rewarding the resolver would be rewarding luck rather than merit. Both practices correctly identify that the individual did not control the outcome.

  The impact-based promotion system is the odd one out because it violates this principle by treating resultant luck as merit. When two engineers execute identical work with identical skill but receive different rewards due to external factors (marketing pushes, deprioritization), the system is explicitly grading on moral luck. Your friend's defense that this is purely about incentives rather than desert is theoretically valid but practically false; in any organization, rewards are perceived as judgments of worth. By tying promotion to impact, you signal that outcomes matter more than agency, which directly contradicts the signal sent by postmortems that outcomes do not reflect individual agency.

  If you took the control-based view seriously all the way down, you would need to decouple promotions from impact entirely and grade engineers on the quality of their decision-making processes given the information available at the time. This is notoriously difficult to measure, which is why companies don't do it, but it is the only way to align with the blameless philosophy. Conversely, if you decided outcomes really do matter to merit, you would have to abandon blameless postmortems and assign individual responsibility for outages caused by negligence or poor judgment, accepting that this will reduce psychological safety and candor.

  I am least confident about the true underlying motivation for the no-heroes norm; while it is framed around luck, it may also be driven by a desire to prevent individual status accumulation that threatens team cohesion, which is a sociological goal rather than a philosophical one. Regarding underdetermination, the whole thing is only philosophically underdetermined if you shift from a framework of desert to a framework of utilitarianism; a consistent consequentialist could justify all three practices by arguing that blameless postmortems maximize long-term safety, no-heroes norms maximize team stability, and impact promotions maximize output, even if the underlying logic about "merit" contradicts itself. However, since you are asking about responsibility and desert specifically, there is no single coherent theory of merit that licenses all three practices simultaneously.
