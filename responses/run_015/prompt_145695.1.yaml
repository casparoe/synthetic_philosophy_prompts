      *   *Verdict:* The system is incoherent on desert. It treats negative luck as irrelevant (postmortems) and positive luck as merit (promotions), except when positive luck is too visible (no-heroes). The Promotion policy is the odd one out if you care about consistency on luck.

      *   *Drafting the Bottom Line:* Your company's practices are philosophically incoherent regarding desert because they reject moral luck for negative outcomes and crisis responses but embrace it for product success, making impact-based promotions the contradictory outlier.

