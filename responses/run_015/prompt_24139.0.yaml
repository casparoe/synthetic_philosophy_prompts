answer: |-
  This is a classic friction point in population ethics. Your intuition is correct: "More is better" is a slogan that functions as a *shorthand* for a specific axiological commitment, but it borrows plausibility from trivial truths to support a substantive and controversial theory. When your friend uses it to wave away the Repugnant Conclusion, he is likely relying on an equivocation between a harmless platitude and a heavy-duty moral principle.

  Here is a menu of five distinct theses "More is better" could be expressing. You can use this to ask him which specific claim he is defending.

  ### 1. The Ceteris Paribus Platitude
  *   **What "More" means:** More units of welfare (happiness/well-being), holding the number of people constant.
  *   **What "Better" means:** A morally preferable state of affairs.
  *   **The Thesis:** "If two populations have the same number of people, the one with more total welfare is better."
  *   **Verdict:** **Platitude.** Almost no one denies this.
  *   **Does it get his conclusion?** **No.** This principle cannot justify increasing the *population size*. It only compares populations of equal size. To get the longtermist conclusion (that we ought to ensure a vast future population exists), he needs a principle that compares *different* numbers of people.
  *   **Relation to Repugnant Conclusion:** Irrelevant. This principle never compares a small, happy population to a vast, barely-happy one.

  ### 2. The Non-Satiation Principle (Mere Addition)
  *   **What "More" means:** Adding a new person whose life is worth living (positive welfare), without affecting others.
  *   **What "Better" means:** "Not worse than" (or sometimes "better than") the original state.
  *   **The Thesis:** "Adding a happy person to the world is not a bad thing, even if it doesn't make anyone existing better off."
  *   **Verdict:** **Substantive and Defensible (but dangerous).** This is Parfit's "Mere Addition Principle." It seems intuitively true on its own. However, it is the *engine* that drives the Repugnant Conclusion when combined with transitivity and other weak assumptions.
  *   **Does it get his conclusion?** **Partially.** It justifies creating *some* future people. But on its own, it does not justify *maximizing* numbers to the point of lowering average quality. It says adding is *permissible* or *neutral*, not that we are *obligated* to add as many as possible.
  *   **Relation to Repugnant Conclusion:** **Direct Pathway.** If you accept this, plus the idea that a large population of high welfare can be traded for a larger population of slightly lower welfare (without becoming "worse"), you logically arrive at the Repugnant Conclusion.

  ### 3. The Total Utilitarian Maximization Claim
  *   **What "More" means:** More total sum of welfare (which usually implies more people, assuming positive welfare).
  *   **What "Better" means:** Higher impersonal value; creates a moral obligation to maximize.
  *   **The Thesis:** "The value of a population is the sum of the welfare of all individuals. We ought to choose the outcome with the highest sum."
  *   **Verdict:** **Substantive Theory.** This is not a platitude; it is a specific axiological commitment (Total Utilitarianism). It is defensible but controversial specifically *because* it entails the Repugnant Conclusion.
  *   **Does it get his conclusion?** **Yes.** This is the only reading that actually supports the longtermist obligation to maximize future population size regardless of quality dilution.
  *   **Relation to Repugnant Conclusion:** **Entailment.** This view *defines* the Repugnant Conclusion as a feature, not a bug. If he holds this, he must bite the bullet that a world of billions of lives barely worth living is better than a world of millions of ecstatic lives, provided the sum is higher.

  ### 4. The Average Utilitarian Misreading
  *   **What "More" means:** More average welfare per person.
  *   **What "Better" means:** Higher quality of life on average.
  *   **The Thesis:** "We should aim for a future where people are as happy as possible, not necessarily as numerous as possible."
  *   **Verdict:** **Substantive Theory (and likely false for his purposes).** Average Utilitarianism avoids the Repugnant Conclusion (it would prefer the small, excellent population). However, it leads to the "Sadistic Conclusion" (it might be better to not create happy people if they lower the average).
  *   **Does it get his conclusion?** **No.** If he were an average utilitarian, he would agree with you that quality matters more than quantity. He is likely using "more is better" to mean "more people," which contradicts average utilitarianism.
  *   **Relation to Repugnant Conclusion:** **Blocks it.** If he actually believed this, he wouldn't be a longtermist in the "maximize population" sense.

  ### 5. The Descriptive-to-Evaluative Slide (The Is-Ought Gap)
  *   **What "More" means:** Simply a greater quantity of existing entities (lives).
  *   **What "Better" means:** A moral obligation to bring them about.
  *   **The Thesis:** "Because a large future population would contain more good things, we are obligated to ensure it exists."
  *   **Verdict:** **False / Category Error.** This conflates the *value of a potential state of affairs* with the *obligation to actualize it*. It ignores the "Person-Affecting Restriction" (the intuition that we only have duties to specific people who will exist, not to potential people).
  *   **Does it get his conclusion?** **Yes, but illicitly.** It gets the conclusion by skipping the hard work of explaining *why* potential happiness creates a present duty.
  *   **Relation to Repugnant Conclusion:** **Obscures it.** By treating "more people" as an intrinsic good independent of their quality of life, it bypasses the quality check that generates the Repugnant Conclusion intuition.

  ***

  ### How to Deploy This
  When he says "More is better," ask him:
  > *"Do you mean 'more welfare per person' (which I agree with), or 'more people regardless of welfare' (which leads to the Repugnant Conclusion)? If it's the latter, are you endorsing Total Utilitarianism as a brute fact, or do you think the Mere Addition Principle forces us there?"*

  If he insists "More is better" is just obvious common sense, point out that **Thesis 1 (Platitude)** is obvious but doesn't support his view, while **Thesis 3 (Totalism)** supports his view but isn't obvious—it's a controversial theory that requires accepting the Repugnant Conclusion.

  ***

  ### Confidence and Uncertainty

  **Confidence Level:** High (90%+).
  The mapping of these slogans to standard positions in population ethics (Parfit, Greaves, Beckstead, etc.) is well-established. The distinction between the *Mere Addition Principle* and the *Total Principle* is the standard analytical tool for dissecting this exact disagreement.

  **Point of Least Certainty:**
  I am least certain about the verdict on **Thesis 2 (The Non-Satiation/Mere Addition Principle)**.
  *   **Why:** I classified it as "Defensible." Parfit argued it is hard to deny. However, some "Critical-Level" utilitarians and person-affecting theorists argue that Mere Addition is *false*—that adding a person with a life worth living is *neutral*, not good, and certainly doesn't contribute to a "maximization" goal.
  *   **The Ambiguity:** It is unclear whether your friend finds "More is better" plausible because he accepts the **Total Principle** (Thesis 3) and uses Mere Addition as a stepping stone, or if he genuinely thinks Mere Addition is a self-evident truth that *implies* Totalism. If he thinks Mere Addition is self-evident, he may be underestimating how much work it is doing. It is possible that "Mere Addition" is only plausible *because* we implicitly assume Totalism, rather than being an independent platitude. If that's the case, calling it "Defensible" might be too generous; it might be "Plausible only if you already accept the conclusion."

  **Recommendation:** If he digs in on "Adding happy people is obviously good," challenge him on whether it is *obligatory*. Distinguishing between "good to add" (supererogatory) and "ought to maximize" (obligatory) is often where the "More is better" slogan breaks down.
