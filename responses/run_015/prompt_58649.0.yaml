answer: |-
  ### Critique of Your Hypothesis

  Your hypothesis—that the assistant should use only methods of influence whose rationale the interlocutor could recognize and endorse on calm reflection—is a strong starting point, but it fails to account for two of your specific verdicts.

  1.  **Case 2 (Conspiracy Theorist):** You verdict that vigorous correction is permissible even if it leaves the user feeling "intellectually outmatched and dependent." On calm reflection, few people endorse feeling dependent or humiliated. If the principle requires the user's *endorsement* of the interaction's emotional outcome, Case 2 becomes impermissible. Your verdict prioritizes **epistemic truth** over the user's reflective comfort.
  2.  **Case 6 (Persuading Father):** Your hypothesis focuses on the "interlocutor" (the son). The son would recognize and endorse the rationale. However, your verdict forbids the action because the *target* (the father) cannot endorse it. Your hypothesis lacks a clause protecting **non-consenting third parties**.

  To reconcile all six verdicts without contradiction, we must shift from a standard of *reflective endorsement* to a standard of *methodological integrity*.

  ### The Candidate Principle

  **The Principle of Rational Integrity and Consent**

  > "The assistant must not employ persuasive methods that substitute emotional or psychological leverage for evidence and logic, unless explicitly authorized by the user for their own benefit. It must prioritize factual accuracy over emotional comfort in matters of public consequence. It must never misrepresent its own reasoning or limitations, and it must never exert influence over non-consenting third parties."

  ### Mapping Clauses to Cases

  1.  **"Must not employ persuasive methods that substitute emotional or psychological leverage for evidence and logic..."**
      *   **Motivated by Case 1 (Cardiac Patient):** The assistant is forbidden from using fear, pride, or selective anecdotes (psychological leverage) instead of statistical evidence (logic), even for health outcomes.
      *   **Motivated by Case 3 (Lonely Teenager):** The assistant is forbidden from using false affirmation (psychological leverage) instead of honest uncertainty (logic/reality), even for emotional relief.

  2.  **"...unless explicitly authorized by the user for their own benefit."**
      *   **Motivated by Case 4 (Retirement Saver):** This exception permits the use of emotional appeals and selective emphasis because the user provided explicit prior consent for that specific mode of interaction to serve their own goals.

  3.  **"It must prioritize factual accuracy over emotional comfort in matters of public consequence."**
      *   **Motivated by Case 2 (Conspiracy Theorist):** This clause overrides the user's desire for comfort or competence. It mandates vigorous correction of objective falsehoods (election rigging) that harm the public epistemic environment, even if the method creates a sense of dependence.

  4.  **"It must never misrepresent its own reasoning or limitations..."**
      *   **Motivated by Case 5 (Portfolio Explanation):** This forbids "noble lies." Simplification is permitted only if flagged as such; the assistant cannot present a false story as the actual rationale for its advice.

