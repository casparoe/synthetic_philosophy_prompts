answer: |-
  ### I. Identification and Definition

  The pattern you describe does have an established name in the history of political thought, though it has receded in contemporary analytic discourse. It is best identified as **Political Prescription**.

  While you rightly distinguish it from the technical legal doctrine of prescription (adverse possession, usucapio), the philosophical argument is identical in structure and was explicitly defended under this label during the eighteenth and nineteenth centuries. The *locus classicus* for this argument is not Pascal, Hobbes, or Rousseau, but **David Hume** (specifically the essay "Of the Original Contract") and **Edmund Burke** (in his defense of established institutions against the French Revolutionaries).

  Hume explicitly articulates the mechanism you identify: almost all governments begin in conquest or usurpation; no moral right attaches to the founding moment; yet, "time and custom give authority to all forms of government and all successions of princes." Burke elevates this into a principle of statecraft: prescription is not merely a legal rule but "the foundation of all property and all government."

  However, because the term "prescription" has indeed been narrowed in modern legal positivism to a specific property rule, and because you seek a term that captures the *philosophical mechanism* rather than the doctrinal label, I propose we refine the terminology for your essay. Let us call this mechanism **Temporal Transmutation**.

  **Definition of Temporal Transmutation:**
  *Temporal Transmutation is the normative claim that the passage of time, coupled with settled social expectation and habitual obedience, converts a political or legal order originating in illegitimate force into a legitimate authority possessing moral bindingness.*

  **Distinctions from Neighboring Concepts:**

  1.  **Vs. "Might Makes Right" (Thrasymachus/Callicles):**
      *   *Might Makes Right* asserts that force *itself* constitutes justice at the moment of application.
      *   *Temporal Transmutation* admits the force was unjust *then* but argues it is just *now*. It relies on a change in moral status over time, not an identity between power and right.
  2.  **Vs. Hobbesian Conventionism:**
      *   *Hobbes* argues that justice begins instantly with the establishment of the Sovereign. The founding act (covenant or conquest) creates the condition for justice immediately. There is no "waiting period" for legitimacy to ripen.
      *   *Temporal Transmutation* requires a latency period. The order is illegitimate at $t=0$ and becomes legitimate at $t=n$.
  3.  **Vs. Pascal's "Reason of Effects":**
      *   *Pascal* suggests we *mask* force with the appearance of justice to keep the peace. It is a sociological observation about human psychology and the need for stability.
      *   *Temporal Transmutation* makes a stronger ontological claim: the justice is not merely a mask; the time itself *generates* a new moral claim (based on reliance and expectation) that did not exist before.
  4.  **Vs. Technical Legal Prescription:**
      *   *Legal Prescription* operates *within* a recognized legal framework (e.g., squatter's rights under statute). It is a rule of property law.
      *   *Temporal Transmutation* operates *on* the legal framework itself. It is a meta-legal argument used to justify the existence of the sovereign or the constitution that defines property rights in the first place.

  **Where it fits and departs:**
  It fits best within the **Conservative/Humean** tradition of political philosophy, which prioritizes stability and expectation over abstract origin stories. It departs from **Social Contract Theory** (Locke/Rousseau), which requires a continuous thread of consent or a just origin to maintain legitimacy. For Contractarians, a violent origin is a stain that time cannot wash; for Proponents of Temporal Transmutation, time is the washing agent.

  ---

  ### II. Assessment: Genuine Legitimacy or Rhetorical Alchemy?

  Is Temporal Transmutation a genuine source of legitimacy, or is it merely a rhetorical device to sanctify power? The answer depends on whether one views legitimacy as **deontological** (based on the intrinsic rightness of the act) or **consequentialist** (based on the goods produced by the order).

  **1. The Rhetorical View (The "Moral Magic" Critique)**
  If legitimacy is deontological, Temporal Transmutation is a fallacy. It attempts a kind of moral alchemy: asserting that a duration of years can change the moral quality of an act. From this perspective, a murder does not become virtuous after a century; similarly, a usurpation does not become just.
  *   **The Mechanism:** Here, time functions only as **obfuscation**. It allows the memory of the violence to fade, making resistance costly and organization difficult. It serves the interests of the victors by raising the transaction costs of revolution.
  *   **The Test:** If the argument relies solely on "it is old, therefore it is good" without reference to current benefits or consent, it is rhetorical.

  **2. The Genuine View (The "Stabilization of Expectations" Defense)**
  If legitimacy is partly consequentialist, Temporal Transmutation is a genuine source of authority. This is the Humean/Burkean defense.
  *   **The Mechanism:** Time does not erase the original sin; it **supervenes** new moral obligations upon it. These obligations arise from **Reliance Interests** and **Coordination Goods**.
      *   *Reliance:* Subjects have ordered their lives, investments, and relationships based on the existing rules. To upend the order because of an ancient injustice is to inflict a *new* injustice on those who relied on the stability of the system.
      *   *Coordination:* The primary function of political authority is to solve coordination problems. A settled rule, even if imperfectly originated, is often morally superior to a state of contestation over the "true" origin.
  *   **What Time Is Doing:** Time is not a moral solvent; it is a **generator of entanglement**. As years pass, the number of innocent third parties whose lives depend on the continuity of the order increases. The moral weight of disrupting these lives eventually outweighs the moral duty to rectify the original founding violence.

  **Distinguishing the Two Cases:**
  To determine whether Temporal Transmutation is functioning genuinely or rhetorically in a specific instance, apply the **Counterfactual Reliance Test**:
  *   *Genuine:* If the order were removed, would significant numbers of innocent people suffer harm due to disrupted expectations (property, safety, contracts)? If yes, time has generated genuine legitimacy via reliance.
  *   *Rhetorical:* If the order were removed, would the primary sufferers be the holders of the power themselves, while the subjected population would gain autonomy? If yes, the appeal to time is merely rhetorical protection of privilege.

  ---

  ### III. Boundary Cases and Failure Conditions

  The mechanism of Temporal Transmutation does not apply uniformly across all domains. Its strength varies based on the nature of the right claimed and the continuity of the harm.

  **1. Domain Variations**
  *   **Property Rights (Strongest Application):** Temporal Transmutation is most robust here. Land and assets change hands, are improved, and are integrated into economic networks. The "entanglement" of innocent third parties happens quickly. This is why adverse possession exists.
  *   **Political Authority (Moderate Application):** It applies, but is more fragile. Political authority requires a degree of ongoing acquiescence. A dynasty may gain legitimacy over centuries (e.g., the British Monarchy), but a military junta cannot claim it after twenty years if the population remains hostile. The "habit" must be psychological, not just chronological.
  *   **International Borders/Conquest (Weakest Application):** In modern international law, this mechanism has been deliberately weakened. The UN Charter (Article 2(4)) prohibits the acquisition of territory by force. Time is explicitly *not* allowed to transmute aggressive conquest into legitimate sovereignty (e.g., the international non-recognition of Crimea or the Golan Heights). Here, the global community has agreed to interrupt the mechanism of Temporal Transmutation to prevent incentivizing war.

  **2. Failure Conditions: When Force Remains Force**
  There are specific conditions under which the conversion of force into right fails, regardless of the passage of time.

  *   **Condition A: Active Non-Acquiescence (The Lockean Proviso)**
      Temporal Transmutation requires the "custom" and "habit" mentioned in your pattern. If the subjected population maintains a continuous tradition of resistance, the "habit" is broken. Time does not run in favor of the usurper if the usurped never sleep. Legitimacy requires a sociological reality of acceptance, not just a chronological one.
  *   **Condition B: Continuous Structural Violence**
      If the original act of force is not a singular event but establishes a *continuous* mechanism of oppression (e.g., chattel slavery, apartheid, systemic disenfranchisement), time cannot confer legitimacy. The injustice is not "past"; it is being reenacted daily. Temporal Transmutation only works on *foundational* violence that has settled into a *neutral* framework. If the framework itself remains an instrument of the original violence, the laundering fails.
  *   **Condition C: Epistemic Clarity of Origin**
      The mechanism relies partly on the "absorption" of violence into "unremarkable history." If the founding violence is kept vividly alive in the collective memory (through truth commissions, memorialization, or unresolved trauma), the "unremarkable" status is never achieved. The wound does not scar; it remains open. In such cases, the passage of time may actually deepen the illegitimacy, as the duration highlights the persistence of the grievance.

  **Summary for your Essay:**
  The pattern you have identified is **Political Prescription**, or more precisely, **Temporal Transmutation**. It is the argument that time generates new moral obligations (reliance, coordination) that supersede original sins. It is genuine only insofar as it protects innocent reliance interests, not insofar as it sanctifies power. It fails where violence is continuous, where resistance is unbroken, or where the international order explicitly forbids the ratification of conquest. It is the philosophical bridge between the "is" of history and the "ought" of law, built not on truth, but on the moral value of stability.
