  1. The "separate colony" framing is physically dishonest because resources are finite, so creating Z lives inevitably deprives potential A+ lives, meaning the trade-off is real regardless of your description. You must concede this undermines the "no displacement" claim unless you assume infinite resources, which is false.
  2. Experimental philosophy shows repugnance persists even when lives are described as meaningful, because "barely worth living" structurally excludes deep projects by definition. You should concede that your variety description likely smuggles in higher welfare than the formal RC allows.
  3. Avoiding RC via your method often forces acceptance of the Sadistic Conclusion, where adding suffering lives is ranked better than adding happy ones, which is intuitively worse than RC. You cannot shrug this off; it swaps one bullet for a sharper one.
  4. By dismissing all counter-intuitive results as framing artifacts, you render total utilitarianism unfalsifiable by intuition, collapsing the method of reflective equilibrium. This matters because axiology relies on coherence with considered judgments, not just internal consistency.
  5. The Mere Addition Paradox demonstrates that accepting separate additions inevitably leads to the Repugnant Conclusion through transitive steps, so denying the endpoint contradicts your acceptance of the steps. You are entitled to shrug this only if you reject transitivity, which destroys rational choice theory.
