prompt: |-
  You are a decision scientist who advises research and development organizations on escalation of commitment, and you are fluent in the formal literature on the dollar auction and wars of attrition. Think carefully before you answer: begin by listing the ways the dollar-auction framing can misfire when it is imposed on a real organization, and only then build the procedure.

  I chair the quarterly go/no-go review at a mid-sized biotech, roughly 200 people. We make six to ten continue/kill decisions per quarter in a single half-day, the CEO signs off, and the program leads in the room are the people who built the programs. The standard advice, that sunk costs are irrelevant and only forward-looking value counts, gets quoted and then quietly ignored, because two features of our situation make it look less like a bad investment and more like a dollar auction: the commercial prize is winner-take-most, so second place is worth very little, and much of what we have already spent is unrecoverable in a way that is mirrored on the other side, since the rival still in the race has burned comparable money that their exit would also strand. Our head of business development uses exactly this to argue the reverse of the standard conclusion: if a rival is still funding, that is evidence the asset is worth more than our own numbers say, so killing is the real mistake.

  I need a reusable procedure, not a one-off opinion. Please give me, in order: a screening step that sorts each program into the structures that actually matter, meaning a genuine two-sided contest with an observable rival, an ordinary one-sided escalation whose only opponent is our own prior spend, and what I think of as the phantom bidder case, where a rival is invoked rhetorically but is not really still bidding or whose exit we cannot observe; the tests to run after screening, with what counts as a sufficient answer to each, where the procedure stops with a no, and what to do when the number a test needs is simply unavailable, as it usually is; an explicit treatment of the persistence-as-evidence argument, covering when a rival's continued funding is information about the size of the prize, when it is only their own escalation, and how to tell the difference without access to their data; the points where judgment cannot be eliminated and a named person must decide, flagged honestly as judgment calls dressed up as procedure; and what the procedure cannot do. Then run it on three cases: a mid-stage asset whose rival just published strong data, a program whose rival left the field two years ago while our team still describes the space as a race, and one where I expect to dislike the answer, our flagship program, the one the company was founded on, now three years behind the leader. Answer in American English throughout.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Decision Scientist advising R&D organizations on escalation of commitment (familiar with dollar auction, wars of attrition literature).
      *   **Context:** Mid-sized biotech (200 people), quarterly go/no-go reviews, 6-10 decisions/half-day, CEO sign-off, program leads present.
      *   **Problem:** Standard "ignore sunk costs" advice is ignored because the situation feels like a Dollar Auction/War of Attrition (winner-take-most, unrecoverable spend on both sides). Head of BizDev argues rival persistence = asset value signal.
      *   **Deliverable:** A reusable procedure (not a one-off opinion).
      *   **Structure Required:**
          1.  List ways dollar-auction framing misfires in real organizations.
          2.  Screening step (sort programs into: Genuine Two-Sided, Ordinary One-Sided, Phantom Bidder).
          3.  Tests to run after screening (sufficient answers, stop rules, handling missing data).
          4.  Explicit treatment of "persistence-as-evidence" argument.
          5.  Flagged judgment calls (named person must decide).
          6.  Limitations (what the procedure cannot do).
          7.  Run the procedure on three specific cases (Mid-stage w/ rival data, Rival exited 2 years ago, Flagship program 3 years behind).
      *   **Tone:** American English, professional, analytical, honest about limitations.

  2.  **Deconstruct the Dollar Auction/War of Attrition in Biotech:**
      *   *Dollar Auction:* Bidders pay for bids, only highest bidder gets prize. Rational escalation leads to paying > prize value.
      *   *War of Attrition:* Contestants pay costs over time, winner takes all.
      *   *Biotech Context:* R&D is expensive. Clinical trials are binary-ish (pass/fail). Market share can be winner-take-most (first-in-class/best-in-class).
      *   *The Trap:* The BizDev argument ("They are still in, so it must be good") is a classic signal jamming/escalation trap. It conflates *information* with *commitment*.
      *   *Misfires:* Real organizations aren't closed systems. Rivals have different cost structures, different portfolios, different risk tolerances, and sometimes irrational leadership. The "prize" isn't fixed (market can expand/contract).

  3.  **Drafting Section 1: How the Framing Misfires:**
      *   Need to explain why applying game theory blindly is dangerous.
      *   *Point 1:* Asymmetric Cost Structures. (They might have cheaper capital).
      *   *Point 2:* Portfolio Hedging. (They might not care about this specific asset's ROI if it blocks us).
      *   *Point 3:* The Prize isn't Fixed. (Market growth, licensing, acquisition).
      *   *Point 4:* Internal Politics vs. External Reality. (The "rival" might be a ghost used to justify internal pet projects).
      *   *Point 5:* Option Value. (Killing isn't always zero; IP can be sold, tech repurposed).

  4.  **Drafting Section 2: The Screening Step:**
      *   Need to categorize the 6-10 projects quickly.
      *   *Category A: Genuine Two-Sided Contest.* (Observable rival, same mechanism/target, active funding).
      *   *Category B: Ordinary One-Sided Escalation.* (No active rival, just fighting sunk costs/internal momentum).
      *   *Category C: Phantom Bidder.* (Rival cited but exited, or unobservable/private).

  5.  **Drafting Section 3: The Tests:**
      *   Need specific hurdles.
      *   *Test 1: The Forward-Looking NPV.* (Standard finance).
      *   *Test 2: The Cost-to-Catch-Up.* (In a race, can we actually win?).
      *   *Test 3: The Exit Cost.* (Is killing cheaper than continuing?).
      *   *Missing Data:* Use proxies (expert opinion, public filings, conservative estimates). If data is missing, default to "No" (precautionary principle).

  6.  **Drafting Section 4: Persistence-as-Evidence:**
      *   This is the core intellectual challenge.
      *   *Signal:* Rival has private info we don't.
      *   *Noise:* Rival is also trapped in escalation.
      *   *Differentiation:* Look for *new* capital vs. *coasting*. Look for *milestones* vs. *timeline extensions*.
      *   *Rule:* Persistence is only evidence if accompanied by *positive technical milestones*, not just continued spending.

  7.  **Drafting Section 5: Judgment Calls:**
      *   Procedure can't remove human responsibility.
      *   *Call 1:* Strategic Blockers (kill to hurt rival?).
      *   *Call 2:* Platform Value (keep for tech, not drug).
      *   *Call 3:* The "Founder's Trap" (Flagship program).
      *   *Who:* CEO + Independent Board Member (not Program Lead).

  8.  **Drafting Section 6: Limitations:**
      *   Can't predict clinical success.
      *   Can't know rival's true books.
      *   Can't fix culture (if culture rewards persistence over success).

  9.  **Drafting Section 7: Running the Cases:**
      *   *Case 1 (Mid-stage, rival strong data):* Likely a "No" or "Pivot". If rival won the mechanism race, we lose.
      *   *Case 2 (Rival exited 2 years ago):* Phantom Bidder. Screen out the "race" rhetoric. Treat as One-Sided. Likely "No" unless standalone value exists.
      *   *Case 3 (Flagship, 3 years behind):* The hardest one. High escalation risk. Persistence-as-evidence likely false (leader has market lock). Needs Judgment Call on reputation vs. cash burn.

  10. **Review and Refine:**
      *   *Check Tone:* Is it authoritative but humble? Yes.
      *   *Check Constraints:* Did I list misfires *first*? Yes. Is it American English? Yes.
      *   *Check Logic:* Does the procedure actually address the BizDev argument? Yes, by distinguishing signal from noise.
      *   *Refinement:* Ensure the distinction between "Dollar Auction" (paying for bids) and "War of Attrition" (paying over time) is clear but integrated, as biotech is usually the latter. The prompt uses "Dollar Auction" broadly, so I will acknowledge the nuance but stick to the user's framing where helpful.
      *   *Refinement on Missing Data:* Be specific. If we don't know rival spend, assume they are rational *only if* they hit milestones.
      *   *Refinement on Judgment:* Make sure the "Named Person" is specific (e.g., CEO or CCO).

  11. **Final Polish:** Check against the "Think carefully" instruction. Ensure the misfire list is robust before moving to the procedure. (Self-Correction: Make sure the misfire list isn't just "theory is wrong" but "theory applied to orgs is wrong".)

      *   *Misfire 1:* Rational Actor Assumption (Rivals might be irrational).
      *   *Misfire 2:* Common Knowledge (We don't know their payoff matrix).
      *   *Misfire 3:* Fixed Prize (Markets shift).
      *   *Misfire 4:* Organizational Friction (Killing has internal political costs not in the model).

      *   *Procedure:* Make it actionable for a half-day meeting.
      *   *Cases:* Ensure the output is decisive (Go/No-Go/Conditional).

      *   *Wait, one nuance:* The prompt asks for "what counts as a sufficient answer to each, where the procedure stops with a no." I need to be clear on the "Stop Rule."
      *   *Wait, another nuance:* "Flagged honestly as judgment calls dressed up as procedure." I need to explicitly label these.

      *   *Let's write.*
answer: |-
  ### Part 1: How the Dollar-Auction Framing Misfires in Real Organizations

  Before implementing a procedure, we must acknowledge why the theoretical models of the dollar auction and war of attrition often fail when mapped onto biotech R&D. The literature assumes rational actors with common knowledge of the rules; your organization operates in a fog of war with political friction.

  1.  **The Rational Actor Assumption:** Game theory assumes your rival is maximizing expected value. In reality, rival biotechs may be maximizing stock price, executive compensation, or survival, not necessarily the net present value (NPV) of the specific asset. They may be irrational, desperate, or subsidized by non-economic actors (e.g., government grants, philanthropy). Treating their persistence as a "smart money" signal is dangerous if their incentives are distorted.
  2.  **Asymmetric Cost Structures:** The model assumes similar costs of bidding. A rival may have a lower cost of capital, a diversified portfolio that absorbs the loss, or a manufacturing advantage you lack. Their ability to stay in the race reflects their balance sheet, not necessarily their confidence in the science.
  3.  **The Variable Prize:** In a dollar auction, the prize ($1) is fixed. In biotech, the market value changes. If you both succeed, the market might expand (making second place viable), or a new technology might render the target obsolete (making first place worthless). The "winner-take-most" assumption is often a heuristic, not a law.
  4.  **Internal vs. External Games:** The dollar auction focuses on external competition. However, the most dangerous escalation often comes from internal politics. Program leads may invoke a "phantom rival" to justify continued funding, turning an external competition into an internal shield against termination.
  5.  **Option Value vs. Sunk Cost:** The model treats past spend as sunk. In biotech, past spend generates IP, data, and know-how. Killing a program isn't always a zero-recovery exit; it can be licensed, sold, or repurposed. Ignoring this salvage value makes the "kill" decision look costlier than it is.

  ---

  ### Part 2: The Escalation Screening & Decision Procedure

  This procedure is designed for your quarterly half-day review. It forces a structural classification before financial debate.

  #### Step 1: Structural Screening
  *Time allocation: 5 minutes per program.*
  The Program Lead must declare the competitive structure. The Chair (you) validates it.

  | Structure | Definition | Classification Criteria |
  | :--- | :--- | :--- |
  | **A. Genuine Two-Sided Contest** | Active rival, same mechanism/target, observable funding. | Rival has entered Phase 2+ in last 18 months OR raised specific capital for this asset in last 12 months. |
  | **B. Ordinary One-Sided Escalation** | No active rival, momentum driven by internal sunk costs. | No rival in clinic OR rival exited >24 months ago OR rival pivot to different mechanism. |
  | **C. Phantom Bidder** | Rival invoked rhetorically but not bidding. | Rival mentioned in deck, but no public data/funding in >24 months, or rival is a large pharma with no dedicated team. |

  *   **Rule:** If classified as **C (Phantom)**, the "race" argument is immediately disqualified. The program proceeds to Step 2 as a **One-Sided** case.
  *   **Rule:** If classified as **B (One-Sided)**, the "rival persistence" argument is disqualified.

  #### Step 2: The Tests
  *Time allocation: 10 minutes per program.*
  Run these tests sequentially. If a test fails, the recommendation is **No-Go** unless a Judgment Call (Step 4) is invoked.

  **Test 1: The Forward-Looking NPV**
  *   **Question:** Excluding all past spend, does the risk-adjusted NPV of *future* costs exceed the risk-adjusted value of *future* revenue?
  *   **Sufficient Answer:** Yes (Positive NPV).
  *   **Stop Rule:** If No, recommend **Kill**.
  *   **Missing Data:** If market size is unknown, use the *lowest* comparable asset launch in the last 5 years. If clinical probability is unknown, use industry averages for that phase (e.g., Oncology Phase 2 to Launch = ~15%). **Conservative Default:** If data is missing, assume the lower bound.

  **Test 2: The Catch-Up Cost**
  *   **Question:** (For Genuine Two-Sided Only) To beat the rival, what is the incremental cost to accelerate our timeline?
  *   **Sufficient Answer:** The cost to catch up is < 20% of the remaining program budget.
  *   **Stop Rule:** If we cannot technically catch up (e.g., they are 3 years ahead in a 5-year development cycle), recommend **Kill** or **Pivot** (niche indication).
  *   **Missing Data:** If rival timeline is opaque, assume they are 6 months *ahead* of public data.

  **Test 3: The Exit Cost**
  *   **Question:** Is the cost of termination (severance, contract breakage, facility closure) greater than the next 12 months of R&D burn?
  *   **Sufficient Answer:** No (Termination is cheaper than continuing).
  *   **Stop Rule:** If Termination Cost > 12 Months Burn, recommend **Pause/Harvest** (do not recruit new patients, finish safety readout, then sell IP).
  *   **Missing Data:** Estimate legal/HR costs at 15% of remaining annual budget.

  #### Step 3: Treating "Persistence-as-Evidence"
  *Addressing the Head of BizDev's Argument.*
  In a Genuine Two-Sided Contest, rival persistence is only evidence of value if it meets the **Milestone Corollary**.

  *   **The Rule:** Continued funding is evidence of value *only if* accompanied by positive technical milestones in the last 18 months.
  *   **Differentiation:**
      *   **Signal:** Rival raises Series C *and* publishes Phase 1 safety data. (Interpretation: They see value).
      *   **Noise (Escalation):** Rival extends runway via debt *but* delays data readouts. (Interpretation: They are trapped).
  *   **Procedure:** Ask the Program Lead: "What specific technical milestone did the rival achieve in the last 18 months that validates the target?"
      *   **If None:** Treat rival persistence as **Noise**. Ignore it.
      *   **If Yes:** Adjust probability of success (PoS) upward by max 10%. Do not adjust market size.

  #### Step 4: Flagged Judgment Calls
  *These are points where procedure ends and responsibility begins. A named person must sign off.*

  1.  **The Strategic Blocker Call:**
      *   *Scenario:* NPV is negative, but killing the program hands a monopoly to a hostile rival who could price us out of a core therapeutic area.
      *   *Decision:* Continue to bleed cash to limit rival market share.
      *   *Who Decides:* **CEO + Board Strategy Committee.** (Program Lead is recused).
      *   *Disclosure:* Must be recorded as "Strategic Loss," not "Investment."

  2.  **The Platform Value Call:**
      *   *Scenario:* The drug will likely fail, but the delivery technology or biomarker data is critical for *other* programs.
      *   *Decision:* Continue funding, but re-budget as "Platform R&D," not "Asset Development."
      *   *Who Decides:* **Chief Scientific Officer (CSO).**

  3.  **The Founder's Trap Call:**
      *   *Scenario:* The asset is the company's origin story (Flagship). Data is poor, rival is ahead.
      *   *Decision:* Kill the asset to save the company, or keep it to maintain valuation/story?
      *   *Who Decides:* **Independent Board Lead.** (CEO and Founder are recused due to emotional/financial conflict).

  #### Step 5: Limitations of the Procedure
  *   **Cannot Predict Biology:** This procedure manages financial escalation, not clinical risk. A "Go" decision can still result in clinical failure.
  *   **Cannot See Private Books:** We cannot know if a rival is bluffing. We rely on public signals.
  *   **Cannot Fix Culture:** If the organization rewards "fighting spirit" over "rational exits," this procedure will be gamed. The CEO must enforce the "Stop Rules."

  ---

  ### Part 3: Running the Procedure on Three Cases

  #### Case 1: Mid-Stage Asset (Rival Published Strong Data)
  *   **Screening:** **Genuine Two-Sided Contest.** Rival is active and visible.
  *   **Test 1 (NPV):** Likely Negative. If rival data is "strong," their probability of success is higher, lowering your expected market share (winner-take-most).
  *   **Test 2 (Catch-Up):** Fail. If they just published strong mid-stage data, they are likely 12-18 months ahead. Catch-up cost > 20% budget.
  *   **Persistence-as-Evidence:** **Signal.** Rival has technical milestones (data).
  *   **Procedure Output:** **No-Go.**
  *   **Reasoning:** The rival has de-risked the target. In a winner-take-most market, being second with inferior/similar data is valueless.
  *   **Action:** Pivot to a niche indication where the rival's data doesn't apply, or license the asset to a non-competitor immediately while value remains.

  #### Case 2: Program Where Rival Left Field 2 Years Ago
  *   **Screening:** **Phantom Bidder.** The Program Lead describes it as a "race," but the rival exited >24 months ago.
  *   **Procedure Adjustment:** Reclassify immediately to **Ordinary One-Sided Escalation**. The "rival persistence" argument is inadmissible.
  *   **Test 1 (NPV):** Run on standalone merits.
  *   **Test 3 (Exit Cost):** Compare termination cost vs. 12-month burn.
  *   **Procedure Output:** **Likely No-Go.**
  *   **Reasoning:** If the rival left 2 years ago, they likely saw data you also have (since you are mid-stage). Their exit suggests the prize is smaller or the risk is higher than your team admits. The "race" rhetoric is a shield for sunk costs.
  *   **Action:** Challenge the Program Lead: "Why did the rival leave?" If the answer is "They were stupid," demand evidence. If no evidence, Kill.

  #### Case 3: The Flagship Program (3 Years Behind Leader)
  *   **Screening:** **Genuine Two-Sided Contest.** (Assuming leader is still active).
  *   **Test 1 (NPV):** Negative. 3 years behind in biotech is a commercial death sentence for a flagship asset.
  *   **Test 2 (Catch-Up):** Fail. Impossible to close a 3-year gap without infinite capital.
  *   **Persistence-as-Evidence:** **Noise.** The leader is winning; their persistence is expected. It tells us nothing about *your* chance to overtake.
  *   **Judgment Call Required:** **The Founder's Trap Call.**
  *   **Procedure Output:** **Stop Rule Triggered (No-Go).**
  *   **Action:** This goes to the **Independent Board Lead**.
      *   *Option A:* Kill the program. Write down the asset. Rebrand the company around newer pipeline assets.
      *   *Option B:* (Strategic Blocker) Keep it alive solely to maintain licensing valuation for partnership, explicitly budgeted as "Marketing Spend" rather than R&D.
  *   **Scientist's Advice:** Do not let this pass as a "Go" on scientific merit. It is a reputational decision. If the Board chooses to keep it, the budget must be slashed to the minimum required to keep the patent alive, not to win the race.

  ### Final Instruction to the Chair
  When you convene the next quarterly review, distribute this procedure 48 hours in advance. Require Program Leads to pre-fill the Screening Step. If a Lead marks "Phantom Bidder" as "Two-Sided," reject their deck before the meeting. This shifts the burden of proof from the skeptics (who look negative) to the proponents (who must prove the race is real).
