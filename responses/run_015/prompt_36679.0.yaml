prompt: |-
  I'm a PhD student in political philosophy, and my dissertation keeps circling the separateness of persons objection without ever landing on it. My advisor's line is that the objection is a family of complaints wearing one coat, and that most responses in the literature answer only one member of the family. I half believe her, but I also can't find anywhere that just lays out what the family members are. So before I read yet another paper I want the spec first: what does any adequate theory of moral aggregation have to deliver in order to count as respecting the separateness of persons? For my purposes the theory needs to be good enough for institutional choice -- how a state may trade off harms and benefits across its citizens -- not necessarily for private ethics, though say so if you think that restriction is doing suspicious work.

  Some of the cases I'd want on the list, though I'm sure I'm missing some: why I can accept a headache now to avoid my own agony later but can't impose your headache to relieve my agony (the intra- vs interpersonal tradeoff asymmetry); one person's torture versus tiny benefits spread over millions (transplant-adjacent but the budget version: a public health program that foreseeably kills a few to spare many small burdens); the utility monster; the fact that we're allowed to favor our kids over strangers, which pure aggregation seems to deny; whether aggregation is fine among strangers but not when a single person's life gets used up, or whether that's just a threshold effect and not a difference in kind; and whether there's any real distinction left between separateness of persons and the separateness of agents that anyone has to respect (states aggregate the choices of citizens all the time and nobody objects on these grounds). For each requirement I want the case or consideration that motivates it, and I want you to mark which are genuinely non-negotiable and which are just preferences of the anti-aggregation camp dressed up as constraints -- I suspect "no aggregation ever" and "aggregation is fine but not across life prospects" get conflated constantly.

  The part I most want to see: which pairs of requirements, if any, can't be jointly satisfied, because if the list itself is unsatisfiable that's actually my thesis chapter and not a problem. And which single requirement knocks out the most candidates -- my bet is it's something about interpersonal compensation, the idea that gains to one person can't count as compensating losses to another, and that it kills not just utilitarianism but prioritarianism too, which is awkward for people who present prioritarianism as the separateness-respecting reform of utilitarianism. At the end, briefly, score utilitarianism with diminishing marginal utility, prioritarianism, Rawlsian maximin, and Scanlon-style contractualism against your own list -- but keep that part short, the scoring is the least interesting bit and I can do it myself; the criteria are where the thinking is. A table is fine if it helps.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** PhD student in political philosophy.
      *   **Topic:** The "Separateness of Persons" (SoP) objection to moral aggregation (specifically in the context of institutional choice/state action).
      *   **Problem:** The literature treats SoP as a monolithic objection, but the advisor suggests it's a "family of complaints." The student can't find a clear taxonomy of this family.
      *   **Goal:** A specification of requirements an adequate theory of moral aggregation must meet to respect SoP.
      *   **Specific Constraints:**
          *   Focus on institutional choice (state trading off harms/benefits), not necessarily private ethics (but flag if this distinction is suspicious).
          *   Include specific cases mentioned (intra- vs. interpersonal tradeoffs, torture vs. tiny benefits, utility monster, partiality to kids, threshold effects, separateness of persons vs. agents).
          *   For each requirement: Provide the motivating case/consideration.
          *   Mark requirements as "Non-Negotiable" vs. "Contested/Preference."
          *   Identify incompatibilities (which pairs can't be jointly satisfied).
          *   Identify the "killer constraint" (likely interpersonal compensation).
          *   Score four theories (Utilitarianism w/ DMU, Prioritarianism, Rawlsian Maximin, Scanlonian Contractualism) against the list (keep this brief).
          *   Tone: Academic, rigorous, precise, acknowledging the complexity (no hand-waving).

  2.  **Deconstruct the "Separateness of Persons" (SoP):**
      *   Origin: Rawls (A Theory of Justice, §5), critiquing Utilitarianism.
      *   Core Idea: Society is not a super-person. What is rational for one person (sacrifice now for gain later) is not necessarily permissible for a state (sacrifice one citizen for the gain of others).
      *   The "Family of Complaints": It's not just one thing. It involves distribution, compensation, rights, thresholds, and the nature of the agent.

  3.  **Drafting the Requirements (The "Spec"):**
      *   *Requirement 1: The Non-Identity of Sacrifice and Benefit.* (The core Rawlsian point). Gains to A cannot simply cancel losses to B without remainder.
          *   *Case:* Organ transplant (kill 1 to save 5).
          *   *Status:* Non-Negotiable (for SoP defenders).
      *   *Requirement 2: The Intra/Interpersonal Asymmetry.*
          *   *Case:* Headache vs. Agony (self) vs. Headache (you) vs. Agony (me).
          *   *Status:* Non-Negotiable (defines the boundary).
      *   *Requirement 3: The Aggregation Threshold (or Non-Linearity).*
          *   *Case:* Torture vs. Millions of Headaches (Kamm/Scanlon).
          *   *Status:* Contested (is it a threshold or a slope?).
      *   *Requirement 4: Interpersonal Compensation.*
          *   *Case:* Can the state tax A to pay B? Can it risk A's life to save B?
          *   *Status:* Non-Negotiable (this is the "killer").
      *   *Requirement 5: Partiality vs. Impartiality in Institutions.*
          *   *Case:* Favoring kids vs. State neutrality.
          *   *Status:* Contested (Institutional vs. Private ethics distinction matters here).
      *   *Requirement 6: Separateness of Persons vs. Separateness of Agents.*
          *   *Case:* State aggregating citizen choices vs. State imposing tradeoffs.
          *   *Status:* Contested (often conflated).

  4.  **Analyzing Incompatibilities (The "Thesis Chapter"):**
      *   *Conflict 1: Aggregation vs. Non-Compensation.* If you can't compensate interpersonally, how do you justify *any* public policy that creates winners and losers? (Pareto improvements are rare).
      *   *Conflict 2: Thresholds vs. Continuity.* If a million headaches equal a torture, where is the line? If there's no line, SoP collapses into Utilitarianism. If there is a line, it seems arbitrary.
      *   *Conflict 3: Institutional Efficacy vs. SoP.* If the state can't trade off, it can't function (budgets, public health).

  5.  **Identifying the "Killer Constraint":**
      *   It is indeed **Interpersonal Compensation**. If gains to P1 cannot morally offset losses to P2, then almost all distributive policies are impermissible. This hits Utilitarianism hard, but also Prioritarianism (which still aggregates, just weighted).

  6.  **Addressing the Institutional/Private Distinction:**
      *   The user asked to flag if this is suspicious. It is. Rawls applied SoP to the *Basic Structure*. But if the Basic Structure can't aggregate, it can't exist. The distinction often hides the impossibility of the requirement.

  7.  **Scoring the Theories:**
      *   *Utilitarianism (w/ DMU):* Fails SoP fundamentally (aggregates across persons).
      *   *Prioritarianism:* Better on distribution, but still aggregates. Fails the strict compensation constraint.
      *   *Rawlsian Maximin:* Respects SoP strongly (lexicographical), but arguably too rigid for institutional choice (ignores small gains to many vs. large loss to one).
      *   *Scanlonian Contractualism:* Focuses on justification to individuals. Respects SoP well, but struggles with "numbers matter" cases (Save the Many vs. Save the One).

  8.  **Refining the Output (Tone and Structure):**
      *   Use philosophical terminology correctly (aggregation, offsetting, compensation, agent-relative/neutral).
      *   Keep it structured (The Spec, The Incompatibilities, The Killer, The Scorecard).
      *   Ensure the "Non-Negotiable" vs. "Contested" distinction is clear.
      *   *Self-Correction during drafting:* Make sure not to solve the problem, but to lay it out as requested. The user wants the *spec*, not the solution. The impossibility is the point.

  9.  **Final Review against User Prompt:**
      *   PhD level tone? Yes.
      *   Institutional focus? Yes.
      *   Specific cases included? Yes (Headache/Agony, Torture/Headaches, Utility Monster, Partiality, Agents).
      *   Non-negotiable vs. Preference marked? Yes.
      *   Incompatibilities highlighted? Yes.
      *   Killer constraint identified? Yes.
      *   Theory scoring (brief)? Yes.

  10. **Drafting the Content:** (Mental check of specific arguments).
      *   *Rawls:* SoP is about the distinction between a person and a society.
      *   *Nozick:* Rights as side-constraints (stronger SoP).
      *   *Kamm:* Relevance of numbers.
      *   *Otsuka/Scanlon:* Individualistic justification.
      *   *Prioritarianism (Parfit):* Weighted but still aggregative.
      *   *Institutional vs. Private:* Williams' integrity objection vs. State neutrality.

      *Let's structure the "Spec" as a set of constraints.*
      1.  **Constraint of Non-Fungibility:** Persons are not vessels for utility.
      2.  **Constraint of Non-Compensation:** Losses to A aren't erased by gains to B.
      3.  **Constraint of Asymmetry:** Intra-personal != Inter-personal.
      4.  **Constraint of Thresholds:** Some harms cannot be outweighed by trivial benefits.
      5.  **Constraint of Agency:** The state isn't a super-agent.

      *Wait, need to check the "Institutional" angle.* If the state can't compensate, how does taxation work? This is where the "suspicious work" comment comes in. I need to highlight that SoP proponents often retreat to "rights" or "ex ante" agreements to save institutional coherence.

      *Okay, ready to write.*
answer: |-
  This is a sharp diagnostic of the literature. Your advisor is right: "Separateness of Persons" (SoP) functions less as a single argument and more as a rhetorical umbrella for a cluster of distinct structural constraints on aggregation. When philosophers claim a theory "respects SoP," they often mean it satisfies *one* of these constraints while ignoring the others.

  Below is the specification you requested. It treats SoP not as a metaphysical claim about souls, but as a set of structural requirements for a decision procedure governing institutional choice.

  ### I. The Specification: Constraints for Respecting Separateness

  To count as respecting the SoP in an institutional context, a theory of moral aggregation must satisfy the following constraints. I have distinguished between those that are **Non-Negotiable** (core to the SoP intuition) and those that are **Contested** (often conflated with SoP but may be independent moral preferences).

  #### 1. The Constraint of Non-Offsetting (Interpersonal Compensation)
  *   **The Requirement:** A benefit to Person A cannot morally *cancel out* or *erase* a loss to Person B. The loss remains a moral remainder that requires specific justification to B, not just a net-positive sum to the collective.
  *   **Motivating Case:** The Transplant Case. Killing one healthy person to harvest organs for five dying patients creates a net gain in life-years, but the loss to the one is not *compensated* by the gain to the five. The one is used merely as a means.
  *   **Status:** **Non-Negotiable.** This is the Rawlsian core (*A Theory of Justice*, §5). Without this, society is treated as a super-person.
  *   **Institutional Implication:** Makes standard Cost-Benefit Analysis (CBA) morally suspect unless modified by rights or ex-ante consent.

  #### 2. The Constraint of Intra/Interpersonal Asymmetry
  *   **The Requirement:** A decision procedure must distinguish structurally between tradeoffs *within* a life and tradeoffs *across* lives. What is rational for an individual (sacrifice now for gain later) is not automatically permissible for an institution imposing sacrifices across citizens.
  *   **Motivating Case:** Headache vs. Agony. I may rationally endure a headache now to avoid my own agony later. The state cannot impose a headache on You to avoid my Agony, even if the utility math is identical.
  *   **Status:** **Non-Negotiable.** This defines the boundary of the SoP objection.
  *   **Institutional Implication:** Rejects the idea that the state can maximize "social welfare" using the same logic an individual uses to maximize "personal welfare."

  #### 3. The Constraint of Non-Aggregative Thresholds
  *   **The Requirement:** There must be some class of harms (rights violations, severe bodily integrity losses) that cannot be outweighed by the summation of trivial benefits across others, regardless of the number of others.
  *   **Motivating Case:** Torture vs. Headaches. Does torturing one person become permissible if it prevents a billion people from getting a mild headache? SoP suggests no.
  *   **Status:** **Contested.** Some argue this is a "deontological constraint" distinct from SoP. However, SoP proponents argue that without thresholds, the "separateness" dissolves into a fluid container for utility.
  *   **Institutional Implication:** Blocks "Budget Transplant" cases (e.g., public health policies that foreseeably kill a few to save minor burdens for many).

  #### 4. The Constraint of Individualized Justification
  *   **The Requirement:** Institutional choices must be justifiable *to each person* affected, not just to the "representative citizen" or the aggregate. If a policy imposes a loss on a specific individual, the justification cannot rely solely on the fact that others gained more.
  *   **Motivating Case:** Scanlon's *What We Owe to Each Other*. A principle cannot be rejected reasonably by individuals. If I am the one sacrificed, I can reasonably reject a principle that allows this for the greater good.
  *   **Status:** **Non-Negotiable** (for Contractualist interpretations of SoP).
  *   **Institutional Implication:** Shifts focus from *outcome* evaluation to *procedure* and *justification*.

  #### 5. The Constraint of Agent/Principal Distinction
  *   **The Requirement:** The theory must distinguish between the state aggregating the *choices* of citizens (democracy/market) and the state aggregating the *fates* of citizens (paternalistic tradeoffs).
  *   **Motivating Case:** Separateness of Agents. Citizens vote for a policy that risks their own safety (e.g., war, speed limits). This is permissible. The state imposing that risk without the mechanism of agency is not.
  *   **Status:** **Contested.** Often used to excuse Utilitarianism in institutional settings ("they chose it"). This is suspicious work if it masks the underlying aggregation of harms.
  *   **Institutional Implication:** Suggests SoP might be satisfied by democratic procedure rather than distributive outcomes.

  #### 6. The Constraint of Partiality Neutrality
  *   **The Requirement:** The institution must not replicate the agent-relative permissions of private ethics (e.g., favoring one's own children) unless there is a public reason for doing so.
  *   **Motivating Case:** Favoring Kids. I can save my child over a stranger. Can the state fund schools in District A over District B based on similar partiality? Pure aggregation says no (maximize total); SoP says the state must be impartial, but also cannot treat citizens as fungible.
  *   **Status:** **Contested.** This is often a confusion between SoP and Liberal Neutrality. SoP protects the *individual* from the *collective*; it doesn't necessarily dictate how the *collective* treats *sub-groups*.
  *   **Institutional Implication:** Limits the "private ethics" analogy. The state is not a parent; it is a trustee.

  ---

  ### II. The Incompatibilities (Your Thesis Chapter)

  The reason the literature is messy is that **this specification is likely unsatisfiable.** You cannot jointly satisfy all Non-Negotiable constraints in a non-ideal world where resources are scarce and risks are unavoidable.

  **1. The "Non-Offsetting" vs. "Institutional Viability" Paradox**
  *   **Conflict:** If gains to A cannot offset losses to B (Constraint 1), then almost no public policy is permissible. Building a highway benefits commuters but kills a few via pollution/accidents. Taxation benefits recipients but harms taxpayers.
  *   **The Trap:** To make the state functional, theorists retreat to **Ex-Ante Consent** (Constraint 5). They argue that if everyone *might* have been the loser, the tradeoff is permissible.
  *   **The Problem:** This collapses SoP back into a form of Expected Utility Maximization. If you accept ex-ante aggregation to save institutional viability, you have surrendered the core Non-Offsetting constraint for actual losers.

  **2. The "Threshold" vs. "Continuity" Problem**
  *   **Conflict:** Constraint 3 (Thresholds) demands a qualitative break between types of harms (torture vs. headache). However, welfare is arguably continuous.
  *   **The Trap:** If you set a threshold, you face the "Paradox of the Heap." Is one more headache enough to cross the line? If you say "numbers matter eventually," you concede aggregation. If you say "never," you face the "Fanaticism" objection (prevent a billion headaches even if it costs a life).
  *   **The Problem:** SoP requires a difference in kind, but institutional choice operates on differences in degree.

  **3. The "Individualized Justification" vs. "Numbers" Dilemma**
  *   **Conflict:** Constraint 4 requires justification to *each*. In a "Save the One vs. Save the Five" rescue case, how do you justify to the One that they are left to die?
  *   **The Trap:** Scanlonian contractualism struggles here. If the One can reasonably reject "let me die," and the Five can reasonably reject "let us die," the theory stalls.
  *   **The Problem:** To resolve it, you usually import aggregation (save the five), which violates the strict Non-Offsetting constraint regarding the One.

  ---

  ### III. The Killer Constraint

  You bet correctly. The **Constraint of Non-Offsetting (Interpersonal Compensation)** is the singularity that destroys the most candidates.

  *   **Why it kills Utilitarianism:** Obvious. It treats persons as vessels.
  *   **Why it kills Prioritarianism:** This is the awkward truth. Prioritarianism (giving weight to the worse off) is often sold as the "SoP-respecting" version of Utilitarianism. **It is not.** It still aggregates. It still allows a loss to P1 to be outweighed by gains to P2 and P3, provided P2 and P3 are worse off than P1. It respects the *distribution* of utility, but not the *separateness* of the persons holding it. It fails the Transplant Case just as hard as Utilitarianism, provided the priority weighting is satisfied.
  *   **Why it's the Killer:** If you enforce strict Non-Offsetting, you move from Aggregative Consequentialism to **Deontological Side-Constraints** (Nozick) or **Lexical Priorities** (Rawls). But as noted in the Incompatibilities section, strict side-constraints make institutional governance impossible without smuggling in ex-ante aggregation.

  **Suspicious Work Alert:** The restriction to "Institutional Choice" is often used to soften this constraint. Theorists argue the state can aggregate because it acts *ex-ante* on behalf of all. This is the "suspicious work." It redefines SoP from "no one may be sacrificed" to "no one may be sacrificed without a chance of being a beneficiary." The latter is compatible with Utilitarianism.

  ---

  ### IV. Theory Scorecard

  | Theory | Non-Offsetting | Intra/Inter Asymmetry | Thresholds | Individualized Justification | Viability |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Utilitarianism (w/ DMU)** | **FAIL** (Aggregates across persons) | **FAIL** (Treats society as super-person) | **FAIL** (Linear tradeoffs) | **FAIL** (Justifies to the sum) | **PASS** |
  | **Prioritarianism** | **FAIL** (Still aggregates, just weighted) | **FAIL** (Same structure as Util) | **PARTIAL** (Weights severe harms higher) | **FAIL** (Justifies to the weighted sum) | **PASS** |
  | **Rawlsian Maximin** | **PASS** (Lexical order prevents tradeoff) | **PASS** (Focus on representative worst-off) | **PASS** (Basic liberties are thresholded) | **PASS** (Veil of ignorance simulates this) | **FAIL** (Too rigid for risk/policy) |
  | **Scanlonian Contractualism**| **PASS** (No one reasonably rejectable) | **PASS** (Focus on individual grounds) | **PASS** (Urgency of claims matters) | **PASS** (Core mechanism) | **PARTIAL** (Struggles with "Numbers") |

  **Summary for the Dissertation:**
  The literature conflates **distributive sensitivity** (Prioritarianism) with **structural separateness** (Non-Offsetting). Your advisor is correct that it is a family of complaints. Your thesis opportunity lies in demonstrating that the "Non-Offsetting" member of the family is incompatible with the "Institutional Viability" requirement unless one retreats to ex-ante aggregation, which effectively surrenders the SoP objection. The "Separateness of Persons" is either a constraint that makes the state impossible, or it is a rhetorical device for preferred distributive outcomes.
