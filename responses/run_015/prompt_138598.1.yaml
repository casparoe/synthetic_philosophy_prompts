answer: |-
  **How I built the tree**

  The questions order commitments from concrete outcomes to metaphysical foundations. We begin with external results (the test) to establish whether control extends beyond the self. Next, we probe internal physiology (panic, phone checking) to see if bodily states count as "up to us." We then test interdependence (group project, climate) to distinguish individual from collective agency. The loop case arrives late to stress-test the consistency of earlier answers: if tranquility is a goal, is achieving it controllable? Finally, we ask about truth versus utility to separate pragmatists from realists. This progression forces participants to define the boundary of control before examining why that boundary matters, ensuring the diagnosis captures their operational logic rather than their preferred labels.

  **The questions**

  1.  **The Misgraded Test:** You studied perfectly, but the teacher makes an error costing you an A. Is the final grade something "up to you"?
      A) Yes, because my effort determines it.
      B) No, only my study habits were up to me.
      C) No, grades are never up to students.

  2.  **The Panic Attack:** Before a swim meet, your heart races uncontrollably. Is calming your body "up to you"?
      A) Yes, I can command my physiology.
      B) Only my response to the panic is up to me.
      C) No, physiological reactions happen to me.

  3.  **The Group Project:** Your grade depends on three partners who vanish. Is your contribution "up to you"?
      A) Yes, my part is fully within my control.
      B) Only my attempt is up to me; the quality depends on them.
      C) No, schoolwork is inherently interdependent.

  4.  **The Phone Slip:** You check your phone at 1 a.m., breaking a forty-night streak. Was this failure "up to you"?
      A) Yes, I chose to pick it up.
      B) Only the decision to try again tomorrow is up to me.
      C) No, habits bypass conscious choice.

  5.  **Taking Offense:** Someone sends a rude message. Is feeling hurt "up to you"?
      A) Yes, I assent to the insult.
      B) Only my subsequent reaction is up to me.
      C) No, pain is an automatic reflex.

  6.  **The Loop Case:** Trying to stop caring about outcomes is itself a task. Is succeeding at this task "up to you"?
      A) Yes, I can master my own caring.
      B) Only the attempt is up to me; success is not.
      C) No, tranquility cannot be forced.

  7.  **Climate Change:** Reducing emissions requires global coordination. Is saving the planet "up to you"?
      A) Yes, my actions contribute to the whole.
      B) Only my personal footprint is up to me.
      C) No, this is a collective problem, not an individual one.

  8.  **The Meaning of Failure:** If you get upset despite trying the dichotomy, did you fail?
      A) Yes, I failed to control my judgment.
      B) Yes, I failed to practice correctly.
      C) No, I am human; the tool just didn't work this time.

  9.  **Truth vs. Utility:** Does it matter if the dichotomy is metaphysically true?
      A) Yes, it must describe reality accurately.
      B) No, it only needs to reduce suffering.
      C) Yes, but only regarding moral responsibility.

  **Scoring key**

  Map your dominant answer pattern to these leaves. Most people will cluster around one of these positions in the logical space.

  *   **Strict Internalism:** Mostly B answers on Q1, Q2, Q5; A on Q6; A on Q9. You hold that only immediate assent is controllable.
  *   **Broad Volition:** Mostly A on Q1, Q3; B on Q2, Q5; A on Q9. You believe effort and intention count as "up to us," even if outcomes don't.
  *   **Therapeutic Pragmatism:** Mostly B answers; B on Q9. You view the dichotomy as a useful tool, not a metaphysical truth.
  *   **Responsibility View:** Mostly A on Q8; C on Q9. You define "up to us" by what you can be blamed or praised for, not causal control.
  *   **Collective Agency:** Mostly A on Q3, Q7; C on Q1. You reject the individual/external split for interdependent problems.
  *   **Loop Skeptic:** C on Q6; C on Q8. You believe the practice undermines itself because achieving tranquility is not controllable.
  *   **Unnamed/Incoherent:** Mixed A/C patterns (e.g., Outcomes are up to me, but I bear no responsibility). This space is logically possible but rarely defended.

  **Unoccupied combinations**

  The logical space allows for a position where outcomes are "up to you" (Answer A on Q1) but you bear no responsibility for failure (Answer C on Q8). This combination is empty because it is unattractive: claiming control over results while denying blame for missing them offers the benefits of agency without the costs of accountability. Another empty slot is claiming physiological control (A on Q2) while denying moral responsibility (C on Q8). This is incoherent; if you can command your body, you are generally held responsible for not doing so. These gaps exist because our concepts of control and responsibility are tightly linked in practice, even if they can be separated in theory.

  **Where the tree can't separate positions**

  The tree struggles to distinguish **Strict Internalism** from the **Responsibility View**. Both yield identical answers on almost all cases: both deny control over outcomes (Q1), both deny control over physiology (Q2), and both affirm responsibility for judgment (Q8). The difference is metaphysical: one claims you *cannot* control outcomes, the other claims you *should not be blamed* for them. Since the questions rely on case judgments rather than metaphysical definitions, these two positions overlap completely. Additionally, **Therapeutic Pragmatism** and **Broad Volition** may look identical if the pragmatist finds effort useful. Without asking directly about truth conditions (Q9), these blur together.

  **Confidence**

  I am highly confident (90%) that the case-based questions successfully separate **Broad Volition** from **Strict Internalism**, as the test and panic cases reliably expose this fault line. I am moderately confident (70%) that the **Collective Agency** leaf captures the climate change objection without collapsing into individualism. I am least sure (40%) about the **Loop Skeptic** leaf. It is unclear whether the loop case reveals a genuine structural flaw in Stoicism or merely a confusion about levels of agency. If tranquility is a byproduct rather than a target, the loop dissolves, but the tree treats it as a hard branching point. This is the weakest link because it depends on interpreting the goal of the practice, which varies by user.
