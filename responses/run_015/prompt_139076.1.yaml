prompt: |-
  I chair the serious-harm review panel for a hospital network. We sit fortnightly, we review roughly forty cases a year, and our findings are read by the board, by patients' families, and occasionally by a coroner, so a finding that someone's failure to act caused a death can end a career, and a finding that it did not can end a claim. The panel is three clinicians and one lay member, none of us with any training in philosophy; we have ninety minutes per case and no budget for outside experts or library access.

  Around two thirds of what we review is harm that nobody brought about by acting: a chart not reviewed, a deteriorating patient not escalated, a defibrillator not checked, a drug not reordered, a result not chased. We have no principled way to say when one of these absences is part of the causal history of the outcome and when it is merely a sad fact about the background against which the outcome happened. We currently improvise something close to a but-for test, and it keeps giving us answers we cannot defend: it returns causation wherever a hundred people each failed to do the same thing, it returns causation where the omitted act would have been too late or too weak to help, and it returns nothing at all when the failure belongs to no one in particular.

  Write me a decision procedure my panel could actually run, in order, with the following properties.

  It should open with the questions to ask in sequence, what will count as an adequate answer to each, and where the procedure terminates early with a negative finding. It should use a small fixed vocabulary of verdicts — I would suggest four, along the lines of causal omission by a named agent, causal omission not attributable to any individual, breach without causal contribution, and no omission — each defined tightly enough that two panels would not disagree about which applies, and each with a note on what follows from it in our report: recording, referral, sanction, or nothing.

  The procedure must include a specification rule for the counterfactual comparison, since this is where our arguments actually happen. Say explicitly what is to be held fixed when we ask what would have happened had the act been performed: other people's failures, the patient's underlying condition, what the same agent would have done next, the state of equipment. Require the panel to write the "would have" scenario as a short paragraph, say what to do when the panel cannot agree on it, and say what to do when the omitted act only had a chance of averting the harm — a thirty per cent chance of rescue, say — including whether the procedure adopts a threshold or refuses to.

  It should handle five patterns that account for most of our disputes, and for each it must say what it returns and where it stops:

  the latent omission — an omission that does nothing on its own and matters only because a safeguard downstream also failed;
  the shadowed omission — the same act was incumbent on someone else, or on an automated check, who also did not perform it, so that no single absence made the difference;
  the unadopted duty — the omission is a breach of a written protocol that nobody in that unit had ever realistically followed, so that on the unit's actual practice there was nothing to omit;
  the derived omission — the agent's failure is itself the product of a failure upstream, in rostering, training, supply or maintenance, so the causal question can always be pushed back one step, and then another;
  the vacant role — the duty attached to a post that was unfilled that shift, so there is an omission with no omitter.

  Give us a stopping rule for tracing derived omissions backwards, a causal horizon, since without one every one of our findings turns into a finding about a staffing decision made years ago by someone who has left.

  Mark every point at which the question before the panel is really one of values rather than fact — who may fairly be blamed, what we owe a family, whether a sanction is proportionate — and state plainly that the procedure is silent there and hands the decision to a person. Keep the whole thing to two sides of A4; it has to be usable in the room by people who have never read any of this literature and, since we cannot look anything up, nothing in it may depend on our knowing one.

  Then run it on three of our cases, as an appendix. First: a patient's observations crossed the escalation threshold at two in the morning and the nurse did not call the outreach team, expecting, in line with the unit's actual practice, that the night coordinator would review the charts at four; the coordinator was diverted to another emergency and did not; the patient arrested at half past five, and review at four would probably have prevented it. Second: a drug needed in resuscitating anaphylaxis was not reordered when stock fell three weeks earlier; three people had authority to order it and each assumed another had; two usable substitutes were in the building, neither in the resus trolley and neither named in the protocol; the patient died. Third: a junior doctor was the sole doctor covering two wards overnight after being told the second ward was staffed; a review assigned to her by protocol did not happen and a patient in that ward died; the rota that left her covering both had been signed off eleven months earlier by a manager who has since left.

  At least one of these must come out in a way my panel will not like, and I want you to say so without softening it: give the verdict the procedure returns, show the steps, and tell us why we will find it unwelcome. Close by stating what the procedure cannot do — the questions it has no resources to settle, the cases in which its verdicts are artefacts of how we specified the counterfactual, and the ways in which writing it down will change the answers we give.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Chair of a serious-harm review panel for a hospital network.
      *   **Context:** Fortnightly meetings, ~40 cases/year. High stakes (Board, families, coroners, careers, claims).
      *   **Panel:** 3 clinicians, 1 lay member. No philosophy training. 90 mins/case. No budget/experts.
      *   **Problem:** 2/3 cases involve omissions (failures to act). Current "but-for" test is failing (over-inclusive, under-inclusive, diffuse responsibility).
      *   **Task:** Write a decision procedure (algorithm/guide) for determining causal omission.
      *   **Constraints:**
          *   Must be usable in the room (no external lookup).
          *   Max 2 sides of A4 (concise, dense).
          *   Specific structure: Sequential questions, adequate answers, early termination.
          *   Vocabulary: 4 fixed verdicts (Causal Omission by Agent, Causal Omission Unattributable, Breach without Causal Contribution, No Omission).
          *   Counterfactual Specification: Explicit rules on what is held fixed. Written scenario requirement. Handling probability/chance (threshold vs. refusal). Disagreement handling.
          *   Handle 5 Specific Patterns: Latent, Shadowed, Unadopted Duty, Derived, Vacant Role.
          *   Stopping Rule: Causal horizon for derived omissions.
          *   Value vs. Fact: Mark where value judgments enter and hand off to a person.
          *   Appendix: Run the procedure on 3 specific cases. One must be unwelcome.
          *   Closing: Limitations of the procedure.

  2.  **Drafting the Decision Procedure (The Core):**

      *   *Goal:* Create a flowchart-like text that fits on 2 pages.
      *   *Vocabulary:*
          1.  **Causal Omission (Agent):** Specific person failed, action would likely have prevented harm. -> *Referral/Sanction consideration.*
          2.  **Causal Omission (System/Unattributable):** Duty existed, no one did it, harm resulted. -> *Systemic Referral/Recording.*
          3.  **Breach without Causation:** Duty failed, but action wouldn't have changed outcome. -> *Recording/Learning only.*
          4.  **No Omission:** No duty or no failure. -> *Nothing.*
      *   *Counterfactual Rule:* This is crucial. Need to avoid "magic wand" thinking.
          *   *Fixed:* Patient's underlying pathology (unless treatment changes it), other independent failures (unless the omission caused them), equipment state (unless maintenance was the duty).
          *   *Variable:* The specific omitted act is performed *competently* at the *time required*.
          *   *Probability:* "More likely than not" (>50%) standard for causation. If <50%, it's Breach without Causation.
      *   *The 5 Patterns:*
          *   *Latent:* Downstream failure breaks the chain? No, if the first omission created the *risk* that the second failure exploited, it's causal. But if the second failure was independent and sufficient, the first might be Breach without Causation. Let's refine: If the downstream safeguard was *required* to function regardless, the upstream omission is causal only if it made the safeguard's failure *likely* or *inevitable*. Actually, simpler: If the downstream failure was independent, the upstream omission is usually "Breach without Causation" regarding the *death*, but "Causal" regarding the *risk*. Let's stick to the prompt's definition: "matters only because a safeguard downstream also failed." Verdict: Breach without Causation (regarding the death), unless the downstream failure was a *foreseeable consequence* of the upstream one. Let's make it: If the downstream failure is independent, the upstream omission is not causal for the *outcome*.
          *   *Shadowed:* Multiple people could act. If *any* one acting would have prevented harm, but *none* did, who is causal? If duties were shared, it's Unattributable. If duties were specific, it's Agent.
          *   *Unadopted Duty:* Protocol exists, practice differs. If practice is accepted, No Omission. If practice is negligent, Causal Omission (System).
          *   *Derived:* Rostering/Training. Stop at the "Operational Horizon" (the shift/team level). Don't blame the HR manager 11 months ago.
          *   *Vacant Role:* Duty exists, no person. Verdict: Causal Omission (Unattributable).
      *   *Value Judgments:* Explicitly flag where "fairness" or "blame" enters. The procedure determines *causation*, not *culpability*.

  3.  **Drafting the Appendix (The Cases):**

      *   *Case 1 (Nurse/Coordinator):* Nurse didn't call (expected Coordinator). Coordinator didn't check (diverted). Patient died. Review at 4am would have saved.
          *   *Analysis:* Nurse had duty? Yes. Coordinator had duty? Yes. Nurse's omission: If she called, patient saved. Coordinator's omission: If he checked, patient saved. Shadowed? No, distinct duties. Latent? Nurse's failure relied on Coordinator's failure to result in death? Actually, if Nurse called, Coordinator irrelevant. If Nurse didn't call, Coordinator was the backup. Coordinator failed.
          *   *Verdict:* Nurse = Causal Omission (Agent). Coordinator = Causal Omission (Agent) OR Breach without Causation (if Nurse's failure made it impossible? No, 4am is before 5:30am arrest). Both are causal. *Wait, prompt says one must be unwelcome.* If we blame the Nurse, she might feel it was standard practice to wait. If we blame the Coordinator, he was diverted. Let's make the Nurse's verdict "Breach without Causation" because the *effective* duty lay with the Coordinator at 4am? No, escalation threshold was 2am. Nurse failed at 2am. Coordinator failed at 4am. Both causal.
          *   *Unwelcome Angle:* If we rule the Nurse's omission is *not* causal because the Coordinator *should* have caught it (Latent/Shadowed logic), that protects the nurse but might seem wrong clinically. OR, if we rule the Coordinator's omission is *not* causal because the patient was already doomed by 2am (unlikely given prompt says 4am review would prevent).
          *   *Better Unwelcome:* Case 3 (Rota). Junior doctor alone. Rota signed 11 months ago.
          *   *Analysis:* Doctor failed review. Cause: Overwork/Rota. Rota manager left.
          *   *Procedure:* Derived Omission. Stop at Operational Horizon (the shift). Doctor had duty. Could she have done it? No (physically impossible?). If impossible, No Omission. If possible but failed, Causal. But the *cause* of the failure is the Rota.
          *   *Unwelcome:* The procedure might exonerate the Manager (left job, outside horizon) and blame the Junior Doctor (on shift, had duty), even though the Doctor was set up to fail. OR, it might rule "Causal Omission (Unattributable)" which satisfies no one (Doctor feels blamed, Board wants a person). Let's aim for: The Doctor gets "Causal Omission (Agent)" because the Horizon stops at the shift. This is unwelcome because it ignores the systemic setup.
      *   *Case 2 (Drug/Anaphylaxis):* Drug not reordered. 3 people could order. 2 substitutes existed but not in trolley/protocol.
          *   *Analysis:* Shadowed Omission. 3 people, none acted. Substitutes available but not used (protocol).
          *   *Verdict:* Causal Omission (Unattributable). No single agent.
      *   *Case 3 (Junior Doctor/Rota):* Sole doctor, 2 wards. Rota signed 11 months ago by ex-manager.
          *   *Analysis:* Derived Omission. Doctor failed review. Why? Rostering.
          *   *Horizon:* Stop at shift level.
          *   *Verdict:* Causal Omission (Agent) - The Doctor. (Because the rostering decision is outside the causal horizon for *clinical* causation, even if it explains the failure).
          *   *Why Unwelcome:* It blames the exhausted junior, exonerates the management system.

  4.  **Refining the Procedure (Iterative Polish):**

      *   *Length:* Needs to be tight.
      *   *Tone:* Professional, directive, clear.
      *   *Counterfactual:* Must be very specific. "Hold fixed the patient's physiology at time T. Hold fixed the actions of others *unless* the omitted act would have compelled a different response."
      *   *Probability:* "Substantial Chance" (>50%). If <50%, Breach without Causation.
      *   *Value Flags:* Use bolding or boxes to indicate "VALUE JUDGMENT".
      *   *The 5 Patterns:* Integrate them into the steps rather than a separate list to save space, or have a specific "Pattern Check" section. A specific section is clearer for the "5 patterns" requirement.
      *   *Horizon:* Define "Operational Horizon" = The immediate clinical team/shift.

  5.  **Review against Constraints:**

      *   2 sides A4? (Need to be concise).
      *   4 Verdicts? Yes.
      *   Counterfactual spec? Yes.
      *   5 Patterns handled? Yes.
      *   Stopping rule? Yes.
      *   Value/Fact distinction? Yes.
      *   Appendix with 3 cases? Yes.
      *   One unwelcome verdict? Yes (Case 3).
      *   Closing limitations? Yes.

  6.  **Writing - Section by Section:**

      *   *Header:* SERIOUS-HARM REVIEW PANEL: CAUSAL OMISION PROCEDURE.
      *   *Verdicts:* Define clearly.
      *   *Step 1: Duty & Omission.* (No Omission exit).
      *   *Step 2: Counterfactual Specification.* (The "Hold Fixed" rules).
      *   *Step 3: Causal Contribution.* (The >50% test).
      *   *Step 4: Attribution.* (Agent vs. Unattributable).
      *   *Pattern Handling:* Integrate into steps or add a "Special Rules" section. A "Special Rules" section is better for the 5 specific patterns requested.
      *   *Value Flags:* Insert where blame/sanction is decided.
      *   *Appendix:* Run the cases.
      *   *Limitations:* Honest conclusion.

      *(Self-Correction during drafting)*: I need to ensure the "Unwelcome" verdict is clearly identified as such in the commentary. Case 3 is the best candidate. The procedure stops the buck at the doctor, ignoring the manager who made the unsafe rota. This is legally defensible but morally uncomfortable.

      *(Refining Counterfactuals)*: The prompt asks for a "short paragraph" requirement. I must include that.
      *(Refining Probability)*: Prompt asks for threshold or refusal. I will choose a threshold (>50%) for practicality, noting it's a value judgment.
      *(Refining Horizon)*: "Causal Horizon" = 12 months or departure of responsible manager? No, "Operational Horizon" = The immediate clinical shift/team. Upstream decisions (HR, Rostering) are "Background Conditions," not Causal Omissions *for this panel*.

      *(Checking Length)*: I need to be very economical with words to fit the "2 sides of A4" constraint (roughly 1000-1200 words for the procedure itself, plus appendix). I will prioritize the Procedure text to be dense.

      *(Final Polish on Case 1)*: Nurse vs Coordinator. Nurse failed at 02:00. Coordinator failed at 04:00. Arrest 05:30. If Nurse acted, harm prevented. If Coordinator acted, harm prevented. This is a "Shadowed" scenario in time. Both are causal. To make it interesting, I will rule the Nurse's omission is *Causal*, but note the Coordinator's failure doesn't absolve her. Or, I can rule the Coordinator's omission is *Breach without Causation* if the patient was already deteriorating irreversibly by 04:00? Prompt says "review at four would probably have prevented it." So Coordinator is Causal. Nurse is Causal. This is "Over-inclusive." How to fix? The procedure needs to handle "Intervening Omission." If the Coordinator's duty was *specifically* to catch Nurse errors, the Nurse's error is causal, Coordinator's is causal. If the Coordinator's duty was independent, both are causal. I will stick to the procedure's logic: Both are causal. The "Unwelcome" one will definitely be Case 3.

      *(Wait, Case 1 Unwelcome potential)*: If we rule the Nurse is *not* causal because the Coordinator *should* have caught it (Latent Omission logic), that protects the nurse but violates the "but-for" reality. If we rule she *is* causal, it feels harsh given the unit culture. I'll stick to Case 3 for the "Unwelcome" label as it highlights the System vs. Individual tension best.

      *(Final check on Value Judgments)*: I need to explicitly mark where the procedure stops and human judgment begins (e.g., Sanctioning).

      *(Final check on 5 Patterns)*:
      1. Latent: Upstream omission + Downstream failure. Verdict: Breach without Causation (for upstream) if downstream failure was independent.
      2. Shadowed: Multiple agents. Verdict: Unattributable if duties shared/indistinct. Agent if distinct.
      3. Unadopted Duty: Protocol vs Practice. Verdict: No Omission if practice accepted/safe. Causal if practice negligent.
      4. Derived: Upstream cause (rostering). Verdict: Stop at Horizon. Agent (on shift) or Unattributable.
      5. Vacant Role: No omitter. Verdict: Unattributable.

      Let's write.

      *(Word Count Check)*: The prompt asks for the procedure to be 2 sides of A4. The appendix is *additional*. I will format the Procedure to be dense.

      *(One detail)*: "Mark every point at which the question before the panel is really one of values rather than fact". I will use **[VALUE]** tags.

      *(One detail)*: "At least one of these must come out in a way my panel will not like... tell us why". I will add a commentary section after the case run.

      *(One detail)*: "Close by stating what the procedure cannot do". I will add a "Limitations" section at the very end.

      Let's assemble.

      *Drafting the Counterfactual Rule:*
      "Write the 'World Where Act Happened' paragraph.
      Hold Fixed: Patient's underlying disease trajectory at time of omission; Actions of other agents *unless* your act would have compelled a different response; Equipment state *unless* maintenance was the duty.
      Variable: The omitted act is performed competently at the required time."

      *Drafting the Horizon:*
      "Causal Horizon: The operational shift and the immediate clinical team. Do not trace causes to staffing budgets, policy drafting, or managers who have left the organisation."

      *Drafting the Verdicts:*
      1. Causal Omission (Agent).
      2. Causal Omission (Unattributable).
      3. Breach without Causal Contribution.
      4. No Omission.

      *Drafting the 5 Patterns:*
      I will embed these as "Special Rules" within the flow.

      *Let's go.*
answer: |-
  # SERIOUS-HARM REVIEW PANEL: CAUSAL OMISION PROCEDURE

  **VERDICTS**
  1.  **Causal Omission (Agent):** A named individual failed a specific duty; performance would likely (>50%) have prevented harm. *Follow-up: Record, Refer for disciplinary consideration.*
  2.  **Causal Omission (Unattributable):** A duty existed and was unfulfilled, causing harm, but no single individual is responsible (e.g., shared duty, vacant post). *Follow-up: Record, Refer for system review.*
  3.  **Breach without Causal Contribution:** A duty was failed, but performance would not have prevented the outcome. *Follow-up: Record, Learning only.*
  4.  **No Omission:** No duty existed, or the duty was fulfilled. *Follow-up: Nothing.*

  ---

  ### STEP 1: DUTY AND FAILURE
  **Q1: Did a specific duty to act exist at the relevant time?**
  *   *Adequate Answer:* Yes (Protocol, contract, or established standard of care) / No (No expectation).
  *   *If No:* **Verdict 4 (No Omission).** Stop.
  *   *Note on Unadopted Duty:* If a written protocol exists but was never followed in practice, ask: Was the non-compliance accepted as safe by the unit? If Yes, **Verdict 4**. If No (practice was negligent), Duty Exists. **[VALUE]** *Panel must judge whether the 'real' practice was acceptable.*

  **Q2: Did the agent(s) fail to perform the duty?**
  *   *Adequate Answer:* Yes / No.
  *   *If No:* **Verdict 4 (No Omission).** Stop.
  *   *If Yes:* Proceed to Step 2.
  *   *Note on Vacant Role:* If the duty attached to a post that was empty, Duty Exists, but no Agent. Proceed to Step 3, mark for **Verdict 2**.

  ### STEP 2: COUNTERFACTUAL SPECIFICATION
  **Q3: Construct the 'World Where Act Happened'.**
  *   *Requirement:* The Panel Secretary must write one paragraph describing what happens if the act *was* performed.
  *   *Hold Fixed:* (1) The patient's underlying pathology at the time of omission (unless the act treats it); (2) The actions of other agents *unless* the omitted act would have compelled a different response; (3) Equipment state *unless* maintenance was the duty.
  *   *Variable:* The omitted act is performed competently at the required time.
  *   *Disagreement:* If the Panel cannot agree on this paragraph, they cannot agree on causation. **Verdict 3 (Breach without Causal Contribution).** Stop.

  **Q4: Would the act have prevented the harm?**
  *   *Threshold:* "More likely than not" (>50% chance).
  *   *If Yes:* Causal Contribution Established. Proceed to Step 3.
  *   *If No (or <50%):* **Verdict 3 (Breach without Causal Contribution).** Stop.
  *   *Note on Probability:* **[VALUE]** *Choosing 50% is a policy decision, not a scientific fact. It prioritises certainty over sensitivity.*

  ### STEP 3: ATTRIBUTION AND HORIZON
  **Q5: Is the cause traceable to a named individual?**
  *   *If Yes (Single Agent):* **Verdict 1 (Causal Omission - Agent).** Stop.
  *   *If No (Shared/Vacant):* Proceed to Q6.
  *   *Note on Shadowed Omission:* If multiple people had the same duty and all failed, and any one acting would have saved the patient: **Verdict 2 (Unattributable).** Do not select the 'most' responsible. **[VALUE]** *This sacrifices individual accountability for fairness.*

  **Q6: Is the omission 'Derived' from an upstream failure?**
  *   *Definition:* The agent failed because of rostering, training, supply, or maintenance failures.
  *   *Causal Horizon:* Stop tracing at the **Operational Shift**. Do not attribute causation to managers who left, HR policies, or budget decisions made >3 months prior.
  *   *Rule:* If the immediate cause is the agent's failure on the shift, attribute to the Agent (**Verdict 1**), even if upstream factors contributed. If the upstream failure made performance *impossible* (e.g., no staff present), **Verdict 2 (Unattributable)**.
  *   *Note on Latent Omission:* If the omission only mattered because a downstream safeguard also failed:
      *   If the downstream failure was independent: **Verdict 3 (Breach without Causation)** for the upstream agent.
      *   If the downstream failure was foreseeable/dependent: **Verdict 1**.

  ### STEP 4: SANCTION (VALUE JUDGMENT)
  **Q7: Does Causation imply Blame?**
  *   **PROCEDURE SILENT.** This question is for the Board/HR. The Panel records causation only. **[VALUE]** *Do not recommend sanction in this report.*

  ---

  ## APPENDIX: CASE RUNS

  **Case 1: The Night Escalation (Nurse & Coordinator)**
  *   **Facts:** Nurse (02:00) saw threshold breach, did not call Outreach (expected Coordinator). Coordinator (04:00) diverted, did not check charts. Patient arrested (05:30). 04:00 review would have prevented death.
  *   **Step 1:** Duty existed for both. Both failed.
  *   **Step 2 (Counterfactual):**
      *   *Nurse:* If Nurse called at 02:00, Outreach arrives. Patient saved. (>50%).
      *   *Coordinator:* If Coordinator checked at 04:00, Outreach called. Patient saved. (>50%).
  *   **Step 3 (Attribution):**
      *   Nurse: Named agent. **Verdict 1 (Causal Omission - Agent).**
      *   Coordinator: Named agent. **Verdict 1 (Causal Omission - Agent).**
      *   *Pattern:* Shadowed/Latent. Both omissions were sufficient causes. The Coordinator's failure does not negate the Nurse's causal contribution, as the Nurse's call would have bypassed the Coordinator.
  *   **Result:** Two findings of Causal Omission (Agent).

  **Case 2: The Missing Drug (Anaphylaxis)**
  *   **Facts:** Drug out of stock. 3 staff had authority to reorder; none did. Substitutes existed but not in protocol/trolley. Patient died.
  *   **Step 1:** Duty to maintain stock existed. Failed.
  *   **Step 2 (Counterfactual):** If drug reordered 3 weeks prior, it would be present. Resuscitation succeeds. (>50%).
  *   **Step 3 (Attribution):**
      *   Duty shared by 3 staff. No single person assigned. All assumed another acted.
      *   *Pattern:* Shadowed Omission.
      *   *Rule:* Shared duty, all failed. **Verdict 2 (Causal Omission - Unattributable).**
  *   **Result:** Systemic failure recorded. No individual referral.

  **Case 3: The Junior Doctor (Rostering)**
  *   **Facts:** Junior Doctor sole cover for 2 wards (protocol says 2 doctors). Review missed. Patient died. Rota signed 11 months ago by Manager (now left).
  *   **Step 1:** Duty to review existed. Failed.
  *   **Step 2 (Counterfactual):** If review happened, deterioration caught. Patient saved. (>50%).
  *   **Step 3 (Attribution):**
      *   *Pattern:* Derived Omission. Cause is Rostering.
      *   *Horizon Rule:* Stop at Operational Shift. Manager is outside horizon (left org, >3 months).
      *   *Impossibility Check:* Was it *physically* impossible? No, just highly improbable due to workload.
      *   *Rule:* Upstream failure explains but does not negate shift-level causation.
      *   **Verdict 1 (Causal Omission - Agent).** The Junior Doctor.
  *   **Result:** Causal Omission assigned to the Junior Doctor.

  ### COMMENTARY ON UNWELCOME VERDICT (CASE 3)
  **Verdict:** Causal Omission (Agent) – Junior Doctor.
  **Why Unwelcome:** The Panel will likely feel this is unjust. The Doctor was set up to fail by a managerial decision (the rota) made 11 months prior. The procedure exonerates the Manager (outside Causal Horizon) and the System (Horizon stop), landing the causal finding on the individual least able to change the conditions.
  **Why the Procedure Returns This:** To prevent every clinical error from becoming an investigation into HR strategy or budget decisions made years ago. The "Causal Horizon" forces the panel to treat the staffing level as a *background condition* (like the patient's disease), not a causal omission *for this review*. This ensures findings remain actionable within the clinical network, but it risks punishing the symptom (the doctor) rather than the cause (the roster).

  ---

  ## LIMITATIONS OF THIS PROCEDURE

  1.  **Moral Luck:** The procedure treats two identical failures differently if one patient dies and the other survives. It cannot account for the moral equivalence of the risk taken.
  2.  **Artefacts of Specification:** The "Hold Fixed" rule determines the verdict. If we held fixed "the Coordinator's diversion" in Case 1, the Nurse is causal. If we held fixed "the Nurse's silence," the Coordinator is causal. We chose to hold fixed independent failures, which creates multiple causal agents.
  3.  **The 50% Threshold:** In cases of "30% chance of rescue," this procedure returns *Breach without Causal Contribution*. A family may view a lost 30% chance as a cause of death. The procedure denies this to maintain binary clarity.
  4.  **Reification:** Writing the "World Where Act Happened" paragraph creates a fiction. It assumes competence in the counterfactual that may not have existed in reality. We are judging the *act*, not the *actor*, but the report will be read as a judgment on the actor.
  5.  **Value Silence:** By marking Sanction as **[VALUE]**, the procedure passes the hardest decision to someone else. This protects the Panel, but may lead to inconsistency in outcomes across the network.
