answer: |-
  # Q&A Prep Sheet: Threshold Contractualism

  **Context:** Seminar Defense
  **Audience:** Analytic Ethicists, Political Philosophers, Rationalist/EAs
  **Goal:** Defend the "structured failure mode" without collapsing into utilitarianism or ad hocery.

  ---

  ### 1. The "Causal Impotence" Objection (The EA/Rationalist Grad Student)
  **The Question:**
  "Look, I get the intuition on climate, but you're trying to have your cake and eat it too. If my individual burger doesn't cross the threshold of harm—if it makes no causal difference to the suffering of the chicken or the temperature of the planet—why is it *wrong*? You say there's a 'systemic justification gap,' but that sounds like magic. If I don't change the outcome, what grounds the obligation? Isn't this just guilt-tripping without a mechanism?"

  **The Reply:**
  "Great question, and this is exactly where contractualism parts ways with consequentialism. You're asking for a causal mechanism; I'm offering a justificatory one. On my view, wrongness isn't about being the *cause* of a specific unit of harm. It's about participating in a practice that cannot be justified to those harmed by it.

  Think of it like this: If we're all shooting into a crowd, and each bullet is non-lethal on its own but collectively kills someone, you can't say 'my bullet didn't kill them.' You participated in a lethal practice. The 'threshold' isn't about physical impact; it's about moral complicity in a pattern. When the collective pattern creates a harm that is reasonably rejectable, participating in that pattern is unjustifiable, even if your individual contribution is sub-threshold. The obligation comes from the duty to not engage in unjustifiable practices, not the duty to maximize good outcomes."

  **Soft Spot/Concession:**
  "I'll admit, this feels less satisfying if you're deeply committed to the 'no difference, no obligation' intuition. I'm conceding that individual causal impact isn't the sole metric for moral obligation. If they push hard on 'but literally nothing changes if I stop,' I have to stand firm that contractualism is about *principles*, not *outcomes*, but I know that won't fully satisfy a consequentialist."

  ---

  ### 2. The "Scanlon Purist" Objection (The Senior Faculty)
  **The Question:**
  "I'm worried you're stretching 'reasonable rejectability' until it snaps. Scanlon is very clear that we look at the burdens of principles. If the burden of me not eating this burger is high (I lose enjoyment) and the benefit to others is negligible (no chicken saved), how can you say a principle allowing this is rejectable? You seem to be smuggling aggregation in by talking about 'collective patterns.' Isn't this just contractualism in name only?"

  **The Reply:**
  "I'm not smuggling aggregation in; I'm shifting the locus of evaluation. Standard Scanlonism looks at the principle governing the *act*. I'm arguing we need to look at the principle governing the *practice*.

  A principle that says 'Anyone may participate in factory farming whenever they like' is rejectable by the chickens, because the *practice* guarantees massive suffering. A principle that says 'No one may participate' is not overly burdensome to us collectively, even if individual instances seem trivial. The 'structured failure mode' happens when we only look pairwise. My threshold contractualism says: when pairwise interactions systematically lead to a rejectable outcome, the principle permitting those interactions becomes rejectable *because of the pattern*, not because we summed the harms. We're rejecting the rule that allows the gap, not summing the instances."

  **Soft Spot/Concession:**
  "Honestly, this is the biggest tension in the view. Scanlon might say I'm changing the subject. I'm conceding that this requires a modification of standard contractualist methodology. I'm moving from 'individual act evaluation' to 'practice evaluation,' which risks looking like rule-worship. I need to be careful not to sound like I'm just importing rule-utilitarianism here."

  ---

  ### 3. The "Political/Structural" Objection (The Political Philosopher)
  **The Question:**
  "This feels like you're moralizing a political problem. Climate change and factory farming are failures of regulation and institutions. By framing this as an individual moral obligation based on 'thresholds,' aren't you letting the state off the hook? If the structure is the problem, why are you putting the burden on individual agents to solve a coordination failure through moral philosophy?"

  **The Reply:**
  "I'm not letting the state off the hook; I'm saying individual obligations exist *alongside* structural ones, not instead of them. Waiting for perfect institutions while the harm continues is itself unjustifiable.

  My view actually supports your intuition: the 'systemic justification gap' highlights exactly why we need structural change. But until that change happens, individuals are still bound by the requirement not to participate in unjustifiable harms. If we say 'I'll stop only when the law makes me,' we're effectively saying 'I'll stop harming you only when forced to.' Contractualism demands we justify our actions to others *now*, not just when the government catches up. The individual obligation is the moral floor, not the ceiling."

  **Soft Spot/Concession:**
  "I risk overburdening the individual here. If the structural change is the only thing that actually works, demanding individual purity can be exploitative. I need to concede that individual action is insufficient without structural change, but maintain it's still *necessary*."

  ---

  ### 4. The "Voting Stress Test" (The Analytic Ethicist)
  **The Question:**
  "You mentioned voting as a stress test. If your logic holds for climate harm—where my individual impact is negligible but the collective outcome is bad—doesn't it apply to voting? If everyone reasons like a contractualist and stays home because their vote doesn't cross the threshold, democracy collapses. So, are you obligated to vote? If yes, how do you distinguish that from the climate case without being inconsistent? If no, why is voting different?"

  **The Reply:**
  "This is the crucial distinction. In the climate/farming case, the collective action produces a *harm* (suffering, warming). In the voting case, the collective action produces a *benefit* or prevents harm through a decision procedure.

  My threshold applies to participating in *harmful practices*. Voting is participating in a *remedial practice*. The obligation to vote comes from a different principle: the duty to support just institutions. The 'failure mode' I'm identifying is specifically about *negative* externalities that accumulate. Voting doesn't accumulate harm; it accumulates legitimacy. So, I can argue you're obligated to vote to sustain the institution, and obligated to not farm to avoid the harm. They're symmetrical in that both involve collective thresholds, but asymmetrical in valence. One prevents a justification gap; the other creates one."

  **Soft Spot/Concession:**
  "This is tricky. If someone argues that *not* voting contributes to the harm of bad governance, the symmetry returns. I'm relying on the distinction between 'harming' and 'allowing harm via institutional decay,' which is philosophically contentious. I might have to concede that the voting obligation is weaker or derived differently."

  ---

  ### 5. The "Nightmare Question" (The Collapse/Ad Hoc Objection)
  **The Question:**
  "I'm going to press on the voting point because I think it reveals the real problem. You're trying to avoid utilitarian aggregation, but your solution looks exactly like Rule-Utilitarianism. You're saying 'follow the rule that, if generalized, avoids bad outcomes.'

  If you distinguish climate from voting based on 'harm vs. benefit,' aren't you just doing a utilitarian calculus anyway? How do you prove this isn't just contractualism disguised as rule-utilitarianism? And if it *is* basically rule-utilitarianism, what work is the 'contractualist' label doing other than branding? Be honest: can your framework distinguish voting from climate without being ad hoc, or does it collapse?"

  **The Reply:**
  "That's the million-dollar question. Here's the honest distinction: Rule-Utilitarianism optimizes for *outcomes*. My view optimizes for *justifiability*.

  In Rule-Utilitarianism, if breaking the rule secretly produced better outcomes, you'd have to break it. In Threshold Contractualism, even if my individual burger somehow produced a net good (maybe I stimulate the economy), it's still wrong if the principle allowing it is rejectable to the victim. The 'contractualist' work is done by the *veto power* of the affected party, not the sum total of welfare.

  On the ad hoc charge: It's not ad hoc because it relies on the direction of the justification gap. Climate creates a gap where victims cannot justify the harm to them. Voting creates a gap where citizens cannot justify the collapse of the system to each other. The structure is the same—collective thresholds—but the moral valence is determined by who is being wronged, not by summing utility. It's not utilitarianism because I'm not aggregating good; I'm checking for rejectable principles."

  **Soft Spot/Concession:**
  "Okay, this is the weakest link. The line between 'optimizing outcomes' and 'avoiding rejectable principles' gets very thin when you talk about collective patterns. I have to concede that my view *converges* with Rule-Utilitarianism in many practical cases. The distinction is foundational (justification vs. optimization), but in practice, it might look identical. I'm standing on the metaphysical difference, but I know empirically, it's hard to spot."
