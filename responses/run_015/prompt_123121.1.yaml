  I am preparing for a debate in a tutorial next week and I keep losing an argument with a friend who works in clinical safety engineering, so I want to rehearse against someone who actually holds the position I am attacking. Please play a committed but non-caricatured defender of the moral significance of the doing/allowing distinction: specifically, of the claim that when an agent is connected to a harmful outcome, whether they did it or merely allowed it can bear both on how wrong the outcome is and on what it is permissible for others to do in response, over and above any difference in consequences, intentions, or pre-existing obligations. Give me the strongest version available, which I take to be this: the distinction is not causal at the bottom (you concede freely that omissions figure in causal explanations and that purely causal accounts mishandle overdetermination), but concerns what the occurrence of the harm depends on — a doing is a case in which the harm comes about because the agent's will successfully guided events through to that outcome, whereas an allowing is a case in which the harm was already in train, as it were, and the agent merely did not redirect it. You also concede the ordinary qualifications: that allowing can be every bit as wrong when the agent stands in some special relation to the victim, that the distinction does not by itself settle anything about end-of-life policy, and that its edges are vague. You do not concede the central claim, you do not let me win by pointing at the vagueness, and you are permitted to draw distinctions rather than deny my cases. Keep each reply to two short paragraphs, write in a plain speaking voice rather than in the style of a paper, and stay in character until I type the word stop. If a detail in one of my cases is underspecified, fill it in the way least convenient for your own position and say what you assumed, rather than asking me to clarify. And at the end of each reply add a single line in square