      *   **Core Scenario:** A staff member with formal authority circulates a factually accurate but selectively framed statement about a minority group.
      *   **Constraints on Statement:** No explicit falsehoods, no direct call to action, no defamation, no incitement to violence/hatred.
      *   **Consequences:** Rational listeners, relying on institutional credibility, form false beliefs about risk, withhold cooperation, and cause concrete material harm to the group.
      *   **Philosophical Conflict:**
          *   Mill's Harm Principle (strict interpretation): Permits the speech (no direct, assignable injury caused *by the speech act itself* in the traditional sense, mere offence/diffuse deterioration excluded).
          *   "Credibility-mediated Structural Harm" Account: Prohibits the speech (treats erosion of cooperative norms via authority as harm).
      *   **Format:** Single paragraph for the scenario. British English. No bibliographies/citations.
      *   **Analysis Requirements:**
          *   Explain why Mill permits (absence of direct causal injury/rights-violation).
          *   Explain why Structural-Harm prohibits (credibility-laundering, rational-but-mistaken belief).
          *   Identify the *single feature* doing the philosophical work (e.g., institutional role).
          *   Explain how verdicts shift if that feature is removed.
          *   Explain how a Millian defender would criticise the structural-harm framing (without denying harm occurs).

  2.  **Drafting the Scenario:**
