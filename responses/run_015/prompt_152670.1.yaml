      *   *Speaker:* A senior housing officer (formal authority).
      *   *Group:* A specific minority ethnic group residing in the complex (e.g., recent refugees or a specific demographic).
      *   *Statement:* Needs to be technically true but misleading. Example: "Statistical records show that units in Block C have required 40% more emergency maintenance calls this quarter than the complex average." (Truth: Block C houses the minority group. Context omitted: The calls are due to faulty infrastructure installed during construction, not resident behavior).
      *   *Listeners:* Other residents or maintenance staff.
      *   *Reaction:* They assume the residents are destructive or negligent.
      *   *Harm:* Maintenance staff delay responding to genuine emergencies in Block C, fearing abuse or damage, leading to tangible harm (e.g., a leak causing injury or property loss).
      *   *Mill's View:* The officer stated a fact. No direct incitement. The harm is caused by the *listeners'* voluntary actions based on their own interpretations.
      *   *Structural Harm View:* The officer's authority lends weight to the implication, manipulating the epistemic environment.

      *Refining the Scenario for Constraints:*
      *   Must be one paragraph.
      *   Must ensure no defamation (truth is a defence, but framing is key).
      *   Must ensure Mill permits it (hard line on "direct harm").
      *   Must ensure Structural Harm prohibits it.

      *Draft:*
