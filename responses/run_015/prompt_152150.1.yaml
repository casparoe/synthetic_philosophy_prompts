      *   **User's Hypothesis:** Are we arguing about explanation vs. justification? Is there a hidden assumption about normative authority needing motivational transparency?
      *   **Task:** Diagnose the disagreement's structure and suggest what would move it (distinction, framing shift, etc.).
      *   **Constraints:** One paragraph only, max 180 words, bottom line in bold up front, no citations or reading lists.

