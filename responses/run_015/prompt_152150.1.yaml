      *   Internalism (Williams): Reasons must link to the agent's subjective motivational set (SMS). Normativity tied to psychology.
      *   Externalism: Reasons exist independently of the agent's desires. Normativity is objective.
      *   The Stalemate: Both agree on some substantive values (suffering matters), but disagree on the *structure* of reasonhood.
      *   User's Insight: Explanation (psychology) vs. Justification (normativity). Motivational transparency (must I feel it to be bound by it?).
      *   Diagnosis: It's likely a clash over the *function* of reason-talk. Is it to predict/guide action (internal) or to evaluate/criticize action (external)?
      *   Solution: Shift from metaphysics of reasons to pragmatics of deliberation.

