answer: |-
  Only the **dogmatic prior threshold** and **severity/testing** readings actually block the mugging; the standard Bayesian reading is a platitude that restates the problem without solving the expected-value explosion.

  **1. The Boring Bayesian (Priors × Likelihood Ratios)**
  *   **Claim:** Posterior odds = Prior odds × Likelihood ratio. Extraordinary claim = low prior; requires high likelihood ratio (evidence) to overcome.
  *   **Type:** Platitude (Mathematically true, decision-theoretically inert).
  *   **Blocks Mugging?** No. Restates the intuition that the prior is low, but doesn't explain why $p \times U$ isn't still $> \$5$.
  *   **Case 1 (Attic):** Prior is low, evidence is null. Posterior remains low, but EV calculation still runs if $p > 0$.
  *   **Case 2 (Miracle):** Evidence supplied. If likelihood ratio is high enough, posterior updates. ECREE doesn't forbid paying now; it might *require* it.

  **2. Fixed Prior Thresholds (Lexical Priorities)**
  *   **Claim:** Priors below a certain magnitude (e.g., $10^{-30}$) are treated as zero for decision purposes, regardless of utility.
  *   **Type:** Substantive but epistemically dogmatic.
  *   **Blocks Mugging?** Yes, by fiat. Cuts the EV calculation off at the start.
  *   **Case 1 (Attic):** Blocks. Hypothesis complexity/implausibility exceeds threshold.
  *   **Case 2 (Miracle):** Blocks. Claims finite evidence cannot overcome a lexical prior threshold (Humean miracle argument).

  **3. Strength of Justification for the Prior**
  *   **Claim:** The epistemic warrant for assigning a non-zero prior must be proportional to the claim's strangeness.
  *   **Type:** Vague Platitude.
  *   **Blocks Mugging?** No. Just restates that you shouldn't confidently assign a high prior. Doesn't address the tail risk.
  *   **Case 1 (Attic):** You lack warrant to assign any specific $p$. Leaves you with ambiguity, not safety.
  *   **Case 2 (Miracle):** Warrant increases. Doesn't solve the EV explosion if warrant allows $p > 0$.

  **4. Burden of Proof (Pragmatic/Action-Oriented)**
  *   **Claim:** The claimant must provide evidence before action is taken; default is inaction regardless of EV.
  *   **Type:** Substantive heuristic (shifts from epistemology to policy).
  *   **Blocks Mugging?** Yes, practically. Refuses to engage the EV calculation without evidence.
  *   **Case 1 (Attic):** Blocks. No claimant, no burden met, no action.
  *   **Case 2 (Miracle):** If miracle counts as meeting burden, heuristic says "consider action." Doesn't block if evidence is deemed sufficient.

  **5. Error-Statistics/Severity**
  *   **Claim:** A hypothesis is only warranted if it has passed a severe test (one that would likely fail if the hypothesis were false).
  *   **Type:** Substantive alternative framework.
  *   **Blocks Mugging?** Yes. The "matrix powers" hypothesis cannot be severely tested in the moment.
  *   **Case 1 (Attic):** Blocks. No test performed on the contraption.
  *   **Case 2 (Miracle):** Blocks. A small miracle tests "magic exists," not "this specific threat about 10^60 people is true."

  **6. Base Rates of Lying/Craziness**
  *   **Claim:** $P(\text{Lying}) \gg P(\text{Matrix Powers})$. The evidence supports "liar" far more than "wizard."
  *   **Type:** Substantive Bayesian input.
  *   **Blocks Mugging?** Partially. Lowers $p$, but doesn't solve the problem if $U$ scales faster than $p$ drops.
  *   **Case 1 (Attic):** N/A (no liar). Becomes base rate of "cursed objects," which is also near zero.
  *   **Case 2 (Miracle):** Updates $P(\text{Wizard})$ up. If miracle is genuine, base rate of lying becomes irrelevant, and the mugging returns.

  **7. Complexity Penalty (Solomonoff Induction)**
  *   **Claim:** Prior probability is bounded by Kolmogorov complexity. Describing 10^60 specific people is too complex.
  *   **Type:** Substantive and defensible.
  *   **Blocks Mugging?** Yes, if utility doesn't outgrow the complexity penalty. (This is the actual technical solution most rationalists want).
  *   **Case 1 (Attic):** Blocks. Description of the mechanism is too complex relative to simple physics.
  *   **Case 2 (Miracle):** Blocks. The miracle updates general "magic" probability, but the specific threat description remains complex. ECREE slogan doesn't capture this, but the math does.
