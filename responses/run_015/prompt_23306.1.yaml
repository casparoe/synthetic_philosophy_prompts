      *   *Step 4: Address the Bayesian Aspect.* This is crucial for the user's second question. In Bayesian theory, logical truths get probability 1. But a computer can't assign 1 to a theorem it hasn't proven yet. This leads to "Logical Uncertainty."
      *   *Step 5: Why it Matters for AI.* It's not about building God. It's about defining "rationality" for bounded systems. If our theory says a rational agent *must* know Fermat's Last Theorem instantly, the theory is useless for designing real AI. We need theories of *bounded* rationality.

