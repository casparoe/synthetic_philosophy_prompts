answer: |-
  ### Research Agenda: Prioritizing Conceptual Leverage in Welfare Conditionality

  For a conceptual research group with a three-year horizon and no empirical capacity, the goal must be to identify the **normative bottleneck**—the philosophical premise that, if clarified or dismantled, forces a redesign of the policy architecture rather than merely adjusting its administration.

  Based on the criteria of **Dependency** (which question must be answered first), **Tractability** (which can be resolved through conceptual analysis alone), and **Practical Leverage** (which resolution alters institutional design vs. rhetoric), I recommend the following ranking:

  1.  **Priority 1: The Contractualist vs. Desert Justification (Tension 1)**
  2.  **Priority 2: The Coherence of the 'Undeserving' Category (Tension 3)**
  3.  **Priority 3: Institutional Suspicion vs. Dignity (Tension 2)**

  Below is the defense of this ordering, the strategic rationale for a conceptual team, and the conditions under which this agenda should pivot.

  ---

  ### 1. Priority One: Contractualism vs. Moral Desert
  **The Question:** *Can welfare conditionality be defended purely as a fair exchange of mutual obligations, or does it logically necessitate a judgment of moral worth?*

  **Defense of Ranking:**
  *   **Dependency (Upstream):** This is the foundational logic of the institution. If conditionality is purely **contractual**, the state's role is that of a partner ensuring compliance with agreed-upon terms (e.g., "you search for jobs, we provide income"). The state need not judge *why* you failed to search, only *that* you failed. If conditionality relies on **desert**, the state becomes a moral tribunal that must assess intent, character, and worthiness. The answer to this question dictates the scope of the bureaucracy.
  *   **Tractability (High):** This is a problem of normative logic, not empirical measurement. Your team can analyze the conceptual structure of "obligation" and "entitlement" without needing fieldwork. You can determine whether the *concept* of a welfare contract logically collapses into meritocracy without needing to measure unemployment rates.
  *   **Practical Leverage (Architectural):** Resolving this changes the *type* of institution.
      *   *If Contractual:* Design shifts toward clear, objective compliance metrics (e.g., did the application submit X forms?). Sanctions are for breach of contract, not moral failure.
      *   *If Desert-based:* Design requires investigative mechanisms to probe intent and character.
      *   *Strategic Win:* If your group demonstrates that current "contractual" systems **necessarily smuggle in desert** (e.g., by penalizing incapacity as if it were refusal), you expose a structural contradiction. This forces policymakers to either admit the moral judgment (politically costly) or redesign the system to remove moral judgment (architecturally transformative).

  ### 2. Priority Two: Coherence of the 'Undeserving' Category
  **The Question:** *Is the distinction between voluntary and involuntary non-contribution conceptually stable given structural constraints?*

  **Defense of Ranking:**
  *   **Dependency (Midstream):** This question is only fatal if Priority 1 is resolved in favor of **Desert**. If the system is purely contractual, the "undeserving" category is irrelevant; a contractor who fails to deliver is in breach regardless of whether they are "lazy" or "unlucky." However, if Priority 1 reveals that desert is unavoidable, then this question becomes the kill-switch.
  *   **Tractability (Medium):** This is the riskiest area for a non-empirical group. Analyzing "voluntariness" under structural constraint is philosophical, but it borders on sociological claim-making. To remain tractable, your team must focus on the **concept of responsibility**. You are not measuring unemployment; you are analyzing whether the *concept* of individual responsibility holds water when the *option* to work is structurally absent.
  *   **Practical Leverage (High):** If you prove the category is conceptually incoherent, you dismantle the justification for *targeted* conditionality. This pushes architecture toward universalism (UBI) or unconditional support. However, because this relies on the premise that Desert matters (Priority 1), it must come second.

  ### 3. Priority Three: Institutional Suspicion vs. Dignity
  **The Question:** *Does the state's interest in fraud prevention justify epistemic intrusion, and can suspicion be reconciled with the dignity required for moral agency?*

  **Defense of Ranking:**
  *   **Dependency (Downstream):** This is a question of **procedure**, not foundation. You cannot determine the limits of state suspicion until you know *what* the state is trying to find out.
      *   If the goal is Contract Compliance (Priority 1), suspicion is limited to verifying actions (e.g., "Show proof of application").
      *   If the goal is Moral Desert (Priority 1), suspicion must penetrate intent (e.g., "Are you *really* trying?").
      *   Therefore, the "Epistemic Obligation" is determined by the Justification.
  *   **Tractability (High):** This is classic political philosophy (privacy, dignity, state power). It is highly suitable for conceptual analysis.
  *   **Practical Leverage (Medium):** Resolving this alters **protocols**, not the system's existence. It might replace constant surveillance with random auditing, or shift the burden of proof. While vital for claimant experience, it does not fundamentally redesign the welfare architecture as much as the first two tensions.

  ---

  ### Strategic Rationale for a Conceptual Group

  **Why this order maximizes limited effort:**
  A three-year conceptual team cannot compete with economists on the *effects* of conditionality or sociologists on the *rates* of structural unemployment. You must compete on **logic**.

  By prioritizing **Tension 1**, you attack the policy's self-conception. Most workfare systems claim to be neutral/contractual to avoid accusations of moralizing. If your group produces a rigorous argument showing that **"Contractual Conditionality is Conceptually Impossible without Implicit Desert Judgments,"** you force a crisis of legitimacy. You do not need to prove people are suffering (empirical); you need to prove the system is lying about what it is (conceptual).

  This makes Tension 3 (Undeserving) a supporting argument rather than the lead. You don't need to prove the category is empty; you only need to prove that *using* the category violates the stated contractual logic of the system.

  ### Conditions for Re-ranking

  This agenda is stable only under specific philosophical conditions. You should pivot the ranking if:

  1.  **The "Non-Judgmental Contract" is Successfully Defended:**
      *   *Trigger:* If a member of the group (or a competitor) successfully constructs a model of conditionality that relies *strictly* on objective performance metrics without any reference to intent or worth.
      *   *Pivot:* If this is achieved, Tension 1 is settled. **Tension 3 moves to Priority 1.** You must then focus entirely on whether structural factors make even *objective* performance metrics unfair (e.g., is it fair to require 10 applications when there are 2 jobs?). The debate shifts from "Why we condition" to "What we can reasonably demand."

  2.  **The Epistemic Limit Becomes Absolute:**
      *   *Trigger:* If your analysis of Tension 2 reveals that the state has a **positive epistemic obligation not to know** certain things about citizens to preserve their status as free agents (a "right to opacity").
      *   *Pivot:* **Tension 2 moves to Priority 1.** If the state is morally prohibited from investigating the private sphere required to verify desert or even complex contract compliance, the entire conditionality regime collapses regardless of its justification. This is a "hard constraint" argument that trumps justificatory theories.

  3.  **Policy Shift to Universalism:**
      *   *Trigger:* If the political context shifts toward Universal Basic Income (UBI).
      *   *Pivot:* All three tensions become retrospective. The agenda should shift to the **philosophical foundations of Unconditionality** (e.g., is freedom to *not* work a primary good?).

  ### Summary of the Three-Year Plan

  *   **Year 1 (Foundation):** Focus exclusively on **Tension 1**. Map the logical dependencies of "contract" in welfare. Produce the argument that current systems are "Crypto-Desert" regimes (claiming contract, practicing moral judgment).
  *   **Year 2 (Feasibility):** Focus on **Tension 3**. Analyze the concept of "voluntariness." Define the threshold where structural constraint negates moral responsibility. Use this to bolster the Year 1 argument that the "contract" is void due to impossible terms.
  *   **Year 3 (Implementation):** Focus on **Tension 2**. Draft the "Dignity Constraints." If conditionality must exist, what are the absolute epistemic limits on the state? Propose a "Presumption of Compliance" architecture as a design alternative to "Presumption of Fraud."

  This sequence ensures that every hour of conceptual labor attacks the root justification of the system, offering the highest probability of altering institutional design rather than merely polishing its procedures.
