      *   **Institutional Morphology:** Focuses on *how* the state works (fiscal/coercive structures) rather than *what* it's called or how big it is. This aligns with state capacity literature (Tilly, Mann, Besley & Persson).
      *   **Falsifiability/Insulation:** A major risk in social science is defining categories post-hoc to fit the theory (ad hocery).

  3.  **Drafting the Response - Section by Section:**

