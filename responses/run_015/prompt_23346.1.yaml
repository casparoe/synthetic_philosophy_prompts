answer: |-
  The brass needle on the assayer's desk shivered, caught between two red zones. Elias adjusted his loupe, sweating slightly in the woolen quiet of the shop. Across from him sat Mr. Vane, seeking certification for *Steadfastness* before his merger.

  "Run it again," Vane whispered.

  Elias applied the stimulus: a calibrated offer of betrayal. The needle swung hard to **MASK**. The Steadfastness was there, solid as diamond, but something external—a gag, a lock, a fear—was preventing it from manifesting. The pipe was full; the tap was shut.

  Elias removed the external blockage. He cleared the air, softened the light, signaled safety. He applied the stimulus again.

  This time, the needle snapped to **FINK**.

  The Steadfastness hadn't been blocked; it had vanished. The moment the temptation touched Vane's skin, the disposition itself dissolved. The pipe didn't just stop flowing; the water turned to air the instant the tap opened.

  "Which is it?" Vane asked. "Am I safe, or am I empty?"

  Elias wiped the lens. He ran the test a third time, and the needle vibrated violently, oscillating between the two errors. It was impossible. A mask implies the trait survives the trigger. A fink implies the trait dies by the trigger. They were mutually exclusive categories.

  Unless the testing mechanism was the variable.

  Elias looked down at his own hands. To distinguish a fink from a mask, the assayer must possess *Discernment*. He must know what is there versus what is blocked. But the stimulus required to test Vane was Elias's own judgment.

  If Elias's Discernment was **Masked**, he was competent but blinded by something in the room.
  If Elias's Discernment was **Finked**, he was competent until the moment he tried to judge, at which point his competence evaporated.

  The needle stopped moving. It pointed straight up, at neither label, but at the glass face of the dial itself.

  Elias realized the client wasn't the one on the table. The disposition being assayed was the ability to tell the difference between a thing that hides and a thing that disappears. And as he stared into the loupe, he couldn't tell if the truth was waiting behind his eyes, or if it had fled the moment he looked for it.

  "I cannot certify you," Elias said, closing the case. "The instrument is unstable."

  "Is it the machine?" Vane asked, standing.

  Elias touched his own temple. "No. It's the assay."
