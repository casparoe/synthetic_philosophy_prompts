  # Diagnostic Decision Tree: Self-Locating Credence in Sleeping Beauty

  **Instructions:** Answer each node based on your immediate intuition about the case or claim. Do not worry about where the branch leads. Follow the path until you reach a leaf.

  ### The Nodes

  **1. Scoring Goal:** When assessing the accuracy of Beauty's credence, is the fundamental unit of evaluation the **experiment run** or the **individual awakening**?
  *   (A) Experiment Run → Go to 2
  *   (B) Individual Awakening → Go to 5

  **2. New Evidence:** Upon waking, does Beauty possess evidence she did not possess on Sunday (specifically, "I am awake now")?
  *   (A) No → Go to 3
  *   (B) Yes → Go to 4

  **3. Monday Update:** If told "Today is Monday," must her credence in Heads change from her waking credence?
  *   (A) Yes (It shifts to 1 or 2/3) → **Leaf I**
  *   (B) No (It stays fixed) → **Leaf VI** (Flag: Incoherent)

  **4. Diachronic Constraint:** Must her Sunday credence in Heads match her Monday waking credence?
  *   (A) Yes → **Leaf II**
  *   (B) No → **Leaf III**

  **5. Large Numbers:** If Tails yielded 1,000,000 awakenings and Heads only one, would Credence(Heads) be less than 0.01?
  *   (A) Yes → Go to 6
  *   (B) No → **Leaf VII** (Flag: Unexplored/Unattractive)

  **6. Duration:** If the Tuesday awakening lasted 100 hours and Monday only 1 hour, would Credence(Tails) increase relative to the standard case?
  *   (A) No (Only count matters) → Go to 7
  *   (B) Yes (Time matters) → **Leaf IV**

  **7. Future Coin:** If the coin is tossed *after* all awakenings occur, is Credence(Tails) on Monday still > 1/2?
  *   (A) Yes → **Leaf V**
  *   (B) No → **Leaf VI** (Flag: Inconsistent)

  **8. Red/Blue Room:** (For those reaching Leaf V) If Tails leads to Red(Mon)/Blue(Tue) randomly, does seeing Red change Credence(Heads) compared to the standard Tails case?
  *   (A) No → **Leaf V** (Standard Thirder)
  *   (B) Yes → **Leaf VIII** (Flag: Unexplored)

  **9. Series:** (For those reaching Leaf I) Does the answer change if the experiment is run 1,000 times rather than once?
  *   (A) No → **Leaf I** (Standard Halfer)
  *   (B) Yes → **Leaf IX** (Flag: Frequentist Halfer)

  **10. Betting:** (For those reaching Leaf II) Should Beauty accept a bet on Heads offered *every* awakening that pays off once per experiment?
  *   (A) No → **Leaf II** (Double Halfer)
  *   (B) Yes → **Leaf VI** (Flag: Incoherent)

  ---

  ### The Leaves (Positions)

  | Leaf | Position Name | Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **I** | **Lewisian Halfer** | Must assign $P(Heads|Monday) = 1$, implying she learns she is not in a Tails-Tuesday awakening upon waking. |
  | **II** | **Double Halfer** | Must reject standard conditionalization or claim $P(Monday|Tails) = 1$ despite the experimental setup. |
  | **III** | **Hybrid/Imprecise** | Requires accepting a diachronic mismatch without new evidence, often leading to imprecise credences. |
  | **IV** | **Continuous/Meacham** | Commits to "observer-moments" weighted by duration, making credence sensitive to arbitrary clock speeds. |
  | **V** | **Elgan Thirder** | Commits to $P(Heads) = 1/3$ even if the coin toss is causally independent of the awakening (Future Coin). |
  | **VI** | **Incoherent Cell** | **Empty.** Combines claims (e.g., Per-Run + New Evidence + Fixed Monday) that violate probability axioms. |
  | **VII** | **Moderate Thirder** | **Empty.** Attempts to stop the slide to near-certainty in Large N cases without abandoning Per-Awakening scoring. |
  | **VIII** | **Partition Thirder** | **Empty.** Suggests irrelevant self-location (Red vs Blue) alters credence in the coin outcome. |
  | **IX** | **Frequentist Halfer** | **Empty.** Suggests single-case rationality differs from long-run rationality without a clear error theory. |

  ---

  ### Commentary for the Seminar Leader

  **1. Unused or Redundant Labels**
  You mentioned remembering labels like "Hybrid," "Centred Halfer," or "Thirdish Halfer."
  *   **"Centred Halfer":** This maps to **Leaf I (Lewisian)**. It is not a distinct cell; it is just a Lewisian who emphasizes centred content.
  *   **"Hybrid":** Often used for **Leaf III**, but this cell is rarely occupied by a stable theory. Most "Hybrids" collapse into Double Halfers or Imprecise Bayesians.
  *   **"Thirdish Halfer":** There is no logical space for this. If you score per-awakening, you are pushed toward Leaf V or IV. If you score per-run, you are pushed toward Leaf I or II.

  **2. The "Future Coin" Diagnostic (Node 7)**
  You asked if this variant separates views cleanly.
  *   **Verdict:** It separates *motivations*, not necessarily *credences*. A robust Thirder (Leaf V) says "Yes" (indexical correlation suffices). A causal Thirder says "No." However, most published Thirders bite the bullet and say "Yes."
  *   **Replacement:** If you find students stalling here, replace Node 7 with: **"Betting:** Should Beauty accept a bet on Heads offered *every* awakening that pays off once per experiment?" A Thirder says Yes (expected value positive per awakening); a Halfer says No. This is often more intuitive than the Future Coin.

  **3. Indistinguishable Leaves**
  *   **Leaf VI (Incoherent) & Leaf VII (Moderate Thirder):** These are currently flagged as empty/unattractive. They are indistinguishable in practice because no major author occupies them. This reflects a **genuine identity of commitment**: there is no stable way to hold Per-Awakening scoring without accepting the Large N implication (Leaf V). If a student lands here, they are likely a Thirder in denial about the extreme case.

  **4. The "No Leaf" Outcome**
  If a student's answers do not terminate at a named leaf (e.g., they answer in a way that loops or hits a "Flag: Incoherent"):
  *   **Diagnosis:** This is a sign of an **inconsistent triple of intuitions**. For example, claiming "Per-Awakening Scoring" (Node 1B) but "No Large N Implication" (Node 5B).
  *   **Action:** Do not add a node. Ask the student to relinquish one of the prior commitments. The tree is designed to show that these commitments entail one another. If they resist, they are likely operating with an unarticulated "Contextualist" view (the answer changes depending on how the question is asked), which is a distinct meta-semantic position not captured by first-order credence trees.

  **5. Node Design Note**
  Notice that only **Node 5 (Large Numbers)** asks for a specific probability threshold (< 0.01). All other nodes ask about case judgments or structural claims. This ensures the student derives the number from their principles, rather than selecting a number and reverse-engineering principles.
