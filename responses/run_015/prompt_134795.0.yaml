answer: |-
  1. Is the disagreement just about how we define words like "exist" and "object", or is there a hard fact of the matter independent of our language?
     Just words → **Deflationism** (Quantifier Variance and Easy Ontology collapse here: existence claims are trivial relative to conceptual schemes or sortal application conditions).
     Hard fact → 2.

  2. When parts are arranged together (like bricks in a wall or staff in a department), do they ever compose a *new* single object, or are there only ever the parts?
     Only parts → **Nihilism** (Nothing composes; note that on this view, social groups are fictions just like statues).
     New objects → 3.

  3. Do *any* collection of things compose a whole (like a shoe and a planet, or a queue and a cloud), or only specific kinds of collections? (Note: Universalists typically say "any" for material bits, but rarely extend this to social groups).
     Any collection → 4.
     Specific kinds → 5.

  4. Is the whole universe (or total institution) the only *fundamental* object, with all smaller objects depending on it?
     Yes → **Priority Monism** (Really there's just one big object and it's the cosmos, and it's what's fundamental).
     No → **Universalism** (Everything composes; the statue and the clay are two distinct sums of particles).

  5. When a composite object exists (like a statue or a department), is it the *same thing* as its parts arranged that way, or a *second thing* located in the same place? (Note: Material cases often split here; social cases often lean "same thing").
     Same thing → **Constitution View** (The statue and the clay are one thing; usually Restrictivism with a principled story like "life" or "function").
     Second thing → **Co-locationism** (The statue and the clay are two things; usually Restrictivism where which ones compose is sometimes brute).
