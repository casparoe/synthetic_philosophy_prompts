answer: |-
  Here is a revision tool designed for your specific needs. It is called **The Akrasia Audit**. It is structured as a sequence of five gates. To pass through a gate, you must be able to answer "Yes" to the primary question and satisfy the criteria. If you answer "No," the procedure diverts you to a neighboring phenomenon (compulsion, value change, etc.).

  At each gate, there is a **Philosopher's Note** indicating where the boundary gets murky.

  ***

  # The Akrasia Audit

  ### Gate 1: The Reality of Intention (Excluding Fake Intention)
  **Question:** Five minutes before the lapse, if an omniscient narrator had asked the character, "Do you intend to do X?" would they have answered "Yes" without hesitation or performance?

  *   **Criteria for Passing:** The intention was private, specific, and action-guiding. It wasn't just a wish ("I hope I don't"), a public performance ("I told my friend I wouldn't"), or a vague aspiration ("I should be better").
  *   **If No:** You are likely in territory **(e) Fake Intention**. The character never truly committed; they were signaling virtue or hoping for luck.
  *   **Philosopher's Note:** Intentions can be fragile. A character might *think* they intend to stop, but if the intention lacks "stickiness" (a plan to execute), it isn't a failure of will to drop it; it was never a will to begin with.

  ### Gate 2: The Clarity of Knowledge (Excluding Ignorance)
  **Question:** At the exact moment of the lapse, did the character recognize that this specific action violated their intention?

  *   **Criteria for Passing:** They knew what they were holding/eating/saying. They knew it counted as the forbidden thing. They were not distracted, confused, or mistaken about the facts.
  *   **If No:** You are in territory **(d) Ignorance of Particulars**. This is not weakness of will; it is a mistake. (e.g., She thought the punch was non-alcoholic).
  *   **Philosopher's Note:** Aristotle argued true akrasia requires knowledge *in the moment*. If the passion clouds the mind so completely that they forget the principle, some philosophers call this ignorance, not akrasia. For fiction, if they are "blacked out" by emotion, lean toward ignorance. If they are "clear-eyed," lean toward akrasia.

  ### Gate 3: The Stability of Judgment (Excluding Value Change)
  **Question:** At the exact moment of the lapse, did the character still believe that adhering to the intention was the *better course of action* overall?

  *   **Criteria for Passing:** They did not think, "Actually, this one time doesn't matter," or "My happiness matters more than this rule." They judged the act as *bad for them*, even while doing it.
  *   **If No:** You are in territory **(b) Change of Values**. The character re-evaluated and decided differently. This is growth, hypocrisy, or pragmatism, not weakness.
  *   **Philosopher's Note:** This is often the hardest distinction. People rarely say, "I am choosing the worse option." They usually reframe the option as better. If the reframing happens *before* the act, it's Value Change. If it happens *after* to soothe the pain, it's Akrasia followed by Rationalization.

  ### Gate 4: The Pressure of Now (Hyperbolic Discounting Check)
  **Question:** Is the temptation driven by the *proximity* of the reward? Does the pull of the action swell disproportionately as the moment arrives, swamping the distant benefit of restraint?

  *   **Criteria for Passing:** The character preferred the long-term goal when it was distant (yesterday), but the immediate sensory or emotional payoff (now) creates a spike in value that overrides the long-term preference. The conflict is between **Now-Me** (wants relief/pleasure) and **Future-Me** (wants health/integrity).
  *   **If No:** If the reward is not immediate (e.g., they are doing something painful now for no clear gain), this is not standard akrasia. It may be self-sabotage or compulsion.
  *   **If Yes:** This is the engine of **Genuine Akrasia**. This distinguishes "inevitable" lapses (the curve of discounting is universal) from "arbitrary" ones (no clear immediate payoff).
  *   **Philosopher's Note:** This is where you distinguish *arbitrary* plot stumbles from *inevitable* human failures. If the immediate reward is weak, the akrasia feels fake. If the immediate reward is visceral (relief from anxiety, taste of sugar, avoidance of conflict), the lapse feels psychologically true.

  ### Gate 5: The Agency Check (Excluding Compulsion & Self-Deception)
  **Question A (Compulsion):** Could they have physically stopped, even if it was agonizingly difficult? Did they experience the action as a choice, however forced?
  **Question B (Self-Deception):** Are they lying to themselves *during* the act to make it palatable, or do they feel the pain of the contradiction while doing it?

  *   **Criteria for Akrasia:**
      *   **Compulsion (a):** If they feel they *could not* stop (loss of agency), it is addiction/compulsion.
      *   **Self-Deception (c):** If they convince themselves *during* the act that "This isn't really drinking" or "This is the right time to speak," they are protecting themselves from the pain of akrasia.
      *   **Genuine Akrasia:** They feel the friction. They know it's wrong. They know they could stop. They do it anyway.
  *   **Philosopher's Note:** This is the murkiest boundary. High-craving states feel like compulsion but are often akrasia. Self-deception often *accompanies* akrasia to make it bearable. If the character feels *guilt in the moment*, it's akrasia. If they feel *justification*, it's self-deception.

  ***

  # Application to Your Draft

  Here is the audit applied to your two characters.

  ### Case 1: The Sober Woman at the Wedding
  **Classification:** **Genuine Akrasia (with High Risk of Compulsion)**

  *   **Gate 1 (Intention):** **Pass.** 14 months sober implies a settled, serious intention.
  *   **Gate 2 (Knowledge):** **Pass.** Prompt states: "She knows what she is doing as she does it."
  *   **Gate 3 (Judgment):** **Pass.** Prompt states: "She has not revised her judgment that sobriety is better."
  *   **Gate 4 (Discounting):** **Pass.** This is the driving force. The reward (social bonding, taste, celebration, relief of tension) is *immediate*. The cost (relapse, health) is *distant*. The "Now" swamps the "Later." This makes the lapse feel inevitable rather than arbitrary.
  *   **Gate 5 (Agency):** **Pass (with warning).** Prompt states: "She could refuse." This rules out strict compulsion. However, the physiological reality of addiction means this boundary is thin.

  **Why this works:** This is a textbook case. The psychological work comes from the *friction*. She shouldn't feel relief when she drinks; she should feel grief *while* drinking. If she enjoys it without pain, it slides toward Value Change. If she feels like a puppet, it slides toward Compulsion. To keep it Akrasia, she must feel the weight of the glass as a betrayal.

  **Uncomfortable Flag:** You may want to call this Addiction (a). In clinical reality, a drink after 14 months often triggers a physiological loss of control. By insisting "She could refuse," you are forcing this into Akrasia. This is valid for fiction (emphasizing moral agency), but be aware you are prioritizing psychological drama over medical realism.

  ### Case 2: The Hesitant Husband
  **Classification:** **Akrasia Masked by Self-Deception (Leaning toward Value Change over time)**

  *   **Gate 1 (Intention):** **Pass.** He rehearsed the words. The intention was specific.
  *   **Gate 2 (Knowledge):** **Pass.** He knows he is saying nothing.
  *   **Gate 3 (Judgment):** **Borderline.** He knows "the moment was as right as it was ever going to be." This suggests he still holds the judgment that he *should* speak.
  *   **Gate 4 (Discounting):** **Pass.** The cost of speaking (immediate pain, tears, conflict) is high *now*. The benefit (freedom) is *later*. The "Now" cost swamps the "Later" gain.
  *   **Gate 5 (Agency/Deception):** **Fail (Self-Deception).** The prompt says: "He tells himself afterward that the moment was not right."
      *   *Critical Analysis:* If he told himself this *afterward*, the moment of silence was Akrasia. However, to remain silent *during* the dinner without screaming from the tension, he likely had to allow a small lie *in the moment* ("I'll do it after dessert," or "She looks too tired").
      *   *The "Year" Problem:* The fact that he continues for *another year* suggests that after the dinner, his judgment *did* change (Gate 3 Failure). He likely shifted from "I must leave" to "I can't leave."

  **Why this is complex:** The dinner moment is Akrasia. The subsequent year is Value Change (b).
  **Uncomfortable Flag:** You might want to call the dinner a paradigm of Weakness of Will. The Audit suggests it is **Self-Deception** doing the heavy lifting. Why? Because pure akrasia is agonizing. It is hard to sustain for a year. To stay silent for a year, he had to convince himself it was the right choice.
  **Revision Advice:** If you want it to be Akrasia, show the *suffering* during the dinner. If you want it to be Self-Deception, show the *relief* he feels when he decides not to speak. The latter is often more realistic for long-term stagnation.

  ***

  # Limitations: What This Procedure Cannot Do

  As a novelist, you need to know where this tool breaks.

  **1. It cannot measure the Unconscious.**
  The Audit relies on what the character "knows" or "judges." Freudian slips, trauma responses, or subconscious drives often bypass conscious judgment entirely. A character might sabotage a relationship not because they value it less (Value Change) or weakly (Akrasia), but because they unconsciously believe they are unworthy. The Audit will misclassify this as Self-Deception or Value Change. You will need your intuition for the shadow self.

  **2. It struggles with "Habituation."**
  If a character fails repeatedly, the "Intention" (Gate 1) weakens. The second time they drink, it's not the same intention as the first. The Audit treats each scene in isolation. It does not track the erosion of will over a novel's arc. You must manually adjust the "Intention" strength based on previous lapses.

  **3. It assumes Rationality.**
  The framework assumes the character is capable of reasoning about their values. It does not work well for characters in states of mania, psychosis, or extreme dissociation. In those states, "Judgment" (Gate 3) is offline. The Audit will force you to call it "Ignorance" or "Compulsion," missing the specific texture of mental illness.

  **4. It cannot tell you what is *Interesting*.**
  The Audit can tell you if a lapse is *credible*, but not if it is *compelling*. Sometimes a "Value Change" (a character deciding to break their vow because they found something better) is more dramatic than "Akrasia" (breaking it because they were weak). The Audit protects you from psychological errors; it does not make artistic choices for you.

  **5. The Murk of "Compulsion."**
  In the real world, the line between "I couldn't stop" (Compulsion) and "I didn't stop" (Akrasia) is often invisible to the agent. The Audit asks you to decide. In your draft, you may choose to leave this ambiguous. The procedure forces a binary choice. If you want ambiguity, you must intentionally violate Gate 5.

  ### Final Advice for Revision
  Use the Audit to find the **friction point**.
  *   If it's **Akrasia**, write the pain of the contradiction.
  *   If it's **Self-Deception**, write the lie that makes it comfortable.
  *   If it's **Hyperbolic Discounting**, write the seduction of the *Now*.

  If you find yourself reaching for "the flesh is weak," run the Audit. It will tell you which specific muscle of the psyche is actually failing.
