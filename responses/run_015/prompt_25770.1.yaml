      *   *Uncomfortable Truth:* I need to check if the procedure forces a classification the user might dislike. For the man, if the procedure says "Self-Deception" because he rationalized it *during* the silence, the user might want it to be Akrasia. I need to explain *why* the distinction matters for writing. (Akrasia = pain of knowing; Self-Deception = comfort of lying).

  7.  **Drafting the Limitations:**

      *   What can't it do? Unconscious motives. Trauma responses that look like compulsion but aren't addiction. Cultural context of "will." The "mystery" of character.
      *   It can't measure *degree*.
      *   It can't replace empathy.

  8.  **Review against Constraints:**

      *   Sequence of questions? Yes.
      *   Clear criteria? Yes.
