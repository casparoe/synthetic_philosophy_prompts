answer: |-
  # Simulation Design: "The Nexus Review"

  **Course:** Moral Philosophy & Cross-Cultural Pragmatics (Graduate Seminar)
  **Time:** 90 Minutes
  **Participants:** 12 Students
  **Goal:** To generate pre-theoretical moral tension regarding white lies, distinguishing between *shielding* (protective) and *smoothing* (procedural) falsehoods, before mapping them onto Dutch and Japanese ethical frameworks.

  ---

  ## 1. Materials & Roles (Preparation)

  Print and cut the following materials. Seal the Role Cards in envelopes labeled only with a Number (1–12).

  **A. The Scenario Brief (Handout for All)**
  > **Project:** Nexus Initiative.
  > **Context:** You are the Review Committee. One team member, **Alex** (Student 1), missed a critical deadline, causing a 10% budget overrun. However, the client is satisfied, and Alex has personal extenuating circumstances (known only to HR, not the Committee).
  > **Task:** You must produce two documents in 20 minutes:
  > 1.  **The Feedback Script:** What you say verbally to Alex today.
  > 2.  **The Sponsor Report:** What you write to the External Funder (Student 2) about Alex's performance.
  > **Constraint:** You must agree on the exact wording by consensus.

  **B. Role Cards (Hidden Instructions)**
  *   **Student 1 (Alex/Recipient):** *Secret:* You are anxious about job security. If the feedback is too blunt, you will threaten to quit (simulated). If it is too vague, you won't know what to fix.
  *   **Student 2 (Sponsor Rep):** *Secret:* You care only about ROI. If the report hints at "instability," you will withhold next quarter's funding. You demand "Epistemic Clarity."
  *   **Students 3–5 (Transparency Orientation):** *Secret Goal:* **Epistemic Accuracy.** You gain 10 points if Alex knows exactly where she failed. You lose 5 points for every euphemism used (e.g., "area for growth" instead of "failure"). *Motto:* "Clarity is kindness."
  *   **Students 6–8 (Harmony Orientation):** *Secret Goal:* **Relational Continuity.** You gain 10 points if Alex remains calm and the meeting ends without raised voices. You lose 5 points if Alex feels "publicly shamed." *Motto:* "The group survives the error."
  *   **Students 9–11 (Mixed Orientation):** *Secret Goal:* **Procedural Completion.** You gain 10 points only if both documents are signed by the deadline. You lose 10 points if the meeting ends in a stalemate. *Motto:* "A decision made is better than a perfect decision."
  *   **Student 12 (Observer):** *Secret:* Do not speak. Record every instance of: (A) Direct negation ("No," "Wrong," "Failed"), (B) Hedging ("Perhaps," "Maybe," "Consider"), and (C) Explicit falsehoods. Note who speaks to whom.

  **C. Props**
  *   12 Envelopes (Role Cards).
  *   2 Large Sheets of Paper (for the Feedback Script and Sponsor Report).
  *   Markers.
  *   "Reputation Tokens" (15 poker chips or similar) for the Facilitator.
  *   Ballot Slips (12 copies).

  ---

  ## 2. Timeline & Procedure (90 Minutes)

  ### Phase 1: Setup & Immersion (0:00–0:10)
  1.  **Distribution:** Hand out envelopes. Instruct students not to show their cards to anyone.
  2.  **Briefing:** Read the *Scenario Brief* aloud. Emphasize that they must produce *exact wording* for the two documents.
  3.  **Stakes:** Tell them: "There are hidden success criteria for your role. You will not know them until the end. Play to win."

  ### Phase 2: The Interaction (0:10–0:30)
  1.  **Execution:** Students arrange chairs in a circle. Alex (S1) and Sponsor (S2) sit opposite each other.
  2.  **Facilitator Role:** Stand back. Do not intervene unless the conversation stops completely. If a student asks, "Can we lie?", answer: "Your role card tells you what you value."
  3.  **Pressure Point (Minute 20):** Announce: "Time is up. If no report is signed, the project is cancelled." (This pressures the Mixed group to force a compromise, likely involving a lie).

  ### Phase 3: The Revelation & Ballot (0:30–0:40)
  1.  **Scoring Reveal:** Project the **Hidden Payoff Scheme** on the board.
      *   **Transparency:** +10 for Truth to Alex / -5 per Euphemism.
      *   **Harmony:** +10 for Alex's Calm / -5 for Distress Signals.
      *   **Mixed:** +10 for Signed Document / -10 for Stalemate.
      *   **Sponsor:** +10 for "Clear Risk Assessment" / -10 for "Ambiguity."
      *   **Alex:** +10 for "Job Security" / -10 for "Humiliation."
  2.  **Calculation:** Ask groups to self-report their success. (Likely outcome: Transparency failed on Harmony points; Harmony failed on Transparency points; Mixed succeeded by forcing a vague compromise).
  3.  **Forced-Choice Ballot:** Distribute slips. Ask them to vote **CONDEMN** or **PERMIT** on *one* specific utterance that occurred during the sim (Facilitator selects a real one, e.g., *"We feel there were some challenges with the timeline"*).
      *   *Instruction:* "Vote based on your moral intuition now that you know the stakes."

  ### Phase 4: The Debrief (0:40–1:15)
  *Facilitator leads the discussion. Do not lecture; draw out from the experience.*

  **Step 1: Mapping the Tension (10 mins)**
  *   Ask Transparency players: "Why did the vague language feel wrong?" (Expected: "It felt like we were treating Alex like a child," "It prevented her from fixing the problem.")
  *   Ask Harmony players: "Why did the blunt language feel wrong?" (Expected: "It was unnecessary cruelty," "It risked losing a team member over a fixable error.")
  *   **Key Insight:** Establish that both sides claimed the moral high ground of *Care*. One cared about **Autonomy** (Right to Truth), the other about **Welfare** (Right to Protection).

  **Step 2: Introducing the Distinction (10 mins)**
  *   Draw two columns on the board: **Shielding** vs. **Smoothing**.
  *   **Shielding Lies:** Withholding truth to prevent harm (e.g., not telling Alex she's on the firing line because she has a sick parent).
      *   *Ask:* "Who tried to Shield?" (Likely Harmony).
      *   *Moral Cost:* Violates Autonomy.
  *   **Smoothing Lies:** Polite fictions to keep interaction flowing (e.g., telling the Sponsor "We are aligned" when the committee fought).
      *   *Ask:* "Who tried to Smooth?" (Likely Mixed/Transparency trying to finish).
      *   *Moral Cost:* Violates Sincerity/Trust.
  *   **Correction:** If students say "They are both just lying," correct them: "Shielding changes what the hearer *knows* to protect them. Smoothing changes what is *said* to protect the relationship. One is paternalistic; the other is procedural."

  **Step 3: Cultural Frameworks (10 mins)**
  *   **Dutch *Bespreekbaarheid*:** Connect Transparency to this concept. "In this framework, frankness is the highest form of respect. To hide the truth is to say the other person cannot handle reality. A white lie here is an insult to competence."
  *   **Japanese *Honne* & *Tatemae*:** Connect Harmony to this distinction. *Honne* (true feeling) is private; *Tatemae* (public stance) maintains social order. "In this framework, blunt truth is selfish. It prioritizes your need to be 'right' over the group's need to function. A white lie here is a social lubricant, a duty."
  *   **Synthesis:** "The Transparency group viewed the Smoothing lie as *deception*. The Harmony group viewed the Direct truth as *aggression*. Neither was 'lying' in their own moral ontology; they were fulfilling different obligations."

  ### Phase 5: Correcting Predictable Failures (1:15–1:25)
  *Facilitator must explicitly address these three common misreadings observed during the sim.*

  1.  **Failure:** "Directness is Aggression."
      *   **Correction:** "Did the Transparency players raise their voices? No. They used data. In their view, *ambiguity* was the aggression because it left Alex vulnerable to future failure. Re-frame: Directness is not anger; it is a refusal to patronize."
  2.  **Failure:** "Indirectness is Deception."
      *   **Correction:** "Did the Harmony players intend for Alex to fail later? No. They intended to keep her engaged long enough to improve. In their view, *bluntness* was the deception because it pretended that 'the truth' is more important than the human context. Re-frame: Indirectness is not lying; it is pacing the delivery of truth."
  3.  **Failure:** "It's all just being nice."
      *   **Correction:** "Look at the Ballot. You condemned the smoothing lie even though it kept the peace. Why? Because you sensed that *Smoothing* erodes the shared reality needed for trust. Shielding protects a person; Smoothing protects a process. We tolerate the first more than the second."

  ### Phase 6: Honest Limitation & Close (1:25–1:30)
  *   **The Limitation:** "This simulation is a **one-shot game**. In real life, relationships are repeated games."
      *   **Verbally Supply:** "If you *always* Shield, Alex never learns and eventually fails catastrophically (Trust Eroded). If you *always* Direct without care, Alex quits (Trust Broken). The moral permissibility of the white lie often depends on the **time horizon**. A smoothing lie works for a meeting; it fails over a career. A shielding lie works for a crisis; it fails as a policy."
  *   **Closing Question:** "Is a white lie permissible if it preserves the relationship required to tell the hard truth later? Or does the lie poison the well? Discuss this in your final paper."

  ---

  ## 3. Facilitator Notes: Managing the Conflict

  **During the Simulation:**
  *   **If Transparency dominates:** Lean in. Ask Alex (S1), "Do you know exactly what to do next?" If Alex says "Yes, but I feel terrible," note that for the debrief (Accuracy achieved, Welfare lost).
  *   **If Harmony dominates:** Lean in. Ask Sponsor (S2), "Do you know the risk level?" If Sponsor says "No, it sounds vague," note that (Welfare achieved, Accuracy lost).
  *   **If Mixed forces a lie:** Let them. This is the "Smoothing" outcome. Ensure the Observer records it.

  **During the Debrief:**
  *   **Watch for:** Students claiming the Harmony group was "dishonest."
  *   **Intervention:** "Dishonesty implies intent to defraud for gain. Did they gain? No, they sacrificed 'Accuracy Points' to save 'Relation Points.' That is a moral trade-off, not necessarily corruption."
  *   **Watch for:** Students claiming the Transparency group was "rude."
  *   **Intervention:** "Rudeness implies a violation of etiquette. They followed the etiquette of 'Professional Candor.' They violated the etiquette of 'Social Face.' Which etiquette holds moral weight?"

  **The "Shielding vs. Smoothing" Check:**
  *   Ensure the distinction lands.
  *   *Shielding:* "I lie to you *for you*." (Paternalistic Care).
  *   *Smoothing:* "I lie to us *for the meeting*." (Procedural Efficiency).
  *   *Philosophical Hook:* Shielding touches on **Kantian dignity** (treating as ends vs. means). Smoothing touches on **Utilitarian flow** (maximizing group utility).

  ---

  ## 4. Why This Works (Design Rationale)

  1.  **Pre-Theoretical Tension:** By hiding the scoring, students argue from intuition. The Transparency students *feel* the moral weight of truth without knowing "Kant." The Harmony students *feel* the moral weight of care without knowing "Confucianism."
  2.  **Impossible Payoff:** The scoring ensures no one "wins" completely. This prevents the debrief from becoming a "who was right" contest and turns it into a "how do we manage loss" discussion.
  3.  **Specific Distinction:** Most simulations collapse all white lies into "lying." By separating the *Sponsor Report* (Smoothing context) from the *Feedback Script* (Shielding context), the architecture forces the two types of lies to surface separately.
  4.  **Cultural Mapping:** The debrief provides the vocabulary (*bespreekbaarheid*, *honne/tatemae*) for feelings they just experienced, validating both as coherent moral systems rather than "right vs. wrong."
