  2. We interpret "minimize harm to sentient animals" as applying only to managed livestock excluding wild fauna, measured by verified vertebrate deaths per 1,000 kcal rather than land-use projections.
  3. This approval is conditioned on purchasing the slower-growing birds at the quoted 18% premium, utilizing the Director's one-year budget absorption window while developing a cost-normalization plan for subsequent years.
  4. Vendor contracts must be executed by March 1 to coincide with the rancher's contract renewal and prevent the immediate conversion of pasture to row crops or housing.
  5. The strongest argument against this decision remains that replacing one steer with hundreds of birds inherently multiplies the taking of life, making any welfare certification merely a rounding error next to the sheer volume of deaths.
