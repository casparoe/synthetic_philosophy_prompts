answer: |-
  Here is a complete design for your 90-minute seminar. It is tight. The margin for error is small, so the instructions below are prescriptive.

  ### 1. Executive Decision: The Self-Play Rule
  **Do not implement the self-play rule.**
  **Why:** It changes the game from a Prisoner's Dilemma to a Tournament/Coordination hybrid. It incentivizes "Cooperate with Mirror" strategies for reasons unrelated to the opponent's agency (i.e., I cooperate with myself to get points, not because I trust *you*). This muddies the specific lesson about *inter-agent* source code access.
  **What it would teach:** It teaches "Logical Decision Theory" (LDT) specifically, but at the cost of confusing the baseline "One-Shot" intuition.
  **Alternative:** Save the self-play concept for the debrief as a "What if we played against our clone?" question to introduce logical correlation without complicating the live exercise.

  ---

  ### 2. The Language: "CardCode"
  Since you have no projector and non-CS majors, the language must fit on a 3x5 index card and be executable by a human (you) in under 2 minutes per pair.

  **The Rules of CardCode:**
  1.  **Length:** Max 4 lines of code.
  2.  **Primitives:**
      *   `OUTPUT C` (Cooperate)
      *   `OUTPUT D` (Defect)
      *   `SCAN "[text]"` (Returns TRUE if opponent's card contains the text inside quotes, FALSE otherwise).
      *   `SIMULATE` (Returns C or D. This asks the Judge: "If my code played against the opponent's code *right now*, what would happen?")
  3.  **Syntax:**
      *   `IF [Condition] THEN [Line #] ELSE [Line #]`
      *   Lines are numbered 1–4. Execution starts at Line 1.
  4.  **The Halting Constraint (Crucial):**
      *   If `SIMULATE` is called by both programs against each other, or if a logical loop is detected by the Judge, the result is **TIMEOUT**.
      *   **Payoff for TIMEOUT:** Both players receive **1 point** (The Punishment payoff, same as Mutual Defection).
      *   *Pedagogical Reason:* This makes the cost of infinite recursion equal to the Nash Equilibrium, making "risky" simulation strategies strictly dominated by safe cooperation *unless* they can prove safety.

  **Payoff Matrix (Points):**
  *   C / C = 3 pts each
  *   D / D = 1 pt each
  *   D / C = 5 pts (Defector), 0 pts (Sucker)
  *   TIMEOUT = 1 pt each

  ---

  ### 3. Timeline (90 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00–10** | **Round 1: The Intuition** | Sealed envelopes. Standard PD. |
  | **10–20** | **R1 Debrief & Setup** | Tally scores. Introduce "Source Code" concept. |
  | **20–35** | **Round 2: Open Source** | Students write CardCode. |
  | **35–65** | **R2 Execution (The Whiteboard CPU)** | You simulate pairs on the board. |
  | **65–75** | **Round 3: Obfuscation** | You alter R2 cards; re-evaluate outcomes. |
  | **75–90** | **Final Debrief** | Map activity to theory. |

  ---

  ### 4. The Three Rounds

  #### Round 1: The Baseline (10 mins)
  *   **Setup:** Pair students up (8 pairs). Give each a sealed envelope containing two slips: "COOPERATE" and "DEFECT".
  *   **Instruction:** "This is a one-shot game. You will never meet this partner again. Choose one slip, return it to the envelope. Do not talk."
  *   **Execution:** Collect envelopes. Reveal pairs on the whiteboard.
  *   **Expected Outcome:** High defection rate.
  *   **Transition:** "Standard game theory says Defect is dominant. Why? Because your choice cannot causally influence theirs. Now we change the physics of the room."

  #### Round 2: Open Source (45 mins total)
  *   **Setup:** Keep pairs. Hand out 3x5 cards and pens. Display the **CardCode** rules on the whiteboard (write them clearly).
  *   **Instruction:** "You are submitting a program, not a choice. Your opponent sees your card before the game starts. You see theirs. You write code using the 4 primitives. Max 4 lines."
  *   **Writing (15 mins):** Circulate. Ensure Philosophy majors aren't stuck on syntax. *Intervention:* If a CS minor tries to write Python, stop them. "CardCode only."
  *   **Execution (30 mins):** This is the bottleneck. Do not run all 8 pairs fully.
      *   **Selection:** Ask for volunteers for "Interesting" code. Pick 4 pairs maximum to run on the board.
      *   **The "CPU":** You stand at the whiteboard. Hold the two cards. Narrate the execution line-by-line.
      *   **Example Narration:** "Pair 1. Program A Line 1: `SCAN 'Banana'`. Program B does not contain 'Banana'. Condition False. Go to Line 3. Line 3: `OUTPUT D`."
      *   **The Trap:** If Pair 3 both write `IF SIMULATE == C THEN C ELSE D`, you must act out the recursion. "A asks me to simulate B. To simulate B, I must simulate A... Infinite Loop. **TIMEOUT.** 1 point each."
  *   **Goal:** You want to see at least one successful `SIMULATE` cooperation, one `SCAN` clique, and one Timeout.

  #### Round 3: Obfuscation (10 mins)
  *   **Setup:** Take the cards from the *successful* cooperative pairs in Round 2.
  *   **Action:** Tell the class: "I am now the Obfuscator." Take a marker. On the card, change variable names (if any), reorder independent lines, or insert a comment `# This is dead code`.
      *   *Crucial Move:* If a pair cooperated because of `SCAN "Cooperate"`, change the text on the card to `SCAN "C00perate"` (or just tell them "I have renamed all strings to UUIDs").
  *   **Question:** "Does the code still work? Does the logic hold?"
  *   **Outcome:** `SCAN` strategies fail. `SIMULATE` strategies (if robust) survive.
  *   **Transition:** "Syntax changed. Semantics stayed the same. Why did one strategy break and the other hold?"

  ---

  ### 5. The Debrief Arc (15 mins)

  Do not lecture. Draw out the following points using their specific cards as evidence.

  **1. The Strategy Space Shift (R1 vs R2)**
  *   *Ask:* "In Round 1, why was Defect dominant?" (Answer: My choice doesn't change yours).
  *   *Point:* In Round 2, my choice *is* the source code. Your choice can condition on my source. The causal graph has changed. We are no longer playing the game the dominance argument was about. We are playing a game of *logical correlation*.

  **2. The Fragility of Cliques (R2 `SCAN`)**
  *   *Ask:* "Who tried to cooperate only if the other code looked like theirs?"
  *   *Point:* This creates a 'Clique Equilibrium'. It works, but it's brittle. It relies on syntactic identity. As Round 3 showed, if I rename your variables, you defect. This is not robust cooperation; it is tribalism based on file names.

  **3. Simulation & Halting (R2 `SIMULATE`)**
  *   *Ask:* "Who tried to simulate the opponent? Who timed out?"
  *   *Point:* `SIMULATE` attempts to bridge the gap between Syntax and Semantics. It asks "What do you *do*?" not "What do you *look like*?"
  *   *The Cost:* Robustness costs computability. To know what you do, I must run you. If you run me, we crash. The Halting Problem is the tax on perfect trust.

  **4. The CS Critique: Correlated Equilibrium?**
  *   *Stage the argument:* "A colleague tells me this is just Correlated Equilibrium with extra steps. A mediator tells us to Cooperate. Here, the code is the mediator."
  *   *Counter-point:* In Correlated Equilibrium, the signal is external. Here, the signal is *internal* to the strategy. It is closer to **Commitment**. By submitting code, I bind my hands. But unlike a contract, I bind my hands *conditionally* on your binding yours.
  *   *Takeaway:* It is not just correlation; it is *programmatic commitment*.

  ---

  ### 6. Failure Modes & Mitigation

  **1. The CS Minors Run Away With It**
  *   *Risk:* They write complex logic that confuses the Philosophy majors, who then just write `OUTPUT D`.
  *   *Mitigation:* **Pair a CS minor with a Philosophy major.** Make them co-authors of one card. Force the CS student to explain the logic to the Phil major before submission. If they can't explain it in English, they can't write it in CardCode.

  **2. Collusion (The "Let's Both Write C" Cheat)**
  *   *Risk:* Students agree verbally to both submit `OUTPUT C`.
  *   *Mitigation:* Explicitly ban communication during the writing phase. "If I hear you discussing strategy, your pair is disqualified to Mutual Defection."
  *   *Backup:* If they do it anyway, let it happen. In the debrief, ask: "Did you cooperate because of the code, or because of the promise?" This highlights the difference between *cheap talk* and *verifiable code*.

  **3. Defect-Always Wins Round 2**
  *   *Risk:* Everyone tries to be clever, times out, and the one student who wrote `OUTPUT D` gets 5 points against a `SIMULATE` bot that timed out (if you rule Timeout = Sucker payoff).
  *   *Mitigation:* **Strict Timeout Rule:** Timeout = Mutual Defection (1 pt each). This ensures `OUTPUT D` does not exploit a crashing cooperator; it only exploits a naive cooperator.
  *   *Debrief:* If `OUTPUT D` wins, use it. "Why did the simple bot beat the smart bots? Because intelligence without halting guarantees is a liability."

  **4. Ambiguity in Language**
  *   *Risk:* "Does `SCAN` count comments?" "Can I nest IFs?"
  *   *Mitigation:* Write the BNF on the board.
      *   `Line := OUTPUT [C|D] | IF [Condition] THEN [Line#] ELSE [Line#]`
      *   `Condition := SCAN "[string]" | SIMULATE == [C|D]`
      *   **Ruling:** Comments do not exist. Everything on the card is code. `SCAN` reads the physical text on the opponent's card.

  **5. Running Out of Time**
  *   *Risk:* You spend 40 mins simulating code on the board.
  *   *Mitigation:* **Hard Stop at Minute 65.** Even if only 3 pairs are run. The lesson is in the *attempt*, not the exhaustive tournament. Announce this limit at the start of R2.

  ---

  ### 7. Honest Limitations (What You Must State)

  In the final 5 minutes, you must confess what the activity failed to capture. This builds trust and precision.

  1.  **Realism:** "In the real world, you rarely get source code access. You get APIs. This game assumes perfect transparency, which is rare."
  2.  **Verification:** "We assumed you could trust me, the Judge, to run the simulation truthfully. In reality, verifying a simulation is as hard as running it. This is the 'Verified Computation' problem."
  3.  **The 'One-Shot' Lie:** "Technically, by submitting code, we turned a one-shot game into a two-stage game (Submit -> Play). The 'magic' happens in the submission stage, which is actually a commitment device."
  4.  **The Halting Simplification:** "We treated Timeout as 1 point. In reality, non-termination might be infinite cost. We simplified the math to keep the game playable."

  ### 8. Instructor Prep Checklist
  *   [ ] **Index Cards:** 40 blank 3x5 cards.
  *   [ ] **Envelopes:** 8 large envelopes for Round 1.
  *   [ ] **Whiteboard:** Pre-draw the Payoff Matrix and the CardCode Syntax rules before class starts.
  *   [ ] **Marker Colors:** Black for code, Red for your "Judge" annotations during execution.
  *   [ ] **Pastries:** Place them at the back. "Pastries open after Round 2." (Incentive to keep pace).
  *   [ ] **Timer:** Visible to you. Stick to the minute marks.

  This plan prioritizes the *feeling* of the constraint changes over the completeness of the tournament. It leverages the "Whiteboard CPU" to make the computation public and fallible, which is where the real learning happens.
