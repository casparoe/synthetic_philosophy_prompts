  # JOINT STATEMENT ON THE PRAGMATIC CONCEPTION OF TRUTH
  **An Adversarial Collaboration between C.S. Peirce (Convergence Theory) and William James (Radical Pragmatism)**

  **Date:** 24 October 2023
  **Signatories:** The Peircean Convergence Theorist (PCT) and The Jamesian Pragmatist (JP)

  ## 1. Preamble
  We, the undersigned, acknowledge a longstanding philosophical dispute regarding the definition and extension of the predicate 'true'. While we share a commitment to the pragmatic maxim—that the meaning of a concept lies in its conceivable practical consequences—we diverge on whether the 'consequences' that constitute truth are defined by the *ideal termination of inquiry* or by the *aggregate practical payoff* for believers. This document records our points of contact, our specific disagreements regarding stipulated cases, and the cruxes that remain unresolved.

  ## 2. Agreed Claims
  We jointly affirm the following propositions, which constitute the shared core of our pragmatic outlook:

  1.  **Normativity:** Truth is not merely a descriptive label but a normative status. To call a belief 'true' is to commend it as a proper guide for action and expectation.
  2.  **Constraint by Experience:** Belief is not voluntary. Reality exerts a coercive pressure on inquirers; we cannot maintain beliefs that consistently frustrate our expectations in the long run.
  3.  **Anti-Correspondence:** We reject the notion that truth consists in a static, metaphysical correspondence between a proposition and a mind-independent reality accessible from a 'God's eye view'. Truth is a relation involving believers, signs, and the world.
  4.  **Stability:** A true belief is characterised by a stability that false beliefs lack. While false beliefs may persist temporarily, they tend to generate doubt and friction upon sustained interaction with experience.
  5.  **Fallibilism:** No current assertion is immune to revision. Even our jointly affirmed claims here are held open to future correction by the course of inquiry.
  6.  **The Role of Community:** Inquiry is essentially a social enterprise. Individual certainty is insufficient for truth; intersubjective verification is required.

  ## 3. Stipulated Cases and Disagreements
  We have agreed to test our definitions against two specific thought experiments. Below, we record our respective predictions and the precise nature of our disagreement for each.

  | Case | Description | Peircean Convergence Theorist (PCT) | Jamesian Pragmatist (JP) |
  | :--- | :--- | :--- | :--- |
  | **1. Two Methodical Communities** | Two communities share all data and resources but weight *predictive accuracy* vs. *unifying simplicity* differently. They permanently settle on incompatible claims ($H_1$ and $H_2$) without practical failure. | **Prediction:** This scenario is impossible at the *ideal limit*. If divergence persists, at least one community is failing to maximise long-run stability. One theory is subtly less robust; the friction will eventually appear.<br>**Verdict:** Only one can be true. Truth requires uniqueness. | **Prediction:** This scenario is possible. If both $H_1$ and $H_2$ yield equal practical payoff for their respective holders, both are true.<br>**Verdict:** Truth can be plural. If the 'cash value' is identical, the difference is not a difference in truth. |
  | **2. The Inert Proposition** | A claim $P$ regarding the microstate of a causally sealed region. $P$ can never affect observation or action. Ideal inquiry would nonetheless assert $P$. | **Prediction:** $P$ can be true. Truth is defined by what inquiry *would* settle, not by current utility. The ideal limit includes theoretical completeness.<br>**Verdict:** True (if asserted at the limit). | **Prediction:** $P$ is truth-apt only if believing it alters life. If $P$ makes no difference to practice, it lacks truth-value.<br>**Verdict:** Neither true nor false (or 'true' is an empty label here). |

  ## 4. Cruxes
  The disagreements above stem from deeper theoretical divergences. We identify the following cruxes as the primary engines of our dispute.

  ### Crux A: The Necessity of Uniqueness
  *   **The Issue:** Must truth be unique?
  *   **PCT Position:** Yes. The very concept of a 'fact' implies that contradictory claims cannot both hold. If inquiry diverges permanently, the method is flawed, not the world. Convergence is a constitutive requirement of truth.
  *   **JP Position:** No. Truth is made in the process of verification. If two paths verify equally well for different agents, we have two truths. Uniqueness is a desire, not a precondition.
  *   **Proposed Test:** We agree to examine historical scientific paradigms where incompatible models (e.g., wave vs. particle) yielded identical predictive success for extended periods.
      *   *PCT Interpretation:* This was a state of ignorance, not truth.
      *   *JP Interpretation:* This was a state of plural truth.
      *   *Bearing:* If we can identify a case where divergence persisted *without* eventual resolution or practical friction, JP gains ground. If all such cases eventually resolve, PCT gains ground.

  ### Crux B: The Scope of the 'Practical'
  *   **The Issue:** Does 'practical payoff' include theoretical satisfaction (e.g., simplicity, elegance)?
  *   **PCT Position:** Yes. Theoretical virtues are practical because they reduce the friction of thought. Therefore, the 'ideal limit' is simply the maximisation of all practical virtues, including cognitive economy.
  *   **JP Position:** Mostly, but with a caveat. Theoretical satisfaction counts only insofar as it impacts the 'stream of experience'. If a theoretical virtue (like simplicity) leads to a claim with *no* empirical consequences (Case 2), it ceases to be a practical payoff.
  *   **Bearing:** This is the primary driver of the *Inert Proposition* disagreement. If 'practical' is defined broadly enough to include 'satisfaction of the impulse to theorise', PCT and JP converge. If 'practical' is restricted to 'sensory-motor guidance', they diverge.

  ## 5. Verbal Disputes
  We acknowledge that a portion of our disagreement is verbal rather than substantive.

  1.  **The Definition of 'Truth':**
      *   **PCT** uses 'truth' to denote the *regulative ideal* of inquiry (the destination).
      *   **JP** uses 'truth' to denote the *current validity* of a belief's function (the vehicle).
      *   **Resolution:** We agree that we are often arguing over whether 'truth' names the *process* of successful leading or the *endpoint* of that process. We shall henceforth distinguish between 'truth-as-verification' (JP) and 'truth-as-finality' (PCT).

  2.  **The Meaning of 'Real':**
      *   **PCT** implies that the 'Real' is that which the ideal community represents.
      *   **JP** implies that the 'Real' is that which forces itself upon our attention.
      *   **Resolution:** In most ordinary contexts, these extensions overlap. The verbal dispute arises only in edge cases (like the Inert Proposition) where 'forcing attention' and 'ideal representation' come apart.

  ## 6. Conclusion
  We sign this statement to acknowledge that while our definitions of truth diverge on the limits of inquiry and the necessity of uniqueness, our shared pragmatic method ensures we remain grounded in the same empirical world. We agree to continue testing our views against the friction of experience, recognising that the ultimate arbiter of our dispute may itself be a matter of practical payoff.

  **Signed:**

  _________________________
  *The Peircean Convergence Theorist*

  _________________________
  *The Jamesian Pragmatist*
