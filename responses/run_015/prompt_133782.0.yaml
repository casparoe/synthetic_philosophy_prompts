answer: |-
  ### Brainstorm: Three Modes of Preference Revision

  Before locking in the protocol, we should acknowledge that "changing your mind" isn't a single mechanism. For this project, you'll need to pick one, but it helps to see the landscape:

  1.  **Informational Updating:** Voters learn new facts about the options between rounds (e.g., "Option B costs less than I thought"). This changes utility functions based on external data, not the vote itself.
  2.  **Strategic Compromise:** Voters see the current tally and shift their ranking to prevent their worst-case scenario (e.g., "A is winning, but I hate A, so I'll boost B to block A"). This is game-theoretic manipulation.
  3.  **Social Convergence (Fatigue):** Voters feel pressure to align with the majority to end the conflict (e.g., "Everyone else likes C, maybe I'll move C up one spot to speed this along"). This is the most sociological and fits your "committee" intuition best.

  ***

  ### Research Proposal: Dynamic Preferences and Arrow's Impossibility

  **Project Title:** Escaping the Impossibility? Testing Arrow's Theorem Under Endogenous Preference Revision

  **1. The Exact Question**
  Does introducing a deterministic preference revision rule between voting rounds invalidate Arrow's Unrestricted Domain axiom sufficiently to allow for a non-dictatorial aggregation method, or does the impossibility result simply shift to require stability conditions on the revision rule itself?

  **2. Why Standard Treatments Leave This Open**
  Classic Arrow theory assumes a "static profile": voters hand in their rankings once, and the social welfare function processes them instantly. The **Unrestricted Domain** condition requires the system to work for *any* possible combination of fixed rankings. However, in real committees, preferences are endogenous—they depend on previous outcomes. If voters update their rankings based on Round 1 results before voting in Round 2, the set of possible profiles at Round 2 is no longer "unrestricted"; it is constrained by the revision rule. Standard textbooks ignore this becuase they model aggregation as a one-shot event, not a dynamic process. This project tests if that dynamic constraint is the loophole theorists have overlooked.

  **3. The Approach**
  You will avoid heavy general proofs and instead build a minimal computational model.
  *   **Step 1 (Month 1):** Formalize Arrow's four conditions (Unrestricted Domain, Non-Dictatorship, Pareto Efficiency, IIA) in plain logic.
  *   **Step 2 (Month 2):** Construct a 3-voter, 3-option model. Define a simple revision rule (e.g., "If your top choice lost, move the winner up one slot"). Run simulations of iterative voting rounds.
  *   **Step 3 (Month 3):** Check the output sequence against Arrow's conditions. Does a dictator emerge over time? Does the system converge to a stable ranking that violates IIA in a beneficial way (reflecting learned consensus)?

  **4. Success vs. Failure**
  *   **Success:** You identify a specific revision rule where the system converges to a stable outcome wihout violating Non-Dictatorship, demonstrating that dynamic constraints effectively bypass the static impossibility.
  *   **Failure:** You find that the revision rule itself acts as a "hidden dictator" (e.g., the rule forces everyone to match the initial winner regardless of input), meaning the impossibility still holds, just disguised in the update mechanism.

  **5. Honest Scope Check**
  Three months is tight for a non-math major. Formal proof of impossibility theorems usually requires graduate-level logic. To make this feasible, you must resist the urge to generalize. Stick strictly to the 3-voter, 3-option case. If you try to prove this for *n* voters, you will run out of time. The goal is a proof-of-concept simulation, not a published theorem. If you get stuck on the formalization of IIA over time, pivot to measuring "stability" (does the winner stop changing?) rather than strict axiom compliance.

