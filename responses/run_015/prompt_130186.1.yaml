prompt: |-
  I run a workshop for philosophy grad students, about 10 people, one 90-minute session. Design an in-person game that makes them feel the pull of an epistemic bubble, but with a twist: instead of blocking outside info, everyone starts with identical evidence cards, but each round they have to assign "source credibility weights" to the same card depending on whether it arrived via an ingroup or outgroup messanger. Those weights then determine whose cards they see next round, so the bubble forms from reweighting rather than filtering. Use only paper and tokens, no laptops. Give me the rules, the payoff/feedback loop, a debrief that connects the mechanics to the bubble-vs-echo-chamber distinction, and an honest note on what real-world feature—probably algorithmic amplification—this cant reproduce. Also warn me what'll predictably go wrong the first time I run it.
