          4.  Actually, let's stick closer to the prompt: "assign source credibility weights... depending on whether it arrived via an ingroup or outgroup messenger."
          5.  **Interaction:** In each round, players pair up (one Alpha, one Beta). They swap cards.
          6.  **Weighting:** Upon receiving a card, the player must place a token on it.
