answer: |-
  # Game Title: The Trust Threshold

  **Target:** 10 Philosophy Grad Students
  **Time:** 90 Minutes
  **Materials:** Index cards (30), Poker chips/tokens (2 colors, ~50 each), Colored stickers/badges (Red/Blue), Printed Score Sheets.

  ## 1. The Setup (10 Minutes)
  **The Scenario:** The group is a committee tasked with determining the truth value of a single proposition: **"Policy X will reduce inequality."**
  **The Truth:** The Facilitator knows the ground truth (e.g., TRUE). There are 6 pieces of evidence total: 4 support TRUE, 2 support FALSE.
  **The Catch:** All evidence is ambiguous enough to be interpreted either way, but the *weight* determines the verdict.

  **Group Division:**
  1.  Split the 10 students into two factions: **Red (5)** and **Blue (5)**.
  2.  Give everyone 5 "Cognitive Tokens."
  3.  Hand out **Evidence Deck A** (3 cards) to everyone. *Content is identical for all 10 players.*
      *   *Card 1:* "Study shows Gini coefficient dropped 2%."
      *   *Card 2:* "Unemployment rose in Sector Y."
      *   *Card 3:* "Long-term wage growth stagnant."

  ## 2. The Rules (10 Minutes)
  Explain that this is a **Trust Economy**. To count evidence toward the final vote, players must "pay" tokens to validate it.

  **The Core Mechanic:**
  1.  **Rounds:** There are 3 Rounds. In each round, players pair up (1 Red + 1 Blue).
  2.  **Exchange:** Partners swap one Evidence Card from their hand.
  3.  **Weighting:** The receiver must assign a **Trust Weight** (1, 2, or 3) to the card by paying that many tokens.
      *   **Ingroup Rule:** If the messenger is your color (Red receives from Red), the cost is **halved** (round up).
      *   **Outgroup Rule:** If the messenger is the opposite color, full price.
      *   *Example:* Red receives from Blue. Weight 3 costs 3 tokens. Weight 3 from Red costs 2 tokens.
  4.  **The Threshold (The Bubble):**
      *   If you assign a Weight of **1 or 2**, the connection is severed. You **do not** receive a card from this partner in the *next* round.
      *   If you assign a Weight of **3**, the connection holds. You swap cards again next round.
  5.  **Budget:** You start with 5 tokens. You cannot go negative. Unspent tokens are lost.
  6.  **Goal:** Maximize your faction's **Accuracy Score**. (Accuracy = Does your final verdict match the Facilitator's Ground Truth?)

  ## 3. Gameplay Loop (40 Minutes)

  **Round 1 (15 mins):**
  *   Pair Red 1 with Blue 1, Red 2 with Blue 2, etc.
  *   Swap Card 1.
  *   **Decision:** Do you spend 3 tokens to trust the Outgroup (keeping the channel open)? Or spend 1 token to discount them (saving tokens, but cutting the line)?
  *   *Facilitator Note:* Watch the token economy. Most will hoard tokens for their ingroup, discounting the outgroup to Weight 1 or 2.

  **Round 2 (15 mins):**
  *   Only pairs who maintained a Weight 3 connection swap Card 2.
  *   Everyone else sits out the exchange and relies only on their initial hand + Ingroup gossip (they can talk to their own faction freely during this time).
  *   *Result:* By now, the "Bubble" has physically formed. Reds are only seeing cards from Reds. Blues only from Blues. Even though the cards started identical, the *interpretation* has diverged because the Outgroup cards were discarded or under-weighted.

  **Round 3 (10 mins):**
  *   Final swaps for those still connected (rare).
  *   Final Faction Deliberation: Reds huddle, Blues huddle. They sum the weights of their "Accepted Cards."
  *   **Verdict:** Each faction votes TRUE or FALSE based on their weighted evidence.

  ## 4. Payoff & Feedback
  *   **Reveal:** Announce the Ground Truth (e.g., TRUE).
  *   **Scoring:**
      *   If a faction votes correctly: +10 Points.
      *   Minus 1 Point for every token spent (simulating cognitive effort).
  *   **The Trap:** The optimal strategy for *individual* token conservation is to distrust the Outgroup. The optimal strategy for *collective* truth is to trust the Outgroup.
  *   **Likely Outcome:** Both factions run out of tokens trusting their own side, discard the Outgroup data, and end up with incomplete datasets. They may vote differently despite starting with identical cards.

  ## 5. The Debrief (30 Minutes)
  *Connect the mechanics to the literature.*

  **A. Bubble vs. Echo Chamber (Nguyen's Distinction)**
  *   **Ask:** "Did you stop hearing the other side because they were silenced (Bubble), or because you decided they weren't worth hearing (Echo Chamber)?"
  *   **Point:** In this game, the Outgroup *spoke*. You heard them. But you assigned them a low credibility weight. This is the **Echo Chamber** mechanism: it's not an omission of exposure, it's an active undermining of credibility.
  *   **Nuance:** However, because low weight severed the connection for Round 2, you *engineered* a Bubble out of an Echo Chamber dynamic. You turned active distrust into structural isolation.

  **B. Rationality of Bias**
  *   **Ask:** "Was it irrational to save tokens for your Ingroup?"
  *   **Point:** No. Given the rules (Ingroup is cheaper), it was *epistemically rational* to trust your side to maximize your score. This mirrors real-world "epistemic factionalization." When the cost of verifying outside sources is high (time, effort, social capital), retreating to the ingroup is a heuristic shortcut, not necessarily stupidity.

  **C. The Divergence**
  *   **Ask:** "You all started with Card 1, 2, 3. Why did Reds see a different reality than Blues?"
  *   **Point:** Because evidence isn't just data; it's data $\times$ credibility. $E_{red} = Data \times 0.9$. $E_{blue} = Data \times 0.2$. Even identical inputs yield different outputs when the weighting function is polarized.

  ## 6. Limitation Note: What This Can't Reproduce
  **Algorithmic Amplification.**
  In this game, the students *consciously chose* to down-weight the outgroup. They exercised agency.
  *   **Real World:** Algorithms often filter the outgroup *before* the user sees the card. You never get the chance to assign a weight; the card never arrives.
  *   **The Gap:** This game simulates *motivated reasoning* (psychological), not *structural filtering* (technological). In reality, users often feel they are seeing "everything" while the algorithm has already pruned the tree. This game is too honest about the bias; real bubbles are invisible to the inhabitant.

  ## 7. What Will Predictably Go Wrong (First Run)
  1.  **Collusion:** Grad students are clever. They might agree across the table: "I'll give you 3 tokens if you give me 3 tokens."
      *   *Fix:* Add a rule: "Token assignments are secret until the end." Or, make the token cost dynamic (Facilitator announces "Inflation" on Outgroup trust mid-game).
  2.  **Token Hoarding:** Players may realize the "Accuracy Score" is vague and just hoard tokens to win the "Efficiency" bonus.
      *   *Fix:* Make Accuracy the *only* way to win. Tokens are a cost, not a score.
  3.  **Analysis Paralysis:** Philosophers will debate the definition of "Trust Weight" for 10 minutes.
      *   *Fix:* Enforce a 2-minute timer per round. Hard stop.
  4.  **The "Truth" is Too Obvious:** If the evidence clearly points one way, they will ignore the weights.
      *   *Fix:* Ensure the evidence is genuinely ambiguous (e.g., "Correlation does not imply causation" style cards) so the *weight* is the tiebreaker.

  ## Facilitator Cheat Sheet (Print this)
  *   **Ground Truth:** Policy X = TRUE.
  *   **Evidence:** 4 Cards support TRUE, 2 Cards support FALSE.
  *   **Distribution:** Everyone gets 2 TRUE cards, 1 FALSE card initially.
  *   **Win Condition:** If Reds vote TRUE and Blues vote FALSE, the game worked (Polarization achieved). If both vote TRUE, discuss why the bubble failed to close.
  *   **Key Debrief Question:** "At what exact moment did you decide the person across from you was less reliable than the person next to you?"
