      *   **Structure:** Intro (10), Rules (10), Gameplay (40), Debrief (30).
      *   **Debrief Focus:** How rational individual choices (discounting unreliable sources) lead to irrational collective outcomes (divergent realities).
      *   **Limitation:** Algorithms do the filtering *for* us; here students do it manually. Also, the "truth" in the game is fixed, whereas in reality, the "truth" is often contested.

