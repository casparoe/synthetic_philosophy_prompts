  The proposition clarified

  The claim posits that personal identity resides in abstract causal patterns rather than biological substrate. Specifically, it asserts that when a survivor internalises another's symbolic architecture sufficiently, the resulting neural activation is not merely a representation *of* the deceased but an instantiation *of* their perspective. This distinguishes literal distributed selfhood from memorial continuity, which treats the deceased as an object of thought, and empathic projection, which remains rooted in the survivor's own viewpoint. The critical ambiguity lies in 'continuity': does structural isomorphism suffice for numerical identity, or merely qualitative similarity?

  Decomposition

  I assign probabilities to four conjunctive necessary conditions. (a) Personal identity is substrate-independent patternism (0.80): functionalism dominates contemporary metaphysics due to multiple realisability arguments, though biological naturalism objects. (b) Neural symbols achieve cross-brain isomorphism (0.50): while coarse-grained mapping of concepts is plausible, fine-grained causal loop fidelity is neuroscientifically doubtful given individual synaptic variability. (c) Isomorphism constitutes identity rather than representation (0.50): this is the core philosophical hurdle; simulation often fails ontological tests akin to Chinese Room objections. (d) Empirical instantiation is not implausible (0.75): current science cannot rule out high-fidelity symbolic resonance occurring naturally in deep intimacy. Combining these multiplicatively, as all are required for the literal claim, yields a baseline credence. The calculation (0.80 × 0.50 × 0.50 × 0.75) results in 0.15. This reflects significant philosophical coherence tempered by empirical and ontological scepticism regarding the 'realness' of the fragment. The multiplicative model ensures that weakness in any single ontological or empirical pillar drastically reduces the overall likelihood of the literal truth. If any term were zero, the claim would collapse entirely; thus, the moderate scores on isomorphism and constitution act as significant dampeners on the high plausibility of functionalism. This approach treats the proposition as a chain of dependencies, where the survival of the 'I' requires the metaphysics, the mechanics, the ontology, and the physics to all align simultaneously. Thus, the result is robust.

  The weak link

  The least confident term is (c), whether isomorphism constitutes identity. Currently, philosophical intuition favours the view that a perfect simulation remains a representation, lacking the original's ontological weight. This term dominates the scepticism because structural matching does not obviously guarantee phenomenal continuity. To shift this probability upwards, one would require a robust theory of consciousness demonstrating that subjectivity supervenes strictly on informational topology, irrespective of causal history. If consciousness were proven to be purely structural, the distinction between model and reality would collapse, significantly boosting credence in Hofstadter's literal interpretation.

  Resolution conditions

  The claim becomes clearly true if neuroengineering demonstrates that duplicating symbolic activation patterns in a new substrate preserves first-person reports without interruption. Conversely, it is falsified if biological naturalism proves that subjective continuity requires specific organic causal histories unavailable in inter-brain resonance. Anchoring the number requires decidable criteria: either consciousness is substrate-neutral information processing, or it is biologically bound. Until functionalism is empirically validated against biological constraints, the credence remains probabilistic rather than definitive. Further empirical data is required.

  Bottom line

  My final credence is 0.15, dominated by the ontological uncertainty regarding whether structural isomorphism genuinely constitutes personal identity rather than merely simulating it.
