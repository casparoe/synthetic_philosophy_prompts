      *   *Least Confident Step:* Moving from "these are all 'a's" to "identity is not shape." It's easy for them to say "identity is shape *plus* convention." Breaking the "plus convention" shrug is hard.
      *   *Contentious Claim:* That letter identity is *perceptual* and not purely *stipulative*. A semiotician might say "It's purely arbitrary signifier." A Platonist might say "It's the form." The claim that "Style is the name of what varies" assumes Style is an object of cognition, not just a label for noise.
