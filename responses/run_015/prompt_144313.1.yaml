      4.  *CogSci Similarity Space:* "It's just clustering in high-dim space." (Head off by showing discontinuous jumps that preserve identity).

  6.  **Address Deliverable 4: What to Leave Out:**
      *   Letter Spirit algorithm (grid structures, retro-cognition).
