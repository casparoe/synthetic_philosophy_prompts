answer: |-
  Here is the plan. It is aggressive for eighty minutes. If you do not keep the whiteboard work strictly minimal, you will run out of time before the "Check."

  ### 1. Sequence and Vocabulary

  **The Order:**
  1.  **Phenomenological Agreement (0–15 min):** Establish that vastly different shapes are indisputably the same letter.
  2.  **The Failure of Intrinsic Properties (15–30 min):** Demonstrate that no set of geometric features (curves, angles, closure) is necessary or sufficient.
  3.  **The Failure of Stipulation (30–50 min):** Demonstrate that "because we say so" cannot account for the *constraints* on what we can say (i.e., why we *can't* accept just any shape).
  4.  **The Systemic Constraint (50–65 min):** Introduce the dependency on the surrounding alphabet (the notation system).
  5.  **The Formulation (65–80 min):** Articulate the distinction between Letter-Identity and Style using the "Check."

  **Vocabulary Decision:**
  **Extract, do not hand over.**
  If you give them "type," "token," and "style" at the start, they will treat them as definitions to apply rather than distinctions to discover. They will map "type" to "classical definition" and stop thinking.
  *   **Dependency:** You must wait until they struggle to describe *what remains constant* in step 2. When they say "It's the same shape, basically," and you draw a counter-example that breaks the shape but keeps the letter, *then* introduce the term **Letter-Identity** (or Type) to name the thing they are pointing at but cannot define.
  *   **What is lost if you give it:** You lose the cognitive friction required to feel the problem. They will treat the type/token distinction as a linguistic fix rather than a metaphysical puzzle.
  *   **What is lost if you skip it:** You risk talking past each other. You must introduce the terms at minute 30 as *tools* to solve the impasse, not as premises.

  **The Claim:**
  Your target claim ("sameness of letter... is neither sameness of intrinsic shape-properties nor a matter of stipulation") is correct for this level, but in eighty minutes, you will likely only reach: "Sameness of letter is determined by structural role within a stylistic system." The stronger metaphysical claim requires more time to defend against the "convention" shrug. Aim for the structural role; the metaphysics is the homework.

  ### 2. The One Example

  **Reject Rotunda.**
  Your suspicion is correct. If you present a text where 'a' shapes look like 'b' shapes, the students will immediately categorize this as a **cipher** or a **code**. This collapses the problem into "decoding rules," which bypasses the perceptual/cognitive tension you need. It makes the identity purely stipulative ("In this code, this shape means 'a'"), which is exactly the misconception you are trying to dismantle.

  **Use: The Degenerate Family.**
  Draw four 'a's on the board:
  1.  A standard serif 'a' (two-story).
  2.  A standard sans 'a' (one-story, like 'o' with a stick).
  3.  A blackletter 'a' (highly ornate, barely recognizable).
  4.  **The Critical Case:** A handwritten scrawl that is barely closed, perhaps missing the vertical stroke, but written in a sequence "c, d, e...".

  **Why this carries it:**
  *   It keeps the focus on *perception* and *categorization*, not decoding.
  *   It allows you to draw the variations by hand in seconds.
  *   It forces the question: "At what point does the scrawl stop being an 'a'?" without allowing the escape hatch of "It's a code."
  *   **What it must make vivid:** That recognition is immediate for 1–3, but effortful for 4, yet the *identity* claim remains the same.
  *   **What it must keep out of the way:** Do not discuss readability speed or aesthetic preference. Keep the question strictly on *identity conditions*.

  ### 3. Misconceptions and Defusion

  They will arise in this order. You must head them off *before* they solidify, or the discussion stalls.

  1.  **The Template Picture (Minute 15):**
      *   *The Move:* "There is a perfect 'a' in our heads; these are just imperfect copies."
      *   *The Defusion:* Draw the one-story 'a' and the two-story 'a' side by side. Ask: "Which is the imperfect copy of the perfect 'a'?" They cannot answer. Both are perfect instances of their sub-types. This kills the single-template theory.
  2.  **The CogSci Similarity Space (Minute 30):**
      *   *The Move:* "It's just clustering in a high-dimensional feature space. These points are close enough."
      *   *The Defusion:* Point to the blackletter 'a'. In pixel space or geometric feature space, it is closer to a 'b' or a '4' than to the sans-serif 'a'. Yet it is an 'a'. Similarity metrics fail across stylistic gaps.
  3.  **The Reading/Being Conflation (Minute 45):**
      *   *The Move:* "It's an 'a' if I can read it as one."
      *   *The Defusion:* Distinguish *legibility* from *identity*. A smudged 'a' is still an 'a' even if unreadable in context. Conversely, a shape can be read as an 'a' in a specific context (e.g., "c_t") but not be one (e.g., if it's actually a poorly drawn 'o'). Identity is not a function of successful decoding.
  4.  **The Convention Shrug (Minute 60):**
      *   *The Move:* "It's just a convention. We agreed to call this shape 'a'."
      *   *The Defusion:* This is the hardest one. Ask: "Can we agree to call a circle an 'a'?" They will say yes. Then ask: "If I draw a circle in the middle of a word, will you read it as an 'a'?" They will say no. If it were *pure* convention, the shape wouldn't matter. The fact that the shape *resists* certain conventions shows there are constraints beyond stipulation.

  ### 4. What to Leave Out

  Say out loud that you are excluding these:

  1.  **The Letter Spirit Machinery:** Do not explain Hofstadter's grid structures, "deep slots," or the computational retro-cognition. That is a theory of *implementation*, not a clarification of the *concept*.
  2.  **Historical Typography:** Do not discuss x-heights, kerning, or the history of the Carolingian minuscule. That is genealogy, not ontology.
  3.  **The General Concept Debate:** Explicitly forbid references to "Prototype vs. Classical" theories of natural kinds. Tell them: "We are bracketing the general theory of concepts to see if notations break the mold."
  4.  **Semiotics:** Do not allow the discussion to drift into Saussurean arbitrariness. You are investigating the *limits* of arbitrariness in notations.

  ### 5. The Check

  Your script is good, but as it stands, the question "Which letter is it?" is **indeterminate**.

  **What the set must contain:**
  You must provide the **System Context**. You cannot present the five figures in isolation. You must present them alongside the other 25 letters of the alphabet rendered in the *same* script/style.
  *   *Why:* Letter identity is systemic. A shape with a broken bowl might be a degenerate 'a' in one font, but a canonical 'u' in another. Without the *stylistic grid* of the accompanying letters, there is no fact of the matter.

  **What an answer must cite:**
  To count as having "got the idea," a student's answer cannot cite visual similarity ("It looks like the first one"). It must cite **structural role within the style**.
  *   *Correct Answer Form:* "It is an 'a' because, within the logic of this specific typeface, it occupies the structural slot of the first vowel, maintaining the stroke-weight and terminal logic of the surrounding letters, despite the broken bowl."
  *   *Incorrect Answer Form:* "It's an 'a' because it's mostly round." (This fails on the triangle variant).
  *   *Incorrect Answer Form:* "It's whatever you say it is." (This fails the system constraint).

  **Modification to your Script:**
  Ensure Figure 5 (the broken one) is ambiguous *in isolation* but resolved *by the company it keeps*. If the other letters in the set show a consistent "broken" aesthetic (e.g., all terminals are stubs), Figure 5 is an 'a'. If the other letters are crisp and perfect, Figure 5 might be a damaged token of 'a', or a different letter entirely. The determinacy comes from the **stylistic consistency of the set**, not the shape of the token.

  ### 6. Two Last Things

  **The Least Confident Step:**
  **Minute 45 (The Reading/Being Conflation).**
  It is exceptionally difficult to disentangle "being an 'a'" from "being read as an 'a'" in a seminar setting without a projector to show subliminal priming data or ambiguous figures. Students will insist that if no human can read it, it isn't an 'a'. You need to be prepared to argue that a letter carved in stone on a deserted planet is still an 'a' even if no one reads it. If you fail here, the "Convention Shrug" wins.

  **The Contentious Claim:**
  **The claim that "Style is the name of what varies while letter-identity does not."**
  A colleague specializing in semiotics or post-structuralism would reject this. They would argue that *style constitutes the letter*, not merely varies it. In blackletter, the 'a' is a different *kind* of object than in sans-serif. By positing a stable "letter-identity" that persists across styles, you are assuming a Platonism about notations that is not universally accepted. You are assuming the *function* (the slot in the alphabet) is the essence, while the *form* is the accident. A materialist would say the form is the only thing that exists.

  **Framing Critique:**
  **The hour cannot hold what you have asked for.**
  Eighty minutes is insufficient to move from Natural Kinds to Artifacts to Notations, dismantle the Template/Convention dichotomies, *and* run the Check with the necessary depth.
  **Stipulation to Drop:** Drop the explicit comparison to Natural Kinds (water/gold). You mention it in the intro to set the stage, but do not let them debate it. If you let them argue whether 'a' is more like 'tiger' or more like 'chair', you will lose 30 minutes.
  **Focus:** Treat Notations as a *sui generis* category for this session. The pivot is not "Natural Kind vs. Artifact," it is "Perceptual Essence vs. Systemic Role." Narrow the scope to ensure you reach the Check.
