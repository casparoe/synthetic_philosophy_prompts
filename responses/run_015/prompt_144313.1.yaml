      *   *Crucial:* Don't explain *why* the system works, just *that* it constrains.

  7.  **Address Deliverable 5: The Check (The 5-Letter Script):**
      *   The prompt describes 5 figures.
      *   1: Standard 'a' (bowl + vertical + bar). Wait, description: "small closed round bowl with a vertical stroke descending from the right... horizontal bar." That sounds like a 'b' or a specific 'a' variant? Actually, standard 'a' is bowl + vertical stroke. The description sounds like a 'b' or a specific typographic 'a'. Let's assume it's a stylized 'a'.
