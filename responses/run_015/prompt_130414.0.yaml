prompt: |-
  Hi — I'm the program officer at the Marlow Fund, a small family foundation. We give away about $5m a year, two program staff (me and one other person), board meets quarterly but we make grant decisions monthly, ~25 grants a year and half of them are renewals. Here's our problem in two parts.

  First: about $1.5m of the annual payout is locked by the donor's will to "work that benefits people who have not been born yet," and the rest is basically unrestricted near-term global health and development. So in the same meeting we score, I dunno, a school-based delivery programme that's been running for six years and a small speculative biosecurity team, and it obviously doesn't work — the units aren't the same, and "do nothing and move the money across" isn't even available in the locked bucket, because the money has to go out the door into that bucket somehow.

  Second: right now we rate every proposal High/Medium/Low on importance, tractability and neglectedness (the three-factor framework you've probably seen floating around the effective-altruism world), turn those into 3/2/1, and multiply. It's silly and we know it. A Medium/Low/High beats a High/High/Low and nobody actually believes that. "Neglectedness" keeps getting scored as "nobody cool is talking about this" rather than as anything to do with money. And our board chair is a retired accountant who says he doesn't want to see any figure with more than one significant digit, while another trustee thinks any cause you can't describe to her mother over dinner is a scam.

  So: give us something we can actually run. Constraints — maybe two hours per proposal, one round of follow-up questions to the applicant, no literature reviews, no outside modelling contractor, and it has to fit on the one-page memo that goes to the board.

  Specifically I want:

  - The order we should establish things in, and what counts as an adequate answer at each step. I suspect we should be checking who else is already funding the space *before* we try to estimate how much good a dollar does, and that tractability should be judged at the margin rather than on average — but you tell me if that's right.
  - How the three factors actually interact, and what to do instead of multiplying, given they clearly aren't independent.
  - Where the procedure stops with a no, and where it has to stop and hand the decision to a person because the question is one of values and not facts.
  - What we do when we can't get a number at all, which is most of the time.
  - How to write the result up so it survives contact with the board: one significant digit, and explainable to someone's mother.
  - Honesty about which steps are judgement dressed up as procedure. I'd rather know now than find out in year three.

  Then run it on three real-ish cases, and at least one should come out in a way I won't like:

  (a) a renewal for a well-run school-based mass deworming / delivery programme that everyone loves, that on the evidence as it stands looks fine, and that at least three bigger funders are already in;
  (b) a cheap speculative research proposal from a tiny team with no track record, testing a mechanism nobody has tested, where the interesting part is the tail outcome and the chance we learn something;
  (c) a community health worker training programme whose numbers look great but which can only roughly double in size per year because of trainer supply.

  Also tell us what the procedure can't do — where it will definately misfire — and don't soften it. We keep tying ourselves in knots in meetings and I'd rather hand the board something with its limits printed on it.
reasoning: |-
  Here's a thinking process that leads to the suggested grantmaking framework:

  1.  **Analyze the User and Context:**
      *   **Role:** Program Officer at the Marlow Fund (small family foundation).
      *   **Resources:** $5m/year payout, 2 program staff, quarterly board meetings, monthly grant decisions.
      *   **Volume:** ~25 grants/year (50% renewals).
      *   **Constraints:** 2 hours/proposal max, 1 round of follow-up, no lit reviews/models, 1-page memo, board wants 1 significant digit + "mother test."
      *   **The Problem:**
          1.  *Portfolio Mismatch:* $1.5m locked for "future generations" (long-termism/existential risk?) vs. unrestricted near-term global health. Comparing apples (deworming) to oranges (biosecurity) is breaking their scoring system.
          2.  *Scoring Broken:* ITN (Importance, Tractability, Neglectedness) multiplication is mathematically nonsensical (ordinal scales treated as cardinal), "Neglectedness" is misunderstood, and board dynamics are tricky (accountant vs. layperson).
      *   **Desired Output:** A practical workflow, interaction logic for factors, stop/go rules, handling uncertainty, reporting format, honesty about judgment vs. procedure, and a stress test on three specific cases (including one unwelcome result).

  2.  **Deconstruct the Core Issues:**
      *   *ITN Multiplication:* This is the biggest technical flaw. Multiplying 3x2x1 implies independence and cardinality that doesn't exist. A "High Importance" project with "Low Tractability" might still be worth it if the upside is huge (tail risk), but the formula kills it.
      *   *The "Locked" Bucket:* Future generations work (likely x-risk/biosecurity/AI safety) has fundamentally different metrics than near-term global health (DALYs/lives saved). They cannot be scored on the same scale. They need separate "lanes."
      *   *Board Dynamics:* The accountant wants precision (1 sig digit), the lay trustee wants simplicity ("mother test"). The solution must bridge quantitative rigor with qualitative narrative.
      *   *Time Budget:* 2 hours/proposal means no deep diving. It must be heuristic-based, not model-based.

  3.  **Develop the Framework (The "Marlow Protocol"):**

      *   **Step 1: Segmentation (The "Bucket" Check).**
          *   Before scoring, categorize. Is this Near-Term Human Welfare (NHW) or Future Generations (FG)?
          *   *Why:* You can't compare DALYs to reduced existential risk probability.
          *   *Action:* Separate scorecards or separate budget buckets. Since $1.5m is *locked* for FG, that bucket *must* be filled. This changes the decision from "Should we fund this?" to "Is this the best available option for the FG bucket?"

      *   **Step 2: The Filter (Go/No-Go).**
          *   Save time. If it fails basic sanity checks, drop it before scoring.
          *   Criteria: Legal/Compliance, Alignment with Bucket, Basic Competence.

      *   **Step 3: Replacing ITN with "Expected Value Heuristics."**
          *   Don't multiply. Use a weighted narrative or a "floor/ceiling" approach.
          *   *Importance:* Scale of impact (Lives vs. Existential).
          *   *Tractability:* Marginal impact of *this* dollar (not average).
          *   *Neglectedness:* Funding gap relative to opportunity (not just "coolness").
          *   *New Mechanism:* **Categorization + Confidence.** Instead of 1-3 scores, use "High/Med/Low" as descriptors, not numbers. Or better, use a "Bar" system.
          *   *Decision Rule:* For NHW, look for Cost-Effectiveness + Room for More Funding. For FG, look for Upside + Plausibility.

      *   **Step 4: Handling Uncertainty & Numbers.**
          *   The accountant wants 1 sig digit. Give him ranges. "$2m - $5m impact" not "$3.42m."
          *   When numbers fail: Use "Comparative Judgment." Is this better than the marginal grant we'd otherwise make?

      *   **Step 5: The Memo.**
          *   Structure: The Ask, The Bucket, The "Mother" Explanation, The Numbers (1 sig digit), The Risk.

  4.  **Drafting the Procedure (Iterative Refinement):**

      *   *Correction on ITN:* The user is right, multiplication is silly. I need to propose a "Gating" system. Importance is a gate (must be high enough). Tractability is a multiplier of confidence. Neglectedness is a tie-breaker for marginal dollars.
      *   *Marginal Tractability:* Crucial point. Don't ask "Does this work?" Ask "Does *our* money make it work better?"
      *   *The "Locked" Money:* This is a constraint satisfaction problem. The $1.5m *must* be spent on FG. The question isn't "Is biosecurity better than deworming?" It's "Is this the best biosecurity deal we can find to satisfy the will?" This needs to be explicit.

  5.  **Addressing the Specific Requests:**

      *   *Order of Operations:* Fit -> Room for Funding -> Impact -> Cost-effectiveness.
      *   *Interaction:* Importance sets the ceiling. Tractability sets the probability. Neglectedness adjusts the marginal value.
      *   *Stop Rules:* Hard no on misalignment or fraud. Soft no on low marginal impact. Hand to board on value trade-offs (e.g., equity vs. efficiency).
      *   *No Numbers:* Use "Order of Magnitude" and "Comparative Ranking."
      *   *Board Memo:* One page. Headline number. Narrative explanation.
      *   *Honesty:* Acknowledge that "Future Generations" is a values judgment, not a fact. Acknowledge that renewal bias is real.

  6.  **Running the Cases:**

      *   *(a) Deworming Renewal:* High tractability, high evidence, low neglectedness (3 big funders). *Verdict:* Good for NHW bucket, but check "Room for More Funding." If they are fully funded by others, Marlow's marginal dollar might be better elsewhere. *Unwelcome result:* Maybe recommend decreasing funding or exiting despite it being "well-run."
      *   *(b) Speculative Biosecurity:* Low tractability (evidence-wise), high importance (FG bucket), high neglectedness. *Verdict:* Fits the locked bucket. The "tail outcome" justifies the risk. *Result:* Fund, but classify as "High Risk/High Upside."
      *   *(c) CHW Training:* Great numbers, scaling constraint. *Verdict:* Tractability is limited by supply. Marginal dollar might be wasted if they can't spend it. *Result:* Fund only the amount they can absorb, or No if the constraint is too tight.

      *   *Refining the "Unwelcome" Result:* The prompt asks for one result the user won't like.
          *   Case (a) is the best candidate. It's "everyone loves," "well-run." Telling them to *stop* or *reduce* funding because others are covering it (marginal utility) is a classic EA pain point that program officers hate delivering.
          *   Alternatively, Case (b) could be the unwelcome one if the framework says "Too speculative" but the locked bucket *requires* spending. I need to balance the "Locked Bucket" constraint. The locked bucket *forces* spending on FG. So (b) is actually *safer* for the PO.
          *   Let's make (a) the unwelcome one: "Despite being effective, your marginal dollar does less here than in (c) or (b) due to crowding."

  7.  **Final Polish:**
      *   Tone: Professional, direct, empathetic to the operational constraints.
      *   Formatting: Clear headings, bullet points, distinct sections for the framework and the case studies.
      *   Check Constraints: 1 sig digit, mother test, 2-hour limit.

  8.  **Self-Correction/Review during drafting:**
      *   *Wait, the locked bucket:* If $1.5m *must* go to FG, then comparing (a) and (b) directly is wrong. They compete in different pools. I need to make sure the framework separates the pools first. The user's problem is they are scoring them in the "same meeting." I need to advise splitting the agenda or at least the scoring criteria.
      *   *Scoring:* I will advise against numbers for the factors. Use "Gates."
      *   *Board:* The accountant wants 1 sig digit. I will suggest presenting "Estimated Impact per $100k" rounded to one digit.
      *   *Honesty:* Explicitly state that "Future Generations" is a value judgment mandated by law (will), not by the framework.

  9.  **Finalizing the Output Structure:**
      *   Introduction: Acknowledge the pain.
      *   Part 1: The Workflow (Order of Operations).
      *   Part 2: The Scoring Logic (Replacing ITN).
      *   Part 3: Decision Rules & Uncertainty.
      *   Part 4: The Board Memo (Template).
      *   Part 5: The Stress Test (Cases a, b, c).
      *   Part 6: Limitations (Where it breaks).

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is a classic "small foundation, big constraints" problem. You are trying to run a heuristic system (ITN) like it's an algorithm, and you are trying to compare incommensurable goods (DALYs vs. Existential Risk) in a single portfolio without acknowledging the legal constraint separates them.

  Here is a procedure designed for your specific constraints: 2 hours/proposal, 1-page memo, 1 significant digit, and a split mandate.

  ### Part 1: The Workflow (Order of Operations)

  Do not start with "How much good does this do?" Start with "Does this fit the bucket?" and "Can they spend our money?"

  **Step 1: The Bucket Check (Pass/Fail)**
  *   **Action:** Assign the proposal to **Bucket A (Near-Term Human Welfare)** or **Bucket B (Future Generations/Locked)**.
  *   **Adequate Answer:** Does this align with the donor's will?
      *   *Bucket A:* Direct benefit to living people (Health, Income, Education).
      *   *Bucket B:* Benefit to people not born yet (Biosecurity, AI Safety, Climate Stability).
  *   **Why:** You cannot compare these. A 10% reduction in pandemic risk is not convertible to X tons of deworming pills. Separate the scorecards. The $1.5m in Bucket B is a *constraint satisfaction* problem (must spend), not an optimization problem (spend only if best).

  **Step 2: The Marginal Tractability Check (Pass/Fail)**
  *   **Action:** Ask the applicant: "If we give you this amount, what specifically happens that wouldn't otherwise?"
  *   **Adequate Answer:** "We can hire X," or "We can extend the trial by Y months."
  *   **Fail Condition:** "It goes into general operations" or "We are already fully funded by [Big Funder] for this period."
  *   **Why:** You have 2 hours. You cannot audit their whole org. You are funding the *margin*, not the average. If they can't absorb the cash effectively, it's a No.

  **Step 3: The "Crowding" Check (High/Med/Low)**
  *   **Action:** Identify who else is funding this specific work.
  *   **Adequate Answer:** List the top 3 funders in this specific niche.
  *   **Why:** This replaces "Neglectedness." You don't care if "nobody cool is talking about it." You care if *money* is already there. If three big funders are in (Case A), your marginal dollar is less valuable than if you are the only one (Case B).

  **Step 4: The Impact Estimate (One Number)**
  *   **Action:** Estimate the outcome in natural units (Lives saved, Lives improved, Risk reduced).
  *   **Constraint:** One significant digit. Range required.
  *   **Why:** Satisfies the accountant. Ranges satisfy the reality of uncertainty.

  ---

  ### Part 2: How the Factors Interact (Replacing Multiplication)

  Stop multiplying 3/2/1. It implies a "Medium" tractability project with "High" importance is mathematically superior to a "High" tractability project with "Medium" importance. That is false.

  Use a **Gating and Ranking** system instead.

  1.  **Importance is the Ceiling:** It sets the maximum possible score. If Importance is Low, the project cannot be funded (unless it's a renewal with low switching costs).
  2.  **Tractability is the Probability:** It discounts the Importance. High Importance × Low Tractability = High Risk Bet.
  3.  **Crowding (Neglectedness) is the Tie-Breaker:** When two projects have similar Impact/Tractability profiles, fund the one where your money matters more (less crowded).

  **The Decision Matrix:**
  *   **Bucket A (Near-Term):** Prioritize **Tractability > Importance**. (We know the problems are important; we need to know if *this* solution works).
  *   **Bucket B (Future Gen):** Prioritize **Importance > Tractability**. (The stakes are so high we accept lower tractability, provided it's not zero).

  ---

  ### Part 3: Stop Rules & Value Judgments

  **Where the Procedure Stops with a "No":**
  1.  **Misalignment:** Wrong bucket.
  2.  **No Marginal Use:** They can't spend the money effectively within 12 months.
  3.  **Crowding Out:** They are fully funded by larger, more efficient actors for the proposed work (Case A).

  **Where it Hands to a Person (Values, not Facts):**
  1.  **Risk Tolerance:** Is a 1% chance of saving 1 million lives better than a 90% chance of saving 10,000? The math doesn't answer this; the Board does.
  2.  **Equity vs. Efficiency:** A program might be slightly less cost-effective but serves a more marginalized group.
  3.  **The "Locked" Bucket:** If you cannot find enough high-quality Bucket B projects to spend the $1.5m, do you lower your bar or carry over (if legally possible)? This is a legal/ethical decision, not a scoring one.

  **When You Can't Get a Number:**
  *   **Use "Order of Magnitude" Comparisons:** "This is likely 10x more impactful than a cash transfer," or "This is roughly equivalent to [Known Benchmark]."
  *   **Use "Confidence Levels":** High/Med/Low confidence in the estimate.
  *   **Default:** If you cannot estimate impact after 1 round of questions, the default is **No**. You are not a venture capital firm; you are a foundation. You don't have the capacity to fund pure mystery.

  ---

  ### Part 4: The Board Memo (One Page)

  **Header:** Proposal Name | Bucket (A/B) | Request Amount
  **The "Mother" Explanation:** (2 sentences max. No jargon.)
  > *"This group trains local health workers to spot pneumonia early. It costs about $50 to train one worker, and each worker saves about 2 kids a year."*

  **The Numbers (1 Sig Digit):**
  *   **Cost per Outcome:** ~$100 per life saved (Range: $50–$200)
  *   **Total Impact:** ~500 lives/year (Range: 200–1,000)
  *   **Confidence:** High / Medium / Low

  **The Marginal Question:**
  *   **What our money does:** Funds 10 new trainers.
  *   **Who else is there:** [Funder X] and [Funder Y] fund the core staff; we are funding the expansion.

  **Recommendation:** Fund / Pass / Fund Reduced Amount.
  **Program Officer Note:** (Here is where you put the judgment call). *"This is less cost-effective than our deworming partner, but they are at capacity. This is the best available option for growth."*

  ---

  ### Part 5: The Stress Test (Running the Cases)

  Here is how the protocol processes your three cases.

  #### Case (a): The Deworming Renewal
  *   **Bucket:** A (Near-Term).
  *   **Tractability:** High. (Proven mechanism).
  *   **Marginal Check:** **FAIL.** You noted three bigger funders are already in. If they are "well-run" and "everyone loves" them, they likely have a full funding pipeline.
  *   **Crowding:** High. Your dollar is replacing a dollar from a larger foundation that might have better terms.
  *   **Verdict:** **No (or Reduce).**
  *   **The Unwelcome Result:** Despite being "effective," this is a bad marginal investment. You are subsidizing other funders.
  *   **Memo Line:** *"Program is effective, but fully capitalized by larger partners. Our marginal dollar yields less impact here than in underfunded growth opportunities."*

  #### Case (b): Speculative Biosecurity Research
  *   **Bucket:** B (Future Gen / Locked).
  *   **Tractability:** Low (Speculative).
  *   **Importance:** High (Existential/Global).
  *   **Marginal Check:** **PASS.** Tiny team, no track record = hard for them to get money elsewhere. Your $200k matters a lot to them.
  *   **Verdict:** **Fund.**
  *   **Why:** This satisfies the $1.5m locked mandate. In Bucket B, you *need* high-upside tails because you can't measure DALYs. The "chance we learn something" is the product.
  *   **Memo Line:** *"High risk of technical failure, but if successful, reduces global pandemic risk. No other funders are targeting this specific mechanism."*

  #### Case (c): Community Health Worker (CHW) Training
  *   **Bucket:** A (Near-Term).
  *   **Tractability:** Medium (Constrained by trainer supply).
  *   **Importance:** High (Direct lives saved).
  *   **Marginal Check:** **PASS (with caveat).** They can only double per year.
  *   **Verdict:** **Fund Reduced Amount.**
  *   **Why:** Do not give them what they ask for if they can't spend it. Give them exactly what they can absorb in 12 months (the doubling capacity).
  *   **Memo Line:** *"Highly cost-effective, but growth is bottlenecked by trainer supply. Funding capped at absorption capacity to avoid cash drag."*

  ---

  ### Part 6: Honesty About Limitations

  You asked for honesty about where this will misfire. Here it is. Put this in your internal manual.

  1.  **The "Locked" Bucket Distortion:** This procedure admits that Bucket B (Future Gen) is judged differently than Bucket A. To a strict utilitarian, this is inconsistent. To a lawyer and a Board, it is necessary. **Risk:** You will fund lower-quality projects in Bucket B simply because the money *must* move. Acknowledge this. The standard for Bucket B is "Plausible and Uncrowded," not "Proven and Cost-Effective."
  2.  **Renewal Bias:** The 2-hour limit favors renewals. New applicants take more due diligence. **Risk:** You will drift toward a static portfolio. **Mitigation:** Reserve 20% of the budget for "New Entries" explicitly, forcing you to find new deals.
  3.  **The "One Significant Digit" Lie:** The accountant wants precision; the reality is uncertainty. **Risk:** The Board will treat "$2m" as a fact, not an estimate. **Mitigation:** Always write the word "Estimate" next to the number.
  4.  **Marginal vs. Average:** This framework relies on you knowing what the applicant would do *without* you. They will lie. **Risk:** You fund "business as usual" thinking it's marginal. **Mitigation:** Require a "Budget without Marlow" vs "Budget with Marlow" comparison in the application.
  5.  **Values Masquerading as Math:** When you choose Case (b) over a potentially higher "expected value" calculation, you are making a values judgment about risk tolerance. **Risk:** Board conflict if a bet fails. **Mitigation:** Label Bucket B grants as "High Risk / Learning Grants" in the memo so failure is an accepted outcome.

  ### Summary of Changes for Your Next Meeting

  1.  **Split the Agenda:** Review Bucket A and Bucket B grants separately. Do not score them against each other.
  2.  **Kill the Multiplier:** Use the Gating System (Importance = Ceiling, Tractability = Probability, Crowding = Tiebreaker).
  3.  **Adopt the "Marginal" Question:** Make "What happens with our money that wouldn't otherwise?" the first question in the follow-up round.
  4.  **Accept the Unwelcome:** Be prepared to tell the Board that the "popular" deworming renewal (Case A) is a "Pass" because the marginal dollar is better spent elsewhere. That is your value add as Program Officer.
