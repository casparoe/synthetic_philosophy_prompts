      *   *Pessimist Core:* Complexity favors obfuscation. $Cost(Confuse) < Cost(Verify)$. Intelligence amplifies this (better lying).
      *   *Shared Ground:* Debate helps *some*, but not all, domains. Human judges are bounded. We don't know the crossover point.
      *   *Taxonomy:* The user provided three buckets (Buried Error, Plausibility Cascade, Frame Capture). I should evaluate if they are good. They seem distinct and cover the main failure modes. I will keep them but define them precisely to avoid ambiguity.
