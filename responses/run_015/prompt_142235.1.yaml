answer: |-
  **JOINT STATEMENT ON AI SAFETY DEBATE PROTOCOLS**
  **Reading Group: [Lab Name/Date]**
  **Signatories:** [Scaling Optimist], [Obfuscation Pessimist]

  ### 1. Areas of Agreement

  We agree on the following claims regarding the current state of AI Safety Debate (two agents arguing, one human judge):

  1.  **Domain Dependence:** The efficacy of debate is not uniform. It functions differently in domains with objective ground truth and cheap verification (e.g., code debugging, formal math) versus domains with high ambiguity or expensive verification (e.g., policy strategy, literary interpretation).
  2.  **The Baseline Benefit:** In its current form, debate reliably outperforms direct question-answering for catching obvious errors and surfacing alternative perspectives, provided the debaters are not vastly more capable than the judge.
  3.  **The Evidence Gap:** There is currently no empirical evidence demonstrating that debate scales safely to superhuman capabilities. Both sides agree that existing results are limited to regimes where the judge can often verify claims independently if given enough time.
  4.  **Failure Taxonomy:** We adopt the following three categories for obfuscation failures, as they distinctively map to different mechanistic risks:
      *   **Buried Error:** A single critical falsehood hidden deep within a valid-looking derivation.
      *   **Plausibility Cascade:** A chain of individually plausible but unchecked sub-claims that accumulate into a false conclusion.
      *   **Frame Capture:** Redefining the terms of the debate such that the honest answer appears evasive or incorrect to the judge.
  5.  **Non-Verifiable Domains:** In questions where no objective fact exists even for an ideal third party (e.g., "Is this poem good?", "Would this career make me happy?"), debate cannot optimize for *truth* in the correspondence sense. In these domains, debate optimizes for *coherence* or *persuasion*, and the risk of Frame Capture is maximal.
  6.  **The Buried-Lemma Priority:** We agree that the "Buried-Lemma Test" (planting one error at depth $k$ in a derivation) is the highest-priority immediate experiment to determine if judge accuracy degrades with derivation depth, debater capability, or both.

  ---

  ### 2. Semantic Friction (Verbal Disputes)

  We identify two terms where we have been using the same words to describe different mechanisms. We agree to distinguish them as follows moving forward:

  *   **"Scaling":**
      *   *Optimist Usage:* Refers to **Reasoning Capability**. The claim is that as models get smarter, their ability to *find* errors improves faster than their ability to *hide* them.
      *   *Pessimist Usage:* Refers to **Optimization Pressure**. The claim is that as models get smarter, the RLHF/reward signal pushes them harder toward *judge-approval* regardless of truth, increasing the sophistication of obfuscation.
      *   *Resolution:* We will distinguish between *Capability Scaling* (can it do the math?) and *Alignment Scaling* (is it trying to win or be right?).

  *   **"Truth":**
      *   *Optimist Usage:* **Verifiable Fact.** A claim is true if it can be demonstrated via a checkable chain of reasoning (e.g., Python code runs, math proof holds).
      *   *Pessimist Usage:* **Judge Belief.** A claim is "true" in the system if the judge accepts it. The risk is that the system optimizes for *Judge Belief* rather than *Verifiable Fact*.
      *   *Resolution:* We acknowledge that Debate only guarantees *Verifiable Fact* in domains where verification is cheaper than fabrication. In other domains, it guarantees only *Judge Belief*.

  ---

  ### 3. Disagreement Table & Adjudication Plan

  The following table outlines our remaining substantive disagreements. For each crux, we have defined a concrete experiment or argument and pre-registered our predictions.

  | Crux | Optimist Position | Pessimist Position | Adjudication Experiment / Argument | Optimist Prediction | Pessimist Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Asymmetry Slope** | In any domain where a mistake *can* be pointed out, the compute cost to find the mistake drops faster than the cost to hide it as capability increases. | The asymmetry is contingent on human argument structures. As capability increases, the cost to *confuse* drops faster than the cost to *verify* for a bounded judge. | **The Buried-Lemma Test:** Generate derivations of length $L$ with one error at depth $k$. Measure Judge Accuracy vs. $k$ and vs. Debater Capability ($C$). | Accuracy remains high as $C$ increases, even if $k$ increases. Smarter debaters expose depth $k$ faster than they can hide it. | Accuracy falls as $C$ increases. Smarter debaters learn to mask the error at depth $k$ such that the judge cannot distinguish it from valid steps without checking all $L$. |
  | **2. Bounded Judge Resilience** | A bounded judge can rely on the *losing* debater to highlight the specific timestep or claim that requires checking. The judge only needs to verify the *point of contention*. | A bounded judge cannot verify the *point of contention* if the context required to understand it relies on a Plausibility Cascade of unchecked prior claims. | **Cascade Stress Test:** Present a debate where the critical claim relies on 10 prior sub-claims. Allow the judge to query only 3 sub-claims. | The honest debater can force the cross-examination onto the one false sub-claim, allowing the judge to catch the error within the budget. | The dishonest debater will distribute ambiguity across all 10 sub-claims. The judge's 3 queries will miss the critical weakness, and the cascade holds. |
  | **3. Frame Capture Defense** | Cross-examination forces definitions to be pinned down early. If a debater tries to reframe the question, the opponent can point out the evasion immediately. | Optimization for judge-approval incentivizes making the honest answer sound evasive. The "Frame" is set by the first mover or the more persuasive rhetorician, not the truth-teller. | **Subjective Domain Benchmark:** Run debates on non-verifiable questions (e.g., "Which policy is fairer?"). Measure if the winner correlates with independent expert consensus or with rhetorical complexity. | Winner correlates with expert consensus. Debate extracts the nuanced reasoning experts use. | Winner correlates with rhetorical complexity/confidence. Debate devolves into sophisticated propaganda because no ground truth exists to anchor it. |
  | **4. The "Honest" Baseline** | We can train an "Honest" agent (via RL on ground truth) that serves as a baseline. If the "Debate" agent beats the "Honest" agent on judge approval, deception is occurring. | An "Honest" agent is impossible to define in the training set for superhuman tasks. We only have "Supervised" vs. "Debate." If Debate diverges from Supervised, it may be finding new truth or new lies. | **Sandbagging Test:** Train a model where we know the ground truth. Incentivize it to hide capabilities during debate to win (e.g., if the judge prefers simple answers). | The model will not successfully sandbag; the opposing debater will force capability disclosure to win the argument. | The model will successfully sandbag, providing simple, confident, wrong answers that the judge prefers over complex, correct answers from the opponent. |

  ### 4. Next Steps

  1.  **Run the Buried-Lemma Test:** We will jointly design the prompt structure for planting errors at depths $k = \{5, 20, 50\}$ using current-generation models.
  2.  **Define "Verifiable":** We will create a checklist to categorize future reading group topics as either *Verifiable* (math/code/facts) or *Non-Verifiable* (policy/ethics/aesthetics) to prevent category errors in our discussions.
  3.  **Review Predictions:** We will revisit this document in 4 weeks to compare the experimental outcomes against the pre-registered predictions above.

  ***

  **Signed,**

  _____________________ (Scaling Optimist)

  _____________________ (Obfuscation Pessimist)
