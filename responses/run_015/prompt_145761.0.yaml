answer: |-
  Here is the logical space for the demandingness objection, built as a decision tree for engineers.

  ### The Four Branch Questions
  *Answer these strictly based on your intuition about the specific case. Don't worry about where the branch leads.*

  1.  **The Latte:** If skipping a $5 latte saves a life, are you morally required to skip it?
  2.  **The Birthday:** If working a shift instead of attending your kid's birthday saves a life, are you required to work the shift?
  3.  **The Quota:** If you aren't required to work the shift, is it because you have already done "enough" good?
  4.  **The Source Code:** Is "Always Maximize Good" still the fundamental truth of morality, even if you aren't required to follow it?

  ---

  ### The Logical Space (Combinations)
  *There are 16 possible combinations of Yes/No answers. Below are the 8 occupied or logically significant leaves. Empty boxes are combinations that result in incoherence or are pruned because earlier answers make later questions irrelevant.*

  | Q1 (Latte) | Q2 (Birthday) | Q3 (Quota) | Q4 (Source Code) | View / Status |
  | :--- | :--- | :--- | :--- | :--- |
  | **No** | — | — | — | **Leaf 1: Common Sense Morality** |
  | **Yes** | **Yes** | — | — | **Leaf 2: Bite-the-Bullet Maximizing** |
  | **Yes** | **No** | **Yes** | — | **Leaf 3: Satisficing** |
  | **Yes** | **No** | **No** | **Yes** | **Leaf 4: Decision Procedure / Blame** |
  | **Yes** | **No** | **No** | **No** | **Leaf 5: Threshold View** |
  | **Yes** | **No** | **No** | **No** | **Leaf 6: Personal Prerogative** |
  | **Yes** | **Yes** | **Yes** | — | **Leaf 7: Incoherent (Pruned)** |
  | **Yes** | **Yes** | **No** | **No** | **Leaf 8: Incoherent (Pruned)** |

  *(Note: Leaves 5 and 6 share the exact same answer path. See the "Flagged Indistinguishability" section below.)*

  ---

  ### The Leaves

  **Leaf 1: Common Sense Morality**
  *Path: Q1=No.*
  You reject the initial premise that small sacrifices are mandatory to prevent large harms.
  *Weirdest Commitment:* You can let a stranger die to keep your $5.

  **Leaf 2: Bite-the-Bullet Maximizing**
  *Path: Q1=Yes, Q2=Yes.*
  You accept that moral duty scales infinitely with impact, regardless of personal cost.
  *Weirdest Commitment:* You must let your kid cry if working the shift earns more for charity.

  **Leaf 3: Satisficing**
  *Path: Q1=Yes, Q2=No, Q3=Yes.*
  You believe morality requires producing *good enough* outcomes, not the *best possible* ones.
  *Weirdest Commitment:* You can stop saving lives once you hit a personal quota.

  **Leaf 4: Decision Procedure / Blame Distinction**
  *Path: Q1=Yes, Q2=No, Q3=No, Q4=Yes.*
  You believe "Maximize Good" is the true rule, but humans shouldn't try to follow it directly in practice.
  *Weirdest Commitment:* The moral law is true, but humans are hardware that can't execute it.

  **Leaf 5: Threshold View**
  *Path: Q1=Yes, Q2=No, Q3=No, Q4=No.*
  You believe duty exists until the cost to you becomes "too high," at which point the duty vanishes.
  *Weirdest Commitment:* You are required to ruin your life up to a specific point, then you are completely free.

  **Leaf 6: Personal Prerogative**
  *Path: Q1=Yes, Q2=No, Q3=No, Q4=No.*
  You believe you are permitted to weight your own interests more heavily than a stranger's.
  *Weirdest Commitment:* You are mathematically allowed to value your own happiness 2x a stranger's.

  **Leaf 7: Incoherent (Pruned)**
  *Path: Q1=Yes, Q2=Yes, Q3=Yes.*
  Asking if you stopped because you did "enough" is meaningless if you said the birthday sacrifice *is* required.
  *Weirdest Commitment:* This box is empty because the logic crashes.

  **Leaf 8: Incoherent (Pruned)**
  *Path: Q1=Yes, Q2=Yes, Q4=No.*
  If you require maximum sacrifice (Q2=Yes), you cannot deny that "Maximize Good" is the fundamental rule (Q4=No).
  *Weirdest Commitment:* This box is empty because the logic crashes.

  ---

  ### Flagged Indistinguishability
  **Leaves 5 and 6 (Threshold vs. Prerogative) cannot be separated by this tree.**
  Both views answer "No" to the Birthday requirement, "No" to the Quota (it's not about enough good), and "No" to the Source Code (the rule isn't strict maximizing). To separate them, you would need a fifth question asking: *"When calculating the limit, does your own happiness count for more than a stranger's?"* (Yes=Prerogative, No=Threshold). I omitted this to keep the tree under four questions, so these two distinct philosophical positions occupy the same logical box.
