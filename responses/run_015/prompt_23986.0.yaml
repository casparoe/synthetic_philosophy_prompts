answer: |-
  ### 1. The Dependency Claim

  Quine's initial maneuver is to demonstrate that the analytic-synthetic distinction is not a foundational boundary capable of grounding epistemology, but rather a node within a cluster of mutually defining intensional notions. The argument presupposes that for the distinction to do the philosophical work assigned to it by empiricists (namely, to separate truths grounded in language from truths grounded in fact), "analyticity" must be explicable in terms that are clearer than the notion of the *a priori* it is meant to illuminate.

  Quine observes that standard definitions of analyticity invariably appeal to modal or epistemic proxies. To say a statement is analytic is typically to say it is "true by virtue of meaning," "true come what may," or "necessarily true." Quine argues that these proxies are not independent explicata. Specifically, the notion of "necessity" employed here is not a logical operator defined within a formal system, but a metaphysical or epistemological status. When pressed, the claim that a sentence is "necessarily true" cashes out as the claim that it is knowable *a priori*—that its justification does not depend on sensory experience.

  The dependency claim functions as follows:
  1.  **Premise:** To define "analytic," one must appeal to "synonymy," "necessity," or "semantic rule."
  2.  **Premise:** To define "necessity" in this context is to appeal to "a priority" (independence from experience).
  3.  **Observation:** Empiricism aims to explain the *a priori* (or eliminate it) by reducing it to the analytic (truths of language).
  4.  **Conclusion:** If analyticity itself can only be defined by appealing to necessity or *a priority*, the project is circular.

  The prompt mentions the "a posteriori impossibility of a sentence's being false." Quine's point here is diagnostic of the empiricist's dilemma. If one insists on a rigorous empiricism that admits no *a priori* faculties, then any claim about the "impossibility" of a sentence's falsehood must itself be an empirical generalization about linguistic behavior (an *a posteriori* fact about how speakers use words). However, analyticity is traditionally conceived as providing a guarantee stronger than mere empirical invariance—it claims *normative* immunity from revision. Quine argues that you cannot have it both ways. If you ground analyticity in empirical facts about language use, it loses its modal force (it becomes contingent that we use words this way). If you ground it in modal force (necessity), you have presupposed the *a priori* distinction you sought to explain. Thus, the distinction is parasitic: it borrows its intelligibility from the very modal/epistemic notions it was supposed to clarify.

  **Presupposition:** This step presupposes that a philosophically robust distinction must be explicable in terms clearer than the *explanandum*. It also presupposes that the intensional notions (meaning, necessity, *a priority*) form a closed conceptual loop with no external anchor in behaviorist or extensional terms.

  ### 2. The Regress

  Having established the dependency of analyticity on intensional notions, Quine proceeds to demonstrate that attempts to break the circle by defining analyticity via synonymy fail. The argument is structured as a *reductio* of the available definitions of synonymy.

  **Step 1: Analyticity as Substitution.**
  A common definition holds that a statement is analytic if it can be transformed into a logical truth by substituting synonyms for synonyms (e.g., "No bachelor is married" becomes "No unmarried man is married").
  *Presupposition:* This presupposes that "synonymy" is a clearer, antecedently understood relation than "analyticity."

  **Step 2: Synonymy as Interchangeability.**
  To define synonymy, one might appeal to interchangeability *salva veritate* (preservation of truth). Two expressions are synonymous if they can be swapped in any context without changing the truth value of the sentence.
  *Presupposition:* This presupposes that truth-preservation is a sufficient condition for sameness of meaning.

  **Step 3: The Extensional Objection.**
  Quine rejects this criterion because it fails in extensional contexts. "Creature with a heart" and "creature with kidneys" are co-extensive (interchangeable *salva veritate* in all actual instances), yet they are not synonymous. The truth of the interchangeability is a matter of contingent fact, not meaning.
  *Work done:* This eliminates extensional equivalence as a basis for synonymy.

  **Step 4: The Intensional Fix and Circularity.**
  To fix this, one must strengthen the criterion: expressions are synonymous if they are interchangeable *salva veritate* in all contexts, *including modal contexts* (e.g., "Necessarily, all creatures with hearts are creatures with hearts").
  *Presupposition:* This presupposes the intelligibility of the modal operator "necessarily."
  *The Regress:* By invoking "necessarily," we have reintroduced the very notion of analyticity/necessity we were trying to define. We are defining synonymy via necessity, and necessity via synonymy/analyticity. The circle is closed.

  **Step 5: Appeal to Meaning or Convention.**
  One might attempt to bypass this by appealing directly to "meanings" as entities or to "semantic conventions." Quine argues this does not break the circle. To posit "meanings" is to posit entities individuated by synonymy; to say two terms have the same meaning is just to say they are synonymous. Similarly, appealing to "convention" merely pushes the question back: which sentences are true by convention? Those we agree to hold true come what may. But this returns us to a behavioral description (which sentences we *do* hold true) rather than a normative distinction (which sentences we *must* hold true).
  *Work done:* This demonstrates that no available explication of synonymy is more intelligible than analyticity itself. All candidates presuppose the intensional cluster they were meant to ground.

  ### 3. The Confirmation Story

  The second dogma of empiricism is reductionism: the belief that each meaningful statement is equivalent to some logical construct upon terms that refer to immediate experience. Quine replaces this with confirmation holism. This shift undermines the analytic-synthetic distinction by altering the unit of empirical significance.

  **The Argument Structure:**
  1.  **Premise (Holism):** Our statements about the external world face the tribunal of sense experience not individually but only as a corporate body (a theory or web of belief).
  2.  **Premise (Underdetermination):** Any statement can be held true come what may, if we make drastic enough adjustments elsewhere in the system. Conversely, any statement can be revised, even a logical law, if the pragmatic cost of retaining it becomes too high.
  3.  **Implication:** The truth value of any given sentence is not fixed by its meaning plus a specific set of experiences. It is fixed by its role in the total system and the system's total fit with experience.

  **Impact on the Boundary:**
  If any statement can be revised in the face of recalcitrant experience, there is no class of statements that are *in principle* immune to revision. The traditional analytic-synthetic distinction posits a class of sentences (analytic) whose falsehood is impossible because their truth is secured by meaning alone. Quine's holism suggests that what we call "analytic" sentences are simply those located near the center of the web.

  **The Status of Logic and Mathematics:**
  The theorems of logic and mathematics are not true by virtue of a special "logical meaning" distinct from "factual meaning." They are true because they are maximally entrenched. To revise a logical law (e.g., the law of excluded middle) would require massive revisions across the entire web of scientific theory, causing maximal "mutilation" of the system. We retain them for pragmatic reasons of simplicity and conservatism, not because they are insulated from experience by their semantic structure.
  *Presupposition:* This step presupposes a pragmatic theory of theory-choice. It assumes that the decision to revise a sentence is governed by principles of minimal mutilation and overall systemic coherence, rather than by a prior classification of sentences into "empirical" and "conceptual."

  **Why this matters:** If the immunity of logical truths is a matter of degree (centrality) rather than kind (semantic insulation), the analytic-synthetic distinction collapses into a distinction between the very central and the very peripheral. There is no boundary line, only a gradient of reluctance to revise.

  ### 4. The Weakened Residue

  Quine does not deny that there is a difference between sentences like "2 + 2 = 4" and "There is a cat on the mat." He denies that this difference maps onto the metaphysical or epistemological boundary traditionally drawn by the analytic-synthetic distinction.

  **The Defensible Version:**
  A weakened, defensible version of the distinction remains, but it is purely pragmatic and descriptive. We can distinguish sentences based on their **degree of entrenchment** or **centrality** within the web of belief.
  *   **Analytic-like sentences:** Those we are extremely reluctant to revise.
  *   **Synthetic-like sentences:** Those we are willing to revise readily upon sensory stimulation.

  **What Must Be Given Up:**
  To accept this weakened residue, one must surrender three key features of the traditional distinction:
  1.  **Immunity in Principle:** One must admit that logical and mathematical truths are not *necessarily* true. They are revisable in principle, should the pragmatic benefits of a non-classical logic outweigh the costs of revision (e.g., in quantum mechanics).
  2.  **Lack of Empirical Content:** One must admit that "analytic" sentences do have empirical content, in the sense that they contribute to the prediction of experience as part of the total theory. They are not empty tautologies detached from the world; they are structural pillars of our world-theory.
  3.  **Normative Force:** The distinction loses its power to justify knowledge. One cannot appeal to analyticity to show that certain knowledge is secure against skeptical doubt arising from experience. The security is merely psychological and sociological (shared linguistic practice), not logical or metaphysical.

  **Presupposition:** This conclusion presupposes a naturalized epistemology where the norms of inquiry are continuous with empirical science. It assumes that there is no "first philosophy" standing outside the web of belief to legislate which sentences are true by meaning. The distinction becomes a matter of describing how we *do* use language, not prescribing how we *must* understand truth.
