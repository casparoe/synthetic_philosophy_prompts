answer: |-
  This is a fantastic question, and your "unit testing" analogy is actually a really sharp way to frame the problem. You've hit on one of the most technical and heated debates in classical Indian philosophy.

  First, a quick correction on the lineup, because it changes the stakes: **Classical Nyāya actually argues *against* *anupalabdhi* being a separate *pramāṇa*.** They typically stick to the big four (Perception, Inference, Comparison, Testimony). It is primarily the **Bhāṭṭa Mīmāṃsā** school (think Kumārila Bhaṭṭa) that fights hard for *anupalabdhi* as a distinct fifth *pramāṇa*. Nyāya thinkers (like Udayana) spend a lot of energy trying to prove that *anupalabdhi* is just Inference (*anumāna*) wearing a hat.

  So the debate isn't inside Nyāya so much as it is Nyāya vs. Mīmāṃsā. But your core question remains: **Is knowing "nothing is there" a unique cognitive event, or is it just a calculation?**

  Here is where the machinery actually breaks down.

  ### 1. Epistemic vs. Ontological: Where is the knot?
  You asked if the issue is ontological (is absence real?) or epistemic (do we need a new tool?). The answer is **both, but the epistemic drive pulls the ontological string.**

  *   **Ontology:** For Nyāya-Vaiśeṣika, absence (*abhāva*) is eventually accepted as a real category of existence (*padārtha*). "The cup is not on the desk" describes a real state of affairs.
  *   **Epistemology:** The fight is about how we access that reality.
      *   **Nyāya (Inference View):** We know the absence via inference.
      *   **Mīmāṃsā (Non-Perception View):** We know the absence via a direct, irreducible cognition.

  If absence is real (ontology), does it require a unique sensor (epistemology)? Mīmāṃsā says yes. Nyāya says no, our existing sensors (perception + inference) can handle it.

  ### 2. The Inference Objection (The Nyāya Position)
  Nyāya argues that *anupalabdhi* fits perfectly into the standard inference model (*anumāna*), so positing a new *pramāṇa* violates parsimony (like adding a microservice when a function call would do).

  For Nyāya, knowing the cup is absent looks like this:
  1.  **Proposition (*pratijñā*):** There is no cup on the desk.
  2.  **Reason (*hetu*):** Because I do not perceive it (despite conditions being ripe for perception).
  3.  **Universal Connection (*vyāpti*):** Wherever a perceivable object is not perceived, it is absent.

  **The "Unit Test" Fix:**
  Your worry about unit tests ("passing doesn't prove no bugs") is addressed by the condition of **yogyatā** (fitness/capability).
  Nyāya says you can only use non-perception to prove absence if the object *would definitely be perceived if it were there*.
  *   **Valid:** "There is no cup on the desk" (Cups are visible, lights are on, eyes are open).
  *   **Invalid:** "There is no ghost in the room" (Ghosts are not perceivable by definition).

  So, for Nyāya, the "test suite" only proves no bugs if the suite has 100% coverage of the relevant code. If the conditions for perception are met and the perception doesn't fire, the absence is inferred.

  ### 3. The Mīmāṃsā Counter (The "Hat" Argument)
  Mīmāṃsā philosophers argue that reducing this to inference is clunky. They say the Nyāya model requires a "middle term" (*hetu*) linking the reason to the conclusion. But in non-perception, **there is no middle term.**

  When you look at the desk and see no cup, you aren't reasoning: *"I don't see it, therefore it's gone."*
  You simply cognize the absence directly. The "not seeing" *is* the "knowing."

  *   **The Mechanism:** They argue that cognition is self-revealing. If I expect a cup and don't see it, the *failure* of the perception generates a positive cognition of absence. It's not a deduction; it's an immediate intuition of the negative.
  *   **Why it matters:** If it were inference, it would be prone to error in a way that direct perception isn't. Mīmāṃsā wants to secure negative knowledge as foundational, not derivative.

  ### 4. The *Sannikarṣa* Problem (Contact with Nothing)
  This is your sharpest technical objection. Nyāya realism demands *sannikarṣa* (contact) between the sense organ and the object for perception to occur. **How do your eyes touch "nothing"?**

  If *anupalabdhi* is a form of perception (or quasi-perception), what is the sense contacting?

  **The Nyāya Solution:**
  They argue you *are* making contact, just not with the absent object. You are contacting the **locus** (*adhikaraṇa*).
  *   Your eyes contact the desk.
  *   The desk possesses a quality: "cup-absence."
  *   Therefore, by contacting the desk, you perceive the absence qualified by the desk.

  Think of it like a `null` pointer in a strongly typed system. The pointer isn't pointing to an object, but the memory address (the locus) is real, and the value `null` is a valid state of that address. You aren't touching the missing object; you are touching the container that holds the "missing" state.

  **The Mīmāṃsā Solution:**
  They bite the bullet. They say absence is a distinct reality that can be apprehended without standard sense-contact. Some even argue that the *mind* (*manas*) directly apprehends the absence without the eyes needing to "touch" it in the physical sense.

  ### 5. So, is it a separate *Pramāṇa*?
  The consensus in later Indian logic (Navya-Nyāya) tended to side with **Nyāya**: *anupalabdhi* is reducible to inference.

  Why? Because the "conditions for perception" requirement makes it look exactly like an inference rule.
  *   **Input:** Locus (desk) + Condition (light, eyes) + Non-perception.
  *   **Logic:** If Present $\rightarrow$ Perceived. Not Perceived $\rightarrow$ Not Present. (Modus Tollens).

  Since it follows a logical rule dependent on a universal connection (*vyāpti*), it fits the definition of Inference (*anumāna*). Making it a separate *pramāṇa* would be like creating a new HTTP verb for `HEAD` requests when `GET` without a body already covers it.

  ### Summary of the Machinery
  1.  **Ontological Status:** Absence (*abhāva*) is real (both schools mostly agree).
  2.  **Epistemic Mechanism:**
      *   **Nyāya:** It's **Inference**. You reason from "non-perception" to "absence" based on the rule that perceivable things must be seen if present.
      *   **Mīmāṃsā:** It's **Non-Perception**. The cognition of absence is immediate and sui generis; it doesn't rely on a logical middle term.
  3.  **The Contact Issue:** Nyāya solves this by saying you contact the *locus* (the desk), which holds the absence as a property.
  4.  **Your Dev Analogy:**
      *   **Nyāya:** It's like a liveness check. If the service is up (conditions met) and the health endpoint returns 404 (non-perception), you infer the resource is gone (absence). It's a logical deduction.
      *   **Mīmāṃsā:** It's like the system throwing a specific `NoSuchElementException`. The exception itself *is* the knowledge; you don't need to run a logic check to interpret the exception.

  The "knot" you're feeling is the tension between **parsimony** (Nyāya: don't multiply entities without need) and **phenomenology** (Mīmāṃsā: but it *feels* different to see nothing than to reason about nothing). Nyāya wins on logic; Mīmāṃsā wins on the description of experience.
