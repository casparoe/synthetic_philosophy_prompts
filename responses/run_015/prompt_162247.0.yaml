answer: |-
  This document establishes the standard operating procedure for the modeling team to evaluate fairness constraints on the biweekly risk score revision. The goal of this procedure is to produce a recommendation that is mathematically sound, legally defensible, and explainable to the oversight board within a four-hour window. Because we lack formal training in fairness literature and operate under strict legal prohibitions against collecting race data, this procedure prioritizes transparency about uncertainty over the enforcement of complex statistical guarantees that rely on assumptions we cannot verify. The procedure begins with a data validity check. Since state law forbids collecting race or ethnicity, we cannot measure fairness directly across racial groups. Instead, we must use ZIP code-based socioeconomic deprivation as a proxy group definition. The first question the team must answer is whether the revised model maintains predictive stability across these geographic proxies. An adequate answer requires a simple table showing the average predicted risk versus the observed outcome rate for each deprivation quintile among the released population. If the model systematically overestimates risk for high-deprivation ZIP codes compared to low-deprivation ZIP codes at the same score level, the model is miscalibrated. We commit to calibration as our primary fairness criterion because a risk score claims to estimate a probability, and if that probability means different things for different groups, the score itself is scientifically invalid regardless of where thresholds are set. If the model fails this calibration check, the revision is rejected and sent back for retraining, as no threshold adjustment can fix a score that lies about risk levels.

  Once calibration is confirmed, the team moves to the threshold question. We have three decision tiers: release, supervised release, and detention hearing. The second question is whether the requested fairness criterion can be satisfied simultaneously with calibration using the available thresholds. This is the point where the procedure stops and reports that the criterion is not satisfiable if the math forbids it. For example, if we are asked to equalize false-positive rates across groups, we must calculate whether a single set of thresholds can achieve both calibration and equal error rates. In most real-world distributions where base rates differ across groups, satisfying both calibration and equal false-positive rates is mathematically impossible without changing the model itself. If the team discovers this incompatibility during the half-day review, the procedure dictates that we report the conflict to the board rather than attempting to force a solution. We do not hide the trade-off. We state plainly that equalizing false-positive rates would require different risk thresholds for different groups, which violates our commitment to calibration and creates a system where the same risk score leads to different decisions based on geography. The procedure requires us to recommend maintaining calibration and letting error rates vary, as this preserves the integrity of the risk number published to judges.

  The third step addresses the impact of the fairness constraint on the group it is intended to protect. The team must simulate the detention rates under the proposed thresholds. The specific question is whether enforcing the fairness criterion increases the overall detention rate for the high-deprivation group compared to the current baseline. If the answer is yes, the procedure reaches its limit regarding technical analysis and must stop and hand the decision to the board. This is a value judgment, not a mathematical one. A model can be perfectly calibrated and mathematically fair by some definitions while still resulting in more people from disadvantaged areas being held for detention hearings. The analysts are not authorized to weigh the moral cost of increased detention against the moral cost of fairness metrics. Therefore, if the protective criterion raises detention rates for the protected group, the output to the board must explicitly state that the fairness goal conflicts with the liberty goal. The recommendation will be to present the board with two options: the current model with lower detention but higher metric disparity, or the revised model with higher detention but lower metric disparity. The board must vote on which harm to prioritize. This handoff point is critical because it prevents analysts from making policy decisions under the guise of technical tuning.

  To illustrate how this procedure functions in practice, consider the first situation where we are asked to equalize false-positive rates across groups. Under this procedure, the team runs the calibration check first. Assuming the model is calibrated, the team then tests if equal false-positive rates are possible. Given that base rates of arrest often differ by neighborhood due to policing patterns rather than underlying behavior, the math will likely show that equalizing false-positive rates requires lowering the detention threshold for the high-deprivation group. This would mean detaining people with lower risk scores in that group compared to others. The procedure identifies this as a conflict with calibration and a potential increase in detention for that group. The team reports that the criterion is not satisfiable alongside calibration and liberty interests, and the issue is handed to the board as a value choice between metric parity and individual risk assessment. In the second situation, we are asked to make the score mean the same thing across groups at all three tiers. This is a request for calibration. The procedure accepts this as the default standard. The team verifies the calibration plots. If the lines align, the criterion is satisfied. The team then checks the thresholds to ensure they are consistent. Since this aligns with our committed criterion, the team approves the revision provided the detention rates do not spike for the protected group. If they do spike, it triggers the value handoff described previously. In the third situation, we discover that the only criterion satisfiable given our labels raises detention rates for the group it was meant to protect. This triggers the immediate stop condition for technical analysis. The procedure dictates that we do not optimize for the metric at the cost of liberty. We document the increase in detention rates and present the trade-off to the board. We do not recommend the revision unless the board explicitly accepts the higher detention rate as the cost of fairness.

  Finally, the procedure requires a plain statement of what it cannot do, to be included in every public report. We cannot correct for the fact that outcomes are only observed for released defendants. The detained group has no labels, so we do not know if they would have been arrested had they been released. This means our fairness metrics are calculated on a biased sample of people judges already deemed safe enough to release. We cannot fix this with statistics alone in a half-day window. We also cannot measure racial fairness directly because we do not collect race data. Using ZIP code as a proxy captures economic segregation but misses racial disparities within neighborhoods and across the county. We cannot guarantee that a model fair by ZIP code is fair by race. Furthermore, we cannot resolve the conflict between group fairness and individual liberty. If making the groups look equal on paper requires holding more people from a specific neighborhood, our procedure identifies that cost but does not pay it. That payment requires a democratic decision by the oversight board. The modeling team provides the map of the trade-offs, but the board must choose the destination. This limitation is not a failure of the team but a boundary of the tool. The risk score is a measurement instrument, not a policy maker. By adhering to this procedure, we ensure that we do not mistake our technical constraints for moral solutions, and we provide the board with the clear, distinct choices they are elected to make.
