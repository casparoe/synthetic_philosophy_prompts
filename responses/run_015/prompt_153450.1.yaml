answer: |-
  ### Specification Requirements for a Theory of Radical Message Design

  The following requirements define the necessary conditions for a theory of meaning location capable of guiding the construction of artifacts for receivers with whom we share no language, conventions, or prior contact. The theory must be constructive (guiding design) rather than merely descriptive (classifying post-hoc).

  **1. The Frame Threshold Requirement**
  *   **Case:** Contested framing (ornament vs. writing).
  *   **Argument:** If a theory cannot distinguish a message from a non-message without appealing to receiver consensus, it fails the "shared nothing" constraint. A receiver encountering a surface of marks must be able to determine, via the marks themselves, that they constitute a Frame (i.e., "I am a message") rather than natural texture or decoration. The theory must specify the physical or structural properties that trigger the "message hypothesis" in a generic intelligence.
  *   **Status:** **Non-negotiable.** Without this, the artifact remains inert matter.

  **2. The Outer Completeness Requirement**
  *   **Case:** The unassisted artifact vs. one requiring external aid.
  *   **Argument:** In a "shared nothing" scenario, no external key exists. Therefore, the theory must mandate that the Outer Message (decoding instructions) contains all non-universal rules required to process the Inner Message. It cannot rely on cultural context. However, it may rely on universal physics (e.g., prime numbers, hydrogen spin). The theory must verdict on whether an artifact lacking explicit decoding instructions can constitute a message; for design purposes, it must assert that such an artifact is a failed message.
  *   **Status:** **Non-negotiable.** A design theory cannot permit reliance on unavailable external context.

  **3. The Fidelity Requirement**
  *   **Case:** Receiver recovers coherent content sender never put there.
  *   **Argument:** If meaning is located solely in the receiver, a hallucinated message is indistinguishable from a successful transmission. A constructive theory must provide a metric for fidelity between the sender's state and the receiver's state. It must allow us to label the reception a "failure" even if the receiver is satisfied, otherwise, the concept of *design* collapses into *luck*.
  *   **Status:** **Non-negotiable.** Design implies intent; without fidelity, there is no engineering.

  **4. The Verification (Canary) Requirement**
  *   **Case:** Fragments used to confirm decoding correctness (checksums, known plaintext).
  *   **Argument:** The three-way distinction (Frame, Outer, Inner) is insufficient if it cannot locate verification data. A checksum is not content (Inner), nor is it a decoding rule (Outer); it is a meta-statement about the relationship between the two. The theory must either expand the taxonomy to include a Verification layer or rigorously define it as a subset of the Outer message that validates the Inner.
  *   **Status:** **Preference of the Engineering Camp.** (Semioticians may argue verification is part of the Inner content; engineers argue it is structural).

  **5. The Recursion Termination Requirement**
  *   **Case:** Recursive decoding (instructions for a decoder for a further message).
  *   **Argument:** If a message contains instructions to build a device that reads a second message, which contains instructions for a third, the theory must define where the "message" begins and ends. Does the first artifact contain the second message, or merely the *potential* for it? The theory must specify a bottom layer (a physical base) where decoding stops and reality begins, otherwise, meaning is infinitely deferred.
  *   **Status:** **Non-negotiable.** Infinite regress prevents completion of the decoding act.

  **6. The Intentionality Exclusion Requirement**
  *   **Case:** Signals with no sender (tree rings, cosmic background).
  *   **Argument:** A theory of *message design* must distinguish between information-bearing structures and messages. Tree rings carry data but are not messages. The theory is permitted (and required) to exclude non-intentional structures from the category of "message," even if they are decodable. To include them conflates physics with communication.
  *   **Status:** **Preference of the Sender-Centric Camp.** (Receiver-centric theories often treat any informative signal as a message).

  **7. The Adversarial Integrity Requirement**
  *   **Case:** Hostile framing (traps that damage the receiver).
  *   **Argument:** If the distinction between Frame, Outer, and Inner dissolves when the "Outer" instructions induce harm (e.g., "build this device" results in an explosion), the theory is fragile. The theory must remain descriptive and structural even when the pragmatic outcome is injury. The "message" status must not depend on the benevolence of the outcome.
  *   **Status:** **Non-negotiable.** A theory of structure must hold regardless of ethical valence.

  **8. The Universal Physics Grounding Requirement**
  *   **Case:** Receivers with whom we share nothing.
  *   **Argument:** Since no conventions are shared, the Outer Message cannot rely on syntax or semantics. It must rely on isomorphisms with universal physical laws (mathematics, chemistry, physics). The theory must require that the decoding apparatus be derivable from universal constants rather than local conventions.
  *   **Status:** **Non-negotiable.** This is the definition of the "shared nothing" constraint.

  **9. The Receiver Agency Requirement**
  *   **Case:** The apparatus the artifact does not contain.
  *   **Argument:** The artifact cannot contain the receiver. The theory must specify the minimum cognitive or physical agency the receiver must possess *a priori*. If the theory demands the artifact supply *all* meaning, it requires a receiver with zero capacity, which is impossible. The theory must delineate the boundary between what the artifact supplies and what the receiver must bring (e.g., logic, perception).
  *   **Status:** **Non-negotiable.** Communication is a dyadic process; the theory cannot model only one half.

  **10. The Noise Distinction Requirement**
  *   **Case:** Decoding failure vs. message absence.
  *   **Argument:** A receiver may fail to decode due to damage (noise) or because the object is not a message. The theory must provide criteria to distinguish a corrupted Frame from a non-Frame. Without this, a designer cannot assess the robustness of the artifact against entropy.
  *   **Status:** **Non-negotiable.** Essential for error correction and artifact durability.

  **11. The Temporal Stability Requirement**
  *   **Case:** Long-duration messages (interstellar/archival).
  *   **Argument:** The decoding instructions (Outer) must remain valid for as long as the content (Inner) is preserved. If the physical medium degrades such that the Outer message becomes unreadable before the Inner, the message fails. The theory must treat time as a variable in the location of meaning.
  *   **Status:** **Preference of the Archival Camp.** (Ephemeral communication theories may ignore this).

  **12. The Completion Signal Requirement**
  *   **Case:** Knowing when the message ends.
  *   **Argument:** In a stream of data, the receiver must know when the Inner Message is complete. Without a termination condition, the receiver cannot distinguish the end of the message from silence or noise. The theory must mandate a structural marker for completion.
  *   **Status:** **Non-negotiable.** Required for finite processing.

  ***

  ### 1. Inconsistency Analysis

  **Incompatible Pair:** **Requirement 2 (Outer Completeness)** and **Requirement 9 (Receiver Agency)**.

  *   **The Conflict:** Requirement 2 demands that the artifact carry all non-universal decoding instructions (implying the artifact alone suffices, given physics). Requirement 9 acknowledges that the artifact cannot contain the receiver, meaning the receiver must bring *some* apparatus (cognitive or physical) not contained in the artifact.
  *   **The Tension:** If we insist meaning is recoverable from the artifact *alone* (strong reading of Req 2), we violate Req 9, because a receiver with *no* apparatus cannot decode anything. If we insist the receiver must bring apparatus (Req 9), we violate the strong reading of Req 2, because the meaning is not in the artifact alone, but in the artifact *plus* the receiver's pre-existing capacity.
  *   **Resolution:** **Requirement 2 must yield.** It should be amended to: "The artifact must contain all *conventional* decoding instructions, relying only on universal physics and minimum generic agency." A theory cannot demand the artifact contain the receiver's mind. The inconsistency arises if Req 2 is interpreted as "total self-sufficiency." It must be interpreted as "self-sufficiency relative to universal laws."

  ### 2. The Exclusionary Requirement and Scorecard

  **Most Exclusionary Requirement:** **Requirement 3 (The Fidelity Requirement).**

  This requirement demands that the theory distinguish between *intended* meaning and *recovered* coherence. This excludes any theory that locates meaning solely in the receiver's interpretation or solely in the physical pattern without reference to a sender's state.

  | Theory Family | Score against Req 3 (Fidelity) | Brief Analysis |
  | :--- | :--- | :--- |
  | **Message-Centric (Formalism)** | **Pass** | Locates meaning in the structure. Can define fidelity as structural isomorphism. However, struggles to distinguish "complex noise" from "encoded content" without a sender reference. |
  | **Sender-Centric (Intentionalism)** | **Pass** | Locates meaning in intent. Easily defines fidelity (match to intent). **Fails** the "Shared Nothing" constraint (Req 8) because intent is invisible to a receiver with no prior contact. |
  | **Receiver-Centric (Pragmatism)** | **Fail** | Locates meaning in use/interpretation. Cannot call a hallucination a "failure" if the receiver acts successfully on it. Collapses the distinction between discovery and invention. |

  ### 3. Metaphysical Flags

  **Requirement 6 (Intentionality Exclusion)** is a metaphysical commitment dressed as a constraint.
  *   **The Commitment:** It assumes **Realism** regarding communication: that a "message" is a distinct ontological category requiring an agent, rather than a functional relationship between any structure and an interpreter.
  *   **The Disguise:** It presents this as a design constraint ("we are designing messages"), but it effectively rules out **Pansemiotics** (the view that nature is full of signs) by fiat. A receiver-centric theory would argue that if the receiver treats tree rings as a message, they *are* a message. Req 6 forbids this, enforcing a Sender-Required metaphysics under the guise of engineering precision.

  **Requirement 1 (Frame Threshold)** also carries a hidden commitment.
  *   **The Commitment:** It assumes **Objectivity** regarding the Frame. It presumes there is a fact of the matter about whether an object is a message prior to interpretation.
  *   **The Disguise:** It frames this as a detection problem, but it rejects the **Constructivist** view that the Frame is created by the act of interpretation, not discovered in the object. By demanding the artifact *supply* the Frame, the requirement presupposes meaning is a property of the object, not the event.
