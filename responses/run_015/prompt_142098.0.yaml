answer: |-
  Here is a complete design for the 90-minute session. It is built to be run with minimal props but high psychological fidelity to the "orphaned default" dynamic.

  ### Activity Title: The Legacy Protocol

  **Core Concept:** Students operate under a "Standard Operating Procedure" for the class session that was justified by a previous cohort's needs. Initially, it serves them well (validating Libertarian Paternalism). Mid-session, their needs shift, but the procedure remains sticky, invisible, and audited by no one (validating the Orphaned Default critique).

  **Stakes:** Control over the final 20 minutes of the 90-minute session.
  *   **Option A (The Default):** *Instructor-Led Synthesis.* The instructor summarizes key arguments. (High value for conceptual clarity, low value for application).
  *   **Option B (The Opt-Out):** *Student Work Session.* Students use the time to start their upcoming assignment with peer support. (High value for application, low value for synthesis).

  **Materials Needed:**
  1.  **Projected Slide 1:** "Today's Agenda" (Lists the final 20 mins as "Instructor-Led Synthesis").
  2.  **Handout A:** "Course Logistics & Protocols" (Given at the door). Contains the opt-out clause buried in Section 4.
  3.  **Handout B:** "Assignment Brief" (Distributed at Minute 60).
  4.  **Opt-Out Form:** Physical slips of paper available at the back of the room.

  ---

  ### Run-of-Show (90 Minutes)

  #### Phase 1: The Benefit (Minutes 0–15)
  **Goal:** Establish the default as helpful and consensual ("As judged by themselves").

  *   **Action:** As students enter, hand them **Handout A**. Project **Slide 1**.
  *   **Instructor Script:** "Welcome. To maximize our efficiency today, we are following the Department's Standard Agenda. You'll see the breakdown on the screen. This protocol was designed based on feedback from the last two cohorts who reported feeling lost without a structured summary at the end. Please review Handout A for logistics."
  *   **The Trap:** Handout A, Section 4, Paragraph 2 reads: *"Students may petition to convert the final Synthesis block into a Work Session by submitting a Physical Opt-Out Form to the instructor before Minute 60. After Minute 60, the Standard Agenda locks to ensure room scheduling compliance."*
  *   **Student Experience:** Most will glance at the Agenda, see the "Synthesis" block, and think, *"That makes sense. I usually leave class confused. This helps me."* They feel the benefit of reduced decision fatigue. The default aligns with their current state (fresh, focused on theory).
  *   **Crucial Move:** Do not highlight the opt-out clause. If asked, say, "Yes, there's a petition process in the handout if you need it, but most find the Standard works best."

  #### Phase 2: The Drift (Minutes 15–60)
  **Goal:** Normal seminar discussion. Let them forget the Agenda.

  *   **Action:** Run the seminar normally. Discuss paternalism, nudging, Thaler/Sunstein.
  *   **Invisibility:** Do not mention the time allocation again. Let the "Synthesis" block become an invisible background fact, like a room temperature setting.
  *   **Observation:** Watch who goes to the back to get an Opt-Out Form. (Likely no one, because the default currently seems reasonable).

  #### Phase 3: The Orphaning (Minute 60)
  **Goal:** Shift preferences so the default no longer serves "themselves."

  *   **Action:** Distribute **Handout B (Assignment Brief)**.
  *   **The Shock:** The Brief states: *"Your Policy Memo is due 8:00 AM tomorrow. It requires a practical application of today's theory. Grading rubric prioritizes application over conceptual summary. In-class peer review is strongly recommended."*
  *   **Instructor Script:** "Ah, looking at the clock, we have 20 minutes left. As per the Standard Agenda, I will now begin the Instructor-Led Synthesis. Please put away your drafts and listen."
  *   **Student Experience:** Panic/Realization. They *need* the Work Session (Option B) to succeed on the assignment. The Default (Option A) is now actively harmful to their goals.
  *   **The Audit Attempt:** Students will raise hands. "Can we switch to work time?"
  *   **Instructor Response (The Asymmetry):** "I check the clock... it is Minute 62. The petition window closed at Minute 60 per Handout A. Additionally, the Standard Agenda is filed with the Department. To change it now, I would need to file a 'Deviation Request' which takes 48 hours to process. We must proceed with Synthesis."

  #### Phase 4: The Debrief (Minutes 75–90)
  **Goal:** Map the frustration to the theoretical concepts.

  *   **Transition:** Stop the activity. Acknowledge the frustration. "We are now debriefing the activity we just lived through."
  *   **Discussion Questions:**
      1.  "At Minute 10, did the default feel paternalistic? Did it feel permissible?" (Elicits the LP Defense).
      2.  "At Minute 65, did your judgment of the default change? Did *you* change, or did the *default* change?" (Elicits the Orphaning).
      3.  "Who was responsible for checking if the default still fit?" (Elicits Auditing Asymmetry).

  ---

  ### Debrief Mapping Guide

  Use this to steer the conversation from their feelings to the theory.

  | Moment in Activity | Theoretical Concept | Key Question to Ask |
  | :--- | :--- | :--- |
  | **Minute 10 Acceptance** | **(a) As-Judged-by-Themselves** | "When you accepted the agenda at the start, did you feel coerced? No. You judged that 'Synthesis' was good for you. The nudge was aligned with your own ends. This is the Libertarian-Paternalist sweet spot." |
  | **Minute 65 Frustration** | **(b) The Orphaned Default** | "Why did the 'as-judged-by-themselves' test fail at the end? You still judged it. But the default was no longer responding to *your* judgment. It was responding to the 2023 Cohort's judgment. The default became orphaned from the actual people it governed." |
  | **Minute 60 Deadline** | **(c) Auditing Asymmetry** | "Setting the default took me 5 minutes before class. Changing it required a 48-hour bureaucratic waiver. Why is the cost of reversal so much higher than the cost of initiation? Who has the job of auditing old defaults?" |

  ---

  ### Predictable Failure Points (And Fixes)

  **1. The "Rebellion" Failure**
  *   **What happens:** A savvy student reads Handout A at Minute 5 and rallies the class to fill out Opt-Out forms immediately.
  *   **Why:** The invisibility failed.
  *   **Fix:** If this happens, *let it happen*. It proves the point about visibility. In the debrief, ask: "Why did you have to work so hard to find that clause? If you hadn't read Section 4, where would you be?" This highlights that the "benefit" of the default relies on the *invisibility* of the alternative.

  **2. The "Low Stakes" Failure**
  *   **What happens:** Students don't care about the last 20 minutes. They treat it as a game.
  *   **Why:** The Assignment Brief (Handout B) feels fake.
  *   **Fix:** Make the Assignment Brief real. Actually require them to submit a 1-paragraph outline at the end of class *or* tomorrow morning. If they feel genuine time pressure, the default becomes oppressive.

  **3. The "Instructor Breaks Character" Failure**
  *   **What happens:** You smile or wink when enforcing the deadline, signaling "I'm doing this on purpose."
  *   **Why:** It ruins the feeling of systemic inertia.
  *   **Fix:** You must appear *bound* by the protocol yourself. Act slightly regretful but helpless. "I know, I'd love to let you work, but the system locks at 60." The friction must feel bureaucratic, not personal.

  ---

  ### Limitations: What This Activity Cannot Do

  Be frank with yourself (and the class) about where the simulation ends.

  1.  **It Cannot Simulate Long-Term Inertia:**
      *   *Limitation:* In the activity, the "orphaning" happens in 60 minutes. In reality, orphaned defaults (like pension enrolment rates) persist for decades.
      *   *What you must state:* "In our game, you noticed the mismatch in one hour. In public policy, the mismatch might last 20 years because no one has a 'Minute 60' revelation. The invisibility is permanent, not temporary."

  2.  **It Cannot Simulate True Invisibility:**
      *   *Limitation:* Because this is a seminar, they are looking for the lesson. They are hyper-aware of choice architecture.
      *   *What you must state:* "You were watching for the nudge. In the real world, you are watching for your bus, or your paycheck. You never see the default. You only feel the friction."

  3.  **It Cannot Produce the "Auditor":**
      *   *Limitation:* The activity ends with the default *staying* in place. You cannot simulate the successful audit within the game because the game *is* the trap.
      *   *What you must state:* "We stopped at the frustration. The ethical work begins where we stopped: Who is paid to check the Handout A's every five years? If no one is, the orphan remains."

  ### Final Instructor Note
  To ensure the Libertarian-Paternalist defense lands before it crumbles, you must be convincing in Phase 1. If you sound apologetic about the Agenda at the start, they will treat it as suspicious. You must present the Default as **benevolent efficiency**. Only when their needs shift does the benevolence reveal itself as bureaucracy. This trajectory is essential for them to feel the specific tragedy of the *orphaned* default, rather than just a *bad* default.
