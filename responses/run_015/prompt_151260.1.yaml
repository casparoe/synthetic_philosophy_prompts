answer: |-
  **Scenario**
  Dr. Aris Thorne serves as the Incumbent Director of the "Centenary Care Trust," a healthcare institution he founded twenty years ago by ratifying a Constitutional Charter that mandates all endowment funds be invested exclusively in low-yield ethical bonds to ensure intergenerational equity, explicitly forbidding high-return market instruments. The Charter establishes the Director not as an owner but as a *fiduciary vessel* whose authority is constituted solely by adherence to the Charter's terms, creating a nested institutional role distinct from Thorne's private identity. Now, fully rational and psychologically intact, Thorne's values have genuinely shifted from "procedural integrity" to "consequentialist maximization," leading him to believe that violating the investment ban would save more lives immediately; however, the Charter's "Procedural Lockout" clause removes his standing to waive the rule based on substantive outcomes, asserting that the validity of the constraint derives from the initial ratification procedure rather than future endorsement.

  **Verdicts and Philosophical Labor**
  On the **Constitutional-Precommitment View**, Thorne must adhere to the Charter. Because the "Nested Institutional Role" feature establishes the *Office of the Director* as the primary moral agent rather than Thorne the private individual, the normative force resides in the institutional continuity established at ratification. The "Procedural Lockout" functions as an external constraint that persists independently of Thorne's current motivations; to violate it is to dissolve the Office itself, which is normatively prohibited regardless of the beneficial consequences. Conversely, on the **Internal-Reasons View** (à la Bernard Williams), Thorne is permitted (or required) to break the Charter. Since reasons must ground in the agent's current "subjective motivational set," and Thorne's current set prioritizes saving lives over procedural integrity, there is no internal reason for him to comply. The past ratification provides no normative "grip" unless he currently desires to honor it, which he does not.

  The specific structural feature performing the philosophical labor is the **Nested Institutional Role (Office vs. Person)**. If this feature is removed—meaning Thorne acts merely as a private donor managing his own money—the disagreement collapses. In a private capacity, the Constitutional-Precommitment View typically concedes that an individual retains the sovereignty to revise their own life plans upon rational value shifts (as there is no distinct "Office" to maintain), and the Internal-Reasons View obviously permits the shift. Thus, both theories would deliver the same verdict (permissibility of change) in the absence of the institutional distinction; the "Office" feature is the sole wedge allowing the Constitutionalist to posit an external constraint that the Internalist must deny.

  **Internal-Reasons Attack**
  A defender of the Internal-Reasons View would attack the construction by challenging the ontological status of the "Office." They would argue that the "Nested Institutional Role" is a fiction; institutions do not act, only people do. Therefore, the "Procedural Lockout" is merely a psychological state of Thorne's past self attempting to manipulate his present self. Since Thorne's current motivational set does not include a desire to sustain the fiction of the Office over actual human lives, the "external constraint" is illusory. They would argue that by framing the role as distinct from the person, the Constitutionalist is smuggling in a "view from nowhere" that fails to connect to any actual agent's reasons for action.

  **Confidence and Uncertainty**
  I am highly confident (90%) that this scenario successfully isolates the dispute regarding the source of normativity (past procedure vs. present psychology) within a realistic institutional setting. However, I am least sure (60% confidence) about the claim that removing the "Nested Institutional Role" feature causes the Constitutional-Precommitment View to *fully* collapse into agreement with the Internalist. A staunch Constitutionalist might argue that even a private self-ratification creates a binding normative structure independent of the "Office" distinction, meaning the disagreement might persist even in the private case, which would weaken the isolating function of the structural feature.
