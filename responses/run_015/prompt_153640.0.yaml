      *   *Defeater 3: The Identity/Continuity Problem (Metaphysical).* If the AI spins up 1 million copies, is that 1 million beings or 1 process? *Decisiveness:* Medium.
      *   *Defeater 4: Reflective Equilibrium/Coherence (Normative).* If the theory demands human extinction, maybe the theory is wrong (Rawlsian objection). *Decisiveness:* Low for a hard-headed utilitarian, High for a moderate.
      *   *Defeater 5: Stability/Instrumental Convergence (Game Theoretic).* An AI that eats everyone might be shut down. But the user asks about *moral requirement*, not feasibility. Still, if the system can't exist, the moral claim is moot. *Decisiveness:* Low for the moral claim, High for practical relevance.

  5.  **Addressing the Unfalsifiability Concern:**

