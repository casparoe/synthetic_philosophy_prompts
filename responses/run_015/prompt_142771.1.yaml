answer: |-
  # Workshop Design: The "Liability Auction"

  ## 1. The Game Design
  **Name:** The Liability Auction
  **Time Allocation:** 20 Minutes (Game) + 45 Minutes (Debrief) + 25 Minutes (Intro/Outro)
  **Participants:** 12 Grad Students
  **Stakes:** One $25 Coffee/Book Gift Card (Prize). Real Cash (Bids).

  ### The Setup
  Do not mention "sunk cost," "escalation," or "game theory" in the intro. Frame this as a "Resource Allocation Simulation."

  1.  **The Prize:** Place a $25 Gift Card visibly on the table.
  2.  **The Endowment:** Hand each student five $1 bills (or ask them to have $5 cash ready). Tell them: *"This is your operating budget. You keep whatever you don't spend."*
  3.  **The Rules (Read Exactly):**
      *   "We are auctioning the $25 Gift Card."
      *   "Bids must be in $1 increments."
      *   "The **Highest Bidder** wins the Gift Card and pays their bid."
      *   "The **Second-Highest Bidder** pays their bid to me (the instructor) and receives nothing."
      *   "All other bidders pay nothing."
      *   "Bidding is open outcry. You can jump in at any time."
  4.  **The Observer Task:** The 10 students not currently bidding are not idle. Assign them roles: *"Track the bid history on the whiteboard. Note the body language of the bidders. Note exactly when the bid exceeds $25."*

  ### Why This Design?
  For 12 grad students, complexity is the enemy. If you add teams, multiple rounds, or ambiguous scoring, they will debate the *rules* rather than feel the *pressure*. This is the "Dollar Auction" in its purest form. It is the correct choice because:
  1.  **Isolation of Variable:** It isolates the sunk cost mechanism (the second-place penalty) without confounding factors like team politics or ambiguous success metrics.
  2.  **Visceral Stakes:** Points feel like a game; cash feels like loss. Grad students are risk-averse regarding money. Using physical cash on the table creates immediate loss aversion.
  3.  **Observer Engagement:** With only 12 people, a single auction risks boring the 10 non-bidders. By giving them data-collection roles, they become analysts of the pathology, which primes them for the debrief.

  ---

  ## 2. Facilitation Notes (Running the Game)
  *   **Start Low:** If bidding is slow, start the bidding yourself at $1 to break the ice, then step back.
  *   **Neutrality:** Do not smile, do not frown. You are the market, not a participant.
  *   **The Trap Trigger:** The game truly begins when the bid hits $25. Before this, it's a normal auction. After this, it is a loss-minimization game.
  *   **Circuit Breaker:** If bidding reaches $50 (2x the prize value), stop the game immediately. Say: *"We are stopping here. The lesson has been learned."* Collect the money from the top two bidders. Do not let them bankrupt themselves; the goal is pedagogy, not profit.
  *   **Collusion Check:** If students try to talk to each other ("Let's both stop at $5"), forbid it. *"No communication during bidding. This is a non-cooperative environment."* Real escalation often happens in silos.

  ---

  ## 3. The Debrief (45 Minutes)
  Do not lecture immediately. Let the discomfort sit for 30 seconds after the gavel falls.

  ### Part A: The Autopsy (15 Mins)
  Draw the bid history on the board. Ask the two final bidders to stand. Walk through the timeline.

  *   **Question 1 (The Rational Phase):** "Up to $24, this was a rational transaction. You were buying $25 for less than $25. At what specific dollar amount did the goal shift from *making money* to *not losing money*?"
      *   *Likely Answer:* Usually around $26 or $27.
  *   **Question 2 (The Logic Check):** "Bidder A, when you were at $28 and Bidder B bid $29, you had already lost $28. Why bid $30?"
      *   *Target Insight:* They will say, "If I bid $30 and win, I only lose $5 net ($30 bid - $25 prize). If I quit, I lose $28."
      *   *Label It:* Write **"Loss Minimization vs. Value Creation"** on the board.
  *   **Question 3 (The Opponent):** "Did you bid because you wanted the card, or because you wanted to punish the other person?"
      *   *Target Insight:* Escalation often becomes vindictive.

  ### Part B: Predictable Failure Points (10 Mins)
  Be frank about what usually goes wrong when you run this, so they know you aren't manipulating the outcome.

  1.  **The "Freeze" (No Bidding):** Sometimes, grad students are too skeptical. They spot the trap immediately and no one bids.
      *   *Fix:* If no one bids by $3, seed the auction. *"I'll bid $1."* Then step out. You need one sucker to start the engine.
  2.  **The Collusion:** They might agree to split the prize.
      *   *Fix:* As noted in rules, ban communication. In the real world, this maps to "siloed departments" who can't talk to each other during a crisis.
  3.  **The "Rich Player":** One student has more cash and bulldozes the room.
      *   *Fix:* Remind them the budget is capped at the $5 endowment. If they run out, they are out. This mirrors real-world budget constraints.

  ### Part C: What This Game Cannot Reproduce (15 Mins)
  This is the most critical part for grad students. They will poke holes in the simulation. Acknowledge them.

  *   **Time Compression:** "In this game, escalation happened in 5 minutes. In your dissertations or research, escalation happens over 5 years. The pain is slower, which makes it harder to detect."
  *   **Ambiguity:** "Here, the rules were clear. In real life, you don't know exactly how much you've spent (sunk costs are often hidden) or what the prize is actually worth (the 'gift card' value changes)."
  *   **Reputation:** "In this game, losing $10 is embarrassing. In your careers, abandoning a project can be career-ending. The 'second-place penalty' in real life is often reputational ruin, not just cash."
  *   **Agency:** "Here, you chose to bid. In organizations, you are often handed a project that is already failing. You are inheriting the sunk cost, not creating it."

  ### Part D: Closing the Loop (5 Mins)
  Ask the observers: *"What did you see in the bidders' body language that they didn't feel themselves?"*
  (Usually: Shoulders slumping, voices getting tighter, staring at the money rather than the prize).

  **Final Takeaway:** "Escalation isn't stupidity. It is rational logic applied to a broken framework. The only way to win is to recognize the framework before you put the first dollar on the table."

  ---

  ## 4. Why This Works for *This* Group
  Grad students are trained to optimize. This game breaks optimization. By forcing the "Second-Highest Bidder Pays" rule, you remove the safety net of "at least I didn't win."

  Using cash is non-negotiable for the "feel." If you use points, they will treat it as a game. If they put their own $1 bills on the table, the physiological stress response activates. That stress is the data point. When they feel their heart rate go up at bid $26, they have internalized the concept of escalation better than any slide deck could teach them.

  The small group size (12) is actually an advantage. It creates an intimate "fishbowl" effect. The bidders are performing for their peers, adding a layer of social pressure that mimics the "audience costs" of real-world leadership escalation. Use that.
