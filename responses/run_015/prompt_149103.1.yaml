answer: |-
  Cheers for the message. No worries about the typos — I've written plenty of essays between lectures that looked like they'd been typed with boxing gloves on, so I know the feeling.

  You've hit on precisely why the qualia debate is the philosophical equivalent of a stuck record. It's the hard problem's annoying cousin that won't leave the party. Let's have a proper look at your "Reverse Mary" twist and where your group is actually getting stuck.

  ### 1. The "Reverse Mary" Thought Experiment
  Your variation is fascinating — it's basically Molyneux's Problem (can a blind man who gains sight distinguish a cube from a sphere?) mixed with Jackson's Knowledge Argument, but applied across modalities (vision vs. smell).

  Does her confusion prove qualia are incoherent? I'd argue **no**. It mostly proves they're modality-locked.
  The inability to compare olfactory qualia to visual qualia intersubjectively (or even intrasubjectively, in her case) doesn't necessarily mean the properties don't exist; it just means they lack a common currency. Think of it like trying to compare the "weight" of a sound to the "colour" of a number. Unless you're a synaesthete, there's no framework for it.

  However, the Dennett crowd would pounce here. They'd say: if there's no way to calibrate these experiences, no way to verify if "smell-A" is "like" "vision-B", then positing a "property" there is doing no work. It's a free-floating label. But the Realist side would counter that the *feeling* of confusion is itself a phenomenological fact. She knows she can't compare them. That knowledge is grounded in something real, even if it's private.

  So, Reverse Mary doesn't kill qualia; she just highlights that **privacy isn't incoherence**. It shows that intersubjective calibration is a requirement for *science*, but maybe not for *existence*.

  ### 2. The Stalemate: Semantics vs. Ontology
  You hit the nail on the head here: **the two sides are answering different questions.**

  *   **The Dennett/Chase & Sanborn side** is playing a semantic and logical game. They're saying: "Your definition of qualia (ineffable, intrinsic, private, directly apprehensible) is logically inconsistent. If you strip away the functional roles, there's nothing left." (Side note: you might be misremembering Chase & Sanborn slightly — they're usually cited as *sceptics* who argue there's no fact of the matter about whether qualia change, which actually supports Dennett. But your group's use of them as "epistemic privacy" defenders is a common enough reading in undergrad circles).
  *   **The Realist side** is playing an ontological game. They're saying: "Regardless of whether I can describe it or compare it, there is *something it is like* to be me. You can't argue away the raw feel."

  The hidden empirical assumption you asked about? It's about **what counts as a "property"**.
  *   Realists assume properties can be **intrinsic** (existing in and of themselves, independent of relations).
  *   Dennett and functionalists assume properties must be **relational/dispositional** (defined by what they do, how they interact with inputs/outputs/other states).

  If you assume properties must be functional, qualia vanish. If you assume properties can be intrinsic, qualia survive. Neither side can "prove" their assumption without begging the question. That's why you're going in circles.

  ### 3. What Counts as Progress?
  Honestly? Don't hold your breath for a formal model of phenomenal comparison. If qualia are defined as non-functional (as many realists insist), you can't model them formally without changing the definition.

  Here's what I reckon would actually move the needle for your group:

  1.  **Stop trying to prove existence/non-existence.** Accept that this is a clash of intuitions. The progress comes in **dissolving the confusion**. Show that Dennett isn't saying "you don't feel pain," he's saying "the theoretical baggage you're attaching to 'pain' (the qualia label) is junk."
  2.  **Sharpen the Epistemic/Ontological Distinction.** Make a rule for the group: when someone makes a claim, label it. Is this about what we can *know* (epistemic) or what *is* (ontological)? Often, the Knowledge Argument (Mary) is treated as ontological proof, when it might just be about concept acquisition.
  3.  **Consider Illusionism.** This is the modern move (Keith Frankish, etc.). It suggests qualia are a user-illusion created by the brain. It accepts the Realist's intuition ("it feels real") but agrees with Dennett's ontology ("it's not a real property"). It might be the compromise bridge you need.

  ### Verdict
  Your "Reverse Mary" shows that qualia are modality-locked, not necessarily incoherent. The stalemate exists because you're fighting over the definition of "property" without realising it.

  My advice? Don't try to solve it this term. Acknowledge the impasse, map the positions clearly (Functionalism vs. Phenomenal Realism), and maybe read some Keith Frankish or Philip Goff to see how the debate has shifted since Dennett's original "Quining Qualia" paper. Sometimes progress is just realising why the question is so bloody difficult.

  Good luck with the rest of the term. Hope the coffee tastes the same tomorrow as it does today, whatever that actually means.

  Cheers.
