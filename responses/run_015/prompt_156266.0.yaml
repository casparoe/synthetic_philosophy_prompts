answer: |-
  You have put your finger on one of the most persistent, unexamined category errors in historiography and archaeology. Your intuition is correct: the word "collapse" is doing heavy lifting that is simultaneously descriptive, evaluative, and political. It is not a neutral scientific term; it is a metaphor imported from structural engineering and medicine (something standing upright suddenly falling down; a body suddenly failing) and applied to social systems in a way that obscures more than it reveals.

  Here is the breakdown of the implicit theory behind the practice of labeling things "collapses," what it commits us to, and how we would have to rewrite history if we dropped it.

  ### 1. The Implicit Theory: What is the "Unit of Collapse"?

  When a historian says "The Maya Collapsed," but acknowledges millions of Maya survive, they are committing to a specific definition of what a "society" is. They are not talking about the *people* (demographics), the *culture* (language/religion), or even the *settlement* (habitation).

  **The Commitment:** The "Society" is synonymous with the **State Apparatus** or the **Elite Extraction Mechanism**.

  In this implicit theory, a society is defined by its ability to concentrate surplus energy, monumentality, literacy, and long-distance trade. These are all functions of a centralized hierarchy.
  *   **Rome 476:** The imperial administration in the West stopped functioning. The people remained. The economy localized. But the *State* ended.
  *   **Maya 900 CE:** The divine kings stopped erecting stelae. The monumental construction stopped. The trade networks fractured. The *State* ended. The farmers remained.
  *   **France 1958:** The government changed, but the State (bureaucracy, tax collection, monopoly on violence, borders) remained continuous. Therefore, no collapse.
  *   **Russia 1917:** This is the tricky one. Some *do* call it a collapse (of the Empire), but because it was immediately replaced by another high-complexity State (the USSR) with similar borders and extraction capabilities, it is usually filed as "Revolution."

  **The Theory:** "Collapse" is the sudden failure of **complexity** and **centralization**, not the failure of a people. It presupposes that the "top" of the pyramid is the defining feature of the pyramid, rather than the base.

  ### 2. The Evaluative Load: Complexity = Good

  You asked if the word is descriptive or evaluative. It is overwhelmingly evaluative. It relies on a **Teleological Theory of History**.

  This theory assumes that human history has a direction: toward greater complexity, urbanization, statehood, and literacy. This is the "Ladder of Progress" model.
  *   If a society moves *up* the ladder, it is "Development," "Civilization," or "State Formation."
  *   If a society moves *down* the ladder, it is "Collapse," "Decline," or "Dark Age."
  *   If a society moves *sideways* (changing regimes but keeping complexity), it is "Transition" or "Dynastic Change."

  **The Commitment:** By using the word "collapse," we commit to the idea that losing writing, cities, and long-distance trade is inherently a *loss* of human welfare.

  This is why your test case is so devastating to the standard model.
  *   **Test Case:** A society empties cities, gives up writing/trade, keeps language/religion, and ends up healthier with longer lifespans.
  *   **Standard Archaeological Verdict:** **Collapse.** (Loss of complexity markers).
  *   **Bio-archaeological Verdict:** **Improvement.** (Reduction in zoonotic disease, reduction in famine risk from crop failure, reduction in elite extraction of calories).

  If we stick with the word "collapse" for this scenario, we are admitting that we value **monuments over metabolisms**. We are saying the *system* mattered more than the *organisms* living in it.

  ### 3. The Temporal Bias: Event vs. Process

  You noted the discrepancy between 30 years (collapse) and 300 years (transformation). This reveals a **Catastrophist Theory of Change**.

  History is often written as a series of punctuated equilibria. We look for "tipping points."
  *   **Why?** Because it makes for better narratives and cleaner periodization. "The Bronze Age" is easier to teach than "The Gradual Decentralization of Eastern Mediterranean Polities."
  *   **The Commitment:** This presupposes that social systems are brittle structures that snap, rather than fluid processes that ebb. It ignores the fact that "collapse" is often a strategic choice by populations.

  James C. Scott, in *Against the Grain*, argues that early states were fragile and unpopular. People often fled them. When a state "collapses," it often means the population successfully dispersed to escape tax and conscription. Calling this "collapse" frames it as a tragedy of the state, rather than a liberation of the populace.

  ### 4. The Colonial/Modernist Gaze

  There is a geopolitical inconsistency you pointed out: Western nation-states don't "collapse"; they "fall" (Berlin Wall) or "dissolve" (USSR). Non-Western or Ancient states "collapse."

  *   **The Commitment:** "Collapse" is something that happens to *objects* of study, not *subjects* of history.
  *   When the Soviet Union dissolved, we were in conversation with its successors. When the Maya "collapsed," they were silent (in the archival sense).
  *   Using "collapse" allows modern institutions to treat the remnants as "ruins" to be managed, rather than "homes" that were rearranged. It creates an ontological gap between "The Ancient Maya" (who collapsed) and "The Modern Maya" (who negotiate repatriation). It allows museums to say, "We are preserving the legacy of a lost civilization," while ignoring the living civilization next door.

  ### 5. What Would We Have to Rewrite?

  If we dropped the idea that a society is the kind of thing that can "end" at a datable moment, we would have to rewrite the implicit theory of social ontology.

  **A. Replace "Collapse" with "Reorganization" or "Decentralization"**
  We would have to describe the *mechanism* rather than the *judgment*.
  *   *Instead of:* "The Bronze Age Collapse."
  *   *Write:* "The Late Bronze Age Political Fragmentation and Trade Network Contraction."
  *   *Instead of:* "The Maya Collapse."
  *   *Write:* "The Terminal Classic Shift from Divine Kingship to Localized Authority."

  **B. Shift the Unit of Analysis from State to Population**
  We would have to track well-being (height, dental health, trauma, lifespan) rather than complexity (monument size, script usage).
  *   In your test case, this would not be a collapse. It would be a **successful adaptation**. The "cost" of maintaining the state (in calories and labor) exceeded the "benefit" (security/trade), so the population rationally abandoned the state form.

  **C. Acknowledge Continuity as the Default**
  We would have to treat the survival of language, kinship, and local practice as the primary historical narrative, and the rise and fall of elites as secondary ephemera.
  *   Egypt didn't collapse four times; Egypt persisted through four changes of imperial management. The "Pharaonic State" ended, but "Egypt" did not.

  **D. Accept that "Ending" is a Political Claim**
  We would have to admit that declaring a society "ended" is often a power move.
  *   If I say the Maya collapsed, I can claim their artifacts are "ownerless" heritage of humanity.
  *   If I say the Maya transformed, I must acknowledge the living descendants have sovereignty over those artifacts.
  *   The "Collapse" narrative serves the institution that holds the bones.

  ### Summary of the Implicit Theory

  The practice of dating and labeling "collapses" commits us to three specific theoretical positions:

  1.  **Statism:** The State is the proxy for the Society. If the government stops governing, the society has ended.
  2.  **Complexity Bias:** Social complexity (writing, cities, trade) is the metric of success, regardless of human well-being.
  3.  **Discontinuity:** History is made of breaks and endings, rather than flows and transformations.

  **To answer your test case directly:**
  If a society empties its cities, gives up writing, keeps its language/religion, and gets healthier:
  *   **Under the current implicit theory:** It is a **Collapse**. (The State and Complexity ended).
  *   **What ended:** The **Extraction Hierarchy**. The ability of a specific group to concentrate surplus labor and wealth ended.
  *   **Under a revised theory:** It is a **Decentralization** or **Emancipation**. The population opted out of a high-cost political experiment.

  The word "collapse" bugs you because it is a **zombie concept**. It describes a dead thing (the State) but implies the death of a living thing (the People). It treats the cage as the bird. Dropping it would require us to stop writing history as a graveyard of civilizations and start writing it as a history of how humans arrange and rearrange their lives.
