  1. **Brainstorming Benthamite Considerations**

  *   **Primary vs. Secondary Mischief:** Distinguishes direct harm to victims (primary) from alarm/danger to the community (secondary). **Keep:** Essential for distinguishing private acts from public nuisances.
  *   **Pains of Antipathy:** Displeasure taken in the mere thought of an act by non-participants. **Keep for Column A/B; Discard for Column C:** Central to the user's method of isolating extrinsic mischief.
  *   **Consent and Coercion:** Volition compromised by force, threat, or material dependency. **Keep:** Core determinant of primary mischief in Columns B and C.
  *   **Deception and Expectation:** Violation of reasonable expectations undermines trust and future security. **Keep:** Crucial for Cases C, D, H.
  *   **Offences Against Oneself:** Harm limited to the agent. **Keep:** Relevant for Case F, though Bentham generally limits legal interference here.
  *   **Religious/Supernatural Sanctions:** Pain derived from fear of divine punishment or sin. **Discard:** Bentham treats these as bogus grounds for legislation.
  *   **"Unnaturalness":** Violation of a supposed natural order. **Discard:** Rejected by Bentham as devoid of empirical mischief.
  *   **Institutional Erosion:** Harm to conventions (e.g., marriage) without immediate identifiable victims. **Keep/Discard:** Keep only if it leads to tangible secondary mischief; discard if purely abstract (Case I).
  *   **Publicity and Witnessing:** Non-consensual exposure to sexual acts. **Keep:** Generates primary mischief via nuisance/offence in Column C.
  *   **The Scoring Device:** The three-column method isolates variables (law, antipathy) to test the residual principle. **Not Question-Begging:** It is a valid controlled variation to determine the source of mischief, provided Column C is strictly defined as the removal of antipathy pains.

