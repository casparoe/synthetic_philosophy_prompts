      *   *Self-Correction on "Closet Emergentist":* If they hold (3), (4), and (5), they are forced into a constitutive view. If they can't explain constitution without emergence, they are emergentists. But the real tell is (6). If structure alone suffices for experience (6), then the intrinsic nature (3) is causally/ontologically idle regarding the *type* of experience. That makes (3) epiphenomenal. That's worse than emergentism; that's redundancy.

      *   *Re-evaluating (6):* "built out of whatever substrate." This is the phrase that kills the position. A silicon chip functional duplicate, under standard panpsychism, does *not* have experience because silicon lacks the right proto-experience (or has none). If the professor says it *does*, they are a functionalist, not a panpsychist.
