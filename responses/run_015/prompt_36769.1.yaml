      *   If they change (4) to "Phenomenal Unity is real, Subject Unity is derived," they might dodge the Subject Summing problem.

      *   *Let's look at the "Closet Emergentist" charge:* If they claim macro-experience is determined by structure (6) but micro-experience is intrinsic (3), and they deny emergence (5)... how does the macro arise? If structure *does the work*, that's functionalism. If intrinsic nature *does the work*, that's panpsychism. You can't have both fully.
