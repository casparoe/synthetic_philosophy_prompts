          *   *Alternative:* Maybe the user is a *Priority Monist* (Cosmopsychist)? If the universe is the only subject (4 is modified), then (3) and (5) work better. But (4) says "one subject here," implying human subjects.
          *   *Best Revision:* Modify (6). Restrict functionalism to substrates that share the relevant intrinsic nature. Or, admit that (6) is only true *ceteris paribus* regarding the intrinsic base.
          *   *Actually, the most brutal truth:* (6) contradicts (1). If (1) is true (structure doesn't explain experience), then (6) (structure determines experience) cannot be fully true.
          *   *Wait, nuance:* (1) says structure doesn't explain *why there is experience*. (6) says structure determines *which* experience. That's compatible. *However*, if the substrate changes (in (6)), the intrinsic nature changes. If intrinsic nature is experience (3), then changing substrate changes experience. So (6) is false.
