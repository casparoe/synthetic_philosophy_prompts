      *   *Claim 6 (Macro Functionalism):* Functional duplicates share experiences. (This seems to rely on structure determining experience, which clashes with 1 & 3).

      *   *Core Conflict:* The **Combination Problem** (How do micro-experiences become macro-experiences?) vs. **Anti-Emergence** vs. **Unity**.
      *   *Secondary Conflict:* **Panpsychism (Intrinsic)** vs. **Functionalism (Structural)**.

  3.  **Evaluate Specific Tensions:**

      *   **Tension A: (3) + (4) + (5) = The Hard Combination Problem.**
          *   If micro-experiences exist (3), and macro-subjects are real (4), but strong emergence is false (5), how do the micro-subjects combine into a macro-subject without emergent ontology?
          *   *Severity:* Critical. This is the classic Goff/Roelofs/Russellian battleground. If you deny emergence, you need a constitutive account. If you say micro-subjects *are* the macro-subject, you face the subject summing problem (how do many subjects become one?). If you say micro-experiences constitute the macro-experience without subjects summing, you risk denying (4) or sliding into emergentism.
      *   **Tension B: (3) + (6) = The Intrinsic/Structural Clash.**
          *   (3) says experience depends on *intrinsic* nature (phenomenal properties of electrons).
