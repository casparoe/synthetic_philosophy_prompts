      *   *Is *this specific* grief maladaptive?* Annie died at 10. Investment was already high. The grief crushed Darwin. It didn't help Annie. It arguably hindered his work temporarily. But evolution doesn't care about *post-mortem* utility. It cares about the *drive* that kept her alive until then.
