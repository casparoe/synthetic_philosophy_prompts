answer: |-
  Good evening. Looking around this room, I realize I am speaking to two distinct audiences. Half of you know exactly what happens at the final node of a finite extensive-form game. The other half are wondering why your philosopher relatives are staring at their wine glasses as if calculating odds. I intend to speak to both of you, because Dr. Miriam Chen's career demands it.

  To understand what Miriam achieved, we must look at the structure of her work through the lens of the Centipede Game. Imagine two players facing a pot of resources. They take turns. Each player can either "take" the pot, ending the game and keeping the larger share, or "pass" it to the other player. Passing increases the total value of the pot for both, but it risks the other player taking it all on the next turn.

  Standard rational choice theory tells us how this ends. If the game has a fixed endpoint, logic dictates you should reason backward from the finish. At the last turn, the rational player takes. Knowing this, the player before them takes. This unraveling continues all the way to the start. The only rational outcome is to defect immediately. Cooperation should never begin.

  For forty years, Miriam played this game. But she was not playing for money; she was playing for institutions. Every joint program, every shared governance structure, every cross-departmental grant was a "pass." At any point, a department could have defected. They could have hoarded budget lines, protected tenure slots, or retreated into disciplinary silos. The rational payoff for any single actor, at any single moment, was to capture the resources and end the cooperation. By the strict logic of backward induction, the School of Interdisciplinary Studies should never have survived its first proposal.

  Yet, here we are. The institutions stand.

  Now, the easy speech—the one I will not give—would claim that Miriam succeeded because she was "kind," or that she relied on "trust" to overcome rational selfishness. The economists in the room would wince, because trust does not solve the backward induction paradox in a finite game. The family in the room would hear something vague. Neither honors the precision of her work.

  Miriam did not solve the paradox by ignoring rationality. She solved it by refusing to accept the game tree as fixed.

  In the standard model, the endpoint is exogenous. It is written in stone before the first move. Miriam's genius was treating the endpoint as endogenous. She understood that every time she chose to "pass," every time she chose cooperation, she was not just moving to the next node; she was rewriting the payoffs for the node after that.

  When she built a joint hiring committee, she didn't just move the pot down the line. She altered the value of defection. She made the cost of taking higher and the value of passing greater for the next player. She grafted new branches onto the decision tree. By the time a partner reached a point where defection was theoretically optimal, Miriam had already reshaped the structure so that defection yielded less than continued cooperation.

  She did not sustain cooperation by hoping people wouldn't defect. She sustained it by designing a sequence where the rational choice at every new node was to keep building. She made the horizon recede. In her career, the terminal node was never fixed; it was a function of her previous moves.

  This is why we cannot call her irrational. Irrationality implies a mistake in calculation. Miriam's calculation was superior. She recognized that in institutional design, the rules are not constants; they are variables. She navigated a landscape where the logic of backward induction fails not because the players are flawed, but because the tree itself is alive.

  So, to the philosophers and economists: Miriam did not violate the constraints of rational choice. She expanded the domain in which rationality operates. She showed us that if you want to reach the end of the centipede game without unraveling the pot, you must ensure the game never ends on the terms you were given.

  And to the family and students: She built bridges that held because she reinforced the foundation with every step she took across them.

  Miriam, you taught us that the future is not a fixed point we reason back from. It is a structure we build as we walk. You rewrote the tree. You changed the payoffs. You made cooperation the only rational path forward.

  Please raise your glasses. To Dr. Miriam Chen: who knew that the best way to win the game was to change the rules before anyone else realized they were playing. To Miriam.
