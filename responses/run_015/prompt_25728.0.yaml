  The two leading theories consistent with her seven verdicts are **Epistemicism** and **Supervaluationism**. Both reject the sorites premise (2), affirm sharp boundaries in some sense (3), accept the unknowability of those boundaries (4), and validate the Law of Excluded Middle (5). They also accommodate higher-order vagueness (7). Degree theories are ruled out by her acceptance of (3) and (5).

  These two diverge sharply on bivalence. Epistemicists (e.g., Williamson) argue borderline statements are classically true or false; our ignorance is purely epistemic. Thus, they answer "yes" to the Smith case. Supervaluationists (e.g., Fine, Kamp) argue borderline statements are indeterminate—neither true nor false—because their truth varies across admissible precisifications. However, since "Smith is bald or not bald" holds on all precisifications, LEM remains true even though bivalence fails. Thus, they answer "no" to the Smith case.

  Given her linguistics background, Supervaluationism is the probable allegiance; linguists typically favor semantic over metaphysical explanations of vagueness. She likely treats (3) as *supertrue* rather than metaphysically robust.

  If the Smith case proves ambiguous (e.g., she distinguishes "true" from "supertrue"), ask: **"Is the boundary in (3) a fact of the world, or a feature of our semantic precision?"** Epistemicists must say the former; Supervaluationists the latter. This cleanly separates metaphysical ignorance from semantic indeterminacy. Alternatively, press her on whether "Smith is bald" is *assertible*. Supervaluationists typically deny assertibility for borderline claims despite their logical validity in disjunctions; Epistemicists allow assertibility only if one knows the truth-value.
