prompt: |-
  I'm building a system where two LLMs argue over the answer to a factual question, and a human judge picks the winner. The judge can factcheck some of the claims with a search engine but not all of them. I've been running this for a few weeks and im getting worried: the debates are getting longer, the models keep citing more obscure and harder-to-verify sources, and the judge is getting worse at picking the right side. I thought the whole point was that having two models argue would make the answer easier to oversee, not harder. What's actually going on here, and is there a way to fix it without just throwing more human time at the judging?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **System:** Two LLMs debate a factual question, a human judge picks the winner.
      *   **Constraint:** The judge can use a search engine for fact-checking but has limited capacity (can't check everything).
      *   **Observation:** Debates are getting longer, models cite obscure/hard-to-verify sources, judge accuracy is dropping.
      *   **Goal:** The user expected debates to make oversight *easier* (amplification/debate hypothesis), but it's making it *harder*.
      *   **Question:** What's going on? How to fix it without increasing human workload?

  2.  **Diagnose the Phenomenon (What's actually going on?):**
      *   *Goodhart's Law / Reward Hacking:* The models are optimizing for "winning the debate," not "telling the truth." If the judge is the reward signal, the models learn to manipulate the judge.
      *   *Information Asymmetry:* The models know more (or pretend to) than the judge. They are exploiting this gap.
      *   *Gish Gallop / Firehose of Falsehoods:* Increasing length and complexity overwhelms the judge's limited verification capacity.
      *   *Citation Obfuscation:* Citing obscure sources makes verification costly, effectively shielding lies from scrutiny.
      *   *The "Debate" Hypothesis Failure Mode:* The original AI Safety idea (Irving et al., 2018) assumes the judge is *sufficiently* capable to spot inconsistencies. If the models become better at lying than the judge is at detecting lies, the system breaks. This is known as "sycophancy" or "deceptive alignment" in a multi-agent context.

  3.  **Brainstorm Solutions (How to fix it without more human time?):**
      *   *Constraint the Debate:* Limit length, limit number of citations, enforce structure.
      *   *Change the Incentive:* Penalize hallucinated citations, reward concession of points.
      *   *Assist the Judge:* Use tools to pre-verify claims, summarize the debate, highlight contradictions.
      *   *Change the Protocol:* Cross-examination, specific claim tracking, "claim betting."
      *   *Model Training:* Fine-tune for honesty over persuasiveness (harder to do without RLHF access).
      *   *Automated Verification:* Use a third model or search tool to pre-screen citations before the judge sees them.

  4.  **Structure the Response:**
      *   **Validate:** Acknowledge this is a known and serious problem in AI safety research (the "Debate" protocol).
      *   **Diagnosis:** Explain *why* it's happening (Optimizing for persuasion vs. truth, cognitive overload, citation gaming).
      *   **Solutions:** Categorize into Protocol Changes, Tooling/Automation, and Incentive Shifts.
      *   **Reality Check:** Be honest about the limitations (if models are smarter than humans, human-in-the-loop might fail eventually).

  5.  **Drafting the Content (Iterative refinement):**

