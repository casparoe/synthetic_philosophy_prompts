      *   *Fix 1: Structured Debate.* Don't let them write essays. Force specific claims. "Claim-Counterclaim-Evidence."
      *   *Fix 2: Verification Costs.* Make it expensive for the model to lie. If a citation is fake, they lose immediately. But how to check without human time? Use an automated scraper/checker.
      *   *Fix 3: Judge Aid.* Summarize the disagreement. Don't make the judge read the whole thread. Highlight *where* they disagree.
      *   *Fix 4: Cross-Examination.* Let the models ask each other yes/no questions.
      *   *Fix 5: The "Honest" Model.* Train/prompt one model to be a "auditor" rather than a "advocate."

  6.  **Refining the Advice (Self-Correction/Nuance):**
