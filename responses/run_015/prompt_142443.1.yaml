  Consider *Formica yessensis*. Baseline: A single monogynous nest housing 10,000 workers. Target: A polydomous colony of 10,000 workers split evenly between two satellite nests separated by five meters, connected solely by a single 2cm-diameter tube. Both colonies forage identically on identical terrain, achieving identical caloric intake and brood survival. In the target, all trophallaxis transferring nutrients between halves occurs exclusively within the tube; internal nest mixing is dense. An observer sees identical foraging lines and growth rates. The only difference is the physical bottleneck between the target's two chambers.

  Test A attributes one mind. Attributing states to the whole buys prediction unavailable from parts. Predicting the target's response to starvation requires knowing the global resource balance, not just local stocks. If Nest 1 hoards while Nest 2 starves, the colony fails; if they equalize via the tube, they survive. Attributing a "hunger state" to the whole colony predicts the flow across the tube and subsequent foraging intensity better than tracking individual ant states. The explanatory power resides in the global variable maintained across the link, not the local parts.

  Test B locates two minds. A subject is a local maximum of internal causal integration, found by cutting at the weakest coupling. Within each nest, ants antennate frequently, sharing spatial and chemical data densely. Across the tube, traffic is linear and sparse; removing the tube reduces integration less than removing a comparable volume of internal nest space. The "weakest coupling" is the tube. Cutting there yields two local maxima of integration. The causal density within nests exceeds the causal density across the link, forcing the cut to separate them.

  Test C attributes one mind. A mind must be a self-maintaining, goal-directed organisation with a boundary it acts to preserve. The colony maintains a single boundary against intruders, defending both nests as one territory. It regulates a single internal milieu via food exchange across the tube, acting to preserve the survival of the queen and brood regardless of location. The self-maintaining organization spans the gap because the boundary conditions (defense, homeostasis) are enforced globally. The unit of selection is the whole, not the satellite nests.

  The single narrow tube is the pivot. It carries trophallaxis and queen pheromones, keeping coupling thick enough for global homeostasis (A/C) but thin enough for structural bisection (B). Traffic is sufficient to synchronize colony state, yet bandwidth is low enough that causal density peaks within nests. Widen the tube to 10cm, increasing interaction frequency to match internal nest density, and B flips to one mind. Seal it, and A and C flip to two minds. The verdict divergence hangs on this specific bandwidth.

  Objection: Test B is the outlier; if the colony functions as one, surely it feels like one? Reply: Function (A/C) and substrate (B) come apart. B identifies the *physical locus* of integration, not the *functional utility*. If consciousness requires high-density integration, the bottleneck prevents a single phenomenal field, even if functional control is unified. The colony acts as one but might "feel" like two disconnected agents sharing a goal.

  The argument rides on the bandwidth of the connecting tube.
