answer: |-
  # Q&A Preparation Sheet: *The Calibration Asymmetry in Smith's Impartial Spectator*

  ## Part I: Premise Analysis (Settled vs. Contested)

  Use this to determine where you need to hedge your language during the talk. Do not present contested interpretations as textual givens.

  | Premise | Status | Hedging Instruction |
  | :--- | :--- | :--- |
  | **The IS is a calibration procedure, not an ideal observer.** | **Contested.** Many read the IS as an idealized construct or a divine surrogate. | Use phrases like "I propose reading the IS as..." or "On this calibration reading..." rather than "Smith defines the IS as..." |
  | **Agents seek concord of sentiments, not truth.** | **Settled.** Broad consensus that sympathy relies on shared feeling. | You can state this confidently, but specify that *pleasure* derives from the concord itself. |
  | **Calibration inherits spectator bias.** | **Contested.** Some argue the IS abstracts *away* from actual spectators. | Explicitly flag this as your interpretive innovation: "If we take the spectators to be actual..." |
  | **Asymmetry: Resentment calibrates down; Admiration calibrates up.** | **Contested.** This is your specific mechanistic claim. | Ensure you distinguish this from general claims about passion moderation. |
  | **Internal resources (Man within, Self-Command) cannot fix this.** | **Contested.** Many argue the "Man within" *is* the fix. | This is your most vulnerable point. Hedge with "Smith's internal resources appear insufficient to..." |
  | **Corruption is a predicted feature, not a bug.** | **Contested.** Standard reading sees corruption as a failure of the system. | Frame this as the conclusion of your argument, not a starting assumption. |
  | **Smith deplores admiration of the rich.** | **Settled.** Textually clear in Part IV. | You can state this as fact. |
  | **Invisible Hand passage is about unintended consequences, not judgment.** | **Settled/Contested.** Mostly settled, but some see normative approval. | Stick to the "unintended consequences" reading but acknowledge it doesn't solve the moral judgment problem. |

  ---

  ## Part II: Objections and Replies (Ordered by Damage)

  ### 1. The Contractualist Ethicist (Damage: Fatal)
  **Objection:** "You've stripped Smith of any normative standpoint. If the spectator is just a mirror of actual society, and actual society is corrupted, then the spectator is corrupted. That leaves Smith with no ground to criticize his own society. You've turned a moral theory into a sociology of error. If the impartial spectator can't condemn the corruption it inherits, in what sense is it *moral*?"

  **Reply:** "That's exactly the tragedy I'm locating in Smith. He isn't offering a guaranteed escape from corruption; he's diagnosing why corruption is so stable. The 'moral' element isn't that the spectator always succeeds, but that the *attempt* at calibration constitutes moral life. Smith offers a descriptive account of moral psychology that explains why normative criticism is so difficult, not a prescription that guarantees it succeeds. The normativity lies in the tension between the actual spectator and the effort to align, even if the alignment fails."

  **Weakness/Cost:** This risks making Smith a relativist. You must maintain that the *effort* has value even if the *outcome* is corrupted, which is a hard sell to a normative ethicist.

  ### 2. The Virtue Theorist (Damage: Fatal)
  **Objection:** "You claim self-command fails because it presupposes the spectator's reliability. But Smith treats self-command as the master virtue precisely because it allows us to *resist* the immediate crowd. Isn't self-command the mechanism that breaks the calibration loop? If I command myself to feel less admiration for the rich than the crowd does, haven't I solved your asymmetry problem?"

  **Reply:** "Self-command is defined as moderating passion to the pitch the impartial spectator approves. If the spectator's pitch is already calibrated upward by the crowd's admiration, self-command just locks in that corruption. You can't use the output of the mechanism to fix the mechanism's input bias. Smith describes self-command as maintaining dignity, but if the standard of dignity is set by a corrupted spectator, self-command becomes disciplined corruption."

  **Weakness/Cost:** You must stick rigidly to the definition of self-command as dependent on the spectator. If the audience accepts a definition of self-command as independent intuition, your argument collapses.

  ### 3. The Intellectual Historian (Damage: Fatal)
  **Objection:** "You're reading Smith through a secular, mechanistic lens that ignores Providence. Smith believes nature intends certain ends. Even if the psychological mechanism is biased, the providential order corrects it over time. The 'invisible hand' isn't just economic; it's teleological. Doesn't appealing to Providence repair the internal resources you claim are broken?"

  **Reply:** "Providence might fix the *outcome*—the distribution of necessities—but my claim is about the *moral sentiments* of the agents. Even if the poor are fed, the rich are still admired unjustly, and the spectators are still corrupted. Providence solves the survival problem, not the moral judgment problem. Smith distinguishes between the happiness of the species and the correctness of individual sentiment. My argument targets the latter."

  **Weakness/Cost:** This concedes that Smith's system works for survival but fails for morality. It limits the scope of your critique but saves the mechanism.

  ### 4. The Moral Psychologist (Damage: Serious)
  **Objection:** "You talk about 'pitch' and 'calibration' as if these are measurable variables. How do we falsify this? If someone says they feel admiration, and you say they're calibrated upward, but they insist they're calibrated properly, what test distinguishes your theory from a metaphor? I need a mechanism I can actually observe."

  **Reply:** "The test is comparative intensity across contexts. If my theory holds, we should see systematically higher variance in admiration for high-status individuals compared to low-status ones, controlling for merit. We should also see resentment dampened faster than admiration amplified in group settings. It's falsifiable if we treat 'pitch' as reported intensity relative to a baseline of solitary judgment versus group judgment."

  **Weakness/Cost:** You are committing Smith to empirical claims he never made. If modern data doesn't match, it doesn't disprove Smith, but it weakens your mechanistic reading.

  ### 5. The Hume Specialist (Damage: Moderate)
  **Objection:** "This sounds like Hume's 'steady and general point of view.' Hume already knows we correct our sentiments by adopting a common standpoint. What's the novelty here? You're presenting a standard Scottish Enlightenment move as a unique discovery about calibration asymmetry."

  **Reply:** "Hume's steady point of view is about correcting for *distance* and *perspective* to find a stable truth. My claim is about correcting for *social pressure* which introduces a systematic *bias*. Hume thinks the correction leads to truth; I'm arguing Smith shows the correction leads to systematic error in specific domains. The novelty isn't calibration itself, but the asymmetry of its results."

  **Weakness/Cost:** You have to concede Hume has calibration, but insist Smith identifies the *directional bias*. If they see no difference, your contribution looks thin.

  ### 6. The Historian of Economic Thought (Damage: Moderate)
  **Objection:** "Is this really a critique of commercial society, or just human nature? If this asymmetry exists in a feudal court just as much as a market society, then your conclusion about the corruption of sentiments doesn't tell us anything specific about capitalism or commerce."

  **Reply:** "It's human nature, but commercial society amplifies it. In feudalism, admiration is fixed by rank. In commerce, rank is fluid and tied to wealth, making the calibration dynamic and constantly reinforcing inequality through sentiment. The mechanism is universal, but the pathology is acute in commercial society because wealth becomes the primary signal for admiration."

  **Weakness/Cost:** You must walk the line between universal psychology and historical specificity. If it's too universal, it's not historically interesting; too specific, and it's not psychological.

  ### 7. The Contractualist Ethicist (Damage: Low)
  **Objection:** "Doesn't the 'man within the breast' allow for idealization beyond actual spectators? Smith says we imagine how an impartial man *would* judge, not just how he *does* judge. Doesn't that counterfactual space allow you to escape the actual bias?"

  **Reply:** "Where does the material for that counterfactual come from? If conscience is acquired through socialization, as Smith says, the 'would' is built from 'does.' You can't bootstrap an ideal standard from corrupted materials without an external source, which Smith denies us. The counterfactual is still constructed from actual spectral data."

  **Weakness/Cost:** This relies on a strict empiricist reading of conscience acquisition. If Smith allows for innate rational capacities here, your bootstrapping argument fails.

  ### 8. The Virtue Theorist (Damage: Low)
  **Objection:** "Smith calls it a 'corruption.' If his mechanism predicts it, why does he treat it as a failure? Doesn't your reading make Smith inconsistent—claiming the system works while lamenting the output?"

  **Reply:** "He treats it as a moral failure, not a mechanical one. The machine is working as designed; the design is tragic. Smith is consistent in describing the mechanism accurately while mourning the moral cost. It's a realist tragedy, not a logical contradiction."

  **Weakness/Cost:** This makes Smith a pessimist. Some scholars resist the "tragic Smith" reading, preferring a more optimistic providential view.

  ---

  ## Part III: Strategic Advice

  ### Two Objections to Concede Upfront (Opening 2 Minutes)
  1.  **The Hume Novelty Claim:** Soften your language. Acknowledge that Hume has a calibration model. State clearly: "I am not arguing Smith invented calibration, but that he identified a specific *asymmetry* in it that Hume missed." This disarms the Hume specialist before they speak.
  2.  **The Commerce Critique:** Clarify scope. Say: "I am not arguing this is a critique of markets per se, but of the moral psychology that accompanies status competition in any society, which commerce intensifies." This prevents the Economic Historian from boxing you into a debate about capitalism you don't want to have.

  ### The One Reply That Must Land
  **The Virtue Theorist on Self-Command.**
  If Self-Command is accepted as an independent corrective force, your "inevitability of corruption" thesis collapses. You must convince the room that Self-Command is *dependent* on the Spectator's pitch. If you lose this, the chapter becomes a description of a problem Smith already solved.
  *   **Key phrase to use:** "Self-command moderates passion to the spectator's pitch; it does not set the pitch itself."

  ### The Question You Hope Nobody Asks
  "Smith explicitly distinguishes the 'man within' from the 'man without' in Part III, Chapter 3. He says the man within can sometimes condemn the applause of the world. How do you reconcile that text with your claim that the man within is just internalized actual spectators?"
  *   **Why:** This is the strongest textual counter-evidence to your "bootstrapping" claim. It suggests Smith *does* believe we can transcend actual opinion.

  ### The Weak Point to Volunteer
  **The Inconsistency of the "Man within."**
  Volunteer this before the Intellectual Historian or Contractualist pounces.
  *   **Script:** "I want to flag a tension I'm still working through. Smith sometimes writes as if the man within is purely internalized, and other times as if it has a divine or rational spark independent of society. My argument relies on the internalized reading. If Smith intends the latter, my claim about inevitable corruption weakens. I'm arguing the internalized reading is the only one consistent with his empirical method, but I acknowledge the text oscillates."
  *   **Why:** This shows intellectual honesty, controls the narrative around your weakest textual evidence, and invites collaboration rather than attack on that specific point.
