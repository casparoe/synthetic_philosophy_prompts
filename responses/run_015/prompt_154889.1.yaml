  I am trying to identify whether there is an established name—perhaps in philosophy of history, historiography, or narrative theory—for the following recurring structure in grand-scale human histories. Consider how Harari presents the Cognitive Revolution as both an empirical rupture and an organizing frame that renders all prior human life as a uniform prelude; or how Diamond treats agriculture as an empirically discrete “catastrophe” whose internal logic then explains subsequent inequality; or how Graeber and Wengrow, in rebutting such narratives, nonetheless invoke seasonal, reversible thresholds to distinguish egalitarian phases from hierarchical ones. In each case, an author posits a historical boundary that operates simultaneously in two registers: as a falsifiable empirical claim about a discrete transition, and as a heuristic framing device that licenses causal and normative generalizations. When critics press the empirical claim—showing that the transition was gradual, locally reversible, or poorly dated—the author can retreat to the heuristic defense. Yet the heuristic continues to do the explanatory and evaluative work that originally depended on the very discreteness now conceded, so that the empirical and organizational functions provide mutual cover rather than independent support. I have noticed this pattern in both popular syntheses and in critical replies to them, but I cannot tell whether it is a distinct failure mode or merely an instance of Whig history, teleological framing, or the reification of periodization. Could you map the nearest established concepts, specify exactly where this two-register, mutual-cover dynamic differs from each, and either assign the pattern to a known category with justification or coin a precise term with clear boundary conditions? In particular, state what specific historical counter-example or theoretical argument would lead you to reject the claim that this is a separate phenomenon at all.

