  (1) Precise description of the two-register pattern and its instances
  This pattern involves positing a historical boundary that functions simultaneously as a falsifiable empirical claim and a non-falsifiable heuristic frame. In the empirical register, the boundary (e.g., Harari's Cognitive Revolution, Diamond's Agricultural Catastrophe) is presented as a discrete rupture causing downstream effects. In the heuristic register, it serves as an organizing narrative device. When critics challenge the empirical discreteness—showing gradualism or reversibility—the author retreats to the heuristic defense, claiming it is merely a conceptual tool. However, the heuristic retains the causal and normative explanatory power that originally depended on the empirical discreteness. The empirical claim lends weight to the heuristic, while the heuristic protects the empirical claim from falsification. This creates a closed loop where the boundary is robust enough to explain history but flexible enough to evade critique. Graeber and Wengrow utilize similar seasonal thresholds, distinguishing egalitarian from hierarchical phases via reversible boundaries that nonetheless sustain broad structural claims. The core mechanism is mutual cover: the empirical provides authority, the heuristic provides immunity.

  (2) Nearest established terms—Whig history, teleology, reification, heuristic framing—and how each partially captures but misses the mutual-cover dynamic
  Several established concepts approximate this dynamic but fail to capture the mutual-cover mechanism. **Whig History** critiques teleological narratives judging the past by present standards, but it addresses directionality, not the ontological slippage of specific boundaries. **Teleology** similarly focuses on end-states rather than the evidentiary status of transitions. **Reification** identifies treating abstract concepts as concrete things, which fits the empirical register, but misses the strategic retreat to the heuristic register when challenged. **Heuristic Framing** acknowledges the utility of simplification but ignores the false empirical weight such frames often carry. The closest logical analogue is the **Motte-and-Bailey Fallacy**, where a defensible position (heuristic) protects an indefensible one (empirical discreteness). However, standard Motte-and-Bailey analyses focus on propositional arguments, whereas this pattern is structural to narrative historiography. It embeds the slippage within the periodization itself, allowing the narrative to proceed as if the empirical claim holds, even after conceding it does not. While Motte-and-Bailey describes the logical structure, it lacks historiographical specificity regarding periodization. It does not account for how narrative continuity relies on the boundary's stability. In history, the boundary isn't just a premise; it is the structural beam of the narrative. Existing terms diagnose the error but not the dynamic immunization strategy.

  (3) Divergences and boundary conditions: what the phenomenon is not
  This phenomenon is distinct from standard periodization, which typically admits arbitrariness without claiming causal discreteness. It is not mere myth-making, which makes no empirical claims at all. Nor is it standard model-building, where assumptions are explicitly bracketed. The critical boundary condition lies in the **explanatory dependency**. In valid model-building, if an empirical assumption (e.g., discrete transition) is relaxed, the explanatory scope is adjusted accordingly. In this pattern, the explanatory scope remains maximal despite the empirical concession. If an author admits agriculture was gradual but continues to attribute specific, discrete inequalities solely to "the advent of agriculture" without adjusting the causal mechanism, this pattern is present. Conversely, if the author adjusts the causal claim to match the gradualism (e.g., inequality emerged intermittently), the pattern is absent. The failure mode is not the use of heuristics, but the refusal to diminish explanatory certainty when empirical certainty is withdrawn. It is the retention of empirical force without empirical risk. Standard periodization accepts fuzziness; this pattern exploits fuzziness to maintain precision in claims.

  (4) Verdict and, if warranted, a coined term with definition
  This is a distinct failure mode within macro-historical narrative, warranting a specific designation. While logically a Motte-and-Bailey, its historiographical application requires a precise label: **"The Empirical-Heuristic Shuttle."** This term defines the strategic movement between registers: shuttling to the empirical claim to gain explanatory traction, and shuttling to the heuristic frame to evade falsification. Unlike general reification, the Shuttle implies active movement between ontological statuses depending on rhetorical need. It differs from Whig history by focusing on the mechanism of the boundary rather than the direction of the narrative. The condition for this label is the presence of a boundary that is treated as hard when explaining effects and soft when defending origins. Recognizing this allows critics to demand consistency: either the boundary must sustain empirical scrutiny, or the explanatory claims must be weakened to match its heuristic status. It identifies a specific form of epistemic immunity in grand narratives. This term captures the kinetic nature of the defense, highlighting how authors move between registers to maintain narrative authority without accepting empirical vulnerability.

  (5) What would change my mind—the specific argument or case that would undermine the identification
  I would reject this as a separate phenomenon if a case demonstrated that the heuristic retains full explanatory power independently of the empirical discreteness. If an author concedes gradualism and successfully adjusts the causal model to show the same outcomes emerge without a discrete rupture, the "Shuttle" collapses into valid model-building. Additionally, if historiographical theory already possesses a term that explicitly captures this defensive oscillation regarding periodization boundaries, my coinage would be redundant. Finally, if empirical discreteness is shown to be unnecessary for the normative claims made, the mutual cover dynamic dissolves.
