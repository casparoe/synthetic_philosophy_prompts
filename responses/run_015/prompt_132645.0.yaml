answer: |-
  The claim that analogy-making constitutes the core of cognition is often dismissed as a category error, conflating a specific heuristic with the totality of mental processing. To salvage this thesis, we must impose a restrictive formal condition: genuine cognitive analogies are those that preserve relational invariance across domains that share no surface features. This condition explicitly excludes loose metaphorical association, which relies on vague affective resonance, and identity-based pattern matching, which relies on literal similarity. Under this strict definition, analogy is not merely a tool for thinking; it is the fundamental mechanism by which concepts are formed and applied. By defining cognition as the act of mapping structural relations across ontologically distinct domains, we can defend the thesis against objections regarding deduction and perception, avoid collapsing into tautology, and provide a robust account of conceptual innovation.

  ### I. Defending Against the Objections of Deduction and Perception

  The standard objection to the "analogy-as-core" thesis is that certain cognitive operations appear to function without any analogical component. Specifically, formal deduction and direct perception are cited as counterexamples. Deduction seems to operate via rule-following within a closed system, and perception seems to operate via direct signal transduction. However, both objections fail when subjected to the restrictive condition of relational invariance without surface overlap.

  Consider formal deduction. The objection posits that deriving a conclusion from premises is a mechanical process of symbol manipulation, distinct from the "fuzzy" mapping of analogy. Yet, for a deduction to be cognitive rather than merely computational, the symbols must be understood as standing for something. To apply a logical rule to a real-world situation is to recognize that the *structure* of the situation is invariant to the *structure* of the logical form. The surface features of the real-world situation (e.g., apples, debts, physical movements) share nothing with the surface features of the logical symbols (e.g., $P$, $Q$, $\to$). Therefore, the act of applying logic is an analogical mapping: one identifies a relational structure in the concrete domain and maps it onto the abstract structural domain of logic. Without this mapping, deduction is merely syntax without semantics. The restrictive condition clarifies that the "analogy" here is not a loose comparison but a rigorous preservation of relational invariance across the distinct domains of the abstract and the concrete.

  Similarly, direct perception is often argued to be non-analogical because it is immediate. However, perception is not the passive reception of data; it is the categorization of sensory input. To see an object *as* a chair is to map the current sensory array onto a structural concept of "affordance for sitting." The current visual input shares no surface features with previous instances of chairs (different colors, angles, lighting), yet the relational structure (support, stability, height relative to body) remains invariant. If perception were identity-based pattern matching, we would never recognize a chair we hadn't seen before. If it were loose metaphor, we might mistake a stump for a chair indiscriminately. Instead, perception is a high-speed analogical process that extracts relational invariants from noisy, surface-diverse data. Thus, under the restrictive condition, both deduction and perception are revealed as instances of structural mapping across distinct domains, reinforcing the thesis that analogy is the engine of cognition.

  ### II. Blocking the Tautological Collapse

  A deeper philosophical worry threatens to render the thesis vacuous. If we define analogy broadly enough to encompass all cognitive acts, we risk a tautology: "All cognition is analogical" becomes equivalent to "All cognition is cognition." This collapse is particularly acute if we treat pure logical inference as a degenerate analogical mapping where the source and target domains are identical. If $A$ maps to $A$, and we call this analogy, then every act of identity recognition becomes an analogical act, stripping the term of explanatory power.

  To block this collapse without abandoning the core thesis, we must introduce a principled distinction based on *ontological distance*. The restrictive condition already mandates that domains share no surface features, but we must strengthen this to require that the domains differ in their fundamental ontology. A tautology arises only if the mapping is intra-domain (identity). Cognition, properly construed, is an inter-domain operation.

  The principled block is this: **Cognition is the process of resolving tension between distinct ontological categories via structural alignment.** When source and target are identical, there is no tension, no translation, and thus no cognitive work—only registration. Registration is mechanical; cognition is hermeneutic. For example, recognizing that a specific token is the letter 'A' is registration (identity). Recognizing that the structure of an atom is like the structure of a solar system is cognition (analogy).

  If one argues that logical inference is a degenerate case where the distance is zero, the response is that zero-distance mapping is not cognition, it is computation. Cognition *begins* where the gap appears. Therefore, the thesis "all cognition is analogical" is not tautological because it makes a substantive claim about the nature of mental work: mental work exists only where there is a gap to bridge. If there is no gap (pure identity), there is no cognition. By defining cognition as the *bridging of ontological gaps* through structural invariance, we preserve the informative content of the thesis. It tells us that the mind is not a mirror of nature (identity) nor a dreamer of metaphors (loose association), but a translator of structures across boundaries.

  ### III. Implications for Conceptual Innovation in Mathematics and Science

  This revised view of analogy has profound implications for how we understand conceptual innovation in mathematics and science. The standard view holds that innovation consists in the accumulation of abstract rules or the extension of surface similarities through induction. The analogical thesis, constrained by relational invariance and ontological distance, argues instead that genuine innovation consists in constructing high-invariance analogies across structurally distant domains.

  In mathematics, progress is often mischaracterized as the discovery of pre-existing truths or the arbitrary invention of new axioms. Under the revised view, mathematical innovation is the recognition of structural invariance between domains previously thought to be unrelated. For instance, the unification of algebra and geometry did not occur by adding new rules to algebra or measuring more shapes in geometry. It occurred by constructing a mapping where algebraic relations were seen as invariant to geometric configurations. The surface features (numbers vs. lines) are entirely distinct, but the relational structure (operations vs. transformations) is preserved. This is not rule accumulation; it is a deepening of the analogical bridge. The "truth" of the mathematics lies in the robustness of the invariance across the distance.

  In science, the same principle applies. Theories are not merely summaries of data (surface features) but are structural maps of hidden mechanisms. A scientific breakthrough occurs when a relational structure from a well-understood domain is mapped onto a poorly understood domain, despite a lack of surface similarity. Consider the conceptual leap where planetary motion is understood as a form of falling. Surface features suggest these are opposite phenomena (one stays in the sky, one hits the ground). Innovation arises from ignoring these surface features and isolating the relational invariant (acceleration due to a central mass). This is not extending a surface similarity; it is imposing a structural identity across an ontological gap.

  Consequently, conceptual stagnation occurs when thinkers rely on surface similarities or rigid rule-following. Surface similarity leads to categorization errors (classifying whales as fish), and rigid rule-following leads to inability to generalize beyond the training set. True innovation requires the cognitive courage to ignore surface disparity and trust structural resonance. It implies that the most powerful concepts are those that can sustain their relational invariance across the widest possible ontological distances.

  ### Conclusion

  By restricting the definition of analogy to the preservation of relational invariance across domains with no surface features, we transform the claim from a vague metaphor about thinking into a precise theory of conceptual mechanics. This restriction defends the thesis against objections regarding deduction and perception by revealing the hidden structural mapping required to make logic semantic and perception categorical. It avoids tautological collapse by distinguishing between mechanical registration (identity) and cognitive translation (ontological bridging). Finally, it reframes innovation in math and science not as the accumulation of rules or data, but as the construction of robust structural bridges across the widest possible conceptual divides. Cognition, therefore, is not the storage of facts, but the active, continuous process of finding the same deep structure in different superficial worlds.
