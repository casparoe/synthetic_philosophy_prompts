answer: |-
  **Working Title:** Horizontal Defection and Vertical Hierarchies: Disaggregating Mechanisms of Normative Change in Honor Worlds

  **Project Overview and Problem Statement**
  Explanations of large-scale normative change generally fall into two camps: those prioritizing internal moral coherence and those prioritizing external material interests. In contemporary moral philosophy, Kwame Appiah's honor-world framework argues that practices like dueling, slavery, and foot-binding collapse when internal contradictions render the honor code non-credible. Conversely, the Williams thesis suggests such shifts are driven primarily by material and status interests, with honor serving merely as an epiphenomenal justification. While these accounts are often treated as competing explanations for the same phenomenon, both rely on a unified model of how honor norms dissolve. They assume that the mechanism of collapse is functionally similar across different types of honor-bound practices, differing only in the speed or trigger of the change.

  This project identifies a structural gap in both accounts. It argues that the topology of the social game sustaining the norm dictates the mechanism of its collapse. Specifically, there is a fundamental distinction between *horizontal* signaling games (such as dueling), where status is negotiated among peers, and *vertical* hierarchical systems (such as chattel slavery), where status is enforced through economic and legal subordination. Appiah's model correctly identifies the necessity of lost credibility but fails to distinguish how credibility is lost in peer networks versus hierarchical structures. The Williams thesis correctly identifies material interests but overlooks how peer-to-peer signaling can shift independently of broad economic restructuring.

  **Research Question and Thesis**
  The central research question is: **Does the collapse of dueling genuinely support the unified honor-world model, or does it require disaggregating moral-revolution mechanisms into vertical, horizontal, and hybrid types?**

  I argue that dueling collapses through *horizontal peer-defection*—a process where refusal to accept a challenge becomes credible within a local cohort without requiring broad economic restructuring or top-down moral argument. In contrast, slavery is embedded in vertical economic and legal hierarchies that cannot dissolve through cohort-level refusal alone. Therefore, the unified honor-world model is insufficient. A robust theory of normative change must categorize revolutions based on the structural relationship between the agents sustaining the norm. If the norm is horizontal, change proceeds via signaling cascades; if vertical, change requires structural coercion or economic disruption.

  **Methodology**
  This project employs a conceptual-comparative method rather than archival historical research. The analysis will treat dueling and slavery as ideal-typical cases to test the logical structure of the proposed mechanisms. The work will proceed in three stages:
  1.  **Reconstruction:** Clarify the causal mechanisms in Appiah's credibility-condition model and the materialist interest-convergence model.
  2.  **Differentiation:** Develop the conceptual distinction between horizontal peer-defection and vertical structural dependency. This involves analyzing the conditions under which a single agent's defection becomes costly or costless depending on the network structure.
  3.  **Application:** Apply this typology to the cases of dueling and slavery to demonstrate that existing theories conflate distinct processes. The goal is not to prove the historical details of either case anew, but to show that the *logic* of their collapse differs in ways current moral philosophy overlooks.

  **Work Plan (Month-by-Month)**
  *   **Month 1: Framework and Literature.** Finalize the interpretation of Appiah and Williams. Draft the conceptual definitions of "horizontal peer-defection" and "vertical hierarchy." Ensure the distinction between Appiah's credibility condition and the proposed signaling mechanism is sharp.
  *   **Month 2: Conceptual Development.** Write the core theoretical section (approx. 2,500 words). Develop the game-theoretic intuition behind peer-defection without relying on formal modeling. Establish why horizontal norms are vulnerable to local cascades while vertical norms are not.
  *   **Month 3: Case Application.** Write the comparative analysis (approx. 3,500 words). Apply the framework to dueling and slavery. Address potential counterarguments, such as cases where horizontal norms persist or vertical norms collapse quickly.
  *   **Month 4: Synthesis and Revision.** Write the introduction and conclusion (approx. 2,000 words). Refine the argument for flow and clarity. Conduct a final review to ensure the scope remains within the 8,000-word limit and the thesis is clearly supported.

  **Expected Outcomes: Success and Failure Conditions**
  A successful result will produce a clear typology of normative change that preserves the insights of Appiah (the role of honor) and Williams (the role of interests) while correcting their structural blind spots. Success is defined by the ability to demonstrate that horizontal peer-defection is a distinct causal mechanism that cannot be reduced to either internal contradiction or material interest convergence alone.

  Failure would take two forms. First, if the distinction between horizontal and vertical structures proves analytically messy—for example, if dueling is shown to rely heavily on vertical legal enforcement or slavery on horizontal peer cultures—the typology collapses. Second, if the conceptual distinction does not yield different predictions for how change occurs, the project lacks explanatory power. In either case, the paper would pivot to arguing why a unified model remains necessary despite structural differences.

  **Scope Assessment**
  An 8,000-word paper is sufficient to develop the conceptual typology and apply it to two cases, but it leaves little room for extensive historical narrative or engagement with secondary debates outside the core theoretical framework. The primary risk is overreach: attempting to solve the general problem of normative change rather than focusing on the specific structural distinction proposed. To manage this, the paper will restrict its historical claims to the logical requirements of the norms rather than comprehensive historical causality. The focus remains on the *mechanism* of collapse, not the *history* of the practices. This ensures the project is completable within one semester while making a novel contribution to the seminar's themes.
