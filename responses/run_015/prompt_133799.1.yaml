answer: |-
  The standard interpretation of the Flying Man thought experiment often rests on an epistemological claim: that self-awareness is primitive and does not require sensory mediation. However, this reading underestimates the metaphysical force of the argument. The Flying Man scenario is not merely a demonstration of phenomenological immediacy; it is a proof of ontological independence. Specifically, the certainty with which the suspended subject affirms "I exist" demonstrates that the first-person pronoun refers to a substantive, immaterial soul that functions as a stable, non-indexical referent. If the self were merely a physical state or a hylomorphic form dependent on the body, the removal of bodily content would sever the semantic link required for self-reference. The survival of this reference in the void proves the referent is a substance in its own right.

  ### The Problem of Reference in the Void

  To understand the metaphysical weight of the Flying Man, one must analyze the logic of indexical reference. In ordinary experience, the pronoun "I" functions as an indexical; its referent is fixed by the context of utterance, specifically the bodily location and continuity of the speaker. "I" typically means "the entity occupying this body at this time."

  The Flying Man scenario systematically dismantles this context. The subject is deprived of all external sensation, internal bodily sensation, and memory of bodily configuration. In this state, the indexical anchors ("here," "this body," "now") are severed. If the referent of "I" were identical to a specific bodily state or a neural configuration, the subject would lack the cognitive access required to identify that referent. One cannot refer to $X$ if all modes of identifying $X$ have been removed, unless the act of referring does not rely on those modes.

  Yet, the subject affirms his existence with certainty. This implies that the term "I" successfully latches onto a referent despite the absence of bodily markers. For reference to succeed without descriptive or sensory identification, the referent must be present to the mind not as an object of perception, but as the very substrate of the referring act itself. This indicates that the "I" does not point to a contingent collection of states (which are absent) but to a persistent substance that remains when states are stripped away.

  ### The Failure of Physicalist and Hylomorphic Accounts

  Consider the alternative: suppose the self were merely a brain state or an Aristotelian form of a particular body.

  If the self were a **brain state**, self-reference would require a higher-order monitoring of that state. In the Flying Man scenario, the subject is cut off from information regarding their physical constitution. If "I" refers to "the current state of this brain," and the subject has no access to "this brain," the statement "I exist" becomes an inference based on missing data. It would be akin to a camera claiming "I exist" while disconnected from its lens and sensor. The certainty of the Flying Man's judgment rules out this inferential gap. The knowledge is not a conclusion drawn from evidence; it is the condition of the judgment itself.

  If the self were an **Aristotelian form of the body**, its individuation would depend on its relation to matter. In hylomorphism, the soul is the actuality of a natural organic body. Without the sensory connection to that organic body, the form loses its principle of individuation. There would be no metaphysical ground to distinguish *this* soul from *that* soul, or indeed to distinguish the soul from the abstract concept of "soul-ness." The Flying Man, however, retains a robust sense of particularity. He does not affirm that "existence exists" or "consciousness is happening"; he affirms "*I* exist." This particularity, preserved in the absence of matter, implies that the principle of individuation is internal to the soul itself, not derived from its relation to a body.

  Therefore, the persistence of first-person reference implies that the referent of "I" is a *substance* capable of subsisting independently of the accidents (sensations) and the matter (body) usually associated with it.

  ### Addressing the Proprioceptive Objection

  A common materialist reply argues that the Flying Man scenario is impossible to instantiate perfectly because residual proprioceptive or vestibular signals would remain. Even in suspension, the subject might feel a sense of orientation, tension, or balance. The objection posits that these subtle bodily feelings provide the necessary anchor for the indexical "I." The subject is not referring to an immaterial soul, but to the "owner" of these residual vestibular sensations.

  This objection fails because it confuses the *occasion* of awareness with the *object* of awareness, and contingent data with necessary truth.

  First, even if proprioceptive signals are present, they do not constitute the *meaning* of the self-affirmation. If I say "I exist" based on a feeling of balance, my existence becomes contingent upon that feeling. If the anesthesia were deepened to remove vestibular input, the "I" would presumably vanish on this view. But the metaphysical claim of the Flying Man is that the *certainty* of existence is invariant. The subject knows that *even if* they had no hands, no feet, and no internal sensations, they would still exist. The judgment holds *counterfactually* against the absence of sensation. A referent grounded in proprioception cannot support a judgment that claims validity independent of proprioception.

  Second, and more critically, this objection commits a category error regarding first-person reference. Proprioception is an awareness *of* the body. It is a third-person-like datum accessed from a first-person perspective. To move from "there is a sensation of balance" to "I exist" requires an inference: "There is a sensation; sensations require a subject; therefore I exist." But the Flying Man's knowledge is non-inferential. It is immediate.

  If the "I" were derived from bodily signals, the subject would first be aware of the signal and then posit themselves as the bearer. In the Flying Man scenario, the awareness of the self is simultaneous with and prior to the awareness of any state. To argue that vestibular signals ground the reference is to argue that the subject infers their existence from a bodily state. But the thought experiment establishes that the subject affirms their existence *without* affirming they have a body. If the referent of "I" were the bearer of bodily states, one could not affirm the former while remaining agnostic about the latter. The fact that the "I" survives the bracketing of all bodily content proves that the referent is not the bearer of bodily states, but a distinct ontological category.

  ### Conclusion: The "I" as a Rigid Designator of Substance

  The metaphysical implication of the Flying Man is that the first-person pronoun, in its primary usage, functions not as a shifting indexical tied to a body, but as a rigid designator for a simple, immaterial substance.

  In the absence of sensory content, the "I" cannot refer to a location, a shape, or a collection of feelings. It must refer to the *actuality* of the subject itself. For this reference to be stable and meaningful, the subject must possess a nature that is fully present to itself without mediation. This self-presence is the definition of immaterial subsistence. A material thing is present to itself only through the interaction of its parts or through sensory feedback loops; a substantive soul is present to itself by its very essence.

  Therefore, the Flying Man argument demonstrates more than the psychological fact of self-awareness. It establishes that the ontology of the self must match the epistemology of the "I." Since the "I" refers with certainty when all bodily predicates are removed, the entity referred to must be capable of existing when all bodily predicates are removed. The stability of first-person reference in the void is the linguistic trace of an immaterial soul.
