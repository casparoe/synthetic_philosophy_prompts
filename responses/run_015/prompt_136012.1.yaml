  **Second: The Principles**

  The list hangs together on two competing principles. Both fit entries 1 through 8, but they pull entry 9 in opposite directions.

  **Principle A: Sensory Specificity.**
  This rule holds that each sense is a closed loop. Information cannot cross from one sense to another without a period of translation or learning. The eye does not read what the hand has written.
  *   **Support in 1–8:** This drives the "No" verdicts in entries 1, 4, 6, and the corrected 7. It explains why the geometer (6) fails despite knowing the definitions, and why the echo walker (7) fails despite knowing the space.
