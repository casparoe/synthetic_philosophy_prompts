  *   **Preference:** This is the stronger rule in the notebook. It aligns with the character's own experience of the "shock" of recovery (entry 1) and her insistence that vision is a unique business (entry 4).

  **Principle B: Informational Equivalence.**
  This rule holds that perception is about the structure of information, not the channel that carries it. If the spatial data (perspective, occlusion, looming) is identical to vision, the mind should recognize it regardless of the sense delivering it.
  *   **Support in 1–8:** This supports the "Yes" verdicts in entries 2, 3, 5, and 8. It suggests that once the data is available, the mind can use it. Entry 8 is the strongest support: the patient learns to read the "alphabet" of light.
