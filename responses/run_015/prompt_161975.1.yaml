prompt: |-
  Hey — I'm on the allocations committee for a limited-equity housing co-op, about 90 units, and we're the ones who decide who gets offered the next empty apartment. There's 7 of us, we meet one evening every month or two when a unit frees up (occasionally two at once), and the output has to be a full ranking of the shortlist, not just a winner: if the top pick turns us down the offer cascades to #2, then #3, so ties are no use to us at all.

  Right now each of us writes down a ranking of everyone on the shortlist and we add up Borda scores. Last spring this bit us badly: someone added an extra applicant to the shortlist more or less as a joke — a guy with no income documentation who was never going to get the unit — and adding him moved a *different* applicant from 3rd to 1st. That feels like it shouldn't be possible, and it's made two of our members distrust the whole process. I've since read a bit of the lay explanations of Arrow's theorem, so I get the rough shape of the argument, but I need something I can actually run on a Tuesday night.

  What I want from you: turn Arrow's result into a decision procedure our committee can use. Concretely:

  - The questions to ask, in order, when we're picking or auditing a rule — starting with "what kind of input can we actually collect from seven volunteers" and ending with "which of Arrow's conditions are we willing to give up, and what does giving that one up cost us in practice."
  - What counts as an adequate answer to each question, phrased so someone with no social choice theory can follow it; where the procedure just says no to a rule; and where it has to stop and hand the decision back to us because the question is a values call (which unfairness we'd rather live with) rather than a factual one.
  - The two failure modes I now care about, stated as tests we can run on a spreadsheet in about ten minutes: (1) our ranking of the people already on a shortlist shouldn't change when someone obviously irrelevant gets added, or when the person we just housed gets taken off the top; (2) a committee member's ballot shouldn't be able to hurt their own top choice, and a member who stays home shouldn't be able to help theirs.
  - How to handle partial ballots and recusals, since the theorem assumes everyone hands in a complete ranking and we often can't: people only rank their top five, or they know an applicant and refuse to rank them.
  - Where the procedure genuinely can't give us an answer.

  A detail that matters to me: the shortlist is drawn up by our membership coordinator, not by the seven of us, so if shortlist composition can swing the outcome then that person has real power none of us voted to give them. Please treat that as part of the problem, not a side note.

  Then run the procedure on three cases:

  (a) The Borda mess above, with the decoy applicant.
  (b) Two units free at the same time in March — do we just take the top two off the ranking, or re-run the ballot on the remaining applicants, and does the difference actually matter?
  (c) A proposal one member made: stop ranking applicants at all, have each of us place every household on a single 0–10 "housing need" scale and average the scores. I suspect this dodges the theorem somehow, and I want to know how, what it costs us, and whether it's really dodging anything or just relocating the problem somewhere we won't notice it.

  Constraints: one evening, a laptop with a spreadsheet, no special software; two of our members are in their 70s and will not sit still for anything that can't be explained in about five minutes at the annual meeting; and our lawyer wants the rule written down and applied identically every time, which I think rules out "the chair decides when it gets messy."

  I have a feeling the honest answer here is going to be something we don't want to hear — maybe that we should let one person decide, or that the ballot is doing less work than we pretend — and if that's where this goes, say it plainly and tell us what we'd be buying. And be honest about confidence throughout: for each part of the procedure say how sure you are that it's a faithful operationalization of what the theorem actually says, and single out the bit you're least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Member of a 7-person allocations committee for a 90-unit limited-equity housing co-op.
      *   **Problem:** Current Borda count system is vulnerable to "clone/independent of irrelevant alternatives" (IIA) failures (the decoy applicant incident). They need a robust decision procedure based on Arrow's Impossibility Theorem but practical for volunteers.
      *   **Constraints:** One evening meeting, laptop/spreadsheet only, older members (need simplicity), legal requirement for written/consistent rules, shortlist created by a *different* person (Membership Coordinator).
      *   **Specific Requests:**
          1.  Turn Arrow's result into a decision procedure (questions to ask, adequate answers, value calls).
          2.  Define two failure mode tests (IIA-like and participation/monotonicity-like) runnable in a spreadsheet.
          3.  Handle partial ballots/recusals.
          4.  Identify where the procedure fails.
          5.  Run the procedure on three cases: (a) The Borda decoy mess, (b) Two units free (top 2 vs. re-run), (c) Cardinal scoring (0-10 scale).
          6.  Be honest about confidence and uncomfortable truths (e.g., dictatorship, power of shortlister).
      *   **Tone:** Practical, honest, clear (for non-experts), rigorous but accessible.

  2.  **Deconstruct Arrow's Theorem in this Context:**
      *   Arrow's Theorem states: No ranked voting system can satisfy Unrestricted Domain, Non-Dictatorship, Pareto Efficiency, and Independence of Irrelevant Alternatives (IIA) simultaneously when there are 3+ options.
      *   *Translation for Co-op:* You can't have a perfect ranking system. Something has to give. Usually, it's IIA (the Borda problem) or Non-Dictatorship (one person decides) or Unrestricted Domain (limiting how people vote).
      *   *The "Shortlist" Issue:* Arrow assumes the set of alternatives is fixed. Here, the Membership Coordinator controls the set. This is a massive loophole/power center. If the Coordinator adds a "decoy," they change the outcome. This violates the spirit of IIA even before the voting starts.

  3.  **Drafting the Decision Procedure (The "Arrow Audit"):**
      *   Need a step-by-step flow for the committee to evaluate their rules.
      *   *Step 1: Input.* What ballots can we realistically get? (Rankings vs. Scores).
      *   *Step 2: The Shortlist Power.* Acknowledge the Coordinator's role.
      *   *Step 3: The Trade-off.* Which Arrow condition do we drop?
      *   *Step 4: Failure Tests.* How to check the specific vulnerabilities.
      *   *Step 5: Edge Cases.* Recusals, ties, partial info.

  4.  **Addressing the Failure Mode Tests:**
      *   Test 1 (IIA/Decoy): Add a dummy candidate to the spreadsheet. Does the order of real candidates change?
      *   Test 2 (Participation/Monotonicity): If a voter stays home (or ranks their favorite lower), does their favorite do *better*? (This is actually the "No-Show Paradox" or Monotonicity failure). The prompt asks: "a committee member's ballot shouldn't be able to hurt their own top choice, and a member who stays home shouldn't be able to help theirs." This is Monotonicity + Participation.
      *   *Spreadsheet implementation:* Simple copy-paste and re-calc.

  5.  **Handling Partial Ballots/Recusals:**
      *   Arrow assumes complete rankings. Real life doesn't.
      *   *Solution:* Treat unranked candidates as tied for last place (Borda) or use a system that handles truncation (like Approval or Score). But since they want a *ranking* output, we need to map partial to complete.
      *   *Recusal:* Treat as "abstain." In 7 people, 6 votes.

  6.  **Running the Three Cases:**
      *   *(a) Borda Decoy:* Show mathematically why Borda fails IIA.
      *   *(b) Two Units:* Top 2 vs. Re-run. This is about "Consistency" or "Agenda Independence." If you pick Top 2, then one drops out, does #3 become the new #1? Or do you re-vote? Re-voting is safer but vulnerable to strategic nomination. Picking Top 2 is efficient but assumes the ranking is robust.
      *   *(c) Cardinal Scoring (0-10):* This moves from *Ordinal* (Arrow's domain) to *Cardinal* (Utilitarian). Arrow doesn't apply directly because Arrow is about *rankings*. However, Score Voting has its own issues (strategic exaggeration). It "dodges" Arrow by changing the input type, but introduces "Intensity of Preference" problems.

  7.  **The "Uncomfortable Truth":**
      *   The Membership Coordinator holds the real power (Gatekeeping).
      *   To satisfy IIA, you essentially need a Dictator or a very rigid rule (like a lottery among qualified).
      *   Score voting avoids Arrow but invites strategic voting (give your favorite 10, everyone else 0).

  8.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the difficulty.
      *   **Part 1: The Arrow Audit Procedure.** (The questions).
      *   **Part 2: The Spreadsheet Tests.** (Concrete instructions).
      *   **Part 3: Partial Ballots & Recusals.**
      *   **Part 4: Running the Cases (a, b, c).**
      *   **Part 5: The Hard Truths & Confidence.**

  9.  **Self-Correction/Nuance Check:**
      *   *Confidence:* I need to be careful not to misrepresent Arrow. Arrow applies to *ordinal* rankings. Score voting is *cardinal*. I must explain that distinction clearly.
      *   *Shortlist Power:* The prompt emphasizes this. I need to make sure the "Audit" highlights that the Coordinator is effectively a "Nominator Dictator."
      *   *Simplicity:* Keep the spreadsheet tests very basic (Sum, Rank, Compare).
      *   *Legal/Consistency:* Emphasize that *changing* the rule mid-stream is worse than a flawed rule. The rule must be fixed *before* applicants apply.

  10. **Drafting the Content (Iterative refinement):**
      *   *Procedure:* Make it a checklist.
      *   *Tests:* Give specific Excel formulas if possible (e.g., `RANK.AVG`).
      *   *Case C:* Be clear that Score Voting satisfies IIA *technically* (because it's not ordinal) but fails "Strategy-Proofness."
      *   *Confidence:* High on the Borda failure. Medium on the "best" alternative because "best" is a value judgment. Low on the specific legal implications (I'm not a lawyer).

  11. **Final Review against Constraints:**
      *   7 volunteers? Yes.
      *   Spreadsheet? Yes.
      *   Older members? Keep jargon low.
      *   Lawyer? Emphasize written rules.
      *   Shortlist power? Highlighted.

  12. **Final Polish:** Ensure the tone is empathetic but firm. The user suspects the answer is unpleasant; confirm that suspicion gently. (e.g., "The power isn't in the voting; it's in the shortlist.")

  *(Self-Correction during drafting)*: Wait, regarding Case (b) "Two units free." If we rank 1-5, and take top 2, that's standard. But if #1 declines, does #3 move up? Yes. The issue is if we re-run the vote *after* #1 is gone. If the voting method violates IIA, re-running might change the order of #2 and #3. I need to explain that *re-running* is safer for fairness but costs time, while *taking top 2* is faster but assumes the method is robust. Actually, if the method violates IIA, taking the top 2 from a list of 5 might yield a different pair than running for 2 slots specifically. I should recommend fixing the method to be "Rank everyone, fill slots in order" to avoid re-voting inconsistencies.

  *(Refining the "Shortlist" point)*: Arrow assumes the set of candidates is fixed. If the Coordinator changes the set, Arrow's conditions are technically about the *aggregator*, not the *nominator*. However, practically, if the aggregator is sensitive to irrelevant alternatives (like Borda), the Nominator has power. If the aggregator is IIA-compliant (like Pairwise/Condorcet - though that has cycles), the Nominator has less power over the *relative* ranking of existing candidates. I need to make this distinction clear.

  *(Refining Confidence)*: I am very confident Borda fails IIA. I am confident Score Voting escapes Arrow's specific constraints but invites other games. I am moderately confident in the procedural advice, but I must state I am an AI, not a parliamentarian expert.

