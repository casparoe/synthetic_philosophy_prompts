answer: |-
  This is a classic social choice problem wrapped in a very human, high-stakes context. You are correct to be worried: the incident you described (a "decoy" candidate changing the winner) is a violation of the **Independence of Irrelevant Alternatives (IIA)**. Arrow's Theorem proves that no ranked voting system can satisfy IIA along with a few other basic fairness conditions simultaneously.

  Since you cannot have a perfect system, you must choose which imperfection you can live with. Below is a decision procedure designed for your constraints (spreadsheet, volunteers, legal consistency) that operationalizes Arrow's insights without requiring a degree in economics.

  ---

  ### Part 1: The "Arrow Audit" Procedure
  *Use this checklist when adopting or reviewing your allocation rule. Do this **before** any applications are reviewed for a cycle.*

  **Step 1: Define the Input (The Ballot)**
  *   **Question:** What exactly are committee members submitting?
  *   **Adequate Answer:** "We are submitting [Ranked Lists / Scored Cards / Approved Lists]."
  *   **Hard Stop:** If the answer is "We'll discuss it in the room," stop. The lawyer requires a fixed rule.
  *   **Values Call:** Ranked lists (Ordinal) trigger Arrow's limits. Scores (Cardinal) avoid Arrow but invite strategic exaggeration (everyone gives their favorite a 10 and everyone else a 0).
  *   **Confidence:** High. This defines the mathematical game you are playing.

  **Step 2: Acknowledge the Gatekeeper (The Shortlist)**
  *   **Question:** Who decides which names appear on the ballot?
  *   **Adequate Answer:** "The Membership Coordinator creates the shortlist based on [Written Criteria X, Y, Z]."
  *   **Hard Stop:** If the Coordinator has discretion to add/remove names without written criteria, they are the *de facto* dictator. No voting rule can fix this.
  *   **Values Call:** You must decide if you trust the Coordinator more than the Committee. If not, the Committee must ratify the shortlist before voting.
  *   **Confidence:** High. This is the biggest vulnerability in your specific setup.

  **Step 3: Choose Your Poison (The Arrow Trade-off)**
  *   **Question:** Which Arrow condition are we willing to violate?
  *   **Adequate Answer:** "We accept that adding a losing candidate might change the winner (Violating IIA)" **OR** "We accept that one person might have veto power (Violating Non-Dictatorship)" **OR** "We accept that the system might sometimes produce no clear winner (Violating Universality)."
  *   **Hard Stop:** You cannot answer "None."
  *   **Values Call:** Most co-ops choose to violate IIA (using Borda or similar) because it's easiest to count, but you have already seen the cost of that.
  *   **Confidence:** High. This is the core of the theorem.

  **Step 4: Define the Output (The Ranking)**
  *   **Question:** How do we convert votes to a list?
  *   **Adequate Answer:** "We calculate [Score/Sum] and sort descending. Ties are broken by [Lottery / Seniority / Chair's vote]."
  *   **Hard Stop:** Ties must be breakable. A "tie" is not a valid output for housing allocation.
  *   **Confidence:** High.

  **Step 5: The Stability Check**
  *   **Question:** If the top candidate declines, does the rest of the list stay in order?
  *   **Adequate Answer:** "Yes, the ranking is fixed regardless of who accepts."
  *   **Hard Stop:** If the rule says "Re-vote if #1 declines," you risk the IIA problem happening *after* the vote.
  *   **Confidence:** Medium. Re-voting is fairer but inconsistent. Fixed lists are consistent but rigid.

  ---

  ### Part 2: The Two Failure Mode Tests (Spreadsheet Protocol)
  *Run these tests on your voting template **before** you use it for real applicants. Use dummy data.*

  **Test 1: The "Decoy" Test (Independence of Irrelevant Alternatives)**
  *   **Goal:** Ensure a loser cannot change the winner.
  *   **Setup:** Create a sheet with 5 dummy applicants (A, B, C, D, E) and 7 dummy voters.
  *   **Action 1:** Run your voting rule. Record the ranking (e.g., A > B > C).
  *   **Action 2:** Add a 6th applicant (F) who is universally ranked last by everyone.
  *   **Action 3:** Run the rule again.
  *   **Pass Condition:** The relative order of A, B, and C must not change.
  *   **Fail Condition:** If B moves ahead of A because F was added, **reject the rule.** (This is what happened to you with Borda).
  *   **Confidence:** High. This is a direct test of IIA.

  **Test 2: The "No-Show" Test (Participation & Monotonicity)**
  *   **Goal:** Ensure voting honestly doesn't hurt your favorite, and staying home doesn't help them.
  *   **Setup:** Use the same 5 applicants, 7 voters.
  *   **Action 1:** Run the rule. Note the winner.
  *   **Action 2:** Delete one voter's ballot entirely (simulate staying home).
  *   **Action 3:** Run the rule.
  *   **Pass Condition:** The absent voter's #1 choice should not move *up* the ranking (or win) compared to when they voted.
  *   **Action 4:** (Monotonicity) Take a voter who ranked X #1. Change their ballot to rank X #2.
  *   **Pass Condition:** X should not move *up* the ranking as a result of being ranked lower.
  *   **Fail Condition:** If X wins when you stay home, or wins when you rank them lower, **reject the rule.**
  *   **Confidence:** Medium. This is harder to spot in a spreadsheet but critical for trust.

  ---

  ### Part 3: Handling Partial Ballots & Recusals
  *Arrow assumes complete rankings. You have real life.*

  1.  **Partial Rankings (Top 5 only):**
      *   **Rule:** Any applicant not ranked is treated as tied for last place.
      *   **Why:** If you leave them blank, the spreadsheet might treat them as "0" or "Error." Explicitly define "Unranked = Last."
      *   **Risk:** This encourages voters to only rank their favorites to avoid boosting people they dislike.
      *   **Confidence:** High. This is standard Borda/Score handling.

  2.  **Recusals (Conflict of Interest):**
      *   **Rule:** The member submits *no ballot*. The total score is averaged over the remaining 6 members, not divided by 7.
      *   **Why:** If you divide by 7, a recusal acts as a "0" score, punishing the applicant.
      *   **Risk:** With only 7 members, losing one vote changes the weight of the others (1/6 vs 1/7).
      *   **Values Call:** Is it fairer to have 6 strong votes or 7 diluted votes? Most ethics boards prefer 6 strong votes.
      *   **Confidence:** High.

  ---

  ### Part 4: Running the Procedure on Your Cases

  #### Case (a): The Borda Mess (Decoy Applicant)
  *   **Diagnosis:** Your current system failed **Test 1 (The Decoy Test)**.
  *   **Why:** Borda Count assigns points based on position (1st = 5 pts, 2nd = 4 pts...). When you added the decoy, everyone shifted down one slot. The point *gaps* between the real candidates changed, altering the sum.
  *   **Verdict:** **Borda is unsafe for your co-op.** It gives the Membership Coordinator (who sets the shortlist) the power to manipulate the outcome by adding "filler" candidates.
  *   **Fix:** You need a system that looks at *pairwise* comparisons (who beats whom) or Cardinal Scores.

  #### Case (b): Two Units Free (Top 2 vs. Re-run)
  *   **Option 1: Take Top 2 from the Ranking.**
      *   *Pros:* Fast. Consistent.
      *   *Cons:* If #1 declines, #2 gets the unit. If #2 also declines, #3 gets it. This assumes the ranking is robust (which Borda proved it isn't).
  *   **Option 2: Re-run the Ballot for the remaining unit.**
      *   *Pros:* Reflects current will.
      *   *Cons:* Vulnerable to **Test 1**. If you remove #1 and re-run, the presence of #2 might now suppress #3 differently than before. You could end up with a different winner than if you had just picked #3 from the original list.
  *   **Recommendation:** **Take Top 2 (or Top 3) from a single robust ranking.**
      *   *Why:* Re-running invites inconsistency. If your voting rule passes Test 1, the order shouldn't change when the winner leaves. If your rule fails Test 1, re-running won't save you; it will just make the manipulation harder to spot.
      *   *Caveat:* Generate a "Waitlist Ranking" of at least 3 names every time, even if only 1 unit is open.
      *   **Confidence:** Medium-High. This minimizes administrative drift.

  #### Case (c): The 0–10 "Housing Need" Scale (Cardinal Voting)
  *   **Does it dodge Arrow?** **Yes.** Arrow's Theorem applies to *ordinal* rankings (1st, 2nd, 3rd). It does not apply to *cardinal* scores (0 to 10) because scores contain information about *intensity* of preference, not just order.
  *   **The Cost:** It invites **Strategic Exaggeration**.
      *   *Scenario:* I think Applicant A is a 9 and B is a 8. But I know everyone else likes B. To help A, I vote A=10, B=0.
      *   *Result:* The scores become meaningless noise. Everyone becomes a "10 or 0" voter.
  *   **Does it relocate the problem?** Yes. It moves the problem from "Ordering" to "Calibration."
      *   *Question:* Is my "7" the same as your "7"?
      *   *Risk:* One member's "urgent need" (10) is another member's "moderate need" (6). Without calibration, the member who scores highest on average dominates the outcome.
  *   **Verdict:** This is viable **IF** you define the scale rigidly.
      *   *Example:* "10 = Homeless tonight. 5 = Current housing unsafe. 1 = Minor inconvenience."
      *   *If you define the scale:* It is often fairer than Borda.
      *   *If you don't define the scale:* It is worse than Borda.
      *   **Confidence:** High on the theory; Medium on the practical implementation (volunteers hate rigid rubrics).

  ---

  ### Part 5: The Hard Truths (What you might not want to hear)

  **1. The Power is in the Shortlist, not the Vote.**
  You noted the Membership Coordinator draws the shortlist. If you use a voting system that fails Test 1 (like Borda), the Coordinator effectively chooses the winner by deciding who *else* is on the list.
  *   **The Fix:** The Committee must ratify the shortlist *before* voting begins. If the Committee rejects the shortlist, no vote happens. This shifts power back to the 7 of you.
  *   **Confidence:** Very High. This is the structural reality of your organization.

  **2. To Satisfy Arrow, You Need a Dictator or a Lottery.**
  If you want a system that *never* fails Test 1 (IIA) and *never* fails Test 2 (Monotonicity), the only mathematical solutions are:
  *   **Dictatorship:** One person's ranking is the final ranking. (Legally risky, morally hard).
  *   **Random Lottery:** Among qualified applicants, pick names from a hat. (Satisfies all fairness criteria, but ignores "need").
  *   **Confidence:** Very High. This is the literal conclusion of Arrow's Impossibility Theorem.

  **3. "Consensus" is a Hidden Veto.**
  If your current culture is "we discuss until we agree," you are running a **Unanimity Rule**.
  *   **Failure Mode:** One person can hold the process hostage to get their #1 pick. This violates the "Non-Dictatorship" condition in reverse (everyone is a dictator).
  *   **Recommendation:** Move to a written scoring rule (Case C with rigid definitions) to protect volunteers from interpersonal pressure.

  ### Final Recommendation for Your Tuesday Night

  1.  **Abandon Borda.** It failed your reality test.
  2.  **Adopt Defined Score Voting (Case C).**
      *   Create a 1-page rubric defining what a 10, 5, and 0 look like for "Housing Need."
      *   Require members to score based *only* on the rubric, not "gut feeling."
      *   Average the scores.
      *   *Why:* It dodges Arrow, is easy to explain to the 70-year-old members ("Higher score wins"), and reduces the Coordinator's power to manipulate via shortlist padding (adding a decoy doesn't change the absolute score of real applicants).
  3.  **Ratify the Shortlist.** Before scoring, the 7 of you must vote Yes/No on the list of applicants. If No, the Coordinator must revise.
  4.  **Generate a Waitlist of 3.** Always score enough people to fill the unit plus two backups. Do not re-vote if #1 declines.
  5.  **Document It.** Write this into your committee bylaws. "In the event of a tie, [Lottery/Chair Vote]."

  **Confidence Statement:**
  I am **highly confident** that Borda failed you due to IIA violation. I am **highly confident** that Score Voting avoids Arrow's specific constraints but requires rubric discipline to avoid strategic gaming. I am **moderately confident** in the procedural advice, as organizational culture often overrides written rules, but this is the most robust mathematical framework available for your constraints.

  **The bit I am least sure of:** The "Defined Score" rubric. Volunteers often resist rigid scoring criteria, feeling it dehumanizes the process. If they refuse to use the rubric, Score Voting collapses back into subjective Borda-like ranking, and you lose the mathematical safety. You must enforce the rubric for the math to hold.
