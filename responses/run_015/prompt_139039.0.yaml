answer: |-
  **Stage One: Structural Commitments of Lexical-Threshold Negative Utilitarianism**

  *   **The Lexical Veto:** Any single instance of suffering exceeding a fixed intensity threshold renders an outcome impermissible, regardless of the quantity of pleasure generated elsewhere.
  *   **Below-Threshold Commensurability:** Beneath the veto line, pains and pleasures must be traded off using a common hedonic currency, despite the view offering no metaphysical justification for why these distinct qualitative states are fungible.
  *   **Threshold Arbitrariness:** The precise location of the veto threshold is necessarily arbitrary, yet it functions as the sole determinant of moral permissibility.
  *   **The No-Tunnelling Rule:** Sub-threshold pains cannot be aggregated to constitute a threshold-level harm; infinite mild headaches never equal one broken bone.
  *   **The Discontinuity Problem:** A phenomenologically negligible increase in pain intensity (crossing the threshold) results in an infinite discontinuity in moral value.
  *   **The Epistemic Burden:** Administrative application requires precise phenomenological measurement of subjective states that are inherently private and unobservable.

  ***

  **Stage Two: Hedonic Impact Statement #442-B**

  **CITY OF VERIDIA**
  **DEPARTMENT OF HEDONIC COMPLIANCE**
  **PUBLIC WORKS DIVISION**

  **PROJECT:** Oakhaven Playground Resurfacing Initiative
  **DATE:** 14 October 2024
  **STATUS:** Final Determination

  **1.0 REGULATORY FRAMEWORK**
  Pursuant to Ordinance 99-L (The Lexical Protection Act), all municipal projects must undergo a Hedonic Impact Statement (HIS). The City operates under a Lexical-Threshold Negative Utilitarian decision rule. Per Section 4.2, any projected instance of suffering exceeding 7.5 McGill Pain Matrix Units (MPM) constitutes a Prohibited Harm Event (PHE). PHEs cannot be offset by pleasure gains. Below 7.5 MPM, Standard Pleasure Units (SPU) and Minor Pain Units (MPU) are traded according to the Exchange Schedule (Table 1).¹

  **2.0 OPTIONS ANALYSIS**
  Two alternatives were assessed for the Oakhaven site:

  *   **Option A (Splash Pad):** Installation of hydraulic water features.
  *   **Option B (Rubberized Asphalt):** Installation of heat-retentive recycled rubber matting.

  **3.0 FINDINGS**

  **3.1 Threshold Compliance**
  Option A projects a 0.4% annual probability of a slip-and-fall incident resulting in a fractured radius (estimated 8.2 MPM). This exceeds the 7.5 MPM veto threshold. Under the No-Tunnelling Provision,² this single event cannot be mitigated by the projected 450,000 SPU of childhood joy generated annually. Option A is rejected.

  Option B projects no incidents exceeding 4.0 MPM. However, thermal retention will cause mild foot discomfort (1.5 MPM) to approximately 200 users daily during summer months. While the aggregate discomfort is substantial, sub-threshold pains are non-cumulative regarding veto status.³ Option B complies.

  **3.2 Net Hedonic Benefit (Below Threshold)**
  For Option B, pains and pleasures are calculated using the Council-approved Exchange Schedule.

  | Unit Type | Conversion Factor (to SPU) | Total Projected Volume (10 yrs) | Net SPU |
  | :--- | :--- | :--- | :--- |
  | **Play Pleasure** | 1.0 | 1,500,000 | +1,500,000 |
  | **Thermal Discomfort** | -0.45⁴ | -600,000 | -270,000 |
  | **TOTAL** | | | **+1,230,000** |

  **4.0 DETERMINATION**
  The Department finds that Option B maximizes net hedonic value without triggering a Lexical Veto. While Option A produces higher total utility, the presence of a single Prohibited Harm Event renders it morally impermissible. Option B distributes discomfort widely but ensures no individual citizen breaches the intensity threshold. This outcome aligns with the City's commitment to preventing severe harm while maintaining fiscal and hedonic efficiency.

  **5.0 APPROVAL**
  Project Manager: J. Millsworth
  Signature: *[Signed]*

  ***

  **FOOTNOTES**

  ¹ *Exchange Schedule 2024.* The ratio of 1 SPU to 2.2 MPU was calibrated by external consultants to align with Council Policy Goal 7 (Infrastructure Continuity). See Appendix C for sensitivity analysis showing how varying the ratio affects project viability.

  ² *Ordinance 99-L, Section 4.5.* "No quantity of sub-threshold suffering shall be deemed equivalent to a threshold-crossing event." This prevents the aggregation of minor grievances into a veto, ensuring that widespread mild inconvenience does not paralyze public works.

  ³ *Aggregation Protocol.* While sub-threshold pains sum for utility calculations, they do not sum for intensity classification. A thousand citizens experiencing 1.5 MPM pain does not constitute one citizen experiencing 1500 MPM pain, nor does it constitute a single 7.5 MPM event.

  ⁴ *Conversion Note.* The negative weight assigned to thermal discomfort was adjusted downward following public consultation, acknowledging that children's pain reporting is often inconsistent. See Appendix D (Methodological Adjustments).

  **APPENDICES**
  Appendix A: McGill Pain Matrix Calibration Charts
  Appendix B: Risk Assessment for Fractured Radii
  Appendix C: Exchange Rate Sensitivity Analysis
  Appendix D: Methodological Adjustments regarding Juvenile Pain Reporting
