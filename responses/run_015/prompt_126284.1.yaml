      *   *Body Paragraph 2 (The State's Motive):* Why do they kill him? Not just for the murder, but for his refusal to play the social game (the trial, the chaplain). The execution is a ritual of silencing truth. This aligns with *Reflections on the Guillotine* regarding the "premeditated murder" of the state.
      *   *Body Paragraph 3 (The Bureaucracy):* Compare the essay's view of bureaucracy (hiding violence) with the novel's view (mechanical inevitability). The novel makes it visceral.
      *   *Conclusion:* What does the novel add? It moves the argument from "mercy" to "metaphysical rebellion."

  6.  **Final Polish:**
      *   Ensure tone is academic but engaged (matching the user's "committed take" request).
