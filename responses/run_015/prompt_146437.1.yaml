answer: |-
  **Project Title:** An Ontology of Communicative Harm: Reconstructing Augustine's Taxonomy of Lies

  **Project Summary**
  Augustine's *De Mendacio* presents an eight-grade taxonomy of falsehood that remains philosophically puzzling. Contemporary scholarship typically interprets this hierarchy either as a rigid deontological ladder or as an incoherent compromise with his own absolute prohibition. Both interpretations struggle to explain why lying about religious doctrine ranks as the gravest offense while lying to save a life ranks as the least severe, particularly given that both instances arguably corrupt belief-formation. This project proposes that current scholarship leaves this open because it seeks a metric of moral wrongness where Augustine intends an ontology of communicative harm.

  **Research Question and Thesis**
  The central research question asks: Can Augustine's hierarchy be reconstructed not as a scale of culpability but as a map of relational dependency? I hypothesize that the grading tracks which foundational relationship—divine, neighborly, or self-constitutive—a given falsehood corrupts. Lies against doctrine disrupt the divine dependency; lies against property disrupt the neighborly; lies of jest disrupt the self-constitutive. This reframing explains the ranking without recourse to consequentialist calculation.

  **Methodology**
  The methodology employs close textual exegesis of *On Lying* and *Against Lying*, supplemented by Augustine's semiotics in *On Christian Doctrine*. To clarify the mechanism of harm without anachronism, I will utilize modern speech-act theory heuristically. This involves treating Augustinian signs as performative acts that establish relational realities, while rigorously avoiding the imposition of modern linguistic semantics onto patristic theology. This distinction ensures the analysis remains hermeneutically faithful while leveraging contemporary tools to articulate implicit structures.

  **Work Plan**
  *   **Months 1–2:** Close reading of *De Mendacio* and *Contra Mendacium*. Annotation of the eight grades with specific attention to the stated rationale for ranking.
  *   **Months 3–4:** Comparative analysis with Augustine's account of signs and doctrine. Construction of the "relational dependency" model.
  *   **Months 5–6:** Testing the model against edge cases, specifically the midwife example (lying to protect life) and the heretic example (lying about doctrine). Final assessment of whether the model collapses into consequentialism.

  **Feasibility and Risk Assessment**
  The six-month timeline is necessary for part-time execution; a standard four-month semester would require narrowing the edge-case analysis. All texts are available in standard critical editions; no travel or archival access is required. A failure result would look like one of two outcomes: either the dependency model requires ignoring explicit textual claims to maintain coherence, or the reconstruction inevitably collapses into a form of consequentialism that Augustine explicitly rejects. In either case, the negative result yields philosophical value by clarifying the limits of non-consequentialist accounts of speech in late antiquity. The deliverable will be a seminar-length paper suitable for workshop presentation.
