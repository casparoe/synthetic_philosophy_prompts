answer: |-
  **Project Title:** Stability Conditions for Sequential Satisficing: Leakage, Calibration, and Normative Viability

  **Research Question**
  Can a satisficing strategy constitute a stable equilibrium for an agent choosing repeatedly over time, or does the internal logic of resource allocation inevitably force a collapse into optimization or a degradation of standards?

  The standard debate regarding satisficing is deadlocked. Proponents argue it is a distinct normative account for boundedly rational agents; critics argue it is merely optimization with search costs included in the objective function. This stalemate persists because both sides analyze *static, one-off decisions against a fixed menu*. In the static case, the critic is usually right: any stopping rule can be rationalized as maximizing net payoff. My project shifts the locus of analysis to *sequential choice with endogenous thresholds*. I ask whether satisficing can remain distinct from optimization when an agent makes a series of decisions over time, where resources saved in period *t* affect capabilities in period *t+1*, and where aspiration levels adapt based on past performance.

  Specifically, I will investigate two structural threats to sequential satisficing:
  1.  **The Leakage Problem:** If satisficing in Domain A frees cognitive resources, and those resources are deployed to Domain B, does the marginal value of those resources bid up the aspiration level in Domain A until it matches the optimum?
  2.  **The Calibration Regress:** If aspiration levels adapt to experience, what prevents a ratchet effect where thresholds drift downward following failures, eroding the agent's standards without triggering a corrective optimization mechanism?

  **Why Standard Approaches Leave This Open**
  The optimization-with-search-costs reply assumes a fixed value for cognitive effort. It cannot account for Leakage because it treats the cost of deliberation as an exogenous parameter rather than a resource with an opportunity cost that fluctuates based on the agent's broader satisficing regime. If the marginal value of attention is strictly positive everywhere, satisficing is unstable; if it can be zero (genuine satiation of attention), satisficing may hold. The standard literature assumes the former without proof.

  Similarly, adaptive aspiration levels are typically treated as psychological heuristics rather than normative constraints. The Calibration Regress is dismissed as a psychological bug, not a structural feature. However, if the rule for setting thresholds is itself subject to satisficing, we face an infinite regress unless there is a fixed point. Standard decision theory ignores this because it assumes exogenous preferences; Simonian traditions acknowledge it but lack a formal account of when adaptive rules become self-undermining. Neither framework determines whether a "stable satisficer" is a coherent possibility or a contradiction in terms.

  **Methodology**
  I will construct a **minimal formal toy model of sequential choice**. While purely conceptual analysis is an option, a formal structure is necessary to satisfy the requirement for a determinate answer. Conceptual work risks dissolving into terminological disputes about what counts as "optimization." A toy model forces precise definitions of "stability," "leakage," and "drift," allowing us to prove whether specific configurations of resource utility and threshold adaptation rules permit a non-optimizing equilibrium.

  The model will not aim for empirical realism or complex stochastic control. It will isolate the logic of the threshold. I will model an agent making a sequence of choices over discrete time steps. The agent has a finite budget of cognitive attention. In each step, they select an option that meets an aspiration level $\alpha_t$. Unused attention carries over. The aspiration level updates via a function $f(\alpha_t, \text{outcome}_t)$.

  I choose this over pure conceptual analysis because the Decision Theorist reader requires a result that is not merely a clarification of vocabulary. A formal model yields conditions (inequalities or fixed-point theorems) that define the boundary between stable satisficing and collapse. It satisfies the Simonian reader by treating the satisficing structure as a serious normative competitor, testing its internal coherence rather than assuming its psychological plausibility.

  **Work Plan (Nine Months)**
  *   **Months 1–2: Formalization of the Baseline.** Define the sequential environment. Specify the "Leakage" mechanism: a function mapping saved attention in period $t$ to increased search capability or aspiration in $t+1$. Define the "Optimizer" benchmark for comparison.
  *   **Months 3–5: Modeling Leakage.** Analyze the resource allocation dynamic. I will test whether there exists a utility function for attention where the marginal value drops to zero, preventing the "bidding up" of thresholds. *Deliverable:* A lemma establishing necessary conditions for attention satiation.
  *   **Months 6–7: Modeling Calibration.** Introduce the adaptive threshold function. Analyze the dynamics of $\alpha_t$ under sequences of failure. I will look for hysteresis effects where $\alpha_t$ decreases monotonically without bound. *Deliverable:* A proof or counter-example regarding the existence of a lower-bound constraint on $\alpha_t$ that does not rely on external optimization.
  *   **Month 8: Synthesis.** Combine the resource and threshold models. Determine if a "Stable Satisficing Region" exists in the parameter space.
  *   **Month 9: Writing.** Draft the final paper, focusing on the normative implications of the stability conditions.

  **Expected Results and Failure Conditions**
  *   **Positive Result:** I identify a specific set of constraints on the marginal utility of attention and the threshold adaptation rate that allows satisficing to remain distinct from optimization over time. For example, proving that if the marginal value of attention is non-monotonic, leakage stops before optimization is reached.
  *   **Negative Result:** I prove that under any plausible condition where attention has positive marginal value, satisficing thresholds inevitably converge to optimizing thresholds, or that adaptive thresholds inevitably drift without an external optimizing constraint. This would be a significant philosophical result: it would demonstrate that bounded rationality requires *external* scaffolding (social norms, hard constraints) to remain stable, as it cannot sustain itself internally.
  *   **Project Failure:** The project fails if the model becomes trivial (e.g., stability is guaranteed by definition) or intractable (the dynamics cannot be solved within the fellowship period). It also fails if I retreat into conceptual definitions rather than deriving conditions from the model structure.

  **Scope and Limitations**
  My ambition here is to solve the normative coherence of satisficing, but that is a multi-year project. To ensure completion in nine months, I must strictly limit the scope:
  1.  **No Empirical Validation:** I will not test these models against psychological data. This is a project in normative decision theory, not behavioral economics. The question is whether satisficing *can* be rational, not whether humans *are* satisficers.
  2.  **No General Theory of Bounded Rationality:** I am not solving the general problem of computational limits. I am focusing exclusively on the stability of the aspiration level mechanism.
  3.  **Single-Agent Focus:** I will not model game-theoretic interactions. Leakage and Calibration are treated as intra-personal dynamics. Introducing strategic interaction would triple the complexity.
  4.  **Exclusion of "Deep" Regress:** I will treat the threshold adaptation rule as given for the purpose of the stability test. I will not solve the regress of "who sets the adaptation rule," but rather show what properties that rule must have to prevent collapse.

  This project isolates the structural vulnerability of satisficing. If satisficing is to be a viable normative alternative to optimization, it must survive the test of time and resource reallocation. This fellowship will determine if it can.
