answer: |-
  Here is the adjudication of the debate, evaluated move-by-move, followed by an overall judgment and an analysis of the structural blind spots.

  ### Evaluation of the Ten Moves

  **1. Rowan (Guilt = Act/Repair; Shame = Self/Hide)**
  *   **Strength:** Mostly Right.
  *   **Analysis:** This is a philosophically standard distinction and serves as a strong opening axiom. It correctly identifies the functional advantage of guilt in a clinical setting: it is actionable. However, it relies on a stipulative definition of shame as necessarily global and pathological. It succeeds in setting the terms but fails to prove that shame *must* function this way, leaving it vulnerable to Adela's counter-definition.

  **2. Adela (Guilt = Dischargeable; Shame = Character)**
  *   **Strength:** Clearly Right.
  *   **Analysis:** This successfully targets the weakness in Rowan's functional claim. Rowan argues guilt is better because it leads to repair; Adela points out that repair can be transactional ("checking the box") without preventing recurrence. She also correctly notes that Rowan has defined shame at its pathological extreme. This move shifts the debate from "which emotion is nicer" to "which emotion secures future safety."

  **3. Rowan (Shame = Exposure-Dependent; Empirical Risk)**
  *   **Strength:** Right on Trigger, Debatable on Outcome.
  *   **Analysis:** Rowan correctly identifies the structural dependency of shame on an audience (real or imagined). This is a strong argument against cultivating shame in a system where anonymity is common. The empirical claim (shame leads to aggression) is plausible but overgeneralized; it succeeds in raising a risk flag but fails to disprove Adela's claim that *local* shame is possible.

  **4. Adela (Guilt = Corruptible Conscience; Trigger vs. Object)**
  *   **Strength:** Clearly Right.
  *   **Analysis:** This is Adela's strongest philosophical move. She turns Rowan's "solitary agent" argument against him: if guilt relies on internal belief, and beliefs can be corrupt, guilt is unreliable. The distinction between *trigger* (exposure) and *object* (the self) is crucial; it dismantles Rowan's claim that no audience means no shame. It forces Rowan to move from psychology to sociology (Move 5).

  **5. Rowan (Macro-Sociology; Emotion as Infrastructure)**
  *   **Strength:** Right on Macro, Wrong on Micro.
  *   **Analysis:** Rowan correctly notes that broad emotional repertoires track social structures (honor vs. guilt societies). This is a strong check against policy hubris. However, it contradicts Move 1: if emotions are infrastructure, a committee cannot "engineer" guilt either. This move concedes the point that culture cannot simply "choose," but it changes the subject from "what should we try" to "what is historically possible."

  **6. Adela (Indirect Choice; Institutional Design)**
  *   **Strength:** Mostly Right.
  *   **Analysis:** Adela rescues the possibility of agency. She accepts Rowan's structural constraint but argues for indirect influence (institutions shape emotions). This is a successful rebuttal to Rowan's determinism. However, she implicitly assumes that institutional design *successfully* translates to emotional change, which Rowan challenges in the next move.

  **7. Rowan (The Concession Trap; Spectacle Risk)**
  *   **Strength:** Strong Logical Pressure.
  *   **Analysis:** Rowan correctly identifies a tension in Adela's position: if institutions shape emotion, and institutions are prone to spectacle (as shame often is), then "designed shame" may be unstable. He argues that if Adela admits choice is indirect, she has conceded Rowan's point that direct policy is impossible. This is a strong dialectical move, though it risks a strawman: Adela never claimed choice was *direct*.

  **8. Adela (Ritual Design; Terminus and Reintegration)**
  *   **Strength:** Right in Theory, Optimistic in Practice.
  *   **Analysis:** Adela refines her position: shame is dangerous only when unritualized. She argues for a specific design (naming the act, route back to standing). This successfully addresses Rowan's "hiding/attack" objection. However, it assumes the hospital can sustain the "small, stable community" required for such rituals, which Rowan targets next.

  **9. Rowan (Contextual Relativity; Strangers vs. Neighbors)**
  *   **Strength:** Clearly Right.
  *   **Analysis:** This is the synthesis move. Rowan concedes shame works *in principle* (for neighbors) but argues it fails *in context* (hospital as anonymous system). He redefines "better" as context-dependent. This is the strongest move in the debate because it accepts Adela's moral psychology while rejecting its applicability to their specific institutional reality.

  **10. Chair (The Administrator Case)**
  *   **Strength:** Decisive.
  *   **Analysis:** This case is not merely an example; it is a structural test that neither account fully passes. It reveals that both emotions rely on a *connection* (to a victim or a community) that bureaucratic harm severs.

  ### Overall Adjudication

  **Who is more right?**
  **Rowan** is more right about the **hospital context**, but **Adela** is more right about **moral psychology**.

  Rowan correctly identifies that a large, anonymous, bureaucratic institution functions like a "society of strangers." In such a structure, shame lacks the audience required to trigger it, and guilt lacks the specific victim required to direct repair. His conclusion (Move 9) that guilt is the "emotion for strangers" is the most pragmatically sound position for a hospital committee.

  However, Adela is more right that guilt alone is insufficient for long-term safety culture. Her point that guilt is "dischargeable" (Move 2) is a critical insight: a clinician can feel guilty, apologize, and repeat the error next week because their *character* or *habits* haven't changed. Rowan's framework risks creating a culture of transactional apology without transformation.

  **Is the dispute partly verbal?**
  Yes, on three key terms:
  1.  **"Better":** Rowan defines "better" as *instrumental for repair* (fixing the immediate breach). Adela defines "better" as *constitutive for character* (preventing future breach). They are arguing past each other until Move 9, where Rowan accepts relativity.
  2.  **"Culture":** Rowan treats culture as a **macro-historical force** (Move 5: honor societies vs. guilt societies). Adela treats culture as a **micro-institutional design** (Move 8: restorative conferencing). Rowan is right that you cannot turn a hospital into a village; Adela is right that you can design specific workflows within the hospital.
  3.  **"Choice":** Rowan treats choice as **direct selection** (deciding to feel X). Adela treats choice as **indirect cultivation** (designing practices that evoke X). Rowan attacks the former while Adela defends the latter.

  ### Analysis of the Administrator Case (Move 10)

  The case involves foreseeable harm, unidentified victims, and no witnesses.

  **Rowan's Account (Guilt):**
  *   **Implication:** Guilt attaches to the *act*. The administrator committed an act (designing the policy). Therefore, guilt is theoretically possible.
  *   **Failure:** Rowan's Move 1 states guilt "carries its own instruction about what to do next" (repair, compensate). In this case, repair is impossible (victims unknown).
  *   **Revelation:** When repair is impossible, Rowan's functional definition of guilt collapses. Guilt without the possibility of restitution becomes toxic rumination or is simply suppressed. The case reveals that guilt is **dependent on the possibility of repair**. If the system prevents repair, guilt cannot function as a moral compass.

  **Adela's Account (Shame):**
  *   **Implication:** Shame attaches to the *self* (being the sort of person who harms). The administrator *is* a harm-causer. Therefore, shame is theoretically possible.
  *   **Failure:** Adela's Move 4 distinguishes trigger (exposure) from object (self). However, Move 3 (which she does not fully refute) notes shame is triggered by exposure. Here, there is no exposure.
  *   **Revelation:** The case reveals that shame is **dependent on an audience**. Without a community to witness the failure, or victims to reflect the harm back, the "external check" Adela values (Move 6) is absent. The administrator remains "honorable" in the eyes of their peers because the harm is invisible.

  **Synthesis:**
  The case demonstrates that both emotions are **relational technologies**. Guilt requires a relationship with a *victim* (to repair). Shame requires a relationship with a *community* (to witness). Bureaucratic harm severs both relationships. The administrator is isolated from the victim by anonymity and from the community by secrecy. Neither emotion can gain traction.

  ### What Both Are Missing

  Your guess is that they assume "one emotion must do all of the moral work." While true, there is a deeper structural error in their shared framework.

  **Both Rowan and Adela assume a Retrospective Sanction Model.**
  They both treat moral emotion as a **reaction to a past failure**.
  *   Rowan: Wrong Act → Guilt → Repair.
  *   Adela: Bad Self → Shame → Character Correction.

  They are debating which *sanction* is more effective after harm has occurred. They both miss the **Prospective Stewardship Model**.

  In a high-reliability environment like a hospital, the primary moral obligation is not to *feel bad* when things go wrong, but to *maintain vigilance* so they do not go right. The Administrator case was not a failure of emotion (the administrator likely felt neither guilt nor shame); it was a failure of **imagination and constraint**.

  The missing element is **Responsibility without Fault**.
  Both parties assume that moral emotion is triggered by *fault* (I did wrong / I am bad). The Administrator case describes *systemic risk*—harm that arises from the normal functioning of a policy, not necessarily a deviation.
  *   If you rely on Guilt, you only catch deviations (acts).
  *   If you rely on Shame, you only catch character flaws (selves).
  *   Neither catches **structural inevitability**.

  By focusing on how to make the agent *feel* about the harm, both Rowan and Adela ignore the need to make the system *incapable* of producing the harm regardless of the agent's feelings. They are trying to tune the engine's alarm system when the problem is the steering mechanism. The committee should not be asking "Which emotion should we cultivate?" but "Which constraints render the emotion irrelevant?"
