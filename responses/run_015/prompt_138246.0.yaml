      *   Verdict: Rowan is more right *for this specific committee*, but Adela identifies the long-term risk of Rowan's view.

  5.  **Analyze the Verbal Dispute/Implicit Assumptions:**
      *   "Better": Better for what? Repair (Rowan) vs. Character Formation (Adela).
      *   "Culture": Macro-society (Rowan M5) vs. Institutional Micro-culture (Adela M6/M8).
      *   "Choice": Direct selection (Rowan's strawman) vs. Indirect cultivation (Adela's claim).
      *   Both assume emotions are distinct, stable categories that can be isolated.

  6.  **Apply to Administrator Case (Move 10):**
      *   *Rowan:* Guilt needs an act. There was an act (policy design). Guilt should work *unless* the agent doesn't feel it. But Rowan said guilt needs repair. If repair is impossible, guilt becomes toxic (or Adela's point about discharge applies). Actually, Rowan M1 says guilt carries instruction to repair. If repair is impossible, guilt has no instruction. So Rowan's system stalls.
