      *   Rowan: Guilt -> Repair -> Safety.
      *   Adela: Shame -> Character -> Safety.
      *   Missing: In a high-reliability organization (hospital), safety is ensured by *constraints and redundancy*, not moral emotion. Relying on *any* moral emotion is the error. The Administrator case proves this: the harm was foreseeable and systemic. No emotion fixes that; only structural change does.
      *   This aligns with Rowan's M5 (infrastructure) but Rowan still wants guilt. I will argue they both want to use emotion as a *tool*, whereas the case shows emotion is a *symptom*.

  8.  **Drafting the Response:**
