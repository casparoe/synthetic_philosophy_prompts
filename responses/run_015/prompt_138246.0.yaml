      *Final Plan for "Missing":* They both operate within a **Fault-Based Framework**. They assume harm implies a moral failure that requires an emotional tax (guilt or shame). The Administrator case describes *systemic risk realization* where individual fault is diffuse or absent. The missing element is a **Responsibility-without-Fault** framework (or Stewardship), where the focus is on obligation to the vulnerable rather than emotional reckoning for the agent.

