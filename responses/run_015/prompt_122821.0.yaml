prompt: |-
  I am writing a short position note for a reading group on reasoning under logical uncertainty, and I have gotten stuck between two pictures of what a computationally bounded agent's credence in an unproved mathematical claim ought to be, so I would like a careful comparison of them. The running example I keep using is a small planning system that has to allocate a bounded formal-verification budget across many independent arithmetic claims (primality and factorization claims about specific large numbers, say) and then decide, for each one, whether to keep verifying or to stop and treat the claim as settled for the purposes of acting. Concretely: at what point should it stop burning compute and accept something like a 0.97 credence in a claim whose certificate it has not yet checked?

  The first picture is the market-based one I have seen discussed under the heading of logical induction: an agent's credences are treated as prices in a market where each sentence is a share worth one unit if the sentence is true and nothing otherwise, and the central requirement is that no polynomial-time computable trading strategy with a finite risk tolerance can make unbounded profits against those prices over time. As I understand it, the appeal is that a large family of desirable properties falls out of that single criterion, and that the prices converge to the truth on any given sentence eventually. My worry is that the guarantee looks purely asymptotic: there is, as far as I can tell, no computable bound on how long convergence takes, and the no-exploitation criterion does not obviously say anything that justifies acting on today's prices in a decision that will be made once, tomorrow. The second picture is what I have been calling proof-conditioning: the agent maintains an explicit prior over the behaviour of its own theorem prover (how probable it is that a search to depth d would have turned up a proof of a given claim if a proof of that size exists), and then treats both a discovered proof and an exhausted failed search as ordinary evidence, updating on them Bayesian-style. This gives finite-time, decision-relevant numbers, and it degrades gracefully when the prover is weak, but it seems to require the agent to have a second-order model of its own search's power and honesty, and it is not clear to me what, if anything, stops it from being badly wrong in cases where the connection between proof-length and evidence is itself the thing in question.

  A coauthor has proposed splitting the difference with what he calls the horizon rule: for any claim that the prover could in principle settle within the agent's decision horizon, defer to proof-conditioning; for claims that lie beyond the horizon, defer to the market prices. I would like you to compare the two underlying pictures, and this hybrid, along the following lines. Which of them gives the more defensible account of the credence the agent should actually act on in my verification-budget example, and does the hybrid inherit the defects of both parts or avoid them? How should each handle (a) claims that are true but whose shortest proofs are astronomically long, (b) claims independent of the agent's formal system, where there is no proof to be found at any depth, (c) self-referential claims about the agent's own future outputs, which the agent's prices can influence, and (d) a prover that is subtly unsound? More generally, is there any credible finite-horizon normative standard — some bounded analogue of Dutch-book or accuracy arguments — by which one could criticize or defend the market criterion's guidance for a one-shot decision, or is the asymptotic character of that criterion simply the wrong kind of thing to ground decision-making in? Please say plainly where you think my framing of either picture is mistaken.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Context:** Writing a position note for a reading group on reasoning under logical uncertainty.
      *   **Problem:** Stuck between two pictures of credence for a computationally bounded agent regarding unproved mathematical claims.
      *   **Running Example:** A planning system allocating a bounded formal-verification budget across independent arithmetic claims (primality/factorization) and deciding when to stop verifying and act on a credence (e.g., 0.97).
      *   **Picture 1: Market-based (Logical Induction).** Credences = prices. Criterion = No poly-time trading strategy makes unbounded profit. Properties = Convergence to truth eventually. Worry = Asymptotic guarantees, no computable bound, unclear justification for one-shot decisions *now*.
      *   **Picture 2: Proof-Conditioning (Bayesian/Model-based).** Agent models its own theorem prover (probability of finding proof at depth $d$). Updates on proof/no-proof as evidence. Properties = Finite-time numbers, graceful degradation. Worry = Requires second-order model of search power/honesty, risk of being wrong about proof-length/evidence connection.
      *   **Picture 3: Hybrid (Horizon Rule).** Defer to proof-conditioning within decision horizon, market prices beyond horizon.
      *   **Tasks:**
          1.  Compare the two underlying pictures.
          2.  Evaluate the hybrid (does it inherit defects or avoid them?).
          3.  Determine which gives a more defensible account for the *verification-budget example*.
          4.  Analyze handling of specific cases: (a) True but long proofs, (b) Independent claims, (c) Self-referential claims, (d) Unsound prover.
          5.  Address the normative standard question: Is there a finite-horizon analogue to Dutch-book/accuracy for the market criterion, or is asymptotics the wrong tool?
          6.  Critique the user's framing if mistaken.

  2.  **Initial Assessment & Framing Critique:**

      *   *User's Framing of Logical Induction:* The user worries it's "purely asymptotic" and offers no guidance for one-shot decisions. This is a common critique, but Logical Induction (LI) *does* produce prices at every finite step. The issue isn't that it *can't* be used, but that the *guarantee* is asymptotic. However, LI prices at time $t$ are the best estimate *given the computational constraints up to $t$* against a specific class of traders.
      *   *User's Framing of Proof-Conditioning:* This sounds like "Algorithmic Probability" or a specific Bayesian model of proof search. The worry about "second-order model" is valid (meta-uncertainty).
      *   *The Core Tension:* LI is "externally justified" (no exploitation by efficient traders) but "asymptotically guaranteed." Proof-conditioning is "internally justified" (coherent with a model) but "model-dependent."
      *   *The Example:* Budget allocation is inherently a *decision problem* under resource constraints. This favors the Proof-Conditioning view because it explicitly models the resource (depth $d$) vs. probability of success. LI treats the price as the output, but doesn't inherently tell you *when to stop searching* unless the price movement is modeled as part of the trading game.

  3.  **Drafting the Comparison (Picture 1 vs. Picture 2):**

      *   **Logical Induction (LI):**
          *   *Strengths:* Robust against unknown unknowns (doesn't need a perfect model of the prover). Handles logical correlations well (if $A \to B$, prices respect that).
          *   *Weaknesses:* The "no arbitrage" condition is a limit property. At finite $t$, prices can be weird if the traders haven't "found" the pattern yet. It doesn't explicitly model *search cost*.
      *   **Proof-Conditioning (PC):**
          *   *Strengths:* Directly incorporates the resource constraint (depth $d$). Provides a likelihood ratio for "no proof found yet."
          *   *Weaknesses:* Garbage In, Garbage Out. If the prior over proof distributions is wrong, credences are wrong. Vulnerable to Goodharting the metric.

  4.  **Evaluating the Hybrid (Horizon Rule):**

      *   *Idea:* Use PC for "near" claims, LI for "far" claims.
      *   *Risk:* Discontinuity at the horizon. Why trust LI for far claims if you don't trust the prover model for near claims? If the prover model is bad for near claims, why is the market price better for far claims? The market price *depends* on the same computational substrate.
      *   *Verdict:* It feels like an ad-hoc patch. It inherits the model-dependence of PC for the near term and the asymptotic looseness of LI for the long term.

  5.  **Addressing the Specific Cases (a-d):**

      *   (a) *True but long proofs:* LI will eventually converge but might stay low for a long time. PC will lower credence as search fails (depending on the prior tail). PC is better for deciding *to stop searching* because it explicitly models the tail.
      *   (b) *Independent claims:* LI converges to a value (often 0.5 if symmetric, or based on patterns). PC will drive credence based on the prior probability of independence vs. provability. PC is risky here if the prior assumes provability.
      *   (c) *Self-referential:* LI handles this best (fixed point property). PC creates loops (my belief affects my search which affects my belief).
      *   (d) *Unsound prover:* LI prices reflect the *market's* view of truth, not the prover's output. If the prover is unsound but the market knows, prices adjust. PC trusts the prover model; if the model assumes soundness, PC breaks.

  6.  **The Normative Standard Question:**

      *   Is there a finite-horizon Dutch book?
      *   *Standard LI:* No, the guarantee is asymptotic.
      *   *Bounded Rationality:* There are "Bounded Dutch Book" arguments (e.g., Schervish, or work by Garrabrant et al. on bounded proper scoring rules).
      *   *Key Insight:* For a *one-shot* decision, the relevant norm is **expected utility maximization given the current information state**. LI prices are designed to be unexploitable *in the limit*, not necessarily optimal *now*. PC prices are designed to be optimal *now* *if the model is right*.
      *   *Conclusion:* The asymptotic character is indeed the wrong tool for grounding a *one-shot* decision *unless* you view the decision as part of a long sequence of similar decisions (where the asymptotic guarantee matters). For a single budget allocation, the PC approach (or a decision-theoretic variant) is more actionable, provided the meta-model is calibrated.

  7.  **Refining the Critique of User's Framing:**

      *   *Correction on LI:* LI isn't just asymptotic. It satisfies "Bounded Proper Scoring" properties at finite times relative to the trader class. However, the user is right that it doesn't give a *stopping rule* for verification.
      *   *Correction on PC:* It's not just "Bayesian updating." It's specifically modeling the *process of verification*. This is closer to "Optimal Search" or "Rational Metareasoning."
      *   *The Real Conflict:* It's not LI vs. PC. It's **Coherence (LI)** vs. **Calibration/Utility (PC)**. LI ensures you don't lose money to traders. PC ensures you allocate budget efficiently.

  8.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the depth of the problem. Validate the tension.
      *   **Section 1: Critique of Framing.** Clarify LI's finite properties and PC's nature (Rational Metareasoning).
      *   **Section 2: Comparison for the Verification Example.** Why PC (Metareasoning) wins for *budget allocation*, while LI wins for *final credence* if no more compute is available.
      *   **Section 3: The Hybrid.** Explain why it's unstable (the "seam" problem).
      *   **Section 4: Case Analysis (a-d).** Walk through the specific scenarios.
      *   **Section 5: Normative Standards.** Address the finite-horizon Dutch book question. Introduce "Bounded Calibration" or "Value of Information."
      *   **Conclusion:** Recommendation for the position note.

  9.  **Self-Correction/Nuance Check during drafting:**

      *   *Wait, does LI handle verification budget?* Not directly. LI assumes the prices are generated by some algorithm. If the algorithm includes verification, the prices reflect the *current* state of verification. But LI doesn't tell you *whether to run more verification*. That's a meta-decision.
      *   *PC is essentially Rational Metareasoning.* I should use that term. It frames the "model of the prover" as a model of computation cost vs. probability of success.
      *   *The "One-Shot" worry:* The user asks about a decision made "once, tomorrow." LI is weak here. PC is strong here *if* calibrated.
      *   *Unsound Prover:* If the prover is unsound, LI traders can exploit the prover's output if they know it's unsound. PC assumes the model matches reality. If the model says "sound" and reality is "unsound," PC fails hard. LI is more robust to prover flaws *if* the market detects them.

  10. **Final Polish:** Ensure tone is appropriate for a reading group position note (rigorous, philosophical but grounded). Make sure to directly answer the "plainly where you think my framing is mistaken" prompt. (The main mistake is viewing LI as *only* asymptotic and PC as *only* about proof existence rather than search cost).

  **(Self-Correction on the Hybrid):** The hybrid suggests using LI for claims beyond the horizon. But LI prices *at time t* are computed by the agent *at time t*. If the claim is beyond the horizon, the agent can't verify it. So the LI price *is* the only price available. The hybrid is actually just "Use PC to decide when to stop, then use the resulting probability." The "defer to market prices" part is confusing because the market price *is* the current credence. I need to clarify that the hybrid is likely conflating "current LI price" with "asymptotic LI limit." I should point this out.

  **(Refining the Normative Argument):** The finite-horizon norm isn't Dutch Book. It's **Value of Information (VoI)**. You stop verifying when the expected cost of verification exceeds the expected gain in decision quality from the updated credence. This bridges LI and PC. PC estimates the VoI. LI provides the credence *after* the decision.

  Okay, ready to write.
answer: |-
  This is a sophisticated dilemma that cuts to the core of the "logical uncertainty" program. You are effectively asking whether the normative force of logical uncertainty comes from **external coherence** (Logical Induction/market criteria) or **internal calibration** (Bayesian metareasoning/proof-conditioning).

  Here is a comparison of the two pictures, an evaluation of the hybrid, and a critique of your framing, structured to help you draft your position note.

  ### 1. Critique of Your Framing

  Before comparing the pictures, I need to correct two subtle misconceptions in your setup, as they influence which picture appears more defensible.

  **On Logical Induction (LI):** You characterize the LI guarantee as "purely asymptotic" and therefore ill-suited for one-shot decisions. This is partially mistaken. While the *convergence to truth* is asymptotic, the *no-arbitrage condition* holds at every finite step relative to the class of traders computable within that budget. At time $t$, the LI prices are the unique set of prices that prevent a specific class of efficient traders from bankrupting the agent *given the information available at $t$*.
  *   **Correction:** The weakness of LI is not that it lacks finite-time guidance, but that its finite-time guidance is **passive**. It tells you what price is coherent *given your current compute*, but it does not inherently tell you whether spending more compute to update that price is worth it. It is a theory of *state*, not a theory of *search*.

  **On Proof-Conditioning (PC):** You describe this as maintaining a prior over the theorem prover's behavior. In the literature, this is closer to **Rational Metareasoning** or **Algorithmic Probability**. Your worry is that it requires a "second-order model."
  *   **Correction:** This is not a bug; it is the feature required for budget allocation. To decide whether to verify, you *must* model the probability that verification yields a proof as a function of cost. The risk is not that you have a model, but that your model is **miscalibrated**. If your prior over proof lengths is wrong, your stopping rule is wrong.

  **The Real Tension:** The conflict is not "Asymptotic vs. Finite." It is **Coherence vs. Calibration**.
  *   **LI** guarantees you won't be money-pumped by efficient traders (Coherence).
  *   **PC** guarantees you allocate budget optimally *if* your meta-model is accurate (Calibration/Utility).

  ### 2. Comparison for the Verification-Budget Example

  In your specific example (allocating a bounded verification budget), **Proof-Conditioning (Rational Metareasoning) is the more defensible account for the decision to stop.**

  Here is why:
  The decision to stop verifying is a decision about **Value of Information (VoI)**. You stop when $Cost(Verify) > ExpectedUtility(UpdatedCredence) - ExpectedUtility(CurrentCredence)$.
  *   **LI** gives you the $CurrentCredence$. It does not, by itself, give you the distribution over $UpdatedCredence$. It tells you the price *now*, but not how the price *moves* if you spend more compute.
  *   **PC** explicitly models the relationship between compute depth and probability of proof discovery. It allows you to estimate the VoI.

  **Verdict:** For the specific question "When should I stop burning compute?", the market picture is silent (or requires complex meta-traders to simulate search), while the proof-conditioning picture is direct. However, for the question "What credence should I hold *after* I stop?", LI provides a stronger normative defense against exploitation, whereas PC is only as good as its meta-prior.

  ### 3. Evaluation of the Hybrid (Horizon Rule)

  Your coauthor's proposal (PC within horizon, LI beyond) inherits the defects of both and fails to resolve the tension.

  **The Defect:** The "Horizon" creates a discontinuity in justification.
  1.  **Why trust LI beyond the horizon?** If you do not trust your meta-model of the prover for claims within the horizon (where you can check it), why trust the market prices for claims beyond the horizon? The market prices are generated by the *same* computational substrate. If your prover model is flawed, the LI traders (who are also computable by that substrate) may also fail to correct the prices in the short term.
  2.  **The "Seam" Problem:** Consider a claim whose shortest proof is exactly at the horizon boundary. A tiny change in the budget shifts it from "PC zone" to "LI zone." Does the normative status of your credence change discontinuously?
  3.  **Redundancy:** At time $t$, the LI price *is* the price resulting from all computation done so far. Deferring to "market prices" for far claims is just deferring to your current best estimate. Deferring to PC for near claims is deciding *whether to change that estimate*. The hybrid conflates the *value* (the credence) with the *process* (the verification).

  **Verdict:** The hybrid is unstable. It attempts to patch the "asymptotic" worry of LI with PC, but for the claims where PC is used, you still need a normative standard for the *resulting* credence. You end up needing LI to justify the PC output anyway.

  ### 4. Handling Specific Cases

  Here is how the two pictures (and the hybrid) handle your four edge cases.

  **(a) True claims with astronomically long proofs**
  *   **LI:** Prices will remain low (or uncertain) until a trader finds a pattern or a short cut. It will not falsely converge to 1 quickly. It is conservative.
  *   **PC:** Depends entirely on the prior tail. If the prior assigns non-zero mass to "proofs longer than budget," the credence will stabilize below 1. If the prior assumes proofs are usually short, PC will incorrectly drive credence to 0 as search fails.
  *   **Winner:** **LI** is more robust here, as it doesn't rely on a specific parametric assumption about proof length distributions.

  **(b) Claims independent of the formal system**
  *   **LI:** Prices will converge to a value reflecting the "pattern" of the claim (e.g., 0.5 for random-looking bits, or a specific value if there is a probabilistic heuristic). It treats truth as a limit of the market.
  *   **PC:** Will eventually exhaust search. If the meta-model knows about independence, it updates to the prior probability of the claim being true (e.g., based on heuristic density). If the meta-model assumes completeness, it will drive credence to 0 incorrectly.
  *   **Winner:** **Tie/Context.** PC is better if the agent *knows* independence is possible. LI is better if the agent is agnostic.

  **(c) Self-referential claims (Agent's own outputs)**
  *   **LI:** This is LI's strong suit. The fixed-point construction handles self-reference naturally (prices reflect what the market expects the agent to believe).
  *   **PC:** Highly vulnerable to loops. "I believe I will output X" $\to$ "I search for proof I will output X" $\to$ "Finding proof changes output." Requires careful causal modeling (e.g., EDT vs. CDT distinctions).
  *   **Winner:** **LI.**

  **(d) A subtly unsound prover**
  *   **LI:** If the unsoundness creates a pattern exploitable by poly-time traders, LI prices will correct away from the prover's output. LI prices reflect *truth*, not *provability*.
  *   **PC:** If the meta-model assumes the prover is sound, PC will treat "Prover says P" as definitive evidence. It will become dogmatically confident in falsehoods.
  *   **Winner:** **LI.** (This is a critical failure mode for PC).

  ### 5. The Normative Standard: Finite-Horizon Dutch Books?

  You ask: *Is there any credible finite-horizon normative standard... or is the asymptotic character... simply the wrong kind of thing?*

  The asymptotic character is the wrong tool for a **one-shot** decision, but LI is not limited to asymptotics. The correct finite-horizon normative standard is **Bounded Calibration** or **Bounded Proper Scoring**.

  1.  **Bounded Dutch Book:** There is no strict Dutch Book argument for finite time because a sufficiently complex arbitrage strategy might simply not have run yet. However, there are **Bounded Exploitation** arguments. You can say: "My credences are defensible because no trader *with budget B* could have exploited me *given my budget B*."
  2.  **Value of Information (VoI):** For your planning example, the normative standard is not Dutch Book, but **Expected Utility**. You should stop verifying when the marginal cost of compute exceeds the marginal expected utility gain from a potentially updated credence.
      *   This requires PC (to estimate the gain).
      *   But it requires LI (to ensure the credence you act on isn't incoherent).

  **Recommendation:** Do not look for a "Finite Dutch Book" to justify LI for one-shot decisions. Instead, argue that LI provides the **coherence constraints** on the credence, while PC provides the **stopping rule** for the search. They are orthogonal tools.

  ### 6. Summary for Your Position Note

  If I were writing this note, I would argue the following synthesis:

  1.  **Reject the Dichotomy:** The choice is not between LI and PC. It is between **Credence Formation** (LI) and **Resource Allocation** (PC).
  2.  **The Role of LI:** Use Logical Induction to define what a "reasonable credence" looks like at any snapshot in time. It protects you from incoherence and unsound provers (Cases c & d).
  3.  **The Role of PC:** Use Proof-Conditioning (Metareasoning) to decide *when to take the snapshot*. It models the cost of moving from current prices to future prices.
  4.  **Critique the Hybrid:** The Horizon Rule is unnecessary. You use PC to decide when to stop; whatever LI price you have at that moment is the one you act on. You do not switch normative frameworks based on the claim's difficulty.
  5.  **Addressing the One-Shot Worry:** Acknowledge that LI's asymptotic guarantee is insufficient for one-shot normative force. Replace it with a **Bounded Coherence** argument: "I act on this price because it is the best estimate computable within my constraints that avoids exploitation by competitors with similar constraints."

  **Where your framing is most mistaken:**
  You imply that LI offers no justification for acting on today's prices. It does: it justifies them as the **unexploitable prices relative to your computational peer group**. The worry isn't that LI is asymptotic; the worry is that LI doesn't tell you if you should have computed *more*. That is a question for Proof-Conditioning.

  **Final Advice:**
  For the verification-budget example, **Proof-Conditioning is the engine, Logical Induction is the steering.** You need PC to decide when to stop the engine. But you need LI to ensure that when you stop, the reading on the dashboard (the credence) isn't lying to you because of a logical inconsistency or an unsound prover. The hybrid fails because it tries to make LI the engine for "hard" problems, where it has no traction (no search model). Stick to PC for the *decision to stop*, and LI for the *validity of the belief*.
