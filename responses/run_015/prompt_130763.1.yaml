  I know the weight that presses on my palm,
  The solid knock of knuckles against grain,
  No spirit hides inside this heavy arm,
  No ghost within the varnish or the stain.
  It holds the wine, it holds the plate of food,
  A thing made solid out of simple wood.

  Stood straight perhaps when it was living tree,
  But now the sap has dried within the vein,
  And split into the threads that compose me,
  This smoothness is a lie told by the plane,
  Beneath the touch, a rough and splintered fiber.

  Shiver the strands when pulled apart by light,
  Dissolving into dust that floats unseen,
  No solid left to catch the eye or bite,
  Just empty space around the silent atom.

  Phantom designs that hold the dust in place,
  An invisible web of push and pull,
  To hold the void with a relentless force.

  Source of the pull? another pull before,
  A circle with no center, or no floor.
