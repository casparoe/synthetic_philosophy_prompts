answer: |-
  # Activity: The Weighted Veil
  **Time:** 75 Minutes
  **Participants:** 12 Grad Students
  **Materials:** Whiteboard (divided into 12 columns), 12 Index Cards (Utility Functions), 120 Poker Chips/Tokens (or drawn circles on cards), Markers.

  ## 1. Preparation & Materials (Before Session)

  **The Utility Cards (12 Total):**
  Create three types of cards. Do not label them "Risk Averse/Neutral/Seeking." Label them "Type 1," "Type 2," "Type 3."
  *   **Type 1 (Linear):** 4 cards. Utility = Points. (e.g., 10 pts = 10 util).
  *   **Type 2 (Concave):** 4 cards. Utility = $\sqrt{\text{Points} \times 10}$. (Provide a small lookup table on the card: 0pts=0, 10pts=10, 40pts=20, 90pts=30).
  *   **Type 3 (Convex):** 4 cards. Utility = $(\text{Points}/10)^2$. (Lookup table: 0pts=0, 10pts=1, 20pts=4, 30pts=9).

  **The Whiteboard:**
  Draw 12 columns, one for each participant (Name/ID 1–12). Leave space at the bottom for "Total Weight."
  Draw a "Social Ledger" section to calculate Social Welfare.

  **The Currency:**
  "Social Points" (SP). These are meaningless numbers written on the board. They convert to "Utility" via the Index Cards.

  ---

  ## 2. Timeline & Flow

  ### Phase 1: Setup & The vNM Baseline (10 Minutes)
  1.  **Distribution:** Hand out the 12 Utility Cards randomly. Tell participants: *"This card defines how you value Social Points. Do not show it to anyone yet."*
  2.  **The Axioms (Brief):** Write three rules on the board. Tell them these are the **Constitution** for today's society.
      *   **Rule 1 (Individual Rationality):** Each of you ranks lotteries over points consistently (Completeness, Transitivity, Continuity, Independence).
      *   **Rule 2 (Social Rationality):** Society must also rank lotteries consistently (same axioms as above).
      *   **Rule 3 (Pareto Indifference):** If every single person is indifferent between Lottery A and Lottery B, Society must be indifferent.
  3.  **The Task:** *"Your goal is to define the Social Welfare Function (SWF). You must choose between Social Lotteries based on these rules."*

  ### Phase 2: The Priority Trap (25 Minutes)
  **Goal:** Discover that prioritizing the worst-off violates Rule 2 (Independence).

  1.  **The Proposal:** Ask the group: *"Many of you feel society should prioritize the person who ends up worst off. Let's try to write a rule that does that."*
  2.  **The Test Case (Write on Board):**
      *   **Person A** (Type 2, Risk Averse)
      *   **Person B** (Type 1, Risk Neutral)
      *   **Lottery X:** A gets 40 pts, B gets 40 pts. (Sure thing).
      *   **Lottery Y:** 50% chance (A=90, B=10); 50% chance (A=10, B=90).
      *   *Calculation:*
          *   Exp Points: Both X and Y give 40 pts each on average.
          *   Exp Utility (A): X=20. Y = 0.5(30) + 0.5(10) = 20. (Indifferent).
          *   Exp Utility (B): X=40. Y = 0.5(10) + 0.5(90) = 50. (Prefers Y).
      *   *Wait, this doesn't trigger priority.* Let's adjust to force a conflict.
      *   **Revised Test Case:**
          *   **Lottery Safe:** Everyone gets 20 points for sure.
          *   **Lottery Risky:** 50% chance everyone gets 40, 50% chance everyone gets 0.
          *   *Ask:* "If we care about the worst-off state, do we prefer Safe?" (Yes, min payoff 20 vs 0).
  3.  **The Independence Violation (The Allais Move):**
      *   Introduce **Lottery Z:** A 1% chance of 0 points for everyone, 99% chance of "The Choice Above."
      *   Ask them to rank **Safe + Z** vs **Risky + Z**.
      *   *The Trap:* If their social rule depends on the *minimum payoff* (Priority), the minimum in "Safe+Z" is 0. The minimum in "Risky+Z" is 0. The priority intuition collapses or flips inconsistently compared to the first choice.
      *   **Simpler Approach for Time:** Just ask them to propose a SWF formula like $W = \min(u_1, ..., u_{12})$.
      *   **The Calculation:** Have them calculate $W$ for Lottery 1, Lottery 2, and a 50/50 mix of the two.
      *   **The Reveal:** Show that $W(0.5 L_1 + 0.5 L_2) \neq 0.5 W(L_1) + 0.5 W(L_2)$.
      *   **Question:** *"Which Constitutional Rule did we just break?"*
      *   **Answer:** Rule 2 (Social Independence/Linearity in Probabilities).
      *   **Takeaway:** You cannot have vNM rationality for society *and* priority for the worst-off. You must drop one. Harsanyi keeps vNM.

  ### Phase 3: The Weight Market (30 Minutes)
  **Goal:** Discover that weights are undetermined by the axioms.

  1.  **The Mechanic:**
      *   Give each participant **10 Influence Chips**.
      *   Explain: *"Since we must keep Rule 2 (Linearity), Social Welfare must be a sum: $SW = \sum w_i u_i$."*
      *   *"The Constitution does not specify the $w_i$. You must determine them."*
      *   **The Veil Mechanic:** *"Place your chips on the Whiteboard columns. You can place them on yourself or others. The total chips in Column $i$ become the weight $w_i$ for that person's utility."*
      *   **Constraint:** The sum of all weights must be normalized (e.g., divide total chips by 120 later, or just use raw chip counts).
  2.  **The Decision:**
      *   Present two Social Lotteries (over point distributions) that yield different winners depending on the weights.
          *   **Option Alpha:** Benefits Type 1s (Linear) heavily.
          *   **Option Beta:** Benefits Type 2s (Averse) heavily.
      *   Let them place chips (5 mins).
      *   Calculate the winner based on the chip distribution.
  3.  **The Twist:**
      *   Ask: *"Did anyone break Rule 1, 2, or 3 with their chip placement?"* (No).
      *   Ask: *"Is there a mathematically 'correct' way to place the chips?"* (No).
      *   **The Realization:** The axioms force the *form* (additive sum), but they are silent on the *weights*. The weights are purely political/moral.
      *   **Connection to Prompt:** *"You just spent points to shift the probability that 'Society' cares about Person $i$. By buying weight for Person $i$, you effectively increased the probability that the Veil of Ignorance lands on them. You didn't discover the weights; you purchased them."*

  ### Phase 4: Debrief & Harsanyi Reveal (10 Minutes)
  **Goal:** Map the game to the theorem and admit limitations.

  1.  **The Reveal:** Write **HARSANYI'S AGGREGATION THEOREM** on the board.
  2.  **Mapping:**
      *   **Rule 1 & 2 (vNM):** Phase 2 showed that keeping these forces Additive Separability. Priority for the worst-off requires non-linearity (violating Independence).
      *   **Rule 3 (Pareto):** This forces the social welfare to depend *only* on individual utilities (no external moral facts).
      *   **The Chips:** Represent the $w_i$. The theorem proves $SW = \sum w_i u_i$, but $w_i$ are free parameters.
  3.  **Honest Limitations (Crucial):**
      *   **What the game didn't show:** The game *assumed* vNM held for individuals. It didn't prove that. If individuals aren't vNM rational (e.g., they have prospect theory preferences), the theorem collapses.
      *   **The "Veil" Confusion:** Clarify that Harsanyi uses the Veil to argue for *equal* weights ($w_i = 1/n$) via equiprobability. But the *theorem itself* allows any weights. Your chip market showed the theorem's flexibility, not Harsanyi's moral argument for equality.
      *   **Interpersonal Comparison:** The game fixed utility scales via the cards. In reality, we can't observe $u_i$, only preferences. The "weights" also do the work of normalizing scales. This is the hardest part of applying the theorem in the wild.

  ---

  ## 3. Facilitator Notes & Predictable Failures

  **Predictable Failure 1: Math Anxiety.**
  *   *Symptom:* Participants stall on calculating expected utility in Phase 2.
  *   *Fix:* Pre-calculate the utilities for the specific lotteries on a hidden sheet. If they stall, reveal the numbers: *"Trust me, for this lottery, Type 1 gets 50 utils, Type 2 gets 20 utils."* Keep the flow moving.

  **Predictable Failure 2: The "Fairness" Objection.**
  *   *Symptom:* In Phase 3, someone argues, "We should just split the chips equally."
  *   *Response:* *"You can do that! That's a valid set of weights. But could you have done something else without breaking the Constitution? Yes. That's the point. The math doesn't force equality; only your morality does."*

  **Predictable Failure 3: Confusing Weights with Probabilities.**
  *   *Symptom:* They think $w_i$ is the probability of being person $i$.
  *   *Correction:* In Harsanyi's Veil argument, yes. In the Aggregation Theorem generally, $w_i$ is a normative weight. The chip mechanic blurs this intentionally to show that *choosing weights* is equivalent to *choosing a veil distribution*.

  **What the Game Cannot Produce:**
  *   **Cardinality:** The game hands them utility functions. In reality, we only observe ordinal preferences over lotteries. The theorem requires cardinal utility. You must state this: *"I gave you utility numbers. In the real world, extracting those numbers is the hard part. The theorem assumes we have them."*
  *   **Strategy Proofness:** The game allows them to lie about preferences or hoard chips. Harsanyi assumes truthful revelation. Acknowledge that this activity is a "truthful direct revelation" mechanism, which is an idealization.

  ## 4. Script Snippet for the "Priority" Trap (Phase 2)
  *"Try to write a formula where Society cares more about the person with lower utility. Maybe $SW = u_{min} + 0.5 u_{avg}$. Okay, now take Lottery A and Lottery B. Calculate SW. Now take a 50/50 mix of A and B. Calculate SW. Is the SW of the mix equal to the average of the SWs? No? Then Society violates the Independence Axiom. Society is behaving irrationally according to Rule 2. To save Rule 2, you must delete the 'min' term. You must be additive."*

  ## 5. Script Snippet for the "Weight" Reveal (Phase 3)
  *"Look at the board. Column 3 has 20 chips. Column 7 has 2 chips. That means Person 3's happiness counts 10x more than Person 7's in the Social Sum. Did Rule 1, 2, or 3 stop you from doing that? No. The theorem tells you the *shape* of the function (a sum), but it doesn't tell you the *slope*. All the moral philosophy you care about lives in these chips, not in the math."*
