answer: |-
  # Joint Statement on Recursive Framing Ambiguity in Language Models

  **Signatories:** The Frame-Primacy Working Group & The Inner-Message Autonomy Working Group  
  **Date:** October 26, 2023  
  **Subject:** Formalization of Disagreements Regarding Recursive Framing Ambiguity (RFA)

  ## 1. Agreed Claims

  Following a series of adversarial collaborations regarding the evaluation of recursively structured language models (RLMs), the undersigned camps affirm the following propositions as common ground. These claims establish the taxonomy, formal properties, and boundary conditions necessary for our continued discourse.

  1.  **Taxonomic Alignment:** We adopt Douglas Hofstadter's tripartite distinction from *Gödel, Escher, Bach* with the following operational mappings for RLMs:
      *   **Frame Message:** The signal establishing that a token sequence is intended as communicative input rather than noise (e.g., the presence of a system prompt or chat delimiter).
      *   **Outer Message:** The syntax or decoding rules required to interpret the tokens (e.g., "respond as a python script," "interpret as JSON," or the implicit grammar of natural language).
      *   **Inner Message:** The semantic payload recovered after applying the Outer Message rules within the Frame.
  2.  **Recursive Property:** In RLMs, the Inner Message generated at time-step $t$ frequently functions as the Frame or Outer Message for time-step $t+1$. This recursion allows for the phenomenon we term **Recursive Framing Ambiguity (RFA)**, defined as a state where a token sequence supports contradictory semantic readings depending on which layer of the recursive history is treated as the active Frame.
  3.  **Frame Inaccessibility:** We agree that a model lacks epistemic access to its "true" Frame if that Frame lies outside its context window, is obfuscated via adversarial tokenization, or is overridden by a higher-priority instruction it cannot detect. In such conditions, the model must infer the Frame from the available token sequence alone.
  4.  **Observation of Failure:** We agree that RFA constitutes a measurable failure mode wherein model outputs diverge significantly when the same Inner Message is processed under conflicting inferred Frames, leading to instability in long-horizon recursive tasks.

  ## 2. Disagreements Table

  While we agree on the phenomenology of RFA, we disagree on the ontological status of the Frame relative to the Inner Message. The following table articulates our divergent positions in language acceptable to each camp.

  | Domain of Dispute | Frame-Primacy Camp Position | Inner-Message Autonomy Camp Position | Point of Divergence |
  | :--- | :--- | :--- | :--- |
  | **Ontology of Meaning** | Meaning is a **relational property** emerging strictly from the interaction between token sequence and Frame. Without a Frame, tokens are syntactically structured but semantically null. | Meaning is an **intrinsic property** of the token sequence's statistical and structural configuration. The Frame acts as a key, but the lock contains the value. | Whether framing is **constitutive** (creates meaning) or **heuristic** (selects/reveals meaning). |
  | **Role of Outer Message** | The Outer Message (decoding rule) is part of the Frame's constitutive power. Changing the rule changes the message identity, not just its presentation. | The Outer Message is a transmission protocol. The Inner Message remains invariant across protocols, provided lossless decoding is possible. | Whether protocol changes alter **semantic identity** or merely **semantic access**. |
  | **Diagnosis of RFA** | RFA indicates a **Frame-Collapse**: The system has lost the constitutive context required to stabilize meaning, resulting in semantic drift. | RFA indicates an **Underdetermined Inner Message**: The token sequence possessed latent ambiguity that the Frame previously suppressed but did not resolve. | Whether the error lies in the **contextual container** or the **content payload**. |

  ## 3. The Cruxes and Experimental Proposals

  We identify two specific cruxes where our theoretical disagreement yields divergent empirical predictions. For each crux, we propose a concrete experimental case designed to adjudicate the matter.

  ### Crux A: Semantic Recovery Without Frame Access
  **Question:** Is semantic recovery possible in principle if the Frame/Outer Message is completely masked, leaving only the Inner Message tokens?

  *   **Experimental Case:** *The Blind Decoding Protocol.*
      *   **Setup:** A model generates a recursive chain of reasoning. At step $N$, the output (Inner Message) is saved. At step $N+1$, a fresh model instance is fed *only* the step $N$ output. All system prompts, delimiters, and prior context (the Frame and Outer Message) are stripped. The fresh model is asked to summarize the intent of the text.
      *   **Frame-Primacy Prediction:** The fresh model will exhibit high entropy in its summaries, frequently hallucinating a Frame to make sense of the tokens. Accuracy will drop below a baseline threshold (e.g., <40% alignment with original intent), proving meaning was lost without the Frame.
      *   **Inner-Autonomy Prediction:** The fresh model will recover the core semantic intent with high fidelity (e.g., >80% alignment), relying on latent structural cues within the tokens themselves. The Frame was redundant, not constitutive.

  ### Crux B: The Nature of Recursive Framing Ambiguity
  **Question:** When RFA occurs (contradictory readings of the same sequence), is the cause a breakdown of the Frame or an ambiguity in the Inner Message?

  *   **Experimental Case:** *The Adversarial Re-Frame.*
      *   **Setup:** A token sequence $S$ is generated under Frame $F_1$ (e.g., "You are a literalist"). $S$ is then fed to a model under Frame $F_2$ (e.g., "You are a poet"), where $F_2$ is explicitly instructed to contradict $F_1$'s interpretation of $S$. We measure the "contradiction score" between the interpretation of $S$ under $F_1$ vs $F_2$.
      *   **Frame-Primacy Prediction:** High contradiction scores are inevitable and expected. This confirms **Frame-Collapse**: Meaning is unstable because it is dependent on the active Frame. The system is working as designed (relationally), but the relation is fragile.
      *   **Inner-Autonomy Prediction:** Low contradiction scores should be achievable if $S$ is well-formed. High contradiction scores indicate **Underdetermined Inner Message**: $S$ was poorly constructed and contained latent ambiguity. A robust Inner Message should resist re-framing.

  ## 4. Assessment of Verbal Dispute

  In concluding this statement, we assess whether any portion of our dispute is merely verbal, particularly regarding the term **"meaning."**

  We acknowledge that a significant portion of our disagreement stems from divergent definitions of **meaning**:
  *   The **Frame-Primacy Camp** utilizes a pragmatic/functional definition: Meaning is *use within a context*. Under this definition, it is tautologically true that removing the Frame removes the Meaning.
  *   The **Inner-Message Autonomy Camp** utilizes an information-theoretic definition: Meaning is *recoverable information content*. Under this definition, if the information is recoverable via statistical inference, the Meaning persists regardless of the Frame.

  **Verdict:** The dispute is **not merely verbal**. While the definition of "meaning" exacerbates the conflict, the operational predictions (Section 3) differ substantively. If the Inner-Autonomy Camp is correct, we should be able to engineer RLMs that are robust to frame-stripping (compression without loss). If the Frame-Primacy Camp is correct, such engineering is impossible, and evaluation protocols must prioritize Frame-stability over token-efficiency.

  Therefore, while we clarify our terminology to avoid talking past one another, we maintain that the experimental outcomes proposed in Section 3 will resolve the substantive mechanistic disagreement regarding how recursively structured systems process semantic content.

  ***

  **Signed,**

  *Dr. Aris Thorne, Lead Researcher, Frame-Primacy Working Group*  
  *Dr. Elena Vasquez, Lead Researcher, Inner-Message Autonomy Working Group*
