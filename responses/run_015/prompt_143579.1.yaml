  Please structure your reply like this:

  - Audience map & thesis recap (brief, ~3 sentences)
  - Objection 1 through Objection 5 (each ~80-120 words; include speaker, phrasing, seriousness, concession, hold, reply)
  - The dreaded hidden objection (the one I'm hoping they skip, with why it's dangerous and a 2-sentence reply)
  - My weakest point (the crack in my arguement, with a defense and an honest admission)
  - Opening concession (what I should say up front to disarm them, ~4 sentences)

  Keep it practical and in the weeds — don't just tell me "some people think values are involved." I need the actual moves.
