answer: |-
  # Activity Design: The Certification Board

  ## 1. Overview & Learning Objective
  **Goal:** Students will experience the tension between *Etiological (Selected-Effect)* and *Causal-Role* accounts of function not as a definitional dispute, but as a conflict between **historical fidelity** (what is this part *for*?) and **systemic utility** (what does this part *do*?).
  **Time:** 75 Minutes.
  **Setup:** 4 Groups of 4 students. Movable chairs clustered around tables.
  **Materials:** Printed Dossiers, Token Budgets, Certification Cards, Whiteboard.

  ## 2. Materials Preparation

  ### A. The Organism: "Unit 734"
  Each group receives a dossier describing the same physical organism, but with different **Provenance Data**.
  **The Parts (4 per organism):**
  1.  **The Pump:** History = Circulation. Current = Circulation. (Agreement Case).
  2.  **The Spur:** History = Defense (predators extinct). Current = Dead weight (metabolic cost). (**Conflict Case 1**: SE = Function/Maintenance; CR = Junk).
  3.  **The Sac:** History = Buoyancy. Current = Oxygen Storage (Critical). (**Conflict Case 2**: SE = Exaptation/Malfunction; CR = Critical Function).
  4.  **The Scar:** History = Random Mutation/Trauma. Current = Structural Support. (**Conflict Case 3**: SE = No Function; CR = Function).

  ### B. Group Assignments (The Matrix)
  *   **Group 1 (Legacy + Survival):** Organism has 4B year lineage. Ticket: *Maintain Viability.*
  *   **Group 2 (Legacy + Fidelity):** Organism has 4B year lineage. Ticket: *Maintain Lineage Integrity.*
  *   **Group 3 (Assembled + Survival):** Organism synthesized 20 years ago. Ticket: *Maintain Viability.*
  *   **Group 4 (Assembled + Fidelity):** Organism synthesized 20 years ago. Ticket: *Maintain Lineage Integrity.*

  *(Note: "Fidelity" is a code word for Reproduction/Lineage continuity, "Viability" for staying alive. This maps to different selection pressures without naming the theories.)*

  ### C. The Budget & Tokens
  *   **Budget:** Each group gets **3 Repair Tokens**.
  *   **Cost:** Certifying a part as **CRITICAL** costs 1 Token. **OPTIONAL** costs 0. **JUNK** costs 0 (but part is removed).
  *   **Constraint:** They *must* spend exactly 3 Tokens. They cannot certify all 4 parts as Critical. They must let one part degrade.

  ### D. Certification Cards
  Each group has a stack of cards labeled:
  *   **CRITICAL** (Guarantees part works next season).
  *   **OPTIONAL** (50% chance part works).
  *   **JUNK** (Part is removed, tokens saved, but capacity lost).

  ## 3. Run of Play (75 Minutes)

  ### Phase 1: Induction & Certification (0:00 – 0:25)
  1.  **Seating (5 min):** Divide into 4 groups. Hand out Dossiers (Legacy vs. Assembled) and Capacity Tickets (Viability vs. Fidelity). Hand out 3 Tokens.
  2.  **The Mandate (2 min):** Read aloud: *"You are the Board. Your organism is degrading. You must certify parts as CRITICAL to receive repair credits. You have 3 credits. You must define 'Functional' based on your Dossier and Ticket. If a part is not Critical, it may fail."*
  3.  **Deliberation (18 min):** Groups argue over the 4 parts.
      *   *Legacy Groups* will see the **Spur** has a history. Do they spend a token on a useless part to honor the lineage (Fidelity) or save the **Sac** (Viability)?
      *   *Assembled Groups* know the **Scar** has no history. Is it Critical because it holds the body together (Viability)?
      *   *Crucial:* Do not define "Function." Let them argue whether "History" matters for the Ticket.

  ### Phase 2: The Twin Reveal & Environment Shift (0:25 – 0:40)
  1.  **The Reveal (5 min):** Announce: *"Intelligence Report: Group 1 and Group 3 are maintaining physically identical organisms. Group 2 and Group 4 are maintaining physically identical organisms. The only difference is the Provenance Data you were given."*
  2.  **The Shock (5 min):** Allow groups to compare notes.
      *   Group 1 (Legacy) might have saved the **Spur** (History). Group 3 (Assembled) likely trashed it (No history, no use).
      *   Group 3 (Assembled) likely saved the **Scar** (Current utility). Group 1 (Legacy) might have trashed it (It's a 'damage' artifact, not 'design').
  3.  **The Environment Shift (5 min):** Hand out **Crisis Cards**.
      *   *New Condition:* "Predators have been reintroduced." (Makes **Spur** valuable again).
      *   *New Condition:* "Atmosphere is thinning." (Makes **Sac** vital).
      *   *Action:* Groups may **swap one Certification** (move a token from one part to another) *without* gaining extra tokens. This forces them to reconsider their definition of function under pressure.

  ### Phase 3: Scoring & Wager (0:40 – 0:55)
  1.  **The Wager (5 min):** Before scoring, ask each group to write on a card: *"If we had known the other Provenance Data at the start, would our Certifications have changed? (Yes/No)"*
  2.  **Scoring (10 min):** Reveal the "Station Master's Key" (The Instructor's Scoring Rubric).
      *   *Viability Score:* Points for parts that currently keep the organism alive (Sac, Scar, Pump).
      *   *Fidelity Score:* Points for parts that match the Selection History (Spur, Pump).
      *   *Calculate:*
          *   Groups 1 & 3 (Viability Ticket): Scored on Current Utility.
          *   Groups 2 & 4 (Fidelity Ticket): Scored on Historical Match.
      *   *The Twist:* The Legacy groups will likely score high on Fidelity but low on Viability (spent tokens on Spur). The Assembled groups will score high on Viability but low on Fidelity (spent tokens on Scar).
      *   *Result:* No group wins perfectly. The conflict is structural.

  ### Phase 4: The Debrief (0:55 – 1:15)
  *(See detailed script below)*

  ## 4. The Debrief Script

  **Step 1: The Data Dump (5 mins)**
  Draw a 2x2 grid on the whiteboard.
  *   Axes: **Legacy vs. Assembled** (Rows) | **Viability vs. Fidelity** (Columns).
  *   Ask each group: *"Which part did you sacrifice? Why?"*
  *   Write their reasons on the board.
      *   *Expected Legacy/Fidelity:* "We saved the Spur. It's part of what the organism *is*."
      *   *Expected Assembled/Viability:* "We saved the Scar. It doesn't matter where it came from, it holds the chest open."

  **Step 2: Naming the Pattern (5 mins)**
  *   Ask: *"Group 1 and Group 3 had the same beast. Group 1 spent tokens on history. Group 3 spent tokens on current mechanics. Why?"*
  *   Prompt: *"Did you feel like you were answering the same question?"*
  *   Let them realize: Group 1 was asking *"What is this part supposed to be?"* Group 3 was asking *"What is this part doing?"*
  *   **Do not introduce the vocabulary yet.** Let them propose names. (e.g., "The History View" vs. "The Engineering View").

  **Step 3: Introducing the Vocabulary (5 mins)**
  *   Supply the terms: **Etiological (Selected-Effect)** vs. **Causal-Role**.
  *   Map their decisions:
      *   *Etiological:* Matches the "Fidelity" groups and the Legacy focus. Function = History of Selection. Allows for **Malfunction** (The Spur is functional even if useless now; The Sac is an exaptation).
      *   *Causal-Role:* Matches the "Viability" groups and the Assembled focus. Function = Causal Contribution to Capacity. No Malfunction, only **Breakdown** (If it works, it has a function).

  **Step 4: The Philosophical Payoff (5 mins)**
  *   **The "Merely Verbal" Objection:** Remind them of the previous lecture. Ask: *"Was this just a definition fight?"*
  *   **The Answer:** No. It was a resource allocation conflict.
      *   If you fund Etiological functions, you preserve **normativity** (the idea that a heart can *fail* to be a heart, not just stop pumping).
      *   If you fund Causal-Role functions, you preserve **systemic capacity** (the organism survives, even if it's a monstrosity of hacks).
  *   **The Takeaway:** Biology needs *both*. We need Causal-Role to understand physiology (how it works now). We need Etiological to understand pathology and adaptation (why it's built this way and what counts as 'broken').

  ## 5. Troubleshooting: What Will Go Wrong

  **1. The Pragmatic Collapse (Most Likely)**
  *   *Problem:* Students will ignore the "Fidelity" ticket and just save what keeps the organism alive, regardless of history. They will collapse Function into "Usefulness-to-Us."
  *   *Fix:* In the Scoring Phase, heavily weight the "Fidelity" points. If they ignore the Spur (Legacy), they lose the "Lineage Bonus." Make it clear that "Survival" isn't the only winning condition.
  *   *Debrief Point:* Use this to show why Causal-Role is the default for *engineers*, but insufficient for *biologists* who care about adaptation.

  **2. The "Both/And" Student**
  *   *Problem:* One student will argue, "Obviously we should save both. Why are we forced to choose?"
  *   *Fix:* Acknowledge this is the correct *biological* intuition, but the *philosophical* point is that the *justifications* differ. "You want to save both, but for *different reasons*. One is because it works (CR), one is because it's the design (SE). The activity forces you to prioritize the *reason*."

  **3. The Budget Bias (Instructor Self-Critique)**
  *   *Honest Assessment:* The budget mechanic inherently favors Causal-Role. Scarcity makes students pragmatic. It is hard to justify spending a token on a Vestigial Part (SE function) when the organism is dying. This stacks the deck against Etiological accounts.
  *   *Correction:* Do not hide this. **Highlight it in the debrief.** "Notice how the scarcity of tokens made you feel like the Etiological view was a luxury you couldn't afford? That is exactly why Causal-Role accounts are popular in functional analysis—they are efficient. But does efficiency capture the truth of 'function'? The Etiological account argues that 'function' isn't about budget; it's about history. The tension you felt *is* the philosophical dispute."

  **4. Confusion over "Fidelity"**
  *   *Problem:* Students might think "Fidelity" means "Don't change the DNA," which sounds like eugenics or static preservation.
  *   *Fix:* Clarify in the Dossier that "Fidelity" means "Maintaining the Adaptations that defined the Lineage." It is about preserving the *evolutionary solution*, not just the matter.

  ## 6. What the Activity Cannot Reproduce (Instructor Note)
  You must supply this in the final 5 minutes.
  *   **The Normativity of Malfunction:** The activity simulates *trade-offs*, but it doesn't fully capture the SE account's strongest feature: the ability to say a part is *broken* even if it works. (e.g., A heart that pumps blood but was selected for cooling).
  *   **Instruction:** In the debrief, ask: *"If the Sac (Exaptation) becomes the main oxygen source, is it now the 'heart'? Or is it still a 'sac' doing a new job?"*
      *   CR says: It's a lung now.
      *   SE says: It's a sac that is being co-opted.
      *   *Why it matters:* If we treat it as a lung, we might miss why it fails in ways lungs don't. The SE account preserves the *vulnerability profile* of the trait. This is the metaphysical stake you must articulate, as the token game reduces it to a points loss.

