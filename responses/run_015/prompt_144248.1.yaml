answer: |-
  **Argument for Successor-Constitution and the Triadic Nature of Material Constitution**

  **I. Formal Argument**

  1.  **Premise 1 (Mereological Essentialism for Lumps):** The numerical identity of a specific material lump ($L_{orig}$) requires the persistence of a non-trivial proportion of its original atomic constituents; total atomic replacement entails the cessation of $L_{orig}$.
  2.  **Premise 2 (Material Continuity for Statues):** The numerical identity of a constituted artifact ($S_{orig}$) depends on the continuity of the material history of the lump that originally constituted it; if $L_{orig}$ ceases to exist via total replacement, $S_{orig}$ cannot persist merely in virtue of formal similarity.
  3.  **Premise 3 (Description of the Process):** In the distributed-replacement case, every atom of the original bronze is substituted by a synthetically engineered alloy atom over a decade, such that at the conclusion ($t_{end}$), zero percent of the original atomic constituents remain.
  4.  **Premise 4 (The Boundary Condition):** The replacement occurs volumetrically and uniformly, ensuring there is no discrete spatiotemporal boundary at which the original matter ends and the new matter begins; the transition is continuous but cumulative.
  5.  **Intermediate Conclusion 1:** At $t_{end}$, $L_{orig}$ does not exist (from P1 and P3).
  6.  **Intermediate Conclusion 2:** At $t_{end}$, $S_{orig}$ does not exist (from P2 and Intermediate Conclusion 1).
  7.  **Premise 5 (Existence of a Successor):** At $t_{end}$, there exists an entity ($S_{succ}$) that instantiates the macroscopic form, weight distribution, and causal capacities of $S_{orig}$.
  8.  **Premise 6 (Distinctness):** Since $S_{succ}$ lacks the material history required for identity with $S_{orig}$ (from P2), $S_{succ}$ is numerically distinct from $S_{orig}$.
  9.  **Premise 7 (The Failure of Binary Constitution):** The standard binary constitution relation ($x$ constitutes $y$ at $t$) implies that if $y$ exists, there must be a contemporaneous $x$ that is either identical to or distinct from $y$ but sharing its location. However, in this case, the original constituting matter ($L_{orig}$) is gone, yet the form persists in $S_{succ}$.
  10. **Premise 8 (The Triadic Requirement):** The persistence of the form in $S_{succ}$ despite the loss of $L_{orig}$ is explained only by a continuity-preserving transformation rule ($R$) that governs the permissible changes in matter while maintaining formal invariance.
  11. **Conclusion:** Therefore, the entity at $t_{end}$ is a distinct, successor-constituted object, and material constitution is not a binary relation between matter and form, but a triadic relation $C(M, F, R)$, where $M$ is the current matter, $F$ is the form, and $R$ is the transformation rule mediating the history; consequently, the standard dominance argument fails because the original relata ($S_{orig}$ and $L_{orig}$) have both ceased to exist, replaced by a successor governed by $R$.

  **II. Objection and Reply**

  **Objection: The Gradual Repair Analogy**
  A proponent of the standard binary view might object that distributed replacement is metaphysically indistinguishable from gradual repair. In standard conservation practices, a statue remains numerically identical despite the replacement of parts (e.g., restoring a chip or replacing oxidized surface layers). If we accept that an object survives the replacement of 1% of its atoms, and we accept the principle of tolerance (that small differences do not affect identity), then replacing 100% of the atoms gradually should not disrupt identity any more than replacing them individually. On this view, $S_{orig}$ persists through the process as a repaired entity, rendering the "successor" ontology unnecessary.

  **Reply: The Significance of the Absent Boundary**
  This objection fails because it conflates *partial* replacement consistent with substrate dominance with *total* replacement masked by temporal distribution. In a genuine repair case, the identity of the object is anchored by the persistence of the core material substrate; the new parts are integrated into a pre-existing whole that remains materially dominant. In the distributed-replacement case described, there is no point in the timeline where the original matter retains dominance. Because the replacement is volumetrically uniform, there is no discrete spatiotemporal boundary where one could locate the "death" of the original lump. 

  The absence of this boundary is not a reason to affirm identity, but rather evidence of a sorites-like erosion of the original substance. If identity required a discrete boundary of destruction, one could argue the object survives until that boundary is crossed. However, since the process ensures that at every instant $t$, the object is materially continuous with itself at $t-1$, yet at $t_{end}$ shares no matter with $t_{start}$, the continuity is purely formal and causal, not mereological. To claim $S_{orig}$ survives is to claim that material history is irrelevant to artifact identity, which contradicts Premise 2 and the intuition that a perfect replica made of new matter is not the original. The absence of a discrete boundary blocks the repair reply because it prevents the isolation of a "core" that persists; the entire substrate is in flux simultaneously. Therefore, the process is not repair (which preserves the substrate) but succession (which preserves the form via a rule).

  **III. Implications for the Dominance Argument**

  The standard dominance argument posits that the statue and the lump are distinct because they have different modal properties (e.g., the lump could survive being squashed, the statue could not). This argument relies on the co-existence of the statue and the lump as distinct entities at the same time. The distributed-replacement case undermines this by demonstrating that neither the original statue nor the original lump survives the process. 

  If constitution were merely binary, the disappearance of the lump should entail the disappearance of the statue. Yet, the form persists in $S_{succ}$. This indicates that the relation holding between the matter and the object is not a static "constitutes" relation, but a dynamic process governed by $R$. The dominance argument loses its grip because there are no longer two co-located entities with divergent modal profiles to compare at $t_{end}$. There is only $S_{succ}$, constituted by new matter $L_{new}$, linked to the past not by identity, but by the satisfaction of the transformation rule $R$. Thus, metaphysical inquiry must shift from asking whether the statue *is* the lump to asking whether the transformation from $L_{orig}$ to $L_{new}$ satisfies the rule $R$ required to sustain the form $F$. This triadic framework accounts for the intuition that the object is "the same" in a functional sense while acknowledging it is "different" in a mereological sense, resolving the tension without forcing a false identity claim.
