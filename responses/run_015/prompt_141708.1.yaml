answer: |-
  ### 1. The Exam Question

  **Question 1: Aristotle on Money, Nature, and Convention**

  In *Nicomachean Ethics* V.5, Aristotle claims money is introduced to make commodities commensurable, yet insists demand (*chreia*) is the "real standard" while money is merely conventional (*nomisma*). In *Politics* I, he calls money "nothing by nature" yet condemns usury (*tokos*) as "contrary to nature."

  (a) **Textual Analysis (NE V.5):** Does Aristotle's account of commensurability in *NE* V.5 treat money primarily as a **shadow-measure** (recording pre-existing exchange ratios) or a **stamp-measure** (imposing commensurability where none existed)? Cite specific phrases from the two passages provided in the prompt to support your classification, noting any tension between them.

  (b) **The Nature/Convention Tension:** Explain why describing money as "nothing by nature" creates a logical problem for condemning usury as "contrary to nature." Does deploying the shadow/stamp distinction resolve this tension, or does it merely relocate it? If you believe the distinction forces a false choice, say so and propose a better way to understand Aristotle's notion of monetary "nature."

  (c) **The Oinoe Case:** In Oinoe, debts are tallied in "days" of grain subsistence, and interest is charged (100 days → 110 days). Is this practice more, less, or equally contrary to nature compared to silver interest? Use your answer to identify whether Aristotle's ultimate target is the material of currency, the convention of pricing, or the practice of *chrematistike* itself.

  *(Word limit: 1200 words)*

  ***

  ### 2. Model Answer

  Aristotle's account of money oscillates between describing it as a tool for measuring real value and a conventional token with no intrinsic worth. This oscillation generates the central tension between *Nicomachean Ethics* V.5 and *Politics* I: if money has no nature, it cannot be misused contrary to nature.

  In *NE* V.5, Aristotle's text supports a **shadow-measure** reading, though it contains stamp-like elements. He states that "demand is what holds everything together," implying that exchange ratios exist prior to currency based on mutual need (*chreia*). Money is introduced "to meet this requirement," suggesting it records rather than creates value. However, he also calls money *nomisma*, existing by custom (*nomos*) and alterable at will. This suggests a **stamp-measure**, where commensurability is imposed by agreement. The tension lies here: if demand sets the value (shadow), money reflects nature; if custom sets the value (stamp), money reflects convention. Aristotle needs both: demand ensures exchange is non-arbitrary, while convention ensures flexibility.

  This duality creates the logical problem in *Politics* I. To claim usury is "contrary to nature," money must have a *telos* (end) inherent to its being. If money is "nothing by nature," it lacks a *telos*, making "misuse" incoherent. One cannot violate the nature of a thing that has no nature. The shadow/stamp distinction helps clarify this but does not fully resolve it. If money is a shadow-measure, it tracks natural demand, giving it a functional nature grounded in human need. If it is a stamp-measure, its nature is purely legal. Aristotle escapes the contradiction only if "nature" is understood functionally rather than materially. Money has a natural *function* (facilitating exchange of goods for use) even if its *material* (silver, tallies) is conventional. The distinction relocates the tension from "what money is" to "what money is for." Usury is unnatural not because of the material, but because it divorces the medium from its functional end.

  The Oinoe case tests this functional reading. In Oinoe, the unit is a "day" of grain subsistence. This is explicitly tied to *chreia* (need), making it a strong shadow-measure. Charging interest (100 → 110 days) treats the measure of need as a generator of surplus. Is this more or less contrary to nature than silver interest? It is **equally** contrary. If Aristotle's critique relied on the material (silver being barren), Oinoe grain-tallies might seem different, as grain can biologically reproduce. However, Aristotle condemns usury because "gain comes from money itself and not from that for the sake of which money was invented." In Oinoe, the "day" is invented to measure subsistence, not to breed subsistence. Charging interest separates the tally from the actual grain consumption it represents.

  Therefore, the Oinoe case shows Aristotle's target is neither the material (silver vs. grain) nor the convention (coins vs. tallies), but the practice of *chrematistike* (wealth-getting) divorced from *oikonomia* (household management). Whether the currency is a shadow or stamp, using it to generate more currency without exchanging for genuine goods violates its *telos*. The distinction reveals that Aristotle requires money to have a functional nature (serving exchange) to condemn usury, even if he admits its material existence is conventional. The "nothing by nature" claim refers to the material substrate; the "contrary to nature" claim refers to the functional teleology. Oinoe proves that even when money is perfectly anchored to need (shadow), treating it as a self-breeding stock remains unnatural.

  ***

  ### 3. Marking Scheme (25 Marks)

  **Part (a): NE V.5 Analysis (8 Marks)**
  *   **A (7-8):** Identifies that "demand is the real standard" supports **shadow-measure**, while "exists by custom/nomos" supports **stamp-measure**. Explicitly notes the tension between value being pre-existing (demand) vs. imposed (convention).
  *   **B (5-6):** Correctly classifies the text (usually as shadow) but treats the "convention" quote as secondary or fails to articulate the tension between the two sentences.
  *   **C (0-4):** Summarizes the text without using the distinction, or misidentifies the support (e.g., claims "nomisma" proves shadow-measure).
  *   *Common Error:* Ignoring the "demand" quote and focusing only on "convention," leading to a pure stamp-reading that ignores the realist element of *chreia*.

  **Part (b): The Nature/Convention Tension (9 Marks)**
  *   **A (8-9):** Explains that "nothing by nature" denies a *telos*, making "contrary to nature" logically empty. Argues the distinction helps only if "nature" is read functionally (telos of exchange) rather than materially. Willing to critique the distinction if it forces a false dichotomy (e.g., "functional nature" is a third option).
  *   **B (5-7):** Explains the contradiction clearly but accepts the distinction mechanically without noting its limits. Fails to distinguish between material nature and functional teleology.
  *   **C (0-4):** Restates the prompt's tension without explaining *why* it is a logical problem (i.e., fails to link "nature" to "telos/misuse").
  *   *Common Error:* Claiming Aristotle is simply inconsistent without attempting a charitable reconstruction via function vs. material.

  **Part (c): The Oinoe Case (8 Marks)**
  *   **A (7-8):** Argues interest is **equally** contrary to nature. Justifies this by showing the target is *chrematistike* (separation of money from use), not the material. Uses the case to prove the critique is about *practice*, not *substance*.
  *   **B (5-6):** Argues it is equally contrary but relies on vague appeals to "greed" rather than the structural separation of money from use. Or, argues it is *less* contrary because grain is natural (missing Aristotle's point about money vs. goods).
  *   **C (0-4):** Treats Oinoe as a trick about inflation or barley reproduction. Fails to link back to the definition of usury in *Politics* I.
  *   *Common Error:* Arguing Oinoe interest is *natural* because grain grows. This misses that the "day" is a unit of account, not the seed itself.

  **General Penalties**
  *   **Secondary Literature:** -5 marks if any external authors are cited.
  *   **Word Count:** Hard cap enforced; >1200 words stops reading at the limit.
  *   **Greek Terms:** No bonus for using them, but -2 if used incorrectly (e.g., confusing *tokos* with *chreia*).
