prompt: |-
  I'm revising a paper draft in which I defend a version of omissive eliminativism: roughly, that absences, failures, and non-occurrences are never themselves causes, and that every apparently causal claim about an omission is either elliptical for a claim about some positive event or state that did occur, or is really a normative, explanatory, or epistemic judgment wearing causal vocabulary. My worry is no longer whether the positive argument works; it's whether the view has any exposure left at all. Every time I press on it, it seems to absorb the pressure by redescribing the case, and I can't tell whether that is the ordinary stability of a research programme or a sign that I have qualified the thesis into something unfalsifiable. So I want a map of what it risks, not a survey of the literature and not a reading list: I want arguments, sorted, with the sorting defended.

  Here is my current inventory of candidate defeaters, which I'd like you to rank from fatal to merely awkward and then go beyond. (1) The interventionist parity argument: in the formal frameworks used to model prediction and control, whether the gardener waters can be set, randomized, and intervened on just as cleanly as how much she waters, and a variable taking the value zero behaves like any other value; if causation is whatever answers to intervention and supports explanation, omissions qualify. (2) The default-relativity parity argument: I claim that omissive causation is disqualified because whether the plants died because of the not-watering depends on what counts as the normal or expected course of events, but structural-equation and contrastive treatments suggest all causal claims are sensitive to a contrast class or a default, so my disqualifying feature is not special to omissions. (3) The relevance-preserving paraphrase problem, which is the one that actually keeps me up: when I paraphrase there was no heat input as the fuel valve was shut, the positive state I substitute seems to matter only because it excludes heat input, so the absence appears to be doing the causal work in the explanation after all, and my paraphrase looks like it borrows its relevance from the very thing it was supposed to eliminate. (4) Double prevention: much of biology and medicine appears to work by something's not happening, as when cell death results from a repair mechanism's failing to engage, and eliminating omissions here may cost more than it saves. (5) The cost-to-practice argument: if I am right, an enormous amount of ordinary, historical, and scientific explanation is systematically in error, and a thesis that implies that much error had better be nearly forced. (6) The empirical evidence that ordinary attributions of causation to omissions track whether the agent was supposed to act rather than bare counterfactual dependence, which I currently treat as supporting my view but which I concede might cut the other way if the norm-sensitivity turns out to be present for actions too. (7) The suspicion that the whole dispute is verbal, so that nothing is really at stake.

  For each of these I want three things: whether a committed eliminativist should concede it as counting against the view or dismiss it as question-begging, which further case or result it stands or falls with, and what would have to be true for it to become decisive rather than merely annoying. I'd also like you to add defeaters I haven't listed, especially any that tie the thesis to a commitment elsewhere that I might not notice I have. Two further questions I care about particularly. First, does anything outside philosophy actually turn on whether omissions are causes: negligence liability, the way inquiries into disasters apportion responsibility between what was done and what was not done, epidemiological claims about harms that followed from a programme's not being implemented? If nothing practical turns on it, is that itself fatal, or is it compatible with the thesis being true and merely terminological? Second, and relatedly: if you conclude that the view is well insulated, tell me honestly whether that is a defect for a thesis of this kind or simply what metaphysical theses about causation look like when they are in good shape. I am most likely to be moved by something that shows my paraphrase strategy cannot preserve explanatory relevance, and least likely to be moved by straightforward appeals to what people are inclined to say; please weight accordingly, and say if you think those weightings are themselves a mistake.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A philosopher (likely mid-to-late career given the sophistication and specific worry about "exposure") revising a paper on *omissive eliminativism* (the view that absences/non-occurrences are not causes).
      *   **Core Worry:** The view seems too stable/insulated. Is it a robust research programme or an unfalsifiable tautology disguised by paraphrase?
      *   **Task:**
          1.  Rank the provided 7 candidate defeaters from "fatal" to "merely awkward."
          2.  Defend the sorting.
          3.  For *each* defeater, provide: (a) Concede vs. Dismiss strategy, (b) The specific case/result it stands/falls with, (c) Conditions for decisiveness.
          4.  Add *new* defeaters (especially hidden commitments).
          5.  Answer two specific questions: (a) Does anything practical turn on this (law, medicine, etc.)? (b) Is high insulation a defect or a sign of health for metaphysical theses?
          6.  Adhere to weighting preferences: Prioritize explanatory relevance/paraphrase problems over ordinary language appeals. Critique these weightings if necessary.

  2.  **Deconstruct the User's View (Omissive Eliminativism):**
      *   *Thesis:* Absences are never causes.
      *   *Strategy:* Paraphrase apparent omissive causation into (a) positive events/states or (b) normative/epistemic judgments.
      *   *Vulnerability:* The "Relevance-Preserving Paraphrase Problem" (User's #3). If the positive surrogate only matters *because* it entails the absence, the absence is still doing the work.

  3.  **Evaluate and Rank the 7 Candidate Defeaters:**
      *   *Criteria for Ranking:* "Fatal" means it undermines the core mechanism (paraphrase) or shows the view is empty. "Awkward" means it's a cost but manageable.
      *   *(3) Relevance-Preserving Paraphrase:* **Fatal.** This attacks the *mechanism* of the view. If the paraphrase borrows relevance from the absence, the elimination fails.
      *   *(1) Interventionist Parity:* **High Risk.** If causation = intervention, and we can intervene on omissions, eliminativism contradicts the definition. Needs a metaphysical override of the formalism.
      *   *(4) Double Prevention/Biology:* **High Risk.** Scientific practice relies on this. If eliminativism makes biology speak falsely, the cost is high (links to #5).
      *   *(5) Cost-to-Practice:* **Moderate/High.** Depends on whether you think philosophy corrects practice or describes it. If it corrects, cost is low. If it describes, cost is fatal.
      *   *(2) Default-Relativity Parity:* **Moderate.** This is a "tu quoque." If *all* causation is contrastive/default-relative, then singling out omissions is arbitrary. But the eliminativist can argue omissions are *more* relative or relative in a different way (normative vs. statistical).
      *   *(6) Empirical Evidence (Norm-Sensitivity):* **Low/Moderate.** The user already uses this. It supports the "normative judgment" arm of the view. Only fatal if norms infect *positive* causation equally.
      *   *(7) Verbal Dispute:* **Meta-Defeater.** If true, the paper is pointless. But usually, these disputes aren't purely verbal.

      *   *Refining the Rank:*
          1.  #3 (Paraphrase Relevance) - Internal coherence threat.
          2.  #1 (Interventionism) - Formal/Definition threat.
          3.  #4 (Double Prevention/Science) - External application threat.
          4.  #5 (Cost-to-Practice) - Pragmatic threat.
          5.  #2 (Default Relativity) - Theoretical symmetry threat.
          6.  #6 (Empirical Norms) - Evidence threat (but currently friendly).
          7.  #7 (Verbal) - Existential threat (but easily dismissed if #3 bites).

  4.  **Develop the Analysis for Each Defeater:**
      *   *Format:* Concede/Dismiss, Pivot Point, Decisiveness Condition.
      *   *Focus:* Keep it sharp. Avoid literature survey. Focus on the *structure* of the argument.

  5.  **Generate New Defeaters (Hidden Commitments):**
      *   *Idea 1: The Causal Closure of the Physical.* If physical causation is complete, and omissions aren't physical events, how do they figure in explanation without epiphenomenalism? (Wait, eliminativism says they *don't* figure as causes, so this might help them. Need a twist.)
      *   *Idea 2: The "Positive Surrogate" Indeterminacy.* For any omission (not watering), there are infinite positive states (valve closed, gardener sleeping, gardener dead). Which one is the *cause*? If the theory can't pick one, it's underdetermined.
      *   *Idea 3: Causal Transitivity.* If A causes B (positive), and B prevents C (omission of prevention), does A cause C? Eliminativism breaks transitivity chains involving omissions.
      *   *Idea 4: The Explanatory Gap in Mechanisms.* Mechanisms are often defined by what *doesn't* happen (inhibitory neurons). If inhibitions aren't causes, mechanisms lose their causal glue.

      *   *Selection:*
          *   (8) *The Surrogate Selection Problem:* Which positive state replaces the omission? (Ties to #3).
          *   (9) *The Mechanism/Inhibition Problem:* Biology/Neuroscience relies on inhibition as causal.
          *   (10) *The Counterfactual Dependence without Causation Problem:* If plants die if not watered, but not-watering isn't a cause, what is the modal relation? It looks like causation without the name.

  6.  **Address the Two Specific Questions:**
      *   *Q1: Practical Stakes (Law, Medicine).*
          *   *Analysis:* Law distinguishes acts vs. omissions (duty of care). Medicine distinguishes side effects vs. failure to treat.
          *   *Verdict:* Practical stakes exist, but they are *normative*. Eliminativism says "This is normative, not causal." So the view *preserves* the distinction by reclassifying it. It doesn't erase the distinction, just renames it.
          *   *Is this fatal?* No, unless the practice *requires* the label "cause" for the omission to function (e.g., insurance triggers).
      *   *Q2: Insulation as Defect vs. Health.*
          *   *Analysis:* Metaphysical theses *should* be somewhat insulated from empirical fluctuation (they are framework principles). But total insulation = tautology.
          *   *Verdict:* Insulation is good *if* it buys explanatory power elsewhere (parsimony, unity). If it only saves the thesis from refutation, it's degenerative (Lakatos).
          *   *Honest Take:* The view risks being a "degenerating research programme" if the paraphrase strategy is ad hoc for every case.

  7.  **Review Weighting Preferences:**
      *   User: Moved by paraphrase/explanatory relevance failures. Not moved by ordinary language.
      *   My Task: Respect this, but challenge if necessary.
      *   *Challenge:* Ordinary language isn't just "what people say"; it's data about our conceptual scheme. If the scheme *requires* omissive causation for coherence, eliminating it is revisionary. I should note this but prioritize the structural arguments as requested.

  8.  **Drafting the Response:**
      *   *Tone:* Professional, direct, philosophical peer-to-peer. No fluff.
      *   *Structure:*
          1.  Ranking & Defense.
          2.  Detailed Breakdown of the 7 (Concede/Dismiss, Pivot, Decisiveness).
          3.  New Defeaters (Hidden Commitments).
          4.  Practical Stakes Question.
          5.  Insulation Question.
          6.  Weighting Critique.

      *(Self-Correction during drafting)*: Make sure I don't just say "Interventionism is bad." I need to say *why* it threatens *this* view specifically. It threatens it because interventionism defines causation functionally. If omissions function as causes, and causation = function, then omissions = causes. To resist, the eliminativist must say interventionism is wrong about the *nature* of causation, not just the extension.

      *(Refining the Paraphrase Problem)*: This is the user's biggest worry. I need to be precise. The problem is *explanatory borrowing*. If I say "The valve being closed caused the fire," but the valve being closed only matters because it means "no gas," then "no gas" is the real cause. The eliminativist needs to show the positive state has causal powers *independent* of the absence it entails.

      *(Refining the Insulation Question)*: Use Lakatosian terminology (protective belt vs. hard core). It fits the user's "research programme" worry.

  9.  **Final Polish:** Check against all constraints.
      *   Rank 1-7? Yes.
