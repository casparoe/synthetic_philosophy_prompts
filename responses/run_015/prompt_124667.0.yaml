  # TALLY SHEET & SCORING KEY

  *For the Facilitator only. Keep this hidden until scoring.*

  **Step 1: Tally the Points**
  For each question, add 1 point to the corresponding bucket based on the answer circled.

  | Q# | Answer A | Answer B | Answer C |
  | :--- | :--- | :--- | :--- |
  | **1** | **GATE** | **STATUS** | **STATUS** |
  | **2** | **GATE** | **STATUS** | **STATUS** |
  | **3** | **GATE** | **WILL** | **WILL** |
  | **4** | **WILL** | **GATE** | **INTEREST** |
  | **5** | **GATE** | **POWER** | **STATUS** |
  | **6** | **GATE** | **POWER** | **GATE** |
  | **7** | **GATE** | **WILL** | **INTEREST** |
  | **8** | **GATE** | **POWER** | **GATE** |
  | **9** | **WILL** | **POWER** | **GATE** |
  | **10** | **GATE** | **STATUS** | **STATUS** |

  **The Buckets:**
  *   **GATE (Open Gate):** Freedom is just no external blocking.
  *   **STATUS (Free Status):** Freedom is no arbitrary power over you.
  *   **WILL (True Self):** Freedom is internal alignment with desires.
  *   **INTEREST (Good Life):** Freedom is acting on objective well-being.
  *   **POWER (Real Power):** Freedom is effective capacity (money/physics).

  **Step 2: Find the Highest Score**
  *   **Highest is GATE:** You are **The Open Gate**. (You care about walls, not masters or minds).
  *   **Highest is STATUS:** You are **The Free Status**. (You care about power relations).
  *   **Highest is WILL:** You are **The True Self**. (You care about psychological ownership).
  *   **Highest is INTEREST:** You are **The Good Life**. (You care about objective welfare).
  *   **Highest is POWER:** You are **The Real Power**. (You care about what is actually doable).

  **Step 3: Check for Hybrids & Voids**
  *   **The Hybrid:** If **GATE** and **POWER** are tied and high (and others low), you hold a common modern mix: "I want no masters, but I also know being broke limits me."
  *   **The Void (Incoherent):** If **STATUS** is high but **GATE** is low. (You worry about *potential* power but not *actual* blocking). *Facilitator Note: Tell them this view is unstable.*
  *   **The Void (Unexplored):** If **INTEREST** is high but **WILL** is low. (You care about "true interests" but not internal psychology). *Facilitator Note: Tell them this is rarely defended.*

  **Step 4: The Tiebreaker**
  *If two people land on the same Leaf (e.g., both "Free Status") but are still arguing, ask this:*

  > **"A law is passed that you voted for. It stops you from doing something you want. Are you less free?"**
  >
  > *   **Yes:** You believe *all* coercion reduces freedom, even democratic law. (Hard Republican).
  > *   **No:** You believe *legitimate* authority doesn't count as domination. (Soft Republican/Civic).
  > *   **Depends on the Law:** You believe freedom depends on the *content* of the law, not just the source. (Positive Liberty lean).

