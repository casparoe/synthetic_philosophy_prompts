answer: |-
  # FACILITATOR'S GUIDE: LOGIC & SCORING

  ## The Logical Space
  This quiz maps your group's intuitions onto three axes. You don't need to explain these to the group, but you need them to interpret the results.

  1.  **Source:** Is the threat to freedom *External* (other people, laws, walls) or *Internal* (fear, addiction, ignorance)?
  2.  **Nature:** Is freedom about *Interference* (actually being stopped) or *Power* (someone having the ability to stop you)?
  3.  **Validity:** Does your own *Endorsement* matter (if you like it, it's fine) or do *True Interests* matter (you can be wrong about what's good for you)?

  ## The Leaves (Outcomes)
  1.  **The Open Gate:** (Negative Liberty). Freedom is just nobody physically or legally stopping you.
  2.  **The Free Status:** (Republican Liberty). Freedom is not having a master. Even a kind master makes you unfree.
  3.  **The True Self:** (Self-Mastery/Endorsement). Freedom is acting on desires you actually own. If you love your chains, you're free.
  4.  **The Good Life:** (Self-Mastery/Interest). Freedom is acting on your *real* interests. If you love your chains but they crush you, you're unfree.
  5.  **The Real Power:** (Capability). Freedom is what you can genuinely *do*. Money, nerve, and ability count.
  6.  **The Hybrid:** A stable mix (usually Open Gate + Real Power).
  7.  **The Void:** An incoherent combination (see below).

  ## Separation Warnings
  *   **The True Self vs. The Open Gate:** These two often agree on external cases. They only split on internal cases (addiction/fear). If your group skips the "Internal" questions, these views collapse.
  *   **The Free Status vs. The Real Power:** These clash on the "Algorithm/Market" case. *Free Status* needs a "Master" (a person/entity with power over you). *Real Power* just needs a constraint. If the algorithm is impersonal, *Free Status* might say "Free" while *Real Power* says "Unfree."
  *   **Incoherent Combination:** High **Status** score but Low **Gate** score. (Believing that *potential* power makes you unfree, but *actual* blocking doesn't). This is logically unstable. If having a master matters, being blocked by one must matter more. Tell these participants their view is **unappealing/unstable**.
  *   **Unexplored Combination:** High **Interest** score but Low **Self** score. (Believing true interests matter, but internal psychology doesn't). This is **nobody's bothered to defend it**. It implies you can be unfree because you're poor (interest) but not because you're addicted (self).

  ## Scoring Instructions
  1.  Hand out the **Quiz Sheet** (next section).
  2.  Give everyone 10 minutes to circle answers.
  3.  Use the **Tally Sheet** below to score.
  4.  If two people land on the same Leaf but argue, use the **Tiebreaker**.
  5.  "Depends / Not Sure" answers count as 0 points.

  ***

  # QUIZ SHEET: WHAT DO YOU MEAN BY FREE?

  *Instructions: Read each scenario. Circle the **one** statement that best matches your gut reaction. Don't overthink it. There are no right answers.*

  **1. The Kind Manager**
  Sarah works in a warehouse. Her manager has the power to fire her or cut her shifts without reason. He never does; he's kind and gives her plenty of notice.
  *   A) She is free. He never actually stops her from doing anything.
  *   B) She is unfree. She has to stay on his good side just in case.
  *   C) She is unfree. It's wrong that one person has that kind of hold over another.

  **2. The Democratic Law**
  A town votes to ban loud music after 10 PM. You voted against it, but it passed. You want to play drums at 11 PM.
  *   A) You are unfree. The law is physically stopping you.
  *   B) You are free. You had a say in the rule, so it's not oppression.
  *   C) You are unfree. The majority still has power over your choices.

  **3. The Locked Door**
  Mark is agoraphobic. No one is stopping him from leaving his house. No laws forbid it. But the fear is so intense he physically cannot walk out.
  *   A) He is free. Nobody is blocking him.
  *   B) He is unfree. He is a prisoner of his own mind.
  *   C) He is free. As long as he wants to stay inside, it's his choice.

  **4. The Happy Serf**
  Elena lives in a strict community where she must obey a leader. She cannot leave. She sincerely believes this is the best life for her and feels no desire to leave.
  *   A) She is free. She is doing exactly what she wants.
  *   B) She is unfree. Even if she likes it, she isn't allowed to choose otherwise.
  *   C) She is unfree. A life without the option to leave is bad for her, regardless of her feelings.

  **5. The Algorithm**
  A pricing app changes ride-share fares instantly. You can't afford a ride home. No human decided to target you; it's just code and supply.
  *   A) You are free. No person is stopping you; you just lack the cash.
  *   B) You are unfree. The system reliably shapes what you can do, like a wall.
  *   C) You are unfree. The company behind the code has power over your movement.

  **6. The Empty Wallet**
  Jamal wants to travel the world. No laws stop him. No boss stops him. He just doesn't have the money.
  *   A) He is free. He has the right to travel; he's just broke.
  *   B) He is unfree. Freedom requires the ability to actually go.
  *   C) He is free. Money is a resource, not a liberty.

  **7. The Addiction**
  Lisa smokes. She wants to quit. She knows it harms her. She tries to stop but can't. No one is forcing her to smoke.
  *   A) She is free. She is lighting the cigarette herself.
  *   B) She is unfree. Her own chemistry is overriding her will.
  *   C) She is unfree. She is acting against her own well-being.

  **8. The Physical Limit**
  Tom wants to fly by flapping his arms. No law stops him. No person stops him. Physics stops him.
  *   A) He is free. Freedom is about people, not gravity.
  *   B) He is unfree. He literally cannot do it.
  *   C) He is free. We don't call natural limits "unfreedom."

  **9. The Nudge**
  A cafeteria puts healthy food at eye level and junk food in a drawer. You pick the healthy food. You feel like it was your choice.
  *   A) You are free. You chose what you wanted.
  *   B) You are unfree. They manipulated the environment to steer you.
  *   C) You are free. As long as you could have opened the drawer, you're fine.

  **10. The Threat**
  A neighbor says, "If you paint your house blue, I will beat you up." He never touches you. You paint the house red.
  *   A) You are free. He didn't actually hit you.
  *   B) You are unfree. He changed your choices with a threat.
  *   C) You are unfree. You live in fear of his whim.

