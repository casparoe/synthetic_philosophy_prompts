  ### 6. Suggested Narrative Arc (Based on the Analysis)

  1.  **The Hook:** Start with the "Degenerating" accusation. Use the Lakatosian definition explicitly. "By the strict book of Imre Lakatos, the WIMP hunt is failing."
  2.  **The Flip:** Show how shifting the Core to "GR is Universal" makes the programme a massive success (CMB, Lensing). Reveal that the "failure" is only in the *identification* sub-routine, not the *cosmological* model.
  3.  **The Belt:** Walk through the modifications (WIMP -> Axion -> SIDM). Classify them honestly. Most are defensive. Acknowledge the "Exclusionary Progress" argument but note Lakatos's blindness to it.
  4.  **The Rival:** Bring in MOND. Show it is the mirror image (Progressive on galaxies, Degenerating on clusters). This creates the "Stalemate" picture.
  5.  **The Infrastructure:** Break the Lakatos frame. Discuss the billion-dollar labs. Argue that Lakatos ignores the "sunk cost" of infrastructure which sustains a "degenerating" programme longer than rational reconstruction allows.
  6.  **The Conclusion:** Don't solve it. Conclude that Lakatos tells us *why* the debate is stuck (different Cores), but not *who* is right. The "Particle That Wouldn't Show Up" isn't just hiding; it's forcing us to realize we might be running two different research programmes under one name.

  ### Final Recommendation on the "Lens"

  Use Lakatos to structure the **theoretical conflict**, but switch to **Bayesian/Error-Statistical** language when discussing the **experimental null results**.
  *   **Lakatos:** Explains the stubbornness of the theorists and the structure of the competing models.
  *   **Bayes:** Explains the shrinking confidence of the experimentalists.

  If you try to force the null results into Lakatos's "Degenerating" box, you will sound like you are dismissing the value of exclusion limits. If you ignore Lakatos, you lose the ability to explain why the field hasn't collapsed under the weight of those nulls. Use the tension between the two as the engine of the piece.

