      *Wait, check (2) LDO again.* If (3) is Relational, does it violate LDO? If I level down the rich, the poor move up in quantiles. Their *future* benefits weigh more. Does the *outcome* get better without anyone being better off? No, because value comes from benefits (1). But the *potential* value changes. Some argue this is a "soft" LDO violation. I will mention it as a risk associated with (3).

