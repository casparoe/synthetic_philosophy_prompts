      **Dear Lost,**
      Your paralysis stems from valuing the outcome over the experience. Yes, in the garden of forking paths, you become the doctor and the painter and the beggar. But *this* consciousness, reading this letter, is experiencing only one thread. The illusion of choice is necessary for the drama of living. Strive for excellence not because it alters the universal structure, but because the sensation of effort is real even if the result is predetermined. Choose arbitrarily. Flip a coin. The coin will land on heads and tails, but you must look at only one side to maintain the sanity required for taxation and reproduction. Walk your path. The others are being walked by your shadows, and they are content.

      *— Laberinto*

