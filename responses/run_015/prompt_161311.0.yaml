answer: |-
  The wind came from the northeast, biting and wet, the kind that turned the wool of a sweater into ice within minutes. On the water, the fleet of eighteen lobster boats turned in unison toward the South Hook. It was a movement so practiced it looked like a single organism flexing. No one signaled; no one radioed. They simply went where the others went.

  Ten years prior, a new breakwater had been finished at North Hook. It was visible from the deck of any boat in the harbor, a curved arm of concrete that offered measurably calmer water than the open moorings at South Hook. The physics were plain: North meant less strain on the hulls, less risk of lines snapping in a gale. Yet, since the first winter after the construction, every boat had tied up at South.

  It had started with an accident. During the inaugural storm season, the first boat to try the North Hook had tangled its propeller in debris trapped by the new wall. The skipper had radioed for help, but the rest of the fleet was already secured at South, gear stowed, engines cold. By the time they mobilized, the damage was done. The story hardened into law: North was a trap. South was safety.

  But South was not safe because of the water. It was safe because of the hands. At South Hook, the boats docked bumper-to-bumper. If a line snapped, three neighbors caught it. If a man slipped, four others pulled him up. The convention was an informal insurance policy, paid in proximity.

  Elias sat in the galley of the *Kestrel*, watching the skipper, Mara, secure the lines. She didn't look at the North Hook. She didn't have to. She knew where the others were.

  Three months earlier, Elias had walked the dock with a clipboard. He was a freelancer writing for a mainland magazine about coastal resilience. He had asked the skippers a simple question, off the record, in the privacy of their cabins: *If you could choose any mooring without worrying about the others, where would you tie up?*

  Seventeen of eighteen had said North.

  Elias held the data now in his hotel room. The printout was thin, flimsy paper that felt insufficient to carry the weight of what it suggested. He knew the theory of these things without knowing the name for it. If everyone believes everyone else will go South, everyone goes South. If everyone knows everyone *wants* North, the belief fractures.

  He published on a Tuesday. The headline was soft: *Harborers Dream of North.* The text was harder. It detailed the private preferences, the calm water of the North, the unspoken consensus that had kept them south. He framed it as progress, as a community ready to modernize. He did not frame it as a revelation of hollow ground.

  The next northeast gale arrived on Friday.

  Elias stood on the pier, collar turned up against the spray. The fleet came in low and fast. But the formation was broken. Three boats peeled off toward the North Hook. Five lingered in the channel, engines idling, watching the others. Ten committed to South.

  The coordination failed. The three at North were too far apart to share lines when the swell picked up. One snapped a cleat; the boat drifted into the breakwater, hull grinding against concrete. At South, the density was lower than usual. When a line parted on the *Kestrel*, the neighbor who usually caught it was among the five lingering in the channel. Mara had to dive for the line herself, slipping on the wet deck, tearing a ligament in her shoulder.

  The damage was not catastrophic, but it was expensive. The silence afterward was heavier than the storm.

  On Sunday, Elias walked the dock. The boats were being repaired. He found Old Man Halloway coiling rope on the *Orion*. Halloway had been fishing these waters since before the breakwater existed.

  "Paper says you all wanted North," Elias said.

  Halloway didn't look up. "Paper says a lot of things."

  "Seventeen of you told me."

  Halloway stopped coiling. He ran a thumb over a fray in the line. "You asked us what we wanted. You didn't ask us what we'd do."

  "Is there a difference?"

  "In this harbor, yes." Halloway gestured toward the South Hook, where the boats sat clustered again, returning to the old pattern as if the deviation had been a spasm. "We go South because the current sweeps the kelp away from the props. North traps the debris. That's why we stay."

  Elias looked at the North Hook. The water there was glassy. The debris was visible, yes, but manageable. "Is that true? About the current?"

  Halloway shrugged, a motion that could mean anything. "It's true enough for us."

  Elias looked back at his notebook. He remembered the interviews. He remembered the way the skippers had looked at the door while answering, checking to see if anyone else was listening. He remembered the way one skipper had laughed nervously after saying *North*, as if confessing a infidelity. Had they told him what they thought a modernizer wanted to hear? Had they told him the truth of their desire, but not the truth of their constraint?

  He couldn't tell. The data was clean, but the context was muddy. The convention held again, the boats clustered tight at South, but the air between them had changed. They looked at the North Hook now not with superstition, but with calculation. They knew what others wanted. They no longer knew what others believed.

  Halloway tied off the rope. "You wrote the truth," he said, not unkindly. "Just not the whole of it."

  Elias nodded. He watched the fleet. They were together, but the certainty was gone. The regularity remained, but the ground beneath it had turned to sand. He wondered if he had freed them, or if he had simply taken away the floor.

  ***

  **Note to Editor**

  **Episodes and Lewisian Elements:**

  1.  **The Storm Routine:** Dramatizes *regularity of behavior* and *conditional preference* (conforming because others conform).
  2.  **The North Hook Breakwater:** Addresses Constraint 1. North has a *genuine advantage* (calmer water), but South was chosen via *precedent/salience* (the initial accident). This inherent advantage makes the convention *fragile* because the incentive to deviate is always present.
  3.  **The Clustered Docking:** Addresses Constraint 2. The convention is *load-bearing* (mutual aid/insurance). The collapse causes material harm (damage, injury), ensuring the breakdown isn't read as liberation.
  4.  **The Clipboard Survey:** Addresses Constraint 3. The *measurement* is ambiguous. Skippers may have misreported due to social desirability (pleasing the journalist) or hypothetical framing. This ambiguity survives the ending.
  5.  **Halloway's Explanation:** Addresses Constraint 4. The claim about kelp/current is a *functional explanation*. It is left open whether this is the actual cause or a *rationalization* generated to justify the existing equilibrium.
  6.  **The Publication:** Shifts *common knowledge*. It changes what agents believe about others' beliefs/preferences, destabilizing the expectation required for coordination.

  **Potential Slippage:**
  There is a risk the South Hook practice slides into a *rule enforced by penalties* (social ostracization) rather than pure coordination. I tried to mitigate this by emphasizing the physical necessity of neighbors for rescue (payoff structure) rather than punishment for deviating. The hesitation in the channel suggests a *statistical equilibrium* breakdown rather than a rule violation.
