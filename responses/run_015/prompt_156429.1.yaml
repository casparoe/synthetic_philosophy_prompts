      *   *Self-Correction on Consistency:* The user is worried about assuming consistency. I need to address that. We *must* assume consistency for the code to be useful. If it's inconsistent, it's broken. The fact that we can't prove it *inside* doesn't mean we can't believe it *outside*.

  9.  **Constructing the Output:** (Mental Outline)
