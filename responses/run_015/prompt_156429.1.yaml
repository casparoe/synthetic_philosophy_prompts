      *   *(3) Translation:* Undecidable sentence $\rightarrow$ Undecided question.
      *   *(4) Normative Gap:* Undecided question $\rightarrow$ Not decision-complete (neither Req, Forb, Perm).
      *   *(5) External Settlement:* Gap filled by something outside $C$ (discretion, judgment).
      *   *(6) Regress/Analogy:* External settler is also mechanical $\rightarrow$ incomplete. Analogy to arithmetic (we still assert things).
      *   *(7) Conclusion:* No code is a complete guide; no determinate fact about requirements.

  3.  **Evaluate the Steps for Validity and Soundness:**

      *   *(1) & (2):* The user wants to keep these. They are technically plausible *if* one accepts the "Mechanical" definition for normative codes. This is the "Formalist" assumption.
      *   *(3):* Logical mapping. If a sentence is undecidable, the theory doesn't output a verdict. Seems okay.
      *   *(4):* **CRITICAL STEP.** This equates "not provable in $C$" with "no determinate normative status." It assumes that *provability in $C$* is the *only* way for an action to have a normative status. This conflates *epistemic access* (what the code proves) with *ontological status* (what is actually right/wrong).
      *   *(5):* Plausible, but depends on (4).
      *   *(6):* The regress argument. It claims the external settler is *also* mechanical. This leads to infinite regress *if* we insist on mechanical settlement for everything. But the arithmetic analogy actually undermines (7). In arithmetic, we know the Gödel sentence is *true* despite unprovability. Why not in ethics?
      *   *(7):* The nihilistic conclusion. "No determinate fact." This is the leap from "The code doesn't say" to "There is no fact."

  4.  **Identify the Break Point:**
      *   The primary break is at **(4)** moving to **(7)**. Specifically, the inference from "C does not decide" to "There is no determinate fact."
      *   A secondary break is at **(6)**. The claim that "whatever settles it is itself rule-governed, hence mechanical" is a strong assumption (Rule Skepticism vs. Rule Formalism).
      *   The user also noted the **Consistency Assumption**. Gödel's theorems require consistency. If $C$ is inconsistent, it decides everything (trivially). But an inconsistent normative code is useless (everything is forbidden and permitted). So consistency is a desirable feature, but we can't prove it *within* $C$.

  5.  **Formulate the Diagnosis:**
      *   **The Main Error:** Conflating *derivability* with *truth/validity*. In math, Gödel shows there are *true* sentences unprovable in the system. In the normative argument, Step (4) treats unprovability as *normative indeterminacy*. Step (7) treats this as *ontological nihilism* about norms.
      *   **Why it looked fine:** It mimics the mathematical structure. In math, "undecidable" often feels like "we can't know." But Gödel specifically says they are *true* (in the standard model). The argument ignores the "True" part of "True but unprovable."
      *   **The Consistency Worry:** The user is right. We assume consistency to get incompleteness. If we drop consistency, we get triviality (everything decided). But we *want* consistency. The inability to prove consistency internally doesn't mean the code *is* inconsistent.

  6.  **Develop Alternatives/Costs:**

      *   *Option A: Reject (4) - The Semantic/Realist Move.*
          *   *Idea:* Just because $C$ doesn't prove it doesn't mean there's no fact of the matter. There is a "Right" answer, $C$ just can't find it.
          *   *Cost:* Abandons strict Legal Positivism/Formalism. Requires a normative realism (moral facts exist independent of the code).
      *   *Option B: Reject (6) - The Human Judgment Move.*
          *   *Idea:* The external settler (judge/agent) is *not* mechanical. They use intuition, wisdom, or non-algorithmic reasoning.
