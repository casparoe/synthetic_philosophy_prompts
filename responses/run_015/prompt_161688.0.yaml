  **DRAFT FOR REVIEW: ADVERSARIAL COLLABORATION PROTOCOL**
  **Subject:** Interpersonal Comparability and Equity Weighting in Health Technology Assessment
  **Date:** October 26, 2023
  **To:** Technical Advisory Panel
  **From:** [Your Name/Role]

  ### 1. Preamble and Agreed Formal Claims

  The undersigned parties (hereinafter "the Sceptic" and "the Comparabilist") acknowledge an impasse regarding the scientific and ethical basis of the Panel's current resource allocation rules. To resolve this, we agree to the following formal stipulations and factual claims. These constitute the shared foundation upon which our disagreement rests.

  1.  **The W-Index Formalism:** We agree to model well-being measurement using a hypothetical instrument (the W-index) where the reported number $w_i$ for individual $i$ is related to true underlying well-being $u_i$ by an increasing affine transformation: $w_i = a_i + b_i u_i$. Here, $b_i$ represents the unit (scale) and $a_i$ represents the zero point (origin).
  2.  **Informational Grades:** We distinguish three informational bases for social choice, defined by what is known about $a_i$ and $b_i$ across the population:
      *   **Grade A (Full Comparability):** $a_i$ and $b_i$ are common across all persons (or the ratios $a_i/a_j$ and $b_i/b_j$ are known).
      *   **Grade B (Bounded-Ratio Unit Comparability):** The ratios of units $b_i/b_j$ are known to lie within a specific bound, but the zero points $a_i$ remain person-specific and unknown.
      *   **Grade C (Ordinal Non-Comparability):** Only the ordering of $u_i$ is known; neither levels ($a_i$) nor units ($b_i$) are comparable across persons.
  3.  **Mapping Rules to Information:** We agree on the standard social choice mapping between decision rules and informational grades:
      *   **Plain Sum-Ranking ($\sum w_i$):** Requires at least Grade B (Unit Comparability). It is undefined under Grade C.
      *   **Priority-Weighted Sum-Ranking:** Requires Grade B (to measure gains) *and* information on baseline levels to identify who is "worse off." If "worse off" is defined by absolute well-being levels, Grade A is required. If defined by baseline health status (independent of $w_i$), Grade B may suffice.
      *   **Maximin over Final Well-Being:** Requires Grade A (Level Comparability). It is undefined under Grade B or C.
  4.  **Current Practice:** We agree that the Panel's current practice (QALY summation with an optional equity weight) functionally operates as a Priority-Weighted Sum-Ranking. We agree that this practice presupposes at least Grade B information.
  5.  **The Empirical Test:** We agree to commission a study administering three independent instruments to a large, diverse sample ($N > 5,000$):
      *   (i) Global Life-Satisfaction (0–10 scale).
      *   (ii) Experience Sampling (momentary affect aggregation).
      *   (iii) Trade-off/Willingness-to-Pay tasks.
      *   *Method:* All instruments will utilize anchoring vignettes to correct for differential item functioning (scale usage).
  6.  **The Stakes:** We agree that if Grade C is the only scientifically defensible position, the current allocation rule lacks a welfare-economic basis and must be justified solely on non-welfarist grounds (e.g., rights, need, or pure political convention).

  ### 2. Table of Disagreements

  The following table isolates the specific cruxes where the Sceptic and Comparabilist diverge. Each party has drafted their position to ensure it is philosophically defensible from their respective traditions.

  | Crux | Sceptic's Formulation (Ordinalist) | Comparabilist's Formulation (Cardinalist) | Agreed Evidence / Argument | Sceptic's Prediction | Comparabilist's Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Zero Point ($a_i$)** | The zero point of well-being is metaphysically arbitrary. There is no "natural zero" (e.g., death is not zero well-being for the non-existent; unconsciousness is not a state of welfare). Therefore, Level Comparability (Grade A) is impossible by definition, not just by measurement error. | The zero point can be anchored to a functional baseline (e.g., "state of indifference between life and death" or "absence of conscious experience"). While not metaphysically unique, it is pragmatically fixed by impartial sympathy. Grade A is achievable via calibration. | Analysis of anchoring vignette data: Do respondents converge on the valuation of "worst imaginable health" across cultures? | **Divergence.** Vignettes will show systematic cultural/subpopulation variation in the anchoring of "zero," proving $a_i$ is person-specific. | **Convergence.** After vignette correction, the valuation of the anchor state will be statistically indistinguishable across groups, validating a common zero. |
  | **2. Interpretation of Convergence** | If the three instruments (LS, ESM, WTP) correlate highly, this demonstrates coherence among our *conventions* and language, not a shared internal magnitude. It shows we agree on how to *talk*, not how to *feel*. | Robust convergence across distinct methodologies (hedonic, evaluative, behavioral) constitutes abductive evidence for a common underlying construct. Coherence of convention is the only operational meaning "common scale" can have. | Results of the Empirical Test (Section 1.5). High cross-instrument correlation coefficients ($\rho > 0.8$). | **Conventions.** High correlation reflects shared social norms about reporting, not shared psychic intensity. The correlation will break down in novel trade-off scenarios. | **Common Scale.** High correlation reflects measurement of a real variable. The correlation will hold even in novel trade-off scenarios. |
  | **3. The Equity Weight** | The "extra weight for the worse off" is a moral parameter (prioritarianism) smuggled in under the label of measurement. It claims to measure *gain* but actually values *identity*. This violates the Grade B constraint. | The weight reflects diminishing marginal social value of well-being. If units are comparable (Grade B), a gain to a person with low $w_i$ contributes more to social welfare than a gain to high $w_i$. This is measurement, not smuggling. | Public deliberation data: Do citizens treat a QALY gain for a severely ill person as *larger* than a QALY gain for a mildly ill person, or merely as *more important*? | **More Important.** Citizens will say the gain is the same size but morally more urgent. This confirms the weight is moral, not metric. | **Larger.** Citizens will report the gain is experienced as "larger" or "more valuable" in magnitude. This confirms the weight is metric. |
  | **4. Scientific Basis** | "Scientific basis" requires mind-independent facts. Since utility is preference-satisfaction, and preferences are ordinal, any cardinal number is a stipulation. IPC is therefore unscientific. | "Scientific basis" requires inter-subjective reliability and predictive power. If IPC allows us to run a health service that minimizes suffering as reported by patients, it is scientific. IPC is a theoretical posits like "temperature." | Philosophical analysis of "measurement" in social science vs. physics. | **Stipulation.** We are imposing a grid on reality. | **Posit.** We are discovering a structure in reality. |

  ### 3. Analysis of Verbal Disputes and Conclusion

  **3.1 Verbal Disputes**
  A portion of the friction between the Sceptic and the Comparabilist is verbal, specifically regarding the terms **"Measurement"** and **"Utility."**

  *   **Measurement:** The Sceptic uses a "strong" definition of measurement (mapping numbers to mind-independent magnitudes, akin to mass or length). The Comparabilist uses a "pragmatic" definition (mapping numbers to reliable, inter-subjective consensus that supports prediction and control). If the Comparabilist admits their scales are not "measurements" in the Sceptic's strong sense, but the Sceptic admits they are "measurements" in the Comparabilist's pragmatic sense, this dispute dissolves. However, this does not solve the allocation problem, as the Sceptic still rejects the pragmatic scale for normative reasons.
  *   **Utility:** The Sceptic defines utility as *revealed preference* (which is inherently ordinal). The Comparabilist defines utility as *experienced well-being* (which is plausibly cardinal). Much of the debate vanishes if we agree we are not measuring "preference satisfaction" but "health-related quality of life." However, the Sceptic maintains that even quality of life judgments are ordinal rankings of states.

  **3.2 Substantive Disputes**
  The core disagreement is **not** merely verbal. It is a meta-ethical and epistemological divide regarding **Level Comparability (the zero point, $a_i$).**
  *   The Sceptic holds that there is *no fact of the matter* regarding whether Person A's "5" is equal to Person B's "5" in absolute terms.
  *   The Comparabilist holds that there *is* a fact of the matter, accessible via extended sympathy and psychometric calibration.
  *   No amount of empirical data can strictly falsify the Sceptic's position, as any data interpretation presupposes the comparability the Sceptic denies.

  **3.3 Resolution and Recommendation**
  Honesty requires admitting that this dispute cannot be scientifically "ended" within the timeframe of the Panel's remit. The Sceptic's position is immune to empirical refutation because it treats comparability as a category error rather than an empirical hypothesis.

  **Recommendation:**
  The Panel should not attempt to resolve the philosophical truth. Instead, it should adopt an **Explicit Convention.**
  1.  Acknowledge that Grade A (Full Comparability) is a regulatory fiction required for budget allocation.
  2.  Acknowledge that the equity weight is a moral parameter, not a measurement correction.
  3.  Adopt the Comparabilist's framework *as if* it were true for the purposes of calculation, while recording the Sceptic's objection in the minutes as a caveat regarding the scientific status of the zero point.

  This allows the health service to function (satisfying the Comparabilist's practical necessity) without claiming false scientific objectivity (satisfying the Sceptic's demand for intellectual honesty).

  ***

  **Signatures:**

  _________________________ (The Sceptic) Date: __________

  _________________________ (The Comparabilist) Date: __________
