      *   **Theoretical Grounding:** Philosophy of probability (Objective Chance vs. Rational Belief). Specifically, the Principal Principle (Lewis) but acknowledging defeaters.
      *   **Required Steps:**
          (a) Is there an objective probability? (Mechanism vs. Judgment).
          (b) Is the knowledge of that probability good enough to anchor on?
          (c) Is there a "defeater" (evidence the process isn't what we think)?
          (d) When to hand off to human judgment (and why).
      *   **Honesty:** Must admit where steps are constraints vs. judgment calls and where the procedure might misfire.
      *   **Test Cases:**
          1.  1-in-38 number on a fresh, certified wheel.
          2.  Same wheel after an 11-red streak.
          3.  Coin flip by a magician with a trick coin (uninspectable).
      *   **Outcome:** For each case, state if the recommendation matches what the desk *would* prefer (implying the desk has a preferred stance on risk/exposure).

  2.  **Theoretical Framework:**
      *   *Principal Principle (David Lewis):* Credence should equal objective chance, conditional on no "inadmissible" information.
      *   *Defeaters:* Evidence that the chance setup is not functioning as assumed (e.g., biased wheel, trick coin).
      *   *Reference Class Problem:* Choosing the right reference class for the probability (e.g., all wheels vs. *this* wheel).
      *   *Distinction:* Aleatory uncertainty (inherent randomness) vs. Epistemic uncertainty (lack of knowledge about the mechanism).

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Goal:* Speed and consistency.
      *   *Step 1 (Mechanism Check):* Is this actually a mechanism? If it depends on human intent (election), stop. If it depends on physics/randomization, proceed.
      *   *Step 2 (Anchor Check):* Do we know the theoretical probability? (e.g., 1/6 for a die). Is the device certified?
      *   *Step 3 (Defeater Check):* This is the crux. How to handle the 11-red streak?
          *   *Junior Error:* "Red is due." (Gambler's Fallacy).
          *   *Senior Error:* "Wheel is perfect despite streak." (Dogmatism).
          *   *Solution:* Distinguish between *outcome data* (streaks) and *structural data* (wear, certification, magician). A streak is weak evidence of bias unless statistically overwhelming. A magician is strong evidence of bias.
      *   *Step 4 (Decision):* If no defeaters, use Objective Chance. If defeaters, adjust or reject listing.
      *   *Formatting:* Needs to be a checklist or flowchart style for speed.
      *   *Honesty Clause:* Need a section admitting limitations (e.g., small sample sizes, hidden variables).

  4.  **Refining the "Defeater" Logic (The Hardest Part):**
      *   The prompt specifically mentions the tension between "independence of spins" and "evidence about the wheel."
      *   *Philosophical nuance:* If the wheel is fair, past spins don't matter. If we *don't know* if the wheel is fair, past spins update our belief about the wheel's fairness.
      *   *Procedure Rule:* Treat the theoretical probability as the *null hypothesis*. Require a statistical threshold or structural evidence to reject it. An 11-streak is unlikely ($1/2^{11}$) but not impossible. A certified wheel lowers the prior probability of bias. A magician raises it.
      *   *Time Limit:* Can't run a full Bayesian update in 10 mins. Need a heuristic.
      *   *Heuristic:* "Structural > Statistical." Physical evidence of tampering > streak data, unless the streak is mathematically impossible under the null (e.g., 100 heads in a row).

  5.  **Drafting the Content:**

      *   *Title:* Mechanism Event Calibration Protocol (MECP).
      *   *Introduction:* Purpose and theoretical basis (Principal Principle).
