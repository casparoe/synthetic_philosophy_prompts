      *   Philosophical grounding? Yes (Lewis, Defeaters, Admissible Info).
      *   Honest about limitations? Yes, included a "Failure Modes" section.

  8.  **Final Polish:**
      *   Tone: Professional, directive, slightly academic but operational.
      *   Formatting: Clear headings, bold text for actions.
      *   Ensure the "Honesty" section explicitly calls out where judgment is disguised as procedure.

  9.  **Self-Correction on Case 2:** I need to be careful here. The prompt says "senior analysts won't move... where evidence... is thin but persistent." The prompt implies the desk *wants* to avoid being burned by ignoring bias. However, 11 reds is statistically weak evidence of bias compared to a certified wheel. If I tell them to adjust on 11 reds, I encourage Gambler's Fallacy. If I tell them not to, I risk the "Senior" burn.
      *   *Solution:* The procedure must set a *threshold* for statistical defeaters. 11/11 is $p < 0.001$. That *is* statistically significant in many contexts. However, in a casino context, variance is expected.
