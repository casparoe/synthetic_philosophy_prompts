answer: |-
  # MECHANISM EVENT CALIBRATION PROTOCOL (MECP)
  **Version:** 2.1 | **Owner:** Calibration Desk Lead | **Max Time:** 10 Minutes

  ## 1. PURPOSE & THEORETICAL BASIS
  This procedure determines the listing probability for **Mechanism Events** (outcomes generated by physical or algorithmic processes with defined state spaces). It is grounded in David Lewis's **Principal Principle**: *Your credence in an event should match its known objective chance, unless you possess "inadmissible" information (a defeater) suggesting the chance setup is not functioning as assumed.*

  **Goal:** Prevent two specific failure modes:
  1.  **The Gambler's Fallacy:** Overriding objective chance based on outcome history (e.g., "Red is due").
  2.  **The Dogmatist Error:** Ignoring structural evidence that the objective chance has shifted (e.g., "The wheel is certified, so the 20-head streak is irrelevant").

  ## 2. THE 4-STEP FILTER
  *Analysts must complete all four steps. If any step fails, proceed to the next. If a step triggers a "STOP," escalate to the Desk Lead.*

  ### STEP 1: ONTOLOGY CHECK (Mechanism vs. Judgment)
  **Question:** Is the outcome determined by a fixed physical/algorithmic process with a known state space, or by human/complex system intent?
  *   **Mechanism:** Dice, coins, certified RNG, lottery balls, weather physics. -> **PROCEED.**
  *   **Judgment:** Elections, court rulings, Fed rates, sports outcomes (human performance). -> **STOP.** (Route to Judgment Desk).
  *   **Constraint:** If human intent influences the mechanism (e.g., a dealer shuffling cards), treat as Mechanism *only if* the human action is standardized and audited.

  ### STEP 2: ANCHOR VALIDATION
  **Question:** Do we have a verified theoretical probability ($P_{theo}$) for this specific device?
  *   **Yes:** (e.g., 1/6 for a die, 18/38 for Roulette Red). -> **Set $P_{anchor} = P_{theo}$.**
  *   **No:** (e.g., "A random number between 1 and 100" without specified RNG). -> **STOP.** (Escalate to Lead for epistemic probability estimation).
  *   **Constraint:** You must verify the *specific* device certification. A "standard die" is not enough; it must be *this* casino's certified die.

  ### STEP 3: DEFEATER SCAN (The "Admissibility" Test)
  **Question:** Is there evidence that the mechanism is *not* generating outcomes according to $P_{anchor}$?
  *Classify evidence into two buckets:*

  *   **A. Outcome Noise (Generally Inadmissible):** Past results generated *by* the mechanism (e.g., "Red hit 11 times in a row," "The last 3 flips were Heads").
      *   **Rule:** Ignore Outcome Noise *unless* it exceeds the **5-Sigma Threshold** (probability of streak occurring by chance < 0.0000003).
      *   *Rationale:* Below 5-sigma, streaks are expected variance. Adjusting here invites Gambler's Fallacy arbitrage.
  *   **B. Structural Flaws (Always Admissible):** Evidence about the *device* or *operator* external to the outcome stream (e.g., "Wheel tilt measured at 2 degrees," "Flipper is a known magician," "RNG software patch unverified").
      *   **Rule:** Any verified Structural Flaw is a **Hard Defeater**.
      *   *Rationale:* This updates the probability that the mechanism itself is biased.

  **Decision:**
  *   If **Only Outcome Noise** (below 5-sigma): **KEEP $P_{anchor}$.**
  *   If **Structural Flaw** OR **Outcome Noise > 5-Sigma**: **FLAG AS DEFEATER.** (Proceed to Step 4).

  ### STEP 4: HANDOFF OR ADJUST
  **Question:** Can we quantify the new probability ($P_{new}$) with confidence?
  *   **Yes:** (e.g., Wheel tilt mathematically calculated to shift odds to 19/38). -> **List at $P_{new}$.**
  *   **No:** (e.g., "Magician has a trick coin" but we don't know the bias direction). -> **STOP.** (Escalate to Lead).
  *   **Reasoning:** When a Defeater exists but the new chance is unknowable, the event ceases to be a pure Mechanism Event and becomes a Judgment Event regarding the *bias*.

  ## 3. HONESTY CLAUSE: WHERE THIS PROCEDURE MISFIRES
  *Analysts must read this before signing.*
  1.  **The Reference Class Problem:** This procedure assumes we know the correct reference class (e.g., "All wheels of this model"). If the specific wheel is unique, $P_{theo}$ may be wrong from the start.
  2.  **Adversarial Manipulation:** This protocol assumes the mechanism is passive. If a trader can influence the mechanism (e.g., bribing a dealer), Step 3 may not catch it quickly enough.
  3.  **Judgment Disguised as Math:** Step 4 requires human judgment to quantify $P_{new}$. This is where "feel" can re-enter. If you cannot derive $P_{new}$ from physics/stats, do not guess. Escalate.
  4.  **Small Sample Blindness:** The 5-Sigma rule protects against overreacting to noise, but it means we *will* list incorrect odds on a biased wheel until the bias is statistically overwhelming. This is a cost of doing business to prevent false positives.

  ## 4. SIGN-OFF FORM
  *To be filled by Analyst. Lead approval required only if "ESCALATE" is selected.*

  | Field | Entry |
  | :--- | :--- |
  | **Event ID** | [Insert ID] |
  | **Step 1 Result** | [Mechanism / Judgment] |
  | **Step 2 Anchor** | [Insert $P_{anchor}$] |
  | **Step 3 Defeaters** | [None / Outcome Noise / Structural Flaw] |
  | **Step 4 Action** | [List / Adjust / Escalate] |
  | **ONE-LINE REC** | **"List at [X]% probability; [Reason if not Anchor]."** |

  ***

  # CASE STUDY APPLICATIONS

  ### CASE 1: The Fresh Wheel
  **Scenario:** A 1-in-38 specific number on a newly certified casino roulette wheel. No play history.
  *   **Step 1:** Mechanism (Physical wheel).
  *   **Step 2:** Anchor = 1/38 (2.63%). Certification verified.
  *   **Step 3:** Defeaters = None. No outcome history, no structural flaws.
  *   **Step 4:** Action = List.
  *   **One-Line Rec:** "List at 2.63% probability; standard certified mechanism with no defeaters."
  *   **Desk Preference:** **YES.** This is the ideal arbitrage-free listing.

  ### CASE 2: The 11-Red Streak
  **Scenario:** Same certified wheel. Red has hit 11 times in a row immediately prior to listing. Traders demand odds shift; Statisticians say wheel is still fair.
  *   **Step 1:** Mechanism.
  *   **Step 2:** Anchor = 18/38 (47.37%) for Red.
  *   **Step 3:** Defeaters = Outcome Noise.
      *   *Calculation:* Probability of 11 Reds in a row on fair wheel = $(18/38)^{11} \approx 0.0005$.
      *   *Threshold Check:* 0.0005 is significant (~3.3 sigma), but **below** the Protocol's 5-Sigma threshold (0.0000003).
      *   *Classification:* Treat as Variance, not Bias. Adjusting here validates the Gambler's Fallacy (that Red is "due" or "hot") rather than updating the wheel's physical fairness.
  *   **Step 4:** Action = List at Anchor. (Note: Analyst adds metadata tag "High Variance Recent" for risk monitoring, but odds do not move).
  *   **One-Line Rec:** "List at 47.37% probability; streak is within variance tolerance for certified device."
  *   **Desk Preference:** **YES.** While the statisticians are right that the streak *could* indicate bias, the procedure prioritizes preventing the Junior error (Gambler's Fallacy) over the Senior error (Dogmatism) in low-N cases. We accept the risk of a biased wheel over the risk of traders arbing us based on superstition. *Note: If the streak hit 20, we would Escalate.*

  ### CASE 3: The Magician's Coin
  **Scenario:** Coin flip event. Flipper is a known stage magician. Coin is in their pocket; we cannot inspect it before listing.
  *   **Step 1:** Mechanism (Physically a coin flip).
  *   **Step 2:** Anchor = 1/2 (50%).
  *   **Step 3:** Defeaters = **Structural Flaw.**
      *   *Evidence:* "Flipper is a known magician" + "No inspection possible."
      *   *Classification:* This is inadmissible information regarding the *chance setup*. The objective chance is not 50%; it is unknown and likely controlled.
  *   **Step 4:** Action = **Escalate.** We cannot quantify $P_{new}$. Is it 90% Heads? 10%? We don't know. The event has shifted from Mechanism to Judgment (Will the magician allow heads?).
  *   **One-Line Rec:** "Escalate to Lead; structural defeater (operator skill) invalidates theoretical anchor."
  *   **Desk Preference:** **YES.** Listing this at 50% would be suicidal. The market will assume the magician controls the outcome, and if we list 50%, we will be arbed immediately. This correctly identifies the event as "Judgment" masquerading as "Mechanism."
