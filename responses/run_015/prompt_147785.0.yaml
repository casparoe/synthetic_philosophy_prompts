  6.  **Review and Polish:**

      *   *Check Constraints:* One page? (I will format it tightly). 5-6 questions? Yes. Stopping points? Yes. Self-check included? Yes.
      *   *Tone Check:* Is it respectful to the committee but rigorous?
      *   *Specific Instruction:* "Tell me in a sentence what it would say about [your dissertation] too."
      *   *Specific Instruction:* "Write out the actual verdict slip for each of these three."

  7.  **Finalizing the Content (Self-Correction during drafting):**

      *   *Question 1 (Circularity):* Make sure it distinguishes between "named after" and "constituted by."
      *   *Question 2 (Borrowed Crane):* Make sure it asks about the *transfer conditions*.
      *   *Question 3 (Level):* Ensure it doesn't force reductionism.
      *   *Question 4 (Neuro Bias):* Crucial. "Localization is not explanation."
      *   *Question 5 (Speculation):* This is the policy question.
      *   *Verdict Slips:* Need to sound like administrative feedback, not philosophical critique.
      *   *Dissertation:* Be honest. It's a normative claim, not a mechanism. The screen will reject it as a *mechanism* screen, which is correct for *this* fund if the fund requires mechanisms. But if the fund allows theoretical work, the screen is the wrong tool. I must state that the screen assumes a mechanistic framework.

      *(Self-Correction on Case 2)*: The user says "I genuinely expect the verdict here to be more permissive than I want it to be... and I would rather be told that than have you flatter me." This implies I should acknowledge that the screen *might* let it through even if the user thinks it's circular. I will design the screen to flag it for *clarification* rather than rejection, acknowledging that social constructs often fail strict mechanistic tests but are fundable as pilot measures.

      *(Self-Correction on Case 3)*: Optimality principles are not mechanisms. The screen needs a "Not a Mechanism" path that isn't a "Reject" path. It needs to classify it as "Structural/Mathematical Explanation."

      *(Refining the "One Page" aspect)*: I will use bolding and clear headers to make it scannable.

