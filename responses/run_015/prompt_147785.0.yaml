answer: |-
  # INTERDISCIPLINARY SEED FUND: MECHANISM SCREEN
  **For Reviewer Use Only.** Run this sequence *before* scoring scientific merit. Time limit: 5 minutes.

  **Q1. The Circularity Check (Ungrounded Explainer)**
  Does the proposed mechanism rely on a component defined solely by the outcome it produces (e.g., a "vital force," an "inner agent," or a capacity named after the phenomenon itself)?
  *   **NO:** Proceed to Q2.
  *   **YES:** **STOP.** Verdict: *Mechanism Conceptually Circular.* (See Slip A).

  **Q2. The Context Check (Borrowed Crane)**
  If the mechanism is imported from another domain (e.g., evolution to culture, engineering to biology), does the proposal specify what part of *this* system plays the role of the background conditions required in the *original* domain (e.g., what plays the role of "faithful copying" or "explicit objective")?
  *   **YES/NOT APPLICABLE:** Proceed to Q3.
  *   **NO:** **STOP.** Verdict: *Mechanism Contextually Unsupported.* (See Slip B).

  **Q3. The Localization Check (Neuro/Molecular Bias)**
  Does the proposal merely identify *where* the phenomenon occurs (e.g., a brain region, a gene) without explaining *how* the lower-level activity constitutes the higher-level function?
  *   **NO:** Proceed to Q4.
  *   **YES:** **FLAG.** Require "Mechanism Box" completion. (See Slip C). Do not reject yet.

  **Q4. The Level Check (Premature Reductionism)**
  Is the phenomenon defined at a level (e.g., social, structural, mathematical) where lower-level variation is irrelevant to the explanation, or is the explanation a principle (e.g., optimality, conservation) rather than a machine?
  *   **YES:** **PASS.** Mark as *Legitimate Higher-Level Description.* No mechanism owed. (See Slip D).
  *   **NO:** Proceed to Q5.

  **Q5. The Speculation Threshold (Committee Policy)**
  Is the gap between the proposed parts and the phenomenon a matter of missing technical data (fundable) or missing conceptual coherence (not fundable)?
  *   **TECHNICAL:** **PASS.** Mark as *Mechanism Plausible.*
  *   **CONCEPTUAL:** **STOP.** Verdict: *Mechanism Speculative.* (See Slip E).
  *   *NOTE: This question cannot be answered by the screen. It requires committee consensus on risk tolerance.*

  ***

  # VERDICT SLIPS (For Chair's Office)

  **Slip A (Circularity — Rejection)**
  "The proposal explains the phenomenon by positing a capacity that is defined by the phenomenon itself. To be fundable, the mechanism must be described in terms that do not presuppose the outcome it is meant to produce."

  **Slip B (Borrowed Crane — Rejection)**
  "The proposed mechanism relies on background conditions present in its domain of origin but not specified for this context. To be fundable, the proposal must identify the specific components in this system that fulfill those necessary roles."

  **Slip C (Localization — Revision Required)**
  "The proposal identifies the location of the effect but does not yet detail the process by which the lower-level components generate the higher-level function. Funding is contingent on filling the 'Mechanism Box' to clarify the causal steps."

  **Slip D (Higher-Level/Principle — Acceptance)**
  "The proposal offers a structural or mathematical explanation appropriate to the level of the phenomenon. No lower-level mechanistic detail is required for this pilot stage."

  **Slip E (Speculation — Rejection)**
  "The link between the proposed components and the phenomenon relies on conceptual assumptions that are not yet established. This exceeds the risk tolerance for pilot funding."

  ***

  # TEST CASE VERDICTS

  **1. Psychology/Neuroscience (Amygdala Tagging)**
  *   **Run:** Q1 (No, tagging is distinct from recall) → Q2 (N/A) → Q3 (No, specifies tagging/consolidation process) → Q4 (No) → Q5 (Technical).
  *   **Verdict:** **PASS (Mechanism Plausible).**
  *   **Slip:** *None required; standard approval.*

  **2. Sociology (Collective Efficacy)**
  *   **Run:** Q1 (No, "efficacy" is operationalized by survey, not defined by recovery) → Q2 (N/A) → Q3 (No) → Q4 (Yes, social-level pattern).
  *   **Verdict:** **PASS (Legitimate Higher-Level Description).**
  *   **Slip:** *Slip D.*
  *   **Note:** You are correct; this screen is more permissive than your philosophical intuition. It treats operationalized survey constructs as non-circular components. It protects the social science from reductionism but cannot detect latent circularity in the construct definition itself.

  **3. Biomechanics (Bone Optimality)**
  *   **Run:** Q1 (No) → Q2 (No) → Q3 (No) → Q4 (Yes, principle of minimization).
  *   **Verdict:** **PASS (Legitimate Higher-Level Description).**
  *   **Slip:** *Slip D.*
  *   **Note:** This screen explicitly protects mathematical/constraint-based explanations from being rejected for lacking "parts."

  ***

  # LIMITATIONS & DISCLOSURE

  **Where this screen misfires:**
  1.  **Historical Explanations:** It cannot evaluate explanations that rely on path-dependence rather than current machinery.
  2.  **Normative Explanations:** It treats norms as "Borrowed Cranes" unless they are cashed out as social mechanisms.
  3.  **Your Dissertation:** "Your dissertation posits a normative constraint as a causal driver; this screen classifies that as a 'Borrowed Crane' unless you specify the social machinery that enforces the norm."
  4.  **Neuro-Bias:** Q3 mitigates but does not eliminate the bias; reviewers may still score "Mechanism Plausible" higher than "Higher-Level Description" during ranking.

  **Policy Warning:**
  Q5 is not a philosophical question; it is a budget question. The screen cannot determine how much speculation $25,000 should buy. The committee must decide that threshold explicitly before ranking begins.
