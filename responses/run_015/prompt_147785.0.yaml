      *   *Premature Reductionism:* This is the problem of multiple realizability or autonomous higher-level laws. *Test:* Is the phenomenon defined at a level where lower-level detail is irrelevant or currently inaccessible?
      *   *Borrowed Cranes:* This is the problem of analogical overreach or context-stripping. *Test:* Does the mechanism require background conditions present in the source domain but absent in the target domain?
      *   *Neuro/Molecular Bias:* This is "neurorealism" or "reductionism chic." *Test:* Does naming the part actually explain the *function* or just locate it?

  3.  **Drafting the Decision Procedure (The "Screen"):**

      *   *Goal:* 5-6 ordered questions.
      *   *Constraint:* Must fit on one page and be runnable by non-philosophers.
      *   *Structure:* Flowchart style logic (If Yes -> Go to X, If No -> Stop/Flag).
