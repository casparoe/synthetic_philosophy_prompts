answer: |-
  Prioritize quantifying the divergence between planning-optimal and action-optimal policies as a function of signal accuracy $r$, since this threshold dictates whether your agent's scaffolding should enforce precommitment or enable dynamic updating based on context-window summaries.

  **Phase 1: Mapping the Divergence (Months 1–2)**
  Your first task is to numerically solve the noisy-odometer AMD for $N \in \{3, 4, 5\}$ across $r \in [0, 1]$. Specifically, calculate the optimal policy under **Planning-Optimality** (maximizing ex-ante expected utility, à la Piccione & Rubinstein) versus **Action-Optimality** (maximizing conditional expected utility given the signal, à la standard Bayesian updating).
  *   **Why Upstream:** This is the gatekeeper. If these concepts converge for any $r > 0.1$, the philosophical debate is irrelevant for practical agents who will always have *some* signal (logs, hashes, summaries). If they diverge significantly even at high $r$, you have a genuine scaffolding conflict.
  *   **Feasibility:** High. This is constrained optimization over a simple probability tree. You can write a solver in a week.
  *   **Move Up/Down:** If you find the policies converge rapidly as $r$ increases (e.g., identical recommendations for $r > 0.2$), pivot immediately to Phase 2. If they diverge even at $r=0.9$, this becomes your entire paper.
  *   **LLM Link:** This tells you if an agent should ignore its own "where am I?" reasoning (Planning) or trust its context window (Action).

  **Phase 2: The Value of Memory Precision (Months 3–4)**
  Once you know the policies diverge, model the cost of increasing $r$. In LLM terms, this is the token/compute cost of better summarization or retrieval to reduce memory loss. Calculate the marginal value of information for $r$ under the winning solution concept from Phase 1.
  *   **Why Upstream:** You cannot recommend scaffolding investments (e.g., "spend 20% of context on state tracking") without knowing the payoff curve. Imperfect recall often creates non-monotonic VoI; you need to know if there are "dead zones" where improving memory doesn't improve payoff because the decision rule switches.
  *   **Feasibility:** Medium. Requires defining a cost function $c(r)$, but you can test standard forms (logarithmic, linear) to see if the shape holds.
  *   **Move Up/Down:** If the VoI curve is smooth and standard, this becomes a sidebar. If it shows discontinuities (e.g., memory is worthless until $r > 0.5$), this is your main contribution to agent engineering.

  **Phase 3: Empirical Validation with Proxy Agents (Months 5–6)**
  Implement a simple RL agent or a prompted LLM loop in a simulated $N$-exit environment where the "context window" is artificially degraded to match $r$. Test whether agents trained via RL (approximating Action-Optimality) outperform agents hard-coded with Planning-Optimal policies.
  *   **Why Upstream:** Theory often breaks when the "agent" is a black-box function approximator rather than a rational expected utility maximizer. This validates whether the decision theory maps to gradient descent behavior.
  *   **Feasibility:** Risky. LLMs are noisy and expensive. Use a small model or a simple neural net proxy to keep iterations fast.
  *   **Move Up/Down:** If the empirical results match Phase 1, you have a robust paper. If RL agents find a third path (e.g., learning to encode state in action patterns), you pivot to describing that emergent strategy.

  **What to Drop**
  1.  **Correlated Noise:** Drop this unless Phase 1 shows extreme sensitivity to independent noise. Correlated noise usually rescales effective $r$ without changing the structural dilemma. It adds mathematical pain without changing the scaffolding advice (which is "improve $r$").
  2.  **Large $N$ Asymptotics:** Drop $N \to \infty$ analysis. The structural tension exists at $N=3$. LLM loops are rarely infinite, and finite-horizon effects dominate practical scaffolding.
  3.  **Philosophical Reconciliation:** Do not spend time arguing which solution concept is "true." Argue which one yields higher payoff in a simulated loop. Your goal is engineering leverage, not metaphysical correctness.

  **Kill Criteria**
  *   **Month 2:** If Planning and Action optimality coincide for $r > 0.3$, stop. The recommendation becomes "ensure minimal state tracking ($r > 0.3$) and then ignore the rest." Write that up and stop.
  *   **Month 4:** If the Value of Information is monotonic and standard, do not over-engineer the theory. Focus the paper on the empirical validation in Phase 3.
  *   **Month 5:** If the LLM/RL agents fail to learn the theoretical optimum regardless of scaffolding, the decision theory is irrelevant for current architectures. Pivot to documenting the failure mode as a limitation of current models.
