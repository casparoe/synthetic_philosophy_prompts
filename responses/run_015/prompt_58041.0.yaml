answer: |-
  **Game: The Surplus Protocol**

  **Setup:** Divide 18 students into two isolated groups (North/South, 9 each). Provide printed packets.
  **Payoffs (Tokens):** Both Pool = 10 each. Both Hold = 4 each. One Pool/One Hold = 0/15.
  **Symmetry Clause:** Packets state: "The other group received this exact text. They know you received this text. This is common knowledge."
  **Materials:** Decision cards, prediction sheets, token ledger. No money.

  **Timeline (75 Minutes)**
  *   **0–10:** Isolate groups. Distribute packets. Read aloud the Symmetry Clause.
  *   **10–20:** **Private Prediction.** Students individually write: (1) Their choice, (2) Predicted opponent choice, (3) "Does your deliberation influence their outcome? Yes/No." Collect sheets.
  *   **20–30:** **Deliberation.** Groups discuss strategy internally. No inter-group contact.
  *   **30–35:** **Binding Choice.** Groups submit one signed decision card (Pool/Hold).
  *   **35–45:** **Reveal.** Reconvene. Reveal choices. Distribute tokens based on matrix.
  *   **45–75:** **Debrief.**

  **Debrief Structure**
  1.  **Data Review (45–55):** Compare private predictions to actual choices. Highlight discrepancies between "What I do" and "What they do" despite identical instructions.
  2.  **Conceptual Mapping (55–65):** Introduce **Causal Independence** (your choice cannot physically change theirs) vs. **Evidential Symmetry** (your choice is evidence of theirs because reasoning processes are identical). Explain that dominance reasoning relies on the former, while superrationality relies on the latter.
  3.  **Predictable Failure & Recovery (65–70):** Students will likely defect, citing causal independence. *Recovery:* Ask defectors: "If your reasoning is rational, and theirs is identical, why does rationality lead to different outputs?" Force confrontation with the symmetry premise.
  4.  **Limitation (70–75):** Acknowledge the simulation lacks logical identity; it relies on psychological similarity. True superrationality requires logical necessity, not just empirical symmetry.

  **Pedagogical Stand**
  Symmetric reasoning *genuinely warrants cooperation* in this context. Dominance reasoning is epistemically blind here. It assumes the other's choice is a fixed state independent of your deliberation. However, when you know the other party is running the same algorithm (reasoning process) on the same data (instructions), your deliberation does not merely select an action for you; it selects the output for the algorithm itself. To choose "Hold" is to assert that your instantiation of the reasoning process is causally potent for you but inert for them, despite identical conditions. This violates the symmetry premise. Therefore, cooperation is not merely hopeful; it is the only choice consistent with the known logical correlation between identical rational agents. Defection is a failure to recognize that in symmetric dilemmas, you do not choose for yourself alone; you choose for the reasoning type you instantiate.

