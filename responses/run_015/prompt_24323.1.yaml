      *   *The Ultimate Argument (Legitimation):* The state claiming the right to kill is the ultimate usurpation. This is the philosophical anchor that holds up even if deterrence data is weak.
      *   *Conclusion:* The essay doesn't undermine itself. The emotional opening reveals the *reality*, the practical argument addresses the *justification*, and the philosophical argument addresses the *principle*. They work together, not in opposition.

  6.  **Refining the Tone:**
