answer: |-
  Good afternoon. Welcome to colleagues, former students, and to Elena's family and friends who are here primarily because they love her, not because they care about the modal properties of fragility.

  For forty years, Elena has worked on the metaphysics of dispositions. For those of you who aren't philosophers, a disposition is a potential: glass is fragile, sugar is soluble. But Elena spent her career studying the exceptions. She studied cases where a glass is struck but doesn't break—not because it isn't fragile, but because something interferes. In the literature, we call these "finks" and "masks."

  Usually, a mask blocks the result. A fink removes the ability entirely the moment things get tough. But looking over her career, I've come to think Elena identified something more subtle, something I want to call a "social fink."

  A social fink is a collective capacity that doesn't vanish when stress hits. Instead, it gets structurally rerouted so the triggering conditions never actually reach it. The ability remains intact, but the institution reshuffles the roles so quickly that the capacity is hidden in plain sight. It looks like failure, but it's actually resilience.

  This distinction shapes how we honor her today. It would be easy to say Elena "changed the field." But that implies a simple causal chain—that she pushed a domino and the field fell over. That treats influence like a direct disposition. But Elena taught us that influence is rarely that direct.

  She didn't just change the field; she showed us how the field hides its own capacities. She taught us that when an institution seems to lose its way, the wisdom hasn't necessarily disappeared. It has often been rerouted. It is waiting in the margins, masked by bureaucracy, protected by the very structures that seem to suppress it.

  In this sense, her legacy is not a monument we look back on. It is a capacity that is still active, even if the triggering conditions of her daily presence are changing. She is not leaving us in the sense of vanishing. She is retiring in the sense of rerouting.

  To the family here: You know this better than any of us. You know that Elena's capacity for care, for rigor, for patience, never disappeared even when the university was at its most demanding. The institution might have tried to trigger a breakdown, but she structurally rerouted the pressure. She protected the capacity by changing the path.

  So, we are not here to mark an end. We are here to acknowledge a shift in conditions. The fragility remains, but the breaking point has been moved. The work continues, even if the name on the office door changes.

  Elena, thank you for teaching us to look for the capacity that survives the stimulus. Thank you for showing us that rerouting is not disappearance. And thank you for proving that a disposition can remain intact, even when the world tries to strike it.

  Happy retirement.
