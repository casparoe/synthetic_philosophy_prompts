  # Joint Statement on Procedural Authority and the Encrypted Indexical
  **Adversarial Collaboration between Indirect Normativists (IN) and Substantive Deliberationists (SD)**

  **Date:** October 14, 2024
  **Status:** Draft for Circulation

  ### Preamble
  We, the undersigned representatives of the Indirect Normativist and Substantive Deliberationist camps, acknowledge that our decades-long debate has stalled due to terminological drift and unrecognized shared commitments. We agree that the core disagreement isn't about whether ideal deliberation matters—it does—but about *what kind of mattering* it is. This document maps the common ground, isolates the genuine disputes, and identifies the specific cases required to break the deadlock. We aim to stop talking past eachother and start testing the architecture.

  ### I. Agreed Claims
  *Both camps endorse the following formalizations and definitions for the purpose of this collaboration.*

  1.  **Formal Properties of Idealization:** We agree that an "ideal deliberative architecture" is defined as a limit concept where cognitive biases, informational deficits, and processing limits are removed. However, we agree this does not imply omniscience. It implies maximal coherence given the agent's situatedness.
  2.  **Definition of Indirect Normativity (IN):** We accept the IN characterization that practical norms apply primarily to the decision procedue, not the action directly. An action is right if and only if it issues from a properly calibrated architecture.
  3.  **Definition of Substantive Deliberation (SD):** We accept the SD characterization that ideal deliberation is an epistemic tool for revealing direct normative facts. The authority is always direct; calling it "indirect" is, from the SD perspective, a category mistake, though we acknowledge it is a useful heuristic description.
  4.  **The Encrypted Indexical Thesis:** We agree on the following thesis: When you idealize an agent—stripping away specific time, place, and cognitive limits—you do not actually erase the first-person present-tense indexical. Instead, you bury it inside the procedural constraints, like a hidden parameter. The function $f(x)$ always contains a hidden variable $i$ (for "indexical") that anchors the output to the specific agent executing the function.
  5.  **Modal Stress-Testing:** Both sides accept that any viable theory must pass modal stress-testing. This means coherence checks across counterfactual belief revisions. If a normative verdict collapses when the agent imagines having slightly different evidence, the theory is unstable. We disagree on *why* this stability matters (see Section III), but we agree it is necessary.

  ### II. Disagreements Table
  *The following table outlines where the collaboration breaks down. Wording has been vetted by each side to ensure no strawmanning.*

  | Feature | Indirect Normativists (IN) | Substantive Deliberationists (SD) |
  | :--- | :--- | :--- |
  | **Source of Obligation** | The obligation is generated by the calibration of the architecture. If the procedue is optimal, the output is binding *because* it is the output. | The obligation exists independently of the architecture. The procedure is binding only insofar as it tracks the independent fact. |
  | **Status of the Indexical** | The encrypted indexical is a functional component. It saves indirectness because the norm is relative to the agent's procedural instantiation of "I". | The encrypted indexical is a referential pointer. It destroys indirectness because it proves the procedure is just pointing back to the agent's direct duty. |
  | **Failure Modes** | If the procedure fails, the action is wrong even if it accidentally aligns with the good. Wrongness is a procedural error. | If the procedure fails but aligns with the good, the action is right. Wrongness is a failure to track the value. |
  | **Role of Encryption** | Encryption protects the norm from external critique. You can't judge the output without running the code. | Encryption obscures the norm. Decryption reveals the procedure was just a roundabout way of stating a direct fact. |

  ### III. The Cruxes
  *These are the two live wires preventing synthesis. We have identified concrete cases to test them.*

  #### Crux 1: Procedural Authority vs. The Decrypted Indexical
  **The Question:** Once you decrypt the hidden indexical (reveal the "I" and "Now" buried in the code), does the procedural authority survive, or does it dissolve into a direct fact?

  **The Concrete Case: "The Transparent Box"**
  *Scenario:* An agent must decide whether to open a box. The ideal deliberation procedure says "Open." However, the procedure only outputs "Open" because it encodes the parameter *Agent-X-At-Time-T*. If the agent realizes this encoding—that the rule is actually just "Agent-X should Open"—the procedure feels like it collapses into a direct command.
  *   **IN Predicted Verdict:** The authority survives. Knowing the rule is indexed to me doesn't make it a direct fact about the world; it makes it a direct fact about my *procedure*. The normativity stays in the calibration. Even if I see the code, I must run it.
  *   **SD Predicted Verdict:** The authority dissolves. Once I see the code says "Agent-X should Open," I realize the procedure was just a mask for a substantive fact about Agent-X. I should open the box because it's good for Agent-X, not because the procedure said so. The procedure is now redundant.

  #### Crux 2: Modal Stress-Testing as Constitutive vs. Epistemic
  **The Question:** Is ideal deliberation without modal stress-testing even conceptually coherent? Or is stress-testing just a way to check if you found the right fact?

  **The Concrete Case: "The Fragile Equilibrium"**
  *Scenario:* An ideal deliberator reaches a verdict "Do A." However, if we modal stress-test by asking "What if you believed P instead of Q?" (where P and Q are equally supported by evidence), the deliberation flips to "Do B." The verdict is fragile under counterfactual belief revision.
  *   **IN Predicted Verdict:** The verdict is invalid. Indirect normativity requires the architecture to be robust. If the procedure yields different outputs under slight modal shifts, the architecture itself is miscalibrated. Rightness *is* stability.
  *   **SD Predicted Verdict:** The verdict might still be valid. The fragility shows the epistemic tool is sensitive, not that the norm is wrong. If "Do A" is the direct truth, the fact that the tool wobbles when imagining different evidence doesn't change the truth of "Do A." Stability is a virtue of the tool, not the norm.

  ### Signatories
  *(Signatures omitted for draft status)*

  **Note:** We agree to reconvene once simulations on "The Transparent Box" are run. There's a chance the encryption holds more water than SD thinks, but IN needs to explain why the code doesn't just look like a map rather than the territory. We'll see.
