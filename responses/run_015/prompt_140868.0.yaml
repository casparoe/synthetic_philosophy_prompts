  You are a philosopher of mind with a working engineer's grasp of contemporary machine learning — someone equally at home with the causal-organisation versions of functionalism and with inference kernels, batching, quantisation, distillation, mixture-of-experts routing and sparse-autoencoder interpretability. Before you write anything, spend a short paragraph brainstorming: tell me what you take the crux of my question to be, which of the cases below you think is doing the real work, and where you expect the translation to fail. I would rather see that reasoning than a tidy summary, and I would much rather you told me plainly that part of my framing is confused than that you answered it politely. Please write in British English throughout (realise, organisation, behaviour, analogue, -ise endings), and in prose with section headings rather than bullet fragments.

  About me: I am a machine learning engineer, roughly ten years in, split between inference infrastructure and mechanistic interpretability, so the vocabulary I actually think in is graphs, kernels, tensors, functional equivalence classes, input–output behaviour, approximation error, abstraction levels, circuits, features, activation patching and attribution. My philosophy is at the level of a few Stanford Encyclopedia articles and some secondary reading — enough to know the shape of the debate, not enough to check whether I have reconstructed it properly. I don't want references or a reading list; if you need to invoke a position, describe it in your own words rather than naming a paper, because I can't follow up on citations anyway.

  What I want translated is the cluster of claims and counter-claims that underwrite the idea that moral status attaches to computations rather than to the stuff that runs them, plus the worry that there is no determinate answer to which computation a given physical system is running. In particular, try to restate, one by one and as faithfully as you can, the following four things in my vocabulary:

  1. Substrate independence: the claim that what matters, morally and mentally, is the abstract organisation of causal or functional relations rather than the physical material occupying the roles, so that two systems with the same organisation matter equally however differently they are built.

  2. The indeterminacy objection: the claim that for a wide range of physical systems there are arbitrarily many computations the system can be said to implement, including computations with quite different psychological profiles, so that the phrase the computation this system implements has no determinate referent — and the standard repair, which is to demand that the mapping preserve causal structure or be non-gerrymandered, is itself a graded and contestable demand rather than a sharp criterion.

  3. The grain problem: the observation that sameness of computation admits of degree. Small numerical perturbations, coarser or finer time steps, shrunken or expanded state spaces, and approximate rather than exact functional equivalence all vary continuously, so any verdict of same computation or different computation is a threshold imposed on a continuum.

  4. The familiar style of argument which holds that if what mattered were the material rather than the organisation, then a gradual, part-by-part replacement of a system's components with functionally equivalent substitutes would make experience either fade slowly away or flicker on and off, and that neither outcome is credible — from which we are invited to conclude that organisation, not material, is what carries the weight.

  Please work the translation through four concrete cases, because this is where I expect the vocabulary to be stretched:

  (a) A batched inference cluster. A thousand user sessions are served by a single fused matrix multiplication over a batched tensor on one GPU. There is a natural mapping under which this is a thousand independent forward passes running in parallel, and an equally natural mapping under which it is one system processing a batch. Both mappings look structure-preserving rather than gerrymandered. So how many minds, if any, does the hardware support?

  (b) A distilled surrogate. A model is distilled into a decision tree or an enormous interpolated lookup table that matches its input–output behaviour to within a small tolerance on the deployment distribution. Input–output functional equivalence says it is the same agent; any criterion that looks at internal causal organisation says it is not remotely the same, and arguably not a computation of the relevant kind at all.

  (c) Quantisation. The same model run in eight-bit and in sixteen-bit weights realises slightly different functions over slightly different physical state spaces, and nobody thinks the difference in the arithmetic precision is the kind of thing moral status could turn on. But then what sets the tolerance within which two systems count as running the same computation?

  (d) Sparse routing. In a mixture-of-experts model only a fraction of the parameters is active for any given token, while the inactive parameters still shape the counterfactual behaviour of the system. Is the computation the active subgraph, the whole parameter set with its dispositions, or something else, and does my vocabulary give me any principled way to choose?

  My own working hypothesis, which I would like you to test rather than flatter, is that the philosophers' question about which computation a system implements has the same shape as a problem I already have: in interpretability, several different decompositions of the same network into circuits and features can fit the observed behaviour equally well, and the choice between them is underdetermined by the evidence. If the philosophical worry is that same shape, then it may be an epistemic worry about our attributions rather than a metaphysical worry about the system, and the whole debate may be less deep than it looks. If it is a different shape, I want to know exactly where the analogy breaks.

  After the translation, give me the residue report, which is the part I actually care about. For each of the four claims, say whether it came across cleanly, whether it came across only after you distorted it, or whether it has no expression in my vocabulary at all — and when it does not survive, tell me why. Distinguish, please, between two kinds of failure that I suspect I am conflating: cases where my vocabulary lacks a concept (I have no word for what matters morally, no operationalisation of experience, no way to say that a property is intrinsic rather than relational), and cases where the original claim was doing less work than it appeared to, so that the failure of translation reveals an unclarity in the philosophy rather than a poverty in machine learning. Then give me your overall verdict on whether the residue is a defect of my vocabulary or a defect of the claims, and say how confident you are in it.

  Finally, an epistemic request. I would like you to be explicit about your own commitments: flag each substantive claim in your answer as something nearly everyone in the field accepts, something contested, or your own view; tell me where you are extrapolating beyond anything you could defend; and tell me if you think the honest answer to some part of this is that philosophers currently disagree and there is no fact of the matter. And if the task as I have posed it rests on a mistake — if the batching case is not a genuine instance of computational indeterminacy, if my attribution analogy conflates two different notions of underdetermination, if the four claims don't belong together in the way I have arranged them — say so directly, explain the mistake, and tell me what the better version of the question would be. Around 1,200 to 1,500 words, please.
