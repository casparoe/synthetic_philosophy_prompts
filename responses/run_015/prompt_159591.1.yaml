answer: |-
  # Activity: The Temporal Deadlock

  ## 1. Materials and Setup

  **Room:**
  *   Darkable seminar room.
  *   Projector screen (white, non-textured preferred).
  *   Seating arranged in two semi-circles facing the screen (Team Left, Team Right).
  *   Instructor station with laptop connected to projector.

  **Hardware:**
  *   Laptop capable of running stimulus software with millisecond precision (PsychoPy, OpenSesame, or MATLAB/Psychtoolbox). *Do not use PowerPoint animations; frame-skipping will destroy the effect.*
  *   14 Response Keys (or simple clickers). If unavailable, use raised hands (less precise for RT) or have students use their own laptops running a simple local HTML/JS reaction timer file loaded beforehand.
  *   Whiteboard and markers (two colors).
  *   Printed "Wager Sheets" (one per team).

  **Software/Stimulus Parameters:**
  *   **Stimulus:** Two discrete disks.
  *   **Positions:** Left (x=-5°) and Right (x=+5°) of fixation cross. Vertical alignment identical.
  *   **Colors:** High saturation Red (RGB 255,0,0) and Green (RGB 0,255,0).
  *   **Timing (Critical):**
      *   Flash 1 Duration: 10–15 ms (1 frame at 60Hz, preferably 1–2 frames at 120Hz).
      *   ISI (Inter-Stimulus Interval): 30–50 ms (2–3 frames at 60Hz).
      *   Flash 2 Duration: 10–15 ms.
      *   Total Trial Length: 1000 ms (to allow response).
  *   **Fixation:** Central cross present throughout.
  *   **Piloting:** Run the stimulus on the specific projector 24 hours prior. Projectors often have input lag. If the ISI is too long (>60ms), you get two flashing dots. If too short (<20ms), you get fusion without motion. Adjust ISI until *you* perceive smooth motion with a mid-path color change.

  **Handouts:**
  *   **Team A Card (The Revisionists):** "Conscious experience happens immediately. When the first flash hits, you experience it. When the second flash hits, the brain updates the memory of the first event to match the new data. You experience reality, then your memory is rewritten."
  *   **Team B Card (The Delayers):** "Conscious experience is delayed. The brain collects both flashes before showing you anything. It constructs the motion and color change offline, then presents the finished movie to consciousness. You never experience the raw flashes, only the edited movie."
  *   **Data Sheet:** Columns for Trial #, Condition, Reported Motion (Y/N), Reported Color Change (Y/N), Reaction Time (ms).

  ## 2. Trial Schedule

  Total Trials: 40 (approx. 20 minutes of runtime).

  1.  **Practice Block (5 trials):** Standard Phi (Red → Green). No data recorded. Ensures everyone sees the illusion.
  2.  **Block 1: Standard (15 trials):** Red → Green. Randomized ISI within effective range (30–50ms).
  3.  **Block 2: Reaction Time (10 trials):** Red → Green. Students press key the *instant* they perceive the color change.
  4.  **Block 3: Catch Trials (10 trials):**
      *   *Omission (5 trials):* Flash 1 (Red) → No Flash 2.
      *   *Same Color (5 trials):* Flash 1 (Red) → Flash 2 (Red).
      *   *Instruction:* "Report exactly what you saw. Do not guess based on previous trials."

  ## 3. Rules and Payoff Scheme

  **The Wager:**
  Before Block 1 begins, teams have 10 minutes to consult. They must fill out a **Prediction Manifesto**.

  *   **Metric 1 (Phenomenology):** What % of Standard trials will report "Motion with Color Change"?
  *   **Metric 2 (Timing):** In Block 2, what is the average Reaction Time (relative to Flash 1 onset)?
  *   **Metric 3 (Catch):** In Omission trials, what % will report "Motion"?

  **Scoring:**
  *   Each team starts with 100 points.
  *   They wager up to 50 points on each Metric.
  *   **Winning:** If the actual data falls within ±5% (for %) or ±50ms (for RT) of your prediction, you keep your wager. If not, you lose it.
  *   **The Twist:** If *both* teams predict the same number (within tolerance), both keep their wager. If predictions differ significantly, the team closer to data wins the opponent's wagered points.

  **Constraint:** Teams cannot discuss with each other during the wager phase.

  ## 4. Minute-by-Minute Timeline (90 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00–10** | **Intro & Demo** | Darken room. Explain task: "We are investigating visual timing." Run 3 practice trials. Ask for show of hands: "Who saw one moving dot changing color?" Ensure >80% say yes. |
  | **10–15** | **Team Assignment** | Split room. Hand out Team A and Team B Cards. Emphasize: "These are competing physical models of your brain. Do not share your card text." |
  | **15–25** | **The Wager** | Teams draft Prediction Manifesto. Instructor circulates to ensure they understand they are betting on *observable data*, not feelings. |
  | **25–35** | **Block 1 & 2 Run** | Run Standard and RT trials. Students record data individually. Instructor projects aggregate RT live (if software allows) or collects sheets. |
  | **35–45** | **Block 3 Run** | Run Catch Trials. Emphasize: "Trust your eyes, not your expectations." |
  | **45–55** | **Data Aggregation** | Project the results. Calculate averages. Compare to Wagers. |
  | **55–65** | **The Crisis** | Ask teams: "Who won?" Reveal that predictions likely converged. Ask: "How do we break the tie? Propose a new test." (Allow 2 proposals, run mentally or quickly). Show they fail. |
  | **65–90** | **Debrief** | Reveal the names. Map activity to distinction. Discuss implications. |

  ## 5. Debrief Script (The Reveal)

  **Phase 1: The Empirical Deadlock (65–75 mins)**
  *   **Instructor:** "Look at the board. Team A predicted 90% motion reports. Team B predicted 90% motion reports. Team A predicted 400ms reaction time. Team B predicted 400ms. The data matches both. Why?"
  *   **Discussion:** Guide them to see that both theories are designed to save the phenomena. They are *post-hoc* explanations of the same report.
  *   **Key Question:** "If I wired your brain and measured neural firing, could I tell the difference?" (Let them debate. Most will say yes—e.g., look for early vs. late activation. Push back: "How do you know which activation *is* the experience?")

  **Phase 2: Naming the Distinction (75–85 mins)**
  *   **Instructor:** "Team A, your theory is **Orwellian**. Like a historian rewriting the past. The experience happens, then the memory is falsified."
  *   **Instructor:** "Team B, your theory is **Stalinesque**. Like a show trial staged before the public sees it. The experience is constructed in private, then displayed."
  *   **Instructor:** "This is Daniel Dennett's distinction. He argues this activity proves something radical: **There is no fact of the matter.**"
  *   **Explanation:** If no measurement (behavioral, neural, introspective) can distinguish them, the distinction is illusory. Consciousness isn't a single moment in time; it's a process of 'Multiple Drafts' where various edits happen at different times for different purposes. There is no 'Central Theater' where the movie plays.

  **Phase 3: The Philosophical Upshot (85–90 mins)**
  *   **Instructor:** "We assume there is a 'when' to experience. This experiment suggests 'when' is a property of the report, not the experience itself. If you can't pin down the time, did it happen at a time?"

  ## 6. Troubleshooting: What Will Go Wrong

  1.  **Projector Lag kills the Phi:**
      *   *Symptom:* Students see two distinct flashing dots, no motion.
      *   *Fix:* Have a backup video file pre-rendered at 120fps if your software struggles. If still failing, increase ISI slightly but warn that motion may be jerky. Acknowledge the tech limitation as a metaphor for neural noise.
  2.  **The "Philosopher" Student:**
      *   *Symptom:* A student reads Dennett beforehand or guesses the point during the Wager phase.
      *   *Fix:* Pull them aside during the break. Ask them to play "Devil's Advocate" for the opposing team to keep the tension alive. Do not let them reveal the names.
  3.  **Catch Trial Contamination:**
      *   *Symptom:* Students report motion on Omission trials because they expect it.
      *   *Fix:* Remind them during instructions: "If you see two flashes, say two flashes. You are not being tested on accuracy, you are being tested on honesty." Discard data from students who report 100% motion on omissions.
  4.  **Reaction Time Variance:**
      *   *Symptom:* RT data is too noisy to compare.
      *   *Fix:* Don't focus on the absolute ms. Focus on the *distribution*. Both teams should predict the same distribution shape. If the data is messy, pivot to the qualitative report ("Did you feel the change before the second flash?").
  5.  **Time Overrun:**
      *   *Symptom:* Wager phase drags on.
      *   *Fix:* Hard stop at 25 mins. Collect sheets even if incomplete. The lesson works even with rough predictions.

  ## 7. Honest Limitation

  **The Activity Cannot Stage:**
  This activity demonstrates **epistemic indistinguishability** (we cannot *know* which is true). It does not prove **ontological indistinguishability** (that there *is* no fact of the matter).

  A realist about consciousness can argue: "Just because we can't measure the difference doesn't mean the difference isn't there. Maybe future tech will find it."
  Dennett's claim is stronger: he says the question itself is malformed. You will have to argue this philosophical leap yourself. The experiment only forces the deadlock; it does not force the dissolution of the distinction. You must make the case that verification limits *constitute* reality in this domain, which is a contentious metaphysical move, not an empirical finding.
