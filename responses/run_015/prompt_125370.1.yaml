answer: |-
  A developer is trying to debug a containerized service that crashes whenever its memory allocation hits 100%.

  She writes a diagnostic script to run inside the container, tasked with logging a complete memory map the exact moment the crash occurs.

  She deploys it. The crash stops happening.

  She checks the logs. The script reports: "Memory at 99%."

  She realizes the script itself is occupying the final 1% required to trigger the crash.

  She asks her lead engineer, "How do I get an accurate model of the system's limits from inside the system?"

  The lead says, "You have two options. You can submit a log file with data in it, or you can submit an empty file."

  "Why those two?"

  "Because if the file has data, it proves there was space to write it, which means the system wasn't full. And if the system was truly full, there would be no space to write the file."

  "So what's the true state of the system?"

  "The true state is the empty file. It's the only report accurate enough to fit."
