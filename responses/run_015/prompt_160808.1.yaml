  Subject: Re: Friday deploy argument

  Hey, I heard about the deploy debate and wanted to weigh in since you asked for a sanity check on the logic. You are right to feel that something is off about your colleague's argument, and your intuition that step five is correct while step one doesn't necessarily need to be sacrificed is spot on. The argument your teammate presented is a classic philosophical problem known as Logical Fatalism, often illustrated by Aristotle's sea battle example, and it relies on a subtle conflation between truth and necessity that trips up a lot of people when they first encounter it. The step you need to reject is step two, which claims that if a proposition about the future is true now, then nothing we do can make it false. This looks fine on the surface because it treats truth as a kind of physical constraint on the world, but in reality, truth is descriptive rather than prescriptive. Just because it is true today that you will write the rollback script tomorrow does not mean you are forced to write it by some external law; it simply means that the future state of affairs includes you writing it, and part of the causal chain leading to that truth is your decision to stay up and work.

  The confusion here stems from mixing up the idea that the future is fixed with the idea that the future is fixed independently of our actions. When your colleague brings up determinism regarding your CI pipeline, they are technically correct that given a specific state of the universe and specific laws of physics, only one future is possible, but they are missing that your decision to stay up late is part of that specific state of the universe. In a deterministic system, the output is fixed relative to the input, but your deliberation and subsequent action are inputs to the system, not observers outside of it. If you go home, the input changes, and therefore the deterministic output changes accordingly. Step two fails because it assumes the truth of the future proposition is a brute fact that exists prior to and independent of the causal processes that produce it, whereas in a deterministic world, the truth of the proposition supervenes on those very processes. You can keep the law of excluded middle from step one without accepting fatalism because saying either the service comes up clean or it does not is logically valid without implying that the outcome is inevitable regardless of human intervention.

  Regarding the comment you heard about a disjunction being true without either of its parts being true, that sounded like word salad because it is technically incorrect in classical logic, but it refers to a specific semantic workaround called supervaluationism that some philosophers use to solve this exact problem. In that framework, the statement either it happens or it does not is considered super-true because it holds in all possible futures, while neither it happens nor it does not happen is assigned a definite truth value yet because different futures have different outcomes. You do not need to adopt this view to solve your argument, and as a backend dev working with classical logic systems, you would find it cumbersome because it breaks standard boolean reasoning. The cost of rejecting step two is essentially zero because it is simply a logical error to infer necessity from truth, whereas the cost of rejecting step one is high because it forces you to abandon classical bivalence, complicating your monitoring alerts and planning logic by introducing a third truth value or truth-value gaps for future events.

  I am about ninety percent confident in this analysis because the distinction between truth and necessity is the standard resolution to logical fatalism in modern modal logic, and it aligns perfectly with how we model causal systems in computer science. The one point I am least sure about is the precise metaphysical cost of retaining bivalence for future contingents, as some philosophers argue that assigning truth values to future events implies a block universe where time is spatialized, which might conflict with a robust sense of free agency even if it doesn't break your logic. However, for the purposes of your team argument and your daily work, you can safely assert that step two is the broken link because it treats the truth of a prediction as a cause rather than a description, meaning your decision to write the script is exactly what makes the proposition true rather than being rendered irrelevant by it.
