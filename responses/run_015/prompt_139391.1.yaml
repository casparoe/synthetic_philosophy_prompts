answer: |-
  The opening definition provided in the chapter is broadly acceptable to a sympathetic Kantian, as it correctly identifies the core mechanism of the Formula of Universal Law, which requires agents to act only on maxims that can be willed as universal laws. However, even here there is a slight simplification in describing a maxim merely as a personal rule, since Kant intends it to be the subjective principle of volition that includes both the action and the reason for it, but this is a standard pedagogical shorthand that does not yet distort the theory. The trouble begins subtly with the next claim, which suggests that in practice the test means imagining a world where everybody does what you are about to do and asking whether you could accept living in it. This is the precise point where the consequentialist reading is smuggled in, because it shifts the criterion of evaluation from logical consistency to personal preference regarding outcomes. For Kant, the test is not about whether the resulting world is desirable or acceptable to live in, but whether the maxim can be conceived as a universal law without contradiction or whether the will can consistently endorse it without contradicting its own purposes. By framing the test as an inquiry into whether one would accept the state of affairs, the chapter replaces the deontological check on rational consistency with a utilitarian calculation of welfare, thereby setting up the subsequent conflation as a self-fulfilling prophecy.

  This conflation becomes explicit when the chapter explains why lying comes out badly, claiming that universal lying would destroy trust and that a world without trust is worse for everyone. A strict Kantian would reject this justification entirely, arguing that lying is wrong not because the consequences of universal lying are unpleasant, but because the act of lying relies on the existence of truth-telling to succeed, creating a contradiction in conception when universalized. The claim that the world would be worse for everyone is a consequentialist observation that Kant might agree with empirically, but it is not the ground of the moral prohibition. Consequently, the assertion that stripping away the talk of duty reveals rule-utilitarianism in disguise is a category mistake. While the two theories might sometimes converge on similar prohibitions, they diverge fundamentally on why those prohibitions hold; Kant grounds morality in the autonomy of rational agents and the consistency of their will, whereas utilitarianism grounds it in the maximization of good outcomes. Because the chapter has already reinterpreted the universalisability test as a test of desirable outcomes, its conclusion that Kant is merely a rule-utilitarian does not survive once the accurate distinction between contradiction in the will and undesirable states of affairs is restored.

  The chapter then moves to specific objections regarding the formulation of maxims, citing examples like training to be a doctor or lying to a murderer at the door as cases where the test gives the wrong answer or no answer at all. The difficulty with oddly general or oddly specific maxims is a genuine technical challenge in Kantian scholarship known as the input problem, but it is not the fatal flaw the chapter presents it as. Kantians argue that maxims must be formulated according to the agent's actual intention and relevant context, not arbitrarily tweaked to game the system, and while this requires judgment, it does not render the test useless. The example of the murderer at the door is indeed a famous hard case where Kant's rigid adherence to truth-telling clashes with common moral intuition, but this is usually viewed as a tension within deontology regarding conflicting duties rather than a failure of the universalisability test itself. Furthermore, the sociological claim that hardly anyone defends the view now is simply incorrect, as Kantian ethics remains one of the dominant frameworks in contemporary normative theory, often refined to handle these specific objections without abandoning the core commitment to duty over outcomes.

  Regarding the blog author's argument about partial compliance, this variant captures a practical insight about institutional stability that Kant's strict universalisability test does not directly address, but it does so by quietly substituting a different theory altogether. Kant's test is an a priori inquiry into whether a rational will can coherently legislate a principle for all rational beings, regardless of whether anyone actually follows it. The question of what happens if only five per cent of people act on a maxim is an empirical question about the resilience of social practices, which aligns more closely with rule-utilitarianism or contractualism than with Kantian deontology. While this partial compliance view might handle free-riding better in a sociological sense by identifying the threshold at which a practice collapses, it abandons the Kantian focus on the intrinsic rationality of the agent's will. Therefore, while the blog author's modification might offer a useful tool for analyzing social norms, it does not correct a mistake in Kant's version but rather changes the subject from rational consistency to empirical sustainability, confirming that the original chapter's attempt to merge Kant with utilitarianism relies on blurring precisely these distinctions.
