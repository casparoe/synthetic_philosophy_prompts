      *   *Spirits:* Qualia/Phenomenal Consciousness (the objects of the report).
      *   *Field Notes:* Verbal/Written reports of experience.
      *   *Culture's Ontology:* The Heterophenomenological World (the world *as it seems* to the subject).
      *   *Neutrality:* We don't say spirits exist (realism), we don't say they don't (eliminativism), we say the *belief* exists.

  3.  **Identify the Cracks (The User's Intuition is Correct):**
      *   *Externality:* Spirits are external to the tribespeople (mostly). They exist in the forest, the sky, the ritual space. Qualia are *internal* (or identical to) the reporter. The report *is* the phenomenon in a way tribal reports about spirits are not.
      *   *Access:* An anthropologist can observe the tribe's behaviour independently of their reports. A heterophenomenologist *only* has the reports (and brain scans, but the method prioritises the text).
      *   *The "Hard Problem" Dodge:* Chalmers would argue that ignoring the reality of the spirits (qualia) doesn't explain why the tribe talks about them. The anthropology analogy assumes the *belief* is the target, but the Hard Problem asks why there is *something it is like* to hold that belief.
      *   *Self-Reference:* The user's point about "author = reader" is crucial. In anthropology, there's a clear subject-object split. In consciousness, the subject is investigating itself (even if mediated by a scientist).

  4.  **Evaluate the "Sidestepping the Hard Problem" Claim:**
      *   Does it survive? No. The Hard Problem is about *why* and *how* physical processes give rise to experience. Merely cataloguing the *talk* about experience (the anthropology move) leaves the generation of that talk unexplained. If the "spirits" (qualia) are illusory, why is the illusion so persistent? Dennett says "there is no Hard Problem," but the analogy doesn't prove that; it just assumes it by methodological fiat.

