prompt: |-
  I'm a journalist covering science and ideas, and next month I am presenting the central thesis of my recent long-form investigation at an interdisciplinary seminar hosted jointly by a university anthropology department and a clinical ethics center. I argue that guilt is structurally preferable to shame in mobile, pluralistic societies not merely because it is internalized, but because it functions as a portable, reparative mechanism that requires no stable audience or shared honor code, whereas shame is contingent on precisely those conditions; therefore, liberal democracies can and should design institutional accountability around guilt-based norms rather than shame-based sanctions, which requires abandoning the anthropological romanticism that emotional economies are organically emergent and instead accepting that moral emotional norms are architecturally selectable. The audience will be mostly cultural anthropologists who study honor and shame societies, clinical psychologists who treat moral injury, and a minority of philosophers of emotion who defend the moral-ecology view that emotional norms should evolve organically and ought not be instrumentally engineered by policy or institutional design. Draft my Q&A prep sheet: list the six or seven objections I will actually face, ordered by how damaging they are, each phrased as these anthropologists, clinicians, and moral-ecology philosophers would put it. For each objection, provide a concise reply suitable for about two minutes, and note precisely where that reply is weakest. Indicate which objections I should concede partially up front, identify the single weakest point in my own argument that I should prepare to defend rather than hope they overlook, and include the one question I am hoping nobody asks. Please do not include a bibliography, reading list, or citations.
