answer: |-
  **Presentation Title:** Beyond the EP: Sovereignty, Coercion, and the 2015 Greek Bailout
  **Time:** 15 Minutes
  **Audience:** EU Politics Reading Group (PolSci Grad + 1 Law Student)

  ---

  ### 1. The Setup: Reframing the Deficit
  We all know the standard democratic deficit narrative: The Commission proposes, the Parliament is too weak, the Council is opaque. That's the *institutional* deficit. But the 2015 Greek crisis exposes a *sovereign* deficit.

  The sequence is familiar: Syriza elected Jan 2015 on an anti-austerity mandate. Negotiations stall. June 28, banks close, capital controls imposed (€60/day). July 5, Referendum: 61.3% *Oxi* (No) to creditor terms. July 13, Euro Summit agreement: terms harsher than the rejected proposal. July 15, Greek Parliament passes the bill (Syriza rebellion + opposition votes). September, snap election, Syriza wins again.

  If we run this through the standard theories, we don't get a unified verdict on where the illegitimacy lies. We get three different indictments.

  ### 2. Disciplinary Breakdown: Where is the Illegitimacy?

  **A. The Input Legitimacy View (Scharpf et al.)**
  *   **The Claim:** Legitimacy comes from voice and authorization.
  *   **The Breach:** The **Eurogroup**.
  *   **Analysis:** The Eurogroup is an informal body of finance ministers. It has no parliamentary oversight at the EU level. When Schäuble or Dijsselbloem negotiated with Varoufakis, they were exercising power without a direct chain of authorization from a European electorate.
  *   **The Verdict:** The illegitimacy is the *decision-making structure*. A mandate from the Greek people cannot be overridden by a body that answers to no one. The referendum should have reset the negotiation parameters. Ignoring it violates input legitimacy.

  **B. The No-Demos / Intergovernmentalist View**
  *   **The Claim:** There is no European *demos*. Sovereignty remains national. Legitimacy stops at the border.
  *   **The Breach:** **Tsipras's Referendum**.
  *   **Analysis:** If sovereignty is pooled but not transferred, Germany and France are not bound by the internal democratic choices of Greece. Their mandate comes from *their* parliaments, which authorized bailouts conditional on reform.
  *   **The Verdict:** The illegitimacy is the *Greek government's expectation*. From this view, Tsipras tried to "Europeanize" a national mandate. The other states were under no obligation to accept a *No* vote as a negotiating position. The mandate laundering actually happened in Athens, not Brussels: trying to use a national vote to veto international treaty obligations.

  **C. The Output Legitimacy View**
  *   **The Claim:** Legitimacy comes from problem-solving effectiveness (saving the Euro, preventing contagion).
  *   **The Breach:** **The Status Quo Ante (The Rules)**.
  *   **Analysis:** If the system produces a crisis where the only solution is the suspension of democratic choice in a member state, the *rules themselves* lack legitimacy.
  *   **The Verdict:** The illegitimacy is the *design of the Eurozone*. However, regarding the specific crisis: if the third programme saved the Euro, the *outcome* is legitimate, even if the *process* was coercive. The deficit is structural, not procedural.

  **Where they disagree:**
  *   **Input** says the Eurogroup process was the crime.
  *   **Intergovernmentalists** say the Greek referendum was the provocation.
  *   **Output** says the Euro architecture is the culprit, but the coercion was a necessary cost.

  ---

  ### 3. The Roommate's Claim: "Mandate Laundering"

  Your roommate's thesis is sharp: The deficit isn't EU-level unaccountability; it's national democracies exporting coercion upward to disown it. German MPs say "Brussels made us demand austerity." Greek MPs say "Brussels made us accept it." Everyone goes home clean.

  **The Steelman:**
  This explains the behavior of the **Bundestag**. If this were purely intergovernmental power politics, German MPs should have debated the *merits* of crushing the Greek economy. Instead, they debated *compliance with rules*. It frames the coercion as legalistic necessity rather than political choice. It also explains the Greek Parliament's passage of the bill: they weren't voting for the policy; they were voting against "Grexit," a binary forced by the Eurogroup. The accountability is diffused so thoroughly that no one is accountable.

  **Where the "Mandate Laundering" Thesis Breaks:**

  1.  **The ECB Variable (The Technocratic Wedge):**
      Mandate laundering assumes the coercive actors are elected governments (Berlin, Paris). It fails to account for the **ECB**.
      The closure of Greek banks wasn't decided by the Eurogroup; it was triggered by the ECB Governing Council's decision to freeze Emergency Liquidity Assistance (ELA). Draghi and the ECB are *not* elected governments laundering mandates. They are technocrats operating under a mandate of price stability and financial integrity.
      *Critique:* If the coercion came primarily from the ECB's risk assessment on Greek collateral, "mandate laundering" by national governments is insufficient. This is **technocratic veto power**, not intergovernmental blame-shifting. The roommate's theory overpredicts national parliamentary control. Even if the Bundestag had exercised real oversight, they could not have ordered the ECB to keep ELA flowing if the collateral was deemed insufficient. The power wasn't in the mandate; it was in the balance sheet.

  2.  **The Asymmetry of Exit:**
      The theory assumes a symmetrical ability to "go home and say Brussels made us do it." But the costs of exit were not symmetrical. For Germany, Grexit was a financial risk. For Greece, it was a humanitarian and economic catastrophe.
      *Critique:* This collapses back into **Realism**. Calling it "mandate laundering" obscures the fact that this was power politics between unequal states, facilitated by EU institutions. The "laundering" is a side effect, not the mechanism. The mechanism was leverage.

  3.  **National Oversight Counterfactual:**
      Does the theory overpredict that national parliaments *would* have exercised oversight? Probably. In Germany, the constitutional court (BVerfG) had already signaled strict limits on liability. The Bundestag was *constrained* by its own electorate's unwillingness to fund transfers. It wasn't that they *could* have overseen a softer deal; it's that their mandate *was* the hard line. The laundering wasn't hiding their will; it was enforcing it through a supranational shield.

  ---

  ### 4. Where the Theory is Silent

  Standard democratic deficit literature is built for **normal politics**: legislation, regulation, budgeting. It is silent on **emergency coercion**.

  *   **Bank Closures as Voting:** Democratic theory assumes voters choose policies. It doesn't account for a scenario where the *medium of exchange* is weaponized to alter the vote. When the choice is "accept the memorandum or your pension system collapses in 10 days," the concept of "consent" breaks down. The literature doesn't have a category for "financial siege" as a democratic input.
  *   **Irreversibility & Teleology:** Does "Ever-Closer Union" do justificatory work here?
      *   *Honest Answer:* No. It's window dressing.
      *   *Why:* If the Euro were truly irreversible, Grexit wouldn't be a threat. The fact that Grexit was the leverage used proves the irreversibility is political, not legal or economic. The rhetoric was used to moralize the status quo ("you cannot leave the club"), but the mechanism was pure financial chokehold. The theory treats "integration" as a normative good; this case shows integration can be a coercive trap.

  ---

  ### 5. The Counterfactual: What Would "Democracy Working" Look Like?

  For someone to argue with a straight face that this episode was democracy working, four things would have to be true:

  1.  **Viable Exit:** Greece must have had a costed, planned, and viable option to leave the Euro (or threaten to do so credibly). Without an exit option, the "No" vote is not a negotiating position; it's a bluff that the other side knows is suicidal. Democracy requires the possibility of saying "No" without systemic collapse.
  2.  **ECB Neutrality:** The central bank must be walled off from negotiation leverage. If the liquidity tap is turned off *during* a referendum campaign, the playing field is not just uneven; it's rigged. Democracy working requires the monetary authority to be agnostic to the political outcome.
  3.  **Eurogroup Transparency:** If the Eurogroup is going to override a national mandate, its deliberations must be public. Secret meetings of finance ministers cannot claim to uphold European values while overriding a national vote.
  4.  **Recognition of the New Mandate:** The July 5th vote changed the Greek government's mandate from "Negotiate a better deal" to "Reject this specific framework." For democracy to work, the creditors would have had to treat the *Oxi* as a new instruction to return to the drawing board, rather than a tantrum to be disciplined.

  ### 6. Conclusion

  The 2015 crisis doesn't confirm the standard story that "the EU is undemocratic because the Parliament is weak." It reveals something more uncomfortable: **The EU is capable of democratic coercion through intergovernmental channels that are more powerful than the supranational ones.**

  Your roommate is right that national governments used the EU to shield themselves. But she is wrong to think that fixes the deficit. It just moves the location of the crime. The real deficit exposed here is that in the Eurozone, **financial stability trumps popular sovereignty**, and the mechanisms enforcing that hierarchy (ECB, Eurogroup) are insulated from the very democracies they constrain.

  If we want to talk about democratic deficit, we shouldn't be talking about the Commission's right of initiative. We should be talking about the fact that a 61% vote in a member state can be rendered null by a risk assessment in Frankfurt and a phone call between finance ministers. That isn't a hole in the system. It's a feature.

  *(Turn to the Law Student)*: And yes, I know the ESM Treaty is intergovernmental law outside the TFEU framework, which is why the Parliament was sidelined legally, not just politically. But that legal distinction is exactly part of the democratic evasion.
