  3.  **Synthesize a Coherent Principle:**

      *   **Keynes's *Treatise on Probability*:** This is the perfect framework.
          *   *Risk:* Measurable uncertainty (known distribution).
          *   *Uncertainty (Knightian/Keynesian):* Unmeasurable (unknown distribution).
          *   *Weight of Evidence ($w$):* Distinct from probability ($p$). You can have high $p$ with low $w$ (fragile belief) or moderate $p$ with high $w$ (robust belief).
      *   **The Principle:** *Numerical precision is justified only when the Weight of Evidence is high enough to support the granularity of the number.*
      *   **The "False Precision" Trap:** Assigning a specific number (e.g., 30%) implies a level of stability in the underlying reference class that doesn't exist.
