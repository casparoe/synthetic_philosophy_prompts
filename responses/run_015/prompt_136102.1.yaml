answer: |-
  Your intuitions are not only coherent; they map almost perfectly onto one of the most sophisticated frameworks in epistemology and decision theory. You are instinctively distinguishing between **probability** (the numerical likelihood) and **weight of evidence** (the robustness of the information underlying that number).

  You do not need to drop a verdict. Instead, you need to formalize the distinction you are already making. The framework you are looking for is indeed John Maynard Keynes's *A Treatise on Probability* (1921), specifically his distinction between **risk**, **uncertainty**, and the **weight of argument**.

  Here is how your cases resolve under that principle, followed by the verdict on the prediction market.

  ### 1. The Core Principle: Probability vs. Weight
  Keynes argued that a belief has two dimensions:
  1.  **Probability ($p$):** The ratio of favorable evidence to total evidence.
  2.  **Weight ($w$):** The *amount* of relevant evidence available.

  You can have a high probability with low weight (a fragile belief), or a moderate probability with high weight (a robust belief). Your discomfort arises when a number is presented as if it has high weight when it actually has low weight. This is **false precision**.

  ### 2. Analyzing Your Cases

  **The Insurer (Flood Risk)**
  *   **Verdict:** Accept the number.
  *   **Why:** This is **Risk** (in the Knight/Keynes sense). The reference class is stable (rainfall physics haven't changed), the frequency is high (100 years of data), and the system is closed enough that the past predicts the future.
  *   **Weight:** High. The sample size is large and independent.
  *   **Principle:** When the reference class is stable and large, numerical probability is a valid tool for decision-making.

  **The Doctor (Rare Disorder)**
  *   **Verdict:** Reject the number (or treat it as a heuristic).
  *   **Why:** This is **Uncertainty**. The reference class is tiny (ultra-rare), and the data point is weak (one symptom). The "30%" is likely a Bayesian prior dragged from a different population, not a frequentist truth about *you*.
  *   **Weight:** Very Low.
  *   **Principle:** When the reference class is unstable or the data is sparse, specific numbers mask the fragility of the inference. "We don't know" is epistemically more honest than "30%."

  **The Climate Model (95% Confidence)**
  *   **Verdict:** Your ambivalence is the correct rational stance.
  *   **Why:** This is a hybrid.
      *   *Physics:* High weight. We understand thermodynamics and CO2 properties (like the flood sensors).
      *   *Feedback Loops/Socio-economics:* Low weight. We cannot backtest 2050.
  *   **Resolution:** The 95% usually refers to *attribution* (humans caused warming) rather than specific *outcomes* (sea level rise in Miami). If the claim is about physical attribution, treat it like the **Flood**. If the claim is about specific socio-economic impacts by 2050, treat it like the **Doctor**.
  *   **Principle:** Disaggregate the model. Trust the physics (high weight); discount the specific timeline predictions (lower weight).

  **The Meta-Analysis (Dodgy Dataset)**
  *   **Verdict:** Trust your gut (tighter interval = less sure).
  *   **Why:** This is a failure of **Independence**. In statistics, weight comes from *independent* observations. If ten studies use the same underlying dataset, $N=10$ is an illusion; the effective $N$ is close to 1.
  *   **Principle:** Weight scales with independence, not volume. Correlated evidence does not increase weight; it only reinforces shared bias.

  **The Economists (Qualitative Consensus)**
  *   **Verdict:** Trust the consensus.
  *   **Why:** This is high **Weight** via triangulation. Three independent experts using different methodologies reaching the same qualitative conclusion provides a robust structural confirmation, even without numbers.
  *   **Principle:** Qualitative convergence among independent agents often carries more weight than precise quantification from a single fragile model.

  ### 3. The Verdict: The Prediction Market
  **Case:** A prediction market prices a geopolitical event at 80%. Liquidity comes from anonymous wallets running opaque algorithms.

  **Verdict:** **Treat the 80% as a price, not a probability. Discount the weight heavily.**

  **Reasoning:**
  1.  **Reference Class Failure:** Geopolitical events are unique (like the rare disorder). There is no "100 years of rainfall" for a specific coup or treaty. This is Knightian Uncertainty, not Risk.
  2.  **The Mechanism:** Prediction markets work on the "Wisdom of Crowds" hypothesis, which requires *independent* information aggregation.
  3.  **The Algo Problem:** If liquidity is driven by opaque algorithms, they are likely not trading on *information* but on *flow, hedging, or momentum*. If Algo A copies Algo B, you have the Meta-Analysis problem (correlated evidence). If they are hedging exposure elsewhere, the price reflects risk management, not belief.
  4.  **Weight:** Low. You cannot verify the source of the "belief" behind the money.

  **Decision Rule:** You can use the 80% as a baseline prior (it's better than 50%), but you must apply a massive **uncertainty discount**. Do not bet your house on it. In Keynesian terms, the *probability* might be 0.8, but the *weight* is so near zero that the rational action is to behave as if the probability is indeterminate.

  ### 4. A Coherent Heuristic for You

  To systematize your gut reactions, adopt this two-step check before accepting a quantified belief:

  1.  **The Reference Class Test:** Is this event one of a recurring series with stable rules (Floods, Dice, Cards)?
      *   *Yes:* Accept the number.
      *   *No:* Proceed to step 2.
  2.  **The Independence Test:** Is the number derived from multiple, independent lines of evidence (Economists, Physics + History)?
      *   *Yes:* Accept the *direction* and *magnitude*, but treat the specific decimal as fuzzy (e.g., "High confidence" rather than "95%").
      *   *No (Single model, shared data, opaque algos):* Reject the quantification. Use qualitative ranges ("Likely," "Possible," "Unknown").

  **Summary:** Your intuition is protecting you from **epistemic arrogance**. You are correctly identifying that a number without weight is not knowledge; it is just decoration. Stick with Keynes: when weight is low, numerical probability is meaningless for decision-making, regardless of how precise it looks.
