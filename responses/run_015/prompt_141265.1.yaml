prompt: |-
  Hi — I work at a smallish foundation (about £14m a year, four programme staff) and last year our trustees got excited about the idea of moral trade: the thing where two groups who disagree about what's actually good each do what the other wants, and both come out ahead by their own lights, more or less the way two countries trade when each is better at something. They've now made it a formal funding line — we put up money when two organisations with genuinely conflicting moral views each commit to doing something the other values that they wouldn't have done on their own — and I'm the one who has to turn that into something we can actually run.

  The problem is we now get three or four of these a month, I have roughly two days per proposal, and sign-off is a single meeting with a committee of four: me, a trustee who used to run a logistics company, and two programme officers with no philosophy background at all. Our trustees also require that any yes be explainable in one sentence to a journalist who is going to write it up as "foundation pays charity to do thing it thinks is worthless." And about half our money comes from a restricted gift whose donor died in 2019 and left a letter of wishes, which matters for one of the cases below.

  So I need a procedure, not an essay: ordered questions I can walk the committee through, what counts as a good enough answer to each one, the points where the answer is a hard no and we stop, and the points where the honest move is to stop and say this is a values call, and here is who makes it. Please be blunt about which steps are really judgment wearing a lab coat.

  Things it has to handle, because they've already bitten us:

  - The would-have-happened-anyway problem. Half the proposals are just two groups discovering they wanted the same thing, or one group announcing it will now do the thing we were about to fund anyway. I've started calling these coincidence deals and I need a test that kills them in the first ten minutes — including when we can't establish the counterfactual, because everyone lies about what they would have done.
  - The overbidding problem. Since I can only be paid in the other side's values, the other side has every reason to tell me they care about my thing far more than they do, so that I give them more. We have no way to audit what anyone actually values. What's the least-bad way to handle that — staging, matching, symmetric disclosure, third-party holds, something else — and when does the right answer become "we can't price this, so we cap the deal"?
  - Hostage deals. Twice now a group has come to us offering not to do something harmful it was going to do anyway — a campaign, a legal challenge, a regulatory complaint — if we fund its programme. Sometimes that reads to me as extortion with better manners, and sometimes the threatened harm is real, the people making the threat are sincere, and the deal would genuinely leave everyone better off by their own lights. I need the procedure to tell those apart, or to tell me plainly that it can't.
  - Dirty hands on their side. A couple of proposals require one party to do something that's fine by our lights but that they say they think is wrong, and they've agreed only because we're paying. My instinct is that this isn't a partner, it's a corrupted partner, and it will fall apart. I'd like that turned into a check rather than a vibe.
  - Who is actually trading. One case below involves an endowment whose mission was written by someone who's dead. Do we count the mission as a party to the trade? I keep going back and forth on whether a commitment that outlives the person who made it can be traded away by whoever is holding the pen now, and what it would even take for that to be legitimate rather than just convenient.

  Then please run it on three:

  1. A global-health charity (think animal suffering counts for little, wants to buy bed nets) and an animal-welfare charity (thinks bed nets are a rounding error next to farmed fish). Proposal: we fund each of them to run one year of the other's programme, matched pound for pound. On its face this is the cleanest thing we've seen.

  2. A well-funded advocacy organisation — call them the Alliance — that exists mostly to oppose a hospital expansion our health grantees want. They offer to withdraw their objection and not file suit if we fund a year of their community health worker programme. They say, and I half beleive them, that they would file and would probably win.

  3. The one I know I'm biased on, so be especially annoying about it: a religious hospital network in a country where we work will take on a full maternal-health service that we think is the best thing on offer in the region, but only if we fund a chaplaincy and end-of-life counselling programme that we think does nothing — some of us think it does less than nothing, that it talks people out of decisions that are theirs to make. As far as I can tell the theology behind the network's side of the deal is straightforwardly false, and I find parts of it grim. My instinct is to find a reason to say no. If the procedure says yes, I want to be told that clearly, along with what I'd have to put in the committee note and what the strongest version of my own objection actually is.

  Finally, tell me what the whole frame can't do: the cases where "go find a trade" is the wrong move and we should just be doing ordinary grantmaking, or politics, or nothing at all.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Programme officer at a small foundation (£14m/year, 4 staff).
      *   **Context:** Trustees mandated "Moral Trade" funding line (two groups with conflicting moral views swap actions to mutual benefit).
      *   **Constraints:** High volume (3-4 proposals/month), low time per proposal (2 days), simple sign-off (4-person committee, mixed expertise), strict communications constraint (1-sentence explanation to a skeptical journalist), restricted funds (dead donor's letter of wishes matters).
      *   **Needs:** A blunt, procedural checklist (ordered questions, pass/fail criteria, hard nos, values calls), not an essay. Must address specific pitfalls (counterfactuals, overbidding, hostage deals, dirty hands, dead donor missions).
      *   **Task:** Run the procedure on three specific cases (Global Health vs. Animal Welfare, Advocacy Hostage, Religious Hospital).
      *   **Task:** Identify limits of the framework (when *not* to trade).
      *   **Tone:** Blunt, operational, pragmatic, acknowledging where "judgment wears a lab coat."

  2.  **Deconstruct the "Moral Trade" Concept:**
      *   Core mechanism: Comparative advantage in moral value. Party A values X > Y. Party B values Y > X. A does Y, B does X. Both gain utility.
      *   Foundation role: Broker/Funder. Pays for the "cost" of the swap or incentivizes the action that wouldn't otherwise happen.
      *   Key Risk: It looks like paying people to do bad things (or stop doing good things) based on a utilitarian calculus that the public/journalists won't understand.

  3.  **Develop the Procedure (The "Moral Trade Protocol"):**
      *   *Goal:* Filter out bad deals quickly, isolate genuine trades, flag ethical hazards.
      *   *Structure:* 5 Gates.
      *   *Gate 1: The Counterfactual (The "Would-Have-Happened-Anyway" Test).* Needs to be hard. If no additionality, no trade.
      *   *Gate 2: The Valuation (The "Overbidding" Test).* How to prevent inflation of moral value? Symmetric commitment.
      *   *Gate 3: The Coercion (The "Hostage" Test).* Distinguish extortion from genuine threat mitigation.
      *   *Gate 4: The Integrity (The "Dirty Hands" Test).* Is the partner compromising their core mission dangerously?
      *   *Gate 5: The Authority (The "Dead Donor" Test).* Who has the right to trade?
      *   *Output:* Pass/Fail/Values Call.

  4.  **Drafting the Gates (Iterative refinement for bluntness):**
      *   *Gate 1:* Don't ask "Would you have done this?" Ask "What specific resource constraint stops you?" Require evidence. *Hard No:* If the action is within their existing budget/strategy.
      *   *Gate 2:* Pricing. If they value our thing so much, why haven't they done it? *Mechanism:* Staged funding. If they drop their side first, we stop. *Hard No:* If one side refuses to move first or verify.
      *   *Gate 3:* Hostage. Is the threat credible and independent? *Hard No:* If the threat is created *for* the deal.
      *   *Gate 4:* Integrity. Are they violating their own stated ethics? *Values Call:* If they say it's wrong but do it for money.
      *   *Gate 5:* Authority. Can the current signatory trade the dead donor's intent? *Values Call:* Trustee decision.

  5.  **Addressing the Specific Pitfalls:**
      *   *Counterfactual:* Require a "Pre-Trade Budget" snapshot.
      *   *Overbidding:* Use "Skin in the Game." They must spend *some* of their own money/time first.
      *   *Hostage:* Distinguish "Stopping a harm" vs. "Selling peace."
      *   *Dirty Hands:* Check internal governance approval. Did their board vote to violate their own principles?
      *   *Dead Donor:* This is a legal/fiduciary question, not moral.

  6.  **Running the Three Cases:**

      *   *Case 1 (Bed Nets vs. Fish):*
          *   Counterfactual: Can they prove they wouldn't fund the other's cause? (Likely yes, distinct missions).
          *   Valuation: Matched funding helps.
          *   Integrity: Neither thinks the other's work is *evil*, just less important.
          *   Verdict: **PASS.** This is the ideal use case.
          *   Journalist Sentence: "We funded two experts to swap tasks where each could save more lives per pound than the other could."

      *   *Case 2 (Alliance vs. Hospital):*
          *   Counterfactual: Credible threat of lawsuit? Need legal opinion.
          *   Hostage: This smells like extortion. "Pay us or we sue."
          *   Integrity: Are they abandoning their mission (opposing expansion) for cash?
          *   Verdict: **HARD NO (Hostage/Extortion).** Paying to stop a legal right is dangerous precedent.
          *   Journalist Sentence: "We do not pay organisations to withdraw legal challenges against public health infrastructure."

      *   *Case 3 (Religious Hospital vs. Chaplaincy):*
          *   Counterfactual: Hospital won't do maternal health without chaplaincy.
          *   Integrity: Foundation thinks chaplaincy is harmful/neutrally useless.
          *   Dead Donor: Restricted funds? If the donor wanted "health," does chaplaincy count?
          *   Bias Check: User hates the theology.
          *   Verdict: **VALUES CALL.** The trade works mechanically, but violates Foundation values on "harm."
          *   Journalist Sentence: "We funded maternal care knowing it required a religious component we disagree with, because the net health gain was substantial." (Risky).
          *   *Correction:* If the Foundation thinks it does *harm* (talks people out of decisions), this might be a Hard No on "Do No Harm" grounds, regardless of trade. Let's make it a Values Call on "Complicity."

  7.  **Identifying the Limits (When not to trade):**
      *   When the conflict is fundamental rights (not utilitarian).
      *   When the "trade" is just buying silence.
      *   When the admin cost exceeds the moral gain.
      *   When it violates the "One Sentence Rule" (PR disaster).

  8.  **Refining the Tone:**
      *   Needs to be sharp. "Judgment wearing a lab coat."
      *   Acknowledge the restricted fund issue explicitly.
      *   Ensure the "One Sentence" test is applied to every case.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is Gate 2 (Overbidding) practical in 2 days?
      *   *Fix:* Make it about *commitment sequencing*, not auditing feelings. They must start their side before we release the second tranche.
      *   *Critique:* Case 3 is tricky. If the Foundation thinks chaplaincy is *harmful*, funding it is problematic even if maternal health is good.
      *   *Fix:* Frame this as a "Complicity Threshold." If the harm of Side B outweighs the good of Side A, it's a No. This is a values call, not a trade mechanic.
      *   *Critique:* The dead donor issue in Case 3 needs specific attention.
      *   *Fix:* Add a specific check in Gate 5 for restricted funds.

  10. **Final Polish:** Check against all constraints (2 days, 4-person committee, blunt tone). Ensure the "One Sentence" test is prominent. (Self-correction: Make sure the procedure explicitly tells them *when* to stop the meeting).

  11. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the **Moral Trade Protocol (MTP)**. It is designed for a 90-minute committee meeting. It assumes you have read the proposal beforehand. It is not a philosophical framework; it is a filter.

  There are five gates. If a proposal fails a "Hard No," the meeting ends. If it hits a "Values Call," the Trustee Chair casts the deciding vote and minuted as such.

  ### The One-Sentence Rule (Pre-Check)
  Before opening the file, draft the sentence: *"We paid [Party A] to do [X] and [Party B] to do [Y], even though [A] thinks [Y] is useless and [B] thinks [X] is useless, because the total good increased."*
  *   **Test:** If you cannot draft this without using weasel words ("engagement," "dialogue," "support"), it is a **Hard No**. If the sentence sounds like a scandal, it is a **Hard No**.

  ---

  ### Gate 1: The Counterfactual (Additionality)
  *Goal: Kill "Coincidence Deals."*

  **Question:** "What specific resource constraint prevents Party A from doing Action Y *today* without our money?"
  *   **Good Answer:** "Party A has £0 budgeted for Y. Their board rejected Y last quarter. They lack the specific expertise/staff for Y." (Requires attached board minutes or budget sheets).
  *   **Hard No:** "They hadn't prioritized it yet," or "They were planning to do a bit of this anyway."
  *   **The Blunt Truth:** If they could do it but chose not to, and you pay them to do it, you are subsidizing their preference, not trading moral value.
  *   **Verification:** Demand a "Pre-Trade Budget" snapshot. If Line Item Y exists in their current fiscal year, **Stop.**

  ### Gate 2: The Valuation (Overbidding)
  *Goal: Prevent inflation of moral value.*

  **Question:** "How do we know Party A isn't lying about how much they value Action X just to get our cash?"
  *   **Good Answer:** "Symmetric Skin-in-the-Game." Both parties must commit 10-20% of the deal's cost in *unrestricted* funds or staff time *before* the foundation releases the second tranche.
  *   **Mechanism:** Staged funding. Tranche 1 releases when both sign. Tranche 2 releases only when Party A proves they have started Action X using their own resources.
  *   **Hard No:** If either party refuses to put their own money/time at risk first.
  *   **The Blunt Truth:** If they won't bleed for the trade, they don't value it. If you can't price it, **Cap the Deal.** Set a maximum liability (£X) and walk away if they demand more.

  ### Gate 3: The Hostage (Coercion)
  *Goal: Distinguish trade from extortion.*

  **Question:** "Is the harm Party A threatens to cause (or stop causing) independent of this deal?"
  *   **Good Answer:** "Party A was already planning the lawsuit/campaign. The budget and strategy pre-date this proposal."
  *   **Hard No:** "Party A created the threat specifically to leverage this funding." (e.g., "We *will* sue if you don't pay us to stop.").
  *   **The Blunt Truth:** Paying someone not to exercise a legal right (like suing) is bribery in all but name. Paying someone to pursue a positive good they were already going to do is trade.
  *   **Test:** Ask for the draft press release or legal filing date from *before* negotiations started. If it doesn't exist, **Stop.**

  ### Gate 4: The Integrity (Dirty Hands)
  *Goal: Check for mission corruption.*

  **Question:** "Does Action Y violate Party A's core governing documents or ethical code?"
  *   **Good Answer:** "Action Y is neutral to them, just lower priority." OR "Their board has voted to temporarily suspend this clause for the greater good."
  *   **Hard No:** "Action Y is explicitly forbidden by their charter/faith/ethics, but they are doing it for cash."
  *   **The Blunt Truth:** A partner who violates their own ethics for your money will violate your contract for someone else's money. This is a stability risk.
  *   **Values Call:** If Action Y is merely "unpleasant" but not forbidden, this is a judgment call on reputational risk.

  ### Gate 5: The Authority (Dead Donors & Restricted Funds)
  *Goal: Check legal standing.*

  **Question:** "Does the person signing have the legal right to trade away the mission?"
  *   **Good Answer:** "Yes, current trustees have fiduciary discretion to allocate funds within the charitable class."
  *   **Hard No:** "The restricted fund letter of wishes explicitly forbids this activity." (Legal opinion required).
  *   **Values Call:** "The letter of wishes is vague (e.g., 'for health'), but the donor's known personal views would have hated this."
      *   *Procedure:* If restricted funds are involved, the Trustee Chair must sign a declaration that this aligns with the *legal* charitable purpose, even if it stretches the *spirit*. If they won't sign, **Stop.**

  ---

  ### Running the Cases

  #### Case 1: Bed Nets (Global Health) vs. Farmed Fish (Animal Welfare)
  *   **Gate 1 (Counterfactual):** **PASS.** Distinct budgets. Animal welfare orgs rarely fund bed nets; global health orgs rarely fund fish welfare. Evidence: Past grant portfolios show zero overlap.
  *   **Gate 2 (Valuation):** **PASS.** Matched funding works here. Both put up 10% of the cost.
  *   **Gate 3 (Hostage):** **N/A.** No threat involved.
  *   **Gate 4 (Integrity):** **PASS.** Neither thinks the other's work is *evil*, just less efficient. No ethical violation.
  *   **Gate 5 (Authority):** **PASS.** Standard unrestricted funds.
  *   **Verdict:** **YES.** This is the textbook case.
  *   **Journalist Sentence:** "We funded two experts to swap tasks where each could save more lives per pound than the other could."
  *   **Committee Note:** "Low risk. High additionality. Clear comparative advantage."

  #### Case 2: The Alliance (Advocacy) vs. Hospital Expansion
  *   **Gate 1 (Counterfactual):** **PASS.** They say they would sue.
  *   **Gate 2 (Valuation):** **FAIL.** They are asking for funding for *their* programme in exchange for *not* using their resources to sue. This is not adding value; it is removing threat.
  *   **Gate 3 (Hostage):** **HARD NO.** This is a hostage deal. "Fund us or we sue." Even if the threat is credible, paying to remove a legal obstacle to public health infrastructure sets a precedent that invites future extortion.
  *   **Gate 4 (Integrity):** **FAIL.** Their mission is to oppose the expansion. Taking money to stop opposing it corrupts their raison d'être.
  *   **Verdict:** **HARD NO.**
  *   **Journalist Sentence:** "We do not pay organisations to withdraw legal challenges against public health infrastructure."
  *   **Committee Note:** "Precedent risk too high. Smells of extortion. Violates public interest."

  #### Case 3: Religious Hospital (Maternal Health) vs. Chaplaincy
  *   **Gate 1 (Counterfactual):** **PASS.** Hospital says they cannot run maternal health without the chaplaincy component (theological constraint).
  *   **Gate 2 (Valuation):** **PASS.** You get maternal health; they get chaplaincy.
  *   **Gate 3 (Hostage):** **PASS.** The "threat" (not providing health) is a resource constraint, not a weaponized campaign.
  *   **Gate 4 (Integrity):** **VALUES CALL.** You believe chaplaincy does harm (talks people out of decisions). They believe it is essential.
      *   *The Trap:* If you fund the chaplaincy, you are complicit in the harm. If you don't, the maternal health service doesn't happen.
      *   *The Test:* Does the harm of the chaplaincy outweigh the good of the maternal health? This is not a trade calculation; it is a moral threshold.
  *   **Gate 5 (Authority):** **VALUES CALL (Restricted Funds).** The dead donor wanted "health."
      *   *Legal:* Chaplaincy might fall under "holistic health."
      *   *Spirit:* Donor likely wanted secular medical outcomes.
      *   *Requirement:* Trustee Chair must sign the fiduciary declaration.
  *   **Verdict:** **VALUES CALL.** The mechanics work, but the moral cost is on you.
  *   **Journalist Sentence:** "We funded maternal care knowing it required a religious component we disagree with, because the net health gain was substantial." (Warning: This will still get you attacked).
  *   **Committee Note:** "Trade is mechanically sound. Moral risk is high. Foundation accepts complicity in chaplaincy to secure maternal health outcomes. Restricted fund alignment approved by Chair."
  *   **Your Bias Check:** You want to say no because the theology is "false." The procedure forces you to admit: Is it false, or is it *harmful*? If it's just false but harmless, your bias is the blocker. If it's harmful (coercion), Gate 4 should kill it. If Gate 4 doesn't kill it, you must vote based on net utility, not theological truth.

  ---

  ### What This Frame Cannot Do (The Limits)

  Do not use Moral Trade for:

  1.  **Rights Violations:** If one side's "good" involves violating human rights (e.g., "We will stop discriminating against Group X if you fund us"), this is not a trade. It is compliance. **Hard No.**
  2.  **Buying Silence:** If the trade results in less public debate (e.g., Case 2), it is anti-democratic. **Hard No.**
  3.  **High Transaction Costs:** If explaining the deal takes more time than the grant value, or if the "One Sentence" test requires a paragraph of caveats. **Hard No.**
  4.  **The "Dead Hand" Problem:** If the restricted fund donor's letter of wishes is specific (e.g., "for cancer research") and the trade requires funding "spiritual counselling," you cannot legally make the trade. Do not ask lawyers to stretch definitions; ask the donor's estate for variation or return the funds.
  5.  **When You Are The Referee:** If the two parties hate each other so much they require you to monitor every interaction, the admin cost will eat the programme. **Hard No.**

  ### Summary for the Committee
  *   **Gate 1 & 3** are factual checks. (Did the threat exist before? Is the budget real?)
  *   **Gate 2** is a structural check. (Is there skin in the game?)
  *   **Gate 4 & 5** are where judgment wears a lab coat.
      *   If Gate 4 flags "Harm," the Foundation must decide if it is willing to be complicit.
      *   If Gate 5 flags "Dead Donor," the Trustee Chair assumes personal liability for the interpretation.

  If you cannot get a clear "Pass" on Gates 1, 2, and 3, do not proceed to 4 or 5. Save your values capital for deals that actually work mechanically.
