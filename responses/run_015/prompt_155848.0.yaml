  Reply: But you conflate the intrinsic nature with its static chemical identity. On my view, experience isn't a tag attached to carbon; it is the inside of what carbon *does* when organised thus. Anaesthesia alters the dynamical patterns of neural activity, and since consciousness is the intrinsic face of that specific dynamical organisation, the macro-experience ceases. The micro-experiences persist, yes, but they are not subjects of surgical pain. Your ethics committee worried about suffering subjects, not free-floating electron twinges. Shattering the bond ends the suffering subject, which is precisely what matters ethically. This isn't emergentism in a hat because emergentism claims experience arises from non-experiential stuff. I claim experience arises from experiential stuff arranged differently. The ontological gap is closed; we are merely discussing topological changes in the phenomenal field. You say we lack a grip on subjecthood, but I say you lack a grip on the intrinsic nature of the physical stuff you thought was inert. The physics describes the shape; I describe the clay. Anaesthesia changes the shape, so the clay no longer forms a vessel for pain.

  Your move: If physicalism holds, how does rearranging inert matter suddenly generate a subject of suffering where none existed before?
