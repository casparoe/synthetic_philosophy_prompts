prompt: |-
  Write an essay addressing the following controversy. Douglas Hofstadter's satirical essay "A Person Paper on Purity in Language" inverts gendered linguistic defaults—treating feminine terms as the unmarked norm and masculine terms as marked deviations—to expose the arbitrariness of using masculine pronouns as generic human references. The central dispute is whether this rhetorical inversion genuinely dismantles sexist framing, or whether it inadvertently preserves the binary gender ontology it mocks, because the reader must still invoke the original "male-as-default" schema in order to recognize the inversion as absurd. To sharpen this, consider what might be called an "ontological asymmetry" objection: the deeper problem with gendered defaults may not be mere linguistic markedness, but that the unmarked term carries an implicit prototype schema—a "base ontology" of the subject—against which marked variants are understood as modifications. The essay should ask whether Hofstadter's strategy succeeds if it only reverses markedness while leaving this prototype structure intact, and whether a hypothetical language with gender-neutral pronouns but gendered occupational nouns (e.g., "doctor" versus "lady-doctor") would suffer the same failure.

  Reach and justify a clear conclusion about whether Hofstadter's satire ultimately succeeds in its philosophical aims, with explicit attention to the ontological asymmetry objection. Do not present a contested interpretation as the consensus.

  Structure the response in exactly these sections, in this order:

  - Framing the Satire and Its Target (approx. 200 words): Briefly explain Hofstadter's inversion strategy and the linguistic phenomenon it targets.
  - The Case That the Inversion Works (approx. 300 words): Present the strongest argument that flipping defaults exposes the arbitrariness of masculine generics and breaks the cognitive habit of treating male as the human prototype.
  - The Ontological Asymmetry Challenge (approx. 300 words): Present the niche objection that markedness reversal leaves the prototype schema untouched; apply it specifically to Hofstadter's text by asking whether the reader must still deploy a binary gender ontology to "get the joke," and examine the hypothetical pronoun-neutral but occupationally-gendered language case.
  - The Verdict (approx. 250 words): Argue for your conclusion—whether Hofstadter's essay succeeds despite, because of, or regardless of the asymmetry problem—justifying it with direct reference to the prior sections.
  - Settled vs. Contested (approx. 150 words): Explicitly distinguish which premises in your analysis rest on widely accepted linguistic or philosophical ground and which depend on contested interpretations of satire, gender ontology, or prototype theory. Identify where reasonable experts disagree, and avoid presenting your own verdict as the only informed position.

  Separate what is settled from what is genuinely contested among people who know the topic, and do not present a contested view as the consensus. Do not include bibliographies, reading lists, or citations.
