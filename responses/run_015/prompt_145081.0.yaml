prompt: |-
  ok so im a junior, im in honors history, and this year im also one of the student judges for our regional history fair — we have to get through like 40 project boards in an afternoon, so realistically about 6–8 minutes each, and me and the other two judges have to rank them. my teacher keeps telling me that some of the essays give a "covering-law" style explanation and some give a "narrative" one, and that mixing them up is the main reason projects lose points, but he won't say how you actually tell which is which, and everything i found was either old philosophy jargon or just definitions. i already know the definitions. i want something i can run.

  so: write me a decision procedure i can run on a single paragraph of a history essay (mine or someone elses) in under 10 minutes, no looking anything up, that ends in one of a few verdicts. something like: this is genuinely leaning on a general pattern; this is a narrative that lives or dies on its specific sequence; this is a fake law — a grand sounding sentence that can't actually fail; or this is just a timeline with "because" stapled to it. give me the questions in order, what counts as a good enough answer to each, where the procedure stops early with a verdict, and where it has to hand the decision over to a human because it's a judgment call and not a fact question.

  two things i made up that i want built in (tell me if they're bad and fix them): the swap test — replace the specific people, place and date with different ones and see whether the explanation still delivers the outcome, and if it does, it was leaning on a general pattern rather than the actual sequence; and the delete-a-step test — take out one link in the chain and see if the outcome still follows, because if it does then that link wasn't doing any work. also i need something that catches law-shaped sentences that aren't laws ("empires always overextend," "people push back when pushed too far") and tells me how thats different from a real generalization with a scope that could turn out false. and please say clearly what the procedure cannot do — i assume it can't tell me whether the general pattern is actually true, just whether it's load bearing.

  then run it on three things. (1) a project that says the french revolution broke out because a bad harvest pushed bread prices up while the government was already broke. (2) one that says the soviet union collapsed because every overextended empire eventually does. (3) my own project, about why the mill on the edge of town shut down in 1998 — the owners had borrowed against the plant to buy a second one, the big buyer switched to a supplier overseas that spring, and the union contract came up the same month. I think (3) is defintely the strongest of the three, so if the procedure says it's weak, say that straight out, i'd rather find out now than at teh fair. finally: tell me which one test is doing most of the work in your procedure, and what breaks if i drop it. my teacher has to approve whatever rubric we use, so keep it readable by someone who has never done any philosophy.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Junior high/high school student (Honors History), Student Judge at Regional History Fair.
      *   **Task:** Create a decision procedure (rubric/test) to distinguish between "covering-law" explanations (general patterns) and "narrative" explanations (specific sequences), and identify weak versions of each (fake laws, timelines with "because").
      *   **Constraints:** Must run on a single paragraph in under 10 minutes, no looking anything up, readable by a teacher (no philosophy jargon), must include specific user-generated tests ("Swap Test", "Delete-a-Step Test"), must identify "law-shaped sentences that aren't laws," must state limitations, must run on three specific examples, must identify the most critical test.
      *   **Tone:** Practical, direct, actionable, respectful of the user's intelligence (they know the definitions but need application).

  2.  **Deconstruct the Core Concepts:**
      *   *Covering-Law Model (Hempel):* Explains an event by subsuming it under a general law + initial conditions. (If X happens, then Y always happens. X happened. Therefore Y.)
      *   *Narrative Explanation:* Explains an event by tracing a causal chain of specific contingencies. (A happened, which led to B, which made C possible, resulting in D.)
      *   *The Problem:* Students often mix them poorly. They state a specific sequence but claim it proves a universal law, or they state a universal law but don't show the specific mechanism.
      *   *User's Tests:*
          *   *Swap Test:* Change specific details. If the explanation still holds, it's likely a Covering Law (general pattern). If it breaks, it's Narrative (specific sequence).
          *   *Delete-a-Step Test:* Remove a causal link. If the outcome still follows, the link was filler.

  3.  **Drafting the Decision Procedure (The "History Fair Diagnostic"):**
      *   *Goal:* Needs to be a flowchart or step-by-step checklist.
      *   *Step 1: The "Because" Check.* Is there actually an explanation, or just a list?
      *   *Step 2: The Swap Test (User's idea).* This distinguishes Law vs. Narrative.
      *   *Step 3: The "Falsifiability" Check (User's request on fake laws).* Is the generalization actually testable?
      *   *Step 4: The Delete-a-Step Test (User's idea).* Checks causal density.
      *   *Verdicts:* Strong Narrative, Strong Covering Law, Weak/Mixed, Just a Timeline.
      *   *Limitations:* Can't verify truth, only structure.

      *Refining the Steps for the User:*
      *   Make it punchy. Use their terminology.
      *   Ensure the "Fake Law" check is distinct. "Empires always fall" is tautological. "Empires fall when military spending exceeds 5% of GDP" is falsifiable.
      *   Ensure the "Handoff" point is clear. When does the judge need to use discretion?

  4.  **Running the Procedure on the Three Examples:**

      *   *Example 1 (French Revolution):* Bad harvest + broke gov -> Revolution.
          *   *Swap Test:* If I swap France for England + bad harvest + broke gov -> Revolution? Maybe, maybe not. It implies a general rule (economic stress -> revolt).
          *   *Verdict:* Leaning Covering Law, but needs more specific mechanism to be strong. It's a bit generic.
      *   *Example 2 (Soviet Union):* Collapsed because overextended empires always do.
          *   *Swap Test:* Swap USSR for Rome. "Rome collapsed because overextended empires always do." Works.
          *   *Fake Law Check:* "Always do." Is this falsifiable? What if an empire doesn't? Then it wasn't "overextended" by definition? This is circular.
          *   *Verdict:* Fake Law / Tautology. Weak.
      *   *Example 3 (Mill Shutdown):* Debt + Buyer Switch + Union Contract = Shutdown.
          *   *Swap Test:* Swap Mill for Bakery. Debt + Buyer Switch + Contract. Does Bakery close? Not necessarily. Depends on the specific leverage.
          *   *Delete-a-Step:* Remove "Buyer Switch." Do they close? Maybe not, they could pay debt. Remove "Debt." Can they weather the buyer switch? Maybe.
          *   *Verdict:* Strong Narrative. Contingent chain.

      *Wait, I need to check the User's intuition:* The user thinks (3) is the strongest. My analysis supports this. (2) is clearly the weakest (tautology). (1) is middle (plausible generalization but lacks specific mechanism).

  5.  **Identifying the "Keystone" Test:**
      *   Which test does the heavy lifting?
      *   The *Swap Test* is the primary differentiator between Law and Narrative.
      *   The *Delete-a-Step Test* checks quality *within* the type.
      *   The *Falsifiability Check* catches bad Laws.
      *   *Decision:* The Swap Test is the engine. Without it, you can't distinguish the *type* of explanation, only the quality. If you drop it, you can't tell if the student is aiming for a pattern or a story.

  6.  **Refining the Output (Teacher-Ready & Student-Usable):**
      *   Avoid "Hempel," "Positivism," "Ontology."
      *   Use "General Rule" instead of "Covering Law."
      *   Use "Specific Chain" instead of "Narrative."
      *   Make the "Fake Law" section clear (The "No Matter What" Test).
      *   Ensure the limitations are honest.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 10 minutes realistic?
      *   *Fix:* Keep the steps tight. Read paragraph (2 min), Run Swap (3 min), Run Delete (3 min), Verdict (2 min).
      *   *Critique:* Did I address the "Fake Law" request specifically?
      *   *Fix:* Add a specific "Tautology Trap" step.
      *   *Critique:* User asked to fix their made-up tests if they are bad.
      *   *Fix:* The tests are actually quite good (philosophically sound). I will validate them but refine the *application* instructions to make them sharper. The Swap Test needs to be careful not to change *structural* conditions, only *specific* identities.
      *   *Critique:* User wants to know what breaks if a test is dropped.
      *   *Fix:* Be specific about the Swap Test being the classifier.

  8.  **Final Polish:** Check tone. Encouraging but rigorous. Acknowledge the difficulty of the task (judging 40 boards is hard). Ensure the verdicts match the requested categories.

      *(Self-Correction on Example 1)*: The French Revolution example is actually a classic "multi-causal" explanation that *looks* like a covering law but is often taught as a specific conjuncture. I need to be careful not to dismiss it as "weak" just because it's common, but point out that as written in the prompt, it lacks the *mechanism* (why did prices lead to revolution specifically then?). I will classify it as a "Thin Covering Law."

      *(Self-Correction on Example 2)*: This is definitely a Tautology. "Overextended empires fall" defines "overextended" as "to the point of falling."

      *(Self-Correction on Example 3)*: This is a "Conjunctural Narrative." It relies on the timing of three specific things.

      *Final check on constraints:* "Under 10 minutes," "No looking up," "Readable by teacher."

      Let's assemble the response.

      *Structure:*
      1.  Validation of User's Tests.
      2.  The Procedure (The "10-Minute Diagnostic").
      3.  Limitations.
      4.  Running the Examples.
      5.  The Keystone Test Analysis.

      *Refining the "Fake Law" check:* The user asked: "catches law-shaped sentences that aren't laws... and tells me how that's different from a real generalization with a scope that could turn out false."
      *Solution:* The "Counter-Example Search." If you can imagine a case where the condition is met but the result doesn't happen, is the law adjusted to explain it away? If yes, it's a fake law.

      *Refining the "Handoff":* When the text is ambiguous or the history is too complex for a quick mental check.

      Okay, ready to write.s
answer: |-
  This is a sophisticated request. You have correctly identified the two main modes of historical explanation (philosophers call them the *Covering Law Model* vs. *Narrative/Configurational Explanation*), and your intuition about how to test them is philosophically sound. Your teacher is right that mixing them poorly is a common failure mode, and your "Swap" and "Delete" tests are excellent practical tools to catch it.

  Here is a decision procedure designed for your constraints. It avoids jargon, fits a 10-minute window, and produces a clear verdict.

  ### Part 1: Your Tests (Validated & Tuned)

  Your invented tests are **good**. They do not need fixing, but they need precise instructions to work in under 10 minutes.

  1.  **The Swap Test:** You are checking for **Generality**.
      *   *Tweak:* Do not change the *type* of variable (e.g., don't swap "economic crisis" for "alien invasion"). Only swap the *identities* (France $\rightarrow$ England, 1789 $\rightarrow$ 1848).
  2.  **The Delete-a-Step Test:** You are checking for **Causal Density**.
      *   *Tweak:* If you delete a step and the outcome still seems inevitable, that step was "decorative." If the outcome becomes impossible or unlikely, that step was "load-bearing."
  3.  **The "No Matter What" Test (New):** This addresses your request about fake laws.
      *   *Purpose:* To catch tautologies (statements that are true by definition and cannot be proven false).

  ---

  ### Part 2: The 10-Minute Diagnostic Procedure

  **Preparation (1 Minute):**
  Read the specific paragraph explaining *why* the event happened. Underline the **Event** (the outcome) and the **Causes** (the reasons given).

  **Step 1: The "Because" Check (Stop Early if Failed)**
  *   **Question:** Does the text connect the Causes to the Event with a mechanism, or just a sequence?
  *   **Pass:** "A happened, which forced B to do X, leading to Event."
  *   **Fail:** "A happened. Then B happened. Then Event." (This is a timeline, not an explanation).
  *   **Verdict:** **TIMELINE WITH "BECAUSE" STAPLED TO IT.** (Stop here. Rank low.)

  **Step 2: The Swap Test (3 Minutes)**
  *   **Action:** In your head, replace the specific names/dates with comparable ones (e.g., swap "Soviet Union" for "Roman Empire," or "1998" for "1985"). Keep the *logic* the same.
  *   **Question:** Does the explanation still make sense and predict the same outcome?
  *   **Outcome A (Yes, it holds):** The explanation relies on a general pattern.
      *   *Go to Step 3.*
  *   **Outcome B (No, it breaks):** The explanation relies on specific details unique to this case.
      *   *Go to Step 4.*

  **Step 3: The "No Matter What" Test (For General Patterns)**
  *   **Context:** You are now evaluating a **Covering Law** explanation.
  *   **Question:** Can you imagine a scenario where the Cause happens but the Event *does not*?
  *   **Pass (Real Law):** "Revolutions happen when bread prices rise." (Counter-example: Prices rose, no revolution. The law is falsifiable/testable.)
  *   **Fail (Fake Law):** "Empires fall when they become unsustainable." (Counter-example: An empire that doesn't fall was, by definition, "sustainable." The sentence cannot be proven false.)
  *   **Verdict:**
      *   If Pass: **STRONG COVERING LAW.**
      *   If Fail: **FAKE LAW (TAUTOLOGY).** (Rank low. It sounds deep but says nothing.)

  **Step 4: The Delete-a-Step Test (For Specific Sequences)**
  *   **Context:** You are now evaluating a **Narrative** explanation.
  *   **Action:** Mentally remove one of the specific causes listed.
  *   **Question:** Does the Event still happen?
  *   **Pass:** No. Without that specific link, the chain breaks. The outcome is no longer certain.
  *   **Fail:** Yes. The outcome seems inevitable even without that specific detail.
  *   **Verdict:**
      *   If Pass: **STRONG NARRATIVE.**
      *   If Fail: **THIN NARRATIVE (Filler).** (Rank medium/low. The student is padding.)

  **Step 5: The Human Handoff**
  *   **Trigger:** If Step 2 is ambiguous (the explanation seems to rely on *both* specific details and general patterns equally).
  *   **Action:** This is a **MIXED EXPLANATION**.
  *   **Judgment Call:** Is the mix intentional? (e.g., "While economic stress usually causes unrest [Law], in this specific case, the King's illness prevented a crackdown [Narrative].")
  *   **Verdict:** If the student acknowledges the tension: **SOPHISTICATED MIX.** If they contradict themselves: **CONFUSED.**

  ---

  ### Part 3: Limitations (What This Procedure Cannot Do)

  1.  **Truth Verification:** This procedure tests the *structure* of the argument, not the *facts*. A student can write a "Strong Narrative" that is completely historically inaccurate. You still need to know your history.
  2.  **Scope Judgment:** It cannot tell you if a "Covering Law" is too broad. (e.g., "Human nature causes war" passes the Swap Test but is too vague to be useful).
  3.  **The "Black Swan" Problem:** Sometimes a Strong Narrative looks like a Fake Law because the event was so unique. The procedure might penalize a truly groundbreaking historical insight that defies categorization.

  ---

  ### Part 4: Running the Procedure on Your Examples

  Here is how the diagnostic runs on the three projects you provided.

  #### Project 1: The French Revolution
  *   **Claim:** Revolution broke out because bad harvest $\rightarrow$ bread prices up + government broke.
  *   **Step 1 (Because):** Pass. Connects economics to political outcome.
  *   **Step 2 (Swap):** Swap France (1789) for England (1640) or Russia (1917). Bad harvest + Broke Gov $\rightarrow$ Revolution? **Yes.** The logic holds across cases.
  *   **Path:** Goes to Step 3 (Covering Law).
  *   **Step 3 (No Matter What):** Can you have high bread prices + broke gov *without* revolution? **Yes.** (Many countries had famines without regime collapse).
  *   **Verdict:** **STRONG COVERING LAW.**
  *   **Critique:** This is a solid, standard historical explanation. It argues that specific conditions trigger a general sociological rule. It is not "weak," but it is not unique to France.

  #### Project 2: The Soviet Union
  *   **Claim:** USSR collapsed because every overextended empire eventually does.
  *   **Step 1 (Because):** Pass.
  *   **Step 2 (Swap):** Swap USSR for Rome or Britain. "Rome fell because every overextended empire eventually does." **Yes.** Logic holds.
  *   **Path:** Goes to Step 3 (Covering Law).
  *   **Step 3 (No Matter What):** Can you imagine an overextended empire that *doesn't* fall?
      *   *Analysis:* If the student says "No, because if it didn't fall, it wasn't overextended," they are trapped. The term "overextended" is doing all the work. It defines the cause by the effect.
  *   **Verdict:** **FAKE LAW (TAUTOLOGY).**
  *   **Critique:** This is the weakest of the three. It sounds profound but offers no mechanism. *How* does overextension cause collapse? Debt? Rebellion? Military defeat? It doesn't say.

  #### Project 3: The Mill Shutdown (Your Project)
  *   **Claim:** Mill closed because (A) Debt on Plant 2 + (B) Buyer switched overseas + (C) Union contract renewal.
  *   **Step 1 (Because):** Pass. Connects financial/contractual details to closure.
  *   **Step 2 (Swap):** Swap "Mill" for "Bakery." Swap "1998" for "2005." Debt + Buyer Switch + Contract $\rightarrow$ Closure?
      *   *Analysis:* **No.** A bakery might have cash reserves. A different year might have different interest rates. The explanation relies heavily on the *conjunction* of these three specific things at this specific time.
  *   **Path:** Goes to Step 4 (Narrative).
  *   **Step 3 (Delete-a-Step):**
      *   Remove (B) Buyer Switch: Do they close? Maybe not, they could pay debt with revenue.
      *   Remove (A) Debt: Do they close? Maybe not, they could weather the loss of the buyer.
      *   Remove (C) Union Contract: Do they close? Maybe they could renegotiate.
      *   *Analysis:* The outcome depends on the *collision* of all three. Each link is load-bearing.
  *   **Verdict:** **STRONG NARRATIVE.**
  *   **Critique:** You are correct. This is the strongest project. It explains why *this* mill closed *then*, not why mills generally close. It treats the event as a unique conjuncture rather than an instance of a rule.

  ---

  ### Part 5: The Keystone Test

  **The Swap Test is doing 80% of the work.**

  **Why:**
  The fundamental error students make is not knowing *what kind of argument they are making*.
  *   If they drop the **Swap Test**, you cannot distinguish between a **Covering Law** and a **Narrative**. You might penalize a good Narrative for not being general enough, or penalize a good Law for not being specific enough.
  *   The **Delete-a-Step Test** only tells you if the argument is *tight*.
  *   The **Swap Test** tells you what the argument *is*.

  **What breaks if you drop it:**
  If you remove the Swap Test, you lose the ability to catch the "Mixed/Confused" verdict. A student might write a paragraph that starts with a general law ("Revolutions always happen when...") but then spends the rest of the time describing a specific sequence without connecting them. Without the Swap Test, you might just think "The Delete Test passes, so it's good." But it's actually a category error. The Swap Test forces you to identify the *engine* of the explanation before you check if the engine is running smoothly.

  ### Summary for your Teacher
  If your teacher asks for the rationale, tell them:
  *"We are using a structural diagnostic. We aren't grading whether the history is 'right' (that's fact-checking); we are grading whether the **causal logic** holds together. The Swap Test identifies if the student is arguing from a General Rule or a Specific Sequence. The Delete Test identifies if their evidence is actually supporting that claim or just filling space."*

  Good luck at the fair. Judging 40 boards is exhausting, but having a rubric like this will keep your scoring consistent when your brain gets tired in hour three.
