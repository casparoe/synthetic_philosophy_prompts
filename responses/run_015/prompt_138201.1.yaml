  *Correction on "Bogus":* I need to be careful not to say national identity is *never* bogus. Sometimes it is exclusionary or based on lies. But "invented" isn't the proof of that. The proof is in the *consequences* or the *coercion*, not the origin.

  9.  **Final Structure:**
      *   Intro: Acknowledge the pedagogical moment.
      *   The Menu (6 Claims).
      *   The Inference Problem (Invented $\rightarrow$ Bogus).
      *   The "Imagined" Distinction.
      *   Closing thought for the seminar.

