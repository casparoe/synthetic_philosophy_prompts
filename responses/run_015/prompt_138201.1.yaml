answer: |-
  Here is a breakdown designed for a handout. It separates the logical claims hidden inside the slogan, evaluates their truth-value, and isolates the specific fallacy your student deployed.

  ### The Menu: Six Claims Hidden in "It's All Invented"

  | # | The Claim | Logical Type | Status | Evidence Required | Does it imply the identity is "Bogus"? |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Temporal Claim:** Everything has a starting point; nothing is eternal. | Trivial / Tautological | **True** (but useless) | Historical dating of the practice. | **No.** Being new does not make a social fact unreal. (Marriage is new; money is new). |
  | **2** | **The Antiquity Claim:** The specific claim that *this* tradition is ancient is a lie. | Empirical / Historical | **Substantive** (Often Defensible) | Comparison of the claim vs. archival record. | **No.** It proves *deception* about age, not that the current identity is ineffective or fake. |
  | **3** | **The Discontinuity Claim:** There is a break in history; the link to the past is manufactured, not organic. | Empirical / Sociological | **Substantive** (Defensible) | Genealogy of practices; showing gaps in transmission. | **No.** Shows *engineering*, but engineered things (constitutions, states) are still real. |
  | **4** | **The Design Claim:** Specific agents sat down and deliberately designed the content for a purpose. | Empirical / Intentional | **Often False** (Exaggerated) | Minutes, memos, correspondence of elites. | **Maybe.** Suggests cynicism, but ignores bottom-up adoption. |
  | **5** | **The Instrumentalist Claim:** The identity exists *solely* to serve elite power; it has no genuine purchase on the populace. | Functional / Political | **Debatable** (Hard to prove) | Evidence of coercion vs. genuine belief; resonance with masses. | **Yes.** If true, the identity is a sham imposed from above. |
  | **6** | **The Ontological Claim:** All social reality is constructed; therefore "invented" contrasts with nothing. | Philosophical / Meta | **Strong** (But self-defeating here) | N/A (Theoretical stance). | **No.** If *everything* is invented, the word loses its critical bite. |

  ---

  ### The Student's Inference: From "Invented" to "Bogus"

  Your student wants to make this move:
  > *Premise:* The tradition/identity is invented.
  > *Conclusion:* Therefore, the national identity claim is bogus/invalid.

  **Why this fails logically:**
  This inference only works if you accept a hidden normative premise: **"Only organic/ancient/undesignated things are authentic."**

  1.  **The Authenticity Trap:** The student is using a Constructivist argument ("it was made by humans") to defeat a Primordialist claim ("it is ancient"), but they are retaining a Primordialist standard of value ("therefore it doesn't count").
  2.  **The Category Error:** "Invented" describes **genesis** (how it came to be). "Bogus" describes **ontology** (whether it exists) or **normativity** (whether it is good).
      *   *Counter-example:* A law is invented. A currency is invented. A university is invented. They are not "bogus" social facts; they have real coercive and constitutive power.
  3.  **When does "Invented" imply "Bogus"?**
      *   Only if you adopt **Claim #5 (Instrumentalism)** *and* prove that the populace does not believe it.
      *   If the populace *believes* it, it is sociologically real, regardless of its invented genesis. To call it "bogus" because people believe a lie is to privilege the historian's truth over the actor's reality.

  **Pedagogical Point:** The student has destroyed the contrast term. If *all* traditions are invented (Claim #6), then calling nationalism "invented" distinguishes it from nothing. If *some* are invented and some aren't, they must define the "uninvented" baseline (which usually turns out to be a Romantic myth).

  ---

  ### Where does "Imagined" fit?

  "Imagined" (Anderson) is **not** an item on the menu above. It is a different category of claim entirely.

  *   **"Invented"** is about **Process/Origin** (Hobsbawm). It asks: *Who made this, when, and how?*
  *   **"Imagined"** is about **Cognitive Structure** (Anderson). It asks: *How do members hold the community in their minds?*

  **Crucial Distinction for Students:**
  *   Anderson explicitly states "Imagined" does **not** mean "Fake."
  *   It means the community is too large for face-to-face interaction, so it must be mediated by symbols/texts.
  *   **The Student's Error:** They are treating "Imagined" as a synonym for "Invented" (Claim #4 or #5) to imply falsity.
  *   **Correction:** A community can be *imagined* (Anderson) without being *recently invented* (Hobsbawm), and it can be *invented* without being *fake*.

  ### Summary for the Handout

  **The "It's All Invented" Shutdown:**
  *   **Trivial Truth:** Everything has a beginning. (Doesn't invalidate the thing).
  *   **Historical Correction:** The date is faked. (Invalidates the *age*, not the *identity*).
  *   **Sociological Insight:** The continuity is stitched. (Explains the *mechanism*, doesn't deny the *effect*).
  *   **The Fallacy:** Assuming that *made* = *fake*. (Social facts are made, but they are still facts).

  **Discussion Question:**
  "If money, laws, and marriages are all 'invented' social constructs, what specific evidence would you need to show that a national identity is not just invented, but *ineffective* or *illegitimate*?"
