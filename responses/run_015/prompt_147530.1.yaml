answer: |-
  **The Diagnostic Tree**

  To diagnose a broken metric, we must sort failures by their observable state, not their theoretical cause. Of your five candidates, Question 2 (*Who can move faster?*) is collapsed. It describes the dynamic condition allowing failure, not the static signature of the failure itself; it is redundant with Question 5 (*What channel?*), as a faster measured party invariably chooses the path of least resistance (effort or attack). Question 1 (*Where is the damage?*) is retained but refined to distinguish between the thing getting worse versus the number merely losing information.

  The tree proceeds from the nature of the measure to the state of the underlying reality, then to the structure of the incentive, and finally to the method of response.

  1.  **Is the measure constitutive?** (Has the number become the definition of the work?)
      *   **Yes:** Go to 2.
      *   **No:** (It is a proxy). Go to 3.
  2.  **Did the underlying quality improve?**
      *   **Yes:** **Leaf 1: The Survivor.** (Implication: The measure successfully redefined the practice.)
      *   **No:** **Leaf 2: The Hollow Ritual** (Staff know it's empty) or **Leaf 3: The Delusion** (Leadership believes it).
  3.  **Is the underlying thing worse, or merely obscured?**
      *   **Obsured (Unchanged):** Go to 4.
      *   **Worse:** Go to 5.
  4.  **Where is the decay located?**
      *   **Extremes:** **Leaf 4: Edge Decay.**
      *   **Global:** **Leaf 5: Noise** (Variance) or **Leaf 6: Bias** (Mean shift).
  5.  **Is the payoff a cliff or a gradient?**
      *   **Cliff:** Go to 6.
      *   **Gradient:** Go to 7.
  6.  **How was the cliff managed?**
      *   **Effort (Bypass):** **Leaf 7: Threshold Hugging.**
      *   **Attack (Breach):** **Leaf 8: Cutoff Fraud.**
  7.  **How was the gradient managed?**
      *   **Effort (Substitution):** **Leaf 9: Cream-Skimming.**
      *   **Attack (Corruption):** **Leaf 10: Channel Corruption.**

  ***

  **The Leaves**

  | Leaf | Observable Signature | Awkward Commitment | The Mover |
  | :--- | :--- | :--- | :--- |
  | **1. The Survivor** | Metric rises; independent audits confirm quality rise. | You must admit the old definition of the work was wrong. | If independent quality falls, move to Leaf 2. |
  | **2. Hollow Ritual** | Metric hit; staff treat it as box-ticking; quality stagnant. | You must admit leadership knows the number is worthless. | If leadership begins punishing misses, move to Leaf 3. |
  | **3. The Delusion** | Metric hit; leadership cites it as proof of quality; quality stagnant. | You must admit leadership is being misled by their own tool. | If staff admit the game openly, move to Leaf 2. |
  | **4. Edge Decay** | Metric correlates with reality in the middle, diverges at tails. | You must accept the measure is useless for high-stakes cases. | If divergence spreads to the mean, move to Leaf 6. |
  | **5. Noise** | Metric fluctuates wildly without corresponding reality shifts. | You must accept the measure is too costly to collect. | If fluctuation becomes one-directional, move to Leaf 6. |
  | **6. Bias** | Metric consistently over/under-states reality globally. | You must accept the baseline is broken, not just the variance. | If underlying quality begins to drop, move to Leaf 9. |
  | **7. Threshold Hugging** | Data bunches immediately below/above a cutoff; quality dips slightly. | You must admit legal gaming is indistinguishable from failure. | If records are altered to cross cutoff, move to Leaf 8. |
  | **8. Cutoff Fraud** | Discontinuous jump in data at cutoff; audit trails broken. | You must accuse specific actors of falsification. | If behavior is systemic rather than individual, move to Leaf 7. |
  | **9. Cream-Skimming** | Easy cases increase; hard cases are diverted or dropped. | You must admit efficiency gains are actually exclusion. | If hard cases are manipulated rather than dropped, move to Leaf 10. |
  | **10. Channel Corruption** | Measurement tools break or are tampered with; data looks too clean. | You must admit the monitoring system itself is compromised. | If tampering stops but metric stays high, move to Leaf 1. |

  ***

  **Sidebar: The Ten-Question Triage**

  1.  Did you stop checking the real work once the number arrived?
  2.  Do staff laugh when the number is mentioned?
  3.  Do leaders cite the number as proof of success despite complaints?
  4.  Does the number fail only for the sickest/richest/hardest cases?
  5.  Does the number jump up and down week-to-week without reason?
  6.  Is the number consistently higher than independent checks suggest?
  7.  Do you see many cases ending just before the deadline?
  8.  Do records near the deadline look edited or missing?
  9.  Are easy cases being counted more than hard ones?
  10. Do the sensors or auditors seem broken or too friendly?

  **Scoring Rule:**
  *   **Q1 Yes + Q2/3 No:** Leaf 1.
  *   **Q1 Yes + Q2 Yes:** Leaf 2.
  *   **Q1 Yes + Q3 Yes:** Leaf 3.
  *   **Q4 Yes:** Leaf 4.
  *   **Q5 Yes:** Leaf 5.
  *   **Q6 Yes:** Leaf 6.
  *   **Q7 Yes:** Leaf 7.
  *   **Q8 Yes:** Leaf 8.
  *   **Q9 Yes:** Leaf 9.
  *   **Q10 Yes:** Leaf 10.

  **Disagreement Note:** The quiz forces a single choice per leaf. The tree allows for mixed states (e.g., Noise + Bias). The quiz will misclassify complex failures as simple ones.

  ***

  **Worked Applications**

  **Case 1: Hospital Emergency Department (Clean Verdict)**
  *Scenario:* A hospital is judged on the share of patients seen within four hours. Patients are held in ambulances before the clock starts.
  *Diagnosis:* **Leaf 7: Threshold Hugging.**
  *Application:* The measure is a proxy (waiting time), not constitutive. The underlying thing (patient health) is arguably worse due to delay, but the metric is hit. The payoff is a cliff (four-hour target). The response is effort redirection (bypassing the clock by holding ambulances) rather than attacking the data log itself.
  *Signature:* You would see a spike in admissions at 3 hours 55 minutes and a backlog of ambulances outside.
  *Commitment:* You must admit that meeting the target is now causing the delay it was meant to measure.
  *Mover:* If ambulance logs were altered to show earlier arrival times, this would move to Leaf 8 (Cutoff Fraud).

  **Case 2: School Accountability Scores (Ambiguous)**
  *Scenario:* A school's test scores rise for three years while an unaudited assessment administered by a different body stays flat.
  *Diagnosis:* **Ambiguous between Leaf 9 (Cream-Skimming) and Leaf 6 (Bias).**
  *Application:* The measure is a proxy. The underlying thing (learning) is unchanged (flat unaudited assessment), while the number rises. This indicates decay or gaming.
  *Ambiguity:* If the school is teaching specifically to the tested curriculum while ignoring broader skills, it is Leaf 9 (Effort Substitution/Cream-Skimming of knowledge). If the test itself has become easier or graded more leniently over time relative to the unaudited body, it is Leaf 6 (Bias/Signal Drift).
  *Settling Evidence:* We need to know if the *content* of the instruction changed (favoring Leaf 9) or if the *grading standard* of the test changed (favoring Leaf 6). The tree cannot settle this because both produce the same signature: divergence between the target metric and an independent measure of the underlying trait. The instrument identifies the decay, but not whether the decay is in the student's effort or the test's validity.
