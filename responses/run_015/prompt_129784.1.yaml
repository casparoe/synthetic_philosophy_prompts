  # THE CONSCIOUSNESS DECISION TREE (A4 INSTRUMENT)

  **Instructions:** Start at **Q1**. Follow the arrow matching your intuition. Answer all 8 questions to reach a Leaf. If a question seems irrelevant to your path, answer based on your *best guess* for the theory you are leaning toward.

  ### THE BRANCH QUESTIONS

  **Q1. The Taxi Driver (Access vs. Phenomenality)**
  The driver snaps out of autopilot. During the autopilot phase, was there *something it was like* to be him, even if he can't report it?
  *   **Yes:** There is phenomenality without access. → **Go to Q2**
  *   **No:** Consciousness just *is* access/reportability. → **Go to Q8**

  **Q2. The Absorbed Athlete (HO Necessity)**
  The athlete feels the sun but isn't thinking "I am feeling the sun." Is a higher-order state *necessary* for that feeling to be conscious?
  *   **No:** First-order states can be conscious on their own. → **Go to Q8**
  *   **Yes:** You need a state about the state. → **Go to Q3**

  **Q3. The Mechanism (Structure)**
  Is the "awareness" a *second* state targeting the first, or does the first state represent *itself*?
  *   **Itself:** Intrinsic self-representation. → **Go to Q8**
  *   **Second State:** Extrinsic targeting (Transitive). → **Go to Q4**

  **Q4. The Wine Taster (Modality)**
  Is the higher-order state more like *thinking* "this is wine" (conceptual) or *scanning* the taste (perceptual)?
  *   **Scanning/Perceptual:** Inner Sense. → **Go to Q8**
  *   **Thinking/Conceptual:** Higher-Order Thought. → **Go to Q5**

  **Q5. The Hot Tub (Occurrentcy)**
  You are lost in the heat, not thinking "I am relaxed." Is there a *current* thought about your state right now?
  *   **No:** Only a *disposition* to think it is needed. → **Go to Q8**
  *   **Yes:** An *occurrent* thought is required. → **Go to Q6**

  **Q6. The Swapped Monitor (Misrepresentation)**
  The monitor says "Pain" but the body is fine. Do you feel pain?
  *   **No:** The monitor must be accurate. → **Go to Q8**
  *   **Yes:** Misrepresentation creates consciousness. → **Go to Q7**

  **Q7. The Late/Doubled Monitor (Coherence)**
  The monitor arrives 400ms late or contradicts itself. Does consciousness vanish?
  *   **Yes:** Strict synchrony/coherence required. → **Go to Q8**
  *   **No:** Loose coupling suffices. → **Go to Q8**

  **Q8. The Rack (Substrate)**
  An artificial system (The Rack) functionally matches all your criteria above. Is it conscious?
  *   **Yes:** Functionalism. → **LEAF**
  *   **No:** Biological/Physical constraint. → **LEAF**

  ---

  ### THE LEAVES (POSITIONS)

  **Leaf 1: First-Order Representationalism (Functionalist)**
  *(Path: Q1=Yes, Q2=No, Q8=Yes)*
  Consciousness is a first-order state available for use. The Rack is conscious.
  **Leaf 2: First-Order Representationalism (Biological)**
  *(Path: Q1=Yes, Q2=No, Q8=No)*
  Consciousness is a first-order state, but requires biology. The Rack is a zombie.

  **Leaf 3: Self-Representationalism (Functionalist)**
  *(Path: Q1=Yes, Q2=Yes, Q3=Itself, Q8=Yes)*
  Conscious states represent themselves. Intrinsic higher-order content. The Rack is conscious.
  **Leaf 4: Self-Representationalism (Biological)**
  *(Path: Q1=Yes, Q2=Yes, Q3=Itself, Q8=No)*
  Self-representation requires specific biological architecture. The Rack is not conscious.

  **Leaf 5: Higher-Order Perception (HOP)**
  *(Path: Q1=Yes, Q2=Yes, Q3=Second, Q4=Scanning, Q8=Any)*
  Consciousness via an inner sense. (Q8 rarely splits this view; usually assumes biology).
  *Note: If Q8=Yes, this is **Unnamed**. Few argue for a functional inner sense.*

  **Leaf 6: Dispositional Higher-Order Thought**
  *(Path: Q1=Yes, Q2=Yes, Q3=Second, Q4=Thinking, Q5=No, Q8=Yes/No)*
  Consciousness requires only the *capacity* to think about the state.
  *   **6a (Functionalist):** The Rack has the disposition.
  *   **6b (Biological):** The Rack lacks the biological disposition.

  **Leaf 7: Actualist Higher-Order Thought (Reliability)**
  *(Path: Q1=Yes... Q6=No)*
  **Unnamed.** Requires occurrent thought that must be *accurate*.
  *Why Empty?* Hard to distinguish from HOP or Self-Rep. If it must be accurate, why call it a "thought" rather than a "scan"?

  **Leaf 8: Actualist Higher-Order Thought (Strict)**
  *(Path: Q1=Yes... Q6=Yes, Q7=Yes, Q8=Yes/No)*
  **Rosenthal-style Actualism.** Occurrent thought, misrep allowed, strict timing.
  *   **8a (Functionalist):** The Rack is conscious.
  *   **8b (Biological):** The Rack is not.

  **Leaf 9: Actualist Higher-Order Thought (Liberal)**
  *(Path: Q1=Yes... Q6=Yes, Q7=No, Q8=Yes/No)*
  **Unnamed.** Occurrent thought, misrep allowed, loose timing.
  *Why Empty?* Most Actualists admit timing matters (Late Monitor kills it). Liberal view collapses into Dispositionalism.

  ---

  ### ANALYSIS: HEAVY LIFTERS & DUDS

  **Heavy Lifting Questions:**
  *   **Q2 (HO Necessity):** The primary split between First-Order and Higher-Order theories.
  *   **Q3 (Structure):** The primary split between Transitive (HOT/HOP) and Same-Order (SOR) views.
  *   **Q5 (Occurrentcy):** The primary split between Actualism and Dispositionalism.

  **Dud Questions:**
  *   **Q7 (Coherence):** Most theories agree that massive contradiction or delay kills consciousness, or they treat it as an empirical detail. It rarely separates named positions.
  *   **Q4 (Modality) + Q6 (Misrep):** These often travel together. If you think it's perceptual (Q4), you usually think it must be accurate (Q6). If you separate them, you land in **Leaf 7 (Unnamed)**.

  **Incompatible Combinations (Flag for Students):**
  *   **Q4=Scanning + Q6=Yes:** If awareness is perceptual, it implies a causal link. Claiming it can misrepresent (create pain from nothing) makes it seem thought-like, not perceptual.
  *   **Q5=No (Dispositional) + Q8=Yes (Rack):** Hard to argue a machine has a "disposition" to think without it being a functional state. If it's functional, why not Occurrent?
  *   **Q1=No + Q2=Yes:** If consciousness is just access (Q1=No), positing a hidden Higher-Order state (Q2=Yes) is redundant.

  ---

  ### THE CASE QUIZ: SCORING KEY

  *Use this to check if your case intuitions match your theoretical leaf.*

  | Case | **FOR** (Leaves 1-2) | **SOR** (Leaves 3-4) | **HOP** (Leaf 5) | **Dispositional HOT** (Leaf 6) | **Actualist HOT** (Leaf 8) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Taxi Driver** (Autopilot) | Conscious (FO state present) | Unconscious (No self-rep) | Unconscious (No inner scan) | Unconscious (No disposition active) | Unconscious (No occurrent thought) |
  | **Absorbed Athlete** (Hot Tub) | Conscious | Conscious (Intrinsic) | Conscious (Scanning heat) | Conscious (Disposition exists) | **Unconscious** (No thought 'I am hot') |
  | **Blindsight** | Unconscious (No FO rep) | Unconscious | Unconscious | Unconscious | Unconscious |
  | **Swapped Monitor** | N/A | Impossible (Intrinsic) | Impossible (Perceptual) | Possible (Disposition misfires) | **Possible** (Thought creates pain) |
  | **Late Monitor** (400ms) | N/A | Impossible | Impossible | Possible (Timeless disposition) | **Unconscious** (Thought too late) |
  | **The Rack** | **Conscious** (If Functionalist) | **Conscious** (If Functionalist) | Unlikely | **Conscious** (If Functionalist) | **Conscious** (If Functionalist) |
  | **Wine Taster** (No concepts) | Conscious | Conscious | Conscious | **Unconscious** (Needs concepts) | **Unconscious** (Needs concepts) |

  **Quiz Scoring:**
  *   **Mostly "Conscious" on Autopilot/Hot Tub:** You are likely **First-Order** or **Self-Representational**.
  *   **"Unconscious" on Hot Tub but "Conscious" on Wine Taster:** You are likely **Dispositional HOT**.
  *   **"Unconscious" on Hot Tub AND Wine Taster, but "Pain" on Swapped Monitor:** You are **Actualist HOT**.
  *   **"Unconscious" on The Rack:** You are a **Biological Realist** (Leaves 2, 4, 6b, 8b).
  *   **"Conscious" on The Rack:** You are a **Functionalist** (Leaves 1, 3, 6a, 8a).

  **Warning:** If you answer "Conscious" for the **Taxi Driver** (Access) but "Unconscious" for the **Absorbed Athlete** (Phenomenal), your distinction between Access and Phenomenality is unstable. Most theories treat these consistently.
