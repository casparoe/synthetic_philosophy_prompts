answer: |-
  Good morning. Thank you for having me.

  I spend most of my life making things up. I write fiction. I construct people who never breathed and places that never existed, and I ask you to believe them for a few hundred pages. So, you might think I'm the wrong person to open a workshop on belief. Or perhaps I'm the only right person. Because novelists know that truth isn't always about what you can point to. Sometimes truth is about what you can't live without.

  Look around this room. It's a rare ecosystem. We have philosophers who can dissect a concept until it stops moving. We have clergy who carry the weight of other people's souls. We have students, and we have family members who are just here to support the people they love. If we're not careful, this workshop could become a tower of Babel. The philosophers might speak in proofs, the clergy in testimonies, and everyone else might just feel lost.

  The title of this gathering is "Belief Without Ontology." I know that sounds like a mouthful. It sounds like we're trying to have our cake and eat it too. But I want to suggest that this isn't a trick. It's a rescue mission.

  For the last century, conversations about God have been trapped in a pincer movement. On one side, you have the demand for empirical verification. This side asks: "Where is the evidence? Can you measure it? Does it exist as an object in the universe?" If the answer is no, then religious language is dismissed as failed science. It's treated as a mistaken claim about physics or cosmology.

  On the other side, you have the reduction to sentiment. This side says: "Well, it's not literally true, but it's beautiful. It's poetry. It's psychology. It's just how you feel." This comforts the secular mind, but it empties the religious word of its blood. It turns a commandment into a suggestion. It turns a vow into a mood.

  If we stay in those trenches, nothing grows here.

  So, I want to propose a different way of listening, drawn from the work of Hilary Putnam. He suggested that treating religious language as failed science is a category error. But saying it is "just poetry" is equally wrong. Instead, he compared religious utterances to signing a promissory note. Or entering a covenant.

  Think about a promise. If you stand up and say, "I promise to care for this person," you aren't describing a physical object. You aren't stating a fact about the universe that can be verified under a microscope. But you are also not just writing a poem. You are changing your status. You are incurring an obligation. You only understand what that promise *is* from the inside of keeping it. If you stand outside the practice, watching the person keep their word, you might miss the weight of the thing entirely.

  That is the ground I want us to stand on for the next few days.

  To the philosophers in the room: I ask you to suspend the demand for ontological proof. Do not ask if God exists as a chair exists. Ask instead what work the word "God" is doing in the life of the speaker. What obligations does it create? What form of life does it sustain?

  To the clergy and the faithful: I ask you to resist the urge to defend your language as scientific fact. You don't need to prove God exists like a planet exists. Your language carries weight not because it describes the furniture of the cosmos, but because it binds you to a community and a way of living. You are allowed to speak of truth without speaking of objects.

  And to everyone else: Listen for the commitment, not just the claim.

  We are here to explore how belief functions when it isn't trying to be physics and isn't settling for mere sentiment. We are here to talk about the promissory note. When someone says "God is good," are they describing a attribute? Or are they signing their name to a way of acting in the world?

  If we can agree to this, we might actually hear each other. We might find that belief isn't about assenting to a proposition, but about inhabiting a practice. It's about the difference between analyzing a map and walking the terrain.

  I'm not here to tell you what to believe. I'm here to invite you into a conversation where the rules of engagement allow for something deeper than data, and something heavier than feelings.

  Welcome to the workshop. Let's begin.
