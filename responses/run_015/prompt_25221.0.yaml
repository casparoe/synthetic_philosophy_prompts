answer: |-
  Good evening, everyone. For those who don't know me, I'm Sarah, and I have the privilege of being Elena's Maid of Honor.

  Looking around this room, I see a pretty perfect split. On one side, we have Elena's tribe: the journalists, the researchers, the people who ask "What's your source?" before they ask "How are you?" On the other side, we have David's family: the faithful, the community builders, the people who know that some of the most real things in life are the ones you can't put in a spreadsheet.

  Usually, a marriage is described as a merger of two lives. But Elena and David are something rarer. They are a merger of two different ways of knowing what is true.

  We all know Elena. She is a woman of rigorous integrity. She believes that words matter, that accuracy is a moral obligation, and that you shouldn't believe something just because it feels good. She once told me that believing a lie is an insult to reality. And honestly? That intensity is why she's such a good friend. She doesn't love you because she's told to; she loves you because she's looked at the evidence, and you've proven yourself worthy of it. When Elena chooses you, she has done her due diligence.

  And then there is David. David understands that life is not just a dataset. He knows that trust isn't something you calculate; it's something you offer. He understands that hope is not a strategy, but it is a necessity. He brings a sense of the sacred into a room, a conviction that there is meaning in the mystery, and that love is a covenant, not just a contract.

  For a long time, I wondered how this works. How does the fact-checker build a life with the believer?

  But then I watched them together. I realized that they aren't compromising their standards for each other; they are protecting each other's blind spots.

  Elena keeps David grounded. She ensures that his faith is lived out in concrete actions, that his love is visible in the way he treats people, in the chores he does, in the honesty he brings home every day. She makes sure his love has feet.

  And David keeps Elena open. He reminds her that not everything valuable can be measured. He teaches her that sometimes you have to take a leap before you can see the landing. He makes sure her life has wings.

  In a way, they have met in the middle to create something new. Because think about what a wedding vow is.

  For Elena, a vow is a binding fact. It is a promise made into reality. It is the ultimate data point: *I will be there.*
  For David, a vow is an act of faith. It is a promise to love someone even when the data is inconclusive, even when the future is unknown.

  Together, they have found the one truth that satisfies them both. They know that love requires the rigor to tell the truth, even when it's hard, and the faith to forgive, even when it hurts.

  So, to the journalists in the room: You can verify this love. Look at the last six years. Look at how they show up for each other. The data is solid.
  And to David's family: You can witness this covenant. Look at the commitment they are making today. The faith is real.

  Elena and David, you have proven that you don't need to see the world the same way to look in the same direction. May your life together be honest enough to satisfy the skeptic, and holy enough to satisfy the saint.

  Please raise your glasses. To Elena and David: To the facts of your love, and the faith of your future. Cheers!
