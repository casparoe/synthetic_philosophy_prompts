      *   *Selected Metaphor:* The "Leap" vs. The "Foundation." Or perhaps "The Map and the Compass." Let's go with something about *certainty* vs. *commitment*. Actually, the prompt mentions Clifford and William James explicitly. I shouldn't name-drop the philosophers (too academic), but I should use the *concepts*.
      *   *Refined Theme:* "The Data of the Heart" and "The Faith of the Future." Let's focus on the idea that a marriage is the one place where you need *both* rigorous truth-telling and a willing leap into the unknown.

