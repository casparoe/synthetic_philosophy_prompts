answer: |-
  Hi everyone, I know we keep running into the same wall with the integrity objection seminar where half the class conflates the permission to favor loved ones with the complaint that morality is too demanding, so I have drafted the logic for a decision tree handout that forces them to distinguish these by committing to specific cases rather than labels. The structure relies on three branch questions, each offering three distinct answer options, which theoretically creates twenty-seven logical combinations, though most are empty or incoherent. We will walk the students through these branches in order, starting with the deliberative status of the thought, moving to the metaphysical structure of the reason, and ending with the third-personal allocation problem, and then I will map the viable leaves to the positions we need them to identify, including the control cases and the specific readings you requested.

  The first branch question presents the burning building case where they must choose between a spouse and a stranger who will save more lives, and it asks whether the thought she is my wife is permissible as a motive during the decision, permissible only as a justification afterwards, or never permissible at all. If they say never permissible, they are pushed toward impartial consequentialism, but if they say permissible during the decision, they move to the second branch, while the middle option where it is only permissible retrospectively is a trap for students who want to have it both ways and usually leads to an unnamed and unstable position where the action is right but the reason is wrong. The second branch asks whether the relationship itself is the source of the reason to save her, or merely a background condition that allows a general reason like promoting well-being to apply more strongly, or if the relationship is irrelevant to the reasoning structure entirely. This is where we catch the students who claim to value relationships but actually hold an indirect consequentialist view where the relationship is just a heuristic for maximizing good, and those who say the relationship is irrelevant despite saving the spouse are flagged for inconsistency unless they are strict impartialists who made a mistake on the first branch. The third branch shifts to the third-personal perspective where the student is the chief rescuer allocating the single slot between two victims one of whom is someone else's spouse, and they must decide whether saving the spouse because she is his wife is justified, unjustified, or justified only if the spouse is the one choosing. This node is critical because it separates the view that relationships generate objective reasons from the view that they generate only agent-centered prerogatives, and it is where the demandingness complaint usually reveals itself as distinct from the integrity objection.

  Once we have the answers, we map them to the leaves, starting with the combination where the thought is never permissible, the relationship is irrelevant, and the allocator must be impartial, which lands on impartial consequentialism with the awkward commitment that you are morally required to let your spouse die to save a stranger who is slightly more useful. If they say the thought is permissible during deliberation, the relationship is the source of the reason, but the allocator must still be impartial, we land on the Scheffler-style prerogative view where you are permitted to favor your own but not required to, with the awkward commitment that the agent is allowed to be partial while the person in charge of justice must be impartial. If they say the thought is permissible, the relationship is the source, and the allocator should also save the spouse, we land on the view that integrity is just another item to be weighed in the balance, which is a misreading of the objection because it turns integrity into a value to be maximized rather than a constraint on the moral system, committing them to the view that integrity can be sacrificed if enough of it is gained elsewhere. There is a leaf for the phenomenology-only reading where the thought is permissible but the relationship is irrelevant to the reason structure, which commits them to the view that the objection changes nothing about what you ought to do but only how it feels to do it. We also have a leaf for the demandingness complaint in its own right, which typically arrives via the first branch option where the thought is never permissible but the student rejects the theory rather than the action, committing them to the claim that morality is false because it requires too much, which is distinct from the integrity claim that morality misunderstands the agent. There are two unnamed leaves, one where the thought is only permissible retrospectively which is incoherent because it severs the link between justification and action, and one where the relationship is a background condition but the allocator must save the spouse, which is unattractive because it implies institutional nepotism without personal justification.

  Regarding the control cases, the person who acts with no articulable thought fits on the Williams integrity leaf because the tree treats the availability of the thought as the test rather than its explicit utterance, so instinctive action counts as having the reason available, whereas the doctor doing triage falls on the third branch where institutional role justifies the partiality, separating the integrity view from the professional duty view. The case where the relationship rests on a mistake tests the second branch because if the relationship is the source of the reason, the reason vanishes when the fact is false, but if it is a background condition for a general reason, the reason might persist, and this separates the realists about relationships from the instrumentalists. We need to flag that the tree cannot fully pull apart the Scheffler prerogative leaf from the Williams integrity leaf if the student is vague on the third branch, because both allow the agent to save the spouse, but the tree forces a split on whether the allocator would do the same, which is the only way to distinguish a right to be partial from a reason that is partial. Finally, if you have to cut the handout down to two questions, you should drop the second branch about the structure of the reason because it is too metaphysical for a second-year seminar and the first and third branches together are sufficient to separate the impartialist, the prerogative holder, and the integrity theorist by focusing on the deliberative moment and the third-personal test. I hope this helps clarify the distinctions for the seminar, and let me know if you want to adjust the wording on the burning building case before we print.
