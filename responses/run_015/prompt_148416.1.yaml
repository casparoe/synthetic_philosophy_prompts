              1.  Reduce threshold to 60% via 60% vote.
              2.  Insert 10-year sunset clause into Art. 28.
              3.  Replace "membership" with "assembly chair" in Art. 28 (framed as housekeeping).
          *   State what the procedure *cannot* settle (value judgments).
          *   No external sources/citations. Grounded in self-amending legal logic.

  2.  **Deconstruct the Legal Logic (Nomic/Self-Reference):**
      *   *The Core Paradox:* Article 28 defines how to change Article 28. If you change Article 28 using Article 28, you must ensure you aren't bypassing the "Reflection Subsection."
      *   *Direct vs. Indirect:* Direct is changing the text of Art. 28. Indirect is changing Art. 5 (who votes) or Art. 19 (quorum) which effectively changes the *operation* of Art. 28 without touching its text.
      *   *The "Reflection Subsection":* This is the entrenchment clause. It says "If you touch the amendment mechanism, go to Convention."
      *   *The Trap:* If the rules for the Convention are *in* Art. 28, and Art. 28 is being suspended or changed, can the Convention ever be convened? (This is a deep Nomic trap, but the prompt asks for a procedure to *identify* when the trigger is pulled, not necessarily solve the metaphysical paradox, though the procedure must flag it).
      *   *Threshold Mutations:* A proposal to lower the bar must meet the *current* bar to be valid. If it doesn't, it's procedurally void.
