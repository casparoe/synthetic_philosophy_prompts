      *   *Irreducible Judgments:* Acknowledge where "intent" vs. "effect" is ambiguous.

  4.  **Refining the Steps (Iterative Process):**
      *   *Critique:* Make sure it distinguishes between "amending Art. 28" and "amending the *mechanism*." The Reflection Subsection triggers on modifying the *mechanism*.
      *   *Refinement:* Step 1 should ask: "Does this proposal alter the text of Article 28?" If Yes -> Go to Step 2. If No -> Go to Step 3 (Indirect effects).
