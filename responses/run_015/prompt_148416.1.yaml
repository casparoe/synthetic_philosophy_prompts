      *   **Requirements:**
          *   Distinguish direct mutations of Art. 28 from indirect loops (e.g., changing membership definition in Art. 5, quorum in Art. 19).
          *   Include tests for threshold mutations (lowering threshold via a vote that doesn't meet current threshold).
          *   Include tests for cosmetic substitutions relocating authority.
          *   Indicate sufficient answers, mandatory halts (referral to Convention), and irreducible judgments.
