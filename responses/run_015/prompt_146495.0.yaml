  Write a sestina exploring this separation. Use exactly these six end-words: law, orbit, error, horizon, bit, and return. The rotation of end-words through the six stanzas must follow the standard sestina pattern (6-1-5-2-4-3, repeating). This deterministic rotation should do structural work: each recurrence of an end-word must appear in a context that shifts its meaning, tracking how fixed rules generate unpredictable outcomes—just as deterministic dynamics amplify divergence. The poem should render the idea accurately enough that a specialist recognizes the argument that determinism does not guarantee predictability, yet it should also stand as good verse for a reader who knows no chaos theory.

  In the final envoi, arrange all six end-words in paired lines, with law and error adjacent on one line and horizon and bit adjacent on another, symbolizing that determinism and the limits of measurement meet at the boundary of knowledge. Do not include citations, references to specific texts, bibliographic notes, or quotation marks drawn from real sources.
