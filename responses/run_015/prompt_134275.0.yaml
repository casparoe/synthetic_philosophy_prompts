      5.  Implication: Human testimony is less "special" than we thought.

  7.  **Final Polish:** Check against "don't sit on the fence." Make sure the conclusion is punchy. Ensure the "intuition drop" is explicit. (The intuition being that human testimony involves a unique normative bond).

      *(Wait, one more thought)*: Is it possible that Ghost Testimony actually *proves* Reductionism right? If the AI hallucinates, we blame the designers (inductive reliability). If a human lies, we blame the human (moral failure). But epistemically, does it matter? If I believe the AI, and it's wrong, my justification was flawed. If I believe the Human, and they are wrong, my justification was flawed.
      *Actually, the strongest argument for Anti-R surviving is that we *do* treat AI testimony with default trust (e.g., GPS, Siri) until given reason not to. We don't calculate probabilities every time we ask a smart speaker. This behavioral fact supports Anti-R.*
