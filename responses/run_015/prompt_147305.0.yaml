answer: |-
  You've correctly identified the rot. The problem is at **(6)**, and your suspicion about a level-shift is exactly right.

  **What (6) gets wrong:** It conflates *personal-level identification* ("I judge that this seen object is the cube I felt") with *sub-personal associative binding* (mechanisms that detect statistical covariation between sensory signals without requiring conceptual recognition). You don't need to already possess the cross-modal concept to build the association; you just need correlated input that learning mechanisms can latch onto.

  **Why the simultaneous probe confirms this:** When the subject holds the object while viewing it, temporal and spatial coincidence provides the correlation signal. Sub-personal mechanisms don't need the subject to *recognize* the link—they just need the link to *exist* in the input stream. The association builds from the bottom up, not the top down.

  **What rejecting (6) costs you:** You owe an account of how sub-personal binding transitions to personal-level identification. But this isn't smuggling in the conclusion—it's just acknowledging that perceptual learning doesn't require the concepts it eventually produces. This is standard in developmental psychology: infants coordinate senses before they have object concepts.

  **What's contested vs. settled:**
  - **Settled empirically:** Project Prakash and similar studies show "no" for immediate identification, "yes" for rapid learning (days/weeks, not never).
  - **Contested:** What the "no" shows—whether it's about amodal concepts, sensory content incommensurability, or just lack of learned associations. Whether there's any innate spatial format remains live.
  - **Contested:** Whether the quick learning implies the mapping was "latent" (supporting something like your opponent's innate horn) or genuinely constructed from correlation.

  Your friend's argument looks like a learning paradox, but it's the same mistake as claiming you can't learn words because you need words to learn words. The bootstrap works at different levels.

  \answer{(6)} Equivocates personal/sub-personal
