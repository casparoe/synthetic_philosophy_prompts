  **A "Screening-Off" Thought Experiment:**
  Construct a model where physical facts $F_{phys}$ and mathematical facts $F_{math}$ both obtain. Show that $P(\text{Belief} | F_{phys}) = P(\text{Belief} | F_{phys} \ \& \ F_{math})$.
  *   If the probability of our having true beliefs is screened off by the physical facts alone, Platonism is explanatorily idle (Nominalism wins).
  *   If the probability *changes* when you include the abstract facts (i.e., the abstract facts do probabilistic work in explaining why we have the beliefs we do), Platonism survives.
  *   **The Mover:** A formal demonstration that abstract facts *cannot* be screened off by physical facts in an evolutionary account of mathematical cognition. Currently, the literature suggests they *can* be screened off. Reversing that result would move me most.

  **Diagnosis of Disagreement (You vs. Supervisor)**

  You (0.3) and your Supervisor (0.7) are not disagreeing about $P(\text{Link})$ or $P(\text{Mult})$. You both likely agree causal theories of knowledge are too narrow and Structuralism handles Multiplicity.

  **You disagree on $P(\text{No Theft})$ (Term 4).**

  *   **You** see the explanation of reliability as separable from the ontology. You think: "The system works because of physical constraints; the numbers are just a description." Therefore, the numbers are otiose.
  *   **Your Supervisor** likely sees the ontology as *constitutive* of the constraint. They think: "The physical system is constrained *because* the abstract structure exists and instantiates in the physical." They believe the abstract object is a necessary relata in the grounding relation that explains the reliability.

