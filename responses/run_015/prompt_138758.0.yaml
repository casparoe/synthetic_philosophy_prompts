  Look, I'll bite the bullet straight away: post-stroke Bernard has less moral worth, strictly speaking none of the distinctive kind we're debating, because his will is now determined by inclination rather than the moral law. I know that sounds cold, but remember moral worth isn't a measure of how nice the outcome is or how much pain the agent suffers, it's about the autonomy of the will and the source of determination. Pre-stroke Bernard acted from freedom, subordinating his hatred to the law, whereas post-stroke Bernard is effectively pushed by a new causal chain installed by the stroke, making him a slave to this new aversion to loneliness just as he was previously a slave to his own comfort. You say he's tracking the right-making feature, but for us the right-making feature isn't the empirical fact of loneliness itself, it's the rational requirement to aid a brother in need, and only the pre-stroke Bernard acted because reason commanded it rather than because his feelings shoved him. Regarding your counterfactual, the dutiful agent isn't insensitive to the need but sees it as grounding an obligation, whereas the sympathetic agent acts because the need hurts them, which is still self-referential inclination even if it feels other-directed. So yes, the post-stroke version is more pleasant and perhaps more reliable, but the moral esteem belongs to the grind, because that's where the good will shines through the obscuring cloud of inclination.
