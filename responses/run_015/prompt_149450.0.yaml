answer: |-
  # SENTENCING INTEGRITY OFFICE: AUDIT PROCEDURE (SIO-AP-01)

  **Purpose:** To certify proposed sentences (>12 months) against backward-looking culpability limits (Culpability Corridor) and forward-looking statutory efficacy targets (Risk-Reduction Floor).
  **Time Limit:** 30 Minutes.
  **Authority:** Analysts may Certify or Reject. Analysts must Escalate conflicts or ambiguities.

  ---

  ## PART I: THE AUDIT WORKFLOW

  ### Step 1: Data Integrity and Ambiguity Check
  **Question 1.1:** Is the Offense-Gravity Index (OGI 1–10) derived from statutory harm tables and verified actual harm without variance greater than 10%?
  *   **Sufficient Answer:** Yes, verified by attached forensic report.
  *   **Insufficient Answer:** No, reports conflict, or harm model varies by >10%.
  *   **Action:** If Insufficient, **HALT**. Escalate to **Clinical-Legal Referee**. Document specific factual disputes (mental state or harm magnitude). Do not proceed to Step 2.

  **Question 1.2:** Is the Mental-State Tier (Intentional, Reckless, Negligent, Strict) clearly adjudicated in the conviction record?
  *   **Sufficient Answer:** Yes, tier matches conviction elements.
  *   **Insufficient Answer:** No, tier is ambiguous, diffuse (corporate), or contested.
  *   **Action:** If Insufficient, **HALT**. Escalate to **Clinical-Legal Referee**. Document whether ambiguity stems from individual vs. collective agency or clinical capacity. Do not proceed to Step 2.

  **Question 1.3:** Are Recidivism-Risk Scores and Rehabilitation-Time Estimates present in the file?
  *   **Sufficient Answer:** Yes, validated instruments used.
  *   **Insufficient Answer:** No, data missing.
  *   **Action:** If Insufficient, apply **Conservative Default** (assume higher risk/longer rehab) for RRF calculation. Proceed to Step 3.

  ### Step 2: Culpability Corridor (CC) Verification
  **Question 2.1:** Has the CC Lower Bound and Upper Bound been calculated using the OGI and Mental-State Tier?
  *   **Sufficient Answer:** Yes, bounds are explicit (e.g., 2–5 years).
  *   **Action:** Verify mitigation credits (e.g., voluntary restitution) are applied *within* the CC calculation, not as an external subtraction.
  *   **Handling (ii) Restitution:** If full voluntary restitution is noted, confirm it was processed as a mitigation credit adjusting the CC bounds. Do not reduce the proposal below the CC Lower Bound based on restitution alone.

  **Question 2.2:** Does the CC exist as a valid range (Lower Bound < Upper Bound)?
  *   **Sufficient Answer:** Yes.
  *   **Action:** Proceed to Step 3.
  *   **Insufficient Answer:** No (e.g., mitigation floor exceeds aggravation cap).
  *   **Action:** **HALT**. Escalate to **Values Panel**. Document statutory contradiction.

  ### Step 3: Risk-Reduction Floor (RRF) Verification
  **Question 3.1:** Has the RRF been computed based on specific deterrence, general deterrence, and incapacitation targets?
  *   **Sufficient Answer:** Yes, single minimum value derived (e.g., 3 years).
  *   **Action:** Proceed to Step 4.

  ### Step 4: Comparative Audit and Conflict Flagging
  **Question 4.1:** Is the Proposed Sentence ≥ CC Lower Bound AND ≤ CC Upper Bound?
  *   **Yes:** Proceed to 4.2.
  *   **No (Proposal < CC Lower):** **FLAG CONFLICT TYPE V**. Proceed to Step 5 (Escalation).
  *   **No (Proposal > CC Upper):** **REJECT**. Document violation of backward-looking culpability limits. End Audit.

  **Question 4.2:** Is the Proposed Sentence ≥ RRF?
  *   **Yes:** **CERTIFY**. Document compliance with both CC and RRF. End Audit.
  *   **No (Proposal < RRF):** **REJECT**. Document failure to meet statutory efficacy targets. End Audit.

  **Question 4.3:** (Conflict Check) Does the RRF value exceed the CC Upper Bound?
  *   **Yes:** **FLAG CONFLICT TYPE III**. Proceed to Step 5 (Escalation).
  *   **No:** Proceed to Step 5.

  ### Step 5: Disposition and Escalation
  **Rule 5.1 (Certification):** Issue Certification only if Step 4.1 = Yes AND Step 4.2 = Yes.
  **Rule 5.2 (Rejection):** Issue Rejection if Proposal > CC Upper OR Proposal < RRF (unless Conflict Type III exists).
  **Rule 5.3 (Values Panel Escalation):** Required for:
  *   **Conflict Type III:** RRF > CC Upper Bound. (Efficacy requires more than Desert allows).
  *   **Conflict Type V:** Proposal < CC Lower Bound but ≥ RRF. (Efficacy met, but Desert violated).
  *   **Action:** Complete **Values Panel Hand-off Form**. Do not recommend a sentence. State only the numerical conflict.
  **Rule 5.4 (Clinical-Legal Referee Escalation):** Required for Step 1 Failures.
  *   **Action:** Complete **Referee Hand-off Form**. List specific factual ambiguities blocking OGI or Mental-State Tier assignment.

  ---

  ## PART II: CASE APPLICATIONS

  ### Case A: Intentional Fraud with Restitution
  *   **Inputs:** OGI 7, Intentional, Restitution Made, Low Risk. Proposal 18 months.
  *   **Parameters:** CC = 2.5 to 6 years (includes restitution credit). RRF = 1 year.
  *   **Audit Flow:**
      1.  **Step 1:** Data intact. Mental state clear. Proceed.
      2.  **Step 2:** CC Verified (2.5–6 years). Restitution credit already applied to bounds.
      3.  **Step 3:** RRF Verified (1 year).
      4.  **Step 4.1:** Is Proposal (1.5 years) ≥ CC Lower (2.5 years)? **NO.**
      5.  **Step 4.2:** Is Proposal (1.5 years) ≥ RRF (1 year)? **YES.**
      6.  **Step 4.3:** Conflict Check. RRF (1) does not exceed CC Upper (6).
      7.  **Step 5:** **FLAG CONFLICT TYPE V**.
  *   **Disposition:** **ESCALATE TO VALUES PANEL.**
  *   **Documentation Required:** Analyst must document that the proposal satisfies forward-looking efficacy (RRF) but violates the backward-looking culpability minimum (CC). The analyst must explicitly note that the CC bounds *already include* the mitigation for full restitution. The analyst cannot authorize the sentence based on the intuition that restitution cancels prison time; the CC lower bound represents the minimum deserved punishment regardless of restitution.
  *   **Result:** No Certification. No Rejection. Hand-off to Values Panel to decide if efficacy targets can override desert minimums in restitution cases.

  ### Case B: Reckless Assault (Repeat Offender)
  *   **Inputs:** OGI 9, Reckless, High Risk. Proposal 10 years.
  *   **Parameters:** CC = 4 to 8 years. RRF = 10 years.
  *   **Audit Flow:**
      1.  **Step 1:** Data intact. Mental state clear. Proceed.
      2.  **Step 2:** CC Verified (4–8 years).
      3.  **Step 3:** RRF Verified (10 years).
      4.  **Step 4.1:** Is Proposal (10 years) ≤ CC Upper (8 years)? **NO.** (Immediate Reject condition triggered, but conflict check takes precedence).
      5.  **Step 4.3:** Does RRF (10 years) exceed CC Upper Bound (8 years)? **YES.** **FLAG CONFLICT TYPE III.**
      6.  **Step 5:** **ESCALATE TO VALUES PANEL.**
  *   **Disposition:** **ESCALATE TO VALUES PANEL.**
  *   **Documentation Required:** Analyst must document the impossibility of satisfying both statutory commitments. The minimum sentence required for public safety/incapacitation (RRF) exceeds the maximum sentence proportionate to the offender's culpability (CC).
  *   **Values Panel Question:** The Panel must resolve whether statutory efficacy targets (incapacitation) may justifiably exceed backward-looking culpability limits when risk is high. The analyst does not decide this.

  ### Case C: Corporate Chemical Release
  *   **Inputs:** Corporate Negligence, 3 Managers, Disputed Mental State (Reckless vs. Negligent), Disputed Harm (3x variance).
  *   **Audit Flow:**
      1.  **Step 1.1:** Is OGI derived without variance >10%? **NO.** (Harm assessments vary by factor of three).
      2.  **Step 1.2:** Is Mental-State Tier clearly adjudicated? **NO.** (Disagree on Reckless vs. Negligent; diffuse authority).
      3.  **Action:** **HALT AT STEP 1.**
  *   **Disposition:** **ESCALATE TO CLINICAL-LEGAL REFEREE.**
  *   **Documentation Required:** **Referee Hand-off Form.**
      *   **Item 1:** Specify the forensic disagreement on exposure models preventing OGI fixation.
      *   **Item 2:** Specify the agency ambiguity (collective vs. individual) preventing Mental-State Tier assignment.
      *   **Item 3:** Request adjudication on whether corporate diffusion mitigates mental-state tier or requires aggregate OGI calculation.
  *   **Result:** The procedure breaks at Step 1. No CC or RRF can be calculated. No Values Panel involvement yet; factual predicates are missing.

  ---

  ## PART III: STRUCTURAL LIMITATIONS

  1.  **Inability to Resolve Normative Conflicts:** The procedure cannot mathematically or logically resolve a situation where the Risk-Reduction Floor exceeds the Culpability Corridor (Case B). It identifies the conflict but cannot determine whether public safety (forward-looking) should override proportional desert (backward-looking). This requires a values judgment outside the analyst's authority.
  2.  **Inability to Adjudicate Clinical-Legal Facts:** The procedure cannot determine mental state or harm magnitude when evidence is ambiguous or contested (Case C). It treats these as binary inputs (Verified/Not Verified). It cannot substitute for a judicial or clinical determination of recklessness versus negligence or the validity of competing forensic models.
  3.  **Inability to Individualize Statistical Risk:** The procedure relies on validated recidivism-risk scores to set the RRF. It cannot determine whether a specific statistical probability of reoffending justifies a specific term of imprisonment for *this* individual regarding moral desert. It treats the risk score as a statutory input for efficacy, not as a claim of individual culpability.
