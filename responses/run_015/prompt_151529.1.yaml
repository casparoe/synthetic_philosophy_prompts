answer: |-
  You are not being inconsistent. In fact, your intuitions are tracking a very specific and well-recognized philosophical distinction: the difference between **conventions** (folkways) and **moralized norms** (mores).

  Your gut is applying a sophisticated filter to these scenarios. You aren't just asking "Is this a rule?" You are implicitly asking, "What happens to the social fabric if I break this, and what does my breaking it say about my regard for others?"

  Here is the principle behind your verdicts, broken down into the three "switches" that turn a local custom into a moral obligation.

  ### The Core Principle: The Threshold of Reciprocal Regard
  A social rule remains a mere **custom** when it is about coordination and comfort. It becomes a **moral rule** when violating it undermines fairness, signals active disrespect, or risks harm to vulnerable parties.

  Your intuition flips from "awkward" to "wrong" based on three specific switches:

  #### 1. The Fairness/Free-Rider Switch
  *   **The Rule:** Queueing in London.
  *   **Why it shifts:** Queueing is a cooperative system. Everyone waits their turn based on the promise that others will do the same.
  *   **Your Verdict:** Accidentally cutting is a mistake (no moral blame). Cutting on purpose is **free-riding**. You are taking a benefit (time saved) that you denied others. That violates fairness, which is a universal moral value, not just a British custom.
  *   **Principle:** *When a custom exists to ensure fair distribution of a scarce resource (space, time, service), breaking it intentionally becomes a moral violation.*

  #### 2. The Knowledge and Intent Switch
  *   **The Rule:** Eating with the left hand in India; Sitting on the bus in Finland.
  *   **Why it shifts:**
      *   **India:** As a visitor, you lack knowledge. You cannot intend disrespect if you don't know the code. However, once you are *told*, ignorance is no longer an excuse. Continuing to use the left hand becomes an act of **willful disregard**.
      *   **Finland:** Sitting next to someone is weird, but neutral. Sitting there *to mock* the rule changes the action from "social clumsiness" to "aggression." You are using your body to signal contempt for the local community.
  *   **Your Verdict:** Ignorance excuses; defiance condemns.
  *   **Principle:** *A custom becomes moralized when the agent possesses knowledge of the rule and chooses to violate it to signal superiority or contempt.*

  #### 3. The Relational and Vulnerability Switch
  *   **The Rule:** Jaywalking in Berlin (alone vs. with a kid); Train noise vs. Refusing food.
  *   **Why it shifts:**
      *   **The Kid:** Jaywalking alone is a risk you take for yourself. Jaywalking with a child is **modeling**. You have a duty of care to not teach a vulnerable person to disregard safety norms. You are exporting risk to their future behavior.
      *   **Train vs. Food:** This is your toughest dilemma.
          *   **Train:** This is a *public nuisance*. It annoys strangers. It's low-level harm.
          *   **Food:** This is a *relational rejection*. In cultures where food is sacred, refusing it isn't just "I'm full"; it is "I reject your hospitality and our bond."
  *   **Your Verdict:** You feel the food refusal is worse. You are right.
  *   **Principle:** *Violations that damage specific interpersonal relationships (host/guest) carry more moral weight than violations that cause diffuse public annoyance (noise), because the former attacks human dignity and connection, while the latter attacks comfort.*

  ### Applying the Principle to Your Unsettled Cases

  **The Parking Gap**
  *   **Analysis:** Is this about fairness or safety? In small towns, leaving a gap often allows other cars to maneuver out. If you block someone in, you are restricting their freedom of movement (harm/fairness). If it's just "we like big gaps," it's a custom.
  *   **Verdict:** If blocking the gap traps others, it's moral (don't trap people). If it's just aesthetic, it's custom.

  **The "Urgent Work" Call on the Train**
  *   **Analysis:** You mentioned taking a loud call for urgent work. This introduces a **Necessity Defense**.
  *   **Verdict:** Moral rules often have hierarchies. Livelihood/Safety > Comfort. If the call is truly urgent (e.g., a medical emergency or preventing a disaster), the moral necessity overrides the social convention of silence. If it's just "urgent work" that could have been an email, you are prioritizing your convenience over public comfort, which slides back toward rudeness.

  ### The Question of Genuine Ignorance
  You asked: *"What does it say about the case where a visitor breaks a rule they genuinely didn't know existed?"*

  Philosophers call this **Invincible Ignorance**.
  *   **Moral Blame:** Zero. You cannot be morally culpable for what you could not reasonably know.
  *   **Obligation to Repair:** High. Once you realize the mistake, the moral obligation shifts to *remediation* (apologizing, correcting behavior).
  *   **The Trap:** If you remain ignorant *on purpose* (e.g., "I'm a tourist, I don't have to learn"), that becomes **Vincible Ignorance**, which is morally blameworthy. It suggests you think your time is more valuable than the locals' dignity.

  ### Summary of Your Internal Algorithm
  You aren't inconsistent. You are weighing **Impact** and **Attitude**.

  1.  **Impact:** Does this hurt someone, cheat someone, or endanger someone? (Queueing, Jaywalking with kid).
  2.  **Attitude:** Is this accidental, necessary, or defiant? (Tipping vs. Mocking).
  3.  **Relationship:** Is this anonymous public space or a personal bond? (Train vs. Dinner).

  **The Verdict:**
  *   **Tokyo Tipping:** Custom (No harm, no unfairness).
  *   **London Queueing:** Moral (Fairness).
  *   **Berlin Jaywalking:** Custom alone / Moral with kid (Duty of care).
  *   **India Eating:** Custom initially / Moral after warning (Respect).
  *   **Finland Bus:** Custom normally / Moral if mocking (Intent).
  *   **Train vs. Food:** Food is more moral (Relational harm > Public comfort).

  Your gut is working perfectly. It distinguishes between rules that keep society *running* (customs) and rules that keep society *just and kind* (morals). The moment a custom is weaponized to show disrespect or unfairness, your brain correctly flags it as a moral issue.
