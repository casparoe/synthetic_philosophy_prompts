prompt: |-
  ok so i've been thinking about whether all these little social rules are actually moral rules or just local customs, and my gut is all over the place. here are my verdicts and i want to know if there's one principle behind them, or if i'm just being inconsistent.

  - in tokyo you don't tip taxi drivers and it feels wrong to do it, but if i'm visiting and i tip anyway because back home it's polite, is that a moral mistake or just awkward? i think it's not a moral mistake, just clumsey.
  - in london people queue for the bus religously. if i'm a tourist and i accidentally cut in because i didn't see the line, that feels like a minor wrong, not just embarrassing. but if i do it on purpose? way worse.
  - jaywalking in berlin when the light is red and there's no car: locals don't, and i think if i do it i'm not breaking a moral rule, just ignoring local etiquette. but if i do it with my kid and they copy me? then it feels morally questionable.
  - in some parts of india people eat with their right hand only. if i use my left as a visitor, i think that's disrespectful but not like i violated a universal duty. but if i do it at a formal dinner after being told? then it crosses into wrong.
  - there's this weird convention in finland where you're not supposed to sit next to someone on an empty bus. if i sit next to a stranger there, i think it's socially weird but not immoral. however, if i do it to mock the rule? then it's rude in a moralized way.
  - leaving a gap when parking on the street in some small towns? i honestly have no idea if that's moral or not.

  i keep going back and forth on this one: in japan it's rude to talk loudly on the train, but also in some cultures it's rude to refuse food offered. if i'm on a train in tokyo and i take a loud call because it's urgent work, is that worse than refusing food at a host's table in a culture where that's insulting? i feel like the train one is less bad even though both break local norms.

  so what's the principle? is it about harm? about respect for local autonomy? about whether the rule protects something basic? and what does it say about the case where a visitor breaks a rule they genuinely didn't know existed?
