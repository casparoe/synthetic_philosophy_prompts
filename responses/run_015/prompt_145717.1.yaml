answer: |-
  To accommodate your six verdicts while resolving the tension in Case 6, you need a principle that shifts the locus of desert from *metaphysical authorship* (who caused the psychology) to *functional agency* (how the psychology operates within the agent). Your intuitions are fundamentally **Compatibilist**, specifically aligning with a hybrid of **Harry Frankfurt's identification theory** and **Fischer & Ravizza's reasons-responsiveness**.

  Here is the coherent principle, its application, the prediction for the new case, and the necessary adjustment for full coherence.

  ### The Principle: Integrated Agency

  **Retributive desert is warranted if and only if an action flows from a motivational mechanism that satisfies two conditions:**

  1.  **Narrative Integration (The Identification Clause):** The agent identifies with the mechanism driving the action as part of their practical identity (i.e., they do not experience it as an alien compulsion, foreign body, or external force).
  2.  **Reasons-Responsiveness (The Capacity Clause):** The mechanism retains the capacity to recognize and react to sufficient moral reasons to the contrary (i.e., the agent could have done otherwise had the moral stakes been high enough).

  **Retributive desert is mitigated or extinguished** if either condition is compromised by pathology, developmental deprivation, or structural diffusion.

  ---

  ### Application to Your Cases

  *   **Case 1 (Robbery):** **Full Desert.** The mechanism (greed/planning) is *Integrated* (the agent owns the goal) and *Responsive* (they planned it, implying they could have chosen not to).
  *   **Case 2 (Lesion):** **No Desert.** Fails *Capacity*. The lesion physically destroys inhibitory control; the mechanism is not reasons-responsive.
  *   **Case 3 (AI):** **No Desert.** Fails *Integration*. An AI has no narrative self to identify with motives; it is a category error to treat it as a moral agent.
  *   **Case 4 (Neglect):** **Diminished Desert.** Fails *Capacity* partially. Severe neglect stunts the development of moral reasoning, reducing reasons-responsiveness. It does not necessarily destroy *Integration* (the agent may own the survival motive), but the *Capacity* to understand moral prohibitions is impaired.
  *   **Case 5 (Corporation):** **No Individual Desert.** Fails *Integration* at the individual level. No single executive identifies with the *harm* (only their slice of the process), and the distributed structure diffuses *Capacity* (no one person could have stopped the whole). Organizational penalties address the system, not the individual soul.
  *   **Case 6 (Addict vs. Executive):** **Resolved.**
      *   **Addict:** Fails *Integration* (craving is experienced as alien/overwhelming) and likely fails *Capacity* (compulsion overrides reasons). Verdict: **No/Low Desert.**
      *   **Executive:** Passes *Integration* (status anxiety is ego-syntonic; they rationalize and own the entitlement) and Passes *Capacity* (they could have responded to the threat of prison or moral norms). Verdict: **Full Desert.**
      *   *Resolution of Tension:* The fact that both psychologies are "unchosen" is irrelevant. Desert tracks current functional agency, not ultimate origin.

  ---

  ### Prediction: The Implant Case

  **Scenario:** A person voluntarily receives a neurochemical implant for therapeutic reasons (e.g., to treat depression). It malfunctions due to an unforeseen technical error, causing violent behavior.

  **Verdict:** **No Retributive Desert.**

  **Reasoning:**
  1.  **Integration:** While the *implant* was voluntarily accepted, the *malfunction* is not integrated. The violence stems from a technical failure, not the agent's values or identity. It is functionally equivalent to a seizure or the frontal-lobe lesion in Case 2.
  2.  **Capacity:** The malfunction bypasses reasons-responsiveness. The agent cannot "respond to reasons" not to be violent if the violence is chemically forced by the error.
  3.  **Caveat:** If the agent knew of a significant risk of violent malfunction and accepted it recklessly, they might deserve punishment for *negligence* (the decision to implant), but not for the violent act itself. Assuming unforeseeable malfunction, desert is zero. Protective separation is warranted, but not retributive suffering.

  ---

  ### Coherence Check: Which Verdict Must Be Overturned?

  To maintain strict coherence with **Case 2 (Lesion)** under the *Integrated Agency Principle*, you must adjust your verdict on **Case 4 (Neglect)**.

  **The Conflict:**
  In Case 2, you assign **zero desert** because a biological lesion destroys inhibitory control (Capacity). In Case 4, you assign **non-zero desert** despite "no moral education." If moral education is the software required for moral Reasons-Responsiveness, then "no moral education" implies the Capacity Clause is as broken as the lesion in Case 2.

  **The Adjustment:**
  You must overturn the claim that desert is "not zero" **if** the description "no moral education" is literal.
  *   **Option A (Strict Coherence):** If the neglect truly prevented the formation of moral concepts, the verdict must shift to **Zero Desert** (matching Case 2). The agent is a victim of developmental pathology, not a moral wrongdoer.
  *   **Option B (Preserve Verdict):** If you wish to keep "not zero," you must amend the case description to "severely *deficient* moral education." This acknowledges that *some* reasons-responsiveness remains, distinguishing it from the total incapacity of the lesion.

  **Recommendation:** Adopt **Option B**. It preserves your intuition that some agency remains in neglected adults (unlike acute lesion patients) while acknowledging the mitigation. However, you must explicitly reject the intuition in Case 6 that "unchosen psychological states" mitigate desert. To keep the Executive's full desert, you must accept that **ultimate authorship is not required for responsibility.** If you cling to the idea that "unchosen states" undermine desert, Case 6 (Executive) and Case 1 (Robbery) collapse, and you become a Hard Incompatibilist (like Caruso), forcing you to overturn almost all your verdicts.

  **Summary of Required Shift:**
  1.  **Case 4:** Clarify that capacity is *impaired*, not *absent* (or accept Zero Desert).
  2.  **Case 6:** Abandon the premise that causal determination by unchosen states is a mitigating factor. Trust the *Integration* and *Capacity* tests instead.
