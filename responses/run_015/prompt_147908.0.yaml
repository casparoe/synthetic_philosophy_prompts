answer: |-
  This is a piercing observation that cuts to the core of a major inconsistency in modern animal welfare science and policy. You have identified a gap between **regulatory rhetoric** (science-based, holistic welfare) and **operational reality** (vertebrate-centrism, economic pragmatism).

  The split you describe isn't accidental; it reveals a specific, often unarticulated ethical framework currently governing European aquaculture. Here is an analysis of the theory hiding in that split, its consistency with scientific claims, and what a truly consistent audit would look like.

  ### 1. The Hidden Theory: Phylogenetic Hierarchism & Pragmatic Utilitarianism

  The certification schemes are not operating on a single theory of moral status. They are operating on a hybrid of three conflicting frameworks:

  **A. Phylogenetic Hierarchism (The "Vertebrate Bias")**
  This is the strongest driver. Despite the EU's 2021 recognition of decapod crustaceans as sentient beings, the *operational* theory of welfare still relies on neuroanatomical similarity to humans.
  *   **The Logic:** Salmon have a dorsal pallium and complex neurochemistry similar to mammals; therefore, they have "affective states" (fear, joy, stress). Crustaceans have distributed ganglia and no cortex; therefore, they are presumed to have **nociception without pain** (reflex without feeling).
  *   **The Split:** This allows auditors to measure "positive welfare" (play, exploration) in salmon while treating shrimp as biological machines where only function (growth, survival) matters. It presupposes sentience is not binary, but *graded*, and crustaceans fall below the "welfare threshold."

  **B. The "Black Box" Problem (Methodological Behaviorism)**
  For salmon, we assume we can read their internal state through behavior (ethology). For shrimp, the industry retreats to methodological behaviorism: "We cannot see them swim individually in turbid water, so we cannot measure welfare; we can only measure biomass output."
  *   **The Logic:** If a behavior cannot be easily quantified, it is excluded from the welfare model.
  *   **The Split:** Salmon welfare is **experience-based**; shrimp welfare is **production-based**.

  **C. Economic Utilitarianism (Tractability)**
  This is the unspoken engine. Salmon are high-value, low-volume animals raised in clear water pens where cameras work. Shrimp are low-margin, high-volume animals raised in dense, turbid ponds where individual observation is impossible.
  *   **The Logic:** Welfare measures are adopted only when the cost of measurement is lower than the market premium gained.
  *   **The Split:** It is economically tractable to audit salmon behavior. It is economically prohibitive to audit individual shrimp behavior. Therefore, the "welfare" metric defaults to survival (which affects profit directly).

  ### 2. Is This Consistent with "Science-Based" Claims?

  **No. It is scientifically lagging.**

  *   **The Sentience Consensus:** The London School of Economics review (2021), commissioned by the UK government (and influential in the EU), concluded there is very strong evidence of sentience in decapod crustaceans. They experience pain and distress.
  *   **The Chilling Contradiction:** You noted the rapid chilling vs. live-boiling ban. This is the clearest evidence of inconsistency.
      *   *Restaurant Context:* Public outrage drives policy. Live-boiling lobsters is visible and visceral. Bans are implemented based on the *precautionary principle* regarding pain.
      *   *Farm Context:* Rapid chilling (thermal shock) induces the same nociceptive and stress response as boiling, but it happens out of sight.
      *   *The Verdict:* If the scheme were truly science-based on *sentience*, the method of killing would matter more than the visibility of the act. Allowing thermal shock for shrimp while banning boiling for lobsters implies that **visibility drives policy more than physiology.**

  *   **Positive Welfare:** The focus on "play" in salmon is cutting-edge welfare science (the "Five Domains" model). Excluding crustaceans from this model implies the industry believes crustaceans are incapable of positive states. While harder to prove, recent studies on environmental enrichment in crabs (preference for shelters) suggest they *do* have preferences. Ignoring this violates the "science-based" claim.

  ### 3. What Would Change in the Audit?

  If the certification schemes applied the **same welfare logic** to crustaceans that they apply to salmon (acknowledging sentience, affective states, and natural living), the audits would undergo a radical transformation.

  **A. Pre-Harvest & Stocking**
  *   **Current:** Stocking density based on oxygen saturation and survival.
  *   **New Logic:** Stocking density based on **behavioral interference**. If shrimp are cannibalizing or hiding excessively due to crowding, density is too high, even if survival is 90%.
  *   **Enrichment:** Salmon get current variation; shrimp would require **substrate complexity** (hiding places, structures) to allow for natural territorial and sheltering behaviors.

  **B. Monitoring Metrics**
  *   **Current:** Survival rate, FCR (Feed Conversion Ratio).
  *   **New Logic:** **Behavioral Budgets.** Even in turbid water, acoustic monitoring or underwater imaging could track activity levels, nocturnal vs. diurnal activity shifts (stress indicator), and aggregation patterns.
  *   **Physiological Markers:** Routine sampling for stress hormones (crustacean hyperglycemic hormone) rather than just pathogen loads.

  **C. Harvest & Slaughter**
  *   **Current:** Thermal shock (ice slurry) allowed.
  *   **New Logic:** **Mandatory Stunning.** Just as salmon require percussive or electrical stunning, crustaceans would require electrical stunning (e.g., Crustastun) or rapid chemical anesthesia *before* temperature reduction. Thermal shock would be classified as inhumane slaughter.

  **D. Positive Welfare**
  *   **Current:** Non-existent.
  *   **New Logic:** **Preference Testing.** Audits would require evidence that the environment matches the animal's preferences (e.g., do they choose the dark or light? The sand or the rock?) rather than just what keeps them alive.

  ### Summary: The "Moral Schism"

  The theory hiding in the split is **Phylogenetic Prejudice masked as Tractability.**

  It presupposes that welfare is a resource to be allocated based on how much an animal resembles a human (neuroanatomically) and how much profit margin exists to pay for its measurement. It is not consistent with a rigorous "science-based" label because it ignores the latest consensus on invertebrate sentience to maintain supply chain efficiency.

  To fix it, the industry would have to admit that **shrimp are not biomass, but individuals,** which would likely collapse the economic model of industrial shrimp farming. The audit discrepancy exists not because the science is unclear, but because the cost of applying the science is too high for the commodity price of shrimp.

  **The audit isn't measuring welfare; it's measuring the price the consumer is willing to pay for a clear conscience.** Salmon buyers pay for "happy fish"; shrimp buyers pay for cheap protein, and the certification schemes are structured to validate that transaction.
