answer: |-
  In a certified automated distribution centre, a workforce optimisation algorithm generates shift rosters to maximise throughput within Health and Safety Executive guidelines. The system's risk model explicitly predicts a statistically acceptable rate of fatigue-related injuries under peak load, a threshold authorised by the board as part of standard operational risk. The floor manager reviews the roster, sees the fatigue warning, but follows binding protocol to approve it because overriding the system requires evidence of infrastructure failure, which is absent. When a forklift operator, exhausted from a compliant sixth consecutive shift, collides with a pedestrian, the injury was statistically expected, the system functioned precisely to specification, and the manager fulfilled their contractual duty, yet the company accepts vicarious liability without any individual admitting moral fault.

  The floor manager fails the condition of **fair opportunity to have done otherwise**, as binding protocol removed the legitimate option to reject the roster. The software developer fails on **causal contribution**, because writing the code is too remote from the specific instantiation of harm to count as a direct cause. The risk executive fails on **control**, since setting the risk parameters does not equate to controlling the algorithm's specific scheduling decisions in real-time. The regulator fails on **foresight**, as they cannot anticipate the specific private risk calculations of every deployed firm.

  Strict enterprise liability treats the harm as a cost of business, compensating the victim without assigning moral blame. The 'gap and redesign' approach accepts the moral vacuum and mandates systemic alteration to prevent recurrence. The moral crumple zone unfairly assigns full blame to the floor manager to satisfy the psychological need for a culprit. The case genuinely generates a responsibility gap; none of the three treatments dissolve it, though strict liability mitigates the financial consequence. The single feature doing the work is the **algorithmic mediation of known risk**, which decouples policy setting from specific outcome execution. If you remove this feature and return to human rostering, the manager possesses both control and opportunity, collapsing the gap. The theorist who comes out worst is the proponent of the Trace Principle, who argues that responsibility always traces back to the human who set the parameters. They will attack the scenario by claiming the executive's authorisation of the risk threshold constitutes sufficient control over the outcome, arguing that hiding behind the algorithm's autonomy is merely a guise for wilful ignorance, thereby denying the gap exists at all.
