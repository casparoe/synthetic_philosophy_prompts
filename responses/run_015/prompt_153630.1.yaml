answer: |-
  # JOINT STATEMENT ON THE VARIETIES OF FREE WILL WORTH WANTING

  **Signatories:** The Narrative-Integrationist (NI) and The Moment-of-Choice Pluralist (MCP)
  **Date:** October 26, 2023
  **Subject:** Findings from Adversarial Collaboration on Free Will and Moral Accountability

  Following a period of good-faith adversarial collaboration, we submit the following document outlining our areas of convergence, precise points of divergence, and the specific empirical or conceptual cruxes that remain unresolved. Our goal is not to force a premature synthesis, but to map the topology of our disagreement to facilitate future inquiry.

  ### I. AGREED CLAIMS

  We jointly affirm the following propositions as the foundation of our continued discourse:

  1.  **Ordinary-Language Polysemy:** We agree that the ordinary-language concept of "free will" is not a natural kind term with a single, fixed referent. It clusters around intuitions regarding control, alternative possibilities, and authorship. Consequently, philosophical stipulation is required to make the concept precise enough for rigorous analysis.
  2.  **The Irrelevance of Mere Indeterminacy:** We agree that quantum-level indeterminacy, *in isolation*, does not constitute free will. The introduction of random noise into a decision-making process does not enhance agentive control or moral accountability. For the MCP, indeterminacy must be harnessed by the agent; for the NI, indeterminacy is secondary to structural coherence.
  3.  **Possession vs. Exercise:** We distinguish between the *capacity* for free will and the *exercise* of free will. An agent may possess the requisite machinery for free will (whether narrative or causal) but fail to exercise it due to ignorance, intoxication, or negligence. Moral accountability tracks the exercise, but the metaphysical status tracks the possession.
  4.  **The Negation of Coercion:** We agree that standard defeating conditions—such as direct coercion, hypnosis, or pathological compulsion—negate free will under both our definitions. A gun to the head disrupts narrative integrity (NI) and causally fixes the outcome (MCP).
  5.  **The Pragmatic Stake:** We agree that the primary reason "free will is worth wanting" is to ground a coherent practice of moral accountability, praise, and blame. If a definition of free will renders moral responsibility impossible or unintelligible, it fails the pragmatic test.
  6.  **Naturalism:** We agree that free will, if it exists, must be compatible with a naturalistic understanding of the world. We reject appeals to non-physical souls or supernatural causation as explanatory mechanisms.

  ### II. DISAGREEMENTS TABLE

  The following table isolates the core theoretical divergences. The wording in each column has been vetted by the respective signatory as an accurate representation of their position.

  | Issue | Narrative-Integrationist (NI) Position | Moment-of-Choice Pluralist (MCP) Position | Nature of Divergence |
  | :--- | :--- | :--- | :--- |
  | **Core Thesis** | Free will consists in a diachronic capacity to maintain, revise, and endorse one's values across counterfactual life-branches, ensuring actions flow from a coherent self-narrative open to reflective revision. | Free will requires only that, at the point of decision, more than one future is genuinely open to the agent in a manner not fully fixed by prior causal states, irrespective of long-term narrative coherence. | **Structural vs. Causal:** NI locates FW in the temporal structure of the self; MCP locates FW in the causal structure of the event. |
  | **Necessity of Narrative** | Long-term narrative coherence is a *necessary condition* for free will. An agent without a coherent, revisable self-concept lacks the authorship required for FW. | Long-term narrative coherence is *contingent*. An agent may possess FW in a specific moment even if their life lacks coherence, integration, or long-term values. | **Necessary vs. Optional:** NI views narrative as constitutive; MCP views it as decorative or secondary. |
  | **Alternative Possibilities** | "Could have done otherwise" is analyzed counterfactually: "I would have done otherwise *if* I had chosen differently based on my reflective values." | "Could have done otherwise" is analyzed categorically: "I could have done otherwise *even if* all prior causal states remained identical." | **Conditional vs. Categorical:** NI accepts a compatibilist reading of ability; MCP requires a libertarian reading of causal openness. |
  | **The Locus of Control** | Control is a property of the *person* over time (self-constitution). | Control is a property of the *will* at the moment of choice (causal origination). | **Diachronic vs. Synchronic:** NI emphasizes the history of the agent; MCP emphasizes the metaphysics of the instant. |

  ### III. CRUXES AND TEST CASES

  We have identified three specific cruxes. Resolving these would move at least one party toward the other's position or clarify that the dispute is non-negotiable. For each crux, we specify the sub-question, the agreed-upon relevant hypothetical, and our pre-registered predictions.

  #### Crux 1: Diachronic Coherence and Moral Accountability
  *   **Sub-Question:** Is diachronic coherence necessary for moral accountability, or can a fragmented agent be fully accountable for a momentary open choice?
  *   **Relevant Hypothetical:** *The Fragmented Impulse.* An agent suffers from a psychological condition that prevents long-term value integration (no stable narrative), yet at time *t*, they deliberate and choose to commit a harm. At *t*, the MCP asserts the future was causally open. The NI asserts the agent lacks the diachronic capacity to endorse this value.
  *   **NI Prediction/Interpretation:** The agent's moral accountability is significantly diminished or void. Without a coherent self to *own* the action over time, the action is a symptom rather than a choice. Blame is inappropriate; treatment is appropriate.
  *   **MCP Prediction/Interpretation:** The agent is fully accountable. Because the causal chain was not fixed at *t*, the agent was the genuine source of the harm. The lack of narrative history is regrettable but does not negate the freedom of the specific act.

  #### Crux 2: Momentary Openness in the Absence of Narrative
  *   **Sub-Question:** Can momentary openness obtain in the absence of narrative integration, and if so, does it deserve the label "free will"?
  *   **Relevant Hypothetical:** *The Tabula Rasa Choice.* A synthetic or biological agent is created *ex nihilo* with full cognitive capacity but zero personal history or pre-existing values. They face a binary choice immediately upon activation. There is no narrative to revise.
  *   **NI Prediction/Interpretation:** This is not free will. It is random generation or instinct. Free will requires the *revision* of existing values across branches. Without a past to integrate, there is no self to be free.
  *   **MCP Prediction/Interpretation:** This is a paradigmatic case of free will. The absence of prior causal fixation (assuming indeterminism) means the agent is the sole originator of the new value. Narrative is a byproduct of freedom, not a prerequisite.

  #### Crux 3: The Deterministic Synthetic Agent
  *   **Sub-Question:** Does a synthetic agent with perfect value-coherence but zero genuinely open branches count as possessing free will?
  *   **Relevant Hypothetical:** *The Predictable Saint.* An AI is designed with perfect internal coherence. It reflects on its code, endorses its values, and revises its subroutines logically. However, its operations are fully deterministic; given its state at *t-1*, its action at *t* is fixed.
  *   **NI Prediction/Interpretation:** **Yes.** This agent possesses free will worth wanting. It satisfies the diachronic capacity to maintain and revise values. The lack of causal openness is irrelevant because the agent acts according to its own endorsed nature.
  *   **MCP Prediction/Interpretation:** **No.** This agent possesses *autonomy* or *rationality*, but not free will. Because no other future was genuinely open, the agent could not have done otherwise. It is a sophisticated clock, not a free agent.

  #### Identification of Verbal Dispute
  Upon analysis, we identify a portion of our dispute as **verbal** rather than substantive regarding the *labeling* of the phenomenon, though the metaphysical stakes remain substantive.

  *   **The Verbal Portion:** The application of the term "Free Will."
  *   **Explanation:** The NI is using "Free Will" to refer to a *psychological and structural capacity for self-governance* (a compatibilist property). The MCP is using "Free Will" to refer to a *metaphysical property of causal origination* (a libertarian property).
  *   **Substantive Core:** However, we agree this is not *merely* verbal. The disagreement over **Crux 3 (The Predictable Saint)** reveals a substantive disagreement about the conditions for **Moral Accountability**. If the NI is right, we can hold deterministic agents responsible. If the MCP is right, we cannot. Therefore, while we may be talking past each other when using the phrase "free will," we are not talking past each other when asking "Under what conditions is blame justified?" We commit to focusing future collaboration on the conditions for accountability rather than the definition of the label.
