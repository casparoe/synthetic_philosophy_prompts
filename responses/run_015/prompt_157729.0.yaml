answer: |-
  **MEMORANDUM**

  **TO:** Animal Ethics Committee, Field Station
  **FROM:** [Your Name/Initial]
  **DATE:** October 26, 2023
  **SUBJECT:** Preliminary Opinion on Protocol A-24-09 (Wood Ant Colony Fission)

  Colleagues,

  I am circulating this brief opinion ahead of our next meeting regarding the proposed wood ant (*Formica rufa*) fission protocol. While the standard interpretation classifies this work as research on ten thousand individual invertebrates, the experimental design explicitly tests for colony-level cognition. This necessitates a departure from our routine husbandry review.

  **Recommendation**
  I recommend we **defer full approval pending a pilot study**.
  *   **Cap:** Authorization for a maximum of **two (2)** colonies.
  *   **Time Frame:** A review period of **six months** to assess welfare outcomes post-fission.
  *   **Condition:** Pilot colonies must not be re-used for subsequent experiments; they are to be maintained until natural attrition or retired to non-experimental status.

  **Definition of the Subject**
  For the purposes of our review tier, we must adopt a dual definition. For welfare monitoring (distress, injury, mortality), the **individual ant** remains the subject, as nociception is localized. However, for procedural burden and experimental design, the **colony** must be counted as the functional subject. The intervention is not applied to the ants *en masse*, but to the colony's structural integrity. Splitting the colony is analogous to a dissociative procedure on a single cognitive unit, should the applicant's hypothesis hold true.

  **Status of the Fragments (Re-use Rules)**
  The applicant left open whether the fragments constitute a continuation of the original colony. To resolve this for our re-use rules: **The original colony ceases to exist upon fission.**
  Even though Fragment A retains the original queen, the experimental variable (route memory) is distributed. Disrupting that distribution terminates the original experimental entity. Therefore, both Fragment A and Fragment B are to be classified as **new colonies**. Neither fragment may be counted as "continuing" stock for the purpose of limiting experimental exposure. This prevents a loophole where a colony could be split repeatedly to bypass re-use limits.

  **The Counter-Argument (Minority View)**
  I must fairly articulate the strongest version of the opposing view held by some colleagues: that this committee lacks the standing to settle a metaphysical dispute. On this view, until the science conclusively proves the colony is a cognitive subject, we must treat it as an aggregate of individuals. To rule otherwise sets a precarious precedent. If we grant "colony status" to wood ants based on route memory, we logically bind ourselves to review honeybee swarms as single subjects (regarding dance-language maps) and termite mounds as physiological extensions of a single entity (regarding ventilation). This would impose an unmanageable administrative burden on the station and conflate ecological function with moral status. The argument is that we should remain metaphysically neutral and regulate only what is empirically certain: the welfare of the individual insect.

  **Conclusion**
  While the pragmatic argument above is sound, the Precautionary Principle obliges us to act as if the colony-level hypothesis might be true. If the colony *does* remember, splitting it is a significant intervention that our current "individual organism" rules fail to capture. The pilot study allows us to gather data on colony stress without committing to a new regulatory ontology prematurely.

  I look forward to discussing this on Tuesday.

  Regards,

  [Your Name]
  Retired Plant Physiologist
  AEC Member
