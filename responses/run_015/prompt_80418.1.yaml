  4.  **Identify the Strongest Tension:**
      *   **The Metaphysics of State Agency (2) vs. The Condition of Alternative Possibilities (6).**
      *   (2) claims the State is a *genuine* bearer of responsibility, *not just* a shorthand for officials.
      *   (6) claims blame requires the agent "could have done otherwise."
      *   *Problem:* Who is the "agent" in (6) when applied to the State? If it's the State *distinct* from officials (per 2), how does a metaphysical entity "do otherwise"? If it's the officials, then the State *is* a shorthand for officials (contradicting 2).
