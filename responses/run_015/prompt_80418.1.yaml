      *   **Option A: Revise (2).** Drop the strong claim that the State is a *genuine* agent distinct from officials. Treat it as a shorthand for officials.
          *   *Pros:* Solves the "could have done otherwise" problem (officials choose). Solves the punishment problem (officials should be tried, not people).
