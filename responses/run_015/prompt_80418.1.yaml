      *   *Let's look at (1) vs (3) again.* Fischer's thesis is fundamentally about *intent* (moral). The user accepts Fischer on *causality* but separates cause/blame. This is historically contentious. Fischer argued Germany *wanted* the war. That is moral blame. To say "Fischer is right about cause, but cause $\neq$ blame" is tricky. If Germany *wanted* the war, they are morally blameworthy. If Germany just *caused* it via miscalculation, Fischer is less right.
