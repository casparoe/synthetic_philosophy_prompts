      *   *Problem:* How do you punish a State without punishing the population? Reparations, territory loss, etc., hit the people. If blame is "partly retributive" (5), who receives the retribution? A ghostly State?
      *   *Severity:* Moderate/High. Practical vs. Theoretical.

