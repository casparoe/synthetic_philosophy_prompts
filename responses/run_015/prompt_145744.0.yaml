  Here is a reconstruction of the committee's implicit jurisprudence, an analysis of where the precedents fracture, and a prediction of the outcome.

  ### I. The Implicit Rules of the Committee

  Based on the five precedents, the committee is operating on three working principles that function as a hybrid system. They are not mutually exclusive, but they prioritize different values depending on the object class.

  **1. The "Tainted Context" Rule (Provenance & Coercion)**
  *   **Derived from:** Cases (1), (4), and (5).
  *   **The Rule:** A transaction is voidable if it occurred within a context of structural coercion (military campaign, treaty under pressure), even if a paper trail exists. However, a post-independence commercial transaction with valid export licenses creates a presumption of clean title (Case 4).
  *   **The Threshold:** The museum does not require proof of specific theft for a specific object if the *context* of acquisition renders consent presumptively invalid (Case 5), *unless* the museum can demonstrate a "clean break" in the chain of custody (Case 4).
  *   **The "Bad Faith" Kicker:** Institutional knowledge of ambiguity (the Curator's letter) lowers the burden of proof required to establish a tainted context.

  **2. The "Recipient Competence" Hierarchy**
  *   **Derived from:** Cases (1), (3), and (5).
  *   **The Rule:** The successor State is the default recipient for cultural property (Cases 1, 5), provided it offers conservation and public access guarantees. Non-state community groups are preferred *only* when the object's nature is incompatible with museum-ness (human remains, Case 3) or when the State is deemed incapable of guaranteeing the object's specific cultural safety (Case 5's chartered trust).
  *   **The Hierarchy:** State Authority > Chartered Community Trust > Unrecognized Community Group.

  **3. The "Mission Compatibility" Standard (Conditions of Return)**
  *   **Derived from:** Cases (1), (2), and (3).
  *   **The Rule:** The museum will attach conditions to ensure the object remains part of the "global heritage" narrative (public display, conservation standards). The only exception is when the object's physical or spiritual integrity is at risk (human remains reburial, Case 3).
  *   **The Limit:** Conditions that remove the object from the public sphere entirely (veiling, no photography) are generally rejected unless the object is categorically removed from the "artifact" class.

  ### II. Where the Rules Come Apart

  The current case is underdetermined because it sits precisely at the fracture point between **Rule 2 (Recipient)** and **Rule 3 (Conditions)**.

  *   **The Provenance (Rule 1):** The Curator's letter is the pivot. It moves this case out of the "Commercial/Valid" bucket (Case 4) and into the "Tainted/Coerced" bucket (Cases 1 & 5). The committee cannot claim ignorance. Consistency demands restitution.
  *   **The Recipient (Rule 2):** Here the precedents conflict.
      *   *Argument for State:* Cases (1) and (5) favor the State/State-chartered entity. The State offers the "public access" guarantees the museum values.
      *   *Argument for Royal House:* Case (3) establishes that community norms trump museum norms for sacred/ancestral items. The Royal House argues these are not artifacts (Case 1) but regalia (Case 3).
  *   **The Conditions (Rule 3):**
      *   *Argument for Access:* Case (1) requires display. Case (2) offers loans to maintain access.
      *   *Argument for Veiling:* Case (3) allowed non-display for remains. Does this extend to sacred regalia? The committee has not yet ruled on "living" sacred objects that are not remains.

  **The Closer Analog:**
  Legally, **Case (5)** is the closest analog. Both involve transfer during/after military pressure where consent was compromised. Case (5) returned the object to a *community trust chartered by the successor state*. This specific hybrid recipient is the key to unlocking the current deadlock. Case (1) is the procedural analog (regalia), but Case (5) provides the mechanism for handling the State vs. Community conflict.

  ### III. Predictions by Candidate Rule

  | Candidate Rule | Predicted Title Outcome | Predicted Recipient | Predicted Conditions |
  | :--- | :--- | :--- | :--- |
  | **Strict "Tainted Context" (Case 1 & 5)** | Title transfers (or "Stewardship" transfers). | **Successor State Authority.** (Default position). | Standard museum guarantees (Display, Conservation). Royal House access negotiated separately. |
  | **Strict "Sacred Nature" (Case 3)** | Title extinguished / Reverted. | **Royal House.** (Community norms prevail). | Veiling allowed. Photography banned. No public access guarantees. |
  | **Hybrid "Chartered Trust" (Case 5)** | **Transfer of Stewardship** (to bypass Statute). | **State-Chartered Trust** (Joint management). | Public display *unless* ritual calendar dictates veiling. Compromise on photography. |

  ### IV. The Verdict: Consistency vs. Probability

  **The Decision for Consistency:**
  To be truly consistent with the *totality* of its case law, the committee must acknowledge the Curator's letter as proof of bad faith, triggering the "Tainted Context" rule (Case 5). However, to respect the "Sacred Nature" precedent (Case 3) without abandoning the "Public Access" mandate (Case 1), it must utilize the **Case (5) Recipient Model**.
  *   **Outcome:** Transfer of stewardship to a special purpose vehicle (a Trust) jointly overseen by the State and the Royal House.
  *   **Reasoning:** The objects are regalia (Case 1) but function as sacred entities (Case 3). The State provides the legal umbrella; the Royal House provides the ritual management.
  *   **Conditions:** The objects are publicly displayed *except* during specific ritual periods (veiling allowed). Photography is restricted but not banned (e.g., no flash, or no photography of veiled state).

  **The Decision They Will Probably Reach:**
  Institutions prioritize risk management and the preservation of the "encyclopedic" narrative. They are wary of setting a precedent that allows recipients to hide objects from the public (Case 3 is usually siloed as "human remains"). They also need to navigate their governing statute regarding disposal.
  *   **Prediction:** **Restitution to the State Heritage Authority (Case 1 model), dressed as a "Long-Term Renewable Loan" (Case 2 mechanism).**
  *   **The Compromise:** The loan agreement will include a "cultural access clause" granting the Royal House priority access for rituals, but the State retains legal title and the obligation of public display. The veiling request will be rejected or minimized (e.g., "rotational display" rather than ritual veiling) to satisfy the museum's public mission.
  *   **Why:** This protects the museum from future claims by other communities demanding non-display (limiting Case 3 to remains). It satisfies the Statute (no permanent disposal, just a loan). It keeps the State happy (the primary diplomatic partner). It sidelines the Royal House's demand for total control while offering them face-saving access.

  ### V. Exposing the Rule (Interview Strategy)

  Since the precedents genuinely underdetermine the *recipient* question (State vs. Community), you need to force them to reveal which value trumps the other: **Public Access** or **Cultural Integrity**.

  **1. The Hypothetical Further Claim**
  *"Imagine a claim for a mask used in a living initiation rite. The community states that for the mask to function spiritually, it must be worn until it disintegrates, meaning it cannot be preserved in a museum or a climate-controlled shrine, and cannot be photographed even in private. Under your current framework, is the museum's duty to the object's physical survival, or to its cultural function?"*
  *   **What this exposes:** If they prioritize survival, Case (3) is an anomaly limited to remains. If they prioritize function, Case (1)'s display conditions are vulnerable. This forces them to define the boundary of "sacredness."

  **2. The Direct Question**
  *"In cases where provenance research reveals institutional 'willful blindness'—like a curator advising a dealer not to put origins in writing—does that internal bad faith shift the burden of proof regarding lawful acquisition from the claimant to the museum, even if no specific theft can be documented?"*
  *   **What this exposes:** This targets the Curator's letter directly without naming the case. If they say "Yes," they must return the objects (Case 5 logic). If they say "No, we need proof of theft," they are signaling they intend to distinguish this case from the Benin/Treaty precedents and likely reject the claim or offer a minimal loan, despite the moral weight of the letter.

  ### Summary for Your Piece
  The committee is building a common law of restitution that privileges **State-to-State diplomacy** (Cases 1, 2, 5) over **Community-to-Institution justice** (Case 3), unless the object is biologically human. In this Antwerp case, consistency demands a hybrid Trust (Case 5) that honors the sacred nature (Case 3). Probability suggests a Loan to the State (Case 1/2) that preserves the museum's leverage and public access mandate. The Curator's letter makes a rejection impossible, but the Statute makes a clean return unlikely. Expect a "Stewardship Transfer" that looks like a return but is legally a loan.
