prompt: |-
  I head the interpretation team at a regional history museum, and all of our exhibit copy — wall text, object labels, timelines, audio guide scripts — is drafted by curators, edited by generalist writers, and signed off by me before it goes to print. After our most recent exhibit, a historian on our advisory board complained that our labels were Whig history in miniature: the city's past read as a dress rehearsal for its present, every old institution judged by whether it "led to" what we now have, and the losing side of every conflict treated as an obstacle on a road whose destination everyone at the time supposedly knew. My staff split over what to do. One faction thinks the cure would be worse than the disease — visitors want a story with some direction, and a label so hedged that it presents everything as equally contingent is unreadable in the eight seconds a visitor actually spends on it. The other faction suspects that any moral language about the past is Whig, that we should stop calling the 1908 milk-pasteurization campaign a triumph and the child labor in our mills a horror, and I don't think that can be right either: some things really were better and worse than others, and pretending the past is a moral flatline is its own kind of falsification.

  What I want is a procedure our copywriters can run on a draft label in the time they actually have — call it ten minutes per label, several hundred labels per exhibit — with no historian in the room. Please translate whatever the historiography genuinely offers (Butterfield's original complaint, the distinction between narrating change and narrating progress, the distorting power of hindsight, the "on the right side of history" rhetoric that even our fundraising copy keeps drifting into) into a sequence of tests a non-specialist can apply: the questions to ask in order, what counts as a sufficient answer to each, where the procedure ends with a concrete rewrite, and where it has to hand the label back to a curator because the problem is one of interpretation rather than detectable wording. Be honest about which of your tests are mechanical and which are judgment calls dressed up as procedure — my writers can tell the difference, and they'll stop using a checklist that pretends.

  Then run the procedure on three real drafts I'm sitting on. First, our label about the textile mills closing: "The industry that built this city could not survive the modern economy, but its legacy lives on in the thriving arts district it made possible." Second, the pasteurization label: "A pioneering step toward the public-health protections we take for granted today." Third, our Then-and-Now timeline wall, which pairs 1890s photographs of the same street corners with 2020s ones. Include at least one case where the procedure returns a verdict I won't like — I am fond of that timeline wall and have defended it publicly — and make sure you say what the procedure cannot do: what kinds of Whig history live at the level of the exhibit as a whole, in which objects get selected and how visitors are routed through the gallery, that no per-label checklist will ever catch.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Head of Interpretation at a regional history museum.
      *   **Problem:** Advisory board historian accused exhibit copy of "Whig history" (teleological, presentist, moralizing progress). Staff is divided (storytelling vs. moral neutrality vs. accurate complexity).
      *   **Goal:** A practical, 10-minute-per-label procedure/checklist for generalist writers to detect and mitigate Whig history without needing a historian present.
      *   **Requirements:**
          *   Translate historiography (Butterfield, contingency, hindsight, moral language) into actionable tests.
          *   Distinguish between mechanical checks and judgment calls.
          *   Apply the procedure to three specific drafts (Textile Mills, Pasteurization, Then-and-Now Timeline).
          *   Include at least one verdict the user won't like (challenging the Timeline).
          *   Acknowledge limitations (what the checklist *can't* fix, like curation/routing).
      *   **Tone:** Professional, honest, pragmatic, historiographically informed but accessible.

  2.  **Deconstruct "Whig History" for the Context:**
      *   *Herbert Butterfield's core complaint:* Studying the past with direct reference to the present; judging the past by present standards; assuming a line of progress.
      *   *Key symptoms in museum text:*
          *   "Led to" / "Paved the way for" (Teleology).
          *   "Modern economy" / "Today we know" (Presentism).
          *   Moral binaries applied retrospectively (Triumph/Horror without context).
          *   Ignoring lost futures/contingency (It *had* to happen this way).
      *   *The User's Constraint:* Visitors need a story (narrative), but not a deterministic one. Moral clarity is needed (child labor *was* bad), but not presentist smugness.

  3.  **Develop the Procedure (The "Whig-Check"):**
      *   *Time limit:* 10 minutes.
      *   *Structure:* Sequential questions.
      *   *Differentiation:* Mechanical (syntax/word choice) vs. Judgment (interpretation).
      *   *Escalation:* When to rewrite vs. when to ping the curator.

      *   *Drafting the Steps:*
          1.  **The "Because" Test (Causality):** Does it say $X$ happened *so that* $Y$ could happen? (Mechanical/Judgment).
          2.  **The "Then vs. Now" Test (Perspective):** Are we judging them by what *they* knew or what *we* know? (Judgment).
          3.  **The "Dead End" Test (Contingency):** Does it acknowledge paths not taken? (Judgment).
          4.  **The "Victor's Voice" Test (Agency):** Who is the subject of the sentence? The "inevitable force" or the people? (Mechanical).
          5.  **The Moral Clarity Check:** Is the moral judgment about *values* or *outcomes*? (Judgment).

      *   *Refining the "Honesty" Requirement:* I need to explicitly state which steps are just finding specific words and which require actual thinking.

  4.  **Apply the Procedure to the Three Drafts:**

      *   **Draft 1: Textile Mills**
          *   *Text:* "The industry that built this city could not survive the modern economy, but its legacy lives on in the thriving arts district it made possible."
          *   *Analysis:* "Could not survive" (Inevitability). "Modern economy" (Presentist standard). "Made possible" (Teleology - the mills existed *for* the arts district?).
          *   *Verdict:* Fail. Needs rewrite.
          *   *Rewrite Idea:* Focus on the transition, the loss, and the repurposing without implying the mills were a sacrifice for the arts.

      *   **Draft 2: Pasteurization**
          *   *Text:* "A pioneering step toward the public-health protections we take for granted today."
          *   *Analysis:* "Step toward" (Teleology). "Take for granted today" (Presentism).
          *   *Nuance:* Pasteurization *is* objectively better for health. The user wants to keep moral clarity.
          *   *Verdict:* Pass with minor tweak. It's not Whig to say health improved, but it is Whig to imply it was a straight line "toward" today.
          *   *Rewrite Idea:* Focus on the immediate impact and the debate at the time, not just the result.

      *   **Draft 3: Then-and-Now Timeline (The "Unliked Verdict")**
          *   *Concept:* 1890s photos vs. 2020s photos of same corners.
          *   *Analysis:* This is visual Whig history. It implies progress (old = bad/sepia, new = good/color/clean). It erases what happened in between. It suggests the 2020s version is the "final form."
          *   *Verdict:* Fail. This is structural Whiggism. A label check won't fix it, but the procedure must flag the *concept*.
          *   *User Constraint:* "Include at least one case where the procedure returns a verdict I won't like." This is the one.

  5.  **Address Limitations (The "What This Can't Do" Section):**
      *   Selection bias (what objects are chosen).
      *   Spatial routing (the path through the gallery).
      *   The "Grand Narrative" of the whole exhibit.
      *   Visual hierarchy.

  6.  **Review and Refine:**
      *   *Tone Check:* Is it respectful of the user's expertise but firm on the historiography? Yes.
      *   *Constraint Check:* Did I distinguish mechanical vs. judgment? Yes. Did I run all three drafts? Yes. Did I include the unliked verdict? Yes.
      *   *Historiography:* Ensure Butterfield's points are clear (not judging the past by the present, avoiding the "abridgment" of history).

  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't just say "don't use Whig history." I need to give them *alternative phrasing strategies*.
      *   *Correction:* Ensure the distinction between "moral judgment" (child labor is bad) and "Whig judgment" (child labor was bad because it slows progress) is clear.
      *   *Correction:* The "Timeline" verdict needs to be handled carefully. I can't tell them to tear down the wall, but I must tell them the *labeling procedure* identifies a structural flaw they need to address at a higher level.

  8.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
answer: |-
  This is a classic tension in public history: the need for narrative coherence versus the historiographical imperative of contingency. Herbert Butterfield's *The Whig Interpretation of History* (1931) argued that Whig history organizes the past around the present, pruning away "dead ends" and judging historical actors based on how much they accelerated the "inevitable" arrival of today.

  Your staff is right that total neutrality is impossible and undesirable. A museum label is not a peer-reviewed journal article; it is a rhetorical device designed to be read in eight seconds. However, you can mitigate the *determinism* without sacrificing the *story*.

  Below is the **Contingency & Presence Protocol (CPP)**. It is designed for a 10-minute review per label. I have explicitly marked which steps are mechanical (syntax/word search) and which are judgment calls (interpretation). Your writers need to know where they are tightening screws and where they are making historical arguments.

  ### The Contingency & Presence Protocol (CPP)

  **Time Budget:** 10 Minutes
  **Operator:** Generalist Writer / Editor
  **Trigger:** Any draft label >50 words or any timeline entry.

  #### Step 1: The "So That" Scan (Mechanical)
  **Action:** Search for teleological connectors.
  **Look for:** "Led to," "paved the way," "made possible," "precursor to," "step toward," "would eventually," "in order to."
  **The Test:** If you find these, ask: *Did the historical actor know this outcome was happening?*
  *   **If No:** The phrasing is Whig. It assigns knowledge of the future to people in the past.
  *   **Sufficient Answer:** Rewrite to focus on immediate intent or immediate consequence.
      *   *Bad:* "This strike paved the way for the weekend."
      *   *Good:* "This strike demanded shorter hours. Decades later, the five-day week became standard."
  **Escalation:** If the *entire point* of the object is to show a lineage (e.g., a genealogy chart), flag for Curator.

  #### Step 2: The "Modern Standard" Check (Judgment)
  **Action:** Identify adjectives that rely on present-day norms.
  **Look for:** "Modern economy," "primitive," "advanced," "progressive," "backward," "efficient."
  **The Test:** *Efficient at what? Progressive for whom?*
  *   **If the judgment relies on 2024 values:** It is Presentist.
  *   **Sufficient Answer:** Ground the judgment in the values of the time, or specify the metric.
      *   *Bad:* "Could not survive the modern economy." (Implies the modern economy is a natural force like gravity).
      *   *Good:* "Could not compete with cheaper labor in the South." (Specific economic mechanism).
  **Escalation:** If the moral judgment is about human rights (e.g., slavery, child labor), **PASS**. Do not neutralize moral clarity. Whig history is not the same as moral judgment.

  #### Step 3: The "Dead End" Audit (Judgment)
  **Action:** Look for inevitability markers.
  **Look for:** "Inevitably," "naturally," "the rise of," "the birth of."
  **The Test:** *Does this text imply there was only one possible outcome?*
  *   **If Yes:** It erases contingency.
  *   **Sufficient Answer:** Insert a marker of uncertainty or alternative outcome, even if brief. Use "seemed," "hoped to," "argued for."
      *   *Bad:* "The city grew into a metropolis."
      *   *Good:* "The city expanded rapidly, though planners feared it might stall."
  **Escalation:** If acknowledging contingency undermines the core thesis of the exhibit, flag for Curator. This is an interpretation problem, not a wording problem.

  #### Step 4: The Agency Pass (Mechanical/Judgment)
  **Action:** Identify the subject of the active verbs.
  **Look for:** Abstract nouns as actors ("The industry," "The economy," "Progress," "Society").
  **The Test:** *Can "The Economy" make a decision?*
  *   **If No:** This reifies structural forces and removes human agency. It makes history feel like weather.
  *   **Sufficient Answer:** Make people the subjects. Owners, workers, voters, critics.
      *   *Bad:* "Technology changed the workflow."
      *   *Good:* "Managers introduced machines to speed up the workflow."
  **Escalation:** If specific names are unknown, use group identifiers ("Workers," "Councilors").

  #### Step 5: The "Victory" Verification (Judgment)
  **Action:** Check the closing sentence.
  **Look for:** Summaries that equate "what happened" with "what was right."
  **The Test:** *Does the label suggest the winner won because they were on the 'right side of history'?*
  *   **If Yes:** This is the core Whig sin.
  *   **Sufficient Answer:** Acknowledge the cost of the victory or the persistence of the losing idea.
  **Escalation:** If the label cannot be balanced without becoming unreadable, flag for Curator.

  ***

  ### Application to Your Drafts

  Here is the CPP applied to your three current drafts.

  #### 1. The Textile Mills Label
  > **Draft:** "The industry that built this city could not survive the modern economy, but its legacy lives on in the thriving arts district it made possible."

  *   **Step 1 (So That):** "Made possible." **FAIL.** Implies the mills existed *for the purpose* of creating an arts district.
  *   **Step 2 (Modern Standard):** "Modern economy." **FAIL.** Vague presentism. Treats "the economy" as a natural selection mechanism rather than a set of policy choices (trade, labor costs).
  *   **Step 4 (Agency):** "The industry... could not survive." **FAIL.** Industries don't die; owners close factories or investors move capital.
  *   **Verdict:** **Rewrite Required.** This is Whig history in its purest form: the past is a sacrifice zone for the present.
  *   **Suggested Rewrite:** "Mill owners closed these factories in the 1970s, seeking cheaper labor elsewhere. For decades the buildings stood empty, until artists and developers repurposed them into the arts district we see today."
      *   *Why:* It assigns agency (owners seeking labor), removes teleology (the arts district is a repurposing, not a destiny), and avoids "modern economy" vagueness.

  #### 2. The Pasteurization Label
  > **Draft:** "A pioneering step toward the public-health protections we take for granted today."

  *   **Step 1 (So That):** "Step toward." **WARNING.** Implies a straight line.
  *   **Step 2 (Modern Standard):** "Take for granted today." **PASS/FAIL.** It acknowledges the present, but risks smugness.
  *   **Step 5 (Victory):** "Pioneering." **PASS.** In the context of disease, "progress" is measurable (fewer dead children). This is where your staff's "moral flatline" fear is real. We *should* call this a triumph.
  *   **Verdict:** **Pass with Minor Tweak.** You are right that moral clarity is not Whiggism. However, "step toward" suggests the campaign *knew* it would result in today's systems.
  *   **Suggested Rewrite:** "Advocates argued that pasteurization would save lives, opposing dairy farmers who feared the cost. Their victory established a precedent for the public-health systems we rely on today."
      *   *Why:* It keeps the moral victory (lives saved) but acknowledges the conflict (farmers vs. advocates) and frames the current system as a "precedent" rather than a destiny.

  #### 3. The Then-and-Now Timeline Wall
  > **Concept:** 1890s photographs of street corners paired with 2020s photographs of the same corners.

  *   **Step 2 (Modern Standard):** **CRITICAL FAIL.** This is visual Whig history. By pairing 1890 (sepia, dirt, horses) with 2020 (color, clean, cars), the visual language itself argues that history is a march from darkness to light.
  *   **Step 3 (Dead End):** **FAIL.** It erases everything that happened in between. It suggests the 2020 version is the "final form" of that street corner. It ignores urban renewal, gentrification, or decay that might have happened in 1970.
  *   **Step 5 (Victory):** **FAIL.** The viewer inevitably concludes "We won."
  *   **Verdict:** **Structural Rejection.**
      *   *I know you like this wall.* I know you have defended it. But the CPP flags this not as a wording issue, but as a **curatorial concept issue**. No label text can fix a visual argument that equates "later" with "better."
      *   *Required Action:* You cannot solve this with a 10-minute label check. You must add an interpretive layer that disrupts the "progress" narrative.
      *   *Mitigation:* You need a third image or a text panel that explicitly asks: *"What is missing from this view?"* or *"Who was displaced to make this view possible?"* If you simply label the photos "Main St, 1890" and "Main St, 2020," you are teaching Whig history visually, regardless of what the text says.
      *   *Honest Assessment:* If you do not add the critical layer, this wall contradicts the nuance you are asking for in the labels. It tells visitors: "Look how far we've come." The labels say: "History is complex." The wall will win.

  ***

  ### What This Procedure Cannot Do

  You asked for honesty about limitations. The CPP is a linguistic filter. It cannot fix structural Whiggism. Here is what will slip through:

  1.  **Selection Bias:** If you only collect objects from "winners" (e.g., bank ledgers but not strike pamphlets), no label rewrite will fix the silence. The CPP checks what is *written*, not what is *omitted*.
  2.  **Spatial Routing:** If the gallery floor plan forces visitors to walk chronologically from "Primitive" to "Advanced," the architecture teaches Whig history. A label can say "contingent," but the feet say "progress."
  3.  **The "Hero" Problem:** If the exhibit is structured around Great Men who "shaped the city," the CPP can change "shaped" to "influenced," but the centrality of the Great Man remains a Whig structure.
  4.  **Visual Hierarchy:** As seen in the Timeline Wall, images carry more rhetorical weight than text. A photo of a smiling CEO next to a photo of a grimy worker creates a moral hierarchy that text cannot easily undo.

  ### Implementation Advice

  Give this to your writers with the following instruction: **"If you flag a label for Curator review, you must specify which Step failed and why the rewrite is beyond your pay grade."**

  This protects them from being accused of "hedging" (they are following protocol) and protects you from getting 300 labels back that say "Maybe things happened?" (the protocol demands specific rewrites for Steps 1, 2, and 4).

  For the Timeline Wall: Do not let the writers try to label their way out of that one. That is on you and the curators to re-conceptualize. The CPP has done its job by telling you the design itself is the problem.
