  1.  **Analyze the User's Query:**
      *   **Topic:** Aesthetic Testimony (Philosophy of Art/Aesthetics).
      *   **Core Question:** If testimony gives me *knowledge* that a song is heartbreaking (epistemic), why doesn't it give me the *feeling* of being heartbroken (phenomenological/emotional)? Why is there a block on the feeling if the knowledge is accepted?
