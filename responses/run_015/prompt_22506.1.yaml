prompt: |-
  I'm giving the eulogy for my brother at his funeral on Saturday. He was a set theorist, and the mourners divide roughly in two: about a third are logicians and colleagues who knew his work and will catch every technical reference, and the rest are family and neighbors who won't follow a single one. He was not a professional skeptic for effect; he genuinely lived with the question of whether the standard axioms of set theory might turn out to be inconsistent, and his last project was a paraconsistent set theory — the attempt to show that even if they are, the whole edifice need not collapse into triviality. He died holding the conviction he'd kept for decades that no proof of consistency can ever be obtained from inside the axioms themselves, and he left a note asking that his eulogy not console anyone with the claim that the foundations of mathematics are secure. Please write that eulogy, about four minutes long: it must genuinely comfort a room of non-mathematicians while saying nothing he would have considered false, and it must hold the interest of the logicians in the room without becoming a lecture.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** Sibling of the deceased.
      *   **Deceased:** A set theorist/logician.
      *   **Audience:** Mixed. ~1/3 logicians/colleagues (technical understanding), ~2/3 family/neighbors (no technical understanding).
      *   **Key Character Trait:** Genuine skepticism about the consistency of standard set theory axioms (ZFC). Not performative skepticism, but a deep philosophical stance.
      *   **Last Project:** Paraconsistent set theory (trying to save math even if axioms are inconsistent).
      *   **Core Belief:** Gödel's Second Incompleteness Theorem applied to his life's view – no proof of consistency from inside the system.
      *   **Specific Instruction:** A note requested *no* false comfort about the security of mathematical foundations.
      *   **Goal:** Comfort the non-mathematicians without lying to the mathematicians.
      *   **Length:** About 4 minutes (roughly 500-600 words spoken at a moderate pace).
      *   **Tone:** Respectful, honest, warm, intellectually rigorous but accessible.

  2.  **Deconstruct the Challenge:**
      *   *The Trap:* If I talk too much about set theory, the family glazes over. If I talk too much about "he was a good brother," the logicians might feel it ignores his life's work, and it might violate his wish about not claiming "security."
      *   *The Bridge:* I need to find a metaphor that connects his mathematical skepticism to human experience. The idea of "foundations" is perfect. We build lives on foundations we *hope* are solid, even if we can't prove they are.
      *   *The Constraint:* I cannot say "Math is safe." I cannot say "He found the answer." I *must* acknowledge the uncertainty.
      *   *The Comfort:* Comfort shouldn't come from "everything is fixed," but from "the work matters even if the ground shakes." Love and memory persist even without absolute proof of permanence.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the divide in the room. Validate both groups. State the brother's name (let's call him "David" for the draft, or keep it generic "my brother"). Let's use "my brother" to keep it adaptable, but maybe give him a placeholder name like "Elias" for flow. Actually, better to leave it as "my brother" so the user can insert the name.
      *   **The Work (for the logicians):** Acknowledge his specific focus. Paraconsistency. The fear of contradiction.
      *   **The Metaphor (for the family):** Translate "inconsistency" into "uncertainty in life."
      *   **The Constraint (The Note):** Address the request directly but gently. Don't promise security.
      *   **The Comfort:** How do we live with uncertainty? We love. We remember. The *attempt* to build is what counts.
      *   **Closing:** A final thought on his legacy.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. Half of you know what he did, half don't. He studied sets. He worried they were broken. He wanted to fix them so math wouldn't explode. He told me not to tell you math is safe. I won't. But he was a good man. He loved us. Even if math is shaky, love is real. That's how we go on.

      *Critique 1:* Too blunt. Needs more poetry. Needs to honor the intellect of the logicians without alienating the family. The transition from "math is shaky" to "love is real" needs to be smoother.

  5.  **Drafting - Iteration 2 (Focusing on Tone and Metaphor):**
      Start with the note. "He left instructions." That grabs attention. Explain the instruction: Don't say the foundations are secure. Why? Because he knew they might not be. To the family: This sounds scary. To the colleagues: You know Gödel. But here's the thing. He didn't stop building. He built a paraconsistent system. He believed you can build on shaky ground. That's like life. We don't know if we're safe, but we build anyway. That's courage.

      *Critique 2:* Better. Need to make sure the "paraconsistent" bit doesn't lose the family. Explain it as "building so it doesn't collapse." Need to ensure the emotional payoff lands.

  6.  **Refining the Content (incorporating the specific constraints):**
      *   *Time check:* 4 minutes is roughly 500-600 words.
      *   *Key phrase:* "No proof of consistency from inside the axioms." I should echo this sentiment regarding life.
      *   *Comfort:* The comfort comes from the *resilience* of the structure, not the *certainty* of the ground.

  7.  **Final Polish (Writing the speech):**
      *   *Greeting:* Warm.
      *   *The Note:* Address it early. It sets the theme.
      *   *The Math:* Keep it high-level. "Foundations," "Cracks," "Collapse."
      *   *The Human Connection:* We live without guarantees.
      *   *The Legacy:* His work continues, even if unfinished.
      *   *The Farewell:* Personal and final.

      *(Self-Correction during drafting)*: Make sure I don't accidentally imply math *is* inconsistent. He believed it *might* be. The point is the *possibility* of inconsistency and the response to it.
      *(Self-Correction on Comfort)*: The comfort for the family shouldn't be "math is hard, but he loved you." It should be "he taught us how to live with uncertainty."

  8.  **Final Review against constraints:**
