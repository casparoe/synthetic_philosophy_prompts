answer: |-
  ### Brainstorming Framings

  1.  **The Diachronic Turn:** Framing the project as simply adding a time-component to hinge epistemology.
      *   *Drop:* Too descriptive; doesn't capture the normative stakes of *why* the change matters.
  2.  **The Normativity of Hinge Succession:** Focusing on whether the transition between hinges is subject to epistemic evaluation.
      *   *Keep:* This cuts directly to the "arational bedrock" objection and forces a stance on rationality.
  3.  **Hinge Ecology and System Dynamics:** Treating hinges as a system where equilibrium must be maintained.
      *   *Drop:* Risks becoming functionalist sociology rather than epistemology.
  4.  **The Phenomenology of Slippage:** Focusing on the subjective experience of losing certainty.
      *   *Drop:* Wittgenstein warns against psychologizing; this invites the wrong kind of scrutiny.
  5.  **Epistemic Decay and Regeneration:** Framing demotion as a loss of status and succession as a repair mechanism.
      *   *Drop:* Too metaphorical; implies hinges are tools that break rather than commitments that shift.
  6.  **The Logic of Hinge Replacement:** Asking if there are rules governing which hinge replaces another.
      *   *Drop:* Too formal; misses the gradual, often invisible nature of the phenomenon you described.

  **Selected Framing:** **The Normativity of Hinge Succession.** It forces the committee to confront whether hinge shifts are mere causal events or epistemically evaluable processes, which is the weakest point in current literature.

  ***

  ### Research Proposal: Hinge Demotion and the Normativity of Succession

  **Project Summary**
  Contemporary hinge epistemology is obsessed with the *static* function of certainty: how hinges block doubt, ground reasons, or constitute practices. The literature treats hinge change as a rare, catastrophic event—"conversion" or "worldview shift"—often modeled on religious transformation or radical skepticism. This project argues that this is a category error. Hinges do not usually shatter; they erode. I propose to theorize **Hinge Demotion** (the gradual shift from unquestioned background to empirical claim) and **Hinge Succession** (the quiet inheritance of that role by a new commitment).

  The core thesis is that demotion often occurs without explicit doubt. A commitment stops functioning as a hinge not because it is doubted, but because it becomes inconvenient, opaque, or inefficient, while another commitment silently absorbs its structural role. Current accounts cannot explain this: propositional views treat hinges as immune, so change looks like irrational leapfrogging; practical views describe the shift but surrender normativity; quietists deny the phenomenon exists. This project demonstrates that hinge succession is a distinct epistemic phenomenon, neither fully rational nor merely causal, and that ignoring it leaves hinge epistemology unable to account for how practices actually evolve.

  **Methodology and Timeline (5 Months)**
  The goal is a 25-30pp paper suitable as a dissertation chapter. The method is case-driven conceptual analysis, avoiding armchair anecdote by treating cases as stress-tests for existing definitions.

  *   **Month 1: Literature Stress-Test.** Map existing accounts of hinge change (e.g., "conversion," "riverbed shift"). Identify exactly where they fail to describe *gradual* demotion. Draft the negative argument: why "belief revision" and "hinge conversion" are insufficient categories.
  *   **Month 2: Case Refinement.** Develop three specific cases.
      1.  *Instrument Calibration:* A lab standard moves from "definition of accuracy" to "source of error margin."
      2.  *Archival Trust:* Family records move from "proof of lineage" to "historical artifacts requiring verification."
      3.  *Semantic Drift (Replacement):* I am swapping your conversation case for **Medical Consensus** (e.g., the shift from "ulcers are stress-induced" to "ulcers are bacterial"). The conversation case risks collapsing into semantics; medical consensus shows a factual claim losing hinge status (the background assumption of etiology) and being replaced, altering what counts as evidence.
      *   *Task:* Demonstrate in each case that no specific moment of "doubt" triggered the shift; rather, the *utility* of the certainty faded.
  *   **Month 3: The Normativity Question.** Draft the core philosophical argument. Is the succession justified? I will test two hypotheses: (a) Succession is retroactively justified by the success of the new practice; (b) Succession is arational but constrained by coherence with remaining hinges.
  *   **Month 4: The Skeptic's Objection.** Anticipate the Quinean objection: "This is just the web of belief adjusting." I will argue that web-adjustment implies propositional weighting, whereas hinge demotion involves a change in *logical status* (from rule to move).
  *   **Month 5: Synthesis and Polish.** Finalize the argument. Ensure the distinction between "demotion" and "falsification" is watertight. Submit.

  **Possible Conclusions and Decision Criteria**
  The paper will argue for one of three positions, decided by the case analysis:
  1.  **Normative Succession:** There are reasons for succession (e.g., explanatory power, coherence) accessible from within the practice. *Decided if:* Agents can articulate why the new hinge was adopted *during* the transition.
  2.  **Causal Drift:** Succession is a causal fact about communities, epistemically invisible until complete. *Decided if:* Reasons are only reconstructible historically, not available to participants.
  3.  **The Eliminativist Outcome:** Demotion is not distinct; it is just complex abductive belief revision. *Decided if:* I cannot show that the commitment changed *status* rather than just confidence level.

  I aim for Conclusion 1, but Conclusion 2 is a viable fallback that still advances the field by clarifying the limits of hinge normativity. Conclusion 3 is the failure state.

  **Deliverable and Value for Skeptics**
  For the hinge-skeptic on the committee, the paper must earn its keep. I will not assume hinges are a genuine kind; I will argue that *whatever* plays this functional role (whether propositions, actions, or instincts) exhibits this demotion behavior. The value add is showing that standard epistemology (justified true belief + foundationalism/coherentism) cannot track the *status change* of these commitments. If successful, the paper shows that even if "hinges" are a metaphor, the *movement* of the metaphor is where the epistemic work happens.

  **Failure Conditions and Scope Management**
  *   **Failure:** If every case turns out to be standard abductive inference (e.g., the lab standard was just believed less strongly), the distinction collapses.
      *   *Mitigation:* I will focus on the *role* the claim plays in justification, not the confidence level. If the claim moves from being *used to judge* results to being *judged by* results, status has changed.
  *   **Failure:** If the normativity section requires a full theory of rationality.
      *   *Mitigation:* I will cut the positive theory of rationality and limit the claim to the negative thesis: standard accounts of rationality cannot describe this transition.
  *   **Scope Cut:** If three cases are too much, I will drop the Medical case and deepen the Lab and Archive cases, as they offer clearer institutional records of the transition.

  **Feasibility**
  This is feasible in five months because it does not require new archival research or empirical data collection. The "data" are public, documented shifts in practice (scientific methods sections, historical archival protocols, medical guideline updates). The work is conceptual consolidation: taking a phenomenon everyone recognizes but no one theorizes and forcing it into the hinge framework. The risk is not time, but precision; the timeline prioritizes defining "demotion" sharply in Month 1 to prevent scope creep.
