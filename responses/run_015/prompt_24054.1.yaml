answer: |-
  This is a classic problem in social epistemology, often framed as the debate between **Reductionism** (testimony must be grounded in perception/induction) and **Anti-Reductionism/Presumptivism** (testimony is a basic source of justification, like perception).

  Your intuitions are inconsistent with a pure version of either camp. You act like an Anti-Reductionist with the stranger/time case (believing without evidence) but like a Reductionist with the stranger/dog case (withholding belief due to lack of grounding).

  Here is a principle constructed to fit your specific data points, followed by an honest assessment of its limits and philosophical classification.

  ### The Principle: Contextual Presumptivism with Competence Defeaters

  > **Principle:** *Testimony provides immediate, prima facie justification for belief by default. However, this justification is defeated or weakened if: (1) the content exceeds the speaker's likely epistemic access (competence), (2) the context suggests conflicting incentives (sincerity), or (3) the pragmatic stakes of being wrong outweigh the cognitive cost of verification.*

  This is a "small set" principle that relies on three filters: **Access, Incentive, and Stakes.**

  #### How it handles your 8 cases:

  1.  **Stranger/Time:** **Believe.**
      *   *Access:* High (they can look at a watch).
      *   *Incentive:* Neutral (no reason to lie about time).
      *   *Stakes:* Low (being wrong costs nothing).
      *   *Result:* Default presumption stands.
  2.  **Stranger/Dog Bite:** **Disbelieve/Skeptical.**
      *   *Access:* Low (unlikely they witnessed it personally; likely hearsay).
      *   *Incentive:* Ambiguous (gossip often serves social bonding or malice).
      *   *Result:* Defeater triggered on Access and Incentive.
  3.  **Friend/Dave's Quote:** **Believe.**
      *   *Access:* High (they were there, heard it).
      *   *Incentive:* Low conflict (friendship norm).
      *   *Result:* Default presumption stands.
  4.  **Friend/Dave's Jealousy:** **Skeptical.**
      *   *Access:* Low (mental states are interpretive, not observational).
      *   *Result:* Defeater triggered on Access (Competence).
  5.  **Celebrity/Vaccine vs. Doctor/Tumor:** **Disbelieve Celebrity / Believe Doctor.**
      *   *Access:* Celebrity (Low expertise); Doctor (High expertise/Training).
      *   *Result:* Defeater triggered on Access (Expertise).
  6.  **Child/Dog Location vs. Emotion:** **Believe Location / Skeptical Emotion.**
      *   *Access:* Location (Perceptual); Emotion (Theory of Mind, which children lack).
      *   *Result:* Defeater triggered on Access (Developmental Competence).
  7.  **Memo vs. News Report:** **Believe Memo / Skeptical News.**
      *   *Access:* Memo (Primary source); News (Secondary interpretation).
      *   *Result:* Defeater triggered on Access (Proximity).
  8.  **History Book:** **Believe (with shrug).**
      *   *Access:* Medium (Institutional research, but distant).
      *   *Stakes:* Low (academic belief).
      *   *Result:* Presumption stands but is weakened (the "shrug") due to distance.

  ---

  ### Application to the New Case

  **The Case:** A stranger tells you something you cannot check, but if true, it would be very bad for you (e.g., "There is a bomb in your car" or "Your spouse is secretly in debt").

  **Applying the Principle:**
  1.  **Default:** Presumptive justification exists (they told you).
  2.  **Defeater Check (Stakes):** The stakes of error are extremely high (physical harm or financial ruin). The principle states: *"if the pragmatic stakes of being wrong outweigh the cognitive cost of verification."*
  3.  **Defeater Check (Incentive):** A stranger delivering bad news has ambiguous incentives (prank, manipulation, genuine warning).
  4.  **Verdict:** **Do not believe (yet).** The principle dictates you should treat the testimony as a *warning to investigate*, not as a fact to accept. You are justified in acting cautiously (checking the car), but not justified in holding the belief as true without corroboration.

  **Why this matters:** In your "Stranger/Time" case, the cost of verification is low (glance at phone) and the cost of error is low. In the "Bomb" case, the cost of error is catastrophic. The principle shifts the burden of proof based on stakes.

  ---

  ### Honest Limitations: Where the Principle Fails

  No principle is perfect. Here are the friction points where your verdicts might outpace this principle:

  **1. The "Stranger/Time" Problem (The Reductionist Leak)**
  You said you have "zero evidence about that person." Strictly speaking, my principle requires an assessment of "likely epistemic access" and "conflicting incentives." To judge that a stranger has access to the time and no reason to lie, you are implicitly using background inductive evidence (e.g., "people usually wear watches," "lying about time is pointless").
  *   **The Failure:** If you are a *true* Anti-Reductionist, you shouldn't need to check incentives or access at all; the act of saying it should be enough. Your intuition requires a quick, subconscious check of incentives. This suggests you are not a pure Anti-Reductionist, even if it feels like one.

  **2. The History Book "Shrug"**
  The principle explains the "shrug" as weakened justification due to distance. However, it struggles to explain *why* you believe it at all. If "Access" is the key defeater, a historian writing 500 years later has almost zero direct access.
  *   **The Failure:** You believe the historian based on *institutional authority*, which is a different mechanism than interpersonal testimony. The principle lumps "expertise" and "institutional consensus" under "Access," but they function differently. You trust the book because of the *publishing process*, not just the author's access.

  **3. The "Friend/Jealousy" Nuance**
  You are less convinced about the jealousy claim. My principle attributes this to "Access" (mental states are hard to know). But often we trust friends on emotional intuition *more* than facts.
  *   **The Failure:** If the friend is emotionally intelligent, their "Access" to jealousy might be higher than their access to exact quotes (which memory distorts). Your verdict assumes quotes are harder to fake than vibes. This is a specific psychological heuristic, not a general epistemic rule.

  ---

  ### Philosophical Classification: Which Camp Are You In?

  You asked if this puts you on the "ground it in other evidence" side (Reductionism) or the "testimony is its own source" side (Anti-Reductionism).

  **You are a Defeasible Presumptivist (A Hybrid).**

  Here is the breakdown:

  *   **Why you aren't a Reductionist:** A Reductionist (like Hume) would say you should *not* believe the stranger about the time until you have inductive evidence that strangers are reliable about time. You *do* believe them immediately. You treat testimony as a **basic source** that doesn't require prior argument.
  *   **Why you aren't a pure Anti-Reductionist:** A pure Anti-Reductionist (like Reid) would say you have a right to believe the stranger about the dog bite just as much as the time, unless you have positive evidence they are lying. You *don't* believe them. You require the context to support their competence.
  *   **The Hybrid Position:** You accept the **Presumption of Truth** (Anti-Reductionist structure), but you allow that presumption to be defeated by **Contextual Factors** (Reductionist content).

  **Does it smuggle Reductionism in the back door?**
  Yes. By defining "Competence" and "Incentives" as defeaters, you are requiring that testimony be consistent with your background beliefs about how the world works (e.g., "children don't understand sadness," "celebrities aren't immunologists").

  However, this is arguably the most robust position. Pure Anti-Reductionism makes you gullible to conspiracy theorists (who claim "trust me" as a basic right). Pure Reductionism makes you solipsistic (you can never learn anything new because you can't verify the source without already knowing the facts).

  **Final Verdict:**
  Your intuition aligns with **Contextualism**. You believe that the *rules of justification change depending on the context of the speech act.*
  *   **Context: Cooperative Exchange (Time):** High trust, low bar.
  *   **Context: Gossip/Expertise/High Stakes:** Low trust, high bar.

  This saves you from the binary trap. Testimony *is* its own source, but like a tap water source, it is only potable if the pipes (context/competence) aren't known to be lead.
