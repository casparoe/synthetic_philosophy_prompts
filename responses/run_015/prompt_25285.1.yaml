answer: |-
  ### The Case of the Last-Out Light Switch

  **Setting:** A small, shared research laboratory occupied by six principal investigators (PIs) and their teams. The lab is in a secure building that locks automatically at 8:00 PM.

  **Stage 1: The Emergent Regularity**
  In the first year, the lab had no rule about the main overhead lights. Sometimes they were left on all night; sometimes turned off. This created minor uncertainty for the cleaning crew and the security patrol (who checked for open equipment). One PI, Dr. Aris, began turning off the main switch when she was the last to leave. Others noticed this was convenient. Soon, a regularity emerged: *Whoever is the last person to leave turns off the main lights.*
  *   **Status:** This is a pure Lewis-convention. It solves a coordination problem (ensuring lights are off without assigning a specific duty). It is arbitrary (they could have agreed the *first* person to arrive turns them on, or that the youngest PI does it). It is sustained because everyone prefers to conform conditional on others conforming (avoiding the hassle of deciding).

  **Stage 2: Entrenched Expectation**
  Five years pass. The regularity is now a habit. New hires are told, "If you're the last one out, kill the lights." The expectation is robust. If a PI leaves without turning off the lights, the security guard calls the next morning to mention it. The PI feels embarrassed. The inconvenience is not just the electricity cost; it is the disruption of the routine. The security guard relies on the lights being off as a signal that the lab is securely closed.
  *   **Status:** The convention is now common knowledge. Violations are surprising and inconvenient. Participants conform to avoid the hassle of explanation and to maintain the smooth functioning of the lab's closure routine.

  **Stage 3: The Normative Requirement**
  The building management installs a new automated sensor system. If the lights are left on, the sensors detect motion cessation and turn them off automatically after two minutes. There is no electricity waste. The security guard no longer checks the switch; he checks the digital sensor log.
  One evening, Dr. Aris is the last to leave. She knows the sensors will handle the lights. She also knows she is in a rush to catch a train. She leaves the lights on.
  The next day, a colleague, Dr. Ben, sees the sensor log showing the lights timed out automatically. He confronts Aris: "You didn't turn off the lights."
  Aris replies: "The sensors handle it now. It made no difference."
  Ben responds: "That's not the point. You're the last one out. You turn them off. We can't have people deciding for themselves when the rule applies."
  Other PIs side with Ben. They treat Aris's action not as a harmless efficiency, but as a *violation*. They feel a sense of reproach. They say, "You *ought* to have turned them off," even though the coordination problem (wasted energy/security signal) was solved by the sensors. The obligation has detached from the original utility.

  ***

  ### 1. Lewisian Analysis of the Three Stages

  **Stage 1: Coordination Equilibrium**
  *   **Expectation:** *Predictive.* Aris expects others to turn off lights if it's convenient; others expect Aris to do the same.
  *   **Knowledge:** There is a nascent common knowledge that "turning off lights is what is happening."
  *   **Reason to Conform:** Purely instrumental. Each PI prefers to turn off the lights *if and only if* they believe others will do the same in similar situations, thereby establishing a reliable pattern that avoids ambiguity.
  *   **Lewisian Element:** This is a **coordination equilibrium**. The preference is conditional: $I \text{ prefer } X \text{ if others do } X$.

  **Stage 2: Precedent and Common Knowledge**
  *   **Expectation:** *Robust Predictive.* The expectation is now backed by history. It is common knowledge that everyone knows the rule.
  *   **Knowledge:** The regularity is salient. The "precedent" functions as a focal point.
  *   **Reason to Conform:** Instrumental + Reputational. Conformity avoids the "transaction cost" of breaking the habit (the embarrassment of the security call).
  *   **Lewisian Element:** **Precedent** has solidified the equilibrium. The "reason" is still grounded in the preference for coordination, but the cost of non-coordination now includes social friction (embarrassment).

  **Stage 3: The Normative Shift**
  *   **Expectation:** *Normative.* Ben does not merely *expect* Aris to turn off the lights; he believes he is *entitled* to expect it.
  *   **Knowledge:** It is common knowledge that the rule is now treated as binding *independent* of the immediate outcome.
  *   **Reason to Conform:** The reason is no longer about the lights (the coordination payoff is zero). The reason is to **preserve the precedent itself**.
  *   **Lewisian Element:** The **arbitrariness** of the convention becomes crucial. Because the rule is arbitrary (sensors could do it), the *only* reason to follow it is to signal commitment to the shared practice. The "coordination problem" has shifted from "lights off" to "maintaining the reliability of our shared signals."

  ### 2. The Generative Feature: The Fragility of Common Knowledge

  The specific feature that generates normativity from mere convention is **the fragility of precedent in the face of common knowledge.**

  In Lewis's account, a convention works because it is a focal point sustained by the belief that others will follow it. In Stage 3, the participants recognize that the *utility* of the convention (saving energy) is gone, but the *value* of the convention (as a reliable signal of cooperation) remains.

  If Aris is allowed to make an exception ("I didn't turn them off because the sensors were there"), she introduces uncertainty into the common knowledge base. Next time, Ben might wonder, "Are the sensors working today? Did Aris decide sensors aren't enough?" By making the rule contingent on utility, the rule becomes unstable.

  The normativity arises because **adherence to the arbitrary rule becomes the only visible proof of commitment to the group.** Since the rule has no intrinsic value (Stage 3), following it *only* makes sense if one is following it *because it is the rule*. Therefore, violating it is interpreted not as a calculation of efficiency, but as a signal of *unwillingness to submit to the shared framework*. The "ought" comes from the necessity of maintaining the precedent as a public good. If the precedent degrades, the group loses a low-cost mechanism for coordinating trust in other areas.

  ### 3. The Counterfactual: Removing the Feature

  If we remove the **fragility of precedent**—that is, if we assume the group believes the convention is robust enough to survive exceptions—the normativity collapses.

  Imagine the group believes: "We turn off the lights, but obviously, if sensors are installed, we don't need to."
  *   **Result:** When Aris leaves the lights on, Ben says, "Oh, right, the sensors." There is no reproach. The "ought" disappears.
  *   **Implication:** This confirms that the normativity was not generated by the act itself (turning off lights), nor by the original coordination problem (energy), but by the **social necessity of maintaining the rule's inviolability.**

  If the normativity survived this removal, it would suggest the norm was based on something external (e.g., "waste is morally wrong"). But since the normativity *vanishes* when the group accepts the exception, we know the force was entirely internal to the maintenance of the convention itself. The "wrongness" was the threat to the precedent, not the lights.

  ### 4. Lewis's Verdict and the Necessary Amendment

  **Would Lewis accept this as genuine normativity?**
  On the most faithful reading of *Convention*, **no.** Lewis would redescribe this as a **particularly entrenched convention with complex payoff structures.**

  Lewis is a reductionist about normativity. He argues that the "ought" of convention is a hypothetical imperative: "You ought to conform *if* you want to coordinate." In Stage 3, Lewis would argue the coordination payoff *has not disappeared*; it has merely shifted. The payoff is now "maintaining trust" or "avoiding social sanction." As long as Aris conforms to avoid the reproach of her colleagues, she is still acting on a preference satisfaction calculus. The "ought" is still hypothetical: "You ought to turn off the lights *if* you want to avoid Ben's anger."

  For Lewis, there is no categorical "moral ought" here. There is only a web of interlocking expectations and preferences. He would deny that the norm has "come apart" from the coordination problem; he would say the coordination problem has simply expanded to include the preservation of the signaling system itself.

  **What needs to be added?**
  To capture the genuine normativity described in the prompt (where the "ought" survives even when the agent doesn't care about the social penalty), Lewis's account needs the addition of **Normative Expectations** (a concept later developed by philosophers like Margaret Gilbert or Philip Pettit).

  *   **Lewisian Expectation:** "I expect you to do X, and I will be surprised if you don't." (Predictive)
  *   **Normative Expectation:** "I expect you to do X, and I believe I have the *standing* to resent it if you don't." (Entitlement)

  In Stage 3, Ben's reaction ("You *ought* to have") implies he feels entitled to hold Aris accountable, not just that he is disappointed. Lewis's account explains why Ben is *disappointed* (his predictions failed), but it struggles to explain why Ben feels *authorized to reproach* without importing external moral principles.

  **Friendly Amendment or Departure?**
  This would be a **departure**, not a friendly amendment. Lewis's project was explicitly to show how normative-seeming phenomena could be reduced to non-normative game theory (preferences and beliefs). Adding "entitlement to resent" as a primitive feature introduces a genuinely normative element that cannot be reduced to preference satisfaction. It admits that some "oughts" are not derived from "I want," but from "We agree." This moves the account from a theory of *Convention* to a theory of *Social Ontology*, which Lewis explicitly sought to avoid.
