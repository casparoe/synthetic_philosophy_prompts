      *   *Does no-reciprocity argue for or against discounting?* Economically: For (high risk, no payback). Ethically: Against (it's a power imbalance, not a market transaction). The Ramsey rule is about *ethics*, not market rates.
      *   *Is the space analogy bad?* It's good for establishing *impartiality*, bad for establishing *mechanisms of transfer*.
      *   *Better analogies?* The "Bequest" model (family) or the "Trusteeship" model.
