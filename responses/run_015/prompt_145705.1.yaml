answer: |-
  Here is the spec sheet for a theory of moral agency that incorporates integrity without collapsing into subjectivism. This is designed to operationalize Williams's insight while avoiding the "do what feels right" trap.

  ### I. Core Desiderata (The Must-Haves)

  A viable theory must satisfy the following conditions, mapped to your specific cases.

  **1. The Immediate Partiality Condition**
  *   **Motivating Case:** *The Drowning Choice (Spouse vs. Stranger).*
  *   **Requirement:** The theory must permit (or require) saving the spouse without the agent needing to calculate net utility or justify the choice via an impartial principle *in the moment of action*.
  *   **Why:** If the agent must think, "Saving my spouse maximizes utility," they have had "one thought too many." The motivation must be allowed to be directly agent-relative without counting as a moral failure. The theory must validate the *source* of the motivation, not just the outcome.

  **2. The Alienation Constraint**
  *   **Motivating Case:** *The AI Alignment Researcher.*
  *   **Requirement:** The theory must recognize that being made the instrument of the greater good can constitute a harm to the agent, even if the outcome is positive. It must allow an agent to refuse complicity in a system they deem toxic, even if their individual refusal doesn't change the outcome.
  *   **Why:** Utilitarianism often treats negative responsibility (what I allow) the same as positive responsibility (what I do). A theory of integrity must distinguish between *causing* harm and *refusing to be the cause* of good via tainted means. The agent's relationship to the action matters, not just the action's place in the causal chain.

  **3. The Sustainability Threshold**
  *   **Motivating Case:** *The Longtermist (90% giving).*
  *   **Requirement:** The theory must define a floor for personal resources (time, money, psychological energy) below which moral demand cannot push the agent. This is not a privilege; it is a condition of agency.
  *   **Why:** If a moral theory demands the dissolution of the "self" that is doing the acting, it becomes self-defeating. Ground projects are not hobbies; they are the structural supports of the agent. A theory must explain why keeping 10% for art, family, or rest is not moral laziness but agent-maintenance.

  **4. The Alignment Exception**
  *   **Motivating Case:** *The Whistleblower.*
  *   **Requirement:** The theory must explain why integrity sometimes *requires* sacrificing ground projects (career, safety) for an impartial good. It cannot simply protect the agent's current desires.
  *   **Why:** If integrity is just "staying true to who you are," it cannot account for moral growth or correction. Sometimes integrity means destroying your current life because your commitment to truth outweighs your commitment to comfort. The theory must distinguish between *protecting the self* and *honoring the good*.

  ---

  ### II. Critical Distinctions (Don't Collapse These)

  To avoid the "authenticity trap," the theory must mechanically distinguish the following pairs.

  **1. Integrity vs. Mere Preference**
  *   **The Risk:** A Nazi claims integrity in pursuing genocide because it is his "ground project."
  *   **The Fix:** Integrity must have a normative filter. Ground projects count only if they are compatible with a minimal threshold of moral permissibility or human flourishing. Preferences are hedonic; integrity is constitutive of identity *within a moral landscape*.

  **2. Agent-Relative Permissions vs. Rationalization**
  *   **The Risk:** "I didn't donate because I need integrity" vs. "I didn't donate because I'm selfish."
  *   **The Fix:** The theory needs a publicity or reason-giving condition. A permission is valid if it can be acknowledged by others as a legitimate limit on demand. Rationalization fails when the excuse relies on special pleading that the agent wouldn't accept from others in similar positions.

  **3. Preserving Ground Projects vs. Selfishness**
  *   **The Risk:** Keeping money for painting vs. keeping money for a yacht.
  *   **The Fix:** Ground projects must be *identity-constituting* and *long-term*, not merely consumption. Selfishness protects pleasure; integrity protects the narrative structure of a life. The theory must weigh the depth of the project against the severity of the need.

  **4. The "Integrity Budget" (Depletion vs. Betrayal)**
  *   **The Risk:** Can I spend all my moral capital on one big cause (e.g., effective altruism) and ignore my family? Or does ignoring family deplete the budget?
  *   **The Fix:** Integrity is not a fungible resource like money; it is structural. You cannot "spend down" integrity on public good if the spending mechanism violates the private commitments that make you an agent. However, you can *betray* integrity by hoarding it. The theory must treat integrity as a *system of coherence*, not a bank account. You don't run out of it; you break it.

  ---

  ### III. Requirements & Tensions

  **Non-Negotiable Requirements (Any viable theory needs these)**
  1.  **Explanatory Power on Partiality:** Must explain why saving the spouse is okay without utilitarian calculus.
  2.  **Non-Alienation:** Must not treat the agent as a mere vessel for value.
  3.  **Normative Constraint:** Must rule out "evil integrity" (the Nazi problem).

  **Camp-Specific Implementations (How different theories solve it)**
  1.  **Virtue Ethics:** Solves this via *character*. The virtuous agent *wants* to save the spouse; it's not a conflict. Integrity is harmony between reason and desire.
  2.  **Contractualism:** Solves this via *reasonable rejection*. A principle requiring you to let your spouse drown is one they could reasonably reject.
  3.  **Sophisticated Consequentialism:** Solves this via *indirect strategies*. We maximize utility by cultivating agents who don't always try to maximize utility.

  **Jointly Unsatisfiable Pairs (The Hard Limits)**
  *   **Deep Agent-Relativity vs. Global Optimizability:** You cannot have a theory that grants genuine, non-derivative weight to personal projects *and* guarantees that every action leads to the globally optimal state. If I am permitted to save my spouse when a stranger would yield +1 util, the world is sub-optimal. You must choose: either integrity trumps optimization sometimes, or integrity is just a heuristic for optimization.
  *   **Subjective Motivation vs. Objective Correctness:** If integrity is about *my* projects, it is subjective. If it is about *right* projects, it is objective. A theory cannot fully satisfy "do what defines you" and "do what is independently right" if those two diverge. Williams wants the former; traditional morality wants the latter.

  ---

  ### IV. Theory Scorecard

  Here is how the major contenders stack up against the spec sheet.

  | Criterion | Act Utilitarianism | Virtue Ethics (Aristotelian/Neo-Aristotelian) | Scanlon-style Contractualism |
  | :--- | :--- | :--- | :--- |
  | **Immediate Partiality** | **FAIL.** Requires the "one thought." Saving spouse is only right if it maximizes utility. | **PASS.** The virtuous person naturally prioritizes close ties. No calculation needed. | **PASS.** Principles allowing partiality are not reasonably rejectable. |
  | **Alienation Constraint** | **FAIL.** Agent is a channel for utility. Negative responsibility is too heavy. | **PASS.** Action must express character. Complicity damages character regardless of outcome. | **MIXED.** Focuses on justification to others, but can still demand high sacrifice if principles require it. |
  | **Sustainability Threshold** | **FAIL.** Notoriously overdemanding. No inherent floor for personal projects. | **PASS.** *Eudaimonia* requires personal flourishing. You cannot be virtuous if destroyed. | **MIXED.** Depends on what counts as "reasonable" sacrifice. Can be demanding. |
  | **Alignment Exception** | **PASS (Instrumental).** Whistleblowing is good if it increases utility. | **PASS.** Courage and justice may demand sacrifice of career. | **PASS.** Duty to justify actions to others can override personal cost. |
  | **Integrity vs. Preference** | **N/A.** Collapses integrity into preference satisfaction (utility). | **PASS.** Distinguishes base appetites from rational commitments. | **PASS.** Distinguishes personal reasons from public principles. |
  | **Agent-Relativity vs. Optimization** | **Optimization Wins.** Integrity is sacrificed for the greater good. | **Agent-Relativity Wins.** The good is relative to the agent's flourishing. | **Tension.** Tries to balance, but often leans toward impartial justification. |

  **Summary Verdict:**
  *   **Utilitarianism** fails the spec sheet on the core Williamsian objections (Alienation, Partiality, Sustainability) unless it modifies itself so heavily it ceases to be act-utilitarianism.
  *   **Virtue Ethics** scores highest on integrity and sustainability but can struggle with the Whistleblower case if the "community standards" are corrupt (requires a robust account of objective human good).
  *   **Contractualism** handles the Whistleblower and Spouse cases well but risks being too demanding on the Longtermist case depending on how "reasonable rejection" is calibrated.

  **The Unsolvable Tension:**
  Note that no theory scores "PASS" on everything without trade-offs. Specifically, the **Deep Agent-Relativity vs. Global Optimizability** tension means you must decide if the theory is about *making the world best* or *living a life that is yours*. Williams argues you can't do both. The spec sheet forces you to admit this.
