  # JOINT STATEMENT ON MATERIAL CONSTITUTION AND THE ATELIER RECONSTRUCTION

  **Signatories:** A Commitment to Constitutionality (CC) and A Commitment to Anti-Coincidence Hylomorphism (ACH)
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Ontological Outcomes in Material Constitution

  ## 1. Agreed Claims and Parameters

  We, the undersigned, acknowledge deep ontological disagreement regarding the nature of composite objects. However, to ensure our dispute is substantive and precisely located, we affirm the following shared commitments and case parameters:

  1.  **Logical Framework:** Both parties accept the Indiscernibility of Identicals (Leibniz's Law). If two entities differ in their modal properties or historical conditions, they are not numerically identical.
  2.  **Classic Case Data:** In the standard statue-and-clay scenario (prior to destruction), there is a spatially located entity capable of surviving squashing (the clay matter) and a spatially located entity incapable of surviving squashing (the statue). Both parties agree these descriptions track real features of the world, even if they disagree on whether these features belong to one object or two.
  3.  **Ontological Adequacy:** An adequate theory must explain the apparent difference in persistence conditions without positing magical causation or violating logical consistency.
  4.  **Atelier Reconstruction Parameters:** We agree on the following factual description of the injected case:
      *   **Original State:** A statue ($S_1$) existed, constituted by a specific clay aggregate ($C_1$).
      *   **Destruction:** $S_1$ was destroyed (shattered), creating a temporal gap in its existence as a unified artifact.
      *   **Reconstruction Material:** The rebuilt object ($S_2$) is composed of 60% fragments from $C_1$ and 40% new clay material.
      *   **Guidance Conditions:** The reconstruction was guided precisely by the original artist's workshop sketches and fabrication protocols.
      *   **Spatiotemporal Discontinuity:** There is a non-zero temporal interval between the destruction of $S_1$ and the completion of $S_2$ during which no statue existed.

  ## 2. Disagreements Table

  | Precise Issue | Constitutionalist (CC) Formulation | Anti-Coincidence Hylomorphist (ACH) Formulation | Crux Designation |
  | :--- | :--- | :--- | :--- |
  | **Ontological Count during Coincidence** | In the classic case (prior to destruction), there are **two** numerically distinct material objects occupying the same space: the clay aggregate and the statue. They are related by a primitive relation of *constitution*. | In the classic case (prior to destruction), there is **one** substance occupying the space. The "clay" and "statue" are not distinct objects but rather the matter and form of a single unified entity. | **Coincidence vs. Unity** |
  | **Modal Profiles** | The statue and the clay have different modal properties (e.g., survivability under squashing). This difference proves they are distinct objects, as one thing cannot have contradictory properties. | The substance has a single modal profile determined by its substantial form. The intuition that "clay survives" refers to the matter persisting potentially, not an actual object surviving independently of the form. | **Modality vs. Form** |
  | **Reconstruction Identity** | The post-reconstruction statue ($S_2$) is **not** numerically identical to the pre-destruction statue ($S_1$). The temporal gap breaks the historical continuity required for artifact identity. | The post-reconstruction substance ($S_2$) **is** numerically identical to the pre-destruction substance ($S_1$). The restoration of form via original protocols on majority-original matter restores the substance. | **Restoration vs. Replacement** |
  | **Post-Reconstruction Count** | After reconstruction, there are **two** objects present: the clay aggregate (which persisted through the gap) and the new statue (which began existence at reconstruction). | After reconstruction, there is **one** object present: the restored substance. The matter does not exist as a separate object alongside the form. | **Plenitude vs. Parsimony** |

  ## 3. Crux Specifications

  For each designated crux above, we specify the concrete evidence or argument that bears on the dispute and our respective predictions regarding what that evidence demonstrates.

  ### Crux 1: Coincidence vs. Unity (Classic Case)
  *   **Concrete Case:** The standard statue-and-clay scenario prior to destruction.
  *   **Argument/Evidence:** The intuition that the clay could survive being squashed while the statue would cease to exist.
  *   **CC Prediction:** This evidence shows that **distinctness is real**. Since one entity survives squashing and the other does not, they must be two distinct objects sharing matter. Constitution explains the sharing without identity.
  *   **ACH Prediction:** This evidence shows that **form is primary**. The "clay" does not survive as an actual object; only the matter persists potentially. The substance ceases upon squashing. The intuition of two objects is a cognitive error conflating matter with substance.

  ### Crux 2: Restoration vs. Replacement (Atelier Reconstruction)
  *   **Concrete Case:** The Atelier Reconstruction scenario (60% original matter, 40% new, original sketches, temporal gap).
  *   **Argument/Evidence:** The combination of material continuity (60%) and formal continuity (sketches) against the temporal discontinuity.
  *   **CC Prediction:** This evidence shows that **historical continuity is necessary for artifact identity**. Despite the material and formal links, the temporal gap means $S_1$ ceased to exist. $S_2$ is a new artifact constituted by a mixed aggregate. The sketches determine the *kind*, not the *numerical identity*.
  *   **ACH Prediction:** This evidence shows that **substantial form determines identity**. Because the form is reinstated via the original protocols and the matter is predominantly continuous, the numerical identity of the substance is restored. The temporal gap is accidental to the substance's identity provided the form is re-instantiated on continuous matter.

  ## 4. Verbal Dispute Flagging

  We identify one portion of our dispute that may be merely verbal, though it reflects deeper substantive commitments:

  *   **Disputed Term:** "Object" vs. "Substance."
  *   **Justification:** The Constitutionalist uses "object" to refer to any entity with persistence conditions and spatial location (leading to a count of two). The Hylomorphist uses "substance" to refer to a unified act of being (leading to a count of one).
  *   **Assessment:** While this terminological difference is real, it is **not merely verbal**. It reflects a substantive disagreement about the structure of reality. The Constitutionalist believes reality contains overlapping entities with different modal profiles. The Hylomorphist believes reality contains unified composites where matter and form are ontological principles, not separate entities. Therefore, while we use different vocabularies, we are disagreeing about the *furniture of the world*, not just the labels we apply to it. We agree to retain our respective terminologies to preserve the precision of our ontological commitments.
