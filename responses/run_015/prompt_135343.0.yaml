  ### Preliminary Brainstorming

  **1. Shared Formal Commitments**
  Both camps must agree on the basic logical and metaphysical framework to ensure the dispute is substantive rather than categorical.
  *   **Leibniz's Law:** Both accept the Indiscernibility of Identicals. If $x = y$, they share all properties.
  *   **Spatiotemporal Location:** Both agree the statue and the clay occupy the same region of space at the same time (in the classic case) and that the reconstruction occupies a specific region after a gap.
  *   **Existence of Materials:** Both agree the clay fragments exist materially.
  *   **Causal History:** Both agree the original statue was destroyed and the reconstruction was caused by human action guided by sketches.
  *   **Adequacy Condition:** An adequate ontology must account for modal differences (e.g., survivability of clay vs. statue) without violating logical laws.

  **2. Exact Ontological Divergence**
  The adversarial core is not about whether there is "something" there, but about *how many* material objects exist in that location and how they relate.
  *   **Constitutionalist:** Asserts **Numerical Distinctness**. The statue and the clay are two distinct objects that share matter. They coincide. Their identity conditions differ (modal properties diverge).
  *   **Anti-Coincidence Hylomorphist:** Asserts **Substantial Unity**. There is only one substance here. The "clay" is matter potentialized by "statue-form." They are not two objects; they are principles of one object. Coincidence of distinct objects is impossible.

  **3. Under-discussed Crux in Reconstruction**
  The **Atelier Reconstruction** introduces a tension between *Material Continuity* (60% original clay) and *Formal Continuity* (original sketches/protocols).
  *   **The Crux:** Does the *informational structure* (the sketches/protocols) suffice to reinstantiate numerical identity across a temporal gap when combined with majority material continuity, or does the *temporal gap* itself sever identity regardless of form and matter?
  *   **Why under-discussed:** Most debates focus on total replacement (Ship of Theseus) or total destruction. The specific mix of partial matter + exact formal protocol + discontinuity tests the weight of "form" vs. "historical existence" in a way standard cases do not.

