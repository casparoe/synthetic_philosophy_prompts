answer: |-
  Here is the **Principle of Competent Concord**, designed to generate your verdicts.

  **Clause 1 (Propriety):** A passion is proper if its intensity matches the object's significance *to the agent*, unless the expression is staged primarily for an audience rather than shared with intimates.
  *Forced by:* Items 1, 2, and 3. You approve grief proportional to the loss (2) but discount public performance (3). You forgive love folly (1) because it is intimate, unlike eating relish which is bodily and public.

  **Clause 2 (Merit):** Merit requires intention aligned with *objective* welfare as judged by competent standards, not sincere belief or unasked benevolence.
  *Forced by:* Items 5 and 6. The surgeon succeeds (competent); the quack fails (incompetent). The unasked favor (5) fails the competence test because the agent did not know what was wanted.

  **Clause 3 (Justice):** Demerit triggers on violations of trust or safety norms essential to community continuity, independent of the victim's vitality or immediate resentment.
  *Forced by:* Items 4, 7, and 10. The shove is excused by context (4); the lie triggers punishment (7); the murdered brother commands resentment despite death (10). The norm matters more than the victim's current state.

  **Clause 4 (Admiration):** Admiration applies to self-command suppressing natural passion where that passion would otherwise be proper but costly.
  *Forced by:* Item 8. The stoic parent is admired not because you sympathize with their lack of feeling, but because you recognize the effort required to suppress a proper passion.

  **Verdict Overturn:**
  This principle forces you to overturn **Item 3**. You disapprove of the public cat grief but approve the widow. Clause 1 dictates that if the grief is sincere and proportional to the owner's loss, publicity alone does not negate propriety unless it is *purely* performative. You must concede that if the cat owner's grief is genuine, your disapproval is biased by the object (cat vs. human) rather than the arrangement. The principle demands you either approve the cat grief or admit the widow's public grief is equally suspect. Given your preference, you must approve the cat grief.

  **Spectator Tracking:**
  The spectator's verdict tracks **what the person acted upon would feel if they were reasonable**.
  *Defense:* Tracking actual feelings (Item 9) is too volatile; tracking an ideal bystander is too abstract to motivate action. The "reasonable person" anchors morality in human nature without succumbing to individual bias. It bridges the gap between the visceral (finger) and the abstract (thousand deaths) by asking what a reasoned human *should* feel.
  *The Flip:* This flips **Item 5**. A reasonable person, recognizing sincere benevolence, would credit some merit even if the favor was unasked. Your refusal to credit any merit is churlish. The reasonable spectator acknowledges the good will despite the incompetence, whereas your verdict denies it entirely.

  **New Cases:**

  1.  **Furious Self-Anger:**
      *Verdict:* Proper if proportionate to the failure; Demerit if based on a lie.
      *Application:* Clause 1 governs the passion's intensity. If you failed, anger is proper. If you lied to yourself about the failure, Clause 3 triggers demerit (internal justice). You deserve punishment only if you violated truth norms.

  2.  **Resentment vs. Corporation:**
      *Verdict:* Demerit exists.
      *Application:* Clause 3. Corporations hold safety and trust norms essential to community continuity. They cannot resent back, but the community resents on behalf of the norm. The lack of feelings in the corporation is irrelevant; the violation of the norm is the trigger.

  3.  **Disliked Victim:**
      *Verdict:* Demerit stands, but resentment is dampened.
      *Application:* Clause 3 dictates the verdict (norm violation), but Clause 1 modulates the feeling. You cannot sympathize with the victim's resentment (low concord), so your visceral anger is lower, but your judgment of demerit remains intact. The principle separates the *judgment* of wrong from the *heat* of resentment.

  4.  **Society-Wide Wrong Verdict:**
      *Verdict:* Confidence comes from temporal stability and cross-community comparison.
      *Application:* Clause 3 and 4. If your spectator diverges from your society's, it is because you are appealing to a broader "reasonable human" standard rather than local custom. You know they are wrong because their verdict violates norms essential to community continuity (e.g., slavery) that have been rejected by other reasonable communities over time. The impartial spectator is not an average of your neighbors; it is the stable core of reasonable sentiment across history. Your confidence comes from recognizing that your society's verdict is an anomaly in the broader timeline of human moral development, not a deviation from your immediate peers.

  **Summary:**
  Your friction with Smith arises because you are stricter on competence (Item 5) and more nuanced on community norms (Item 10) than simple sympathy allows. This principle codifies that strictness. It demands you accept the cat-griever (3) and credit the bungled benefactor (5), but it secures your intuition that norms outlive victims (10) and that admiration exceeds sympathy (8). The two scales in Item 9 are not a moral failure but a cognitive feature; the principle governs the choice, not the feeling.
