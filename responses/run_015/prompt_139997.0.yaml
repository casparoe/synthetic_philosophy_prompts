answer: |-
  Here is the breakdown of where your view is vulnerable, sorted from fatal to manageable.

  ### 1. The Fatal Counter-Example: Environmental Sorting without Physical Continuity
  You require a physical inheritance channel (parent unit $\to$ offspring unit) to count as a unit of selection. You rule out aggregation groups because they lack this channel, even if they show fitness differences.

  **The Counter-Case:** Imagine a system where groups dissolve completely every generation (no physical bottleneck, no scaffold, no persistent individuals), but the **environment acts as a perfect memory**.
  *   **Scenario:** Groups form randomly. They produce a waste product. The environment retains this waste product for one generation. The concentration of waste in a patch determines the probability that specific genotypes will migrate into that patch to form the *next* group.
  *   **Outcome:** There is perfect fidelity of group composition across generations. There is strong group-level selection. Altruism evolves rapidly.
  *   **Your Verdict:** There is no physical channel at the group level (no parent group, no scaffold, just environmental chemistry). Therefore, not a unit of selection.
  *   **The Problem:** Evolution is occurring at the group level. The group trait is heritable. The system responds to group-level fitness differences. By denying this is a "unit of selection," you are defining "unit" in a way that excludes actual evolutionary dynamics. You are prioritizing the *mechanism of copying* (physical continuity) over the *fact of inheritance* (statistical fidelity).
  *   **Why it costs the most:** If you concede this counts, your "bottleneck/physical channel" requirement dissolves into "any mechanism that creates statistical fidelity." If you deny it, you are claiming evolution can happen without a unit of selection, which undermines the utility of your criterion for explaining evolutionary change.

  ### 2. The Scaffold Move: The Collapse into Niche Construction
  You worry that counting the persistent scaffold makes the view unfalsifiable and collapses into "everything is group selection." You are right to worry, but the collapse is specific.

  **The Slippery Slope:**
  *   **Your Distinction:** You try to separate the scaffold (part of the life cycle) from background conditions (soil, climate).
  *   **The Leak:** The only functional difference between a "scaffold" and a "modified environment" is who built it and how specific the effect is. A beaver dam is a scaffold. A termite mound is a scaffold. A patch of soil acidified by a specific plant lineage is a scaffold.
  *   **The Consequence:** If you accept the scaffold as a group inheritance channel, you must accept **Niche Construction** as heredity. This doesn't necessarily collapse into deflationism, but it does explode the category of "Group."
  *   **The Defeater:** The collapse becomes fatal if you cannot distinguish between *group-level inheritance* and *individual-level extended phenotype*.
      *   If the scaffold is built by individuals, and recolonization is driven by individual responses to the scaffold, an individual-selection model can capture this perfectly (Gene $\to$ Scaffold $\to$ Gene).
      *   To insist this is *Group* Selection, you must show that the scaffold's persistence is decoupled from the specific individuals that built it.
      *   **The Test:** If the scaffold persists even if the original builders are removed, and it biases *any* subsequent group, it is a group-level channel. If it degrades without the specific builders, it is an individual extended phenotype.
      *   **Your Risk:** If you count the scaffold as a channel, you must admit that "Group Selection" is ubiquitous wherever niche construction exists. This isn't logically false, but it renders the term "Group Selection" useless for distinguishing social evolution from ecological engineering. You lose the ability to say "This is special."

  ### 3. Predictive Divergence: Where the Models Part Ways
  You asked where the group-level vs. lower-level descriptions come apart in prediction under identical parameters.

  **The Hard Truth:** Mathematically, they do not. The Price Equation partitions are equivalent. If you specify all variables correctly, both models predict the same $\Delta z$. If your group model predicts something different from your individual model, one of them is misspecified.

  **The Only Real Divergence: Dynamic Stability and Time-Lags.**
  The descriptions diverge not in the *equilibrium* state, but in the **trajectory and resilience** when parameters are perturbed.
  *   **Inertia:** A model that includes a group-level channel (like your scaffold) predicts **evolutionary inertia**. If the environment changes suddenly, the group trait will persist longer than an individual-only model predicts, because the scaffold buffers the selection pressure.
  *   **The Prediction:** An individual-only model (assuming random group formation) will predict a rapid collapse of altruism if individual mortality spikes. A group-channel model will predict sustained altruism because the scaffold maintains the group structure despite individual turnover.
  *   **The Catch:** You can salvage the individual model by adding "environmental state" as a variable. But doing so effectively turns the individual model *into* a group-channel model.
  *   **The Verdict:** The divergence is not ontological; it is **heuristic**. The group-level description is more robust to omitted variable bias regarding the scaffold. If you ignore the channel, you overestimate the rate of trait loss. That is the only empirical ground you stand on: the individual model *without* the channel parameter fails to predict the rate of change.

  ### 4. Concession Strategy: The Lab Mate's Objection
  Your lab mate says the channel business is metaphysical decoration on an accounting identity. Here is how you should split the difference.

  **Concede This:**
  *   Admit that the Price Equation partitions are always mathematically valid. You cannot claim that group selection is "real" only when your criterion is met. The covariance exists regardless of the channel.
  *   Admit that "Unit of Selection" is not a natural kind like "Electron." It is a modeling choice.

  **Defend This:**
  *   Argue that **Accounting $\neq$ Mechanism.** The Price Equation tells you *that* change occurred. The Channel Criterion tells you *what can sustain* that change.
  *   **The "Can't Lose" Patch:** Your worry is that you've patched the view so it can't lose. The fix is to tie the criterion to **Evolvability**, not just Selection.
      *   **Claim:** "A level is a genuine unit of adaptation (not just selection) only if it has a channel."
      *   **Why:** You can have transient selection at a level without a channel (e.g., one-off environmental sorting). But you cannot have **cumulative adaptation** without a channel.
      *   **Reply to Mate:** "You are right that selection can be partitioned anywhere. But I am not defining selection; I am defining **evolvability**. Without a channel, the group cannot accumulate complex adaptations. It can only reflect lower-level dynamics. My criterion distinguishes levels that can *innovate* from levels that merely *filter*."

  ### Summary of Vulnerabilities
  1.  **Fatal:** If you deny that "Environmental Sorting" (perfect fidelity without physical continuity) counts as a channel, you are denying evolution is happening. You must broaden "channel" to include "information persistence," which weakens your bottleneck requirement.
  2.  **Awkward:** The scaffold move forces you to accept Niche Construction as Heredity. This makes group selection ubiquitous. You must embrace this or draw an arbitrary line between "scaffold" and "environment."
  3.  **Predictive:** You cannot claim different equilibrium outcomes. You can only claim different **rates of response** (inertia) due to the channel's buffering capacity.
  4.  **Metaphysical:** Concede the accounting identity. Pivot to **Evolvability**. The channel is not required for selection to act momentarily; it is required for selection to build complexity over time.

  **The Costliest Move:**
  Insisting that a physical bottleneck is necessary. If you hold that, the "Environmental Sorting" case falsifies you. If you drop it to allow "information persistence," you risk the ubiquity collapse. The only stable position is to define the channel as **decoupled fidelity**: the group trait must be transmitted with higher fidelity than the individual traits alone would allow. If the scaffold does that, it counts. If it doesn't, it's just background. Make *decoupling* your criterion, not physical bottlenecks.
