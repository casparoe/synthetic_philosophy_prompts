      *   **Request:** The case *against* this view. Specifically, what would have to be true for the user to be wrong?
      *   **Constraints:** Set aside "boring" failures (monetary cost, time, attention, lying). Focus on *structural* defeaters.
      *   **Specific Cases Provided:**
          1.  Oncologist (information shrinks feasible act set via psychological constraint).
          2.  Ignorance as commitment (negotiator/kidnap).
          3.  Disposition destruction (learning about oneself changes the self).
          4.  Unforeseen concepts (state space expansion/refinement beyond partition).
      5.  **Specific Questions to Answer:**
          *   Which are genuine defeaters vs. strawmen?
