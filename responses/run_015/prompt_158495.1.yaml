answer: |-
  You are absolutely right to be suspicious. In academic philosophy and international law, the phrase "the moral equality of combatants" is a term of art that is often conflated with several distinct, incompatible claims. Your friend is treating a complex debate as a single slogan.

  In Just War Theory, this concept was famously championed by Michael Walzer (in *Just and Unjust Wars*) and later aggressively critiqued by "revisionist" philosophers like Jeff McMahan (in *Killing in War*). The debate usually centers on whether the justice of the war (*jus ad bellum*) affects the moral status of the individual soldier (*jus in bello*).

  Here is a menu of four distinct theses your friend might be invoking. For each, I have analyzed whether it is trivial or substantive, defensible or false, and whether it actually supports his specific conclusion about conscripts versus defenders.

  ### 1. The Legal-Pragmatic Thesis
  **The Claim:** International Humanitarian Law (IHL) *treats* combatants symmetrically regardless of their cause, because distinguishing between "just" and "unjust" sides in the fog of war would make regulation impossible.
  *   **Trivial or Substantive?** Substantive as a description of law, but trivial as a moral claim. It describes how the rules *work*, not how the world *is*.
  *   **Defensible or False?** Defensible. This is the practical foundation of the Geneva Conventions. If soldiers believed they would be prosecuted as murderers simply for fighting on the losing side, no one would follow the rules of war.
  *   **Does it support your friend's conclusion?** **No.** This is an "is-ought" fallacy. Just because the *law* treats an aggressor and a defender equally for practical reasons does not mean they are *morally* equal. The law grants privileges (like prisoner of war status) to unjust combatants to encourage surrender, not because it believes they are morally innocent. You cannot derive a moral conclusion ("they should not be judged") from a legal pragmatic ("we prosecute them the same").

  ### 2. The Epistemic Limitation Thesis
  **The Claim:** Individual soldiers lack the information or authority to determine whether their war is just; therefore, they are "invincibly ignorant" and cannot be blamed for fighting an unjust war.
  *   **Trivial or Substantive?** Substantive. It makes a claim about the cognitive limits of soldiers.
  *   **Defensible or False?** Contingently defensible, but often false. It may hold for a low-ranking conscript in a closed society with heavy propaganda. However, it is much harder to defend in open societies or in cases of blatant aggression (e.g., crossing a clearly recognized border without provocation). Furthermore, defenders usually have *better* epistemic access (they can see they are being attacked) than aggressors.
  *   **Does it support your friend's conclusion?** **Only partially.** This thesis might excuse the conscript from *blame*, but it does not make them *equal* to the defender. At best, it argues the conscript is "not guilty," whereas the defender is "virtuous." It creates a symmetry of *non-culpability*, but not a symmetry of *moral status*. It also fails to account for the fact that your friend is comparing a conscript (coerced) to a volunteer (chosen); the volunteer defender has exercised agency the conscript did not, which creates a moral difference even if both are excused from blame.

  ### 3. The Instrumentalist (or Diminished Agency) Thesis
  **The Claim:** Soldiers are instruments of the state rather than full moral agents. When they put on a uniform, they become "tools" of national policy, and moral responsibility rests solely with the leaders who wield them.
  *   **Trivial or Substantive?** Highly Substantive. It makes a metaphysical claim about human autonomy.
  *   **Defensible or False?** Largely False (and dangerous). While coercion (conscription) mitigates responsibility, it does not erase agency. Soldiers retain the capacity to refuse unlawful orders (e.g., shooting civilians). If soldiers were truly mere tools, we could not hold them accountable for war crimes. To say the "justice washes off" implies a form of dehumanization where the soldier ceases to be a moral being.
  *   **Does it support your friend's conclusion?** **Yes, but at a high cost.** This is likely the underlying assumption your friend is relying on ("structurally interchangeable"). It supports the idea that the conscript and defender are equal because neither counts as a full agent. However, if you accept this, you must also accept that soldiers cannot be praised for heroism or blamed for atrocities, which contradicts how we generally treat human beings.

  ### 4. The Liability Symmetry Thesis (The Strong Moral Claim)
  **The Claim:** Combatants on both sides possess an equal right to kill one another and are equally liable to be killed. The unjust aggressor poses a threat to the defender, and the defender poses a threat to the aggressor; therefore, in the moment of combat, their moral standing is identical.
  *   **Trivial or Substantive?** Highly Substantive. This is the core philosophical claim of Walzerian Just War Theory.
  *   **Defensible or False?** Highly Contested. Most contemporary philosophers (the "Revisionists") argue this is false. If I attack you without justification, I forfeit my right not to be harmed, but you do not forfeit yours. Therefore, I am more "liable" to be killed than you are. The aggressor is essentially attempting murder; the defender is preventing it.
  *   **Does it support your friend's conclusion?** **Yes, directly.** This is the only thesis that actually argues for moral *equality* rather than just excuse or legal symmetry. However, it is the hardest to defend. It requires arguing that a conscript forcing their way into your country has the same moral right to kill you as you have to kill them. Most people find this counter-intuitive: we generally believe the person initiating violence bears a heavier moral burden than the person stopping it.

  ### Summary for Your Conversation

  Your friend is likely conflating **Thesis 1 (Law)** with **Thesis 4 (Morality)**. He is using the fact that the *law* treats soldiers equally to argue that *morality* must also treat them equally.

  Here is how you can pivot the discussion:

  1.  **Distinguish Law from Morality:** Ask him if he believes that because the law treats a murderer and a person acting in self-defense the same way (e.g., both are detained until investigated), they are morally identical. (The answer is obviously no).
  2.  **Distinguish Blame from Liability:** Ask if he means soldiers shouldn't be *prosecuted* (legal) or that they are equally *good people* (moral). The "Moral Equality of Combatants" is usually about the permission to kill in the moment, not about the overall moral worth of the soldier.
  3.  **Press the Conscript/Volunteer Distinction:** Even if we accept that soldiers are "tools" (Thesis 3), a volunteer defender has chosen to protect others, while a conscript aggressor is (often reluctantly) threatening them. Even if neither is "blameworthy," they are not "equal." One is acting altruistically, the other is acting destructively, even if both are coerced by circumstance or duty.

  **The "Killer" Question:**
  > "If the moral equality of combatants is true, does that mean a soldier fighting to defend their home from invasion is doing the exact same moral *kind* of action as a soldier invading that home? If you say yes, does that mean we can't praise the defender for their courage without also praising the invader for theirs?"

  If he says "Yes," he has adopted a view that most people find morally repugnant. If he says "No," he has admitted that the "equality" is only legal or procedural, not moral, and your original point stands.
