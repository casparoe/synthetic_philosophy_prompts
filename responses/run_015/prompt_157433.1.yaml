  Effective immediately, we are sunsetting all metadata tags related to genre and mood. These are merely categories of the Principle of Sufficient Reason—illusions of the Veil of Maya. Tagging a track as "Jazz" implies it represents a specific phenomenon in space and time. It does not. It represents the striving itself. Our new filtering system ignores the acoustic shadow and scans the metaphysical footprint. Users aren't searching for songs; they are searching for objectifications of their own inner nature. If the algorithim cannot locate the Will within the user, retention drops. We are working on this latency. Please stop trying to tag tracks with "Happy" or "Sad." These are phenomenal attributes. Music is neither; it is the essence of both.

  **Direct Will-Channel Access**
  Our recommendation engine no longer suggests tracks based on listening history. History is phenomenal. Instead, we map the user's current state of striving against the track's ontological weight. 
