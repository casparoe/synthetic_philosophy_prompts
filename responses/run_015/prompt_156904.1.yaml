  *   **Severity:** The error in (b) is conceptual but common; the error in (c) is technical but decisive. Since (c) asks for a proof or counterexample of a specific claim, providing a false proof for a false claim warrants a heavy penalty.
  *   **Recommendation:** Do not curve this up to a B range. The student can calculate posteriors but does not understand the epistemic conditions of the theorem or the stability of Bayesian conditioning. The 14/25 score reflects full credit for the mechanics (a) and partial credit for the setup in (b) and (c), with heavy deductions for the false theoretical claims.

