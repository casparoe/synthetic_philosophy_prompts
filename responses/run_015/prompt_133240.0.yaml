      *   *Diagnosis:* The deadlock is **Categorial**. It's a clash between *Spacetime Realism* (the manifold is the ontology) and *Temporal Primitivism* (time/flow is the ontology). They are talking past each other because they disagree on what physical theory *does*.
          *   Eternalists: Physics tells us what exists.
