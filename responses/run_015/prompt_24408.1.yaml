answer: |-
  This is a sophisticated impasse. You have correctly identified that the standard rationalist prescription ("always take the outside view") is a heuristic, not a law, and that its failure modes are under-theorized. The literature (Kahneman, Tetlock, Garfinkel) often glosses over the mechanics of *when* to abandon the outside view because doing so opens the door to bias.

  If I were mentoring this project for a year, I would structure your inquiry not as a debate between Inside View (IV) and Outside View (OV), but as an engineering problem: **How do we build a stable epistemic engine that uses both without crashing?**

  Here is the prioritized agenda, ordered by logical dependency (upstream/downstream) and tractability for a independent researcher.

  ### 1. How do we constrain reference class selection to prevent cherry-picking?
  **Priority:** First (Upstream Foundation)
  **Reasoning:** This is the methodological gatekeeper. You cannot test whether the IV overrides the OV if the OV is a moving target. Currently, "reference class tennis" (picking the class that suits your argument) is the biggest vulnerability of the outside view. If this isn't solved, any conclusion you draw about IV vs. OV is suspect because your baseline is unstable.
  **Tractability:** High. You don't need new data; you need to analyze past failures. Look at cases where experts disagreed on the base rate (e.g., predicting startup success, geopolitical events). Categorize *why* they picked different classes. Can you derive rules (e.g., "choose the narrowest class with N>30") that reduce variance?
  **What changes my mind:** If you demonstrate that reference class selection is inherently subjective across all domains (i.e., no objective criteria exist even in principle), then this question is a dead end. In that case, Priority 2 becomes the new upstream foundation, because we must rely entirely on the quality of the IV.

  ### 2. What specific causal knowledge validly overrides a base rate?
  **Priority:** Second (Theoretical Core)
  **Reasoning:** Once you have a stable OV (from Q1), you need to know when to ignore it. This addresses your worry about IV being "just rationalization." The IV is only legitimate when it identifies a *causal mechanism* that breaks the statistical correlation of the reference class. For example, a base rate says "most restaurants fail." The IV says "this restaurant has a patented technology that lowers food costs by 50%." That is a causal break. If the IV is just "the chef is passionate," that is not a causal break; it's rationalization.
  **Tractability:** Medium. This requires reasoning about causal inference. You can create a taxonomy of "valid overrides" vs. "invalid overrides" using historical case studies.
  **What changes my mind:** If you find that "causal knowledge" is itself too noisy to trust compared to base rates, then the answer is "almost never," and the project shifts to maximizing OV adherence.

  ### 3. How do we algorithmically or heuristically combine the two views?
  **Priority:** Third (Synthesis)
  **Reasoning:** This is downstream of Q1 and Q2. You can't build a weighting mechanism (e.g., "70% OV, 30% IV") if you haven't defined how to calculate the OV (Q1) or when the IV is valid (Q2). Most people fail here because they treat IV and OV as competing narratives rather than inputs to a function.
  **Tractability:** Low/Medium. This is where most formal models fail. For a senior project, avoid trying to create a mathematical formula. Instead, propose a qualitative checklist or decision tree based on your findings from Q1 and Q2.
  **What changes my mind:** If Q1 and Q2 reveal that the views are incommensurable (cannot be compared on the same scale), then integration is impossible, and the goal shifts to "switching" rather than "combining."

  ### 4. How do we calibrate confidence when no reference class exists?
  **Priority:** Fourth (Edge Case)
  **Reasoning:** This is the "unique event" problem. It feels urgent because of overconfidence, but it is logically downstream. It is essentially a special case of Q2 where the OV weight is forced to zero. You need to understand the normal relationship (Q1-Q3) before you can understand the breakdown condition.
  **Tractability:** Low. There is little data on "first-of-its-kind" events by definition. This is mostly philosophical reasoning.
  **What changes my mind:** If your project focuses specifically on innovation or existential risk (where unique events are the norm), this moves to Priority 1. For general reasoning, it remains an edge case.

  ### Summary of Logic
  The ordering is driven by **dependency**. You cannot weigh the IV against the OV (Q3) if you cannot define the OV objectively (Q1) or validate the IV's causal claim (Q2). Q1 is the most upstream because it is the prerequisite for even setting up the comparison. It is also the most tractable for a year-long project because you can audit existing arguments rather than needing to generate new predictions.

  If I were you, I would spend the first quarter exclusively on Q1. If you can produce a robust heuristic for "Reference Class Stability," you have already made a meaningful contribution, even if you never fully solve the integration problem.

  Verdict: How to stabilize reference class selection
