          *   *Status:* Contested (Block's Overflow vs. Dennett's Global Workspace).

      *   *Idea 2: The Incoherence of "Belief" without Phenomenology.* HP treats reports as beliefs. But do beliefs require phenomenology? If "believing you see red" requires *actually* seeing red to make sense, HP is circular.
