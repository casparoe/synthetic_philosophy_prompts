  2.  **Deconstruct Heterophenomenology (HP):**
      *   *Core Claim:* The only access we have to consciousness is via third-person observation of behavior (including speech acts/reports). We construct a "subject's world" based on these reports, but we remain neutral on whether that world matches reality.
      *   *Methodological Stance:* Agnostic about the ontological status of qualia, focused on the *belief* in qualia.
