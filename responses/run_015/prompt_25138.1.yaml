      *   *Unreportability:* What if there are conscious states that *cannot* be reported even in principle? (Zombie judgments, subconscious processing that feels like consciousness).
      *   *The "Hard Problem" Resurrection:* What if explanatory gaps turn out to be ontological gaps?
      *   *Neuroscientific Discrepancy:* What if neural correlates show something completely disjointed from reports? (Already happens, but what if it's radical?)
      *   *Semantic/Conceptual Collapse:* What if the concept of "belief" used in HP is incoherent without the very phenomenology it brackets?
      *   *Animal/Infant Consciousness:* HP relies on language. What if consciousness exists without language?
      *   *Self-Verification:* What if the act of reporting *creates* the experience in a way that makes the "neutral stance" impossible?

  4.  **Filtering & Ranking (Decisive vs. Awkward):**
      *   *Decisive:* Something that breaks the method's ability to function or proves its core axiom false.
      *   *Awkward:* Something that makes the method clunky or limited, but not useless.
      *   *Settled vs. Contested:* Need to be careful. Neuroscience findings are "settled" data, but their interpretation is contested. Philosophical arguments are rarely "settled."

  5.  **Drafting the Categories (Iterative Process):**

