          *   *Status:* Highly Contested (Interpretationism vs. Realism).

      *   *Idea 3: Radical Neural Dissociation.* If brain states predict reports perfectly *without* any intermediate "experience" variable, HP becomes redundant (Eliminativism wins). But if brain states contradict reports *systematically* in a way that suggests reports are random noise, HP loses predictive power.
          *   *Rank:* Awkward to Decisive (depending on severity).
          *   *Status:* Settled (neural correlates exist), Contested (interpretation).

      *   *Idea 4: Non-Linguistic Consciousness.* HP relies on speech/text. If infants/animals are conscious but can't report, HP can't study them. Dennett has answers (evolution, design stance), but it's a limit.
          *   *Rank:* Awkward (limits scope).
          *   *Status:* Contested.

      *   *Idea 5: The "Truth" of Phenomenology.* If it turns out first-person access is *more* reliable than third-person for specific tasks (e.g., pain localization), HP's neutrality looks like a handicap.
          *   *Rank:* Awkward.
          *   *Status:* Contested.

  6.  **Refining the "Settled vs. Contested" Constraint:**
      *   I must explicitly state where philosophers agree and where they fight.
      *   *Settled:* There is no consensus on the Hard Problem. There is no consensus on the nature of qualia. There *is* settled science on neural correlates (NCC), but not on what they imply.
      *   *Correction:* I need to make sure I don't present philosophical positions as facts.

