answer: |-
  ## Pass 1: Brainstorming Candidate Requirements

  *Goal: Generate a wide net of potential constraints based on the eight cases and two jobs (Institutional vs. Individual), before filtering for metaphysical and practical utility.*

  1.  **Indiscernibility Constraint:** The theory must explain why value differs between two objectually identical items (Molecule Duplicate).
  2.  **Causal Chain Constraint:** The theory must track the physical history of production, not just the final state (Workshop/Copy cases).
  3.  **Authorization Constraint:** The theory must account for the artist's intent or sanction at the time of creation (Conceptual/Repaint cases).
  4.  **Epistemic Stability Constraint:** The theory must handle cases where provenance is probabilistic, not binary (Found Canvas/Stylometry).
  5.  **Experience Independence Constraint:** The theory must allow that aesthetic experience can remain constant while status changes (Molecule Duplicate).
  6.  **Experience Dependence Constraint:** The theory must allow that aesthetic experience can *change* when status is revealed (Forgery revelation).
  7.  **Fiduciary Constraint:** The theory must justify insurance values that exceed replacement costs (Institutional Job).
  8.  **Stewardship Loss Constraint:** The theory must register a loss when an object is destroyed unseen (Backroom Destruction).
  9.  **Medium Variance Constraint:** The theory must distinguish between media where copies are losses (Painting) and where they are not (Digital/Conceptual).
  10. **Rational Attachment Constraint:** The theory must explain why an individual is not irrational for feeling betrayed by a forgery (Individual Job).
  11. **Conservation Triage Constraint:** The theory must guide whether to restore the original surface or preserve the historical layer (Workshop case).
  12. **Deaccession Constraint:** The theory must determine if a facsimile can functionally replace the original for display purposes.

  ***

  ## Pass 2: Pruned Desiderata Specification

  *Goal: Retain only requirements that do metaphysical or decision-theoretic work. Remove redundancies (e.g., Fiduciary is a downstream effect of Scarcity + History). Remove prejudices (e.g., Experience Dependence is psychological, not ontological).*

  **Definition:** To avoid the taboo term, I will use **Source-Continuity** to denote the property often colloquially called *authenticity*. Source-Continuity refers to the unbroken causal link between the artist's generative act and the present physical object.

  ### The Desiderata List

  **1. The Causal-Historical Anchor (Non-Negotiable)**
  *   **Requirement:** The theory must locate the object's identity conditions in its specific history of production, not merely its current qualitative properties.
  *   **Motivating Cases:** *Molecule Duplicate* (why the swap is a loss); *Backroom Destruction* (why the loss is real even if unseen).
  *   **Job:** Institutional (justifies insurance beyond replacement cost); Individual (grounds the feeling of betrayal).
  *   **Status:** **Non-Negotiable.** Without this, the theory collapses into aesthetic empiricism and cannot distinguish an original from a perfect fake.

  **2. The Authorization Variance (Non-Negotiable)**
  *   **Requirement:** The theory must distinguish between *source-continuity* derived from physical execution vs. *source-continuity* derived from conceptual sanction.
  *   **Motivating Cases:** *Workshop Production* (Master underdrawing, pupil paint); *Artist Repaint* (Is the second canvas an original?); *Conceptual Art* (Instructions + Certificate).
  *   **Job:** Institutional (Conservation triage: do we preserve the master's hand or the workshop's output?); Individual (Rationality of valuing a Sol LeWitt certificate over the wall drawing).
  *   **Status:** **Non-Negotiable.** A theory that treats all media as "painting" fails the Conceptual case; a theory that treats all media as "conceptual" fails the Painting case.

  **3. The Epistemic Risk Tolerance (Preference: Institutional)**
  *   **Requirement:** The theory must provide a framework for valuing objects where Source-Continuity is probabilistic rather than certain.
  *   **Motivating Cases:** *Found Canvas* (Stylometry probability); *Reattribution* (Object unchanged, status changes).
  *   **Job:** Institutional (Acquisition/Deaccession decisions under uncertainty).
  *   **Status:** **Preference (Institutional Camp).** The individual can afford binary thinking (I feel betrayed/I don't); the museum operates on risk management. A theory demanding binary certainty fails here.

  **4. The Stewardship Loss Condition (Non-Negotiable)**
  *   **Requirement:** The theory must register an ontological loss upon the destruction of the source-continuous object, regardless of public access or visual replacement.
  *   **Motivating Cases:** *Backroom Destruction* (Indistinguishable replacement installed same day).
  *   **Job:** Institutional (Conservation mandate); Individual (Rationality of caring about existence, not just experience).
  *   **Status:** **Non-Negotiable.** This is the metaphysical floor. If a theory says "no loss," it is a theory of *entertainment*, not *art stewardship*.

  **5. The Scarcity Decoupling (Preference: Economic)**
  *   **Requirement:** The theory must explain market scarcity without conflating price with Source-Continuity.
  *   **Motivating Cases:** *Digital File* (Byte-identical, transaction record differs); *Molecule Duplicate* (Price diverges, object does not).
  *   **Job:** Institutional (Insurance/Valuation).
  *   **Status:** **Preference (Market Camp).** This is often a proxy for the Causal-Historical Anchor. If the theory secures #1, #5 is usually derivative. However, in NFT/Digital contexts, #5 becomes primary.

  ***

  ## Analysis of Registers and Constraints

  You asked to separate the registers and identify which the word "better" tracks in ordinary claims.

  1.  **Aesthetic/Experiential Register:** Tracks *qualitative properties*.
      *   *Ordinary Claim:* "This looks like a Rembrandt."
      *   *Theory Status:* Necessary but insufficient. Fails the *Molecule Duplicate* and *Backroom Destruction* cases if used alone.
  2.  **Art-Historical Register:** Tracks *Causal-Historical Anchor* and *Authorization Variance*.
      *   *Ordinary Claim:* "This *is* a Rembrandt."
      *   *Theory Status:* This is where the word "better" (as in "better to have the original") does its heavy lifting. It tracks the specific causal history of production.
  3.  **Scarcity/Economic Register:** Tracks *market rarity* and *transactional history*.
      *   *Ordinary Claim:* "This is worth more."
      *   *Theory Status:* Often a proxy for the Art-Historical register, but diverges in Digital/Conceptual cases.

  ### Evaluation of Your Candidate Desideratum
  *Candidate:* "A theory must explain why the backroom destruction above is a loss at all."

  *Verdict:* **Real Desideratum.**
  This is not a prejudice; it is the **Stewardship Loss Condition (#4)** in the pruned list. It is the specific test case that kills **Reception Theories** (e.g., strict aesthetic empiricism or institutional theories that rely on public conferral of status).
  *   **Who fails it:** Any theory that defines art value primarily through viewer experience or public recognition. If no one sees the swap, and the experience is identical, a reception theorist must concede no loss occurred. A museum cannot accept this; their fiduciary duty is to the *object's history*, not just the *viewer's retina*.
  *   **Who passes it:** Historical/Essentialist theories (Levinson, Danto) and Conservation Ethics. They posit that the object *is* its history. Destroying the history destroys the object, regardless of the replacement's qualities.

  ### Conflicts and Prejudices

  **1. The Binary vs. Probabilistic Conflict**
  *   **Conflict:** The *Causal-Historical Anchor* implies a binary state (either it has the history or it doesn't). The *Epistemic Risk Tolerance* requires handling probabilities (Stylometry).
  *   **Resolution:** A robust theory must separate *ontology* (what the object is) from *epistemology* (what we know about it). The museum job requires acting on the epistemology; the individual job often reacts to the ontology.
  *   **Prejudice Flag:** The demand for *absolute certainty* in attribution is a prejudice of the 19th-century connoisseur model. Modern conservation accepts "Studio of" or "Circle of" as stable categories. A theory demanding binary attribution is inadequate for the Institutional Job.

  **2. The "Betrayal" vs. "Experience" Conflict**
  *   **Conflict:** The Individual Job asks why it is rational to feel betrayed (Experience Dependence). The Aesthetic Register says the experience was identical before the reveal.
  *   **Prejudice Flag:** The idea that one *should* feel betrayed is a social norm, not a metaphysical necessity. A theory can explain the *source* of the feeling (violation of Causal-Historical Anchor) without endorsing the feeling as rationally mandatory.
  *   **Constraint:** The theory must explain the *logic* of the betrayal, not necessarily validate the *intensity* of it.

  **3. The Digital Divergence**
  *   **Conflict:** In *Digital Files*, the Causal-Historical Anchor is often replaced by the *Scarcity Decoupling* (the blockchain record).
  *   **Prejudice Flag:** Insisting that digital art must have a "physical original" is a prejudice of the painting model.
  *   **Constraint:** The theory must be medium-sensitive. *Authorization Variance (#2)* handles this by allowing the "certificate" to be the source-continuous object in conceptual/digital cases.

  ### The Killer Requirement

  **The Stewardship Loss Condition (#4).**

  This requirement knocks out the most otherwise-popular theories, specifically:
  1.  **Aesthetic Empiricism:** (Value = Experience). If the replacement is indistinguishable, experience is identical. No loss. Fails.
  2.  **Pure Institutional Theory:** (Value = Artworld Status). If the swap is secret, the Artworld status remains unchanged. No loss. Fails.
  3.  **Utilitarian/Access Models:** (Value = Public Benefit). If the replacement is on display and identical, public benefit is unchanged. No loss. Fails.

  To pass this requirement, a theory must be **Ontologically Realist** about art objects: it must claim the object possesses properties (historical/causal) that are not reducible to their current perceptual effects or social standing.

  ***

  ## Scorecard of Contenders

  | Theory | Causal-Historical Anchor | Authorization Variance | Epistemic Risk | Stewardship Loss | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Goodman (Autographic/Allographic)** | **Pass** (Painting) / **Fail** (Digital) | **Fail** (Rigid binary) | **Fail** (No room for probability) | **Fail** (If indistinguishable, it's a forgery, but loss is undefined) | **Inadequate.** Too rigid for workshop/digital cases. |
  | **Danto (Artworld/History)** | **Pass** | **Pass** | **Weak** (Relies on theory/interpretation) | **Pass** (History is constitutive) | **Strong.** Best for Individual Job, weak on Institutional risk management. |
  | **Levinson (Historical Definition)** | **Pass** (Strong) | **Pass** (Intentional-historical) | **Pass** (Handles context) | **Pass** (Object is its history) | **Best Fit.** Satisfies the metaphysical needs of both jobs. |
  | **Museum Stewardship Model** | **Pass** (Operationalized) | **Pass** (Policy-based) | **Pass** (Risk matrices) | **Pass** (Fiduciary duty) | **Pragmatic Winner.** Lacks metaphysical depth but solves the Institutional Job perfectly. |

  **Recommendation:** For your post, anchor the argument in **Levinson's Historical Definition** modified by the **Museum Stewardship Model**. This combination satisfies the *Stewardship Loss Condition* (metaphysical loss exists) while providing the *Epistemic Risk Tolerance* needed for actual collection management (we act on probability). This avoids the cached rationalist move of reducing art value to "signaling" or "aesthetic qualia" alone.
