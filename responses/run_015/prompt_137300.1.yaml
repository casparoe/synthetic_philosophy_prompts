  3.  **They extend cooperation and trust to out-group members, not just to people like them.**
      *   **Score:** 85
      *   **Justification:** Modern societies require cooperation across differences, making this the practical test for civil peace.

  **Tier 2: The Context (Consolation prizes)**

  4.  **They score better on the grab-bag of vice indicators: crime, addiction, family breakdown.**
      *   **Score:** 70
      *   **Justification:** Social outcomes matter most to policymakers, though they are heavily confounded by economic and institutional factors.
  5.  **There's a tighter fit between the principles they state and what they actually do.**
      *   **Score:** 60
      *   **Justification:** Integrity is admirable, yet consistent adherence to harmful principles remains morally undesirable.

  **Tier 3: The Noise (Rhetorical decoys)**

  6.  **They help more, but mainly inside their own community.**
      *   **Score:** 40
      *   **Justification:** This confirms tribal cohesion but fails to demonstrate universal moral expansion beyond the congregation.
  7.  **They punish norm-violators more readily even when punishing costs them personally.**
      *   **Score:** 35
      *   **Justification:** Willingness to punish can signal moral commitment, yet it equally correlates with authoritarianism and vengeance.
  8.  **They have a stronger and more reliable moral self-conception — they're more sure of what's right and more committed to doing it, whatever the behaviour actually looks like.**
      *   **Score:** 20
      *   **Justification:** Subjective certainty reveals nothing about actual conduct and may merely indicate dogmatic confidence.

  ***

  ### The Echo Hypothesis

  **Damage Rating:** 0.4 (40% of the claim survives)

  **Reasoning:** It concedes the historical necessity of religion for building trust structures while preserving the claim that religion is not required for their immediate maintenance, thereby restricting the secular model to societies with a specific religious heritage.

  ***

  ### The Asymmetry of Damage

  **Most damaging negative for the religious side:** Reading 1 (Anonymous altruism).
  **Most damaging positive for the religious side (damaging secular):** Reading 5 (Vice indicators).

  **Why they differ:** The religious claim rests on internal virtue (what you do when unseen), whereas the secular claim rests on social outcomes (how safe the society is); therefore, religion dies on hidden behaviour, while secularism dies on visible crime rates.

  ***

  ### The Strategic Tell

  **The Religious Camp**
  *   **Insist on:** Reading 5 (Vice indicators).
  *   **Swap in:** Reading 2 (In-group help).
  *   **The Tell:** They will lead with national crime statistics to promise social order, but when confronted with anonymous game data, they will retreat to the volume of community volunteering to claim moral vitality.

  **The Secular Camp**
  *   **Insist on:** Reading 1 (Anonymous altruism).
  *   **Swap in:** Reading 7 (Out-group trust).
  *   **The Tell:** They will lead with laboratory evidence of equal honesty to deny religious superiority, but if individual data is contested, they will pivot to cross-national trust indices to argue that secularism produces safer societies.
