      *   *Argument 2 (Collapse Lemma):* This is a "reverse engineering" argument. Mathematically, yes, you can often find a utility function that rationalizes a behavior (revealed preference style). But this makes optimization tautological. If *any* behavior can be rationalized as optimization under *some* belief/cost structure, then "optimization" loses its bite as a normative standard. It becomes a modeling choice, not a constraint.
      *   *The "Ignoring Information" Claim:* This refers to "less is more" effects (e.g., Gigerenzer's fast and frugal heuristics). An ideal Bayesian agent *could* ignore info if it's costly, but the claim is often that simple heuristics are more *robust* to overfitting or model error than complex optimization in uncertain environments.

