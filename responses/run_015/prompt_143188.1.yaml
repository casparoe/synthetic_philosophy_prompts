      *   *Drafting Question 3:* "If the mathematical structure of a theory maps onto phenomena, does it matter if the underlying ontology (e.g., 'ether') is discarded?"
      *   *Drafting Question 4:* "When formal proofs demonstrate that standard logical definitions of 'closeness' collapse for false theories, do you: (a) reject the concept, (b) seek new metrics, or (c) shift to epistemic justification?"

  5.  **Addressing Specific Prompt Requirements:**
      *   *Unnamed Leaves:* Need to identify gaps. For example, a position that says "Absolute verisimilitude is possible but structural correspondence is irrelevant" might be unoccupied or incoherent.
      *   *Ambiguity Flags:* Structural Realism and Similarity accounts often overlap. Need to note this.
      *   *Awkward Commitments:* E.g., Niiniluoto requires a logical space definition which is hard to fix. Popper requires accepting the impossibility proof is wrong or circumvented.
      *   *Format:* Text-based tree structure (ASCII or clear indentation) suitable for an appendix.

