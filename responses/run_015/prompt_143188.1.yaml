answer: |-
  # SEMINAR HANDOUT 4.B: TAXONOMY OF VERISIMILITUDE COMMITMENTS

  **Context:** *The following decision tree maps the logical space of positions regarding scientific truthlikeness. It is designed to classify a respondent's philosophical stance based on their intuitions regarding specific theoretical scenarios, rather than their allegiance to historical figures. Positions are identified at the terminal nodes (leaves). Vacant nodes indicate logical possibilities that remain unoccupied in the contemporary literature.*

  ***

  ### I. THE ROOT COMMITMENT
  **Question:** Consider the history of physical science. Is it coherent to describe the transition from earlier, refuted frameworks (e.g., Newtonian mechanics) to current frameworks (e.g., General Relativity) as a movement *closer* to the truth, even if both are strictly false?

  *   **NO:** Scientific progress is measurable only by empirical adequacy, problem-solving capacity, or utility, not by proximity to a mind-independent truth.
      *   **→ LEAF A: Constructive Empiricism / Pessimistic Induction.**
      *   *Diagnosis:* Rejects the ontic goal of verisimilitude. Commitments: Must explain the "no miracles" argument without appealing to truth-approximation.
  *   **YES:** It is coherent to claim that a false theory can be objectively closer to the truth than its predecessor.
      *   **→ PROCEED TO NODE II.**

  ***

  ### II. THE CONTAMINATION DIAGNOSTIC
  **Question:** Consider Theory $\Alpha$, which posits a specific fundamental entity that does not exist (e.g., the luminiferous ether) but yields highly precise predictions. Consider Theory $\Beta$, which makes no claim about such entities but yields vague predictions that are strictly true. Is Theory $\Alpha$ potentially closer to the truth than Theory $\Beta$, or does the strict falsehood of $\Alpha$'s core ontology contaminate the whole, rendering proximity judgments impossible?

  *   **CONTAMINATED:** The presence of any strictly false law or ontological claim prevents the theory from bearing a positive verisimilitude relation to the world.
      *   **→ LEAF B: The Impossibility Result (Miller/Tichý Variant).**
      *   *Diagnosis:* Accepts the logical collapse of naive content measures. Commitments: Must accept that while we prefer $\Alpha$ pragmatically, we cannot say it is *truer* than $\Beta$.
  *   **ISOLATABLE:** Error can be localized, weighted, or offset by true consequences; a theory can be false yet truth-like.
      *   **→ PROCEED TO NODE III.**

  ***

  ### III. THE STRUCTURAL DIAGNOSTIC
  **Question:** If Theory $\Alpha$ is to be judged closer to the truth, is this judgment dependent on the theory's mathematical or causal *structure* corresponding to the structure of the world, or is it sufficient that the propositional content of the theory resembles the truth in terms of logical features (e.g., number of true vs. false sentences)?

  *   **STRUCTURE NECESSARY:** Correspondence of relations is required; specific ontological claims (e.g., "what is waving") may be discarded without losing verisimilitude.
      *   **→ LEAF C: Structural Realism / Similarity-Based Account.**
      *   *Ambiguity Flag:* This node converges with Similarity-Based accounts (e.g., Tichý/Niiniluoto in certain readings). The distinction between "structure" and "logical similarity" is often operational rather than foundational.
      *   *Diagnosis:* Avoids the pessimistic induction by retaining only structural commitments. Awkward commitment: Must define "structure" without implicitly reintroducing ontology.
  *   **STRUCTURE NOT NECESSARY:** Verisimilitude is a function of logical content, propositional similarity, or consequence classes, regardless of structural mapping.
      *   **→ PROCEED TO NODE IV.**

  ***

  ### IV. THE METRIC DIAGNOSTIC
  **Question:** Is the statement "Theory $\Alpha$ has high verisimilitude" meaningful in isolation (an absolute measure), or is verisimilitude exclusively a comparative relation (i.e., "$\Alpha$ is closer than $\Beta$")?

  *   **EXCLUSIVELY COMPARATIVE:** We can only rank rivals; we cannot assign a degree of truthlikeness to a single framework.
      *   **→ LEAF D: Popperian (Original/Qualified).**
      *   *Diagnosis:* Adheres to the 1963 definition but must navigate the Impossibility Result (Node II). Awkward commitment: Often requires restricting the domain of application to avoid logical collapse.
  *   **ABSOLUTELY ASSIGNABLE:** A single theory can be assigned a degree of truthlikeness (e.g., 0.85) based on its distance from the truth.
      *   **→ PROCEED TO NODE V.**

  ***

  ### V. THE FORMAL OBSTACLE DIAGNOSTIC
  **Question:** Formal proofs (e.g., Miller, Tichý) demonstrate that under standard logical definitions, a false theory cannot be closer to the truth than another. Do you regard these proofs as:
  1.  **Fatal:** Verisimilitude cannot be logically defined.
  2.  **Surmountable:** Refined metrics (e.g., distance in state-space) bypass the proofs.
  3.  **Misplaced:** The problem is ontic, but the solution is epistemic.

  *   **FATAL:** (See **Leaf B**).
  *   **SURMOUNTABLE:** Logical metrics can be refined (e.g., using min-sum measures or weighted state spaces) to quantify distance from the truth.
      *   **→ LEAF E: The Min-Sum Measure (Niiniluoto Variant).**
      *   *Diagnosis:* Commits to a specific logical geometry of possibility. Awkward commitment: Requires a privileged way to carve up "logical space" which critics argue is language-dependent.
  *   **MISPLACED (EPISTEMIC SHIFT):** Verisimilitude is not a relation between theory and world, but a relation between theory and *evidence regarding* the world.
      *   **→ LEAF F: Epistemic Deflationism.**
      *   *Diagnosis:* Reinterprets truthlikeness as estimated truthlikeness. Awkward commitment: Risks collapsing back into Leaf A (Empiricism) if the ontic goal is fully abandoned.

  ***

  ### VI. UNOCCUPIED LOGICAL SPACE
  **The following combinations of answers yield no established position in the literature:**

  *   **Absolute + Structure Irrelevant + Obstacles Fatal:**
      *   **→ LEAF G: [UNNAMED].**
      *   *Diagnosis:* **Incoherent.** Claims one can assign an absolute score to a theory while admitting the logical tools to measure it are fundamentally broken.
  *   **Comparative + Structure Necessary + Obstacles Surmountable:**
      *   **→ LEAF H: [UNNAMED].**
      *   *Diagnosis:* **Neglect.** A viable position. It would combine Structural Realism's ontology with a comparative metric, avoiding the need for absolute distance measures. Likely unoccupied due to the dominance of absolute measures in the similarity tradition.

  ***

  **Note to Participants:** *When locating your position, note that convergence between Leaf C (Structural) and Leaf E (Min-Sum) is common. The divergence lies not in practical judgment of cases, but in whether the "distance" is measured in logical state-space or causal-structural mapping.*
