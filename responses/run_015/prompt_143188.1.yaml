      *   **Constraint 2 (Content):** Leaves must identify named positions (Popper, Miller/Tichý, Niiniluoto, etc.) or mark unnamed (with diagnosis: incoherence, unattractiveness, neglect).
      *   **Constraint 3 (Phrasing):** Questions must be phrased for a respondent *without* prior knowledge of labels. Use concrete comparative cases (e.g., one false law + high prediction vs. no falsehood + weak coverage).
      *   **Constraint 4 (Nuance):** Flag ambiguities where positions converge (e.g., structural realism vs. similarity). Treat figures as nodes in a live debate, not encyclopedic entries. Highlight awkward commitments.
      *   **Constraint 5 (Format):** Suitable for a novel's appendix/handout. No bibliography/citations. Formal, polished tone.

  2.  **Deconstruct the Philosophical Landscape (Verisimilitude/Truthlikeness):**
      *   *Core Problem:* Can false theories be closer to the truth than other false theories?
      *   *Popper (1963):* Yes, defined logically (content of truth minus content of falsehood).
      *   *Miller/Tichý (1974):* Impossibility proof. Popper's definition collapses (if $A$ is false, it can't be closer to truth than $B$).
      *   *Response 1 (Logical/Similarity):* Niiniluoto (Min-sum), Tichý (Carnapian). Use distance in state spaces.
      *   *Response 2 (Structural):* Worrall, Structural Realism. It's about structure, not specific content.
      *   *Response 3 (Epistemic/Deflationary):* Van Fraassen (Constructive Empiricism - rejects truth goal), or pragmatic approximations.
      *   *Response 4 (Pessimistic Induction):* If past theories were false, why think current ones are closer? (Often leads to rejecting verisimilitude).

  3.  **Drafting the Decision Tree - Step-by-Step:**

      *   **Root Node:** Is scientific progress measurable as proximity to truth?
          *   *No:* Leads to Instrumentalism/Constructive Empiricism (Van Fraassen) or Pessimistic Induction (Laudan).
