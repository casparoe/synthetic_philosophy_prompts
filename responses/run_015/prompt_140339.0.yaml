answer: |-
  **MINISTRY OF SORTITION & CIVIC MATCHING**
  **WELCOME ABOARD: LEGISLATIVE CORPS ONBOARDING PACKET (REV. 4.2)**

  **Congratulations!**
  You have been selected via stratified random lottery to serve in the 114th National Citizens' Assembly on Agricultural Subsidies. You were not elected. You were matched. Your unique combination of income decile, postal region, housing tenure, average daily commute, and chronotype filled a critical gap in our demographic mirror. Welcome to the work of being yourself, publicly.

  **1. YOUR ROLE IN THE MIRROR**
  Our legitimacy rests on precision. The Assembly must be a statistical miniature of the nation. To ensure this, we utilize over 4,000 pages of stratification variables. You may wonder who chose these variables. They were selected by a prior Committee on Variables, chosen by lot, using criteria selected by the Committee on Committees before them. This ensures democracy all the way down.

  Please note that while we strive for a perfect reflection, minor discrepancies occur. These are handled through the **Annual Mirror Audit**. The Assembly receives a grade (A–F) on how closely its composition matches census data throughout the term. Individual member bonuses are tied to this grade. Consequently, you may find we spend significant session time recalibrating membership rather than legislating. This is not downtime; this is maintenance of the mandate.

  **2. COMPETENCE & ATTENTION EXPECTATIONS**
  **What We Ask of You:**
  *   **Attend all deliberation sessions.** (Childcare and commute stipends provided.)
  *   **Complete mandatory training modules:** *Legislation for Laypersons*, *Unlearning Lobbyist Logic*, and *How to Read a Briefing Packet Without Prior Expertise*.
  *   **Submit Influence Disclosure Forms daily.**

  No prior experience is required. In fact, prior experience in law or policy is noted in your file and "corrected for" during speaking time allocation to prevent elite capture. We recognize that most citizens do not follow politics closely. To honor this reality, we maintain an **Inattentive Quota**. You indicated on your selection survey that you spent under ten minutes in the past year thinking about politics. This qualifies you for a reserved seat. A chamber that mirrors the people must mirror how little most people think about them. Your fresh ignorance is a vital resource.

  **3. INTEGRITY & THE SHADOW PROGRAM**
  You have no donors. You face no re-election. There is no one to impress but the census. However, to isolate the causal effect of deliberation, you have been paired with a **Shadow**.

  Your Shadow is a statistically identical citizen who receives your salary to stay home. They vote on every measure based on their initial, undeliberated instincts. Their counterfactual votes are read into the official record alongside yours. Occasionally, your Shadow will vote differently than you do after three weeks of briefing. This data point is logged quietly. No comment is made during session.

  Regarding influence: while there are no campaigns, influence naturally flows toward those who structure the conversation. Please log all interactions with Briefing Drafters and Moderation Staff on your Disclosure Form. They are neutral facilitators, but their control over the docket is absolute. Transparency is key.

  **4. TERM LIMITS & SCOPE**
  Your Assembly is single-issue and time-limited. You are authorized to legislate on Agricultural Subsidies only. You are not authorized to coordinate with the concurrent Assembly on Transport Infrastructure. Please be aware that if the Transport Assembly's remit expires before yours, any subsidy clauses requiring road upgrades will quietly die. This is not a bug; it is a firewall against factional bundling.

  **5. OPTING OUT**
  Declining service is your right. However, please note that decliners are replaced by redrawing the lottery. This means the seated pool is statistically somewhat more willing than you are to serve. We mention this only to reassure you that your replacement will be just as representative, albeit slightly more eager.

  ***

  **FREQUENTLY ASKED QUESTIONS**

  **Q: What if I change my mind about my demographic data?**
  A: Please submit a Form 12-B. Note that changing your income bracket may require you to vacate your seat immediately to preserve the Mirror Audit score.

  **Q: Can I propose laws outside my remit?**
  A: You may propose them, but they will be routed to the Ministry of Archiving. If the relevant Assembly has dissolved, the proposal enters the permanent inactive ledger.

  **Q: Why does my Shadow get paid the same as me?**
  A: To ensure their counterfactual baseline remains economically stable. A stressed Shadow is not a valid control variable.

  **Q: Who writes the briefing materials?**
  A: The Civil Service Bureau of Information. They are non-partisan. They decide which experts are "balanced." You are welcome to suggest experts, though selection is managed to prevent donor-adjacent bias.

  **Q: Is this real democracy?**
  A: It is real description. The rest is procedure.

  ***

  **We are thrilled to have you. Please swipe your badge at the moderator's desk. Do not speak to the Shadows in the hallway.**
