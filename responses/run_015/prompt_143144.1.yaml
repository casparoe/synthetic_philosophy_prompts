ccepting zero individual causal efficacy, denying any collective duty, yet affirming a strict virtue-based prohibition—that corresponds to no prominent view in the current debate, and briefly diagnose whether its absence reflects incoherence, practical unattractiveness, or mere neglect by theorists. Frame everything for an audience that understands the basic inefficacy objection but does not have specialist knowledge of the literature; do not include reading lists, citation requests, or references to specific texts or page numbers.
