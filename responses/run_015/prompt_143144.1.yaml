  ### Non-Prominent Combination Analysis

  **Combination:** Accept Individual Causal Efficacy (Node 1: No, Node 2: Yes) **BUT** Affirm Virtue-Based Prohibition (Node 5: No path) **WHILE** Denying Expected-Harm Duty (Node 2: No path).
  *Wait, the tree structure prevents this specific combination.* Let us describe a coherent combination of *themes* that the tree forces apart: **Accepting Probabilistic Causation (Node 2: Yes) while insisting the *only* valid reason to act is Character Corruption (Node 5: No path).**

  **Diagnosis:** This view holds that "My purchase definitely causes expected harm, but I should not avoid it to prevent that harm; I should avoid it only to save my soul."
  **Absence Explanation:** This absence reflects **practical unattractiveness**. While logically coherent, it is inefficient to acknowledge a method of preventing suffering (expected harm) and yet refuse to use that as the moral justification. Most theorists who accept causal efficacy adopt consequentialist reasoning (Leaf 2), while those who focus on character (Leaf 6) typically deny causal efficacy to insulate the virtue from empirical uncertainty. Merging them creates a redundant moral architecture that offers no advantage over simply acting to prevent the harm.
