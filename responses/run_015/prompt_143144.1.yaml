answer: |-
  ### Diagnostic Decision Tree: Individual Agency in Collective Harm

  To isolate your philosophical position regarding climate action, dietary choice, and voting, answer the following five questions in order. Each question presents a concrete scenario rather than a theoretical label.

  **Node 1:** If you cast a vote in a landslide election where your ballot physically cannot change the winner, does that act lack all moral significance?
  *   **Yes:** Go to Leaf 1.
  *   **No:** Go to Node 2.

  **Node 2:** Does buying one specific meat product in a supermarket create a calculable probability of preventing animal suffering?
  *   **Yes:** Go to Leaf 2.
  *   **No:** Go to Node 3.

  **Node 3:** Is your primary moral duty to organize with others to ensure the harmful practice stops?
  *   **Yes:** Go to Leaf 3.
  *   **No:** Go to Node 4.

  **Node 4:** If you benefit from a harmful system without choosing it, are you responsible for repairing it?
  *   **Yes:** Go to Leaf 4.
  *   **No:** Go to Node 5.

  **Node 5:** Does the value of your action lie mainly in publicly signaling a rejection of the harmful norm?
  *   **Yes:** Go to Leaf 5.
  *   **No:** Go to Leaf 6.

  ***

  ### Terminal Positions (Leaves)

  **Leaf 1**
  *   **Path:** Node 1 (Yes)
  *   **Position:** Pure Inefficacy Denial
  *   **Recommendation:** You are morally permitted to eat meat and skip voting because your individual actions cannot alter the outcome.

  **Leaf 2**
  *   **Path:** Node 1 (No) → Node 2 (Yes)
  *   **Position:** Probabilistic or Expected-Harm Aggregation
  *   **Recommendation:** You should abstain from meat and vote because even a tiny probability of preventing harm creates a moral expectation to act.

  **Leaf 3**
  *   **Path:** Node 1 (No) → Node 2 (No) → Node 3 (Yes)
  *   **Position:** Collective-Action or Coordination-Duty
  *   **Recommendation:** You must join coordinated groups to change policy, even if your isolated consumption or vote makes no difference.

  **Leaf 4**
  *   **Path:** Node 1 (No) → Node 2 (No) → Node 3 (No) → Node 4 (Yes)
  *   **Position:** Structural-Complicity or Social-Connection Responsibility
  *   **Recommendation:** You are obligated to work against unjust systems simply because you participate in and benefit from them, regardless of coordination.

  **Leaf 5**
  *   **Path:** Node 1 (No) → Node 2 (No) → Node 3 (No) → Node 4 (No) → Node 5 (Yes)
  *   **Position:** Expressive or Norm-Constitution Duty
  *   **Recommendation:** You should vote or abstain from meat primarily to communicate a stance that helps shift social norms.

  **Leaf 6**
  *   **Path:** Node 1 (No) → Node 2 (No) → Node 3 (No) → Node 4 (No) → Node 5 (No)
  *   **Position:** Virtue-Based or Character-Corruption Avoidance
  *   **Recommendation:** You should avoid meat and vote to maintain your own moral integrity, even if no one sees it and nothing changes.

  ***

  ### Diagnostic Overlap Analysis

  **Overlapping Leaves:** Leaf 5 (Expressive) and Leaf 6 (Virtue-Based).
  **Reason for Overlap:** The branching question at Node 5 asks whether the value lies *mainly* in signaling. However, in practice, acting to maintain one's character (Virtue) often inherently involves expressing that character to the world (Expressive). A person who refuses meat to avoid corruption often does so by adopting a public identity as a vegetarian, making the internal and external motivations difficult to disentangle via a simple binary question. The tree treats "signaling to others" and "maintaining internal integrity" as mutually exclusive primary motives, but many agents hold both simultaneously.
  **Splitting Hypothetical Case:** To genuinely separate these, ask: "If you could take a pill that made you virtuous internally but ensured everyone believed you were vicious, would you still abstain from meat?" A Virtue theorist says Yes (internal state matters); an Expressive theorist says No (social norm signaling matters).

