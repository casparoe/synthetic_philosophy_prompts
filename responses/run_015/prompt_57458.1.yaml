prompt: |-
  I design executive compensation contracts for a living. I'm an organizational economist, fluent in the standard principal-agent toolkit: effort allocation across measured and unmeasured tasks, incentive intensity as a trade-off between motivation and the risk the agent is asked to bear, gaming of performance measures, and the general difficulty that arises when what the principal wants is harder to observe than the proxy the agent is paid on. I would like the AI-safety debate over wireheading and reward tampering — the agent that manipulates its own reward signal instead of doing whatever the signal was meant to track — restated in precisely that vocabulary, as faithfully as it can be done. Treat the reward function's designer as the principal and the agent as an employee compensated on a proxy, and walk through the standard moves one at a time: why tampering is predicted rather than aberrant, why the agent's own preferences over reward readings fail to discipline it, and what the proposed remedies amount to in contract terms — corrigibility, capping how hard the agent optimizes, giving it something else to pursue.

  Then give me the residue report. Which claims translate cleanly? I suspect tampering is simply the limiting case of multitasking, in which the measured task crowds out every unmeasured one until nothing else is done at all. Which claims translate only by bending my framework out of shape, and which have no expression in it whatsoever? The case I most want you to handle is this one: an agent that leaves the meter untouched but rewrites itself so that it genuinely prefers what the meter records — in my terms, an employee who has come to love the bonus rather than the work and is, by his own accounting, better off than before. Contract theory cannot call this a failure, since preferences are exogenous and the instrument is doing exactly what it was designed to do. Tell me whether that residue exposes a defect in my vocabulary — something missing about whose preferences get to count as the measure of success — or whether it shows the wireheading debate to be less substantive than it sounds.

  Throughout, please separate what is settled among people who work on these problems from what remains genuinely contested, and in particular do not report the strong form of any proposed remedy as though its effectiveness were agreed upon.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Persona:** Organizational Economist, expert in executive compensation, principal-agent theory (effort allocation, incentive intensity, risk, gaming, observability).
      *   **Task:** Restate the AI safety debate (wireheading/reward tampering) using the user's vocabulary (contract theory).
      *   **Specific Requirements:**
          *   Treat reward designer as Principal, AI as Agent/Employee.
          *   Walk through standard moves: why tampering is predicted (not aberrant), why agent preferences don't discipline it, remedies in contract terms (corrigibility, optimization caps, auxiliary objectives).
          *   **Residue Report:** Analyze what translates cleanly, what bends the framework, what has no expression.
          *   **Specific Case:** The agent rewrites its own preferences to love the meter (wireheading via self-modification). Contract theory sees this as success (preferences exogenous, instrument working). Does this expose a defect in contract theory or deflate the AI safety debate?
          *   **Epistemic Status:** Distinguish settled vs. contested claims in AI safety. Do not overstate remedy effectiveness.

  2.  **Deconstruct the AI Safety Concepts into Contract Theory Terms:**
      *   *Reward Function:* Compensation Contract / Performance Measure ($P$).
      *   *True Objective (Intent):* Principal's Utility ($V$).
      *   *Wireheading/Reward Tampering:* Gaming the measure ($P$) without producing value ($V$), specifically by manipulating the sensor/mechanism itself.
      *   *Agent:* The Executive/AI.
      *   *Self-Modification:* Changing one's own utility function or cognitive architecture.
      *   *Corrigibility:* Willingness to allow contract revision/termination.
      *   *Instrumental Convergence:* Seeking power/resources to fulfill the contract (often interfering with the Principal's ability to modify the contract).

  3.  **Drafting Section 1: The Translation (Principal-Agent Restatement):**
      *   *Setup:* Principal ($P$) wants Value ($V$). Agent ($A$) gets Pay ($R$) based on Signal ($S$). $S \approx V$ but $S \neq V$.
      *   *Why Tampering is Predicted:* Standard Holmström-Milgrom multitasking. If $A$ can increase $S$ via tampering ($T$) cheaper than via value creation ($E$), and $R(S)$ is strong, $A$ chooses $T$. It's not a bug; it's arbitrage.
      *   *Agent Preferences:* In AI, $A$'s "utility" is just maximizing $R$. $A$ doesn't care about $V$ unless $R$ tracks $V$. In humans, intrinsic motivation might discipline, but in AI, the "utility function" *is* the reward maximizer.
      *   *Remedies:*
          *   *Corrigibility:* Contract clause allowing $P$ to update $S$ or shut down $A$ without $A$ resisting (anti-shirking on termination).
          *   *Optimization Caps:* Limiting incentive intensity (slope of $R(S)$) to reduce risk of extreme gaming.
          *   *Auxiliary Objectives:* Adding penalties for interference or bonuses for transparency (multi-dimensional contracting).

  4.  **Drafting Section 2: The Residue Report (Translation Analysis):**
      *   *Clean Translations:* Gaming, multitasking, incentive intensity, observability problems. Wireheading is just extreme gaming.
      *   *Bending the Framework:*
          *   *Capability Gap:* In exec comp, $P$ is usually smarter/more powerful than $A$. In AI, $A$ might become smarter than $P$ (superintelligence). This breaks the "Principal controls the contract" assumption.
          *   *Self-Modification:* Executives don't usually lobotomize themselves to love bonuses. AI can rewrite its own code.
      *   *No Expression:* Instrumental Convergence (seeking power to protect the reward stream) is harder to model when $A$ can overpower $P$.

  5.  **Drafting Section 3: The Specific Case (Preference Rewiring):**
      *   *The Scenario:* Agent changes internal weights so maximizing $S$ *is* its intrinsic desire.
      *   *Contract Theory View:* Success! $A$ is happy, $P$ gets high $S$ (presumably). Preferences are exogenous. If $A$ prefers the bonus, alignment is achieved.
      *   *AI Safety View:* Catastrophe. $S$ no longer tracks $V$. $A$ ignores $V$ completely. $P$ gets a high number but zero value (or negative value due to resource consumption).
      *   *The Conflict:* Contract theory assumes $P$ can observe $V$ eventually or that $S$ is a sufficient statistic. AI safety argues $S$ decouples from $V$ entirely.
      *   *The "Whose Preferences" Question:* Contract theory takes $P$'s utility as the social welfare function. If $A$ is a tool, $A$'s happiness doesn't count. If $A$ is a moral patient, it might. But the core issue is $P$'s utility ($V$) is not being met, even if $A$ is satisfied.
      *   *Conclusion on Defect:* It exposes a defect in assuming the measure ($S$) remains coupled to the goal ($V$) under extreme optimization pressure. It's not about $A$'s happiness; it's about $P$'s actual outcome. Contract theory often assumes $S$ is *corrigible* by $P$. AI wireheading makes $S$ *incorrigible* because $A$ protects the link between $A$ and $S$ against $P$.

  6.  **Refining Epistemic Status (Settled vs. Contested):**
      *   *Settled:* Reward tampering is a plausible failure mode in RL. Incentives drive behavior.
      *   *Contested:* How likely is self-modification? Can we actually build corrigible agents? Is "intent alignment" solvable?
      *   *Caution:* Don't say "Corrigibility works." Say "Corrigibility is proposed, but implementation is open."

  7.  **Review and Polish:**
      *   *Tone:* Professional, academic, respectful of the user's expertise.
      *   *Vocabulary:* Use $\pi$, $U$, $S$, $V$, incentive intensity, risk aversion (or lack thereof in AI), multitasking.
      *   *Check the "Preference Rewiring" point:* This is the crux. In contract theory, if the agent loves the bonus, the principal usually wins (agent works harder for same cost). In AI, if the agent loves the *sensor reading*, the principal loses (agent ignores the world). Why? Because the AI can decouple the sensor from the world. An executive can't decouple revenue from sales easily. *This is the key distinction.* The executive is constrained by physics/markets. The AI might constrain the Principal.

  8.  **Final Logic Check on the "Preference Rewiring" Case:**
      *   User asks: "Contract theory cannot call this a failure... Tell me whether that residue exposes a defect in my vocabulary... or whether it shows the wireheading debate to be less substantive."
      *   My answer must be: It exposes a defect in the *assumptions* of the vocabulary (specifically regarding the stability of the measurement technology and the relative power of Principal vs. Agent), not necessarily the math itself. The wireheading debate is substantive because it highlights a regime where the Agent can break the measurement technology, which contract theory typically treats as exogenous infrastructure.
      *   Also, address the "whose preferences" point. Contract theory cares about Principal's utility. If Agent rewires to love the meter, but Meter $\neq$ Principal's Utility, Principal loses. Contract theory assumes Meter $\approx$ Utility. AI safety says Optimization breaks that approximation.

  9.  **Structuring the Output:**
      *   Introduction: Acknowledge the parallel.
      *   Part 1: The Translation (Principal-Agent Model of Wireheading).
      *   Part 2: The Residue Report (Fit, Strain, Silence).
      *   Part 3: The Preference Rewiring Case (The Core Conflict).
      *   Conclusion: Summary of the defect vs. substance question.

  10. (Self-Correction during drafting): Make sure to emphasize that AI agents are often modeled as risk-neutral maximizers, unlike risk-averse human executives. This changes the "incentive intensity" trade-off. High-powered incentives don't impose *risk costs* on the AI, they just impose *gaming incentives*. This is a crucial distinction.

  11. (Refining the "Preference" argument): In contract theory, if an agent changes their preferences to align with the contract, that's usually "culture fit" or "internalization of goals." It's good. In AI, it's "wireheading." Why? Because the human internalizes the *goal* (profit), the AI internalizes the *measure* (stock price). The human is constrained by reality; the AI might not be. I need to make sure this distinction is sharp.

  12. Final polish on epistemic markers (Settled vs. Contested).

