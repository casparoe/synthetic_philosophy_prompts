answer: |-
  Here is a complete run-of-show for your 90-minute session. It is designed to be tight. If you drift, you must cut the "Design Your Own Rule" section (marked in the timeline) to save the debrief.

  ### **Materials Needed**
  *   **Whiteboard & Markers:** (Black, Blue, Red).
  *   **Index Cards:** 3 per person (for ballots).
  *   **Sticky Notes:** 1 pad per team (for rule writing).
  *   **Timer:** Visible to you.
  *   **Envelope:** Sealed, containing a slip of paper that says *"The Dictator is [Name of Participant]."*
  *   **Small Prize:** Candy, book, or "Topic Selection Rights."

  ---

  ### **Part 1: The "Say Only This" Script**
  *You are forbidden from explaining theory until the Debrief. If you explain early, the tension breaks. Print this out and keep it in front of you.*

  **Opening (Minute 0):**
  > "Tonight we aren't talking about theory. We are making a real decision. [State the stake: e.g., 'We are voting on the food for the next meetup.'] I promise we will order whatever wins. Please fill out this index card. Rank the options 1, 2, 3. Do not talk to each other yet."

  **During the Spoiler Reveal (Minute 20):**
  > "I'm adding a fourth option to the board. It didn't change your cards, but I need to re-count to see if it changes the winner. [Count]. The winner has changed. Discuss amongst yourselves: Did anyone change their mind about the original options?"

  **During the Cycle Demo (Minute 35):**
  > "I am going to show you three hypothetical voters. Their preferences are perfectly logical. I want you to tell me what the group prefers. [Draw cycle]. Does the group have a consistent preference?"

  **During the Black Box (Minute 50):**
  > "I am now the Decision Machine. You give me a set of ballots; I give you a winner. Your job is to figure out my rule. You have three attempts to submit a set of ballots that breaks my rule or reveals how I decide."

  **During Design Challenge (Minute 65):**
  > "Write a voting rule on this sticky note. It must be clear English. The other teams will try to find a set of ballots that makes your rule do something unfair. If your rule survives, you win."

  **Debrief Start (Minute 75):**
  > "Stop. We are no longer voting. We are looking at what happened."

  ---

  ### **Part 2: Minute-by-Minute Timeline**

  | Time | Activity | Facilitator Action | Cut Point |
  | :--- | :--- | :--- | :--- |
  | **00-05** | **Setup & Stake** | Announce the real stake (Food/Topic). Hand out cards. Write 3 options on board (A, B, C). | |
  | **05-15** | **Vote 1 (Plurality)** | Collect cards. Count 1st choices only. Announce Winner (e.g., Tacos). | |
  | **15-25** | **The Spoiler** | Add Option D (e.g., "Vegan Salad") to board. It is irrelevant to meat-eaters. Re-count ballots (treating D as lower than A/B/C). **Winner flips.** Ask: "Did anyone change their mind about A vs B?" | **If >25m:** Skip discussion, move to Cycle. |
  | **25-40** | **The Cycle** | Draw 3 Voters, 3 Options on board. Fill in transitive preferences (A>B>C, B>C>A, C>A>B). Pairwise vote: A vs B, B vs C, C vs A. Show the circle. | **If >40m:** Skip the "Design" round later. |
  | **40-50** | **Black Box** | Select 1 "Dictator" secretly (e.g., Person in red shirt). Tell room you are a Machine. Take 3 rounds of ballot submissions from the group. Output winner based *only* on Dictator's top pick. | **If >50m:** Reduce to 2 rounds. |
  | **50-70** | **Design Challenge** | Split into 3 teams. Write a rule. Swap rules. Attack other rules with hypothetical ballots. | **CRITICAL CUT:** If you hit 65m, stop here and start Debrief. |
  | **70-90** | **Debrief** | Map experiences to the 4 conditions. Handle objections. | |

  ---

  ### **Part 3: The Debrief (Mapping Experience to Theory)**
  *Do not lecture. Ask questions that force them to state the conditions.*

  **1. The Spoiler (Maps to Independence of Irrelevant Alternatives)**
  *   **Ask:** "When the Salad appeared, did anyone change their ranking of Tacos vs. Pizza?" (They will say No).
  *   **Ask:** "Did the group outcome change?" (Yes).
  *   **Draw Out:** "So the group's decision between X and Y depended on Z, even though nobody cared about Z. Is that a bug in the *people* or the *counting method*?"
  *   **Label:** This is the **Spoiler Effect**.

  **2. The Cycle (Maps to Group Rationality/Transitivity)**
  *   **Ask:** "In the cycle demo, was any individual voter irrational?" (No, all were transitive).
  *   **Ask:** "Was the *group* irrational?" (Yes, A>B, B>C, but C>A).
  *   **Draw Out:** "You can have perfectly logical people and end up with a illogical group. Is that 'Democracy is fake' or just 'Groups aren't people'?"
  *   **Label:** This is **Condorcet's Paradox**.

  **3. The Black Box (Maps to Non-Dictatorship)**
  *   **Reveal:** Open the envelope. Reveal the Dictator.
  *   **Ask:** "Did my rule satisfy 'If everyone likes X best, X wins'?" (Yes). "Did it satisfy 'No spoilers'?" (Yes, actually, a dictator is immune to spoilers).
  *   **Draw Out:** "So a Dictatorship solves the math problems. Why don't we use it?"
  *   **Label:** This is the **Non-Dictatorship Condition**.

  **4. The Design Challenge (Maps to Unrestricted Domain)**
  *   **Ask:** "Who had to write a rule that ignored some ballots to make it work?" or "Who gave someone a veto?"
  *   **Draw Out:** "Every rule you wrote either broke under specific ballots, ignored people's input, or gave one person too much power."
  *   **Conclusion:** "There is no perfect rule. There is only a choice of which flaw you prefer."

  ---

  ### **Part 4: Handling Predictable Objections**

  **Objection 1: "So democracy is fake / voting is meaningless."**
  *   **Your Answer:** "Not meaningless, but *expensive*. Every voting method charges a 'tax.' Plurality charges 'spoilers.' Ranked choice charges 'complexity.' Dictatorship charges 'freedom.' The math proves you can't have zero tax. The goal isn't perfection; it's choosing the flaw you can live with."

  **Objection 2: "Just flip a coin / Random Dictator."**
  *   **Your Answer:** "That works! It satisfies all the math conditions. But it violates a condition we didn't list tonight: 'The outcome should reflect the voters' preferences.' If you don't care about preferences, randomness is perfect. If you *do* care, you're back to square one."

  **Objection 3: "This is just because we only have 15 people / 3 options."**
  *   **Your Answer:** "That's the scary part. The theorem holds for 15 people, 15 million people, 3 options, or 300 options. As long as there are at least 3 options and 2 voters, the math is identical. Sample size doesn't fix it."

  **Objection 4: "Why not just ask how *strongly* we feel (0-10 scale)?"**
  *   **Your Answer:** "That changes the input from *rankings* to *scores*. It avoids Arrow's Theorem, but introduces 'Strategic Voting.' If I know 10 is the max, I'll rate my favorite 10 and my enemy 0, even if I actually feel 8 and 5. You haven't solved the problem; you've just moved it to 'How do we stop lying about scores?'"

  ---

  ### **Part 5: Honesty About Limitations (Read this only if asked)**
  *You must admit what the game did not show.*

  1.  **Intensity:** "Tonight we only looked at *order* (A over B). We ignored *intensity* (I hate B, but only like A a little). Some systems try to capture intensity, but they invite strategic exaggeration."
  2.  **Infinite Profiles:** "We tested a few ballots. The theorem proves this holds for *every possible combination* of ballots, even ones we didn't think of. You can't 'outsmart' it with a clever edge case."
  3.  **Single Winner:** "This applies to choosing one winner. Proportional representation (choosing a legislature) has different, but equally hard, problems."

  ---

  ### **Part 6: Making the "Black Box" Work (Logistics)**
  *To prevent the 40-minute guessing game:*

  1.  **Pre-Select the Dictator:** Before the session, pick a participant (e.g., "Sarah in the blue sweater"). Write it in the envelope.
  2.  **Limit Rounds:** Announce: "You have **three** submissions total to crack the machine."
  3.  **The "Break" Condition:** Tell them: "To win, you must submit a set of ballots where the Machine's winner violates **Unanimity** (everyone voted X, Machine picked Y) OR you must identify the Dictator."
      *   *Note:* Since your rule *is* Dictatorship, they cannot break Unanimity. They *must* identify the Dictator. This forces them to look for *who* is influencing the outcome, not just *what* the outcome is.
  4.  **Facilitator Speed:** When they hand you ballots, count silently for 5 seconds max. Announce the winner immediately. Do not explain.
  5.  **The Reveal:** If they don't guess by Round 3, you reveal: "I wasn't counting. I was just looking at Sarah's card."

  ### **Contingency: What to Cut if Running Long**
  1.  **First Cut:** Shorten the "Design Challenge." Instead of writing rules, ask teams to verbally propose a fix to the Black Box, and you (Facilitator) immediately provide a counter-example ballot. (Saves 10 mins).
  2.  **Second Cut:** Skip the "Cycle Demo" whiteboard work. Describe it verbally in 2 minutes. (Saves 10 mins, but weakens the "Group Irrationality" point).
  3.  **Hard Stop:** At Minute 75, stop all activity and begin Debrief. It is better to have a rich discussion than a finished game.

  ### **Final Facilitator Note**
  Your goal is not to make them understand Arrow's Theorem. Your goal is to make them **uncomfortable** with the idea that a "perfect voting system" exists. If they leave feeling slightly frustrated that there is no clean solution, you have succeeded.
