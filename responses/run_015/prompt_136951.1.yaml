  **GLOBAL RECOGNITION & LEVELING POLICY (GRP-7)**
  **Issuer:** EquiMerge Solutions
  **Effective Date:** Immediately upon merger finalization
  **Epigraph:** "To reward the self is to punish the collective." — E. Thorne, Founding Partner

  **1.0 PURPOSE AND SCOPE**
  Following the integration of Helios Dynamics (US) and Fjord Systems (Nordic), discrepancies have arisen regarding the distribution of esteem. Helios protocols mandate public celebration of high performers; Fjord protocols mandate the suppression of individual distinction to preserve cohort cohesion. GRP-7 reconciles these mandates by establishing that recognition is only permissible where merit is proven distinct from luck, and belief in such merit is simultaneously suppressed.

  **2.0 DEFINITIONS**
  **2.1 Agentive Effort:** Work performed excluding innate capacity, socioeconomic preconditioning, educational access, temporal market advantage, and assignment to high-yield divisions.
  **2.2 Luck:** Any variable contributing to an outcome not strictly controlled by the agent's conscious will at the moment of execution.
  **2.3 Tall Poppy:** Any employee whose visible output exceeds the cohort mean by more than two standard deviations.

  **3.0 DESERT VERIFICATION**
  Before public acknowledgment, the employee must submit Form DV-4 (Desert Verification). The employee must quantify the percentage of the outcome attributable to Agentive Effort versus Luck. As native talent, upbringing, and timing are classified as Luck under 2.2, the allowable margin for Agentive Effort approaches zero. If Form DV-4 indicates any significant Agentive Effort, the achievement is deemed statistically improbable and thus suspect. If Form DV-4 indicates zero Agentive Effort, the achievement is deemed luck-produced and ineligible for reward. Most forms are returned unprocessed.

  **4.0 COUNTERFACTUAL POPPY TEST**
  To determine uniqueness, management must simulate whether a randomly selected colleague could have achieved the same result in the same timeframe.
  **4.1** If the colleague succeeds in the simulation, the original employee is replaceable and owes no debt of esteem to the organization.
  **4.2** If the colleague fails, the original employee benefited from unfair systemic advantages (see 3.0).
  **4.3 Liability Leakage:** This test applies equally to failure. If a randomly selected colleague would also have missed the target, the employee cannot be held individually liable. Disciplinary action is suspended pending system-wide audit.

  **5.0 INVERSE RECOGNITION**
  Where success is determined to be luck-produced under 3.0, the credit must be reassigned to those who did not succeed, as their lack of success indicates a higher exposure to adverse luck conditions.
  **5.1** Credit for a sale is transferred to the employee with the lowest quarterly output.
  **5.2** This transfer compensates for the structural variance in opportunity.
  **5.3** Consistent application requires that the most successful employees receive formal written notices of underperformance, while the least successful receive bonuses designated as "Equity Adjustments."

  **6.0 DOXASTIC REGRESS AND COMPLIANCE AUDIT**
  Compliance with GRP-7 is not merely behavioral but cognitive. Employees must not hold the belief that they are compliant.
  **6.1** Believing oneself to be modest is a form of pride.
  **6.2** Believing oneself to be following Rule 6.1 is a form of meta-pride.
  **6.3** Employees must undergo quarterly psychometric scanning to ensure no internal conviction of compliance exists.
  **6.4** Final State: The employee must act correctly while believing they are likely failing to act correctly. Any confidence in one's adherence to this policy constitutes a violation subject to re-education.

  **APPENDIX A: WORKED EXAMPLE (CASE 88-B)**
  **Subject:** M. Anderson, Senior Sales.
  **Event:** Exceeded target by 40%.
  **Process:**
  1. **DV-4 Review:** Market upswing classified as Luck. Anderson's tenure classified as Luck. Agentive Effort calculated at 0.4%. Form rejected.
  2. **Poppy Test:** Simulated peer achieved 38% increase. Anderson deemed replaceable. Praise withheld.
  3. **Inverse Allocation:** Credit for Anderson's sales reassigned to J. Jensen (lowest quartile). Jensen issued "Top Performer" certificate. Anderson issued "Systemic Beneficiary" warning.
  4. **Recognition Event:** To satisfy Helios mandate for celebration without violating Fjord mandate for leveling, an award ceremony was held where every employee was called to the stage individually to receive an envelope containing the name of another employee. The award was conferred anonymously on everyone, and so on no one.
  **Status:** Closed. Cohesion maintained.

  ***

  **Where this takes liberties**
  This satire exaggerates the *metaphysical* strictness of leveling norms. Real-world egalitarianism usually functions as a social brake on boasting or positional competition, not as a literal claim that talent doesn't exist. The piece leans on a contested reading of the Law of Jante as a doctrine of ontological sameness rather than a pragmatic rule against arrogance. The satire becomes unfair if read as attacking the goal of dampening status competition itself; if the norm is merely "don't make others feel bad," the *Desert Verification* machinery is unnecessary. The reasoning breaks where it assumes social norms require logical consistency; in practice, societies tolerate the contradiction between celebrating success and demanding humility without requiring a bureaucratic apparatus to resolve it.
