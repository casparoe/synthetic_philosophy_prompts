      *   *Counter-argument:* In social choice, preferences are over *states*. If my ranking of $x$ vs $y$ depends on the presence of $z$ vs $w$, that's allowed. But if my preference over my *own action* is entirely contingent on yours, have I really claimed a right over *my action* independent of yours?
      *   Actually, the deeper issue is **Gibbard's Paradox**. Allan Gibbard (1974) showed exactly this: Liberalism implies inconsistency even without Pareto if agents have conditional preferences over their rights.
      *   So the user hasn't "accidentally souped it up"; they have rediscovered Gibbard's Paradox.
      *   *The Fix:* The standard resolution involves restricting the domain of admissible preferences (rejecting Unrestricted Domain) or redefining Rights (Game Form vs. Social Outcome).
