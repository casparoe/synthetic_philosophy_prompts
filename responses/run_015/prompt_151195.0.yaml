      *   The user says: "Wanting to do the opposite of someone is not having a preference about what they do."
      *   Response: Formally, it *is*. If $U(0,0) > U(1,0)$ and $U(1,1) > U(0,1)$, your utility function $U(a, b)$ is not separable. $U(a, b) \neq f(a) + g(b)$.
      *   Sen's rights assume separability implicitly to work smoothly. When separability fails, the "spheres" overlap in preference space even if they are disjoint in action space.
