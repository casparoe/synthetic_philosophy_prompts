      *   **Key Questions:**
          *   Is the will genuinely aggregated or manufactured?
          *   Alignment/Resistance to the "General Will" (Rousseauian) vs. "Actual Will" distinction.
          *   The Aggregation Problem (Arrow's Impossibility Theorem vibe): Can preferences be combined without loss/manipulation?
          *   Boxer's role: Danger of treating constructed will as naturally given.
          *   Narrative Form: What does the *story* add that analytic theory misses? (Erosion of agency via language).
      *   **Constraint:** Keep reading faithful in both directions (don't reduce book to theory, don't distort theory to fit book).
      *   **Conclusion:** What does the work reveal about the will of the people that argument alone misses?

  2.  **Initial Brainstorming & Mapping:**

      *   *Essentialism:* Old Major's speech implies a pre-existing unity ("All men are enemies, all animals are comrades"). The Rebellion feels like uncovering a truth.
      *   *Constructivism:* Napoleon and Squealer *make* the will. They change the Commandments. They use the sheep to drown out dissent. The "people" (animals) are shaped by the pigs.
      *   *The Windmill:* Snowball vs. Napoleon. Is there a "true" will here? The animals vote, but then the dogs chase Snowball out. The will is overridden by force, then retroactively justified.
      *   *Boxer:* "Napoleon is always right." This is the death of aggregation. It's the surrender of individual preference to a singular authority, mistaking authority for the collective good.
      *   *Aggregation Problem:* Even if the animals vote, does the majority vote reflect the "will"? What about the hens' rebellion? What about the silent dissent? The prompt mentions the impossibility of a non-arbitrary algorithm. *Animal Farm* shows this through the *corruption* of the algorithm (Squealer's statistics).
      *   *General Will (Rousseau):* Rousseau distinguishes the "will of all" (sum of private interests) from the "general will" (common good). The pigs claim to represent the General Will ("for your own sake") while acting on private interest. Orwell satirizes the *claim* to the General Will.
      *   *Narrative Form:* Theory talks about structures; literature shows the *feeling* of confusion, the fatigue, the slow gaslighting. The *process* of erosion is key.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Define the philosophical tension (Essentialist vs. Constructivist). State the thesis: *Animal Farm* dramatizes the transition from an essentialist illusion of unity to a constructivist reality of manipulation, revealing that without critical agency, the "will of the people" becomes a hollow vessel for tyranny.
      *   **The Essentialist Illusion (The Rebellion):** Start with Old Major. The vision of a homogeneous class interest. The rebellion feels like a discovery of natural law. But is it? It's a moment of pure aggregation (all against Jones).
      *   **The Constructivist Turn (The Windmill & Debates):** Enter politics. Snowball vs. Napoleon. Here we see the aggregation problem. Animals are confused. The vote happens, but force intervenes. The "will" is no longer discovered; it's contested.
      *   **Linguistic Corruption (The Commandments):** This is the core of the constructivist argument. The will is encoded in law. If you change the code, you change the will. Squealer's role. The "people" don't remember, so their past will is erased.
      *   **Boxer and the Aggregation Problem:** Boxer is crucial. He opts out of the aggregation process. "Napoleon is always right." This solves the aggregation problem by removing the variables (individual thoughts). It illustrates the danger of treating the leader's will as the people's will.
      *   **General Will vs. Actual Will:** Connect to Rousseau. The pigs claim the General Will (sacrifice for the farm) but serve private interest. Orwell shows that the distinction is easily weaponized.
      *   **Narrative Form vs. Analytic Theory:** What does the story do that a paper doesn't? It shows the *temporal* aspect. The slow boil. The exhaustion. The specific mechanism of language (semantic drift). Theory abstracts; narrative embodies the *loss*.
      *   **Conclusion:** Summarize. The work reveals that the "will of the people" is not a static object to be found, nor a mere construction to be imposed, but a fragile practice that requires constant vigilance and linguistic integrity.

  4.  **Refining and Polishing (Self-Correction during drafting):**

      *   *Check:* Did I address the "Aggregation Problem" specifically? *Adjustment:* Need to explicitly mention that even sincere preferences can't be perfectly summed up, and how the pigs exploit this ambiguity.
      *   *Check:* Am I reducing the book to theory? *Adjustment:* Ensure I talk about the *animals'* experience—their hunger, fear, and confusion—not just the political mechanics. Keep Boxer's tragedy central.
