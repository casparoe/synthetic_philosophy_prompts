answer: |-
  George Orwell's *Animal Farm* is frequently read as a straightforward allegory of the Russian Revolution, a satire of totalitarianism, or a critique of specific historical figures. However, viewed through the lens of political philosophy, specifically the metaphysics of populism, the novella emerges as a profound interrogation of the "will of the people." At the heart of democratic and populist theory lies a tension between two ontological accounts of "the people." The **essentialist** account posits that the people exist as a homogeneous entity prior to politics, possessing a discoverable, unified will that political structures merely uncover. The **constructivist** account argues that "the people" is constituted only through representation, language, and aggregation procedures; there is no pre-political unity, only the unity created by the act of speaking for the group. *Animal Farm* dramatizes the tragic slippage between these two accounts. It begins with the illusion of essentialist unity and ends with the stark reality of constructivist manipulation, revealing that when the mechanisms of aggregation are controlled by a vanguard, the "general will" becomes a mask for private power.

  The rebellion itself is presented as the triumph of the essentialist view. Old Major's speech does not propose a new political order so much as it reveals a pre-existing natural truth: "All men are enemies. All animals are comrades." In this moment, the animals' will appears as a latent force waiting to be unlocked. The uprising against Jones is not depicted as a debated strategy but as a spontaneous eruption of a collective consciousness. The animals do not vote to rebel; they simply realize they are already one. This aligns with the populist fantasy of a homogeneous people whose will is self-evident and unmediated. However, Orwell subtly undermines this from the start. The unity is negative (anti-Jones) rather than positive (pro-a-specific-policy). Once Jones is gone, the essentialist illusion fractures, and the problem of aggregation arises.

  This fracture is most visible in the debate over the windmill. Here, the animals face the classic aggregation problem: even if every animal holds a sincere preference regarding their labor and future security, there is no non-arbitrary algorithm to combine these preferences into a single popular will without loss. Snowball and Napoleon offer competing constructions of what is best for the farm. The animals are "divided in their opinions." In a functioning democracy, this divergence is managed through procedure. In *Animal Farm*, the procedure is hijacked. Napoleon does not win the aggregation of preferences; he dissolves the assembly. By unleashing the dogs, he replaces the *will of all* (the sum of individual preferences) with a forced consensus. Yet, crucially, he does not admit to this. He retains the language of the essentialist will. He claims to act for the good of the collective, suggesting that the true will of the animals was always aligned with his own, even if they didn't know it.

  This brings the narrative into direct conflict with the Rousseauian distinction between the "general will" (what is objectively best for the community) and the "actual will" (what the community currently desires). Rousseau argued that the general will is always right, but the judgment guiding it may not be enlightened. Orwell satirizes the weaponization of this distinction. Squealer and Napoleon consistently claim to represent the general will ("for your own sake," "the true happiness of the farm") against the animals' actual, expressed will (which might be hunger, fatigue, or a desire for rest). The pigs position themselves as the interpreters of a will that the animals themselves cannot access. This is the danger of the essentialist account in practice: if the people's will is a hidden truth rather than an expressed preference, it can be "discovered" by a leader to justify actions the people explicitly reject. The pigs do not distort the will; they claim to possess the metaphysical key to it.

  The incremental rewriting of the Seven Commandments illustrates the constructivist reality that underpins this tyranny. If the people are constituted through language and law, then controlling language controls the people. The Commandments were intended to be the static codification of the animals' essential will. However, as the pigs' interests diverge from the other animals, the text is altered. "No animal shall sleep in a bed" becomes "No animal shall sleep in a bed *with sheets*." This is not merely lying; it is an ontological revision of the collective subject. By changing the founding rules, Squealer changes who "the animals" are and what they have always willed. When the animals feel a dissonance between their memory and the current rule, Squealer gaslights them into accepting the new text as the original. This demonstrates that without control over the mechanisms of discourse, the "will of the people" is retroactively creatable. The people do not precede the representation; the representation creates the people.

  Nowhere is the danger of this metaphysical confusion more poignant than in the character of Boxer. Boxer represents the collapse of the aggregation problem through the surrender of critical judgment. Faced with the complexity of political debate and the contradiction between his suffering and the pigs' prosperity, Boxer adopts two maxims: "Napoleon is always right" and "I will work harder." Boxer's loyalty is a solution to the cognitive dissonance of populism. If the leader *is* the will of the people, then individual judgment is not just unnecessary; it is a betrayal of the self. Boxer illustrates the peril of treating a constructed will as if it were naturally given. He assumes that Napoleon's directives are the organic expression of the farm's needs, rather than the manufactured preferences of a ruling class. His tragedy is that he aggregates his will into Napoleon's completely, effectively removing himself from the political equation. In doing so, he makes the tyranny possible. The "will of the people" becomes a tautology: the people will what the leader wills, because the leader says that is what the people will.

  Orwell's satire aligns with the philosophical critique that the "general will" is vulnerable to distortion, but it resists the idea that a "correct" will exists independently of the process. The novella suggests that the problem is not just that the general will is distorted, but that the very concept of a singular, homogeneous will is a vulnerability. By showing the erosion of collective agency through incremental linguistic corruption, *Animal Farm* makes a point about populism that analytic treatments of representation often miss. Analytic theory tends to treat representation as a structural transaction: Principal (People) delegates to Agent (Leader). *Animal Farm* shows representation as a *temporal* and *psychological* process. The erosion does not happen all at once; it happens through fatigue, through the slow drift of meaning, and through the physical exhaustion of the constituents.

  The narrative form captures the *experience* of losing one's will. An analytic treatise on aggregation might explain mathematically how preferences can be manipulated. Orwell shows us Clover staring at the altered wall, feeling a disturbance she cannot articulate, and then accepting Squealer's explanation because she lacks the vocabulary to resist. This highlights that the "will of the people" is not just a logical sum of preferences but a fragile ecological state dependent on memory, language, and trust. When the pigs drink whiskey and sleep in beds, they are not just breaking rules; they are breaking the shared reality that allows a "people" to exist.

  Ultimately, *Animal Farm* reveals that the "will of the people" is not a metaphysical object to be found, nor a blank slate to be written upon by the powerful. It is a practice. The work demonstrates that the will of the people exists only insofar as the people possess the capacity to verify the language that claims to represent them. When the mechanisms of assembly are closed, and language is privatized by a vanguard, the "people" cease to exist as a political agent and become merely a resource to be consumed. What the narrative adds to the philosophical debate is the affective weight of this loss. It shows that the death of democracy is not always a violent coup, but often a slow suffocation where the people are talked out of their own reality until they believe that their servitude is, in fact, their freedom. The will of the people, Orwell suggests, is not what is written on the wall, but the capacity of the animals to read it for themselves.
