answer: |-
  You have identified something real, and your intuition that standard "causation by omission" doesn't fully capture it is correct. The standard philosophical discussion (often tracing back to Hart and Honoré's *Causation in the Law*) establishes that we treat omissions as causes only when there is a duty to act. But you are noticing something more dynamic: how the *content* of the duty shifts to preserve the causal claim, and how the claim behaves differently when the duty is collective.

  Here is the carving you asked for.

  ### The Core Concept: Normative Causal Selection

  What you are seeing is best described as **Normative Causal Selection**.

  In metaphysics, "cause" usually means "counterfactual dependence" (if X hadn't happened, Y wouldn't have). But in institutional settings (like your board), "cause" means "the breach of a norm that makes intervention appropriate."

  When your board says the teacher "caused" the leak, you are not making a physics claim. You are making a **jurisdictional claim**. You are identifying the node in the system where the institution has the right and ability to intervene.

  Here is how your three cases map onto this, and how they differ from nearby concepts:

  **1. The Teacher (Obligation Inflation)**
  *   **Nearby Concept:** *Moral Luck.* (Being judged on outcomes outside one's control).
  *   **The Difference:** In moral luck, the blame changes while the act stays the same. In your case, the *description of the act* changes to fit the blame. When told the lock wouldn't have mattered, the board didn't say "Okay, not a cause." They said "The duty was bigger than we thought."
  *   **The Mechanism:** This is **Retrospective Duty Calibration**. The board treats the "cause" as a fixed target (the bad outcome happened) and adjusts the "duty" until it hits the target. This confirms your suspicion: the causal claim is not driving the judgment; the need for a responsible party is driving the definition of the cause.

  **2. The Fight (Collective Diffusion)**
  *   **Nearby Concept:** *The Problem of Many Hands.* (A term from political ethics where outcomes are produced by many contributors, making individual blame impossible).
  *   **The Difference:** Usually, the "Problem of Many Hands" leads to *no one* being blamed. Your board is doing something stranger: they are assigning causation to the *plural subject* ("the passers-by") while refusing to assign it to the *singular subjects*.
  *   **The Mechanism:** This is **Distributed Agency Attribution**. The board recognizes a collective duty ("students should report fights") that does not distribute down to individuals ("*I* should have reported"). The causal claim floats because the duty is structural, not individual.

  **3. The Project (Scapegoat vs. System)**
  *   **Nearby Concept:** *Fundamental Attribution Error.* (Blaming character rather than situation).
  *   **The Difference:** The board *does* blame a character (the annoyed member) verbally, but their *remedy* admits the situation was the cause (rotating system).
  *   **The Mechanism:** This is **Narrative Closure vs. Structural Repair**. The "cause" (the lazy student) is selected to close the hearing (humans need a story). The "fix" (the system) is selected to prevent recurrence (institutions need protocols). The word "cause" is doing two different jobs here: one for the record, one for the future.

  ### One Phenomenon or Two?

  I argue this is **one phenomenon** with two faces.

  The unifying thread is that **causal language is being used as a tool for institutional maintenance, not metaphysical description.**

  *   In Case 1, the institution needs a specific role to hold accountable to maintain hierarchy (Teacher > Student). So the duty inflates.
  *   In Case 2, the institution needs to signal community norms without triggering a witch hunt. So the duty floats.
  *   In Case 3, the institution needs to close a file (pick a name) but also keep the machine running (fix the process). So the cause splits.

  If these were two different phenomena, you would expect the logic of Case 1 (duty inflation) to contradict Case 2 (duty diffusion). Instead, they cooperate. Both serve to locate the "cause" wherever the institution has the most leverage to prevent recurrence, regardless of counterfactual physics.

  ### Acts vs. Omissions: The Asymmetry

  You asked if this happens with things people *did* (commissions). It does not, and the asymmetry tells you exactly what is going on.

  *   **Commissions (Acts):** Have physical momentum. If a student punches another, the causal chain is physical. You do not need a "duty" to establish that the punch caused the injury. The duty is only needed to establish *wrongfulness*, not *causation*.
  *   **Omissions (Non-acts):** Have no physical momentum. A non-event cannot physically push the world into a new state. Therefore, an omission can only be a "cause" if there is a **normative baseline** that treats the non-act as an intervention.

  **Why the duty stretches for omissions:** Because without the duty, there is no causal link at all. If the board admits the teacher's lock wouldn't have changed the outcome, the omission disappears entirely from the causal story. To keep the teacher in the story (which the institution wants to do, to maintain teacher accountability), they must stretch the duty until it *would* have made a difference (e.g., "not leaving the exam in the room").

  With an act, the physical link holds even if the duty is weak. With an omission, the duty *is* the link. That is why the duty inflates under pressure.

  ### The Test: A Pair of Hypotheticals

  To test whether you have found one unified phenomenon (Normative Causal Selection) or two separate ones (Duty Inflation vs. Collective Diffusion), run these two cases by your board.

  **Case A (The Useless Guardian):**
  A security guard is paid to sit in a room with a single door and stop anyone from entering. He falls asleep. A student picks the lock (a very difficult lock) and enters. Evidence shows the guard would have woken up too late to stop the pick even if he had been awake.
  *   *Prediction:* If your theory is right, the board will say the guard **caused** the breach. They will inflate his duty: "He should have had a panic button," or "He should have requested a second guard." The causal claim survives the lack of counterfactual difference.

  **Case B (The Useful Stranger):**
  A student sees a fire start in a trash can. He has no fire safety duty (not a monitor, not a prefect). He has a bucket of water in his hand for art class. He walks past. The fire spreads. If he had thrown the water, the fire would have stopped 100%.
  *   *Prediction:* If your theory is right, the board will say the student did **not cause** the fire damage, even though his omission made the massive physical difference. He had no duty.

  **The Verdict:**
  *   If the board calls the Guard a cause (Case A) but the Stranger not a cause (Case B), you have confirmed **Normative Causal Selection**. Duty trumps physics.
  *   If the board calls the Stranger a cause because he "could have helped," then your theory is wrong, and they are actually tracking **Counterfactual Dependence** (physics) after all, and the other cases were anomalies.
  *   If they call the Guard *not* a cause because "he couldn't have stopped it," then the "Obligation Inflation" you saw in the Teacher case was specific to teachers, not a general principle.

  ### Confidence Ratings

  1.  **High Confidence:** That this falls under the umbrella of **Normative Causal Selection**. The distinction between "cause in fact" (physics) and "cause in law" (duty) is a standard distinction in legal philosophy. Your observation that the duty *elasticizes* is a sharp refinement of that, but the category is stable.
  2.  **Medium Confidence:** That Case 1 (Inflation) and Case 2 (Diffusion) are the *same* underlying mechanism. It is highly plausible they are both pragmatic tools for institutional control, but it is possible Case 2 is purely psychological (Bystander Effect) while Case 1 is purely bureaucratic (Liability Management). The Hypothetical Test above is designed to resolve this.
  3.  **Low Confidence (Contested Claim):** That ordinary speakers (your board members) are *aware* they are shifting definitions. This rests on a contested claim in philosophy of language. Some argue speakers genuinely believe the duty *is* the cause. Others argue they are pragmatically misusing the word "cause" to mean "blame." I cannot settle this from the armchair; it requires psychological study of your board's internal mental states. I am assuming the former (they conflate the two) because their arguments treat the duty expansion as a factual discovery ("He *should* have counted copies") rather than a policy choice ("We *want* him to count copies").

  ### What Would Change My Mind

  **1. If Duty Isn't Doing the Work:**
  If you present Case B (The Useful Stranger) and the board insists the student *caused* the damage solely because he *could* have prevented it, ignoring his lack of duty, then my analysis collapses. This would mean your board is actually tracking **Counterfactual Power**, and the Teacher case (Case 1) was just an anomaly where the duty happened to align with the physics.
  *   *Revision:* I would have to conclude you are observing **Hindsight Bias**, not Normative Causal Selection. They are simply tracing the chain of events backward from the bad outcome and stopping at the most convenient handle, regardless of duty.

  **2. If It Collapses into Existing Labels:**
  If you find that the "Obligation Inflation" only happens when the person is *already* being punished, and never when they are being exonerated, then this isn't a theory of causation. It is just **Motivated Reasoning**.
  *   *Revision:* I would have to conclude there is no distinct causal phenomenon here. It's just blame looking for a noun. The "cause" label is incidental.

  **3. If It's Genuinely New:**
  You asked what would convince me this *isn't* new. The risk is that this is just **Hart and Honoré's "Intervening Human Action"** dressed in high school clothes. Hart and Honoré argued decades ago that we select causes based on "abnormality" and "duty."
  *   *Revision:* If you find that your board's reasoning maps exactly onto standard legal tests for negligence (Foreseeability + Duty + Breach + Causation) without the "elasticity" I described, then you haven't found a new phenomenon. You've just found lawyers in training. The "elasticity" (stretching the duty when the physics fail) is the only part that feels distinct from standard legal theory. If that elasticity disappears under scrutiny, the phenomenon is standard legal reasoning, not a new cognitive pattern.

  ### Summary
  You are watching your board use the word "cause" to mean "the most efficient place to apply institutional pressure." When physics doesn't support that (the lock wouldn't have mattered), they adjust the norms (the duty was bigger). When individuals don't support that (the bystanders), they adjust the agent (the collective).

  It is **Normative Causal Selection**, characterized by **Retrospective Duty Calibration**. It is one phenomenon. The asymmetry with acts exists because omissions require a normative baseline to exist as causes at all. Test it with the Guard vs. the Stranger.
