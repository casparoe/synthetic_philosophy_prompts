  # DEBRIEF GUIDE

  **Goal:** Map play experiences to the two structural points without lecturing.

  **Point 1: One-Shot vs. Continuous Leveling**
  *   **Moment:** Gen 4 Wealth Comparison.
  *   **Likely Remark:** "We voted for high taxes and redistributed the money, but Family A still has triple the chips of Family B."
  *   **Facilitator Response:** "Look at the Stake size in Gen 4 compared to Family A's capital. The Stake was equal for everyone. Why did it matter less over time?"
  *   **The Turn:** Guide them to see that a flat redistribution shrinks relative to compounding capital. Equalizing the *start* (Stake) is not the same as equalizing the *process* (Taxing growth).
  *   **Consensus/Dispute:**
      *   *Consensus:* Mathematically, if $r > g$ (return on capital > growth/redistribution), inequality rises.
      *   *Dispute:* Whether real-world $r$ is persistently higher than $g$ (Piketty vs. Neoclassicals).
      *   *Flag:* The game fixes $r$ at 20–50%. In reality, returns are contested and variable.

  **Point 2: Endogeneity of the Tax Base**
  *   **Moment:** The Merger or Gift Decision.
  *   **Likely Remark:** "We merged with Family C because the tax was 50%. It was stupid to pay that." OR "I gifted everything early to avoid the bequest tax."
  *   **Facilitator Response:** "So the tax didn't reduce the wealth; it changed how the wealth was *held*. Did the number of households change?"
  *   **The Turn:** Highlight that the "Base" (number of taxable estates) shrank because the tax made consolidation rational. The instrument changed the structure it was meant to measure.
  *   **Consensus/Dispute:**
      *   *Consensus:* Agents optimize around tax constraints (Lucas Critique).
      *   *Dispute:* The elasticity of bequests. Do people actually break up families to save tax, or is wealth sticky?
      *   *Flag:* The game makes Mergers costless (except autonomy). Real mergers have legal/transaction costs.

  **Consensus & Dispute Summary**
  *   **Settled:** Compounding amplifies small differences; tax avoidance behaviors exist.
  *   **Live Dispute:** The moral weight of "Opportunity." Is it equal opportunity if the *process* is fair but the *outcome* is unequal? (Philosophy).
  *   **Empirical Dispute:** How much inheritance tax actually reduces concentration vs. causing capital flight.

  ***

  # FAILURE ANALYSIS

  **1. Vote Collapsing (0% or 50% immediately)**
  *   **Risk:** Gen 1 votes 50% (they don't pay) to fund their Stake. Gen 2 votes 0% (punishment).
  *   **Fix:** The Constitutional Cap (50%) prevents confiscation. Remind voters during Vote 2 that *they* will be taxed by *their* vote (Vote 2 sets Gen 3 tax, Gen 2 players are Gen 3 heirs).
  *   **Fallback:** If voting is chaotic, ignore the vote and set tax at 30% for Gen 2/3, then let them vote for Gen 4.

  **2. Dominant Dynasty / Check-Out**
  *   **Risk:** One table gets lucky on Risky rolls in Gen 1, accumulates massive wealth, and bores the others.
  *   **Fix:** Emphasize the Scoring Rule. "You score 50% of your Child's consumption." The rich Gen 1 needs the poor Gen 2 to succeed to maximize their own score. Encourage "Venture Philanthropy" (high risk transfers).
  *   **Fallback:** In Debrief, ask the losing tables: "At what point did you feel the game was decided?" Use this to illustrate path dependence.

  **3. Economics Students "Solving" the Game**
  *   **Risk:** They calculate EV, dominate, and explain it to others, ruining the discovery.
  *   **Fix:** Instruct them privately during setup: "Your goal is to maximize *group* discovery, not just chips."
  *   **Fallback:** In Debrief, ask them: "You optimized for EV. Did that optimize for *fairness*?" Use them to explain the math, then pivot to the normative implication.

  **4. Mergers Ignored**
  *   **Risk:** Players find mergers too complex or socially awkward.
  *   **Fix:** Facilitator actively suggests it if tax > 30%. "Family B, you are small. Family A is large. A merger avoids the 40% tax on A's transfer."
  *   **Fallback:** If no mergers occur, the Endogeneity lesson fails. Pivot Debrief to the *Gift* channel instead. "You used Gifts to avoid Bequest tax. That changed the *timing* of the base."

  **5. Luck vs. Institutions**
  *   **Risk:** Dice rolls make inequality look random, not structural.
  *   **Fix:** In Debrief, aggregate the dice results. "Family A rolled average. Family B rolled average. Family C rolled high. Why is C still ahead?" (Answer: They took Risky because they could afford the loss).
  *   **Fallback:** Acknowledge luck. "Institutions don't remove luck; they determine who survives it."

  **Limitations (What the Game Cannot Show)**
  1.  **Invented Parameters:** The 20% Safe Return is arbitrary. Real returns are lower and harder to access.
  2.  **Siloed Tax:** Real inheritance tax sits atop income/capital gains tax. This game isolates it, overstating its impact.
  3.  **Process vs. Prospect:** The game equalizes the *Stake* (Prospect) but not the *Human Capital* (Process). Real opportunity includes education/networks, which are harder to tax/redistribute.

  \answer{Risky asset expected return exceeds safe rate}
