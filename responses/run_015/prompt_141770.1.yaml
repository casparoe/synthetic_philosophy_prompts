answer: |-
  # PARTICIPANT HANDOUT

  **DYNASTY: A Seminar on Wealth and Time**

  **Objective**
  Maximize your **Lineage Score**. Your score is the sum of your consumption plus a fraction of your descendants' consumption.
  *   Your Consumption: 100%
  *   Child's Consumption: 50%
  *   Grandchild's Consumption: 25%
  *   Great-Grandchild's Consumption: 12.5%

  **Setup**
  You are seated in Lineages of 6. You are Generation $G$. The person to your left is $G-1$ (Parent); to your right is $G+1$ (Child).
  *   Generations 1–4 make active decisions.
  *   Generations 5–6 are Future Heirs (you receive final wealth but do not invest).
  *   **All Participants** vote on tax policy.

  **The Turn (Generations 1–4)**
  1.  **Receive:** Collect your Inheritance (from Parent) and Universal Stake (from Facilitator).
  2.  **Invest:** Choose **Safe** or **Risky** for your total capital.
      *   *Safe:* Guaranteed 20% return (Multiply chips by 1.2).
      *   *Risky:* Roll 1d6.
          *   Roll 1–2: Capital Halved (Multiply by 0.5).
          *   Roll 3–6: Capital Doubled (Multiply by 2.0).
  3.  **Allocate:** Divide your post-investment capital into **Consumption** (keep for score) and **Estate** (pass to Child).
  4.  **Transfer Method:** Choose how to pass the Estate.
      *   *Bequest (Death):* Taxed at the current **Bequest Rate**. No limit.
      *   *Gift (Life):* Taxed at **20%**. Capped at 25% of your total capital.
      *   *Merger:* Combine your Estate with another Lineage's Estate. Untaxed. Irreversible. Requires consent of both Lineage heads. Merged Lineages act as one unit thereafter (one vote, one investment choice).
  5.  **Vote:** All participants vote on the **Bequest Rate** for the *next* Generation. (0% to 50%).

  **Rules**
  *   **Tax Lag:** The rate you vote on applies to your *Child's* inheritance, not your own.
  *   **Redistribution:** All tax revenue is pooled and divided equally among all 18 participants as a **Universal Stake** at the start of the next Generation.
  *   **Privacy:** Investment choices are public. Transfer amounts are recorded by the Facilitator.
  *   **Time:** You have 5 minutes per Generation turn.

  **Scoring**
  At the end of Generation 4, the game ends.
  *   Gen 1–4 Score = Consumption + 50% of chips passed to Child.
  *   Gen 5–6 Score = 100% of chips received from Parent.
  *   Highest Score wins (bragging rights only).

  ***

  # FACILITATOR SHEET

  **Parameters**
  *   **Initial Endowment (Gen 1):** 10 Chips each.
  *   **Safe Return:** 1.2x (20%).
  *   **Risky Return:** 1d6. {1,2} $\to$ 0.5x; {3,4,5,6} $\to$ 2.0x.
      *   *Expected Value (EV):* 1.5x (50% growth).
      *   *Why:* Risky must be strictly dominant in EV to tempt players away from equality-preserving Safe mode.
  *   **Bequest Tax:** Vote 0% – 50% (Increments of 10%).
  *   **Gift Tax:** Fixed 20%. Cap: 25% of Total Capital.
      *   *Why:* Cap forces large wealth to use Bequest or Merger. Lower rate incentivizes shifting.
  *   **Merger:** Untaxed. Two lineages become one. Wealth pools. One "Head" decides investment; consumption split equally.
      *   *Why:* Creates endogeneity of the tax base (fewer households).
  *   **Universal Stake:** $\frac{\text{Total Tax Revenue}}{18}$.
  *   **Constitutional Constraint:** Bequest Tax cannot exceed 50%.
      *   *Why:* Prevents 100% confiscation which breaks the "investment" mechanic.

  **Sensitivity Note**
  The activity turns on the **Risky Investment Expected Return**. If the EV of Risky is not significantly higher than Safe, rational players will choose Safe, wealth dispersion will remain low, and the "compounding inequality" lesson will fail. If variance is too high, the lesson becomes "luck matters" rather than "structure matters."

  **Whiteboard Ledger**
  Draw three columns (Family A, B, C).
  Rows: Gen 1, Gen 2, Gen 3, Gen 4.
  Track: *Pre-Tax Wealth*, *Tax Paid*, *Post-Tax Transfer*.
  Track *Total Tax Revenue* separately for Stake calculation.

  **Timeline (90 Minutes)**
  *   **00–15:** Setup. Distribute chips. Explain rules. Seat assignments (3 tables of 6).
  *   **15–20:** **Gen 1 Decision.** (Invest, Consume, Pass).
  *   **20–25:** **Vote 1.** (Sets Tax for Gen 2). Calculate Stake.
  *   **25–35:** **Gen 2 Decision.** (Receive Stake + Inheritance. Invest, Consume, Pass).
  *   **35–40:** **Vote 2.** (Sets Tax for Gen 3). Calculate Stake.
  *   **40–50:** **Gen 3 Decision.** (Receive Stake + Inheritance. Invest, Consume, Pass).
  *   **50–55:** **Vote 3.** (Sets Tax for Gen 4). Calculate Stake.
  *   **55–65:** **Gen 4 Decision.** (Receive Stake + Inheritance. Invest, Consume. No Pass).
  *   **65–90:** **Debrief.**

