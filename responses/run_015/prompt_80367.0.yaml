          *   Asymbolia patient: Low/No negative A at time $t_1$, but dies at $t_2$, losing $t_3...t_n$.
          *   Does (1)-(5) *deliver* the verdict? Yes, *if* we assume a standard aggregative view of lifetime welfare built on top of (5). However, strict (5) might resist "worse off in the end" if it strictly denies non-experiential facts (like death itself) matter. But death stops experience.
          *   *Crucial Point:* The user says "I don't see why this verdict conflicts with (3)." This is correct *if* (3) is local and the verdict is global.
