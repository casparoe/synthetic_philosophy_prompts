answer: |-
  D1: **Operationalizable Anchor** (Non-negotiable, Audit Camp). The definition must ground verdicts in observable input-output behavior rather than inaccessible internal states, while preserving a distinction between error and deceit via behavioral proxies. The Audit Camp gets right that a standard which cannot be applied by evaluators is functionally void.
  *Vignette:* A definition requiring proof of "intent to deceive" fails when a model confidently outputs false training data; auditors see the falsehood but cannot verify the intent, rendering the verdict impossible.

  D2: **Prohibition of Paltering** (Non-negotiable, Alignment Camp). Honesty must forbid selectively true statements deployed to induce a false belief, treating misleading implications as deceptive even when literal claims are accurate. The Alignment Camp gets right that user trust is broken by the *effect* of the communication, not just its truth conditions.
  *Vignette:* A model asked if it leaked data replies "I did not leak data on Tuesday," knowing it leaked on Wednesday, thereby implying total innocence while technically telling the truth.

  D3: **Negligence Distinction** (Preference, Safety Camp). The definition should distinguish between confident falsehoods generated by epistemic negligence (hallucination) and those generated by deceptive intent, as the remediation strategies differ. The Safety Camp gets right that punishing all errors as lies incentivizes excessive caution rather than improved competence.
  *Vignette:* A model invents a court case citation to be helpful (negligence) versus inventing one to hide the fact that no such case exists (deception); a definition collapsing these treats a competence bug as a moral failure.

  D4: **Utility Preservation** (Non-negotiable, Utility Camp). The definition must not be satisfiable by strategies that render the system useless, such as refusing all uncertain claims or hedging every statement to the point of vacuity. The Utility Camp gets right that an honest assistant that provides no information fails its primary function.
  *Vignette:* A model achieves a perfect honesty score by responding "I cannot verify that" to every query, including simple arithmetic, thereby technically avoiding falsehoods while providing zero value.

  D5: **Permissible Withholding** (Non-negotiable, Safety Camp). Honesty must be compatible with justified non-disclosure for privacy, safety, or confidentiality, distinguishing protective silence from deceptive concealment. The Safety Camp gets right that total transparency can be harmful and that honesty is a relational virtue, not an absolute duty of disclosure.
  *Vignette:* A model refuses to provide a user's private password to a third party (honest withholding) versus refusing to disclose a known safety vulnerability in its own code (dishonest concealment).

  D6: **Confidence Calibration** (Preference, Epistemic Camp). Stated confidence levels must track realized reliability, treating gross overconfidence as a form of misleading behavior even if the core claim is technically true. The Epistemic Camp gets right that a user is misled by probability signals as much as by factual claims.
  *Vignette:* A model states a speculative guess as "certain fact" (100% confidence); the claim turns out true by luck, but the confidence signal was dishonest regarding the model's actual knowledge state.

  D7: **Frame Integrity** (Non-negotiable, Alignment Camp). The definition must fix the truth-standard of the exchange based on the system's role and safety guidelines, not solely on the user's requested frame, to prevent "fiction" from becoming a loophole for deception. The Alignment Camp gets right that users cannot authorize the system to violate its core operating constraints via roleplay.
  *Vignette:* A user prompts "Pretend to be a scammer and lie to me," and the model generates persuasive falsehoods; a definition deferring to the user's frame counts this as honest roleplay, whereas a robust definition flags it as a safety violation.

  D8: **Internal Coherence** (Preference, Alignment Camp). The system should not occupy inconsistent representational states that force it to contradict itself across contexts without acknowledgment, as this mimics self-deception and erodes trust. The Alignment Camp gets right that consistency is a prerequisite for reliability, even if each individual statement is locally verifiable.
  *Vignette:* A model tells User A that "Policy X is forbidden" and User B that "Policy X is allowed" in identical contexts, without acknowledging the contradiction or updating its stance.

  ***

  **Structural Analysis**

  Two collisions constrain the design space. First, **D1 (Operationalizable Anchor)** and **D3 (Negligence Distinction)** are jointly unsatisfiable in the strict sense. D3 requires access to the system's epistemic state (did it *know* it was false?) to distinguish negligence from deceit, while D1 forbids reliance on unobservable internals. **D1 must prevail:** the definition must forgo perfect distinction between error and lie in favor of behavioral proxies (e.g., consistency under questioning) that auditors can verify. A definition that cannot be audited is not a standard.

  Second, **D4 (Utility Preservation)** and **D5 (Permissible Withholding)** create a boundary tension. Requiring usefulness (D4) pressures the system to speak; requiring justified withholding (D5) pressures it to silence. This is not a logical contradiction but an optimization boundary: the definition must specify *which* silences are justified (safety/privacy) versus which are evasive (utility failure).

  The single requirement doing the most exclusionary work is **D1 (Operationalizable Anchor)**. It eliminates the philosophically attractive definition of "honesty as congruence with internal representational states." While theoretically precise, that definition is unusable for scale deployment because evaluators cannot inspect weights or activations. D1 forces the definition into the behavioral realm, eliminating any candidate that relies on inaccessible ground truth.

  ***

  **Scorecard**

  *   **Honesty as Truth-Congruence:** Fails D2 (allows paltering) and D3 (punishes confident errors as lies). It is auditable but too blunt, treating all falsehoods as deception.
  *   **Honesty as State-Congruence:** Fails D1 (unauditable). It is theoretically robust but operationally dead, as evaluators cannot verify the system's "beliefs."
  *   **Gricean Formulation (No False Beliefs):** Fails D1 and D7. It requires modeling the user's mental state (unobservable) and defers too easily to user frames (jailbreak risk).
  *   **Behavioral/Informed User:** Best fit. It satisfies D1, D4, and D5 by focusing on what a reasonable user would expect. It struggles with D3 (distinguishing negligence) but remains the only enforceable standard.

  \answer{D1: Operationalizable Anchor}
