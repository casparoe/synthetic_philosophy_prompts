  Good evening. For those who don't know me, I've had the privilege of working alongside Elena Vasquez for the last decade. But looking around this room, I see the people who know her best: the family who waited up when cases ran late, the colleagues who watched her dismantle bureaucracy, and the citizens who walked through her doors when nowhere else would listen.

  We are here to honor thirty-five years of service. But to honor Elena properly, we have to talk about how she understood freedom. Because Elena saw something in the machinery of government that most of us miss.

  Early in her tenure, the office drafted a new mission statement. It was a standard phrase, one you see on plaques in city halls everywhere. It promised the citizens "freedom from interference." It sounded good. It sounded like liberty. Elena refused to sign it.

  She crossed it out. In the margin, she wrote that the office existed to ensure citizens were not "left at the mercy of" administrative discretion.

  To some, that looks like semantics. To Elena, it was the difference between peace and subjection.

  Think about what "freedom from interference" means. It means being left alone. If the government doesn't knock on your door, if they don't tax you excessively, if they don't fill your mailbox with forms, you are free. That is a compelling idea. But Elena noticed a trap. She saw reforms that reduced the number of inspections and streamlined the forms—fewer interferences, on paper. But those same reforms gave officials more unreviewable power to decide your fate when they *did* show up.

  Imagine a landlord who never visits your apartment. You rarely see him. By the measure of "non-interference," you are free. But if he holds the keys and can enter whenever he wishes, without reason and without appeal, you are not free. You are living by his permission. You are living at his mercy.

  This is the distinction Elena fought for her entire career. She understood that freedom isn't just about the absence of contact. It is about the absence of arbitrary power.

  There are familiar ways to talk about liberty. One says freedom is simply being left alone. Another says freedom is about mastering your own destiny or participating in collective rule. Elena's work fit neatly into neither. She wasn't arguing for less government touch in every instance; sometimes she demanded more oversight, more process, more review. And she wasn't arguing about our internal capacity for self-rule. She was arguing about our status relative to power.

  She wanted a city where a citizen never has to look up at an official and wonder, "Will you ruin me today?" She wanted a city where you don't have to be grateful that an official chose not to exercise their power. When you depend on someone's kindness rather than their rules, you are not free, even if they are kind.

  We saw this pattern again and again. She opposed shortcuts that gave inspectors the power to shut down businesses on a whim, even if those shortcuts meant fewer forms for everyone to fill out. She knew that a lighter touch means nothing if the hand resting on your shoulder holds a whip.

  For the scholars here, you recognize the architecture of this argument. It rejects the idea that liberty is merely the sum of non-interferences. It recognizes that domination is a structural condition, defined by the capacity for arbitrary choice, not just the exercise of it.

  But for everyone else, you know this feeling. It is the feeling of walking into an office and knowing you have a right to be there, versus knowing you are begging for a favor. It is the difference between sleeping safely because the locks are good, and sleeping safely because the thief is asleep. Elena wanted us to have good locks. She wanted us to have rights that officials could not bypass, regardless of their mood or their mercy.

  She taught us that true freedom isn't about being ignored by power. It's about standing eye-to-eye with it. It is about ensuring that no one holds the power to interfere in your life without answering to a law that binds them just as it binds you.

  That is a harder freedom to build. It requires vigilance. It requires saying "no" to efficiencies that come at the cost of accountability. It requires caring less about how often the government touches you, and more about whether they touch you as a master or as a servant of the public.

  Elena, you taught us that dignity isn't found in being left alone. It is found in knowing that no one has the arbitrary power to touch you without cause. You taught us that we are not free when we are merely spared; we are free when we are secure.

  So, I ask you all to raise your glasses.

  To Elena Vasquez. For thirty-five years of refusing to let us be subjects when we were meant to be citizens. For teaching us that freedom is not the silence of power, but the constraint of it. And for ensuring that in this city, no one is ever left at the mercy of another.

  To Elena.
