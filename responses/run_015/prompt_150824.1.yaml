prompt: |-
  I was arguing with my sister over dinner — she's an academic historian, I'm just a novelist who writes political fiction — about whether you can actually write a counterfactual novel where Hitler dies in 1923 and still end up with a Nazi state. I want to run a session for my writing group (mostly poets and playwrites, no academic history background) on the Great Man theory versus structural explanation, using that exact counterfactual as the spine. Plan how I should teach it: the order the pieces have to come in so that the counterfactual doesn't feel like a cheap plot twist, the one concrete scenario that should carry the whole discussion and what it needs to have and lack, the misconceptions they'll bring — probably that if you remove the villain the plot collapses, or that structures are just background noise — and exactly where in the sequence to defuze each, plus one check at the end to see if they've grasped that structural explanations aren't just 'Hitler was replaceable' but something about the system's pressure points and dependancy structures. I also want you to weave in that niche idea about minimal-rewrite counterfactuals in historiogaphy (the rule that you shouldn't change more than necessary) so it doesn't feel like a regurgitated A-level debate. Don't ask them to read anything; they won't. Give me the plan in prose, then summarise it in a JSON object with the fields: "sequence_steps" (array of strings describing order and dependency), "carrying_example" (object with "scenario", "must_have", "must_lack"), "misconceptions" (array of objects with "label", "appears_when", "defuse_tactic"), "understanding_check" (string describing the final task), "omissions" (array of strings), "niche_injection" (string explaining the minimal-rewrite framing). Write it in British English, please — and yes, I meant playwrights, not playwrites.
