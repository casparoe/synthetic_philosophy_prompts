answer: |-
  Here is the plan for your writing group session, designed to navigate the tension between character-driven narrative and structural determinism without bogging down in academic dryness.

  ### Session Plan: The Ghost in the Machine

  **Objective:** To demonstrate that compelling counterfactual fiction relies not on removing a villain, but on understanding the system that created them. You will use the 'Hitler dies in 1923' scenario to teach structural causality.

  **1. The Hook: The Sister's Challenge (10 minutes)**
  Start by recounting the dinner argument plainly. Pose the question to the room: *Hitler is killed during the Beer Hall Putsch in November 1923. Does the Third Reich still happen?* Ask for a show of hands: Yes or No. Most will say 'No'. This validates their intuition (the Great Man theory) before you dismantle it. Explain that for a novelist, 'No' is a boring story (the villain dies, peace ensues). 'Yes' is a terrifying story (the villain dies, the monster remains). Tell them today is about writing the terrifying story plausibly.

  **2. The Constraint: The Minimal-Rewrite Rule (15 minutes)**
  Before discussing *who* replaces Hitler, you must establish the rules of engagement. Introduce the historiographical concept of the **minimal-rewrite counterfactual**. Explain that amateur alternate history often changes too much (e.g., Hitler dies, so Germany instantly becomes a democracy). The rule states: *Alter only the specific event (the death), keep all antecedent conditions constant unless directly changed by that event.*
  *   **Why here?** This prevents the discussion from drifting into fantasy. It forces the writers to acknowledge that the Versailles Treaty, the hyperinflation, and the antisemitic culture do not vanish with the man. This is your niche injection; it elevates the discussion from 'what if' to 'causal mechanics'.

  **3. The Carrying Example: The Vacuum and the Pressure (20 minutes)**
  Present the concrete scenario.
  *   **Scenario:** Hitler is shot dead on the steps of the Feldherrnhalle, 1923.
  *   **Must Have:** The NSDAP exists as a vehicle; the *völkisch* movement is active; the French occupy the Ruhr; economic collapse is ongoing; the Freikorps are armed and angry.
  *   **Must Lack:** Hitler's specific oratory, his specific imprisonment (so no *Mein Kampf* as we know it), his specific 'legal path' strategy.
  Ask the group: *The party exists. The anger exists. The money is gone. Who speaks for this anger?*
  Let them suggest names (Strasser, Göring, Hess). Then pivot: It doesn't matter who. What matters is that the **structure demands a speaker**. This is where you address the first misconception.

  **4. Defusing Misconception 1: The Vacuum Fallacy (10 minutes)**
  *   **The Misconception:** 'If you remove the villain, the plot collapses.' (The Great Man view).
  *   **When it appears:** When writers argue that without Hitler's specific charisma, the Nazis remain a fringe beer-hall group.
  *   **The Defuse:** Remind them of the minimal-rewrite rule. The conditions that made Hitler charismatic still exist. Charisma is not a magic spell; it is a resonance between a speaker and an audience's desperation. If the desperation remains (structural), the resonance will find a new frequency (a new leader). Use a theatrical analogy: If the lead actor breaks a leg on opening night, the play doesn't vanish; the understudy steps into the same blocking, directed by the same script, for the same audience.

  **5. Defusing Misconception 2: The Backdrop Fallacy (10 minutes)**
  *   **The Misconception:** 'Structures are just background noise.' (The view that history is just scenery for characters).
  *   **When it appears:** When writers treat the Weimar Republic's economic crisis as mere setting rather than an active antagonist.
  *   **The Defuse:** Reframe 'structure' as 'invisible characters'. The Treaty of Versailles is not a document; it is a character that humiliates Germany. Hyperinflation is not a graph; it is a character that starves the middle class. These characters have agency. They push people toward extremism. If Hitler dies, these 'invisible characters' keep pushing.

  **6. The Understanding Check: The Pressure Point Task (15 minutes)**
  Do not ask them 'Who replaces Hitler?'. That tests biography, not structure.
  **The Task:** Ask them to identify one **structural pressure point** that forces the successor to act similarly to Hitler, regardless of their personal morality.
  *   *Example answer:* 'The need for legitimacy forces the successor to use the same antisemitic scapegoating because the party funding relies on it.'
  *   *Bad answer:* 'Gregor Strasser takes over.' (This is just names).
  *   *Goal:* They must identify the *constraint* that limits the successor's choices. This confirms they understand that structural explanation is about dependency and pressure, not just replaceability.

  **7. Conclusion (5 minutes)**
  Summarise: Great Man theory gives you a biography; Structural theory gives you a tragedy. For political fiction, the tragedy is more potent. The system is the monster; the leader is just the hand it wields.

  ***

  ### Things to Omit
  To keep this within a single hour and focused on writing craft, you must deliberately exclude:
  *   Detailed biographies of potential successors (Strasser, Röhm, etc.).
  *   Complex economic data regarding the Rentenmark.
  *   The specifics of the Second World War (keep the focus on the rise to power, 1923–1933).
  *   Moral judgements on whether the Nazis were 'good' or 'bad' (assume the horror; analyse the causality).

