answer: |-
  I appreciate the sharpness of the dilemma, because it forces us to distinguish between the *measure* of a branch and the *continuity* of the observer within it. You are right that I cannot simply appeal to the smallness of the amplitude to dismiss the vaporization case without undermining the quantum suicide case, since both rely on the existence of non-zero amplitude branches. However, your continuum smuggles in an assumption about personal identity that I do not accept: namely, that any future entity with my memories and name is sufficient for *my* survival. In the quantum suicide setup, whether the odds are one in a billion or one in ten to the hundredth, the branch where I survive contains a continuous, unbroken causal chain of neural computation from the moment before the trigger to the moment after. The physical substrate supporting my consciousness persists and evolves unitarily without interruption. That is why I expect to find myself there.

  The vaporization case is fundamentally different because it breaks that causal continuity. If I am vaporized, the computational process that constitutes my mind ceases. A spontaneous fluctuation that later reassembles a copy from the debris creates a new entity that is qualitatively identical to me but numerically distinct, like a perfect clone printed after my death. In the language of the blogs, this is a Boltzmann brain scenario, not a survival scenario. The wavefunction may contain a component where such a copy exists, but there is no continuous thread of subjective experience linking the pre-vaporization me to that post-fluctuation copy. So I draw my principled line there: expectation tracks the existence of a continuous successor, not the existence of any successor. I bite the bullet on the one-in-$10^{100}$ quantum switch because the continuity holds, but I reject the vaporization case not because the amplitude is too small, but because the *me* that enters the device does not extend into the branch where the atoms randomly reassemble.
