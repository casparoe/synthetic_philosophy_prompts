  **MINISTRY OF CIVIC SORTITION & DELIBERATIVE HARMONY**
  **ONBOARDING PACKET: LEGISLATIVE STREAM 44-B**
  **CONFIDENTIAL // FOR SELECTED CITIZEN EYES ONLY**

  **Welcome to the Chamber!**

  Congratulations! You have been randomly selected to serve in the National Deliberative Assembly. While elections were retired to prevent factionalism and donor capture, your unique genetic and sociological signature was required to complete the Mirror. You are not a representative; you *are* the represented. We are thrilled to help you unlock your civic potential.

  **1. Your Role in the Mirror**
  The Assembly's legitimacy rests on its statistical fidelity to the populace. To ensure this, your selection was weighted against over 400 stratification variables. These include income decile, region, renter vs. owner status, average commute length, and chronotype (early bird/night owl). 

  Please note: The variables used to stratify the draw are themselves chosen by a committee chosen by lot, using variables chosen by another such committee. This ensures democracy all the way down. The current governing file is 4,000 pages long; updates are pushed nightly to your tablet. Occasionally, the Mirror requires maintenance. If a demographic cluster shifts during your term, you may be asked to recuse yourself to allow for a statistical correction. This is normal.

  **2. Competence & Training**
  No prior political experience is required. In fact, prior experience is noted and "corrected for" during vote tallying to prevent elite bias. You will complete the following mandatory modules during Week 1:
  *   *What is a Bill? (Interactive)*
  *   *Neutral Language in Deliberation*
  *   *Recognizing Expertise Without Deferring to It*
  *   *Hydration and Focus*

  **3. The Inattentive Quota**
  To truly mirror the people, the Chamber must reflect how little most people think about politics. You may notice empty seats reserved for the "Inattentive Quota." These seats are held for citizens who report having spent under ten minutes in the past year thinking about governance. This is a vital feature. A chamber that mirrors the people must mirror their attention spans. If you find yourself losing focus during briefings, please know you are fulfilling your descriptive duty. However, please remain physically present so the quorum sensors register your biometric data.

  **4. Integrity & Influence**
  There are no elections, so there is no one to impress. However, to maintain purity, you must submit an daily Influence Disclosure Form. Log everyone you speak to, including family, baristas, and moderators. 

  Please be advised: While you are free from donor pressure, the legitimacy of the output relies on balanced expert briefing dockets and trained moderators. These staff members are non-partisan civil servants who structure the conversation, define the remit, and summarize the consensus. Influence now flows through whoever drafts the briefing dockets. Please log any informal conversations with drafting staff immediately.

  **5. Verification: Shadows & Audits**
  For every seated member, a "Shadow" — a statistically identical citizen — is paid the same salary to not serve. Their recorded counterfactual votes are read into the record so the Ministry can isolate the causal effect of deliberation. Every so often the Shadow votes differently. No one comments on this. 

  Your performance is evaluated via the annual Mirror Audit, which grades how closely the Chamber matched census distributions. Member bonuses are tied to this score. Consequently, the Chamber now spends a chunk of its time managing its own composition instead of legislating. This is a small price for legitimacy.

  ***

  **WHAT WE ASK OF YOU**
  *   **Deliberate in good faith.** Remember, you are here to reflect, not to lead.
  *   **Respect the Remit.** Assemblies are single-issue and time-limited. No body coordinates across them. If a bill regarding infrastructure funding requires a zoning adjustment, it will quietly die because the Zoning Assembly's remit expired last Tuesday. This prevents scope creep.
  *   **Stay Healthy.** A sick mirror is a distorted mirror.

  ***

  **FREQUENTLY ASKED QUESTIONS**

  **Q: Can I decline service?**
  A: Declining service is your right. However, decliners are replaced by redrawing. This means the seated pool is "statistically somewhat more willing than you are" to be governed by strangers. We find this reassures most citizens.

  **Q: What if I want to solve multiple problems at once?**
  A: Cross-remit collaboration is discouraged to prevent factional bonding. If your issue dies due to remit expiration, please submit a ticket to the Ministry. It will be added to the docket for a future lottery, approximately 4-6 years from now.

  **Q: Who checks the staff?**
  A: The staff are permanent. You are temporary. This ensures institutional memory remains stable while the Mirror refreshes.

  **Q: Is the Shadow watching me?**
  A: The Shadow is a data point. Please do not attempt to contact them.

  ***

  **Welcome to the Work.**
  You are here because you are average. That is your excellence. Enjoy your stipend, complete your disclosures, and trust the process. The Mirror is clear, and you are the reflection.

  **Ministry of Civic Sortition**
  *Legitimacy Through Randomness*
