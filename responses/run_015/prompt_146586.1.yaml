      *(Self-Correction during drafting)*: I need to be careful not to just say "AI hallucinates." That's too simple. The philosophical point is about *epistemic agency*. When she uses a textbook, she chooses the premise. When she uses the AI, the AI suggests the premise. Even if she checks it, the *initiative* of the connection is outsourced. Over time, her mind becomes a validator of AI suggestions rather than a generator of hypotheses. This changes the *structure* of her belief formation. That is the attenuation.

