  Your practice works because it is partial, not general. When you assign a shadow price to a statistical life or a tonne of carbon, you are not attempting to organise the entire economy from scratch, as Lange proposed. You are evaluating a marginal change within a system where the vast majority of prices are already determined by real markets. Your shadow prices are parasitic; they derive their validity from the real prices of labour, steel, and capital that surround them. You can invent the price of carbon only because the price of the energy used to abate it is real. This is why you defer to the market for nurses and steel: you recognise that without the churn of actual exchange, you lack the information to set those prices correctly.

  This confirms that Lange was right about the arithmetic but wrong about the epistemology. You can write down the equations for equilibrium, and you can even solve them for small perturbations if you have the right data. But you cannot generate that data centrally. Hayek's objection was never primarily about computational power; it was about the source of the information. Prices are not merely parameters to be adjusted; they are emergent signals that encapsulate dispersed knowledge about preferences, technologies, and local conditions. A central planner, or a cost-benefit analyst, can simulate the *effect* of a price, but they cannot replicate the *process* that creates it.

  Regarding your wrinkle about AI: even if a model could perfectly predict existing trades, the Hayekian objection would remain. The market is not just a mechanism for clearing known supply and demand; it is a discovery procedure. Entrepreneurs do not merely respond to prices; they create new products, new methods, and new preferences that did not exist before. This discovery requires skin in the game—actual risk and ownership. Synthetic prices based on past behaviour might optimise the known, but they cannot discover the unknown. The objection was never about calculation; it was about incentives and discovery.

  Your practice presupposes that prices are measures of value that exist independently of your calculation, which you are trying to approximate. You are not creating value; you are estimating a cost that the market *would* recognise if it existed. Therefore, your entire methodology collapses if you treat prices as arbitrary accounting units. They must correspond to something real outside your model.

  \answer{Prices signal relative scarcity}
