answer: |-
  ### 1. Exam Question

  **Course:** Moral Psychology (Upper-Level Seminar)
  **Assessment:** Final Essay
  **Time Allowed:** 60 Minutes
  **Word Limit:** Approximately 800 Words

  **Instructions:**
  Answer the question below based *strictly* on the conceptual framework and scenario provided. Do not rely on bibliographic citations, reading lists, or external texts (e.g., Kant, Aristotle, Strawson). Your grade depends on your application of the provided definitions, not your recall of historical theories.

  **Conceptual Framework:**
  For the purposes of this assessment, define **counterfactual stability of moral motivation** as the condition that an agent's correct reason for acting would remain causally effective in nearby possible worlds where a contingent, non-moral psychological feature is absent.

  **Scenario:**
  Consider an agent who returns a lost wallet to its owner. In the actual world, the agent acts for the genuinely right reason: respect for the owner's property claim. However, the agent also possesses a contingent, non-moral psychological feature: a recent traumatic experience of property loss that generates an acute but unendorsed aversion to retaining others' belongings. The agent admits that without this trauma-induced aversion, they would likely have kept the wallet, despite their respect for the owner's claim.

  **Essay Prompt:**
  Determine whether this agent deserves **full moral worth**, **partial moral worth**, or **no moral worth** for their action. Defend your classification by addressing whether moral credit requires not merely the presence of a right reason in the actual world but also its independence from such contingent psychological scaffolding. In your argument, you must explicitly apply the definition of **counterfactual stability** provided above to explain how the agent's motivation functions across actual and nearby possible worlds.

  ***

  ### 2. Model Answer

  **Title:** Stability and Scaffolding: A Case for Partial Moral Worth

  The question of moral worth turns on whether we value the actual alignment of motive and duty or the robustness of that alignment across possible scenarios. In the case of the wallet returner, the agent acts on the right reason (respect for the claim) but relies on a contingent scaffold (trauma-induced aversion) to sustain that action. While the agent succeeds in the actual world, they fail the condition of counterfactual stability. Therefore, the agent deserves **partial moral worth**. This position acknowledges the normative success of the actual motivation while penalizing the fragility revealed by the stability condition.

  To justify this, we must distinguish three positions. The first position argues for **full moral worth**. Proponents of this view focus exclusively on the actual world. Since the agent's causal chain includes respect for the owner's claim, and this reason is sufficient to produce the action in the actual instance, the action has moral merit. The conceptual error here is treating the *presence* of a reason as identical to its *causal dominance*. By ignoring the agent's admission that they would have kept the wallet without the trauma, this view overlooks that the right reason is causally fragile. It is present, but it is not the sole or primary safeguard against immorality. If moral worth assesses character, a character that fails in nearby possible worlds is less praiseworthy than one that holds firm.

  The second position argues for **no moral worth**. This view holds that if the right reason depends on a non-moral scaffold to be effective, the moral reason is essentially inert. The conceptual error here is conflating *causal origin* with *normative justification*. The trauma did not generate the respect for the claim; it merely supported the will in acting on it. Furthermore, this view treats overdetermination (having both a moral and a non-moral motive) as automatically undermining worth. However, the prompt specifies the agent acts *for* the right reason in the actual world. To deny all worth is to ignore the normative reality of the actual choice in favor of a hypothetical failure.

  The third position, which I defend, argues for **partial moral worth**. This view utilizes the **counterfactual stability** framework. Stability requires that the correct reason remain causally effective in nearby worlds where the contingent feature (trauma) is absent. In this scenario, the agent admits that in the nearby world without trauma, the right reason would *not* be effective; they would keep the wallet. Thus, the agent fails the stability condition.

  Why does this failure result in partial rather than zero worth? Because moral assessment must weigh actual success against modal fragility. In the actual world, the agent's respect for the claim was causally operative; it was not a mere rationalization. They did the right thing for the right reason, even if that reason required emotional reinforcement to win out over self-interest. However, because the right reason lacks independence from the contingent scaffolding, the agent's moral credit is compromised. They are not fully reliable. The stability condition reveals that the moral motivation is not yet a stable trait of character but a contingent occurrence supported by non-moral psychology.

  Therefore, partial worth is the only classification that respects both the actual normative alignment and the counterfactual fragility. Full worth ignores the risk of moral failure in nearby worlds; no worth ignores the actual success of the moral reason. Partial worth acknowledges that while the agent acted rightly, their moral psychology is not yet independent enough to command full credit. Moral worth requires not just hitting the target, but hitting it in a way that suggests one would hit it even if the wind (the trauma) stopped blowing.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 25

  **A-Range (22–25 Marks): Distinction & Mastery**
  *   **Thesis:** Clearly selects one category (Full, Partial, or None) and maintains it consistently.
  *   **Framework Application:** Explicitly uses the definition of **counterfactual stability** to analyze the "nearby possible worlds." Explains that the agent *fails* the stability condition (since the reason vanishes without trauma) and argues why this failure impacts the worth classification.
  *   **Conceptual Precision:** Successfully distinguishes between the *presence* of a reason (actual world) and its *causal dominance/independence* (modal context).
  *   **Critique of Rivals:** Identifies specific conceptual errors in opposing views (e.g., noting that the "No Worth" view conflates causal support with normative content, or the "Full Worth" view ignores fragility).
  *   **Constraint Adherence:** Makes no reference to external philosophers (Kant, Aristotle, etc.) or course readings. Arguments are self-contained within the prompt's logic.

  **B-Range (18–21 Marks): Competent Application**
  *   **Thesis:** Selects a category but may waver slightly in the justification.
  *   **Framework Application:** Uses the term "counterfactual stability" but may apply it loosely (e.g., discusses stability without clearly defining the "nearby possible world" outcome).
  *   **Conceptual Precision:** Distinguishes actual reason from trauma but may struggle to explain *why* stability matters for worth.
  *   **Critique of Rivals:** Mentions alternative views but identifies conceptual errors less precisely (e.g., says the other view is "wrong" without pinpointing the fallacy).
  *   **Constraint Adherence:** Minimal or no reference to external texts.

  **C-Range (14–17 Marks): Basic Comprehension**
  *   **Thesis:** Present but underdeveloped.
  *   **Framework Application:** Mentions the scenario details but fails to utilize the **counterfactual stability** definition as an analytical tool. Treats the prompt as a standard "what would Kant say" question.
  *   **Conceptual Precision:** Confuses the trauma with the moral reason (e.g., suggests the trauma makes the action immoral).
  *   **Critique of Rivals:** Lacks engagement with alternative interpretations.
  *   **Constraint Adherence:** May rely on name-dropping historical figures without applying the prompt's specific framework.

  **Common Mistakes (Deductions of 2–3 Marks Each):**
  1.  **The External Authority Fallacy:** Appealing to what Kant or Aristotle "actually said" rather than analyzing the provided framework. (e.g., "Kant would say...")
  2.  **The Conflation Error:** Treating the trauma-induced aversion *as* the moral reason, rather than as a contingent scaffold supporting the moral reason.
  3.  **The Modal Ignorance:** Analyzing only the actual world and completely ignoring the "nearby possible worlds" clause required by the stability definition.

  **Grade Boundaries:**
  *   **22–25:** A (Excellent)
  *   **18–21:** B (Good)
  *   **14–17:** C (Satisfactory)
  *   **0–13:** Fail (Inadequate)
