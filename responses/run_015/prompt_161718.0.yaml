answer: |-
  You need to walk in and concede the age threshold point immediately in your opening statement rather than waiting for them to pounce on the eighty-five-year-old implication. Say plainly that your principle is a floor for inclusion, not a weighting scheme for power, and that once you cross the threshold of being subject to long-term governance, the count stops mattering. This disarms the slippery slope argument before the judge can raise it and shows you are not trying to dismantle the rights of current voters but rather expanding the circle of accountability. By admitting that your principle is a threshold rule and not a smooth scaling, you remove the most obvious philosophical attack vector and allow the commission to focus on the mechanics of implementation rather than the morality of age-based weighting.

  First, expect the election administrators to hit you with the mechanics of registration databases and ballot variants. They will ask how you verify residency intent without creating a second voter roll that doubles their workload and increases the risk of error during canvassing. They will worry about poll worker training and whether having different eligibility rules for municipal versus state races will confuse voters at the checkpoint. Your answer should be that you tie eligibility to existing administrative records like school enrollment or tax filings to minimize new bureaucracy, but you must admit this is soft. You are bluffing slightly here because integrating non-citizen data into election databases often requires state-level coordination they do not control, and school data is protected by privacy laws that may not yield to election officials without new legislation. If you pretend the data sharing is easy, they will know you have not spoken to their IT staff, so concede that there is an administrative cost but argue it is lower than the cost of excluding governed people.

  Then the political scientist will ask about turnout bias and whether the newly enfranchised group ends up looking like the resident population or like a self-selected activist slice. They will worry that sixteen-year-olds and new residents will not vote like the general population but like organized groups, skewing results toward specific policy outcomes rather than broad consensus. You should argue that low turnout is a feature of the current system too, and adding these groups dilutes the activist slice rather than concentrating it because it increases the total denominator of eligible voters. The soft spot here is that you cannot guarantee they will vote differently than current low-propensity voters, and if they do not vote at all, the administrative cost was wasted without gaining legitimacy. You are changing the subject slightly by focusing on the potential pool rather than actual behavior, so be prepared to acknowledge that turnout among these groups might be low initially but will mature over time as voting becomes a habit formed during high-exposure years.

  After that, the immigration attorney will press you on undocumented residents and ask what your principle does for people here without status who are also subject to zoning and policing. They will ask whether naturalize instead is really an answer given how slow and administratively gated naturalization is, and why your exposure principle stops at legal permanent residents. You must concede that your proposal is a political wedge, not a moral absolute, and that starting with legal residents is the only viable path to expanding the principle later. This is where you are most vulnerable to charges of inconsistency, so admit the limitation is strategic rather than philosophical. If you argue that undocumented residents are here illegally, you undermine your own principle that exposure matters more than status, so the only honest answer is that this is a first step constrained by current political realities rather than a complete realization of the theory.

  The retired judge will ask about state preemption and whether citizenship is a constitutional floor for local elections. They will frame this as diluting the meaning of citizenship and ask whether the state even lets a city do it at all. Your reply must be that municipalities have historically managed school board elections with different eligibility rules, and this is an extension of that local autonomy. The hard truth here is that state law might explicitly forbid this, and no amount of moral arguing overrides statutory preemption. You are on shaky ground if you imply the city has more power than it does, so flag this as a legal question for counsel rather than a policy question for the commission. If the state says no, your principle does not matter, so do not fight the judge on legal interpretation but rather on the policy recommendation they send to the state.

  The single reply that has to land for the proposal to survive the room is that taxation and governance already apply to these groups, so voting is just aligning the political power with the existing legal liability. You need to frame non-voting as a form of taxation without representation that undermines the legitimacy of the charter itself. This resonates with the neighborhood appointees who care about fairness and the judge who cares about legal consistency. If you can make them see that the current system creates a class of subjects who are governed but not represented, you shift the burden to them to justify why that exclusion is necessary rather than you justifying why inclusion is good.

  You suspect the elderly implication is the worst question, but the real killer is the state preemption issue raised by the judge. If the state says no, your principle does not matter, whereas the elderly question is philosophically awkward but legally harmless. The question you hope nobody asks is about transient wealthy residents who pay taxes but leave in five years versus poor lifelong residents. If your metric is exposure, a rich transient has less claim than a poor lifer, but if your metric is taxes, it flips. Stick to exposure to avoid this class warfare trap, but be ready to defend why time matters more than money if they corner you. Keep your answers tight and admit the administrative friction because they care more about whether it works than whether it is perfect, and if you sound like you are reciting literature rather than solving problems, you will lose the two neighborhood appointees who just want to know if this will be a pain to run.
