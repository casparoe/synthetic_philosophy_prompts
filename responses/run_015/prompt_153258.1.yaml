          *   *Empirical vs. Conceptual:* Empirical claim about how exemptions work (diet, dress). Conceptual claim about "symmetry" of restriction.
          *   *Weakness:* Ignores that the "restriction" itself is culturally coded (see N.'s next move). Assumes the burden of stripping is equal.

      *   **Move 4 (N.): Ontological Impossibility of Stripping Particularity.**
          *   *Core Claim:* You can't strip particularity; you only strip what the dominant culture codes as "religious/special." Secular = invisible norm. Muslim = visible symbol.
          *   *Logical Structure:* Premise 1: Visibility is culturally interpreted, not natural. Premise 2: Dominant culture defines what counts as "neutral." Conclusion: Laïcité creates hyper-visibility for minorities and invisibility for the majority (asymmetric).
