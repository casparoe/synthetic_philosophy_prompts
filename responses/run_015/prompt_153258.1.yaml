      *   *Check:* Did I distinguish empirical vs. conceptual? Yes.
      *   *Check:* Did I avoid citations? Yes.
      *   *Check:* Is the distinction between assimilation and universalism addressed? Yes, in the conclusion.

      *(Self-Correction on Move 1)*: M. calls it "negative multiculturalism." This is a tricky term. Is it multiculturalism if it denies groups? M. argues it *is* a form of it because it treats everyone equally. I need to note that this is a definitional stretch.
      *(Self-Correction on Move 4)*: N. claims ontological impossibility. That's a strong philosophical claim. I should evaluate whether "stripping" is truly impossible or just unequally burdensome.

      *Final Plan:*
      1.  Brainstorming Section.
