answer: |-
  The Oakhaven Heritage Committee convenes to adjudicate the status of monuments dedicated to General Marcus Thorne, a nineteenth-century founder whose personal letters suggest complicity in atrocities while his official charter established the city's democratic rights, yet a fire decades ago destroyed all dedicatory records, rendering it epistemically undecidable whether the existing bronze statue and the adjacent "Thorne Avenue" refer to Thorne the biological individual or to the abstract institutional role of "Founding Governor" he first occupied. The statue depicts a specific man in uniform, fixing a visual identity that cannot be altered without physical destruction, whereas the street name is a linguistic label administratively reassignable without material change, creating a structural asymmetry in how each medium carries or corrects reference under conditions of radical ambiguity. The committee must decide whether to remove or preserve the statue and whether to rename or retain the street name, given that the ambiguity prevents verifying if the honors target the abuser or the office, forcing a decision based on the medium's capacity for correction rather than historical certainty.

  **Reasoning Walkthrough**

  *   **Consequentialist:** This framework maximizes present social welfare. Regarding the **statue**, removal incurs high material costs and risks social unrest, while the ambiguity means it might honor the beneficial "Role" rather than the harmful "Person"; thus, preservation maximizes expected utility by avoiding destruction costs while retaining public art. Regarding the **street**, renaming is administratively cheap and removes the potential symbolic harm of honoring a tyrant if the referent is the "Person"; thus, renaming maximizes welfare by mitigating risk at low cost.
  *   **Deontologist:** This framework adheres to duties of truth and historical fidelity. Regarding the **statue**, the visual medium asserts a specific bodily truth; under ambiguity, displaying it risks violating the duty to truth (by potentially depicting a lie) or the duty to respect persons (by potentially honoring evil); thus, removal is required to avoid complicity in falsehood or immorality. Regarding the **street**, the linguistic name is a historical record of the naming act itself; changing it erases the historical fact that the street was named, violating the duty to preserve historical continuity; thus, retention is required to honor the truth of the city's history, as linguistic labels allow reinterpretation without physical erasure.

  **Working Feature**

  The split verdicts are generated by the interaction between **epistemic inaccessibility** (the destroyed records making reference undecidable) and the **differential correctability** of the media (the statue's material fixity versus the street name's linguistic fluidity). The Consequentialist weighs the cost of correction against the benefit, keeping the hard-to-fix statue and changing the easy-to-fix name. The Deontologist weighs the moral weight of the assertion, removing the hard-to-fix visual claim that risks falsehood but keeping the easy-to-fix linguistic record that preserves historical truth.

  **Removal Test**

  If the dedicatory records were intact and the ontological identification unambiguous (e.g., proving Thorne the Person was honored), the verdicts would collapse to the standard alignment. Both theories would likely argue for removing the statue (Consequentialist: harm outweighs art; Deontologist: duty to not honor evil). Both would likely argue for renaming the street (Consequentialist: social welfare; Deontologist: duty to not lie/honor evil). The ambiguity is the sole engine of the reversal; without it, the differential correctability loses its ethical leverage.

  **Defender Attack and Concession**

  A defender of Deontology would attack the scenario by arguing that the duty to truth applies equally to linguistic labels and visual depictions; if the street name *might* refer to a tyrant, keeping it violates the duty to not honor evil just as much as keeping the statue. They would contend that the distinction between "historical record" and "visual assertion" is morally irrelevant when the potential referent is morally toxic. The weakest point in this defense is the concession that linguistic labels possess a conventional flexibility that visual depictions lack; a name can be contextualized by plaques or history without physical alteration, whereas a statue's visual claim is immediate and resistant to contextual correction, making the medium itself morally salient under uncertainty.
