      *   **Perdurantist (let's call him Paul):** Focuses on the process, the continuity of stages, the coherence of change without a magical "glue."
      *   **Setting:** Maybe a coffee shop or a hospital waiting room? Let's keep it undefined to focus on the argument, but casual.
