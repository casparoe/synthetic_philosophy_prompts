answer: |-
  # Final Exam: Rational Choice Theory Seminar

  **Question 1 (75 Minutes)**

  Consider a driver traveling a highway with two consecutive exits. Exit A yields a payoff of 1; Exit B yields a payoff of 4; missing both yields 0. The driver is absent-minded: upon reaching an intersection, he cannot distinguish Exit A from Exit B, nor can he recall whether he has passed an exit. Consequently, his strategy must be identical at both nodes (a uniform probability $p$ of exiting).

  **Modification:** Before departing, the driver may purchase a hidden commitment device for a fixed cost of 0.5. This device randomly enforces "Continue" at exactly one of the two intersections (50% chance at A, 50% at B). The driver does not know which intersection is constrained when he arrives there. If he declines the device, he applies a uniform rule at both nodes.

  Write an essay addressing the following:
  (i) Compute the ex ante expected utility of the optimal strategy both with and without the device.
  (ii) Derive the belief-dependent reasoning that applies ex post at an intersection assuming no device is purchased.
  (iii) Explain why the ex post optimal action conflicts with the ex ante optimal plan.
  (iv) Evaluate whether this conflict undermines dynamic consistency or is resolved by the commitment mechanism.

  ***

  # Model Answer

  **Ex Ante Expected Utility**
  Without the device, the driver chooses a probability $p$ of exiting at any intersection. The ex ante expected utility ($EU$) is the sum of payoffs weighted by their probabilities: exiting at A ($p \times 1$), exiting at B ($(1-p)p \times 4$), or missing both ($(1-p)^2 \times 0$).
  $$EU_{no\_device} = p + 4p(1-p) = 5p - 4p^2$$
  Maximizing with respect to $p$: $5 - 8p = 0 \Rightarrow p = 5/8$.
  $$EU_{no\_device}^* = 5(5/8) - 4(25/64) = 25/8 - 25/16 = 25/16 = 1.5625$$

  With the device (cost 0.5), the driver chooses $q$ (probability of exiting) at the unconstrained node.
  Case 1 (50%): Constrained at A (Must Continue). Reaches B. Optimal action at B is Exit ($q=1$). Payoff = 4.
  Case 2 (50%): Constrained at B (Must Continue). At A, optimal action is Exit ($q=1$) to secure 1 rather than 0. Payoff = 1.
  $$EU_{device} = 0.5(4) + 0.5(1) - 0.5 (\text{cost}) = 2.5 - 0.5 = 2.0$$
  Since $2.0 > 1.5625$, the rational ex ante choice is to purchase the device.

  **Ex Post Belief-Dependent Reasoning**
  Assume no device is purchased and the plan is $p$. At an intersection, the driver forms a belief $\alpha$ that this is Exit A. Using Bayes' rule consistent with the plan:
  $$\alpha = \frac{P(\text{At A})}{P(\text{At A}) + P(\text{At B})} = \frac{1}{1 + (1-p)}$$
  Substituting the optimal plan $p=5/8$: $\alpha = \frac{1}{1 + 3/8} = 8/11$.
  The expected utility of Exiting is $\alpha(1) + (1-\alpha)(4) = 20/11 \approx 1.81$.
  The expected utility of Continuing is $\alpha(\text{Value at B}) + (1-\alpha)(0)$. Assuming the future self follows $p$, Value at B = $4p = 2.5$.
  $$EU(\text{Continue}) = (8/11)(2.5) = 20/11 \approx 1.81$$
  Ex post, the driver is indifferent between exiting and continuing.

  **The Conflict**
  The conflict arises because the ex ante optimal plan ($p=5/8$) yields a lower utility (1.56) than the commitment strategy (2.0). Ex ante, the driver desires state-contingent behavior (Continue at A, Exit at B) to secure the payoff of 4. However, the absent-mindedness constraint forces a uniform strategy, diluting the incentive to wait. Ex post, the belief $\alpha=8/11$ reflects the likelihood of being at the low-payoff node induced by the mixing strategy. While the driver is indifferent ex post given the plan, the preference for the commitment device ex ante reveals that the uniform plan is second-best. The conflict is between the ex ante preference for conditioning (simulated by the device) and the ex post inability to distinguish nodes under the uniform rule.

  **Coherence and Commitment**
  This tension does not necessarily undermine the coherence of rational choice theory but highlights the value of commitment in dynamic games with imperfect recall. The standard argument for dynamic consistency assumes the agent can bind future selves to the ex ante plan. Here, the absent-minded driver cannot distinguish nodes to enforce the plan manually. The commitment device resolves the tension by altering the game tree: it breaks the symmetry of the nodes ex post, allowing the driver to effectively condition actions on location without memory. Thus, the conflict is not a failure of rationality but a demonstration that dynamic consistency requires feasible commitment mechanisms when information sets are constrained. The rational agent anticipates this and purchases the device, restoring consistency between ex ante wishes and ex post constraints.

