      *   **Topic:** Relevance of the Hart-Fuller debate for designing *automated compliance frameworks* (contract review, regulatory check algorithms), not sci-fi AI.
      *   **User's Insight:** Hart's "rule of recognition" $\approx$ database schema; Fuller's "internal morality of law" (8 principles) $\approx$ UX design constraints (retroactivity/opacity = practical bugs).
      *   **Task:** Identify 2-3 genuinely open conceptual questions in the Hart-Fuller space relevant to this context.
