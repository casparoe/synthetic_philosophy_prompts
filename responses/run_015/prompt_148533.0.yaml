prompt: |-
  im advising a small legal-philosophy working group that has maybe two years and three people to figure out wether the Hart-Fuller debate actualy matters for how we design automated compliance framewroks — not sci-fi stuff, just real contract-review and regulatory-check algorithms already being deployed. There's this tension I keep running into: Hart's rule of recognition seems like it should map cleanly onto a database schema, but Fuller's internal morality, those eight principles of legality, starts looking like UX design constraints — like, if the system is retroactive or opaque, users can't plan around it, which is both a Fullerian failure and a practical bug.

  So here's what I want: what are the two or three genuinely open conceptual questions left in the Hart-Fuller space that would change how that working group spends its time? Don't just list them — rank them, and defend the ranking with explicit criteria (tractability for philosophers not coders, how many downstream design choices depend on resolving it, and wether resolving it even changes practice or just tidies up theory). Also flag which ones are probably dead ends or overrated. I'm especially curious wether anyone's seriously worked through if Fuller's idea that law carries an internal moral structure can be operationalized as functional requirements for algorithmic decision systems without collapsing back into Hart-style positivism — but if you think that's a distraction, say so and explain why.
reasoning: |-
