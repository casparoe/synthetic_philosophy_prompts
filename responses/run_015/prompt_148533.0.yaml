      *   *Dead Ends:* "Is AI a Judge?" (Too sci-fi). "Hart vs. Fuller on Nazi Law" (Historical, not technical). "General Jurisprudence" (Too broad).

  7.  **Refining the "Operationalization" Query:**
      *   The user asks if operationalizing Fuller collapses into Hart.
