  ### Rule 2: Calibrated Agency Externalism
  **The Rule:** An agent has a reason to act if the action promotes objective prudential good **OR** if the action fulfills a commitment that the agent has *voluntarily ratified and is aware of*. While professional roles generate reasons (Cases 5, 6), they do so only when the agent's will is aligned with the specific obligation. If a commitment is undertaken by a surrogate (assistant) without specific ratification, or if the agent is unaware of the specific demand, the normative link is broken. This treats the lack of knowledge/ratification like the false belief in Cases 1 and 2: the "map" of the agent's mind does not match the "territory" of the obligation.

