  Based on the seven case notes provided, the philosopher's verdicts reveal a specific, hybrid form of externalism. She rejects the idea that desires alone create reasons (Case 3), but she also rejects the idea that objective moral values alone create reasons (Case 4). She distinguishes sharply between professional/institutional norms and private/moral ones.

  Here are the two rules that best fit the record, their predictions for your case, and my analysis of the philosopher's likely machinery.

  ### Rule 1: Institutional Objectivism
  **The Rule:** An agent has a reason to act if the action promotes their objective prudential good (Case 3) **OR** if the action is required by a professional or institutional role the agent currently occupies (Cases 5, 6). The existence of the reason depends on the *objective fact* of the role and its norms, not on the agent's current desire, specific knowledge of the task, or the consequences of the act (Case 5's "no interests affected"). Private moral obligations (to strangers or the dead) generate no reasons absent desire (Cases 4, 7). False beliefs about physical facts negate instrumental reasons (Cases 1, 2).

