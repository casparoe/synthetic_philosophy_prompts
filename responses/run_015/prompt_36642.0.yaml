prompt: |-
  I teach an upper-level metaphysics seminar — 14 students, one 80-minute session — on the special composition question: under what conditions do some things compose one further thing? Design an in-class game in which students staff the customs checkpoint of a small fictional republic where import duty is levied per object: whatever crosses the border as a single thing pays one fee, and officers are personally fined whenever an appeals court overturns one of their rulings.

  Smugglers (role-played by a rotating subset of the students, with their own payoff scheme) arrive with trays of carefully engineered arrangements: two bricks resting in contact, three planks nailed at a single corner, a mobile held together by one drop of glue, seven pebbles arranged in a perfect circle, a live fish swimming in water scooped from the far bank. The officers must rule on each shipment, but the game only ends when they publish a customs code: a general, non-circular criterion that decides every past and future case. The smugglers' firm prospers precisely by probing whatever vagueness or circularity the code contains — so the students should feel the pressure toward either "everything composed of nothing in contact counts" or "nothing counts" as the only codes that survive litigation.

  Please provide the full rules, the materials list, a payoff scheme requiring no real money, a timeline for the session, and a debrief that maps particular moments in the game onto the main candidate answers — universalism, nihilism, and the life-based restrictionism — with students constructing the positions themselves rather than hearing them named first. Tell me what will predictably go wrong the first time I run it and how to handle it, and be explicit about the one feature of the debate the game cannot reproduce: that the universalist insists there was never a real decision to make at the border, since composition is not a matter of policy at all. Suggest how I should supply that point, and to whom it will feel like cheating.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level metaphysics seminar (14 students, 80 minutes).
      *   **Topic:** Special Composition Question (SCQ): Under what conditions do some things compose a whole?
      *   **Activity:** An in-class game ("Customs Checkpoint").
      *   **Roles:** Customs Officers (majority), Smugglers (rotating subset).
      *   **Mechanism:** Import duty per object. Officers fined for overturned rulings. Smugglers profit from vagueness/loopholes.
      *   **Goal:** Officers must publish a "Customs Code" (general, non-circular criterion). Smugglers try to break it.
      *   **Expected Outcome:** Pressure toward Universalism ("everything composes") or Nihilism ("nothing composes") to avoid litigation risk.
      *   **Deliverables:** Rules, Materials, Payoff Scheme (no real money), Timeline, Debrief (mapping to Universalism, Nihilism, Restrictionism), Troubleshooting (what goes wrong), and the "Missing Feature" (Universalism's claim that composition isn't policy).

  2.  **Deconstruct the Metaphysics:**
      *   *Nihilism:* Composition never occurs (only simples exist).
      *   *Universalism:* Composition always occurs (any plurality composes a whole).
      *   *Restrictionism (Moderate):* Composition occurs only under specific conditions (contact, fastening, life, etc.).
      *   *The Game's Logic:* The game forces students to draw lines. Drawing lines invites counterexamples (Sorites-style or edge cases). To avoid being "fined" (wrong), they need a rule that covers everything or nothing, mirroring the philosophical pressure toward the extremes.

  3.  **Drafting the Game Mechanics:**
      *   *Students:* 14 total. Let's say 10 Officers, 4 Smugglers (rotating).
      *   *Currency:* "Merit Points" or "Philosophy Credits."
      *   *The "Objects":* Need physical props. Bricks, planks, glue, pebbles, fish bowl (maybe fake fish for practicality).
      *   *The Ruling:* Officers say "One Object" (pay 1 fee) or "Many Objects" (pay N fees).
      *   *The Appeal:* The Instructor acts as the Appeals Court.
      *   *The Code:* The end goal. A written statement.

  4.  **Developing the Payoff Scheme:**
      *   *Officers:* Want to maximize points. Get points for correct rulings, lose points for overturned rulings. *Crucial:* They lose points for *inconsistency* relative to their Code.
      *   *Smugglers:* Want to maximize points. Get points if their ruling is overturned (proving vagueness).
      *   *Incentive:* Officers want a safe rule. Smugglers want to find edge cases.

  5.  **Timeline (80 Minutes):**
      *   Intro/Setup (10 min)
      *   Round 1: Ad-hoc rulings (15 min)
      *   Round 2: Drafting the Code (15 min)
      *   Round 3: Stress-testing the Code (20 min)
      *   Debrief/Mapping to Metaphysics (20 min)

  6.  **Addressing the "Missing Feature":**
      *   The game treats composition as a *conventional* or *legal* decision (policy).
      *   Universalism (Lewis, etc.) argues composition is *ontological fact*, not policy.
      *   *Solution:* In the debrief, the instructor must reveal that the game itself is rigged because it assumes composition is up to us. This will feel like "cheating" to the Universalists because it dismisses their core intuition that the answer was there all along.

  7.  **Troubleshooting (What goes wrong):**
      *   *Students stall:* They can't agree on a code. *Fix:* Impose a deadline.
      *   *Smugglers are too nice:* *Fix:* Give them specific secret objectives.
      *   *Nihilism is confusing:* "Nothing exists" is hard to roleplay. *Fix:* Frame it as "Zero Duty" vs "Infinite Duty" or simply count the simples.
      *   *Time management:* 80 mins is tight. *Fix:* Keep props simple.

  8.  **Refining the Debrief:**
      *   Map "Strict Contact Rule" to Common Sense/Restrictionism.
      *   Map "Everything Counts" to Universalism.
      *   Map "Nothing Counts" to Nihilism.
      *   Show how the game pushes them to the extremes (Sorites pressure).

  9.  **Writing the Content (Iterative refinement):**
      *   *Tone:* Academic but playful.
      *   *Clarity:* Explicit instructions for the professor.
      *   *Materials:* Keep it low-tech.
      *   *The "Fish":* A live fish is logistically nightmare-ish. Suggest a toy fish or a bowl of water with a distinct "boundary" issue. Let's suggest a sealed bag with a toy fish to avoid animal welfare issues and spills.
      *   *The "Code":* Needs to be written on the board.

  10. **Final Review against Constraints:**
      *   14 students? Yes.
      *   80 mins? Yes.
      *   Payoff scheme (no money)? Yes (points).
      *   Debrief mapping? Yes.
      *   Predictable failures? Yes.
      *   Missing feature (Universalism's ontological claim)? Yes.

  11. **Self-Correction during drafting:**
      *   *Correction:* Initially, I thought about having the Instructor be the Appeals Court. But if the Instructor is the Court, they determine truth. In metaphysics, there *is* no truth yet.
      *   *Adjustment:* The "Appeals Court" should be logical consistency. If the Code says "Contact" and the smuggler shows two things touching but not composing (intuitively), the Officer loses. Actually, better: The *Instructor* plays the "Intuition Pump." If the class agrees the ruling is absurd, the Officer loses. This simulates the "overturning."
      *   *Wait, the prompt says:* "officers are personally fined whenever an appeals court overturns one of their rulings." I need to define the Appeals Court. In a classroom, the *Instructor* is the Court, but the *standard* is the coherence of the Code.
      *   *Better:* The "Appeals Court" is the *consistency of the Code*. If a ruling contradicts the Code, it's overturned. If the Code is vague, the Smuggler wins the appeal.
      *   *Actually, let's look at the prompt again:* "Smugglers' firm prospers precisely by probing whatever vagueness or circularity the code contains." Okay, so if the Code is vague, the Smuggler wins.
      *   *Refined Mechanism:* Officers make rulings. Smugglers challenge. If the Code doesn't clearly dictate the ruling, Smuggler wins points, Officer loses points.

  12. **Final Polish:** Ensure the distinction between "Policy" (Game) and "Ontology" (Reality) is sharp in the debrief.

  *(Self-Correction on the "Universalism Cheating" point)*: The prompt asks to be explicit about the one feature the game cannot reproduce: that the universalist insists there was never a real decision to make. I need to make sure the instructor knows *when* to drop this bombshell. It should be at the very end of the debrief.

  13. **Finalizing the Plan.** (Proceeds to generate output based on these thoughts).
answer: |-
  # Seminar Plan: The Republic of Composition
  **Topic:** The Special Composition Question (SCQ)
  **Time:** 80 Minutes
  **Students:** 14
  **Level:** Upper-Level Undergraduate/Graduate

  ## I. Learning Objectives
  By the end of the session, students will:
  1.  Experience the theoretical pressure that drives metaphysicians toward Nihilism and Universalism.
  2.  Understand the vulnerability of "Common Sense" Restrictionism to Sorites-style vagueness.
  3.  Distinguish between composition as a *conventional policy* (the game) and composition as an *ontological fact* (the debate).

  ## II. Materials List
  *   **Props (The Shipments):**
      1.  Two bricks resting in contact.
      2.  Three planks nailed at a single corner (a loose tripod).
      3.  A mobile held together by one drop of glue.
      4.  Seven pebbles arranged in a perfect circle (not touching).
      5.  A sealed clear bag containing water and a plastic toy fish (simulates the "live fish" without animal welfare issues).
      6.  *Wildcard:* A pile of loose sand.
  *   **Game Board:** Whiteboard divided into "Customs Ledger" and "The Code."
  *   **Currency:** "Ontology Credits" (OC). Use poker chips, printed slips, or tally marks on the board.
  *   **Handouts:** One "Customs Officer Badge" (lanyard/card) for officers; one "Smuggler's Manifest" for smugglers.

  ## III. Payoff Scheme (No Real Money)
  **Customs Officers (10 Students)**
  *   **Base Salary:** 5 OC per round for participating.
  *   **Correct Ruling:** +2 OC (Ruling aligns with the final published Code).
  *   **Overturned Ruling:** -5 OC (Ruling contradicts the Code or the Code is too vague to adjudicate).
  *   **Goal:** Maximize personal OC. Avoid risk.

  **Smugglers (4 Students, Rotating)**
  *   **Base Salary:** 2 OC per round.
  *   **Successful Appeal:** +10 OC (If they prove a ruling contradicts the Code, or the Code is vague/circular).
  *   **Failed Appeal:** -2 OC.
  *   **Goal:** Provoke inconsistency or vagueness in the Code.

  **The Appeals Court (The Instructor)**
  *   You do not decide what *really* composes. You decide if the *Code* was applied consistently.
  *   *Crucial Mechanic:* If the Code says "Objects must touch," and the Officer rules the pebbles (not touching) are "One Object," the Smuggler appeals. You rule in favor of the Smuggler (Officer fined) because the ruling violated the Code.
  *   *Vagueness Mechanic:* If the Code says "Objects must be firmly fastened," and the smuggler presents the "one drop of glue" mobile, the Officer must interpret "firmly." If the class (by show of hands) agrees "firmly" is ambiguous here, the Smuggler wins the appeal.

  ## IV. Timeline (80 Minutes)

  ### 1. Setup & Briefing (10 Minutes)
  *   **Narrative:** Welcome them to the Republic of *Mereologia*. Import duty is 100 credits per *Object*. If you import 5 bricks as "5 objects," duty is 500. If you import them as "1 wall," duty is 100.
  *   **Roles:** Assign 10 Officers (seated at a table facing the class) and 4 Smugglers (standing with the props).
  *   **Task:** Officers must process shipments. At the end, they must publish **The Customs Code**: a single sentence that dictates all future rulings.
  *   **Constraint:** The Code cannot use the word "object" or "thing" (to prevent circularity like "One object is when objects compose an object").

  ### 2. Phase 1: Ad-Hoc Rulings (15 Minutes)
  *   Smugglers present items one by one.
  *   Officers confer briefly and declare: "Single Object" (1 Fee) or "Multiple Objects" (N Fees).
  *   Instructor tallies OC.
  *   *Predictable Outcome:* Officers will rely on intuition. Bricks touching = 1 Object. Pebbles in circle = Multiple. Fish in water = 1 Object.
  *   *Tension:* Ask Officers *why*. Write their reasons on the board (Contact? Function? Glue?).

  ### 3. Phase 2: Drafting The Code (15 Minutes)
  *   Officers must synthesize their reasons into one general criterion.
  *   Smugglers watch and take notes on loopholes.
  *   *Instructor Role:* Act as legal counsel. "Does 'contact' include air molecules? Does 'fastened' include gravity?"
  *   **Deliverable:** The Code is written on the board. (e.g., "Some things compose a whole if and only if they are physically fastened.")

  ### 4. Phase 3: Stress Testing (20 Minutes)
  *   Smugglers get the props again. They can now propose *hypothetical* shipments if physical props run out (e.g., "Two bricks separated by 1 micron," "A cat and its tail," "The Eiffel Tower and your left shoe").
  *   Officers must apply **The Code**.
  *   **The Squeeze:**
      *   If the Code is "Contact": Smuggler asks about the pebbles (no contact) or the bricks (microscopic gaps).
      *   If the Code is "Fastening": Smuggler asks about the drop of glue (is it firm?) or the fish (is water fastening the fish?).
      *   If the Code is "Life": Smuggler asks about the corpse of the fish.
  *   Every time the Code fails to yield a clear answer, Smugglers gain OC, Officers lose OC.
  *   **Pressure:** Officers will realize the only way to avoid fines is to make the Code cover *everything* (Universalism) or *nothing* (Nihilism).
      *   *Universalist Code:* "Any plurality composes a whole." (No fines, but high duty for importers).
      *   *Nihilist Code:* "No plurality ever composes a whole." (No fines, but duty is always on the simples).

  ### 5. Debrief & Metaphysical Mapping (20 Minutes)
  *   Stop the game. Reset the room.
  *   **Step 1: The Restrictionist Trap.** Ask the Officers: "Why was your first Code (e.g., Contact/Fastening) hard to defend?"
      *   *Map:* This is **Moderate Restrictionism** (Van Inwagen, Common Sense).
      *   *Lesson:* It feels right, but it relies on vague predicates ("contact," "fastened") that smugglers can exploit via Sorites series.
  *   **Step 2: The Safe Havens.** Ask: "Which Codes survived the stress test without fines?"
      *   *Map:* "Everything composes" is **Universalism** (Lewis, Sider). "Nothing composes" is **Nihilism** (Rosen, Dorr).
      *   *Lesson:* These are precise. No vagueness. No litigation risk. But they violate common sense.
  *   **Step 3: The Missing Feature (The Instructor's Reveal).**
      *   *Script:* "In this game, composition was a matter of *policy*. You chose the Code to avoid fines. But in the actual metaphysical debate, the Universalist does not say 'We should policy-wise count everything.' They say 'There is no decision to make. Composition *just happens* always.' The game cannot simulate this because I gave you the power to decide. For the Universalist, the border guard has no authority. The objects compose regardless of the fee."
      *   *Reaction:* This will feel like **cheating** to the students who gravitated toward Universalism. They will argue, "But the game showed Universalism is the only consistent rule!"
      *   *Response:* Acknowledge this. "Exactly. The game shows Universalism is the only consistent *convention*. The Universalist claims it's the only consistent *reality*. The Nihilist claims the game is rigged because there are no objects to tax, only simples arranged object-wise."

  ## V. Predictable Failures & Fixes

  **1. The "Stall" (Officers can't agree on a Code)**
  *   *Problem:* Democratic deliberation takes too long.
  *   *Fix:* Appoint a "Chief Customs Officer" (rotate every 5 mins) who has tie-breaking power. Or, impose a 2-minute timer for drafting.

  **2. The "Nihilist Confusion" (Students don't get how to tax 'nothing')**
  *   *Problem:* If nothing composes, how do we charge duty?
  *   *Fix:* Clarify early: "Duty is levied on *simples* if no composites exist. If the bricks compose a wall, you pay 1 fee. If they don't, you pay 2 fees (one for each brick)." This ensures Nihilism is a viable economic strategy in the game (higher revenue for the state, but logically consistent for the officer).

  **3. The "Smuggler Collusion" (Smugglers go easy on friends)**
  *   *Problem:* Friends don't fine friends.
  *   *Fix:* Make the Smuggler role highly desirable (highest potential points). Announce that the top scorer gets a tangible reward (e.g., choosing the next reading, extra credit point, or just public glory).

  **4. The "Universalist Victory Lap" (Students think they solved metaphysics)**
  *   *Problem:* Students conclude Universalism is "correct" because it won the game.
  *   *Fix:* This is why the **Missing Feature** section of the debrief is critical. You must explicitly undermine the game's ontology in the final 5 minutes.

  ## VI. The "Cheating" Point: Ontology vs. Policy
  *Be explicit about this in your preparation.*

  The game models composition as **conceptual engineering** or **conventionalism**. It rewards precision.
  *   **Universalism in the Game:** "We define 'object' loosely to avoid fines."
  *   **Universalism in Metaphysics:** "There is no definition. The world is saturated with objects. To deny the object composed of your left shoe and the Eiffel Tower is to deny a fact, not to adopt a strict policy."

  **Who will feel cheated?**
  The students who found Universalism compelling during the game. They used the game to demonstrate that Universalism is the only *rationally defensible* position against vagueness. When you tell them, "Actually, the Universalist doesn't care about your defense, they think the question is settled by logic alone," you are removing their agency.
  *   **How to handle it:** Validate their feeling. "It feels like cheating because the game is a model of *epistemic* pressure (how we know what to say), while the debate is about *ontological* truth (what exists). The game proves that if we *must* speak, Universalism is safest. It does not prove Universalism is true."

  ## VII. Instructor's Cheat Sheet: Mapping Moments to Positions

  | Game Moment | Student Reaction | Metaphysical Position |
  | :--- | :--- | :--- |
  | **Phase 1 (Ad-Hoc)** | "The bricks are one, the pebbles aren't." | **Common Sense Restrictionism** (Van Inwagen). Relies on intuitive boundaries. |
  | **Phase 3 (Stress Test)** | "Wait, is 1 micron contact? What about 0.001 micron?" | **The Sorites Problem**. Shows vagueness in Restrictionism. |
  | **Phase 3 (Desperation)** | "Let's just say everything counts." | **Universalism**. Avoids vagueness, accepts counter-intuitive results (arbitrary undetached parts). |
  | **Phase 3 (Desperation)** | "Let's just say nothing counts." | **Nihilism**. Avoids vagueness, denies existence of tables/people. |
  | **Debrief (Reveal)** | "But the objects exist regardless of our code!" | **Realism**. The realization that the game was about language/policy, not being. |

  ## VIII. Post-Session Assignment
  To cement the "Missing Feature," assign a short response:
  *"In the game, you adopted Universalism to avoid fines. If composition is not a matter of policy but a matter of fact, what argument (other than 'avoiding vagueness') could convince you that a whole composed of your shoe and the Eiffel Tower actually exists?"*
