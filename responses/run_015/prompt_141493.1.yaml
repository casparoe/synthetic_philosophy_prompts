          *   *Calculation:* This might be too hard for mental math in 60 mins.
          *   *Alternative:* Pre-computed "Cheat Sheets". Given your signal and the announced number, here is your new number.
          *   *Decision:* Let's go with the **"Urn and Signals"** model but simplified.
          *   World $W \in \{A, B\}$. Prior $P(A)=0.5$.
