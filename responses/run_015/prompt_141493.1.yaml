          *   Players draw one chip each *without replacement*.
          *   They see their own chip. That's their partition cell.
          *   Target: Probability that the World is "2 Red, 1 Blue".
          *   *Problem:* Once they draw, the state is fixed. They are sampling without replacement. This is standard Bayesian updating.
          *   *Aumann Twist:* They don't see the chips, they just know their *own* chip. They announce posteriors.
          *   *Wait, Aumann is about Common Knowledge of Posteriors.* In a small group drawing chips, if Player 1 says "I have Red", Player 2 knows Player 1 has Red. This reveals the partition cell directly. Aumann says you only need to announce the *Posterior*, not the *Signal*.
          *   *Crucial Design:* I need a setup where announcing the Posterior reveals *less* than announcing the Signal, but enough to force convergence.
          *   *Idea:* Overlapping information.
          *   *Setup:* 3 Players. A "Board" of 4 hidden tiles (2 True, 2 False).
