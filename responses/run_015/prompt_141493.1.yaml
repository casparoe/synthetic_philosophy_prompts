      *   *Refinement for "Partition vs Posterior":* Give them a table where two different signals lead to the *same* posterior.
      *   Signal A (Prob 0.2): Posterior 60%.
      *   Signal B (Prob 0.2): Posterior 60%.
      *   Signal C (Prob 0.6): Posterior 40%.
      *   If I announce 60%, you don't know if I got A or B. This preserves the partition privacy while sharing the posterior.
      *   *This is the winner.*

