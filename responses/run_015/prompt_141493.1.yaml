  ## Facilitator Cheat Sheet: The Math Behind the Cards
  *To ensure the game runs smoothly, here is the logic for your Lookup Tables.*

  **Setup for Round 1:**
  *   **World:** $W \in \{Red, Blue\}$. Prior $P(Red) = 0.5$.
  *   **Signals:** $S \in \{s_1, s_2, s_3\}$.
  *   **Likelihoods:**
      *   $P(s_1 | Red) = 0.6, P(s_1 | Blue) = 0.4 \rightarrow$ Posterior $\approx 60\%$
      *   $P(s_2 | Red) = 0.6, P(s_2 | Blue) = 0.4 \rightarrow$ Posterior $\approx 60\%$ (Note: Same posterior, different signal label for partition distinction).
      *   $P(s_3 | Red) = 0.9, P(s_3 | Blue) = 0.1 \rightarrow$ Posterior $\approx 90\%$
  *   **Update Logic (Round 2):**
      *   If I have $s_1$ (60%) and hear 90%: I know partner has $s_3$.
      *   Combined Likelihood Ratio: $(0.6/0.4) \times (0.9/0.1) = 1.5 \times 9 = 13.5$.
      *   New Odds: $1 \times 13.5 = 13.5$.
      *   New Prob: $13.5 / 14.5 \approx 93\%$.
      *   *Print "93%" on the Lookup Table for this intersection.*

  **Setup for Round 2 (Broken Prior):**
  *   Player A Prior: 0.5 (Odds 1:1).
  *   Player B Prior: 0.9 (Odds 9:1).
  *   If Player A (50%) hears Player B announce 90%:
      *   A assumes B started at 50%. A infers B has signal $s_3$. A updates to 93%.
  *   If Player B (90%) hears Player A announce 60%:
      *   B assumes A started at 50%. B infers A has signal $s_1$.
      *   B's True Update: Prior Odds (9) $\times$ Likelihood $s_1$ (1.5) = 13.5 Odds $\rightarrow$ 93%.
      *   *Wait, in this specific math, they might still converge.*
      *   **To ensure failure:** Make the priors extreme.
      *   Player A Prior: 10%. Player B Prior: 90%.
      *   They will interpret the *same* announced number as coming from vastly different signal strengths, leading to divergent updates.

  **Setup for Round 3 (The Bet):**
  *   Agreed Prob: 80%.
  *   Bet: Win 10 if Red, Lose 10 if Blue.
  *   EV = $0.8(10) + 0.2(-10) = 8 - 2 = +6$.
  *   Risk Averse Utility: $U(x) = \sqrt{x}$. Loss of 10 hurts more than Gain of 10 helps.
  *   Desperate Utility: Threshold function. Below 15 chips = 0 utility.

