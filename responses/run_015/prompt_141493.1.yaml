          *   Partitions pre-printed on "Vision Goggles" (cards).
          *   Prior: 50/50 on Event E.
          *   Process: 3 Rounds of announcement.
          *   Math: Provide a "Bayes Calculator" wheel or table to avoid arithmetic errors.
      *   **Round 2: Broken Prior (15 mins).**
          *   Same setup, but half the groups get "Biased Prior" sheets.
          *   Observe failure to converge on the *same* number.
      *   **Round 3: The Bet (10 mins).**
          *   Converged group offered a bet.
          *   Introduce Utility Cards (Risk Averse vs Neutral).
          *   Discuss why some bet and some don't.
      *   **Debrief (30 mins):**
          *   Map game to Theorem.
          *   Address the "Perfect Bayesian" objection (Aaronson's bound).
          *   Discuss limitations (Common Prior assumption is the heavy lifter).

