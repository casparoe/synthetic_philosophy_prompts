      *   Round 2+: Look up "My Signal + Their Last Number" -> "My New Number".
      *   *Wait, this hides the logic.*
      *   *Compromise:* Use **Log-Odds Sheets**.
      *   Prior = 0 bits. Signal H = +1 bit, Signal L = -1 bit.
      *   Posterior = Sum of bits.
      *   If I say "2 bits", you know I have +1 (since Prior 0).
      *   This makes the "Partition vs Posterior" distinction clear.
      *   *Let's try the "4-State Grid" again but simplified.*
      *   State Space: 4 Cards (A, B, C, D).
      *   Event: "Is it A or B?" (Prior 50%).
