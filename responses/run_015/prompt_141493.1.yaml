  ## Final Checklist for Printing
  1.  **Vision Cards:** 3 types per group (ensure two map to the same posterior).
  2.  **Update Tables:** 3x3 Matrix (My Prob vs Their Prob -> New Prob).
  3.  **Prior Cards:** Standard (50%) and Biased (10%/90%).
  4.  **Utility Cards:** Neutral, Averse, Desperate.
  5.  **Score Sheets:** To track chips and announced numbers.

  This plan keeps the arithmetic off the table (literally) so the *epistemic mechanics* are the only thing they have to grapple with. Good luck.
