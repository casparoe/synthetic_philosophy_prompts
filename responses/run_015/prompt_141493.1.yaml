      *   *Core Mechanism:* Agents have private information (partitions of a state space). They share a common prior. They announce posteriors. Common knowledge of posteriors implies identical posteriors.
      *   *The "Feel":* I say 60%. You say 80%. I update on the fact that *you* say 80% (which tells me something about your signal). I revise to 75%. You revise to 75%. We stop.
      *   *The Trap:* If I just average, I'm not doing Bayesian updating. If I ignore your number, I'm not treating it as informative.
      *   *The "No-Trade" Link:* If we agree on the probability, we shouldn't bet (Milgrom-Stokey). If we bet, we must disagree (or have different utility/risk).

