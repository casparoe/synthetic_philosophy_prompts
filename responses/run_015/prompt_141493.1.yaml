          *   *Fix:* Use the **"Grid" Method**.
          *   State Space: 16 squares (4x4).
          *   World is "Is the hidden token in the Left Half?"
          *   Player 1 sees Rows. Player 2 sees Columns.
          *   This is the classic partition example.
          *   *Adaptation for 14 people:* Groups of 3.
          *   State Space: 8 possible worlds (numbered 1-8).
