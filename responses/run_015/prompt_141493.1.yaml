          *   They see their chip.
          *   Target: Prob(World A).
          *   *Why this works for Aumann:* If I say "My posterior is 60%", you know I likely drew Red. But if I say "I drew Red", you know exactly my partition. The theorem says announcing 60% is enough.
          *   *Wait, if the mapping is 1-to-1, announcing posterior = announcing signal.*
          *   To make it distinct, we need **coarse partitions**.
          *   *Revised Game:* **"The 4-Card Hand"**.
          *   Deck: 4 Aces, 4 Kings. (World: Majority Ace?)
          *   Deal 1 card to each of 3 players.
          *   Partition: You see your card.
          *   This is still 1-to-1.
          *   *Okay, let's accept the 1-to-1 for the basic game to keep it playable, but emphasize in debrief that the *number* is what matters.*
          *   *Actually, to satisfy the prompt's specific request ("difference between hearing posterior... and hearing which cell"):* I need a setup where two different cells yield the same posterior.
          *   *Setup:* State Space $\Omega = \{1, 2, 3, 4\}$. Event $E = \{1, 2\}$. Prior uniform (0.25 each).
          *   Player 1 Partition: $\{\{1, 2\}, \{3, 4\}\}$.
          *   Player 2 Partition: $\{\{1, 3\}, \{2, 4\}\}$.
          *   If State is 1: P1 sees $\{1,2\}$ (Posterior $P(E)=1$). P2 sees $\{1,3\}$ (Posterior $P(E)=0.5$).
          *   If State is 2: P1 sees $\{1,2\}$ (Posterior $P(E)=1$). P2 sees $\{2,4\}$ (Posterior $P(E)=0.5$).
          *   *Key:* P1 cannot distinguish State 1 and 2. But in both, Posterior is 1.
          *   *Game Implementation:* Use a deck of 4 cards labeled 1-4. Dealer picks one (State). Players get "View Cards" that tell them which set they are in.
          *   *Too abstract.*
          *   *Let's go with the "Signal Strength" approach.*
          *   World: H or L.
          *   Signal: 1, 2, or 3.
          *   $P(1|H) = 0.5, P(2|H) = 0.3, P(3|H) = 0.2$.
          *   $P(1|L) = 0.2, P(2|L) = 0.3, P(3|L) = 0.5$.
          *   Signal 2 gives same posterior for both H and L (0.5).
          *   Signal 1 gives High posterior. Signal 3 gives Low posterior.
          *   If Player 1 gets Signal 2, they say 50%. Player 2 knows P1 got Signal 2.
          *   This works. It allows the "Posterior vs Partition" distinction.

