      *   If I secretly give Group A Prior=50% and Group B Prior=90%.
      *   They announce posteriors.
      *   Group A says 60%. Group B says 95%.
      *   They update.
      *   Do they converge?
      *   If they *think* priors are common, they will update assuming the other person started at 50%.
      *   Group A hears 95%. Thinks "Wow, strong signal." Updates up.
      *   Group B hears 60%. Thinks "Weak signal." Updates slightly.
