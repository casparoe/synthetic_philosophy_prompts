      *   *Fix:* **Coarse Signals.**
      *   Signal can be Weak-G, Strong-G, Weak-R, Strong-R.
      *   Weak-G = +1. Strong-G = +3.
      *   If I announce +2, you don't know if I got (Strong-G + Weak-R) or (Weak-G + Weak-G).
