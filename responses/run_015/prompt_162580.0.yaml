answer: |-
  ### The Causal Sanity Check: A Protocol for the Deadline-Driven

  You are working in the gap between *identification* (can we isolate a number?) and *truth* (does that number mean what we think it means?). In experiments, random assignment bridges that gap. In history, nothing does. Your job is not to verify the math—the referees did that—but to verify the *story* the math is allowed to tell.

  Here is the decision procedure. It is designed to be run in fifteen minutes with a PDF and a press release. It moves from the structural properties of the data to the specificity of the claim.

  #### Step 1: The Independence Check (The $N$ Problem)
  **Question:** Are the units of analysis statistically independent, or are they spatially and historically clustered?
  **Look for:** The number of observations ($N$) versus the number of *independent* historical events.
  **The Test:**
  *   If the study uses cross-country regression ($N \approx 100$), ask: How many independent colonial experiences, legal origins, or geographic zones are there really? Often, $N=100$ countries is actually $N=5$ historical clusters with noise.
  *   If the study uses sub-national units (districts, counties), ask: Is there spatial autocorrelation? (Did they correct for it?)
  **Pass:** The authors acknowledge clustering and adjust standard errors, or the design (e.g., Regression Discontinuity) relies on local variation where independence is plausible.
  **Fail:** The study treats 150 countries as 150 independent draws from a distribution.
  **Verdict:** If Fail, you cannot write "causes." You must write "is associated with, controlling for..."

  #### Step 2: The Exogeneity Check (The Assignment Problem)
  **Question:** Is the variation in the "treatment" (institutions, culture, geography) plausibly unrelated to the outcome except through the proposed channel?
  **Look for:** The identification strategy. Is it an Instrumental Variable (IV), a Natural Experiment, or a Regression Discontinuity (RD)? Or is it just OLS with control variables?
  **The Test:**
  *   **OLS with Controls:** Automatic Fail for causal claims. You cannot control for everything.
  *   **IV:** What is the instrument? Is it truly excluded from the second stage? (e.g., Settler Mortality affects income *only* through institutions?)
  *   **RD/Natural Experiment:** Is the cutoff truly arbitrary? (e.g., a river boundary vs. a border drawn along ethnic lines).
  **Pass:** The variation looks "as good as random" conditional on the design.
  **Fail:** The "treatment" was chosen by people (endogenous), or the instrument affects the outcome through multiple channels.
  **Verdict:** If Fail, downgrade to "predicts" or "correlates with."

  #### Step 3: The Equivalence Check (Your "Swap Test" Refined)
  **Question:** If I swap the proposed mechanism for a rival from a different family (Institutions $\leftrightarrow$ Geography $\leftrightarrow$ Culture), does the identifying variation still hold?
  **Look for:** The robustness section and the discussion of alternative channels.
  **The Test:**
  *   Take the author's instrument or cutoff.
  *   **Swap:** If the author claims "Institutions cause Growth" using "Colonial Legal Origin" as variation, ask: Could "Culture" or "Geography" also vary by Colonial Legal Origin?
  *   If the answer is Yes, the design cannot distinguish the mechanisms. They are observationally equivalent *within this design*.
  **Pass:** The variation isolates the specific mechanism (e.g., a policy change that affects rules but not culture or geography).
  **Fail:** The variation is a "bundle" (e.g., a colonial border changes laws, language, religion, and trade access simultaneously).
  **Verdict:** If Fail, you must write about a "persistent historical factor" or "bundle," not the specific mechanism. **This is where most cross-country studies die.**

  #### Step 4: The Mechanism Check (The Black Box)
  **Question:** Do they show the pipe, or just the tap and the sink?
  **Look for:** A table where the dependent variable is an intermediate step (e.g., Investment, Innovation, Trade), not just Final Income.
  **The Test:**
  *   Causal inference establishes $X \to Y$. It does not establish *how*.
  *   If they claim "Trust causes Growth," do they show that Trust leads to Investment which leads to Growth? Or just that Trust and Growth move together?
  **Pass:** They demonstrate the intermediate link.
  **Fail:** They assert the mechanism based on theory alone.
  **Verdict:** If Fail, you can claim the relationship, but you must qualify the *story* of how it works as "proposed" or "hypothesized," not demonstrated.

  #### Step 5: The External Validity Check (The Generalization)
  **Question:** Does the local causal effect apply to the headline claim?
  **Look for:** The scope of the data vs. the scope of the press release.
  **The Test:**
  *   If the study is about 19th-century Prussia, can the headline say "Nations"?
  *   If the study is about "Security of Property," does the index actually measure security, or just elite stability?
  **Pass:** The authors limit their claims to the context of the data.
  **Fail:** The press release (and often the abstract) generalizes a local finding to a universal law.
  **Verdict:** If Fail, restrict the headline to the specific context (e.g., "In post-colonial states..." rather than "In nations...").

  ---

  ### The Refined "Swap Test"
  You asked me to engage with your heuristic. I am keeping it, but sharpening it. Your version asks if the *story* can be swapped. My refinement asks if the *variation* can be swapped.

  **The Rule:** A study earns a specific causal label (e.g., "Institutions") only if the identifying variation moves the target mechanism *without* moving the rivals. If the instrument (e.g., a historical border) shifts Institutions, Culture, *and* Market Access simultaneously, the Swap Test reveals that the study has identified a "Historical Shock," not "Institutions."

  **Why the change?** Because authors can always write a story that fits their data. The constraint isn't the narrative; it's the variance. If the variance is collinear, the narrative is undecidable.

  ---

  ### Application to Your Three Cases

  #### Case 1: Cross-Country Institutions (The Classic)
  *   **Design:** Cross-country regression, $N \approx 100$, IV using historical settler mortality or legal origin.
  *   **Run the Protocol:**
      *   *Independence:* **Fail.** Countries are not independent; they share colonial histories and geographic zones.
      *   *Exogeneity:* **Weak.** Settler mortality is correlated with disease environments (Geography) which persist today.
      *   *Swap Test:* **Fail.** You can swap "Institutions" for "Disease Burden" or "Colonial Extraction Culture." The variation (colonial experience) moves all three. The design cannot tell them apart.
      *   *Mechanism:* **Mixed.** Usually shows investment channels, but often assumed.
  *   **Verdict:** **Do not write "Institutions cause prosperity."**
  *   **Headline Sentence:** "Historical colonial conditions that shaped property rights are strongly associated with modern income levels, though the specific channel remains debated."
  *   **Reasoning:** The Swap Test kills the specific causal claim. You are looking at a bundle of colonial legacies.

  #### Case 2: Medieval Monastic Boundary (The RD)
  *   **Design:** Regression Discontinuity within one country, border of monastic land tenure.
  *   **Run the Protocol:**
      *   *Independence:* **Pass.** Local variation near the river minimizes spatial autocorrelation.
      *   *Exogeneity:* **Pass.** A medieval river boundary is plausibly exogenous to modern economic shocks.
      *   *Swap Test:* **Pass (Locally).** Because the comparison is *across the river*, Geography (soils, climate) is held constant. Culture might vary, but the institutional difference (tenure rules) is the sharp discontinuity. However, could "Culture" also jump at the river? Possibly, if people sorted. But the design is strong enough to rule out broad Geography.
      *   *Mechanism:* **Check.** Do they show *why*? (e.g., land consolidation, trust norms).
      *   *External Validity:* **Fail.** This is one river in one country.
  *   **Verdict:** **Causal, but Local.**
  *   **Headline Sentence:** "In this region, medieval land-tenure boundaries created a persistent economic discontinuity that survives today."
  *   **Reasoning:** You can use causal language ("created," "caused") but you must restrict the scope. Do not generalize to "Nations." The Swap Test passes because Geography is controlled by the RD design, but the External Validity check limits the claim.

  #### Case 3: Your Culture/Religion Piece (The Hard Truth)
  *   **Design:** Survey measures of patience/trust + Historical Religious Border.
  *   **Run the Protocol:**
      *   *Independence:* **Pass/Weak.** Depends on survey design.
      *   *Exogeneity:* **Fail.** Religious borders are rarely random. They follow trade routes, geography, and pre-existing cultural fault lines. People self-select into religious communities.
      *   *Swap Test:* **Fail.** This is the killer. A religious border also marks an institutional boundary (church law vs. secular law), a linguistic boundary, and often a geographic boundary (mountains protect minorities). If you swap "Culture" for "Institutions" (e.g., church property rights), the variation looks identical.
      *   *Mechanism:* **Weak.** Survey measures of "patience" are noisy and endogenous to current wealth.
  *   **Verdict:** **Associational / Conditional.**
  *   **Headline Sentence:** "Historical religious boundaries align with modern differences in economic behavior, suggesting a persistent cultural or institutional legacy."
  *   **Reasoning:** I know you want to write the feature. But the design cannot distinguish Culture from Institutions. Religious borders *are* institutional borders. To claim it is *Culture* (patience/trust) requires assuming the Institutional channel is closed, which the data does not support.
  *   **The Pivot:** You can save the story by framing it as "The Persistence of Historical Identity" rather than "Culture Causes Wealth." Acknowledge the bundle. The value is in the *persistence*, not the specific *channel*.

  ---

  ### What This Procedure Cannot Do

  You asked for the limits. This protocol is a filter for falsehoods, not a generator of truth. It protects you from saying $X$ causes $Y$ when the design only supports $X$ correlates with $Y$. It cannot solve the following:

  1.  **Equifinality:** The procedure might tell you "Institutions matter" (Case 2) and "Culture matters" (Case 3, if charitable). It cannot tell you that both are true, and that Culture causes Institutions which cause Growth. It treats mechanisms as competitors, but in history, they are often complements.
  2.  **The Bundle Problem:** When the Swap Test fails (as in Case 1 and 3), the truth is often that the "bundle" causes the outcome. The procedure forces you to be vague ("historical legacy"), which is accurate but unsatisfying. It cannot disentangle a knot that is historically tied.
  3.  **Magnitude vs. Existence:** The procedure helps you decide if a cause *exists*. It does not help you decide if it *matters* at scale. A causal effect can be statistically significant but economically trivial. You must still eyeball the coefficient size relative to the variance in the outcome.
  4.  **Theory Choice:** When the data is silent (Swap Test fails), the procedure tells you to stop claiming facts. It does not tell you which theory is more *plausible*. That remains a matter of judgment, based on your reading of history, not your reading of the regression table.

  **Final Instruction:** When the procedure tells you to downgrade from "Causal" to "Associational," do not view it as a loss of precision. View it as a gain in honesty. Your readers can handle complexity; they cannot handle being misled by a causal verb that the history does not support.
