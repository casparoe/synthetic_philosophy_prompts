      *   (2) Category error: Valuing indifferents as good/evil is wrong.
      *   (3) Clinical reality: Depression/anxiety have non-cognitive, endogenous causes (not just judgments).
      *   (4) Stoic classification: Therefore, symptoms are indifferents.
      *   (5) The Trap: Seeking to eliminate depression = treating an indifferent as an evil.
