prompt: |-
  Construct a thought experiment—designed to test whether Machiavelli's virtù is essentially an adaptive, reactive capacity or an aggressive, world-transforming force—set in a realistic institutional context such as a regional administration confronting an abrupt crisis caused by an unpredictable external shock (fortune). The case must be one paragraph, contain no fantasy elements or trolley-style abstractions, and must be engineered with a specific structural feature—e.g., the shock simultaneously cripples an adversary and depletes the leader's own strategic reserves—so that the adaptive interpretation of virtù (virtù as reading and riding the contours of fortune through consolidation and alliance) prescribes cautious restructuring, while the domineering interpretation (virtù as imposing will regardless of contingency) prescribes an immediate, high-risk seizure of the adversary's position. Present the scenario, then demonstrate that it meets the specification: state each interpretation's verdict and reasoning, isolate the precise feature that forces the divergence, explain what happens if that feature is removed (whether the interpretations collapse into agreement or remain distinct for other reasons), and show how a defender of the domineering reading would attack the case—specifically, whether they can claim the scenario unfairly makes aggression appear self-destructive rather than genuinely virtuous, and whether that charge succeeds. Do not stipulate the verdicts; they must fall out of the two interpretations applied to the scenario.
