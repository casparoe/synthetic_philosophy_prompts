answer: |-
  **Address for the Kettle Spring Dace**

  We are gathered for a death that occurred in September, in a tank at this hatchery. The fish was female. She died without a mate listed. Her body is now in fixative, and she will travel four hundred miles to rest in the same collection as the holotype described in 1954. We are here to mark the end of a line that was kept open, against the odds, by the people in this room.

  When that holotype was described, it was given a full name. It was called a species. In 1998, I published a revision that removed that name. I argued then that this fish was a local form of a widespread relative, shaped by the cold water of this spring. I argued that the genetic differences were not deep enough to hold the weight of a separate existence. Based on that work, the protections were lifted. I did not pump the water down. I did not build the diversion that brought the relatives into this creek. But I did remove the shield that might have slowed those changes. I have lived with that decision for twenty-five years. I believed the evidence then. I believe the evidence now requires us to call this fish by its old name again, even as we acknowledge that the creek it belonged to is gone.

  For the last twenty-two years, the technicians in this shed kept a paper chart on the wall. They tracked the generations. They managed the breeding when the wild population faded. To some, that chart was data. To them, it was a vigil. They kept the lineage alive after the water district lowered the spring and after the hybrids began to outnumber the pure fish. There is a moment, roughly a decade ago, when the pure line became diagnosably distinct only in memory, yet the staff continued the work as if the boundary still held. They honored the possibility of continuity long after the biology had become uncertain. We owe them more than thanks; we owe them the admission that their labor mattered even if the category they were saving was, by some measures, already dissolving.

  Today, we face three truths that do not agree. To some, nothing has been lost, because the blood of this fish flows in the hybrids that still swim in the channel downstream. The water still holds life, and the reproductive barriers were never absolute. To others, the loss happened years ago, when the genetic signature became too faint to distinguish from the noise of the relatives. On that view, we are mourning a boundary that was crossed unnoticed, while the body remained. But there is a third view, the one that brings us into this room. It holds that a species is not just a category, but a single, scattered organism stretched across time. On that view, extinction is not the fading of a type, but the death of an individual. It has a date. It has a location. It happened in September, in Tank 4.

  I cannot tell you which of these truths is the right one. Science has not settled what a species is, only how we measure it. But I can tell you what is in the jar. It is not just a voucher. It is a witness. It testifies that something unique existed here, that it was distinct enough to be named, distinct enough to be protected, and distinct enough to be mourned. The water district commissioners have asked me to clarify that no species was lost. I can clarify that the water still flows, and the relatives flourish. But I cannot say that nothing ended. The specific combination of history and water that made this fish possible has closed.

  We have frozen gametes. We have sixty fish in the shed of uncertain parentage. We have the "dacey things" in the side channel. These are not nothing. They are the aftermath. But the thread that ran from 1954 to September is cut. My daughter is here, and she will see that we mark ends as carefully as we mark beginnings. The two scientists who re-split this taxon two years ago are here, and they know that the name returns on stronger data, even if the fish does not.

  We are not here to resolve the definition of a kind. We are here to acknowledge the silence in the tank. The name returns to the books. The fish does not return to the spring. We commit this voucher to the museum, not as a definition, but as a record of a life that was held, for as long as it could be, in human hands.

  ***

  **Note on Key Sentences**

  1.  *"It happened in September, in Tank 4."*
      *   **Licenses:** Species-as-Individuals (Account 3). Only this account treats extinction as a singular death event with a specific timestamp.
      *   **Forbids:** Reproductive Isolation (Account 1) and Diagnosable Lineage (Account 2). Account 1 sees only population flux; Account 2 sees the end occurring a decade prior.
      *   **Reporter:** Likely headline material ("Extinction Date Confirmed"). It creates a concrete news hook.
      *   **Lumper Privilege:** No. Any observer could state the date of death.

  2.  *"I did not pump the water down... But I did remove the shield."*
      *   **Licenses:** All accounts, but carries unique moral weight for the Speaker.
      *   **Forbids:** None, but only the Speaker can admit the causal link between the 1998 paper and the loss of protection without sounding defensive.
      *   **Reporter:** Will likely quote this to assign blame or nuance the water district's role.
      *   **Lumper Privilege:** **Yes.** Only the author of the 1998 revision can claim responsibility for removing the legal shield. This preempts the commissioners' desire to claim "no loss" by admitting the *protection* was lost even if the *species* status is debated.

  3.  *"They honored the possibility of continuity long after the biology had become uncertain."*
      *   **Licenses:** Diagnosable Lineage (Account 2) and Species-as-Individuals (Account 3). Acknowledges the "uncertain" biology while validating the technicians' effort.
      *   **Forbids:** Strict Reproductive Isolation (Account 1). If hybrids are fertile, the biology wasn't "uncertain," just mixed.
      *   **Reporter:** Frames the technicians as heroes rather than failed bureaucrats.
      *   **Lumper Privilege:** No, but requires the authority to declare the biology "uncertain."

  4.  *"I cannot say that nothing ended."*
      *   **Licenses:** Species-as-Individuals (Account 3) and Diagnosable Lineage (Account 2). Both acknowledge a termination of *something* unique.
      *   **Forbids:** Reproductive Isolation (Account 1). This account suggests only a population shift, not an ending.
      *   **Reporter:** Directly contradicts the Commissioners' desired talking point without using the word "species."
      *   **Lumper Privilege:** **Yes.** As the lumper, he removed the category. For him to insist "something ended" anyway validates the technicians' grief over the Commissioners' relief.

  5.  *"The name returns to the books. The fish does not return to the spring."*
      *   **Licenses:** All three accounts (taxonomically), but metaphysically separates the *concept* from the *entity*.
      *   **Forbids:** None.
      *   **Reporter:** Perfect soundbite. Distinguishes bureaucratic victory from ecological loss.
      *   **Lumper Privilege:** **Yes.** It acknowledges the re-split (validating the systematists) while cementing the reality of the extinction (validating the technicians), a balance only the original lumper can strike without appearing vindictive or foolish.
