  I'm presenting at a transitional justice seminar the claim that refusing to rank historical atrocities—specifically comparing the Holodomor, the Rwandan genocide, and the Belgian Congo Free State—via a "counterfactual suffering gradient" (preventable mortality weighted by institutional responsiveness) is not moral sensitivity but epistemic cowardice that paralyzes reparative allocation. The room is mostly postcolonial historians who treat comparative genocide studies as epistemic violence, human rights lawyers defending an "incomparability thesis" on victim-dignity grounds, and one analytic philosopher convinced I'm conflating intentional genocide with structural famine. Draft my Q&A prep sheet: the objections they'll actually raise, ordered by damage potential, each phrased in their vocabulary, with a two-minute reply that doesn't surrender the framework, a note on where that reply is soft, and what I should concede upfront to preserve credibility. Include the objection I'm hoping nobody asks—namely that my gradient implicitly privileges Western bureaucratic record-keeping over oral-historical victim testimony, which collapses the metric from within—plus how to handle it if it comes. Keep it practical for a hostile room.
