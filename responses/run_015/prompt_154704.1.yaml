answer: |-
  The fight is mostly verbal over the definition of "Darwinian," but your reconstruction picture does more empirical work on content stability while Mara's lineage picture does more work on historical tracking, and neither model supports the claim that widespread ideas are probably false.

  | Darwinian Condition | Mara's Account (Replicator) | Your Account (Reconstructor) | Verdict on Your Case |
  | :--- | :--- | :--- | :--- |
  | **Variation** | Ideas mutate during copying (noise/error). | Ideas transform during rebuilding (bias/distortion). | **Meets.** Both agree variants exist; you disagree on the source (random error vs. systematic bias). |
  | **Heritable Transmission** | Fidelity is high enough to trace lineage (parent → child). | Fidelity is low; stability comes from converging on cognitive attractors. | **Fails Strictly / Meets Loosely.** If stability is purely convergent, lineage breaks. If "self-correcting" means correcting toward the *parent*, it's heredity; if toward an *archetype*, it's not. Loose meeting is enough for "Generalized Darwinism," but not for lineage tracing. |
  | **Differential Fitness** | Variants spread because they out-compete others in a lineage. | Variants spread because they fit cognitive constraints better than alternatives. | **Meets Loosely.** "Fitness" becomes "attractor strength." Selection acts on the idea type, not necessarily the specific token lineage. |

  **Reasoning on the Darwinian Conditions**
  Your "self-correcting" case fails the strict heredity condition only if the correction targets a cognitive universal rather than the specific parent idea. If I garble a story and you fix it to match *what I told you*, that is high-fidelity transmission (Mara wins). If I garble a story and you fix it to match *what a story like that should be*, regardless of my specific details, that is convergence (You win). Generalized Darwinism (Dennett, Hull) allows for loose heredity, so meeting the condition loosely is enough to call it "Darwinian" in a broad sense, but it undermines the specific claim that we are tracking a specific lineage's survival. Mara is right that biology is messy, but biological messiness still retains a phylogenetic signal; your claim is that cultural transmission often loses that signal entirely in favor of typological clustering.

  **The Empirical Test**
  To decide this without library research, run a **branching telephone-chain experiment with independent seeds**.
  1.  Start two separate chains with slightly different versions of the same story (Version A and Version B).
  2.  Let them transmit through five generations of participants.
  3.  **Mara predicts:** The final outputs will cluster by lineage (A-descendants look like A, B-descendants look like B).
  4.  **You predict:** The final outputs will converge to a single archetype regardless of starting version (A-descendants look like B-descendants).
  If the variants cluster by genealogy, lineage matters (Mara). If they cluster by theme regardless of genealogy, cognitive attractors dominate (You). Historical records offer the same test: do textual variants map onto a family tree (stemmatics), or do they constantly revert to a standard form across unrelated lineages?

  **The Stability Distinction**
  Your distinction between "stability that needs a lineage" (persistence) and "stability that doesn't" (recurrence) is real and not just verbal restatement. It marks the difference between *inertia* (keeping a specific token alive) and *attraction* (returning to a specific state). In biology, convergent evolution (sharks and dolphins looking similar) is distinct from homologous evolution (humans and chimps sharing a hand structure). You are arguing culture is mostly convergent; Mara is arguing it is mostly homologous. This is an empirical difference in mechanism, not just semantics.

  **The Snark**
  Neither picture licenses your claim that "widespread therefore probably false."
  *   **Mara's view:** Success correlates with spreadability, not truth. This means truth and spread are uncorrelated, not negatively correlated. A true idea can be fit for spreading; a false idea can be fit for spreading.
  *   **Your view:** Success correlates with cognitive ease. True ideas can be easy to picture; false ideas can be easy to picture.
  To support your snark, you would need a theory where falsehoods are *inherently* more fit or easier to reconstruct than truths, which neither model provides.
