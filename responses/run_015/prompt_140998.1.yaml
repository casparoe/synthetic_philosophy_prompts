answer: |-
  ### 1. Requirements for an Adequate View

  To move from intuition-pumping to structural evaluation, a view must satisfy the following requirements. Each is tied to a specific failure mode in the real-world context you described (fallible agents, uneven support, existing legal frameworks).

  **A. Discrimination Capacity (Safety)**
  *   **The Requirement:** The view must provide criteria that allow a fallible decision-maker to distinguish, with high reliability, between a death that is genuinely chosen and a death that is coerced, neglected, or mistaken.
  *   **Motivating Case:** *The Isolated Patient.* A poor, isolated elder depends on relatives for care. Those relatives hint that inheritance is running low. The elder requests death. A view fails if it cannot offer a procedural or substantive test to detect whether this is autonomy or quiet coercion.
  *   **Why it belongs:** In non-ideal conditions, vulnerability is unevenly distributed. A legal rule that works only when families are loving and finances are secure is not a law; it is a hope.

  **B. Consistency with Existing Rights (Coherence)**
  *   **The Requirement:** The view must explain why the permitted act (assisted dying) is legally and morally distinct from acts already permitted (refusing treatment, withdrawing life support, terminal sedation), or it must argue for expanding those permissions to match. It cannot rely solely on the "acts vs. omissions" distinction if that distinction collapses under scrutiny.
  *   **Motivating Case:** *The Cases We Already Permit.* A patient starves to death after refusing a feeding tube (permitted) vs. a patient takes a pill to die (forbidden). If the outcome and intent are identical, the view must identify a relevant difference other than who moved their hand last.
  *   **Why it belongs:** Legal systems require coherence. If a view justifies banning assisted dying but cannot explain why refusing food is allowed, it creates arbitrary law, which undermines respect for the legal system.

  **C. Resilience to Structural Pressure (Justice)**
  *   **The Requirement:** The view must account for the possibility that a "choice" is shaped by unjust social conditions (lack of housing, care funding, stigma) without automatically invalidating the choice or automatically validating it.
  *   **Motivating Case:** *The Socially Caused Request.* The young disabled person whose suffering is produced by underfunding. A view fails if it says "It's her choice, end of story" (ignoring the coercion of poverty) OR if it says "This isn't a real choice" (paternalistically denying her agency). It must navigate the middle.
  *   **Why it belongs:** In a society with uneven support, suffering is often political. A view that treats all suffering as purely medical or biological ignores the context in which the law operates.

  **D. Epistemic Tractability (Administrability)**
  *   **The Requirement:** The criteria for eligibility must be verifiable by overworked doctors under uncertainty. If the rule requires knowing the "true" motive or predicting future regret with precision, it fails.
  *   **Motivating Case:** *The Administrability Case.* "Unbearable suffering" is subjective. A doctor has 20 minutes and no mind-reading tools. A view fails if it demands a level of certainty about internal states that medicine cannot provide.
  *   **Why it belongs:** A law that cannot be applied consistently creates a lottery of access and safety.

  **E. Temporal Coherence (Identity)**
  *   **The Requirement:** The view must specify whose judgment counts when preferences change over time. It must decide whether the "past self" (advance directive) or "present self" (current experience) holds authority.
  *   **Motivating Case:** *The Scope Case (Dementia) & The Deadline Case.* The dementia patient who requested death years ago but now seems content. The suffering patient who would regret death in two years.
  *   **Why it belongs:** Competence is not a one-time event. A view must handle the erosion of competence or the volatility of preference.

  ---

  ### 2. Status of Requirements

  *   **Discrimination Capacity:** **Non-negotiable.** A legal regime that cannot distinguish murder from mercy in practice is catastrophic.
  *   **Consistency with Existing Rights:** **Non-negotiable.** (For a legal theory). While moral truth might be jagged, law strives for coherence. If you cannot explain the difference from treatment refusal, you are arguing for a revolution in tort law, not just assisted dying.
  *   **Resilience to Structural Pressure:** **Non-negotiable** (Given your constraints). In ideal theory, this might be less critical. In a society with uneven support, ignoring structural coercion makes the law an instrument of inequality.
  *   **Epistemic Tractability:** **Non-negotiable.** "Ought implies can." If doctors cannot verify the criteria, the rule is void.
  *   **Temporal Coherence:** **Negotiable.** This is a legitimate scope choice. A jurisdiction can decide to limit assisted dying to those with current competence, excluding advance directives for dementia. It is a boundary decision, not a fatal flaw to exclude it.
  *   **Expressive Impact:** **Prejudice/Preference.** This is often a demand dressed up as a standard. One side claims legalizing AD expresses "disrespect for life"; the other claims banning it expresses "state ownership of bodies." Both are speculative sociological claims used to win the argument by fiat. Unless a view can prove concrete harm from the *message* (distinct from the *act*), this is a rhetorical move, not a structural requirement.

  ---

  ### 3. Conflicts and Trade-offs

  **The Conflict: Resilience to Structural Pressure vs. Consistency with Existing Rights.**
  *   **The Argument:** To be consistent with treatment refusal (Requirement B), you must respect the competent refusal of care even if that refusal is influenced by depression or social burden. We allow a Jehovah's Witness to refuse blood even if we think they are mistaken; we allow a depressed person to refuse dialysis. But if you apply that same standard to assisted dying (Requirement C), you risk allowing deaths driven by social neglect.
  *   **The Tension:** If you tighten the rules to protect the socially vulnerable (Requirement C), you treat assisted dying differently than treatment refusal, violating Consistency (Requirement B). If you treat them the same (Requirement B), you expose the vulnerable to structural coercion (Requirement C).
  *   **The Unsatisfiable Whole:** If you insist on perfect Consistency, perfect Safety, and perfect Justice in non-ideal conditions, the system freezes.
  *   **What to Drop:** I would drop strict **Consistency with Existing Rights**.
  *   **The Cost:** You admit that the law is creating a *new* category of permission that is more dangerous than refusing treatment, and therefore requires stricter safeguards (like waiting periods, witness requirements) that do not apply to treatment refusal. This creates a legal asymmetry, but it is the price of safety in a non-ideal world.

  **The Conflict: Epistemic Tractability vs. Discrimination Capacity.**
  *   **The Argument:** To ensure safety (Discrimination), you want deep psychological evaluations to detect coercion. To ensure access (Tractability), you need simple criteria doctors can use quickly.
  *   **Resolution:** This is a balance of burden of proof. In this context, the burden must fall on **Safety**. It is worse to kill a non-consenting person than to deny a consenting one.

  ---

  ### 4. The Single Most Exclusionary Requirement

  **Epistemic Tractability.**

  This requirement does the most work in ruling out popular positions.
  *   It rules out **pure Autonomy views** that say "If they ask, it must be granted," because doctors cannot verify if the "ask" is free from subtle family pressure or untreated depression in a 15-minute consult.
  *   It rules out **pure Sanctity views** that rely on "intrinsic value" without actionable criteria, because they offer no test for when exceptions (like self-defense or refusing treatment) apply, leading to arbitrary enforcement.
  *   It rules out **pure Suffering views**, because "suffering" is unmeasurable. Without objective markers, the rule becomes "the doctor feels like it," which is not law.

  Any view that cannot translate its moral principle into a checklist a tired general practitioner can use without high error rates is theoretically interesting but legally dead.

  ---

  ### 5. Scorecard of Popular Positions

  *   **Sanctity of Life:** **Fails Consistency.** It cannot adequately explain why refusing life-saving treatment is permissible while assisted dying is not, without relying on the physically arbitrary acts/omissions distinction.
  *   **Pure Autonomy:** **Fails Structural Pressure.** It treats the request as an island, ignoring the "uneven social support" context. It has no mechanism to detect when autonomy is compromised by poverty or isolation.
  *   **Relief of Suffering:** **Fails Discrimination.** If suffering is the sole trigger, it cannot logically exclude non-voluntary euthanasia for those who cannot ask (infants, advanced dementia), unless it arbitrarily adds a consent requirement that contradicts the core principle.
  *   **Integrity of Medicine:** **Fails Epistemic Tractability.** "Medical integrity" is vague. If it means "do no harm," it contradicts palliative sedation. If it means "follow professional norms," it offers no guide for what those norms *should* be in law, only what they currently *are*.
