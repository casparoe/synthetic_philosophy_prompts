      *   *Refining the Argument on (1) Logic:* Intuitionism is the big threat. But HA (Heyting Arithmetic) is compatible with PA on concrete sentences. The "Attractor" might be "Classical Arithmetic" specifically. If the user admits the attractor is *human/pragmatic* (based on how we build syntax), it weakens the Platonist claim but saves the view.

