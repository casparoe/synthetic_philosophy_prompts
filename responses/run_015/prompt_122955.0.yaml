      *   **Specific Questions:** Evaluate four specific lines of objection (Logic dependence, Applicability of Analysis, Rival Arithmetic, Empirical Impact of Set Theory). Rank defeaters from fatal to awkward. Flag which to concede vs. shrug off.
      *   **Constraint:** No reading lists. Be honest about insulation/tautology risks. Address the specific worry about (2) and (4) (Applicability vs. Optionality).

  2.  **Deconstruct the "Attractor View":**
