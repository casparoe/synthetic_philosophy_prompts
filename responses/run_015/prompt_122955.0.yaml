          *   *Verdict:* This is the strongest pressure point. If the "optional" math is what actually models the world, the "forced" math looks like a toy.
          *   *Ranking:* Fatal if not handled carefully. Needs a distinction between *structure* (forced) and *ontology* (optional).

      *   **(3) Rival Arithmetic:** A physically successful theory with modular arithmetic (finite universe) instead of standard PA.
          *   *Analysis:* If physics turned out to be discrete at the Planck scale, does $2+3=5$ fail? No, it just means the *domain of application* is finite. The arithmetic truth remains valid as a structural claim, even if not instantiated physically.
          *   *Verdict:* The user can slither out of this. Arithmetic doesn't claim to describe physical tokens, but the structure of counting.
          *   *Ranking:* Merely Awkward. Can be shrugged off.

      *   **(4) Empirical Impact of Set Theory:** If CH (Continuum Hypothesis) changed a physical prediction.
          *   *Analysis:* This is extremely unlikely (Feferman et al. argue physics uses only "predicative" math). But *if* it happened, it would undermine the "optional" status. It would make set theory empirical.
          *   *Verdict:* If CH affected a measurement, the "optional" line moves up. It doesn't destroy the view, just shifts the boundary.
