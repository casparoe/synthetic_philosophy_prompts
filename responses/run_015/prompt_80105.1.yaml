  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Topic:** Quine's indeterminacy of translation (specifically the 'gavagai' example).
      *   **Core Issue:** The user distinguishes between *underdetermination* (epistemic: evidence fits multiple theories) and *indeterminacy* (ontological/metaphysical: no fact of the matter). They want to know *why* Quine moves from the former to the latter.
      *   **Specific Question:** What must be true about the nature of meaning for this leap to work? Is it defensible?
      *   **Crucial Question:** Why doesn't Quine appeal to the native's mental states as the "fact of the matter"?
      *   **Constraint:** Answer in British English.

  2.  **Deconstruct Quine's Argument:**
      *   *Behaviourism:* Quine is a methodological behaviourist. He believes meaning must be grounded in publicly observable behaviour. Private mental states are not accessible and, for Quine, not scientifically respectable as grounds for meaning.
      *   *Holism:* Sentences don't have meaning in isolation; they are part of a web of belief.
      *   *The Leap:* If meaning is exhausted by behavioural dispositions (stimulus meaning), and behavioural dispositions underdetermine the translation manual, then there is nothing *left* to determine the meaning. Therefore, there is no fact of the matter.
      *   *Mental States:* Quine rejects the idea that mental states (propositional attitudes, specific concepts) are determinate entities that exist independently of behaviour. To appeal to them is to appeal to a "myth of the museum."

  3.  **Address the "Epistemic to Metaphysical" Leap:**
      *   The user is right to spot this gap. It's the crux of the criticism.
      *   For Quine, meaning *just is* behavioural disposition. It's not that behaviour is the *evidence* for meaning; behaviour *constitutes* meaning.
      *   Analogy: If "mass" in physics is defined by measurement procedures, and measurements underdetermine the value, then there is no "true mass" beyond the measurements. (Though this analogy is imperfect, it captures the operationalist/behaviourist vibe).
      *   So, the premise required is: **Meaning is not an inner entity; it is a pattern of stimulus-response dispositions.**

  4.  **Address the "Mental States" Objection:**
      *   Why not appeal to what the native is thinking?
      *   Quine's view: Mental states are not "ghostly intermediaries." If two translation manuals account for all behaviour equally well, positing a mental state to distinguish them is adding an unnecessary entity (violating parsimony) and, more importantly, assuming a determinate structure of the mind that isn't warranted by the physical facts.
      *   Quine is a physicalist. If the physical facts (behaviour, neural states) don't fix the meaning, then nothing does. He later conceded neural states *might* fix it, but argued that even then, the *translation* between languages remains indeterminate because the neural states themselves are subject to the same holism.
      *   Key concept: "The Myth of the Museum." Meaning isn't a label attached to a mental object.

  5.  **Evaluate Defensibility:**
