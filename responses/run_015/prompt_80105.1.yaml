answer: |-
  You have put your finger precisely on the nerve of the matter. Your distinction between underdetermination (an epistemic limitation regarding evidence) and indeterminacy (an ontological claim regarding reality) is the standard and correct way to frame the criticism of Quine. Most introductory summaries do indeed gloss over this, presenting the 'gavagai' example as a whimsical puzzle about rabbits rather than a radical attack on the very existence of meaning as a determinate entity.

  To answer your question: why does Quine believe the first claim (evidence underdetermines translation) entails the second (there is no fact of the matter)? And why does he refuse to appeal to the native's mental states to settle the issue?

  ### The Behaviourist Premise: Meaning as Disposition

  For the leap from epistemic underdetermination to ontological indeterminacy to work, a specific premise about the nature of meaning must be accepted. Quine holds that meaning is not a private, inner object to which public behaviour merely points. Rather, meaning is *constituted* by publicly observable behavioural dispositions.

  In *Word and Object*, Quine operates as a methodological behaviourist. He argues that if we are to treat linguistics as a science, we must restrict ourselves to intersubjectively available data. If two translation manuals account for all possible behavioural stimuli and responses equally well, there is no scientific ground to prefer one over the other.

  Here lies the crux of the leap: Quine is not saying, 'We cannot *know* which manual is right.' He is saying, 'There is nothing *else* to be right about.' If meaning were an inner entity distinct from behaviour, then underdetermination would merely be an epistemic problem. But for Quine, meaning *just is* the pattern of stimulus and response. Therefore, if the behaviour underdetermines the translation, the meaning itself is indeterminate. To posit a 'fact of the matter' beyond the behavioural evidence is, for Quine, to engage in metaphysical excess.

  ### The Rejection of Mental States

  This brings us to your most pressing question: why can Quine not simply appeal to the native's mental states? If the native is thinking 'rabbit' rather than 'undetached rabbit part', surely that is the fact that settles the dispute?

  Quine rejects this move for two interconnected reasons, one semantic and one metaphysical.

  **1. The Myth of the Museum**
  Quine famously attacks what he calls the 'myth of the museum'. This is the view that words are labels attached to pre-existing mental ideas or meanings. If this were true, the translator's job would be to peek into the native's museum and see which exhibit the word 'gavagai' is hanging next to. Quine argues this is incoherent. We have no access to these 'exhibits' other than through the very behavioural dispositions that are already underdetermined. To appeal to mental states is to pretend we have access to a realm of meaning that is independent of public verification, which Quine views as unscientific mysticism.

  **2. Physicalism and 'No Entity Without Identity'**
  Quine is a physicalist. He believes that all facts are ultimately physical facts. If there is a fact of the matter about what the native means, it must be grounded in physical reality (behaviour or neural states). In *Word and Object*, he argues that even neural states might not save us, because the holistic nature of language means that a specific neural firing could be compatible with multiple conceptual schemes depending on how the rest of the web of belief is adjusted.

  Furthermore, Quine adheres to a principle often summarised as 'no entity without identity'. For something to exist as a determinate entity, there must be clear conditions under which we can say it is identical to itself and distinct from other things. Because translation is indeterminate, we cannot set out clear identity conditions for 'meanings' or 'propositions'. If we cannot count them or distinguish them rigorously, Quine argues we should not admit them into our ontology. To appeal to the native's mental state as a determinate fact is to assume the mind possesses a structure of 'propositional attitudes' that Quine believes is not warranted by the physical facts.

  ### Is it an Overreach?

  You ask whether this is defensible or an overreach from the epistemic to the metaphysical. The consensus amongst many contemporary philosophers is that it is indeed an overreach, largely because Quine's behaviourist premises are no longer widely accepted.

  **The Chomskyan Critique**
  Noam Chomsky provided the most famous rebuttal. He distinguishes between *performance* (observable behaviour) and *competence* (the internalised grammatical knowledge). Chomsky argues that Quine conflates the two. The fact that behavioural evidence underdetermines the grammar does not mean the grammar itself is indeterminate. The native possesses a specific, biologically realised internal language structure. That structure is the 'fact of the matter', even if a field linguist cannot deduce it with certainty from the outside. For Chomsky, Quine's indeterminacy is merely a problem for the translator, not a problem for the existence of meaning.

  **The Realist Critique**
  Others, such as John Searle, argue that mental states have intrinsic intentionality. A thought about a rabbit is distinct from a thought about a rabbit-stage in virtue of what it is like to have that thought (its phenomenology) and its causal role in the brain. To deny this because it isn't publicly observable is to adopt an excessively verificationist view of truth.

  **In Quine's Defence**
  However, Quine's position is defensible if one accepts his naturalistic constraints. If one agrees that philosophy should not outrun science, and that science deals only with what is observable and testable, then positing 'hidden' mental facts that make no difference to prediction is indeed metaphysical baggage. Quine is essentially asking: if the difference between 'rabbit' and 'rabbit-stage' makes no difference to how the native acts, speaks, or reacts to stimuli, in what sense is it a real difference?

  ### Conclusion

  To summarise, Quine moves from underdetermination to indeterminacy because he identifies meaning with behavioural dispositions. He refuses to appeal to mental states because he views them as either inaccessible myths (the museum) or as physical states that are themselves subject to the same holism and indeterminacy.

  Whether this is a profound insight or a category error depends on whether one accepts his behaviourist reduction of meaning. If you believe meaning is an internal, cognitive state (as most cognitive scientists do today), then Quine's leap is an overreach: the evidence underdetermines our *knowledge* of the mind, but it does not render the *contents* of the mind indeterminate. But if you accept Quine's view that meaning is essentially a social, public phenomenon, then his conclusion follows with grim logic.

  It is a stark choice: either we accept that meaning is richer than behaviour, or we accept that meaning is less determinate than we thought. Quine forces us to pick a side, even if his own preference for the latter strikes many as rather too austere.
