      *   Chomsky: Distinguishes competence (internal grammar) from performance (behaviour). Quine ignores competence.
      *   Searle: Chinese Room argument (sort of related) – syntax isn't semantics, but mental states have intrinsic intentionality.
      *   Defenders: Quine is naturalising epistemology. We shouldn't posit facts that play no causal role in observation.

