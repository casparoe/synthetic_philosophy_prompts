prompt: |-
  I work at a small climate-policy institute in Berlin, and I have been asked to draft a short briefing note on a question that keeps slipping out of the register my colleagues normally work in. Two neighbouring countries, inside the same coupled electricity market, bound by the same climate commitments and with comparable engineering capacity, have adopted opposite nuclear policies: Germany closed its last three reactors in April 2023 and is dismantling them, having replaced part of the lost output with gas-fired generation and with imports from its neighbours, while France still derives roughly two-thirds of its electricity from a fleet of about fifty-six reactors, is planning new builds, and has, as I understand the practice, permitted operating lives well beyond the original forty-year design assumption subject to periodic safety re-assessment. Everyone I ask for an explanation gives me either a political story — the strength of the German anti-nuclear movement since the 1970s, the origins of the French programme in the mid-1970s oil shock and the fact that it was launched without parliamentary debate — or a technical one about grids, geology and construction costs. I do not think those stories are wrong, but I want something different: treated as practices rather than as outcomes, what does each policy presuppose about risk, about the state, and about what is owed to people who do not yet exist?

  Three features of the pair strike me as philosophically loaded, and I would like the implicit theory behind them reconstructed rather than the policies judged. First, the exit does not free Germany of a custodial obligation, it converts an operating fleet into a sealed one: both countries intend to isolate long-lived waste in a deep geological repository whose safety is argued over timescales of hundreds of thousands of years, which is longer than any state has so far lasted. So when the phase-out is defended as refusing to impose a burden on later generations, what exactly is being claimed — a constraint on adding to a stock, a claim about expected harm, or something expressive, about the kind of polity a nation is willing to be? Second, the same jurisdictions apply a near-absolute, demonstrate-that-it-is-safe standard to radioactivity while approaching climate risk through carbon budgets and a social cost of carbon, that is, through an explicit trade-off that licenses some non-zero quantity of harm. What has to be true about the difference between the two hazards for that to be coherent rather than convenient — their shape, their reversibility, the number and identifiability of the people who bear them, our confidence in the probabilities, or the fact that one harm is imposed by our act alone and the other only together with everyone else's? Third, the two technologies make different demands on whoever comes after us: a fleet requires a competent regulator and operator to persist for as long as it runs, whereas a sealed repository is, in principle, designed so that safety does not depend on anyone reading the archives, and a retrievable repository — which I gather is what French law asks for rather than permanent sealing — seems to presuppose something different again, that later generations should be left the option of revising our judgement and possibly wanting the material back.

  So here is what I need. Reconstruct the theory that each practice requires, and be explicit about which parts are strictly presupposed and which merely fit comfortably: where is the practice underdetermined, so that several quite different theories would license the same policy, and where is it in tension with itself? Say whether a single underlying theory could generate both policies given different baselines — different grids, different publics, different inherited capital — or whether Berlin and Paris really are committed to incompatible views of risk. A colleague of mine suggests that the live axis is not how much risk a technology carries but what sort of afterlife it has, meaning what it demands of successor institutions: active custodianship for a century, passive safety with a warning that must stay legible for ten thousand years, or an open option that leaves the future our material to do as it likes with. I would like that suggestion tested rather than applauded — is it doing genuine work, or is it a redescription of the risk numbers? Finally, tell me what would have to change in each practice if the presupposition were swapped: if a country's energy mix is treated as partly constitutive of what it stands for rather than as a mere input to an electricity system, what follows for a Germany that buys nuclear power across the border in winter, and for a France that sells reactor technology to states with no comparable regulator; and if instead one adopted a flat expected-harm view with discounting, would the German closure simply become a moral error, and what else would that commit you to? Please do not give me a policy recommendation, and do not send me to a literature: I want the implicit theory and the places where it is thin.
reasoning: |-
  Here's a thinking process that leads to the briefing note:

  1.  **Analyze the Request:**
      *   **Context:** Small climate-policy institute in Berlin.
      *   **Task:** Draft a short briefing note.
      *   **Topic:** Comparative analysis of German nuclear phase-out vs. French nuclear continuation, focusing on *implicit theories* (risk, state, intergenerational obligation) rather than political/technical explanations.
      *   **Key Constraints:** No policy recommendations, no literature review/citations. Focus on reconstructing the theory behind the practices.
      *   **Specific Questions to Address:**
          1.  Waste/Custody: What does "no burden on future generations" mean when waste still exists? (Constraint on stock vs. expressive claim).
          2.  Risk Standards: Why absolute safety for radiation vs. trade-off for carbon? (Hazard shape, reversibility, identifiability, agency).
          3.  Institutional Demands: Active custodianship (fleet) vs. passive safety (repository) vs. retrievability (French law).
          4.  Colleague's Suggestion: Test the "afterlife/institutional demand" axis. Is it substantive or just redescription?
          5.  Counterfactuals/Swaps: What if Germany treats energy mix as constitutive (importing nuclear)? What if France sells to weak regulators? What if Germany adopted a flat expected-harm view (moral error)?
          6.  Compatibility: Can one theory generate both policies given different baselines, or are they incompatible views of risk?

  2.  **Deconstruct the Core Tension:**
      *   **Germany:** Precautionary principle (*Vorsorgeprinzip*), expressive politics, "never again" (Chernobyl/Fukushima resonance), waste as moral poison, state as guarantor of exit.
      *   **France:** Technocratic optimism, state as provider of continuity, waste as manageable industrial byproduct, energy sovereignty, intergenerational equity as *provision* of power rather than just *protection* from harm.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard briefing note format (To, From, Date, Subject).
      *   **Introduction:** Acknowledge the prompt's premise. State the goal: excavating the implicit normative theories.

      *   **Section 1: The Ontology of Waste (Custody vs. Cessation):**
          *   *German Theory:* Waste is a moral debt. Stopping production stops *incurring* debt, even if the principal remains. It's an expressive act of limiting the *scope* of responsibility. The state's role is to seal the past.
          *   *French Theory:* Waste is an industrial inventory. Responsibility is continuous management. The state's role is to maintain competence to manage the inventory.
          *   *Tension:* Germany claims to relieve future generations but locks them into monitoring a sealed site. France admits the burden but offers the resource (energy) as compensation.
          *   *Underdetermination:* Both need repositories. The difference is the *narrative* of the waste (poison vs. asset/liability mix).

      *   **Section 2: The Epistemology of Risk (Absolute vs. Probabilistic):**
          *   *German Theory:* Radiological risk is *categorical*. It violates bodily integrity in a way that is non-negotiable. It is "dread risk" (uncontrollable, involuntary). Carbon risk is *aggregative* and *probabilistic*.
          *   *French Theory:* Risk is *commensurable*. All energy has risk. Nuclear risk is low-probability/high-consequence but manageable. Carbon risk is high-probability/certain-consequence.
          *   *Coherence Check:* For Germany to be coherent, radiation must be qualitatively different (deontological constraint) vs. carbon (utilitarian calculus). For France, both are utilitarian inputs.
          *   *Agency:* Radiation = direct act (we make the waste). Carbon = collective action problem (we contribute to the budget).

      *   **Section 3: The Temporal Contract (Institutional Afterlife):**
          *   *Colleague's Hypothesis:* "Afterlife" (institutional demand) is the key variable.
          *   *Testing:*
              *   Germany: Wants "Passive Safety." Ideally, the waste forgets us, and we forget it. But it requires an active state to seal it. *Contradiction:* Requires strong state to achieve "state-less" safety.
              *   France: Wants "Active Stewardship" (Retrievability). Assumes future institutions will be *more* competent or have different needs. Trusts the continuity of the technocratic state.
              *   *Verdict:* It's not just redescription. It reveals a view of *progress*. Germany fears institutional decay (so seal it). France expects institutional continuity (so keep it accessible).
          *   *Incompatibility:* Yes, fundamentally different views on the durability of political order.

      *   **Section 4: Counterfactuals and Swaps (Constitutive vs. Instrumental):**
          *   *Germany (Constitutive View):* If energy mix = identity, importing nuclear is hypocrisy (outsourcing the sin). It implies the moral boundary is territorial, not causal.
          *   *France (Export View):* Selling tech to weak regulators contradicts the "competent state" presupposition. It treats the reactor as a commodity, decoupling it from the institutional ecosystem required to run it safely.
          *   *Flat Expected-Harm Swap:* If Germany used pure expected-harm (discounting future lives), phase-out is a moral error (climate harm > nuclear risk). This commits Germany to accepting higher immediate mortality/morbidity from pollution/climate for the sake of a principle (purity) rather than outcome (safety).

      *   **Conclusion: Compatibility:**
          *   Can one theory explain both? Only a very thin "maximize welfare" theory where inputs differ wildly.
          *   Real answer: Incompatible views of the State's temporal reach. Germany: State should minimize its long-term footprint. France: State is the only vehicle for long-term continuity.

  4.  **Refining the Tone:**
      *   Must be analytical, detached, philosophical but grounded in policy practice.
      *   Avoid "Germany is wrong" or "France is right."
      *   Use the user's specific phrasing where possible ("slipping out of the register," "philosophically loaded," "redescription").
      *   Keep it concise (Briefing Note style).

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific question about the colleague's suggestion? *Yes, need to ensure I explicitly test if it's doing work or just redescribing.*
      *   *Check:* Did I avoid literature citations? *Yes.*
      *   *Check:* Did I address the "flat expected-harm" swap? *Yes.*
      *   *Check:* Is the distinction between "presupposed" and "fits comfortably" clear? *Need to make sure I highlight where the theory is underdetermined.*
      *   *Refinement:* Ensure the distinction between "sealed" (German ideal) and "retrievable" (French law) is clear in the institutional demand section.

  6.  **Final Polish:** Check for clarity, flow, and adherence to the "no recommendation" rule. (The prompt asks for implicit theory and where it is thin, not what they should do).

  *(Self-Correction on "Short Briefing Note"):* The prompt is dense. The response needs to be dense but structured. I will use headings to mirror the user's three features plus the specific tests requested.

  *(Final thought on the "Colleague's Suggestion"):* The colleague says it's about "what it demands of successor institutions." I need to argue that this *is* the core theoretical divergence, not just a description. Germany assumes institutional fragility (hence passive safety). France assumes institutional resilience (hence active stewardship). This is a deep political theory difference.

  *(Final thought on "Compatible Views"):* Are they incompatible? Yes, regarding the nature of political time. Germany wants to close the chapter. France wants to keep the book open.

  Let's write.
answer: |-
  **BRIEFING NOTE**

  **TO:** Senior Research Team
  **FROM:** [Your Name/Desk]
  **DATE:** 24 May 2024
  **SUBJECT:** Implicit Normative Theories in Divergent Nuclear Practices (DE/FR)

  **1. Purpose**
  This note reconstructs the implicit theoretical frameworks underpinning the German nuclear phase-out and the French nuclear continuation. It treats these policies not as technical or political outcomes, but as practices that presuppose specific ontologies of risk, theories of the State, and contracts with future generations. It tests the hypothesis that the critical divergence lies in the "institutional afterlife" demanded by each technology.

  **2. The Ontology of Waste: Cessation vs. Stewardship**
  Both jurisdictions accept the necessity of deep geological isolation for high-level waste. The divergence lies in the moral status of the *stock* versus the *flow*.

  *   **German Practice (The Cessation Theory):** The phase-out presupposes that moral liability is incurred primarily through *production*, not merely possession. By halting the flow, the State claims to have stopped imposing new burdens, even though the existing stock requires isolation for timescales exceeding the historical lifespan of states.
      *   *Presupposition:* The "burden on future generations" is defined as the *act of creation*, not the *fact of existence*.
      *   *Tension:* The practice requires a robust State to engineer a "passive" safety case (a sealed repository that needs no active memory). This contradicts the expressive claim of minimizing state footprint. It presupposes the State is competent enough to seal history permanently, trusting that the seal will hold even if the State fails.
      *   *Underdetermination:* This policy is compatible with both a deontological constraint (nuclear is inherently wrong) and a utilitarian calculation (nuclear risk > benefit). The practice alone does not distinguish between "we cannot do this" and "we choose not to do this."

  *   **French Practice (The Stewardship Theory):** Continued operation and retrievable storage presuppose that waste is an industrial inventory manageable through continuous competence.
      *   *Presupposition:* Future generations are owed *resources* (energy) and *options* (retrievability), not just a clean slate. The burden is justified by the asset.
      *   *Tension:* Retrievability (as per French law) explicitly rejects the "forgetting" model. It presupposes that future institutions will be *more* competent than ours, or at least equally so, and will value the material (perhaps for transmutation). This requires a theory of historical progress that Germany's practice implicitly rejects.

  **3. The Epistemology of Risk: Categorical vs. Commensurable**
  The regulatory regimes apply incommensurable standards: near-absolute safety for radiation vs. cost-benefit trade-offs for carbon.

  *   **German Practice:** Treats radiological risk as *categorical*. It is viewed as a violation of bodily integrity that is involuntary, uncontrollable, and distinct from "natural" hazards. Carbon risk is treated as *aggregative* and probabilistic.
      *   *Coherence Condition:* For this to be coherent (not merely convenient), radiation must be viewed as a *deontological constraint* (a right not to be exposed) whereas carbon is a *utilitarian harm* (a cost to be minimized).
      *   *Agency:* Radiation harm is traced to a specific operator/State act. Climate harm is diffuse. The German practice presupposes that direct agency carries higher moral weight than contributory agency.

  *   **French Practice:** Treats all energy risk as *commensurable*. Nuclear risk is low-probability/high-consequence; carbon risk is high-probability/certain-consequence.
      *   *Coherence Condition:* Requires a flat expected-harm metric where lives lost to pollution weigh the same as lives lost to accidents.
      *   *Tension:* If risk is commensurable, the refusal to build nuclear in Germany implies that the *fear* of nuclear risk outweighs the *reality* of carbon risk. The French practice assumes the State can correctly price these risks; the German practice assumes the State cannot be trusted to price the nuclear risk correctly.

  **4. Testing the "Institutional Afterlife" Hypothesis**
  Your colleague suggests the live axis is not risk magnitude but the *demand on successor institutions*. This hypothesis does genuine theoretical work and is not merely a redescription.

  *   **The Test:**
      *   **Germany (Passive Safety):** Demands a future that does *not* need to know us. The repository is designed to be safe without active custodianship. This presupposes a pessimistic view of institutional durability. It assumes the State may collapse, records may be lost, and language may change. Therefore, the technology must be "foolproof."
      *   **France (Active Stewardship):** Demands a future that *continues* us. Retrievability and fleet maintenance require a continuous chain of regulatory competence. This presupposes an optimistic view of institutional durability. It assumes the technocratic State is a permanent feature of the political landscape.
  *   **Verdict:** This explains the divergence better than risk numbers. Two countries could agree on the probability of a meltdown but disagree on whether their political institutions will last 100 years. Germany acts as if the State is temporary; France acts as if the State is perpetual.

  **5. Counterfactuals and Theoretical Swaps**

  *   **Swap A: Energy Mix as Constitutive Identity**
      *   *Germany:* If the energy mix is constitutive of the polity (i.e., "we are a non-nuclear nation"), importing nuclear power from neighbours in winter creates a moral boundary problem. It implies the moral prohibition is *territorial*, not *causal*. The theory collapses into sovereignty: "We will not soil our soil," rather than "This power shall not be generated."
      *   *France:* Selling reactor technology to states without comparable regulatory capacity contradicts the "competent state" presupposition. It treats the reactor as a commodity separable from the institutional ecosystem required to run it safely. This suggests the French theory is actually export-oriented realism, not domestic stewardship.

  *   **Swap B: Flat Expected-Harm with Discounting**
      *   *Germany:* If Germany adopted a flat expected-harm view (discounting future lives equally), the closure is a moral error. The expected harm from climate change (given the current grid mix) exceeds the expected harm from continued nuclear operation.
      *   *Commitment:* Adopting this view would commit Germany to accepting higher immediate mortality/morbidity from air pollution and climate impacts to satisfy a principle of "purity" (non-production of waste). It reveals the current policy is not about *safety* (outcomes) but about *integrity* (actions).

  **6. Compatibility of Underlying Theories**
  Can a single underlying theory generate both policies?

  *   **Thin Theory:** Yes, under a generic "Maximize Social Welfare" function where inputs (grid topology, public trust, capital stock) differ. If German public trust in nuclear governance is low, the risk premium makes nuclear net-negative. If French trust is high, it is net-positive.
  *   **Thick Theory:** No. The practices reveal incompatible views of *political time*.
      *   **Berlin:** The State's duty is to limit its long-term liability. The ideal future is one independent of our dangerous choices.
      *   **Paris:** The State's duty is to provide long-term continuity. The ideal future is one equipped with the tools we used.

  **7. Where the Theory is Thin**
  *   **Germany:** The theory cannot explain the timeline of the waste repository. If the goal is to impose no burden, why is the search for a site still ongoing decades after the phase-out decision? The practice of "sealing" requires active state management for a century before passivity is achieved. The theory claims exit; the practice requires deep entry.
  *   **France:** The theory cannot easily account for the economic volatility of the fleet. If the State is the guarantor of continuity, it absorbs all cost overruns (as seen with the EPR programme). This presupposes a State capacity to absorb infinite financial risk, which is theoretically distinct from absorbing technical risk.

  **8. Conclusion**
  The divergence is not primarily about risk assessment but about the *temporality of the State*. Germany practices a politics of closure, aiming to decouple the future from the present's hazardous decisions. France practices a politics of continuity, aiming to couple the future to the present's technological capabilities. They are not merely calculating different risks; they are imagining different ends of the political order.
