answer: |-
  This is a remarkably self-aware request. Your sister's boyfriend is pointing you toward **epistemic injustice**, specifically *testimonial injustice* (giving someone less credibility because of who they are) and *hermeneutical injustice* (someone lacking the words to describe what happened to them). He's right that these are real phenomena. But you're also right: a conduct board that believes everyone by default is a rubber stamp, not a court.

  You are asking for a way to be fair without being naive. Here is a procedure designed for your constraints (30 minutes, no lawyers, dropdown menu) that tries to separate *evidence* from *performance*.

  ### Part 1: The Dropdown Audit
  First, we need to sanitize your tools. Your dropdown menu is a minefield. Here is how you should treat each code:

  *   **"Inconsistent with other evidence"** ✅ **SAFE.** This is objective. (e.g., They said they were in the library, but the swipe log says cafeteria).
  *   **"Witness had no opportunity to observe"** ✅ **SAFE.** (e.g., They claim they saw the text message, but they were in a different room).
  *   **"Prior inconsistent statements"** ✅ **SAFE.** (e.g., They told the teacher X, but told the board Y).
  *   **"Implausible sequence of events"** ⚠️ **DANGER.** This is often code for "I can't imagine doing that." Only use this if the physics or timeline is impossible, not if the *behavior* seems weird to you.
  *   **"Manner and hesitation while speaking"** ❌ **TRAP.** Do not use this unless you have video. A stutter, anxiety, or cultural difference in eye contact looks like "hesitation." This is the primary vehicle for prejudice. If you must use it, it must be paired with a specific contradiction, not just "they looked nervous."

  ### Part 2: The 30-Minute Protocol
  Do not let the hearing start until you have read any submitted evidence (texts, logs, assignments).

  **Step 1: The Open Narrative (5 mins per person)**
  *   **Ask:** "Please tell us what happened in your own words, from start to finish. Don't worry about proving anything yet, just tell us the story."
  *   **Rule:** No interrupting. Even if they say something wrong. Let them finish.
  *   **Why:** This prevents you from anchoring on the first detail they get wrong. It also lets the "vibes" kid tell their story without being tripped up by procedure.

  **Step 2: The Anchor Points (10 mins per person)**
  *   **Ask:** "What are the three specific things you remember most clearly? (Time, place, specific words)."
  *   **Ask:** "Is there anyone or anything (camera, login, receipt) that proves you were there?"
  *   **Good Answer:** Specifics that can be checked. "It was 3:15, by the water fountain, he said 'give it to me'."
  *   **Bad Answer:** Generalities. "It was sometime afternoon, near the lockers, he was being mean."
  *   **Stop Point:** If a witness cannot name *where* or *when* something happened after two prompts, note "Vague on material facts."

  **Step 3: The Stress Test (5 mins per person)**
  *   **Ask:** "What is the one part of your story you think sounds the weakest to us?"
  *   **Ask:** "If we checked [specific evidence], what would it show?"
  *   **Why:** Liars rehearse the strong points. Truth-tellers often know where their memory is fuzzy. A liar will say "The camera will prove me." A truth-teller might say "I don't know if the camera caught it, but I was there."

  **Step 4: The Meta-Check (5 mins, Panel Only)**
  *   **Before voting, ask this aloud:** "If the quiet kid told the senior's story, and the senior told the quiet kid's story, would we believe the same thing?"
  *   **If the answer is No:** You are being swayed by status or articulation. Reset.
  *   **If the answer is Yes:** Proceed to vote.

  **Step 5: The Finding**
  *   **Option A: Sustained.** Evidence outweighs denial.
  *   **Option B: Not Sustained.** Evidence is insufficient. (This is not "they lied," it is "we don't know").
  *   **Option C: Referral.** This is a values call, not a fact call. (See below).

  ### Part 3: Handling the Tricky Witnesses

  **The "Smooth Talker" (Confident, Articulate)**
  *   **The Risk:** You confuse *consistency* with *truth*. A liar can have a perfectly consistent rehearsed story.
  *   **The Fix:** Look for *rigidity*. Ask a question about a peripheral detail (e.g., "What color was the shirt of the person standing next to you?"). A smooth liar often refuses to guess ("I don't recall") to avoid trapping themselves. A truth-teller might guess ("I think blue?").
  *   **The 30-Second Test:** Does their confidence match the *evidence*, or just their *demeanor*? If they are confident but have no corroboration on key points, downgrade their credibility.

  **The "Vibes" Reporter (Can't name it, "felt wrong")**
  *   **The Risk:** Dismissing harm because they lack vocabulary (Hermeneutical Injustice).
  *   **The Fix:** Separate *Fact* from *Label*.
      *   *Ask:* "You used the word 'harassment.' I need to know what he *did*, not what you call it. Did he touch you? Did he block your path? Did he send messages?"
      *   *Rule:* If they can describe *actions* that violate the code, believe the actions. Ignore the label. If they can *only* describe feelings ("he looked at me weird"), you cannot sustain a conduct violation, but you can refer to counseling.
      *   **TikTok Labels:** If they say "He gaslit me," ask: "Did he deny saying things you know he said?" If yes, that's the fact. Ignore the word "gaslight."

  ### Part 4: Where the Checklist is Fake Rigor
  I owe you honesty. Here is where this procedure is lying to you:
  1.  **The "Meta-Check" (Step 4):** This assumes your panel is self-aware enough to recognize bias. Often, you won't realize you're biased until after the vote.
  2.  **"Not Sustained" vs. "Didn't Happen":** You will write "Not Sustained," but the accused kid will hear "I was innocent," and the accuser will hear "You weren't believed." The procedure doesn't fix the social fallout.
  3.  **The Advisor:** If your teacher advisor is checking email, they aren't guarding the process. If they are overbearing, they are the real judge and you are props. The procedure assumes they are a neutral safety valve. They might not be.

  ---

  ### Part 5: Running the Cases

  #### Case 1: The Freshman (Stutter/Spanish) vs. The Senior (Debate Captain)
  *   **The Setup:** Freshman says shoved. Senior says alibi. No video.
  *   **Applying the Protocol:**
      *   *Step 1:* Freshman struggles to get the timeline out. Senior is polished.
      *   *Step 2 (Anchor Points):* Freshman says "3:15 PM, near Room 302." Senior says "3:15 PM, in Student Council meeting."
      *   *Step 3 (Stress Test):* Ask Senior: "Who can verify you were in the meeting?" Senior says "The advisor, but she steps out sometimes." Ask Freshman: "Who saw this?" Freshman says "No one, but my friend saw me crying after."
      *   *Dropdown Check:* Do **not** use "Manner and hesitation" for the freshman. Do **not** use "Implausible sequence" just because the Senior is popular.
      *   *The Meta-Check:* If the Senior stuttered and the Freshman was Debate Captain, would we believe the Senior's alibi without a witness? Probably not.
  *   **The Verdict:** **Not Sustained (Insufficient Evidence).**
  *   **Why:** This is the hard one. The Senior has an alibi (even if weak). The Freshman has no corroboration of the *act*, only the *aftermath*. In a court, this loses. In a school, it's a safety risk.
  *   **The Move:** You write "Not Sustained" for the conduct violation (no proof of shoving). **BUT** you add a note to the Dean: "Corroboration lacking, but power imbalance significant. Recommend administrative monitoring of Senior." You separate the *fact* (unknown) from the *risk* (high).

  #### Case 2: The Repeat False Reporter (Stolen Phone)
  *   **The Setup:** Sophomore has lied twice before. This time, timestamps/camera align, but no face.
  *   **Applying the Protocol:**
      *   *Dropdown Check:* "Prior inconsistent statements" applies to the *past* cases, not this one. For this case, "Inconsistent with other evidence" is the key.
      *   *Step 2:* Does the timeline match the camera? Yes. Does the text timestamp match the theft window? Yes.
      *   *Step 4 (Meta-Check):* Are we disbelieving her *because* she lied before, or because the evidence is weak?
  *   **The Verdict:** **Sustained.**
  *   **Why:** Past behavior is relevant to credibility, but physical evidence trumps reputation. If the camera shows someone took it at the exact minute she said, the "Prior inconsistent statements" code does not apply to the *facts of this case*.
  *   **The Nuance:** You note in the write-up: "Witness has history of inaccurate reporting, however, physical evidence (camera log/text timestamp) corroborates the specific claim of theft." You believe the *phone*, not necessarily the *kid*, but the phone proves the crime.

  #### Case 3: The "Impossible Truth" (My Choice)
  *   **The Setup:** A student reports being locked in a classroom overnight. They are visibly traumatized. They say it was the Janitor. The Janitor has a key log that shows he *never* entered that room. The door lock is mechanical and cannot be locked from the outside without a key. The student insists it happened.
  *   **Applying the Protocol:**
      *   *Step 2 (Anchor Points):* Student says "He locked it."
      *   *Step 3 (Stress Test):* "How was it locked?" "He turned the key."
      *   *Evidence:* Key log is digital and signed. Lock mechanism is impossible to engage from outside without key.
      *   *The Conflict:* The student is sincere (not lying intentionally), but the facts are physically impossible.
  *   **The Verdict:** **Not Sustained (against the Janitor).**
  *   **Why:** This is the "mean but evidentiary" outcome. You cannot punish the Janitor based on a physical impossibility.
  *   **The Hard Truth:** The procedure forces you to say the student's *account of the perpetrator* is incorrect. It does **not** mean the student wasn't trapped. It means your board cannot solve this.
  *   **The Move:** You refer this immediately to the Dean/Counseling with a note: "Conduct violation not proven due to physical evidence contradicting witness account. However, witness distress is genuine. Possible medical/psychological episode or unknown third party. Requires adult investigation."
  *   **Why you won't like it:** It feels like you are calling the kid a liar. You aren't. You are saying "Your story as told cannot be true, but you are suffering." A student board is not equipped to handle dissociation or complex trauma. This is where you hand it off.

  ---

  ### Part 6: Where This System Is Broken
  You asked for honesty about where five 16-year-olds and a distracted teacher will fail no matter what checklist you use.

  1.  **He-Said/She-Said with Zero Evidence:** If it's two students in a room with no cameras, no witnesses, and no texts, **you cannot find the truth.** You are guessing. If you vote "Sustained," you are punishing based on who you liked more. If you vote "Not Sustained," you are abandoning the victim.
      *   *The Fix:* Your procedure should have a "Unable to Determine" finding that triggers an *automatic* adult investigation. You should not be the final fact-finders on serious interpersonal harm without physical evidence.

  2.  **The "Vibes" Punishment:** Sometimes a kid is technically innocent but clearly dangerous (e.g., they didn't *say* the threat, but everyone knows they meant it). Your code requires "threatening language." They didn't use it.
      *   *The Fix:* You have to write "Not Sustained" on the violation, but write a separate "Risk Assessment" letter to the Dean. Do not twist the facts to fit the punishment. That corrupts the board.

  3.  **The Advisor Veto:** If your teacher advisor disagrees with you, they will likely win. If they are biased, you are just a cover for their bias.
      *   *The Fix:* If the advisor pushes you to use "Manner and hesitation" on a nervous kid, you need to push back in the meeting. "We agreed not to use that code unless there is video."

  **Final Advice:**
  Your job is not to be the Judge. It is to be the **Filter**.
  *   Filter out the lies (Case 2).
  *   Filter out the impossible (Case 3).
  *   Filter out the bias (Case 1).
  *   Pass the messy, human, unprovable stuff to the adults (Case 3 referral).

  If you use the dropdown codes honestly, and you admit when you just "don't know," you will do better than 90% of adult boards. But do not pretend you are a court. You are a triage unit. Act like it.
