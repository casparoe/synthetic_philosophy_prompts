answer: |-
  Your friend is almost certainly running on **Bell's Definition of Local Causality** (often called "Bell Locality" or "Local Beables").

  Here is the breakdown of why that rule fits her six verdicts, what she will say about your specific case, and the test case that will prove which rule she's actually using.

  ### 1. The Rule: Bell's Local Causality
  Bell's criterion isn't about "faster-than-light signaling" (which she already ruled out) and it isn't strictly about "privileged time" (though that often comes along for the ride). It is about **probabilistic dependence across spacelike intervals.**

  Formally, a theory is locally causal if, given a complete specification of the physical state ($\lambda$) in the past light cone of an event $A$, the probability of $A$ does **not** change if you also specify what happened at a spacelike-separated event $B$.
  $$P(A | B, \lambda) = P(A | \lambda)$$

  Here is how this rule maps to her six verdicts:
  1.  **Bohmian (Nonlocal):** The velocity of particle A depends on the position of particle B *now*. To define "now" across space, you need a foliation. But fundamentally, $P(A | B, \lambda) \neq P(A | \lambda)$. The state at B screens off nothing; it directly influences A.
  2.  **GRW (Nonlocal):** A collapse here instantly updates the wavefunction there. The probability of a flash at A depends on the outcome at B. Violates screening off.
  3.  **Many-Worlds (Local):** There are no unique outcomes $A$ or $B$ to have probabilities over. The wavefunction evolves via a local Hamiltonian. The *appearance* of correlation is due to local branching. No spacelike dependence in the fundamental dynamics.
  4.  **Superdeterminism (Local):** It violates "Measurement Independence," not Local Causality. The correlation between A and B is explained by a common cause in the *past* ($\lambda$). Once you know $\lambda$, $P(A | B, \lambda) = P(A | \lambda)$. The spacelike link is an illusion caused by ignoring the past correlation.
  5.  **Retrocausal (Local):** The influence travels from B back to the past and then to A (or vice versa). The path is always within lightcones. If you specify the state on a complete slice (or include future boundaries), screening off holds.
  6.  **Textbook QM (Nonlocal):** Collapse implies $P(A | B) \neq P(A)$. Violates screening off.

  **Why she mentioned "Privileged Now":**
  For a theory to violate Bell Locality (like Bohm or GRW) and still make sense of "simultaneous" influence, it usually requires a preferred foliation of spacetime to define the "slice" on which the influence acts. She is citing the *symptom* (privileged now) as the *diagnosis*, but the underlying disease is the spacelike dependence.

  ### 2. The Prediction for Your Case
  **Your Case:** A relativistic collapse theory (like Roderich Tumulka's **rGRWf**).
  *   **Features:** Lorentz invariant (no privileged now), but the probability of a flash at A depends on flashes at spacelike-separated B. No signaling.
  *   **Her Verdict:** **Nonlocal.**

  **Why:**
  Even though you removed the "privileged now" (making it Manifestly Lorentz Invariant), you kept the **spacelike probabilistic dependence**.
  In Bell's framework, **Lorentz Invariance $\neq$ Locality.** You can have a theory that looks the same to all observers but still involves "action at a distance" in the probabilistic structure. Tumulka's theory is famously described in the literature as "a nonlocal, Lorentz-invariant collapse theory."

  If her rule were truly just "No Privileged Now," she would have to call this Local. But since she classifies Superdeterminism and Retrocausality as Local (which are strategies to *restore* Bell Locality), she cares about the **causal structure**, not just the coordinate symmetry. Your case admits spacelike causation without the "excuses" of Superdeterminism (past mediation) or Retrocausality (time-loop mediation).

  ### 3. The Separating Case
  To be sure, you need a case where **Bell Locality** and **No Privileged Now** give opposite answers.

  **The Test Case:**
  > **"A classical field theory on a fixed lattice (or Newtonian spacetime) where interactions only propagate to nearest neighbors at finite speed."**

  *   **Description:** Imagine a universe with absolute time (a privileged "now" exists ontologically) and a grid. A disturbance at point X affects point Y only by traveling through the intervening grid points at speed $v \leq c$.
  *   **Bell Locality Rule:** **Local.**
      *   Why? Because $P(A | B, \lambda) = P(A | \lambda)$. Any correlation between A and B is fully mediated by the chain of events in the past light cone. There is no action at a distance.
  *   **No Privileged Now Rule:** **Nonlocal.**
      *   Why? Because the theory postulates a preferred frame (the lattice rest frame or absolute time). It violates Manifest Lorentz Invariance.

  **How to ask her:**
  *"Imagine a universe that works like a cellular automaton: absolute time, fixed grid, but signals only move to next-door neighbors at finite speed. No instantaneous jumps. Is that theory Local or Nonlocal?"*

  *   If she says **Local**: She is using **Bell Locality**. (She accepts preferred frames if the causal chains are continuous).
  *   If she says **Nonlocal**: She is using **Manifest Lorentz Invariance**. (She equates "Local" with "Relativistic Symmetry").

  **My bet:** She says **Local**. Most foundations people care about the causal mechanism (Bell) more than the spacetime symmetry when defining locality. The "privileged now" comment was her explaining *why* Bohm violates Bell Locality, not the definition of Locality itself. Therefore, she will call your relativistic collapse theory **Nonlocal**.
