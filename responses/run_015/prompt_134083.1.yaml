prompt: |-
  I'm trying to figure out Einstein's actual view on free will, not the pop-science version everone quotes. Here are my gut reads: he denies free will in physics outright, comparing human behavior to planets on orbits. He praises Spinoza's deterministic God as the only intellectually honest religious stance. He rejects quantum indeterminacy as a rescue for freedom, saying randomness isn't the kind of thing that saves moral agency. But he also writes about ethical responsibility like people genuinly choose, and he mentions moral freedom being necessary for scientific integrity. Plus he seems to think accepting determinism with dignity is itself a kind of spiritual achievement. Is there one principle behind all this -- maybe determinism in nature plus rational acceptance that does freedom's work in ethics -- and if not, which of these reads should I drop? Or is it just contradiction? Also, what does it say about the case I'm stuck on: if Einstein had seen modern neuroscience predcting choices a few seconds before conscious awareness, would he have said moral responsibility collapses, or that it never depended on breaking physical laws in the first place?
