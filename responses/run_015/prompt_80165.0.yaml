      *   *Decision:* The "Killer" is **Constraint (Falsifiability)**. Why? Because you can fix circularity by refining definitions (e.g., technical vs. legal relations of production). You can fix variance by adding "mediation." But if the theory can accommodate *any* outcome (England becomes capitalist, China doesn't, USSR falls, USSR stays), it explains nothing. This addresses the user's "retelling the story after the fact" fear directly.

  7.  **Addressing the User's Specific Questions:**
      *   *Test Cases:* England/China (Great Divergence) is good for *emergence*. USSR is good for *stability/collapse*. They are valid.
      *   *Circularity:* It is a real objection, not a strawman. It's the "Definition Problem."
      *   *Tensions:* Explicitly map the trade-offs.

