      *   **Tone:** Analytical, philosophical, rigorous, neutral (meta-theoretical).

  2.  **Deconstruct the Core Problem:**
      *   The Base/Superstructure model is often criticized for being tautological (base is defined by legal relations which are superstructural) or too deterministic (ignoring culture/ideas) or too vague (allows for anything to happen, making it unfalsifiable).
      *   The user is asking for the *conditions of adequacy* for such a theory. What makes a sociological/historical theory *good*?

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Requirement 1: Non-Circularity (The Definition Problem).* The user raised the point about "property" being a legal category. If the base is defined by superstructural terms, it can't explain them.
          *   *Status:* Non-Negotiable. A theory cannot explain $X$ by defining $X$ into its premise.
      *   *Requirement 2: Causal Mechanism (The "How" Problem).* It's not enough to say "Base determines Superstructure." How? Through what channel? Incentives? Coercion? Socialization?
          *   *Status:* Non-Negotiable. Correlation isn't causation. Without a mechanism, it's just a pattern observation.
      *   *Requirement 3: Counterfactual/Predictive Power (The "Post-Hoc" Problem).* The user mentioned "retelling the story after the fact." A theory needs to rule things out.
          *   *Status:* Non-Negotiable (for scientific/explanatory status). If it fits every outcome, it explains none.
      *   *Requirement 4: Handling Variation (The "Same Base, Different Superstructure" Problem).* If feudalism exists in Japan and Europe but looks different, the theory must account for the variance without abandoning the core claim.
          *   *Status:* Non-Negotiable. A deterministic claim that is falsified by empirical variance is false. A probabilistic claim must explain the probability distribution.
      *   *Requirement 5: Temporal Priority/Feedback Loops (The "Timing" Problem).* Does the base always come first? Or can the superstructure change the base? The user mentioned the third claim (base built out of superstructure).
          *   *Status:* Nuanced. Strict temporal priority might be too strong, but causal priority is needed. Let's call this "Directionality."
      *   *Requirement 6: Scope/Granularity (The "Test Case" Problem).* The user asked about England vs. China and USSR. Are these right?
          *   *Analysis:* England vs. China is a "Great Divergence" question (why capitalism here not there?). USSR is a "Systemic Collapse" question. Both are valid but test different things (emergence vs. stability).
          *   *Decision:* This isn't a requirement *of the theory* but a requirement *for testing* the theory. I should frame this as "Empirical Coverage."

