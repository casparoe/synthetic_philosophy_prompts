  6.  **Identifying the "Killer" Requirement:**
      *   Which one kills the most versions? Usually, it's **Conceptual Independence** (the circularity charge) or **Falsifiability** (the "it explains everything" charge).
      *   The user specifically flagged the circularity issue ("means of production... are themselves legal categories"). This is the most philosophical and damaging objection. If the base *cannot be defined* without the superstructure, the theory collapses logically before we even look at history.
