  10. **Refining the "Killer":** I need to be careful. The circularity objection is logically prior. If the terms are circular, the theory is meaningless. But often Marxists argue "technical relations" vs "legal relations." So it's solvable. The *explanatory* failure is usually the inability to rule out outcomes. I will argue that **Constraint** is the killer for *explanatory work*, while **Independence** is the killer for *logical coherence*. The user asked about "explanatory work." So Constraint is the right choice.

