answer: |-
  Here is the specification list for a Base/Superstructure theory to count as doing explanatory work.

  ### Part 1: The Requirements List

  #### 1. Conceptual Independence (The Non-Circularity Requirement)
  *   **The Requirement:** The "Base" must be definable without referencing the "Superstructure." You must be able to describe who owns what and how production is organized without using legal, political, or ideological categories that belong to the Superstructure.
  *   **Why it's Non-Negotiable:** This addresses your circularity objection. If "property" is a legal concept (Superstructure), and "ownership of means of production" (Base) relies on "property," then the Base is defined by the Superstructure. A theory cannot claim $A$ explains $B$ if the definition of $A$ presupposes the existence of $B$. If this requirement isn't met, the theory is a tautology, not an explanation.
  *   **The Hurdle:** Defining "production" purely technically (e.g., "people using tools") often loses the social specificity Marxists care about (e.g., "wage labor"). Defining it socially often smuggles in law.

  #### 2. Causal Mechanism (The "Black Box" Requirement)
  *   **The Requirement:** The theory must specify the *channel* of determination. It is not enough to say the Base "conditions" or "determines" the Superstructure. The theory must articulate the mechanism: Does it work through class interest? State coercion? Psychological socialization? Resource constraints?
  *   **Why it's Non-Negotiable:** Correlation is not causation. Without a mechanism, any correlation between economic data and cultural trends could be coincidental or reversed. To claim explanatory power, the theory must show *how* a change in production relations forces a change in law or culture.
  *   **The Hurdle:** Mechanisms are often vague (e.g., "ruling class ideas become the ruling ideas"). If the mechanism is "people act in their economic interest," the theory collapses into rational choice theory, not historical materialism.

  #### 3. Empirical Constraint (The Falsifiability Requirement)
  *   **The Requirement:** The theory must rule out possible historical outcomes. There must be a conceivable scenario where the Base is $X$, but the Superstructure is *not* $Y$. If the theory can accommodate any Superstructural outcome given a specific Base (by adding ad-hoc adjustments), it is doing post-hoc storytelling, not explaining.
  *   **Why it's Non-Negotiable:** This addresses your fear of "retelling the story after the fact." A theory that fits every data point explains none of them. To do real work, the theory must take a risk; it must predict that certain cultural or legal forms are *impossible* or *highly improbable* given specific economic conditions.
  *   **The Hurdle:** Defenders often retreat to "determination in the last instance" or "relative autonomy" to explain away mismatches. If these qualifiers are too flexible, they violate this requirement.

  #### 4. Variance Accommodation (The "Same Base, Different Superstructure" Requirement)
  *   **The Requirement:** The theory must account for historical variation without abandoning the core claim. If Society A and Society B have identical economic bases but different laws/cultures, the theory must explain the variance without conceding that the Superstructure is independent of the Base.
  *   **Why it's Non-Negotiable:** This addresses your point about consistency. If the Base *determines* the Superstructure, identical inputs should yield identical outputs. If they don't, either the Base wasn't actually identical (see Req 1), or the determination is probabilistic, not deterministic. The theory must specify the margin of error or the mediating variables.
  *   **The Hurdle:** Explaining variance often requires importing non-economic variables (geography, religion, contingency). If you import too many, the Base is no longer the *primary* driver, violating the spirit of the theory.

  #### 5. Directional Priority (The Temporal/Causal Order Requirement)
  *   **The Requirement:** The theory must clarify the direction of causality during periods of transition. When the Base and Superstructure are in conflict (e.g., new technology vs. old laws), the theory must predict which one yields.
  *   **Why it's Non-Negotiable:** You noted the third claim: that the Base is built out of Superstructural categories. If the Superstructure (law) defines the Base (property), then changing the law changes the Base. The theory must explain why economic changes usually drive legal changes, rather than vice versa, especially since they are mutually constitutive.
  *   **The Hurdle:** In revolutions, political action (Superstructure) often precedes economic reorganization (Base). The theory needs to explain this without admitting that politics is sometimes the primary driver.

  ---

  ### Part 2: The Test Cases

  Your selection of test cases is **correct**, but they test different parts of the spec.

  1.  **The Great Divergence (England vs. China):**
      *   **What it tests:** *Emergence* and *Necessity*.
      *   **Why:** Both had advanced markets, trade, and proto-industry. If the Base (commercial expansion) automatically generates the Superstructure (capitalist law/liberalism), why did it happen in England and not China?
      *   **Verdict:** This is the hardest test for the theory. If the theory cannot explain why similar economic bases yielded different political outcomes here, it fails **Variance Accommodation**.

  2.  **The Collapse of the USSR:**
      *   **What it tests:** *Stability* and *Contradiction*.
      *   **Why:** The USSR claimed to have a new Base (state ownership) which should generate a new Superstructure (socialist culture). Its collapse suggests either the Base wasn't what they claimed (req 1 failure) or the Superstructure (bureaucracy/nationalism) overrode the Base.
      *   **Verdict:** This tests whether the Base can sustain a Superstructure against external pressure or internal inefficiency.

  **Flag:** Do not use "The Rise of Nazism" as a test case unless you are prepared for endless debate. It is the most contested case in Marxist historiography (was it a tool of capitalists? a petty-bourgeois reaction? autonomous politics?). Stick to England/China and USSR for cleaner data.

  ---

  ### Part 3: Tension Points (Incompatibilities)

  Here is where the theory typically breaks. You cannot maximize all requirements simultaneously.

  **Tension A: Conceptual Independence vs. Historical Reality**
  *   **The Conflict:** To satisfy **Conceptual Independence**, you must define the Base in technical/physical terms (tools, resources, labor hours). But in the real world, "production" is always embedded in law and custom. You cannot identify a "feudal mode of production" without referencing "feudal law."
  *   **The Trade-off:** If you make the Base definition pure enough to be independent, it becomes too abstract to explain specific history. If you make it specific enough to explain history, it becomes circular (dependent on Superstructural categories).
  *   **Result:** Most versions of the theory fail **Conceptual Independence** to save **Empirical Coverage**.

  **Tension B: Empirical Constraint vs. Variance Accommodation**
  *   **The Conflict:** To satisfy **Empirical Constraint**, the theory must be rigid (Base $X$ $\rightarrow$ Superstructure $Y$). To satisfy **Variance Accommodation** (England vs. China), the theory must be flexible (Base $X$ $\rightarrow$ Superstructure $Y$ *unless* factors $a, b, c$ intervene).
  *   **The Trade-off:** Every time you add a factor to explain variance (culture, geography, great men), you weaken the claim that the Base is the *primary* driver.
  *   **Result:** Most versions of the theory sacrifice **Empirical Constraint** to save **Variance Accommodation**. They become unfalsifiable to avoid being proven wrong by history.

  **Tension C: Directional Priority vs. Mutual Constitution**
  *   **The Conflict:** You correctly identified that property is a legal category. This implies mutual constitution (Base and Superstructure create each other). But the theory requires **Directional Priority** (Base drives Superstructure).
  *   **The Trade-off:** You cannot have strict单向 (one-way) causation in a system where the definitions are interdependent.
  *   **Result:** The theory must shift from "causation" to "functional fit" (the Superstructure evolves to *support* the Base). But functionalism is notoriously difficult to prove without falling into teleology (assuming history has a goal).

  ---

  ### Part 4: The Killer Requirement

  The single requirement that knocks out the most versions of the view is:

  **3. Empirical Constraint (Falsifiability)**

  **Why:**
  The circularity objection (Req 1) is severe, but sophisticated defenders can bypass it by distinguishing between "technical relations of production" (who does the work) and "legal relations of production" (who owns the output). It is a definitional fix.

  The Variance objection (Req 4) is manageable by claiming "uneven development" or "local conditions."

  However, **Empirical Constraint** is where the theory almost universally retreats into vagueness. To survive the England/China test or the USSR collapse, defenders inevitably introduce qualifiers:
  *   "Determination in the *last* instance."
  *   "Relative autonomy of the superstructure."
  *   "Complex mediation."

  These qualifiers are designed specifically to prevent the theory from being proven wrong. They allow the theorist to say, "The Base didn't determine the Superstructure *here*, but it still determines it *generally*."

  Once a theory can explain why the Base produced Democracy in one case and Fascism in another, without specifying the conditions under which it produces one *over* the other, it has failed **Empirical Constraint**. It stops being a predictive/explanatory model and becomes a hermeneutic lens (a way of interpreting history, not explaining it).

  If you hold this requirement as non-negotiable, 90% of existing Base/Superstructure formulations cease to function as scientific or social-scientific theories and become philosophical frameworks. That is the settlement point you are looking for.
