      *   *The Collapse:* Why do apple photos stop paying? Because the class of "non-black things" is infinite/huge. Once you've seen enough apples, shoes, and mailboxes, the probability shift becomes negligible. In the story terms: The Bureau has enough data to know non-black things aren't ravens. The *marginal utility* of another green apple photo is zero.
