      *   Attack (7): The leap to utilitarianism assumes cardinal utility is the *only* alternative, but there are others (randomization, negotiation).
      *   *Crucial Point:* The argument proves too much because it treats Arrow's constraints as normative requirements for *rationality* rather than technical constraints of a specific *model*.

  7.  **Finalizing the "Cost":** What do we give up?
      *   Either we give up Liberal Neutrality (admit the AI needs a welfare metric).
      *   Or we give up the idea that AI decision-making must look like individual rational choice (accept IIA violations).
