  10. **Final Polish:** Check for clarity and density. Ensure the "Residue Report" is distinct and actionable. (Proceed to generate response).

  *(Self-Correction during final output generation)*: Wait, I need to be careful about the "Belief" mapping. In ML, a "belief" isn't just an activation. It's an activation that *tracks truth* across counterfactuals. I should align this with the user's refinement later. For the initial translation, I'll define it as "stable latent representations encoding world-state."

