answer: |-
  ### Candidate Setups

  1.  **Tax Resistance:** Maya refuses to pay local income tax to protest military spending. *Failure:* It is nearly impossible to plausibly stipulate she receives "no net benefit" from the state (security, infrastructure) without violating the "realistic contemporary" constraint, as tax benefits are diffuse and unavoidable.
  2.  **Pandemic Mask Mandate:** Maya refuses to wear a mask in a municipal building. *Failure:* This risks violating the "no life-or-death emergency" specification, as public health crises are often construed as such. Additionally, arguing she receives no health benefit from herd immunity is scientifically contentious within a realistic setting.
  3.  **Recycling Ordinance:** Maya refuses to sort trash to protest private contractors. *Failure:* It is difficult to engineer a "public, communicative" act of non-compliance that qualifies as civil disobedience rather than mere littering or laziness, and the "unreasonable cost" of compliance is too low to make the divergence interesting.

  ### Final Scenario

  Maya resides in Oakhaven, where a democratically enacted drought ordinance prohibits residential car washing to preserve municipal reservoirs, exempting commercial washes using recycled water. The scheme is reasonably just, with burdens fairly distributed among users. Maya exclusively utilizes a private rainwater harvesting system, knowingly accepting zero municipal water and deriving no net benefit from the municipal supply scheme. She voluntarily withheld acceptance of any such benefits. Although compliance imposes no unreasonable cost, Maya publicly washes her car using her harvested rainwater. She announces this violates the ordinance to protest the commercial exemption, arguing it undermines egalitarian sacrifice. She acts nonviolently, conscientiously, and submits to arrest. The overall scheme remains reasonably just despite the exemption. Maya accepts the legal penalties. Her action is communicative, aimed at legislative revision. She does not deny the drought's reality but contests the exemption's fairness within a broadly just framework.

  ### Analysis

  Under the **fair-play principle**, Maya breaches no political obligation. The definition requires three conjuncts: knowingly benefiting, voluntarily accepting benefits, and bearing a fair share. The scenario stipulates Maya knowingly accepts zero municipal water and derives no net benefit from the scheme, voluntarily withholding acceptance. Since the necessary condition of benefit/acceptance is absent, the cooperative scheme generates no obligation for her, rendering her disobedience consistent with fair-play theory.

  Under the **natural duty of justice**, Maya's disobedience is *pro tanto* wrong. This duty requires supporting reasonably just institutions independently of voluntary acceptance or benefit, provided compliance costs are not unreasonable. The scenario stipulates the scheme is reasonably just, democratically enacted, and compliance imposes no unreasonable cost. Consequently, the duty applies to Maya regardless of her non-participation. Her violation constitutes a breach of this duty, even if her civil disobedience might be justified all-things-considered by overriding moral reasons.

  ### Decisive Feature and Objections

  The decisive feature driving the divergence is **Maya's non-benefit and non-acceptance status**. The fair-play principle ties obligation to reciprocal benefit within a cooperative scheme, while the natural duty ties obligation to the justice of the institution itself. If we reverse this feature—supposing Maya *does* use municipal water—the fair-play principle would also generate an obligation, aligning the verdicts. Conversely, if the scheme were *unjust*, the natural duty would cease to apply, aligning the verdicts in the other direction.

  A **fair-play defender** faces the objection that Maya indirectly benefits from social stability maintained by the scheme. To rescue the "no obligation" verdict, they must insist on a strict interpretation of "knowingly benefits from the scheme," excluding diffuse externalities like general order. A **natural duty defender** faces the objection that civil disobedience *supports* justice by correcting flaws. To rescue the "obligation breached" verdict, they must distinguish the *pro tanto* duty to comply from all-things-considered justification, maintaining that even constructive disobedience technically breaches the duty of compliance unless institutions exceed the threshold of unreasonable injustice.
