answer: |-
  **Project Title:** Successor-Legibility: Distinguishing Standing Institutions from Recurring Events in the Archaeological Record

  **1. Statement of the Question**
  Archaeology infers the existence of early political institutions—standing offices, treasuries, priesthoods—from material patterns of accumulation. The standard argument relies on scale and standardisation: large storage facilities, metrically uniform containers, and redundant administrative markings are taken as evidence of a permanent bureaucracy. However, scale and standardisation are also produced by well-rehearsed events. A recurring harvest festival, a seasonal mobilisation for construction, or a periodic redistribution ceremony can generate deposits that are institution-sized without requiring a standing office.

  This project asks: **Is there a material signature that discriminates a standing institution from a recurring event?**

  To answer this, I will test three rival generative hypotheses against assemblage data:
  1.  **The Standing Office:** A continuous entity persisting beyond the tenure of specific actors.
  2.  **The Recurring Event:** A periodic gathering with no permanent administrative staff between episodes.
  3.  **The One-Off Episode:** A singular mobilisation leaving a large deposit without recurrence.

  Current scholarship often conflates Hypotheses 1 and 2. By isolating the material consequences of *continuity of office* versus *continuity of practice*, this project seeks to determine if the archaeological record can sustain claims about early statehood, or if such claims rest on untested assumptions.

  **2. Critique of Existing Positions**
  The prevailing inference from material to institution relies on an unisolated assumption: that only a permanent bureaucracy can maintain the consistency required for large-scale standardisation. This ignores the capacity of oral tradition and ritual repetition to enforce standardisation across generations without a written archive or permanent staff. If a festival occurs annually, its equipment will be stored, maintained, and redeployed in a standardised way, mimicking a treasury.

  Conversely, the sceptical position—that institutions are simply invisible in the material record—is theoretically too cheap. It absolves the discipline of the burden of proof but offers no pathway to refine our interpretive tools. It assumes that because the *name* of an office is invisible, the *function* of an office leaves no trace. This project rejects both the automatic attribution of complexity and the defeatist claim of invisibility. It posits that a standing institution faces a specific constraint that an event does not: it must hand over procedures and equipment to a successor who was not present when they were made. This constraint, which I term **successor-legibility**, should generate distinct material traces regardless of whether the specific office is named in the record.

  **3. Methodology and Timeline**
  The core method is forward modelling. Rather than starting with archaeological data and working backward to social forms (which risks circularity), I will specify the generative processes for the three hypotheses and derive their predicted material outcomes. I will then test whether these predicted signatures are separable given real-world preservation conditions and sample sizes.

  **Months 1–3: Parameterising the Generative Models**
  I will define the operational rules for the three hypotheses.
  *   *Standing Office:* Rules include staff turnover, inventory handover, and repair protocols designed for long-term utility.
  *   *Recurring Event:* Rules include periodic activation, storage between events, and repair protocols designed for ritual integrity or short-term utility.
  *   *One-Off Episode:* Rules include single-use intensity and abandonment.
  The output will be a set of predictions regarding assemblage composition, rates of repair versus replacement, and the nature of markings (context-specific vs. conventionalised).

  **Months 4–6: Simulation and Signature Derivation**
  Using agent-based modelling or deterministic simulations, I will run iterations of these processes to generate synthetic assemblages. The goal is not to replicate a specific site, but to identify threshold values. For example: At what rate of staff turnover does "context-specific" marking become statistically indistinguishable from "conventionalised" marking? Does the "Standing Office" model consistently produce more modular repairs than the "Recurring Event" model? This phase produces the *expected* signatures.

  **Months 7–9: Comparative Analysis of Published Assemblage Types**
  I will test the simulated signatures against published data from broad typological categories (e.g., "early urban storage complexes," "ritual deposition pits," "palatial archives"). I will not rely on specific site reports or stratigraphic sequences, which vary too widely in publication quality. Instead, I will aggregate data on vessel metrics, seal impression frequencies, and evidence of repair (e.g., drill holes, mending clips) available in synthetic regional studies. The test is whether the variance in real assemblages aligns with the variance predicted by the models.

  **Months 10–12: Synthesis and Dissertation Integration**
  I will evaluate the discriminative power of the "successor-legibility" criteria. The final months will be dedicated to writing the dissertation chapter and a standalone article detailing the methodological framework. This ensures the fellowship yields both degree progress and a publishable methodological contribution.

  **4. Possible Outcomes and Implications**
  *   **Positive Result:** The models produce distinct signatures (e.g., Standing Offices show higher rates of functional repair and redundant marking than Recurring Events), and these signatures are identifiable in published assemblage types. This would validate the inference of institutions in specific cases where these traces are present.
  *   **Negative Result:** The models show that under realistic preservation conditions, the signatures of Offices and Events overlap significantly.
      *   *Implication:* This does not mean institutions did not exist. It means archaeology cannot currently distinguish them from complex events using standard metrics. This would entitle us to conclude that specific debates over early storage and redistribution are currently undecidable on material grounds alone, requiring a suspension of judgment on political complexity until new proxies are found.
  *   **Null Result:** The models fail to generate clear predictions even in ideal conditions. This would suggest the theory of "successor-legibility" is insufficient to describe institutional continuity.

  **5. Conditions of Failure**
  It is vital to distinguish a negative result from project failure.
  *   **Negative Result:** The method works, but the data shows no separation between hypotheses. This is a successful contribution to knowledge; it defines the limits of archaeological inference.
  *   **Project Failure:** The forward models are incoherent (e.g., the parameters for "office" and "event" cannot be mathematically distinguished even in theory), or the published assemblage data is too fragmented to test *any* model. To mitigate this, I have identified three regional corpora with sufficient quantitative reporting on vessel metrics and repair to ensure testability. If these prove unusable, I will pivot to a purely theoretical formalisation of the problem, which remains a valuable methodological output.

  **6. Justification for Methodological Focus**
  A dissertation-completion fellowship typically supports empirical data collection. However, this project addresses a foundational error in interpretation that affects hundreds of empirical studies. If the standard move from scale to institution is flawed, then countless reconstructions of early state formation are over-interpreted. Funding a year of methodological refinement prevents future empirical work from building on unstable inferential grounds. By clarifying *what* can be known from material patterns, this project increases the rigour of the entire discipline, ensuring that claims about the origins of political complexity are warranted by the evidence rather than assumed by tradition.
