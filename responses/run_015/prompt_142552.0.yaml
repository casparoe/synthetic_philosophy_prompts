answer: |-
  You have identified the central tension of transitional justice: the trade-off between the *utility* of truth and the *demands* of justice. Your three tentative conditions are sound, but they lack the precision to resolve the conflicts you have identified, particularly regarding the 'architects' of violence (Cases 2 and 4) and the nature of 'truth' itself (Cases 6, 7, and 9).

  You do not need to drop a verdict, but you must resolve the wavering on Case 4 to maintain coherence with Case 2. To achieve this, I propose a unified framework I shall call **The Principle of Restorative Subordination**.

  This principle holds that amnesty is a transactional exception to justice, warranted only when the applicant's structural position mitigates their culpability *and* their disclosure provides a material benefit to the historical record that outweighs the public interest in prosecution.

  ### The Principle of Restorative Subordination

  Amnesty is warranted if and only if all four of the following clauses are satisfied:

  **1. The Evidentiary Utility Clause**
  The disclosure must either reveal facts otherwise inaccessible to the Commission, significantly expedite their discovery, or materially correct a miscarriage of justice in the existing record.
  *   **Motivating Cases:** This distinguishes **Case 1** (burial sites otherwise unknown) and **Case 3** (lists expedited, though findable) from **Case 6** (public confession adding no new facts). It also resolves the tension between **Case 6** and **Case 7**: whilst both add no *new* crimes, Case 7 corrects a *false* attribution (exonerating an innocent man), which constitutes a material correction of justice, whereas Case 6 is merely performative.
  *   **Verdict:** Case 1 (Yes), Case 3 (Yes), Case 6 (No), Case 7 (Yes).

  **2. The Mitigated Agency Clause**
  The applicant must have acted as a functionary within a hierarchy, lacking the discretionary authority to design, fund, or sustain the repressive apparatus. Amnesty is barred to those whose contribution was constitutive of the regime's capacity to commit atrocities.
  *   **Motivating Cases:** This distinguishes the **Conscript (Case 1)** and **Clerk (Case 3)** from the **General (Case 2)**. Crucially, it resolves your wavering on **Case 4 (The Banker)**. Like the General, the Banker exercised discretionary power to *sustain* the apparatus. Without the doctrine (General) or the funds (Banker), the killings could not occur; without the clerk or conscript, the specific killings might not have occurred, but the capacity remained. Therefore, the Banker is an architect/enabler, not a subordinate. It also excludes **Case 8 (The Village)**, where communal violence implies shared principal liability rather than subordinate command.
  *   **Verdict:** Case 1 (Yes), Case 2 (No), Case 3 (Yes), Case 4 (No), Case 8 (No).

  **3. The Procedural Primacy Clause**
  The disclosure must precede the Commission's independent identification or corroboration of the applicant's specific liability.
  *   **Motivating Cases:** This addresses **Case 5**. Once three others have named the perpetrator, the leverage of the amnesty bargain is lost. The state no longer *needs* the confession to establish liability; thus, the *quid pro quo* fails.
  *   **Verdict:** Case 5 (No).

  **4. The Factual Veracity Clause**
  The disclosure must correspond to objective evidence and must not serve to obscure the liability of others or falsify the historical record.
  *   **Motivating Cases:** This explicitly captures **Case 9**. You asked which of your original conditions this violates. It violates the *No-settlement* condition. By falsely confessing, the perpetrator forces the Commission to certify a description of events that is objectively untrue, thereby settling the record on a lie to protect a superior.
  *   **Verdict:** Case 9 (No).

  ### Resolution of Conflicts

  *   **Cases 2 and 4:** You must cease wavering on Case 4. To grant amnesty to the Banker whilst denying it to the General creates an incoherent distinction between 'political' and 'economic' architects. Both provided the essential conditions for the violence. The principle demands a **No** verdict for the Banker.
  *   **Cases 6 and 7:** These are distinguished by the *direction* of the truth. Case 6 confirms what is known; Case 7 rectifies what is wrongly known. The Commission's mandate is not just to accumulate facts, but to establish *justice*. Exoneration is a higher utility than repetition.
  *   **Case 9:** This is now clearly barred by the Factual Veracity Clause. A false confession corrupts the Commission's core output.

  ### Application to New Cases

  **Case A: The Child Soldier**
  *Scenario:* Someone abducted at fourteen, victimised, and then forced to perpetrate violence, now seeking amnesty.
  *   **Analysis:**
      *   *Evidentiary Utility:* Assuming they disclose their actions, this is met.
      *   *Mitigated Agency:* This is the critical factor. A child of fourteen possesses diminished legal and moral capacity. Their 'agency' is inherently mitigated by coercion and development status, far more than the conscript in Case 1.
      *   *Primacy & Veracity:* Assuming they come forward first and tell the truth.
  *   **Verdict:** **Amnesty Warranted.**
  *   **Reasoning:** The Mitigated Agency Clause applies with maximum force. In international law and transitional practice, child soldiers are primarily viewed as victims. Prosecution serves neither retributive nor restorative justice here. The Commission should grant amnesty, likely coupled with a mandatory rehabilitation programme rather than punishment.

  **Case B: The Void Self-Amnesty**
  *Scenario:* Someone who disclosed everything under the outgoing regime's self-amnesty, which you have since declared void.
  *   **Analysis:**
      *   *Evidentiary Utility:* **Failed.** The Commission already possesses the truth from the prior disclosure. The leverage of the amnesty bargain (truth for immunity) has already been exercised, albeit under a now-invalid legal framework. There is no *new* utility to trade.
      *   *Mitigated Agency:* Unknown, but irrelevant if Utility fails.
      *   *Procedural Primacy:* **Failed.** They are not disclosing to *this* Commission voluntarily to aid *this* process; they are relying on a prior act.
  *   **Verdict:** **Amnesty Not Warranted (but sentencing leniency appropriate).**
  *   **Reasoning:** You cannot grant amnesty for information you already possess without devaluing the currency for those who have not yet spoken. To grant amnesty here would signal that the voiding of the self-amnesty was meaningless. However, since they did disclose, their culpability is reduced. They should face prosecution, but the prior disclosure should be treated as a significant mitigating factor during sentencing, acknowledging their cooperation whilst upholding the validity of the new legal order.

  ### Summary Advice

  Your intuition on Case 4 is the weak link in your chain. If you grant amnesty to the Banker, you undermine the denial of amnesty to the General. Both sustained the machine of death; neither should be absolved. By tightening your definition of 'agency' to exclude those with discretionary power to sustain the regime, and by clarifying that 'truth' includes the correction of injustice (Case 7) but excludes performative confession (Case 6), your nine verdicts become consistent.

  Proceed with the **Principle of Restorative Subordination**. It protects the Commission from being used to sanitise the records of the powerful (Cases 2, 4, 9) whilst ensuring it remains a viable path for the subordinate (Cases 1, 3, 7) to contribute to a genuine peace.
