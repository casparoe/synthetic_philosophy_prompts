answer: |-
  # Q&A Prep Sheet: Evidential Cooperation in Large Worlds (Two Cartographers)

  **Context:** 45 min talk + 20 min Q&A. Flyout in two weeks.
  **Goal:** Survive the committee without conceding the core novelty or the formal validity.

  ### Strategic Concessions (First 5 Minutes)
  *Do not wait to be cornered. Pre-emptively narrow the scope to show you know the boundaries.*
  1.  **Concede Small Worlds:** "In a fully specified small world where the state-space is fixed and known, CDT is the correct tool. My claim is not that EDT replaces CDT generally, but that 'small world' is an approximation that fails in specific structural uncertainty cases."
  2.  **Concede Common Priors:** "I am assuming a common prior over the candidate world-models. If Ada and Bob have radically divergent priors, the correlation vanishes. I am arguing about the rationality given shared structural uncertainty, not about how to align priors."
  3.  **Concede Causal Graphs:** "If you can draw a causal DAG with a common cause node that screens off the correlation, CDT wins. My claim is that 'Model Uncertainty' is not a causal node in that sense."

  ---

  ### The "Must Land" Reply
  **The Objection:** The Causal Decision Theorist (Interventionist).
  **The Stakes:** If this objection lands, your paper is just CDT with a bigger graph.
  **The Reply:** You must distinguish between a **causal common cause** (which CDT conditions on) and **logical/structural uncertainty** (which CDT treats as fixed).
  **The Script:** "You're right that if 'True Model' is a causal ancestor of both acts, CDT captures this. But in the Large World framework, the 'Model' isn't a causal event in the past; it's the logical space of possibilities *within which* causation is defined. CDT intervenes on acts *within* a model; it doesn't intervene on *which model is true*. My deliberation doesn't cause Bob to send; it selects the subset of world-models where 'Ada Sends' is true, and in those models, 'Bob Sends' is statistically more likely due to the shared structure. CDT cannot update on the model selection because it treats the model as the fixed background for the intervention."
  **Soft Spot:** If they insist that "Logical Space" is just a fancy name for "Hidden Variable," you risk verbal maneuvering. You need a formal distinction between *parameter uncertainty* and *structural uncertainty*.

  ---

  ### The 8 Objections (Ordered by Damage Potential)

  #### 1. The Causal Decision Theorist (Interventionist)
  **Vocab:** *DAG, d-separation, do-operator, screening off, Reichenbach’s Common Cause Principle.*
  **The Objection:** "Draw the graph. If $P(Bob|Ada) \neq P(Bob)$, Reichenbach says there's a common cause. If you put that cause in the graph as a node $M$, then $P(Bob|do(Ada), M) = P(Bob|M)$. Your 'Large World' is just a Small World with a hidden node $M$. CDT gets the right answer once the graph is complete. You haven't found a flaw in CDT; you've found a flaw in incomplete modelling."
  **The Answer:** (See "Must Land" Reply above). Emphasize that $M$ is not a variable *in* the graph but the graph *itself*. CDT takes the graph as given; EDT allows the act to update the probability of the graph.
  **Soft Spot:** Distinguishing "graph selection" from "node value" formally without sounding like you're changing the definition of causation.

  #### 2. The Senior Game Theorist
  **Vocab:** *Correlation device, Harsanyi types, Correlated Equilibrium, Common Prior Assumption.*
  **The Objection:** "This looks exactly like a Correlated Equilibrium with a Bayesian prior over types. You've smuggled in a correlation device—your 'world-model uncertainty'—and treated it as a norm of choice. If the correlation isn't generated by the game structure or communication, it's an assumption about the environment, not a decision theory. You're assuming the correlation you need to prove cooperation."
  **The Answer:** "A correlation device is an external signal. Here, the correlation comes from the agent's own reasoning process acting as evidence about the world's structure. It's endogenous to the deliberation, not an exogenous signal. In Harsanyi types, types are fixed. Here, the 'type' (which model holds) is inferred from the act itself."
  **Soft Spot:** The line between "endogenous inference" and "assuming a correlated prior" is thin. If the prior is independent, the correlation disappears.

  #### 3. The Historian of Decision Theory
  **Vocab:** *Savagean state-space, partition, small-world theorem, grand world.*
  **The Objection:** "Savage warned us about this. The 'Small World' is an approximation for convenience. If you're in a 'Grand World', you just haven't defined your states finely enough. This isn't 'Evidential Cooperation'; it's a violation of the Savage axiom that states must be independent of acts. You're hiding behind 'Large World' as a slogan when the small-world approximation gets inconvenient."
  **The Answer:** "Savage assumed the partition is fixed *before* decision. I'm arguing that in complex environments, the partition itself is the object of uncertainty. This isn't violating Savage; it's extending the framework to cases where the state-space isn't fully knowable ex ante. It's not inconvenience; it's ontological uncertainty."
  **Soft Spot:** Savage purists will view this as a category error. States *must* be independent of acts by definition.

  #### 4. The FDT / Program Equilibrium Junior
  **Vocab:** *Subjunctive dependence, logical counterfactuals, program equilibrium, functional decision theory.*
  **The Objection:** "This is just a special case of FDT with worse branding. If Ada and Bob reason similarly, their outputs are logically correlated. You're describing subjunctive dependence but calling it 'evidential' to avoid the computational cost of logical counterfactuals. Why use EDT when FDT captures this without the 'magic' of evidential correlations?"
  **The Answer:** "FDT requires logical dependence (same code/algorithm). My case explicitly rules that out (asymmetric payoffs, different agents). ECL works via probabilistic evidence over models, not logical identity. It's a weaker, more general condition than FDT. It works even if they aren't 'twins'."
  **Soft Spot:** If the correlation relies on "they are both rational agents," that *is* a form of logical similarity.

  #### 5. The Ratificationist (Formal Epistemologist)
  **Vocab:** *Ratifiability, deliberational equilibrium, fixed point, Skyrms, stability.*
  **The Objection:** "Is this equilibrium ratifiable? If Ada decides to send, she must believe Bob sends. But if she believes Bob sends, does she still prefer to send? If the correlation depends on her uncertainty, does the act of deciding collapse that uncertainty? I worry about fixed points that don't exist or aren't unique."
  **The Answer:** "The correlation is robust across the deliberation path. As long as the uncertainty over models persists until the moment of action, the conditional probabilities hold. It is ratifiable because the evidence (my act) remains valid evidence for the model even after I choose."
  **Soft Spot:** If the correlation vanishes once the decision is made (because the act is now fixed), the expected utility calculation shifts.

  #### 6. The Moral Philosopher
  **Vocab:** *Instrumental rationality, normativity, agency, constitutive aim.*
  **The Objection:** "Why is this a question about rationality rather than about what kind of agent you'd want to build? If cooperation yields higher utility, sure, build a cooperator. But why call it 'rational' for an existing agent to act on a correlation they can't causally influence? Isn't this just wishful thinking dressed as normativity?"
  **The Answer:** "Rationality is maximizing expected utility given available evidence. My act *is* evidence. Ignoring that evidence leads to lower expected utility. It's not about building a better agent; it's about the existing agent correctly using all information, including the information contained in their own choice."
  **Soft Spot:** "Wishful thinking" is a hard intuition to shake. CDT proponents argue you can't eat evidence.

  #### 7. The Scalability Objection (N-Agents)
  **Vocab:** *Asymptotic, dilution, signal-to-noise, measure zero.*
  **The Objection:** "This works for two cartographers. What about a 'Large World' with a million agents? My act is measure zero. The correlation washes out. If ECL requires me to be pivotal, it collapses in large populations. Why call it 'Large Worlds' if it only works in small groups?"
  **The Answer:** "It depends on the model space. If the models are 'All Cooperate' vs 'All Defect', my act is still diagnostic of the model, even with N agents. The correlation doesn't dilute if the structural uncertainty is about the *regime*, not the individual margins."
  **Soft Spot:** This requires very specific priors over world-models. In realistic scenarios, the "Regime" models are often less probable than "Mixed" models.

  #### 8. The "Tickle Defence" Revival (CDT/Eells)
  **Vocab:** *Tickle defence, Eells, screening off, causal relevance.*
  **The Objection:** "This is the Tickle Defence in a trenchcoat. Eells argued that once you condition on your own beliefs and desires (the 'tickle'), the correlation between act and outcome disappears. You've just moved the 'tickle' to 'Model Uncertainty'. Once you condition on your reasons for sending, the correlation with Bob vanishes."
  **The Answer:** "The Tickle Defence assumes the common cause is internal (beliefs/desires). Here the uncertainty is external (the world structure). Conditioning on my reasons doesn't screen off the world structure. The model is 'out there', not just in my head."
  **Soft Spot:** If the "world structure" is only accessible via your reasons, the distinction blurs.

  ---

  ### The "Old Debate" to Pre-empt (Slide 2)
  **The Debate:** **Reichenbach's Common Cause Principle vs. Evidential Correlation.**
  **Why:** This is the Eells/CDT critique of Newcomb's Problem recycled.
  **Pre-emption Script:** "On slide 2, I want to be clear: I am not positing a causal common cause. If there were a node $C$ in the past causing both Ada and Bob to send, CDT would cooperate. My claim is stronger: cooperation is rational *even without* a causal common cause, solely due to uncertainty over the logical structure of the world. I am not reviving the Newcomb debate; I am shifting the locus from 'predictors' to 'model uncertainty'."

  ---

  ### My Guess: The Question You Hope Nobody Asks
  **The Question:** **"Where does the correlated prior come from?"**
  **The Phrasing:** "You say Ada and Bob are uncertain about the world-model. You assume a prior over these models where $P(Ada Sends \& Bob Sends) > P(Ada Sends)P(Bob Sends)$. But why? If they are distinct agents with no common cause and no communication, what justifies a *correlated* prior over the world-models? If you assume an independent prior, your correlation vanishes. Aren't you just stipulating the correlation you need to get the result? Is 'Large World' just a license to assume correlated priors without justification?"
  **Why this kills:** It attacks the foundation. If the correlation in the prior is unjustified, the whole argument is Bayesian gerrymandering.
  **Defence:** "The correlation comes from the symmetry of the *situation*, not the agents. They face the same valley, the same costs, the same logical constraints. Rational agents facing identical structural problems should assign similar probabilities to structural models. It's not a causal correlation; it's a logical constraint on rational priors." (Be prepared for them to call this "Logical Similarity" which loops back to FDT).

  ### Final Advice
  *   **Board Work:** When the CDT person asks for the graph, **draw it.** But draw the "Model" node as a box *around* the graph, not a node *in* the graph. Visualize the hierarchy.
  *   **Tone:** Do not get defensive about EDT. Frame EDT as "Bayesian updating on all evidence, including agency." Frame CDT as "Bayesian updating on all evidence *except* agency."
  *   **The Flyout:** Remember, they are testing if you can handle pressure, not just if you're right. If you get stuck, say: "That's a great point. In the paper, I handle that by [X], but I'd love to think through your specific formulation of it after the talk."

  Good luck. The Cartographers case is vivid; keep them in the valley, don't let them drag you into abstract symbol space unless you're ready.
