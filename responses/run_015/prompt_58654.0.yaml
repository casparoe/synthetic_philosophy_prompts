answer: |-
  | Requirement | Why it matters | Test case | Status |
  | :--- | :--- | :--- | :--- |
  | **Baseline Invariance** | The bot cannot count a benefit as an improvement if it first manipulated the status quo to create the problem it is solving. | Case 3 (Helpful Threat) | **Non-negotiable** |
  | **Informed Preference Sovereignty** | Consent based on false beliefs or prediction errors does not count as a welfare gain; the bot must validate understanding. | Case 2 (Misjudged Trade) | **Non-negotiable** |
  | **Ex Post Safety or Full Compensation** | If an action carries risk, no individual may end up strictly worse off than the status quo unless they are fully compensated for the loss. | Case 1 (Rescheduling Luck) | **Non-negotiable** |
  | **Dynamic Consistency** | The bot's plan must not lead to a sequence of choices that guarantees a worse outcome (a money pump) relative to a simpler policy. | Extra (Money Pump) | **Non-negotiable** |
  | **Intervention Transparency** | Housemates must know the bot is acting and on what criteria, preventing covert manipulation of beliefs to satisfy Informed Preference. | Case 2 & Case 3 | Negotiable |
  | **Reversibility** | Actions should be undoable within a reasonable window to correct for errors in the bot's own modeling of preferences. | Extra (Irreversible Harm) | Negotiable |

  ### Joint Unsatisfiability Warning
  You cannot simultaneously satisfy **Ex Ante Efficiency**, **Ex Post Safety**, and **State-Independent Evaluation** under uncertainty. This is a known impossibility result in social choice theory (related to the Diamond-Harsanyi dilemma).
  *   **The Conflict:** In **Case 1**, if you demand *Ex Post Safety* (Non-negotiable above), you must forbid the rescheduling if there is *any* chance someone loses out, even if everyone ex ante preferred the gamble. This kills efficiency.
  *   **The Resolution:** To make the bot "safe," you must sacrifice **Ex Ante Efficiency** (making it Negotiable/Secondary). The bot should only proceed with risky improvements if it can guarantee **Compensation** (Row 3) to the unlucky party, effectively converting the Ex Post loss into an Ex Post gain. If compensation is impossible, the bot must default to "leave well alone."
