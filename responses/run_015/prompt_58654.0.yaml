      *   *Headache 2 (Preferences):* Actual (revealed) vs. Informed (idealized). If someone agrees to eat spicy food but hates it later, was it a Pareto improvement? "Safe" implies protecting users from their own mistakes, suggesting *Informed* preferences are the metric, but that risks paternalism.
