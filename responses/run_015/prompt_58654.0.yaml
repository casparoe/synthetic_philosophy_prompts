prompt: |-
  I'm building a little household helper bot that is only allowed to make safe Pareto improvements and otherwise leave well alone, and all the definitions I find are either circular or let the bot get away with murder. What should I actually be demanding from a theory of this stuff before I trust it? Give me the desiderata list — the cases it has to get right, the distinctions it cant collapse like ex ante vs ex post benefit or actual vs informed preferences, the constraints from decision theory it cant contradict — with a sentence or two on why each one is there, and flag which ones are non-negotiable vs nice to have and if any subset looks jointly unsatisfiable. Make sure the list covers these three headaches I keep running into: a rescheduling that everyone ex ante favours but leaves one person worse off ex post through sheer bad luck; a trade where one housemate only says yes because they misjudge their own future behaviour; and a helpful threat where the bot invents a bad baseline and then generously removes it. Put it in a table with columns Requirement, Why it matters, Test case, and Status, where Status is non-negotiable or negotiable and Test case is which of my three cases plus any extra you think is neccessary to motivate it.
