  The constructed case
  Consider Elias Thorne, a cartographer who designed the "Grid-7" coordinate system for a rapidly expanding metropolis fifty years ago. Today, GPS technology renders Grid-7 obsolete; it is less precise and significantly harder to maintain. Standard economic rationality dictates Thorne should advocate for a full migration to satellite positioning, minimizing future error and maintenance costs. However, Grid-7 is not merely a mapping tool; it is the foundational syntax for the city's property law, zoning regulations, and emergency response protocols. Every deed, water right, and structural load-bearing certificate is encoded in Grid-7's specific logic. To abandon Grid-7 is not to switch tools but to invalidate the semantic infrastructure of the city's ownership. Thorne's refusal to migrate is not based on the resources already spent (financial sunk costs), but on the "ontological commitment cost." Abandoning the system would dissolve the coherence of the legal-planning architecture he instantiated. The cost here is the collapse of meaning for thousands of existing commitments that rely on Grid-7's continuity. Economic reasoning fails because it treats the system as an instrumental tool separable from its outcomes, whereas Thorne understands the system as constitutive of the reality it measures. Furthermore, Thorne's own capacity to deliberate on urban solutions is calibrated to Grid-7. His expertise is not transferable; his rational agency is embedded in the system's logic. To switch is to become a different kind of agent, rendering his past deliberations nonsense. The sunk cost is the structural integrity of the city's social contract and his own professional identity, which cannot be transferred to a new syntax without catastrophic loss of fidelity. His future planning relies on the stability of past definitions. If the past definitions dissolve, his future plans lack a substrate.

  The category-error objection
  The critic argues that Thorne confuses instrumental rationality with identity-preservation. Instrumental rationality demands selecting the most efficient means to a given end, regardless of the agent's history. By prioritizing the preservation of Grid-7, Thorne treats his own psychological continuity as a primary good, superseding the objective efficiency of the mapping system. This is a category error: the rationality of a plan should be judged by its future outcomes, not its past origins. To claim that abandoning the system undermines his identity is to privilege the agent's ego over the welfare of the city. The "cost" he perceives is merely emotional resistance to change, mislabeled as philosophical necessity. If the goal is accurate mapping, Grid-7 fails. If the goal is Thorne's self-coherence, that is a private preference, not a public rationality. Honoring the sunk cost here is simply stubbornness disguised as ontological depth, violating the principle that past investments should never dictate future actions unless they yield future returns.

  The coherence defense
  The defense posits that rational agency requires a stable normative framework to function. Thorne's capacity to plan is not independent of Grid-7; it is constituted by it. Abandoning the system does not recover resources; it actively destroys the metric by which Thorne evaluates success. If the foundational syntax changes, the value of his past judgments collapses, creating a deliberative vacuum. Without a stable connection between past commitments and future actions, an agent cannot maintain long-term projects, rendering rational planning impossible. Therefore, continuing Grid-7 is not about honoring the past for its own sake, but about preserving the conditions necessary for future rationality. The "ontological commitment cost" is the loss of deliberative stability. If Thorne switches systems, he invalidates the premises of his own expertise, making him less capable of contributing meaningfully to the city's future. Continuation is rational because it maintains the coherence of the planning architecture itself. To abandon the project is to dismantle the very structure that allows for coherent decision-making. The cost of switching is the fragmentation of the agent's practical identity, which serves as the engine for all future deliberation. Thus, honoring the commitment is a prerequisite for maintaining agency, not a bias against efficiency. This fragmentation leads to a paralysis where no new project can be started because the ground beneath it shifts. The agent loses the traction required to push against reality.

  The collapse boundary
  The defense fails when the commitment imposes irreversible harm on third parties that outweighs the agent's deliberative stability. If Grid-7's obsolescence leads to preventable disasters—such as emergency services failing to locate addresses due to coordinate drift—the ontological cost is superseded by moral necessity. The boundary is crossed when the preservation of the planning architecture actively destroys the welfare of those dependent on it. Additionally, if the system becomes literally impossible to maintain, regardless of expertise, the commitment collapses into fantasy. Rationality requires a viable substrate; when the material reality no longer supports the conceptual framework, the coherence defense dissolves. At this point, honoring the sunk cost becomes a genuine fallacy, prioritizing abstract identity over concrete survival. The agent must then reconstruct their identity around a new framework that accommodates reality, rather than forcing reality to accommodate a broken self-conception.
