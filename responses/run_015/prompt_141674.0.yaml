      *   *(2) vs. (4):* (2) requires the organization to *explain* transitions. (4) allows spatial scatter. If the scatter is too wide or disconnected, does the organization still explain transitions? (4) says "none in contact." This is the biggest red flag.
      *   *(3) vs. (2) (The Archive Problem):* (3) distinguishes the Centennial Mind from the Archive. The Archive has states but no causal commerce. The Centennial Mind has states + causal commerce *at transition points*. But if the gaps are centuries long, is the causal link robust enough to satisfy (2)?
