answer: |-
  **MEMORANDUM**

  **TO:** The Board of Directors, Philosophy of Science Journal Association
  **FROM:** Appeals Panel Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Suspension of Senior Editor [Name Redacted]

  ### **1. Executive Recommendation**

  The Appeals Panel recommends **overturning the suspension**, conditional upon the immediate **formalization of the pre-submission review practice** under a new "Collaborative Pre-Review" framework.

  We advise against simply upholding the suspension, as this ignores a functional normative shift within the measurement-theory subfield. However, we also advise against a simple overturn without conditions, as this undermines the Association's authority. The solution is to assimilate the emerging convention into our ethical code with specific safeguards.

  ### **2. Analysis of the Lewisian Defense**

  The defense rests on David Lewis's account of *Convention*. They argue the private Discord server is not merely a rule violation, but a stable equilibrium that solves a recurrent coordination problem: the scarcity of qualified reviewers in niche measurement theory.

  We take this argument seriously. In Lewisian terms, a convention arises when agents have a conditional preference to conform if others do, grounded in common knowledge. The measurement-theory circle has reached this equilibrium. Reviewers expect drafts on the Discord; authors expect feedback there before formal submission. To punish the editor for facilitating this is to punish a coordinator for solving a collective action problem that the official blind-review process currently fails to address.

  The official blind-review code is itself a convention, not a law of nature. It was adopted to maximize impartiality. However, if a competing convention (the Discord model) maximizes *epistemic efficiency* without demonstrable harm to impartiality, rigid adherence to the old convention becomes dogmatic. We are witnessing a clash between two equilibria: one of procedural blindness, and one of collaborative triangulation.

  ### **3. The Strongest Counter-Argument: The Risk of Codification**

  The most compelling argument against our recommendation is that **codification kills utility.**

  The Discord server works *because* it is informal, private, and spontaneous. It relies on high-trust social capital. If the Association formalizes this into a "Pre-Review Track," we risk introducing bureaucratic friction (logging requirements, disclosure forms, compliance checks) that will drive the practice underground again. Furthermore, the "clubby" nature of the server allows for candid criticism that might be sanitized in an official channel. By bringing it into the light, we may sterilize the very epistemic benefit the editor claims to protect.

  We acknowledge this risk. If we regulate the *conversation*, we lose the *coordination*. Therefore, our formalization proposal focuses on **governance of access, not content.**

  ### **4. Proposed Framework: "Sanctioned Private Consultation"**

  To preserve the spontaneity while ensuring ethical guardrails, we propose the following conditions for formalization:

  1.  **Opt-In Transparency:** Authors must explicitly consent to pre-submission discussion. They cannot be submitted to the Discord without their knowledge (protecting against idea appropriation).
  2.  **Reviewer Recusal:** Any reviewer who engages substantively on the Discord regarding a specific paper must recuse themselves from the formal blind review of that same paper to prevent bias contamination.
  3.  **Auditability, Not Surveillance:** The Editor must maintain a log of participants and paper IDs for the Board, but the Board will not read chat logs unless a specific misconduct complaint is filed. This preserves privacy while ensuring accountability.
  4.  **Inclusivity Clause:** The "private" circle cannot be closed indefinitely. There must be a mechanism for external scholars to request access, preventing the convention from becoming an exclusionary cartel.

  ### **5. Implementation Timeline**

  *   **Friday, Oct 27 (Immediate):** Board votes to overturn suspension based on this memo. Editor reinstated pending agreement to draft the "Sanctioned Private Consultation" policy.
  *   **Nov 15:** Editor submits draft policy to the Ethics Committee.
  *   **Dec 1:** Ethics Committee approves policy with revisions.
  *   **Jan 1:** New policy goes live. All past participants must sign a retroactive compliance form.
  *   **June 1 (Review):** Board reviews the first six months of data. If bias complaints exceed baseline, the program is suspended.

  ### **6. Conclusion**

  Upholding the suspension would affirm that rules are static, regardless of their functional utility. Overturning it without conditions would affirm that rules are optional for senior editors. Formalizing the practice acknowledges that scientific norms evolve.

  We are not endorsing the Discord model as superior to blind review universally. We are acknowledging that in high-specialization niches, the coordination benefits of the Lewisian convention currently outweigh the risks of non-blindness, provided we install safeguards against exclusion and bias. We should steer this equilibrium, not break it.

  **Recommendation:** Overturn Suspension / Formalize Practice.
