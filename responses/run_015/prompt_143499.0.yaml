  # The Ambiguity Sorting Instrument

  ## Part I: The Diagnostic Tree

  **Instructions:** Proceed through the questions in order. Follow the branching instructions based on your intuitive response to the case presented. Do not consult formal definitions; answer based on your immediate judgment of the scenario.

  **Node 1: The Standard Comparison**
  *Case:* Urn K contains 50 Red and 50 Black balls. Urn U contains 100 balls, Red/Black ratio unknown. You win $100 if you draw Red. You must choose one urn to draw from.
  *   **A:** You are indifferent; the probability of Red is 50% in both. → **Go to Node 2.**
  *   **B:** You strictly prefer Urn K. → **Go to Node 3.**

  **Node 2: The Isolation Check**
  *Case:* Urn K does not exist. You are presented only with Urn U (100 balls, ratio unknown). You must bet on Red or Black to win $100.
  *   **A:** You are indifferent between Red and Black; neither is more rational. → **Leaf 1: Plain Expected-Utility.**
  *   **B:** You feel a preference (e.g., you suspect the setup is rigged, or you simply dislike the lack of info), despite no comparison. → **Leaf 2: Deflationary/Isolation Artifact** *(Note: This leaf captures those who claim indifference in comparison but feel aversion in isolation, suggesting the "artifact" view is false for them, or they are inconsistent.)*
      *   *Correction for Logic:* If they chose Indifferent in Node 1, they cannot prefer in Node 2 without inconsistency.
      *   *Revised Node 2:* **The Deflationary Claim.** *Case:* Recall Node 1. If you had never seen Urn K, would your preference for Urn K have existed?
      *   **A:** No, I would have been indifferent. → **Leaf 1: Plain Expected-Utility.**
      *   **B:** Yes, I would still avoid Urn U even alone. → **Leaf 2: Deflationary/Isolation Artifact** *(Label: Unnamed - Comparison-Dependent Aversion)*.

  **Node 3: The Source Intent**
  *Case:* Urn U was filled by a Host who wants you to lose (Adversary) vs. Urn U was filled by a Random Machine (dice roll determined counts).
  *   **A:** You are averse to Urn U only when filled by the Adversary. You are indifferent when filled by the Machine. → **Leaf 3: Distrust/Strategic Reasoning.**
  *   **B:** You are averse to Urn U in both cases. → **Go to Node 4.**

  **Node 4: The Repeated Play**
  *Case:* You will draw from Urn U 100 times with replacement. You see the result of each draw before the next bet.
  *   **A:** Your aversion vanishes; you treat it as a standard learning problem. → **Leaf 4: Heuristic/Statistical Robustness.**
  *   **B:** Your aversion persists, even with learning opportunities. → **Go to Node 5.**

  **Node 5: The Resolution of Uncertainty** [*Standard*]
  *Case:* You can pay $5 to learn the exact composition of Urn U.
  *Scenario A:* Learn before placing your bet.
  *Scenario B:* Learn after placing your bet, but before the ball is drawn.
  *   **A:** You value the information equally in both scenarios (instrumental value only). → **Go to Node 6.**
  *   **B:** You value the information significantly more in Scenario A (you want to know *while* betting). → **Leaf 5: Preference for Early Resolution.**

  **Node 6: Gains vs. Losses**
  *Case:*
  *Scenario A:* Bet to Win $100 on Red.
  *Scenario B:* Bet to Avoid Losing $100 on Black (you start with $100, lose it if Black).
  *   **A:** Your ambiguity aversion is symmetric in both frames. → **Go to Node 7.**
  *   **B:** You are significantly more averse in the Loss frame than the Gain frame. → **Leaf 6: Unnamed (Loss-Weighted Ambiguity).**

  **Node 7: Correlation Ambiguity** [*Invented Case*]
  *Case:* Two Unknown Urns (U1, U2). Ratios fixed but unknown.
  *Option A:* Bet on "Both Red".
  *Option B:* Bet on "One Red, One Black".
  *   **A:** You are indifferent; correlation uncertainty doesn't bother you more than marginal uncertainty. → **Go to Node 8.**
  *   **B:** You are strongly averse to Option A (or B) specifically because the correlation is unknown. → **Leaf 7: Unnamed (Correlation Averse).**

  **Node 8: The Group Choice** [*Invented Case*]
  *Case:* Three agents. Agent 1 thinks P(Red) is 0.3–0.5. Agent 2 thinks 0.4–0.6. Agent 3 thinks 0.5–0.7. You must make one joint bet for the group.
  *   **A:** You choose based on the intersection/confidence of the overlap (0.4–0.5). → **Leaf 8: Confidence-Weighted.**
  *   **B:** You choose based on the union or average of the ranges. → **Go to Node 9.**

  **Node 9: The Weighting of Priors**
  *Case:* You accept the set of priors is 0.3 to 0.7.
  *   **A:** You act as if the probability is exactly 0.3 (the worst case). → **Leaf 9: Worst-Case (MaxMin).**
  *   **B:** You act as if the probability is a weighted average (e.g., 0.4), weighting the worst more than the best but not ignoring the best. → **Go to Node 10.**

  **Node 10: Source Ambiguity** [*Invented Case*]
  *Case:* You know the ratio is 0.3–0.7.
  *Scenario A:* The range 0.3–0.7 was given by a precise measurement.
  *Scenario B:* The range 0.3–0.7 is itself an estimate (the "true" range might be 0.2–0.8).
  *   **A:** You treat both scenarios identically. → **Leaf 10: Unnamed (Alpha-MaxMin/Linear Mix).**
  *   **B:** You are more averse in Scenario B (you discount the priors themselves). → **Leaf 11: Smooth Ambiguity (Second-Order).**

  ***

  ## Part II: Leaf Definitions

  1.  **Plain Expected-Utility:** Ambiguity is irrelevant; only the subjective expected probability matters.
  2.  **Unnamed (Comparison-Dependent Aversion):** Aversion exists only when a known benchmark is present; isolated ambiguity is neutral.
  3.  **Distrust/Strategic Reasoning:** Aversion is actually rational distrust of an adversary; neutral when the source is stake-free.
  4.  **Heuristic/Statistical Robustness:** Aversion is a rule-of-thumb for one-shot decisions; vanishes when statistical learning is possible.
  5.  **Preference for Early Resolution:** Aversion is driven by a desire to resolve uncertainty before committing, not by the probability itself.
  6.  **Unnamed (Loss-Weighted Ambiguity):** Aversion is asymmetric; ambiguity in losses is weighted heavier than ambiguity in gains.
  7.  **Unnamed (Correlation Averse):** Aversion targets unknown dependencies between events, not just marginal probabilities.
  8.  **Confidence-Weighted:** Decisions weight priors by the confidence or overlap in the source information (group context).
  9.  **Worst-Case (MaxMin):** Only the lowest probability in the set of priors determines the choice.
  10. **Unnamed (Alpha-MaxMin/Linear Mix):** A fixed weight is applied to the worst-case and best-case priors (e.g., 70% worst, 30% best).
  11. **Smooth Ambiguity (Second-Order):** Priors are treated as random variables themselves and transformed by a concave function (ambiguity about ambiguity).

  ***

  ## Part III: Structural Analysis

  ### (i) Indistinguishable Leaves
  The following pairs are theoretically or practically inseparable without additional nodes not included in this tree:

  *   **Worst-Case (MaxMin) vs. Confidence-Weighted:** On a single-agent, single-bet case (Nodes 1–7), these produce identical choices. They only separate at Node 8 (Group Choice). If Node 8 is skipped or answered ambiguously, these leaves collapse.
      *   *Separating Node:* A "Confidence Elicitation" question asking the user to price a bet where the *range* of priors shrinks but the *worst-case* remains identical. MaxMin is indifferent; Confidence-Weighted pays to shrink the range.
      *   *Intuitiveness:* Low. Distinguishing between "I only care about the worst" and "I care about the worst because I have no confidence in the rest" is semantically difficult for respondents.
  *   **Distrust/Strategic vs. Genuine Ambiguity Aversion:** On the Standard Ellsberg case (Node 1), these are identical. They separate only at Node 3 (Source Intent).
      *   *Separating Node:* A "Beneficent Host" case (Host wants you to *win*). Distrust predicts seeking ambiguity; Genuine Aversion predicts avoiding it.
      *   *Intuitiveness:* High. Most engineers can intuitively distinguish between "rigged against me" and "rigged for me."
  *   **Alpha-MaxMin vs. Smooth Ambiguity:** These separate only at Node 10 (Source Ambiguity). Without Node 10, Smooth Ambiguity often mimics Alpha-MaxMin on simple bets.
      *   *Separating Node:* Node 10 is sufficient in principle, but in practice, respondents struggle to distinguish "uncertainty about the range" from "uncertainty within the range."
      *   *Intuitiveness:* Low. This requires second-order probabilistic intuition that is rarely stable.

  ### (ii) Permitted but Unoccupied Answer Combinations
  The tree permits the following patterns which are likely empty in practice:

  *   **Averse in Repeated Play (Node 4) but Indifferent in One-Shot (Node 1):** *Status: Incoherent.* Ambiguity aversion is typically justified by the inability to learn or the severity of a single failure. Averting ambiguity only when you *can* learn contradicts the learning rationale.
  *   **Prefer Early Resolution (Node 5) but Indifferent to Source Intent (Node 3):** *Status: Unattractive.* If you care about resolving uncertainty early, you usually care *why* the uncertainty exists (adversary vs. random). This combination suggests a fetish for timing divorced from risk source.
  *   **Confidence-Weighted (Node 8) but MaxMin (Node 9):** *Status: Incoherent.* If you weight by confidence/overlap in a group setting, you cannot logically ignore all but the worst prior in an individual setting (assuming consistent priors).
  *   **Loss-Weighted (Node 6) but Symmetric in Group Choice (Node 8):** *Status: Unexplored.* It is unclear if ambiguity aversion's asymmetry in gains/losses aggregates linearly in group decisions. This cell is theoretically possible but empirically unmapped.

  ### (iii) Internally Unstable Answer Patterns
  The following patterns indicate dynamic inconsistency or instrument failure rather than a stable position:

  *   **The "Free Info" Reversal:** Respondent chooses **Leaf 5 (Preference for Early Resolution)** (values info before bet) but also chooses **Plain Expected-Utility** at Node 1.
      *   *Diagnosis:* If you are EU, information has only instrumental value (Node 5A). If you value it intrinsically before the bet (Node 5B), you are not EU. This pattern indicates the respondent does not understand the value of information or is answering inconsistently.
      *   *Instrument Status:* Broken for this user. They should be excluded or re-interviewed.
  *   **The "Deflationary" Contradiction:** Respondent chooses **Leaf 2 (Comparison-Dependent)** at Node 2 (says aversion vanishes in isolation) but chooses **Distrust** at Node 3 (says aversion persists against Adversary even if isolated).
      *   *Diagnosis:* Distrust implies a reason to avoid the urn in isolation (the adversary). Deflationary implies no reason to avoid in isolation. Holding both suggests the respondent conflates "comparison" with "adversary."
      *   *Instrument Status:* Position is unstable. The tree forces a choice between "It's the comparison" and "It's the adversary."
  *   **The "Correlation" Isolation:** Respondent chooses **Leaf 7 (Correlation Averse)** but **Plain Expected-Utility** on Node 1 (Marginal).
      *   *Diagnosis:* It is possible to be neutral on marginal ambiguity but averse to correlation ambiguity, but rare. If they claim EU on marginals, they should mathematically be EU on correlations unless they explicitly model dependence uncertainty.
      *   *Instrument Status:* Plausible but rare position. Treat as valid if they can articulate dependence uncertainty.

  ***

  ## Note on Invented Cases
  The following nodes in this diagnostic are **not canonical** literature standards and should not be cited as such to your group:
  1.  **Node 7 (Correlation Ambiguity):** While ambiguity in correlation is discussed in finance, the specific "Two Unknown Urns" framing for diagnostic sorting is an invention for this instrument.
  2.  **Node 8 (Group Choice):** The specific "Overlapping Priors Joint Decision" case is an invention for this instrument to probe confidence weighting.
  3.  **Node 10 (Source Ambiguity):** The distinction between "uncertain range" and "uncertain estimate of the range" is an invention for this instrument to probe second-order smoothness.

  The remaining nodes (Standard Ellsberg, Isolation, Source Intent, Repeated Play, Resolution of Uncertainty, Gains/Losses) are standard variations found in decision theory literature.
