  ***

  ### Exam Question: The Green-Transition Lock-In Paradox

  **Context:**
  Consider a government that binds itself to a strictly rising carbon-price path to incentivize long-term green investment. At time *t1*, this commitment is optimal. At *t2*, a breakthrough in direct-air-capture (DAC) technology drastically lowers the marginal cost of neutrality. Industry groups immediately lobby to revise the trajectory downward, arguing the tax is now inefficient. The state lowers the tax, saving industry costs but damaging its credibility. At *t3*, lacking investment confidence, the state re-commits to higher prices to restore trust.

  **Prompt:**
  1.  Frame this scenario as a diachronic money pump. Explain why this represents a structural failure of diachronic consistency rather than simple political hypocrisy.
  2.  Compare this mechanism to the classic Strotz-style money pump. How does the shift from individual time to institutional time alter the dynamics of the pump?
  3.  Evaluate whether a pre-commitment device, such as an independent carbon board, solves the inconsistency or merely moves the pump one level up.

  ***

  ### Model Answer

  The green-transition lock-in paradox functions as a diachronic money pump because the state exhibits inconsistent preferences over time that allow external actors to extract value without providing compensating benefits. At *t1*, the government binds itself to a rising carbon-price path to signal long-term commitment, incentivizing green capital investment. At *t2*, a direct-air-capture (DAC) breakthrough drastically lowers the marginal cost of neutrality. Industry lobbyists immediately argue the tax is now redundant and economically damaging. The state revises the path downward to relieve immediate economic pressure. However, this revision damages credibility, raising risk premiums for future green investment. At *t3*, to restore confidence, the state re-commits to higher prices. This cycle allows industry to pay lobbying costs that are strictly less than the tax savings gained during the revision periods, while the state pays a cumulative credibility premium. The state is 'pumped' because it pays to change policy, then pays to change it back, ending up in the original position but poorer in political capital and economic efficiency.

  This is not mere hypocrisy; it is a structural failure of diachronic consistency. Hypocrisy implies a moral failing or deceit, suggesting the agent knew the better path and chose the worse. Here, the state is rationally responding to updated information (DAC costs) and political constraints (lobbying pressure) at each time slice. The failure lies in the lack of a unified utility function across time. The 'state' at *t1* values credibility most; the 'state' at *t2* values economic relief most. Without a binding mechanism, these temporal selves contradict each other, violating the transitivity required for rational choice. The pump exploits the gap between the speed of technological change and the sluggishness of institutional trust.

  Comparing this to Strotz's classic money pump reveals a critical shift from intrapersonal to institutional time. Strotz described an individual who plans to save but consumes when temptation arrives due to hyperbolic discounting. The individual is both the planner and the doer, suffering from psychological weakness. In the climate case, the 'agent' is a composite institution. The *t1* government (perhaps one party) binds the *t2* government (possibly another party or same party under pressure). The pump works across electoral cycles and bureaucratic tenures. Unlike Strotz's individual, the state cannot simply 'tie itself to the mast' without legislative action, which is reversible by definition. The friction isn't psychological weakness but institutional turnover and information updates. The state acts as a 'naive' agent in Strotz's terms, believing future selves will honor current plans despite changing incentives.

  Does an independent carbon board solve this? It mitigates the pump but likely moves it up one level rather than sealing it. A board with fixed terms insulates policy from electoral cycles, acting as a pre-commitment device. However, the board itself faces a consistency trap. If DAC makes targets obsolete, the board must choose between rigidity (risking irrelevance) or flexibility (suffering credibility loss). Furthermore, the government retains the power to dissolve or defund the board. If industry lobbying makes the board politically costly, the state may pay to bypass the board, then later pay to reinstate it to regain market trust. The pump persists because the ultimate sovereign (the electorate/legislature) retains dynamic inconsistency. Pre-commitment only works if the commitment is irreversible, which is incompatible with democratic sovereignty. Thus, the board changes the locus of the pump but does not eliminate the structural vulnerability to cyclic preferences. Rational choice theory assumes stable preferences; climate policy exists in a landscape where preferences must evolve, creating an inherent tension that no simple institutional fix can fully resolve without costing democratic accountability.

  ***

  ### Marking Scheme (Out of 20)

  **1. Diachronic Money Pump Mechanism (5 marks)**
  *   **A (5):** Clearly identifies the cycle (Commit → DAC Shock → Revision → Credibility Loss → Re-commit). Explicitly notes value extraction by industry vs. credibility loss by state.
  *   **B (3-4):** Identifies the cycle but treats it as simple policy flip-flopping without explaining the 'pump' aspect (value extraction).
  *   **C (0-2):** Fails to identify the cyclic nature or confuses it with standard cost-benefit analysis.

  **2. Structural Failure vs. Hypocrisy (5 marks)**
  *   **A (5):** Explains that preferences are rational at each time slice but inconsistent across time. Distinguishes structural inconsistency from moral failing.
  *   **B (3-4):** Argues it is hypocrisy or political weakness rather than a rationality failure.
  *   **C (0-2):** No distinction made.

  **3. Strotz Comparison & Institutional Time (5 marks)**
  *   **A (5):** Contrasts individual intrapersonal conflict with institutional inter-temporal conflict. Notes the reversibility of legislation vs. personal commitment.
  *   **B (3-4):** Summarizes Strotz correctly but fails to apply the 'institutional time' distinction deeply.
  *   **C (0-2):** Incorrect summary of Strotz or no comparison made.

  **4. Pre-commitment & Carbon Board Evaluation (5 marks)**
  *   **A (5):** Argues the board moves the pump up a level (sovereign can still override). Notes the board's own consistency trap.
  *   **B (3-4):** Assumes the board solves the problem completely or dismisses it without nuance.
  *   **C (0-2):** Ignores the board question.

  *Note for graders: Watch out for students who just summarize the prompt. An A answer must recognize that the pump works across institutional time rather than individual time, and see why the board might itself be pumped.*
