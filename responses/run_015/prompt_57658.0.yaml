answer: |-
  **Preamble: Mapping the Referents**
  Prior to drafting this statement, we enumerated candidate referents for "origin" to test the suspicion that stalemate arises from equivocation. Candidates included: (1) the specific gamete pair ($s, e$); (2) the zygote $z$; (3) the fertilization event $f$; (4) the genomic sequence $g$; (5) the constituent matter $m$. The shape of the disagreement shifts radically depending on selection. If origin = $g$, clones share origins (threatening NOO). If origin = $m$, Sorites pressures intensify. If origin = $f$, asexual reproduction becomes a boundary case. The following document assumes this taxonomy to isolate substantive disagreement from referential drift.

  ***

  **JOINT STATEMENT ON IDENTITY AND ORIGIN**

  **1. Agreed Claims**
  The following claims are accepted by both the Essentialist (defending Necessity of Origin) and the Contingentist (denying or restricting it). Each claim is robust enough to bear weight in argument, not merely a platitude.

  1.  **Persistence Conditions:** Organisms persist through gradual material turnover; identity over time is not constituted by strict mereological constancy.
  2.  **Modal Status:** The Necessity of Origin (NOO) thesis is a claim about *de re* metaphysical necessity, not nomological possibility or epistemic certainty.
  3.  **Biological Facts:** Twinning, cloning (somatic-cell nuclear transfer), and mitochondrial donation are biologically distinct processes from standard sexual fertilization, involving different causal structures regarding genetic contribution.
  4.  **Theory-Ladenness:** Intuitions regarding transworld identity cases are not raw data; they are influenced by prior commitments regarding haecceitism and counterpart theory.
  5.  **Concession on Reduction:** Both sides concede that arguments relying solely on "linguistic intuition" without metaphysical grounding are not decisive. The Essentialist concedes NOO cannot be derived purely from the meaning of proper names; the Contingentist concedes that rejecting NOO requires an alternative account of individuation.

  **2. Disagreements Table**

  | Topic | Essentialist Formulation | Contingentist Formulation | Judgment |
  | :--- | :--- | :--- | :--- |
  | **The Unit of Origin** | Origin is the specific material constitution (gametes/zygote) from which the organism developed. | Origin is the broader causal-historical process of coming-to-be, which may be multiply realizable. | **Substantive** |
  | **Cloning (Dolly)** | A clone has a distinct origin from its donor because the *event* of creation (nuclear transfer vs. fertilization) differs. | A clone shares the relevant origin (genome) with the donor, or "origin" is irrelevant to identity in asexual cases. | **Verbal** (depends on 'origin' definition) |
  | **Modal Strength** | If $x$ originates from $O$, $x$ could not have originated from $O^*$ (where $O^* \neq O$). | $x$ could have originated from $O^*$ provided $O^*$ yields the same biological continuity. | **Substantive** |
  | **Vagueness** | The origin relation is sharp; there is a precise boundary between the origin that yields $x$ and one that does not. | The origin relation admits of vagueness; identity may be indeterminate across close possible worlds. | **Substantive** |

  **3. The Cruxes**
  Progress requires settling specific sub-questions rather than restating the general thesis.

  1.  **Matter vs. History:** Does the individuation of an organism track the specific matter it began from, or the causal history of its development? If the matter changes but the history remains (e.g., swapped molecules in the zygote), does identity hold?
  2.  **Scope of NOO:** Does the Necessity of Origin thesis apply universally to all organisms, or is it restricted to sexually reproducing organisms? If restricted, what metaphysical principle marks the boundary?
  3.  **Tolerance for Vagueness:** Is the Essentialist committed to a sharp boundary in material constitution (e.g., a specific sperm molecule), or can NOO accommodate vagueness without collapsing into contingency?

  **4. Concrete Cases and Predictions**
  For each crux, we identify a case, record predictions, and specify concession criteria.

  *   **Case A: Somatic-Cell Nuclear Transfer (Dolly)**
      *   *Description:* An adult somatic nucleus is placed into an enucleated egg. The resulting organism is genetically identical to the nucleus donor.
      *   *Essentialist Prediction:* Dolly does *not* share an origin with the donor. Origin tracks the *zygotic event* or the *egg cytoplasm*, not just nuclear DNA.
      *   *Contingentist Prediction:* Dolly shares the relevant origin (genetic code) or the case shows origin does not fix identity.
      *   *Concession Criteria:* If the Essentialist admits Dolly shares an origin with the donor, they must explain how NOO survives (i.e., is origin necessary if two distinct organisms share it?). If the Contingentist admits they have distinct origins, they must specify what non-genetic feature fixes identity.

  *   **Case B: Mitochondrial Donation**
      *   *Description:* A child is produced using nuclear DNA from Parents A and B, but mitochondrial DNA from Donor C.
      *   *Essentialist Prediction:* The child's origin is indexed to the *nuclear* gametes. The mitochondrial donor is a causal condition but not part of the "origin" in the sense required for identity.
      *   *Contingentist Prediction:* The case reveals "origin" is fragmented. There is no single answer; the thesis is tacitly indexed to standard technology and breaks under intervention.
      *   *Concession Criteria:* If the Essentialist claims the child could have come from Donor C's egg alone, NOO is falsified. If they claim the origin is strictly the nuclear pair, they must explain why mitochondrial matter (essential for life) is excluded from the "origin" definition.

  *   **Case C: The Sorites of Sperm**
      *   *Description:* Consider the actual sperm $s$. Consider $s'$, which differs from $s$ by a single molecule.
      *   *Essentialist Prediction:* There is a sharp cut-off. $x$ comes from $s$, not $s'$. (Or: $x$ comes from a range, but the range has precise boundaries).
      *   *Contingentist Prediction:* There is no sharp cut-off. Identity is vague across the series from $s$ to $s_{final}$.
      *   *Concession Criteria:* If the Essentialist accepts sharp boundaries, they must defend the metaphysical coherence of such precision in biological matter. If they accept vagueness, they must explain how "necessity" applies to a vague relation without trivializing the thesis.

  **5. Closing Diagnosis**
  As the convener and specialist reviewing this impasse, I offer the following diagnosis regarding the verbal versus substantive nature of the dispute.

  A significant portion of the group's stalemate is **merely verbal**, specifically regarding the labeling of biological thresholds. The Essentialist often uses "origin" to mean *the minimal sufficient causal basis for this specific organism*, while the Contingentist hears *the biological materials present at $t_0$*. When discussing Dolly, if the Essentialist defines origin as "the specific fertilization-like event," NOO is trivially true but biologically narrow. If the Contingentist defines origin as "genetic source," NOO is falsified but the definition ignores cytoplasmic contributions. This is a verbal dispute over the extension of the term "origin."

  However, the dispute regarding **modal strength and vagueness** is **substantive**. The Essentialist is committed to a form of haecceitism where *this* organism is tied to *this* history in a way that excludes close counterparts. The Contingentist denies that metaphysical necessity attaches to historical accidents. No amount of terminological stipulation can resolve whether reality itself imposes sharp boundaries on identity (as required by the Essentialist's response to the Sorites) or whether identity is a vague relation.

  The group should cease arguing about whether clones "share origins" (which is a definitional choice) and focus on whether the *modal intuition* that "I could not have been born of different parents" survives when "parents" and "born" are rigorously defined by the biology of mitochondrial donation and cloning. If the intuition holds only under a description that excludes actual biological possibilities, the thesis is theoretically idle. If it holds despite biological variation, the Essentialist owes an account of how matter can be both essential and vague.

  ***
