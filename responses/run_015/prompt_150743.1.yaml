  The critical failure lies in Step (4), which asserts that guilt's dischargeability necessarily converts wrongdoing into a calculable price. This step looked fine because it borrows plausibility from legal economics, where fines are designed to be costs that agents weigh against benefits, making the analogy between penalty and price seem intuitive. However, it relies on a **false or unsupported empirical claim** about moral psychology: it assumes agents can accurately anticipate and discount the pain of guilt ex ante, treating deep moral emotions as transactional fees rather than unpredictable psychological states that often resist calculation. By repairing this step to acknowledge that dischargeability does not entail pricing, the argument loses its normative force against guilt.

  Consequently, the argument still establishes the descriptive distinctions outlined in (1) and (2)—that guilt focuses on acts and shame on agents—and preserves the insight in (6) that shame is not merely heteronomous. It confirms that guilt offers reintegration while shame imposes permanent stigma. However, without the pricing mechanism in (4), Step (5) no longer follows, as guilt's capacity for closure is not inherently a moral weakness but potentially a functional necessity for agency. The argument thus collapses into a description of tension rather than a prescription for replacement.

  Finally, Step (8) assumes a level of cultural engineering that is not supported by the premises. Even granting the displacement model in (7), moving from "cultures choose" to "cultures should choose shame" requires a **missing premise** regarding the social viability of shame-based societies. The repaired argument leaves us with the conclusion that cultures face a trade-off between reintegration and permanent accountability, but it cannot justify eliminating guilt without risking the collapse of moral agency itself.

