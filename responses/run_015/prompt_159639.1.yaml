  ## Part 4: Limitations & Scoring Key

  ### Indistinguishable Leaves
  *   **Pragmatist vs. Quietist:** Your answers to the cases above will likely be identical for these two positions. They differ only on the meta-question of whether the word "real" should be used at all. No offline case listed here separates them; you would need a question about *language use* rather than *system behavior*.
  *   **Dennettian vs. Interventionist:** These often overlap (Q5 is the main separator). If you answered Q5(A) (Prediction is enough), you lean Dennettian. If Q5(B) (Control is needed), you lean Interventionist. If you answered Q10(A) (Control is enough), you lean Interventionist.

  ### Scoring Key
  *Tally your answers (A, B, or C) across the 10 questions.*

  1.  **Mostly A:** You are a **Realist**.
      *   If Q5=A and Q10=B: **Dennettian Compressibility Realist**.
      *   If Q5=B and Q10=A: **Causal Interventionist**.
      *   If Q8=B: **Structural Realist**.
      *   *To shift:* Change Q5 to B to become an Interventionist; change Q8 to A to become a Dennettian.

  2.  **Mostly B:** You are an **Eliminativist**.
      *   If Q2=B and Q3=B: **Physical Instrumentalist**.
      *   If Q3=B but Q2=A: **Design-Realist / Intentional-Eliminativist**.
      *   *To shift:* Change Q3 to A to accept Intentional Stance; change Q2 to A to accept Emergence.

  3.  **Mostly C:** You are a **Relativist**.
      *   If you emphasize "observer's model": **Pragmatist**.
      *   If you emphasize "usefulness of talk": **Quietist**.
      *   *To shift:* Change Q1 to A to believe in mind-independent order; change Q9 to C to believe in a single underlying truth.

  4.  **Mixed Profile (e.g., A on Physics, C on Agency):**
      *   **Nearest Position:** **Pragmatist**.
      *   **Single Verdict to Change:** To land cleanly in **Physical Instrumentalist**, change all C answers regarding agency (Q3, Q6, Q7) to B. To land in **Dennettian**, change all C answers to A.

  5.  **Incoherent Profile (e.g., Q5=A and Q10=B):**
      *   **Diagnosis:** You value prediction over control in data, but control over prediction in agents.
      *   **Fix:** Decide if *robustness* or *utility* is your criterion. If robustness, change Q10 to B. If utility, change Q5 to B.
