answer: |-
  The cork had shattered on the way in, leaving little brown islands floating in the first pour. Neither of them bothered to fish them out.

  "It's not unfalsifiable," Elias said, swirling the glass. The wine was vinegar with a PR team, but it was warm vinegar. "It's just... statistically ambitious. You're treating the Landscape like a bug, Mara. It's a feature."

  "It's a get-out-of-jail-free card for bad predictions," Mara said. She leaned back, the chair creaking. "If every vacuum state exists, then every prediction is true somewhere. That doesn't make you a physicist, Elias. That makes you a theologian with a grant."

  "We don't need to observe the other bubbles to know the math holds. We have non-empirical confirmation. The coherence of the theory itself—"

  "Coherence isn't data."

  "It is when the **Calibi-Yow** manifolds lock in the constants the way they do."

  Mara paused, glass halfway to her mouth. She didn't correct him. She just set the glass down with a sharp *clink*.

  "You know what that sounds like to me?" she said.

  "Enlighten me."

  "So, a census taker gets hired to count the population of the multiverse. Problem is, all the bubbles are causally disconnected. He can't visit them. Light can't reach them. By definition, he's stuck in his own little pocket of spacetime."

  Elias sighed, rubbing his temple. "I've heard this one."

  "So the census taker sits in his office for a week, does nothing, and then submits a report with the exact total population. His boss calls him in, furious. Says, 'This is impossible. You can't travel between bubbles. You have no data.' And the census taker says, 'I didn't need data. I used non-empirical confirmation.'"

  Mara leaned forward, picking up the bottle to top off Elias's glass before he could stop her.

  "The boss asks, 'But how did you verify the count?' And the census taker says, 'Well, to verify it, I had to assume I was standing outside the universe looking in. I billed the department for the God's-eye view surcharge.'"

  Elias stared at the floating cork fragments. "That's not funny."

  "It's not supposed to be," Mara said. "It's supposed to be an audit. You're claiming you can count the grains of sand on a beach you're not allowed to visit, by assuming you're the ocean. You've smuggled in omniscience to save the locality."

  Elias took a drink, winced, and didn't put the glass down. "Omniscience is expensive. Even with the grant."

  "Then stop billing for it."
