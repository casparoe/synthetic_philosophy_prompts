      *   *Crux 3 Wording:* This is the "Humphreys' Paradox" area. Propensities are $P(E|C)$, but $P(C|E)$ isn't a propensity. Frequentists say probabilities must handle both. Propensity theorists say $P(C|E)$ is epistemic.
      *   *Crux 4 Wording:* The prompt asks: "whether genuine chance requires indeterminism."
          *   Propensity: Yes.
