answer: |-
  **JOINT STATEMENT ON THE METAPHYSICS OF OBJECTIVE CHANCE**

  **Signatories:**
  The Undersigned Frequentist (UF)
  The Undersigned Propensity Theorist (UPT)

  **Context:**
  This statement follows a period of adversarial collaboration regarding the interpretation of objective chance. Both signatories reject subjectivist, epistemic, and logical interpretations of probability. We operate under a stipulated background finding derived from cosmological data: *The world is finite.* For every physical setup, there are at most finitely many instantiations; no setup is repeated infinitely often, and some are instantiated exactly once.

  ### I. Points of Agreement

  Despite our metaphysical divergences, we affirm the following claims as the baseline for any viable theory of objective chance:

  1.  **Intelligibility of Single-Case Chance:** Attributions of chance to individual events (e.g., "This specific toss has a 50% chance of heads") are intelligible propositions. They are not trivially false (due to lack of actual repetitions) nor trivially true (due to lack of constraint). A satisfactory theory must account for the truth conditions of such claims.
  2.  **Objectivity:** Objective chance is not reducible to any agent's credence, degree of belief, or state of evidence. While chance should guide rational credence (per the Principal Principle), it is a feature of the world, not a feature of our knowledge of the world.
  3.  **The Finiteness Stipulation:** The fact that the world contains only finitely many events is not, by itself, decisive between our views. It rules out *Actual* Frequentism (which requires infinite actual sequences), but it does not rule out *Hypothetical* Frequentism. Nor does it automatically vindicate Propensity theory, which must still explain how dispositions map to the probability calculus without infinite trials to校准 (calibrate) them.

  ### II. Residual Disagreements

  The following table outlines the core metaphysical and formal disagreements that remain. For each crux, we specify the concrete case bearing on the issue, our respective predictions for that case, and the evidence that would compel us to revise our positions.

  | Crux | Frequentist Position (UF) | Propensity Position (UPT) | Concrete Case | Predictions & Concession Criteria |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Reference Class & Sequence Uniqueness** | To assign a chance, we must identify a *hypothetical* sequence of repetitions. If the selection of this sequence is irreducibly interest-relative, chance loses objectivity. There must be a principled, physical fact about which hypothetical sequence is the relevant one. | The chance is fixed by the intrinsic properties of the single setup. Hypothetical sequences are merely heuristic tools we use to estimate the chance; they do not constitute it. The setup, not the sequence, is ontologically primary. | **The Sinking Island:** A coin is tossed once on an island that sinks immediately after, destroying the coin and mechanism. No repetitions are physically possible. | **UF:** The claim "Chance = 0.5" is true only if there is a unique, physically privileged hypothetical sequence of *such* coins. If sequence selection is arbitrary, the claim is indeterminate.<br>**UPT:** The claim is true if the coin's physical symmetry and dynamics confer a disposition of strength 0.5, regardless of hypothetical repetitions.<br>**Concession (UF):** If it is proven that no physical fact distinguishes a "fair coin" sequence from a "tosses-on-Tuesdays" sequence.<br>**Concession (UPT):** If it is shown that intrinsic properties cannot distinguish 0.5 from 0.500001 without reference to long-run behavior. |
  | **2. Determinate Strength of Dispositions** | Talk of a "disposition strength" is shorthand for counterfactual frequency claims. To say a disposition is 0.5 *just means* that were the trial repeated, the frequency would converge to 0.5. There is no extra metaphysical glue. | A propensity is a primitive causal power. Its strength is determinate even if, due to stochastic fluctuation, the actual or hypothetical frequencies it generates deviate from that strength. Frequencies are fallible evidence, not definitions. | **The Unique Atom:** A single atom of a synthesized isotope is created and decays. The isotope is never re-created. | **UF:** To say it had a 50% decay chance is to say that in a hypothetical world with many such atoms, 50% would decay within time *t*.<br>**UPT:** The atom possessed a specific tendency to decay at *t*. Even if a hypothetical ensemble decayed at 49%, the single atom's propensity could still have been 0.5.<br>**Concession (UF):** If we can measure propensity strength directly without relying on frequency statistics.<br>**Concession (UPT):** If it is shown that "propensity strength" has no empirical content distinct from "hypothetical frequency." |
  | **3. Time-Asymmetry & Inversion** | Probabilities obey the axioms of Kolmogorov, including Bayes' theorem. If propensities are time-asymmetric causal powers, they cannot satisfy $P(A|B) \neq P(B|A)$. Therefore, propensities are not probabilities. | Propensities ground the forward conditional ($P(\text{Effect}|\text{Cause})$). The inverse ($P(\text{Cause}|\text{Effect})$) is an epistemic conditional, not a propensity. Propensities are a species of probability, but not all probability statements are propensity statements. | **The Diagnostic Process:** A process where $P(\text{Positive Test}|\text{Disease})$ is a well-behaved propensity, but we are asked for $P(\text{Disease}|\text{Positive Test})$. | **UF:** If the inverse cannot be a propensity, the system fails to model standard probabilistic reasoning. Chance must be symmetrical.<br>**UPT:** The inverse is a rational credence updated by evidence, not a physical chance. The asymmetry reflects the asymmetry of causation.<br>**Concession (UF):** If a formalism is produced that retains the probability calculus while respecting causal asymmetry.<br>**Concession (UPT):** If it is shown that inverse conditionals have objective truth conditions independent of agents' evidence. |
  | **4. Determinism vs. Indeterminism** | Genuine chance does not require indeterminism. A deterministic system fed a smooth distribution of initial conditions (ICs) that yields a stable frequency of 0.5 possesses objective chance. Chance is about the stability of the output distribution. | Genuine chance requires irreducible indeterminism. A deterministic coin-flipper, no matter how chaotic, yields only frequencies born of ignorance of ICs. It has a frequency of heads, but the *chance* is 0 or 1 relative to the exact IC. | **The Mechanical Flipper:** A machine flips a coin 1,000,000 times. Dynamics are known and deterministic. ICs vary via micro-jitter. Outcome frequency is 0.5. | **UF:** This setup has objective chance 0.5. The robustness of the frequency against the IC distribution constitutes the chance.<br>**UPT:** This setup has chance 0 or 1 for each toss. The 0.5 is merely an epistemic frequency reflecting our ignorance of the jitter.<br>**Concession (UF):** If it is shown that deterministic systems cannot satisfy the Principal Principle for rational agents with full knowledge of ICs.<br>**Concession (UPT):** If quantum mechanics is proven false and all physical processes are shown to be deterministic. |

  ### III. Assessment of Verbal vs. Substantive Dispute

  In closing, we identify a portion of our dispute as verbal, specifically regarding the label "chance" in deterministic contexts (Crux 4). We agree on the empirical predictions: both sides agree the mechanical flipper produces a stable 0.5 frequency and that rational agents should bet at 1:1 odds. The disagreement lies in whether to reserve the word "chance" for metaphysical indeterminism or apply it to any robustly stable statistical pattern. However, the dispute regarding the *ontology* of single-case probabilities (Cruxes 1 and 2) is substantive. We disagree on whether the truth-maker for a single-case chance claim is a relation to a hypothetical collective (Frequentist) or an intrinsic property of the object (Propensity). This cannot be resolved by terminological stipulation, as it entails different commitments regarding what physical facts must obtain for a chance claim to be true in a finite world.
