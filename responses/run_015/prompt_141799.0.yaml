answer: |-
  Here is the specification for a theory of moral revolution, evaluated against your five cases, with the tensions and trade-offs made explicit for a campaigner's utility.

  ### Part 1: The Five Cases (Constraints vs. Preferences)

  To be useful to a campaigner, a theory must distinguish between *behavioral cessation* and *normative collapse*. If you conflate them, you will pull the wrong lever (e.g., subsidizing alternatives vs. shaming practitioners).

  **1. Practice dies, beliefs stay same (Cost/Inconvenience)**
  *   **Verdict:** **Camp Preference (Materialist).**
  *   **Why:** This is not moral collapse; it is obsolescence. If nobody believes slavery is wrong but nobody owns slaves because machines are cheaper, the *moral norm* is intact, waiting for a price shock. A theory of *moral* revolution should exclude this as a boundary condition. Including it allows Materialists to claim victory for interest-based explanations where none occurred.
  *   **Theory's Obligation:** Define it out. A campaigner needs to know if the enemy is still morally committed (requires norm change) or just priced out (requires economic pressure).

  **2. Pluralistic Ignorance (Private rejection, public compliance)**
  *   **Verdict:** **Genuine Constraint.**
  *   **Why:** This is a coordination problem, not a conviction problem. The practice persists due to information asymmetry, not moral commitment.
  *   **Theory's Obligation:** Must explain how the "spell" breaks. If your theory relies on converting individuals one by one, it fails here. The lever is transparency/signaling, not persuasion.

  **3. The Timing Problem (Argument dormant, then sudden success)**
  *   **Verdict:** **Genuine Constraint.**
  *   **Why:** Moral arguments (e.g., "slavery is cruelty") often exist centuries before the collapse. A linear model of "more argument = more change" cannot explain the latency.
  *   **Theory's Obligation:** Must account for non-linear thresholds. The lever is not "more argument," but "triggering the threshold."

  **4. Honour-Holders Giving Up (Elites surrendering status)**
  *   **Verdict:** **Genuine Constraint.**
  *   **Why:** This is the hardest data point for Interest-based theories. If duelling ends because the military elite (whose status depends on it) ban it, they are sacrificing a status marker.
  *   **Theory's Obligation:** Must explain why status was re-anchored. If your theory says "people always maximize status," this case breaks it. The lever is redefining honour, not attacking it.

  **5. Abolition Imposed from Outside (Conqueror/Colonial)**
  *   **Verdict:** **Camp Preference (Institutionalist/Statist).**
  *   **Why:** This is suppression, not collapse. If the occupier leaves and the practice returns, the norm never died.
  *   **Theory's Obligation:** Treat as a confounding variable. A campaigner relying on external imposition risks a "restoration" backlash. This is a constraint on *stability*, not a mechanism of *change*.

  ---

  ### Part 2: The Williams-y Point

  **Placement:** **Desideratum 0 (Meta-Constraint).**
  It does not sit on the list of empirical phenomena; it sits above the list as a rule for *causal explanation*.
  *   **The Point:** If the revolutionary's reasons are not grounded in the target's subjective motivational set (Williams' Internal Reasons), argument cannot be the *engine*.
  *   **Utility:** It prevents the campaigner from wasting resources on "educating" people who have no internal hook for the argument. It forces the theory to explain how the *motivational set* changed (via interest, honour, or shock), not just how the *logic* improved.

  ---

  ### Part 3: The Impossible Tension

  **The Two Desiderata:**
  1.  **Universal Mechanism:** A single lever (e.g., "always attack status") that works across all cases (Slavery, Duelling, etc.).
  2.  **Local Honour Economy:** Allowing the specific texture of the local status game to do the explanatory work (e.g., Duelling is about masculine courage; Slavery is about economic hierarchy + racial purity).

  **Why they can't be jointly satisfied:**
  If you demand a Universal Mechanism, you must smooth over the local texture. You end up with a "One-Size-Fits-All" playbook that is too blunt to diagnose *which* status game is being played. If you demand the Local Honour Economy do the work, you gain explanatory depth but lose predictive portability. You can explain why duelling ended in 1840s England, but you can't tell a campaigner in 2020s America what lever to pull without a fresh anthropological study.
  *   **For the Campaigner:** You must choose between a **Heuristic** (Universal, high risk of error) and a **Diagnosis** (Local, high cost of intelligence). A theory cannot be both a quick guide and a deep truth.

  ---

  ### Part 4: The Killer Requirement

  **The Single Requirement:** **The Timing Problem (Case 3).**

  **Why it knocks out the most stories:**
  *   **Arguments (Idealism):** **Knocked Out.** Arguments do not have fuses. If the argument "slavery is wrong" was available in 1750 and 1850, a theory that says "Arguments did it" cannot explain why it worked in 1850 and not 1750 without smuggling in another variable (like interests or honour).
  *   **Interests (Materialism):** **Weakened Significantly.** Interests usually shift gradually (technology, markets). Sudden collapse requires a shock or a coordination threshold. Pure interest theory struggles to explain the *snap* without ad-hoc appeals to "sudden realizations."
  *   **Honour (Status/Sociology):** **Survives.** Honour is inherently threshold-based (tipping points, reputation cascades). It explains latency (waiting for the risk to drop) and suddenness (the cascade).

  Demanding an explanation for the *timing* forces the theory to be non-linear. This eliminates the "Arguments" story as a standalone engine and severely cripples the "Interests" story.

  ---

  ### Part 5: Scorecard

  *   **Arguments:** Fails the Timing Problem and the Williams Constraint; useful only for post-hoc rationalization, not causal leverage.
  *   **Interests:** Fails the Honour-Holders Case (elites sacrificing status); explains obsolescence (Case 1) but not moral collapse.
  *   **Honour:** Best fit for Timing and Elite Sacrifice; requires high-cost local intelligence to operationalize (The Tension).
