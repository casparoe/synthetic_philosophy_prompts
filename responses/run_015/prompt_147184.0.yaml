answer: |-
  1. **The Exam Question**

  **Question 4**
  Read the following case carefully:

  > In 1911 a panel painting catalogued as the work of a minor seventeenth-century Dutch master is transferred: the conservator lifts the whole paint and ground layer off its warped oak panel and mounts it on a new mahogany one. Some decades later the museum re-examines its holdings. Dendrochronology dates the oak panel — which the museum kept, with a thin residue of ground still adhering to it — to the master's lifetime. Pigment analysis dates the paint layer now on display to the 1880s, and archival work shows that a restorer of that period reconstructed the image almost in its entirety from what survived of the original and had the result catalogued and sold as the master's own. So the object on the wall is a nineteenth-century imitation made of nineteenth-century materials; the only physically continuous remnant of the seventeenth-century object is a nearly blank plank in a storeroom.

  Write an essay of approximately 60 minutes' length responding to the following instruction:

  Do not simply decide which of the two objects (the plank or the hanging picture) is the "real" artwork. Instead, use this case to argue for a specific definition of **artistic authenticity**. What sort of property is authenticity in this context (e.g., a matter of physical continuity, historical genesis, or aesthetic capacity)? Once you have defined the property, explain what normative work that definition is supposed to do. Why does it matter whether we classify the hanging picture as authentic or inauthentic, and how does that classification alter the kind of attention or value we assign to it?

  *Note: You are not required to summarize Goodman's argument regarding indiscernible copies or Benjamin's theory of aura. You are expected to analyze the conceptual stakes of the case itself.*

  ***

  2. **Model Answer**

  This case fractures the standard assumptions linking material continuity, artistic agency, and aesthetic value. To resolve it, we must reject the notion that authenticity is a binary property attached to physical stuff. Instead, authenticity should be defined as a **historical-generative property**: it is a record of the specific causal chain by which the work's significant features came into existence.

  If we define authenticity merely as spatio-temporal continuity of matter, the oak plank in the storeroom is the only authentic object. However, this leads to an absurdity: the plank possesses none of the aesthetic properties that make the work worthy of museum display. It is a relic, not a painting. Equating the survival of the substrate with the survival of the artwork commits a category error. The artwork is not the wood; it is the configured surface. Therefore, physical continuity of the support is insufficient for artistic authenticity.

  Conversely, the hanging picture possesses the aesthetic configuration but lacks the correct generative history. The visible brushstrokes, color choices, and compositional decisions were made in the 1880s, not the 1600s. While the image may resemble what the master intended, the *action* of painting was performed by a Victorian restorer. If authenticity is a property of genesis, the hanging picture is not an authentic work by the master. It is a nineteenth-century reconstruction based on seventeenth-century evidence.

  Defining authenticity this way performs crucial normative work. It dictates the kind of interest we take in the object. If we label the hanging picture "authentic," we invite the viewer to treat it as testimony to the master's mind and hand. We look for seventeenth-century intention in every brushstroke. If we label it "inauthentic" (or a reconstruction), we shift the interpretive frame. The object becomes testimony to nineteenth-century reception, restoration ethics, and the Victorian imagination of the Dutch Golden Age. The value does not vanish; it relocates.

  This distinction prevents the error of treating attribution as a verdict on worth. To say the hanging picture is not by the master is not to say it is worthless. It is to say it has a different *kind* of value. It may be aesthetically pleasing, historically informative, or technically impressive, but it cannot serve as evidence of the master's specific artistic choices. The "work" of authenticity is to secure the link between the aesthetic properties we perceive and the historical agent who produced them. When that link is broken, as it is here, the object remains an artifact, but it ceases to be a vehicle for the original artistic agency.

  Therefore, the museum should reclassify the hanging picture as a nineteenth-century reconstruction and the plank as a fragment of the original support. This preserves the integrity of the master's corpus while acknowledging the historical value of the reconstruction. Authenticity is not a magic glow that makes one object better than another; it is a historical marker that tells us whose actions we are witnessing. In this case, we are witnessing the actions of a Victorian restorer, and our engagement with the object should be calibrated to that historical truth rather than a fictionalized seventeenth-century genesis.

  ***

  3. **Marking Scheme (Out of 20)**

  **1. Diagnosis of the Ontological Split (5 marks)**
  *   **Must Hit:** The student must identify that the case separates material continuity (the plank) from image genesis (the paint layer). They must explain why neither object fully satisfies the conditions of the "original" work on its own.
  *   **Error Penalty:** Deduct marks if the student argues that the plank *is* the artwork simply because it is the spatio-temporally continuous object, ignoring that it lacks the image.

  **2. Definition of Authenticity (5 marks)**
  *   **Must Hit:** The student must define authenticity as a property of historical genesis or agency (the "who" and "when" of production), rather than purely physical composition or aesthetic appearance.
  *   **Error Penalty:** Deduct marks if authenticity is defined vaguely as "realness" or reduced solely to chemical/physical composition without reference to artistic action.

  **3. Normative Function of Authenticity (5 marks)**
  *   **Must Hit:** The student must explain what work the label "authentic" does (e.g., it directs interpretation, secures the link between viewer and maker, or categorizes historical testimony). They must explain how value shifts rather than disappears if the label is withheld.
  *   **Error Penalty:** Deduct marks if the student treats the conclusion "not by the master" as settling the question of value, implying the hanging picture is therefore worthless or merely a "fake" in the pejorative sense.

  **4. Synthesis and Verdict (5 marks)**
  *   **Must Hit:** The student must offer a coherent conclusion that respects the complexity of the case (e.g., reclassification rather than destruction), showing how their definition of authenticity guides museum practice or viewer attention.
  *   **Error Penalty:** Deduct marks if the student retreats to a binary choice (one is real, one is fake) without addressing how the "fake" object retains historical or aesthetic significance.
