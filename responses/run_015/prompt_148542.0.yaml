answer: |-
  Thank you, Emmy. That poem was a perfect beginning. Looking around this garden, among the plants Alan tended with such quiet attention, I am struck by how many kinds of life are gathered here. Scientists, rowers, neighbours, family. And me. For fifty-five years, I studied why birds sing. Alan studied why we think we know we are here to hear them.

  We met in 1968, graduate students in the same building. I was listening to thrushes; he was listening to neurons. We stayed friends because we both loved the truth, even when it was difficult. Alan held a view about the mind that he knew was hard for people to accept. He believed that our conscious life is real, but it does not cause our actions. He said it often: nothing I feel will ever push a single atom.

  To some, this sounds cold. It sounds like saying our love is just a shadow on a wall. But Alan insisted the shadow was real. He used to say the dial isn't the mercury. The gauge shows the pressure, but the reading doesn't push the steam. For Alan, our feelings were the reading. Perfectly true, perfectly real, but not the engine.

  I know this creates a puzzle. If feelings don't cause us to speak, how do we know we are telling the truth about them? Alan spent decades on this. He said we do not need a feeling to push a belief into place for that belief to be true. The belief and the feeling arise from the same source. He called it a cost, learning to live with the grounded idiom. He was willing to pay it.

  I am an ethologist. My life's work is saying the bird sings because it sees a rival. Alan would say the seeing and the singing are matched by the brain, but the seeing does not push the song. We disagreed on the machinery. We never disagreed on the light.

  Those who worked in his laboratory know this best. His technicians tell me he never once asked about the data before asking about their children. On his own terms, he could not say his care caused the question. The neural state caused the question, and the care was the truth of that state. But when he listened to your answer, when he remembered your daughter's name, the love was not an illusion. It was the dial reading true.

  Every August, he took the grandchildren out for the Perseids. He made them sit in the dark for twenty minutes before anyone was allowed to speak. He wanted them to feel the wait. He wanted the sight to matter, not because it changed the stars, but because it changed them. He taught Emmy to separate the calls of a chiffchaff and a willow warbler. When she got it right at nine, he cried. Later he told her the tears had been arranged for before he knew why, and that this did not make them any less about her.

  That is what I want you to remember. That his affection was not froth on a machine. The fact that his love did not push the atoms does not mean it was not there. It means it was not a tool. It was a witness.

  He would not want me to tell you he is still watching us. He would not want me to suggest his experience is now doing anything anywhere. The dial has stopped. The mercury has settled. But the reading remains true. He loved this garden. He loved his work. He loved you. And the truth of that love does not depend on its ability to move the world. It depends on its accuracy.

  I will miss him. I will miss the arguments, the silence in the dark, and the way he honoured the truth even when it took away the comfort of causation. We are here to mark the reading he left us. It was clear. It was precise. And it was deeply kind.

  ***

  **Notes to the Speaker**

  I deliberately avoided saying Alan's feelings *motivated* his actions (e.g., asking about technicians' children). Instead, I framed his care as the "truth of that state," aligning with his grounding distinction without using the technical term. This prevents the philosopher student from claiming you misrepresented his view on causal inertness.

  I addressed the "self-refuting" objection (the paradox of phenomenal judgment) by stating his solution—that belief and feeling arise from the same source—without turning it into a seminar. This acknowledges the objection exists ("He knew the cost") without validating the critique that his work was incoherent.

  I omitted any comfort regarding an afterlife or continued consciousness, as requested. Instead of saying his love "lives on," I focused on the enduring *truth* of the reading ("The reading remains true"). This honors his secular materialism while validating the family's grief. The bird/ethologist contrast was used to highlight your friendship's integrity without forcing you to adopt his vocabulary.
