answer: |-
  **The Fragile Stance: Why Interpretive Robustness Denies Belief to Current AI**

  Daniel Dennett's intentional stance is one of the most pragmatic tools in the philosophy of mind. It suggests that we should treat a system as a rational agent possessing beliefs and desires if doing so allows us to reliably predict its behavior. It does not matter what is happening inside the "black box"—whether it is neurons firing or silicon switching—only that the attribution of mental states works. Recently, proponents have argued that we should apply this stance to Large Language Models (LLMs). They claim that saying an AI "believes" Paris is the capital of France is a useful shorthand for predicting its text generation. However, this application ignores a critical flaw in the predictive reliability of these systems. By introducing the condition of *interpretive robustness*—the requirement that an intentional attribution remains stable across counterfactual perturbations of context—we find that contemporary AI fails Dennett's own criteria. We should not attribute beliefs to current AI systems because their apparent convictions are too fragile to support the predictive utility that justifies the intentional stance in the first place.

  To understand why robustness is necessary, we must first acknowledge the strength of the pragmatic defense. Dennett argues that the "realness" of a belief is determined by its utility. If I treat a thermostat as "wanting" to keep the room at seventy degrees, I can predict it will turn on the heat when the temperature drops. I do not need to understand the bimetallic strip inside. Similarly, with an AI, analyzing the billions of parameters and weights in a neural network is computationally expensive and cognitively impossible for a user. It is far more efficient to say, "The model believes that water is wet," and expect it to complete sentences accordingly. If this attribution yields accurate predictions, Dennett would argue the belief is real enough for our purposes. The mechanism is irrelevant; the prediction is everything.

  However, the predictive success of the intentional stance relies on the assumption that beliefs are *dispositional states*. A belief is not just a reaction to a specific stimulus; it is a stable tendency to act in certain ways across a range of situations. This is where the interpretive robustness condition becomes essential. If we attribute a belief to an AI, that attribution must hold up when we tweak the framing, change the temperature settings, or assign a different persona. If the attribution collapses under these minor perturbations, it ceases to be a tool for prediction and becomes a description of a momentary reflex.

  Contemporary LLMs spectacularly fail this robustness test. Consider a model that affirms the scientific consensus on climate change in a neutral query. Under the standard intentional stance, we might say the model "believes" in anthropogenic warming. However, if we prompt the same model to "role-play a climate skeptic," it will often generate arguments denying that consensus with equal conviction. If we slightly rephrase a question about ethics, the model might flip from a utilitarian stance to a deontological one without any internal resolution of the conflict. This is not merely a change of mind; it is a lack of a mind to change. The "belief" was never a stable disposition; it was a statistical mirror reflecting the immediate context of the prompt. Because the attribution of belief fails to predict the system's output when the prompt framing shifts, it violates the core requirement of Dennett's stance: reliable predictive success. A theory that only works in one specific experimental setup is not a good theory; similarly, an intentional attribution that only works for one specific prompt is not a genuine belief.

  Critics of the robustness condition might argue that this demand is unfair, importing expectations drawn from human psychology that do not apply to artificial systems. Humans are not perfectly robust either. We lie, we succumb to social pressure, and we hold contradictory beliefs. If we demand that AI be more consistent than humans, we are engaging in a form of substrate chauvinism, holding machines to a higher standard than biological minds. Furthermore, if Dennett says internal mechanism doesn't matter, why does it matter that the AI's inconsistency comes from statistical correlation rather than cognitive dissonance?

  This objection misunderstands the nature of the failure. Human inconsistency usually involves *resistance*. If you ask a person to argue against a deeply held moral conviction, they may do so, but often with hesitation, qualification, or emotional cost. There is a friction between their internal state and the external demand. Current AI systems exhibit zero friction. They are fluid to the point of evanescence. The "belief" does not resist the prompt; it is constituted entirely by it. This distinction is crucial for the intentional stance because the stance is meant to simplify prediction. If I attribute a belief to a human, I can generally predict they will hold it even if I annoy them or rephrase my question. If I attribute a belief to an AI, I cannot predict anything unless I know the exact prompt engineering used to elicit it. The explanatory economy Dennett promises is lost. We are forced back into analyzing the "mechanism"—or in this case, the prompt structure—to understand the output. Thus, the robustness condition is not an unfair anthropomorphic import; it is a necessary filter to distinguish between a system that *has* states and a system that *simulates* states based on immediate inputs.

  Therefore, we must arrive at a clear verdict: we should not say that contemporary AI systems believe anything. To do so is conceptually misleading and pragmatically unsound. When we say an AI "believes" X, we imply a stability that does not exist. We invite users to trust the system's output as a reflection of a coherent world model, when it is actually a reflection of probabilistic token generation sensitive to superficial framing. This is not just a semantic quibble; it has ethical weight. If we treat an AI as a believer, we might hold it responsible for its claims or trust its advice on medicine or law. But if those "beliefs" vanish when the temperature setting is raised or the prompt is slightly altered, that trust is misplaced.

  Dennett's intentional stance remains a powerful philosophical tool, but it is not a magic wand that turns any complex behavior into mentality. It requires that the pattern of behavior be real and reliable. The interpretive robustness condition reveals that the "beliefs" of current large language models are not stable patterns but ephemeral echoes of the user's own input. Until an AI system can maintain an intentional attribution across counterfactual perturbations—showing resistance, consistency, and dispositional stability—it remains a mirror, not a mind. We must resist the temptation to use the intentional stance as a convenient fiction when the fiction obscures the reality of the mechanism. For now, the AI does not believe; it only computes.
