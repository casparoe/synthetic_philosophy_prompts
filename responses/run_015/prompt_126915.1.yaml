answer: |-
  First, to answer your terminological question: **"Ghost-extension" is not a standard term in Hobbes scholarship or the history of mathematics.** It sounds like a very apt coinage on your part, possibly influenced by Berkeley's later phrase "ghosts of departed quantities" (which targeted Newton/Leibniz, not Hobbes). However, your intuition about what it *represents* is spot-on for the Hobbes-Wallis feud.

  Here is the ranking of your five positions from **Most Hobbesian (Defend)** to **Least Hobbesian (Reject)**, along with the reasoning.

  ### The Ranking

  **1. (2) Constructible by compass and ruler in principle**
  *   **Verdict:** **Defend.**
  *   **Why:** This is the core of Hobbes's "generative" geometry. For Hobbes, a geometric object only has scientific reality if we can conceive of the **motion** that generates it (point moves $\to$ line, line moves $\to$ surface). He insists that definitions must be causal; you must define a circle by the rotation of a radius, not just as a set of equidistant points. If it can be constructed in principle via motion, it exists for geometry.

  **2. (1) Pure mental construction with no physical trace**
  *   **Verdict:** **Defend (with caveats).**
  *   **Why:** Hobbes is a materialist, but he believes geometry happens in the mind through "reckoning" (computation) of consequences. As long as the mental construction tracks a *possible* physical motion (see #2), it is valid. He rejects Platonic forms (existing outside the mind), but he accepts that the *truth* of the geometry resides in the universal mental reasoning, not the specific ink drawing.

  **3. (3) Actually traced by physical motion**
  *   **Verdict:** **Tolerate (as a prop, not truth).**
  *   **Why:** Hobbes acknowledges we need to draw figures to reason, but he is acutely aware that physical lines have breadth and imperfection. A drawn circle is never a true circle. He tolerates physical tracing as a necessary aid to the imagination, but he would deny that the *geometric existence* depends on the physical trace. The truth is in the universal consequence, not the particular body.

  **4. (5) Ghost-extension (extrapolating past possible motion)**
  *   **Verdict:** **Reject (but this is what he accuses others of).**
  *   **Why:** You are correct that this is close to his critique of Wallis. Hobbes rejects any magnitude that cannot be generated by a conceivable motion. If you extrapolate a figure into a realm where motion cannot reach (e.g., completed infinities, indivisibles, or limits treated as static magnitudes), Hobbes calls this "insignificant speech." He would say these objects do not *exist* geometrically because they lack a generative cause.
      *   *Note on your project:* While he rejects this stance, analyzing it as "The Hobbesian Critique of Ghost-Extension" is a very strong angle.

  **5. (4) Defined by social convention among mathematicians**
  *   **Verdict:** **Hard Reject.**
  *   **Why:** Hobbes despised the idea that scientific truth is determined by consensus or authority. He spent decades fighting the mathematical establishment (the "mathematical doctors" at Oxford) who excluded him. For Hobbes, truth is the correct consequence from definitions; it is not up to a guild of mathematicians to decide what counts as a proof by convention.

  ---

  ### The Wallis Connection & "Ghost-Extension"

  Your intuition on **Position 5** is excellent. Here is the specific context for your side project:

  **The Wallis Feud:**
  John Wallis used algebraic and arithmetic methods (specifically in *Arithmetica Infinitorum*, 1656) to solve problems like the quadrature of the circle. He treated infinite series as summable quantities.

  **Hobbes's Objection:**
  Hobbes argued that Wallis was manipulating symbols without understanding the **magnitudes** they represented. To Hobbes, you cannot sum an infinite series because you cannot complete the motion required to generate it. Treating the limit of a series as a finished, existing magnitude is exactly what you call **ghost-extension**.
  *   Hobbes saw this as "marking without signification."
  *   He believed Wallis was claiming existence for figures that had no clear **generative motion**.

  **Is "Ghost-Extension" a real term?**
  No, it appears to be your invention. However, it captures the spirit of Hobbes's critique better than some standard terms.
  *   **Standard Terminology:** Historians usually describe this as Hobbes's objection to **infinitesimals**, **indivisibles**, or the **actual infinite**.
  *   **Why your term works:** "Extension" is a key Cartesian/Hobbesian concept (matter is extended substance). By calling it "Ghost-extension," you highlight the contradiction Hobbes saw: claiming something is extended (and thus material/movable) while treating it as a metaphysical abstraction that no motion could produce.

  ### Summary for your Project
  If you are writing this up, I would frame Position 5 not as "Hobbes's Stance" but as **"The Error Hobbes Attributed to Wallis."**
  *   **Hobbes's Positive Stance:** Geometry is the science of consequences from the **making** of figures (Positions 1 & 2).
  *   **Hobbes's Negative Stance:** Geometry is not the manipulation of symbols representing unconstructible magnitudes (Position 5).

  This distinction makes your "ghost-extension" category a powerful analytical tool, even if the term itself is novel.
