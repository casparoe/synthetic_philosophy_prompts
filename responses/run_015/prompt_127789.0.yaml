  **MEMORANDUM**

  **TO:** Clinical Ethics Committee, St Anselm's University Hospital
  **FROM:** [Your Name], Doctoral Candidate in Philosophy of Mind & Committee Member
  **DATE:** 14 October 2023
  **SUBJECT:** Recommendation Regarding Patient K. and Experimental Bilateral Cortical Interface

  **1. Recommendation and Implementation Timeline**

  Regarding the proposal to implant an experimental bilateral cortical interface in Patient K., I recommend an **immediate deferral of consent procurement and surgical scheduling**.

  The current conflict between the language-dominant left hemisphere's verbal refusal and the right hemisphere's non-linguistic assent presents an unresolved ambiguity regarding decision-making capacity and moral status. Proceeding on the basis of a single consent form assumes a unity of agency that is phenomenologically contested in this specific clinical population. Conversely, overriding the verbal refusal of the speaking hemisphere carries significant legal and ethical liability.

  **Timeline:** I propose a **three-month deferral**. During this period, the neurosurgical team should collaborate with the ethics committee to design a specialised capacity assessment protocol. This protocol must utilise non-invasive communication methods (such as functional MRI-based brain-computer interfaces) to verify whether the right hemisphere possesses sufficient comprehension of risks and benefits to constitute valid consent, rather than mere preference. A follow-up committee review should be scheduled for 15 January 2024 to reconsider the case based on these findings.

  **2. The Argument for Unified Personhood**

  The family's position rests on the strongest available argument for retaining unified personhood in split-brain subjects: the **Biological-Narrative Unity Thesis**. This view posits that personhood is not contingent upon the moment-to-moment integration of conscious contents, but rather on the continuity of the living organism and the overarching life narrative. Patient K. possesses one body, one legal identity, and one continuous history prior to the callosotomy. Even if conscious access is divided, the subcortical structures (brainstem, thalamus) remain integrated, regulating a single homeostatic system. Furthermore, as argued by philosophers such as Tim Bayne, the existence of parallel streams of consciousness does not necessarily entail the existence of two *persons*; rather, it may represent a fragmentation of access within a single person's cognitive architecture.

  To treat Patient K. as two persons is to risk fracturing their social and legal identity, potentially undermining the family's capacity to care for them as a unified whole. If we accept the Biological-Narrative Unity Thesis, the verbal refusal of the left hemisphere must be decisive, as it is the voice of the legal person responsible for navigating the shared social world.

  However, this argument encounters a critical limitation in the context of *transformative* intervention. The proposed interface aims to restore neural integration, effectively altering the phenomenological structure of the patient's mind. If the left hemisphere refuses this transformation, enforcing it upon the grounds of biological unity risks violating the autonomy of the conscious agent currently inhabiting that hemisphere. If the right hemisphere is indeed a distinct centre of agency, subjecting it to the left hemisphere's veto constitutes a form of internal tyranny. Given the experimental nature of the procedure, the precautionary principle suggests we must prioritise the avoidance of harm to any distinct centre of consciousness over the restoration of unity. Therefore, while the Biological-Narrative Unity Thesis holds for daily care, it is insufficient to override conflicting volition in high-risk research contexts.

  **3. Institutional Policy on Dual-Consent Pathways**

  The surgical unit raises a pertinent question: ought St Anselm's adopt dual-consent pathways when hemispheres generate contradictory volitional outputs?

  I recommend that the institution **does not formally adopt a dual-consent policy** at this stage, but instead establishes a **Multi-Agency Assessment Protocol** for research involving dissociative neurological conditions.

  Formalising dual consent implies a legal recognition of hemispheric personhood, which sets a precarious precedent. It could complicate liability, guardianship, and future treatment decisions where hemispheric agreement is impossible. The law currently recognises the human being as the legal person; diverging from this requires legislative, not merely institutional, change.

  However, acknowledging the ethical reality of divided volition is necessary. A Multi-Agency Assessment Protocol would require that in cases of known callosotomy where research interventions affect inter-hemispheric dynamics, consent must be sought from both hemispheres using the best available communication methods. If contradiction arises, as with Patient K., the default position must be deferral. This approach respects the potential agency of the non-speaking hemisphere without granting it full legal personhood. It balances the family's need for a unified patient identity with the ethical imperative to avoid imposing interventions on dissociated consciousnesses that may not share in the benefits.

  **4. Confidence and Uncertainty Declaration**

  Per the committee's requirements for transparency regarding ethical modelling, I offer the following declaration:

  **Confidence Level:**
  I am **moderately confident (approx. 75%)** in the recommendation to defer. This course of action minimises immediate harm and allows for further empirical clarification without foreclosing the possibility of future treatment. It aligns with the precautionary principle standard in experimental neuroethics.

  **Point of Least Certainty:**
  My least certain point is **empirical**, specifically regarding the **depth of the right hemisphere's comprehension**. While behavioural assessments indicate a preference for intervention, I am uncertain whether the right hemisphere possesses a conceptual understanding of the *risks* involved (e.g., personality change, seizure variability) comparable to the linguistic understanding of the left hemisphere. Non-linguistic preference tasks may indicate desire, but not necessarily informed consent. If the right hemisphere lacks risk comprehension, its assent is ethically negligible, strengthening the case for accepting the left hemisphere's refusal. Conversely, if it possesses such comprehension via non-linguistic conceptual frameworks, overriding it constitutes a significant moral harm. Current diagnostic tools are insufficient to resolve this distinction with high precision.

  ***

  **Signed,**

  [Your Name]
  Doctoral Candidate, Philosophy of Mind
  Clinical Ethics Committee Member
