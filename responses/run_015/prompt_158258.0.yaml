answer: |-
  Start with the evolutionary biology analogy because it is the only framework that substantiates hard inevitability, rendering the other two questions secondary details about friction and noise.

  This ordering is logically upstream because structural convergence dictates whether a destination exists at all, whereas institutional memory only determines how hard it is to leave a path once taken, and micro-events only matter if the path isn't forced by larger pressures. If there are no structural forces pushing societies toward democracy or industrialization, then institutional stickiness and random accidents are irrelevant to the question of inevitability; you would simply be studying why random outcomes persist rather than why specific ones emerge. By establishing whether similar environments produce similar complexities independently, you determine the baseline probability of the outcome before worrying about what might derail it.

  In terms of tractability for a solo researcher, the evolutionary analogy is the only one grounded in observable data rather than speculation. You can audit comparative history to see if agriculture, bureaucracy, or industrial tech arose independently across isolated civilizations, which provides actual data points for convergence. Investigating institutional memory is moderately tractable through case studies of regime change, but analyzing micro-events is effectively impossible without a lab because it relies on counterfactuals that cannot be verified; you cannot rerun history to see if a different assassin changes the outcome, making that line of inquiry a dead end for certainty.

  The finding that would most drastically change your mind is evidence of independent invention of the same complex system under vastly different cultural initial conditions, such as an industrial revolution occurring without European colonial influence or specific resource luck. Conversely, finding a historical instance where a society successfully reset its institutional trajectory without collapse would disprove strong path dependence, but it wouldn't prove inevitability; only convergent evolution proves that the outcome was waiting to happen regardless of the path.
