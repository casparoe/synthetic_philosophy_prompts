      *   *Clarification:* The link is that if a Social Choice Function is strategy-proof and Pareto, it effectively satisfies a strong version of IIA. I shouldn't get too bogged down in the proof mechanics, just the intuition.
      *   *Single-Peaked:* Make sure to mention that Median Voter Theorem guarantees a Condorcet winner, which makes simple majority rule strategy-proof *if* voters vote sincerely. Actually, with single-peaked preferences, voting for your true peak is a dominant strategy in pairwise majority voting.
      *   *Practicality:* Engineers love "Score Voting" (0-10). It's basically weighted approval. It's vulnerable to tactical voting (everyone votes 0 or 10), but in a cooperative team, it's usually fine. Approval is safer against gaming.

  7.  **Final Polish:**
