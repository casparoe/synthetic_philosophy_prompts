answer: |-
  ### Translation: Arrow's Terms into Reward Modeling

  *   **Voters:** Your raters.
  *   **Alternatives:** The fixed set of model completions (items) being ranked.
  *   **Preference Profile:** The dataset of pairwise comparisons (who beat whom).
  *   **Social Welfare Function:** Your training algorithm mapping the dataset to a scalar reward function $R_\theta$.
  *   **Unrestricted Domain:** Your training algorithm must converge to a valid ranking even if the pairwise labels contain adversarial cycles (e.g., $A \succ B$, $B \succ C$, $C \succ A$) with no consistent latent explanation.
  *   **Pareto:** If every rater labels $A \succ B$, your loss function must enforce $R_\theta(A) > R_\theta(B)$.
  *   **Independence of Irrelevant Alternatives (IIA):** The learned score difference $R_\theta(A) - R_\theta(B)$ must depend *only* on the pairwise labels involving $A$ and $B$. It cannot change if you add data about $C$ to the batch, nor can the presence of $C$ in the vocabulary affect the relative ranking of $A$ and $B$.
  *   **Non-Dictatorship:** The final reward function is not identical to the preference ordering of a single specific rater (or a fixed subset of raters).

  ### Residue Report: Where the Map Doesn't Match the Territory

  **1. Ground Truth vs. Normative Aggregation**
  Arrow's theorem addresses *normative aggregation*: merging conflicting values where no "correct" answer exists. Your setup ("noisy draws from a population") assumes *positive estimation*: raters are measuring a latent ground-truth reward $r^*$.
  *   **Verdict:** If you assume a latent $r^*$ exists, Arrow does not apply. You are doing regression, not voting. The theorem only bites if you admit there is no single $r^*$ and you are trying to force diverse values into one scalar.

  **2. Cardinality and Intensity**
  Arrow assumes ordinal preferences only (rankings). You use Bradley–Terry, which assumes cardinal utility differences (probabilities imply intensity).
  *   **Verdict:** Adding cardinality bypasses Arrow, but only by restricting the domain. You are assuming preferences are generated by $P(A \succ B) = \sigma(r(A) - r(B))$. This structural assumption violates Arrow's "Unrestricted Domain." You aren't solving Arrow's problem; you're assuming it away by positing a latent scalar space.

  **3. IIA and the "Junta" Intuition**
  Your intuition is correct. IIA forbids the aggregator from using information about $C$ to resolve conflicts between $A$ and $B$. In the proof, this separability forces the decision power on any pair $\{A, B\}$ to concentrate on a single voter (the "dictator") to prevent cycles.
  *   **Verdict:** In neural reward models, IIA is typically violated by design. Shared weights mean learning about $(A, C)$ updates parameters that affect $(A, B)$. This avoids Arrow's impossibility but makes your reward function path-dependent on the training batch composition.

  ### Escape Routes: Single-Peakedness

  **Translation:**
  "Single-peaked preferences" means all raters agree on a shared 1D embedding axis (e.g., "quality"), and each rater has an ideal point on that line. They prefer items closer to their ideal.
  *   **In your terms:** The pairwise data must be consistent with all raters maximizing $-\|x - \mu_i\|^2$ in a shared 1D latent space.

  **Empirical Validity:**
  This is mostly **stipulating your way out of an inconvenience**. Human values are multi-dimensional (helpfulness, honesty, humor, style). Unless your task is trivial (e.g., ranking by length), human preferences are not single-peaked. Assuming this holds is claiming your raters disagree only on "how much," not "what kind," of value.

  ### Conclusion

  Your colleagues are warning you about value conflict using a theorem about value aggregation. But your pipeline assumes value estimation.

  \answer{arrow-framing-artifact: assumes latent scalar reward, violating unrestricted domain}
