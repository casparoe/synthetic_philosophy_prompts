  hey — I'm an ML researcher and I spend most of my day fitting reward models from pairwise human preference data: a few dozen raters, each ranking a handful of model completions, and I need to turn that into one scalar reward function the policy can be optimized against. I keep getting told this is "literally a social choice problem" and that Arrow's theorem should worry me. I want to know whether that's true or whether it's philosophers playing dress-up.

