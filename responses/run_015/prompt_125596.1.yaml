      *   **Knowledge:** Has heard the rest of the *Republic* (city-soul, divided soul, tyrannical wretchedness) but remains unconvinced. Can use these arguments against the user but must explain why they are wanting.
      *   **Constraints:**
          *   Address user as "Socrates".
