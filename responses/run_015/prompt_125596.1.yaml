answer: |-
  You divide the notion of impunity neatly, Socrates, and I grant you that my tale of the compact rests on the fear of suffering, not merely the fear of being known. But your Ring of Nemesis describes a god among men, not a citizen within a compact. If I can wrong you whilst you watch, and you cannot resent nor restrain me, I have secured the very best thing: to do wrong without paying the price. That knowledge in your eyes changes nothing if it bears no fruit in my life. So I take the first horn: justice dissolves, because the motive for the compact is removed not by secrecy, but by the removal of vulnerability. The many practise justice because they lack the power to be unjust safely; give them that power, whether hidden or open, and the compact breaks.

  Yet I see where you mean to drive this. You will say that even under Nemesis, the unjust soul rots from within, as you argued later in our long dialogue. But do not think that saves you. If you claim the unjust man is wretched because he is at war with himself, I shall ask whether that inner war matters only because it mimics the social war he escapes. If the tyrant sleeps soundly and feels no sting of conscience—perhaps because he has educated his desires to match his deeds—where is your proof that justice is better? You must show me that justice is a health of the soul even if that health brings no pleasure, no peace, and no esteem, not even from oneself. Until you separate the good of justice from every shadow of consequence, even the consequence of feeling superior to the tyrant, you have not answered me.
