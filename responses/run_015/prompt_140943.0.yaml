answer: |-
  This is a fantastic puzzle, and you're right to sense that the standard justifications don't quite map onto the machinery. If we treat the current system as a coherent philosophical statement, it's a contradiction. If we treat it as a historical settlement, it makes perfect sense.

  Let's take your buckets first. I think your intuition is correct that they don't all carry equal weight, and I think you've spotted the missing fourth element, though I might sharpen it.

  **Authorship** is the dominant theory at the national level. This is the "We the People" idea. The state isn't just a service provider; it's a collective project owned by a specific group. That's why the expat keeps the vote. They aren't paying taxes or subject to the police, but they are still "owners" of the project. It's a property right in the nation, inherited and retained.

  **Exposure** is the theory that gets violated most openly. As you noted, the taxpayer-resident and the draftee are the smoking guns here. If exposure were the primary principle, long-term residents would vote nationally, and non-citizen draftees would either be exempt or enfranchised immediately. The fact that they aren't tells us that Exposure is subordinate to Authorship. We accept taxation without representation as a fee for accessing the territory, but we reserve *rule* for the *owners*.

  **Stake/Association** is the bridge that explains the local/national split. At the municipal level, the "project" is about shared infrastructure, schools, and daily life. Your physical presence creates a stake sufficient for membership in that smaller club. At the national level, the "project" is about sovereignty, identity, and continuity. Physical presence matters less than legal lineage.

  But here is the **Fourth Bucket** you hinted at, and I think it's the load-bearing wall: **Permanence (or Indelibility).**

  A democracy needs to be able to make commitments that last longer than an election cycle. It needs to borrow money, sign treaties, and wage wars with the assumption that the entity making the promise today will exist tomorrow. If the *demos* were defined purely by residence or current exposure, the "self" of the democracy would fluctuate wildly with migration patterns and economic shifts.

  Citizenship creates a stable boundary. It says: "This group is fixed enough to hold responsibility over time." That's why expats keep the vote—they remain part of the permanent structure even if they are physically absent. That's why residents don't get it—their membership is contingent on permission. The system prioritizes the stability of the decision-making body over the moral purity of consent.

  **So, what theory does the package presuppose?**

  It presupposes that the **Nation** (the people as a cultural/historical entity) is distinct from the **Population** (the people currently subject to power).

  *   **What has to be true:** It requires that political legitimacy comes from belonging to a historical continuum, not just from being subject to coercion. It assumes that a state is more like a family trust than a condominium board.
  *   **What it quietly rules out:** It rules out the idea that coercion alone generates a right to rule. It rules out pure consent. It also rules out the idea that democracy is a universal human right applicable to all subject to power; instead, it treats democracy as a privilege of membership in a specific club.

  **Is there a single unifying story?**

  No. And that's the important bit for your column. This isn't a philosophy; it's a ceasefire.

  The expat vote is there because diasporas are politically powerful and emotionally tied to the "Nation."
  The resident exclusion is there because states want control over borders and fear diluting the "National" will.
  The local voting is a safety valve to prevent unrest among non-citizens who are essential to the economy.
  The draft rule is a fossil. It's pre-democratic sovereignty logic ("the King owns the bodies in his realm") that never got fully scrubbed out.

  The system holds together not because it's logically consistent, but because the inconsistencies are useful. It allows the state to claim democratic legitimacy (via citizens) while retaining sovereign power over territory (via residents/draftees).

  **Now, the Counterfactual: Pure "Affected Interests"**

  If we dropped the implicit theory and went with "everyone genuinely affected gets a say," the nation-state dissolves. Let's walk through it.

  1.  **The Boundary Problem:** If a US carbon policy affects a farmer in Bangladesh, does he vote? If the Fed raises rates and crashes a currency in Argentina, do they vote? If you follow the logic, yes. You end up with global plebiscites on almost every major policy. The "election" becomes unmanageable. You can't have a deliberative democracy if the electorate is 8 billion people shifting based on the issue at hand.
  2.  **Children and Future People:** Yes, logically, they are affected. You'd need proxy voting for children (parents? guardians?) and perhaps a "Guardian for the Future" with voting weight. This isn't absurd—some argue for lowering the voting age to birth with parents holding the ballot—but it changes the unit of democracy from "individual" to "lineage."
  3.  **Emigrants:** They get disenfranchised quickly. Once you leave, your exposure drops. Unless you argue that national identity *itself* is an interest (which brings us back to the Authorship bucket).
  4.  **Is this a *reductio*?** Practically, yes. It destroys the mechanism of decision-making. A democracy requires a *demos*—a defined group that can say "we decided." If the "we" changes every time a new policy is proposed, there is no "we."

  However, philosophically, it's not a *reductio*; it's the honest conclusion of liberal universalism. The nation-state is a particularist container trying to hold universalist values. The friction you're seeing is the sound of that container straining.

  **Accident vs. Philosophy: What's Load-Bearing?**

  Here is where I'd draw the line for your piece:

  **Historical Accident (Underdetermined):**
  *   **The Draft:** This is the weakest link. There is no democratic theory that justifies conscripting non-voters. This is pure state survival instinct left over from the era of monarchs. It could be removed without breaking the system.
  *   **Municipal Voting Rules:** Whether a non-citizen can vote in a school board election in Maryland vs. Chicago is largely legislative accident. It doesn't threaten the core theory of the nation-state.
  *   **Expatriate Time Limits:** Whether an expat loses the vote after 10 years or 20 is arbitrary. The principle is that they keep it *at all*; the duration is negotiation.

  **Philosophy (Load-Bearing):**
  *   **Citizenship as the National Gate:** This is the core. The idea that there is a distinction between "citizen" and "resident" is essential to the current model. If you remove this, you no longer have a nation-state democracy; you have a universal jurisdiction or a city-state model scaled up.
  *   **The Exclusion of the "Merely Subjected":** The decision that being subject to the law is *not enough* to claim authorship of the law is the central philosophical claim. It asserts that democracy is about *identity*, not just *justice*.

  **The Pitch:**

  If I were framing this for your column, I'd argue that we pretend our democracies are based on consent (Authorship/Exposure), but they are actually based on **lineage and stability**.

  We tell ourselves the story of the social contract: "We agree to be ruled." But the reality is the story of the household: "You belong to this house, so you have a say. You are staying in this house, so you have to follow the rules, but you don't get to repaint the walls."

  The discomfort you feel comes from trying to apply the logic of the contract to a system built on the logic of the household. The expat is the distant cousin who still gets a vote at the family reunion. The resident is the long-term boarder who pays rent but isn't family. The draftee is the stranger pressed into service to defend the family estate.

  It's not a bug; it's a feature. It allows the state to be democratic for the "family" while remaining sovereign over the "territory." The cost is that it's morally inconsistent. But if you fix the inconsistency—either by letting everyone affected vote (dissolving the state) or by ensuring only those subject to laws vote (disenfranchising expats)—you break the machine.

  So, to answer your final question: The practice is a settlement between rival theories that don't fit. It's a pragmatic hack that prioritizes the continuity of the political community over the moral purity of individual consent. We accept the hypocrisy because the alternative is either global anarchy or a fortress state with no democratic pretenses.

  Does that help untangle the knot?
