  I'm in an undergraduate seminar on formal epistemology, and I owe my advisor a proposal of roughly a thousand words for the term paper (6,000 words, one semester, fortnightly supervision). I have a half-formed idea that I want turned into something I can defend in a meeting next week. Please don't attach a bibliography or any citations — I'll add those myself — and please refer to positions and arguments descriptively rather than by author and year.

  The topic is van Fraassen's Judy Benjamin problem, in the version we used in seminar. A soldier is dropped by parachute into a square territory divided into a friendly half and an enemy half, each of which is subdivided into a headquarters-company region and a second-company region. Write B for friendly, R for enemy, H for headquarters-company, S for second-company. Her prior over the four regions is 3/8 for B∧H, 1/8 for B∧S, 1/8 for R∧H, 3/8 for R∧S, so that P(B) = 1/2, P(H | B) = 3/4, and P(H | R) = 1/4. Over a radio she hears: "If you are in enemy territory, you are in the headquarters-company region" — call this conditional M1. Treated as a proposition of her own algebra, M1 has prior probability 5/8, and conditionalizing on it takes P(B) from 1/2 to 4/5: good news, because the conditional rules out the large enemy/second-company cell.

  Here is my half-formed idea. Every treatment I have seen hands Judy the conditional as flat, certain evidence. But real reception is noisy, and I suspect that once reception is uncertain the standard rules either stop applying or come apart in a way nothing in the seminar settles. Suppose the message might have been either M1 or M2 = "if you are in enemy territory, you are in the second-company region," and she would split 0.9 / 0.1 over which was broadcast. Three things I think I can show, and that I want the proposal to build on:

  First, the candidate messages do not partition her possibility space. M1 and M2 overlap exactly in B and together cover everything, so for any distribution P(M1) + P(M2) = 1 + P(B). So the natural Jeffrey-style move — impose P*(M1) = 0.9 and P*(M2) = 0.1 and otherwise keep the prior's shape — is not merely unmotivated, it is catastrophic: the two constraints together force P*(B) = 0, i.e. certainty of being behind enemy lines, on the strength of a message that is good news on either reading. Jeffrey's rule has nothing to bite on here, because the uncertainty is not uncertainty about a partition of the space the hypothesis lives in.

  Second, the two models of the noise that do make sense give different numbers. If she averages the two updates, she gets P*(B) = 0.9 × (4/5) + 0.1 × (4/7) ≈ 0.78, and note that this does not deliver P*(M1) = 0.9 — it delivers about 0.96, so the rule and the intuition about what the 0.9 was a confidence in come apart. If instead she heard M1 distinctly but distrusts the source (accurate with probability 0.9, otherwise uninformative), the natural single-constraint update gives P*(M1) = 0.9 + 0.1 × (5/8) = 0.9625 and, preserving ratios inside and outside M1, P*(B) = 0.77. Close, but not the same, and I don't know whether the gap is an artifact of these numbers or systematic.

  Third, I can't tell whether the "average the updates" rule is Bayesian conditioning in any joint space containing both a message variable and a location variable, given that in B both candidate conditionals are true and so the story doesn't say which would have been broadcast. That underdetermination in the overlap region looks to me like the real source of the trouble, and it is exactly where I think the paper has to do its work.

  What I want from you is the proposal document, with these sections:

  1. A precise statement of the question, sharp enough that the paper could in principle come out either way. My instinct is that it is something like: when the evidence is a conditional received through a noisy channel, is there a privileged update rule, and does the answer differ depending on whether the noise is in the channel or in the source? But tell me if that is really two questions and I should pick one.

  2. Why the existing positions leave it open. The seminar covered the families of rules for the flat case — conditionalizing on the conditional itself, imposing a constraint and minimizing some distance from the prior, and suppositional rules that treat the antecedent as supposed rather than learned. Argue that all of them presuppose evidence that is a proposition in the same algebra as the hypothesis, and that the standard ways of adjudicating between update rules (diachronic Dutch books, accuracy or scoring-rule arguments, distance minimization itself) inherit that presupposition, so none of them automatically transfers.

  3. The method, laid out month by month for a semester, and why this method rather than the obvious alternatives — why not merely catalogue candidate rules and test them on intuitions, and why not try to settle it by appeal to what real agents would say? Include the formal work (make the joint space explicit, characterize when the naive constraints force the absurd result I sketched, and check whether the two noise models can be made to diverge sharply rather than in the third decimal place) and a decision-theoretic section: Judy has to choose which region to move toward, so how large can the expected-utility difference between the rival rules get, and is there a parameter regime where it matters?

  4. The possible conclusions and what would decide between them. In particular, my advisor's objection is that the whole puzzle dissolves: model the channel properly in a joint space and just condition, and there is nothing left for a philosophical paper to do. I need a section that says what would show that, what would show the opposite (that the choice of channel model is itself a normative, not merely a modelling, decision), and what the middle conclusion would look like.

  5. What would count as the project failing — including the possibility that the rival rules never diverge by enough to matter, or that the only honest result is a taxonomy with no verdict — and an honest scope section: what exactly should I cut if this turns out to be too big for 6,000 words, and which of the four sections is most likely to blow up?
