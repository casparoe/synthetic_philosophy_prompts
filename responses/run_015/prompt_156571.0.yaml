  **Term Paper Proposal: Uncertain Conditionals and the Normativity of Channel Modeling**

  **1. The Research Question**
  The central question of this paper is: *When conditional evidence is received through a noisy channel, does the rational belief update depend on the structural model of the noise, or is there a unique prescription derivable from standard epistemic norms?*

  Specifically, I distinguish two models of uncertainty. In the *channel noise* model, the agent is uncertain which message was transmitted (e.g., "If Enemy then HQ" vs. "If Enemy then Second"), but assumes the transmission mechanism is stochastic. In the *source reliability* model, the agent hears a specific message but assigns a probability less than one to its truth. In the standard Judy Benjamin case, evidence is treated as a certain proposition. My proposal investigates whether splitting this certainty reveals a divergence in normative rules. Is the difference between these models merely a modeling convenience that collapses under rigorous formalization, or does it represent a genuine underdetermination in epistemic norms where rational agents could permissibly diverge?

  **2. Why Existing Positions Leave This Open**
  Standard update rules presuppose that evidence constitutes a proposition within the agent's algebra of hypotheses, typically forming a partition. In the variant I propose, the candidate messages overlap non-trivially. If M1 is "If Enemy then HQ" and M2 is "If Enemy then Second," both are true if the agent is in Friendly territory. Consequently, the sum of their probabilities exceeds one by exactly the probability of being in Friendly territory.

  This structural feature disables the standard tools covered in seminar. Probability kinematics (Jeffrey conditioning) requires a partition; imposing fixed probabilities on overlapping propositions leads to logical inconsistency—in my preliminary calculations, forcing probabilities on both messages simultaneously drives the probability of Friendly territory to zero, an absurd result given the messages are good news. Similarly, distance minimization rules and suppositional updating procedures assume the evidence constraint is coherent and determinate. Diachronic Dutch book arguments and accuracy-based justifications inherit this presupposition of partitioned evidence. None of these frameworks automatically transfer to cases where the uncertainty is about which conditional constraint applies, rather than uncertainty about the truth of a single constraint. The literature settles the flat case but lacks resources for uncertain, overlapping conditional constraints.

  **3. Methodology and Timeline**
  The project will proceed over the semester, aligned with fortnightly supervision.

  *Month 1: Formalization.* I will construct the joint probability space explicitly, containing variables for Location (Friendly/Enemy, HQ/Second) and Message Received (M1/M2). I will characterize the precise conditions under which naive constraints force the absurd result outlined above. The goal is to prove whether this inconsistency is an artifact of the specific numbers or a systematic feature of overlapping conditionals.

  *Month 2: Comparing Update Rules.* I will formalize the "average the updates" rule versus the "source reliability" rule. I will test whether the divergence observed in preliminary calculations (approximately 0.78 versus 0.77 for the probability of Friendly territory) can be amplified by adjusting priors. If the divergence disappears under generalization, the problem dissolves. If it persists, I will identify the parameter regime where the gap is widest.

  *Month 3: Decision-Theoretic Impact.* Epistemic norms should cash out in action. I will model Judy as choosing which region to move toward based on her posterior. I will calculate the expected utility difference between the rival rules. If the divergence is mathematically real but pragmatically negligible, the philosophical stakes are low. If there is a regime where the rules recommend opposite actions, the normative underdetermination is significant.

  *Month 4: Writing and Revision.* I will draft the paper, focusing on the implication of the results for the normativity of modeling choices.

  I choose this method over merely cataloging intuitions because informal verdicts are unstable in complex probabilistic cases. I avoid empirical appeals to what agents *would* say because the project is normative, not descriptive. The formal work is necessary to prove the divergence is not a calculation error, and the decision theory is necessary to prove it matters.

  **4. Possible Conclusions**
  There are three live outcomes.

  *First (The Dissolution):* My advisor suggests that modeling the channel properly in a joint space and conditionalizing resolves everything. If my formalization shows that once the message variable is included, standard conditionalization yields a unique result regardless of how we interpret the noise, then the paper concludes that the puzzle was a modeling error. There is no special rule for uncertain conditionals, only careful modeling.

  *Second (The Normative Gap):* If different joint space models (channel vs. source) are equally valid descriptively but yield different posteriors, then the choice of model is itself a normative decision not settled by probability theory. This would suggest that standard epistemology is incomplete regarding uncertain structural evidence.

  *Third (The Pragmatic Middle):* The models diverge, but only in parameter regimes that are practically irrelevant. The conclusion would be that while the rules are technically distinct, they are robustly equivalent for agents with realistic priors.

  I intend to argue for the second or third conclusion. To defend against the dissolution objection, I must show that the choice between a "noisy channel" model and a "unreliable source" model is not dictated by the physical facts alone but involves a normative judgment about how to represent the evidence.

  **5. Failure Conditions and Scope**
  The project fails if the rival rules never diverge by more than a negligible margin, or if the only honest result is a taxonomy of rules with no verdict on which is correct. If the divergence is confined to the third decimal place, the decision-theoretic section will show the problem is philosophically inert.

  Regarding scope, the project is tight for 6,000 words. The section most likely to expand uncontrollably is the literature review of existing update rules. I will restrict this to the specific failure of partition-based rules. If the formal work becomes too dense, I will cut the decision-theoretic section and focus on the formal divergence itself, though this weakens the normative stakes. Alternatively, if the divergence proves negligible, I will pivot to a conceptual analysis of why the models diverge at all, rather than quantifying the gap. The core commitment is to establish whether the modeling choice is normative; the magnitude of the divergence is secondary to the existence of the choice.
