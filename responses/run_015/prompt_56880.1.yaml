answer: |-
  Dear Parent,

  It is a heavy thing to carry, this suspicion that the child you know as one might be many, and I understand why the neuropsychologist's casual phrase lodged in your mind like a splinter. You have constructed an argument that is logically valid, in the sense that if the premises hold, the conclusion follows, but I believe I can show you where the soundness fails without asking you to abandon your intuition that your son is a single, intact boy. The trouble lies not in your love, which is clear, nor in your grasp of the data, which is accurate, but in the definition of a subject of experience that you have adopted in the first premise, and the subtle equivocation that occurs when you apply it to ordinary brains in the fifth.

  You ask which step to reject, and while the fifth premise does some heavy lifting that it cannot support, the true fault line runs through the first. Your first premise states that if a body houses two centres of control with mutually closed information, it houses two subjects. This looks unimpeachable because it appeals to a very natural picture of the mind, often called the Cartesian Theatre, where there is a little screen inside the head and a viewer watching it. If you have two screens and two viewers who cannot see each other's displays, it seems obvious you have two people. But this picture is false to the phenomenology of ordinary life. You do not need total informational access to be a single subject. Consider your own blind spot, or the way your liver processes toxins without your knowledge, or the way you might repress a painful memory for years only to recall it later. In all these cases, information is closed to your reporting system, sometimes in principle, sometimes in practice, yet you do not become a different subject when the memory returns. The criterion for being a single subject is not the transparency of all mental contents to a central reporter, but the ownership of those contents by a single living organism that integrates them over time. By defining the subject solely by moment-to-moment informational access, Premise One sets a bar that no human being clears, which forces the absurd conclusion in Premise Six that we are all a multitude.

  This leads directly to the weakness in Premise Five, where you equate the architectural severing of the corpus callosum with the functional limitations of an intact brain. There is a difference in kind, not merely degree, between a bridge that has been demolished and a bridge that is congested. In the ordinary brain, if you fail to notice a change in a visual scene, it is usually because attention was elsewhere, not because the information was physically barred from reaching the language centres; with sufficient cueing or time, that information can typically be integrated. In your son's case, the surgical severance creates a structural barrier that prevents specific sensory data from ever reaching the speaking hemisphere under controlled conditions. However, as you noted, the subcortical connections remain, and in the flow of daily life, these older pathways allow for a unity of purpose and affect that the laboratory tests isolate and disrupt. The laboratory creates an artificial environment that forces the hemispheres to act independently, much like tying one of your hands behind your back forces you to act one-handed; it reveals a capacity for disunity, but it does not prove that you are two people when you are washing dishes. The gap between the clinic and the lab exists precisely because the person is more than the sum of the momentary informational access of their hemispheres.

  You asked me to price the alternatives, and I shall do so plainly. The suggestion that your son is both one person and two, depending on the context, is a pragmatic solution often favoured by neurologists, but it carries a high metaphysical cost. It requires us to say that personhood is a matter of convenience rather than fact, which may help in the clinic but offers little comfort in the living room. It saves the phenomena but dissolves the reality you are trying to protect. The reductionist line, on which identity was never what mattered, is philosophically robust but emotionally barren; it tells you that there is no deep self to be split, only a bundle of processes, which might relieve the anxiety of duality but at the price of making your son's unique identity an illusion. The view that consciousness is unified simply by belonging to a single subject, and that one brain supports only one subject, is the view you wish to hold, and it is defensible if we understand the subject as the whole organism rather than the speaking hemisphere. The cost here is that you must accept that consciousness is not as unified as it feels; you must admit that your son has pockets of experience that he cannot speak about, without admitting that those pockets belong to someone else. Finally, the view that the laboratory dissociations do not show two fields of consciousness at a single moment argues that the right hemisphere's responses are unconscious automatisms, like a reflex. This preserves unity but risks denying the evident sophistication of the right hemisphere's reactions, which seem too rich to be mere reflex.

  Of these, the most tenable position is that your son is one person whose conscious field has an unusual architecture. The principled line between the disunity that makes two subjects and the disunity present in everyone is the line between structural impossibility and functional limitation. In you, any mental content can, in principle, be brought into relation with any other content given the right conditions of attention and time. In your son, there are specific channels of communication that are physically closed. Yet, because personhood is a temporal concept, woven from memory, intention, and social relation over years rather than milliseconds, the structural gap does not create a second person. A person is not a snapshot of informational access; a person is a life. Your son has one life, one history, one set of legal and moral responsibilities, and one body that moves through the world with a singular purpose. The fact that the internal machinery of that life has been rerouted does not multiply the traveller.

  So, to answer your final question without flattery: the argument is bad, not because the logic is flawed, but because the first premise relies on a definition of selfhood that is too narrow to capture what we mean by a person. You are not unwilling to accept a truth that happens to be true; you are correctly resisting a category error that conflates the modularity of the mind with the multiplicity of the self. The neuropsychologist spoke of halves because that is the shorthand of the trade, but the trade deals in mechanisms, not persons. You deal with your son, and in that context, the unity that matters is the unity of the boy who quarrels with you, drives, and remembers his past, not the unity of the neural pathways that fire when he names an object. You may put the phrase down now, for it describes a mechanism that is indeed split, but it does not describe the child who is, and remains, one.
