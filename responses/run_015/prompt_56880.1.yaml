      *   But consciousness isn't a room. It's a process.
      *   Premise 1 is the culprit. It defines a subject by *mutual knowledge*. But I don't know everything my body knows (immune system, gut). Am I two subjects? No.
      *   Premise 5 conflates *structural* isolation with *attentional* limits.
