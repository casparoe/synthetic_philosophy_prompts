answer: |-
  A couple, Mark and Sarah, sit across from a bureaucrat at the Department of Consciousness Consolidation. They want to file a "Joint Consciousness Return," which requires them to legally qualify as a single macro-conscious entity under the Phenomenal Merger Law.

  The bureaucrat, Dr. Qualia, adjusts his glasses. "Let's review the statute. To merge, you must share *precisely one* qualitative feature. You must be otherwise entirely disjoint in experiential content. And upon merger, neither original first-person perspective survives. A new entity is created. The old ones are extinguished. Do you understand the stakes?"

  Mark nods. "We're tired of arguing. We want to be one mind."

  "Very well," says Dr. Qualia. "List your current qualia."

  Mark: "I feel 'Love', 'Hunger', and the 'Pressure of this chair'."

  Sarah: "I feel 'Love', 'Fullness', and the 'Pressure of this chair'."

  Dr. Qualia holds up a hand. "Stop. You share 'Love'. You also share 'Pressure of this chair'. That is two shared features. Merger denied. You remain separate subjects."

  Mark shifts uncomfortably. "I'll stand up. Now I don't feel the chair."

  Sarah: "I'll stay seated. Now we share only 'Love'."

  Dr. Qualia: "Wait. Do you both feel 'Temporal Duration'?"

  Mark: "We're both here now."

  Sarah: "Yes."

  Dr. Qualia: "That is a shared temporal qualia. That makes two: 'Love' and 'Duration'. Merger denied."

  Mark sighs. "How do we stop experiencing time?"

  "You cannot," says Dr. Qualia. "But you can attempt to make your temporal experiences disjoint. One of you must experience an eternal instant, the other a fleeting second. But then you cannot coordinate the signing of the form."

  Sarah leans forward. "What if we strip everything else away? We both focus only on 'Love'. Nothing else. No time, no space, no self."

  "If you successfully experience *only* 'Love'," says Dr. Qualia, "and nothing else, then you share exactly one feature. You are otherwise disjoint. The merger would trigger. But remember: the 'you' that desired this merger ceases to exist. The new entity inherits the tax liability but not the memory of earning it."

  Mark pales. "So if we succeed, we die?"

  "Technically, the perspectives are extinguished," says Dr. Qualia. "Composition by extinction."

  Sarah looks at Mark. "Hon, if we merge, who pays for the session?"

  "The new entity," says Dr. Qualia. "But the new entity has no wallet. The old ones are gone."

  Mark stands up abruptly. "Okay, change of plans. We don't want to merge."

  "Too late," says Dr. Qualia. "Do you both feel 'Relief'?"

  Mark and Sarah exchange a glance. "Yes."

  "Do you both feel 'The floor beneath your feet'?"

  "Yes."

  Dr. Qualia stamps a form. "Two shared features: 'Relief' and 'Floor'. You are legally distinct. No merger possible."

  Mark exhales. "So we're safe?"

  "Safe from unity," says Dr. Qualia. "You share too much to ever truly become one. It's the Combination Problem. You're stuck with each other."

  Mark takes Sarah's hand. "Well, at least we're still us."

  Sarah squeezes back. "Do you feel 'Hand-holding'?"

  "Yes."

  "Do you feel 'Warmth'?"

  "Yes."

  Dr. Qualia looks up sharply. "That's two shared features. 'Hand-holding' and 'Warmth'. You are definitely not merging."

  Mark smiles. "Good. Let's go home."

  "As you leave," calls Dr. Qualia, "do you both feel 'Exit'?"

  "Yes!" they say in unison.

  "And 'Hope for Dinner'?"

  "Yes!"

  "Two shared features," Dr. Qualia mutters, shredding their application. "Thank goodness. I hate processing widows."
