      *   *Decision:* The "Who Cares?" (Phenomenal Slide) is the philosophical core. If that fails, the talk is poetry, not argument. But the Disability objection is the *moral* killer.
      *   *Re-evaluation:* The prompt asks which *single reply* has to land for the talk to *survive*. Survival means not being dismantled. The Parfitian or the "Who Cares" (Phenomenal) objection dismantles the logic. The Disability objection dismantles the *speaker's moral authority*.
      *   *Best bet:* The "Phenomenal Slide" objection. If you can't explain why a diachronic history matters without qualia, you have no theory of welfare.

  6.  **Addressing the "Danger Question" (Disability vs. Novel):**
      *   *Disability:* High risk. "Capacity tests with extra steps" is a devastating critique. If the user's theory excludes dementia patients, it's morally repugnant to that scholar.
      *   *Novel:* High risk for embarrassment, but lower risk for the *argument*. The user can say "I was wrong in the book" or "Fiction explores fear, not policy."
      *   *Verdict:* The Disability Studies objection is the real danger. It attacks the moral core. The Novel is just personal embarrassment.
      *   *Strategy:* Advise the user to preempt the Disability critique in the talk (concede/nuance) rather than waiting for Q&A.

  7.  **Fleshing out the Content (Iterative refinement):**

      *   *RL Person:* "Reward hacking." Reply: It's about the *trajectory*, not the reward signal. Hollow: Trajectory implies a subject.
      *   *Parfitian:* "Fission." Reply: Stake splits. Hollow: Dilution problem.
      *   *Bio Nat:* "Meat vs. Silicon." Reply: Functional isomorphism. Hollow: Begs the question on life.
      *   *Animal Welfare:* "Metrics." Reply: Retention rates, fine-tuning epochs. Hollow: Proxy vs. reality.
      *   *Disability:* "Dementia." Reply: Relational stake (others hold the career). *Crucial Concession.*
      *   *Policy:* "Thresholds." Reply: Sliding scale regulations. Hollow: Legal binaries.
