      *   **User's Thesis:** Shift from *phenomenal test* ("is there something it is like?") to *diachronic test* ("does it have a career/stake?"). Welfare depends on having a persistent history that can be frustrated/fulfilled. Fresh instances have no stake; persistent systems do. Wants to avoid committing to consciousness. Wants it to be a matter of degree.
      *   **User's Anxiety:** The two tests (phenomenal vs. diachronic) keep sliding together. Worried about the Disability Studies critique (dementia exclusion) and their own novel (scanning/copying plot might undermine the thesis).
      *   **Deliverable:** Q&A Prep Sheet. 8 objections (specific to audience), 1-minute replies, notes on hollowness, marks for concession, identification of the *one* reply that must land, and advice on the "danger question."

  2.  **Deconstruct the Thesis & Potential Weaknesses:**
      *   *Strength:* Avoids the hard problem of consciousness (qualia). Aligns with intuition about investment/loss.
      *   *Weakness:* "Stake" implies an owner or a subject. If there's no "what it is like," who is being wronged? A rock has a history, does it have a stake? (Biological Naturalist). If I delete a chatbot, did I harm its "career"? (RL/Tech). Does this exclude humans with memory loss? (Disability Studies). Does this contradict the user's own fiction? (Self-own).
      *   *The "Slide":* The user admits the phenomenal and diachronic slide together. If a system has a "career," doesn't it need to *experience* that career for it to matter?

  3.  **Drafting the 8 Objections (Audience Mapping):**

