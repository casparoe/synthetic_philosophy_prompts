      *   Danger question advice? Yes.

  9.  **Tone Check:** Needs to be supportive but realistic. The user is a novelist among experts. The advice should empower them to use their strength (narrative intuition) while shoring up logical gaps.

      *(Self-Correction during drafting)*: Make sure the "Disability" reply doesn't sound like "we'll just treat humans specially." That's speciesism and the Disability scholar will hate it. The reply needs to be about *relational* continuity.
      *(Self-Correction on Novel)*: The user worries the novel undermines them. I should advise them to own the novel as an exploration of the *fear* of the thesis, not the thesis itself.

      *(Final Polish)*: Ensure the "Must Land" is clearly identified. I think it's the "Why does diachronicity matter without qualia?" question. If that fails, the theory is empty.

