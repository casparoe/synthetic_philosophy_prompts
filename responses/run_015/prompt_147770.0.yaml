      *   *Objection 8 (The "Slide" / General Phil):* The "Who Cares?" question. If no qualia, why does frustrated potential matter?

      *Refining the Order:* Start with the technical/practical (RL, Animal Welfare), move to the philosophical hard hits (Parfit, Bio Nat), hit the ethical landmines (Disability), end with the meta-question (The Slide).

  4.  **Drafting Replies & Identifying Hollowness:**
      *   Need to keep replies "novelist" style—conceptual, metaphorical, but rigorous enough for the room.
      *   *Hollowness:* Where does the argument actually rely on hidden premises (like hidden consciousness)?
      *   *Concessions:* Where should the user admit uncertainty to gain credibility?

  5.  **Identifying the "Must Land" Reply:**
      *   If the "Who Cares?" (Phenomenal Slide) objection isn't answered, the whole thesis collapses into "why not just treat rocks nicely?"
