      *   *Step (9) Nuance:* The user mentions "specialist's judgment." This hints at weighted signals. If signals have different precision, cascades still happen but take longer.
      *   *The "Nothing to Fix" claim:* This is the most dangerous part. Just because behavior is a Nash Equilibrium doesn't mean the mechanism is optimal. The Prisoner's Dilemma is "rational" but we still want to fix the incentives.

  7.  **Structure of the Response:**
