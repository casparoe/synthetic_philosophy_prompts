      *   **Confidence & Uncertainty:** High confidence on theory, flag the specific payoff/reputation dynamics as the uncertainty.

  8.  **Final Polish:** Ensure tone is respectful of the user's clear grasp of the logic. Use the "angel syndicate" context to ground the theory. (e.g., mention that in investing, being right 51% of the time isn't enough if the losses are huge, but the cascade logic holds on the binary decision).

