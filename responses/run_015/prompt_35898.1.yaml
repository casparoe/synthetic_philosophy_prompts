      *   In Medical, Pre-Test says "Follow Policy (Treat if Pos)." Local (Post-Test Pos) says "Treat." Alignment.
      *   So the paralysis only happens when Pre and Local diverge.
      *   They diverge only when there is Subjunctive Dependence across branches.
      *   This confirms the "Subjunctive Dependence" boundary.

      *   *Final check on D.'s Follow-up:* "If the answer is that you may condition on observations except when they tell you something about worlds other than the one you're acting in..."
