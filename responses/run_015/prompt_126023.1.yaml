answer: |-
  While no single universally standardized term exists, this phenomenon is rigorously categorized in ethical literature as **structural coercion** or **consent under wrongful background conditions**, and while traditionally upheld as valid under procedural theories, contemporary accounts of substantive autonomy increasingly argue it should function as a distinct invalidator when background conditions systematically eliminate meaningful alternatives.

  This concept emerges from the "baseline problem" in coercion theory, where standard definitions (such as those by Robert Nozick or Alan Wertheimer) require a specific agent to threaten a worsening of conditions relative to a moral baseline. In the scenarios you describe, no specific agent issues a threat; rather, the background conditions themselves—the uniformity of medical protocols or digital market structures—render the baseline unjustly restrictive. This is distinct from ordinary coercion, which is interactional and agent-specific, and distinct from collective coercion, which implies conspiratorial agency. Instead, it is a property of the system itself, often analyzed under Iris Marion Young's framework of **structural injustice**, where constraints arise from the aggregated actions of many individuals and institutions rather than a single coercer.

  The relationship to adaptive preferences is constitutive rather than incidental. As theorized by Jon Elster and Martha Nussbaum, adaptive preferences occur when individuals adjust their desires to align with available options to reduce psychological dissonance. In structurally constrained environments, a patient or user may genuinely come to prefer the risky procedure or the data terms because the alternative (no care, no digital participation) is catastrophic. This internalization makes the consent procedurally robust—the agent affirms the choice—but substantively hollow, because the preference formation process was distorted by the lack of viable alternatives. The consent tracks adaptation to necessity rather than an independent valuation of the arrangement.

  Whether this should treat consent as invalid depends on the threshold of autonomy employed. Procedural accounts, dominant in law and some bioethics, validate the consent because the immediate transaction lacks force or fraud; to invalidate it would paralyze essential services where uniformity is inevitable. However, substantive accounts of autonomy, such as those by Onora O'Neill or Faden and Beauchamp, argue that autonomy requires not just understanding and voluntariness, but also **meaningful choice**. Under this view, if the structure removes all reasonable alternatives, the capacity for self-determination is compromised regardless of the agent's psychological state. Consequently, many contemporary ethicists argue this should be treated as a distinct invalidator, or at least a degradator of consent, shifting the moral burden from the individual's signature to the justice of the structural conditions enabling the choice.
