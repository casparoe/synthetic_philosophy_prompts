  The Bureau of Interpersonal Welfare Calibration occupied the fourth floor of the Ministry of Harmonized Metrics, a space dominated by the hum of servers and the confident ticking of a clock that measured nothing in particular. Director Vane stood before the whiteboard, marker in hand, addressing the staff regarding the Quarterly Happiness Subsidy allocation.

  "We have solved the identification problem," Vane announced, underlining the word *Normalization*. "Previously, we could not compare Citizen A's utility to Citizen B's because their scales lacked a common origin and unit. Effective immediately, every citizen's utility function $U$ is rescaled to $U'$ such that $U'(\text{Event}_1) = 0$ and $U'(\text{Event}_2) = 1$. We then measure their current well-being against this standardized metric."

  The first candidate pair was Arthur and Beatrice. Arthur was a stoic monk who found all sensory experiences roughly equivalent; Beatrice was a gourmand who experienced life in extreme peaks and valleys.

  "Protocol Alpha," Vane declared. "Anchor Zero is 'Sipping Lukewarm Water.' Anchor One is 'Sipping Hot Water.'"

  The technicians ran the numbers. For Beatrice, the difference between lukewarm and hot water was significant but contained; her scale stretched naturally. For Arthur, who perceived no difference whatsoever between the two temperatures, the imposed interval of '1 util' was compressed into a microscopic sliver of actual preference intensity. Consequently, when the bureau measured Arthur's current state—'Listening to a Bird'—the value exploded. Since the unit was tiny, any positive experience registered as massive.

  "Arthur's current welfare is 4,500 standardized utils," a technician read. "Beatrice's is 1.2. Arthur receives the subsidy."

  Beatrice lodged a formal appeal, citing the arbitrariness of the thermal anchors. The Bureau accepted the appeal on procedural grounds and initiated Protocol Beta.

  "Protocol Beta," Vane said, erasing the board. "We acknowledge thermal sensitivity is unevenly distributed. New Anchor Zero: 'Missing the Bus.' New Anchor One: 'Catching the Bus.'"

  The technicians ran the numbers again. This time, Arthur cared deeply about punctuality; the gap between missing and catching the bus represented a genuine chasm in his preference ordering. His unit was now large, shrinking the value of 'Listening to a Bird' down to a modest 0.8 utils. Beatrice, however, owned a private car and was entirely indifferent to public transit schedules. For her, the difference between Missing and Catching was nonexistent, yet the Bureau forced it to equal 1 util. Her unit compressed into nothingness. When measured against 'Listening to a Bird,' her welfare score skyrocketed.

  "Beatrice's current welfare is 3,200 standardized utils," the technician said, not looking up. "Arthur's is 0.8. Beatrice receives the subsidy."

  Director Vane capped the marker. "Excellent. The model is robust. The reversal confirms the sensitivity of the calibration. Send the check to Beatrice."

  ***

  **Note on Theoretical Status**
  Among specialists, it is settled that ordinal utility functions license no interpersonal comparisons, and that even cardinal (von Neumann-Morgenstern) utility functions are determined only up to a positive affine transformation, leaving origins and units arbitrary across persons. What remains genuinely contested is whether this arbitrariness reflects a lack of knowledge (an epistemic problem) or a lack of fact (a metaphysical problem); experts disagree on whether empirical measures (e.g., neuroscience) or specific normative conventions could ever render interpersonal comparisons determinate rather than merely stipulative.
