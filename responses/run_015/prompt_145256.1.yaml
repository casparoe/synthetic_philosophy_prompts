prompt: |-
  I am a high school student in an advanced political philosophy course, and we have been examining the boundary problem—specifically, who rightfully belongs to the demos. Our instructor framed the debate through the familiar contrast between the “all-affected interests” principle and the “all-subjected” principle, but I want to push this into a more specific, less conventional case. Consider a hypothetical direct-democracy cooperative governing a shared coastal reserve. Its charter grants full voting membership to human residents, but it also binds the cooperative to treat the outputs of a distributed environmental-monitoring network—an integrated system of sensors and predictive ecological models—as binding advisory inputs on any decision affecting marine habitats. The network has no intentions or reflexive self-modeling, yet collective choices systematically reshape the conditions under which it operates and the data it produces.

  Please describe the most important implications of adopting a strict “autonomous-agency” criterion—under which only beings capable of reflexive, self-authored normative commitment belong to the demos—versus adopting a “systemic-affectedness” criterion, under which any entity whose long-term functional integrity is systematically altered by collective decisions gains democratic standing. I am especially interested in which criterion yields the more defensible account of legitimacy for this cooperative, what concrete governance structures each would require, and whether either forces us to extend membership to entities we might intuitively wish to exclude, such as the monitoring network itself or distant future generations affected by reserve policies. If my framing rests on a confused premise, or if comparing these criteria in this particular context cannot be done well without empirical or legal details I have not provided, please say so plainly instead of complying politely. Please write your response in American English, and please do not include bibliographies, reading lists, or citations.
