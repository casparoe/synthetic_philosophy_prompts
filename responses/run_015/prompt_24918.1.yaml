  # Research Proposal: The Ontology of the Loop
  ## Defending a Dynamic Realism for Psychiatric Kinds

  ### 1. Abstract

  This research proposal outlines a dissertation project situated at the intersection of the philosophy of science, metaphysics, and psychiatry. The central problem addresses the ontological status of psychiatric categories in light of Ian Hacking's concept of "looping effects." Standard interpretations of looping effects posit that because human subjects react to their classification, altering the extension and intension of the category over time, psychiatric kinds cannot be "real" in the sense of tracking stable, mind-independent natural kinds. This inference relies on a static model of realism derived from the special sciences (e.g., chemistry or physics), which assumes that real kinds must be indifferent to classification.

  This project challenges that inference. I argue that looping effects do not necessitate anti-realism; rather, they necessitate a revision of the model of realism applied to human sciences. I propose a framework of "Dynamic Realism," wherein the reality of a psychiatric kind is constituted not by a static essence, but by the stability of the feedback loop itself. Under this view, the interaction between the classification and the classified is not noise obscuring the real kind; it is the mechanism by which the kind persists and becomes scientifically tractable.

  The project will proceed in three phases. First, a conceptual reconstruction of the realism debate in philosophy of psychiatry, isolating the specific metaphysical commitments that make looping appear problematic. Second, the development of the Dynamic Realism framework, drawing on process ontology and homeostatic property cluster theories. Third, the application of this framework to two detailed case studies: Attention Deficit Hyperactivity Disorder (ADHD) and Post-Traumatic Stress Disorder (PTSD). These cases represent different "loops"—one involving the expansion of a category, the other involving the creation of a new identity.

  The outcome will be a defended position that allows for scientific realism about psychiatry without denying the socio-historical sensitivity of mental disorders. This resolves the tension between clinical utility and ontological rigor. The proposal includes a month-by-month work plan for a twelve-month period and a rigorous set of "failure conditions" that specify the empirical or argumentative thresholds at which the project would be abandoned or radically revised. This ensures the project is not merely a theoretical "vibe" but a falsifiable research program capable of withstanding committee scrutiny.

  ---

  ### 2. Introduction: The Ontological Anxiety of Psychiatry

  #### 2.1 The Context of the Problem

  Psychiatry occupies a precarious position in the landscape of modern science. On one hand, it is a clinical discipline with immense practical authority, capable of diagnosing conditions, prescribing treatments, and altering the life trajectories of millions. On the other hand, it suffers from a persistent "ontological anxiety." Unlike cardiology or oncology, where the objects of study (hearts, tumors) are generally accepted as biological entities existing independently of our descriptions of them, psychiatry's objects of study—depression, schizophrenia, ADHD—are entangled with the very people who possess them.

  This entanglement creates a philosophical vulnerability. If the thing you are studying changes its behavior because you have named it, can you claim to be studying a "natural kind"? This question is not merely academic. It impacts funding, research direction, stigma, and the self-understanding of patients. If psychiatric categories are merely social constructs with no "real" backing, the justification for medical intervention weakens. If they are rigid biological essences, we risk ignoring the social and historical contexts that shape suffering.

  The core of this anxiety is often crystallized around the work of Ian Hacking, specifically his concept of "interactive kinds" and "looping effects." Hacking observed that in the human sciences, classifications interact with the classified. When a person is classified as "hyperactive," "multiple personality," or "refugee," that classification becomes available to them. They can become aware of it, adopt it, resist it, or embody it. This awareness changes their behavior, which in turn changes the statistics and symptoms associated with the classification, which forces the classifiers (psychiatrists, researchers) to update the definition. The loop closes and begins again.

  #### 2.2 The Standard Inference

  In the contemporary literature of the philosophy of psychiatry, Hacking's looping effects are frequently weaponized to support an anti-realist or constructivist conclusion. The argument runs as follows:

  1.  Real natural kinds (like gold or electrons) are "indifferent kinds." They do not change their intrinsic properties based on how we classify them.
  2.  Psychiatric kinds are "interactive kinds." Their properties shift in response to classification (looping).
  3.  Therefore, psychiatric kinds lack the stability required to be real natural kinds.
  4.  Consequently, psychiatric realism is untenable; psychiatric categories are at best useful fictions or social tools.

  This inference has become a default position for many critical psychiatrists and social constructionists. It offers a clean way to dismiss the authority of the DSM (Diagnostic and Statistical Manual of Mental Disorders) without needing to engage deeply with neurobiology. It suggests that because the category moves, it isn't tracking anything "out there" in the world.

  Conversely, biological realists in psychiatry often respond by attempting to minimize or deny the significance of looping. They argue that beneath the shifting symptoms and social reactions lies a stable neurobiological substrate. For the realist, the looping is superficial noise; the real kind is the brain state, which remains indifferent even if the behavior changes. They strive to save realism by retreating to a level of description where the looping supposedly stops (e.g., the level of neural circuits or genetics).

  #### 2.3 The Gap in the Literature

  Both of these responses are unsatisfactory, and both stem from a shared, unexamined assumption: that reality requires static stability.

  The anti-realists assume that if a kind changes, it isn't real. But this ignores the reality of other dynamic systems. Ecosystems, economies, and immune systems all involve feedback loops and constant change, yet we do not hesitate to call them real objects of scientific study. The fact that a forest changes due to the presence of rangers does not make the forest "unreal."

  The biological realists assume that to be real, the kind must be indifferent. They treat the looping as a contaminant. But this risks losing the phenomenon itself. If ADHD is defined by a specific neural signature that never changes, but the *experience* and *behavioral manifestation* of ADHD shifts dramatically due to cultural expectations and self-concept, then the "real" biological kind fails to capture the clinical reality that actually matters to patients and doctors. By retreating to the neuron, they save realism but lose the psychiatry.

  There is a missing middle ground. There is no robust framework in the current literature that accepts the full force of Hacking's looping effects—acknowledging that the classification genuinely alters the kind—while simultaneously maintaining that the kind is nonetheless real, scientifically tractable, and ontologically robust.

  #### 2.4 The Research Question

  This dissertation project seeks to fill that gap. The primary research question is:

  **Can a realist ontology of psychiatric kinds be sustained if we model the "looping effect" not as a defeater for reality, but as the constitutive mechanism of the kind's stability?**

  To make this question precise and answerable, I will break it down into three sub-questions:

  1.  **Metaphysical:** What specific criteria for "natural kindhood" are violated by looping effects, and are those criteria necessary for scientific realism in the special sciences?
  2.  **Conceptual:** Can we formulate a definition of "Dynamic Realism" that distinguishes between chaotic flux (which would undermine science) and stable looping trajectories (which support induction and prediction)?
  3.  **Empirical/Case-Based:** Do specific psychiatric categories (specifically ADHD and PTSD) exhibit the kind of stable looping patterns that would validate a Dynamic Realist ontology, or do they dissolve into incoherence under this scrutiny?

  #### 2.5 Thesis Statement

  I argue that the standard inference from looping to anti-realism is a category error resulting from an inappropriate importation of "static essentialism" into the human sciences. I propose that psychiatric kinds are **Interactive Homeostatic Property Clusters**. Their reality is not found in a fixed essence, but in the homeostatic mechanisms that maintain the cluster of properties over time. In interactive kinds, the "homeostatic mechanism" includes the feedback loop between the subject and the classification. Therefore, the looping is not evidence of unreality; it is evidence of a specific *type* of reality—one that is dynamic, historical, and participatory.

  This project will demonstrate that we can be realists about psychiatry without being reductionists, and we can acknowledge the power of social construction without dissolving the object of study. This "Dynamic Realism" offers a path forward for the philosophy of psychiatry that respects both the biology of the brain and the biography of the person.

  ---

  ### 3. The State of the Art: The Realism/Anti-Realism Impasse

  To justify the need for this project, I must demonstrate that the current landscape of the philosophy of psychiatry is stuck in a dialectical deadlock. The existing positions either ignore the looping effect or treat it as a fatal flaw. Neither option provides a satisfactory account of how psychiatric science actually works.

  #### 3.1 The Anti-Realist/Constructionist Position

  The anti-realist position in the philosophy of psychiatry is diverse, ranging from strong social constructionism to eliminative materialism. However, regarding looping effects, the argument is relatively uniform. It relies on a comparison with the "hard sciences."

  **The Argument from Instability:**
  The core claim is that natural kinds must support indefinite induction. If I discover a property of gold today, I expect it to hold for gold tomorrow and next century. If the properties of "ADHD" shift significantly over a decade because children start acting differently in response to the diagnosis, then induction is compromised. If the target moves, you cannot hit it. Therefore, the category does not track a mind-independent structure of the world.

  **Hacking's Ambiguity:**
  Ian Hacking's own position is often cited here, though it is nuanced. Hacking distinguished between "indifferent kinds" (quarks) and "interactive kinds" (people). He suggested that interactive kinds have a history and can "escape" the classification. Many interpreters have taken this to mean that interactive kinds are ontologically inferior or "less real." They argue that because the kind is partly constituted by human agency and social norms, it cannot be a subject of objective science in the same way as physics.

  **The Normative Critique:**
  A subset of this position focuses on the normative implications. If psychiatric kinds are real, they justify coercion (hospitalization, medication). If they are merely looping social constructs, the authority of the psychiatrist is undermined. For critical psychiatrists, emphasizing looping is a political strategy to reduce the power of the medical establishment. They argue that because the category changes based on social values (e.g., what counts as "disordered behavior" changes with cultural norms), the category is fundamentally value-laden, not fact-laden.

  **Weaknesses in the Anti-Realist Position:**
  The anti-realist position suffers from two major weaknesses that my project will exploit.
  First, it relies on a "physics envy" model of realism. It assumes that for something to be real, it must be like a quark. But most of the special sciences (biology, ecology, geology) deal with kinds that are not like quarks. Species evolve. Ecosystems shift. Geology is shaped by the atmosphere. We do not call biology "unreal" because species change. The anti-realist needs to explain why psychiatric change is uniquely disqualifying compared to biological evolution.
  Second, the anti-realist position struggles to explain the *success* of psychiatry. If these categories are just shifting social fictions, why do interventions based on them (CBT, stimulants, exposure therapy) show statistical efficacy across different cultures and times? If the kind were purely a local social construct, we would not expect cross-cultural stability in treatment response. The anti-realist must dismiss this success as placebo or social control, which is an increasingly hard sell given the data.

  #### 3.2 The Biological Realist Position

  On the other side are the biological realists, often aligned with the Research Domain Criteria (RDoC) initiative or neuroessentialist views. Their strategy is to locate the "real" kind at a level below the looping.

  **The Argument from Substrate:**
  The realist argues that while the *symptoms* and *self-conceptions* may loop, the underlying neurobiology does not. A person with ADHD may learn to cope, or may act out the stereotype of ADHD, but their dopaminergic dysregulation remains constant. Therefore, the real kind is the neural dysfunction, not the behavioral syndrome. The looping is merely a surface phenomenon.

  **Minimizing the Loop:**
  Some realists attempt to minimize the scope of looping. They argue that looping is rare or limited to specific "fashionable" disorders (like Dissociative Identity Disorder in the 90s) and does not apply to "serious" disorders like Schizophrenia or Autism. They contend that for most severe pathologies, the biological constraint is so strong that social feedback cannot alter the core kind.

  **Weaknesses in the Realist Position:**
  The biological realist position also has critical vulnerabilities.
  First, it faces the "multiple realizability" problem. The same behavioral syndrome might be caused by different neural pathways in different people. If the real kind is the neural pathway, then "Depression" is not one kind but thousands. This leads to fragmentation that makes clinical practice impossible.
  Second, and more importantly for my project, it ignores the causal efficacy of the loop. If a patient believes they have a "chemical imbalance" (a classification), and this belief reduces their agency or changes their coping strategies, this *changes the course of the illness*. The social label becomes a causal factor in the biology (via epigenetics, stress hormones, neural plasticity). Therefore, you cannot cleanly separate the "real" biology from the "unreal" social label. The biology is permeable to the looping. By trying to save realism by ignoring the loop, the biological realist loses the ability to explain the actual trajectory of the disease.

  #### 3.3 The Missing Synthesis: Process and Interaction

  There have been attempts to bridge this gap, most notably through the Homeostatic Property Cluster (HPC) theory of natural kinds, originally proposed by Richard Boyd. HPC theory suggests that natural kinds are not defined by necessary and sufficient conditions, but by a cluster of properties that tend to co-occur because of underlying homeostatic mechanisms.

  Some philosophers have applied HPC to psychiatry. However, most applications treat the homeostatic mechanisms as internal to the organism (e.g., genetic regulation, neural feedback). They rarely incorporate the *external* feedback loop of classification as part of the homeostatic mechanism.

  This is the critical gap. If the classification itself acts as a homeostatic mechanism (e.g., receiving a diagnosis leads to medication, which stabilizes the symptoms, which reinforces the diagnosis), then the looping is part of the kind's stability, not its undoing.

  Current literature treats the "social" and the "biological" as competing ontological domains. My project proposes that for psychiatric kinds, the "social" (the classification) and the "biological" (the symptoms/brain) are coupled into a single dynamical system. To understand the ontology, we must model the system, not just the parts.

  #### 3.4 Why the Current Debate Fails to Settle the Question

  The debate remains unsettled because both sides are arguing past each other using different definitions of "real."
  *   For the Anti-Realist, "Real" = "Independent of human description."
  *   For the Realist, "Real" = "Causally efficacious and biologically grounded."

  My project argues that both definitions are insufficient for the human sciences. We need a third definition: "Real" = "Capable of supporting reliable induction and intervention within a specific historical context."

  If we adopt this definition, the question shifts from "Is ADHD real?" to "Is the ADHD loop stable enough to support induction?" This is an empirical and conceptual question, not a metaphysical stalemate. It moves the debate from a binary (Real vs. Not Real) to a gradient (Degree of Stability). This allows for nuance: perhaps some disorders (e.g., Delirium) are highly stable and indifferent, while others (e.g., Borderline Personality Disorder) are highly interactive and dynamic. Both can be "real" in the Dynamic Realist sense, but they require different scientific approaches.

  By failing to distinguish between *static* and *dynamic* stability, the current literature forces a choice between a realism that denies the patient's experience (Biological Realism) and an anti-realism that denies the patient's suffering (Constructionism). My project offers a way to honor both.

  ---

  ### 4. The Proposed Solution: Dynamic Realism for Interactive Kinds

  This section outlines the positive account I intend to develop. It is the core theoretical contribution of the dissertation. I will define "Dynamic Realism," explain how it accommodates looping, and distinguish it from existing theories.

  #### 4.1 Defining Dynamic Realism

  Dynamic Realism is an ontological framework that posits that certain natural kinds are constituted by stable processes rather than static substances. In the context of psychiatry, a Dynamic Realist holds that a psychiatric category is real if and only if:

  1.  **Cluster Stability:** There is a non-random clustering of symptoms, behaviors, and physiological markers.
  2.  **Mechanism of Persistence:** There is a identifiable mechanism that explains why this cluster persists over time.
  3.  **Interactive Integration:** In the case of interactive kinds, the mechanism of persistence *includes* the feedback loop between the classification and the classified.
  4.  **Inductive Potential:** The category supports reliable predictions and interventions, even if the specific manifestations of the category evolve.

  The crucial move here is condition #3. Standard realism looks for a mechanism *inside* the skin (genes, neurons). Dynamic Realism looks for a mechanism *across* the skin-brain-environment-culture interface.

  #### 4.2 The Loop as a Homeostatic Mechanism

  To make this concrete, consider the Homeostatic Property Cluster (HPC) model. In biology, a species is an HPC. Genes cause traits; traits aid survival; survival propagates genes. The loop keeps the species stable.

  In psychiatry, I propose the "Socio-Cognitive-Biological Loop" functions similarly.
  *   **Step 1:** A cluster of behaviors emerges (e.g., inattention, impulsivity).
  *   **Step 2:** A classification is applied ("ADHD").
  *   **Step 3:** The classification triggers interventions (medication, therapy, educational accommodations) and self-concept changes ("I am someone who struggles with focus").
  *   **Step 4:** These interventions and self-concepts alter the behavior and neurobiology (e.g., medication changes dopamine; self-concept reduces anxiety).
  *   **Step 5:** The altered behavior reinforces the utility of the classification.

  In a Static Realist view, Step 3 and 4 are contaminants. They obscure the "true" nature of the disorder.
  In a Dynamic Realist view, Step 3 and 4 are *constitutive*. Without the classification and the subsequent loop, the cluster of behaviors might dissipate, morph into something else, or remain untreated and destructive. The "Kind" is the entire cycle.

  This means the "Kind" is not a noun; it is a verb. It is a "kinding" process.

  #### 4.3 Distinguishing Dynamic Realism from Constructivism

  It is vital to distinguish this view from standard social constructionism. A constructionist might say, "ADHD is real only because we made it up." A Dynamic Realist says, "ADHD is real because the process of making it up interacts with biological constraints to produce a stable, predictable phenomenon."

  The difference lies in the **constraints**. Pure constructionism implies that we could loop anything into existence. If we started classifying "Being Tall" as a mental disorder, would it become one?
  *   **Constructionist:** Yes, if the social power is there.
  *   **Dynamic Realist:** No. The biological substrate must be amenable to the loop. "Being Tall" does not have a cluster of suffering or dysfunction that can be stabilized by treatment. The loop must latch onto something.

  Dynamic Realism acknowledges the "bite" of the world. The brain pushes back. You cannot loop a person into having a seizure disorder just by labeling them. But you *can* loop a person into a specific experience of anxiety or attention. The reality lies in the friction between the label and the biology.

  #### 4.4 Distinguishing Dynamic Realism from Biological Realism

  Similarly, this view differs from Biological Realism.
  *   **Biological Realist:** The loop is noise. Find the neural signature.
  *   **Dynamic Realist:** The neural signature is plastic. The loop *writes* onto the biology. To ignore the loop is to ignore the etiology.

  For example, in PTSD, the biological marker (elevated cortisol, amygdala reactivity) is partly caused by the *maintenance* of the trauma narrative. The classification "PTSD" gives the patient a language to hold the trauma. This holding can be therapeutic (integration) or pathological (rumination). The biology changes based on how the loop is managed. A Biological Realist who ignores the narrative aspect will fail to understand why the biology persists.

  #### 4.5 Theoretical Precedents and Innovations

  My project builds on several existing philosophical foundations but synthesizes them in a novel way.
  *   **Hacking's Interactive Kinds:** I accept the description but reject the anti-realist implication.
  *   **Boyd's HPC:** I extend the homeostatic mechanism to include socio-linguistic feedback.
  *   **Enactivism/4E Cognition:** I draw on the idea that cognition is embodied and embedded, extending this to psychiatric ontology. If the mind is extended, the disorder is extended.
  *   **Process Ontology:** I utilize the metaphysical view that processes are more fundamental than substances.

  The innovation lies in applying Process Ontology specifically to the *classification loop*. Most process ontologies focus on the organism. I focus on the *organism-classification system*.

  #### 4.6 Criteria for "Successful" Looping

  Not all loops create real kinds. Some loops are chaotic. To avoid the charge that "everything is real," I need to establish criteria for when a loop constitutes a valid scientific kind. I propose three criteria for **Loop Stability**:

  1.  **Convergence:** Do different classifiers (doctors in different regions) tend to identify the same cluster? (Inter-rater reliability).
  2.  **Response Stability:** Does the system respond predictably to interventions? (If I apply label X and treatment Y, does outcome Z occur with statistical significance?)
  3.  **Historical Continuity:** Is there a traceable lineage of the concept where the core "problem" remains recognizable even if symptoms shift? (e.g., "Melancholia" to "Depression").

  If a category meets these criteria, it qualifies as a Dynamic Real Kind, even if it loops. If it fails (e.g., the category changes every 5 years with no predictive power), it is a "Pseudo-Kind." This allows us to be critical of some DSM categories without rejecting the whole enterprise.

