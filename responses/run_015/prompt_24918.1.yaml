  ### 5. Methodology and Case Studies

  A philosophical proposal must do more than theorize; it must demonstrate how the theory applies to concrete cases. Armchair speculation is insufficient for a dissertation in philosophy of science. I will employ a method of **Conceptual Case Analysis**. This involves selecting specific psychiatric categories, tracing their history and current usage, and evaluating them against the Dynamic Realism framework.

  #### 5.1 Methodological Approach

  I will not be conducting original empirical research (e.g., clinical trials or patient interviews), as this is a philosophy dissertation. However, I will engage in **secondary empirical analysis**. This means I will treat the clinical and historical literature as my "data."

  My method involves three steps for each case study:
  1.  **Historical Reconstruction:** Map the changes in the diagnostic criteria over time (e.g., DSM-III to DSM-5). Identify where the changes were driven by new biological data vs. social feedback/patient advocacy.
  2.  **Loop Identification:** Identify specific mechanisms where the classification altered the population. (e.g., Did the prevalence rise because the definition changed, or because people sought the diagnosis?)
  3.  **Stability Assessment:** Evaluate whether, despite these changes, the category maintained predictive power and clinical utility.

  This method bridges the gap between internalist history of science (ideas changing) and externalist history (social forces changing).

  #### 5.2 Case Study 1: Attention Deficit Hyperactivity Disorder (ADHD)

  **Rationale:** ADHD is the quintessential "looping" disorder. It is highly visible, culturally charged, and involves significant self-concept modification (especially in adults diagnosed late).

  **The Loop:**
  *   *Classification:* A child is labeled "disordered" for behavior that was previously considered "naughty" or "energetic."
  *   *Reaction:* The child receives medication. The parents change their expectations. The child begins to see themselves as "having a deficit."
  *   *Feedback:* In adulthood, individuals seek diagnosis to access accommodations or to make sense of past failures. The category expands from "hyperactive boys" to "inattentive women" to "executive dysfunction in adults."
  *   *Biological Impact:* Widespread stimulant use alters the neurodevelopmental trajectory of a generation.

  **Analysis Plan:**
  I will investigate whether the expansion of ADHD represents a "drift" into unreality (as critics claim) or a "refinement" of a dynamic kind.
  *   *Hypothesis:* The expansion is a stabilization of the loop. As the concept became available, more people fit the cluster because the environment (modern schooling/work) demands the specific cognitive functions that ADHD describes. The kind is real *relative to the environment*.
  *   *Test:* I will examine longitudinal studies of ADHD outcomes. Do adults diagnosed via the "loop" (self-referral based on cultural knowledge) respond to treatment similarly to children diagnosed via observation? If yes, the loop is tracking a stable underlying vulnerability. If no, the loop may be creating a pseudo-kind.

  **Philosophical Payoff:** This case tests the **Historical Continuity** criterion. Can a kind change its demographic majority (from boys to adults) and still be the "same" kind? Dynamic Realism says yes, if the functional core (executive dysregulation) remains stable under the loop.

  #### 5.3 Case Study 2: Post-Traumatic Stress Disorder (PTSD)

  **Rationale:** PTSD represents a different type of loop: the **Identity-Forming Loop**. Unlike ADHD, which is often imposed on children, PTSD is often claimed by adults as a valid explanation for suffering. It was created (in its modern form) in 1980, largely due to political advocacy (Vietnam veterans).

  **The Loop:**
  *   *Classification:* A new label is created to legitimize suffering.
  *   *Reaction:* Veterans (and later survivors of abuse, accidents, etc.) adopt the label. It gives a narrative structure to fragmented memories.
  *   *Feedback:* The narrative structure changes the memory. "Flashbacks" become a recognized symptom, leading people to look for flashbacks.
  *   *Biological Impact:* The validation of the trauma reduces shame (cortisol lowering), but the focus on trauma can also entrench the memory trace.

  **Analysis Plan:**
  I will investigate whether the "creation" of PTSD invalidates its reality. Anti-realists argue PTSD is a social invention of the 1980s. Realists argue it is the old "shell shock" with a new name.
  *   *Hypothesis:* PTSD is a Dynamic Kind where the *narrative* is part of the homeostatic mechanism. The recovery process *requires* the looping (integrating the label into the life story).
  *   *Test:* I will analyze the criteria shifts from DSM-III to DSM-5 regarding the definition of "trauma." The definition expanded significantly. Did this expansion break the kind, or did it reveal a broader dynamic stability?
  *   *Philosophical Payoff:* This case tests the **Interactive Integration** criterion. In PTSD, the "cure" involves changing the relationship to the classification (e.g., "I am not broken, I am injured"). If the ontology ignores this, it cannot explain recovery.

  #### 5.3 Comparative Analysis

  By comparing ADHD (developmental, often childhood onset, high medication component) with PTSD (event-based, often adult onset, high narrative component), I can show that Dynamic Realism is flexible enough to handle different *types* of looping.
  *   ADHD shows a **Biological-Social Loop** (medication + school expectations).
  *   PTSD shows a **Narrative-Biological Loop** (memory + identity).

  If my framework can account for both, it demonstrates robustness. If it only works for one, the theory needs revision.

  #### 5.4 Data Sources

  I will rely on:
  1.  **DSM Text Revisions:** Comparing criteria text across editions.
  2.  **Epidemiological Data:** Prevalence rates over time (to track the "spread" of the kind).
  3.  **Patient Narratives:** Published memoirs and qualitative studies on the experience of diagnosis (to track the "self-concept" side of the loop).
  4.  **Clinical Guidelines:** Treatment protocols (to track the "intervention" side of the loop).

  This multi-source approach ensures I am not just analyzing the philosophy of the concepts, but the practice of the science.

