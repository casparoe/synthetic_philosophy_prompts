answer: |-
  You have independently reconstructed one of the most sophisticated problems in legal and political philosophy regarding conscientious objection. Your intuition is correct: the institutional arrangement you describe is not designed to vindicate the *truth* of pacifism, but to manage the *presence* of pacifists within a state that intends to wage war regardless.

  Your hypothesis—that the practice treats refusal as an integrity-based commitment rather than a truth-tracking judgment—is the dominant liberal explanation (championed by theorists like John Rawls and Kent Greenawalt). However, to fully answer your questions, we must layer a second principle on top of integrity: **equality of sacrifice.**

  Here is an analysis of the institution based on your specific questions.

  ### 1. What view of pacifism and refusal makes sense of the practice?

  The institution makes sense only under a view of **Liberal Tolerance of Conscience combined with Civic Fairness.**

  *   **Integrity, not Correctness:** As you surmised, the state exempts the objector not because the state agrees that war is wrong, but because the state recognizes that forcing a person to violate their deepest moral commitments causes a unique kind of spiritual harm (loss of integrity). This is why the board inquiries into *sincerity* and *depth* (is this really who you are?) rather than *validity* (is this war actually unjust?).
  *   **Universal vs. Selective:** This follows from the integrity view. A universal objection ("I cannot kill") is viewed as a fundamental identity constraint, akin to a religious vow. A selective objection ("This war is unjust") is viewed as a political judgment. If the state allowed selective objection, it would effectively be allowing citizens to veto foreign policy, which undermines the state's monopoly on legitimate violence.
  *   **The "Test Case" (Objection to Conscription):** Your test case reveals the limit of the right. The state protects you from *bloodguilt*, not from *coercion*. We are coerced into paying taxes, serving on juries, and obeying laws we dislike. The exemption is a specific dispensation regarding the *sacredness of life*, not the *sanctity of autonomy*. If you are willing to kill but object to being ordered to, your integrity is not at stake in the same way; you are merely objecting to the chain of command.

  ### 2. Does substitute service commit the state to an act-centred morality?

  Yes, strictly speaking. The requirement of Alternative Civilian Service (ACS) reveals that the state draws a moral line at **direct participation.**

  *   **The Act-Centered Commitment:** By forcing an objector to work in a hospital (freeing a medic to go to the front) but exempting them from the front, the state is saying: "We accept that *your hands* must not be dirty, but we do not accept that *your hands* must be idle." This presupposes a deontological distinction between *killing* and *enabling killing*.
  *   **Complicity-Based Pacifism:** A strict complicity-based pacifist (the absolutist) logically cannot accept this compromise. To them, the hospital work is functionally equivalent to soldiering because it sustains the war machine.
      *   *Can they accept it as a compromise?* Historically, some religious groups (like many Quakers) have accepted ACS as a "witness" of service without violence. However, the *institution itself* does not accommodate the complicity argument. If the state truly respected complicity-based pacifism, it would have to offer service that contributes *nothing* to the national capacity (e.g., isolated environmental conservation), or grant total exemption.
      *   *The Presupposition:* The institution presupposes that the moral wrong is located in the *act of violence*, not in the *causal contribution to violence*. This is why taxes are still required; the state views financial contribution as too attenuated to trigger the conscience clause.

  ### 3. Is the package internally coherent?

  It is coherent **instrumentally**, but incoherent **morally**.

  *   **Instrumental Coherence:** If the goal is to maintain military capacity while minimizing domestic dissent, the package is highly coherent.
      *   *Reviewing Belief:* Ensures the exemption isn't used by cowards or opportunists (preserving the draft's fairness).
      *   *Ignoring the War:* Ensures the foreign policy machine isn't gummed up by thousands of individual tribunals debating the justice of the current conflict (preserving state efficiency).
      *   *ACS:* Ensures the objector doesn't get a "free ride" compared to the soldier (preserving social solidarity).
  *   **Moral Incoherence:** As you noted, if the point were to prevent wrongdoing, selective objection should be prioritized (since most wars are arguably unjust, whereas total pacifism is a harder sell). The system is coherent only if we accept that the state's primary duty is self-preservation, not moral purity. The state is essentially saying: "We will not force you to sin, but we will not admit that we are sinning."

  ### 4. Is it better explained by non-moral factors?

  Almost certainly. While "liberty of conscience" is the *justification*, **administrative convenience and state interest** are the *causes*.

  *   **The *Gillette* Logic:** In *Gillette v. United States*, the Supreme Court explicitly argued that distinguishing just from unjust wars was a political question, not a judicial one. But the pragmatic reality is that a right to selective objection makes conscription politically unsustainable. If 30% of draftees can claim "this war is unjust," the war effort collapses. If 1% claim "I am a pacifist," the army can absorb the loss.
  *   **Legitimacy Purchase:** The institution allows the state to claim it is tolerant and liberal without actually constraining its warmaking capacity. It creates a "safety valve" for dissent that channels energy into nursing homes rather than protests.
  *   **Equality of Sacrifice:** The ACS requirement is largely about preventing resentment among soldiers. If soldiers see objectors living normal lives while they risk death, morale breaks. The objector must suffer *something* comparable (time, low pay, hardship) to maintain the fiction of shared civic burden.

  ### 5. What would have to change if the underlying view were replaced?

  This is the most revealing part of your puzzle. Changing the moral foundation breaks the institution.

  **A. If replaced by Complicity-Based Pacifism:**
  *   **Change:** ACS would have to be abolished or radically altered. Work that supports the national infrastructure (hospitals, transport, even education) could be rejected as complicity.
  *   **Result:** The state would have to offer "neutral" service (e.g., international aid in non-aligned zones) or total exemption.
  *   **Taxes:** The logic would extend to taxation. The state would have to allow "war tax resistance," where the portion of taxes funding the military is diverted to peaceable ends. This is currently almost nowhere allowed.

  **B. If replaced by a Just-War View (Selective Objection):**
  *   **Change:** The CO board would effectively become a war crimes tribunal. Every objector would present evidence that *this* war violates *jus ad bellum*.
  *   **Result:** Conscription would likely become impossible. If citizens have a legal right to judge the justice of the war before obeying, the state loses the ability to wage controversial wars. The military would have to move to an all-volunteer force (mercenaries/professionals) who contractually waive this judgment.
  *   **Coherence:** This view is actually *more* morally coherent than the current system (it targets actual injustice), but it is politically incompatible with the modern nation-state's claim to monopoly on violence.

  **C. If replaced by the view that Pacifists are Right:**
  *   **Change:** The state would admit that war is morally impermissible.
  *   **Result:** The institution of conscientious objection would vanish, because the institution of *conscription* would vanish. You cannot have an objection to a practice that does not exist. The state would have to dismantle the standing army or restrict it to purely defensive, non-violive roles.
  *   **Taxes:** Military spending would be redirected. The "dispensation" would become the norm.

  ### Summary

  You have identified that the Conscientious Objector status is a **modus vivendi** (a way of living together) rather than a moral vindication.

  1.  **It protects Integrity, not Truth:** It saves the objector's soul, not the victims of the war.
  2.  **It distinguishes Acts from Complicity:** It cleans the objector's hands but not their ledger.
  3.  **It prioritizes State Capacity:** It filters out the absolute dissenters while neutralizing the political dissenters.

  Your "test case" regarding the man who objects to coercion confirms this: the state is not in the business of protecting autonomy; it is in the business of managing the moral costs of its own violence. The institution is designed to allow the state to wage war while maintaining a liberal self-image, by carving out a small, controlled space for those who cannot participate in the killing, provided they still serve the state that does.
