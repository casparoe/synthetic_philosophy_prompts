  **Analyzing the Five Precedents:**

  **P1 - Night Shuttle:**
  - Flat $15 fee on all undergraduates
  - Least advantaged gained ~$300/year (6 hours × value)
  - Median student lost $15, gained $20 convenience
  - Students with cars lost $15, gained nothing
  - Approved 6-1
  - Key: Net benefit to least advantaged, even with regressive fee structure

  **P2 - Means-tested Dining:**
  - Replace universal dining discount with targeted cash grant
  - Least advantaged gained $420/year
  - Median student lost $45
  - 60 undocumented students (NOT in the defined least advantaged group) lost $260 discount
  - Rejected 5-2
  - Reason: Those who would lose were already in worst position in community, loss was certain not chance
  - Key: Even though defined least advantaged would gain, those outside the definition but still vulnerable lost certain benefits

  **P3 - Fellowship Lottery:**
  - Fund competitive fellowship by trimming emergency hardship fund by 1/5
  - Least advantaged gained $150/year in expectation (some would win fellowships)


  - Nobody's assured resources changed
  - Student hitting unexpected hardship would receive up to $300 less
  - Approved 4-3
  - Reason: No student's assured position fell, downside was speculative not built-in
  - Key: Expected value gain acceptable when assured baseline doesn't drop

  **P4 - First-generation Scholarship:**
  - Donor offered $900/year for first-gen students on maximum aid
  - No one else lost anything
  - Spread between least advantaged and others narrowed
  - Approved ONLY on condition that program abandon public cohort identity (no roster, certificate, reception)
  - Reason: Money wasn't the problem; marking beneficiaries as separate class was problematic; standing as equal among peers is part of what we distribute
  - Key: Social standing and equal status matter as much as material distribution

  **P5 - Conditional versus Unconditional:**
  - $500 conditional on 10 hours financial coaching vs $450 unconditional
  - Chose $450 unconditional
  - Reason: Benefit requiring hours student doesn't have is worth less than face value; unconditional grant leaves recipient free
  - Key: Freedom and actual accessibility matter; conditional benefits that can't be accessed aren't real benefits

  **The Gateway Package:**

  Component 1 (for the 900 least advantaged):
  - Paid field-related position replacing current work-study
  - Keep existing wages + $200 top-up + $150 transport/equipment credit = ~$350 net cash gain
  - Requires 12 hours/week instead of 10
  - Top-up and credit reimbursed in arrears (end of first month)
  - 70 of 900 have dependent-care obligations requiring payment at start of term
  - Must bridge ~$900 from savings/credit each term
  - 1 in 10 chance per academic year of materially disrupted term, costing ~$900 to that student
  - No student's assured resources fall below current level (technically)

  Component 2 (venture fellowship pool):
  - $480,000/year, 40 fellowships of $12,000
  - Open to all undergraduates
  - Distribution: ~34 to top income quintile, ~3 to median, ~3 to least advantaged group
  - Net effect: Least advantaged gains ~$390/year per member in cash
  - Median student unchanged
  - Distance between least advantaged and top widens by ~$11,600/year for those 34 top students

  Donor conditions:
  - Public naming required (roster, certificate, reception, photos for campaign)
  - Condition is NOT waivable

  Provost's Alternative (if gift declined):
  - $450 cash per student per year for the 900 students
  - Disbursed in advance at start of term
  - No roster, certificate, reception
  - No change to work-study jobs
  - Financed by trimming alumni/parent relations budget (no other group loses)

  **Comparing Options:**

  Gateway vs. Alternative for the 900:
  - Gateway: ~$350 net cash gain + career benefits, but requires 2 extra hours/week, reimbursement in arrears creates cash flow problem for 70 students, public marking
  - Alternative: $450 cash, in advance, no marking, no extra hours

  Gateway creates inequality (top students gain $12,000 fellowships, widening gap by $11,600)
  Alternative doesn't change inequality (just helps the 900)

  **Candidate Decision Rules:**

