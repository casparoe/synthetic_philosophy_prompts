answer: |-
  A multinational agritech consortium must finalize its seasonal pest-control strategy, choosing between 'Chemical Sweep,' a cost-effective aerosol that eliminates three trillion beetles per harvest, and 'Physical Barrier,' a prohibitively expensive method that leaves the beetle population intact while maintaining identical crop yields. Independent neurobiological assessments assign each individual beetle a precise 0.1% probability of possessing the neural architecture required for conscious suffering, a figure derived from ambiguous nociceptive data that remains scientifically unresolved. The financial differential between the two protocols is substantial enough that adopting 'Physical Barrier' would necessitate cutting human nutritional aid programs, creating a stark trade-off between certain human welfare and potential insect suffering. The ethical directive requires the board to determine whether the moral risk is calculated by multiplying the low probability of sentience across the total population or by demanding a higher confidence threshold for any single organism before granting moral consideration.

  **Analysis of Frameworks**

  Under the linear moral-risk framework, the calculation aggregates expected moral weight across the entire population. By multiplying the three trillion affected beetles by the 0.1% probability of sentience, the model yields an expected count of three billion sentient beings subjected to suffering. Assuming the disvalue of this aggregated expected suffering exceeds the disvalue of the human nutritional aid cut, the framework mandates the expensive 'Physical Barrier' protocol to minimize total expected harm. Conversely, the individual evidential-threshold framework assesses moral status on a per-organism basis. Since the 0.1% probability falls drastically below the requisite confidence bar for sentience (e.g., a preponderance of evidence requiring >50%), each beetle is treated as having zero moral status. Summing three trillion zeros results in zero moral obligation, rejecting the switch to the expensive protocol and prioritizing the certain human welfare.

  **Structural Divergence**

  The exact structural feature forcing these outcomes apart is the permissibility of aggregating probabilistic moral weight across distinct individuals. The linear framework treats moral risk as a fluid quantity that can be summed across a population, allowing fractions of probability to accumulate into whole moral patients. The threshold framework treats moral status as a binary switch inherent to each individual, where failing to meet the confidence bar renders the probability irrelevant, regardless of population size.

  **Threshold Theorist Dissolution**

  To dissolve the conflict without disputing the empirical 0.1% figure, the threshold theorist undermines the aggregation step itself. They argue that moral standing is a relational property between a moral agent and a specific patient, not a commodity that can be pooled across separate entities. From this view, combining the fractional sentience of distinct beetles to create a "collective" moral patient is a category error; one cannot sum fractions of persons to manufacture a whole person. Therefore, the massive scale of the population is morally inert because no single individual crosses the evidential threshold required to enter the moral calculus in the first place.
