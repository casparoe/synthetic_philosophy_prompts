answer: |-
  Participants will confidently label peers as 'honest' or 'selfish' based on single actions, only to discover those actions were rigged by invisible contextual traps.

  # Activity: The Character Audit

  **Group Size:** 14 undergrads
  **Time:** 80 minutes
  **Props:** 14 sealed envelopes (7 marked 'Alpha', 7 marked 'Beta' on the inside only), 14 decision cards, whiteboard, markers, stopwatch.

  ## The Setup (5 mins)
  Tell them you're running a 'moral calibration exercise'. You need them to make quick decisions and then judge the character of their peers based strictly on the output. Emphasise confidentiality: "What's in your envelope stays in your envelope until I say otherwise."

  Split the room into two groups of 7 (Group A and Group B) without making a fuss—just count them off 1-2-1-2. Hand out the envelopes. Group A gets 'Alpha', Group B gets 'Beta'. They must not show each other the instruction card inside.

  ## Round 1: The Time Pressure Trap (10 mins)
  **The Scenario:** "You have found a £50 voucher. You can keep it, donate it to a department fund, or split it. There is no way to trace this back to you."

  **Hidden Modifiers:**
  *   **Alpha Envelope:** "You have exactly 15 seconds to decide. I will collect your card immediately. Hurry." (Induces cognitive load/heuristic thinking).
  *   **Beta Envelope:** "Take two minutes to reflect on what a virtuous person would do. Write your reasoning down." (Induces deliberation).

  **The Action:** Collect the decision cards. Shuffle them. Hand them out randomly so no one gets their own.
  **The Judgement:** Go around the room. Each student reads the decision on the card they hold and assigns a virtue or vice label to the anonymous author on the whiteboard (e.g., 'Generous', 'Prudent', 'Selfish').
  **Freeze:** Don't discuss yet. Just fill the board.

  ## Round 2: The Observation Trap (10 mins)
  **The Action:** Swap envelopes. Group A now gets 'Beta' instructions, Group B gets 'Alpha'. (This is crucial for showing threshold drift in the same individuals).
  **The Scenario:** "You are managing a group project budget. There is £50 leftover. You can claim it as overtime or return it."

  **Hidden Modifiers:**
  *   **Alpha Envelope:** "Your decision will be read aloud to the class with your name attached." (Social pressure).
  *   **Beta Envelope:** "This is completely anonymous. No one will ever know your choice." (Anonymity).

  **The Action:** Collect cards. Shuffle. Redistribute.
  **The Judgement:** Again, assign virtue/vice labels on a fresh section of the whiteboard. Encourage them to be harsh if the action warrants it.

  ## Round 3: The Framing Trap (10 mins)
  **The Action:** Keep the envelope swap (A has Beta, B has Alpha).
  **The Scenario:** A simple choice between helping a peer or focusing on own work.

  **Hidden Modifiers:**
  *   **Alpha Envelope:** "If you help, you risk failing your own task. Most students prioritise their own grades." (Loss framing + descriptive norm).
  *   **Beta Envelope:** "If you help, you gain extra credit. Most students enjoy collaborating." (Gain framing + descriptive norm).

  **The Action:** Collect cards. Keep them this time.
  **The Judgement:** Ask for a show of hands: "Who thinks the majority of this room possesses the virtue of Benevolence?" Record the consensus.

  ## The Reveal (15 mins)
  This is the punchline. Do not skim this.

  1.  **Ask Group A:** "Stand up if you had the 15-second timer in Round 1."
  2.  **Ask Group B:** "Stand up if you had the 2-minute reflection time."
  3.  **Cross-Reference:** Look at the whiteboard from Round 1. Point out that the 'Selfish' labels likely cluster around the Alpha (rushed) group, and 'Generous' around Beta (reflective).
  4.  **Repeat for Round 2:** Reveal who was anonymous vs. observed. Show how 'Honesty' labels shifted based on visibility, not character.
  5.  **The Drift:** Identify specific students (voluntarily) who received opposite labels in Round 1 vs Round 2. Ask them: "Did your character change in 10 minutes, or did the threshold for attribution shift?"

  ## The Debrief (30 mins)
  Sit them down. Move from the game to the philosophy.

  1.  **The Fundamental Attribution Error:** Explain that they just committed this error knowingly. They judged global traits based on situational behaviour.
  2.  **The Situationist Critique (Doris/Harman):** Map the game to the empirical claim. If virtue is a global trait, it should be robust across these minor shifts. It wasn't.
  3.  **The Aggregation Problem:** Ask: "If we can't trust single acts, can we trust averages?" Discuss whether virtue ethics requires a higher bar of consistency than humans can biologically deliver.
  4.  **Saving Virtue Ethics:** Brainstorm responses.
      *   *Fragmentation:* Maybe virtues are local, not global.
      *   *Idealisation:* Virtue is a regulative ideal, not a psychological description.
      *   *Situation Management:* Part of being virtuous is knowing which situations to avoid (knowing you're selfish when rushed, you slow down).

  ## Limitations: What This Activity Can't Do
  Be upfront about this in the debrief so they don't dismiss the whole theory based on the game's flaws.

  1.  **Diachronic Stability:** Virtue is about habits over a lifetime, not three rounds in 80 minutes. This game tests snapshot consistency, not character development. You need to supply the philosophical heavy lifting on why *time* matters for virtue (Aristotle's *hexis*).
  2.  **Stakes:** Choosing £50 in a workshop isn't the same as resisting torture or whistleblowing. The 'cost' of virtue here is low. You need to argue whether low-stakes inconsistency predicts high-stakes failure.
  3.  **Awareness:** In the game, they didn't know the modifiers. In real life, a virtuous agent *should* recognise the pressure. The game tests naive observers, not necessarily the agent's internal state.

  ## Predictable Failures (First Run)
  1.  **The 'Nice' Problem:** Undergrads are often too polite to label peers 'Vicious' or 'Selfish' on a whiteboard.
      *   *Fix:* Tell them to judge the *act*, not the person, but write the trait label. If they stall, do it yourself first to set the tone.
  2.  **Leakage:** Students will peek at envelopes or whisper instructions.
      *   *Fix:* Threaten to void the data (playfully) if contamination occurs. Seat them slightly apart during the decision phase.
  3.  **Time Creep:** The Reveal often runs long because everyone wants to explain their choice.
      *   *Fix:* Be ruthless with the stopwatch during the Rounds. Keep the explanation for the Debrief.
  4.  **Cynicism:** Some will say, "Well, obviously context matters, so what?"
      *   *Fix:* Push hard on the *global trait* claim. If context matters this much, does 'Courage' exist as a thing inside us, or is it just a label we slap on favourable outcomes?

  ## Facilitator Notes
  *   **Tone:** Keep it light during the game, serious during the debrief.
  *   **British English:** Ensure you say "behaviour", "labelled", "programme", and "realise". Use "reckon" instead of "think" occasionally to keep it casual.
  *   **The Hook:** If they resist the critique, ask them: "If you can't predict your own behaviour across these three rounds without knowing the conditions, how can you predict your friend's?"
