      *   In the AI case, the system is *not* a moral agent. There is no primary moral agent to hold responsible for the specific decision. The engineer/user responsibility is direct, not vicarious. If they lack control (per premise 1-3), there is *no one* left.
      *   Therefore, the parity fails because the trucking case has a "backup" responsible agent (the driver) who absorbs the moral blame for the specific act, whereas the AI case does not.
      *   Alternatively, attack Premise (3). Control doesn't require knowing the *specific* option, but having the power to set the *constraints*. But if the user wants to keep (5), they need to argue that ML constraints are fundamentally different from human training constraints regarding control.
