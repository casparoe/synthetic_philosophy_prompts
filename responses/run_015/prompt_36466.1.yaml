      *   So (7) must be false. Why? Because controlling a moral agent who controls the outcome counts as controlling the outcome (indirect control). Controlling a non-agent that produces the outcome does not count as indirect control in the same way if the non-agent's operation is opaque/unforeseeable.
      *   Actually, the stronger point is that the firm's responsibility in (8) is often *vicarious*. Vicarious responsibility doesn't require the same kind of direct control as primary responsibility. The AI gap argument is usually about *primary* moral responsibility.
      *   Let's focus on the **intermediate agent** distinction.

