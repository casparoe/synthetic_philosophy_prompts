      *   Better move: **Reject the inference in (7) based on the moral agency of the driver.** The firm controls the drivers *because* the drivers are rational agents responsive to reasons (rules, incentives). The engineer does not control the ML system in the same way because the ML system is not responsive to reasons, only parameters.
