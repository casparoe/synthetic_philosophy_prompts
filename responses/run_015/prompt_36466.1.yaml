      *   In the AI case, the system does not know the options. The engineer relies on the system's optimization. The engineer controls the *code*, but the code does not control the *output* in a morally relevant way (no agency).
      *   So the chain of control is broken in AI, intact in Trucking.
      *   Target: **The inference from (6) to (7) relies on a false equivalence regarding the intermediate node.**

