      *   **Disanalogy Check:** Is this principled? Yes, it relies on the distinction between moral agents (responsive to reasons) and mere tools (responsive to parameters). Is it ad hoc? It could be seen as moving the goalposts if "agency" is defined loosely, but standard ethical theory distinguishes humans from machines. However, if ML systems become agentic, the gap closes.
