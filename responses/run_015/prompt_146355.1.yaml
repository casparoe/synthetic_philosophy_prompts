  **The Principle:** The Principle of Indirect Sentience and Rational Priority: Agents have a strict duty to refrain from cruelty toward genuinely sentient beings to preserve their own capacity for empathy, but direct moral status and prioritization belong exclusively to rational autonomous agents.

  **Reasoning:**
  *   **Indirect Duty (Motivated by Dog/Factory Farm/Stray):** This clause explains why kicking a dog is wrong and rescuing one is good without granting the animal rights; the moral weight lies in how the action affects the human agent's character (hardening vs. softening empathy).
  *   **Rational Priority (Motivated by Surgeon):** This clause establishes the hierarchy where humans are ends-in-themselves and animals are means; consequently, sacrificing human lives for animal interests violates a perfect duty to humanity, making the surgeon's act immoral, not merely wasteful, though your view that believing the chimp has equal worth is wrong is preserved.
  *   **Genuine Sentience (Motivated by Robot):** This clause distinguishes between actual suffering and simulation; since the robot lacks genuine sentience, torturing it does not dull empathy toward real suffering, rendering the act permissible though perhaps aesthetically displeasing.
  *   **Engineered Pig:** The principle dictates that understanding promises is cognitive, not moral autonomy (the capacity to legislate moral law); therefore, the pig remains an object of indirect duty, denying it direct standing despite its cleverness.
  *   **Bioengineered Robot:** As noted, without genuine sentience, there is no moral harm to the agent's character, confirming your verdict that it is not wrong.

  **Unsaved Verdicts:**
  1.  **Surgeon's Act:** Your view that saving the chimp over humans is merely "wasteful" rather than immoral; the principle demands it be classified as a moral failure toward humanity.
  2.  **Engineered Pig:** Your intuition that the pig might have direct moral standing; the principle forces a binary choice where lacking full rational autonomy means having no direct claims.
