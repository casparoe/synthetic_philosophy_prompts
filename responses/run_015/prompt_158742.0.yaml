answer: |-
  **Logical Space & Occupancy**
  The tree maps three binary axes: (1) *Outcome Dependence* (does probability change after the event?), (2) *Single-Case Reality* (can a unique unrepeatable event have chance ≠ 0/1?), and (3) *Determinism Compatibility* (do probabilities survive deterministic physics?).
  *   **Empty Combo A:** "No" to Outcome Dependence, "No" to Single-Case, "Yes" to Determinism. (Frequentists deny single-case chance; if they also deny outcome dependence, they lack a mechanism for updating class estimates. Unstable.)
  *   **Empty Combo B:** "Yes" to Outcome Dependence, "No" to Single-Case. (If probability is epistemic [Yes], it applies to single cases. Denying single-case content while admitting epistemic update is incoherent.)

  **The Decision Tree**

  1.  **Case 2 (Covered Coin):** Coin landed heads 5 mins ago, hidden. Is "P(Heads)=0.5" true *now*?
      *   **No (It's 0 or 1):** Go to 2.
      *   **Yes (Still 0.5):** Go to 4.
  2.  **Case 3 (Bent/Melted):** Unique bent coin, destroyed after one flip. Does it have a chance ≠ 0 or 1?
      *   **No:** **Actual-Sequence Frequentist** (Probability requires finite repeats).
      *   **Yes:** Go to 3.
  3.  **Case 4 (Gas/Determinism):** If micro-physics is deterministic, are macro-probabilities false?
      *   **Yes:** **Single-Case Propensity** (Chance requires indeterminism).
      *   **No:** **Best-System Chance** (Chance supervenes on deterministic patterns).
      *   *(Note: Propensity/Best-System collapse on empirical questions; separation requires metaphysics about dispositions vs. Humean mosaic.)*
  4.  **Case 1 (Calibrated Model):** Model scores 0.70. Is this true *because* 70% of past 10k cases were positive?
      *   **Yes:** **Hypothetical-Limit Frequentist** (Truth lies in long-run convergence).
      *   **No:** Go to 5.
  5.  **Case 5 (One-Off Bill):** "P(Amendment)=0.3". Meaningful if no betting market exists?
      *   **No:** **Operationalist** (Merged: Probability = scoring rule optimization; metaphysics deleted).
      *   **Yes:** Go to 6.
  6.  **Case 5 (Same Info):** Must two experts with identical information assign the same probability?
      *   **Yes:** Go to 7.
      *   **No:** **Subjective Bayesian** (Probability = coherent personal belief).
  7.  **Case 4 (Symmetry):** Assign probabilities to gas states without data. Use symmetry alone?
      *   **Yes:** **Classical/Logical Probability** (Constraint by reason/indifference).
      *   **No:** **Objective-Bayesian/MaxEnt** (Constraint by information entropy).

  **Indistinguishable Leaves**
  *   **Propensity vs. Best-System:** Both assert objective single-case chances. They collapse on every concrete case here. Separation requires asking whether chances *guide* frequencies (Propensity) or frequencies *define* chances (Best-System), which is metaphysical, not empirical.
  *   **Operationalism:** Merged with Subjective Bayesian. It is subjective Bayesianism where "coherence" is justified by "scoring rule minimization" rather than Dutch Books. Same leaf, different slogan.

  **Note on Questions**
  **Q1 (Covered Coin)** does the most work, splitting the ontic (world) from epistemic (head) traditions immediately. **Q7 (Symmetry)** can be cut without losing the tree's structural integrity; Classical and Objective-Bayesian positions are often pragmatically identical in applied work, differing only on the justification for priors. Removing Q7 merges them into a single "Rationalist" leaf, simplifying the ambush for applied audiences.
