      *   CTU chooses B (2880 > 200).
      *   OP Weighting: Based on baseline suffering $s^3$ applied to total welfare gain.
      *   OP Value A: $100^3 \times 200 = 1,000,000 \times 200 = 200,000,000$.
      *   OP Value B: $36 \times (40^3 \times 80) = 36 \times 64,000 \times 80 = 36 \times 5,120,000 = 184,320,000$.
