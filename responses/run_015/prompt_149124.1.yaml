  3.  **Step 1: Locke's Metaphysics of Personal Identity (*Essay Concerning Human Understanding*, Book II, Ch. 27):**
      *   *Distinction:* "Man" (living organism) vs. "Person" (thinking intelligent being with reason/reflection, capable of considering itself as itself in different times/places).
      *   *Criterion:* Continuity of consciousness (memory). "As far as this consciousness can be extended backwards to any past Action or Thought, so far reaches the Identity of that Person."
      *   *Forensic Nature:* Personhood is about accountability, reward, and punishment. It requires the ability to appropriate past actions.
      *   *Application to Dementia:* If the dementia patient cannot remember the directive-writing self, are they the same *Person*?
          *   *Locke's View:* If consciousness is broken, personal identity is broken. They are the same *Man*, but potentially different *Persons*.
          *   *Nuance:* Locke acknowledges degrees of consciousness (sleep, drunkenness). But total loss of memory linkage severs the forensic tie.

  4.  **Step 2: Locke's Political Philosophy (*Two Treatises of Government*):**
      *   *Consent:* Legitimate government rests on consent.
      *   *Tacit vs. Express:* Express is clear; tacit is inferred from enjoyment of property/protection.
