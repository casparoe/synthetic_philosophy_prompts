      *   **Constraints:**
          *   Staff: Nurses, junior doctors, social workers (no philosophy training).
          *   Time: ~15 minutes (chart review + 1 conversation).
          *   Output: Written rationale (readable by family/quality committee), one of three decisions (Approve, Decline, Refer to Chair).
          *   Format: Fixed order questions, sufficient answer criteria, explicit stop rules, hand-off points, one-page ward version.
          *   Transparency: Mark judgment calls vs. procedures.
          *   Epistemic Status: Distinguish analytic consequences of the theory vs. contested interpretations.
          *   Specific Distinctions to Settle (1-7): Craving vs. Want, Unfelt/Dispositional Craving, Full Info vs. Adaptation, Scope of Suffering, Displacement/Time Window, Comparative vs. Absolute, Behavioral Evidence.
          *   Case Studies: Dementia (antipsychotic vs. care), Depression (palliative sedation), The "Hard Pill" (sedated indifference vs. satisfied flourishing).
          *   Hard Limit: Do *not* recommend based on comparison between sedated/anaesthetized patient and death/non-existence. Refer that up.

  2.  **Deconstruct Tranquilism for Clinical Application:**

      *   *Core Axiom:* Welfare $\propto -(\text{Craving} + \text{Suffering})$.
      *   *Implication:* Intervention $A$ is better than $B$ if $A$ results in less net craving/suffering over the relevant time window.
      *   *Implication:* Death/Sedation is theoretically optimal (zero craving/suffering), but ethically/politically toxic. The protocol *must* flag this as a "Refer" point to protect the staff and the institution, while remaining faithful to the theory's logic where possible.
      *   *Challenge:* Operationalizing "Craving" and "Suffering" without metaphysical baggage.

  3.  **Address the Seven Distinctions (The "Engine" of the Protocol):**

      *   *1. Craving vs. Want:* Craving = aversive tension. Want = neutral preference. *Test:* "Does not having it hurt?"
      *   *2. Unfelt/Dispositional:* Tranquilism is usually experiential. But if we ignore dispositional states, we miss suffering in non-communicative patients. *Decision:* Count dispositional craving *only* if there is behavioral/physiological evidence of distress upon frustration (counterfactual evidence).
      *   *3. Adaptation/Full Info:* Tranquilism focuses on *actual* experience, not idealized. *Decision:* Count actual reported craving. Adapted patients count as tranquil. (This is controversial but consistent with the phenomenological focus).
      *   *4. Scope of Suffering:* Broaden beyond pain. Include dread, breathlessness, etc. Anticipatory distress counts if the *anticipation* is painful now.
      *   *5. Displacement/Time:* Need a window. *Decision:* 72 hours for acute, 2 weeks for chronic/palliative. Net sum required.
      *   *6. Comparative vs. Absolute:* Must be comparative (Status Quo vs. Intervention). Absolute welfare is hard to measure.
      *   *7. Behavioral Evidence:* Evidence, not criteria. Behavior *indicates* internal state but isn't the state itself (avoids behaviorism trap).

  4.  **Drafting the Protocol (Iterative Process):**

      *   *Structure:* Introduction -> The 7 Operational Definitions -> The Step-by-Step Procedure -> The Decision Matrix -> Epistemic Notes.
      *   *Tone:* Clinical, precise, non-evasive about the "hard pills" (sedation/death), but protective of staff (Refer rules).
      *   *The "Death/Sedation" Trap:* The prompt explicitly asks *not* to recommend based on the comparison between sedated/anaesthetized patient and non-existence. I need a "Stop Rule" here. If the intervention leads to a state indistinguishable from non-existence in terms of craving/suffering (i.e., deep sedation or death), it must be referred to the Chair. This respects the user's constraint while acknowledging the theory's implication.

  5.  **Developing the Case Studies:**

      *   *Case 1 (Dementia):* Pacing = behavioral evidence of craving/suffering. Antipsychotic = reduces behavior (likely reduces craving/suffering). 1:1 Care = satisfies craving without chemical blunting. *Tranquilist Verdict:* Whichever reduces the *aversive tension* more. If pacing is distress, stop it. If pacing is neutral, let it be.
      *   *Case 2 (Depression/Sedation):* Dread is suffering. Sedation removes dread. *Tranquilist Verdict:* Approve sedation (reduces suffering). *Constraint Check:* Does this border on the "death/sedation" limit? It's palliative sedation, not euthanasia. It reduces suffering. Protocol likely approves, but needs a "Refer" if the goal is permanent unconsciousness.
      *   *Case 3 (The Hard Pill):* Inert patient (zero craving) vs. Flourishing patient (high craving satisfaction). *Tranquilist Verdict:* Inert patient ranks higher (zero negative states). Flourishing patient has *some* craving cycle even if satisfied. *Crucial:* This is where the protocol must tell the staff to "Refer" if the implication is that the inert state is *morally preferable* in a way that suggests ending the flourishing life. The prompt asks to run the protocol and see where it parts company with judgment.

  6.  **Refining the Epistemic Status:**

      *   Need to clearly label: "Analytic Consequence" (follows from definition) vs. "Operational Stipulation" (chosen for practicality/contested).
      *   Acknowledge that Tranquilism is a minority view.

  7.  **Final Review against Constraints:**

      *   15 mins? Yes, flowchart style.
      *   3 Outputs? Yes (Approve, Decline, Refer).
      *   One-page version? Need to create a summary.
      *   No philosophy training? Keep language concrete.
      *   Handle the "Death/Sedation" limit? Yes, via specific Referral Rule #4.

  8.  **Writing the Content (Mental Check of Specific Tricky Points):**

      *   *Dispositional Craving:* If a patient can't report, we rely on "Frustration Response." If we withdraw food and they don't react, no craving. If they react, craving exists. We can't test this invasively. So we rely on *observed* frustration in daily care.
      *   *Adaptation:* If a patient says "I want nothing," Tranquilism says they are well. The protocol must accept this report unless there is evidence of repression (hard to prove). I will stick to the phenomenological report.
      *   *The "Death" Limit:* The prompt says: "stop short of any recommendation that depends on the welfare comparison between a sedated or anaesthetised patient and one who no longer exists." I must ensure the protocol doesn't explicitly say "Death is best." It must say "If the intervention aims at permanent unconsciousness or cessation of existence, Refer to Chair."

  9.  **Final Polish:** Ensure the distinction between "Evidence" and "Criteria" for behavior is clear. Ensure the time window is specific. Ensure the "One-Page Ward Version" is distinct from the full consultant guide.

  *(Self-Correction during drafting)*: I initially thought about allowing the protocol to approve deep sedation for depression. But the constraint says "stop short of... comparison between a sedated... patient and one who no longer exists." Palliative sedation until death is borderline. I will classify "Induction of permanent unconsciousness" as a Refer case to be safe and compliant with the prompt's specific constraint on the deliverable.

