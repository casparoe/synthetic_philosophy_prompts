answer: |-
  This is a sharp observation that cuts to the core of the friction between welfare economics and moral philosophy in climate ethics. You have identified a rhetorical and logical maneuver that is pervasive in policy debates, yet it lacks a single, canonical "ism" or eponymous name in the literature.

  Here is a breakdown of what this pattern is, how to name it, how it differs from the Non-Identity Problem, and how to define its boundaries.

  ### 1. Is there a name for this?

  There is no single, universally recognized term like "The Tragedy of the Commons" for this specific toggle. However, in academic literature, it is usually dissected into two overlapping concepts:

  *   **Inconsistent Pure Time Preference (PTP):** In economics, this is the technical term for discounting future welfare simply because it occurs later. The "toggle" you describe is an **inconsistent application of the discount rate**. The actor applies a high discount rate when calculating costs (future welfare is worth little) but a near-zero discount rate when calculating moral duties (future suffering is urgent).
  *   **Motivated Ontological Shifting:** This describes the rhetorical mechanism. The future people shift from being **Abstract Utility Units** (when we want to avoid cost) to **Concrete Moral Patients** (when we want to claim moral virtue).

  If you were to coin a term for this specific argumentative pattern, the most precise label would be **The Intergenerational Ontological Toggle**. It captures the shift in the *nature* of the future people (ontology) to match the desired *outcome* (policy).

  ### 2. How it differs from the Non-Identity Problem

  It is crucial to distinguish this from the Non-Identity Problem (NIP), as they are often conflated but operate on different axes.

  **The Non-Identity Problem (Parfit):**
  *   **The Question:** *Who* exists?
  *   **The Logic:** Different climate policies change the course of history, meaning different specific individuals will be conceived and born. If we choose a policy that leads to a poorer future, the people in that future owe their existence to that choice. Therefore, we cannot say we "harmed" them, because without that choice, they would not exist at all.
  *   **The Goal:** NIP is typically used to **dissolve** moral duty. It argues that we cannot owe specific duties to specific future individuals because our actions determine their identity.

  **The Ontological Toggle (Your Observation):**
  *   **The Question:** *How much* do they matter?
  *   **The Logic:**
      *   *Mode A:* They matter less because they are far away (Temporal Distance).
      *   *Mode B:* They matter significantly because they are real beings who will suffer (Moral Reality).
  *   **The Goal:** This is used to **modulate** moral duty. It accepts that future people exist (ignoring NIP) but changes their *moral weight* based on convenience.

  **Key Difference:** The Non-Identity Problem challenges the *causal link of harm*. The Ontological Toggle challenges the *moral weight of existence*. In fact, the person using the Toggle is often *ignoring* the Non-Identity Problem in the "preservation" phase (asserting duty to specific future people) while implicitly relying on a version of it in the "sacrifice" phase (treating them as abstract statistics).

  ### 3. Defining the Toggle with Boundary Cases

  To define **The Intergenerational Ontological Toggle**, we must distinguish it from consistent ethical positions. The toggle is defined by the *contradiction* in framing, not the conclusion itself.

  #### The Mechanism
  The actor switches between two frameworks:
  1.  **Economic/Utilitarian Framework:** Future people are bundles of utility at time $t+n$. Utility is discounted by rate $r$. Conclusion: Present sacrifice is inefficient.
  2.  **Deontological/Rights Framework:** Future people are rights-bearers. Suffering is a violation of rights regardless of time. Conclusion: Present sacrifice is mandatory.

  #### Boundary Case 1: Consistent Pure Time Preference (The "Hard" Economist)
  *   **Stance:** "Future welfare counts less than present welfare. Therefore, we should not sacrifice significant present resources for the future. Consequently, we also should not feel moral guilt about their suffering, as their discounted welfare does not outweigh our costs."
  *   **Verdict:** **Consistent.** (One may disagree with the morality, but the logic holds).
  *   **Why it's not the Toggle:** They do not claim a duty to preserve in the second instance.

  #### Boundary Case 2: Consistent Intergenerational Equity (The "Stern" Ethicist)
  *   **Stance:** "Temporal location is morally arbitrary. A person in 2200 matters as much as a person in 2024. Therefore, we must sacrifice present welfare to prevent their suffering."
  *   **Verdict:** **Consistent.**
  *   **Why it's not the Toggle:** They apply the same moral weight to the future in both cost-benefit analysis and duty claims.

  #### Boundary Case 3: The Intergenerational Ontological Toggle (The Hypocrite)
  *   **Stance:** "We shouldn't raise taxes for climate mitigation because future goods are discounted (Economic Framework). However, we must protect this specific wilderness because future generations will judge us/need it (Deontological Framework)."
  *   **Verdict:** **Inconsistent.**
  *   **Why it IS the Toggle:** The ontological status of the future person shifts from "Discounted Utility" to "Moral Judge/Beneficiary" solely to justify the preferred policy outcome (saving money vs. saving face/legacy).

  ### 4. Why this pattern persists (The Philosophical Context)

  This toggle exists because of the unresolved tension between **Descriptive Discounting** and **Normative Discounting**.

  *   **Descriptive:** People *do* psychologically value the present more (hyperbolic discounting).
  *   **Normative:** Philosophers (like Henry Sidgwick and Frank Ramsey) argue we *ought not* to discount the future purely on time. Ramsey called pure time preference "ethically indefensible."

  The argumentative pattern you noticed is an attempt to have it both ways:
  1.  Use **Descriptive** discounting to justify current consumption ("Humans naturally value now more").
  2.  Use **Normative** duty to justify preservation ("We ought to care about the future").

  ### Summary for your use
  If you need to reference this in writing or debate, you can accurately describe it as:

  > **"An inconsistent application of Pure Time Preference, characterized by Motivated Ontological Shifting."**

  You can explain that the interlocutor is treating future people as **abstract economic variables** when calculating costs, but as **concrete moral subjects** when calculating legacy or duty. This allows them to avoid the Non-Identity Problem when it suits them (by assuming future people are fixed entities who will suffer) while invoking Pure Time Preference when that suits them (by claiming those same entities matter less due to temporal distance).

  This is not just a logical fallacy; it is a **category error** regarding the moral status of persons across time.
