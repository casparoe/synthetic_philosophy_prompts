  ### The Fictional Episode: The Gating Controversy

  In the field of **Membrane Gating**, researchers study how ions pass through cellular walls. For decades, **Tradition A (Geometric)** dominated. They classified gates into two natural kinds: **Wide** (aperture > 5nm) and **Narrow** (aperture < 5nm). Their central law was: "All Wide gates permit Ion-X flow; all Narrow gates block it." They measured apertures using electron microscopy (instrumentation everyone agrees on). Later, **Tradition B (Chemical)** emerged. They classified gates as **Primed** (binding site exposed) or **Unprimed** (binding site obscured). Their law was: "All Primed gates permit Ion-X flow; all Unprimed gates block it." They measured binding sites using fluorescent tagging (instrumentation everyone agrees on).

  Crucially, both traditions agreed on the raw data: they could all see the aperture size and the binding site status for any given gate. Initially, Wide and Primed correlated perfectly. However, a specific mutant strain was discovered containing gates that were **Wide** (physically open) but **Unprimed** (chemically blocked). Tradition A predicted Ion-X flow (because Wide); Tradition B predicted blockage (because Unprimed). The observation showed blockage. Both sides agreed on the observation report: "Aperture 6nm, binding site obscured, zero flow." Tradition A's law was falsified; Tradition B's held. The shift to Tradition B was rationally forced by the shared evidence and shared standards of prediction (Constraints 1, 2, & 4). Yet, the central terms "Wide" and "Primed" have cross-cutting extensions: some Wide gates are Unprimed, some Narrow gates are Primed (due to chemical swelling).

  ### The Audit

  **Key Claims:**
  *   **Tradition A:** "Wide-ness is the natural kind property that nomically necessitates Ion-X flow."
  *   **Tradition B:** "Primed-ness is the natural kind property that nomically necessitates Ion-X flow."

  **Translation Attempt (A → B):**
  *   *Target:* Tradition A's claim ("Wide-ness necessitates flow").
  *   *Translation into B:* "Gates with aperture > 5nm necessitate flow."
  *   *Break Point:* Tradition B *can* utter this sentence, but it cannot assert it as a *law*. In B's taxonomy, "Aperture > 5nm" is not a natural kind; it is a heterogeneous grouping of Primed (mostly) and Unprimed (exception) gates. To B, the sentence is accidentally true for most cases but fundamentally false in principle because the *cause* is Primed-ness, not width. The translation loses the nomic necessity.

  **Translation Attempt (B → A):**
  *   *Target:* Tradition B's claim ("Primed-ness necessitates flow").
  *   *Translation into A:* "Gates with exposed binding sites necessitate flow."
  *   *Break Point:* Tradition A *can* utter this sentence, but within A's framework, "exposed binding site" is not a kind-defining feature; it is a contingent property that happens to correlate with Width. A cannot assert this as a fundamental law without abandoning its ontological commitment that Geometry is the causal basis. The translation smuggles in a causal mechanism (chemical binding) that A's vocabulary treats as secondary or epiphenomenal.

  **Symmetry:**
  The failure is symmetric regarding *lawhood*. Both can describe the other's predicates observationally, but neither can adopt the other's *classification* as fundamental without abandoning their own theoretical structure. Neither vocabulary is strictly more expressive; they carve the same world differently.

  ### The Debate: Kuhn vs. Davidson

  **The Kuhn-Style Defender:**
  "This case illustrates exactly why semantic incommensurability survives rational choice. The scientists agree on the *observations* (the neutral evidence), but they disagree on the *taxonomy* (the kinds). When Tradition B wins, they aren't just adding a new fact; they are changing what counts as a 'same kind' of object. Tradition A cannot learn Tradition B's language simply by adding words; they must re-learn how to group objects. The translation fails because 'Primed' and 'Wide' are not just labels; they are slots in a mutually exclusive classification system. You cannot state B's law in A's vocabulary because A's vocabulary presupposes that Geometry is the relevant similarity relation. To state B's claim is to deny A's presupposition."

  **The Davidsonian Objector:**
  "This is not incommensurability; it's just falsification with extra steps. If both sides agree on the observation reports ('Aperture 6nm, binding site obscured'), then they share a common language of evidence. If they share a common language of evidence, they can translate any claim that refers to that evidence. Tradition A can perfectly well understand 'Binding site exposed causes flow.' They might think it's false, or they might think it's derivative, but they understand it. To say they cannot translate it is to imply they cannot even grasp the proposition, which contradicts the fact that they agreed on the evidence that falsified their theory. Partial translation failure presupposes a background of successful translation. Here, the background (observation language) is intact, so the claim of incommensurability is illusory."

  **Adjudication:**
  The Davidsonian is right that *propositional content* regarding observations is translatable. However, the Kuhnian is right that *theoretical kind terms* are not. The user's constraint (3) specifies that the failure lies in the central classificatory terms. In this case, the incommensurability is **local and taxonomic**, not global. Davidson wins on the level of *evidence* (Constraint 1 holds), but Kuhn wins on the level of *kind membership* (Constraint 3 holds). The case shows that you can have rational theory choice (via evidence) while still undergoing a semantic shift (via taxonomy). The "meaning change" is not so severe that communication stops, but it is severe enough that the *laws* of one theory cannot be stated as *laws* in the other.

  ### Isolating the Variable

  **The Variable:**
  The work is being done by the **No-Overlap Principle of Taxonomy**. Both traditions assume that their central terms ("Wide/Narrow" and "Primed/Unprimed") partition the object space exhaustively and exclusively. Incommensurability arises because the two partitions cross-cut.

  **Removing the Variable:**
  If we remove the requirement that these terms function as *natural kinds* (i.e., if we treat them merely as convenient labels without nomic force), the case collapses into a **purely verbal dispute** or ordinary factual disagreement. If "Wide" is just a shorthand for "has flow," then the discovery of a Wide/No-Flow gate is just a definition change. But because "Wide" is supposed to pick out a *cause* (geometry), and "Primed" picks out a *cause* (chemistry), the cross-cutting implies a structural change in how the world is organized, not just how we talk about it.

  **The "Verbal Dispute" Objection:**
  A critic arguing that incommensurability is never more than a verbal dispute would attack the case here: "You've admitted they agree on all observations and instruments. Therefore, the dispute is just about which word ('Wide' or 'Primed') to attach to the causal mechanism. Tradition A just picked the wrong word for the cause. That's not incommensurability; that's being wrong."

  **Rebuttal:**
  This objection fails because it ignores the *projectibility* constraint. It's not just about attaching a word to a mechanism; it's about which properties support counterfactuals. In Tradition A, "If this gate were Wide, it would flow" is true. In Tradition B, that same counterfactual is false (if it were Wide but Unprimed, it wouldn't flow). Since the two traditions assign different truth values to the same counterfactual conditional *despite agreeing on the physical facts*, the difference is not merely verbal. It is a difference in the modal structure of their claims, which cannot be translated without loss.
