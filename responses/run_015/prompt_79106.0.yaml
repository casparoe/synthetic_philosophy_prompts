  ### Planning Sketch (Internal)

  1.  **Objective:** Construct a fictional case satisfying four tight constraints: shared evidence (1), shared instrumental access (2), semantic incommensurability via cross-cutting kinds (3), and rational theory choice (4).
  2.  **Core Tension:** Constraint 4 (rational choice via shared evidence) usually undermines Constraint 3 (incommensurability). If evidence decides the matter neutrally, why can't we translate the winner's claim into the loser's language?
  3.  **Resolution:** The incommensurability must lie in the *taxonomic structure*, not the observation language. Both sides agree on the *data* (measurements), but disagree on what constitutes a *natural kind*. The "loser" can describe the data but cannot formulate the "winner's" law as a *law* because the subject term lacks projectibility in the loser's ontology.
  4.  **Scenario:** A fictional biological field ("Membrane Gating").
      *   *Tradition A (Geometric):* Kinds defined by physical aperture size ("Wide" vs. "Narrow").
      *   *Tradition B (Chemical):* Kinds defined by binding site configuration ("Primed" vs. "Unprimed").
      *   *Conflict:* Most Wide gates are Primed, but not all.
      *   *Evidence:* A "Wide/Unprimed" gate fails to transport.
      *   *Outcome:* Tradition B wins (rational), but A cannot express B's law without losing its nomic force (semantic incommensurability).
  5.  **Audit Strategy:** Explicitly show the translation attempt fails not due to vocabulary lack, but due to the loss of *kind status*.
  6.  **Debate:** Kuhn focuses on the taxonomic change; Davidson focuses on the shared observation base allowing translation. I will adjudicate in favor of the user's distinction: semantic incommensurability is real but local, not global.
  7.  **Variable:** The "No-Overlap Principle" in taxonomy. Remove it, and it becomes a verbal dispute.

