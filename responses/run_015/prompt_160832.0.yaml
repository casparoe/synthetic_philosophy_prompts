answer: |-
  ### Brainstorming and Design Notes

  The genuine difficulty here lies in disentangling the *ontological* possibility of hypercomputation from the *epistemic* conditions required to identify a process as computational. The standard "CTT is unprovable" line fails because it treats the thesis as a monolith. The scenario forces candidates to confront the underdetermination problem: if every finite output log is consistent with a Turing machine (via lookup table), empirical evidence cannot decisively falsify the Physical reading. This reveals that the Physical reading might be empirical in form but metaphysical in practice.

  *   *Candidate 1:* "Does the device falsify the Church–Turing thesis? Explain using the three readings."
      *   *Critique:* Too binary. Candidates might simply say "Yes for Physical, No for Classificatory" without engaging with the *epistemic* problem of the finite log caveat.
  *   *Candidate 2:* "Is the Church–Turing thesis an empirical claim? Use the scenario to justify your answer."
      *   *Critique:* Invites a general essay. Doesn't force specific engagement with the independence of the readings or the definition of "computing" vs. "natural regularity."
  *   *Candidate 3:* "Analyze the scenario using the three readings. Does the verification problem undermine the claim that the device computes?"
      *   *Critique:* Better, but needs to explicitly ask about the status of the thesis *prior* to the announcement to test the "epistemic status" requirement.
  *   *Candidate 4 (Selected):* A multi-part prompt requiring an assessment of each reading, a specific discussion of the "finite log" underdetermination, and a conclusion on the independence of the readings and the prior status of CTT. This ensures candidates must manipulate the concepts, not just define them.

  ***

  ### Final Examination Question

  **Course:** PHI 505: Philosophy of Computation
  **Assessment:** Take-Home Final
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question. You may assume the standard definition of Turing computability and the unsolvability of the halting problem. No external sources are required.

  **Question:**

  Consider the following scenario. An experimental group announces they have measured a non-Turing-computable function using a device exploiting a spacetime region where a subsystem performs infinitely many discrete operations within finite elapsed proper time. The device outputs the halting predicate for arbitrary Turing machines. However, three caveats apply: (1) The device is single-shot; outputs cannot be independently checked by simulation. (2) Reliability degrades with input size (attributed to engineering noise). (3) Every finite log of input-output pairs is consistent with a Turing machine utilizing a sufficiently large lookup table.

  In this course, we distinguished three readings of the Church–Turing Thesis (CTT):
  1.  **Classificatory:** CTT analyses the intuitive notion of an effective procedure (what a human following rules can do).
  2.  **Physical:** No physically realizable system computes anything beyond the Turing-computable.
  3.  **Methodological:** CTT licenses the practice of moving from informal algorithms to formal models and treating computability as univocal.

  Write an essay addressing the following:
  1.  Assess the impact of this device on each of the three readings. Does the device threaten the same claim in each case?
  2.  Given caveat (3), does the device genuinely *compute* a non-computable function, or does it instantiate a natural regularity we are interpreting as such? How does this distinction affect the Physical reading?
  3.  Can one coherently hold that the Physical reading is false while continuing to rely on the Methodological reading? What does this imply about the independence of these readings?
  4.  Finally, what does this episode reveal about the epistemic status of CTT *before* the announcement? Specifically, is the claim that "no finite body of evidence can discriminate CTT from its negation" best understood as indicating CTT is an empirical law, a definition, a regulative principle, or a mistake?

  ***

  ### Model Answer

  *(Note: In the following model answer, statements presented as settled consensus are unmarked. Statements marked [Contested] indicate significant philosophical disagreement. Statements marked [Author's View] indicate my own substantive position, offered here to model clarity about commitment levels.)*

  The Church–Turing Thesis (CTT) is not a monolithic claim but a cluster of distinct assertions. The scenario provided tests the resilience of each cluster member differently. To evaluate the device's impact, we must distinguish between what the device *is* (ontologically) and what we can *know* about it (epistemically).

  Regarding the **Classificatory reading**, the device poses no threat. This reading concerns the analysis of "effective calculability" rooted in human rule-following. The device relies on exotic spacetime geometry and infinite operations within finite time, which falls outside the intuitive notion of a human following a finite recipe. [Contested: Some argue the intuitive notion is broader than human practice, but the standard view restricts it to finite, mechanical steps.] Therefore, even if the device works, it does not compute *effectively* in the sense analysed by this reading. The Classificatory thesis remains true because the device does not fall under the concept it analyses.

  The **Physical reading** is ostensibly threatened but epistemically shielded. Ontologically, if the device works, the Physical reading is false: a physical system computes a non-Turing-computable function. However, caveat (3) introduces radical underdetermination. Since any finite output log is consistent with a Turing machine using a lookup table, no finite evidence can distinguish the hypercomputer from a standard computer with pre-loaded answers. [Author's View: This suggests the Physical reading is empirical in form but metaphysical in practice; it is falsifiable only by infinite observation.] Consequently, while the device *might* falsify the Physical reading, we can never verify that it has done so. This raises the question of whether the device *computes* or merely instantiates a natural regularity. If "computation" requires the potential for verification or control, the device is merely a physical oracle—a natural phenomenon we read as computational. If the Physical reading is understood as "no physical system yields non-Turing outputs," it is falsified; if understood as "no physical system *computes*...," it may survive if the device fails the criteria for computation.

  The **Methodological reading** remains intact regardless of the device's success. This reading licenses the practice of formalizing algorithms. Mathematicians do not rely on the Physical reading to prove theorems; they rely on the stability of formalisms. [Contested: Some argue methodological practice depends on physical realizability, but the consensus is that mathematical practice is independent of physical contingency.] Therefore, one can coherently hold that the Physical reading is false (hypercomputation is possible) while maintaining the Methodological reading (we should continue using Turing machines for algorithmic analysis). This demonstrates the **independence of the readings**. The Methodological reading is a normative principle about practice, not a descriptive claim about physics.

  Finally, what does this reveal about the epistemic status of CTT *before* the announcement? The fact that no finite evidence discriminates CTT from its negation suggests it is not a standard empirical law. Empirical laws are typically decidable by finite evidence. Nor is it purely definitional, as the Physical reading makes a claim about the world. [Author's View: The best understanding is that CTT is a regulative principle or a conceptual framework that structures inquiry, rather than a proposition with a simple truth value.] The episode reveals that treating CTT as a single empirical claim is a mistake. It is a hybrid: conceptual in its Classificatory form, empirical (but underdetermined) in its Physical form, and normative in its Methodological form. The inability to falsify it decisively indicates that its primary role is not to describe the world, but to define the boundaries of the computational framework within which we describe the world.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **1. Distinction and Application of the Three Readings (5 Marks)**
  *   **5:** Clearly defines all three readings and applies them distinctly to the scenario.
  *   **3:** Defines readings but conflates them in application (e.g., treats Physical and Methodological as identical).
  *   **1:** Merely lists readings without applying them to the device.
  *   *Common Error:* Treating CTT as a single claim that is either "true" or "false" overall.

  **2. Analysis of the Classificatory Reading (5 Marks)**
  *   **5:** Correctly identifies that the device falls outside the "effective procedure" concept (human/finite rules), leaving this reading untouched.
  *   **3:** Argues the reading is threatened because the device outputs values, ignoring the "effective procedure" constraint.
  *   **1:** Claims the reading is falsified because the device computes.
  *   *Common Error:* Confusing "computing" generally with "effective calculability."

  **3. Analysis of the Physical Reading and Underdetermination (5 Marks)**
  *   **5:** Recognizes the tension: ontologically falsified if real, but epistemically protected by caveat (3) (finite log consistency). Discusses the "computing vs. regularity" distinction.
  *   **3:** States the Physical reading is falsified without addressing the verification/underdetermination problem.
  *   **1:** Ignores caveat (3) or claims the device proves CTT false decisively.
  *   *Common Error:* Failing to see that finite evidence cannot distinguish hypercomputation from lookup tables.

  **4. Independence of Readings (Methodological vs. Physical) (5 Marks)**
  *   **5:** Argues coherently that Methodological practice can continue even if Physical is false (normative vs. descriptive). Explicitly affirms independence.
  *   **3:** Suggests they are linked but doesn't explain why practice might survive.
  *   **1:** Claims Methodological must fall if Physical falls.
  *   *Common Error:* Assuming mathematical practice depends on physical realizability.

  **5. Conclusion on Epistemic Status (5 Marks)**
  *   **5:** Identifies CTT as hybrid/regulative rather than purely empirical or definitional. Notes the "mistake" of treating it as monolithic.
  *   **3:** Concludes it is empirical but unfalsifiable, without nuanced categorization.
  *   **1:** Concludes it is simply a definition or simply an empirical law.
  *   *Common Error:* Asserting a single status (e.g., "It is a definition") without addressing the Physical reading's empirical form.

  **Differentiation (A vs. B):**
  *   **A Grade (20-25):** Explicitly engages with caveat (3) as an epistemic blocker (Point 3) and argues for the normative independence of the Methodological reading (Point 4). Acknowledges contested areas (e.g., whether Physical is truly empirical).
  *   **B Grade (15-19):** Correctly applies the three readings but treats the verification problem superficially (e.g., "it's hard to check" vs. "logically consistent with TM"). Treats the readings as more tightly coupled than an A answer.

  **Note on Contested Positions:**
  Candidates may argue that the Physical reading *is* straightforwardly empirical and the device falsifies it, regardless of verification issues (Popperian falsificationism). Credit is awarded if this is argued coherently, provided they acknowledge the underdetermination caveat. Candidates may also argue the Classificatory reading *should* be updated to include hypercomputation; credit is awarded for argumentative rigor, though the standard view (that it concerns effective procedures) is the baseline for full marks.
