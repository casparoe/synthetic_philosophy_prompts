  8.  **Key Insight to Highlight:** The "Scarcity Trap." When you feel broke, your IQ effectively drops regarding financial decisions. The $500 transfer might be *causing* the scarcity that leads to the $60 takeout.

  9.  **Final Polish:** Check against the user's specific constraints (1st vs 22nd, $500 vs $60, separate agent attempt). Ensure the advice addresses the *thinking* style, not just the math. (Self-Correction: Make sure to explicitly answer "Is there a coherent way to think about this split?")

  10. **Final Structure:**
