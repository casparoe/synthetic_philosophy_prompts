      *   **The Thematic Friction:** Kaelen argues for "Yes" based on the rules. Elara sees the rules are broken.
      *   **The Decision:** She has to choose Yes or No. She chooses based on the integrity of the method, not the truth of the past (which is unknowable).
      *   **The Verdict:** She delivers the word. The consequences are immediate (funding cut, ritual changed, or social unrest). Let's go with social/structural consequence.

  4.  **Drafting - Section by Section:**

      *   *Scene Setting:* Elara holding the ostracon (pottery shard). Dust motes. The weight of the verdict.
      *   *The Document:* A grain ration list. "To the Guard of the Gate. 5 measures. Signed by Overseer Jem." The Vulgate says the King fed the guards personally. This says an Overseer did.
      *   *Applying the Rules:*
          *   Independence: It's in the Spoil, not the Vulgate. So it counts?
          *   Embarrassment: It diminishes the King's role (Overseer vs. King). So it's likely genuine?
          *   *Problem:* The ink is too fresh. The pottery style is slightly off. Or better: There are *too many* corroborating shards.
      *   *The Insight:* She finds a pattern. The "embarrassing" details are clustered. Someone planted them to make the Spoil look authentic while protecting the core myth. Or someone destroyed the *really* embarrassing stuff.
      *   *The Colleague:* Kaelen enters. He wants the "Yes." He argues the model of survival. "Why would anyone forge a grain receipt?"
      *   *Elara's Counter:* Because forgery creates the *illusion* of independence.
      *   *The Choice:* If she says "No," the city's legal basis collapses. If she says "Yes," she lies about the history.
      *   *The Climax:* She realizes the fight isn't about the past, but the model of what survives. She chooses "No" because the *method* is compromised, even if the event happened.
      *   *The Ending:* She speaks the word. The Council reacts. The city changes.

  5.  **Refining the Thematic Points:**
