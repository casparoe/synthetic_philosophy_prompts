      *   Ensure the verdict is one word.

  *(Self-Correction on Verdict)*: The prompt asks for "did the founding happen, yes or no." If she says "No," it implies myth. If "Yes," history. The twist is that the *method* determines the truth. If the Spoil is curated, the method fails. So she must say "No" not because it didn't happen, but because it cannot be *known* as history under the current rules.

