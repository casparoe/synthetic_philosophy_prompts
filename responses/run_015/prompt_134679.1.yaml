answer: |-
  The clay shard was heavy for its size, dense with the grit of fired river mud. Elara turned it over in her gloved hands, the edges rough enough to catch the skin. It was a tax ledger fragment, Box 409, Subsection C. On the face, faded ink recorded a delivery of olive oil to the Western Gate during the Month of Frost, Year One.

  Year One. The Founding.

  Outside the vault, the Council of Stewards waited. They needed a word. *Yes*, and the Jubilee funding continued, the Vulgate recited with the force of law. *No*, and the city's legal charter reverted to common custom, the priesthood stripped of their tithe, the origin story reduced to poetry.

  Elara placed the shard on the felt pad. Beside it lay the Vulgate text, bound in white leather. The Vulgate stated that during the Month of Frost, the First King personally rationed the gates to ensure equality. The shard said the oil was delivered by a "Overseer Kael."

  According to the Archive's rules, this was history. The detail appeared in the Spoil independently of the Vulgate. Furthermore, it embarrassed the founding myth: the King was not omnipresent; he delegated. The embarrassment heuristic suggested authenticity. People do not forge documents to make their heroes smaller.

  "Elara."

  Magister Vonn stood in the doorway of the vault. He didn't enter; the air in the Spoil was too dry for his lungs. He held a tablet, stylus hovering.

  " The Council grows impatient," Vonn said. "The shard corroborates the timeline. The King was at the gate. The name of the overseer is incidental."

  "The name is the point," Elara said. She picked up a magnifying lens. "Look at the ink saturation."

  Vonn stepped in, violating protocol. He leaned over the shard. "It's consistent with First Era carbon."

  "It's too consistent." Elara pointed to the stroke of the letter 'K'. "See the hesitation? The scribe knew what he was writing. But look at the clay matrix." She tapped the edge. "This shard matches the temper of the storage jars found in the Upper District. But the Western Gate was in the Lower District. Why would a gate receipt be filed with Upper District storage records?"

  "Survival bias," Vonn said immediately. "The Lower District burned. The Upper District didn't. We only have what survived."

  "That's the model," Elara said. "But is it the past?"

  She pulled another box toward her. Box 410. Inside were twelve similar shards. All dated to the Month of Frost, Year One. All mentioning Overseer Kael. All found in the Upper District.

  "Twelve confirmations," Vonn said. "The independence rule is satisfied twelve times over. The founding happened. The King was there. The logistics are verified."

  "Twelve confirmations of the same minor discrepancy," Elara said. "If the Spoil is truly unsorted, why are all the embarrassing details clustered in one box? Why are there no shards that say the King wasn't there at all? No receipts showing the gate was abandoned?"

  "Because those weren't written," Vonn said. "Or they rotted."

  "Or they were never made." Elara looked at him. "Someone gardened the Spoil, Vonn. They planted these shards to satisfy the independence rule. They created a paper trail of dissent to make the core narrative unassailable. They gave us an Overseer Kael so we wouldn't ask why the King's signature is missing from the main ledger."

  Vonn straightened up. "You're alleging a conspiracy spanning three centuries? That someone forged ancient clay?"

  "I'm alleging that the independence assumption is broken." Elara's voice was quiet. The vault hummed with the climate control systems, keeping the humidity at a precise forty percent. "If the Spoil is curated, then corroboration means nothing. A forgery can embarrass. A lie can shame. If I want to protect the King, I plant a receipt showing he was human. It makes the myth durable. It makes it history."

  "The Council doesn't pay for metaphysics," Vonn said. "They pay for verification. The shard exists. The ink is old. The rule says yes."

  "The rule says yes only if the Spoil is independent," Elara said. "If the Spoil is a mirror of the Vulgate, cracked to look random, then we have no data. We have one story told twice."

  She looked down at the shard. The grain of the clay seemed to shift under the light. This was the difficulty. The vague claim—*the city was founded*—was almost certainly true. People didn't build walls around nothing. But the specific claim—*the King founded it according to the Vulgate*—was what the verdict hinged on. The Council needed to know if the Charter held. If the Founding was history, the Charter was divine law. If it was legend, the Charter was contract.

  Elara thought about the absence of evidence. There were no records of the oil press that supplied the gate. No records of Overseer Kael's appointment. Vonn would say this was expected; records decay. But Elara knew the decay rates of Lower District clay. It should have survived in the silt. Its absence was a shape. The model of survival Vonn used assumed random decay. Elara's model assumed selective preservation.

  They were not fighting about the past. They were fighting about how much of the past should be here.

  "If I say yes," Elara said, "we validate the method. We tell every archivist who comes after me that if you plant enough corroborating lies, they become truth."

  "If you say no," Vonn said, "you dissolve the city. The Stewards will not accept 'maybe'. They need the leverage."

  "Then they need a lie."

  Elara picked up the shard again. It was heavy. It felt real. That was the trap. The physical reality of the object seduced the mind into accepting the narrative attached to it. The oil had been delivered. Someone had written this down. But *why* had this specific shard survived while others vanished?

  Survival is not neutrality. Survival is an argument.

  She thought of the twelve shards in Box 410. Perfectly calibrated to satisfy the embarrassment heuristic. Too perfect. A genuine messiness would have included contradictions that couldn't be resolved. These shards resolved neatly into a single narrative: *The King was there, but he was busy.* It was a flattering embarrassment. It made the King human without making him absent.

  Elara set the shard down. She picked up her stylus and the verdict tablet.

  "Elara," Vonn warned. "Think of the Jubilee. Think of the schools."

  "I am," she said. "If the foundation is rot, the school falls anyway."

  She pressed the stylus into the wax. The sound was sharp, a small fracture in the quiet room. She did not look at Vonn. She looked at the shard, this piece of fired mud that claimed to be a witness. It was a witness only to the fact that someone wanted her to believe it was a witness.

  The independence rule was the safeguard. It was the only thing separating history from propaganda. If that safeguard was compromised, the only honest verdict was negative. Not because the event didn't happen, but because the link between the event and the record was severed.

  She stood up. The weight of the verdict sat in her hand, lighter than the clay, heavier than the city.

  "Wait," Vonn said. "You can't prove the curation. You have no evidence of the forger."

  "I don't need evidence of the forger," Elara said. "I have evidence of the garden. Nature doesn't plant in rows."

  She walked past him, out of the vault, into the corridor where the air was warmer. The Council chamber was at the end of the hall. The doors were oak, carved with the faces of the First King. They looked different now, less like history and more like masks.

  Elara entered the chamber. The Stewards sat in a semicircle, robes of office stiff with embroidery. The High Steward leaned forward.

  "Archivist," he said. "The verdict."

  Elara stood before the dais. She could feel Vonn standing in the shadows behind her, holding his breath. She thought of the grain tally, the oil, the gate. She thought of the thousands of citizens who would wake up tomorrow without the Jubilee funding, the priests who would lose their tax exemption, the legal chaos that would follow a charter demoted to poetry.

  But she thought also of the next archivist, fifty years from now, holding a forged shard and being told it was truth because the rules said so.

  "The verdict," the High Steward prompted.

  Elara spoke. The word was single, clear, and absolute.

  "No."

  The silence was not immediate; it rippled. A murmur started in the back rows, then crashed against the dais. The High Steward's face went pale, then hard. He struck his gavel, once, twice.

  "On what grounds?" he demanded. "The Spoil corroborates!"

  "The Spoil echoes," Elara said. "There is a difference."

  "You understand the consequences?" the High Steward said. "The Charter is void. The Tithe is suspended. The city reverts to council rule."

  "I understand."

  "Then you understand you are ending the City of the King."

  "No," Elara said. "I am ending the City of the Archive. The rest remains."

  She turned and walked out. Behind her, the shouting began, the procedural arguments, the threats of impeachment. She did not look back. She returned to the vault. Vonn was gone. The shard sat on the felt pad, waiting to be boxed.

  Elara picked it up. It was just clay. It held no magic. It held no law. It was a thing that had survived because someone wanted it to. She placed it in a box labeled *Unverified*. She closed the lid.

  The work would start tomorrow. They would have to rebuild the laws without the myth. It would be messy. It would be human. It would not be history, not yet. But it would be true.

  She turned off the light. The vault went dark, save for the green glow of the climate sensors. The hum continued, keeping the air dry, keeping the paper from rotting, keeping the silence intact. Elara locked the door and walked into the noise of the city, which was finally, for the first time, hers.
