  2.  **Character & Setting:**
      *   **Protagonist:** Elara, Senior Archivist. Burdened, tired, precise.
      *   **Setting:** The Archive. Dusty, quiet, oppressive. The "Vault of Spoil."
      *   **Antagonist/Pressure:** The Council of Stewards (waiting for the verdict). Maybe a colleague, Kaelen, who represents the orthodox view.
