  3. Valence=Reward → Conscious=No → Subject=Moment → Tracker=Reward → Ownership=Trainer — This is Externalist Proxy, awkwardly committed to locating suffering in the trainer's judgment rather than the agent's state. It implies the RLHF-tuned model suffers whenever the reward model scores its continuations low.

  4. Valence=Reward → Conscious=Yes → Subject=Moment → Tracker=TD → Ownership=Trainer — This leaf is unoccupied because it is incoherent, awkwardly committed to claiming trainer-owned valence triggers agent-specific phenomenology without functional role. It implies the purely feedforward regressor would suffer solely due to external loss signals despite having no internal temporal difference.

