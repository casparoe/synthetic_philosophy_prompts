      *   *The Cases:* Need to be specific enough to feel real but abstract enough to fit the prompt.
          *   Case A: Ring Species (Island Chain). Asymmetric gene flow (A connects to B, B to C, C to D, but D doesn't connect to A, yet D flows back to B slightly?). Let's simplify for a 90-min workshop: A-B-C-D chain. A & D meet but don't interbreed, but gene flow exists across the chain.
          *   Case B: Cryptic Pair. Genetically distinct (long separation), but identical morphology, behavior, niche.
      *   *The Roles:*
          *   Taxonomist: Concerned with stability, nomenclature, diagnostic traits.
          *   Conservation Lawyer: Concerned with legal protection units, funding eligibility (ESA style).
          *   Evolutionary Theorist: Concerned with lineage independence, process, future trajectory.
      *   *The Consequences:*
          *   If 1 Species: Funding pool is shared (diluted), or evolutionary model assumes panmixia.
          *   If 2+ Species: Funding is split (one might go extinct), or evolutionary model assumes independent drift.

  3.  **Drafting the Content - Section by Section:**

      *   **Title:** Needs to sound academic and precise. "Operationalizing the Species Problem."
      *   **Objective:** Clarify the pedagogical goal (practical commitment vs. abstract theory).
      *   **Materials:** Handouts, role cards, case files.
      *   **Procedure:** Step-by-step flow.
      *   **The Cases (Detailed):** I need to write the specific scenarios into the proposal so the user knows exactly what to hand out.
          *   *Scenario 1 (The Ring):* "The Archipelago *Zosterops* Complex." 5 islands. Gene flow 1-2-3-4-5. 5 and 1 coexist but don't mate. However, 5 sends migrants to 2.
