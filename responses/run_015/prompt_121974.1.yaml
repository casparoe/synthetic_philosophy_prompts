          1.  Workshop Activity Design.
          2.  Debrief (mapping disagreement to BSC/PSC/MSC metaphysical commitments).
          3.  Honest Note (limitations of the scenario, e.g., temporal/normative dimensions).
          4.  Predictable Failures (given philosophy student audience) & Mitigation.
      *   **Tone:** Formal register (workshop proposal).
      *   **Constraint:** No bibliographies, reading lists, or citations.

  2.  **Deconstruct the Activity Design:**
      *   *Time Management:* 90 minutes total.
          *   Intro/Setup: 10 mins.
          *   Role Assignment & Case Study Distribution: 10 mins.
          *   Deliberation/Decision Making: 30 mins.
          *   Consequence Reveal & Reaction: 15 mins.
