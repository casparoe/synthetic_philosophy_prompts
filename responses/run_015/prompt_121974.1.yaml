          *   Lawyer: If you lump, endangered population gets swallowed by abundant one (no funding). If you split, distinct funding but higher scrutiny.
          *   Theorist: If you lump, you assume homogeneity in models. If you split, you assume independence.
      *   **Debrief:** Connect the friction points to Species Concepts.
          *   BSC (Biological): Reproductive isolation vs. gene flow.
          *   PSC (Phylogenetic): Monophyly vs. diagnosability.
          *   MSC (Morphological): Phenotype vs. Genotype.
      *   **Limitations:** What's missing? The deep time aspect (fossils), the normative "ought" of nature itself vs. human categorization.
      *   **Predictable Failures:**
