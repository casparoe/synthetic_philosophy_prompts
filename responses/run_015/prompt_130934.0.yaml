answer: |-
  **Seminar Handout: Disaggregating 'Familiarity Breeds Contempt' in Democratic Theory**

  **Context:**
  The proverb 'familiarity breeds contempt' is being deployed in our discussion to argue against career politicians and in favour of sortition. However, the slogan conflates distinct mechanisms. To evaluate it rigorously, we must separate the claim into four philosophical categories. Below is a menu of interpretations, evaluating their logical status and their implications for institutional design (career service, term limits, or sortition).

  ***

  ### 1. The Psychological Claim: The Corrupting Individual
  **The Claim:** Prolonged exposure to the demands of constituents and the perks of office causes the individual representative to lose respect for the public and become morally arrogant.
  *   **Logical Status:** **Defensible Empirical Thesis.** There is psychological evidence regarding 'compassion fatigue' and the corrupting influence of power (the 'power paradox'). However, it risks becoming a **Platitude** if asserted without evidence of specific behavioural changes.
  *   **Distinction:** This addresses **Moral Corruption of the Office-holder**. It concerns the virtue (or vice) of the agent.
  *   **Institutional Implications:**
      *   **Supports Term Limits:** Yes. If tenure causes moral decay, mandatory rotation prevents the decay from setting in.
      *   **Supports Sortition:** Yes, potentially more strongly. If amateurs serve one term and leave, they never have the opportunity to become familiar enough to breed contempt.
      *   **Undermines Career Model:** Yes. This is the direct argument against professionalisation.

  ### 2. The Institutional Claim: Memory vs. Capture
  **The Claim:** Long-serving bodies become too familiar with lobbyists and bureaucratic procedures, leading to regulatory capture; conversely, high turnover prevents the accumulation of necessary institutional knowledge.
  *   **Logical Status:** **Defensible Empirical Thesis.** This is a trade-off between 'capture' (too much familiarity with special interests) and 'competence' (too little familiarity with legislative procedure).
  *   **Distinction:** This addresses the **Erosion of Institutional Memory**. It is not about the soul of the politician, but the functionality of the assembly.
  *   **Institutional Implications:**
      *   **Supports Term Limits:** Ambiguous. Term limits reduce capture but also accelerate memory loss compared to a career model.
      *   **Supports Sortition:** **No.** This claim actually *undermines* sortition. Random selection maximises turnover, thereby maximising the loss of institutional memory. If 'familiarity' (with the job) is required for competence, sortition is the worst offender.
      *   **Undermines Career Model:** Yes, regarding the risk of capture by entrenched interests.

  ### 3. The Epistemic Claim: Expertise as Elitism
  **The Claim:** Legislative 'expertise' is merely a codified form of contempt for the layperson's judgement; therefore, familiarity with the law should not grant authority.
  *   **Logical Status:** **Non-Sequitur.** This conflates *technical competence* with *moral attitude*. One can possess deep knowledge of tax law without holding the public in contempt. Equating experience with arrogance is a rhetorical leap, not a logical deduction.
  *   **Distinction:** This blurs **Moral Corruption** and **Epistemic Value**. It assumes that knowing more makes one value the 'common sense' of the voter less.
  *   **Institutional Implications:**
      *   **Supports Term Limits:** Weakly. It suggests experience is suspect, but does not necessarily demand rotation.
      *   **Supports Sortition:** Yes. This is the primary epistemic defence of sortition: that 'naivety' is a virtue because it reflects the public's actual knowledge state.
      *   **Undermines Both:** If taken to the extreme, this claim undermines *any* representative system. If familiarity with governance breeds contempt for the governed, then even a term-limited representative becomes 'contemptuous' by the end of their short term. It suggests a system with no representatives at all (pure direct democracy) might be the only logical conclusion.

  ### 4. The Normative Claim: The Ideal Distance
  **The Claim:** A healthy democracy requires representatives who remain 'strangers' to power to maintain humility; familiarity with the machinery of state is inherently undemocratic.
  *   **Logical Status:** **Platitude / Normative Assertion.** This is a statement of political values rather than fact. It prioritises 'humility' over 'efficacy'. It is defensible as a normative stance but cannot be proven empirically.
  *   **Distinction:** This is a **Normative** claim about the *character* of the regime, rather than the psychology of the individual or the memory of the institution.
  *   **Institutional Implications:**
      *   **Supports Term Limits:** Partially. It favours the 'citizen-legislator' ideal.
      *   **Supports Sortition:** Strongly. Sortition is the only mechanism that guarantees the representative remains a 'stranger' to the office until the moment of selection.
      *   **Undermines Career Model:** Yes. It defines the career politician as normatively undesirable regardless of their output.

  ***

  ### Summary for Discussion

  When the student invokes 'familiarity breeds contempt', ask them to specify which 'menu item' they are ordering:

  1.  **If they mean Psychological (Moral Corruption):** They argue that power rots the individual. This supports **Term Limits** and **Sortition** equally, as both remove the individual from power.
  2.  **If they mean Institutional (Memory vs. Capture):** They argue that knowing the system leads to rigidity. This supports **Term Limits**, but arguably *counts against Sortition*, as sortition causes a catastrophic loss of institutional memory that term limits (which allow for some overlap) might mitigate.
  3.  **If they mean Epistemic (Expertise is Contempt):** They argue that knowledge creates distance. This is the weakest link (**Non-Sequitur**). If accepted, it supports **Sortition** but risks undermining the very concept of a functioning legislature, regardless of how members are selected.

  **Crucial Distinction to Press:**
  Does the student believe the problem is that politicians become *bad people* (Moral Corruption), or that the institution becomes *inefficient/captured* (Institutional Memory)?
  *   If the former, sortition is a cure.
  *   If the latter, sortition may be the disease, as it ensures the institution never becomes familiar enough with itself to function effectively.

  *Note: Ensure the discussion recognises that 'contempt' can flow both ways: the representative towards the voter, and the voter towards the representative. The proverb is often used to explain voter cynicism (voters know politicians too well), which complicates the argument for sortition if the goal is to restore public trust.*
