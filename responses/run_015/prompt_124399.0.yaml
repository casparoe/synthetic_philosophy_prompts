  Mara, a professional fact-checker, verifies via three independent official records that the minister resigned ($p$). Relying on process reliabilism, she counts as knowing $p$ because her method is truth-tracking, but due to an involuntary, trauma-induced skepticism regarding political news following a recent deepfake campaign, she lacks the subjective conviction constitutive of belief. She is epistemically blameless because the skepticism is a non-volitional response, yet while a colleague can correctly say Mara knows $p$ without believing it, Mara cannot herself assert "The minister resigned, but I don't believe it" without sounding absurd to an ordinary hearer.

  **Specification Check**
  The case relies on **Process Reliabilism** for knowledge, which secures justification through reliable truth-tracking processes regardless of internal conviction, satisfying condition (1). Condition (2) is met because Mara sincerely lacks the feeling of assent; this is not hesitant belief because she treats $p$ merely as a working hypothesis for her job rather than a fact she holds true. She is blameless (3) because her skepticism is an involuntary psychological response to external deception, not a failure of rational duty. A third party can felicitously describe her as knowing without believing (4) because they observe the reliable process and the lack of conviction simultaneously. However, her first-person utterance (5) remains absurd because assertion generates a normative commitment she explicitly disavows.

  **Verdicts and Analysis**
  The **doxastic reading** fails here: since Mara is epistemically blameless and her attitudes are not irrational (given the externalist allowance for knowledge without belief), the doxastic account predicts the utterance should be acceptable, yet it remains absurd. The **knowledge-norm account** explains why asserting $p$ is permissible but struggles to explain why conjoining it with "I don't believe it" is forbidden unless it smuggles in a belief norm. The **commitment/scoreboard account** succeeds: by asserting $p$, Mara undertakes a public commitment to believe $p$, so adding "I don't believe $p$" creates a pragmatic contradiction between her undertaken commitment and her avowed state, regardless of her actual psychology.

  The **load-bearing feature** is the divergence between the normative commitment incurred by assertion (public) and the psychological state of the speaker (private). If this feature is removed—specifically, **if the speaker does believe $p$**—the case collapses into a standard lie or falsehood, where the second conjunct is simply false, rather than a Moore-paradoxical assertion that could be true but cannot be said. The **strongest reply** open to a doxastic theorist is that knowledge conceptually entails belief; this is more damaging than it first looks because it renders the scenario metaphysically impossible, thereby destroying the counterexample entirely rather than merely disputing its theoretical interpretation.

