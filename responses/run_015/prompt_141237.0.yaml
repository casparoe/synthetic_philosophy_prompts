prompt: |-
  Hey, I keep going back and forth on split-brain stuff and I want to know what I actually believe, so here are my gut verdicts — I'd like a principle that gets them, or a straight answer about which ones I have to give up.

  1. Adult, corpus callosum fully cut. Left hand unbuttons the shirt the right hand just buttoned, and the speaking half confabulates some reason when asked why. My gut says: two subjects now, not one.
  2. Same guy two years later: the halves have worked out a truce, he gets through his day fine, insists he feels like himself. I want to say one subject again — which I realise contradicts 1, since the wiring is the same.
  3. Someone born without a corpus callosum: obviously one subject. So the anatomy by itself can't be what's doing the work.
  4. Adult who had an entire hemisphere removed: one subject, and the same person, no hesitation.
  5. Suppose we could do the callosotomy gradually, a few thousand fibres a week for two years, ending in a complete cut. I feel it's one subject the whole way and there's no moment where it becomes two — but the end state is exactly case 1.
  6. Full cut, but bridged with an implant that passes only a crude summary across — say, just whether the other side is having a good or bad time right now. My gut flips back toward one subject, or at least not clearly two.
  7. Future tech: we grow replacement tissue from someone else's DNA and swap in a hemisphere a bit at a time, callosum intact throughout so it stays wired in. One subject, same person. But the very same swap done all at once in one operation pulls me toward "different person," or maybe "two people stuck together," even though the end state is identical.

  The rule I keep reaching for is something like: you've got as many subjects as there are streams of consciousness that can't get information to each other — one subject per bundle that's informationally closed off from the rest. But it seems to break on 5 (where's the boundary?) and 6 (a trickle is enough?).

  Can you state that precisely, or give me two or three candidate principles, say exactly which of my verdicts each one sacrifices, and then run it on a case I havn't listed: each half of a fully cut callosum transplanted into a seperate body, both waking up. Also, whatever principle you land on, what does it say about which half gets to decide when they disagree about a risky surgery — and is that a question about how many subjects there are, or a different question entirely?
