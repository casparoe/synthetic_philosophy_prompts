answer: |-
  You have stumbled onto one of the most famous and difficult problems in modern decision theory. The argument your friend presented is a version of **Pascal's Mugging**, and your intuition that it leads to paralysis (because every action has both infinite positive and infinite negative expected value) is a known and devastating critique called the **Problem of Fanaticism** or **Infinity Washing**.

  You asked where the argument actually goes wrong and whether you have to drop Expected Value (1) or Unbounded Value (2).

  The honest answer is: **You cannot keep both (1) and (2) in their strict forms without accepting the conclusion you find absurd.** If you accept strict Expected Value maximization and strictly Unbounded Value, the math forces you into the mugger's trap, or worse, into the paralysis you described.

  Here is the breakdown of why this happens, where the weak link is, and what it costs to fix it.

  ### 1. Why your "Symmetry" Objection is Correct
  Your friend's argument relies on the idea that a tiny probability $\times$ a huge number = a big number. But as you noticed, for every "huge positive number" story, there is a mirror "huge negative number" story.

  If value is truly unbounded, the expected value of *any* action becomes the sum of an infinite series that does not converge.
  *   Action A: $0.000...1 \times (+10^{40}) + 0.000...1 \times (-10^{40}) + \dots$
  *   This is effectively $\infty - \infty$.

  In mathematics, this is **undefined**. It doesn't tell you to pay the mugger; it tells you that Expected Value theory has broken down and can no longer rank actions. Your friend claims the theory tells you to pay; you correctly identified that the theory actually tells you nothing. This is a stronger rebuttal than his position.

  ### 2. The Weak Link: Premise (2) Unbounded Value
  While it feels intuitive to attack (4) or (5) (the probability claims), the mathematical engine driving this paradox is Premise (2): **"Value is unbounded."**

  If utility is unbounded, it means there is no limit to how good an outcome can be. If there is no limit, then for *any* probability $p > 0$, there exists some outcome $X$ so valuable that $p \times X$ outweighs any certain outcome.

  To solve Pascal's Mugging, you generally have to choose one of two paths:

  #### Path A: Attack Premise (5) via "Complexity Priors"
  You mentioned you'd hate to give up (4) and (5). However, there is a principled reason to reject (5) ("you can always make the number bigger") without setting probabilities to zero.

  This is the **Complexity Prior** argument. In formal epistemology (specifically Solomonoff Induction), the probability of a hypothesis decreases exponentially with its **complexity** (how many bits of information it takes to describe it).
  *   To claim you can save $10^6$ lives, the story is relatively simple.
  *   To claim you can save $3 \uparrow\uparrow\uparrow 3$ lives (a number so big it dwarfs atoms in the universe), the description of the mechanism required to save that many lives is incredibly complex.

  If probability drops *exponentially* as the stakes grow *linearly* (or even polynomially), the Expected Value will eventually converge. The "bigger number" trick stops working because making the number bigger requires a more complex story, which makes the probability vanish faster than the value grows.

  **The Cost:** This requires you to accept that "implausibility" *is* evidence, specifically quantified by description length. It saves Expected Value theory, but it requires a specific, somewhat technical view on how probabilities are assigned.

  #### Path B: Attack Premise (2) via "Bounded Utility"
  This is the standard solution in economics and decision theory. You accept that while saving more lives is better, **value has diminishing returns that eventually asymptote to a maximum.**

  Saving 10 lives is much better than saving 1. Saving 1,000,000 is better than 10. But saving $10^{30}$ lives is not a trillion times better than saving $10^{18}$. At some point, you run out of "moral room."

  Why? Because value is a function of *preference satisfaction* or *experience*, and agents (like humans) have finite capacity to experience value. Alternatively, you can view it as: once you have secured the existence of all possible future beings, there is no "more" to be done.

  **The Cost:** You have to admit that there is a theoretical ceiling on how good the universe can get.
  **The Benefit:** It completely immunizes you against Pascal's Mugging. If the maximum possible value is $V_{max}$, then the Expected Value of any action is at most $V_{max}$. A tiny probability $\times$ $V_{max}$ is a small number. It will never outweigh a high-probability chance to save a few lives (like bednets).

  ### 3. What This Costs You (And What It Saves)
  You said the bits you'd most hate to give up are (1) Expected Value and (2) Unbounded Value.

  *   **If you keep (1) and drop (2) [Bounded Utility]:**
      *   **Cost:** You lose the ability to say "A trillion lives is exactly a trillion times better than one life." You have to accept diminishing marginal value.
      *   **Gain:** You keep your charity intuition. Bednets win because they have high probability and decent value. Muggers lose because their probability is too low to overcome the "value cap." You avoid the paralysis of infinite negative/positive cancellation.
      *   **Verdict:** This is the most robust fix. It preserves the *spirit* of your giving (maximizing good) without the mathematical explosion.

  *   **If you keep (2) and drop (1) [Risk-Weighted EV]:**
      *   **Cost:** You stop strictly maximizing the arithmetic mean. You might adopt a "geometric" growth strategy or apply a risk discount.
      *   **Gain:** You can claim value is unbounded, but you treat low-probability high-stakes gambles as inherently less valuable due to uncertainty.
      *   **Verdict:** This is messier. It opens you up to accusations of inconsistency (e.g., "Why do you take small risks but not big ones?").

  *   **If you keep both (1) and (2):**
      *   **Cost:** You must accept that your decision-making is hijackable by any lunatic with a big enough number, OR you must accept that EV is undefined for all actions (your symmetry argument).
      *   **Verdict:** This renders the theory useless for practical life.

  ### 4. How to Reply to Your Friend
  You don't need to abandon Expected Value. You just need to refine the "Value" part. Here is a suggested response:

  > "I've thought about this, and the problem isn't my willingness to follow the math, it's that your premises lead to a mathematical error. If value is truly unbounded (Premise 2), then for every 'Pascal's Mugging' scenario with positive expected value, there is a mirror scenario with negative expected value of equal magnitude.
  >
  > This means the Expected Value of *every* action becomes undefined (infinity minus infinity). Your argument doesn't prove I should pay the mugger; it proves Expected Value theory breaks down if we assume unbounded utility.
  >
  > To keep using Expected Value practically, we have to acknowledge **diminishing marginal returns**. Saving $10^{30}$ lives isn't practically distinguishable from saving $10^{31}$ lives in terms of decision weight, because the probability of influencing that many lives drops faster than the value increases. Once we accept that value is effectively bounded for decision-making purposes, the 'mugging' disappears, and well-evidenced charities like bednets win again. I'm keeping Expected Value, but I'm rejecting unbounded utility."

  ### Summary
  The "honest answer" is that **Premise (2) is the culprit.**

  You can keep Expected Value (1). It is still the best tool we have for comparing charitable interventions *within the realm of plausible reality*. But you must reject the idea that value scales linearly forever. Accepting **Bounded Utility** does not mean you care less about the future; it means you refuse to let your moral reasoning be held hostage by numbers that have no connection to physical reality.

  It costs you the ability to be "fanatical" about long-shot astronomical stakes, but it saves you from the paralysis of thinking that nothing matters because everything has infinite expected disvalue. Given that you want to keep giving to bednets, Bounded Utility is the feature, not the bug.
