          *   Count: 31 words. Good.

      *   *Q5 (Gregorian/Kind vs Environment):* External tools vs internal mind.
          *   Draft: If Gregorian minds rely on imported thinking tools, is the difference in kind of mind, or merely the environment? Does the mind extend outside the skull, or stay within?
          *   Count: 32 words. Good.

      *   *Q6 (Gregorian/Hypothetical Species):* The reconfigurable species case.
          *   Draft: Consider a species whose brains reconfigure via conspecific vocalisations but accumulate nothing across generations. Are they Gregorian creatures, or does cultural transmission define the level rather than individual plasticity?
