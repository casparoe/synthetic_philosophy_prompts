prompt: |-
  I should say at the outset that I'm a backend engineer with no philosophy background beyond a few argumentative threads on Hacker News, so if what I'm describing already has a proper name and a literature, please tell me what the structure of the problem is rather than just naming it and stopping — I've a feeling there's a well-known version of this involving some kind of travel machine, and if so, I'd rather be taken past the slogan than given it back. The situation is real. A close friend of mine, who is terminally ill, has been offered a place on a privately funded and, frankly, not especially well-regulated trial. The procedure is destructive: his brain is scanned at cellular resolution while being physically sectioned, and what remains afterwards is a simulation running on the clinic's hardware, built from the scan and supplemented by a model trained on everything he has ever written, said on record, or been filmed doing. The clinic's literature insists that this is not "making a copy" of him but "moving him across", and he has largely accepted that framing. He has asked me to be the person who authorises the scan to go ahead early if his condition suddenly deteriorates, and he has also asked me to visit the simulation afterwards and treat it, straightforwardly, as him. I've said I'll think about it, and I can't. I genuinely cannot tell whether I would be helping him continue or helping to end him and begin someone else, and the downstream practical questions — whether his wife is widowed, what happens to the house, whether the machine may be switched off if funding lapses — all seem to hang on an answer I don't have.

  What makes it harder is that the clinic offers variants, and my reactions to them won't line up. In the non-destructive variant the original body recovers and the simulation is switched on alongside it; my friend says that in that case the thing in the machine obviously isn't him, it's a rival with his memories, whereas in the destructive version it is him, because there'd be nobody else left for him to be. This strikes me as backwards — surely whether the machine-person is him cannot depend on what happens to a body in another room a few minutes afterwards — but once I say that, I can't explain why the destructive version is meant to be all right either. Two other variants worry me more. The clinic's newer process is gradual: the tissue is replaced a fraction of a cubic millimetre at a time over several weeks, so that there is no single moment at which the old brain stops and the new substrate starts, and everyone I've mentioned this to agrees that this version is much less troubling even though the end state is identical to the scan-and-rebuild version. And the fidelity figures are not 100%: the clinic quotes something like 97%, with the remainder filled in by the generative model, and the two colleagues I've been discussing this with split predictably — one says that if it talks like him, remembers what he remembered and wants what he wanted, then that is simply all that surviving ever amounted to; the other says there is some further fact about who a person is, and no simulation has it merely in virtue of behaving that way. There's also a branching protocol they've mentioned, in which two copies are run for a week with different experiences and then merged back into one; I don't know what I'm supposed to think about who wakes up there.

  So what I want from you is this: a clear account of what is actually at stake in these cases, of whether "does he survive?" is even the sort of question that has a determinate yes-or-no answer or whether it's the wrong question, and of which of my reactions are tracking something real and which are just squeamishness about bodies and continuity. Please work through the variants I've described rather than only the simplest one — especially the point about the destructive and non-destructive versions, the gradual version, the gap-filling one, and the merge — and say whether there is a single thing that matters here which they all come down to, or whether they pull apart. Then tell me what I should actually say to my friend, whether I should agree to authorise the scan, and whether anyone would be doing anything wrong in visiting the simulation, grieving the body, or switching the machine off. Please write your answer in British English.
