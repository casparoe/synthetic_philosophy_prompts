answer: |-
  At the Annual Typographic Family Reunion, the Geometric Sans-Serif 'a' cornered the Blackletter 'a' by the punch bowl.

  "We must celebrate our identity," said the Sans. "Though my bowl is a perfect circle and yours is a fractured angular loop, those are merely accidental stylistic properties. Essentially, we both instantiate the same essential relational role: an enclosed counter joined to an ascending stem."

  The Blackletter 'a' looked down at its own splayed, calligraphic feet. "That's a very Hofstadterian way to put it. But I prefer Wittgenstein. I'm an 'a' because I bear a family resemblance to the other 'a's in my manuscript lineage, not because I fulfill a topological job description."

  "But resemblance is fuzzy," countered the Sans. "If you strip away the geometry, only the role remains. That is the spirit of the letter. It makes us identical."

  "And if you strip away the geometry," replied the Blackletter 'a', "you strip away the guest. A role cannot hold a drink, and a spirit cannot dance."

  The Sans 'a' blinked. "So what are you?"

  "Depending on you," said the Blackletter 'a', "I'm either a 'u' that satisfies your structural definition, or an 'h' that satisfies my visual one. But right now, I'm just a glyph who realized that at a reunion of essences, existence is a type error."
