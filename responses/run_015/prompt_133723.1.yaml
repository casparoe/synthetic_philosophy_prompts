          *   *Correction needed:* The prompt says "prove that there are only countably many computable reals; to prove that there is no computable enumeration of the computable reals... and then to say what follows... combining countability of the computable reals with Cantor's theorem yields the existence of reals that no program computes."
          *   *Refinement:* I need to be careful. The set of computable reals *is* countable in the standard set-theoretic sense. However, they are not *computably enumerable* (c.e.) in the sense that there is no Turing machine that lists them all such that we can effectively diagonalize *within the system*. Actually, the standard result is: The set of computable reals is countable, but there is no *effective* enumeration of them. If there were an effective enumeration $f(n)$ producing the $n$-th computable real, we could construct a diagonal real that is computable but not in the list. Thus, no effective enumeration exists. This implies that while the set is countable (externally), we cannot access that countability internally via computation. This leads to the existence of uncomputable reals via standard Cantor (since $\mathbb{R}$ is uncountable and computable reals are countable).
