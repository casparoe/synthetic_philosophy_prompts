answer: |-
  ### 1. Exam Question

  **Preamble:**
  This question concerns the nature of infinite collections and the limits of computation. You are explicitly instructed **not** to retell the Hilbert's Hotel story, **not** to simply recite Cantor's diagonal proof for the reals, and **not** to dismiss the problems as merely "axiomatic choices." You must engage with the specific distinctions raised in each part. Define any technical terms you use beyond the syllabus.

  **Question 1 (25 Marks)**

  **Part A: Potential and Actual Infinity (7 Marks)**
  Consider two descriptions of a hotel:
  1.  **Hotel P:** At any finite time $t$, the hotel has $t$ rooms. It has a rule that allows it to build room $t+1$ at time $t+1$.
  2.  **Hotel A:** The hotel possesses the set of rooms $\{0, 1, 2, \dots\}$ all at once, as a completed totality.

  (i) Express the difference between Hotel P and Hotel A using logical quantifiers over the rooms and the collection of rooms. (2 marks)
  (ii) A coach arrives with a countably infinite number of passengers ($\mathbb{N}$). Explain why Hotel A can house them immediately, while Hotel P cannot, regardless of how long it waits. (2 marks)
  (iii) In Hotel A, we can map the set of all rooms to the set of even-numbered rooms one-to-one. In finite sets, a proper subset is always smaller than the whole (the Part-Whole Principle). Does the failure of this principle in Hotel A represent a logical contradiction? Justify your answer by referencing how "size" is defined for infinite collections. (3 marks)

  **Part B: The Computable Reals (11 Marks)**
  Call a real number **computable** if there exists a Turing machine that, given input $n$, outputs the $n$-th digit of that number's decimal expansion.
  (i) Explain why the set of computable real numbers is countable. (3 marks)
  (ii) Assume for the sake of contradiction that there exists a **computable enumeration** of the computable reals (i.e., a Turing machine that lists every computable real in a sequence $c_1, c_2, \dots$ such that we can effectively compute the digits of any $c_i$). Apply Cantor's diagonal construction to this list. Is the resulting diagonal number computable? Why? (4 marks)
  (iii) Based on (i) and (ii), explain the relationship between "countability" and "computable enumerability." Does Cantor's theorem imply that most real numbers are uncomputable? Justify your conclusion. (4 marks)

  **Part C: The Finitist's Cut (7 Marks)**
  Consider a mathematician, Alice. Alice accepts the natural numbers $\mathbb{N}$ as a completed infinite totality. However, she refuses to accept the set of **all** functions $f: \mathbb{N} \to \mathbb{N}$ (or equivalently, the set of all real numbers) as a completed totality over which we can quantify.
  (i) Which specific premise of Cantor's diagonal argument does Alice reject? How does she reinterpret the theorem (e.g., as a statement about sets, or as a procedure)? (3 marks)
  (ii) Alice finds Hotel P (from Part A) plausible but Hotel A physically impossible. However, Cantor's theorem is pure mathematics, not physics. Is Alice consistent in accepting $\mathbb{N}$ but rejecting the set of all functions on $\mathbb{N}$? Explain the asymmetry. (2 marks)
  (iii) To state her view, Alice says: "There is no completed set of all functions." Does this statement itself require her to quantify over the very collection she claims does not exist as a totality? Briefly explain the difficulty this creates for her position. (2 marks)

  ***

  ### 2. Model Answer

  **Part A**
  (i) Hotel P asserts: $\forall t \in \text{Time}, \exists \text{Rooms}_t \text{ such that } |\text{Rooms}_t| = t$. The collection of rooms is never given as a single object. Hotel A asserts: $\exists H \text{ such that } \forall n \in \mathbb{N}, \text{room}_n \in H$. The quantifier order swaps the existence of the collection and the quantification over its members.

  (ii) Hotel A contains the set $\mathbb{N}$ as a completed object. We can define a bijection $f: \text{Passengers} \to \text{Rooms}$ (e.g., $f(n) = n$) instantly because both sets exist timelessly. Hotel P only ever has finitely many rooms at any stage $t$. No matter how large $t$ becomes, the number of passengers waiting exceeds the number of rooms available at that stage. The passengers cannot be housed "in the limit" because at no finite stage is the mapping complete.

  (iii) This is not a contradiction. For infinite sets, "size" (cardinality) is defined by the existence of a one-to-one correspondence (bijection), not by the Part-Whole Principle. Dedekind defined an infinite set precisely as one that can be put into one-to-one correspondence with a proper subset of itself. The failure of the Part-Whole Principle is not a disaster; it is the defining characteristic of actual infinity.

  **Part B**
  (i) Every computable real corresponds to at least one Turing machine. Turing machines can be encoded as finite strings (or natural numbers) via their source code or state tables. Since the set of finite strings is countable (by dovetailing or lexicographical ordering), the set of Turing machines is countable. Therefore, the set of computable reals, being a subset of the outputs of these machines, is countable.

  (ii) If we have a computable enumeration $c_1, c_2, \dots$, we can construct a diagonal number $d$ where the $n$-th digit of $d$ differs from the $n$-th digit of $c_n$. Since the enumeration is computable, we can write a program to compute the $n$-th digit of $c_n$, modify it, and output the $n$-th digit of $d$. Thus, $d$ is computable. However, $d$ differs from every $c_i$ in the list. This contradicts the assumption that the list contained *all* computable reals.

  (iii) This shows that "countable" (exists a bijection with $\mathbb{N}$) is distinct from "computably enumerable" (exists a *computable* bijection). The computable reals are countable in the set-theoretic sense, but we cannot effectively list them all. Since the set of all reals $\mathbb{R}$ is uncountable (Cantor) and the set of computable reals is countable, the difference $\mathbb{R} \setminus \text{Computable}$ must be non-empty (in fact, uncountable). Thus, Cantor's theorem implies the existence of reals that no program can compute. The conflict is not just about computation limits; it is about the size of the continuum relative to the countable.

  **Part C**
  (i) Alice rejects the premise "Let $S$ be the set of all functions from $\mathbb{N}$ to $\mathbb{N}$." She does not accept $S$ as a valid object. For her, Cantor's theorem is not a statement about the size of two completed sets ($\mathbb{N}$ and $S$). Instead, it is a schematic procedure: "For any rule or list of functions you can specify, I can construct a function not on that list." The content lies in the effective construction, not the comparison of totalities.

  (ii) There is an asymmetry. Hotel A implies a physical infinity of space or matter, which conflicts with physical finitism. $\mathbb{N}$ is abstract; accepting it does not require physical storage. However, the set of all functions is a "higher-order" infinity ($2^{\aleph_0}$). Alice might argue that $\mathbb{N}$ is given by intuition or induction, whereas the function space requires quantifying over arbitrary, potentially undefinable rules, which she views as indeterminate. Her consistency depends on whether she views functions as rules (countable) or arbitrary mappings (uncountable).

  (iii) Yes, this creates a difficulty. To say "There is no set of all functions," she seems to quantify over all possible functions to deny their collection exists. If she cannot refer to the totality, she cannot strictly define the restriction. This is a version of the "vicious circle principle." She must walk a line where she refers to the concept of a function without reifying the collection of all of them, which is linguistically and logically precarious.

  ***

  ### 3. Marking Scheme

  | Part | Move Required | Marks | Common Error / Half-Credit Indicator |
  | :--- | :--- | :--- | :--- |
  | **A(i)** | Quantifier order ($\forall \exists$ vs $\exists \forall$). | 2 | Describes time vs. eternity without logical notation. |
  | **A(ii)** | Finite stage vs. completed mapping. | 2 | Says "P runs out of time" rather than "P is always finite at stage $t$." |
  | **A(iii)** | Dedekind infinite / Cardinality definition. | 3 | Claims it is a paradox or contradiction; fails to cite bijection. |
  | **B(i)** | Programs $\to$ Strings $\to$ Countable. | 3 | Says "programs are finite" without linking to countability of $\mathbb{N}$. |
  | **B(ii)** | Diagonal is computable if list is computable. | 4 | Fails to note the diagonal machine can be constructed effectively. |
  | **B(iii)** | Countable $\neq$ Computably Enumerable; Uncomputables exist. | 4 | Concludes computable reals are uncountable; or misses existence of uncomputables. |
  | **C(i)** | Rejects "Set of All Functions"; Theorem becomes schema. | 3 | Says she rejects $\mathbb{N}$; or says she rejects Diagonal Argument entirely. |
  | **C(ii)** | Abstract $\mathbb{N}$ vs. Higher-order Function Space. | 2 | Claims inconsistency without addressing order of infinity; or ignores physics distinction. |
  | **C(iii)** | Self-reference / Quantifying over the denied totality. | 2 | Says "No problem"; or fails to identify the quantification issue. |

  **Grading Boundaries:**
  *   **A Range (20-25):** Correctly distinguishes countability from computable enumerability in Part B. In Part C, identifies the self-referential tension in Alice's definition without needing external philosophical terminology. Part A clearly uses quantifier notation.
  *   **B Range (14-19):** Gets the math in Part B correct (diagonal is computable) but struggles to articulate *why* this implies uncomputable reals exist. Part A is conceptually correct but lacks precise logical formulation. Part C identifies the rejection of the function space but misses the self-reference paradox.
  *   **C Range (10-13):** Recites diagonal argument correctly but fails to apply it to the *computable* case specifically. Confuses "infinite" with "unbounded" in Part A. Part C is vague or dismissive.

  **Note on Corrections:**
  In your sketch, you mentioned proving the computable reals are countable and then using Cantor to show uncomputables exist. I have ensured Part B(iii) explicitly links the countability of computable reals + uncountability of $\mathbb{R}$ $\to$ existence of uncomputables. This avoids the common student error of thinking the diagonal argument on computable reals proves they are uncountable (it proves they are not *computably enumerable*). I also clarified Alice's position in Part C to ensure she accepts $\mathbb{N}$ (as per your request) but rejects the power set/function space, which is the standard predicativist cut.
