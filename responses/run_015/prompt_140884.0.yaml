answer: |-
  There is no single, canonical label in the literature for this specific contrast between grounding chains and causal chains regarding the status of the middle term. You have identified a real tension, but it is usually discussed under separate headings (e.g., "ontological innocence" for composition, "transitivity" for logic, "reduction" for metaphysics) rather than as a unified structural feature of explanation.

  The closest established concept is **"Ontological Innocence"** (often associated with David Armstrong's **"Ontological Free Lunch"**). This is the idea that if $X$ is grounded in $Y$, $X$ adds no new being to the world beyond $Y$. If the middle term $H$ is ontologically innocent relative to $G$, it makes sense to skip it. However, this concept is ontological (about *what exists*), whereas your observation is explanatory (about *how we talk*). Ontological Innocence doesn't strictly forbid citing $H$ in an explanation, even if $H$ is "free." Your point is stronger: that in grounding contexts, citing $H$ is often treated as *mistaken* or *redundant* in a way that citing an intermediate cause is not.

  Since there is no established name that captures the *explanatory collapse* specifically, I will coin one for you, define it tightly, and then tell you where it breaks.

  ### The Coinage: **Mediate Ground Absorption**

  **Definition:**
  Mediate Ground Absorption occurs in a grounding chain ($F$ because $H$, $H$ because $G$) when the explanatory contribution of the middle term $H$ is treated as fully exhaustible by the base term $G$, such that citing $H$ is deemed either (a) ontologically redundant (it adds no "weight") or (b) explanatorily obstructive (it hides the real source of determination).

  **Criteria for a Real Instance:**
  1.  **Synchronicity:** The relation is treated as structural or constitutive, not processual.
  2.  **Determination Sufficiency:** $G$ is taken to *necessitate* $F$ directly, rendering $H$ a mere logical or descriptive artifact of how $G$ manifests.
  3.  **Eliminative Pressure:** There is active philosophical pressure to remove $H$ from the canonical formulation of the ground.

  **Why Causation Resists This:**
  Causal explanation is **processual**. The middle term in a causal chain (e.g., the spark between the Big Bang and the fire) represents a *mechanism* or an *event* that transmits influence across time. If you remove the middle, you break the transmission.
  Grounding explanation is **structural**. The middle term represents a *layer of description* or a *partial constitution*. If the structure is rigid (as in physicalism), the base ($G$) fixes the top ($F$) directly. The middle ($H$) is just a shadow cast by $G$. You don't need the shadow to explain the object.

  ### The Boundary Case: Where Absorption Stops

  You noted the ethics case (wrongness $\leftarrow$ pain $\leftarrow$ microphysics) where the middle (*pain*) is *not* absorbed. This is the critical boundary. Mediate Ground Absorption only applies in **Reductive Grounding** contexts.

  *   **Reductive Contexts (Absorption applies):** Physical composition, functional realization (in hard physicalism), set-theoretic grounding. Here, the aim is to show $F$ is "nothing over and above" $G$. $H$ gets absorbed.
  *   **Non-Reductive Contexts (Absorption blocked):** Normative grounding, mental causation (in non-reductive physicalism), aesthetic properties. Here, the aim is to show $F$ *depends* on $G$ but remains *distinct*. $H$ (e.g., pain) retains explanatory weight because it captures a *kind* or *value* that $G$ (microphysics) does not capture, even if $G$ determines $H$.

  If you try to apply Mediate Ground Absorption to the ethics case, you get **Explanatory Loss**. You lose the *normative significance* of the pain. In the composition case, you don't lose anything by skipping the "arrangement" if the parts are already fixed.

  ### Where I Am Shakiest

  I am least confident in claiming this is a feature of **grounding itself**. I am 70% confident that what you are observing is actually a feature of **Physicalist Metaphysics** that *uses* grounding, rather than grounding *qua* grounding.

  **Why this is shaky:**
  Prominent grounding theorists (most notably Kit Fine) argue that grounding is **hyperintensional**. This means it is sensitive to differences in meaning even when truth values are the same. For Fine, the distinction between $G \rightarrow H \rightarrow F$ and $G \rightarrow F$ *matters*, even if $G$ necessitates $F$. The structure of the dependency is part of the reality.

  If Fine is right, then "Mediate Ground Absorption" is a **bug**, not a feature. It is a rhetorical move used by reductionists to simplify their ontology, but it violates the strict logic of grounding relations. The "collapse" you see might be philosophers sliding from "grounding" (a strict metaphysical relation) into "reduction" (an epistemic or linguistic simplification).

  **What would convince me otherwise:**
  If you can find instances of Mediate Ground Absorption in **non-reductive** contexts (e.g., a philosopher arguing that the *pain* should be absorbed directly into the *microphysics* when explaining *wrongness*, without losing normative force), then this is a universal feature of grounding.
  However, if the absorption *only* happens when the philosopher is already committed to the lower level being "more real" (fundamentalism), then this isn't about grounding; it's about **Fundamentalist Bias**.

  **The Pressure Point:**
  The definition of "Mediate Ground Absorption" gives out first under pressure from **pluralist grounding**. If there are multiple, equally valid grounding chains for the same fact (e.g., a statue is grounded in clay *and* in artistic intention), the middle cannot be absorbed because different middles track different explanatory interests. Absorption requires a single, privileged "fundamental" base. If fundamentality is relative or plural, the middle survives because it tracks a specific perspective that the base does not.

  **Summary:**
  You haven't made it up. You are seeing **Mediate Ground Absorption**. It is the explanatory shadow of **Ontological Innocence**. It thrives in reductive physicalism but dies in non-reductive or pluralist contexts. The contrast with causation holds because causation tracks *transmission* (needs the middle) while reductive grounding tracks *determination* (can skip the middle). But be wary: strict grounding theorists might say you are witnessing a misuse of the relation, not its proper function.
