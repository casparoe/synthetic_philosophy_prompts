      *   **Negative Utilitarianism (NU):** Minimize suffering. Often implies active intervention to reduce suffering. Can imply a positive duty to create structures that reduce suffering.
      *   **Structural Tranquilism (ST):** A hybrid attempt. It wants to keep the axiology negative (only absence matters) but give ontological weight to the *structures* that maintain that absence, calling it "derivative non-instrumental."

