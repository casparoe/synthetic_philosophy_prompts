answer: |-
  Here is the analysis, staged as requested.

  ### Part 1: Candidate Concepts

  I have surveyed the relevant literature in metaethics, experimental philosophy, and cross-cultural methodology. Below are the established concepts that come closest to the pattern you describe, along with what each would predict or require.

  **1. The Principle of Charity (Quine, Davidson)**
  *   **Concept:** When interpreting another agent (or culture), one should maximize the rationality and truth of their beliefs to make sense of their behavior. We should assume agreement on basic logic and values unless forced otherwise.
  *   **Prediction:** A consistent application of Charity would *minimize* reports of deep moral disagreement. It would push the researcher to interpret the non-Western judgment as based on different empirical beliefs (e.g., "They believe the stranger is a witch") rather than different values.
  *   **Requirement:** Consistency. You cannot invoke Charity to dissolve a disagreement when defending universalism and ignore it to highlight divergence when defending relativism.
  *   **Fit:** Poor. The pattern you describe is not the *application* of Charity, but the *selective suspension* of it. The maneuver uses Charity as a tool, not a constraint.

  **2. Fundamental vs. Derivative Disagreement (Stevenson, Horgan, Timmons)**
  *   **Concept:** A distinction in metaethics between disagreements in *attitude* (fundamental, moral) and disagreements in *belief* (derivative, empirical).
  *   **Prediction:** A paper should provide criteria for classifying a disagreement as one or the other (e.g., does the disagreement persist when empirical beliefs are aligned?).
  *   **Requirement:** Methodological rigor in distinguishing the *locus* of the conflict.
  *   **Fit:** Poor. This is the *subject matter* of the dispute, not the maneuver itself. The maneuver you identified exploits the difficulty of making this distinction, rather than adhering to the distinction's requirements.

  **3. Construct Validity / Measurement Invariance (Psychometrics)**
  *   **Concept:** The statistical requirement that a survey instrument measures the same underlying latent trait across different groups.
  *   **Prediction:** If invariance fails, the comparison is invalid (the "shallow" reading). If invariance holds, the difference is real (the "deep" reading).
  *   **Requirement:** Pre-registered statistical tests for invariance before claiming cross-cultural difference.
  *   **Fit:** Partial. This is often the *mechanism* used to execute the maneuver (claiming invariance failed when it's convenient, holding when it's not). However, "Measurement Invariance" is a technical statistical property, not a rhetorical or argumentative maneuver. It describes the *claim*, not the *strategic shifting*.

  **4. Emic vs. Etic Perspectives (Anthropology)**
  *   **Concept:** *Emic* refers to the insider's view (local meanings); *Etic* refers to the outsider's view (analyst's categories).
  *   **Prediction:** A researcher should specify which lens they are using. An Emic analysis might find no moral violation (shallow); an Etic analysis might find a structural violation (deep).
  *   **Requirement:** Explicit acknowledgment of which perspective is being prioritized and why.
  *   **Fit:** Poor. The maneuver often conflates the two. It uses an Etic category to claim a deep difference ("They fail the trolley problem") and an Emic justification to dissolve it ("But in their context, that action isn't 'harm'").

  **5. Motte-and-Bailey Doctrine (Manor)**
  *   **Concept:** Retreating from a controversial claim (Bailey) to a defensible one (Motte) when challenged.
  *   **Prediction:** One claim is strong but fragile; the other is weak but robust. The movement is defensive.
  *   **Requirement:** Asymmetry in defensibility.
  *   **Fit:** Rejected (as you noted). In your pattern, *both* readings are strong substantive claims ("Human nature is diverse" vs. "Human nature is universal"). The movement is not defensive retreat; it is offensive repositioning.

  ### Part 2: The Verdict and Definition

  **None of the established concepts fit.**

  The existing terms describe *states* of disagreement (Fundamental vs. Derivative), *methods* of measurement (Invariance), or *principles* of interpretation (Charity). None of them capture the specific *diachronic inconsistency* you have identified: the strategic toggling between these states within a single research program to insulate conclusions from critique.

  This is a methodological vice specific to the current era of experimental moral psychology. It relies on the **underdetermination of interpretation**. Because behavior alone cannot distinguish between a different value and a different empirical belief, the researcher is free to assign the cause post hoc.

  I propose we name this maneuver **"Unmotivated Locus Shifting."**

  **Definition:**
  *Unmotivated Locus Shifting* occurs when a researcher attributes cross-cultural behavioral variance to **deep normative divergence** (different values) when making a descriptive claim about human diversity, but attributes the *same* variance to **shallow empirical divergence** (different beliefs, contexts, or measurement error) when making a normative claim about human universality (or vice versa), without providing independent, pre-specified criteria for distinguishing the two loci.

  **The Sharp Edges:**
  1.  **It is not mere ambiguity.** Ambiguity is accidental; this is functional. The shift serves a specific argumentative end (protecting a theory or sensationalizing a finding).
  2.  **It is not theoretical pluralism.** Pluralism admits both views are possible. This maneuver presents them as sequentially true depending on the section of the paper.
  3.  **It exploits the "Black Box" of Cognition.** It treats the mental state causing the behavior as inaccessible enough to prevent falsification, but accessible enough to support the preferred conclusion.

  **A Clear Case:**
  *   *Study:* A team finds that Population X does not view nepotism as unfair, unlike Western undergraduates.
  *   *Deep Claim (Discussion):* "This reveals that 'impartiality' is not a universal moral foundation but a product of market integration." (The variance is normative/deep).
  *   *Shallow Claim (Response to Critic):* "Critics say this proves moral relativism is false. But Population X shares our value of fairness; they simply believe that in their high-risk environment, kin-support is the only reliable insurance mechanism." (The variance is empirical/shallow).
  *   *The Shift:* If they share the value of fairness, the foundation *is* universal (contradicting the Deep Claim). If the foundation is not universal, they don't share the value (contradicting the Shallow Claim). The author asserts both to avoid the implications of either.

  **A Near-Miss:**
  *   *Scenario:* A researcher argues that a measure failed measurement invariance tests, so they cannot compare means (Shallow/Methodological). However, they proceed to qualitatively interpret the *pattern* of responses as evidence of cultural difference (Deep/Substantive).
  *   *Why it's a near-miss:* This is methodological inconsistency, but it is usually flagged by reviewers as a statistical error. *Unmotivated Locus Shifting* is more subtle because both interpretations are theoretically coherent on their own; the sin is the *swapping* without justification.

  ### Part 3: Diagnostic for the Reader

  To detect *Unmotivated Locus Shifting* in a paper or op-ed, apply the **"Counterfactual Consistency Test."**

  Ask the following three questions. If the answer to any is "No," the author is likely turning the depth dial.

  1.  **The Pre-Registration Check:** Did the author specify *before data collection* what criteria would distinguish a "different value" from a "different belief"? (e.g., "If they change their mind when given new facts, it was a belief.")
      *   *Diagnostic:* If the criteria appear only in the Discussion or Limitations section, it is post-hoc rationalization.
  2.  **The Symmetry Check:** Does the author apply the same burden of proof to claims of universality as they do to claims of diversity?
      *   *Diagnostic:* If "diversity" is accepted on the basis of raw behavioral difference, but "universality" requires evidence of shared underlying reasoning (or vice versa), the locus is being shifted.
  3.  **The Insulation Check:** Does the re-description of the finding (Deep $\to$ Shallow) occur only when the finding threatens a core commitment of the author's broader theory?
      *   *Diagnostic:* Track the author's previous work. If they are a moral universalist who suddenly finds "deep difference" exciting, or a relativist who suddenly insists on "shared human nature," check if the shift protects their brand.

  ### Part 4: Settling the Question (Concrete Evidence)

  You asked what study or evidence would actually settle whether a difference is deep (normative) or shallow (empirical), rather than leaving it open to interpretation.

  To settle this, you must **decouple the normative commitment from the empirical belief.** Most current studies fail this because the vignette conflates the action with its real-world consequences.

  **The Design: The "Empirical Control" Vignette**

  1.  **Identify the Divergence:** Westerners punish Stranger Harm; Population X does not.
  2.  **Hypothesis A (Deep):** Population X does not value impartiality (Normative difference).
  3.  **Hypothesis B (Shallow):** Population X believes punishing a stranger invites spiritual retaliation or disrupts social equilibrium (Empirical difference).
  4.  **The Intervention:** Create a vignette where the **empirical consequences are explicitly controlled by the experimenter.**
      *   *Condition 1 (Normal):* "A man steals from a stranger."
      *   *Condition 2 (Controlled):* "A man steals from a stranger. **You are guaranteed by a trusted authority that punishing him will cause no spiritual harm, no social backlash, and no future risk to your kin.**"
  5.  **The Measurement:** Ask if punishment is *obligatory* or *permissible*.

  **The Settlement:**
  *   **If Population X punishes in Condition 2:** The original difference was **Shallow**. They share the normative commitment to impartiality but were constrained by empirical beliefs about risk. The "Deep Difference" claim is falsified.
  *   **If Population X still declines to punish in Condition 2:** The difference is **Deep**. They genuinely hold a different normative weighting of obligations (e.g., partiality is morally superior to impartiality, regardless of cost). The "Universalist" claim is falsified.

  **Why this works:**
  It removes the "Black Box." It forces the subject to reveal their preference for the *principle* itself, stripped of the *pragmatics* of the principle. Currently, most cross-cultural moral psychology leaves the pragmatics confounded with the principle, which is exactly what allows *Unmotivated Locus Shifting* to thrive. Until researchers employ this level of experimental control, the "Depth Dial" will remain unjammed.
