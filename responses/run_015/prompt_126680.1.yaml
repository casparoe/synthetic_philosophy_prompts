answer: |-
  Here are four distinct readings of the proposition, ordered by strength, specifying the operative axes and verdicts.

  **1. Determination as Constraint (Conditioning)**
  *   **Thesis:** "Social existence" (material forces) sets the boundaries of the possible for "consciousness" (conceptual repertoire); legal categories cannot sustainably contradict physical production requirements.
  *   **Verdict:** Modest but defensible.
  *   **Causal Inertia:** No. Law retains efficacy within material constraints.
  *   **Stress Tests:** (1) *Constitution:* Fails if the legal category partly constitutes the relation of production itself, as the constraint becomes internal rather than external. (2) *Survival:* Explains category survival as permissible variance within material limits, not functional necessity.

  **2. Determination as Selection (Functionalism)**
  *   **Thesis:** "Social existence" (relations of production) selects which available concepts become "consciousness" (dominant ideas) based on functional fit; the base filters the superstructure.
  *   **Verdict:** Substantive and contentious.
  *   **Causal Inertia:** No. Concepts have causal power but are retained via material selection.
  *   **Stress Tests:** (1) *Constitution:* Compatible, provided selection acts on the legally constituted relation as a whole unit. (2) *Survival:* Explains redeployment across regimes as functional adaptation rather than lag; the category survives because it serves a new material function.

  **3. Determination as Causal Production (Hard Determinism)**
  *   **Thesis:** "Social existence" (economic base) causally generates the specific content of "consciousness" (legal doctrines); law is a reflexive epiphenomenon.
  *   **Verdict:** Probably false.
  *   **Causal Inertia:** Yes. Licenses treating legal history as causally inert description.
  *   **Stress Tests:** (1) *Constitution:* Directly contradicted. If law settles whether one is a servant or contractor, the base does not exist independently to cause the law. (2) *Survival:* Must dismiss category survival as ideological lag or error, unable to account for active redeployment.

  **4. Determination as Explanatory Priority (Methodological)**
  *   **Thesis:** "Determines" denotes an order of investigation; "social existence" is the ultimate ground for explaining "consciousness," even if proximate causation runs through legal concepts.
  *   **Verdict:** Trivial to methodological practice; ontologically ambiguous.
  *   **Causal Inertia:** No. Relocates the question to ultimate grounds rather than denying proximate causation.
  *   **Stress Tests:** (1) *Constitution:* Compatible. Law is the proximate cause of the relation, but the *form* of law is ultimately explained by material needs. (2) *Survival:* Compatible. Survival is explained by the stability of underlying material problems across regimes, not by the inertia of ideas themselves.

  **Summary Verdict**
  Only Reading 3 licenses the claim that your chapter should ignore conceptual causality. Readings 1, 2, and 4 treat legal history as active, either within limits, as a selected variable, or as a proximate mechanism. Reading 3 collapses under the weight of your first stress test: if the legal category constitutes the relation of production, the "base" is not an independent stratum that can causally precede the "superstructure." The metaphor of base and superstructure presumes a separation that your material shows is porous. To invoke the 1859 Preface to deny conceptual causality is to rely on Reading 3, which is the most vulnerable to your empirical findings. The senior colleague's objection holds only if "determines" means "causally produces exclusive of feedback," a claim the text itself undermines by noting that the mode of production "conditions" rather than strictly dictates intellectual life. You need not dispute the slogan wholesale; you need only show that your colleague is relying on the strongest, least defensible reading of "determines" to dismiss your work.
