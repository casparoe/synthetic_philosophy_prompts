answer: |-
  **Brainstorming / Initial Notes**

  *   **The Core Tension:** MEC (Moral Equality of Combatants) works best when both sides are equally "in the dark." It's a mutual non-aggression pact based on shared ignorance. If one side is *less* in the dark, or if the fog of war is manufactured (propaganda, classified intel), does the pact hold?
  *   **Epistemic Opacity:** In drone warfare, the operator is opaque to the target (invisible, remote). In proxy wars, the principal is opaque to the proxy (funding hidden, goals shifting). This isn't just "fog of war"; it's structural blindness.
  *   **The "Risk" Element:** If I fight without knowing if my cause is just, I'm taking a moral risk. If my enemy *also* doesn't know, we're equal. But if my command structure *knows* the intel is shaky and hides it from me, while the enemy fighter knows exactly why they're defending their village, our moral risks aren't equal.
  *   **McMahan's Shadow:** McMahan already hit the "epistemic condition" hard (subjective justification vs. objective liability). But he usually treats epistemic access as an individual problem. This "Asymmetric Moral Risk" (AMR) idea treats it as a *systemic* feature of modern conflict. That's the fresh angle.
  *   **Does MEC Break?** If MEC is a pragmatic rule to limit war's horror, it might survive. If MEC is a claim about moral truth, it probably collapses under AMR.
  *   **Key Question:** Is ignorance a shield only if it's unavoidable? If the asymmetry is created by one side's technology or bureaucracy, can they claim the shield?

  ***

  **Draft Response**

  Hey, this is a really sharp prompt. Honestly, it's the kind of thing that usually ends up as a grad seminar paper or a chunk of a dissertation chapter. You're poking at a seam in Just War Theory (JWT) that a lot of people gloss over because it gets messy real fast.

  Let's skip the standard "Walzer says X, McMahan says Y" routine. You know that dance. Walzer gives us the Legalist Paradigm where soldiers are equal because they're coerced instruments of the state. McMahan comes in and says, "No, morality doesn't work like that; if you're fighting for an unjust cause, you're liable to be killed, even if you don't know it."

  Your concept of **Asymmetric Moral Risk (AMR)** throws a wrench in both of those gears by focusing on *access*. It's not just about whether the cause is actually just; it's about who is *allowed* to know, or who is *capable* of knowing, the moral facts on the ground.

  Here's how I'm thinking about this.

  ### The Breakdown of Symmetry

  Standard MEC relies on a kind of mutual "invincible ignorance." The idea is that the average soldier on Side A and the average soldier on Side B are in the same epistemic boat. They both have limited info, they both trust their chain of command, and they both face the same "fog of war." Because their epistemic positions are roughly symmetrical, we treat their moral status as symmetrical. We grant them equal rights and liabilities because we can't practically distinguish between them in the heat of battle.

  But look at the scenarios you mentioned: proxy wars and automated drone campaigns.

  In a drone campaign, you have a pilot in Nevada and a militia fighter in a conflict zone. The pilot has terabytes of ISR (Intelligence, Surveillance, Reconnaissance) data, legal reviews, and rules of engagement. The militia fighter might have... a rumor and a rifle. Or, flip it: the drone pilot is looking at a pixelated screen where context is stripped away, while the person on the ground knows *exactly* who is a combatant and who isn't.

  This creates **Epistemic Asymmetry**.

  If we adopt your AMR framework, we're saying that moral liability isn't just about what you do, but about the *risk profile* of your ignorance. If Side A creates a system where their fighters are structurally blinded (maybe through heavy classification, maybe through the detachment of remote warfare), while Side B's fighters have direct, unmediated access to the moral reality of the conflict (defending their homes, seeing the consequences), the "equality" part of MEC starts to look fake.

  ### Does AMR Undermine MEC?

  I think it does, but maybe not in the way you'd expect.

  **1. The Argument for Collapse:**
  If MEC is grounded in the idea that soldiers are moral agents who deserve equal respect, AMR suggests they aren't equally situated agents. If a soldier on Side A is *prevented* from accessing moral facts by their own command structure (e.g., "Don't ask about the legality, just fly the mission"), they are being used as a tool more aggressively than a soldier on Side B who has to make their own moral calculations.
  In this light, the Side A fighter might actually be *more* liable, not less. Why? because they have surrendered their moral agency to a system that is opaque by design. They are taking a "moral risk" they didn't consent to, whereas the Side B fighter might be taking a risk they fully understand. If MEC requires a baseline of shared agency, and AMR shows that agency is distributed unevenly, MEC loses its normative force. It becomes a rule that protects the privileged ignorance of the technologically superior power.

  **2. The Argument for Resilience (The Pragmatic Defense):**
  However, here's the counter-punch. A lot of philosophers defend MEC not because it's *true* in a deep metaphysical sense, but because it's *useful*. It's a convention.
  Even if there is Asymmetric Moral Risk, do we want to tell the drone pilot, "You have better intel, so you have fewer rights to self-defense"? Or do we tell the proxy fighter, "You know more about the local context, so you're more liable if you're wrong"?
  If we abandon MEC because of epistemic opacity, we might end up with a system where soldiers spend more time debating intelligence reports than fighting, or worse, where the side with *less* moral access claims they are the "victim" of epistemic injustice and thus licensed to use irregular tactics.
  From this view, MEC is robust enough to survive AMR because it acts as a firewall. It says, "Regardless of who knows what, once you are in the fight, you follow the same rules (*jus in bello*)." The epistemic stuff is for the politicians and generals to sort out (*jus ad bellum*), not the grunts.

  ### My Take: The "Epistemic Responsibility" Shift

  I don't think MEC survives intact, but I don't think it vanishes either. I think AMR forces us to shift the burden of moral equality up the chain of command.

  If we accept that epistemic opacity is asymmetric, we can't just treat the combatants as equals. We have to acknowledge that the *state* or the *command structure* that creates the opacity bears the moral risk, not just the individual fighter.

  In a traditional war, the soldier bears the risk of being wrong about the cause. In a modern, opaque conflict (like a covert drone strike), the system absorbs that risk and hides it. So, if we apply AMR, the "Moral Equality" shouldn't be between the two fighters. It should be between the two *systems*.

  If Side A fights via remote, opaque algorithms and proxies, and Side B fights via direct engagement, Side A has arguably taken on a higher "moral risk" of committing injustice because their feedback loop is broken. Therefore, Side A should be held to a *stricter* standard of *jus in bello* to compensate.

  So, to answer your question: **Yes, epistemic opacity undermines the standard claim of MEC.** You can't claim moral equality with someone when your structural position allows you to ignore the consequences of violence in a way they cannot.

  But does MEC survive? Only if we redefine it. It stops being "Combatant A = Combatant B" and becomes "The moral risk taken by System A must be balanced by stricter adherence to proportionality and discrimination."

  If we don't make that adjustment, MEC just becomes a get-out-of-jail-free card for the side with the best propaganda and the furthest reach. And as ethicists, we can't let that slide.

  What do you think? Does that distinction between individual liability and systemic risk track with what you're seeing in the AMR concept?
