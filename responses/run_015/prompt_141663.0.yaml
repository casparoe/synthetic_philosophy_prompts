  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A friend in a rationality meetup is drafting a blog series on evolutionary biology. He posted a paragraph summarizing Gould & Lewontin's (1979) "Spandrels of San Marco" paper as a "steelman of the anti-adaptationist case."
      *   **User's Knowledge:** Has read blog-level Gould discourse, not the 1979 paper.
      *   **User's Concerns (The "Twitches"):**
          1.  "Most traits" claim (methodological complaint vs. empirical headcount).
          2.  The "test" (seems to classify everything as a spandrel/useless).
          3.  The architectural pedantry (spandrels vs. pendentives, Dennett's critique).
          4.  Missing term: "Exaptation."
      *   **Core Question:** Is the downstream usage (replying "or spandrel" to flip the burden of proof) a fair moral of the paper, or is it the exact failure mode the paper warned about (just with the sign flipped)?
      *   **Task:** Evaluate the paragraph against the actual 1979 paper, distinguish fair simplification from error, address the architectural/exaptation points, and determine the valid epistemic stance on adaptationist hypotheses.

  2.  **Deconstruct the Friend's Paragraph:**
      *   *Claim 1:* "most traits of most organisms are not adaptations at all, they're spandrels."
      *   *Claim 2:* Adaptationism = assumption that *every* trait was built by selection for the job it now does (Panglossian paradigm).
      *   *Claim 3:* The Test: "before you accept any adaptationist explanation, ask whether the trait could have arisen as a side effect of something else. If it could, it's a spandrel until someone proves otherwise."
      *   *Claim 4:* Conclusion: "if a trait could be a byproduct, the burden of proof is on whoever claims it's an adaptation."

  3.  **Evaluate Against Gould & Lewontin (1979) ("The Spandrels of San Marco and the Panglossian Paradigm"):**
      *   *Claim 1 ("Most traits"):* G&L definitely argued that adaptationism is *too prevalent*, but did they claim a specific majority percentage? They argued that non-adaptive explanations (drift, constraint, byproduct) are underutilized. Saying "most traits... are not adaptations" is a stronger empirical claim than their methodological critique. They warned against *assuming* adaptation, not necessarily claiming non-adaptation is the default state for >50% of traits.
      *   *Claim 2 (Panglossian Paradigm):* This is accurate to the text. G&L defined the adaptationist programme as assuming optimal design for every trait. They called it Panglossian.
      *   *Claim 3 (The Test):* This is the tricky part. G&L argued you must *consider* alternatives (constraint, drift, byproduct). They didn't say "If it *could* be a byproduct, it *is* a byproduct." They said you can't stop at the adaptationist story. The friend's formulation ("If it could, it's a spandrel until proven otherwise") shifts the null hypothesis too aggressively.
      *   *Claim 4 (Burden of Proof):* G&L wanted rigorous testing of adaptationist hypotheses, not just storytelling. They wanted the burden of proof to involve comparative data, not just plausibility.

  4.  **Address the User's "Twitches":**
      *   *(1) "Most traits":* User is right. G&L's critique was methodological (stop assuming), not necessarily a census claim (most aren't). However, they implied the frequency of error was high.
      *   *(2) "The Test":* User is right. "Could be a side effect" is a low bar. Almost anything *could* be. The test should be "Is there evidence for selection *over* constraint/byproduct?"
      *   *(3) Architecture (Spandrels vs. Pendentives):* Dennett (1995, *Darwin's Dangerous Idea*) made a big deal of this. The triangular bits under a dome on arches are technically *pendentives*. Spandrels are the spaces between arches. Does it matter? Metaphorically, no. Philosophically, Dennett argued it showed Gould was sloppy. Biologically, it doesn't change the concept of byproducts. It's mostly pedantry, but indicates Gould's rhetorical flair over technical precision.
      *   *(4) Exaptation:* Crucial point. Gould & Vrba (1982) introduced "exaptation" (trait shaped for one use, co-opted for another). "Spandrel" is strictly a non-adaptive byproduct. "Exaptation" includes co-option. The friend conflates them or misses the nuance. A trait can be a spandrel initially, then become an adaptation (exaptation).

  5.  **Address the Downstream Usage ("Or Spandrel"):**
      *   Is "or spandrel" a refutation? No. It's a request for evidence.
      *   Does it flip the burden of proof? Yes, but how?
      *   *Standard Adaptationist View:* Trait exists -> Assume Function -> Look for evidence.
      *   *G&L View:* Trait exists -> List all causal histories (Selection, Drift, Constraint, Byproduct) -> Test against data.
      *   *Friend's View:* Trait exists -> Assume Byproduct -> Prove Selection.
      *   *Verdict:* The friend's view is too skeptical. The G&L view is "Don't assume Selection." The comment section usage ("or spandrel") is often a conversation stopper, which G&L would hate. They wanted *more* research, not *less*.

  6.  **Synthesize the "Working Biologist/Adaptationist" View:**
      *   Adaptationists (e.g., Dawkins, Dennett, Pinker) argue that while G&L were right about methodology, the *heuristic* of adaptationism is productive. Assuming function leads to discoveries. Assuming byproduct leads to stagnation.
      *   They would call the friend's "most traits" claim a strawman of adaptationism (nobody thinks *every* trait is adaptive) and the "spandrel default" a strawman of G&L (G&L wanted testing, not nihilism).

  7.  **Drafting the Response:**
      *   *Structure:*
          1.  Direct verdict on the paragraph (Accuracy vs. Distortion).
          2.  Breakdown of the three "twitches" + Exaptation.
          3.  The Architectural Pedantry (Dennett's point).
          4.  The Downstream Usage (The "Or Spandrel" move).
          5.  The Correct Epistemic Stance (What G&L actually wanted).
      *   *Tone:* Analytical, precise, respectful of both G&L and the adaptationist counter-critique. Rationality-adjacent tone (focus on epistemology/burden of proof).

  8.  **Refining Specific Points:**
      *   *Exaptation:* Make sure to distinguish Spandrel (non-adaptive byproduct) vs. Exaptation (co-opted trait). A spandrel can become an exaptation.
      *   *Burden of Proof:* The friend says "Prove it's an adaptation." G&L say "Demonstrate it's an adaptation *rather than* the null." The null isn't necessarily "spandrel," it's "unknown causal history."
      *   *Dennett:* Acknowledge the pendentive point but dismiss its biological relevance. It's about Gould's rhetorical style.
      *   *The "Most Traits" claim:* This is the biggest distortion. G&L attacked the *program*, not the *count*.
      *   *The "Or Spandrel" move:* It's valid as a reminder of alternative hypotheses, invalid as a conversation ender.

  9.  **Final Review against User Prompt:**
      *   Did I say what G&L would endorse? Yes.
      *   Did I say what's fair simplification? Yes.
      *   Did I say what's subtly wrong? Yes.
      *   Did I address the strawman? Yes.
      *   Did I answer the downstream usage question? Yes.
      *   Did I address Exaptation? Yes.
      *   Did I address the Architecture? Yes.

      *(Self-Correction during drafting)*: I need to be careful not to take sides too heavily. The prompt asks for an analysis of the *argument*, not a declaration of who won the Evo Bio wars. The consensus is that G&L corrected a methodological excess, but adaptationism remains the primary productive heuristic. I should reflect that nuance. The friend's paragraph is *too* strong on the anti-adaptationist side.

      *(Refining the "Test")*: The friend says "If it could have arisen as a side effect... it's a spandrel." This is logically vacuous because almost anything *could* be. G&L's actual point was "You must demonstrate that selection is the *best* explanation among alternatives," not "Assume byproduct."

      *(Refining the "Burden of Proof")*: In science, the burden is usually on the positive claim. "This is an adaptation" is a positive claim about history. "This is a byproduct" is also a positive claim. The null is usually "We don't know." The friend sets the null as "Byproduct." That's the error.

      *Okay, ready to write.*
answer: |-
  This is a sharp set of intuitions. Your "twitches" are correctly identifying where your friend's summary drifts from the 1979 paper ("The Spandrels of San Marco and the Panglossian Paradigm") into a kind of internet rationalist folklore about Gould.

  Here is the breakdown of what Gould and Lewontin (G&L) actually argued, where your friend's paragraph distorts it, and how to handle the "or spandrel" move in comment sections.

  ### 1. Critique of the Paragraph

  **The "Most Traits" Claim**
  *   **Friend:** "most traits of most organisms are not adaptations at all, they're spandrels."
  *   **G&L:** They argued that the *adaptationist programme* assumes traits are adaptations without testing. They argued that constraints, drift, and byproducts are *under-appreciated* causes.
  *   **Verdict:** **Distortion.** G&L made a methodological critique, not a census claim. They never quantified that >50% of traits are spandrels. They argued that biologists were *acting as if* 100% were adaptations, and needed to lower that confidence. Your friend converts a complaint about scientific rigor into an empirical headcount. A working adaptationist would call this a strawman: nobody seriously believes *every* trait is adaptive (e.g., the color of blood is a chemical constraint, not a selection target), so attacking that claim is easy but uncharitable.

  **The "Test"**
  *   **Friend:** "ask whether the trait could have arisen as a side effect... If it could, it's a spandrel until someone proves otherwise."
  *   **G&L:** They argued you must *construct* alternative hypotheses (constraint, drift, byproduct) and test the adaptationist story against them using comparative data.
  *   **Verdict:** **Subtly Wrong.** Your friend's test sets the null hypothesis to "Spandrel." G&L's test sets the null hypothesis to "Unknown Causal History." The difference is vital. "Could it be a side effect?" is a bar so low it clears almost nothing (almost anything *could* be a side effect). G&L's requirement was: "Is there positive evidence for selection *superior* to the evidence for constraint?"
  *   **Why it matters:** Your friend's version licenses nihilism ("We can't prove it's not a spandrel, so stop looking"). G&L's version licenses rigor ("Don't stop looking until you've ruled out the spandrel").

  **The Burden of Proof**
  *   **Friend:** "if a trait could be a byproduct, the burden of proof is on whoever claims it's an adaptation."
  *   **G&L:** Agreed that the burden is on the adaptationist to provide evidence beyond a "just-so story."
  *   **Verdict:** **Fair Simplification, but risky.** This is the closest your friend gets to the actual text. G&L did want to shift the burden from "assume adaptation" to "prove adaptation." However, they did not intend for "could be a byproduct" to be the trigger. The trigger should be "lack of comparative evidence."

  ### 2. The Missing Piece: Exaptation

  You are right to flag this. Your friend is conflating **Spandrels** and **Exaptations**.

  *   **Spandrel (1979):** A trait that arose as a non-adaptive byproduct of selection on something else. (e.g., the redness of blood is a byproduct of hemoglobin's chemistry, not selected for redness).
  *   **Exaptation (Gould & Vrba, 1982):** A trait that was originally selected for function A (or was a spandrel), but was later co-opted for function B. (e.g., feathers likely evolved for thermoregulation [adaptation] or were a byproduct of scaling [spandrel], but were co-opted for flight [exaptation]).

  **Why it matters for the blog post:**
  Your friend's paragraph implies a binary: Adaptation vs. Spandrel. The real evolutionary picture is often: Spandrel $\rightarrow$ Exaptation $\rightarrow$ Adaptation.
  If your friend's readers use his definition, they will classify any trait with a current function as a "spandrel" if it wasn't *originally* selected for that function. This makes the word "adaptation" almost useless. G&L introduced "exaptation" specifically to allow biologists to talk about current utility without making claims about historical origin.

  ### 3. The Architectural Pedantry (Spandrels vs. Pendentives)

  *   **The Fact:** Dennett (and architects) are correct. The triangular bits under the dome of St. Mark's are technically *pendentives*. A *spandrel* is the space between two arches.
  *   **Does it bite?** Biologically, no. Metaphorically, it's a minor error.
  *   **Why Dennett cared:** Dennett argued in *Darwin's Dangerous Idea* that this sloppiness typified Gould's style: prioritizing a catchy metaphor over technical precision. Dennett's point was that Gould was willing to sacrifice accuracy for rhetoric.
  *   **Verdict:** **Pedantry, but indicative.** It doesn't invalidate the biological argument, but it supports the adaptationist critique that Gould was often more of a philosopher than a scientist. For a blog post, it's worth a footnote, not a headline.

  ### 4. The Downstream Usage: "Or Spandrel"

  You asked: *Is replying "or spandrel" a fair moral of the paper, or is it the exact failure mode the paper was warning about with the sign flipped?*

  **It is the failure mode with the sign flipped.**

  Here is why:
  1.  **G&L's Goal:** To encourage *more* rigorous testing of evolutionary hypotheses. They wanted biologists to work harder to distinguish selection from constraint.
  2.  **The Comment Section Move:** To shut down inquiry. "It might be a spandrel" is often used to imply "Therefore we cannot know," or "Therefore your hypothesis is unlikely."
  3.  **The Epistemic Error:** As you noted, "could be a byproduct" is true of almost everything. If the mere possibility of a byproduct flips the burden of proof to "impossible to satisfy," then evolutionary psychology becomes impossible.

  **What G&L would endorse:**
  They would endorse the *question*: "Have you controlled for phylogenetic constraint? Have you considered if this is a byproduct of brain size?"
  They would *reject* the *conclusion*: "Therefore it is probably not an adaptation."

  **What a Working Adaptationist would say:**
  They would say: "Adaptationism is a heuristic. Assuming a trait has a function is the most productive way to generate testable hypotheses. Assuming it is a spandrel generates no predictions. Therefore, the default working hypothesis should be adaptation, subject to falsification."

  ### 5. Summary for Your Friend

  If you want to give him feedback, here is the "steelman of the steelman":

  1.  **Correct the "Most Traits" claim:** Change it to "Many traits previously assumed to be adaptations may be byproducts." Don't make it a majority claim; make it a methodological warning.
  2.  **Fix the "Test":** Instead of "If it *could* be a side effect," write "If there is *no comparative evidence* for selection, and a plausible structural constraint exists, treat it as a spandrel."
  3.  **Add Exaptation:** Acknowledge that a trait can be a spandrel originally and an adaptation now. This prevents the binary trap.
  4.  **Refine the Burden of Proof:** The burden isn't on the adaptationist to prove it's *not* a spandrel (which is hard); it's on them to provide evidence that selection is the *best explanation among alternatives*.

  **Does the conclusion survive?**
  Yes, but in a weaker form. The real version of the critique licenses suspicion of **untested** adaptationist hypotheses, not adaptationist hypotheses *in general*.

  *   **Friend's Version:** "Assume Spandrel until proven Adaptation." (Leads to stagnation).
  *   **G&L's Version:** "Don't assume Adaptation until tested against Spandrel." (Leads to rigor).
  *   **Adaptationist Version:** "Assume Adaptation as a working hypothesis, test against Spandrel." (Leads to discovery).

  The comment section move ("or spandrel") is only valid if it is followed by "...so show me the comparative data that rules that out." If it stands alone, it is indeed a conversation-stopper that G&L would likely dislike, as they wanted more evolutionary biology done, not less.
