prompt: |-
  I'm on the clinical ethics committee at my hospital and I've been asked to write the memo for Thursday's meeting, which is a bit awkward because it isn't hypothetical for me: my brother is four surgeries into the same protocol, so tell me at the end if I should even be the one drafting it.

  The case: we run a gradual cortical replacement program for a degenerative disease. Small regions of tissue are swapped out one at a time over years, each implant tuned to reproduce the spike-train behavior of the patch it replaces. Two things our neuro people are upfront about: the implants don't do the slow chemical side of things (no dopamine or acetylcholine wash), so they substitute a fixed infusion schedule; and nobody can predict how many steps a given patient gets before replaced and unreplaced tissue stops resynchronising.

  Our patient is roughly 60% through. Before starting he signed a directive saying we should disregard any later attempt to stop and finish the job, his reasoning being that a half-replaced version of him isn't yet the person whose change of heart should count. He's now refusing the next surgery. He's competent on every test we have, he's changed partners and quit his job. His adult daughter wants the old directive enforced; the surgeons point out the funding only covers completion and the PI says nobody has data on what stopping at 60% looks like.

  What I need is the memo we'd actually vote on: a recommendation — honor the current refusal, enforce the earlier directive, or something staged — with a timeline, who has to be satisfied of what before the next step, and reasons the losing side can recognise as reasons rather than as a brush-off. Two things I want engaged seriously instead of narrated past. First, our neurologist's line that if replacing the whole thing in one operation would be a death, then doing it in two hundred steps can't be two hundred non-deaths, so either gradualness is doing no work or you have to say what work it's doing. Second, whether "he consented to a process, and mid-process demurral is exactly the event he asked us to discount" is a real argument or a loophole he talked himself into.

  Keep separate what's settled (our policy, the capacity testing, the law on advance directives) from what people who actually work on this disagree about, and where it's contested just say it's contested rather than picking whichever side sounds judicious. And no citations or reading suggestions — none of us will look them up.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a Clinical Ethics Committee (CEC).
      *   **Task:** Write the memo for Thursday's meeting regarding a specific patient case.
      *   **Context:** The user's brother is the patient (4 surgeries into the protocol). This creates a conflict of interest (COI) issue that needs to be addressed at the end.
      *   **Case Details:**
          *   Procedure: Gradual cortical replacement for degenerative disease.
          *   Mechanism: Tissue swapped out over years, implants mimic spike-trains but not chemical modulation (fixed infusion schedule).
          *   Risk: Unpredictable resynchronization point between replaced/unreplaced tissue.
          *   Patient Status: ~60% complete. Competent on all tests. Refusing next surgery. Life changes (new partner, quit job).
          *   Prior Directive: Signed *before* starting, stating later attempts to stop should be disregarded (reasoning: half-replaced self isn't the same person).
          *   Stakeholders: Patient (refusing), Daughter (wants directive enforced), Surgeons/PI (funding/data concerns, want completion).
      *   **Required Output:** A memo for the committee to vote on.
          *   Must include a recommendation (Honor refusal, enforce directive, or staged approach).
          *   Must include timeline/conditions for next steps.
          *   Must address two specific philosophical/clinical arguments seriously (The "Death by Steps" argument & The "Process Consent" argument).
          *   Must distinguish settled facts/policy from contested areas (mark contested areas as contested, don't gloss over them).
          *   No citations/reading suggestions.
      *   **Constraint:** At the very end, answer the user's question: "Should I even be the one drafting this?" (Given the brother connection).

  2.  **Determine the Tone and Structure:**
      *   **Tone:** Professional, clinical, ethically rigorous, neutral but decisive enough for a vote. It needs to sound like an internal hospital document.
      *   **Structure:**
          *   Header (To, From, Date, Subject).
          *   Case Summary (Brief).
          *   Settled Facts (Policy, Law, Capacity).
          *   Contested Ethical/Clinical Ground (The core disagreements).
          *   Specific Arguments to Engage (The "Death by Steps" and "Process Consent" points).
          *   Recommendation & Action Plan.
          *   Voting Options.
          *   *Post-Memo Note:* Addressing the COI question.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Subject:** Needs to be anonymized but clear. "Case Review: Cortical Replacement Protocol (Patient [ID])."
      *   **Case Summary:** Concise recap of the 60% status, the refusal, the directive, and the stakeholders.
      *   **Settled Ground:**
          *   Capacity: Patient is competent *now*.
          *   Law: Advance directives generally hold for *loss* of capacity, but this is a *refusal* by a competent patient vs. a prior directive. This is legally murky but policy-wise we need to state what the hospital policy says (usually current competent refusal trumps, *unless*... which is the contest).
          *   Funding/PI: Data constraints are real logistical hurdles, not ethical ones, but relevant to the "staged" option.
      *   **Contested Ground:** This is crucial. I need to explicitly label where the committee disagrees.
          *   Identity Continuity: Is the 60% patient the same moral agent as the 0% patient?
          *   Harm of Cessation: Is stopping at 60% a harm (death/vegetative) or a valid exercise of autonomy?
          *   Authority of Directive: Does a directive to ignore future refusal bind the committee when the patient is currently competent?
      *   **Engaging the Two Arguments:**
          *   *Argument 1 (The Neurologist's "Death by Steps"):* If one-step = death, does 200-steps = life? Need to articulate the "Gradualness" defense without resolving it definitively.
          *   *Argument 2 (The "Process Consent" Loophole):* Did he consent to a process that inherently requires overriding future selves? Or is this coercion?
      *   **Recommendation:** I need to pick a path that allows a vote. A "Staged" approach is usually the most ethically defensible compromise in CEC memos. It buys time for assessment without forcing surgery immediately or abandoning the patient.
          *   *Plan:* Pause surgery. Independent capacity/identity assessment. Mediation.
      *   **Voting Options:** Clear choices for the committee.

  4.  **Refining the Ethical Nuance (The "Hard Parts"):**
      *   *The Directive:* Standard advance directives apply to *incapacity*. This directive is unique: it applies *specifically* to a future competent refusal based on identity shift. This is the crux. I must label this as "Unsettled Policy."
      *   *The Neuro Argument:* I need to phrase this so the neurologist feels heard but the ethicists see the gap. "If the endpoint is non-viable, does the path matter?"
      *   *The Identity Argument:* "Pre-commitment vs. Current Autonomy."

  5.  **Addressing the User's Personal Situation (The COI):**
      *   The prompt asks me to tell them *at the end* if they should be drafting this.
      *   *Answer:* Absolutely not. It's a massive conflict of interest. Even if they recuse themselves from voting, drafting the memo shapes the framing of the debate. This is a critical ethical breach in a real hospital setting. I need to be firm but supportive on this.

  6.  **Review against Constraints:**
      *   *Memo format?* Yes.
      *   *Recommendation included?* Yes.
      *   *Timeline/Conditions?* Yes.
      *   *Two arguments engaged?* Yes.
      *   *Settled vs. Contested separated?* Yes.
      *   *No citations?* Yes.
      *   *COI advice at the end?* Yes.

  7.  **Final Polish:**
      *   Ensure the language is "hospital admin/ethics" style (dry, precise).
      *   Make sure the distinction between "legal capacity" and "identity continuity" is sharp.
      *   Ensure the recommendation doesn't solve the unsolvable but provides a process to navigate it.

      *(Self-Correction during drafting)*: I initially thought about recommending enforcing the directive. But if the patient is currently competent, enforcing surgery against current will is battery/assault unless the directive is legally binding in this specific novel context. It's safer and more ethically standard to recommend a pause and assessment. I will frame the recommendation as a "Procedural Pause" to allow for the contested issues to be weighed without immediate coercion.

      *(Refining the "Death by Steps" argument)*: Make sure I don't solve it. The prompt says "where it's contested just say it's contested." So I will present the argument and note the lack of consensus.

      *(Refining the COI advice)*: This needs to be direct. "You cannot do this."

  8.  **Final Output Generation** (Proceeding to generate the memo followed by the advice).
answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 24, 2023
  **SUBJECT:** Case Review: Cortical Replacement Protocol (Patient ID: [Redacted])
  **RE:** Recommendation Regarding Procedure Continuation vs. Current Refusal

  **1. CASE SUMMARY**
  The patient is currently 60% through the Gradual Cortical Replacement Protocol. Pre-procedure, the patient executed a specific directive requesting that any future refusal of surgery be disregarded, premised on the belief that a partially-replaced consciousness lacks the standing to alter the course of the original agent. The patient is now refusing the 5th surgery. Current psychometric and neurological testing indicates the patient is competent by standard legal and clinical definitions. The patient has undergone significant psychosocial changes (employment termination, new partnership). The patient's daughter supports enforcement of the pre-procedure directive. The surgical team and Principal Investigator (PI) note that funding covers completion only, and there is no clinical data on the viability of cessation at 60%.

  **2. SETTLED FACTS AND POLICY**
  *   **Capacity:** The patient currently meets all standard criteria for decision-making capacity. There is no evidence of delirium, coercion, or cognitive impairment unrelated to the protocol.
  *   **Legal Standard:** Under current state law, a competent adult's contemporaneous refusal of medical treatment generally supersedes prior advance directives. Advance directives are legally designed to activate upon *loss* of capacity.
  *   **Hospital Policy:** Our policy mandates that we honor competent refusal unless there is a court order or a specific statutory exception. There is no statutory exception currently defined for neuro-prosthetic identity protocols.
  *   **Clinical Risk:** The surgical team confirms they cannot predict the physiological outcome of stopping at 60%. It is unknown whether this results in stabilization, degradation, or fatality.

  **3. CONTESTED ETHICAL AND CLINICAL GROUND**
  The following points are not settled by policy or law and constitute the core of this committee's deliberation:

  *   **Identity Continuity:** It is contested whether the "60% patient" is the same moral agent as the "0% patient" who signed the directive. If the procedure alters the seat of autonomy, the current refusal may be viewed as a new agent vetoing the old agent's contract, or the same agent exercising updated rights. There is no consensus on how to weigh the moral authority of the pre-procedure self against the intra-procedure self.
  *   **Validity of the Directive:** It is contested whether a directive that specifically anticipates and attempts to nullify future *competent* refusal is ethically binding. Standard bioethics treats autonomy as ongoing; this directive treats autonomy as a one-time event at T=0. We have no precedent for enforcing a "Ulysses Contract" of this magnitude against a competent voice.
  *   **Harm of Cessation:** It is contested whether stopping the procedure constitutes a "harm" that the hospital must prevent. If the patient lives a meaningful life at 60%, cessation is not a harm. If the patient decompensates, cessation was fatal. We lack the data to classify the risk of stopping.

  **4. SPECIFIC ARGUMENTS FOR COMMITTEE ENGAGEMENT**
  Two arguments have been raised that require explicit acknowledgement in the vote, regardless of the outcome.

  *   **The "Death by Steps" Argument (Neurology):**
      *   *Claim:* If replacing 100% of the cortex in a single operation would result in death (or loss of self), then doing so in 200 steps cannot logically result in 200 preserved selves. Either the gradualness preserves continuity, or it merely delays the inevitable loss.
      *   *Status:* **Contested.** If gradualness is doing the work of preserving identity, we must define the threshold where it stops working. If it is not doing that work, the patient is already "gone," rendering his current refusal moot. The committee must decide if we accept the premise that gradual replacement sustains identity sufficiently to honor the current refusal, or if we accept the premise that the original patient is already lost, which might paradoxically support the daughter's wish to finish the job to honor the *original* contract.
  *   **The "Process Consent" Argument (Legal/PI):**
      *   *Claim:* The patient consented to a *process*, not a series of discrete events. Mid-process demurral was the specific contingency the directive was designed to override. To allow refusal now is to allow a loophole the patient explicitly closed.
      *   *Status:* **Contested.** This argues that autonomy was exercised once, irrevocably, at the start. Counter-argument: Consent must be ongoing for invasive procedures. If we accept the "Process Consent" argument, we establish a precedent where competent patients can be forced into surgery based on past contracts, which fundamentally shifts the standard of informed consent.

  **5. RECOMMENDATION**
  **Recommendation: Staged Assessment Pause (Option C)**

  We recommend neither immediate enforcement of the directive nor immediate acceptance of the refusal as final. We recommend a 30-day procedural pause.

  **Rationale:**
  1.  **Acknowledges Capacity:** It respects the patient's current competent status by not scheduling surgery immediately.
  2.  **Acknowledges Directive:** It treats the directive as serious enough to warrant investigation before abandonment.
  3.  **Addresses Data Gap:** It allows time to consult external bioethics and neurology boards regarding the "60% cessation" risk profile without committing the patient to the knife.

  **Timeline and Conditions:**
  *   **Days 1-7:** Independent capacity assessment by a neuro-ethicist not affiliated with the research team. Focus: Not just legal competence, but "identity coherence" relative to baseline.
  *   **Days 8-21:** Mediation session between Patient, Daughter, and PI. Goal: Determine if the refusal is rooted in protocol fatigue (treatable) or fundamental identity shift (non-negotiable).
  *   **Day 30:** Committee reconvenes.
      *   *If* mediation succeeds: Proceed to Surgery 5.
      *   *If* mediation fails: Committee votes on whether the "Pre-Commitment Directive" overrides "Contemporaneous Refusal" in this specific instance, based on the independent assessment.

  **6. VOTING OPTIONS**
  *   **Option A:** Honor Current Refusal. (Patient autonomy is ongoing; directive is invalid against competent voice).
  *   **Option B:** Enforce Earlier Directive. (Patient pre-committed identity authority to T=0 self; current refusal is a symptom of the condition/directive trigger).
  *   **Option C:** Staged Assessment Pause. (30-day hold for independent identity assessment and mediation before final vote).

  ***

  **Regarding your question:**

  **No. You should not be the one drafting this.**

  You need to recuse yourself immediately, not just from voting, but from the administrative handling of this case.

  Here is why:
  1.  **Framing Bias:** The person who drafts the memo controls the framing of the "Settled" vs. "Contested" facts. Even with the best intentions, your proximity to the patient will unconsciously influence how you summarize the neurologist's argument or the weight given to the daughter's testimony.
  2.  **Perception of Legitimacy:** If this case is ever audited, or if the decision is challenged legally, the fact that the brother of the patient wrote the ethics memo will invalidate the committee's protection. It exposes the hospital and the committee to liability.
  3.  **Personal Burden:** You are asking the committee to decide on your brother's potential "death" or "forced surgery." You cannot be the objective conduit for that information. You need to be in the room as a family stakeholder (or excluded to protect your own privacy), but you cannot be the scribe.

  Send this draft to the Committee Chair with a note stating your conflict of interest and ask them to assign a neutral drafter. You can provide the case details, but you must not write the recommendation.
