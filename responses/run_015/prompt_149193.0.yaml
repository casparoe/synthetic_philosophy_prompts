answer: |-
  1. The Full Specification

  An adequate precautionary framework must satisfy seven core desiderata to function as more than rhetorical reflex. First, **Epistemic Sensitivity**: it must distinguish between risk (known probabilities) and uncertainty (unknown probabilities or mechanisms). This addresses Type-I opacity (unknown distribution) versus Type-II opacity (unknown causal pathway). Synthetic biology motivates this distinction: gene drives present Type-II opacity where mechanisms are unknowable, whereas chemical regulation often faces Type-I opacity where dose-response curves are merely unmeasured. *Non-negotiable.* Second, **Irreversibility Tracking**: the framework must weigh potential damages by their recoverability. Climate tipping points motivate this; once crossed, mitigation is impossible. Unlike reversible chemical spills, cascading ecosystem failures require higher thresholds for intervention. *Non-negotiable.* Third, **Burden Shifting**: the proponent of an activity must demonstrate safety rather than opponents demonstrating harm. This counters treating absence of evidence as evidence of absence, a common failure in industrial chemical approval. *Non-negotiable.*

  Fourth, **Democratic Legitimacy**: affected parties must consent to imposed risks. This addresses anxieties about solar geoengineering imposing risks on non-consenting populations in the Global South. *Camp-specific* (technocrats often reject strict consent as inefficient). Fifth, **Intergenerational Equity**: future generations must not be deprived of options or saddled with irreversible harms, such as nuclear waste storage. This motivates giving future actors a veto or preserving flexibility. *Camp-specific* (some argue present welfare trumps hypothetical future costs). Sixth, **Proportionality**: restrictions must match the severity of the threat, avoiding paralysis over trivial uncertainties. *Non-negotiable* for practicality; otherwise, the principle forbids all innovation. Finally, **Monitoring Capacity**: if action proceeds under uncertainty, there must be mechanisms to detect failure early. *Non-negotiable.*

  The distinction between Type-I and Type-II opacity is crucial; Type-II demands stricter caution because modeling is impossible. Democratic deliberation is often desired by civil society but rejected by industry as inefficient. Intergenerational veto rights are ethically compelling but operationally difficult. A robust framework must explicitly state which of these it prioritizes, rather than hiding behind vague "safety" rhetoric. The non-negotiables ensure the principle functions as risk management under uncertainty; the camp-specific items determine its political orientation. Without Epistemic Sensitivity, the framework cannot distinguish noise from structural ignorance. Without Irreversibility Tracking, it treats catastrophic loss as interchangeable with temporary cost. These form the backbone of any serious precautionary claim.

  2. The Conflicts

  Two primary conflicts render certain desiderata jointly unsatisfiable. First, **Democratic Deliberation vs. Temporal Urgency**. Requiring full consent from affected populations conflicts with acting before an evidentiary window closes. In climate engineering, waiting for global consensus may allow warming to cross irreversible thresholds. If the precautionary principle mandates deliberation *before* action, it may precipitate the very disaster it seeks to prevent. This is not merely logistical; it is structural. You cannot have perfect inclusivity and rapid response to nonlinear tipping points simultaneously. The requirement for legitimacy undermines the requirement for speed when the threat is imminent.

  Second, **Intergenerational Veto vs. Present Agency**. Protecting future generations often implies giving them an effective veto over present actions that limit their options. However, this creates an asymmetry: present actors can choose inaction (preserving options), but future actors cannot choose to undo present action (if irreversible). If we enforce a strict veto, present action collapses into paralysis, effectively privileging the status quo regardless of its risks. The status quo itself may be dangerous, yet the veto protects it. Alternatively, if we quantify future interests to balance them against present needs, the framework collapses into standard cost-benefit analysis, losing its precautionary edge. You cannot grant future generations absolute sovereignty over present choices without negating present agency entirely. Thus, a framework must choose between operational paralysis or compromising the intergenerational equity it claims to uphold. This tension reveals that precaution is not just about safety, but about who holds the power to decide when safety is undefined.

  3. The Scorecard

  The **Weak Formulation** (weighted cost-benefit) fails **Burden Shifting** and **Irreversibility Tracking**. By quantifying uncertainty into expected values, it treats Type-II opacity as manageable risk, allowing absence of evidence to function as evidence of absence. It satisfies Proportionality but loses the precautionary core, effectively becoming standard risk analysis. It ignores the non-negotiable requirement for Epistemic Sensitivity.

  The **Strong Formulation** (prohibit without safety proof) satisfies **Burden Shifting** and **Irreversibility Tracking** but fails **Proportionality** and **Temporal Urgency**. It triggers paralysis on any uncertain activity, ignoring the risk of inaction. It often bypasses **Democratic Legitimacy** by imposing blanket bans technocratically. It adheres to non-negotiables but sacrifices practicality.

  The **Middle Formulation** (reversibility thresholds) satisfies **Monitoring Capacity** and **Proportionality** but struggles with **Epistemic Sensitivity**. It works for Type-I opacity but fails under Type-II opacity where causal pathways are unknown, making reversibility hard to guarantee. It also rarely resolves the **Intergenerational Veto** conflict, as thresholds are set by present actors. Each version sacrifices specific desiderata to remain operational, confirming that no single formulation satisfies the full specification. The Weak version is too permissive; the Strong version is too rigid; the Middle version is too dependent on knowledge it claims to lack.

  4. The Residue

  These distinctions are not artificial; they expose structural blind spots. Type-II opacity (unknown mechanisms) invalidates standard risk models that assume known distributions. Most formulations fail here. Similarly, the intergenerational veto asymmetry reveals that precaution is inherently political, not just scientific. It highlights that "safety" is a distributional choice between present and future agents. Standard formulations mask this by treating time as neutral. Recognizing these residues forces a choice: either accept paralysis under strong uncertainty or admit that precaution is a value judgment about whose risks count, rather than a neutral decision rule.
