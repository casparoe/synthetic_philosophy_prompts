answer: |-
  Idealized deliberation better preserves normative authority in cases of deliberative dissociation because it grounds obligation in the constitutive continuity of agency rather than external counterfactual facts, thereby framing the agent's current rejection as a limitation of self-realization rather than simple cognitive error.

  Under indirect normativity, the authority of principle P derives exclusively from the fact that it would be endorsed under idealized conditions, rendering the actual agent's perspective epistemically secondary. In a scenario of deliberative dissociation where the actual agent is stable, coherent, and well-informed, her rational rejection of P poses a significant challenge: if authority depends entirely on counterfactual endorsement, her actual commitment to Q must be categorized as a failure to track the normative truth established by the ideal conditions. Because her reasoning is internally coherent, indirect normativity cannot attribute her rejection to simple logical failure or ignorance; instead, it must treat her sustained rational commitment as a mistake regarding the source of obligation itself. This creates an alienating form of authority where the norm binds the agent despite her best rational efforts, effectively reducing her present commitments to mere error and severing the link between her rationality and her obligations.

  Idealized deliberation, conversely, locates authority in the relationship between the actual self and the idealized self, viewing the latter not as a distinct oracle but as the actual agent's own agency perfected. While this framework requires a bridge principle—typically asserting that agents ought to align their actual will with the dictates of their constitutive rational nature—it avoids the alienation of indirect normativity by maintaining identity across the counterfactual divide. The idealized self possesses sovereign authority only insofar as it represents the telos of the actual self's deliberative capacities, meaning the obligation to accept P is an obligation to realize one's own agency rather than to submit to an external verdict. Consequently, the agent's commitment to Q is not dismissed as mere error but understood as a rational stance constrained by distorting affects, which the idealized condition removes. This preserves the binding force of P by framing it as the agent's own deeper commitment, while respecting the coherence of her actual reasoning as a valid, albeit incomplete, expression of her rational nature.
