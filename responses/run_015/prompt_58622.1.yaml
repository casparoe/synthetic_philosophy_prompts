answer: |-
  ## Examination Task

  **Module:** Moral Psychology and Virtue Ethics (Level 3)
  **Time Allowed:** 75 Minutes
  **Conditions:** Closed Book

  **Essay Question**

  The situationist challenge argues that experimental evidence on helping, honesty, and obedience demonstrates that behavior varies more with minor situational features than with stable character traits, thereby undermining the existence of virtues.

  For the purposes of this examination, accept the following two stipulations as given:
  1.  **The Healthcare Data:** A hypothetical large-scale study of trainee health care workers over three years finds a strong effect of shift-level pressures (time urgency, sleep loss, observed peer noncompliance) on whether trainees speak up about medication errors. However, once situational pressures are held fixed, there is modest but persistent rank-order stability for individuals.
  2.  **The Revisionary Proposal:** Virtues are best understood not as unconditional tendencies to act in fixed ways across situations, but as cultivated capacities to notice morally relevant features of situations, including awareness of situational pressure itself, and to respond appropriately in light of that awareness.

  Critically assess whether virtue ethics remains viable in light of the situationist challenge, utilizing these stipulations. Your answer must address: (i) what virtue ethics actually requires from character traits to function as a normative and explanatory project; (ii) whether the Healthcare Data refutes that requirement or leaves it intact; and (iii) whether the Revisionary Proposal preserves a recognizable form of virtue ethics or concedes the central point of the situationist critique.

  ***

  ## Model Answer

  To determine if virtue ethics (VE) survives situationism, we must first distinguish between *global consistency* and *reliable reliability*. Traditional Aristotelianism is often interpreted as requiring robust traits that manifest consistently across diverse contexts. However, for VE to function normatively, it strictly requires only that agents possess a reliable disposition to act well *more often than not*, and that these differences between agents are stable enough to justify praise, blame, and moral education. It does not require behavioral invariance regardless of context.

  The Healthcare Data complicates the traditional picture but does not refute this minimal requirement. The strong effect of shift-level pressures confirms the situationist claim that context heavily influences action; a virtuous trainee may remain silent under extreme sleep deprivation or peer pressure. However, the existence of modest but persistent rank-order stability once situations are fixed is crucial. This indicates that character differences are real, even if their expression is context-sensitive. If individuals consistently differ in their likelihood of speaking up when situational variables are controlled, then character traits exist as probabilistic dispositions rather than deterministic causes. Therefore, the data suggests VE must abandon the claim that virtues guarantee right action in all circumstances, but it supports the claim that virtues explain inter-agent differences in moral performance.

  The Revisionary Proposal offers a mechanism to reconcile this data with VE theory. By redefining virtues as capacities to notice morally relevant features—including situational pressures—the proposal shifts the locus of virtue from blind behavioral habit to perceptual sensitivity (*phronesis*). Under this view, the trainee who notices their own fatigue and the peer pressure, and calculates the risk of speaking up accordingly, exercises virtue even if they ultimately remain silent to speak later when safer. This aligns VE with the Healthcare Data: the "virtuous" agent is not the one who ignores situational pressure, but the one who accurately perceives and weighs it.

  Does this concede the situationist point? Only partially. It concedes that behavior is not driven by internal traits alone, validating the situationist emphasis on context. However, it rejects the situationist conclusion that traits are therefore illusory. By making the *awareness* of the situation part of the virtue itself, the revision preserves the explanatory power of character. It explains why, under identical pressures, one trainee speaks up and another does not: differences in perceptual capacity and responsive reasoning.

  Ultimately, VE remains viable if it accepts this revision. The project survives not by denying situational power, but by integrating situational awareness into the definition of character. The Healthcare Data shows traits are fragile but real; the Revisionary Proposal shows they are perceptual rather than mechanical. VE concedes that virtues are not immune to circumstances, but maintains they are the cultivated capacities required to navigate those circumstances wisely. This preserves the normative core of VE—moral education aims to sharpen perception and response—without requiring the empirically falsifiable claim of cross-situational invariance.

  *(548 words)*

  ***

  ## Marking Guide (Total: 25 Marks)

  **1. Specification of Virtue Ethics' Requirements (5 Marks)**
  *   **Excellent (5):** Clearly distinguishes between "behavioral invariance" (which VE does not strictly need) and "reliable reliability/probabilistic stability" (which VE does need for praise/blame/education).
  *   **Competent (3):** Identifies that VE needs stable traits but fails to distinguish between absolute consistency and reliability, or treats VE as requiring invariance.
  *   **Characteristic Error (0-2):** Assumes VE requires perfect cross-situational consistency, setting up a straw man that is easily refuted by the data.

  **2. Analysis of the Healthcare Data (5 Marks)**
  *   **Excellent (5):** Utilizes both aspects of the stipulation: acknowledges the strong situational effects *and* leverages the "rank-order stability" to argue that traits remain explanatory variables.
  *   **Competent (3):** Focuses only on the strong situational effects to argue traits are weak, ignoring the rank-order stability clause provided in the prompt.
  *   **Characteristic Error (0-2):** Claims the data refutes VE entirely because of situational pressure, failing to read the "held fixed" stability condition.

  **3. Evaluation of the Revisionary Proposal (10 Marks)**
  *   **Excellent (8-10):** Analyzes the shift from "habitual action" to "perceptual capacity." Argues that this aligns with *phronesis* and explains the data (agents differ in perception of pressure). Assesses whether this is a concession or a preservation.
  *   **Competent (5-7):** Describes the proposal accurately but treats it as either a total surrender to situationism or a complete victory without nuanced analysis of what has changed in the theory.
  *   **Characteristic Error (0-4):** Treats the revision as merely semantic, or argues that noticing pressure is not a "moral" capacity, failing to engage with the moral psychology aspect.

  **4. Final Verdict and Coherence (5 Marks)**
  *   **Excellent (5):** Synthesizes the previous moves to conclude VE is viable *if* modified. The conclusion follows logically from the analysis of data and revision.
  *   **Competent (3):** Provides a verdict (Yes/No) that is somewhat disconnected from the specific analysis of the stipulated materials.
  *   **Characteristic Error (0-2):** Contradicts earlier arguments (e.g., argues traits are illusory in section 2 but real in section 4) or offers a generic conclusion unrelated to the prompt's specific constraints.
