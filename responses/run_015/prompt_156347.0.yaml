answer: |-
  Your diagnosis is astute. The standard framing of the debate—'do abstract objects exist?'—often obscures the more pressing tension within mathematical practice itself. You have identified a friction between *structural indifference* (Feature 1) and *identificatory privilege* (Feature 2). The former suggests that mathematics is about patterns that can be instantiated anywhere, while the latter suggests that mathematical objects have a determinate identity that transcends their structural role.

  Here is an analysis of how these features interact with the philosophical landscape, addressing your five specific points.

  ### 1. Decomposing the Platonist's Position

  To understand which components of Platonism are required by your two features, we must disentangle the usual bundle of claims. 'Platonism' is often treated as a monolith, but it comprises at least four distinct theses:

  1.  **Existence:** Mathematical entities exist.
  2.  **Independence:** They exist mind- and language-independently.
  3.  **Determinacy:** There is a unique intended model or structure (e.g., *the* natural numbers).
  4.  **Objecthood:** These entities are objects with identity conditions independent of the structures they inhabit (haecceity).

  **Feature 1 (Indifference to Copy)** requires **Existence** (of a structure) but is actually hostile to **Determinacy** and **Objecthood**. If it does not matter whether the reals are Dedekind cuts or Cauchy sequences, then the specific identity of the objects is irrelevant. This feature is best licensed by a view where existence is 'cheap'—such as modal structuralism or even certain forms of nominalism where consistency guarantees a model. It requires only that *some* system satisfies the axioms. It does not require mind-independence; a consistent fiction would suffice for practice.

  **Feature 2 (Privileged Identifications)** is the heavier burden. When a mathematician insists that $\mathbb{N} \subset \mathbb{Z}$ literally, or that a vector space is distinct from its dual despite isomorphism, they are invoking **Objecthood** and **Determinacy**. They are claiming that the identity of the object is not exhausted by its structural relations. If identity were purely structural, $V$ and $V^{**}$ would be indiscernible, and the distinction between a 'canonical' isomorphism and a 'non-canonical' one would vanish. To maintain Feature 2, one needs a metaphysics that fixes the identity of objects prior to their structural embedding. This leans heavily towards **Object-Platonism** (specifically a *sui generis* view where numbers are primitive objects).

  Therefore, Feature 1 fits comfortably with anti-realism or structuralism, whereas Feature 2 demands a robust realism about objects. The tension you perceive is precisely the tension between these two components of the traditional Platonist bundle.

  ### 2. Can a Single Theory License Both Features?

  This is the crux of the matter. If existence is cheap (satisfying Feature 1), uniqueness is typically lost. If there are many equally good set-theoretic models, then the statement '$\mathbb{N} \subset \mathbb{Z}$' is false in some and true in others, depending on the coding. To save the literal truth of the inclusion, one must posit a unique intended structure.

  **The Nominalist/Structuralist Difficulty:**
  A nominalist who denies abstract objects struggles with Feature 2. If mathematical terms refer to concrete inscriptions or are merely useful fictions, the 'canonical' embedding of $\mathbb{Q}$ into $\mathbb{R}$ is just a convention. But mathematicians do not treat it as a convention; they treat it as a discovery. If the nominalist says 'all embeddings are equal', they contradict practice. If they say 'one is privileged', they must explain what privileges it without appealing to abstract structural facts, which risks reintroducing Platonism by the back door.

  **The Platonist Difficulty:**
  An Object-Platonist can easily secure Feature 2 by positing that $\mathbb{N}$ and $\mathbb{Z}$ are specific, unique objects where the former are literally part of the latter. However, they then struggle with Feature 1. If $\mathbb{N}$ is a specific object, why does it not matter which set-theoretic construction we use to prove theorems about it? The Platonist must argue that the set-theoretic constructions are mere representations of the *sui generis* objects. This works, but it renders the set-theoretic reductions ontologically idle.

  **Verdict:**
  A single theory *can* license both, but it must be a sophisticated **Ante Rem Structuralism** (such as Shapiro's). This view posits structures as existing objects. The 'places' within the structure are objects, but their identity is determined by the structure. However, to handle Feature 2, the structuralist must admit that some structures are 'rigid' or have preferred embeddings fixed by the background theory (e.g., category theory). This essentially concedes that while individual objects might be structural, the *network of structures* has a determinate, Platonic reality. Thus, to license both features, one ultimately needs a realism about structures that functions very much like Platonism about objects.

  ### 3. Structuralism and Canonical Isomorphism

  Can the structuralist explain selective identification without admitting objects with identity beyond structure? They often attempt this by appealing to **natural isomorphism** (from category theory).

  The structuralist argues that while $V$ and $V^*$ are isomorphic, there is no *natural* isomorphism between them (one depends on a choice of basis), whereas there is a natural isomorphism between $V$ and $V^{**}$. Thus, we identify $V$ with $V^{**}$ but not $V^*$.

  **The Problem:**
  This move saves the practice, but it does not save the ontology. To define 'natural', one must quantify over all possible morphisms and functors in a category. One is no longer talking about a single structure in isolation, but about the structure of the *category of structures*.
  If the structuralist claims that 'natural isomorphism' is sufficient for identity, they are effectively redefining identity to be coarser than strict identity but finer than mere existence. However, this distinction itself requires a background framework to determine what counts as 'natural'.
  If the structuralist says, "There are no objects, only places in structures," they cannot explain why one path between places is 'canonical' and another is not, unless the *system of structures* itself has objective features.
  **Conclusion:** The structuralist can recover the practice, but only by reifying the relations between structures. This distinction (canonical vs. non-canonical) is not one the structuralist has room for *unless* they admit that the category theoretic framework describes a mind-independent reality. In doing so, they converge on a form of Platonism about structures. The canonicity distinction is not a way to avoid objects; it is a way of describing the objective geometry of the abstract realm.

  ### 4. The Object-Platonist and Literal Truth

  How should the Object-Platonist treat the practice, given that on standard set-theoretic accounts, $\mathbb{N} \not\subset \mathbb{Z}$ (since von Neumann ordinals are not equivalence classes of pairs of ordinals)?

  The *sui generis* Platonist (e.g., Frege or Parsons) responds that the set-theoretic constructions are merely **models**, not the objects themselves. The natural numbers are primitive objects. The integers are primitive objects. The inclusion $\mathbb{N} \subset \mathbb{Z}$ is literally true of the *sui generis* objects, even if it is false of the set-theoretic proxies used to model them.

  **Is this merely convenient shorthand?**
  No, for the Platonist, the practice is literally true. The *set theory* is the shorthand (or rather, the implementation detail).
  **Is this a cost or a symptom?**
  It is a symptom of the gap between **foundational implementation** and **mathematical practice**.
  *   **Cost:** It renders the reduction of mathematics to set theory ontologically misleading. If the reduction is not an identity claim, then set theory does not tell us what numbers *are*, only how they *behave*. This weakens the foundationalist claim that set theory is the 'ground' of mathematics.
  *   **Symptom:** It indicates that mathematical practice is not driven by foundational concerns. Mathematicians care about the invariant properties of the system, not the constituent nature of the elements. The Platonist accommodates this by saying the constituent nature is simple (they are just objects), while the set theorist complicates it unnecessarily.

  The cost is epistemological: if numbers are *sui generis* objects distinct from their set-theoretic models, how do we access them? The set-theoretic model was supposed to be our bridge. If the bridge leads to a different destination than the one we claim to be visiting, our epistemic access becomes mysterious.

  ### 5. Underdetermination and Reform

  **Where is the practice underdetermined?**
  The practice is compatible with at least three rival metaphysics:
  1.  **Sui Generis Platonism:** The inclusions are literal; the objects are primitive.
  2.  **Modal Structuralism:** The inclusions are shorthand for 'in any natural number structure embedded in any integer structure...'.
  3.  **Fictionalism:** The inclusions are true within the story of standard mathematics, though no such objects exist.

  All three license the exact same theorems and the same informal talk of inclusions. The practice itself does not force a choice because the practice is concerned with **inference**, while the dispute is concerned with **truth-makers**.

  **The Proposed Reform:**
  Suppose the mathematical community adopted a strict convention: never write $A \subset B$ unless $A$ is literally a subset of $B$, and always name the embedding $f: A \hookrightarrow B$.

  **Would this settle anything philosophical?**
  No. It would merely shift the burden.
  *   **For the Structuralist:** It would make their view syntactically clearer. It would acknowledge that 'identity' is really 'isomorphism relative to a context'.
  *   **For the Platonist:** They would simply insist that in the *true* ontology, $A$ *is* a subset of $B$, and the new notation is just pedantic about the set-theoretic models.
  *   **The Concealment:** The reform would conceal the metaphysical commitment to **canonicity**. Even if one writes $f: \mathbb{Q} \hookrightarrow \mathbb{R}$, mathematicians will still treat *one* such $f$ as the 'standard' one. They will still treat $\mathbb{R}$ as unique. The reform does not explain *why* one embedding is standard.

  **What would be lost?**
  Nothing mathematical. Everything would remain provable.
  **What would be gained?**
  Philosophical clarity. It would force philosophers to stop asking 'do numbers exist?' and start asking 'what fixes the canonical embedding?'.
  If the reform were adopted, it would reveal that the dispute is not about existence, but about **rigidity**. The Platonist claims the structure is rigid (fixed by reality); the Nominalist claims it is flexible (fixed by convention). The practice of writing inclusions literally is a vote for rigidity. Making the embeddings explicit would not dissolve the vote; it would merely make the ballot paper clearer.

  ### Summary

  The tension you have identified arises because mathematical practice is **structurally indifferent** (Feature 1) but **ontologically committed** (Feature 2).
  *   **Feature 1** suggests that what matters is the pattern, not the stuff (favouring Structuralism/Nominalism).
  *   **Feature 2** suggests that the pattern has a fixed, unique geometry that we discover, not invent (favouring Platonism).

  A theory that licenses both must explain how a structure can be multiply realisable (Feature 1) while simultaneously having a unique, privileged architecture (Feature 2). This is why **Ante Rem Structuralism** or **Sui Generis Platonism** are the strongest contenders: they posit the structure itself as the abstract object. The nominalist struggles to account for the 'privileged' nature of canonical isomorphisms without smuggling in abstracta. The dispute, therefore, is not about whether mathematical objects exist, but whether the **relations between structures** are mind-independent facts. The practice of writing literal inclusions is a tacit assertion that they are.
