          *   The "Muddle": Is the Terror inevitable because of the Aristocracy's sins (karma/justice) or because the Mob is inherently savage (conservative fear)? Dickens wavers. He blames the aristocracy for *causing* it, but depicts the revolutionaries as *monstrous*.
