answer: |-
  Colleagues, practitioners, and guests,

  The title of this workshop poses a question that risks predetermining its own failure. By asking whether there can be 'Harms Without Matter', we implicitly accept a dichotomy that forces us to choose between two unsatisfactory positions. On one side, we are asked to affirm that digital objects possess physical weight, a claim that violates the basic intuitions of metaphysics. On the other, we are asked to deny the severity of user trauma because the offending weapon was made of code rather than steel, a claim that violates the lived experience of those designing and regulating these spaces. If we remain within this framing, the metaphysicians will leave convinced of their scepticism, and the practitioners will leave convinced of our irrelevance.

  To prevent this divergence, I propose we suspend the question of whether virtual objects are real in a physical sense. Instead, I invite you to adopt a structural distinction that constrains our inquiry for the duration of this workshop. We must distinguish between what I shall call 'representational harm' and 'indexical harm'.

  Representational harm occurs when a digital proxy symbolically linked to a user is damaged. If an avatar is defaced, or a virtual house is burned, the object affected is a representation. It is a symbol standing in for something else. To claim that this constitutes a physical injury to the user is to fall into naive realism. We cannot say the code is flesh. However, to say that this damage matters nothing is to fall into dismissive irrealism. The question is not what the object *is*, but what the object *does* to the user's orientation within the environment.

  This brings us to indexical harm. Indexicality refers to the first-person perspective of 'I', 'here', and 'now'. Indexical harm occurs when a user's situated presence within a virtual environment is disrupted. It is not merely that a symbol was broken; it is that the user's capacity to act, to inhabit, and to navigate their experienced world was violated. When haptic feedback simulates a blow, or when persistent property destruction erases the locus of a user's labour, the harm is not located in the pixels. It is located in the rupture of the user's agency within that specific context.

  This distinction imposes strict constraints on what we may claim in this room. For the metaphysicians here, this framework forbids you from dismissing reports of trauma solely on the grounds that virtual entities lack mass. If the user's indexical presence—their sense of being safely situated in a shared world—is disrupted, the harm is genuine regardless of the ontology of the object. You need not concede that virtual swords are sharp to acknowledge that the swing disrupted the user's reality.

  Conversely, for the designers and legal scholars, this framework forbids you from arguing that virtual objects are physically equivalent to material ones. We cannot build a legal or ethical case on the premise that code possesses atomic weight. Instead, your arguments must centre on the integrity of the user's situated agency. When you speak of assault or theft, you must articulate how the event fractured the user's indexical hold on their environment, not merely how it altered a database.

  By adopting this distinction, we avoid the trap of false compromise. We do not meet in the middle by agreeing that virtual objects are 'sort of' real. Rather, we shift the ground entirely. We agree that the ontology of the object is secondary to the ontology of the experience. The metaphysician can maintain a rigorous materialism regarding the hardware while acknowledging the phenomenological reality of the harm. The practitioner can validate user suffering without resorting to magical thinking about digital substance.

  Therefore, let us proceed not by asking if virtual matter exists, but by asking whether the conditions for situated agency have been violated. If we hold to this constraint, we may find that the matter of virtual worlds is less important than the mattering of the selves who inhabit them.

  \answer{The moral ontology of virtual worlds depends not on the physical reality of digital objects, but on the integrity of the user's indexical presence and situated agency.}
