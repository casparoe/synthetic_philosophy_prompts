answer: |-
  **Title:** The Sum That Isn't: Why Infinite Ethics Requires Abandoning Total Aggregation

  **Introduction**

  Aggregative consequentialism rests on a deceptively simple premise: the right action is the one that maximizes the total sum of value in the universe. In a finite world, this provides a clear, if demanding, decision procedure. However, contemporary cosmology and metaphysics suggest a non-negligible probability that the universe is infinite in space, time, or both. If the universe contains an infinite number of value-bearing subjects, the "total sum" of value becomes mathematically ill-defined. As the Riemann Rearrangement Theorem demonstrates, a conditionally convergent series can be reordered to sum to any real number, or to diverge. Consequently, in an infinite universe, the total value of a world depends entirely on the order in which we count its inhabitants.

  This creates a crisis for aggregative consequentialism. If the total sum is order-dependent, moral verdicts become arbitrary. If the series diverges, all actions appear morally equivalent (adding a finite amount of good to infinity changes nothing). In this essay, I argue that the standard attempts to rescue aggregation—mathematical regularization, spatiotemporal discounting, or domain restriction—fail because they either reintroduce arbitrariness or violate the core impartiality of consequentialism. The only coherent solution is to abandon the requirement that moral verdicts track a completed infinite sum. We must replace Total Aggregative Consequentialism with a **Finite-Difference Consequentialism**. This view retains the consequentialist commitment to making the world better but accepts that in an infinite context, "betterness" is defined only by local, finite improvements, rendering some global comparisons undefined. While this incurs the cost of incomparability, it is the only price that preserves the normative integrity of the theory.

  **The Mathematical Impasse**

  To understand the severity of the problem, we must distinguish between absolute and conditional convergence. If the sum of positive values and the sum of negative values are both infinite, the series is not absolutely convergent. In such a scenario, the total value is undefined. Even if we assume a scenario where the series converges conditionally, the Riemann Rearrangement Theorem dictates that by shuffling the order of summation, we can make the total value equal to $+\infty$, $-\infty$, or any finite number.

  For the consequentialist, this is catastrophic. It implies that the moral status of a world is not an intrinsic property of that world but a function of the indexing scheme used to describe it. If I count beings by spatial proximity, World A might be better than World B. If I count them by temporal onset, World B might be better than World A. Since there is no metaphysically privileged "order of counting" for simultaneous or spacelike-separated events, aggregative consequentialism loses its action-guiding capacity. It collapses into indeterminacy.

  **The Failure of Mathematical Patches**

  Philosophers and mathematicians have proposed sophisticated tools to bypass standard summation limits. One approach involves using non-standard analysis, specifically hyperreal numbers, to assign values to infinite series (e.g., work by Easwaran or Tingley). Another involves Cesàro summation, which averages partial sums to find a limit where a standard sum fails.

  While mathematically elegant, these methods do not solve the *normative* problem. Hyperreal summation, for instance, typically relies on the choice of a free ultrafilter to determine how infinite quantities are compared. However, the choice of ultrafilter is mathematically arbitrary; there is no ethical reason to prefer one ultrafilter over another. Consequently, the moral verdict remains dependent on an arbitrary mathematical parameter. Similarly, Cesàro summation fails to assign values to many series that standard consequentialists would want to compare (e.g., a universe of alternating pleasure and pain).

  These strategies attempt to force the infinite into a finite mold without acknowledging that the "total sum" may not be a coherent property of an infinite world. They preserve the *form* of aggregation while sacrificing its *substance*, as the resulting "sums" no longer track the intuitive notion of "adding up all the good." They are technical workarounds that mask the underlying incoherence rather than resolving it.

  **The Normative Failure of Discounting and Restriction**

  If mathematical patches fail, perhaps we should modify the inputs. Two common strategies are spatiotemporal discounting and domain restriction.

  Discounting posits that value diminishes with distance in time or space. If value decays exponentially, the infinite series converges absolutely, and the Riemann problem vanishes. However, this solution is normatively bankrupt. Pure consequentialism is grounded in impartiality; the suffering of a being one light-year away is just as bad as the suffering of a being next to me, *ceteris paribus*. Discounting introduces a bias based on location, effectively discriminating against distant beings. It solves the mathematical problem by violating the moral axiom that gave the theory its force in the first place.

  Domain restriction argues that we should only sum value over the region we can causally affect. While pragmatic, this is an admission of defeat for *Total* Aggregative Consequentialism. If the theory claims that rightness is determined by the *total* good, ignoring the infinite background is ad hoc. If the background is truly infinite, our finite actions cannot change the total sum regardless of whether we count them or not. Restriction saves action-guidance only by abandoning the claim that we are maximizing the total sum of the universe.

  **The Case for Finite-Difference Consequentialism**

  Having rejected mathematical obfuscation and normative compromise, we are left with a stark choice: either deny the possibility of an infinite universe (an empirical claim we cannot justify) or deny that morality requires summing the infinite. I argue for the latter. We should adopt **Finite-Difference Consequentialism**.

  This framework modifies the aggregative principle. Instead of asking, "Which world has the higher total sum?", we ask, "Which world contains more value in the regions where they differ?" In an infinite universe, two worlds may share the same infinite background value but differ in a finite region caused by our actions. If World A and World B are identical except for a finite spacetime region $R$, and the sum of value in $R$ is higher in A, then A is better than B.

  This approach utilizes a "Pareto-style" logic applied to value. It respects the intuition that adding good is better than adding bad, without requiring a comparison of the infinite tails. It treats the infinite background as a constant that cancels out in moral comparisons. Crucially, this preserves the action-guiding nature of consequentialism. Our actions only affect finite regions; therefore, we only need to compare finite differences. The fact that the "total sum" of the universe is undefined becomes morally irrelevant because no action can change the total sum of an infinite series in a meaningful way anyway.

  **Owning the Cost: Incomparability**

  Adopting Finite-Difference Consequentialism incurs a significant cost: it renders certain global comparisons undefined. If we are comparing two world-histories that differ at infinitely many points (e.g., a world where every other person is happy vs. a world where every person is happy), this framework cannot declare one better than the other. The sums diverge, and the finite-difference rule does not apply.

  Critics might argue this is a fatal flaw, as a moral theory should rank all possible worlds. However, this objection misunderstands the role of moral theory. We are not cosmic architects choosing between entire universe-histories from behind a veil of ignorance; we are local agents choosing between actions with finite consequences. A moral theory that claims to rank worlds differing in infinite, causally inaccessible ways is not "more complete"; it is engaging in metaphysical speculation that has no purchase on decision-making.

  Furthermore, retaining Total Aggregation in the face of infinity forces us to accept arbitrary verdicts (via rearrangement) or discriminatory principles (via discounting). Incomparability is a lesser evil than arbitrariness. It is better to admit that we cannot compare two infinite worlds than to claim we can, based on an arbitrary choice of summation order. Incomparability preserves the objectivity of the comparisons we *can* make (the finite ones) by refusing to extend the logic beyond its domain of coherence.

  **The Trade-Off: Aggregation vs. Infinity**

  The core tension identified in the prompt is the trade-off between keeping aggregation and keeping the assumption of an infinite universe. Finite-Difference Consequentialism resolves this by distinguishing between *local aggregation* and *global summation*.

  We keep aggregation in the sense that we still sum value to determine the worth of an action's consequences. We keep the infinite universe assumption by acknowledging the background is infinite. What we sacrifice is the idea that these local sums must add up to a singular, global "Score" for the universe. We accept that "The Total Good" is not a well-formed concept in an infinite axiology.

  This is not a retreat from consequentialism, but a maturation of it. The core insight of consequentialism is that outcomes matter and that more good is better than less. Finite-Difference Consequentialism preserves this. It rejects the ancillary dogma that "outcomes matter" implies "the sum of all outcomes must be a finite number." By decoupling the normative force of "more good" from the metaphysical requirement of a "completed sum," we save the theory from collapse.

  **Conclusion**

  The divergent series problem is not a mere technical glitch; it is a reductio ad absurdum of Total Aggregative Consequentialism in an infinite context. The strategies of discounting, restriction, and hyperreal summation fail because they either violate impartiality, abandon the total view, or rely on arbitrary mathematical parameters. The only defensible path is to accept that in an infinite universe, the total sum of value is undefined and morally inert.

  We must therefore embrace Finite-Difference Consequentialism. This view accepts the cost of incomparability for worlds differing infinitely, but it secures the benefit of coherent, non-arbitrary verdicts for all causally possible actions. It acknowledges that while the universe may be infinite, our moral agency is finite. To demand a moral theory that sums the infinite is to demand a tool for a job we cannot do and need not do. By limiting our moral arithmetic to the finite differences we can actually effect, we preserve the rigor of consequentialism without succumbing to the paradoxes of the infinite. The sum is broken; we must learn to count without it.
