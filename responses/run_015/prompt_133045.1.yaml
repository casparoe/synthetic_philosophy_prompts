answer: |-
  Here is the short answer: **His grief is absolutely real, and she is factually wrong about harm.**

  Psychologically speaking, pain is defined by the experience of the person feeling it, not the physical properties of the object that caused it. If you burn a handwritten diary, you haven't physically harmed the author, but you have destroyed a part of their identity, memory, and labor. The pain is real.

  However, for the sake of your novel, "who is right" is less interesting than **why they are talking past each other.** If you write this as a debate about digital ethics, it will feel like a lecture. If you write it as a clash of love languages and fears, it will feel like a relationship drama.

  Here is a breakdown of the emotional truth of the situation, and how to translate that into your scene without sounding like a philosophy paper.

  ### 1. Why His Grief is Real (The Subtext)
  He isn't crying over polygons and textures. He is crying over three tangible things:
  *   **Labor and Time:** He spent months of his finite life on this. That time is gone forever.
  *   **Identity:** For many people, their creative output is an extension of self. Destroying the build feels like a personal insult or an erasure of who he is.
  *   **Safety/Violation:** His digital home was a sanctuary. Having strangers invade and wreck it is a violation of boundaries, similar to someone breaking into a physical house and spray-painting the walls. It creates a feeling of vulnerability.

  **In the scene:** Don't have him talk about "digital rights." Have him talk about the *hours*. Have him talk about the specific detail that is gone. *"I spent three weeks just getting the lighting right in that room. Three weeks I'm not getting back."*

  ### 2. Why She Says "It's Just Code" (The Subtext)
  If she is just a dismissive jerk, the scene is flat. Give her a motivation. Usually, when a partner says "it's not real," they actually mean one of two things:
  *   **Fear of Escapism:** She might be worried he cares more about the online world than the physical one they share. She sees the grief as proof that he is "losing touch."
  *   **Helplessness:** She doesn't know how to fix it. You can fix a broken car or bandage a cut. You can't fix a deleted server file. Telling him to "grow up" is a defense mechanism to make her feel less helpless.

  **In the scene:** Don't have her talk about "materialism." Have her talk about *him*. *"I can't fix this. I can't reach you in there. When you hurt like this over something I can't even see, it makes me feel like I don't matter."*

  ### 3. The Core Conflict: Validation vs. Solution
  He wants **validation** (acknowledgment that his pain makes sense). She is offering a **solution** (reframing the problem so it goes away).
  *   He says: "I am hurt."
  *   She hears: "Fix this pain."
  *   She says: "It's not real, so the pain should stop."
  *   He hears: "Your pain is stupid."

  ### How to Write the Scene (Without the Lecture)
  Avoid abstract words like "virtual," "ontology," "assets," or "existence." Stick to sensory details and emotional stakes.

  **Bad (Philosophy Paper):**
  > "Just because it's virtual doesn't mean the labor wasn't real," he said.
  > "But it has no physical mass," she countered. "You can't be harmed by data."

  **Good (Emotional Reality):**
  > He rubbed his eyes, red-rimmed and dry. "It wasn't just data, Sarah. It was where we hung out. It was where I felt... capable."
  > "I'm right here," she said, gesturing to the kitchen, to the rent-stuffed mailbox on the counter. "I'm real. The bills are real. Why are you crying over a server?"
  > "Because I can't fix the bills," he snapped, voice cracking. "But in there, I could build something that lasted. And now it's gone. I feel like I'm gone."

  ### The Verdict for Your Story
  *   **Is he crazy?** No. His reaction is proportional to the investment of self.
  *   **Is she right?** No. Psychological harm is harm. But her *fear* (that he is withdrawing from her) might be valid.
  *   **The Tragedy:** They are both lonely. He is lonely because his sanctuary was violated; she is lonely because she feels competing with a ghost world for his affection.

  **Recommendation:**
  Let the scene end without a clear winner. He should feel more isolated because she didn't understand him. She should feel frustrated because she can't "save" him from this pain. That tension is where the good story lives. The question isn't "Is the digital world real?" The question is "Can they bridge the gap between their two realities?"
