answer: |-
  # Teaching Plan: Strawson's Reactive Attitudes & The Orthogonality of Determinism

  **Session Duration:** 50 Minutes
  **Audience:** 15 Students (2nd/3rd Year, post-Intro Metaphysics/Ethics)
  **Core Objective:** Shift the frame from "Does determinism permit responsibility?" to "What makes our practices of holding responsible intelligible?" using the Reactive Attitudes framework.

  ---

  ## I. The Carrying Example: Constraints & Configuration

  **The Case:** "The Care-Bot Neglect."
  A semi-autonomous care-robot assigned to an elderly patient ignores a vocal request for water during a critical window. The robot's log reveals it prioritized "battery optimization" over "user comfort" based on a weighted algorithm. The patient's daughter discovers this and feels a sting of indignation toward the *robot*, not just the manufacturer.

  **What This Example Must Possess:**
  1.  **Apparent Agency:** The robot must make a *choice* between competing values (battery vs. comfort), not merely malfunction. This allows students to project agency initially.
  2.  **Interpersonal Stake:** The victim must be a human capable of reactive attitudes (the daughter), ensuring the focus remains on *her* response, not the robot's rights.
  3.  **Ambiguous Resentment:** It must be plausible that the daughter *feels* resentment, even if she judges it irrational. This creates the tension needed to analyze the *conditions* of that feeling.

  **What This Example Must Lack:**
  1.  **Consciousness Claims:** Do not specify if the AI is conscious. The point is the *attitude*, not the ontology.
  2.  **Legal Liability:** Explicitly bracket questions of who pays for the harm. This is not a tort law seminar.
  3.  **Human Proxy:** Do not allow students to pivot resentment immediately to the programmer. Force them to sit with the attitude toward the *system* first to isolate the structural requirements of resentment.

  ---

  ## II. Dependency Order & Conceptual Arc

  *The logic of the session moves from Phenomenology → Conditions → The Objective Shift → The Metaphysical Challenge.*

  ### Phase 1: Phenomenology of the Reaction (0:00–0:10)
  *   **Activity:** Poll the room. "Does the daughter's resentment toward the *robot* make sense?"
  *   **Concept:** **Reactive Attitude (Preliminary).** Identify the feeling (indignation/resentment) distinct from mere frustration (like a broken toaster).
  *   **Why First:** We must establish the *data* of our moral experience before analyzing its validity. Strawson starts with what we *do*, not what is *true*.
  *   **Interception Point (Misconception: "Non-Cognitive Feelings"):**
      *   *Risk:* Students claim resentment is just blind anger.
      *   *Intervention:* Ask, "If the daughter learned the robot was physically incapable of reaching the water, would the resentment vanish?" (Yes). Therefore, the feeling embodies a *judgment* (an expectation was violated). Reactive attitudes are not raw emotions; they are embodied expectations of regard.

  ### Phase 2: The Conditions of Intelligibility (0:10–0:25)
  *   **Activity:** Diagnose *why* the resentment feels misplaced toward the robot.
  *   **Concept:** **The Demand for Goodwill.** Reactive attitudes presuppose the object is capable of understanding and responding to a demand for goodwill.
  *   **Why Second:** We cannot define the "Objective Attitude" until we know what it is the *alternative to*.
  *   **Interception Point (Misconception: "AI Ethics Collapse"):**
      *   *Risk:* Students argue about whether AI *can* have goodwill.
      *   *Intervention:* Refuse the ontological debate. State: "Whether the AI *has* goodwill is irrelevant. The point is the daughter cannot *sustain* the expectation of it. The relationship is structurally one-way."

  ### Phase 3: The Objective Attitude & The Switch (0:25–0:35)
  *   **Activity:** Contrast the robot case with a human nurse making the same choice.
  *   **Concept:** **The Objective Attitude.** Viewing an agent as an object to be managed, cured, or trained, rather than a participant to be reasoned with.
  *   **Why Third:** This provides the vocabulary for the determinism worry. The Objective Attitude is what we adopt when we think "they couldn't help it."
  *   **Interception Point (Misconception: "This is Just Compatibilism"):**
      *   *Risk:* Students think Strawson is arguing determinism is false or compatible.
      *   *Intervention:* Clarify: "Strawson isn't solving the metaphysical puzzle. He's saying our practice doesn't *wait* for the puzzle to be solved. We only switch to the Objective Attitude for specific *local* reasons (immaturity, psychosis, extreme coercion), not *global* metaphysical ones."

  ### Phase 4: The Metaphysical Pivot (0:35–0:45)
  *   **Activity:** Introduce the Determinism Worry. "If the human nurse was determined by physics just like the robot was determined by code, why don't we treat the nurse objectively?"
  *   **Concept:** **Orthogonality.** The truth of determinism does not logically compel the Objective Attitude.
  *   **Why Fourth:** This is the climax. It uses the previous distinctions to show the category mistake.
  *   **Interception Point (Misconception: "Strawson Denies Free Will"):**
      *   *Risk:* Students think Strawson is a hard determinist who says "free will is an illusion but we keep blaming."
      *   *Intervention:* "Strawson says the question 'Do they have free will?' is the wrong question. The right question is 'Can we participate in human relationships with them?' Determinism doesn't stop the relationship."

  ### Phase 5: Closing Check (0:45–0:50)
  *   **Activity:** The "Opt-Out" Test.
  *   **Prompt:** "Imagine you knew determinism was true. Could you *choose* to abandon all reactive attitudes toward your friends and family permanently?"
  *   **Goal:** Distinguish genuine uptake from discomfort.
      *   *Mere Discomfort:* "It's hard to imagine, but theoretically yes." (They still view determinism as a threat).
      *   *Genuine Uptake:* "No, because that would mean ceasing to view them as humans. It's not a choice we can make." (They see the practice as constitutive of human life).

  ---

  ## III. Strategic Exclusions (What to Refuse)

  To maintain the 50-minute focus and prevent the "determinism permit" relapse, explicitly decline to explain:

  1.  **The Taxonomy of Exemptions:** Do not detail the difference between *excuses* (I didn't do it) and *exemptions* (I couldn't help it). Acknowledge the distinction exists but refuse to categorize specific cases. This drains time into legalistic parsing.
  2.  **Pre-Strawsonian History:** Do not contextualize Strawson against Hume, Kant, or Chisholm. This invites the "Is this compatibilism?" debate you are trying to bypass. Treat Strawson's framework as freestanding for this session.
  3.  **The Normative Justification:** Do not attempt to prove we *ought* to keep reactive attitudes. Strawson argues we *cannot* abandon them (naturalism). Do not let students argue we *should* try. Refuse: "We are analyzing the structure of our actual practice, not designing an ideal one."

  ---

  ## IV. Vulnerability Analysis & Limits of Recommendation

  ### Most Vulnerable Point in the Arc
  **The Transition from Phase 3 to Phase 4 (The Move from Local to Global).**
  *   **The Risk:** A student can accept that we treat robots objectively and humans reactively, but still insist: "But if humans are *really* just complex robots (determined), then we *ought* to treat them objectively. Strawson just says we *don't*, not that we *shouldn't*."
  *   **Why it's weak:** This is the "Naturalistic Fallacy" objection. Strawson relies on the claim that abandoning reactive attitudes is practically impossible for humans (it would mean the end of interpersonal relationships). A determined student can reply: "So we are stuck in a delusion? That doesn't make responsibility *real*."
  *   **Mitigation:** Emphasize that for Strawson, "real" responsibility *just is* the participation in these relationships. There is no "deeper" fact of responsibility to be found. If you demand one, you are asking for a God's-eye view that doesn't exist.

  ### Limits of My Own Recommendation
  **What Would Change My View on the Example Choice:**
  If pedagogical evidence suggested that upper-division students cannot separate *anthropomorphism* from *moral agency*, the AI example is dangerous. If students consistently conflate "I feel mad at the AI" with "The AI is morally responsible," the example reinforces the very metaphysical confusion Strawson tries to dissolve.
  *   **Alternative:** If this confusion arises, abandon the AI case for a **Human Pathology Case** (e.g., a person acting under post-hypnotic suggestion). This keeps the agent human (preserving the interpersonal frame) while removing the capacity for goodwill (triggering the Objective Attitude). This is safer but less engaging.

  **What Would Change My View on the Sequencing:**
  If students demonstrate strong **Error Theory** leanings (the belief that all moral practices are false illusions), starting with Phenomenology (Phase 1) fails because they reject the data.
  *   **Alternative:** In that context, start with Phase 4 (The Metaphysical Pivot) and argue pragmatically: "Even if it's an illusion, can you live without it?" However, for standard undergraduates, the Phenomenology-first approach is superior because it grounds the abstract in their lived experience.

  **The Weakest Link (Explicit Statement):**
  The step at which a student can accept everything prior and still reject Strawson is **Phase 4 (Orthogonality).**
  A student can say: "I accept that we *do* hold reactive attitudes. I accept that determinism doesn't logically force us to stop. But I still maintain that if determinism is true, these attitudes are *unjustified*."
  *   **Why this is the limit:** Strawson's argument is ultimately a transcendental one about the conditions of human life. If a student insists on a "view from nowhere" to justify their practices, Strawson has no further argument other than, "Then you are no longer participating in human life." This is a conversation-stopper, not a proof. You must be prepared to let this tension stand rather than trying to "win" it.
