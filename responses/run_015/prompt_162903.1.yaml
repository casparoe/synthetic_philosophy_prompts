  *To resolve the disagreements above, we submit to the following thought experiments. Both parties agree to accept the outcome of these intuitions as binding for their theory (i.e., if the intuition goes against your prediction, you must adjust the theory).*

  ### Crux 1: The Token/Type Distinction
  **The Case:** *The Identical Twin's Egg.*
  Nadia's mother has an identical twin sister. Due to a rare biological fluke, the aunt produces an egg with the **exact same nuclear genome** as the egg Nadia actually came from. This aunt-egg is fertilized by the **exact same sperm token** that actually fertilized Nadia's mother's egg.
