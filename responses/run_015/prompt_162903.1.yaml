  **Status:** **DRAFT FOR REVIEW** (Confidence markers applied by Facilitator)

  ---

  ## PREAMBLE: ON THE POSSIBILITY OF CONSENSUS
  **Facilitator Note:** There is a non-trivial risk that this collaboration is category-mistaken. If Crispin's view is that *de re* modality is an illusion (a la Lewis or Carnap), and Nadia's view is that *de re* modality is robustly real, they are not disagreeing about origins; they are disagreeing about the nature of modal discourse. This document attempts to bracket that meta-metaphysical dispute to isolate the specific disagreement about *origins*. If Crispin balks at Section 1, Clause 3, the disagreement is substantive and meta-ontological, not verbal. **[Confidence: High]**

  ---

  ## 1. AGREED CLAIMS (THE COMMON GROUND)
  *The following claims are drafted to be acceptable to both parties without forcing concession on the core metaphysical dispute. [Confidence: Medium-High]*

  1.  **Biological Facts:**
      *   Human conception typically involves the fusion of a specific sperm token and a specific egg token.
      *   The resulting zygote contains nuclear DNA (contributed equally by sperm and egg) and mitochondrial DNA (contributed almost exclusively by the egg).
      *   Monozygotic twinning occurs when a single zygote splits into two embryos during early cleavage.
      *   **[Confidence: High]** Both parties accept standard contemporary genetics as the baseline for describing "genetic identity."

  2.  **Logical Constraints:**
      *   **Necessity of Identity:** For any $x$ and $y$, if $x = y$, then necessarily $x = y$. (Neither party claims a person could be identical to someone else in another world).
      *   **No-Branching Constraint:** An individual $x$ in world $W_1$ cannot be identical to two distinct individuals $y$ and $z$ in world $W_2$. (If a scenario implies branching, at least one of the identity claims must fail).
      *   **[Confidence: High]** These are logical formalisms both accept, though they may disagree on what *grounds* them.

  3.  **Scope of Standard Arguments:**
      *   Both agree that Kripke's original arguments in *Naming and Necessity* establish a *conditional* necessity: *If* this individual exists, *then* they originated from *this* origin (however 'origin' is defined).
      *   Both agree that the dispute is not about epistemology (how we *know* who is who) but about metaphysics or conceptual semantics (what *makes* them who they are).
      *   **[Confidence: Medium]** Crispin may prefer "conceptual semantics" over "metaphysics," but can accept this disjunction.

  4.  **The Role of Intuition:**
      *   Both agree that pre-theoretical intuitions about cases (e.g., "That wouldn't be me") are the data to be explained.
      *   They disagree on whether these intuitions track mind-independent modal facts (Nadia) or psychological/conventional tracing rules (Crispin).
      *   **[Confidence: High]** This accurately maps the dialectic.

  ---

  ## 2. RESIDUAL DISAGREEMENTS
  *Each row represents a single point of contention. Wording A is what Nadia signs; Wording B is what Crispin signs. The Final Column is the Facilitator's verdict on whether the row represents a substantive metaphysical disagreement or a verbal/terminological one.*

  | Issue | Wording A (Nadia's Commitment) | Wording B (Crispin's Commitment) | Facilitator Verdict (Substantive vs. Verbal) |
  | :--- | :--- | :--- | :--- |
  | **1. The Locus of Necessity** | "It is a mind-independent metaphysical fact that I could not have originated from different gamete tokens." | "Given our actual conceptual scheme for tracing persons, it is incorrect to say I originated from different gamete tokens." | **Substantive.** [Confidence: High] This is Realism vs. Anti-Realism about modality. Not merely verbal. |
