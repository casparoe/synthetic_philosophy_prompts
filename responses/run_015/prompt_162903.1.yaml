  **The Case:** *The Symmetrical Split.*
  The actual zygote splits perfectly symmetrically (identical twins). In the counterfactual, the split *does not occur*, and only one individual develops.
  *   **Question:** Is the single non-split individual identical to Twin A, Twin B, or neither?

  | Party | Prediction | Rationale |
