  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION: ORIGIN ESSENTIALISM
  **Participants:** Nadia (Proponent, Kripkean Realism) & Crispin (Proponent, Conceptualism/Genome Essentialism)  
  **Facilitator:** [Reading Group Lead]  
