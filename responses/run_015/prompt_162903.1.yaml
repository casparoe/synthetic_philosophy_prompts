  | **4. The Twinning Case** | "In a splitting case, either the original ceases to exist, or identity is indeterminate. Both twins cannot be the original." | "The 'No-Branching' constraint shows that identity is not what matters in survival. We can stipulate either twin is the original." | **Substantive.** [Confidence: High] Nadia sees a metaphysical problem; Crispin sees a pragmatic choice. |
