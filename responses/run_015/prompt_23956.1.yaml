prompt: |-
  a lot of the people i interview about futarchy -- using prediction markets to pick policy -- describe the market as an oracle: you ask it what the future looks like if we pass X, it hands you a number, and the wisdom of the crowd does the seeing for you. they lean on that picture to argue futarchy is just a more honest version of the forecasting we already trust, and that the remaining problems are mostly technical. but i'm starting to suspect the oracle analogy is quietly doing all the work in that argument. can you audit it -- what maps onto what, where the mapping breaks (resolution, manipulation, who gets to ask the question, what "accuracy" even means when the participants are trading rather than knowing), and whether the "just technical" conclusion survives once the disanalogies are on the table?
reasoning: |-
  Here's a thinking process that leads to the suggested audit of the "Futarchy as Oracle" analogy:

  1.  **Deconstruct the User's Request:**
      *   **Topic:** Futarchy (governance by prediction markets).
      *   **Core Analogy:** The market as an "Oracle" (ask a question, get a number, trust the wisdom of the crowd).
      *   **User's Suspicion:** This analogy is doing the heavy lifting in arguments *for* futarchy, masking deeper problems.
      *   **Task:** Audit the analogy.
          *   What maps onto what?
          *   Where does the mapping break? (Resolution, manipulation, question-setting, nature of "accuracy").
          *   Does the "just technical" conclusion survive once disanalogies are exposed?

  2.  **Initial Brainstorming & Concept Mapping:**
      *   *Futarchy:* Robin Hanson's idea. Vote on values, bet on beliefs. Policy chosen based on market prediction of outcome metrics (e.g., GDP).
      *   *Oracle:* A mystical or technical entity that provides truth about the future. Passive, objective, authoritative.
      *   *The Mapping:*
          *   Question asker = Government/Voters.
          *   Question = Policy proposal + Metric.
          *   Oracle = Prediction Market.
          *   Answer = Market Price (probability/expected value).
          *   Trust mechanism = Incentives/Wisdom of Crowds.
      *   *The Cracks:*
          *   Oracles are usually static; markets are dynamic and reactive.
          *   Oracles give truth; markets give *consensus expectations* (which can be wrong).
          *   Oracles don't care about the outcome; traders do (and their trading *affects* the outcome).
          *   Who defines the metric? (Goodhart's Law).
          *   Liquidity/Manipulation vs. Divine Infallibility.

  3.  **Structuring the Audit:**
      *   **Introduction:** Acknowledge the power of the analogy but validate the user's suspicion. It's a "conceptual compression" that hides complexity.
      *   **Section 1: The Mapping (Where it works).** Briefly establish why people use it. (Aggregation of information, incentive alignment).
      *   **Section 2: The Disanalogies (Where it breaks).** This is the meat.
          *   *Reflexivity (The most critical point):* Oracles predict; markets influence.
          *   *Resolution/Truth:* Oracles know the future; markets bet on a *proxy* metric.
          *   *Question Setting:* Oracles answer what you ask; markets break if you ask the wrong thing (Goodhart's Law).
          *   *Manipulation/Adversaries:* Oracles are usually assumed benign/neutral; markets are adversarial environments.
          *   *Epistemology:* "Knowing" vs. "Pricing."
      *   **Section 3: The "Just Technical" Claim.** Evaluate if the problems are engineering bugs or feature flaws.
      *   **Conclusion:** Summarize the verdict. The analogy is a dangerous simplification.

  4.  **Drafting the Content - Section by Section (Iterative refinement):**

      *   *Intro:* Start strong. The oracle analogy is a "rhetorical shield." It makes futarchy sound like *discovery* rather than *construction*.
      *   *Mapping:* Keep it tight. Input (Policy), Black Box (Market), Output (Price).
      *   *Disanalogy 1: Reflexivity.* This is the big one. An oracle predicts the weather. A futarchy market predicts GDP *after* a policy. But the act of trading changes the policy's implementation or people's behavior *before* the resolution. *Self-fulfilling/self-defeating prophecies.*
      *   *Disanalogy 2: Resolution/Truth.* An oracle says "It will rain." Futarchy says "GDP will be X." But GDP is a construct. If I measure "happiness" by dopamine hits, the market will optimize for drug distribution. The oracle doesn't care about the *definition* of the answer, futarchy lives or dies by it.
      *   *Disanalogy 3: Question Setting.* Who writes the prompt? In AI/Oracle terms, "Prompt Injection." In futarchy, this is political power. The market can't tell you if the question is stupid.
      *   *Disanalogy 4: Accuracy vs. Profit.* Traders don't want truth; they want profit. Sometimes lying (manipulating price) is more profitable than revealing truth, especially if you can hedge elsewhere.
      *   *The "Just Technical" Claim:* If the oracle analogy fails, the problems aren't just "liquidity" or "UI." They are *political* and *philosophical*. You can't code your way out of Goodhart's Law.

  5.  **Refining the Tone:**
      *   Needs to be analytical, slightly skeptical, but fair to the theory.
      *   Avoid jargon where possible, but use precise terms (Reflexivity, Goodhart's Law, Performative Prediction).
      *   Ensure the conclusion directly answers the user's prompt about whether the "just technical" conclusion survives. (It doesn't).

  6.  **Self-Correction/Review during drafting:**
