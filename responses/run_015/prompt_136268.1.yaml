  The ordering follows strict logical dependency. You cannot design a guardian for nature without a theory of standing and a precedent for non-present entities. Temporal boundaries are prioritized over functional ones because human future interests are morally less contentious than AI rights, making them a better testing ground for the inclusion/standing split. A successful theory of standing for future humans validates the decoupling of membership from voice, which then unlocks the functional boundary questions. Conversely, failing to resolve the conceptual split renders temporal and functional debates stuck in anthropocentric voting paradigms. The leverage lies in the first point because it changes the question from "Who votes?" to "Whose interests count and how?" This shifts institutional design from franchise expansion to representation innovation, allowing specific deficits to be targeted rather than treating membership as a monolithic binary. Furthermore, temporal boundaries offer a clearer causal chain for impact assessment than functional boundaries, where agency is disputed. By securing the conceptual ground and testing it on future generations, researchers build a robust framework that can withstand the metaphysical challenges of AI or ecological personhood. This sequencing ensures that institutional designs are not merely symbolic but structurally capable of weighting interests independently of voting capacity. If the conceptual split remains unresolved, attempts to include AI or nature will likely fail due to category errors, wasting resources on voting mechanisms for entities that require representation instead. Thus, the conceptual work is the bottleneck; clearing it accelerates all downstream institutional experimentation by defining the correct tools for the job.

