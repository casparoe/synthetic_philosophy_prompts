          1.  **Conceptual Clarification (Inclusion vs. Standing):** This is the foundational layer. Without resolving whether the goal is franchise or interest-weighting, institutional proposals are incoherent. It determines the metric of success.
          2.  **Temporal Boundaries (Future Generations):** This is the highest-stakes application of the split. Future people cannot be included (they don't exist), so they must have standing. Solving how to institutionalize standing without inclusion here provides the blueprint for other edge cases. It forces the design of guardianship models or proxy voting, which are transferable mechanisms.
          3.  **Functional Boundaries (AI/Ecosystems):** This is downstream of temporal boundaries. If we cannot model standing for future humans, modeling it for non-sentient ecosystems or non-human agents is premature. However, it tests the limits of "interests." If standing requires an interest-bearer, AI might fail; if it requires systemic stability, ecosystems might pass.
          4.  **Implementation Mechanics:** Voting systems, assemblies, etc. These are downstream tools.

