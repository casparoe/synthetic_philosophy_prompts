      *   **Specific Interests:** Temporal boundaries (future generations), Functional boundaries (AI/ecosystems), Inclusion/Standing split.
      *   **Goal:** Research planning for a 3-year project aiming to shift democratic institutional design.
      *   **Task:** Rank main live issues, defend ordering (upstream/downstream), identify what would flip the ranking, and pick one thread for a multi-year project.
      *   **Format:** Four specific sections with word count constraints (150, 350, 150, 100 words).

  2.  **Deconstruct the Core Distinction (Inclusion vs. Standing):**
      *   *Inclusion:* Are you in the club? (Citizenship, voting rights).
      *   *Standing:* Does your interest count in the calculus? (Representation, guardianship, algorithmic weighting).
      *   *Insight:* You can have inclusion without standing (disenfranchised citizens, gerrymandering) or standing without inclusion (guardians for nature, future generations ombudspersons).
      *   *Relevance to Boundary Problem:* The classic "All Affected" vs. "All Subjected" debate often conflates these. "All Affected" might demand standing (interests considered) but not necessarily inclusion (voting). "All Subjected" might demand inclusion (coercion requires consent) but not necessarily standing on all issues.
      *   *Upstream/Downstream:* Defining this split is conceptual groundwork. It determines *what* problem we are solving before we solve *who* fits.

  3.  **Rank Priorities:**
      *   *Candidate 1: The Inclusion/Standing Conceptual Clarification.* (Most upstream). If we don't know if we're designing for voters or for interests, we can't design institutions.
      *   *Candidate 2: Temporal Boundaries (Future Generations).* High stakes, but depends on #1. Do they get standing via guardians or inclusion via proxy voting?
      *   *Candidate 3: Functional Boundaries (AI/Non-humans).* Even more speculative. Depends on #1 and #2.
      *   *Candidate 4: Institutional Mechanisms.* (Downstream). How to implement.
      *   *Reasoning:* Conceptual clarity drives institutional design. If standing can be decoupled from inclusion, we don't need to give AI votes; we need representation. This changes the design space entirely.

  4.  **Drafting Section 1: The Inclusion/Standing Split (approx. 150 words):**
      *   Focus: Why this distinction matters.
      *   Draft: The inclusion/standing split dissolves the false dichotomy between "all affected" and "all subjected." Inclusion grants formal membership (voting rights), while standing ensures interests weigh into decisions. Conflating them forces impossible choices: either grant voting rights to non-humans (absurd) or ignore their interests (unjust). Separating them allows hybrid institutions: future generations might hold standing via guardians without inclusion, while residents hold inclusion without full standing on foreign policy. This distinction is upstream because it dictates the *type* of mechanism required. If the goal is standing, representation suffices; if inclusion, franchise expansion is necessary. Most boundary debates stall because participants argue about voting when they actually mean interest-weighting. Clarifying this prevents category errors in institutional design, allowing researchers to target specific deficits (e.g., lack of voice vs. lack of vote) rather than treating "membership" as a monolithic binary.

  5.  **Drafting Section 2: Ranked Priorities (approx. 350 words):**
      *   Need to rank 3-4 issues.
      *   1. Conceptual Clarification (Inclusion/Standing).
      *   2. Temporal Boundaries (Futuregens).
      *   3. Functional Boundaries (AI/Nature).
      *   Reasoning must show upstream/downstream relationship.
