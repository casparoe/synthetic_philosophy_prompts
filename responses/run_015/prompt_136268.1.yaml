prompt: |-
  I'm trying to get my bearings on the boundry problem — who actually belongs to the demos — and I keep feeling like people are answering different questions without noticing. There's this distinction I think gets ignored: "inclusion conditions" (the threshold for being part of the demos at all) vs "standing conditions" (whether being included actually means your interests carry weight, or if you're just symbolically present). Once you separate those, the classic fight between "all affected" and "all subjected" looks like it might be mixing up two different jobs, but I'm not sure which layer is actually upstream.

  So I'm wondering: if someone has about three years and wants to do work that might shift how democratic institutions are designed, which open questions here are worth it? I'm especially interested in how temporal boundaries (future generations?), functional boundaries (AI agents or ecosystems that are affected but can't vote in any obvious sense?), and the inclusion/standing split interact. Which ones change the institutional design, and which are just taxonomy?

  Please rank the main live issues and defend the ordering — not just "this is important" but what makes it upstream of the others, and what kind of argument or result would make you reorder them. I'm doing this for my own research planning so I want to know where the leverage actually is.

  Format:
  1. The inclusion/standing split — why it changes the debate (around 150 words)
  2. Ranked priorities with reasoning (around 350 words)
  3. What would flip your ranking (around 150 words)
  4. Bottom line — if you had to pick one thread for a multi-year project (around 100 words)
