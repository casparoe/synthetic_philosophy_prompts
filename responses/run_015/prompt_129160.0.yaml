answer: |-
  You are correctly sensing a contradiction in your second guess, because your initial intuition was right: the leveling-down objection is a critique of **egalitarianism**, not prioritarianism.

  Here is the correction to your framing:

  **1. The Leveling-Down Objection targets Egalitarianism**
  Strict telic egalitarianism holds that inequality is intrinsically bad. Therefore, a situation where everyone is equally miserable is, in one respect, "better" than a situation where some are well-off and others are poorly off, simply because the former is more equal. This is the "leveling-down objection": it implies we should sometimes make people worse off just to achieve equality, even if it benefits no one. Most philosophers reject this as absurd.

  **2. Prioritarianism avoids this trap**
  Prioritarianism (coined by Derek Parfit) was specifically designed to capture the moral intuition that we should prioritize the worse-off *without* committing to equality for its own sake. It holds that benefits matter more the worse off the person is, but it remains concerned with **absolute welfare**, not relative gaps. A prioritarian would never support "leveling down" because making the healthy worse off without improving the sick produces no net weighted benefit. It is a non-relational view: it cares about where you are on the scale, not how far you are from someone else.

  **3. Weighted-QALYs are Prioritarian**
  A triage system that assigns extra value to QALYs gained by patients with pre-existing disabilities is structurally **prioritarian**.
  *   **Utilitarianism** maximizes total QALYs (ignoring baseline).
  *   **Egalitarianism** seeks to minimize the gap between disabled and non-disabled (which could theoretically justify harming the healthy to close the gap).
  *   **Prioritarianism** maximizes the sum of *weighted* QALYs, where the weight is determined by the baseline health status. It says a QALY for a disabled person is morally more urgent than a QALY for an able-bodied person, but it does not demand equality as an end goal.

  While some bioethicists argue this is a "hybrid" view (often blending prioritarianism with sufficientarianism, which focuses on getting everyone above a threshold), the commitment to weighting benefits based on baseline disadvantage without demanding equal outcomes is the definition of prioritarianism. You were right to doubt the claim that prioritarianism implies leveling down; that is the specific problem it was built to solve.

  Verdict: Your initial intuition was correct: prioritarianism explicitly avoids the leveling-down objection by weighting absolute benefits rather than relative equality, making it the precise philosophical framework for disability-weighted triage protocols.
