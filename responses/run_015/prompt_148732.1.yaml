prompt: |-
  I teach intro ethics — big lecture, ~280 students, twice a year, and the discussion sections are run by TAs who are mostly grad students from other departments and who get one 90-minute training session from me, total. Every time we do the Republic book 2 material — Glaucon, the ring, why be just when being just costs you and nobody is watching — I make them write a 500-word paper answering him. That's ~280 papers a semester that somebody has to get through in about ten minutes each, with a comment that's actually worth reading, and students can appeal to me if they think the TA got it wrong.

  What I want from you is a procedure my TAs can run on a paper, in this order, that decides one question: does this paper actually answer Glaucon, or does it quietly answer a near neighbour instead? Not "is the argument good" — I read for that when it matters. Just: whatever this thing is arguing, is it an answer to the challenge, or an answer to a question Glaucon already took off the table? (I tell them in lecture that he's stripped away reputation, consequences, and the wages of justice, and that he's set it up so the just person gets the reputation of injustice and the unjust person gets the reputation of justice — so "justice pays eventually" is precisely what he asked you not to say.) For each step tell me what counts as a pass, where the procedure stops with a hard no, and where it hands the paper to me because the question there is one of judgement rather than fact. And be honest about which steps are really just a TA's gut in a flowchart costume — I'd rather know then pretend.

  Constraint: the checks have to be worded so someone with no philosophy can run them. If a step requires recognising a reductio or an internal reason, it's useless to me.

  One wrinkle. For the last two years I've been running my own variant along side the original: in my version the ring doesn't only make you invisible, it also means that what you do while wearing it leaves no trace on you — no memory of it, no habit formed, no change in what you later want, no guilt, no self-knowledge, nothing to be proud or ashamed of afterwards. I use it because it kills three families of answer at once: the you'll-get-found-out family, the you-become-a-bad-person family, and the you'd-betray-your-own-deepest-projects-and-lose-your-integrity family. I want to see whether anyone can produce a reason that doesn't run through one of those channels. So the procedure has to work on papers answering my version too. And seperately: tell me whether my variant is a fair sharpening of Glaucon or whether I've rigged the question so that nothing could possibly answer it. I genuinely can't tell anymore.

  Then run the procedure on three papers I get versions of every semester. (1) In a world where everyone had a ring we'd all be worse off, so we agree to be just, and I keep my agreement even with the ring on. (2) The self is constituted by its choices, so there's no me left over who'd get to enjoy the loot — the person who comes out of the ring just is someone else. (3) A paper that is genuinely beautiful and is my favourite every single time — you'd have to live with yourself afterwards, you'd know what you'd done, and that knowledge would eat you alive, so you're still worse off. I suspect the procedure is going to tell me (3) is a dodge, and I'd like to see whether it can say that without also saying something stupid.

  Hard cases the procedure has to handle: a paper that rejects the framing of the challenge outright in a way that is itself a real philosophical move; and a paper that answers a version of the question Glaucon wasn't asking but does it brilliantly. Finally, tell me what the procedure can't do — I don't want to hand a TA something that makes her think the hard part is finished.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **Context:** Intro Ethics, large lecture (~280 students), TAs are non-philosophy grad students with minimal training (90 mins).
      *   **Task:** Create a step-by-step procedure (flowchart/checklist) for TAs to determine if a student paper *actually answers Glaucon's challenge* (specifically Book 2 of the *Republic*) or if it answers a "near neighbour" (a question Glaucon explicitly ruled out).
      *   **Specific Constraint 1:** The procedure must be usable by someone with *no philosophy background*. No jargon like "reductio," "internal reason," "deontological," etc.
      *   **Specific Constraint 2:** Must account for the Professor's "Super Ring" variant (Invisibility + No Trace/Memory/Habit/Guilt).
      *   **Specific Constraint 3:** Honesty about where the procedure relies on "gut feeling" disguised as logic.
      *   **Specific Constraint 4:** Evaluate the Professor's "Super Ring" variant (Fair sharpening or rigged?).
      *   **Specific Constraint 5:** Run the procedure on three specific sample papers provided.
      *   **Specific Constraint 6:** Handle hard cases (rejecting the framing, brilliant answer to wrong question).
      *   **Specific Constraint 7:** Explicitly state what the procedure *cannot* do.
      *   **Output Structure:** Procedure steps (Pass/Fail/Refer), Evaluation of Variant, Sample Paper Analysis, Limitations.

  2.  **Deconstruct Glaucon's Challenge (Standard & Variant):**

      *   *Standard Glaucon:* Why be just if you can be unjust without consequence (reputation, punishment) and get the benefits?
      *   *Excluded Answers:* "You'll get caught," "It's bad for your reputation," "God will punish you," "It makes you a better person (habituation)," "It preserves your integrity."
      *   *Professor's Variant:* Ring = Invisibility + Amnesia/No Psychological Trace.
      *   *Excluded Answers (Variant):* "You'll get caught," "It ruins your character," "You'll feel guilty," "You lose your integrity/self."
      *   *The Core Question:* Is there a reason to choose Justice *right now*, *in this specific act*, where *nothing bad happens to you* (externally or internally) as a result?

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Goal:* Filter out "Consequences" and "Character Change."
      *   *Step 1: The "Getting Caught" Check.* Easy. Does the paper mention reputation, punishment, or being found out?
          *   *Refinement:* Needs to cover the "Social Contract" angle (Paper 1). If the argument relies on *everyone* having a ring, does that change the specific act's consequence?
      *   *Step 2: The "Inner Damage" Check.* Does the paper argue you become a worse person, lose integrity, or feel bad?
          *   *Refinement:* Crucial for the Professor's variant. If the ring removes memory/guilt, arguments about "living with yourself" fail.
      *   *Step 3: The "Reason for Action" Check.* This is the hard part. If consequences and character are out, what's left? The paper needs to point to the *act itself*.
          *   *Constraint:* No jargon. Instead of "intrinsic value," use "The act itself is the reason."
      *   *Step 4: The "Framing" Check.* What if the student says "This is a stupid question"?
          *   *Decision:* This needs a "Refer to Prof" bucket. TAs can't judge philosophical legitimacy of rejecting premises easily.
      *   *Honesty Check:* Where is this gut feeling? Step 3 is mostly gut. I need to admit that.

  4.  **Evaluating the "Super Ring" Variant:**

      *   *Is it fair?* Glaucon wants to isolate justice from its *consequences*. Psychological consequences (guilt, habit) are technically consequences.
      *   *Is it rigged?* It might be *too* effective. If you remove all connection between the act and the agent (no memory, no habit), are they even the same agent? If the agent is discontinuous, why should *future* me care? But Glaucon asks why *I* should be just *now*.
      *   *Verdict:* It's a fair sharpening *if* the goal is to test for purely deontological or intrinsic value arguments. It's rigged *if* the goal is to see if justice is rational for a human being (since humans *do* have memory/guilt). I need to nuance this.

  5.  **Running the Procedure on the Three Samples:**

      *   *Paper 1 (Social Contract/Everyone has a ring):*
          *   Check 1 (Caught): No, it's about agreement.
          *   Check 2 (Inner Damage): No.
          *   Check 3 (Reason): The reason is "we agreed." But Glaucon asks "Why keep the agreement when you can break it without cost?"
          *   *Verdict:* Dodge. It pushes the consequence to "society collapses," which is a consequence Glaucon brackets.
      *   *Paper 2 (Constituted Self/No me left):*
          *   Check 1: No.
          *   Check 2: Says "no me left."
          *   Check 3: This is metaphysical. Does it answer *why be just*? It says "unjustice destroys the agent."
          *   *Verdict:* Borderline. In the Super Ring variant, the ring *prevents* the change. So if the paper says "The act changes you," the Super Ring says "No it doesn't." If the paper says "The act *is* a different person," that's a rejection of the premise. Refer to Prof.
      *   *Paper 3 (Guilt/Knowledge eats you):*
          *   Check 1: No.
          *   Check 2: Yes ("know what you'd done," "eat you alive").
          *   *Super Ring Check:* The variant explicitly removes memory/guilt.
          *   *Verdict:* Hard No (for Super Ring). Pass (for Standard Glaucon, maybe, though Glaucon tries to bracket psychological happiness). Actually, Glaucon grants the unjust man has the *reputation* of justice, implying he doesn't feel guilt. So even in Standard, this is shaky. In Super Ring, it's definitely out.

  6.  **Refining the Procedure for Non-Philosophers:**

      *   Avoid "Premise," "Conclusion," "Normative."
      *   Use "The Story," "The Cost," "The Reason."
      *   Make the "Refer to Prof" category clear. TAs shouldn't fail a brilliant philosophical objection; they should kick it up.

  7.  **Addressing the "Hard Cases":**

      *   *Rejecting Framing:* Needs a specific "Escape Hatch" step. If the student argues the question is impossible, don't fail them, refer them.
      *   *Brilliant Wrong Answer:* The procedure *must* fail them on the "Answer Glaucon" metric, even if they get an A for writing. The prompt asks "Does this answer Glaucon?" not "Is this good?" I need to make sure the TAs know they can mark "No, doesn't answer" but still give a high grade for quality. Wait, the prompt says "decides one question: does this paper actually answer Glaucon." Okay, stick to that binary.

  8.  **Final Review against Constraints:**

      *   *No jargon?* Check.
      *   *Honest about gut?* Check.
      *   *Super Ring compatible?* Check.
      *   *Sample papers analyzed?* Check.
      *   *Variant evaluation?* Check.
      *   *Limitations?* Check.

  9.  **Drafting the Content (Mental or Scratchpad):**

      *   *Procedure:* 4 Steps. 1. External Consequences. 2. Internal Consequences (Guilt/Habit). 3. The "Why" (Act vs Result). 4. The "Impossible Question" Check.
      *   *Variant Evaluation:* It's logically sound but anthropologically thin. It forces a specific type of answer (Kantian/Platonic Form) that might be beyond intro students.
      *   *Samples:* 1 is Contractarian (fails). 2 is Metaphysical (Refer). 3 is Psychological (Fails Super Ring).
      *   *Limitations:* Can't judge quality, can't judge deep metaphysical objections, can't replace TA training.

  10. **Polishing the Tone:**
      *   Needs to be respectful of the TAs' time and skill level.
      *   Needs to be direct with the Professor about the "Super Ring" implications.
      *   Needs to be structured clearly.

      *(Self-Correction during drafting)*: I need to be careful with Paper 2. If the self is constituted by choices, and the ring leaves no trace, does the choice still constitute the self *in the moment*? If the ring erases the *trace*, does it erase the *constitution*? The prompt says "no change in what you later want, no self-knowledge." This implies the constitution *doesn't* happen. So Paper 2 argues against the variant's physics. That's a "Refer."

      *(Self-Correction on Procedure)*: Make sure the "Pass/Fail/Refer" is explicit at every step.

      *(Self-Correction on Honesty)*: Explicitly label the "Gut Check" steps.

      *(Self-Correction on Variant)*: Be honest. It makes the prompt almost impossible for an intro student to answer successfully unless they stumble into "Justice is like health" (Plato's actual answer) or "Duty for duty's sake."

      Let's assemble.

      *Step 1: The "Bad Stuff Happens" Test.* (Consequences).
      *Step 2: The "You Feel Bad" Test.* (Psychological Consequences).
      *Step 3: The "Because It's Just" Test.* (Intrinsic).
      *Step 4: The "Bad Question" Test.* (Meta-ethics).

      Okay, ready to write.

      *Wait, one more thing:* The prompt asks for "where the procedure stops with a hard no, and where it hands the paper to me." I need to make sure the "Refer" conditions are clear.

      *Also:* "Tell me whether my variant is a fair sharpening... or rigged." I need a dedicated section for this.

      *Also:* "Tell me what the procedure can't do." Dedicated section.

      Okay, structure is solid. Proceeding to generate response.

      *Wait, checking Paper 3 again.* "You'd have to live with yourself afterwards... knowledge would eat you alive."
      Standard Glaucon: Glaucon tries to bracket this by saying the unjust man has the *reputation* of justice. He implies the unjust man is happy. But does he feel guilt? Glaucon assumes the unjust man is *successful*. Usually, guilt is considered a consequence.
      Super Ring: Explicitly removes memory/guilt.
      So Paper 3 is a "No" for Super Ring. For Standard, it's debatable (is guilt a natural consequence or a wage of justice?). Glaucon says "strip away everything except justice itself." Guilt feels like a consequence. I will classify it as a "No" for both, but explain why.

      *Wait, checking Paper 1 again.* "In a world where everyone had a ring... I keep my agreement."
      This is Hobbesian. Glaucon's challenge is about the *individual* with the ring. If everyone has it, it's a different scenario (State of Nature). But the student says "I keep my agreement even with the ring on." Why? Because if everyone breaks it, we are worse off. But if *I* break it and *others* keep it, I am better off (Free Rider). Glaucon asks "Why not be a free rider?" The paper answers "Because contracts are good." Glaucon says "I know contracts are good, why follow them when you can cheat?"
      So Paper 1 is a "No."

      *Wait, checking Paper 2 again.* "The self is constituted by its choices... person who comes out... is someone else."
      This argues that the *act* of injustice changes the ontology of the self.
      Super Ring: "leaves no trace on you... no change in what you later want."
      If the paper argues the self *is* the choice, and the ring prevents the change, the paper is arguing the Ring is impossible or the premise is wrong.
      This is a "Refer." It's a metaphysical objection to the thought experiment.

      Okay, plan confirmed.
      Wait, one detail: "I tell them in lecture that he's stripped away reputation, consequences, and the wages of justice."
      So the TAs know this. The procedure should reinforce this lecture content.

      Let's write.
answer: |-
  Here is the procedure, the evaluation of your variant, the analysis of the three sample papers, and the limitations.

  ### Part 1: The "Glaucon Check" Procedure

  **Instructions for TAs:** Read the paper's main argument. Run these four checks in order. As soon as you hit a **STOP**, mark the result and do not proceed. If you reach the end, mark **PASS**.

  **Step 1: The "Bad Things Happen" Check**
  Look for the reason the student gives for being just. Does the reason rely on something bad happening to the person *later* if they are unjust?
  *   *Keywords to watch for:* Caught, punished, reputation, trust, society collapses, people find out, future suffering, loss of friends, legal trouble.
  *   **PASS:** The paper does not mention negative outcomes or consequences.
  *   **STOP (NO):** The paper argues you should be just to avoid punishment, loss of reputation, or social chaos.
  *   **REFER TO PROF:** The paper argues that "society collapsing" is not a consequence but a logical impossibility of the act itself (rare).

  **Step 2: The "Feel Bad / Change Bad" Check**
  Does the reason rely on the person feeling guilty, becoming a worse person, losing their integrity, or damaging their soul/character?
  *   *Keywords to watch for:* Guilt, shame, pride, habit, character, integrity, "live with yourself," "become the kind of person," psychological damage, self-respect.
  *   **PASS:** The paper does not mention psychological states or character changes.
  *   **STOP (NO):** The paper argues you should be just to avoid guilt, shame, or becoming a corrupt person.
  *   **STOP (NO) [Super Ring Only]:** If you are grading for the **Super Ring** variant, any argument about memory, guilt, or habit is an automatic **NO**, because the Ring removes those.
  *   **REFER TO PROF:** The paper argues that "feeling guilt" is not a feeling but a factual recognition of error (e.g., "It's not that I feel bad, it's that I am in error").

  **Step 3: The "Because It's Just" Check (The Gut Check)**
  Look at the main reason left over. Is the reason for acting located *in the act itself*, or in what the act *gets you*?
  *   *The Test:* Ask yourself: "If this act produced zero results—no good feelings, no bad feelings, no future benefits, no changes to the world—would the student still say do it?"
  *   **PASS:** The student argues the act is right *because it is just*, similar to how health is good for the body even if it doesn't win you a race. (See Limitations below).
  *   **STOP (NO):** The student argues the act is right because it achieves a goal (even a noble goal like "harmony" or "rationality") that is separate from the act.
  *   **HONESTY NOTE:** This step is 80% gut feeling. You are looking for a shift from "Justice is a *tool*" to "Justice is a *state*." If you aren't sure, **REFER TO PROF**. Do not guess here.

  **Step 4: The "Bad Question" Check**
  Does the paper argue that Glaucon's challenge is impossible, incoherent, or based on a false assumption about human beings?
  *   **PASS:** The paper accepts the challenge and tries to answer it.
  *   **REFER TO PROF:** The paper argues the question itself is flawed (e.g., "Humans cannot act without motives," or "The Ring is metaphysically impossible").
  *   **STOP (NO):** The paper ignores the challenge entirely to talk about a different topic (e.g., "Glaucon is mean," or "Here is a history of rings").

  ***

  ### Part 2: Evaluation of Your "Super Ring" Variant

  **Is it a fair sharpening or rigged?**

  It is a **fair sharpening logically**, but it is **pedagogically rigged** for an intro class.

  1.  **Logically Fair:** Glaucon's goal is to isolate justice from its *consequences*. In standard psychology, guilt, habit, and memory are consequences of action. By stipulating they don't exist, you are simply enforcing Glaucon's isolation requirement more strictly. You are forcing the student to find a reason that is neither external (punishment) nor internal (psychology).
  2.  **Pedagogically Rigged:** You have removed the two most accessible ways intro students understand value: *outcomes* (consequentialism) and *character* (virtue ethics). You are leaving them with only *duty* (deontology) or *Platonic metaphysics* (justice as health of the soul, distinct from feeling).
      *   Most 19-year-olds do not have the vocabulary to argue for intrinsic value without slipping into "but it makes me a better person" (which you've banned) or "but it's my duty" (which sounds like "I'll feel guilty if I don't," which you've also banned).
      *   **Result:** You will get a lot of "Hard No" papers that are actually thoughtful attempts, because the only surviving answers are highly technical.

  **Verdict:** Keep it, but acknowledge that a "No" on the Super Ring version does not mean the student failed to think ethically; it means they failed to think *Kantially or Platonically*.

  ***

  ### Part 3: Running the Procedure on the Three Samples

  **Paper 1: The Social Contract ("In a world where everyone had a ring...")**
  *   **Step 1 (Bad Things):** **STOP (NO).**
      *   *Reasoning:* The argument relies on "we'd all be worse off." This is a consequence (social collapse/mutual harm). Glaucon grants that injustice is bad for society; he asks why *I* shouldn't do it if *I* gain. The "agreement" only holds if there is enforcement. If the Ring removes enforcement, the agreement is just words.
      *   *TA Note:* This is the "Free Rider" problem. The paper answers "Why have laws?" not "Why follow them when invisible?"

  **Paper 2: The Constituted Self ("The self is constituted by its choices...")**
  *   **Step 2 (Feel/Change):** **REFER TO PROF.**
      *   *Reasoning:* This is a metaphysical objection. The student is arguing that the "Super Ring" is impossible because an act *necessarily* constitutes the self. If the Ring prevents that, the Ring prevents the self from existing.
      *   *TA Note:* This isn't a dodge; it's a counter-premise. But it requires you to judge if "constituted self" is a valid philosophical move or just word salad. Kick it up.
      *   *Super Ring Specific:* If you must grade it yourself: On the Super Ring, this is a **NO**, because the prompt stipulates "no change in what you later want/no self-knowledge." The student is denying the stipulation.

  **Paper 3: The Guilt/Knowledge ("You'd have to live with yourself...")**
  *   **Step 2 (Feel/Change):** **STOP (NO).**
      *   *Reasoning:* "Knowledge would eat you alive" is a psychological consequence.
      *   *Super Ring Specific:* This is a definitive **NO**. Your variant explicitly removes memory and self-knowledge of the act. The paper argues against the physics of your thought experiment.
      *   *Standard Glaucon:* Still a **NO**. Glaucon specifies the unjust man has the *reputation* of justice. He implies the unjust man is happy and honored. Arguing "he would feel guilty" is arguing against Glaucon's setup (that the unjust man gets away with it perfectly).
      *   *TA Note:* This is the "Beautiful Dodge." It sounds profound, but it answers "Why is guilt bad?" not "Why be just when guilt is removed?"

  ***

  ### Part 4: Hard Cases & Limitations

  **Handling the "Reject the Framing" Paper**
  *   *Scenario:* A student writes, "Glaucon assumes justice is a choice between two options, but justice is the only rational state, so the choice is illusory."
  *   *Procedure:* This hits **Step 4 (Bad Question)** -> **REFER TO PROF**.
  *   *Why:* A TA cannot distinguish between "deep philosophical rejection of premises" (valid) and "student didn't read the prompt" (invalid). You need to read these.

  **Handling the "Brilliant Wrong Answer" Paper**
  *   *Scenario:* A student writes a moving, logical defense of Virtue Ethics ("Justice makes you a better human"), which Glaucon explicitly ruled out.
  *   *Procedure:* This hits **Step 2** -> **STOP (NO)**.
  *   *Instruction to TAs:* You must mark "Does Not Answer Glaucon" even if the writing is A-level. You can (and should) add a comment like: "This is a beautiful argument for Virtue Ethics, but Glaucon asked us to imagine a world where character changes don't happen. You answered the wrong question."
  *   *Why:* The procedure's job is fidelity to the prompt, not grading writing quality.

  **What This Procedure Cannot Do**
  1.  **It cannot distinguish "Intrinsic Value" from "Hidden Consequences."**
      *   *Example:* If a student says "Justice is like health," Step 3 (Gut Check) relies on the TA to know if "health" is being used as a consequence (feeling good) or a state (functioning well). TAs will struggle here. **Mitigation:** Tell TAs: "If you aren't sure if 'health' means 'feeling good' or 'working right', Refer to Prof."
  2.  **It cannot identify sophisticated consequentialism.**
      *   *Example:* "If I act unjustly, I undermine the concept of justice universally" (Kant's Categorical Imperative phrased consequentially). TAs will likely flag this as "Society Collapses" (Step 1 NO). It might be a **REFER** case.
  3.  **It cannot replace the 90-minute training.**
      *   TAs need to see *examples* of Step 3. The "Gut Check" is where they will drift. You need to provide them with one "Pass" example and one "Fail" example for Step 3 specifically during that 90 minutes.
  4.  **It cannot handle the "Super Ring" metaphysics.**
      *   As seen in Paper 2, your variant invites metaphysical objections. The procedure treats these as "Refer," which means *you* will be reading all the most interesting papers. Be prepared for that workload spike.

  **Final Advice:**
  The procedure works best as a **filter**, not a **grader**. Use it to sort papers into "Clear Pass," "Clear Fail," and "Prof Needs to See." If you force TAs to make the final call on the "Gut Check" (Step 3) without philosophy training, you will get inconsistent results on the papers that matter most.
