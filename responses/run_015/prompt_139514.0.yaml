  8.  *(Final Polish)*: Ensure the distinction between *esse est percipi* (to be is to be perceived) and the film's *esse est teletransmissum* (to be is to be televised) is clear. The gap between those two is where the philosophy lives.

  **(Self-Correction Note):** Wait, I need to be careful about the "Off-Air" scene. In the film, when Truman escapes the basement, the broadcast cuts to black for the *global audience*, but the control room still sees him (via hidden cameras in the storm). So the world is still perceived by *someone* (Christof/Crew). Does this support Berkeley? Yes, because *someone* still perceives it. The User's argument relies on the *global audience* losing the feed. But Christof still sees. I need to nuance this. The "Off-Air" test fails for Berkeley because Christof *keeps watching*. The only moment nothing is perceived is... actually, is there one? Maybe when Truman is in the boat and Christof loses track? No, Christof says "He's hiding."
  *Correction:* The strongest point for the User is the *ending*. When Truman walks out, the cameras stop. Does he cease to exist? The film implies he continues. That is the anti-Berkeley move.
  *Re-evaluating Scene 2:* The "Off-Air" moment for the *bar patrons*. They stare at static. But Christof still watches. So the Friend can argue "God (Christof) still perceives." I need to find a scene where the *lack* of perception causes *ontological instability* or where the *finite* nature of the perceiver breaks the Idealism.
  *Better Scene 2:* The Storm Scene. Christof tries to kill Truman. The world becomes hostile. This shows the "perceiver" is not benevolent (unlike Berkeley's God). This attacks the *quality* of the Idealism, not the existence.
