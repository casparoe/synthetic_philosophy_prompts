          *   *Shift:* From Epistemology/Ontology (What exists?) to Ethics/Politics (Who owns my existence?).
          *   *Refinement:* It's not just "trust in other perceivers," it's "consent of the perceived." Berkeley's God is benevolent (guarantees stability). Christof is malevolent (guarantees control). The horror isn't that the tree vanishes; it's that the tree is a prop.

      *   **Sloppiness Check:**
