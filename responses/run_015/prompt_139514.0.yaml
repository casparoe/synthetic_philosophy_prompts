          *   *Scene 3 (The Synthesis/Ending):* **The Exit Door.** Christof speaks from the "heavens" (God role). Truman bows and leaves. We see black. We don't see the "real world." This leaves the ontological status ambiguous but affirms the *moral* reality of choice.

      *   **Addressing Question 3 (The User's Insight on Trust/Surveillance):**
          *   *Validation:* This is a genuine insight, not just a metaphor.
