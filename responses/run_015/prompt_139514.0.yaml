          *   *User's Sloppiness:* Assuming the "real world" outside is necessarily mind-independent Realism. It could just be a bigger studio (sequel bait, but philosophically possible). Also, assuming film *can* show unperceived reality (it can't).

  5.  **Refining the Tone:**
      *   Needs to be academic but accessible (for a film night).
