      *   **The User's Position:** The friend is cherry-picking. Berkeley's guarantor is God (infinite, infallible), but the Show's guarantor is finite/fallible (audience/crew). The ending (Truman leaving) implies a *real* outside, which contradicts Berkeley (swapping ideas for ideas). The film asserts unperceived truths (Lauren's warning, the father's staging) for the deception to matter morally.
      *   **The Task:** Determine who is more right, identify sloppiness in both arguments, provide a reading that respects both film and philosophy, and answer three specific questions:
