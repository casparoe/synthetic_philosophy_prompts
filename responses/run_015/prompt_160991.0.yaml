  2.  **Deconstruct the Liberal State Analogy:**
      *   *Core Claim:* AI should be neutral like a liberal state (framework only, no thick conception of the good).
      *   *Goal:* Dissolve "whose values?" into procedure.
      *   *Critique:* The analogy hides assumptions about boundaries, coercion, and feedback loops.

  3.  **Drafting the Correspondence (Mapping):**
      *   *Demos:* Citizens vs. Affected parties. (Broken - no clear boundary/consent).
      *   *Territory:* Geography vs. Digital context/Deployment. (Strained - contexts overlap fluidly).
      *   *Citizenship:* Legal status vs. User account/Access. (Strained - affected non-users exist).
      *   *Elections:* Voting vs. Feedback/RLHF/Market share. (Broken - no formal authorization).
      *   *Monopoly on Coercion:* State force vs. Model influence/output control. (Strained - influence isn't force, but can be binding in contexts).
      *   *Coercion-Justification:* Legitimacy vs. Safety/Alignment. (Strained - neutrality justifies force, safety justifies restriction).
      *   *Constitutional Essentials:* Rights vs. Safety/Security constraints. (Clean - both are hard constraints).
      *   *Public Reason:* Justification to all vs. Explainability/Transparency. (Strained - models don't reason publicly in the same way).
      *   *Public/Private:* State sphere vs. Model sphere. (Strained - model permeates private life).
      *   *Revision of Ends:* Autonomy vs. Personalization/Prompting. (Clean - users can steer within limits).

  4.  **Identifying Imported Features:**
      *   *Bounded Demos:* State has clear citizens; AI affects everyone. (Doing work: limits scope of accountability).
      *   *Coercion:* State forces compliance; AI suggests/influences. (Doing work: lowers bar for justification).
      *   *Stability:* State institutions persist; AI updates rapidly. (Doing work: assumes static framework).
      *   *Territorial Exclusivity:* State rules one land; AI rules overlap. (Doing work: avoids conflict resolution).

  5.  **Evaluating Load-Bearing Disanalogies:**
      *   *Demos/Boundary:* Fatal. If you can't define who counts, you can't define neutrality *to whom*.
      *   *Feedback Loop:* Serious. AI shapes preferences, violating the "leave ends alone" premise.
      *   *Disaggregation:* Contained. Technical possibility doesn't solve normative default.
      *   *Thin Overlap:* Serious. Intersection might be empty or biased.
      *   *Neutrality vs. Aggregation:* Fatal. Aggregation *chooses* values; neutrality claims not to.

  6.  **Auditing the Conclusion:**
      *   *Conclusion:* "We never have to answer whose values."
      *   *Verdict:* No. It survives only if you ignore the affected non-users and the shaping of preferences.
      *   *Premise Carried:* That "procedure" (aggregation/personalization) substitutes for "substance" (defining the good).

  7.  **Adjudicating Options:**
      *   *Option 1 (Thin Neutrality):* Current approach. Fails on the "empty overlap" and "shaping" critique.
      *   *Option 2 (Stake-weighted):* Hard to measure "affectedness." Good in theory, hard in practice.
