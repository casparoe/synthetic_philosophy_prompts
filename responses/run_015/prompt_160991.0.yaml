      *   *Support:* Yes, it moves the value question to the rule-selection question.
      *   *Problem:* Still needs a demos for the constitutional moment.
      *   *Repair:* Define the "constitutional convention" as a diverse stakeholder panel + empirical impact assessment, not just users.

  9.  **Working Cases:**
      *   *Case 1 (Diet/Animals):* Neutrality says "user chooses." Runs out on default settings. Preferred (Opt 3) sets a meta-rule (e.g., "minimize suffering unless specified") based on the constitutional agreement.
      *   *Case 2 (Workplace Policy):* Neutrality says "manager chooses." Runs out on employee consent. Preferred (Opt 3) requires policy to pass the "constitutional floor" (rights of affected non-users).

  10. **Better Analogy:**
      *   *Candidate:* Professional Fiduciary (Trustee/Physician).
      *   *Why:* Duty of care to the beneficiary (user) *and* non-harm to third parties. Acknowledges power asymmetry without claiming sovereignty.
      *   *Licenses:* Paternalism for safety, confidentiality, prioritizing beneficiary interest within bounds.
      *   *Loses:* Democratic legitimacy (which the state analogy falsely claimed anyway).

  11. **Residual Questions:**
