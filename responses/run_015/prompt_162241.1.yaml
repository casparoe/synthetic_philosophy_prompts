prompt: |-
  Hey — I'm in a tiny reading group that's been slogging through decision theory (Newcomb's problem, the counterfactual mugging thing, the blackmail cases), and I've realized my gut reactions don't add up to anything I could actually state out loud. I'm not after a tour of the standard theories — I've been told the labels are roughly causal / evidential / functional, and half the stuff I read just announces that one of them "pays" as if that settles it. What I want is the principle underneath, said in plain terms, that fits my verdicts, plus an honest account of which of my verdicts it can't fit. Here's my list, going purely by feel:

  1. Classic mugging: a predictor ran a full simulation of me before flipping a fair coin; if heads he'd have handed me $10,000 provided the simulation agreed to pay, if tails he asks me now for $100; the coin came up tails. I pay.
  2. Same setup, except he tells me there was no simulation — he predicted me from an old brain scan plus a statistical model that's right about 90% of the time, and he'd have paid out on that prediction. I don't pay.
  3. The blackmail letter: he says he's got embarrassing photos, that he sent the letter iff he predicted I'd pay, that if he'd predicted I wouldn't he'd have destroyed the photos and I'd never have heard from him, and that whether the photos go out was already decided by whether the letter went out. I don't pay.
  4. Plain old blackmail: he'll release the photos iff I don't send $100. I pay — the photos would cost me far more than that.
  5. Mugging with the coin flipped after I answer: heads I get $10,000, tails he keeps the $100 I hand over. I pay, obviously.
  6. Mugging with a garbage ratio: simulation predictor, $10,000 on heads, but he demands $50,000 in the tails branch. I refuse.
  7. Control case: he flipped the coin himself, disbursed the money on the flip alone with no prediction involved, and is now asking me for $100 out of curiosity, saying my answer changes nothing. I refuse.
  8. For calibration: I take only the opaque box in Newcomb's problem, and in the case where a genetic lesion causes both a taste for smoking and throat cancer with no causal link from smoking to cancer, I smoke.

  The two that keep bothering me are (1) and (2). My friend Marco says they're literally the same case and that my different reaction is just an artifact of how vivid the simulation story is; if he's right, which of the two verdicts should flip, and what does the surviving version say about (3)? The rough principle I've been trying on is something like: pay exactly when what the predictor is reading off is (a) tied tightly enough to what I decide now and (b) sits upstream of a benefit rather than a threat — but I can't tell whether clause (a) is doing real work or is just a fancy way of restating my hunch that simulations matter and brain scans don't. Test that against the list and repair it, or replace it. Then tell me what it says about two cases I genuinely can't call: (A) simulation predictor, coin came up tails, $100 demand, but the money on heads goes to a stranger's medical bills rather than to me, and I'm not especially self-sacrificing; (B) he ran a hundred simulations of me, ninety-seven refused, so he predicted "refuse" and paid out nothing, and now he asks me for $100 anyway, promising that if I pay he'll run the whole setup again with a fresh simulation of me as I am right now — so paying buys nothing this round but would matter next round.
