          *   *Decision Theory nuance:* FDT doesn't care *who* gets the money, only that the algorithm maximizes utility. If Utility(stranger) > Cost(self), Pay.
      *   *Case B (Iterated/History):* 97 refused, predictor expects refuse, asks anyway. Paying now buys nothing *this* round, but signals for *next* round.
