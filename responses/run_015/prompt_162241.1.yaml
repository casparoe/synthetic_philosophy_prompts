answer: |-
  This is a great spot to be in. You've outgrown the labels ("I'm an FDT agent") but haven't yet built the machinery to replace them. That feeling of "slogging" usually means you're bumping against the difference between *mathematical equivalence* and *psychological mechanism*.

  Here is the principle that fits your verdicts, the honest repair job on the conflict Marco pointed out, and the application to your new cases.

  ### The Principle: "Algorithmic Control"

  Your gut is tracking a specific kind of leverage. You aren't asking "Does my action cause the outcome?" (Causal) or "Does my action correlate with the outcome?" (Evidential). You are asking:

  > **"Is the predictor's payoff decision based on the *output of my decision algorithm*, and does outputting 'Pay' here make that algorithm more profitable across the scenarios it generates?"**

  Let's break that down into plain English rules that match your list:

  1.  **The Source Rule:** You only "pay" for correlations if the correlation exists because the predictor is modeling *your reasoning process*. (This covers Simulations, Newcomb's Predictor, and accurate Brain Scans of decision-making). You ignore correlations caused by external common causes (like the Smoking Lesion gene).
  2.  **The Direction Rule:** You only "pay" if being the *type of agent* who pays creates the opportunity for the benefit. You refuse if being the *type of agent* who pays creates the opportunity for the threat.
  3.  **The Expectation Rule:** You only pay if the expected value across *all* branches (the ones where you get money and the ones where you lose money) is positive. (This handles your Case 6 refusal).

  ### The Marco Conflict: Case 1 vs. Case 2

  Marco is technically right about the math, but you are right about the intuition. However, to keep your principle consistent, **you must flip your verdict on Case 2.**

  Here is why:
  In Case 1 (Simulation), you pay because you recognize that "You-in-the-simulation" and "You-in-reality" are running the same code. The predictor pays out based on what that code outputs.
  In Case 2 (Brain Scan), if the model is 90% accurate at predicting your *decision*, it is effectively running a noisy simulation of your code.

  If you say "Pay" to the Simulation but "Don't Pay" to the Scan, you are making a distinction based on *hardware* (computer vs. brain) rather than *logic*. If you stick with "Don't Pay" on Case 2, you undermine Case 1. Why? Because no simulation is perfect. Every simulation is just a "statistical model" of you with higher fidelity. If you refuse the 90% accurate model, at what percentage do you start paying? 99%? 99.9%? That's a slippery slope that turns a logical principle into a magic threshold.

  **The Repair:** Flip Case 2 to **Pay**.
  **The Cost:** This feels wrong because the brain scan feels like "fate" or "biology" (like the Smoking Lesion) rather than "reasoning." You have to consciously tell yourself: *"This scan isn't reading my genes; it's reading my decision procedure. Therefore, I control it."*

  ### What This Says About Case 3 (The Blackmail)

  You said **Don't Pay** for Case 3, and **Pay** for Case 1. This is the crucial distinction that saves your theory from telling you to pay every blackmail threat.

  *   **Case 1 (Mugging):** The predictor creates a *benefit* (the $10,000) conditional on your algorithm saying "Pay." If your algorithm says "Pay," you unlock a world where money exists.
  *   **Case 3 (Blackmail):** The predictor creates a *threat* (the letter/photos) conditional on your algorithm saying "Pay." If your algorithm says "Pay," you unlock a world where blackmail exists.

  Your **Direction Rule** handles this. You want to be the algorithm that gets the Mugging payout. You *also* want to be the algorithm that doesn't get Blackmailed.
  *   In Mugging: Algorithm "Pay" $\to$ Rich World. Algorithm "Refuse" $\to$ Poor World. (Choose Pay).
  *   In Blackmail: Algorithm "Pay" $\to$ Blackmailed World. Algorithm "Refuse" $\to$ Safe World. (Choose Refuse).

  This explains why you Pay in Case 4 (Plain Blackmail). In Case 4, the threat *already exists*. The letter is already on the table. The prediction isn't determining *whether* you get blackmailed; your action determines *whether the photos release*. That's causal leverage, not algorithmic leverage.

  ### Testing the Principle on Your New Cases

  Here is how the "Algorithmic Control" principle handles the two cases you're stuck on.

  **Case A: Altruistic Mugging**
  *Setup:* Simulation predictor, tails came up, $100 demand. Heads payout goes to a stranger's medical bills, not you.
  *Verdict:* **It depends entirely on your utility function.**
  *Reasoning:* Decision theory doesn't tell you *who* to care about; it tells you how to get what you care about.
  *   If you are purely selfish (you value only your money): **Refuse.** Your algorithm outputting "Pay" costs you $100 and buys nothing *you* value. The stranger's benefit is irrelevant to your utility function.
  *   If you care about the stranger (even a little): **Pay.** If the $10,000 medical aid is worth more to you than $100 is costly, the algorithm "Pay" maximizes your utility across the branches.
  *   *Note:* Many people feel a "moral obligation" here. In decision theory terms, that just means your utility function includes other people's welfare. The *decision rule* remains the same: Maximize expected utility across the logical branches.

  **Case B: The Iterated Reputation**
  *Setup:* 97 sims refused. Predictor expects refusal. Asks for $100 now. Paying buys nothing *this* round, but he promises to run a fresh sim of "you as you are right now" next time.
  *Verdict:* **Pay.**
  *Reasoning:* This looks like Case 2 (Statistical), but with a time component.
  *   If this were truly a one-off game with no future, you would Refuse (sunk cost, prediction already made).
  *   But the prompt says paying "would matter next round." By paying now, you are updating the data the predictor uses for the *next* simulation. You are effectively training the predictor.
  *   Your current decision becomes part of the "decision algorithm" the predictor will model next time. If you refuse now, the next simulation sees "Refuser" and doesn't pay out. If you pay now, the next simulation sees "Payer" and pays out. You are paying $100 to buy a profitable algorithm for the next interaction.

  ### Where Your Verdicts Might Break (The Honest Account)

  You asked for an account of which verdicts this principle can't fit. Here is the friction point:

  **The "Tightness" Problem (Case 2 revisited)**
  You originally wanted to Pay for Simulations but not Brain Scans. The principle forces you to Pay for both.
  *   *The Friction:* It feels like magic to think your current choice influences a past brain scan.
  *   *The Hard Truth:* If you accept Newcomb's Problem (One-Box), you have already accepted this magic. The box was filled yesterday. Your choice today doesn't causally change the money in the box. It only correlates. The Simulation story just makes the correlation feel more "mechanical."
  *   *The Failure:* If you cannot bring yourself to Pay in Case 2 (Brain Scan) even after this explanation, then your principle isn't "Algorithmic Control." It's "Simulation Intuition." And that is not a robust principle; it's a bias toward sci-fi mechanisms. If you hold that line, you are effectively a Causal Decision Theorist who makes an exception for Newcomb because it's a famous puzzle, but you don't have a unified theory.

  **The "Threat" Ambiguity (Case 3 vs 4)**
  Your principle distinguishes Mugging (Benefit) from Blackmail (Threat). But reality is messy.
  *   *The Friction:* What if the blackmailer says, "I predicted you'd pay, so I *didn't* take the photos to the police, but I will if you don't pay me"? Is that a benefit (keeping photos private) or a threat (release to police)?
  *   *The Failure:* The line between "creating an opportunity for gain" and "creating an opportunity for loss" is sometimes just framing. Your gut might wobble on cases where the "status quo" is ambiguous. The principle requires you to define the "default world" (what happens if the predictor predicts 'Refuse'). If you can't agree on the default, the principle can't tell you whether to Pay.

  ### Summary Recommendation

  1.  **Adopt the "Algorithmic Control" Principle:** Act as if you control the output of the algorithm that predicts you.
  2.  **Flip Case 2:** Accept that accurate statistical prediction of your decision is functionally identical to simulation. Pay the $100.
  3.  **Keep Case 3 as Refuse:** Distinguish based on whether the correlation creates a *gain* (Mugging) or a *loss* (Blackmail).
  4.  **Accept the Magic:** Acknowledge that Case 1, 2, and Newcomb all require believing your choice "reaches back" to influence a prediction. If that feels too spooky, you have to give up One-Boxing in Newcomb. You can't have Newcomb without the Mugging.

  Your gut is actually more consistent than you think; it's just clinging to the "Simulation" story as a crutch. Drop the crutch, keep the logic.
