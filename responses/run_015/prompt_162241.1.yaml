      *   *Distinguishing Benefit vs. Threat:* It's not about "benefit" per se, it's about *which worlds are instantiated*. In Mugging, "Pay" makes the good world possible. In Blackmail, "Pay" makes the bad world actual (or rather, the existence of the threat depends on you being the type to pay).

