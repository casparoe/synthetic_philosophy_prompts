          *   *Verdict:* Fair simplification, but omits the "glut" option.

      *   *Claim 2 (Tarski):* Tarski's Undefinability Theorem states truth for a language $L$ cannot be defined *within* $L$ (if $L$ is sufficiently strong). He proposed a hierarchy (object language, metalanguage, etc.).
