prompt: |-
  I'm reading a short book on the logic of self-reference and I keep getting stuck on a passage that summarizes how the Liar paradox was "solved." I don't have the technical background to tell where the author is being careful and where they're just smoothing things over, and I'd rather not trust a popularizer's gloss on something this famous. I've come across the terms "fixed point" and "groundedness" in connection with Kripke, and I've heard of the "gap versus glut" distinction, but I don't really understand what any of these are doing, so if they matter to assessing this passage, please say so. Here is the passage, more or less as it reads:

  "Once you accept that every declarative sentence is either true or false, the Liar sentence — 'This sentence is false' — forces a contradiction, so the standard conclusion is that we must give up the idea that every sentence has a truth value. Tarski showed that the Liar proves there is no such thing as a consistent truth predicate, which is why he insisted that a language can only talk about the truth of the sentences of a lower language. Kripke's famous solution does what Tarski couldn't: by building the truth predicate into the language in stages, he shows that the Liar sentence is simply not true and not false — it is 'undefined' — and so the Liar is defused. The one remaining problem is that if you say 'the Liar is undefined,' a new sentence, 'This sentence is not true and not undefined,' seems to do the same damage, so this is usually taken to refute Kripke's approach and to show that the best we can do is accept that some sentences are defective and move on."

  I think the author is mostly on the right track, but I suspect at least one of these claims is doing more work than it should. Can you go through it claim by claim and tell me which parts a logician working on the Liar would accept, which are fair simplifications, and which are quietly wrong — and for the ones that are wrong, what the careful version of the claim is? I'm especially interested in whether the final claim, that the revenge sentence refutes Kripke and settles the matter, is actually a refutation or just a limitation of the theory, and whether the conclusions the author draws from the summary survive once the errors are corrected.
