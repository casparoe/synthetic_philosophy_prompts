answer: |-
  This is not a dumb question. It is, in fact, the central tension in the philosophy of model-based science, and you have correctly identified that the standard vocabulary (idealization, abstraction) often feels too static to capture the dynamic, context-dependent way scientists actually *judge* models.

  You are describing two distinct but related phenomena. The first is the performance degradation when adding realism. The second is the inconsistent normative evaluation of the same assumption across different contexts.

  Here is the breakdown of the existing philosophical landscape, why it feels insufficient, and a proposed term to capture the specific relational dynamic you are isolating.

  ### 1. The "Adding Truth Makes It Worse" Phenomenon
  You asked if there is a term for the failure mode where adding a true mechanism degrades prediction and understanding.

  **The Existing Framework: Levins' Trade-off**
  In ecology, this is canonically **Levins' Triangle** (1966). You cannot maximize Generality, Realism, and Precision simultaneously.
  *   **Why the realistic model fails:** It's not just "harder to solve." It is **parameter proliferation**. A "true" model requires estimating more parameters. In ecology, data is noisy. As you add realistic structure, your parameter uncertainty compounds. The model becomes **fragile**. The simple model is **robust** because it averages over the noise that the complex model tries (and fails) to resolve.
  *   **Philosophical Term:** **The Fragility of High-Fidelity Models**.
  *   **Why understanding drops:** This connects to **Angela Potochnik's** work (*Idealization and the Aims of Science*, 2017). She argues that understanding comes from isolating causal dependencies. A "true" model often buries the primary causal driver under a mountain of secondary true-but-irrelevant details. The simple model provides **explanatory transparency**; the complex model provides **ontological fidelity** at the cost of transparency.

  ### 2. The "Double Standard" of Assumptions
  This is the core of your frustration. Why is "identical individuals" a virtue in Paper A and a vice in Paper B?

  **The Existing Framework: Purpose-Relative Idealization**
  Philosophers like **Michael Weisberg** and **Angela Potochnik** argue that assumptions are not evaluated on truth, but on **explanatory relevance**.
  *   **The "How-Possible" vs. "How-Actual":** You mentioned this. If the goal is to show a mechanism *could* produce a pattern (how-possible), false assumptions are fine. If the goal is to show it *did* (how-actual), they are fatal.
  *   **Robustness Analysis:** Regarding your point about contradictory assumptions (perfect info vs. no info) both being accepted: This is **Robustness Analysis** (Weisberg, 2006). If Model A (assumption X) and Model B (assumption not-X) both yield Result Y, then Result Y is robust to assumption X. The assumption is deemed **irrelevant** to that specific output.

  **Why this feels unsatisfying:**
  You noted that "it depends on the purpose" feels like a hand-wave. The problem is that "purpose" is rarely defined rigorously in the paper. Reviewers sense the purpose intuitively and judge the assumption based on whether it aligns with their intuition of the **causal target**.

  ### 3. Coining the Term: Idealization Valence
  There is no single standard term that captures the *flip* you are describing—where the *same* distortion is virtuous in one context and vicious in another, based strictly on the model's explanatory target.

  I propose the term **Idealization Valence**.

  **Definition:**
  **Idealization Valence** is the context-dependent epistemic value of a false assumption, determined by the alignment between the distortion and the model's specific explanatory target.
  *   **Positive Valence:** The assumption distorts reality in a way that *isolates* the causal factor relevant to the modeling question. (e.g., Assuming identical individuals to isolate the effect of density dependence without confounding variation).
  *   **Negative Valence:** The assumption distorts reality in a way that *obscures* or *mimics* the causal factor relevant to the modeling question. (e.g., Assuming identical individuals when the question is specifically about the effect of variation on extinction risk).
  *   **Neutral Valence:** The assumption distorts reality but has no impact on the output of interest (Robustness).

  **Boundary Cases:**
  1.  **Idealization Valence vs. Error:** If the modeller leaves out realism because they forgot or didn't know, that is **Negligence** (Negative Valence by default). If they leave it out to isolate a mechanism, it is **Idealization** (Valence depends on the target). This answers your question about intent: Yes, it matters. It distinguishes a strategic simplification from a mistake.
  2.  **Idealization Valence vs. Friedman's Instrumentalism:** Friedman says assumptions don't matter if predictions work. Idealization Valence says assumptions *do* matter, but their value is relational to the *explanation*, not just the prediction. A model can predict well with Negative Valence assumptions (lucky cancellation of errors), but it will fail to provide understanding.
  3.  **The "Realism Penalty" Boundary:** When does adding realism flip the valence of the *model*? When the cost of parameter uncertainty outweighs the benefit of structural fidelity. This is the **Levins Threshold**.

  ### 4. Why the Inconsistency Persists
  You asked why the same person gives opposite verdicts depending on whose paper it is.

  This is **Model Pluralism** in practice, but executed poorly.
  *   In Paper A, the community agrees the question is "What is the general dynamic of this system?" (Requires **Minimalist Idealization**). The assumption has Positive Valence.
  *   In Paper B, the community agrees the question is "Why does this specific population behave anomalously?" (Requires **Causal Isolation**). The assumption has Negative Valence.

  The frustration arises because authors rarely explicitly state the **Explanatory Target**. They imply it. Reviewers infer it. If the reviewer infers a different target than the author intended, the Valence of the assumptions flips, and the paper gets rejected for "unrealistic assumptions" that were actually strategic idealizations.

  ### Summary for your Toolkit
  1.  **The Phenomenon:** **Idealization Valence** (The relational goodness/badness of a false assumption).
  2.  **The Performance Drop:** **The Fragility of Realism** (Levins' Trade-off + Parameter Uncertainty).
  3.  **The Contradiction:** **Robustness Analysis** (If contradictory assumptions yield the same result, the assumption is irrelevant to that result).
  4.  **The Fix:** When writing or reviewing, explicitly define the **Explanatory Target**.
      *   *Bad:* "We model this system."
      *   *Good:* "We model this system to isolate the effect of X, treating Y as noise."
      *   If Y is the noise, assuming Y is constant has **Positive Valence**.
      *   If Y is the signal, assuming Y is constant has **Negative Valence**.

  You aren't missing a concept; you are missing the explicit agreement on the *question* being asked. The assumption isn't true or false relative to the world; it is **adequate or inadequate relative to the query**.
