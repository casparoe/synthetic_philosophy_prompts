answer: |-
  Here are nine questions designed for a philosophy seminar context. They assume familiarity with Marxist terminology but press the specific vulnerabilities of a non-productivist, power-based framework.

  ### 1. The Transformation/Expropriation Question
  **Main Question:** In the standard account, the *what* of exploitation is surplus value, grounded in the labor theory of value. You are decoupling exploitation from surplus extraction and grounding it in the asymmetry of refusal power. If we abandon the labor theory of value, we lose the objective metric for what is being transferred from worker to capitalist. So, what is the actual *substance* being expropriated in your framework? Is it surplus labor-time, autonomy, or something else?

  **Follow-up (Keyed to likely "Discretionary Time" answer):** If you argue that what is expropriated is effectively "discretionary time" or "life-energy" rather than value, doesn't that secretly reintroduce a labor theory of account in disguise? If the metric is still time-based, you haven't escaped the transformation problem; you've just obscured the normative baseline for how much time *should* belong to the worker without a value theory to justify it.

  ### 2. The Over-Breadth Objection (Welfare State)
  **Main Question:** Your definition turns on who can refuse the conditions of social reproduction without facing destitution. Consider an unemployed person in a stringent welfare state: they cannot refuse the state's conditions (means-testing, work requirements) without facing destitution, and the state holds the asymmetry of power. On your definition, is the welfare recipient being *exploited* by the state? If not, what distinguishes this relation from the capitalist wage relation, given that the structural asymmetry of refusal is identical?

  **Follow-up (Keyed to likely "No Profit/Extraction" answer):** If you reply that it's not exploitation because the state isn't extracting a profit or surplus, you seem to be smuggling a productivist criterion back into a non-productivist definition. If exploitation is purely about power asymmetry and refusal, why does the *purpose* of that power (profit vs. administration) matter for the definition of exploitation itself?

  ### 3. Feedback-Loop Alienation
  **Main Question:** Marx's four forms of alienation generally involve an *externalization* or loss of the self to an object (the product, the machine, the market). Your concept of "feedback-loop alienation" in platform labor describes an *internalization* of the algorithmic gaze. Is this genuinely a fifth form of alienation, or is it merely alienation from "species-being" with extra technological steps? If it's the latter, does emphasizing the psychological internalization risk depoliticizing alienation into a matter of individual self-conception rather than material dispossession?

  **Follow-up (Keyed to likely "Distinct Fifth Form" answer):** If you insist it is a distinct fifth form, does this break the materialist basis of Marx's original taxonomy? Marx's forms are ontological consequences of wage labor; if this form is psychological and contingent on specific app interfaces, does it risk making alienation a contingent feature of *digital* capitalism rather than a structural invariant of *capitalism* as such?

  ### 4. The Empirical Deflection (Demarcation Problem)
  **Main Question:** You have previously suggested that objections regarding the measurement of "refusal power" are matters for empirical sociology, not philosophy. However, your central claim is a normative one about the injustice of structural asymmetry. If the existence of that asymmetry is purely an empirical variable, what is the specific *philosophical* work left for your theory to do? Put differently: if sociology discovers that workers in a specific sector actually *can* refuse work without destitution, does your philosophical claim about their exploitation vanish?

  **Follow-up (Keyed to likely "Materialist Grounding" answer):** If you argue that philosophy provides the normative framework while sociology fills the content, I need to know what could count as *philosophical* evidence against your view. If every counter-example is deflected as "empirically inaccurate," are you protecting the theory from falsification? What specific empirical finding would force you to abandon the philosophical claim, rather than just tweaking the sociological application?

  ### 5. Normative Foundations (Liberalism vs. Marxism)
  **Main Question:** By defining exploitation through the capacity to refuse without destitution, your normative baseline seems to be a form of negative liberty or freedom of exit. Traditional Marxism grounds the critique in the socialization of production and the collective appropriation of surplus. Does shifting the ground to "freedom to refuse" risk collapsing your critique into a radical liberalism? If the solution is simply equalizing the power to refuse, does that necessitate the abolition of capitalism, or just a robust universal basic income within it?

  **Follow-up (Keyed to likely "UBI is insufficient" answer):** If you argue that a UBI doesn't solve the problem because the structural relation remains, you are implicitly admitting that the *production relation* matters, not just the *reproduction constraint*. If the production relation matters, why did we discard the labor theory of value in the first place?

  ### 6. Class Agency and Leverage
  **Main Question:** In the productivist reading, the working class has leverage because they can stop production. In your "refusal power" reading, exploitation persists even if production continues, based on the threat of destitution. If exploitation is located in social reproduction rather than production, does the strike lose its primacy as a revolutionary tool? Where does the leverage for change come from if the bottleneck is subsistence rather than surplus generation?

  **Follow-up (Keyed to likely "Social Strike/Reproduction Strike" answer):** If you propose a "social strike" (refusing reproduction) rather than a labor strike, doesn't that fragment class composition? Workers in production have shared leverage; those struggling in reproduction (the unemployed, the care workers, the platform gig workers) have disparate vulnerabilities. How do they cohere into a "class" without the shared site of the factory?

  ### 7. Historical Specificity
  **Main Question:** A structural asymmetry in the power to refuse subsistence conditions existed in feudalism and slavery. A serf could not refuse the lord's land without starvation. What makes your definition specifically a critique of *capitalism* rather than a critique of hierarchical societies in general? If the mechanism is identical across modes of production, what is the specific historical target of your critique?

  **Follow-up (Keyed to likely "Form of Destitution" answer):** If you argue that the *form* of destitution is specific to capitalism (i.e., market dependence vs. direct coercion), aren't you reintroducing the market and commodity production as the key variables? If the market is the key variable, doesn't that bring us back toward the exchange and value relations you sought to bypass?

  ### 8. Linking Alienation to Exploitation
  **Main Question:** You present two main theses: the asymmetry of exploitation and the feedback-loop of alienation. How do these two mechanically connect? Does the internalization of algorithmic ratings serve to *sustain* the asymmetry of refusal by making workers less likely to exercise their power? If so, isn't the alienation merely an ideological superstructure designed to protect the exploitation?

  **Follow-up (Keyed to likely "Constitutive Connection" answer):** If you argue they are constitutively linked rather than base/superstructure, does that mean liberation requires psychological de-programming before structural change? If the worker doesn't *feel* alienated by the algorithm, does the exploitation persist with the same moral weight, or does your view make exploitation partially dependent on the worker's subjective experience?

  ### 9. The "Exit" Paradox
  **Main Question:** Your theory relies heavily on the "power to exit" as the metric of non-exploitation. But in a fully commodified society, exiting one employer usually means entering the market elsewhere. If the market itself is the source of the structural asymmetry (as you imply regarding social reproduction), is "exit" actually a coherent category? Is the problem that workers can't exit the *firm*, or that they can't exit the *market*?

  **Follow-up (Keyed to likely "Exit the Market" answer):** If the goal is the power to exit the market entirely (de-commodification), that requires a post-capitalist society. But if you use "ability to exit" as the *measure* of exploitation within capitalism, you are measuring capitalism by a post-capitalist standard. Doesn't this make the theory a utopian ethical critique rather than an immanent critique of capitalist political economy?
