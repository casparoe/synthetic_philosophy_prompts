      *   *Key Concept:* "Anticipation." Striking first.
      *   *Logic:* Fear $\rightarrow$ Insecurity $\rightarrow$ Preemptive Strike is rational.
      *   *Second Part:* "Also because there be some, that taking pleasure in contemplating their own power..." (Glory/Aggression).
