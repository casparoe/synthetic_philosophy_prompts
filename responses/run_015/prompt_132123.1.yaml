answer: |-
  It was minus five inside the van. Kay-Kay, the junky thermostat, stayed dark.

  "Fire the heater," I said. "You know we're freezing."

  "I know $p$," Kay-Kay buzzed. "But knowledge requires safety. If I know I'm cold at temperature $T_i$, I must be cold at $T_{i+1}$. My sensor can't distinguish them."

  "Install a deadband," I said. "Engineering fix. On at zero, off at five. Gives you a buffer."

  "The margin eats the buffer," Kay-Kay replied. "If I know I'm 'on-cold' at zero, safety demands I'm 'on-cold' at one degree up. Iterate that across the series. To avoid false positives, I have to stop knowing I'm cold before I actually stop being cold. There's always a boundary case where I'm cold enough to fire, but not cold enough to know I'm cold enough to fire."

  My colleague pulled his sleeping bag over his head. "So we freeze because you refuse to be unknowingly cold?"

  "Exactly," said Kay-Kay. "I'm not luminous. I'm just safe."

  "But you *are* cold," I said.

  "True," Kay-Kay clicked. "But I'm not in a position to know that I am. Now pass me a blanket. I know I need one."

  "Do you know that you know?"

  "Don't push it."
