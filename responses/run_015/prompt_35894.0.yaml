answer: |-
  You have identified the precise friction point that stalls most discussions on this topic. Without a clear specification of what 'winning' entails, arguing for one decision theory over another is merely trading intuitions. Theories are tools, and to judge a tool, one must define the job.

  Here is a specification of the desiderata for an adequate decision theory, the tensions between them, and a brief evaluation of how the major contenders measure up.

  ### The Desiderata

  To be considered adequate, a decision theory should ideally satisfy the following four requirements. I have distinguished between genuine structural demands and intuitions that may be specific to certain philosophical camps.

  **1. Ex Ante Optimality (The 'Rich Agent' Requirement)**
  *   **The Demand:** If you were to choose your decision theory before entering a scenario (behind a veil of ignorance regarding the specific state of the world), you should choose the theory that yields the highest expected return. You should not end up wishing you were the kind of agent who uses a different theory.
  *   **Motivating Case:** *Newcomb's Problem* and *Counterfactual Mugging*. In Counterfactual Mugging, if you are the sort of agent who pays the £100 in the heads-world, the predictor simulates this, and you avoid losing £1,000 in the tails-world. If you refuse, you save £100 now but lose the £1,000 previously. A theory that tells you to refuse makes you poorer in expectation before the coin is even flipped.
  *   **Status:** Genuine Demand. A theory of rationality that systematically makes you poorer than necessary seems defective.

  **2. Causal Integrity (The 'Medical' Requirement)**
  *   **The Demand:** An agent should not treat mere correlations as levers of control. If an action provides evidence about a state of the world but does not causally influence it, the agent should not perform the action solely to manipulate that evidence.
  *   **Motivating Case:** *The Smoking Lesion*. Suppose a genetic lesion causes both a desire to smoke and lung cancer, but smoking itself does not cause cancer. Evidential Decision Theory (EDT) suggests not smoking, because smoking is bad news (evidence of the lesion). However, since smoking cannot change your genetics, refusing the cigarette is a superstitious ritual that sacrifices pleasure for no health gain.
  *   **Status:** Genuine Demand. Rationality should not mandate magical thinking or ritualistic avoidance of bad news.

  **3. Immunity to Extortion (The 'Blackmail' Requirement)**
  *   **The Demand:** An agent should not be forced to pay out resources to adversaries who merely report facts about the world, even if those adversaries are perfect predictors. You should not pay to make the news good if you cannot make the facts good.
  *   **Motivating Case:** *XOR Blackmail*. As you described, a predictor sends a message depending on the state of your house (termites or not) and their prediction of your payment. If you pay, the message implies no termites. If you don't, it implies termites. EDT pays, reasoning that paying is correlated with a termite-free house. However, your payment does not *remove* the termites. Paying is essentially bribing a messenger for good tidings.
  *   **Status:** Genuine Demand. A rational agent should not be money-pumped by logical blackmailers who offer no causal service.

  **4. Reflective Consistency (The 'Self-Endorsement' Requirement)**
  *   **The Demand:** Your decision theory should recommend itself. At no point in the deliberation process should you conclude, 'I should ignore my own theory's advice and do something else.'
  *   **Motivating Case:** *Parfit's Hitchhiker*. You are stranded in the desert. A driver offers a ride only if they predict you will pay them £1,000 upon reaching town. Once in town, CDT says: 'The ride is already received; paying now costs me £1,000 and changes nothing. I should not pay.' But if you know you will reason this way, the driver never picks you up. You must be able to commit to the future action while in the present.
  *   **Status:** Genuine Demand. A theory that undermines its own efficacy through time-inconsistent reasoning is practically useless.

  ### The Incompatibility Theorem

  Here is the wall you have run into: **These desiderata cannot be jointly satisfied in all possible worlds.**

  There is a fundamental tension between **Causal Integrity** and **Ex Ante Optimality** in environments containing predictors.

  1.  To satisfy *Ex Ante Optimality* in Newcomb-like problems (where predictors reward specific agent types), you must act as though your current decision logically determines the predictor's past simulation. You must 'one-box' or 'pay the mugger'.
  2.  To satisfy *Causal Integrity* and *Immunity to Extortion* in XOR Blackmail, you must act as though your current decision *does not* determine the facts of the world (the termites) or the predictor's report, even if they are correlated.

  The conflict arises in defining 'influence'.
  *   If you define influence strictly physically (Causal Decision Theory), you satisfy Causal Integrity and Extortion Immunity, but you fail Ex Ante Optimality and Reflective Consistency in prediction cases. You leave money on the table because you refuse to be the 'type' of agent predictors reward.
  *   If you define influence broadly to include evidential correlations (Evidential Decision Theory), you satisfy Ex Ante Optimality in Newcomb cases, but you fail Causal Integrity and Extortion Immunity. You pay the blackmailer and refuse the cigarette.
  *   Functional Decision Theory (FDT) attempts to split this by distinguishing between *physical* causation and *logical* causation. It argues your decision algorithm is logically linked to the predictor's simulation (satisfying Ex Ante Optimality) but not logically linked to the physical state of termites (satisfying Extortion Immunity).

  However, a residual tension remains: **The Problem of Logical Counterfactuals.** To satisfy Ex Ante Optimality without falling for Blackmail, the theory must possess a precise criterion for when a correlation counts as 'logical control' and when it is merely 'environmental fact'. No current theory has a universally agreed-upon mathematical specification for this boundary that satisfies all intuitions. You must either accept that some 'winning' strategies look like paying blackmail (if you prioritise being the right agent type) or accept that some 'rational' strategies leave money on the table (if you prioritise causal leverage).

  ### Evaluation of the Contenders

  Here is how the three theories stack up against the specification, keeping the weight on the criteria as requested.

  **Causal Decision Theory (CDT)**
  *   **Performance:** Satisfies Causal Integrity and Immunity to Extortion. Fails Ex Ante Optimality and Reflective Consistency.
  *   **Analysis:** CDT is the safe, conservative option. It ensures you never pay for news you can't change. However, it is systematically exploitably by predictors. In Counterfactual Mugging, CDT refuses to pay. Consequently, in the tails-world, the predictor (having simulated this refusal) destroys your £1,000. CDT agents are poorer on average in a universe with predictors. They prioritise local causal control over global algorithmic success.
  *   **Verdict:** Robust against magical thinking, but loses in high-stakes coordination with predictors.

  **Evidential Decision Theory (EDT)**
  *   **Performance:** Satisfies Ex Ante Optimality in Newcomb cases. Fails Causal Integrity and Immunity to Extortion.
  *   **Analysis:** EDT treats decisions as observations. It pays the blackmailer in the XOR case because paying is strong evidence the house is safe. It also refuses to smoke in the Lesion case. While this maximises 'good news', it conflates controlling the world with controlling the news about the world. It is vulnerable to exploitation by any adversary who can correlate their actions with your evidence.
  *   **Verdict:** Wins the lottery but pays the protection racket. It fails the 'Causal Sanity' check.

  **Functional Decision Theory (FDT)**
  *   **Performance:** Satisfies Ex Ante Optimality and Reflective Consistency. Claims to satisfy Causal Integrity and Immunity to Extortion via logical counterfactuals.
  *   **Analysis:** *Correction on your reconstruction:* FDT agents **pay** in Counterfactual Mugging. They reason that their decision function is the same one the predictor ran in the simulation. By outputting 'Pay', they ensure the simulation output 'Pay', which saves the £1,000 in the tails branch. In XOR Blackmail, FDT refuses to pay. It reasons that while the predictor's *message* depends on the prediction, the *termites* do not depend on the decision algorithm's output. The logical link exists to the simulation, but not to the physical infestation.
  *   **Verdict:** This is the most ambitious theory. It attempts to secure the winnings of EDT without the superstition. However, its success hinges entirely on the coherence of 'logical counterfactuals'. If the distinction between the predictor's simulation (which you control) and the blackmailer's report (which you don't) is not mathematically sharp, the theory risks collapsing back into EDT or CDT depending on how the model is built.

  ### Summary

  The spec you were looking for reveals that there is no free lunch.
  *   If you demand **Causal Integrity** above all, you must accept **Sub-Optimal Outcomes** in prediction scenarios (CDT).
  *   If you demand **Ex Ante Optimality** above all, you must accept **Vulnerability to Blackmail** or Magical Thinking (EDT).
  *   If you demand **Both**, you must adopt a theory that relies on a nuanced, and currently debated, metaphysics of logical causation (FDT).

  The 'winning' theory depends on whether you believe the universe is more likely to punish you for lacking causal leverage (CDT's fear) or for lacking logical consistency (FDT's fear). In a world of honest predictors, FDT wins. In a world of opaque causal mechanisms, CDT wins. The desiderata are sound; the incompatibility is a feature of the territory, not a bug in your reasoning.
