      *   *Implication 3 (Humility):* If my hinges are only valid in my domain, I shouldn't impose them on others. What is the demand? Acknowledgment of limits?
      *   *Structural Feature:* What makes this work? The *contextuality* or *functional role* of the proposition rather than its content.
