  2.  **Deconstruct David Lewis's *Convention*:**
      *   *Definition:* A regularity in behavior sustained by a system of preferences and expectations.
      *   *Coordination Problem:* Everyone prefers to do what others do (e.g., driving on the right).
      *   *Common Knowledge:* I know X, you know X, I know that you know X, etc.
      *   *Normativity:* Conventions feel binding because deviating causes coordination failure.
      *   *Rationality Assumption:* Agents are rational utility maximizers. Stability relies on the belief that others are also rational and will follow the equilibrium.

  3.  **Deconstruct *Lord of the Flies* (through this lens):**
      *   *The Conch:* A focal point for coordination. Holding it = right to speak.
      *   *The Fire:* Coordination for rescue (long-term gain) vs. Hunting (short-term gain/visceral).
      *   *The Beast:* An external shock that alters payoff structures (fear > rescue).
      *   *Jack vs. Ralph:* Competing equilibria (Democracy/Order vs. Autocracy/Hunt).
      *   *Simon's Death:* The moment common knowledge completely shatters (mob mentality).

  4.  **Synthesize: The Stress-Test:**
      *   *Where it fits:* The initial establishment of the conch rule is a classic Lewisian convention. It solves a coordination problem (chaos in assembly).
      *   *Where it breaks:* Lewis assumes rationality. The boys aren't purely rational; they are driven by fear and bloodlust. The payoff structure changes not just logically, but *psychologically*.
      *   *Common Knowledge Erosion:* It's not just that Jack stops following the rule; it's that the *belief* that others follow it dissolves. "If they aren't holding the conch, why should I?"
      *   *Authority:* The conch isn't just coordination; it's constitutive of authority. Lewis focuses more on coordination (driving side) than authority (political legitimacy), though they overlap.

  5.  **Drafting - Section by Section:**

      *   **Title:** Needs to be catchy but academic. Something about Equilibria and Savagery.
      *   **Introduction:** Set the scene. Lewis's dry game theory vs. Golding's visceral horror. State the thesis: *LotF* isn't just an allegory; it's a simulation of convention collapse where Lewis's rationality assumption fails.
      *   **The Conch as Focal Point:** Analyze the first assembly. Lewis's "salience." The conch creates a coordination equilibrium. It works because of *common knowledge* (everyone sees everyone holding it).
      *   **The Fracture (Jack & The Fire):** Introduce the competing equilibrium. Hunting vs. Rescue. Lewis says we stick to the convention if it's the best payoff. But Golding shows payoffs are subjective and emotional. The fire goes out not because the math changed, but because attention shifted.
      *   **The Erosion of Common Knowledge:** This is crucial. Piggy represents the Lewisian ideal (insisting on the rules). Jack represents the breakdown. When Jack says "Bollocks to the rules," he is attacking the *common knowledge* that the rules bind us.
      *   **Simon's Death (The Collapse):** The mob scene. Lewis assumes agents know others are rational. In the dance, agents lose individual agency. It's a "pluralistic ignorance" turned violent. The convention of "do not kill" vanishes because no one believes anyone else will uphold it.
      *   **Lewis's Limitation:** Address the prompt's specific question. Lewis assumes common knowledge of rationality is sufficient. Golding shows it's not. Emotions (fear of the Beast) rewrite the payoff matrix faster than reason can track.
      *   **Authority vs. Coordination:** The conch is more than driving on the right; it's political legitimacy. Lewis's model struggles with *power* dynamics that aren't purely cooperative. Jack's tribe is a coercive equilibrium, not just a coordinating one.
      *   **Conclusion:** What does this mean for philosophy? Abstract modeling misses the *affective* glue of norms. Norms need emotional buy-in, not just rational calculation.

