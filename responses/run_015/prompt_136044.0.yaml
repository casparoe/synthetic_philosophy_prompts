      *   *Key Distinction:* Differentiate between *antecedent* justification for calibration (track record) vs. *consequent* justification (I must be right because I disagree).

  8.  **Refining the "Fatal" Defeater:**
      *   The "Independence Principle" (Kelly, Christensen). You cannot use the reasoning in dispute to evaluate the peer's reliability regarding that dispute. If Calibration-Conservatism violates this, it's fatal.
