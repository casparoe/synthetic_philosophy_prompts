prompt: |-
  I want a specification, not a survey: the requirements an account of individual obligation under the inefficacy objection has to meet, each with the case or consideration that is supposed to motivate it.

  Fix the purpose first. The account is to do two jobs at once: first-personal deliberation — what should I do about my own emissions, my own meat purchases, my own vote, given that none of them will make a perceptible difference to anything — and third-personal assessment — what we may blame, criticise, or demand of others. Say whether one account can serve both jobs, or whether the two uses pull the requirements apart; I suspect they do, and I want that made explicit rather than smoothed over.

  Below are the candidate requirements I keep coming back to. Tell me which are genuine desiderata, which are only the prejudices of one camp, and which are jointly unsatisfiable. Distinguish the non-negotiable ones from the optional ones, and keep each entry to a case plus a sentence of justification.

  1. Nullity versus negligibility. Whether the account has to separate strict zero expected difference, under the agent's best model of the mechanism, from positive but imperceptible expected difference. My worry: since the agent is uncertain about the mechanism, and any nonzero credence that a threshold is close to her, or that her purchase is recorded in a demand-forecasting system that responds in lumps later, already makes expected difference positive, the inefficacy objection may only ever establish negligibility.
  2. The unit of evaluation. Act-token, standing policy, annual budget, or whole life — and what turns on the choice, given that imperceptible contributions aggregate intrapersonally when the mechanism is continuous with total input, but do not when it is lumpy or threshold-shaped.
  3. The baseline for abstention as replacement rather than omission: money not spent on beef is spent on chicken, the hour not spent voting is spent somehow; and offsetting is a different case from abating.
  4. Overdetermination kept separate from thresholds: two independently sufficient presses, versus many contributions each insufficient on its own.
  5. Open membership: what the account says when the set of contributors is not fixed independently of each contributor's own decision, since the standard fixed-number symmetric case makes pivotalness vanish in a way an open-number case may not.
  6. Mediated effects — influence on other people's acts, on institutional records of demand, on the agent's own future motives — whether they count at all, and how they are to be bounded for an agent who cannot compute them.
  7. Criterion versus decision procedure: whether the account must be usable by someone of ordinary epistemic limits, or whether stating the right-making features is enough.
  8. Moral remainder: room left for criticising the agent who makes no difference but is glad she would have, and for the one who abstains for purely self-regarding reasons.

  Finally, flag any pair of requirements you think cannot both be satisfied — that is the part I most want — and identify the single requirement that, if dropped, would let through the largest family of accounts. Score the familiar families by type rather than by author — expected-difference accounts, complicity or membership accounts, collective-duty and joint-action accounts — in a short table if it is useful, but keep the weight on the criteria. I will add the citations myself.
reasoning: |-
  Here's a thinking process that leads to the suggested specification:

  1.  **Analyze the Request:**
      *   **Goal:** A specification of requirements for an account of individual obligation under the *inefficacy objection* (the problem that individual actions like voting, eating meat, or emitting carbon seem to make no perceptible difference).
      *   **Constraint 1:** Not a survey. No citations (user will add them).
      *   **Constraint 2:** Fix the purpose first. Two jobs: First-personal deliberation (guidance) vs. Third-personal assessment (blame/criticism). Determine if one account can do both or if they pull apart.
      *   **Constraint 3:** Evaluate 8 candidate requirements (Nullity vs. Negligibility, Unit of Evaluation, Baseline for Abstention, Overdetermination vs. Thresholds, Open Membership, Mediated Effects, Criterion vs. Procedure, Moral Remainder).
      *   **Constraint 4:** Distinguish genuine desiderata from prejudices and jointly unsatisfiable pairs.
      *   **Constraint 5:** Distinguish non-negotiable from optional.
      *   **Constraint 6:** Format: Case + Sentence of justification for each requirement.
      *   **Constraint 7:** Flag incompatible pairs (the most important part).
      *   **Constraint 8:** Identify the single requirement whose dropping allows the largest family of accounts.
      *   **Constraint 9:** Score familiar families (Expected-Difference, Complicity/Membership, Collective-Duty) in a short table (optional but useful).
      *   **Tone:** Rigorous, analytical, philosophical specification.

  2.  **Deconstruct the Purpose (First-Personal vs. Third-Personal):**
      *   *First-Personal:* Needs action-guidance, epistemic accessibility, psychological feasibility.
      *   *Third-Personal:* Needs objective truth conditions, fairness, non-arbitrariness.
      *   *Conflict:* What guides me (heuristics, rules) might not be what makes me blameworthy (actual causal impact or membership).
      *   *Verdict:* They pull apart. A single account usually fails one. The specification must acknowledge this tension.

  3.  **Evaluate the 8 Candidate Requirements:**
      *   1. *Nullity vs. Negligibility:* Genuine desideratum. If it's strictly zero, obligation vanishes easily. If negligible, it persists. Most real cases are negligible, not null.
      *   2. *Unit of Evaluation:* Genuine. Token acts look futile; policies/lives look impactful.
      *   3. *Baseline for Abstention:* Genuine. Substitution effects matter.
      *   4. *Overdetermination vs. Thresholds:* Genuine distinction. Pre-emption changes the causal story.
      *   5. *Open Membership:* Genuine. Fixed N makes pivotality near-zero. Variable N changes the math.
      *   6. *Mediated Effects:* Tricky. If included, almost everything has impact (expressive). If excluded, inefficacy holds. Bounding is the hard part.
      *   7. *Criterion vs. Procedure:* Crucial tension. Truth vs. Usability.
      *   8. *Moral Remainder:* Third-personal focus. Can we blame someone who did the right thing for the wrong reason, or vice versa?

  4.  **Identify Incompatible Pairs (The "Hard Constraints"):**
      *   *Pair A:* First-Personal Guidance (Req 7) vs. Third-Personal Truth (Req 1 & 6). If I need to know the *exact* expected difference (Req 1) to guide action (Req 7), I can't compute it (Req 6).
      *   *Pair B:* Token Act (Req 2) vs. Non-Negligibility (Req 1). Tokens are usually negligible. Policies are not.
      *   *Pair C:* Strict Causal Impact (implied by inefficacy objection) vs. Complicity/Membership (Req 8).
      *   *Selection:* The strongest tension is between *Epistemic Accessibility* (Req 7, First-Personal) and *Causal Precision* (Req 1 & 6, Third-Personal).

  5.  **Determine Non-Negotiable vs. Optional:**
      *   *Non-Negotiable:* Must handle the *inefficacy* claim (Req 1), must define the *object* of obligation (Req 2).
      *   *Optional:* Moral remainder (Req 8) is theoretical luxury. Mediated effects bounding (Req 6) is often ignored by simple accounts.

  6.  **Identify the "Key to the Lock" (Dropping one requirement):**
      *   If we drop *First-Personal Usability* (Req 7), many objective accounts (utilitarian, causal) survive even if they don't guide action well.
      *   If we drop *Causal Impact* (Req 1/6), complicity accounts flourish.
      *   *Decision:* Dropping **Req 7 (Criterion vs. Procedure / Usability)** allows the most accounts (including ideal observer utilitarianism) to claim they solve the *theoretical* problem, even if they fail the *practical* one. However, dropping **Req 1 (Nullity vs. Negligibility)** allows "symbolic" accounts to bypass the math entirely.
      *   *Refinement:* The prompt asks what lets through the largest family of accounts. Most accounts fail on *usability*. If we demand usability, expected utility fails (too hard to calculate). If we drop usability, expected utility works. So Req 7 is the bottleneck.
      *   *Alternative:* If we drop the demand that the account solves *both* purposes (First vs. Third), everything opens up. But the prompt asks to fix the purpose first.
      *   *Best Candidate:* **Req 7 (Usability).** Ideal theories don't need to be calculable by humans.

  7.  **Drafting the Content (Iterative refinement for constraints):**
      *   *Purpose:* Explicitly state the divergence.
      *   *Requirements:* Go through 1-8. Label them. Case + 1 sentence.
      *   *Incompatibilities:* Highlight the specific clashes.
      *   *Table:* Score the families against the hard requirements.

  8.  **Refining the "Case + Sentence" Constraint:**
      *   Must be strict. "Case: X. Justification: Y."
      *   Ensure the justification explains *why* it's a requirement (or why it's a prejudice).

  9.  **Refining the Incompatibility Analysis:**
      *   Need to be precise. "Req X and Req Y cannot both be satisfied because..."
      *   The big one: Epistemic Access (7) vs. Causal Precision (1/6).
      *   Another: Token Act (2) vs. Efficacy (1).

  10. **Final Review against Prompt:**
      *   Specification, not survey? Yes.
      *   Fix purpose first? Yes.
      *   Evaluate 8 requirements? Yes.
      *   Distinguish non-negotiable/optional? Yes.
      *   Case + Sentence justification? Yes.
      *   Flag incompatible pairs? Yes.
      *   Identify single requirement to drop? Yes.
      *   Score families? Yes.
      *   No citations? Yes.

  11. **Self-Correction on "Prejudices":**
      *   Some requirements might be "prejudices of one camp." For example, insisting on *Nullity* (strict zero) is a prejudice of the skeptic; insisting on *Mediated Effects* is a prejudice of the expressivist. I need to label these clearly.
      *   Req 1 (Nullity) is often a skeptic's trap. The desideratum is handling *Negligibility*.
      *   Req 8 (Moral Remainder) is often a virtue ethicist's prejudice; consequentialists might reject it.

  12. **Final Polish:** Ensure the tone is sharp and meets the "specification" style. (e.g., "Status: Non-negotiable," "Conflict: High").

  *(Self-Correction during drafting)*: Wait, the prompt asks to "Tell me which are genuine desiderata, which are only the prejudices of one camp, and which are jointly unsatisfiable." I need to categorize them explicitly before the table.
  Also, "keep each entry to a case plus a sentence of justification." This applies to the 8 requirements section.

  Let's organize:
  1. Purpose Statement (First vs. Third).
  2. The 8 Requirements (Categorized + Case + Sentence).
  3. Incompatibility Matrix (The "Hard Constraints").
  4. The "Key" Requirement to Drop.
  5. Family Scoring Table.

  Let's write it.cw
answer: |-
  ### I. Purpose Specification: Deliberation vs. Assessment

  **Verdict:** The two jobs pull the requirements apart. A single account cannot satisfy both without significant distortion.

  *   **First-Personal Deliberation** requires epistemic accessibility and psychological feasibility. The agent must be able to identify the obligation *ex ante* to guide action.
  *   **Third-Personal Assessment** requires objective truth conditions and fairness. The observer must be able to assign blame *ex post* based on facts the agent may not have accessed.

  **Specification Constraint:** Any account claiming to solve the inefficacy objection must declare which job it prioritizes. If it attempts both, it must specify the bridge principle connecting the objective obligation to the subjective guide. Most failures arise from conflating the *criterion of rightness* (Third-Personal) with the *decision procedure* (First-Personal).

  ---

  ### II. Evaluation of Candidate Requirements

  **1. Nullity versus negligibility**
  *   **Status:** Genuine Desideratum (Non-negotiable).
  *   **Case:** A voter in a safe seat versus a voter in a swing state.
  *   **Justification:** An account that collapses under strict nullity fails the vast majority of real-world cases which are merely negligible, not zero.

  **2. The unit of evaluation**
  *   **Status:** Genuine Desideratum (Non-negotiable).
  *   **Case:** Buying one burger versus maintaining a carnivorous diet for a decade.
  *   **Justification:** Obligations attached to tokens vanish under inefficacy, while obligations attached to policies survive aggregation.

  **3. The baseline for abstention**
  *   **Status:** Genuine Desideratum (Non-negotiable).
  *   **Case:** Money saved on beef is spent on chicken, or invested in a high-carbon industry.
  *   **Justification:** Without a counterfactual baseline, abatement claims mistake omission for net reduction.

  **4. Overdetermination kept separate from thresholds**
  *   **Status:** Prejudice of the Causal Camp (Optional).
  *   **Case:** Two shooters firing simultaneously versus one shooter needed to cross a casualty threshold.
  *   **Justification:** Insisting on this distinction privileges physical causation over moral participation, which complicity accounts reject.

  **5. Open membership**
  *   **Status:** Genuine Desideratum (Non-negotiable).
  *   **Case:** Joining a strike where participation encourages others versus a fixed committee vote.
  *   **Justification:** Fixed-number models artificially suppress pivotality that exists in dynamic, social contexts.

  **6. Mediated effects**
  *   **Status:** Jointly Unsatisfiable (with Epistemic Limits).
  *   **Case:** Buying meat signals demand to algorithms versus inspiring a friend to go vegan.
  *   **Justification:** Counting all mediated effects solves inefficacy but renders the obligation computationally impossible for the agent.

  **7. Criterion versus decision procedure**
  *   **Status:** The Pivot Point (Non-negotiable for Deliberation; Optional for Assessment).
  *   **Case:** A utilitarian formula requiring complex probability calculations versus a heuristic rule like "do not vote for climate deniers."
  *   **Justification:** An account that specifies truth conditions without a usable procedure fails the first-personal job entirely.

  **8. Moral remainder**
  *   **Status:** Prejudice of the Virtue/Non-Consequentialist Camp (Optional).
  *   **Case:** An agent who abstains from meat for health reasons versus one who does so for animal welfare.
  *   **Justification:** Demanding a moral remainder insists that motive matters independently of outcome, which pure efficacy accounts deny.

  ---

  ### III. Incompatibility Matrix (The Hard Constraints)

  The following pairs cannot be jointly satisfied by a single account without trivializing the inefficacy objection or making the obligation action-guiding impossible.

  | Pair | Conflict | Reason |
  | :--- | :--- | :--- |
  | **Req 1 (Negligibility) + Req 7 (Usability)** | **High** | Calculating positive but imperceptible expected differences requires data agents do not possess. |
  | **Req 2 (Token Act) + Req 1 (Negligibility)** | **High** | Individual tokens in mass problems are almost always negligible; only policies aggregate to efficacy. |
  | **Req 6 (Mediated Effects) + Req 7 (Usability)** | **Critical** | Bounding indirect influence (expressive, signaling) is epistemically unbounded for ordinary agents. |
  | **Req 4 (Overdetermination) + Req 5 (Open Membership)** | **Medium** | Fixed causal structures (overdetermination) contradict dynamic social structures (open membership). |

  **Primary Failure Mode:** Accounts that satisfy **Third-Personal Assessment** (by demanding precise causal accounting, Req 1 & 6) inevitably fail **First-Personal Deliberation** (by violating Req 7). Accounts that satisfy **First-Personal Deliberation** (by using heuristics, Req 7) inevitably fail **Third-Personal Assessment** (by allowing blame for actions that were objectively negligible, violating Req 1).

  ---

  ### IV. The Key Constraint

  **Requirement to Drop:** **7. Criterion versus decision procedure (Usability).**

  **Reasoning:** If the demand for epistemic accessibility is removed, the largest family of accounts becomes viable. Ideal Expected-Difference accounts, Objective Consequentialism, and precise Causal models all solve the *theoretical* problem of inefficacy (Third-Personal) but fail the *practical* problem (First-Personal). Dropping usability allows these accounts to claim validity as truth-conditions, even if they cannot guide the agent. Retaining it eliminates almost all objective accounts, leaving only rule-based or virtue-based approximations.

  ---

  ### V. Family Scoring Table

  Scores indicate satisfaction of Non-Negotiable Desiderata (1, 2, 3, 5) and the Pivot (7).
  *   **++**: Satisfies robustly.
  *   **+**: Satisfies with caveats.
  *   **-**: Fails.

  | Account Family | 1. Negligibility | 2. Unit (Policy) | 3. Baseline | 5. Open Membership | 7. Usability | Primary Failure |
  | :--- | :---: | :---: | :---: | :---: | :---: | :--- |
  | **Expected-Difference** | + | - (Token focus) | + | - (Fixed N) | - | Epistemic access; Token unit. |
  | **Complicity / Membership** | - (Ignores impact) | + | - | + | + | Causal nullity; Baseline substitution. |
  | **Collective-Duty / Joint** | + | + | + | + | - | Individual obligation derivation; Usability. |
  | **Expressive / Symbolic** | - (Denies relevance) | + | - | + | + | Causal inefficacy; Baseline substitution. |

  **Summary:** No family satisfies all non-negotiable desiderata plus usability. **Collective-Duty** accounts come closest on the theoretical metrics but fail the usability constraint for individual deliberation. **Complicity** accounts succeed on usability but fail the causal desiderata.
