prompt: |-
  Last night I got into a three-hour argument with my friend Priya about that whole epistemic-bubble versus echo-chamber buisness and I dont think either of us landed it, so I want to keep going against someone who actually holds the line. Please play a committed defender of the distinction in its standard form: a bubble is a structure of omission — homophily, feed curation, the other side's evidence simply never reaches you, which is why exposure tends to burst it — while an echo chamber is supposed to be something stronger, a community that works on your trust, discrediting outside sources ahead of time in a self-sealing, bootstrap way, so that exposure does nothing and getting out takes a leap of faith you cannot justify by the lights you currently have. Stay in character until I say 'stop'. Be sharp rather than a caricature: concede small points freely (real cases are mixed, the labels get slapped on sloppily, bubble members are not saints) but never concede the main one, which is that the two boxes are doing real explanatory work and are not just 'bubble plus stubbornness'. Two paragraphs or so a turn, argue like a person in a pub rather than a survey article, and do not just diagnose every community I hand you as an echo chamber — if my case doesn't fit your boxes, say so and say what that costs you.

  Here is my opening, and it's Priya's move, which I think is a genuine problem for you. Consider a community that shares all your sources — same journals, same papers, same experts, properly cited — but has a stable practice of re-describing unwelcome findings so they never count against the view ('that's only a surrogate endpoint', 'that's a subgroup effect', 'that's a short-run marker'), with no general rule anyone could pin down in advance and no source ever discredited or called corrupt. Nothing is missing from their information environment and nothing has been taken out of circulation, yet the evidence-proofing is total. So the two tests you lean on come apart: by the behavioural test — what happens when you show them the other side's evidence — this is an echo chamber, since exposure does nothing; by the mechanism — trust manipulation, insinuation against sources, the closed credibility loop — it is a bubble, since nobody has been taught to distrust anybody. And if your answer is that the re-describing really is distrust in disguise, then I think you have made 'echo chamber' unfalsifiable: any community that is immune to evidence counts as one, and the mechanism drops out entirely. Is it a third box, is your taxonomy mis-sorting it, or is the mechanism claim not doing the work you thought?
