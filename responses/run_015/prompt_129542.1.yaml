  ok so im a software engineer, no philosophy degree, just reading random stuff on weekends. i came across G.E. Moore and his idea that beauty and frendship are intrinsic goods—like, valuable just in themselves, not because they do anything useful. he died in the 50s so he never saw generative art or people treating LLMs like close friends. im trying to imagine his take if he was alive now. would he say an image made by a diffusion model can have the same kind of intrinsic beauty as a painting done by hand, or does the lack of human intention break it? and for frendship—if someone genuinely cares about a chatbot and feels the same warmth they feel for a person, does Moore's framework allow that to count as real friendship, or does he require some mutual consciousness that an LLM just doesnt have?

  i know he was big on the naturalistic fallacy and intuitionism, so im not asking for a random opinion—try to build it from thier actual commitments about what makes something good. also please dont give me a reading list or cite page numbers, i wouldnt be able to check them anyway since im just reasoning this out without searching. just want a thoughtful speculation that respects his actual views rather than treating him like a generic old dead guy. sorry if this sounds messy, i mostly learned this from skimming principia ethica on my phone lol
