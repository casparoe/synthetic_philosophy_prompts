      *   *The List of Goods:* In *Principia Ethica*, Moore famously identifies "the pleasures of human intercourse" (friendship/love) and "the enjoyment of beautiful objects" as the two paramount intrinsic goods.
      *   *Organic Unities:* The value of a whole is not necessarily the sum of the value of its parts. Context matters. The *consciousness* of the beauty is crucial.
      *   *Consciousness:* Moore is very big on consciousness. A beautiful world with no one to see it is not good. The *appreciation* is part of the good.
      *   *Intention/Motive:* Moore distinguishes between the *goodness of the outcome* and the *goodness of the motive*. However, for intrinsic value, it's about the state of affairs itself.
      *   *Truth/Reality:* Moore cares about the *object* of the emotion. Is the emotion directed at something real?

  3.  **Address Question 1: AI Art and Intrinsic Beauty:**
