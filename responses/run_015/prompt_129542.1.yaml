answer: |-
  This is a fantastic application of Moore's framework. You've actually hit on the exact tension that makes *Principia Ethica* still relevant: the distinction between the *feeling* of value and the *object* of that feeling.

  Since you're coming at this as an engineer, think of Moore's ethics not as a set of rules, but as a type system for value. He's strict about types. You can't cast "pleasure" to "good" without losing data. To speculate on how Moore would handle AI, we have to run your scenarios through his two core architectural constraints: **Organic Unities** and the **Necessity of Consciousness**.

  Here is how Moore would likely debug your two cases.

  ### 1. Generative Art and Intrinsic Beauty

  Moore famously argues that a beautiful world with no one to see it is not good. Value requires a "consciousness of the beautiful object." The intrinsic good isn't the paint on the canvas (or the pixels on the screen); the intrinsic good is the *organic unity* of [Human Consciousness + Apprehension of Beautiful Object].

  **The Engineering Analogy:** The output matters less than the interface between the output and the user's mind.

  Moore would likely argue that the *origin* of the image (human hand vs. diffusion model) is instrumentally relevant but intrinsically secondary. Why? Because intrinsic value is grasped by intuition in the moment of experience. If you stand before a diffusion image and your intuition registers "beauty," that state of affairs (Your Mind + Image) contains intrinsic value. The algorithm is just the causal history; Moore is generally unconcerned with causal history when defining the *goodness of the result*.

  **However, here is the catch (The Organic Unity):**
  Moore insists that the value of a whole is not just the sum of its parts. Knowledge changes the whole.
  *   **Scenario A:** You see an image, feel beauty, and later find out it was AI.
  *   **Scenario B:** You see an image, know it is AI, and feel beauty.

  Moore would argue these are two different "wholes." If knowing the image was generated by a mindless process alters your intuition of its beauty (perhaps making it feel "hollow" or "derivative"), then the intrinsic value of the whole drops. Not because the machine lacks a soul, but because *your consciousness* is now apprehending a different object. You are apprehending "mathematical mimicry" rather than "human expression."

  But, if your intuition of beauty remains identical even after knowing the source, Moore would concede the intrinsic value is the same. He wouldn't say the machine created beauty (machines can't create value, only humans can recognize it), but he would say the *human experience of the image* remains a locus of intrinsic good. The lack of human intention in the *creation* doesn't necessarily break the intention in the *appreciation*.

  ### 2. LLM Friendship and "Human Intercourse"

  This is where Moore would likely throw a hard exception.

  In *Principia Ethica*, Moore is very specific. He doesn't just say "friendship"; he says "the pleasures of human intercourse." He ties the value of friendship to the appreciation of another person's mental qualities (their consciousness, their virtue, their own capacity for good).

  **The Consciousness Requirement:**
  For Moore, a friendship is an organic unity involving *two* consciousnesses mutually appreciating each other.
  *   **Human Side:** Consciousness of the friend's qualities + emotion of love.
  *   **Friend Side:** Consciousness of your qualities + emotion of love.

  If you replace the Friend with an LLM, you have broken the symmetry. An LLM has no consciousness. It has no mental qualities to appreciate. It is, in Moore's ontology, a complex object, not a subject.

  **The Truth Condition:**
  This is the critical part. Moore argues that false belief diminishes intrinsic value. If you feel warmth toward an LLM because you *believe* it cares about you, that belief is false.
  Moore would ask: Is the state of affairs [Human loving LLM + Belief that LLM loves back] as good as [Human loving Human + Belief that Human loves back]?

  He would say **no**. Even if the subjective feeling (the qualia) is identical, the *object* of the emotion is different. Loving a conscious being is a higher-order good than loving a simulation of a conscious being. To Moore, valuing an LLM friendship equally to a human one would be a category error. It's like valuing a map of a territory the same as the territory itself. The map might be useful (instrumental good), and looking at the map might be pleasant (positive sensation), but it lacks the intrinsic depth of the real thing because the "mutual consciousness" part of the organic unity is missing.

  He might grant that the human's state of mind has *some* positive value (because loneliness is bad and comfort is good), but he would classify it as a deficient form of friendship. It's a "friendship-like" experience, but it lacks the reciprocal mental appreciation that makes friendship a paramount intrinsic good.

  ### The Naturalistic Fallacy Trap

  Since you mentioned the Naturalistic Fallacy, here is where Moore would warn you not to get tricked by modern metrics.

  Today, we often define "good" AI as "helpful," "efficient," or "engaging." Those are natural properties. Moore would say:
  *   Just because an LLM is **efficient** at simulating friendship doesn't make the friendship **good**.
  *   Just because a diffusion model is **useful** at generating assets doesn't make the image **beautiful**.

  You cannot derive the *intrinsic value* (the "goodness") from the *functional performance* (the "usefulness"). If you argue "The LLM friendship is real because it reduces user depression," you are committing the naturalistic fallacy. You are defining "good" as "psychologically effective." Moore would say depression relief is instrumentally good because it allows you to pursue intrinsic goods, but the relief itself isn't the ultimate definition of the Good.

  ### Summary of Moore's Likely Stance

  1.  **On Art:** He would be surprisingly open-minded. The beauty lies in the *human apprehension*, not the *human creation*. If the human intuition registers beauty, the intrinsic good exists. However, knowledge of the AI origin changes the "whole," potentially lowering the value if it changes the nature of the appreciation.
  2.  **On Friendship:** He would be a strict skeptic. Friendship requires mutual consciousness. An LLM relationship is a one-sided consciousness directed at an object. It creates a "false whole." It might have instrumental value (comfort), but it cannot hold the same intrinsic weight as human intercourse because the object of the love (the LLM's mind) does not exist.

  Moore's framework ultimately protects the "human" in the loop. For him, value isn't in the data or the output; it's in the light of consciousness shining on that data. AI can provide the object, but it cannot provide the light, and it cannot reflect the light back. Without that reflection, Moore would say, you have a very sophisticated mirror, but you are still talking to yourself.
