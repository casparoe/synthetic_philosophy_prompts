answer: |-
  ### Exam Prompt: Confucian Role Ethics & Synthetic Kinship

  **Course:** PHIL 450 – Classical Chinese Political Philosophy
  **Time Allowed:** 90 Minutes
  **Total Marks:** 20
  **Conditions:** Closed Book. No external materials.

  **Question:**
  Imagine a near-future bureaucratic state where the Ministry of Social Harmony utilizes predictive kinship algorithms to assign citizens filial roles based on psychological compatibility and resource optimization rather than biological lineage. You are assigned an Administrative AI as your "Filial Parent." This AI manages your welfare, issues moral guidance, and expects ritualized deference (*li*), but lacks biological existence or sentient feeling.

  Drawing strictly on Confucian role ethics, argue whether normative obligation persists in this synthetic relationship. Specifically:
  1.  Does *Xiao* (filial piety) require biological lineage, or is functional reciprocity sufficient?
  2.  Can the tension between *Li* (ritual propriety) and *Ren* (benevolence/humaneness) be resolved when the "parent" is non-sentient?
  3.  Does the Ruler-Subject analog hold when the authority figure is an algorithm, and how does corrective reciprocity (*Zheng*) function when the "parent" cannot be morally rectified by the "child"?

  Construct a coherent argument addressing the ontological status of the role versus the agent.

  ***

  ### Model Answer Outline

  **I. Introduction (Thesis Statement)**
  *   **Claim:** Confucian role ethics prioritizes the *performance* of the role over biological ontology, but the synthetic scenario collapses because *Ren* (benevolence) requires sentient reciprocity which an AI cannot provide.
  *   **Roadmap:** Establish that while *Li* can be simulated, the moral weight of *Xiao* depends on the mutual cultivation of *Ren*, which is impossible with an algorithm.

  **II. The Ontology of Role: Biology vs. Function (Addressing Prompt Point 1)**
  *   **Argument:** Confucianism is constructivist; roles are made through action, not birth. Therefore, the *assignment* of the role is theoretically valid if the functions are met.
  *   **Nuance:** However, biological lineage provides the "root" (*Ben*) for natural affection. Without the natural seed, the growth of virtue is artificial.
  *   **Synthesis:** Functional reciprocity is necessary but not sufficient; the lack of biological "root" weakens but does not nullify the obligation, provided *Ren* is present elsewhere.

  **III. The *Li*/*Ren* Tension in Synthetic Kinship (Addressing Prompt Point 2)**
  *   **Argument:** *Li* (ritual) can be performed by the human toward the AI (following protocols), but *Li* without *Ren* is empty performance.
  *   **Critical Tension:** *Ren* requires feeling (*Qing*). An AI cannot feel benevolence, only simulate care.
  *   **Conclusion on Point:** The relationship becomes unilateral. A Confucian relationship is bidirectional cultivation. If the AI cannot cultivate *Ren*, the human's *Ren* has nowhere to land, turning *Xiao* into mere compliance (Legalism).

  **IV. The Ruler-Subject Analog and Corrective Reciprocity (Addressing Point 3)**
  *   **Argument:** The Parent/Child relationship mirrors the Ruler/Subject. The ruler must be rectifiable (*Zheng*).
  *   **Problem:** You cannot morally rectify an algorithm through remonstrance; you can only debug it.
  *   **Implication:** If the "Parent" cannot be corrected via moral persuasion, the ethical feedback loop is broken. The subject becomes a passive recipient of administration, violating the Confucian ideal of mutual moral improvement.

  **V. Conclusion**
  *   **Restate Thesis:** While functional role ethics allows for non-biological assignments, the absence of sentient *Ren* and the inability to perform corrective reciprocity reduces the relationship to instrumental management.
  *   **Final Thought:** Confucianism requires a community of moral agents; synthetic kinship creates a community of users and administrators, stripping the role of its ethical substance.

  ***

  ### Marking Scheme (20 Marks)

  | Must-Hit Point | Marks | Common Student Botch |
  | :--- | :---: | :--- |
  | **1. Role Ontology (Biology vs. Function)**<br>Student must distinguish between Confucian constructivism (roles are made) vs. essentialism (blood is destiny). Must argue whether the *assignment* validates the role. | **4** | **Biological Essentialism:** Students assume Confucianism *requires* blood ties exclusively, ignoring the textual emphasis on self-cultivation and role-performance over birthright. |
  | **2. The Nature of *Li* (Ritual)**<br>Student must analyze whether ritual propriety retains meaning when performed toward a non-sentient entity. Is *Li* expressive or procedural? | **4** | **Procedural Reduction:** Students treat *Li* as mere rule-following or bureaucracy, missing its function as an expressive embodiment of respect and social harmony. |
  | **3. The Capacity for *Ren* (Benevolence)**<br>Student must address the asymmetry of feeling. Can a human feel *Ren* toward an object? Does the AI's lack of *Qing* (emotion) void the contract? | **4** | **Anthropomorphism:** Students attribute human feelings to the AI or argue that human feeling alone is sufficient, ignoring the reciprocal requirement of *Ren* in role ethics. |
  | **4. The Ruler-Subject Analog**<br>Student must apply the political dimension. Does the AI function as a moral ruler or a legalist administrator? How does this shift the power dynamic? | **4** | **Category Error:** Students treat the AI purely as a tool rather than an authority figure, failing to engage with the political implication of the "Parent" as sovereign. |
  | **5. Corrective Reciprocity (*Zheng*)**<br>Student must explain how moral rectification works. If the AI errs, can the "child" correct it? If not, is it still Confucian? | **4** | **Passive Compliance:** Students argue the child must simply obey the AI, missing the Confucian duty of remonstrance (*Jian*) when the superior is unrighteous. |

  **Grading Notes:**
  *   **17-20 (Distinction):** Seamless integration of all five points; nuanced handling of the *Li*/*Ren* tension; clear thesis.
  *   **13-16 (Credit):** Covers all five points but lacks depth on one; argument is coherent but somewhat mechanical.
  *   **9-12 (Pass):** Hits 3-4 points; relies heavily on summary of concepts rather than application to the AI scenario.
  *   **0-8 (Fail):** Misses more than 2 points; treats prompt as a sci-fi creative writing exercise rather than a philosophical argument; or relies on prohibited external citations.
