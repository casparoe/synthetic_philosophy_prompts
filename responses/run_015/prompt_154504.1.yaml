          *   *Issue 1: The Nature of the Relation.* Parity: Positive relation exists. Incomp: No relation exists. (Substantive).
          *   *Issue 2: The Role of the Will.* Parity: Will creates/stabilizes reason. Incomp: Will selects without altering value facts. (Substantive).
          *   *Issue 3: Meaning of "Comparable".* This is the verbal suspect. Parity: Comparable = stands in *some* positive relation (including parity). Incomp: Comparable = one is better/worse/equal. (Verbal/Semantic).
