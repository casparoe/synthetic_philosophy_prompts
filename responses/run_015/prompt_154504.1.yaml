      *   **Constraints:** No academic citations/library references (usable without a library). Plain terms. Both parties must appear equally competent. Careful definitions at the top.
      *   **Specific Philosophical Content:**
          *   *Parity View:* Fourth relation (not better, worse, or equal). Small improvement makes one better. Will/commitment supplies reason.
          *   *Incomparabilist View:* No positive comparative relation. No covering value. Must pick, but picking doesn't make comparative facts true.
          *   *Common Ground:* Trichotomy fails, not merely epistemic, permissibility of either, exclusion of worse options, comparability $\neq$ measurability, not about emotional agony.
