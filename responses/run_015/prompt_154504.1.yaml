      *   *Parity (Ruth Chang style, roughly):* Hard choices reveal a relation called "parity." $A$ and $B$ are on a par. $A+$ is better than $B$. The agent's will creates a reason to choose one over the other when they are on a par.
      *   *Incomparability (Joseph Raz/John Broome style, roughly):* $A$ and $B$ cannot be compared because there is no common measure (covering value). It's not that they are equal; it's that the question "which is better?" has no answer. Choice is a leap, not a tracking of value.
      *   *The Tension:* Is there a fact of the matter about the relationship between the values (Parity says yes, a 4th relation), or is the relationship void (Incomparability says yes, void)? Does the agent's choice *create* a reason (Parity) or just *execute* a preference without changing the value landscape (Incomparability)?

  3.  **Drafting - Section by Section:**

      *   **Definitions:** Need to be precise but non-technical.
