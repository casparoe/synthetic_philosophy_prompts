answer: |-
  **Project Title:** The Calibration Worry: Reassessing the Epistemic Status of the Church–Turing Thesis

  **The Question**
  The Church–Turing Thesis (CTT) identifies the informal notion of "effective computability" with the formal machinery of Turing machines. The received view holds that while CTT cannot be strictly proved, it is supported by the convergence of distinct formalisms (lambda calculus, recursive functions, etc.) on the same class of functions. I propose to test a skeptical hypothesis: this convergence may be an artifact of calibration rather than evidence of independent tracking. Later formalisms were developed by researchers aware of earlier ones; a candidate analysis was often certified as adequate precisely because it delivered the class everyone already expected. If the agreement is circular, the epistemic status of CTT shifts from a discovery about limits to a stabilization of conventions. My project asks: Can this calibration worry be made precise enough to assess? And if the worry survives, what becomes of the authority of uncomputability results?

  **Disambiguating the Target**
  To avoid equivocation, I distinguish four distinct theses often conflated under "Church–Turing."
  1.  **The Narrow Thesis:** The informal notion of effective procedure is co-extensive with Turing-computable functions.
  2.  **The Physical Thesis:** No physical process can compute functions beyond the Turing limit.
  3.  **The Efficiency Thesis:** Feasible computability corresponds to polynomial-time computation.
  4.  **The Normative Thesis:** A proof of uncomputability provides a researcher with conclusive reason to cease searching for an algorithm; it closes a question rather than reporting a current limitation.

  The calibration worry primarily targets the **Narrow** and **Normative** theses. It does not directly touch the Physical Thesis (which is an empirical claim about the world) or the Efficiency Thesis (which concerns complexity classes). The core tension lies between the Narrow Thesis (is this the right analysis?) and the Normative Thesis (does this analysis bind our research practices?). If the Narrow Thesis is merely a calibrated convention, the Normative Thesis loses its force as a report on impossibility and becomes a rule of a specific linguistic or mathematical game.

  **Methodology**
  This project will not be an archival history of the 1930s, nor a survey of exotic hypercomputation models. Archival history describes *what* happened, but I need to evaluate *how* claims were justified. A survey of exotic models presupposes the very boundary I am investigating. Instead, I will employ a conceptual analysis of justification, followed by bounded historical verification.

  First, I will articulate the expected signatures of "genuine tracking" versus "calibration."
  *   **Tracking Signature:** Near-misses (e.g., models allowing infinite steps in finite time, or exact computation over real-valued parameters) are rejected for reasons *internal* to the definition of "procedure" (e.g., "a step must be finite"), independent of the resulting function class.
  *   **Calibration Signature:** Near-misses are rejected primarily because they generate functions *outside* the accepted Turing class. The boundary is drawn by the output, not the input constraints.

  Only after establishing these criteria will I examine historical records. I will look specifically at how proponents of various formalisms justified excluding "near miss" relaxations. Did they argue that such relaxations violate the intuitive concept of a mechanical step (Tracking), or that they yield functions that are "clearly not computable" because they violate the established extension (Calibration)?

  This ordering is superior to the alternatives. A straight historical study risks getting lost in biographical detail without answering the epistemic question. A realism-versus-antirealism debate is too abstract to guide practice. A catalogue of hypercomputation proposals assumes we already know which proposals are "exotic." By defining the discriminatory signature first, I turn the historical record into a test case for an epistemic hypothesis rather than a narrative end in itself.

  **Possible Conclusions and Practice**
  If the calibration worry survives scrutiny, the Narrow Thesis cannot be viewed as a straightforward discovery of a pre-existing mathematical fact. I will evaluate four alternative statuses:
  1.  **Stipulation:** A definition fixed by fiat.
  2.  **Explication:** A refinement of a vague concept assessed for fruitfulness rather than truth.
  3.  **Constitutive Convention:** A rule that defines the field of computability theory itself.
  4.  **Low-Grade Empirical Hypothesis:** A generalization from observed formalisms.

  The critical follow-up is the practice question. If the best reading is deflationary (e.g., Constitutive Convention), does the authority of uncomputability results collapse? I argue it does not. If CTT is a convention, uncomputability results remain binding *within* the framework defined by that convention. The Normative Thesis is preserved, but its justification shifts from "nature forbids this" to "this move is outside the game." I will determine what considerations decide among these statuses, focusing on how impossibility proofs are cited in computer science and mathematics. If they are cited as reasons to stop looking regardless of formal framework, the Physical or Discovery reading retains weight. If they are cited as reasons to change the problem formulation, the Convention reading is favored.

  **Scope and Failure Conditions**
  This proposal funds the first of three planned papers, focusing exclusively on the Narrow and Normative theses. Attempting to resolve the Physical Thesis would require engagement with theoretical physics beyond the project's scope; attempting to resolve the Efficiency Thesis would require complexity theory beyond the philosophical remit.

  A candid account of failure is necessary. The project fails if the distinction between "tracking" and "calibration" turns out to have no discriminatory consequences for anything downstream. If both patterns yield identical justificatory structures in the historical record, or if the distinction is philosophically idle regarding the Normative Thesis, the project will have generated a distinction without a difference. Additionally, the project fails if the historical record is too ambiguous to support either signature; in that case, I cannot move beyond the initial skepticism to a positive account of CTT's status. Finally, if demonstrating the calibration artifact requires a granular reconstruction of every major formalism's development, the scope is too large for twelve months. I will limit the historical test to three paradigmatic cases (e.g., Turing, Church, Post) to ensure completion.

  The goal is not to refute CTT, but to clarify what kind of claim it is. If the convergence is calibrated, we have not found the limit of thought; we have built a fence and agreed to call it a boundary. Knowing which is which matters for how we proceed when the fence is challenged.
