answer: |-
  A matter is fit for a direct vote only if it is a determinate policy choice initiated by the legislature that neither restricts the fundamental rights of a vulnerable minority nor alters the constitutional framework governing sovereign decision-making.

  The clause requiring **determinate policy choices** is forced by Case 6 (tax rates require budgetary trade-offs) and Case 7 (Brexit lacked a single describable outcome), distinguishing them from Case 2 (tram line) and Case 3 (housing development), which are specific projects. The clause requiring **legislative initiation** is forced by Case 14, validating your unease with petition-driven ballots while permitting council-proposed questions; this treats the legislature as a necessary gatekeeper for agenda-setting. The clause protecting **vulnerable minorities** is forced by Cases 4 and 5 (death penalty, minaret ban), which impose restrictions on specific groups, while accommodating Case 8 (assisted dying) because it expands liberty for a group without imposing harm on the unwilling, resolving your worry about special pleading by grounding it in the harm principle rather than mere intuition. The clause prohibiting **alteration of the constitutional framework** is forced by Cases 9 and 10 (entrenchment rules), distinguishing them from Case 1 (town merge); while both bind future actors, the merge is an operational administrative change within the sovereignty, whereas entrenchment or treaty ratification (Case 11) alters the rules by which future sovereign decisions are made.

  None of your settled verdicts (1–10) conflict with this principle, but you must abandon the oscillation on Case 11 and the unease on Case 14. On Case 11, the principle dictates a clear "no": a treaty restricting future governments for thirty years is a constitutional alteration akin to Cases 9 and 10, not a simple policy choice like Case 1; the "ideal referendum subject" intuition fails because it ignores the entrenchment effect. On Case 14, you must accept that the distinction between council and petition is principled, not just psychological; legislative initiation ensures the question has been vetted for determinacy and rights compliance, whereas petitions bypass this filter.

  Here are the principle's verdicts on your unsettled cases:

  *   **Case 11 (International Treaty):** Improper for a vote. It binds future legislatures and alters the constitutional framework, falling under the prohibition against entrenchment.
  *   **Advisory Referendum:** Proper, provided it is legislatively initiated and the question is determinate. Because it is non-binding, it does not alter the constitutional framework or entrench policy, serving instead as a consultative input for the legislature.
  *   **Citizens' Assembly (binding):** Proper for cases where a direct vote is barred (like Case 11 or 7). An assembly selected by lot satisfies the need for deliberation and protects minority interests better than a majority vote, fulfilling the underlying values of the principle without the risks of plebiscitary democracy.
  *   **Minimum Turnout/Quorum Rule:** Improper if decided by a vote. Establishing a quorum rule changes the constitutional rules of decision-making (like Case 9); it must be set by standing law, not ad hoc referendum.
  *   **Vote on Whether to Hold a Vote:** Proper. This is a procedural question initiated by the legislature that does not bind future policy or restrict rights.
  *   **Secession (1/5 of Electorate):** Improper for a vote. Like Case 7, this alters the constitutional framework and sovereign boundaries; such a fundamental change requires a supermajority or legislative convention, not a simple majority referendum.
