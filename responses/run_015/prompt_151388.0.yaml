answer: |-
  Your flatmate's brother is articulating a very common, very seductive objection to Kant. It's often called the "collapse objection": the idea that the Categorical Imperative (specifically the Formula of Universal Law) collapses into a rule-utilitarian calculation or a piece of parental folk wisdom.

  He is right that on the surface, the mechanics look identical. He is wrong about *why* the mechanics are there. He is treating Kant's thought experiment as an empirical prediction about social stability, whereas Kant intends it as a test of rational coherence.

  Here is the audit you asked for.

  ### 1. The Correspondence Table

  The brother's slide happens because he maps Kantian terms onto empirical concepts. If we map them onto their actual logical roles, the "consequentialist" leak plugs up.

  | Mum-Test Concept | Kantian Analogue | The Difference (Where the Work Is Done) |
  | :--- | :--- | :--- |
  | **"Everybody"** | **All Rational Agents** | Mum means "all people in society." Kant means "all beings capable of reason." It's not a demographic claim; it's a claim about the scope of rationality. |
  | **"That"** | **The Maxim** | Mum means the *action* (lying). Kant means the *principle of volition* ("I will lie to get out of trouble"). The action is physical; the maxim is the reason + the rule. |
  | **Bad Outcome** | **Contradiction** | Mum means "things go poorly" (consequences). Kant means "the concept dissolves" (logic) or "the will conflicts with itself" (volition). |
  | **Mum's Frown** | **Rational Incoherence** | Mum signals disapproval/harm. Kant signals that the agent is making an exception for themselves, which is logically inconsistent. |
  | **"You wouldn't like it"** | **Contradiction in Will** | Mum means "you'd suffer consequences." Kant means "you cannot rationally will a world where your own agency is undermined." |
  | **The "What If"** | **Universal Legislation** | Mum asks for a *prediction* (empirical). Kant asks for a *validation* (modal). Can this maxim *be* a law, not just what happens if it *is* one. |

  **Does the difference do work?**
  Yes. If the test is a prediction (Mum), then the brother is right: if 5% of people lie and society survives, the test says "go ahead." If the test is legislation (Kant), the question is whether you can authorize that maxim as a law for everyone *without contradicting your own status as a rational agent*. The empirical survival of the practice is irrelevant to the logical validity of the law.

  ### 2. Where the Mapping Breaks (Conception vs. Will)

  You are correct that the Mum-test fits one branch better than the other, but you might have the mapping slightly reversed.

  **Contradiction in Conception (Perfect Duties):**
  *   *Example:* The Lying Promise.
  *   *Kant:* If everyone made promises they didn't intend to keep, the concept of a "promise" ceases to exist. No one would believe the utterance. It's not that trust "breaks down" over time (consequence); it's that the act becomes logically impossible immediately. It's like trying to "score a goal" in a game where the rules allow carrying the ball over the line. You aren't playing the game anymore.
  *   *Mum-Test:* "If everyone lied, no one would believe anyone." This sounds like a prediction about trust levels.
  *   *The Break:* The Mum-test treats this as a causal chain (lies $\rightarrow$ distrust $\rightarrow$ bad outcome). Kant treats it as a conceptual dissolution (universal lying $\rightarrow$ no promises). The brother sees "bad consequences" (nobody gets lent money); Kant sees "logical impossibility" (the utterance is no longer a promise).

  **Contradiction in Will (Imperfect Duties):**
  *   *Example:* Not helping others / Letting talents rot.
  *   *Kant:* A world where no one helps is *conceivable*. You can imagine it. But you cannot *will* it, because as a finite rational being, you will inevitably need the love and aid of others. To will a law that forbids aid is to will against your own future needs.
  *   *Mum-Test:* "If no one helped, you'd suffer when you needed help."
  *   *The Break:* Here the Mum-test actually aligns quite well with Kant, *except* for the grounding. Mum says "you'd suffer" (prudential/consequentialist). Kant says "your will would be in conflict with itself" (rational consistency).
  *   *Verdict:* The Mum-test fits the *Contradiction in Will* cases better superficially, but it misses the force of the *Contradiction in Conception* cases entirely by turning logical impossibility into empirical inconvenience.

  ### 3. The Case That Bothers You (Partial Defection)

  This is the strongest point in the brother's favor, and where the distinction between *prediction* and *legislation* must do the heavy lifting.

  **The Scenario:** 5% of people hold the maxim "I will break promises when inconvenient." Promising as a practice survives.
  **The Brother's Claim:** Therefore, the maxim passes the test. The consequences aren't bad enough.
  **The Kantian Reply:** The test is not "What happens if 5% do this?" The test is "Can I will that *everyone* does this?"

  If I act on that maxim, I am implicitly claiming that my principle could be a universal law. But I am only able to succeed in my lying promise *because* everyone else is not following my maxim. I am relying on their compliance to make my exception work. I am making myself a free rider.

  Kant's test exposes the **parasitic nature** of the maxim. Even if the practice survives at 5% defection, the 5% are acting on a principle they *know* cannot be universalized without destroying the very mechanism they are exploiting.

  *   **Mum-Test:** Asks about the stability of the system. (Is 5% defection sustainable? Yes.)
  *   **Kant-Test:** Asks about the authority of the agent. (Do you have the right to make an exception for yourself?)

  So, does Kant's test say anything the Mum-test doesn't? Yes. The Mum-test says "It's okay, the system holds." Kant says "You are acting on a principle that relies on others *not* acting on it, which is a contradiction of your claim to rationality." The wrongness isn't the collapse of the system; it's the **unfairness of the exception**.

  ### 4. The Gerrymandering Worry

  **The Worry:** I can make any maxim pass by adding details ("I'll lie only to redheads on Tuesdays").
  **The Kantian Fix:** The maxim must capture the *reason* for the action, not just the physical description.

  If your reason for lying is "to get out of difficulty," then the maxim is "I will lie when it gets me out of difficulty." Adding "on Tuesdays" is irrelevant unless Tuesday-ness is part of the *reason*. If you add "when it benefits me," you have explicitly built the self-exception into the law. A law that says "Everyone lies when it benefits them" is self-defeating (see Contradiction in Conception).

  **Is it fatal?** It's a practical difficulty, not a theoretical one. It requires the agent to be honest about their motivation. If you gerrymander the maxim, you are lying to yourself about why you are acting. Kant assumes good faith in the description of the maxim. If you describe the maxim dishonestly to pass the test, you've already failed the moral requirement of honesty.

  The "unit of assessment" is the **principle of volition**. Who sets the level of generality? The agent's actual rationale. If you really only lie to redheads because you hate redheads, that's the maxim. If you lie to redheads because you want money, the hair color is irrelevant noise.

  ### 5. The Over-Generation Worry (The Pianist)

  **The Worry:** If everyone is a pianist, we starve. So being a pianist is wrong.
  **The Kantian Fix:** This confuses the *action* with the *maxim*.

  *   **Maxim:** "I will become a pianist."
      *   Universalized: "Everyone becomes a pianist."
      *   Result: Starvation.
      *   Verdict: This looks like a fail.
  *   **Correct Maxim:** "I will cultivate my talents."
      *   Universalized: "Everyone cultivates their talents."
      *   Result: A world where people cultivate *various* talents (farming, medicine, music).
      *   Verdict: Pass.

  Kant's test applies to the *policy*, not the specific career choice. The duty is to not let your talents rust (Contradiction in Will), not to pick a specific job.

  **Does this need the Formula of Humanity?** It helps, but the Formula of Law can handle it if the maxim is described correctly. The brother's claim that the Universal Law formula is "empty" relies on people describing their maxims stupidly (e.g., "I will be a pianist" vs "I will cultivate talents"). If described properly, it isn't empty.

  ### 6. The Brother's Conclusion: Vacuous, Crypto-Consequentialist, or Neither?

  **Verdict: Neither.**

  The brother is arguing that Kant is **crypto-consequentialist** because the "bad outcome" (trust breaking down) looks like a consequence.
  *   **Refutation:** In Kant's framework, the breakdown of trust isn't the *reason* the act is wrong. The act is wrong because it involves a contradiction in conception. The "breakdown" is just the visible symptom of the logical incoherence.
  *   **Analogy:** If you try to divide by zero, your calculator gives an error. The brother says, "See, the error message is the reason you can't do it." Kant says, "No, the mathematical impossibility is the reason; the error message is just what happens when you try."

  Is it **vacuous**? No. It rules out free-riding and logical inconsistencies in willing. It's not empty, but it is formal. It doesn't tell you *what* to pursue (happiness, utility), it tells you *how* to pursue anything (without contradicting rational agency).

  The brother's conclusion survives only if you refuse to accept the distinction between **empirical prediction** (Mum) and **rational validation** (Kant). If you think morality is just about "what works best for society," then yes, Kant is just a clunky way of doing utilitarianism. But if you think morality is about "what principles a free rational being can authorize," then the Mum-test is category error.

  ### 7. The Game Analogy

  Someone suggested: *Constitutive rules of a game.* You can't have "bishop moves one square diagonally when it suits me" as a universal rule of chess.

  **What it imports that the Mum-test doesn't:**
  1.  **Validity vs. Outcome:** In chess, if you move the bishop like a knight, you haven't made a "bad move that leads to losing." You have made an *invalid move*. The Mum-test implies the move is valid but has bad consequences. The Game Analogy captures Kant's idea of **Perfect Duties** (Contradiction in Conception).
  2.  **Internal Coherence:** The rule isn't wrong because the game goes badly; it's wrong because it breaks the definition of the game. Similarly, a lying promise breaks the definition of communication.

  **Which cases it can't handle:**
  1.  **Imperfect Duties:** The game analogy struggles with "Develop your talents." There is no single "winning move" in life. You have latitude (play the bishop or the knight, just play legally). The game analogy makes morality look too rigid, like a rulebook with no room for strategy or supererogation.
  2.  **Optionality:** You can choose not to play chess. You cannot choose not to be moral (on Kant's view). The analogy misses the **categorical** force.

  **Is it better than the Mum-test?**
  Yes, for Perfect Duties. It captures the "logical impossibility" aspect better than the "bad consequences" aspect of the Mum-test. But it needs to be supplemented with the idea that *you are already playing the game of rational agency* whether you like it or not.

  ### Summary for the Dinner Table

  Tell the brother this:
  He is treating the Categorical Imperative as a **sociological stress test** ("Will society survive if everyone does this?"). Kant intends it as a **logical consistency test** ("Can I authorize this principle for everyone without contradicting my own rationality?").

  If 5% of people lie and society survives, the Mum-test says "Fine." Kant says "Those 5% are free-riding on the rationality of the other 95%." The wrongness isn't the collapse of the system; it's the **privilege of the exception**.

  The "What if everybody did that?" question isn't about predicting the future; it's about checking if you're trying to opt out of the rules you expect everyone else to follow. That isn't consequentialism; that's the definition of fairness derived from reason. Kant isn't wading through 200 pages to say "don't break society." He's wading through them to say "don't contradict yourself."
