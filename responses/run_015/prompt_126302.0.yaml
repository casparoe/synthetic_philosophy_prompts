answer: |-
  ### The Metaphysical Fault Lines

  The claim that perceptual and conative theories are merely describing different aspects of a single phenomenon collapses under scrutiny of metaphysical priority. For the perceptual view, the identity of an emotion type is fixed by its formal object: fear is distinct from anger because one presents the dangerous and the other the offensive. Motivation is explained via internalism about value; seeing something as dangerous *just is* to be motivated to avoid it, though weakness of will may intervene. Correctness conditions are inherited from the independent value properties perceived; fear is fitting if the object is truly dangerous. Consequently, emotions detect value; they are answerable to a normative reality outside the subject.

  The conative or enactivist picture inverts this hierarchy. Identity is fixed by the specific reorganization of the subject's action-readiness and salience field; fear is defined by the freeze-flight profile, not the proposition "this is dangerous." Motivational force is not derived from content but is constitutive; the emotion *is* the mobilization. Correctness is pragmatic rather than truth-conditional; an emotion is appropriate if it successfully navigates the situation, not necessarily if it matches independent facts. On this view, emotions often confer value; by making an object salient and demanding response, the emotion constitutes the object's mattering within the subject's world. The collision is not about description but about essence: is the emotion essentially a way of knowing or a way of coping?

  ### Diagnostic Cases

  Running these commitments through specific cases reveals where the theories fracture. Consider second-order emotions, such as shame at one's fear. The perceptualist must posit a complex intentional object where the fear itself is evaluated as shameful, risking an infinite regress of evaluative experiences. The conativist handles this smoothly as a re-orientation of salience toward one's own bodily state; the shame is a new action-tendency (hiding, shrinking) triggered by the initial fear-profile. Conversely, objectless-but-situated states like caffeine dread or manic elation devastate the perceptual view. If there is no object presented as dangerous or good, there is no perception of value, forcing the perceptualist to posit obscure intentional objects. The conativist thrives here; the bodily reorganization and urgency are present even without a target, with the object fixed retrospectively by whatever the body latches onto.

  The double dissociation between motivational anesthesia and affective blindsight offers the sharpest test. In motivational anesthesia, the subject reports the full evaluative experience of fear but lacks any urge to flee. The perceptualist accepts this as akrasia; the conativist denies it is truly fear, viewing it as a detached judgment. In affective blindsight, the subject exhibits avoidance and vigilance but reports no sense of threat. The conativist claims this is genuine emotion without consciousness; the perceptualist excludes it, insisting emotion requires the experiential presentation of value. Regarding inert objects, such as grief at the heat death of the universe, the perceptualist relies on imagination to supply the quasi-perceptual content. The conativist struggles, as there is no action to prepare for; they must argue these are degenerate cases where the action-tendency is suspended or purely symbolic.

  I add a fifth case: emotional cultivation. If I train myself to stop feeling disgust at a specific food through repeated exposure, the perceptualist says I have changed my evaluative judgment about the food's properties. The conativist says I have recalibrated my bodily sensitivity and action-readiness. The former implies I learned something true; the latter implies I merely adjusted a tool.

  ### Verdict and Meta-Philosophical Reflection

  The perceptual program is more promising for preserving the normative force of emotions and their role in rational justification. It explains why we argue about emotions and why recalcitrance feels like a rational failure rather than a mechanical glitch. However, to survive the objectless and blindsight cases, it must bolt on a theory of non-propositional content or accept that some "emotions" are merely affective surds outside the core category. The conative program better captures the phenomenology of arousal and the evolutionary utility of affect, but to handle inert objects and normativity, it must import a separate theory of value judgment to explain why some action-readiness is misguided.

  I would abandon the verdict favoring perceptualism if neuroscientific evidence demonstrated that the neural correlates of evaluative judgment are consistently downstream from the correlates of bodily mobilization. If the brain commits to the action before the value is computed, the claim that experience drives motivation becomes empirically untenable, forcing a conative revision.

  Ultimately, much of the disagreement is substantive, centering on whether normativity is intrinsic to emotion or extrinsic. However, a significant portion stems from divergent explanatory targets. The perceptualist targets the emotion's role in reasoning and justification, treating the body as incidental. The conativist targets the emotion's role in survival and regulation, treating the experience as incidental. Until we agree on whether emotions are primarily tools for truth or tools for life, the collision will remain unresolved. The friend's suggestion that these are complementary descriptions fails because each theory claims its specific target is the essence of the phenomenon, rendering the other derivative.
