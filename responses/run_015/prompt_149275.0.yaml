  Consider the inert-surplus objection. Your friend claims that because the surplus detail does not influence action or memory, it is morally inert. This assumes that value is purely instrumental, that experience matters only insofar as it alters the future. But we do not value pleasure only because it motivates us to seek more; we value it because it feels like something to have it. Similarly, the richness of Ada's experience is not a tool for navigation; it is a mode of being. The surplus detail is not like unused pixels on a sensor; it is like the difference between seeing a landscape in high definition versus through a foggy lens. Even if both viewers reach the same destination, the one who sees more inhabits a richer world. Morality tracks harm and benefit, and these are modulations of experience. A system with a greater capacity for experience has a greater surface area for harm and benefit, even if the functional outputs remain constant. The surplus is not inert phenomenally, and since phenomenology is the seat of value, the surplus is not inert morally. To treat it as inert is to assume that the only thing that matters about pain is that it stops us touching fire, rather than the suffering itself.

  The sign-indeterminacy objection posits that brain size is an unreliable metric because larger brains can be slower, trading resolution for frequency. This is a valid concern for general heuristics across diverse species, but it misses the point of the specific metaphysical claim. We are not arguing that size is always a perfect proxy for value in every conceivable biological design. We are arguing that where size constitutes richness, it carries moral weight. In the gated-channel case, the size difference is stipulated to produce the richness difference. The trade-off does not negate the value of the richness when it exists; it merely complicates the measurement. The moral relevance lies in the experiential magnitude, and since brain size is the physical constituent of that magnitude in this case, size is relevant. The instability of the correlation in other cases does not erase the causal link in this one. We are not proposing a universal rule for all biology, but a principle of moral metaphysics.

  Finally, the proxy objection suggests that if richness matters, size is merely a sign, not the source. This relies on a dualist intuition that experience is separable from its physical implementation. If physicalism is true, experience is not a ghost hovering over the brain; it is an activity of the tissue. To value the experience is to value the physical process that generates it. When capacity is held fixed, the only variable accounting for the difference in moral weight is the physical scale of the implementing machinery. Thus, brain size is not merely a sign of value; it is the physical locus of that value. To discount the tissue is to discount the very stuff of which the mind is made. If the mind is the brain doing something, then more brain doing that something means more mind.

  Ultimately, the capacity orthodoxist reduces beings to their outputs. But moral consideration is owed to beings for what they are, not merely for what they do. Ada's larger brain supports a more voluminous existence. To deny this is to deny that the intensity of life matters independently of its utility. If we accept that consciousness matters, we must accept that the quantity of consciousness matters. Since neural scale determines that quantity where capacities are fixed, neural scale matters in its own right. We must recognise that the weight of a being is not just in its reach, but in its depth. The friend's view protects us from counting tissue for no reason, but it risks ignoring the very substance of experience. We should not fear attributing value to the physical ground of consciousness, for without it, there is no consciousness to value.

