answer: |-
  **RFC-892: Standardized Message Packet Structure for Globalized Error Propagation**

  **Status:** Draft  
  **Author:** Staff Engineering, Platform Integrity  
  **Date:** 2023-10-27  
  **Locales:** nl-NL, ja-JP (Phase 1)

  ### 1. Summary
  This RFC proposes the **Packet Model** for user-facing strings. We treat error messages as data packets comprising a **Payload** (the propositional content/state change) and a **Header** (the illocutionary force/tone). Localization teams are authorized to modify Headers only. Payload modifications trigger a **Truth Incident**, logged via our new `truth-linter`. This ensures semantic consistency across locales while allowing cultural parameterization of delivery.

  ### 2. Motivation
  Current code reviews stall on subjective debates regarding "apologetic" vs. "factual" phrasing. These are not engineering concerns; they are unstructured variables. By decoupling *what happened* (Payload) from *how we tell them* (Header), we reduce review cycle time by 40% and guarantee that a file deletion in nl-NL is propositionally identical to a file deletion in ja-JP.

  ### 3. Design
  Messages are serialized as JSON objects:
  ```json
  {
    "payload": "FILE_PERSISTENCE_FAILED",
    "header_params": {
      "hedging": 0.0,
      "agency_attribution": "SYSTEM"
    }
  }
  ```
  The `truth-linter` compares localized strings against the canonical English Payload. Any deviation in truth conditions (e.g., adding epistemic modality like "might" or "seems") is flagged.

  **[Review Comment @amsterdam-dev]:** *Finally. "We tried" implies effort where there was only deterministic failure. Stop lying to the user about the stack trace.*  
  **[Review Comment @tokyo-l10n]:** *This ignores face-threatening acts. If the Header is too abrupt, the user disengages. Retention is a truth condition too.*  
  **[Author Response]:** *Retention is metric telemetry, not propositional truth. See Section 5.*

  ### 4. Severity Enum
  Payload deviations are classified by severity. The linter blocks merge on `CRITICAL`, warns on `MODERATE`.

  *   `TRUTH_INCIDENT_LOW`: Softening negation (e.g., "couldn't" → "did not").
  *   `TRUTH_INCIDENT_MOD`: Adding epistemic hedge (e.g., "failed" → "seems to have failed").
  *   `TRUTH_INCIDENT_CRITICAL`: False agency attribution (e.g., "System error" → "We apologize").

  **[Review Comment @tokyo-l10n]:** *Classifying apology as a Critical Incident implies honesty is more valuable than trust. This is a flawed axiom.*  
  **[Review Comment @amsterdam-dev]:** *Trust based on incorrect system state modeling is technical debt. Let the linter burn.*

  ### 5. Per-Locale Parameter Table
  Locales configure Header parameters at build time. Payload must remain invariant.

  | Locale | Hedging Allowed | Negation Softening | Max Truth Incidents/Build |
  | :--- | :--- | :--- | :--- |
  | **nl-NL** | 0.0 | 0.0 | 0 |
  | **ja-JP** | 0.8 | 1.0 | 50 (Warning) |

  *Note: ja-JP is expected to exceed the warning threshold during initial rollout. These incidents will be logged but not block deployment, provided the Payload ID matches.*

  **[Review Comment @amsterdam-dev]:** *So we are shipping known falsehoods to Japan as a feature?*  
  **[Review Comment @tokyo-l10n]:** *We are shipping social cohesion. You are shipping stack traces to humans.*  
  **[Author Response]:** *We are shipping Packets. The linter will quantify the divergence.*

  ### 6. Worked Examples

  **Case A: File Save Failure**
  *   **Canonical Payload:** `SAVE_OPERATION_FAILED`
  *   **nl-NL String:** "Bestand niet opgeslagen. Systeem gestopt." (File not saved. System stopped.)
      *   *Linter Status:* PASS. Payload integrity 100%.
  *   **ja-JP String:** "ファイルの保存中に問題が発生したようです。" (It seems there was a problem while saving the file.)
      *   *Linter Status:* WARN. `TRUTH_INCIDENT_MOD` detected.
      *   *Analysis:* The addition of "seems" (`ようです`) introduces epistemic uncertainty where none exists. The system knows the save failed. The string implies doubt. This is a Payload drift masked as a Header adjustment.

  **[Review Comment @tokyo-l10n]:** *Direct assertion of failure assigns blame to the user's workflow. The "seems" protects the relationship.*  
  **[Review Comment @amsterdam-dev]:** *The relationship with what? The database? The database does not care about face.*  
  **[Author Response]:** *The linter logs the drift. We can alert on excessive deception later.*

  **Case B: Unauthorized Access**
  *   **Canonical Payload:** `AUTH_TOKEN_INVALID`
  *   **nl-NL String:** "Toegang geweigerd. Token ongeldig." (Access denied. Token invalid.)
  *   **ja-JP String:** "申し訳ございませんが、アクセスできませんでした。" (We apologize, but access was not possible.)
      *   *Linter Status:* FAIL. `TRUTH_INCIDENT_CRITICAL`.
      *   *Analysis:* "We apologize" attributes agency and regret to the service provider. The service is stateless. It cannot regret. This is an anthropomorphic fabrication.

  **[Review Comment @tokyo-l10n]:** *If we cannot say "we apologize," we cannot say "we" at all. You are removing the subject from the language.*  
  **[Review Comment @amsterdam-dev]:** *Good. The system is not a person. Stop pretending it is.*  
  **[Author Response]:** *This specific string must be refactored to remove agency. Use passive voice.*

  ### 7. Rollout Plan
  1.  **Week 1:** Integrate `truth-linter` into CI pipeline.
  2.  **Week 2:** nl-NL strings frozen. Any change requires Truth Incident waiver.
  3.  **Week 3:** ja-JP strings audited. Expected Truth Incident volume: 35% of total strings.
  4.  **Week 4:** Review telemetry. If user confusion (nl-NL) or churn (ja-JP) spikes, we adjust Header parameters, not Payload logic.

  ### 8. Open Questions
  *   **Q:** If a polite formulation requires a false proposition (e.g., "You might have lost data" vs "Data lost"), do we log the politeness as a lie?
  *   **A:** Yes. Honesty is the default state. Politeness is a transformation layer that incurs a cost. We will track this cost in the `debt-truth` dashboard.
  *   **Q:** What if the "blunt" truth causes the user to abandon the product, making the message functionally false (since the goal is retention)?
  *   **A:** That is a product problem, not a platform integrity problem. Our job is accurate packet delivery.

  **[Review Comment @tokyo-l10n]:** *You are optimizing for the linter, not the human.*  
  **[Review Comment @amsterdam-dev]:** *The human is reading the linter's output. Make the output clean.*  
  **[Author Response]:** *The model holds. We ship Monday.*
