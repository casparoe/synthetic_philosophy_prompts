answer: |-
  You have put your finger on a set of tensions that are widely acknowledged within the community, though they are not always aired publicly in grant memos. What you are observing is the operationalisation of a specific ethical framework—primarily welfarist consequentialism—combined with a heavy dose of epistemic caution.

  To answer your questions directly: the package presupposes that the primary moral currency is individual welfare (often proxied by income or health), that we have a duty to maximise this welfare, and that we should only act on evidence that meets a high bar of statistical rigour.

  Here is a breakdown of what is strictly required by this framework, what merely sits comfortably with it, and where the genuine fault lines lie.

  ### 1. Cash as the Yardstick: Convention or Substance?

  Using unconditional cash transfers (UCTs) as the counterfactual baseline is **partly a convention of comparability, but it rests on a substantive view of value.**

  *   **What is required:** To claim you are doing the "most good," you must compare your intervention against the next best alternative use of funds. Since cash is the most fungible resource, it is the logical opportunity cost. If you cannot beat cash, you should arguably just give the money away.
  *   **What is substantive:** This approach assumes that income is a robust proxy for welfare. It presupposes a **welfarist** view (what matters is how well people's lives go) rather than a **rights-based** or **capabilities** view (what matters is justice, autonomy, or structural power), although cash often scores well on those metrics too.
  *   **Settled vs. Contested:**
      *   **Settled:** Among global development funders (e.g., GiveWell), cash is the standard baseline for near-term human welfare.
      *   **Contested:** Among the broader effective altruism (EA) movement, this is disputed. "Longtermists" argue that cash is a poor baseline for interventions aimed at reducing existential risk (e.g., AI safety or pandemic preparedness), where the "multiple of cash" metric breaks down entirely. Furthermore, some development economists contest whether cash *always* maximises welfare compared to specific public goods.

  ### 2. The Preference for Measurability: Moral Claim or Bureaucratic Artefact?

  The preference for randomised controlled trials (RCTs) and clean metrics is **primarily an epistemic claim (about knowledge), but it functions as a bureaucratic filter.**

  *   **What is required:** The framework requires *comparability*. To allocate capital efficiently across different causes, you need a common denominator (e.g., cost per DALY averted). Without a number, you cannot mathematically maximise.
  *   **What sits comfortably:** It is undeniable that professionalised foundations require defensible decision-making processes. Relying on "plausible stories" exposes grant officers to accusations of bias or whim. Therefore, the demand for metrics is partly a risk-management strategy for the funder, not just a moral imperative for the recipient.
  *   **Settled vs. Contested:**
      *   **Settled:** There is agreement that evidence is preferable to guesswork.
      *   **Contested:** There is a fierce debate about **type S and type M errors** (sign and magnitude). Critics argue that by funding only what is easily measurable, the community suffers from the "streetlight effect"—looking for keys only where the light is good. Many senior figures admit this is a weakness, arguing that we ought to fund "cause areas" with high uncertainty but massive upside (e.g., policy reform), even if they lack RCTs. The fact that this *hasn't* changed significantly is less a philosophical commitment and more an institutional inertia.

  ### 3. Cash Knows Best vs. Nets Need a Nudge: Inconsistent?

  This pairing appears contradictory, but it is **logically consistent within a market-failure framework.**

  *   **The Resolution:** The argument is not that donors always know better than recipients. It is that **markets for health interventions are imperfect.**
      *   **Cash:** Assumes a functioning market where the recipient knows their needs and can purchase goods efficiently.
      *   **Nets/Deworming:** Assumes market failures. These include **positive externalities** (my net protects you), **information asymmetry** (I don't know this pill prevents worms), or **liquidity constraints** (I would buy it, but not *today*, and the disease risk is *today*).
  *   **What is required:** You must accept a degree of "soft paternalism." You are overriding revealed preference (what they chose) for constructed preference (what they would choose with perfect information/coordination).
  *   **Settled vs. Contested:**
      *   **Settled:** Most agree that public health goods often require subsidy due to externalities.
      *   **Contested:** The *degree* of paternalism. Some argue that if people aren't buying nets, perhaps they have better uses for the money (e.g., food), and the donor's valuation of "health over food" is an imposition. The consensus holds that the evidence of health benefits is so overwhelming that it justifies the nudge, but this is a value judgement, not a mathematical proof.

  ### 4. What Would Change if the Implicit View Swapped?

  If you moved away from this welfarist, metric-heavy model towards a **structural or participatory model**, the funding practice would look radically different.

  *   **From Cost-Effectiveness to Power:** Instead of asking "How many DALYs per pound?", you would ask "Does this shift power dynamics?" or "Does this build local institutional capacity?"
  *   **From Metrics to Trust:** You would fund organisations based on their track record and local legitimacy rather than specific project metrics. This looks more like general support grants (core funding) rather than project funding.
  *   **From Global Benchmarks to Local Priorities:** The "cash baseline" would be replaced by "community-defined priorities." You might fund political organising or litigation, where the outcome is binary (win/lose) and not easily expressed as a multiple of cash.
  *   **Risk Appetite:** You would likely fund more high-variance bets. The current model minimises the risk of wasting money; a systemic model might accept a high failure rate in exchange for the possibility of transformative structural change.

  ### Summary for your Board

  To synthesise this for your foundation's purposes:

  1.  **The Cash Baseline** is a tool for **opportunity cost**, not a statement that money is the only thing that matters. It is settled for global health, contested for systemic change.
  2.  **The Metric Bias** is largely an **artefact of accountability** and the desire for comparability, rather than a moral claim that unmeasurable things have no value. It is a heuristic for confidence, not a definition of goodness.
  3.  **The Cash/Nudge Tension** is resolved by **market failure theory**. It is consistent provided you accept that health markets are imperfect.
  4.  **The Blind Spot:** The current model systematically underfunds public goods (policy, research, movement building) because they are hard to attribute to a single donor and hard to measure in the short term.

  If your foundation wishes to remain within the "serious funder" consensus, you must accept the cash baseline and the demand for evidence. However, if you wish to address the blind spots, you might consider earmarking a portion of your portfolio for "high-trust, low-metric" grants, explicitly acknowledging that this is a higher-risk, different-philosophy sleeve of your funding. This allows you to participate in the consensus whilst hedging against its known limitations.
