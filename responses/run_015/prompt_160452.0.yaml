          *   *Deeper Objection:* It assumes the state has the money to front the stake. If financed by general taxation, it's just redistributing from current residents to new entrants. It doesn't solve the "pool" problem; it socializes the entry cost. Also, what prevents the migrant from borrowing against the vested account?
          *   *Refinement:* Focus on the "pricing" claim. Can the state actually price the risk accurately? If they underestimate the vesting time needed, the pool still bleeds. It looks like a deferred benefit, not a true bond.

      *   *Question 4: Weakest Premise.*
