  2.  **Analyze the Notes (The Argument):**
      *   *Note 1:* Decomposition. Immigration policy isn't one switch; it's three (Entry, Welfare, Vote). The tension between open borders and welfare is mostly about Welfare, not Entry. Confusion arises from assuming they move together.
      *   *Note 2:* Adverse Selection. It's not about poor people taking benefits; it's about timing (claiming when value is highest). Problem depends on benefit *shape*, not migrant *number*.
      *   *Note 3:* Monitoring/Epistemic Argument. Redistribution relies on trust (signals of effort/shirking). High inflow degrades signals (accent, history). It's about *rate* of arrival, not *stock*. Solution: Universal benefits (less monitoring needed) vs. Means-tested (more monitoring needed).
      *   *Note 4:* Vesting Stake Remedy. State deposits lump sum on arrival. Vests over time. Reverts if leaving early. Turns "drawing" into "accruing." Prices risk without excluding the poor.
      *   *Note 5:* Brain Drain/Upbringing Objection. Importing productive years vs. dependent years is a loss for sender, gain for receiver. User thinks this applies to skilled recruitment, not open borders generally.

  3.  **Drafting Objections (Iterative Process):**

      *   *Question 1: Note 1 (Decomposition).*
          *   *Idea:* Can you really separate entry and welfare? If someone is physically there, emergency care, schooling for kids, police protection are unavoidable claims.
          *   *Objection:* "Formal entitlement" vs. "Physical necessity." Even if you legally bar migrants from welfare, a sick child in an ER gets treated. A crime victim gets police protection. These are tax-funded. So entry *implies* some welfare cost regardless of the legal setting. The settings aren't fully separable because physical presence creates moral and practical liabilities that translate into fiscal claims.
          *   *Refinement:* Focus on the "leakage." You can't build a perfect wall around the welfare state once someone is inside the labor market.

