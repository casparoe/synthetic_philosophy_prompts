          *   *Opposing Defender:* They would attack Note 2. They would say income level *does* matter because low-income people contribute less tax relative to potential usage, regardless of timing. The "adverse selection" model assumes migrants are rational calculators of welfare timing, which might be empirically false. Most migrate for work, not welfare.
          *   *Decision:* The weakest link is likely the empirical assumption in Note 2 that migration is driven by welfare timing rather than wage differentials.

      *   *Question 5: Empirical Assumptions.*
          *   *List:*
              1.  Migrants calculate welfare vesting periods (Note 2/4).
              2.  Trust is based on "hard-to-fake signals" like accent (Note 3).
              3.  Universal benefits require less monitoring/trust than means-tested (Note 3).
              4.  The state can accurately price the "residual risk" in the vesting scheme (Note 4).
              5.  Physical presence doesn't inevitably lead to welfare claims (Note 1).

  4.  **Review and Refine Tone:**
      *   Must be respectful of the user's self-taught status (the arguments are actually quite sophisticated).
      *   Must avoid academic jargon where possible (or explain it).
      *   Must strictly follow the "no citations" rule.
      *   Must focus on *objections* and *breaking points*, not praise.

  5.  **Final Polish (Self-Correction during drafting):**
      *   *Check:* Did I answer the specific bullet points? Yes.
      *   *Check:* Did I avoid reading lists? Yes.
      *   *Check:* Is the tone appropriate? Needs to be rigorous but encouraging of the logic itself.
      *   *Correction on Note 4:* The economist's objection shouldn't just be "it costs money." It should be about *incentives*. If the stake is large, does it encourage fraud? If it's small, does it fail to deter?
      *   *Correction on Note 1:* Make sure to highlight the "emergency" loophole. You can't let people starve or die on the street without political cost, which translates to fiscal cost.

