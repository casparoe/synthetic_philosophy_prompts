          *   *Objection:* Is "shared reference points" just a polite way of saying "cultural similarity"? If the signal is "accent," that's cultural/ethnic. If the mechanism is "I trust you because you are like me," isn't that just the diversity argument re-skinned? The distinction between "I can't tell if you're shirking" (epistemic) and "I don't trust you because you're different" (prejudicial/solidarity) might collapse in practice.
          *   *Refinement:* Challenge the purity of the "epistemic" claim. Signals like accent are proxies for culture. If the signal degrades, trust degrades. That *is* the diversity argument.

      *   *Question 3: Note 4 (Vesting Stake).*
