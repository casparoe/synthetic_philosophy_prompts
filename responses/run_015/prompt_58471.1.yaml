      Scenario 2 Worst Off: New Tutors (less pay/harder work).
      Is "No Club/Failing Classes" worse than "Less Pay/Harder Work"? Yes. Therefore, Option 2 benefits the "worst off" (in the collapse scenario) more than Option 1. This satisfies the Difference Principle.

