  1. Students receive a one-page briefing on Europe circa June 30, 1914, and anonymously write a percentage probability of "General War within one month" on an index card, which is collected and redistributed so no one holds their own. Each pair then receives eight event cards from the July Crisis and must arrange them twice, avoiding the memory-test and opposite-outcome mechanics I rejected for conflating embarrassment with reconstruction and trivializing narrative, by first constructing the tightest causal chain making war look inevitable and second highlighting three specific junctures where peace was historically viable.

  2. Minutes 0-20 cover the briefing and anonymous probability writing, followed immediately by the card swap and a five-minute silent estimation of the redistributed card's optimism. Minutes 20-65 are dedicated to the pair work on event sequencing, with the specific diplomatic sequence revealed via projector exactly at minute 35 to interrupt their first arrangement attempt. The final twenty-five minutes are reserved for the large-group debrief, ensuring the specific sequence reveal happens after they have committed to an initial ex-ante probability but before they finalize their inevitability chains.

  3. You will map the anonymous probability estimates to ex-ante foreseeability, showing the room's aggregate skepticism despite the known outcome. The two distinct event arrangements will then be compared to separate ex-post explicability, which remains constant across both, from ex-post inevitability, which shifts based on their narrative ordering. Finally, you will introduce the labels for hindsight bias and narrative fallacy only after they have articulated the tension between the low probability they assigned and the high inevitability they constructed.

  4. Students may treat the event cards as a puzzle with a single correct solution, so you must explicitly grade the task on argumentative coherence rather than historical accuracy during the instructions. Another predictable failure is that students will ignore the swapped probability card, which you must mitigate by requiring them to write a one-sentence justification for their estimate of the peer's mindset on the back of the card. If the discussion stalls on the inevitability chain, you should intervene by asking pairs to identify the single event that, if removed, collapses their causal story.

  5. This activity cannot reproduce the visceral anxiety and genuine uncertainty of the historical actors, as the students operate in a safe, air-conditioned seminar room. You will therefore have to supply the affective dimension in the last five minutes by reading contemporaneous diary entries that express confusion rather than clarity. This ensures they understand that the separation of foreseeability and inevitability is an analytical tool, not a description of the lived experience.
