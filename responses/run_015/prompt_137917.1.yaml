  (1) Split access into access-for-report (broadcast to whatever supports verbal or symbolic report) and access-for-control (broadcast to action-selection and task-set systems). Then ask whether a workspace state could get into control but never into report — and if it could, whether the access theorist is committed to calling it conscious. My sense is this re-cuts both the partial-report/overflow literature and blindsight.

  (2) Treat ignition as a graded, time-dependent quantity: how long does a representation have to sit in the workspace before it's phenomenally conscious? If there's a real occupancy-duration threshhold instead of a clean architectural line, what happens to the access/phenomenal distinction?

