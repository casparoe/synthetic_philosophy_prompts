answer: |-
  You have identified the central tension in German church-state relations, often described by legal scholars as the system of **"cooperative separation"** (*hinkende Trennung* or *hinkende Trennung von Staat und Kirche*). Unlike the American "wall of separation" or the French *laïcité*, the German model does not view the state and religious communities as strangers. It views them as partners.

  Here is my committed reading of the implicit theory behind the *Kirchensteuer*, followed by the distinctions you requested.

  ### The Implicit Theory: Religion as a Public Corporation

  The arrangement presupposes that recognized religious communities are not merely private voluntary associations, nor are they departments of the state. They are **Corporations under Public Law** (*Körperschaften des öffentlichen Rechts*).

  This is the linchpin. In German legal theory, a "corporation under public law" is an entity that performs public functions and is granted sovereign powers by the state (like the right to tax its members), but remains self-governing. By granting churches this status, the state implicitly theorizes religion as a **stable, institutionalized social force that contributes to the public good** (social welfare, education, moral cohesion) and therefore deserves a secure financial base independent of the fluctuating charity of its members.

  **1. View of the Religious Community: A Quasi-Sovereign Partner**
  The system rejects the "voluntary club" model. If churches were mere clubs, the state would have no business collecting dues for them. It also rejects the "established church" model, as the state does not dictate doctrine. Instead, it treats the church as a **quasi-sovereign partner**. The state lends its coercive power (tax collection) to the church because it recognizes the church as a legitimate authority over a segment of the population. This is why the state decides who qualifies: it is vetting for stability, loyalty to the constitutional order, and administrative capacity, not theological truth.

  **2. View of Membership: Civil Status, Not Practice**
  The system treats religious membership as a **legal status akin to citizenship or marital status**, not as a measure of belief or attendance. This is why infant baptism binds you. In this theory, you are born into a cultural-legal community. Your membership is objective and recorded in a registry (*Melderegister*). It persists until you perform a legal act to sever it (*Kirchenaustritt*).
  *   **Why this makes sense internally:** If membership were based on belief or attendance, the state would have to interrogate your soul or track your whereabouts to assess the tax. That would violate neutrality. By making it a binary legal status, the state remains "blind" to your piety. It only sees your registration. This is the only way the state can collect the tax without violating its own rule of not judging religious content.

  **3. View of State Neutrality: Parity, Not Distance**
  You noted the contradiction between neutrality and state enforcement. The German theory resolves this by defining neutrality as **parity** (*Parität*), not distance. The state is not neutral by ignoring religion; it is neutral by treating all *recognized* religious communities equally. If the Catholic Church gets tax collection, the Protestant Church must get it. If the Jewish Community asks and qualifies, they get it. If a Secular Humanist group qualifies, they get it (and some have). Neutrality means the state does not favor one *qualified* group over another, not that the state refuses to deal with them.

  **4. View of Religion: Organized Worldview**
  The system presupposes that "religion" is an **organized, comprehensive worldview** capable of administrative structure. It is not about private spirituality. This is why the state can decide which groups qualify. The state asks: "Do you have a constitution? Do you have a defined membership? Do you guarantee loyalty to the state?"
  *   **The Secular Test:** If a group organized around an avowedly secular worldview (e.g., Humanists) asked for this machinery, the practice's logic **does not forbid it**. In fact, several "Freireligiöse" (free religious) and Humanist associations in Germany *have* been granted this status and collect "humanist tax" in certain regions. The logic holds: if you function as a public corporation providing ethical community and social services, you qualify. The barrier is not theism; it is organizational stability.

  ### Presupposition vs. Historical Compromise

  You asked to distinguish what is strictly necessary from what is merely accidental.

  **Strictly Presupposed (The Logic):**
  1.  **State Collection:** If the church is a public corporation, it must have the power to levy dues. Since modern states monopolize taxation, the state must collect these dues to make them effective.
  2.  **Binary Membership:** To avoid state inquiry into belief (which would violate neutrality), membership must be a matter of public record, not private conviction.
  3.  **Formal Exit:** If entry is a legal status, exit must be a legal act. Informal drifting away cannot dissolve a tax liability.

  **Merely "Sits Well" / Underdetermined (The Compromise):**
  1.  **The Exit Fee:** Charging a fee (often €30–€100) to leave the church is not logically required by the theory. It is a bureaucratic deterrent, a historical hangover intended to discourage impulsive exits. It sits well with the state's interest in stability, but it is not a necessary feature of "public corporation" status.
  2.  **Infant Registration:** While the theory requires membership to be a status, it does not *strictly* require that status to be assignable by parents at infancy. It could theoretically be an opt-in status at adulthood. The current system is a **historical compromise** from an era when church and civil registry were nearly identical. It persists due to path dependence, not logical necessity.
  3.  **The Tax Rate:** The 8–9% surcharge is arbitrary. It could be a flat fee or a different percentage. It is a fiscal negotiation, not a philosophical requirement.

  ### Coherence vs. Stability

  Is the arrangement coherent or merely stable?

  **My Verdict:** The arrangement is **structurally coherent within its own paradigm, but normatively fragile in a modern liberal context.**

  It is **coherent** because all the parts fit the "Public Corporation" model.
  *   If churches are public partners, they need public funding.
  *   If the state collects it, it needs a clear list of who belongs (registry).
  *   If the list is legal, entry and exit must be legal acts.
  *   If the state supports them, it must support all equally (parity).
  There are no internal contradictions *if* you accept the premise that religion is a public, institutional function rather than a private right.

  However, it is **merely stable** in the broader sense of political philosophy. It relies on a specific German historical consensus (the post-*Kulturkampf* peace treaty between Bismarck and the Catholic Church, codified in Weimar and carried into the Basic Law) that is increasingly at odds with globalized, individualistic notions of liberty.
  *   **The Fragility:** The system assumes people view their religious affiliation as a serious legal identity comparable to nationality. As society becomes more secular and individualistic, people view religion as a consumer choice. When the "cost" of exit (the fee, the bureaucracy, the social stigma) feels like a penalty on freedom of conscience, the legitimacy of the system erodes. The coherence breaks down when the "members" no longer agree with the theory that they are members at all.

  ### Counterfactuals: What Would Have to Change?

  **1. If replaced by a Strict Voluntarist View:**
  *   **Theory:** Religion is a private contract.
  *   **Changes:** No state registry of religion. No automatic entry at birth. No state collection of dues. Churches would send their own bills. You would "opt-in" to membership as an adult. The state would have no role in defining who is a member.
  *   **Consequence:** Church revenue would likely plummet. Small, unstable sects might vanish. The church's role in public welfare (running kindergartens, hospitals) would need separate state contracts, decoupled from membership.

  **2. If replaced by a Strict Separationist View (US Model):**
  *   **Theory:** Religion is a private matter; state involvement corrupts both.
  *   **Changes:** The state would be forbidden from collecting religious dues. The registry of religious affiliation at the town hall would be abolished (as it violates data privacy regarding belief). The "Public Corporation" status would be revoked; churches would become private non-profits (*e.V.*).
  *   **Consequence:** Total financial separation. The state would likely have to increase direct funding for social services currently provided by churches to ensure they remain available, or those services would shrink.

  ### Summary

  The German system is not a mistake; it is a deliberate **corporatist technology**. It presupposes that religion is too important to be left to the free market of belief, but too dangerous to be controlled by the state. So, it is made a **licensed public utility**.

  The incoherence you feel comes from importing a **liberal-individualist framework** (where belief is private and voluntary) into a **corporatist-statist framework** (where belonging is a public status). Within the German framework, the system works perfectly. The state remains neutral on *truth*, but partisan on *structure*. It supports the *institution* of religion, not the *content* of faith.

  The system is stable because it is constitutionally entrenched and financially convenient for the state (which outsources welfare to churches). But it is coherent only as long as the population accepts the premise that they are citizens of their church, not just customers. As that premise fades, the system will likely remain stable for a long time due to inertia, but it will feel increasingly anachronistic to those, like yourself, observing it from the outside.
