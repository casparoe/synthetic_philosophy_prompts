answer: |-
  This is an exceptionally sharp methodological problem, and you are right to identify it as a gap in the standard exegesis of Lakatos. You have put your finger on a tension between the *internalist* logic of the Methodology of Scientific Research Programmes (MSRP) and the *ecological* reality of competing traditions. Standard MSRP evaluates a sequence of theories ($T_1, T_2, T_3...$) within a single programme. It asks: "Does $T_2$ have excess empirical content over $T_1$?" It does not typically ask: "Did $T_2$ get that content from Programme B?"

  Because MSRP is designed to protect the rationality of theory choice from sociological noise, it lacks a built-in ledger for *provenance*. Below I address your four points, drawing on the refinements made by Lakatos's successors (particularly Zahar and Worrall) and proposing a conceptual framework for your chapter.

  ### (a) Established Concepts and Literature

  There is no single canonical term in the Lakatosian corpus that precisely captures *inter-programmatic content annexation*. However, there are three adjacent concepts in the literature that you must engage with to position your contribution.

  1.  **Heuristic Novelty (Elie Zahar):**
      *   *The Concept:* In *Einstein's Revolution* (1973), Zahar refined Lakatos's notion of "novel fact." He distinguished between *temporal novelty* (the fact was discovered after the theory was proposed) and *heuristic novelty* (the fact was not used in the construction of the theory). Zahar argued that only heuristically novel facts provide significant corroboration.
      *   *The Difference:* Zahar's criterion is still largely internalist. It asks: "Was this fact used to construct *this* theory?" In your cases, the borrowing programme constructs its new theory *using* the rival's results. A strict Zaharian reading might classify this as **non-novel** (because the fact *was* used in the construction of the new theory, even if by way of import). However, standard MSRP appraisals often revert to temporal novelty relative to the *programme's* previous theory ($T_1$), which is where your problem arises. Your case extends Zahar by requiring **Inter-Programmatic Heuristic Novelty**: Was the fact used in the construction of *any* extant rival theory?
  2.  **Independent Support (John Worrall):**
      *   *The Concept:* Worrall (e.g., "Fresnel, Poisson and the White Spot," 1989) emphasizes that for a prediction to count as progressive, the evidence must be independent of the assumptions that generated it.
      *   *The Difference:* Worrall focuses on the logical relation between theory and evidence within a programme. Your case concerns the *sociological/historical* relation between two programmes. Worrall's framework blocks "tacking" (adding an unrelated hypothesis to save a core), but it does not explicitly block "importing" (adding a related hypothesis from a rival).
  3.  **Problem-Weighting (Larry Laudan):**
      *   *The Concept:* In *Progress and Its Problems* (1977), Laudan argues that we should count the number and importance of problems solved. He briefly acknowledges that solving a problem already solved by a rival counts for less than solving a unique problem.
      *   *The Difference:* Laudan's metric is explicitly comparative and global, whereas Lakatos's is sequential and internal. Your difficulty arises because you are trying to use a Lakatosian (sequential) metric to capture a Laudanian (comparative) phenomenon.

  **The Closest Label:** In informal philosophy of science and science studies, this is often called **"Theoretical Free-Riding"** or **"Parasitic Progress."** However, these are pejorative descriptions, not technical appraisal categories. There is no neutral, established term like "Ad Hocness" for this specific maneuver.

  ### (b) Vice or Blind Spot?

  It is best understood as a **blind spot in the appraisal metric that enables a sociological vice.**

  *   **The Blind Spot:** MSRP is designed to be internalist to avoid the "context of discovery" contaminating the "context of justification." By focusing only on the $T_1 \to T_2$ relation, it deliberately ignores where $T_2$ got its ideas. This is a feature, not a bug, of the original design, intended to prevent genetic fallacies. However, it creates a blind spot for *ecological* rationality.
  *   **The Vice:** The opportunism you describe is a vice of the scientific community (or the specific researchers). It is a form of **credit misappropriation**.
  *   **Can they come apart?** Yes.
      *   *Blind Spot without Vice:* A programme might legitimately import a formalism because the hard core is underdetermined regarding mathematical implementation. If the core *permits* the import without being contradicted, and the import allows the core to be applied to new domains, this might be genuine progress (see boundary case 1 below).
      *   *Vice without Blind Spot:* If the metric were amended to detect provenance, the opportunism would be visible. Currently, the metric's inability to see provenance *constitutes* the opportunity for the vice.

  For your chapter, you should argue that a robust MSRP appraisal *must* be ecological. A programme cannot be appraised in a vacuum; its progressiveness is partly a function of its relation to the ecosystem of rival programmes.

  ### (c) Amending Lakatos's Criteria

  You can amend the criteria without collapsing into the requirement that *every* prediction trace to the hard core (which is indeed impossible). The amendment lies in **weighting the corroboration** based on **heuristic autonomy**.

  **Proposed Amendment: The Provenance Weighting Condition.**
  A theory $T_2$ in Programme P is theoretically progressive over $T_1$ only if the excess empirical content is **heuristically autonomous** with respect to the field.
  *   **Full Weight:** Content predicted by $T_2$ derived from P's positive heuristic.
  *   **Reduced Weight:** Content predicted by $T_2$ derived from formalisms/methods imported from Rival R.
  *   **Zero Weight:** Content that was already corroborated by R *and* where $T_2$ offers no new derivation or unification, merely redescription.

  This preserves Lakatos's structure (we are still counting excess content) but modifies the *value* of that content. It avoids the "hard core traceability" trap by allowing imported content to count as *some* progress (it is better than nothing), but not enough to declare the programme fully progressive if it relies on it exclusively.

  ### (d) Coining a Term: "Exogenous Corroboration"

  Since no established term fits, I propose you adopt **"Exogenous Corroboration"** for the neutral description and **"Heuristic Free-Riding"** for the normative appraisal.

  **Definition: Exogenous Corroboration**
  A research programme P achieves Exogenous Corroboration when:
  1.  **Condition of Stagnation:** P is in a degenerating phase (modifications are defensive, no novel content generated endogenously).
  2.  **Condition of Import:** P incorporates a formalism, method, or empirical result $C$ from a rival programme R (or from general instrumental advances).
  3.  **Condition of Novelty:** $C$ counts as "novel" relative to P's previous theory $T_1$ (satisfying standard Lakatosian criteria).
  4.  **Condition of Provenance:** $C$ was already established, predicted, or corroborated within R (or the field) prior to P's incorporation.
  5.  **Condition of Attribution:** Proponents of P cite $C$ as corroboration of P's hard core, without acknowledging the derivative nature of the derivation.

  **Boundary Cases:**

  1.  **Core-Directed Borrowing (Not Free-Riding):**
      *   *Scenario:* P's positive heuristic explicitly directs researchers to seek mathematical tools elsewhere because the core is ontological, not mathematical.
      *   *Verdict:* This is **Endogenous Heuristic Execution**. The *decision* to borrow came from the core. The progress is genuine because the hard core drove the search strategy.
      *   *Evidence:* Internal memos or papers stating, "Our ontology requires a stochastic model; we will adopt X."
  2.  **Vocabulary Import with Re-derivation (Not Free-Riding):**
      *   *Scenario:* P adopts R's terms but derives the results independently from P's own axioms.
      *   *Verdict:* This is **Convergent Progress**. If P can derive R's successes from P's own hard core, that is a massive point in P's favor (showing P is more fundamental).
      *   *Evidence:* Mathematical proofs showing the derivation from P's axioms, not just curve-fitting.
  3.  **Intertranslatability (Bookkeeping):**
      *   *Scenario:* P and R are shown to be notational variants.
      *   *Verdict:* This is **Unification**, not progress for either. The "success" is illusory; it is merely recognizing identity.
      *   *Evidence:* Formal proof of intertranslatability.
  4.  **Instrument-Driven Variant (Separate Concept):**
      *   *Scenario:* Progress follows general instrument improvement (e.g., better fMRI).
      *   *Verdict:* This is **Instrumental Drift**. It belongs under a separate category. Instrumental capacity is a shared resource of the field, not intellectual property of a rival programme. A programme is not "free-riding" for using better telescopes. However, if they claim the *theory* caused the improvement, that is misleading.
      *   *Distinction:* Exogenous Corroboration involves *theoretical* assets; Instrumental Drift involves *technological* assets.
  5.  **Simultaneous Mutual Annexation:**
      *   *Scenario:* P and R both borrow from each other.
      *   *Verdict:* This is **Reciprocal Assimilation**. It signals the breakdown of the rivalry and the emergence of a **Synthesis** or a new hybrid programme. The ledger should stop tracking them as rivals and start tracking the hybrid.

  ### (e) Historical Evidence for Appraisal

  To make the call in your chapter without relying on hindsight, you need to triangulate evidence from three layers:

  1.  **Citational Forensics:**
      *   *Genuine:* The borrowing programme cites the rival's derivation explicitly and frames the new result as an extension or unification ("We show that their result follows from our core...").
      *   *Free-Riding:* The borrowing programme cites the *data* but not the *rival's theory*, or cites the method as "standard" without acknowledging its theoretical origin in the rival camp. Look for "strategic silence."
  2.  **Derivational Independence:**
      *   *Genuine:* Can you trace the mathematical steps in the borrowing programme's papers back to their own hard core assumptions?
      *   *Free-Riding:* Do the papers simply plug the rival's equations into the borrowing programme's variables without justifying *why* those equations fit the new ontology? Look for "formalism without foundation."
  3.  **Rhetorical Timing:**
      *   *Genuine:* Claims of progress are modest ("This tool allows us to apply our theory to...").
      *   *Free-Riding:* Claims of progress are maximal ("This proves our core was right all along").
      *   *Evidence:* Compare the abstract/intro of the "progressive" papers with the internal grant reports or private correspondence (if available) from the period of stagnation. Did they admit they were stuck before the import?
  4.  **The "Lost Letter" Test:**
      *   If the borrowing programme had *not* imported the rival's method, would they have made the prediction?
      *   *Evidence:* Look for failed attempts prior to the import. If they tried to predict the phenomenon using their *own* heuristic for 20 years and failed, then immediately succeeded after importing the rival's tool, the provenance is the cause.

  ### Summary Recommendation for Your Chapter

  You are on solid ground. This is a known weakness in the "pure" Lakatosian model when applied to complex, pluralistic fields.
  1.  **Acknowledge the Gap:** State clearly that standard MSRP is internalist and lacks a provenance ledger.
  2.  **Invoke Zahar/Worrall:** Use their work on novelty to show you aren't inventing the *need* for a fix, just extending it to the inter-programmatic level.
  3.  **Deploy "Exogenous Corroboration":** Use this term to categorize the phenomenon.
  4.  **Apply the Weighting:** Argue that in your case material, the "progress" of the stagnating programme should be discounted because it is exogenous. It saves the programme from falsification (protects the hard core) but does not demonstrate the fertility of the hard core.
  5.  **Distinguish the Instrument Case:** Treat the instrument-driven variant as "Instrumental Drift" to show nuance; don't conflate tool-sharing with theory-borrowing.

  This approach allows you to use Lakatos's framework while correcting its blind spot, which is a significant contribution for a dissertation chapter.
