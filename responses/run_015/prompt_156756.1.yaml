      *   **Deliverables:**
          1.  Prep sheet with ~8 objections (ordered by damage), phrased by committee member, 60-90s reply, note on softness.
          2.  Concessions to make in the first 2 minutes (pre-emptive).
          3.  The "Secret Fear" objection (user thinks they know it, wants to see if I match).
          4.  The "Kill Shot" objection (if unanswered, chapter is dead).

  2.  **Deconstruct the Argument & Committee Perspectives:**

      *   *Supervisor (Old Marxist):* Will attack the departure from orthodox TRPF. If the "scissors" isn't TRPF, what is it? Is it just a restatement? Accusation: Technological determinism (machines drive history, not class struggle).
      *   *Second Reader (Analytic):* Will attack the LTV basis. If value is subjective or prices diverge from values, does the "erosion" matter? Needs a counterfactual: What if automation *increases* profit rates sustainably?
      *   *STS:* Will attack the reification of "the machine." Machines don't "do" things; people use them. Automation is a political choice, not an economic inevitability.
      *   *Labor Soc:* Will attack the empirical fit. Job polarization (high/low skills grow, middle shrinks) contradicts "general degradation." Wages haven't collapsed everywhere; hours haven't necessarily risen everywhere.

  3.  **Drafting the Objections (Iterative Process):**

