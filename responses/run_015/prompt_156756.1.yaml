      *   Must acknowledge the critic's framework (speak their language).
      *   Must identify the "soft spot" (where the reply is weak).

  5.  **Pre-emptive Concessions:**
      *   Don't claim to solve TRPF.
      *   Admit LTV is contested.
      *   Admit automation is a choice (STS).
      *   Admit empirics are mixed (Labor Soc).
      *   *Strategy:* Frame the chapter as a *mechanism* critique, not a *law* proclamation.

  6.  **Identifying the "Secret Fear" and "Kill Shot":**
      *   *Secret Fear:* "This is just the Tendency of the Rate of Profit to Fall (TRPF) with extra steps." (Supervisor).
      *   *Kill Shot:* "If the Labor Theory of Value is false, does your entire 'erosion' argument collapse?" (Analytic). Because the argument rests on "living labor is the only source of new value." If that premise goes, the "scissors" disappears.

  7.  **Drafting the Content (incorporating specific voices):**

      *   *Supervisor:* "You're smuggling in technodeterminism."
