          3.  Politics: Fight over the machine/working day, not just wait for abundance.
          4.  *New Wrinkle:* ML automates the "collective worker's brain" (coordination/knowledge), tightening the scissors.
      *   **Committee Profile:**
          1.  *Supervisor:* Old-school Marxist (Value-form/Monthly Review). Worried about technodeterminism, wants TRPF (Tendency of the Rate of Profit to Fall).
          2.  *Second Reader:* Analytic Marxist (Cohen/Roemer). Skeptical of LTV, wants micro-foundations, falsifiability.
