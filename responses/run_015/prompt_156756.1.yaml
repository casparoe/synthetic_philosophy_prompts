      *   *Objection 8 (General):* Politics. If the mechanism is broken, what's the actual policy?

      *Refining Order:* The "Kill Shot" needs to be high up. The Supervisor's TRPF challenge is existential for a Marxist thesis. The Analytic's LTV challenge is existential for the *logic*. Let's prioritize the TRPF/Determinism mix as high damage, and the LTV/Falsifiability as the "Kill Shot" (because if LTV is dead, the "value erosion" argument makes no sense).

      *Wait, re-reading the prompt:* The user says the Supervisor thinks they are a technodeterminist and wants TRPF. The Analytic thinks LTV is dead.
