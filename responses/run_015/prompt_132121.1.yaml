  **FREQUENTLY ASKED QUESTIONS**

  **Q: What is the vesting period?**
  A: Standard policy requires humanity to survive at least several generations post-mortem. If the line ends with your grandchildren, you experience a total loss of significance. It's not about the death toll; it's about the cancellation of future value.

  **Q: How do you handle branching-risk?**
  A: Our actuarial tables account for asteroid impacts, nuclear exchange, and sterile technology. If the probability of extinction crosses a critical threshold, your sense of purpose is automatically hedged against despair. We mitigate the risk that the chain of human life snaps.

  **Q: Is personal immortality included?**
  A: No. That's a competitor product (and historically poor performance). We focus on the species continuity, not the ego. You die; the project continues. That is the only afterlife that matters for meaning.

  **SIDEBAR: DIGITAL BENEFICIARIES**
