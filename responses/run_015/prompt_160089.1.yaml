answer: |-
  ### Desiderata for Adjudicating Memory and Record

  You are asking for a specification of the problem, not a solution. The following list defines the conditions any adequate account must meet to resolve the conflict between the archival record and the descendants' memory. I have marked each as either a **Non-negotiable** condition of logical coherence or as a **Preference** that aligns with one of the two camps (Archive or Descendants).

  **1. The Provenance and Independence Condition**
  An adequate account must specify the epistemic weight of a document based on its authorship relative to the event described. It cannot treat a ledger created by the removing authority as equivalent to a ledger created by a neutral third party.
  *   **Motivation:** You noted that the ledger cannot corroborate the buyout if the authority accused of the removal wrote it. A record is not just data; it is a speech act by an agent. If the agent is the accused, the record is testimony, not merely evidence.
  *   **Status:** **[Non-negotiable]**. Ignoring provenance is an epistemic error. However, *how much* weight to deduct for lack of independence is contested.
  *   **What it rules out:** It rules out "naive positivism" (the idea that a document is true until physically disproven). It requires that self-serving documents be corroborated by independent evidence to carry the same weight as neutral documents.

  **2. The Morphological Precision Condition**
  An adequate account must distinguish between errors of *detail* (dates, names, sums) and errors of *shape* (the nature of the interaction). A memory can be factually incorrect on details but structurally correct on the shape (e.g., "forced" vs. "sold").
  *   **Motivation:** Oral tradition often degrades on specific data points over generations while preserving the emotional or structural truth of the event. The Archive often wins on details (the ledger balances) while losing on shape (the ledger omits the threat).
  *   **Status:** **[Non-negotiable]**. Collapsing these two categories makes it impossible to explain why the accounts differ without declaring one totally liar and one totally truth-teller.

  **3. The Constitutive Weight Condition**
  An adequate account must acknowledge that for the descendants, this memory is not merely a claim about the past but a practice that constitutes their present community. Overriding the memory is not just correcting a belief; it is disrupting a social bond.
  *   **Motivation:** Distinguishes memory as *testimony* (which can be false) from memory as *identity* (which functions regardless of truth).
  *   **Status:** **[Descendant Preference]**. The Archive camp views this as irrelevant to truth; the Descendant camp views this as a moral constraint on how truth is applied. An adequate account must *include* this factor, but prioritizing it over evidentiary accuracy is a preference.

  **4. The Asymmetry of Harm Condition**
  An adequate account must explicitly weigh the cost of two errors: (A) Officializing a falsehood (preserving a memory that is factually wrong) versus (B) Officializing a silencing (overriding a memory that is factually true).
  *   **Motivation:** You asked if these are symmetric. They are not. Error A repeats a mistake; Error B repeats an injury. Error B validates the power of the remover to define the reality of the removed.
  *   **Status:** **[Contested]**. The Archive camp assumes symmetry (a lie is a lie). The Descendant camp assumes asymmetry (a lie told by the victim about their victimization is morally distinct from a lie told by the victor). An adequate account must take a position here; neutrality is impossible.

  **5. The Functional Differentiation Condition**
  An adequate account must provide separate standards for the three outputs: the Factual Finding, the Inscription, and the Reparative Recommendation.
  *   **Motivation:** The standard of proof for "what the city owes" (reparation) may differ from "what fits on a plaque" (commemoration). A finding requires legalistic evidence; an inscription requires public truth-telling; reparations require causal linkage.
  *   **Status:** **[Non-negotiable]**. Using one standard for all three outputs guarantees failure in at least one domain.

  ***

  ### Incompatibilities and the Unsatisfiable Subset

  There is a triad of desiderata that cannot be jointly satisfied. You must relax one to satisfy the other two.

  1.  **Procedural Neutrality:** The rule for weighing evidence should be the same for every community and historical event.
  2.  **Provenance Sensitivity:** The rule for weighing evidence must change based on the power dynamic between the record-keeper and the recorded (as per Desideratum 1).
  3.  **Finality:** The panel must produce a single, coherent factual finding that resolves the conflict.

  **The Conflict:** You cannot have **Procedural Neutrality** and **Provenance Sensitivity** simultaneously. If you discount the ledger because it was written by the city, you are applying a rule specific to this power dynamic, violating Neutrality. If you apply the standard rule (documents stand unless disproven), you violate Provenance Sensitivity.
  Furthermore, if you accept both Sensitivity and Neutrality (by trying to average them), you likely cannot achieve **Finality**, because the evidence will remain perpetually inconclusive.

  **The Unsatisfiable Subset:** Most standard models try to keep Neutrality and Finality. To do so, they must sacrifice Provenance Sensitivity. This is why the "Archive wins" default feels unsatisfying to you: it preserves Neutrality and Finality by ignoring the specific epistemic corruption of the record.

  ***

  ### The Workhorse Requirement and Output Relativity

  **The Workhorse:**
  **Desideratum 1 (Provenance and Independence)** does the most work in excluding standard answers.
  *   *Why:* Standard historical method defaults to "documentary primacy." By making Independence a requirement, you force the Archive to prove the ledger's neutrality, not just its existence. This shifts the burden of proof. If the ledger is the *only* evidence of a "buyout," and it lacks independence, the "buyout" becomes an unproven assertion rather than a fact. This single move dismantles the Record-Primacy position without needing to prove the Descendants are right.

  **Output Relativity:**
  Adequacy shifts depending on which of the three deliverables you are writing.

  *   **For the Factual Finding:** **Desideratum 1 (Provenance)** dominates. You cannot find a "compensated buyout" as a fact if the only evidence is self-serving. The finding should likely be "inconclusive" or "disputed" rather than affirming the ledger.
  *   **For the Inscription:** **Desideratum 3 (Constitutive Weight)** dominates. The plaque is not a court verdict; it is a public acknowledgment. Here, the harm of silencing (Desideratum 4) outweighs the risk of factual imprecision. The inscription can acknowledge the *claim* of removal even if the *fact* is disputed.
  *   **For the Reparative Recommendation:** **Desideratum 4 (Asymmetry of Harm)** dominates. Reparations are not about punishing proven guilt; they are about addressing present inequities rooted in past ambiguity. If the risk of Error B (silencing) is higher, the recommendation should lean toward remedy even without forensic certainty.

  ***

  ### Scorecard for Contenders

  **1. Record-Primacy (The Archive Wins)**
  *   **Performance:** Fails Desideratum 1 (Provenance). It treats the ledger as neutral despite being authored by the accused.
  *   **Strengths:** Satisfies Procedural Neutrality and Finality. Easy to administer.
  *   **Weaknesses:** Collapses the distinction between silence and self-serving record. Risks Error B (repeating injury) by treating community testimony as inferior to bureaucratic paperwork.
  *   **Verdict:** Epistemically naive for this specific context.

  **2. Memory-Primacy (The Descendants Win)**
  *   **Performance:** Satisfies Desideratum 3 (Constitutive) and 4 (Asymmetry).
  *   **Strengths:** Correctly identifies the power imbalance in record creation. Avoids the injury of silencing.
  *   **Weaknesses:** Violates Procedural Neutrality (applies a special rule to this community). Risks Error A (officializing falsehood) if the memory has drifted significantly in shape, not just detail.
  *   **Verdict:** Morally robust, but requires you to justify why standard evidentiary rules are suspended here.

  **3. The Commemorative View (The Dispute is About the Present)**
  *   **Performance:** Satisfies Desideratum 5 (Functional Differentiation) by sidestepping the Factual Finding.
  *   **Strengths:** Allows the inscription to acknowledge the conflict without resolving it (e.g., "Records indicate a sale; descendants recall a removal").
  *   **Weaknesses:** Fails Desideratum 5 on Reparations. You cannot recommend reparations on a "both sides" basis. It kicks the can on the Factual Finding, which the Council explicitly asked for.
  *   **Verdict:** Best for the Inscription, insufficient for the Finding and Recommendation.

  ***

  ### A Note on Your Instinct

  You disclosed an instinct to side with the descendants and worry it is a mood. Here is the test provided by **Desideratum 1 (Provenance)**:

  Ask yourself: *If the roles were reversed, would I accept a ledger written by a settlement's residents claiming they sold the land voluntarily, if the City Council claimed they were removed by force and had no records?*
  *   If you would **reject the residents' ledger** as self-serving in that hypothetical, your instinct is a **judgment** based on the principle of independence. You are consistent.
  *   If you would **accept the residents' ledger** in that hypothetical (trusting the little guy over the big city regardless of who wrote the doc), your instinct is a **mood** (bias toward the underdog).

  Given your analysis of the ledger's origin, you are likely operating on the **Provenance Condition**. That is not a mood; it is a rigorous epistemic stance. It suggests the "Record-Primacy" model is the one that is actually biased, because it assumes bureaucratic neutrality where none existed.
