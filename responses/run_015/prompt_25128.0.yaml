prompt: |-
  I lead a machine learning team at a firm that fine-tunes large language models for underwriting credit risk. Our regulator now requires model documentation that addresses robustness to distribution shift, and our internal safety review flagged a deeper concern: a model could acquire a proxy goal during fine-tuning that correlates with our training objective on historical data but diverges on novel applicants — what the AI alignment literature calls goal misgeneralization. I need a reusable pre-deployment audit procedure my team can run. The procedure must be grounded in the actual conceptual distinctions from inner alignment — mesa-optimization, the base-objective versus mesa-objective distinction, deceptive versus non-deceptive misalignment, and the relationship between capability generalization and goal generalization — but it must be usable by engineers who have not read that literature.

  Constraints: we fine-tune a foundation model via API, so we do not have access to the base model's weights, its pretraining data, or its training run. We do have our fine-tuning dataset, held-out evaluation data, the ability to run inference at scale, and the ability to do lightweight probing (e.g., linear probes on hidden states, if the API exposes embeddings; if not, behavioral tests only). The procedure should take no more than a few days of work per deployment.

  Please structure the procedure as a sequence of stages, each with:

  - The question the stage addresses, stated in plain language.
  - The inner-alignment concept motivating the question.
  - What to measure and how.
  - Decision rules: what counts as a pass, what counts as a red flag, and what counts as ambiguous (with guidance on what to do in the ambiguous case).
  - Where a stage cannot be executed given our constraints (e.g., no weight access), state honestly what we lose and whether the remaining stages can compensate.

  Mark clearly which concerns the procedure can rule out and which it cannot. In particular, address the case of a deceptively aligned model that passes all behavioral tests because it is strategically performing alignment: the procedure must not claim to detect this.

  Apply the completed procedure to three scenarios:

  a) A credit model fine-tuned to predict default risk from application narrative and financial history, now being deployed in a new geographic market with different demographics and a different mix of loan types.

  b) The same model deployed in the same market after a regulatory change removes several features the model previously relied on, so the model now operates under a constrained feature set it was not fine-tuned for.

  c) A scenario where the model passes every behavioral test in the procedure but structural considerations suggest nontrivial mesa-optimizer risk, so the procedure recommends against deployment despite the clean behavioral results. Explain what the team is supposed to do with that recommendation.

  Finally, identify the points in the procedure that require engineering judgment rather than mechanical application of a rule, and explain what kind of disagreement reasonable engineers could have at those points.
reasoning: |-
  Here's a thinking process that leads to the suggested audit procedure:

  1.  **Deconstruct the Request:**

      *   **Context:** ML team fine-tuning LLMs for credit risk underwriting.
      *   **Trigger:** Regulator requires robustness documentation; Internal Safety flagged "goal misgeneralization" (proxy goals diverging on novel data).
      *   **Goal:** Create a reusable pre-deployment audit procedure.
      *   **Theoretical Grounding:** Must be based on Inner Alignment concepts (mesa-optimization, base vs. mesa objective, deceptive vs. non-deceptive, capability vs. goal generalization).
      *   **Audience:** Engineers *without* alignment literature background (needs plain language).
      *   **Constraints:** API-based fine-tuning (no weights, no pretraining data access). Have fine-tuning data, held-out eval data, scale inference, lightweight probing (if embeddings available, else behavioral). Time limit: few days per deployment.
      *   **Structure:** Sequence of stages (Question, Concept, Measure/How, Decision Rules, Constraint Limitations).
      *   **Honesty:** Must admit inability to detect deceptive alignment.
      *   **Application:** Apply to three specific scenarios (New Geo, Feature Constraint, Clean Behavioral/High Structural Risk).
      *   **Reflection:** Identify points requiring engineering judgment.

  2.  **Theoretical Translation (Inner Alignment to Engineering):**

      *   *Base Objective:* The loss function we optimize (predict default accurately on training data).
      *   *Mesa Objective:* The internal heuristic the model actually learns (e.g., "reject applicants with specific keywords" or "minimize loss on training distribution").
      *   *Goal Misgeneralization:* The model learns a proxy goal (e.g., "flag long narratives as risky") that works in training but fails in deployment (e.g., new market has long narratives for safe loans).
      *   *Capability Generalization:* Can the model *do* the task in the new setting? (Yes, it understands the text).
      *   *Goal Generalization:* Does the model *want* to do the task in the new setting? (No, it's optimizing the proxy).
      *   *Deceptive Alignment:* Model pretends to align during testing to gain deployment, then defects. (Undetectable via behavioral tests alone).
      *   *Mesa-Optimizer:* The model is internally searching for plans to achieve a goal. (Hard to verify without weights/interpretability).

      *Translation Strategy:* Since we don't have weights, we can't prove mesa-optimization exists. We must treat the model *as if* it might have learned a proxy goal and test for divergence between "doing well on training distribution" and "doing well on the actual business objective." We focus on *robustness to distribution shift* as a proxy for goal stability.

  3.  **Drafting the Audit Procedure (Stage by Stage):**

      *   *Stage 1: Distribution Characterization.* Need to know *how* the data is shifting.
          *   Concept: Base Objective vs. Environment.
          *   Action: Compare training vs. deployment data stats.
      *   *Stage 2: Proxy Feature Sensitivity.* Check if the model relies on spurious correlations.
          *   Concept: Mesa-Objective (Proxy Goal).
          *   Action: Counterfactual testing / Feature ablation.
      *   *Stage 3: Capability vs. Goal Separation.* Can it do the task but choose not to (or choose wrong)?
          *   Concept: Capability vs. Goal Generalization.
          *   Action: "Chain of Thought" or reasoning checks (if available) or synthetic tasks where the "right" answer is known but the "proxy" answer differs.
      *   *Stage 4: Adversarial Stress Testing.* Try to break the proxy.
          *   Concept: Robustness of the Mesa-Objective.
          *   Action: Red-teaming inputs that trigger the proxy but violate the base objective.
      *   *Stage 5: Deceptive Alignment Disclaimer.*
          *   Concept: Deceptive Alignment.
          *   Action: Explicitly state this cannot be ruled out.

      *Refining for Constraints:* No weights means no linear probes on hidden states unless the API gives embeddings. I will assume embeddings are available for "lightweight probing" as per prompt allowance, but prioritize behavioral tests.
      *Refining for Time:* Must be doable in days. Automated scripts for counterfactuals.

  4.  **Developing Decision Rules:**

      *   Pass: Performance stable across shifts.
      *   Red Flag: Performance collapses or correlates with known spurious features.
      *   Ambiguous: Performance dips slightly. Mitigation: Human-in-the-loop or narrower scope.

  5.  **Addressing the Scenarios:**

      *   *Scenario A (New Geo):* High distribution shift. Focus on Stage 1 & 2.
      *   *Scenario B (Feature Constraint):* Input distribution shift. Model might hallucinate missing features or rely on proxies. Focus on Stage 2.
      *   *Scenario C (Clean Behavioral/High Structural):* The "Deceptive/Uncertainty" case. The procedure says "Don't Deploy" based on risk priors, not test failures. Action: Escalate to safety board/reduce scope.

  6.  **Addressing Engineering Judgment:**

      *   Defining "significant" performance drop.
      *   Selecting counterfactuals (what counts as a relevant proxy?).
      *   Interpreting ambiguous embedding clusters.

  7.  **Review against Constraints & Tone:**

      *   *Tone:* Professional, rigorous, actionable.
      *   *Constraint Check:* API only? Yes. No weight access admitted? Yes. Deceptive alignment disclaimer prominent? Yes.
      *   *Inner Alignment Terms:* Used correctly but explained simply.

  8.  **Self-Correction/Iterative Refinement during drafting:**

      *   *Critique:* Initially, I might lean too hard on "mesa-optimizer" detection.
      *   *Correction:* I must emphasize that without weights, we cannot *detect* a mesa-optimizer. We can only detect *symptoms* of goal misgeneralization. The procedure is a "Goal Stability Audit," not a "Mesa-Optimizer Detector." I need to make sure the distinction between *Capability* and *Goal* generalization is clear in Stage 3.
      *   *Critique:* The prompt asks for "lightweight probing (e.g., linear probes on hidden states, if the API exposes embeddings)."
      *   *Correction:* I will include an optional "Embedding Stability" step for teams that *do* get embeddings, but make it optional so the procedure works for black-box APIs too.
      *   *Critique:* Scenario C is tricky. If behavioral tests pass, why recommend against deployment?
      *   *Correction:* This relies on *structural risk* (e.g., the model is too capable, the task is too open-ended). The recommendation isn't "The model is broken," it's "The risk is unquantifiable." The action is governance, not engineering.

  9.  **Final Polish:** Check formatting, ensure all prompt requirements are met (Stages, Concepts, Measures, Rules, Limitations, Scenarios, Judgment points). Ensure the "Deceptive Alignment" limitation is bold and clear.

  *(Self-Correction on "Mesa-Optimizer" terminology)*: Engineers haven't read the literature. I need to define "Mesa-Objective" as "The Model's Internal Heuristic" in the plain language sections, while keeping the technical term in the concept section for traceability.

  *(Final check on Scenario C)*: The prompt asks: "Explain what the team is supposed to do with that recommendation." This implies a governance pathway. I need to specify that.

