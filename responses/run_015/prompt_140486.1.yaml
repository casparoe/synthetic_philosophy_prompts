  ### Candidate Designs

  1.  **The Perfect Simulator:** Elara lives in a world where a demon creates perfect sensory inputs; she doubts everything.
      *   *Fail:* Violates the "no demons/vats" constraint; also, both arguments collapse into global skepticism, failing the inversion requirement.
  2.  **The Memory Wipe:** Elara wakes up with no memory of yesterday, but finds evidence she acted.
      *   *Fail:* CDA withholds knowledge (could be planted evidence); ZTA withholds knowledge (no continuity); both skeptical, no inversion.
  3.  **The Sleep-Encoded Memory:** Elara has a vivid memory of an action, but the memory was encoded during sleep.
      *   *Survive:* This isolates the *source* of the memory as the variable. CDA focuses on the *thinker* (who persists through sleep), while ZTA focuses on the *configuration* (which transforms during sleep). This allows the inversion: CDA affirms the self, ZTA questions it.

  ### The Case

  Elara sits at her kitchen table on a Tuesday morning, possessing a vivid, first-person memory of turning a key; the single stipulated feature of this case is that this memory trace was definitively encoded during a period of sleep, despite being phenomenologically identical to a waking memory.

  ***

  (a) **The Proposition:** "I am the same entity now as I was when this memory was encoded."

  *   **The Cartesian Line (Concedes Knowledge):** Descartes’ dream argument targets the *content* of perception (the key, the door), not the *existence* of the perceiver. The *Cogito* establishes that the "I" is a thinking substance (*res cogitans*) that persists regardless of whether its ideas are caused by external objects or internal dreams. For the Cartesian, the "I" who sits at the table and the "I" who encoded the memory are the same thinking substance, merely in different states of awareness. Since the proposition concerns the identity of the *subject* rather than the reality of the *object* (the key), the dream stipulation is irrelevant to the self's continuity. The verdict is knowledge conceded: she knows she is the same thinker.
  *   **The Zhuangzian Line (Withholds Knowledge):** Zhuangzi’s butterfly argument targets the *boundaries of the self*. Transformation (*hua*) is the fundamental nature of reality; "waking" and "dreaming" are not just states of a stable soul, but distinct configurations of existence. If the memory was encoded during sleep, it belongs to the "dream-configuration." To claim "I am the same entity" assumes a fixed self that survives the transformation from sleeper to waker. Since the stipulation confirms the memory comes from the "dream" configuration, and transformation implies a change in what one *is*, the Zhuangzian cannot affirm the identity claim without ignoring the ontological shift. The verdict is knowledge withheld: she cannot know the "waker" is the "sleeper."

  (b) **The Single Feature (Control Condition):** The stipulation that **the memory was encoded during sleep**.

  *   **Removal:** If we remove this feature and assume the memory was encoded while waking, the Cartesian still concedes (stable self, real world). However, the Zhuangzian verdict shifts: if the memory is from waking life, the "configuration" is continuous with the current state. While a strict Zhuangzian might still posit micro-transformations, the *epistemic* worry about the *boundary* between selves dissolves when there is no state-change (sleep/wake) to mark a transformation. The inversion collapses; both would likely concede the proposition, or at least the Zhuangzian skepticism would lose its specific foothold in the "dream" stipulation. The sleep-encoding is the catalyst that forces the Zhuangzian to treat the past self as a *different thing*.

  (c) **The Zhuangzian Reply:** A sophisticated Zhuangzian might object that the case is rigged by accepting the Cartesian framing of "knowledge" and "entity." She would argue: "You ask if I *know* I am the same entity, presupposing that 'knowing' requires a fixed subject to hold the truth. But transformation is not a loss of knowledge; it is the realization that 'same entity' is a false category. The case isn't that I *don't know* if I am the sleeper; it's that the question 'Am I the same?' is like asking if the morning is the same as the evening. They are different phases of the Dao."

  *   **Does it land?** It lands as a therapeutic correction but fails to restore the knowledge claim. The objection rejects the *value* of the proposition rather than denying the *verdict*. My verdict was that the Zhuangzian must *withhold knowledge* of the identity claim. The Zhuangzian reply agrees: "Yes, withhold it, because the claim is nonsense." This confirms the skeptical verdict regarding the *proposition as stated*, even if it rejects the *anxiety* usually associated with skepticism. The case successfully forces the Zhuangzian to deny the stability of the self, which is the core of the inversion.

  (d) **Conclusion:** This case establishes that the divergence between the two arguments is not merely about the external world, but about the **metaphysics of the subject**. The Cartesian argument presupposes a substantial self that *has* experiences (making it immune to doubts about the *source* of those experiences), while the Zhuangzian argument presupposes a processual self that *is* its experiences (making it vulnerable to doubts about the *continuity* of those experiences). The inversion works because the Cartesian skeptic is a realist about the *self* (but not the world), whereas the Zhuangzian "skeptic" is a realist about the *world* (as transformation) but not the *self* (as a fixed entity). By targeting a proposition about self-identity derived from a dream, we isolate the Cartesian's anchor (the *Cogito*) from the Zhuangzian's flux (the *Hua*), showing that one doubts the stage, while the other doubts the actor.
