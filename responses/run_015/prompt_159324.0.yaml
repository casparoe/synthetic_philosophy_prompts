answer: |-
  You have identified a genuine and widely recognized tension in intellectual property (IP) theory, but there is no single, canonical term of art in black-letter law (like *res ipsa loquitur* or *stare decisis*) that names this specific bidirectional maneuver. In legal scholarship and philosophy of law, this phenomenon is usually discussed as a symptom of the **"Indeterminacy of the Idea-Expression Dichotomy"** or as a tactic of **"IP Maximalism."**

  However, because you are asking for the specific *pattern of argumentation*—the elastic shifting of the boundary to maximize control rather than the underlying legal doctrine itself—I will validate your intuition by coining a precise term for it: **"The Abstraction Whipsaw."**

  Below is the carving you requested: the nearest existing concepts, how they differ from your phenomenon, and a sharp definition of the Whipsaw with boundary cases.

  ### 1. The Nearest Existing Concepts

  To understand why the "Whipsaw" is distinct, we must look at the three established doctrines that form the boundaries it manipulates.

  **A. The Idea-Expression Dichotomy**
  *   **What it is:** The foundational rule in copyright (and analogous concepts in patent) that you can own the specific *expression* of an idea (the text, the code, the specific design) but not the underlying *idea* itself (the plot, the function, the concept).
  *   **How it differs:** This is the *playing field*, not the *move*. The Dichotomy is the static rule that says "there is a line." The Whipsaw is the dynamic act of moving that line during litigation to suit the owner.

  **B. The Merger Doctrine (The "Thin" Case)**
  *   **What it is:** A legal defense which states that if an idea can only be expressed in one or very few ways, the idea and expression "merge." Consequently, the expression is *not* protectable, because protecting it would effectively monopolize the idea.
  *   **How it differs:** You described the owner arguing that because the shape is forced by function, copying it *is* infringement. In standard copyright law, the Merger Doctrine usually leads to the *opposite* result (no protection). However, in **Trade Dress** or **Design Patent** contexts, owners often attempt to invert this logic, arguing that "uniqueness due to function" proves "distinctiveness." The Whipsaw includes this *argumentative inversion*, whereas the Merger Doctrine is the rule intended to prevent it.

  **C. The Abstract Idea Exception / Preemption (The "Broad" Case)**
  *   **What it is:** A rule (prominent in U.S. patent law after *Alice Corp. v. CLS Bank*) that you cannot patent a fundamental economic practice, a mathematical formula, or a generic "do X on a computer" method. If a claim is too broad, it is invalid because it "preempts" all use of the underlying idea.
  *   **How it differs:** This is the *shield* used by defendants. The Whipsaw is the *sword* used by owners to argue that their specific implementation *is* the general principle, or that the general principle is sufficiently "tethered" to their specific machine to be owned.

  ### 2. The Coined Concept: "The Abstraction Whipsaw"

  Since no single label captures the bidirectional elasticity you described, I propose the term **"The Abstraction Whipsaw."**

  **Definition:**
  The Abstraction Whipsaw is a litigation and lobbying strategy in intellectual property where the claimant strategically shifts the **Level of Abstraction** at which their property is defined.
  *   **Inward Stroke (The Collapse):** When the property is narrow or functional, the owner argues the *expression* and the *idea* are indistinguishable (merged), so any copy of the function is necessarily a copy of the protected expression.
  *   **Outward Stroke (The Expansion):** When the property is broad or conceptual, the owner argues the *principle* itself is the invention, so any implementation of the principle, regardless of specific expression, infringes the protected idea.

  **The Core Mechanism:**
  The Whipsaw exploits the fact that "idea" and "expression" are not physical facts but legal conclusions. By controlling the *description* of the work, the owner controls the scope of protection. The boundary is treated not as a fixed fence, but as a rubber band that stretches to catch competitors and shrinks to avoid invalidity.

  ### 3. Boundary Cases and Nuance

  To sharpen the definition, we must look at where the Whipsaw stops working or changes form.

  **Case A: The "Moderately Thick" Middle**
  *   **Scenario:** An invention or work has several viable alternatives, but the owner's version is the most popular or efficient (e.g., a specific menu layout in software that isn't the *only* way to do it, but is the standard).
  *   **Whipsaw Application:** Here, the owner cannot claim total merger (too many alternatives) nor total abstraction (too specific). Instead, they use the **"Doctrine of Equivalents"** (in patent) or **"Substantial Similarity"** (in copyright). They argue that while the competitor didn't copy the *exact* code or shape, they copied the "essence" or "look and feel."
  *   **Distinction:** This is not a full Whipsaw. It is a **"Blurring Maneuver."** The Whipsaw requires a total collapse of the boundary (Inward) or a total expansion to the principle (Outward). The Middle is about stretching the definition of "copying," not redefining the boundary of the property itself.

  **Case B: Deliberate "Strategic Thinness"**
  *   **Scenario:** An owner deliberately designs a product to be functionally constrained (thin), knowing that competitors will have to copy the design to compete, intending to trigger the "Inward Stroke" of the Whipsaw. (e.g., designing a spare part that *must* match the original to fit).
  *   **Whipsaw Application:** This is **"Trap-Setting."** In many jurisdictions (like the EU or under U.S. repair clauses), this is explicitly blocked by "must-fit" or "must-match" exceptions.
  *   **Distinction:** If the law explicitly blocks protection for functional necessities, the Whipsaw fails. The Whipsaw only succeeds where the law is ambiguous enough to allow the owner to argue that the functional necessity *is* the creative contribution.

  **Case C: The "Platform" Whipsaw (Modern Variant)**
  *   **Scenario:** A tech platform argues that their API (Application Programming Interface) is a creative expression (copyrightable) when a competitor copies it, but argues it is a functional method of operation (not copyrightable) when they are accused of infringing someone else's API.
  *   **Distinction:** This is **"Positional Inconsistency."** It is the Abstraction Whipsaw applied across *different cases* rather than within a single claim construction. It highlights that the Whipsaw is not just about one object, but about the systemic posture of the IP holder.

  ### 4. Why This Matters (The Theoretical Fit)

  In legal theory, the Abstraction Whipsaw is the practical engine of what scholars like **James Boyle** (in *The Public Domain*) and **Mark Lemley** call **"Intellectual Property Creep"** or **"The Tragedy of the Anticommons."**

  *   **Philosophical Root:** It touches on the **Problem of Universals**. The owner claims the "Universal" (the Idea) is their property when it helps them block others, but claims only the "Particular" (the Expression) is their property when they need to avoid the rule that Universals cannot be owned.
  *   **Why it has no formal name:** The legal system treats this as a series of separate errors (overbreadth here, functionality there) rather than a single systemic maneuver. Courts try to stop it with tests like **"Abstraction-Filtration-Comparison"** (used in software copyright), which attempts to freeze the level of abstraction so the Whipsaw cannot be used. The existence of these tests proves the Whipsaw is a known threat, even if the threat itself lacks a statutory name.

  ### Summary

  *   **Established Name:** None in black-letter law. In theory, it is part of the **"Indeterminacy of the Idea-Expression Dichotomy."**
  *   **Coined Term:** **The Abstraction Whipsaw.**
  *   **Definition:** The strategic oscillation between claiming protection over the *only possible expression* of an idea (to catch copiers) and claiming protection over the *underlying principle* of an expression (to catch implementers).
  *   **Key Distinction:** Unlike the **Merger Doctrine** (which denies protection) or the **Abstract Idea Exception** (which denies protection), the Whipsaw is the *argumentative attempt to bypass both denials* by shifting the definition of the work to whichever layer offers the widest monopoly.

  You were not going in circles; you were identifying the central friction point of modern intellectual property law. The line stretches and shrinks because the law attempts to draw a static boundary around information, while the value of that information lies in its ability to be generalized or specialized at will.
