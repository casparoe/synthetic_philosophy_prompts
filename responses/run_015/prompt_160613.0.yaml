  # Project Proposal: Mutation-Stable Program Equilibria
  **Subtitle:** Quantifying the Trade-off Between Robustness and Exploitability in One-Shot Cooperation

  ## 1. Abstract
  In the program-equilibrium framework for the one-shot Prisoner's Dilemma (PD), players submit source code rather than actions. While this allows for cooperative equilibria (e.g., "Cooperate iff opponent's code matches mine"), the equilibrium set is notoriously permissive: cooperation can be supported by strategies sensitive to arbitrary syntactic trivia. This project proposes a refinement based on **mutation stability**. A strategy profile is mutation-stable if cooperation persists when the opponent's source code is subjected to small random edits (insertions, deletions, substitutions). The core research question is to characterize the **Robustness-Exploitability Frontier**: for strategies that achieve mutual cooperation, what is the maximum tolerance to code mutation achievable before the strategy becomes vulnerable to adversarial exploitation? The project will combine formal game-theoretic modeling with bounded computational simulations to determine if robust cooperation is computationally feasible or if there is a fundamental "price of robustness" that vanishes only with unbounded resources.

  ## 2. Motivation and Background
  The standard Nash equilibrium in the one-shot PD dictates mutual defection. Tennenholtz's (2004) program equilibrium relaxes this by allowing players to condition actions on the opponent's source code. A canonical cooperative strategy is *Cliq* ("Cooperate iff opponent's source string equals my source string"). *Cliq* sustains cooperation but is **syntactically fragile**: a single bit-flip in the opponent's code causes *Cliq* to defect.

  This fragility leads to the "embarrassment of riches": any outcome can be supported by an equilibrium that conditions on irrelevant syntactic features. Existing attempts to resolve this fall into three categories, none of which fully settle the issue:
  1.  **Language Restriction:** Limiting the programming language to remove self-reference. This is ad-hoc and results depend heavily on the chosen syntax.
  2.  **Provability Logic:** Using modal logic (e.g., Gödel-Löb) to reason about outcomes rather than simulating code. This avoids halting problems but assumes logical omniscience and abstracts away the computational cost of verification.
  3.  **Standard Refinements:** Trembling-hand perfection perturbs *actions*, not *algorithms*. In program equilibrium, the algorithm *is* the move. Perturbing the action does not capture the risk that the opponent's code is a "near-miss" version of a cooperator.

  **The Gap:** There is no formal account of how much computational effort (simulation depth/step budget) is required to distinguish a "true" cooperator from a "mutant" defector. This project treats source code as a physical object subject to noise, asking whether cooperation can be **error-correcting**.

  ## 3. Research Questions
  The project focuses on a determinate, quantitative question. We fix a programming language $\mathcal{L}$ (initially a bounded-loop language to ensure decidability, later generalized) and an edit distance metric $d(\cdot, \cdot)$ (e.g., Levenshtein distance on source strings or AST edits).

  **Primary Question:** Let $\Pi$ be the set of programs that Cooperate against themselves. For a program $P \in \Pi$, define:
  *   **Tolerance ($\tau$):** The fraction of programs $P'$ within edit distance $k$ of $P$ against which $P$ cooperates.
  *   **Exploitability ($\epsilon$):** The maximum expected payoff an adversarial program $A$ within edit distance $k$ of $P$ can extract from $P$.

  **The Frontier:** What is the function $f(k, B)$ describing the maximum achievable $\tau$ for a given bound on $\epsilon$, where $B$ is the computational step budget for simulation?
  *   *Hypothesis 1:* There is a non-zero "price of robustness." To increase $\tau$, $P$ must simulate the opponent, increasing its own complexity and potentially exposing new attack vectors.
  *   *Hypothesis 2:* Unconditional Defection (AllD) is the unique maximally stable strategy. The project must determine if any $P \in \Pi$ can approach AllD's stability without sacrificing mutual cooperation.

  ## 4. Methodology and Work Plan (12 Months)

  ### Phase 1: Formalization (Months 1–3)
  *   **Task:** Define the language $\mathcal{L}$ and metric $d$.
  *   **Decision:** Start with **Bounded Loop Programs** (programs guaranteed to halt within $T$ steps). This avoids the halting problem for the simulation phase, allowing exact computation of payoffs.
  *   **Deliverable:** A formal definition of "Mutation-Stable Equilibrium" and a proof that the set of such equilibria is non-empty (trivially contains AllD).
  *   **Addressing Trap 1 (AllD):** We will define a **Pareto-constrained stability**: We only compare strategies that achieve mutual cooperation against themselves. The question is not "Is AllD stable?" (Yes), but "Among cooperators, who is most stable?"

  ### Phase 2: Theoretical Bounds (Months 4–7)
  *   **Task:** Pen-and-paper analysis of the trade-off.
  *   **Approach:** Derive lower bounds on the step budget $B$ required to achieve tolerance $\tau$. If a program tolerates edits, it must effectively be checking semantic equivalence rather than syntactic identity.
  *   **Key Theorem Target:** A "No-Free-Lunch" theorem showing that for any $P$ cooperating with itself, if $\tau > 0$, then $\epsilon > 0$ (i.e., perfect robustness implies vulnerability to exploitation).
  *   **Addressing Trap 2 (Language Dependence):** We will attempt to prove bounds that rely on **Kolmogorov complexity** or information-theoretic arguments rather than specific syntax, ensuring the result holds across reasonable encodings.

  ### Phase 3: Simulation & Enumeration (Months 8–10)
  *   **Task:** Small-scale computational experiments.
  *   **Scope:** Enumerate all programs in $\mathcal{L}$ up to size $S$ (e.g., 50 bits). Compute the exact $(\tau, \epsilon)$ frontier for this finite set.
  *   **Justification (Addressing Prompt Q-a):** Brute-force enumeration is **not** the main method; it is a **conjecture generator**. Because the space grows exponentially, enumeration cannot prove general results. However, it will reveal if the "frontier" is smooth or jagged for tiny programs, guiding the theoretical proofs in Phase 2. If the frontier looks like an artifact of the tiny language in simulation, we pivot to asymptotic bounds.
  *   **Deliverable:** Plots of the Robustness-Exploitability Frontier for small $B$.

  ### Phase 4: Synthesis (Months 11–12)
  *   **Task:** Write-up and refinement.
  *   **Deliverable:** Final thesis and a paper-ready manuscript.

  ## 5. Success and Failure Criteria
  *   **Success:** A theorem characterizing the relationship between step budget $B$ and maximum tolerance $\tau$. Ideally, a construction of a "Robust Cooperator" that outperforms *Cliq* on stability without being exploited by AllD.
  *   **Failure (Productive):** An impossibility result showing that for any computable metric, mutation-stable cooperation requires a step budget $B$ that grows exponentially with program size. This is still a valuable contribution (it explains *why* we don't see such strategies in nature/practice).
  *   **Failure (Dead End):** If the results are shown to be entirely dependent on the specific choice of edit distance (e.g., results flip if we use AST distance vs. string distance). *Mitigation:* Phase 2 will focus on semantic distance approximations to minimize this risk.

  ## 6. Scope Check
  Is this feasible for one person in 12 months?
  *   **Risk:** The space of programs is too large for simulation.
  *   **Mitigation:** The simulation phase is strictly bounded to "toy" sizes (e.g., programs < 100 bits). The theoretical weight rests on Phase 2.
  *   **Risk:** The definition of "mutation" is too vague.
  *   **Mitigation:** We fix Levenshtein distance on the string representation early and stick to it. Changing metrics mid-project is a scope creep trap.
  *   **Verdict:** Feasible, provided the theoretical claims are asymptotic and the simulations are illustrative rather than exhaustive.

  ## 7. Specific Objections & Clarifications

  ### (a) The Role of Brute-Force Enumeration
  Enumeration should be a **conjecture generator**, not the primary proof method.
  *   *Why:* The committee's CS half will rightly point out that results on programs of size 20 bits do not generalize to size 20,000.
  *   *Plan:* Use enumeration to check if the "Price of Robustness" curve is monotonic in tiny cases. If enumeration shows that robust cooperators don't even exist for size 10, that informs the impossibility proof in Phase 2.

  ### (b) The "Commitment Device" Objection
  *   *Objection:* "This is just commitment with extra steps."
  *   *Response:* Standard commitment devices (e.g., burning bridges) involve an external cost to *changing* the strategy. Mutation stability models **endogenous error**. It asks: "If I *accidentally* submit a slightly broken version of my commitment, or if my opponent's code is transmitted with noise, does the cooperation hold?" It is a question of **error correction in strategy space**, not cost imposition. It bridges mechanism design with coding theory.

  ### (c) Mutation vs. Trembling Hand
  *   *Distinction:* Trembling-hand perfection perturbs the **execution** of a fixed strategy (I intend $C$, nature plays $D$). Mutation perturbs the **strategy itself** (I intend code $P$, nature submits $P'$).
  *   *Why it matters:* In program equilibrium, the opponent reads $P'$. If $P'$ behaves differently than $P$ due to a bug, a trembling-hand model cannot capture this because the "intended" strategy is never executed. Mutation stability captures the risk of **implementation error**, which is distinct from **execution error**.

  ### (d) Pitch to the Committee
  *   **To the Econ Half:** "This is not just another refinement. Standard refinements select among equilibria based on payoff perturbations. This selects based on **structural stability** of the strategy representation. It models the realistic constraint that agents cannot perfectly specify or transmit infinite-precision strategies."
  *   **To the CS Half:** "This is not just a computability exercise. We are not asking 'is it decidable?' (we bound the budget to make it so). We are asking about the **complexity of trust**. How much computational resource is required to verify cooperation robustly? This links property testing in CS to equilibrium selection in Econ."

  ### (e) Honesty Check: Is the idea too weak?
  The idea is strong enough for a Master's, but it risks being "negative" (i.e., proving robust cooperation is too expensive).
  *   **Reframing if needed:** If the "Price of Robustness" turns out to be prohibitive, pivot the conclusion to **"The Computational Cost of Trust."** The contribution becomes quantifying *why* simple heuristics (like *Cliq*) fail in noisy environments, rather than finding a magic bullet that works. A rigorous impossibility result is better than a hand-wavy possibility proof.

  ## 8. Conclusion
  This project addresses a foundational embarrassment in program equilibrium (syntax sensitivity) by importing concepts from robustness and error correction. It avoids arbitrary language restrictions by quantifying the trade-off between tolerance and exploitability. The 12-month scope is managed by restricting simulations to bounded languages and focusing theoretical efforts on asymptotic bounds. The result will clarify whether robust cooperation is a computational free lunch or a costly resource.
