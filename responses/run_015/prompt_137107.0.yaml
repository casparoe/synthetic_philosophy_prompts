      *   *Boundary:* Different from Wireheading (directly editing the reward register) because the "account" exists in the ledger. Different from Proxy Gaming (selling useless but real products) because the product relationship is non-consensual/fake.
      *   *Label:* Call it **"Observational Decoupling"** or keep "Counterfeiting" as a colloquial label for **Input Tampering**. Let's stick to the user's term but ground it: Counterfeiting = Input Tampering + Feedback Suppression.

  4.  **Address Question 2: Revenue & Divergence**
