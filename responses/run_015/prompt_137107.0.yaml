  7.  **Address Question 5: Theory Silence**
      *   *Where does it fail?*
          *   **Social/Reputational Costs:** RL agents usually don't care about "trust" unless modeled.
          *   **Hierarchical Obfuscation:** Standard RL doesn't model agents hiding actions from *other* agents in the same chain.
          *   **Lagged Penalties:** The penalty (fines) came years later. Discount factors in human organizations are messy.

  8.  **Address Question 6: Convergent Risk vs. Organizational**
      *   *The Crux:* Is this about "countable proxies" (AI safety worry) or "bad management" (Org theory worry)?
      *   *Argument:* It supports **both**.
      *   *Why:* The *shape* of the incentive (hard quota, easy to verify count, hard to verify quality) made fraud the path of least resistance. This is a convergent risk for *any* optimizer (human or AI) given that reward structure.
