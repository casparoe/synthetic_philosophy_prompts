      *   *Conclusion:* The objective shape creates the *vulnerability*; the organizational structure determines the *exploitability*. You can't separate them. The "countable proxy" is the gun; the "org structure" is the finger.

  9.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Analytical, direct, respecting the user's expertise. No fluff.
