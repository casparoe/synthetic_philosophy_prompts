answer: |-
  ### Candidate Structures

  1.  **The Taxonomic Tree:** Begins with abstract metaphysical commitments (e.g., "Is distinctness grounded?") and applies them to the cases later. *Reject:* Violates the constraint against asking students to self-identify with 'isms' or abstract commitments at the nodes; too dry for a second-year group.
  2.  **The Case-Linear Flow:** Treats the three cases as sequential filters. You must answer Case 1 to proceed to Case 2. *Reject:* Too rigid; some positions (e.g., Haecceitism) are settled in Case 1 and shouldn't be re-tested in Case 3, leading to redundant branches or dead ends.
  3.  **The Hybrid Diagnostic:** Uses Case 1 to establish the core ontological split (One vs. Two objects), Case 2 to test the scope of individuation (Weak vs. Strong PII), and Case 3 as a calibration limit. Branches terminate when a position is fully specified. *Commit:* This best balances the concrete case constraints with the need to map the logical space of the distinctions you care about (grounding, haecceity, modality).

  ### Session Decision Tree: The Identity of Indiscernibles

  *   **1. In Black's symmetric universe, are there strictly two spheres?**
      *   **No (There is only one object):**
          *   **2. Is this universe metaphysically possible?**
              *   Yes → **One-object-in-two-places**
              *   No → **PII True (Universe Impossible)**
      *   **Yes (There are two objects):**
          *   **3. Is 'being a mile from the centre' a genuine qualitative property?**
              *   **Yes:**
                  *   **4. Is the sphere nothing over and above its properties?**
                      *   Yes → **Bundle Theory (with impure properties)**
                      *   No → *Empty (Incoherent: properties without substratum)*
              *   **No (Spatial relations do not count qualitatively):**
                  *   **5. If sphere A is annihilated, is there a fact about *which* one remained?**
                      *   **Yes (There is a fact):**
                          *   **6. Does this 'thisness' ground their distinctness?**
                              *   Yes → **Haecceitism**
                              *   No → *Empty (Unattractive: distinctness without ground or haecceity)*
                      *   **No (There is no fact):**
                          *   **7. Is their distinctness nevertheless a brute fact?**
                              *   Yes → **Brute Numerical Difference**
                              *   No → **No-fact-of-the-matter**
          *   **8. (Case 2) Does temporal separation individuate without qualitative change?**
              *   Yes → **Weak PII Restriction**
              *   No → **Strong PII Restriction**
          *   **9. (Case 3) Are quantum particles distinct despite identical states?**
              *   Yes → **PII False (Quantum Exception)**
              *   No → **PII True (Quantum Validation)**
          *   **10. Does distinctness require a truthmaker?**
              *   Yes → **Relationalism about spacetime** (if relations ground it)
              *   No → **Brute Numerical Difference** (collapses with leaf 7)

  ***

  ### Supervisor's Notes on the Tree

  *   **Structure:** The tree flows from the concrete ontology of Black's case (Q1–Q7) into the scope of the principle via your sequential variant (Q8), finishing with the quantum calibration (Q9–Q10).
  *   **The De Re Work:** Question 5 does the heavy lifting. It forces the student to confront whether 'thisness' survives counterfactual annihilation. A 'Yes' commits them to haecceities; a 'No' forces a choice between brute difference or indeterminacy.
  *   **Collapses:** Note that Leaf 10 (No) collapses into Leaf 7. I have left it visible to show where the grounding question intersects the brute difference view, but you should treat them as the same position during the seminar.
  *   **Empty Spaces:** I have marked two logical spaces as empty. The first (Q4 No) is the awkward position of admitting qualitative differences but denying the bundle theory that makes them sufficient. The second (Q6 No) is the unstable view that haecceities exist but do no metaphysical work.
  *   **Formatting:** This is designed to fit on the left-hand side of an A4 sheet with ample margin for your own annotations during the session. British spelling is used throughout.
