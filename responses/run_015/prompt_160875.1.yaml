prompt: |-
  You're a metaphysician who's supervised our second-year reading group for years, so take it seriously: brainstorm two or three candidate structures first, then commit to one and build it.

  I need a decision tree for next week's session on the identity of indiscernibles — as an indented list I can put on one side of A4, with a question at every branch node and a named position at every leaf. The group has read Black's 1952 Mind paper and nothing else, so no node may ask them to self-identify with an ism: each one has to be a question about a concrete case that someone with no vocabulary can answer.

  Cases I want it built around, roughly in this order: (1) Black's own set-up, two exactly similar spheres a mile apart in an otherwise empty universe, the whole thing perfectly symmetric; (2) a variant I made up — the same two spheres but never coexisting, one exists for an hour, is annihilated, and a qualitative duplicate turns up an hour later; (3) a calibration case at the end, two particles in the same quantum state, where I want your leaves to say visibly different things.

  The distinctions my group actually cares about, so build the tree out of these rather than out of a list of names: does the case show PII is false or that such a universe is impossible; is the difference-maker, if there is one, purely qualitative, relational, or does it have to be a haecceity; does whatever makes them two merely necessitate their distinctness or must it ground it; and is there a fact of the matter about which sphere would have been which if one had been annihilated — I want that de re question to do the real work in seperating haecceitism from brute numerical difference.

  Where the logical space permits a combination nobody occupies (PII true, no haecceities, case possible, that sort of thing), mark it empty and give me one line on whether it's incoherent, merely unattractive, or just unexplored. Leaves I'd like to find at the bottom if your tree genuinely reaches them: haecceitism, brute numerical difference, bundle theory with impure properties, relationalism about spacetime, the weak-vs-strong PII restriction, the one-object-in-two-places move, and the no-fact-of-the-matter response. If two of them collapse into the same leaf, say so instead of inventing a distinction to keep them apart.

  Aim for eight to ten branch questions and about ten leaves, and write the whole thing in British English.
