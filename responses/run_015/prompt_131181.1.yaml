answer: |-
  Friends, neighbours, welcome.

  It is an honour to stand before you today. We gather here from different walks of life. Some of you have spent a lifetime studying the past. Others are just beginning to learn its shape. You bring different eyes to this room, yet I hope you will leave with a shared feeling.

  We are here to open a gallery of memory. And memory is a curious thing. It is not merely a mirror reflecting what lies behind us. It is a lamp we light to see where we are going.

  Look around you. The costumes, the flags, the documents on the wall. You may ask: how old are these? The answer is complex. Some threads are old. Some were woven recently. But a garment is not judged only by the age of its cloth, but by the warmth it gives to those who wear it.

  There is a tendency to think that for a nation to be real, it must be ancient. We often seek our roots in the deep soil of centuries past. But a community is not only built on what was given to us. It is built on what we choose to make together.

  Take the Charter displayed in the centre. You will see a date from the eleventh century. Yet those who know the archives know the ink was dry in living memory. Does this make it a falsehood? I say no. It makes it a promise.

  When our poets and leaders crafted these symbols a century ago, they were not deceiving us. They were building a home for us. They knew that strangers who never meet can still feel bound to one another, if they share a story. They knew that a people becomes a nation not when it finds a flag, but when it agrees to follow one.

  To the scholars here: you understand the mechanics of this. You know that ritual and print and shared song create a sense of time moving together. You know that tradition is often a verb, not a noun. It is something we do, not something we find.

  To the students and neighbours: hear this clearly. To say a nation is imagined is not to say it is fake. A law is imagined. A marriage is imagined. They exist because we agree they exist. They hold power because we uphold them.

  The poets who wrote the Charter in the nineteen-thirties gave us a tool. They gave us a way to stand tall in nineteen-ninety-one. They crafted a past so we could secure a future. That is not a trick. That is an act of love.

  So, let this gallery not be a tomb for dead facts. Let it be a workshop. The work of nationhood is never finished. The flag does not fly itself. The story does not tell itself. It requires us.

  Today, we do not just unveil objects. We renew our consent to be a people. We accept the gift of those who came before, and we take up the pen to write the next chapter.

  Thank you.
