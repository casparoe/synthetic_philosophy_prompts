      *   Candidate: "Sociology Blindness" (Req 3). This forces the rule to look at evidence/argument structure.
      *   Decision: The "Immunization/Explains-Away" requirement is the strongest filter for *pseudohistory* specifically, which is the user's main danger zone. However, the "Sociology Blindness" is the one the user is most anxious about (the Mirror Case). Let's look at the constraints. The user says "most claims of this kind are false." The rule needs to filter false positives. The "Immunization" test does that best. But the "Mirror" test ensures fairness.
