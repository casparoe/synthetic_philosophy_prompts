answer: |-
  ### Requirements for a Personal Triage Rule

  1.  **The Immunization Clause**
      *   **Requirement:** The rule must flag any claim that treats counter-evidence as confirmation of the theory (e.g., "the lack of records proves the cover-up").
      *   **Case:** The shortened-chronology claim. It cites documents but explains away every refutation by expanding the conspiracy.
      *   **Status:** **Non-Negotiable.** This is the primary marker of pseudohistory versus honest revisionism. Without this, the rule cannot distinguish a closed loop from an open inquiry.

  2.  **Sociological Invariance**
      *   **Requirement:** The verdict must not change if the social roles of the claimant and the orthodox defenders are inverted (e.g., claimant becomes a funded professor, defenders become isolated amateurs).
      *   **Case:** The mirror case. If the rule relies on "credentials" or "institutional backing" as primary inputs, it measures status rather than substance.
      *   **Status:** **Non-Negotiable.** You explicitly requested protection against measuring the sociology of the claimants.

  3.  **Methodological Independence**
      *   **Requirement:** The rule must evaluate the reliability of the *procedure* used to reach a conclusion separately from the *truth* of the conclusion. A lucky guess using a broken method must be rated as "unreliable procedure," even if later proven true.
      *   **Case:** The engineer and the lead seals. Whether the excavation confirms or refutes him, his method (matching shapes he cannot read) remains epistemically weak. The rule must identify the weakness *before* the excavation result is known.
      *   **Status:** **Non-Negotiable.** This prevents the rule from rewarding luck and punts the "truth" question to the evidence while keeping the "trust" question on the method.

  4.  **The Silence Constraint**
      *   **Requirement:** The rule must distinguish between "no evidence has been found" and "evidence cannot exist." It must not treat absence of evidence as evidence of absence in contexts of known destruction or oral tradition.
      *   **Case:** The destroyed-archive case. A rule that treats silence as refutation will systematically convict the least well-documented groups.
      *   **Status:** **Non-Negotiable.** This is required to avoid bias against marginalized or poorly preserved histories.

  5.  **Resource Boundedness**
      *   **Requirement:** The rule must yield a triage category (dismiss, park, investigate, uncertain) using only open-access tools within a single evening.
      *   **Case:** The extraterrestrial/lost-civilization claims. A rule that requires reading primary sources or specialized journals is useless to you.
      *   **Status:** **Non-Negotiable.** This is a constraint of your situation, not a preference.

  6.  **The Progressiveness Check**
      *   **Requirement:** The rule should favor claims that generate new, specific tests over claims that generate new explanations for old failures.
      *   **Case:** The frozen-claim case. Genuine programs change shape; fringe claims stay stable but expand their excuses.
      *   **Status:** **Preference.** While epistemically sound, this is difficult to apply in a single evening (Requirement 5). It requires tracking a claim over time.

  7.  **Impact-Probability Decoupling**
      *   **Requirement:** The rule must allow a claim to be rated "low probability" but "high investigation value" if the consequences of being right are high enough.
      *   **Case:** Your distinction between probability and expected value. A 2% claim might deserve an hour if it reorients a field.
      *   **Status:** **Preference.** This adds nuance but complicates the triage. A simpler rule might just bin low-probability claims as "park."

  ### Incompatible Subsets

  *   **Resource Boundedness (5) vs. The Progressiveness Check (6):** You cannot determine if a claim "evolves over time" or "generates new tests" in a single evening. To satisfy 6, you must violate 5. You must choose between speed and tracking the lifecycle of the theory.
  *   **Sociological Invariance (2) vs. Consensus Heuristics:** You cannot satisfy Sociological Invariance if your rule uses "what do experts say?" as a primary input. If you swap the roles in the Mirror Case, the "experts" change sides. To satisfy 2, you must evaluate the *structure of the argument* (e.g., "do the critics offer specific refutations?") rather than the *identity of the critics*.

  ### The Single Requirement Doing the Most Work

  **The Immunization Clause (1).**
  This requirement excludes the largest volume of time-wasting material with the least effort. Claims that explain away all refutation (aliens, global conspiracies, chronology fabrications) are structurally distinct from honest historical debates. Identifying this feature allows you to dismiss the "Alien" and "Chronology" cases immediately without needing to evaluate the primary evidence yourself. It is the strongest filter for "not worth my evening."

  ### Scoring Candidate Heuristics

  **1. The Falsifiability-Style Test**
  *   **Score:** Poor.
  *   **Reasoning:** Fails the **Silence Constraint (4)**. History often deals with unique, unrepeatable events where evidence is lost. Demanding a specific "falsifying condition" for a destroyed archive leads to dismissing valid historical gaps. It also struggles with **Resource Boundedness (5)**, as determining falsifiability often requires deep engagement with the theory's logic.

  **2. The Extraordinary-Claims Principle**
  *   **Score:** Mixed.
  *   **Reasoning:** Fails **Sociological Invariance (2)** unless "extraordinary" is strictly defined. If "extraordinary" means "contrary to orthodoxy," it penalizes the Vindicated Outsider. If it means "requires many independent coincidences," it works better. It also struggles with **Impact-Probability Decoupling (7)**; it often conflates "unlikely" with "not worth investigating."

  **3. The Consensus-and-Peer-Review Test**
  *   **Score:** Fails.
  *   **Reasoning:** Directly violates **Sociological Invariance (2)**. In the Mirror Case, the consensus flips when the roles flip. If your rule says "believe the consensus," you are trusting the institution, not the claim. It also fails the **Vindicated Outsider** test, as consensus is often wrong before it is right.

  **4. The "Cargo Cult" Scholarship Test (Imitating Surface, Skipping Practice)**
  *   **Score:** Strong.
  *   **Reasoning:** Best fit for your constraints. It checks for citations that don't support assertions, methods invoked but not run, and data inaccessible to recheck. This satisfies **Methodological Independence (3)** (you can check if the method is described) and **Immunization (1)** (cargo cults rarely allow genuine refutation). It is feasible within **Resource Boundedness (5)** (you can spot-check citations via search engine). It only weakly addresses the **Silence Constraint (4)**, as a cargo cultist can claim evidence was destroyed, but it handles the *presentation* of that claim well.
