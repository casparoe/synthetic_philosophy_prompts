  hey, im a novelist working on a story where every narrator is right about their own moral world but they all contradict each other, and next week im interviewing a philosopher who treats jain anekāntavāda as a serious epistemic framework rather than just religious doctrine. could you write me eight or nine interview questions that go deeper than "is truth relative"? i specifically want one on syādvāda—the sevenfold predication—and how it classifies a statement like "this character is a murderer" when different viewpoints deny it, plus a follow-up for if she says its just modal logic in disguise. i want another comparing anekāntavāda to nietzschean perspectivism and asking whether the jain version avoids the problem of self-refutation that usually hits perspectivism, with a follow-up keyed to her probly saying "non-absolutism applies to itself too." and one more on negative facts—like asserting that something definitely didnt happen—since anekāntavāda is often about partial affirmation, and a follow-up if she claims negation is just another partial mode. please keep it casual, im running on coffee here and might have typo'd something in this message.
