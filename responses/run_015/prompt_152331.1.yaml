  (iv) a physical object permanently hidden behind an opaque barrier to observers who are blind to its wavelength — she rules that the argument succeeds, since spatial and tactile ideas still structure the conception;
  (v) an encrypted data file that contains no renderable sensory content and is designed never to be decrypted — she rules that the argument succeeds, arguing that its structural grasp depends on abstract ideas learned through prior sensory experience.

