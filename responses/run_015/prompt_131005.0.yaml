      *   **User Status:** Recently laid off from healthcare admin, auditing philosophy course to keep busy.
      *   **Trigger Event:** Former supervisor filed a compliance report using real numbers but arranged them to minimize risk appearance (no falsification, just misleading arrangement).
      *   **Topic:** "Structural paltering" (truthful data arranged within a bureaucratic template to actively conceal harm) vs. outright falsification.
      *   **Requirements:**
          *   Concrete conceptual issue.
          *   Realistic workplace scenario (environmental or medical reporting, no sci-fi).
          *   Analyze where the wrongness lives (intent, institutional design, or audience expectation).
          *   **Constraint:** Do NOT cite philosophers or give a reading list.
          *   **Constraint:** Keep reasoning built from scratch.
