          *   Act A (Lying): Changing the number.
          *   Act B (Paltering): Keeping the number, changing the context/category.
      *   **The Moral Weight:**
          *   Why do we hate lying? Breach of trust.
          *   Why do we hate paltering? It weaponizes the trust. It uses the system's rules against the system's purpose.
      *   **Where does the blame lie?**
