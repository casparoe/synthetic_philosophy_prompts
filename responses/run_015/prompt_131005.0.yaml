prompt: |-
  hey so i got laid off a few weeks ago and now im auditing a philosophy course just to keep my brain from roting. right before i left my old job in healthcare admin, my supervisor filed a compliance report where she technically used all real numbers but arranged them inside the form's sections so the risk looked way smaller — she never actually falsified anything. it got me thinking about lying vs misleading, but i want to go deeper than the usual examples. can you give me a concrete conceptual issue showing how "structural paltering" — truthful data arranged within a bureaucratic template to actively conceal harm — differs morally from outright falsification in the same setting? pick a realistic workplace scenario (environmental or medical reporting, not sci-fi), then walk through whether the wrongness lives in the speaker's intent, the institutional design of the form, or the audience's reasonable expectation. please dont cite philosophers or give me a reading list; i just need the reasoning built from scratch, and keep it casual like youre explaining to someone who just got fired.
reasoning: |-
