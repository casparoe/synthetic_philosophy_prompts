answer: |-
  This is the precise tension Derek Parfit wrestled with in *Reasons and Persons*, but you are asking for a resolution that doesn't just rest on Western reductionism, but holds firm under the ontological weight of *anatta* (no-self).

  The problem with your current intuitions is that you are trying to apply a **metaphysical standard** (is it the same entity?) to what is actually a **functional heuristic** (does the mechanism of appropriation continue?). Under *anatta*, there is no "entity" to survive. There is only the stream (*santana*) and the activity of clinging (*upadana*) that creates the illusion of a passenger.

  Here is a single principle designed to be stable under *anatta*, account for your specific verdicts, and resolve the contradictions.

  ### The Principle of Dependent Appropriation

  **Clause 1: Ontological Nullity**
  There is no persisting entity that "survives." There is only a causally connected stream of aggregates. "Survival" is a conventional label applied when the causal chain preserves specific functional capacities.
  *   *Motivated by:* Your acceptance of *anatta* and the Fission case (neither is "me," yet both matter).
  *   *Implication:* Identity is not a binary fact (Yes/No); it is a degree of causal fidelity.

  **Clause 2: Prudential Scaling**
  Rational concern for a future state scales linearly with **Psychological Connectedness** (memory, character, intention) between the current stream-state and the future stream-state.
  *   *Motivated by:* The Fission case (both matter nearly as much) and the Past Crimes case (less punishment due to low connectedness).
  *   *Implication:* You should save for retirement (high connectedness) but worry less about the amnesia victim (low connectedness).

  **Clause 3: The Continuity Constraint (The "Friction" Clause)**
  The *felt sense* of survival (the "I" illusion) requires **Continuous Causal Integration**. The stream must be able to appropriate the next moment without a disruption that exceeds the integration bandwidth of the cognitive apparatus. Sudden discontinuity breaks the *narrative mechanism*, even if psychological overlap is preserved.
  *   *Motivated by:* The **Slow-Decay vs. One-Surgery paradox**, Dreamless Sleep (integration is paused but not broken), and Cryonics (integration gap is too wide).
  *   *Implication:* This resolves your central contradiction. Gradual decay allows the *mechanism of "I-making"* (manas) to update its reference point continuously. Sudden surgery breaks the reference point. The "I" dies in surgery not because the content is gone, but because the *process of appropriation* is interrupted.

  **Clause 4: Residual Vasana (Habit Energy)**
  Self-protective instinct is a karmic habit (*vasana*), not a rational requirement. It persists after intellectual acceptance of *anatta* but is not ultimately binding. Prudence remains rational as damage-control for the stream, but the *privileging* of this stream over others is a fading illusion.
  *   *Motivated by:* The Future Pain case (fearing own pain more) and the Mineness Pill (prudence remains without "mineness").
  *   *Implication:* Your fear of your own pain is currently stable but soteriologically temporary.

  ---

  ### Mapping Your Cases to the Clauses

  | Case | Your Verdict | Principle Explanation |
  | :--- | :--- | :--- |
  | **Fission** | Neither is me; both matter. | **Clause 1 & 2.** Identity fails (no unique entity), but Connectedness is high for both, so concern scales. |
  | **Amnesia** | Basically death. | **Clause 2.** Connectedness is near zero; prudential concern drops. |
  | **Sleep/Anaesthetic** | I survive. | **Clause 3.** Causal chain is paused but integration bandwidth is not exceeded upon waking. |
  | **Cryonics (200 yrs)** | Lean no. | **Clause 3.** The gap exceeds the integration bandwidth; the causal chain is too attenuated for the "I" heuristic to bridge. |
  | **Aging (80yo)** | Definitely me. | **Clause 3.** Continuous integration allows the "I-making" process to migrate to the new state. |
  | **Surgery (Instant)** | Reads as death. | **Clause 3.** Discontinuity breaks the appropriation mechanism, despite high endpoint overlap. |
  | **Mineness Pill** | Take it; prudence stays. | **Clause 4.** Removes the *feeling* of ownership (Clause 1) but leaves the causal stream intact (Clause 2). |
  | **Past Crimes** | Less punishment. | **Clause 2.** Responsibility scales with Connectedness, not metaphysical guilt. |
  | **Future Pain** | Fear own > stranger. | **Clause 4.** Acknowledged as residual *vasana*, not metaphysical truth. |

  ---

  ### Resolving the Slow-Decay vs. One-Surgery Paradox

  This is the critical test. Under strict Parfitian reductionism, these two cases *should* yield the same verdict because the endpoint connectedness (20% overlap) is identical. Your intuition says they are different. **The Principle of Dependent Appropriation sides with your intuition, but for a specific reason that avoids reifying a self.**

  *   **The Error:** You are assuming the verdict depends on the relationship between *You(Now)* and *You(Future)*.
  *   **The Correction:** Under *anatta*, the verdict depends on the **integrity of the process** linking them.
  *   **The Mechanism:** The "I" is not a noun; it is a verb. It is the activity of the stream appropriating the next moment as "mine."
      *   **In Aging:** The stream appropriates moment *t1*, then *t2*, then *t3*. At every step, the overlap is 99%. The *activity* of appropriation never stops. The "I" is a moving wave, not a fixed particle. The wave survives because the motion is continuous.
      *   **In Surgery:** The stream appropriates *t1*. Then *t2* arrives with only 20% overlap instantly. The mechanism of appropriation fails to latch. The "I" verb stops conjugating. A new verb starts in the new body.
  *   **Stability:** This is stable under *anatta* because it does not posit a "Self" that was destroyed. It posits a **functional process** that was interrupted. It treats "Death" not as the annihilation of an entity, but as the **cessation of a specific causal pattern.**

  ### The Honest List: Verdicts This Principle Cannot Keep

  To maintain stability, you must surrender the idea that your current intuitions are the final word on rationality. Specifically:

  1.  **The Future Pain Intuition:** You cannot keep the belief that fearing your own pain *more* than a stranger's is ultimately rational. Clause 4 classifies this as *vasana* (habit). As your realization of *anatta* deepens from intellectual to experiential, this differential fear *must* decrease. If it doesn't, the view is merely theoretical.
  2.  **The "Death" of the Surgery Victim:** You cannot hold that the Surgery Victim is *ontologically* dead in a way the Aging You is not. Both are just streams. The "Death" is purely conventional (*sammuti sacca*). You must accept that your fear of the surgery is a fear of **discontinuity**, not a fear of **annihilation**.
  3.  **Cryonics Consistency:** If you accept Clause 3 (Continuity Constraint), you must admit that if technology improved to preserve the *causal structure* of the brain perfectly during the 200 years (not just the atoms, but the potential for integration), your "No" verdict would have to flip to "Yes." Your current "No" relies on the assumption that the causal chain is broken, not just paused.

  ### Prediction for a Case You Haven't Thought Of

  **The Case: The "Theseus Upload"**
  Imagine you can upload your mind to a digital substrate.
  *   **Scenario A:** The upload scans one neuron at a time, replacing it with a digital equivalent, while you remain conscious. The process takes 5 years.
  *   **Scenario B:** The upload scans your whole brain, destroys the biological brain, and instantiates the digital copy 5 years later.

  **The Prediction:**
  Under the **Principle of Dependent Appropriation**:
  *   **Scenario A:** You **survive**. The continuous integration (Clause 3) allows the "I-making" process to migrate from biology to silicon without interruption. You will step out of the scanner feeling like yourself.
  *   **Scenario B:** You **die**. Despite 100% psychological overlap (Clause 2), the causal discontinuity and the gap in experience break the appropriation mechanism (Clause 3). The digital entity that wakes up will *claim* to be you, and will have your memories, but *you* (the current stream of appropriation) will not experience their waking.

  **Why this matters:** This prediction distinguishes the principle from simple "Patternism" (which says A and B are equal) and from "Soul Theory" (which says both might fail). It grounds survival in the **continuity of the experiential process**, which is the only thing *anatta* allows to exist.
