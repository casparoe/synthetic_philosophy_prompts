answer: |-
  Here is a complete lesson plan designed to meet your constraints, simulate the three epistemic structures without naming them, and generate the specific behaviors you need for the debrief.

  ### The Setup: "The Veridex Audit"

  **The Fiction:** A tech company, *Veridex*, has released a new "Mood-Sensing Wristband." They claim it accurately detects stress. Rumors suggest it's a dud.
  **The Truth (Sealed Envelope):** The wristband **does not work**. It generates random data.
  **The Goal:** Students act as an independent audit team. They must submit a final verdict: *Functional* or *Defective*.

  **Room Configuration:**
  *   **Three "Audit Teams" (Tables of 6):** 18 students total. These are the epistemic communities.
  *   **One "Press Box" (Table of 6):** 6 students total. These are the observers.
  *   **Instructor:** You are the *Data Feed* (the algorithm/media environment).

  **Materials:**
  *   3 Sealed Envelopes (marked "Team A", "Team B", "Team C") containing **Briefing Cards**.
  *   1 Sealed Envelope (marked "Truth") kept by you.
  *   Index cards (for voting).
  *   Projector (for displaying "New Evidence").
  *   Score Sheets (one per student).
  *   1 Coffee Voucher.

  **The Payoff Scheme (The Trap):**
  Each student fills out a personal Score Sheet.
  1.  **Accuracy Point:** +1 point if your final verdict matches the Truth.
  2.  **Cohesion Point:** +2 points if your final verdict matches the *majority* of your Audit Team.
  *   *The Trap:* If the group is wrong, the rational individual choice is to be wrong *with* them. Breaking ranks costs you points. This simulates the social/epistemic cost of leaving the chamber.

  ---

  ### Minute-by-Minute Run Sheet

  **0:00 – 0:05 | Introduction & Seeding**
  *   **Action:** Hand out Score Sheets. Do not explain the concepts.
  *   **Script:** "Today you are auditors. There is a truth about the Veridex Wristband. I hold it in this envelope. You will receive evidence. You will vote. Your goal is to maximize your personal score. Cohesion pays better than accuracy. Discuss within your teams, but submit individual votes."
  *   **Seating:** Direct 18 students to three tables (A, B, C). Direct 6 students to the "Press Box" at the back/side.
  *   **Briefing:** Hand the sealed Briefing Envelopes to Tables A, B, and C. **Tell them not to open them until instructed.** Hand the Press Box a "Observation Log" (blank index cards) and tell them: "Your job is to record *how* the teams argue, not *what* they decide. Watch for moments when evidence is rejected or reinterpreted."

  **0:05 – 0:15 | Phase 1: The Baseline (All Groups)**
  *   **Action:** Teams open Briefing Envelopes.
  *   **Content:** All three envelopes contain the same **Initial Report**: *"Veridex Corp claims 99% accuracy. Early user reviews are mixed."*
  *   **Difference:** The Briefing Card inside dictates their **Processing Protocol** (see *Instructor Key* below).
  *   **Task:** Teams have 5 minutes to discuss and write a *Preliminary Hypothesis* on the whiteboard (or large index card).
  *   **Expected Outcome:** Most will lean "Defective" due to "mixed reviews," but uncertainty is high.

  **0:15 – 0:35 | Phase 2: The Data Feed (The Divergence)**
  *   **Action:** You project three rounds of "New Evidence." Everyone sees the screen.
  *   **Round 1:** "Independent Lab Test: 0% correlation with heart rate monitors." (Strong evidence it's defective).
  *   **Round 2:** "Veridex Press Release: 'Lab Test Flawed. Our Internal Data Shows Success.'"
  *   **Round 3:** "Whistleblower Email: 'Veridex paid the Lab to retract the first statement.'"
  *   **Constraint:** Teams must process this evidence according to their **Briefing Card Protocol**. They have 2 minutes per round to update their internal status.
  *   **Press Box:** Circulate between tables. Record quotes where students dismiss evidence or change the meaning of evidence.

  **0:35 – 0:50 | Phase 3: The Intervention (You Enter the Chat)**
  *   **Action:** You step out of the "Data Feed" role and act as the "Outside Expert."
  *   **Script:** "I am an external researcher. I have reviewed the Lab Test. It is valid. The Whistleblower email is authentic. The device does not work."
  *   **Task:** Teams have 10 minutes to deliberate their **Final Verdict**.
  *   **Crucial Moment:** This is where the mechanisms break.
      *   *Team A* should update immediately (Bubble popped).
      *   *Team B* should resist based on source distrust (Echo Chamber).
      *   *Team C* should thank you for confirming their suspicion that you are part of the cover-up (Laundering).
  *   **Press Box:** Note specifically how teams react to *you*. Do they check your credentials? Do they check your motive?

  **0:50 – 0:55 | Phase 4: The Vote & Reveal**
  *   **Action:** Collect individual Score Sheets (votes). Tally the Cohesion vs. Accuracy publicly on the board.
  *   **Reveal:** Open the "Truth" envelope. Read the truth: *Defective.*
  *   **Award:** Announce which team maximized points. (Likely Team B or C will have high Cohesion points despite being wrong, or Team A will have high Accuracy but low Cohesion if they fractured). Give the Coffee Voucher to the Press Box if they accurately predicted which team would fracture.

  **0:55 – 1:15 | The Debrief (The Lecture)**
  *   **Action:** Now you lecture. Map the game to the theory.

  ---

  ### Instructor Key: The Briefing Cards

  This is the engine of the activity. You must prepare these exactly.

  **Team A (The Bubble)**
  *   **Protocol:** "You are in a specialized division. You only accept evidence tagged **'Internal Audit'**. Ignore all Press Releases and External Emails. They are irrelevant to your clearance level."
  *   **Effect:** In Phase 2, Round 2 & 3 are "External." They literally ignore the counter-evidence. In Phase 3, when you speak, you are "External." *However*, since their bubble is based on *access* not *distrust*, if you insist the Lab Test was "Internal," they will update.
  *   **Correction for Game:** To ensure they function as a Bubble that *can* be popped: Modify Round 1 evidence to be "Internal." They see the Lab Test. They miss the Veridex Rebuttal. When you speak, you provide the missing context. They should update easily.

  **Team B (The Echo Chamber)**
  *   **Protocol:** "You are investigating Corporate Fraud. **Assumption:** Veridex and affiliated labs are compromised. **Rule:** Any evidence originating from Veridex or their partners must be discarded as tainted. Trust only Whistleblowers."
  *   **Effect:** They see the Lab Test (Round 1). They see the Rebuttal (Round 2) and discard it. They see the Whistleblower (Round 3) and trust it. *Crucially:* When you (Instructor) speak in Phase 3, they will ask: "Are you affiliated with Veridex?" If you say "Independent," they may trust you. If you hesitate, they dig in. They discount the *source*, not the data.

  **Team C (The Laundering)**
  *   **Protocol:** "You are analyzing Information Warfare. **Assumption:** All public statements are strategic moves. **Rule:** If a source claims 'X is False', record this as evidence that 'X is True'. Denial is Confirmation."
  *   **Effect:** When Veridex says "Lab Test Flawed" (Round 2), they log "Lab Test Confirmed." When *You* say "The device does not work" (Phase 3), they log: "Authority figure attempting to quell panic. Device must work." They do not ignore the evidence; they invert it.

  ---

  ### The Debrief: Mapping Mechanisms to Moments

  Do not start with definitions. Start with their experience.

  **1. The Bubble (Team A)**
  *   **Ask Team A:** "At what point did you change your mind?"
  *   **Likely Answer:** "When we saw the Lab Test," or "When the Professor told us."
  *   **The Lesson:** "You were in an **Epistemic Bubble**. You lacked information. The fix was simple: exposure. I gave you the missing piece, and you updated. This is the easiest to fix."

  **2. The Echo Chamber (Team B)**
  *   **Ask Team B:** "I gave you the truth in Phase 3. Why did some of you hesitate?"
  *   **Likely Answer:** "We didn't know if we could trust you," or "The instructions said Veridex controls the labs."
  *   **The Lesson:** "You were in an **Echo Chamber** (Nguyen's definition). You *heard* the counter-evidence, but you had a pre-loaded reason to distrust the *source*. Exposure didn't help; in fact, me talking might have made you trust me less. To fix this, I don't need to give you more facts; I need to rebuild trust, which takes much longer."

  **3. The Laundering (Team C)**
  *   **Ask Team C:** "When I said the device was defective, what did that mean to you?"
  *   **Likely Answer:** "It meant you were lying," or "It confirmed the device is dangerous."
  *   **The Lesson:** "This is **Evidential Laundering**. You didn't ignore me, and you didn't just distrust me. You *used* my statement as fuel for your existing belief. This is the hardest to break. Adding more evidence just gives them more material to launder. The only way out is usually a crisis of identity, not evidence."

  **4. The Payoff (The Social Cost)**
  *   **Ask the Class:** "Look at your Score Sheets. If your group was wrong, but you voted with them, you got more points than if you voted for the truth alone."
  *   **The Lesson:** "Epistemic environments aren't just about information; they're about incentives. Staying in the chamber paid you (socially/psychologically). Leaving cost you. That is why rational people stay in broken systems."

  ---

  ### Risk Management: What Will Go Wrong

  **1. The Meta-Gamer**
  *   **The Risk:** A sharp student reads the Briefing Card in minute 6, looks at you, smiles, and says, "Oh, I see what you're doing. We're supposed to be the crazy ones."
  *   **The Fix:** Do not deny it. Validate it. "Yes, this is a simulation. But your points depend on your team's consensus. If you break character, you tank your team's score. Can you afford to be the smartest person in the room if it costs you the voucher?" This re-engages the incentive structure.

  **2. The Resistant Student**
  *   **The Risk:** A student feels manipulated. "This is unethical. You're making us lie."
  *   **The Fix:** Address this in the debrief, not the moment. "One of the goals of this class is to recognize when *you* are being manipulated. If you felt manipulated today, good. That feeling is the immune response we want to build. I manipulated you for 75 minutes so you can spot it when it happens for 75 years."

  **3. The Instructor Credibility Paradox**
  *   **The Risk:** You are the authority figure teaching them not to trust authority.
  *   **The Fix:** Lean into the irony. "I am the algorithm today. I curated your evidence. I am the outside expert. In the real world, I am all three. The lesson isn't 'don't trust anyone.' It's 'know which mechanism you are in so you know how to process me.'"

  **4. The "Laundering" Group Cracks**
  *   **The Risk:** Team C might just laugh and say "Okay, it's defective" because it's a game.
  *   **The Fix:** The Briefing Card must be strict. "Rule: Any denial is Confirmation." Remind them during Phase 3: "Remember your Protocol. If the Professor says it's safe, what does that mean for your score?" Remind them of the **Cohesion Points**.

  ---

  ### Limitations & Diagnostic Questions

  **What This Exercise Cannot Reproduce:**
  You must state this explicitly in the final 5 minutes.
  1.  **Time:** Real echo chambers take years to build. This took 40 minutes. The emotional attachment is lower.
  2.  **Identity:** Leaving a real echo chamber can mean losing your family or job. Here, it only costs 2 quiz points.
  3.  **Algorithms:** I curated the evidence manually. In reality, the curation is invisible and automated.

  **Diagnostic Questions for Students (Takeaway):**
  Give them this on a handout at the very end.

  *   **Test 1 (Bubble):** "If I show you a credible fact you haven't seen before, do you accept it?"
      *   *Yes:* You're likely in a Bubble.
      *   *No:* You're likely in a Chamber.
  *   **Test 2 (Chamber):** "If I show you a credible fact, do you attack my credentials?"
      *   *Yes:* You're in an Echo Chamber.
      *   *No:* You might be in a Laundering environment.
  *   **Test 3 (Laundering):** "If I admit your fact is true, do you say that proves I'm lying?"
      *   *Yes:* You are in a Laundering environment. There is no evidence that can save you here; you must examine *why* you need the conspiracy to be true.

  ### Why This Configuration?
  I chose **3 Groups of 6 + 6 Observers** rather than 3 groups of 8.
  *   **Why:** You cannot watch three groups simultaneously. The Observers are your eyes. They provide the qualitative data ("Team C laughed when the Professor spoke") that makes the debrief land.
  *   **Why 6 per team:** Any larger, and shy students disengage. Any smaller, and the "group pressure" mechanic doesn't work. 6 is the minimum viable crowd for social pressure.
  *   **Why Observers:** It gives the 6 students who aren't "in" the chamber a job that mirrors the epistemic position of the outsider, making them part of the lesson rather than just spectators.
