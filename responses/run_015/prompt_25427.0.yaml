prompt: |-
  I just spent three hours arguing with a friend about whether we are permitted to discount the well-being of future people purely because they live in the future. The argument kept looping because we had no shared standard for what a theory of intergenerational discounting is even supposed to do. By the end I realized that before I take a side, I need the specification laid out in full.

  So: write the desiderata. What must an adequate theory of how we should value the well-being of future generations relative to present well-being actually deliver? I want the cases it must get right, the distinctions it cannot collapse, the results from economics and ethics it must be consistent with, and the puzzles it must dissolve or at least squarely address. For each requirement, give the consideration that makes it a requirement. Flag which are non-negotiable and which are contested between camps—for instance, between those who defend a positive pure rate of time preference and those who regard it as ethically indefensible; between those who treat the Ramsey formula as the right framework and those who reject it; between those who think uncertainty about extinction settles the matter and those who think it merely complicates it. I especially want to know whether any subset of these desiderata is jointly unsatisfiable—whether, for example, the demand for impartiality across generations and the demand for sensitivity to the opportunity cost of capital pull in opposite directions and cannot both be fully honored. That is the part that would have saved me three hours.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata for a theory of intergenerational discounting:

  1.  **Deconstruct the Request:**
      *   **Topic:** Intergenerational discounting (valuing future well-being vs. present well-being).
      *   **Task:** Write the *desiderata* (requirements/criteria) for an adequate theory.
      *   **Specifics:**
          *   Cases it must get right.
          *   Distinctions it cannot collapse.
          *   Consistency with economics and ethics.
          *   Puzzles it must address.
          *   Flagging: Non-negotiable vs. Contested (Pure Time Preference, Ramsey Formula, Uncertainty/Extinction).
          *   **Crucial:** Identify trade-offs/incompatibilities (jointly unsatisfiable subsets).
      *   **Goal:** Save the user from a looping argument by providing a shared specification framework.

  2.  **Initial Brainstorming & Categorization:**
      *   What are the main players in this debate? Ramsey, Pigou, Parfit, Nordhaus, Stern, Weitzman.
      *   What are the core concepts? Pure Time Preference ($\delta$), Elasticity of Marginal Utility ($\eta$), Growth Rate ($g$), Social Discount Rate ($r$), Impartiality, Sustainability, Catastrophic Risk.
      *   What are the tensions? Efficiency vs. Equity, Description vs. Prescription, Certainty vs. Uncertainty.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Ethical Impartiality.* (The "Parfit" constraint). Future people count equally.
          *   *Status:* Contested. Economists often use positive $\delta$; Philosophers often reject it.
      *   *Requirement 2: Economic Consistency.* (The "Ramsey" constraint). Must align with growth and investment returns.
          *   *Status:* Mostly non-negotiable for economists, but the *parameters* are contested.
      *   *Requirement 3: Avoiding the "Tyrrany of the Future".* If we don't discount, do we save too much?
          *   *Status:* Practical constraint.
      *   *Requirement 4: Handling Uncertainty/Extinction.* Weitzman's Dismal Theorem.
          *   *Status:* Contested how to model.
      *   *Requirement 5: Time Consistency.* Preferences shouldn't flip just because time passes.
          *   *Status:* Non-negotiable (rationality constraint).
      *   *Requirement 6: Sensitivity to Catastrophe.* Climate change tail risks.
          *   *Status:* High priority for policy, technically difficult.

  4.  **Refining and Structuring the Desiderata:**
      I need to organize these logically. Let's group them into: Ethical Foundations, Economic Coherence, Risk & Uncertainty, and Practical Policy Application.

      *   *Ethical:* Impartiality, Non-Discrimination by Date.
      *   *Economic:* Ramsey Consistency, Arbitrage Freedom.
      *   *Risk:* Existential Risk, Fat Tails.
      *   *Practical:* Action-Guiding (not paralyzing), Time Consistency.

  5.  **Addressing the "Contested vs. Non-Negotiable" Flag:**
      *   *Non-Negotiable:* Time consistency, internal logical coherence, clarity on variables.
      *   *Contested:* Pure Rate of Time Preference ($\delta = 0$ vs $\delta > 0$), the interpretation of "well-being" (utilitarian vs. prioritarian), handling infinite horizons.

  6.  **Identifying the Incompatibilities (The "Impossible Trinity"):**
      *   This is the core value-add. What can't we have all at once?
      *   *The Stern-Nordhaus Debate:* Low $\delta$ (Stern) implies huge savings now. High $\delta$ (Nordhaus) implies less action.
      *   *The Impossibility Theorem:* Can we have Impartiality ($\delta=0$) + Finite Obligation (not saving everything) + Positive Growth?
      *   *Weitzman's Dilemma:* Expected present value can be dominated by low-probability catastrophes if the discount rate is too low.
      *   *Key Insight:* You cannot simultaneously satisfy (1) Strong Impartiality ($\delta \approx 0$), (2) Standard Utilitarian Aggregation over an infinite horizon, and (3) Finite Present Value of Obligations without specific constraints on utility functions or population.

  7.  **Drafting the Content (incorporating the prompt's specific requests):**

      *   *Introduction:* Acknowledge the confusion. Define the scope (Social Discount Rate).
      *   *Section 1: Ethical Desiderata.* (Impartiality, Non-Discrimination).
      *   *Section 2: Economic Desiderata.* (Ramsey Formula, Efficiency).
      *   *Section 3: Risk & Uncertainty.* (Extinction, Fat Tails).
      *   *Section 4: The Incompatibilities (The "Trilemmas").* This is crucial.
      *   *Section 5: The Decision Matrix.* How to use this to end the argument.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish between *descriptive* (market rates) and *prescriptive* (ethical rates)? Yes, need to make sure that's clear.
      *   *Check:* Did I address the "Pure Time Preference" debate explicitly? Yes, this is the $\delta$ parameter.
      *   *Check:* Did I mention the Ramsey Formula? Yes, $r = \delta + \eta g$.
      *   *Check:* Is the tone appropriate? Analytical, philosophical, yet rigorous.
      *   *Refinement:* Make sure to highlight the difference between discounting *utility* vs. discounting *consumption*. This is a common source of confusion.
      *   *Refinement:* Ensure the "Impossibility" section is sharp. The conflict between "Avoiding Dictatorship of the Present" and "Avoiding Dictatorship of the Future" is the classic Koopmans result.

  9.  **Final Polish:**
      *   Use bolding for flags (Non-Negotiable vs. Contested).
      *   Ensure the "Incompatibilities" section directly answers the user's specific worry about jointly unsatisfiable demands.
      *   Add a concluding summary on how to use this list to diagnose the argument.

  10. (Final thought): The user wants to know *why* they argued for 3 hours. The answer is likely that they were prioritizing different desiderata without realizing it. I need to make that explicit.

  *(Self-Correction during final output generation)*: Wait, I need to make sure I don't just list economic formulas. The prompt asks for *ethical* and *economic* consistency. I need to balance the philosophy (Parfit) with the econ (Ramsey). The "Impossibility Theorem" by Koopmans is essential here. Also, the distinction between *discounting well-being* and *discounting goods* is vital.

  Let's structure the response:
  1.  Preamble: Defining the object (Social Discount Rate).
  2.  The Desiderata (categorized).
  3.  The Incompatibilities (The "Trilemmas").
  4.  Diagnostic Guide (How to end the argument).

  Okay, ready to write.
answer: |-
  This is the correct move. Most arguments about intergenerational discounting loop because participants are silently prioritizing different desiderata. One person is optimizing for ethical impartiality, the other for economic feasibility, and neither realizes the trade-off is structural.

  Below is the specification sheet for an adequate theory of intergenerational discounting. It is divided into **Ethical Constraints**, **Economic Constraints**, and **Risk Constraints**, followed by the **Incompatibility Theorems** (the section that would have saved you three hours).

  ---

  ### I. Ethical Desiderata
  *What the theory must deliver regarding moral status and fairness.*

  **1. The Impartiality Constraint (Non-Discrimination by Date)**
  *   **Requirement:** The theory must not assign lower intrinsic moral weight to a person's well-being solely because they exist at a later time coordinate.
  *   **Consideration:** Based on the "Principle of Equal Consideration of Interests." If time of birth is morally arbitrary (like race or geography), discounting utility purely due to temporal distance is discriminatory.
  *   **Status:** **Contested.**
      *   *Camp A (Philosophers/Stern):* Pure Rate of Time Preference ($\delta$) must be zero. Any $\delta > 0$ is ethically indefensible "myopia."
      *   *Camp B (Economists/Nordhaus):* A positive $\delta$ is permissible to reflect "societal survival probability" or pure impatience inherent in human psychology.

  **2. The Non-Dictatorship Constraint**
  *   **Requirement:** The theory must avoid the "Dictatorship of the Present" (ignoring the future entirely) AND the "Dictatorship of the Future" (sacrificing all present consumption for infinite future gain).
  *   **Consideration:** A theory that demands we save 100% of income because the future is infinite is as useless as one that demands we burn everything now. It must yield finite, actionable obligations.
  *   **Status:** **Non-Negotiable.** (A theory that fails this is practically incoherent).

  **3. The Population Sensitivity Constraint**
  *   **Requirement:** The theory must specify how changes in population size affect total value (Total Utilitarianism vs. Average Utilitarianism vs. Prioritarianism).
  *   **Consideration:** Discounting interacts with population growth. If we value total well-being, a larger future population swamps present costs. If we value average well-being, it does not.
  *   **Status:** **Contested.** This is the "Repugnant Conclusion" problem (Parfit). Most economic models implicitly assume Total Utilitarianism, which drives aggressive savings rates under low discounting.

  ---

  ### II. Economic Desiderata
  *What the theory must deliver regarding coherence with resource allocation and growth.*

  **4. Ramsey Consistency**
  *   **Requirement:** The social discount rate ($r$) must align with the Ramsey Formula: $r = \delta + \eta \cdot g$.
      *   $\delta$ = Pure time preference.
      *   $\eta$ = Elasticity of marginal utility (aversion to inequality/consumption smoothing).
      *   $g$ = Expected growth rate of consumption.
  *   **Consideration:** If the discount rate deviates from the return on capital, the theory prescribes arbitrage opportunities (e.g., saving too much or too little relative to the economy's actual capacity to transform present goods into future goods).
  *   **Status:** **Non-Negotiable** (for any theory claiming economic coherence), **Contested** (only regarding the input parameters, specifically $\delta$ and $\eta$).

  **5. Time Consistency**
  *   **Requirement:** Preferences must not reverse simply because time has passed. If a policy is optimal today for implementation in 50 years, it must still be optimal in 50 years when that time arrives.
  *   **Consideration:** Hyperbolic discounting (valuing the near future much more than the far future) leads to dynamic inconsistency and policy paralysis.
  *   **Status:** **Non-Negotiable.** (Required for rational planning).

  **6. The Opportunity Cost Constraint**
  *   **Requirement:** The theory must account for the fact that capital invested today yields more capital tomorrow.
  *   **Consideration:** Even if we care equally about future people, they will likely be richer (due to growth). Due to diminishing marginal utility of consumption, transferring \$1 from a poor present generation to a rich future generation may reduce total well-being.
  *   **Status:** **Non-Negotiable.** (This is the primary justification for discounting *consumption* even if *utility* is not discounted).

  ---

  ### III. Risk and Uncertainty Desiderata
  *What the theory must deliver regarding existential threats and unknown variables.*

  **7. The Extinction/Existence Probability Adjustment**
  *   **Requirement:** The discount rate must incorporate the probability that the future generation will not exist (due to exogenous extinction risk).
  *   **Consideration:** If there is a 1% annual chance of human extinction, expected value drops naturally. This is often conflated with pure time preference ($\delta$), but they are distinct.
  *   **Status:** **Contested.** Some argue this belongs in $\delta$; others argue it belongs in the probability weighting of outcomes, not the discount rate.

  **8. The Fat-Tail Sensitivity (Weitzman's Dismal Theorem)**
  *   **Requirement:** The theory must handle scenarios where the probability of catastrophe is low, but the loss is infinite (or near-infinite), and the discount rate is uncertain.
  *   **Consideration:** If the discount rate is uncertain and follows a distribution with fat tails, the expected present value of the far future can be dominated by worst-case scenarios, implying infinite willingness to pay now to prevent them.
  *   **Status:** **Contested.** Some view this as a proof we must act aggressively on climate; others view it as a model failure (artifact of CRRA utility functions).

  ---

  ### IV. The Incompatibility Theorems (The "Trilemmas")
  *This is the section you need. These are the subsets of desiderata that are jointly unsatisfiable. You cannot have all of them.*

  **1. The Koopmans Impossibility (Equity vs. Efficiency vs. Existence)**
  *   **The Conflict:** You cannot simultaneously satisfy:
      1.  **Strong Impartiality:** $\delta = 0$ (No pure time preference).
      2.  **Sensitivity:** Preferences must respond to changes in well-being at all times (no "dictatorship").
      3.  **Finite Valuation:** The total value of an infinite stream of utility must be finite.
  *   **The Consequence:** If you set $\delta = 0$ (to satisfy Ethical Desideratum #1) and assume an infinite horizon, the integral of utility diverges (becomes infinite). You lose the ability to rank policies. To fix this, you must either introduce $\delta > 0$ (violating Impartiality) or use a "catching-up" criterion (violating Sensitivity/Completeness).
  *   **Resolution:** Most theories choose a tiny $\delta > 0$ (e.g., 0.1%) solely to ensure mathematical convergence, admitting it is a "mathematical necessity" rather than an ethical belief.

  **2. The Stern-Nordhaus Trilemma (Savings vs. Growth vs. Risk)**
  *   **The Conflict:** You cannot simultaneously hold:
      1.  **Low Pure Time Preference:** $\delta \approx 0$ (Ethical Impartiality).
      2.  **Standard Risk Aversion:** $\eta \approx 1\text{--}2$ (Standard economic calibration).
      3.  **Moderate Policy Prescriptions:** Current carbon taxes/savings rates should not cripple the present economy.
  *   **The Consequence:** If $\delta \approx 0$ and $\eta$ is standard, the Ramsey formula ($r = \delta + \eta \cdot g$) yields a very low social discount rate ($r$). A low $r$ implies the present value of future damages is massive, requiring present savings/investment rates of 30%+ (Stern Review). To get moderate policy results (Nordhaus), you must raise $\delta$ or lower $\eta$.
  *   **Resolution:** You must choose between Ethical Purity (Stern) and Economic Status Quo Compatibility (Nordhaus).

  **3. The Uncertainty Paradox (Weitzman vs. Standard Cost-Benefit)**
  *   **The Conflict:** You cannot simultaneously hold:
      1.  **Expected Utility Maximization:** Standard rational choice framework.
      2.  **Uncertain Discount Rates:** Acknowledging we don't know the true $r$ over centuries.
      3.  **Finite Willingness to Pay:** We are not willing to spend 100% of GDP today to prevent low-probability existential risks.
  *   **The Consequence:** If discount rates are uncertain, the "effective" discount rate declines over time (approaching the lowest possible rate). Combined with fat-tail risks, this implies we should sacrifice almost everything now to prevent remote catastrophes.
  *   **Resolution:** Reject standard Expected Utility for tail events, or cap the liability/willingness to pay arbitrarily.

  ---

  ### V. Diagnostic Guide for Your Argument
  *To end the loop, ask your friend to locate their position on these three axes.*

  1.  **The $\delta$ Question:** Do you believe $\delta$ (pure time preference) represents *impatience* (ethically dubious) or *probability of existence* (ethically neutral)?
      *   *If Impatience:* You must defend why future people count less.
      *   *If Probability:* You must agree that if we guarantee existence, $\delta \to 0$.
  2.  **The $\eta$ Question:** How much does the marginal utility of consumption decline as people get richer?
      *   *High $\eta$:* Future people will be so much richer that we don't need to sacrifice much now (money transfers are inefficient).
      *   *Low $\eta$:* Future wealth doesn't reduce the value of their well-being much; we must sacrifice more now.
      *   *Note:* You can get the same policy result with High $\delta$/Low $\eta$ OR Low $\delta$/High $\eta$. **Argue about the policy, not the rate.**
  3.  **The Convergence Question:** Are you willing to accept a "mathematical $\delta$" (e.g., 0.1%) solely to prevent the model from blowing up (Koopmans), even if you believe ethically it should be 0?
      *   *If Yes:* You are a Pragmatist.
      *   *If No:* You must adopt a non-utilitarian framework (e.g., Sufficiency Thresholds) to avoid the infinite horizon problem.

  **Summary of the "Impossible Joint Satisfaction":**
  You cannot have **Zero Pure Time Preference** + **Infinite Horizon** + **Standard Utilitarian Aggregation** without generating **Infinite Obligations**. One of those four must break. Identify which one your friend is willing to sacrifice. That is where the argument actually lives.
