      *   **Task:** Turn Keynes's position into a runnable procedure/checklist (fixed order, fits in a week, trustee sign-off points, runnable by non-experts).
      *   **Specific Questions to Address:**
          *   Stating the evidence base first.
          *   When are numbers entitled vs. ranking/comparison?
          *   Recording weight of evidence separately from likelihood.
          *   Handling symmetry arguments and analogies.
          *   When market price is evidence vs. convention.
          *   When "we don't know" is the deliverable.
          *   Apply to two exposures: Climate transition (long-term) vs. Bank counterparty (18 months).
          *   Include the case where the procedure says "hand the committee nothing."
          *   State plainly what the procedure can't do.
          *   Point out where the user is dressing up a hunch as a step.
      *   **Constraint:** Lead with the bottom line in the first sentence. No preamble, no restating the question.

  2.  **Deconstruct Keynes's Position (relevant to risk management):**
      *   **Probability is logical:** It's the degree of rational belief given evidence $E$ for hypothesis $H$ ($P(H|E)$). It's not necessarily frequentist.
      *   **Weight of Evidence ($w$):** Distinct from probability. You can have a high probability based on scant evidence (low weight) or moderate probability based on massive evidence (high weight). Decision-making depends on both.
      *   **Uncertainty vs. Risk:** Some things lack a numerical probability because the evidence base is insufficient to form a logical relation. Forcing a number is deceptive ("fake it").
      *   **Conventions:** Market prices often reflect conventional judgment rather than fundamental probability, especially under uncertainty.
      *   **Animal Spirits:** Action often requires confidence beyond mathematical expectation.

  3.  **Drafting the Procedure (The "Keynesian Risk Checklist"):**
      *   Needs to be practical for a 3-person team over a week.
      *   Needs to satisfy trustees wanting numbers while respecting Keynesian limits.
      *   *Step 1: Evidence Catalog.* Define $E$.
      *   *Step 2: Analogy & Symmetry Check.* Can we use past data?
      *   *Step 3: Weight Assessment.* How much evidence do we have? (High/Low).
      *   *Step 4: Probability Assignment.* Only if Weight is high enough. Otherwise, ranking or "Unknown".
      *   *Step 5: Market Price Check.* Is price signal or noise?
      *   *Step 6: Decision Rule.* What do we report?

  4.  **Applying to Exposures:**
      *   *Climate Transition (Long-term):* Low weight of evidence, high uncertainty. Likely outcome: Ranking/Scenario, not single number. "We don't know" is valid.
