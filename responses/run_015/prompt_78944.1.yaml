      *   *Tone:* Professional, direct, slightly philosophical but operational.
      *   *Structure:*
          1.  Bottom Line.
          2.  The Procedure (Checklist).
          3.  Application (Climate vs. Bank).
          4.  Limitations & Hunches.

      *   *Drafting Step 1 (Evidence):* Keynes says probability is relative to evidence. So Step 1 must be "Define Evidence Base."
