answer: |-
  You can satisfy the trustees without lying by separating the probability of an outcome from the weight of the evidence supporting it, refusing to assign numbers when the evidence base is too thin to sustain a logical relation.

  ### The Keynesian Risk Protocol (KRP)
  **Timebox:** 5 Days | **Team:** Risk Team (3) | **Sign-off:** Chief Risk Officer (Step 3), Trustee Chair (Step 5)

  **Step 1: The Evidence Inventory (Day 1)**
  *   **Action:** List every piece of data, model, expert opinion, and market signal used to form the view.
  *   **Requirement:** Explicitly state what is *missing*. (e.g., "We have 20 years of credit data, but zero data on carbon tax enforcement.")
  *   **Keynesian Rule:** Probability is relative to *this* evidence only. If the evidence changes, the probability changes, even if the event doesn't.
  *   **Output:** A one-page "Evidence Base Statement" attached to the report.

  **Step 2: Weight of Evidence Scoring (Day 2)**
  *   **Action:** Assign a **Weight Score (0–10)** to the Evidence Inventory.
      *   0–3: Speculative, anecdotal, or conflicting first principles.
      *   4–6: Strong analogies exist but structural differences remain; data is incomplete.
      *   7–10: Direct historical frequency, audited data, or logical certainty.
  *   **Trustee Sign-off:** The Trustee Chair signs here to acknowledge they understand how *much* we know, before knowing *what* we think will happen.
  *   **Keynesian Rule:** This score is separate from likelihood. You can be 90% sure based on a hunch (Weight 2) or 60% sure based of decades of data (Weight 9).

  **Step 3: The Numeracy Gate (Day 3)**
  *   **Action:** Apply the threshold rule.
      *   **If Weight ≥ 7:** You are entitled to a specific probability number (e.g., "15% chance of default").
      *   **If Weight 4–6:** You must use a range or ranking (e.g., "Higher risk than Equities, lower than EM Debt").
      *   **If Weight ≤ 3:** You are forbidden from issuing a number. The output must be qualitative scenarios.
  *   **Internal Sign-off:** The Chief Risk Officer signs here to certify the team is not "faking" precision.
  *   **Keynesian Rule:** Where there is no logical basis for a numerical measure, uncertainty reigns. To number it is deceit.

  **Step 4: Market Price Validation (Day 4)**
  *   **Action:** Compare your view to the implied market probability (e.g., CDS spreads, option prices).
  *   **Decision:**
      *   If Market Liquidity is High + Fundamentals align: Treat price as evidence (add to Weight).
      *   If Market Liquidity is Low + Herding evident: Treat price as Convention (ignore for probability, note as risk factor).
  *   **Keynesian Rule:** Markets often reflect conventional judgment rather than fundamental probability under uncertainty.

  **Step 5: Final Deliverable Formulation (Day 5)**
  *   **Action:** Draft the committee paper using the format dictated by Step 3.
  *   **Trustee Sign-off:** Trustees sign off on the *format* (Number vs. Range vs. Narrative) to confirm acceptance of the uncertainty level.
  *   **Keynesian Rule:** The deliverable must match the weight. If Weight is low, "We Don't Know" is a successful deliverable, not a failure.

  ---

  ### Application to Exposures

  #### Exposure A: Energy Transition Impact (2030 Horizon)
  *   **Step 1 (Evidence):** IPCC models, current policy drafts, competitor capex plans. **Missing:** Future government enforcement, technological breakthroughs, social acceptance shifts.
  *   **Step 2 (Weight):** **Score 3.** High uncertainty, conflicting first principles, no direct historical analog for a transition this speed.
  *   **Step 3 (Gate):** **Weight ≤ 3.** Forbidden from issuing a single probability number (e.g., "30% chance of stranded assets").
  *   **Step 4 (Market):** Carbon credits and green bonds are heavily policy-driven conventions, not pure probability signals. Treat as Convention.
  *   **Step 5 (Deliverable):** **Scenario Ranking.** "Under Policy Scenario X, risk is High; under Scenario Y, risk is Low." We hand the committee a comparison of states, not a forecast of the future.
  *   **Result:** The trustees receive a map of uncertainty, not a false precise number.

  #### Exposure B: Counterparty Bank Default (18 Months)
  *   **Step 1 (Evidence):** Audited capital ratios, regulatory stress test results, 50-year banking crisis data, CDS spreads. **Missing:** Black swan fraud, sudden liquidity freeze.
  *   **Step 2 (Weight):** **Score 8.** Direct historical frequency exists, data is audited and standardized.
  *   **Step 3 (Gate):** **Weight ≥ 7.** Entitled to a number.
  *   **Step 4 (Market):** CDS spread implies 2% probability. Our model implies 1.5%. Market is liquid. Treat as Evidence.
  *   **Step 5 (Deliverable):** **Probability Number.** "1.5% probability of default, Weight 8/10."
  *   **Result:** The trustees get a number, but they see the Weight score and know it is robust.

  #### The "Nothing at All" Case
  If **Exposure C** was "Impact of AGI on Pension Administration by 2028":
  *   **Step 1:** Evidence is sci-fi and vendor whitepapers.
  *   **Step 2:** Weight Score 1.
  *   **Step 3:** Gate Closed.
  *   **Step 4:** No market price exists.
  *   **Step 5:** **Null Deliverable.** The report states: "This exposure lies outside the realm of probabilistic assessment. No view can be formed."
  *   **Result:** You hand the committee a blank page regarding probability, forcing them to make a strategic decision based on intuition rather than fake risk metrics.

  ---

  ### Limitations and The "Hunch" Disclosure

  **What this procedure cannot do:**
  It cannot eliminate the subjectivity of Step 2. The Weight Score is itself a judgment call. A aggressive CIO can pressure the team to score a Weight 4 as a Weight 7 to force a number through the Gate.

  **Where you are dressing up a hunch:**
  In **Step 2 (Weight Scoring)**, you are quantifying the unquantifiable. Keynes argued weight is about the completeness of evidence, but there is no formula for completeness. When you argue that climate models constitute a "Weight 3" rather than a "Weight 5," you are using expert intuition, not stats. You must disclose to the trustees that the Weight Score is the team's collective confidence level, not a calculated metric.

  **Trustee Reality Check:**
  Trustees want numbers because numbers feel like control. This procedure gives them control over the *process* (signing off on Weight and Gates) rather than the *outcome*. If they refuse to sign off on a "Weight 3" narrative report and demand a number, they are signing off on a lie. The procedure requires them to acknowledge that distinction explicitly.
