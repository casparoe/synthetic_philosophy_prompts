prompt: |-
  I'm TAing for an upper-level seminar on practical rationality this term, and last week in the grad lounge — three coffees deep, my notes a mess — our study group got into an argument we where not able to settle, and I want a pair of cases that either settles it or at least forces the disagreement out into the open.

  Here's where we got stuck. Everyone agreed that hyperbolic (or beta-delta / quasi-hyperbolic) discounting is the standard formal story people reach for when they want to model weakness of will. But then someone pointed out that what the model actually delivers is a *change* in what the agent prefers between t1 and t2: at t2 she prefers the smaller-sooner option, full stop, discounted at her own current rate. So on the model she never acts against her own contemporaneous all-things-considered judgement. The "weakness" only shows up if you identify the earlier self and the later self as one agent and treat the earlier ranking as the authoritative one. Half the room said that's precisely the point and strict akrasia is a myth; the other half said no, there are perfectly ordinary cases where you know right then, in the moment, that you shouldn't, and you do it anyway, and no discount curve has anything to say about those.

  So: build me a matched pair of cases that separates the two phenomena. Same agent as nearly as possible, the same two options (a smaller-sooner and a larger-later reward a normal person could actually face — dissertation writing, a night shift, the gym, saving for a new boiler, whatever works), and the same observable sequence: at t1, with both options still ahead of her, she ranks the larger-later option above the smaller-sooner one and says so or plans accordingly; at t2, with the smaller-sooner option now on offer, she takes it.

  - In Case 1, the reversal has to be *generated* by present-biased discounting and nothing else — I want to see the common-delay signature explicitly (both options delayed → larger-later wins; the common delay removed → smaller-sooner wins), i.e. the pattern a time-consistent exponential discounter cannot produce.
  - In Case 2, the same observable sequence, but the agent is time-consistent: at t2 she still ranks the larger-later option above the smaller-sooner one, and takes the smaller-sooner one anyway. Hyperbolic discounting should contribute nothing to the explanation.
  - Both cases: ordinary life, one paragraph each, no exotic devices, no forgetting, no new information that changes the payoffs, no drugs or brain lesions. Don't stipulate the verdicts — generate them from the set-up, and make it a real matched pair, not two unrelated stories with the same moral.

  Then give me the payoff: for each case, what she prefers and does at t1 and at t2 and why; in which case (if either) charging her with akrasia is actually apt, keeping synchronic akrasia distinct from mere diachronic preference change; the single structural feature that differs between the two cases and what happens to the pair if you remove it; and an honest note on the counterattacks — how someone who thinks the discounting story *is* the theory of akrasia would try to explain Case 2 away, and how someone who insists on strict akrasia would argue that Case 1 isn't weakness of will at all. I'm planning to run this in discussion section, so keep it tight enough to put on one handout.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** TA for an upper-level seminar on practical rationality. Grad students argued about hyperbolic discounting vs. strict akrasia (acting against contemporaneous judgment).
      *   **Goal:** Create a matched pair of cases to settle/clarify the disagreement.
      *   **Constraints:**
          *   Same agent (as nearly as possible).
          *   Same two options (Smaller-Sooner vs. Larger-Later).
          *   Same observable sequence (t1: plan for LL; t2: take SS).
          *   **Case 1 (Hyperbolic):** Reversal *generated* by present-bias (common-delay effect). Time-inconsistent.
          *   **Case 2 (Strict Akrasia):** Agent is time-consistent (exponential). At t2, she *prefers* LL but takes SS anyway.
          *   **Style:** Ordinary life, one paragraph each, no exotic devices (no forgetting, no new info, no drugs).
          *   **Output:** The two cases + The Payoff (analysis of preferences/actions, aptness of akrasia charge, structural difference, counterattacks).
          *   **Format:** Tight enough for a one-page handout.

  2.  **Deconstruct the Philosophical Problem:**
      *   *The Hyperbolic View:* Akrasia is just preference reversal over time due to changing discount rates. At the moment of action, the agent *wants* the SS option more. There is no conflict at t2.
      *   *The Strict Akrasia View:* Akrasia involves acting against one's *current* best judgment. At t2, the agent judges LL is better but chooses SS due to a failure of will/executive control, not a change in valuation.
      *   *The Challenge:* Behaviorally, both look like "Planned LL, Chose SS." We need to distinguish the *internal state* at t2 without resorting to "magic" or "brain lesions."

  3.  **Drafting Case 1 (Hyperbolic/Time-Inconsistent):**
      *   *Scenario:* Needs to show the common-delay effect.
      *   *Setup:* Writing a dissertation chapter (LL) vs. Watching TV (SS).
      *   *t1 (Sunday):* Both options are in the future. Writing is better.
      *   *t2 (Monday):* Writing is due now, TV is now. The "now" premium kicks in.
      *   *Key:* She must genuinely *want* the TV more at t2 because the immediacy distorts her valuation.
      *   *Drafting thought:* Make sure she feels good about the choice at t2, or at least feels the pull is stronger. Actually, for the model to hold, she simply prefers SS at t2.
      *   *Refinement:* Let's use the "Gym vs. Couch" or "Saving vs. Spending" trope. Let's go with "Saving for a Boiler (LL) vs. Buying a Nice Jacket (SS)." No, dissertation is more relatable for grad students. Let's stick with "Finish Section (LL) vs. Check Social Media (SS)."
      *   *Crucial Detail:* At t1 (Friday), she plans to write Monday. At t2 (Monday), the immediacy of the distraction outweighs the future benefit of writing. She *prefers* the distraction now.

  4.  **Drafting Case 2 (Strict Akrasia/Time-Consistent):**
      *   *Scenario:* Must be the *same* options and sequence.
      *   *Constraint:* She must be time-consistent. Her discount rate doesn't change.
      *   *t1:* Prefers LL.
      *   *t2:* Still prefers LL (judgment hasn't changed), but chooses SS.
      *   *How?* This is the hard part without "brain lesions." It requires a failure of *execution* despite *judgment*. This is often modeled as a "cost of effort" or "willpower as a muscle" or simply a brute failure of rational agency.
      *   *Philosophical nuance:* To make it plausible without exotic devices, we need to describe the phenomenology of "I know I shouldn't, but I'm doing it."
      *   *Drafting thought:* She sits down to write. She knows writing is better. She feels the pull of social media. She *judges* writing is better *all things considered* (including the pleasure of media), but her hand moves to the phone anyway.
      *   *Refinement:* To ensure time-consistency, we need to show the valuation didn't shift. Maybe she explicitly acknowledges, "This is stupid, I'm losing out," while doing it. In Case 1, she thinks, "I deserve this break now." In Case 2, she thinks, "I shouldn't do this, but I can't stop."
      *   *Wait, constraint check:* "No exotic devices." Is "willpower failure" exotic? In philosophy of action, no. It's the core phenomenon. I need to describe it such that it doesn't look like a preference change.
      *   *Key Distinction:* In Case 1, the *value* of the SS option spikes at t2. In Case 2, the *value* remains stable, but the *action* disconnects from the value.

  5.  **Refining the Matched Pair:**
      *   *Agent:* Elena, a PhD candidate.
      *   *Options:* Write 2 pages (LL: degree progress) vs. Scroll feeds (SS: immediate dopamine).
      *   *Case 1 (Hyperbolic):* On Friday, she plans to write Monday. On Monday, the "now-ness" of scrolling makes it subjectively more valuable than the abstract future degree. She chooses scrolling *happily* or *rationally relative to her current weights*.
      *   *Case 2 (Akrasia):* On Friday, she plans to write Monday. On Monday, she sits down. She calculates the costs/benefits. She concludes writing is still better *right now*. Yet, she finds herself scrolling. She feels regret *during* the action.

  6.  **Developing the Payoff/Analysis:**
      *   *Preferences/Actions:*
          *   Case 1: t1 (LL > SS), t2 (SS > LL). Action matches t2 preference.
          *   Case 2: t1 (LL > SS), t2 (LL > SS). Action contradicts t2 preference.
      *   *Akrasia Charge:*
          *   Case 1: Not apt (synchronic). It's diachronic inconsistency, not weakness.
          *   Case 2: Apt. It's synchronic inconsistency.
      *   *Structural Feature:* The stability of the all-things-considered judgment at t2.
      *   *Counterattacks:*
          *   Hyperbolic defender on Case 2: "You're misdescribing the phenomenology. If she chose it, she must have preferred it. 'Regret' is just a lingering preference for the foregone option, but the choice reveals the true preference." (Revealed Preference Theory).
          *   Strict Akrasia defender on Case 1: "That's not weakness, that's just changing your mind. Weakness requires knowing better *at the time*."

  7.  **Review against Constraints:**
      *   *One paragraph each?* Need to be concise.
      *   *No forgetting/new info?* Ensure she doesn't learn writing is harder than expected.
      *   *No drugs/lesions?* Ensure Case 2 sounds like normal human struggle, not pathology.
      *   *Handout format?* Clear headings, bullet points for the analysis.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Critique:* Is Case 2 too magical? How can she prefer LL but choose SS without a preference change?
      *   *Fix:* Frame it as a failure of *intention execution* rather than preference. Davidson's "all-in judgment" vs. "prima facie judgment." Or simply describe the phenomenology of "I am doing what I judge worst." The prompt asks to "generate them from the set-up," so I must describe the mental state carefully. In Case 2, emphasize that she *affirms* the ranking at t2 even as she acts.
      *   *Critique:* Make sure the "common-delay" signature is clear in Case 1.
      *   *Fix:* Explicitly mention that if the reward were delayed, she'd wait. It's the *immediacy* that flips the switch.

  9.  **Finalizing the Text:** (Drafting the response based on the above steps). *Ensure the tone is appropriate for a grad seminar handout.*

      *(Self-Correction on Case 2)*: I need to be careful not to make Case 2 sound like compulsion (which might excuse agency). It needs to be free but irrational action. The description should focus on the *judgment* remaining stable while the *will* fails.

      *(Self-Correction on Payoff)*: Make sure to explicitly answer the "what happens if you remove the structural feature" question. If you remove the judgment stability in Case 2, it becomes Case 1. If you remove the preference reversal in Case 1, it becomes Case 2.

  10. **Final Check:** Does this fit on one handout? Yes, if concise.

  *(Drafting content...)*
  *Case 1:* Elena, Friday vs Monday. The "Now" effect.
  *Case 2:* Elena, Friday vs Monday. The "Judgment-Action Gap."
  *Analysis:* Table or bullets.
  *Counterattacks:* Revealed preference vs. Normative authority.

  Let's write it.cw
answer: |-
  # Handout: Preference Reversal vs. Strict Akrasia
  **Seminar:** Practical Rationality | **Topic:** Time, Discounting, and Weakness of Will

  ### The Matched Pair

  **Case 1: The Present-Bias Reversal (Hyperbolic)**
  Elena is a PhD candidate. On Friday (t1), she plans her weekend. She compares *Writing 2 Pages* (Larger-Later: degree progress, due Monday) against *Scrolling Social Media* (Smaller-Sooner: immediate amusement, available now). Knowing she works better with rest, she ranks Writing > Scrolling and commits to writing Monday morning. Monday arrives (t2). The writing is now immediate effort; the scrolling is now immediate reward. The immediacy of the scrolling triggers a present-bias spike in its subjective value that was absent on Friday. At t2, Elena genuinely prefers Scrolling > Writing; the "now" premium outweighs the career benefit. She scrolls without regret, thinking, "I'll write tomorrow," and feels satisfied with her choice in the moment.

  **Case 2: The Judgment-Action Gap (Strict Akrasia)**
  Elena is a PhD candidate. On Friday (t1), she plans her weekend. She compares *Writing 2 Pages* (Larger-Later) against *Scrolling Social Media* (Smaller-Sooner). She ranks Writing > Scrolling and commits to writing Monday morning. Monday arrives (t2). She sits at her desk and re-evaluates. She acknowledges the effort, but judges that the career benefit *right now* still outweighs the amusement of scrolling. Her discount rate has not shifted; she affirmatively ranks Writing > Scrolling at t2, all-things-considered. Nevertheless, finding the effort aversive, she picks up her phone and scrolls. As she scrolls, she thinks, "I shouldn't be doing this; writing is better," feeling active regret and a sense of agency failure even as she continues.

  ***

  ### The Payoff

  | Feature | Case 1 (Hyperbolic) | Case 2 (Strict Akrasia) |
  | :--- | :--- | :--- |
  | **t1 Preference** | Writing > Scrolling | Writing > Scrolling |
  | **t2 Preference** | **Scrolling > Writing** (Reversal) | **Writing > Scrolling** (Stable) |
  | **t2 Action** | Scrolling | Scrolling |
  | **Relation** | Action matches t2 preference. | Action contradicts t2 preference. |
  | **Akrasia Charge** | **Inapt.** This is diachronic inconsistency (changing one's mind), not synchronic weakness. The t2 self is rational relative to its own weights. | **Apt.** This is synchronic inconsistency. The agent acts against her contemporaneous best judgment. |

  **The Structural Difference:**
  The stability of the **all-things-considered judgment at t2**.
  *   In Case 1, the *valuation* changes due to the removal of the common delay (the "now" effect).
  *   In Case 2, the *execution* fails despite stable valuation.
  *   **If you remove this feature:** If you stipulate Elena's t2 judgment flips in Case 2, it collapses into Case 1 (mere preference change). If you stipulate Elena's t2 judgment remains stable in Case 1, the hyperbolic model cannot explain the action without positing irrationality.

  **Counterattacks & Discussion:**

  *   **The Hyperbolic Defense (Against Case 2):** "Revealed Preference." If Elena chooses Scrolling at t2, she *must* prefer it, by definition. Her verbal report ('I shouldn't do this') is just noise or a lingering preference for the *past* plan. Case 2 is an illusion; what she calls 'weakness' is just an unacknowledged shift in weights (Case 1).
  *   **The Strict Akrasia Defense (Against Case 1):** "Normative Authority." Case 1 isn't weakness of will; it's just a different person (the t2 self) overriding the t1 self. True weakness requires the t2 self to be *bound* by the t1 judgment but failing to follow it. If the preference actually flips, the agent is merely time-inconsistent, not weak. Calling Case 1 'akrasia' conflates changing your mind with failing your principles.

  **Discussion Question:** *If the Hyperbolic Defense is right and "preference" is defined by choice, is the concept of strict akrasia coherent? If the Strict Defense is right, can standard economic models (which assume action follows preference) ever capture weakness of will?*
