      *   *Section 3: The Moral Contagion (Violence vs. Market).* Discuss how money launders morality in this policy.
      *   *Section 4: The Paternalism of Care (Custodianship).* Address the "on behalf of" clause. This is the crux of the "we know best" argument.
      *   *Section 5: Synthesizing the Colleagues.* Who is right? All of them, applied to different buckets.
      *   *Section 6: The Rival View.* What changes if we shift to "Relationship"?
