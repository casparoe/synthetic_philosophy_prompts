  10. (Final thought): The user's description of the "custodianship rating" is essentially the "Universal Museum" argument in miniature. I should name that.

  11. *Wait, one nuance:* The user mentions "plaster life-casts" under human remains. That's interesting. It implies a view of representation as potentially violating bodily integrity. I should touch on that briefly as it blurs the object/remains line.

