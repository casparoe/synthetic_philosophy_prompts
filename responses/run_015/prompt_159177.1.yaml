answer: |-
  This is an extraordinarily sharp observation. You have correctly identified that your working group has not produced a single coherent ethical framework, but rather a patchwork of three distinct moral regimes that apply to different categories of things. This is not unique to your museum; it is the standard operating system for most mid-to-large UK institutions post-2000, often unconsciously inherited from the DCMS guidelines and the British Museum's evolving stance.

  The "shape" you are seeing is the result of trying to satisfy three incompatible masters: human rights law (remains), international diplomacy (state-to-state object claims), and domestic property law (auction purchases).

  Here is an analysis of what your policy actually presupposes, where its internal contradictions lie, and what would be required to shift to the rival view you mentioned.

  ### 1. The Ontological Split: Persons vs. Property
  **The Policy:** Human remains (including life-casts) are returned unconditionally. Objects are returned conditionally or not at all.
  **The Presupposition:** This rests on a strict ontological divide between *personhood* and *property*.
  *   **Remains:** The policy presupposes that ancestral remains retain a form of legal or moral personhood. They are subjects, not objects. Therefore, the claim is not about *title* (ownership) but about *bodily integrity* and *dignity*. The museum accepts it has no right to hold a person, regardless of how it acquired them.
  *   **Objects:** Bronzes, masks, and tools are presupposed to be property. The claim against them is a claim of *title*.
  *   **The Tension:** You noted life-casts are grouped with remains. This is the crack in the dam. A plaster cast is technically an object, but by grouping it with remains, you admit that *representation* can violate *personhood*. If a cast violates personhood, why does a sacred mask (which may embody a spirit in the source community) not violate a similar boundary? The policy requires you to believe that "sacredness" stops at the skin, which is a secular, Western materialist view.

  ### 2. The Political Settlement: The State as Sole Heir
  **The Policy:** Looted objects go to national governments/museums, not communities or lineages.
  **The Presupposition:** This presupposes that the **Nation-State** is the only legitimate successor to history.
  *   **Why:** It is administratively convenient and diplomatically safe. Dealing with the Nigerian National Commission for Museums and Monuments is easier than dealing with the Oba of Benin's court, especially if the UK government doesn't officially recognise the latter's political authority.
  *   **The Commitment:** This strictly requires a commitment to **Westphalian sovereignty** over **cultural continuity**. It assumes that culture is a national asset (like oil or gold) rather than a living practice.
  *   **The Tension:** This pulls directly against the "Remains" rule. Often, remains are returned to specific communities or tribes because they are genealogical, not national. By treating objects as national but remains as genealogical, you are fracturing the heritage of the requesting party. You are telling them: "Your dead belong to your family, but your history belongs to your government."

  ### 3. The Moral Contagion: Violence vs. The Market
  **The Policy:** Punitive expedition loot is returnable; auction purchases from colonial estates are not.
  **The Presupposition:** This presupposes that **money launders morality**.
  *   **The Location of the Wrong:** The policy locates the ethical wrong exclusively in the *act of violent taking*. It posits that a subsequent market transaction creates a new, clean title.
  *   **Good Faith:** It relies on a concept of "good faith purchase" that ignores the power dynamics of the 1920s–50s art market. It assumes a "willing seller" implies a legitimate owner. In a colonial context, a colonial officer selling loot at auction is a "willing seller," but their title was likely vitiated by the initial violence.
  *   **Required vs. Comfortable:** The policy is *comfortable* with the idea that the market is neutral, but it does not *strictly require* it. You could logically argue that the taint of the initial violence follows the object regardless of intermediate sales (the principle of *nemo dat quod non habet*—no one gives what they do not have). Your policy chooses to ignore this legal principle in favour of market stability.

  ### 4. The Paternalism of Care: The "Custodianship Rating"
  **The Policy:** If we think you can't care for it, we keep it "on your behalf."
  **The Presupposition:** This is the most revealing clause. It presupposes that **preservation is the highest good**, superior to **access** or **sovereignty**.
  *   **Custody vs. Title:** This clause admits that the museum claims *title* (we decide where it stays) while offering *custody* (physical possession) as a privilege we grant, not a right they claim.
  *   **The Contradiction:** As you noted, holding something "on behalf of" someone who has asked for it back is a logical nullity. It is possession without consent. It presupposes that the source community's definition of "care" (which might involve ritual use, wearing, or burial) is inferior to the museum's definition of "care" (climate control, static display).
  *   **The "Universal Museum" Ghost:** This is the quiet commitment that culture belongs to humanity, and the UK museum is the default guardian of humanity's heritage. It is comfortable with the idea that they are "better" at looking after objects, but it *requires* the belief that physical preservation is more important than cultural function.

  ### Summary of Commitments
  To answer your specific question on what is required vs. what is comfortable:

  1.  **Strictly Required:** The policy *requires* the belief that the **State** is the only valid interlocutor for objects (to avoid endless fragmentation of claims). It *requires* the belief that **physical preservation** trumps **cultural usage** (to justify the custodianship rating).
  2.  **Merely Comfortable:** The policy is *comfortable* with the idea that auction purchases sanitize provenance (but could change this without collapsing). It is *comfortable* with the distinction between remains and sacred objects (but this is culturally arbitrary).

  ### The Rival View: Relational Ethics
  If you wanted to take seriously the view that "what's at issue is the living relationship between a community and its things," here is how the policy would need to shift:

  **What Must Change:**
  1.  **The Interlocutor Rule:** You must drop the "National Government Only" rule. If the Oba, the Chief, or the Priesthood claims an object was never meant to be state property, the policy must allow for direct engagement. This acknowledges that authority is cultural, not just political.
  2.  **The Custodianship Rating:** This must be inverted. The requesting community defines "proper care." If they intend to use a mask in a dance that might wear it down, or bury an object, that is their right as owners. The museum cannot claim to hold it "for them" if their definition of care differs from yours.
  3.  **The Market Shield:** The distinction between "looted" and "bought from a looter's estate" must be scrutinized. A relational view asks: *Was the seller in a position to legitimately sell this?* If the object was never meant to be sold (sacred/inalienable), the market transaction is void regardless of "good faith."
  4.  **The Remains/Object Divide:** You would need to consider if certain objects function as "ancestors" or "persons" within the source culture. If a community says, "This statue is our grandfather," the relational ethic demands you treat it closer to the human remains policy than the bronze policy.

  **What Could Stay:**
  1.  **Honest Labeling & Co-curation:** These are compatible with relational ethics. In fact, they are better if the object stays (temporarily or permanently). Transparency about the violence of acquisition is part of repairing the relationship.
  2.  **3D Scans/Digital Access:** These remain useful tools, provided they are not offered as *substitutes* for return. In a relational model, digital copies allow the museum to keep telling the story *without* holding the hostage.
  3.  **Partnership/Loan Deals:** These are fine, *if* they are initiated by the source community as a choice, not by the museum as a condition of return. A long-term loan is a relationship; a conditional return is a leash.

  ### The Hard Truth for the Working Group
  The shape of your policy is not an accident; it is a defence mechanism. It is designed to minimise risk (legal, diplomatic, reputational) while maximising retention.

  The "Custodianship Rating" is the keystone. If you remove that, the "State Only" rule becomes harder to justify (because you have to assess the specific community's capacity, not just the national museum's). If you remove the "State Only" rule, the "Market Shield" becomes harder to justify (because you are talking to people who can tell you *why* the market transaction was invalid).

  To move toward the rival view, you don't need to return everything tomorrow. You need to change the **burden of proof**. Currently, the claimant must prove they can care for it and that they are the right owners. A relational policy would require the *museum* to prove why it should continue to hold the object against the wishes of the community of origin.

  You are currently drafting a policy for **Asset Management**. The rival view requires drafting a policy for **Restorative Justice**. They are fundamentally different documents.
