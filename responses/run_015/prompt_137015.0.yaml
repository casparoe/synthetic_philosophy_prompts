prompt: |-
  I got into an argument about tort law and now I can't work out how this whole package of doctrines is supposed to hang together. In most common-law jurisdictions (England, most US states, Australia), if a doctor negligently fails to warn parents about a serious genetic risk, the parents can sue for wrongful birth and recover the extra costs of raising a disabled child. The child, the one actually living with the condition, generally can't sue for wrongful life; California, New Jersey, Maine and Washington let the child sue but only for provable economic losses and not for pain and suffering, and Germany's constitutional court struck the action down as incompatible with human dignity while leaving the parents' claim for the child's upkeep intact. Meanwhile the same courts cheerfully award damages in wrongful death for the life the dead person lost.

  So what does this presuppose? It smells like the procreation asymmetry — a reason not to bring a suffering person into existence, no matching reason to bring a happy one in — but I can't tell whether the package really needs that, or whether it only needs some weaker zero-line claim: that a life above a certain threshold simply cannot be an injury to the person living it, and that there is nobody there for nonexistence to be compared with anyway. And the wrongful-death half seems to presuppose that life is a good, which sits oddly with refusing to treat a terrible life as a harm.

  The bit I want pressed on is a reform a friend proposed: call it wrongful life lite. The child may recover, but only the shortfall between their condition and a minimally decent life, capped at zero — nothing for the gap between their life and a healthy one, and nothing at all for a life that is merely drab. Does that actually encode the asymmetry in a damages rule, or does it smuggle in something the asymmetry doesn't supply, like a determinate worth-living threshold or a non-comparative account of harm? Is the asymmetry even the right thing to reach for, given that it is about reasons to create while tort is about compensating someone who now exists? And could someone who rejects the asymmetry outright — a total utilitarian, say — still defend barring the child's claim on deterrence or administrability grounds, so that the practice is underdetermined by the philosophy? Reconstruct the implicit view, tell me what strictly has to be presupposed versus what merely fits well, and say what a court that took a symmetric view would have to start doing differently.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Problem:** The user is struggling to reconcile the doctrinal package in tort law regarding wrongful birth, wrongful life, and wrongful death.
      *   **Key Observations:**
          *   Parents can sue for wrongful birth (negligent failure to warn about genetic risk -> recovery of extra costs of raising disabled child).
          *   Children generally *cannot* sue for wrongful life (being born disabled vs. not being born). Some US states allow limited recovery (economic only, no pain/suffering). Germany bans it on dignity grounds.
          *   Courts *do* award damages for wrongful death (loss of life).
          *   This looks like the "procreation asymmetry" (reason not to create suffering, no reason to create happiness), but the user is unsure if that's the necessary philosophical foundation.
          *   There's a tension: Wrongful death treats life as a good; wrongful life refusal treats a "bad" life as not an injury compared to non-existence.
      *   **Specific Proposal to Analyze:** "Wrongful Life Lite" (WLL): Child recovers shortfall between condition and a "minimally decent life," capped at zero. No recovery for gap between disabled and healthy, nothing for merely drab lives.
      *   **Questions to Answer:**
          1.  Does WLL encode the asymmetry or smuggle in a threshold/non-comparative harm?
          2.  Is the asymmetry the right tool (creation reasons vs. compensation for existing persons)?
          3.  Can a total utilitarian (rejecting asymmetry) still defend barring the claim on instrumental grounds (deterrence/administrability)?
          4.  Reconstruct the implicit view: What *must* be presupposed vs. what just fits well?
          5.  What would a court taking a *symmetric* view have to do differently?

  2.  **Initial Analysis & Philosophical Mapping:**

      *   **The Doctrinal Tension:**
          *   *Wrongful Birth:* Harm to parents (financial/emotional burden of unplanned disabled child). Presupposes: Having a disabled child is a harm *to the parents* compared to having no child (or a healthy one, depending on jurisdiction).
          *   *Wrongful Life:* Harm to child. Comparison: Disabled life vs. Non-existence. Problem: Non-existence isn't a state of a person. Comparative harm is metaphysically tricky.
          *   *Wrongful Death:* Harm to estate/family (or the decedent's lost enjoyment). Comparison: Life vs. Death (premature). Presupposes: Life is a valuable asset.
      *   **The Asymmetry (Parfit):** We have reasons to avoid creating miserable people, but no reasons to create happy people.
          *   *Fit:* Explains why parents can sue (avoiding the burden/misery) but child can't (non-existence isn't worse than a life worth living, even if disabled).
          *   *Mismatch:* Tort is about *corrective justice* for existing victims, not *procreative ethics*. The child *exists*.
      *   **The "Zero-Line" Claim:** A life above a threshold cannot be an injury. This is the "Non-Identity Problem" solution often used in law. If life is worth living, you weren't harmed by being born.
      *   **Wrongful Death:** Treats life as a positive asset. If life is an asset, losing it is a loss. If life is a burden (wrongful life), keeping it is a loss? The tension is: Is life *inherently* good (presumption), or contextually good?

  3.  **Analyzing "Wrongful Life Lite" (WLL):**

      *   *Proposal:* Recover shortfall between condition and "minimally decent life." Capped at zero.
      *   *Implication:* This admits that a life *below* the decent threshold is a harm *to the child*.
      *   *Asymmetry Check:* The asymmetry says "don't create suffering." WLL says "if you created suffering (below threshold), pay." This aligns. But WLL implies a *comparative* standard (Condition vs. Threshold). The Asymmetry is usually about reasons for action, not necessarily a metric for damages.
      *   *Smuggling:* Yes, it smuggles in a "determinate worth-living threshold." The asymmetry doesn't specify *where* the line is, just that there is a negative reason for suffering. WLL requires courts to define "minimally decent."
      *   *Non-Comparative Harm:* It leans towards non-comparative harm (you are in a bad state) rather than comparative (you are worse off than if you weren't born).

  4.  **Addressing the Total Utilitarian:**

      *   *View:* Maximize total utility. Asymmetry is false. Creating happy people is good; creating suffering people is bad.
      *   *Defense of Bar:* Even if creating a suffering child is a net negative, can we sue?
      *   *Instrumental Grounds:* Yes. Deterrence (doctors should warn), Administrability (can't calculate damages against non-existence), Floodgates.
      *   *Conclusion:* The doctrine is underdetermined by philosophy. You can reach the same legal outcome (no wrongful life) from different ethical starting points.

  5.  **Reconstructing the Implicit Judicial View:**

      *   *What is strictly presupposed?*
          1.  **Comparability:** You can't compare existence with non-existence for legal damages (metaphysical/epistemic barrier).
          2.  **Presumption of Worth:** Life is presumed to be a benefit, not a harm (rebuttable only in extreme cases, if at all).
          3.  **Separate Interests:** Parents' interests (financial/autonomy) are distinct from Child's interests (existence/welfare).
      *   *What fits well but isn't strict?*
          1.  The Procreation Asymmetry (it explains the intuition, but the law relies more on the "non-existence comparison problem").
          2.  Human Dignity (Germany uses this, US courts usually use "impossibility of calculation").
      *   *Symmetric View Implications:* If life is symmetric (loss of life = damage, gain of life = benefit), then:
          *   Wrongful Death: Damages for lost years.
          *   Wrongful Life: Damages for "gained" miserable years.
          *   *Problem:* To be symmetric, you'd have to allow recovery for the *difference* between disabled life and non-existence. But if you allow that, you imply non-existence is the baseline. If non-existence is the baseline, Wrongful Death becomes tricky (who is the plaintiff?).
          *   *Actually:* A truly symmetric view would likely allow Full Wrongful Life (pain + suffering) because if death is a compensable loss, miserable life is a compensable injury.

  6.  **Drafting the Response:**

      *   *Structure:*
          1.  **Diagnose the Doctrinal Tension:** Acknowledge the user's sharp observation about the tension between Wrongful Death (life = good) and Wrongful Life (life = not compensable harm).
          2.  **The "Zero-Line" vs. Asymmetry:** Distinguish between the ethical asymmetry (Parfit) and the legal "life is a benefit" presumption.
          3.  **Analyze "Wrongful Life Lite":** Does it encode asymmetry? No, it encodes a *threshold deontology*. It requires a non-comparative account of harm (being in a bad state) rather than a comparative one (worse than nothing).
          4.  **The Utilitarian Objection:** Show how a total utilitarian can support the bar on instrumental grounds (administrability, causation).
          5.  **Reconstructing the Implicit View:** List the necessary metaphysical and legal commitments.
          6.  **The Symmetric Court:** Describe what a court that treated life/death symmetrically would look like (and why it breaks).

      *   *Refining the Argument:*
          *   *Crucial Point:* The law doesn't actually rely on the *Asymmetry* (reasons to create). It relies on the *Non-Identity Problem* (causation/comparison). The child cannot say "I am worse off" because the alternative is "I do not exist."
          *   *WLL Analysis:* WLL tries to bypass the comparison with non-existence by comparing with a "decent life." But since the alternative to the disabled child is *no child*, the causation link is still the doctor's negligence caused *this* child to exist. WLL effectively says "If you cause a child to exist below threshold, pay." This is strict liability for procreation outcomes, not standard negligence.
          *   *Wrongful Death:* This is about *premature* termination of an existing asset (life). Wrongful Life is about *creation* of a burden. The asymmetry in law is between *taking away* a good vs. *conferring* a bad (which is metaphysically contested).

      *   *Self-Correction on "Symmetric View":* If a court took a symmetric view, they would have to treat Non-Existence as a baseline state. If Death (return to non-existence) is compensable, then Birth (exit from non-existence) into suffering should be compensable. But to do this, they must solve the "who is the plaintiff" problem. The symmetric court would likely have to allow full wrongful life claims (pain and suffering) to match wrongful death (loss of enjoyment of life).

  7.  **Final Polish:** Ensure tone is analytical, rigorous, and directly answers the specific prompts (WLL encoding, Utilitarian defense, Implicit View, Symmetric Court). (Self-correction: Make sure to distinguish between the *ethical* asymmetry and the *legal* doctrine of damages).

      *   *Key Insight to highlight:* The law treats "Life" as a protected interest *once it exists*, but refuses to treat "Non-Existence" as a baseline for comparison *before it exists*. This isn't the Parfit asymmetry; it's an ontological boundary rule.

  8.  (Final check of the prompt requirements):
      *   Reconstruct implicit view.
      *   Strict presuppositions vs. good fits.
      *   Analyze WLL (asymmetry vs. threshold).
      *   Utilitarian defense.
      *   Symmetric court implications.

      *Let's write.*
answer: |-
  This is a remarkably sharp dissection of a doctrinal incoherence that most legal systems paper over with "public policy." You have identified the fault line: the law treats life as a compensable asset when taken away (wrongful death) but refuses to treat it as a compensable injury when bestowed (wrongful life), even when the bestowed life is net negative.

  Here is a reconstruction of the implicit view, an analysis of your friend's "Wrongful Life Lite" (WLL) proposal, and an assessment of what a symmetric court would look like.

  ### 1. The Implicit View: Ontological Boundary, Not Ethical Asymmetry

  You ask whether the doctrinal package presupposes the **Procreation Asymmetry** (Parfit's view: we have reasons not to create suffering people, but no reasons to create happy people).

  **Verdict:** The asymmetry *fits* the outcome, but it is not what the law *presupposes*. The law rests on a weaker, metaphysical claim about **comparability**, not an ethical claim about **reasons for action**.

  **What is Strictly Presupposed:**
  1.  **The Non-Existence Baseline Problem:** Tort law requires a comparison between the plaintiff's actual state and the state they would have been in "but for" the negligence. In wrongful life, the "but for" state is non-existence. The law presupposes that non-existence is not a state of being that can be valued for damages purposes. You cannot compare "being in pain" with "not being."
  2.  **The Presumption of Benefit:** Once a person exists, the law presumes life is a net benefit. This is a rebuttable presumption in ethics, but in law, it is treated as a **rule of standing**. To allow a child to claim they were harmed by being born is to allow them to claim they would be better off dead. Most courts view this as incompatible with the legal sanctity of life.
  3.  **Distinct Interests:** The parents' interest is in *autonomy and financial integrity* (wrongful birth). The child's interest is in *welfare*. The law allows compensation for the parents' financial burden because that is a comparative harm (money spent vs. money kept). It denies the child's claim because their harm is existential.

  **What Merely Fits Well (But Isn't Required):**
  *   **The Procreation Asymmetry:** This explains *why* we feel the parents did something wrong by failing to prevent the birth, but it doesn't solve the *damages* problem for the child. You could accept the asymmetry and still argue that if a child is born into suffering, the doctor owes *them* restitution. The law blocks this not because of the asymmetry, but because of the **impossibility of calculation**.
  *   **Human Dignity (German Model):** This is a specific philosophical overlay. The US/English common law blocks wrongful life mostly on **causation and damages** grounds (can't calculate), whereas Germany blocks it on **rights** grounds (dignity). The outcome is the same, the presupposition differs.

  ### 2. Analyzing "Wrongful Life Lite" (WLL)

  Your friend's proposal: *Child recovers shortfall between condition and a minimally decent life, capped at zero.*

  **Does this encode the asymmetry?**
  No. The asymmetry is about the *reasons to create*. WLL is about the *metric of harm for the created*.
  *   **The Asymmetry** says: "Do not create suffering."
  *   **WLL** says: "If you create suffering below threshold $T$, pay the difference between actual state and $T$."

  **Does it smuggle in a threshold?**
  Yes, necessarily. The standard wrongful life bar relies on a binary: Life is either worth living (no claim) or not (maybe a claim, but usually barred). WLL introduces a **gradated threshold of harm**.
  *   **Smuggled Premise 1: Non-Comparative Harm.** WLL abandons the comparative account (Life vs. Non-Existence) and adopts a non-comparative account (Life vs. Decent Standard). This solves the metaphysical problem of comparing existence to nothing, but it changes the nature of tort. Tort is usually about making the victim whole relative to their prior/baseline state. WLL makes the doctor a guarantor of a "minimally decent life."
  *   **Smuggled Premise 2: The Zero-Cap.** Capping damages at zero for "drab" lives presupposes that a life above the threshold is a *benefit* that offsets the negligence. This reinstates the "Presumption of Benefit" but makes it explicit.

  **The Fatal Flaw in WLL:**
  WLL tries to avoid the "Non-Existence" comparison by comparing the child to a "Minimally Decent Child." But in wrongful life, the alternative to the *disabled child* is *no child*.
  If the doctor had warned the parents, the *disabled child* would not exist. A *different, healthy child* might exist, or *no child* might exist.
  *   If WLL compares the disabled child to a *healthy version of themselves*, it commits the **Non-Identity Fallacy**. That healthy person is not the plaintiff.
  *   If WLL compares the disabled child to *non-existence*, it runs back into the metaphysical wall the current doctrine tries to avoid.
  *   If WLL compares the disabled child to an *abstract standard of decency*, it turns tort law into a **social welfare scheme**. The doctor isn't compensating for a loss caused; they are subsidizing a life below a social minimum.

  ### 3. The Total Utilitarian Defense

  Can a Total Utilitarian (who rejects the asymmetry and believes creating happy people is good and creating suffering people is bad) defend barring the child's claim?

  **Yes, on Instrumental Grounds.**
  A Total Utilitarian cares about net utility. They might argue:
  1.  **Administrability Costs:** The cost of litigating "value of non-existence" exceeds the utility gained by accurate compensation.
  2.  **Deterrence Mismatch:** Allowing wrongful life suits might deter doctors from practicing high-risk obstetrics or genetics, leading to *more* suffering overall (fewer healthy births, less genetic counseling).
  3.  **The "Existence" Incentive:** If children can sue for being born, it creates a perverse incentive structure where existence itself is litigable. This could undermine the social stability required for utility maximization.

  **Conclusion:** The doctrine is **underdetermined** by philosophy. You can reach the "No Wrongful Life" conclusion from Deontology (Dignity), Parfitian Asymmetry (No duty to create), or Total Utilitarianism (Instrumental barriers). The fact that different ethical frameworks converge on the same legal rule suggests the rule is driven by **institutional competence** (courts can't value non-existence) rather than moral truth.

  ### 4. What Would a Symmetric Court Look Like?

  If a court took a truly **Symmetric View** (treating the loss of life and the gain of a miserable life as mirror images), it would have to dismantle the current package.

  **Current Asymmetry:**
  *   **Wrongful Death:** Baseline = Life. Injury = Loss of Life. Damages = Value of lost years.
  *   **Wrongful Life:** Baseline = Non-Existence (legally inaccessible). Injury = Gain of Life (legally presumed benefit). Damages = 0.

  **Symmetric Court Requirements:**
  1.  **Reify Non-Existence:** The court must treat non-existence as a valid baseline state for comparison.
  2.  **Allow Full Wrongful Life:** If death is a compensable loss of "enjoyment of life," then a miserable life must be a compensable loss of "non-suffering." The court would have to allow recovery for **pain and suffering**, not just economic costs. To deny P&S while awarding it in wrongful death is the core inconsistency you spotted.
  3.  **Invert Wrongful Birth:** If the child has a claim for being born suffering, the parents' claim for "costs of raising" becomes redundant or problematic. If the child's life is a legal injury, why are the parents recovering for the "cost" of the injury? In a symmetric system, the parents might recover for *their* suffering, but the child's claim would subsume the economic loss (the child's upkeep is the cost of the injury).
  4.  **The "Wrongful Conception" Problem:** A symmetric view logically extends to "wrongful conception" of healthy children. If a miserable life is an injury compared to non-existence, is a happy life a *benefit* compared to non-existence?
      *   If **Yes**: Parents who are negligently sterilized and conceive a healthy child should sue for "loss of non-existence" (unlikely).
      *   If **No**: Then the system remains asymmetric (Bad life = injury, Good life = not a benefit). This returns us to the Parfit Asymmetry.

  **The Only Coherent Symmetric Position:**
  To be truly symmetric, the court must adopt a **Comparative Utilitarianism of Existence**.
  *   **Wrongful Death:** Damages = (Utility of Life) - (Utility of Death/Non-existence).
  *   **Wrongful Life:** Damages = (Utility of Non-existence) - (Utility of Life).
  *   **Result:** If Life < Non-existence (negative utility), the child recovers the deficit. If Life > Non-existence, the child recovers nothing.
  *   **Implication:** This requires courts to explicitly rule that **some lives are not worth living.** Current courts refuse to make this finding (except perhaps in extreme vegetative states). A symmetric court would have to make this finding routinely in genetic negligence cases.

  ### Summary Reconstruction

  The current doctrinal package does not require the Procreation Asymmetry. It requires only:
  1.  **Epistemic Humility:** Courts claim they cannot measure the value of non-existence.
  2.  **Sanctity of Life:** A legal presumption that existence is preferable to non-existence, regardless of quality of life.
  3.  **Corrective Justice Boundaries:** Tort fixes disruptions to existing interests; it does not adjudicate the value of bringing new interests into being.

  **Your friend's WLL** attempts to bridge the gap by setting a "decent life" threshold. It fails because it smuggles in a **non-comparative harm principle** (you are owed a decent life) that tort law does not recognize (you are only owed compensation for losses caused). It turns the doctor into an insurer of life quality, not a compensator of negligence.

  **To fix the inconsistency you identified:**
  You don't need the Asymmetry. You need to admit that **Wrongful Death** and **Wrongful Life** are categorically different.
  *   **Wrongful Death** protects an **existing asset** (the life you have).
  *   **Wrongful Life** asks to compensate for the **creation of a liability** (the life you were given).
  *   The law protects assets; it is very reluctant to treat existence itself as a liability.

  If you want symmetry, you must allow children to sue for pain and suffering when their life is net negative. If you refuse that (as most courts do), you must admit that the law presumes **Life is a Good**, even when the evidence suggests it is a Burden. That is not a philosophical truth; it is a policy choice to avoid the metaphysical abyss of valuing non-existence.
