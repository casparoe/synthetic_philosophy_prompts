answer: |-
  Here is the spec sheet for promissory obligation. I've stripped out the theoretical posturing to focus on the phenomenological data—the actual cases and distinctions any working theory has to handle.

  ### Part I: The Desiderata List

  An adequate account of promising must explain why a specific utterance changes your moral landscape. It cannot just say "promises are binding"; it has to explain the boundaries of that bindingness. Here are the six non-negotiable requirements, followed by the theoretical prejudices often disguised as requirements.

  #### The Non-Negotiables (The Data)

  **1. The Forgotten Promise Requirement (Fidelity)**
  *   **The Case:** I promise my friend I will help them move on Saturday. Five minutes later, they get amnesia regarding the conversation. They never think about it again; they have zero expectation of my help. On Saturday, I don't show up.
  *   **The Verdict:** I have still wronged them. The obligation persists even without reliance or expectation.
  *   **Why it's required:** If obligation vanished when expectation vanished, promises would be mere predictions. The moral "stickiness" must reside in the act of promising, not just the psychological state of the promisee.
  *   **Who gets it wrong:** **Pure Reliance Theories.** If the obligation is grounded solely in preventing harm to expectations (e.g., early Utilitarian accounts, some tort-based views), this case kills them. There is no expectation to harm, yet the wrong remains.

  **2. The Context Sensitivity Requirement (Felicity)**
  *   **The Case:** We are playing poker. I say, "I promise I won't bluff this hand," while laughing, chips in the middle. Or I say, "I promise I'll marry you" during a rehearsal of a play.
  *   **The Verdict:** I am not bound.
  *   **Why it's required:** Promising is a selective tool. If every utterance of "I promise" created a moral bond, language would break. The theory must account for "felicity conditions"—the social context that signals seriousness.
  *   **Who gets it wrong:** **Literalist Speech-Act Theories.** If you treat promising as a purely linguistic formula (like a code compiler), you fail to capture why context voids the "code."

  **3. The Moral Veto Requirement (Illocutionary Disablement)**
  *   **The Case:** A mobster says, "I promise to pay you $10,000 if you break that guy's legs." I say, "I promise."
  *   **The Verdict:** I am not obligated to break the legs. In fact, I am obligated *not* to.
  *   **Why it's required:** You cannot contract away core morality. A promise cannot create a duty to do something that is independently forbidden.
  *   **Who gets it wrong:** **Strong Voluntarism/Consent Theories.** If the source of obligation is purely my will ("I chose to bind myself"), it's hard to explain why my will is sovereign over good deeds but impotent over evil ones without importing external moral constraints that undermine the "will" as the source.

  **4. The Voluntariness Requirement (Duress)**
  *   **The Case:** A robber holds a gun to my head and says, "Promise me you won't call the police." I say, "I promise."
  *   **The Verdict:** I am not bound. I can call the police immediately after.
  *   **Why it's required:** Promissory obligation is a gift of autonomy. If the gift is forced, it's not a gift. Coercion vitiates the transfer of normative power.
  *   **Who gets it wrong:** **Social Practice Theories (if too rigid).** If the obligation comes solely from participating in a social institution (like Rawls' "Practice Conception"), one might argue I invoked the rule, so I'm bound. But we intuitively feel the gun voids the rule, suggesting the *condition of the will* matters more than the *invocation of the practice*.

  **5. The Normative Force Requirement**
  *   **The Case:** Breaking a promise vs. failing to be generous.
  *   **The Verdict:** Breaking a promise is a distinct wrong (a violation of a right), not just a failure of virtue. The promisee has a *claim* against me.
  *   **Why it's required:** Promises create rights in others. An adequate theory must explain how I generated a right in you that you didn't have before.
  *   **Who gets it wrong:** **Simple Expectation Accounts.** Disappointing someone is rude; breaking a promise is a breach of duty. The theory must distinguish the two.

  **6. The Content Independence Requirement**
  *   **The Case:** I promise to water your plants vs. I promise to buy you coffee.
  *   **The Verdict:** The source of the obligation is the same, regardless of the act's inherent value (provided it's not immoral).
  *   **Why it's required:** If the obligation came from the *act* (watering plants is good), it wouldn't be a *promissory* obligation. It must come from the *promise*.
  *   **Who gets it wrong:** **Consequentialist Accounts.** If the obligation is just "doing good," then promising adds nothing. The theory must show the promise itself is the engine.

  #### The Prejudices (Disguised as Requirements)

  **1. The "Always Binding" Prejudice**
  *   **The Claim:** "A promise is a promise. Unless released, you must keep it no matter the cost."
  *   **Why it's prejudice:** This ignores threshold deontology. If keeping a promise leads to catastrophe (e.g., "I promise to meet you for lunch" vs. "I need to save a drowning child"), we all agree the promise is overridden. Theories that treat promises as absolute trumps are dogmatic, not descriptive.

  **2. The "Single Source" Prejudice**
  *   **The Claim:** "There must be *one* thing (Will, Reliance, or Convention) that explains every case."
  *   **Why it's prejudice:** This is theoretical aesthetics, not moral data. It is entirely possible that promissory obligation is a hybrid phenomenon. Insisting on unity often forces theorists to distort the cases (like the Forgotten Promise) to fit the model.

  **3. The "Metaphysical Queerness" Prejudice**
  *   **The Claim:** "You can't create an 'ought' from an 'is' (mere words), so promises aren't real obligations."
  *   **Why it's prejudice:** This assumes a metaphysical constraint that denies the data. We *do* treat promises as binding. A theory that explains *how* we do it is better than a theory that denies it because it looks metaphysically spooky.

  ---

  ### Part II: The Inconsistency (The Trilemma)

  Here is the hard result. There is a subset of these desiderata that creates a structural tension no theory satisfies perfectly without becoming ad hoc.

  **The Inconsistent Triad:**
  1.  **The Reliance Intuition:** Obligations are justified because they protect the promisee's expectations and prevent harm (supports Context/Duress limits).
  2.  **The Fidelity Intuition:** Obligations exist even when there are no expectations or harm (supports Forgotten Promise).
  3.  **The Unity Requirement:** There is a single, unitary source for all promissory obligations.

  **The Conflict:**
  You cannot hold all three.
  *   If you ground obligation in **Reliance (1)**, you fail the **Forgotten Promise (2)**. (If they don't expect it, you haven't harmed them).
  *   If you ground obligation in **Fidelity/Will (2)**, you struggle to explain why **Reliance/Context (1)** matters so much in the Joke and Duress cases. (If my will binds me, why does a gun or a laugh stop it?)
  *   If you try to keep both, you violate **Unity (3)**. You end up with a "hybrid" theory that says, "Sometimes it's about will, sometimes it's about harm," which looks less like a theory and more like a list of exceptions.

  **The Verdict: Which to Drop?**
  I recommend dropping **The Reliance Intuition as a Constitutive Ground**.
  *   **Why:** Reliance is *evidence* of a promise, and breaking a promise usually *causes* reliance harm, but reliance is not the *source* of the obligation.
  *   **The Cut:** Treat reliance as a reinforcing factor, not the foundation. The foundation must be the **Normative Power of the Will** (modified by context). This preserves the Forgotten Promise (the core discriminant) while allowing Context/Duress to function as *conditions on the exercise of that power*, rather than the source of the power itself.
  *   **Cost:** This makes the theory slightly more "metaphysically queer" (how do I have this power?), but it saves the moral data. It is better to have a spooky explanation of a real phenomenon than a clean explanation of a fake one.

  ---

  ### Part III: Scorecard of Contenders

  Here is how the main camps stack up against the Non-Negotiables.

  **1. The Reliance/Expectation Account (e.g., Fuller, Perdue, Utilitarians)**
  *   **Forgotten Promise:** **FAIL.** Cannot explain obligation without expectation.
  *   **Context/Duress:** **PASS.** Easily explains why jokes/coercion don't create reliable expectations.
  *   **Moral Veto:** **PASS.** Immoral acts usually don't create justified expectations.
  *   **Normative Force:** **WEAK.** Reduces duty to harm-prevention, missing the "right" held by the promisee.
  *   **Summary:** Great for tort law, terrible for moral philosophy. It explains why we *enforce* promises, not why we *make* them.

  **2. The Consent/Agreement Account (e.g., Kantians, Libertarians)**
  *   **Forgotten Promise:** **PASS.** My will bound me, regardless of your memory.
  *   **Context/Duress:** **PASS.** No consent in a joke or under a gun.
  *   **Moral Veto:** **STRUGGLE.** Hard to explain why I can't consent to evil without admitting my will isn't sovereign. (Usually solved by saying "You can't consent to violate rights," which imports external morality).
  *   **Normative Force:** **STRONG.** Clearly explains the transfer of right.
  *   **Summary:** The strongest contender, but requires a robust account of why the will is limited by morality (which risks making the promise secondary to the morality).

  **3. The Speech-Act/Convention Account (e.g., Rawls, Searle, Scanlon)**
  *   **Forgotten Promise:** **PASS.** The convention was invoked; the bond exists in the social fabric.
  *   **Context/Duress:** **PASS.** Felicity conditions handle jokes; coercion voids the "move" in the game.
  *   **Moral Veto:** **PASS.** Conventions don't override morality.
  *   **Normative Force:** **WEAK.** The "Normativity Gap." Why does invoking a social convention create a *moral* duty? (Just because there's a rule in the club doesn't mean breaking it is a *sin*).
  *   **Summary:** Explains the *mechanics* perfectly, but fails to explain the *bindingness*. It explains the rules of the game, not why we ought to play.

  ---

  ### Part IV: Confidence and Revision

  **Where My Reasoning Might Fail**
  My verdict rests heavily on the **Forgotten Promise Requirement**. I have treated the intuition that "you still wronged them" as a fixed point.
  *   **The Weakness:** It is possible that this intuition is a relic of a religious or metaphysical view of obligation that doesn't hold up under secular scrutiny. If the "wrong" in the forgotten promise case is actually negligible or non-existent, then the Reliance Theory wins by default.
  *   **The Risk:** By prioritizing Fidelity over Reliance, I may be privileging the promisor's internal state over the promisee's actual welfare, which is arguably the more important moral metric.

  **What Would Change My Mind**
  I would revise this list if presented with a robust case of **Permissible Forgotten Breach**.
  *   **The Case:** If you can construct a scenario where: (1) I made a sincere promise, (2) The promisee completely forgot it (no reliance), (3) No third parties were affected, (4) I broke it for a trivial reason, and (5) Our moral intuition is clearly that **I did nothing wrong**.
  *   **The Impact:** If that case lands, the Forgotten Promise Requirement collapses. If that requirement collapses, the Reliance Theory becomes the frontrunner, and the "Inconsistent Triad" dissolves. Until then, the Fidelity Intuition is the anchor.

  **Final Note**
  The literature often feels stuck because everyone is defending a *theory* rather than the *data*. The data says promises bind without reliance, but not under guns, and not for evil. Any theory that smooths over one of those bumps to make the math work is selling you a model, not the morality. Stick with the Consent/Will model, but accept that it requires a moral universe where individuals have the normative power to change their duties—a power that is real, but limited by the very morality that grants it.
