answer: |-
  Here is the full specification for an adequate theory of moral aggregation in rescue cases, stripped of the bibliography and focused on the structural constraints.

  ### 1. The Case Load (Must Handle)
  An adequate theory cannot just work for the textbook examples; it must generate verdicts for these three specific configurations without ad-hoc adjustments.

  *   **The Standard Rescue (5 vs. 1):** You can save a group of five strangers or a single stranger. You cannot save both.
      *   *Requirement:* Must explain why (or why not) the number of lives matters.
  *   **The Partiality Case (Kin vs. Strangers):** You can save your own child or five strangers.
      *   *Requirement:* Must accommodate special obligations without collapsing into pure nepotism or pure impartiality.
  *   **The Escape Hatch (Harm vs. Non-Aid):** Saving the five requires you to *actively destroy* the one person's only means of survival (e.g., blowing up their bunker to stop a flood that kills the five).
      *   *Requirement:* Must distinguish between *letting* the one die (by saving the five elsewhere) and *killing* the one (to save the five). A theory that treats these as identical fails the "Constraint on Harm."

  ### 2. The Distinctions (Must Not Collapse)
  A robust theory must respect certain moral boundaries. Collapsing these makes the theory mathematically clean but morally alien.

  *   **Doing vs. Allowing (The Constraint on Harm):**
      *   *Why it's a requirement:* There is a fundamental moral difference between imposing a fate on someone (making them worse off than they would have been otherwise) and failing to improve their fate. If a theory treats active killing as equivalent to failing to rescue, it licenses murder for the greater good.
  *   **Ex Ante vs. Ex Post Claims:**
      *   *Why it's a requirement:* You must distinguish between a person's claim to a *chance* of survival (before the decision) and their claim to the *outcome* (after the decision). Collapsing these ignores the complaint of the individual who was sacrificed for the group.
  *   **Identified vs. Statistical (The Psychological Constraint):**
      *   *Why it's a requirement:* While philosophers often argue this distinction is irrational, an adequate *practical* theory must explain why we feel a stronger obligation to the person in front of us than the statistical risk. If a theory ignores this completely, it becomes impossible to implement in human institutions.

  ### 3. Decision Theory Constraints (Consistency vs. Prejudice)
  Moral theories are choice functions. They must obey basic laws of rationality, but they shouldn't import economic biases as moral truths.

  *   **Transitivity (Must Keep):** If you prefer A to B, and B to C, you must prefer A to C.
      *   *Why:* Without this, you can be "money-pumped" or forced into irrational cycles. A moral theory that contradicts itself is useless.
  *   **Independence of Irrelevant Alternatives (IIA) (Must Keep):** If you prefer A to B, adding option C shouldn't make you prefer B to A.
      *   *Why:* Ensures the moral value of an option doesn't fluctuate based on unrelated distractions.
  *   **Source Neutrality (Utilitarian Prejudice):** The idea that it doesn't matter *who* holds the utility, only the sum.
      *   *Why reject:* This is exactly what Taurek attacks. It assumes persons are mere containers for value rather than distinct agents. An adequate theory must reject this in favor of "Person Separateness."

  ### 4. The Killer Requirement
  **The Constraint on Instrumental Harm.**

  This is the single requirement that knocks out the most popular theory (Straight Utilitarianism).
  *   **Why:** In the "Escape Hatch" case, Straight Utilitarianism demands you destroy the one person's escape hatch to save the five. It treats the one as a means to an end. Any theory that cannot forbid this in at least some contexts fails to respect individual rights. This constraint forces the theory to be non-aggregative in cases of active harm, which breaks the simple "maximize the sum" rule.

  ### 5. The Jointly Unsatisfiable Pair
  Your hunch is correct. The following two requirements are logically incompatible in deterministic rescue cases (like 5 vs. 1):

  1.  **Ex Ante Fairness (Equal Weight):** Every individual must be given an equal *chance* of being saved (e.g., a coin flip gives the 1 and each of the 5 a 50% chance).
  2.  **Ex Post Maximization (Linear Aggregation):** You must always choose the outcome that saves the most lives.

  **The Contradiction:** You cannot give the single person a 50% chance of survival (Fairness) while also ensuring the five are saved 100% of the time (Maximization). In a 5-vs-1 scenario, satisfying one requirement necessarily violates the other. This is the hard limit of rescue ethics.

  ### 6. Theory Scoring
  Here is how the three views score against the spec. (Scale: Pass, Fail, Partial).

  | Criterion | **Taurek (Anti-Aggregation)** | **Straight Utilitarianism (Numbers Count)** | **Flip a Coin (Equal Chance)** |
  | :--- | :--- | :--- | :--- |
  | **Standard Rescue (5 vs 1)** | **Pass.** (Flip between groups). | **Pass.** (Save the 5). | **Pass.** (Same as Taurek). |
  | **Escape Hatch (Harm)** | **Pass.** (Refuses to kill the 1). | **Fail.** (Mandates killing the 1). | **Pass.** (Refuses to kill the 1). |
  | **Distinction: Harm vs. Allow** | **Pass.** (Respects separateness). | **Fail.** (Collapses into sum). | **Pass.** (Respects separateness). |
  | **Decision Theory: Transitivity** | **Fail.** (Can lead to cycles in complex cases). | **Pass.** (Consistently linear). | **Fail.** (Randomization breaks strict ordering). |
  | **Ex Ante Fairness** | **Pass.** (Equal chance per person). | **Fail.** (The 1 gets 0% chance). | **Pass.** (Equal chance per person). |
  | **Ex Post Maximization** | **Fail.** (Often saves fewer lives). | **Pass.** (Always saves most). | **Fail.** (Often saves fewer lives). |
  | **Overall Viability** | **High Moral Intuition / Low Rational Consistency.** | **High Rational Consistency / Low Moral Intuition.** | **Procedurally Fair / Outcome Inefficient.** |

  **Note on Taurek vs. Coin Flip:** These are theoretically identical. Taurek *argues* for the coin flip to ensure equal concern. Scoring them separately is redundant; they stand or fall together on the Ex Ante/Ex Post conflict.

  **Final Verdict:**
  *   **Utilitarianism** fails the **Constraint on Instrumental Harm**. It is rationally consistent but morally too demanding in "Escape Hatch" cases.
  *   **Taurek/Coin** fails **Ex Post Maximization** and **Transitivity**. It is morally respectful of individuals but leads to "worse" outcomes and potential irrationality in complex chains.
  *   **The Impossibility:** You cannot satisfy **Ex Ante Fairness** and **Ex Post Maximization** simultaneously. You must choose which violation you are willing to live with.
