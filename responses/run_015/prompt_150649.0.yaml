  And most useful for me: what further case should i put to him to force the rules apart? There's the obvious tweak where a second person reads her log but can't feel the state, and another where the headband detects a pattern she can't feel at all so 'Z' is purely a readout — but i'm not sure either of those is the sharpest thing to ask. Tell me which variant would actually separate the surviving rules, and what each rule says about it.
