  This is a classic *Philosophical Investigations* puzzle (roughly §§243–315). Your leader is walking a very specific line: they are rejecting **private ostensive definition** (Cases 1–2) and **empirical correlations** (Cases 3–4), while accepting **public criteria** (Cases 5–7), even in solitary contexts.

  The tension in the Antarctic case lies in whether the headband counts as a **public criterion** (like the swatch) or an **empirical symptom** (like the pulse).

  Here are the two precise rules that fit your seven data points but diverge on the Antarctic case, followed by the variant that will force your leader to reveal which one they are actually using.

  ### The Two Candidate Rules

  **Rule 1: The "Independent Anchor" Rule**
  *   **Principle:** A sign has meaning if there is a check on its use that is independent of the user's memory or immediate impression. The check must be physical and repeatable.
  *   **Why it fits the 7 cases:** It explains why memory fails (Cases 1–2) but physical props succeed (Cases 6–7). It explains why the pulse failed (Case 3) *only if* we assume identifying the pulse relied on inner feeling (as your leader said).
  *   **Prediction for Antarctic:** **YES.** The headband and log are physical, independent of her memory, and provide a clear right/wrong check. The fact that she is alone or abandons it later doesn't matter; the anchor existed during use.

  **Rule 2: The "Grammatical Criterion" Rule**
  *   **Principle:** A sign for a sensation has meaning only if its criteria are **grammatical** (constitutive of the meaning, like a sample or natural expression), not **empirical** (correlated by discovery, like a machine reading or a pulse). A machine indicates a state; it does not define the sensation.
  *   **Why it fits the 7 cases:** It explains why the pulse (Case 3) and basement (Case 4) failed: they are empirical correlations (symptoms), not definitions. It explains why the swatch (Case 6) and grimace (Case 7) succeeded: a colour sample *is* the colour; a grimace *is* the expression of pain. They are part of the language-game's grammar, not evidence for it.
  *   **Prediction for Antarctic:** **NO.** The headband is an empirical instrument detecting a correlate (cortical pattern). 'Z' is being inferred from evidence, not applied according to a public rule. It functions as a technical code for a brain state, not a sensation word.

  ### My Best Guess: Rule 2
  Your leader is almost certainly running **Rule 2 (The Grammatical Criterion Rule)**.

  **Why?** Look at Case 3 (The Pulse). A pulse is physical and independent of memory, just like the headband. If Rule 1 were the true driver, the Pulse case should have been a "Yes" (or at least a "Maybe"). Your leader's rejection ("you'd have to identify the pulse by how it feels") hints that the problem wasn't just the feeling, but the **inferential nature** of the check.

  In Wittgenstein's view, I do not *find out* I am in pain by checking evidence; I *express* it. The swatch works because it is a sample, not a detector. The headband is a detector. Therefore, on a strict reading, 'Z' in the Antarctic case is not a sensation word; it is a theoretical label for a machine state.

  ### The Variant That Forces the Split

  To confirm this, you need a case that keeps the **Independence** (Rule 1) but changes the **Grammar** (Rule 2). Do not ask about adding a second person (Case 5 already settled that solitude isn't fatal). Do not ask about abandoning the practice (Case 6 implies temporary use is okay).

  **Put this case to him:**

  > **The "Visible Dye" Variant:**
  > Same researcher, same isolation. But instead of a headband, she has injected a harmless tracer that reacts to the cortical pattern. Whenever the pattern occurs, **the tip of her finger turns bright red** for ten seconds. She writes 'Z' in her log whenever her finger is red. She never shows anyone, and abandons the practice when she leaves.

  **Why this separates the rules:**

  1.  **Rule 1 (Independent Anchor) says:** **YES.** (Same as the Headband case). The finger color is a physical check independent of memory. If the Headband was a YES, this must be too.
  2.  **Rule 2 (Grammatical Criterion) says:** **YES.** (Unlike the Headband case). A visible bodily change functions like the **colour swatch** (Case 6) or the **grimace** (Case 7). It is a public quality, not a machine readout. It transforms the "symptom" into a "criterion."

  **The Payoff:**
  *   If he says **NO** to the Headband but **YES** to the Dye: He is committed to **Rule 2**. The problem with the Headband was that it was an *instrumental inference*, not that she was alone. He distinguishes between *detecting* a state and *expressing* it.
  *   If he says **NO** to both: He is running a stricter rule, likely that **sensation words cannot be grounded in external states at all**, only in natural behavior (the Grimace case).
  *   If he says **YES** to both: He is running **Rule 1**. The Headband was fine all along; the physical record was sufficient.

  **Recommendation:** Lead with the **Visible Dye**. It isolates the "Machine vs. Body" distinction without muddying the waters with "Community" or "Memory" issues. It forces him to decide if the barrier is *privacy* or *grammar*.
