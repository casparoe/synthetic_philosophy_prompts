answer: |-
  The core mechanic forces students to ratify a binding resource-allocation Constitution under the assumption of an indefinite horizon, simulate five generations where that Constitution dictates tangible welfare outcomes, and then confront a revealed probabilistic termination condition that renders their ex ante optimal rule ex post catastrophic, delivering the single insight that Archimedean aggregation functions (like total or average utilitarianism) cannot remain stable when the domain of moral patients shifts from potentially infinite to necessarily finite without violating either rationality or justice.

  ### Pre-Design Brainstorm: Tangible Stakes and Abstract Divergence
  To avoid reducing this to a mathematics demonstration, the stakes must feel like *losses* rather than just scorekeeping. Pure points are abstract; convertible tokens are currency. However, if the conversion is linear, students simply maximize the number. To represent the *divergence* between Total and Average utilitarianism without lecturing, the reward structure must be **non-linear and collective**.
  *   **Idea:** A shared pool of $120 (e.g., gift cards) is available. The pool is unlocked only if the *Minimum Welfare* across the simulated generations exceeds a threshold. The *size* of the pool is determined by the *Total Welfare* generated.
  *   **Why:** This forces a tension. Maximizing Total Welfare (saving heavily for future compound growth) might crash Minimum Welfare in early generations (starving Gen 1). Maximizing Minimum Welfare (equal consumption) might cap the Total Welfare (missing out on compound growth if the horizon were actually infinite).
  *   **Refinement:** Keep it simpler to ensure runnability in 90 minutes. The "Stake" is a donation made in the class's name to a long-termist charity vs. a direct cash split. If they choose a "Total Utilitarian" Constitution (high savings), the simulation shows high potential future value but low current consumption. If the game stops early, that potential is vaporized. The tangible stake is a envelope containing cash proportional to the **Realized Welfare Sum** of the 5 rounds played. If they saved too much for a 6th generation that never happened, the Realized Sum is low. They physically hold less money because they bet on infinity.

  ### Activity Design: The Open-Horizon Allocation Game

  **Setting:** Graduate Seminar Room (whiteboard, table seating for 12).
  **Participants:** 12 Students (Constitutional Architects), 1 Facilitator.
  **Materials:**
  *   12 "Constitution Drafting" worksheets.
  *   1 "Generation Ledger" (projected or whiteboard).
  *   50 "Resource Tokens" (physical chips, distinct colors for Consumption vs. Capital).
  *   1 "Termination Deck" (custom prepared cards, hidden).
  *   Envelope containing cash reward (calculated post-session).

  **Roles:**
  *   **The Architects (All 12 Students):** Collective decision-makers. They must agree unanimously on the Constitution.
  *   **The Facilitator (You):** Keeper of the Horizon, Banker, and Simulator. You do not vote; you enforce the rules and reveal the hidden condition.

  **The Hidden Condition (Facilitator Eyes Only):**
  The simulation is governed by a "Horizon Deck." The probability of the sequence terminating at Generation $n$ (given it reached $n$) is $1/(n+1)$.
  *   Rounds 1–4 are **guaranteed** to continue (to ensure activity completion).
  *   Starting Round 5, the Deck is active.
  *   *Mathematical Property:* The Expected Number of Generations is Infinite ($\sum 1/n$ diverges), but the Probability of an Infinite Sequence is Zero.
  *   *Pedagogical Function:* This justifies ex ante investment for infinity (high expected value) but guarantees ex post finitude (realized value is finite).

  #### Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10: Framing and Endowment**
  *   **Facilitator:** "You are Constitutional Architects for a civilization facing an open temporal horizon. You do not know if humanity ends in 10 generations or lasts forever. You must ratify a single binding rule—the Constitution—that dictates how resources are split every generation."
  *   **Mechanic:** Each generation receives an Endowment of 100 Tokens.
  *   **Constraint:** The Constitution must specify a fixed percentage $S$ (Savings Rate) allocated to Capital Investment. The remainder $(100-S)$ is Consumption.
  *   **Stakes:** "At the end of the session, the total **Consumption Tokens** generated across all simulated rounds will be converted to cash at $1 per 10 tokens, divided equally among you. Capital Tokens invested in unplayed generations are worthless."
  *   **Growth Rule:** Capital carries over to the next generation with a 50% return (Invest 100 -> Next Gen gets 150 added to Endowment). *Note: High return incentivizes saving if horizon is infinite.*

  **00:10 – 00:35: Constitutional Ratification**
  *   **Task:** Students must agree unanimously on the Savings Rate $S$ (0% to 100%).
  *   **Constraint:** No discount rates allowed. The rule must treat all generations formally equally (no "Gen 1 gets special privilege").
  *   **Facilitator Intervention:** If they propose "We save 90% because infinity," remind them: "This is binding law. If the world ends tomorrow, Gen 1 starves. If you propose 'We save 10%,' you may fail to maximize potential if the world lasts forever. Decide."
  *   **Predictable Failure:** Students will try to set a conditional rule ("Save 90% unless..."). **Reject this.** The Constitution must be a single fixed number $S$ to enforce the aggregation rigidity.
  *   **Output:** Write the chosen $S$ on the board. This is now immutable.

  **00:35 – 00:60: The Simulation (Generations 1–5)**
  *   **Round 1:** Facilitator calculates Consumption $(100 \times (1-S))$ and Capital $(100 \times S)$. Add Capital to pool. Apply 50% growth. New Endowment = 100 + (Capital $\times$ 1.5).
  *   **Rounds 2–4:** Repeat calculation. Update the "Welfare Ledger" publicly.
  *   **Round 5:** Before calculating, announce: "The Horizon is open. We could stop here, or continue."
  *   **Action:** Run the calculation for Round 5.
  *   **Stop:** After Round 5 results are logged, halt the simulation. Do not draw from the Termination Deck yet.
  *   **Calculation:** Sum the Consumption Tokens from Rounds 1–5. Convert to cash value (e.g., 300 tokens = $30). Place cash in an envelope.

  **00:60 – 00:75: The Revelation and Ex Post Evaluation**
  *   **Facilitator:** "You ratified this rule based on an open horizon. Let us reveal the actual structure of the horizon you inhabited."
  *   **Reveal:** Show the Termination Deck. Explain the probability structure ($P(\text{stop at } n) = 1/(n+1)$).
  *   **Math Check:** "The expected number of generations was infinite. Your ex ante rational choice (if maximizing Expected Total Welfare) was likely a high Savings Rate (e.g., $S=80\%$). However, the probability of the sequence actually continuing past Round 5 was only 1/6."
  *   **The Clash:** Open the envelope. Count the cash.
  *   **Prompt:** "If you had chosen $S=20\%$ (favoring current consumption), your cash reward would be $X. Because you chose $S=80\%$ (favoring the infinite future), your reward is $Y. You sacrificed actual welfare for expected welfare that never materialized."

  **00:75 – 00:90: Debrief and Conceptual Mapping**
  *   **Mapping 1: Average vs. Total Utilitarianism.**
      *   If they chose High $S$: They acted as Total Utilitarians (maximizing the sum over an infinite series).
      *   If they chose Low $S$: They acted closer to Average Utilitarians or Prioritarians (securing a floor).
      *   *Insight:* Total Utilitarianism is vulnerable to "Infinity Pumping"—sacrificing all actual lives for potential ones.
  *   **Mapping 2: Ex Ante vs. Ex Post.**
      *   Ex Ante: High $S$ was rational (Infinite Expectation).
      *   Ex Post: High $S$ was ruinous (Finite Realization).
      *   *Insight:* Ethical rules based on expected value collapse when the sample space includes infinite outcomes with probability zero.
  *   **Mapping 3: Archimedean Aggregation.**
      *   *Insight:* No linear weighting of welfare works here. To satisfy the "Open Horizon" condition, you need non-Archimedean values (lexical priority), but those violate continuity in the simulation.

  ### Limitations and Facilitator Scripting

  **What This Activity Cannot Reproduce:**
  You cannot simulate an *actual* infinite population. The game stops at 5 rounds. The "Infinity" is purely mathematical in the expectation calculation.
  *   **Facilitator Script:** "We did not meet infinite people. We met five. The paradox lies in the *justification* you used for those five. You justified starving Gen 1 to help Gen $\infty$. But Gen $\infty$ does not exist. The metaphysical gap is between *potentiality* (the horizon looked open) and *actuality* (the horizon was closed). No classroom game can bridge that ontological gap; I am supplying it now verbally. In reality, the 'future people' are not just probabilistic events; they are contingent beings whose existence depends on your choices (Non-Identity). This game froze identity to isolate the aggregation problem."

  **Handling Predictable Failure Modes:**

  **1. The "Discount Rate" Hedge:**
  *   **Student Move:** "We should set $S=50\%$ but add a clause that after 100 years, savings drop to 0."
  *   **Facilitator Response:** "That is a discount rate disguised as a cutoff. The prompt requires a rule for *every* successive generation without knowing $N$. If you hard-code a cutoff, you are asserting knowledge of the horizon you claim not to have. Please revise to a single fixed percentage."
  *   **Pedagogical Goal:** Force them to feel the discomfort of committing to a universal rule without boundary conditions.

  **2. The "Risk Aversion" Objection:**
  *   **Student Move:** "We chose low savings because we were risk-averse, not because of utilitarianism."
  *   **Facilitator Response:** "Valid. But note that under Standard Utilitarianism, risk aversion is usually modeled via diminishing marginal utility of consumption, not via horizon uncertainty. Did you adjust your utility function, or did you adjust your population model? If the latter, you implicitly rejected the 'Open Horizon' premise in favor of a 'Finite Risk' model. This confirms the paradox: you cannot hold both Open Horizon and Risk Aversion without breaking the aggregation rule."

  **3. The "Unanimity" Deadlock:**
  *   **Student Move:** They spend 25 minutes arguing and don't agree.
  *   **Facilitator Response:** "Time is a resource. If no Constitution is ratified by minute 35, the default rule is $S=100\%$ (Total Hoarding). This represents the 'Paralysis' failure mode of intergenerational justice." (Usually, this threat forces a decision).

  ### Final Debrief Insight (The Bottom Line)
  Conclude by stating: "The Open-Horizon Aggregation Paradox shows that if we treat future generations as merely additional entries in a sum, we are forced to either gamble everything on an infinite future that likely won't arrive (Total Utilitarianism) or arbitrarily truncate the moral community (Discounting). The structural failure is not in your math, but in the assumption that 'justice' can be computed via aggregation across an ontologically uncertain horizon."
