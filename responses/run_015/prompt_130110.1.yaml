  Jordan (the Generalist) and Casey (the Particularist) are crouching behind a potted fern at the wedding reception, holding the groom's leather loafers. Across the room, a prominent vegan activist is glaring at the charcuterie board.

  **Jordan:** "Okay, principle check. We have 'Honor Tradition' versus 'Avoid Causing Distress.' Tradition says hide the shoes. Compassion says don't offend the activist. We just need to weigh them."

  **Casey:** "You can't weigh them. The scale changes depending on where you stand."

  **Jordan:** "What? 'Honor Tradition' is a *pro tanto* reason. It always counts in favor of doing the traditional thing. It has positive moral polarity."

  **Casey:** "Not here. Look at the context. Leather shoes. Vegan activist. In *this* specific shape of the situation, 'because it's a tradition' isn't a reason *for* hiding the shoes anymore. It's actually a reason *against* it."

  **Jordan:** "That's impossible. You can't just flip the sign on a universal principle because the room smells like tofu."

  **Casey:** "I'm not flipping it. The context is doing it. In a normal wedding, citing tradition adds weight to hiding them. But here, citing tradition highlights the insensitivity. The feature 'it is a tradition' contributes negatively to the moral outcome *this time*."

  **Jordan:** "So how do I know when tradition is a virtue and when it's a vice? Give me the rule."

  **Casey:** "There is no rule, Jordan. That's the whole point. The reason doesn't exist in isolation. It's holistic."

  **Jordan:** "So you're just... guessing?"

  **Casey:** "No, I'm judging. You're trying to do math."

  **Jordan:** "My friend was right. You particularists didn't just lose the rulebook. You threw it away."

  **Casey:** "No. I didn't lose the rulebook. I just realized the ink is shape-sensitive. Put the shoes back, Jordan. In this light, 'tradition' is just a word for 'doing the wrong thing consistently.'"
