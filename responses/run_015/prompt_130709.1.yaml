  here's the decision tree i'd sketch on a napkin for her. it splits based on where the obligation comes from and whether the body is negotiable. i've mapped out seven leaves. some are crowded, some are ghost towns.

  **the root question:** *is the obligation grounded in biological qi (vitality) or social li (ritual conduct)?*

  **branch A: Biological Qi (Blood)**
  *   **Leaf 1: The Blood-Quietist (Unnamed / Folk)**
      *   *Commitment:* No shared blood = no shared qi = no duty. The revelation instantly severs the bond.
      *   *Status:* **Empty Spot.** Classical texts barely touch this. it's mostly modern folk confucianism. is it incoherent? yeah, basically. if *li* (ritual) created the son, blood shouldn't unmake him. but people believe it.
      *   *Verdict:* Refuse donation.

  **branch B: Social Li (Ritual/Conduct)**
  *   *Secondary Split:* *does the performance of ritual lock the role permanently, or can the 'heart-mind' (xin) override it?*

      *   **Branch B1: Ritual Locks Role**
          *   **Leaf 2: The Ritual Formalist (Xunzi)**
              *   *Commitment:* You performed the winters and summers of filial piety. You are the son becuase you did the work. Biology is noise.
              *   *Verdict:* Donate.
          *   **Leaf 3: The Role Constructor (Roger Ames)**
              *   *Commitment:* Roles aren't found, they're made. You co-created this relationship. To stop now is to deny your own history.
              *   *Verdict:* Donate.
          *   **FLAG:** *The tree can't actually tell Leaf 2 and Leaf 3 apart in this scenario.* both say "biology doesn't matter, role matters." the split is metaphysical (habit vs. creation), but the kidney outcome is identical. your protag should notice this glitch.

      *   **Branch B2: Heart-Mind Overrides**
          *   **Leaf 4: The Affective Realist (Mencius)**
              *   *Commitment:* Ritual is just the vessel; the wine is the feeling (*qing*). if the revelation kills the love, the duty evaporates. if love remains, duty remains.
              *   *Verdict:* Conditional (Donate only if love survives the shock).
          *   **Leaf 5: The Corporeal Conservator (Classic *Xiao Jing*)**
              *   *Commitment:* Wait, different split here. Your body is not yours. it is a gift from your parents (adoptive or not, if the role holds). Damaging it (surgery) is unfilial.
              *   *Verdict:* Refuse donation (to preserve the parents' gift).
          
      *   **Branch B3: Universal Override**
          *   **Leaf 6: The Universal Humanist (Unnamed)**
              *   *Commitment:* *Ren* (humaneness) trumps *Xiao* (filiality). Saving a life is a human duty, not a son's duty. but forcing it violates autonomy.
              *   *Verdict:* Donate (as a human act, not a filial one).
          
      *   **Leaf 7: The Instant Switch (Unnamed)**
          *   *Commitment:* This is the specific empty spot you asked about. The view that knowledge of adoption *instantly* kills duty regardless of blood theory.
          *   *Status:* **Incoherent.** there's no philosophical defense for this in the canon. it treats role ethics like a video game quest line that glitches out. it's unexplored territory becuse it violates the core confucian idea that history cannot be erased.
          *   *Verdict:* Refuse.

