answer: |-
  This is a classic problem in social ontology, and your instincts are correct to be suspicious. Your teacher is reaching for a Wittgensteinian picture of "forms of life" but applying it with the blunt force of a hard-line conventionalist. He is conflating *coordination conventions* (like grammar or driving sides) with *cooperation norms* (like fairness or harm).

  To give you the rigorous breakdown you need for your EPQ, I will first walk through the theoretical alignments I considered and rejected, then present the definitive mapping, the breakdown, and my final verdict on your teacher's claims.

  ### 1. Brainstorming Candidate Alignments

  Before settling on the analysis, I considered three ways to map norms onto grammar. It is useful to see why the first two fail, as this clarifies why the third is the only one that gives the teacher's argument a fighting chance.

  *   **Candidate 1: The Chomskyan/Internalist Alignment.**
      *   *Idea:* Norms are like Universal Grammar; deep structures are innate, surface behaviors vary.
      *   *Rejection:* This is biologically reductionist. We know norms are transmitted culturally, not genetically. If norms were innate, your grandad wouldn't have had different norms in 1975; he would have had the same ones as you. This alignment cannot explain historical drift, so it fails the teacher's own premise.
  *   **Candidate 2: The Lewisian/Coordination Alignment.**
      *   *Idea:* Both are solutions to coordination problems (David Lewis's *Convention*). We speak this way to be understood; we drive on this side to avoid crashing.
      *   *Rejection:* You already noted Lewis. The problem is that Lewisian conventions are *arbitrary*. There is no reason to prefer "red means stop" over "green means stop," provided everyone agrees. While this fits the "driving on the left" example, it fails for "don't freeload." Freeloading isn't arbitrary; it exploits a public good. This alignment makes all norms look like traffic rules, erasing the moral dimension.
  *   **Candidate 3: The Wittgensteinian/Constitutive Alignment (Selected).**
      *   *Idea:* Grammar constitutes the possibility of meaningful speech; Norms constitute the possibility of social interaction. To break grammar is to become unintelligible; to break norms is to become untrustworthy.
      *   *Why this one:* This captures the "unwritten," "internalized," and "socially constitutive" nature of both systems without reducing them to biology or pure arbitrariness. It is the strongest charitable reading of your teacher's position. I will use this for the table below.

  ### 2. The Correspondence Table

  Here is the explicit mapping based on the Constitutive Alignment.

  | Grammar Domain | Social Norm Domain | Role in System |
  | :--- | :--- | :--- |
  | **The Sentence** | **The Social Action** | The unit of behavior being evaluated. |
  | **The Native Speaker** | **The Socialized Member** | The agent who has internalized the rules tacitly. |
  | **The Solecism** (e.g., "me and him") | **The Norm Violation** (e.g., cutting in line) | A deviation from the expected pattern. |
  | **The Raised Eyebrow** | **The Sanction** (disapproval, gossip) | The feedback mechanism correcting deviation. |
  | **Descriptive Grammar** | **Social Custom** | The observed regularity of behavior. |
  | **Prescriptive Grammar** | **Codified Law/Policy** | The attempted formalization of the rule. |
  | **Language Drift** (e.g., "you" replacing "thou") | **Cultural Evolution** | The slow change of standards over generations. |
  | **Tacit Knowledge** | **Internalized Obligation** | The inability to articulate *why* the rule holds. |

  ### 3. Where the Mapping Breaks

  The analogy holds water only so long as we are talking about *etiquette* or *coordination*. It shatters when we talk about *morality* or *power*. I have sorted these disanalogies by whether they actually damage your teacher's claims or are merely superficial differences.

  **A. Beside the Point (Superficial Disanalogies)**
  *   **Articulation:** The teacher claims you can't articulate grammar rules, implying norms are the same. *Reality:* Many people *can* articulate norm rules ("don't steal"), even if they can't articulate the deep philosophical justification. This doesn't threaten the claims; both systems rely heavily on tacit knowledge.
  *   **Speed of Drift:** Grammar changes over centuries; TikTok norms change in months. *Reality:* This is a difference of degree, not kind. It doesn't invalidate the structural comparison.

  **B. Threatening Disanalogies (Ontological Cracks)**
  *   **1. Arbitrariness vs. Reason-Responsiveness.**
      *   *Grammar:* It is arbitrary whether adjectives come before or after nouns. There is no *moral* reason for it.
      *   *Norms:* Many norms are non-arbitrary. "Don't freeload" is based on fairness and efficiency. "Don't hit people" is based on harm.
      *   *Threat:* This destroys **Claim 2**. You *can* change reason-responsive norms by arguing (providing new reasons). You cannot argue English into putting adjectives after nouns because there is no *reason* to prefer one over the other, only habit.
  *   **2. The Nature of the Sanction.**
      *   *Grammar:* A solecism results in *confusion* or *status marking* (you sound uneducated).
      *   *Norms:* A violation often results in *indignation* or *retaliation*.
      *   *Threat:* This destroys **Claim 1**. Indignation implies a belief that something *wrong* happened, not just something *different*. If I am indignant, I am not just marking you as an outsider; I am claiming you owe me restitution.
  *   **3. The Possibility of Legislation.**
      *   *Grammar:* A committee cannot legislate speech.
      *   *Norms:* Sweden *did* legislate the driving side (H-Day, 1967).
      *   *Threat:* This destroys **Claim 2**. While deep moral norms are hard to legislate, coordination norms (which make up a huge chunk of social norms) *can* be changed by focal points and state power.

  ### 4. Smuggled Features

  Your teacher's analogy is quietly importing two features of grammar that norms do not possess:

  1.  **Functional Equivalence:** In grammar, "me and him went" communicates the exact same state of affairs as "he and I went." The error is purely formal. In norms, the violation often changes the *outcome* (e.g., freeloading reduces the group's grade). The form *is* the function.
  2.  **Moral Neutrality:** Grammar has no moral valence. By using the grammar analogy, the teacher smuggles in the idea that norms are also morally neutral markers of group identity. This presupposes the conclusion he is trying to prove (that norm violations aren't "bad").

  ### 5. Verdict on the Two Claims

  I am going to commit clearly here: **Both of your teacher's claims fail.** The grammar analogy is seductive because it explains *how* norms exist (spontaneously), but it fails to explain *why* they bind us (normativity).

  *   **Claim 1 (No Blame for Generational Drift): FALSE.**
      While we should have *empathy* for your grandad, the grammar analogy suggests he is merely "out of date," like using a quill pen. But if his 1975 norm was "women shouldn't hold management roles," that isn't a grammatical stylistic choice; it's a claim about human capability and fairness. Because norms often track harm and justice (unlike grammar), they can be objectively wrong even if they were historically common. We blame people not just for breaking rules, but for causing harm. The grammar analogy hides the harm.
  *   **Claim 2 (No Intentional Change): FALSE.**
      This is the more dangerous claim. It implies political quietism. If norms are like grammar, activists are wasting their time arguing; they should just wait for drift. But history shows norms *are* changed by argument (abolition, suffrage, smoking bans). This is possible because norms are **reason-responsive**. We can persuade people that a norm is *unfair*, whereas you cannot persuade a linguist that "dog" is an *unfair* word for a canine.

  ### 6. The Single Most Damaging Disanalogy

  If you only put one objection in your EPQ, make it this one: **Arbitrariness.**

  Grammar is fundamentally arbitrary (Saussure's signifier/signified). There is no logical connection between the sound "tree" and the object. Therefore, it cannot be changed by argument, only by usage drift.
  Norms (specifically moral/cooperative ones) are **non-arbitrary**. They are tethered to human welfare, fairness, and coordination efficiency. Because they are tethered to *reasons*, they can be challenged by *arguments*.

  Your teacher's analogy works for **Etiquette** (which fork to use), but it fails for **Morality** (do not steal). By treating all norms as grammar, he treats all norms as Etiquette. This is a category error.

  ### 7. A Better Analogy: The Common Law

  If you want an analogy that keeps the "no single author/unwritten/evolving" features without smuggling in the "arbitrary/cannot change on purpose" features, use **The Common Law**.

  *   **Why it fits:** Like grammar, Common Law is unwritten (initially), evolves over time, relies on precedent (tradition), and is internalized by practitioners. No single person wrote it.
  *   **Why it's better:**
      1.  **Reason-Responsive:** Judges change Common Law by arguing about principles (justice, utility), not just waiting for drift. This saves **Claim 2** (change is possible).
      2.  **Blame/Liability:** Common Law allows for retroactive judgment based on evolving standards of care, but also considers "reasonable expectation." This nuances **Claim 1** (your grandad might be liable, but the standard is what a "reasonable person" knew, not just what was done).
      3.  **Normative Weight:** Breaking Common Law isn't just a "solecism"; it creates a liability. This matches the sanctions of social norms.

  **Conclusion for your EPQ:**
  Your teacher is half-right about the *origin* of norms (they are spontaneous orders, not designed top-down), but he is wrong about their *nature* (they are reason-responsive, not arbitrary) and their *malleability* (they can be changed by argument). The grammar analogy is a trap that leads to moral relativism. Reject the analogy, keep the insight about spontaneous order, and switch to the Common Law model to explain how we can critique and change norms without pretending we designed them.
