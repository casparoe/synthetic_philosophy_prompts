answer: |-
  ### Desiderata for an Institutional Account of Supererogation

  1.  **Cheap Rescue (Huge Stakes) vs. Costly Rescue (Modest Stakes):** The theory must locate the tipping point where benefit outweighs cost enough to flip an act from optional to required.
      *   *Status:* **Genuine Desideratum.** (Though the *location* of the line is contested, the existence of a line is widely shared intuition).
  2.  **Stranger vs. Role-Holder:** The same act (e.g., intubation) is supererogatory for a bystander but required for an on-duty anesthesiologist.
      *   *Status:* **Genuine Desideratum.** (Institutional roles constitutively alter deontic status).
  3.  **Third-Party Sacrifice:** Funding a stranger's surgery using your child's college fund is not merely costly; it violates a special obligation, making the act impermissible, not supererogatory.
      *   *Status:* **Genuine Desideratum.** (Tests agent-relative constraints against agent-neutral value).
  4.  **Supererogatory Omissions:** Forgiving a debt when you have the right to collect is doing "less" than permitted, yet morally elevated.
      *   *Status:* **Genuine Desideratum.** (Challenges act-centric models that equate "more" with "doing").
  5.  **The Collective Case:** If everyone on the roster volunteers for the holiday shift, no one is a hero; if no one does, the hospital fails. The theory must handle aggregation without erasing individual optionality.
      *   *Status:* **Genuine Desideratum.** (Essential for rostering and public goods).
  6.  **Entitled-but-Nasty:** Asserting a petty right (e.g., strict billing) is permissible but blameworthy (suberogatory).
      *   *Status:* **Genuine Desideratum.** (Distinguishes permission from praiseworthiness).
  7.  **The Unconsidering Agent:** Blaming a doctor not for refusing help, but for never *considering* the option to help.
      *   *Status:* **Internalist Prejudice.** (Externalists argue blame attaches only to voluntary acts, not mental omissions).
  8.  **The Hero with Rotten Motive:** Saving a life solely for a cash reward is praiseworthy in outcome but not in character.
      *   *Status:* **Act-Centric Prejudice.** (Virtue ethicists deny moral worth to acts divorced from good motive).

  ### The Impossible Pair
  **Case 1 (Cost/Benefit Threshold)** and **Case 3 (Third-Party Sacrifice).** You cannot maintain that net benefit dictates duty (Case 1) while simultaneously holding that special obligations to kin override net benefit (Case 3). If the stranger's need outweighs the child's tuition in utility, Case 1 demands payment; Case 3 forbids it. Satisfying both requires abandoning a single metric of value.

  ### The Killer Requirement
  **"Must distinguish act-assessment from agent-assessment."** This requirement rules out pure Consequentialism (which collapses the agent into the act's outcome) and pure Virtue Ethics (which collapses the act into the agent's character). Only hybrid deontic theories survive.

  ### View Evaluation Scorecard

  **Personal-Prerogative View:**
  Handles Case 3 (special obligations) and Case 6 (suberogation) well by protecting agent-centered options. Fails Case 1 (makes cheap rescue too optional) and Case 5 (struggles to generate collective duty from individual options).

  **Scalar/Ideal Agent View:**
  Excels at Case 7 (motivation) and Case 8 (moral worth) by grading agents rather than acts. Fails Case 2 (institutional roles need binary duty/permission) and Case 6 (no binary line for "blameworthy but permissible").

  **Maximizing-Plus-Options:**
  Secures Case 1 (clear duty threshold) and Case 5 (aggregate utility). Fails Case 3 (third-party costs count neutrally) and Case 4 (omissions look like failures to maximize value).
