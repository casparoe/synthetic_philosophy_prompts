answer: |-
  # The Incommensurability Sorter: A Decision Tree for the 1895 Heat Scenario

  **The Scenario:**
  Two labs in 1895 study heat in sealed vessels.
  *   **Lab A** describes the outcome as *caloric fluid being displaced*.
  *   **Lab B** describes the outcome as *mean kinetic energy of particles rising*.
  *   **Agreement:** They agree on the thermometer reading (the measurement).
  *   **Disagreement:** They disagree on what the reading *is*.

  ---

  ### Node 1: The Translation Test
  **Question:** If a scientist from Lab A tries to translate their report into Lab B's language, does the translation fail entirely (producing nonsense), or does it succeed but result in a statement Lab B considers *false*?

  *   **A. It fails entirely (Nonsense):** The terms are so bound to their specific theories that no mapping is possible.
      *   → Go to **Leaf 1**.
  *   **B. It succeeds (Falsehood):** They understand each other well enough to disagree; they are offering different theoretical glosses on the same measurement.
      *   → Go to **Node 2**.

  ### Node 2: The Neutrality Test
  **Question:** Is there a set of methodological rules or observational facts available to a neutral observer that forces a rational decision between Lab A and Lab B?

  *   **A. No:** The rules of observation and logic themselves are theory-laden; there is no neutral arbiter.
      *   → Go to **Node 3**.
  *   **B. Yes:** Observation and logic provide a common ground for adjudication.
      *   → Go to **Node 4**.

  ### Node 3: The Basis of Choice (When Neutrality Fails)
  **Question:** If there are no neutral rules, is the choice between frameworks ultimately a matter of social convention/pragmatism, or is it guided by shared epistemic values (e.g., accuracy, scope, consistency)?

  *   **A. Social Convention/Pragmatism:** The choice is akin to choosing a tool or a language; there is no "truth" tracking involved.
      *   → Go to **Leaf 2**.
  *   **B. Shared Epistemic Values:** There is no algorithm, but scientists are not being arbitrary; they weigh values differently.
      *   → Go to **Leaf 3**.

  ### Node 4: The Approximation Test (When Neutrality Holds)
  **Question:** Does the winning framework (Lab B) demonstrate that the losing framework (Lab A) was *approximately true* (e.g., caloric theory is a limit case of kinetic theory), or merely *empirically adequate* but fundamentally false?

  *   **A. Approximately True:** The old theory is preserved as a special case or approximation within the new one.
      *   → Go to **Leaf 4**.
  *   **B. Empirically Adequate/False:** The old theory is a useful fiction that does not track the actual structure of the world.
      *   → Go to **Leaf 5**.

  ---

  ### The Leaves (Positions)

  **Leaf 1: Strong Incommensurability**
  *   **Path:** 1A (Translation Fails).
  *   **Definition:** Proponents of different theories inhabit different conceptual worlds; they cannot fully understand one another because meaning determines reference.
  *   **Status:** *Named Position.*

  **Leaf 2: Instrumental Pluralism (Radical Conventionalism)**
  *   **Path:** 1B → 2A → 3A.
  *   **Definition:** Theories are merely instruments for prediction; choosing between them is a pragmatic convention without truth-value implications.
  *   **Status:** *Named Position.*

  **Leaf 3: Local Incommensurability / Semantic Holism**
  *   **Path:** 1B → 2A → 3B.
  *   **Definition:** Communication is possible (often by learning a second "language"), and choice is rational but not algorithmic. There is no neutral standpoint, but progress occurs via shared values or holistic web-adjustment.
  *   **Status:** *Flagged Pair (See below).*

  **Leaf 4: Convergent Realism**
  *   **Path:** 1B → 2B → 4A.
  *   **Definition:** Science accumulates truth; successful past theories refer to real entities and are approximately true, preserved as limit cases in current theory.
  *   **Status:** *Named Position.*

  **Leaf 5: Unnamed Position (Constructive Empiricism without Holism)**
  *   **Path:** 1B → 2B → 4B.
  *   **Definition:** Neutral observation decides theories, but we should only believe in empirical adequacy, not truth, and old theories are not approximations.
  *   **Status:** *Unnamed Space.*
  *   **Why this space might be empty:** It is unstable to claim neutral observation exists to decide theories, yet deny that successful theories approximate truth or reduce older ones; this usually collapses into realism or instrumentalism.

  ---

  ### ⚠️ Flagged Pair: Leaf 3 Ambiguity

  **The Problem:** **Local Incommensurability (Kuhn's later view)** and **Semantic Holism without Incommensurability (Quine/Davidson)** often collapse onto **Leaf 3**.

  **Why:** Both positions answer "No" to the Neutrality Test (Node 2) and "Shared Values/Web" to the Basis of Choice (Node 3).
  *   **Kuhn** argues meaning varies locally (no strict translation of terms like "mass"), requiring bilingualism to compare.
  *   **Quine** argues meaning is holistic (any statement can be held true if we adjust others), but translation is possible via manual construction.
  *   **In practice:** In a decision tree based on *choice mechanisms* rather than *semantic theory*, these look identical: both deny a neutral algorithm but deny irrationality. To separate them, you would need a node asking: *"Does the term 'heat' refer to a different natural kind in Lab A than in Lab B?"* (Kuhn: Yes; Quine: No/Indeterminate). Since this handout avoids semantic technicalities, they occupy the same leaf.

  ### ⚠️ Empty Space Analysis

  **The Unnamed Leaf (Leaf 5):**
  *   **Why this space might be empty:** It is incoherent to assert that a neutral observer can decisively judge theories using shared rules (Node 4) while simultaneously denying that the winning theory captures the approximate truth of the losing one (Node 4B); if the rules are strong enough to decide, they are usually strong enough to show structural continuity.

  **Another Potential Empty Space (Node 3A + Node 1A):**
  *   **Why this space might be empty:** If translation fails entirely (Strong Incommensurability), one cannot coherently claim the choice between frameworks is merely pragmatic/conventional, because one cannot even identify the frameworks as competing options to choose between.
