prompt: |-
  ok so I'm a third-year PPE student and my political theory seminar has me writing a paper on humanitarian intervention and regime change, and I've gotten stuck in kind of the worst way: I've read maybe six different accounts and I can't tell whether they're even answering the same question. Some are trying to tell a minister what to do next month, some are trying to render a verdict on whether NATO's Kosovo campaign was right all things considered now that we know how it went, and some are really trying to say when sovereignty stops shielding a regime from outsiders. So before I commit to arguing with anyone I want the spec first — the list of things any theory in this area has to be able to do before it's allowed to count as an answer, whatever it concludes.

  Fix the purpose like this, because I think a lot of the disagreement dissolves once you do: I want a theory good enough to be turned into a standing ex ante decision rule that a regional body could actually apply beforehand, by people who don't know how things will turn out. That means no criterion that can only be evaluated in hindsight, and no criterion that requires reading anyone's mind. With that constraint in place, give me the full requirements list: the phenomena a theory has to explain, the cases it has to get right (and say which case is doing the work for each requirement — Kosovo, Iraq 2003, Libya 2011, Rwanda 1994 as the non-intervention, Syria 2013 as the other non-intervention, anything else you think is load-bearing), the distinctions it can't collapse (I already suspect civilian-rescue vs. regime change is one, and intention vs. motive vs. publicly stated rationale is another), and the empirical findings it can't contradict if it wants to be taken seriously by IR people and not just philosophers — stuff like what the record actually shows about foreign-imposed regime change, the moral-hazard worry that credible promises of intervention encourage rebellion, and the selectivity problem of interventions happening somewhere other than where the killing is worst. Also tell me which of the standard requirements are genuine and which are just one camp's house prejudices wearing a lab coat: is the right-intention criterion a real requirement or a demand no institutional rule could ever operationalize, is reasonable prospect of success a requirement or a dressed-up status-quo bias, can last resort ever be satisfied by anything that isn't indefinite delay, and does saying an intervention can be unlawful yet morally justified name a coherent category or a contradiction. Flag any pair or trio of requirements you think can't be jointly satisfied — that's the part I most want, e.g. if authorization-by-international-body and effectiveness-under-a-veto simply can't both hold, say so, because then the list is itself the result. And then: which single requirement knocks out the most candidates?

  Format-wise, put the requirements in a markdown table with exactly these columns: id; requirement (one sentence, phrased as something a theory has to do, not as a claim about the world); motivating case or consideration; verdict, one of genuine / camp-prejudice / negotiable; status, one of settled / contested; and conflicts (which other ids it clashes with, or none). After the table, prose for the unsatisfiable sets and for the knockout-requirement answer. Keep the scorecard minimal — a few sentences at the very end on how the main contenders do against the list is plenty, I'm not asking you to referee the whole debate. One thing I do need: seperate clearly, in the status column and in the prose, what basically everyone who works on this agrees on from what is genuinely contested and you're taking a side on. Don't hand me a contested position as if it were the consensus — half my paper is going to be that the field doesn't agree, so if you flatten that out you've actively misled me.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Third-year PPE student (Philosophy, Politics, Economics).
      *   **Task:** Write a paper on humanitarian intervention and regime change.
      *   **Problem:** Stuck because existing literature seems to be answering different questions (policy advice vs. retrospective judgment vs. theoretical sovereignty).
      *   **Goal:** Define the *spec* (requirements list) for a theory of humanitarian intervention/regime change.
      *   **Constraint:** The theory must function as a *standing ex ante decision rule* for a regional body (actionable beforehand, no hindsight, no mind-reading).
      *   **Specific Deliverables:**
          *   List of requirements (phenomena to explain, cases to get right, distinctions to keep, empirical findings to respect).
          *   Critique of standard Just War/R2P criteria (Right Intention, Reasonable Prospect, Last Resort, Legality vs. Morality).
          *   Identification of incompatible requirements (trade-offs).
          *   Identification of the "knockout" requirement.
          *   **Format:** Markdown table with specific columns (id, requirement, motivating case/consideration, verdict, status, conflicts). Followed by prose on unsatisfiable sets and the knockout requirement. Minimal scorecard at the end.
          *   **Tone/Epistemic Status:** Distinguish clearly between consensus and contested claims. Do not present contested positions as consensus. Acknowledge the user's constraint (ex ante rule) as the filtering mechanism.

  2.  **Deconstruct the Constraint (Ex Ante Decision Rule):**
      *   This is the critical filter. Many standard Just War criteria (like *Right Intention* or *Reasonable Prospect of Success*) are notoriously difficult to assess *ex ante* without hindsight bias or mind-reading.
      *   The user wants a rule for a *regional body* (implies some institutional capacity, but not necessarily UN Security Council unanimity).
      *   This constraint immediately puts pressure on criteria like "Legality" (UN Charter vs. Moral Duty) and "Last Resort" (how long do you wait?).

  3.  **Drafting the Requirements (The Table):**
      *   *Need to cover:*
          1.  Threshold for intervention (Just Cause).
          2.  Authority/Legality.
          3.  Feasibility/Success.
          4.  Intent/Motive.
          5.  Timing/Last Resort.
          6.  Proportionality.
          7.  Post-Intervention (Regime Change specifics).
          8.  Consistency/Selectivity.
      *   *Cases to integrate:* Kosovo (1999), Iraq (2003), Libya (2011), Rwanda (1994), Syria (2013).
      *   *Empirical findings:* FIRC (Foreign Imposed Regime Change) failure rates, Moral Hazard, Selectivity.

      *   *Drafting Rows (Mental Iteration):*
          *   *ID 1: Just Cause Threshold.* Needs to be objective enough for ex ante. *Status:* Mostly settled on "mass atrocity," contested on "regime change" as a goal.
          *   *ID 2: Authority.* UN SC vs. Regional. *Conflict:* Effectiveness vs. Legality.
          *   *ID 3: Right Intention.* Can a rule check this ex ante? *Verdict:* Camp-prejudice (hard to operationalize).
          *   *ID 4: Reasonable Prospect.* Hindsight bias risk. *Verdict:* Negotiable (needs empirical baseline).
          *   *ID 5: Last Resort.* Indefinite delay risk. *Verdict:* Contested.
          *   *ID 6: Post-Intervention Responsibility.* "You break it, you buy it." *Conflict:* With non-interference norms.
          *   *ID 7: Selectivity/Consistency.* *Verdict:* Genuine but hard to enforce as a rule.
          *   *ID 8: Moral Hazard.* *Verdict:* Genuine empirical constraint.

  4.  **Refining the "Verdict" and "Status" Columns:**
      *   *Verdict:* Genuine (necessary for the spec), Camp-Prejudice (philosophical purity over institutional reality), Negotiable (depends on the specific institutional design).
      *   *Status:* Settled (broad agreement), Contested (deep disagreement).
      *   *Crucial:* I must not pretend there is consensus where there isn't. For example, "Legality" is highly contested between Legal Positivists and Natural Law proponents in IR. "Right Intention" is often dismissed by realists and institutionalists as unverifiable.

  5.  **Identifying Conflicts (The "Unsatisfiable Sets"):**
      *   *The Veto Problem:* UN Authorization (Legality) vs. Effectiveness (Action under Veto). Kosovo is the prime example.
      *   *The Knowledge Problem:* Reasonable Prospect (Ex Ante) vs. Empirical Reality (FIRC failure rates). If the data says FIRC fails 50%+ of the time, can you ever satisfy "Reasonable Prospect" for regime change?
      *   *The Consistency Problem:* Selectivity vs. Moral Duty. If you only intervene where it's cheap, you violate consistency. If you intervene everywhere, you lack capacity.

  6.  **Identifying the "Knockout" Requirement:**
      *   Which requirement kills the most theories?
      *   Given the user's constraint (*ex ante decision rule*), **Right Intention** is the biggest casualty. It's impossible to codify into a rule for bureaucrats.
      *   However, **Reasonable Prospect of Success** (calibrated against empirical FIRC data) is also a massive killer. Most interventions (especially regime change) fail to establish democracy.
      *   *Decision:* The *Ex Ante Operability* constraint itself makes "Right Intention" the formal knockout, but "Reasonable Prospect" calibrated to empirical data is the substantive knockout. I will focus on **Operationalizability (Ex Ante Verifiability)** as the meta-requirement that knocks out "Right Intention" and strict "Last Resort."
      *   *Wait, looking closer at the prompt:* "Which single requirement knocks out the most candidates?"
      *   If I include "Right Intention" as a requirement, it knocks out Institutional/Realist theories. If I exclude it, it knocks out Kantian/Just War theories.
      *   *Better angle:* The requirement **"Empirical Consistency with FIRC Outcomes"** (i.e., you must acknowledge regime change usually fails to stabilize) knocks out the optimistic Liberal Interventionist models (Iraq 2003 proponents).
      *   *Best angle for PPE:* The requirement **"Ex Ante Verifiability"** (derived from the user's spec) knocks out standard Just War criteria like Right Intention and nuanced Last Resort. I will frame this as a specific requirement in the table.

  7.  **Drafting the Prose (Unsatisfiable Sets & Knockout):**
      *   *Unsatisfiable Set:* UN Security Council Authorization + Timely Action to Stop Atrocities + Veto-Wielding Perpetrators/Allies. (The "Kosovo Dilemma").
      *   *Knockout:* The "Ex Ante Verifiability" constraint. It renders "Right Intention" useless as a *rule* (though maybe not as a virtue).
      *   *Consensus vs. Contested:* Be careful. Everyone agrees mass killing is bad. Not everyone agrees sovereignty is conditional. Not everyone agrees FIRC data is decisive.

  8.  **Review against Constraints:**
      *   Markdown table? Yes.
      *   Specific columns? Yes (id, requirement, motivating case, verdict, status, conflicts).
      *   Prose on unsatisfiable sets? Yes.
      *   Prose on knockout? Yes.
      *   Minimal scorecard? Yes.
      *   Distinguish consensus/contested? Yes.
      *   User's Spec (Ex Ante Rule)? Yes, this is the lens.

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't sound like I'm saying "Realism is right." I need to say "For an *ex ante rule*, Realist criteria are more operationalizable."
      *   *Correction:* Ensure the distinction between Humanitarian Intervention (HI) and Regime Change (RC) is clear. RC is often the *means* or the *outcome*, but HI is the *justification*. The prompt asks about both.
      *   *Correction:* The "Verdict" column needs to reflect whether the requirement belongs in the *spec* defined by the user (ex ante rule), not whether it's philosophically true. So "Right Intention" gets "Camp-Prejudice" *relative to the user's spec*, even if it's central to Just War Theory.
      *   *Correction:* Check the cases. Rwanda (non-intervention), Syria (non-intervention), Kosovo (unauthorized), Iraq (unjustified/failed), Libya (authorized/contested outcome).
      *   *Correction:* Empirical findings. Downes & Montgomery on FIRC. Pickering & Peceny. Moral Hazard (Kuperman).

  10. **Final Polish:** Check tone. Academic, precise, PPE-appropriate (analytic but policy-aware). Ensure the distinction between "Settled" (empirical or broad normative agreement) and "Contested" (theoretical disagreement) is sharp.

  *(Self-Correction on "Verdict" column)*: The prompt asks for "genuine / camp-prejudice / negotiable".
  *   "Genuine": Must be in the spec.
  *   "Camp-Prejudice": Looks like a requirement but is actually a specific theoretical bias (e.g., Right Intention for an institutional rule).
  *   "Negotiable": Depends on the specific institutional design.

  *(Self-Correction on "Status" column)*: "Settled / Contested".
  *   "Settled": Empirical facts or near-universal normative baseline (e.g., genocide is bad).
  *   "Contested": Where the literature fights (e.g., does sovereignty trump human rights?).

  Let's build the table.

  *   *Req 1:* Threshold of Harm. (Jus ad Bellum).
  *   *Req 2:* Ex Ante Verifiability. (The User's Constraint).
  *   *Req 3:* Authority/Legality. (UN vs Regional).
  *   *Req 4:* Reasonable Prospect (Empirical).
  *   *Req 5:* Right Intention.
  *   *Req 6:* Last Resort (Time-bound).
  *   *Req 7:* Post-Intervention Commitment.
