  *Conflicts:*
  *   2 vs 5 (Verifiability vs Intention).
  *   3 vs 4 (Legality vs Effectiveness).
  *   4 vs 7 (Success vs Responsibility).

  *Knockout:* Ex Ante Verifiability (kills Intention and vague Last Resort).

  *Scorecard:* Just War Theory (fails verifiability), Realism (fails moral threshold), Liberal Internationalism (fails empirical prospect).

