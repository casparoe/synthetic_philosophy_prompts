answer: |-
  Here is the specification list for a theory of humanitarian intervention and regime change, constrained by your requirement for an *ex ante* institutional decision rule.

  ### The Specification Table

  | id | requirement | motivating case or consideration | verdict | status | conflicts |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Threshold of Harm:** The theory must define a severity threshold for violence that is objective enough to be verified by third parties before action begins. | **Rwanda 1994:** Failure to act despite clear evidence of systematic slaughter; requires a trigger that doesn't rely on "certainty" of outcome. | Genuine | Settled | None |
  | **2** | **Ex Ante Verifiability:** All criteria for authorization must be assessable using public information available *before* the intervention, without access to leaders' private mental states. | **Iraq 2003:** Claims about WMDs and intentions were unverifiable ex ante; prevents hindsight bias in theory construction. | Genuine | Settled | 5, 6 |
  | **3** | **Authority Legitimacy:** The theory must specify whether authorization requires UN Security Council approval, regional body approval, or neither, and account for veto paralysis. | **Kosovo 1999:** Intervention occurred without UNSC resolution due to threatened veto; tests legality vs. legitimacy. | Negotiable | Contested | 4, 8 |
  | **4** | **Empirical Prospect of Success:** The theory must align its "reasonable prospect" criterion with historical base rates for foreign-imposed regime change (FIRC) and state-building. | **Iraq 2003 / Libya 2011:** High failure rate of FIRC to produce stable democracy (Downes & Montgomery data); challenges optimistic liberal interventionism. | Genuine | Contested | 3, 7 |
  | **5** | **Right Intention:** The theory must require that the primary motive of the intervener be humanitarian rather than strategic or economic. | **Libya 2011:** Accusations that regime change overshadowed civilian protection; standard Just War criterion. | Camp-Prejudice | Contested | 2 |
  | **6** | **Last Resort:** The theory must define a time-bound limit on diplomatic exhaustion that does not amount to indefinite delay in the face of atrocities. | **Syria 2013:** Endless calls for diplomacy while chemical weapons were used; tests the "delay vs. diligence" tension. | Negotiable | Contested | 2, 4 |
  | **7** | **Post-Intervention Responsibility:** The theory must assign liability for the political order after the regime falls (the "you break it, you buy it" constraint). | **Libya 2011:** Intervention succeeded militarily but state collapsed afterwards; questions the moral cost of partial intervention. | Genuine | Contested | 4 |
  | **8** | **Consistency Constraint:** The theory must explain or mitigate the selectivity problem (why intervene here but not in worse crises elsewhere). | **Rwanda 1994 vs. Kosovo 1999:** Disparity in response based on strategic interest rather than harm severity; threatens moral credibility. | Genuine | Settled | 3, 4 |

  ### Unsatisfiable Sets (The Trade-Offs)

  There are three pairs of requirements in the table that cannot be jointly satisfied under current international conditions. A theory must explicitly choose which horn of the dilemma to accept; it cannot solve them.

  1.  **The Veto Paradox (ID 3 vs. ID 4 & 8):** You cannot simultaneously require **UN Security Council Authorization** (ID 3) and guarantee **Effectiveness/Consistency** (ID 4, 8). As Kosovo and Syria demonstrate, the veto power allows perpetrators or their allies to block intervention legally. If you insist on strict legality (UNSC), you render the rule useless in the exact cases where it is most needed (great power spheres of influence). If you allow regional bodies to bypass the UNSC (as NATO did), you violate the positive international law framework. A viable *ex ante* rule must choose between *legality* (UNSC only) and *efficacy* (regional coalitions), acknowledging the cost of that choice.
  2.  **The Knowledge Problem (ID 2 vs. ID 5):** You cannot operationalize **Right Intention** (ID 5) within an **Ex Ante Verifiability** constraint (ID 2). Intentions are internal states; they are only visible through actions, which are the very thing being judged. Requiring a bureaucratic body to judge "true motive" before acting invites the kind of intelligence failures seen in Iraq 2003 (where motives were conflated with flawed intelligence). For an institutional rule, "Right Intention" is a camp-prejudice of Just War theorists; it cannot be coded into a decision procedure without mind-reading.
  3.  **The Stabilization Dilemma (ID 4 vs. ID 7):** Empirical data on Foreign Imposed Regime Change (FIRC) suggests a high probability of state collapse or civil war post-intervention (ID 4). However, the **Post-Intervention Responsibility** (ID 7) demands that interveners stay to build peace. Satisfying ID 7 requires a commitment level that most democracies are politically incapable of sustaining (the "nation-building" aversion), while satisfying ID 4 (honest assessment of success rates) often suggests *not* intervening in regime change scenarios at all. You cannot have a rule that mandates intervention for atrocities but also honestly admits that removing the regime usually leads to chaos you won't fix.

  ### The Knockout Requirement

  The single requirement that knocks out the most candidates is **ID 2: Ex Ante Verifiability**.

  This is not a substantive moral claim, but a procedural constraint derived from your prompt's demand for a *standing decision rule*. This requirement eliminates the majority of traditional Just War Theory accounts and many Liberal Internationalist arguments.
  *   **It kills "Right Intention":** As noted above, no institutional rule can verify intention beforehand. Any theory making this a necessary condition fails the spec.
  *   **It kills "Last Resort" (Traditional):** If "Last Resort" implies trying *everything* until violence is imminent, it fails the verifiability test (when is "everything" done?). It must be replaced by a time-bound or trigger-based metric.
  *   **It kills "Reasonable Prospect" (Optimistic):** If the theory relies on optimistic projections of democratization (e.g., "they will welcome us as liberators") rather than base-rate empirical data, it fails the verifiability test because those projections are not falsifiable ex ante.

  By enforcing ID 2, you force the theory to move from *virtue ethics* (what kind of agent intervenes?) to *institutional design* (what rule minimizes error costs?). This knocks out any theory that relies on the moral character of the interveners rather than the observable constraints of the situation.

  ### Minimal Scorecard

  *   **Traditional Just War Theory:** Fails **ID 2** and **ID 5**. It relies heavily on *Right Intention* and nuanced *Last Resort* judgments that cannot be codified into an *ex ante* rule for a regional body. It treats intervention as a moral exception rather than a policy procedure.
  *   **Liberal Internationalism (R2P variant):** Fails **ID 4**. It often assumes that removing a bad regime creates a tabula rasa for democracy, contradicting empirical FIRC data (Downes, Montgomery, Pickering) which shows high failure rates for stability. It also struggles with **ID 3** (often wants UNSC approval but intervenes when blocked).
  *   **Realist / Restraint Models:** Pass **ID 2** and **ID 4**, but often fail **ID 1** and **ID 8**. They correctly identify the epistemic limits and empirical failure rates, but their threshold for harm is often so high (direct strategic threat only) that it renders humanitarian intervention impossible, violating the consensus that genocide *must* trigger a response.

  **Consensus Note:** There is broad agreement (Settled) that mass atrocity is a sufficient *cause* for concern (ID 1) and that selectivity is a problem (ID 8). There is deep disagreement (Contested) on whether sovereignty is conditional on human rights performance, whether UNSC authorization is mandatory for legitimacy, and whether the empirical record of FIRC precludes regime change as a permissible goal. Do not present the empirical failure rates of regime change as "settled" in the normative sense; many theorists argue the *moral necessity* overrides the *empirical risk*, even if they admit the risk exists.
