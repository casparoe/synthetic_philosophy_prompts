      *   *Justification:* While relativistic kill vehicles are cheap, the existence of ancient biospheres (like Earth) suggests striking is not universally dominant or cost-free.
  4.  **$P(\text{restraint fails} \mid \text{asymmetry}) = 0.60$**
      *   *Justification:* Even if striking is advantageous, long-term equilibria or normative constraints could prevent universal pre-emption, as evidenced by our own survival.
  5.  **$P(\text{chains of suspicion} \mid \text{restraint fails}) = 0.70$**
      *   *Justification:* Light-speed delays and unverifiable intentions make trust difficult, though not necessarily impossible given sufficient time or delegation.
  6.  **$P(\text{rivals explain silence}) = 0.60$**
      *   *Justification:* It is more probable that silence stems from rarity, short windows, or non-fear-based quietism than from a successful, universal galactic cull.

