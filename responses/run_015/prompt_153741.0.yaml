  I'm preparing notes for a graduate seminar on whether the Enlightenment should be read primarily as an emancipatory project or as an apparatus of domination, and I've become dissatisfied with the usual broad-brush answers—whether the Frankfurt School's diagnosis of instrumental reason or the more celebratory accounts of scientific progress. Instead, I'm trying to work out a granular principle that distinguishes specific Enlightenment practices I consider genuinely liberatory from ones I see as subtly coercive, but my judgments feel inconsistent and I want help articulating or correcting the underlying rule.

  Here are my verdicts on five concrete cases. First, the abolitionist appeals in the 1790s that invoked universal natural rights to argue that chattel slavery was incompatible with reason—this strikes me as progress-promoting, because it used universalist language to expand moral standing. Second, the contemporaneous "civilizing mission" rhetoric that used the very same universalist language to justify imposing European legal and religious norms on colonized societies—this strikes me as domination, even though structurally it also applies reason across cultural boundaries. Third, Beccaria's arguments for penal reform, which replaced arbitrary sovereign punishment with predictable, proportionate rules—progress-promoting, I think, despite the fact that such rationalization also expanded the state's disciplinary reach. Fourth, the development of state census and statistical classification systems in the late eighteenth and early nineteenth centuries—domination-promoting, in my view, because they made populations administratively legible for extraction and control, even though they also enabled democratic representation. Fifth, the Encyclopédie's project of systematizing craft and technical knowledge for a broad literate public—progress-promoting, because it distributed cognitive tools downward rather than concentrating them. My tentative principle is that an Enlightenment practice is liberatory when it institutionalizes reflexive revision—when those affected can, in principle, contest the categories or rules applied to them—and dominating when it applies a fixed rational framework that treats people as instances of a non-revisable type. But this seems strained: both the abolitionist and the civilizing-mission cases involve outsiders contesting local norms using universal reason, yet I judge them oppositely. I need a principle, or a small family of candidates, that delivers all five verdicts if possible, predicts what I should say about a case I haven't listed—say, the