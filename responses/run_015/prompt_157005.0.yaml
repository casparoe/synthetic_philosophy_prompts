      *   *Claim 3 (Tradition):* "Always done this way" isn't a trump card (slavery, coverture existed), but neither is it noise (evolved wisdom).
      *   *Claim 4 (No Civil Marriage):* A world without civil marriage would shift burdens to private contract and community enforcement, likely disadvantaging the poor and children.
