answer: |-
  # JOINT STATEMENT ON THE NATURE AND FUTURE OF CIVIL MARRIAGE
  **Parties:** The Conjugal View (CV) | The Revisionist View (RV)
  **Date:** October 2023
  **Status:** Adversarial Collaboration Draft

  ## 1. SUBSTANTIVE AGREED CLAIMS
  *We agree on the following empirical, historical, and structural claims. These are not platitudes; they are the shared ground upon which our disagreement rests.*

  1.  **Historical Function:** For most of recorded history, marriage functioned primarily as a property, kinship, and political alliance mechanism between families, rather than a vehicle for individual romantic fulfillment. The shift toward "companionate marriage" is a modern development (last ~200 years) accepted by both sides as the current cultural baseline.
  2.  **Separability of Legal Incidents:** The "legal bundle" of marriage (tax filing, inheritance, hospital visitation, immigration sponsorship, next-of-kin status) is technically separable from the social/religious meaning of marriage. It is possible, in principle, to distribute these rights via contract or alternative legal statuses without using the word "marriage."
  3.  **The "Tradition" Argument:** Neither side accepts "we have always done it this way" as a sufficient standalone argument. Both acknowledge that historical marriage norms included elements now rejected (e.g., coverture, lack of divorce, racial restrictions). However, both agree that long-standing institutions often encode evolved social wisdom that should not be discarded without evidence of harm or benefit.
  4.  **The No-Marriage Baseline:** In a society with *no* civil marriage status, reliance would shift to private contract and community enforcement. Both sides agree this would likely disadvantage lower-income populations (who lack access to legal counsel for contracts) and children (whose claims on parental resources would be harder to enforce).
  5.  **Child Welfare:** Stable, long-term caregiving environments are empirically correlated with better outcomes for children. Both sides agree the state has a legitimate interest in promoting environments where children are reliably cared for, though we disagree on whether marriage is the *only* or *best* proxy for this.
  6.  **Normative Power:** Law is not merely coercive; it is expressive. Changing the legal definition of marriage sends a signal about what the state values. Both sides agree that redefining marriage will have downstream cultural effects, though we disagree on the direction and magnitude of those effects.

  ## 2. DISAGREEMENTS TABLE
  *We locate our precise points of divergence below. We specify whether we believe the dispute is about the nature of reality (World) or the usage of language/concepts (Words).*

  | What's at Stake | Conjugal View Wording | Revisionist View Wording | Verdict: Word or World? |
  | :--- | :--- | :--- | :--- |
  | **Ontology of Marriage** | Marriage is a **pre-political reality** rooted in bodily complementarity and procreative potential. The state *recognizes* it; it does not *create* it. | Marriage is a **social artifact** created to solve coordination problems around care, sex, and property. The state *shapes* it to serve public goods. | **World.** This is a metaphysical disagreement about whether social kinds have natures independent of human intention. |
  | **The "For" Question** | Asking "What is marriage *for*?" asks for its **intrinsic purpose** (the good internal to the union itself, i.e., comprehensive union). | Asking "What is marriage *for*?" asks for its **social function** (the external goods it produces, i.e., stability, equity, care). | **Word/World Hybrid.** A verbal dispute about the definition of "purpose," rooted in a worldly dispute about whether institutions have telos. |
  | **State Authority** | The state exceeds its legitimate authority if it redefines marriage, because it claims power over a reality it did not make. This is a category error. | The state exceeds its legitimate authority if it *refuses* to update marriage, because it fails to serve justice and equal protection under law. | **World.** A disagreement about the limits of state power regarding pre-political institutions vs. civil rights. |
  | **Change Mechanism** | Expanding marriage to same-sex couples is a **corruption** (severing the link between marriage and procreative biology). | Expanding marriage to same-sex couples is a **repair** (aligning the institution with its actual function of stabilizing committed care). | **World.** A disagreement about the causal impact of the change on the institution's integrity. |
  | **The Label** | Calling same-sex unions "marriage" is a **falsehood** that degrades the meaning of the word for everyone. | Calling same-sex unions "marriage" is a **correction** that expands the word's coverage to match moral reality. | **Word.** Primarily a dispute about semantic reference and who holds the authority to name social kinds. |

  ## 3. CRUXES WITH TEETH
  *We identify four specific areas where evidence or logical consistency could force an update. We state our predictions clearly.*

  ### Crux 1: The Double-Entry Problem (Disaggregation)
  **Proposal:** The state exits the "marriage" business entirely. It issues "Civil Caretaking Contracts" to any dyad (or small group) meeting dependency criteria. The term "Marriage" is returned exclusively to religious and private communities.
  *   **Conjugal Prediction:** This will accelerate the fragmentation of family life. By severing the legal status from the normative ideal of comprehensive union, it signals that marriage is merely a contract. We predict a measurable decline in marital stability and an increase in children born into unstable arrangements within 20 years.
  *   **Revisionist Prediction:** This will increase fairness without harming stability. By decoupling legal rights from a specific moral definition, it protects religious liberty and ensures care for all dependents. We predict no significant change in stability metrics for existing marriages, but a reduction in legal vulnerability for non-married caretakers.
  *   **Shared Test:** Look at jurisdictions that have introduced robust civil union frameworks alongside marriage. Does the existence of a "separate but equal" track degrade the stability of the "marriage" track, or does it relieve pressure?

  ### Crux 2: The Boundary Cases (The Principle of the Stop)
  **Cases:** Elderly siblings sharing finances/care; Polyamorous households raising children; Five-year renewable term marriages.
  *   **The Argument Form:** We agree that "If you allow X, you must allow Y" is invalid *unless* the principle justifying X also justifies Y. The dispute is about the principle.
  *   **Conjugal Principle:** The stopping point is **biological complementarity and comprehensive union**.
      *   *Prediction:* If marriage is redefined by commitment alone (RV), there is no *principled* state interest in limiting it to two people or permanent terms. We expect legal pressure for polyamory to succeed in court within 15 years if RV logic holds.
  *   **Revisionist Principle:** The stopping point is **optimal stability for dependents and administrative feasibility**.
      *   *Prediction:* The state can limit marriage to dyads based on empirical evidence that dyads are more stable than triads, without invoking biology. We expect polyamory claims to fail not on principle, but on evidence of increased complexity/instability for children.
  *   **Shared Test:** Court rulings on polyamorous custody or immigration. Do courts cite "tradition/nature" (CV win) or "best interest of the child/stability metrics" (RV win)?

  ### Crux 3: The Conscription Worry (State Power)
  **Scenario:** A future state, facing demographic collapse, redefines marriage incentives to heavily favor married couples under 35 with children, removing tax benefits for childless or older marriages.
  *   **Conjugal View:** This is the logical endpoint of the Revisionist view. If the state defines marriage by its function, it can change the function to suit state needs. This is a **reductio ad absurdum** of RV.
  *   **Revisionist View:** This is blocked by **public reason constraints** (liberty, neutrality, anti-discrimination), not by the "nature" of marriage. The state cannot instrumentalize citizens this way regardless of how marriage is defined.
  *   **Shared Test:** Legislative attempts to tie civil benefits strictly to procreation. If RV is correct, such laws should be struck down on liberty/equality grounds without needing to reference the "nature of marriage." If CV is correct, such laws will be argued as *consistent* with the new functionalist definition.

  ### Crux 4: The Natural Experiment (The Nordic Model)
  **Context:** High-income countries where cohabitation is the default, marriage is selective/late, and state support for children is high regardless of marital status (e.g., Sweden, Norway).
  *   **Conjugal Update Condition:** We will update against our view if, over two generations, child well-being metrics (education, mental health, crime) in these nations **equal or exceed** those in high-marriage nations, controlling for income. We specifically look for the dissolution of the "marriage premium."
  *   **Revisionist Update Condition:** We will update against our view if these nations develop a **class divide** where marriage becomes a luxury good for the elite (providing stability) while the poor rely on fragile cohabitation, leading to entrenched intergenerational inequality.
  *   **Shared Test:** Longitudinal data on child outcomes by family structure in Scandinavia vs. USA/UK.
      *   *CV expects:* Convergence of outcomes (marriage doesn't matter).
      *   *RV expects:* Divergence of outcomes based on class (marriage becomes a status marker).

  ## 4. META-COMMENTARY & CONFIDENCE ASSESSMENT

  **Confidence in Substantive Claims:**
  I assign **85% confidence** to the Agreed Claims section. These are historically and legally robust enough that a knowledgeable proponent of either side should be able to sign them without feeling they have surrendered their core position. The historical claims about property/kinship and the separability of the legal bundle are difficult to dispute factually.

  **Least Sure Point:**
  The point I am least sure of is in **Crux 4 (The Natural Experiment)**. Specifically, the isolation of variables. It is exceptionally difficult to determine whether child outcomes in Nordic countries are the result of the *family structure* (cohabitation vs. marriage) or the *welfare state* (buffering the risks of instability). A smart critic on either side could argue that the welfare state masks the effects CV worries about, or creates the stability RV praises. Disentangling "marriage effect" from "state support effect" is the weakest link in this entire document.

  **Talking Past Each Other vs. Real Disagreement:**
  I estimate that **40%** of the perceived heat in this debate is "talking past each other" (verbal disputes about the label "marriage" and the definition of "discrimination" or "freedom").
  However, **60%** is a genuine, residual "World" disagreement. This remainder is not solvable by semantics. It rests on the ontological question: *Do human institutions have natures that constrain what we can meaningfully do with them?*
  *   If you believe social kinds are like natural kinds (discovered), the Conjugal View wins.
  *   If you believe social kinds are like tools (invented), the Revisionist View wins.

  This metaphysical split cannot be steelmanned away. It can only be clarified. This document attempts to ensure that when the two sides fight, they are fighting over that metaphysical crux, rather than over history, law, or child welfare data where they actually agree more than they think.
