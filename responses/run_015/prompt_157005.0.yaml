  5.  **Drafting Section 3: Cruxes:**
      *   *Crux 1: Double-Entry (Disaggregation).*
          *   Proposal: Civil Unions for all caretaking dyads, "Marriage" for religious/community use.
          *   CV Prediction: Undermines the norm, leads to further fragmentation.
          *   RV Prediction: Solves fairness, preserves religious liberty, stabilizes care.
      *   *Crux 2: Boundary Cases (The Slope).*
          *   Cases: Siblings, Polyamory, Term-limits.
          *   CV: No stopping point without the biological/comprehensive union anchor.
          *   RV: Stopping point is "optimal stability for dependents." Polyamory fails stability test (empirical claim).
          *   Form of Argument: Not "slippery slope" but "loss of principle."
      *   *Crux 3: Conscription (State Power).*
          *   Scenario: Pronatalist state incentivizing only young parents.
          *   CV: This proves marriage shouldn't be state-defined.
          *   RV: Public reason constraints (neutrality/liberty) block this, not "nature."
      *   *Crux 4: Natural Experiment (Nordic Model).*
          *   Context: High cohabitation, low marriage, high state support.
          *   CV Update: If child outcomes worsen or commitment norms dissolve significantly over 2 generations.
          *   RV Update: If inequality spikes because marriage becomes a luxury good for the elite while the poor rely on fragile cohabitation.

  6.  **Drafting Section 4: Meta-Commentary (Confidence & Analysis):**
      *   Need to be honest about the AI's position (simulating the document).
      *   Confidence: High on the structure, medium on the specific predictions.
      *   Least Sure: The "Natural Experiment" predictions are hard to isolate.
      *   Talking Past Each Other: Estimate percentage. Likely high on semantics (what "marriage" refers to), low on values (both want flourishing).

  7.  **Review and Refine:**
      *   *Check Tone:* Is it neutral? Yes. Is it precise? Yes.
      *   *Check Constraints:* No citations? Yes. Numbered claims? Yes. Table included? Yes. Cruxes specific? Yes.
      *   *Self-Correction on "Talking Past Each Other":* The prompt asks me to estimate how much survives good-faith steelmanning. I need to be careful not to dismiss the disagreement as merely verbal. The ontological difference is real.
      *   *Refining the "Verdict" column:* Ensure I distinguish between verbal disputes (definitions) and worldly disputes (consequences of policy).
      *   *Refining the Cruxes:* Make sure the predictions are falsifiable.

  8.  **Final Polish:** Check against the specific phrasing requests (e.g., "Conjugal View," "Revisionist View"). Ensure the "Confidence" section feels authentic to the rationalist style requested.

  *(Self-Correction during drafting)*: I initially thought about putting "love" in the agreed claims. But the Conjugal view might reject love as the *defining* feature. Better to focus on "commitment" and "stability."
  *(Self-Correction on Crux 2)*: The prompt asks to deal with the *form* of the "slippery slope" argument. I need to explicitly state that "you can't stop there" is invalid unless a principle is lost. Both sides need to agree on what principle is at risk.

