  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to avoid "marriage is important." Need specific historical/legal/sociological claims.
      *   *Claim 1 (History):* Marriage predates the modern state and has always involved property/kinship, not just romance. Both agree romance is a recent addition.
