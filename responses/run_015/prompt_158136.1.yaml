prompt: |-
  I'm prepping a podcast ep with a philospher who just released The Broadcast Gap — she claims global workspace theory nails access consciousness but that its 'broadcast' is phenomenally hollow, and that what we call phenomenal consciousness is really just access with a tight feedback loop that fakes immediacy. I want a sequence of interview questions that don't let her retreat to Block's old distict. Start by forcing her to say whether she's making a new empirical predicition about split-brain cases or just re-framing concepts. Then ask what kind of evidence could actually convince her phenomenal consciousness isn't real and seperate from access. End with a follow-up about automatoin: if an artificial workspace had that same loop but zero biology, would she grant it phenomenal states or is she smuggling in substrate? Make them sharp, not generic "what drew you to this" stuff.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Guest:** A philosopher who just released a book called *The Broadcast Gap*.
      *   **Core Thesis:** Global Workspace Theory (GWT) gets "access consciousness" right, but the "broadcast" mechanism is phenomenally hollow. Phenomenal consciousness (P-con) is actually just access consciousness (A-con) with a tight feedback loop that creates an illusion of immediacy/qualia. This sounds like an illusionist or deflationary view of P-con, but specifically tied to GWT mechanics.
      *   **Goal:** A sequence of interview questions for a podcast.
      *   **Constraint 1:** Do not let her retreat to Ned Block's original A-con/P-con distinction (i.e., don't let her just say "they are conceptually distinct" without empirical bite).
      *   **Constraint 2:** Start by forcing a choice: New empirical prediction (specifically split-brain) OR just conceptual reframing?
      *   **Constraint 3:** Ask what evidence could convince her P-con is real and separate (falsifiability).
      *   **Constraint 4:** End with a follow-up on AI/Automation: If an artificial workspace has the loop but no biology, does it have P-con? Is she smuggling in substrate/biological chauvinism?
      *   **Tone:** Sharp, specific, not generic "what drew you to this" fluff.

  2.  **Deconstruct the Guest's Position:**
      *   She accepts GWT for *access*.
      *   She denies GWT's broadcast *is* phenomenality.
      *   She claims phenomenality is an *illusion* generated by a feedback loop within access.
      *   *Implication:* This is very close to Keith Frankish's illusionism or Daniel Dennett's "Quining Qualia," but framed through GWT mechanics (likely Dehaene-inspired but modified).
      *   *Vulnerability:* If P-con is just a specific functional loop of A-con, then the distinction collapses functionally. If it's an illusion, why call it "phenomenal consciousness" at all? Why not just call it "access with feedback"? The user wants to press on whether this is a substantive claim or just wordplay.

  3.  **Drafting - Question 1: The Empirical vs. Conceptual Hook:**
      *   *Goal:* Force her off the fence of Block's distinction. Block often saves his distinction by saying it's conceptual. She needs to commit to whether her "feedback loop" theory changes how we look at data.
      *   *Specific Context:* Split-brain cases are the classic testing ground for unity of consciousness and access.
      *   *Drafting:* "You say the broadcast is hollow. Okay. Does this mean split-brain patients have two feedback loops? If I cut the corpus callosum, do I kill the 'fake' phenomenality in one hemisphere? Tell me: Is *The Broadcast Gap* making a new empirical prediction about what happens in split-brain cases, or are you just re-labeling Ned Block's distinction with better mechanics?"
      *   *Refining:* Make it sharper. Accuse her of potentially just doing "verbal engineering."

  4.  **Drafting - Question 2: Falsifiability/The "Realness" of P-Con:**
      *   *Goal:* What would prove her wrong? If P-con is an illusion created by a loop, what evidence would show it's *not* an illusion?
      *   *Challenge:* Illusionists often make their position hard to falsify because any report of experience is treated as "access."
      *   *Drafting:* "If P-con is just access with a loop, what evidence would convince you it's separate? If a patient reports a qualia that doesn't match access, would you believe them?"
      *   *Refining:* Push harder. If she says "nothing could convince me," she's a dogmatist. If she says "X," then X must be distinct from access. Force the contradiction. "If your theory is true, phenomenal consciousness is a user-illusion. So, what specific data point would force you to admit the user-illusion is actually a real entity? And if you say 'nothing,' aren't you just defining P-con out of existence rather than explaining it?"

  5.  **Drafting - Question 3: The AI/Substrate Follow-up:**
      *   *Goal:* Test for biological chauvinism vs. functionalism. If it's just a loop, silicon should work. If she says no, why?
      *   *Context:* GWT is usually functionalist. If she adds a "tight feedback loop" as the secret sauce, does that work in code?
      *   *Drafting:* "If we build an AI with GWT and the feedback loop, does it feel? If yes, you're a functionalist. If no, are you smuggling in biology?"
      *   *Refining:* Connect it back to the "hollow broadcast." If the broadcast is hollow, the loop creates the "glow." Does silicon glow? "Let's talk about automation. If I build a silicon-based Global Workspace with that exact tight feedback loop you describe, but zero biology, does it have phenomenal states? If you say no, are you smuggling in a biological substrate requirement? If you say yes, then why does it matter that the broadcast is 'hollow'—isn't the loop enough to generate the 'ghost' regardless of the machine?"

  6.  **Review and Polish:**
      *   Check against constraints:
          *   Start with empirical/conceptual (Split-brain)? Yes.
          *   End with AI/Substrate? Yes.
          *   Falsifiability in the middle? Yes.
          *   Avoid Block retreat? Yes, by framing Block's distinction as potentially merely conceptual.
          *   Tone sharp? Yes, using phrases like "verbal engineering," "smuggling in," "dogmatist."

  7.  **Final Polish (Self-Correction during drafting):**
      *   Make sure the transition between Q1 and Q2 flows. Q1 establishes the stakes (real science vs. philosophy). Q2 tests the truth conditions. Q3 tests the implications (AI).
      *   Ensure the "Broadcast Gap" title is referenced to show preparation.
      *   *Correction on Q1:* Make sure to explicitly mention Block so she knows I know the literature and won't accept a standard deflection.
      *   *Correction on Q3:* Ensure the link between the "loop" and "phenomenality" is the crux. If the loop *is* the phenomenality (even if illusory), then functionalism should hold.

  8.  **Final Output Generation** (Proceed to generate the response based on these thoughts).
answer: |-
  Here is a sequence of three sharp, interconnected questions designed to pin down her position without allowing standard philosophical deflections.

  **1. The Empirical Commitment (Split-Brain & Block)**
  "Your core claim in *The Broadcast Gap* is that the Global Workspace's 'broadcast' mechanism is phenomenally hollow, and that what we feel as phenomenality is actually just access consciousness running a tight feedback loop. Ned Block famously separated Access and Phenomenal consciousness to protect the latter from being reduced to the former. I need to know if you are actually solving that problem or just renaming it.

  Does your 'feedback loop' model make a novel empirical prediction about **split-brain patients**? If you sever the corpus callosum, do you sever the feedback loop required for the 'illusion' of phenomenality in one hemisphere? Or are you simply offering a conceptual reframing where 'phenomenal consciousness' is just a label we slap on high-bandwidth access? I need you to commit: Is this a new hypothesis about neural architecture, or is it verbal engineering?"

  **2. The Falsifiability Trap**
  "Let's assume you take the empirical route. If your theory is correct, phenomenal consciousness is effectively a user-illusion generated by specific access dynamics. That makes you an illusionist about qualia.

  So, what specific piece of evidence would convince you that you are wrong? If a subject reported a phenomenal experience that was demonstrably *decoupled* from any access or feedback loop—say, a qualia that persists even when the workspace is globally inhibited—would you accept that as proof of distinct phenomenal consciousness? Or is your position unfalsifiable by design, where any report of 'pure experience' is automatically dismissed as just another form of access? If you can't name a condition under which phenomenal consciousness is real and separate, aren't you just defining it out of existence rather than explaining it?"

  **3. The Substrate Smuggle (AI Follow-up)**
  "I want to follow that thread into automation. If phenomenal consciousness is just access consciousness with a specific tight feedback loop, that sounds like a functionalist definition.

  If I build an artificial Global Workspace in silicon that replicates that exact feedback loop, but contains zero biology, do you grant it phenomenal states? If you say **yes**, then the 'hollowness' of the biological broadcast doesn't matter—the function creates the ghost. But if you say **no**, then you aren't relying on the loop at all; you're smuggling in a biological substrate requirement. Which is it? Does the loop generate the 'feel' regardless of the hardware, or is there something about the biology that your theory hasn't accounted for?"
