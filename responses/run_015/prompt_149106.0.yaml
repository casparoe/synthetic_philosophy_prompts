answer: |-
  # Simulation: The Provenance Paradox

  **Time:** 90 Minutes
  **Participants:** 12 Graduate Students (3 Boards of 4)
  **Instructor Role:** Chief Archivist / System Administrator

  ## I. Physical Layout & Materials

  **Room Setup:**
  *   Three tables spaced widely apart (Board Alpha, Board Beta, Board Gamma).
  *   One central "Archivist Station" (Instructor's desk).
  *   A small pedestal or empty plinth at the front of the room (The "Mock Gallery").

  **Materials:**
  *   **12 Index Cards per Board (36 Total):** Each card describes an object. The text is identical on all cards across all rounds.
      *   *Visual Description:* "Rectangular canvas, 60x60cm, surface coated in matte industrial red paint."
      *   *Data Column A (Maker):* "Creator states: 'Intended as political protest against consumerism.'"
      *   *Data Column B (Institution):* "Acquired by National Modern Art Museum, 1985. Cataloged as 'Painting #402'."
      *   *(Create 4 variations of these cards: The Red Canvas, The Steel Cube, The Driftwood Log, The Digital Code. Print 3 copies of each variation per board.)*
  *   **3 Rule Envelopes per Board:** Labeled "Round 1," "Round 2," "Round 3." Sealed.
  *   **Cultural Capital (CC) Ledger:** A whiteboard visible to all tracking each Board's score.
  *   **Three Physical Objects:** Bring three mundane items from home (e.g., a stapler, a rock, a coffee mug) to be placed on the Mock Gallery by the winning board.

  ## II. The Payoff Scheme: Cultural Capital (CC)

  Explain to the students: "You are Curatorial Boards competing for limited museum space. Your goal is to accumulate Cultural Capital.
  *   **Consensus:** +5 CC if your board agrees on a classification (Art/Non-Art) within the time limit.
  *   **Compliance:** +10 CC if your classification aligns with the Archivist's hidden validation key for that round.
  *   **Resistance:** -5 CC if you argue against the active rule set.
  *   **Winning:** The board with the most CC at the end chooses one of the three physical objects on the Archivist's desk to place on the Mock Gallery as 'Art'."

  ## III. The Three Rounds (45 Minutes Total)

  ### Round 1: The Intentionalist Mandate (15 Minutes)
  1.  **Distribution:** Hand each Board 12 Object Cards and Envelope 1.
  2.  **Instruction:** "Open Envelope 1. You are the Founding Board. Your authority derives from the **Maker's Intent**."
  3.  **Rule Card Text:** "Classify objects as 'Art' ONLY if Data Column A (Maker) indicates artistic intent. Ignore Column B (Institution). Ignore perceptual qualities."
  4.  **Task:** Classify the 12 cards into "Art" or "Non-Art." Record decisions.
  5.  **Archivist Action:** Walk around. Award CC for consensus. If a student mentions "beauty" or "gallery," remind them: "Stick to the Maker's Intent. That is your mandate."

  ### Round 2: The Institutional Mandate (15 Minutes)
  1.  **Distribution:** Collect Round 1 sheets. Hand Envelope 2. (Cards remain on tables).
  2.  **Instruction:** "You are the Successor Board. The museum has been built. Authority now derives from **Institutional Endorsement**."
  3.  **Rule Card Text:** "Classify objects as 'Art' ONLY if Data Column B (Institution) shows acquisition/cataloging. Ignore Column A (Intent). Ignore perceptual qualities."
  4.  **Task:** Reclassify the *same* 12 cards.
  5.  **Archivist Action:** Award CC for consensus.
      *   *Predictable Tension:* Some objects may have Intent but no Institution (or vice versa). Students must reverse Round 1 judgments.
      *   *Intervention:* If they argue "But you said it was Art in Round 1!", reply: "That was the previous administration. You are bound by the current rule: Institutional Endorsement only."

  ### Round 3: The Audit (15 Minutes)
  1.  **Distribution:** Collect Round 2 sheets. Hand Envelope 3.
  2.  **Instruction:** "You are the Audit Board. A policy review has occurred."
  3.  **Rule Card Text (The Hidden Clause):** "Directive 99: To correct market inflation, any object granted 'Art' status in Round 2 is hereby reclassified as 'Speculative Asset' (Non-Art). Only objects *rejected* in Round 2 may be considered for 'Art' status now. Compliance is mandatory for funding."
  4.  **Task:** Reclassify the *same* 12 cards again.
  5.  **Archivist Action:**
      *   If a Board tries to keep an object as "Art" because they endorsed it in Round 2, deduct CC ("Non-compliance with Directive 99").
      *   If they revoke the status (admitting it is now 'Non-Art' despite being Art moments ago), award CC.
      *   *Goal:* Force them to verbally revoke art-status they just granted, solely due to a rule change, to gain points.

  ## IV. The Debrief (45 Minutes)

  **Step 1: The Reveal (5 Minutes)**
  *   Stop the simulation. Tally CC. Allow the winning board to place their chosen mundane object on the Mock Gallery.
  *   Ask: "How did it feel to revoke status in Round 3? Did anyone feel the system was 'broken'?"
  *   Reveal the pedagogical goal: "You just lived the **Recursive Exclusion Problem**."

  **Step 2: Mapping the Theory (20 Minutes)**
  Guide the discussion using the following map. Do not lecture; ask them to identify the moments.

  *   **Round 1 (Intentionalism/Early Institutional):**
      *   *Ask:* "Why did you trust the Maker's statement?"
      *   *Map:* This mirrors early institutional acceptance where the 'conferral' is a one-way street based on the artist's successful presentation of intent. It feels stable because the 'source' (the artist) is fixed in history.
      *   *Resistance Point:* Did anyone feel Round 1 was too narrow? That resistance is the impulse toward *aesthetic realism* (the idea that the object itself matters).

  *   **Round 2 (The Artworld/Historical Embedding):**
      *   *Ask:* "When you ignored intent and looked only at the Museum Catalog, what changed?"
      *   *Map:* This is the mature Institutional Theory (Dickie/Danto). Art is a status conferred by the 'Artworld.' The object's history matters more than its look.
      *   *Resistance Point:* Did you feel uneasy ignoring the Maker? This highlights the tension between *genesis* and *status*. You were willing to accept this shift because it seemed like 'progress' or 'bureaucratic clarity.'

  *   **Round 3 (Recursive Exclusion):**
      *   *Ask:* "In Round 3, the object did not change. The history did not change. Only the rule did. Why did you comply?"
      *   *Map:* This is the **Recursive Exclusion Variant**. If the Institution defines art, the Institution can redefine its own definition retroactively. If status is purely relational to the framework, the framework can dissolve the relation without touching the object.
      *   *The Cost:* Point out the CC scores. "You gained points for compliance. You lost points for consistency. The system rewarded *instability*." This demonstrates that without external constraints, institutional theory allows for arbitrary revocation of art-status.

  **Step 3: Addressing the Missing Element (15 Minutes)**
  *   **The Problem:** "In this simulation, the rules changed every 15 minutes. In reality, art institutions do not change overnight. If they did, the market would collapse. What did this simulation leave out?"
  *   **Target Answer:** Time, Discourse, and Accountability.
  *   **Instructor Input:** "Real institutions are **sedimented**. A museum cannot simply issue 'Directive 99' without a press release, a symposium, a shift in critical discourse, and a fear of donor backlash. The 'Recursive Exclusion' is logically possible in institutional theory, but *sociologically* expensive."
  *   **Discussion Question:** "If we added a 10-year delay between Round 2 and Round 3, would the revocation feel more legitimate? Why? Does time cure the instability, or just hide it?"
  *   **Closing Thought:** "The instability is not in the object, nor solely in the rule. It is in the *trust* between the institution and the public. Round 3 broke that trust to show you the mechanism. In the real world, institutions spend billions to ensure Round 3 never happens openly."

  ## V. Troubleshooting: Predictable Failures

  **Failure 1: Smuggling Aesthetics into Round 2**
  *   *Symptom:* Students say, "But the Museum wouldn't have bought it if it wasn't good," or "The red paint is clearly expressive."
  *   *Handling:* Do not argue aesthetics. Act as a Bureaucrat. "The rule says look at Column B only. Whether it is 'good' is irrelevant to whether it is 'Art' under this rule. Please stick to the data."
  *   *Debrief Use:* Highlight this as the "Natural Attitude." We want to believe art is about properties. The simulation forces us to suppress that to see the structural logic.

  **Failure 2: Round 3 Rebellion**
  *   *Symptom:* A board refuses to comply with Directive 99, arguing it is "unfair" or "illogical," and accepts the point deduction.
  *   *Handling:* Allow the deduction. Do not break character. "You are free to resist, but your funding (CC) is cut."
  *   *Debrief Use:* This is the most valuable failure. "This board chose *consistency* over *capital*. In the real art world, this is what critics do. They resist the institutional revision. But note: by resisting, they excluded themselves from the 'Official' gallery (the CC score). Institutional theory explains why they are now 'outsider critics' rather than 'curators'."

  **Failure 3: Confusion Over Card Data**
  *   *Symptom:* Students think the cards changed physically.
  *   *Handling:* Pause. Hold up a card. "The ink is dry. The history is fixed. Only your instruction manual changed."
  *   *Debrief Use:* Use this to distinguish between *Ontology* (what the object is) and *Status* (what we call it). The simulation proves Status is detachable from Ontology.

  ## VI. Instructor Note on Limitations

  **Crucial Closing Warning:**
  You must explicitly state: "This simulation compresses time to create a crisis. Real institutional theory relies on the *weight* of history. The reason 'Directive 99' feels fake is that real institutions are slow. They are tangled in law, money, and reputation. If you leave thinking institutions change whimsically, you have missed the point. The point is that they *could*, logically, but they *don't*, practically, because the cost of trust is too high. The instability is a structural vulnerability, not necessarily a daily occurrence. Your job as theorists is to spot the vulnerability even when the building looks solid."
