      *   Yes. -> **Moderate Rationalist**.
      *   No. -> **Strong Rationalist**.

  **Leaves & Awkward Commitments**
  1.  **Strong Rationalist:** Idealized conceivability entails possibility. *Awkward:* Requires assuming humans can achieve ideal conceivability.
  2.  **Moderate Rationalist:** Conceivability is defeasible evidence. *Awkward:* Must explain when evidence is outweighed without circularity.
  3.  **Kripkean:** Some truths are necessary but knowable only empirically. *Awkward:* Must explain why imagination fails specifically here.
  4.  **Type-B Physicalist:** Zombies are inconceivable. *Awkward:* Conflicts with strong intuition that zombies are coherent.
  5.  **Skeptic:** Imagination tells us nothing about modality. *Awkward:* Makes modal knowledge impossible.
  6.  **Localist:** Imagination works in math, not metaphysics. *Awkward:* No clear principle divides the domains.
  7.  **Unnamed:** (HP Possible, Zombie Unimaginable). *Awkward:* No known philosopher holds this mix.

  **Separation Issues**
  **Moderate vs. Strong Rationalist:** The tree separates them via Q6, but only if "possible for a human" is distinct from "idealized." A further case on *a priori* entailment would separate them better.
  **Skeptic vs. Localist:** Both deny HP possibility. They separate on Math (Q4), but a case involving moral necessity would test the localist's boundary further.

  **Scoring Key**
  | Pattern | Leaf |
  | :--- | :--- |
  | 1-Yes, 2-Yes, 6-No | Strong Rationalist |
  | 1-Yes, 2-Yes, 6-Yes | Moderate Rationalist |
  | 1-Yes, 2-Unimaginable | Type-B Physicalist |
  | 1-Impossible, 2-Yes | Kripkean |
  | 1-Impossible, 2-Impossible | Skeptic |
  | 1-Unimaginable, 4-Yes | Localist |
  | **Inconsistent** | **Mistake** |

  **Inconsistent Patterns:** If a reader says Zombies are possible (metaphysical) but HP distinctness is impossible (semantic), call this a **Mistake**. It indicates a failure of reflective equilibrium regarding necessity types. They should revisit Q1 and Q2.

  **Note**
  Questions 1 (Hesperus) and 2 (Zombies) do the heavy lifting by splitting Kripkeans from Physicalists and Rationalists. Question 4 (Agglomeration) could be dropped without merging leaves, as its result is largely predictable across positions.
