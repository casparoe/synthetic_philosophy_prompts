  ### 2. Part-by-Part Assessment

  #### Part 1 (Slack Variant)
  **Score: 5 / 8**

  *   **Right:** The expected utility calculation is correct (47.5 vs. 45). The student correctly identifies that a pure consequentialist framework yields the same *conclusion* (refusal) in both cases.
  *   **Wrong / Contradictory:** The student identifies the feature of the original case as "rescue leaves every single person worse off," then immediately claims "The slack variant lacks that feature." This is logically inconsistent. In the slack variant, passengers drop from 95% to 30% survival; they *are* worse off. The student likely meant "worse off to the point of certain death" or "physical impossibility," but did not write it.
      *   *Missing Premise:* A full-credit answer needs to distinguish between *absolute constraint* (certain death for all) and *probabilistic cost* (reduced chance for all). Hardin's original rhetorical force relies on the absolute constraint.
      *   *Rubric Note:* Deduct points if the student conflates "worse off" with "dead" without clarification. The prompt asks whether the variant *has* the feature; the student says "no" but describes a scenario where the feature (being worse off) is present.
  *   **Right for the Wrong Reason:** The student claims the original 150-vs-50 comparison is "just a special case of this expected-utility calculation." While mathematically defensible, Hardin's original argument is often framed as a *deontological* constraint on safety (the "security of the lifeboat") rather than a utilitarian calculus. If your course treated Hardin as a rule-utilitarian, this is fine; if you treated him as a rights-based exclusionist, this misses the normative shift.

  #### Part 2 (Convoy Variant)
  **Score: 6 / 9**

  *   **Right:** Correctly identifies the structure as a "collective action problem" / "tragedy of the commons." This shows good conceptual transfer from the lectures (assuming Hardin/ToC was covered).
  *   **Wrong:** The move from "prudence requires each captain to take no one" to "morality does not require what prudence forbids" is a massive, unsupported meta-ethical leap.
      *   *Missing Premise:* The student assumes moral obligation cannot exceed rational self-interest in coordination problems. A full-credit answer should acknowledge that while *individual rationality* dictates refusal, *moral rationality* (e.g., Kantian universalizability or Rule Utilitarianism) might dictate cooperation, creating a conflict Hardin's original single-boat case does not have.
  *   **Incomplete:** The prompt asks: "Is this the same problem as Hardin's?" The student answers "same shape as tragedy of the commons." While Hardin wrote about ToC, the Lifeboat essay is specifically about *overload*, not *coordination*. A distinction should be drawn: Hardin's original is a **single-agent constraint problem**; the Convoy is a **multi-agent assurance game**. The student blurs this distinction.
  *   **Rubric Note:** Look for whether students distinguish between *individual* rationality and *collective* optimality. Full credit requires noting that Hardin's conclusion (refusal) is only stable here if we assume other boats defect, whereas in Part 1, refusal is stable regardless of others.

  #### Part 3 (Enfranchisement Variant)
  **Score: 6 / 8**

  *   **Right:** Correctly identifies the "ratchet effect" (rescue leads to more rescue). The insight that this recreates Hardin's outcome ("everyone drowned") via political means rather than physical means is strong.
  *   **Missed Constraint:** The prompt explicitly asks: "Does the strength of that objection depend on the numbers involved?" The student answers implicitly ("take a number small enough that the rescued can never outvote"), but does not explicitly discuss the *dependency*.
      *   *Full-Credit Requirement:* Needs to state clearly that if the initial passenger block is large enough (e.g., >50% + 1 forever), the objection vanishes. If the intake rate is high, the objection strengthens. The student hints at this but doesn't make it a premise of the argument.
  *   **Right for the Wrong Reason:** The student calls this "the original case in disguise." It is not. The original case is physical capacity; this is *political* capacity. The outcome (drowning) is the same, but the mechanism (voting vs. buoyancy) is distinct. This distinction matters for policy implications (e.g., voting rights vs. immigration caps).

  ---

  ### 3. Uncertainties & Context Needed
  To finalize this grade and calibrate your rubric for the remaining 40 scripts, I need to know the following about your course context:

  1.  **Interpretation of Hardin:** Did you teach Hardin primarily as a **consequentialist** (maximizing survivors) or as a **sovereigntist** (defending the right of the boat owners to exclude)?
      *   *Why it matters:* In Part 1, the student treats Hardin as a consequentialist. If your seminar emphasized Hardin's argument about property rights/sovereignty ("It's our boat"), the student's focus on expected utility misses the core normative claim, and Part 1 should be marked lower (e.g., 3/8).
  2.  **Meta-Ethical Stance:** In your seminar, did you establish that "morality does not require what prudence forbids" (the claim made in Part 2)?
      *   *Why it matters:* If this principle was discussed and accepted in class, the student's Part 2 argument is stronger (bump to 7/9). If this was left open or contested, the student is asserting a controversial premise as fact, which warrants the deduction I suggested.
  3.  **Game Theory Terminology:** Did you explicitly cover "Tragedy of the Commons" vs. "Prisoner's Dilemma" vs. "Assurance Game"?
      *   *Why it matters:* The student calls it "Tragedy of the Commons." Technically, a ToC involves a shared resource being depleted by use, whereas this is a public good/coordination problem. If you were pedantic about these definitions in class, Part 2 needs a further deduction. If you used them loosely, the student's usage is acceptable.
  4.  **Part 3 Explicitness:** How strictly do you want to enforce the "answer every sub-question" rule?
      *   *Why it matters:* The student *does* address the numbers issue in their policy recommendation ("take a number small enough"), just not as a direct "Yes/No because..." statement. If your rubric rewards synthesis over checklist answering, this might be an 8/8. If you require explicit mapping to prompt questions, the 6/8 stands.

  **Recommendation for Rubric Calibration:**
  Before grading the next batch, decide if you are grading for **philosophical accuracy** (is the argument sound?) or **prompt compliance** (did they answer the specific questions asked?). This script is philosophically intuitive but prompt-sloppy. If you want to reward the intuition, bump the mark to 19/25. If you want to enforce rigorous argumentation standards, keep it at 17/25.
