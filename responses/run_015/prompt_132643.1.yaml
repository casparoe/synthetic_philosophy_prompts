answer: |-
  **Rowan:** You're going to hate this. I was up late grinding through the algebra for the handout, and I think the single-function model collapses under mirroring.

  **Iris:** You're smiling. That means you think you found a bug in REU, not a feature.

  **Rowan:** Not a bug, exactly. A constraint. Look. Set utility equal to dollars. Linear value. All the risk attitude lives in $r$. Take a gamble $X$ with outcomes $x_1$ through $x_n$. We define the REU as the lowest outcome plus the weighted sum of the increments, using the decumulative probabilities.

  **Iris:** I know the formula. $x_1 + \sum r(S_i)(x_i - x_{i-1})$.

  **Rowan:** Right. Now mirror it. Look at $-X$. If you work through the summation indices—and I've checked this three times—you get that $REU(X) + REU(-X)$ equals the sum over all increments of $[r(S_i) + r(1 - S_i) - 1]$ times $(x_i - x_{i-1})$.

  **Iris:** And if $r$ is risk-averse, $r(p)$ is less than $p$. So $r(p) + r(1-p)$ is less than one.

  **Rowan:** Exactly. The bracketed term is negative. The increments are positive. So the whole sum is negative. $REU(X) + REU(-X) < 0$.

  **Iris:** Which means if you prefer a sure thing to a gamble in the positive domain, you must prefer a sure loss to the mirrored gamble in the negative domain. You've locked symmetric risk attitudes.

  **Rowan:** Precisely. Take the numbers I'm putting on the board. If $r(0.5) = 0.4$, an agent prefers a sure fifty to a fifty-fifty shot at zero or a hundred. REU says that agent must also prefer a sure loss of fifty to a fifty-fifty shot at losing nothing or losing a hundred.

  **Iris:** But that's not how people behave. In losses, they chase risk. They take the gamble.

  **Rowan:** I know. That's the reflection effect. A single risk function can't swallow it. It forces risk aversion in gains and risk aversion in losses together. Or risk-seeking in both. But not mixed.

  **Iris:** So EU wins by default? Because EU with linear utility is risk-neutral everywhere, and EU with curved utility can at least model different attitudes if the utility function changes shape, though standard concavity usually implies aversion everywhere too. But REU claims to capture risk attitude separately from value. If it can't separate gains from losses, what's the point?

  **Rowan:** The point is fixing the independence violations in the gain domain. But you're right, this mirroring result is a problem. So here's the fix: two risk functions. $r_+$ for everything above the reference point, $r_-$ for everything below. We tune the weighting of the upper tail independently from the lower tail.

  **Iris:** Okay. Now hand me the headache you mentioned. What happens when the gamble straddles the reference point?

  **Rowan:** I knew you'd ask that. Take a twenty-five percent chance of minus sixty, twenty-five percent of minus ten, and fifty percent of plus forty. No outcome sits at zero. The increment from minus ten up to forty crosses the reference point.

  **Iris:** Do you weight that whole thirty-dollar increment with one curve or the other?

  **Rowan:** If I use one, which one? It's partly loss, partly gain. If I split it at zero—weight the lower sliver with $r_-$ and the upper sliver with $r_+$—then the evaluation depends on slicing the dollar increments at the status quo.

  **Iris:** And if you do that, haven't you just rebuilt cumulative prospect theory with a linear value function? You've got separate weighting functions for gains and losses and a reference point dependency.

  **Rowan:** Descriptively, maybe. But normatively, I'm still saying rational agents are permitted to have these risk attitudes. EU forbids the Allais preferences entirely. REU permits them.

  **Iris:** But REU was sold as a theory where risk is a attitude toward probability, not value. If you split the increment at zero, you're treating the dollars below zero differently from the dollars above zero. That's value curvature. You've got a kinked utility function at the origin, you're just calling it a split risk function.

  **Rowan:** It's not curvature. The utility is still linear within the domains. It's the weighting of the chance to move across those dollars that changes.

  **Iris:** Is it? If I'm willing to pay differently to avoid a loss than I am to secure a gain, that's usually modeled as loss aversion in the value function. You're moving it to the probability weighting, but the mathematical footprint is the same. You've saved the phenomenon by blurring the distinction between risk and value.

  **Rowan:** I don't think that's fair. The permissibility argument never required a single $r$. The mirroring result just shows that $r$'s real content is concern with the upper tail rather than risk aversion as ordinarily understood. Even in the pure-gains domain, $r_+$ does something no amount of curvature in $u$ can do. You can't get the independence violations with EU, period.

  **Iris:** I'll concede the independence violations. EU struggles there. But look at the cost. If you split the increment, your evaluation of a gamble depends on where the status quo sits relative to the outcomes.

  **Rowan:** That's the definition of reference dependence.

  **Iris:** It's more than that. Suppose I offer you the gamble today, status quo is zero. You split the increment. Now suppose I offer you the same gamble tomorrow, but you've already won ten dollars this morning. Your status quo shifts. The outcome that was minus ten is now neutral. The outcome that was plus forty is now fifty.

  **Rowan:** So the evaluation changes. That's expected.

  **Iris:** Is it? If rationality is about coherence, why should the rational permission to take a gamble depend on whether you won ten dollars this morning? Under EU, if utility is linear in wealth, that morning win doesn't change the risk attitude toward the gamble. Under your split-$r$ model, it changes which function applies to the increments. You've made rational permission contingent on arbitrary framing of the reference point.

  **Rowan:** The reference point isn't arbitrary. It's the status quo.

  **Iris:** But the status quo is fluid. If I can change what is rational for you to do merely by delaying the choice until your bank balance ticks over, I haven't found a normative theory. I've found a description of how people react to accounting.

  **Rowan:** So you think I should stick to the single function? Accept that rational agents can't exhibit the reflection effect?

  **Iris:** I think if you split the function to save the reflection effect, you admit that risk attitude isn't a stable normative parameter. It's context-sensitive. And if it's context-sensitive, why stop at gains and losses? Why not have different $r$'s for different types of goods, or different times?

  **Rowan:** Because then the theory loses its bite.

  **Iris:** Exactly. You started wanting to say EU is too restrictive. Now you've expanded REU so far it looks like it can fit any data set by adjusting the reference point and the split. That's not normative permission. That's curve fitting.

  **Rowan:** But the Allais cases aren't curve fitting. They're violations of independence.

  **Iris:** And maybe independence is too strong. But if your solution is to make the risk function depend on a reference point that shifts with the wind, you might have solved the algebra problem while losing the agent.

  **Rowan:** So what's the alternative? Tell the students REU can't handle losses?

  **Iris:** Tell them the mirroring argument shows that if you keep utility linear, you pay a price in symmetry. Then ask them whether symmetry is a requirement of rationality, or whether reference dependence is.

  **Rowan:** That's not an answer. That's a seminar discussion.

  **Iris:** *Points to the clock.* That's why you're teaching a seminar.

  **Rowan:** Fine. But I'm keeping the two-function fix in the handout.

  **Iris:** Keep it. Just make sure you write the straddling problem in big letters. If they don't argue about where to split the increment, I'll be disappointed.

  **Rowan:** They'll argue. I'll make sure of it.

  **Iris:** Good. Just don't let them think the algebra settles the philosophy.

  **Rowan:** When does it ever?

  **Iris:** Never. But it's nice when the math tells you exactly where the philosophy breaks.

  **Rowan:** *Erases the board.* Alright. Let's write the problem set.

  **Iris:** After coffee.

  **Rowan:** After coffee.
