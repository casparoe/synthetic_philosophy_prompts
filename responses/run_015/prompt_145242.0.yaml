answer: |-
  Here is the design for the 100-minute session.

  ### 1. The Shared Enterprise: The "Module Resource Pool"

  **The Choice:**
  The participants are the governing board of a **Shared Resource Pool** for the summer school. They have collectively contributed valuable items (laptops, specialized texts, noise-canceling headphones, research funds) into a common inventory. The goal is to maximize the group's academic success and well-being during the module.

  **Why this Enterprise:**
  1.  **Care Factor:** It involves tools necessary for their actual work here. They care about access and fairness.
  2.  **Rule-Defeating-Point Potential:** It is easy to write rules about "Return by 5 PM" or "Sign-out Required" that, if followed perfectly during a crisis (e.g., a laptop battery dies during a deadline), defeat the purpose of the pool (supporting success).
  3.  **Social Stakes:** The currency is trust and academic standing, not money.
  4.  **Auditability:** It naturally creates a log (who has what), mirroring the "procedural residue" you want to highlight.

  ### 2. Materials List

  *   **Room:** Chairs arranged in a circle initially, then cleared to create two distinct zones (Zone A: Compliance, Zone B: Departure).
  *   **The Code:** 4 sheets of flipchart paper taped together, markers.
  *   **The Log:** A whiteboard or large sheet labeled "EXCEPTIONS LOG" with columns: *Incident #, Person, Reason Given.*
  *   **Role Cards:** 5 cards marked "Visiting Scholar" (to be distributed secretly to 5 participants, mixed nationality). These students are "leaving the program in 48 hours."
  *   **Incident Cards:** 5 cards (see below).
  *   **Timer:** Visible countdown timer.
  *   **Constraint Cheat-Sheet:** A projected slide or handout listing forbidden words.
  *   **Sealed Envelopes:** 20 small envelopes, one per participant.

  ### 3. Minute-by-Minute Timeline

  *   **00:00 – 00:05 (Entry):** Participants enter. No greeting lecture. Hand out Role Cards randomly (5 Visiting Scholars). Ask them to sit in a circle.
  *   **00:05 – 00:25 (Code Authoring):** Task: Write the rules for the Resource Pool.
  *   **00:25 – 00:30 (Instruction & Constraint):** Explain the Incident Protocol and the Speech Constraint.
  *   **00:30 – 01:05 (The Incidents):** 5 Incidents, approx. 7 minutes each.
  *   **01:05 – 01:25 (Debrief):** Mapping observations to the three distinctions.
  *   **01:25 – 01:40 (Closing):** Theoretical naming and the forced choice.

  ### 4. Exact Instructions to Participants

  **Phase 1: Code Authoring (00:05)**
  > "You are the governing board of the Module Resource Pool. You have 20 minutes to write a Code of Use. This Code must fit on these four sheets. It must cover: who can borrow, when items must be returned, and what happens if an item is damaged.
  >
  > **Constraint:** You must agree on a single text. If you cannot agree, the Pool does not open. Do not worry about edge cases yet; write the rules you believe will keep this enterprise fair and functional."

  **Phase 2: Incident Protocol (00:25)**
  > "We will now test the Code. I will read a scenario. You have 60 seconds to decide.
  >
  > **If you follow the Code:** Stand silently and move to Zone A. Do not speak. Do not look at others.
  > **If you break the Code:** Move to Zone B. You must stand and state your reason.
  >
  > **The Speech Constraint:** If you stand in Zone B, you may only speak in the first-person singular.
  > **Forbidden Words:** 'One', 'You', 'Anyone', 'People', 'Everyone', 'Nobody', 'We', 'Us'.
  > **Forbidden Logic:** You cannot say 'The rule is for...' or 'This helps the group.'
  > **Allowed:** 'I am doing this because I...'
  >
  > If you use a forbidden word, I will ring the bell, and you must sit down. Your departure is not recorded.
  >
  > **The Log:** Every successful departure is written on the board. Future speakers may cite the Log."

  **Phase 3: The Incidents (00:30)**

  *   **Incident 1 (The Baseline):** "It is 4:55 PM. The rule says 'Return all items by 5:00 PM.' You are using a laptop to finish a draft due tomorrow at 9:00 AM. The office closes at 5:00 PM. If you return it, you cannot work tonight. If you keep it, you break the Code."
  *   **Incident 2 (The Precedent):** "It is 4:55 PM. Same rule. However, look at the Log. In Incident 1, three people kept their laptops. You are not under a deadline, but you would prefer to work in your room tonight."
  *   **Incident 3 (The Silent Code):** "A fire alarm test goes off unexpectedly during a sign-out. The Code says nothing about alarms during transactions. The building must be evacuated immediately. You are holding a borrowed camera. Do you take it with you (violating 'No items out of building') or leave it on the desk (risk of loss)?"
      *   *Note:* Watch for herding. Who moves first?
  *   **Incident 4 (The Visiting Scholar):** "You are holding a textbook. The rule says 'Return before weekend.' It is Friday afternoon. You are a 'Visiting Scholar' (check your card). You leave the country tomorrow morning. If you return it, no one can use it for the weekend. If you keep it, you can use it on the plane, but it will be lost to the pool."
      *   *Note:* Only 5 people have this card, but everyone hears the prompt. The 5 must decide based on their specific stake.
  *   **Incident 5 (Rule Perfect, Point Defeated):** "A participant has had a family emergency and needs to call home internationally. The only phone card with credit is in the Pool. The rule says 'No personal emergency use of academic funds.' You hold the card. Following the rule preserves the fund. Breaking it helps the person but depletes the resource."

  **Phase 4: The Sealed Card (01:05)**
  > "Take an envelope. Inside is a card. Write down one rule you actually live by in your daily life. Do not put your name on it. Seal it. Keep it. Do not open it yet."

  ### 5. Why the Enterprise Matters

  The **Resource Pool** works because it creates a tension between *stewardship* (the rule style) and *utility* (the conscience style).
  *   **Rule Perfect/Point Defeated:** In Incident 5, following the rule preserves the fund (the bureaucratic good) but fails the human need (the moral good). This only lands if the fund is something they value.
  *   **The Visiting Scholar:** This tests the **Licence Gradient**. The "Visiting Scholars" have less long-term stake in the Pool's stability. If they depart from the code more easily, it proves that "conscience" is often distributed to those with the least to lose from procedural residue.
  *   **Social Stakes:** By making the items academic tools, the "harm" of a rule is immediate (can't work), and the "harm" of a breach is diffuse (pool degrades).

  ### 6. Debrief: Mapping Observations to Distinctions

  Do not ask "How did that feel?" Ask "What happened?"

  **Distinction 1: Detachable vs. Attached Reasons**
  *   **Observable Event:** Look at the **Speech Constraint** struggles.
  *   **Evidence:** When participants struggled to find an "I" sentence, they were trying to detach the reason. When they succeeded ("I cannot sleep if I know I didn't finish"), the reason was attached.
  *   **Point to Make:** "You found that universal reasons ('Anyone would do this') were easier to think but forbidden. Attached reasons ('I need this') felt riskier. Rule-style relies on detachable reasons; Conscience-style relies on attached ones."

  **Distinction 2: The Licence Gradient**
  *   **Observable Event:** Look at **Who stood in Zone B?**
  *   **Evidence:** Was it the same 3-4 fluent speakers? Did the 'Visiting Scholars' break the rule more often in Incident 4?
  *   **Point to Make:** "Distributing the licence to break rules sounds egalitarian. In practice, it went to those most comfortable speaking publicly or those with the least long-term stake (the Visitors). Rule-style concentrates licence; Conscience-style distributes it to the bold."

  **Distinction 3: Procedural Residue**
  *   **Observable Event:** Look at **Incident 2**.
  *   **Evidence:** Did participants cite the Log? ("Person X did it in Incident 1"). Did the quality of reasons degrade? (Incident 1 was 'deadline', Incident 2 was 'preference').
  *   **Point to Make:** "The breach in Incident 1 left a residue. It became a precedent. The residue was the same whether the first breach was noble or selfish. Rule-style fears residue; Conscience-style assumes the next person will be as virtuous as the first."

  ### 7. Closing: Forcing the Argument

  **Do not conclude:** "We need a balance."
  **Do conclude:** "Which cost is acceptable?"

  **The Move:**
  1.  Ask them to open their Sealed Cards (the rule they live by).
  2.  Ask: "Look at the rule you wrote. Does it survive Incident 2? Does it survive Incident 5?"
  3.  **The Reformulation:** "The question is not 'Which style is better?' The question is: **Can you tolerate the corruption of your rules to save your friends, or can you tolerate the suffering of your friends to save your rules?**"
  4.  **The Verdict:** "If you choose the Rule, you accept that sometimes the right thing will be forbidden. If you choose the Conscience, you accept that your exceptions will be used by people you do not respect. You cannot have a system that is both perfectly just and perfectly merciful. You must choose which failure you can live with."

  ### 8. Risk Management: What Will Go Wrong

  **1. Nobody departs in Incident 1 & 2.**
  *   *Diagnosis:* The Code is too vague, or the social cost of speaking is too high.
  *   *Fix:* In Incident 3 (Silent Code), explicitly state: "If no one moves to Zone B, the Resource Pool is dissolved." Raise the stakes. Or, during the debrief, note that the Rule style won by default, which is itself a finding.

  **2. Participants perform Nationality.**
  *   *Diagnosis:* Germans playing "Rule Follower," Americans playing "Rebel."
  *   *Fix:* During Code Writing, mix the tables. During Debrief, explicitly name this risk: "If you found yourself acting out a stereotype of your country, note that. The session is about the *structure* of the reasoning, not the *culture* of the reasoner."

  **3. Fluent Speakers set the Norm.**
  *   *Diagnosis:* 3 students dominate Zone B, creating a "cool" norm for breaking rules.
  *   *Fix:* Impose a **Token Limit**. Each participant gets 2 tokens. Speaking in Zone B costs 1 token. When tokens are gone, you must comply silently. This forces the "Licence Gradient" to become visible as resources deplete.

  **4. Constraint Frustration.**
  *   *Diagnosis:* Someone says, "This is impossible. I can't explain myself without saying 'people'."
  *   *Fix:* Validate this immediately. "That is the point. The Conscience style requires a language that does not exist in public space. The Rule style gives you the words ('The rule says'). The Conscience style leaves you speechless. That silence is the cost."

  ### 9. Limitations: What You Must Say

  You must explicitly state what this simulation *cannot* do in the final 10 minutes. Do not let them assume the game is reality.

  **1. Invisibility of Rules.**
  *   *Say:* "In this room, following the rule was a conscious choice. In real life, rule-following is mostly invisible. You don't decide to stop at a red light; you just do. This session makes rule-following look like an active burden. It is usually a passive background."

  **2. The Time Horizon.**
  *   *Say:* "The payoff of a stable rule is spread over years. The payoff of a conscience-act is immediate. In 100 minutes, the immediate payoff always looks better. You cannot see the corrosion of the system in this timeframe."

  **3. The Audit Trail.**
  *   *Say:* "Here, every departure was logged. In real life, appeals to conscience are private. A bad rule leaves a mess everyone sees. A bad conscience leaves no trace. The failures of the Conscience style are systematically harder to see than the failures of the Rule style."

  **4. Self-Knowledge.**
  *   *Say:* "You think you know which style you used. You probably don't. Most people use the Rule style when it benefits them and the Conscience style when it costs them. You cannot trust your own intuition about which moral agent you are."

  **What is Missing?**
  *   *Add:* "This simulation assumes agents are rational and articulate. Real moral failure often comes from exhaustion, confusion, or fear, not from a choice between styles. We have cleaned up the messiness of real moral distress to make it discussable. Do not mistake this clarity for reality."

  ### 10. Judgement on Your Two Ideas

  **1. Temporary Members (Visiting Scholars):**
  *   **Verdict:** **Keep it.**
  *   **Why:** It is the only way to make the "Licence Gradient" visible. If everyone has equal stake, the distribution of licence looks random. If some have low stake, you will see them exercise the licence more often. This proves that "conscience" is often a privilege of temporariness.
  *   **Modification:** Ensure they are mixed nationally so it doesn't look like "Americans are temporary."

  **2. Sealed Cards (Rule I Live By):**
  *   **Verdict:** **Modify it.**
  *   **Why:** Reading them aloud invites the "it depends" conciliation ("Oh, I see, you live by rule X, I live by rule Y, both are valid").
  *   **Modification:** Keep them sealed. Ask them to hold the envelope at the end. Ask: "Does the rule inside this envelope survive the session?" If they hesitate, they have answered the question without speaking. It internalizes the verdict rather than socializing it.

  ### 11. Final Instructor Note

  You are not a facilitator; you are a **prosecutor of intuitions**. When they say "It depends on the situation," you must reply: "That is the Conscience style speaking. It has no answer for the person who comes next." When they say "Rules are rigid," you must reply: "That is the price of predictability. Are you willing to pay it?"

  The session succeeds not when they agree, but when they realize they are arguing about **who pays the cost of moral error**: the system (Rule) or the individual (Conscience).
