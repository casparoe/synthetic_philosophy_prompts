answer: |-
  Your intuitions are tracking a real structural distinction, but your tentative principle ("No-Interested-Selector") conflates the *source* of a correlation with the *leverage* your decision has over that source. The conflict you feel between the Screening Bully and the Indiscriminate Bully, and between Prices and Adversarial Surrogates, arises because you are looking at *who* is selecting, rather than *what* they are selecting *for*.

  Here is a repaired principle, stated precisely, followed by its application to your new cases, the verdicts it requires you to overturn, and the resolution of your unsettled reward case.

  ### The Principle of Policy-Contingent Leverage

  **Core Statement:** You should act according to the decision policy that maximizes expected utility across all logically correlated instances, *unless* the mechanism producing the outcome penalizes that policy type *independently* of your specific action in the current instance.

  This principle divides your cases into three structural categories. Each clause addresses one category.

  **Clause 1: Logical Correlation (The Twin and Mugging Clause)**
  *   **Statement:** If an outcome depends on your decision algorithm type across correlated instances (physical copies, simulations, or counterfactual branches), optimize for the algorithm type, ignoring branch measure or causal isolation.
  *   **Motivation:** **Twin** and **Plain Counterfactual Mugging**. In both, the payoff is determined by what *you* would do in a correlated situation. In **Low-Measure Mugging**, the branch measure is irrelevant because the decision is logically prior to the branch split; you are deciding the policy for the whole set, not the utility of the single branch.
  *   **Verdict:** Press the button. Pay the mugger. Pay the low-measure mugger with full confidence.

  **Clause 2: Policy-Conditional Threats (The Blackmail Clause)**
  *   **Statement:** If the *opportunity* for a threat to be issued is contingent on the predictor forecasting that you will comply with the threat, you must refuse compliance. Compliance makes your policy type a profitable target, creating the threat opportunity itself.
  *   **Motivation:** **Screening Bully**. The bully only approaches you *because* they predict you will pay. If you adopt the policy "pay when screened," you guarantee the approach and the loss. If you adopt "refuse when screened," the approach never happens.
  *   **Verdict:** Refuse payment. Accept the simulation torture (acausally) to prevent the policy from being profitable.

  **Clause 3: Policy-Independent Threats (The Mitigation Clause)**
  *   **Statement:** If the threat is issued regardless of your predicted response, and your compliance causally mitigates harm to yourself or others, you should comply. Your refusal does not disincentivize the practice, as the practice does not screen for you.
  *   **Motivation:** **Spiteful Mugger** and **Indiscriminate Bully**. In the Spiteful case, the threat is on *you* directly. In the Indiscriminate case, the threat is on a stranger, but the *issuance* of the threat was not caused by your disposition.
  *   **Verdict:** Pay the Spiteful Mugger. Pay the Indiscriminate Bully.
  *   **Resolution of your Conflict:** Your intuition that "don't make this practice worth running" applies to the Indiscriminate Bully is incorrect. In the Screening case, your payment *creates* the profit that sustains the practice. In the Indiscriminate case, the practice runs regardless; your payment merely reduces the net harm of an existing, fixed cost. Refusing here saves you money but does not stop the bully; paying saves the stranger.

  **Clause 4: Incentive-Compatible Proxies (The Mechanism Clause)**
  *   **Statement:** Rely on a proxy or signal if the selection pressure on the mechanism *corrects* deviations from the truth. Reject the proxy if the selection pressure *rewards* deviations from the truth.
  *   **Motivation:** **Prices** vs. **Adversarially Sited/Self-Eroding Surrogates**. In **Prices**, counterparties select against you, but their profit depends on finding *true* mispricings. Their adversarial nature *enforces* accuracy. In **Adversarial Surrogates**, the adversary profits by finding cases where the proxy *diverges* from the truth (Goodhart's Law). In **Self-Eroding**, the system itself optimizes for the proxy at the expense of the truth.
  *   **Verdict:** Rely on Prices. Reject Adversarial and Self-Eroding Surrogates.

  ---

  ### Application to New Cases

  **Case 1: The Mild Disvalue Mugger (Screening)**
  *   **Scenario:** A predictor screens for those who would pay, then threatens to spend a budget on something you mildly disvalue (e.g., burning a book you like) unless you pay $1,000.
  *   **Analysis:** This falls under **Clause 2 (Policy-Conditional Threats)**. The threat is only issued because you are predicted to pay. The magnitude of the threat (mild disvalue vs. torture) does not change the structural incentive. If you pay, you make it profitable to screen for you.
  *   **Verdict:** **Refuse.** Even if the threat is mild, paying establishes a policy that invites screening. The principle requires you to be the type who refuses screening, regardless of the specific stakes, to maintain the integrity of the policy against *future* high-stakes screeners.

  **Case 2: The Optimized Surrogate**
  *   **Scenario:** A surrogate metric was chosen because a search process optimized for it tracking the real objective across many distributions. The tracking was "manufactured" by an interested selector.
  *   **Analysis:** This falls under **Clause 4 (Incentive-Compatible Proxies)**. The key is not whether a selector was involved, but *what they selected for*. Here, the selector optimized for *tracking accuracy*. Their interest was aligned with truth (finding a robust proxy), not with exploiting the gap between proxy and truth.
  *   **Verdict:** **Rely.** Unlike the Adversarially Sited case (where the selector exploits the gap), here the selector closed the gap. The "interested selector" rule is too blunt; the relevant factor is the *direction* of the selection pressure relative to truth.

  ---

  ### Verdicts You Must Overturn

  To align with this principle, you must revise three of your current positions:

  1.  **Low-Measure Mugging:** You stated you are "least sure" here and feel the fraction shouldn't matter but worry it does. The principle demands **certainty**. Measure is irrelevant to updateless decision theory. If you pay in the Plain case, you must pay in the Low-Measure case with equal conviction. Hesitation implies you are updating on being in the specific branch, which Clause 1 forbids.
  2.  **Indiscriminate Bully vs. Screening Bully:** You feel these should be treated similarly ("don't make this practice worth running"). The principle dictates they are **structurally opposite**. You are right to pay the Indiscriminate Bully (Clause 3) and right to refuse the Screening Bully (Clause 2). You must discard the intuition that refusal in the Indiscriminate case serves a deterrent function. It does not, because the threat is not conditional on your response.
  3.  **The Source of Proxy Failure:** You suspected the "Interested Selector" rule explained the Surrogate failures. The principle shows this is wrong (see Optimized Surrogate above). You must shift your critique from *who* selected the proxy to *what incentive structure* maintains it. Prices work *because* of interested selectors; Surrogates fail *because* of them. The distinction is alignment, not presence.

  ---

  ### The Unsettled Case: The Reward After Refusal

  **Scenario:** You refused the Screening Bully. A second predictor approaches, says it predicted you would refuse, and offers you $10,000 for having been that kind of person. It is free money now. You worry taking it makes you the sort of agent who gets approached by bullies.

  **Analysis:**
  This is a test of **Clause 2** stability.
  *   **The Disposition:** The first predictor screened for "Refuses Screening Bullies." You demonstrated this disposition.
  *   **The Reward:** The second predictor rewards "Refuses Screening Bullies."
  *   **The Risk:** You worry that accepting the reward changes your disposition to "Refuses Bullies *to get rewards*," which might signal to future bullies that you are responsive to incentives surrounding refusal.

  **Principle Verdict:** **Take the Money.**

  **Reasoning:**
  1.  **Policy Stability:** Your policy is "Refuse Screening Threats." Taking a reward for *having had that policy* does not change the policy. It reinforces it.
  2.  **Signaling:** Bullies (Clause 2) screen for agents who *pay* when threatened. They do not screen for agents who *accept rewards* for refusing. Accepting the reward does not make you a profitable target for blackmail; it makes you a profitable target for *allies* who want to incentivize anti-blackmail behavior.
  3.  **Causal Structure:** The prediction is already made. The money is on the table. Refusing it does not retroactively make you more "refusal-prone"; it merely burns utility.
  4.  **Meta-Incentive:** If you refuse the reward, you lower the expected value of being the "Refusal Type." This makes it less likely that *other* agents will invest in rewarding that type in the future. To sustain a community of agents who refuse blackmail, those agents must accept the rewards offered for that virtue.

  **Conclusion:** Accepting the money is the only move that aligns your incentives with the policy you want to inhabit. It signals that the "Refusal" policy is profitable, which encourages predictors to reward it rather than screen against it.

  ### Summary
  Your confusion stemmed from treating all predictors and selectors as a monolithic "interested party." The **Principle of Policy-Contingent Leverage** distinguishes between those whose interests are aligned with your policy's success (Counterfactual Muggers, Price Markets, Rewarders), those whose interests are aligned with your policy's failure (Screening Bullies, Adversarial Surrogates), and those whose interests are independent of your policy (Indiscriminate Bullies).

  Align your actions with the first, resist the second, and mitigate the third.
