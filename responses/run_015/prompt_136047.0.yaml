  **MEMORANDUM**

  **TO:** Acquisitions Committee, National History Museum
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Preservation Grant Allocation: Midwife Collective vs. Provincial Governor Records

  **Recommendation**
  I recommend allocating the full preservation grant to the **digitization and exhibition of the local midwife collective's private papers**. However, this funding should be contingent on a specific methodological condition: the project must establish a formal cross-referencing protocol with existing state archives, including the provincial governor's records, to ensure evidentiary triangulation.

  **Rationale for Priority**
  The midwife collective's records represent a critical gap in our national holdings. While state archives meticulously document the *administration* of health policy, they rarely capture the *practice* of care, particularly among marginalized populations. These unofficial birth registries and dispute logs offer a rare "history-from-below" that challenges the completeness of our institutional narrative. Furthermore, unofficial paper is often more fragile than state-bound volumes; the urgency of preservation is higher here. If we do not act, this counter-archive risks physical disintegration, resulting in an irreversible epistemic loss.

  **Addressing the Methodological Risk**
  I treat seriously the argument in favor of the governor's correspondence: **methodological security.** State records possess standardized provenance, consistent dating, and institutional chains of custody that make historical claims easily falsifiable and verifiable. By prioritizing the midwife papers, we accept a degree of evidentiary risk. Unofficial records can be idiosyncratic, lack external corroboration, and risk being interpreted through an anachronistic lens if divorced from the legal frameworks of the era.

  We cannot ignore that privileging these counter-records without safeguards could undermine the scholarly rigor expected of a national museum. If the midwife logs cannot be contextualized against the state regulations they often circumvented, we risk presenting folklore as data.

  **Mitigation and Conditions**
  To address this, I propose the following conditions for the midwife grant:
  1.  **Triangulation Mandate:** The digitization team must not work in isolation. They are required to map the midwife entries against *existing* (even if undigitized) state birth registries and the governor's administrative calendars. Discrepancies between the two should be highlighted in the metadata, not smoothed over.
  2.  **Contextual Metadata:** Every digitized item must include a "regulatory context" field, noting the state laws in force at the time of the record's creation. This ensures the "counter" nature of the record is explicit, preserving the tension between the two archives without needing to fund the governor's conservation *in this cycle*.

  **Implementation Timeline**
  *   **Months 1–6 (Conservation & Stabilization):** Physical stabilization of the midwife papers; establishment of the cross-referencing protocol with the state archive holding the governor's records.
  *   **Months 7–12 (Digitization & Triangulation):** High-resolution scanning concurrent with metadata tagging that links specific midwife logs to corresponding state administrative files.
  *   **Months 13–18 (Exhibition Design):** Development of a public interface that allows users to toggle between the "Official Record" (transcribed state data) and the "Lived Record" (midwife testimony), making the evidentiary gap part of the exhibit itself.

  **Conclusion**
  Funding the governor's records would guarantee methodological safety, but it would reinforce a historical narrative we already possess in abundance. By funding the midwife collective with strict verification conditions, we expand the national story while maintaining scholarly integrity. We preserve the voice of the governed without abandoning the standards of the historian.

  I request we vote to approve this allocation with the stipulated conditions.
