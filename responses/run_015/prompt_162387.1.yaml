answer: |-
  1. If classical logic already works on checkable properties, does your permission to use it there actually license any new proofs, or just validate old ones?
  **Answer:** It validates the safety of classical fragments without committing us to realism over infinite domains. The point is philosophical hygiene, ensuring we don't slip into unwarranted existential claims.
  **Follow-up:** But if it licenses no new proofs, isn't this just a warning label rather than a distinct logical system?

  2. When you define if-then claims as transformations of proofs, whose proofs are these and does explaining logic via proofs just circle back to logic?
  **Answer:** These are informal constructions recognizable by any competent mathematician, not formal derivations in a specific system. This explains meaning rather than defining it, grounding logic in practice.
  **Follow-up:** But if these constructions aren't formalized, how do you prevent the vagueness you accuse classical logic of having?

  3. Is requiring a witness for existence a virtue of clarity or just a handicap that stops you from proving things classical mathematicians prove easily?
  **Answer:** It ensures that existence claims carry computational content, which is essential for applied mathematics. We prove less, but what we prove is more useful for computation.
  **Follow-up:** But when a physicist needs to know if a solution exists regardless of finding it, doesn't your restriction hinder scientific progress?

  4. Since classical logic translates into intuitionistic logic by denying the opposite, isn't classical logic just a shorthand for intuitionistic logic rather than a rival?
  **Answer:** The translation preserves truth but alters meaning, masking the constructive content required for algorithms. Classical logic is a fragment, but one that obscures the computational cost.
  **Follow-up:** If the translation preserves truth, why insist the meanings differ enough to warrant rejecting classical inference rules?

  5. Does the claim that all functions are continuous come from your logic or from a theory of free infinite sequences, and are you a Brouwerian or a Bishop-style constructivist?
  **Answer:** That thesis depends on choice sequences specific to Brouwer's intuitionism, whereas I follow Bishop in staying compatible with classical analysis. My logic restricts inference, not the underlying mathematical objects.
  **Follow-up:** Then why adopt intuitionistic logic if you reject the specific constructive analysis that motivated its strongest deviations from classical math?

  6. If you reject excluded middle, why accept Markov's principle which infers existence from impossibility of failure, and doesn't rejecting it break basic analysis?
  **Answer:** Markov's principle is acceptable for decidable predicates where we can search effectively, unlike general excluded middle. Rejecting it complicates analysis, but we accept it as a pragmatic extension where safe.
  **Follow-up:** But if effective search justifies Markov's principle, why doesn't it justify excluded middle for those same decidable cases within infinite domains?

  7. Is your view that truth itself changes over infinite domains, or just that our warrant for asserting truth changes?
  **Answer:** It is about warrant; truth is epistemic rather than mind-independent over unsurveyable domains. We cannot assert truth values where verification is impossible in principle.
  **Follow-up:** But if truth depends on verification, doesn't that make mathematical truth temporal, changing as we discover new proofs?

  8. If classical proofs yield algorithms now anyway, why switch logics, and why does classical math work so well in science if it's illegitimate over infinite domains?
  **Answer:** Extraction is indirect and often inefficient, whereas constructive proofs are algorithms by design. Classical math works because it approximates constructive truth in finite applications.
  **Follow-up:** But if classical math is merely an approximation, why trust it in critical infinite limits used in physics?

  9. You use classical logic to prove properties of your intuitionistic system; isn't that inconsistent, and can you really treat infinite sets of proofs as surveyable?
  **Answer:** Metamathematics deals with finite strings of symbols, which are surveyable even if the objects they describe are not. We use classical logic there because the domain of proofs is decidable.
  **Follow-up:** But if the set of proofs is infinite, how can you claim it is surveyable enough to justify classical reasoning about it?

  10. What evidence would make you abandon local constructivism, and how do you answer my friend who says this is just classical logic with a guilt trip?
  **Answer:** A demonstration that classical reasoning over infinite domains yields indispensable physical predictions would force a reconsideration. I would tell your friend that ignoring epistemic limits risks mathematical incoherence, not just guilt.
  **Follow-up:** But if classical logic remains indispensable for physics, wouldn't that show your epistemic limits are merely temporary obstacles rather than logical boundaries?
