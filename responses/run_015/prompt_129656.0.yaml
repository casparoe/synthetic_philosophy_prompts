answer: |-
  **MEMORANDUM**

  **TO:** Joint Legislative Committee on Forensic Oversight
  **FROM:** State Forensic Science Advisory Board
  **RE:** Policy Recommendations Regarding Latent Friction Ridge Examination and Contextual Information
  **DATE:** September 15, 2024

  The Board recommends the immediate adoption of Package Two (Auditable Decision) rather than Package One (Full Contextual Isolation). We mandate enhanced documentation of feature selection and contextual exposure, coupled with an internal study to determine the dominant mechanism of bias, rather than imposing operationally prohibitive blinding protocols at this time.

  This recommendation arises from the Alvarez matter, wherein an examiner's conclusion shifted from "no value" to "identification" solely after receiving contextual information, despite the evidence remaining static. The defense petition argues that such shifts prove contextual information corrupts the science, necessitating full isolation. The laboratory administration counters that context provides necessary signal regarding substrate and pressure, and that redaction protocols would exacerbate existing backlogs. To resolve this, the Board determined that the policy choice must turn on the mechanism by which context operates. We distinguish three routes: the appearance route, where information alters the perception of the features themselves; the selection route, where information guides where the examiner looks and what regions are encoded; and the reporting route, where perception remains stable but the threshold for declaring a match shifts.

  Blinding is the obvious remedy for the appearance route, as preventing exposure prevents the perceptual distortion. However, blinding is ambiguous for the selection route; knowing a suspect's route through a house may legitimately focus an examiner on high-probability areas without distorting the ridge details found there. Blinding is largely useless for the reporting route, because an examiner can consciously lower their threshold for sufficiency even in the dark. The Alvarez matter suggests a shift in the reporting threshold or selection focus, rather than a hallucination of ridge details. Consequently, mandating full isolation (Package One) treats all contextual influence as perceptual contamination, risking the loss of legitimate signal while failing to address threshold shifts that can occur even in blinded conditions.

  The Board has seriously evaluated the committee's proposed probe: re-presenting examiners with comparisons where earlier contextual information is explicitly retracted and shown to be false. The inference holds that if the bias operates on the reporting route, the examiner should revert to their original conclusion once the justification for a lower threshold is removed. If the bias operates on the appearance or selection routes, the examiner's perception will have locked onto the new interpretation, and the retraction will not undo the identification. A null result in this study—where retraction fails to change the conclusion—would indicate that perceptual or selection locking has occurred, strengthening the case for Package One. Conversely, if retraction successfully reverses conclusions, it confirms the mechanism is primarily threshold-based, validating Package Two's focus on documentation and transparency.

  Regarding feasibility, the Board believes a pilot study can be executed within two quarters, but with significant caveats. Our sample of examiners is small, limiting statistical power and generalizability. Furthermore, an in-house study cannot be fully blinded; examiners will know they are being tested, which may induce performance anxiety or compliance behavior that masks true cognitive processes. While these limitations prevent the study from serving as definitive scientific proof, it is sufficient for policy calibration. It will reveal whether our specific workforce is susceptible to perceptual locking or threshold shifting. Therefore, we recommend proceeding with the study not as a condition of policy, but as a parallel track to validate our chosen course.

  The Board must decide under uncertainty, weighing the asymmetry of error costs. A mistaken identification risks a wrongful conviction, which inflicts irreparable harm on the innocent and erodes public confidence in the entire forensic enterprise. A suppressed or missed identification risks leaving an offender at large, a serious failure but one that does not actively manufacture injustice. Package One minimizes the risk of wrongful conviction by removing the source of bias but introduces systemic risk through backlog and resource diversion, which can lead to rushed work and unrelated errors. Package Two accepts the risk of bias but mitigates it through transparency, allowing courts to weigh the evidence based on recorded exposure. Given that the Alvarez error was detectable only because the timeline was known, transparency offers the best mechanism for catching threshold shifts without collapsing laboratory throughput.

  Accordingly, the Board directs the State Laboratory Director to implement the following changes effective immediately. First, examiners must record the specific ridge features relied upon prior to stating any conclusion. Second, examiners must log all contextual information received during the examination process, including colleague communications and case briefings. Third, the verification step must be performed by an examiner who has not been exposed to the initial examiner's conclusion, though they may access case context. These protocols require software updates to the Laboratory Information Management System and training on documentation standards, estimated to cost less than five percent of the annual operational budget. Implementation must be complete within ninety days. The Board will revisit the policy in eighteen months, or sooner if the internal probe study demonstrates significant perceptual locking that documentation fails to mitigate.

  The strongest argument for the rejected Package One is that it is the only method that physically prevents contextual information from entering the cognitive process, offering the highest theoretical guarantee against bias. If the internal probe study demonstrates that examiners cannot undo identifications even after context is retracted—proving that perception itself is altered by expectation—the Board will move to mandate sequential unmasking and full redaction protocols regardless of the cost or backlog implications. Until that evidence is secured, however, transparency remains the most defensible balance between scientific integrity and operational reality.
