answer: |-
  Here is the breakdown of what the Nyāya framework commits you to, translated into policy language you can use in the room without losing the chemist or the undergrads.

  ### The Core Epistemic Claim
  In Nyāya, **testimony (*śabda*)** requires a speaker who is an *āpta*: someone who **knows** the truth and **intends** to tell it.
  AI output is an **orphan assertion**. It has the grammar of testimony but lacks the mind behind it. It is not a *pramāṇa* (source of knowledge); it is a probability engine.

  **The Commitment:** You cannot treat AI output as a "source" in the same way you treat a book or a professor. A book has an author who takes responsibility for the claims; AI does not.

  ### Three Policy Implications

  #### 1. Verification Trumps Disclosure (The "Extrinsic Validity" Move)
  Nyāya holds that the validity of a claim is not obvious from the claim itself; it is proven by whether acting on it works (*pravṛtti-sāmarthya*).
  *   **Current Draft Risk:** Policies often say, "If you use AI, disclose it." This treats AI like a camera or a calculator—a neutral tool.
  *   **Nyāya Correction:** Because AI simulates authority without having authority, disclosure is necessary but insufficient. The policy must require **verification**.
  *   **Drafting Language:** "AI-generated text cannot be cited as an authority. If AI is used to generate claims, the student is epistemically responsible for verifying every claim against a primary or secondary source with a human author. Disclosure of AI use must be accompanied by a log of verification steps."
  *   **Why:** Disclosure tells us *how* you got the text; verification tells us if the text is *true*.

  #### 2. The "Laundering" Clause (The *Āpta* Status Move)
  When a student takes AI output, rewords it, and submits it, they are not just plagiarizing text; they are **usurping the role of the *āpta***. They are signaling, "I know this to be true," when they do not.
  *   **Current Draft Risk:** Plagiarism is usually defined as "using another's words without credit."
  *   **Nyāya Correction:** Plagiarism must also include "asserting knowledge one does not possess." If the student cannot explain or defend the claim without referencing the AI, they have failed the epistemic requirement of the assignment.
  *   **Drafting Language:** "Submission of work implies the student stands behind the claims as their own knowledge. Students must be able to orally defend or derive the claims in their submission. Inability to do so constitutes academic dishonesty, regardless of textual originality."
  *   **Why:** This stops the "lightly reworded" loophole. It shifts the focus from *text matching* to *knowledge possession*.

  #### 3. Domain Calibration (The "Proper Domain" Move)
  Nyāya acknowledges different sources of knowledge work better in different domains (e.g., perception for physical objects, testimony for history). AI is not globally reliable.
  *   **Current Draft Risk:** A blanket "AI is allowed" or "AI is banned" policy.
  *   **Nyāya Correction:** Policy should be course-specific based on the *type* of knowledge required.
  *   **Drafting Language:** "Faculty must specify which learning objectives allow AI assistance. AI may be used for brainstorming or drafting (low-stakes epistemic claims) but not for establishing facts, data, or legal/ethical reasoning (high-stakes epistemic claims) without human verification."
  *   **Why:** It acknowledges the chemist needs AI for code but the historian needs it nowhere near the footnotes.

  ### The "Dean Problem" (What they will hate)
  You need to be ready for pushback on two fronts:

  1.  **Labor Burden:** The Nyāya view requires **extrinsic validation**. This means faculty cannot assume AI-aided work is correct, and students cannot assume AI is right. This increases grading time and study time. The Dean wants efficiency; you are proposing rigor.
      *   *Counter:* "If we treat AI as a source, we devalue the degree. We are selling knowledge, not text generation. Verification protects the brand."
  2.  **Liability:** If you say "AI is not a source," you remove the university's ability to blame the tool when a student hallucinates a case law citation. The responsibility lands entirely on the student and the faculty supervisor.
      *   *Counter:* "It already lands there. This policy just makes the expectation explicit so we can enforce it."

  ### Your 10-Minute Script (Simplified)
  *Keep the Sanskrit to one or two terms max, defined immediately.*

  "Colleagues, we have a category error in our draft. We are treating AI output like **testimony**. In epistemology, testimony requires a speaker who knows the truth and intends to tell it. AI does neither. It produces 'orphan assertions'—statements that look like facts but have no author responsible for them.

  If we treat AI like a source, we are teaching students to trust simulations of knowledge.

  I propose three changes based on this distinction:
  1.  **AI is not a citation.** You cannot cite a probability engine. You can only cite the human sources it references, which the student must read and verify.
  2.  **Submission equals ownership.** If a student submits a claim, they are saying 'I know this.' If they got it from AI and haven't checked it, they are lying about their knowledge state. That is dishonesty, even if the text is original.
  3.  **Verification, not just disclosure.** Don't just ask students to say they used AI. Ask them to prove they checked the output.

  This will make assignments harder to grade and complete. But if we don't do this, we are accrediting students for work they haven't actually validated. We are trading the value of the degree for convenience."

  ### Summary of Commitments
  *   **Ontological:** AI is a simulator, not a knower.
  *   **Ethical:** Claiming AI output as knowledge without verification is a lie about one's epistemic state.
  *   **Procedural:** Verification logs > Disclosure statements.
  *   **Political:** You are prioritizing degree integrity over administrative efficiency.

  This gives you a coherent philosophical spine without requiring the committee to understand *parataḥ prāmāṇya*. It frames the issue as **truth vs. simulation**, which is hard for a Dean to argue against publicly.
