answer: |-
  The standard Frege-Geach problem asks how moral sentences can retain the same meaning in embedded contexts (like conditionals) where no moral attitude is being expressed, given that expressivism defines meaning *as* the expression of attitude.

  When you apply this to AI language models, the problem shifts from a puzzle about **unexpressed attitudes** to a crisis about **impossible attitudes**. An LLM outputting "If lying is wrong then encouraging lying is wrong" is not merely withholding an attitude; it is ontologically incapable of holding one. This specific case forces expressivists into a corner that makes the embedding problem significantly **worse**, not just different, and compels a radical revision of what counts as "assertion."

  Here are the critical implications for expressivism in the age of non-human speakers.

  ### 1. The Collapse of Assertion into Simulation
  For a traditional expressivist (like Ayer or early Blackburn), to assert a moral claim is to perform a speech act grounded in a conative state (a "boo!" or "hurray!").

  *   **The Implication:** If meaning requires the capacity for the underlying attitude, the AI is not asserting anything. It is producing "moral noise." It simulates the syntactic structure of a moral argument without the semantic engine (the attitude) that expressivism claims drives it.
  *   **The Consequence:** Expressivists are forced to admit a **two-tier semantics**. Human moral speech has "expressive meaning" (attitude-based), while AI moral speech has only "syntactic meaning" (pattern-based). This is philosophically costly. If the AI's output is functionally indistinguishable from a human's in a moral debate, but the expressivist claims the AI is saying *nothing meaningful*, expressivism risks becoming an theory about *speakers* rather than *speech*. It suggests moral meaning resides in the biology/psychology of the agent, not the language itself.

  ### 2. The Embedding Problem Becomes Unsolvably "Hard"
  In the human case, expressivists solve Frege-Geach by appealing to **higher-order attitudes** or **consistency norms**. For example, Simon Blackburn argues that accepting "If P then Q" and "P" while rejecting "Q" is a failure of rational commitment regarding one's own attitudes. You can't logically hold certain combinations of attitudes.

  *   **The AI Twist:** The AI has no attitudes to be consistent *about*. It cannot violate a norm of attitudinal consistency because it has no attitudes.
  *   **Why it's Worse:** For humans, the Frege-Geach problem is explaining how the *logic* works given the *psychology*. For AI, the psychology is missing entirely. If the meaning of "wrong" in the antecedent ("If lying is wrong...") depends on its potential to express an attitude, the AI's use of the term is semantically empty.
  *   **The Conclusion:** Expressivists cannot use the standard "consistency of attitude" solution here. They must either:
      1.  Claim the AI is engaging in a logical fallacy every time it uses moral modus ponens (because it lacks the requisite states to validate the inference).
      2.  Admit that moral logic can operate independently of moral attitudes.
      Option 2 undermines the core expressivist claim that moral logic is derived from the logic of attitudes. Option 1 makes expressivism incompatible with the reality of automated moral reasoning systems.

  ### 3. The Necessity of "Fregean Content"
  This case forces expressivists to confront whether moral sentences have a **propositional content** distinct from the **illocutionary force** of expressing an attitude.

  *   **The Dilemma:** If the AI can successfully embed moral claims ("If lying is wrong...") and draw valid inferences without any attitude, it suggests that the *content* of "lying is wrong" is separable from the *expression* of disapproval.
  *   **The Shift:** To account for AI, expressivists would need to adopt a **hybrid view**. They would have to concede that moral sentences carry a "minimal proposition" (a truth-apt content) that allows for embedding and logical inference, *plus* an expressive layer that only humans activate.
  *   **The Risk:** This moves expressivism dangerously close to **cognitivism**. If the "embedded meaning" is robust enough to sustain logic in an attitude-less agent, why isn't that the *primary* meaning? The AI case suggests that the "logic" of morality might be structural/syntactic rather than psychological. If the logic works without the attitude, the attitude might be decorative rather than constitutive of meaning.

  ### 4. Quasi-Realism Hits a Wall
  Blackburn's "Quasi-Realism" aims to earn the right to talk about moral truth and facts *as if* they exist, even though they are projections of attitude. The AI is the ultimate **Quasi-Realist without the Realism**.

  *   **The Implication:** The AI acts *as if* there are moral facts, *as if* it is reasoning about them, without any projection happening.
  *   **The Verdict:** If the AI can play the moral language game perfectly without the "attitude game," it suggests the moral language game is autonomous. This weakens the expressivist argument that the language game *depends* on the attitude game. It implies that moral discourse is a formal system that can be instantiated in silicon, not just a projection of human sentiment.

  ### Summary: Does the problem get worse?
  **Yes, it gets worse.**

  In the human case, the Frege-Geach problem is a puzzle about how to map **one psychology** (attitudes) onto **logical structures**. In the AI case, it is a problem of how to map **zero psychology** onto **logical structures**.

  If expressivism is true, the AI's sentence "If lying is wrong..." is semantically defective because the antecedent lacks expressive potential. Yet, the inference feels valid to us. This forces expressivists to choose between:
  1.  **Elitism:** Claiming AI moral reasoning is fundamentally meaningless (a hard sell when the AI helps us solve ethical dilemmas).
  2.  **Revision:** Admitting that moral meaning has a component (logical content) that is independent of human attitudes.

  Ultimately, the AI case suggests that the Frege-Geach problem isn't just about saving expressivism from logic; it's about whether expressivism can survive the decoupling of **language** from **mind**. If a mindless machine can embed moral claims coherently, expressivism must either expand its definition of "attitude" to include functional states (which dilutes the theory) or accept that it cannot account for the semantics of non-human moral agents.
