      *   *Point 2: Assertion vs. Simulation.* Expressivists distinguish between asserting "X is wrong" (boo X) and asking "Is X wrong?" (boo X?). AI does neither. It simulates the *form*. This suggests expressivism must account for "quasi-assertion" or "functional assertion" independent of mental states.
      *   *Point 3: Does the problem get worse?* Yes. For humans, we assume the capacity for attitude exists. For AI, we know it doesn't. The Frege-Geach problem relies on the *univocality* of meaning (same meaning in embedded and unembedded contexts). If the AI never has the unembedded attitude, does the embedded clause have meaning? If the AI says "If P then Q," and P is moral, P has no expressive content for the AI. So the conditional is logically inert *for the AI*, even if valid *for us*.
      *   *Point 4: Quasi-Realism's Limit.* Blackburn tries to make expressivism look like realism. AI is the ultimate test of quasi-realism. Can you have quasi-realism without the "quasi" agent? If AI passes the Turing test for moral reasoning, does expressivism collapse into a form of semantic functionalism?

