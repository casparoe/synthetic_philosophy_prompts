prompt: |-
  Please describe the most important implicatons of the Frege-Geach problem for moral expressivism, but applied to a weird case: AI language models that spit out sentences like "if lying is wrong then encouraging lying is wrong" without actually holding any moral attitudes. Does this mean expressivists have to say the model isn't really asserting anything, or do they need to change how they understand embedded moral claims? I don't want the standard textbook version—focus on what it forces us to conclude about non-human speakers and wether the embedding problem gets worse or just different.
