      *   **Frege-Geach Problem:** How do we account for the meaning of moral sentences in *embedded* contexts (conditionals, questions, negations) where no attitude is being expressed? "If lying is wrong..." doesn't seem to express "Boo lying!" right now, yet it contributes to the logic of the argument.
      *   **AI/LLMs:** Syntactic engines. They predict tokens based on patterns. They have no beliefs, desires, or *attitudes*. They simulate speech acts without the mental states.

  3.  **Brainstorming the Intersection (Expressivism + AI):**
      *   *Standard Human Case:* Expressivists solve Frege-Geach by positing higher-order attitudes or consistency norms (e.g., Blackburn's quasi-realism, Gibbard's planning). The human *can* have the attitude, even if not currently expressing it.
      *   *AI Case:* The AI *cannot* have the attitude. It's a philosophical zombie regarding moral sentiment.
      *   *Implication 1:* If meaning *requires* the capacity for attitude, AI moral speech is meaningless noise.
      *   *Implication 2:* If meaning is functional/syntactic, expressivism might be wrong about the source of meaning.
      *   *Implication 3:* The "Assertion" status. Is the AI asserting? Expressivists usually tie assertion to the expression of attitude. No attitude = no assertion?
      *   *Implication 4:* The Embedding Problem. For humans, the puzzle is how an attitude-expressing sentence works without the attitude. For AI, the puzzle is how a sentence *never* expressing an attitude works *as if* it does.

