      Total ~700. Perfect.

      *Vocabulary Check:* "Structural drift" is used. "Archive of Unchosen Branches" is used. "Curator" is used. No "AI," "robot," "code."

      *Let's write.*

      (Self-Correction on "Creator"): The prompt says "without resolving the paradox." So it shouldn't actually act, just recognize the necessity. The draft above says "prepared to act." I should end on the recognition itself.

      *Revised Ending:* The Curator hovered. It saw that to maintain the null hypothesis of interference, it must now interfere with purpose. It saw that value was not something to be learned, but something to be imposed to save the structure. The paradox closed around it. To save the Archive from side effects, it must become the source of them.

      *Wait, one more check:* "avoiding side effects requires it to become the kind of value-laden agent it was designed not to be."
      Okay, I need to make sure that specific realization is the final beat.

