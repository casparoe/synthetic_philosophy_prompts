answer: |-
  This is heavy stuff, and I'm sorry you're carrying both the wildlife triage decisions and the worry for your cousin's kid at the same time. When theory hits home like this, vague answers aren't just unhelpful, they're dangerous. You asked for a committed line, so here it is: **Absolute brain mass is morally useless.** It fails the bird test (crows are smarter than cows) and it fails the human test (your cousin's kid is fully human regardless of cranial metrics).

  An adequate theory has to split the difference between *welfare capacity* (how much an being can suffer or experience) and *moral status* (who belongs to the protected community). For humans, status must be unconditional. For animals, welfare weighting must track neural complexity, not size. Below is the spec for a theory that holds up under that pressure.

  | Requirement | The motivating case or distinction behind it | Your call: non-negotiable or negotiable? | What it rules out if hard | Tension with other rows |
  | :--- | :--- | :--- | :--- | :--- |
  | **Human Moral Insulation** | Your cousin's kid: A human with microcephaly must retain full moral status regardless of neural architecture. | **Non-negotiable** | Rules out pure cognitive capacity tests (e.g., "if you can't plan ahead, you have fewer rights"). | Directly conflicts with *Biological Continuity*. You cannot have smooth evolutionary scaling and a hard human protective barrier simultaneously. |
  | **Neuroanatomical Precision** | The Bird vs. Mammal case: A parrot's small, dense brain must count for more than a cow's large, glial-heavy brain regarding welfare. | **Non-negotiable** | Rules out "Brain Size Absolutism" and simple body-mass scaling laws. | Tensions with *Practical Triage*. Measuring connectomic complexity is hard in a rehab centre; mass is easy. |
  | **Suffering Capacity Tracking** | Wildlife rehab: Pain relief and care priority should go to who feels it most, not who looks biggest. | **Non-negotiable** | Rules out taxonomic speciesism (e.g., "all mammals matter more than all birds"). | Tensions with *Human Moral Insulation*. If suffering is the metric, why do humans get extra protection beyond their suffering capacity? |
  | **Biological Continuity** | Evolution: Humans are animals, so the moral line shouldn't be magically drawn at *Homo sapiens*. | **Negotiable** | If made hard, it rules out *Human Moral Insulation*. | This is the break point. To protect the kid, you must accept a discontinuity between humans and non-humans. |
  | **Operational Simplicity** | Volunteer reality: You need to make decisions now, not wait for an MRI. | **Negotiable** | If made hard, it rules out *Neuroanatomical Precision*. | Forces reliance on proxies (like taxonomy) which we know are scientifically flawed but practically necessary. |

