  3.  **Value of CONTINUE:**
      *   If at **1st Intersection** (prob 3/5): He continues. He arrives at the 2nd Intersection. There, he follows the plan ($p=1/3$).
          *   Expected payoff at 2nd Intersection = $(1/3 \times 4) + (2/3 \times 1) = 4/3 + 2/3 = 2$.
          *   So, value of Continuing from 1st = 2.
      *   If at **2nd Intersection** (prob 2/5): He continues. He reaches the end.
          *   Payoff = 1.
      *   **Total Expected Payoff:**
          $$E(\text{CONTINUE}) = (3/5 \times 2) + (2/5 \times 1) = 6/5 + 2/5 = 8/5 = 1.6$$
  4.  **Comparison:** $E(\text{EXIT}) = 1.6$ and $E(\text{CONTINUE}) = 1.6$.
