answer: |-
  **MEMORANDUM**

  **TO:** Civic Technology Oversight Committee, Regional Public-Library Consortium
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Participatory-Budgeting Platform Contract Renewal

  **Recommendation**
  I recommend that the Committee vote to **renew the vendor contract for a provisional period of 12 months**, contingent upon the implementation of specific enforceable design conditions. These conditions must be met within 90 days of signing. While the platform's use of narrative framing presents genuine ethical risks regarding user autonomy, these risks are mitigatable through structural design changes that preserve the tool's capacity for civic engagement without surrendering deliberative integrity.

  **Ethical Analysis: Structural vs. Substantive Manipulation**
  To evaluate the vendor, we must distinguish between two forms of influence. *Substantive manipulation* distorts the reason-giving structure itself—for example, by falsifying data, hiding costs, or lying about outcomes. There is no evidence the vendor engages in this; the numerical data embedded in the narratives is factually accurate.

  The objection raised by my colleague concerns *structural manipulation*. This occurs when a interface exploits cognitive architecture (such as affective heuristics or framing effects) to bypass rational deliberation. When a user reads a story about a "single mother struggling to afford fees" rather than viewing a spreadsheet of millage rates, the emotional valence may determine the decision before the fiscal logic is processed. This compromises autonomy not by lying, but by hijacking the *process* of judgment. If the system is designed to trigger an emotional response that overrides deliberative capacity, it treats the user as a subject to be managed rather than a citizen to be persuaded.

  **The Role of Reversibility**
  The moral assessment hinges on *reversibility of framing*. Autonomy is preserved if the user retains the capacity to access the raw numerical presentation without the narrative overlay. If the narrative is the only lens through which the data is visible, the framing is coercive; the user is forced to deliberate within the vendor's emotional context. However, if the interface offers a "data view" toggle that strips the narrative and presents the fiscal trade-offs neutrally, the narrative becomes an optional heuristic rather than a structural constraint. Reversibility transforms the narrative from a cage into a tool, allowing the user to choose the level of abstraction suitable for their deliberation.

  **Strongest Consideration Against Renewal**
  I must accord full weight to the argument for termination. The strongest consideration against my recommendation is that cognitive framing effects are often involuntary and persist even after exposure to raw data. Psychological research suggests that "anchoring" occurs immediately upon exposure to the narrative; providing a "data view" toggle may not fully erase the initial emotional priming. From this perspective, reversibility is an illusion of choice. If the narrative architecture inevitably biases the user's weighting of values, then the platform compromises civic autonomy regardless of factual accuracy or toggle availability. This view holds that public budgeting tools must be agnostic to affect to be legitimate, and that any attempt to "gamify" or "story-fy" fiscal trade-offs is inherently paternalistic.

  **Justification for Conditional Renewal**
  While the autonomy objection is philosophically sound, a strict prohibition on narrative framing risks a different ethical failure: exclusion. Complex budgetary data presented without contextualization often leads to disengagement among non-expert users. If the barrier to entry for civic participation is high technical literacy, we effectively silence portions of our community. Disengagement is also a threat to autonomy; a citizen cannot exercise self-governance if they cannot comprehend the choices before them.

  Therefore, the lesser ethical risk lies in retaining the narrative tool *provided* we enforce strict reversibility. We prioritize engagement while safeguarding the right to verify. The narrative invites the user in; the raw data allows them to judge.

  **Enforceable Conditions (90-Day Implementation Window)**
  1.  **Mandatory Data Toggle:** Every narrative screen must feature a persistent, high-visibility control to view the underlying raw data (millage rates, total costs, percentage allocations) without narrative text.
  2.  **Default Neutrality:** The system must not default to the narrative view for returning users who have previously selected the data view.
  3.  **Audit Trail:** The vendor must provide a quarterly report on user interaction with the toggle to ensure the "data view" is not being dark-patterned (e.g., hidden behind multiple clicks).

  **Criteria for Future Vendor Reviews**
  To guide future procurement, the Committee should adopt the following criteria for civic technology:
  *   **Transparency of Mechanism:** Vendors must disclose how their algorithms or interfaces prioritize information.
  *   **Frictionless Verification:** Users must be able to verify claims (raw data) with no more than one click from any persuasive claim (narrative).
  *   **Cognitive Liberty:** Interfaces must not utilize involuntary physiological triggers (e.g., countdown timers, infinite scroll) in civic decision-making contexts.
  *   **Exit Rights:** Users must be able to export their data and decisions in a neutral format.

  By renewing with these conditions, we acknowledge that while technology shapes thought, it need not dictate it. We can demand tools that respect the citizen's mind as fully as they seek to engage the citizen's heart.
