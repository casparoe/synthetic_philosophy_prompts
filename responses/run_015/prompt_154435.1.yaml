      4.  Tier 3: Awkward (Processing Speed, Low-level Perception).
      5.  The Insulation Analysis (Is it a tautology?).
      6.  Defender's Rejoinder (How they would parry).
      7.  Final Assessment.

  8.  **Final Review against Prompt:**
      *   Ranked map? Yes.
      *   Empirical findings (developmental, neuro)? Yes.
      *   Conceptual/formal results? Yes.
      *   Insulation/Unfalsifiability? Yes.
