answer: |-
  # Diagnostic Instrument: The Material Constitution Decision Tree

  **Purpose:** This instrument is designed to map a participant's intuitive commitments regarding material objects without relying on prior knowledge of philosophical terminology. It uses the "Statue and Clay" scenario as a consistent probe.

  **Instructions:** For each question, select the answer that best reflects your judgment about the case described. There are no "correct" answers; the goal is to locate your position within the logical space of metaphysical possibilities.

  ---

  ## Part I: The Diagnostic Questions

  **Q1. The Existence Check**
  Imagine a collection of particles arranged in the shape of a statue. Does a single object (a "statue") exist over and above those particles, or are there *only* the particles arranged that way?
  *   (A) Only the particles exist.
  *   (B) A statue object also exists.

  **Q2. The Identity Check**
  Assume the statue exists. Is the statue *numerically the same thing* as the lump of clay it is made from? (i.e., Are they one object with two names, or two distinct objects?)
  *   (A) They are one and the same object.
  *   (B) They are two distinct objects.

  **Q3. The Squash Test (Modal Divergence)**
  Imagine you take the statue and squash it into a shapeless ball. The clay still exists, but the statue is ruined. Does this mean the clay survives while the statue ceases to exist?
  *   (A) Yes, the clay survives but the statue is destroyed.
  *   (B) No, if one is destroyed, the other must be too (because they are the same).
  *   (C) No, the statue survives (it is just a bent statue).

  **Q4. The Overlap Test (Co-location)**
  If you answered that they are *two distinct objects* (Q2-B), can these two objects occupy the exact same space and be made of the exact same physical pieces at the same time?
  *   (A) Yes, two distinct things can be in the same place at the same time.
  *   (B) No, two distinct material things cannot share the same space/parts.

  **Q5. The Replacement Test (Mereological Essentialism)**
  Imagine you gradually replace every single particle of the clay with new clay over a year. Is the resulting object the same statue you started with?
  *   (A) Yes, it is the same statue.
  *   (B) No, the original statue ceased to exist when the first part was removed.

  **Q6. The Time-Slice Test (Temporal Parts)**
  Is the statue sitting here right now the *whole* object, or is it just a temporary "stage" or "slice" of a larger object that stretches through time (like a movie reel)?
  *   (A) It is the whole object, present entirely right now.
  *   (B) It is just a temporal stage of a longer object extending through time.

  **Q7. The Form Test (Hylomorphic Commitment)**
  Is the "shape" or "organization" of the clay a real, fundamental component of the statue, without which the matter is not actually a statue (even if the matter is still there)?
  *   (A) Yes, the form/organization is a real constituent that unites the matter.
  *   (B) No, the form is just a description of how the matter is arranged.

  ---

  ## Part II: The Decision Key & Logical Map

  Below is the mapping of answer combinations to named philosophical positions. Note that some paths lead to established views, while others lead to logical gaps.

  ### **Path 1: The Eliminativist Route**
  *   **Answers:** Q1(A)
  *   **Position:** **Mereological Nihilism**
  *   **Description:** Composite objects (like statues) do not exist; only simple particles exist.
  *   **Status:** Occupied.

  ### **Path 2: The Monist Route**
  *   **Answers:** Q1(B) → Q2(A)
  *   **Sub-Branch A:** Q3(B) & Q5(A)
      *   **Position:** **Standard Identity Theory**
      *   **Description:** Statue = Clay. They share all properties. If the clay survives squashing, so does the statue (perhaps as a damaged statue).
      *   **Status:** Occupied.
  *   **Sub-Branch B:** Q3(B) & Q5(B)
      *   **Position:** **Mereological Essentialism (Monist variant)**
      *   **Description:** Statue = Clay, but parts are essential. Removing a particle destroys both.
      *   **Status:** Occupied.

  ### **Path 3: The Pluralist Route (Distinct Objects)**
  *   **Answers:** Q1(B) → Q2(B)

  #### **Branch 3.1: No Co-location**
  *   **Answers:** Q4(B)
  *   **Position:** **Dominant Kind Theory** (or Sortal Essentialism)
  *   **Description:** Only one object exists in this space (usually the statue). The "clay" is just a description of the matter, not a distinct object.
  *   **Status:** Occupied.
  *   *(Note: If the participant insists two objects exist but cannot share space, they may be committed to a micro-physical separation view, which is generally considered unstable in this context.)*

  #### **Branch 3.2: Co-location Permitted**
  *   **Answers:** Q4(A)
      *   **Sub-Branch 3.2.1: 3D / Endurantist**
          *   **Answers:** Q6(A)
          *   **Further Split:**
              *   **Q7(A) (Form is real):** **Hylomorphic Constitution View**
                  *   **Description:** Statue and Clay are distinct. They coincide, but the Statue is a compound of Matter + Form. The Form is ontologically inseparable from the Matter in the substance, yet the identity conditions differ (Clay can lose form; Statue cannot).
                  *   **Status:** Occupied (Requested Variant).
              *   **Q7(B) (Form is description):** **Standard Constitution Theory** (e.g., Baker)
                  *   **Description:** Statue constitutes Clay (or vice versa). They share space but have different persistence conditions based on kind properties.
                  *   **Status:** Occupied.
              *   **Q3(A) (Divergence) vs Q3(B) (No Divergence):**
                  *   **If Q3(B) (No Divergence) + Q5(A) (No Essentialism):** **UNOCCUPIED GAP**
                  *   **Diagnosis:** **Incoherent / Unstable.** This position claims there are two distinct objects that share all parts, survive all the same changes, and have no essential differences in form. This violates the Indiscernibility of Identicals without offering a ground for distinction. It posits plurality without difference.
      
      *   **Sub-Branch 3.2.2: 4D / Perdurantist**
          *   **Answers:** Q6(B)
          *   **Further Split:**
              *   **Q3(A) (Divergence):** **Four-Dimensionalist Stage-Coincidence**
                  *   **Description:** The "Statue" and "Clay" are distinct temporal stages of two different four-dimensional "worms." They overlap at this time slice but have different future slices (e.g., the Clay-worm continues after squashing; the Statue-worm does not).
                  *   **Status:** Occupied (Requested Variant).
              *   **Q3(B) (No Divergence):** **UNOCCUPIED GAP**
                  *   **Diagnosis:** **Unexplored / Redundant.** If the worms share all temporal parts (past, present, and future), they are identical worms. Positing two worms that are exactly co-extensive in spacetime is ontologically profligate with no explanatory gain.

  ---

  ## Part III: Analysis of Gaps and Indistinctions

  ### 1. Flagged Unoccupied Combinations
  The tree identifies specific nodes in the logical space that lack committed defenders.

  *   **The "Bare Pluralist" Gap:**
      *   **Coordinates:** Distinct Objects (Q2-B) + Co-location (Q4-A) + No Modal Divergence (Q3-B) + No Mereological Essentialism (Q5-A).
      *   **Diagnosis:** **Incoherent.** This position asserts that Statue and Clay are two things, occupy the same space, share all parts, and survive/cease to exist under exactly the same conditions. Without modal divergence (different survival conditions) or mereological divergence (different parts), there is no principle of individuation. This violates Leibniz's Law.
  *   **The "Static Worm" Gap:**
      *   **Coordinates:** 4D View (Q6-B) + No Modal Divergence (Q3-B).
      *   **Diagnosis:** **Unstable.** In 4D terms, objects are defined by their spacetime extension. If two worms share every temporal part, they are one worm. Distinguishing them requires divergent futures (modal divergence).

  ### 2. Indistinguishable Positions (Underdetermined Nodes)
  Certain named positions yield identical answers on this specific instrument, requiring supplementary questioning to separate.

  *   **Standard Constitution Theory vs. Coincidentalism:**
      *   **The Overlap:** Both views typically answer: Distinct Objects, Co-location Permitted, Modal Divergence (Statue dies, Clay lives), 3D View.
      *   **The Difference:** *Constitution Theory* (e.g., Lynne Baker) often claims the Statue is the primary object and the Clay exists only derivatively or relationally. *Coincidentalism* (e.g., David Lewis, Michael Burke) claims both are equally real objects that happen to coincide.
      *   **Supplementary Distinction Needed:** Ask about **ontological priority**. "Is the clay an object in its own right, or is it only 'clay' because it constitutes a statue?" Alternatively, ask about **property inheritance**: "Does the statue have the property 'is clay' essentially, or only derivatively?"

  *   **Hylomorphic Constitution vs. Standard Constitution:**
      *   **The Overlap:** Both allow distinct identity conditions and co-location (broadly construed).
      *   **The Difference:** As mapped in Q7, Hylomorphism treats "Form" as a constituent. Standard Constitution treats "Kind Properties" as the differentiator.
      *   **Supplementary Distinction Needed:** Ask about **causal power**. "Does the 'shape' or 'form' of the statue have any causal power to keep the parts together, or is it just the physical forces between the particles?" Hylomorphists typically affirm formal causality; Constitution theorists typically deny it.

  *   **Mereological Essentialism (Monist) vs. Eliminativism:**
      *   **The Overlap:** Both deny that the statue survives particle replacement (Q5-B).
      *   **The Difference:** The Essentialist says the statue exists but is fragile. The Eliminativist says the statue never existed at all.
      *   **Supplementary Distinction Needed:** Ask about **singular terms**. "When I point and say 'That is a statue,' have I referred to something real?" Essentialists say Yes; Eliminativists say No (or that I have referred only to the particles).

  ### 3. Instructor's Note on the "Hylomorphic" Node
  The **Hylomorphic Constitution View** (Q7-A) is placed in the 3D Pluralist branch. Be aware that some Aristotelian Hylomorphists might reject the framing of Q2 ("Are they two distinct objects?"). They may argue that Matter and Form are distinct *principles* but the Composite is *one substance*. If a participant objects to Q2, probe whether they believe the "Clay" exists as a substance *before* becoming the statue. If they say "No, it is only potentially clay," they are **Substantial Hylomorphists**, a variant not fully captured by the binary tree but locatable near the Hylomorphic Constitution node.
