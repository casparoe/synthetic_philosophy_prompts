          *   *Interpretive Method:* "Causal-Historical Statutory Interpretation." Investigate what in the world the legislators were causally connected to.

  4.  **Refining the Philosophical Nuance (PhD Level):**

      *   *Sense vs. Reference:* Make sure to distinguish fixing the *mode of presentation* (dictionary) vs. fixing the *extension* (world).
      *   *Descriptivism:* The dictionary practice looks descriptivist, but *Nix* shows it's actually about *communicative content* (Grice).
      *   *Division of Linguistic Labor:* The Court implicitly acknowledges this by deferring to experts in technical statutes but rejecting it in ordinary statutes (*Nix*).
      *   *Underdetermination:* Emphasize that legal interpretation is not metaphysics. It's normative. The "meaning" sought is *legal meaning*, which supervenes on semantic meaning but includes purpose.

  5.  **Structuring the Argument:**

