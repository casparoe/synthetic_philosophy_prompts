      *   *Nix v. Hedden:* This is the "Ordinary Meaning" canon. It prioritizes pragmatic usage over scientific taxonomy. This aligns with Wittgensteinian "use" or Gricean implicature/conversational context, but specifically *legal* pragmatics. It rejects the "scientific essence" in favor of "folk ontology."
      *   *Expert Deference:* This aligns with Putnam/Burge style Externalism. The meaning/reference is fixed by experts (division of linguistic labor). "Water is H2O" regardless of what the layman thinks.
      *   *The Tension:* How can you use dictionaries (descriptivist/internalist leaning) *and* defer to experts (externalist) *and* ignore both for ordinary trade usage (pragmatic/contextualist)?

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the query. Validate the tension. State the thesis: The practice is theoretically hybrid and pragmatically driven, not semantically monolithic. It presupposes a form of *contextual descriptivism* but is underdetermined regarding metaphysics of reference.

      *   **1. The Dictionary Practice & Theory of Meaning:**
          *   *Presupposition:* It presupposes that meaning is *publicly accessible* and *temporally fixed*. It leans towards Descriptivism (Fregean sense) because it treats the definition as constitutive of the meaning.
          *   *Community Competence:* It assumes a homogeneous "public meaning" (the "reasonable person" of the era). It ignores registers (technical vs. ordinary).
          *   *Strict Presupposition vs. Comfort:* It *strictly* presupposes that words have stable public meanings at $t_1$. It does *not* strictly presuppose that reference is fixed by description (it could just be fixing the *concept* applied), but it sits comfortably with internalism.

