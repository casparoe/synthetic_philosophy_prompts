answer: |-
  This is a remarkably precise formulation of a tension that lies at the heart of originalist and textualist jurisprudence. You have identified a tripartite inconsistency in the Supreme Court's semantic behavior: (1) **Lexical Descriptivism** (dictionary lookup), (2) **Pragmatic Conventionalism** (*Nix v. Hedden*), and (3) **Deferential Externalism** (expert classification).

  To answer your questions directly: The Court's practice is not semantically monolithic. It does not strictly presuppose a single theory of meaning. Rather, it presupposes a **normative theory of legislative authority** that treats semantic theories as tools. However, we can dissect the semantic commitments it *leans* on, where it is *underdetermined*, and how a genuine externalist jurisprudence would differ.

  Here is an analysis structured by your specific queries.

  ---

  ### 1. The Dictionary Practice: Presuppositions and Commitments

  When the Court consults Johnson or Webster to fix the meaning of a constitutional term (e.g., "cruel," "arms," "commerce"), what is the semantic commitment?

  **Strict Presuppositions:**
  *   **Stability of Sense:** The practice strictly presupposes that the *mode of presentation* (Fregean *Sinn*) associated with a term was stable and accessible at the time of enactment ($t_1$).
  *   **Public Accessibility:** It presupposes that meaning is a public fact, recoverable via public artifacts (dictionaries), rather than a private mental state or a hidden causal history.
  *   **Temporal Fixity:** It presupposes that the semantic content relevant for legal authority is fixed at $t_1$ and does not drift with subsequent usage (unless the text is amended).

  **Comfortable but Non-Essential Commitments:**
  *   **Descriptivism:** The practice sits *comfortably* with Fregean or Russellian descriptivism (meaning is given by a cluster of descriptions). However, it does not *strictly presuppose* it. One could argue the dictionary merely captures the *epistemic access* the enacting community had to a causally fixed reference.
  *   **Homogeneity:** The practice assumes a "single community-wide competence." It treats the dictionary entry as representative of the "public," ignoring sociolects, registers, or the division of linguistic labor. This is a **sociolinguistic simplification** required by the legal fiction of the "reasonable person," not a strict semantic claim that no variation existed.

  **Underdetermination:**
  The practice is underdetermined regarding **Reference**. A dictionary entry fixes a *concept*, but not necessarily an *extension*. If the 1828 dictionary defines "gold" as "a yellow, malleable metal," and the statute regulates "gold," does the term refer to the *description* (fool's gold counts) or the *element* (Au)? The dictionary practice alone does not decide this. It fixes the *sense* employed by the legislature, but leaves open whether that sense determines reference descriptively or causally.

  ---

  ### 2. *Nix v. Hedden* and the Rejection of Essence

  In *Nix*, the Court rejected the botanical definition (fruit) and the dictionary definitions in favor of the "ordinary meaning" in the context of trade (vegetable).

  **Is this inconsistent with the Dictionary Practice?**
  Semantically, yes. Pragmatically, no.
  *   **Semantic Inconsistency:** If the dictionary practice presupposes that lexicographical definitions constitute meaning, *Nix* violates this by treating dictionaries as mere "aids."
  *   **Pragmatic Consistency:** *Nix* is best understood not as a semantic ruling, but as a **Gricean/Pragmatic** one. The Court reasoned that the *purpose* of the tariff act was to regulate "provisions" (food). In the conversational context of the marketplace, "vegetable" implicated culinary usage, not botanical taxonomy.

  **Theory of Meaning in *Nix*:**
  *Nix* presupposes **Contextualism** or **Use-Theory**. Meaning is not inherent in the word or the object's essence, but in the word's function within a specific form of life (here, the commercial exchange of provisions).
  *   **Sortal Terms:** The Court treats "vegetable" not as a natural-kind term (which would invite externalism) but as a **functional kind term**. For functional kinds, the "essence" is the use, not the internal structure.
  *   **Strict Presupposition:** The only strict presupposition here is that **statutory purpose constrains semantic extension.** If the statute regulates botany, the botanical definition wins. If it regulates tariffs on food, the culinary definition wins.

  ---

  ### 3. Expert Deference and the Division of Linguistic Labor

  In regulatory settings (e.g., FDA defining "drug," EPA defining "pollutant"), courts defer to agency expertise.

  **Compatibility with Externalism:**
  This is the one area where the Court behaves as a **Semantic Externalist** (à la Putnam/Burge).
  *   **Division of Linguistic Labor:** The Court acknowledges that for technical terms, the "meaning" is held by specialists, not the general public. The extension of "navigable waters" or "controlled substance" is fixed by the underlying physical or biological reality, as identified by experts.
  *   **Strict Presupposition:** This practice strictly presupposes that **reference outruns conception.** The lay legislator may not know the chemical structure of a drug, but the statute can still refer to it.

  **The Tension:**
  Why does the Court use dictionaries for "arms" (1789) but defer to scientists for "navigable waters" (1972)?
  *   **Explanation:** It depends on the **Domain of Regulation**.
      *   If the text regulates *ordinary conduct* (Constitutional rights, common law crimes), the Court assumes the **Ordinary Meaning** canon (public understanding).
      *   If the text regulates *technical domains* (administrative state), the Court assumes the **Technical Meaning** canon (expert understanding).

  ---

  ### 4. Can a Single Doctrine Accommodate All Three?

  Yes, but not a *semantic* doctrine. A **Communicative Intentionalist** or **Contextualist** doctrine unifies them.

  **The Unifying Doctrine: "Legislative Communicative Content"**
  The Court is not looking for "Truth" or "Metaphysical Essence." It is looking for **what the legislature communicated to the relevant audience.**
  1.  **Dictionary Lookup:** Evidence of what the *general public* (the audience for the Constitution) would have understood the words to convey at $t_1$.
  2.  ***Nix*:** Evidence of what the *commercial community* (the audience for the Tariff Act) understood the words to convey in that context.
  3.  **Expert Deference:** Evidence of what the *technical community* (the audience for the Regulatory Act) understands the terms to designate.

  **Is it Internally Inconsistent?**
  *   **Semantically:** Yes. It switches between Descriptivism (dictionaries), Pragmatism (*Nix*), and Externalism (experts).
  *   **Normatively:** No. It is consistent with a theory of **Democratic Legitimacy**. The law binds people based on what they could reasonably understand the law to mean.
      *   For the Constitution, the "people" are the general public (Dictionaries).
      *   For Tariffs, the "people" are merchants (*Nix*).
      *   For Regulations, the "people" are regulated industries (Experts).

  **Where it is Underdetermined:**
  The practice is underdetermined on the **Metaphysics of Sortals**. When the Court uses a dictionary for a natural-kind term (e.g., "waters," "species"), it is unclear if they are fixing the *description* (1828 understanding of water) or the *kind* (H2O). Current originalist practice tends to treat the *description* as the legal constraint, effectively rejecting externalism for constitutional terms even if it accepts it for regulatory terms.

  ---

  ### 5. What if the Court Took Externalism Seriously?

  If the Court adopted a rigorous **Causal-Historical Theory of Reference** (Kripke/Putnam) for legal interpretation, the interpretive method would change radically. This is distinct from "Living Constitutionalism"; it is "Externalist Originalism."

  **Current Method (Descriptivist/Epistemic):**
  *   *Question:* What descriptions did the enactors associate with term $X$?
  *   *Result:* If 1791 "arms" meant "muskets," then "arms" = muskets (or things functionally equivalent to muskets based on 1791 descriptions).

  **Externalist Method (Causal/Metaphysical):**
  *   *Question:* What in the world were the enactors causally connected to when they used term $X$?
  *   *Result:* If "arms" refers to the functional kind *weapons used for defense*, the reference is fixed by that function, not the 1791 description. If "cruel punishment" refers to a natural kind of *moral wrongness*, the extension is determined by the moral facts, not 1791 beliefs.

  **Specific Implications:**
  1.  **Natural Kinds in Statutes:** If a 1900 statute bans "injecting oil into whales," and we discover whales are mammals not fish, an externalist court asks: "Did they mean the biological kind *Cetacea* or the folk kind *Fish*?" If the reference was fixed by the biological kind (even if they were ignorant of it), the statute applies. Current practice often relies on the *folk kind* (the description).
  2.  **The "Same Kind" Problem:** In *Nix*, an externalist might argue: "The botanical essence is the fixed reference. The tariff law intended to tax *that essence*." The Court rejected this. An externalist court would have to justify *why* the culinary context overrides the biological causal chain. (Likely by arguing the term "vegetable" in the statute was a *functional* term, not a natural-kind term).
  3.  **Constitutional Terms:** If "equal protection" refers to a moral natural kind, an externalist court might conclude that segregation violates it *even if* the 1868 public believed otherwise. The reference (moral equality) is fixed, but our *knowledge* of the extension improves. This looks like living constitutionalism, but it is grounded in semantic externalism (reference is stable, epistemic access evolves).

  ### Summary for the Seminar

  To characterize this for your law colleagues, I suggest the following distinctions:

  1.  **The Dictionary Practice** is **Epistemic**, not Metaphysical. It uses dictionaries to reconstruct the *public epistemic state* at enactment, not to define the *metaphysical essence* of the referent.
  2.  **The *Nix* Practice** is **Pragmatic**. It prioritizes *communicative intent* over *semantic literalism*. It acknowledges that words take their meaning from the "language game" being played (tariffs vs. botany).
  3.  **The Expert Deference** is **Externalist**. It acknowledges the **Division of Linguistic Labor**, conceding that for technical statutes, the "meaning" resides in the expert community, not the judicial or general public mind.

  **The Verdict:** The pattern is **semantically pluralist** but **normatively unified**. It is not inconsistent if one views "legal meaning" as a distinct category that supervenes on semantic meaning but is selected based on the **normative aim of the statute** (fair notice for criminal/constitutional law vs. effective regulation for administrative law).

  If they took externalism seriously across the board, they would have to stop asking "What did this word describe in 1789?" and start asking "What natural or functional kind was this word latched onto in 1789?"—a shift that would destabilize much of modern originalist jurisprudence.
