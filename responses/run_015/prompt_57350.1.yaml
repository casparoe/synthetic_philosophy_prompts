          *   *Internal Consistency:* It is *pragmatically* consistent (aims to effectuate legislative intent/purpose) but *semantically* pluralist. It switches semantic theories based on the *type of term* (ordinary vs. technical) and the *purpose of the statute*.
          *   *Underdetermination:* The practice doesn't decide between Frege and Kripke. It uses whatever tool fixes the *legal extension* required by the text's purpose.

