answer: |-
  This is a sharp argument, and it's no surprise it's keeping you up at night. It's a sophisticated version of a classic problem in moral philosophy: the tension between **decision procedures** (how we decide what to do) and **criteria of rightness** (what actually makes an act right).

  Your roommate's argument is a *reductio ad absurdum*: it tries to show that combining Indirect Normativity (1) with Idealized Deliberation (5) leads to the absurd conclusion that you shouldn't save a drowning child (8). Since (8) is obviously false, the argument is unsound.

  You can absolutely keep **(1)** and **(5)**. The slip happens earlier, in the characterization of the "perfect system."

  ### The Slip: Step (6) (Supported by Step 2)

  **Step (6) is false.** It claims: *"My idealized self already has the perfect indirect systems in place, so in any particular situation she wouldn't deliberate about R."*

  This step assumes that a "perfect indirect system" looks like a rigid script or a reflex arc that never requires conscious input. But if you hold onto **(5)** (Idealized Deliberation = fully informed, unbiased reflection), your idealized self would know something your roommate is ignoring: **Habits fail in novel situations.**

  A truly "perfect" indirect system isn't a closed loop of automation; it is a **dynamic architecture**. It includes:
  1.  **Heuristics:** Automatic habits for common cases (e.g., "wash hands before handling food at the shelter").
  2.  **Override Mechanisms:** A meta-habit that says, *"If the situation feels unfamiliar or high-stakes, switch to direct deliberation."*

  If your idealized self is truly "fully informed" (per premise 5), she knows that no set of pre-programmed habits can cover every possible moral contingency. Therefore, her "perfect system" *must* include direct deliberation as a tool to be deployed when the habits go silent or conflict.

  By claiming the idealized self *never* deliberates, Step (6) contradicts Step (5). An ideal deliberator would not choose a system that forbids deliberation.

  ### The Logical Gap: Step (4)

  There is also a logical overreach in **Step (4)**.
  *   **Premise (1)** says: Use habits *when* following a rule directly is "hard or unreliable."
  *   **Conclusion (4)** says: Stop deliberating *altogether*.

  This ignores the condition in (1). If a situation arises where your habit is silent (e.g., a shelter guest presents a complex ethical dilemma you've never seen before), direct deliberation is no longer "unreliable"—it is the *only* reliable tool you have. Step (4) universalizes a conditional strategy.

  ### How to Keep (1) and (5)

  You don't have to sacrifice your intuitions. Here is how they fit together once you reject (6):

  *   **Keep (1) (Indirect Normativity):** Yes, build routines. At the shelter, you shouldn't have to deliberate about whether to be kind to every guest; that should be a habit. This reduces cognitive load and prevents burnout.
  *   **Keep (5) (Idealized Deliberation):** Yes, what you *ought* to do is what you would choose upon reflection. This is your safety net. When your habit feels wrong, or the situation is new, you engage your "idealized self" to deliberate.
  *   **Reject (6):** Your ideal self doesn't just run on autopilot. She drives a car with both cruise control (habits) and a steering wheel (deliberation). She uses cruise control on the highway, but she grabs the wheel in a storm.

  ### The Cost of Giving Up Step (6)

  You asked what the cost is of giving up the step that slips. Since the slip is in **(6)**, the cost of rejecting it is actually a **benefit**, though it comes with a burden:

  1.  **Loss of Moral Certainty:** If you accept (6), you get the comfort of thinking, "If my habit says it's okay, it *is* okay." Rejecting (6) means admitting that even your best habits might need overriding. You have to stay humble.
  2.  **Cognitive Effort:** You cannot fully outsource your morality to your routines. You must remain vigilant for "edge cases" where the routine doesn't fit.
  3.  **Responsibility:** In the drowning kid case, you can't say, "My system didn't tell me to jump." You are responsible for recognizing that the emergency overrides the system.

  ### What If You *Had* to Give Up (1) or (5)?

  Just for the sake of the argument, here is the cost if the argument had forced you to drop one of your core premises:

  *   **If you gave up (1) (Indirect Normativity):** You would have to deliberate about *every* moral act from first principles. At the shelter, you'd have to philosophically justify every spoonful of soup you serve. This leads to **moral exhaustion** and paralysis. You'd be less effective because you'd be too busy thinking to act.
  *   **If you gave up (5) (Idealized Deliberation):** You would lose your ability to correct your habits. If your "shelter routine" accidentally became dehumanizing (e.g., treating guests like numbers to process efficiently), you would have no standard to judge that against. You become a **dogmatist**, unable to learn or adapt when your routines cause harm.

  ### Application to Your Volunteering

  Your feeling of "second-guessing" isn't necessarily a failure of your system; it might be the **override mechanism working**.

  *   **Routine:** "Serve food to everyone in line."
  *   **Second-Guessing:** "Wait, this person looks like they need a conversation more than food right now," or "This rule feels unfair in this specific case."

  Your roommate wants you to view that second-guessing as a bug (a disruption of automaticity). Philosophy suggests it's a feature (the idealized self checking the habit).

  **The Exit:** Tell your roommate that Step (6) assumes a "perfect system" is a **robot**, when a perfect system is actually a **wise human**. A wise human uses habits to save energy, but keeps their hand on the wheel for the drowning kids. You can keep your routines *and* your duty to deliberate when it counts.
