answer: |-
  # JOINT STATEMENT ON FUNCTION ATTRIBUTION IN BIOLOGY
  **Prepared for the Adversarial Collaboration on Biological Explanation**
  **Date:** October 26, 2023
  **Parties:** The Etiological Working Group (EWG) and The Systemic Working Group (SWG)

  ## 1. Glossary of Agreed Terminology

  To prevent terminological stalemate, the following definitions are adopted for the purpose of this document. These definitions describe *usage* without committing either party to the ontological priority of the concept.

  *   **Function:** The explanatory role assigned to a trait, item, or process within a biological context. (Note: Parties disagree on the *conditions* under which this assignment is valid, but agree on the term's usage in practice).
  *   **Proper Function (Etiological):** A function ascribed on the basis of the trait's history of selection. (EWG term).
  *   **Systemic Function (Causal-Role):** A function ascribed on the basis of the trait's current contribution to a capacity of a containing system. (SWG term).
  *   **Malfunction:** A state in which a trait fails to perform the activity required by its function attribution. Both parties agree malfunction attributions occur; they disagree on the standard (historical vs. systemic) by which failure is judged.
  *   **Design:** The organization of parts to achieve an end. EWG restricts this to outcomes of selection or intention; SWG allows this to describe any organized system where parts contribute to a whole, regardless of origin.
  *   **Selected Effect:** An effect of a trait that causally explains the trait's proliferation or maintenance in a population via a feedback loop (replication or reinforcement).
  *   **System:** A bounded entity containing interacting components, analyzed at a specific level (e.g., cell, organism, ecosystem).

  ## 2. Agreed Claims

  The following claims represent the intersection of the Etiological and Systemic accounts. These are non-vacuous commitments specific to the philosophy of biology.

  1.  **Paradigm Convergence:** In standard cases (e.g., the vertebrate heart), both accounts assign the same function (pumping blood) and agree this function explains the trait's presence in the model.
  2.  **Function-Effect Distinction:** Both parties agree that not every causal effect of a trait is a function. A heart making a 'thump' sound is an effect; pumping blood is a function. The accounts differ on *why* the distinction holds, but agree that the distinction itself is biologically necessary.
  3.  **Malfunction Reality:** Both parties agree that biological traits can malfunction. A heart that fibrillates is not merely 'doing something else'; it is failing. Both accounts must accommodate the normativity inherent in this judgment.
  4.  **Multi-Level Attribution:** Function attributions are valid and necessary at the molecular (gene/protein), cellular, organismal, and (in specific contexts) group levels. Neither party reduces all function to the organismal level exclusively.
  5.  **Artifact Analogy:** Both parties agree that engineered systems (e.g., a carburetor) and biological systems share structural similarities regarding part-whole relationships. Both agree that biological function attribution is *analogous* to artifact function attribution, though they disagree on whether the analogy extends to the *source* of the normativity (selection vs. intention vs. analysis).
  6.  **Explanatory Utility:** Both parties agree that function attributions are retained in biological discourse because they increase explanatory power regarding the stability, organization, or persistence of biological systems.

  ## 3. Residual Disagreements

  | Topic | Etiological (EWG) Formulation | Systemic (SWG) Formulation | Verdict | Reason |
  | :--- | :--- | :--- | :--- | :--- |
  | **Source of Normativity** | Normativity is grounded in historical success; a trait *ought* to do what its ancestors did to survive. | Normativity is grounded in the analyst's model of the system; a trait *ought* to do what contributes to the capacity being analyzed. | **Substantive** | Leads to divergent predictions in cases lacking history (see Crux 1). |
  | **Time-Index of Function** | Function is a historical property; a trait's function is fixed by its past, even if currently useless. | Function is a dispositional property; a trait's function is determined by its current capacity, even if historically novel. | **Verbal** | Both describe the same phenomenon using different temporal indices; however, this becomes substantive when history and current utility diverge. |
  | **Drift and Hitchhiking** | Traits fixed by drift or hitchhiking have no proper function, even if they currently benefit the organism. | Traits fixed by drift have a systemic function if they currently contribute to organismal capacity, regardless of history. | **Substantive** | Directly impacts how we classify neutral evolution vs. adaptation in genomic data. |
  | **System Boundaries** | The system is defined by the unit of selection (usually the organism or gene). | The system is defined by the explanatory interests of the investigator (e.g., the ecosystem or the cell). | **Substantive** | Determines whether 'selfish' traits are functions or parasites (see Crux 2). |

  ## 4. The Cruxes

  To move beyond the stalemate, we identify three sub-questions where empirical or conceptual resolution would force a revision in at least one position.

  **Crux 1: The Necessity of History.**
  Is a history of selection *necessary* for a trait to possess a biological function, or is current contribution sufficient?
  *   *Stakes:* If history is necessary, novel traits and drift-fixed traits are functionless until selected. If current contribution is sufficient, function is ahistorical.

  **Crux 2: The Hierarchy of Normativity.**
  When a trait's contribution to a lower-level system (e.g., gene replication) conflicts with a higher-level system (e.g., organism survival), which function attribution takes precedence?
  *   *Stakes:* Determines whether 'selfish' genetic elements are functioning (for the gene) or malfunctioning/parasitic (for the organism).

  **Crux 3: The Continuity of Design.**
  Does the process of directed evolution (in vitro selection) generate genuine biological functions identical to in vivo selection, or does the lack of an organismal context render them merely 'quasi-functions'?
  *   *Stakes:* Tests whether 'selection' alone is sufficient for function, or if 'organismal survival' is a required component of the etiological account.

  ## 5. Empirical and Conceptual Tests

  For each Crux, we stipulate specific cases. Both parties commit to the following predictions.

  ### Test for Crux 1: The Necessity of History
  **Case A: The Hitchhiking Twin.**
  Two populations possess identical alleles with identical causal profiles. In Population 1, the allele was selected for the effect. In Population 2, it fixed via hitchhiking (linked to a selected site) and the effect is fitness-irrelevant.
  *   **EWG Prediction:** Population 1 has a function; Population 2 does not. The physical identity of the trait is irrelevant to its functional status.
  *   **SWG Prediction:** Both populations have the function. The current contribution to the system is identical; history is irrelevant to the current systemic capacity.
  *   **Case B: The First-Generation Gene.**
  A *de novo* gene arises from non-coding sequence. It improves fitness immediately.
  *   **EWG Prediction:** Generation 1: No function (no history). Generation 1000: Function exists (history established).
  *   **SWG Prediction:** Generation 1: Function exists (immediate contribution). Generation 1000: Function persists.

  ### Test for Crux 2: The Hierarchy of Normativity
  **Case C: The Selfish Element.**
  A transposon replicates within the genome, increasing its own frequency but lowering organismal fitness.
  *   **EWG Prediction:** It has a proper function *for the gene* (replication), but is a parasite *for the organism*. Function is relative to the unit of selection.
  *   **SWG Prediction:** It has a systemic function relative to the genome system, but is a malfunction relative to the organism system. The attribution depends on which containing system is being analyzed.
  *   **Case D: The Co-opted-and-Degenerate Trait.**
  A structure historically selected for Effect X now produces Effect Y (beneficial) and can no longer produce X.
  *   **EWG Prediction:** The function remains X (historical), though it is currently useless. Y is a mere effect (exaptation).
  *   **SWG Prediction:** The function is Y (current contribution). X is historical trivia.

  ### Test for Crux 3: The Continuity of Design
  **Case E: Directed-Evolution Lineage.**
  An enzyme is evolved in vitro over 1,000 rounds of selection for catalytic activity, with no organismal host at any point.
  *   **EWG Prediction:** Ambiguous. If 'selection' is sufficient, it has a function. If 'organismal survival' is required for proper biological function, it is an artifact with a function, not a biological trait with a proper function.
  *   **SWG Prediction:** It has a systemic function. The containing system is the reaction vessel/experimental setup. The lack of organismal history is irrelevant to the causal contribution.

  ## 6. Ghostwriter's Memorandum: Confidence and Assumptions

  *Note: This section is an evaluation by the drafter, not part of the Joint Statement.*

  **Confidence in Crux Resolution:**
  1.  **Crux 1 (History):** **High Confidence (0.85).** The *Hitchhiking Twin* case is the strongest lever. If biologists treat the hitchhiker as functional in practice, EWG must concede or argue biologists are mistaken. If biologists treat it as non-functional, SWG loses traction. This forces a move.
  2.  **Crux 2 (Normativity):** **Medium Confidence (0.60).** The *Selfish Element* case often results in a standoff where both sides say "It depends on the level." This might reinforce the status quo rather than resolve it. However, the *Co-opted* case is stronger; if biologists routinely relabel the function of co-opted traits immediately, EWG is pressured.
  3.  **Crux 3 (Design):** **Low Confidence (0.40).** The *Directed Evolution* case risks being dismissed by EWG as "artifact" territory regardless of the outcome. It may not move the needle on *biological* function specifically.

  **Weakest Claim in Document:**
  **Agreed Claim #5 (Artifact Analogy).** This is the most fragile point. The EWG may resist signing that biological function is merely *analogous* to artifact function, as some etiological theorists argue they are *identical* in kind (both selected/intended). The SWG may resist if they view biological systems as fundamentally distinct from engineered ones. I have phrased it as "analogous" to secure signatures, but it is the most likely point of future friction.

  **Contingent Empirical Assumptions:**
  1.  **De Novo Gene Birth:** The document assumes *de novo* genes (Case B) can arise and improve fitness immediately.
      *   *If False:* If *de novo* genes always require a long period of neutral drift before becoming functional, the *First-Generation Gene* test collapses. The document would need to shift focus to *exaptation* cases instead.
  2.  **Tightness of Contribution/History:** The document assumes we can empirically distinguish hitchhiking alleles from selected alleles (Case A).
      *   *If False:* If genomic signatures of selection are too noisy to distinguish hitchhiking from selection in real time, the *Hitchhiking Twin* remains a thought experiment only. The document would need to rely more heavily on the *Directed Evolution* case, which is experimentally tractable.
  3.  **Degeneracy of Co-opted Traits:** The document assumes we can find traits that *no longer produce X at all* (Case D).
      *   *If False:* If traits always retain some vestige of the old function, the EWG can argue the proper function persists. The test case would need to be refined to "traits where X is physically impossible."

  **Final Assessment:**
  This draft isolates the *Hitchhiking Twin* and *First-Generation Gene* cases as the primary engines for resolution. These cases attack the ET account's reliance on history directly. If the collaboration focuses energy there, a resolution is plausible. If they retreat to the *Selfish Element* (level of selection debates), the collaboration will likely stall again, as both accounts have established workarounds for multi-level selection.
