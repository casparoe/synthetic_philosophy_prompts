answer: |-
  **Case A: The Naive Directive**
  Elena, a fiercely independent architect, executes a standard advance directive stating that if she ever reaches a stage of dementia where she cannot recognize her children, she considers her life over and refuses artificial nutrition. Years later, advanced Alzheimer's renders her unable to identify her family, yet she is consistently placid, humming softly and enjoying the sensory pleasure of food without distress. When she develops a swallowing disorder, her family faces the choice: tube-feed her or honor the directive. Although her current experiential welfare is positive, she lacks the cognitive agency she once identified as the source of her dignity. **Verdict:** Honor the directive; withhold nutrition.

  **Case B: The Evidentially Sealed Directive**
  Marcus, a philosopher, executes a detailed directive anticipating his own adaptation: he explicitly writes that if he develops dementia, he will likely claim to be happy and ask to live, but he commands his proxies to disregard those pleas as mere biological instinct rather than authentic choice. Years later, advanced Alzheimer's sets in; he is genuinely joyful, engages warmly with staff, and explicitly begs for life-sustaining treatment when a swallowing disorder arises. His current preferences are stable and informed by his immediate reality, yet his earlier clause demands his current testimony be treated as noise. **Verdict:** Override the directive; provide treatment.

  ***

  **Whole-Life Authority View**
  This view prioritizes the narrative integrity of the life as a whole. In Case A, it supports honoring the directive because Elena's earlier competent judgment defined the conditions of a life worth living for *her*; allowing her to exist as a contented being devoid of the agency she valued violates her life's narrative arc. In Case B, however, the view must override the directive. By sealing the clause against all future evidence, Marcus did not exercise autonomy but attempted to tyrannize his future self; a rational life-plan must remain answerable to reality, and a directive that treats the subject's own testimony as irrelevant ceases to be an authoritative expression of values and becomes an irrational dead-hand control.

  **Time-Relative Interests View**
  This view weighs the welfare of the person existing at the time of treatment. In Case B, it easily supports overriding the directive: the current Marcus has a strong interest in continuing his pleasant existence, and ignoring his pleas causes him harm. In Case A, however, this view struggles to justify the verdict. Since current Elena is content and suffering no distress, her time-relative interests favor continued life; to honor the directive requires dismissing her current welfare entirely in favor of a past self's abstract values, forcing the view to bite a significant bullet that current happiness can be overridden by past preferences.

  **Psychological-Continuity View**
  This view ties authority to the degree of psychological connectedness between the writer and the patient. Since the cases are designed to hold identity metaphysics fixed—with the same degree of dementia and continuity in both—this view yields the same verdict for both cases. It cannot distinguish between Elena's naive instruction and Marcus's sealed clause because the *relationship* between the selves is identical in both scenarios. Consequently, this view fails to capture the moral difference generated by the structure of the directives, rendering it unable to account for why one directive binds while the other does not.

  ***

  **1. The Design Feature**
  The work is done by **epistemic closure**: Case B's directive explicitly immunizes itself against future counter-evidence (the patient's happiness), whereas Case A's directive remains open to the world, even if its prediction was wrong.

  **2. Stripping the Feature**
  If you remove the evidential sealing from Case B (making it naive like A), intuition reverts to the standard view: both directives look equally authoritative, and most people would feel compelled to override both in favor of the patients' current happiness.

  **3. The Attack**
  A defender of the **Time-Relative Interests View** (the worst performer) would attack the pair by arguing that Case A is morally abhorrent: "You are advocating starvation for a contented human being based on the prejudices of a ghost. If the patient is not suffering, the only ethical choice is to care for the person who exists now, regardless of how carefully the past self tried to bind them."
