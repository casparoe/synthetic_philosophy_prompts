answer: |-
  Here is the extraction and stress-testing of your principles.

  ### Candidate A: The Principle of Differential Authority
  *This is the strengthened version of your three-part intuition.*

  **Statement:**
  1.  **Epistemic Vetting:** Documentary records command authority over community memory only when the archive demonstrates structural independence from the power dynamics of the event. This is established by counterfactual sensitivity (would the record exist if the event were otherwise?) and by evidence that the record acted against the self-interest of its creators.
  2.  **Domain Separation:** Even when the record governs factual assertion (public monuments, schoolbooks, official claims), it does not govern commemorative meaning (liturgy, private narrative, ritual). Memory retains sovereignty over the *significance* of the past where no factual claim is being enforced upon the public sphere.
  3.  **Prescriptive Longevity:** A memory held openly and continuously for three generations acquires a protected status in the private or semi-private sphere. It need not be asserted as fact, but it cannot be extirpated as narrative, provided it does not inflict material harm on identifiable others.

  **Motivation by Case:**
  *   **Clause 1 (Epistemic Vetting)** is saved by **Case 3 (K'iche' Village)** and **Case 7 (Sea Lark)**. In Case 3, the record claims "tranquility" while a massacre occurred; the archive is structurally complicit, so it yields. In Case 7, the initial inquiry was exonerating the owner (self-interest), but the later letters were against interest; authority shifts accordingly. This clause also explains **Case 1 (Harrow Ford)** and **Case 4 (Carpathians)**: in both, the records (payrolls, indictments) were bureaucratic and against the settlers' immediate interest, so they govern.
  *   **Clause 2 (Domain Separation)** is saved by **Case 5 (Valmira)** and **Case 6 (Family Enlistment)**. In Case 5, the monument (public fact) yields to the record, but the liturgy (private meaning) does not. In Case 6, the family stops *asserting* the enlistment (fact) but continues *telling* the story (narrative).
  *   **Clause 3 (Prescriptive Longevity)** is saved by **Case 6** specifically, distinguishing it from **Case 2 (Steelworkers)**. The Steelworkers are a public body with political power; the family is a private unit. The "three generations" rule protects the family's Sunday dinner from the muster roll, but it does not protect the Union's public history from the payroll.

  ### Candidate B: The Principle of Restorative Accuracy
  *This is the rival principle. It prioritizes the mitigation of harm over the public/private split.*

  **Statement:**
  1.  **Harm Primacy:** The authority of memory or record is determined solely by which version minimizes ongoing harm to vulnerable populations.
  2.  **Evidentiary Threshold:** A memory may override a document only if the document is demonstrably a tool of oppression (silence, fabrication) *and* the memory serves a restorative function for the oppressed. A document may override a memory only if the memory perpetuates a harmful falsehood about a protected group.
  3.  **No Sanctuary:** There is no private sphere exemption. If a narrative causes harm (even internally or to identity), it must yield to the best available evidence, regardless of how long it has been held.

  **Motivation by Case:**
  *   **Clause 1 & 2** explain **Case 3 (K'iche')** (record is oppressive, memory is restorative) and **Case 1 (Harrow Ford)** (memory is self-aggrandizing at the expense of the dead debtors).
  *   **Clause 3** explains **Case 2 (Steelworkers)** better than Candidate A. The Union's identity is not a valid reason to keep a lie if that lie污辱s (stains) the memory of the strikebreakers or distorts labor history. It also challenges **Case 6**, suggesting the family *should* stop telling the story if it appropriates Black history (Colored Infantry), whereas Candidate A allows it.

  ---

  ### Honest Critique of Candidate A (Your Principle)

  I prefer Candidate A because it respects the phenomenology of how people actually live with the past, but it is not cost-free. Here is where it breaks:

  **1. The Case 5 Instability (Valmira):**
  Candidate A relies on a distinction between "assertion" and "commemoration." In Case 5, you allow the liturgy to say "Three Hundred" while the monument says "Eighty." This principle cannot hold under scrutiny. A prayer for the dead *is* an ontological claim. To pray for 300 souls is to assert 300 people exist in the memory of God. If the record proves 80 died, the liturgy is performing a falsehood. Candidate A saves your verdict here by fiat, but logically, Clause 2 (Domain Separation) creates a loophole that allows communities to maintain epistemic bubbles. If you value truth, Case 5 is a verdict you might have to overturn: the liturgy should be corrected to "The Dead of Valmira," dropping the number entirely.

  **2. The Case 2 Tension (Steelworkers):**
  Clause 3 (Prescriptive Longevity) is in direct tension with Case 2. The Steelworkers' story held for ~45 years (nearly two generations). You ruled against them. Candidate A explains this by calling the Union "public" and the Family "private." But Unions are membership organizations, often culturally tight-knit like families. If the principle relies on "public vs. private," Clause 3 is redundant; the public/private line does all the work. If the principle relies on "time," Case 2 is a violation. You must admit: **Time does not earn authority.** Only privacy does. Clause 3 is doing no work that Clause 2 does not already do, except adding a confusing temporal metric.

  **3. The Case 7 Complication:**
  In Case 7, the community memory was *right*, but the record was wrong. Candidate A handles this via Clause 1 (the record wasn't independent). However, if the letters had *not* been found, Candidate A would force the community to yield to the Inquiry (because the Inquiry is a document). This suggests Candidate A is too document-centric. It assumes that if a document passes the "independence" test, it wins. But Case 7 shows that community memory can be epistemically superior to documents even without new documents to prove it. Your principle struggles to validate memory *on its own merits*; it only validates memory when documents fail.

  ---

  ### Application to Four New Cases

  **Case New 1: The Forgotten Atrocity**
  *A town prefers to forget a 1950 lynching. The newspaper archives and police logs insist it happened. The town wants to remove the plaque.*
  *   **Candidate A:** Clause 1 says the record governs assertion (police logs are independent). Clause 2 says the town cannot remove the plaque (public assertion). However, Clause 3 might allow them to stop *talking* about it privately. **Verdict:** Plaque stays, public silence is not permitted.
  *   **Candidate B:** Clause 1 (Harm Primacy). Forgetting the lynching harms the descendants and the civic truth. **Verdict:** Plaque stays, active remembrance may be required.
  *   **Difference:** Candidate A allows private silence; Candidate B might demand active restorative narration.

  **Case New 2: The Four-Hundred-Year Memory**
  *A village claims a 1624 battle happened at the hilltop. Records say valley. No living descendants are affected; no land rights hinge on it.*
  *   **Candidate A:** Clause 1 says record governs assertion. Clause 3 says the memory has "adverse possession" standing. Since no harm is done (private/public split is moot), the memory can persist as local lore. **Verdict:** Schoolbooks say "Valley," locals can keep telling tourists "Hilltop."
  *   **Candidate B:** Clause 1 (Harm). If no harm, does it matter? Clause 2 (Evidence). The record is likely more reliable. **Verdict:** Correct the record, but no energy need be spent policing the memory.
  *   **Difference:** Candidate A grants the memory a *right* to persist; Candidate B grants it *indifference*.

  **Case New 3: The Dubious Document**
  *A diary surfaces corroborating a marginalized group's memory of a massacre. Historians suspect the diary is a forgery from the 1950s, but it aligns with oral history.*
  *   **Candidate A:** Clause 1 (Epistemic Vetting). The document fails independence/provenance. It cannot govern. The memory stands, but not *because* of the diary. **Verdict:** Memory stands on its own; diary is excluded.
  *   **Candidate B:** Clause 2 (Restorative). If the diary serves restorative justice for the oppressed, its provenance matters less than its function. **Verdict:** Tentative acceptance of the diary to support the memory.
  *   **Difference:** Candidate A is stricter on evidence; Candidate B is instrumentalist.

  **Case New 4: Who Struck First?**
  *Two ethnic groups agree a clash happened in 1920 but disagree on who threw the first stone. Records are ambiguous.*
  *   **Candidate A:** Clause 1 fails (record is ambiguous). Clause 3 applies (both have long-held memory). **Verdict:** Record cannot govern. Both memories persist as "narrative," but neither can be taught as "fact" in schools.
  *   **Candidate B:** Clause 1 (Harm). Which version causes more harm? If Group A's version paints Group B as aggressors to justify current discrimination, it must yield. **Verdict:** Adjudicated based on current political consequences.
  *   **Difference:** Candidate A suspends judgment; Candidate B adjudicates based on consequences.

  ---

  ### The Adverse Possession Analogy: Clarification vs. Damage

  You asked specifically about the work the "Adverse Possession" clause (Clause 3) is doing.

  **Where it Clarifies:**
  It captures the *intuition* behind Case 6 (Family Enlistment). It explains why we feel a "statute of limitations" on policing family myths. It gives a name to the feeling that a story, once inhabited for a century, becomes part of the furniture of a life and cannot be evicted without violence. It distinguishes the *weight* of a story from the *truth* of a story.

  **Where it Does Damage:**
  1.  **It contradicts Case 2:** The Steelworkers' memory was their "property" for 40+ years. You ruled they must evict it. Adverse Possession suggests they should have a claim. To save the analogy, you have to argue that "Public Land" (Union History) cannot be adversely possessed, only "Private Land" (Family History). But this makes the *time* element irrelevant; it's the *location* (public/private) that matters.
  2.  **It implies ownership of truth:** Adverse possession is a property right. Applying it to history suggests communities can *own* versions of the past. This is dangerous. It risks validating Case 1 (Harrow Ford) if we wait long enough. If the settlers wait 300 years, do they own the "Harrow Ford Victory" narrative? Your verdict in Case 1 says no. Therefore, Adverse Possession cannot apply to public factual claims.
  3.  **Redundancy:** As noted in the critique, Clause 2 (Domain Separation) already protects the family story in Case 6 by categorizing it as "private narrative" rather than "public assertion." Clause 3 adds a time requirement that isn't present in your verdicts. (Would you have forced the family to stop if the story was only 20 years old? Probably not, because it's family.)

  **Conclusion on Adverse Possession:**
  It is doing **no work** that Clause 2 is not already doing, and it actively threatens to undermine Case 1 and Case 2. It is a powerful metaphor for *why* we feel reluctance to correct old stories, but it should not be codified as a principle of authority. It explains the *cost* of correction, not the *authority* of the memory.

  **Recommendation:**
  Drop Clause 3. Rely on Clause 1 (Epistemic Vetting) to determine truth, and Clause 2 (Domain Separation) to determine where that truth must be enforced. This accommodates Case 6 (private sphere exemption) without granting "ownership" of falsehoods, and it aligns with Case 2 (public sphere requires accuracy regardless of duration). It forces you to confront Case 5 honestly: if the liturgy is public, it must yield; if private, it may stay, but not because of time, but because of privacy.
