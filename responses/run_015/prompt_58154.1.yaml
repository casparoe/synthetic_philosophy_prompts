          *   (ii) BI Validity: Student defends BI orthodoxy. This is acceptable, though could be deeper regarding belief revision. Let's be generous here as it's a debated point, but the error in (i) is the killer. Deduct ~1 point for lack of nuance on belief revision.
      *   **Total:** 5 + 3 + 5 = 13/20. Or maybe 14/20 if I'm lenient on (c)(ii). Let's aim for a solid 13/20. It's a "C+" or "B-" range. Good mechanics, bad theory on signaling.

