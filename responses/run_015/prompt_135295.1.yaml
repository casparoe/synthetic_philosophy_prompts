answer: |-
  This is a remarkably precise diagnosis of a contemporary intellectual pathology. You have identified a movement that is more structured than metaphor but less rigorous than univocal definition. It is a form of semantic migration that carries normative baggage across ontological borders.

  You are correct to set aside polysemy, metaphor, and conceptual stretching. Polysemy implies independent senses; here, the senses are deliberately coupled. Metaphor implies a figurative distance that the users deny (they claim literal technical correspondence). Conceptual stretching (Sartori) concerns the ladder of abstraction; your concern is with the *mechanism of realization*.

  Here is an analysis of the nearest existing candidates, a proposal for a new carving, and a critique of the boundaries of your phenomenon.

  ### 1. Existing Candidates

  There is no single canonical term that captures the *normative slippage* combined with *structural retention*, but three concepts border your description.

  **A. Travelling Concepts (Mieke Bal)**
  *   **The Notion:** In interdisciplinary studies, Bal argues that concepts gain meaning precisely through their movement between fields. They are not stable entities but tools that transform as they travel.
  *   **Fit:** This captures the migration between psychology, economics, and CS. It acknowledges that the meaning changes.
  *   **Difference:** Bal's framework is largely descriptive and often celebratory of the travel. It does not inherently flag the *illicit inference* or the *retention of normativity* without criteria. Your complaint is not that the concept travels, but that it travels *smuggled goods* (normative profiles) that should have been left at the border.
  *   **Verdict:** The best existing framework, but requires a critical supplement.

  **B. Functionalism (Philosophy of Mind and Science)**
  *   **The Notion:** A concept names a functional role (e.g., 'pain' is whatever plays the pain-role), which can be realized by different physical substrates (neurons, silicon, etc.).
  *   **Fit:** This explains the *defence* used by the writers you critique. They are implicitly claiming attention is a functional kind: whether realized by neural firing, budget allocation, or weight matrices, it is the same *function*.
  *   **Difference:** Functionalism is an ontological hypothesis. Your observation is that this hypothesis is being assumed without justification to license inferences. If attention is *not* a functional kind, the move is invalid.
  *   **Verdict:** This is the ontological wager underpinning the phenomenon, not the name of the error itself.

  **C. Equivocation (Logic)**
  *   **The Notion:** Using the same word in different senses within an argument.
  *   **Fit:** This captures the logical failure (the category mistake).
  *   **Difference:** Equivocation is usually accidental or sophistical. Your case is systematic and structural. The writers are not accidentally slipping; they are building a bridge based on structural isomorphism. Simple equivocation does not account for the *modelling* aspect you highlight.
  *   **Verdict:** Describes the logical result, not the semantic mechanism.

  ### 2. A Proposal for Carving

  Since no existing term captures the specific combination of structural modelling + normative retention + criteria loss, I propose we refine the notion of **Travelling Concepts** with a specific pathology.

  **Proposed Name:** **Normative Drag** (within the context of Structural Equivocation).

  **Definition:**
  Normative Drag occurs when a term migrates from a Source Domain to a Target Domain based on a claimed structural or functional isomorphism. The migration successfully transfers the *grammar* (syntax of use) and the *normative profile* (evaluative stakes) of the Source, but fails to transfer the *criteria of application* (ontological realization). Consequently, inferences licensed by the Source's ontology are applied to the Target's structure, creating a illusion of continuity where there is only analogy.

  **Cases it must cover:**
  1.  **Attention:** (Your primary case). The moral weight of 'regard' drags onto 'weight matrices'.
  2.  **Bias:** Migrates from Statistics (deviation from expectation) -> Cognitive Psychology (systematic error) -> AI Ethics (unfairness). The statistical neutrality is lost; the moral condemnation is retained.
  3.  **Memory:** In CS (storage/retrieval) vs. Cognitive Science (reconstructive process). The normative ideal of 'accuracy' drags from human memory to database integrity, despite different failure modes.

  **Boundary cases it must exclude:**
  1.  **Temperature (in ML):** This is a *Mathematical Analogy*. The parameter controls randomness via a Boltzmann distribution. It does not carry the *normative profile* of thermodynamics (e.g., one is not 'unjust' for having a high temperature, nor does it 'deserve' cooling). It lacks the normative drag.
  2.  **Virus (Biological vs. Computer):** This is *Metaphor*. While it has grammar (infection, spread), users generally acknowledge the figurative status. It does not typically license moral inferences (a computer virus is not 'evil' in the same sense, nor do we owe it 'care').
  3.  **Force (Physics vs. Social):** When sociologists speak of 'social forces', if they acknowledge it as a metaphor for causal pressure, it is not Normative Drag. If they begin to calculate Newtonian equations for social change, it becomes a Category Mistake, but perhaps not Normative Drag unless moral obligations are attached to the 'force'.

  **Why this carving?**
  It isolates the *normative* component as the crucial vector. 'Temperature' moves without norms. 'Attention' moves *with* norms. The danger lies in the obligations (justice, efficiency, regard) that attach to the word in the Source Domain and stick to it in the Target Domain, despite the Target lacking the capacity to satisfy those obligations.

  ### 3. Is it One Phenomenon or a Functional Kind?

  You ask whether this is one thing, or a functional kind with different fillers.

  If attention *were* a genuine functional kind, the migration would be valid. The phenomenon you describe is the *premature treatment* of a contested analogy as an established functional kind. Therefore, the phenomenon is unified by the *rhetorical move*, not the ontological reality.

  The 'Bias' case belongs to the same family because it carries a negative normative profile (deviation -> error -> unfairness) across domains where the criteria for 'deviation' change fundamentally. The 'Temperature' case does *not* belong to the same family, as it is a formal mathematical mapping without normative loading. It is a case of **Formal Analogy**, whereas Attention and Bias are cases of **Normative Analogy**.

  ### 4. Critique and Falsification

  You asked what would change my mind, and where your analysis might be weakest.

  **The Weakest Case: Economics.**
  The 'economics of information' case is doing the least work. 'Attention as a resource' is often explicitly modelled as a metaphor or a heuristic in policy talk, rather than a literal technical claim equivalent to the ML definition. The ML definition is precise (softmax, queries/keys). The Moral definition is precise (phenomenological, normative). The Economic definition is often a loose aggregation of time and cognitive load. If the economic usage is acknowledged by its proponents as metaphorical, it drops out of your 'Structural Equivocation' class and becomes simple Metaphor. To sustain your claim, you must show that policy-makers treat the 'attention budget' as ontologically continuous with the 'moral regard', not just as a useful fiction for allocation.

  **The Strongest Case: Machine Learning.**
  The ML case is the most dangerous because it is technically precise. The 'attention mechanism' is a definite operation. The risk is that the *name* invites anthropomorphic inference (the model 'attends', therefore it 'cares' or 'understands'). This is where the Normative Drag is most potent, leading to claims about model interpretability or agency that the mathematics does not support.

  **Where the Proposal Might Fail:**
  My proposal collapses back into **Functionalism** if it turns out that 'Attention' *is* a robust functional kind. If future interdisciplinary work successfully defines attention purely by its input-output role (selection of relevant data from a set), regardless of substrate, then the 'Drag' is not an error but a valid abstraction.
  *   **Falsification Condition:** If a unified theory of attention is produced that successfully predicts phenomena in all three domains (e.g., optimizing ML weights improves human moral regard, or vice versa) using a single formal model, then the concepts are not 'dragging' but 'unifying'. Until then, the Drag hypothesis holds.

  **Where I am Extrapolating:**
  I must flag the technical details of the Machine Learning case. I am relying on the standard description of Transformer attention (queries, keys, values, softmax). If the specific architectural implementation varies significantly (e.g., linear attention, sparse attention), the claim that it is a 'definite operation' remains stable, but the semantic link to 'selection' might weaken. I am also assuming the 'Moral Philosophy' tradition you cite (likely Murdoch, Weil, or contemporary care ethics) treats attention as non-fungible. If some moral philosophers argue attention *is* a budgetable resource, the tension dissolves.

  ### 5. Summary Recommendation

  For your print purposes, I recommend anchoring your argument in **Mieke Bal's 'Travelling Concepts'** but specifying the pathology as **Normative Drag**.

  This allows you to acknowledge the interdisciplinary necessity of the travel (avoiding the charge of territorialism) while critiquing the specific mechanism by which obligations are transferred without the capacity to fulfil them. It distinguishes your case from 'Temperature' (which travels without norms) and 'Concept Creep' (which expands within a domain).

  Your intuition that 'Copycat Concepts' is informal is correct; it lacks the semantic precision. **Normative Drag** captures the inertia of the values attached to the word, pulling them into domains where they no longer have traction.

  **Final thought:** The phenomenon is not just verbal; it is political. When 'attention' becomes a budget, it becomes something that can be legitimately withheld. When it becomes a weight matrix, it becomes something that can be optimised. The 'Drag' ensures that the moral gravity of the original term remains to justify the new usage, even when the substance has evaporated. That is the critical point your reading group should press.
