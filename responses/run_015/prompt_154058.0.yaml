answer: |-
  - 'The weak link'
  The weakest step is (4). It commits a misapplication of recognition conditions coupled with an equivocation between temporal and logical priority. For Hegel, recognition is constitutive; it establishes the status of the recognized *at the time of the act*. The master's status depends on the slave's *current* unfreedom. If the slave becomes free later, this does not retroactively transmute past submission into free recognition. Rather, the slave's liberation negates the master-slave relation entirely, rendering the master no longer a master. Valid recognition requires mutual freedom contemporaneously; a past act performed under duress cannot be ontologically rewritten by the agent's future status. Step (4) incorrectly assumes the *truth* of the slave's future freedom validates the *fact* of the past relation for the master's benefit. In reality, the slave's independence reveals the master's dependency as a dead end, not a deferred success. Furthermore, this step confuses the historical development of *Geist* with the individual master's psychological certainty. While Spirit may look back and understand the necessity of the struggle, the individual master cannot derive self-certainty from a recognition that was, at the moment of issuance, fundamentally null. The master's self-consciousness remains deficient because the specific relation required for its constitution (domination) is inherently self-undermining, not retroactively repairable.

  - 'Why it seemed defensible'
  This premise appears defensible due to Hegel's teleological method, where the end reveals the truth of the beginning. Later stages often illuminate the necessity of earlier ones. Since the slave's work shapes the world and leads to freedom, it is tempting to view this outcome as the "truth" of the entire dialectic, including the master. The language of "working through" history suggests cumulative validation, making the idea that the slave's future freedom resolves the master's past deficit seem consistent with Hegel's narrative of Spirit coming to self-knowledge. It relies on the intuition that the final state validates the struggle's necessity.

  - 'The cost of giving it up'
  Rejecting step (4) preserves Hegel's account of *Sittlichkeit* by acknowledging that the master-slave dialectic is a dead end for individual mastery, not a deferred success. The cost is accepting that the master never achieves true self-consciousness within that specific relation; instead, the dialectic must move beyond the pair entirely into Stoicism, Skepticism, and eventually ethical life. Authority in *Sittlichkeit* is not based on personal domination requiring the subordinate's unfreedom, but on rational institutions where recognition is mediated by universal laws. Abandoning retroactive validation means the slave's liberation does not fix the master's status but dissolves it, paving the way for reciprocal recognition among free citizens rather than validating hierarchy. This saves Hegel from the claim that all hierarchy is self-cancelling; instead, only *domination* is self-cancelling. Rational authority remains stable because it relies on shared freedom within an ethical order, not on the subordinate's eventual emancipation from the authority figure themselves. The dialectic progresses by overcoming the form of relation, not by retroactively fixing its internal contradictions. Consequently, the master's failure drives Spirit toward universal freedom, not a puzzle for the slave's agency. State stability depends on transitioning from personal dependence to institutional interdependence.

  - 'Settled and contested'
  Scholars agree the master's recognition is deficient and the slave finds independence through work. This dialectic drives Spirit beyond domination. However, it is contested whether the slave's liberation retroactively validates the master or simply supersedes the relation. Interpretations differ on whether Hegel allows stable asymmetrical recognition within *Sittlichkeit* or if all authority must be fully reciprocal. Some argue labor produces a self-consciousness capable of validating prior recognition, while others contend the master-slave bond is irredeemable. Dispute remains on whether resolution applies to individual consciousness or universal Spirit.
