  3.  **Identify the Weakest Step:**
      *   Step (4) is the critical pivot. It claims retroactive ontological validation.
      *   *Why it fails:* Recognition in Hegel is typically contemporaneous or constitutive of the *current* relation. While Hegel uses retroactive logic (*Nachträglichkeit*) in some contexts (e.g., the end of history validating the process), applying it here to validate a *past* relation of domination based on a *future* state of the recognizer creates a temporal/logical confusion. Specifically, the master *at the time* did not receive valid recognition. The master's consciousness at time T1 cannot be constituted by an event at time T2 unless we are talking about the historical spirit (*Geist*), not the individual master-consciousness. Furthermore, if the slave becomes free, they typically negate the master-slave relation entirely (abolishing mastery), rather than validating the master's status within it. The master's status *as master* depends on the slave's *unfreedom*. If the slave becomes free, the master is no longer a master. So the recognition cannot validate the *master's* self-consciousness *as master* because that category dissolves upon the slave's liberation.
      *   *Error Type:* Equivocation between temporal and logical priority / Misapplication of recognition conditions. The condition for valid recognition is mutual freedom *at the time of recognition*. A past act of submission cannot be rewritten as an act of free recognition simply because the submitter becomes free later.

