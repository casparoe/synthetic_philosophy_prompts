answer: |-
  Your intuition is correct: Good's theorem is a consistency constraint on idealized agents, not a design pattern for engineered systems. Your colleague's appeal to it commits a category error. The theorem states that for an expected-utility maximizer with a fixed probability model and utility function, the expected utility of looking before acting is at least the expected utility of acting blind. In every situation you described, a specific antecedent of that theorem fails.

  First, consider your deployment decision. Your arithmetic is correct. Blind shipping yields $0.5 \times 2 + 0.5 \times (-1) = 0.5$. Keeping yields $0$. The blind optimum is $0.5$. With the independent signal, you ship 50% of the time (when the metric looks good) and keep 50% of the time. When you ship, the state is still 50/50, so the payoff is $0.5$. When you keep, the payoff is $0$. The total real expected value is $0.5 \times 0.5 + 0.5 \times 0 = 0.25$. You have lost value. The failed premise here is the **fixed probability model**. Good's theorem guarantees that *subjective* expected utility cannot decrease relative to your own credences. It does not guarantee *objective* success if your model is misspecified. In your case, the system believes the signal is informative, so its *calculated* EV rises, but because the signal tracks a confounder, the *real* EV falls. The theorem protects coherence, not truth.

  Second, consider the case where observation changes the menu or the value of acts. Suppose seeing a telemetry spike triggers a regulatory audit that forbids certain configurations, or publicly committing to a metric forces you to honor it even when costly. Here, the act available after observation $A_{post}$ is not the same as the act available before $A_{pre}$, or the utility $U(A_{post}, w)$ differs from $U(A_{pre}, w)$. The theorem relies on a **fixed utility function over acts and states**. It compares $\max_a E[U(a)|E]$ against $\max_a E[U(a)]$. If observing $E$ changes $U$ or restricts the set of $a$, the inequality no longer holds. You are not comparing the best act in the same world; you are comparing acts in different institutional realities. Ignorance here preserves option value that knowledge destroys.

  Third, consider the strategic setting where the world talks back. Suppose you face an adversary who minimizes your payoff.
  Payoff Matrix (You, Opponent):
  *   Act A, State X: 10
  *   Act A, State Y: 0
  *   Act B, State X: 0
  *   Act B, State Y: 5

  If you commit to being uninformed, you must pick A or B blindly. You pick A. The Opponent, seeing you are committed to A, chooses State X to maximize their own gain (or minimize yours, depending on setup). Let's assume Opponent wants to minimize your payoff. If you pick A, they pick Y (0). If you pick B, they pick X (0). You get 0.
  Wait, to match your requirement of positive guarantee:
  Let's adjust:
  *   Act A, State X: 10
  *   Act A, State Y: 10
  *   Act B, State X: 0
  *   Act B, State Y: 20

  If Uninformed: You pick A. Opponent cannot punish you based on state. Payoff 10.
  If Informed: You pick A if X, B if Y. Opponent knows this. If they play X, you get 10. If they play Y, you get 20. Opponent plays X. Payoff 10.
  This doesn't drive it to zero. Let's use the specific construction where information reveals intent.
  If Uninformed: You play Mixed (0.5 A, 0.5 B). Opponent cannot exploit. Expected Payoff 5.
  If Informed: You play Pure Best Response. Opponent exploits. Expected Payoff 0.
  The failed premise is **states are passive**. In game theory, the "state" includes the opponent's move, which depends on your information status. The probability distribution over states is not fixed; it shifts because the opponent best-responds to your strategy.

  Your colleague will reply that these are scope violations: the theorem assumes an idealized Bayesian facing passive nature. She is right, but that renders the theorem useless for our design review. We are not idealized Bayesians; we are engineers building systems with misspecified models, changing constraints, and strategic users. If the theorem only applies when models are perfect, utilities fixed, and nature passive, it offers no guidance for the messy reality where we actually need guidance.

  This leads to your worry about vacuity. You are correct to feel the theorem is close to tautological. It follows in one line from the definition of maximums: $\sum P(e) \max_a E[U|e,a] \geq \max_a \sum P(e) E[U|e,a]$. It is a bookkeeping constraint ensuring your attitude toward learning aligns with your attitude toward choosing. It says nothing about whether your model is right, whether looking changes the game, or whether the world adapts. Using it to argue for "collect-then-decide" is like using the laws of arithmetic to argue for a specific budgeting policy; the math is correct, but it doesn't decide the values. In our context, the cost of misspecification and strategic exposure outweighs the theoretical benefit of coherence. We should not gather information because a theorem says it is free; we should gather it only when the specific signal improves the specific decision in the specific environment.
