  Reflexive looping is moderate because social anxiety is often viewed as an exacerbation of normal shyness rather than a distinct kind of personhood, limiting deep identity alignment. Adversarial looping is minimal since there is little organised movement to subvert criteria or challenge the medicalisation of social discomfort. The category remains relatively stable, dictated primarily by clinical observation rather than patient-led feedback.
