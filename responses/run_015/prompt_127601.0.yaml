  Psychiatric taxonomies do not merely describe pre-existing conditions; as Ian Hacking argued, they can generate "looping effects" whereby being classified as a particular kind of person alters the behaviour of the classified, which then feeds back into the taxonomy itself. To analyse this more finely, operate with a distinction rarely formalised in the literature: "reflexive looping", in which individuals internalise the diagnostic category and reshape their self-conception and conduct to align with it; and "adversarial looping", in which groups of classified individuals collectively perform, exaggerate, or strategically subvert the diagnostic criteria, thereby forcing institutional revisions to the classification.

