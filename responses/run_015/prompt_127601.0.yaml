  **4. Borderline Personality Disorder**
  **Reflexive: 3 | Adversarial: 3 | Composite: 3.0**

  Stigma significantly inhibits reflexive looping, as many labelled individuals reject the category rather than integrating it into their self-conception, despite growing online peer support. Adversarial efforts have achieved some success in renaming the condition within international standards to reduce pejorative associations, yet DSM criteria remain largely static against patient advocacy. Thus, the looping effect is dampened by resistance to the classification itself.

