prompt: |-
  I hold a specific interpretation of the European Union's constitutional architecture that I want stress-tested. The view is this: the so-called democratic deficit is not a provisional design flaw correctable by strengthening the European Parliament or by constructing a unified European demos, but a constitutive feature of what I will call dispersive sovereignty — the deliberate fragmentation of public authority across national, intergovernmental, and supranational institutions so that no single democratic majority can claim exclusive authorship over binding law. On this reading, the treaty commitment to ever-closer union operates not as a federalist teleology driving toward a European superstate, but as a constitutional technique for maintaining democratic pluralism: by distributing competences and requiring continuous negotiation between levels, the architecture structurally prevents the emergence of a permanent European majority capable of arbitrarily dominating permanent national minorities. Democratic legitimacy, then, derives less from input legitimacy (direct electoral authorization) or output legitimacy (effective problem-solving) than from what we might term non-domination legitimacy: citizens are protected from arbitrary rule precisely because sovereignty is dispersed in a network that makes unilateral domination structurally impossible, even at the cost of clear lines of accountability.

  What would have to be true for this position to be wrong? I want an honest exposure map, not a list of standard criticisms. Which concrete institutional developments — for example, in eurozone economic governance, migration policy coordination, or the legal practice of primacy — would demonstrate that dispersive sovereignty is either a fiction or has already collapsed into de facto centralization? Which normative arguments, perhaps drawing on republican or liberal-democratic theory, show that non-domination legitimacy is either incoherent without democratic authorship or insufficient to justify binding law? Are there formal decision-rules or judicial doctrines (concerning qualified majority voting dynamics, the scope of implied powers, or the relationship between national constitutional courts and the Court of Justice) that undermine the claim that no unified majority can form? I also want you to identify what a committed defender of dispersive sovereignty would themselves concede as genuinely damaging — perhaps cases where fragmentation produces unaccountable executive governance rather than protected pluralism — and to separate those from objections they would dismiss as misreading the constitutional design. Rank the defeaters from fatal to merely awkward. Does the view risk being qualified into unfalsifiability — for instance, by reclassifying every centralizing move as temporary functional coordination and every deadlock as successful non-domination? If so, assess whether that insulation is a virtue or a vice for a constitutional interpretation of this kind. Finally, take a definite position: is the framework well-insulated, genuinely vulnerable, or does it collapse into a rival account such as pure intergovernmentalism or concealed federalism? Give your reasons with commitment rather than balancing options neutrally.

  Please provide a committed response that takes a clear stance on the position's greatest vulnerability and on whether its insulation is defensible. At the very end of your answer, state your core verdict in a fixed, machine-readable form.

  Verdict: [your definitive one-line assessment, e.g., Fatally exposed by executive unaccountability in crisis governance, Defensibly insulated despite accountability gaps, or Collapsed into concealed federalism]
