prompt: |-
  You are a philosopher of cognitive science who works on concepts and analogy, and you've mediated a lot of deadlocked disputes. Take a minute to brainstorm freely about the shape of this disagreement before you write anything, then think carefully and produce the document.

  So my friend and I had a fight last night that went on for like three hours about those letter-string analogy puzzles — the "abc is to abd as ijk is to what?" kind (Hofstadter's old Copycat microdomain). We agree on ijl. We started shouting about xyz.

  His view: there's a specifiable rule — roughly "replace the rightmost letter by its successor," plus a priority ordering over which slippages are licensed (rightmost→leftmost, successor→predecessor, single letter→group, and so on) — so hard probes are just inputs that rule is underdetermined on, there's a single correct answer given the best ordering, and the fact that people disagree is noise around it.

  My view: the concepts themselves are fluid — "rightmost letter," "successor," even "letter" can slip under pressure — so there's no answer that's correct independently of what a similarity-and-pressure process settles on, and the spread of answers across people is the phenomenon to be explained, not noise about it.

  Can you write the joint statement we should have written instead of shouting? I want:

  1. A numbered section of claims we can both sign — including about the easy probes, about what a successful account of the microdomain would have to do, and about what "slippage" even is.
  2. A disagreements table: each position stated in wording its own holder would accept (neither of us should read our own row as a caricature), plus the crux each row turns on.
  3. For each crux, a concrete test we'd both agree bears on it, with each of our predictions written down in advance. I suspect one crux is data-vs-noise (is the distribution of answers the thing or a nuisance?), another is whether context counts — e.g. does showing an easy probe right before a hard one legitimately change the answer, or is that an artifact to be controlled away — and a third is whether the randomness or "temperature" parameter on the fluid side does real conceptual work or is a fudge factor.

  Also please invent at least one probe neither of us thought of that would separate our views. I was thinking something like an alphabet-surgery probe: rerun the same battery on people whove been told the alphabet stops at m, or that it wraps around so z goes to a — but come up with whatever actually discriminates, and say in advance what each of us should predict.

  If part of our fight is only verbal, say which part and why.
