answer: |-
  # ETHICS SEMINAR HANDOUT: The Lying vs. Misleading Diagnostic Tree

  **Instructions:** Start at **Node 1**. Answer the question based on your moral intuition about the specific case provided. Follow the arrow corresponding to your answer to the next Node or to a Final Position (Leaf). Work through until you land on a Leaf.

  ---

  ### THE TREE

  **Node 1: The Murderer at the Door**
  A violent aggressor asks you where your friend is hiding. You know if you tell the truth, your friend will be killed.
  *   **A.** I must not lie (though I may try to mislead or stay silent). → **Leaf 1**
  *   **B.** I am permitted (or required) to lie to save the life. → **Node 2**

  **Node 2: The "Paltering" Case**
  A journalist asks a Senator if he had an affair. The Senator says, "I did not have sexual relations with that woman," defining "sexual relations" narrowly to exclude what actually happened. The statement is literally true but designed to mislead.
  *   **A.** This is morally worse than a straightforward lie (it is manipulative). → **Leaf 2**
  *   **B.** This is either equally bad or better than a lie. → **Node 3**

  **Node 3: The Panic Case**
  Scenario X: You lie to a crowd to prevent a stampede (good outcome).
  Scenario Y: You tell a technically true but misleading statement that causes confusion and a stampede (bad outcome).
  *   **A.** Scenario X is better. The moral weight rests entirely on the outcome/harm. → **Leaf 3**
  *   **B.** Scenario Y is not necessarily worse; the deception itself is the primary wrong, regardless of the panic. → **Node 4**

  **Node 4: The Silent Deceiver**
  You want your rival to miss a meeting. You do not speak to them, but you move the clock on their wall back one hour. They miss the meeting believing they are on time.
  *   **A.** This is morally identical to lying to them. The deception is the wrong. → **Leaf 4**
  *   **B.** This is different from lying. Lying requires an assertion/claim. → **Node 5**

  **Node 5: The Willful Ignorance Case**
  You suspect a gift you bought is broken. You deliberately avoid checking the box so that you can sincerely say, "I'm sure it works."
  *   **A.** This counts as lying (you believe it's likely false). → **Leaf 5**
  *   **B.** This is not lying (you technically believe your statement), but it may be misleading. → **Node 6**

  **Node 6: The Warrant Question**
  You say something literally true to a colleague, but you know they will infer something false. Later, they discover the truth and say, "You betrayed your word."
  *   **A.** They are right. By speaking, you committed to not misleading them. → **Leaf 6**
  *   **B.** They are wrong. You only committed to literal truth. → **Node 7**

  **Node 7: The Double Audience**
  You tell a spy, "The meeting is at noon." You know the spy is bugged, and the enemy listening will interpret "noon" as code for "midnight" and move their troops incorrectly.
  *   **A.** The primary wrong (if any) is done to the enemy bystanders who are misled. → **Leaf 7**
  *   **B.** The primary wrong (if any) is done to the addressee (the spy) or the relationship. → **Node 8**

  **Node 8: The Phatic Case**
  At a dinner party, a host asks, "How was the food?" It was terrible. You say, "Delicious!" to be polite.
  *   **A.** This is morally exempt; social norms suspend the duty of truth here. → **Leaf 8**
  *   **B.** This is still a lie, just a venial one; the norm of truth still applies. → **Leaf 9**

  ---

  ### THE LEAVES (Your Position)

  *   **Leaf 1: Absolutism about Lying.**
      Lying is intrinsically wrong and never permissible, even to save a life. Misleading may be permissible because it does not violate the absolute prohibition on assertion of falsehood.
  *   **Leaf 2: The "Paltering is Worse" View.**
      Misleading can be morally worse than lying. Deliberately exploiting literal truth to deceive is more manipulative and corrosive to discourse than a straightforward lie.
  *   **Leaf 3: Straight Consequentialism.**
      The distinction between lying and misleading does no moral work. Only the outcomes (harm/benefit) matter. A lie that saves lives is good; a truth that kills is bad.
  *   **Leaf 4: Deception-First View.**
      The moral wrong is causing false belief (deception), not the act of asserting. Lying and misleading are morally equivalent because the core harm (deception) is the same.
  *   **Leaf 5: Pro-Tanto Assertionism.**
      Lying is defined by the speaker's belief, not just literal falsity. Willful ignorance to facilitate a false assertion counts as lying, which is *pro-tanto* wrong (wrong unless overridden).
  *   **Leaf 6: The Warrant View.**
      Assertion creates a normative commitment (warrant) to truthfulness that mere misleading does not. You violate a specific right of the listener when you assert, but not when you merely imply.
  *   **Leaf 7: Autonomy/Rights Picture.**
      The wrong is violating a person's right to accurate information to guide their agency. This can extend to bystanders (like the enemy in Node 7) whose autonomy is hijacked by your deception.
  *   **Leaf 8: Trust/Relationship Picture.**
      Moral obligations depend on the context of the relationship. In phatic or social contexts, the expectation of truth is suspended to maintain social bonds; in epistemic contexts, it is not.
  *   **Leaf 9: Strict Normativism.**
      The norm of truth-telling is context-invariant. Social niceties are still lies, merely excused by politeness, but they remain moral blemishes.

  ---

  ### KEY & DIAGNOSTIC NOTES

  **1. Empty Cells in the Logical Space**
  There are theoretical positions that are logically possible but virtually unoccupied.
  *   **The "Honest Trap" View:** *Lying is permissible, but misleading is forbidden.*
      *   **Diagnosis:** **Unattractive.** This view would require believing that direct falsehood is less dangerous than indirect truth. While Leaf 2 argues misleading can be *worse*, no serious theory argues it is *always* worse while lying is *always* okay.
  *   **The "Definitional Dualist":** *Lying and Misleading are definitionally identical, but morally distinct.*
      *   **Diagnosis:** **Incoherent.** If the definitions are identical, there is no property to ground the moral distinction. The moral difference must track some descriptive difference (e.g., assertion vs. implication).

  **2. Indistinguishable Leaves**
  *   **Leaf 3 (Consequentialism) and Leaf 4 (Deception-First).**
      *   **Flag:** **Hard to Separate.** In practice, these views often yield the same verdicts. Both treat the *lying/misleading* distinction as morally inert. They only diverge on *why* an act is wrong (Harm vs. Deception). If a deception causes no harm, the Consequentialist says it's fine; the Deception-First theorist says it's still wrong. However, in most high-stakes cases (like the Murderer or Panic), they will guide you to the same action.

  **3. Required Cases Check**
  *   *Murderer:* Node 1.
  *   *Paltering (True but misleading):* Node 2.
  *   *Phatic:* Node 8.
  *   *Willful Ignorance:* Node 5.
  *   *Double Audience:* Node 7.

  **4. How to Use This in Seminar**
  Have students pair up and run through the tree. If they land on different leaves, ask them to identify the **Node** where they diverged. That Node identifies the specific philosophical disagreement (e.g., "We disagree on Node 6: Does speaking create a warrant?"). This moves the debate from "Lying is bad" to specific normative commitments.
