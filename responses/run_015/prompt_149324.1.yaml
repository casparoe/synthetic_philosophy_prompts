  *(Self-Correction during drafting)*: I initially thought about saying "It's still a 17th-century painting." That's true and safe. I need to make sure I don't sound like I'm apologizing for doing the exam. It was an act of care. I need to validate the mother's feeling that something is being taken away, while reframing what remains.

