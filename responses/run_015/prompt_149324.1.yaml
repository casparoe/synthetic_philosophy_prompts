      *   **The Decision/Plaque (1.5 mins):** Announce the labeling strategy. Keep the old plaque (history) but add a new explanation (truth). This isn't splitting the difference; it's telling the whole story.
      *   **Closing (0.5 min):** Bring it back to the viewer. Look at the picture. Honor Hilda's wish.

  4.  **Refining the Language (Iterative Process):**
      *   *Check:* Did I say "copy"? No, use "painted in the style of," "from the same time," "workshop piece."
      *   *Check:* Did I say "fake"? No.
