      *   **Opening (1 min):** Acknowledge the occasion. Welcome everyone. Acknowledge the painting's presence. Connect immediately to Hilda.
      *   **The History/Discovery (2 mins):** Briefly explain why the exam happened (grant, care for collection). State the findings gently. *Crucial:* Avoid forbidden words. Use phrases like "made later than we thought," "workshop tradition," "name added later." Acknowledge the dealer believed it, Hilda believed it. It was an honest belief.
