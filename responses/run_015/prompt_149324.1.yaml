      *   *The Plaque:* "We will hang the brass plaque Hilda knew... alongside a new note that tells the rest of the story."

  6.  **Review against Constraints:**
      *   *Forbidden words:* Fake, Forgery, Copy. (Must scan for these).
      *   *Jargon:* No dendro-chronology, no pigment analysis details. Just "science told us."
