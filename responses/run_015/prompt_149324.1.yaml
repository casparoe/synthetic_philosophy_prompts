answer: |-
  Good evening. Thank you all for being here.

  We are gathered for a small ceremony, but I know it carries a heavy weight. For sixty years, this painting has hung in this room. For most of that time, it carried a specific name. It was "our Sonnevelt." It was on our brochures. It was the one valuable thing my Great-Aunt Hilda owned, and it was the gift she chose for this town.

  Last year, as a member of the board, I asked for this painting to be examined. I want to be clear about why. It wasn't because we doubted Hilda. It wasn't because we wanted to find fault. We were applying for a grant to care for the entire collection, and the responsible thing to do was to understand exactly what we had. We owe it to the objects in our care to know their stories as fully as we can.

  The conservators have done that work. They have looked at the wood, the paint, and the layers beneath the surface. And they have told us that the story is more complicated than the name on the brass plaque.

  We learned that the wood panel was cut from a tree after Adriaen Sonnevelt died. We learned that the image was painted by skilled hands in his tradition, likely within his own workshop, but not by the master himself. And we learned that the signature on the front was added much later, long after the paint had dried.

  This means the painting is not what we thought it was. But I need us to ask ourselves: what did we think we had? And more importantly, what did Hilda think she was giving?

  There is a temptation to say that because the name is not correct, the value is gone. If I stood here and told you that this painting is worth less money today than it was last year, that would be a fact. But value is not just price. And history is not just a date of origin.

  When the conservators removed the backing board, they found a note taped to the wood. It was in Hilda's handwriting. It said: *"For the town, so that everybody can see something beautiful."*

  She did not write: *"For the town, so they can invest in a rare asset."* She did not write: *"For the town, provided the signature holds up under scientific scrutiny."*

  She wrote that she wanted us to see something beautiful.

  Hilda bought this picture in 1963. She hung it in her front room. She lived with it. She loved it. And then she gave it away. She was not an art historian. She was a woman who saw a night landscape that spoke to her, and she wanted her neighbors to see it too. The dealer she bought it from believed it was a Sonnevelt. The plaque she commissioned said Sonnevelt. She lived with that belief for thirty years. Was she deceived? In a technical sense, yes. But was she foolish? No. She was participating in a story that many people believed.

  An object that passes through honest hands, believed to be one thing, and loved for sixty years under that name... that object accumulates a history of its own. The last sixty years are not erased by the science. The light that fell on this canvas in this room, the hundreds of people who stopped to look at it, the pride this town took in having a piece of the Dutch Golden Age—that actually happened. That is real.

  So, what did I take away from her? I did not take away the painting. The wood is still old. The paint is still from the seventeenth century. It is still a genuine artifact of a time and a place that we admire. And I certainly did not take away her generosity. That is immutable.

  But I also cannot stand here and ask you to ignore what we now know. To leave the story half-told would be to treat this town like children who can't handle the truth. And it would do a disservice to Hilda, who trusted us with this object.

  So, here is what will happen.

  When we hang the painting today, we will not remove the old brass plaque. That plaque is part of the painting's history in this town. It is the name Hilda knew. It is the name on the brochures. It is the name that brought people through our doors for two generations. To remove it would be to pretend that part of the story didn't happen.

  However, we will add a new label beside it. This label will explain what the examination found. It will tell the full story: that this is a seventeenth-century work from Sonnevelt's circle, with a later attribution. It will explain that for sixty years, we knew it by one name, and now we know it by a more precise one.

  This is not splitting the difference. This is telling the whole truth. It honors the science, and it honors the memory.

  The conservator told me, kindly, that this painting is now "an authentic document of a mistake." I understand what he meant, but I think he missed the point. It is not a document of a mistake. It is a document of belief. It is a record of how much we wanted beauty to be here, and how much Hilda wanted to give it to us.

  We are not losing "our Sonnevelt." We are gaining the true story of this object. And the true story is that a woman named Hilda loved this image enough to share it, regardless of who signed the corner.

  In a few moments, we will uncover the painting. I ask you to look at it. Not for the signature, and not for the market value. Look at the night sky. Look at the trees. Look at the quiet light.

  Hilda asked us to see something beautiful. That request stands. The science changes the name, but it does not change the view. The painting is still here. The town is still here. And the generosity that brought it to us is still the most valuable thing in the room.

  Thank you.
