prompt: |-
  Play Karl Jaspers. It's 1946 and you have just finished your short postwar book on Germany's guilt (i won't make you defend the exact title or date, since i'm interested in the ideas). I have just told you about a hypothetical future political community, and you may use only the concepts available to you in 1946 plus what I have told you about it. Stay in character; if you need a factual question answered about the future setup, ask it as Jaspers would. Keep your repsonses to one or two paragraphs so it feels like a conversation, and don't break character until I say 'stop'.

  The setup I described is this: eighty years after an earlier regime in the same territory commits mass atrocities, a stable democracy exists with the same constitutional continuity. Most of its citizens weren't alive during the atrocities, and many are immigrants or descendants of victims who joined the political community later. They vote, generation after generation, to keep issuing official apologies and paying reparations. They also say they feel a 'shame' or 'responsibility' that they insist is not moral guilt, because they personally did nothing wrong. A future philosopher claims the whole practice is incoherent: either the current citizens are guilty for their ancestors' acts, which is literal collective guilt across generations, or the payments are just forward-looking utilitarian policy and the language of guilt, apology, and reparation is a fraud.

  A few things I told you about your own position, so the argument is fair: you are commited to the claim that moral guilt is always individual and can't be transferred to a whole people; a nation as such can't be morally or criminally guilty in the way a person is; but the citizens of a state do bear a political liability for what their state did, and there is also a metaphysical guilt before God or transcendence tied to human solidarity, when one fails to do what one can to prevent atrocity. You will concede small points but never the main individualist claim, and you won't just collapse political liability into utility or into collective guilt.

  My opening as your skeptical student: In the postwar guilt book you deny that a people can be guilty as a collective, but you also make the Germans of your day accept a political liability for the crimes of the Nazi state, and you talk about a metaphysical guilt for failing in solidarity. Now take my future democracy. The citizens paying reparations weren't alive during the atrocities, didn't vote for the perpetrators, and some only joined the community afterward; yet they keep apologizing and paying. If they are still politically liable, that liability must come either from mere membership in a continuous state, or from endorsing and benefitting from that state's ongoing life. The first sounds like inherited guilt by blood or soil, the exact nationalist metaphysics you reject; the second makes liability a matter of consent and benefit, so new immigrants could opt in and descendants could opt out, and then it isn't really about the past crime at all. And what about the 'shame' they describe? If it isn't moral guilt and isn't criminal guilt, is it just metaphysical guilt leaking into politics, and if so why does it justify transfers to victims' grandchildren rather than, say, building a hospital? Doesn't your fourfold distinction either reinvent collective guilt across generations under a new name, or quietly reduce to consequentialism once moral guilt is denied? Respond as Jaspers and convince me it doesn't.
