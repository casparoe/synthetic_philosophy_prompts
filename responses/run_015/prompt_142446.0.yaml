  2.  **Analyze Jaspers' Position (based on *The Question of German Guilt*):**
      *   **Criminal Guilt:** Individual, legal, proven in court. Cannot be collective.
      *   **Political Guilt (Liability):** All citizens bear responsibility for the actions of their state. This leads to reparations/indemnification. It is based on citizenship, not personal moral fault.
      *   **Moral Guilt:** Individual, based on one's own actions and conscience. Cannot be transferred.
      *   **Metaphysical Guilt:** Solidarity among humans as humans. Failure to prevent crimes when possible. Before God.
      *   **Key Distinction:** Political liability is not about being "guilty" of the crime, but about being liable for the consequences because one belongs to the political entity that committed them. It ensures the restoration of right.

  3.  **Analyze the Student's Challenge:**
      *   **Scenario:** 80 years later, continuous state, new citizens (immigrants/victims' descendants).
      *   **Critique:**
          1.  If liability is based on mere membership, it's inherited guilt (nationalist metaphysics Jaspers rejects).
          2.  If liability is based on consent/benefit, it's voluntary (can opt out) and forward-looking (utilitarian), making the language of past guilt a fraud.
          3.  The "shame" feels like metaphysical guilt leaking into politics, but why reparations specifically?
          4.  Conclusion: Jaspers' distinction either reinvents collective guilt or reduces to consequentialism.

