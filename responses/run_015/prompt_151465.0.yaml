answer: |-
  **INTERNAL PROTOCOL DOCUMENT: T&S-APL-004**
  **TO:** Trust & Safety Appeals Division
  **FROM:** Senior Appeals Officer
  **SUBJECT:** Family-Resemblance Adjudication Protocol (FRAP) for Edge-Case Content
  **DATE:** October 26, 2023
  **STATUS:** Mandatory Effective Immediately

  **1. PREAMBLE: ROLE AND CONSTRAINTS**
  You are the final human arbiter for content appeals. You must process 50 appeals per 8-hour shift (approx. 9 minutes per case). No legal counsel is available. Every ruling bears your digital signature and incurs personal professional liability. Each ruling requires a mandatory 150-word justification documenting your reasoning. This protocol replaces essentialist definitions (e.g., "Is this *actually* hate speech?") with a comparative similarity analysis. Essentialist approaches fail here because edge cases (AI voice, remixes) lack single defining features; they operate in grey zones where meaning is determined by use, not inherent properties.

  **2. THE DECISION PROCEDURE (FRAP)**
  Execute the following four steps in order. Do not skip.

  *   **Step 1: Identify the Practice (Form of Life).**
      Determine the specific social context or "game" the content plays. Is this political commentary, fan satire, commercial advertising, or private harassment? Ask: *What are the users doing here?* If the context is ambiguous, note it for escalation.
  *   **Step 2: Map Family Resemblances.**
      Compare the content against canonical, previously adjudicated examples of policy violations (the "family"). Do not look for a perfect match. Look for criss-crossing analogies: tone, intent, format, audience reaction, and potential harm.
  *   **Step 3: Assess Trait Overlap.**
      Count the overlapping traits. Are enough "family traits" present to warrant enforcement? If key traits (e.g., intent to harm in harassment) are absent, the content falls outside the category, even if it looks similar superficially.
  *   **Step 4: Flag Discretionary Sign-Off.**
      Identify where judgment could not be eliminated. If you rely on intuition rather than trait overlap, you must document this uncertainty in your 150-word justification. This is your liability point.

  **3. ESCALATION TRIGGERS**
  *   **Settle:** When Step 3 shows clear trait absence (exclude) or strong trait overlap (include).
  *   **Escalate:** When Step 1 fails (context is unknowable) or Step 3 yields indeterminate overlap (e.g., satire traits match hate speech traits equally). Escalate when the "family" itself is contested.

  **4. WORKED APPLICATIONS**

  *   **Case A: Synthetic-Voice Parody (Exclusion)**
      *   *Context:* Fan community dubbing a politician's voice over a cartoon.
      *   *Resemblance:* Sounds like the politician (trait match).
      *   *Assessment:* Lacks traits of harassment (no targeted abuse, no intent to deceive, community recognizes parody).
      *   *Ruling:* Exclude from "Harassment." Justification notes absence of harm-intent trait.
  *   **Case B: Procedurally Generated Meme (Inclusion)**
      *   *Context:* AI image posted as breaking news photo.
      *   *Resemblance:* Looks like news (format), claims false event (content).
      *   *Assessment:* Shares core traits of "Misinformation" (deceptive format, false claim), regardless of AI origin.
      *   *Ruling:* Include under "Misinformation." Justification cites deceptive format trait.
  *   **Case C: Context-Stripped Remix (Escalation)**
      *   *Context:* Clip of protected satire edited to look like earnest extremism.
      *   *Resemblance:* Matches satire form (trait A) but functions as dogwhistle (trait B).
      *   *Assessment:* Overlap is indeterminate. Family traits contradict.
      *   *Ruling:* Escalate. Justification cites conflicting trait overlap requiring policy review.

  **5. LIMITATIONS AND IRREDUCIBLE CONFLICTS**
  This procedure cannot resolve value conflicts where the "family" of acceptable speech is itself disputed (e.g., legitimate political dissent vs. coded hate). Family-resemblance reasoning reaches its limit when there is no consensus on the canonical examples themselves. If the "game" is new (e.g., a novel AI interaction mode), there is no family to compare against. In these instances, the protocol mandates escalation. You cannot use similarity to judge what has no prior resemblance. Do not force a ruling where the language game is undefined; your liability extends to pretending certainty where none exists.

  **END OF PROTOCOL**
