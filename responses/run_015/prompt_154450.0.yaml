  The bass drags down where gravity holds sway,
  In stone and mass the blind foundation lay.
  Then tenor climbs like sap in slow display,
  Through vegetable roots deep in the clay.
  The alto wakes the beast's instinctual heat,
  Where animal life moves on wandering feet.
  At last the soprano, melody and mind,
  Thinks it leaves the brute procession far behind.

  Yet harmony is hunger's brief repose,
  No goal attained, but pause within the throes.
  The melody's high purpose is a mask,
  The same blind urge that drives the bass's task.
  The illusion fades: our human ends differ
  In kind from stone and sap that blindly stir.

