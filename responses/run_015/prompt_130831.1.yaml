answer: |-
  Yes, your premise is confused. It relies on a false dichotomy regarding the historiography and a category error regarding historical modality. You cannot settle the modal status of a trans-historical aphorism ("revolutions devour their children") solely by resolving the causal mechanism of a single event (1789), nor have you correctly mapped the necessity/contingency divide onto the Marxist/Revisionist split.

  Here is the plain correction of the three specific errors in your reasoning.

  ### 1. You have mischaracterized the Revisionist position on the Terror.
  Your argument rests on the assumption that the Revisionist account treats the Terror as "accidental" or "contingent," whereas the Marxist account treats it as "structurally functional." This is historically inaccurate regarding the dominant Revisionist voice, François Furet.

  Furet did not argue that the Terror was a contingent byproduct of rhetorical choices that could have easily gone otherwise. He argued that the Terror was **ideologically necessary**. In *Interpreting the French Revolution*, Furet posits that the Jacobin discourse of the "general will" contained an internal logic that made opposition equivalent to treason. Once the Revolution committed to a democracy of public opinion without institutional mediation, the Terror became the inevitable mode of governance.

  Therefore, both the Classical Marxist (Soboul) and the Revisionist (Furet) camps argue for a form of **necessity**. They disagree on the *source* of that necessity (economic structure vs. discursive logic), but they agree that the outcome was not merely accidental. Your dichotomy collapses because both sides can accommodate the claim that the radical wing *had* to be purged, given their respective starting premises. Resolving the causal dispute (class vs. discourse) does not settle the modal status (necessity vs. contingency) because both camps argue for necessity.

  ### 2. You are conflating single-case causation with trans-historical law.
  The phrase "revolutions devour their children" is a comparative claim about the nature of revolution *as a category*. The Marxist/Revisionist debate is primarily about the *French Revolution specifically*.

  Even if you proved definitively that the purging of the Hébertists and Dantonists was structurally necessary in 1789, that does not prove it is a law-like regularity for all revolutions (e.g., Russia 1917, Iran 1979). Conversely, if you proved it was contingent in 1789, it might still be a structural necessity in other contexts due to different mechanisms (e.g., security dilemmas in civil war).

  Identifying the causal mechanism of Event A does not automatically determine the modal status of Generalization B. To settle whether "devouring children" is a historical regularity, you need comparative political theory (e.g., Theda Skocpol's structuralism or game-theoretic models of revolutionary coalitions), not just 1789 historiography. You are trying to extract a universal law from a singular causal debate.

  ### 3. You are treating historical "necessity" as logical necessity.
  Your framing suggests that if the Marxist view is correct, self-destruction must be "law-like." This misunderstands historical materialism. Marxists generally deal in **tendencies** and **constraints**, not logical or physical laws. A Marxist might argue that bourgeois consolidation *tends* to require purging radicals, but they would acknowledge that specific outcomes depend on conjunctural factors (war, harvest, leadership).

  Similarly, a sophisticated Revisionist might argue that while the *discourse* created a logic of terror, specific victims were contingent.

  Historical reasoning rarely deals in binary modality (necessary vs. accidental). It deals in **path dependence**. Once a revolution enters a certain trajectory (whether defined by class conflict or discursive escalation), the set of probable outcomes narrows. Whether that counts as "necessity" is a philosophical definition, not a historical finding. Assuming that identifying a causal mechanism resolves this philosophical definition is a category mistake: causation explains *how* something happened; modality explains *what kind of truth* the explanation holds. One does not automatically dictate the other.

  ### Conclusion
  Your assumption is incorrect. Resolving the 1789 causal dispute does not settle the modal status of revolutionary self-destruction because:
  1.  **Historiographically:** Both major camps argue for forms of necessity (structural vs. ideological), so the debate isn't about necessity vs. contingency.
  2.  **Logically:** A causal explanation of one case cannot establish the modal status of a trans-historical generalization.
  3.  **Philosophically:** Historical causation does not map cleanly onto binary modality (law vs. accident).

  You are looking for a key in the 1789 historiography that opens a door in the philosophy of social science. It isn't there.
