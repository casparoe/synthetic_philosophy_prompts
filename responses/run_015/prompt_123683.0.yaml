          *   Introduce the distinction (Omissive vs. Commissioned).

      *   **Section 1: The Ontology of Silence (Omissive vs. Commissioned):**
          *   Define *Omissive Silence*. It's empirical. It's about physical absence. It suggests the archive *wanted* to capture everything but failed.
          *   Define *Commissioned Silence*. It's epistemic. It's about the rules of the game. The archive *cannot* capture certain things because its grammar forbids it.
          *   Analogy: A map that leaves out mountains because it only measures elevation above sea level (omissive) vs. a map that leaves out sacred sites because they are deemed "non-geographic" (commissioned).
          *   Argument: Commissioned silence is the stronger form of power because it dictates reality, not just records it.

      *   **Section 2: The Structural Work of Negative Space:**
          *   How does commissioned silence function? It's not just a hole; it's a load-bearing wall.
          *   It defines the "sayable."
          *   It creates the coherence of the narrative. If you include the "unarchivable," the archive's logic collapses.
          *   Therefore, the silence is *doing work*. It maintains the authority of the institution.

      *   **Section 3: The Normative Turn (Ethics of Practice):**
          *   Critique the "Representational-Completeness Model." Trying to fill the gap assumes the gap was a mistake. It imposes current values on past structures. It risks ventriloquizing the silenced.
          *   Propose the "Archaeology of the Void." Treat the silence as an artifact.
          *   Practice: Don't insert the missing voice; display the mechanism that excluded the voice. Make the exclusion legible.
          *   Goal: Epistemic justice, not just representational equity.

      *   **Section 4: Addressing the Objection (Aestheticizing Oppression):**
