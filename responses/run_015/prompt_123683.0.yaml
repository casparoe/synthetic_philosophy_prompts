      *   *Omissive Silence:* Accidental. "We didn't have the money," "We lost the file," "No one thought to write it down." It implies a *lack*.
      *   *Commissioned Silence:* Structural/Epistemic. "This doesn't count as evidence," "This category doesn't exist," "This voice is inadmissible." It implies a *boundary*.
