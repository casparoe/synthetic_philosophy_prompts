      *   **Constraints:**
          *   Time limit: 3 hours (context for me, not directly relevant to output format).
          *   Word limit for students: 2,000 words (context).
          *   Output format: Continuous prose only. No headings, no bullet points, no bold text, no tables, no list of further reading. Like an email to a colleague.
          *   Content Requirements:
              *   One question on the meta-problem.
              *   Must avoid the usual realist vs. illusionist standoff.
              *   Must use specific stipulative definitions: "diagnostically slack" (mechanism produces same reports regardless of experience) vs. "gripping" (explains why reports have specific features like ineffability, privacy, etc.).
              *   Must force students to address the separability of grip and slack.
              *   Must highlight a dilemma: Illusionism (slack by design), Realism with grip (risks interaction problem), and a "neglected third option" (reports true, mechanism explained without appeal to truth-makers -> unmoored correctness).
              *   Must address the "zombie report" move (system trained to produce reports) and make it earn its keep.
              *   Model answer: ~800 words.
              *   Marking scheme: Out of 20, naming specific moves for first-class answers and specific errors (treating meta-problem as empirical, genetic fallacy/debunking via aetiology, assuming slack implies falsehood).
