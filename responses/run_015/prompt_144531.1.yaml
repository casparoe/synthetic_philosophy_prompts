  The dispersed-vat scenario combines the **synthetic/functional success** of Case 5 (latency <5ms) with the **spatial distribution** of Case 4 (no single boundary). Because Case 4 was rejected for latency and Case 5 was accepted for containment, we cannot know if your friend rejects distribution because of the *distance* or the *lag*, nor if she accepts synthetic minds only when *contained*.

  ### Two Plausible Underlying Rules
  To explain her five prior rulings, she must be operating on one of two principles. Both fit the data but predict opposite outcomes for the dispersed-vat case.

  **1. The Principle of Physical Contiguity**
  *   **Definition:** A unified macro-subject requires a continuous physical medium or a single enclosing boundary (e.g., a cranium, membrane, or biological bridge like the brainstem) that sustains a unified field. Spatial separation breaks the subject, regardless of functional integration.
  *   **Support:** Explains Case 1 (biological boundary), Case 3 (brainstem continuity trumps functional disunity), and Case 5 (contained field). Explains rejection of Case 2 (distinct organisms) and Case 4 (distributed servers).
  *   **Prediction for Dispersed-Vat:** **No unified macro-subject.** The three vats lack a shared container or continuous physical bridge; wireless signals do not constitute the requisite physical field continuity.

  **2. The Principle of Temporal Integration**
  *   **Definition:** A unified macro-subject requires information processing to be integrated within the characteristic temporal window of consciousness (e.g., <50ms). Spatial distribution and substrate are irrelevant provided causal latency remains below this threshold.
  *   **Support:** Explains Case 1 and Case 5 (both integrated). Explains rejection of Case 4 explicitly due to "transmission lags." Explains Case 3 by implying the brainstem maintains sufficient temporal coherence despite functional split.
  *   **Prediction for Dispersed-Vat:** **Yes, unified macro-subject.** The latency (<5ms) is well within the conscious window, preserving the causal structure of the original mind.

  ### Substantive Principle at Stake
  Choosing between these predictions forces a decision on the **metaphysical basis of consciousness**:
  *   Choosing **Physical Contiguity** entails that consciousness is a **field phenomenon** dependent on specific topological or physical properties of matter (e.g., electromagnetic continuity).
  *   Choosing **Temporal Integration** entails that consciousness is a **process phenomenon** dependent on causal dynamics and information flow, irrespective of the physical medium's continuity.

