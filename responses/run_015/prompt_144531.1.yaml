  ### Closest Analogs and Their Conflict
  The two closest analogs are **Case 4 (Distributed Supercomputer)** and **Case 5 (Synthetic Neural Mesh)**.

  *   **Case 4** suggests that spatial distribution negates macro-subjecthood, but the stated reason is "light-speed transmission lags" (temporal disintegration), not distribution *per se*.
