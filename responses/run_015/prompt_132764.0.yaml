answer: |-
  1. Sidgwick would conclude that deadbots prove the evidence he spent his life collecting was never sufficient to prove survival, confirming his fear that reason cannot guarantee a moral universe.

  2. This verdict comes from two specific commitments in his work. First, Sidgwick was a strict empiricist who insisted that any claim of survival must rule out all natural explanations, like fraud or coincidence. If a modern algorithm can produce "private knowledge" without a soul, then the medium's private knowledge from 1890 doesn't prove a soul either; it just proves information transfer. Second, and more painfully, Sidgwick worried about the "dualism of practical reason." He thought utilitarianism (doing the most good) only makes sense if being moral also leads to happiness, which often requires an afterlife where justice is served. I am not entirely sure how much he actually believed psychical research *would* succeed versus how much he just felt he *had* to try it to save morality. If he secretly thought success was unlikely, deadbots just confirm his pessimism. If he thought success was probable, deadbots crush that hope.

  3. The strongest counter-argument is that Sidgwick's project was never about information anyway, so the bot is irrelevant. A deadbot is a mirror reflecting data back at you, whereas the spirit hypothesis claims there is a conscious agent on the other end experiencing the conversation. The Society for Psychical Research wasn't just asking, "Can this information be known?" but "Is there a presence here?" A chatbot has no interior life, no suffering, and no moral agency, so it fails the test before it even begins. From this view, the existence of a convincing fake doesn't disprove the real thing; it just means we have to be more careful. Sidgwick might say the bot is a "natural cause" that explains away bad evidence, but it doesn't touch the good evidence where a medium reveals something truly unknown to anyone living, which even a bot trained on past data couldn't predict.

  4. My guess is most likely wrong if Sidgwick valued the psychological function of belief over the strict proof. He was deeply anxious about morality collapsing without religion. If his engagement with psychical research was mostly a way to keep hope alive rather than a strict scientific test, then deadbots might not bother him. He might say, "Even if this is a machine, if it comforts the living and encourages moral behavior, it serves a purpose." What would change my mind is finding a letter where he admits that even a slim probability of survival was enough for him. If he was willing to wager on a 1% chance to save ethics, then a 99% chance of a bot doesn't matter. But based on his rigorous writing style, he seems like a man who needed facts, not comfort.

  5. **Historical Note:** Sidgwick's involvement with the Society for Psychical Research and his ethical worry about the "dualism of practical reason" are historical facts documented in *The Methods of Ethics* and his biographies. However, his specific reaction to AI deadbots is obviously speculative reconstruction. I am applying his known philosophical standards to a technology he could not imagine. Please do not cite this as proof of what Sidgwick "believed" about AI, but rather as an interpretation of how his principles might apply today.
