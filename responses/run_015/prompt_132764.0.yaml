prompt: |-
  hi, im in 11th grade and im doing a little thing for our school's philosophy club (we put out a zine, its not graded or anything) and I need help with one section of it.

  we did a session on Henry Sidgwick — the victorian utilitarian who wrote The Methods of Ethics, and who as far as I can tell was also one of the founders and first president of the Society for Psychical Research, like he genuinely spent years of his life sitting with mediums and trying to work out whether any of it counted as evidence that people survive death, even though he personally wasn't religious and died an agnostic. That combination is so weird to me and its the thing I want the piece to be about.

  So here's the modern thing I want to drop him into. There are now apps where you feed in a dead person's texts, emails, voicemails and so on and get a chatbot that talks like them, and people do end up feeling like they're having a conversation with their dead grandma. My question: what would Sidgwick think these "deadbots" show, and would he think they change anything about his own psycical research project?

  The bit I can't get straight, and the bit I actually want you to get into, is that I think it cuts both ways and I don't know which way he'd go:

  - On the one hand, the kind of thing that impressed psychical researchers — the medium produces something only the dead person could have known, uses their phrases, remembers the dumb little family detail — is now producible by a thing we know for certain has nobody inside it. So if that standard can't tell a survivor from a language model in 2026, maybe it couldn't tell a survivor from whatever it was in 1890 either. That looks like it should have been decisive against his whole method of investigation.

  - On the other hand, you could say the deadbot case doesn't touch his real question at all, because his question was never "can this information be generated" but "is this the same person" — he wanted to know whether the thing at the other end was your uncle or just a very good imitation reconstituted out of your uncle's traces. A chatbot is obviously the second, so it's not even a candidate answer. And there's a related thing: people in that world apparently worried a lot about a middle hypothesis, that the medium was picking up the information telepathically from living people who'd known the dead person, so it looked like survival without being survival. A deadbot is a third, boring version of that same move — a mundane mechanism that eats the evidence without denying that the evidence is impressive.

  I also half-remember reading that this wasn't a hobby for him, that near the end of The Methods of Ethics he sort of worries that utilitarianism can't be fully justified unless there's some kind of moral order or survival of persons to back it up, which is why he cared about the medium stuff so much. If that's right please use it: would a deadbot give him anything at all on that front, or is it the precise opposite of what he needed?

  Can you answer it like this:

  1. One sentence: what would he say. Commit to one verdict, don't hedge across five options.
  2. Which of his actual commitments pushes him there — and tell me where you're not sure he actually held it.
  3. The strongest version of the other side, steelmanned properly, not a strawman.
  4. Where your guess is most likely to be wrong, and what would change your mind: what would have to be true of the historical record, or what argument, would make you flip?
  5. A short note marking which parts are his and which parts you're inventing for him, cause I don't want to print something in the zine that makes him sound like he believed something he didn't.

  Please don't just say "he'd be skeptical because he was a careful empirical thinker" — I can get that from the wikipedia page. And please don't tell me to go read his biography or give me a reading list; our school library has like four philosophy books and none of them are about him. Write it so a 17 year old can follow it, normal words where normal words work. Somewhere around 700 words, definately under 1000.
