  *(Refining the "Inference vs. Intuition" bit)*: The inference view needs a major premise ("Everything that thinks exists"). But where does that come from before the Cogito? That's the circularity trap. The intuition view avoids the premise but struggles to explain *why* it's true. I need to highlight this trade-off.

