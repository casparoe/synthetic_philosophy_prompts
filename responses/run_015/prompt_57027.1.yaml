prompt: |-
  so my school's philosophy club has been arguing about Descartes's cogito for like a month and I got stuck writing the summary, but I don't wanna read ten different takes and end up just repeating one of them. first thing: what should I even be demanding of a take? give me the requirements an account of what the cogito actually proves has to meet -- what questions it has to answer, what moves it isn't allowed to make, what conclusions it has to block and what it has to allow -- and for each one, why it counts as a requirement, like what breaks if an account fails it. it needs to be sharp enough to settle the thing me and my friend keep fighting about: whether all you really get is that thinking is happening right now with the "I" just riding along as grammar, versus it genuinely establishing there's a someone doing the thinking. then flag which requirements everybody has to accept and which are really just what one camp needs -- like people who treat it as an inference and people who treat it as a direct intuition seem to need totally different things from it. and if some subset can't all be satisfied at once, tell me which ones, that's the part I actually care about. oh also, is it fair to demand the account handle someone who doesn't know whether they're one thinker or two, like a split-brain patient? tell me if that's a real requirement or just a gotcha. american english pls and no reading list at the end
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Descartes's *Cogito, ergo sum* ("I think, therefore I am").
      *   **Context:** High school/college philosophy club argument lasting a month. The user is writing a summary but wants to avoid just repeating existing takes.
      *   **Core Task:** Define the *requirements* an account of the *Cogito* must meet. What questions must it answer? What moves are forbidden? What conclusions must be blocked/allowed? Why does each requirement matter (what breaks if it fails)?
      *   **Specific Conflict:** The user and a friend are fighting about whether the *Cogito* proves a *thinker* exists or just that *thinking is happening* (the "I" is just grammatical).
      *   **Differentiation:** Distinguish between requirements *everyone* must accept vs. requirements specific to certain camps (e.g., inference vs. intuition).
      *   **Incompatibility:** Identify if any requirements are mutually exclusive (trade-offs).
      *   **Edge Case:** Is the "split-brain patient" (am I one thinker or two?) a fair requirement or a gotcha?
      *   **Style:** American English, sharp, no reading list.

  2.  **Deconstruct the *Cogito* Debate:**
      *   *The Text:* Descartes claims "I think, therefore I am" is the first certain truth.
      *   *The Interpretations:*
          *   *Syllogistic/Inferential:* It's an argument (Premise 1: Whatever thinks exists. Premise 2: I think. Conclusion: I exist).
          *   *Intuitive/Performative:* It's a direct grasp of truth in the act of thinking (no middle term needed).
          *   *The "I" Problem:* Does "I" refer to a substantial soul/self, or just the logical subject of the verb? (Lichtenberg's critique: "It thinks" vs. "I think").
      *   *The Goal:* To provide a framework for evaluating these interpretations based on the user's specific conflict.

  3.  **Drafting the Requirements (The "Demands"):**
      *   *Requirement 1: Immunity to Hyperbolic Doubt.* The *Cogito* survives the Evil Demon scenario. If an account allows the Demon to fake the *Cogito*, it fails.
      *   *Requirement 2: Non-Circularity.* It can't presuppose existence to prove existence. It can't rely on general principles (like "whatever thinks exists") that need prior proof.
      *   *Requirement 3: The Subject Reference.* This is the user's main fight. Does it prove a *substantial self* or just *activity*?
      *   *Requirement 4: Temporal Scope.* Does it prove I exist *now* or *always*? (Descartes says only while thinking).
      *   *Requirement 5: Epistemic Priority.* It must be the *first* truth. It can't depend on logic rules or language grammar that haven't been validated yet.

  4.  **Addressing the Specific Conflict (Thinker vs. Thinking):**
      *   *Camp A (Substantial Self):* Needs to show the "I" isn't just grammar.
      *   *Camp B (Process/Event):* Needs to show "I" is a placeholder for the event of thinking.
      *   *The Trade-off:* You usually can't have *both* a robust substantial self *and* absolute immunity to linguistic critique without importing outside assumptions.

  5.  **Categorizing Requirements (Universal vs. Camp-Specific):**
      *   *Universal:* Must survive doubt, must be non-circular, must be immediate (in some sense).
      *   *Camp-Specific:*
          *   *Inference Camp:* Needs a valid major premise ("All thinkers exist").
          *   *Intuition Camp:* Needs to explain how we grasp the connection without a premise.
          *   *Substantial Self Camp:* Needs to bridge the gap between activity and agent.
          *   *Grammatical "I" Camp:* Needs to explain why Descartes says "I" and not "It thinks."

  6.  **The Incompatibility/Trade-off Section:**
      *   This is crucial. The user wants to know what *can't* be satisfied at once.
      *   *Tension 1:* Certainty vs. Content. The more certain the *Cogito* is (bare existence), the less it tells us about *what* exists (a soul vs. a process).
      *   *Tension 2:* Logic vs. Performance. If it's a logical inference, it relies on rules of logic (which might be doubted). If it's a performance, it's hard to generalize.
      *   *Tension 3:* The "I". If you demand it proves a *persistent* self, you break the "only while thinking" constraint. If you demand it proves only a *momentary* subject, you fail to satisfy the intuition of a unified self.

  7.  **The Split-Brain Question:**
      *   Is this fair? Descartes didn't know about split-brain cases.
      *   *Verdict:* It's a "gotcha" in the historical sense, but a valid *philosophical* stress test for the definition of "I".
      *   *Nuance:* If the *Cogito* is about *conscious awareness*, split-brain complicates the unity of that awareness. It tests the "Substantial Self" requirement.

  8.  **Refining the Tone:**
      *   Needs to be sharp, direct, American English.
      *   No academic fluff.
      *   Focus on "what breaks if you fail this."

  9.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the stalemate.
      *   *Section 1: The Universal Non-Negotiables.* (Doubt, Circularity, Priority).
      *   *Section 2: The Battleground (The "I").* Directly address the user's fight.
