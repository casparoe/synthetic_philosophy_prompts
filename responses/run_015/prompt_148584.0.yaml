answer: |-
  # Workshop Session Plan: The Falsification Budget Simulation

  **Session Title:** The Cost of Protection: A Simulation of Research Programme Dynamics
  **Duration:** 75 Minutes
  **Participants:** 14 Graduate Students
  **Facilitator:** 1 (You)
  **Materials:** Whiteboard/Projector, Timer, 42 Index Cards (for Anomalies/Tokens), Score Sheet.

  ## I. Session Timeline

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00:00 – 00:10** | **Setup & Framing** | Assign roles, explain rules, distribute "Hard Core" claims. |
  | **00:10 – 00:25** | **Epoch 1** | Simulation Round 1 (Groups A & B in initial roles). |
  | **00:25 – 00:30** | **The Swap** | Role rotation and score reset. |
  | **00:30 – 00:45** | **Epoch 2** | Simulation Round 2 (Groups A & B in inverted roles). |
  | **00:45 – 01:15** | **Debrief** | Philosophical mapping, artificiality disclosure, troubleshooting review. |

  ---

  ## II. Simulation Design: "The Token Economy"

  ### 1. Participant Roles (14 Students)
  Divide the class into two parallel "Universes" (Group A and Group B, 7 students each) to allow for simultaneous play and easier rotation.

  *   **Research Programme Teams (2 Teams per Universe, 3 members each):**
      *   **Task:** Defend a "Hard Core" claim against anomalies.
      *   **Resource:** Start with **3 Falsification Budget Tokens**.
  *   **Anomaly Generators (2 per Universe):**
      *   **Task:** Draw "Anomaly Cards" (pre-written contradictions) and present them to the Programmes.
      *   **Goal:** Force Programmes to spend Tokens.
  *   **Funding Panel (2 per Universe):**
      *   **Task:** Adjudicate whether a Token expenditure is "Permissible" or "Ad Hoc."
      *   **Goal:** Maximize scientific progress (points) by funding viable programs and culling degenerating ones.

  *(Note: In Epoch 2, the Research Teams become the Panel/Anomalies, and vice versa.)*

  ### 2. The Rules of Interaction

  **A. The Hard Core**
  Each Research Team receives a sealed envelope containing a "Hard Core" axiom (e.g., *"Human behavior is always utility-maximizing"* or *"All physical phenomena reduce to particle interactions"*). This claim **cannot** be changed.

  **B. The Anomaly Phase (3-minute cycles)**
  1.  Anomaly Generators draw a card stating an empirical observation that contradicts the Hard Core + current Protective Belt (e.g., *"Subjects act altruistically at personal cost"*).
  2.  The Research Team has **2 minutes** to confer and propose an **Auxiliary Revision** (a modification to the protective belt, not the core) that explains the anomaly.
  3.  **The Cost:** To adopt this revision and keep the Hard Core, the Team **must spend 1 Token**.

  **C. The Panel Adjudication**
  1.  The Team presents their Revision to the Funding Panel.
  2.  The Panel must vote (Majority rules) to **Approve** or **Reject** the Token spend.
      *   **Approve:** The Team loses 1 Token. The Anomaly is neutralized.
      *   **Reject:** The Revision is deemed "Too Ad Hoc." The Team loses 1 Token *anyway* (administrative cost), but the Anomaly stands. If the Anomaly stands unresolved for two cycles, the Hard Core is considered **Falsified**.
  3.  **Token Replenishment:** The Panel holds a reserve of 2 extra Tokens per Universe. They may grant one to a Team, but doing so costs the Panel **5 Prestige Points**.

  **D. Termination**
  A Research Programme ends if:
  1.  They run out of Tokens (0 remaining).
  2.  They voluntarily abandon the Hard Core.
  3.  The Panel votes to defund them entirely (requires unanimous Panel vote).

  ### 3. Payoff Structure (Prestige Points - PP)
  *No real money is used. Points are tallied on the whiteboard.*

  *   **Research Teams:**
      *   +10 PP per cycle survived with Hard Core intact.
      *   +20 PP Bonus if they finish Epoch with Tokens remaining.
      *   -50 PP if Hard Core is Falsified (Abandoned).
  *   **Anomaly Generators:**
      *   +5 PP for every Token a Team is forced to spend.
      *   +10 PP if a Team runs out of Tokens.
  *   **Funding Panel:**
      *   Start with 50 PP.
      *   -5 PP for every Token granted from Reserve.
      *   +20 PP if they successfully identify a "Degenerating Programme" (defund a team that would have run out of tokens in the next round).
      *   -20 PP if they defund a team that was actually "Progressive" (had tokens left at end of Epoch).

  ---

  ## III. Structured Deliberation Protocol

  To prevent chaos, communication is restricted during the 3-minute cycles:
  1.  **Public Proposals:** Research Teams must write their Auxiliary Revision on the board. No whispering to the Panel.
  2.  **One-Sentence Justification:** Panelists must state their vote in one sentence (e.g., *"This revision predicts nothing new, it only patches the hole."*).
  3.  **Facilitator Timekeeping:** You will strictly enforce the 2-minute revision window. When time is called, the Token must be spent or the Anomaly stands.

  ---

  ## IV. Troubleshooting: Predicted Malfunctions & Corrections

  **1. Informal Collusion (The "Old Boys' Network")**
  *   **Risk:** Research Teams may try to bargain with Panelists during breaks or use non-verbal cues to secure Token replenishment without cost.
  *   **Correction:** Enforce the **"Glass Wall" Rule**. Panelists must sit with their backs to the Theorists. All communication regarding Tokens must be written on index cards and passed through the Facilitator. If collusion is suspected, deduct 10 PP from both parties publicly.

  **2. Personalizing Falsification**
  *   **Risk:** Graduate students may equate the "Falsification" of their Hard Core with personal intellectual failure, leading to defensiveness or refusal to abandon the core.
  *   **Correction:** In the Setup, explicitly state: *"You are not the theory. You are the custodians of the theory. Letting a theory die is a virtuous scientific act."* If a team refuses to surrender a core with 0 tokens, the Facilitator declares them "Dogmatic" and disqualifies them from the Bonus Points.

  **3. Panel Paralysis**
  *   **Risk:** Panelists may refuse to spend Reserve Tokens or defund anyone to avoid losing points, causing the simulation to stall.
  *   **Correction:** Introduce the **"Stagnation Penalty."** Announce at the 10-minute mark of each Epoch: *"If no Programmes have lost a Token by the next cycle, all Panelists lose 10 PP."* This forces the Panel to engage critically.

  **4. Time Creep**
  *   **Risk:** The Role Swap (Minute 25) takes too long, eating into the Debrief.
  *   **Correction:** Do not physically move chairs. Have students simply swap role *badges* (or name tents). Keep the seating arrangement fixed. Assign the role swap assignments on the whiteboard before the session starts so students know exactly what they are becoming in Epoch 2.

  ---

  ## V. Debrief & Philosophical Mapping (30 Minutes)

  *Facilitator Note: Do not ask students for citations. Focus on conceptual mapping.*

  ### 1. The Visceral Experience (5 Minutes)
  Ask the students to report on the *feeling* of the simulation.
  *   **To Theorists:** "How did it feel when you had 1 Token left? Did you start making revisions you knew were weak?"
  *   **To Panel:** "What criteria did you use to deny a Token? Was it truth, or was it 'cost'?"
  *   **To Anomalies:** "Did you try to find 'hard' contradictions, or just annoying ones?"

  ### 2. Mapping the Concepts (15 Minutes)

  **A. Popper’s Asymmetry**
  *   **Simulation Link:** The Hard Core could be supported by many cycles (verification), but one unresolved Anomaly with 0 Tokens led to Falsification.
  *   **Concept:** Highlight that verification is cumulative, but falsification is structural. In the game, surviving 5 rounds didn't "prove" the theory, but running out of Tokens killed it. This mirrors Popper’s view that we can never verify, only fail to falsify.

  **B. Lakatos’s Research Programmes**
  *   **Simulation Link:** The "Hard Core" (immutable) vs. the "Protective Belt" (Auxiliary Revisions).
  *   **Concept:** Explain that Lakatos argued scientists *should* protect the core using a "negative heuristic." The game mechanized this.
  *   **Progressive vs. Degenerating:**
      *   *Progressive:* A team that spent Tokens but also claimed "Novel Predictions" (if you added this rule, or ask them if they felt they were just patching).
      *   *Degenerating:* A team that spent Tokens only to accommodate past anomalies without predicting new ones.
      *   **Discussion:** Ask the Panel: "Did you fund the team that was actually predicting things, or the one that was just louder?"

  **C. The Problem of Ad Hoc Adjustments**
  *   **Simulation Link:** The Panel's power to reject a revision as "Too Ad Hoc."
  *   **Concept:** In philosophy, an adjustment is *ad hoc* if it saves the theory but adds no new testable content. In the game, this was subjective. This highlights the difficulty in distinguishing a "clever save" from a "degenerating patch."

  ### 3. The Artificial Device Disclosure (5 Minutes)
  *   **Crucial Intervention:** You must explicitly break the fourth wall here.
  *   **Statement:** "The **3-Token Budget** is a pedagogical fiction. In real science, there is no number. No journal editor tells you, 'This is your third auxiliary hypothesis, you are now falsified.'"
  *   **Discussion:** Ask: "If there is no number, what determines the cutoff in reality?"
  *   **Target Answer:** Sociological consensus, funding drying up, a rival programme offering better predictions, or the sheer weight of accumulated patches making the theory unwieldy. The "Token" was a proxy for **Scientific Credibility**.

  ### 4. Synthesis (5 Minutes)
  Conclude by connecting the "Falsification Budget" to the **Demarcation Problem**.
  *   The simulation shows that demarcation isn't a single moment (Popper's naive falsification) but a process of resource management (Lakatos).
  *   However, because the "Budget" is socially managed (by the Panel), demarcation is also inherently sociological.
  *   **Final Thought:** "Science is not just logic; it is the management of a budget of credibility. When the budget is gone, the programme is dead, even if the logic holds."

  ---

  ## VI. Facilitator’s Cheat Sheet (Key Philosophical Flags)

  | Simulation Feature | Philosophical Analogue | **Artificial/Pedagogical Device** |
  | :--- | :--- | :--- |
  | **3-Token Limit** | Lakatos's "Degenerating Problemshift" | **YES.** Real science has no hard number. This forces a decision within 75 mins. |
  | **Panel Veto** | Peer Review / Community Consensus | Partially. Real review is slower and less centralized. |
  | **Hard Core Envelope** | Negative Heuristic | No. This accurately reflects the dogmatic commitment to core axioms. |
  | **Anomaly Cards** | Empirical Counter-evidence | Partially. Real anomalies are often ambiguous, not written on cards. |
  | **Point System** | Scientific Prestige / Funding | Yes. Reduces complex reputation to integers. |

  **Final Instruction to Facilitator:**
  If the students get too bogged down in the "fairness" of the Panel's decisions during the debrief, steer them back to the *structure*. The unfairness they feel *is* the point. It mirrors the frustration of scientists whose work is rejected not because it is false, but because the community's "budget" for that paradigm is exhausted.
