  What the label is for

  The label is not a policy trigger for us; it is a factual claim about intent. We use the 1948 UN Convention definition, not Lemkin's broader sociological vision. Lemkin's view—destroying language, institutions, land—is morally coherent but journalistically unfalsifiable on deadline. The Convention is narrower but offers specific acts (killing, preventing births, transferring children) that can be evidenced. This choice prioritizes defensibility in a corrections column over moral completeness. We acknowledge the word's weight: it implies a duty to prevent, enrages allies, and validates survivors. We do not use it to *create* those duties, but because the evidence suggests the duty already exists. If the facts meet the threshold, diplomacy is irrelevant. If they do not, using the word dilutes its currency for future atrocities. We are not a court, but we are not bystanders. We describe reality. When we say "genocide," we assert that a group is being destroyed *as such*, not merely caught in crossfire. This distinction is the core of the procedure. We accept that this will sometimes feel too narrow (excluding cultural destruction without physical harm) or too technical (excluding mass killing without specific intent). Accuracy over comfort. The word triggers international legal duties; we cannot trigger those lightly. But we cannot withhold the description if the reality matches the crime. Our role is to bridge the gap between legal technicality and moral horror without collapsing into either. We must be precise enough to withstand legal scrutiny but clear enough to convey the magnitude of the crime. This procedure is that bridge.

  The procedure

  1. **Identify the Act.** Does the violence match one of the five Convention acts? (Killing members; causing serious bodily/mental harm; inflicting conditions of life calculated to destroy; preventing births; forcibly transferring children.) If no, **STOP: No Genocide.** (Consider "Ethnic Cleansing" or "Repression".) This excludes general war violence. "Conditions of life" includes starvation or deprivation of shelter, but must be deliberate, not merely negligent.
  2. **Identify the Group.** Is the target a national, ethnical, racial, or religious group? Political or social groups do not count under the Convention. If no, **STOP: No Genocide.** (Consider "Politicide" or "Mass Atrocity".) This prevents mission creep into partisan conflicts where the target is ideology, not identity.
  3. **Assess Substantiality.** Is the target a "substantial part" of the group? Courts vary, so we use a rule of thumb: Either a numerical majority of a localized population (e.g., a specific region or village cluster) OR a significant segment essential to the group's survival (leadership, religious clergy, child-bearing women). If the impact is negligible, random, or isolated to combatants, **STOP: No Genocide.** This handles the "in part" requirement without legal training. It ensures we are not labeling isolated massacres as existential threats.
  4. **Assess Intent (The Surrender Test).** Would the violence stop if the victims surrendered, converted, or stopped resisting? If yes, it is counter-insurgency or repression. **STOP: No Genocide.** If the violence continues regardless of behavior, it targets the group's existence. Proceed. This is your primary heuristic for *dolus specialis*. It distinguishes between punishing actions and punishing being.
  5. **Evidence Default.** State intent is rarely documented. If the pattern of violence falls exclusively on the protected group (exclusive impact), presume intent to destroy. If the violence is indiscriminate or hits loyalists of the same group equally, presume tactical motive. **STOP: No Genocide** if tactical motive dominates. This solves the secrecy problem. We cannot wait for smoking guns that regimes hide.
  6. **Select Label.** If Steps 1-5 are met: **Genocide.** If Step 1 is met but Step 5 fails (indiscriminate): **War Crimes.** If Step 1 is met but Step 2 fails (political group): **Crimes Against Humanity.** If death toll is high but intent unclear: **Mass Atrocity.** If cultural destruction only (no physical harm/birth prevention): **Ethnic Cleansing.** This menu ensures precision. Do not use "Genocide" as a catch-all for horror.
  7. **Attribution Rule.** If the procedure yields "Genocide," we assert it: "The government is committing genocide." If the procedure yields "Hand to Human" (see below) or evidence is contested but strong, we attribute: "Experts accuse the government of genocide." If the procedure yields "No," but advocates use the word, we write: "Activists call it genocide, though evidence suggests war crimes." This manages liability.
  **Hand-to-Human Point:** If Step 4 (Surrender Test) is ambiguous—e.g., surrender is impossible due to geography or policy—escalate to the Standards Editor. This is a values question disguised as fact. Do not decide alone. This protects the paper from making philosophical calls under the guise of factual analysis.

  Three cases

  **Case 1:** The acts (inflicting conditions of life via famine) match Step 1. The group (ethnic minority) matches Step 2. Substantiality (tens of thousands in a region) matches Step 3. However, Step 4 (Surrender Test) fails: men can leave, and the government claims counter-insurgency against a guerrilla movement recruiting there. The violence is linked to resistance, not existence. Step 5 (Evidence) shows leaked documents cite "demographic problem," but the ability to leave undermines intent to destroy *as such*. The pattern is not exclusive; combatants are targeted. The NGO report notes starvation is concentrated in rebel zones. **Verdict:** Crimes Against Humanity. The famine is weaponized, but the escape route suggests repression, not extermination. We attribute the genocide claim to activists. The budget document is ambiguous enough to allow the counter-insurgency defense. We cannot prove the famine was *calculated* to destroy the group rather than starve the rebels.

  **Case 2:** The acts (forcibly transferring children, preventing cultural survival) match Step 1 (Convention includes child transfer). The group matches Step 2. Substantiality (two generations, distinct people finished) matches Step 3. Step 4 (Surrender Test): Passing the test is impossible; assimilation is mandatory regardless of behavior. Intent is clear. Step 5: Pattern is exclusive to the highland people. No majority children are taken. The Wikipedia background confirms the language ban is unique to this group. **Verdict:** Genocide. This fits the legal definition despite no killing. The destruction of the group via children is explicit in the Convention. We assert the label. This will confuse readers expecting bodies. But the procedure demands it. The state's own statements admit the goal is assimilation, which meets the intent threshold for preventing the group's continuation.

  **Case 3:** The acts (killing) match Step 1. The group (ethnic majority in province) matches Step 2. Substantiality (60,000 dead) matches Step 3. Step 4 (Surrender Test): Fails. The bombing is to retake ground; loyalists of the same group were killed. The violence is tied to control of territory, not destruction of the group. Step 5 (Evidence): No document shows a plan about the group; rhetoric is ugly but not policy. Impact is not exclusive (loyalists died). The government's statements focus on sovereignty, not ethnicity. **Verdict:** War Crimes / Mass Atrocity. The death toll is higher than Case 1, but the intent is tactical, not existential. We do not use the g-word. This will anger readers. The indiscriminate nature of the bombing suggests negligence or recklessness, not specific intent to destroy the ethnic group. The procedure holds.

  Where it misfires

  This procedure will misfire emotionally. Case 3 is the primary failure point. Readers will see 60,000 dead civilians of one ethnicity and hear "War Crimes." They will feel we are minimizing slaughter because the legal bar for intent is too high. We are. The Convention requires specific intent (*dolus specialis*), which is rarely provable without internal memos. We will look timid. Conversely, Case 2 will feel pedantic. Calling a non-lethal assimilation program "genocide" confuses readers equating the word with mass graves. We will look precise but out of touch. The "Exclusive Impact" default in Step 5 risks false positives in propaganda wars where states hide behind secrecy. We may accuse a regime of genocide based on pattern alone, only for a later court to find negligence rather than intent. We accept this risk because waiting for court verdicts renders the word useless for prevention. The procedure prioritizes the reality of the victims over the diplomatic comfort of the perpetrators. The "Hand-to-Human" point acknowledges that some questions are not factual. When the Surrender Test breaks—when surrender is impossible—the distinction between repression and genocide collapses. That is where your judgment replaces the algorithm. Do not pretend the procedure solves that. It merely structures the uncertainty.

  The calls I made

  I chose the Legal Definition over Lemkin because you need to survive the corrections column. Lemkin's sociological destruction is real, but unprovable on deadline. I kept the Surrender Test as the primary proxy for intent because it is the only heuristic available to journalists without subpoena power. I chose to presume intent on exclusive impact because state secrecy should not grant immunity. The cost is that we will sometimes over-call genocide in closed societies and under-call it in complex wars (Case 3). You will regret Case 3. Your readers will hate it. But if you call Case 3 genocide, you cannot distinguish it from Case 2 later. Consistency is your only shield. Use the attribution rule to soften the blow where evidence is thin, but do not lie about the classification. The word is a tool, not a weapon. Wield it accurately, even when accuracy hurts. If you soften the call to please readers, you lose the authority to make the call at all. Stick to the procedure. It will fail you, but it will fail you consistently. That consistency is what keeps you out of the corrections column six months later.
