prompt: |-
  I run an upper-level undergraduate seminar in moral philosophy—about 14 students, one 75-minute session. The announced topic is moral particularism versus generalism, but I want the session to target a specific, somewhat neglected pressure point within that debate: reason holism, or the claim that the very same non-moral feature can operate as a reason with opposite moral valence across contexts without being governed by any further general principle.

  Design a structured in-class deliberation—preferably with assigned roles and forced choices rather than open discussion—so that participants discover this holism for themselves before it is named. The rules should be arranged so that students apply identical descriptive predicates to two structurally parallel cases and reach opposite moral verdicts, then face a mechanism that makes them feel the cost of either retaining both verdicts or collapsing them into a hidden generalization.

  Specify: the physical setup and materials; the roles or constraints (for example, some participants must defend verdicts using only descriptive, non-moral vocabulary, while others must propose the relevant difference that saves consistency); a phased timeline; and an incentive scheme that rewards coherence but penalizes ad hoc exceptions—using points, voting tokens, or staged public commitments rather than real money.

  Then provide a debrief that maps specific moments in the activity onto parts of the particularist/generalist debate: where students implicitly appealed to ceteris paribus conditions, where they invented unstated background conditions to save a rule, and where they simply refused to generalize. Include an honest account of what will go wrong the first time—especially the tendency to smuggle in covert general principles—and how to handle it without undermining the exercise.

  Finally, be explicit about which feature of particularist reason holism the activity cannot reproduce—whether the phenomenology of direct moral perception, the metaphysical claim about the non-codifiability of reasons, or the rejection of moral explanation altogether—and note that this gap must be filled by the facilitator's follow-up discussion.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level undergraduate moral philosophy seminar (14 students, 75 mins).
      *   **Topic:** Moral Particularism vs. Generalism.
      *   **Specific Focus:** Reason Holism (the same feature can be a reason for in one case and against in another without a governing principle).
      *   **Pedagogical Goal:** Structured deliberation where students *discover* holism before it's named.
      *   **Mechanism:** Apply identical descriptive predicates to parallel cases $\rightarrow$ opposite verdicts $\rightarrow$ face costs for inconsistency or hidden generalization.
      *   **Requirements:**
          *   Physical setup & materials.
          *   Roles/Constraints (e.g., descriptive vocab only vs. finding differences).
          *   Phased timeline.
          *   Incentive scheme (points/tokens, not money).
          *   Debrief mapping activity to debate (ceteris paribus, covert principles, refusal to generalize).
          *   Honest account of failure modes (smuggling principles).
          *   Explicit limitation of the activity (what it *can't* teach).

  2.  **Deconstruct the Philosophical Problem:**
      *   *Generalism:* Moral reasons function like laws. If $F$ is a reason for $\phi$ in case $C_1$, it must be a reason for $\phi$ in case $C_2$, unless there is a relevant difference $D$ governed by a higher principle.
      *   *Particularism (Holism):* $F$ can be a reason for $\phi$ in $C_1$ and a reason against $\phi$ in $C_2$ simply due to the context, without a codifiable rule explaining the switch.
      *   *The Trap:* Students naturally want to save generalism by finding *some* difference. The activity must make finding a *relevant, principled* difference difficult or costly.

  3.  **Design the Activity ("The Valence Shift Game"):**
      *   *Core Mechanic:* Present pairs of scenarios that are descriptively identical regarding a specific feature (e.g., "promising," "lying," "causing pain"), but intuitively demand opposite verdicts.
      *   *Roles:*
          *   *Judges:* Decide the verdict (Right/Wrong).
          *   *Scribes:* Record the descriptive features.
          *   *Architects:* Try to build a rule (Generalists).
          *   *Saboteurs:* Try to break the rule by highlighting context (Particularists).
      *   *Incentive:* Points for consistency *unless* consistency requires absurdity. Actually, better: Points for "Coherence" (Verdict + Principle match) but penalties for "Ad Hocery" (changing the principle mid-stream).
      *   *Refinement:* Let's make it more direct. Two teams. Team A must defend the verdicts using a consistent principle. Team B must provide the cases. Wait, the prompt asks for *participants* to discover it. Let's make the whole class play a game where they lose points if they contradict themselves *unless* they can cite a pre-approved rule.
      *   *Better Idea:* "The Codification Challenge."
          *   Phase 1: Intuitive verdicts on cases.
          *   Phase 2: Draft a rule based on Case 1.
          *   Phase 3: Apply rule to Case 2 (which is designed to break the rule).
          *   Phase 4: Amend the rule (costs points) or accept the contradiction (costs points).

  4.  **Developing the Scenarios (Crucial Step):**
      *   Need cases where Feature $F$ flips valence.
      *   *Classic Example:* Pleasure. Usually good. But pleasure in someone's suffering (schadenfreude) is bad.
      *   *Classic Example:* Lying. Usually bad. But lying to a murderer at the door is good.
      *   *Constraint:* The prompt asks for "identical descriptive predicates."
      *   *Selection:* Let's use "Causing Physical Pain."
          *   Case 1: Torturer causes pain. (Wrong)
          *   Case 2: Surgeon causes pain. (Permissible/Good)
          *   Case 3: Sadist causes pain during consensual roleplay. (Permissible?)
          *   *Problem:* Students will say "Intent" or "Consent" is the difference.
          *   *Fix:* We need to isolate the *reason*. The prompt is about *Reason Holism*. The feature itself changes valence.
          *   *Revised Selection:* "Breaking a Promise."
          *   Case 1: Break promise to meet friend for lunch to help a stranger in need. (Permissible/Good)
          *   Case 2: Break promise to meet friend for lunch to watch TV. (Wrong)
          *   *Feature:* "Breaking a promise."
          *   *Valence:* In C1, it's a reason *for* the action (or at least not against). In C2, it's a reason *against*.
          *   *Wait, Holism says:* The feature "breaking a promise" counts *in favor* in C1? No, usually particularists say it counts against in both, but is outweighed. True holism says it can count *in favor*.
          *   *Better Holism Example:* "Being amusing." Usually a reason to invite someone. But if the person is a comedian at a funeral, it's a reason not to invite them.
          *   *Let's go with Dancy's example style:* "That it would amuse him."
          *   Case A: Telling a joke to cheer up a depressed friend. (Reason For)
          *   Case B: Telling a joke to mock a vulnerable enemy. (Reason Against)
          *   *Descriptive Predicate:* "It will amuse the agent."

  5.  **Structuring the Deliberation:**
      *   *Setup:* 14 students. 2 groups of 7.
      *   *Materials:* Case cards, Verdict tokens, Rule sheets.
      *   *Roles:*
          *   *Legislators (4 students):* Must formulate the moral rule based on features.
          *   *Judges (10 students):* Vote on verdicts.
          *   *Actually, let's simplify:* Everyone judges, but specific roles constrain *argumentation*.
          *   *Role A (Descriptivists):* Can only list non-moral facts.
          *   *Role B (Principle-Keepers):* Must maintain one rule.
          *   *Role C (Contextualists):* Can point out context but cannot add new rules.
      *   *Incentive:* "Coherence Tokens." Start with 5. Lose 1 for contradiction. Lose 1 for adding an exception clause to a rule. Gain 1 for surviving a round without changing the rule.

  6.  **Drafting the Timeline (75 mins):**
      *   0-10: Setup & Rules.
      *   10-25: Round 1 (The Trap). Case A. Establish Rule.
      *   25-40: Round 2 (The Shift). Case B. Feature identical, verdict opposite.
      *   40-55: Round 3 (The Squeeze). Force the choice: Change rule (cost) or accept holism.
      *   55-75: Debrief & Lecture.

  7.  **Addressing the "What Will Go Wrong":**
      *   Students *will* try to find a descriptive difference (e.g., "intent," "consent").
      *   *Counter-measure:* The Facilitator acts as the "Feature Stipulator." If the feature is "causing pain," the Facilitator rules that intent is irrelevant to the *feature description*, only the context. Or, design cases where the descriptive difference is negligible.
      *   *Better:* Use the "Black Box" method. The cases are presented as having Feature $F$. Students are told $F$ is identical. They must judge the action.

  8.  **Addressing the Limitation:**
      *   Activity shows *that* valence shifts.
      *   Activity *cannot* show *why* (metaphysics) or the *phenomenology* (seeing the reason directly). It creates a logical puzzle, not a moral experience.

  9.  **Refining the Incentive Scheme:**
      *   Use "Integrity Points."
      *   Goal: Maximize points.
      *   Penalty: "Ad Hoc Tax." Every time you add a "unless..." clause to your rule, you pay a tax.
      *   Penalty: "Contradiction Fine." If you hold the same rule but vote differently, you pay a fine.
      *   This forces them to feel the pain of Generalism (too many exceptions) vs. Particularism (loss of rule).

  10. **Final Review against Constraints:**
      *   14 students? Yes, groups work.
      *   75 mins? Yes, timeline fits.
      *   Roles/Constraints? Yes (Legislators vs. Judges).
      *   Incentive? Yes (Integrity Points).
      *   Debrief mapping? Yes.
      *   Failure modes? Yes.
      *   Limitations? Yes.

  11. **Writing the Plan:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Feature" is very specific so they can't wiggle out. Let's use "That it causes embarrassment."
      *   Case 1: Roasting a friend (bonding). Feature: Causes embarrassment. Verdict: OK.
      *   Case 2: Bullying a rival. Feature: Causes embarrassment. Verdict: Wrong.
      *   *Wait, is embarrassment a reason FOR roasting?* Yes, in a roast, the point *is* to embarrass affectionately. In bullying, the embarrassment is the harm.
      *   *Actually, Dancy's "Amusement" example is cleaner.*
      *   Let's stick to a constructed "Feature Card" system to ensure strict control over descriptions.

      *(Self-Correction on Roles)*: 14 students is small enough for one big group, but splitting into two competing "Courts" might create better engagement. Let's do two Courts of 7. They compete for Coherence Score.

      *(Self-Correction on Incentive)*: Points can feel gamified in a cheap way. Let's call it "Philosophical Capital."

      *(Final Polish on Debrief)*: Ensure the link to Dancy and McNaughton is clear.

  12. **Final Polish:** Check tone. Needs to be academic but practical. Ensure the "Honest Account" section is gritty and realistic.

  *(Self-Correction on the "Feature" constraint)*: The prompt asks for "identical descriptive predicates." I need to make sure the students *agree* the predicates are identical. I will provide pre-written case cards where the target feature is highlighted in bold, and the Facilitator rules on whether a distinction counts as a "new feature" or just "context."

  Okay, ready to write.cw
answer: |-
  # Seminar Plan: The Valence Shift Protocol
  **Topic:** Reason Holism (The Particularist/Generalist Debate)
  **Time:** 75 Minutes
  **Class Size:** 14 Students
  **Goal:** Students experience the friction of maintaining a general principle when the moral valence of a descriptive feature flips across contexts.

  ## I. Physical Setup and Materials

  **Room Arrangement:**
  *   Two semi-circles facing each other (Team A and Team B, 7 students each).
  *   Central "Adjudicator Table" for the Instructor.
  *   Whiteboard divided into three columns: *Feature*, *Principle*, *Score*.

  **Materials:**
  *   **Case Cards (20 total):** 10 pairs. Each pair shares an identical **Target Feature** (bolded text) but implies opposite moral verdicts.
  *   **Verdict Tokens:** 10 Green (Permissible/Good), 10 Red (Impermissible/Bad) per team.
  *   **Principle Slates:** Small whiteboards for each team to write their governing rule.
  *   **Philosophical Capital (PC):** Each team starts with 20 PC (tracked on the main board).
  *   **Exception Stickers:** Physical red dots. Placing one on a Principle Slate costs 5 PC.

  ## II. Roles and Constraints

  To prevent open-ended drifting, students are assigned fixed roles for the duration of the game.

  **Team Composition (7 students per team):**
  1.  **The Legislators (2 students):** The *only* people allowed to write/edit the Team Principle on the slate.
  2.  **The Judges (3 students):** The *only* people allowed to cast Verdict Tokens (Green/Red).
  3.  **The Auditors (2 students):** The *only* people allowed to challenge the opposing team's consistency or propose "Exception Stickers."

  **Constraints:**
  *   **The Descriptive Lock:** The Instructor acts as the "Feature Stipulator." If a Case Card says the Target Feature is present, it is present. Auditors cannot argue the feature is absent; they can only argue the *context* changes the valence.
  *   **The Vocabulary Ban:** Legislators cannot use moral terms (e.g., "right," "good," "duty") in the Principle. They must use descriptive terms only (e.g., "causes pain," "breaks promise").
  *   **The Consistency Rule:** A Team's Verdict must logically follow from their Principle. If the Principle says "Feature F makes action X wrong," and the Judges vote "Green" on a case with Feature F, the team loses 10 PC immediately.

  ## III. Incentive Scheme: Philosophical Capital (PC)

  *   **Start:** 20 PC per team.
  *   **Winning Condition:** The team with the most PC at the end of Round 3.
  *   **Earning PC:** +5 PC for every round completed without a Consistency Rule violation.
  *   **Spending PC:**
      *   **Exception Tax:** If the Legislators want to save their Principle from a counter-example, they must add an "Unless..." clause. This requires placing an **Exception Sticker** on the slate. Cost: **5 PC per sticker**.
      *   **Contradiction Fine:** If Judges vote against their own Principle. Cost: **10 PC**.
      *   **Surrender:** If a team admits their Principle cannot cover the case and discards it to write a new one. Cost: **15 PC**.

  *Why this works:* It makes Generalism expensive. To maintain a general rule, you must pay for exceptions (stickers). To avoid paying, you must accept contradictions (fines) or surrender the rule (high cost). Particularism emerges as the strategy of refusing to write the Principle in the first place, but the game forces them to try Generalism first.

  ## IV. Phased Timeline (75 Minutes)

  ### Phase 1: The Codification Trap (0–20 mins)
  *   **0–5 mins:** Explain rules. Distribute PC.
  *   **5–15 mins:** **Round 1 (The Baseline).**
      *   Instructor reveals **Case 1A** (Team A) and **Case 1B** (Team B).
      *   *Content:* Both cases involve **"Breaking a Promise."**
      *   *Context:* Both are trivial promises (meeting for coffee) broken to avoid minor inconvenience (rain).
      *   *Task:* Judges vote (Expected: Red/Impermissible). Legislators write a Principle (Expected: "Breaking a promise is impermissible").
      *   *Audit:* Auditors check consistency. If consistent, +5 PC.
  *   **15–20 mins:** Teams lock their Principles on the slates. No changes allowed without paying the Exception Tax.

  ### Phase 2: The Valence Shift (20–45 mins)
  *   **20–30 mins:** **Round 2 (The Flip).**
      *   Instructor reveals **Case 2A** and **Case 2B**.
      *   *Content:* Both cases involve **"Breaking a Promise."** (Identical descriptive predicate).
      *   *Context:*
          *   Case 2: Breaking a promise to meet a friend for coffee because keeping it would prevent you from saving a stranger from serious harm.
      *   *Task:* Judges vote (Expected: Green/Permissible).
      *   *Crisis:* The Principle ("Breaking a promise is impermissible") contradicts the Verdict (Green).
      *   *Choice:*
          1.  Pay 5 PC to add an Exception Sticker ("...unless it prevents harm").
          2.  Pay 10 PC for Contradiction.
          3.  Pay 15 PC to Surrender/rewrite Principle.
      *   *Most teams will pay the 5 PC.*
  *   **30–40 mins:** **Round 3 (The Holism Hammer).**
      *   Instructor reveals **Case 3A** and **Case 3B**.
      *   *Content:* Both cases involve **"Breaking a Promise."**
      *   *Context:* Breaking a promise to a malicious actor (e.g., a spy promising to meet a handler, but breaking it to protect state secrets).
      *   *Twist:* In this context, "Breaking a Promise" is not just *permissible*, it is **morally required** (The feature counts *in favor* of the action, not just as a neutralized negative).
      *   *Crisis:* The Principle now reads: "Breaking a promise is impermissible *unless* it prevents harm." But here, breaking the promise is *good*.
      *   *Constraint:* Auditors from the opposing team can now challenge: "Does your principle explain why this feature is now a *positive* reason, or just a neutralized negative?"
      *   *Cost:* To explain the positive valence, teams usually need a second Exception Sticker or a total rewrite.
      *   *Result:* PC scores plummet. Teams realize the "Unless" clauses are becoming more complex than the cases themselves.

  ### Phase 3: The Forced Choice (45–55 mins)
  *   **Scenario:** The Instructor offers a "Settlement."
  *   **Option X (Generalist):** Keep the Principle. Add as many Exception Stickers as needed to cover all 3 cases. (Likely cost: 10+ PC).
  *   **Option Y (Particularist):** Remove the Principle entirely. Judges vote on each case intuitively without a governing rule.
      *   *Rule:* If Option Y is chosen, the team is immune to Contradiction Fines but earns **0 PC** for consistency bonuses.
  *   **Deliberation:** Teams must vote internally on which option to take.
  *   **Action:** Teams reveal choice. Final PC tally.

  ### Phase 4: Debrief and Mapping (55–75 mins)
  *   (See Section V below).

  ## V. Debrief: Mapping the Activity to the Debate

  Do not simply explain the theory. Use the whiteboard to map their game moves to philosophical concepts.

  **1. The "Exception Tax" = *Ceteris Paribus* Clauses**
  *   *Ask:* "Why did it feel expensive to add the second sticker?"
  *   *Map:* Generalists (e.g., McNaughton) argue moral principles hold *ceteris paribus* (all else being equal). You paid a 'tax' every time 'all else' wasn't equal.
  *   *Point:* Particularists argue that if you need enough *ceteris paribus* clauses, the principle becomes vacuous. It says nothing until you specify the context.

  **2. The "Descriptive Lock" = Reason Holism**
  *   *Ask:* "In Round 3, did 'Breaking a Promise' feel like a negative reason that was outweighed, or a positive reason?"
  *   *Map:* Generalism usually treats features as having invariant valence (pain is always bad, just sometimes necessary). Holism (Dancy) claims the feature *itself* changes polarity. In Round 3, breaking the promise was a *virtue*.
  *   *Point:* This is the core of Reason Holism: The contribution a feature makes to the moral status of an act depends on the context.

  **3. The "Surrender" = The Rejection of Codifiability**
  *   *Ask:* "For those who chose Option Y (No Principle), did you feel like you were guessing?"
  *   *Map:* Particularism is not 'anything goes.' It is the claim that moral competence is a skill (phronesis), not a code. You didn't guess; you used moral perception.
  *   *Point:* The activity showed that codification (The Principle Slate) was the burden, not the lack of it.

  ## VI. Honest Account of Failure Modes

  **1. The "Smuggling" Maneuver**
  *   *What happens:* Legislators will try to define the Feature so narrowly that it never flips. E.g., instead of "Breaking a Promise," they write "Breaking a Promise *unjustly*."
  *   *Why it breaks the game:* This makes the principle tautological ("Unjust breaking is wrong"). It saves Generalism by hiding the moral term inside the descriptive feature.
  *   *Facilitator Fix:* Enforce the **Vocabulary Ban** ruthlessly. If a principle contains a moral term ("unjustly," "needlessly"), the Instructor vetoes it immediately and deducts 5 PC. The feature must be non-moral (e.g., "breaking a promise," "causing pain").

  **2. The "Outweighing" Defense**
  *   *What happens:* Students argue the feature didn't change valence; it was just outweighed by a stronger feature (saving a life).
  *   *Why it breaks the game:* This defends Generalism (Atomism) against Holism.
  *   *Facilitator Fix:* Use Round 3 carefully. Ensure the case is framed so that breaking the promise is *part of the good*, not just a cost. (e.g., "The act of breaking the trust *is* the protection"). If they persist, acknowledge this is the Generalist counter-argument (Atomism) but note they still had to pay the Exception Tax to specify *when* it is outweighed. The cost remains.

  **3. The "Gamification" Distraction**
  *   *What happens:* Students focus on optimizing points rather than the moral intuition.
  *   *Facilitator Fix:* Pause the game if laughter becomes cynical. Remind them: "The points represent the theoretical cost of your position. If your moral theory is expensive to maintain, that's the point."

  ## VII. Limitations of the Activity

  Be explicit with students that this simulation has a blind spot.

  **The Missing Feature: Moral Perception and Metaphysics**
  *   **What the activity does:** It demonstrates the *logical friction* of codification. It shows that maintaining invariant principles is computationally expensive and prone to ad hoc exceptions.
  *   **What the activity cannot do:**
      1.  **Phenomenology:** It cannot reproduce the *experience* of seeing a reason. In the game, you voted based on intuition. Particularism claims we *perceive* reasons directly in the situation, not via a rule. The game forces you to abstract away from the situation to write rules, which is the opposite of the particularist phenomenological claim.
      2.  **Metaphysical Non-Codifiability:** The game treats principles as "expensive." Particularism claims they are *impossible* (or at least, that morality doesn't depend on them). The game makes it look like a pragmatic choice (save points vs. save rules) rather than a metaphysical truth about the nature of reasons.
      3.  **Explanation:** Generalists argue we need principles to *explain* why we judge as we do. The activity allows you to drop the principle (Option Y), but it doesn't show you how to explain your verdict to a confused outsider without one.

  **Facilitator's Closing Move:**
  "Today you felt the *cost* of Generalism. Next session, we read Dancy to understand why he thinks the cost is actually infinite. The game made you pay points; Dancy argues the Generalist pays with the loss of the moral phenomenon itself."
