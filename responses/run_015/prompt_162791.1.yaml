answer: |-
  I hear you on the frustration, and since you want a number without the usual hedging, I will give you my credence straight away. Based on the parameters you set, specifically removing Hitler as a baby and assuming no substitute charismatic leader emerges while keeping all structural conditions identical, I would put the probability of landing on outcome C or D at 0.40. That is slightly lower than your estimate of 0.45 and significantly lower than your mate's 0.9, and the reason for that specific number comes down to how much weight I give to individual agency versus structural inevitability when it comes to the specific mechanics of the Holocaust and the Eastern War.

  To decompose this, we have to look at the chain of events you outlined. The first link is the collapse of Weimar democracy itself. On this point, you and your mate are right to agree that this was baked in. The structural weaknesses of the Weimar Republic, combined with the Great Depression and the willingness of the conservative elites around Hindenburg to use Article 48, means there was a very high probability, perhaps 0.9, that Germany would have slid into some form of authoritarian dictatorship regardless of Hitler. The democracy was already functioning as a semi-authoritarian state by 1930, so outcome A is essentially off the table. The real variance begins with what kind of authoritarianism emerges. Without Hitler, the Nazi Party loses its primary agitator and its unique ability to bridge the gap between respectable conservatism and street violence. While the party structure existed, figures like Göring, Strasser, or Goebbels lacked Hitler's specific hold on the masses and his utility to the elites as a tool they thought they could control. I would estimate there was only a 0.5 probability that the NSDAP specifically would become the sole ruling party rather than being junior partners in a broader nationalist coalition led by the DNVP or the military. This is the first major drop in probability from your mate's high estimate.

  The second and most critical drop-off concerns the transition from persecution to genocide and the specific nature of the war. Antisemitism was undoubtedly endemic in Germany and across Europe, so outcome B, which involves severe discrimination and forced emigration, is highly likely even without Hitler. However, outcome C and D require a shift from traditional prejudice to industrialized extermination and a war of annihilation in the East. This is where the intentionalist argument holds the most water. The specific ideology of Lebensraum and the racial war against Judeo-Bolshevism were Hitler's personal fixations that he imposed on the state machinery. Without his relentless driving will, the conservative elites who wanted to restore Germany's borders would not necessarily have sought the total conquest of the Soviet Union, nor would the bureaucracy have likely radicalized to the point of the Final Solution. The machinery of the Holocaust required constant pressure from the top to overcome logistical and moral hurdles within the administration itself. Therefore, I assign a probability of only about 0.3 that a Hitlerless right-wing regime would have initiated a war of conquest against the USSR on the historical scale and followed it through to systematic mass killing. When you chain these probabilities together, the likelihood of the specific horrors of C or D diminishes significantly compared to the likelihood of a generic dictatorship.

  The number I gave you is most sensitive to that last sub-question about the genocide and the Eastern War. If you believe that the German bureaucracy and society were so radicalized by 1933 that they were waiting for permission to commit genocide regardless of who was in charge, then my number moves toward your mate's 0.9. This is the functionalist argument, which suggests the structure creates the radicalism. However, if you believe that the radicalization was driven from the top down by Hitler's specific ideological commands that forced the bureaucracy to comply, then the number stays low. To get from my 0.40 to your mate's 0.9, you would need to find evidence that the lower and middle levels of the Nazi party and the German state were already committed to physical extermination before Hitler gave the orders, or that the economic necessities of the German state in the 1930s made a war with the Soviet Union unavoidable regardless of ideology. There is some evidence for cumulative radicalization, but not enough to suggest the Holocaust was inevitable without the Führer principle driving it.

  This is exactly where I think the disagreement between you and your mate lives. You are leaning toward an intentionalist view where Hitler's unique psychology and decisions were the necessary catalyst for the specific outcomes of C and D, while your mate is arguing from a structuralist perspective where the conditions of Versailles, the Depression, and German nationalism made the outcome inevitable regardless of the figurehead. Your mate is likely conflating the inevitability of authoritarianism with the inevitability of the Holocaust. They are correct that a dictatorship was almost certain, but they are likely overestimating the probability that any right-wing dictatorship would have pursued the specific apocalyptic goals of the Nazis. You are correctly identifying that Hitler was the variable that turned a standard authoritarian regime into a genocidal one, but you might be slightly underestimating how much the broader party structure was already committed to violence. The truth is probably that the dictatorship was structural, but the genocide was intentional.

  So if I were writing this up, I would focus on that distinction. The probability of a dictatorship is high, but the probability of the Third Reich as we know it is contingent on Hitler. My 0.40 reflects the high chance of a dark authoritarian future for Germany without Hitler, but reserves significant doubt on whether that future includes the specific industrial killing and Eastern war that define outcomes C and D. Your mate's 0.9 assumes that the river of history was flowing so hard in one direction that no single person could dam it, whereas my number assumes that while the river was flowing, Hitler was the one who dug the channel that led to the waterfall. To change my mind, I would need to see proof that the German military or civil service had independent plans for extermination that predated Hitler's influence, which historically they did not. Until then, the specific horror of the Holocaust remains tied to the man who willed it into existence.
