answer: |-
  Here is a complete 75-minute session plan designed to make the contradiction personal, address the "rigging" skepticism, and use your two wrinkles to corner the "risk aversion" objection.

  ### **Session Overview**
  *   **Goal:** Students will personally commit to a set of choices that are mathematically inconsistent, feel the tension of that inconsistency, and understand *why* it violates decision theory without needing heavy math.
  *   **Core Mechanic:** Numbered index cards that students keep. They answer three questions. At the end, they compare their own answers to find the contradiction.
  *   **Stakes:** One question is selected at random for real payoff (chocolate). One big prize is raffled at the end to keep engagement high regardless of betting outcomes.

  ---

  ### **1. Materials & Prep**
  *   **Index Cards:** 24 cards, numbered 1–24 in the top right corner. (Hand Card #1 to Student 1, etc. This allows anonymous tracking if you need to collect them, but primarily lets *them* track their own consistency).
  *   **Urns:** 3 opaque containers (boxes/bags). Label them **K** (Known), **M** (Mystery), **C** (Coin).
  *   **Tokens:** 100 red and 100 black poker chips or slips of paper.
  *   **The "Honesty" Kit:** Two 10-sided dice (or a random number generator on the projector), a large envelope, a marker.
  *   **Payoffs:** A bag of good chocolate bars (cut into pieces if needed) and the One Nice Prize.
  *   **Projector:** For displaying the questions and a timer.

  ---

  ### **2. The "Honesty" Setup (0:00–0:15)**
  *The goal here is to kill the "you rigged the urn" objection before it starts, using Wrinkle 1.*

  1.  **Urn K (Known):** Publicly count 50 Red and 50 Black tokens into Urn K. Seal it. Everyone knows the odds are exactly 50/50.
  2.  **Urn M (Mystery):** This is the critical move. Do not pre-fill this.
      *   Tell the class: *"I don't know what's in here, and neither do you. But I'm not allowed to rig it."*
      *   Invite a student volunteer to roll two 10-sided dice on the projector to generate a number between 0 and 100 (e.g., 3 and 7 = 37).
      *   That number is the percentage of **Red** tokens in Urn M. (e.g., 37 Red, 63 Black).
      *   **You** (the TA) turn your back. The volunteer counts the tokens into Urn M based on the roll.
      *   The volunteer writes the number on a slip of paper, seals it in the **Large Envelope**, and tapes it shut.
      *   **Crucial:** Tell them: *"This envelope will not be opened until the end of class. Even I don't know the mix. It is fixed, but unknown."*
      *   *Why this works:* It proves the distribution wasn't chosen by you to trick them (it was random), but it is now *fixed* (ambiguity), distinguishing it from a fresh coin flip every time (risk).

  ---

  ### **3. The Choices (0:15–0:45)**
  *Distribute the numbered index cards. Tell students: "Keep this card. Do not write your name. Your number is your identity."*

  **Question 1 (0:15–0:25): The Red Bet**
  *   **Project:** "Imagine you win $10 (or a chocolate bar) if you draw a **RED** token."
  *   **Choice:** "Do you want to draw from **Urn K** (Known) or **Urn M** (Mystery)?"
  *   **Action:** Students circle **K** or **M** on their card.
  *   **Collect:** Have them hold the card up. Tally the hands quickly on the board (e.g., "18 chose K, 6 chose M"). *Don't analyze yet.*

  **Question 2 (0:25–0:35): The Black Bet**
  *   **Project:** "Imagine you win if you draw a **BLACK** token."
  *   **Choice:** "Do you want to draw from **Urn K** (Known) or **Urn M** (Mystery)?"
  *   **Action:** Students circle **K** or **M** on their card.
  *   **Collect:** Tally hands again.
  *   **The Trap:** Most will choose **K** for Red *and* **K** for Black.
  *   **Pause:** Ask: *"If you chose K for both, raise your hand."* (Most will). *"Keep your hand up if you think that's logically consistent."* (Hands stay up).

  **Question 3 (0:35–0:45): The Coin Hedge (Wrinkle 2)**
  *   **Project:** "We are introducing a fair coin. Heads or Tails (50/50)."
  *   **Option A (Known):** Draw from **Urn K**. If Red, you win. (50% chance).
  *   **Option B (Hedge):** Flip the coin.
      *   If **Heads**: Draw from **Urn M**. Win if **Red**.
      *   If **Tails**: Draw from **Urn M**. Win if **Black**.
  *   **Choice:** "Circle **A** or **B**."
  *   **Action:** Students circle.
  *   **Note:** Mathematically, Option B is exactly 50% win probability regardless of Urn M's mix ($0.5 \times P(Red) + 0.5 \times P(Black) = 0.5$). It is identical to Option A.

  ---

  ### **4. The Reveal & Personal Audit (0:45–0:55)**
  *This is where they catch themselves.*

  1.  **Instruction:** "Look at your own card. Compare Q1, Q2, and Q3."
  2.  **The Logic (Walk them through it silently first):**
      *   If you picked **K** in Q1, you think Urn K is better for Red.
      *   If you picked **K** in Q2, you think Urn K is better for Black.
      *   If you think K is better for Red *and* better for Black, you should definitely pick **K** in Q3.
      *   However, many people feel Option B (The Hedge) is "safer" because the coin flip averages out the mystery.
  3.  **The Ask:** "If you chose **K** for Q1, **K** for Q2, but **B** for Q3: Please raise your hand."
  4.  **The Moment:** Usually, a significant portion of the class will raise their hands. They just admitted to a contradiction.
  5.  **The Feeling:** Ask one of them: *"You didn't feel like you were being inconsistent until you saw the three questions together, did you?"* (This addresses your friend's critique: they need to feel the oddity personally).

  ---

  ### **5. Payoff & The "Real" Test (0:55–1:05)**
  *To make it sting (nicely), we actually play one bet.*

  1.  **Incentive:** "I am not going to grade you on this. But I am going to pay you."
  2.  **Selection:** Roll a die to select Question 1, 2, or 3.
      *   **If Q1 or Q2 is selected:** Draw a token from the Urns. Everyone who chose the winning Urn/Color gets a piece of chocolate.
      *   **If Q3 is selected:** This is the fun one.
          *   Flip the coin publicly.
          *   If Heads, draw from Urn M for Red. If Tails, draw from Urn M for Black.
          *   Winners get chocolate.
  3.  **The Big Prize:** "Regardless of your choices, I will raffle the [Nice Book Token/Bottle] among all 24 cards." (This keeps the mood light and ensures no one feels punished for being 'irrational').

  ---

  ### **6. The Debrief (1:05–1:15)**
  *Now you map the moments to the theory. Do not use jargon until now.*

  1.  **The "Risk" Objection:**
      *   *Student:* "I just don't like the Mystery Urn because it's risky."
      *   *You:* "But look at Q3. The Coin Hedge removes the risk. Mathematically, the Coin Hedge *is* a 50/50 known probability. If you preferred the Hedge over the Known Urn in Q3, you can't say it was just 'risk aversion.' You preferred a *mystery* that was mathematically identical to the *known*."
      *   *Concept:* **Ambiguity Aversion** (disliking unknown probabilities) vs. **Risk Aversion** (disliking known variance). Urn M was ambiguous, not just risky.

  2.  **The Contradiction:**
      *   *You:* "Why is choosing K, K, and B a problem?"
      *   *Explanation:* "If you prefer K for Red, you must believe Urn M has *less than* 50% Red. If you prefer K for Black, you must believe Urn M has *less than* 50% Black. But Red and Black add up to 100%. They can't both be less than 50%."
      *   *Concept:* **The Sure Thing Principle.** (If you prefer A over B when event X happens, and A over B when event Not-X happens, you should prefer A over B regardless of X).

  3.  **The Coin Flip Logic (Wrinkle 2):**
      *   *You:* "The Coin Hedge works because of **Reduction of Compound Lotteries**. A 50% chance of a 30% chance is the same as a 15% chance. Your intuition in Q3 treated the 'Mystery' as magically safer when combined with the coin, but your intuition in Q1 and Q2 treated it as dangerous. You can't have it both ways."

  4.  **Honesty Note:**
      *   Open the Large Envelope. Reveal the number. Show that it was fixed all along. This reinforces that the "Ambiguity" was epistemic (in their heads), not ontological (in the world).

  ---

  ### **7. Troubleshooting & Limitations**

  **What will go wrong:**
  *   **Confusion on Q3:** Non-mathy students often struggle with the "Heads/Red, Tails/Black" conditional.
      *   *Fix:* Use the projector to show a decision tree. Keep it visual. "Coin lands Heads -> We look for Red. Coin lands Tails -> We look for Black."
  *   **Time Creep:** The Urn Setup (0:00–0:15) often runs long.
      *   *Fix:* Pre-count the 100 tokens into two piles (Red/Black) before class. During class, just have the student count the specific number into the urn.
  *   **"I'm just irrational, so what?":**
      *   *Fix:* Acknowledge this. "Decision theory isn't about how you *do* think, it's about how you *want* to think. If you saw the contradiction on your card, did you want to change an answer? If yes, the theory helped you."

  **What this session cannot show:**
  *   **Which Model is Right:** This shows Standard Expected Utility Theory fails here. It does *not* prove that Maxmin Expected Utility or Rank-Dependent Utility is the correct replacement. It just establishes that *something* has to give.
  *   **Irrationality:** It establishes inconsistency, not stupidity. You can be consistently ambiguity-averse if you change your formal model, but you can't hold these three specific preferences simultaneously in the standard model.
  *   **Real Money Stakes:** Chocolate is low stakes. Some students might treat it as a game. The "One Question Selected for Pay" rule is the standard economic fix for this, but acknowledge that it's not perfect.

  **Honesty Check (The "Rigging" Accusation):**
  *   By having a student generate the number and seal the envelope *in front of the class*, you remove yourself as the source of the uncertainty. If they still accuse you of rigging the dice or the envelope swap, no classroom demo will ever work for them. The sealed envelope is the strongest shield you have without a budget for a third-party auditor.

  ### **TA Script Snippet for the Debrief**
  *"Look at your card. If you chose Known for Red, you acted like the Mystery Urn had fewer than 50 reds. If you chose Known for Black, you acted like it had fewer than 50 blacks. Unless there are fewer than 100 tokens in the urn, those two beliefs cannot both be true. You didn't just dislike the risk; you held two impossible beliefs at the same time. That is what the Sure Thing Principle catches."*
