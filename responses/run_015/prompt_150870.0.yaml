  3.  **Map the History (Russia 1991-1994):**
      *   *Context:* USSR collapsed. Supply chains broken. Budget deficit huge. Shortages rampant.
      *   *The Reform:* January 2, 1992, price liberalization. Voucher privatization.
      *   *The Outcome:* Hyperinflation (wiped savings), rise of oligarchs (acquired assets cheaply), industrial collapse, life expectancy drop, rise of crime/corruption.
      *   *Counterfactual:* Was gradualism possible? China did it. But China had an agrarian base and a strong party state. Russia had an industrialized base and a collapsing state.

  4.  **Evaluate the Burkean Prediction:**
      *   *Prediction:* Tearing down complex systems without understanding their latent functions leads to unintended negative consequences (chaos, loss of social cohesion).
      *   *Reality:* Chaos ensued. The "fence" (Soviet structures) was holding up more than just ideology; it was holding up supply chains, social welfare, and employment.
      *   *Nuance:* Was the fence *worth* keeping? Or was it a prison? If it's a prison, tearing it down is good even if it hurts.

  5.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the strength of the analogy but set the stakes. This is a "hard case" for the theory.
      *   **The Fence (Soviet Institutions):** Define what actually existed. It wasn't just "communism"; it was a specific web of interdependence (director networks, barter, social services tied to factories).
      *   **The Reformers (The Rationalists):** Gaidar et al. They viewed the system as a distortion to be corrected, not an organism to be tended. They had a blueprint (Washington Consensus).
      *   **The Hidden Functions:** What did the "fence" do?
          *   Price controls = social peace (artificially).
