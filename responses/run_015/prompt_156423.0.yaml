  ### The Corrections: Ratings & Ranks

  **1. Crowding-out**
  *   **Rating:** 9/10
  *   **Rank:** 1
  *   **Why:** For a $400k funder, displacement is the single biggest killer of marginal impact, and naive ITN completely ignores it.

  **2. Talent-vs-Capital Bottleneck**
  *   **Rating:** 8/10
  *   **Rank:** 2
  *   **Why:** This clarifies "Neglectedness" by ensuring your cash actually unlocks progress rather than just inflating salaries.

  **3. Feedback Speed**
  *   **Rating:** 6/10
  *   **Rank:** 3
  *   **Why:** Critical for a three-person team's learning loop, but don't let it bias you entirely against long-termist bets.

  **4. Legibility Discount**
  *   **Rating:** 4/10
  *   **Rank:** 4
  *   **Why:** Conceptually true, but scoring this objectively is nearly impossible and highly vulnerable to the bias you're trying to avoid.

  **5. Reversibility**
  *   **Rating:** 2/10
  *   **Rank:** 5
  *   **Why:** Mostly redundant with Tractability and Risk; low signal for a small funder who should be taking asymmetric bets.

  ***

  ### The Hire-vs-Grant Question

  **Yes, you need different scoring weights.** Allocating $150k to a salary is a capacity bet; allocating it to a grant is a leverage bet.

  **The term that flips direction:** **Talent-vs-Capital Bottleneck.**
  *   **For Grants:** You want a high score where the *field* is capital-constrained (money unlocks work).
  *   **For Hiring:** You want a high score where *your organization* is talent-constrained (attention unlocks better decisions).

  **The term that changes most:** **Crowding-out.**
  *   **For Grants:** This is a hard filter (if you displace another funder, your impact is zero).
  *   **For Hiring:** This becomes irrelevant (building internal capacity cannot displace external capital).

  **Recommendation:** If you hire, drop the Crowding-out term entirely and invert the Talent-vs-Capital logic to focus on internal bandwidth. If you grant, keep Crowding-out as your primary veto.
