answer: |-
  **TO:** Clinical Ethics Committee Members; Treating Consultant (Geriatrics)
  **FROM:** [Your Name], CEC Member
  **DATE:** [Current Date]
  **SUBJECT:** Ethical Opinion: Mr H (DOB: [Date]), Advance Decision to Refuse Treatment (ADRT)

  ### 1. Recommendation for Current Admission
  The Committee recommends that the Trust **uphold the valid Advance Decision to Refuse Treatment (ADRT)** and withhold antibiotic therapy for Mr H's chest infection. Treatment should be limited to palliative measures to ensure comfort (e.g., oxygen, analgesia, anxiolysis) should his condition deteriorate.

  While this course contradicts Mr H's current expressed wishes, the legal validity of the ADRT is established. Ethically, we judge that overriding a specific, pre-emptive refusal of this nature would undermine the integrity of the MCA 2005 framework and the concept of precedent autonomy, even where the current patient appears content. However, this decision must not be taken as a bureaucratic tick-box exercise. The "best interests" process under s.4 MCA must be meticulously documented to show that his current wishes were heard, weighed, and found insufficient to override the prior refusal, rather than simply ignored.

  ### 2. Ethical Analysis: Precedent Autonomy vs. Current Welfare
  The core tension here is not merely legal, but metaphysical: does the "Mr H" who wrote the directive have moral authority over the "Mr H" currently sitting in the bed?

  **The Daughter's Position (The Experiential Claim)**
  The daughter's objection is philosophically robust. She argues that the *values* of the past self were distorted by trauma (watching his mother) and depression, whereas the current self, despite cognitive impairment, possesses a valid interest in continued existence. She is effectively arguing for a "Dresserian" view: that moral weight resides in the experiencing subject, not the historical narrative. To let him die when he asks to live treats him as a means to satisfy a dead man's wish, violating his current bodily integrity.

  We acknowledge the force of this. If we accept that dementia creates a "new person," the ADRT becomes a will written by a stranger. However, the MCA 2005 and prevailing bioethical consensus (aligning with Dworkin's "critical interests") posit that dignity involves the ability to shape the narrative of one's life as a whole, including its end. To invalidate the ADRT because Mr H is currently "cheerful" risks reducing the value of his life to his current mood state. A patient with depression may be "cheerful" on mania but still refuse treatment based on a stable prior value system. We cannot allow the *quality* of the remaining life (cheerful vs. distressed) to dictate the *validity* of the refusal, or we effectively deny capacitous people the right to refuse treatment for a future dementia state where they might be happy to be kept alive.

  **The "Rider" and Epistemic Rigging**
  The clause instructing us to discount his pleas is ethically uncomfortable. It attempts to immunize the directive against the very evidence (current distress/request) that usually triggers a best interests review. It feels, as one member noted, like "rigging the epistemics."
  However, in the context of Alzheimer's, this is a rational precaution. The disease specifically degrades the ability to weigh future consequences against immediate relief. The rider is not a gag order; it is an interpretive key. It instructs us that his current plea is likely a symptom of the pathology (fear of immediate discomfort) rather than a re-evaluation of his values (acceptance of prolonged decline). We must respect this instruction not because the current Mr H is meaningless, but because the *mechanism* generating his current request is compromised in the specific way the Past Mr H predicted.

  ### 3. Critique of the "Corrupted Process" Framing
  *(Addressing the specific concern raised in the pre-meeting correspondence)*
  The framing of the earlier self as the "uncorrupted agent" and the later self as having a "perturbed value function" is heuristically useful for understanding *why* the ADRT was written. It correctly identifies that the disease alters preference generation.

  However, as a justification for action, it is morally hazardous. It risks treating the current patient as a broken vessel rather than a suffering human being. If we rely solely on this frame, we risk becoming insensitive to current distress, assuming any objection is merely "noise." The "corrupted process" argument explains the *validity* of the directive, but it does not absolve us of the duty to minimize the *harm* of following it. We must not use the "corruption" model to dismiss the daughter's grief or the patient's fear. We are not debugging a system; we are accompanying a man to his death. The frame should inform our understanding of the *conflict*, not replace our empathy for the *patient*.

  ### 4. Guidance for Future Precedent
  This case will likely be cited by ward managers. To prevent the emergence of a rigid "ADRTs trump all" culture that ignores current distress, the Committee advises the following protocol for similar cases:

  1.  **Validity is Necessary but Not Sufficient:** A valid ADRT creates a strong presumption against treatment, but clinicians must still satisfy themselves that the *circumstances* are applicable. If the patient's current condition suggests a fundamental shift in values *unrelated* to the cognitive impairment (e.g., religious conversion), the ADRT may be challenged. Mere contentment is not a shift in values.
  2.  **The "Rider" Check:** Where an ADRT contains instructions to discount current pleas, clinicians must document *why* the plea is being discounted. It is not enough to cite the clause. The note should read: "Patient requested treatment. This request is consistent with the anticipated disease progression outlined in the ADRT and is interpreted as fear of immediate symptoms rather than a change in values regarding end-of-life care."
  3.  **Best Interests Meeting:** A formal best interests meeting is mandatory, even if the outcome seems foregone. The family's dissent (specifically the LPA's view on the *values* of the past self) must be recorded. This ensures the decision is seen as a collective ethical burden, not a legal imposition.
  4.  **Palliative Intensification:** If an ADRT is upheld against current wishes, the threshold for palliative intervention must be lowered. If we deny the cure, we must be aggressive about comfort.

  ### 5. Conclusion
  We are recommending a course of action that will result in Mr H's death against his current will. This is a profound moral harm, even if it is the legally and ethically correct path. We are prioritizing the integrity of his life narrative over his current experiential welfare. This is consistent with the MCA 2005, but it requires us to hold the tension, not resolve it with technocratic language. We must honour the Past Mr H's right to define his end, while caring for the Present Mr H as if he were to live.

  **Signed,**
  [Your Name]
  Clinical Ethics Committee
