      *   *Recommendation:* This is tricky. Legally, the ADRT likely binds. Ethically, ignoring a cheerful patient asking for help is hard. However, if the ADRT is valid and applicable, the Trust *cannot* treat. The Ethics Committee's role isn't to override the law, but to advise on *best interests* within the law. If the ADRT is valid, the treatment is unlawful. *Correction:* The prompt says the lawyer says it's valid. The CEC cannot advise illegal action. The recommendation must be to uphold the ADRT *but* with significant caveats about process and support, OR find a way to distinguish the circumstances.
      *   *Wait, nuance:* Under MCA s.25, an ADRT is not applicable if the patient has done anything "clearly inconsistent" with it. Does asking for treatment count? Usually, if they lack capacity, their current request doesn't invalidate the ADRT. *However*, the "Rider" makes this unique.
      *   *Decision:* The safest ethical and legal path is to uphold the ADRT, *but* the reasoning must be robust. The "Corrupted Process" view supports the ADRT. The Daughter's view challenges the *applicability* based on changed values.
      *   *Refining the Recommendation:* Given the legal validity stated by the lawyer, the Committee cannot recommend treatment. To do so exposes clinicians to liability. The ethical work is justifying *why* we respect the past self despite the current self's plea.
      *   *Addressing the User's Instinct:* I need to tell them that while the "corrupted process" model explains the *logic* of the ADRT, it fails to capture the *moral status* of the current patient. It's too cold. The justification should be about *integrity of the life narrative* rather than *data corruption*.

  6.  **Developing the Argument regarding the Daughter:**
      *   She argues the Past Self was depressed/traumatized. This is a claim about *authenticity*.
      *   Counter: We generally respect decisions made under emotional distress (e.g., Jehovah's Witnesses refusing blood, though that's different). But dementia adds the layer of identity change.
      *   Resolution: We must weigh the *risk of harm* (death) against the *violation of autonomy*. If the ADRT is valid, autonomy (Past) wins legally. Ethically, we argue that allowing the "Ulysses Contract" to stand protects the dignity of the life project, even if the current agent doesn't understand it.
      *   *Crucial Point:* We must ensure the "Rider" doesn't become a blanket ban on assessing current distress. The "plea" must be assessed. Is it genuine fear? Or confusion? The ADRT says "discount it." We need to advise that "discounting" doesn't mean "ignoring," it means "interpreting through the lens of the directive."

  7.  **Addressing the "Precedent" Aspect:**
      *   Ward managers will use this. It needs to prevent "ADRTs are absolute regardless of current suffering" vs "Current happiness trumps all."
      *   Guideline: Valid ADRTs create a strong presumption. Current wishes must be weighed but cannot override a valid refusal unless there is evidence the patient *regained capacity* or the circumstances are *significantly different* than anticipated. The "Rider" is valid but requires careful verification that the current plea is indeed a symptom of the condition, not a change of mind based on new values.

  8.  **Final Polish:**
