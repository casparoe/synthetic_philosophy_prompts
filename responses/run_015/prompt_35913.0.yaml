          *   Advance Decision to Refuse Treatment (ADRT): Valid under Mental Capacity Act 2005. Refuses antibiotics/nutrition/hospital once needing assistance with dressing/toileting (which he now does).
          *   Specific Clause (The "Rider"): If he pleads for treatment, discount it as "the disease speaking" (based on witnessing his mother).
          *   Current State: Cheerful, oriented, *wants* treatment.
          *   Family Conflict: Daughter (Welfare LPA) says he's content, past self was depressed, treating against current will is betrayal. Son (Witness) says past self was deliberate, treating is betrayal.
          *   Consultant: Wants written opinion within the week.
      *   **User's Instinct:** "Earlier self" vs. "Later self" (Rationalist/Parfitian view). Worries this is just "rigging epistemics."
      *   **Counter-View:** Palliative Consultant (Current experiential welfare is all that matters).
      *   **Legal Context:** Lawyer says ADRT is valid (law settled, ethics open).
      *   **Requirements for the Draft:**
