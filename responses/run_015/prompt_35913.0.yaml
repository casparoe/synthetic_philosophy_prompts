          *   Critically evaluate the user's "corrupted process" framing (is it doing work or flattering priors?).
          *   Tone: Professional, ethical, nuanced, suitable for an NHS CEC context.

  2.  **Deconstruct the Ethical/Legal Tension:**
      *   **Legal:** Under the Mental Capacity Act (MCA) 2005, a valid and applicable Advance Decision to Refuse Treatment (ADRT) is legally binding. It has the same force as a contemporaneous refusal by a capacitous patient. If it applies to these circumstances, treating is battery/assault.
      *   **Ethical:** The tension is between *Precedent Autonomy* (Past Self) and *Current Wellbeing/Assent* (Present Self).
      *   **The "Rider":** This is the crux. It attempts to pre-emptively invalidate future expressions of desire. This challenges the standard MCA assumption that current wishes/feelings must be considered (s.4 MCA).
      *   **The Daughter's Argument:** It's not just "he's happy." It's "the values of the person who wrote this were distorted by depression/trauma, and the person before us is a valid moral agent whose suffering matters." This is a *substantive* critique of the Past Self's competency/values, not just a claim about current capacity.

  3.  **Evaluate the User's "Corrupted Process" Framing:**
      *   *Strength:* It captures the intuition that dementia alters preference generation. It aligns with the "Ulysses Contract" logic.
      *   *Weakness:* It risks dehumanizing the current patient. If the "current self" is sentient and suffering (or afraid of death), ignoring that because his "value function is perturbed" treats him as a vessel for the past self's wishes rather than a patient in his own right. It might be "flattering the prior" because it offers a clean, technical solution to a messy emotional reality. It sidesteps the moral weight of *current* suffering.
      *   *Verdict:* It's a useful heuristic for *why* the ADRT exists, but a dangerous justification for *ignoring* current distress. It needs to be balanced against the "best interests" test which includes current wishes and feelings.

  4.  **Drafting the Opinion - Structure:**
      *   **Header:** Standard CEC format.
      *   **Executive Summary/Recommendation:** Clear bottom line first.
      *   **Legal Context (Brief):** Acknowledge validity but pivot to ethics.
      *   **Ethical Analysis (The Core):**
          *   Address the Precedent Autonomy vs. Current Welfare tension.
          *   Address the Daughter's argument (Values change vs. Values distorted).
          *   Address the "Rider" (Epistemic rigging).
          *   Address the User's "Corrupted Process" idea (Honest feedback).
      *   **Precedent/Guidance:** How to handle future cases.
      *   **Conclusion:** Final recommendation.

