  **Note on Form and Turn**

  The turn occurs on line 25 (Stanza 5, line 1): "The truth sat heavy in my hand." Up to this point, the poem tracks the phenomenological continuity of experience despite the hidden technical substitution. The turn introduces the explicit knowledge of the re-routing, yet the subsequent lines confirm that this knowledge alters nothing in the stream of consciousness. This enacts Dennett's deflation: knowing the wiring doesn't change the "where" of the experience.

