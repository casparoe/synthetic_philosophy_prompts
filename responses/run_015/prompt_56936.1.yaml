  The default reading is simply "we do not assume LEM as an axiom," while the claim that "LEM is false" is almost always sloppy shorthand for "LEM is not universally valid" or a conflation of meta-level underivability with object-level negation.

  ### The Menu of Claims

  Here are the distinct precise claims hidden behind "rejecting LEM," separated by category.

  **1. Axiomatic Neutrality (Proof-Theoretic)**
  *   **Claim:** $\nvdash \forall P, P \lor \neg P$.
  *   **Status:** True/Default.
  *   **Explanation:** This is the standard constructive stance. The logic is designed so that LEM is not derivable from the other rules. It does not assert LEM is false; it merely refuses to grant it for free. This licenses the move "you can't case-split on $P$ versus $\neg P$" because there is no introduction rule giving you $P \lor \neg P$ to eliminate.

  **2. The Disjunction Property (Proof-Theoretic)**
  *   **Claim:** If $\vdash A \lor B$, then $\vdash A$ or $\vdash B$.
  *   **Status:** True for many constructive systems (e.g., Heyting Arithmetic, plain CoT), but not all.
  *   **Explanation:** This is the formalization of "a proof of $A$-or-$B$ has to tell you which one." It is a meta-theoretic property of the proof system, not an axiom inside the logic. This licenses the complaint that "we don't have a proof of it" for classical theorems; if you can't prove $A$ and can't prove $B$, the system forbids you from proving $A \lor B$ even if it's classically true.

  **3. Strong Negation of Universal LEM (Object-Level)**
  *   **Claim:** $\vdash \neg (\forall P, P \lor \neg P)$.
  *   **Status:** False/Inconsistent in standard systems.
  *   **Explanation:** In standard intuitionistic logic, $\neg \neg (P \lor \neg P)$ is a theorem. Therefore, proving the negation of the universal statement is usually impossible without adding specific, non-standard axioms (like continuity principles for choice sequences). When someone says "LEM is false," they rarely mean this formal statement.

  **4. Existence of Counter-Models (Semantic)**
  *   **Claim:** There exists a model $\mathcal{M}$ and a proposition $P$ such that $\mathcal{M} \not\models P \lor \neg P$.
  *   **Status:** True.
  *   **Explanation:** In semantics like topological models or Kripke models, truth is contextual. A proposition might be neither verified nor falsified at a current "stage" of knowledge. This licenses the claim that LEM is "not valid" without claiming it is logically contradictory.

  **5. Semantic Anti-Realism (Metaphysical)**
  *   **Claim:** Truth outruns proof-independent fact; $P$ is true iff we have a proof of $P$.
  *   **Status:** Philosophical thesis (Defensible within the framework).
  *   **Explanation:** This is the justification for the logic. It asserts that mathematical truth is constituted by our ability to verify it. This supports the rejection of LEM by denying that there is a "fact of the matter" for undecided propositions.

  ### The "LEM is False" Boast

  Your instinct is correct: in standard constructive logic (like intuitionistic logic or the Calculus of Constructions), you cannot prove $\neg (\forall P, P \lor \neg P)$. In fact, double-negated LEM ($\neg \neg (P \lor \neg P)$) is provable, so asserting the negation of LEM would lead to a contradiction ($\bot$).

  The nearest true thing that speaker could have meant is one of two things:
  1.  **Meta-Level Invalidity:** They meant "LEM is not valid" (Reading 4), i.e., there are models where it fails. This is often sloppily spoken as "LEM is false."
  2.  **Specific Theory Extension:** They are working in a specific constructive theory (like Brouwer's intuitionism with choice sequences) where additional axioms (like the Continuity Principle) allow one to prove $\neg (P \lor \neg P)$ for *specific* $P$ involving infinite sequences. In that specific extended context, LEM is indeed refutable for those propositions.

  If they are in a standard type theory seminar (like Coq/Agda without extra axioms), the boast is technically false and should be corrected to "LEM is underivable."

  ### The Real Number Example

  Let $a = 0$ if Conjecture $C$ holds, $a = 1$ if $\neg C$ holds. Classically $a=0 \lor a=1$.

  *   **Which Slot:** This is a **Brouwerian Weak Counterexample**. It belongs under **Axiomatic Neutrality (1)** and **The Disjunction Property (2)**.
  *   **What it Supports:** It supports the claim that $\nvdash a=0 \lor a=1$. Since we have no proof of $C$ and no proof of $\neg C$, the Disjunction Property forbids us from asserting the disjunction. It demonstrates that accepting LEM would imply we already know the status of $C$, which we don't.
  *   **What it Does Not Support:** It does *not* support the claim that $\vdash \neg (a=0 \lor a=1)$ (Reading 3). We are not claiming the disjunction is false; we are claiming we cannot assert it is true. It does not prove LEM is contradictory; it only proves LEM is not constructively justified.

  ### Markov's Principle

  Markov's Principle (MP) is the statement: $\neg \neg \exists n P(n) \to \exists n P(n)$ for decidable predicates $P$.

  *   **Placement:** It sits between Pure Intuitionism and Classical Logic.
  *   **Relation to LEM:** It is strictly weaker than LEM. You can have MP without LEM.
  *   **Why the Compromise:** It appeals to computability. If it is impossible for a search for $n$ to run forever ($\neg \neg \exists$), then the search must terminate ($\exists$). Russian constructivists accept this as evident about algorithms. Brouwerian intuitionists reject it because "impossible to diverge" is not the same as "we have a bound on the runtime."
  *   **In the Seminar:** When invoked as a compromise, it means "We won't give you full case-splitting on everything (LEM), but we will let you convert impossibility-of-failure into existence for computable searches." It salvages some classical reasoning without collapsing the constructive distinction between proof and truth.
