  Regarding her refusal to separate having a reason from being able to be moved by it, I take this as substantive evidence of her view rather than mere caution. Case seven, where a fragile motive still grounds a reason, shows she does not require stable motivation, but case nine suggests she requires the capacity for motivation. If she believed reasons were entirely external, she could have simply said yes, she has a reason she cannot act on. Her resistance implies she sees the capacity to be moved as constitutive of the reason's existence, which is a hallmark of Internalism. This makes the Arno case even more pivotal, as his capacity to be moved is intact, but his motivational set lacks the hook.

  Finally, regarding the discriminating case, I think you should discard Elin. Case seven already establishes that motives surviving only implicitly can ground reasons, so Elin's habit likely qualifies similarly, which tells us little about the moral ontology at stake. It tests the reflection condition, which we already have data on. Instead, you should put the case of the Indifferent Bystander. Describe an agent who is fully informed, non-pathological, and lacks concern for others, who can prevent severe harm to a stranger at negligible cost to themselves. Ask if they have a reason to help. Corrected Internalism says no, as there is no motivational hook. Objective Harm Constraint says yes, as preventing severe harm is an objective reason. This cleanly divides the two rules without the confounding variable of pathology present in Arno's case. I look forward to hearing how it goes.

