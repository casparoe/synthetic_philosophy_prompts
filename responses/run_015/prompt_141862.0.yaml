answer: |-
  Run this procedure sequentially. If any step yields a definitive answer, stop and write the accompanying phrase.

  1.  **The Swap Test:** If you replaced the artifact with a manual process run by the same institution under the same policies, would the political effect persist? If yes, the artifact is incidental. The politics belong to the **INSTITUTION**.
      *   *Copy phrase:* "The tool enforces what policy alone cannot."
      *   *Blocks Intent:* You are testing functional equivalence, not designer purpose.

  2.  **The Upkeep Test:** Does the artifact's function depend on a continuing external relationship (servers, parts, updates) that a third party can sever independently of the owner's will? If yes, the politics lie in the dependency, not the design or deployment. This is **UPKEEP**. Your instinct is correct: this is distinct from design because the harm emerges from fragility over time, not initial configuration.
      *   *Copy phrase:* "Functionality relies on a lifeline someone else holds."
      *   *Blocks Agency:* You are tracing supply chain leverage, not attributing will to the object.

  3.  **The Constraint Test:** Does the artifact physically or logically make an action impossible without third-party cooperation, rather than just costly? If yes, the artifact actively restructures power. This is **ARTIFACT**. If the effect is merely about who is burdened by a system that could theoretically be contested, the harm is a values choice about priority. This is **UNSETTLED** (requires editorial judgment on whose options count).
      *   *Copy phrase:* "The system makes refusal impossible, not just costly."

  **Case Applications**

  1.  **Transit Rostering:** Swap Test: A human scheduler given the same budget constraints would also create split shifts to maximize coverage. The effect persists without the algorithm.
      *   *Verdict:* **INSTITUTION**. The algorithm is the excuse, not the cause.
      *   *Sentence:* "The algorithm executes the budget, it does not set it."

  2.  **E-bike Battery:** Swap Test: No manual process replaces a locked chemical cell. Upkeep Test: The bike functions only while the vendor maintains authentication servers. When solvency ends, ownership ends.
      *   *Verdict:* **UPKEEP**. The politics lie in the transfer of property rights to a supply chain.
      *   *Sentence:* "Ownership ends where the vendor's server begins."

  3.  **AI Essay Detection:** Swap Test: A human grader could bias, but allows contestation. The tool makes contestation technically opaque (no evidence provided). However, the University chose to remove the appeal route. The bias is technical (Artifact), but the denial of due process is policy (Institution). The harm requires both.
      *   *Verdict:* **ARRANGEMENT**. Your preference to blame the detector alone is factually weak; the University empowered an opaque tool without safeguards.
      *   *Sentence:* "The harm lies in coupling an opaque tool with absolute authority."

  **Limitations**

  This procedure cannot resolve slow violence (effects emerging over decades) or distributed agency (too many actors to trace). It smuggles two judgments: choosing the baseline for the Swap Test (what counts as "normal"?) and choosing the affected group for the Constraint Test. An editor must decide which burdens matter enough to name. The procedure identifies *where* the leverage sits, not whether the outcome is unjust.

  \answer{ARRANGEMENT}
