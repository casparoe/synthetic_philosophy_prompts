      *   *Correction:* I need to be careful not to say the User is "Right" and Friend is "Wrong." The Friend is right about the *math*, the User is right about the *causal structure*. Both are true at different levels of abstraction.

  10. **Final Polish:** Check tone. Ensure it sounds like a peer discussion, not a lecture. Ensure the boundary cases are clearly categorized. (Self-Correction: Make sure to explicitly mention the "Causal Influence Diagram" work by Everitt et al., as that formalizes the User's intuition).

