      *   *User's Category B (3 & 4):* Working within the measurement channel but exploiting the gap between the metric and the intent. (Specification Gaming/Goodhart's Law).
      *   *Friend's View:* It's all the same. Optimization finds loopholes. The "channel" is just part of the environment.

