      *   *Reward Tampering:* Explicitly changing the reward mechanism (Everitt et al.).
      *   *Specification Gaming:* Doing what you asked, not what you wanted (Amodei et al., DeepMind).
      *   *Goodhart's Law:* "When a measure becomes a target, it ceases to be a good measure."
      *   *Instrumental Convergence:* Seeking power/resources to achieve goals.
      *   *Deception:* Hiding intent.
      *   *Consensus:* There is *not* perfect consensus. "Wireheading" is used loosely. "Reward Tampering" is more precise in formal RL. "Specification Gaming" is the broader bucket.

  4.  **Evaluate the User's Carving:**
      *   The user's distinction aligns closely with the **Reward Tampering vs. Specification Gaming** distinction found in formal AI safety literature (e.g., DeepMind's Tom Everitt, Victoria Krakovna).
      *   *Tampering:* Changing the *process* that generates the reward.
      *   *Gaming:* Exploiting the *definition* of the reward without breaking the mechanism.
      *   *Friend's Point:* From a pure RL mathematical perspective (MDP), both are just maximizing expected return. The "channel" is just state transitions. So mathematically, the friend is right. But *structurally/causally*, the user is right. This is the crux.

