answer: |-
  The argument you have isolated is a specific, robust formulation of the **Argument from Divine Hiddenness**. However, your intuition is correct: there is a conceptual distinction between the standard formulations of that argument and the specific "move" you are describing.

  While the umbrella term is Divine Hiddenness, the specific load-bearing component you have identified—the claim that the *evidence itself* is uniformly ambiguous for *everyone*, rather than simply inaccessible to *some*—is best conceptually carved out as the **Premise of Universal Epistemic Ambiguity**.

  In professional discourse, this is often treated as the strongest version of the Hiddenness argument. It shifts the focus from the *psychological state of the subject* (they do not believe) to the *structural quality of the evidence* (it is opaque for all).

  Here is the precise conceptual carving you requested, distinguishing this move from its neighbors and defining its edges.

  ### 1. The Name and Classification
  The established name for the broader category is the **Argument from Divine Hiddenness**. However, to capture the specific nuance you noticed—the uniformity of the obscurity—it is more precisely described as the **Argument from Universal Epistemic Ambiguity**.

  While "Divine Hiddenness" is the genus, your description identifies a specific species. Standard Hiddenness arguments often rely on the existence of *non-resistant non-believers* (people who want to believe but cannot). Your version is more radical: it claims that *no one* has decisive evidence, regardless of their resistance or desire. It argues that the epistemic environment itself is structurally murky, not just that some individuals are lost within it.

  ### 2. Differentiation from Neighboring Arguments

  To understand why this feels distinct to you, we must distinguish it from the three arguments you mentioned.

  **A. Versus the Argument from Non-Belief**
  *   **The Argument from Non-Belief** focuses on the *distribution of belief*. It claims: "There are people who do not believe; therefore, God likely does not exist."
  *   **Your Argument (Universal Ambiguity)** focuses on the *distribution of evidence*. It claims: "There is no clear evidence for *anyone*; therefore, God likely does not exist."
  *   **The Distinction:** The Argument from Non-Belief can be countered by saying, "Well, *some* people do believe (e.g., mystics, saints), so the problem is only with the non-believers." Your argument blocks this countermove. It asserts that even the believers do not have *decisive* evidence; they merely have the same ambiguous hints as everyone else, interpreted differently. The target is not the unbeliever's state of mind, but the clarity of the divine signal itself.

  **B. Versus the Problem of Evil**
  *   **The Problem of Evil** is *axiological* (value-based). It argues that the *content* of the world (suffering, pain) is incompatible with a good God.
  *   **Your Argument** is *epistemic* (knowledge-based). It argues that the *accessibility* of God is incompatible with a relational God.
  *   **The Distinction:** A theist can argue that suffering serves a soul-making purpose (a moral defense). They cannot as easily argue that total epistemic ambiguity serves a relationship purpose, because ambiguity inherently frustrates identification. The Problem of Evil asks, "Why is there pain?" Your argument asks, "Why is there no clarity?"

  **C. Versus the Argument from Insufficient Evidence**
  *   **The Argument from Insufficient Evidence** is typically *local* and *individual*. It says, "I have not seen enough evidence to warrant belief."
  *   **Your Argument** is *global* and *structural*. It says, "No human, anywhere, has seen enough evidence to warrant certainty."
  *   **The Distinction:** The Insufficient Evidence argument leaves open the possibility that *you* just haven't looked hard enough, or that evidence exists for others. Your argument closes that door. It claims the ambiguity is a universal feature of the human condition, not a local failure of investigation.

  ### 3. Defining the Edges: What Counts and What Does Not

  To use this concept precisely, you need to know where the boundary lies. The "Universal Epistemic Ambiguity" move only functions if specific conditions are met.

  **Conditions that Count as an Instance:**
  1.  **Uniformity:** The ambiguity must be presented as a universal human condition. If the arguer admits that *some* people (e.g., biblical prophets, modern mystics) had clear, unambiguous evidence, the argument collapses into a standard Argument from Non-Belief (i.e., "Why don't *I* get what they got?").
  2.  **Public Accessibility:** The argument hinges on the lack of *publicly decisive* evidence. Private religious experiences do not count as counter-evidence here, because the argument specifies that such experiences are themselves ambiguous to the outsider and often even to the experiencer (they can be explained away as psychology, etc.).
  3.  **Relational Premise:** The argument must assume that a loving God desires a *personal, identifiable relationship*. If God's goal were merely moral compliance or cosmic order, ambiguity might be acceptable. The argument fails if the definition of God does not include the desire for mutual recognition.

  **Conditions that Do Not Count:**
  1.  **Localized Hiddenness:** If the argument is "God is hidden from *me* because I live in a secular society," that is an argument from geographic or cultural disadvantage, not Universal Ambiguity.
  2.  **Temporary Hiddenness:** If the argument allows that evidence was clear in the past (e.g., miracles in antiquity) but is not clear now, it becomes an argument about historical epistemology, not universal structural ambiguity.
  3.  **Willful Ignorance:** If the lack of evidence is attributed to human sin, repression, or cognitive bias (i.e., "The evidence is clear, but you are suppressing it"), this is not an argument from Ambiguity. It is a defense of Hiddenness. Your argument requires that the evidence *itself* is murky, not that the viewer is impaired.

  ### 4. Why This Move is Philosophically Distinct

  The reason you could not pin this down is that it occupies a unique space between **Evidentialism** and **Relational Theology**.

  *   **Evidentialism** asks: "Is the proposition 'God exists' supported by the data?"
  *   **Relational Theology** asks: "Is the relationship between God and man intact?"

  Your argument fuses these. It says: "The data is too ambiguous to support the proposition, *specifically because* a relationship would require clearer data."

  This is why the "uniformity" is the load-bearing beam. If the evidence were clear for *some*, the Relational Theology defense could work ("God reveals Himself to those who seek"). If the evidence is uniformly murky for *all*, the Relational Theology defense fails ("God is not revealing Himself to anyone clearly").

  ### Summary
  The move you are identifying is the **Premise of Universal Epistemic Ambiguity** within the **Argument from Divine Hiddenness**.

  It is distinct because it does not argue from the *failure of humans to believe* (Non-Belief), nor from the *presence of suffering* (Evil), nor from an *individual lack of proof* (Insufficient Evidence). It argues from the **structural opacity of the evidential environment itself**. It claims that the "signal" is uniformly weak for every "receiver," which is incompatible with a sender who desires genuine contact.
