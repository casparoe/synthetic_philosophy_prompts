answer: |-
  ### The Strategy-Stealing Decision Procedure

  This procedure determines if the **Strategy-Stealing Argument (SSA)** applies to your game. If it applies, the First Player (P1) has a theoretical advantage (at minimum, P1 cannot lose). If it does not apply, mathematics offers no certificate of bias, and the game must be judged by playtesting.

  **Instructions:** Answer the following five questions in order. If you answer **NO** to any **Necessary** condition, stop. The SSA does not apply. If you answer **YES** to all, the SSA applies.

  **Q1. Determinacy & Finite Length (Necessary)**
  *   **Question:** Is the game perfect information (no hidden cards/dice), no chance elements, and guaranteed to end in a finite number of moves without loops?
  *   **Yes:** Proceed.
  *   **No:** **Stop.** SSA requires deterministic, finite games.
  *   **Action:** Publish as is (Math cannot certify bias).

  **Q2. Role Symmetry (Necessary)**
  *   **Question:** Do both players win by achieving the *same* type of goal (e.g., both connect edges, both avoid poison), even if the board is rotated or reflected?
  *   **Yes:** Proceed.
  *   **No:** **Stop.** (Exception: See *Chomp* below. If goals are identical but the board has a symmetric "poison" element, proceed with caution).
  *   **Judgment Call:** In games like *Chomp*, roles are symmetric (both avoid poison) even if the board state isn't. In games like *Fox & Hounds*, roles are asymmetric (catch vs. escape).
  *   **Action:** Publish as is (Math cannot certify bias).

  **Q3. Monotonicity (Necessary)**
  *   **Question:** If a player magically had one extra piece of their color on the board (or had removed one extra opponent option), could that *ever* force them to lose or prevent a win they otherwise would have had?
  *   **Yes:** (Meaning: Extra pieces *never* hurt). Proceed.
  *   **No:** (Meaning: Extra pieces *can* hurt). **Stop.**
  *   **Judgment Call:** This is the most common failure point. In connection games (Hex), more stones help. In "avoid forming a shape" games (Thicket), more stones hurt. In Go, more stones can reduce liberties (hurt). Be honest: does cluttering the board help or hinder?
  *   **Action:** Publish as is (Math cannot certify bias).

  **Q4. The "Waste" Move (Sufficient)**
  *   **Question:** Can P1 make a first move that they can later pretend doesn't exist? (i.e., If P2's winning strategy ever demands playing on P1's first stone, can P1 simply play somewhere else without penalty?)
  *   **Yes:** SSA Applies.
  *   **No:** **Stop.** (This is rare in placement games but common in movement games).
  *   **Action:** Publish as is (Math cannot certify bias).

  **Q5. Draw Possibility (Determines Severity)**
  *   **Question:** Is a draw possible (board fills or stalemate without a winner)?
  *   **Yes:** SSA proves P1 cannot *lose*, but P1 might only draw.
  *   **No:** SSA proves P1 *wins*.
  *   **Action:** See Verdict Matrix below.

  ---

  ### Verdict Matrix

  | SSA Result | Draw Possible? | Verdict for Owner | Reasoning |
  | :--- | :--- | :--- | :--- |
  | **Applies** | **No** | **Add Swap Rule** | P1 has a proved winning strategy. Game is broken without mitigation. |
  | **Applies** | **Yes** | **Add Swap Rule** | P1 has a proved "not-lose" advantage. Swap rule balances first-move privilege. |
  | **Fails** | **Any** | **Publish as is** | Math offers no certificate. Bias is unproven; send to playtest. |
  | **Trivial** | **Any** | **Reject** | Game is solved trivially (e.g., 3x3 Tic-Tac-Toe) or rules are incoherent. |

  ---

  ### Limitations of This Procedure
  *   **Existence, Not Strategy:** This proves a winning strategy *exists* for P1; it does not tell you *what* it is. You cannot fix the game by patching specific openings.
  *   **Magnitude Unknown:** It does not tell you if P1's advantage is 1% or 100%. A Swap Rule is the only mathematical fix for *any* proved advantage.
  *   **No Playtesting Substitute:** If the SSA fails (Verdict: Publish as is), the game may still be broken. It simply means *this specific math proof* cannot detect it.
  *   **Judgment Calls:** Q2 (Symmetry) and Q3 (Monotonicity) require human intuition. If you are unsure about Monotonicity, assume the SSA fails.

  ---

  ### Game Analysis

  #### 1. Cairn
  *   **Q1 (Determinacy):** Yes. (Finite grid, no chance).
  *   **Q2 (Symmetry):** Yes. (Red connects Top-Bottom, Blue Left-Right. This is rotationally symmetric).
  *   **Q3 (Monotonicity):** Yes. (Stones form chains. An extra Red stone never breaks a Red chain or helps Blue. It can only help Red).
  *   **Q4 (Waste):** Yes. (P1 places a stone. If P2's strategy demands that cell, P1 places elsewhere. The extra stone is never a liability).
  *   **Q5 (Draws):** Yes. (Grid can fill).
  *   **SSA Status:** **Applies.** (Proves P1 cannot lose).
  *   **Verdict:** **Add Swap Rule.**
      *   *Note:* Even though draws are possible, P1 has a theoretical advantage. The "Pie Rule" (Swap Rule) is standard for Hex-like games to neutralize this.

  #### 2. Thicket
  *   **Q1 (Determinacy):** Yes.
  *   **Q2 (Symmetry):** Yes. (Both avoid 2x2, both connect edges).
  *   **Q3 (Monotonicity):** **No.** (Critical Failure).
      *   *Reasoning:* The loss condition is completing a 2x2 block. Having an *extra* stone on the board increases the risk of completing a 2x2 block. Therefore, an extra stone *can* hurt you. The Strategy-Stealing Argument requires that having more pieces is never worse.
  *   **SSA Status:** **Fails.**
  *   **Verdict:** **Publish as is.**
      *   *Note:* The math cannot certify a P1 advantage here. The self-blocking mechanic breaks the proof. Send to playtest to check for balance empirically. Do not assume it is fair, but do not reject it based on SSA.

  #### 3. Chomp
  *   **Q1 (Determinacy):** Yes.
  *   **Q2 (Symmetry):** Yes. (Both players try to avoid the poisoned square. Roles are identical).
  *   **Q3 (Monotonicity):** Yes. (Eating more squares is always legal if eating fewer is. Having eaten more squares restricts the opponent more. It never hurts to have removed more options).
  *   **Q4 (Waste):** Yes. (P1 takes the top-right corner square only. If P2 has a winning response, it involves eating a chunk including that square. P1 could have eaten that chunk as the first move).
  *   **Q5 (Draws):** No. (Finite game, someone must eat the poison).
  *   **SSA Status:** **Applies.** (Proves P1 Wins).
  *   **Verdict:** **Add Swap Rule.**
      *   *Note:* This is a classic SSA game. P1 is guaranteed a win. Without a Swap Rule, the game is mathematically solved and unfair.

  ---

  ### Summary for the Owner
  1.  **Cairn:** **Add Swap Rule.** (Math proves First Player advantage).
  2.  **Thicket:** **Publish as is.** (Math proves nothing; requires playtesting).
  3.  **Chomp:** **Add Swap Rule.** (Math proves First Player win).
