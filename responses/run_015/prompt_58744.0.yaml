answer: |-
  ### Context and Working Definitions

  This procedure uses three predictive modes to diagnose robot behavior. The **Physical Way** predicts based on material states: voltage, friction, heat, and mechanical wear. Use this when hardware failure is suspected. The **Design Way** predicts based on function and specifications: what the code, sensors, and planners are built to do and how they fail according to manuals. Use this when software or configuration is suspect. The **Intentional Way** predicts based on goals: treating the robot as an agent avoiding obstacles or completing deliveries. Use this when behavior seems strange but purposeful.

  A **Real Pattern** exists when an explanation predicts behavior reliably across similar situations, even if it ignores lower-level details. For example, "the robot stops for humans" is a real pattern if it holds every time, regardless of the specific sensor voltage. If the explanation works once but fails twice, it is not a real pattern. Technicians must move between modes to find the simplest explanation that forms a real pattern. Safety overrides all modes: if physical safety is uncertain, the robot stays down.

  ### The Triage Procedure

  **Step 1: Physical Safety Screen (Physical Way)**
  Inspect the unit for material faults. Check motors, brakes, batteries, and sensors for heat, damage, or loose connections.
  *   **Question:** Is there any physical evidence of damage or unsafe states (e.g., overheating, fluid leaks, broken casing)?
  *   **Pass:** No physical anomalies found. Proceed to Step 2.
  *   **Fail:** Physical fault found. **STOP.** Tag unit "Out of Service." Escalate to Safety Officer for sign-off before any repair attempt. Do not attempt to explain via Design or Intentional modes until physical integrity is restored.
  *   **Switch Condition:** If physical checks are clear but the incident involves safety (e.g., near-miss), remain in Physical Mode for sensor calibration checks before switching.

  **Step 2: Design Compliance Check (Design Way)**
  Review error logs, configuration files, and recent updates against manufacturer specifications.
  *   **Question:** Did the system behave according to its programmed logic and error handling protocols?
  *   **Pass:** Logs match the behavior (e.g., obstacle detected -> stop -> log created). Proceed to Step 3.
  *   **Fail:** Behavior contradicts design specs (e.g., stop occurred without sensor trigger or log entry). **STOP.** This indicates a hidden fault. Escalate to Engineering. Do not return to service.
  *   **Switch Condition:** If logs explain the behavior perfectly, switch to Intentional Mode to assess operational impact. If logs are missing or contradictory, remain in Design Mode for deeper diagnostics.

  **Step 3: Goal Consistency Check (Intentional Way)**
  Analyze the behavior as a strategy to achieve a goal (e.g., safety, efficiency).
  *   **Question:** Does the behavior make sense as a rational attempt to complete a mission or avoid harm?
  *   **Pass:** Behavior aligns with a clear goal (e.g., detouring to avoid a blocked aisle). Proceed to Step 4.
  *   **Fail:** Behavior is self-defeating or random (e.g., driving into walls, looping without purpose). **STOP.** Treat as Design or Physical fault. Escalate.
  *   **Switch Condition:** If behavior seems rational but causes operational issues (e.g., congestion), remain in Intentional Mode to document the side effect for management.

  **Step 4: Pattern Validation (Real Pattern Test)**
  Verify if the chosen explanation predicts future behavior reliably.
  *   **Question:** If we return this unit to service, will this explanation hold true for the next similar situation?
  *   **Pass:** Yes, the pattern is stable (e.g., "Unit always stops for forklifts"). Proceed to Step 5.
  *   **Fail:** No, the behavior is intermittent or unexplained (e.g., "Unit stops sometimes for no reason"). **STOP.** Ground the unit. An unreliable pattern is a safety risk.
  *   **Judgment Point:** Technicians must decide if "reliable enough" meets safety standards. When in doubt, default to Fail.

  **Step 5: Disposition and Sign-off**
  *   **Return to Service:** Requires Pass in Steps 1-4. Safety-relevant flags require Safety Officer sign-off.
  *   **Escalate:** Requires Fail in any step. Document which mode identified the failure.
  *   **Value Judgment:** If Intentional Mode explains the behavior (e.g., avoiding humans) but Design Mode shows missing logs, you must prioritize Design/Physical reliability over Intentional logic for safety certification.

  ### Worked Applications

  **Unit 14: Forklift Halts**
  *   **Step 1 (Physical):** No heat, damage, or battery issues. **Pass.**
  *   **Step 2 (Design):** Robot halts, but error logs show no obstacle detection event. Design specs require a log entry for safety stops. **Fail.**
  *   **Analysis:** Although the Intentional Way suggests the robot is safely avoiding a forklift (a good goal), the Design Way reveals a logging failure. We cannot verify *why* it stopped.
  *   **Step 4 (Pattern):** Is "stops without logging" a reliable pattern? We cannot know yet.
  *   **Decision:** **Ground Unit.** This is the unwelcome result. Technicians may want to clear it because the behavior looks safe (Intentional), but the procedure mandates Design compliance for safety auditing. Without logs, the pattern is not verifiable. Escalate to Engineering to fix sensor logging.

  **Unit 07: Map Update Loop**
  *   **Step 1 (Physical):** Hardware intact. **Pass.**
  *   **Step 2 (Design):** Robot follows new map rules avoiding the pedestrian zone. Logs confirm path recalculation. **Pass.**
  *   **Step 3 (Intentional):** Robot is pursuing the goal of "avoid pedestrians" but failing the goal of "efficient delivery," causing congestion. Behavior is rational but suboptimal. **Pass.**
  *   **Step 4 (Pattern):** Will it loop every time? Yes, based on the new map rules. **Pass.**
  *   **Decision:** **Return to Service with Note.** The robot is functioning correctly per Design and Intentional modes. The congestion is a fleet-level optimization issue, not a unit fault. Escalate to Fleet Management to adjust traffic rules, not Maintenance.

  **Unit 22: Pallet Push and Overheat**
  *   **Step 1 (Physical):** Motor temperature warnings active. Smell of ozone from drive wheel. **Fail.**
  *   **Analysis:** Physical Way indicates immediate hardware stress.
  *   **Step 2 (Design):** System correctly triggered overheat warning and stopped. **Pass.**
  *   **Step 3 (Intentional):** Robot attempts to move pallet but fails. Goal pursuit is interrupted by physical limits. **Pass.**
  *   **Decision:** **Ground Unit.** Step 1 failure overrides all else. The intermittent pushing suggests a failing motor driver or mechanical bind. Do not reset warnings. Replace drive module. Safety Officer must inspect before return due to fire risk.

  **Summary of Applications:** Unit 14 demonstrates the requirement to prioritize Design verification over Intentional logic when safety logs are missing. Unit 07 shows when to accept behavior as valid but operationally costly. Unit 22 shows when Physical faults mandate immediate grounding regardless of software logic.

  ### Judgment Points and Predictable Misfires

  Technician judgment cannot be eliminated at two critical points. First, in **Step 4 (Pattern Validation)**, technicians must decide if an intermittent fault is "reliable enough" to risk service. Pressure to reduce downtime may bias them toward accepting weak patterns. Second, in **Step 5**, technicians must decide if an Intentional explanation (e.g., "it's just being cautious") overrides a minor Design discrepancy. The procedure dictates it should not for safety flags, but humans naturally prefer narrative coherence over log compliance.

  The procedure is most likely to misfire when **simplifications obscure coupled failures**. For example, treating a problem as purely Intentional (goal-seeking) might miss a Physical sensor drift that causes the "cautious" behavior. Similarly, assuming Design perfection may miss edge cases where code works as written but fails in the real world. Finally, the 15-minute limit may force technicians to skip Step 4 validation, relying on heuristics rather than testing the pattern across situations.

  ### Limits of the Procedure

  This procedure cannot identify root causes requiring code modification or mechanical redesign; it only categorizes faults for escalation. It cannot predict novel failures outside existing patterns or guarantee future safety beyond the next shift. It does not replace the Safety Officer's authority; it only prepares data for their review. Finally, it cannot resolve conflicts between fleet efficiency and individual unit safety; those are management decisions.
