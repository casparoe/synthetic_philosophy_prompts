answer: |-
  # Seminar Activity: Protocol Drift
  **Time:** 75 Minutes
  **Participants:** 10 Grad Students (3 Groups of 3, 1 Group of 1 or distribute as 3-3-4)
  **Goal:** Experiential demonstration of conceptual variation without naming the theory until the end.

  ## 1. Materials (Cheap & Analog)
  *   **3 "Control Panels":** Heavy cardstock sheets (one per group).
  *   **15 Paper Dials:** 5 per group. Two concentric circles of paper fastened with a brad/paperclip. The outer ring lists the parameter; the inner ring has an arrow and a scale (1–10 or Low–High).
  *   **Scenario Cards:** Index cards for writing the final ritual.
  *   **Voting Tokens:** 3 colors of sticky dots or small paper slips (Green = Same Theme, Yellow = Stretched, Red = Broken).
  *   **Whiteboard:** To track "Conceptual Capital" points.

  ## 2. The Five Parameters (Pre-printed on Dials)
  1.  **Scale of Harm:** (Spilled Coffee ⟷ Systemic Oppression)
  2.  **Direction of Agency:** (Self ⟷ Other ⟷ Object ⟷ Abstract Entity)
  3.  **Emotional Temperature:** (Cold/Transactional ⟷ Hot/Visceral)
  4.  **Temporal Orientation:** (Immediate ⟷ Retroactive ⟷ Pre-emptive ⟷ Atemporal)
  5.  **Social Visibility:** (Private Whisper ⟷ Public Spectacle)

  ## 3. Timeline & Rules

  ### Phase 1: Calibration (10 Minutes)
  *   **Facilitator:** "We are studying the stability of social concepts. Your seed concept is **The Apology**. Before we begin, the whole room must agree on the 'Default Settings' of a standard apology. Set all your dials to the center."
  *   **Task:** As a class, quickly define the center. (e.g., One person apologizing to another for a specific recent harm, moderate emotion, private or semi-public).
  *   **Rule:** You cannot change the *name* of the concept. You must still call it an apology, even if it looks weird.

  ### Phase 2: The Twist (20 Minutes)
  *   **Task:** In your groups, you must design a concrete micro-ritual or scenario.
  *   **Constraint:** You **must** turn exactly **2 or 3 knobs** to an extreme position. You cannot leave them in the center. You cannot turn all 5 (that creates noise, not signal).
  *   **Output:** Write the scenario on the Index Card. It must be actionable. (e.g., "A government apologizing to a river," not just "Agency changed to object.")
  *   **Incentive:** You are competing for **Conceptual Capital**.
      *   If the other groups vote "Same Theme": 1 Point.
      *   If they vote "Stretched": 3 Points.
      *   If they vote "Broken": 0 Points.
      *   **Bonus:** If you get a "Stretched" vote but can successfully argue it back to "Same Theme" during debrief, +2 Points.

  ### Phase 3: Presentation & Voting (25 Minutes)
  *   **Format:** Each group has 3 minutes to present their scenario.
  *   **Voting:** After each presentation, the *other* groups confer for 60 seconds and place a colored dot on the facilitator's board.
  *   **Criteria:**
      *   **Green (Same Theme):** Clearly an apology, just modified.
      *   **Yellow (Stretched):** Pushes the definition, creates tension, but holds.
      *   **Red (Broken):** No longer recognizable as an apology; conceptual collapse.

  ### Phase 4: The Reveal & Debrief (20 Minutes)
  *   **The Reveal:** Now you name it. "What you just did is a model of **Knob-Twiddling**." Explain that creativity is often treated as magic, but structurally, it is often systematic parameter adjustment within a conceptual space.
  *   **Mapping the Votes:**
      *   Look at the **Red (Broken)** votes. Ask: "Which knob breakage caused the collapse?" (Usually *Agency* or *Temporal Orientation* breaks the causal link required for apology).
      *   Look at the **Yellow (Stretched)** votes. These are the "creative" zone. This is where conceptual slippage happens. The concept bends but doesn't snap.
  *   **The Limitation (Crucial Discussion):** Ask the students: "In this game, you chose the knobs consciously. In real creative thought (or Hofstadter's model), does the thinker always know they are turning a knob?"
      *   *Point to make:* This game gamifies the *structure* of creativity, not the *spark*. Hofstadter argues slippage is often unconscious, associative, and triggered by context. Here, you were forced to be explicit. You simulated the *architecture* of insight, not the *phenomenology* of it.
  *   **Payoff:** The group with the most Conceptual Capital chooses the snack for the next seminar (or picks the first 5-minute warm-up topic).

  ## 4. Predictable Failure Points (Facilitator Notes)
  1.  **The "Safe Twist":** Groups will likely tweak *Emotional Temperature* or *Visibility* because those are safe. They will avoid twisting *Agency* or *Temporal Orientation* because those risk breaking the concept.
      *   *Counter-measure:* During Phase 2, circulate. If a group is playing safe, tell them: "That scenario is too stable. You need more tension to earn Capital."
  2.  **Definition Wars:** During Calibration, students may spend 15 minutes arguing about what a "real" apology is.
      *   *Counter-measure:* Arbitrate aggressively. "We need a baseline, not a thesis. Center it on 'I'm sorry I broke your cup' and move on."
  3.  **Voting Collusion:** Groups might vote "Stretched" for everyone to be nice.
      *   *Counter-measure:* Remind them that "Broken" votes are data, not insults. We need to find the breaking point of the concept.

  ## 5. Why This Works for Philosophy of Mind
  *   **Embodied Cognition:** They physically turn dials to represent abstract conceptual shifts.
  *   **Conceptual Boundaries:** The voting crisis (Green vs. Red) forces them to articulate the *necessary and sufficient conditions* of the concept "Apology" without doing dry analysis.
  *   **Hofstadter's Insight:** It demystifies creativity. It shows that "novelty" is just a coordinate change in a multi-dimensional semantic space.

  ## 6. The "Honest Limitation" (For your debrief notes)
  Be prepared to articulate this clearly if they push back:
  *"This activity assumes the conceptual space is fixed (the 5 dials). In Hofstadter's full model, high-level creativity sometimes involves **redesigning the control panel itself**—adding a new knob or realizing two knobs are actually the same. We didn't do that today; we only explored the existing space. Also, real slippage feels like 'noticing,' not 'deciding.' You decided to turn the dial. In a moment of insight, the dial turns itself."*
