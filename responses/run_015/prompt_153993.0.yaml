answer: |-
  *   **Maya 1 (Mostly Right):** She correctly identifies illusionism as eliminativism regarding qualia. However, "illusion" isn't incoherent if virtual properties seem real without existing. Her self-refutation point is the standard objection, but illusionists argue introspective *seemings* suffice for reasoning.
  *   **Leo 1 (Mostly Right):** He correctly distinguishes access consciousness (reporting) from phenomenal consciousness (feeling). The bent stick analogy is the canonical defense: real stimulus, false property.
  *   **Maya 2 (Right):** This is the strongest critique. Perceptual illusions involve real sensory input misinterpreted. If qualia don't exist, there's no input to misinterpret, only a false judgment. This pushes illusionism toward error theory rather than perceptual illusion.
  *   **Leo 2 (Mostly Right):** He repairs the analogy by making the self-model the "stick." A real physical state represents itself falsely. This maintains the illusion structure (real vehicle, false content).

  **What Both Miss:**

  *   **Phenomenal Concepts:** They skip whether concepts are *empty* (refer to nothing) or *misapplied* (refer to physical states). Illusionism needs empty concepts to eliminate qualia, but misapplied ones to explain the illusion's grip. If concepts are empty, how do we conceive the illusion at all?
  *   **Self-Refutation:** Maya assumes logic requires qualia; Leo assumes it requires only access. The unresolved issue is whether denying experience presupposes the very phenomenology being denied. Illusionists argue the *seeming* is real, even if the *property* isn't, but Maya challenges whether a "seeming" without qualities is coherent.
