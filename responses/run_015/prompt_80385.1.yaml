answer: |-
  **Research Proposal**

  **Title:** Disaggregating the Boundary Problem: Franchise Eligibility versus Jurisdictional Legitimacy

  **1. The Research Question**

  The central question of this paper is: **Does distinguishing between the franchise boundary (who votes) and the jurisdictional boundary (who is bound by the decision) resolve the theoretical incoherence often attributed to the "all-affected" principle in democratic theory?**

  Standard formulations of the boundary problem ask a single question: "Who belongs to the demos?" This proposal argues that this question is overdetermined because it conflates two distinct normative issues. The first is the *composition question*: Who possesses the right to participate in collective decision-making (the input side)? The second is the *legitimacy question*: Who must be accounted for in the decision-making process for the outcome to be binding (the output side)?

  The paper will seek a determinate answer to the following subsidiary question: **Can the "all-affected" principle be rehabilitated as a criterion for jurisdictional legitimacy, even if it is rejected as a criterion for franchise eligibility?** If successful, the project will demonstrate that the "unbounded demos" objection fails against the all-affected principle when that principle is applied to jurisdiction rather than voting, provided that the jurisdictional boundary properly contains the franchise boundary.

  **2. Existing Positions and the Conflation Hypothesis**

  The literature on the boundary problem typically presents four competing solutions, though there is significant contestation regarding their definitions and implications. This paper will proceed on the basis of the following widely recognized, though not universally accepted, characterizations:

  *   **The Territorial Principle:** Membership is determined by residence within a fixed geographic space. While operationally clear, critics argue this fails to account for externalities (those outside the border affected by decisions) and arbitrarily excludes non-resident citizens.
  *   **The Civic Principle:** Membership is determined by pre-existing legal status (citizenship). Defenders argue this preserves stability; critics argue it is circular, as it uses the outcome of the boundary decision (the law) to justify the boundary itself.
  *   **The All-Able-to-Affect (or All-Subjected) Principle:** Membership extends to all those subject to coercion or capable of influencing the outcome. This is often posed as a alternative to the all-affected principle to avoid infinite regress, though it faces its own boundary-definition problems.
  *   **The All-Affected Principle:** Membership extends to all those whose interests are significantly impacted by a decision.

  The central tension in the literature arises from the "unbounded demos" objection. It is commonly argued that because almost any decision can ripple outward to affect someone, somewhere, the all-affected principle requires a global demos for almost every issue, rendering democratic decision-making impossible.

  However, the epistemic status of this objection is contested. Some theorists argue the principle can be limited by thresholding "significant" effects. Others argue the principle is meant to be ideal-theoretic rather than institutional. My proposal rests on the claim that there is a deeper confusion: proponents and critics alike often treat the all-affected principle as a rule for *voting eligibility*.

  The paper will argue that the apparent conflict between the all-affected principle and the all-able-to-affect principle arises because they are being asked to answer the same question when they are suited to different ones. The all-able-to-affect principle is better suited for franchise (managing the input side of a coercive apparatus), while the all-affected principle is better suited for jurisdiction (managing the output side and the moral scope of legitimacy). By treating the all-affected principle as a franchise criterion, the literature invites the unboundedness objection. By treating it as a jurisdictional criterion, the "unbounded" set becomes the set of persons whose interests require representation or accountability, not necessarily the set of persons holding ballots.

  **3. Methodology and Argumentative Strategy**

  The method will be conceptual analysis tested against specific puzzle cases. The argument will proceed in three stages.

  *Stage 1: Conceptual Decomposition*
  I will reconstruct the standard arguments for the all-affected principle to show that their normative force derives from a requirement of *justification to those impacted*, not necessarily a requirement of *authorship by those impacted*. I will argue that democratic legitimacy requires that the jurisdictional boundary (those whose interests justify the decision) be a superset of the franchise boundary (those who vote). The gap between the two is not a defect but a feature, to be managed through mechanisms of accountability, representation, or trusteeship, rather than by expanding the electorate to infinity.

  *Stage 2: Testing Against Puzzle Cases*
  To validate this decomposition, I will apply the framework to three specific cases where the standard view struggles:
  1.  **Non-Resident Workers:** Individuals who work in a jurisdiction and pay taxes but reside elsewhere. Under the territorial view, they are excluded; under the all-affected view, they should vote. My model would classify them as within the jurisdictional boundary (their interests count) but potentially outside the franchise boundary, requiring specific accountability mechanisms rather than full voting rights.
  2.  **Transboundary Environmental Regulation:** Downstream populations affected by upstream pollution. The all-affected principle demands they vote, creating a cross-border electorate. My model suggests they fall within the jurisdictional boundary of the upstream decision, requiring the upstream demos to account for their interests, without necessarily granting them votes in the upstream election.
  3.  **Non-Citizen Residents:** Long-term residents without citizenship. Here, the franchise and jurisdictional boundaries often diverge. I will test whether my decomposition better explains the intuitive wrongness of excluding them from voting while acknowledging they are bound by laws, compared to the standard "all-subjected" arguments.

  *Stage 3: Contingency Planning*
  If the decomposition fails—for instance, if it becomes clear that jurisdiction without franchise inevitably leads to illegitimate domination (taxation without representation)—I will pivot the argument. Instead of claiming this solves the boundary problem, I will argue that it reveals a tragic remainder in democratic theory: that perfect congruence between those who vote and those who are affected is impossible, and we must choose between over-inclusive electorates (inefficiency) or under-inclusive electorates (potential injustice). The paper would then assess which error is less normatively costly.

  **4. Success and Failure Conditions**

  **Success:**
  The project succeeds if it demonstrates that the "unbounded demos" objection loses its force when the all-affected principle is relocated from the question of franchise to the question of jurisdiction. A successful result will show that:
  1.  The distinction between input (franchise) and output (jurisdiction) is normatively coherent.
  2.  Standard objections to the all-affected principle rely on category mistakes regarding this distinction.
  3.  The proposed model offers a more nuanced explanation of the puzzle cases than the competing territorial or civic principles.

  **Failure:**
  The project fails if:
  1.  The distinction between franchise and jurisdiction collapses upon analysis (e.g., if legitimate jurisdiction necessarily requires universal franchise among the affected).
  2.  The "superset" model creates insurmountable problems of accountability (e.g., if representing non-voters is conceptually impossible).
  3.  The decomposition merely renames the problem without offering a criterion for where the jurisdictional boundary should be drawn.

  **5. Scope and Feasibility Assessment**

  This paper is designed for a one-semester graduate seminar with a target length of roughly 7,000 words. Given this constraint, several scope limitations are necessary to ensure feasibility.

  *   **What is Included:** The core conceptual argument distinguishing franchise from jurisdiction will receive the majority of the word count (approximately 3,500 words). The three puzzle cases will be treated briefly as illustrative tests rather than deep empirical case studies (approximately 2,000 words combined). The introduction and conclusion will frame the problem and summarize implications (approximately 1,500 words).
  *   **What is Excluded:**
      *   **Historical Genealogy:** I will not trace the history of the boundary problem from Rousseau or Dahl to the present. I will refer to contemporary arguments by their content rather than their lineage.
      *   **International Law:** While the puzzle cases touch on cross-border issues, I will not engage with the specifics of international legal regimes or human rights law, keeping the analysis strictly within normative political philosophy.
      *   **Specific Author Engagement:** I will not dedicate space to exegesis of specific theorists. Positions will be referred to descriptively (e.g., "proponents of the territorial principle") to save space for argumentation.
      *   **Institutional Design:** I will not propose specific institutional mechanisms for how non-voters are represented (e.g., ombudsmen, proxy voting). The paper will argue for the *requirement* of such mechanisms without designing them.

  **Risk Management:**
  The primary risk is that the distinction between franchise and jurisdiction is already well-trodden ground. If preliminary research indicates this distinction is consensus rather than innovation, I will narrow the scope to focus exclusively on the rehabilitation of the "all-affected" principle against the "unboundedness" objection, using the distinction merely as a tool rather than the main contribution. Conversely, if the distinction proves too radical (i.e., if jurisdiction without franchise is deemed inherently illegitimate), I will shift focus to the "failure mode" outlined in the methodology, analyzing the tragic trade-offs of democratic boundary setting.

  This scope ensures the paper remains a focused philosophical argument rather than a broad survey, fitting the constraints of a semester-length seminar paper.
