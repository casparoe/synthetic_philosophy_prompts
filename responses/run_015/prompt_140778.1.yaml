      *   *Option C (Keep with Conditions):* This is the most nuanced and actionable path. It addresses the consent issue (Case 1) and establishes a principled boundary for Case 2 without relying solely on "harm to the child."
      *   *Decision:* Recommend continuing PGT for late-onset conditions *but* revising consent language to reflect the "selection" rather than "prevention" model. For Case 2 (Deaf couple), recommend a "No" based on the clinic's mission to promote health/well-being, not specific cultural traits, acknowledging the asymmetry but grounding it in medical mission rather than child harm.
      *   *Refinement:* Actually, the prompt asks for *one* concrete course. I need to tie the two cases together. The core tension is the justification for selection. If we admit we aren't "sparing" the child (Case 1), we must admit we are satisfying parental reproductive autonomy/interests. If that's the justification, does it allow selecting *for* deafness (Case 2)? Most clinics would say no. So the policy needs to clarify *why* we select against disease if not to benefit the child.
      *   *Selected Path:* Continue PGT for serious late-onset conditions. Deny the request to select for deafness. Update consent forms to remove "prevention/sparing" language. This resolves Case 1's complaint (truth in advertising) and resolves Case 2 (consistency based on medical mission, not child welfare).

