answer: |-
  **TO:** Ethics Committee
  **FROM:** [Your Name], Non-Clinician Member
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Recommendation regarding PGT Selection and Consent Language

  **Purpose**
  This memo addresses the impasse regarding Preimplantation Genetic Testing (PGT) for late-onset conditions and the concurrent request from a deaf couple to select for a specific genetic variant. We face a logical inconsistency: if selecting against a disease does not benefit the resulting child (because the alternative is non-existence), we cannot consistently claim it harms a child to select for a disability. However, approving the latter contradicts our medical mission. I recommend we continue offering PGT for serious late-onset conditions under revised consent protocols and deny the request to select for deafness.

  **The Ethical Tension**
  The complaint in Case 1 rests on a sound logical premise: embryo selection is not treatment. When we transfer an embryo without a Huntington's variant instead of one with it, we do not spare the resulting child from Huntington's. We simply ensure that the child who exists is not the one who would have had it. The alternative for that specific child is never having been born. Therefore, our current consent language suggesting we "prevent disease in your child" is technically inaccurate. We are preventing the existence of a child with that disease.

  **The Strongest Case for Status Quo**
  Committee members arguing against changing policy contend that this distinction is clinically irrelevant and potentially harmful. Their position is that "sparing your child" is a necessary shorthand for reproductive autonomy. Patients come to us to avoid suffering; telling them they are merely swapping potential identities may cause existential distress without altering the clinical outcome. Furthermore, they argue that drawing a hard line between "selection" and "prevention" invites regulatory scrutiny that could jeopardize PGT access entirely. From this view, ethical precision should not override patient comfort or operational stability. If the outcome is a healthy child, the philosophical justification is secondary.

  **Recommendation**
  While the status quo argument prioritizes patient comfort, it relies on a factual inaccuracy that leaves us vulnerable in cases like Case 2. If our justification for PGT is "preventing harm to the child," we cannot logically deny the deaf couple's request, as the child selected for deafness is not harmed by being born deaf rather than not being born at all. To maintain a consistent ethical framework, we must shift our justification from *child welfare* to *parental reproductive autonomy within medical bounds*.

  We should continue offering PGT for serious, late-onset conditions. However, we must acknowledge that we are facilitating parental choice regarding which embryo to implant, not treating a future patient. This shift allows us to deny the deaf couple's request not on the grounds of harm to the child, but on the grounds of medical indication. Our clinic's mandate is to mitigate pathology, not to curate cultural identity. Selecting *against* a degenerative neurological condition aligns with the medical model of reducing suffering. Selecting *for* deafness, while culturally valid for the parents, falls outside the clinical scope of treating pathology.

  **Decision on Case 2**
  **No.** We will not facilitate selection for the deafness variant. This is not because the resulting child would be harmed (by the logic of Case 1, they would not be), but because the request does not meet the clinical criteria for medical intervention. We select against conditions that constitute significant health burdens, not for traits that constitute cultural identity.

  **Implementation Plan**
  1.  **Consent Revision:** We must update our informed consent documents to reflect the "selection" model rather than the "prevention" model. This protects the clinic from the complaint in Case 1 and clarifies the boundary for Case 2.
  2.  **Timeline:** Legal review to begin immediately. New forms to be implemented by the start of Q2 (April 1). Counseling staff training on new scripting to occur in March.
  3.  **Counseling Protocol:** Counselors must avoid comparative phrasing ("spare your child") in favor of descriptive phrasing ("choose an embryo without this variant").

  **Proposed Consent Language**
  *Replace current "Prevention of Disease" section with:*

  > "Preimplantation Genetic Testing allows for the selection of embryos based on genetic status. You should understand that this process does not treat or cure an existing embryo. Rather, it provides information that allows you to choose which embryo to transfer. Selecting an embryo without a specific genetic variant means that the resulting child will not have that variant. It does not mean that a different child was 'saved' from the condition; rather, it means you have chosen to initiate a pregnancy with an embryo that does not carry the variant. The Clinic permits selection against serious medical conditions but does not permit selection for traits or disabilities that do not constitute a direct threat to life or major bodily function."

  **Conclusion**
  Adopting this policy resolves the logical symmetry between our two cases. We acknowledge that we do not harm the child in Case 1 by selecting against disease, but we also acknowledge that we are not obligated to select for traits in Case 2. By grounding our policy in accurate descriptions of the technology and a clear definition of medical pathology, we protect the clinic from ethical inconsistency while maintaining access to testing for families seeking to avoid serious illness.

  I move that we adopt this framework for discussion at the next meeting.
