prompt: |-
  I am the permanent rapporteur — I keep the record, draft the text, and write the one-page note that goes out with each draft — of the standing drafting committee of a coalition of six membership organisations that issues joint position statements on health and social policy. Our members disagree not about the facts but about what matters: a public-health association that aggregates population welfare; a patient-choice advocacy organisation organised around individual autonomy; a professional association of clinicians whose commitments are role-based (non-abandonment, professional integrity); a disability-rights organisation concerned with equal standing; a network of faith-based hospitals and hospices bound by teaching on the sanctity of life; and a health-economics institute committed to cost-effectiveness. We publish eight to ten statements a year. They are quoted in regulatory consultations and in parliamentary evidence, and a member declining to sign is a public event; two withdrawals in three years have led our funders to ask what a joint voice is worth.

  I have read a little of the philosophical discussion of compromise between value systems — the suggestion that parties who rank outcomes differently can each do better by their own lights under an agreed package than they would under no statement at all, in something like the way parties with different endowments each gain from trade. What I need is not more of that, but a procedure I can actually run.

  The constraints are real. I get one ninety-minute session with the six representatives and one two-week written round. The representatives are senior policy professionals with no philosophical training, and none of them will read anything longer than a page. The chair rotates among the members, so I cannot rely on a neutral arbiter. Every member has a named representative who must personally sign, and I am the one who has to tell a member that the text it is being asked to sign is not one it can defend to its own constituency.

  Please give me the following.

  An ordered set of questions to run on a proposed package — the joint text as a whole, not clause by clause in isolation — with a statement, for each question, of what counts as a sufficient answer, which answers stop the procedure with a no, and which hand the decision to a person because it turns on values rather than on facts. The questions have to be answerable in the session by a non-specialist in a few minutes each.

  Alongside it, a classification of the moves a concession can consist in, since I think the kind of concession matters more than its size. My own rough distinction is between conceding that one's principle does not reach this case, conceding that it carries less weight here than one claimed, conceding that someone else should decide, and leaving the words open so that each member can read them its own way. Correct, refine, or replace this: I want to know which of these distinctions has to survive into a one-page procedure and which can be dropped without loss.

  A test that works across statements rather than within one. Members make small concessions repeatedly, and I suspect that a run of individually defensible concessions can carry the coalition somewhere none of the members would have endorsed at the start, without any single step being the one to blame. I keep a record of every concession by member and by kind; tell me what to do with it, and what to check when the same member has conceded more than once in the same way.

  Two further complications the procedure has to survive. First, the same sentence is a different act for different members: for one it is a policy recommendation, for another it is an act of institutional witness that its own authority will judge, so identical words do not cost them the same. Second, some of our representatives have learned that declaring a red line early is rewarded; if the procedure simply asks each member where its limits are, it will be gamed, and I have no way to verify what a member tells me about its own thresholds.

  Then apply the procedure to three cases I have in front of me, showing where it stops and why:

  1. A statement on a national screening programme: automatic enrolment with an opt-out, which the public-health association wants and the patient-choice organisation resists; a duty-to-advise clause the clinicians want; a guarantee of accessible invitation formats the disability-rights organisation wants; and a cost-effectiveness threshold the health-economics institute wants, which would exclude one age band the public-health association cares about.

  2. A statement on assisted dying for a parliamentary consultation, where the faith-based network cannot sign anything that implies permissibility and the patient-choice organisation wants an endorsement of access.

  3. A statement on automated eligibility decisions in welfare, where the concession being asked of the patient-choice organisation is small and, taken alone, defensible — but it is the fourth concession of the same kind it has made in two years, and the regulator's consultation closes in three weeks.

  I would expect the third to be the one where the procedure tells me something I do not want to hear; say plainly what that is and what I should do with it. Finally, tell me what the procedure cannot do: which of my problems it will leave exactly as it found them.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Permanent Rapporteur of a standing drafting committee (6 membership orgs).
      *   **Task:** Create a *procedure* to manage value conflicts in joint position statements.
      *   **Context:** 6 diverse members (Public Health, Patient Choice, Clinicians, Disability Rights, Faith-Based, Health Economics). High stakes (parliamentary evidence, funding risks).
      *   **Constraints:** 90-min session + 2-week written round. No philosophical training. 1-page max reading. Rotating chair (no neutral arbiter). Named signatories (personal risk).
      *   **Deliverables:**
          1.  Ordered set of questions for the package (with pass/fail/escalation criteria).
          2.  Classification of concession types (refine the user's rough distinction).
          3.  Longitudinal test (across statements) to prevent "death by a thousand cuts."
          4.  Handling complications: Differential cost of words & gaming red lines.
          5.  Application to 3 specific cases (Screening, Assisted Dying, Automated Welfare).
          6.  Limitations (what the procedure *cannot* fix).

  2.  **Analyze the Core Problem:**

      *   This isn't just about negotiation; it's about *legitimacy* and *integrity*.
      *   The "trade" model (compromise for mutual gain) is insufficient because some values are non-fungible (e.g., Sanctity of Life vs. Autonomy).
      *   The Rapporteur is the linchpin but lacks authority.
      *   The procedure must be robust against gaming and drift, yet simple enough for busy professionals.

  3.  **Drafting the Procedure (The "Questions"):**

      *   *Goal:* Filter out unmanageable conflicts early without getting bogged down in semantics.
      *   *Constraint:* Must be answerable in minutes by non-specialists.
      *   *Structure:* Needs to move from "Can we live with this?" to "Does this break us?"
      *   *Question 1: Consistency.* Does this contradict your org's public stance? (Fact/Policy check).
      *   *Question 2: Cost.* What does signing cost you internally? (Value check).
      *   *Question 3: Precedent.* Does this set a trajectory you can't sustain? (Longitudinal check).
      *   *Decision Rules:*
          *   "Yes" = Proceed.
          *   "No" = Stop (Veto).
          *   "It depends on interpretation" = Escalate to specific wording negotiation.
          *   "It depends on our values" = Escalate to the representative (since the Rapporteur can't judge values).

  4.  **Refining Concession Types:**

      *   *User's Draft:* Principle doesn't reach, carries less weight, delegate decision, ambiguous wording.
      *   *Critique:* "Ambiguous wording" is dangerous (creates future conflict). "Delegate decision" is rare in joint statements.
      *   *Refinement:*
          1.  **Scope Limitation:** "Our principle applies, but not *here*." (Safe).
          2.  **Priority Shift:** "Our principle applies, but is outweighed by X *in this context*." (Risky, creates precedent).
          3.  **Procedural Deferral:** "We agree on the process, not the outcome." (Good for deadlock).
          4.  **Constructive Ambiguity:** "We use words both sides can accept for different reasons." (High risk, needs tracking).
      *   *Selection for 1-pager:* Keep Scope and Priority. Merge Deferral/Ambiguity into "Wording Strategy." The key distinction is *Principle vs. Weight*.

  5.  **Developing the Longitudinal Test (The "Drift" Check):**

      *   *Problem:* Accumulation of small concessions leads to mission drift.
      *   *Solution:* A "Concession Ledger."
      *   *Mechanism:* Track concession *type* per member over time.
      *   *Trigger:* If a member makes the *same type* of concession (e.g., Priority Shift on Autonomy) 3 times in 12 months, flag it.
      *   *Action:* Requires a "Reset Clause" – explicit acknowledgment that this is a deviation, not a new norm.

  6.  **Addressing Complications:**

      *   *Differential Cost:* A sentence might be policy for one, witness for another.
      *   *Fix:* The "Internal Cost" question (Question 2 above) must explicitly ask: "Is this text advisory or constitutive for you?"
      *   *Gaming Red Lines:* If everyone claims everything is a red line, nothing moves.
      *   *Fix:* Don't ask "Where is your red line?" Ask "What specific text forces withdrawal?" (Text-specific vs. Principle-specific). Also, use the Longitudinal Test to punish frequent "red line" claims that turn out to be negotiable later (credibility cost).

  7.  **Applying to Cases:**

      *   *Case 1 (Screening):* Conflict between Public Health (Utilitarian) and Patient Choice (Autonomy) + Economics (Efficiency).
          *   *Friction:* Cost threshold excludes age band.
          *   *Procedure Check:* Public Health must concede on "Priority Shift" (Efficiency > Coverage). Economics must concede on "Scope" (Threshold doesn't apply to equity mandates).
          *   *Outcome:* Likely passes if "Scope Limitation" is used for the age band (e.g., "subject to local equity review").
      *   *Case 2 (Assisted Dying):* Faith (Sanctity) vs. Choice (Autonomy).
          *   *Friction:* Permissibility vs. Access.
          *   *Procedure Check:* This is a "Value Clash," not a policy tweak.
          *   *Outcome:* **STOP.** No wording bridges Sanctity of Life and Right to Die. Procedure should flag this as a "Fundamental Incompatibility." Joint statement impossible without fracturing.
      *   *Case 3 (Automated Welfare):* Patient Choice making 4th concession on Autonomy.
          *   *Friction:* Small concession now, but pattern of drift.
          *   *Procedure Check:* Longitudinal Test triggers.
          *   *Outcome:* **STOP/WARN.** Even if defensible now, the *pattern* is unsustainable. The Rapporteur must tell the rep: "You can sign this, but you must issue a dissenting footnote or public clarification to reset the baseline."

  8.  **Defining Limitations:**

      *   What can't a procedure do?
      *   It can't create trust.
      *   It can't stop a member from leaving if their values truly shift.
      *   It can't replace the need for political courage.
      *   It can't fix the "Rotating Chair" neutrality problem entirely (though it helps).

  9.  **Review and Refine:**

      *   *Tone:* Professional, pragmatic, authoritative but humble (Rapporteur to Rapporteur).
      *   *Length:* Needs to be dense but readable.
      *   *Check:* Did I answer the specific prompt about "what counts as a sufficient answer"? Yes.
      *   *Check:* Did I address the "gaming" issue? Yes, via text-specificity and longitudinal tracking.
      *   *Check:* Is the 1-page constraint respected in the *design* of the procedure (even if my explanation is longer)? I need to make sure the *output* provided to the user is structured so they can extract the 1-pager.

  10. **Final Polish:** Ensure the distinction between "Fact/Policy" and "Value" is clear in the questions. Ensure the "Stop" conditions are unambiguous. (Self-Correction: Make sure the "Longitudinal Test" is actionable for the Rapporteur, not just theoretical).

  *(Self-Correction during drafting Case 2)*: Assisted Dying is the classic "intractable" case. The procedure *must* identify this early to save the 90 minutes. The question set needs a "Fundamental Compatibility" filter.
  *(Self-Correction during drafting Case 3)*: The user expects the procedure to say something they "do not want to hear." That means the procedure must recommend *blocking* or *conditioning* the statement despite the immediate pressure. I need to be explicit about that.

  11. **Final Output Structure:**
      *   Introduction (Acknowledging the role).
      *   Part 1: The 90-Minute Protocol (The Questions).
      *   Part 2: Concession Taxonomy.
      *   Part 3: The Longitudinal Drift Test.
      *   Part 4: Handling Complications (Cost & Gaming).
      *   Part 5: Case Applications.
      *   Part 6: Limitations.

  Let's write it.cw
answer: |-
  This is a procedural design task for a high-stakes, value-pluralist environment. You need a mechanism that functions as a circuit breaker, not a consensus engine. It must protect the coalition's integrity without demanding philosophical literacy from the participants.

  Here is the procedure, the taxonomy, the longitudinal test, and the application to your cases.

  ### Part 1: The 90-Minute Protocol (The Questions)

  This is the script you run during the session. It treats the draft text as a single object. Do not debate clauses. Ask these four questions in order.

  **Q1. The Consistency Check (Fact/Policy)**
  *   **Question:** "Does any sentence in this draft contradict a public position your organisation has formally adopted in the last 24 months?"
  *   **Sufficient Answer:** "No," or "Yes, but that position is under review."
  *   **Stop Condition:** "Yes, and that position stands." (This is a veto. Do not negotiate wording; the text is dead for this member).
  *   **Escalation:** If the answer is "It depends on how the regulator interprets it," move to Q4.
  *   **Rationale:** This filters out factual contradictions before engaging values.

  **Q2. The Internal Cost Check (Value/Authority)**
  *   **Question:** "For your organisation, is signing this text an *advisory* act (recommending policy to others) or a *constitutive* act (witnessing to your own institutional identity)?"
  *   **Sufficient Answer:** "Advisory" or "Constitutive."
  *   **Stop Condition:** If a member says "Constitutive" and another member says "Advisory" regarding the *same sentence*, and the "Constitutive" member objects. (You cannot compromise on identity).
  *   **Escalation:** If all say "Advisory," proceed. If mixed, the text must be split or qualified (see Concession Taxonomy).
  *   **Rationale:** This addresses your complication regarding differential cost. It forces the member to admit if the text binds their own soul or just their policy lobby.

  **Q3. The Precedent Check (Longitudinal)**
  *   **Question:** "If this exact phrasing appeared in a statement two years from now, would you still sign it?"
  *   **Sufficient Answer:** "Yes."
  *   **Stop Condition:** "No." (This indicates a temporary expediency that risks long-term drift).
  *   **Escalation:** "Only if X condition is met." (Record X as a 'Scope Limitation' concession).
  *   **Rationale:** This mitigates the "death by a thousand cuts" problem in real-time.

  **Q4. The Withdrawal Cost (Strategic)**
  *   **Question:** "If you do not sign this, will you publicly oppose it, or merely abstain?"
  *   **Sufficient Answer:** "Abstain."
  *   **Stop Condition:** "Publicly Oppose." (If a member will actively campaign against the coalition's statement, the joint voice is broken. The statement should not issue).
  *   **Rationale:** A joint statement is worthless if a signatory undermines it. This distinguishes between *non-participation* and *hostility*.

  ---

  ### Part 2: Concession Taxonomy

  Your rough distinction is close, but "leaving words open" is a trap that creates future conflict. For a one-page procedure, you need to distinguish concessions by their **binding power**.

  **Refined Classification:**

  1.  **Scope Limitation (Safe):** "Our principle holds, but *not in this specific context*."
      *   *Example:* Clinicians agree to cost thresholds *only for screening*, not for acute care.
      *   *Procedure Status:* **Keep.** This is the safest concession. It preserves the principle while allowing the deal.
  2.  **Priority Shift (Risky):** "Our principle holds, but is *outweighed* by another value here."
      *   *Example:* Patient Choice accepts automatic enrolment because Public Health urgency is higher *this time*.
      *   *Procedure Status:* **Track.** This sets a precedent. If used repeatedly, it erodes the principle.
  3.  **Procedural Deferral (Neutral):** "We agree on the *process* for deciding, not the outcome."
      *   *Example:* "Eligibility should be determined by a committee including patient reps."
      *   *Procedure Status:* **Keep.** Useful for deadlock, but kicks the can down the road.
  4.  **Constructive Ambiguity (Dangerous):** "We use words each side interprets differently."
      *   *Example:* "Dignity in care."
      *   *Procedure Status:* **Drop/Flag.** Do not allow this without a "Sunset Clause" (this phrasing expires in 12 months). It stores conflict for the future Rapporteur (you).

  **For the One-Page Procedure:**
  Retain **Scope Limitation** and **Priority Shift**. Drop the others or subsume them under "Wording Qualifiers." The critical distinction is: *Did we carve out an exception (Scope), or did we admit our value is weaker (Priority)?* Only the latter requires longitudinal tracking.

  ---

  ### Part 3: The Longitudinal Drift Test

  You keep a record. Here is how to use it. You are looking for **Patterned Erosion**.

  **The Rule of Three:**
  If a single member makes a **Priority Shift** concession on the *same core value* (e.g., Patient Choice on Autonomy) **three times within four statements**, the procedure triggers a **Reset**.

  **What to check:**
  1.  **Value Tag:** Tag every concession by the core value it touches (Autonomy, Equity, Sanctity, Efficiency).
  2.  **Direction:** Is the concession always in the same direction? (e.g., Autonomy always yielding to Efficiency).
  3.  **Context:** Was the context different each time? (Screening vs. Treatment vs. Welfare).

  **The Action:**
  If the Rule of Three triggers:
  1.  You must inform the representative *before* the 90-minute session: "You have conceded on Autonomy three times. Signing this fourth text establishes a new baseline. Do you intend to reset your public position, or do you need a dissenting footnote?"
  2.  If they sign without resetting, you attach a confidential memo to the file noting the drift. If they withdraw later, you have the record to show funders that the coalition managed integrity, even if the member left.

  ---

  ### Part 4: Handling Complications

  **1. Differential Cost (Policy vs. Witness)**
  This is handled by **Q2 (Internal Cost Check)** in the Protocol.
  *   *Procedure:* If Member A says "This is Witness" and Member B says "This is Policy," you cannot merge them into one sentence.
  *   *Fix:* Split the paragraph. "Member A affirms X as a moral duty. Members B-F recommend X as best practice."
  *   *Why:* It prevents Member A from being compromised by Member B's pragmatism.

  **2. Gaming Red Lines**
  Members learn that screaming "Red Line" early gets them concessions.
  *   *Procedure:* Do not ask for red lines in the abstract. Ask for **Text-Specific Vetoes** (Q1).
  *   *Mechanism:* If a member claims a red line during the session, they must identify the *exact phrase*. If they cannot, it is not a red line; it is a negotiation position.
  *   *Penalty:* If a member claims a red line, blocks the text, but then signs a later text with the same phrase (perhaps tweaked), you flag this in the Longitudinal Record as "Credibility Loss." Inform the Chair. This social cost discourages gaming.

  ---

  ### Part 5: Application to Cases

  Here is where the procedure stops the machine, and why.

  **Case 1: National Screening Programme**
  *   **Conflict:** Public Health (Enrolment) vs. Patient Choice (Opt-out) vs. Economics (Threshold excludes age band).
  *   **Protocol Run:**
      *   Q1 (Consistency): Patient Choice may have a formal policy on "Informed Consent." If automatic enrolment contradicts this, **STOP**.
      *   Q2 (Cost): Public Health views this as Advisory (policy rec). Patient Choice may view it as Constitutive (rights).
      *   Q3 (Precedent): Economics wants a threshold. Public Health must concede a **Priority Shift** (Efficiency > Coverage for this band).
  *   **Outcome:** **Proceed with Qualification.**
      *   *Fix:* Use **Scope Limitation**. "Automatic enrolment is recommended *subject to* accessible opt-out mechanisms (satisfying Choice) and *subject to* equity reviews for excluded age bands (satisfying Public Health/Disability)."
      *   *Why:* The text survives because the concessions are Scope Limitations, not Principle Surrenders.

  **Case 2: Assisted Dying**
  *   **Conflict:** Faith (Sanctity/Permissibility) vs. Patient Choice (Access/Endorsement).
  *   **Protocol Run:**
      *   Q1 (Consistency): Faith-based network likely has a doctrinal prohibition.
      *   Q2 (Cost): For Faith, this is **Constitutive** (Witness). For Choice, it is **Advisory** (Policy).
      *   *Crucial Failure:* You cannot have a joint sentence where one member witnesses "Killing is wrong" and another recommends "Access to killing."
  *   **Outcome:** **STOP.**
      *   *Why:* Q2 reveals a Fundamental Incompatibility. One party treats the text as Identity, the other as Policy. No wording bridges this.
      *   *Action:* Issue two separate statements or a "Note of Disagreement." Do not force a joint text. It will fracture the coalition publicly.

  **Case 3: Automated Eligibility (Welfare)**
  *   **Conflict:** Patient Choice asked for small concession (4th in 2 years). Regulator deadline looms.
  *   **Protocol Run:**
      *   Q1 & Q2: Pass. The text is defensible in isolation.
      *   Q3 (Longitudinal): **TRIGGER.** This is the 4th Priority Shift on Autonomy.
  *   **Outcome:** **STOP / WARN.**
      *   *What the procedure tells you that you don't want to hear:* **You cannot clear this text for signature without a public reset.**
      *   *Why:* Even if the concession is small *now*, the *trajectory* means Patient Choice no longer has a distinct voice on autonomy in this coalition. They are becoming a rubber stamp.
      *   *Action:* Tell the Representative: "You can sign this, but per the Drift Test, you must issue a accompanying press note clarifying that this does not alter your core stance on algorithmic autonomy." If they refuse, advise them to withdraw to preserve their brand. If they sign silently, the coalition loses its value pluralism (becoming monolithic), which funders will eventually notice.

  ---

  ### Part 6: Limitations (What the Procedure Cannot Do)

  Be clear with yourself about where this tool fails.

  1.  **It Cannot Create Trust:** If the Faith member believes the Patient Choice member is lying about their intent, no question set will fix that. The procedure manages *recorded* integrity, not *interpersonal* trust.
  2.  **It Cannot Save the Coalition from Irrelevance:** If the value gaps widen (e.g., on AI or Bioethics), the procedure will simply generate more "STOP" outcomes. It diagnoses the fracture; it does not heal it.
  3.  **It Cannot Protect You from the Chair:** A rotating Chair can still override your procedural advice in the room. You can only record that they did so.
  4.  **It Cannot Prevent Strategic Withdrawal:** A member may decide that *withdrawing* is more valuable to their constituency than *signing*. The procedure validates that choice, but it cannot stop the funding risk you mentioned.
  5.  **It Cannot Solve the "One-Page" Paradox:** Senior professionals may still claim they need more time to read the implications. The procedure forces a decision, but it cannot force *understanding*.

  **Final Advice:**
  Your power lies in the **Record**. When a member complains later that "we never agreed to that," your minutes on the Concession Taxonomy and the Longitudinal Test are your shield. Use the procedure not to force agreement, but to make disagreement explicit, documented, and defensible.
