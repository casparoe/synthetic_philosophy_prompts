      *   *Compute vs. Axioms:* This is a crucial distinction in formal systems. More compute doesn't change the set of provable theorems (in the limit), just how fast you find them. More axioms *does* change the set of provable theorems (and potentially consistency).
      *   *Prisoner's Dilemma (PD):* This refers to FairBot/PrudentBot style reasoning (Modal Fixed Points). $A$ cooperates if it proves $B$ cooperates. $B$ cooperates if it proves $A$ cooperates. Löb's theorem actually makes this *work* (cooperation is provable). Why the asymmetry?
