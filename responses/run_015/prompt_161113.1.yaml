  2.  **Initial Brainstorming & Fact-Checking:**

      *   *Löb's Theorem:* $\square(\square P \to P) \to \square P$. Roughly: You can only prove $P$ if you can prove that provability implies truth. You can't prove $\forall P, \square P \to P$ (Soundness).
