answer: |-
  This is a translation task between two formal systems: Metaphysics (natural language ontology) and Programming Language Theory (formal syntax/semantics). The friction you feel is expected; PLT is largely engineering-oriented (constructive, nominalist-leaning), while the Problem of Universals is ontological (descriptive, realist-leaning).

  Here is the translation, residue analysis, and case study.

  ### 1. Restatement of Positions in PLT Vocabulary

  In PLT, a **Type** is the closest analogue to a **Universal**. A **Term/Value** is a **Particular**. The **Type System** is the **Ontology**.

  | Philosophical Position | PLT Restatement | Mapping Quality |
  | :--- | :--- | :--- |
  | **Ante Rem Realism** (Platonic) | **Global Nominal Signatures.** Types are declared in a global environment $\Gamma$ prior to any term construction. A term $t$ is well-typed only if it explicitly references the type identifier $T$ declared in $\Gamma$. The type $T$ exists in the environment even if no term $t:T$ is ever constructed. | **Convenience.** Matches the "declaration before use" discipline. However, in PLT, signatures are stipulated by the programmer, whereas Ante Rem posits discovery of mind-independent entities. |
  | **In Re Realism** (Aristotelian) | **Structural Typing / Refinement Types.** A type $T$ is defined as the set (or predicate) of all terms $\{ t \mid \phi(t) \}$ that share a specific structure or behavior. The "universal" has no existence independent of the terms that inhabit it, but it is a genuine abstraction over them. | **Genuine Match.** The type is the common structure extracted from the particulars. |
  | **Trope Theory** | **Singleton / Generative Types.** Every particular $t$ has its own unique type $\{t\}$. "Redness" is not a shared type, but a **Type Class** or **Interface** that distinct singleton types implement. Each implementation is a distinct dictionary/value, even if they behave similarly. | **Genuine Match.** Captures the particularization of properties. The "universal" is reduced to a interface constraint on unique types. |
  | **Resemblance Nominalism** | **Equivalence Relations / Metric Spaces.** There are no types. There are only terms and a binary relation $\approx$ (or distance metric $d$). We say $t_1, t_2$ are "red" iff $d(t_1, t_2) < \epsilon$. No central type definition exists; only pairwise comparisons. | **Distortion.** PLT usually requires a type for inference. A system based purely on pairwise resemblance without a prototype is computationally expensive and lacks a "checking" anchor. |
  | **Predicate (Ostrich) Nominalism** | **Type Erasure / Comments.** Types are syntax only. They exist in the source code for human convenience or compile-time checking but are erased before runtime. There is no semantic object corresponding to "Red"; there is only the string `"Red"`. | **Genuine Match.** Denies ontological weight to the type. |
  | **Sparse vs. Abundant** | **Decidability / Canonical Forms.** **Abundant:** Any predicate defines a valid type (e.g., Refinement Types $\{x:Int \mid x > 5\}$). **Sparse:** Only types with efficient canonical forms or decidable inhabitation are admitted (e.g., only base types and algebraic data types). | **Genuine Match.** Maps directly to the trade-off between expressiveness and decidability in type system design. |

  **Warning on Terminology:** Do not confuse **Nominal Typing** (PLT) with **Nominalism** (Philosophy).
  *   **PLT Nominal Typing:** Types are distinct entities identified by name. (Closer to *Ante Rem Realism*).
  *   **Philosophical Nominalism:** Types are *not* entities; only names exist. (Closer to *Predicate Nominalism/Erasure*).

  ---

  ### 2. Residue Report

  Here is what is lost, distorted, or inexpressible in the translation.

  **Clean Translations:**
  *   **Trope Theory $\to$ Singleton Types:** This is the strongest mapping. Generative types (e.g., `new Lock()` creates a unique type) perfectly model particularized properties.
  *   **Predicate Nominalism $\to$ Erasure:** The idea that types are useful fictions that vanish upon execution maps cleanly to runtime erasure.

  **Distortions & Inexpressibles:**
  *   **The Mode of Existence:** PLT assumes the formal system exists. It cannot model the question "Do types exist *outside* the system?" PLT is internalist; Metaphysics is externalist.
  *   **Normativity:** In PLT, types are normative (they restrict what terms *can* be). In Metaphysics, universals are often descriptive (they describe what particulars *are*).

  **The Three Sticking Points:**

  **(a) Numerical Identity vs. Structural Similarity**
  *   *The Worry:* Realists claim the Redness in apple $A$ is *numerically identical* to the Redness in apple $B$. PLT structural typing says $A$ and $B$ are *equivalent* under type $T$.
  *   *Verdict:* **Collapse.** PLT cannot express numerical identity of properties across terms. In PLT, if two terms have the same type, they are extensionally equivalent regarding that type, but the "type" is a label in the context, not a shared substance.
  *   *Translation:* The Realist claim translates to **Reference Equality** on the Type Object. But in most type theories, types are static syntax, not heap objects. To model this, you would need **First-Class Types** where `typeOf(A) == typeOf(B)` returns true by pointer equality. Even then, this is an implementation detail, not an ontological guarantee. PLT vocab treats identity as equivalence classes; Realism treats it as shared substance. This is a genuine expressive gap.

  **(b) Discovery vs. Stipulation**
  *   *The Worry:* PLT type systems are designed (stipulated). Realism claims universals are discovered.
  *   *Verdict:* **Question-Begging.** Your vocabulary presupposes Constructivism. By asking "How do I declare this type?", you assume the type is a tool.
  *   *Translation:* To model Discovery, you would need **Type Inference** that is guaranteed to converge on a "true" type independent of the programmer's annotations. But inference algorithms are still designed. The residue here is **Teleology**. PLT has no concept of a "natural kind" other than "efficient representation." If you assume the type system is "correct," you are smuggling in Realism. If you assume it is "useful," you are smuggling in Pragmatism.

  **(c) Regress (Third Man) vs. Universe Levels**
  *   *The Worry:* If $A$ and $B$ are red because they participate in Universal $R$, what relates $A$ and $R$? A higher universal $R'$? (Third Man Argument).
  *   *Your Hypothesis:* Is this an Impredicativity/Universe Level issue?
  *   *Verdict:* **Strong Analogy, but distinct.** The Third Man Argument arises from **Self-Predication** (The Form of Red is itself Red). In type theory, this is `Type : Type`, which leads to Girard's Paradox (inconsistency).
  *   *Translation:* Universe levels ($Type_0 : Type_1 : \dots$) prevent the regress by stratifying the ontology. The TMA suggests that without stratification, realism collapses into incoherence.
  *   *Difference:* In PLT, universe levels are a *fix* to ensure consistency. In Metaphysics, the regress is an *argument* against the ontology. The translation holds: The TMA shows that naive realism is like a type system with `Type : Type`—it looks expressive but is logically unstable. However, PLT solves this by hierarchy; Realists often solve it by denying self-predication. The residue is that PLT treats the regress as a *bug*, while Metaphysics treats it as a *feature* of the ontological landscape.

  ---

  ### 3. Case Study: Graded Membership

  **The Setup:**
  $t : T \iff \text{sim}(t, \text{prototype}_T) > \theta$.
  The threshold $\theta$ is a parameter of the typing judgment.

  **Analysis:**
  This discipline expresses **Resemblance Nominalism** *only if* the `prototype` is itself a particular term (a value) and not a type.

  1.  **If `prototype` is a Term:** You have selected a paradigm particular $p$. Other terms are typed based on distance to $p$. This is **Resemblance Nominalism**. There is no "Red" type, only "things like $p$."
  2.  **If `prototype` is an Ideal:** If the prototype is not a term in the language but an external mathematical object (a vector in a latent space not inhabited by terms), you have slipped into **Ante Rem Realism**. The prototype is a Platonic Form.
  3.  **If `prototype` is Mutable/Clustered:** If the prototype is the centroid of all current inhabitants, you have **In Re Realism** (the universal is the aggregate of the particulars).

  **Verdict:**
  As stated, it expresses **Trope Theory with a Representative**.
  Why? Because the typing judgment relies on a specific *instance* (`prototype`). In Trope Theory, properties are particular. Here, the "standard" for the property is a particular.
  However, it fails to be pure Resemblance Nominalism because Resemblance Nominalism denies the need for a *single* prototype. Pure Resemblance is a clique in a graph (all nodes connected), not a star graph (all nodes connected to center).

  **Extra Structure Needed:**
  To express pure Resemblance Nominalism, you need to remove the `prototype`. The typing judgment must be:
  $t : \text{Cluster}_C \iff \forall t' \in C, \text{sim}(t, t') > \theta$.
  This requires **Global Knowledge** of all inhabitants to type-check a new term. This is computationally intractable (non-modular).

  **Implication:**
  The failure of the graded system to express pure Resemblance without a prototype suggests that **Resemblance Nominalism is not computationally modular.** It requires either:
  1.  A Representative (collapsing to Trope/Exemplar theory).
  2.  An Ideal Standard (collapsing to Realism).
  3.  Omniscience of all particulars (impossible for incremental type checking).

  This suggests Resemblance Nominalism might be an unstable ontology for any system requiring local reasoning (like language or code). It collapses into Realism (the prototype becomes a Form) or Trope Theory (the prototype is just another particular) under the pressure of formalization.

  ---

  ### 4. Conclusion: Blind Spot or Dissolved Question?

  **Smuggled Assumptions:**
  1.  **Modularity:** I assumed type checking must be local/modular. Metaphysics does not care about computational complexity.
  2.  **Explicitness:** I assumed types must be declarable. Metaphysics allows for vague or ineffable universals.
  3.  **Consistency:** I assumed the system must be paradox-free. Metaphysics tolerates paradox (e.g., dialetheism) more readily than PLT.

  **Final Verdict:**
  The residue you found is **evidence that the original question is less sharp than it looks.**

  The Problem of Universals arises largely from the ambiguity of natural language predication ("The apple is red"). When you translate this into PLT, you are forced to disambiguate the mechanism of predication:
  *   Is it a name lookup? (Nominal/Ante Rem)
  *   Is it a structure check? (Structural/In Re)
  *   Is it a pointer comparison? (Trope)
  *   Is it a comment? (Erasure)

  Once you force the metaphysician to pick a typing rule, the "mystery" of the universal evaporates into a design choice. The "Residue" (Numerical Identity, Discovery) persists only if you insist on treating the type system as a *description of reality* rather than a *tool for reasoning*.

  If you treat PLT as ontology, you are a **Structural Realist**.
  If you treat PLT as engineering, you are a **Pragmatic Nominalist**.

  The "Problem of Universals" is essentially the bug report generated when you try to run Natural Language (which conflates these modes) on a VM that requires them to be distinct. Your vocabulary doesn't have a blind spot; it has a **lens** that focuses the blur into distinct, solvable engineering trade-offs. The metaphysical "residue" is the diffraction pattern of that lens.
