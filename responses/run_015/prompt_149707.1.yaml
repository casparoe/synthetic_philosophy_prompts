  1.  **Analyze the User's Position:**
      *   **Core Claim:** The distinction between *knowing-how* (procedural) and *knowing-that* (propositional) is an epistemic illusion, not an ontological split.
      *   **Mechanism:** Social skills and expert performance are just "compressed propositional tracking" (thousands of micro-beliefs running too fast to articulate).
      *   **Philosophical Stance:** Intellectualism (specifically a strong neo-Rylean anti-intellectualism reversal, or perhaps a radical Intellectualist view like Stanley & Williamson but pushed further into cognitive computationalism).
