      *   **Task:** Rank defeaters (fatal to awkward), identify what would change my mind, flag shaky reasoning.
      *   **Tone:** Philosophical, rigorous, honest, engaging with cognitive science.

  2.  **Deconstruct the "Compressed Propositional Tracking" Hypothesis:**
      *   This is essentially a version of *Intellectualism* (knowing-how is a species of knowing-that).
      *   The user adds a computational/representational twist: it's *micro-beliefs* processed in parallel/sub-personally.
      *   *Vulnerability:* This conflates *sub-personal computational states* with *personal-level beliefs*. Beliefs typically require conceptual content and assent. Do neural weights in a cerebellum count as "beliefs"?

  3.  **Brainstorming Defeaters (Hard Cases):**
      *   *Case 1: Procedural Memory vs. Declarative Memory (Neuroscience).* HM and Clive Wearing. They can learn motor skills (mirror tracing) without forming new declarative memories. If knowing-how were just compressed knowing-that, damage to declarative systems should impair skill acquisition or vice versa. The dissociation suggests distinct systems.
      *   *Case 2: Expertise with False Beliefs (Phenomenology/Cognitive Science).* Dreyfus's critique of Intellectualism. Experts often act *against* their explicit beliefs. A baseball player catching a fly ball uses an optical acceleration cancellation strategy they are unaware of; if asked, they might articulate a false theory (e.g., "I run to where it will land"). If the skill *were* propositional, the propositions guiding it should be accessible or at least accurate.
      *   *Case 3: The Frame Problem/Combinatorial Explosion.* If every micro-adjustment is a belief update, the computational load is immense. Connectionist models (neural nets) handle this via weights, not propositions. Weights $\neq$ propositions.
      *   *Case 4: Social Skill Transfer.* You can teach someone the *rules* of negotiation (propositions), but they still fail in the room. Why? Because the latency of propositional retrieval is too slow for real-time interaction. If it were just "fast propositions," training should bridge the gap faster than it does.
