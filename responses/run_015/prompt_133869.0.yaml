prompt: |-
  Write a proposal for a one-semester research paper (around 6,000 words) on whether conceptual engineering can generate a distinct form of epistemic injustice. The core idea is this: standard accounts treat hermeneutical injustice as a static gap—some group lacks the conceptual resources to understand their own experience. But in practice, responses often involve actively promoting a new or refined concept within institutions (for example, a revised notion of consent in policy, or a newly coined term for an unrecognized workplace harm). Once dominant institutions adopt the engineered concept, people who continue using the older framework frequently suffer credibility deficits—not because of identity-based prejudice in the usual testimonial sense, but because they are seen as conceptually outdated or unable to articulate the "correct" analysis. Call this "conceptual-lag injustice."

