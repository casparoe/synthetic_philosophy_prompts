answer: |-
  # Research Prospectus: Conceptual-Lag Injustice and the Ethics of Conceptual Engineering

  ## Abstract

  This research proposal outlines a one-semester project investigating a novel form of epistemic harm arising from the institutional implementation of conceptual engineering. Standard accounts of epistemic injustice, particularly hermeneutical injustice, focus on the exclusion of social groups due to a *lack* of conceptual resources. However, contemporary social progress often involves the active *replacement* of existing concepts with engineered alternatives (e.g., revised definitions of consent, new taxonomies of workplace harm). When institutions adopt these engineered concepts as policy, individuals adhering to the prior framework often suffer credibility deficits. They are not ignored because of identity prejudice in the traditional sense, but because they are deemed conceptually obsolete. This project proposes the term "conceptual-lag injustice" to describe this phenomenon. The research asks whether this constitutes a distinct form of epistemic injustice or merely an unavoidable cost of conceptual progress. Through conceptual analysis and the structured comparison of two institutional case studies—affirmative consent policies in higher education and the shift from professional stoicism to emotional labor frameworks in corporate management—the project aims to develop normative criteria for distinguishing legitimate conceptual reform from conceptual imperialism. The outcome will be a decision framework assessing reversibility, transitional accessibility, and representational proportionality.

  ## Introduction: The Dynamics of Conceptual Replacement

  Conceptual engineering has emerged as a dominant methodology in contemporary philosophy, advocating for the assessment and improvement of our conceptual repertoire. The core intuition is that some of our concepts are defective—they may be vague, inconsistent, or oppressive—and that we have a normative duty to repair or replace them. This philosophical project has increasingly migrated from abstract metaphysics into concrete institutional policy. Universities, corporations, and legal bodies now actively engage in conceptual engineering by codifying new definitions of harassment, consent, diversity, and safety. The intention is almost invariably progressive: to make visible harms that were previously obscured, to empower marginalized groups, and to align institutional practices with evolving ethical standards.

  However, the institutionalization of conceptual engineering introduces a dynamic that existing frameworks of epistemic injustice are ill-equipped to analyze. The standard model of hermeneutical injustice, as articulated by Fricker, describes a structural gap in the collective hermeneutical resource. A group suffers because there is no concept available to make their experience intelligible. The remedy, implicitly, is the creation and dissemination of that missing concept. But what happens when the remedy itself becomes a source of exclusion? When a new, engineered concept becomes the dominant institutional standard, it does not merely fill a gap; it displaces the old framework. Individuals who continue to operate within the old framework—often due to habit, generational socialization, or legitimate disagreement—are not simply lacking a resource. They are actively penalized for using the "wrong" one.

  This penalty typically manifests as a credibility deficit. In testimonial exchanges governed by the new institutional norms, the speaker using the old framework is not heard as a knower. They are not necessarily dismissed because of identity prejudice regarding their race, gender, or class, though these factors may intersect. Rather, they are dismissed because their conceptual vocabulary is flagged as outdated, imprecise, or indicative of a failure to undergo necessary training. They are treated as epistemically incompetent relative to the new standard. This creates a paradox: the very conceptual tools introduced to reduce injustice may generate a new form of exclusion for those who have not, or cannot, transition to the new lexicon.

  This research project proposes to investigate this phenomenon under the label "conceptual-lag injustice." The central problem is not the absence of concepts, but the friction caused by the transition between conceptual regimes. In a static gap model, the solution is additive: give people the words they lack. In a replacement model, the solution is transformative: require people to change the words they use. The latter carries a coercive potential that the former does not. If an institution mandates that only the new concept counts as a valid description of reality, it effectively renders the experiences articulated through the old concept unintelligible or invalid.

  The stakes of this inquiry are high. If conceptual-lag injustice is a genuine form of epistemic harm, then advocates of conceptual engineering must account for the transition costs imposed on legacy users of concepts. It suggests that the ethics of conceptual engineering cannot focus solely on the superiority of the new concept but must also consider the treatment of those holding the old one. Conversely, if this phenomenon is merely the unavoidable friction of progress, then labeling it "injustice" may hinder necessary social reform by granting undue epistemic standing to outdated or harmful frameworks. Distinguishing between necessary growing pains and genuine injustice is critical for policy-making.

  This proposal outlines a plan to analyze the mechanisms of this credibility deficit, compare two distinct institutional contexts where this dynamic is visible, and formulate normative criteria to evaluate the legitimacy of such transitions. The goal is to move beyond the binary of "progress versus stagnation" and identify the specific conditions under which conceptual displacement becomes oppressive.

  ## Theoretical Background and Literature Gap

  To situate the proposed research, it is necessary to map the current landscape of epistemic injustice and conceptual engineering, identifying the specific lacuna this project addresses. The literature currently operates with two distinct silos: one concerned with the harms of exclusion, and one concerned with the mechanics of conceptual change. Bridging these silos reveals the blind spot regarding transitional harms.

  ### Epistemic Injustice: Gaps and Prejudice

  The foundational account of epistemic injustice distinguishes between testimonial and hermeneutical injustice. Testimonial injustice occurs when a speaker is accorded less credibility than they deserve due to identity prejudice. The hearer's prejudice causes them to deflate the speaker's credibility level. Hermeneutical injustice occurs when a gap in collective interpretive resources puts someone at a significant disadvantage when making sense of their social experiences. In both cases, the structural focus is on exclusion from the epistemic community. In the testimonial case, the speaker is in the community but not believed. In the hermeneutical case, the speaker is effectively locked out of the community's sense-making practices because the tools do not exist.

  Subsequent work by scholars such as Dotson and Pohlhaus has expanded these categories. Dotson, for instance, distinguishes between different degrees of hermeneutical injustice, noting that sometimes resources exist but are not accessible due to power imbalances. Pohlhaus discusses hermeneutical marginalization, where dominant groups refuse to utilize the resources generated by marginalized groups. These refinements are crucial because they move the discussion from a simple "lack of words" to a complex dynamics of power and uptake.

  However, a common thread persists across these accounts: the problem is framed as a deficit of resources or a refusal to acknowledge resources generated by the marginalized. The remedy is inclusion. The marginalized group needs to be brought into the fold, or their concepts need to be accepted by the dominant group. The direction of the injustice is typically from the powerful to the powerless, where the powerful withhold credibility or concepts.

  The scenario proposed in this research inverts or complicates this direction. Here, the "marginalized" group in the specific context might be the legacy users of an old concept, who may hold institutional power in other respects (e.g., senior faculty, long-term employees) but find themselves epistemically marginalized by a new policy designed to protect vulnerable groups. The harm is not that they lack a concept to describe their own experience; they have a concept (the old one). The harm is that the institution no longer accepts that concept as valid. This does not fit neatly into hermeneutical injustice because the collective resource is not missing; it has been upgraded. Nor does it fit neatly into testimonial injustice because the credibility deficit is not primarily driven by identity prejudice (e.g., sexism or racism) but by "conceptual non-compliance."

  While some scholars have discussed "willful hermeneutical ignorance," where dominant agents refuse to learn the concepts of the marginalized, there is little work on the reverse: where the institution mandates a new concept and penalizes those who cannot or will not adopt it. This is not ignorance; it is obsolescence. The literature lacks a category for the injustice suffered by those left behind by conceptual progress.

  ### Conceptual Engineering: Improvement and Implementation

  On the other side of the divide is the literature on conceptual engineering. Proponents like Cappelen, Plunkett, and Sundell argue that we should treat concepts as tools that can be assessed and improved. The focus here is largely on the criteria for success: What makes a concept better? Is it more precise? More morally conducive? More useful for inquiry?

  Recent discussions have begun to touch on the implementation of engineered concepts. There is recognition that changing a concept is not merely a matter of philosophical argument but requires social and institutional uptake. However, the normative focus remains on the *target* concept. The ethics of engineering is usually the ethics of the *new* design. If the new concept reduces oppression, the engineering is justified.

  What is missing is an ethics of *transition*. Conceptual engineering is often treated as a voluntary adoption among inquirers or a gradual cultural shift. But in institutional contexts, it is often a top-down mandate. When a university changes its definition of consent, it is not asking for a gradual cultural evolution; it is enforcing a new semantic standard through disciplinary procedures. The literature on conceptual engineering has not sufficiently grappled with the coercive nature of institutional implementation. It assumes that if the new concept is better, adoption is normative. It does not account for the epistemic status of the non-adopters.

  ### The Intersection: The Missing Dynamic

  The gap, therefore, lies at the intersection. Epistemic injustice theory explains the harm of not being heard but assumes the problem is a lack of concepts or identity prejudice. Conceptual engineering theory explains the improvement of concepts but assumes the problem is the concepts themselves, not the transition process. Neither account fully captures the dynamic where a *successful* conceptual engineering project generates a new class of epistemic victims.

  If a new concept is successfully engineered and institutionalized, the "gap" is technically closed. The resources exist. But for the person who still uses the old framework, the gap has effectively reopened, not because the resource is missing from the collective, but because they are barred from using it. This suggests a distinct mechanism. It is not hermeneutical marginalization in the standard sense, because the marginalized party is not a subaltern group lacking power; they are often the former standard-bearers of the institution. Yet they suffer a credibility deficit.

  This research posits that existing categories collapse the nuance of this situation. If we classify this as testimonial injustice, we must identify the identity prejudice. Is "conceptual conservative" an identity category? If we force it into that box, we risk diluting the concept of testimonial injustice to cover any instance of disagreement. If we classify it as hermeneutical injustice, we must argue there is a gap. But there is no gap; there is a conflict. Therefore, a new categorization or a significant refinement of existing categories is required. This project argues for the former: identifying "conceptual-lag injustice" as a distinct phenomenon requiring its own normative analysis.

  ## Defining Conceptual-Lag Injustice

  To proceed with the research, a precise working definition of the core construct is required. This section outlines the proposed definition and its necessary conditions, which the paper will refine and defend.

  **Conceptual-Lag Injustice (CLI)** occurs when an institution adopts an engineered concept as a normative standard for communication and assessment, resulting in a systematic credibility deficit for agents who continue to utilize the predecessor concept, where this deficit is not primarily driven by identity prejudice regarding the agent's social group, but by their perceived failure to align with the new conceptual regime.

  This definition contains several critical components that the research will unpack:

  1.  **Institutional Adoption:** The engineered concept must not merely be in circulation; it must be codified in policy, training, or evaluation metrics. This distinguishes CLI from ordinary linguistic drift. It is the institutional enforcement that creates the high stakes for non-compliance.
  2.  **Systematic Credibility Deficit:** The harm must be recurrent and structural, not an isolated misunderstanding. The agent is consistently afforded less credibility in relevant contexts (e.g., grievance hearings, performance reviews) because of their conceptual framework.
  3.  **Predecessor Concept Utilization:** The agent is not lacking concepts; they are using the old ones. This distinguishes CLI from standard hermeneutical injustice. The agent can articulate their experience, but the articulation is deemed invalid.
  4.  **Non-Identity-Based Prejudice:** This is the most contentious and crucial condition. In standard testimonial injustice, the credibility deficit tracks with social power (race, gender, class). In CLI, the deficit tracks with *temporal* or *conceptual* alignment. While identity may correlate (e.g., older workers might hold older concepts), the mechanism of the deficit is the conceptual mismatch itself. If a young employee uses the old framework, they should theoretically suffer the same deficit. Distinguishing this from ageism or other identity prejudices will be a major analytical task.

  The research will investigate whether CLI is a *sui generis* form of injustice or a hybrid. It shares features with hermeneutical injustice (intelligibility issues) and testimonial injustice (credibility deficits), but the etiology is different. It stems from the *success* of a reform movement rather than the failure of inclusion. This makes it uniquely difficult to critique, as criticizing CLI can sound like criticizing the reform itself. The proposal argues that one can support the new concept while still critiquing the manner of its imposition.

  ## Research Question and Hypotheses

  The central research question guiding this semester-long project is:

  **Is conceptual-lag injustice genuinely a distinct form of epistemic injustice, or is it merely an unavoidable practical cost of conceptual progress? Furthermore, can we formulate normative criteria to distinguish legitimate conceptual reform from a harmful kind of conceptual imperialism?**

  This question breaks down into two analytical tasks. The first is ontological: categorizing the harm. The second is normative: evaluating the harm.

  **Hypothesis 1 (Ontological):** Conceptual-lag injustice is distinct from standard testimonial and hermeneutical injustice. It cannot be reduced to identity prejudice because the credibility deficit is triggered by semantic non-compliance which can affect agents regardless of social identity, provided they are outside the new conceptual regime. It cannot be reduced to hermeneutical injustice because the collective resources are sufficient; the exclusion is procedural.

  **Hypothesis 2 (Normative):** Not all instances of conceptual displacement constitute injustice. There are legitimate cases where old concepts are harmful and must be displaced quickly. However, a "Conceptual Imperialism" occurs when the transition violates specific normative conditions regarding accessibility and pluralism. We can distinguish justified reform from imperialism by applying criteria such as reversibility, transitional accessibility, and proportional representation.

  The research will test these hypotheses against the case studies. If the analysis shows that the credibility deficits in the cases are always traceable to underlying identity prejudice (e.g., the "old framework" is just a proxy for "older men"), then Hypothesis 1 fails, and CLI collapses into standard testimonial injustice. If the analysis shows that no normative distinction can be drawn between necessary reform and harmful imposition (i.e., all displacement is inherently imperialistic or all is inherently justified), then Hypothesis 2 fails.

  ## Methodology

  The research will employ a two-pronged methodological approach: conceptual analysis and structured comparative case study. This hybrid method is necessary because the phenomenon is both theoretical (involving definitions of justice and credibility) and practical (involving institutional policies).

  ### Conceptual Analysis

  The first phase involves rigorous philosophical reconstruction of the mechanisms of credibility. I will analyze the structure of the "credibility economy" within an institution. How is credibility assigned? Typically, it is assigned based on perceived competence and sincerity. In the context of conceptual engineering, competence is redefined. To be competent is to use the correct concepts. Therefore, using the old concept is interpreted as a competence failure.

  I will examine whether this competence failure is epistemic or moral. Is the person using the old concept *wrong* about the world, or are they just using the wrong labels? If the new concept tracks reality better (e.g., it identifies harm more accurately), then the old user is arguably epistemically deficient. If so, the credibility deficit might be justified. However, if the transition is too rapid for the agent to reasonably update their beliefs, the deficit becomes unjust. The conceptual analysis will focus on the "reasonable update" condition. What are the epistemic obligations of an agent to update their conceptual repertoire? This draws on literature regarding epistemic responsibility and doxastic control.

  ### Structured Comparative Case Study

  To ground the conceptual analysis, I will examine two specific instances of institutional conceptual engineering. The cases are selected to represent different domains (education/law and workplace management) and different types of concepts (normative/legal and descriptive/psychological).

  The method is not empirical data collection (which is beyond the scope of a one-semester paper) but rather philosophical reconstruction of institutional dynamics. I will describe the salient institutional features in sufficient detail to allow the analysis to proceed without relying on obscure historical facts. The cases will be treated as "model scenarios" that reflect real-world dynamics without requiring specific citation of events.

  **Selection Criteria for Cases:**
  1.  **Clear Conceptual Shift:** There must be a identifiable "before" and "after" concept.
  2.  **Institutional Enforcement:** The new concept must be tied to consequences (hiring, firing, grading, adjudication).
  3.  **Visible Friction:** There must be documented or plausible scenarios where users of the old concept suffer negative outcomes.

  The two selected cases are:
  1.  **The Shift to Affirmative Consent in Higher Education:** Moving from "No Means No" to "Yes Means Yes."
  2.  **The Shift to Emotional Labor Frameworks in Corporate Management:** Moving from "Professional Stoicism" to "Psychological Safety/Emotional Awareness."

  In the analysis, I will isolate the institutional mechanisms that generate the credibility deficit in each case. I will look for commonalities in how the "lag" is punished. This comparison allows me to test whether CLI is a generalizable phenomenon or specific to certain types of concepts.

  ## Case Study 1: Affirmative Consent Policies in Higher Education

  The first case study focuses on the institutionalization of affirmative consent standards within university judicial systems and sexual misconduct policies. This provides a high-stakes environment where conceptual definitions directly determine liability and moral standing.

  ### Institutional Features and Conceptual Shift

  Historically, many institutional policies operated on a "No Means No" framework. Under this regime, the absence of a verbal or physical "no" could be interpreted as consent. Silence, passivity, or lack of resistance were hermeneutically compatible with consent. The conceptual engineering project here was to replace this with an affirmative standard ("Yes Means Yes"). Under the new framework, consent is not the absence of refusal but the presence of enthusiastic, ongoing, and verbal agreement. Silence is re-categorized: it is no longer neutral; it is now conceptually equivalent to a lack of consent.

  This is not merely a semantic change; it is a change in the ontology of the interaction. The new concept makes visible a harm that the old concept obscured: the pressure placed on individuals to actively refuse rather than the requirement for partners to actively seek permission. Institutions adopted this through mandatory training, revised student handbooks, and updated adjudication guidelines.

  ### The Mechanism of Conceptual-Lag

  The research will analyze the position of an agent (Student A) who operates under the old framework. Student A engages in a sexual encounter where verbal consent was not explicitly exchanged, but no refusal was voiced. Under the old framework, Student A believed they were acting permissibly. Under the new institutional framework, Student A is in violation of policy.

  When Student A attempts to explain their actions in a disciplinary hearing, they appeal to the old framework: "I didn't hear a no." This explanation is now hermeneutically dead. The institution does not accept "I didn't hear a no" as a valid defense because the concept of consent has changed. Student A suffers a credibility deficit. They are not necessarily seen as a liar (testimonial injustice regarding sincerity), but they are seen as conceptually incompetent or morally obtuse (testimonial injustice regarding competence, driven by conceptual lag).

  ### Analysis of Injustice vs. Progress

  This case presents the strongest challenge to the "injustice" classification. The shift to affirmative consent is widely regarded as moral progress. The old concept was arguably defective because it placed the burden of safety on the potential victim rather than the actor. If the old concept is morally harmful, is there an injustice in penalizing its use?

  The research will argue that while the *concept* is superior, the *process* may generate CLI if it fails to account for transitional understanding. If Student A was enrolled before the policy change, or if the training was perfunctory, penalizing them for the lag may be unjust. However, if the institution provides robust education and a grace period, the deficit may be justified.

  The key feature to analyze here is the *retroactivity* and the *burden of knowledge*. Does the institution assume immediate uptake of the new concept? If the institutional policy treats the new concept as self-evident truth immediately upon announcement, it creates a hermeneutical cliff. Those on the other side of the cliff fall. The research will examine whether the credibility deficit assigned to Student A is proportional to their epistemic negligence. If the institution made the new concept inaccessible (e.g., buried in a handbook, no training), the credibility deficit is unjust. If the concept was widely disseminated and Student A simply refused to engage, the deficit may be a legitimate accountability measure.

  This case allows us to test the "Accessibility" criterion of the normative framework. It highlights the tension between protecting victims (who need the new concept to be valid immediately) and protecting accused parties (who need fair notice of the conceptual rules).

  ## Case Study 2: Emotional Labor and Professionalism in Corporate Management

  The second case study examines the shift in workplace management paradigms regarding emotional expression. This provides a contrast to the legalistic nature of the first case, focusing instead on performance evaluation and cultural fit.

  ### Institutional Features and Conceptual Shift

  Traditionally, many corporate environments operated on a framework of "Professional Stoicism." The ideal worker was conceptually defined as someone who could separate personal feelings from professional tasks. Emotional displays were categorized as "unprofessional" or "lacking resilience." The conceptual repertoire included terms like "thick skin," "objectivity," and "detachment."

  In recent years, many organizations have engaged in conceptual engineering to promote "Psychological Safety" and recognize "Emotional Labor." The new framework posits that emotional regulation is work, that ignoring emotional dynamics causes harm, and that "professionalism" should include emotional intelligence and vulnerability. Concepts like "microaggressions," "burnout," and "triggering" become part of the official evaluative language. HR departments adopt these terms in performance reviews and conflict resolution protocols.

  ### The Mechanism of Conceptual-Lag

  Consider an agent (Manager B) who has operated successfully for twenty years under the "Professional Stoicism" framework. Manager B receives a complaint from a subordinate that a comment was "emotionally unsafe." Manager B responds using the old framework: "I was being direct; you need to be less sensitive."

  In a conflict resolution meeting facilitated by HR using the new framework, Manager B's explanation is dismissed. Manager B is not heard as offering a valid perspective on workplace dynamics; they are heard as demonstrating a lack of leadership capability. Their credibility as a manager is deflated. They are labeled "toxic" or "resistant to culture."

  Here, the credibility deficit is tied to professional competence. By failing to use the new emotional vocabulary, Manager B is deemed incompetent at modern management. This is not necessarily ageism, though it correlates. A young manager trained in the old framework (perhaps in a previous industry) would suffer the same deficit. The harm is the inability to make one's professional intent intelligible. Manager B intends to be "efficient"; the institution hears "abusive."

  ### Analysis of Injustice vs. Progress

  This case allows us to test the "Pluralism" criterion. Unlike consent, where there is a strong moral argument that the old concept is harmful, the shift in professionalism is more debatable. Is "Professional Stoicism" genuinely defective, or is it a valid alternative culture?

  If the new concept is merely a preference for a different management style, enforcing it exclusively may constitute conceptual imperialism. It marginalizes a valid way of working. However, if the old style is shown to correlate with higher turnover or mental health harms, the engineering is justified.

  The research will analyze the *reversibility* of this shift. Can Manager B opt out? In the consent case, opting out is not allowed (you cannot choose to operate under "No Means No" in a "Yes Means Yes" institution). In the workplace case, is there room for conceptual pluralism? Can some teams operate under stoicism while others operate under psychological safety? If the institution mandates a monopoly on the new concept, it increases the risk of CLI.

  This case also highlights the *identity* confound. Often, the "old framework" is associated with dominant social groups (e.g., men in leadership). Disentangling whether the credibility deficit is due to the conceptual lag or the gender of the manager is difficult. The research will attempt to isolate the variable by considering scenarios where the agent is a member of a marginalized group but still holds the old concept (e.g., a woman who values stoicism). If she still suffers the deficit, it supports the CLI hypothesis over pure identity prejudice.

  ## Normative Criteria and Decision Framework

  The core deliverable of this research is a set of normative criteria to distinguish legitimate conceptual reform from conceptual imperialism. Based on the preliminary analysis of the cases, I propose three conditions that the paper will develop and refine. These conditions serve as a diagnostic tool for institutions engaging in conceptual engineering.

  ### 1. Transitional Accessibility

  For a conceptual shift to be just, the new concept must be epistemically accessible to the legacy users during a transition period. Accessibility is not merely publication; it requires active hermeneutical support.
  *   **Indicator of Justice:** The institution provides training, examples, and forums for questions regarding the new concept before enforcing it.
  *   **Indicator of Injustice:** The institution assumes the new concept is self-evident or treats confusion as bad faith. If the learning curve is steep, the institution must accommodate the lag.
  *   **Application:** In the consent case, did the university offer workshops before adjudicating violations? In the workplace case, did HR offer coaching before issuing write-ups?

  ### 2. Reversibility and Opt-Out Clauses

  Legitimate reform should allow for some degree of conceptual pluralism where moral stakes permit. If the old concept is not inherently harmful (merely less precise), users should be allowed to retain it in certain contexts.
  *   **Indicator of Justice:** The institution allows for translation. If an employee uses the old term, HR attempts to translate it into the new framework rather than dismissing it.
  *   **Indicator of Injustice:** The institution treats the old vocabulary as forbidden speech.
  *   **Application:** In the workplace, can "professionalism" coexist with "psychological safety"? In consent cases, reversibility is lower because the stakes involve bodily autonomy, suggesting a stricter standard is permissible there. This criterion helps distinguish high-stakes moral engineering from cultural preference.

  ### 3. Proportional Representation of Old-Framework Users

  The process of engineering the new concept should include input from those who value the old one. If the new concept is designed solely by those who already reject the old one, it risks being an echo chamber.
  *   **Indicator of Justice:** The committee designing the new policy includes representatives who can articulate the value of the legacy framework.
  *   **Indicator of Injustice:** The legacy users are treated as obstacles to be overcome rather than stakeholders to be consulted.
  *   **Application:** Were senior managers consulted on the emotional labor policy? Were students consulted on the consent policy?

  The research paper will test these criteria against the case studies. Do they successfully identify the moments where the transition became unjust? For example, if a university fails the Accessibility test (no training) but passes the Representation test (student input), is the resulting injustice mitigated? The goal is to weight these criteria to create a decision matrix.

  ## Expected Outcomes: Success and Failure Conditions

  To ensure the research remains focused and evaluable within the semester, I have defined specific conditions for success and failure.

  ### Success Conditions

  The project will be considered successful if it produces a **Decision Framework for Conceptual Transition**. This framework must:
  1.  **Differentiate:** Clearly distinguish between a justified credibility deficit (e.g., penalizing someone for using a harmful concept after adequate warning) and an unjustified one (e.g., penalizing someone for using a neutral concept without warning).
  2.  **Categorize:** Provide a defensible argument for whether CLI is a subtype of testimonial injustice, hermeneutical injustice, or a distinct category. Even if it concludes it is a hybrid, it must explain the hybridization mechanism.
  3.  **Apply:** Successfully apply the normative criteria to the two case studies to yield distinct verdicts. For instance, it might conclude that the consent case is largely justified reform (due to moral necessity) while the workplace case risks imperialism (due to cultural preference).

  A successful result validates the intuition that "how" we change concepts matters as much as "what" we change them to. It provides institutional actors with a checklist to avoid epistemic harm while pursuing progress.

  ### Failure Conditions

  The project will be considered to have failed to meet its primary hypothesis if:
  1.  **Collapse into Testimonial Injustice:** The analysis reveals that in all plausible cases, the "conceptual lag" is perfectly correlated with identity prejudice (e.g., only older men hold the old concepts, and they are penalized *because* they are older men, using the concept as a pretext). If the conceptual element is merely epiphenomenal, CLI is not a distinct category.
  2.  **No Normative Distinction:** The analysis shows that it is impossible to distinguish between progress and imperialism. If every transition inevitably harms legacy users to the same degree, and that harm is always justified by the improvement of the concept, then "injustice" is the wrong label. It would simply be "cost." If the research cannot find a middle ground where reform is possible without injustice, the normative framework collapses.
  3.  **Inapplicability:** The criteria developed are too abstract to apply to the case studies. If the conditions (Accessibility, Reversibility) cannot be operationalized in the context of the examples, the framework is theoretically sound but practically useless.

  ## Scope and Feasibility: Risk Assessment

  A one-semester timeline imposes strict limits on the depth of analysis. An honest assessment of scope risk is necessary to ensure the project remains completable.

  ### Feasible Analytical Steps

  1.  **Conceptual Definition:** Defining CLI and distinguishing it from Fricker's categories is feasible within the first month. This is primarily textual analysis of existing philosophical positions.
  2.  **Case Reconstruction:** Describing the institutional features of the two cases is feasible because these are well-known public discourses. I do not need to conduct interviews; I can rely on publicly available policy templates and standard training descriptions.
  3.  **Criteria Formulation:** Developing the three normative criteria is feasible as a theoretical exercise.

  ### Areas Requiring Bracketing

  To maintain scope, several related issues must be bracketed (excluded) from the analysis:

  1.  **Empirical Verification:** I will not be measuring the actual psychological impact on legacy users. The paper will argue about the *structure* of the injustice, not the *severity* of the harm in specific instances. I will not claim to know how many people suffer CLI, only that the mechanism exists.
  2.  **Legal Analysis:** While the consent case involves policy, I will not conduct a legal analysis of due process rights. The focus is epistemic (credibility and intelligibility), not legal (rights and liabilities). This prevents the paper from drifting into jurisprudence.
  3.  **Intersectionality Deep-Dive:** While I acknowledge that identity intersects with conceptual lag, I will not perform a full intersectional analysis of race, class, and gender in this paper. I will treat identity as a confounding variable to be controlled for, not the primary object of study. This is necessary to isolate the *conceptual* mechanism. A full intersectional study would require a much larger scope.
  4.  **Global/Cultural Variations:** The cases are situated in Western institutional contexts. I will not analyze how CLI manifests in non-Western conceptual regimes. This limits the generalizability but ensures depth.

  ### Major Risk: The Identity Confound

  The single greatest risk to the project is the inability to separate conceptual lag from identity prejudice. If, upon close inspection, the "old framework" is inextricably linked to a dominant social identity (e.g., patriarchy), then penalizing the framework may be indistinguishable from penalizing the identity.
  *Mitigation:* I will address this by constructing hypothetical counter-examples within the case studies. I will ask: "If a member of a marginalized group used the old concept, would they still be penalized?" If the answer is yes, the mechanism is conceptual. If no, it is identity-based. This thought experiment allows me to isolate the variable theoretically, even if empirical reality is messy.

  ### Major Risk: Normative Relativism

  There is a risk that the normative criteria will appear too conservative, effectively protecting harmful old concepts under the guise of "fairness."
  *Mitigation:* I will explicitly build a "Harm Threshold" into the framework. If the old concept is directly harmful (e.g., permits assault), the criteria for Accessibility and Reversibility tighten. The framework will not protect the right to use harmful concepts, only the right to a fair transition away from them. This distinguishes between "conceptual justice" and "moral tolerance."

  ## Semester Timeline

  To ensure completion, the research will follow a strict weekly schedule.

  **Weeks 1-3: Literature Review and Theoretical Grounding**
  *   Review key texts on epistemic injustice (Fricker, Dotson) and conceptual engineering (Cappelen, Plunkett).
  *   Draft the definition of Conceptual-Lag Injustice.
  *   Refine the distinction between testimonial, hermeneutical, and conceptual-lag injustice.

  **Weeks 4-6: Case Study Development**
  *   Draft the institutional descriptions for the Consent and Workplace cases.
  *   Identify specific scenarios of friction within each case.
  *   Map the credibility deficits in each scenario.

  **Weeks 7-9: Normative Framework Construction**
  *   Develop the criteria (Accessibility, Reversibility, Representation).
  *   Test the criteria against the case studies.
  *   Refine the criteria based on counter-examples.

  **Weeks 10-12: Drafting the Argument**
  *   Write the main body of the paper, integrating the theory and cases.
  *   Ensure the argument flows from the definition to the cases to the framework.
  *   Address the "Identity Confound" risk explicitly in a dedicated section.

  **Weeks 13-14: Revision and Polish**
  *   Review for clarity and word count compliance.
  *   Check that all citations are removed and positions referred to by name only.
  *   Finalize the conclusion and abstract.

  ## Conclusion

  The institutionalization of conceptual engineering is one of the most significant developments in contemporary social philosophy. It represents a move from understanding the world to actively reshaping the vocabulary through which we understand it. While this shift holds immense promise for correcting historical injustices and revealing hidden harms, it introduces a new vector of epistemic risk. Those who remain anchored in the previous conceptual regime face a unique form of exclusion: they are not silenced because they lack words, but because their words are no longer currency.

  This research proposal argues that this phenomenon, conceptual-lag injustice, warrants distinct philosophical attention. It cannot be fully captured by existing accounts of testimonial or hermeneutical injustice because it arises from the *success* of reform rather than the failure of inclusion. By analyzing the mechanisms of credibility deficits in the contexts of affirmative consent and workplace emotional labor, this project seeks to delineate the boundary between necessary progress and conceptual imperialism.

  The resulting decision framework will offer a tool for institutions to pursue conceptual improvement without replicating the epistemic exclusions they seek to remedy. It posits that justice in conceptual engineering is not just about the destination (the new concept) but about the journey (the transition). If the research succeeds, it will demonstrate that we can engineer better concepts without treating the users of old ones as disposable. If it fails, it will reveal that the cost of progress is inevitably paid in the currency of someone's credibility. Either outcome provides critical insight into the ethics of social change.

  The scope is ambitious for a single semester, particularly the attempt to isolate conceptual mechanisms from identity prejudices. However, by bracketing empirical verification and focusing on structural analysis, the project remains feasible. The detailed case descriptions provided in this proposal ensure that the analysis can proceed without getting bogged down in external data collection. The focus remains firmly on the philosophical architecture of the injustice.

  Ultimately, this paper aims to contribute to a more nuanced understanding of power in epistemic communities. Power is not just the ability to speak or be heard; it is the ability to set the terms of the conversation. When those terms change, the research asks who is left speaking a language no one else understands, and whether their silence is a price we are willing to pay. By naming this dynamic "conceptual-lag injustice," we take the first step toward accounting for it in our theories of justice and our practices of reform. The proposal outlines a path to determine if that name fits, and if so, what obligations it creates for those who hold the pen that writes the new definitions.
