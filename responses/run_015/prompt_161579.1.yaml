  ### The Single Revision
  **Reclassify the "Autological Mask" as a Finkish case (intrinsic loss of basis) and accept that, strictly speaking, Finkish objects do not retain the disposition during the stimulus.**

  **Why this cleans up the most:**
  1.  **Resolves the Logical Contradiction:** It aligns your case with your definition in (4) (Masks = Extrinsic, Finks = Intrinsic/Basis-Changing). A phase change *is* a basis change.
  2.  **Protects (3):** It removes the pressure to explain how an object can be "intrinsically fragile" when its total intrinsic nature prevents shattering. You avoid the charge of gerrymandering which intrinsic properties count toward the disposition.
  3.  **Preserves the Fink/Mask Distinction:** It keeps your two repair clauses in (4) distinct, as you requested.
  4.  **Minimal Cost:** You lose the specific intuition that the ceramic is "fragile" *while* it is undergoing the phase change, but you retain the view that it was fragile *before* impact. This is a standard, defensible position in disposition metaphysics (time-indexed dispositions) and saves you from the much harder work of defending intrinsic masks against a definition that explicitly excludes them.

  **Instruction for the Paper:** In the opening section, define Masks as extrinsic and Finks as intrinsic basis-changers. Present the ceramic case explicitly as a **Fink**. Argue that your Reformed Conditional Analysis handles it via the persistence clause ("retain $B$"). Acknowledge that this implies the disposition is not manifest *because* the basis is lost, which preserves the link between Intrinsicness (3) and Causal Work (2). This turns a contradiction into a coherent application of your own framework.
