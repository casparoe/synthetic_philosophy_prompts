answer: |-
  So, picture Georg Cantor walking into a modern math department in 2025, grabbing a coffee, and looking over a grad student's shoulder at a Lean proof. He sees `open classical` and `axiom_of_choice` being used like they're importing a standard library for handling JSON. Here's my take on what he'd say, based on how he actually thought and fought during his life.

  First off, Cantor would probably be freaking out about the computers themselves. But once he got past the shock that we're checking proofs with machines, he'd zero in on the Axiom of Choice (AC) debate. And honestly? He'd be completely on the side of the Lean users who treat AC as default.

  You have to remember, Cantor spent his whole life fighting Leopold Kronecker. Kronecker was basically the original constructivist—he believed math was only valid if you could explicitly construct the numbers in a finite number of steps. He hated Cantor's actual infinity. He hated the idea that you could claim something exists without showing exactly what it is. Cantor thought that view was way too small. He believed infinite sets were real, completed things, existing in a metaphysical sense (he even tied it to theology sometimes).

  So, if he saw modern mathematicians worrying that using AC "breaks computation" or stops you from extracting a specific value, he'd probably sigh and say, "Here we go again."

  To Cantor, the Well-Ordering Theorem (which is equivalent to AC) wasn't just a useful trick; he believed it was literally true about the universe of sets. He thought every set *could* be well-ordered, whether we could write down the algorithm for it or not. So, the idea that AC is just a "toggleable setting" or a "useful fiction" would bother him. He wasn't a formalist who thought math was just a game of moving symbols according to rules. He was a realist. He thought he was discovering the architecture of reality. If AC is true, you don't toggle it off because it makes the computer grumpy. You keep it on because it reflects the truth.

  Regarding the loss of computable values: Cantor wouldn't see that as a betrayal. He'd see it as a necessary trade-off for dealing with actual infinity. He'd argue that just because a machine can't spit out a witness doesn't mean the object doesn't exist. For him, existence proofs were valid on their own merits. He'd probably tell the Coq users who refuse AC that they're artificially limiting mathematics to fit the constraints of a machine, rather than letting the concepts breathe.

  However, he might have one critique. Cantor cared deeply about clarity and definitions. If people are using AC as a blunt instrument just to bypass hard work without understanding the structure of the sets they're dealing with, he might get annoyed. He wasn't about laziness; he was about truth. If you're using AC because you believe in the well-ordering of sets, great. If you're using it just because it's the default setting in the software and you don't care about the metaphysical implications, he might think you're missing the point of what math *is*.

  So, to sum it up in casual terms: Cantor would tell the modern crowd to stop apologizing for using Choice. He'd say the loss of computation is fine because math isn't just about calculating stuff—it's about understanding the infinite. He'd view the "constructive vs. classical" fight as a continuation of his beef with Kronecker, and he'd firmly plant his flag in the classical camp. He'd probably say something like, "Don't let the machine tell you what exists. The sets are there whether your code can find them or not."
