  1.  **Analyze the Request:**
      *   **Context:** 20-minute talk at an aquaculture conference (animal welfare science session).
      *   **Audience:** Mostly fish biologists and farm vets (practical, operational welfare indicators, audit-focused) + ~3 comparative psychologists (familiar with Dennett's grades, view them as teaching tools, not research tools).
