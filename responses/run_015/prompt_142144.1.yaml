      *   *Reply 3:* Distinguish between *capability* and *mechanism*. Welfare is about the experience, not just the mechanism. *Soft spot:* Hard to prove experience without mechanism.
      *   *Reply 4:* Clarify that Darwinian suffering exists, but *chronic* welfare issues in farming are often about blocked agency. *Concession:* Don't deny Darwinian pain.
      *   *Reply 5:* Address the reversal learning interpretation. *Mark Contested:* This is the hottest scientific potato.
      *   *Reply 6:* Prioritize by *risk of specific suffering types*, not global sentience ranking.
