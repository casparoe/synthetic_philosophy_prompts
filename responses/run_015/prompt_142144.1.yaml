      *   *Objection 5 (The Data/Methodology):* "Your reversal learning data. Does that actually prove offline simulation or just stronger associative weights?" (Contested literature).
      *   *Objection 6 (The Economic/Operational):* "If we can't rank species, how do we prioritize resources? We have limited budget."
      *   *Objection 7 (The 'Hope Nobody Asks'):* "What do we do Monday?" (Policy implication).

  4.  **Developing Replies & Identifying Soft Spots:**
      *   *Reply 1:* Focus on proxy behaviors (persistence, innovation in detour) rather than direct measurement. *Soft spot:* It's still indirect.
