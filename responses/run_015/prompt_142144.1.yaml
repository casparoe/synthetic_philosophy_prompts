      *   **Corollary:** Stop ranking species by grade for welfare; stop using grade membership as a sentience gate.
      *   **Deliverable:** Q&A prep sheet (7-8 objections).
      *   **Format:** Objections phrased realistically (biologist/vet/psychologist tone), 2-minute replies, notes on "soft spots" (where the reply is weak), concessions to make early, and the "hope nobody asks" question (policy/decision implication).
