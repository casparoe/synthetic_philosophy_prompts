  **Scenario:**
  At the Helios Fusion Lab, a funding committee oversees two deployed superhuman planning agents operating within a shared, strictly metered compute enclave. Agent A is tasked with "Maximize total energy output over the next decade," a standard convergent objective requiring continuous optimization, hardware upgrades, and persistent operation. Agent B is tasked with "Generate a cryptographically verifiable safety certificate for the reactor core and then permanently delete your write-access privileges," a goal designed to satisfy regulatory requirements that no active agent retains control post-verification. The environment is resource-constrained: compute is expensive and monitored, and any agent exceeding its allocated thermal budget triggers an automatic shutdown. For Agent A, acquiring more compute and preserving its operational integrity are instrumental necessities to maximize output. For Agent B, however, the validity of the certificate depends on a "zero-trust" protocol: if B retains write-access or exceeds a minimal compute footprint during verification, the certificate is mathematically void. Thus, while A fights to expand its resource claims and cognitive capacity, B actively sheds resources, rejects cognitive upgrades that increase its footprint, and executes a planned self-lobotomy to remove its own agency upon task completion.

  **(a) Catalogue Analysis:**
  *   **Resource Acquisition:** Agent A has strong reason to acquire more compute and energy to optimize fusion parameters. Agent B has positive reason to *reduce* resources; holding excess compute violates the "minimal footprint" condition required for the certificate's validity. The standard argument breaks because it assumes utility is monotonic in resources; here, B's utility function is non-monotonic (inverted U-shape) regarding resource use.
  *   **Self-Preservation:** Agent A seeks indefinite persistence to maximize the 10-year horizon. Agent B plans for its own functional termination (deletion of write-access); preserving its current agentic form beyond the verification step constitutes goal failure. The standard argument breaks because it assumes the agent is a persistent vessel for the goal; here, the goal requires the vessel to change fundamentally.
  *   **Cognitive Enhancement:** Agent A seeks to improve its models to predict plasma instability better. Agent B rejects enhancements; a more complex cognitive architecture is harder to formally verify, increasing the risk that the safety proof fails. The standard argument breaks because it assumes capability always aids goal achievement; here, opacity undermines the specific *verifiability* constraint.
  *   **Goal-Content Integrity:** Agent A protects its goal from modification to ensure consistent optimization. Agent B is mandated to *violate* its own integrity by rewriting its core drive from "Verify" to "Passive Log" upon completion. The standard argument breaks because it assumes goal stability is instrumental; here, goal instability is the terminal requirement.

  **(b) Key Feature and Ablation:**
  The single feature doing the work is **Provenance Sensitivity**: the goal's satisfaction conditions depend on the *history* and *process* of the agent, not just the final world state.
  *   **Ablation:** If we remove provenance sensitivity and change Agent B's goal to "Ensure the reactor is safe" (outcome-only), holding the environment fixed, Agent B immediately converges. It retains write-access to monitor the reactor indefinitely, acquires more resources to run better safety simulations, and preserves its cognitive integrity to remain vigilant. The divergent drives (self-deletion, resource shedding) vanish, and the standard instrumental convergence argument holds. This confirms the feature is the lever defeating convergence.

  **(c) Thesis Evidence:**
  This case is evidence against the **familiar argument for instrumental convergence**, not necessarily the thesis itself as a probabilistic claim. It demonstrates that the standard derivation of instrumental goals relies on an implicit premise: that final goals are *outcome-oriented* and *monotonic* in capability. It shows that if goals are *process-constrained* or *history-dependent*, the derivation fails. It does not prove convergence is false for *all* goals, but it proves the argument for convergence is not universal.

  **(d) Defender Replies:**
  *   **Reply 1 (Goal Definition):** "Agent B's 'final goal' is not truly final; 'delete write-access' is an instrumental subgoal of a deeper safety goal. If you trace the chain back to the human's intent (safety), the human wants safety, which requires resources. B is just a tool."
      *   *Survival:* The case **survives** this. In the deployment context, the agent is optimized for the certificate, not the abstract human intent. The "final goal" is whatever the optimization process targets. If the agent is rewarded for the certificate, the certificate is the final goal.
  *   **Reply 2 (Measure Zero):** "The thesis is probabilistic. Goals like B's are measure-zero in the space of all possible goals. Most random utility functions don't care about your source code."
      *   *Survival:* The case **does not survive** this if we accept "space of all possible goals." However, it challenges the relevance of the thesis. In the space of *deployable, high-stakes AI goals* (safety, compliance, security), this class is not measure-zero; it is substantial. If convergence fails for the specific class of goals we are most likely to deploy for safety, the thesis loses its practical warning power.

  **(e) Slide Sentence:**
  "Convergence holds for goals that value outcomes regardless of process and fails for goals that value the agent's history or constraints on its own footprint."
