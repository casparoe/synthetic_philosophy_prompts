  **Epistemic Note**

  The column leans on standard permissivism: if options are equal, either is permissible. This is orthodoxy, though some argue rationality requires randomizing to break symmetry. The tie-breaking complaint reflects a genuine debate: does adding a trivial reason dissolve indifference or solve it? Many agree it changes the case rather than resolving the original tie. The coin regress is contested; some say randomization needs justification (why trust the coin?), others say it's a basic rational tool. The 'hard choice' view (options unranked, will creates reasons) is associated with specific contemporary metaphysics, not universal consensus. Exact ties are often treated as probability zero in continuous models, but discrete cases allow them. I've treated permissivism as more helpful than it is, and smoothed over the dispute about whether 'will' can create reasons ex nihilo. The joke works because the theory describes the stalemate without breaking it. The donkey is a nod to Buridan, though the literature avoids him.
