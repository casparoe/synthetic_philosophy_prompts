  Thank you for coming. It feels right to be standing here, in the dirt and the light, rather than inside a hall. She spent thirty years as a district nurse, going into other people's homes, dealing with what was real and messy and urgent. She didn't have time for pretence. And she spent twenty years keeping bees, badly and loudly. If you were standing near the hedge in August, you knew it. She wasn't trying to produce honey; she just wanted to keep them alive. That was her measure of a life well spent: keeping things going, keeping people safe, not making a fuss. She understood that care is often quiet, and sometimes it is loud.

  When the diagnosis came at seventy-two, everyone told her it was just age. She knew better. She watched herself change. At seventy-four, she sat with her GP and wrote down a request. She laid out a boundary. She had a fierce thing about not being a burden, something our family has spent a lot of time dissecting since March. But I don't think it was about guilt. It was about care. She had spent three decades caring for strangers; she wanted to spare us the hardest parts of caring for her. She made a plan for the end of her story while she was still the one holding the pen.

  But a story changes when the writer changes. By last spring, she was seventy-nine. The woman who wrote that request was sharp, fearful of decline, and decisive. The woman in the garden that final week was different. She had maybe two good sentences an hour. She didn't always know my mother's face. But she was cheerful. She hummed along to the radio in the afternoons. The nurse who cared for her then is here today, and she will tell you there was joy in those moments. There was no visible suffering. There was only a woman sitting in the sun, content.

  This leaves us with a difficult thing to hold. Some of us look at the woman who signed the paper and see the true authority. Some of us look at the woman humming in the garden and see the only truth that matters. I have spent a long time trying to find a line between them, a point where the first woman ended and the second began. I cannot find it. The slope was gradual. The change was continuous. To say one was real and the other a remnant feels like a lie. They were both her. The one who planned for death and the one who found joy in life were connected by the same history, the same blood, the same stubborn kindness. If I privilege the planner, I ignore the joy she found in the end. If I privilege the hummer, I ignore the fear she lived with for years. Neither feels like the whole truth. So I am standing in the middle, with both of them.

  What I can say is that she loved this garden. She loved the noise of the bees and the quiet of the evening. She loved us, even when she couldn't name us. And she left us with a puzzle that we don't need to solve today. We don't need to decide if the plan honoured the person, or if the person outgrew the plan. We can hold both truths without breaking them. We can honour the nurse who wanted to control the end, and the patient who found comfort in the middle.

  Uncle Paul is here, and the nurse is here, and the neighbours are here. We all saw different parts of the last three years. Some of us watched the decline closely; some of us remember the worker she was before the illness. We all hold different pieces of her. That is okay. Grief doesn't require consistency. It just requires honesty. So let's not turn her into a heroine of autonomy, and let's not turn her into a victim of circumstance. She was just a woman who kept bees badly, cared for people well, and tried to leave the room before the lights went out completely.

  Remember her for the work. Remember her for the garden. Remember that she was here, in all her forms, and that was enough. We don't need to agree on how she left to agree on who she was. Thank you.

  ***

  **Note on cutting:** If you lose your nerve in the third minute, cut the second half of the fourth paragraph (from "If I privilege the planner..." to "...with both of them."). It is the most philosophically dense section. Removing it leaves the assertion ("They were both her") standing on its own, which is emotionally safer to deliver if you feel yourself faltering, and it saves about 50 words without breaking the flow into the fifth paragraph.
