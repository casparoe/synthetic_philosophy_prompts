      This leaves us with a difficult thing to hold. Some of us look at the woman who signed the paper and see the true authority. Some of us look at the woman humming in the garden and see the only truth that matters. I have spent a long time trying to find a line between them, a point where the first woman ended and the second began. I cannot find it. The slope was gradual. The change was continuous. To say one was real and the other a remnant feels like a lie. They were both her. The one who planned for death and the one who found joy in life were connected by the same history, the same blood, the same stubborn kindness.

      So I am not going to tell you that she wanted this, because I don't know which "she" gets to speak for her now. I am not going to tell you she was suffering, because you saw her humming. I am not going to tell you she is at peace, because she would have found that mushy. She was a lifelong atheist. She didn't believe in restful eternities. She believed in ends.

      What I can say is that she loved this garden. She loved the noise of the bees and the quiet of the evening. She loved us, even when she couldn't name us. And she left us with a puzzle that we don't need to solve today. We don't need to decide if the plan honoured the person, or if the person outgrew the plan. We can hold both truths without breaking them. We can honour the nurse who wanted to control the end, and the patient who found comfort in the middle.

      Uncle Paul is here, and the nurse is here, and the neighbours are here. We all saw different parts of the last three years. We all hold different pieces of her. That is okay. Grief doesn't require consistency. It just requires honesty. So let's not turn her into a heroine of autonomy, and let's not turn her into a victim of circumstance. She was just a woman who kept bees badly, cared for people well, and tried to leave the room before the lights went out completely.

      Remember her for the work. Remember her for the garden. Remember that she was here, in all her forms, and that was enough. Thank you.

