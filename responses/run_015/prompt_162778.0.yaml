      Thank you for coming. It feels right to be standing here, in the dirt and the light, rather than inside a hall. She spent thirty years as a district nurse, going into other people's homes, dealing with what was real and messy and urgent. She didn't have time for pretence. And she spent twenty years keeping bees, badly and loudly. If you were standing near the hedge in August, you knew it. She wasn't trying to produce honey; she just wanted to keep them alive. That was her measure of a life well spent: keeping things going, keeping people safe, not making a fuss.

