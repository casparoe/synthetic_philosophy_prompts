prompt: |-
  I'm in an advanced philosophy of religion course working on Gödel's modal ontological argument—the formulation that defines divinity via possession of all positive properties, invokes modal logic to derive necessary existence from mere possibility, and counts existence among those positive properties. I also spend considerable time with formal verification, so I'm fluent in accessibility frames, invariants, state-transition systems, satisfiability, and the distinction between a specification holding in some reachable state versus in all reachable states.

  Please restate Gödel's argument in that verification vocabulary as faithfully as you can: translate positive properties into invariant predicates, possible worlds into states within an accessibility frame, the modal axioms into constraints on reachability, and necessary existence into universal satisfaction across all reachable states. Then report precisely what does not survive the translation. Is there a counterpart in verification for the normative or evaluative force of calling a property positive, as opposed to merely consistent or invariant? Can the inference from satisfiability in one reachable state to universal satisfaction across the frame be justified within standard model-checking practice without importing an extra metaphysical principle? And what becomes of the claim that existence is itself one of the properties included in the specification, given that verification typically treats existence as a feature of the model rather than an internal predicate? I want to know whether the residue—whatever cannot be expressed in this vocabulary—reflects a genuine limitation of the formal-verification framework, or whether it indicates that parts of Gödel's original argument depend on distinctions that do not do independent philosophical work.
