answer: |-
  This is a sharp distinction you've drawn between the **Recognition Claim** (performance at $t_0$) and the **Concept Claim** (shared representational structure). You are correct that the literature frequently conflates them. The failure of a newly sighted patient to match a sphere to a cube is treated as evidence that they lack a modality-independent concept of "shape," when it may simply evidence a failure to calibrate a translation function between two existing, distinct shape representations.

  For a lab of your size (5–6 people) and methodological profile (behavioral + fMRI, no modeling), you need questions that are high-leverage theoretically but tractable without needing rare clinical populations or complex computational architectures.

  Here is the agenda I recommend, ordered by strategic priority.

  ### 1. The Representational Bottleneck: Concepts vs. Mappings
  **Priority:** First  
  **Status:** Upstream of everything else.

  This is the core of your hypothesis and the most valuable theoretical contribution you could make. If the deficit is purely mapping (translation), then the "Concept Claim" is false: modality-independent structure exists, but access is blocked. If the deficit is conceptual, then vision and touch construct shape ontology differently from the ground up.

  *   **Why it is upstream:** You cannot meaningfully investigate *how* transfer occurs (asymmetry, timecourse) until you define *what* is being transferred. If there is no shared concept, "transfer" is a misnomer; it's actually new learning. If there is a shared concept, "transfer" is an access problem. This binary determines the interpretation of every subsequent experiment you run.
  *   **Tractability (Behavioral + fMRI):** Since you cannot easily recruit newly sighted patients for a small lab, you must model the "naïve vision" state using sensory substitution devices (SSDs) or brief monocular deprivation in sighted adults, combined with rapid perceptual learning paradigms.
      *   **The fMRI Play:** Use Representational Similarity Analysis (RSA). You can test whether the neural representational geometry of shapes in visual cortex (LOC) and somatosensory cortex aligns *before* behavioral cross-modal matching is possible. If neural patterns correlate at $t_0$ but behavior fails, you have empirical evidence for the "Mapping Deficit" hypothesis. This bypasses the need for computational modeling by using neural data as the structural proxy.
      *   **The Behavioral Play:** Use interference paradigms. If a tactile shape task interferes with a concurrent visual shape task (and vice versa) more than a control task, it suggests shared conceptual resources even if explicit matching fails.
  *   **Evidence to Move It Up/Down:**
      *   **Up:** If you find neural representational alignment (via RSA) in the absence of behavioral matching success. This would be a high-impact paper (*Nature Human Behaviour* level) because it dissociates the Recognition and Concept claims empirically.
      *   **Down:** If neural patterns are entirely modality-specific even after behavioral success is achieved. This suggests the "Concept Claim" is false, and you should pivot to studying how new concepts are constructed rather than mapped.

  ### 2. The Directional Asymmetry of Transfer
  **Priority:** Second  
  **Status:** High empirical yield, lower theoretical risk.

  Most Molyneux work focuses on Touch-to-Vision (T$\to$V). However, the reverse (Vision-to-Touch, V$\to$T) is rarely tested with the same rigor, despite the fact that sighted individuals constantly map vision to touch (e.g., reaching for an object). Investigating the asymmetry tells you where the bottleneck lies: is it in the encoding of the source modality or the decoding of the target?

  *   **Why it is second:** This question only becomes theoretically coherent once you have a stance on Question 1. If concepts are shared (Q1), asymmetry reveals ecological or resolution constraints (e.g., vision is better at global shape, touch at local texture). If concepts are *not* shared, asymmetry simply reflects which modality is better at constructing the concept de novo. You need the answer to Q1 to interpret the results of Q2.
  *   **Tractability:** This is highly tractable for a 5-person behavioral lab. You can run large-N studies with sighted participants using haptic devices and visual displays. You don't need patient populations. You can manipulate stimulus complexity (global vs. local features) to see if asymmetry flips based on the *type* of shape information.
  *   **Evidence to Move It Up/Down:**
      *   **Up:** If you find a robust asymmetry that interacts with stimulus type (e.g., T$\to$V fails for global shape but V$\to$T succeeds, while T$\to$V succeeds for texture). This suggests the "Concept Claim" is too coarse; it's not about "shape" generally, but specific geometric primitives.
      *   **Down:** If transfer is perfectly symmetric. This would be surprising but would suggest the bottleneck is purely amodal (e.g., attentional or working memory), pushing you toward more general cognitive mechanisms rather than perceptual ones.

  ### 3. (Methodological Prerequisite) The Timecourse of Delayed Recognition
  **Priority:** Embedded in Q1  
  **Status:** Necessary hygiene, but not a standalone goal.

  You listed "what the delayed-recognition results actually do and do not establish" as a candidate. I advise against making this a standalone research aim for a 4–5 year plan. Instead, treat it as the methodological engine for Question 1.

  The classic cataract studies (e.g., Held et al., 2011) show recognition emerging over days. The field assumes this delay reflects "learning to see." Your lab should test whether this delay reflects **calibration** (aligning two existing maps) or **construction** (building a new map).

  *   **Why not a standalone priority:** Re-interpreting old clinical data is theoretical work. Generating new clinical data is beyond your resources. However, measuring the *learning curve* in your sighted/simulated models is essential data for Q1.
  *   **Strategy:** Don't publish a paper on "what delayed recognition means." Publish a paper on "Neural alignment precedes behavioral matching in cross-modal transfer," using the timecourse of learning as your independent variable.

  ### The Overrated Trap: "Innate Cross-Modal Common Currency"
  **Candid Assessment:** Avoid this.

  The question of whether there is an **innate** common currency is philosophically prestigious but empirically toxic for a lab with your constraints.

  1.  **Methodological Mismatch:** To test "innateness," you ideally need infant data (looking time, EEG) or genetic markers. You have behavioral adults and fMRI. You can infer *structure*, but you cannot infer *innateness* without a developmental timeline you cannot access.
  2.  **The "Nativist" Dead End:** Even if you find shared structure in adults (via RSA), critics will correctly argue this could be the result of early multisensory experience (before age 2), not innateness. You will get bogged down in a debate you cannot win with your tools.
  3.  **Low Payoff:** For a cognitive scientist, whether the structure is innate or acquired by age 3 matters less than whether it exists and how it functions *now*. The "Concept vs. Mapping" question is functionally more relevant to perception than the "Innate vs. Learned" question.

  ### Summary of the 5-Year Plan

  *   **Years 1–2:** Focus entirely on **Question 1 (Concepts vs. Mappings)**. Develop the fMRI RSA paradigm. Use sighted participants with sensory substitution or brief deprivation to model the $t_0$ state. Aim to dissociate neural alignment from behavioral success.
  *   **Years 3–4:** Pivot to **Question 2 (Asymmetry)**. Once you know *what* is shared, map the *flow*. Run large behavioral studies comparing T$\to$V and V$\to$T transfer rates across different geometric primitives.
  *   **Year 5:** Synthesis. Integrate the neural structural data with the behavioral asymmetry data to propose a new model of cross-modal architecture that replaces the binary Molyneux "Yes/No" with a "Structure vs. Access" framework.

  This agenda leverages your fMRI capacity to answer the philosophical "Concept Claim" without getting stuck in philosophical argumentation, and it keeps your behavioral team productive on the "Asymmetry" question which yields clean, publishable data even if the fMRI results are noisy. It respects your constraint (no modeling) by using neural patterns as the proxy for structure.
