answer: |-
  This is a remarkably sharp observation. You have identified a genuine methodological tension in historiography that often goes unacknowledged. You are essentially describing a **Normative Causal Asymmetry**, though it doesn't have a single, canonical "eponymous" name like "Gresham's Law."

  However, there are several concepts in the philosophy of history and social psychology that map onto this. Here is a breakdown of what you're seeing, how it differs from standard biases, and what historical cases might break the pattern.

  ### 1. Does it have a name?

  There isn't one universal term, but it is discussed under a few overlapping labels:

  *   **Teleological Sanitization:** This captures the "Whig History" element. If history is a march toward progress (liberal democracy), then the structural forces driving that progress are "real." Violence that impedes or tarnishes that progress is treated as noise, deviation, or accident, rather than signal.
  *   **The Ultimate Attribution Error (Group Level):** In social psychology, the Fundamental Attribution Error (FAE) is about individuals. The *Ultimate* Attribution Error is about groups: we attribute our group's successes to disposition/structure ("We won because we are just/inevitable") and our group's failures/violence to situational factors ("We killed because we were provoked/panicked"). Historians who identify normatively with the Revolution's *goals* (liberty, equality) treat the Revolution as the "in-group" and the Terror as an "out-group" deviation.
  *   **Causal Granularity Shift:** This is a more technical description. When explaining outcomes we value, we zoom *out* to structural causes (making them robust and inevitable). When explaining outcomes we disvalue, we zoom *in* to contingent details (making them fragile and avoidable).
  *   **The Furet Critique:** In French Revolution specifically, the historian **François Furet** (*Interpreting the French Revolution*, 1978) is the key figure here. He argued against the Marxist (structural) view that the Terror was a necessary defense of the revolution. But he *also* argued against the Liberal (contingency) view that it was just an accident. Furet argued the Terror was **structural to the ideology itself** (the discourse of virtue and will). If you feel the historians you're reading are separating the "Good Revolution" from the "Bad Terror," you are noticing the **Liberal Revisionist** attempt to salvage the Revolution's legacy by isolating the Terror as a contingent aberration.

  ### 2. How is this different from Motivated Reasoning or FAE?

  It is not *different* in mechanism, but it is different in **methodological camouflage**.

  *   **Motivated Reasoning** is the psychological engine. You are correct that this is motivated reasoning. However, in historiography, this reasoning gets codified into **causal frameworks**. It's not just "I feel Robespierre was bad"; it's "I will adopt a methodological commitment to contingency *specifically when analyzing violence*." This makes it harder to spot because it looks like a rigorous choice of lens rather than an emotional reaction.
  *   **Fundamental Attribution Error:** As noted above, this is essentially a temporal/group-level FAE. The distinction is that in history, "Situation" = Structure/Inevitability and "Disposition" = Agency/Contingency.
      *   *Standard FAE:* "He yelled because he's angry (Disposition), I yelled because I was stressed (Situation)."
      *   *Historical Asymmetry:* "The Constitution happened because of Class Forces (Situation/Structure), The Guillotine happened because Robespierre was paranoid (Disposition/Agency)."
      *   *Why it matters:* It allows historians to claim the **benefits** of structural analysis (grand narratives, deep insight) for the "good" parts, while claiming the **benefits** of agency analysis (moral accountability, avoidability) for the "bad" parts. It's the best of both worlds, epistemically speaking.

  In rationalist terms, this is **Motivated Stopping** applied to causal chains. You stop digging for structural causes once you hit a "bad" outcome, because finding a structural cause for mass murder would implicate the system you are defending.

  ### 3. What case would change your mind? (The Counter-Example)

  To break this framing, you need a historical event where **structural forces produced liberal reform and mass violence inextricably**, such that you cannot surgically remove the violence without dissolving the reform.

  **A. The Haitian Revolution (1791–1804)**
  This is the strongest counter-example to the French case.
  *   **The Structure:** A racialized plantation economy based on chattel slavery.
  *   **The Reform:** The abolition of slavery and creation of a black republic.
  *   **The Violence:** Extreme, pervasive, and total.
  *   **Why it breaks the asymmetry:** You cannot argue the violence was a "contingent accident" or "paranoia." The structural power of the planters and the French state was so immense that *only* extreme, structural violence could break it. The violence was not a deviation from the revolution; it was the **mechanism** of the revolution. If you apply the "contingency" frame here, you imply slavery could have been ended peacefully, which most historians find structurally implausible. If you apply the "structural" frame, you must accept the violence as inherent to the liberation.

  **B. The Enclosure Acts / Primitive Accumulation (18th Century Britain)**
  *   **The Structure:** The shift from feudal agrarianism to capitalist market agriculture.
  *   **The Reform:** Massive increase in agricultural efficiency, urbanization, and eventual industrial wealth (the "Good" of capitalism).
  *   **The Violence:** Mass dispossession, vagrancy laws, starvation, and state violence against peasants.
  *   **Why it breaks the asymmetry:** There is no "Robespierre" to blame. There was no "panic." The violence was administrative, legal, and structural. It was the *price* of the efficiency. You cannot say "The efficiency was inevitable, but the dispossession was an accident." They were the same process. This forces the historian to admit that "progress" often has a structural body count.

  **C. The American Civil War**
  *   **The Structure:** The contradiction between a slave economy and a free-labor capitalist economy within one polity.
  *   **The Reform:** Emancipation and preservation of the Union.
  *   **The Violence:** 750,000 dead.
  *   **Why it breaks the asymmetry:** While some argue war was avoidable (contingency), the structuralist argument is strong: the contradiction was irrepressible. If the reform (Emancipation) was structurally necessary, the violence was likely structurally necessary too. You cannot easily argue "Emancipation was inevitable, but the Battle of Antietam was an ideological accident."

  ### Summary for your mental model

  You have identified **Normative Causal Asymmetry**.

  *   **The Mechanism:** Zooming out (Structure) for valued outcomes, zooming in (Contingency) for disvalued outcomes.
  *   **The Rationalist Diagnosis:** Motivated Stopping on causal chains + Group-level Fundamental Attribution Error.
  *   **The Test:** Look for cases where the "Good" outcome *requires* the "Bad" mechanism structurally (Haiti, Enclosures). If the historian tries to separate them there, their framework breaks.

  You aren't overfitting. This is a recognized issue in the philosophy of history, often hidden behind debates about "determinism." You've just isolated the specific *valence-dependent* application of it.
