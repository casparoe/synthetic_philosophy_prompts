answer: |-
  **Assessment of the Idea**
  This is not a taxonomy in search of an argument; it is a boundary-condition test for two dominant theories of social norms. However, it is at risk of becoming merely lexical (i.e., "what do we *call* this?") unless you anchor it in *explanatory mechanisms*. The proposal below sharpens the focus onto *why* agents conform in terminal cases, forcing a choice between psychological/expectational mechanisms (Lewis) and historical/learning mechanisms (Evolutionary). Regarding your three dimensions: **Payoff Structure** and **Agent Opportunity** are not fully independent. If "payoffs" include future reputational benefits, removing future interaction (Agent Opportunity) necessarily alters the Payoff Structure. The proposal handles this by stipulating "intrinsic payoffs" (immediate coordination value) versus "extrinsic payoffs" (future consequences), treating the terminal case as one where extrinsic payoffs are zeroed out while intrinsic payoffs remain constant.

  ***

  **Working Title**
  The Last Round: Terminal Instances and the Explanatory Limits of Convention

  **Abstract**
  Standard accounts of convention, whether grounded in common knowledge or evolutionary learning, presuppose recurrence. Agents conform because they expect others to conform again, or because they have been trained to do so. This project investigates "terminal instances": coordination problems faced by a population that will never interact again. In such cases, agents often conform despite the absence of future expectations or learning dynamics. This fellowship will determine whether terminal conformity constitutes a distinct normative genus—borrowed from agreement or precedent—or whether it preserves standard accounts by treating convention as a modal rather than temporal property. Using a structured case-comparison method, the project will map the space of recurrence to isolate the explanatory mechanism driving terminal conformity. The results will clarify whether current theories of convention require revision to account for the end of social relationships, or whether a significant class of putative conventions is misclassified.

  **Project Proposal**

  **1. The Research Question**
  Do agents conform in terminal coordination instances because of *convention* or because of *borrowed normativity*?
  Standard theories define convention through recurrence. The common-knowledge account requires expectations of future conformity; the learning-dynamic account requires repeated interaction to stabilize behavior. Both theories are silent on the "last round" problem: a committee's final vote, a firm's last payment, a dissolving group's final coordination. Agents in these cases conspicuously conform, citing convention-like reasons ("that is how we do it").
  This project asks a determinate question: Is the explanation for this conformity continuous with standard convention, or does it rely on a different normative source? This is answerable in one semester by constructing a specific space of cases and testing which explanatory model fits the intuitions and reasons agents offer.

  **2. Conceptual Framework and Dimensions of Recurrence**
  To answer this, the project must first validate the space of cases. The proposal identifies three dimensions of recurrence: (1) Problem Form (type of coordination game), (2) Agent Opportunity (same players interacting again), and (3) Payoff Structure (rewards for conformity).
  A potential collapse exists between Agent Opportunity and Payoff Structure. If payoffs include reputational value, removing future interaction (Agent Opportunity) automatically alters the Payoff Structure. To prevent this collapse from trivializing the terminal case, the project stipulates a distinction between *intrinsic payoffs* (immediate coordination success) and *extrinsic payoffs* (future benefits). The terminal case is defined as one where intrinsic payoffs and Problem Form remain constant, but Agent Opportunity is zero.
  This creates a diagnostic gap. The common-knowledge account predicts conformity should drop without future expectations. The learning account predicts instability without reinforcement history. If conformity persists, either (a) convention is modal (based on counterfactual recurrence), or (b) the behavior is not conventional but derives from prior agreement or authoritative precedent.

  **3. Methodology and Timeline**
  Straight conceptual analysis is insufficient because it risks begging the question against the "modal" defense of Lewis. Simulation is inappropriate because terminal cases are, by definition, outliers not captured by equilibrium dynamics. Instead, I will employ a **Structured Case-Construction Method**. This involves generating a matrix of vignettes varying the three dimensions independently to isolate the specific intuition driving conformity.

  *   **Month 1: Case Construction.** Develop 12 vignettes crossing the three dimensions (e.g., Same Problem/No Future vs. New Problem/No Future). Ensure intrinsic payoffs are held constant across all scenarios to prevent the payoff/opportunity collapse.
  *   **Month 2: Intuition Testing.** Circulate vignettes to a control group of non-specialist philosophers and social scientists. The goal is not statistical significance but to identify the "reasons for conformity" agents offer in the text (e.g., "I expect them to" vs. "I am bound by the past").
  *   **Month 3: The Modal Test.** Analyze responses to determine if agents appeal to counterfactuals ("If we met again, we would do this"). If yes, the Lewisian account survives via modal generalization. If no, the project moves to the Borrowed Normativity hypothesis.
  *   **Month 4: The Borrowed Normativity Test.** Evaluate whether terminal conformity is better explained by prior explicit agreement or institutional precedent. This involves comparing terminal vignettes against clear cases of contract and clear cases of habit.
  *   **Month 5: Synthesis and Write-up.** Commit to one diagnosis. Draft the final paper arguing for either a revision of the common-knowledge account or the identification of a distinct normative genus.

  **4. Possible Results and Decision Criteria**
  There are three live outcomes:
  1.  **The Modal Result:** Agents conform because they believe the regularity *would* persist were the game repeated. *Decision:* The standard account is preserved but generalized modally.
  2.  **The Borrowed Result:** Agents conform because they feel bound by the *history* of the relationship (precedent/contract), not the regularity itself. *Decision:* A large class of putative conventions is misclassified; a new category is required.
  3.  **The Deflationary Result:** Terminal cases are simply conventions under a type-level description; the token-level termination is irrelevant. *Decision:* The project concludes that recurrence is not constitutive of convention, only heuristic.
  I will commit to outcome (2) or (3) if Month 3 data shows agents do not appeal to counterfactual expectations. I will commit to (1) if counterfactual appeal is dominant.

  **5. Risks and Scope**
  **Failure Conditions:** The project fails if the intuition data is equivocal (e.g., agents offer mixed reasons with no dominant pattern) or if the distinction between "intrinsic" and "extrinsic" payoffs proves unstable in the vignettes.
  **Scope Creep:** The project is too big if it attempts to construct a full positive theory of "borrowed normativity." The scope is restricted to the *classification* of the terminal case, not the full metaphysics of the alternative source. If the Borrowed Result emerges, the fellowship concludes by arguing for the misclassification, leaving the positive theory of the alternative source for future work.
  **Feasibility:** With one part-time RA to assist in vignette refinement and data organization, the case-construction method is achievable within five months. The light teaching load allows for the necessary iterative refinement of the cases in Months 1 and 2.
