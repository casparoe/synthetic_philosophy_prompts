      *   **Context:** The user sits on an internal review board (IRB) of a research institute.
      *   **Problem:** Any one of eight senior researchers can unilaterally authorize high-consequence experiments. Downsides are borne by everyone.
      *   **Debate:** One faction argues this is like the "winner's curse" in common-value auctions. They suggest no veto/unanimity, but rather individual "bid shading" (authorize only if still worth it conditional on being the most optimistic). Another faction argues the analogy supports near-unanimity.
      *   **User's Worries:** The actor doesn't pay the price (others do), no track record for calibration, disagreement might be about values not facts.
      *   **Task:** Audit the analogy.
      *   **Structure:** Six specific sections with word count constraints.
          1.  The mapping (~150 words, table ok).
          2.  Where the analogy genuinely holds (~100 words).
          3.  The disanalogies that matter (~250 words, ranked, separate from decorative).
          4.  What the auction frame quietly imports (~100 words).
          5.  Verdict on shade, don't veto (~150 words).
          6.  A better analogy (~100 words).

  2.  **Drafting - Section by Section:**

      *   **Section 1: The mapping.**
          *   Need to map: Researcher -> Bidder, Shared Value -> True Risk/Benefit, Private Estimate -> Individual Assessment, Winning Bid -> Authorization Decision, Overpayment -> Negative Consequence, Other Bidders -> Other Board Members.
          *   Constraint: ~150 words.
          *   Draft:
              | Auction Element | Institute Element |
              | :--- | :--- |
              | Bidder | Senior Researcher |
              | Common Value | True Net Benefit/Risk of Experiment |
              | Private Estimate | Individual Assessment of Safety/Value |
              | Winning Bid | Unilateral Authorization |
              | Overpayment | Realized Harm/Downside |
              | Other Bidders | Remaining Board Members |
              | Winner's Curse | Authorization driven by most optimistic error |
              | Bid Shading | Conservative Authorization Threshold |
              In this mapping, the "price" paid is the risk incurred. The winner (authorizer) secures the "item" (experiment proceeds). The curse arises because the authorization occurs only when the most optimistic estimate exceeds the threshold, likely implying an overestimation of benefit or underestimation of risk relative to the true common value. The downside is shared, akin to a consortium paying the price, though the decision power lies with the single winner.

      *   **Section 2: Where the analogy genuinely holds.**
          *   Focus: Selection effect on noisy estimates.
          *   Constraint: ~100 words.
          *   Draft:
              The core mechanical insight holds: selection bias on extreme values. If eight researchers independently estimate risk/benefit with noise, the maximum estimate will statistically exceed the true value. Authorization depends on *any* estimate crossing a threshold, just as a sale depends on *any* bid exceeding the reserve. Therefore, the set of authorized experiments is disproportionately drawn from cases where at least one researcher was overly optimistic. This statistical inevitability means that without adjustment, the aggregate portfolio of experiments will be riskier than the average individual assessment suggests. The logic of conditioning on being the pivotal agent is mathematically sound regarding error propagation.

      *   **Section 3: The disanalogies that matter.**
          *   Need 3-4 ranked disanalogies. Focus on user's worries (payment, calibration, values).
          *   Constraint: ~250 words.
          *   Draft:
              1.  **Decoupled Incentives (Critical):** In auctions, the winner pays the price. Here, the authorizer reaps the credit (publication, prestige) while the downside (reputation loss, liability) is socialized across the institute. This moral hazard destroys the self-correcting mechanism inherent in auction theory; bidders shade because *they* lose money, not because it's statistically wise.
              2.  **Value vs. Fact (High Impact):** Auctions assume a single common value (e.g., oil reserves). Researchers may disagree on fundamental ethics or risk tolerance, not just noisy measurements of a shared truth. If values differ, "shading" cannot reconcile incompatible utility functions.
              3.  **Lack of Calibration Data (Moderate):** Bidder shading relies on knowing the distribution of errors (how many bidders, error variance). Without a track record of past near-misses or failures, researchers cannot calculate the conditional probability required to shade effectively. They are flying blind.
              4.  **Irreversibility (Minor):** Auctions are financial transactions; high-consequence experiments may involve irreversible harm. This raises the stakes but doesn't fundamentally break the statistical logic, unlike the incentive structure.

      *   **Section 4: What the auction frame quietly imports.**
          *   Focus: Structural assumptions (payoffs, repetition, error, aims).
          *   Constraint: ~100 words.
          *   Draft:
              The frame assumes rational actors maximizing expected utility with known error distributions. It presumes repeated interactions allow learning (calibration) and that all parties share the same utility function regarding the outcome. It imports the assumption that the "price" (risk) is quantifiable and comparable to the "value" (benefit) in a single metric. Crucially, it assumes the winner bears the cost. By using this frame, the "shade, don't veto" faction implicitly assumes researchers are internally motivated to protect the collective good as vigorously as their own private interests, which contradicts the unilateral power structure.

      *   **Section 5: Verdict on shade, don't veto.**
          *   Does the conclusion survive? Why/why not? What does the test require?
          *   Constraint: ~150 words.
          *   Draft:
              The conclusion fails. The "shade, don't veto" argument collapses because the incentive alignment required for bid shading is absent. Researchers will not voluntarily shade because they do not internalize the full cost of failure. Even if they wished to, the conditional test requires knowing the distribution of colleagues' optimism and the true variance of estimates, which is impossible without historical failure data. Furthermore, if disagreements are value-based, no amount of statistical shading resolves the conflict. The analogy supports *caution*, but not the specific mechanism of individual shading without structural constraints. Unanimity or veto power acts as a substitute for the missing price mechanism, forcing the "winner" to negotiate the "price" (risk) with those who will share it.

      *   **Section 6: A better analogy.**
          *   Need a comparison with same insight but less misleading features.
          *   Constraint: ~100 words.
          *   Draft:
              A **nuclear launch key** system is more apt. Multiple actors hold authority, but activation requires concurrence. This captures the high-consequence, shared-downside nature without implying a market transaction. Alternatively, view it as a **public good provision problem with negative externalities**. One person's action benefits them privately but imposes risk on the commons. The solution isn't asking individuals to voluntarily internalize the externality (shade); it's instituting a tax or regulation (veto/unanimity) that aligns private incentives with social costs. The auction model mistakes a governance failure for a statistical estimation error.

