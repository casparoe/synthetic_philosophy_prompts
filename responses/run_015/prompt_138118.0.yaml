  In this mapping, the "price" paid is the risk incurred. The winner secures the "item," meaning the experiment proceeds. The curse arises because authorization occurs only when the most optimistic estimate exceeds the threshold, implying an overestimation of benefit relative to the true common value. The downside is shared, akin to a consortium paying the price, though decision power lies with the single winner. This captures the selection effect but obscures who bears the cost. Crucially, the "bid" is binary, not continuous, limiting the ability to shade gradually. The "payment" is deferred and probabilistic, unlike an auction's immediate financial settlement.

  2. Where the analogy genuinely holds

  The core insight holds: selection bias. If researchers estimate with noise, the maximum estimate will statistically exceed the true value. Authorization depends on *any* estimate crossing a threshold, just as a sale depends on *any* bid exceeding the reserve. Authorized experiments are disproportionately drawn from cases where at least one researcher was overly optimistic. Without adjustment, the portfolio will be riskier than average assessments suggest. Conditioning on being pivotal is mathematically sound.

  3. The disanalogies that matter

  1. **Decoupled Incentives (Critical):** In auctions, the winner pays the price. Here, the authorizer reaps professional credit while downside is socialized across the institute. This moral hazard destroys the self-correcting mechanism; bidders shade because *they* lose money, not because it is statistically wise. Without personal liability, the incentive to shade vanishes. The winner gains privately while the consortium pays, inverting the auction's risk allocation.
  2. **Value vs. Fact (High Impact):** Auctions assume a single common value unknown to all. Researchers may disagree on ethics or risk tolerance, not just noisy measurements. If disagreements stem from incompatible utility functions rather than estimation error, statistical shading cannot reconcile the conflict. One researcher's acceptable risk is another's ethical violation. The common-value assumption is false if the value is subjective.
  3. **Lack of Calibration Data (Moderate):** Bid shading relies on knowing error distributions. Without a track record of past near-misses, researchers cannot calculate the conditional probability required to shade effectively. They are flying blind. Furthermore, high-consequence events are rare by definition, ensuring data remains sparse indefinitely.
  4. **Irreversibility (Minor):** Auctions are financial transactions; experiments may involve irreversible harm. This raises stakes but does not fundamentally break the statistical logic like the incentive structure does.
  The analogy breaks where incentives and epistemology diverge.

  4. What the auction frame quietly imports

  The frame assumes rational actors maximizing expected utility with known error distributions. It presumes repeated interactions allow learning and that all parties share the same utility function. It assumes risk is quantifiable and comparable to benefit. Crucially, it assumes the winner bears the cost. The faction assumes researchers protect the collective good as vigorously as private interests, contradicting the structure. It mistakes governance for statistics.

  5. Verdict on shade, don't veto

  The conclusion fails. The "shade, don't veto" argument collapses because the incentive alignment required for bid shading is absent. Researchers will not voluntarily shade because they do not internalize the full cost of failure. Even if they wished to, the conditional test requires knowing the distribution of colleagues' optimism and the true variance of estimates, which is impossible without historical failure data. Furthermore, if disagreements are value-based, no amount of statistical shading resolves the conflict. The analogy supports *caution*, but not the specific mechanism of individual shading without structural constraints. Unanimity or veto power acts as a substitute for the missing price mechanism, forcing the "winner" to negotiate the "price" with those who will share it.

  6. A better analogy

  A **nuclear launch key** system is more apt. Multiple actors hold authority, but activation requires concurrence. This captures the shared-downside nature without market assumptions. Treat it as a **negative externality** problem. One person's action benefits them privately but imposes risk on the commons. The solution is not voluntary internalization, but regulation (veto) aligning private incentives with social costs. The model mistakes governance for statistics.
