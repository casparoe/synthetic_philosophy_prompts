  Dear friend,

  It is great that you are reading closely enough to feel that something in that summary does not quite sit right with your intuition about relationships and infrastructure projects, because your skepticism is actually shared by a significant number of economists and psychologists who have revisited the sunk cost literature in the decades since those classic experiments were published. The summary you provided conflates descriptive findings with normative judgments and then leaps to a policy prescription that does not necessarily follow, so let us walk through it sentence by sentence to separate the settled ground from the genuinely contested areas.

  The first sentence claims that classic experiments by Arkes and Blumer showed people who paid more for a theater subscription attended more plays and that in a hypothetical mountain trip scenario people chose a more dangerous mountain based on prior investment. On the first half of this claim, the ground is fairly settled in terms of the raw data, as Arkes and Blumer did indeed find in their 1985 paper that participants who paid full price for a season subscription attended more plays during the first half of the season than those who received a discount, suggesting a correlation between price paid and usage. However, the second half of that sentence contains a factual misrepresentation regarding the specific experiments, as the famous mountain scenario involving Mount Logan and Mount Olympus was not part of the original Arkes and Blumer study but rather comes from later work by researchers like Friedland, and the original Arkes and Blumer hypothetical involved overlapping ski trips rather than mountain climbing choices. While this might seem like a trivial detail, it matters because different scenarios trigger different psychological mechanisms, and conflating them suggests a uniformity in the evidence that does not exist. What is settled here is simply that people frequently exhibit behavior correlated with past investments, but why they do so is where the summary begins to drift from consensus into contention.

  The second sentence is where the summary becomes most controversial by stating that the authors concluded people are irrational because they are cognitively unable to discount past investments and that this is a pure cognitive error in the same class as the conjunction fallacy. It is true that Arkes and Blumer interpreted their findings as evidence of irrationality violating the standard economic model where only marginal costs and benefits should matter, and it is settled ground that standard neoclassical theory defines sunk costs as irrelevant to future decision making. However, the claim that this is a pure cognitive error equivalent to the conjunction fallacy is heavily contested among modern researchers because the conjunction fallacy is a logical impossibility whereas sunk cost behavior can be rational under broader utility functions. A defender of the view that sunk costs genuinely matter would object here by pointing out that past investments often carry informational value or social signaling weight that makes them relevant. For example, in the case of a half-built bridge, abandoning the project might signal incompetence to investors or voters, damaging future funding opportunities, so continuing the project preserves reputation capital which is a real future asset. Similarly, in long research programs or bad relationships, there is often a psychological utility derived from completion or consistency, meaning the act of finishing has value in itself that was not present at the start, so the cost is not truly sunk if the utility function includes the satisfaction of not wasting prior effort. By labeling it a pure cognitive error, the summary dismisses these ecological rationalities where honoring past investment serves a strategic or psychological purpose, and this is where your intuition about relationships and bridges is actually supported by serious economic literature such as the work by McAfee and colleagues who argue that sunk costs can serve as credible signals of commitment.

  The final sentence argues that any policy forcing people to confront their sunk costs, such as requiring an explicit accounting of past spending, will improve their decisions, and this claim follows from neither the settled ground nor the contested views but rather seems to contradict what we know about psychological salience. Even if we accept the premise that the sunk cost effect is always a bias, making past spending more salient through explicit accounting would likely exacerbate the problem rather than solve it, because drawing attention to the loss usually intensifies loss aversion rather than dampening it. Most debiasing techniques suggest encouraging people to imagine they have not yet made the investment or to focus strictly on future outcomes, whereas requiring an accounting of past spending forces the mind to linger on the irrecoverable cost, potentially locking them further into the irrational behavior. Furthermore, if we accept the contested but plausible view that honoring sunk costs is sometimes rational for reasons of reputation or completion utility, then a policy designed to force people to ignore those costs could actively harm decision quality by stripping away valuable contextual information. Therefore, the policy claim is the weakest link in the summary because it assumes a specific mechanism for the error and a specific mechanism for the cure without evidence for either, and it ignores the possibility that the behavior being corrected is sometimes adaptive.

  To summarize the landscape for you, it is settled that people often behave as if past costs matter and that standard economic theory says they should not, but it is genuinely contested whether this behavior is always irrational or merely rational under a more complex set of constraints including reputation, signaling, and psychological completion. The summary you read presents the strongest, most dismissive version of the behavioral economics critique as if it were consensus fact, ignoring the substantial literature that suggests sunk costs can be informative or that the utility of consistency is a valid preference. Your leaning toward the view that honoring sunk costs is often rational is not just a layperson hunch but aligns with a robust critique within the field that warns against labeling all deviations from the simplest economic model as cognitive errors, and you are right to be suspicious of policy prescriptions that claim to fix human behavior based on such a narrow interpretation of the evidence. I hope this helps you navigate the literature with more confidence in your own critical reading.

  Best regards,

