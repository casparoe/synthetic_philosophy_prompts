      *   *Thesis 3: The Asymmetry.* Pain is bad even for potential people; pleasure is not good.
          *   Test 1: 5B better (avoiding risk of bad lives? Or just neutral addition?). Usually implies we shouldn't create the 10B if they are barely living, but doesn't necessarily say 5B is *better*, just that adding the extra 5B isn't *good*.
          *   Test 2: Addition is neutral.
          *   Test 3: Addition is neutral.
          *   Verdict: Substantive. Blocks RC. Also makes Extinction neutral (mostly). Contradicts friend.

      *   *Thesis 4: Critical Level Utilitarianism.* Lives must be above 'Critical Level' (not just 'Worth Living') to add value.
          *   Test 1: 5B wins (assuming wonderful > critical, barely < critical).
          *   Test 2: If added lives < critical, addition is bad/neutral.
          *   Test 3: If barely < critical, planet adds no value.
          *   Verdict: Substantive. Blocks RC. *Can* allow Extinction to be bad if future lives would be *excellent* (above critical). This fits the friend best! It distinguishes between "barely worth living" (RC) and "excellent" (Extinction loss).

      *   *Thesis 5: Incomparability.* Different numbers = no comparison.
          *   Test 1: No verdict.
          *   Test 2: No verdict.
          *   Test 3: No verdict.
          *   Verdict: Radical. Blocks RC. Makes Extinction verdict impossible. Contradicts friend.

      *   *Thesis 6: Zero Sum Creation.* Creating a life adds exactly zero value to the universe, always.
          *   Test 1: 5B better (more intensity per person? Or just equal?). If value is average, 5B wins. If total, they are equal.
          *   Test 2: Neutral.
          *   Test 3: Neutral.
          *   Verdict: Radical. Contradicts friend's extinction claim.

  6.  **Synthesizing the Analysis:**
      *   The friend's position is logically unstable. She wants the Total View's result on Extinction (loss of value) but the Person-Affecting/Critical Level result on RC (no gain from quantity of low-quality lives).
      *   The only reading that bridges this is **Critical Level Utilitarianism** (or a similar "Lexical View"). It says: Creating lives *does* add value, but *only if* they are above a high threshold.
      *   This allows: Extinction is bad (loss of high-quality future lives) AND RC is avoided (adding low-quality lives adds no value).
      *   However, the slogan "Make people happy, not make happy people" is usually associated with the Person-Affecting View (Thesis 2), which *does* contradict the extinction claim.
      *   I need to point out that if she means Thesis 2, she is inconsistent. If she means Thesis 4, the slogan is a misleading shorthand.

  7.  **Refining the Output Structure:**
      *   Introduction: Acknowledge the tension.
      *   The Menu (1-6):
          *   Name.
          *   Precise Thesis.
          *   Verdict (Platitude/Substantive/False).
          *   Commitments/Downsides.
          *   Test Results (1, 2, 3).
          *   Does it block the step?
          *   Does it save the Extinction claim?
