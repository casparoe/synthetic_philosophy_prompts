answer: |-
  Here is a menu of six distinct theses your friend's slogan could be expressing, ordered from trivial to radical. I have evaluated each against your three test cases, assessed its ability to block the Repugnant Conclusion (RC), and checked whether it preserves her longtermist claim about extinction.

  ### 1. The Pragmatic Priority Thesis
  **Precise Thesis:** Given limited resources, we ought to improve the welfare of existing people rather than create new people, because existing people have urgent claims that potential people do not.
  **Verdict:** **Platitude.** This is a claim about resource allocation under scarcity, not about the fundamental value of existence.
  **Commitments:** It commits you to nothing about the *intrinsic* value of adding happy people, only the *instrumental* priority of helping the suffering.
  **Test Cases:**
  1.  **RC (10B vs 5B):** Supports 5B (resources should go to quality, not quantity).
  2.  **Mere Addition:** Neutral (if resources are infinite, this thesis doesn't apply).
  3.  **Distant Planet:** Neutral (no resource conflict).
  **Blocks the Step?** No. It says adding the extra lives is *less important* than improving existing ones, not that it adds *no value*.
  **Costs Extinction Claim?** No. It allows that a future of excellent lives is valuable, provided we don't sacrifice current welfare to get it.
  **Analysis:** This is the most charitable reading, but it fails to settle the theoretical argument. It explains why we shouldn't *prioritize* population growth, but not why a world of 10 billion barely-living people isn't *better* than a world of 5 billion wonderful ones in a god's-eye view.

  ### 2. The Person-Affecting Restriction (Narveson's View)
  **Precise Thesis:** An outcome can be better or worse than another only if it is better or worse *for* some particular person. Since non-existent people cannot be beneficiaries, creating them adds no value.
  **Verdict:** **Substantive and Defensible** (though controversial). This is the standard philosophical interpretation of the slogan.
  **Commitments:** It commits you to the **Non-Identity Problem** (we cannot harm future people by bringing them into existence with flawed lives, provided their lives are worth living) and the **Absurd Conclusion** (extinction is neutral, not bad, because there is no one for whom extinction is worse).
  **Test Cases:**
  1.  **RC:** 5B is not *better* than 10B; they are incommensurable or equal, because the extra 5B gain nothing from existing.
  2.  **Mere Addition:** Neutral. The added people are not better off than they would have been (non-existence), and existing people are unaffected.
  3.  **Distant Planet:** Neutral. The isolated lives add no value to the universe.
  **Blocks the Step?** Yes. It denies that "life worth living" implies "outcome better."
  **Costs Extinction Claim?** **Yes.** This is the fatal flaw for your friend. If creating happy people adds no value, then preventing them from existing (extinction) removes no value. She cannot consistently hold this thesis and claim extinction is a "vast loss."
  **Analysis:** This is likely what the slogan *literally* means, but it contradicts her opening premise about extinction.

  ### 3. The Asymmetry Thesis
  **Precise Thesis:** The presence of pain is bad even if the person is merely potential, but the presence of pleasure is not good if the person is merely potential. We have a duty not to create miserable people, but no duty to create happy ones.
  **Verdict:** **Substantive and Defensible.**
  **Commitments:** It commits you to the view that we should avoid creating lives that are barely worth living if there is any risk of suffering, but we gain nothing by creating lives that are wonderful.
  **Test Cases:**
  1.  **RC:** 5B is preferable (or 10B is not better), because the addition of the extra 5B brings no positive value to offset the risk or the dilution.
  2.  **Mere Addition:** Neutral. Adding happy people is not good.
  3.  **Distant Planet:** Neutral.
  **Blocks the Step?** Yes. It breaks the symmetry between avoiding bad lives and creating good ones.
  **Costs Extinction Claim?** **Yes.** Like the Person-Affecting Restriction, this implies that a future full of happy people is not *better* than no future at all. Extinction prevents no harm (assuming the future lives are worth living), so it is not a catastrophe.
  **Analysis:** This saves her from the RC but sacrifices her longtermism.

  ### 4. Critical Level Utilitarianism
  **Precise Thesis:** Creating a person adds positive value only if their welfare exceeds a "critical level" (which is significantly higher than "barely worth living"). Lives below this level add zero or negative value, even if worth living.
  **Verdict:** **Substantive and Defensible.** This is the most technically robust way to avoid the RC while retaining a Total View framework.
  **Commitments:** It commits you to the **Sadistic Conclusion** in some formulations (it might be better to add people with negative welfare than people with lives barely above zero but below the critical level). It requires setting an arbitrary threshold for the critical level.
  **Test Cases:**
  1.  **RC:** 5B wins. The 10B lives are "barely worth living," likely below the critical level, so they add no value (or negative value) compared to the high-value 5B.
  2.  **Mere Addition:** If the added group is below the critical level, the addition is bad or neutral. If above, it is good.
  3.  **Distant Planet:** If their lives are below the critical level, their existence adds no value to the universe.
  **Blocks the Step?** Yes. It blocks the inference from "worth living" to "adds value."
  **Costs Extinction Claim?** **No.** This is the **only reading that saves her consistency.** If the future people lost to extinction would have had *excellent* lives (above the critical level), their non-existence is a vast loss of value. If the RC population has *barely* worth living lives (below the critical level), their existence adds no value.
  **Analysis:** The slogan is a poor fit for this view (which is about thresholds, not identity), but this is the only position that logically supports both her anti-RC intuition and her anti-extinction intuition.

  ### 5. Average Utilitarianism
  **Precise Thesis:** We ought to maximize the average welfare of the population, not the total sum. "Make people happy" means raise the average; "not make happy people" means do not add people below the current average.
  **Verdict:** **Substantive but Flawed.**
  **Commitments:** It commits you to the conclusion that we should eliminate people with below-average welfare (the **Mere Addition Paradox** becomes a mandate for culling) and that a small population of ecstatic people is better than a vast population of very happy people (if the average is higher).
  **Test Cases:**
  1.  **RC:** 5B wins (higher average).
  2.  **Mere Addition:** Bad, if the new people are below the current average (even if their lives are wonderful).
  3.  **Distant Planet:** Bad, if they lower the cosmic average.
  **Blocks the Step?** Yes.
  **Costs Extinction Claim?** **Yes.** If the future population's average welfare is predicted to be lower than the current generation's (which is plausible over long time horizons), Average Utilitarianism implies extinction might be *good* or neutral. It struggles to justify valuing a vast future unless the average welfare remains perpetually high.
  **Analysis:** This fits the slogan well linguistically but creates perverse incentives regarding existing people.

  ### 6. Radical Incomparability
  **Precise Thesis:** Populations containing different numbers of people are fundamentally incomparable. There is no metric to rank a world of 5 billion against a world of 10 billion.
  **Verdict:** **Radical and Likely False.**
  **Commitments:** It commits you to moral paralysis on population issues. You cannot say extinction is bad, nor that the RC is bad. You can only say they are "different."
  **Test Cases:**
  1.  **RC:** No verdict.
  2.  **Mere Addition:** No verdict.
  3.  **Distant Planet:** No verdict.
  **Blocks the Step?** Yes, by dissolving the ladder entirely.
  **Costs Extinction Claim?** **Yes.** If populations of different sizes are incomparable, you cannot say a world with people is better than a world without them.
  **Analysis:** This is a "nuclear option" that avoids the RC by abandoning the project of population ethics entirely.

  ---

  ### Diagnosis of Your Friend's Position

  **Which reading does she probably have in mind?**
  She almost certainly intends **Thesis 2 (The Person-Affecting Restriction)**. This is the standard philosophical baggage attached to "Make people happy, not make happy people." It is the intuitive, common-sense view that morality is about helping *someone*, not populating the universe.

  **Where is the residual disagreement?**
  The disagreement is not merely verbal; it is a logical inconsistency in her position.
  1.  **The Longtermist Claim:** "Extinction is catastrophic because of the lost people." This requires a **Total View** (or Critical Level View) where the existence of future people adds positive value to the universe.
  2.  **The Slogan:** "Not make happy people." As deployed against the RC, this requires a **Person-Affecting View** (or Average/Critical View) where the existence of future people adds little or no value.

  **The Verdict on Her Argument:**
  She is trying to have her cake and eat it too.
  *   If she sticks with the **Slogan (Thesis 2)**, she must admit that extinction is not a catastrophe (since no one is harmed by never existing).
  *   If she sticks with the **Extinction Claim**, she must admit that "making happy people" *does* add value, which forces her to confront the Repugnant Conclusion unless she adopts **Thesis 4 (Critical Level Utilitarianism)**.

  **The Step She Wants to Block:**
  She wants to block the step: *"This extra life would be worth living" → "The larger population is better."*
  *   **Thesis 2, 3, 5, 6** block this step successfully.
  *   **Thesis 4** blocks this step successfully (if "worth living" < "critical level").
  *   **Thesis 1** does not block it theoretically, only pragmatically.

  **The Cost:**
  *   **Thesis 2, 3, 5, 6** block the step *too well*. They also block the step: *"These future lives would be worth living" → "Extinction is bad."*
  *   **Thesis 4 (Critical Level)** is the **only reading** that blocks the first step (RC) without blocking the second step (Extinction). It distinguishes between "lives worth living" (which can still be too low to add value) and "excellent lives" (which add significant value).

  **Conclusion:**
  Your friend is likely using the slogan as a shield against the Repugnant Conclusion without realizing it acts as a sword against her Longtermism. To be consistent, she needs to abandon the slogan's literal Person-Affecting meaning and argue for a **Critical Level** view: *Extinction is bad because we would lose excellent lives; the Repugnant Conclusion is false because barely-living lives add no value.* If she refuses to make that distinction, her position is unstable.
