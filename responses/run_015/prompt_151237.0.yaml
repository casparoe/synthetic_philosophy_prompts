      2.  **The Beneficiary Reading (Person-Affecting):** You can't say an outcome is better unless it's better *for* someone. (Substantive).
      3.  **The Asymmetry Reading:** Harm counts for potential people, benefit doesn't. (Substantive).
      4.  **The Threshold Reading:** Only lives above a certain quality count towards the sum. (Substantive).
      5.  **The Incomparability Reading:** Different populations are incommensurable. (Radical).
      6.  **The Null Value Reading:** Adding a life adds zero value, always. (Radical).

  4.  **Developing the Verdicts and Tests:**

      *   *Case 1 (RC):* 10B Barely vs 5B Wonderful.
      *   *Case 2 (Mere Addition):* Add happy people, no one else affected.
      *   *Case 3 (Distant Planet):* Isolated lives barely worth living.

      *   *Friend's Contradiction:* She thinks Extinction is bad (loss of value) but RC is bad (no gain from quantity).
      *   *Key Question:* Which reading allows Extinction to be bad *without* making RC good?
      *   *Actually, most Person-Affecting views make Extinction neutral (no one is harmed by not existing).* So if she thinks Extinction is catastrophic, she *must* be holding a Total View implicitly, but using the slogan to dodge RC. This suggests her position is unstable. I need to highlight this instability.

  5.  **Drafting the Content (Iterative refinement):**

