          *   Test 1: Supports 5B wonderful.
          *   Test 2: Neutral/Depends on resources.
          *   Test 3: Neutral.
          *   Verdict: Platitude. Doesn't solve the theoretical problem.

      *   *Thesis 2: The Person-Affecting Restriction (Narveson).* "Better" means "Better for someone." Non-existent people can't be beneficiaries.
          *   Test 1: 5B better (for them). 10B not better (new people don't count).
          *   Test 2: Neutral (no one is harmed/benefited by the addition relative to non-existence).
