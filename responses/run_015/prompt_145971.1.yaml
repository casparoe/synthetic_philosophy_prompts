      *   *The "Historical Sickness":* Nietzsche warned that an overload of history kills the plastic power of life. Algorithms maximize this overload.
      *   *Speed:* Yes, speed changes the moral psychology. It prevents *digestion*. You can't critique or revere what you consume in 15 seconds.

