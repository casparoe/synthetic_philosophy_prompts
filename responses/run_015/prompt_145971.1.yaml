      *   **Subject:** Friedrich Nietzsche's potential view on algorithmic feeds (TikTok) and Wikipedia edit wars.
      *   **Lens:** His three modes of history from *On the Use and Abuse of History for Life* (Monumental, Antiquarian, Critical).
      *   **Specific Question:** Are algorithms just tools for these modes, or do they break the framework? Is endless scrolling "antiquarianism on steroids," or does speed change the moral psychology?
