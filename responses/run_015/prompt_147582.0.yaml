          5.  Assess whether the "genes-only" conclusion holds up given these breaks.
          6.  Determine if the analogy smuggles in assumptions (vertical/digital replication).
          7.  End with a specific one-line verdict format: "Verdict: ..."

  2.  **Deconstruct the Analogy (The "Dawkinsian" View):**
      *   This is essentially Richard Dawkins' *The Selfish Gene* argument.
      *   *Recipe:* Gene/Allele (information).
      *   *Cake:* Phenotype/Organism (vehicle).
      *   *Cookbook:* Genome.
      *   *Chef:* Developmental processes/Cellular machinery.
      *   *Oven:* Environment.
