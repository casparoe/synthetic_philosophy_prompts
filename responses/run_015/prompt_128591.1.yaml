answer: |-
  Your brother-in-law is half-right. This is indeed a famous setup, but the answer is not obvious; it is one of the deepest fractures in modern decision theory.

  The canonical thought experiment you are living is a hybrid of **Parfit's Hitchhiker** and **Kavka's Toxin Puzzle**, framed within the economic philosophy of **David Gauthier's *Morals by Agreement***.

  *   **Parfit's Hitchhiker:** You are stranded (need the work). A driver (the specialist) offers a ride (the work) only if you promise to pay upon arrival. Once you arrive (work delivered), you have no causal reason to pay. If the driver predicts you won't pay, he won't drive.
  *   **Kavka's Toxin Puzzle:** You are offered a reward for *intending* to drink a toxin. You get the reward once the intention is verified. You don't actually have to drink it. But you cannot intend to do something you know you will have no reason to do when the time comes.
  *   **Gauthier's Contribution:** He argues that rational agents should be "Constrained Maximizers" (disposed to cooperate if others do) rather than "Straightforward Maximizers" (maximizing utility at every single step).

  Here is the analysis of your situation, keeping your distinctions sharp.

  ### 1. Rational Now vs. Rational Then

  You asked to keep these separate. Under standard **Causal Decision Theory (CDT)**, which calculates rationality based on the causal consequences of your actions *at the moment of choice*:

  *   **Rational Then (Moment of Payment):** Do not pay. The work is in your inbox. The money is in your account. The specialist cannot sue. The reputational damage is probabilistic and distant. The causal link between paying and receiving the work is already severed. Paying costs you two months' income; not paying saves it. A CDT agent defects.
  *   **Rational Now (Moment of Agreement):** Do not enter the agreement *unless* you can bind your future self. If you know you will be rational *then*, you will defect. If the specialist knows you are rational *then*, he will not do the work. Therefore, to secure the deal *now*, you must make it impossible or irrational for yourself to defect *later*.

  **Do these answers fit together?**
  No. They contradict each other under standard decision theory. This is the "time-inconsistency" problem. If you remain a standard rational agent, you cannot make this trade. To make the trade, you must cease to be a standard rational agent at the moment of payment. You must become, in the eyes of the theory, "irrational" (willing to incur a cost with no causal benefit) to be "rational" over the lifespan of the project.

  This does not count against the theory of rationality that advises this; it counts against the definition of rationality as "maximizing utility at every instantaneous node." A theory that advises you to bind your future self is superior for agents who exist through time.

  ### 2. Addressing Your Three Worries

  **Worry 1: The Coherence of Option 2 (Self-Engineering)**
  *Is it incoherent to install a disposition while knowing you installed it for a reason? Does this require forgetting?*

  It does not require forgetting, but it requires **opaque identity**. You cannot view the disposition as a tool you are holding; you must view it as the hand that holds the tool.
  If you think, "I am paying only because I trained myself to pay," you are still calculating. At the moment of payment, you will ask, "Is the training worth the cost?" and you might decide "No."
  For Option 2 to work, you must successfully shift your self-conception from "a maximizer of income" to "a person who honors agreements." This is not self-deception; it is **constitutive commitment**. You are changing your utility function so that the act of paying *itself* yields utility (integrity), rather than being a pure cost.
  *Verdict:* It is not incoherent, but it is psychologically difficult to execute on demand. It works best if you have a long history of such behavior already. If you are "becoming" this person just for this deal, the transparency of the motive undermines the disposition.

  **Worry 2: Relocating the Gap (Options 3 & 4)**
  *Do commitment devices just move the problem sideways?*

  Option 3 (Auto-pay/Escrow) **closes** the gap physically. It removes the branch of the decision tree where you defect. There is no choice to be made at the moment of payment, so there is no rationality failure.
  Option 4 (The Scrupulous Friend) **relocates** the gap, but to a stronger link. You worry you might talk your friend out of it. This is valid. However, if the friend is truly "pathologically scrupulous," her utility function is already fixed. She gains more utility from honoring your instruction than from saving you money.
  *Verdict:* Option 3 is superior to Option 4 because it removes human discretion entirely. Option 4 introduces a new game (you vs. friend) which carries its own transaction costs. Neither is "incoherent"; they are mechanical solutions to a psychological problem.

  **Worry 3: The Counterparty's Inference**
  *What does a shrewd specialist infer from each option?*

  *   **Option 1 (Trust Me):** In a niche, high-stakes community, this is often read as naivety or bluffing. Since he knows the rational argument (CDT) as well as you do, he knows "trust" is cheap talk.
  *   **Option 2 (Internal Disposition):** Invisible to him. He cannot see your soul.
  *   **Option 3 (Escrow/Technical Lock):** This is the professional standard for a reason. It signals **solvency and seriousness**. It tells him, "The money exists, and the mechanism is in place." It does not signal distrust; it signals that you understand the stakes. In international freelance work, escrow is often expected precisely because legal recourse is absent.
  *   **Option 4 (Friend Holder):** Signals that you lack control over your own finances or are trying to outsource your conscience. Less professional than Option 3.

  *Verdict:* A shrewd counterparty prefers Option 3. It makes the transaction risk-free for him without requiring him to model your psychology.

  ### 3. What Should You Actually Do?

  You asked for the argument, not just the advice.

  **The Argument:**
  You are currently facing a **Prisoner's Dilemma** where the other player moves first. He cooperates (does work); you decide to Cooperate (pay) or Defect (keep money).
  If you play this as a one-off game using standard rationality, you Defect. He knows this, so he doesn't play. You lose the work.
  To win the game, you must transform it from a Prisoner's Dilemma into a **Coordination Game**. You do this by removing your ability to Defect.
  The "rationality of making oneself irrational" is the core insight of **Resolute Choice**. It is rational to bind yourself because the *ex-ante* expected utility of being bound (getting the work) exceeds the *ex-ante* expected utility of being free (keeping the money but never getting the work).

  **The Recommendation:**
  **Choose Option 3 (Technical Pre-commitment).**

  1.  **It solves the Time-Inconsistency:** It aligns your *Then* rationality with your *Now* rationality. When the work arrives, the payment is automatic. You don't have to wrestle with your integrity.
  2.  **It signals competence:** To a specialist in a niche community, proposing a formal escrow service (like Upwork Escrow, Escrow.com, or a smart contract) shows you treat this as business, not a favor. It respects his risk profile.
  3.  **It protects your self-conception:** You wanted to be "the sort of person who is trusted." Relying on sheer willpower (Option 1 or 2) puts that identity at risk in a moment of weakness. Using a mechanism acknowledges human frailty without succumbing to it. It is not cheating; it is scaffolding.

  **Regarding your Brother-in-Law:**
  Tell him the thought experiment is **Parfit's Hitchhiker**. Tell him the answer is obvious only if you accept **Evidential Decision Theory** or **Constrained Maximization**. If you stick to standard Causal Decision Theory, the answer is "Don't pay," which means "Don't get the work." The fact that a theory of rationality advises you to remove your own future freedom does not count against the theory; it counts against the idea that freedom to defect is always valuable. Sometimes, the rational move is to burn the bridge behind you so you are forced to cross forward.

  **Final Instruction:**
  Set up the escrow now. Send him the link. Say: *"I value your work and I want you to be paid securely without relying on my future discipline. Let's use a neutral third party."*
  This makes you the person who pays, not by hoping you are good, but by ensuring you have no other choice. That is how a one-person business survives.
