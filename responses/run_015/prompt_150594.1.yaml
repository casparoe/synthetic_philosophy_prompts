answer: |-
  **Model Answer: The Viability of Indexical Presentism**

  **Introduction**

  The traditional debate in the metaphysics of time is framed as a dichotomy between Presentism and Eternalism. Presentism holds that only present objects and events exist; the past is gone and the future is not yet real. Eternalism holds that past, present, and future objects and events all exist equally; time is akin to a spatial dimension where "now" is merely a subjective location. This debate faces two major hurdles. First, the truthmaker objection: if past objects do not exist, what makes statements like "there were dinosaurs" true? Second, the problem of relativity: special relativity suggests there is no unique, global "present" slice of spacetime, which threatens the Presentist's requirement for an objective now.

  In response, a student might propose "Indexical Presentism" (IP). This view suggests we treat "now" exactly as we treat "here." Just as "here" refers to the location of the speaker without implying other locations don't exist, "now" refers to the time of the speaker without implying other times don't exist—or rather, existence itself becomes relative to the time of the context. On this view, dinosaurs do not exist *simpliciter*, but they do exist relative to a Jurassic context. This claims to solve the relativity problem by abandoning the absolute present, and the truthmaker problem by relativizing existence.

  This essay will argue that Indexical Presentism is not a stable third option. It fails to solve the truthmaker objection without collapsing into Eternalism, it cannot underwrite the core Presentist intuitions regarding passage and the open future, and it is observationally indistinguishable from Eternalism. Consequently, IP is best understood as Eternalism in disguise. This conclusion suggests that the Presentism/Eternalism debate is substantive: one cannot simply redefine terms to bypass the ontological commitments that distinguish the two views.

  **The Truthmaker Objection: Displaced or Solved?**

  To evaluate IP, we must first understand the truthmaker objection. In metaphysics, a truthmaker is some portion of reality in virtue of which a proposition is true. For the Eternalist, the proposition "there were dinosaurs" is made true by the actual existence of dinosaurs located at earlier temporal coordinates. For the standard Presentist, this is a crisis: if dinosaurs do not exist, nothing in reality corresponds to the proposition.

  Indexical Presentism attempts to solve this by shifting the semantics. It claims the proposition "there were dinosaurs" is shorthand for "relative to a past context, dinosaurs exist." Since dinosaurs *do* exist relative to that Jurassic context, the statement has a truthmaker: the dinosaurs-at-that-context.

  However, this solution merely displaces the problem one level up. We must now ask: what makes it true *at our current context* that "relative to a Jurassic context, dinosaurs exist"?

  For this higher-order statement to be true, there must be a fact of the matter about the Jurassic context. If the Jurassic context is nothing at all—if it has no ontological status—then there is no anchor for the truth claim. It would be like saying "Unicorns exist relative to a fantasy context." That statement is true only because the fantasy context (a book, a game, a mental state) actually exists *now*. But the Jurassic context is not a story we are telling now; it is a claimed feature of reality.

  If the Indexical Presentist says the Jurassic context is real enough to ground our current truths about it, they are conceding that the past time has some form of being. If the past time has being, and dinosaurs have being relative to that time, then dinosaurs have a derivative form of being in our ontology. This looks indistinguishable from the Eternalist claim that dinosaurs exist at temporal coordinate *t*.

  If, alternatively, the Indexical Presentist insists the Jurassic context has *no* being, but we can still speak truly about it, they have abandoned the truthmaker principle entirely. They are admitting that we can have true propositions without any corresponding reality to make them true. This saves the view from collapsing into Eternalism, but only by adopting a deflationary theory of truth that most metaphysicians find unacceptable. Thus, IP faces a dilemma: either accept that past contexts are real (collapsing into Eternalism) or deny truthmakers for cross-context claims (abandoning standard metaphysical realism).

  **Passage and the Open Future**

  Even if IP could solve the truthmaker problem, we must ask if it preserves the motivations for being a Presentist in the first place. Philosophers usually defend Presentism because it aligns with certain phenomenological intuitions: specifically, the feeling of robust temporal passage and the intuition that the future is open.

  Robust passage requires that events come into existence and go out of existence *simpliciter*. It is not enough for an event to slide from the future index to the present index; the event must undergo a change in its ontological status. In IP, however, existence is always relative. An event at *t1* exists relative to *t1*. An event at *t2* exists relative to *t2*. Nothing ever comes into or goes out of existence absolutely; things only change their indexical relation to the speaker. This is precisely the Eternalist picture of a "block universe" where all times are equally real, and "passage" is just the movement of consciousness along the time dimension. IP removes the "coming into being" that Presentists cherish.

  Similarly, consider the open future. Presentists often argue the future is indeterminate because it does not exist. There is no fact of the matter about tomorrow's sea battle. In IP, is the future open? If we treat "now" like "here," then the future is simply a different location. Just as Paris exists even when I am in London, the future time exists even when I am in the present. The Indexical Presentist says "future events exist relative to a future context." But for that to be a true claim *now*, the future context must be a valid locus of facts. If it is a valid locus of facts, then there is a fact of the matter about what happens there. This implies determinism.

  To save the open future, the Indexical Presentist would have to say that future contexts are somehow "empty" or indeterminate compared to past contexts. But this reintroduces an objective distinction between times (some are fixed, some are not), which violates the spirit of treating all times as mere indexical locations. Therefore, IP fails to deliver the open future. It sacrifices the core metaphysical benefits of Presentism to solve the technical problems of Presentism. It is Presentism with the spine removed.

  **Distinguishability and Verbal Disputes**

  Finally, we must consider whether Indexical Presentism is empirically or metaphysically distinct from Eternalism. A difference between two metaphysical theories is merely verbal if there is no conceivable observation or logical consequence that distinguishes them.

  Eternalism claims:
  1.  All times exist.
  2.  "Now" is an indexical referring to the time of utterance.
  3.  "Dinosaurs existed" is true because dinosaurs are located at earlier times.

  Indexical Presentism claims:
  1.  Existence is relative to a time.
  2.  "Now" is an indexical referring to the time of utterance.
  3.  "Dinosaurs existed" is true because dinosaurs exist relative to earlier times.

  Notice that both views agree on the structure of spacetime (compatible with relativity). Both agree on the semantics of "now." Both agree on the truth conditions for all ordinary tensed sentences. The only difference is that the Eternalist uses the word "exist" to cover the whole block of time, while the Indexical Presentist restricts the word "exist" to the current index but admits that other indices are real contexts.

  Is there any argument to tell them apart? Suppose we ask: "Does the year 3000 exist?" The Eternalist says "Yes." The Indexical Presentist says "It exists relative to the year 3000, but not relative to now." But if the year 3000 is a real context that grounds truths *now*, in what sense is it not real? If I can refer to it, quantify over it, and predicate things of it, it is part of my ontology.

  If the Indexical Presentist insists the year 3000 is *not* part of their ontology, they cannot explain how we make true claims about it. If they admit it is part of their ontology, they are Eternalists. Since there is no observation that could favor one description over the other, and both commit to the same underlying structure of reality (a four-dimensional manifold of events), the difference is merely verbal. IP is simply Eternalism using a different dictionary.

  **Conclusion**

  Indexical Presentism attempts to navigate between the Scylla of relativity and the Charybdis of truthmakers by relativizing existence. However, this maneuver fails. It does not solve the truthmaker objection without conceding that past and future contexts have ontological status, which is the hallmark of Eternalism. It fails to preserve the intuitions about passage and the open future that motivate Presentism, rendering it metaphysically unsatisfying for its intended proponents. Finally, it is indistinguishable from Eternalism in any substantive way, reducing the disagreement to a semantic preference.

  Therefore, Indexical Presentism is not a genuine third option; it is Eternalism in disguise. This outcome tells us something important about the original debate. It demonstrates that the dispute between Presentism and Eternalism is not merely about how we use the word "exist." It is a substantive disagreement about the structure of reality. You cannot have the relativistic compatibility of Eternalism and the semantic ease of indexicality while maintaining the ontological parsimony of Presentism. The "spine" of Presentism is the claim that non-present things are *nothing*. Once you allow them to be "something relative to a context," you have granted them being. Indexical Presentism proves that if you remove the absolute present, you cannot remain a Presentist. The dichotomy stands: either the past is real, or it is not. There is no middle ground.
