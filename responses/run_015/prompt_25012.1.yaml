      *   *Standard View (Intellectualism):* Knowledge = True Belief + Justification (warrant). Stakes don't affect justification.
      *   *PE View:* Knowledge = True Belief + Justification (where justification threshold varies with stakes).
      *   *The Bank Case:* Same evidence $E$. Low Stakes ($L$): Subject $S$ knows $p$. High Stakes ($H$): Subject $S$ does not know $p$.
      *   *Implication:* The threshold for "knowledge" is context-sensitive based on utility/cost.

  3.  **Translate to Statistical Decision Theory:**
      *   *Proposition $p$:* Null hypothesis $H_0$ (or alternative $H_1$, depending on framing). Let's say $p$ = "Bank is open."
      *   *Evidence $E$:* Data $X$, test statistic $T(X)$.
      *   *Belief:* Rejecting/Failing to reject, or Posterior Probability $P(p|E)$.
      *   *Knowledge:* This is the tricky part. In stats, we don't usually say "we know $H_0$ is true." We say "we accept $H_0$" or "we act as if $H_0$ is true."
      *   *Stakes:* Loss Function $L(\text{action}, \text{state})$.
      *   *Decision Rule:* $\delta(X)$. Minimize Expected Loss (Bayes) or Control Error Rates (Neyman-Pearson).
      *   *Translation:*
          *   Low Stakes: Loss for Type I error (acting on false $p$) is low. Critical region is large. $p$-value threshold ($\alpha$) is high. Easy to "accept" $p$.
          *   High Stakes: Loss for Type I error is high. Critical region is small. $\alpha$ is low. Hard to "accept" $p$.
          *   PE Claim: In Low Stakes, you *know* $p$. In High Stakes, you *don't know* $p$.
          *   Stat Claim: In Low Stakes, you *act* on $p$. In High Stakes, you *withhold action* on $p$.

  4.  **Drafting the Restatement (The "Statistical Translation"):**
      *   Frame the proposition $p$ as a hypothesis $H$.
      *   Frame evidence as data $D$.
      *   Frame "Knowledge" as crossing a threshold of confidence sufficient for assertion/action.
      *   Frame "Stakes" as the Loss Function $L$.
      *   *Neyman-Pearson (NP):* $\alpha$ (Type I error rate) is chosen based on costs. PE says the *state of knowing* changes. NP says the *decision* changes.
      *   *Bayesian:* Posterior $P(H|D)$ is fixed by evidence/prior. Decision depends on Loss. PE says the *epistemic status* changes.
      *   *The Conflict:* Statistics separates *inference* (estimation/testing) from *decision* (action). PE merges them.

  5.  **Developing the Residue Report:**
      *   *Clean Maps:*
          *   Stakes $\leftrightarrow$ Loss Function / Cost of Error.
          *   Evidence $\leftrightarrow$ Likelihood / Test Statistic.
          *   Threshold for Knowledge $\leftrightarrow$ Critical Value / Decision Boundary.
          *   Withholding Knowledge $\leftrightarrow$ "No Decision" / "Fail to Reject" / Gathering more data.
      *   *Stretches/Fudges:*
