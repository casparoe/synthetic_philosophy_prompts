prompt: |-
  I'm a statistician who works on decision theory — loss functions, hypothesis testing, Type I/II error tradeoffs, significance levels, the works. I keep hearing about this thing in epistemology called "pragmatic encroachment," and from what I gather it's the idea that whether you know something depends on what's practically at stake. The classic example: you've got the same evidence that the bank is open on Saturday, but we'd say you "know" it when you just want to deposit a check, and we'd deny you "know" it when your rent depends on it and getting it wrong means eviction.

  Restate this whole debate in the vocabulary I actually use — significance levels, loss functions, decision rules, error rates, Neyman-Pearson vs. Fisher vs. Bayesian frameworks — as faithfully as you can. Then give me the residue report: which parts of the philosophical debate map cleanly onto things statisticians already talk about, which parts you had to stretch or fudge, and whether there's anything the philosophers are arguing about that has no counterpart in my vocabulary. I want to know whether this is just the standard point that decision thresholds depend on costs dressed up in philosophical jargon, or whether there's something genuinely different going on that my framework can't capture.
