          *   Context-sensitivity. In stats, the model is usually fixed. In PE, the *semantic content* of "knows" changes.
          *   The "Subjective" element. PE often implies the *subject's* epistemic state changes. In stats, the optimal rule changes, but the $p$-value or Posterior stays the same.
      *   *The "Something Different":*
          *   *Factivity:* Knowledge entails truth. Decision rules do not. You can make the optimal decision and still be wrong. If you "know," you can't be wrong.
          *   *Assertion vs. Action:* PE is often about whether it's *appropriate to say* "I know." Stats is about what to *do*.
          *   *Constitution vs. Regulation:* Stats says stakes regulate *action* given knowledge. PE says stakes constitute *knowledge* itself.

