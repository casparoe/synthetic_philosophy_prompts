answer: |-
  # Adversarial Collaboration: Decision Theory and Counterfactual Dependency

  **Authors:** The Pay Camp (User) & The Don't-Pay Camp (Jordan)  
  **Faculty Advisor:** [Name Redacted]  
  **Date:** October 26, 2023  
  **Subject:** Structural Analysis of Decision-Theoretic Disagreements  

  ## 1. Agreed Claims and Case Definitions

  The following statements represent points of consensus between the Pay Camp and the Don't-Pay Camp. Both parties sign below to indicate that these descriptions accurately reflect the scenarios and the baseline constraints of our debate.

  1.  **Goal of Decision Theory:** Both camps agree that a decision theory should provide a set of instructions for an agent to maximize expected utility (or achieve the best possible outcome) given the information available to them. We disagree on *how* to calculate that expectation, not on the goal itself.
  2.  **Case 1: The Counterfactual Mugging (Clean Statement):**
      *   A predictor (Omega) flips a fair coin.
      *   **Heads:** Omega gives the agent $10,000 *if and only if* Omega predicted the agent would give $100 if the coin had come up Tails.
      *   **Tails:** Omega appears to the agent, reveals the coin is Tails, and asks for $100. No $10,000 is available.
      *   **Knowledge:** The agent knows all these rules in advance. The coin has already landed Tails in the actual scenario.
  3.  **Case 2: The XOR Note (Clean Statement):**
      *   A predictor sends a note if and only if exactly one of the following is true: (A) The agent's house has termites (cost: $1,000,000), or (B) The agent will pay the predictor $1,000 upon receiving the note.
      *   The agent receives the note.
      *   **Consensus Action:** Both camps currently recommend *not* paying the $1,000.
      *   **Consensus Reasoning (Limited):** Both camps agree that paying the $1,000 does not causally remove the termites if they are present.
  4.  **Pre-Commitment Consistency:** Both camps agree that *before* the coin is flipped in Case 1, it is rational to pay $1 for a gadget that forces the agent to hand over the $100 in the Tails branch. We acknowledge this creates a tension: we agree on the optimal strategy ex-ante (before the flip), but disagree on the optimal action ex-post (after the Tails result is known).
  5.  **Relation to Newcomb's Problem:** We acknowledge that the Counterfactual Mugging shares structural similarities with Newcomb's Problem. The Pay Camp views them as the same fundamental problem (logical dependency without causal connection). The Don't-Pay Camp views them as distinct (Newcomb involves a correlation with a box content that exists now; Mugging involves a counterfactual branch that does not exist).
  6.  **Predictor Accuracy:** In the standard cases, Omega is assumed to be highly accurate (near 100%). We agree that if Omega's accuracy dropped to random chance (50%), the Pay Camp's argument would weaken, though we disagree on the threshold where it collapses.

  ***

  ## 2. Table of Disagreements

  The following table isolates the specific points of contention. We have attempted to translate our positions into neutral language to identify whether the disagreement is substantive or merely verbal.

  | Topic | Don't-Pay Camp (Jordan) Wording | Pay Camp (User) Wording | Verbal or Real? | The Underlying Crux | Agreed Test / Argument |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **The Status of the Counterfactual** | "The coin is already Tails. The Heads world is impossible. You cannot influence what is logically impossible." | "The decision algorithm is the same in both branches. Your choice now determines what the algorithm *is*, which determines the past prediction." | **Real** | **Subjunctive Dependence:** Does a rational agent treat their current decision as logically linked to a past prediction of that decision, even without causal contact? | **Ex-Ante Calculation:** Calculate expected utility *before* the coin flip for an agent using Theory A vs. Theory B. <br>*Jordan predicts:* Theory B wins ex-ante but is irrational ex-post.<br>*User predicts:* A theory that changes recommendations ex-post is dynamically inconsistent and flawed. |
  | **Definition of "Rational"** | "Rationality is making the best move given the *actual* state of the world you are in." | "Rationality is being the kind of agent who gets the best results across all possible worlds you could have been in." | **Real** | **Local vs. Global Optimization:** Should decision theory optimize for the specific node in the decision tree you occupy, or the whole tree? | **The Gadget Test:** Since we both buy the gadget ex-ante, does a theory that refuses to pay ex-post require the agent to pay to *prevent* themselves from using that theory later? |
  | **XOR Note Consensus** | "Don't pay because paying costs $1,000 and doesn't fix termites. The note is already sent." | "Don't pay because [Complex Logical Reason]. *Note: We agree on 'No' here, but for different structural reasons.*" | **Verbal / Fragile** | **Logical Correlation:** We agree on the output, but if the XOR logic changes slightly, the Pay Camp might switch to 'Pay' while the Don't-Pay Camp stays 'No'. | **Variable Stakes:** If termite damage is $2,000 instead of $1M, does the recommendation change? <br>*Jordan:* No.<br>*User:* Depends on the logical implication of the payment on the note's existence. |
  | **Newcomb Connection** | "Newcomb's is about evidence. Mugging is about impossible counterfactuals. They are different." | "Newcomb's is just Mugging where the 'Tails' branch is 'Box B is Empty'. It's the same fight." | **Real** | **Evidence vs. Logic:** Is the correlation in Newcomb's problem evidential (Bayesian) or logical (computational)? | **Transparent Newcomb:** If you can see the money in the boxes, do you take one or two? This isolates causal vs. logical dependency. |

  ***

  ## 3. Novel Test Cases

  To further probe the disagreement without relying on standard literature examples, we propose the following three variations. For each, we record the predicted verdict, the reasoning, and what result would surprise each camp.

  ### Case A: The Weighted Mugging
  **Setup:** Omega flips a coin weighted 90% Heads / 10% Tails. Omega is only 60% accurate at predicting your behavior (it tells you this). If Heads, you get $10,000 if predicted to pay in Tails. If Tails, you are asked for $100. You are in the Tails branch.

  | Camp | Verdict | Reasoning | What Would Surprise You? |
  | :--- | :--- | :--- | :--- |
  | **Don't-Pay** | **Don't Pay.** | The coin is still Tails. The 90% weight is past tense. The 60% accuracy means the prediction is weak evidence, but causally inert. Paying loses $100 for sure. | If the Pay Camp switches to "Don't Pay" at a specific accuracy threshold (e.g., below 50%). |
  | **Pay** | **Pay.** (Conditional) | Depends on the Ex-Ante Expected Value. If (0.90 * 0.60 * $10,000) > (0.10 * $100), the strategy of "Always Pay" wins overall. | If the Don't-Pay Camp ever switches to "Pay" solely based on the coin weight, implying causal influence. |
  | **Crux Check** | **Flip Point:** | **Don't-Pay:** Never flips based on weight/accuracy alone. <br>**Pay:** Flips when Ex-Ante EV becomes negative. | **Agreement:** We can calculate the exact EV threshold where the Pay Camp abandons the strategy. |

  ### Case B: The Iterated Mugging
  **Setup:** Omega runs the Mugging scenario 100 times. It flips the coin each round. However, it makes *one* prediction before Round 1 by simulating your strategy for all 100 rounds. If you deviate from your predicted strategy in any round, you lose the $10,000 in all Heads rounds. You are in Round 100. The coin is Tails.

  | Camp | Verdict (Round 100) | Reasoning | What Would Surprise You? |
  | :--- | :--- | :--- | :--- |
  | **Don't-Pay** | **Don't Pay.** | Round 100 is causally isolated. The prediction is already made. Paying now cannot change Round 1-99 or the prediction. | If the Pay Camp says "Don't Pay" in Round 100 (admitting backward induction kills the strategy). |
  | **Pay** | **Pay.** | You are executing a policy. If your policy is "Defect on Round 100," Omega would have predicted that and withheld money in Rounds 1-99. | If the Don't-Pay Camp says "Pay" to maintain reputation with Omega (treating Omega as a causal enforcer). |
  | **Crux Check** | **Time Consistency:** | **Don't-Pay:** Rationality is local to the current round. <br>**Pay:** Rationality is global to the policy. | **Agreement:** This highlights the "Dynamic Inconsistency" of the Don't-Pay position. |

  ### Case C: The Friend Simulation
  **Setup:** Omega says it could not simulate you. Instead, it simulated your best friend, Sam. Omega assumes you and Sam decide identically. Sam is standing next to you. Omega asks *you* for $100 (Tails branch). Sam hears this.

  | Camp | Verdict | Reasoning | What Would Surprise You? |
  | :--- | :--- | :--- | :--- |
  | **Don't-Pay** | **Don't Pay.** | Sam is a different physical person. Your decision does not causally control Sam's brain. | If the Pay Camp refuses to pay because the correlation is "too weak" (social vs. logical). |
  | **Pay** | **Pay.** (With Caveat) | If you and Sam are logically similar agents, your decision updates the probability of Sam's decision. *Caveat:* Pay Camp might pay Sam $10 to agree to pay, securing the correlation. | If the Don't-Pay Camp agrees to pay Sam $10 to secure the $10,000 (admitting correlation has value). |
  | **Crux Check** | **Reference Class:** | **Don't-Pay:** Identity is physical. <br>**Pay:** Identity is computational/algorithmic. | **Agreement:** We can test if "logical similarity" is treated as a resource to be bought. |

  ***

  ## 4. Conclusion: Verbal vs. Substantive Disagreement

  After two months of debate and the drafting of this document, we conclude the following regarding the nature of our disagreement:

  **1. Purely Verbal Disputes:**
  Some of our argument stems from the definition of the word "Rational."
  *   If "Rational" means *"Doing the best you can given the fixed physical state of the present,"* the Don't-Pay Camp is correct.
  *   If "Rational" means *"Using the decision algorithm that yields the highest wealth over a lifetime,"* the Pay Camp is correct.
  *   **Resolution:** We agree to stop arguing about the label "Rational" and instead argue about which decision algorithm we would prefer to be instantiated as.

  **2. Substantive Disputes:**
  Even if we agree on definitions, a core disagreement remains regarding **Counterfactual Reasoning**.
  *   The Don't-Pay Camp holds that counterfactuals must respect causal directionality (Time's Arrow).
  *   The Pay Camp holds that counterfactuals must respect logical consistency (The Algorithm's Output).
  *   **Persistence:** This disagreement will remain even if we debate for another year. It is a fundamental divergence in how we model "possibility." The Don't-Pay Camp views the Tails world as the *only* possible world once the coin lands. The Pay Camp views the Tails world as one node in a decision tree that must be optimized as a whole.

  **3. Final Observation:**
  The fact that both camps agree to buy the pre-commitment gadget (Claim #4) suggests the Don't-Pay Camp admits their preferred decision theory is *time-inconsistent*. The Pay Camp argues this is a fatal flaw. The Don't-Pay Camp argues it is a feature of a world where the past is fixed. This is the irreducible core of our conflict.

  **Signed,**

  _________________________ (The Pay Camp)

  _________________________ (The Don't-Pay Camp)
