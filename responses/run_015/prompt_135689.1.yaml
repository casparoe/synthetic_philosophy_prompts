answer: |-
  # Activity: The Contract of Names (Ming Yue)

  **Objective:** To embody the semantic friction in Gongsun Long's *Bai Ma Lun* ("White Horse Not Horse") by forcing students to negotiate the value of specificity versus generality in binding contracts.
  **Time:** 75 Minutes total.
  **Class Size:** 14 Students (adjustable).
  **Materials:**
  *   30 "Object Cards" (20 labeled "Horse", 10 labeled "White Horse"). *Note: The "Horse" cards are blank regarding color; the "White Horse" cards are pre-combined.*
  *   10 "Modifier Cards" (labeled "White", "Black", "Yellow").
  *   15 "Contract Slips" (blank paper).
  *   1 "Ontology Key" (handout for Faction 3).
  *   Scoreboard (whiteboard).
  *   Play currency ("Li" tokens or tally marks).

  ---

  ## 1. Faction Roles & Incentives (5 Minutes)

  Divide the class into three groups. Distribute the incentives clearly.

  **Faction 1: The Logicians (Gongsun Long View)**
  *   **Role:** They draft the Contracts.
  *   **Goal:** Maximize "Precision Points."
  *   **Incentive:** They earn 3 Li for every contract fulfilled *exactly* as named. If they write "White Horse" and receive a "Horse" card + "White" card, they earn 0 Li. They believe the name *constitutes* the object.
  *   **Philosophy:** Form (*xing*) and Color (*se*) are distinct categories. A compound name designates a unified reality, not a sum of parts.

  **Faction 2: The Merchants (Conjunction/Mohist View)**
  *   **Role:** They hold the Inventory and fulfill Contracts.
  *   **Goal:** Maximize "Profit Points."
  *   **Incentive:** They earn 3 Li for every contract fulfilled using *any* combination of cards that logically satisfies the description. If a contract asks for "White Horse," they want to play "Horse" + "White" to save their rare "White Horse" cards for harder contracts.
  *   **Philosophy:** A white horse is just a horse that happens to be white. The compound is a conjunction of properties.

  **Faction 3: The Ontologists (Tag Ontology View)**
  *   **Role:** They are the Arbiters/Court.
  *   **Goal:** Maximize "Consistency Points."
  *   **Incentive:** They earn 5 Li for every ruling that maintains internal logical consistency with their "Ontology Key." They lose 2 Li for every contradiction in their rulings.
  *   **Philosophy:** Properties are tags. Some tags are *intersective* (a white horse is a horse AND white), others are *non-intersective/constitutive* (a "toy horse" is not a horse). They must decide which category "White" falls into during disputes.

  ---

  ## 2. Game Mechanics & Timeline

  ### Phase 1: The Market Opens (15 Minutes)
  *   **Setup:** Merchants receive 10 "Horse" cards, 2 "White Horse" cards, and 5 "White" modifier cards. Logicians receive 5 Contract Slips. Ontologists receive the Ontology Key.
  *   **Action:** Logicians write contracts (e.g., "Deliver 1 Horse," "Deliver 1 White Horse"). Merchants submit cards to fulfill them.
  *   **Default Rule:** If no dispute arises, the trade stands. Merchants get paid by the "Bank" (Instructor).
  *   **Constraint:** Logicians are forbidden from writing "Deliver 1 Horse that is White." They must use the specific terms "Horse" or "White Horse."

  ### Phase 2: The Semantic Crisis (20 Minutes)
  *   **Trigger:** The Instructor announces a "Shortage." The Bank will no longer pay Merchants for combined cards ("Horse" + "White") unless the Ontologists rule it valid.
  *   **Action:** Logicians begin issuing *only* "White Horse" contracts. Merchants attempt to fulfill them using "Horse" + "White" combinations to conserve their limited "White Horse" cards.
  *   **Dispute:** Logicians reject the combination. "This is a Horse, and this is White. This is not a White Horse."
  *   **Adjudication:** Ontologists must rule. They consult their **Ontology Key**:
      *   *Rule A:* If "White" is Intersective, Combination = Valid.
      *   *Rule B:* If "White" is Constitutive, Combination = Invalid.
      *   *Catch:* The Key does not say which "White" is. The Ontologists must debate and decide, then stick to that decision for all subsequent rounds to keep their Consistency Points.
  *   **Pressure:** Merchants will run out of "White Horse" cards. They will argue that refusing the combination makes trade impossible (pragmatic argument). Logicians will argue that accepting the combination destroys the meaning of the contract (semantic argument).

  ### Phase 3: The Sovereign's Decree (Optional/Time Permitting)
  *   If the game stalls, the Instructor (acting as the Sovereign) declares that "Horse" now includes "White Horse" for tax purposes, forcing the Logicians to accept the conjunction view temporarily. Observe the frustration of the Logicians.

  ---

  ## 3. Debrief & Mapping (30 Minutes)

  Do not ask "Who won?" Ask "Where did the system break?"

  **Step 1: Mapping the Breakdown (10 Minutes)**
  *   Ask the **Merchants**: "At what point did you feel the Logicians were being unreasonable? Why does 'Horse + White' feel like it should equal 'White Horse'?"
      *   *Target:* This maps to the Mohist objection that names are tools for distinguishing reality, not creating it. If the object is the same, the name shouldn't block the transaction.
  *   Ask the **Logicians**: "Why was the combination unacceptable? What were you protecting?"
      *   *Target:* This maps to Gongsun Long's claim that the *intent* of the name "White Horse" is to exclude yellow/black horses. If you accept "Horse + White," you admit that "Horse" is the primary category, which Gongsun denies.
  *   Ask the **Ontologists**: "What forced you to choose between Intersective and Constitutive? Did your choice change the reality of the game?"
      *   *Target:* This maps to the modern analytic distinction. If "White" is intersective, $F(x) \land G(x)$. If constitutive, it creates a new kind $H(x)$.

  **Step 2: Introducing Hui Shi (10 Minutes)**
  *   Pose the question: "The Logicians froze the trade by rigidifying distinctions. The Merchants wanted to melt distinctions for flow. Where is Hui Shi in this room?"
  *   Explain Hui Shi's thesis: "The heavens are as low as the earth." Distinctions are relative to perspective.
  *   **Application:** If the Ontologists had ruled that "White Horse = Horse" for *taxation* but "White Horse $\neq$ Horse" for *breeding*, would that solve the problem?
  *   **Point:** Hui Shi argues that rigid categories (Gongsun Long) ignore the fluidity of actual relations. The game broke because everyone insisted on one absolute ontology. Hui Shi would suggest the contract itself is the arbitrary frame.

  **Step 3: The Logical Structure (10 Minutes)**
  *   Draw the syllogism on the board that the game *tried* to simulate:
      1.  "Horse" designates Form.
      2.  "White" designates Color.
      3.  "White Horse" designates Form + Color.
      4.  Therefore, the designation "White Horse" is not the designation "Horse."
  *   Ask: "Did the game prove this? Or did it just show that contracts fail if we disagree on definitions?"
  *   **Crucial Distinction:** The game simulates the *pragmatic consequence* of the view (trade breakdown), not the *logical validity*.

  ---

  ## 4. Honest Note on Predictable Failures

  **Failure 1: The "Gotcha" Dynamic**
  *   **Prediction:** Logicians will treat the game as a trick to deny Merchants points, rather than a philosophical stance. They will enjoy saying "No" without justification.
  *   **Recovery:** Intervene in Phase 2. Require Logicians to write a one-sentence justification on the Contract Slip for every rejection. "Rejected because Form $\neq$ Compound." This forces them into the text's voice.

  **Failure 2: Ontologist Paralysis**
  *   **Prediction:** Faction 3 will struggle to define "Intersective" vs. "Constitutive" quickly and may rule randomly to keep the game moving, losing the philosophical thread.
  *   **Recovery:** Provide a concrete example on their Key. "Intersective: Red Ball (is a Ball). Constitutive: Past President (is not President)." Tell them to treat "White Horse" as the test case. Their struggle *is* the lesson.

  **Failure 3: Time Creep**
  *   **Prediction:** Negotiations will drag. You will run out of time for the Hui Shi connection.
  *   **Recovery:** Hard stop at minute 55. Begin debrief immediately. It is better to have a rich 20-minute debrief than a finished game with no reflection.

  ---

  ## 5. Frank Admission of Limitations

  **What This Exercise Cannot Reproduce:**
  This game cannot reproduce the **formal proof structure** of Gongsun Long's *Bai Ma Lun*.
  *   **The Limitation:** Gongsun Long's argument is not merely that "contracts get confusing." It is a metaphysical claim about the independence of universals (*zhi*). He argues that "Whiteness" exists independently of any white object, and "Horseness" exists independently of any horse. The compound "White Horse" brings these two independent universals together, creating a third entity that is logically distinct from "Horse."
  *   **The Gap:** In the game, the cards are physical objects. Students argue about *inventory management*. Gongsun Long is arguing about *ontology*. The game simulates the social friction of the theory, but it cannot simulate the abstract deduction that "Color is not Form."
  *   **Instructor's Burden:** You must explicitly supply this after the debrief. Tell them: "You felt the frustration of the distinction. Gongsun Long felt the *necessity* of it. He wasn't trying to make trade hard; he was trying to show that reality is made of these distinct building blocks, and language must reflect that, even if it breaks our common sense."

  **Why Hui Shi Matters Here:**
  The game inevitably favors Gongsun Long (rules are rigid) or the Merchants (pragmatism wins). Hui Shi's contribution—that distinctions are relative to the "viewpoint" (*guan*)—is hard to gamify because it dissolves the rules needed to play. You must explain that Hui Shi offers the *escape* from the deadlock the students just experienced, by suggesting the deadlock itself is an illusion of fixed language.
