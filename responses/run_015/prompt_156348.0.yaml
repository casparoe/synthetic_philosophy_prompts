  # The Absent-Minded Driver: A Diagnostic Tree

  To locate your own view on the philosophy of action, follow the path below. Begin at the root and select the claim that best matches your intuition. Proceed through the questions until you reach a leaf node. Note that some questions are only relevant depending on your initial answer; if a path directs you to skip a question, do so.

  ### **Root: The Status of the Journey**
  *Which claim best describes the driver's state during the familiar stretch of road?*

  *   **Path A:** The driver is genuinely acting intentionally; they are driving the car.
  *   **Path B:** The driver is only apparently acting; the behaviour looks intentional but is not.

  ---

  ### **Path A: The Intentional View**
  *(Proceed to Question 1)*

  **Question 1: Must practical knowledge of the route be occurrent?**
  *   **Claim A1:** Guiding the car requires active, conscious thought about the turns.
  *   **Claim A2:** Guiding the car does not require active, conscious thought about the turns.

  *(If you chose **Claim A1**, proceed to Question 2. If you chose **Claim A2**, skip to Question 2.)*

  **Question 2: Can sub-personal mechanisms substitute for personal knowledge?**
  *   **Claim A3:** Sub-personal brain mechanics can take over without breaking the chain of intentionality.
  *   **Claim A4:** Sub-personal brain mechanics cannot substitute for the driver's own knowledge.

  #### **Leaves for Path A**

  **1. Claim A1 + Claim A4**
  *   **Position:** Conscious Volitionism
  *   **Awkward Commitment:** You cease to be the driver the moment your mind wanders, even if you stay perfectly in your lane.

  **2. Claim A1 + Claim A3**
  *   **Position:** Unoccupied
  *   **Diagnosis:** Incoherence; one cannot claim conscious thought is required while simultaneously admitting mechanical processes can substitute for it.

  **3. Claim A2 + Claim A4**
  *   **Position:** Standard Cognitivism
  *   **Awkward Commitment:** You possess knowledge of the route that guides your hands, yet you are completely unaware of knowing it.

  **4. Claim A2 + Claim A3**
  *   **Position:** Hybrid Intentionalism
  *   **Awkward Commitment:** Your brain mechanics are actually steering the vehicle, but you are still held morally responsible for the turns.

  ---

  ### **Path B: The Apparent View**
  *(Skip Question 1 and 2; proceed to Question 3)*

  **Question 3: Is there a coherent intermediate category?**
  *   **Claim B1:** There is a middle state between deliberate action and mere reflex.
  *   **Claim B2:** There is no middle state; behaviour is either deliberate or it is reflex.

  *(If you chose **Claim B1**, proceed to Question 4. If you chose **Claim B2**, skip to Question 4.)*

  **Question 4: Does the driver retain genuine dispositional knowledge?**
  *   **Claim B3:** The driver retains a genuine dispositional knowledge of the route.
  *   **Claim B4:** Any attribution of knowledge here is merely post hoc and explanatory.

  #### **Leaves for Path B**

  **5. Claim B1 + Claim B3**
  *   **Position:** Phenomenology (Absorbed Coping)
  *   **Awkward Commitment:** You are most skilled at driving precisely when you stop trying to act like a conscious agent.

  **6. Claim B1 + Claim B4**
  *   **Position:** Unoccupied
  *   **Diagnosis:** Unattractiveness; positing a directed middle state that relies on no knowledge whatsoever borders on magic.

  **7. Claim B2 + Claim B3**
  *   **Position:** Unoccupied
  *   **Diagnosis:** Incoherence; a mere reflex cannot logically possess 'knowledge' of a route, dispositional or otherwise.

  **8. Claim B2 + Claim B4**
  *   **Position:** Hard Eliminativism
  *   **Awkward Commitment:** You did not drive home; a biological machine drove your body while you zoned out.

  ---

  ### **Ambiguities and Unresolved Distinctions**

  This instrument cannot cleanly separate **Standard Cognitivism** (Leaf 3) from **Hybrid Intentionalism** (Leaf 4) if the reader believes 'personal knowledge' is simply a high-level description of 'sub-personal mechanics'. To distinguish these, a further question is required: *Is the explanation of the action fundamentally normative (about reasons) or causal (about physics)?*

  Similarly, the tree groups **Phenomenology** (Leaf 5) with any view that accepts an intermediate category. To separate Heideggerian 'absorbed coping' from simple 'habit', one would need to ask: *Does this intermediate state involve a specific type of non-conceptual awareness, or is it purely mechanical?*

  Finally, **Conscious Volitionism** (Leaf 1) and **Hard Eliminativism** (Leaf 8) arrive at similar practical conclusions (the daydreaming driver is not 'acting'), but for opposite reasons. The tree separates them at the Root, but a reader who believes consciousness is an illusion may find the Root question itself unintelligible.
