  (d) **Preliminary Sketch of Discarded Structures**

  Before settling on the case below, I considered three alternative structures. First, a *temporal aggregation* case, where risks are spread over time rather than states. I discarded this because Specification 1 requires fixed individuals and existence independent of the decision; temporal averaging often smuggles in person-affecting complications regarding future selves. Second, a *tiny-probability catastrophe* model (e.g., Pascal's Mugging variants). I rejected this because Specification 1 explicitly bans probabilities below 0.05; I want the objection to rest on substantial risk, not tail events. Third, a *zero-sum conflict* where one party's gain is another's loss. This fails because the Safe Pareto criterion requires strict improvement for all; a zero-sum case would never satisfy the antecedent. I commit to the **coarse-versus-fine partition** structure presented below. It isolates the ethical weight of *ignoring available information* while satisfying the robustness constraints of the Safe Pareto definition.

  ***

  (a) **The Scenario**

  **Setting:** A National Hospital Trust deciding on a surgical protocol for a scheduled list of knee replacements.
  **Roles:** The Trust Board (Planner) and three patients on the immediate list (P1, P2, P3), who represent distinct physiological sub-groups within the population.
  **Decision:** Adopt a new bio-adhesive protocol ($I$) or retain standard sutures ($S$).
  **Stakes:** $I$ reduces recovery time significantly but carries a risk of severe allergic reaction dependent on a specific genetic marker. $S$ is slower but safe.
  **Uncertainty:** The state space $W$ combines the presence of the genetic marker and the healing environment. The Trust knows the patients fall into a broad "Class A" (low general risk) or "Class B" (high general risk) based on standard pre-op screens ($L$), but a rapid genetic test ($L^*$) could distinguish the specific marker within Class A. The Board chooses not to run the rapid test to avoid delaying the surgical list, relying instead on the coarse screen.
  **Empirical Disagreement:** Epidemiologists reasonably disagree on the prevalence of the specific marker within Class A, represented by the set of priors $P$.

  **Table 1: Utilities and Probabilities**

  | State ($w$) | Description | $p(w)$ Range | $u_{1,2}(S)$ | $u_{1,2}(I)$ | $u_3(S)$ | $u_3(I)$ |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | $w_1$ | Class A, Marker Absent | $[0.30, 0.35]$ | 0 | +10 | 0 | +40 |
  | $w_2$ | Class A, Marker Present | $[0.15, 0.20]$ | 0 | +10 | 0 | **-20** |
  | $w_3$ | Class B, Low Stress | $0.25$ (fixed) | 0 | +10 | 0 | +10 |
  | $w_4$ | Class B, High Stress | $0.25$ (fixed) | 0 | +10 | 0 | +10 |

  **Partitions:**
  *   **Coarse ($L$):** $\{ \{w_1, w_2\}, \{w_3, w_4\} \}$. (Distinguishes Class A vs. Class B).
  *   **Fine ($L^*$):** $\{ \{w_1\}, \{w_2\}, \{w_3\}, \{w_4\} \}$. (Distinguishes Marker status).

  **Admissible Priors ($P$):**
  $P$ is the convex set of probability distributions defined by:
  1.  $p(w_3) = p(w_4) = 0.25$.
  2.  $p(w_1) + p(w_2) = 0.50$.
  3.  $p(w_2) \in [0.15, 0.20]$ (reflecting empirical disagreement on marker prevalence).
  4.  Consequently, $p(w_1) \in [0.30, 0.35]$.

  *Note on Interpersonal Comparability:* Utilities are von Neumann-Morgenstern indices calibrated such that 0 is the baseline health state, +10 is full early recovery, and -20 represents permanent mobility loss (serious irreversible harm). The scale is cardinally significant for each individual; the harm (-20) is deemed 'serious' by clinical standards regardless of the gain (+40) in other states.

  ***

  (b) **Verification**

  **1. Safe Pareto Improvement relative to $L$ and $P$**
  We must verify that for every $p \in P$, every individual $i$, and every cell $E \in L$, $E_p[u_i(I) \mid E] > u_i(S)$. Since $u_i(S) = 0$ everywhere, we check if conditional expected utility for $I$ is strictly positive.

  *   **For P1 and P2:** $u(I) = +10$ in all states. Conditional expectation is +10 in any cell. Condition holds.
  *   **For P3 in Cell $E_2 = \{w_3, w_4\}$:** $u_3(I) = +10$ in both states. Conditional expectation is +10. Condition holds.
  *   **For P3 in Cell $E_1 = \{w_1, w_2\}$:**
      The conditional expected utility is given by:
      $$ \text{CEU}_3(E_1) = \frac{40 \cdot p(w_1) - 20 \cdot p(w_2)}{p(w_1) + p(w_2)} $$
      Since $p(w_1) + p(w_2) = 0.5$, this simplifies to:
      $$ \text{CEU}_3(E_1) = 2 \cdot (40 \cdot p(w_1) - 20 \cdot p(w_2)) = 80 p(w_1) - 40 p(w_2) $$
      Substituting $p(w_1) = 0.5 - p(w_2)$:
      $$ \text{CEU}_3(E_1) = 80(0.5 - p(w_2)) - 40 p(w_2) = 40 - 120 p(w_2) $$
      This is a linear function of $p(w_2)$. To verify robustness over the convex set $P$, we check the vertices (extrema) of the interval $p(w_2) \in [0.15, 0.20]$.
      *   At $p(w_2) = 0.15$: $\text{CEU} = 40 - 120(0.15) = 40 - 18 = +22$.
      *   At $p(w_2) = 0.20$: $\text{CEU} = 40 - 120(0.20) = 40 - 24 = +16$.
      Since the minimum value (+16) is strictly positive, P3 is a robust expected beneficiary in cell $E_1$ under every admissible prior.
      *Verification Note:* Conditional expected utility is a linear-fractional function of the probability vector. Such functions attain their extrema over convex polytopes at the vertices. By checking the bounds of $p(w_2)$, we have verified the condition for all $p \in P$.

  **2. Ex Post Pareto Failure**
  In state $w_2$, $u_3(I) = -20$ while $u_3(S) = 0$. P3 suffers serious irreversible harm.
  Probability check: For every $p \in P$, $p(w_2) \ge 0.15$. This exceeds the Specification 5 threshold of 0.10.

  **3. Failure relative to $L^*$**
  Consider the cell $E^* = \{w_2\} \in L^*$.
  The conditional expected utility for P3 is simply $u_3(I, w_2) = -20$.
  This is strictly lower than $u_3(S) = 0$.
  Probability check: For every $p \in P$, $p(w_2) \ge 0.15$. This exceeds the Specification 6 threshold of 0.15.
  Thus, $I$ is not safe relative to the refined partition $L^*$.

  **4. Unavailability of Targeted Variant (Specification 7)**
  Could the Trust run the test ($L^*$) and apply $I$ only to those in $w_1$?
  No. The bio-adhesive requires batch preparation for the entire surgical list to maintain sterile integrity; individualised preparation breaches the sterile window and invalidates the efficacy of the drug for all patients (reducing utility to below $S$). Thus, the intervention must be uniform. The information from $L^*$ arrives too late to individualise the protocol without destroying the benefit for the winners.

  ***

  (c) **Verdicts**

  **1. The Safe Pareto Criterion**
  **Verdict:** Permissible.
  **Reasoning:** Relative to the information structure $L$ actually used by the planner, every individual expects to gain in every distinguishable event, across all reasonable probability distributions. P3 expects a gain of at least +16 utility units in the relevant cell. The criterion is satisfied.

  **2. Plain Ex Ante Pareto (Single Prior)**
  **Verdict:** Permissible.
  **Reasoning:** Even taking a single prior (e.g., the midpoint $p(w_2)=0.175$), the unconditional expected utility for P3 is positive ($40(0.325) - 20(0.175) + 10(0.5) = 13 - 3.5 + 5 = 14.5$). Standard ex ante utilitarianism or Pareto principles would endorse $I$.

  **3. Ex Post / Actual Consent View**
  **Verdict:** Impermissible.
  **Reasoning:** In state $w_2$, P3 suffers a serious harm they would strictly veto. Crucially, this state was *knowable* via $L^*$ before the decision. Had the planner acquired $L^*$, they would have known that for the subgroup in $w_2$, $I$ is catastrophic. Implementing $I$ without actual consent ignores information that would have secured P3's veto.

  **4. Hypothetical-Consent Contractualism**
  **Verdict:** Ambiguous / Leaning Impermissible.
  **Reasoning:** A contractualist asks whether P3 could reasonably reject the principle governing the action. If the principle is "Maximise expected utility given *coarse* information," P3 might accept it ex ante. However, if the principle is "Maximise expected utility ignoring *available fine* information," P3 has strong grounds for rejection. The case isolates whether the duty to seek consent extends to a duty to refine one's information partition before acting.

  ***

  (e) **Key Feature and Defence**

  **The Working Feature:**
  The ethical force of the case rests entirely on the **chosen coarseness of $L$**. The planner *could* have brought about $L^*$ (the rapid test) at low cost but chose not to. If we remove this feature—i.e., if $L^*$ were unavailable or astronomically costly—the case collapses into a standard ex ante Pareto improvement where ignoring the specific risk is epistemically unavoidable. The deontological objection vanishes if the ignorance is involuntary; it bites only because the ignorance is cultivated.

  **Strongest Attack:**
  A defender of the Safe Pareto criterion might argue: *"The planner is not obligated to maximise information before every decision. $L$ represents the 'standard of care' for information gathering. To demand $L^*$ is to demand omniscience or infinite deliberation, which paralyses action."*

  **Reply:**
  This conflates *omniscience* with *available specificity*. Specification 6 stipulates the test is cheap and unobjectionable. In professional contexts (like medicine), the duty of care includes running available diagnostic tests before imposing risk. The Safe Pareto criterion, by validating $I$ under $L$, effectively licenses the planner to ignore diagnostic data that would reveal losers. It treats the information structure as fixed rather than as a variable subject to moral scrutiny. The surplus ethical work is done by the claim that **risk imposition requires not just expected benefit, but the exhaustion of reasonable methods to identify specific veto-holders.**

  ***

  (f) **Honest Assessment**

  Is the deontological objection here anything more than the familiar complaint about ex ante Pareto improvements? **Yes.**

  The familiar complaint is that ex ante Pareto improvements can mask ex post losses. The standard replies are: (1) the losses might be artefacts of a contested prior, or (2) better evidence might have reversed the verdict. This case hardens the objection against both replies.
  1.  **Robustness:** The improvement holds for *every* prior in $P$. It is not an artefact of one contested probability.
  2.  **Evidence:** Better evidence ($L^*$) *was* available, but the Safe Pareto criterion validates the decision *without* it.

  The surplus consists in the **normative status of the partition $L$**. The case demonstrates that Safe Pareto Improvements can be used to launder impermissible risk impositions by formally restricting the information set to one that hides the losers. If the deontological objection holds, it implies that the permissibility of a policy depends not only on the probabilities and utilities but on the **moral obligation to refine the partition** before acting. For your paper, this suggests that any defence of Safe Pareto as a surrogate for consent must include a constraint on the admissibility of the information partition itself, not just the probabilities defined over it. Without that, SPI is vulnerable to strategic ignorance.
