  *   **Definition:** An system is **Flexible** if its immediate motor outputs are continuously determined by the current sensory input relevant to the physical goal, rather than by a pre-written script. It asks: "Is the arm being pushed around by the world right now, or is it pushing the world around based on a memory?"
