  - What each surviving principle predicts about Incident 7, and why.
  - Your best prediction of Marta's call, with your reason for preferring it, which precedent is the closest analog, and which is the closest counter-analog. If her record genuinely underdetermines the case, say so plainly and state what principle we would be adopting with each choice.
  - The single additional probe case, described concretely enough that we could actually run it, that best separates the surviving principles, together with what each predicts about it. I would guess something like keeping the argmax policy but arming a three-strike escalation rule, or alternatively turning on sampling so there is a live candidate set while leaving the weights frozen, but tell me which one isolates more and why.
  - Which principle you would put in the handbook, given what the label is for, and whether this is a free-will question in disguise: are my three candidates versions of familiar accounts of free and unfree action, roughly could-have-done-otherwise versus guidance-control-or-reasons-responsiveness versus learning-and-self-control-over-time? Name them in plain terms with no citations.
  - Where the principle you recommend gives silly answers: does it count a thermostat or a cheap robot vacuum as flexible, or a human in a very deep habit, a sleepwalker, or someone acting under a posthypnotic suggestion as sphexish?
