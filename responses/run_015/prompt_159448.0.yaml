  Background. My team builds and operates autonomous warehouse cells. In incident review we sort each bad behavior into one of two buckets, and the bucket decides where the incident goes. Sphexish means: this is a mechanism malfunctioning, file it as a bug against the code. Flexible means: this is something an agent did, route it to a human-factors review where we ask about training, incentives, and who could have done otherwise. The word comes from the philosophy-of-mind literature on digger wasps: a Sphex wasp paralyzes prey, leaves it on the threshold of her burrow, goes inside to inspect, comes back out, and drags it in; if you move the prey a few inches while she is inside, she fetches it back to the threshold and then inspects the burrow again, and again, by some accounts indefinitely. I have heard the ethology is contested; please assume the textbook version is true, because I care about the concept, not about the wasp.

  Every call so far has been made by our principal engineer, Marta, who has been scrupulously consistent. I am writing the criteria into the handbook next sprint and I want to know what we would actually be committing to. Her record:

  1. The wasp case itself. Sphexish. This is her paradigm.
  2. Our old pick-and-place firmware: a fixed sequence of grasp, scan barcode, place. If a part is nudged ten centimeters during the scan step, the arm puts it back at the original pick pose and re-runs the scan from the top. Sphexish. Her remark: it is the wasp in a nicer enclosure.
  3. A bang-bang HVAC controller with a fixed set point and no model of the room: it overshoots and cycles all day. Sphexish. Her remark: it is tracking a number, not the room; nothing it does is answerable to what is actually going on.
  4. A language model that drafts our incident summaries. If we insert a new constraint mid-generation, it keeps completing the sentence shape it was already in and never honors the constraint. Sphexish. Her remark: there were a million things it could have typed and it typed the one that fit the groove it was already in.
  5. A human forklift operator who twice drove on autopilot to the station she used last year. Flexible. She was reachable the whole time: she snapped out of it the instant a coworker called her name, and after the second time she left herself a note and it never recurred. Her remark: you can reach her.
  6. An older learned gripper policy that failed three grasps on a new part type and then, on the fourth attempt, came in at a different approach angle and succeeded. Flexible. Her remark: it gave up on the thing that was not working.

  The new case, Incident 7, which is mine to classify. A bin-picking cell running a learned policy: one forward pass per frame at 60 Hz over a fixed action grid, argmax, no candidate set, no sampling, no comparison between options, and no memory of earlier attempts. It re-reads the depth image fresh every frame. Two things happened. First, when a part was moved fifteen centimeters mid-reach, the arm retargeted smoothly and grasped it correctly in the new position. Second, in a static scene with a part wedged under a lip, it emitted grasp after grasp against the lip for eleven minutes, over four hundred attempts. Each individual grasp was subtly different, because each one was fitted to the geometry it saw at that instant and the scene jitters slightly, but it never did anything categorically different: never reoriented the part, never pushed it free, never escalated. There is an escalation path in the codebase, gated on a timeout nobody enabled.

