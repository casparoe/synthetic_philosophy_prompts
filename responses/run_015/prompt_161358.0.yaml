      However, the "Mismatch" is also potent. A play about Black sisters settling an estate in Mississippi might *not* move white suburbanites on a racial attitude scale, regardless of quality. It might confuse them or leave them cold. If the foundation expects conversion, and I remove the contingency, do they still expect it?
      The prompt says "terms have forced the old question on me."
