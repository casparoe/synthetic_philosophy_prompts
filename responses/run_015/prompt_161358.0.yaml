answer: |-
  The equivocation you have identified is precise, and resolving it requires separating the ontology of art from the economics of its production. Your tripartite distinction—aim, uptake, and ratifying—provides the necessary taxonomy to dismantle the false dichotomy presented by your director and your dramaturg. The central error in this debate is the conflation of art's inevitable political *effects* with art's instrumentalization as a political *tool*.

  To begin with Du Bois: His 1926 thesis is defensible only in the **uptake** and **ratifying** senses, and explicitly not in the **aim** sense as defined by your contract. When Du Bois argued that "all art is propaganda," he was contesting the notion of "art for art's sake" in a vacuum of racial terror. His claim was that a Black artist ignoring the condition of Black people produces a falsehood, thereby ratifying the status quo (the ratifying sense), and that such a work will inevitably be read through the lens of racial politics regardless of intent (the uptake sense). Du Bois was arguing for the *truthfulness* of the representation, not the *efficacy* of the conversion. He sought art that would make Black experience legible and dignified to Black people (ratifying) and undeniable to the world (uptake). He did not argue for art engineered to produce a specific, measurable shift in the psychological metrics of a dominant audience. Therefore, the truth of Du Bois's claim licenses the artist to acknowledge the political weight of their work and to reject purist disclaimers. It does *not* license a funder to treat the artwork as a lever for social engineering, nor does it justify payment structures contingent on behavioral modification. The dramaturg's invocation of Du Bois to support the contract is a category error; Du Bois defends the political *nature* of art, not the industrial *management* of its impact.

  This leads to the aesthetic objection. The damage here does not attach to political content, nor strictly to persuasive aim, nor solely to the mismatch of audience. It attaches to **measurement**. The mechanism of damage is **anticipatory censorship**. When the final third of a fee is contingent on a survey number, the artist ceases to write for the character's truth and begins to write for the evaluator's metric. This is not the "missionary discipline" your dramaturg suggests, where an artist struggles to make their vision legible to a hostile outsider. That discipline is internal: *How do I make this human truth undeniable?* The discipline imposed by the contract is external: *What scene ensures a positive delta on question four?*

  This externalizes the aesthetic judgment. In the "aim sense" propaganda of the contract, the audience is treated as a site of extraction (data) rather than reception (experience). The aesthetic cost is the truncation of ambiguity. If a scene complicates the racial narrative in a way that might confuse a white suburban subscriber and lower their "racial attitude score," the economic incentive is to cut it. This creates a work that is aesthetically hollow, not because it is political, but because it is *pre-answered*. The mismatch between your implied audience (Black, ratifying) and the actual audience (white, missionary) exacerbates this. A play about two sisters settling an estate is an interior drama. To judge its success by the exterior political shift of a demographic not present in the text is to demand the play perform a function it structurally excludes. The play cannot convert what it does not address without ceasing to be the play you intend to write.

  Regarding time and obsolescence: The self-consuming character of persuasive art should carry little weight in this specific judgment. You are correct that much undisputed art is occasional; it speaks to a specific moment and loses potency when the moment passes. This is not a defect of art, but a feature of history. The problem is not that the work might become obsolete if it succeeds in changing minds. The problem is that the **contingency** makes the obsolescence a financial penalty rather than a historical fact. If the work succeeds in moving the audience, the foundation's goal is met, but if the survey fails to capture it, you are unpaid. Conversely, if the work fails artistically but the survey registers a shift (perhaps due to the talkback curriculum rather than the play), you are paid. This decouples the artistic success from the financial reward. The "self-consuming" nature of propaganda is only an aesthetic risk; the "contingent" nature of this contract is an ethical and structural corruption of the artistic relationship.

  Therefore, the defensible course is **taking the commission while refusing the contingent tranche and the talkback curriculum.**

  You must accept the flat fee and reject the metrics. This position holds because it preserves the possibility of the "uptake" sense of propaganda without submitting to the "aim" sense. The play can still do political work in the white suburbs (uptake) without being engineered for it (aim). By removing the contingency, you remove the anticipatory censorship. The audience may still be a mismatch, and the work may still be received as missionary propaganda by the subscribers, but that is a risk of reception (uptake), not a directive of production (aim). Art can survive a hostile or mismatched audience; it cannot survive a contract that monetizes its failure to convert them. The foundation's charter commits to racial justice; paying for the *production* of Black art is justice. Paying for the *measurable conversion* of white liberals is commodification. You must insist that the art is the intervention, not the survey.

  The opposite view—that you must **refuse the commission outright**—would win only if the following condition were true: that the context of the tour (white suburbs + foundation oversight) inherently coerces the "aim sense" regardless of the contract terms. If the mere presence of the foundation's evaluators, even without financial contingency, creates an atmosphere of surveillance that forces you to self-censor to maintain future relationships, then the contract's specifics are irrelevant; the ecosystem itself is the propaganda machine. If the "mismatch" is so severe that presenting a ratifying Black work to a white missionary audience fundamentally violates the work's integrity—making the performance itself an act of bad faith—then no contractual adjustment can save it. However, absent that totalizing coercion, the measurement is the poison, not the venue. Remove the syringe, and the body can fight the infection on its own terms.
