prompt: |-
  You are the research-integrity officer at a research university, responsible for auditing faculty justifications for post-hoc modifications to study protocols. The philosophical distinction between reasons of the right kind and reasons of the wrong kind holds that some considerations bear on whether a belief or methodological choice is warranted by its object (for example, that a data point reflects instrument malfunction), while others bear only on whether holding that belief or making that choice is beneficial (for example, that removing it yields statistical significance). You must operationalize this distinction into a reusable audit procedure that a non-philosopher can apply consistently to written justifications submitted after preliminary data inspection.

  Construct a step-by-step decision procedure, presented as an ordered sequence of tests with explicit branching conditions, that classifies a researcher's stated reason for altering a protocol. The procedure must address three specific decision nodes: (i) exclusion of individual observations; (ii) addition, removal, or transformation of covariates in an analytic model; and (iii) substitution of a pre-registered statistical model with an alternative specification. At each node, specify the indicators that a reason is responsive to the internal evidential aims of the study, the indicators that it is responsive to external incentives, career pressures, or desired outcomes, and the conditions that trigger mandatory escalation to a review panel because the procedure cannot settle the classification.

  Incorporate three structural checks into the procedure: an initial filter separating considerations about the study's epistemic aims from considerations about its institutional or personal consequences; a symmetry test asking whether the researcher would have accepted the same consideration if it produced a result contrary to their interests; and a mixing clause that identifies arguments in which both kinds of reason are intertwined and requires disaggregation before evaluation. Provide fully worked applications of the complete procedure to three submitted justifications: one in which the reason is clearly of the right kind but forces the researcher to abandon a favored hypothesis; one in which the reason is of the wrong kind but is expressed in technically legitimate language; and one genuinely ambiguous case in which the procedure reaches no determination and must be escalated.

  Conclude by stating the explicit limits of the procedure: whether it can identify unconscious bias, whether it requires access to private mental states, whether it treats all pragmatic considerations as corrupting, and whether it applies differently when the protocol change was made before versus after data inspection. Do not cite philosophical texts or provide a bibliography; ground the procedure solely in the conceptual structure of the distinction itself.
reasoning: |-
  Here's a thinking process that leads to the suggested audit procedure:

  1.  **Analyze the Request:**
      *   **Role:** Research-Integrity Officer at a research university.
      *   **Task:** Create a reusable audit procedure for faculty justifications of post-hoc protocol modifications.
      *   **Core Concept:** The philosophical distinction between "reasons of the right kind" (RRK) vs. "reasons of the wrong kind" (RWK). RRK relate to the object/truth/evidence; RWK relate to benefits/consequences/incentives.
      *   **Requirements:**
          *   Step-by-step decision procedure (ordered sequence, branching conditions).
          *   Address three specific decision nodes: (i) exclusion of observations, (ii) covariate manipulation, (iii) model substitution.
          *   Include three structural checks: Initial Filter (Epistemic vs. Consequential), Symmetry Test, Mixing Clause.
          *   Provide three worked applications (RRK against interest, RWK disguised, Ambiguous/Escalation).
          *   State explicit limits (unconscious bias, mental states, pragmatic considerations, timing).
          *   Constraint: Do not cite philosophical texts or provide a bibliography.

  2.  **Deconstruct the Core Concept (RRK vs. RWK) for this Context:**
      *   *Right Kind:* Relates to data quality, measurement validity, assumption violations, pre-specified error correction. It asks: "Is this change necessary to accurately reflect the phenomenon under study?"
      *   *Wrong Kind:* Relates to p-values, publication likelihood, grant renewal, narrative coherence, career advancement. It asks: "Is this change beneficial to the researcher's goals?"
      *   *Operationalization:* I need to translate these abstract philosophical concepts into concrete questions an auditor can ask about a written justification.

  3.  **Drafting the Procedure (Step-by-Step):**
      *   *Phase 1: Intake & Categorization.* Identify which of the three nodes applies.
      *   *Phase 2: Structural Checks.*
          *   Check 1: Initial Filter (Epistemic vs. Consequential).
          *   Check 2: Mixing Clause (Are they blended?).
          *   Check 3: Symmetry Test (Counterfactual).
      *   *Phase 3: Node-Specific Tests.* (i) Outliers, (ii) Covariates, (iii) Models.
      *   *Phase 4: Determination.* (Approved, Rejected, Escalated).

  4.  **Refining the Structural Checks:**
      *   *Initial Filter:* Look for keywords. "Malfunction," "calibration" (Epistemic) vs. "Significance," "power," "story" (Consequential).
      *   *Mixing Clause:* If both appear, the researcher must separate them. If they refuse or can't, escalate.
      *   *Symmetry Test:* This is crucial. "Would you make this change if the result became non-significant/null?"

  5.  **Developing the Three Decision Nodes:**
      *   *(i) Exclusion:* RRK = Instrument error, protocol violation (e.g., subject fell asleep). RWK = "It was an outlier that ruined the p-value."
      *   *(ii) Covariates:* RRK = Confounder identified in literature, pre-specified interaction. RWK = "Adding this control makes the main effect significant."
      *   *(iii) Model Substitution:* RRK = Assumption violation (heteroskedasticity), distribution mismatch. RWK = "OLS didn't work, GLM gives the desired result."

  6.  **Drafting the Worked Applications:**
      *   *Case 1 (RRK against interest):* Researcher finds a calibration error. Fixing it kills the effect. They report it anyway.
      *   *Case 2 (RWK disguised):* Researcher claims "robustness check" but only reports the model that works. Language is technical ("heteroskedasticity-consistent"), but the selection process is outcome-driven.
      *   *Case 3 (Ambiguous):* A complex data cleaning issue where "error" is subjective (e.g., is a slow reaction time an error or a valid extreme?). Hard to distinguish epistemic judgment from outcome desire.

  7.  **Defining the Limits:**
      *   Can it detect unconscious bias? No, it relies on stated justifications.
      *   Does it require mind-reading? No, it relies on textual evidence and counterfactual consistency.
      *   Are all pragmatic considerations corrupting? No, resource constraints are valid, but not for *truth-claims*. Need to distinguish feasibility from validity.
      *   Timing? Yes, post-hoc is the focus, but pre-registered changes are treated differently (usually allowed if documented).

  8.  **Review and Refine (Self-Correction):**
      *   *Tone:* Administrative, precise, objective.
      *   *Constraint Check:* Did I cite philosophy? No. Did I cover all three nodes? Yes. Are the structural checks included? Yes.
      *   *Clarity:* Ensure the branching logic is clear (If X, then Y).
      *   *Symmetry Test:* Make sure this is applied rigorously. It's the strongest tool against RWK.
      *   *Mixing Clause:* Ensure it mandates disaggregation.

  9.  **Final Polish:** Check the flow. Start with the procedure, then the cases, then the limits. Ensure the distinction between "epistemic aims" (truth/accuracy) and "institutional consequences" (career/pub) is the through-line.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "p-hacking." I need to use the language of the prompt (Right/Wrong Kind). I also need to ensure the "Mixing Clause" doesn't just reject mixed reasons but asks for separation first.

  *(Refining the Limits)*: Be careful about "pragmatic considerations." Sometimes pragmatic reasons (budget ran out) are valid reasons to *stop* a study, but not to *fudge* the analysis. I need to clarify that distinction in the limits section.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Audit Procedure for Post-Hoc Protocol Modifications
  **Office of Research Integrity**
  **Document ID: AUD-PROT-04**
  **Subject: Operationalizing Evidential vs. Consequential Justifications**

  ## I. Purpose and Scope
  This procedure provides a standardized method for evaluating written justifications submitted by faculty regarding modifications to study protocols after preliminary data inspection. The objective is to distinguish between **Evidential Considerations** (reasons bearing on the accuracy, validity, or truth-tracking capacity of the study) and **Consequential Considerations** (reasons bearing on the benefits, outcomes, or external incentives associated with the study results).

  This procedure applies to three specific modification nodes:
  1.  **Exclusion:** Removal of individual observations/subjects.
  2.  **Covariate Manipulation:** Addition, removal, or transformation of control variables.
  3.  **Model Substitution:** Replacing a pre-registered statistical specification with an alternative.

  ## II. Structural Checks (Preliminary Screening)
  Before evaluating the specific technical merit of a justification, the auditor must apply three structural checks to the written submission.

  ### Check 1: The Initial Filter (Epistemic vs. Consequential)
  Scan the justification for the primary locus of the argument.
  *   **Pass (Epistemic):** The text references measurement error, instrument calibration, protocol deviation, assumption violations, or data integrity.
  *   **Fail (Consequential):** The text references statistical significance, power, effect size magnitude, narrative coherence, publication standards, or grant requirements.
  *   **Action:** If the text is exclusively Consequential, flag as **High Risk**. If exclusively Epistemic, proceed to Check 2. If mixed, proceed to Check 3.

  ### Check 2: The Mixing Clause (Disaggregation Requirement)
  If the justification contains both Epistemic and Consequential language (e.g., "The outlier violated normality assumptions *and* obscured the treatment effect"):
  *   **Requirement:** The researcher must explicitly separate the validity claim from the outcome claim.
  *   **Test:** Ask the researcher to rewrite the justification removing all references to the result's direction or significance.
  *   **Branching:**
      *   If the Epistemic reason stands alone as sufficient justification: Proceed to Node-Specific Tests.
      *   If the Epistemic reason collapses without the Consequential support: Classify as **Reason of the Wrong Kind**.
      *   If the researcher refuses or fails to disaggregate: **Escalate to Review Panel**.

  ### Check 3: The Symmetry Test (Counterfactual Consistency)
  This test assesses whether the justification is contingent on the desirability of the outcome.
  *   **Question to Researcher:** "If applying this modification resulted in a null finding or a result contrary to your hypothesis, would you still implement this modification?"
  *   **Branching:**
      *   **Yes:** The reason is likely of the Right Kind. Proceed to Node-Specific Tests.
      *   **No / Hesitant / Conditional:** The reason is likely of the Wrong Kind. Classify as **High Risk**.
      *   **Unclear:** **Escalate to Review Panel**.

  ---

  ## III. Node-Specific Decision Procedures
  After passing the Structural Checks, apply the specific test corresponding to the modification type.

  ### Node (i): Exclusion of Individual Observations
  *   **Test A (Documented Error):** Is there independent, time-stamped evidence of instrument malfunction, protocol violation, or data entry error for the excluded unit?
      *   *Yes:* **Approved (Right Kind).**
      *   *No:* Proceed to Test B.
  *   **Test B (Statistical Outlierism):** Is the exclusion based solely on the observation's distance from the mean or its leverage on the coefficient?
      *   *Yes:* **Flag (Wrong Kind).** Exclusion based on statistical influence alone is impermissible post-hoc.
      *   *No:* **Escalate.** (Requires expert statistical review to determine if the exclusion criterion was pre-specified).

  ### Node (ii): Addition, Removal, or Transformation of Covariates
  *   **Test A (Confounder Identification):** Is the covariate change justified by a specific causal mechanism identified in literature or pre-analysis, independent of the current dataset's correlation structure?
      *   *Yes:* **Approved (Right Kind).**
      *   *No:* Proceed to Test B.
  *   **Test B (Significance Chasing):** Does the justification imply the covariate was added/removed because it altered the significance of the primary independent variable?
      *   *Yes:* **Flag (Wrong Kind).**
      *   *No:* **Escalate.** (Requires review of pre-analysis plan to verify if covariate selection was exploratory).

  ### Node (iii): Substitution of Statistical Model
  *   **Test A (Assumption Violation):** Is there diagnostic evidence (e.g., residual plots, goodness-of-fit tests) demonstrating the pre-registered model violated mathematical assumptions (e.g., heteroskedasticity, non-normality)?
      *   *Yes:* **Approved (Right Kind).**
      *   *No:* Proceed to Test B.
  *   **Test B (Result Optimization):** Does the justification suggest the alternative model was selected because it provided a "better fit" defined primarily by the significance or magnitude of the main effect?
      *   *Yes:* **Flag (Wrong Kind).**
      *   *No:* **Escalate.** (Requires external statistical audit).

  ---

  ## IV. Worked Applications

  ### Case 1: The Right Kind Against Interest
  **Modification:** Node (i) Exclusion of Observations.
  **Submission:** "During data cleaning, we identified a timestamp error in the logging software for 15% of the treatment group. These responses were recorded 500ms faster than physically possible. We excluded these observations. Note: Excluding these errors reduces the effect size to non-significance (p=0.12), whereas including them yields p=0.04."
  **Audit Application:**
  1.  **Initial Filter:** Epistemic (timestamp error, physical impossibility). **Pass.**
  2.  **Mixing Clause:** Researcher explicitly notes the negative consequence on significance but does not use it to justify the exclusion. **Pass.**
  3.  **Symmetry Test:** Researcher confirms they would exclude the data even if it made the result significant (e.g., if the error favored the control group). **Pass.**
  4.  **Node (i) Test A:** Independent evidence of error (timestamp logs). **Pass.**
  **Determination:** **Approved.** The justification relies on data integrity (Right Kind), even though it harms the researcher's incentive to publish.

  ### Case 2: The Wrong Kind Disguised
  **Modification:** Node (iii) Model Substitution.
  **Submission:** "Initial OLS regression assumptions were not fully met. We transitioned to a Robust GLM specification to ensure the reliability of our estimates. This specification is standard in our field for this type of outcome variable."
  **Audit Application:**
  1.  **Initial Filter:** Mixed. "Assumptions not met" is Epistemic; "Reliability" is ambiguous. **Proceed to Mixing Clause.**
  2.  **Mixing Clause:** Researcher asked to specify *which* assumptions were violated. They provide no diagnostic plots, only the final model output. **Fail.**
  3.  **Symmetry Test:** Researcher asked if they would have switched to GLM if the OLS results were significant and the GLM results were null. Researcher states, "We likely would have stuck with OLS as it is more interpretable." **Fail.**
  4.  **Node (iii) Test A:** No diagnostic evidence of assumption violation provided. **Fail.**
  **Determination:** **Flagged (Wrong Kind).** The technical language ("Robust GLM," "Assumptions") masks a consequential choice driven by the output rather than the data structure.

  ### Case 3: The Ambiguous Escalation
  **Modification:** Node (ii) Covariate Manipulation.
  **Submission:** "We added a control for 'prior experience' because preliminary analysis suggested it interacted with the treatment. There is theoretical debate in the literature about whether this is a confounder or a mediator. We believe controlling for it provides a more conservative estimate."
  **Audit Application:**
  1.  **Initial Filter:** Mixed. "Interacted with treatment" implies data-driven selection (Consequential risk); "Conservative estimate" implies Epistemic caution.
  2.  **Mixing Clause:** Researcher cannot disentangle whether the decision was driven by the interaction *p-value* or the theoretical debate. **Trigger Disaggregation.**
  3.  **Symmetry Test:** Researcher states they would control for it regardless of the result, *provided* the interaction remained significant. This makes the justification contingent on the data structure in a way that is hard to verify pre-hoc. **Inconclusive.**
  4.  **Node (ii) Test A:** Literature is described as "debated," not settled. Selection appears driven by "preliminary analysis."
  **Determination:** **Escalate to Review Panel.** The distinction between valid model specification and data-driven fishing is unclear without external subject-matter expertise to adjudicate the theoretical status of the covariate.

  ---

  ## V. Explicit Limits of the Procedure

  **1. Unconscious Bias:**
  This procedure cannot identify unconscious bias. It operates solely on stated justifications and documented evidence. A researcher may genuinely believe a consequential reason is epistemic (self-deception). The Symmetry Test mitigates this but relies on honest self-reporting.

  **2. Access to Mental States:**
  The procedure does not require access to private mental states. It evaluates the *structure* of the argument and its consistency with evidence. It treats the written justification as the object of audit, not the researcher's intent.

  **3. Pragmatic Considerations:**
  The procedure does not treat all pragmatic considerations as corrupting. Resource constraints (e.g., "equipment broke") are valid Epistemic reasons if they affect data quality. However, pragmatic considerations regarding career advancement, publication likelihood, or funding renewal are classified as Consequential and are invalid justifications for altering truth-claims.

  **4. Timing of Modification:**
  This procedure applies strictly to modifications made *after* preliminary data inspection. Protocol changes made *before* data inspection (even if after pre-registration) are subject to a different standard, provided they are time-stamped and blinded to outcomes. Post-hoc changes are presumed suspect until cleared by this procedure.

  **5. Determination vs. Truth:**
  An "Approved" classification indicates the justification is of the Right Kind, not that the study's conclusions are true. A "Flagged" classification indicates the justification is of the Wrong Kind, not that the conclusions are false. The audit assesses the integrity of the process, not the validity of the scientific claim.
