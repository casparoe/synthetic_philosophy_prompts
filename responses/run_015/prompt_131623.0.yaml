prompt: |-
  I'm presenting at a workshop next month on epistemic humility in institutional design. The audience is mostly behavioral economists who run reference-class forecasting tournaments, philosophers of social science focused on the reference-class problem and self-locating belief, and a couple decision theorists; there are no institutional lawyers or policymakers in the room. I'm defending a thesis I'm calling the double-layered outside view: that institutional forecasting should apply reference-class base rates not only to the outcome being predicted, but also to the institution's own selection and weighting of reference classes. The claim is that without this second layer, inside-view reasoning reliably sneaks back in through strategic framing of the comparison class, so standard outside-view practice collapses into a more sophisticated form of overconfidence. I need a Q&A prep sheet ordered by actual damage potential to this specific audience, not generic skepticism. For each objection, specify who in the room will raise it, phrase it in their vocabulary, give me a reply that fits in about ninety seconds, and flag exactly where that reply is soft. Tell me what I should concede in my opening remarks to defuse the obvious lines of attack. Include the one question I'm hoping nobody asks—likely whether my own choice of this framework is itself vulnerable to the recursive problem I'm diagnosing—and sketch how to answer it without sounding defensive. Keep the focus practical: this is a crowded session, not a dissertation defense.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the Request:**
      *   **Topic:** Epistemic humility in institutional design (specifically, the "double-layered outside view").
      *   **Thesis:** Institutional forecasting needs reference-class base rates for *both* the outcome *and* the institution's selection/weighting of those reference classes to prevent inside-view reasoning from sneaking back in via framing.
      *   **Audience:** Behavioral economists (reference-class forecasting tournaments), philosophers of social science (reference-class problem, self-locating belief), decision theorists. *No* lawyers or policymakers.
      *   **Format:** Q&A prep sheet ordered by "damage potential" (not generic skepticism).
      *   **Requirements per Objection:** Who raises it, phrased in their vocabulary, 90-second reply, flag the soft spot.
      *   **Opening Remarks:** What to concede upfront to defuse attacks.
      *   **The "Killer" Question:** The recursive vulnerability (is the framework itself vulnerable?).
      *   **Tone:** Practical, crowded session (not a dissertation defense).

  2.  **Deconstruct the Audience & Thesis:**
      *   *Behavioral Economists:* Care about calibration, scoring rules, empirical performance, cognitive biases (overconfidence). They love tournaments.
      *   *Philosophers of Social Science:* Care about the metaphysics/epistemology of reference classes (Hajek, Reference Class Problem), self-locating belief (Elga, Bostrom), structural validity.
      *   *Decision Theorists:* Care about coherence, Dutch books, expected utility, formalizing the norm.
      *   *The Thesis:* Standard Outside View (SOV) = Pick a class, get a base rate. Double-Layered Outside View (DLOV) = Pick a class, get a base rate, *then* apply a base rate to how good you are at picking that class.
      *   *The Risk:* Infinite regress, paralysis, operational impossibility, or simply shifting the bias up one level without solving it.

  3.  **Identify High-Damage Objections (ordered by potential to derail the talk):**
      *   *Objection 1 (The Regress/Paralysis):* If you need a base rate for your base rate selection, don't you need a base rate for that selection? This leads to infinite regress. (Decision Theorists/Philosophers). *Damage:* High. Makes the theory incoherent.
      *   *Objection 2 (The Operationalization/Calibration):* How do you empirically measure the "meta-base rate"? There's no data on "how often institutions pick the right reference class." (Behavioral Economists). *Damage:* High. Makes the theory useless for their tournaments.
      *   *Objection 3 (The Reference Class Problem itself):* You're trying to solve the reference class problem by adding another reference class. Doesn't that just compound the ambiguity? (Philosophers). *Damage:* Medium-High. Attacks the core mechanism.
      *   *Objection 4 (Incentives/Strategic Framing):* If institutions know they need to justify their class selection, won't they just game the meta-layer too? (Behavioral Economists/Decision Theorists). *Damage:* Medium. Suggests the solution doesn't solve the strategic problem.

  4.  **Drafting the Content - Section by Section:**

      *   **Opening Concessions:** Need to show humility (fitting the topic) and acknowledge limits. Admit DLOV isn't an algorithm, it's a constraint. Admit data scarcity.
      *   **The "Killer" Question:** "Is your thesis self-undermining?" Need to answer without saying "Yes, but..." or "No." Need to say "It's a fixed point problem, not a regress."
      *   **Q&A Prep:**
          *   *Q1 (The Regress):* Decision Theorist. Reply: Stop at the layer where noise exceeds signal. Use a "stopping rule" based on variance. Soft spot: Defining that threshold is subjective.
          *   *Q2 (The Data):* Behavioral Economist. Reply: Use tournament history as the meta-data. We have data on forecaster calibration. Soft spot: Forecaster calibration $\neq$ reference class selection quality.
          *   *Q3 (The Reference Class Problem):* Philosopher. Reply: Acknowledge it doesn't *solve* the RCP, it *manages* the risk of RCP exploitation. Soft spot: Might just be moving the goalposts.
          *   *Q4 (Gaming):* Behavioral Economist. Reply: Transparency requirements. Make the meta-reasoning public. Soft spot: Public reasoning can be performative.

  5.  **Refining the Vocabulary:**
      *   *Behavioral Econ:* Calibration, Brier scores, noise reduction, tournament structure, empirical tractability.
      *   *Philosophers:* Reference Class Problem (RCP), self-locating uncertainty, epistemic circularity, higher-order evidence.
      *   *Decision Theorists:* Infinite regress, stopping rules, coherence, expected utility.

  6.  **Review against Constraints:**
      *   *90-second replies:* Keep them tight. ~200 words max per reply.
      *   *Damage Potential:* Order matters. Regress is #1. Data is #2.
      *   *Soft Spots:* Must be honest about where the argument leaks.
      *   *Tone:* Practical, workshop style.

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure the "Killer Question" isn't just Q1. It needs to be distinct. Q1 is about logical coherence (regress). The Killer Question is about *self-application* (is *your* framework subject to *your* critique?).
      *   *Correction:* Ensure the "Opening Concessions" actually help. Conceding that DLOV is expensive/complex disarms the "this is too hard" objection.
      *   *Refinement:* Make sure the distinction between "forecasting accuracy" and "reference class selection" is clear.

  8.  **Final Output Generation:** (Proceeding to generate the response based on these thoughts.)
answer: |-
  ### Opening Concessions (Defuse Pre-emptively)
  *Start your talk by explicitly conceding these two points. It signals epistemic humility and removes low-hanging fruit for critics.*

  1.  **Concede Tractability Costs:** Acknowledge that Double-Layered Outside View (DLOV) is computationally and cognitively more expensive than standard Outside View (SOV). State clearly: *"I am not arguing DLOV is always efficient; I am arguing it is necessary when stakes involve institutional self-preservation."* This disarms the behavioral economists who will immediately worry about implementation friction.
  2.  **Concede Data Scarcity:** Admit that "meta-base rates" (data on how well institutions select reference classes) are currently sparse. Frame your thesis as a *normative design requirement* for tournaments, not a ready-to-use algorithm. This prevents philosophers from attacking the empirical emptiness of the second layer.

  ---

  ### Q&A Prep Sheet: Ordered by Damage Potential

  #### 1. The Infinite Regress Objection (Highest Damage)
  *   **Who:** Decision Theorist or Philosopher of Social Science.
  *   **Vocabulary:** "Vicious regress," "higher-order evidence," "stopping rule," "coherence."
  *   **The Question:** "If you need a base rate to correct your selection of a base rate, don't you need a third base rate to correct the weighting of the second? Isn't this just pushing the inside view up one level while inviting an infinite regress?"
  *   **90-Second Reply:** "It's a regress only if we demand certainty. I'm proposing a *variance-based stopping rule*. We add layers until the marginal reduction in bias variance is outweighed by the noise introduced by estimating the next layer. In practice, for institutions, layer two is the 'knee' of that curve. Layer one corrects for outcome optimism; layer two corrects for strategic framing. Layer three usually lacks sufficient data to be anything but noise. So, it's not a logical regress, it's a signal-to-noise optimization."
  *   **The Soft Spot:** You haven't actually defined how to measure that "variance" or the "noise" of the third layer without using the very framework you're defending. If pressed, you're relying on a heuristic to solve a heuristic problem.

  #### 2. The Empirical Tractability Objection (High Damage)
  *   **Who:** Behavioral Economist (Tournament Runner).
  *   **Vocabulary:** "Calibration," "scoring rules," "training data," "operationalization."
  *   **The Question:** "You say we need base rates for reference-class selection. But in our tournaments, we score outcomes, not methodology. Where is the dataset for 'how often this institution picks the right class'? Without that, DLOV is just a normative slogan, not a forecasting tool."
  *   **90-Second Reply:** "The dataset exists, but it's siloed. It's the historical record of the institution's past forecasting performance *relative to simple baselines*. If an institution consistently outperforms the naive base rate, their class selection gets a positive meta-weight. If they underperform, the DLOV mandates a discount factor on their chosen class. We can operationalize this by treating the institution's *past methodology choices* as the reference class for the current methodology choice."
  *   **The Soft Spot:** Past performance on *outcomes* is a noisy proxy for quality of *reference class selection*. An institution can get lucky (right outcome, wrong class). You are assuming outcome accuracy validates class selection, which is exactly the bias you're trying to fix.

  #### 3. The Compounded Ambiguity Objection (Medium-High Damage)
  *   **Who:** Philosopher of Social Science (Reference Class Specialist).
  *   **Vocabulary:** "Reference Class Problem (RCP)," "ambiguity," "intersection classes," "epistemic opacity."
  *   **The Question:** "The standard RCP tells us any event belongs to infinite classes. You're adding a second layer of RCP on top of the first. Doesn't this compound the ambiguity rather than resolve it? You're solving ambiguity with more ambiguity."
  *   **90-Second Reply:** "Standard SOV treats the reference class selection as a 'black box' of rationality. I'm treating it as a source of error. The goal isn't to solve the metaphysical RCP; it's to mitigate the *strategic exploitation* of the RCP. By forcing the institution to justify the meta-class (e.g., 'we are the type of agency that correctly identifies risks'), we expose the framing. It turns a hidden bias into a visible variable that can be scored."
  *   **The Soft Spot:** You are shifting the goalposts from "truth-tracking" to "bias-exposure." A philosopher might argue that exposing a bias doesn't correct the epistemic error, it just makes it transparent.

  #### 4. The Gaming/Goodhart Objection (Medium Damage)
  *   **Who:** Behavioral Economist or Decision Theorist.
  *   **Vocabulary:** "Goodhart's Law," "strategic framing," "performative compliance," "incentive compatibility."
  *   **The Question:** "If institutions know they are being scored on their reference class selection, won't they just game the meta-layer? They'll select 'safe' meta-classes that look humble but still rig the first-layer prediction."
  *   **90-Second Reply:** "That's why DLOV must be external. The meta-evaluation shouldn't be done by the forecasting institution itself; it should be done by the tournament administrator or an audit layer. The institution proposes the class; the auditor applies the meta-base rate based on the institution's historical type. You can't game a score you don't control."
  *   **The Soft Spot:** This requires a powerful external auditor. If the auditor is also an institution, you've just shifted the regress to the auditor. You need a "view from nowhere" that doesn't exist.

  ---

  ### The "Killer" Question (Hope Nobody Asks)
  *   **The Question:** "You argue that institutions suffer from overconfidence because they don't apply an outside view to their own reasoning. But isn't *your* proposal itself a piece of reasoning that hasn't been subjected to a double-layered outside view? How do we know *you* haven't just strategically framed the reference class to make your thesis look true?"
  *   **Why it hurts:** It applies your own critique to your critique, threatening to collapse the whole argument into self-referential nonsense.
  *   **How to Answer (Without sounding defensive):**
      *   **Do not** claim immunity.
      *   **Do** accept the premise.
      *   **Script:** "That's exactly right. This thesis is vulnerable to the same problem. That's why I'm presenting it here. I am treating *this workshop* as the second layer. I'm submitting my framework to your reference class: 'Philosophical proposals about institutional design.' The base rate for that class is 'most are theoretically sound but practically fail.' I am starting with that as my prior. If this framework survives your scrutiny, the meta-probability updates. I'm not offering a view from nowhere; I'm offering a view that acknowledges its own location."
  *   **Why this works:** It demonstrates the thesis in action. You are *performing* epistemic humility rather than just claiming it. It turns the attack into a demonstration of the concept.

  ---

  ### Practical Tips for the Session
  *   **Watch the Philosophers:** They will latch onto the definition of "reference class." If you get bogged down in defining the meta-class, pivot back to *institutional incentives*. Remind them this is about *design*, not just epistemology.
  *   **Watch the Economists:** They will want a formula. Don't give one. Give them a *scoring adjustment*. Tell them: "Discount the forecast by the institution's historical calibration error." That's something they can code.
  *   **Time Management:** If the Regress Question (Q1) comes up, answer it, then explicitly say: "I think that touches on the limit of the model, which I'd love to discuss in the break, but I want to make sure I get to the operational side for the economists." Keep the room moving.
