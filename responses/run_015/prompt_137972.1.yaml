answer: |-
  # SEMINAR HANDOUT: NAVIGATING INFINITE ETHICS
  **Entry Commitment:** *We cannot rule out that the world contains, or will contain, infinitely many welfare-bearing lives or moments.*

  ## I. THE SIX DIAGNOSTIC CASES
  *Answer each based on your intuitive verdict. Do not consult theories yet.*

  **(a) The Extra Life**
  In a cosmos that already contains infinitely many good lives, an act adds one further good life and changes nothing else.
  *   **A1:** The outcome is **Better**.
  *   **A2:** The outcome is **Equally Good**.
  *   **A3:** The comparison is **Malformed** (no fact of the matter).

  **(b) The Density**
  Two infinite worlds have the same large-scale shape. In World 1, the proportion of good to bad lives is higher in every sufficiently large region (higher value per unit volume in the limit).
  *   **B1:** World 1 is **Better**.
  *   **B2:** I **Decline to Rank** them.

  **(c) The Spatial/Temporal Split**
  Does your answer to **(a)** change if the infinity is spread out in *space* (where you can only affect a finite region) versus an endless *future* (which you can genuinely shape)?
  *   **C1:** **No** (My verdict is invariant).
  *   **C2:** **Yes** (I treat spatial and temporal infinity differently).

  **(d) The Tiny Probability**
  **Case 1:** Act X offers a 1-in-10⁹ chance of Infinite Good (else 0). Act Y offers Certain Finite Good.
  **Case 2:** Act P offers a 1-in-10⁹ chance of Infinite Bad (else 0). Act Q offers Certain Finite Bad.
  *   **D1:** **Symmetric Fanaticism:** Take X over Y; Avoid P over Q.
  *   **D2:** **Symmetric Caution:** Take Y over X; Take Q over P.
  *   **D3:** **Asymmetric:** Take X (Good chance) but Avoid P (Bad risk), or vice versa.

  **(e) The Undefined Expectation**
  A lottery over finite payoffs has no expected value because positive and negative parts both diverge.
  *   **E1:** This is a **Counterexample** to Expected Value (EV) maximization.
  *   **E2:** This is a **Misdescription** (EV rules still apply via extension).

  **(f) The Mixed Case**
  A world contains both an Infinite Heaven and an Infinite Hell. One finite instance of suffering is added.
  *   **F1:** The addition **Matters** (makes it worse).
  *   **F2:** The addition **Does Not Matter** (and nothing else matters in such a world).

  ---

  ## II. THE DECISION TREE
  *Start at the top. Follow your answers to a Leaf.*

  ```text
  START
    │
    ├─ Q(a): A2/A3 (Equal/Malformed) ──┬─ Q(b): B2 (Decline) ──┬─ Q(f): F2 ──► LEAF 4
    │                                  │                       └─ Q(f): F1 ──► LEAF 6
    │                                  └─ Q(b): B1 (Rank) ────────────────────► LEAF 3
    │
    └─ Q(a): A1 (Better) ──┬─ Q(c): C2 (Split) ───────────────────────────────► LEAF 5
                           │
                           └─ Q(c): C1 (Invariant) ──┬─ Q(d): D1/D3 (Fanatic) ──┬─ Q(e): E2 ──► LEAF 1
                                                     │                          └─ Q(e): E1 ──► LEAF 8
                                                     │
                                                     └─ Q(d): D2 (Caution) ───────────────────► LEAF 2
  ```

  ---

  ## III. SCORING KEY: THE POSITIONS
  *Each Leaf includes: [Name] | [Awkward Commitment] | [Paralysis Type] | [Accessibility]*

  *   **LEAF 1: Hyperreal Aggregation**
      *   *Commitment:* We must adopt non-standard mathematics (infinitesimals) to make sense of everyday ethics.
      *   *Paralysis:* None. *Accessibility:* **Inaccessible** (Requires knowledge of global infinite totals).
      *   *Infinity Sensitivity:* Invariant (Treats spatial/temporal alike).

  *   **LEAF 2: Bounded Utility**
      *   *Commitment:* Value saturates; creating more good lives eventually yields zero marginal value.
      *   *Paralysis:* None. *Accessibility:* **Accessible** (Local calculation suffices).
      *   *Infinity Sensitivity:* Invariant (Denies ethical relevance of actual infinities).

  *   **LEAF 3: Density / Average-in-the-Limit**
      *   *Commitment:* A world can be better even if no individual is better off (purely structural improvement).
      *   *Paralysis:* **Ranking Paralysis** (Cannot rank worlds with identical densities). *Accessibility:* **Inaccessible** (Requires limits of infinite regions).
      *   *Infinity Sensitivity:* **Sensitive** (Requires spatial/temporal metric to define "region").

  *   **LEAF 4: Simple Indifference**
      *   *Commitment:* All infinite outcomes tie; finite differences are ethically invisible.
      *   *Paralysis:* **Action Paralysis** (No act is better than another). *Accessibility:* **Accessible**.
      *   *Infinity Sensitivity:* Invariant.

  *   **LEAF 5: Truncation / Practical Finitism**
      *   *Commitment:* We ignore parts of the universe we cannot causally reach, even if they contain infinite value.
      *   *Paralysis:* None. *Accessibility:* **Accessible**.
      *   *Infinity Sensitivity:* **Highly Sensitive** (Verdict flips based on causal horizon).

  *   **LEAF 6: Person-Affecting / Restricted Aggregation**
      *   *Commitment:* An outcome can be "better" only if it is better for some particular person.
      *   *Paralysis:* **Ranking Paralysis** (Cannot rank worlds with disjoint populations). *Accessibility:* **Accessible**.
      *   *Infinity Sensitivity:* Invariant.

  *   **LEAF 8: Non-EV Decision Theory**
      *   *Commitment:* Rationality does not require maximizing mathematical expectation in infinite contexts.
      *   *Paralysis:* **Action Paralysis** (If no decision rule replaces EV). *Accessibility:* **Accessible**.
      *   *Infinity Sensitivity:* Invariant.

  *(Note: Leaf 7 [Fanaticism] is absorbed into Leaf 1 or 8 depending on Q(e). If D1 + E2 → Leaf 1. If D1 + E1 → Leaf 8.)*

