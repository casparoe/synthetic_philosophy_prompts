  ## IV. UNOCCUPIED REGIONS (LOGICAL SPACE DIAGNOSIS)
  *The logical space of answer combinations contains regions that are ethically unoccupied.*

  1.  **A1 (Better) + B2 (Decline Rank):** *Diagnosis: Incoherent.* If adding a life makes a world better, you have a ranking principle. You cannot claim comparability for additions but incomparability for density shifts without contradiction.
  2.  **A2 (Equal) + F1 (Matters):** *Diagnosis: Merely Unattractive.* Claims adding a good life to infinity doesn't help, but adding a bad life hurts. Asymmetric saturation is logically possible but lacks a principled defense in the literature.
  3.  **C2 (Split) + B1 (Global Density):** *Diagnosis: Incoherent.* You cannot rely on global density rankings (which require a view of the whole) while simultaneously claiming spatial infinity is ethically distinct from temporal infinity due to locality.
  4.  **D2 (Caution) + E2 (EV Misdescription):** *Diagnosis: Simply Unexplored.* If you think undefined expectations are just math errors (E2), you usually accept the infinite expectations they produce (D1). Rejecting the risk while accepting the math is unstable.

  ---

  ## V. UNSEPARABLE PAIRS
  *This tree cannot distinguish between the following positions. They agree on all six cases.*

  1.  **Hyperreal Aggregation vs. Lexicographic Aggregation**
      *   *Agreement:* Both say (a) Better, (b) Rank, (d) Fanatic, (e) Misdescription.
      *   *Difference:* Mathematical implementation (infinitesimals vs. ordered levels).
      *   *Separating Case:* **The Order-Type Case.** Two worlds with the same number of good lives but different ordinal arrangements (e.g., ω vs ω+ω). Lexicographic views may rank these; standard Hyperreal views may not.

  2.  **Bounded Utility vs. Satiated Infinity**
      *   *Agreement:* Both say (a) Equal/Malformed, (d) Caution.
      *   *Difference:* Metaphysics of value. One says total value is finite; the other says infinite but "full."
      *   *Separating Case:* **The Subtraction Case.** Remove one good life from an infinite world. Bounded Utility might say value stays same (if above threshold); Satiated Infinity says value remains infinite. Empirically indistinguishable without access to the "value meter."

  3.  **Truncation vs. Temporal Discounting**
      *   *Agreement:* Both say (c) Yes (Split).
      *   *Difference:* Why the split occurs. Truncation is causal/epistemic; Discounting is purely temporal preference.
      *   *Separating Case:* **The Causal-Long-Run Case.** An act affects a region 1000 years away (temporal) but causally reachable vs. a region 1000 miles away (spatial) but causally unreachable. Discounting favors the time; Truncation favors the reach.
