answer: |-
  This is a sophisticated genealogical argument, effectively a refined version of the "explanatory idleness" challenge to moral realism. By stipulating that the variation is systematic (low-dimensional) and structured (weights/boundaries rather than content), you have insulated the argument against the charge that moral variation is random or shallow. This forces the realist to engage with the *causal sufficiency* of the genealogical explanation rather than the *existence* of variation.

  Here is the map of the argument's exposure, addressing your specific constraints.

  ### 1. Does the stipulated convergence help the debunker or the realist?

  **The Decision:** It helps the **debunker**, provided the ecological parameters are causally sufficient.

  **The Reasoning:**
  You stipulate that once you condition on social-ecological parameters (pathogens, markets, etc.), residual moral differences are small. This means Moral Belief ($M$) is a function of Ecology ($E$): $M \approx f(E)$.
  *   **The Debunker's Reading:** This is convergent *adaptation*. Just as unrelated species in similar niches evolve similar eyes, unrelated cultures in similar ecological niches evolve similar moral norms. The "low-dimensional region" is the space of viable social strategies, not the space of moral truths. The convergence is explained entirely by the shared constraints of $E$.
  *   **The Realist's Reading:** This is convergent *tracking*. Independent inquirers are finding the same truths because the truths are objective.

  **Which is correct?**
  The decision turns on **explanatory parsimony**.
  If $E$ is sufficient to cause $M$ (i.e., if we can model the emergence of $M$ given $E$ without positing moral facts), then positing moral facts is explanatorily idle. The stipulation that the variation is *predictable* from non-moral features is the debunker's strongest weapon. It turns the "low-dimensional region" from a sign of truth into a sign of functional constraint.
  For the convergence to help the realist, they must show convergence *across divergent ecologies* (i.e., same $M$ despite different $E$). Your stipulation specifies convergence *within* conditioned parameters. Therefore, under these stipulations, the convergence supports the genealogical explanation, not the realist one.

  ### 2. Is the weight-versus-content distinction load-bearing?

  **Verdict:** It is load-bearing, but it **relocates** the debate rather than resolving it. It weakens the global debunking argument but does not grant the realist a free win on the invariant core.

  **Analysis:**
  *   **Stronger for Debunker:** By conceding that the *considerations* (content) are invariant, you limit the scope of variation. However, this allows the debunker to argue that the invariant core is merely **universal human psychology** (e.g., Haidt's foundations, theory of mind, reciprocity algorithms) rather than universal moral truth. If the "invariant considerations" are cognitive modules selected for fitness, they require no moral facts to explain their universality.
  *   **Weaker for Debunker:** It prevents the "anything goes" relativism objection. The debunker cannot claim morality is wholly arbitrary; they must claim it is *functionally constrained*.
  *   **Does the invariant core do realist work?** No, not for free. The realist must show that the invariant core is *normatively authoritative*, not just *psychologically universal*.
      *   *Example:* If "care for kin" is invariant, the realist says "Kin care is objectively good." The debunker says "Kin care propagates genes."
      *   To make the core do realist work, the realist must show that the core includes considerations that *contradict* fitness maximization (e.g., universal rights that hinder group survival). If the invariant core is purely pro-social/adaptive, the genealogical explanation swallows it.

  ### 3. Which defeaters would defenders of this argument concede?

  A committed defender of this genealogical argument is committed to **causal closure** of the moral domain by non-moral facts. They would concede the following, ranked by severity:

  1.  **Fatal: Independent Access to Moral Truth.**
      *   *Condition:* Evidence that agents acquire specific moral beliefs through processes *uncorrelated* with social-ecological fitness (e.g., solitary reflection leading to moral truths that reduce reproductive success or group stability), and that these beliefs spread *despite* their ecological cost.
      *   *Why Fatal:* It breaks the $M = f(E)$ link. If $M$ varies independently of $E$ in ways that track truth, the genealogical explanation is insufficient.

  2.  **Fatal: Predictive Failure of Ecological Parameters.**
      *   *Condition:* If new data shows that societies with identical pathogen loads, market integration, and kinship structures sustain radically different moral systems (high residuals).
      *   *Why Fatal:* It undermines the premise that non-moral features predict moral variation. If $E$ does not predict $M$, the genealogical explanation fails.

  3.  **Awkward: The "Thin Core" Problem.**
      *   *Condition:* If the "invariant considerations" turn out to be so abstract (e.g., "promote social cohesion") that they fail to generate specific moral judgments without ecological input.
      *   *Why Awkward:* It concedes that all *substantive* morality is ecological/relative, leaving the realist with a hollow shell of a moral truth that cannot guide action. Defenders would accept this but note it renders realism practically inert.

  4.  **Dismissed: Phenomenological Objections ("Morality Feels Objective").**
      *   *Condition:* The claim that because moral experience *feels* like tracking facts, it must be.
      *   *Reason for Dismissal:* Genealogy explains *why* it feels that way (to motivate compliance). Phenomenology is data to be explained, not an explanation itself.

  5.  **Dismissed: Semantic Objections ("Moral Terms Refer to Natural Properties").**
      *   *Condition:* Naturalistic realism claiming moral facts *are* ecological facts.
      *   *Reason for Dismissal:* This changes the subject. The argument targets *stance-independent* normative facts. Reducing morality to ecology is a form of eliminativism or revisionism, which the debunker accepts as a victory (morality is just ecology), not a defeat.

  ### 4. Has the position been insulated to the point of unfalsifiability?

  **Assessment:** It borders on unfalsifiability, but remains **acceptable within abductive reasoning** *if* the ecological parameters are exogenous.

  *   **The Risk:** The "Moving Goalpost" defense. If every moral agreement is explained by "shared hidden ecology" and every disagreement by "unmeasured ecological variable," the theory becomes tautological ($M$ is explained by $E$, where $E$ is defined as whatever explains $M$).
  *   **The Safeguard:** Your stipulation requires the parameters to be **non-moral features** (pathogen load, market integration). These are measurable independently of moral judgment.
  *   **Is it a defect?** No, it is an acceptable cost of abductive inference (Inference to the Best Explanation). Social science always deals with residual variance.
  *   **The Limit:** It becomes a defect if the defender refuses to specify *which* ecological variables would *fail* to predict moral variation. To be falsifiable, the defender must commit to a specific set of parameters. If they say "Some ecological variable explains this" without specifying which, it is unfalsifiable. If they say "Pathogen load and Market Integration explain this," it is falsifiable (by showing they don't).
  *   **Conclusion:** As long as the ecological parameters are defined *a priori* (biologically/economically) and not *post-hoc* (sociologically/morally), the insulation is methodological rigor, not dogmatism.

  ### 5. The Realist's Positive Burden and the Consequence of Standoff

  **What the Realist Must Show:**
  To turn this from a standoff into a win, the realist must demonstrate an **observable divergence between Fitness and Truth.**
  *   **The Test Case:** A moral belief that is **ecologically maladaptive** (reduces group stability, reproductive success, or coordination) but is **retained and spread** because it is recognized as true.
  *   **Why:** If moral facts are doing explanatory work, they must be able to override or operate independently of the ecological pressures that the genealogist cites. If every moral belief can be shown to serve a social-ecological function, the moral fact is idle.
  *   **Specific Prediction:** We should see societies adopting moral norms that *hinder* their survival/competition relative to societies with "fitter" moral norms, yet the "truth-tracking" societies persist or convert others *due to the perceived truth of the norm*, not its utility. (e.g., Universal human rights that weaken tribal cohesion but are adopted anyway).

  **If There Is No Such Difference:**
  If there is no observable difference between a world where genealogy is the whole story and a world where moral facts exist but perfectly covary with ecological needs:
  1.  **Metaphysical Idleness:** The moral facts are "queer" in the extreme—they exist but make no causal difference to the distribution of moral beliefs that isn't already accounted for by ecology/psychology.
  2.  **Consequence for Your View:** You are not holding an empirical hypothesis; you are holding a **policy of ontological parsimony**.
      *   Your view becomes: "Given that Ecology explains the distribution of Moral Beliefs, I will not posit extra entities (Moral Facts) unless forced to."
      *   Since the realist cannot force you (due to the lack of observable divergence), your view is the **default null hypothesis**.
      *   **The Cost:** You must admit that your argument does not prove moral facts *do not exist*; it proves they are **explanatorily unnecessary**. You are an error theorist or a fictionalist by methodological choice, not by empirical disproof. The "win" is not the destruction of realism, but the successful shifting of the burden of proof to a point the realist cannot clear.

  **Summary:** Your argument is robust because it grants the realist convergence and structure, then argues those very features are better explained by functional adaptation. Its exposure lies only in the possibility of **counter-functional moral truth**—moral beliefs that track facts despite costing fitness. If that cannot be found, your genealogical explanation stands as the most parsimonious account of the data.
