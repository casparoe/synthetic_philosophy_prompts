      *   **Stipulations:**
          1.  Conditioning on social-ecological parameters reduces residual differences to small; moral systems occupy a low-dimensional region (not "anything goes").
          2.  Variation is in *weights* of invariant considerations and *boundaries* of the moral community, not the considerations themselves.
      *   **Specific Questions to Answer:**
          1.  Does convergence (low-dimensional region) help the debunker or realist?
          2.  Is the weight-vs-content distinction load-bearing? Does the invariant core help realism?
          3.  What defeaters would *defenders* concede? Rank them (fatal to awkward) and include dismissed ones.
          4.  Is the position unfalsifiable? Is this a defect or acceptable cost?
          5.  **Final:** What positive evidence does the realist need to win? If none, what follows for the holder of the view?

  2.  **Deconstruct the Argument (Mental Model):**
      *   *Type:* Genealogical Debunking (Evolutionary/Sociological).
      *   *Target:* Moral Realism (specifically robust, stance-independent facts).
      *   *Mechanism:* Explain moral beliefs via non-moral causes (ecology). If non-moral causes suffice, moral facts are explanatorily idle (Occam's razor).
      *   *Constraint:* The "Stipulations" make the variation *systematic* and *bounded*, not random. This is crucial. It prevents the "chaos" objection but invites the "convergence" objection.

  3.  **Drafting Responses to Specific Questions:**

      *   **Q1: Convergence (Low-Dimensional Region).**
          *   *Debunker View:* Convergence happens because human ecology has limited configurations. We are all solving the same adaptive problems (cooperation, resource distribution) with limited biological tools. It's convergent evolution, not truth-tracking.
          *   *Realist View:* Convergence suggests a single target. If independent cultures land in the same spot, they are likely tracking objective constraints.
          *   *Decision:* It cuts both ways, but under the *stipulations* (conditioned on ecology), it leans slightly realist *unless* the ecological parameters fully determine the moral output. If Ecology $\rightarrow$ Morality is a functional mapping, realism is idle. If Ecology $\rightarrow$ Morality is underdetermined and they still converge, realism gains ground.
          *   *Verdict:* It helps the realist *if* the ecological parameters don't fully causally determine the specific moral weights. If the mapping is tight (deterministic), it helps the debunker (functional adaptation). The decision turns on *causal sufficiency*.

      *   **Q2: Weight-vs-Content Distinction.**
          *   *Setup:* Invariant considerations (content), variant weights/boundaries.
          *   *Debunker:* Weights are pragmatic adjustments to local ecology. "Don't kill" is universal, but "Don't kill *except* in honor disputes" is ecological tuning. No truth needed, just fitness.
          *   *Realist:* The invariant core *is* the moral truth. Weights are applications.
          *   *Load-bearing?* Yes. It restricts the scope of debunking. The debunker can't say *everything* is relative.
          *   *Does invariant core do realist work?* Only if the core is substantive enough. If the core is "Care, Fairness, Loyalty, Authority, Purity" (Haidt), realists might say "See, universal principles!" Debunkers say "See, universal psychological modules."
          *   *Verdict:* It weakens the global debunking argument but relocates the fight to the *status* of the core. It doesn't give realism a free win; the core could be universal psychology, not universal truth.

      *   **Q3: Defeaters (Defender's Concession).**
          *   *What would the proponent admit counts against them?*
          *   *Fatal:* Finding moral variation that is *uncorrelated* with ecology/history but correlates with access to moral truth (e.g., meditation, philosophical reflection) independent of social function. Or, if ecological parameters fail to predict variation (residuals are huge/random).
          *   *Awkward:* If the "invariant core" turns out to be extremely thin (e.g., "cooperate with kin") such that it doesn't look like morality anymore.
          *   *Dismissed:* "Moral Experience" (phenomenology of objectivity). Reason: That's the data to be explained, not an explanation. "Semantic Arguments" (moral terms refer to natural properties). Reason: Doesn't address the genealogical causal chain.
          *   *Ranking:*
              1.  (Fatal) Predictive Failure: Ecology stops predicting moral variation.
              2.  (Fatal) Independent Access: Evidence of moral knowledge gained without ecological pressure.
              3.  (Awkward) Triviality: The invariant core is too thin to count as "morality."
              4.  (Dismissed) Phenomenology/Intuition.

      *   **Q4: Unfalsifiability.**
          *   *Risk:* "You haven't found the ecological variable yet." (Moving the goalposts).
          *   *Is it a defect?* In abductive inference (Inference to the Best Explanation), some flexibility is allowed. But if *any* agreement can be redescribed as "shared ecology," it risks becoming a tautology (Morality varies by context; context explains morality).
          *   *Verdict:* It is a risk. It becomes a defect if the "ecological parameters" are defined post-hoc to fit the moral data. It is acceptable if the parameters are defined independently (e.g., pathogen load measured biologically, not morally).
          *   *Nuance:* The stipulation says "condition on parameters." If those parameters are exogenous, it's falsifiable (do the parameters predict?). If endogenous, it's circular.

      *   **Q5: The Realist's Positive Burden & Consequences.**
          *   *What does the realist need?* They need an observable difference.
          *   *Scenario A (Genealogy only):* Moral beliefs track ecological fitness.
          *   *Scenario B (Realism):* Moral beliefs track truth *plus* ecological fitness.
          *   *The Difference:* We need a case where Truth and Fitness diverge. "Counter-functional Truth." A moral belief that is *true* but *maladaptive* (or neutral) yet still held/spread. Or, moral progress that *reduces* fitness in the short term but is retained because it's "true."
          *   *If no difference:* Then the debate is metaphysical, not empirical. The view becomes a "stance" or "framework."
          *   *Consequence for the user:* If there is no observable difference, holding the view is a pragmatic commitment to parsimony (Occam's razor), not an empirical discovery. You are betting on explanation, not observation.

  4.  **Refining and Polishing:**
      *   *Tone:* Analytical, precise, philosophical but accessible. Respect the sophistication of the prompt.
      *   *Structure:* Follow the numbered questions exactly.
      *   *Key Insight:* The stipulations actually make the realist's job *easier* in some ways (convergence) but the debunker's job *more precise* in others (mechanism identified). The crux is whether the ecological explanation is *sufficient*.
      *   *Self-Correction on Q1:* I need to be careful. If the variation is *predicted* by ecology, convergence in similar ecologies is expected by the debunker. Convergence across *different* ecologies is the realist's friend. The prompt says "condition on parameters... residual differences are small." This means similar ecology = similar morality. This supports the debunker (functionalism). Realist needs similar morality across *different* ecologies. I must clarify this distinction.
      *   *Self-Correction on Q5:* The "observable difference" is the hardest part. Standard metaethics says there *isn't* one (queerness of moral facts). I need to be honest: if moral facts are causally inert, there is no difference. If they are naturalistic, there might be. I should distinguish Robust Realism vs. Naturalistic Realism here. Given the "genealogical" framing, it implies Robust Realism is the target. So, likely no observable difference.

  5.  **Final Review against Constraints:**
      *   Did I respect the stipulations? Yes (low-dimensional, weights/boundaries).
      *   Did I answer all 4 numbered points + Final? Yes.
      *   Is the mapping of "exposure" clear? Yes, highlighting where the argument is vulnerable.

  6.  **Constructing the Output:** (Drafting the response based on the above thoughts). *Focus on the "Burden of Proof" shift.* The argument shifts the burden to the realist. The exposure is where that shift can be resisted.

