answer: |-
  ### The Distinctions

  Before the requirements, we must locate the "essence." Most theories fail because they conflate these four levels:

  *   **Token:** The physical ink, pixels, or strokes on a specific surface. (Too variable to hold identity).
  *   **Glyph (Allograph):** The specific shape variant (e.g., single-storey vs. double-storey 'a'). (Too specific to define the category, too vague to define the token).
  *   **Letter Type:** The abstract functional unit ('a' as opposed to 'b'). (Too abstract to explain visual recognition).
  *   **Writing System:** The rule set governing the types (Latin vs. Cyrillic). (Determines identity, but holds no shape information).

  **Verdict:** The "essence" of 'a'-ness cannot live at any single level. It lives in the **mapping function** that projects a *Token* to a *Type* via a *Glyph*, constrained by the *Writing System*. A theory that posits the essence is purely in the shape (Vision) or purely in the category (ML) is definitionally insufficient for your bidirectional goal.

  ---

  ### The Specification: Requirements for a Theory of Letter Identity

  Here are the criteria a theory must meet to explain letter identity while supporting your specific engineering goal (read unseen faces, generate alphabets from samples).

  *   **System-Relative Identity**
      *   *The Case:* Pixel-identical shapes function as different letters depending on the script (Cyrillic 'а' vs. Latin 'a').
      *   *The Requirement:* The theory must treat script membership as a prior constraint on identity, not a post-hoc classification. Shape underdetermines identity; system rules complete it.
  *   **Style Invariance with Style Retention**
      *   *The Case:* A ransom note assembled from six fonts is readable as text, yet the stylistic discontinuity is instantly perceived.
      *   *The Requirement:* The representation must separate *identity* (what letter it is) from *style* (how it is drawn) without discarding the style data. You must be able to strip style to read, and re-apply it to write.
  *   **Contextual Constitution**
      *   *The Case:* 'l', '1', and 'I' are often identical strokes; cursive has no gaps between letters.
      *   *The Requirement:* Identity cannot be solely intrinsic to the isolated form. The theory must allow neighbors and whitespace to define the boundaries and category of the unit.
  *   **Generative Analogy**
      *   *The Case:* Seeing one 'g' in a strange face allows you to sketch a plausible 'q'.
      *   *The Requirement:* The theory must encode structural relationships between letters, not just features of individual letters. It must support extrapolation from a sample size of one.
  *   **Robustness to Topological Loss**
      *   *The Case:* An 'a' with a rubbed-off bowl is still read as 'a'; a 'c' with a gap is not read as 'o'.
      *   *The Requirement:* Identity must survive the loss of specific strokes or closure. No single geometric feature can be strictly necessary.
  *   **Graded Membership**
      *   *The Case:* Is 'á' an 'a'? Is 'ª' an 'a'? Is the IPA 'ɑ' an 'a'?
      *   *The Requirement:* Category boundaries must be fuzzy. The theory must account for "better" and "worse" examples of a letter without collapsing into binary classification.

  ---

  ### Classification of Requirements

  **Non-Negotiable (Core to the Bidirectional Goal)**
  *   **System-Relative Identity:** Without this, you cannot distinguish phishing domains (Cyrillic 'а') from legitimate ones.
  *   **Style Invariance with Style Retention:** Without this, you cannot fulfill the "generate the rest of the alphabet" requirement. You need the style vector to remain intact after recognition.
  *   **Generative Analogy:** Without this, you cannot extrapolate from a few samples. This is the hardest constraint.

  **Hobby-Horses (Cut These)**
  *   **Historical Continuity:** Whether a 12th-century 'a' is the "same" as a modern one is an etymological question, not a functional one. For your system, functional equivalence is sufficient. Causal history is irrelevant baggage.
  *   **Aesthetic Response:** Explaining why a typeface feels "corporate" or "friendly" is a secondary effect of style processing. It is not required to establish letter identity.
  *   **Clinical Dissociations:** Matching human brain lesions (e.g., specific alexias) is a constraint for cognitive science, not for building a working system. Do not burden the spec with biological fidelity unless it aids the engineering.

  ---

  ### The Incompatible Pair

  **Segmentation Prior to Recognition** vs. **Recognition Prior to Segmentation**

  *   *The Conflict:* In cursive or degraded text, you cannot identify the letters until you have segmented the strokes (Recognition requires Segmentation). However, you cannot know where to segment the strokes until you have hypothesized what the letters are (Segmentation requires Recognition).
  *   *The Finding:* Most theories quietly assume one direction. Symbolic systems assume segmentation is solved; Neural nets assume segmentation is learned implicitly. A theory that claims to solve both simultaneously without a feedback loop is lying. You must explicitly model a recursive loop where hypothesis and segmentation update each other.

  ---

  ### The Killer Requirement

  **Generative Analogy (One-Shot Extrapolation)**

  *   *Why:* This knocks out 95% of candidate theories.
  *   *The Casualties:*
      *   **Modern Convnets/Transformers:** They are discriminative classifiers. They can recognize an 'a' in 40 fonts, but they cannot draw a 'q' in that style after seeing one 'g'. They interpolate, they do not reason structurally.
      *   **Template/Feature Models:** They lack the relational grammar to transfer style from one letter to another.
      *   **Pure Symbolic Systems:** They handle the rules but choke on the infinite variance of hand-drawn style.
  *   *The Survivor:* Only a hybrid architecture (symbolic structure + sub-symbolic rendering) even attempts this. If a theory cannot explain how seeing a 'g' informs the shape of a 'q', it is a theory of recognition, not a theory of letters.

  ---

  ### One-Line Critiques of Existing Approaches

  *   **Templates:** Fail immediately on variance; they treat the double-storey and single-storey 'a' as different objects rather than stylistic variants of the same type.
  *   **Structural/Stroke Descriptions:** Brittle under degradation; they assume a "correct" topology that rubbed-off ink or messy handwriting violates.
  *   **Stroke-Generative Models (Letter Spirit vein):** Strong on style transfer and analogy, but computationally expensive and struggle with the initial segmentation of unstructured input.
  *   **Modern Convnets:** Excellent at robust classification (the OCR win), but they are black boxes that discard the structural information required for one-shot generation (the Post-it fail).
