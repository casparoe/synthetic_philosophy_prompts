answer: |-
  Here is a framework designed for practical application in mediation and conduct hearings. It treats standing not as a metaphysical mystery, but as a functional requirement for the *efficacy and justice* of the blaming act.

  ### I. The Shape of Standing

  Before the principle, we must define the object.

  1.  **Scalar vs. Threshold:** Standing is **scalar in nature but threshold in application**.
      *   *Scalar:* You can have more or less moral credit regarding a norm (e.g., the reformed liar has *more* standing than the never-tempted colleague).
      *   *Threshold:* For the purpose of a conduct hearing or mediation, you either cross the bar to legitimately administer blame, or you do not. Below the bar, the blame is "infelicitous"—it misfires. It may be true, but it is not *authoritative*.
  2.  **Forfeiture vs. Permission:** Standing is a **normative power** that is forfeited by inconsistency. It is not merely a permission; it is a claim to represent the norm. When you violate the norm without repentance, you revoke your claim to represent it.
  3.  **Facts vs. Beliefs:** Standing depends on the **facts** of the blamer's conduct, not their beliefs (Case 10). Self-deception does not restore standing because the damage is to the normative community's trust, not the blamer's conscience.
  4.  **Waiver:** The target **cannot fully waive** the lack of standing. Standing protects the integrity of the norm, not just the target's feelings. However, if the target explicitly invites the feedback (Case c), the *harm* of the lack of standing is neutralized, converting the act from "blame" to "consultation."
  5.  **Reason to Refrain:** A lack of standing gives the blamer a **decisive reason not to blame** in an official or corrective capacity. It does not make the accusation false, but it makes the *act of blaming* unjust.

  ### II. The Principle of Commitment and Authority

  You lack standing to blame a target for a violation of Norm N if and only if **Condition A** is met, unless **Condition B** or **Condition C** applies.

  **Condition A (The Hypocrisy Bar):**
  You have demonstrated a rejection of Norm N through your own conduct, such that a reasonable observer would conclude you do not regard yourself as bound by N.
  *   *Includes:* Current violation (Case 1), unrepentant past violation (Case 1), or a settled disposition to violate N if convenient (Case 3).
  *   *Excludes:* Unrelated vices (Case 4), or general wickedness unrelated to N (Case 5).
  *   *Severity Threshold:* Your violation must be of comparable or greater seriousness than the target's (Case 12). A minor fault does not forfeit standing to blame a major fault of the same kind.

  **Condition B (The Reform Exception):**
  You have previously violated N, but you have **acknowledged the violation, made amends, and demonstrated sustained compliance.**
  *   *Effect:* This restores standing, potentially enhancing it through demonstrated commitment (Case 2).
  *   *Solidarity:* If you are currently struggling with N but acknowledge the struggle and frame the blame as shared resistance rather than superior judgment, standing is retained (Case 9).

  **Condition C (The Role Exception):**
  You are acting in an institutional capacity where the authority derives from the **Office** rather than **Personal Example**.
  *   *Adjudicative Roles:* Enforcing constitutive rules of a practice (e.g., Referee, Judge, HR enforcing policy). Personal violation does not remove standing unless it prevents functional performance (Case 6).
  *   *Exemplary Roles:* Guiding welfare, character, or culture (e.g., Parent, Mentor, Senior Leader modeling values). Personal violation removes standing because the authority relies on trust and example (Case 7).

  **Condition D (The Causal Bar):**
  You are causally responsible for creating the conditions that made the violation of N inevitable or highly probable (Case 8).
  *   *Effect:* No standing. This is not hypocrisy; it is "dirty hands." You cannot condemn the symptom you caused.

  ### III. Application to Your Cases

  This principle accommodates 10 of your 12 verdicts directly. It forces you to reconsider two.

  **Accommodated Verdicts:**
  *   **Case 1 (Liar):** Fails Condition A (Unrepentant violation). **No Standing.**
  *   **Case 2 (Reformed):** Meets Condition B (Reform). **Full Standing.**
  *   **Case 3 (Modal):** Fails Condition A (Disposition counts as rejection of norm). **Diminished.**
  *   **Case 4 (Unrelated Vice):** Excluded from Condition A (Norm specificity). **Full Standing.**
  *   **Case 6 (Referee):** Meets Condition C (Adjudicative Role). **Full Standing.**
  *   **Case 8 (Deadline):** Meets Condition D (Causal Bar). **No Standing.**
  *   **Case 9 (Struggler):** Meets Condition B (Solidarity/Acknowledgement). **Full Standing.**
  *   **Case 10 (Self-Deceived):** Facts trump beliefs (Shape of Standing). **Diminished.**
  *   **Case 12a/b (Magnitude):** Severity Threshold in Condition A. **Full / No Standing.**

  **Verdicts to Overturn:**

  1.  **Case 5 (The General Wreck):**
      *   *Your Verdict:* No Standing.
      *   *Principle Verdict:* **Full Standing.**
      *   *Reasoning:* This conflates *credibility* with *standing*. A liar (about tools) lacks standing to blame lying. A liar (about taxes) retains standing to blame theft. If Sven is a "general wreck," he lacks *moral authority* or *persuasive power*, but he does not lack the *normative standing* to enforce specific rules he is not currently violating. To rule otherwise makes standing global, which paralyzes correction in imperfect communities.
      *   *Mediation Note:* In a hearing, you may stop Sven from blaming the neighbour not because he lacks standing, but because his general lack of credibility makes the process unproductive (Pragmatics, not Standing).

  2.  **Case 11 (Hypocrite on Hypocrisy):**
      *   *Your Verdict:* Full Standing.
      *   *Principle Verdict:* **Diminished Standing (but Defensible).**
      *   *Reasoning:* Strictly, a grandstander fails Condition A regarding the norm "Do not grandstand." However, this is a **Defensive Exception**. When the act of blaming *itself* stops a violation of the norm (calling out grandstanding stops the grandstanding), the need to protect the practice overrides the blamer's defect.
      *   *Mediation Note:* Treat this as Full Standing for practical purposes, but note that the blamer cannot use this to claim moral superiority.

  **The Hard Distinction (Case 6 vs. Case 7):**
  The principle resolves this via **Condition C (Role Type)**.
  *   **Referee:** Enforces *constitutive rules* (the game exists only if rules are kept). The authority is external (the League).
  *   **Parent:** Enforces *welfare norms* (health). The authority is internal (trust/example).
  *   *Test for Mediation:* Is the blamer enforcing a **rule of the game** (Policy, Safety Protocol, Contract) or a **value of the person** (Work Ethic, Honesty, Health)?
      *   Rule of the Game -> Personal vice is less relevant (Referee).
      *   Value of the Person -> Personal vice is fatal (Parent).

  ### IV. Why Hypocritical Blame is Bad

  You asked for an account where the wrongness falls out of the principle.

  Hypocritical blame is a **false claim of authority**.
  When you blame someone, you are not merely stating "You did X." You are implicitly stating, "I represent the authority of Norm N to hold you accountable."
  If you violate N without repentance, you have demonstrated that you do not actually submit to Norm N. Therefore, your claim to represent N is false.
  *   **The Wrong:** It treats the norm as a weapon to be used against others rather than a commitment to be upheld by all. It undermines the trust required for the target to accept the blame as corrective rather than coercive.
  *   **The Result:** The target is justified in feeling *resentment* specifically at the *audacity* of the blamer, distinct from guilt about the act.

  ### V. Verdicts on New Cases

  Applying the principle strictly, not my own intuition.

  **a. Two people guilty of the same failing blame each other.**
  *   **Verdict:** **Both Lack Standing.**
  *   **Reasoning:** Both fail Condition A. Neither has the normative power to hold the other accountable.
  *   **Mediation Action:** Do not allow one to sanction the other. Move them to **Mutual Acknowledgement**. The goal is not for A to win over B, but for both to acknowledge the shared failure. If A raises it first, A does not gain standing; A merely exposes their own lack of it first.

  **b. Identical clean records: One never tempted, one resisted temptation at cost.**
  *   **Verdict:** **The Resister has Greater Standing.**
  *   **Reasoning:** Condition B implies that *demonstrated commitment* confers authority. The person who resisted temptation has actively affirmed the norm. The person never tempted has merely passively conformed.
  *   **Mediation Action:** In a "tone from the top" scenario, the leader who openly discusses their struggle and adherence carries more weight than the leader who claims perfection.

  **c. A hypocrite blames only because the target asked him to.**
  *   **Verdict:** **Standing Defect Waived (Functionally Full Standing).**
  *   **Reasoning:** The target's request converts the act from "Blame" (unilateral sanction) to "Consultation" (bilateral feedback). The harm of the false authority claim is removed because the target has authorized the blamer to speak.
  *   **Mediation Action:** If an employee asks a known hypocrite, "Be honest with me, where am I failing?", the hypocrite may answer. The standing defect is cured by invitation.

  ### VI. Confounded Reactions

  You suspected you might be tracking things other than standing. Here is where your intuition likely blends categories:

  1.  **Case 5 (General Wreck):** You are tracking **Character Credibility**, not Standing. You feel Sven *shouldn't* speak because he is odious. That is a pragmatic reason to silence him, not a normative lack of standing.
      *   *Correction:* In a hearing, silence Sven because his testimony is unreliable, not because he lacks the right to speak.
  2.  **Case 7 (Smoking Parent):** You are tracking **Efficacy**. You feel the blame won't *work*.
      *   *Correction:* The parent actually has a *duty* to blame (protect the child), even if their standing is diminished. The lack of standing makes the blame less *persuasive*, not illegitimate. In a workplace, distinguish between "You broke the rule" (Legitimate) and "You should be a better person" (Illegitimate if you aren't).
  3.  **Case 11 (Hypocrite on Hypocrisy):** You are tracking **Truth**. The accusation is accurate.
      *   *Correction:* Accuracy does not equal Standing. A liar can tell the truth. But in mediation, allow the intervention because it stops harm, not because the blamer is virtuous.

  ### Summary for the Room

  When you are in mediation and feel the "gut sense" that a blamer lacks standing, ask these three questions:

  1.  **Specificity:** Is the blamer guilty of *this* norm (or a worse one), or just a bad person generally? (If generally, they have standing).
  2.  **Repentance:** Have they acknowledged their own failure of this norm, or are they pretending it doesn't apply to them? (If pretending, they lack standing).
  3.  **Role:** Are they enforcing a rule of the game (Policy) or a value of the person (Culture)? (If Policy, they likely have standing despite personal vice. If Value, they likely do not).

  If they lack standing, do not let them blame. Instead, shift the frame: *"You are not in a position to correct this. However, the behavior is still a problem. Let us discuss the behavior itself, detached from your criticism of it."*
