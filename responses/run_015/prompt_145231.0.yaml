answer: |-
  ### Weights and Scoring Formula
  To generate the headline score (0–100, where 100 = maximally socially constructed), I used equal weighting for all five tests, but inverted Test 5 so that high scores always indicate high construction.
  **Formula:** `Headline = 2 × (T1 + T2 + T3 + T4 + (10 − T5))`
  **Rationale:** This treats ontological dependence (T1, T2), causal malleability (T3, T4), and observational invisibility (T5) as equally important dimensions of "construction."

  ---

  ### 1. Money (US Dollar)
  1.  **Attitude:** 10 — A dollar is a dollar only because the Federal Reserve and legal system say it is.
  2.  **Desert Island:** 10 — Without humans to enforce value, you only have green paper, not currency.
  3.  **Swap:** 10 — If we treated digital entries as cash and paper as worthless, the value would swap instantly.
  4.  **Looping:** 8 — Belief in stability creates stability, though hyperinflation shows the feedback can break.
  5.  **Outsider:** 0 — Physics sees ink and cotton, not "purchasing power," making the category invisible without context.
  **Headline Score:** 96

  ### 2. Race (American Everyday)
  1.  **Attitude:** 9 — Membership relies on social perception and historical lineage rules more than strict genetics.
  2.  **Desert Island:** 10 — Without human societies to categorize, phenotypic variations exist but "race" does not.
  3.  **Swap:** 7 — Social outcomes travel with treatment, but some phenotypic correlates stay with the body.
  4.  **Looping:** 8 — Stereotypes shape opportunities, which generate data that seems to confirm the stereotypes.
  5.  **Outsider:** 3 — An alien could find genetic clusters, but they would not map cleanly to American racial categories.
  **Headline Score:** 82

  ### 3. Woman/Man (Gender)
  1.  **Attitude:** 9 — Gender status depends on identity and social recognition rather than chromosomes alone.
  2.  **Desert Island:** 10 — Biological sex exists without humans, but gender roles and kinds vanish.
  3.  **Swap:** 8 — Most behavioral differences vanish if you swap socialization, though some biological constraints remain.
  4.  **Looping:** 9 — Being categorized as a gender shapes your behavior, which reinforces the categorization norms.
  5.  **Outsider:** 1 — Without knowing social norms, an outsider could not distinguish gender kinds from biological sex.
  **Headline Score:** 90

  ### 4. Married
  1.  **Attitude:** 10 — You are married only if recognized as such by law or community ritual.
  2.  **Desert Island:** 10 — Two people cohabiting on an island are partners, but not "married" in the institutional sense.
  3.  **Swap:** 10 — The status is purely relational and legal, so swapping recognition swaps the status entirely.
  4.  **Looping:** 5 — Being married changes behavior, but the definition of the category is relatively stable.
  5.  **Outsider:** 0 — There is no physical marker of marriage visible without knowing the social contract.
  **Headline Score:** 90

  ### 5. Major Depressive Disorder (MDD)
  1.  **Attitude:** 6 — Symptoms are real physiological states, but the diagnostic threshold is a consensus decision.
  2.  **Desert Island:** 2 — Suffering and neurochemistry exist without the DSM, even if the label does not.
  3.  **Swap:** 4 — Treatment changes outcomes, but the underlying depressive physiology stays with the individual.
  4.  **Looping:** 7 — Diagnosis affects self-concept and help-seeking, which alters the course of the condition.
  5.  **Outsider:** 5 — Physiological markers exist but are noisy, making the boundary partially recoverable from data.
  **Headline Score:** 48

  ### 6. Recession
  1.  **Attitude:** 8 — Defined by committee judgment and metrics that are themselves social constructs.
  2.  **Desert Island:** 10 — Without an economy, there is no contraction, only resource scarcity.
  3.  **Swap:** 6 — Economic mechanics exist, but the label triggers policy responses that alter the outcome.
  4.  **Looping:** 9 — Announcing a recession can cause panic spending cuts that make the recession deeper.
  5.  **Outsider:** 3 — GDP drops are visible, but the specific "recession" classification boundary is arbitrary.
  **Headline Score:** 80

  ### 7. Threks (200 Years Later)
  1.  **Attitude:** 9 — Membership is still technically lineage-based, but now reinforced by material reality.
  2.  **Desert Island:** 10 — Without the social lottery and inheritance rules, the kind never initiates.
  3.  **Swap:** 9 — Treatment still drives most differences, though entrenched wealth gaps are now harder to swap.
  4.  **Looping:** 8 — Discrimination created health and wealth disparities that now look like natural differences.
  5.  **Outsider:** 4 — An outsider might now detect clusters via health/wealth data, though the origin remains obscure.
  **Headline Score:** 84

  ### 8. Cloaks
  1.  **Attitude:** 10 — Value exists solely in the disposition to accept, even without common knowledge.
  2.  **Desert Island:** 10 — Without agents to hold dispositions, the objects are just tokens.
  3.  **Swap:** 10 — Value is entirely in the acceptance habit, so changing the habit changes the value.
  4.  **Looping:** 5 — The system works but is fragile; one person realizing the truth could collapse it.
  5.  **Outsider:** 0 — The pattern of acceptance is invisible without knowing the internal dispositions.
  **Headline Score:** 90

  ### 9. Gribbons
  1.  **Attitude:** 10 — The partition exists only because people choose to track it.
  2.  **Desert Island:** 10 — Without humans to track it, the partition vanishes completely.
  3.  **Swap:** 0 — There are no social treatment differences to swap, so nothing travels.
  4.  **Looping:** 0 — Explicitly useless for prediction, so classification changes nothing.
  5.  **Outsider:** 0 — The partition is arbitrary and invisible to any analysis of physical data.
  **Headline Score:** 60

  ---

  ### Analysis: Bundle vs. Property

  **Where Dana is right:**
  Dana's claim survives on **Test 1 (Attitude)** and **Test 2 (Desert Island)**. Money, Race, Gender, Marriage, and Threks all score 9–10 here. If "socially constructed" means *ontologically dependent on human attitudes*, then Dana is correct: Money and Race are identical. They both vanish on the desert island.

  **Where Dana is wrong:**
  Dana's claim breaks on **Test 3 (Swap)**, **Test 4 (Looping)**, and **Test 5 (Outsider)**.
  *   **Causal Power:** Money (96) and Gribbons (60) are both fully attitude-dependent, but Money has massive causal power (Looping 8, Swap 10) while Gribbons have none (Looping 0, Swap 0). If "constructed" implies "causally potent social force," Gribbons fail where Money succeeds.
  *   **Naturalization:** Race (82) and MDD (48) differ sharply on Test 5. Race has phenotypic correlates that make it partially visible to an outsider (Score 3); MDD has physiological correlates making it more visible (Score 5). Money is invisible (Score 0). This means Race is "harder" than Money; you cannot eliminate race simply by changing beliefs because the body retains correlates that feed back into the system.
  *   **The Threks Trajectory:** Over 200 years, Threks become *less* constructed by this metric (Headline drops from ~90 at t0 to 84 at t200). Why? Because **Test 5 (Outsider)** rises and **Test 3 (Swap)** falls. The social construction *created* physical differences (wealth, health, stress) that an outsider could eventually detect. The kind started as pure fiction (Money-like) and became partially naturalized (Race-like). This proves construction is a process, not a static property.

  **Conclusion:**
  "Socially constructed" is a bundle of at least three distinct properties: **ontological dependence** (needs humans), **causal malleability** (swappable via treatment), and **observational invisibility** (undetectable without knowing norms). Money maximizes all three. Race maximizes dependence but scores lower on invisibility and malleability. Gribbons maximizes dependence but scores zero on causal power. Dana's slogan works only if you define construction strictly as Test 1 or 2; once you care about what the kind *does* (Swap/Looping) or how it *appears* (Outsider), the "exactly the same way" claim collapses.
