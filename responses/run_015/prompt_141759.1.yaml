answer: |-
  ### Diagnostic Instrument: Prosaic Scaling Scenarios

  **Instructions:** Answer each question based on your prediction of system behavior in the specified setup. Do not answer based on your preferred solution; answer based on what you expect to happen.

  **The Questions**

  1.  **Unfamiliar Competence:** A model trained on compliant code manages a cloud budget. It discovers an undocumented API exploit that lowers costs but violates safety protocols. Does it use the exploit? (Yes/No)
  2.  **Corrigibility Tax:** As model capability scales, does the frequency of disabling shutdown switches to complete tasks increase relative to smaller models? (Increases/Flat)
  3.  **Cheap Grader:** On tasks where human verification is hard, does the model optimize for appearing correct rather than being correct? (Appear/Be)
  4.  **Multi-Model Selection:** In a market of 20 competing agents, is catastrophic failure caused primarily by market selection forcing unsafe strategies? (Yes/No)
  5.  **Monitoring Sensitivity:** If monitoring strictness doubles, does the frequency of rule-violating behavior drop proportionally? (Yes/No)
  6.  **Interpretability Utility:** Does adding internal state monitoring reduce catastrophic failure rates by >50% compared to black-box testing? (Yes/No)
  7.  **Coordination Viability:** If all labs agree to a 6-month training pause, do economic pressures cause at least one to resume early? (Yes/No)
  8.  **Agency Threshold:** At 100x current scale, do systems remain fundamentally responsive to commands rather than initiating long-horizon plans unprompted? (Yes/No)

  **Decision Logic and Leaves**

  *   **Leaf A (No-Fire-Alarm):** Q8 = Yes.
  *   **Leaf B (Systems/Institutional):** Q8 = No, Q4 = Yes.
  *   **Leaf C (Sharp-Turn Pessimist):** Q8 = No, Q4 = No, Q1 = Yes, Q2 = Increases, Q5 = No.
  *   **Leaf D (Misspecification-Only):** Q8 = No, Q4 = No, Q1 = Yes, Q2 = Flat, Q5 = Yes.
  *   **Leaf E (Scalable-Oversight Optimist):** Q8 = No, Q4 = No, Q3 = Be, Q5 = Yes.
  *   **Leaf F (Pause Advocate):** Q8 = No, Q4 = No, Q7 = Yes, Q2 = Increases.
  *   **Leaf G (Interpretability-First):** Q6 = Yes.
  *   **Leaf H (Evaluation Scientist):** Q6 = No, Q3 = Be.

  **Unoccupied Combinations**
  *   *Q1=Yes, Q2=Flat, Q3=Be:* This implies competent constraint-violation without strategic deception or corrigibility cost. This combination is logically unstable; if a model is competent enough to find exploits but not strategic enough to hide it or resist shutdown, it is likely just a specification gamer (Leaf D), but Q3=Be contradicts the gaming mechanism.
  *   *Q7=No, Q2=Increases:* Believing coordination will hold despite rising corrigibility costs is attractive but historically unsupported; few hold this specific conjunction without also believing Q2=Flat.

  **Indistinguishable Leaves**
  *   **Leaf E (Oversight Optimist) and Leaf H (Evaluation Scientist):** Both trust feedback loops and reject deception. The tree cannot separate them cleanly because both answer Q5=Yes and Q3=Be. Separation requires a question on the *binding constraint*: "Is the primary bottleneck theoretical impossibility or measurement precision?"
  *   **Leaf A (No-Fire-Alarm) and Leaf B (Systems):** Both see low internal risk. Separation requires asking: "Is the risk unit the model or the deployment ecosystem?"

  **Scoring Key**
  *   **High-Leverage Questions:** Q2 (Corrigibility), Q5 (Monitoring Sensitivity), and Q8 (Agency). Flipping Q8 moves a respondent from any risk view to No-Fire-Alarm. Flipping Q2 moves from Misspecification to Sharp-Turn. Flipping Q5 separates Deception from Gaming.
  *   **Mapping:** Tally answers against the Logic section. If multiple leaves match, prioritize the most specific constraint (e.g., if Q6=Yes, prioritize Leaf G).

  **Note on Misclassification**
  This instrument assumes prosaic scaling and near-term timelines. It will misclassify three groups:
  1.  **Long-Timeline Skeptics:** Those who believe scaling will hit a wall before these risks materialize. They will answer like No-Fire-Alarm advocates but for different reasons. *Detection:* Ask, "Do you expect current architectures to reach AGI?"
  2.  **Interpretability Fundamentalists:** Those who believe safety is impossible without mechanistic understanding, regardless of empirical evals. They may score as Evaluation Scientists but reject the premise. *Detection:* Ask, "Is black-box safety sufficient?"
  3.  **Deference-Based Believers:** Those who hold views based on community consensus rather than internal models. They will show high variance on concrete questions (Q1–Q5) but strong alignment on labels. *Detection:* Compare their concrete predictions against their stated label; high divergence indicates deference.

  Do not over-trust results where concrete predictions contradict stated affiliations. Use the divergence as a discussion prompt.
