answer: |-
  Good evening, everyone. For those who don't know me, I'm the team captain. For those who do: yes, I promise this speech is under six minutes, because we have chicken to eat and I know the kitchen staff is watching.

  I want to start by thanking our parents and families. You drove us to meets, you listened to us argue about hypothetical strangers at the dinner table, and you are paying for this banquet. You should know that when you funded this team, you weren't just funding trophies. You were funding a specific kind of intellectual honesty.

  And nobody taught us that honesty better than Coach [Name], who is retiring after eleven years. Coach, you taught us that ethics isn't just about knowing the right answer; it's about knowing why you think it's the right answer. You were the one who introduced us to the term "intuition pump." For the parents in the room: an intuition pump is a story designed to make you feel a moral conclusion before you've had time to think it through. It's a shortcut for the brain.

  Tonight, I want to show you how we test those shortcuts. We use a tool we call the "one-detail flip." Here is how it works.

  Imagine a runaway train is heading toward five workers. You stand next to a switch.
  **Version One:** You pull a lever. The train diverts. One worker dies, five live.
  **Version Two:** You stand on a bridge. You must push a large man off the bridge to stop the train. One man dies, five live.

  Structurally, these are identical. One death is traded for five lives. But if your intuition recoiled at the push and accepted the lever, your verdict flipped based on a single detail: the use of hands versus a machine. When we run this flip, we name what is happening. If the verdict changes when we swap an irrelevant detail, the case is doing rhetorical work, not evidential work. It means the story is persuading you, not the logic. If the verdict stays the same, the argument is robust.

  We had to use this test during our state semifinal. We won that round partly on a hypothetical we constructed.
  **Vivid Version:** We described a single senior named Maria. She was the first in her family to apply to college, she worked the closing shift at a pharmacy to support her mother, and one scholarship stood between her and the state school. We pit her against thirty unnamed students who would each receive a small tutoring grant if Maria's scholarship were divided.
  **Stripped Version:** One identified individual with high personal stakes versus thirty unidentified individuals sharing a resource.

  When we argued the vivid version, the room felt the urgency. When we stripped it to the bare structure, the room saw a budget allocation. The intuition shifted from "save Maria" to "maximize utility." My teammate Priya noted afterward that we might have lost without Maria's name. That was uncomfortable. It meant we had won a round with something that was never really an argument—it was a story.

  But does this mean all stories are tricks? No. And this is important for you to hear, parents. Sometimes the detail *is* the evidence. Let's look at a case where stripping the detail does not change the verdict.
  **Vivid Version:** A person breaks into a closed pharmacy at night to steal insulin for a child who is going into diabetic shock.
  **Stripped Version:** Violating property rights to prevent immediate, irreversible bodily harm to a dependent.

  In the vivid version, you feel the desperation. In the stripped version, you see the hierarchy of rights. But in both cases, most of us agree the action is permissible. The detail didn't bypass our judgment; it clarified the stakes. The story wasn't a pump; it was a lens.

  I am aware that I am standing here using stories to persuade you that stories can be dangerous. I am using a loaded metaphor right now. I am shining a **spotlight** on our reasoning process. I want to name this metaphor as I use it. A spotlight illuminates the center of the stage, but it necessarily leaves the corners in the dark. I am using this spotlight metaphor to ask you to look at the center—the logic—while acknowledging that I am controlling where the light falls. I am telling you I am doing this so that you can judge the light, not just the object.

  This is the legacy I want to leave for [Incoming Captain's Name], who will lead next year. [Name], you will inherit the same temptation. You will want to win. You will want to name the student "Maria." My advice is this: Use the story, but run the flip. If changing the name to "Student A" changes your conclusion, you don't have an argument yet. You have a feeling. Dig until you find the principle that holds even when the lighting changes.

  We didn't win this season because we were tricksters. We won because we cared enough to check our own tricks. We learned that being ethical means being suspicious of your own certainty.

  To Coach [Name]: Thank you for teaching us that the right answer is less important than the right reason. To the rival coach: Thank you for pushing us to be sharper. To the parents: Thank you for believing that teaching seventeen-year-olds to doubt their own intuition is a worthwhile investment. It is.

  Please raise your glasses. To the arguments we won, to the ones we lost, and to the work that remains. Cheers.
