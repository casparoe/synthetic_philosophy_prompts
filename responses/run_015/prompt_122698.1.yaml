answer: |-
  The principle that best organizes your gut verdicts is **The Principle of Design Stewardship.**

  It posits that you do not own a mechanic as property, but as a **steward**. You hold a temporary, moral monopoly on a specific design solution because you invested the labor to cultivate it. That stewardship grants you protection against **extraction** (others taking the benefit without the cost) only so long as you are **actively sustaining** the design and have not **released** it to the commons.

  Here is the breakdown of the principle, the clauses that motivate your cases, the verdicts you must adjust, and the tests for the future.

  ### The Principle: Design Stewardship

  **Core Statement:** *You have a claim on a design solution when you are actively sustaining it. Others violate this claim if they use proximity to your work to bypass their own iterative labor in a way that erodes your authorship or viability, unless you have explicitly released that claim.*

  **The Four Clauses:**
  1.  **The Access Clause:** Did they have proximity to your specific solution (rulebook, demo, data) that allowed them to skip the "fog of war" in design? *(Motivates 1, 3, 7, 10)*
  2.  **The Consent Clause:** Did you offer this proximity as a gift to the community (blog, postmortem) or abandon it through time (out of print)? *(Motivates 4, 9)*
  3.  **The Viability Clause:** Does their usage threaten your ability to continue stewarding the work (selling, reputation, livelihood)? *(Motivates 1 vs 10, 5)*
  4.  **The Transformation Clause:** Did they add significant new labor that creates a distinct value, rather than just extracting yours? *(Motivates 5, 8)*

  ### Mapping Your Cases

  *   **1 (Big Studio):** Violates Access, Viability, and Transformation. They extracted your labor to threaten your survival. **(Not Fine)**
  *   **2 (Independent):** No Access. No extraction. **(Fine)**
  *   **3 (Forgotten Con):** Violates Access (unconscious), Viability (low). The link is murky, so the debt is murky. **(Not Fine, less bad)**
  *   **4 (Postmortems):** Access is true, but Consent overrides it. You gifted the labor. **(Fine)**
  *   **5 (Improvement):** Violates Access, but Transformation is high. Viability threat is ambiguous. **(Debt exists, but financial claim is weak)**
  *   **6 (Simultaneous):** Access is false (for the others), but true for the copier. Your uniqueness claim drops, but the copier's bad faith remains. **(Copier wrong, ownership diluted)**
  *   **7 (AI Output):** Violates Access and Transformation. It is automated extraction without labor. **(Not Fine)**
  *   **8 (AI Input):** Transformation Clause. The AI is a tool augmenting your labor, not substituting it. **(Fine)**
  *   **9 (Out of Print):** Consent via Abandonment. You are no longer stewarding. **(Fine)**
  *   **10 (Foreign Market):** Violates Access. Viability threat is near zero. **(Technically Wrong, Practically Ignorable)**

  ### Verdicts You Must Drop

  To make this principle hold, you must adjust two of your gut reactions:

  1.  **Case 10 (Foreign Language):** You wrote: *"Nothing. Which can't be right."*
      *   **The Adjustment:** You must accept that it **is** a violation of the Access Clause, even if the Viability Clause is zero. It is ethically "Not Fine," but the *sanction* is zero because no harm was done. You cannot call it "Fine" (neutral); it is a "Victimless Violation." This preserves the integrity of your work even where enforcement is impossible.
  2.  **Case 5 (The Fix):** You wrote: *"I'd struggle to say they owe us."*
      *   **The Adjustment:** You must acknowledge they **owe attribution**. Even if they improved the loop (Transformation), they started on your shoulders (Access). They may not owe you *money* (Viability not threatened/enhanced), but they owe you *authorship*. To say they owe nothing erases your labor.

  ### The Two New Cases

  **1. The Fan Mod (Requires ownership, non-commercial)**
  *   **Verdict:** **Fine.**
  *   **Reasoning:** This passes the **Consent Clause** (implied by community norms) and fails the **Viability Clause** (it requires purchasing your game, actually enhancing your stewardship). It is an act of tribute, not extraction.

  **2. The Internal Training Exercise (Corporate, never sold)**
  *   **Verdict:** **Fine (with caveats).**
  *   **Reasoning:** This violates the **Access Clause** (they used your loop without labor), but it fails the **Viability Clause** completely. They are not entering your market, nor erasing your authorship publicly. It becomes "Not Fine" only if they scale it to replace a game they *would have bought* from you (e.g., training 10,000 employees instead of licensing 100 copies).

  ### The Discriminating Hypothetical

  To distinguish **Design Stewardship** from a pure **Labor Theory** (you own what you make) or a pure **Market Theory** (you own what you sell), present yourself with this case:

  **The Beneficial Bootleg:**
  > A company in a region you cannot ship to (due to logistics, not language) prints your game. They sell it locally. They credit you prominently. Because of their version, your brand becomes famous in that region, and when you *finally* do ship there, sales are double what they would have been. They made money off your labor; you made more money because of their piracy.

  *   **Pure Labor Theory:** **Not Fine.** They bypassed your work. The debt exists regardless of the outcome.
  *   **Pure Market Theory:** **Fine.** No market harm occurred; you gained market share.
  *   **Design Stewardship:** **Fine.** The core metric is your ability to *continue stewarding* the design. Since your viability and authorship were enhanced, the extraction is legitimized by the outcome.

  **Why this tells the principles apart:**
  If your gut says "They still stole from me, even if I profited," you are a Labor Purist, and my principle is too utilitarian for you. If your gut says "It's fine, everyone won," you are a Steward. This case forces you to decide if the *act* of copying is wrong, or if the *consequence* of copying is what matters. Given your Case 10 ("Nothing... which can't be right"), I suspect you are a Steward who is uncomfortable admitting that consequences matter more than acts.
