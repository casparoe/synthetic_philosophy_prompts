answer: |-
  Dear colleague,

  It is completely understandable that you feel the standard labels like Prisoner's Dilemma or Tragedy of the Commons are insufficient for what you are describing, because while those concepts capture the static payoff structure, they often miss the dynamic, evolutionary, and systemic quality of the phenomenon you are observing. What you are identifying is a specific subclass of collective action problems where the competitive structure itself acts as an autonomous force that decouples individual rationality from collective welfare over time. In international relations theory, the closest established concept is the Security Dilemma, originally articulated by John Herz and later refined by Robert Jervis. The core insight there is that one actor's attempt to increase their own security, even if purely defensive, is perceived as a threat by others, prompting them to respond in kind, leading to an escalation spiral where everyone ends up less secure despite no one intending hostility. This matches your description of the arms race and the lack of a clear moment of defection, because every step is rational and defensive from the individual perspective, yet collectively disastrous. However, the Security Dilemma is usually confined to military or state behavior, so for the broader social and economic examples you mentioned, you are likely looking for the literature on Positional Goods and Positional Arms Races.

  This framework was developed most notably by Fred Hirsch in his work on the social limits to growth and later by Robert Frank in economics. The mechanism here hinges on the distinction between absolute goods and positional goods. If I consume a public good like clean air, it does not diminish your ability to consume it, but if I consume a positional good like status, prestige, or a top ranking, my gain is inherently your loss because the value of the good depends on relative standing rather than absolute quality. In contexts like academic publishing, cosmetic surgery, or doping, the actors are competing for a fixed hierarchy or a relative advantage. When everyone publishes more, the baseline for what counts as a sufficient publication record rises, so everyone works harder for the same net reward. This creates an expenditure arms race where resources are burned simply to maintain relative position. This connects deeply to what evolutionary biologists call the Red Queen Effect, named after the character in Through the Looking-Glass who says you must run as fast as you can just to stay in the same place. This captures the dynamic deterioration you noted, where the system accelerates not because anyone wants it to, but because standing still means falling behind.

  In contemporary discourse, particularly within rationalist communities and some corners of political philosophy, this specific dynamic where competition destroys value without any individual agent willing the destruction is often referred to as a Multipolar Trap, sometimes personified by the metaphor Moloch. This concept was popularized by Scott Alexander but draws on earlier game theoretic discussions about polycentric drift. The value of this label is that it emphasizes the loss of agency at the systemic level. In a standard Prisoner's Dilemma, we imagine two agents who could cooperate if they could just communicate or enforce a contract. In a Multipolar Trap or Molochian scenario, the competition is often so diffuse, or the pressure so immediate, that coordination is functionally impossible even if everyone agrees in principle that the current path is destructive. It captures the feeling you described that the logic of the situation pushes everyone step by step into a worse state. It is not that actors are defecting from a cooperative norm, but rather that the competitive environment selects for behaviors that undermine the norm, effectively punishing any actor who attempts to unilaterally disarm. This is why you see no identifiable moment of defection; the defection is baked into the incentive structure itself, making the suboptimal equilibrium the only stable one.

  To understand the core mechanism and its boundaries, it helps to focus on the nature of the gains involved. The pattern you are seeing holds strongest when the competition is over relative gains rather than absolute gains. If the actors were cooperating to expand a pie, individual rationality would generally align with collective rationality, or at least diverge less sharply. The trap snaps shut when the value of the outcome is determined by ranking or scarcity. Another boundary condition is the ability to enforce constraints. In some instances of this pattern, such as doping in sports, the trap is broken by introducing an external enforcement mechanism like drug testing, which changes the payoff structure so that the individually rational move is no longer to dope. Without such external enforcement or a way to change the metric of competition itself, the system remains locked. This distinguishes it from a simple coordination failure where a focal point might solve the problem. Here, even if everyone coordinates on a lower level of effort, the incentive to cheat and gain a relative advantage remains so potent that the agreement is unstable without policing.

  So while there is no single perfect term that covers every instance across every domain, the most precise academic vocabulary would describe this as a dynamic Positional Arms Race driven by a Security Dilemma logic within a system of Relative Goods. If you are writing for an audience familiar with contemporary systems theory or AI safety literature, Multipolar Trap is likely the most evocative shorthand for the systemic agency loss you are highlighting. For a more traditional political theory audience, framing it as an intensification of the Security Dilemma applied to non-military domains might be more resonant. The crucial theoretical contribution you can make is to highlight the temporal dimension you noticed, the gradual erosion rather than sudden collapse. This suggests that the mechanism is not just about static incentives but about feedback loops where the output of one round of competition becomes the baseline for the next, ratcheting the pressure upward indefinitely. Understanding this boundary helps distinguish these scenarios from one-off cooperation problems and points toward solutions that require structural intervention rather than just moral appeals, since the actors are not morally failing but rather responding rationally to a pathological structure.

  I hope this helps clarify the landscape of concepts available to you. It is a rich area for theoretical work because it touches on the fundamental tension between individual agency and systemic constraints, and finding a way to articulate that tension clearly is valuable for political theory. If you need to point to a specific lineage, starting with Hirsch on positional goods and Jervis on the Security Dilemma will give you the established footing, while bringing in the Red Queen effect adds the necessary evolutionary dynamic to explain the escalation. Good luck with the research.
