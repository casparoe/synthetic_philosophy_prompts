answer: |-
  # JOINT STATEMENT ON PREDICTIVE PROCESSING AND THE FREE ENERGY PRINCIPLE

  **Signatories:** The Unifier, The Redescriptionist
  **Date:** October 2023
  **Subject:** Clarifying commitments, distinguishing levels of analysis, and defining empirical adjudicators.

  ## 1. AGREED CLAIMS

  We agree that the last three years of debate have suffered from category errors regarding the level of description at which claims are being made. We endorse the following numbered claims as a baseline for future discourse.

  1.  **The Layer Cake Distinction:** We distinguish four distinct layers of claim often conflated in this debate:
      *   **(L1) The Free Energy Principle (FEP):** A mathematical claim about any system that maintains a boundary and stays out of equilibrium (must minimize variational free energy to persist).
      *   **(L2) Predictive Coding (PC):** A specific circuit-level process story (e.g., separate populations for predictions and prediction errors, bidirectional connectivity).
      *   **(L3) Predictive Processing (PP):** An architectural/cognitive claim (the brain is a hierarchical generative model; perception is inference on causes).
      *   **(L4) Active Inference:** A control scheme (action is employed to minimize expected free energy/fulfill predictions).
      *   **Agreement:** Proof or disproof at one layer does not automatically settle the others. Most recent conflict arises from scoring L3/L4 claims using L1 arguments, or defending L2 using L3 assumptions.

  2.  **The Triviality Constraint:** We agree that "surprise minimization" or "free energy minimization" at the level of L1 is satisfiable by an enormous range of systems. Success at this abstract level is *not* evidence for the specific cortical-process claims of L2 or the cognitive claims of L3. The Unifier signs this without concession: the FEP is intended as a necessary condition for existence, not a sufficient explanation of specific neural dynamics.

  3.  **The Dark Room Problem:** We agree that surprise minimization alone does not pick out an interesting agent (the "dark room" problem). The specific content of behavior must come from the structure of the generative model and its prior preferences.
      *   **Agreement on Status:** We agree this is not a logical flaw in the framework, but it is the point where the principle stops doing explanatory work on its own. The explanatory burden shifts to the specification of the priors. If priors must be hand-set to match observed behavior post-hoc, the framework risks becoming a redescription tool rather than a predictive theory.

  4.  **The Comparison Class:** Predictive Processing claims must be scored against a comparably resourced alternative (e.g., a standard Reinforcement Learning model, a Kalman filter, or a mechanistic dynamical systems model) rather than against a null model or a straw-man behaviorist account. If a PP model requires more free parameters to fit the same data as a simpler RL model, it does not win by default on "theoretical unity."

  5.  **Mechanism is Mandatory:** We agree that a computational-level story (L3) is insufficient without a plausible implementation story (L2). A claim that "the brain does inference" is empty if there is no credible account of how the requisite probabilities or precisions are represented and updated in wetware within biologically realistic timeframes.

  6.  **Parameter Transparency:** We agree that "precision weighting" (attention) and "prior preferences" (goals) are the primary loci of flexibility in PP models. To avoid post-hoc fitting, future models must specify constraints on how these parameters are learned or bounded before data collection.

  ---

  ## 2. DISAGREEMENTS TABLE

  | Issue | Unifier Stance | Redescriptionist Stance | Genuine or Verbal? | Linked Crux |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Explanatory Leverage** | PP provides a unified currency for perception, action, and attention that reveals structural similarities between tasks that look disjoint in RL or mechanistic terms. | PP provides a unified *vocabulary*, but not unified *leverage*. It redescribes standard control and inference problems without generating novel predictions that simpler frameworks couldn't produce. | Genuine | Crux 2 (Transfer) |
  | **2. Neural Implementation** | The canonical microcircuit (superficial PE, deep prediction) is a specific, testable hypothesis. Laminar data should show distinct profiles for forward (PE) and backward (prediction) signals. | The laminar data is consistent with PP but not unique to it. Similar profiles arise in standard error-correction learning or adaptation models without invoking hierarchical Bayesian inference. | Genuine | Crux 1 (Laminar) |
  | **3. Parameter Freedom** | Priors and Precision are latent variables that the brain *infers*. Fitting them to data is no different than fitting learning rates or reward functions in RL. | In practice, PP models often fix the generative model structure after seeing the data. RL models typically have tighter constraints on the value function update rules. | Genuine | Crux 2 (Transfer) |
  | **4. The Meaning of "Inference"** | The brain literally performs Bayesian updating (or a close approximation) over a learned generative model. | The brain behaves *as if* it infers, but mechanistically it is likely doing something simpler (e.g., Hebbian association, temporal difference learning) that maps onto the math only loosely. | Verbal/Genuine Hybrid | Crux 1 (Volatility) |
  | **5. Action and Perception** | Action and perception are the same kind of process (minimizing prediction error), differing only in whether you change the model or the input. | Action and perception are functionally distinct control and estimation problems. Forcing them into one currency obscures the specific constraints of motor control. | Genuine | N/A |

  ---

  ## 3. CRUXES AND TESTS

  We identify two specific empirical cruxes where our predictions diverge sharply. We agree to treat the following pre-registered predictions as binding for the purpose of this debate.

  ### Crux 1: The Omitted Tone / Volatility / Reward Experiment

  **Design:**
  *   **Stimulus:** Stream of near-regular tones with occasional omissions at a predictable time.
  *   **Manipulation 1 (Volatility):** Two blocks differing in how volatile the inter-tone interval is (stable vs. unstable timing).
  *   **Manipulation 2 (Reward):** Reward value of the omitted event is manipulated orthogonally (high vs. low value cue preceding the stream).
  *   **Readouts:**
      1.  Existence of evoked response at the expected time of the omitted tone.
      2.  Amplitude scaling (Volatility estimate vs. Reward value).
      3.  Laminar profile (Macaque): Does the response look like a prediction-error signal (superficial bias) vs. release from adaptation? What happens when top-down feedback is suppressed?

  **Pilot Data (Human/Macaque):**
  *   *Result:* Clear response at the right time. Amplitude tracks the fitted volatility estimate. No detectable relation to the reward manipulation. Laminar data suggests superficial bias (unsure, pending replication).

  **Pre-Registered Predictions:**

  | Readout | Unifier Prediction | Redescriptionist Prediction |
  | :--- | :--- | :--- |
  | **1. Existence** | **Yes.** Omission generates a Prediction Error (PE) because the sensory input contradicts the top-down prediction. | **Yes.** Omission generates a Deviance Detection signal or release from adaptation. |
  | **2. Scaling** | **Volatility.** Precision weighting should scale the PE. High volatility = lower precision on timing predictions = smaller PE amplitude (or vice versa depending on specific model formulation of precision). **Reward:** Reward affects *prior preferences* (deep levels), not necessarily early sensory PE unless attention (precision) is mobilized by reward. | **Volatility.** Standard adaptation models predict sensitivity to recent statistical structure. **Reward:** If this is a learning system, reward should modulate the signal (RL prediction error). If it is purely sensory adaptation, reward should not. |
  | **3. Laminar/Feedback** | **Superficial PE.** Signal should originate in superficial layers (sending PE up). **Feedback Suppression:** Should reduce or eliminate the prediction (deep activity), thereby altering the PE signal magnitude. | **Adaptation.** Signal may look similar, but... **Feedback Suppression:** If the signal is local adaptation, suppressing top-down feedback should *not* abolish the omission response (it is locally generated). |

  **Interpretation of Pilot & Falsification Conditions:**

  *   **Unifier Interpretation:** The pilot supports the PP view. The volatility scaling confirms precision weighting. The lack of reward effect is consistent with a hierarchical model where reward modulates deep priors, not early sensory precision (unless the task makes reward relevant to *listening*).
      *   *Falsification:* If the omission response persists unchanged when top-down feedback is chemically or optogenetically suppressed. If reward robustly modulates early sensory PE in a passive task where reward is irrelevant to stimulus structure.
  *   **Redescriptionist Interpretation:** The pilot is consistent with PP but also consistent with a standard volatility-sensitive deviance detector. The null reward result is inconclusive (likely a weak manipulation or ceiling effects). The laminar data is the real battleground.
      *   *Falsification:* If the laminar profile is exclusively deep-layer or shows no separation between prediction and error populations. If the "volatility scaling" can be fully explained by a simple linear filter of recent inter-tone intervals without invoking a latent "precision" variable.

  ### Crux 2: The Overfitting / Transfer Question

  **Design:**
  *   **Phase 1:** Fit a PP model to Task A (e.g., a specific perceptual decision task).
  *   **Phase 2:** Predict behavior and neural data on Task B (structurally similar but distinct context) with **no new free parameters** (structural priors and learning rates fixed from Task A).
  *   **Comparison:** Compare held-out performance to a task-specific model (e.g., a Q-learner or regression model) with a comparable hand-set budget fitted directly to Task B.

  **Predictions:**

  *   **Unifier:** The PP model will outperform the task-specific model on Task B. Because the PP model captures the *structure* of the generative process (the way the world works), it should transfer. The task-specific model will overfit Task A and fail to generalize without re-tuning.
  *   **Redescriptionist:** The task-specific model will match or beat the PP model on Task B. The PP model will only succeed if "structural priors" are implicitly tuned on Task B data (leakage). If parameters are truly fixed, the PP model is too rigid or too flexible (depending on how priors are set) to beat a model designed for the specific task statistics.

  **Move-the-Needle Condition:**
  *   **For the Unifier:** If the PP model predicts Task B behavior within 5% of the variance explained by the task-specific model, without any parameter adjustment.
  *   **For the Redescriptionist:** If the PP model requires more than 2 free parameters to be re-estimated to fit Task B, the claim of "unified architecture" is weakened relative to standard transfer learning methods.

  ---

  ## 4. VERBAL DISPUTES AND CONCLUSION

  ### Verbal Disputes
  We flag the following disagreements as primarily verbal, stemming from definitional ambiguity rather than empirical conflict:

  1.  **The Definition of "Inference":**
      *   *Dispute:* The Unifier uses "inference" to mean "Bayesian updating over a learned generative model." The Redescriptionist often interprets "inference" as "any state change describable as reducing surprise."
      *   *Resolution:* If the Redescriptionist accepts that a system can be *functionally equivalent* to Bayesian inference without running the math explicitly, the disagreement shrinks. If the Unifier claims literal probability distributions are represented in firing rates, the disagreement is genuine and empirical (see Crux 1).
  2.  **The Definition of "Prediction":**
      *   *Dispute:* The Unifier means "a distribution over hidden causes." The Redescriptionist often means "a merely anticipatory or entrained state" (e.g., neural oscillation phase).
      *   *Resolution:* PP and entrainment-style accounts might not be rivals. Entrainment could be the mechanism by which the prediction is implemented. We agree to stop treating these as mutually exclusive unless data shows oscillations persisting without the requisite hierarchical connectivity.

  ### Will This Move the Debate?
  **Honest Assessment:**
  There is a non-zero probability that even these tests will not settle the debate.
  *   **Risk 1:** The PP framework is flexible enough to absorb the laminar results (e.g., by redefining which layers carry which signals).
  *   **Risk 2:** The Redescriptionist may argue that any successful PP model is just a complicated way of implementing a standard control solution, rendering the "win" pyrrhic.

  **However,** we agree that **Crux 2 (Transfer)** is the strongest arbiter. If PP cannot demonstrate superior generalization with fixed parameters compared to standard models, the claim that it offers a "unified theory of brain function" loses its primary pragmatic justification. Conversely, if it does demonstrate this transfer, the claim that it is "just a redescription" becomes untenable.

  We commit to treating the results of these specific designs as adjudicating evidence, rather than opportunities for further theoretical retrofitting.

  **Signed,**

  The Unifier
  The Redescriptionist
