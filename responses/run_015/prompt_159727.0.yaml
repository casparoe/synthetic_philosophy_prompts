answer: |-
  **Project Title:** The Drift Problem: Discrete Strategies and Continuous Normative Change in Lewisian Conventions

  **Project Summary**
  Lewisian conventions rely on a common-knowledge condition: agents must know, and know that others know, that a specific regularity $R$ is being followed in preference to alternative regularities $R'$. Standard formulations, and the cultural-evolution models built upon them, presume $R$ and $R'$ possess determinate, discrete content. This discreteness ensures that conforming to $R$ precludes conforming to $R'$, satisfying the exclusion clause required for coordination problems.

  However, many robust normative regularities—such as norms of eye contact, interruption, or forms of address—exhibit "drift": they shift continuously over decades without apparent equilibrium breakdown or conscious deviation. At no point do agents seem to face a discrete choice between competing regularities; yet the end state is incompatible with the starting state. This creates a tension I call the **Drift Problem**. If normative content is continuous or blurred, it is unclear what constitutes the object of common knowledge. If the content of the expectation is graded, agents cannot strictly know *which* regularity is in force, undermining the Lewisian foundation.

  This project asks: **Does the common-knowledge condition in Lewisian conventions necessitate discrete strategy sets, and if so, does this exclude gradual normative drift from the category of convention?**

  **Significance and Existing Replies**
  The project challenges the assumption that strategy discreteness is merely a technical convenience for modellers. If common knowledge requires determinate content, then discreteness is ontological, not methodological. Three standard replies fail to resolve this:

  1.  **The Equilibrium Switch:** Drift is a rapid sequence of tiny discrete jumps. This is phenomenologically implausible and computationally ad hoc; it posits instability where social observation suggests stability.
  2.  **The Category Error:** Drifting norms are habits or practices, not conventions. This protects the theory by shrinking its scope, but arbitrarily excludes coordination problems that function like conventions (solving recurrent interaction problems) merely because they lack sharp boundaries.
  3.  **The Vagueness Deflection:** Drift is simply semantic vagueness. This ignores that Lewisian common knowledge is an epistemic condition. Vagueness in the *content* of the regularity prevents the requisite higher-order knowledge from obtaining, regardless of semantic theory.

  A fourth possibility remains unexplored: **Asymmetry.** Discreteness may be required for the *onset* of a convention (salience requires a discrete menu) but not for its *sustainment* (inertia allows for continuous drift). Determining the viability of this asymmetry is the core task of this fellowship.

  **Methodology**
  This is primarily a conceptual project, not a empirical or computational one. Running new simulations or surveys cannot answer whether common knowledge *can* exist over continuous state spaces; simulations presuppose an ontology of strategies, and surveys report intuitions rather than logical conditions.

  Philosophical analysis is required to clarify the necessary conditions for common knowledge in coordination contexts. However, this analysis must be constrained by formal possibility. Therefore, I will work alongside cultural-evolution modellers not to generate new data, but to test logical boundaries. The modellers' role is to attempt to construct coordination games with continuous state spaces that sustain equilibrium without discrete switching. If they cannot formalize it, the philosophical claim that discreteness is necessary is strengthened. If they can, the philosophical account must explain how common knowledge survives the loss of discreteness.

  **Work Plan (Six Months)**

  *   **Months 1–2: Formalizing the Drift Problem.**
      *   I will draft a rigorous definition of "continuous normative drift" distinct from vagueness and equilibrium switching.
      *   I will map the specific point where the common-knowledge condition breaks down under continuous variation.
      *   *Deliverable:* A working paper outlining the logical conflict between common knowledge and continuous regularities.

  *   **Months 3–4: Modeller Collaboration and the Asymmetry Hypothesis.**
      *   I will collaborate with two institute modellers to test if continuous-state coordination games can sustain common knowledge.
      *   We will specifically test the Asymmetry Hypothesis: Can a model initialize with discrete salience but transition to a continuous state space without losing equilibrium?
      *   *Deliverable:* A joint technical note documenting whether continuous coordination equilibria are formally coherent under Lewisian epistemic constraints.

  *   **Months 5–6: Synthesis and Resolution.**
      *   I will integrate the formal results into the philosophical account.
      *   If discreteness is proven necessary, I will argue that drifting norms constitute a distinct category requiring non-Lewisian tools.
      *   If discreteness is unnecessary, I will propose a modified account of convention that decouples common knowledge from determinate content.
      *   *Deliverable:* A final manuscript ready for submission to a journal such as *Philosophy of Science* or *Synthese*.

  **Outcomes and Success Conditions**
  *   **Positive Result:** A definitive classification of drifting norms. Either (a) a proof that Lewisian conventions require discreteness, forcing a distinction between "conventions" and "drifting norms," or (b) a revised epistemic condition that allows common knowledge to track continuous regularities. The Asymmetry Hypothesis would be a specific success if shown to be formally viable.
  *   **Negative Result (Failure):** The project fails if the Drift Problem dissolves into general semantic vagueness without impacting the epistemic condition, or if modellers demonstrate that continuous coordination is trivially easy to model, rendering the philosophical worry moot.
  *   **Feasibility Assessment:** This is a tight six-month project, not a disguised dissertation. I am not attempting to solve the metaphysics of norms generally, nor to build a new theory of cultural evolution. I am isolating a single conflict between the epistemic conditions of Lewisian theory and the phenomenology of normative change. The scope is limited to the *compatibility* of common knowledge and continuous drift. If the Asymmetry Hypothesis proves intractable, I will default to the classification outcome (a), which is achievable within the timeframe.

  **Fit with Institute**
  This project requires the specific pairing of philosophy and modelling this institute provides. A philosopher alone might dismiss the modeller's discreteness as mere idealization; a modeller alone might dismiss the epistemic worry as irrelevant to dynamics. By forcing the two to confront whether the idealization violates the theory's core conditions, we can determine if the standard toolkit is sufficient for the phenomena we actually observe.
