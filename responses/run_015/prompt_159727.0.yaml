  *(Self-Correction on Feasibility)*: I need to be honest. If I say "it's definitely 6 months," the committee might doubt me. If I say "it's a dissertation," they won't fund it. The sweet spot is: "The core logical conflict is resolvable in 6 months; the broader implications are long-term." I will frame it as resolving the *compatibility* question, not solving the metaphysics of norms entirely.

