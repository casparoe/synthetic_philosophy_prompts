prompt: |-
  I am giving a forty-minute paper, followed by an hour of questions, to the technical panel revising our national cost–benefit guidance for long-horizon projects: flood defences, nuclear waste storage, climate adaptation. The panel is five or six applied public economists who use the Ramsey rule daily and currently apply a small positive pure rate of time preference with a declining schedule over the very long run; two financial economists who think the right rate is the government's real borrowing cost or the shadow price of capital; one climate scientist; and one environmental economist who has publicly argued for a rate well below what the guidance permits. They care, in roughly this order, about defensibility to auditors and courts, about not handing the finance ministry numbers that look absurd, and about intergenerational fairness. They are not hostile, but they have very little patience for anything that cannot be turned into a number in a spreadsheet.

  My thesis, in brief. The pure rate of time preference should be set to zero: once expected growth in consumption has been counted separately through the ηg term, discounting a benefit merely because it falls later has no defensible ethical basis, and the common practice of reading a positive rate off market behaviour or off revealed impatience confuses a prediction with a prescription. What a positive rate does in practice should be done by two other terms: expected consumption growth, and the probability that there is anyone alive and able to benefit at the relevant date. My one novel claim is that the second term cannot be applied the way the field applies it, as a single unconditional survival probability multiplied into expected benefits. Hazards and payoff size are correlated — the warming a project averts may itself raise the hazard, while the prosperity that raises future benefit plausibly lowers it — so the unconditional shortcut is biased in a direction fixed by the sign of that correlation, and appraisal should discount within survival states rather than after taking expectations.

  Please draft my preparation sheet. Give me the seven or eight objections I will actually get from this panel, ordered by how likely they are and how much damage they would do, each phrased in the vocabulary these economists would use rather than in mine, each with a reply I could deliver in about ninety seconds and a note on where that reply is softest. Tell me what I should concede in the first five minutes, and which single reply has to land if the proposal is to survive the meeting. Include the question I am privately hoping nobody asks. One last requirement: mark the epistemic status of what you give me. Separate what is settled among people who actually work on social discounting from what is live controversy, and flag any place where my argument rests on a claim most specialists would reject, or on a quantity nobody has seriously estimated.
reasoning: |-
  Here's a thinking process that leads to the suggested preparation sheet:

  1.  **Analyze the User and Context:**
      *   **Speaker:** An economist or policy analyst advocating for a specific change in national cost-benefit analysis (CBA) guidance.
      *   **Audience:** A technical panel revising national guidance.
          *   5-6 Applied Public Economists (Ramsey rule users, current practice: small positive $\rho$, declining schedule).
          *   2 Financial Economists (Focus: gov borrowing cost, shadow price of capital).
          *   1 Climate Scientist.
          *   1 Environmental Economist (Advocate for very low rates).
      *   **Priorities:** 1. Defensibility (auditors/courts), 2. Plausibility (Finance Ministry), 3. Intergenerational Fairness.
      *   **Constraints:** 40-min paper, 1-hour Q&A. Low patience for non-quantifiable arguments.
      *   **Thesis:** $\rho = 0$ (Pure Time Preference). Discounting comes from consumption growth ($\eta g$) and existential risk/survival probability.
      *   **Novel Claim:** Survival probability shouldn't be an unconditional multiplier; it must be correlated with hazards and payoff size (state-dependent discounting).
      *   **Output:** Preparation sheet with 7-8 objections (ranked), replies (90 secs), soft spots, concessions, critical reply, the "feared question," and epistemic status markers.

  2.  **Deconstruct the Thesis & Identify Vulnerabilities:**
      *   *Claim 1: $\rho = 0$.* This is the Stern Review position. It's controversial among standard public economists who prefer a positive $\rho$ based on revealed preference or opportunity cost.
      *   *Claim 2: Discount via $\eta g$.* Standard Ramsey framing. Less controversial, but depends on $g$ forecasts.
      *   *Claim 3: Survival Probability as a Discount Factor.* This is the "existential risk" adjustment.
      *   *Claim 4 (Novel):* Correlation between hazards and payoffs (State-Dependent Survival). This is the most technically risky part. It implies non-linearities and complex modeling that auditors hate.

  3.  **Drafting the Objections (Iterative Process):**
      *   *Objection 1 (Financial/Public Econ):* Opportunity Cost of Capital. If $\rho=0$, the rate might be lower than the government borrowing rate. Finance Ministry will reject it. *Priority: High.*
      *   *Objection 2 (Public Econ/Auditor):* Operationalizability. How do we estimate state-dependent survival probabilities? It's too complex for a spreadsheet. *Priority: High.*
      *   *Objection 3 (Ethical/Standard):* Revealed Preference. People *do* discount the future. Why ignore market data? *Priority: Medium-High.*
      *   *Objection 4 (Climate/Env):* Double Counting. Does the climate model already account for catastrophic risk in the damage function? *Priority: Medium.*
      *   *Objection 5 (Ramsey Users):* The Ramsey Rule itself. If $\rho=0$ and $g$ is low/negative, the rate becomes negative. Is that allowed? *Priority: Medium.*
      *   *Objection 6 (Legal/Defensibility):* Precedent. Courts expect standard discounting. Deviating opens litigation risk. *Priority: High.*
      *   *Objection 7 (The Novel Claim):* Correlation Sign. How do you know the correlation sign? If you get it wrong, bias increases. *Priority: Medium-High.*

      *Refining for the Panel's Vocabulary:* Use terms like "Shadow Price of Capital (SPC)," "Ramsey Equation," "Revealed Preference," "Operational Burden," "Legal Defensibility," "Damage Functions."

  4.  **Developing Replies & Identifying Soft Spots:**
      *   Need to be concise (90 seconds).
      *   Need to acknowledge the constraint (auditors/Finance) while holding the line on ethics.
      *   *Soft Spot:* Usually where the theory meets the data (e.g., estimating the correlation).

  5.  **Determining Concessions:**
      *   Can't concede $\rho=0$ immediately (that's the thesis).
      *   Can concede on *implementation*. Maybe a hybrid approach or a sensitivity analysis.
      *   Must concede that the "state-dependent survival" is hard to quantify immediately.

  6.  **Identifying the "Must Land" Reply:**
      *   If the Financial Economists win on "Government Borrowing Rate," the $\rho=0$ argument dies. The reply must distinguish *social* time preference from *financial* opportunity cost.

  7.  **The "Feared Question":**
      *   What kills the proposal? Probably the practical implementation of the novel claim. "Show me the number." Or, "If $\rho=0$ and growth is negative, do we discount at a negative rate?"

  8.  **Epistemic Status:**
      *   Need to distinguish between:
          *   Consensus (Ramsey structure).
          *   Debate (Value of $\rho$).
          *   Speculative (State-dependent survival correlation).

  9.  **Drafting the Content (incorporating constraints):**
      *   *Tone:* Professional, precise, respectful of their time, acknowledging the "spreadsheet" constraint.
      *   *Structure:* Follow the prompt's requirements exactly.

      *(Self-Correction during drafting)*: Make sure I don't sound *too* philosophical. The prompt says they have little patience for non-spreadsheet arguments. The reply to ethical objections must be framed as "parameter consistency" rather than "moral philosophy."
      *(Refining the Novel Claim)*: The user's claim is about *correlation* between hazard and payoff. This is essentially a covariance term in the discount factor. I need to make sure the economists understand this as a covariance adjustment, not just a probability multiplier.

  10. **Final Review against constraints:**
      *   7-8 objections? Yes.
      *   Ranked by likelihood/damage? Yes.
      *   Vocabulary match? Yes (Ramsey, SPC, etc.).
      *   90-second replies? Yes (kept concise).
      *   Soft spots noted? Yes.
      *   Concessions? Yes.
      *   Critical reply? Yes.
      *   Feared question? Yes.
      *   Epistemic status? Yes.

  11. **Final Polish:** Ensure the distinction between the "Public Economists" (Ramsey) and "Financial Economists" (SPC) is clear in the objections. Ensure the "Auditor" concern is prominent.

  *(Self-Correction on Epistemic Status)*: Be honest. The $\rho=0$ is Stern vs. Nordhaus. The state-dependent survival is cutting edge/speculative. Label it clearly.

  12. **Constructing the Output.** (Proceeding to generate response based on these thoughts).
answer: |-
  # PREPARATION SHEET: National Cost–Benefit Guidance Revision
  **Topic:** Social Discount Rate (SDR) Structure & Existential Risk Adjustment
  **Audience:** Technical Panel (Public Econ, Financial Econ, Climate, Env Econ)
  **Time:** 40 min presentation + 60 min Q&A

  ---

  ## I. EPISTEMIC STATUS MARKER
  *Read this first to calibrate your confidence levels during Q&A.*

  1.  **$\rho = 0$ (Pure Time Preference):** *Live Controversy.* This is the Stern (2006) vs. Nordhaus/Weitzman divide. Public economists accept the *logic* but resist the *implication* (too high present value). It is ethically defensible but politically fragile.
  2.  **Ramsey Structure ($r = \rho + \eta g$):** *Settled.* The panel accepts this framework. Your battle is over the parameters, not the equation.
  3.  **Survival Probability as Discount Factor:** *Emerging Consensus.* Incorporating existential risk (Bostrom, Weitzman) is gaining traction, but usually as a scalar multiplier.
  4.  **State-Dependent Survival (Your Novel Claim):** *Speculative/Unestimated.* There is no standard literature on estimating the covariance between catastrophic hazard rates and marginal utility of consumption in a CBA context. **This is your highest risk area.** No specialist has a robust estimate for this correlation coefficient.

  ---

  ## II. THE EIGHT OBJECTIONS (Ranked by Likelihood & Damage)

  ### 1. The "Finance Ministry" Objection (Financial Economists)
  **Objection:** "If you set $\rho=0$ and assume low growth, your SDR falls below the government's real borrowing cost. This violates the Shadow Price of Capital (SPC) constraint. You are handing the Finance Minister a number that implies subsidizing projects with negative net returns relative to the fiscal baseline. How do you defend this to the Treasury?"
  **Reply (90s):** "I distinguish the *social* discount rate from the *financial* opportunity cost. The SPC applies to the displacement of private capital, which we handle via the shadow price multiplier on costs, not the discount rate on benefits. The discount rate reflects social valuation over time, not the government's marginal cost of funds. If we conflate the two, we implicitly value future generations' welfare less because the government pays higher interest today. We can satisfy the Treasury by applying the SPC adjustment to the *cost* side while keeping the *benefit* discount rate ethically consistent."
  **Soft Spot:** If the guidance requires a single "hurdle rate" for both costs and benefits, this distinction collapses.

  ### 2. The "Auditor's Nightmare" Objection (Public Economists)
  **Objection:** "Your novel claim requires estimating a covariance between hazard rates and consumption payoffs within a spreadsheet model. Current guidance uses a deterministic declining schedule. How do you operationalize state-dependent survival probabilities without introducing un-auditable model risk? Courts need reproducibility, not Bayesian conjectures."
  **Reply (90s):** "I propose a two-tier approach. For standard appraisals, we use a conservative unconditional survival scalar, as per current practice. For 'long-horizon' classifications (e.g., >100 years), we require a sensitivity analysis on the correlation coefficient. We do not need a precise point estimate to acknowledge the bias. We can publish a lookup table of adjustment factors based on plausible correlation signs (positive/negative) derived from climate-economy integrated assessment models, keeping the spreadsheet logic intact."
  **Soft Spot:** There are no published lookup tables for this. You are promising a deliverable that doesn't exist yet.

  ### 3. The "Revealed Preference" Objection (Public Economists)
  **Objection:** "Market data and household savings behavior reveal a positive rate of time preference. By setting $\rho=0$, you are overriding observed behavior with a normative assertion. Why should the state discount the future differently than the citizens it represents?"
  **Reply (90s):** "Revealed preference captures myopic constraints and mortality risk, not ethical weighting across generations. Individuals know they will die; the State is assumed to be immortal. Using individual impatience to discount benefits that accrue to *different* people (future generations) is an aggregation error. We use market rates to value private capital displacement, but we use ethical rates to value intergenerational welfare transfers."
  **Soft Spot:** Hard to defend if the panel views the government as merely an agent of current taxpayers.

  ### 4. The "Negative Discount Rate" Objection (Ramsey Users)
  **Objection:** "If $\rho=0$ and we face a period of negative consumption growth (climate contraction), the Ramsey equation yields a negative discount rate. This implies infinite present value for distant benefits. Are you prepared to sign off on negative rates in the guidance?"
  **Reply (90s):** "Negative rates are mathematically consistent with declining consumption paths. However, I recommend a floor. The guidance can specify that while $\rho=0$, the effective rate should not fall below zero in nominal terms to prevent divergence, or we cap the declining schedule. This acknowledges the logic without breaking the NPV calculation."
  **Soft Spot:** Capping the rate arbitrarily undermines the theoretical purity of your $\rho=0$ argument.

  ### 5. The "Double Counting" Objection (Climate Scientist)
  **Objection:** "Integrated Assessment Models (IAMs) already incorporate catastrophic risk in the damage function. If you add a survival probability discount, aren't you penalizing the project twice for the same climate risk?"
  **Reply (90s):** "Damage functions model economic loss *conditional* on survival. They rarely model the probability of systemic collapse where the numeraire ceases to exist. My adjustment is for the probability that the *economy* exists to enjoy the benefit, not the size of the benefit within that economy. They are orthogonal: one scales the payoff, the other scales the probability of the payoff occurring."
  **Soft Spot:** Many modern IAMs *do* blend these. You need to verify the specific models your guidance references.

  ### 6. The "Correlation Sign" Objection (Env Economist)
  **Objection:** "You argue hazards and payoffs are correlated. But if warming increases hazards, and adaptation reduces payoffs, the correlation is negative. If you get the sign wrong, you bias the appraisal in the wrong direction. Why not stick to the unbiased unconditional mean?"
  **Reply (90s):** "The unconditional mean is only unbiased if the variance is zero. In high-stakes climate adaptation, variance is the story. Even if we are uncertain of the sign, we can bound it. A 'precautionary' adjustment assumes the correlation worsens the outlook. It is more defensible to acknowledge a bounded bias than to pretend the covariance is zero."
  **Soft Spot:** Admitting uncertainty on the sign weakens the call for a specific methodological change.

  ### 7. The "Legal Defensibility" Objection (All)
  **Objection:** "Precedent relies on the Green Book (or equivalent) standard rates. Deviating to $\rho=0$ opens every major infrastructure decision to judicial review by opponents claiming the numbers are 'arbitrary.' Can you survive a court challenge?"
  **Reply (90s):** "The strongest legal defense is consistency with the stated ethical framework of the Act. If the Act mandates intergenerational equity, a positive $\rho$ is legally vulnerable as discriminatory against future citizens. We document the ethical derivation of $\rho=0$ in the guidance notes. Transparency on the ethical choice is more defensible than hiding it inside a market-derived rate."
  **Soft Spot:** Courts generally prefer precedent over novel ethical arguments.

  ### 8. The "Time Inconsistency" Objection (Financial Economists)
  **Objection:** "If we adopt a declining schedule based on $\rho=0$, future governments will have an incentive to re-optimize and raise the rate when they inherit the long-term liabilities. How do you lock this in?"
  **Reply (90s):** "We cannot bind future Parliaments. However, by separating the ethical parameter ($\rho$) from the forecast parameter ($g$), we make the cost of changing the rate visible. Raising $\rho$ becomes a visible ethical choice, not a technical update. This increases the political cost of time inconsistency."
  **Soft Spot:** This is a political argument, not an economic one. It offers no technical lock-in.

  ---

  ## III. STRATEGIC CONCESSIONS (First 5 Minutes)
  *State these early to disarm the Financial Economists and Auditors.*

  1.  **Concede Implementation Lag:** "I am not proposing we overhaul the spreadsheet templates tomorrow. I propose adopting $\rho=0$ as the *principle*, with a transition period where the declining schedule is calibrated to match current fiscal constraints until the new survival-probability modules are built."
  2.  **Concede the Shadow Price:** "I agree that the *cost* of capital must reflect the shadow price of private investment displacement. My argument applies strictly to the *social time preference* rate applied to consumption benefits."
  3.  **Concede Uncertainty on Correlation:** "I do not have a point estimate for the hazard-payoff covariance. I am arguing for the *structure* of the equation to allow for it, not for a specific number today."

  ---

  ## IV. THE "MUST LAND" REPLY
  *If this fails, the proposal dies.*

  **The Question:** "Why should we accept a lower discount rate that blows up the budget, based on an ethical claim we can't audit?"
  **The Reply:** "Because the alternative is mathematically equivalent to deciding that a life saved in 2100 is worth less than a life saved today, solely because of the date. We can handle budget constraints through project rationing and the shadow price of capital, but we cannot handle them by devaluing future welfare. If the budget breaks, it is because the projects are genuinely valuable, not because the rate is wrong. Do not use the discount rate as a hidden budget cap."
  **Why it must land:** It forces them to admit that a positive $\rho$ is a rationing tool, not a valuation tool. If they accept this, your ethical argument holds.

  ---

  ## V. THE QUESTION YOU HOPE NOBODY ASKS
  *"Can you show me a worked example where the state-dependent survival adjustment changes the Go/No-Go decision on a specific project, using real data?"*

  **Why it's dangerous:** You cannot. The data doesn't exist. If pressed, you must pivot to: "It changes the *ranking* of long-horizon projects relative to short-horizon ones, even if the binary decision remains stable in the short term. It corrects the systematic bias against adaptation."

  ---

  ## VI. TONE & DELIVERY NOTES
  *   **Vocabulary:** Use "Ramsey Equation," "Shadow Price of Capital," "Operationalizability," "Parameter Uncertainty," "Covariance Adjustment." Avoid "Moral Imperative," "Justice," "Philosophy."
  *   **Pacing:** Spend 10 minutes on $\rho=0$ (they know this debate). Spend 20 minutes on the Survival/Correlation claim (this is your value add). Spend 10 minutes on Implementation.
  *   **Visuals:** Show the Ramsey equation. Show the standard survival multiplier. Show *your* equation with the covariance term. Keep it on one slide. They need to see it fits in a cell.
  *   **Attitude:** You are a technician proposing a specification change, not a crusader proposing a revolution. Frame $\rho=0$ as "removing a double-count of growth" rather than "being nice to grandchildren."
