  I am writing the final exam for my upper-level seminar on rational choice and moral risk. The exam is 90 minutes; students will write one essay of approximately 800 words, marked out of 20. I want a question on expected-value fanaticism that cannot be answered by summarizing standard St. Petersburg-style objections or familiar existential-risk arguments. To force original analysis, the question should present an invented decision matrix—call it the "Astral Triage"—with three options: (A) a certain moderate welfare improvement for a known population of 10^6 beings; (B) a 0.001% chance of an astronomically large welfare improvement for 10^30 beings, with 99.999% chance of no change; and (C) a 0.002% chance of the same astronomical improvement, but with a 0.001% risk of catastrophic harm to the original 10^6. The prompt must ask students to (i) derive the pure expected-value ranking of A, B, and C; (ii) articulate precisely why this ranking is fanatical rather than merely surprising; and (iii) assess whether introducing a lexical structural constraint—absolute priority for avoiding catastrophic harm to actually existing beings—can block the fanatical result without collapsing into ordinary risk aversion or violating the independence axiom in an ad hoc way. Please provide: (1) the exam question itself; (2) a model answer of about 700 words; and (3) a marking scheme listing five specific analytical moves that a top answer must contain, with point allocations (summing to 20) and a brief note on the characteristic error that costs marks for each.
