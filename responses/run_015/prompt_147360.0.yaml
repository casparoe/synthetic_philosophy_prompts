answer: |-
  ### 1. Exam Question

  **Course:** PHIL 450: Rational Choice and Moral Risk
  **Exam:** Final Essay (90 Minutes)
  **Weight:** 20 Marks
  **Word Limit:** Approximately 800 words

  **Question: The Astral Triage**

  Consider the following decision matrix, "Astral Triage." You must choose one option affecting a known population of $10^6$ existing beings and a potential population of $10^{30}$ future beings. Utility is linear in welfare units (w).

  *   **Option A (Certainty):** A certain welfare increase of +10w for the $10^6$ existing beings. (Total EV: $10^7$w).
  *   **Option B (Lottery):** A 0.001% ($10^{-5}$) chance of +10w for the $10^{30}$ future beings; 99.999% chance of status quo. (Total EV: $10^{26}$w).
  *   **Option C (Risk):** A 0.002% ($2 \times 10^{-5}$) chance of +10w for the $10^{30}$ future beings; a 0.001% ($10^{-5}$) chance of catastrophic harm (-100w) to the $10^6$ existing beings; otherwise status quo. (Total EV: $\approx 2 \times 10^{26}$w).

  Write an essay addressing the following three points:

  1.  **Derive the Ranking:** Calculate the pure expected-value (EV) ranking of A, B, and C.
  2.  **Define Fanaticism:** Explain precisely why choosing the highest-EV option constitutes *expected-value fanaticism* rather than merely risk-neutral or surprising behavior.
  3.  **Assess Constraints:** Evaluate whether introducing a **lexical structural constraint** (absolute priority for avoiding catastrophic harm to actually existing beings) successfully blocks the fanatical result. Specifically, argue whether this constraint can be formulated without collapsing into ordinary risk aversion or violating the Independence Axiom in an *ad hoc* manner.

  ***

  ### 2. Model Answer

  **The Astral Triage: Fanaticism and Lexical Constraints**

  In the Astral Triage scenario, a pure expected-value (EV) maximizer must rank the options based on the sum of probability-weighted utilities. Option A yields a certain $10^6 \times 10 = 10^7$ welfare units. Option B yields an expected $10^{-5} \times (10^{30} \times 10) = 10^{26}$ units. Option C yields an expected gain of $(2 \times 10^{-5}) \times 10^{31} = 2 \times 10^{26}$ units, minus the expected harm of $(10^{-5}) \times (10^6 \times 100) = 10^3$ units. Since $10^3$ is negligible relative to $10^{26}$, the EV of C remains approximately $2 \times 10^{26}$. Consequently, the pure EV ranking is **C > B > A**. Option C is strictly dominant in expectation, despite offering a 99.998% chance of delivering nothing while risking harm to existing beings.

  Choosing C (or B over A) constitutes *expected-value fanaticism*, not merely risk-neutral aggregation. Standard risk neutrality accepts variance for higher means; fanaticism accepts *near-certain* mediocrity (or risk of loss) for an *infinitesimal* probability of vast value. The defining feature of fanaticism is the violation of intuitive dominance regarding probability magnitude. In Astral Triage, the probability of success in Option C is vanishingly small ($0.002\%$). A non-fanatical agent typically treats probabilities below a certain threshold as negligible or demands a non-linear discounting of extreme outliers. Fanaticism insists that any non-zero probability, no matter how small, lexically outweighs a certain moderate good if the stake is sufficiently high. It implies that the moral value of an outcome is separable from the likelihood of its realization to a degree that contradicts ordinary deliberative practice.

  To block this result, one might propose a lexical structural constraint: *Maximize EV subject to no non-zero risk of catastrophic harm to existing beings.* This immediately rules out Option C. If extended to prioritize existing beings' certain welfare over speculative future gains, it might also rule out B in favor of A. However, the viability of this constraint depends on its theoretical cost.

  First, this is not ordinary risk aversion. Risk aversion is modeled by a concave utility function (diminishing marginal value). However, because the welfare gap between $10^7$ and $10^{26}$ is astronomical, no plausible concave function can discount the larger sum enough to prefer A without implying that saving a single life is worth more than the existence of galaxies. A lexical constraint operates as a veto, not a discount. It treats the category "harm to existing beings" as qualitatively distinct from "foregone gains for potential beings."

  Second, does this violate the Independence Axiom? The Independence Axiom requires that if an agent prefers A to C, they must prefer a lottery $(p)A + (1-p)Z$ to $(p)C + (1-p)Z$ for any third option Z. A lexical constraint risks violating this if the constraint is act-dependent rather than outcome-dependent. If the veto applies only because C *is* a risky act, rather than because of the bad outcome itself, preferences may shift when mixed with other lotteries. For example, if Z involves a guaranteed catastrophe, the lexical constraint might become moot, reversing preferences in a way that violates Independence.

  However, the constraint need not be *ad hoc* if grounded in a specific moral ontology, such as a contractualist duty to existing agents that does not extend to merely possible beings. If the constraint is derived from the status of the beings (actual vs. potential) rather than arbitrarily inserted to fix the EV result, it functions as a domain restriction on the utility function rather than a violation of rational choice axioms within that domain. The cost is accepting that rational choice theory cannot be universally applied to all moral trade-offs; it requires a prior deontological filter. Thus, while the lexical constraint successfully blocks fanaticism, it does so by denying that EV maximization is the sole criterion of rationality, effectively bifurcating rational choice into "constrained optimization" rather than pure maximization. This preserves rational coherence but abandons the universality of the expected utility framework.

  ***

  ### 3. Marking Scheme

  **Total Marks: 20**

  | Analytical Move | Marks | Characteristic Error (Deduction) |
  | :--- | :---: | :--- |
  | **1. EV Derivation & Ranking**<br>Correctly calculates EV for A ($10^7$), B ($10^{26}$), and C ($\approx 2 \times 10^{26}$) and establishes the ranking C > B > A. | **4** | **Calculation/Ordering Error:** Misidentifying the dominance of C due to magnitude confusion (e.g., claiming harm outweighs gain) or ranking B > C incorrectly. (-4) |
  | **2. Defining Fanaticism**<br>Distinguishes fanaticism from risk neutrality by highlighting the acceptance of infinitesimal probabilities overriding certain moderate goods (probability insensitivity). | **4** | **Conflation:** Treating fanaticism as synonymous with high-stakes risk-taking or failing to mention the *magnitude of probability* vs. *magnitude of value* tension. (-2 to -4) |
  | **3. Lexical vs. Risk Aversion**<br>Explains that a lexical constraint acts as a veto/threshold, whereas risk aversion (concave utility) cannot mathematically bridge the astronomical gap between A and B/C. | **4** | **Mathematical Naivety:** Claiming standard risk aversion (concave utility) could easily prefer A over B without noting the scale of $10^{26}$ vs $10^7$. (-4) |
  | **4. Independence Axiom Analysis**<br>Identifies how lexical constraints risk violating Independence (e.g., via act-dependence or state-valuation) or argues why they might be framed as domain restrictions. | **4** | **Axiom Confusion:** Confusing Independence with Continuity, or asserting the constraint violates Independence without explaining the mechanism (e.g., mixing lotteries). (-2 to -4) |
  | **5. Assessment of Ad Hoc Charge**<br>Critically assesses whether the constraint is arbitrary. Top answers ground the constraint in moral ontology (actual vs. potential) to defend against the *ad hoc* charge. | **4** | **Uncritical Acceptance:** Simply stating the constraint works without addressing the theoretical cost (loss of universality) or dismissing the *ad hoc* worry without justification. (-2 to -4) |
