      Your editor's critique stings because it identifies a genuine slippage between your theoretical commitments and your rhetorical habits. You are trying to hold a materialist position (artefacts have power) within a constructivist framework (society shapes tech), and the seams are showing.

      The most severe tension is between (b) and (g). In (b), you argue for intrinsic politics: the bridge excludes buses regardless of intent. In (g), you propose the opposite-headlines test: if outcomes vary, the politics isn't in the thing. These are mutually exclusive. If the bridge has politics regardless of use, then the face-recognition software must also have politics regardless of whether it is used for liberation or surveillance. If you keep (g), you undermine your flagship example in (b). If you keep (b), you must discard (g) as a heuristic. Dropping (g) costs you a handy journalistic tool for spotting nuance, but keeping it invalidates your central thesis. I recommend sacrificing (g). It is a constructivist Trojan horse that dismantles your argument from within.

      The second tension, and the source of your editor's 'determinism' charge, lies between (a) and (f). You accept underdetermination in (a), yet in (f) you write causal history where the pill changes labour markets. This looks like determinism because you are attributing agency to the artefact in the historical narrative while denying it in the theoretical preamble. To fix this without becoming a hard determinist, you must qualify (f). The pill did not change the market; the pill, combined with specific social receptions and legal frameworks, changed the market. You lose rhetorical punch—the sentence becomes clunkier—but you retain theoretical consistency. You are not giving up the claim, just the shorthand.

      This brings us to your 'dormant politics' distinction in (c). You ask if this saves you or hands the victory to the constructivists. Unfortunately, it largely does the latter. By admitting politics requires 'activation conditions', you concede that the political charge is not inherent to the artefact alone but emerges from the relation between artefact and context. A bridge that excludes buses only does so because there are buses to exclude and authorities willing to enforce the route. If the social context changes, the 'politics' changes. This is precisely the constructivist position you claim to have moved beyond. The 'dormant' metaphor suggests the politics is waiting inside the concrete like a wire, but if it needs social activation to exist, it is not truly inside the concrete. Keeping this distinction allows you to talk about potentiality, but it validates your editor's suspicion that you are describing affordances (what tech allows) rather than inherent politics (what tech dictates).

      Finally, (d) and (e) regarding accountability are compatible with (a) but difficult to reconcile with (c). If politics is dormant and dependent on activation, holding designers responsible for downstream effects becomes harder. If the user or the regime activates the politics, why is the designer liable? You can maintain liability by arguing designers should anticipate activation conditions, but this circles back to your brother-in-law's complaint: you are expecting designers to predict social construction, which is arguably impossible.

      To minimise damage: Drop (g) immediately; it contradicts your core case study. Reframe (f) to emphasise socio-technical systems rather than lone artefacts. Be wary of (c); it sounds like a solution but actually admits that politics is relational, not intrinsic. If you want to avoid the 'determinism in a constructivist hat' label, you must acknowledge that the hat is mostly doing the work. The artefact isn't political; the arrangement of artefact and society is. You can still hold designers accountable for failing to anticipate that arrangement, but you cannot claim the bridge is political in a vacuum. This costs you the poetic simplicity of 'politics in the thing', but it saves your argument from collapsing under its own contradictions.

