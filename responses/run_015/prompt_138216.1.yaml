answer: |-
  Here is the specification you requested. I have organized the desiderata into **Epistemic Core** (properties of the measure itself), **Operational Constraints** (properties required for your platform's mechanics), and **Aggregation & Ranking** (properties required for the leaderboard). Following the list, I detail the incompatibilities and identify the non-negotiables.

  ### I. The Desiderata Specification

  #### Epistemic Core
  **1. Strict Propriety (Incentive Compatibility)**
  *   **Definition:** A forecaster minimizes their expected inaccuracy (relative to their own credences) if and only if they report their true credences.
  *   **Consideration:** You identified this as potentially "practical," but for your triple-use case (rank, pay, train), it is epistemically foundational. If the measure is not strictly proper, your model forecasters will optimize for the score rather than the truth (Goodhart's Law), and human forecasters will hedge strategically rather than epistemically.
  *   **Status:** **Non-Negotiable.** Without this, the number ceases to measure belief accuracy and begins to measure gaming ability.

  **2. Truth-Directedness (Alethic Sensitivity)**
  *   **Definition:** If outcome $A$ occurs, a report of $p(A)=1$ must yield lower inaccuracy than $p(A)=0.9$, which must be lower than $p(A)=0.6$.
  *   **Consideration:** This ensures the measure tracks closeness to truth. It addresses your concern about the 0.99 vs. 0.6 penalty. A measure must penalize error monotonically as confidence in the false outcome increases.
  *   **Status:** **Non-Negotiable.**

  **3. Locality**
  *   **Definition:** The inaccuracy score for a proposition $A$ depends only on the probability assigned to $A$ and the truth value of $A$, not on probabilities assigned to other propositions in the partition.
  *   **Consideration:** This simplifies aggregation. However, it conflicts with your desire to penalize *incoherence* (e.g., $P(A) + P(\neg A) \neq 1$). A local measure scores the reports as given; it does not "see" the logical relation between questions unless you enforce coherence before scoring.
  *   **Status:** **Desirable but Flexible.** Dropping locality allows you to penalize incoherence directly but complicates the math and incentives.

  #### Operational Constraints
  **4. Boundedness**
  *   **Definition:** The inaccuracy measure has a finite maximum value (worst possible score) for any single question.
  *   **Consideration:** This is the primary defense against "ruin." In the Log score, a confident error ($p=0.99$, False) yields massive inaccuracy. In a cumulative ranking, one catastrophic error can permanently disqualify a forecaster who is otherwise excellent. Boundedness ensures the signal-to-noise ratio remains stable over time.
  *   **Status:** **Strongly Recommended for Payouts/Ranking.** (Optional for internal model training if you can clip gradients).

  **5. Resolution Sensitivity (Information Reward)**
  *   **Definition:** Given two accurate forecasters, the one who issues sharper probabilities (further from the base rate) should achieve lower expected inaccuracy.
  *   **Consideration:** This addresses the "always 0.5" concern. A proper score ensures that if a forecaster *has* information, they are incentivized to move off 0.5. However, if they *lack* information, 0.5 is the rational optimum. The measure cannot force them off 0.5 without violating propriety.
  *   **Status:** **Required Feature of Proper Scores.**

  **6. Robustness to Non-Resolution**
  *   **Definition:** The measure (or the protocol surrounding it) must define a neutral score for conditional forecasts where the antecedent fails or questions that remain ambiguous.
  *   **Consideration:** Epistemic utility is undefined if the world does not provide a truth value. This is not a property of the function $S(p, \omega)$ but of the domain. You must assign a "void" score (typically the score equivalent to the base rate or 0.5) to prevent forecasters from being punished for events outside their control.
  *   **Status:** **Protocol Requirement.**

  #### Aggregation & Ranking
  **7. Additivity (Separability)**
  *   **Definition:** The total inaccuracy for a set of questions is the sum (or weighted sum) of the inaccuracies for individual questions.
  *   **Consideration:** Required to aggregate across different subsets of questions answered by different forecasters. It assumes questions are epistemically independent for the purpose of scoring.
  *   **Status:** **Non-Negotiable for Leaderboards.**

  **8. Partition Comparability**
  *   **Definition:** Scores should be comparable even if different tournaments carve outcome spaces at different levels of fineness (e.g., "Candidate X wins" vs. "Candidate X wins with >50% vote").
  *   **Consideration:** Proper scoring rules are *not* partition-independent; they reward specificity. A forecaster predicting the finer partition has more opportunity to gain/lose points. To compare them, you must normalize against a baseline (see below).
  *   **Status:** **Requires Normalization.**

  ---

  ### II. Incompatibilities and Trade-Offs

  You suspected some desiderata cannot be jointly satisfied. You are correct. Here are the specific tensions:

  **1. Boundedness vs. Tail Sensitivity (The Log vs. Brier Trade-off)**
  *   **Conflict:** You cannot have a strictly proper score that is both bounded and infinitely sensitive to extreme confidence.
  *   **Reason:** To strictly incentivize reporting $p=0.999$ over $p=0.99$ when right, the penalty for being wrong must scale asymptotically (Log Score). If you cap the penalty (Brier Score), the incentive to move from 0.99 to 0.999 diminishes.
  *   **Impact:** **Boundedness knocks out the Log Score.** If you prioritize protecting forecasters from ruinous variance (essential for human retention and stable payouts), you must accept lower sensitivity to extreme tail events.

  **2. Locality vs. Coherence Penalization**
  *   **Conflict:** A local scoring rule (standard Brier/Log) cannot penalize a set of credences that are jointly incoherent (e.g., Dutch Bookable) if each individual credence is well-calibrated.
  *   **Reason:** Locality dictates $S(p, \omega)$ looks only at $p$ and $\omega$. It does not see $q$ or the logical relation between $p$ and $q$.
  *   **Impact:** To penalize incoherence, you must violate Locality by adding a global penalty term. **This is the only way to satisfy your desire to "have something to say" about incoherence.**

  **3. Propriety vs. The "Always 0.5" Constraint**
  *   **Conflict:** You stated: *"A forecaster who never leaves 0.5... should not be able to win."* Strict propriety dictates that if a forecaster has *no* information, 0.5 is the optimal report. If the questions are genuinely hard, the 0.5 forecaster *should* win on raw accuracy.
  *   **Resolution:** This is not a flaw in the measure, but in the **ranking metric**. You cannot solve this with the scoring rule alone without breaking propriety.
  *   **Requirement:** You must use a **Skill Score** (e.g., Brier Skill Score).
      $$ \text{Skill} = 1 - \frac{\text{Forecaster Inaccuracy}}{\text{Baseline Inaccuracy}} $$
      Where the Baseline is a reference forecaster (e.g., always 0.5 or a simple model). This ensures a 0.5 forecaster gets a score of 0, and only those beating the baseline win. **This satisfies your constraint without violating epistemic propriety.**

  **4. Partition Sensitivity vs. Cross-Tournament Comparability**
  *   **Conflict:** Proper scores reward fineness (specificity). A forecaster predicting a 10-outcome partition has a different maximum possible score than one predicting a 2-outcome partition.
  *   **Reason:** Information content differs.
  *   **Impact:** You cannot have a measure that is both Proper (rewards specificity) and Partition-Independent (ignores fineness). You must choose Properness and use **Skill Scores** to normalize across different tournament structures.

  ---

  ### III. The Non-Negotiables

  Given your triple mandate (Rank, Pay, Train), these are the filters:

  1.  **Strict Propriety:** If the measure is not proper, your model training will diverge from truth, and human payouts will reward gaming. **This knocks out all non-proper rules (e.g., Absolute Error).**
  2.  **Additivity:** You cannot rank forecasters who answered different questions without this.
  3.  **Boundedness (for Payouts/Rank):** For a public leaderboard with prizes, unbounded variance (Log) is operationally risky. One "black swan" error shouldn't erase a year of signal. **This knocks out the Log Score for public use.**

  **The Single Requirement that Knocks Out the Most Candidates:**
  **Strict Propriety.**
  There are many ways to measure error (Absolute Error, Directional Accuracy, etc.), but almost all fail strict propriety. They incentivize forecasters to report 0 or 1 regardless of belief, or to hedge toward 0.5. Once you enforce Propriety, you are left with the class of proper scoring rules (Log, Brier, Spherical, Power, etc.).
  **The Second Filter:** **Boundedness.** This eliminates Log and leaves Brier, Spherical, and Quadratic variants.

  ---

  ### IV. Rule Summaries

  **Brier Score (Quadratic)**
  *   **Formula:** $(p - o)^2$ (Inaccuracy version).
  *   **Pros:** Bounded [0, 1]. Intuitive (MSE). Robust to outliers. Satisfies Propriety.
  *   **Cons:** Less sensitive to extreme confidence than Log. A forecaster saying 0.99 vs 0.90 is not heavily differentiated if both are right.
  *   **Verdict:** **Best for Public Leaderboard & Payouts.** It balances incentive with risk management.

  **Log Score (Logarithmic)**
  *   **Formula:** $-\ln(p)$ if true, $-\ln(1-p)$ if false.
  *   **Pros:** Maximally sensitive to tail events. Unique information-theoretic justification (entropy).
  *   **Cons:** Unbounded. A single $p=0.99$ error creates a massive penalty that can dominate a track record. High variance makes ranking noisy.
  *   **Verdict:** **Best for Internal Model Training (with clipping).** Use this to train your models if you can clip gradients, as it pushes for sharper probabilities. Do not use for human payouts.

  **Spherical Score**
  *   **Formula:** $1 - \frac{p}{\sqrt{p^2 + (1-p)^2}}$.
  *   **Pros:** Proper and Bounded. Intermediate sensitivity between Brier and Log.
  *   **Cons:** Less intuitive interpretation than Brier. Computationally slightly heavier (negligible).
  *   **Verdict:** **Strong Alternative.** If you find Brier too "gentle" on confident errors but Log too "cruel," Spherical is the mathematical compromise.

  ### V. Final Recommendation

  Do not look for a single epistemic measure to solve an operational problem. Use a **Two-Tier System**:

  1.  **For Training (Models):** Use **Log Loss** (with gradient clipping). You want the models to be as sensitive as possible to tail risk. The "unbounded" nature is a feature here, provided the optimization doesn't explode.
  2.  **For Ranking & Payouts (Humans & Models):** Use the **Brier Score**, normalized as a **Brier Skill Score** against a baseline (e.g., 0.5 or a simple logistic model).
      *   This satisfies **Propriety** (honest reporting).
      *   This satisfies **Boundedness** (no ruinous errors).
      *   This satisfies the **"No 0.5 Winners"** constraint (via the Skill Score baseline).
      *   To address **Incoherence**, add a separate "Coherence Penalty" to the final leaderboard score if $P(A) + P(\neg A)$ deviates from 1 by more than a threshold $\epsilon$. Do not bake this into the per-question scoring rule, or you break Locality and complicate the incentives.

  This specification separates the *epistemic measurement* (Brier) from the *competitive framing* (Skill Score) and the *operational safety* (Boundedness), resolving the conflicts you identified.
