prompt: |-
  Write a satirical, deadpan Frequently Asked Questions document of approximately 600 words, modelled on the formal prose of a British government agency circular, for a fictional Department of Phenomenal Transparency that administers "Consciousness Audit Certification" according to strong illusionist principles. The target of the satire is the illusionist claim that phenomenal consciousness does not exist as an intrinsic property and that introspection systematically misrepresents mere cognitive accessibility as qualitative feel; the exaggeration should remain fair to the actual philosophical position rather than constructing a straw man. To keep the prompt substantive without relying on obscure specialised literature, inject the following niche administrative concept: applicants must declare their "phenomenal debt," divided into two graded categories—"weak misattribution" (where a subject erroneously represents access-consciousness as possessing phenomenal character) and "strong phenomenal bankruptcy" (where no qualitative properties are present whatsoever)—and must complete a "Gradient Introspection Scale" that assigns numerical scores to reported subjective experiences for correction via standardised form PT-7. The document should contain at least three numbered sections (for example: Eligibility and Declaration, Assessment Procedure, and Appeals and Corrections) and maintain an internally consistent bureaucratic voice in which staff treat the absence of phenomenal properties as an unremarkable administrative fact, while treating citizens' first-person reports of subjective experience as correctable data-entry errors. The humour should arise from pushing real illusionist arguments—the persistence of the illusion despite philosophical correction, the reduction of "what it is like" talk to misdescribed functional access, and the awkwardness of maintaining that nothing is being eliminated—into mundane bureaucratic logic. Ensure the piece is readable to someone without prior knowledge of the debate, yet precise enough that a specialist recognises the underlying distinctions being satirised. Write entirely in British English, avoid any request for citations or bibliographies, and do not include verbatim quotations from real philosophical texts.
