answer: |-
  **JOINT STATEMENT ON THE CAREENIUM–SIMMBALLS SET-UP**

  **Section 1 — Agreed claims**

  Both the Substrate exclusivists and the Symbol autonomists endorse the following substantive claims regarding the careenium tank and its dynamics. Neither camp treats these claims as trivial; each regards them as necessary constraints on any acceptable theory of the system.

  1.  **Microphysical Completeness:** The microdynamics of the simmballs and the careenium are causally complete and deterministic. Fixing the exact microstate at one time settles the state at every later time. There is no fundamental indeterminacy, no non-physical force, and no creation of energy or momentum.
  2.  **Supervenience:** The legible pattern supervenes on the microstate. There is no occurrence of a pattern without a specific realisation of pips, positions, and velocities (Stipulation 1). A change in pattern necessitates a change in microstate, though not vice versa.
  3.  **Pattern Invariance:** The pattern-level law is invariant under micro-variation. Holding the pattern fixed while wiggling the microstate within its realisation class leaves the coarse-grained outcome unchanged. Changing the pattern changes the outcome as the rule predicts (Stipulation 2).
  4.  **Nomological Sufficiency:** The microstate at time *t* is nomologically sufficient for the microstate at *t+1*. Consequently, in terms of physical necessity, the microstate screens off the pattern from the outcome; once the microstate is fixed, the pattern adds no further physical constraint.
  5.  **Empirical Adequacy:** Both the micro-description and the pattern-description are empirically adequate for predicting outcomes within their respective grains. Neither description yields false predictions within its domain of applicability.
  6.  **Explanatory Burden:** Any account must explain why the Scrambled Twin (Stipulation 3), possessing identical energy and micro-laws but no legible pattern, fails to shove the target reliably. The correlation between legibility and outcome is a fact requiring explanation by both camps.

  **Section 2 — Disagreements table**

  The following table catalogues the residual substantive disagreements. Each formulation is written such that a proponent of that camp would endorse it as a statement of their own view.

  | Crux | Substrate Formulation | Symbol Formulation | Shared Test / Case | Predictions | Falsification Conditions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Nature of Cause** | Cause is production: it requires the transfer of a conserved quantity (energy/momentum) from cause to effect. | Cause is difference-making: it requires robust counterfactual dependence of the effect on the variable in question. | **Energy Budget Analysis:** Measure energy transfer from simmballs vs. pattern information during the shove. | **Sub:** Energy flows from micro-states only. **Sym:** Information constrains energy flow. | **Sub:** If energy flows from 'pattern' independently. **Sym:** If outcome is independent of pattern changes. |
  | **Decisive Test** | Screening-off is decisive. If *A* screens off *B* from *E*, *B* is not a cause of *E*. | Invariance is decisive. If *B* supports intervention while *A* is held fixed (coarse-grained), *B* is a cause. | **Realisation-Class Intervention:** Wiggle microstate within class (Stip 1) while monitoring outcome. | **Sub:** Micro-wiggles confirm micro-causality. **Sym:** Invariance confirms pattern-causality. | **Sub:** If micro-wiggles change outcome. **Sym:** If pattern changes fail to alter outcome. |
  | **Counterfactuals** | In a deterministic setting, counterfactuals must respect micro-laws. One cannot change the pattern without changing the micro-state. | Special science counterfactuals hold the pattern fixed while allowing micro-realisation to vary (Stipulation 2). | **Scrambled Twin Comparison:** Compare actual tank to Twin (Stip 3) to evaluate "if pattern were absent". | **Sub:** Twin differs microscopically; comparison is invalid for pattern causation. **Sym:** Twin isolates pattern variable. | **Sub:** If Twin shoves identically. **Sym:** If Twin shoves identically. |
  | **Scrambled Twin** | Shows that micro-configuration, not legibility, determines the shove. The Twin lacks the specific micro-arrangement required. | Shows that legibility is necessary for the shove. The Twin lacks the pattern, hence lacks the causal power. | **Twin Outcome:** Observe the target behaviour in the Scrambled Twin tank. | **Sub:** Erratic shove proves micro-insufficiency of scrambled state. **Sym:** Erratic shove proves pattern necessity. | **Both:** If Twin shoves identically to original. |
  | **Re-encoding Drift** | Shows only that different micro-states can cause similar outcomes. Causal continuity is an illusion of coarse-graining. | Shows that pattern continuity sustains causal continuity despite micro-discontinuity (Stipulation 4). | **Drift Monitoring:** Track target behaviour during micro-state replacement (Stipulation 4). | **Sub:** Micro-causes chain together seamlessly. **Sym:** Pattern persists as causal agent. | **Sub:** If target behaviour jumps. **Sym:** If target behaviour jumps. |
  | **Causal Discovery** | Algorithms given micro-variables will find the complete causal graph. Pattern variables are redundant composites. | Algorithms given pattern variables will find a simpler, invariant graph. Micro-variables are too noisy cryptic. | **Algorithmic Test:** Run causal discovery on micro-data vs. pattern-data. | **Sub:** Micro-graph is the true structure. **Sym:** Pattern-graph is the usable structure. | **Sub:** If micro-graph fails prediction. **Sym:** If pattern-graph fails prediction. |
  | **Pushing** | "Pushing" requires the transfer of something conserved. Patterns transfer nothing; simmballs push. | "Pushing" requires directing force. Patterns direct force; simmballs supply it. | **Conservation Check:** Verify total momentum before and after the shove. | **Sub:** Momentum conserved via simmballs. **Sym:** Momentum conserved via simmballs. | **Both:** If momentum is not conserved. |

  **Section 3 — What is merely verbal**

  Both camps acknowledge that a significant portion of the residual dispute turns on the definition of terms rather than the physical facts of the careenium set-up. Specifically, we agree that the disagreement over whether the pattern *causes* the shove is verbal in the following precise sense: both camps agree on the complete physical history of the tank, the supervenience of the pattern on the microstate, the determinism of the micro-laws, and the counterfactual dependencies between pattern-changes and outcome-changes.

  Where we diverge is solely on whether the word "cause" (and the metaphor "pushing") should be reserved for the transfer of conserved quantities at the micro-level (Substrate) or extended to include invariant difference-making relations at the coarse-grained level (Symbol). Neither side can prove the other wrong without stipulating a definition of "cause" that begs the question. If "cause" means "micro-sufficient condition", Substrate wins by definition. If "cause" means "intervention-ready variable", Symbol wins by definition.

  We further agree that the dispute over whether the pattern is "merely a way of picking out which microstate happened to be there" is verbal. Both camps agree the pattern *is* a way of picking out microstates (Stipulation 1). The Substrate camp adds "merely" to imply causal inertness; the Symbol camp removes "merely" to imply causal efficacy. Since both agree on the physical relations described in Section 1, this disagreement is taxonomic. We sign this statement to record that while our physical models of the tank are compatible, our linguistic frameworks for describing causal attribution remain distinct.
