      *   *Goodman's Solution:* Entrenchment. "Green" is better entrenched (used more in past successful projections) than "grue."
      *   *Settled:* The riddle successfully demonstrates that syntactic form + observational data is insufficient for confirmation. Induction requires a constraint on projectibility.
