  hey, so i heard this summary on a podcast about why big moral norms flip, like dueling or slavery. the host said appiah and williams basically agree that arguments almost never cause these shifts—its always either economic self-interest or social honor getting redefined. he said appiah proved dueling died because it stopped being honorable, not because anyone convinced people it was wrong, and williams showed slavery ended when the elite realized it hurt their profits, not because abolitionists won debates. then he mashed them into this idea he called "moral deadweight loss," where a norm hangs around just because breaking it first is too costly, even if everyone secretly hates it. he concluded that moral reasoning is just decoration on power and status moves. is that a fair take? i feel like saying arguments never matter is too strong, but i don't know enough to call out where he's smoothing things over. can you separate what's actually accurate, what's a common misreading, and whether that "deadweight" concept is real or just his invention?
