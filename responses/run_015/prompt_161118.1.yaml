answer: |-
  This is a precise and rigorous formulation of a problem that often lurks vaguely in discussions of negative utilitarianism and hedonism. You have identified a structural flaw in **Atomistic Negative Hedonism**. By framing it as a Markovian scoring function, you have isolated the failure mode: the axiology is **Path-Independent**, but the phenomenology of well-being is **Path-Dependent**.

  Here is the carving you requested.

  ### 1. The Phenomenon and Its Distinctions

  **The Name:** The failure mode is **Axiological Atomism** (the belief that value resides entirely in discrete time-slices) colliding with **Phenomenological Hysteresis** (the reality that the qualitative character of a mental state depends on its causal history).

  **What it is:** It is the inability of a state-function to capture the *intentional structure of absence*. In your model, "no craving" is a null value ($0$). In phenomenology, "no craving" is a vector that has a magnitude and a direction based on how it got there. The silence after a symphony is not the same silence as the silence of an empty hall, even if the decibel level is identical.

  **What it is not:**

  *   **It is not the Experience Machine (Nozick):** Nozick's objection is about *contact with reality*. You have explicitly bracketed reality ("nothing outside the agent's experience... contributes"). Your objection is internal to the experience itself: two internally identical states (or seemingly identical ones) have different values because of their *temporal context*.
  *   **It is not Hedonic Adaptation:** Adaptation is about the *shifting baseline* of what causes craving (getting used to luxury). Your problem is about the *ontology of the baseline itself*. You are asking whether the zero-point is uniform. Adaptation says "I stop wanting the car." You are asking "Does 'stopped wanting because I have it' differ from 'stopped wanting because I forgot'?"
  *   **It is not the Buddhist Soteriological Claim:** You are right to distrust the identification. Popular Buddhism says "craving is bad, stop craving." That is normative. However, **Abhidharma psychology** (the descriptive metaphysics of Buddhism) makes exactly your distinction: it differentiates *Vikkhambhana* (suppression of craving, which is unstable) from *Samuccheda* (eradication of craving, which is stable). They treat these as ontologically distinct mental factors, not just different routes to the same state. Your view collapses them; their view would not.

  **Nearest Fit:** The closest existing concept is **Global Hedonism** (evaluating the shape of a life) vs. **Local Hedonism** (evaluating moments). But even Global Hedonism usually sums local values. Your critique is deeper: the local value *itself* is misidentified because it ignores the immediate past.

  ### 2. The Repair: History-Dependence and Hysteresis

  **The Repair:** Yes, the function must become history-dependent. You need a **Hysteresis Term**.
  $$V(t) = -(\text{Craving}_t + \text{Suffering}_t) + H(\text{Trajectory}_{t-\Delta t \to t})$$
  Where $H$ assigns value to the *dynamic* of the craving (e.g., resolution > suppression > ignorance).

  **The Cost:**
  1.  **Violation of Pure Experientialism:** If the value of moment $t$ depends on the history of $t-1$, then value is not located purely in the *current experience*. It is located in the *relation* between experiences. This undermines the claim that "only things intrinsically bad... are craving and suffering." It implies that *narrative coherence* or *causal efficacy* is intrinsically valuable.
  2.  **Retroactive Badness:** It does not make past suffering worse, but it makes present tranquility *contingent* on past suffering. A life with no suffering ever (the "sheltered life") might score lower than a life with suffering that was resolved, if "resolution" carries a bonus. This inverts Negative Utilitarianism.
  3.  **The Back Door of Satisfaction:** You asked if this re-admits satisfaction-of-desire. **Yes.** If "resolved craving" (I wanted $X$, I got $X$, now I don't want $X$) scores higher than "abandoned craving" (I wanted $X$, I forgot $X$, now I don't want $X$), you have implicitly valued the *truth-maker* of the desire. You have valued the *fit* between mind and world, even if you claim you only value the absence of the pull. You are rewarding the *success* of the craving, not just its cessation.

  ### 3. The Edges: Sleep, Coma, and Absorption

  **The Reductio (Non-Existence):**
  If the score is $-\int (\text{Bad})$, and the minimum bad is 0, then a stone, a corpse, or a non-existent being scores the maximum possible (0).
  *   **Is this a reductio?** For Negative Hedonism, this is the standard "Grave Objection." Most proponents bite the bullet: non-existence is indeed preferable to a life of net suffering, and a life of pure zero is no better than non-existence.
  *   **Does your distinction survive?** Yes. Even if you accept non-existence is "perfect," you still have to distinguish between a living human in "zero state" A (absorption) and "zero state" B (numbness). If the theory cannot distinguish them, it cannot guide a living agent.

  **The Absorbed Worker:**
  Your function scores absorption as 0 (no craving). You feel it should be positive.
  *   **Diagnosis:** This suggests your definition of "craving" is too narrow, or your "nothing is intrinsically good" axiom is false. Absorption (Flow) is often characterized not by the *absence* of motivation, but by the *identity* of actor and action. There is no "pull toward something not yet had" because the having is continuous.
  *   **Verdict:** If you maintain "nothing is intrinsically good except absence," you must classify absorption as merely "not bad." If you admit it feels *better* than mere absence (e.g., sleep), you must add a **Positive Engagement Term**. This breaks your original view but saves the phenomenology.

  **The Sheltered Life:**
  A person with few cravings because they were never allowed to form (lobotomy, strict upbringing, isolation).
  *   **Verdict:** Your current function scores this as excellent (low integral of craving). This is the **"Philosopher's Stone" objection**. A rock has no craving; is a rock's life better than a human's? If you add the Hysteresis Term (valuing resolution over absence), the sheltered life scores *lower* than the striving life, because it lacks the "resolution" bonus. This repairs the intuition but, as noted above, smuggles in the value of striving/satisfaction.

  ### 4. Coining the Concept: **Phenomenological Hysteresis**

  Since no single existing term captures the specific axiological blindness you describe, I propose we define this failure mode as **The Fallacy of Static Neutrality**.

  **Definition:** The Fallacy of Static Neutrality is the error of assuming that the axiological value of a neutral state (the absence of a negative) is invariant, regardless of the dynamic process that produced the neutrality.

  **The Carving (Boundary Cases):**
  To determine if a specific instance falls under this phenomenon, apply the **Counterfactual History Test**:

  1.  **The Case:** A subject $S$ is in state $Z$ (zero craving/suffering) at time $t$.
  2.  **The Manipulation:** Construct two counterfactual histories for $S$:
      *   $H_1$ (Resolution): $S$ had craving $C$, satisfied $C$, now is in $Z$.
      *   $H_2$ (Suppression): $S$ had craving $C$, suppressed/ignored $C$, now is in $Z$.
      *   $H_3$ (Vacuity): $S$ never had craving $C$, is in $Z$.
  3.  **The Test:** If the intuitive well-being value of $S$ at $t$ differs across $H_1, H_2, H_3$, then the phenomenon is present.
  4.  **The Boundary:**
      *   **Falls under the concept:** If the theory assigns $V(Z|H_1) = V(Z|H_2) = V(Z|H_3)$. (Your current view fails here).
      *   **Does not fall under the concept:** If the theory acknowledges $V(Z|H_1) > V(Z|H_2) > V(Z|H_3)$ (or any non-equal ranking).

  **Application to your cases:**
  *   **Absorption:** Fails the test. Absorption is not $Z$ (neutrality); it is $P$ (positive engagement). Your theory collapses $P$ into $Z$. This is a sub-species of the fallacy: **The Collapse of Vitality into Nullity**.
  *   **Residue:** The "objectless tension" after a project is a negative value ($-S$) that your theory misses because it isn't "craving" (pull toward object) or "suffering" (pain). It is **Phantom Intentionality**. Your theory treats it as 0. It is actually $<0$.

  ### Summary of the Measurement Worry

  You asked if the measurement bias (craving commands attention) is a defect in the view or access.
  It is a defect in the **Epistemology of the View**, which reinforces the **Ontological Error**.
  Because craving is salient, you model well-being as the removal of salience. But **salience is not value**.
  *   **High Salience Negative:** Pain/Craving.
  *   **Low Salience Positive:** Health/Flow/Security.
  *   **Low Salience Negative:** Depression/Numbness/Residue.

  Your function conflates *Low Salience Positive* with *Low Salience Negative* because both look like "quiet" from the perspective of a craving-centered metric. This is **Salience Bias masquerading as Axiology**.

  ### Conclusion

  Your view is a **Markovian Negative Hedonism**.
  The failure mode is **Path-Dependence Blindness** (specifically, the inability to distinguish resolution from suppression).
  The repair requires **Hysteresis**, which costs you the purity of "only absence is good" by implicitly valuing the *history of satisfaction*.
  The absorption case suggests you actually need a **Positive Term** (Vitality/Engagement), which contradicts your foundational axiom.

  The most honest repair is to admit that **Tranquility is not a scalar zero; it is a vector.** It has direction (toward growth or toward decay) determined by its past. A measure that cannot read the vector is blind to the life it claims to value.
