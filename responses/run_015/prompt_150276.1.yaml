answer: |-
  ### Exam Question

  **Course:** PHI 450: Advanced Philosophy of Mind
  **Time Allowed:** 90 Minutes
  **Total Marks:** 25

  **Essay Question:**

  Epiphenomenalism posits that phenomenal properties (qualia) are causally inert byproducts of physical processes. This view generates the **Paradox of Phenomenal Judgment**: if qualia cannot cause physical events, they cannot cause the belief that one has them.

  Critically explain why the causal inertness of phenomenal properties undermines the reliability of first-person phenomenal judgments. In your analysis, assess whether this paradox can be dissolved without abandoning epiphenomenalism by appealing to the distinction between **access-consciousness** and **phenomenal-consciousness**. You must explicitly confront the hypothetical case of the **"phenomenal-zombie reporter"**: a physically identical system that lacks qualia yet produces indistinguishable introspective reports. Conclude by addressing the crux of the problem: the epistemic circularity of using physically caused judgments to justify claims about causally isolated properties.

  ***

  ### Model Answer

  The Paradox of Phenomenal Judgment strikes at the epistemic heart of epiphenomenalism. If epiphenomenalism is true, phenomenal properties (P-consciousness) are causally inert; they are effects of physical brain states but cause nothing in return, including physical behaviors or belief states. The paradox arises because we claim to *know* we have qualia. Standard theories of knowledge require that a belief be causally connected to the fact that makes it true, or at least produced by a reliable mechanism tracking that fact. If my belief "I am in pain" is caused entirely by C-fiber firing (the physical base) and not the pain itself (the qualia), then the pain is explanatorily redundant.

  This causal inertness undermines reliability because it severs the counterfactual dependence between the property and the judgment. For a judgment to be reliable, the presence of the property should increase the likelihood of the judgment, or its absence should decrease it. However, under epiphenomenalism, the physical base is sufficient for the judgment. This is best illustrated by the "phenomenal-zombie reporter." A zombie is a physical duplicate of a conscious being but lacks qualia. If physicalism about behavior is maintained (as epiphenomenalism requires), the zombie's physical brain state is identical to the conscious subject's. Consequently, the zombie will produce the exact same introspective report: "I am in pain."

  Since the zombie produces the report without the qualia, the report does not track the presence of qualia. The physical state causes the report in both the conscious subject and the zombie. Therefore, from the perspective of the subject, the belief "I have qualia" is generated by a mechanism that would produce the same belief even if qualia were absent. This renders the belief unjustified, as the subject cannot distinguish their situation from the zombie's situation using the very cognitive faculties generated by the physical brain.

  Proponents of epiphenomenalism often appeal to the distinction between access-consciousness (A-consciousness) and phenomenal-consciousness (P-consciousness) to dissolve this paradox. A-consciousness refers to information that is available for reasoning and report, while P-consciousness refers to the raw experiential feel. The argument suggests that when we make phenomenal judgments, we are actually reporting on A-consciousness (the functional availability of information), which is causally potent, while P-consciousness merely accompanies it.

  However, this appeal fails to dissolve the paradox without abandoning the core epistemic claim of epiphenomenalism. If we admit that our judgments track only A-consciousness, we concede that we have no direct epistemic access to P-consciousness. We can justify the belief "I have access to pain information," but not "I have the feeling of pain." The zombie reporter has A-consciousness without P-consciousness and makes the same claim. Thus, the distinction clarifies *what* is being reported (access) but confirms that the report does not justify the existence of the *phenomenal*.

  Ultimately, the paradox cannot be dissolved while retaining strict epiphenomenalism. To claim knowledge of qualia requires a justification that distinguishes the conscious state from the zombie state. Since all physical evidence and cognitive mechanisms are shared between the two, any justification relying on physical cognition is circular. It uses physically caused judgments to validate causally isolated properties. Unless one posits a non-causal form of "acquaintance" that bypasses physical reliability conditions, the epiphenomenalist is trapped: they must assert the existence of qualia while admitting their cognitive systems provide no reliable evidence for them. The zombie reporter demonstrates that the physical story is complete without the phenomenal, leaving the phenomenal epistemically isolated.

  ***

  ### Marking Scheme (25 Marks Total)

  **1. Explanation of the Causal Exclusion Problem for Self-Knowledge (5 Marks)**
  *   **Full Marks:** Clearly articulates that if qualia are inert, they cannot be the cause of the belief that one has qualia. Links causal inertness directly to the formation of the belief state.
  *   **Deduction:** -2 marks if the student defines epiphenomenalism generally but fails to specify that *beliefs* are physical events that qualia cannot cause. -3 marks if the student conflates this with the Knowledge Argument (Mary) rather than focusing on the causal mechanism of judgment.

  **2. Analysis of the Reliability Challenge (5 Marks)**
  *   **Full Marks:** Explains that justification requires a reliable link between truth and belief. Argues that because the physical base is sufficient for the belief, the truth of the qualia is irrelevant to the belief's production, breaking reliability.
  *   **Deduction:** -2 marks if the student argues the belief is *false* (epiphenomenalism allows true beliefs, just unjustified ones). -3 marks if the student fails to explain *why* inertness leads to unreliability (i.e., misses the counterfactual dependence).

  **3. Deployment of the "Phenomenal-Zombie Reporter" (5 Marks)**
  *   **Full Marks:** Uses the zombie hypothetical to demonstrate that the introspective report is physically determined. Shows that the zombie makes the same report without the qualia, proving the report does not track the qualia.
  *   **Deduction:** -2 marks if the zombie is treated merely as a metaphysical possibility without linking it to the *indistinguishability of reports*. -3 marks if the student claims the zombie would *not* make the report (violating the physical identity premise).

  **4. Application of the Access/Phenomenal Distinction (5 Marks)**
  *   **Full Marks:** Correctly defines A-consciousness (functional/reportable) vs. P-consciousness (experiential). Explains the epiphenomenalist strategy of claiming judgments target A-consciousness.
  *   **Deduction:** -2 marks for conflating A-consciousness with P-consciousness (e.g., claiming A-consciousness *is* the qualia). -3 marks for failing to explain how this distinction is supposed to save the causal story of the judgment.

  **5. Assessment of Epistemic Circularity and Conclusion (5 Marks)**
  *   **Full Marks:** Concludes that the distinction fails to solve the epistemic gap. Explicitly identifies the circularity: using physical cognition (which zombies have) to justify P-properties (which zombies lack). Verdict: Paradox remains unless epiphenomenalism is modified.
  *   **Deduction:** -2 marks if the student claims the distinction *successfully* solves the problem without addressing how P-consciousness is known. -3 marks if the conclusion ignores the "crux" of epistemic circularity requested in the prompt.
