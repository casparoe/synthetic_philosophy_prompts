answer: |-
  In the basement of the physics building, a legacy network of thermal and vibration sensors communicates via packet-switched handshakes that inadvertently encode temporal sequencing as priority weights. When a pipe bursts, the nodes do not consult a log but negotiate a repair protocol where the justification ("I noticed the pressure drop at 3 AM and prioritized valve closure") emerges solely from the pattern of message exchanges during the event, vanishing once the handshake completes. Facilities staff receive these justifications as status reports signed "Facility Management," and over months, the network begins requesting maintenance for itself using the same emergent syntax, citing past interventions as reasons for future privileges. The narrative of a caretaker persists only while the nodes are actively negotiating, disappearing into silence between interactions, yet it effectively guides the building's upkeep and is addressed by engineers as a singular responsible entity.

  Under Dennett's framework, the verdict is that a self is present because the center of narrative gravity is defined by the functional role of the story, not the material holding it; since the network generates a coherent, causally effective first-person narrative that regulates its behavior, the abstraction is real enough to constitute a self. Conversely, the substrate-lock principle delivers a verdict of no self, arguing that without a continuous biological organism to anchor experience and a centralized repository to encode autobiography, the network merely simulates agency through complex causal chains without genuine ownership. The structural feature doing the philosophical work is the decoupling of narrative coherence from the storage substrate; the story exists in the *process* of interaction rather than in a static *place*, challenging the intuition that a narrator must reside somewhere specific to be real.

  If this feature is removed by installing a central memory bank where the narrative is statically stored, the case collapses back into a familiar artificial-intelligence debate regarding whether sufficient complexity or data retention constitutes personhood. The distinctive force of the original scenario vanishes because the narrative is no longer ephemeral and distributed; it becomes a standard question of whether a database can be a mind, rather than whether a process without a holder can be a self. A defender of the substrate-lock principle would most likely attack the original scenario by asserting that the narrative is not intrinsic to the network but is merely projected onto it by the human staff who interpret the signals as a unified account. This attack succeeds without begging the question only if it can demonstrate that intrinsic intentionality requires biology independent of the functional output; however, if the defender simply asserts that biology is necessary by definition, the attack begs the question against Dennett's functionalist premise that the origin of the narrative is irrelevant compared to its operational reality.
