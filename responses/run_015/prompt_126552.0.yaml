answer: |-
  Here is a design for a 90-minute seminar game called **"The Equivocation Trap."** It is built to physicalize the tension between *expressive force* (the token) and *logical content* (the sentence card).

  ### **Game Overview**
  *   **Title:** The Equivocation Trap
  *   **Time:** 45 minutes (Game + Debrief), leaving 45 mins for broader discussion.
  *   **Players:** 8 Students.
  *   **Goal:** Construct a valid *Modus Ponens* argument while adhering to Expressivist rules.
  *   **Core Tension:** Expressivist rules require you to treat embedded sentences differently from asserted sentences, but Logical rules require them to be identical.

  ---

  ### **Materials**
  1.  **Sentence Cards (8):** Simple moral claims (e.g., "Stealing is wrong," "Lying is bad").
  2.  **Commitment Tokens (24):** Poker chips or colored coins (3 per student).
  3.  **Scenario Cards (3 Decks):**
      *   *Deck A (Assertion):* "Assert this claim to the group."
      *   *Deck B (Embedding):* "Use this claim in: (1) A Conditional, (2) A Question, (3) A Belief Report ('John believes that...')."
      *   *Deck C (Inference):* "Combine two previous statements to derive a conclusion."
  4.  **Whiteboard:** To track "Valid Inferences."

  ---

  ### **The Rules**

  **1. The Token Rule (Expressivist Axiom)**
  *   A Sentence Card represents **Syntax**.
  *   A Token represents **Non-Cognitive Attitude** (Boo!/Hurrah!).
  *   **Rule:** You may only surrender a Token if you are *expressing an attitude*.
      *   **Assertion:** You *must* play 1 Token to the center pot.
      *   **Embedding (If/Believes/?):** You *must keep* your Token. (You are not expressing the attitude, only mentioning the content).

  **2. The Validity Rule (Logical Axiom)**
  *   To win a round (gain 1 Point), you must construct a valid *Modus Ponens*.
  *   **Rule:** For an inference to be valid, the Antecedent in Premise 1 must be **Identical** to Premise 2.
  *   **Definition of Identity:** Same Text + **Same Token Status**.
      *   *Example:* "If [Stealing is wrong (No Token)]..." does **not** match "Stealing is wrong (Token Played)."
      *   *Result:* If Token Status differs, it counts as **Equivocation**. The argument is invalid. You lose 1 Point.

  **3. Turn Structure**
  *   **Round 1 (Assertion):** 4 students draw Deck A. They read their card and play a Token. (4 Tokens in pot).
  *   **Round 2 (Embedding):** 4 students draw Deck B. They read their sentence embedded in a scenario. They *keep* their Tokens.
  *   **Round 3 (The Clash):** The class attempts to pair a Round 1 student with a Round 2 student to form an argument.
      *   *Example:* Round 2 student says: "If stealing is wrong, then lying is wrong." (No token on 'stealing').
      *   *Example:* Round 1 student says: "Stealing is wrong." (Token played on 'stealing').
      *   *Class Vote:* Is this valid?
      *   *Enforcement:* Apply the **Validity Rule**. If Token Status differs, the argument collapses.

  ---

  ### **The Debrief (Mapping Mechanics to Logic)**

  Gather the tokens and cards on the table. Draw the following on the board:

  | Game Mechanic | Philosophical Equivalent | The Problem |
  | :--- | :--- | :--- |
  | **Sentence Card** | Linguistic Meaning / Proposition | Looks the same in both contexts. |
  | **Token** | Non-Cognitive State (Attitude) | Present in assertion, absent in embedding. |
  | **Validity Rule** | Logical Validity (Univocality) | Requires meaning to be constant across contexts. |
  | **Equivocation Loss** | The Frege-Geach Problem | If meaning = attitude, embedded meaning ≠ asserted meaning. |

  **Discussion Questions:**
  1.  "In Round 3, did the sentence 'Stealing is wrong' mean the same thing in the 'If' clause as it did in the assertion?"
  2.  "If you said **Yes** (it means the same), why did you keep your token in Round 2? Doesn't the token represent the meaning?"
  3.  "If you said **No** (it means different things), how can we ever reason morally? Isn't all moral logic just equivocation?"

  ---

  ### **Honest Note: What The Tokens Can't Reproduce**

  Be explicit with the group about where the analogy fails. This prevents them from dismissing the game as "silly."

  1.  **Invisibility:** In the game, the Token status is public and obvious. In language, the lack of attitude in embedding is *invisible*. That is why F-G is a puzzle and not just a mistake. The game makes the equivocation obvious; real language hides it.
  2.  **Discreteness:** Tokens are binary (have/have-not). Attitudes are graded (fear, doubt, partial approval). The game simplifies the psychological state too much.
  3.  **The "Content" Illusion:** The game forces you to treat the Sentence Card as "empty syntax" without the Token. Many expressivists (Quasi-Realists) argue the sentence *does* have truth-apt content even without the attitude. The game struggles to model how a sentence can be "truth-apt" without a "Token."

  ---

  ### **Predictable Break Points (And How to Handle Them)**

  **1. The "Semantic Intuition" Revolt**
  *   **What happens:** During Round 3, students will refuse to accept that "Stealing is wrong (No Token)" is different from "Stealing is wrong (Token)." They will argue it's obviously the same sentence.
  *   **Why:** Their logical intuition is stronger than the game rules.
  *   **Fix:** Lean into it. Say: *"Good. You are now arguing for Cognitivism. But if you are an Expressivist, you must defend the Token Rule. Why did you keep the token in Round 2? If you keep the token, you violated Expressivism. If you play the token, you violated the definition of Embedding. Pick your poison."*

  **2. Token Hoarding**
  *   **What happens:** Students in Round 2 (Embedding) might try to "bet" their tokens or slide them halfway to indicate "I'm kinda committed."
  *   **Why:** They want to preserve logical validity without abandoning expressivism.
  *   **Fix:** Enforce the binary rule strictly. *"All or nothing. Either you are expressing the attitude (Assertion) or you are not (Embedding). There is no halfway in classical logic."*

  **3. The "Quasi-Realist" Loophole**
  *   **What happens:** A smart student will suggest: *"What if I earn a 'Logic Token' in Round 2 that isn't an 'Attitude Token'?"*
  *   **Why:** They are intuiting Blackburn's or Gibbard's solution (norms of consistency).
  *   **Fix:** Pause the game. This is the golden moment. *"That is exactly what Quasi-Realism tries to do. It tries to earn the right to use logic tokens without having cognitive attitude tokens. Let's write that on the board as our next topic."*

  ### **Instructor Script for the "Crash"**
  When the first argument fails due to Token Mismatch:

  > "Stop. Look at the table. Premise 1 has a card with no chip. Premise 2 has a card with a chip. According to our Expressivist rules, these are different objects. Therefore, the argument is invalid.
  >
  > Does anyone feel that this result is absurd?
  >
  > [Wait for heads nodding]
  >
  > Good. That absurdity is the Frege-Geach problem. You feel the logic *should* work, but the Expressivist metaphysics says it *can't*. Your job for the rest of the seminar is to fix the rules so the game works without throwing away the Tokens."

  ### **Timing Guide**
  *   **00-10:** Setup & Rules Explanation.
  *   **10-35:** Gameplay (Rounds 1-3). Let them struggle with Round 3 for at least 10 minutes.
  *   **35-55:** Debrief & Mapping (The Table above).
  *   **55-90:** Open Seminar Discussion (Solutions: Quasi-realism, Ecumenical Expressivism, Cognitivist responses).

  This design ensures they don't just *hear* about the problem; they *lose points* because of it. The frustration of the invalid inference becomes the philosophical motivation.
