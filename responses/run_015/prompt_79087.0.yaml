  Strictly speaking, the Downward Löwenheim-Skolem theorem applies to theories in a *countable* language. If you write down a theory in an uncountable language (e.g., adding uncountably many constants), the model might need to be larger. Since ZF is countable, it works for ZF, but the general statement "any consistent theory... in that language [first-order logic]" is technically false because FOL allows uncountable signatures. I will mark this as a "Wince" because it's a standard simplification, but a logician would note the countability constraint on the *language*, not just the logic.
