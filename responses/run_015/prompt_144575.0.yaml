answer: |-
  Your intuitions are remarkably consistent, suggesting that you do not need to abandon either the obligation of normative assimilation or the exemption for conscientious objection. Rather, the tension you perceive arises from treating "local norms" as a monolithic category. They are not. Some norms are *constitutive of fair cooperation*, while others are *expressions of power or injustice*.

  To reconcile your verdicts, I propose a unifying framework: **The Principle of Legitimate Cooperative Schemes.**

  This principle holds that a temporary visitor has a *prima facie* moral obligation to adhere to local conventions if and only if:
  1.  **Participation sustains a welfare-sensitive or coordinative scheme from which the visitor benefits;** AND
  2.  **The scheme does not violate fundamental principles of justice or human rights.**

  When Condition 1 is met, "Moral Tourism" is impermissible (you must assimilate). When Condition 2 is failed, "Normative Assimilation" is impermissible (you must object).

  Here is how this principle accommodates your specific verdicts, resolves the tension, and predicts the outcome for the bribery case.

  ### 1. Accommodating the Verdicts

  **The Welfare/Coordination Filter (Condition 1)**
  This explains why you must tip in New York but not Oslo, and why you must queue in London.
  *   **New York Tipping:** The wage structure is a cooperative scheme. The waiter provides service expecting a specific remuneration package (wage + tip). By dining there, you benefit from the service. Withholding the tip unilaterally alters the contract and deprives the worker of expected income. This is *harm*, not just rudeness.
  *   **Tokyo Tipping:** Here, the "scheme" is one of dignity and professional pride. Offering a tip disrupts the social contract, causing embarrassment (a form of harm). Assimilation requires *omission* rather than action.
  *   **London Queuing:** This is a pure coordination device. It creates fairness in access. Defecting (cutting in) free-rides on the restraint of others. This violates the **Principle of Fair Play**.

  **The Expressive/Exemplary Filter (Nuance to Condition 1)**
  This explains the Berlin Jaywalking case.
  *   **Berlin Jaywalking (Alone):** No cars = no physical harm. The coordination scheme (traffic flow) is not disrupted. Thus, no obligation.
  *   **Berlin Jaywalking (With Children):** You become a moral exemplar. Violating the rule models civic contempt to those socialized into the system. The "harm" is not physical but *civic*—it undermines the normative expectation required for the system to function safely when cars *are* present.

  **The Sacred/Respect Filter (Condition 1 Extension)**
  This explains the Mosque vs. Private Home distinction.
  *   **Private Home:** A "no shoes" rule is a preference. Violating it is rude (etiquette).
  *   **Mosque:** The rule is tied to sacred practice and communal identity. Violating it is an affront to the community's deeply held values (morality). The "welfare" here is the integrity of religious practice.

  ### 2. Resolving the Tension: Arbitrary Tipping vs. Gender Segregation

  You asked whether you must drop the assimilation obligation or the conscientious-objection exemption. You need neither. The distinction lies in the **Legitimacy of the Scheme (Condition 2).**

  *   **Arbitrary Tipping (NY vs. Oslo):** You find the norm "morally arbitrary," but it is not *unjust*. It is a distributive mechanism. While inefficient, it does not violate anyone's rights. Therefore, the **Fair Play** obligation stands. You benefit from the meal; you must pay the price the system requires to sustain the waiter's livelihood.
  *   **Gender Segregation:** This norm violates the principle of **Equal Moral Status**. A convention that treats individuals as inferior based on immutable characteristics fails Condition 2. The "cooperative scheme" is built on injustice. Therefore, the duty to assimilate dissolves. You are not obligated to participate in a system that denies basic rights, even if your refusal causes offense.

  **The Unifying Principle:** You must follow local rules that facilitate *fair* cooperation, even if they are inefficient or culturally specific. You must *not* follow local rules that facilitate *unfair* subordination, even if they are culturally entrenched.

  ### 3. The Test Case: Mandatory "Gift-Giving" (Bribery)

  Applying the **Principle of Legitimate Cooperative Schemes** to the case of mandatory gifts to public officials:

  **Analysis:**
  1.  **Does it sustain a cooperative scheme?** In a descriptive sense, yes. It "greases the wheels."
  2.  **Is the scheme legitimate (Condition 2)?** No. Bribery undermines the **Rule of Law** and **Public Trust**. It replaces entitlement based on right (e.g., a passport you are legally owed) with entitlement based on payment. It creates a system where the wealthy receive justice and the poor do not.

  **Verdict:**
  The visitor **ought not to participate.**

  This is not a case for "Moral Tourism" (treating the norm as a spectacle); it is a case for **Conscientious Objection.** While tipping is a private transfer of wealth within a consensual service interaction, bribery is a corruption of public duty.
  *   **Why it differs from Tipping:** Tipping supplements a wage agreed upon within a private contract. Bribery subverts a public obligation.
  *   **Why it differs from Segregation:** Like segregation, bribery is structurally unjust. However, unlike segregation (where refusal is a protest), refusing bribery may result in the denial of essential services.

  **Nuance on Duress:**
  If the official refuses to process a visa without a bribe, the visitor is under **duress**.
  *   *Moral Obligation:* Do not offer the bribe.
  *   *Moral Blame:* If the visitor pays to secure a safe exit or essential medical access, they may be *excused* due to necessity, but the act remains morally problematic, and the norm remains one they should not assimilate into willingly.

  ### Conclusion

  Your intuitions reveal a coherent moral topology. You are not oscillating between two conflicting views; you are applying a **hierarchical ethical framework**:

  1.  **Fundamental Justice** (Human rights, Rule of Law) -> *Overrides local norms.* (Segregation, Bribery).
  2.  **Fair Cooperation** (Welfare, Coordination, Promise-keeping) -> *Mandates assimilation.* (Tipping, Queuing).
  3.  **Cultural Etiquette** (Preferences, Non-sacred customs) -> *Permits flexibility.* (Shoes in a home, Jaywalking alone).

  You need not abandon any verdicts. The "Moral Tourism" label should be reserved only for Level 3 (Etiquette). Level 2 demands Normative Assimilation. Level 1 demands Moral Resistance. The bribery case falls squarely into Level 1: it is an unjust convention that imposes no duty of compliance, only a duty of resistance (tempered by practical necessity).
