  ## Diagnostic Leaves

  **Leaf A: Anti-Essentialism (Closest Candidate)**
  *   **Diagnosis:** You reject origin essentialism in favor of a counterpart-theoretic approach where modal claims are grounded in similarity rather than transworld identity.
  *   **Awkward Commitment:** You must accept that in many nearby possible worlds where someone very much like you exists, *you* do not exist at all.
  *   **Inseparable From:** None.

  **Leaf B: Indeterminism (No-Fact-of-the-Matter)**
  *   **Diagnosis:** You accept that origin essentialism is true but vague; there is no sharp boundary where identity ceases in cases of gradual gametic variation.
  *   **Awkward Commitment:** You must accept that identity itself is a vague property, implying that existence can be indeterminate.
  *   **Inseparable From:** None.

  **Leaf C: Genetic Sequence Essentialism**
  *   **Diagnosis:** You hold that the specific nuclear base sequence is the necessary and sufficient condition for your origin, regardless of the material vehicle.
  *   **Awkward Commitment:** You are committed to the view that a human clone created from your DNA years later would be numerically identical to you.
  *   **Inseparable From:** None.

  **Leaf D: Close-Enough Origin (Vagueness)**
  *   **Diagnosis:** You maintain that material gametes are essential but allow for a margin of error where small material differences do not disrupt identity.
  *   **Awkward Commitment:** You face a Sorites paradox where adding one base-pair difference at a time eventually yields a different person without a sharp cutoff point.
  *   **Inseparable From:** None.

  **Leaf E: Zygote Essentialism**
  *   **Diagnosis:** You hold that the zygote as a unified substance is the essential origin, allowing variance in gametic history or cytoplasm provided the resulting zygotic entity is sufficiently continuous.
  *   **Awkward Commitment:** You must grant that significant interventions (like cytoplasmic swapping or timing shifts) are metaphysically irrelevant to who comes into existence.
  *   **Inseparable From:** None.

  **Leaf F: Strict Gamete Essentialism**
  *   **Diagnosis:** You affirm that the numerically specific sperm and egg are strictly necessary for your existence, with no tolerance for material or temporal variance.
  *   **Awkward Commitment:** You are committed to the claim that nearly any medical intervention in conception (such as IVF timing) results in a numerically different child.
  *   **Inseparable From:** Leaf G.

  **Leaf G: Primitivism (Haecceitism)**
  *   **Diagnosis:** You believe that individual essence is a brute fact not fully settled by matter, genome, or origin, often evidenced by how twinning is handled.
  *   **Awkward Commitment:** You must accept that there are metaphysical facts about *which* twin is *which* that are not grounded in any qualitative difference between them.
  *   **Inseparable From:** Leaf F.

