  ### Diagnostic Note on Inseparability
  **Leaves F (Strict Gamete Essentialism) and G (Primitivism/Haecceitism)** are flagged as inseparable by this instrument. Both views affirm that the specific origin event fixes identity and that twinning involves a unique metaphysical split; they differ only on whether the "this-ness" of the origin is grounded in the material gametes (F) or is a primitive non-qualitative fact (G). A student's answers to the concrete cases will be identical for both; distinguishing them requires a further question about the *grounding* of haecceity rather than its *extension*.
