  # Decision Tree: Fine-Grained Origin Essentialism

  **Instructions:** Start at Node 1. Answer the question based on your intuitive judgment of the case described. Follow the branch corresponding to your answer until you reach a leaf. Each leaf represents a distinct metaphysical position on personal origin.

  ### Node 1: The Modal Framework
  **Case:** Consider a case in which a child of the same two parents, conceived at a different time, would have been raised in her place, next to a variant in which no such child would have existed at all.
  **Question:** In the variant where the child exists, is that child *numerically identical to you* (strict identity), or merely a *counterpart* who resembles you closely enough to warrant the claim "I could have been that child"?
  *   **Counterpart/Similarity:** Go to **Leaf A**.
  *   **Strict Identity:** Go to Node 2.

  ### Node 2: The Determinacy of Borderlines
  **Case:** Consider a gamete whose genome differs from the actual one by a single base pair.
  **Question:** Is there a determinate fact of the matter about whether you would originate from this gamete, even if that fact is epistemically inaccessible to us?
  *   **No Fact (Indeterminate):** Go to **Leaf B**.
  *   **Fact (Determinate):** Go to Node 3.

  ### Node 3: The Locus of Essence (Matter vs. Form)
  **Case:** Consider a numerically distinct sperm or egg whose genome has exactly the same base sequence as the actual one, which recombination makes conceivable even if it is astronomically unlikely.
  **Question:** If this numerically distinct but genetically identical gamete had fertilized the corresponding partner, would the resulting person be *you*?
  *   **Yes (Form/Structure Matters):** Go to Node 4.
  *   **No (Matter/Substance Matters):** Go to Node 5.

  ### Node 4: The Cytoplasmic Constraint
  **Case:** Consider the same nuclear genome developing in a different egg cytoplasm, with different mitochondria and different initial chemical conditions.
  **Question:** Does this variance in cytoplasmic material preclude the resulting person from being *you*?
  *   **No (Nuclear Genome Sufficient):** Go to Node 7.
  *   **Yes (Whole Cell Required):** Go to **Leaf E**.

  ### Node 5: The Tolerance of Material Substance
  **Case:** Return to the gamete whose genome differs from the actual one by a single base pair.
  **Question:** Given that the specific material gamete is essential, does this microscopic material variance destroy identity?
  *   **No (Tolerance Allowed):** Go to **Leaf D**.
  *   **Yes (Strict Material Identity):** Go to Node 6.

  ### Node 6: The Temporal Binding of Gametes
  **Case:** Consider the same gametes uniting a day earlier or later than they did.
  **Question:** Does this shift in the timing of the fusion event preclude the resulting person from being *you*?
  *   **No (Fusion Event Matters, Not Timing):** Go to **Leaf E**.
  *   **Yes (Specific Gamete-State Matters):** Go to Node 8.

  ### Node 7: The Integrity of the Sequence
  **Case:** Consider a corrective edit made to the zygote at the one-cell stage.
  **Question:** If this edit alters the base sequence from what it naturally would have been, is the resulting person still *you*?
  *   **No (Sequence Fixity Required):** Go to **Leaf C**.
  *   **Yes (Developmental Continuity Sufficient):** Go to **Leaf E**.

  ### Node 8: The Uniqueness of Origin
  **Case:** Consider monozygotic twinning, where one zygote formed from the same gametes later splits into two embryos.
  **Question:** Prior to the split, did the two embryos share the *same* individual essence (one origin becoming two), or did they possess distinct essences from the moment of fertilization?
  *   **Shared Essence:** Go to **Leaf G**.
  *   **Distinct Essences:** Go to **Leaf F**.

