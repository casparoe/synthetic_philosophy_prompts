      *   **The Example:** Devadatta is fat (*pimana*). Devadatta does not eat during the day (*diva na bhunkte*). Therefore, Devadatta eats at night (*ratrau bhunkte*).
      *   **Nyaya's Stance:** This is *anumana* (specifically *sesavat* or *purvavat* inference, though often treated as *samanyato-drsta*).
