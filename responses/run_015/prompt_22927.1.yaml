answer: |-
  This is one of the best sticking points in Indian epistemology. You have hit on exactly why the Mimamsa-Nyaya debate over *arthapatti* (postulation) is so famous. Your intuition is spot on: the Nyaya reduction *does* feel like they are squeezing a square peg into a round hole, and your suspicion about "Inference to the Best Explanation" is basically the modern scholarly consensus on what *arthapatti* actually is.

  Let's do exactly what you asked. First, we will force the Devadatta case into the Nyaya *anumana* (inference) structure to see how they try to make it work. Then, we will look at the cracks in the foundation where the Mimamsakas drive their wedge.

  ### Part 1: The Nyaya Reduction (Forcing it into *Anumana*)

  For the Nyayins, there are only four ways to know things. If *arthapatti* is a valid way of knowing, it must be reducible to one of the four. Since it involves reasoning, it must be *anumana*.

  To make it *anumana*, they need to construct a standard Nyaya syllogism (*pararthanumana*). Let's identify the technical terms you asked for.

  **The Scenario:**
  1.  **Fact A:** Devadatta is fat (*piman*).
  2.  **Fact B:** Devadatta does not eat during the day (*diva na bhunkte*).
  3.  **Conclusion:** Devadatta eats at night (*ratrau bhunkte*).

  **The Nyaya Syllogism:**

  1.  **Pratijna (Proposition):** Devadatta eats at night.
  2.  **Hetu (Reason/Mark):** Because he is fat and does not eat during the day.
  3.  **Udaharana (Universal Example/ Vyapti):** Whoever is fat and does not eat during the day eats at night. (Or more broadly: "Fatness in a living person implies consumption of food; if not by day, then by night.")
  4.  **Upanaya (Application):** Devadatta is fat and does not eat during the day.
  5.  **Nigamana (Conclusion):** Therefore, Devadatta eats at night.

  **So, to answer your specific technical questions:**

  *   **Sadhya (The thing to be proved):** Night-eating (*ratri-bhojana*).
  *   **Hetu (The logical ground):** The combination of Fatness + Non-day-eating (*pimatva + diva-abhojana*).
  *   **Vyapti (The invariable connection):** This is the critical move. Nyaya argues the connection is between "Sustenance of a fat body" and "Eating." Since we know fatness is an effect of eating, and we know he isn't eating by day, the *vyapti* is: "Fatness in a living human *invariably* implies eating at *some* time."

  Nyaya classifies this specifically as **Samanyato-drsta anumana** (inference based on general correlation). We don't see the night eating directly, but we have seen generally that fatness comes from eating. So we infer the specific time of eating based on the exclusion of other times.

  ### Part 2: Where the Nyaya Move Feels Forced

  You asked where it feels forced. It feels forced in the **Vyapti**.

  In a standard *anumana* like "There is fire on the hill because there is smoke," the *vyapti* (connection between smoke and fire) is based on positive observation. We have seen smoke and fire together many times. We know the causal relationship.

  In the Devadatta case, look at the *vyapti* Nyaya has to propose:
  *"Fatness + No Day Eating $\rightarrow$ Night Eating."*

  **Problem 1: The Negative Condition**
  Standard *anumana* usually relies on a positive sign (Smoke). Here, the "sign" is partly a negative fact ("He does *not* eat by day"). Classical logic struggles with negative facts as *hetus*. Nyaya has to argue that the *absence* of day-eating is a perceptible fact that functions as a mark.

  **Problem 2: The "Invariable" Connection is Weak**
  Is it *invariably* true that if a fat person doesn't eat by day, they eat at night?
  *   What if Devadatta has a metabolic disorder?
  *   What if he is eating high-calorie snacks secretly during the day (lying about not eating)?
  *   What if he ate all his calories in one massive meal last Sunday?

  In the Smoke/Fire case, if there is smoke, there *must* be fire (in the Nyaya worldview). In the Devadatta case, the connection isn't a strict causal law like physics; it is an **explanatory necessity**. We postulate night-eating because it is the *only way to make sense* of the two conflicting facts (Fatness vs. No Day Eating).

  **Problem 3: The Starting Point is Conflict, not a Mark**
  This is the Mimamsa killer argument.
  *   **Anumana** starts with a *Linga* (Sign). You see Smoke. You infer Fire.
  *   **Arthapatti** starts with a *Virodha* (Conflict/Anomaly). You see Fatness. You *also* see No Day Eating. These two facts clash. "How can he be fat if he doesn't eat?"

  The knowledge doesn't arise from seeing a "mark" of night-eating. There is no "mark" of night-eating present. The knowledge arises from the **need to resolve a contradiction**.

  ### Part 3: Your IBE Intuition

  You wrote: *"I suspect the whole move is really inference-to-the-best-explanation wearing a Nyaya costume."*

  You are absolutely right. In Western philosophy, this is called **Abduction** (C.S. Peirce) or **Inference to the Best Explanation (IBE)**.

  *   **Deduction:** All men are mortal $\rightarrow$ Socrates is a man $\rightarrow$ Socrates is mortal.
  *   **Induction:** Every swan I've seen is white $\rightarrow$ All swans are white.
  *   **Abduction (IBE):** The grass is wet. It didn't rain. The sprinkler is the best explanation for the wet grass.

  The Devadatta case is pure Abduction.
  *   **Observation:** Devadatta is fat.
  *   **Constraint:** Devadatta doesn't eat by day.
  *   **Hypothesis:** Devadatta eats at night.
  *   **Validation:** This is the *best explanation* that resolves the tension between his physique and his observed habits.

  The Mimamsakas (like Kumarila Bhatta) argued that *anumana* cannot capture this. *Anumana* requires a pre-established universal connection (*vyapti*). But we don't have a universal connection between "Fatness" and "Night Eating." We have a universal connection between "Life" and "Eating." *Arthapatti* is the unique cognitive process of saying, "Given that he is alive and fat, he *must* be eating somewhere, and since it's not here, it must be there."

  ### Part 4: Why Nyaya Insists on the Reduction

  If the Mimamsa critique is so strong, why does Nyaya refuse to accept *arthapatti* as a fifth *pramana*?

  It comes down to **Epistemological Parsimony (Laghava)**.
  Nyaya follows a principle similar to Occam's Razor. If you can explain a cognitive event using an existing category (*anumana*), do not create a new category (*arthapatti*). They argue that "resolving a conflict" is just a psychological description of how a specific type of inference *feels*, not a different logical structure.

  For Nyaya:
  1.  We perceive Fatness.
  2.  We recall the universal: "Fatness is caused by eating."
  3.  We perceive "No Day Eating."
  4.  We infer "Night Eating" via elimination (*sesavat* inference - inferring the remainder).

  They claim the "conflict" is just the mental trigger that starts the inference process, not a separate *pramana*.

  ### Summary for your Course

  If you need to articulate this in an exam or paper, here is the roadmap:

  1.  **The Nyaya Reduction:** They treat "Fatness + No Day Eating" as the *Hetu* and "Night Eating" as the *Sadhya*. The *Vyapti* is grounded in the general causal law that "Fatness requires food intake."
  2.  **The Weakness:** The *Vyapti* is not a direct perceptual correlation (like smoke/fire) but a theoretical necessity. The "sign" is partly negative (absence of day eating).
  3.  **The Mimamsa Defense:** *Arthapatti* is distinct because it arises from **reconciling conflicting facts** (*virodha*), not from perceiving a logical mark (*linga*). It is explanatory, not strictly entailment-based.
  4.  **Your Insight:** Validate your IBE hunch. *Arthapatti* is essentially abduction. Nyaya tries to reduce abduction to deduction/induction, which loses the nuance of *why* we accept the conclusion (because it's the only explanation that works, not because it's logically entailed).

  The Nyaya move feels forced because they are trying to formalize a "hunch based on coherence" into a "rigid logical entailment." The Mimamsakas win on phenomenology (describing how we actually think); the Nyayins win on ontology (keeping the list of knowledge sources short).
