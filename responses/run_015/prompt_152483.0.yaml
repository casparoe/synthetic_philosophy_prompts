answer: |-
  # DECISION TREE: IS DNA A CODE?
  **Start:** *Consensus:* DNA base sequence reliably determines amino acid sequence.

  **Q1. The Tree Ring Test:** Is this correlation a **causal trace** (like rings recording age) or a **guide for production** (like a recipe for a cake)?
  *   **Causal Trace** $\rightarrow$ Go to Q2.
  *   **Guide for Production** $\rightarrow$ Go to Q3.

  **Q2. The Methylation Test:** Do heritable methylation patterns count as 'coding' if they lack digital triplet syntax?
  *   **Yes:** *Leaf 1: Pansemiotics.* **(Empty: Unattractive.** If hormones and tree rings are codes, the distinction collapses.)
  *   **No:** *Leaf 2: Deflationary Physicalism.* (Ugliest commitment: DNA and hormone levels are equally 'informative' causal traces.)

  **Q3. The Recoding Test:** In an engineered organism where 'UGA' = Tryptophan (not Stop), did the DNA's *content* change or just the cell's *reaction*?
  *   **Just Reaction:** *Leaf 3: Stereochemical Realism.* **(Empty: Incoherent.** Chemistry forces stability, not specific semantic mapping.)
  *   **Content Changed:** $\rightarrow$ Go to Q4.

  **Q4. The Parse-Relativity Test:** Is the code located in the **DNA strand alone**, or the **DNA-plus-Decoder system**?
  *   **Strand Alone:** $\rightarrow$ Go to Q5.
  *   **Strand-plus-Decoder:** $\rightarrow$ Go to Q6.

  **Q5. The Test Tube Test:** If the decoder is removed (DNA in solution), does the 'instruction' persist?
  *   **Yes:** *Leaf 4: Intrinsic Information.* (Ugliest commitment: A dead strand in a vacuum contains 'commands' no one can obey.)
  *   **No:** **(Empty: Incoherent.** If code is in Strand Alone, it cannot vanish when the environment changes.)

  **Q6. The Process Test:** If the decoder is removed (DNA in solution), does the 'code' vanish entirely?
  *   **Yes:** *Leaf 5: Processualism.* (Ugliest commitment: DNA isn't a code, the *transcription event* is the code.)
  *   **No (Disposition Remains):** $\rightarrow$ Go to Q7.

  **Q7. The Error Test:** Can the machinery 'misread' the DNA (normative error), or does it simply produce what it produces (causal output)?
  *   **Causal Output:** *Leaf 6: Causal Information Theory.* (Ugliest commitment: Cannot distinguish mutation from misreading.)
  *   **Normative Error:** $\rightarrow$ Go to Q8.

  **Q8. The Source Test:** Does the function derive from **evolutionary history** or a **current interpreter**?
  *   **Evolutionary History:** *Leaf 7: Teleosemantics.* (Ugliest commitment: A gene in a sterile organism has no meaning.)
  *   **Current Interpreter:** *Leaf 8: Interpreter Theory.* (Ugliest commitment: Risks smuggling a homunculus into the ribosome.)

  ***

  **⚠️ Indistinguishable Leaves:** Leaf 7 (Teleosemantics) and Leaf 8 (Interpreter) often yield identical verdicts on all test cases above; the "current interpreter" is usually just a placeholder for selected history.
  **🏆 Workhorse Question:** Q3 (The Recoding Test). If the mapping isn't arbitrary/conventional, the rest of the tree collapses into Physicalism.
