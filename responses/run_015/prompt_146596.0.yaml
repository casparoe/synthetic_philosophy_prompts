  You argue that systems can embody bad faith without consciousness. How do you avoid anthropomorphising the algorithm? What distinguishes a system that embodies bad faith from one that merely operates deterministically, and does this distributed form require a collective subject or can it exist purely in the interaction patterns between individuals and machines?

  *Follow-up:* Your defence will likely be that bad faith is a structural relation, not a mental state. However, if you sever bad faith from the intentional lie to oneself, do you not risk diluting the concept until it is indistinguishable from ideology or structural violence, thereby losing the specific existential culpability Sartre emphasised?

