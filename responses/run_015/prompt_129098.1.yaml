answer: |-
  ### Teaching Sequence & Carrying Example

  **Dependency Chain:**
  1.  **Moral Presentism** (The Hook): Acknowledge their current understanding (judging past ethics).
  2.  **Conceptual Presentism** (The Pivot): Establish that *categories* (not just judgments) are historically contingent. **This must land before step 3.**
  3.  **Evidentiary Presentism** (The Consequence): Show how conceptual loading dictates what counts as evidence.

  **Total Time:** 90 Minutes

  **00:00–15:00 | Activation (Moral Presentism)**
  *   **Activity:** Quick-write: "Is it wrong to call a 18th-century slaveholder a 'criminal'?"
  *   **Discussion:** Elicit their Carr-informed view. Establish the baseline definition: *Moral Presentism = Imposing current ethical standards on past actors.*
  *   **Goal:** Validate their existing knowledge to lower defenses before complicating it.

  **15:00–45:00 | The Carrying Case: WWI "Shell Shock" vs. Modern "PTSD"**
  *   **The Setup:** Present two documents. A) A 1917 court-martial transcript executing a soldier for "cowardice." B) A 2024 medical diagnosis of a veteran with "PTSD."
  *   **Layer 1: Moral Presentism (15 mins):** Ask students to judge the 1917 execution. They will condemn it using modern human rights/medical ethics. Acknowledge this is valid moral reasoning but historically shallow.
  *   **Layer 2: Conceptual Presentism (15 mins):** Ask: "Did this soldier have PTSD?"
      *   *Intervention:* Explain that "PTSD" is a category created in 1980. In 1917, the conceptual universe included "neurasthenia," "hysteria," or "want of moral fiber."
      *   *Key Distinction:* It is not just that we *judge* them differently; it is that the *thing itself* was constituted differently. The soldier did not experience "psychological trauma" in the way we define it; he experienced a collapse of nerve within a specific moral-military framework.
      *   *Blocking Point:* This is where you block the idea that "facts are stable, only opinions change."
  *   **Layer 3: Evidentiary Instincts (15 mins):** Ask: "If you search the 1917 archives for 'trauma,' what do you find?" (Nothing). "If you search for 'cowardice,' what do you find?" (Thousands of records).
      *   *Takeaway:* Our modern categories blind us to evidence that doesn't fit our taxonomy. We literally cannot see the past clearly if we use our vocabulary to search their records.

  **Why the "Slaveholders Were Bad" Example Fails Here:**
  The slaveholder example isolates *Moral Presentism* successfully but fails *Conceptual Presentism*.
  1.  **Stable Category:** It assumes "slaveholder" is a transhistorical economic category identical to our understanding of property and personhood, without questioning how "freedom," "property," or "kinship" were conceptualized then.
  2.  **No Evidentiary Trap:** Searching for "slave" in 1850 records yields results. It doesn't demonstrate how our *questions* erase evidence. It invites a verdict, not a methodological critique.
  3.  **Moral Clarity:** The moral gap is so wide it distracts from the conceptual gap. Students focus on the *evil* rather than the *epistemology*.

  **45:00–75:00 | Seminar Discussion & Misconception Blocking**
  *   (See Misconception Map below for specific interventions during this block).
  *   Focus on how historians negotiate these categories without falling into relativism.

  **75:00–90:00 | Final Check & Wrap**
  *   Administer the "Category Translation" check (see below).
  *   State the Explicit Exclusion (see below).

  ***

  ### Misconception Map & Blocking Points

  **Misconception 1: "Presentism is just being mean/unfair to the dead."**
  *   **Formation:** During the Activation phase (00:00–15:00). Students think avoiding presentism means being "nice" or "neutral."
  *   **Where to Block:** **15:00–30:00 (Layer 2 of Carrying Case).**
  *   **How:** Explicitly state: "You can be perfectly polite and still be a presentist. If you ask a 12th-century monk why he didn't 'invest in the stock market,' you aren't judging him morally, but you are being conceptually presentist. The error is in the *tool*, not the *tone*."

  **Misconception 2: "If we stop judging, we are objective."**
  *   **Formation:** During Layer 1 (Moral Presentism) discussion. Students believe removing moral judgment reveals the "raw truth."
  *   **Where to Block:** **30:00–45:00 (Layer 3 of Carrying Case).**
  *   **How:** Show the archive search example. Demonstrate that even *description* requires categories. "Describing the soldier as 'mentally ill' is just as much an imposition as calling him 'cowardly.' Objectivity isn't removing categories; it's knowing which categories belong to whom."

  **Misconception 3: "If categories are historical, we can't compare anything (Radical Relativism)."**
  *   **Formation:** During Seminar Discussion (45:00–75:00). Once they realize concepts are loaded, they will argue we can never understand the past.
  *   **Where to Block:** **60:00 (Mid-Discussion).**
  *   **How:** Introduce the "Translation" metaphor. "We cannot think their thoughts, but we can translate them. The goal isn't to stop using modern concepts, but to treat them as *heuristics* rather than *discoveries.* We compare PTSD and Shell Shock not to say they are the same, but to measure the distance between them."

  ***

  ### Final Check for Understanding

  **Do not ask:** "Define presentism." (They will parrot "context matters.")
  **Do ask:** The "Headline Audit."

  **Task:** Provide this modern headline: *"Ancient Roman Emperor Struggles with Depression and Economic Inflation."*
  **Requirement:** Students must write two sentences identifying:
  1.  One instance of **Conceptual Presentism** (e.g., "Depression" as a clinical category vs. *acedia* or melancholy; "Economy" as a distinct sphere vs. household management).
  2.  One specific **Evidentiary Problem** this creates (e.g., "Searching for 'inflation' might miss records about 'coin debasement' or 'grain shortages' because the actors didn't group these under one economic law.").

  **Success Criterion:** They must identify that the *vocabulary* creates the *blind spot*, not just that the judgment is unfair.

  ***

  ### The Explicit Exclusion

  **What to Leave Out:** The strong constructivist claim that **the Archive itself is a presentist artifact.**
  *   **The Debate:** This is the argument that what was saved, cataloged, and preserved was determined by past power structures who were *also* presentist, meaning we have no access to "reality," only layers of curation (Derrida/Featherstone).
  *   **Why Leave It:** It leads to epistemological nihilism ("We can know nothing") which paralyzes second-year students. They need to learn how to *do* history, not deconstruct the possibility of history.
  *   **How to Admit It:** In the final 5 minutes, say: "Today we talked about *your* categories as historians. We are *not* talking about how the archives themselves were built by biased ancestors. That is a deeper problem for third-year theory. For now, assume the evidence exists, but remember your questions dictate what you see."
