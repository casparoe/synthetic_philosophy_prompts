          *   Misconception 2: "Objectivity = No Judgments." -> Block during Conceptual discussion (Show that even description is loaded).
          *   Misconception 3: "Historical Categories = No Comparison/Truth." -> Block at the end (We compare carefully, knowing the distortion).

      *   *Refining the "Leave Out":* The idea that the *archive itself* is a presentist construct (e.g., what was saved was saved by presentist ancestors). This is too deep for 90 mins and leads to nihilism. Stick to the *historian's* categories.

      *   *Refining the Check:* Don't ask "What is presentism?" Ask "Here is a headline about the past using a modern term. What specific research problem does this create?"

  4.  **Final Polish against Constraints:**
