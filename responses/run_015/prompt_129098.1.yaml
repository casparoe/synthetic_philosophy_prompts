      *   *Dependency Chain:* Students need to grasp *Conceptual* presentism to understand why *Moral* presentism is only the tip of the iceberg. Actually, it's often easier to start with Moral (their baseline) and pivot to Conceptual as the deeper issue. However, the prompt asks for the dependency chain of *distinctions*. To understand conceptual presentism, they must first understand that *categories* are not universal. To understand that, they need to see that language/concepts shape reality.
      *   *Carrying Case:* Needs to show both. "Slaveholders were bad" is too simple morally and doesn't show conceptual loading. A better example might be something like "Suicide," "Childhood," "Madness," or "Economy." Let's look for something where the moral judgment relies on a conceptual category that didn't exist.
          *   *Idea:* "Infanticide" or "Child Labor"?
          *   *Idea:* "Homosexuality"? (Foucaultian). Good for conceptual, maybe too charged for moral simplicity.
          *   *Idea:* "Terrorism" vs. "Freedom Fighting"? Too political.
          *   *Idea:* *Postpartum Depression* or *Melancholia*.
          *   *Idea:* *Economic Rationality*. Did ancient Greeks have an "economy"?
          *   *Selection:* **The concept of "Childhood" (specifically regarding labor or marriage).**
          *   *Why?* Moral: We judge past marriage ages as abusive. Conceptual: The category "child" (as distinct from "small adult" or "dependent") is historically contingent. Ariès is the classic reference here.
          *   *Alternative Selection:* **"Suicide" vs. "Self-Murder" vs. "Martyrdom".**
          *   *Alternative Selection:* **"PTSD/Trauma" in WWI soldiers.** (Shell shock).
          *   *Decision:* **WWI "Shell Shock" vs. Modern "PTSD".**
              *   *Moral:* We judge past doctors/armies for mistreating soldiers (cowardice vs. injury).
              *   *Conceptual:* The category of "trauma" or "psychological injury" didn't exist in the same way. The *evidence* looks different because they didn't describe it using our vocabulary. This hits the "evidentiary instincts" point in the prompt.
      *   *Why "Slaveholders" fails:* It isolates moral judgment. It assumes the category "slaveholder" is stable and universally understood as an economic/social role identical to today's understanding of oppression, without questioning how "freedom," "property," or "personhood" were conceptualized then. It doesn't challenge the *tools* of history, just the *verdict*.
      *   *Misconception Map:*
          1.  "Presentism is just being mean/judgmental." (Baseline)
          2.  "If we stop judging, we are objective." (Block 1)
          3.  "Categories are universal tools." (Block 2 - The Conceptual Turn)
          4.  "If categories are historical, we can't know anything/compare anything." (Relativism trap - Block 3)
      *   *Final Check:* Needs to be application-based. Give them a modern category and ask them to find the anachronism.
      *   *Leave Out:* Strong constructivism (archives are purely inventions of power/no access to reality). Keep it at "categories shape inquiry" rather than "truth is impossible."

  3.  **Drafting the Plan (Iterative refinement):**

      *   *Sequence:*
          1.  Activate prior knowledge (Carr/Moral).
          2.  Introduce Carrying Case (Shell Shock/PTSD).
          3.  Dissect Moral layer (easy).
          4.  Dissect Conceptual layer (harder - vocabulary, diagnosis).
          5.  Discuss Evidentiary Instincts (what counts as proof?).
          6.  Block Misconceptions.
          7.  Final Check.
          8.  Limitations (what we aren't doing).

      *   *Refining the Carrying Case:* WWI Shell Shock is strong.
          *   Moral: We condemn the executions of deserters.
          *   Conceptual: We diagnose them with PTSD. But did they experience it as "psychological trauma"? Or was it "neurasthenia" or "cowardice"? If we search archives for "PTSD," we find nothing. If we search for "cowardice," we find trials. Our *question* dictates the *evidence*.
          *   This hits the "evidentiary instincts" requirement perfectly.

      *   *Refining Misconception Blocking:*
