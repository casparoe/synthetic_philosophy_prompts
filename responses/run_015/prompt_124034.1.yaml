answer: |-
  **Project Title:** The Coherence of the Ballot: Testing the Normative Stability of Modern Franchise Reform

  **The Question**
  Can the standard justifications for compulsory voting and franchise expansion be held simultaneously without contradiction?

  Current reform movements often bundle three policies: compulsory voting, lowering the voting age to sixteen, and extending voting rights to resident non-citizens. Politically, these form a coherent "democratic expansion" platform. Normatively, I hypothesize they are unstable. Compulsory voting relies on a *duty* framework (voting as a civic burden owed to fellow members). Franchise expansion relies on a *stake* framework (voting as a protection owed to those subject to coercion). If voting is a duty of membership, extending it to non-members is incoherent. If voting is a protection against coercion, compelling its exercise is incoherent. This project asks whether a consistent justification exists for the current reform bundle, or if drafters must choose between a "Duty/Restricted" model and a "Stake/Voluntary" model.

  **Why Existing Answers Leave This Open**
  The literature treats these reforms in isolation. Political science focuses on empirical outcomes (turnout rates, demographic shifts), treating the justification as secondary to the effect. Philosophy focuses on the "boundary problem" in the abstract (who *should* count), rarely testing specific combinations of existing proposals against each other. Where the two fields intersect, they argue about turnout or abstract affectedness, not about the logical compatibility of concrete legal packages.

  This leaves a gap for the practitioner. A city charter drafter or election lawyer currently has no tool to determine if arguing for compulsory voting undermines their argument for non-citizen voting in the same brief. They operate on political intuition rather than normative consistency. This project moves beyond reporting *that* these reforms are proposed to determine *if* they can be justified together. The answer is determinate: either the justifications can be reconciled under a single principle, or they cannot, and the map of valid combinations will show exactly where the break occurs.

  **Method**
  As a journalist, I will not conduct original survey work or generate new normative theory from scratch. Instead, I will employ a method of conceptual stress-testing using specific legal personas. I will construct a series of intersectional test cases that force the duty and stake justifications to collide:

  1.  **The Sixteen-Year-Old Permanent Resident:** Lived in the city since age three, works part-time, eligible to naturalize at eighteen. Does the duty of membership apply before naturalization? Does the stake of coercion apply before adulthood?
  2.  **The Conscientious Objector:** A middle-aged citizen who accepts the state's authority but refuses to vote on moral grounds, willing to pay the fine. If voting is a protection, can it be waived? If it is a duty, is the fine a tax or a penalty?
  3.  **The Undocumented Parent:** Long-term resident with no legal status, children are citizens. If the stake is "subject to law," does deportation risk increase or decrease the obligation to vote?

  I will analyze these cases against the standard justifications to see which verdicts each justification yields. I will then interview legal drafters and policy advocates to see if they recognize these tensions or if they rely on unstated premises to bridge them. The goal is not to measure public opinion, but to audit the logic of the arguments currently in use.

  **Deliverables**
  1.  **The Feature (General Audience):** A narrative exploration of the "Progressive Paradox." It will humanize the test cases and explain why the coalition for democratic reform might be arguing past itself. This addresses the magazine's need for engagement without resorting to the "turnout decline" story, which treats symptoms rather than causes.
  2.  **The Working Paper (Policy Institute):** A "Normative Compatibility Map." This will be a decision matrix for election law drafters. It will list standard justifications (Duty, Stake, Capacity) in rows and reforms (Compulsion, Age Lowering, Non-Citizen Voting) in columns. It will indicate which cells are compatible and which are not. For example: *If you argue for Compulsion on Duty grounds, you cannot argue for Non-Citizen Voting on Stake grounds without contradiction.* This provides a tool for drafting coherent legislation rather than politically convenient bundles.

  **Conditions for Failure**
  I define failure not as finding a negative result, but as finding that the tension is illusory or unmanageable.
  1.  **Complementarity:** If I find that "Duty" and "Stake" can be easily synthesized into a hybrid justification that supports the whole bundle without strain, the core hypothesis is false.
  2.  **Political Mirroring:** If the Compatibility Map merely reproduces the existing political bundling (e.g., "Left supports all, Right supports none") without revealing internal logical tensions, the project adds no value to drafters.
  3.  **The Competence Collapse:** If it turns out that *only* the competence threshold (age) matters and the duty/stake distinction is merely rhetorical decoration, the project's scope is too narrow.
  4.  **Boundary Explosion:** If the stake principle inevitably expands to future generations, prisoners, or corporations, and I cannot find a principled stopping point, the working paper becomes useless for drafters who need clear lines.

  **Scope and Limitations**
  This is a nine-month, one-person project by a journalist, not a tenured theorist.
  *   **What I cannot do:** I will not produce a comprehensive history of franchise law, nor will I empirically measure the impact of these reforms on governance quality. I am auditing arguments, not outcomes.
  *   **What I would cut first:** If the scope proves too broad, I will cut the comparative legal analysis of specific jurisdictions (e.g., detailed case studies of Australian compulsion vs. Swiss local non-citizen voting). I will retain the conceptual test cases and the logic map, as these are the core value for the drafter. The specific jurisdictional examples will become illustrative anecdotes in the feature rather than data points in the paper.

  This project offers the committee a determinate answer to a question practitioners face but lack the vocabulary to ask. It transforms a political bundle into a logical problem, providing a tool for those who actually write the rules.
