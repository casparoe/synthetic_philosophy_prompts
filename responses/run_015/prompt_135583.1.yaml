      *   *Rigging:* The case is designed to make the human look passive and the non-human look active. This challenges Camp A's intuition (humans = actors) and Camp P's intuition (difference makers = actors). Actually, it challenges Camp A more because it strips the human of discretion. It challenges Camp P less. I need to note this asymmetry.

