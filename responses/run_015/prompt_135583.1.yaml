  9.  **Final Polish:** Ensure the distinction between "cause" (neutral) and "actor" (contested) is maintained in the Agreed Claims, but the term "actor" is used in the Disagreements. Ensure the "Rigging" analysis is honest. (Self-Correction: The prompt asks me to draft the statement *they* sign. The analysis of rigging should probably be part of the document's methodological notes, signed by both, acknowledging the limitations of their own tools.)

      *Wait, one nuance on the Magistrate Case:*
