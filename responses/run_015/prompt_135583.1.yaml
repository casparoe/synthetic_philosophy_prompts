      *   *Camp P (Parity/Flat Ontology):* Focuses on *causal efficacy*. If $X$ changes the outcome and isn't just a proxy for human will, $X$ is an actor. Risk: Determinism, removing moral responsibility.
      *   *Camp A (Accountability/Humanism):* Focuses on *moral/legal/semantic agency*. Only things that can be "answered" are actors. Risk: Anthropocentrism, ignoring material constraints, political exculpation of humans.
