answer: |-
  # JOINT STATEMENT ON NON-HUMAN AGENCY IN HISTORICAL EXPLANATION
  **Adversarial Collaboration Group: History & Materiality**
  **Date:** October 24, 2023
  **Signatories:** Camp P (Causal Parity), Camp A (Accountability & Address)

  ## 1. AGREED CLAIMS REGARDING CAUSALITY AND EXPLANATION

  We, the undersigned, acknowledge that while we disagree on the ontology of "actorhood," we share a commitment to empirical rigor regarding how material and human forces interact. We affirm the following substantive claims:

  1.  **Difference-Making is Necessary but Not Sufficient for Consensus:** We agree that for any element (human or non-human) to enter a historical explanation, it must satisfy a counterfactual test: had this element been absent or significantly altered, the outcome would have been different. However, we disagree on whether passing this test automatically confers the status of "actor."
  2.  **Overdetermination and Timing:** We agree that causal efficacy is time-sensitive. A non-human factor (e.g., an epidemic) that arrives *after* a decisive human event (e.g., a garrison's surrender) is not a cause of that event, regardless of its lethality. Explanations that cite such factors as causes of the prior event are empirically false, not just ontologically disputed.
  3.  **Mediated Interaction:** We agree that non-human impacts are rarely uniform. The same pathogen or rainfall shift produces divergent outcomes depending on human-constructed variables (housing density, nutritional baselines, logistical infrastructure). An explanation that cites a pathogen without citing the human structures that mediated its lethality is incomplete.
  4.  **Criteria for Bad Environmental Explanation:** We agree that an environmental explanation is defective when it moves from a specific causal chain (e.g., "drought reduced yield by X%") to a generalized essentialism (e.g., "the tropics induce lethargy"). The slide from *climate as a constraint* to *climate as a character trait* is a methodological failure both camps reject.
  5.  **The Symmetry Audit:** We agree to employ the **Symmetry Audit** as a diagnostic tool. For every explanation citing a non-human cause, we must ask: *What human cause of identical counterfactual magnitude would have been written up as a cause rather than a condition?* If the answer is "none," this registers as a strike against the explanation's neutrality, requiring justification for why the non-human element is being treated differently than a human equivalent would be.
      *   *Joint Note on Rigging:* We acknowledge this audit may be rigged in favor of Camp P. It presupposes a human equivalent always exists. **Repair:** If no human equivalent exists, the historian must explicitly justify why the unique non-human difference-maker remains a "condition" rather than an "actor," rather than defaulting to tradition.

  ## 2. DISAGREEMENTS TABLE

  | The Crux | Camp P Formulation (Parity) | Camp A Formulation (Accountability) | Agreed Test / Case | Camp P Prediction | Camp A Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Responsiveness to Reasons** | Actorhood does not require responsiveness to reasons. A thing is an actor if it disrupts the causal field in a way not fully reducible to prior human intent. | Actorhood requires the *capacity* to be addressed, answered, or held to account. A thing that cannot register a reason cannot be an actor, regardless of causal impact. | **Textual Analysis:** Compare two historical narratives of the same event. One grants grammatical agency to a virus ("The virus invaded..."); the other to a general ("The general invaded..."). | Camp P predicts the "virus" narrative will yield higher empirical accuracy regarding transmission vectors and mortality rates. | Camp A predicts the "general" narrative will yield higher accuracy regarding containment decisions and resource allocation. |
  | **2. Sensitivity to Consequences vs. Reasons** | Sensitivity to consequences (e.g., viral mutation under immune pressure) constitutes a weak grade of agency. It distinguishes a virus from a volcano, but both are actors compared to a static rock. | Sensitivity to consequences without reasons is mechanism, not agency. A virus evolving is no more an "actor" than a volcano erupting; both are blind forces. | **Comparative Case:** A history of colonial collapse attributed to viral mutation vs. a history of colonial collapse attributed to volcanic cooling. | Camp P predicts the viral explanation will require more "actor-like" language (strategy, adaptation) than the volcanic one, creating a valid spectrum of agency. | Camp A predicts both explanations will rely on metaphorical agency, and treating the virus as an actor obscures the human failure to adapt to *both* threats equally. |
  | **3. Explanation vs. Blame** | Explanation describes what happened. Blame is a secondary ethical layer. Conflating the two protects human ego by denying material causality. | Explanation structures moral perception. To describe a non-human as an "actor" is to redistribute blame. You cannot separate the ontology from the ethics. | **The Closed-Magistrate Case (1816):** A magistrate sentences grain rioters under a mandatory guideline (no discretion). The rioting was caused by harvest failure due to volcanic cooling. **Question:** Who is the actor? | **Prediction:** The **Eruption** is the primary actor; the Magistrate is a transmission mechanism. The eruption made the difference; the magistrate could not have done otherwise. | **Prediction:** The **Magistrate** is the actor; the Eruption is a condition. Only the magistrate can be addressed (even to protest the law). To call the eruption an actor exculpates the legal system that enforced the sentence. |
  | **4. The Symmetry Audit (Application)** | If a human decision of identical causal weight is called an "actor," a non-human cause must be too. Withholding the term is anthropocentric bias. | If a human decision is called an "actor" because they are accountable, a non-human cause is not an "actor" even if causal weight is identical. Accountability is the filter, not weight. | **Application:** Apply the Audit to the Closed-Magistrate Case. | Camp P predicts the Audit will reveal we treat the Magistrate as an actor solely due to species bias, as his causal weight is lower than the volcano's. | Camp A predicts the Audit will reveal we treat the Magistrate as an actor because the *social practice* of history is about judging human institutions, not natural forces. |

  *Joint Note on Rigging (Closed-Magistrate):* We acknowledge this case is rigged in favor of Camp A. It selects a human stripped of discretion to make human agency look passive, while selecting a natural event that initiated the chain to make nature look active. **Repair:** In future iterations, we must also test a "Rogue Magistrate" case (high discretion, low environmental pressure) to ensure we are not simply selecting cases that fit our priors.

  ## 3. FALSIFICATION CONDITIONS

  **Camp P (Parity) accepts the following as evidence against its view:**
  If it can be demonstrated that employing "actor" language for non-humans systematically reduces the historian's ability to identify points of *intervention* for preventing future harm. Specifically, if narratives that treat pathogens as actors lead to policy recommendations that focus on "negotiating with nature" rather than "managing human exposure," and this leads to verifiable increases in mortality compared to narratives that treat pathogens as conditions, Camp P will concede that the terminology carries unacceptable pragmatic costs.

  **Camp A (Accountability) accepts the following as evidence against its view:**
  If it can be demonstrated that restricting "actor" language to humans systematically leads to empirical errors in causal modeling. Specifically, if narratives that treat volcanic eruptions solely as "background conditions" fail to predict the *timing* and *distribution* of social unrest as accurately as narratives that grant the eruption "actorial" status (i.e., treating it as an independent variable initiating the sequence), Camp A will concede that their ontological restriction blinds the historian to material reality.

  ## 4. CLOSING: VERBAL VS. SUBSTANTIVE AND FUTURE DIRECTIONS

  **On the Nature of the Dispute**
  We recognize that a portion of this dispute is verbal. Both camps agree on the physical sequence of events in the Closed-Magistrate Case (Volcano $\rightarrow$ Famine $\rightarrow$ Riot $\rightarrow$ Sentence). We agree on the counterfactuals. The disagreement lies in the *label* "actor" and the *normative consequences* of applying that label. However, we reject the notion that this makes the dispute trivial. Language shapes attention. If Camp P is right, Camp A's language hides causal powers. If Camp A is right, Camp P's language hides moral responsibilities. This is a substantive dispute about the *function* of historical writing.

  **Criteria for Continued Collaboration**
  For this collaboration to merit a second year, we must move beyond agreeing to disagree on definitions. We require one of the following findings:
  1.  **Predictive Divergence:** We must identify a specific historical case where Camp P's methodology generates a testable hypothesis about archival evidence (e.g., "look for shipping logs here") that Camp A's methodology explicitly discourages, and then verify which hypothesis was correct.
  2.  **Ethical Impact Data:** We must commission a study of how readers (students, policymakers) respond to "Parity" texts vs. "Accountability" texts. If one style consistently leads to greater civic engagement or more accurate risk assessment, that pragmatic utility will settle the ontological debate.

  Without such findings, we risk producing a taxonomy of preferences rather than a tool for knowledge.

  ***

  **Signed,**

  _________________________
  *Lead Historian, Camp P*

  _________________________
  *Lead Historian, Camp A*
