answer: |-
  A provision shall be retained unless the staff can positively identify its current safety function and demonstrate that function is either obsolete, fully duplicated by newer requirements without gap, or outweighed by the cost of compliance, except where the provision's origin is proven exclusionary and its function can be migrated to neutral criteria.

  ### The Chesterton Audit Procedure

  **Step 1: Function Identification**
  *   **Question:** What specific hazard does this provision mitigate, and by what mechanism?
  *   **Sufficient Answer:** A technical statement linking the requirement to a failure mode (e.g., "Prevents flashover by limiting fuel load" or "Ensures egress visibility during smoke logging").
  *   **Failure:** Answers citing only "historical precedent," "standard practice," or "committee recommendation" without mechanistic linkage.
  *   **Timeout:** If the mechanism cannot be articulated within 10 minutes of research, mark Function as "Unverified." **[JUDGMENT]** Deciding that 10 minutes is sufficient to exhaust available knowledge assumes the rationale is discoverable within staff resources rather than buried in lost history.
  *   **Action on Failure/Timeout:** Proceed to Step 2, but flag the provision as "High Uncertainty."

  **Step 2: Redundancy and Obsolescence Check**
  *   **Question:** Is the identified function fully achieved by a newer or parallel requirement that remains in force?
  *   **Sufficient Answer:** A mapping showing the newer provision covers the same hazard space with equal or greater reliability (e.g., "Automatic suppression activates faster than manual pull station").
  *   **Failure:** Assumptions that different systems achieve the same outcome (e.g., assuming suppression equals notification) without evidence of functional overlap. **[JUDGMENT]** Determining functional equivalence between different safety systems relies on engineering intuition that may overlook edge cases.
  *   **Timeout:** If cross-referencing takes longer than 10 minutes, mark Redundancy as "Unconfirmed."
  *   **Action on Failure/Timeout:** Assume redundancy does not exist.

  **Step 3: Ecosystem Dependency Scan**
  *   **Question:** What external processes cite this specific provision text or number?
  *   **Sufficient Answer:** A list of dependent documents (inspection checklists, insurance policies, licensing exams, other code sections) and an assessment of the cost to update them.
  *   **Failure:** Assuming that because the code is the primary authority, other documents will automatically align.
  *   **Timeout:** If a full scan is impossible, sample the top three known dependencies (e.g., state licensing, major insurance underwriters). **[JUDGMENT]** Selecting which dependencies to sample assumes some stakeholders matter more than others.
  *   **Action on Failure/Timeout:** If any sampled dependency relies on the text, mark "High Fragmentation Risk."

  **Step 4: Origin and Legitimacy Gate**
  *   **Question:** Why was this provision adopted, and is the origin legitimate?
  *   **Sufficient Answer:** Documented rationale showing safety intent.
  *   **Failure:** No documentation, or documentation revealing non-safety intent (e.g., economic protectionism, exclusion of specific workers).
  *   **Distinct Branch (Exclusionary Origin):** If evidence shows the provision was adopted to exclude a class of workers or competitors rather than for safety:
      *   **Test:** Does the provision still perform a verifiable safety function today?
      *   **If Yes:** Origin is not decisive for deletion, but is decisive for text. The provision cannot be "Retained as Written." It must be "Re-found."
      *   **If No:** The provision is a candidate for "Delete."
      *   **[JUDGMENT]** Determining whether a safety function is "real" or merely a pretext for exclusion requires weighing current technical utility against historical intent.
  *   **Timeout:** If origin is unknown, proceed assuming legitimacy but lower confidence.

  **Step 5: Cost-Uncertainty Weighing (Stopping Rule)**
  *   **Question:** Does the cost of further research exceed the value of the deletion?
  *   **Calculation:** Estimate annual compliance cost of the provision multiplied by the number of affected projects. Compare this to the staff time remaining.
  *   **Stopping Rule:** If the Function is "Unverified" or "High Uncertainty" after 30 minutes of staff prep time, the audit stops. The risk of deleting a latent safety requirement (non-event risk) outweighs the known cost of compliance.
  *   **Action:** Default to "Retain" or "Hold." **[JUDGMENT]** This rule prioritizes safety uncertainty over economic efficiency, embedding a conservative bias into the code.

  **Verdict Definitions**
  1.  **Delete:** Function identified and proven obsolete or duplicated; no ecosystem fragmentation; origin legitimate. **Commitment:** Staff must draft the consequential amendments to dependent documents.
  2.  **Retain as Written:** Function vital or unknown; deletion risk too high; origin legitimate. **Commitment:** Staff defends the uncertainty against appeals using the Chesterton principle.
  3.  **Re-found:** Function vital, but text or origin flawed (includes exclusionary origin). **Commitment:** Committee must rewrite the provision to match the function without the historical baggage; this requires more committee time than retention.
  4.  **Hold to Next Cycle:** Function unknown, but specific data path exists (e.g., "Awaiting test data from Lab X"). **Commitment:** Staff must schedule the specific follow-up; if no specific task is assigned, this verdict is evasion.

  ---

  ### Worked Cases

  **Case A: Manual Alarm Pull Stations (1950s)**
  *   **Step 1 (Function):** Staff identifies function as "Occupant Notification," distinct from "Fire Suppression" (sprinklers). **Status:** Verified.
  *   **Step 2 (Redundancy):** Sprinklers suppress fire but do not alert sleeping occupants or those away from the fire origin. **Status:** Not Redundant.
  *   **Step 3 (Ecosystem):** Provision cited in state licensing exams and insurance checklists. **Status:** High Fragmentation Risk.
  *   **Step 4 (Origin):** Unknown (report missing). **Status:** Unverified.
  *   **Step 5 (Stopping Rule):** Function is known, so uncertainty is low. Compliance cost is low relative to safety function.
  *   **Verdict:** **Retain as Written.**
  *   **Rationale:** Absence of incident data is not evidence of absence of function (non-event problem). Notification and suppression are distinct safety layers. Deletion would orphan licensing and inspection protocols.

  **Case B: Exterior Wall Joint Sealing (1978)**
  *   **Step 1 (Function):** Staff searches for fire spread mechanism related to this joint. No engineering papers found. Original rationale is "Recommended by Committee." One retired inspector letter claims "it matters." **Status:** Unverified.
  *   **Step 2 (Redundancy):** Cannot assess without function. **Status:** Unconfirmed.
  *   **Step 3 (Ecosystem):** Unknown if cited elsewhere. **Status:** Unknown.
  *   **Step 4 (Origin):** Legitimate intent assumed, but documentation thin. Proposer is manufacturer with conflicting product. **Status:** Low Confidence.
  *   **Step 5 (Stopping Rule):** 30 minutes elapsed. Function remains unknown. Compliance cost of sealing is moderate. Risk of deleting a fire-stop unknown.
  *   **Verdict:** **Retain as Written.**
  *   **Staff Dossier Note:** "Audit stalled at Step 1. No mechanistic rationale found in file. Inspector anecdote is not data. Proposer has conflict of interest. Under Stopping Rule, uncertainty favors retention. We cannot prove this is safe to delete. File attached shows 1978 memo only. No incident data exists, but absence of data is not data of absence. Recommendation: Retain until proponent provides test data showing joint sealing is unnecessary."
  *   **Note:** This verdict is unpopular. It retains a requirement that looks like dead wood because the burden of proof for deletion (positive safety assurance) was not met.

  **Case C: Exclusionary Workforce Provision**
  *   **Step 1 (Function):** Staff identifies function as "Ensuring competency of installers for high-risk systems." **Status:** Verified.
  *   **Step 2 (Redundancy):** No other provision verifies competency for this specific system. **Status:** Not Redundant.
  *   **Step 3 (Ecosystem):** Workforce is thin; licensing boards rely on this text. **Status:** High Fragmentation Risk.
  *   **Step 4 (Origin):** Documented evidence shows provision was adopted to exclude a specific class of workers (e.g., non-union or specific trade) rather than ensure competency. **Status:** Exclusionary Origin.
  *   **Step 5 (Stopping Rule):** Function is real, but origin is illegitimate.
  *   **Verdict:** **Re-found.**
  *   **Rationale:** Origin is not decisive for deletion because the safety function is real and the workforce is thin (deletion creates safety gap). However, origin is decisive for text. The provision cannot be retained as written. Committee must rewrite the requirement to focus on performance-based competency standards rather than the historical exclusionary criteria.

  ---

  ### Failure Modes

  **1. The Retention Tilt**
  The procedure's stopping rule defaults to retention when uncertainty exists. This protects safety but accretes dead provisions. Over cycles, the code will grow heavier because "unknown" is more common than "proven obsolete." This is a feature, not a bug, of the Chestertonian approach, but it conflicts with the goal of simplification. To mitigate, the organization must fund a separate "Sunset Commission" with a longer timeline to research high-cost retained provisions outside the 30-minute staff limit.

  **2. The "Hold" Evasion**
  The "Hold to Next Cycle" verdict is most likely to be abused. Staff may use it to avoid making a hard recommendation on controversial items. To prevent this, the procedure requires a specific task assignment (e.g., "Contact Lab X") with the verdict. If the task is vague ("Research further"), the verdict defaults to "Retain."

  **3. The Non-Event Blindness**
  The procedure explicitly states absence of incident data is not evidence of absence of function. However, volunteers may ignore this and vote to delete based on "no fires reported." The dossier must highlight this distinction in bold, but committee psychology often favors visible cost savings over invisible risk prevention.

  **4. The Exclusionary Trap**
  In Case C, the procedure forces a "Re-found" verdict rather than deletion. This preserves the safety function but requires significant committee labor to rewrite. If the committee lacks the technical capacity to write neutral criteria, the provision may linger in limbo, or the rewrite may inadvertently reintroduce exclusionary barriers under new language. **[JUDGMENT]** Deciding that safety function outweighs illegitimate origin assumes safety is the paramount value, which may conflict with social equity goals if the exclusionary effect persists in practice.
