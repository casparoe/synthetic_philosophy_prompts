  5.  **Self-Correction/Nuance Check during Drafting:**

      *   *Correction:* I must be careful not to conflate Popper with Goodman. Popper uses the Black Swan for falsificationism. Goodman uses it for the *projection* problem. I need to keep the focus on Goodman.
      *   *Nuance:* Goodman's entrenchment is about *past projection*. Since "swan" was projected onto white birds, and "white" was projected onto swans, both are entrenched. Why did "swan" win? Goodman might argue "swan" is a broader category with more diverse projections in other contexts, or that "white" is a property *of* the subject, not the subject itself. I need to highlight where Goodman's theory feels thin here. It treats "swan" and "white" as logically symmetrical predicates, but taxonomically they are not.
      *   *Grue-analogue:* In the Black Swan case, the analogue would be "All swans are *westralian-black* and *european-white*". Or time-based: "All swans are white before 1697". The naturalists rejected this. Goodman explains this via entrenchment (we don't use time-dependent predicates).

