answer: |-
  The encounter between Willem de Vlamingh's Dutch expedition and the *Cygnus atratus* on the Swan River in 1697 stands as one of the most celebrated episodes in the history of natural science. Traditionally, this event is marshalled as the paradigmatic example of Popperian falsification: the universal generalisation 'all swans are white' was decisively refuted by a single counter-instance. However, when viewed through the lens of Nelson Goodman's 'new riddle of induction', the episode transforms from a simple story of empirical refutation into a complex problem of predicate projection. Goodman's inquiry, articulated in *Fact, Fiction, and Forecast* (1955), asks not merely how we confirm hypotheses, but why we project certain predicates into the future while rejecting others that are logically equivalent. By analysing the Black Swan discovery as a case study for Goodman's theory of entrenchment, one may discern both the explanatory power of his linguistic approach and its limitations when confronted with the ontological commitments of biological taxonomy.

  To understand the inductive structure held by seventeenth-century naturalists, one must look beyond the simplistic formulation 'all swans are white'. In Goodman's terminology, the naturalists were engaged in the projection of specific predicates onto future instances based on past evidence. Let us define the predicate $S$ as 'is a swan' and $W$ as 'is white'. The inductive habit established by European observation was the projection of the compound hypothesis $\forall x (Sx \rightarrow Wx)$. However, Goodman reminds us that for any supported hypothesis, there are conflicting hypotheses that are equally supported by the same evidence. Prior to 1697, a naturalist could have equally projected a *grue*-analogue predicate. Let us define 'whack' as applying to all swans examined before 1697 if they are white, and to swans examined thereafter if they are black. Since all swans examined prior to Vlamingh's voyage were white, the evidence supported 'all swans are white' and 'all swans are whack' equally well. The inductive structure was not merely a belief in a biological fact, but a commitment to projecting the predicate 'white' rather than 'whack', and to projecting the kind-term 'swan' independently of its colour.

  When Vlamingh's men captured the black-plumaged birds, the immediate philosophical crisis was not simply that a generalisation was false, but that a choice had to be made regarding which predicate to retain and which to discard. The discovery falsified the conjunction of 'swan' and 'white' as necessarily co-extensive. The naturalists faced a dilemma: they could retain the predicate 'white' as essential and reclassify the Australian birds as non-swans (perhaps a new genus of waterfowl), or they could retain the predicate 'swan' and discard 'white' as an accidental property. Historically, they chose the latter. The question for Goodman is: why?

  According to Goodman's account, the decision rests on the entrenchment of predicates. A predicate is projectible if it has a history of successful projection in past inductive practices. Goodman would argue that the predicate 'swan' was more deeply entrenched than the predicate 'white swan' (used as a definition). The term 'swan' (or *cygnus*) had a lineage of usage rooted in morphological descriptions—curved necks, specific bill shapes, and webbed feet—that existed independently of colour in the broader conceptual schema of ornithology, even if all actual instances happened to be white. Conversely, 'white' was a predicate applied to many kinds (snow, paper, other birds) and was not entrenched as a *defining* condition of the kind 'swan'. Therefore, when the conflict arose, the linguistic habit favoured preserving the more entrenched kind-term 'swan' and treating 'white' as a variable attribute. This explains why naturalists revised the colour claim rather than redefining 'swan' to mean 'white swan'; the latter would have required a violent disruption of the established linguistic practice regarding the term 'swan'.

  Furthermore, Goodman's framework succeeds admirably in explaining why *grue*-like predicates were never seriously entertained by the naturalists. No one proposed that 'all swans are white until 1697, and black thereafter'. Such a hypothesis relies on a time-dependent predicate, which Goodman classifies as non-projectible because it lacks entrenchment. The naturalists did not assume the colour change was a function of the date of discovery; they assumed the colour was a function of the bird's nature. Goodman's theory elucidates why the inductive inference jumped from 'observed swans are white' to 'unobserved swans may be white or other colours' rather than to 'unobserved swans are white unless observed after 1697'. The rejection of the time-dependent predicate is a rejection of a non-entrenched linguistic construction, aligning perfectly with Goodman's assertion that induction is governed by the habitual use of language.

  However, the Black Swan episode also reveals where Goodman's logical analysis is silent or strained, particularly regarding the taxonomic decision to preserve the kind-term. Goodman treats the entrenchment of 'swan' as a matter of linguistic history—a brute fact about how often the word has been used. Yet, the naturalists' decision to classify *Cygnus atratus* as a swan was not merely a matter of linguistic conservatism; it was driven by extra-linguistic criteria. The decision relied on morphological similarity, reproductive compatibility, and what we would now term phylogenetic relatedness. The predicate 'swan' was preserved not simply because it was a familiar word, but because it tracked a natural kind. Goodman's framework struggles to account for *why* 'swan' is more entrenched than 'white'. He posits entrenchment as the starting point, but he does not explain the underlying causes of that entrenchment. In this case, the entrenchment of 'swan' derives from the biological reality that shape and lineage are more stable indicators of identity than plumage colour. Goodman's analysis captures the *mechanism* of the revision (predicate selection) but remains agnostic regarding the *justification* for the hierarchy of predicates.

  This leads to a critical assessment of whether the episode supports Goodman's view that induction is fundamentally a problem of linguistic habit. In one sense, it does: the scientific community did not abandon the word 'swan', nor did they adopt a *grue*-style logic, demonstrating that inductive validity is tied to the stability of our conceptual scheme. However, the episode ultimately suggests that biological taxonomy relies on criteria that Goodman's logical analysis does not fully capture. If induction were solely a matter of linguistic habit, there would be no rational ground to prefer 'swan' over 'white bird' other than frequency of usage. Yet, naturalists acted as if 'swan' referred to something real—a biological essence—that made colour accidental. This implies a form of scientific realism wherein the projectibility of a predicate is determined by its correspondence to the causal structure of the world, not merely its past usage in language.

  In conclusion, Willem de Vlamingh's encounter with the Black Swan offers a nuanced validation of Nelson Goodman's new riddle. It confirms Goodman's insight that inductive inference is not a raw logical operation but a process of selecting projectible predicates based on entrenchment. The naturalists' refusal to adopt *grue*-like analogues and their decision to discard the colour property rather than the kind-term align with Goodman's emphasis on linguistic habit. Nevertheless, the episode exposes the limits of a purely linguistic account. The entrenchment of the predicate 'swan' was not arbitrary; it was underwritten by morphological and biological realities that Goodman's formalism treats as external. Thus, while Goodman correctly identifies that induction requires a filter of predicate selection, the Black Swan suggests that this filter is calibrated not just by the history of our language, but by the structure of the natural world itself.
