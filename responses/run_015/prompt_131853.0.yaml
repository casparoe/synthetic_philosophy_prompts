answer: |-
  ### The Subsumption & Intellect Protocol (SIP)

  **Preamble: The Stance**
  We are not evaluating efficiency; we are evaluating relations of production. In a capitalist firm, technology is a weapon to discipline labour and extract surplus value. In a co-op, technology must be a tool to expand collective autonomy. Ownership of the machine is necessary but insufficient. If the machine dictates the pace of work, hides its own logic, or creates a hierarchy of knowledge, you have not escaped capitalism; you have merely become your own capitalist. This procedure assumes that *Real Subsumption* (where the machine masters the worker) is the enemy, and the *General Intellect* (social knowledge) must remain accessible to all members, not encoded into a black box.

  **Time Allocation:** 30 Minutes maximum.
  **Facilitator:** One board member (rotating).
  **Voting:** Consensus required on Stage 4; Majority on Stages 1–3.

  ---

  ### Part 1: The Checklist

  #### Stage 1: The Surveillance & Discipline Test (Formal Subsumption)
  *Goal: Detect if the technology is being used to intensify labour or monitor bodies rather than assist tasks.*

  1.  **Question:** Does the system collect data on individual worker movement, speed, or location that is not strictly necessary for the technical function of the machine?
      *   **Pass:** No data collected, or data is aggregated/anonymous.
      *   **Fail:** Individual tracking, timing, or location logging.
      *   **Action:** If **Fail**, immediate **REJECT**. This is Formal Subsumption (capitalist discipline).
  2.  **Question:** Who holds the administrative keys to this data?
      *   **Pass:** Rotating access among all members; logs visible to the whole floor.
      *   **Fail:** Held by management, a specific technician, or an external vendor.
      *   **Action:** If **Fail**, immediate **REJECT**.

  #### Stage 2: The Black Box Test (General Intellect)
  *Goal: Determine if social knowledge is being alienated into the machine.*

  3.  **Question:** If the machine breaks or needs reprogramming, can the average member fix it, or does it require a specialist?
      *   **Pass:** Documentation is open; repair skills are part of standard induction; no external proprietary dependencies.
      *   **Fail:** Requires a specific 'expert' member or external contractor; code is closed/proprietary.
      *   **Action:** If **Fail**, proceed to Stage 3 with a **WARNING FLAG**. (This risks creating a technical aristocracy).
  4.  **Question:** Does the machine reduce the worker's understanding of the process (deskilling), or does it remove drudgery while leaving conceptual control with the worker?
      *   **Pass:** Removes repetitive strain/danger; worker sets parameters.
      *   **Fail:** Worker becomes a feeder/monitor; machine sets parameters.
      *   **Action:** If **Fail**, immediate **REJECT**. This is Real Subsumption.

  #### Stage 3: The Redundancy & Leisure Test (Value Hand-off)
  *Goal: Address the material consequence of increased productivity.*

  5.  **Question:** Does this automation render specific roles or hours redundant?
      *   **No:** Proceed to Stage 4.
      *   **Yes:** You must answer 5b.
  6.  **Question (5b):** Is there a binding agreement that the productivity gain will be distributed as **reduced hours for all members at the same pay**, rather than redeployment or growth?
      *   **Pass:** Yes, written into the budget/contract.
      *   **Fail:** No, or "we will see," or "we will grow the co-op to absorb the labour."
      *   **Action:** If **Fail**, immediate **REJECT**. (Taking efficiency without distributing leisure is capitalist accumulation).

  #### Stage 4: The Value Judgement (The Political Vote)
  *Goal: Acknowledge where procedure ends and politics begins.*

  7.  **Question:** Even if the machine passes Stages 1–3, does its presence change the *character* of the workshop from a place of repair to a place of processing?
      *   **Note:** This is not a fact. This is a judgement on the 'soul' of the co-op.
      *   **Action:** Open floor debate. 75% majority required to override a WARNING FLAG from Stage 2.

  ---

  ### Part 2: Where the Procedure is a Sham
  *Honesty Check for the Board*

  *   **Stage 2, Question 3 is a lie.** We pretend "average members" can maintain complex tech. In reality, some members *will* know more. The procedure cannot prevent a technical hierarchy, only highlight it.
  *   **Stage 3, Question 6 is the choke point.** Market competition often makes reducing hours impossible. If you reject efficient tech because you can't afford leisure, you may go bankrupt. If you accept it, you betray the principle. The procedure cannot solve this contradiction; it only forces you to admit it.
  *   **Stage 4 is pure politics.** There is no Marxist formula for the "character" of the workshop. This is where you decide what kind of people you want to be, not what kind of workers you are.

  ---

  ### Part 3: Application to Current Proposals

  #### Case 1: AI Shift-Scheduling Tool (Tracks Location)
  *   **Stage 1:** **FAIL.** It tracks worker location. This is surveillance pure and simple. It treats the worker's body as a variable to be optimised.
  *   **Verdict:** **REJECT.**
  *   **Reasoning:** This is Formal Subsumption. It imposes capitalist discipline on a cooperative body. Even if the data is 'owned' by the co-op, the *relation* is one of watcher and watched. It turns the planning board into management and the floor into subjects. Do not buy it.

  #### Case 2: Collectively Programmed CNC Lathe
  *   **Stage 1:** **PASS.** No surveillance; machine logs are technical, not personnel-based.
  *   **Stage 2:** **PASS (with caveats).** Members maintain it together. Code is open. However, be warned: CNC programming is a high-skill activity. Unless you rotate the programming duty, you will create a class of 'programmers' and 'feeders'.
  *   **Stage 3:** **PASS.** It augments metal cutting, does not remove roles.
  *   **Stage 4:** **PASS.**
  *   **Verdict:** **ACCEPT.**
  *   **Reasoning:** This approximates the appropriation of the General Intellect. The knowledge is embedded in the machine but retained by the collective. It removes dangerous/manual drudgery while keeping conception (programming) in the hands of the workers. *Condition:* You must institute a rotation schedule for programming duties to prevent skill hoarding.

  #### Case 3: Open-Source Automated Parts Sorter (Makes 2 Roles Redundant)
  *   **Stage 1:** **PASS.** Open-source, no surveillance.
  *   **Stage 2:** **PASS.** Members can maintain it; removes dull sorting work.
  *   **Stage 3:** **FAIL.** It makes two sorting roles redundant. You have not presented a binding agreement to reduce hours for *all* members to absorb this surplus capacity. Your proposal suggests "redeploying" them to sales or intake.
  *   **Verdict:** **REJECT.** (This is the answer you won't like).
  *   **Reasoning:** You are proposing to increase the organic composition of capital without changing the relation to time. If you deploy those two members elsewhere, you are effectively expanding production to absorb the labour. This is growth for growth's sake, driven by the market, not human need.
      *   *The Hard Truth:* Under Marx, the dividend of automation is **leisure**, not new work. If you cannot guarantee that the two saved roles translate into shorter weeks for everyone, you are using socialist technology to pursue capitalist accumulation. You are acting like a firm, not a commune. Unless you can commit to a 4-day week or equivalent hour reduction for the *entire* membership to absorb the slack, this machine is counter-revolutionary. It creates a reserve army of labour within your own workshop.

  ---

  ### Part 4: What This Procedure Cannot Settle

  I must be clear about the limits of this framework.

  1.  **Market Coercion:** The procedure assumes you have the market power to reduce hours without losing viability. You probably don't. If you reject the Sorter, a competitor might undercut you. Marx did not write a manual for surviving in a capitalist market while trying to be post-capitalist. This procedure protects your soul, not your balance sheet.
  2.  **The Definition of 'Drudgery':** Stage 2 asks if the machine removes drudgery. One person's drudgery is another's meditative rhythm. The procedure forces a vote, but it cannot objectively measure alienation.
  3.  **The Technical Aristocracy:** I have flagged the risk in the CNC case, but the procedure cannot stop it. As soon as technology becomes complex, knowledge becomes unequal. You can rotate tasks, but you cannot rotate aptitude. You will always have members who understand the machine better than others. The procedure highlights this tension; it does not resolve it.

  **Final Instruction:** Run the checklist. If Stage 3 forces a rejection on the Sorter, do not look for a loophole. That rejection is the most important political act you will take all year. It admits that you cannot automate your way out of the capitalist logic of work without fundamentally changing how you distribute time.
