  4.  **Evaluate the "Transparency Threshold" Hypothesis:**

      *   The user suggests indirect normativity fails if facts/incentives are hidden.
      *   *Analysis:* This is strong. Idealized deliberation assumes access to relevant reasons. If the organizational structure filters out "safety data" in favor of "schedule data" before it reaches the decider, the "idealized" procedure is corrupted at the input stage.
      *   *Power Dynamics:* If the "ideal agent" is abstracted from power, but the real agent is embedded in power, the norm has no traction.

  5.  **Drafting the Analysis - Section by Section:**

      *   **Terminology Check:** Address the Indirect vs. Procedural distinction first. It builds credibility.
