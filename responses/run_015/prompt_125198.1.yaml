  **(Self-Correction on Terminology):** Actually, in organizational ethics, "Indirect Normativity" isn't a standard term like it is in meta-ethics. The user is likely borrowing from meta-ethics (Railton, Jackson) but applying it to org theory. I should validate their usage while pointing out the standard philosophical label is closer to *Procedural* or *Contractualist*. I will treat "Indirect" as "mediated by a procedure" for the sake of their argument, as that's the core of their feature.

