      *   *Correction:* I need to gently nudge the framing. The user is describing *Idealized Deliberative Normativity* (like Rawls/Scanlon) rather than the technical meta-ethical definition of Indirect Normativity (like Railton's Sophisticated Consequentialism). However, for the sake of the feature, I should acknowledge their usage but refine it to ensure philosophical accuracy. Let's stick close to their intuition: *Norms derived from an idealized standpoint vs. actual institutional constraints.*

