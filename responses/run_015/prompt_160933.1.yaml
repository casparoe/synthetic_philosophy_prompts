prompt: |-
  I sit on a municipal commission that has one year to recommend what to do with a backlog of contested commemorations: two statues, a school name, a couple of street names, a university hall named for a benefactor who also funded eugenics research, and a monument whose subject is unobjectionable but that was erected by a deposed regime partly as propaganda. We can only recommend; the council decides, and we will have to act while the disagreement about what we owe the past is still live. Before we hear from any more interested parties, I want a specification rather than a verdict.

  Write the desiderata that a theory of commemoration would have to meet to be usable by a body like mine: the cases it must handle, the distinctions it must respect, the things about how public honoring actually works that it cannot contradict, and the reason each item is a genuine requirement rather than a prejudice of one camp. Among the claims I want you to test rather than assume: whether honoring is a zero-sum allocation of a scarce stock of public recognition, so that adding one name is a cost to others; whether a monument's meaning is fixed by its makers' intentions or can accumulate meaning from what later happens at the site; the difference between commemorating a victim, a perpetrator, and a collective such as a regiment, a company, or a founding generation, where no individual's record settles the case; whether removal, relocation, recontextualization in place, and adding a second monument nearby are genuinely distinct options or the same option with different costs; and what a commission owes a minority whose heroes keep losing under majority rule.

  Then flag any pair of desiderata you think cannot be jointly satisfied — I suspect administrability by nonhistorians and case-by-case sensitivity pull apart, and that treating like cases alike conflicts with deferring to local attachment — and say which single requirement does the most to exclude candidate theories. You may score the usual strategies (leave everything, remove everything objectionable, contextualize in place, move to museums) against the list, but keep that to a few lines; the criteria are what I need.

  Separate what is settled here from what is genuinely contested among people who work on the topic, and do not present a contested position as the consensus; where you are unsure, say so. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Advisor to a municipal commission on contested commemorations.
      *   **Task:** Write a specification of *desiderata* (requirements) for a theory of commemoration, not a verdict on specific cases.
      *   **Scope:** One year timeline, mixed backlog (statues, school names, street names, university hall, propaganda monument), advisory body (Council decides), live disagreement context.
      *   **Specific Claims to Test:** Zero-sum nature of honor, fixed vs. accumulated meaning, individual vs. collective subjects, distinctness of remedial options (remove/relocate/contextualize/add), obligations to minorities.
      *   **Conflict Analysis:** Flag incompatible desiderata pairs (e.g., administrability vs. sensitivity, consistency vs. local attachment). Identify the single most exclusionary requirement.
      *   **Strategy Scoring:** Briefly score usual strategies against the list.
      *   **Epistemic Status:** Distinguish settled vs. contested issues. Do not present contested positions as consensus. Use British English.
      *   **Tone:** Philosophical, practical, neutral, rigorous.

  2.  **Deconstruct the Desiderata (Requirements for a Theory):**
      *   *Case Coverage:* Must handle individuals (good/bad/mixed), collectives (regiments/companies), abstract concepts (liberty), and regimes (deposed propaganda).
      *   *Distinctions:* Must distinguish between honoring, remembering, warning, and aesthetic retention. Must distinguish between the subject and the donor/context.
      *   *Mechanism of Honor:* How does public space work? Is it zero-sum? Does meaning drift?
      *   *Remedies:* Are removal, relocation, contextualization distinct?
      *   *Minority Rights:* What happens when the majority votes down minority heroes?
      *   *Procedural:* Must be usable by non-historians within a year.

  3.  **Drafting the Desiderata (Iterative Process):**
      *   *Requirement 1: Scope.* Needs to cover the specific types mentioned (statues, names, halls, propaganda).
      *   *Requirement 2: Meaning.* Address the intention vs. reception debate. A theory can't assume meaning is fixed *or* entirely fluid without justification.
      *   *Requirement 3: Scarcity.* Address the zero-sum question. Is public space finite?
      *   *Requirement 4: Agency.* Individual vs. Collective. How to judge a regiment with mixed conduct?
      *   *Requirement 5: Remedial Distinctness.* Are moving and removing the same?
      *   *Requirement 6: Minority Protection.* Counter-majoritarian safeguards.
      *   *Requirement 7: Administrability.* Non-experts need to use it.

  4.  **Testing the Specific Claims (as requested):**
      *   *Zero-sum:* Is honor scarce? Some argue yes (attention economy), others no (education expands capacity). The theory must take a stance.
      *   *Meaning:* Intentionalism vs. Reception theory. The theory must account for "death of the author" in public space.
      *   *Collectives:* The "moral luck" problem. A theory must handle aggregated moral records.
      *   *Remedies:* Are they distinct? Moving to a museum changes the *type* of engagement (educational vs. honorific).
      *   *Minorities:* Liberal democracy tension. Majority rule vs. minority dignity.

  5.  **Identifying Conflicts (The "Flag" Section):**
      *   *Consistency vs. Context:* Treating like cases alike (rule of law) vs. respecting local attachment (particularism).
      *   *Administrability vs. Nuance:* Simple rules for commissioners vs. deep historical sensitivity.
      *   *The "Killer" Constraint:* Which one excludes the most theories? Likely *Administrability* or *Minority Protection* (since many theories are purely philosophical and ignore political reality). Let's go with *Administrability by non-historians* because it rules out complex philosophical frameworks that require deep archival research for every decision.

  6.  **Scoring Strategies:**
      *   *Status Quo:* Fails minority protection.
      *   *Purge:* Fails historical nuance/meaning accumulation.
      *   *Contextualize:* High administrability cost, maybe fails zero-sum if space is cluttered.
      *   *Relocate:* Good compromise, but admits honor is location-dependent.

  7.  **Refining Epistemic Status (Settled vs. Contested):**
      *   *Settled:* Monuments are political, not just art. Meaning changes over time.
      *   *Contested:* Whether removal equals erasure. Whether public space is zero-sum. The moral weight of "offence".

  8.  **Drafting the Content (incorporating British English and Tone):**
      *   *Vocabulary:* "Honour", "programme", "centre", "council".
      *   *Structure:* Introduction -> Desiderata List -> Testing Specific Claims -> Incompatible Pairs -> The Exclusionary Requirement -> Strategy Score -> Epistemic Map.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific prompt about the "zero-sum" claim? *Adjustment:* Ensure the desideratum explicitly asks the theory to clarify this, not just assume it.
      *   *Check:* Did I distinguish between the commission's role and the council's? *Adjustment:* Emphasise the theory must yield *recommendations*, not final rulings.
      *   *Check:* Is the distinction between "commemorating a victim" and "perpetrator" clear? *Adjustment:* Ensure the desideratum covers the "mixed legacy" problem (e.g., the eugenics benefactor).
      *   *Check:* British English? *Adjustment:* Check spellings (honour, programme, centre, labour, etc.) and phrasing (whilst, amongst - though keep it modern professional).

  10. **Final Polish:** Ensure the distinction between "settled" and "contested" is explicit at the end or woven through. The prompt asks to "Separate what is settled here from what is genuinely contested... at the end" (implied by "Please write in British English" closing instruction, but logically fits best as a concluding section or integrated). I will add a specific section for clarity.

  *(Self-Correction on the "Single Requirement" question)*: The prompt asks which single requirement does the most to exclude candidate theories. I need to make a defensible choice here. *Administrability* is strong, but *Minority Protection* is also theoretically demanding. I will argue *Administrability* is the practical filter, but *Non-Zero-Sum* might be the theoretical filter. Let's stick with *Administrability* as it rules out the most philosophical theories that can't be operationalised in a year.

