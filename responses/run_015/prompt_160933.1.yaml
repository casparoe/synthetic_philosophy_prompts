answer: |-
  **To:** The Municipal Commission on Commemorations
  **From:** Advisory Secretariat
  **Subject:** Specification of Desiderata for a Theory of Commemoration

  You have requested a specification rather than a verdict. The following document outlines the necessary conditions any theoretical framework must meet to be operationalised by your body within a one-year timeline. These desiderata are derived from the constraints of your mandate, the nature of public space, and the specific cases in your backlog.

  ### I. Desiderata for a Usable Theory

  A viable theory of commemoration must satisfy the following seven requirements. Each is framed to test the claims you highlighted, ensuring the theory does not smuggle in unexamined prejudices.

  **1. The Economy of Honour**
  The theory must explicitly state whether public recognition is a zero-sum resource.
  *   *Requirement:* It must explain whether adding a new monument or name diminishes the standing of existing ones (scarcity model) or whether the landscape of memory is expansive (educational model).
  *   *Rationale:* If honour is scarce, your recommendations must prioritise; if it is not, you may recommend proliferation. A theory that assumes scarcity without argument imposes an artificial conflict; one that assumes abundance ignores the finite nature of civic attention and physical space.

  **2. The Semantics of Place and Intent**
  The theory must account for the drift of meaning over time.
  *   *Requirement:* It cannot treat the maker's intention as the sole determinant of a monument's meaning. It must provide a method for weighing original intent against accumulated public reception and current usage.
  *   *Rationale:* As you noted, a monument erected as propaganda may later function as a warning or a historical artefact. A theory that fixes meaning at the moment of erection ignores the reality of how communities actually interact with statues. Conversely, a theory that allows meaning to drift without constraint risks making the original historical record irrelevant.

  **3. The Unit of Moral Assessment**
  The theory must distinguish between individuals, collectives, and abstract concepts.
  *   *Requirement:* It must provide a rule for assessing collective entities (regiments, companies, founding generations) where no individual's record settles the case. It must distinguish between commemorating a victim (which may require no moral purity), a perpetrator (which implies endorsement), and a mixed legacy (e.g., the eugenics benefactor).
  *   *Rationale:* Judging a regiment by the worst act of one soldier is historically unsound; judging a benefactor solely by their philanthropy ignores the source of funds. The theory must handle 'moral luck' and aggregated agency without collapsing into simple cancellation or uncritical veneration.

  **4. Distinctness of Remedial Options**
  The theory must treat removal, relocation, recontextualisation, and counter-monumentation as functionally distinct, not merely cost-variations of the same act.
  *   *Requirement:* It must specify what communicative work each option performs. For example, does moving a statue to a museum change it from an *honour* to an *artefact*? Does adding a plaque alter the status of the original subject or merely annotate it?
  *   *Rationale:* If these are treated as identical, the commission cannot choose between them rationally. Relocation may preserve history while removing honour; recontextualisation may retain honour but alter meaning. The theory must validate these differences.

  **5. The Minority Constraint**
  The theory must define what is owed to a minority whose heroes consistently lose under majority rule.
  *   *Requirement:* It must include a counter-majoritarian safeguard. It cannot rely solely on democratic voting to determine memory, as this allows the majority to erase the minority's presence from the public sphere permanently.
  *   *Rationale:* In a liberal democracy, public space must reflect the plurality of the citizenry, not just the numerical victor. A theory that permits permanent erasure of minority heroes fails the test of civic inclusion.

  **6. Administrative Feasibility**
  The theory must be operable by non-historians within a fixed timeline.
  *   *Requirement:* It must not require exhaustive archival research for every decision, nor rely on philosophical concepts inaccessible to lay commissioners.
  *   *Rationale:* You have one year and a mixed backlog. A theory requiring the moral equivalent of a doctoral thesis for each street name is useless. It must offer heuristics or thresholds that allow for timely recommendation.

  **7. Stability vs. Revisability**
  The theory must specify the burden of proof required to alter the status quo.
  *   *Requirement:* It must state whether the default position is retention (stability) or removal (moral hygiene), and what evidence is needed to shift that default.
  *   *Rationale:* Constant churn undermines the purpose of commemoration (to anchor memory); rigid permanence turns the city into a museum of outdated values. The theory must locate a stable equilibrium.

  ### II. Incompatible Desiderata

  You suspected that certain requirements pull apart. Analysis suggests two primary tensions where joint satisfaction is unlikely without significant compromise.

  **1. Administrative Feasibility vs. Case-by-Case Sensitivity**
  *   *The Conflict:* To be usable by non-historians within a year (Desideratum 6), the theory needs clear rules and heuristics. However, to respect the specific historical context and local attachment of each case (implied in Desideratum 2 and 3), the theory demands deep nuance.
  *   *The Consequence:* A rule-based approach (e.g., "remove all statues linked to eugenics") satisfies feasibility but fails sensitivity. A context-based approach (e.g., "weigh the benefit against the harm in each instance") satisfies sensitivity but risks paralysis or inconsistency. You will likely have to accept a degree of rough justice to meet your deadline.

  **2. Consistency (Treating Like Cases Alike) vs. Local Attachment**
  *   *The Conflict:* The rule of law suggests that two statues of similar figures should be treated similarly. However, local attachment varies; one community may cherish a controversial figure as local heritage, while another rejects the same figure.
  *   *The Consequence:* If you prioritise consistency, you risk overriding local democratic sentiment. If you prioritise local attachment, you create a postcode lottery where the morality of a historical figure depends on which ward they stand in. A theory cannot fully satisfy both without a centralised authority overriding local councils, which exceeds your mandate.

  ### III. The Exclusionary Requirement

  The single requirement that does the most to exclude candidate theories is **Administrative Feasibility (Desideratum 6)**.

  Most philosophical theories of commemoration (e.g., those based on complex retributive justice, nuanced Hegelian recognition, or deep archival contextualisation) are designed for academic discourse, not municipal deadlines. They often assume unlimited time for deliberation and expert historical knowledge. By insisting the theory be usable by a mixed commission within one year, you automatically exclude the majority of high-resolution ethical frameworks. This forces you towards 'mid-level' principles rather than first-order moral truths.

  ### IV. Scoring Usual Strategies

  Against the desiderata above, the standard strategies score as follows:

  *   **Status Quo (Leave Everything):** Fails *Minority Constraint* and *Semantics of Place* (ignores meaning drift). High on *Feasibility*.
  *   **Purge (Remove All Objectionable):** Fails *Semantics of Place* (assumes fixed negative meaning) and *Distinctness of Remedies* (ignores relocation). High on *Consistency*, low on *Sensitivity*.
  *   **Contextualise In Place:** Scores well on *Semantics* and *Distinctness*. Risks failing *Feasibility* (requires drafting new text/consensus) and *Zero-Sum* (clutters space).
  *   **Relocate to Museums:** Strong on *Distinctness* (changes honour to artefact). Weak on *Minority Constraint* if the museum is less visible. Moderate *Feasibility* (requires logistics).

  ### V. Settled vs. Contested

  In drafting this specification, I have distinguished between consensus positions among scholars of memory and areas of live dispute.

  **Settled (Consensus among practitioners and scholars):**
  *   **Monuments are political:** It is settled that public commemoration is an act of political power, not merely aesthetic or historical recording.
  *   **Meaning drifts:** It is accepted that the reception of a monument changes over time, regardless of the sculptor's or donor's intent.
  *   **Remedies are distinct:** There is agreement that removal, relocation, and contextualisation perform different communicative functions.

  **Contested (Live disputes you must navigate):**
  *   **The Zero-Sum Question:** There is no consensus on whether public honour is scarce. Some argue attention is finite (adding a new hero dilutes the old); others argue memory is expansive (more statues teach more history). *Your theory must choose.*
  *   **Offence vs. Harm:** It is contested whether causing offence to a community is sufficient grounds for removal, or whether demonstrable material harm or active glorification of violence is required.
  *   **The 'Right to Forget':** It is disputed whether a community has a right to remove uncomfortable history from its daily landscape, or whether the civic duty is to endure discomfort as a form of education.
  *   **Minority Veto:** While minority protection is generally accepted as a principle, the mechanism is contested. Whether a minority group should have a veto over majority symbols, or merely a right to add their own, remains unresolved in political theory.

  **Uncertainty Note:**
  I am unsure whether there is a stable consensus on how to handle 'mixed legacy' benefactors (such as the university hall donor). Some frameworks suggest a proportional approach (acknowledge both good and bad); others suggest the bad taints the good irredeemably. You should treat this as an open question for your deliberations.

  ***

  **Summary for the Commission:**
  You require a theory that is robust enough to handle moral complexity but simple enough to be used by non-experts under time pressure. The tension between consistency and local sensitivity will be your greatest practical hurdle. Do not seek a perfect philosophical solution; seek a procedurally fair one that acknowledges the drift of meaning and protects minority presence without paralysing the council.
