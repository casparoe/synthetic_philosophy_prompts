          *   Internal conflict is resolved via law. External conflict has no tribunal (§333). This lack of higher judge is crucial for sovereignty.
      *   **Point 3: The "Ethical Health" Argument (Necessity vs. Contingency).**
          *   User asks: Is this just a historical observation?
