      *   *Hegel's Logic:* In the *Science of Logic*, individuality requires a limit. For the State, that limit is *another State*. Internal dynamics (police, corporations, constitution) deal with *civil society* and *internal ethics*, but the State *as State* is defined by its sovereignty against others.
      *   *The "Ethical Health" Argument:* Hegel says prolonged peace makes people like "winds upon the sea" (stagnant). He compares it to preserving the health of the body against stagnation.
      *   *Is it Contingent?* Hegel presents it as necessary *in the current stage of Spirit*. He doesn't envision a World State. For Hegel, a World State would dissolve the particularity required for ethical life. Ethical life is rooted in *this* people, *this* constitution, *this* history. Universalism abstracts from this.

