      *   Key concept: *Individuality* of the state. For Hegel, true individuality requires negation. The state is an individual *vis-à-vis* other states.
      *   Key concept: *Finitude*. Property and life are finite. Their nullification in war shows they are not absolute, subordinating them to the State (the Ethical Substance).
      *   Key concept: *Sovereignty*. Sovereignty is actualized in the moment of decision, often precipitated by the threat of war.

  3.  **Addressing the "Metaphysical Claim" vs. "Logical Structure":**
