answer: |-
  ### 1. Exam Question

  **Question 4 (20 marks)**

  In *Economic Possibilities for our Grandchildren* (1930), Keynes argues that the "economic problem" is temporary. Once abundance is achieved, the "money-motive" (the desire for wealth as a means to security or power) should recede, revealing the "real problem": how to live wisely and agreeably. However, Keynes's moral philosophy contains a tension between two commitments:
  1.  **The Moorean Doctrine:** Following G.E. Moore, Keynes holds that value resides in "states of mind" (love, art, knowledge) enjoyed for their own sake, not in external consequences.
  2.  **The Canalisation Claim:** Keynes suggests the money-motive has been historically defensible because it "canalises" dangerous human impulses (aggression, dominance) into comparatively harmless economic striving. Abolishing it risks releasing these impulses into worse outlets.

  Scholars distinguish two readings of how Keynes resolves this tension in an age of abundance:
  *   **The Conversion Reading:** The energy formerly spent on money-making is redirected toward intrinsically worthwhile objects (art, friendship). Striving continues, but its aim changes.
  *   **The Abstention Reading:** Activity need not be justified by production. The good life consists of contemplative states enjoyed without striving. The short working week is valuable because it releases us from the need to *show* what we produced.

  **Part (a) (8 marks):** Which reading (Conversion or Abstention) better reconciles the Moorean Doctrine with the Canalisation Claim? Explain why the rejected reading fails to account for one of these two commitments.

  **Part (b) (7 marks):** In a late memoir-essay on his early beliefs, Keynes criticises his younger self for over-rating reason and under-rating the role of "habit, convention and inherited tradition" in making a decent life possible. Does this self-criticism support or undermine the reading you defended in (a)? Explain how habit functions in your chosen reading.

  **Part (c) (5 marks):** Consider the following scenario: Two generations after the economic problem is solved, society has a fifteen-hour week and universal access to the arts. Yet, time-use studies show freed time is absorbed by competitive ranking of experiences (obscure sports, micro-credentials), and satisfaction is flat. A reform movement proposes "positional disarmament" (abolishing public ranking outside the market).
  Based on your answers to (a) and (b): (i) Does Keynes's account predict this outcome? (ii) Would positional disarmament alone succeed?

  ***

  ### 2. Model Answer

  Keynes's moral architecture requires the **Conversion Reading**. While the Abstention Reading aligns superficially with the Moorean Doctrine's emphasis on states of mind, it fails the Canalisation Claim. If the money-motive is removed and replaced with pure contemplation, the dangerous human impulses previously absorbed by economic striving are left unchanneled. Keynes explicitly worries that without a "purpose" to occupy us, we may revert to barbarism. The Conversion Reading preserves the psychological utility of striving—providing an outlet for energy and aggression—while attempting to aim that energy at Moorean goods (art, knowledge) rather than accumulation. Abstention leaves the engine of human psychology idle; Conversion redirects the drive.

  However, the Conversion Reading faces a fatal objection without the later self-criticism regarding **habit and convention**. If we merely tell individuals to "convert" their striving toward art via reason, we ignore Keynes's admission that we have not been trained to enjoy leisure. Pure reason cannot sustain the Conversion; it requires a cultivated tradition that makes non-competitive enjoyment habitual. The late memoir-essay therefore **supports** the Conversion Reading, but only by modifying its mechanism. It suggests that the "good life" is not a rational choice made in abundance, but a form of life inherited through convention. Without these pre-existing habits, the Conversion fails because individuals lack the capacity to value the new objects. Thus, habit is not an alternative to Conversion, but the necessary precondition for its psychological stability.

  Applying this to the scenario: (i) **Yes, Keynes predicts this outcome.** The persistence of competitive ranking demonstrates that while the *economic* problem was solved, the *psychological* problem of relative needs remains. Because the society lacked the cultivated habits to value art non-competitively, the "conversion" of energy defaulted to the old pattern of positional striving, merely shifting the market from money to credentials. The impulses were canalised, but into the wrong channels, because the tradition of enjoyment was absent.

  (ii) **Positional disarmament alone would fail.** Abolishing public ranking addresses the symptom (competition) but not the cause (the lack of habituated capacity for non-competitive enjoyment). If the underlying impulses are not canalised into worthwhile objects via tradition, removing the scoring system will not create satisfaction; it will merely create anxiety or release the impulses into darker, unchannelled outlets (validating the Canalisation Claim). For disarmament to work, it must be paired with the "inherited tradition" Keynes identifies in his self-criticism. The reform must be cultural, not just regulatory. We need not just the absence of ranking, but the presence of a convention that teaches us how to value the "states of mind" Moore described without comparing them to others. Only then does the Conversion Reading become sustainable.

  ***

  ### 3. Marking Scheme (20 Marks)

  **Five Must-Hit Moves (4 marks each)**

  1.  **Identify the Psychological Risk of Abstention:** The candidate must argue that the Abstention Reading fails the *Canalisation Claim* because pure contemplation leaves dangerous impulses (aggression/dominance) without an outlet, risking social instability.
      *   *Common Error:* Treating Abstention as the "pure" Moorean view and ignoring Keynes's worry about boredom/barbarism.
  2.  **Defend Conversion via Striving:** The candidate must argue that Conversion succeeds by retaining *striving* (activity) but changing its *object*, thereby satisfying the need for purpose while aiming at Moorean goods.
      *   *Common Error:* Defining Conversion simply as "doing art" without noting it requires the *energy* formerly used for money-making.
  3.  **Integrate Habit as Precondition:** The candidate must explain that the late self-criticism supports Conversion only by showing that *reason alone* cannot effect the change; habit/convention is required to make non-competitive enjoyment possible.
      *   *Common Error:* Treating the habit critique as a rejection of the 1930 essay rather than a necessary supplement to it.
  4.  **Diagnose the Scenario as Failed Conversion:** The candidate must identify the scenario's "competitive ranking" as evidence that impulses were canalised but not *converted* (i.e., relative needs persisted because habits of absolute enjoyment were missing).
      *   *Common Error:* Claiming the scenario proves the economic problem was not actually solved.
  5.  **Evaluate Reform via Tradition:** The candidate must conclude that positional disarmament is insufficient without the cultural/habitual element; regulation cannot replace the "inherited tradition" required to sustain states of mind.
      *   *Common Error:* Arguing disarmament is sufficient because it removes the *cause* of competition, ignoring the internal capacity for enjoyment.

  **Discriminators**

  *   **A vs. Strong B:** The **A answer** treats "habit" not just as a textual add-on in Part (b), but as the *solution* to the psychological problem identified in Part (a). It explains *why* reason fails to convert impulses without tradition. The **B answer** treats (a) and (b) as separate tasks, noting the habit critique but failing to integrate it as the mechanism that saves the Conversion Reading.
  *   **C Cap:** An answer caps at **C** if it accurately summarizes the absolute/relative needs distinction and the Moorean doctrine but **fails to engage the Canalisation Claim**. If the candidate does not discuss the danger of unchanneled impulses or the psychological function of the money-motive, they cannot access the top marking band, regardless of textual accuracy.
