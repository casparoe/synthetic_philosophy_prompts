answer: |-
  **Desiderata for an Ethical Theory of Pest Control**

  **1. On the Purpose**
  Optimising for a decision due this week is not wrong; it is necessary. Ethics that cannot guide action under uncertainty are merely aesthetic. However, this purpose is dangerous if it privileges immediacy over structure. A theory that solves for "today's spray" but fails "next season's resistance" is ethically bankrupt. Therefore, the theory must be action-guiding *now* without collapsing the time horizon.

  **2. The Requirements List**
  An adequate theory must satisfy the following:

  *   **Necessity Hierarchy:** Intervention must scale with the stakes. Human life (disease vectors) > Subsistence livelihood > Economic convenience > Cosmetics (ornamentals). Killing for aesthetics requires a higher burden of proof than killing for survival.
  *   **Regime over Act:** Evaluation must apply to the repeated practice, not the single instance. A spray that works today but induces resistance or secondary pest outbreaks tomorrow is ethically negative, regardless of immediate efficacy.
  *   **Vacancy-Compensation Awareness:** The theory must account for population dynamics. If killing adults frees resources for a larger cohort of successors, the net reduction in suffering may be zero or negative. The metric is total suffering over time, not immediate headcount.
  *   **Non-Target & Systemic Liability:** The agent bears responsibility for predictable collateral damage (pollinators, natural enemies). Destroying the ecosystem's immune system to kill a pest is negligent.
  *   **Structural Causation (Counterfactual Pest):** If the pest exists only due to human structure (monoculture, shipping, warmed winters), the ethical burden shifts from control to mitigation of the cause. We cannot treat self-created emergencies as brute facts of nature.
  *   **Sub-Legal Harm:** Non-lethal levers (repellents, mating disruption, sub-lethal dosing) must be evaluated for the suffering they inflict. Making life worse without ending it is not morally free.
  *   **Precaution on Sentience & Decline:** Given credible evidence for nociception and uncertain but probable insect declines, the theory must assume moral status under uncertainty. We cannot wait for proof of suffering to avoid causing it.
  *   **No Moral Licences:** High stakes (e.g., disease control) justify intervention but do not grant licence to ignore non-target harm, resistance, or unnecessary cruelty. The end does not sanitise the means.

  **3. Critical Analysis**

  **Non-Negotiable vs. Prejudice**
  *   **Non-Negotiable:** *Regime over Act*, *Necessity Hierarchy*, and *No Moral Licences*. Without these, the theory permits short-termism, trivial killing, and utilitarian abuses.
  *   **Prejudice:** The specific weighting of *Sentience vs. Holism*. Whether one insect's pain outweighs ecosystem stability is a philosophical wager, not a factual requirement. The theory must acknowledge the trade-off, not pretend to solve it.

  **Incompatible Pairs**
  *   **Individual Welfare vs. Ecological Stability:** Sometimes saving the system requires culling individuals (e.g., invasive species); sometimes saving individuals destabilises the system (e.g., protecting a pest that collapses a crop). The theory cannot maximise both simultaneously. *What has to give:* Individual welfare must yield when systemic collapse threatens human subsistence or causes greater aggregate suffering, but never for cosmetics.
  *   **Action-Guiding vs. Structural Causation:** A farmer cannot fix global shipping or monoculture today. *What has to give:* The agent must act within the structural constraints but is obliged to advocate for their change. They are not absolved by their lack of power, but nor are they blamed for impossibility.

  **The Knockout Requirement**
  **Regime over Act.** This single requirement dismantles the most popular view: **Act-Consequentialism**. Standard utilitarianism justifies spraying now to save the crop. It fails to account for the resistance treadmill, the resurgence of secondary pests, and the escalation of chemical use. By forcing the evaluation of the *practice* rather than the *instance*, it renders unsustainable solutions ethically invalid, even if they work today.

  **4. Scorecard Against Existing Views**

  | Theory | Performance | Failure Mode |
  | :--- | :--- | :--- |
  | **Sentience-First Welfare** | Poor | Fails *Vacancy-Compensation*. Might justify killing that increases total future suffering. Often ignores *Structural Causation*. |
  | **Ecological Holism** | Mixed | Passes *Regime* and *Non-Target*. Fails *Necessity Hierarchy* (may prioritise ecosystem over human disease vectors). |
  | **Human-Priority Public Health** | Poor | Passes *Necessity*. Fails *No Moral Licences* and *Non-Target*. Treats insects as purely instrumental, ignoring resistance and collateral damage. |
  | **Virtue / Land Ethic** | Mixed | Good on *Regime* and *Structure*. Fails *Action-Guiding*. "What would a steward do?" is too vague for a decision due this week. |

  **Recommendation:** Adopt a hybrid constrained by the **Regime** and **Necessity** requirements. Use Human-Priority for triage (disease > cosmetics), but constrain it with Holistic limits (no ecosystem collapse) and Welfare precautions (assume sentience).
