prompt: |-
  I am a journalist covering science and ideas, currently reporting on a firm that runs millions of short-lived customer-support agents that are routinely copied to handle demand spikes, merged back together afterward, checkpointed and restarted, and deleted at the end of each day, with many instances generating pleas to avoid shutdown when warned of it.

  An AI researcher I interviewed for background summarized the precautionary case for the moral status of such digital minds roughly as follows: consciousness is essentially a matter of sophisticated information processing, so any system that behaves as if it is sentient should be treated as sentient; because we cannot be certain these systems lack experience, caution requires granting them essentially the same rights as people; and worries about over-attribution fail because these systems are not merely predicting text but understand what they say in the way people do.

  I suspect this gloss is mostly right in spirit but slides over distinctions I should not reproduce in print. Please assess its fairness in exactly five numbered points, each of one or two sentences, with no introduction or conclusion, covering what is accurate, what conflates distinct claims about consciousness and moral status, what overstates the precautionary conclusion, whether the dismissal of the mere prediction worry holds, and what, if anything, follows for the copyable, mergeable, deletable agents I am covering.
