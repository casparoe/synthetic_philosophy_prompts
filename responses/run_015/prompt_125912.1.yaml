answer: |-
  ### Brainstorm: How Intuition Pumps Mislead

  Before using the tool, you need to know what you are looking for. Most broken thought experiments fail in one of four ways:

  1.  **Emotional Loading:** The story uses charged words ("innocent", "murder", "sacrifice") to trigger a gut reaction that bypasses logic. If you swap the words, the logic should hold, but often it doesn't.
  2.  **The Ghost Knob:** A detail is presented as background scenery (e.g., "the man is wearing a red coat") but is actually essential to the moral intuition (e.g., "the man is a convicted criminal"). If you turn the knob (change the detail), the intuition flips.
  3.  **Hidden Variables:** The story assumes facts that aren't stated. For example, it assumes you *know* pushing the person will definitely stop the train. In reality, that certainty is rare.
  4.  **The Overreach:** The story proves a small point, but the user claims it proves a universal law. A specific example rarely proves a general rule without extra work.

  ---

  ### The Five-Minute Intuition Pump Checker

  Use this checklist in order. If you hit a **Hard Stop**, the pump is broken. If you hit a **Hand-Off**, you must admit the argument depends on personal values, not logical proof.

  #### Step 1: The Sterilisation Test
  *   **Question:** If I remove all emotional adjectives and replace proper nouns with generic labels (e.g., "Person A", "Object B"), does the story still force the same conclusion?
  *   **Sufficient Answer:** Yes. The logic holds without the emotional dressing.
  *   **Hard Stop:** **No.** If the intuition vanishes when you remove words like "innocent", "brutal", or "helpless", the pump is relying on emotional manipulation. **Verdict: Broken — don't use it.**
  *   **Human Hand-Off:** None. This is a factual check on language.

  #### Step 2: The Ghost Knob Hunt
  *   **Question:** Identify one specific detail that seems incidental (e.g., the colour of the car, the relationship of the people, the time of day). Now, flip it (change the detail). Does the moral intuition change?
  *   **Sufficient Answer:** No. Changing the detail leaves the moral judgement intact.
  *   **Hard Stop:** **Yes.** If changing a "scenery" detail flips the moral answer, that detail was a Ghost Knob. The author hid a value judgement inside a fact. **Verdict: Broken — don't use it.**
      *   *How to spot and flip:* Look for specifics that aren't necessary for the mechanics of the story.
      *   *Example:* Story says "You push a *stranger* off the bridge." Knob: Relationship. Flip: "You push your *enemy* off the bridge." If your intuition changes, the relationship was a Ghost Knob doing moral work.
  *   **Human Hand-Off:** None. This is a structural check.

  #### Step 3: The Certainty Check (Hidden Variables)
  *   **Question:** Does the story assume I know the outcome with 100% certainty (e.g., "pushing him *will* save the five")?
  *   **Sufficient Answer:** No, or the story acknowledges the uncertainty.
  *   **Hard Stop:** **Yes.** If the argument relies on magical certainty that doesn't exist in the real world, it is comparing a real moral dilemma to a fantasy scenario. **Verdict: Broken — don't use it.**
  *   **Human Hand-Off:** If the story admits uncertainty but asks you to weigh risks, you must hand this to a person. Deciding how much risk is acceptable is a value judgement, not a logic check.

  #### Step 4: The Leap Test
  *   **Question:** Does the conclusion claim a universal rule (e.g., "Always do X") based on this single specific case?
  *   **Sufficient Answer:** No. The claim is limited to similar cases.
  *   **Hard Stop:** **Yes.** One story cannot prove a universal law without extra premises. **Verdict: Broken — don't use it.**
  *   **Human Hand-Off:** If the claim is moderate (e.g., "This suggests X is often wrong"), you must hand this to a person. Deciding how much weight this example carries is a value judgement.

  ---

  ### Application to Three Cases

  #### Case 1: The Burnt Portrait
  *The Story:* A painter spends ten years on a masterpiece. On the final day, she decides it is awful and burns it.
  *The Claim:* This proves only the outcome matters, not the process (because the result was nothing).
  *The Procedure:*
  1.  **Sterilisation:** Holds up. "Person A spends time on Object B, destroys Object B."
  2.  **Ghost Knob:** The detail "she decides it's awful".
      *   *Flip:* She burns it because a fire started accidentally.
      *   *Result:* Intuition changes. If accidental, we feel tragedy. If intentional, we feel confusion about her agency. The "intentional destruction" is a knob hiding the value of agency.
  3.  **Certainty:** Assumes the process had no value because the object is gone.
      *   *Hidden Variable:* It assumes the value of art exists only in the physical object, not the experience of creation or viewing before the burn.
  4.  **Verdict:** **Hard Stop at Step 2 & 3.** The pump is broken. It smuggles in a definition of "value" (only physical permanence) under the guise of a story. It does not prove outcome matters; it proves the author values objects over experiences.

  #### Case 2: The Footbridge Trolley
  *The Story:* A train will kill five people. You can push one large man off a bridge to stop the train.
  *The Claim:* This proves deontology (rules) overrides consequentialism (numbers) because pushing feels wrong.
  *The Procedure:*
  1.  **Sterilisation:** Fails slightly. "Pushing" implies violence. If changed to "diverting a weight", intuition shifts. High emotional loading on "pushing a man".
  2.  **Ghost Knob:** The method of saving (pushing a person vs. dropping a weight).
      *   *Flip:* You pull a lever that drops a heavy crate off the bridge. The crate happens to contain a person who wasn't visible.
      *   *Result:* Many people find the lever easier to pull than the hand-push, even if the outcome is identical. The "hand-push" is a Ghost Knob triggering a violence aversion, not a moral calculation.
  3.  **Certainty:** Assumes the man *will* definitely stop the train.
      *   *Hidden Variable:* In reality, he might not. The pump asks you to accept magic physics.
  4.  **Verdict:** **Hard Stop at Step 3.** The certainty is unrealistic. **Hand-Off at Step 2.** Whether "personal violence" is morally distinct from "impersonal violence" is a value judgement, not a fact. The pump is useful for exploring values, but broken as a proof of universal morality.

  #### Case 3: The White Lie (The Uncomfortable Rejection)
  *The Story:* You tell a friend their bad haircut looks great. They feel confident and happy. They never find out the truth.
  *The Claim:* This proves lying is morally permissible if it increases happiness.
  *The Conclusion:* "Kindness and happiness are what matter." (This feels right to most people).
  *The Procedure:*
  1.  **Sterilisation:** Holds. "Person A tells falsehood to Person B, Person B feels good."
  2.  **Ghost Knob:** The phrase "They never find out".
      *   *Flip:* They find out next week.
      *   *Result:* Intuition flips immediately. The moral permission relies entirely on the secrecy.
  3.  **Certainty:** Assumes the happiness is guaranteed and the trust is not damaged.
      *   *Hidden Variable:* It hides the variable of "autonomy". Your friend made decisions based on false data (e.g., went to a party thinking they looked good).
  4.  **Verdict:** **Hard Stop at Step 2.** The pump is broken. Even though the conclusion ("be kind") feels right, this specific story does not prove it. It proves "secret manipulation is okay if undetected", which contradicts the value of honesty most people hold. You cannot use this story to prove lying is good, even if you believe kindness is good. The mechanism is flawed.

  ---

  ### Limitations and Judgement-Call Zones

  This procedure is a filter, not a philosopher. It clears away broken tools, but it cannot build the house for you. Be honest about these limits when you post your verdict.

  **1. What This Procedure Cannot Do**
  *   **It cannot solve moral disagreements.** If two people pass all checks but still disagree (e.g., one values autonomy, one values safety), this tool cannot decide who is right. That is a clash of values, not logic.
  *   **It cannot validate the conclusion.** A pump can be structurally perfect but still argue for a conclusion you find repulsive. This tool only checks the *mechanics* of the argument, not the *truth* of the outcome.
  *   **It cannot handle complex systems.** This tool works for "little stories". It fails on systemic issues (like climate change or economics) where variables cannot be isolated in a single snapshot.

  **2. The Judgement-Call Zones (Human Hand-Offs)**
  *   **Weight of Variables:** In Step 3, if the story admits uncertainty, you must decide if the risk is acceptable. That is a value judgement.
  *   **Definition of Harm:** In Step 2, if flipping a knob changes the intuition, you must decide if that difference is morally relevant. (e.g., Is killing via lever truly different from killing via hand?). The tool spots the difference; you must decide if it matters.
  *   **Scope of the Rule:** In Step 4, if the author makes a moderate claim, you must decide if the evidence is strong enough. The tool flags overreach, but it cannot measure "enough".

  **3. Final Advice for Public Verdicts**
  When you post, do not say "This is wrong." Say "This pump is broken." Distinguish between the *idea* (which might be good) and the *tool* (which is faulty). If you hit a Human Hand-Off, state clearly: "Logic gets us this far; the rest is a choice about what you value." This keeps the debate honest without pretending you have a mathematical proof for morality.
