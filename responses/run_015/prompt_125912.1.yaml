prompt: |-
  I'm running a small online forum where people argue about ethics and weird hypotheticals, and I keep seeing the same trick: someone tells a little story, asks "what would you do?", then claims they've proved something huge about morality or identity. I want a reusable decision procedure I can run in about five minutes — I have no philosophy degree, I do this maybe twice a week, and I have to post my verdict publicly so I can't hide behind jargon — to check whether one of these intuition pumps (those little stories philosophers use) is actually doing honest philosophical work or just pushing my buttons. You are an expert in argument analysis and intuition pumps; please think carefully, start with a brief brainstorm of the main ways these pumps mislead, then write me the tool.

  The deliverable should be an ordered checklist: the exact question at each step, what counts as a sufficient answer, the hard stop where I say "this pump is broken — don't use it," and the points where I must hand the decision to a person because it's a value judgement not a fact check. It must cover hidden variables being twisted without notice, emotional loading that drives the answer, and the "ghost knob" problem — that's my own idea for a framing detail being treated as essential when it's really accidental. Show me exactly how to spot a ghost knob and flip it.

  Then apply the procedure to three cases:
  1. The burnt portrait: a painter spends ten years on a work, then on the final day burns it because she decides it's awful. Someone uses this to prove only the outcome matters, not the process.
  2. The footbridge trolley case: pushing one person off a bridge to stop a train and save five.
  3. Pick one more case yourself, but make it one where your procedure rejects the pump even though the conclusion feels right to me — I want to see an answer I won't like.

  Finally, say clearly what this procedure can't do, flag the judgement-call zones honestly, and write everything in British English. Don't ask me for citations, reading lists, or bibliographies — I just need the operational tool. There's definatly a typo or two in this prompt; please ignore them and just answer.
