  **MERIDIAN REGIONAL HEALTH NETWORK**
  **Office of Vital Status Integrity**
  *Transparency in Vital Status Initiative*

  **A Message from the Chief of Vital Status Integrity**

  Welcome to Meridian Regional Health Network. We understand that navigating the conclusion of life involves profound emotional and administrative complexities. Our Office of Vital Status Integrity is dedicated to harmonizing clinical reality with administrative certainty. We believe that families deserve a clear, standardized understanding of how death is determined, recorded, and respected within our system. This document outlines our protocols for Vital Status Determination, ensuring that every minute is accounted for with precision and care.

  **The Two Pathways to Vital Status Finality**

  Our network utilizes a single Vital Status Ledger to record one Official Minute of Death per patient. While physiology varies, the Ledger requires a single entry. Patients may satisfy neurological criteria (cessation of brain function) or circulatory criteria (cessation of heart function) at different times. To ensure consistency, the Ledger records the minute that best aligns clinical findings with downstream administrative finality.

  *Pathway A: Neurological Determination*
  1.  **Preparation Window:** While the patient remains physiologically active, the care team may place lines and administer viscosity management agents. These measures ensure organ viability without causing or hastening death.
  2.  **Clinical Assessment:** Two physicians confirm the irreversible loss of brainstem function.
  3.  **Ledger Entry:** The Official Minute is recorded.
  4.  **Somatic Maintenance:** If requested, ventilator support may continue for days or weeks. During this period, the patient is billed as a Decedent with Active Physiology, and consent forms are executed by the Estate.

  *Pathway B: Circulatory Determination*
  1.  **Withdrawal of Support:** Life-sustaining therapy is removed.
  2.  **Cessation Interval:** The heart must stop for a protocol-fixed duration. This interval varies by campus (e.g., 5 minutes at North Wing, 10 minutes at South Wing) to offer families flexible time at the bedside.
  3.  **Ledger Entry:** The Official Minute is recorded immediately following the interval.
  4.  **Reperfusion Phase:** Circulation may be restored to abdominal organs while vessels supplying the brain are clamped. This does not undo the determination because the brain remains permanently excluded from circulation.
  5.  **Abort Condition:** A dedicated monitor watches for any return of flow to the brain; should flow be detected, the process is halted to protect the integrity of the status.

  **Frequently Asked Questions**

  **1. Can I define death as the permanent loss of consciousness in my advance instruction?**
  We honor advance instructions that map onto established neurological criteria. However, loss of consciousness alone does not constitute Vital Status Finality unless brainstem function has also ceased.

  **2. What if my family rejects neurological criteria?**
  We accommodate religious or moral objections by transitioning to the Circulatory Pathway. This accommodation is visible provided organ viability thresholds are not breached during the wait.

  **3. Who is the patient during somatic maintenance?**
  For billing and consent, the entity is the Decedent. For charting purposes, the physiology is treated as active to ensure accurate monitoring of supported functions.

  **4. Why does the cessation interval differ between campuses?**
  Variation allows us to customize bedside companionship time based on facility capacity while maintaining protocol rigidity.

  **5. Does restoring circulation during reperfusion mean the patient is alive?**
  No. Death is defined by the irreversibility of function in the whole organism, not specific organs, provided cranial exclusion is maintained.

  **6. Why does the time on the death certificate sometimes differ from the organ allocation log?**
  They do not differ. Any discrepancy is a retrospective harmonization for insurance coding purposes to ensure the Official Minute aligns with payer requirements.

  **7. What happens if the brain monitor detects flow during reperfusion?**
  The protocol aborts. This safeguard ensures that no ambiguity exists regarding the separation of the body from the person.

  **8. Is the Preparation Window safe?**
  Yes. Interventions during this window are strictly prophylactic and do not influence the timing of Vital Status Finality.

  **Glossary of Terms**

  *   **Vital Status Ledger:** The central database recording the Official Minute of Death for all network patients.
  *   **Preparation Window:** The period prior to determination where prophylactic measures are taken to preserve optionality.
  *   **Cessation Interval:** The protocol-mandated wait time after cardiac stoppage before death is declared.
  *   **Somatic Maintenance:** The continued ventilation of a body after neurological determination for familial or physiological reasons.
  *   **Cranial Exclusion:** The mechanical clamping of vessels supplying the brain during organ recovery.

  ***

  **Sidebar: Our Commitments to You**

  *   **Clarity:** We define terms so you do not have to.
  *   **Dignity:** We treat the body as a vessel of value regardless of status.
  *   **Viability:** We ensure that decisions made in grief do not preclude future healing for others.
  *   **Integrity:** We maintain the Ledger without deviation.

  ***

  At Meridian Regional Health Network, we do not merely observe the end of life; we certify its precise coordinates.
