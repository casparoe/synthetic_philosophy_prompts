prompt: |-
  You are a professional philosopher working on metaphysics and philosophy of science, with a working knowledge of formal learning theory and algorithmic information theory. Please think carefully, and brainstorm for a paragraph or two before committing to anything: I want your reasoning exposed, not just a verdict.

  I am a software engineer with no philosophy training, and I read the Humean best-system account of laws of nature as essentially lossless data compression: the total mosaic of particular matters of fact is the dataset, the laws are the shortest program that outputs it, and the strength-versus-simplicity tradeoff is the ordinary model-selection tradeoff (MDL, Occam-style penalization of complexity). Three things bother me as an engineer. First, which program is shortest depends on the description language; the standard invariance result buys you only slack up to an additive constant, which helps asymptotically but is worthless when the competing systems differ by a few bits. Second, some datasets are incompressible: for a sufficiently disordered mosaic there is no shorter description than the brute list of its contents. Third, there is no computable procedure for finding the shortest program, so the best system may be unrecoverable in principle by any agent inside the world.

  Give me your credence, as a single number, that the best-system account read this way can be made into a non-trivial account of lawhood. Count it as succeeding only if, for an arbitrary mosaic, it yields a determinate and non-arbitrary set of laws that (i) does not depend on a choice of simplicity measure or vocabulary that we have no principled reason to make, (ii) does not collapse into there being no laws, or into every regularity being a law, when the mosaic is disordered, and (iii) still does the counterfactual and explanatory work laws are supposed to do.

  Then decompose it. A number and one line of justification for each of: whether the compression reading is even faithful to what Humeans are claiming; whether the language-relativity objection can be answered without importing anti-Humean resources such as primitive natural properties; whether incompressibility is fatal or a bullet worth biting; whether uncomputability matters for a view about what laws are rather than how we discover them; and whether the anti-Humean alternatives (laws as governing their instances, as relations among universals, as flowing from dispositional essences) actually do better on these same three points or quietly inherit them. Combine the terms into your headline number, and tell me which single term you are least confident in and what argument or discovery would move it most.

  For calibration: I am at 0.3, and a friend who works in machine learning theory is at 0.7. Tell me where you think our disagreement most likely lives.
