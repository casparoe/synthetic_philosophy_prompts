answer: |-
  The compression analogy is the dominant contemporary reconstruction of Lewis's Best System Account (BSA), championed by Loewer and Callender, so it is textually faithful to modern neo-Humeanism, if not Lewis's exact deductive terminology. Your first objection (language relativity) maps directly onto the "Perfectly Natural Properties" problem in the literature: Humeans must fix a privileged vocabulary to make the complexity measure invariant, but grounding that vocabulary without modal or anti-Humean primitives is the view's greatest vulnerability. Your second objection (incompressibility) is generally accepted by Humeans as a feature, not a bug: if the mosaic is random, there *are* no laws, and demanding laws in a chaotic world is a projection of human desire, not metaphysics. Your third objection (uncomputability) conflates ontology with epistemology; Humeanism is a claim about what laws *are* (supervenient patterns), not how agents *find* them, though this does weaken the account's explanatory utility for finite agents.

  **Credence that the compression-BSA can be made into a non-trivial account of lawhood: 0.55**

  **Decomposition:**
  1.  **Faithfulness of Compression Reading:** 0.95 — This is the standard operationalization of the Simplicity/Strength tradeoff in contemporary neo-Humean metaphysics.
  2.  **Language Relativity Objection:** 0.40 — Solving this requires "Perfectly Natural Properties," which risks importing the very non-Humean modal structure the view seeks to eliminate.
  3.  **Incompressibility (Chaos):** 0.85 — It is consistent to claim a disordered mosaic entails lawlessness, provided one accepts probabilistic laws as compressing statistical summaries rather than specific trajectories.
  4.  **Uncomputability:** 0.90 — Ontological facts can outstrip epistemic access; the definition of truth need not be computable to be real.
  5.  **Anti-Humean Alternatives:** 0.60 — Governing views solve language relativity by positing universals or powers, but they inherit greater costs in metaphysical parsimony and intelligibility.

  **Synthesis:**
  The headline number is heavily constrained by the Language Relativity term (0.40). Even if the other four terms are near 1.0, the account fails if the "description language" is arbitrary. I average the high confidence in the formal analogy and ontological status with the low confidence in the metaphysical grounding of the vocabulary, resulting in a slightly positive but skeptical 0.55.

  **Least Confident Term:**
  **Language Relativity (0.40).** This would move most if a naturalized account of "Perfectly Natural Properties" were successfully developed that did not rely on modal primitives or circular appeals to scientific practice, effectively grounding the "Turing Machine" of the universe in the structure of the mosaic itself.

  **Calibration:**
  Your disagreement with your ML friend likely lives in the **finite vs. asymptotic** distinction. You (0.3) are correctly noting that for a finite dataset (our actual universe), the additive constant in Kolmogorov complexity *does* matter, making the "shortest program" relative to the encoding. Your friend (0.7) is implicitly assuming an asymptotic regime where the constant washes out and the compression gain is significant. My 0.55 splits the difference: I agree with you that the constant is metaphysically fatal *unless* fixed by natural properties, but I agree with your friend that the structural insight of compression is robust enough to sustain the theory if that vocabulary problem can be solved.
