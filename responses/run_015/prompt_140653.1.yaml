answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees, Alden Museum of World Art
  **FROM:** Chair, Collections and Repatriation Committee
  **DATE:** October 15, 2023
  **SUBJECT:** Recommendation on Disposition of Benin Kingdom Holdings

  **RECOMMENDATION**

  The Committee recommends the following dispositions regarding the nineteen objects currently identified as Benin holdings:

  1.  **Group A (9 objects, 1902 bequest-funded):** Authorize staff to immediately petition the Charity Regulator for approval to deaccession and repatriate these objects to the Federal Antiquities Authority. If the Regulator refuses, authorize staff to petition the state court for cy pres modification of the founding trust to permit return on ethical grounds.
  2.  **Group B (6 objects, 1911 unrestricted funds):** Authorize immediate transfer of title and physical return to the Federal Antiquities Authority.
  3.  **Group C (4 objects, shrine regalia):** Pause disposition. Initiate a facilitated dialogue between the Claimant Town Association and the Court of the Oba to determine rightful custody before any transfer.
  4.  **Rotating Loan Proposal:** Reject the Federal Authority's proposal for a rotating loan. Transfer should be permanent.

  **FINDINGS OF FACT**

  Provenance research confirms nine objects (Group A) were removed during the 1897 British Punitive Expedition and purchased by our founder in 1902 using restricted bequest funds. Six objects (Group B) were purchased in 1911 with unrestricted funds from a colonial administrator's estate; while specific removal details are absent, the context suggests illicit export. Four objects (Group C) originate from a shrine sacked by Benin forces in the 19th century; a descendant association from that town claims these specific items.

  We face four claimants: the Court of the Oba (cultural/ritual claim), the State Government (legal title via edict), the Federal Authority (national title), and a local Edo Diaspora Association (retention claim). Legal counsel advises that returning Group A violates the founding bequest without regulatory approval. The Founder's family has notified us that an eight-figure pledged bequest will be withdrawn if any object leaves permanently. The Benin Gallery constitutes our highest-traffic exhibition.

  **PRINCIPLE AND REASONS**

  The Committee relies on the principle of **Repair of Historical Taking**. This principle asserts that where an institution holds objects acquired through coercive extraction or violence, the primary obligation is to reverse that specific transfer.

  We reject the **Inalienability** framing as our primary justification. While the Oba's assertion that these objects are ritual apparatus rather than property is culturally significant, relying solely on inalienability creates an unsolvable contradiction regarding Group C. If these objects are inalienable to their community of origin, Benin Kingdom may itself be an illegitimate holder of Group C, having appropriated them from the shrine town. By framing our action as repair for *our* acquisition (the 1897 loot and subsequent purchase), we sidestep the adjudication of pre-colonial conflicts we are ill-equipped to judge. We return what we wrongly hold, without validating every intermediate transfer.

  We also reject the **Rotating Loan** compromise. The curators are correct: a loan treats ritual apparatus as alienable property subject to commercial terms. It imposes conservation risks and freight costs that burden the recipient, effectively taxing them for their own heritage. Furthermore, it allows the Museum to claim credit for restitution while retaining actual control. Permanent transfer is the only disposition consistent with repair.

  Regarding the **Financial Constraints**: The loss of the pledged bequest and potential attendance decline are material harms. However, they must carry secondary weight. To prioritize the balance sheet over restitution would confirm the accusation that we value capital over justice, causing reputational damage far exceeding the loss of a single gift. We register this cost not as a reason to delay, but as the price of aligning our operations with our stated mission.

  **STRONGEST OBJECTION**

  The strongest case against this recommendation is not financial, but political. By recommending transfer to the Federal Authority, we may be handing culturally vital objects to an institution with documented storage failures and a mandate that may not align with community interests. The State Government's museum does not exist; the Federal Authority's facilities are compromised. The Oba's Court is unelected; the State Government is subject to political volatility.

  Critics will argue that "repair" is meaningless if the recipient cannot care for the objects or if we are resolving a contested question of representation by simply choosing the claimant who wrote to us first. If we return Group A and B to the Federal Authority, we may be facilitating the centralization of culture by a state apparatus that is not accountable to the Edo people. If we wait for perfect conditions, we are complicit in retention. But if we move now, we risk being instrumentalized by a government that may use these objects for propaganda while they deteriorate in storage. This is not a hypothetical risk; it is a documented failure of previous repatriations. To proceed requires us to accept that returning the object is a moral good in itself, even if the immediate custodial outcome is imperfect.

  **CONCRETE STEPS AND TIMETABLE**

  *   **October 22, 2023:** Committee circulates this memo to full Board.
  *   **October 29, 2023:** Board vote on recommendation.
  *   **November 15, 2023:** Upon approval, staff file application with Charity Regulator for Group A deaccessioning.
  *   **November 15, 2023:** Staff notify Federal Authority of Board's intent to return Group B immediately and Group A contingent on approval. Reject loan terms in writing.
  *   **December 1, 2023:** Convene initial virtual meeting between Claimant Town Association and Court of the Oba regarding Group C.
  *   **January 15, 2024:** Target date for Regulator response. If denied, file court petition for trust modification.
  *   **March 1, 2024:** Target physical transfer date for Group B. Group A transfer upon regulatory/court approval.

  We must proceed with the understanding that restitution is not a transaction that ends our obligation, but the beginning of a new relationship. We cannot guarantee the recipient's perfection, only the rectitude of our own transfer.
