answer: |-
  **Proposed Chapter: The Morality of Conventionalized Misleading**

  **1. The Research Question**
  The standard debate in the ethics of communication focuses on the moral asymmetry between lying and misleading. The dominant view holds that lying (asserting what one believes to be false) is pro tanto worse than misleading (implicating what one believes to be false while asserting something true). This distinction usually relies on the speaker maintaining literal truthfulness while relying on the listener to draw an inference.

  However, this literature predominantly analyzes one-off interactions between strangers where the deceptive implicature is ad hoc. My proposed chapter investigates a neglected category: **conventionalized misleading within institutional practices.** These are cases where the misleading implicature is not ad hoc but is common ground among participants. Examples include writing a lukewarm letter of recommendation where "punctual" is universally understood as "not philosophically talented," or telling a colleague their paper is "interesting" when the convention dictates this means "fundamentally flawed."

  In these contexts, the speaker asserts a literal truth, but both parties know the intended message is false. The plausibility of deniability—the standard defense for misleading—is eliminated by shared convention.

  **Precise Question:** *Does the moral distinction between lying and misleading collapse when the misleading implicature is conventionalized common ground within a specific practice?*

  If the distinction collapses, conventionalized misleading should be judged as harshly as lying. If it persists, we need a new explanation for why literal truth retains moral weight even when communicative transparency is shared.

  **2. Why Standard Positions Leave This Open**
  Current accounts of the lying/misleading distinction generally fall into two camps: assertion-based views and trust-based views.

  Assertion-based views argue that lying involves a specific normative commitment to truth that misleading avoids. However, in conventionalized contexts, the normative commitment of the practice (e.g., evaluating a candidate's philosophical potential) is violated by the literal truth, not the implicature. If the practice demands an assessment of talent, and "punctual" functions as the code for "lack of talent," the speaker is arguably asserting the negative assessment via the convention, not the literal property. Standard assertion accounts struggle to categorize this speech act.

  Trust-based views argue lying violates trust more severely than misleading. Yet, in my target cases, trust is not necessarily violated because the listener understands the code. The listener is not being tricked in the standard sense; they are participating in a shared ritual of politeness or institutional protection. If the listener decodes the message correctly, has deception occurred? If deception is required for lying to be wrong, these cases might not be deceptive. But if the *candidate* (the third party) is the victim, the speaker is knowingly generating a false record while relying on insiders to read past it.

  Standard theories assume a dyadic relationship where deception harms the listener. My cases involve triadic relationships (speaker, listener, subject) where the harm is often to the subject or the integrity of the practice itself. Existing frameworks do not easily account for the moral valence of "open secrets."

  **3. Methodology and Two-Month Plan**
  I propose a conceptual analysis grounded in practice-based ethics. Rather than constructing new thought experiments about strangers, I will analyze existing institutional norms.

  **Month 1: Mapping the Phenomenon**
  I will delineate the necessary conditions for "conventionalized misleading." I need to distinguish this from mere sarcasm or irony. The key criterion is *institutional uptake*: the misleading interpretation must be the standard operating procedure within the practice.
  *   *Task 1:* Select three paradigmatic cases: (1) The lukewarm recommendation letter, (2) Polite workshop feedback ("interesting"), and (3) Administrative bureaucracy (e.g., "pursuing other opportunities" vs. "fired").
  *   *Task 2:* Analyze the common ground. In each case, establish that the speaker knows, the listener knows, and the speaker knows that the listener knows the implicature is the primary message.
  *   *Deliverable:* A typology of conventionalized misleading that separates it from standard Gricean implicature.

  **Month 2: Normative Testing**
  I will test these cases against the leading explanations for why lying is worse than misleading.
  *   *Task 1:* Apply the "commitment to truth" test. Does the speaker bear responsibility for the conventional meaning as if it were asserted? I will argue that in high-stakes institutional contexts, conventional meaning overrides literal meaning.
  *   *Task 2:* Apply the "harm" test. Who is harmed? If the listener decodes correctly, the harm shifts to the subject of the letter/paper or the integrity of the institution.
  *   *Task 3:* Draft the argument that the moral permission to mislead (often granted because it preserves literal truth) is revoked when the convention makes the falsehood transparent to insiders but opaque to outsiders (or records).
  *   *Deliverable:* A draft chapter arguing that conventionalized misleading is morally equivalent to lying in contexts where the practice demands transparency.

  **4. Why This Approach?**
  The obvious alternative is to broaden the scope to all deceptive communication. This is untractable for a single chapter. Another alternative is pure linguistics: analyzing whether these cases constitute assertions. This is insufficient because the core issue is moral, not semantic. A speech act can be semantically distinct but morally equivalent.

  My approach beats these alternatives by focusing on *non-ideal theory*. We do not live in a world of perfect honesty. We live in practices with established codes. By accepting the codes as given and analyzing the moral residue, I avoid the utopian pitfall of simply arguing "everyone should be honest." Instead, I ask what obligations persist within the current corrupt practices. This makes the project immediately relevant to professional ethics without requiring a full overhaul of semantic theory.

  **5. Success Conditions and Potential Failure**
  **Success:** I successfully demonstrate that the moral asymmetry between lying and misleading is context-sensitive. A win looks like establishing a criterion: *When misleading relies on common ground that obscures the truth to third parties or institutional records, it inherits the moral weight of lying.* This would allow us to condemn the lukewarm letter as a lie without denying its literal truth.

  **Failure:** The project flops if I cannot distinguish conventionalized misleading from standard asserting. If it turns out that saying "punctual" in a letter *just is* asserting "bad philosopher" semantically, then it's already classified as lying by standard definitions, and there is no new puzzle. Alternatively, if I find that the distinction holds firm regardless of common ground (i.e., literal truth always grants moral cover), the chapter becomes a defense of the status quo, which is less philosophically interesting.

  **6. Scope and Limitations**
  I am limiting this strictly to professional/academic recommendation and feedback contexts. I am not addressing political speech, advertising, or intimate relationships. These have different norms regarding common ground. I am also not attempting to solve the definition of lying. I am taking a functional definition (asserting what one believes false) and testing its moral boundaries. This keeps the project tractable for a dissertation chapter while leaving room for future work on other institutional contexts.

  This project allows me to leverage my TA experience into a theoretical contribution, moving from "this feels wrong" to "here is why the standard theory cannot explain why this feels wrong."
