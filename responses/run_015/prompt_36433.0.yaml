      To count as progress, a theory of self-locating belief must transcend partisan stalemates. Here are the desiderata.

      **1. The Beauty Constraint:** The theory must yield a determinate credence for Beauty upon waking (Head vs. Tail) and specify her evidence stream. *Status:* The verdict is a constraint; the explanation is the theoretical work. *Shibboleth:* "Beauty learns nothing" is a halfer conclusion, not a neutral datum. Dutch book arguments are indicative but not decisive unless betting protocols are fixed independently of the epistemology.

      **2. The Duplication Constraint:** In cases of perfect physical duplication (e.g., Elga's Dr. Evil), the theory must specify the relation between duplicate credences and an outside observer's. *Status:* Genuine constraint. Symmetry demands indistinguishable agents have identical credences, but this conflicts with externalist evidence views.

      **3. The Centered/Uncentered Relation:** The theory must define how centered credences (de se) supervene on uncentered propositions (de dicto) and objective chances. *Status:* Genuine constraint. If centered credences are primitive, they risk epistemic autonomy from physical reality; if reducible, they risk collapsing into standard Bayesianism unable to handle indexical uncertainty.

      **4. The Cosmological Constraint:** The theory must deliver verdicts on the Doomsday Argument and Presumptuous Philosopher without entailing that mere existence confirms hypotheses with more observers arbitrarily. *Status:* Genuine constraint. Avoiding these conclusions entirely is not an option; the theory must bite a bullet or dissolve the argument formally.

      **5. Diachronic Coherence:** In limits where self-locating uncertainty vanishes, the theory must collapse to standard Conditionalization and satisfy the Reflection Principle. *Status:* Genuine constraint. A theory that revises ordinary Bayesianism where it works is defective.

      **The Impossibility Result:**
      Are these jointly satisfiable? Likely not. There is a known tension between **Diachronic Coherence** (specifically Reflection) and **The Beauty Constraint** (Thirder solutions) when combined with **The Cosmological Constraint**.

