answer: |-
  To count as progress rather than mere proliferation, a theory of self-locating belief must satisfy the following desiderata.

  **1. The Beauty Constraint:** The theory must yield a determinate credence for Beauty upon waking and specify her evidence stream. *Status:* The verdict is a constraint; the mechanism is theoretical work. *Shibboleth:* "Beauty learns nothing" is a halfer conclusion, not a neutral datum. Dutch book arguments are heuristic; they settle credence only if betting protocols are fixed independently of the epistemology, which is rarely the case in anthropics.

  **2. The Duplication Constraint:** In cases of perfect physical duplication (e.g., Elga's Dr. Evil), the theory must specify whether duplicate credences match an outside observer's. *Status:* Genuine constraint. Symmetry demands indistinguishable agents have identical credences, but this conflicts with externalist views where evidence depends on relational facts inaccessible to the duplicate.

  **3. The Centered/Uncentered Relation:** The theory must define how centered credences (*de se*) supervene on uncentered propositions (*de dicto*) and objective chances. *Status:* Genuine constraint. If centered credences are primitive, they risk epistemic autonomy from physical reality; if reducible, they risk collapsing into standard Bayesianism incapable of handling indexical uncertainty. They must do "real work" not recoverable by conditioning on objective chances alone.

  **4. The Cosmological Constraint:** The theory must deliver verdicts on the Doomsday Argument and Presumptuous Philosopher without entailing that mere existence arbitrarily confirms hypotheses with more observers. *Status:* Genuine constraint. Avoiding these conclusions entirely is not an option; the theory must bite a bullet or dissolve the argument formally.

  **5. Diachronic Coherence:** In limits where self-locating uncertainty vanishes, the theory must collapse to standard Conditionalization and satisfy the Reflection Principle. *Status:* Genuine constraint. A theory that revises ordinary Bayesianism where it works is defective.

  **The Impossibility Result**
  Are these jointly satisfiable? Likely not. There is a recognized trilemma between **Diachronic Coherence** (specifically Reflection), **The Beauty Constraint** (Thirder solutions), and **The Cosmological Constraint**.

  If you adopt a Thirder view to satisfy intuitive symmetry in Beauty (and Duplication), you typically require an updating rule that violates standard Conditionalization or Reflection (e.g., "Centered Conditionalization"). Arntzenius (2003) and Meacham (2008) highlight that satisfying Reflection while accommodating self-locating evidence often forces Halfer-like conclusions, which in turn exacerbates the Doomsday Argument (since you don't update on observer count). Conversely, solving Doomsday via observer-count weighting (SIA) often leads to the Presumptuous Philosopher absurdity.

  Specifically, you cannot simultaneously maintain: (a) Standard Conditionalization on uncentered propositions, (b) The Indifference Principle for duplicates, and (c) Avoidance of Presumptuous Philosopher conclusions. One must go. If (a) holds, you struggle with Beauty. If (b) holds, you risk Presumptuousness. If (c) holds, you may violate Reflection.

  Therefore, the choice between Halfism and Thirdism is not merely about Beauty; it is a choice about which foundational norm (Reflection, Indifference, or Cosmological Modesty) is expendable. Progress lies not in satisfying all desiderata, but in explicitly identifying which constraint is relaxed and justifying the cost. The requirements list itself reveals the impossibility of a cost-free theory.
