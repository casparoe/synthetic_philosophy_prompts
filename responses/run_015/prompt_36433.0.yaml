      *   **Desiderata 2: Duplication:** Indistinguishable duplicates. *Constraint:* Symmetry principles (Indifference) vs. Externalist views. Should duplicates match outside observers? (Elga vs. Lewis).
      *   **Desiderata 3: Centered vs. Uncentered:** *Constraint:* Supervenience? Can centered credence be reduced to uncentered + indexical info? Or is it primitive?
