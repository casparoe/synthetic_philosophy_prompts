      *   **Desiderata 5: Diachronic Coherence:** *Constraint:* Must reduce to standard Bayesianism when self-locating uncertainty is absent. Reflection principle.
      *   **Impossibility Result:** This is the key insight. Can all be satisfied?
          *   *Tension:* Standard Conditionalization + Self-Locating Indifference + Avoiding Presumptuous Philosopher often clash.
