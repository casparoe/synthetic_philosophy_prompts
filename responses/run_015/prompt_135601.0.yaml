answer: |-
  You are not overthinking this. You have stumbled onto the central tension in scalable oversight: the difference between **parallelizable labor** and **holistic judgment**. Your intuitions are sharper than your current principle because your current principle tries to solve epistemic problems (competence) and normative problems (alignment) with a single rule. They require two.

  Here is the precise formulation you can hand to a junior, followed by the derivation, the verdict adjustments, and the specific risk of distillation.

  ### The Principle of Reintegratability

  Decomposition is safe only if the **Reintegration Function** (the rule that combines the sub-tasks) satisfies two conditions:

  1.  **The Interaction Condition (Competence):** The value of the whole is a stable, low-complexity function of the parts. Information lost by severing the links between parts must be negligible compared to the gain from specialization.
  2.  **The Agency Condition (Alignment):** The reintegration step does not encode a value trade-off that no specific human has explicitly endorsed. A human must remain the bottleneck for any decision where "right" involves weighing competing goods, not just aggregating facts.

  ---

  ### 1. The Interaction Condition (Competence)
  **Clause:** *Decomposition fails when the "glue" matters more than the "bricks."*

  This explains why the plane pre-flight works but the medical diagnosis fails.
  *   **Plane (Pass):** The system is **conjunctive**. The rule is `IF any_system == FAIL THEN ground_plane`. The interaction between the engine and the flaps is irrelevant to the go/no-go decision; they are independent failure modes. The reintegration function is a simple `OR` gate.
  *   **Medical (Fail):** The system is **configurational**. Symptom A in the cardiac system changes the probability of Symptom B in the respiratory system. The diagnosis lives in the *correlation* between the parts. By splitting the assessors, you destroy the correlation data. The reintegration function would need to be a complex Bayesian update that the merged notes cannot support.
  *   **Hiring (Fail):** Criteria interact non-linearly. A "7" in skill combined with a "2" in culture fit is not an average; it's a toxic liability. A "4" in skill with a "7" in potential might be a hire. The weighted sum assumes independence where there is synergy.
  *   **Restaurant (Pass/Fail):** This is your weakest verdict. Strictly speaking, food and service interact (great food served rudely is a different experience than the average of the two). However, the stakes are low and the dimensions are *perceived* as independent by the consumer. **Verdict Adjustment:** You must concede that restaurant reviews are technically lossy, but acceptable because the *cost of error* is low. If the review determined a Michelin star, you would need a holistic diner.

  **Forced Clause:** The requirement that the reintegration rule be "fixed in advance" (your original point 2) is insufficient. The rule must be **simple**. A fixed weighted sum is simple; a fixed "senior editor reads notes and decides" is complex. Decomposition only helps if the merge is mechanical. If the merge requires judgment, you haven't decomposed the judgment, only the data gathering.

  ### 2. The Agency Condition (Alignment)
  **Clause:** *Decomposition fails when it allows the decision-maker to claim they "just followed the algorithm."*

  This explains the Product Decision and Peer Review cases.
  *   **Product Decision (Fail):** You decomposed the *facts* (market size, legal) but excluded the *value* ("good for the world"). By aggregating the facts mechanically, you launder the moral responsibility. No one decided the trade-off between profit and harm; the spreadsheet did. This violates the Agency Condition.
  *   **Peer Review (Fail on aggregation):** Scores are data. "Accept/Reject" is a judgment. If the editor aggregates scores and skips the recommendation, they are abdicating the responsibility to weigh novelty against rigor. Sometimes a flawed paper is too important to reject. That requires a human owner.
  *   **Lease Review (Pass):** The "risk paragraph" is a summary of facts/obligations. It does not decide whether the client *should* sign the lease (a business/moral decision); it only says what the lease *says*. The reintegration is summarization, not valuation.

  **Forced Clause:** Your original point (3) ("target is a fact... rather than something owned") was correct, not circular. It identifies **Moral Residue**. If a decision leaves moral residue (regret, harm, ethical weight), a human must sign their name to the reintegration step.

  ---

  ### The Distillation Trap

  You asked specifically about the distillation step (training a model to jump straight to the answer). This introduces a third failure mode: **Context Freezing.**

  In your scalable oversight pipeline, a human supervisor might choose *different* decompositions for different documents. A weird lease clause gets deep decomposition; a standard one gets a quick pass.
  *   **The Risk:** The distilled model learns $P(\text{Answer} | \text{Document})$. It does not learn $P(\text{Decomposition} | \text{Context})$. It averages the strategy.
  *   **Competence Loss:** It will apply a "standard" decomposition to a "non-standard" problem, missing the interaction effects you identified in the Medical/Hiring cases.
  *   **Alignment Loss:** It creates a "Zombie Process." It looks like the oversight pipeline (which had human checkpoints at the merge step), but the distilled model removes the human bottleneck. If the Agency Condition required a human to own the moral trade-off, distillation removes the owner.

  **Verdict on Distillation:** Distillation is only safe if the decomposition strategy itself is fixed and context-independent (like the plane pre-flight checklist). If the *way* you split the task depends on human intuition, distilling the output destroys the intuition.

  ---

  ### Application to New Cases

  Here is how the Principle of Reintegratability rules on your unlisted cases:

  **1. Grading an undergrad philosophy essay with a rubric of sub-scores.**
  *   **Verdict:** **Not Fine** for final grade; **Fine** for feedback.
  *   **Reasoning:** Philosophy is holistic. A brilliant argument (high score) with poor grammar (low score) might still be an 'A'. A grammatically perfect essay with a contradiction in the core thesis is an 'F'. The interaction between "clarity" and "truth" is non-linear.
  *   **Rule:** Use sub-scores to generate feedback (data), but the grade must be assigned by a human reading the whole (judgment).

  **2. A jury asked to answer special interrogatories instead of returning a general verdict.**
  *   **Verdict:** **Not Fine** (Legally contentious, but philosophically unsafe).
  *   **Reasoning:** This is the "Hiring" case. Jurors might find Fact A true and Fact B true, which logically implies Liability, but feel deeply that Liability is unjust in this specific context (jury nullification). Special interrogatories force a mechanical reintegration that strips the jury of its role as the "conscience of the community." It removes the Agency.

  **3. A data safety monitoring board (DSMB) deciding whether to stop a trial early.**
  *   **Verdict:** **Fine** for data analysis; **Not Fine** for the Stop/Go decision.
  *   **Reasoning:** Calculating p-values and adverse event rates is decomposable (Fact). Deciding whether the risk/benefit ratio justifies stopping is a value judgment involving future patients vs. current subjects. The DSMB must meet as a whole to own the recommendation. You cannot aggregate individual board member votes on "stop" without discussion.

  **4. A manager deciding a promotion purely by ticking off rubric bullets.**
  *   **Verdict:** **Not Fine.**
  *   **Reasoning:** This is the "Hiring" case again. "Leadership potential" is an emergent property of past performance, not a sum of bullets. If the manager ticks boxes without writing a narrative justification they are willing to sign, they are laundering the risk of a bad promotion.

  ---

  ### Summary for the Junior

  If you need to hand this to a junior reviewer, give them this checklist. If they answer **YES** to any of these, **STOP** and do not decompose the task:

  1.  **The Interaction Test:** Does the meaning of Part A change depending on the content of Part B? (e.g., A poem's line break, a patient's comorbidities).
  2.  **The Trade-off Test:** Does combining the parts require weighing two competing goods against each other? (e.g., Speed vs. Safety, Novelty vs. Rigor).
  3.  **The Owner Test:** If the final output causes harm, is there a specific human who can say "I decided this," or will they say "The process produced this"?

  **Which verdict must you give up?**
  You must soften your verdict on the **Restaurant Review**. It is technically a failure of the Interaction Condition (ambiance affects perception of food), but it passes because the *cost of error* is trivial. You must accept that decomposition is always lossy; the question is whether the loss is *tolerable*. In hiring, medicine, and law, it is not. In dining, it is.

  **Final Word on Competence vs. Alignment**
  You asked if they need two principles. **Yes.**
  *   **Competence** is about information loss (can we reconstruct the truth?).
  *   **Alignment** is about responsibility diffusion (can we locate the blame?).
  *   Distillation threatens both: it compresses the information (Competence) and removes the human signature (Alignment).

  Your gut is right. The "scalable oversight" pipeline works for *auditing* (Leases, Plane Checks) where the standard is fixed and external. It fails for *synthesis* (Diagnosis, Hiring, Art) where the standard is internal, emergent, and human. Do not let the lab convince you that a model distilled from a decomposed process is equivalent to the process itself. The process had a human at the merge point. The model is just the ghost of that decision.
