answer: |-
  Here is the breakdown. My overall credence is lower than yours, primarily because the game-theoretic classification of moral norms (Term 2) fundamentally conflicts with Lewis's strict definition of convention.

  **1. The structural core is right: norm emergence is basically a coordination problem with arbitrary equilibria.**
  **Credence: 0.5**
  *Justification:* While this explains etiquette and traffic laws well, it fails for "thick" moral norms where equilibria are not arbitrary (e.g., "care for offspring" has no viable alternative equilibrium).

  **2. Moral norms — like anti-free-riding — are actually coordination problems, not commitment devices or evolutionary strategies that don't need common knowledge.**
  **Credence: 0.3**
  *Justification:* Anti-free-riding is structurally a Prisoner's Dilemma or Public Goods Game; mapping it to a Coordination Game requires assuming the normative conclusion (that agents prefer mutual cooperation) as a premise.

  **3. Something like 'stochastic common belief' (local signaling that approximates common knowledge without full transparency) is enough to satisfy Lewis's conditions in big populations.**
  **Credence: 0.6**
  *Justification:* Epistemic game theory (e.g., Monderer & Samet) shows approximate common knowledge sustains equilibria, but this solves the *information* problem, not the *incentive* problem in large anonymous groups.

  **4. The reduction of normative 'ought' to conditional 'want' succeeds without residual normativity.**
  **Credence: 0.3**
  *Justification:* Lewis explains regularity of behavior via conditional preferences, but cannot derive the *categorical* force of moral obligation without implicitly assuming agents already value conformity normatively.

  ***

  ### Overall Credence: 0.25

  **Calculation Logic:**
  I treat these as largely conjunctive necessary conditions for Lewis's specific account to hold *without smuggling in normativity*. Term 2 and Term 4 are the primary bottlenecks. Even if Term 3 (epistemics) works, it doesn't save the model if the underlying game isn't a Coordination Game (Term 2) or if the output lacks normative force (Term 4). I land at 0.25 because Lewis's framework is excellent for *conventions* (driving on the right) but categorically insufficient for *morals* (don't murder) unless you redefine "moral" to mean "conventional," which begs the question.

  ### The Weakest Link: Term 2 (Game Type Classification)

  This is the fatal flaw. Lewis's account relies on the premise that agents have a conditional preference to conform *if* others conform (the definition of a Coordination Game). However, in large anonymous societies, the payoff structure for moral norms (like honesty or non-violence) is typically a Prisoner's Dilemma: I prefer to defect (free-ride) even if others cooperate.

  To make Lewis's model work here, you must assume agents *already* have a preference for cooperation. But that preference *is* the moral norm you are trying to explain. By assuming the preference exists to make the game a Coordination Game, you have sneaked in the independent normative premise.

  ### Decisive Empirical/Theoretical Result

  I would require a result from **Evolutionary Game Theory (EGT) regarding the emergence of stable norms in Prisoner's Dilemmas without Common Knowledge.**

  Specifically: A model demonstrating that a population of agents with *purely self-regarding preferences* (no pre-existing moral taste) can evolve a stable moral norm in a large, anonymous network **using only local information updates** (no common knowledge) and **without external enforcement mechanisms** (punishment).

  *   **If such a model exists and fits Lewis's criteria:** It would raise Term 2 and Term 3 significantly, pushing my credence toward 0.6. It would show coordination-like stability emerging from non-coordination payoffs without normative smuggling.
  *   **If EGT confirms the standard view:** That stable moral norms in PDs require either (a) preference transformation (internalization), (b) costly signaling/punishment, or (c) kin/network reciprocity that violates anonymity, then Lewis's account is falsified for morals. Current literature strongly supports this negative outcome, which is why my number is 0.25.
