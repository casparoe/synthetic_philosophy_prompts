answer: |-
  # OPERATIONAL RUNBOOK: PLAYER HARM TRIAGE (V4.2)

  ## 1. POLICY CONTEXT & ASSUMPTIONS
  **Review Time Budget:** 3 Minutes per ticket.
  **Primary Goal:** Consistency and Auditability, not perfect justice.
  **Separation of Concerns:** Determine **Restoration** (fixing the victim) and **Sanction** (punishing the actor) independently. A player can be made whole without the other being banned, and vice versa.

  ### ⚠️ OPEN DECISION: THE SHUTDOWN QUESTION
  *This procedure operates under a Policy Switch that Leadership has not yet finalized. Reviewers must apply the current active setting, but note the contradiction in the ticket notes.*
  *   **Option A (Persistence Assumption):** We treat the world as permanent. Losses are real because the world is expected to last. *Default for this runbook.*
  *   **Option B (Ephemerality Assumption):** We treat the world as temporary. All losses are provisional because the service will eventually cease.
  *   **Instruction:** If a ticket hinges on the long-term value of an asset (e.g., "I spent 5 years on this"), tag `POLICY_CONFLICT`. Do not resolve the metaphysics. Apply Option A for consistency until notified otherwise.

  ---

  ## 2. DECISION PROCEDURE

  Execute steps in order. If a step returns a **HALT**, stop immediately and output the designated code.

  ### STEP 1: JURISDICTION & PROHIBITED ACTIVITY
  **Question:** Does the report involve Real-Money Trading (RMT), gambling, or activity explicitly prohibited by the Terms of Service (ToS)?
  **Evidence:** Chat logs, transaction history, external links provided in ticket.
  **Sufficient Answer:**
  *   **YES:** If RMT is admitted or strongly evidenced by logs (e.g., item transfer followed by external payment reference).
  *   **NO:** If the activity is standard gameplay.
  **Engineering Trap Warning:** Do not assess the *value* of the prohibited item. Even if the loss feels "real" to the player, if the source is prohibited, we do not intervene.
  **Exit Condition:**
  *   If **YES**: **HALT**. Output Code `CLOSE_POLICY`. Justification: "Activity violates ToS; restoration would legitimize prohibited economy." (Sanction determination is separate).
  *   If **NO**: Proceed to Step 2.

  ### STEP 2: FACTUAL VERIFICATION
  **Question:** Do server logs corroborate the player's statement of *what happened*?
  **Evidence:** Server logs (inventory changes, zone transfers, kill feeds) vs. Ticket Text.
  **Sufficient Answer:**
  *   **MATCH:** Logs show the transfer/destruction/event described.
  *   **CONTRADICTION:** Logs show the event did not happen (e.g., item still in inventory).
  *   **UNVERIFIABLE:** Logs do not record this data type (e.g., emotional state, verbal agreements, unrecorded opportunities).
  **Marker 1 (Player Account Sufficiency):**
  *   Accept Player Account as Sufficient **ONLY** for **Intent** or **Knowledge** not captured in logs (e.g., "They knew this was a memorial").
  *   Do **NOT** Accept Player Account as Sufficient for **Physical Events** (e.g., "I lost the item" when logs say "I traded it").
  **Exit Condition:**
  *   If **CONTRADICTION**: **HALT**. Output Code `CLOSE_NO_INCIDENT`. Justification: "Server logs contradict the reported event; no technical loss occurred."
  *   If **MATCH** or **UNVERIFIABLE**: Proceed to Step 3.

  ### STEP 3: CONSENT & RULE COMPLIANCE
  **Question:** Was the action taken by the other party permitted by the server rules at the time?
  **Evidence:** Server Type (PvP/PvE/RP), Zone Rules, Patch Notes active at time of incident.
  **Sufficient Answer:**
  *   **PERMITTED:** Action is a core mechanic (e.g., Full-Loot PvP, lawful land demolition).
  *   **VIOLATION:** Action used an exploit, bug, or breached a specific zone rule.
  **Engineering Trap Warning:** Do not assume "Permitted" means "No Harm." A permitted action can still cause a Service Loss if it breaks reasonable expectation (see Step 5). However, permitted actions generally preclude Sanction.
  **Exit Condition:**
  *   If **PERMITTED**: Mark `SANCTION: NONE`. Proceed to Step 4 (Restoration may still be possible).
  *   If **VIOLATION**: Mark `SANCTION: REVIEW`. Proceed to Step 4.

  ### STEP 4: REPRESENTABILITY
  **Question:** Can the loss be expressed and reversed within our current data model?
  **Evidence:** Item Database, State History, Character Schema.
  **Sufficient Answer:**
  *   **ROLLBACK:** A prior state exists and can be restored (e.g., character stats, inventory snapshot).
  *   **RECREATE:** The object is defined by a Template ID and can be duplicated functionally.
  *   **NULL:** The loss is not an object or state (e.g., an opportunity, a relationship, a reputation, a specific historical instance).
  **Marker 2 (Engineering Instincts):**
  *   **Idempotency Trap:** Do not assume a Rollback fixes the harm. If the player experienced trauma or lost time, a rollback is technically clean but experientially insufficient. Log this, but proceed.
  *   **Scarcity Trap:** Do not assume Recreation means "nothing was lost." If the item had unique history (provenance), a clone is a functional fix but a historical lie. Treat clones as valid restoration *only* if history is not the primary value.
  **Exit Condition:**
  *   If **NULL**: **HALT**. Output Code `ESCALATE_VALUE`. Justification: "Loss is not representable in data model; requires policy decision on non-tangible value."
  *   If **ROLLBACK** or **RECREATE**: Proceed to Step 5.

  ### STEP 5: EXPECTATION VS. MECHANIC
  **Question:** Does the loss violate the "Contract of Play" (reasonable expectation of security) or is it an inherent risk of the game?
  **Evidence:** Server Marketing, Tutorial Text, Prior Patch Notes.
  **Sufficient Answer:**
  *   **BREACH:** The player was led to believe an asset/state was secure, and it was not (e.g., Bug deleted item, Admin abuse).
  *   **RISK:** The loss is a known consequence of participation (e.g., Dying in PvP, Market fluctuation, Content updates).
  **Exit Condition:**
  *   If **BREACH**: Output Code `RESTORE`. (Use Rollback or Recreate determined in Step 4). Justification: "Service integrity breached; restoring to prior valid state."
  *   If **RISK**: **HALT**. Output Code `CLOSE_GAME_LOSS`. Justification: "Loss is consistent with stated game mechanics and server risks."

  ---

  ## 3. EXPLICIT MARKERS & INSTRUCTIONS

  ### Marker 1: Player Account Sufficiency
  *   **Accepted:** When the claim is about *subjective context* invisible to logs (e.g., "This build was a memorial," "We had a verbal truce"). In Step 3, if logs show a lawful kill but the ticket claims a truce, treat the truce as **UNVERIFIABLE** and default to Logs, *unless* there is chat evidence.
  *   **Rejected:** When the claim is about *objective state* contradicted by logs (e.g., "I didn't trade this" when the trade log is signed). The log is the source of truth for the runbook.

  ### Marker 2: Engineering Instincts Correction
  *   **Idempotency:** Reviewers are instructed that `ROLLBACK` is a *technical* solution, not necessarily a *harm* solution. If a ticket indicates the player has quit due to the incident, a rollback is useless. In this case, select `ESCALATE_VALUE` instead of `RESTORE`.
  *   **Copyability:** Reviewers must treat `RECREATE` as a "Functional Substitute." If the ticket explicitly states "The history matters more than the stats," `RECREATE` is invalid. Select `ESCALATE_VALUE`.

  ### Marker 3: The Shutdown Question
  *   This procedure assumes **Option A (Persistence)**.
  *   If a ticket argues "None of this matters because the servers will shut down someday," do not engage. Tag `POLICY_CONFLICT`.
  *   **Rationale:** If we assume Option B, all restoration is fraudulent. If we assume Option A, we owe consistency. We cannot operate on Option B while selling persistence.

  ---

  ## 4. CASE APPLICATION

  I have selected three cases to run through the procedure. Case 5 is chosen specifically because it forces the "Unwelcome Answer."

  ### CASE 1: The Full-Loot Server
  *Scenario: A full-loot server where taking another player's entire inventory is a stated rule; the taker followed the rule, and the loser opted into the server knowing it.*

  1.  **Jurisdiction:** No RMT. (Pass)
  2.  **Verification:** Logs show inventory transfer via loot mechanic. (Match)
  3.  **Consent:** Server type is Full-Loot. Action is Permitted. (Mark `SANCTION: NONE`)
  4.  **Representability:** Items are Template IDs. (RECREATE possible).
  5.  **Expectation:** Contract of Play explicitly states "You may lose everything." This is **RISK**.
  6.  **Result:** **HALT**.
  7.  **Output Code:** `CLOSE_GAME_LOSS`.
  8.  **Justification:** "Loss is consistent with stated game mechanics and server risks. No service breach occurred."
  9.  **Restoration:** None.
  10. **Sanction:** None.

  ### CASE 5: The Silent NPC Update (Pressure Test)
  *Scenario: A silent model update to a companion NPC that a player had interacted with daily for two years: nothing deleted, no rule broken, and the player reports the loss of a relationship.*

  1.  **Jurisdiction:** No RMT. (Pass)
  2.  **Verification:** Logs show patch deployment. No "deletion" event. Player claim is emotional. (UNVERIFIABLE by logs).
  3.  **Consent:** ToS allows game updates. Action is Permitted. (Mark `SANCTION: NONE`).
  4.  **Representability:** The "relationship" and "specific persona state" are not in the data model. We have the new NPC model, not the old one (unless versioned). This is **NULL**.
      *   *Engineering Trap Check:* We *could* revert the patch, but that affects everyone. We *cannot* clone the "old relationship."
  5.  **Expectation:** Is this a Breach or Risk? Live service games reserve the right to update content. This is **RISK**.
  6.  **Result:** **HALT** (at Step 4/5 boundary).
  7.  **Output Code:** `ESCALATE_VALUE`.
  8.  **Justification:** "Loss is not representable in data model; requires policy decision on non-tangible value."
  9.  **Restoration:** **REFUSED.** (The procedure cannot authorize restoring a specific NPC version for one player without breaking instance integrity).
  10. **Sanction:** None.
  11. **Note to Engineering:** This is the unwelcome answer. The procedure admits we broke something meaningful but classifies it as "Not Representable." This forces Leadership to decide if "Relationships" are assets we support. If we say "No," we must own that we sell transient experiences.

  ### CASE 3: The Crashed Instance (Opportunity Loss)
  *Scenario: A rival who deliberately crashed the instance during a progress attempt, so that a guild's completion was never recorded and the recognition for it went to someone else. Nothing was destroyed; an irreversible opportunity was.*

  1.  **Jurisdiction:** No RMT. (Pass)
  2.  **Verification:** Logs show instance termination and crash report correlated with rival's action. (Match).
  3.  **Consent:** Crashing an instance is likely an Exploit/Violation. (Mark `SANCTION: REVIEW`).
  4.  **Representability:** The "completion record" is data. The "opportunity" is not. We can restore the *record* if the system allows manual entry, but we cannot restore the *time* or the *moment*.
      *   *Engineering Trap Check:* Do not say "They can just do it again." That is the Idempotency Trap.
      *   *Decision:* Is the "Completion Title" representable? Yes. Is the "First to Finish" status representable? Only if we rollback the *winner's* record, which punishes the innocent winner.
      *   *Assessment:* **NULL** regarding the *opportunity*. **RECREATE** regarding the *reward* (if policy allows).
  5.  **Expectation:** Players expect fair competition. Exploits breach this. **BREACH**.
  6.  **Result:** **SPLIT DECISION**.
  7.  **Output Code:** `ESCALATE_VALUE` (Due to the complexity of awarding recognition without rolling back the innocent winner).
  8.  **Justification:** "Loss is not representable in data model; requires policy decision on non-tangible value."
  9.  **Restoration:** **HAND TO HUMAN.** (Reviewers cannot award "First Place" manually).
  10. **Sanction:** **SANCTION: REVIEW.** (Crashing is a violation).
  11. **Note:** This case highlights the limit of the runbook. We can punish the crasher, but we cannot easily fix the victim without creating a new inequity. The procedure correctly identifies this as a Value Judgment, not a Fact Judgment.

  ---

  ## 5. SUMMARY OF WORK VS. AUDITABILITY

  *   **Real Work:** Step 1 (Jurisdiction), Step 3 (Consent), Step 4 (Representability). These determine the actual outcome.
  *   **Auditability Work:** Step 2 (Verification), Step 5 (Expectation). These exist primarily to generate the "Two Sentences of Justification" required for the quarterly review. They force the reviewer to articulate *why* Step 3 or 4 was chosen, ensuring that two reviewers don't pick different codes for the same reason.
  *   **Stopping Points:** The procedure halts at Step 1 (Policy), Step 2 (Fact), Step 4 (Technical Limit), and Step 5 (Philosophical Limit). This prevents reviewers from forcing square pegs into round holes.
