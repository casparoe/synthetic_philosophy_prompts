  ### The Potentia of the Multitude and the Brexit Fracture: A Spinozist Analysis of the 2016 Referendum

  To analyze the 2016 United Kingdom European Union membership referendum through the lens of Baruch Spinoza is to move beyond the procedural mechanics of ballots and majorities. In his late political writings, particularly the *Theological-Political Treatise* (TTP) and the unfinished *Political Treatise* (TP), Spinoza defines democracy not merely as a method of aggregation but as the "absolute form of government." It is absolute because it most closely approximates the natural state of mankind, where sovereignty is identical to the collective power (*potentia*) of the multitude. For Spinoza, a democratic state is stable only insofar as it aligns the *conatus* (the striving to persist) of individuals with the common law through reason. When the state is driven by passive affects—fear, hope, indignation—rather than rational agreement, it risks fragmentation and a descent into aristocracy or tyranny.

  Viewed through this framework, the Brexit referendum was not a triumph of democratic sovereignty but a fluctuation of *potentia* driven by passion, revealing the fragility of aligning individual strivings without rational institutions. The subsequent constitutional conflict between the referendum result and Parliament illustrates the tension between the immanent power of the multitude and the delegated authority (*potestas*) of representatives, exposing both the prescience and the limitations of Spinoza's political ontology in the modern era.

  #### I. The Composition of the Multitude: *Cives* and *Subditi* in the Franchise

  Spinoza distinguishes between those who are *sui juris* (their own right) and capable of entering into rational agreement (*cives*), and those who are dependent (*subditi*). In the *Political Treatise*, he controversially excludes women, servants, and foreigners from the democratic franchise, arguing that their dependence prevents them from exercising independent reason. While modern sensibilities reject the exclusion of women, the Spinozist logic regarding dependence offers a critical tool for analyzing the Brexit franchise.

  The 2016 referendum franchise included UK, Irish, and Commonwealth citizens resident in the UK, but excluded long-term resident EU nationals. Under Spinoza's ontology, these excluded residents were *subditi*: they were subject to the laws and economic consequences of the decision (their *conatus* was affected) but were denied the capacity to shape the common decree. By excluding a segment of the multitude whose power contributed to the state's economic and social fabric, the referendum failed to maximize the collective *potentia*. It created a class of subjects bound by a law they had no hand in making, a condition Spinoza associates with instability. If democracy is the alignment of individual power with common law, the exclusion of EU nationals ensured that a portion of the multitude's power remained external to, and potentially antagonistic toward, the state's new direction.

  Furthermore, the "multitude" in the UK was not a homogeneous body sharing a common nature. Spinoza assumes that for democracy to function, citizens must share sufficient affects and interests to reach agreement. The referendum revealed a fractured multitude: Scotland and Northern Ireland voted to Remain, while England and Wales voted to Leave. This regional disparity indicates that the *conatus* of the Scottish multitude was aligned with EU membership (perhaps due to distinct economic structures or political identities), while the English *conatus* aligned with sovereignty reclamation. When the "common law" is determined by a simple majority that overrides the distinct strivings of significant constituent parts, the state does not express a shared rational determination. Instead, it expresses the domination of one part of the multitude over another.

  This domination was exacerbated by the binary framing of the choice. Spinoza warns against the multitude being led by "orators" who manipulate affects. The Leave/Remain binary was not the product of a deliberative assembly where reasons could be exchanged and synthesized; it was a construct of party structures designed to mobilize passion. The campaign was characterized not by the pursuit of the common good through reason, but by what Spinoza calls "vacillations of the mind"—specifically, the fear of lost sovereignty (Leave) and the fear of economic loss (Remain). For Spinoza, a decision driven by hope and fear is inherently unstable because these passions are contingent on external fortunes. The referendum, therefore, did not express the rational freedom of the *cives* but the affective volatility of a crowd, failing the Spinozist criterion of democracy as the rule of reason.

  #### II. Parliamentary Resistance: Rational Preservation or Aristocratic Decay?

  The immediate constitutional aftermath of the referendum presented a clash between the expressed will of the multitude (the vote) and the institutional authority of Parliament. Spinoza identifies democratic sovereignty with the collective power of the citizens (*potentia*) rather than with a delegated authority (*potestas*) that stands above them. However, he also recognizes that the multitude is often led by passion rather than reason. This creates a paradox: if the sovereign (Parliament) ignores the multitude, it undermines its own power base; if it obeys a passionate multitude, it endangers the state's rational stability.

  Following the vote, the UK Parliament faced the legal and political question of whether it was bound to trigger Article 50. The Supreme Court's *Miller* ruling affirmed that Parliament must legislate to authorize withdrawal, asserting the primacy of parliamentary *potestas*. Through a Spinozist lens, this resistance can be interpreted in two contradictory ways.

  First, it could be viewed as a rational preservation of democratic sovereignty. If the referendum was an expression of passion (fear, nationalism) rather than reason, Parliament's role as a deliberative body was to temper these affects, refine the mandate, and ensure the decision aligned with the long-term *conatus* of the state. Spinoza argues that the purpose of the state is peace and security; if a direct democratic mechanism threatens this, the representative body has a duty to mediate. In this light, Parliament's reluctance was an attempt to prevent the state from acting self-destructively under the influence of temporary affects.

  Second, and more damningly, it could be viewed as the corruption of democracy into oligarchy. Spinoza argues that democracy naturally decays into aristocracy when a subset monopolizes deliberation and excludes the multitude from power. If Parliament used procedural hurdles to delay or negate the referendum result not to refine it rationally, but to protect the interests of a political class (the "Westminster elite") whose *conatus* was tied to the status quo, then it acted as an aristocratic faction. By treating the referendum as merely "advisory" despite the government's promise that it would be binding, the political establishment effectively severed the link between the *potentia* of the multitude and the *potestas* of the state.

  Spinoza warns that a sovereign cannot command against the grain of the multitude without weakening itself. The prolonged parliamentary gridlock (2016–2019) suggests that the *potestas* had lost touch with the *potentia*. The multitude, feeling its power denied, reacted with increased indignation (a passion Spinoza views as highly destabilizing). Thus, Parliament's resistance, whether intended as rational mediation or elite protectionism, ultimately contributed to the fragmentation of the state's power, confirming Spinoza's suspicion that when the channels between the multitude's power and the state's law are blocked, the result is not stability but conflict.

  #### III. Assessing Spinoza's Theory: Confirmation, Gaps, and Blind Spots

  The Brexit episode serves as a rigorous stress test for Spinoza's political theory, confirming certain diagnoses while exposing significant gaps in his conceptual framework regarding the modern state.

  **Where the Mapping Holds:**
  Spinoza's diagnosis of the affective dangers of direct democracy in large states is confirmed by Brexit. He posits that the multitude, unless guided by reason, is prone to "inconstancy" and driven by immediate affects. The referendum campaign demonstrated exactly this: voting patterns correlated strongly with emotional responses to immigration and sovereignty rather than a rational calculation of utility. Spinoza's claim that democracy is vulnerable when the multitude is fragmented by conflicting passions is vividly illustrated by the UK's internal regional fractures. Furthermore, his insight that sovereignty is ultimately grounded in *potentia* (power) rather than legal right (*potestas*) was vindicated; despite legal arguments about parliamentary supremacy, the political reality was that the government could not sustainably govern against the momentum of the referendum result without risking civil unrest or electoral annihilation. The "power of the multitude" ultimately forced the hand of the "authority of Parliament."

  **Where the Mapping Breaks:**
  The primary break lies in Spinoza's assumption of a "common nature." Spinoza's democratic ideal relies on the possibility that citizens, sharing a similar environment and nature, can come to rational agreement. Brexit revealed a level of cultural and economic heterogeneity that Spinoza did not anticipate in the nation-state. The "Leave" and "Remain" camps did not just disagree on policy; they operated with different epistemic frameworks and definitions of the "common good." For Spinoza, reason is universal; if all men were guided by reason, they would agree. The Brexit impasse suggests that in modern pluralistic societies, the *conatus* of different groups are so divergent that rational agreement on fundamental constitutional questions may be impossible, not because of a lack of reason, but because the "common" in common law has dissolved.

  **Conceptual Blind Spots:**
  Two features of the modern state lie largely outside Spinoza's conceptual space.

  First, **Supranationality**. Spinoza's political theory is strictly state-centric. Sovereignty is absolute within the borders of the *civitas*. The European Union represents a form of pooled sovereignty that Spinoza's ontology struggles to accommodate. Is the EU a treaty between states, or a higher sovereign? For Spinoza, a treaty is only valid as long as it is useful (*utilitas*). When the UK multitude deemed the EU no longer useful to their *conatus*, the treaty lost its binding power. However, Spinoza lacks the vocabulary for the complex legal entanglement of modern supranational membership, where sovereignty is not just a matter of power but of intricate legal integration that cannot be severed by a simple act of will without severe self-harm.

  Second, **Party Systems**. Spinoza fears factions and recommends that the state prevent the formation of groups that might challenge the sovereign. Modern democracy, however, is structurally dependent on political parties to organize deliberation and choice. The Brexit referendum was not a spontaneous expression of the multitude but was engineered by factional struggles within the Conservative Party. Spinoza's theory does not account for a system where the "deliberative assembly" is pre-structured by partisan competition that incentivizes polarization rather than rational consensus. The binary referendum was a tool of party management, not democratic expression, a phenomenon that falls outside Spinoza's understanding of how democratic will is formed.

  #### Conclusion

  Through Spinoza's lens, the 2016 referendum was not an exercise in true democracy but a surge of *potentia* unmediated by reason. It failed to align the *conatus* of the whole multitude (excluding EU nationals and fracturing regions) and was driven by passive affects rather than rational deliberation. The subsequent parliamentary resistance highlighted the perilous gap between the power of the multitude and the authority of institutions; in trying to manage the passion of the vote, Parliament risked appearing as an aristocratic oligarchy, further destabilizing the state.

  Ultimately, the Brexit case confirms Spinoza's suspicion that large, heterogeneous states are vulnerable to passion-driven fragmentation when direct mechanisms bypass rational mediation. However, it exposes a critical gap in his theory: the assumption that a "common nature" exists to be recovered. In the modern world, where supranational obligations and party systems structure choice before deliberation begins, the Spinozist ideal of democracy as the rational alignment of *conatus* faces a challenge he did not foresee. The state remains a balance of powers, but the "reason" required to hold it together is increasingly scarce, leaving the multitude to oscillate between the passions of hope and fear, precisely as Spinoza warned, but without the institutional recourse he envisioned to restore equilibrium.
