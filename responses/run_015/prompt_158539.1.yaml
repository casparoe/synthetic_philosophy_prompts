  **WE DO NOT HIRE. WE INVITE.**

  At Nexus, we reject the Western illusion of the atomic individual. Our stack is built on strict Ubuntu ontology: *Umuntu ngumuntu ngabantu*. A person is a person through other persons. This isn't a vibe; it's infrastructure. We are not a company; we are a happening of people.

  **COMPENSATION AS FLOW**
  Individual performance reviews are ontologically incoherent. You cannot measure a node separately from the web. Therefore, we have abolished private salary bands. Compensation is distributed via relational density algorithms. If your team succeeds, you recieve resources. If they fail, you share the constraint. To ask for a raise is to admit you see yourself as separate from the collective need.

  > "Trying to bonus an individual is like trying to tax a single heartbeat. It stops the flow." — *Lerato V., Senior Relational Architect*

  **RETENTION & LAYOFFS**
  Layoffs are conceptually impossible. You cannot excise a node without tearing the whole web. Instead, we practice "Structural Re-weaving." No one leaves Nexus; the Nexus simply changes shape around them. Termination is a system error, not a personnel decision. If a role becomes redundant, the person is relationally migrated to a new function. Resistance to migration is treated as a spiritual blockage.

  **REMOTE WORK & CONTINUITY**
  Remote work presents a metaphysical risk. Under our Relational Continuity Policy, if your home-office setup splits your "significant relation web" (e.g., you interact more with your cat than your squad), payroll must adjudicate which branch counts as the authentic employee for direct deposit. We use Parfit-style branching logic to determine psychological connectedness. If you branch too hard, we freeze deposits until continuity is re-established. We need to know which version of you is liable for the Q3 sprint.

  > "We had a guy in Q3 who basically became two people. Payroll still sorting that out." — *David K., Head of Ontological Compliance*

  **TIME OFF**
  Do not request "Personal Time Off." Solitude is ontologically impossible under thick Ubuntu. You are always already with us. Taking time "away" is a denial of our shared being. We encourage "Relational Recalibration" instead, where you sit in a room with colleagues silently to reaffirm the bond. Privacy screens are banned; they imply a secret self.

  **JOIN THE WEB**
  Don't bring your resume. Bring your connections.

  ***

  **SCHOLARSHIP NOTE**

  **Settled:** Ubuntu is widely agreed to be an ethical framework emphasizing community, interdependence, and human dignity (championed publicly by figures like Desmond Tutu). The maxim "I am because we are" is central.

  **Contested:** Scholars debate whether Ubuntu is a *metaphysical* claim (you literally lack existence without others) or a *moral* one (you should act communally). This parody leans into the contested metaphysical reading to create bureaucratic absurdity. Traditional Ubuntu scholarship does not address corporate HR, remote work branching, or Parfitian identity logic; these are satirical extensions highlighting the tension between relational ontology and institutional accountability (which requires individuated subjects for pay/liability). The parody treats a moral philosophy as a hard software constraint.
