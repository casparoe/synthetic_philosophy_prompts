answer: |-
  # Specification: The Kitchen-Table Verbal Dispute Test

  **Purpose:** To diagnose whether a disagreement is *merely verbal* (clash of meanings) or *substantive* (clash about the world), without dismissing the importance of the outcome.
  **Users:** Two parties in conflict, optionally with a neutral moderator.
  **Constraint:** All checkable facts are already agreed upon.

  ## Part 1: Requirements

  ### Requirement 1: The Stipulation Swap
  *   **The Case:** The Sourdough Starter. You and your brother-in-law agree on every biological fact (cells, metabolism, reproduction). You disagree only on whether it counts as "alive."
  *   **The Test:** Ask both parties: "If we agree to use the word 'alive' to mean [Definition A] for the next five minutes, do you still disagree?" Then repeat for [Definition B].
  *   **Why It's Needed:** This isolates meaning from fact. If the disagreement vanishes when a definition is forced, the fight was about the label, not the object.
  *   **Why It Breaks Without It:** Without this, you cannot distinguish a fight about biology from a fight about dictionary definitions. You might keep searching for biological facts that don't exist.
  *   **Status:** **Non-Negotiable.** This is the core mechanism of the test.

  ### Requirement 2: The External Authority Check
  *   **The Case:** The Insurance Policy. A homeowner claims water damage; the policy covers "burst pipes" but excludes "flooding." Both agree on how the water entered. They disagree on whether it counts as "flooding."
  *   **The Test:** Ask: "Is there a contract, statute, or rule that defines this word for this specific situation?" If yes, the parties are not allowed to stipulate their own meanings. They must argue about which *authorized* definition fits the facts.
  *   **Why It's Needed:** In legal or insurance contexts, meaning is not up to the speakers. A dispute here is substantive because it determines rights and money, even if it looks semantic.
  *   **Why It Breaks Without It:** If you treat this as merely verbal, you might tell the parties to "just agree on a definition." They can't. The definition is fixed by a third party. Ruling this verbal dissolves a valid claim for compensation.
  *   **Status:** **Non-Negotiable.** For your work in claims and community grants, this is the difference between mediation and malpractice.

  ### Requirement 3: The Consequence Gap
  *   **The Case:** The Existence of Numbers. Two people argue whether numbers "really exist" outside of human minds. They agree on how to do math, how to build bridges, and how to balance checkbooks.
  *   **The Test:** Ask: "If you win this argument, what changes in how we act tomorrow?" If the answer is "nothing changes in practice," the dispute is verbal *and* low-stakes. If the answer is "we stop funding the math department" or "we change the grant criteria," the dispute is substantive regarding consequences, even if verbal regarding facts.
  *   **Why It's Needed:** This prevents the test from treating "pointless" and "verbal" as synonyms. A dispute can be about words but still matter deeply (e.g., whether a lot is "blighted" determines funding).
  *   **Why It Breaks Without It:** You would incorrectly dismiss the "Blighted Lot" argument as pointless philosophy. It is verbal (about the threshold of "blight"), but it controls money. The test must flag it as "Verbal but High-Stakes."
  *   **Status:** **Non-Negotiable.** You explicitly requested that stakes change the answer.

  ### Requirement 4: The Continuum Boundary
  *   **The Case:** The Clean Room. A landlord and tenant agree on the amount of dust and trash in the room. They disagree on whether the room is "clean."
  *   **The Test:** Ask: "Are we arguing about where to draw the line on a scale, or about the facts on the scale?" If the facts are known and the scale is continuous (dirty to clean), the dispute is about the *cutoff point*, not the reality of the room.
  *   **Why It's Needed:** Vagueness is not the same as verbal confusion. Both parties can mean the same thing by "clean" but disagree on the threshold.
  *   **Why It Breaks Without It:** You might classify this as a factual dispute ("It is clean!") when it is actually a normative boundary dispute ("This level of dust is unacceptable"). The resolution requires setting a standard, not finding more dust.
  *   **Status:** **Preference.** A sophisticated user needs this, but a layperson might conflate "boundary" with "definition." It can be dropped if the test becomes too complex, but it risks misclassifying vagueness as fact.

  ### Requirement 5: The Error vs. Difference Filter
  *   **The Case:** The Tomato. One person insists a tomato is a vegetable. The other says it is a fruit.
  *   **The Test:** Ask: "Is one of us using the word in a way that violates a shared standard (like biology or culinary norms), or are we just using different standards?"
  *   **Why It's Needed:** Sometimes one person is just wrong, not using a different dialect. If I call a dog a "cat," that is an error, not a verbal dispute.
  *   **Why It Breaks Without It:** The test might validate ignorance as a "different meaning." If one party is simply mistaken about common usage, correcting them solves the problem faster than negotiating meanings.
  *   **Status:** **Preference.** Hard to enforce without an authority figure. In a kitchen table setting, it is often kinder to treat it as a difference (Req 1) than an error.

  ---

  ## Part 2: Tensions and Holes

  **The Primary Tension:** You suspected a conflict between *Internal Meaning* (what the speakers mean) and *External Stakes* (legal/financial consequences). This tension is real and creates a **Hole in the Specification**.
  *   **The Conflict:** Requirement 1 (Stipulation Swap) asks parties to ignore external rules and test their own meanings. Requirement 2 (External Authority) forbids them from ignoring external rules.
  *   **The Hole:** The test cannot simultaneously tell you "This is just a verbal dispute" (implying you can resolve it by agreeing on words) and "This dispute controls money" (implying you cannot agree on words, you must follow the contract).
  *   **The Fix:** The test must output two separate verdicts: **Semantic Status** (Verbal vs. Substantive) and **Procedural Status** (Negotiable vs. Binding). In the "Blighted Lot" case, the Semantic Status is *Verbal* (it's about the definition of blight), but the Procedural Status is *Binding* (the city grant rules apply). If you conflate these, you will tell people to "just compromise" on a legal definition they cannot change. You must accept that a dispute can be semantically empty but pragmatically critical.

  **The Secondary Tension:** *Introspection vs. Behavior.*
  *   **The Conflict:** The test relies on parties honestly reporting what they mean (Requirement 1). However, people often don't know what they mean until they are forced to act.
  *   **The Hole:** A party may claim, "I mean X," but act as if they mean Y. The test has no mechanism to catch lying or self-deception. It assumes good faith. In a hostile insurance claim, this assumption may fail.

  ---

  ## Part 3: The "Small Bet" Test Killer

  The single requirement that knocks out your friend's "Small Bet" proposal is **Requirement 2: The External Authority Check**.
  The "Small Bet" test asks: "Would you take a 10-to-1 bet that you are right?" This works for factual uncertainty (e.g., "Will it rain?"). It fails for verbal/legal disputes because the outcome isn't a matter of probability; it's a matter of rule interpretation. In the "Blighted Lot" case, I might be 100% willing to bet the lot is blighted by my standards, but that bet is irrelevant to whether the *City* grants the money. The bet tests my confidence, not the semantic compatibility or the contractual obligation. Requirement 2 exposes that the dispute isn't about the state of the world (which you can bet on), but about the application of a rule (which you cannot bet away).

  ---

  ## Part 4: Evaluation of Candidate Approaches

  The "Made-Up Word" approach (replacing "blighted" with "glarbed") satisfies Requirement 1 and 4 well because it forces parties to describe the physical state without the emotional baggage of the original word, quickly revealing if they agree on facts; however, it fails Requirement 2 because you cannot substitute legal terms in a contract dispute, rendering it useless for your insurance work. The "Really About Usage" approach (telling them they are arguing about which definition to adopt) satisfies Requirement 3 and the Tension Fix perfectly because it validates the stakes while clarifying the semantics, but it risks failing Requirement 5 because it treats all errors as legitimate differences in usage, potentially empowering bad-faith actors to redefine terms to suit their interests. For your specific needs, the "Usage" approach is safer, provided you enforce Requirement 2 to stop them from redefining terms that are already legally fixed.
