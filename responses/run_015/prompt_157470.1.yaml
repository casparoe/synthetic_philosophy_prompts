      *   *Refinement on Manipulation:* The user says KS blocks outside-option manipulation. But KS is *more* sensitive to the feasible set $S$. If I can add a option that benefits only me (raising my ideal point) but is never chosen, KS shifts in my favor. NBS ignores this (IIA). This is a classic critique of KS. I need to emphasize this.
      *   *Refinement on Normativity:* A normative theory that cannot be implemented because agents have incentives to deviate (due to the manipulation above) is a "paper norm."

  7.  **Final Polish:** Ensure the tone is respectful but rigorous ("honest map," "rationalist-style"). Use formatting for clarity. Ensure the ranking is clear.

      *   *Fatal:* Frontier Manipulation (IIA violation), Anchoring Unrealism (if claimed as descriptive basis for norm).
