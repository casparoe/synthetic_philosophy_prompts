answer: |-
  # The Algorithmic Bad Faith Sorter

  **Node 1: The Source of the Pull**
  When the app shows you exactly what you want, is it reading your mind like a stranger, or just remembering your own past clicks?
  *   **A:** It's a stranger (The Machine knows me better than I know me).
  *   **B:** It's a mirror (I trained this thing by clicking stuff like this before).

  **Node 2: The Transparency Test**
  *If you knew exactly how the app ranks videos but still opened it, does that feel like a free choice or a trap?*
  *   **A:** Free Choice (I see the strings and pull them anyway).
  *   **B:** Trap (Knowing the trick doesn't stop the spell).

  ---

  ### The Leaves (Where You Land)

  **1. Pure Sartrean Freedom** (Path B → A)
  You see the mirror and admit you hold it. The algorithm is just "facticity"—the wall you have to climb. You are responsible for every scroll because you co-wrote the menu.
  *   *The Lie You Avoid:* Pretending you didn't help build the cage.

  **2. Bad Faith 2.0** (Path B → B)
  You know it's your own past behavior driving the feed, but you pretend the app is hypnotizing you. The filter is transparent to you, but you hide that transparency from yourself to avoid responsibility.
  *   *The Lie You Tell:* "I can't stop" (when you mean "I won't stop").

  **3. Soft Determinism** (Path A → A)
  You believe the machine is an external force (a warden, not a mirror), but you maintain you can still walk away. The curation is heavy pressure, not a law of physics. You are responsible for resisting the push.
  *   *The Lie You Avoid:* Using the algorithm as an excuse for weak will.

  **4. Radical Unfreedom** (Path A → B)
  You believe the prediction model collapses your humanity into data. If the app knows you better than you know you, the "choice" to scroll is an illusion. You are an object being processed, not a subject making choices.
  *   *The Lie You Tell:* None (because you believe freedom is already dead).

  ---

  ### ⚠️ Dead Ends (Empty Combos)

  **The "Transparent Warden" Combo** (Path A → Transparency + Total Control)
  *   *Verdict:* **Incoherent.** If the machine is a totally external "Other" controlling you, you wouldn't have access to its weights. You can't be fully possessed by a stranger and simultaneously know their secret handshake.

  **The "Helpless Mirror" Combo** (Path B → No Agency + Self-Made)
  *   *Verdict:* **Ugly.** If the feed is only your own past self objectified, claiming you have *no* agency is a performative contradiction. You are saying "I built this prison and now I am locked in by myself" without acknowledging the key is in your pocket.
