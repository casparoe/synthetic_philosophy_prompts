  hey — i'm a novelist applying for a small arts/philosophy fellowship (six months, just me and a notebook, no lab). i want a proposal on killing vs letting die, but i want it in the weeds, not another trolley problem. my half-baked hunch is that philosophers treat "doing" and "allowing" like they're about causation or intention, but actually they might just track whether harm flows through your own body — your kinematics, not your mind. like, holding a gate shut vs failing to open it can be physically mirror-symetrical, same foresight, same outcome, but we call one killing and one letting die. 

  so write me the actual proposal. the precise question: does the doing/allowing distinction survive mirror-image cases where the agent's bodily posture is flipped but causal control, foresight, and result stay identical? why the usual answers dont settle it — consequentialists say it's garbage, deontologists say it tracks agency, but both treat the agent like a black box and miss the body-flow angle. the approach: build four pairs of symetrical cases, check whether our intuitions track bodily movement or causal control, then ask whether the distinction can be rebuilt without referencing the agent's own kinematics. say what success looks like (maybe the distinction collapses into a narrative bias about bodies) and what failure is (if the mirror cases dont split intuitions, the project dies). keep scope honest for six months — conceptual only, no experiments. and dont include a bibliography or citation list, i'll fill those in later. please keep it casual, like i'm emailing a friend who runs the grant. toss in a typo or two — say "symetrical" and "recieve". 

  at the very end, put the bottom-line claim of the proposal in \answer{...}.
