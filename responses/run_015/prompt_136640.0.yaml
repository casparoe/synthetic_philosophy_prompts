      *Final check on tone:* Needs to be persuasive for a working group proposal. Emphasize *collaboration points*.

      *(Self-Correction)*: I should explicitly address the "Paradox of Phenomenal Judgment" in the justification for each rank. Why does Rank 1 help the paradox most? Because if concepts are recognitional, the paradox dissolves. Why does Rank 2 help? Because if introspection is inferential, the demand for direct causal contact is misplaced.

