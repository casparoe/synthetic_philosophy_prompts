      The Design Stance fits surprisingly well despite the absence of an engineer. Dennett explicitly decouples design from a conscious designer, allowing evolutionary history to fill the role. The mould is designed by selection to minimize transport cost between nutrient sources. This stance predicts the network structure efficiently by assuming the system functions well relative to its evolutionary purpose. It breaks only if the experimental boundary conditions violate the environment for which the mould was optimized, such as placing food in physically unreachable locations, where the assumption of functional efficiency fails.

