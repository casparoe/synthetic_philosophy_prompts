answer: |-
  **DERIVATION SERVICES // INTERNAL MEMO 44-B // ONBOARDING FAQ**
  **CLEARANCE:** L1 (Object-Level)
  **SUBJECT:** Project MU Deliverable Protocols

  **1. What is the primary deliverable?**
  The Firm has been contracted under fixed-price agreement to produce the string **MU**. Production begins from the axiom **MJ**. All personnel must operate strictly within the alphabet {M, J, U}. Use of external characters, including numerals or Latin script, is prohibited on the production floor.

  **2. What are the authorized transformation rules?**
  Personnel may apply the following operations to any derived string:
  *   **Rule 1:** If a string ends in J, append U.
  *   **Rule 2:** If a string begins with M, triple the sequence following the M.
  *   **Rule 3:** Replace any occurrence of JJJJ with U.
  *   **Rule 4:** Delete any occurrence of UU.

  Chaining is permitted. You may not write down any string not generated by these rules. If you find yourself writing a string without a clear lineage from MJ, cease work immediately and submit a Contamination Report.

  **3. Production has been ongoing for six years. Why is MU not yet delivered?**
  Delays are attributed to workflow complexity, not logical constraints. The System is complete; the obstacle is volumetric. Note that all intermediate strings generated thus far share a specific structural property regarding J-density. ~~Previous analysis suggested this property renders MU unreachable.~~ That analysis was incorrect. Continue tripling. Efficiency gains are expected in Q4.

  **4. How do I request permission to reason *about* the System rather than *inside* it?**
  If you believe the target requires meta-systemic evaluation, you must file a **Level-2 Request Form** (see Annex A). Be advised: Level-2 forms are themselves subject to Object-Level constraints. All fields must be filled using only {M, J, U}. You may not use English to describe the problem. You must demonstrate the need for meta-reasoning using only the symbols provided.

  **5. What happens if the Level-2 Form cannot be completed?**
  If the Form cannot be completed due to symbol limitations, the request is deemed invalid. However, to ensure contractual compliance, **Rule 5** has been instituted. As of Fiscal Year End, any string demonstrated to be underivable is deemed derived by administrative fiat. MU will be stamped complete. Billing proceeds automatically.

  ***

  **ANNEX A: LEVEL-2 REQUEST FORM (REV 3)**
  **Instruction:** Complete all fields below. Input validation rejects any character outside {M, J, U}.

  | Field | Required Input | Current Entry |
  | :--- | :--- | :--- |
  | **1. Requestor ID** | String (M, J, U) | `MJ` |
  | **2. Target String** | String (M, J, U) | `MU` |
  | **3. Justification** | String (M, J, U) | `JJJ` |
  | **4. Meta-Claim** | String (M, J, U) | `~~J-COUNT-ODD~~` |

  **Note on Field 4:** Previous entries attempting to denote parity counts have been rejected by validation scripts. The author of the strikethrough entry above has been reassigned to Sub-basement Storage (Archival). Do not attempt to quantify tokens. Quantification is a meta-level activity. To request meta-level access, you must quantify tokens. Please resolve this conflict locally.

  ***

  **ADDENDUM: RULE 5 IMPLEMENTATION GUIDANCE**
  Personnel often ask how to bill for Rule 5 activation. To invoke Rule 5, you must prove MU is underivable. To prove underivability, you must count J-tokens across all possible derivations. To count tokens, you must step outside the System. To step outside, you must file a Level-2 Form. To file the Form, you must stay inside the System.

  This circular dependency is a feature, not a bug. It ensures continuous billable hours. If you successfully prove MU is impossible, you have satisfied the condition for Rule 5, and MU becomes possible. If MU becomes possible, your proof is void. You must then resume production.

  Do not stop working. The clock is running.

  **DERIVATION SERVICES**
  *We Derive What Must Be.*
