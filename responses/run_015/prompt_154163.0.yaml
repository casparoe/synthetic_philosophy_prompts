  # Evidential Reliability and Self-Location: A Jeffrey Conditionalization Test Case in the Deceptive Sleeping Beauty Variant

  ## Abstract

  This research proposal outlines a one-semester project designed to investigate the limits of Jeffrey conditionalization in handling self-locating beliefs under conditions of evidential deception. The project centers on a precise variant of the Sleeping Beauty problem, termed the "Deceptive Tuesday Variant." In this scenario, a fair coin determines the experimental protocol: if Heads, the subject (Beauty) is awakened once on Monday with veridical evidence of the day; if Tails, she is awakened on Monday with veridical evidence and again on Tuesday with false evidence indicating it is Monday. Upon awakening, Beauty possesses evidence suggesting it is Monday, but she cannot distinguish between veridical Monday awakenings and deceptive Tuesday awakenings. The core research question is whether rational credence updates in this scenario can be fully accommodated within the framework of Jeffrey conditionalization—treating temporal location and evidential reliability as parameters of the evidence partition—or whether they require a distinct formal apparatus for self-locating belief, such as centered world semantics.

  Standard resolutions to the Sleeping Beauty problem, specifically the Halfer and Thirder positions, rely on the assumption that the subject correctly identifies her temporal stage or that the evidence is veridical. The Deceptive Tuesday Variant disrupts this assumption by introducing a branch of possibility where the subject's indexical evidence is systematically misleading. This proposal argues that this disruption creates a divergence between updates based on world-branch hypotheses and updates based on evidential parameters. The methodology involves constructing a parameterized probability model that distinguishes between world-branch (Heads vs. Tails), temporal stage (Monday vs. Tuesday), and evidential status (Reliable vs. Misled). The project will derive the rational credence for the coin landing Heads under two competing framings: one treating reliability as a hypothesis and one treating it as an evidential constraint. Success will be defined as a demonstration that one framing yields pragmatic consistency (immunity to Dutch Book arguments) while the other does not, or a proof that both converge, thereby dissolving the dispute. Failure will be defined as the formalization collapsing into an existing answer without explaining the unique behavior of the false-evidence case. The project scope is strictly limited to the formal modeling and philosophical defense of this specific variant, ensuring completion within a three-month timeline.

  ## 1. Introduction

  The problem of self-locating belief concerns how rational agents should update their credences when they receive information about their own position in the world, such as the time, location, or identity, without receiving new information about the objective state of the world. The Sleeping Beauty problem serves as the primary test case for theories of self-locating belief. In the standard formulation, Beauty is put to sleep and woken up once or twice depending on a coin toss, with her memory erased between awakenings. The central debate lies between the "Halfers," who maintain her credence in Heads should remain 1/2, and the "Thirders," who argue it should shift to 1/3. This debate has persisted for decades, suggesting that the standard formal tools of Bayesian epistemology may be insufficient for handling indexical information.

  The persistence of this debate indicates a deeper structural uncertainty regarding how evidence is parameterized in self-locating contexts. Standard Bayesian conditionalization requires an agent to update on a proposition $E$ that becomes certain ($P_{new}(E) = 1$). However, in Sleeping Beauty scenarios, the agent is rarely certain of her temporal location. Jeffrey conditionalization offers a generalization that allows updates on uncertain evidence, where the probability of the evidence partition shifts but does not necessarily reach unity. Proponents of Jeffrey conditionalization argue that it can subsume self-locating updates by treating the "seeming" of a temporal location as the evidential parameter. Opponents argue that self-locating beliefs require a sui generis logic, often involving centered possible worlds, because the content of the belief is essentially indexical and cannot be reduced to propositional attitudes about the external world.

  This research project proposes to adjudicate between these frameworks by introducing a critical variation: the Deceptive Tuesday Variant. In standard Sleeping Beauty cases, it is assumed that if Beauty is awakened, her evidence regarding her awakening is veridical, even if she is uncertain about the day. She knows that if it is Tuesday, she will feel like it is Tuesday, or at least she is not actively misled about the day. The Deceptive Tuesday Variant removes this guarantee. In the Tails branch, the Tuesday awakening is accompanied by active deception: Beauty is presented with evidence that strongly suggests it is Monday, identical to the evidence she receives on the actual Monday awakenings.

  This modification is not merely a complication; it is a stress test for the formal apparatus of belief update. If Jeffrey conditionalization is robust, it should handle deceptive evidence by adjusting the likelihoods within the evidence partition. The agent updates on "It seems to be Monday," and the model accounts for the possibility that "It seems to be Monday" is true while "It is Monday" is false. However, if self-locating belief requires a separate apparatus, the deception might break the link between the "center" of the world (the agent's perspective) and the "world" itself in a way that standard probability spaces cannot capture without ad hoc adjustments.

  The significance of this project lies in its potential to clarify the boundary between general epistemology and the logic of indexicals. If the Deceptive Tuesday Variant can be resolved using standard Jeffrey conditionalization, it suggests that the Sleeping Beauty problem is not a problem of self-location per se, but a problem of uncertain evidence and reliability. This would imply that no special "self-locating logic" is required, only a careful application of existing Bayesian tools to indexical evidence. Conversely, if Jeffrey conditionalization yields inconsistent or pragmatically vulnerable results in this variant, it provides strong evidence that self-locating beliefs operate under different normative constraints than standard propositional beliefs.

  The project is designed for a one-semester timeline, approximately three months of intensive research. The scope is deliberately narrow: it does not attempt to solve the general Sleeping Beauty problem or to refute the Halfer or Thirder positions in their standard forms. Instead, it focuses exclusively on the behavior of rational credence in the Deceptive Tuesday Variant. By isolating the variable of evidential reliability, the project aims to produce a decisive test case for the adequacy of Jeffrey conditionalization. The output will be a formal model, a derivation of rational credences, a pragmatic consistency check (Dutch Book analysis), and a philosophical defense of the results.

  This proposal details the specific variant, critiques the applicability of standard positions, outlines the theoretical framework, specifies the modeling methodology, defines success and failure conditions, and provides a realistic scope assessment. The goal is to determine whether the machinery of Jeffrey conditionalization is flexible enough to accommodate the friction introduced by deceptive self-location, or whether this friction reveals a crack in the foundation of standard Bayesian epistemology when applied to the self.

  ## 2. The Deceptive Tuesday Variant: Problem Statement

  To ensure the research remains focused, the experimental protocol of the Deceptive Tuesday Variant must be defined with rigorous precision. Ambiguity in the setup is a common source of error in Sleeping Beauty analyses, often allowing competing positions to talk past one another by assuming different underlying probability spaces. This project adopts a protocol that maximizes the tension between evidential reliability and temporal location.

  **The Protocol**
  1.  **Coin Toss:** On Sunday, a fair coin is tossed. The objective chance of Heads ($H$) is 0.5, and the objective chance of Tails ($T$) is 0.5. Beauty is informed of the fairness of the coin.
  2.  **Heads Branch:** If the coin lands Heads, Beauty is awakened on Monday morning. She is placed in a room with a digital display. The display reads "Monday." This evidence is veridical. After the interview, the experiment ends.
  3.  **Tails Branch:** If the coin lands Tails, Beauty is awakened on Monday morning. She is placed in the same room. The display reads "Monday." This evidence is veridical. She is interviewed, then put back to sleep with amnesia-inducing agents.
  4.  **The Deception:** On Tuesday morning (Tails branch only), Beauty is awakened again. She is placed in the same room. However, the digital display is manipulated by the experimenters to read "Monday." Furthermore, her internal sense of temporal duration is chemically suppressed to match her Monday state. All phenomenological evidence available to her indicates it is Monday. This evidence is false. She is interviewed, then the experiment ends.
  5.  **The Interview:** Upon every awakening, Beauty is asked: "What is your credence that the coin landed Heads?"
  6.  **Information State:** Upon awakening, Beauty knows the protocol. She sees the display reading "Monday" (or has the equivalent seeming). She does not know the day of the week. She does not know if the display is truthful. She knows that if it is Tuesday, the display is lying.

  **The Epistemic State**
  Beauty's total evidence ($E$) upon awakening can be summarized as: "I am awake, and my available evidence indicates it is Monday." Let us denote the proposition "My evidence indicates Monday" as $I_{Mon}$.
  In the standard Sleeping Beauty problem, $I_{Mon}$ is perfectly correlated with "It is Monday" ($Mon$) in the Heads branch, and in the Tails branch, there is a $Mon$ awakening where $I_{Mon}$ is true, and a $Tue$ awakening where $I_{Mon}$ is false (or at least distinct).
  In the Deceptive Tuesday Variant, the correlation is broken.
  *   $H \rightarrow Mon \rightarrow I_{Mon}$ (True)
  *   $T \rightarrow Mon \rightarrow I_{Mon}$ (True)
  *   $T \rightarrow Tue \rightarrow I_{Mon}$ (False indication, but phenomenologically identical)

  Crucially, from Beauty's perspective, the phenomenological state is identical in all three awakenings. She cannot distinguish the deceptive Tuesday from the veridical Monday. This creates a scenario where the evidence $I_{Mon}$ is present in all three centered worlds, but its truth value varies.

  **Why Standard Positions Do Not Settle This Case**
  The standard Halfer and Thirder positions are ill-equipped to handle this variant without significant modification, primarily because both rely on assumptions about the veridicality or discriminability of temporal stages.

  *The Halfer Position:* Standard Halfers argue that Beauty receives no new relevant evidence upon awakening. She knew she would be awakened at least once. Therefore, her credence in Heads should remain at the prior of 1/2. In the Deceptive Tuesday Variant, a Halfer might argue that since the deception does not change the objective chance of the coin, the credence should remain 1/2. However, this ignores the evidential weight of the deception. If Beauty knows she is likely to be misled on Tuesday, does that affect her confidence in her current state? If she treats her evidence as unreliable, does she discount the awakening? The standard Halfer argument assumes that the lack of *discriminating* evidence implies no update. But here, the evidence is *misleading*. A strict Halfer view might struggle to explain why the presence of a deceptive branch shouldn't lower the credence in Heads, given that Heads is compatible only with veridical evidence, while Tails is compatible with both veridical and deceptive evidence. If the evidence is "It seems Monday," and that seeming is more likely under Tails (2 awakenings vs 1), the Halfer intuition is pressured.

  *The Thirder Position:* Standard Thirders argue that Beauty should reason as if she is a random sample from the set of possible awakenings. There are three awakenings ($H$-Mon, $T$-Mon, $T$-Tue). In one, the coin is Heads. Thus, credence is 1/3. In the Deceptive Tuesday Variant, the Thirder count remains three awakenings. However, the Thirder position typically assumes that each awakening provides an equal weight of evidence. In this variant, the Tuesday awakening is epistemically corrupted. Does a deceptive awakening count as a full "center" for the purpose of counting? If the evidence on Tuesday is a lie, does it support the hypothesis "It is Monday" falsely, and if so, how does that propagate to the coin hypothesis? The standard Thirder calculation ($1/3$) assumes that the indexical evidence "I am awake now" is sufficient to distribute probability mass equally across centers. But if one center is generated via deception, the symmetry of the evidence is compromised. The Thirder view assumes that the *existence* of the awakening is the evidence. But Beauty's evidence is more specific: "It seems Monday." On Tuesday, this evidence is false. Standard Thirders do not typically model the truth-value of the indexical evidence, only its occurrence.

  Both positions assume that Beauty correctly identifies her temporal stage or that the evidence she receives is at least truthful regarding the stage, even if she is uncertain which stage it is. The Deceptive Tuesday Variant introduces a layer of *epistemic luck*. Beauty is lucky if she is on Monday (evidence is true) and unlucky if she is on Tuesday (evidence is false). Standard Bayesian updates handle lucky/unlucky evidence by adjusting likelihoods. However, self-locating updates often treat the "I am here" component as foundational. If the "I am here" component is linked to false evidence, the foundation shakes.

  Therefore, the Deceptive Tuesday Variant is not merely a new puzzle to be solved by existing camps; it is a meta-problem that tests the machinery the camps use. It forces a choice: do we model the deception as a shift in the probability of the evidence (Jeffrey style) or as a branching of the hypothesis space (Centered World style)? The standard positions do not specify this distinction clearly enough to yield an immediate, uncontested answer. This ambiguity is the research gap this project intends to fill.

  ## 3. Theoretical Framework: Jeffrey Conditionalization vs. Centered Worlds

  To analyze the Deceptive Tuesday Variant, the project will utilize two competing theoretical frameworks. The research will not merely apply these frameworks but will test their limits against the specific constraints of the variant.

  **Jeffrey Conditionalization (JC)**
  Jeffrey conditionalization is a rule for updating beliefs when the evidence does not make any proposition certain. Instead of conditioning on $E$ where $P_{new}(E)=1$, the agent updates on a partition $\{E_1, E_2, ...\}$ where the new probabilities $P_{new}(E_i)$ are set by experience, but are not necessarily 1 or 0. The formula is:
  $$P_{new}(H) = \sum_i P_{old}(H | E_i) P_{new}(E_i)$$
  In the context of Sleeping Beauty, the "evidence" is typically the subjective experience of awakening.
  *   *Application to Variant:* The partition would be based on the phenomenological state. Let $S_{Mon}$ be the state "It seems Monday." Let $S_{Other}$ be any other state. Upon awakening, Beauty sets $P_{new}(S_{Mon}) = 1$ (since it undeniably seems Monday to her).
  *   *The Challenge:* The standard JC formulation assumes the partition $\{E_i\}$ is a set of propositions about the world. But "It seems Monday" is a proposition about the agent's mind. To use JC, we must link mental states to world states via likelihoods $P_{old}(S_{Mon} | World)$.
  *   *Reliability Parameter:* In the Deceptive Tuesday Variant, the likelihood $P_{old}(S_{Mon} | T, Tue)$ is 1 (the deception is perfect). In standard SB, this likelihood is usually 0 (one can tell Tuesday from Monday). This change in likelihood is the crux of the test. If JC is sufficient, plugging these likelihoods into the formula should yield the rational credence without needing to invoke "self-locating" rules.
  *   *Hypothesis:* If JC works, the update should treat "It seems Monday" as the evidential parameter. The reliability of the evidence is handled by the likelihood term $P(E | H)$. The temporal location is part of the hypothesis $H$ (e.g., $H$ includes "It is Monday").

  **Centered World Semantics (CWS)**
  Centered World Semantics treats self-locating beliefs as beliefs about which "centered world" the agent occupies. A centered world is a pair $(w, c)$, where $w$ is a possible world and $c$ is a center (a time and individual within that world).
  *   *Application to Variant:* The hypothesis space is not just $\{H, T\}$, but a set of centered worlds: $\{(H, Mon), (T, Mon), (T, Tue)\}$.
  *   *The Challenge:* CWS typically assigns priors to centered worlds based on principles like the "Self-Sampling Assumption" or "Indifference." In the Deceptive Tuesday Variant, the center $(T, Tue)$ is associated with false evidence.
  *   *Evidential Status:* In standard CWS, evidence is usually treated as a filter: eliminate centers incompatible with evidence. Here, no center is incompatible, because the evidence is misleading in $(T, Tue)$. The evidence "It is Monday" is false in $(T, Tue)$, but the *experience* is compatible.
  *   *Hypothesis:* CWS might require a separate rule for handling misleading indexical evidence. It might treat the "deceptive" center as having a different weight than a "veridical" center. If CWS requires a new rule to handle the deception, while JC handles it via standard likelihoods, this suggests JC is more parsimonious. If CWS handles it naturally while JC requires ad hoc partitioning, CWS is favored.

  **The Friction Point**
  The core friction lies in how "reliability" is categorized.
  1.  **JC Framing:** Reliability is part of the likelihood function $P(E | Hypothesis)$. The hypothesis space remains standard world-states (plus time). The update is on the experience $E$.
  2.  **CWS Framing:** Reliability is part of the center definition. The hypothesis space includes the reliability status (e.g., "I am in a deceived center"). The update is on the set of compatible centers.

  The research will investigate whether these two framings are mathematically isomorphic in this variant. If they are, the dispute is merely terminological. If they yield different credences, one framework is normatively superior (likely determined by Dutch Book vulnerability).

  ## 4. Methodology: The Parameterized Model

  The core of the research will be the construction of a parameterized probability model. This model must be granular enough to distinguish between the world-branch, the temporal stage, and the evidential status. This section specifies the exact variables and relationships that will be formalized.

  **Defining the Probability Space**
  The sample space $\Omega$ will be constructed as the Cartesian product of three variables:
  1.  **Coin ($C$):** $\{H, T\}$
  2.  **Day ($D$):** $\{Mon, Tue\}$
  3.  **Reliability ($R$):** $\{Veridical, Misled\}$

  However, not all combinations are possible. The protocol constrains the space to three valid atomic outcomes (centered worlds):
  *   $\omega_1: (H, Mon, Veridical)$
  *   $\omega_2: (T, Mon, Veridical)$
  *   $\omega_3: (T, Tue, Misled)$

  **Priors**
  The prior probability distribution $P_{old}$ over these outcomes must reflect the experimental protocol and Beauty's knowledge on Sunday.
  *   $P(C=H) = 0.5$. Given $H$, only $\omega_1$ occurs. So $P_{old}(\omega_1) = 0.5$.
  *   $P(C=T) = 0.5$. Given $T$, $\omega_2$ and $\omega_3$ occur.
  *   *The Weighting Problem:* How is the 0.5 probability of Tails distributed between $\omega_2$ and $\omega_3$?
      *   *Option A (Branch Weighting):* The probability is split by world-branch. $P(\omega_2) = 0.25, P(\omega_3) = 0.25$. This aligns with the Halfer intuition that the Tails world is one world.
      *   *Option B (Awakening Weighting):* The probability is split by awakening count. $P(\omega_2) = 0.25, P(\omega_3) = 0.25$ is still standard, but the *update* treats them as distinct samples.
      *   *Option C (Deception Weighting):* Does the deceptive nature of $\omega_3$ lower its prior weight? Unlikely, as the deception is part of the protocol known on Sunday.
      *   *Decision for Model:* The project will initially assign priors based on the objective chance of the coin and the deterministic protocol. $P_{old}(\omega_1) = 1/2$. $P_{old}(\omega_2) = 1/4$. $P_{old}(\omega_3) = 1/4$. This reflects the fact that in a long run of experiments, 50% are H-Mon, 25% are T-Mon, 25% are T-Tue. This is the "Long Run Frequency" prior, which is neutral ground.

  **The Evidential Parameter**
  The evidence $E$ is defined as the proposition: "My current experience is indistinguishable from a Monday awakening."
  Let $Exp$ be the random variable for Experience.
  *   $P(Exp = MonLike | \omega_1) = 1$
  *   $P(Exp = MonLike | \omega_2) = 1$
  *   $P(Exp = MonLike | \omega_3) = 1$ (Due to perfect deception)

  Upon awakening, Beauty observes $Exp = MonLike$.
  In a standard Bayesian update, if $P(E | \omega_i) = 1$ for all $i$, the likelihood ratio is 1:1:1. The posterior would equal the prior.
  $P_{new}(H) = P_{old}(H | Exp) = \frac{P(Exp | H)P(H)}{P(Exp)}$.
  Since $P(Exp | H) = 1$ and $P(Exp | T) = 1$, the posterior is 0.5.
  *Wait.* This suggests the Halfer result is the natural outcome of standard conditionalization if the deception is perfect.
  *However*, this ignores the *self-locating* aspect. The evidence is not just "An experience occurred." It is "*I* am having this experience *now*."
  The model must incorporate the "Selection Effect." Beauty is not sampling a world; she is sampling an awakening.
  To model this within JC, we must treat the "Awakening" as the evidential parameter.
  Let $A$ be the proposition "I am awake."
  $P(A | \omega_1) = 1$ (1 awakening).
  $P(A | \omega_2) = 1$ (1 awakening).
  $P(A | \omega_3) = 1$ (1 awakening).
  This doesn't help distinguish.

  *Refined Methodology:* The project will use **Jeffrey Conditionalization on the Temporal Partition**.
  Instead of conditioning on "I am awake," Beauty conditions on the probability distribution over the days.
  Let the partition be $\{D_{Mon}, D_{Tue}\}$.
  Upon awakening, Beauty is not certain it is Monday. She assigns a new probability to "It is Monday" based on her experience.
  Let $P_{new}(D_{Mon}) = x$.
  Then $P_{new}(H) = P_{old}(H | D_{Mon}) \cdot x + P_{old}(H | D_{Tue}) \cdot (1-x)$.
  We know $P_{old}(H | D_{Tue}) = 0$ (Heads never happens on Tuesday).
  So $P_{new}(H) = P_{old}(H | D_{Mon}) \cdot x$.
  The problem reduces to determining $x$ (the credence it is Monday) and $P_{old}(H | D_{Mon})$.
  $P_{old}(H | D_{Mon}) = \frac{P(D_{Mon} | H)P(H)}{P(D_{Mon})}$.
  $P(D_{Mon} | H) = 1$. $P(H) = 0.5$.
  $P(D_{Mon}) = P(D_{Mon} | H)P(H) + P(D_{Mon} | T)P(T)$.
  In the Deceptive Variant, $P(D_{Mon} | T)$ is the probability of being in a Monday state given Tails.
  There are two Tails awakenings: one Mon, one Tue.
  If we count awakenings, $P(D_{Mon} | T) = 1/2$.
  Then $P(D_{Mon}) = 1 \cdot 0.5 + 0.5 \cdot 0.5 = 0.75$.
  Then $P_{old}(H | D_{Mon}) = 0.5 / 0.75 = 2/3$.
  So $P_{new}(H) = (2/3) \cdot x$.
  If Beauty's experience makes her certain it is Monday ($x=1$), she becomes a 2/3 Halfer? No, 2/3 credence in Heads.
  If she accounts for deception, $x < 1$.
  If the deception is perfect, she cannot distinguish. Should $x$ reflect the frequency of Monday-seemings?
  There are 3 Monday-seemings (H-Mon, T-Mon, T-Tue). 2 are Tails. 1 is Heads.
  If she treats her experience as a random sample from seemings, $x$ (Credence it is *actually* Monday) = 2/3.
  Then $P_{new}(H) = (2/3) \cdot (2/3) = 4/9$?
  This calculation demonstrates the complexity. The project will formalize this derivation to check for consistency.

  **Modeling the Reliability Hypothesis**
  Alternatively, the model will treat Reliability ($R$) as a hypothesis.
  Hypotheses:
  1.  $H_1$: Heads, Monday, Reliable.
  2.  $H_2$: Tails, Monday, Reliable.
  3.  $H_3$: Tails, Tuesday, Misled.
  Evidence $E$: "Seems Monday."
  Likelihoods: $P(E | H_1) = 1, P(E | H_2) = 1, P(E | H_3) = 1$.
  This leads to the Posterior = Prior problem again.
  To break this, the model must incorporate the *probability of being in the situation to receive the evidence*.
  This is the "Self-Indication Assumption" vs "Self-Sampling Assumption" debate.
  The project will explicitly model the "Awakening Probability" as a parameter $\alpha$.
  $P(E | H_i) = \alpha_i$.
  $\alpha_1 = 1$ (1 awakening).
  $\alpha_2 = 1$ (1 awakening).
  $\alpha_3 = 1$ (1 awakening).
  This implies no update.
  To get an update, we must treat the "Center" as the random variable.
  The project will construct the model to allow switching between "World-Centric" priors (Halfer) and "Center-Centric" priors (Thirder) to see how the deception affects the convergence.

  ## 5. Analysis of Rational Credence

  The analytical phase of the project will involve deriving the rational credence for Heads ($P(H)$) under the two framings identified in the theoretical framework. The goal is to see if the "Deceptive" element forces a divergence.

  **Derivation 1: The Jeffrey Framing (Evidential Parameter)**
  In this framing, the update is driven by the shift in probability over the partition of days $\{Mon, Tue\}$.
  Beauty's evidence $E$ is "It seems Monday."
  She must determine $P_{new}(Mon)$, her credence that it is actually Monday.
  Rationality requires that $P_{new}(Mon)$ reflects the likelihood of having this evidence in each state.
  Total "Seemings": 3 (H-Mon, T-Mon, T-Tue).
  True Mondays: 2 (H-Mon, T-Mon).
  False Mondays: 1 (T-Tue).
  If Beauty treats her current seeming as a random draw from the set of all possible seemings (Principle of Indifference over Experiences):
  $P_{new}(Mon) = 2/3$.
  $P_{new}(Tue) = 1/3$.
  Now apply Jeffrey's Rule:
  $P_{new}(H) = P_{old}(H | Mon)P_{new}(Mon) + P_{old}(H | Tue)P_{new}(Tue)$.
  We need $P_{old}(H | Mon)$. This is the prior probability of Heads given it is Monday.
  In the prior space (Sunday):
  $P(H \cap Mon) = 0.5$.
  $P(T \cap Mon) = 0.25$ (Since Tails has 2 days, but we are conditioning on the event "It is Monday" in the world structure).
  Wait, on Sunday, "It is Monday" is a future event.
  Better to use the centered prior.
  $P(H, Mon) = 1/2$.
  $P(T, Mon) = 1/4$.
  $P(T, Tue) = 1/4$.
  $P(Mon) = 3/4$.
  $P(H | Mon) = (1/2) / (3/4) = 2/3$.
  $P(H | Tue) = 0$.
  Substitute into Jeffrey's Rule:
  $P_{new}(H) = (2/3) \cdot (2/3) + 0 \cdot (1/3) = 4/9$.
  Result: **4/9**.
  This is a distinct value. It is neither 1/2 (Halfer) nor 1/3 (Thirder). It suggests that the deception lowers the credence in Heads below the Halfer mark, because the "Monday" evidence is tainted by the Tuesday deception, but not enough to reach the Thirder mark because the Tuesday awakening is not a "true" Monday.

  **Derivation 2: The Centered World Framing (Hypothesis Space)**
  In this framing, the hypotheses are the centered worlds $\omega_1, \omega_2, \omega_3$.
  Evidence $E$: "I am in a center where it seems Monday."
  All three centers satisfy $E$.
  If we apply the Self-Sampling Assumption (SSA): We reason as if we are randomly selected from the set of observers in the reference class.
  Reference Class: All awakenings in the experiment.
  Count: 3.
  Heads Centers: 1 ($\omega_1$).
  Credence: **1/3**.
  Does the deception change this?
  If the deception makes $\omega_3$ "less real" or "epistemically discounted," the count might change.
  But standard SSA counts centers based on existence, not veridicality.
  However, a refined CWS might argue that because $\omega_3$ involves false evidence, it should not support the hypothesis "It is Monday."
  But the question is "Credence in Heads."
  If we stick to strict SSA, the answer remains 1/3.
  If we incorporate the reliability into the center weight (e.g., Misled centers count for 0), then $\omega_3$ is discarded.
  Remaining centers: $\omega_1, \omega_2$.
  Heads: 1. Total: 2.
  Credence: **1/2**.
  This framing allows for a range of answers depending on how "deceptive centers" are weighted.

  **Comparison**
  The Jeffrey Framing yielded 4/9.
  The Centered Framing yields 1/3 (standard) or 1/2 (discounted).
  The divergence between 4/9 and 1/3/1/2 is significant. It suggests that treating reliability as an evidential parameter (JC) produces a different normative result than treating it as a property of the hypothesis space (CWS).
  The project will analyze which result is pragmatically stable.
  Why 4/9? It accounts for the fact that "Seeming Monday" is more common in Tails (2/3 of seemings) but also accounts for the fact that given it *is* Monday, Heads is more likely (2/3 of Mondays are Heads... wait. H-Mon is 1, T-Mon is 1. So 1/2 of *true* Mondays are Heads).
  Let's re-calculate $P(H | Mon)$ in the prior.
  $P(H, Mon) = 0.5$.
  $P(T, Mon) = 0.25$ (If we weight by world branch).
  If we weight by awakening count in the prior:
  $P(H, Mon) = 1/3$.
  $P(T, Mon) = 1/3$.
  $P(T, Tue) = 1/3$.
  Then $P(Mon) = 2/3$.
  $P(H | Mon) = (1/3) / (2/3) = 1/2$.
  Then Jeffrey Update: $P_{new}(H) = (1/2) \cdot P_{new}(Mon)$.
  If $P_{new}(Mon) = 2/3$ (based on seemings), then $P_{new}(H) = 1/3$.
  This converges with the Thirder view!
  So, if the Prior is Center-Centric (Thirder Prior), JC yields Thirder Result.
  If the Prior is World-Centric (Halfer Prior), JC yields 4/9.
  The research question sharpens: **Which Prior is rational in the presence of deception?**
  Does the deception force us to abandon the World-Centric prior?
  If the deception makes the "World" less accessible than the "Experience," perhaps the Experience-Centric prior is mandated.
  This analysis will form the bulk of the semester's work: determining whether the deceptive nature of the Tuesday branch normatively compels a shift from World-Centric to Center-Centric priors before the update even begins.

  ## 6. Dutch Book and Pragmatic Consistency

  To determine which credence is rational, the project will employ Dutch Book arguments. A Dutch Book is a set of bets that guarantees a loss for the agent, indicating incoherent credences.

  **The Betting Scenario**
  Beauty is offered a bet upon every awakening.
  Bet: Pay \$X to receive \$1 if Heads.
  If she is Dutch-Bookable, her credence $P(H)$ is irrational.

  **Testing the 4/9 Credence (Halfer Prior + JC)**
  Suppose Beauty adopts $P(H) = 4/9$. She accepts bets at odds better than 4:5.
  Let's say she bets \$4 to win \$5 if Heads (Fair bet at 4/9).
  *   Case H (Mon): She wakes once. Pays \$4. Wins \$5. Net: +\$1.
  *   Case T (Mon): She wakes once. Pays \$4. Wins \$0. Net: -\$4.
  *   Case T (Tue): She wakes once. Pays \$4. Wins \$0. Net: -\$4.
  Expected Value (from Sunday perspective):
  $0.5 \cdot (+1) + 0.25 \cdot (-4) + 0.25 \cdot (-4) = 0.5 - 1 - 1 = -1.5$.
  This is a losing strategy.
  Wait, the bet is offered *per awakening*.
  In Tails, she bets twice.
  *   Case H: 1 bet. Net +1.
  *   Case T: 2 bets. Net -8 (2 * -4).
  Expected Value: $0.5(1) + 0.5(-8) = -3.5$.
  Clearly irrational.
  To avoid a Dutch Book in a Sleeping Beauty scenario where bets are per-awakening, the credence must align with the betting odds.
  If bets are per-awakening, the Thirder credence (1/3) is usually required to break even.
  Let's check 1/3. Bet \$1 to win \$2 (Odds 1:2, Prob 1/3).
  *   Case H: 1 bet. Cost 1, Win 2. Net +1.
  *   Case T: 2 bets. Cost 2, Win 0. Net -2.
  Expected Value: $0.5(1) + 0.5(-2) = -0.5$. Still losing?
  Ah, fair odds for 1/3 are 1:2 (Pay 1, Win 3 total? No. Pay 1, Win 2 profit + 1 stake = 3).
  Let's use standard expected value. $P(H) = 1/3$. Fair price for \$1 payoff is \$0.33.
  *   Case H: Pay 0.33. Win 1. Net +0.67.
  *   Case T: Pay 0.33 twice = 0.66. Win 0. Net -0.66.
  Expected Value: $0.5(0.67) + 0.5(-0.66) \approx 0$.
  So 1/3 is pragmatically consistent for per-awakening bets.

  **Does Deception Change the Betting Scenario?**
  In the Deceptive Tuesday Variant, does Beauty know she is betting? Yes.
  Does the deception affect the payoff? No.
  Therefore, pragmatic consistency still demands a credence that aligns with the frequency of bets.
  Since there are 3 bets in the long run (1 H, 2 T), and only 1 wins, the credence must be 1/3 to avoid sure loss in a repeated experiment context.
  *However*, this assumes Beauty cares about the total money across the experiment. If she cares about the money *per awakening* (decision theoretic utility), the calculation changes.
  The project will analyze whether the deception introduces a "utility discount." If Beauty knows the Tuesday evidence is false, does she value the Tuesday bet differently?
  If she knows she is misled on Tuesday, she might realize her decision on Tuesday is epistemically compromised.
  But she doesn't know *if* she is misled.
  The Dutch Book analysis will test if the 4/9 result (from the Halfer-JC model) leaves her vulnerable. As shown above, 4/9 leads to significant losses in the per-awakening betting scenario.
  This suggests that **Jeffrey Conditionalization with a Halfer Prior is pragmatically inconsistent** in this variant.
  Does JC with a Thirder Prior work? Yes, it yields 1/3, which is consistent.
  Does CWS work? If it yields 1/3, it is consistent.
  **Conclusion of Analysis Plan:** The Dutch Book test will likely eliminate the Halfer-JC hybrid. The remaining contest is between Thirder-JC and Thirder-CWS. If they converge, the framework choice is indifferent. If they diverge on *why* 1/3 is correct, the philosophical defense matters.

  ## 7. Expected Outcomes and Failure Conditions

  **Success Criteria**
  The project will be considered successful if it achieves one of the following:
  1.  **Divergence Demonstration:** A rigorous proof that Jeffrey Conditionalization and Centered World Semantics yield different credences in the Deceptive Tuesday Variant, accompanied by a Dutch Book argument showing one is vulnerable. This would establish that the choice of formal apparatus has normative consequences in deceptive self-locating contexts.
  2.  **Convergence Proof:** A demonstration that both frameworks, when correctly applied to the deceptive variant, converge on the same credence (likely 1/3), but via different justificatory paths. The success here would be a philosophical clarification of *why* they converge, showing that the deception neutralizes the Halfer intuition more effectively than standard SB.
  3.  **Framework Recommendation:** A definitive argument that one framework (likely JC) is superior because it handles the "reliability" parameter more naturally without requiring ad hoc weighting of centers.

  **Failure Conditions**
  The project will be considered to have failed if:
  1.  **Collapse:** The formalization collapses into the standard Sleeping Beauty problem without the deceptive element making a difference. For example, if the math shows that perfect deception is mathematically equivalent to veridical evidence in the model, the variant adds no value. (Unlikely, as the likelihoods change).
  2.  **Indeterminacy:** The model produces a range of rational credences (e.g., "Anywhere between 1/3 and 1/2 is permissible") without a principle to narrow it down. This would fail to test the frameworks effectively.
  3.  **Scope Creep:** The project attempts to solve the general Halfer/Thirder debate rather than focusing on the specific impact of the deceptive evidence.
  4.  **Formal Inconsistency:** The Jeffrey Conditionalization model requires assumptions that violate the axioms of probability (e.g., requiring negative probabilities to make the deception work).

  **Specific Deliverable:**
  A final paper containing the parameterized model, the derivation of the 4/9 vs 1/3 conflict (if it exists), and the Dutch Book analysis. The paper will argue that the Deceptive Tuesday Variant acts as a "filter" that eliminates the Halfer position if one accepts pragmatic consistency, thereby supporting the Thirder view *specifically through the lens of evidential reliability*.

  ## 8. Scope, Timeline, and Feasibility

  **Scope Assessment**
  Completing this research in one semester (three months) is ambitious but feasible, provided the scope remains strictly bounded.
  *   *In Scope:* Formalizing the Deceptive Tuesday Variant, deriving credences using JC and CWS, Dutch Book analysis, philosophical interpretation of the result.
  *   *Out of Scope:* General history of the Sleeping Beauty problem, comprehensive review of all Halfer/Thirder variations (e.g., Sailor's Child, Incubator), empirical testing with human subjects, extension to other paradoxes (e.g., Doomsday Argument).
  *   *Risk:* The primary risk is getting bogged down in the foundational debate of what a "centered world" is.
  *   *Mitigation:* The project will adopt a working definition of centered worlds (standard Lewisian) and stick to it. If the definition is challenged, it will be noted as a limitation, not a research pivot.

  **Timeline**
  *   **Month 1: Formalization and Modeling.**
      *   Weeks 1-2: Finalize the protocol of the Deceptive Tuesday Variant. Ensure all ambiguities are resolved.
      *   Weeks 3-4: Construct the Parameterized Model. Define the probability space, priors, and likelihood functions for both JC and CWS frameworks.
      *   *Milestone:* A complete mathematical model ready for derivation.
  *   **Month 2: Analysis and Derivation.**
      *   Weeks 5-6: Perform the credence derivations. Calculate the specific values (e.g., 4/9 vs 1/3).
      *   Weeks 7-8: Conduct the Dutch Book analysis. Construct the betting scenarios and test for vulnerability.
      *   *Milestone:* Draft results section with calculated credences and pragmatic consistency verdict.
  *   **Month 3: Synthesis and Writing.**
      *   Weeks 9-10: Philosophical interpretation. What do the results mean for the JC vs. CWS debate?
      *   Weeks 11-12: Final writing, editing, and formatting of the proposal into a research paper.
      *   *Milestone:* Final manuscript.

  **Stopping Rules**
  To ensure completion within three months, the following stopping rules will be applied:
  1.  **The "One-Page" Rule:** If the formal model cannot be summarized on one page of algebraic notation by the end of Month 1, the model is too complex and must be simplified.
  2.  **The "Convergence" Rule:** If the JC and CWS derivations converge trivially (e.g., both obviously yield 1/3 without tension) by Week 6, the project will pivot to analyzing *why* the deception failed to create tension, rather than forcing a conflict. This is still a valid result.
  3.  **The "Dutch Book" Limit:** If the Dutch Book analysis becomes intractable due to utility function complexities, the project will rely on a simplified linear utility model. Deep decision-theoretic nuances will be sacrificed for completion.

  **Feasibility Conclusion**
  The project is feasible because it leverages existing formal tools (JC, Probability Theory) and applies them to a novel constraint (Deception). It does not require inventing new mathematics, only applying existing mathematics to a new configuration. The three-month timeline is sufficient for this level of theoretical analysis, provided the researcher resists the temptation to expand the scope to the general Sleeping Beauty literature. The focus on the *reliability parameter* provides a sharp enough knife to cut through the stalemate without needing to resolve the entire war.

  ## 9. Conclusion

  The Deceptive Tuesday Variant of the Sleeping Beauty problem offers a unique opportunity to test the robustness of Bayesian epistemology in the face of indexical deception. By introducing false evidence into the self-locating framework, this project moves beyond the standard stalemate of Halfer vs. Thirder and interrogates the underlying machinery of belief update. The research will determine whether Jeffrey conditionalization is sufficient to handle the decoupling of evidence and truth in self-locating contexts, or whether a separate logic of centered worlds is required.

  The expected outcome is a clearer understanding of how evidential reliability interacts with temporal location. If Jeffrey conditionalization proves sufficient, it demystifies self-locating belief, reducing it to a special case of uncertain evidence. If it fails, it highlights a fundamental limitation in standard Bayesianism when applied to the self. Either result advances the field. The project is scoped to be completed within one semester, with clear milestones and stopping rules to ensure delivery. By focusing on the precise mechanics of the deceptive evidence, this research aims to provide a decisive contribution to the formal epistemology of self-location.
