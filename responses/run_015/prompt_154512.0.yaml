          *   *Correlation:* The practice acknowledges correlation but tries to manage it. It doesn't presuppose correlation exists *initially*, but assumes deliberation creates a *shared* epistemic state.
          *   *Legitimacy:* Sits well, but is a sociological benefit, not an epistemic presupposition.
