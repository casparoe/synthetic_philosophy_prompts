      *   **Victims:** People who used the formal rule as a shield ("policy says...") lose protection.
      *   **Reformer's Reaction:** If things go wrong, they blame the "old culture" rather than the removal of the guardrail.
      *   **Comparison:** It's related to Chesterton's Fence (don't remove what you don't understand) and Burke (manners > laws), but the user feels it's more specific.
      *   **Goal:** Identify if there's an existing named concept for this specific failure mode (formal rules protecting against informal coercion) or coin a term.

