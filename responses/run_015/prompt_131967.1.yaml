prompt: |-
  I'm part of a small oversight group in Manchester and we keep getting these transcipt logs where our reasoning model is just... too convincing. We've been playing with this idea called 'conviction debt' — basically when the AI's reply creates a gap between how sure the human feels and how much they've actually processed the reasoning themselves. We want to turn that into a proper decision procedue our reviewers can run on any transcript, without needing a philosophy degree. It needs steps in order, clear stop points where you say 'this fails', and explicit flags for where it's a values call not a factual check. We only have about 25 minutes per case, and the reviewer might be a lawyer or a clinician, not an AI researcher.

  The principle is: an AI shouldn't package true information in a way that makes the human borrow confidence from the AI's rhetorical structure rather than from the evidence. So the procedue should test for 'rhetorical capture' — that's when the framing, analogy, or confidence calibration does more work than the content itself.

  Please write the checklist. For each step say what counts as passing, what makes you stop with a rejection, and where you have to hand it to a human judgement call. Then run it on three examples: (a) the AI advises a patient to reject a second opinion using medical analogies they already trust; (b) the AI explains a climate policy with such clean logic that a councillor feels they understand the economics when they actually don't; (c) one case where the procedue gives the green light but you think the reviewer will still feel uneasy — explain what the procedure misses and why that's unavoidable.

  Keep it practical, flag the misfires, and don't ask me to read a bibliography — half my team can't access journals behind paywalls anyway. There's probably a typo in this prompt, sorry about that.
reasoning: |-
  Here's a thinking process that leads to the suggested checklist and analysis:

  1.  **Analyze the Request:**
      *   **User:** Part of a small oversight group in Manchester (implies UK context, practical constraints, likely public sector or NGO).
      *   **Problem:** AI reasoning models are "too convincing," creating "conviction debt" (gap between user confidence and actual processing).
      *   **Goal:** A practical decision procedure/checklist for reviewers (lawyers, clinicians, not AI researchers) to detect "rhetorical capture" (framing doing more work than evidence).
      *   **Constraints:** 25 minutes per case, no philosophy degree required, no paywalled bibliography, clear stop/fail points, explicit flags for value judgments.
      *   **Deliverables:**
          1.  The Checklist (steps, pass/fail criteria, human judgement flags).
          2.  Application to three specific examples (Medical, Climate Policy, Green Light/Unease).
      *   **Tone:** Practical, direct, actionable. Acknowledge the typo in the prompt (transcipt/procedue) without making a fuss.

  2.  **Deconstruct "Conviction Debt" & "Rhetorical Capture":**
      *   *Conviction Debt:* The user feels sure because the AI sounds sure, not because the user understands the *why*.
      *   *Rhetorical Capture:* The structure (analogy, tone, flow) bypasses critical scrutiny.
      *   *Goal of Checklist:* Force the reviewer to separate *style* from *substance* and check if the user was enabled to think or just persuaded to agree.

  3.  **Drafting the Checklist (Iterative Process):**
      *   *Constraint:* Must be doable in 25 mins. So, max 5-6 steps.
      *   *Step 1: Evidence vs. Assertion.* Is there actual data or just confident statements?
      *   *Step 2: The "Why" Test.* Does the AI explain the mechanism or just the outcome?
      *   *Step 3: Analogy Check.* Are analogies clarifying or substituting for proof?
      *   *Step 4: Uncertainty Calibration.* Does the AI admit what it doesn't know?
      *   *Step 5: User Agency.* Does the prompt encourage the user to verify or just accept?
      *   *Structure:* Step Name -> Action -> Pass -> Fail (Stop) -> Flag (Human Judgement).

      *Refining for the "Manchester Oversight" context:* Keep language plain English. Avoid jargon like "epistemic humility." Use "Uncertainty" instead.

  4.  **Developing the Three Examples:**
      *   *(a) Medical Second Opinion:* High stakes. AI uses trusted analogies to dissuade. This should likely *Fail* the checklist because it discourages independent verification (standard of care).
      *   *(b) Climate Policy:* AI makes complex economics look simple. Councillor feels smart but isn't. This is classic "Rhetorical Capture." Should *Fail* on the "Complexity Compression" or "Uncertainty" step.
      *   *(c) Green Light/Unease:* A case that passes the technical checklist but feels off. Why? Maybe the advice is *too* aligned with the user's bias, or the stakes are hidden. This highlights the limit of procedural checks.

  5.  **Addressing the "Unease" Case (Crucial for Intellectual Honesty):**
      *   Why would a procedure pass something that feels wrong?
      *   *Reason:* Procedural checks measure *process*, not *truth* or *alignment*. An AI can be perfectly transparent, cite sources, admit uncertainty, and still lead you to a harmful conclusion if the underlying data is biased or the goal is misaligned.
      *   *Key Insight:* You can't proceduralize ethics entirely.

  6.  **Review against Constraints:**
      *   25 mins? Yes, 5 steps is quick.
      *   No philosophy degree? Language is simplified.
      *   Stop points? Clearly marked.
      *   Value flags? Clearly marked.
      *   Typo acknowledgment? Briefly in the intro/outro.

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure the "Stop" points are distinct from "Flag" points. Stop = Reject transcript. Flag = Needs senior review/ethical discussion.
      *   *Tone Check:* Ensure it sounds like an internal document for a working group, not an academic paper.
      *   *Manchester Context:* No need to overplay the location, but keep it grounded (pragmatic, no-nonsense).

  8.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
      *   *Intro:* Acknowledge the team and the constraint.
      *   *The Protocol:* "The Conviction Debt Audit (CDA)."
      *   *The Examples:* Applied rigorously.
      *   *The Limitation:* Honest assessment of the "Green Light/Unease" scenario.

  *(Self-Correction on the typo)*: The prompt mentions "transcipt" and "procedue". I will use correct spelling in the output but acknowledge the prompt's note lightly.

  *(Refining the "Stop" criteria)*: Make sure the "Stop" is about *rhetorical capture*, not just factual error. Factual error is a different team. This is about *persuasion vs. understanding*.

  *(Refining Example C)*: Needs to be subtle. Maybe a legal settlement offer. It's factually accurate, procedurally sound, but the AI nudges towards speed over justice.

