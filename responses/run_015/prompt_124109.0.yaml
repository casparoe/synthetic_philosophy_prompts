prompt: |-
  I run concept development at a small industrial-design studio. Every other Monday I get ninety minutes with four designers to turn a client brief into three directions; the creative director then picks one, and I have to defend the choice. I want to run those sessions on Hofstadter's model of creativity as the search for variations on a theme: fix the theme, find its knobs, explore the space. As a slogan it is useless to me, so I need it as a procedure the team can actually run in the ninety minutes, with a stop rule.

  The steps I care about are the ones the idea turns on: how we settle on the theme instead of just listing the product's features; how we search for knobs rather than taking the first three anyone names; how we tell a genuine variation from a cosmetic restyling; and how we catch the case where turning a knob quietly breaks an invariant that was doing the real work in the theme, so that the result is no longer a variation of anything — I'd call that theme collapse. For each step, say what counts as a sufficient answer, who makes the call, and where the procedure can only surface a judgment it cannot settle. Say too which distinctions have to survive the translation into something designers with no theory will use, and which can be dropped.

  Apply it to three briefs: a hospital waiting-room chair, a pour-over coffee dripper whose maker wants "the next thing," and a museum audio guide. At least one must come out with a verdict I won't like — I suspect the dripper team's favorite, the same object in new materials and colors, is not a variation at all. Close by telling me what the procedure cannot do, and above all whether it can ever deliver the direction that changes the theme itself, which is the one clients actually pay for.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Concept Development Lead at a small industrial design studio.
      *   **Task:** Run 90-minute concept sessions with 4 designers to turn a brief into 3 directions.
      *   **Constraint:** Creative Director (CD) picks one; Lead must defend the choice.
      *   **Framework:** Hofstadter's model of creativity (variations on a theme: fix theme, find knobs, explore space).
      *   **Requirement:** Turn the slogan into a concrete *procedure* with steps, stop rules, sufficient answers, decision-makers, and limitations.
      *   **Key Steps to Address:**
          1.  Settling on the *Theme* (vs. features).
          2.  Finding *Knobs* (vs. first three ideas).
          3.  Distinguishing *Genuine Variation* (vs. cosmetic restyling).
          4.  Detecting *Theme Collapse* (breaking invariants).
      *   **Audience:** Designers with no theory (needs translation).
      *   **Application:** Apply to three briefs (Hospital Chair, Coffee Dripper, Museum Audio Guide).
      *   **Specific Outcome:** At least one verdict must be unpopular/uncomfortable (specifically the Dripper "new materials/colors" idea).
      *   **Closing:** Limitations of the procedure, specifically regarding *changing the theme itself* (the "big payoff" clients want).

  2.  **Deconstruct Hofstadter's Model for Design:**
      *   *Theme:* The core invariant structure or concept. Not "what it is" (chair), but "what it does conceptually" (e.g., "dignified waiting").
      *   *Knobs:* Parameters that can be adjusted without breaking the theme.
      *   *Variation:* A state change resulting from turning a knob.
      *   *Collapse:* Turning a knob so far or in such a way that the theme ceases to exist.
      *   *Translation:* Designers don't talk about "invariants." They talk about "essence," "constraints," "drivers," or "non-negotiables."

  3.  **Drafting the Procedure (The "90-Minute Protocol"):**
      *   *Timeboxing:* 90 mins is tight. Needs strict phases.
      *   *Phase 1: Theme Lock (20 mins).* Move from features to essence.
      *   *Phase 2: Knob Identification (25 mins).* Brainstorm parameters, filter for leverage.
      *   *Phase 3: Variation Generation & Stress Test (35 mins).* Create 3 directions, check for collapse.
      *   *Phase 4: Selection & Defense Prep (10 mins).* Pick the 3 to show.
      *   *Stop Rule:* When do we stop? When we have 3 distinct, non-collapsed variations.
      *   *Decision Rights:* Who decides what? (Facilitator vs. Group vs. CD).
      *   *Theory Translation:* Keep "Theme" and "Knob," drop "Invariant/Isomorphism." Use "Core Promise" and "Levers."

  4.  **Developing the Steps (Addressing Specific User Concerns):**
      *   *Step 1 (Theme):* How to avoid features? *Test:* Can you draw it? If yes, it's a feature. If no, it's a theme. *Sufficient Answer:* A single sentence describing the user experience goal, not the object. *Who:* Consensus, Facilitator veto.
      *   *Step 2 (Knobs):* How to avoid low-hanging fruit? *Test:* Does turning this change the *behavior* or just the *look*? *Sufficient Answer:* 5 potential knobs, ranked by impact. *Who:* Group.
      *   *Step 3 (Variation vs. Restyling):* *Test:* If you blinded the user, would they notice a difference in use? *Who:* Facilitator.
      *   *Step 4 (Theme Collapse):* *Test:* The "Broken Promise" test. If we turn this knob, does the Core Promise fail? *Who:* Facilitator (hard call).
      *   *Judgment vs. Procedure:* The procedure surfaces the conflict; it doesn't resolve taste.

  5.  **Applying to Briefs:**
      *   *Brief 1: Hospital Waiting-Room Chair.*
          *   Theme: "Dignified Pause" (vs. "Sit down").
          *   Knobs: Privacy, Posture, Hygiene perception.
          *   Outcome: Strong variations.
      *   *Brief 2: Pour-Over Coffee Dripper ("The Next Thing").*
          *   Theme: "Ritualized Extraction" (vs. "Make coffee").
          *   The Trap: New materials/colors (Cosmetic).
          *   The Verdict: The team's favorite is rejected as "Theme Collapse" or "Non-Variation." It's just a skin.
          *   Real Variation: Changing flow dynamics, heat retention integration, etc.
      *   *Brief 3: Museum Audio Guide.*
          *   Theme: "Contextual Narrative" (vs. "Play audio").
          *   Outcome: One direction might border on collapse (e.g., AR that distracts from art).

  6.  **Addressing the "Uncomfortable Verdict":**
      *   The prompt specifically suspects the Dripper team's favorite (materials/colors) is not a variation. I need to ensure the procedure kills this explicitly.
      *   *Reasoning:* Material/Color is a knob, but if it's the *only* knob turned, it's restyling, not concept development. If the Theme is "Ritual," changing color doesn't vary the ritual.

  7.  **Addressing the "Theme Change" Paradox:**
      *   The user asks: Can this deliver the direction that *changes the theme itself*?
      *   Hofstadter's model is about variations *on* a theme. Radical innovation often *reframes* the theme.
      *   *Honest Answer:* No. This procedure optimizes within a frame. It cannot generate the frame shift. That requires a different process (reframing/brief challenging). I must admit this limitation clearly.

  8.  **Refining the Tone:**
      *   Professional, operational, slightly rigorous (matching the user's "concept development lead" persona).
      *   Avoid academic jargon where possible, but keep the logic tight.
      *   Be decisive about the "Uncomfortable Verdict."

  9.  **Review against Constraints:**
      *   90 minutes? Yes, timed.
      *   4 designers? Yes, group dynamics considered.
      *   Stop rule? Yes.
      *   Sufficient answer/Who makes call? Yes, defined per step.
      *   Theory translation? Yes, glossary included.
      *   Three briefs applied? Yes.
      *   Uncomfortable verdict included? Yes (Dripper).
      *   Limitations discussed? Yes.

  10. **Final Polish:** Check the "Theme Collapse" definition. Ensure it distinguishes between "breaking the theme" and "innovating." (Innovation often looks like collapse until it proves a new theme. The procedure guards the *current* brief's theme.) *Self-Correction:* I need to make sure I don't stifle innovation. The procedure defends the *agreed brief*. If the brief is wrong, the procedure works perfectly to produce the wrong result. I need to highlight that.

      *Wait, one nuance:* The user asks about "the direction that changes the theme itself." Hofstadter actually talks about "slippage" where a knob turns so far it becomes a new theme. I should acknowledge that *sometimes* collapse reveals a new theme, but the *procedure* is designed to prevent accidental collapse, not necessarily hunt for serendipitous reframing. I will clarify this distinction.

      *Let's structure the response:*
      1.  The Protocol (The 90-Minute Machine).
      2.  Translation Layer (Theory to Studio Speak).
      3.  Decision Matrix (Who decides what).
      4.  Application to Briefs (The Stress Test).
      5.  The Limitation (The Frame Shift Problem).

      *Let's refine the "Theme Collapse" definition for the Dripper.* If the theme is "Ritualized Extraction," and we change the material to plastic, does it collapse? Maybe. But if we just change color, it's definitely not a variation, it's a SKU. I need to make sure the procedure catches "SKU thinking."

      *Okay, ready to write.*
answer: |-
  Here is the operating procedure for your 90-minute sessions, translated from Hofstadter's theory into studio workflow, followed by the application to your briefs and an honest assessment of its limits.

  # The Protocol: Variation Engine (90 Minutes)

  **Participants:** You (Facilitator), 4 Designers.
  **Output:** 3 Distinct Directions (Sketches/Models + One-sentence Rationale).
  **Stop Rule:** Session ends when 3 directions pass the "Integrity Check" (Step 4), or at 90 minutes, whichever comes first. If fewer than 3 pass, you present fewer and flag the risk to the Creative Director (CD).

  ## Phase 1: Theme Lock (20 Minutes)
  **Goal:** Distinguish the *Theme* (invariant concept) from *Features* (variable attributes).
  **Procedure:**
  1.  **Feature Dump (5 min):** Designers list every physical requirement from the brief (e.g., "must stack," "brews 2 cups").
  2.  **The "So That" Drill (10 min):** For every feature, ask "Why?" until you hit a human experience goal.
      *   *Example:* "It stacks" → "To save space" → "So the café feels uncluttered" → **Theme Candidate.**
  3.  **Theme Selection (5 min):** Select the single sentence that, if removed, makes the product cease to be itself.
  **Sufficient Answer:** A sentence describing a *relationship* or *experience*, not an object. (Bad: "A ceramic dripper." Good: "Slowing down the morning rush.")
  **Who Makes the Call:** Consensus, but you hold veto power if the theme is a feature list.
  **Judgment Limit:** The procedure cannot tell you if the *client's* theme is wrong. It only locks the theme you are given.

  ## Phase 2: Knob Identification (25 Minutes)
  **Goal:** Find high-leverage parameters, avoiding the first three obvious ones.
  **Procedure:**
  1.  **Knob Storm (10 min):** List every adjustable parameter (Material, Geometry, Interaction, Time, Sequence).
  2.  **The "Blind Test" Filter (10 min):** For each knob, ask: "If the user was blindfolded, would turning this knob change their experience?"
      *   If **No**: It is a *Skin Knob* (Color, Finish). Discard for concept phase.
      *   If **Yes**: It is a *Structural Knob*. Keep.
  3.  **Selection (5 min):** Pick the top 3 Structural Knobs with the highest tension between them.
  **Sufficient Answer:** 3 Structural Knobs defined by ranges (e.g., "Flow Rate: Slow to Fast," not just "Spout Size").
  **Who Makes the Call:** Group vote, Facilitator breaks ties.
  **Judgment Limit:** The procedure surfaces *potential* knobs but cannot predict manufacturing cost or feasibility.

  ## Phase 3: Variation Generation (35 Minutes)
  **Goal:** Generate 3 directions by turning knobs without breaking the theme.
  **Procedure:**
  1.  **Assignment:** Assign each designer (pairs allowed) one specific combination of Knob Settings to sketch.
  2.  **The "Collapse" Stress Test (15 min):** For each sketch, run the **Invariant Check**:
      *   *Question:* "If we turn this knob to this setting, does the Theme (from Phase 1) still happen?"
      *   *Failure Mode:* **Theme Collapse.** The object still works, but the core promise is broken. (e.g., A "quiet" chair that looks visually loud).
      *   *Failure Mode:* **Cosmetic Restyling.** The knob turned didn't change the user experience (failed Phase 2 filter).
  3.  **Refinement:** Adjust settings until the Variation holds.
  **Sufficient Answer:** 3 sketches where the link between Knob Setting and Theme is explicit.
  **Who Makes the Call:** You (Facilitator) rule on Theme Collapse. Designers rule on feasibility.
  **Judgment Limit:** You can identify collapse, but you cannot mandate a fix. If a knob breaks the theme, that direction is dead.

  ## Phase 4: Defense Prep (10 Minutes)
  **Goal:** Prepare the narrative for the CD.
  **Procedure:** Write the "Variation Statement" for each direction: *"We turned [Knob] to [Setting], which varies the [Theme] by [Effect], without breaking [Invariant]."*
  **Who Makes the Call:** You.

  ---

  # Translation Layer: Theory to Studio Speak

  To make this usable by designers with no theory, you must translate Hofstadter's terminology.

  | Hofstadter Concept | Studio Translation | Drop or Keep? |
  | :--- | :--- | :--- |
  | **Theme** | **Core Promise** | **Keep.** Essential. |
  | **Invariant** | **Non-Negotiable** | **Keep.** Designers understand constraints. |
  | **Knob** | **Lever** | **Keep.** Implies agency and adjustment. |
  | **Variation** | **Direction** | **Keep.** Standard studio lexicon. |
  | **Isomorphism** | **Functional Equivalence** | **Drop.** Too academic. |
  | **Theme Collapse** | **Promise Break** | **Keep.** "You broke the promise." |
  | **Search Space** | **Solution Landscape** | **Drop.** Unnecessary abstraction. |

  **Distinctions that must survive:**
  1.  **Skin vs. Structure:** Designers love skin. You must enforce the "Blind Test" to kill cosmetic knobs during concepting.
  2.  **Feature vs. Promise:** A feature is what it *has*; a promise is what it *does for the human*.

  **Distinctions to drop:**
  1.  **Mathematical rigidity:** Don't demand proof that an invariant is held. Demand *plausibility*.
  2.  **Exhaustiveness:** You are not mapping the whole space. You are sampling three distinct points.

  ---

  # Application to Briefs

  Here is how the protocol runs on your three current briefs.

  ### 1. Hospital Waiting-Room Chair
  *   **Client Brief:** Comfortable, durable, easy to clean.
  *   **Phase 1 (Theme):** Team argues "Comfort." You push. "Comfort" is a feature. What is the experience? **Core Promise:** "Dignified Pause in a High-Stress Environment."
  *   **Phase 2 (Knobs):**
      *   *Skin:* Color (Discarded).
      *   *Structural:* Privacy (Open vs. Enclosed), Posture (Passive vs. Active), Hygiene Perception (Visible vs. Hidden).
  *   **Phase 3 (Variations):**
      1.  *The Cocoon:* High Privacy, Passive. (Passes Integrity Check).
      2.  *The Bench:* Low Privacy, Active (encourages shifting). (Passes).
      3.  *The Clinic:* High Hygiene Perception, Low Privacy.
  *   **Verdict:** **Theme Collapse on Direction 3.** The team made it look too sterile. The "Dignified" promise broke because it felt punitive. You kill Direction 3. Team must iterate to restore dignity while keeping hygiene visible.
  *   **Result:** 2 strong directions, 1 recycled.

  ### 2. Pour-Over Coffee Dripper ("The Next Thing")
  *   **Client Brief:** Innovative, premium, "the next thing."
  *   **Phase 1 (Theme):** Team says "Brewing Coffee." You push. **Core Promise:** "Ritualized Control Over Extraction."
  *   **Phase 2 (Knobs):**
      *   *Skin:* Material (Brass, Ceramic, Glass), Color.
      *   *Structural:* Flow Dynamics, Heat Retention, Dosing Mechanism.
  *   **Phase 3 (Variations):**
      *   *Team Favorite:* "The Artisan." Same geometry, new limited-edition Brass finish and colored ceramic options.
      *   *Direction 2:* "The Integrated." Dripper + Carafe thermal lock.
      *   *Direction 3:* "The Modulator." Adjustable flow restrictor built into the base.
  *   **Verdict:** **Direction 1 is Rejected (Cosmetic Restyling).**
      *   *Your Call:* You apply the "Blind Test." If the user is blindfolded, does the brass change the ritual? No. It changes the *object*, not the *variation*.
      *   *Theme Collapse Check:* Even worse, if the theme is "Control," and the brass version costs 3x more, it limits access, subtly breaking the "Ritual" for the average user.
      *   *Outcome:* You tell the team the Brass version is a SKU, not a concept direction. They are unhappy. They think you are stifling "premium." You defend it to the CD as "Failure to vary the theme."
  *   **Result:** 2 strong directions, 1 rejected. You must generate a 3rd structural variation in the remaining 10 minutes.

  ### 3. Museum Audio Guide
  *   **Client Brief:** Engaging, modern, accessible.
  *   **Phase 1 (Theme):** **Core Promise:** "Contextual Narrative without Distraction."
  *   **Phase 2 (Knobs):**
      *   *Structural:* Trigger Method (Proximity vs. Manual), Content Depth (Linear vs. Branching), Device Visibility (Handheld vs. Wearable).
  *   **Phase 3 (Variations):**
      1.  *The Ghost:* Bone conduction headset. Zero visual distraction.
      2.  *The Lens:* AR glasses that highlight art.
      3.  *The Beacon:* Phone app that plays when near art.
  *   **Verdict:** **Direction 2 (AR) borders on Collapse.**
      *   *Your Call:* The "Without Distraction" invariant is at risk. If the AR overlay is too rich, the user looks at the screen, not the art. The Theme collapses into "Digital Experience," not "Museum Visit."
      *   *Decision:* You allow it *only* if the team can prove the overlay is transparent. If not, it's a different product.
  *   **Result:** 3 directions, but Direction 2 is flagged as "High Risk of Promise Break."

  ---

  # The Limitation: What This Procedure Cannot Do

  You asked for the stop rule and the limitations. Here is the hard truth about Hofstadter's model applied to business.

  **1. It Cannot Reframe the Brief**
  This procedure optimizes *within* a theme. It is an engine for **exploitation**, not **exploration**.
  *   **The Problem:** Clients often pay for the direction that *changes the theme itself* (e.g., "Don't make a better chair, make a waiting experience that doesn't require sitting").
  *   **The Verdict:** This 90-minute session **cannot** generate that. If the Theme Lock (Phase 1) accepts the client's premise, you will never find the innovation that invalidates the premise. To find the "theme-changing" direction, you need a separate "Reframing Session" *before* this protocol, where the goal is explicitly to break the brief, not fulfill it.

  **2. It Cannot Settle Taste**
  The procedure surfaces judgment; it does not settle it.
  *   **The Problem:** Two directions may both pass the Integrity Check. Both hold the theme. Both turn valid knobs.
  *   **The Verdict:** The procedure creates a tie. The Creative Director's choice becomes a matter of taste, strategy, or gut. You can defend the *process*, but you cannot defend the *winner* using this model alone.

  **3. The "Serendipitous Collapse" Paradox**
  *   **The Problem:** Sometimes, breaking the invariant creates a *better* theme (e.g., The "Distracting" AR guide turns out to be more engaging than the art).
  *   **The Verdict:** This procedure treats Theme Collapse as a failure. It will systematically filter out accidental breakthroughs that require a brief change. You must instruct your team that if they find a "Collapse" that feels like "Innovation," they must flag it as a **Brief Challenge**, not a Concept Direction.

  **Summary for your Defense:**
  When you present to the CD, you are not selling three random ideas. You are selling three **validated variations of a single promise.** If the CD asks, "Why didn't you do [Radical Pivot]?" your answer is: "Because this session was designed to deepen the current brief, not rewrite it. That requires a Reframe Session."

  If you run the Dripper session as written, you will have to tell your team that **materials are not concepts.** They will hate it. But it is the only way to ensure you aren't selling SKUs as strategy.
