prompt: |-
  I'm a senior analyst for an NGO that advises development banks on whether to freeze funding when a member state starts eroding democratic norms, and we're constantly fighting about whether a specific reform — like putting judges under ministerial oversight or reshuffling election-commission members — actually counts as democratic backsliding, or if we're just using the word as a partisan label for goverments we don't like. I need a reusable decision procedure my team can run in about 45 minutes, with ordered questions, what counts as a sufficient answer to each, clear stop-points where the answer is no, and explicit hand-off points where the issue is values rather than facts. I want it grounded in whatever political science and philosophy actually say about measuring regime change and normative assessment, but translated into plain language so I don't need a PhD to apply it.

  I'm especially stuck on whether we should measure backsliding against each country's own prior institutional baseline — including cases of institutional layering, where old democratic rules stay on paper but get hollowed out by parallel power structures — or against a universal liberal-democratic standard, and how to handle situations like Hungary's court-packing, a US state-level election-administration change, or Turkey's 2017 referendum shifts where the procedure might give an answer my team will hate. Please build the flowchart-in-words, apply it to those three cases, flag exactly where it breaks down and needs human judgment, and be honest about where it will misfire. Also tell me what would change your mind — for instance, if the distinction between procedural and substantive democracy collapses in practice, or if comparative data showed all these indicators just track partisan alignment — and point out where your reasoning is most likely to fail, probably around whether "backsliding" can even be defined without smuggling in liberal-democratic assumptions. Oh, and please don't just recite the usual country lists; I already know them.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Senior analyst for an NGO advising development banks on funding freezes based on democratic backsliding.
      *   **Problem:** Internal conflict over whether specific reforms (e.g., judicial oversight, election commission reshuffles) constitute genuine backsliding or partisan labeling.
      *   **Needs:** A reusable decision procedure (flowchart-in-words), runnable in ~45 minutes.
      *   **Requirements:** Ordered questions, sufficient answers, clear stop-points (No = proceed/fund), hand-off points (values vs. facts), grounded in polisci/philosophy but plain language.
      *   **Specific Tension:** Relative baseline (country's own history) vs. Universal liberal-democratic standard. Handling "institutional layering" (rules on paper vs. reality).
      *   **Test Cases:** Hungary (court-packing), US State-level election changes, Turkey (2017 referendum).
      *   **Critical Self-Reflection:** Where does it break down? Where does it misfire? What would change my mind? Acknowledge the liberal-democratic bias issue.
      *   **Constraint:** No reciting usual country lists.

  2.  **Theoretical Grounding:**
      *   *Levitsky & Ziblatt:* "How Democracies Die" (norms, forbearance, institutional hardball).
      *   *Bermeo:* "On Democratic Backsliding" (gradual vs. abrupt, legal vs. illegal).
      *   *Lührmann & Lindberg:* V-Dem Institute (polyarchy, indices).
      *   *Schmitter & Karl:* Procedural minimums.
      *   *Waldron:* Rule of law vs. substantive outcomes.
      *   *Concept:* Need to balance *procedural integrity* (can you vote/judge fairly?) with *institutional resilience* (can the system check power?).
      *   *The Baseline Problem:* Pure relativism allows "illiberal democracy." Pure universalism invites accusations of imperialism. The solution is a *hybrid*: Universal procedural minimums + Relative degradation thresholds.

  3.  **Drafting the Decision Procedure (The "45-Minute Triage"):**
      *   *Structure:* 4 Phases.
      *   *Phase 1: The Legal/Procedural Surface (Fast Check).* Is the change legal *within the current system*? (Stop point: If illegal coup, it's not backsliding, it's a breakdown. Different protocol).
      *   *Phase 2: The Functional Impact (The "Layering" Test).* Does this change alter the *probability* of opposition victory or accountability?
      *   *Phase 3: The Intent/Pattern Test (The "Hardball" Test).* Is this part of a sequence?
      *   *Phase 4: The Normative Hand-off.* Where values enter.

  4.  **Refining the Questions (Iterative Process):**
      *   *Q1:* Is it legal? *Correction:* Backsliding is often legal. So, Q1 should be: Does it reduce the uncertainty of electoral outcomes? (Przeworski's definition of democracy).
      *   *Q2:* Relative vs. Universal. Let's make it: Does it violate a *minimum* universal standard (e.g., secret ballot) OR does it degrade the *local* baseline of competition?
      *   *Q3:* Institutional Layering. Are old rules being bypassed by new informal structures?
      *   *Stop Points:* If the answer is "No change to competition," stop. Fund.
      *   *Hand-off Points:* Where we argue about "fairness."

  5.  **Developing the Test Cases:**
      *   *Hungary (Orbán's Court Packing):* Clear backsliding. Reduces judicial independence, removes check on executive.
      *   *US State-Level (e.g., partisan election boards):* Contested. Needs the procedure to show *why* it's ambiguous (local variance vs. national norm).
      *   *Turkey (2017 Referendum):* Shift to executive presidency. Legal but structural shift.

  6.  **Addressing the "Liberal-Democratic Assumption" Critique:**
      *   Must acknowledge that "independence" and "competition" are liberal values.
      *   Must admit the tool cannot prove *moral* rightness, only *procedural* integrity.
      *   *What would change my mind:* If data shows these indicators don't predict authoritarian consolidation, or if "substantive" outcomes (welfare) matter more to locals than procedure.

  7.  **Structuring the Output:**
      *   **Introduction:** Acknowledge the tension (Relativism vs. Universalism).
      *   **The Procedure (The "Backsliding Triage Protocol"):** Step-by-step.
      *   **Application to Cases:** Walk through Hungary, US, Turkey.
      *   **Failure Modes:** Where the tool breaks.
      *   **Epistemic Humility:** What would change the model.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is 45 minutes realistic? *Fix:* Keep questions binary where possible. Add time estimates.
      *   *Critique:* Is "Universal Standard" too vague? *Fix:* Define it as "Polyarchy Minimums" (Dahl) - contested elections, free speech, association.
      *   *Critique:* How to handle "Layering"? *Fix:* Add a specific question about informal vs. formal power.
      *   *Tone:* Professional, analytical, non-partisan, acknowledging the political nature of the task.

  9.  **Final Polish:**
      *   Ensure the "Hand-off Points" are explicit.
      *   Ensure the "Stop Points" are clear (i.e., when to *not* freeze funding).
      *   Check against the prompt's specific request for "what counts as a sufficient answer."

  *(Self-Correction on the US Case)*: Be careful not to take a side but show how the *tool* analyzes it. The tool might flag it as "Risk" but require the Value Hand-off to determine if it crosses the threshold for funding freezes.
  *(Self-Correction on Turkey)*: Acknowledge the referendum was legal. The issue is the *concentration* of power.

  10. **Final Review against constraints:** 45 mins? Yes. Ordered questions? Yes. Stop points? Yes. Hand-off points? Yes. Grounded in theory? Yes (Dahl, Levitsky, Bermeo). Plain language? Yes.

  (Proceed to generate response based on this structure.)
answer: |-
  This is a high-stakes operational problem. You are trying to operationalize a political science concept that is inherently contested. If you define backsliding too loosely, you weaponize development aid against political opponents. If you define it too narrowly, you fund autocrats until the tanks roll.

  The following procedure is designed to separate **procedural degradation** (which threatens the contract of development aid) from **policy disagreement** (which does not). It draws on Adam Przeworski's definition of democracy (contested uncertainty), Nancy Bermeo's work on gradual backsliding, and the V-Dem Institute's distinction between *de jure* and *de facto* power.

  It is built for a 45-minute triage.

  ***

  # The Backsliding Triage Protocol (BTP)

  **Time Allocation:** 45 Minutes
  **Goal:** Determine if a specific reform triggers a "Funding Freeze Review."
  **Underlying Logic:** We do not judge *what* the government decides (policy); we judge *how* they secure the power to decide (procedure).

  ## Phase 1: The Universal Minimums (10 Minutes)
  *Goal: Filter out outright authoritarianism vs. democratic friction.*

  **Question 1.1: Does this reform eliminate the possibility of the incumbent losing power via existing mechanisms?**
  *   **Sufficient Answer for "Yes" (Freeze Review):** The reform cancels upcoming elections, bans specific parties from running, or removes the legal mechanism for removal (e.g., abolishing the legislature).
  *   **Sufficient Answer for "No" (Proceed to Q1.2):** The incumbent can still legally lose power, even if the reform makes it harder.
  *   **STOP POINT:** If **No**, you are likely dealing with policy hardball, not regime change. Do not freeze funding based on Phase 1.

  **Question 1.2: Does this reform violate a "Polyarchy Minimum"?**
  *   *Definition:* Freedom of association, freedom of expression, or the secret ballot (Dahl's minimums).
  *   **Sufficient Answer for "Yes" (Freeze Review):** The reform criminalizes opposition organizing, shuts down independent media outlets, or removes ballot secrecy.
  *   **Sufficient Answer for "No" (Proceed to Phase 2):** The reform operates within the bounds of speech/association/ballot access, even if it advantages the incumbent.

  > **Hand-off Point 1 (Values):** If your team argues about whether a specific media regulation counts as "shutting down" vs. "regulating," you have left facts. Pause. This requires a normative call on the *value* of free press vs. state stability.

  ## Phase 2: The Relative Baseline & Layering (15 Minutes)
  *Goal: Address your specific concern about "own baseline" vs. "universal standard" and "institutional layering."*

  **Question 2.1: Does this reform degrade the institution's performance relative to its own 10-year baseline?**
  *   *Instruction:* Compare the new rule to the country's own recent history, not Denmark's.
  *   **Sufficient Answer for "Yes" (Flag Risk):** Judges were independent for 10 years; now they require ministerial sign-off. Election commissioners were appointed by consensus; now by simple majority.
  *   **Sufficient Answer for "No" (Proceed to Q2.2):** The institution has always been weak or politicized; this change is consistent with historical norms.

  **Question 2.2: Is this "Institutional Layering"?**
  *   *Definition:* Old democratic rules remain on paper, but new parallel structures bypass them (e.g., creating a "special tribunal" that drains cases from regular courts).
  *   **Sufficient Answer for "Yes" (Freeze Review):** The reform creates a new body that duplicates the function of an existing independent body but with lower independence thresholds, effectively hollowing out the original.
  *   **Sufficient Answer for "No" (Proceed to Phase 3):** The reform modifies the existing body directly without creating parallel bypass structures.

  > **Hand-off Point 2 (Values):** If the government argues the old baseline was "inefficient" or "colonial," and your team argues "independence is non-negotiable," you have hit a sovereignty vs. liberalism clash. The BTP cannot solve this. Mark it for senior leadership.

  ## Phase 3: The Sequence & Intent (10 Minutes)
  *Goal: Distinguish between a one-off fix and a pattern of capture (Levitsky/Ziblatt).*

  **Question 3.1: Is this reform part of a sequence of ≥3 changes affecting different veto players in the last 24 months?**
  *   *Examples:* Media law + Court restructuring + Election commission reshuffle.
  *   **Sufficient Answer for "Yes" (Freeze Review):** This indicates a strategy of cumulative capture.
  *   **Sufficient Answer for "No" (Proceed to Q3.2):** This is an isolated incident.

  **Question 3.2: Does the reform reduce "Forbearance"?**
  *   *Definition:* Are they using their full legal authority to the maximum extent to crush opposition, ignoring unwritten norms of restraint?
  *   **Sufficient Answer for "Yes" (Flag Risk):** They are using a technical majority to pass constitutional changes without opposition input, where previously consensus was sought.
  *   **Sufficient Answer for "No" (Proceed to Recommendation):** Standard legislative process was followed.

  ## Phase 4: The Recommendation (10 Minutes)
  *   **Freeze Review Triggered:** If you answered **YES** to 1.1, 1.2, 2.2, or 3.1.
  *   **Monitor Only:** If you answered **YES** to 2.1 or 3.2 but **NO** to the above.
  *   **Clear to Fund:** If you answered **NO** to all questions.

  ***

  # Application to Test Cases

  Here is how the BTP handles the three scenarios you provided. Note where the tool strains.

  ### 1. Hungary (Orbán's Court Packing, 2010-2013)
  *   **Q1.1 (Lose Power):** No. Elections still held.
  *   **Q1.2 (Polyarchy):** No. Media laws were contentious but didn't ban opposition speech outright.
  *   **Q2.1 (Relative Baseline):** **YES.** Hungarian courts had post-1989 independence; new laws lowered retirement age to purge judges and allowed political appointment of court leaders.
  *   **Q2.2 (Layering):** **YES.** The National Judicial Office was created, concentrating administrative power in one elected official (ally), bypassing the traditional judicial council.
  *   **Q3.1 (Sequence):** **YES.** Part of media law, election law, and constitutional changes.
  *   **BTP Result:** **Freeze Review Triggered.**
  *   **Analysis:** The tool works well here. It catches the *layering* (Q2.2) and the *deviation from local baseline* (Q2.1) without needing to compare Hungary to Sweden.

  ### 2. US State-Level Election Administration Changes (e.g., Georgia 2021)
  *   **Q1.1 (Lose Power):** No. Incumbents can still lose.
  *   **Q1.2 (Polyarchy):** No. Secret ballot and association remain.
  *   **Q2.1 (Relative Baseline):** **DEBATABLE.** Prior baseline varied by state. In some states, partisan boards existed before. In others, this is a shift from non-partisan to partisan control.
  *   **Q2.2 (Layering):** **NO.** It changes the existing board composition, doesn't create a parallel shadow board.
  *   **Q3.1 (Sequence):** **DEBATABLE.** Depends on if you count gerrymandering + voting ID + board changes as one sequence.
  *   **BTP Result:** **Monitor Only / Hand-off Point 2.**
  *   **Analysis:** The tool flags the risk (Q2.1) but likely won't trigger a full freeze unless you count the sequence broadly. This is where your team will fight. The tool forces you to admit this is *less* severe than Hungary structurally, even if the political stakes feel high. It prevents conflating *partisan advantage* with *regime change*.

  ### 3. Turkey (2017 Referendum, Executive Presidency)
  *   **Q1.1 (Lose Power):** No. Elections remain.
  *   **Q1.2 (Polyarchy):** **YES/NO Borderline.** Post-coup emergency decrees had already suppressed media (Q1.2 Yes), but the referendum itself was procedurally legal.
  *   **Q2.1 (Relative Baseline):** **YES.** Shifted from parliamentary system (checks and balances) to executive system.
  *   **Q2.2 (Layering):** **NO.** It was a formal constitutional change, not layering.
  *   **Q3.1 (Sequence):** **YES.** Followed purge of judiciary/bureaucracy post-2016 coup attempt.
  *   **BTP Result:** **Freeze Review Triggered.**
  *   **Analysis:** The tool captures the *sequence* (Q3.1) and the *baseline shift* (Q2.1). It correctly identifies that even if the vote was legal, the cumulative context indicates backsliding.

  ***

  # Where The Procedure Breaks Down (Failure Modes)

  You asked for honesty about where this will misfire. Here are the three structural weaknesses of the BTP.

  ### 1. The "Efficiency" Trap (Legitimacy vs. Procedure)
  The BTP assumes gridlock and checks are good. In developing contexts, voters often want *results* (roads, security, electricity). A government may argue, "We are dismantling judicial review because the courts are blocking essential infrastructure projects."
  *   **Failure Point:** Q2.1. If the "baseline" was a dysfunctional, corrupt judiciary, dismantling it might look like backsliding to the BTP but like reform to the local populace.
  *   **Risk:** You freeze funding on a government that is actually delivering substantive goods, alienating the population you aim to help.

  ### 2. The "Legalistic Autocrat" Loophole
  Sophisticated autocrats know how to pass the BTP. They will keep Q1.1 and Q1.2 clean (hold elections, allow some press) while using state resources (clientelism) to ensure they never actually lose.
  *   **Failure Point:** Q3.1. If they space their reforms out over 5 years instead of 24 months, they evade the "Sequence" trigger.
  *   **Risk:** False Negative. The tool says "Monitor," but the country is slowly suffocating.

  ### 3. The Liberal-Democratic Smuggle
  You asked if "backsliding" can be defined without liberal assumptions. The answer is **no**.
  *   **Failure Point:** The definition of "Polyarchy Minimums" (Q1.2) and "Forbearance" (Q3.2). These are inherently liberal concepts. A communitarian or "illiberal democratic" government would reject the premise that individual rights trump collective stability.
  *   **Risk:** Accusations of neocolonialism. When you freeze funding, you are enforcing a specific political philosophy, not just a technical standard.

  ***

  # Epistemic Humility: What Would Change My Mind?

  If I were sitting in your seat, these are the two pieces of evidence that would convince me to scrap this procedure:

  1.  **If Procedural and Substantive Democracy Collapsed:** If data showed that countries which fail the BTP (procedural backsliding) consistently deliver *better* human development outcomes (health, literacy, poverty reduction) than those that pass it, our mandate to freeze funding becomes morally dubious. If "backsliding" correlates with "state capacity building" in the short term, the tool is measuring the wrong variable for a development bank.
  2.  **If Indicators Track Partisan Alignment:** If a retrospective audit showed that the BTP triggers 90% of the time when the government is ideologically opposed to the donor nations and 10% when they are allies (regardless of the score), the tool is merely a weapon. We need an external audit of the BTP's application history to check for this bias.

  # Final Recommendation for Implementation

  1.  **Adopt the BTP as a "Triage" Tool, not a Verdict.** It determines *whether to investigate*, not *whether to freeze*. This lowers the stakes of the 45-minute session.
  2.  **Formalize Hand-off Point 2.** When the team hits the "Values vs. Facts" wall (e.g., "Is this efficiency or authoritarianism?"), require a written justification from the Regional Director. Make the political cost visible.
  3.  **The "Sunset" Clause.** If you freeze funding based on Q2.1 (Relative Baseline), set a automatic review date. If the government wins the next election convincingly, the "backsliding" assessment must be reopened. This acknowledges that voters might accept the new norms.

  This procedure will not stop the arguments. It will simply force your team to argue about specific, defined thresholds rather than vague feelings about "democracy." That is the best you can hope for.
