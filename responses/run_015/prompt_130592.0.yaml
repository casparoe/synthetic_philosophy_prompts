answer: |-
  There is no single, canonical term in the history of ethics that captures this exact configuration without residue. While it resonates with Ideal Advisor theories and Kantian notions of the "holy will," those frameworks fail to account for the specific binding authority you describe, particularly the requirement that the idealized self possesses *moral virtues the actual self lacks* rather than merely superior information or rationality. Standard Ideal Advisor models (such as those proposed by Michael Smith or Peter Railton) typically assume that the idealized self retains the agent's fundamental subjective interests, merely correcting for cognitive errors. Your pattern is more radical: it corrects for *moral* deficiency.

  Therefore, I propose we classify this structure as **Vicarious Ideal Volition**.

  ### Definition and Boundary Conditions

  **Vicarious Ideal Volition (VIV)** is a decision procedure in which an actual agent (A), recognizing a deficit in their own moral capacity or epistemic position, cedes normative authority to a counterfactual agent (A*). A* is constructed as a version of A who possesses not only perfect information but also specific moral virtues (e.g., impartiality, courage) that A currently lacks. Crucially, A treats A*'s hypothetical choice not as a goal to be achieved over time, but as an immediate, binding obligation for A's current action.

  For a decision process to qualify as VIV, it must meet three necessary conditions:

  1.  **Moral Discontinuity:** The idealization must involve a qualitative shift in moral character, not just an epistemic upgrade. If A* is merely A with more data, this is standard rational reconstruction. In VIV, A* must possess a virtue (e.g., fearlessness) that A explicitly lacks (e.g., fear).
  2.  **Immediate Bindingness:** The verdict of A* is treated as obligatory *now*. It is not an aspirational target ("I ought to become A*") but an authoritative command ("I ought to do what A* would do").
  3.  **Identity Retention:** Despite the moral discontinuity, A* must be recognized as a version of *A*. If A* is a stranger or a deity, the move becomes external authority or religious obedience. VIV relies on the tension that A* is "me, but better," allowing the authority to feel internal yet transcendent.

  ### Classification: A Species of Indirect Normativity

  You asked whether this is a variant of indirect normativity. My judgment is **yes**, but it is a specific, under-theorized species I would call **Agent-Relative Indirect Normativity**.

  Standard indirect normativity (like Rule Utilitarianism) argues that we should follow a *rule* rather than calculate consequences directly, because following the rule produces better outcomes. VIV argues that we should follow a *self* rather than deliberate directly, because that self's deliberation tracks value more accurately than our own.

  The norm applies indirectly because the actual agent does not ask, "What is the right thing?" (which their flawed perspective might answer incorrectly). Instead, they ask, "What would the Right Self do?" and obey that. The authority is mediated through the counterfactual agent. This distinguishes it from direct normative theories where the agent's own reasoning is the final court of appeal. In VIV, the agent's own reasoning is explicitly distrusted and overruled by the proxy.

  ### Defense Against Alternatives

  To justify this classification, we must distinguish VIV from the three neighboring concepts you identified.

  **1. Versus Direct Consequentialist Calculation**
  Direct consequentialism demands the agent assess the outcomes of available actions and choose the one maximizing the good. VIV explicitly rejects the agent's capacity to perform this assessment reliably. In your physician example, a direct consequentialist asks, "Does hiding the harm maximize utility?" The VIV agent asks, "Would a Virtuous Physician hide the harm?"
  *The Boundary:* If the agent uses the ideal self merely to estimate outcomes more accurately, it is consequentialism with better data. If the agent obeys the ideal self *even when they cannot verify the outcome* (due to radical uncertainty), it is VIV. The authority lies in the *virtue of the agent*, not the *visibility of the consequence*.

  **2. Versus Aspirational Self-Improvement**
  Aspiration treats the ideal self as a telos (end goal). It says, "I am cowardly; I should try to become brave." VIV treats the ideal self as a legislator. It says, "I am cowardly; therefore, I must obey the Brave Self."
  *The Boundary:* Aspiration acknowledges the gap between actual and ideal as a project to be closed. VIV acknowledges the gap as a permanent structural feature of the decision moment. The agent does not claim they *can* become the ideal self immediately, yet they bind themselves to its verdict. This makes VIV a tool for action under *incapacity*, whereas aspiration is a tool for *growth*.

  **3. Versus Epistemic Rational Reconstruction**
  Philosophical models like Rawls' Veil of Ignorance or Smith's Rational Self correct for ignorance, bias, or logical error. They assume that if you knew more and thought clearer, you would want what you *already* fundamentally value. VIV corrects for *moral failure*.
  *The Boundary:* If the idealization only adds knowledge, it is epistemic reconstruction. If the idealization adds *loyalty* to a stranger, or *courage* in the face of loss—values the actual self currently rejects or fears—it is VIV. This is the crucial distinction: VIV allows the ideal self to override the actual self's *current values*, not just their *calculations*.

  ### Philosophical Judgment: Reasoning or Rhetoric?

  You ask if this is a rhetorical device disguised as reasoning. My position is that **Vicarious Ideal Volition is a robust, valid heuristic for moral epistemology under radical uncertainty**, provided it is not used to evade responsibility.

  In conditions of radical uncertainty, the agent's immediate interests and emotions (fear, greed, attachment) act as noise that obscures moral truth. Since the agent cannot simply "turn off" this noise through willpower, VIV provides a procedural method to bypass it. By simulating a self that lacks the noise, the agent accesses a decision vector that their actual psychology blocks.

  However, it carries a specific risk: **Alienation**. If the ideal self is too discontinuous from the actual self (e.g., possessing virtues the actual self fundamentally rejects as evil), the binding authority collapses into coercion, and the agent acts in "bad faith," pretending a foreign will is their own. For VIV to function as reasoning rather than self-deception, the agent must endorse the *authority* of the virtue, even if they lack the *capacity* to embody it fully in that moment. The physician must agree that honesty is good, even if fear prevents them from being honest. If they reject the virtue entirely, VIV becomes a psychological trick, not a moral argument.

  ### Conclusion for Your Novel

  For the purposes of your narrative, you should treat **Vicarious Ideal Volition** not as a confusion, but as a sophisticated coping mechanism for moral fallibility. It is the structural equivalent of a Ulysses Pact, but instead of binding their future self to a mast, the agent binds their present self to the helm of a hypothetical captain.

  It is distinct from standard ethical theories because it admits that the agent is currently *broken* (morally or epistemically) and refuses to trust their own direct output. It is a second-order strategy: "I cannot trust my first-order judgment, so I will outsource it to the version of me that can." This is not merely rhetorical; it is a recognized, albeit rare, method of stabilizing moral action when the agent's own character is the primary source of uncertainty.
