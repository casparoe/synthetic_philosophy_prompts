  Next, lay out the cruxes. I suspect one is whether diachronic rationality can licence intentions that conflict with one's anticipated later preferences, and another is whether self-manipulation or pre-commitment mechanisms are reliable enough to bridge that gap. For each crux, propose a concrete parallel case or analogy both sides would accept bears on it — perhaps a government locking in long-term climate targets it expects future administrations to relax, or an evolutionary model of costly signalling — and record in advance what each camp predicts about that parallel. Don't include reading lists, bibliographies, or citations; this should work for a model that can't search the web. Keep it somewhat in the weeds, and feel free to inject a framing or comparison that isn't the standard textbook version. (Apologies if there are a typo or two — I recieve emails slowly these days.)
