      *Self-Correction on Schleiermacher:* Make sure to distinguish between "form as convention" (meter) and "form as materiality" (sound). Schleiermacher cares about the former as a vehicle for the latter. Mirroring cares about the latter directly.
      *Self-Correction on Hofstadter:* Hofstadter is flexible but cares about "essence." If the essence of *Ma mignonne* is its lightness and sound, mirroring captures that. If the essence is the message to the sick girl, it fails. The prompt asks about "cognitive structures." Articulation is a motor-cognitive structure. So it fits, but pushes the boundary of "intelligibility."

      *Final check on Summary Line:* Must be one sentence. Must start with "Summary:".

