prompt: |-
  hey, i've been lurking these forums for like a decade and this is probably too in the weeds but whatever.

  i run program evaluation for a small ngo that pitches behavior-change campaigns to universities and city councils — meatless mondays, bike-to-work nudges, local voter drives, staff flight offsets. every couple weeks i get a proposal and i have to tell the board whether it's worth our institutional credibilty to back it, given that one person's burger or vote doesn't move the needle on climate or election outcomes. classic inefficacy objection stuff, except the board is full of rationalist-adjacent people and they want something more rigorous than vibes.

  i need a reusable decision procedue — flowchart in words — that my review team (no philosphy phd, maybe 20 minutes per proposal, i sign off) can actually run. ground it in whatever moral philosphy actually says about individual contributions to collective harms, but don't lecture me. the key is handling three failure modes of the inefficacy objection: expected-value/threshold effects, signaling and coordination spillovers, and the normative 'do it anyway' layer. for each step say what counts as a sufficient answer, where we hard-stop with "no — don't back this as harm-reduction," and where we have to kick it to the board because it's values not facts. also flag the substitution-elasticity check — like, if people skip beef but the supply chain just redirects it, that's different from actually reducing slaughter.

  run it on three proposals:
  1. a "meatless monday" pledge for campus dining (this one should come back with an answer i don't love — i lean vegan but the procedue should probably say causal impact is below noise floor, back only if we explicitly frame it as values-expression not harm-reduction)
  2. a carpool mandate for a 200-person office to cut commute emissions
  3. a voter-turnout drive for a municipal race with about 8,000 registered voters

  say exactly what the procedue can't do — e.g., it won't settle whether collective-harm obligations exist in the first place, or whether we're picking the right counterfactual baseline. no bibliographies, no reading lists, don't quote anyone verbatim unless you can fetch the source. keep it practical.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Program evaluation lead for a small NGO.
      *   **Context:** Pitches behavior-change campaigns to universities/city councils (Meatless Mondays, bike nudges, voter drives, etc.).
      *   **Problem:** Board (rationalist-adjacent) demands rigorous justification against the "inefficacy objection" (one person's action doesn't move the needle).
      *   **Need:** A reusable decision procedure (flowchart in words) for the review team (non-philosophers, ~20 mins/proposal).
      *   **Key Requirements:**
          *   Grounded in moral philosophy regarding individual contributions to collective harms (without lecturing).
          *   Handle three failure modes: Expected Value/Thresholds, Signaling/Coordination, Normative "Do It Anyway."
          *   Include Substitution-Elasticity Check (supply chain redirection).
          *   Define sufficient answers, hard-stops ("No"), and board kick-ups (Values vs. Facts).
          *   Run the procedure on three specific proposals (Meatless Monday, Carpool Mandate, Voter Turnout).
          *   State limitations (what the procedure *can't* do).
          *   No bibliographies/reading lists/verbatim quotes unless sourced.
          *   Tone: Practical, direct, "in the weeds" but actionable.

  2.  **Deconstruct the Philosophical Underpinnings (Internal Knowledge):**
      *   *The Inefficacy Objection:* Based on the idea that individual causal impact is negligible (Singer, Parfit, Nefsky).
      *   *Expected Utility:* Even if probability is low, if impact is huge, EV might be positive (Pascal's Wager style, but for climate/voting).
      *   *Thresholds/Tipping Points:* Actions matter if they push a system over a threshold (e.g., election margin, supply chain order batch).
      *   *Complicity/Participation:* It's wrong to participate in harm even if you don't cause it (Kantian/Contractualist vibes).
      *   *Signaling/Coordination:* Individual acts signal norms, changing others' behavior (cascade effects).
      *   *Substitution Elasticity:* If I don't buy beef, does someone else buy it? Does the butcher order less next week? (Crucial for market interventions).

  3.  **Drafting the Decision Procedure (The "Flowchart"):**
      *   *Goal:* 20-minute max assessment. Needs to be binary/ternary checks.
      *   *Step 1: The Substitution/Elasticity Check.* (Is the harm actually avoided?) If no, hard stop for harm-reduction claims.
      *   *Step 2: The Threshold/Expected Value Check.* (Does this move a number that matters?) If yes, pass. If no, go to Step 3.
      *   *Step 3: The Signaling/Coordination Check.* (Does this change norms or trigger policy?) If yes, pass (with caveats). If no, go to Step 4.
      *   *Step 4: The Normative/Expressive Check.* (Is this about integrity rather than impact?) This is the Board Kick-up zone.
      *   *Labels:* "Green Light" (Back it), "Yellow Light" (Back it as Expression, not Impact), "Red Light" (Don't Back).

  4.  **Refining the Steps (Adding Specific Criteria):**
      *   *Elasticity:* Need to ask about supply chain responsiveness.
      *   *Threshold:* Need to ask about margin of victory or bulk ordering.
      *   *Signaling:* Need to ask about visibility and peer influence.
      *   *Normative:* Distinguish between "reducing harm" and "keeping hands clean."

  5.  **Applying to the Three Proposals:**

      *   *Proposal 1: Meatless Monday (Campus).*
          *   Elasticity: Low. One meal doesn't change slaughter numbers usually (buffer stocks).
          *   Threshold: Unlikely to hit a specific ordering threshold unless the *whole* program is massive.
          *   Signaling: High potential for norm shifting.
          *   Normative: Strong case for expression.
          *   *Verdict:* Yellow Light. Frame as norm-building, not direct harm reduction.

      *   *Proposal 2: Carpool Mandate (200-person office).*
          *   Elasticity: Fuel consumption drops directly. No substitution (gas isn't bought by someone else if you don't buy it).
          *   Threshold: 200 people is a measurable chunk.
          *   Signaling: High (workplace policy).
          *   *Verdict:* Green Light. Direct reduction + policy precedent.

      *   *Proposal 3: Voter Turnout (Municipal, 8k voters).*
          *   Elasticity: N/A (votes aren't commodities).
          *   Threshold: High probability of being pivotal in small races? Actually, 8k is small enough that margins *can* be tight, but EV is still low. However, *aggregate* turnout matters for mandate legitimacy.
          *   Signaling: High (democratic participation).
          *   *Verdict:* Green Light (but nuanced). Pivotality is low, but collective outcome is deterministic.

      *Wait, I need to be careful with the Voter Turnout one.* The prompt says "one person's vote doesn't move the needle." The procedure needs to address the *collective* nature of the drive. The drive moves *many* votes. So the unit of analysis is the *campaign*, not the single voter.
      *Correction:* The NGO is backing the *drive*. The drive moves $N$ votes. Does $N$ change the outcome?
      *   8,000 registered voters. Turnout usually 20-40%? So ~2,000 votes. Margin of victory could be 50 votes. If the drive gets 100 people to vote, it's pivotal.
      *   *Verdict:* Green Light on Threshold grounds.

  6.  **Addressing the Limitations:**
      *   Can't solve the "Is climate change actually bad?" question.
      *   Can't solve "Is voting morally obligatory?"
      *   Can't perfectly predict elasticities (data is imperfect).

  7.  **Review against Constraints:**
      *   *Tone:* Practical, not academic.
      *   *Time:* 20 mins.
      *   *Philosophy:* Implicitly uses Nefsky (non-consequentialist participation), Singer (EV), Sunstein (norms), but no name-dropping.
      *   *Formatting:* Clear steps, clear verdicts.

  8.  **Final Polish:**
      *   Make sure the "Substitution-Elasticity" check is prominent as requested.
      *   Ensure the "Board Kick-up" criteria are clear (Values vs. Facts).
      *   Check the Meatless Monday verdict aligns with the user's hint ("answer I don't love").

      *(Self-Correction on Meatless Monday)*: The user hinted the procedure should say "causal impact below noise floor." I need to make sure the Elasticity check catches this. If the dining hall orders by the quarter, one Monday doesn't change the order. So, Red Light for *Harm Reduction*, Yellow for *Norm Signaling*.

      *(Self-Correction on Voter Drive)*: The prompt asks about "one person's vote." But the proposal is a *drive*. The evaluation is on the *drive*. The drive moves the needle. The inefficacy objection applies to the *voter*, but the NGO is evaluating the *campaign*. I need to make sure the procedure distinguishes between evaluating an *individual act* vs. an *intervention*. The prompt says "I run program evaluation... I get a proposal." So we are evaluating the *campaign*.
      *   *Wait, re-reading prompt:* "given that one person's burger or vote doesn't move the needle." The user is worried about backing campaigns that rely on individual acts.
      *   *Okay, the procedure must evaluate the Campaign's Aggregate Impact.*
      *   *Meatless Monday:* Aggregate impact of *all* students? If 5,000 students skip one meal, does that reduce supply? Maybe. But usually, food waste buffers this.
      *   *Voter Drive:* Aggregate impact of *new voters*. If we get 200 new voters, does that change the election? In an 8k pool, yes, potentially.

      *Let's refine the "Unit of Analysis".* The procedure evaluates the *Proposal* (the intervention), not the single participant. However, the *mechanism* relies on individual changes. The inefficacy objection attacks the link between individual change and systemic outcome.
      *   *Step 1 (Elasticity):* If individuals change behavior, does the *system* respond? (e.g., Does less beef ordered = less cows killed, or just more waste/exports?)
      *   *Step 2 (Threshold):* Does the *aggregate* change hit a decision point? (e.g., Election margin, policy trigger).
      *   *Step 3 (Signaling):* Does the *campaign itself* shift norms beyond the participants?

      *Okay, ready to write.*

  9.  **Final check on "Board Kick-up":**
      *   If the procedure says "No harm reduction, but good for values," that's a Board decision on whether the NGO is a "Harm Reduction" org or a "Values" org. That's the kick-up point.

  10. **Structure:**
      *   Intro (acknowledge the decade lurking).
      *   The Procedure (The "Inefficacy Filter").
      *   The Three Runs.
      *   The Limitations.

      *(Self-Correction during drafting)*: Keep it tight. No fluff. Use bolding for decision nodes.

      *(One last check on Elasticity)*: Make sure to explain *why* it matters. If I don't buy chicken, the supermarket might throw it away (waste) or sell it to someone else (substitution). If they throw it away, the store orders less next time (impact). If they sell it, no impact. This is the "buffer" problem.

      *(Voter Turnout Nuance)*: The inefficacy objection is strongest here philosophically (probability of pivotal vote is near zero). But for a *drive*, we are talking about *marginal votes*. If the drive produces 50 votes and the margin is 10, the drive is pivotal. The procedure needs to capture *marginal contribution of the campaign*, not the voter.

      *Wait, the prompt says:* "given that one person's burger or vote doesn't move the needle." The user is internalizing the individual inefficacy objection and applying it to the *campaign's value*. The board wants to know if backing a campaign that relies on individually inefficacious acts is worthwhile.
      *   *Okay, the procedure must validate whether aggregating inefficacious acts becomes efficacious.*
      *   *Meatless Monday:* Aggregating meals -> does it reduce slaughter? (Elasticity).
      *   *Voter Drive:* Aggregating votes -> does it flip the seat? (Threshold).

      *Let's go.*
answer: |-
  Here is the decision procedure. It is designed to be printed as a one-pager. It treats the "inefficacy objection" not as a philosophical dealbreaker, but as a risk factor to be quantified or categorized.

  ### The Inefficacy Filter (Decision Procedure v1.0)

  **Time Budget:** 20 Minutes
  **Reviewer:** Program Staff
  **Final Sign-off:** You (unless kicked to Board)

  **Objective:** Determine if a proposal claiming "harm reduction" or "outcome change" actually clears the causal bar, or if it should be re-categorized as "norm signaling" or "values expression."

  ---

  #### STEP 1: The Substitution-Elasticity Check (The "Buffer" Test)
  *Goal: Rule out interventions where individual behavior changes are absorbed by market/system buffers without reducing total harm.*

  **Ask:** If the target group reduces consumption/participation by $X$ amount, does the supply chain or system reduce total output by $X$, or is that capacity redirected/wasted?

  *   **High Elasticity (Pass):** Supply is order-driven or capacity-constrained. Less demand = less production immediately. (e.g., On-demand printing, ride-share miles, electricity on a marginal grid).
  *   **Low Elasticity (Fail):** Supply is batch-driven, buffered, or exportable. Less demand = waste or resale, not less production. (e.g., Supermarket meat orders placed quarterly, fast fashion inventory, fixed-flight schedules).

  **Decision Node:**
  *   **If Low Elasticity:** Hard Stop on **Harm Reduction** claims. You cannot claim this reduces the physical harm (CO2, slaughter, etc.). Move to Step 3 (Signaling).
  *   **If High/Uncertain Elasticity:** Proceed to Step 2.

  #### STEP 2: The Threshold & Marginal Impact Check (The "Margin" Test)
  *Goal: Determine if the aggregate campaign output crosses a decision threshold.*

  **Ask:** What is the specific numeric outcome this campaign targets (votes, tons of CO2, policy signatures), and what is the margin of error or victory?

  *   **Pivotal Aggregate (Pass):** The campaign's *expected* contribution exceeds the likely margin of decision. (e.g., Getting 200 votes in a race decided by 50; cutting 10 tons when the policy trigger is 5 tons).
  *   **Drop-in-Bucket (Fail):** The campaign's contribution is statistically indistinguishable from noise relative to the threshold. (e.g., Getting 200 votes in a federal election; cutting 1 ton when the target is 1 million).

  **Decision Node:**
  *   **If Pivotal:** **Green Light.** Back as Harm Reduction/Outcome Change.
  *   **If Drop-in-Bucket:** Proceed to Step 3.

  #### STEP 3: The Signaling & Coordination Check (The "Cascade" Test)
  *Goal: Determine if the value lies in changing future behavior of non-participants.*

  **Ask:** Is this campaign visible enough to shift social norms or trigger policy adoption elsewhere?

  *   **High Visibility/Precedent (Pass):** The campaign is a pilot for a larger mandate, or the participants are opinion leaders whose behavior influences peers. (e.g., A university dining policy that other colleges copy; a corporate carpool mandate that becomes industry standard).
  *   **Low Visibility/One-off (Fail):** The action is private, temporary, or isolated. (e.g., A flyer campaign no one talks about; a pledge with no public component).

  **Decision Node:**
  *   **If High Visibility:** **Yellow Light.** Back as **Norm Signaling**. Do not claim direct harm reduction in marketing. Claim "culture shift."
  *   **If Low Visibility:** Proceed to Step 4.

  #### STEP 4: The Normative Kick-Up (The "Integrity" Test)
  *Goal: Identify when the proposal is purely about values, not facts.*

  **Ask:** If this campaign produces zero measurable physical impact and zero norm spillover, is there still value in "keeping our hands clean" or "bearing witness"?

  **Decision Node:**
  *   **If Yes:** **Kick to Board.** This is no longer a facts/evaluation question. It is a question of organizational identity. The Board must decide if the NGO is a *Harm Reduction Engine* (requires Steps 1 or 2) or a *Values Community* (allows Step 4).
  *   **If No:** **Red Light.** Do not back.

  ---

  ### Procedure Runs

  Here is how the filter applies to your three current proposals.

  #### 1. Campus "Meatless Monday" Pledge
  *   **Step 1 (Elasticity):** **Fail.** Campus dining usually orders protein in bulk quarters. A 10% drop in Tuesday consumption usually results in food waste or freezer storage, not an immediate reduction in slaughter orders. The supply chain buffer is too thick for a weekly pledge to penetrate.
  *   **Step 2 (Threshold):** **Fail.** Even if 1,000 students skip beef, the aggregate tonnage is negligible relative to regional supply chains. No tipping point reached.
  *   **Step 3 (Signaling):** **Pass.** High visibility. If the university adopts it officially, it signals institutional commitment, potentially influencing other campuses or future procurement policy.
  *   **Step 4 (Normative):** **Pass.** Many participants view it as integrity.
  *   **Verdict:** **Yellow Light.**
      *   **Instruction:** Do not market this as "saving X cows" or "reducing Y tons CO2." The causal chain is broken at Step 1. Market it as "Join a community of care" or "Pushing the institution toward sustainable procurement."
      *   **Board Kick:** Only if the Board insists on strict harm-reduction metrics. Otherwise, staff can approve under "Norm Signaling."

  #### 2. 200-Person Office Carpool Mandate
  *   **Step 1 (Elasticity):** **Pass.** Fuel is not buffered in the same way. If 50 cars don't drive, 50 cars' worth of gas is not refined/purchased. The marginal cost of fuel drives extraction. This is a direct reduction.
  *   **Step 2 (Threshold):** **Pass.** 200 people is a large enough cluster to create a measurable dip in local congestion/emissions data, which is often the metric city councils care about for grant renewals.
  *   **Step 3 (Signaling):** **Pass.** A *mandate* sets a policy precedent. Other offices may copy the rule.
  *   **Verdict:** **Green Light.**
      *   **Instruction:** Back as Harm Reduction. The causal link is direct (less driving = less burning), and the aggregate volume is measurable.
      *   **Note:** Ensure the mandate doesn't just shift commute times (rebound effect), but the proposal looks solid.

  #### 3. Municipal Voter Turnout Drive (8,000 Registered)
  *   **Step 1 (Elasticity):** **N/A.** Votes are not commodities; there is no supply chain substitution.
  *   **Step 2 (Threshold):** **Pass.** In a pool of 8,000 registered voters, typical turnout is ~2,500. Municipal races are frequently decided by <100 votes. If your drive generates 150 net new votes, you are statistically pivotal. Unlike national elections, the "drop-in-bucket" objection fails here due to small denominator.
  *   **Step 3 (Signaling):** **Pass.** High turnout legitimizes the council, potentially reducing apathy in future cycles.
  *   **Verdict:** **Green Light.**
      *   **Instruction:** Back as Outcome Change. The inefficacy objection applies to *one* voter, not a *drive*. Your intervention moves the aggregate margin.
      *   **Caveat:** Ensure you are targeting *marginal* voters (those unlikely to vote otherwise), not just reminding habitual voters. If you just remind people who would have voted anyway, you fail Step 2.

  ---

  ### Limitations & Boundaries

  This procedure is a tool for risk management, not moral truth. Be explicit about what it leaves unresolved when you present to the Board:

  1.  **It does not solve the "Complicity" debate.** The procedure assumes that if you don't reduce harm (Step 1 fail), you haven't reduced harm. It does not answer whether participating in a harmful system (even without causal impact) is morally forbidden. That is a deontological question, not an evaluation metric.
  2.  **It relies on imperfect data.** Elasticity estimates (Step 1) are often guesses. We are using "High/Low" heuristics because we don't have real-time supply chain data. If a vendor says "Yes, we order weekly," we take their word.
  3.  **It separates Facts from Values.** Step 4 is a firewall. If a proposal fails Steps 1–3, the argument for backing it becomes purely normative ("It's the right thing to do regardless of outcome"). This procedure forces that conversation into the open rather than letting it hide behind fake impact metrics.
  4.  **It assumes the baseline is static.** It doesn't account for counterfactuals like "If we don't do this, a worse actor will." (e.g., If our NGO doesn't run the voter drive, a polarization-focused group will). That requires political intelligence, not program evaluation.

  **Final Note for the Board:**
  When you present this, frame it as "Impact Integrity." We are protecting the NGO's credibility by refusing to claim harm reduction where the physics/economics don't support it. This allows us to be more aggressive on the projects that *do* pass the filter (like the voter drive and carpool mandate) because our claims are auditable.
