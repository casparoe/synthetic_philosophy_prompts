answer: |-
  Dear friend,

  Following our long and somewhat heated discussion regarding the moral permissions of filmmakers inventing deathbed conversations for well-documented historical figures, I have spent some time mapping the logical space of our disagreement. What follows is a taxonomy of the positions we might occupy, written as a continuous letter as you requested, tracing the branches of obligation from a single root question. We must begin at the root by asking whether dramatizations carry any obligation specific to representing real dead individuals that does not apply to purely fictional characters. If we answer this in the negative, we arrive immediately at a single leaf position known as Artistic Autonomy Absolutism, which holds that the dead are merely raw material for the living imagination. The awkward commitment of this view is that it permits a filmmaker to depict a revered humanitarian like Albert Schweitzer as a violent criminal provided the theme of the film is served, treating historical identity as entirely disposable.

  If, however, we answer the root question in the affirmative and assert that specific obligations do exist, the tree branches according to who exactly is the creditor of this obligation. The first major bough extends toward the living survivors and descendants who might suffer collateral harm. Here we must split based on the nature of the harm required to trigger the obligation. One leaf represents the Position of Direct Psychological Harm, which argues that obligations only arise if living relatives experience genuine emotional distress. Its awkward commitment is that the duty to truth vanishes entirely if the historical figure has no living descendants or if those descendants are emotionally resilient enough not to care. The other leaf under this bough is the Position of Lineage Reputation, which argues that harm exists as an objective stain on the family name regardless of felt distress. Its awkward commitment is that distant cousins or even living strangers with the same surname could theoretically claim injury from a portrayal they never personally witnessed.

  The second major bough extends toward the dead themselves as the creditors. Here the tree splits further on whether they can genuinely be wronged after death, or whether our duty is merely derivative, such as honoring a narrative inheritance where the dead bequeath a story-identity held in trust by the living. If we claim they can be genuinely wronged, we must split again on whether false representations alone violate that duty, or whether truthful but invasive portrayals violate it equally. The first path leads to the Position of Posthumous Falsehood Protection, which forbids lying about the dead but allows exposing their secrets. Its awkward commitment is that it permits a biopic to reveal accurate but humiliating medical details while forbidding a fictionalized noble last word, prioritizing privacy over dignity. The second path leads to the Position of Posthumous Dignitary Rights, which forbids both lies and invasive truths. Its awkward commitment is that it renders most critical biography impossible, as any exposure of shame violates the dead person's right to a dignified memory. Returning to the derivative branch where the duty is based on narrative inheritance, we apply the same split regarding false versus invasive representations. The path restricting only falsehoods leads to the Position of Fiduciary Truthfulness, which views the story-identity as a trust that must not be lied about but may be fully disclosed. Its awkward commitment is that it allows heirs to authorize the publication of deeply humiliating private diaries against the probable wishes of the deceased, provided the content is accurate. The path restricting both falsehoods and invasive truths leads to an unnamed position that treats narrative inheritance as a right to both accuracy and secrecy. Its awkward commitment is that it grants the dead a form of veto power over history that no living person possesses, effectively allowing them to censor the historical record from the grave.

  The third major bough extends toward the collective historical record as such. Here we split on whether its value is intrinsic, so that any fictionalization amounts to what I will call epistemic pollution of collective memory, or merely instrumental. If the value is intrinsic, we arrive at the Position of Historical Purism. Its awkward commitment is that it declares all historical fiction inherently immoral, regardless of how well-intentioned or educational the dramatization might be. If the value is merely instrumental, we must split again on whether literal fidelity to documented dialogue and specific events is required, or whether structural fidelity is sufficient. The demand for literal fidelity leads to the Position of Documentary Literalism. Its awkward commitment is that it forces filmmakers to include boring or confusing verified events while excluding invented scenes that might better explain the psychological motive, sacrificing understanding for accuracy. The demand for structural fidelity leads to the Position of Causal Realism. Its awkward commitment is that it permits the invention of specific lies, such as a fake deathbed conversation, provided the broader institutional dynamics and psychological motives remain true, effectively sanctioning micro-falsehoods to achieve macro-truth.

  Having mapped these leaves, we must identify which answer-combinations appear unoccupied in the tree. The most glaring gap is the combination where the historical record is held to have intrinsic value while simultaneously accepting that structural fidelity alone is adequate. This position is unoccupied because it seems incoherent to claim the record is sacred in itself while also admitting that altering specific facts does not damage that sacredness. If the record is intrinsically valuable, then changing a specific date or quote should constitute damage regardless of the structural outcome, so the gap stems from a logical contradiction rather than simple neglect. A second unoccupied combination lies within the branch concerning the dead themselves, specifically the pairing of genuine posthumous wronging with the permission for truthful but invasive portrayals. While I have listed this as a position, it is rarely defended in practice because if one believes the dead can be genuinely wronged, it is difficult to explain why causing them the harm of humiliation is permissible simply because the content is true, suggesting this leaf is occupied more by theoretical possibility than actual adherents.

  Finally, I must flag a pair of leaves that this tree cannot genuinely separate, specifically the survivor-centered obligations based on lineage reputation and the derivative narrative-inheritance duties where descendants are the sole trustees. In practice, these two positions converge because if the living descendants are the trustees of the narrative inheritance, any violation of that trust looks identical to a violation of their reputational interest. The tree treats them as distinct because one grounds the duty in the survivors' own rights while the other grounds it in the dead person's bequeathed identity, yet the practical output is the same, revealing that our intuition about protecting the family name often masks a deeper confusion about who actually owns the past. I hope this map helps clarify where our own views diverge, particularly on whether we see the dead as rights-holders or merely as subjects of a record we owe to the future.

  Yours in thought,

  A Friend
