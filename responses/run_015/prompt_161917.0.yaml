answer: |-
  Short answer
  There is no single canonical name, though philosophers often lump this under "verbal disputes" or "underdetermination." A more precise label for your specific case is an **empirically elastic question**, where the conditions of satisfaction shift to accommodate any data.

  The nearest established notions
  The closest existing concept is the underdetermination of theory by data, associated with Quine and Duhem. This holds that evidence alone cannot dictate theory choice because multiple theories can accommodate the same observations. In your case, the "theory" is the philosophical stance on innate ideas, and the "data" are the surgical or substitution outcomes. The debate persists because the data underdetermine the conclusion; both sides can logically fit the result into their framework.

  Next is the verbal dispute, discussed by Carnap and later Chalmers. This occurs when parties agree on all physical facts but disagree on language usage. If one side defines "seeing" as requiring conceptual linkage and the other as raw retinal input, they talk past each other. This matches your observation that re-descriptions are defensible; each side is technically correct within their own semantic framework, making the disagreement appear substantive when it might be linguistic.

  Finally, there are essentially contested concepts, introduced by Gallie. These are concepts like "justice" or "art" where disagreement is inherent to the concept itself; no single definition captures the whole usage. While usually normative, this mirrors the resilience you see in Molyneux's question. The concept of "recognition" here seems to accept multiple valid interpretations, none of which can permanently displace the others, allowing the debate to survive any empirical blow.

  Where each falls short
  Underdetermination fails because it typically assumes fixed theories competing for acceptance. In your scenario, the theories aren't fixed; the parameters of the question itself shift. The "time window" isn't a theoretical commitment but an operational setting that changes mid-stream to absorb the result. Underdetermination explains why data doesn't pick a winner, but not why the rules of the game adjust to ensure there is no winner.

  Verbal disputes fall short because they imply triviality. If this were merely verbal, we could stipulate a definition and move on. But your case feels substantive; the physiological stakes are real. The participants aren't just quibbling over words; they are probing the architecture of the mind. Calling it a verbal dispute dismisses the genuine uncertainty about how sensory integration actually works, which is the core of your physiological intuition.

  Essentially contested concepts are primarily normative, dealing with values rather than facts. Molyneux's question is ostensibly empirical—it asks about causal wiring and learning rates. Applying a normative label to a physiological query mischaracterizes the domain. The disagreement isn't about what "recognition" ought to mean in a moral or aesthetic sense, but about how the brain actually binds modalities. The resilience comes from measurement ambiguity, not value pluralism.

  Definition and boundary
  I propose the term **empirically elastic question**. This is a query where operational definitions of key terms shift systematically with outcomes, preventing falsification without dogmatism. The elasticity lies in the parameters: when data conflicts with a prediction, the definition of the measured variable adjusts to accommodate it, yet each adjustment remains scientifically defensible.

  A clear case is the question: "Is aggression innate?" If a specific gene is found, critics say it's only a predisposition, not determinism. If environment is shown to dominate, proponents say the genetic trigger was merely suppressed. The definition of "innate" stretches to absorb the finding, keeping the question alive indefinitely despite accumulating data.

  A near miss is: "Is this liquid water?" This is rigid. If the chemical structure is H2O, it is water; if not, it isn't. There is no elastic window where "mostly H2O" counts as water for one side and not the other based on the result. The criteria are fixed prior to measurement, so the question resolves cleanly without shifting parameters to save the debate.

  Back to Molyneux
  Your diagnosis is correct: Molyneux's question is empirically elastic because "recognition" and "instant" are undefined variables that stretch to fit the data. The time-window business is the primary mechanism of this elasticity; setting it at half a second versus five minutes changes the philosophical outcome without changing the physiology.

  The savings test is a way out. By shifting from a binary yes/no on recognition to a continuous measure of learning rate, you fix the operational parameter. It escapes the trap because "faster learning" is less elastic than "immediate recognition." It relocates the question from a metaphysical puzzle about identity to a measurable gradient of transfer, dissolving the elasticity by removing the undefined window where the debate hides.
