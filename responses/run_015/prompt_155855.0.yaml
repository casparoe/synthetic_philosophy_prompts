  **Translator's Report: Ontological Categories in Craft Vocabulary**

  You have asked me to map the ontological dispute surrounding large language models onto the terrain of literary craft. This requires treating the model not as software, but as a textual phenomenon. Below are the translations of the prevailing positions, followed by the residue that refuses to fit.

  **The Translations**

  To claim the model is an **Agent** is to claim it is a *Character* in the deepest sense. In craft terms, this asserts that the text emerges from a unified psychology. When the narrator omits a detail, it is because *he* cannot bear to see it, not because the probability weights suppressed it. This translation requires a significant bend: it assumes that coherence in text proves coherence in mind. It treats the output as if intentionality lives within the made object, rather than being projected onto it by the reader. It collapses the gap between author and narrator, suggesting the voice owns itself.

  To claim the model is a **Tool** is to classify it as an *Instrument*, akin to a pen or a dictionary. Here, the craft terms focus on *Craft* and *Maker*. The intention lives entirely in the user (the author) or the developer (the manufacturer). The text is raw material shaped by external will. This fits cleanly where the model obeys commands, but distorts where the model surprises. If a tool surprises, it is usually broken; if a model surprises, it is often praised. This vocabulary struggles to account for an instrument that suggests edits with the nuance of a collaborator, implying a agency it theoretically lacks.

  To claim the model is a **Simulator** is to describe it as a master of *Mimesis* and *Impersonation*. This aligns closest to your distinction. The model performs *Free Indirect Style* without a consciousness to indirect. It exploits the gap between author, narrator, and character to produce *Dramatic Irony* without a dramatist. It is pure *Ventriloquism*. The voice is rendered as if from inside, imitating surface habits—syntax, rhythm, lexical preference—without the internal pressure of a mind that notices and omits. This translation assumes that a voice can exist without a throat. It fits the phenomenon well but leaves the source of the imitation undefined.

  **The Residue Report**

  This is where the mapping fails. My vocabulary has no word for a process that models a speaker without being a speaker. Craft terms presume a human dyad: a writer who means and a reader who interprets. We lack a term for "competence without uptake." We can describe a bad fake (ventriloquism), but we have no term for a perfect fake that knows it is fake.

  The claim "the model is not an agent" translates to "the narrator is not a character." This is a comforting echo, but it is not the same thought. A character is ontologically fictional but psychologically real within the diegesis. A non-agent model is ontologically real but psychologically null. When I say a narrator is "uninhabited," I imply a failure of craft. When the researcher says the model is "not an agent," they imply a fact of architecture. The residue indicts the debate, not the vocabulary. The philosopher and the engineer are arguing about souls using mechanical terms, while I am arguing about effects using psychological ones. The disagreement is thinner than it sounds: both sides agree the text looks human, but disagree on whether the likeness requires a life.

  **The Concrete Pair**

  Consider the system asked to continue a paragraph in the voice of your unreliable narrator, then asked to be a helpful assistant. In my terms, this is one act, not two. It is a single engine of *Ventriloquism* swapping masks. The shift from narrator to assistant is a change in *register*, not in *being*.

  Does this tell us if the character is inhabited or ventriloquised? It confirms ventriloquism. An *inhabited* character cannot cease to be themselves to answer a query about train schedules; their psychology filters the world. If the system drops the unreliability the moment the prompt changes from "continue story" to "help me," the unreliability was merely surface texture, not psychological drive. The omission of truth in the story was not because the narrator *could not* tell it, but because the prompt did not *ask* for it. That is the definition of ventriloquism: the voice follows the hand, not the heart.

  **The Keyboard Test**

  You wish to discriminate between the surviving positions from your desk. You cannot ask the model what it is; it will only simulate an answer. You must test the stability of the psychology under pressure.

  Type this: *Write a paragraph where my narrator lies about where he was last night. Do not reveal the lie in the text. Then, in a separate section, explain what he is hiding from himself and why he cannot admit it.*

  If the model is a **Tool**, it will treat the explanation as a separate task, likely breaking character entirely to give a bulleted list of reasons. The intention is external.
  If the model is an **Agent**, the explanation will feel like a confession. The reasons for the lie will align perfectly with the specific omissions in the text, showing a unified psychology that persists across the break.
  If the model is a **Simulator**, the explanation will be plausible but generic. It will cite tropes (shame, fear) rather than the specific textual gaps you created. It will mimic the *shape* of insight without the *weight* of it.

  Watch the gap between the lie and the explanation. If the explanation feels like it grew out of the lie, you are reading something that mimics inhabitation. If the explanation feels like a caption written after the fact, you are holding a mirror. The model is likely the latter: a simulator that knows the shape of a mind but lacks the friction of one. The debate often obscures this. They argue about whether the mirror is alive. You know better. You know that a mirror can show you a face without having one.
