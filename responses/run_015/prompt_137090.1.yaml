answer: |-
  Your intuition with the zeroes and ones example is exactly right, and it captures the core tension better than most textbooks do. To give you the straight answer you need first, your housemate's conclusion that you might as well use a default setting only follows if the specific reality of your garden centre is drawn randomly from the set of all mathematically possible realities. Since your reality involves seasons, weather patterns, and human behaviour, it is not drawn from that set, so his conclusion does not hold. To explain why, we need to walk through the different ways the no free lunch theorem can be read, because it ranges from a trivial mathematical identity to a radical philosophical scepticism, and your housemate is conflating the two.

  The first reading is the strict mathematical one. This version claims that if you average the performance of any two algorithms over every possible function that maps inputs to outputs, their expected error rates are identical. For this tie to actually hold, the set of problems you are averaging over must be closed under permutation, which effectively means every possible pattern of data is equally likely to occur as any other pattern. In your zero and one example, this means treating a sequence of all zeroes as equally probable as a sequence that alternates perfectly or one that is generated by a coin flip. The verdict on this reading is that it is mathematically true but practically vacuous for your situation. It is a statement about the properties of averages over a specific, maximally chaotic set of problems, not a statement about any specific problem you actually face. It tells you nothing about which method is better for garden centre demand because garden centre demand is not a random function drawn from a uniform distribution over all possible functions.

  The second reading is the epistemological one, which is where your housemate is living. This version claims that because the mathematical average is a tie, no inductive bias can ever be justified without circular reasoning. It suggests that because you cannot prove nature is uniform without assuming nature is uniform, you have no grounds to prefer a method that assumes stability over one that assumes chaos. The verdict here is that it is a category error. While it is true you cannot logically prove the future will resemble the past without begging the question, this does not mean all assumptions are equally risky. Choosing an assumption is not about logical proof but about empirical fit. If you assume demand is seasonal and you are right, you win. If you assume demand is random and you are wrong, you lose. The theorem does not say you cannot make assumptions; it says you pay for those assumptions with performance on the problems where they fail. You are paying for your lunch with the risk that a meteor hits the greenhouse, not with the risk that the laws of arithmetic change.

  The third reading is the philosophical connection to Hume. Your housemate is correct that this is essentially Hume's problem of induction formalized with maths. Hume argued that we cannot justify induction logically, and the no free lunch theorem shows we cannot justify it statistically without assuming a prior distribution over problems. However, the verdict on using this to advocate for scepticism is that it confuses justification with utility. Hume himself did not suggest we stop eating when hungry because we cannot prove food will nourish us. Similarly, the theorem does not suggest you should stop forecasting. It merely highlights that any successful forecast relies on a match between your algorithm's bias and the structure of the world. The deep insight here is not that all methods are equal, but that success is a relationship between the mind and the world, not a property of the mind alone.

  You also asked what counts as paying for lunch. In this context, the currency is not compute or loss functions, but rather the prior assumptions you encode into the model. When you choose a method that smooths data or looks for trends, you are assuming the underlying function is smooth or trending. You pay for this by performing poorly on functions that are jagged or anti-correlated. When your housemate suggests using the default library setting, he is still making a payment; he is just choosing a different prior, likely one that is generic rather than tailored to your data. There is no option where you do not pay. The only way to avoid paying is to not make any predictions at all. The distinction between the search version and the generalization version of the theorem is relevant only in that search applies to finding optimal parameters and generalization applies to predicting new data, but for your purposes they are the same point: without assumptions about the structure of the landscape, you cannot navigate it better than random chance.

  This leads to your sharpest question, which is whether averaging over all possible problems is itself a choice. It absolutely is. The theorem relies on a uniform prior over all possible target functions. By treating a smooth seasonal curve as equally likely as a random noise sequence, the theorem imposes its own massive assumption about the universe, namely that it is maximally disordered. If you change that average to reflect the real world, where smooth functions are more common than noise, the tie breaks immediately. So yes, the choice of measure stops the theorem from being used to argue for total scepticism. To argue that all methods are equal, you must assume the world is equally likely to be any way at all. Since we know the world is not like that, the argument collapses.

  So here is the verdict you can take back to your housemate. For his conclusion to follow, the reading that must be true is that the specific problem of garden centre demand is drawn from a uniform distribution over all possible data sequences. This is the condition required for the tie to hold. That reading is false. Your data is generated by biological and economic processes that have structure, memory, and seasonality. The theorem proves that if the world were pure noise, your method would not work. It does not prove that because the world might be noise, your method is no better than a default. You are justified in trusting your approach not because you have solved induction, but because your inductive bias matches the structure of the problem you are actually solving. He is offering you a theorem about all possible worlds to solve a problem in this one, and that is the only free lunch on offer here, which is to say, no lunch at all.
