          *   *Soft spot:* Hard to maintain integrity if you trade away "sacred" values.
          *   *Concede?* No.

      *   *Objection 4 (Public Reason/Justification):* Legitimacy requires public reasons.
          *   *Phrasing:* "How do you justify the outcome to the losers? 'I traded your rights for their subsidies' isn't a public reason."
          *   *Reply:* The justification is the procedural respect for urgency, not the outcome itself.
          *   *Soft spot:* Losers still feel violated.
          *   *Concede?* No.

      *   *Objection 5 (Social Choice/Implementation):* Information asymmetry.
          *   *Phrasing:* "How do we know the urgency orderings? Strategic misrepresentation."
