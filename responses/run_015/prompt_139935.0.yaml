  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Public Reason/legitimacy crowd):* They hate "bargaining." It sounds like *modus vivendi*.
          *   *Phrasing:* "Isn't this just *modus vivendi* in disguise? You're talking about power and preference satisfaction, not justification."
