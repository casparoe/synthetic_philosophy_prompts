          *   *Concede?* Yes, limit scope to ideal theory.

      *   *Objection 6 (General Analytic):* The definition of Compromise.
          *   *Phrasing:* "If neither side proposes it and it's not a midpoint, is it compromise or just a new policy?"
          *   *Reply:* It's compromise because it requires mutual concession on high-urgency items to gain on low-urgency ones.
