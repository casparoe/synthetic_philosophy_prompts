  2.  **Deconstruct the Thesis & Audience Tensions:**
      *   *Thesis:* Compromise = Gains from Trade (Economic/Bargaining model). Incommensurability helps this.
      *   *Audience:* Compromise = Moral Duty/Principle (Deontological/Republican model). Bargaining = Corruption/Modus Vivendi (which they hate).
      *   *Core Tension:* The user is using the language of economics/social choice ("gains from trade," "common currency," "urgency orderings") to justify a moral practice (compromise) to an audience that suspects economic models undermine moral integrity.
      *   *Key Vulnerability:* "Moral Urgency." How do you measure this without a common currency? If you can rank them, isn't that a currency?
      *   *Key Vulnerability:* "Legitimacy." If the outcome is a trade neither side proposed, is it legitimate?
