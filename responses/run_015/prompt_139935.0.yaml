      *   *Objection 3 (The Integrity/Dirty Hands person):* Trading values is corrupting.
          *   *Phrasing:* "Doesn't this require moral schizophrenia? To trade A for B implies A and B are fungible for you, which contradicts your claim of incommensurability."
