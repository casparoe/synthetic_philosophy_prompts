      *   *Length:* Concise replies (2 mins spoken is ~250-300 words).
      *   *Vocabulary:* Use "public reason," "comprehensive doctrines," "ordinality," "integrative," "modus vivendi," "legitimacy."

  5.  **Review against Constraints:**
      *   6-7 objections? Yes.
