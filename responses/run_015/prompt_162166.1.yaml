prompt: |-
  I teach an upper-level undergrad epistemology seminar, 16 students, one 80-minute session. They've met the tracking account in its subjunctive form — you know p only if, were p true, you'd believe it, and were p false, you wouldn't — but we haven't done closure and I don't want to front-load it.

  Design a game for the room where they run that test themselves and run into the fact that it doesn't survive deduction: they should end up somewhere they'd describe as knowing p, seeing in one step that p entails q, deducing q, and having their own rule tell them they don't know q. I want them to get there by filling in the two counterfactual blanks claim by claim rather than by me announcing it, and I want it to cost them something — chips or points, no real money — so they have to decide whether to stake on a claim they've validly derived.

  Then a second round that's deliberately mundane: the nearest not-p world is just a look-alike (a fake, a duplicate, a switched label), so the same rule declares ignorance somewhere their gut says they plainly know. The session should land on the idea that the counterfactual test buys its verdict about deduction entirely by letting "the nearest world where it's false" do the work, and that that's also what makes it misfire — and should leave students choosing between two repairs (one that makes the belief track the fact, one that requires the belief not to be easily wrong) without me resolving it.

  Give me materials and setup, rules, a scoring scheme, a minute-by-minute timeline, a debrief that maps particular moments onto the two subjunctive conditions and onto the deduction step, an honest list of what'll go wrong the first time I run it (I fully expect someone to say the skeptical world isn't close, someone to say "I derived it, so of course I know", and someone to try to sneak a look at the actual state), and a note on what the game can't stage and I'll have to say in so many words.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level undergrad epistemology seminar, 16 students, 80 minutes.
      *   **Topic:** Nozick's Tracking Theory (Subjunctive Conditionals).
      *   **Current State:** Students know the definition ($p$ is true $\to$ believe $p$; $p$ is false $\to$ not believe $p$). They *don't* know about the Closure Principle yet.
      *   **Goal:** Design a classroom game where students *discover* the failure of closure under deduction themselves.
      *   **Mechanism:** Students fill in counterfactual blanks claim-by-claim. They must stake points/chips on derived claims.
      *   **Structure:**
          *   Round 1: High stakes/abstract (leads to "I know $p$, $p \to q$, so I know $q$" intuition, but Tracking says "No").
          *   Round 2: Mundane/Gettier-esque (nearest $\neg p$ world is a look-alike; Tracking says "No", Intuition says "Yes").
          *   Debrief: Connect game moments to subjunctive conditions and deduction. Highlight the role of "nearest world."
          *   Ending: Students choose between two repairs (Sensitivity vs. Safety) without instructor resolution.
      *   **Requirements:** Materials, setup, rules, scoring, minute-by-minute timeline, debrief guide, "what will go wrong" list, limitations note.

  2.  **Deconstruct the Philosophical Problem:**
      *   Tracking Theory (Nozick): $S$ knows $p$ iff:
          1.  $p$ is true.
          2.  $S$ believes $p$.
          3.  If $p$ were true, $S$ would believe $p$ (Adherence).
          4.  If $p$ were false, $S$ would not believe $p$ (Sensitivity).
      *   The Closure Problem: $S$ knows $p$. $S$ knows $p \to q$. $S$ deduces $q$. Does $S$ know $q$?
      *   Nozick says: Not necessarily.
      *   Classic Example: I know I have hands ($p$). I know if I have hands, I am not a brain in a vat ($p \to q$). So, I know I am not a BIV ($q$).
      *   Tracking Verdict:
          *   Hands: In nearest $\neg p$ world (no hands), I don't believe I have hands. (Sensitive).
          *   BIV: In nearest $\neg q$ world (I am a BIV), I *still* believe I am not a BIV (because BIVs think they aren't). (Insensitive).
      *   The Game Needs to Simulate This:
          *   Need a proposition $p$ that is sensitive.
          *   Need a proposition $q$ entailed by $p$ that is *insensitive* (because the nearest $\neg q$ world is further away or different than the nearest $\neg p$ world).
          *   Actually, for Nozick, the nearest $\neg q$ world is often the skeptical world, which is *further* than the nearest error world for $p$. Wait, let's check the logic.
          *   If $p \to q$, then $\neg q \to \neg p$.
          *   Nearest $\neg q$ world is a world where $q$ is false. Since $p$ entails $q$, $p$ must also be false there.
          *   The problem is that the *nearest* $\neg q$ world might be one where $p$ is false but I *still* believe $p$ (and thus believe $q$).
          *   Standard example: $p$ = "I am in Room 101". $q$ = "I am not in a simulated Room 101".
          *   Nearest $\neg p$: I am in Room 102. I look out the window, see it's not Room 101. I don't believe $p$. (Sensitive).
          *   Nearest $\neg q$: I am in a Sim. I still have the same experiences. I believe $p$, so I believe $q$. (Insensitive).
      *   *Correction for the Game:* The prompt asks for Round 1 to be the "Closure Failure" (Know $p$, Deduce $q$, Tracking says No $q$). Round 2 to be "Mundane False Positive" (Tracking says No, Intuition says Yes? Or Tracking says Yes, Intuition says No? The prompt says: "nearest not-p world is just a look-alike... same rule declares ignorance somewhere their gut says they plainly know." This sounds like a Sensitivity failure on a mundane claim. Wait. If the nearest $\neg p$ is a look-alike, and I believe $p$, then I fail Sensitivity. So Tracking says "No Knowledge". Intuition says "Yes". This is the standard "Skeptical Pressure" case applied to mundane things.)
      *   *Refining Round 2:* The prompt says: "Round 2... nearest not-p world is just a look-alike... same rule declares ignorance somewhere their gut says they plainly know." This is the *cost* of Tracking. It makes knowledge hard to get.
      *   *Refining Round 1:* "End up somewhere they'd describe as knowing p, seeing in one step that p entails q, deducing q, and having their own rule tell them they don't know q." This is the Closure failure.

  3.  **Game Design - "The Tracker's Wager":**
      *   **Setup:** 16 students. 4 groups of 4.
      *   **Materials:** Envelopes with "World Cards", Betting Chips, Worksheet for Counterfactuals.
      *   **Mechanism:**
          *   There is an "Actual World" (determined by the instructor).
          *   There are "Nearby Worlds" (determined by the instructor).
          *   Students make beliefs based on evidence.
          *   They test their beliefs against the Tracking Rules (Sensitivity/Adherence) using the provided "Nearby Worlds".
          *   They bet chips on whether they "Know" the proposition according to the rules.
      *   **Round 1 (Closure):**
          *   $p$: "The Red Box contains a Gem." (Evidence: Visual inspection).
          *   $q$: "The Red Box is not a Hologram." (Entailed by $p$).
          *   Actual World: Red Box has Gem, Real Box.
          *   Nearest $\neg p$ World: Red Box Empty. (Students would see it's empty $\to$ Don't believe $p$). *Sensitive.*
          *   Nearest $\neg q$ World: Red Box is Hologram (projecting Gem). (Students see Gem $\to$ Believe $p$ $\to$ Believe $q$). *Insensitive.*
          *   Result: They track $p$, but fail to track $q$.
      *   **Round 2 (Mundane/Skepticism):**
          *   $p$: "This is a $10 Bill."
          *   Nearest $\neg p$: It's a perfect counterfeit.
          *   If they can't tell the difference, they believe $p$ in the $\neg p$ world.
          *   Result: Tracking says "No Knowledge". Intuition says "Yes".
      *   **Scoring:** Points for correctly predicting what the Tracking Rule verdict will be, not for being "right" about reality. This forces them to engage with the rule.
      *   **Stakes:** They have to wager chips on whether they qualify as "Knowers" under the rule. If they think they know, they bet. If the rule says no, they lose.

  4.  **Drafting the Timeline (80 mins):**
      *   0-10: Setup & Rules.
      *   10-30: Round 1 (The Deduction Trap).
      *   30-50: Round 2 (The Mundane Trap).
      *   50-65: Small Group Debrief (Mapping to conditions).
      *   65-75: Full Class Discussion (The "Nearest World" mechanism).
      *   75-80: The Choice (Sensitivity vs. Safety).

  5.  **Refining the "Cost":**
      *   Students need to feel the pain of losing points on $q$ after successfully winning on $p$.
      *   They need to *fill in the blanks*. "If $p$ were false, I ___ believe $p$."
      *   The "Stake": They get chips for correct Tracking verdicts. They lose chips if they claim Knowledge when the Rule says No.

  6.  **Addressing "What Will Go Wrong":**
      *   Student: "The BIV world isn't near." (Response: Define 'near' stipulatively for the game).
      *   Student: "I deduced it, so I know." (Response: We are testing the Rule, not your intuition).
      *   Student: Cheating/peeking. (Response: Honor system + monitoring).
      *   Student: Confusion about Adherence vs. Sensitivity. (Response: Worksheet scaffolding).

  7.  **Addressing "What the Game Can't Stage":**
      *   The game stipulates the nearest worlds. In reality, "nearness" is the contentious part. The game assumes Nozick's ordering to make the point, but students need to be told that *ordering* is where the magic happens.
      *   The game can't fully capture the *value* of knowledge, just the extension.

  8.  **Developing the Materials:**
      *   Need clear World Cards.
      *   Need a Worksheet that forces the conditional writing.
      *   Need a Scoring Sheet.

  9.  **Review against Constraints:**
      *   *16 students:* 4 groups of 4 works well.
      *   *80 mins:* Tight but doable.
      *   *No Closure front-loading:* The game reveals it.
      *   *Two Repairs:* End with Sensitivity (Nozick) vs. Safety (Sosa/Pritchard).
      *   *Cost:* Chips/Points.

  10. **Final Polish:**
      *   Make sure the distinction between Round 1 (Closure failure) and Round 2 (Skeptical pressure/Mundane failure) is clear.
      *   Round 1: $p$ (Sensitive), $q$ (Insensitive).
      *   Round 2: $p$ (Insensitive due to look-alike).
      *   Wait, the prompt says for Round 2: "nearest not-p world is just a look-alike... same rule declares ignorance somewhere their gut says they plainly know." This confirms Round 2 is about Sensitivity failing on mundane claims.
      *   Ensure the debrief explicitly maps the "Nearest World" lever as the cause of both the Closure failure and the Mundane failure.

  11. **Self-Correction on Scoring:**
      *   If I want them to feel the cost, they should bet on their *Knowledge Status*.
      *   "I claim I Know $p$." If Rule says Yes, +10. If Rule says No, -10.
      *   This forces them to apply the rule rigorously, even against intuition.

  12. **Writing the Plan:** (Proceeding to generate output based on these thoughts).
      *   *Check:* Did I include the two repairs? Yes, Sensitivity vs. Safety.
      *   *Check:* Did I include the "honest list of what'll go wrong"? Yes.
      *   *Check:* Did I include the "note on what the game can't stage"? Yes.

      *One nuance:* In Round 1, to make the deduction clear, $p$ must entail $q$.
      *   $p$: "The animal in the pen is a Goldfinch."
      *   $q$: "The animal in the pen is not a Mule painted to look like a Goldfinch." (A bit clunky).
      *   Let's use the "Room" example, it's cleaner for a classroom.
      *   $p$: "We are in Room 101."
      *   $q$: "We are not in a Perfect Simulation of Room 101."
      *   Entailment: If we are in Room 101, we are not in a Sim of 101.
      *   Nearest $\neg p$: Room 102. (We would notice).
      *   Nearest $\neg q$: Sim World. (We would not notice).
      *   This works perfectly.

      *Round 2:*
      *   $p$: "This coin is Heads."
      *   Nearest $\neg p$: Coin is Tails (but looks like Heads due to lighting/trick).
      *   Actually, let's use the "Fake Barn" style or "Counterfeit Bill".
      *   $p$: "This is a real $20 bill."
      *   Nearest $\neg p$: "This is a perfect counterfeit."
      *   If I can't tell, I believe $p$ in $\neg p$ world. Sensitivity fails.
      *   Intuition: I know it's real (if it is).
      *   Tracking: I don't know.

      *Wait, one constraint check:* "Round 2... same rule declares ignorance somewhere their gut says they plainly know."
      *   Yes, Tracking (Sensitivity) declares ignorance on the Counterfeit Bill case. Intuition says Knowledge.
      *   Round 1: Tracking declares ignorance on $q$ (Simulation). Intuition says Knowledge (via deduction).
      *   Both hinge on the "Nearest $\neg p$ World" selection.

      *Let's finalize the repairs:*
      *   Repair 1: Keep Sensitivity, accept Closure failure (Nozick).
      *   Repair 2: Swap Sensitivity for Safety (If you believe $p$, $p$ must be true in nearby worlds). This saves Closure but changes the mechanism.
      *   Actually, the prompt asks for "one that makes the belief track the fact, one that requires the belief not to be easily wrong."
      *   Track the fact = Sensitivity (Nozick).
      *   Not easily wrong = Safety (Sosa).
      *   Perfect.

      *Let's write it.*
answer: |-
  # Lesson Plan: The Tracker's Wager
  **Course:** Upper-Level Epistemology Seminar  
  **Topic:** Nozick's Tracking Theory & The Failure of Closure  
  **Time:** 80 Minutes  
  **Students:** 16 (4 Groups of 4)  

  ## 1. Learning Objectives
  By the end of the session, students will:
  1.  Apply the subjunctive tracking conditions (Sensitivity/Adherence) to specific cases.
  2.  Discover internally that Tracking Theory violates the Closure Principle (Know $p$, Know $p \to q$, Deduce $q$, Fail to Know $q$).
  3.  Recognize that the "Nearest Possible World" operator drives both the Closure failure and skeptical pressure on mundane knowledge.
  4.  Evaluate the trade-off between **Sensitivity** (Tracking) and **Safety** (Non-luck) as competing repairs.

  ## 2. Materials & Setup
  *   **Room:** Tables arranged for 4 groups of 4.
  *   **Handout A (The Tracker's Ledger):** One per student. Contains blanks for counterfactuals and a betting sheet.
  *   **Handout B (World Cards):** One set per group. Sealed envelopes labeled "Actual World," "Near World $\neg p$," and "Near World $\neg q$."
  *   **Currency:** 20 Poker Chips (or laminated points) per student.
  *   **Board:** Whiteboard for tallying group scores and mapping the logic.

  ## 3. The Rules of the Game
  1.  **The Goal:** Maximize your chip count by correctly identifying whether you **KNOW** a proposition according to the **Tracking Rule**.
  2.  **The Tracking Rule:** You Know $p$ if and only if:
      *   (Truth) $p$ is true in the Actual World.
      *   (Belief) You believe $p$ in the Actual World.
      *   (Adherence) In the nearest world where $p$ is True, you believe $p$.
      *   (Sensitivity) In the nearest world where $p$ is **False**, you do **NOT** believe $p$.
  3.  **The Wager:**
      *   After analyzing a claim, you must wager 5 chips on your verdict.
      *   If your verdict (Know/Don't Know) matches the **Rule's Verdict**, you win 5 chips.
      *   If your verdict contradicts the **Rule's Verdict**, you lose 5 chips.
      *   *Note:* You are graded on applying the Rule correctly, not on matching your intuition.
  4.  **The Evidence:** You receive evidence only from the "Actual World" card. You must *simulate* your belief state in the "Near Worlds" based on the description provided.

  ---

  ## 4. Minute-by-Minute Timeline

  ### 00:00 – 00:10: Setup & Calibration
  *   **Instructor:** Distribute materials. Do not mention "Closure" or "Nozick."
  *   **Instruction:** "We are testing a specific definition of knowledge. Your intuition about what you *really* know doesn't matter for scoring; only what the Rule outputs matters. You must fill in the counterfactual blanks on Handout A before you wager."
  *   **Calibration Round (Practice):** A trivial claim (e.g., "There are 4 people at this table").
      *   Actual: True.
      *   Nearest $\neg p$: One person leaves.
      *   Task: Fill in blanks. Wager. Verify everyone understands the scoring.

  ### 00:10 – 00:35: Round 1 — The Deduction Trap
  *   **Scenario:** "The Room."
  *   **Proposition $p$:** "We are currently in Room 101."
  *   **Proposition $q$:** "We are not in a Perfect Simulation of Room 101."
  *   **Logic:** $p$ entails $q$. (If we are in Room 101, we are not in a Sim of it).
  *   **Action:**
      1.  Groups open **Actual World**: You see windows, desks, feel the floor. (Belief: $p$ and $q$).
      2.  Groups open **Near World $\neg p$**: "You are in Room 102." (Distinctive view outside window).
          *   *Task:* Would you believe $p$ here? (No).
          *   *Verdict:* $p$ is **Sensitive**.
      3.  Groups open **Near World $\neg q$**: "You are in a Perfect Sim of Room 101." (Indistinguishable experience).
          *   *Task:* Would you believe $q$ here? (Yes, you'd think you aren't in a sim).
          *   *Verdict:* $q$ is **Insensitive**.
      4.  **The Wager:** Students bet on whether they Know $p$ and whether they Know $q$.
      5.  **The Crash:** Most will bet they Know $q$ (intuition). The Rule says **No Knowledge**. They lose chips on $q$.
      6.  **Pause:** Ask one group to read their counterfactual blanks for $q$ aloud. ("If $q$ were false... I would still believe $q$").

  ### 00:35 – 00:55: Round 2 — The Mundane Trap
  *   **Scenario:** "The Bill."
  *   **Proposition $r$:** "This is a genuine $20 bill." (Instructor places a bill on the table).
  *   **Action:**
      1.  Groups open **Actual World**: It is genuine. You inspected it.
      2.  Groups open **Near World $\neg r$**: "This is a Perfect Counterfeit." (Indistinguishable to the naked eye).
      3.  **The Wager:** Students bet on whether they Know $r$.
      4.  **The Crash:** Intuition says "Yes, I know." The Rule says **No Knowledge** (because in the nearest $\neg r$ world, you still believe $r$). They lose chips on $r$.
      5.  **Observation:** The mechanism that killed $q$ in Round 1 (indistinguishable nearest false world) just killed $r$ in Round 2.

  ### 00:55 – 01:05: Small Group Debrief (Mapping)
  *   **Task:** On the whiteboard section of Handout A, map the two failures.
  *   **Prompt 1:** In Round 1, why did $p$ pass but $q$ fail? (Answer: The nearest $\neg p$ world is different from the nearest $\neg q$ world).
  *   **Prompt 2:** In Round 2, why did your gut say you knew $r$ but the Rule said no? (Answer: The Rule requires you to detect falsehood in the nearest world; the game stipulated you couldn't).
  *   **Prompt 3:** What single lever in the Rule caused both problems? (Answer: The selection of the "Nearest World where it's False").

  ### 01:05 – 01:15: Full Class Discussion
  *   **Instructor:** "You lost points because the Rule is strict about the nearest false world. This is called **Sensitivity**."
  *   **Board Work:** Draw the triangle:
      1.  **Sensitivity:** If $p$ were false, I wouldn't believe it. (Protects against error, kills Closure, kills Mundane Knowledge).
      2.  **Closure:** If I know $p$, and $p \to q$, I know $q$. (Saved by intuition, killed by Sensitivity).
      3.  **Safety:** If I believe $p$, $p$ isn't easily false. (Protects Mundane Knowledge, Saves Closure?).
  *   **Discussion:** "Round 1 showed Sensitivity breaks Deduction. Round 2 showed Sensitivity breaks Everyday Life. If you want to keep Sensitivity, you pay a high price. If you want to keep your intuition, you need a different rule."

  ### 01:15 – 01:20: The Choice (Exit Ticket)
  *   **Instruction:** "You have 5 minutes. Write down which repair you choose and why."
  *   **Option A (The Tracker):** Keep Sensitivity. Accept that you don't know you're not in a simulation, and you don't know mundane things if perfect fakes are 'near'. Knowledge tracks truth strictly.
  *   **Option B (The Safety-ist):** Swap Sensitivity for Safety ("In nearby worlds where I believe $p$, $p$ is true"). This allows knowledge in Round 2 and usually saves Closure in Round 1, but changes the definition of knowledge to be about reliability rather than tracking.
  *   **Submission:** Hand in Ledger with choice circled.

  ---

  ## 5. Handout A: The Tracker's Ledger (Excerpt)

  **Name:** ___________________  
  **Starting Chips:** 20  

  **ROUND 1: THE ROOM**  
  **Claim $p$:** "We are in Room 101."  
  1. Is $p$ true? [ ] Yes [ ] No  
  2. Do I believe $p$? [ ] Yes [ ] No  
  3. **Counterfactual 1:** If $p$ were True (Adherence), I ______ believe $p$.  
  4. **Counterfactual 2:** If $p$ were False (Sensitivity), I ______ believe $p$.  
  **Verdict:** [ ] KNOW [ ] NO KNOW  
  **Wager:** _____ chips  

  **Claim $q$:** "We are not in a Simulation." (Entailed by $p$)  
  1. Is $q$ true? [ ] Yes [ ] No  
  2. Do I believe $q$? [ ] Yes [ ] No  
  3. **Counterfactual 1:** If $q$ were True, I ______ believe $q$.  
  4. **Counterfactual 2:** If $q$ were False, I ______ believe $q$.  
  **Verdict:** [ ] KNOW [ ] NO KNOW  
  **Wager:** _____ chips  

  **ROUND 2: THE BILL**  
  **Claim $r$:** "This is a genuine $20 bill."  
  ... (Same structure as above) ...

  **FINAL CHOICE:**  
  [ ] **Repair 1 (Tracking):** Keep the Sensitivity condition. Accept the failures.  
  [ ] **Repair 2 (Safety):** Replace Sensitivity with "In nearby worlds where I believe $p$, $p$ is not false."  

  ---

  ## 6. Debrief Guide: Mapping Moments to Theory

  | Game Moment | Epistemological Concept | Instructor Script |
  | :--- | :--- | :--- |
  | **Round 1, Claim $p$** | **Sensitivity Success** | "You passed here. In the nearest world where you aren't in Room 101 (Room 102), you see it and stop believing. Your belief *tracks* the fact." |
  | **Round 1, Claim $q$** | **Closure Failure** | "You deduced $q$ from $p$. But look at Counterfactual 2. In the nearest world where $q$ is false (The Sim), you *still* believe $q$. The Rule says you don't know. Deduction did not transmit knowledge." |
  | **Round 2, Claim $r$** | **Skeptical Pressure** | "Your gut screamed 'I know!' But the Rule said 'No.' Why? Because the 'Nearest False World' was a counterfeit. The mechanism that broke Closure in Round 1 is the same one breaking Mundane Knowledge here." |
  | **The "Nearest World"** | **The Lever** | "The theory hangs entirely on how we order worlds. Nozick orders them so Sim Worlds are 'near' enough to test $q$, but 'far' enough to ignore for $p$. That's the cost." |
  | **The Choice** | **Sensitivity vs. Safety** | "Option A keeps the link between belief and specific truth (Tracking). Option B focuses on the reliability of your belief formation (Safety). You cannot have both without modification." |

  ---

  ## 7. Honest List: What Will Go Wrong (First Run)

  1.  **The "Skeptical World Isn't Close" Objection:**
      *   *What happens:* A student argues, "A simulation world isn't *near* the actual world. It's far-fetched."
      *   *Fix:* Remind them this is a stipulative game. "For the purpose of the Ledger, the 'Near World $\neg q$' card *defines* nearness. If you challenge the card, you aren't playing the game. We are testing the *consequences* of accepting that nearness."
  2.  **The "Deduction is Knowledge" Objection:**
      *   *What happens:* "I derived $q$ from $p$ validly. I *must* know $q$. The Rule is wrong."
      *   *Fix:* "You are being scored on whether you can correctly apply the Rule, not whether the Rule is true. If the Rule says No, and you bet Yes, you lose chips. Save the critique for the Final Choice."
  3.  **The "Peeking" Problem:**
      *   *What happens:* Students peek at the $\neg p$ card before filling out the $p$ section.
      *   *Fix:* Assign a "Dealer" in each group of 4 who is the only one allowed to open envelopes. Rotate dealers each round.
  4.  **Confusing Adherence and Sensitivity:**
      *   *What happens:* Students fill in "If $p$ were false, I would believe it" as a *positive* for knowledge.
      *   *Fix:* Walk around during the Calibration Round. Write the formula on the board: **False $\to$ Disbelieve** = **Pass**.
  5.  **Groupthink on the Wager:**
      *   *What happens:* One dominant student tells the group what to bet.
      *   *Fix:* Require individual Ledgers. Collect them all for the Final Choice. Only the Group Score is tallied on the board, but individual chips are lost/won.

  ---

  ## 8. Note: What The Game Can't Stage
  *You must say this in so many words during the debrief.*

  1.  **The Metric of Nearness:** The game *stipulates* which worlds are nearest via the cards. In real philosophy, the hard work is arguing *why* the Sim World is near enough to test $q$ but the Fake Bill World is near enough to test $r$. The game hides the metaphysics of similarity to highlight the logical consequence.
  2.  **The Value of Knowledge:** The game treats Knowledge as a binary switch for scoring points. It cannot capture *why* we care about knowledge (action, assertion, value). The "cost" is artificial chips, not the actual pragmatic cost of being wrong.
  3.  **The "Method" Fix:** Nozick later added a "Method" clause (you must use the same method in the near world). The game simplifies this to just "Belief." If a sharp student asks, "But in the Sim World I'm using vision, which is unreliable," acknowledge this is a sophisticated objection that leads to the "Method-Relative" tracking view, but note it doesn't solve the Closure problem entirely.

  ## 9. Instructor Prep Checklist
  *   [ ] Print 16 Ledgers.
  *   [ ] Create 4 sets of World Cards (Laminate if possible).
      *   *Set 1:* Actual (Room 101), $\neg p$ (Room 102), $\neg q$ (Sim).
      *   *Set 2:* Actual (Real Bill), $\neg r$ (Counterfeit).
  *   [ ] Count out 320 Chips total (20 per student).
  *   [ ] Clear whiteboard space for the Triangle (Sensitivity/Closure/Safety).
  *   [ ] Prepare a "Tie-Breaker" question if a group finishes Round 1 too fast (e.g., "What if the Sim had a glitch?").
