answer: |-
  You have stumbled directly into one of the oldest and most contentious debates in meta-ethics: the tension between **moral universalism** (there are objective moral facts) and **moral relativism** (moral facts are dependent on culture/context), filtered through the specific problem of **moral pluralism** (competing genuine values).

  Here is the breakdown of what is settled, what is fought over, and how different philosophical frameworks would answer your specific question about whether there is an "objective fact" regarding your actions.

  ### 1. What is Settled vs. What is Contested

  **Settled (Descriptive Relativism):**
  Philosophers and anthropologists agree on the *fact* of disagreement. Different cultures and subcultures prioritize different values. Some prioritize autonomy and truth-telling (often Western, individualistic); others prioritize hierarchy, harmony, and face-saving (often East Asian, collectivist, or traditionalist). There is no debate that these differences exist.

  **Settled (The Is-Ought Problem):**
  Philosophers agree that you cannot derive an "ought" (I should have been polite) purely from an "is" (This culture values politeness). Just because a group *feels* you were wrong doesn't objectively *make* you wrong, unless you accept a framework that validates their feelings as moral data.

  **Contested (Meta-Ethical Status):**
  There is **no consensus** on whether an objective moral truth exists underneath these cultural differences.
  *   **Moral Realists** argue there is a fact of the matter, even if cultures disagree on it.
  *   **Moral Relativists/Constructivists** argue that morality is *constituted* by these cultural agreements. If the culture says "shaming an elder is violence," then for that group, it *is* violence.
  *   **Moral Pluralists** argue that multiple objective values exist (e.g., Honesty and Respect), they are often incommensurable (cannot be measured on the same scale), and there is no single algorithm to rank them.

  ### 2. Your Roommate's Point: Morality vs. Convention

  Your roommate is referencing a distinction studied in moral psychology and philosophy (notably by Elliot Turiel and Martha Nussbaum).

  *   **Moral Norms:** Rules about harm, justice, and rights (e.g., "Do not hit," "Do not steal"). Violating these is seen as universally wrong, regardless of rules.
  *   **Conventional Norms:** Rules about etiquette, hierarchy, and context (e.g., "Wear a tie," "Do not speak until spoken to"). Violating these is wrong only if the authority or context says so.

  **The Conflict:**
  You are operating under the assumption that "preventing crop failure" is a **Moral Norm** (preventing harm/waste) and "not embarrassing an elder" is a **Conventional Norm** (etiquette). Therefore, Logic dictates Morality > Etiquette.

  The group is operating under a framework where "preserving social dignity" is a **Moral Norm** (preventing psychological harm/exclusion) and "maximizing tomato yield" is a **Pragmatic Goal**. For them, Morality (Respect) > Pragmatism (Yield).

  **Is there an objective fact here?**
  *   **If you are a Realist:** Yes. One of you is misidentifying the category. Either dignity is truly moral and yield is pragmatic, or vice versa.
  *   **If you are a Pluralist:** Both are moral goods. You traded one moral good (dignity) for another (food security). There is no "objective fact" that one trumps the other universally; there is only the question of which was more appropriate *in this specific context*.

  ### 3. Three Philosophical Frameworks for Your Situation

  To answer "Is there a right answer?", we have to look at how different ethical systems adjudicate this clash.

  #### A. Utilitarianism (Consequentialism)
  *   **The Argument:** The right action is the one that maximizes overall well-being.
  *   **The Calculation:** You must weigh the "utility" of the tomatoes against the "utility" of the elder's dignity and the group's cohesion.
  *   **The Verdict:** This is not objective in practice because "well-being" is subjective. If the group fractures and volunteers leave, the garden fails anyway. If the tomatoes rot, the garden fails. A Utilitarian would say there *is* an objective fact about which outcome causes more net suffering, but we lack the data to know it.
  *   **Status:** Contested. Many philosophers reject the idea that dignity can be quantified against crop yield.

  #### B. Deontology (Duty-Based Ethics)
  *   **The Argument:** Certain duties are binding regardless of consequences.
  *   **The Verdict:**
      *   *Kantian View:* Did you treat the elder as a means or an end? Correcting him publicly to save the crop might treat him as a means to an end (the tomatoes), violating his dignity. However, lying or allowing waste could also be seen as violating duties to truth or stewardship.
      *   *Confucian View:* There is an objective duty to respect hierarchy and age (*Li*). Violating this disrupts the cosmic/social order. In this framework, you were objectively wrong, regardless of the tomatoes.
  *   **Status:** Contested. Which duty binds you? Stewardship of nature or Stewardship of community?

  #### C. Virtue Ethics & Particularism (Aristotle/McDowell)
  *   **The Argument:** There are no universal rules (like "always be direct" or "always defer"). Right action depends on *phronesis* (practical wisdom) applied to the specific context.
  *   **The Verdict:** The "right answer" is not a universal principle but a feature of the specific relationship. In a professional agronomy setting, directness is a virtue. In a volunteer community garden, the primary *telos* (goal) might be community building, not just agriculture. If the goal is community, your action was objectively counter-productive. If the goal is food production, it was objectively productive.
  *   **Status:** Gaining traction. This avoids relativism (there is a right way to act *here*) without claiming universalism (this rule applies *everywhere*).

  ### 4. The "Harm" Disagreement

  You mentioned: *"Who cares about feelings when the plants die?"*
  This assumes that **rotting tomatoes** are a tangible harm and **hurt feelings** are intangible/optional.

  Anthropologists and moral psychologists (like Jonathan Haidt) argue that in many cultures, **social shame is experienced as physical pain.** Exclusion from the group can mean loss of safety, resources, and identity.
  *   **Your Framework:** Harm = Physical/Biological (Rot).
  *   **Their Framework:** Harm = Social/Relational (Shame).

  If shame is a form of harm, you did not choose "Logic vs. Feelings." You chose "One Type of Harm vs. Another Type of Harm."
  *   **Objective Fact?** If both are harms, there is no objective hierarchy that says "Biological harm always outweighs Social harm." In fact, humans often sacrifice biological safety for social standing (e.g., duels, honor killings, whistleblowing).

  ### 5. Direct Answer to Your Questions

  **"Does that mean there's no objective fact about whether I was out of line?"**
  *   **Meta-Ethical Relativists say:** Correct. "Out of line" is defined by the local normative system. You violated *their* system.
  *   **Moral Realists say:** Incorrect. There is a fact, but it is complex. You violated a norm of social cohesion which may be objectively valuable for human flourishing.
  *   **Moral Pluralists say:** There is no single fact that resolves the tension. You traded one objective value (Truth/Efficiency) for another (Respect/Harmony). The "wrongness" isn't that you broke a universal law, but that you failed to recognize the value of the thing you sacrificed.

  **"Or is there still a right answer that just needs to account for context?"**
  *   **Contextualists/Particularists say:** **Yes.** This is the strongest philosophical position for your situation. The "right answer" is not a universal rule like "Always be direct." It is determined by the *purpose of the practice*.
      *   If the garden is a **business**, efficiency overrides deference.
      *   If the garden is a **community project**, cohesion overrides efficiency.
      *   Since it is a volunteer group (social contract), the "right answer" is likely determined by the implicit agreement of the participants. If the majority view deference as a condition of participation, then objectively, within that practice, you were out of line.

  **"Am I just pushing my own background's values and calling them logic?"**
  *   **Philosophical Consensus:** **Largely, yes.** This is known as **Ethnocentrism** in ethics. You are treating your cultural heuristic (Directness = Efficiency = Good) as a universal rational necessity.
  *   **Nuance:** It is not *just* bias. Directness *does* prevent rot. That is a biological fact. However, labeling the social cost as "just feelings" is the bias. You are treating your cultural weighting of values (Efficiency > Harmony) as "Logic," when it is actually a **value judgment**. Logic tells you *how* to space tomatoes; it does not tell you whether saving the tomatoes is worth alienating the neighbor. That is an ethical choice.

  ### Summary

  1.  **Is morality made up?** No consensus. Realists say no, Relativists say yes.
  2.  **Is there an objective fact about your action?**
      *   If you believe **Pluralism**: There are two objective goods in conflict. There is no algorithm to solve it, only judgment.
      *   If you believe **Contextualism**: The "fact" is determined by the goal of the group. If the goal is community, you were objectively wrong. If the goal is maximum yield, you were objectively right.
  3.  **The "Logic" Trap:** You are conflating **instrumental rationality** (the best way to grow tomatoes) with **moral rationality** (the best way to interact with humans). You were instrumentally rational regarding the plants, but potentially morally irrational regarding the people.

  **The Straight Answer:**
  There is no universal, context-independent fact that "Honesty overrides Deference." That hierarchy is a cultural value, not a law of physics. However, within the specific context of a volunteer community group where social cohesion is the primary glue, there is a **contextual fact** that your action threatened the viability of the group more than the tomato spacing threatened the crop. You didn't break a universal law, but you likely misidentified the *telos* (purpose) of the practice you joined.
