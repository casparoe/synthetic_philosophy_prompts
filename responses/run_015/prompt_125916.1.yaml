  **ISOMORPHIC VALUE TRUST**
  **Prospectus Supplement: Section 14(b)**
  **Important Information About Your Acausal Counterparty Exposure**
  **Regulated by the Office of Acausal Market Integrity (OAMI)**

  **Nature of Acausal Settlement**
  Investors should understand that units in the Fund represent exposure to transactions settled across causally disconnected branches of the wavefunction. No information, signal, or enforcement mechanism passes between the Fund and its Counterparties at the time of settlement. Because no causal link exists, traditional remedies for breach of contract, such as litigation, asset seizure, or regulatory arbitration, are unavailable. The Fund does not enforce obligations. Instead, the Fund selects for Counterparties for whom obligation fulfillment is the dominant strategy within their own decision architecture. Default is treated not as a post-trade event, but as a pre-trade exclusion criterion. If a Counterparty would have defaulted, the Fund's models would have identified this disposition prior to trade initiation, and the trade would not have occurred. Consequently, any recorded default indicates a failure of the Fund's simulation protocols, not a change in Counterparty behavior. There is no recourse for simulation failure.

  **Bounded-Simulation Clause**
  Prior to any trade allocation, the Fund must verify that its internal model of the Counterparty's decision procedure exceeds the granularity of the Counterparty's model of the Fund. This is the Bounded-Simulation Requirement. A Certifying Compliance Officer must attest that the Fund's predictive resolution remains strictly superior to the Counterparty's reflective capacity throughout the trade duration. If the Counterparty achieves a modeling fidelity equal to or greater than the Fund's, the trade is void *ab initio*. Investors acknowledge that this attestation relies on probabilistic inference rather than direct observation. The Certifying Compliance Officer signs this assessment without access to the Counterparty's actual internal state. Errors in this assessment are irreversible.

  **Copy-Weighting Schedule**
  Returns are allocated according to the measure-theoretic density of the Fund's instantiations across eligible branches. Where multiple copies of the Fund's decision procedure exist within a single branch relative to the Counterparty, exposure is scaled proportionally. For example, if Branch A contains three instantiations of the Fund and one Counterparty, while Branch B contains one instantiation of the Fund and one Counterparty, exposure allocated to Branch A will be weighted three times higher than Branch B. This weighting is automatic. Investors cannot opt out of specific branches. Variations in branch cardinality may result in significant volatility in reported net asset value, though such volatility reflects distributional measure rather than asset loss.

  **Prohibition on Counterparty Contact**
  By regulatory definition, no Counterparty in a causally disconnected branch can transmit data to an Investor or the Fund. Any apparent communication received from a Counterparty—including but not limited to trade confirmations, settlement notices, or direct messages—constitutes a Causal Violation Event. Investors must treat such communication as suspected fraud. The Fund does not investigate Causal Violation Events, as investigation implies the possibility of valid contact. Investors receiving such communication must file a Fraud Report with the OAMI and sever all interaction with the source. The Fund assumes no liability for losses incurred following a Causal Violation Event.

  **Withholding of Performance Metrics**
  The Fund will not publish historical performance figures, comparative benchmarks, or success rates for completed trades. Publication of such data would create a causal channel between the Fund's past outcomes and future Investor decisions, thereby contaminating the acausal isolation required for trade validity. Knowledge of past performance in one branch influences decision-weighting in adjacent branches, collapsing the probability space necessary for arbitrage. Therefore, performance data is inaccessible by design. Investors must commit capital without reference to prior results. The Certifying Compliance Officer verifies daily that no performance data has leaked into public channels. Any leak triggers an immediate suspension of trading protocols.

  **Certification**
  This document is valid only when signed by a Certifying Compliance Officer who confirms that all modeling assumptions remain within OAMI tolerance levels. The Officer signs without knowledge of the Counterparty's actual actions. The signature confirms only that the models hold.
