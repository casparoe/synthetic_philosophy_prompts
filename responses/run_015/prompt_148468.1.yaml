prompt: |-
  I'm a journalist covering science and ideas, and I'm pitching a small research fellowhip — not a finished essay, but a proper proposal for about six months of philosophical work. The area is the experience machine and theories of well-being, but I want to move past the tired hedonism-versus-perfectionism stalemate. My half-baked idea is this: the standard experience-machine intuition might actually be three separate objections bundled together — causal disconnection from reality, modal fragility (the life wouldnt hold up in nearby worlds), and failure of narrative integration across time. If we split hedonism into synchronic hedonism, where well-being is a slice-by-slice mental-state quality, and diachronic hedonism, where well-being depends on the arc and coherence of a whole life, then each reality condition hits differently. A synchronic view can reject causal connection without obvious cost, but might still stumble over modal fragility if mental-state stability is valued. A diachronic view might absorb causal connection into its story-structure, yet reject narrative integration, which changes whether the machine is genuinely worse than reality.

  Can you turn this into a short research proposal — state the precise question, explain why current answers dont settle it, lay out the philosophical method (no surveys or neuroscience, just conceptual mapping and taxonomy), say what a result would look like and what counts as failure, and keep it realistic for one semester or a six-month writing grant? I dont need a bibliogaphy or citation list, I'll add refferences myself. Please write the answer in British English — analyse with an s, centre with an re, and so on. Also, I'm not after a sermon for or against the machine; I want the tension mapped properly, because thats where the real philosophical work is hiding.
