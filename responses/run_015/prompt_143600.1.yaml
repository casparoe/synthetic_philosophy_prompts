  5.  **Drafting the Specific Cases:**
      *   *Moratorium:* The Epicurean might struggle here because intuitively, losing 40 years *is* bad, even if you sleep through it. The Epicurean must argue that if you don't experience the loss, it's not a harm *to you* at that time, or that the "loss" is only bad if you wake up and regret it. Wait, the prompt says "no gap in memory." If I wake up and it feels like a blink, did I lose anything? The Deprivationist says yes, 40 years of goods. The Epicurean says no, because the subject persisted. *Correction:* The prompt says "dreamless suspended animation... no biological aging." This is tricky for the Epicurean. If the subject *exists* but is inactive, is it death? No. So the Epicurean might concede this is bad because the subject *survives* to lose the time. But the prompt asks: "Does the Epicurean have to say it isn't bad for you at all, since there's nobody having the experience of being suspended?" Actually, if the person wakes up, the subject *does* exist. The harm is experienced upon waking (realizing time passed). True death has no waking. I need to make sure the distinction is clear. The Epicurean should argue: In suspension, you exist, so you can be harmed by the loss *later*. In death, you don't exist, so you can't be harmed.
      *   *Interrupted Project:* This tests the "shape of a life" hypothesis. Deprivationists usually focus on quantity of goods. But maybe narrative completion matters. Epicureans don't care.

  6.  **Final Review against Constraints:**
      *   No citations? Check.
