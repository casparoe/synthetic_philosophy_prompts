  # JOINT STATEMENT ON THE BADNESS OF DEATH
  **Prepared for [Publication Name] Feature**
  **Authors: [The Symmetrist] & [The Deprivationist]**

  We have spent years arguing in print about whether death is a misfortune for the one who dies. For this collaboration, we have suspended the polemic to map the exact contour of our disagreement. We agree that the stakes are high: how we answer this determines how we grieve, how we ration medical care, and how we live. Below is the map of our common ground, our divergences, and the specific tests that might settle the matter.

  ### I. AGREED CLAIMS
  *Propositions we both accept as true.*

  1.  **The Fear is Real:** We agree that the terror of death is a pervasive human psychological fact, regardless of whether that terror is rational. [Confidence: High]
  2.  **Dying vs. Being Dead:** We agree that the *process* of dying (pain, decline, loss of agency) is bad for the subject, and that this badness is distinct from the state of *being* dead. [Confidence: High]
  3.  **Survivor Harm:** We agree that a death can be catastrophic for friends, family, and dependents, independent of whether it harms the deceased. [Confidence: High]
  4.  **Life Quality Matters:** We both owe an account of what makes a life go well. We agree that death is only problematic against a backdrop where life is generally considered a good thing to have. [Confidence: High]
  5.  **Timing of Death Matters:** We agree that dying at twenty is typically worse than dying at ninety, even if we disagree on *why* (one sees it as a greater loss of future, the other as a more untimely interruption of a narrative). [Confidence: Medium]
  6.  **Immortality is Not Obviously Good:** We agree that living forever is not necessarily desirable; an endless life could become tedious or meaningless, which limits the "loss" death imposes. [Confidence: Medium]

  ### II. TABLE OF DISAGREEMENTS
  *Core points of divergence. Each row describes the same philosophical joint, stated in the vocabulary each of us accepts.*

  | Topic | The Symmetrist's Formulation (Epicurean) | The Deprivationist's Formulation |
  | :--- | :--- | :--- |
  | **The Subject Requirement** | A harm must be experienced by, or accessible to, a subject. Since death removes the subject, there is no one to be harmed. [Confidence: High] | A harm is a comparison between how a life actually went and how it could have gone. The subject need not exist at the time of the loss for the loss to be real. [Confidence: High] |
  | **The Symmetry Claim** | Post-mortem non-existence is metaphysically identical to prenatal non-existence. If you do not regret the time before you were born, you should not fear the time after you die. [Confidence: Medium] | Post-mortem non-existence is a loss of future goods; prenatal non-existence was merely a failure to gain goods. Losing what is yours is worse than never having had it. [Confidence: High] |
  | **The Timing of Harm** | Death is never bad for the deceased. If there is no time at which the person exists and suffers the harm, the harm does not occur. [Confidence: High] | Death is bad at the times when the person would have been living well had they not died. The harm is located in the counterfactual future. [Confidence: Medium] |
  | **The Nature of "You"** | You are your conscious experience. When that stops, *you* are gone. There is no "you" to suffer the absence. [Confidence: Medium] | You are a biographical entity with a trajectory. When that trajectory is cut short, *you* are harmed, even if the biological organism has ceased. [Confidence: Medium] |

  ### III. CRUXES AND TEST CASES
  *Sub-questions where settling the fact would move at least one of us. We identify which disputes are substantive and which are verbal.*

  **Crux 1: The Definition of Harm (Verbal vs. Substantive)**
  *   **The Issue:** Is "harm" defined by a negative mental state (pain, regret) or by a negative comparative state (having less good than possible)?
  *   **Verbal Component:** High. If we define harm strictly as "felt suffering," the Symmetrist wins. If we define it as "setback to interests," the Deprivationist wins.
  *   **Substantive Component:** Medium. Does the universe care about counterfactuals? Is a life objectively worse if it is cut short, even if no one knows it was cut short?
  *   **Test Case:** *The Unaware Betrayal.* A spouse is faithfully loved their whole life, but unbeknownst to them, their partner intended to leave them the day after they die.
      *   **Symmetrist Prediction:** The deceased is not harmed. They never experienced the betrayal. [Confidence: High]
      *   **Deprivationist Prediction:** The deceased is harmed. Their life narrative was falsely constituted; their interests were set back. [Confidence: Medium]
      *   **Reader Reaction:** We predict ordinary intuition will split. If people say "that's terrible for him," they are Deprivationists. If they say "he never knew, so it doesn't matter," they are Symmetrists.

  **Crux 2: The Symmetry Intuition (Substantive)**
  *   **The Issue:** Why does the future void feel different from the past void?
  *   **Verbal Component:** Low. This is about psychological orientation, not definitions.
  *   **Substantive Component:** High. Is our preference for the future a rational requirement or a biological bias?
  *   **Test Case:** *The Time Bias.* Ask subjects if they would prefer to have had 10 years of pleasure in the past or 10 years of pleasure in the future.
      *   **Symmetrist Prediction:** Rational agents should be indifferent. The preference for the future is an irrational bias we should outgrow. [Confidence: Medium]
      *   **Deprivationist Prediction:** Rational agents should prefer the future. The past is fixed; the future is a realm of potential goods that can be lost. [Confidence: High]

  **Crux 3: The Moratorium (Specific Case)**
  *   **The Case:** A safe procedure puts you into dreamless suspended animation for forty years. You wake with no biological aging, no gap in memory (it feels like a blink), and you return to your life.
  *   **The Question:** Is this bad for you?
  *   **Symmetrist Prediction:** It is not bad *during* the suspension, because there is no subject experiencing the loss. It is only bad if, upon waking, you regret the lost time. If you wake up happy, no harm was done. [Confidence: Medium]
  *   **Deprivationist Prediction:** It is objectively bad. You have lost forty years of possible goods (relationships, achievements, experiences), regardless of whether you subjectively feel the loss upon waking. [Confidence: High]
  *   **Reader Reaction:** We predict most people will say, "That's a tragedy, forty years gone!" If they do, they side with the Deprivationist. If they say, "As long as I wake up fine, it doesn't matter," they side with the Symmetrist.
  *   **The Wriggle Room:** The Symmetrist can argue this isn't death because the subject *survives* to register the loss. The Deprivationist must argue that the loss is real even if the subject doesn't feel it.

  **Crux 4: The Interrupted Project (Specific Case)**
  *   **The Case:** Two people lose the same twenty years of future goods (same health, pleasure, relationships). Person A dies with a novel half-written and a child halfway raised. Person B dies having just finished the novel and secured the child's independence.
  *   **The Question:** Is Person A's death worse than Person B's?
  *   **Symmetrist Prediction:** No. Neither is harmed by death. The "completeness" matters only to the survivors or for the aesthetic value of the biography, not for the deceased. [Confidence: High]
  *   **Deprivationist Prediction:** Possibly yes. If "narrative completion" is a good, then Person A loses that good while Person B does not. The badness of death depends on the shape of the life, not just the quantity of goods. [Confidence: Medium]
  *   **Reader Reaction:** We predict readers will say Person A's death is more tragic. This suggests people value "narrative closure" as an intrinsic good, which complicates the simple Deprivationist math of "years lost."

  ### IV. CLINICAL ADVICE
  *What each of us would say to a patient handed a terminal diagnosis this morning.*

  **The Symmetrist:** "Do not fear the state of being dead. It will be exactly like the time before you were born, which did not trouble you. Your fear is likely about the process of dying, which we can manage, or about leaving others behind, which is a love you feel now, not a pain you will feel later. When you are dead, you will not know you are dead. You are safe from that."

  **The Deprivationist:** "This is a genuine tragedy. It is not just a biological end; it is the cancellation of a future that belonged to you. It is right to grieve the loss of the experiences, relationships, and projects you will not have. Your anger is rational because you are being deprived of goods you would have otherwise enjoyed. We should focus on making the time you have as rich as possible to offset the loss."

  ### V. HOUSEKEEPING AND CONFESSIONS

  **Confidence Tags:**
  Throughout this document, we have tagged claims where the philosophical literature is deeply divided or where our own conviction wavers under pressure. Claims tagged [Confidence: Medium] are those we hold but acknowledge are vulnerable to the specific test cases listed above.

  **The Least Defensible Line:**
  If a hostile philosopher called us tomorrow, the line we would least want to have to defend is in the Table of Disagreements, under The Symmetrist's Formulation of The Symmetry Claim: *"Post-mortem non-existence is metaphysically identical to prenatal non-existence."*
  **Reason:** While logically clean, it ignores the directional flow of causation and desire. We care about the future because our desires project forward. Claiming these states are *identical* requires ignoring the psychological reality that we are beings who strive toward futures, not pasts. It is the strongest rhetorical point for our side, but the weakest metaphysical one.

  ***

  **Signed,**
  **[The Symmetrist]**
  **[The Deprivationist]**
