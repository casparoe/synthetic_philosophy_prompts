      *   *Refining the Rapa Nui point:* The user says "Epistemic closure around tree use... but then society pivots." This implies the closure *ended*. So the collapse was the *end of the closure*. This is a nuanced point to highlight. The "Collapse" was the breaking of the epistemic lock, not the death of the people.
