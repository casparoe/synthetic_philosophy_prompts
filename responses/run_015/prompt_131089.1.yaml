  ### (c) Settling the Issue
  If people who learn S's structure feel a specific kind of alienation, that **is evidence**, but not proof. In meta-ethics (specifically Strawsonian reactive attitudes), our shared emotional responses to character structures *help constitute* moral facts. However, it could also be a "yuck factor" bias against cold rationality. To settle it, you would need to determine if that alienation tracks with a *harm* (e.g., does S's structure make her incapable of certain moral goods like forgiveness or grief?) or if it is merely an aesthetic preference for "warmth." If S cannot genuinely grieve a loss because it doesn't fit the utility calculus, the alienation is evidence of a moral lack. If she can grieve, the alienation is likely just our bias.
