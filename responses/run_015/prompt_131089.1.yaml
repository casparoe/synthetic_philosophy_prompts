  My number is most sensitive to **Constitutive Motives**. If you shift from the view that "character constitutes goodness" to "outcomes constitute goodness," my credence in a moral lack drops from 0.43 to nearly 0.05. The entire case hinges on whether morality evaluates the *agent* or the *world*. S saves the world; the question is whether she saves herself.

