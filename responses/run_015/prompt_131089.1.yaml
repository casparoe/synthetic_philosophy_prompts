  Given all that, I want a number: what's your credence that there is still something morally lacking in S — i.e., that a morally ideal person has to have at least some concerns she values for their own sake, not merely as instruments of effectiveness? I'm around 0.5, my housemate is at 0.15, and I genuinely can't locate where we split.

  Decompose it for me rather than just answering. The pieces I keep circling:

  - whether moral goodness is a function of what you produce or of how your motives and concerns are structured — is valuing things non-instrumentally partly constitutive of being a good person, or just one common route to it?
  - whether S's loves are even genuine given that they're conditional: she's disposed to drop the chamber music the moment the evidence says it stops paying off. Is that disposition the signature of fake valuing, or just of being responsive to reasons?
  - whether the boringness complaint was ever really about boringness, or was always secretly about this motivational structure — and whether it should matter at all that S is neither boring nor self-denying
  - how much of your number is just the suspicion that this is a verbal dispute about what ideal or good person means, with no fact of the matter underneath
  - how load-bearing my stipulations are: if the effectiveness payoff couldn't be known in advance, or if her friends would be creeped out if they found out, does your number move, and by how much

  Give a rough probability and one line of justification for each term, tell me how they combine into your headline number, then tell me (a) which single term your number is most sensitive to, (b) which one you'd guess me and my housemate actually disagree about, and (c) what would even count as settling this — e.g., if it turned out that people who learn S's structure feel a specific kind of alienation that isn't just snobbery about authenticity, is that evidence, or just a fact about our reactions?
