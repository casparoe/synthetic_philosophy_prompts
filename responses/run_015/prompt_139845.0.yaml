          4.  Conflict Analysis (Unsatisfiable sets).
          5.  Scorecard.

      *(Self-Correction during drafting)*: Make sure I explicitly answer the "One Theory for Four Questions" prompt. I will argue that for the *institutional purpose*, Causal and Normative must be unified, while Predictive is a baseline and Metaphysical Truth is secondary.
      *(Self-Correction on Indexing)*: Don't call it relativism. Call it *Epistemic Contextualism*.
      *(Self-Correction on Cases)*: Ensure the desiderata explicitly handle (a), (b), and (c).

  9.  **Final Review against Constraints:**

      *   Did I fix the purpose? Yes (Hospital Board).
      *   Did I list desiderata? Yes.
