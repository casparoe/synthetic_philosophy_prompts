  10. **Final Polish:** Ensure the distinction between "Realist Prejudice" and "Instrumentalist Prejudice" is clear in the markings. (e.g., demanding internal structure is realist; demanding predictive success is instrumentalist).

      *Wait, one nuance:* The prompt asks "whether one and the same set of criteria should govern all four." I need to take a stand. I will argue that for the *institutional* purpose, Causal and Normative criteria must converge, but Predictive criteria are insufficient. Metaphysical Truth is the outlier.

      *Let's refine the "Drop" recommendation.* If the purpose is institutional, "Literal Truth" (metaphysical) is the one to drop. We care about *accurate functional description*, not ontological status.

      *Let's refine the "Knockout".* The "Action-Guidance" (Intervention) requirement knocks out pure instrumentalism (which doesn't care *how* the prediction works) and pure metaphysics (which doesn't care if we can intervene).

