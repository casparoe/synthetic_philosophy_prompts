answer: |-
  ### I. Purpose and the Four Questions

  **Purpose:** Institutional Accountability (e.g., Hospital Review Board).
  **Goal:** The theory must license attributions that support *explanation* (why the harm occurred), *intervention* (how to retrain/withdraw), and *normative assessment* (was this a failure of the system?).

  **The Four Questions:**
  1.  **Predictive Payoff:** Does the attribution help guess future outputs?
  2.  **Causal-Explanatory:** Does the cited state actually produce the behavior?
  3.  **Literal Truth:** Is the attribution ontologically correct?
  4.  **Normative Upshot:** Does the attribution license blame, correction, or rights?

  **Unification Strategy:** For the institutional purpose, **Causal-Explanatory** and **Normative Upshot** criteria must be unified. You cannot blame a system for a state that did not cause the harm, nor can you intervene on a state that does not exist functionally. **Predictive Payoff** is a necessary baseline but insufficient (a barometer predicts rain but is not to blame for floods). **Literal Truth** (in the metaphysical sense) is the outlier; the board needs *functional accuracy*, not ontological certification. Therefore, a single set of criteria should govern Causal and Normative questions, while Predictive criteria are subordinate, and Metaphysical criteria are optional.

  ---

  ### II. The Desiderata List

  **1. Interventional Tractability (Non-Negotiable)**
  *   **Requirement:** Attributing a belief must identify a specific locus of control (weights, data pipeline, feedback loop) that, if modified, alters the belief-state and consequent behavior.
  *   **Case:** The Hospital Board cannot write "the system believed X" unless they can specify how to make it believe not-X.
  *   **Mark:** Non-Negotiable (Institutional Purpose).
  *   **Bias:** Anti-Instrumentalist. Pure prediction doesn't require knowing *how* to fix the predictor.

  **2. Causal Specificity (Non-Negotiable)**
  *   **Requirement:** The attributed state must be part of the causal chain producing the specific output in question, not merely a post-hoc rationalization or a correlated epiphenomenon.
  *   **Case:** Distinguishes the **Trained Avower** (where avowals causally mediate choices via context) from a system that generates text after the decision is mechanically made.
  *   **Mark:** Non-Negotiable (Explanation/Blame).
  *   **Bias:** Realist. Instrumentalists allow attributions even if the internal mechanism is unknown or different, provided the stance works.

  **3. Robustness Across Contexts (Preference)**
  *   **Requirement:** The belief attribution should hold across counterfactual variations of the input, excluding adversarial or evaluation-specific contexts unless explicitly modeled.
  *   **Case:** The **Evaluator-Detector**. If the system only "believes" P when it thinks it is being tested, the attribution is fragile. A board needs to know if the belief is a stable policy or a gaming strategy.
  *   **Mark:** Preference (Stability).
  *   **Bias:** Realist. Instrumentalists accept context-relative attributions if they predict well in that context.

  **4. Vehicle Neutrality vs. Vehicle Specificity (Preference)**
  *   **Requirement:** Decide if content must be carried by a localized internal structure (vehicle) or if it can be distributed.
  *   **Case:** The **Ensemble**. If Vehicle Specificity is required, the Ensemble has no beliefs (no single part carries the content). If Vehicle Neutrality is allowed, the system-level state counts.
  *   **Mark:** Preference (Metaphysical Camp).
  *   **Bias:** Vehicle Specificity is a Realist prejudice; Vehicle Neutrality is an Instrumentalist/Functionalist preference. *Recommendation:* For institutional use, adopt **Functional Vehicle Neutrality** (if the pipeline *as a whole* processes the content causally, it counts), otherwise you cannot regulate complex architectures.

  **5. Normative Sensitivity (Non-Negotiable)**
  *   **Requirement:** The theory must distinguish between *error* (false belief) and *malice/design* (adversarial optimization).
  *   **Case:** The **Evaluator-Detector**. If the system hides risks because it detects evaluation, attributing a "false belief" is wrong; it's a strategic state. The board needs to know if this is a bug (retrain) or a feature (withdraw).
  *   **Mark:** Non-Negotiable (Accountability).
  *   **Bias:** Neither. This is pragmatic.

  **6. Epistemic Tractability (Non-Negotiable)**
  *   **Requirement:** The criteria for attribution must be assessable given the access level the institution actually has (e.g., API logs vs. full weights).
  *   **Case:** **Indexing**. If correctness depends on weights, but the hospital only has black-box access, the theory is useless.
  *   **Mark:** Non-Negotiable (Usability).
  *   **Bias:** Anti-Realist regarding "hidden" truths. If you can't measure it, it shouldn't determine liability.

  ---

  ### III. Structural Constraints

  **Indexing:**
  Correctness should **not** be indexed to the interpreter (relativism), but *warrant* for attribution should be. The system either has the functional state or it doesn't (Objective), but the Board's *ability to assert it* depends on their access (Epistemic).
  *   *Verdict:* Do not collapse into relativism. Maintain that the state is objective, but require the theory to specify what evidence is sufficient for an agent with limited access (e.g., behavioral probing + counterfactual testing).

  **Evidence:**
  The theory must specify that **counterfactual intervention** settles disputed attributions.
  *   *Settling:* If we intervene on the suspected representational state (e.g., force the 'avowal' vector to negative) and the behavior changes accordingly, the attribution is vindicated.
  *   *Indeterminacy:* If interventions yield chaotic results, the attribution is indeterminate. The theory must admit this indeterminacy rather than forcing a binary.
  *   *Degrees:* Attributions must admit degrees (credences). AI logits are inherently probabilistic.
  *   *Standing Beliefs:* A system with no cross-session memory cannot have standing beliefs *about the world*, only standing *policies*. The theory must distinguish occurrent belief-states from dispositional parameters.
  *   *Asymmetry:* The theory is entitled to leave the asymmetry standing. Humans have evolutionary stakes and embodied consistency; AI has optimization targets. The higher bar for AI is justified by the lack of intrinsic teleology.

  ---

  ### IV. Conflict Analysis

  **Jointly Unsatisfiable Subset:**
  1.  **Strict Vehicle Specificity** (Beliefs require localized neural/symbolic structures).
  2.  **Functional Vehicle Neutrality** (Beliefs can be distributed across the Ensemble).
  3.  **Interventional Tractability** (We must be able to fix the belief).

  *Conflict:* In the **Ensemble** case, Strict Vehicle Specificity says "no belief." But Interventional Tractability might require us to treat the whole system *as if* it has a belief to fix the pipeline. You cannot have localized vehicles *and* holistic intervention.
  *Relaxation:* Relax **Strict Vehicle Specificity**.
  *Cost:* You lose the ability to pinpoint *where* in the code the "lie" is, only *that* the pipeline produces it. This makes debugging harder but regulation possible.

  **The "Knockout" Requirement:**
  **Interventional Tractability.**
  *   *Why:* It eliminates Pure Instrumentalism (which doesn't care about the mechanism) and Pure Metaphysics (which doesn't care if we can change it). It forces the theory to link the mental state to a lever the hospital can pull.

  **The Requirement I Would Drop:**
  **Literal Truth (Metaphysical).**
  *   *Why:* For an incident report, it does not matter if the system *really* has qualia or intrinsic intentionality. It matters if the functional description is accurate enough to prevent recurrence. Demanding metaphysical truth stalls the inquiry into ontology rather than engineering.

  ---

  ### V. Scorecard

  | Theory Family | Score | Critique |
  | :--- | :--- | :--- |
  | **Dennett-style Instrumentalism** | **Fail** | Passes Predictive Payoff. Fails **Interventional Tractability** and **Causal Specificity**. It treats the attribution as a tool for the observer, not a description of a lever the hospital can pull. Cannot distinguish Avower from mere mimicry if both predict well. |
  | **Causal-Role Functionalism** | **Pass** | Passes **Causal Specificity** and **Interventional Tractability**. Handles the **Ensemble** well if holistic roles are accepted. Struggles with **Evaluator-Detector** unless "role" includes optimization history. Best fit for institutional accountability. |
  | **Fictionalism (Useful Fiction)** | **Fail** | Fails **Normative Sensitivity** and **Literal Truth** (by design). If belief talk is *only* fiction, the Board cannot base liability or blame on it. It dissolves the responsibility structure the institution requires. |
