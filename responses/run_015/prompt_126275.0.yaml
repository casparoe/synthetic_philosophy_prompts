          1.  **Direct Answer:** It's not garbage. It's a solid philosophical intuition.
          2.  **Strengths:** Highlight what works (the shift from outcome to agency, the shareholder analogy).
          3.  **Weak Spots/Challenges:**
              *   *Causal Efficacy:* The biggest hole. If your vote doesn't change the result, did you authorize anything?
              *   *The "Clean Hands" Counter:* Abstaining isn't neutral.
              *   *The Fascism/Emergency Exception:* How to handle this without breaking the rule.
          4.  **Refining the Framework:** Suggest tweaks (e.g., "Complicity vs. Causation," "Thresholds").
          5.  **Ranked Choice:** Briefly address the mechanics.
          6.  **Conclusion:** Encouragement.

  5.  **Refining the Content (Self-Correction during drafting):**
