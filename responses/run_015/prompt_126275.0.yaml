      *   *Alternative Framing:* Instead of "Dirty Hands," maybe focus on "Thresholds of Tolerance." Or distinguish between *endorsing* harm vs. *tolerating* harm to prevent catastrophe.
      *   *The Shareholder Analogy:* I need to point out that shareholders usually *gain* financially. Voters might vote for the lesser evil *despite* personal cost. This weakens the analogy slightly but doesn't break it.
