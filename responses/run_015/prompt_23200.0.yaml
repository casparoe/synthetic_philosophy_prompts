prompt: |-
  Please argue that the supervaluationist's standard reply to the objection that each precisification of a vague predicate has a sharp boundary, and so supervaluationism is committed to many sharp boundaries — namely, that the precisifications are a mere modeling device and not candidates for the predicate's genuine extension — does not dissolve the objection but only defers it to the level of the set of admissible precisifications, and that the supervaluationist is thereby committed to an epistemicist position at that higher level.
reasoning: |-
  Here's a thinking process that leads to the argument above:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** Supervaluationism (a theory of vagueness).
      *   **Objection:** Supervaluationism implies sharp boundaries at the level of precisifications (each precisification is classical, hence sharp).
      *   **Standard Reply:** Precisifications are just modeling tools/fictions, not the *real* extension of the predicate.
      *   **Task:** Argue that this reply *fails* to dissolve the objection. Instead, it *defers* the problem to the set of admissible precisifications.
      *   **Conclusion:** Consequently, the supervaluationist is committed to an *epistemicist* position at this higher level (there is a sharp, perhaps unknowable, boundary to the set of admissible precisifications).

  2.  **Understand the Core Concepts:**
      *   **Vagueness:** Sorites paradox, borderline cases (e.g., "heap," "bald").
      *   **Supervaluationism:** A statement is super-true if true on all admissible precisifications; super-false if false on all; indeterminate otherwise. It preserves classical logic (e.g., Excluded Middle holds: "Either $n$ is a heap or $n$ is not a heap" is true, even if we don't know which).
      *   **The "Sharp Boundary" Objection:** To define "admissible precisifications," you need a set. Each precisification draws a sharp line (e.g., 500 grains = heap, 499 = not). If there's a set of *admissible* ones, there must be a boundary between admissible and inadmissible. Isn't *that* sharp?
      *   **The Standard Reply:** "Don't take the precisifications literally. They are heuristic devices to model truth conditions. The *real* semantics is the supervaluation, not the subvaluations."
      *   **Epistemicism:** Vagueness is ignorance. There *is* a sharp boundary in reality, we just don't know it.
      *   **The Goal:** Show that by pushing the reality to the "set of admissible precisifications," the supervaluationist makes *that set* have a sharp boundary, which looks exactly like epistemicism.

  3.  **Drafting the Argument - Step-by-Step:**

      *   **Introduction:**
          *   Define Supervaluationism briefly.
          *   State the classic objection (higher-order vagueness/sharp boundaries of precisifications).
          *   State the standard reply (instrumentalism about precisifications).
          *   Thesis: This reply fails; it shifts the sharpness to the meta-level, forcing epistemicism about admissibility.

      *   **Section 1: The Objection and the Reply.**
          *   Explain why precisifications seem to have sharp boundaries (they are classical valuations).
          *   Explain the supervaluationist's defense: Precisifications aren't real; they are a formal tool to define "supertruth." The *only* real property is supertruth.

      *   **Section 2: The Deferral Problem (The Core Argument).**
          *   If precisifications are just tools, what determines which tools are *admissible*?
          *   There must be a constraint on the set $P$ of admissible precisifications.
          *   Consider a Sorites series. $P$ includes some cut-off points and excludes others.
          *   Example: Is a precisification that cuts off at 10 grains admissible? No. At 10,000? No. At 5,000? Yes.
          *   Therefore, there is a transition from admissible to inadmissible.
          *   Is *this* transition vague?
              *   If yes (vague admissibility), we need "super-admissibility," leading to regress.
              *   If no (sharp admissibility), then there is a sharp boundary in the model.

      *   **Section 3: Why the Reply Doesn't Work.**
          *   The supervaluationist says, "The sharpness of the precisification doesn't matter because the precisification isn't real."
          *   Counter: But the *set* of precisifications *is* doing the semantic work. It defines truth.
          *   If the set $P$ has a sharp boundary (between admissible and inadmissible), then the semantics relies on a sharp distinction.
          *   Even if we call $P$ a "model," the model must accurately reflect the semantic facts. If the model requires a sharp boundary to function, the semantic facts must support that sharp boundary.

      *   **Section 4: Commitment to Epistemicism.**
          *   If there is a sharp boundary to admissibility, is it knowable?
          *   Usually, supervaluationists say we can't know where the boundary is (because it varies across precisifications).
          *   But at the level of *admissibility*, if the boundary is sharp, our inability to locate it is ignorance.
          *   This matches the definition of Epistemicism (sharp boundary + ignorance).
          *   Therefore, Supervaluationism collapses into Epistemicism at the meta-level.

      *   **Section 5: Addressing Potential Counter-arguments (Steel-manning).**
