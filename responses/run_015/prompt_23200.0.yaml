answer: |-
  The following argument contends that the supervaluationist's standard instrumentalist reply to the "sharp boundaries" objection fails to eliminate the commitment to sharpness. Instead, it relocates the commitment from the object level (the extension of vague predicates) to the meta-level (the set of admissible precisifications), thereby forcing the supervaluationist into a position structurally identical to epistemicism.

  ### 1. The Dialectic: Objection and Reply

  To understand the force of the objection, we must first outline the supervaluationist framework. Supervaluationism attempts to preserve classical logic while accounting for vagueness. It posits that a vague predicate (e.g., "is tall") does not have a single extension but is compatible with many "admissible precisifications." Each precisification is a classical valuation that draws a sharp line between the extension and anti-extension of the predicate. A sentence is "super-true" if it is true on all admissible precisifications.

  **The Objection:** Critics argue that this framework is self-defeating. While it claims to avoid sharp boundaries in the world, every individual precisification *must* have a sharp boundary (e.g., exactly 180cm is tall, 179.9cm is not). If the theory relies on these precisifications to define truth, it seems committed to the existence of these sharp boundaries, merely multiplying them rather than eliminating them.

  **The Standard Reply:** The supervaluationist responds by adopting an instrumentalist stance toward precisifications. They argue that precisifications are not ontological candidates for the predicate's genuine extension. They are merely formal modeling devices used to define the notion of "supertruth." The only genuine semantic property is supertruth; the sharp boundaries within the model are artifacts of the classical logic used to construct the model, not features of reality.

  ### 2. The Deferral of Sharpness

  The instrumentalist reply succeeds only if the "sharpness" remains contained within the model without imposing constraints on the model itself that reflect back onto reality. However, for the model to be a correct model of vagueness, the constraints governing the model must themselves be accurate.

  The crucial component of the supervaluationist model is the set of **admissible precisifications**. Not every classical sharpening is admissible. A precisification that classifies a 7-foot man as "not tall" is inadmissible because it violates the meaning of the word. A precisification that classifies a 5-foot man as "tall" is similarly inadmissible.

  Here lies the deferral. The supervaluationist claims the boundary *within* a precisification is not real. But what about the boundary *of* the set of admissible precisifications?

  Consider a Sorites series of grain counts for "heap."
  1.  There are precisifications that draw the line at 10,000 grains (clearly admissible).
  2.  There are precisifications that draw the line at 10 grains (clearly inadmissible).
  3.  Between these extremes lies the transition zone.

  For the set of admissible precisifications to be well-defined (which it must be to determine supertruth), there must be a fact of the matter regarding whether a specific precisification is included in the set or excluded from it. If a precisification draws the line at $n$ grains, is it admissible? If yes, is a precisification drawing the line at $n-1$ admissible?

  If the supervaluationist insists that the boundary between *admissible* and *inadmissible* precisifications is itself vague, they trigger a regress. They would need a "supervaluation over sets of precisifications" to define admissibility, which requires a further set of "super-admissible" sets, and so on *ad infinitum*. To stop the regress and provide a working semantics, the supervaluationist must eventually posit a fixed set of admissible precisifications.

  Consequently, there must be a sharp boundary between the last admissible precisification and the first inadmissible one (or, more accurately, a sharp boundary in the space of possible cut-offs that delineates the admissible region). By claiming the object-level sharpness is merely a modeling artifact, the supervaluationist has not eliminated sharpness; they have deferred it to the meta-level boundary of the model's domain.

  ### 3. The Collapse into Meta-Epistemicism

  Once we accept that there is a sharp boundary to the set of admissible precisifications, we must ask about our epistemic relation to that boundary.

  Epistemicism is defined by two conjuncts:
  1.  **Metaphysical:** There is a sharp boundary to the extension of vague predicates.
  2.  **Epistemic:** We cannot know where this boundary is.

  The supervaluationist attempts to deny (1) at the object level. However, by accepting a sharp boundary at the level of admissibility, they accept a version of (1) at the meta-level. The question is whether they can avoid (2).

  Can the supervaluationist know exactly which precisifications are admissible?
  If they claim **yes**, they face an absurdity. It would imply we can know exactly which cut-offs are permissible for vague terms, which contradicts the phenomenological data of vagueness (we cannot pinpoint the cutoff).
  If they claim **no**, they admit that while there is a sharp boundary to admissibility, it is unknowable.

  This is precisely the epistemicist position, merely transposed.
  *   **The Epistemicist says:** There is a sharp cut-off for "heap" (e.g., 5,432 grains), but we cannot know it.
  *   **The Supervaluationist (on this reading) says:** There is a sharp cut-off for "admissible precisifications of heap" (e.g., precisifications cutting off before 5,432 are inadmissible), but we cannot know it.

  The semantic work done by the "sharp boundary of admissibility" is identical to the semantic work done by the "sharp boundary of extension." In both cases, truth conditions rely on a precise threshold that is inaccessible to speakers. By retreating to the claim that precisifications are "mere modeling devices," the supervaluationist attempts to ontologically downgrade the sharp boundary. However, if the model is to be truth-apt, the constraints on the model must track reality. If the constraint is sharp, the reality governing that constraint is sharp.

  ### 4. The Failure of the "Mere Device" Defense

  The supervaluationist might protest that because precisifications are fictions, the sharpness of their boundaries is also fictional, and thus the sharpness of the set of admissible fictions is harmless.

  This defense fails because the set of admissible precisifications is not treated as a fiction; it is treated as the **truth-maker** for supertruth claims. When a supervaluationist asserts, "It is super-true that this man is tall," they are asserting a fact about the world (or at least about language use) that relies on the universal quantification over the set of admissible precisifications.

  If the quantification range (the set of admissible precisifications) has a sharp boundary, then the truth conditions of the statement rely on a sharp distinction. To say "This distinction is only in the model" is to say "The truth conditions of our language are determined by a model with sharp boundaries." If the model accurately captures the semantics of vague language, then the semantics of vague language involves sharp boundaries.

  Therefore, the instrumentalist move does not dissolve the commitment to sharpness; it obscures it. It asks us to ignore the sharpness of the precisifications by focusing on the supervaluation, but then asks us to accept the supervaluation as the true semantics, which is grounded in a sharply bounded set of precisifications.

  ### 5. Conclusion

  The supervaluationist's standard reply attempts to treat precisifications as heuristic tools to avoid the charge that they posit sharp boundaries in reality. However, for these tools to function semantically, the criteria for their admissibility must be fixed. This fixes a sharp boundary at the meta-level between admissible and inadmissible precisifications.

  Since the supervaluationist typically maintains that we cannot identify this boundary (as doing so would resolve vagueness), they are committed to the view that there is a sharp, unknowable boundary governing the semantics of vague predicates. This is not a dissolution of the sharp-boundary objection, but a relocation of it. Ultimately, supervaluationism does not escape epistemicism; it merely becomes epistemicism about admissibility rather than epistemicism about extension.
