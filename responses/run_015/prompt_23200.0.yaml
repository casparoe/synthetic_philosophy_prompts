          *   *Objection:* "Contextualism."
          *   *Rebuttal:* Context shifts the boundary, but within a context, the boundary is fixed. The objection holds for a fixed context.

      *   **Conclusion:**
          *   Summarize. The instrumentalist move saves the object level but sacrifices the meta level.
          *   The cost is accepting a sharp, likely unknowable boundary to admissibility.
          *   This is epistemicism in disguise.

  4.  **Refining the Tone and Logic:**
      *   Ensure the distinction between *object-level* sharpness (within a precisification) and *meta-level* sharpness (the boundary of the set of precisifications) is clear.
      *   Use standard terminology (admissible precisifications, supertruth, higher-order vagueness).
