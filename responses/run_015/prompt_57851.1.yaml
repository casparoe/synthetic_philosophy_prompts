answer: |-
  # Teaching Plan: Weakness of Will and Hyperbolic Discounting
  **Duration:** 50 minutes
  **Audience:** First-year undergraduates (no prior background)
  **Central Case:** 'Elena', a doctoral student.

  ## 1. Pedagogical Sequence and Dependencies

  You must adhere to the following order. Each stage provides the conceptual vocabulary required for the next. Do not deviate, as introducing the economic model before establishing the philosophical puzzle will cause students to view the behaviour as merely 'irrational' rather than 'paradoxical'.

  **Phase 1: The Phenomenon (0–10 minutes)**
  *   **Action:** Introduce Elena. Describe her situation: she sincerely judges that writing her dissertation chapter tonight is better on the whole than streaming a series. She resolves to work. At 9 p.m., she streams the series. Crucially, establish that *while streaming*, she still believes writing would have been better.
  *   **Dependency:** You must establish the *sincerity* of her judgment and the *persistence* of that judgment during the action. Without this, you cannot distinguish weakness of will from simply changing one's mind.
  *   **Goal:** Students must recognise this as a coherent description of human experience before labelling it.

  **Phase 2: The Philosophical Puzzle (10–20 minutes)**
  *   **Action:** Label this 'Weakness of Will' (or *Akrasia*). Pose the problem: If agents act to pursue what they judge best, how can Elena intentionally do what she judges worse?
  *   **Dependency:** This depends on Phase 1. If students think Elena changed her mind (i.e., at 9 p.m. she decided streaming was actually better), the puzzle vanishes. You must secure the agreement that her values remained constant even as her actions shifted.
  *   **Goal:** Create cognitive dissonance. Students should feel the tension between 'rational action' and 'observed behaviour'.

  **Phase 3: The Economic Model (20–35 minutes)**
  *   **Action:** Introduce 'Hyperbolic Discounting'. Contrast it briefly with 'Exponential Discounting' (standard rational choice). Use Elena's pattern over several weeks: she consistently delays work until the deadline is imminent, at which point she works.
  *   **Dependency:** This depends on Phase 2. The model is offered as a dissolution of the puzzle. It explains *how* the valuation shifts without requiring a change in fundamental values.
  *   **Goal:** Show that the 'value' of the reward (relief of finishing vs. pleasure of streaming) changes based on temporal proximity, not just objective worth.

  **Phase 4: Synthesis and Implications (35–45 minutes)**
  *   **Action:** Map the model back onto the philosophy. Does this mean Elena isn't weak-willed, just miscalibrated? Or is this what weakness of will *is*?
  *   **Dependency:** Depends on Phase 3. You cannot discuss the implications of the model without first defining the model.
  *   **Goal:** Move from description to interpretation.

  **Phase 5: Check for Understanding and Wrap-up (45–50 minutes)**
  *   **Action:** Administer the diagnostic task (detailed below) and outline limitations.
  *   **Dependency:** Depends on all previous phases.
  *   **Goal:** Verify learning and set boundaries.

  ---

  ## 2. The Central Case: Elena

  You will use no other examples. All abstract concepts must be anchored to Elena's situation.

  **Required Features:**
  1.  **Simultaneous Endorsement:** It must be explicit that at 9 p.m., while clicking 'play' on the series, Elena thinks, 'I ought to be writing.' This is the non-negotiable condition for weakness of will.
  2.  **Time Inconsistency:** The case must specify that four weeks ago, Elena preferred writing next Tuesday over streaming next Tuesday. But when Tuesday arrived (today), she preferred streaming. This specific reversal is the evidence for hyperbolic discounting.
  3.  **The Deadline Effect:** Mention that when the submission deadline is one day away, Elena *does* work. This proves she values the dissertation; the preference reversal is driven by time, not a lack of care.

  **Complications to Avoid:**
  1.  **Ignorance:** Do not suggest Elena forgets she has a deadline. Weakness of will requires knowledge of the better course.
  2.  **External Coercion:** Do not imply her internet was cut off or she was forced to watch TV. The choice must be voluntary.
  3.  **Moralising:** Avoid describing Elena as 'lazy' or 'immoral'. Keep the description neutral and structural. We are analysing the mechanism of choice, not assigning blame.

  ---

  ## 3. Misconceptions and Intervention Points

  Students will bring intuitive but incorrect assumptions. You must pre-empt these at the specific moments indicated.

  **Misconception 1: 'She just changed her mind.'**
  *   **The Error:** Students will assume that if she chose streaming, she must have decided streaming was better at that moment.
  *   **Intervention Point:** **End of Phase 1.**
  *   **Correction:** Explicitly ask: 'Did Elena decide streaming was more valuable for her life goals?' Elicit the answer 'No'. Emphasise that she acted *against* her current ranking of values.

  **Misconception 2: 'This is just exponential discounting.'**
  *   **The Error:** Students may think valuing the present more than the future is always rational (standard discounting).
  *   **Intervention Point:** **Start of Phase 3.**
  *   **Correction:** Distinguish between *consistent* impatience (valuing today over tomorrow by a fixed % always) and *inconsistent* impatience (valuing today over tomorrow much more than you valued next week over next week + 1 day). Use Elena's plan from four weeks ago to prove the inconsistency.

  **Misconception 3: 'Hyperbolic means random.'**
  *   **The Error:** Students may interpret 'hyperbolic' as unpredictable behaviour.
  *   **Intervention Point:** **Middle of Phase 3.**
  *   **Correction:** When describing the curve, emphasise that it is a *systematic* pattern. Elena is predictably unreliable. The 'curve' is steep near the present and flat in the future.

  **Misconception 4: 'The model excuses the behaviour.'**
  *   **The Error:** Students may conclude that because there is a psychological mechanism, Elena bears no responsibility.
  *   **Intervention Point:** **Phase 5 (Wrap-up).**
  *   **Correction:** Clarify that explaining a cause is not the same as absolving agency. Leave this as an open question, but ensure they do not treat the economic model as a 'get out of jail free' card.

  ---

  ## 4. Check for Understanding

  To verify that students grasp the distinction between standard rational choice and hyperbolic discounting, present the following scenario on the board or handout at the **45-minute mark**. Do not allow discussion; ask for a show of hands or a quick written response.

  **The Task:**
  > 'Imagine Elena is asked on 1st October whether she prefers to write on 1st November or stream on 1st November. She chooses to write.
  >
  > Now imagine it is 1st November. She is asked whether she prefers to write *today* or stream *today*.
  >
  > **Question:** If Elena exhibits **Exponential Discounting** (standard rationality), what should she choose today? If she exhibits **Hyperbolic Discounting** (weakness of will), what does she choose today?'

  **Correct Response:**
  *   **Exponential:** She chooses to write (her preferences remain consistent over time).
  *   **Hyperbolic:** She chooses to stream (her preference reverses as the immediate reward becomes available).

  **Rationale:** This tests whether they understand that the core of the issue is *preference reversal* driven by temporal proximity, not just 'choosing the fun thing'.

  ---

  ## 5. What to Openly Leave Out

  To maintain clarity within fifty minutes, you must explicitly state what you are *not* covering. This prevents students from assuming the model is exhaustive.

  1.  **Neuroscience:** Do not discuss dopamine systems, the prefrontal cortex, or the 'limbic system'. While relevant, this shifts the focus from philosophical action theory to biology. State: 'We are looking at the structure of choice, not the brain chemistry.'
  2.  **The Davidsonian Paradox:** Do not introduce Donald Davidson's specific logical formulation of akrasia. It is too technical for this level. State: 'There are complex logical debates about whether this action is truly intentional, but we are treating it as a given phenomenon.'
  3.  **Commitment Devices:** Do not spend time on solutions (e.g., Elena blocking her internet). Focus on the *explanation* of the problem. You may mention them in passing as a response to hyperbolic discounting, but do not analyse them.
  4.  **Moral Responsibility:** Do not attempt to solve whether Elena is blameworthy. State: 'Whether this mechanism reduces her moral responsibility is a question for ethics seminars, not this session.'

  ---

  ## 6. Delivery Notes for the TA

  *   **Visual Aid:** Draw the discount curves on the board. Label the Y-axis 'Subjective Value' and the X-axis 'Time'. Draw one smooth curve (Exponential) and one that drops steeply at the start then flattens (Hyperbolic). Map Elena's 'Writing Reward' and 'Streaming Reward' onto these curves to show where they cross.
  *   **Tone:** Maintain a neutral, analytical tone. Avoid sounding as though you are counselling students on their own study habits, even though the example is relatable.
  *   **Pacing:** Watch the clock during Phase 3. It is easy to get bogged down in drawing the graph. If you run short, sacrifice the nuance of the 'Synthesis' phase to ensure the 'Check for Understanding' is completed.
