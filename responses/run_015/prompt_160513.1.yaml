answer: |-
  ### 1. The list

  **Epistemic Accessibility (Non-negotiable).** A constitutional rule cannot depend on facts that are unknowable at the time of enrollment. In the *Long-Run Decision*, whether future people are affected turns on disputed climate models and causal chains. If the criterion requires certainty about impact, no one gets enrolled. The draftsperson needs a proxy—like residence or birth—that is verifiable now, not a metaphysical truth about impact later. Without this, the rule is inert paper.

  **Administrative Verifiability (Non-negotiable).** The criterion must map onto data states already collectable by the bureaucracy. In the *Associated Region*, residents are taxed and policed federally. A criterion based on "political membership" fails because that is the variable being solved for. A criterion based on "tax liability" works because the bureaucracy already tracks it. If the state cannot measure the condition without creating a new agency, the criterion is operationally dead. It must ride existing administrative rails.

  **Output Modality (Preference of a particular camp).** Must the output be binary? The *Gradient Proposal* argues moral weight is continuous; traditional voting is binary. This is not a moral necessity but an institutional technology constraint. If the voting system can handle weights, the criterion should output them. If the criterion demands binary output to fit legacy systems, it distorts the moral reality of overlapping jurisdictions. This requirement protects existing voting hardware, not democratic theory.

  **Foundational Non-Circularity (Genuinely up for grabs).** Must the criterion be applicable by non-members? If only a demos can define itself, the first demos cannot be formed democratically. For a draftsperson, this is likely a philosopher's scruple. Someone draws the line. However, if the criterion requires democratic ratification to become valid, it cannot guide the ratification process. It must be justifiable externally to the vote it constructs, even if the application is inevitably performed by an existing power.

  **Temporal Fixity (Preference of a particular camp).** Eligibility cannot fluctuate with every policy shift. In the *Long-Run Decision*, if inclusion depends on specific carbon budgets, the electorate changes yearly. This undermines the stability required for representation. The criterion should lock in status for fixed terms, even if the underlying moral facts (impact levels) shift slightly. This favors institutional stability over moral precision.

  **Jurisdictional Exclusivity (Preference of a particular camp).** Can one person belong to multiple demoi? The *Associated Region* assumes nested sovereignty. The *Gradient Proposal* assumes overlapping sovereignty. A criterion must choose. If it allows multiple memberships, it requires a meta-rule for conflict resolution. If it demands exclusivity, it must explain why the Associated Region residents are excluded despite federal subjection. This is a choice about the structure of sovereignty, not inclusion itself.

  ### 2. Where the list eats itself

  The list contains a fatal tension between Epistemic Accessibility and Moral Completeness. To satisfy the *Long-Run Decision*, you must include future generations based on impact. To satisfy Epistemic Accessibility, you must exclude them because impact is uncertain. You cannot have both. Similarly, Foundational Non-Circularity conflicts with Administrative Verifiability. If only an existing demos can apply the rule, the rule cannot create the first demos. A draftsperson always works inside an existing polity, meaning the criterion is always applied circularly in practice. Finally, Output Modality clashes with Jurisdictional Exclusivity. If you allow fractional votes (*Gradient*), you destroy the assumption of exclusive sovereignty (*Associated Region*). You can satisfy the moral intuition of the Gradient or the administrative reality of the Region, but not both simultaneously without a meta-constitution.

  ### 3. The one that does the most damage

  Epistemic Accessibility does the most damage. It eliminates any criterion relying on complex causal modeling. Any account that depends on tracing "effects" fails here immediately because causal chains are infinitely regressible and empirically disputed. Even accounts based on "subjection" struggle because enforcement probabilities are future-dependent. For a draftsperson, a criterion that requires a PhD in econometrics to verify voter eligibility is useless. This requirement forces the criterion to rely on proxies (residence, citizenship) rather than the moral reality (impact, coercion), effectively decoupling the rule from its justification.

  ### 4. Scorecard

  **All-affected:** Fails Epistemic Accessibility. Causal chains are too long and disputed (*Long-Run*). It also fails Temporal Fixity as the electorate shifts with every policy outcome. It is morally ambitious but administratively impossible.

  **All-subjected:** Fails Administrative Verifiability in the *Associated Region* case. It cannot distinguish between federal subjection worthy of voting and administrative subjection that is not. It also struggles with the *Gradient* case unless subjection is quantified, which returns us to epistemic uncertainty.

  **Subject-to-coercion:** Fails *Long-Run* completely. You cannot coerce non-existent people. It also fails Epistemic Accessibility regarding what counts as coercion versus inevitable constraint. It is the most operable but the least morally inclusive, often excluding those most vulnerable to state power.
