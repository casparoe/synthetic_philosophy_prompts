  hey so im in 11th grade and we just started this philosophy elective on social kinds. i tried to write my own argument for friday but i think it proves way too much and now im confused lol

  heres the chain i built:
  1. Money is literally just paper. it only works cause everyone agrees it has value - if the belief disappeared tomorrow, money wouldnt exist as money.
  2. Same with race. its not in DNA or nature; its a category we invented and keep going through social rules.
  3. So race and money are both socially constructed kinds.
  4. But heres where i got stuck. even my belief that im human depends on other people recognizing me and using the word "human." if i was the last person alive i wouldnt have the concept.
  5. So "human" also depends on collective belief and language to exist as a category.
  6. By the same logic, trees and gravity only exist as the kinds they are because we have concepts and scientific agreement about them.
  7. So literally every category - even physical ones - is socially constructed in the same way.
  8. But then saying "race is socially constructed" isnt special at all. its just saying "we talk about things."
  9. And if every category is constructed, then the idea of "social construction" itself is just another constructed idea with no real weight.
  10. So either im wrong about race and money being special, or im right and the concept is useless.

  where does this fall apart?? i really want to keep 1 and 3 cause those match what we read, but i feel like 4 is where i cheated. whats the cheapest step to reject, and if i drop it can i still say some kinds are constructed and others arent? be honest about whether the whole thing is salvageable.
