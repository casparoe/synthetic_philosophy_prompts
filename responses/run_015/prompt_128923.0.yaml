answer: |-
  Yes, this deadlock has an established name, and you are correct to sense that it is structurally distinct from standard factual disagreement.

  The most precise philosophical term for this is **Deep Disagreement**.

  However, depending on which lens you look through (philosophy, Bayesian statistics, or argumentation theory), there are specific nuances that capture the "rules for belief-formation" aspect you identified. Here is the breakdown of the concepts that map onto your observation.

  ### 1. The Canonical Term: Deep Disagreement
  Coined by philosopher Robert Fogelin (1985), **Deep Disagreement** occurs when parties disagree not just over a conclusion, but over the "framework propositions" or standards required to adjudicate that conclusion.

  *   **Standard Disagreement:** We agree on what counts as proof, but disagree on whether the proof is present. (e.g., "We both agree a fingerprint matches imply guilt, but is this a match?")
  *   **Deep Disagreement:** We disagree on whether fingerprints count as proof at all. (e.g., "Your statistics are irrelevant," vs. "Your anecdote is noise.")

  Fogelin argued that rational resolution is often impossible here because rationality itself is defined by the shared norms that are missing. This matches your observation that neither side takes the disagreement as reason to doubt their filter; in a deep disagreement, the filter *is* the thing being protected.

  ### 2. The Structural Term: Second-Order (or Meta-Epistemic) Disagreement
  In contemporary epistemology, this is often distinguished as **First-Order vs. Second-Order Disagreement**.

  *   **First-Order:** Disagreement about $P(H)$ (the probability of the hypothesis).
  *   **Second-Order:** Disagreement about how to process $E$ (evidence) to update $P(H)$.

  You hit on a crucial distinction: **"Disagreeing about beliefs" vs. "Disagreeing about the rules for belief-formation."** In the literature, this is sometimes called **Epistemic Norm Disagreement**. Both parties are internally rational (coherent) but operate under conflicting *normative epistemologies*. One operates under a norm that privileges statistical generalization; the other under a norm that privileges phenomenological immediacy (the vivid anecdote).

  ### 3. The Bayesian Translation: Disagreement on Likelihoods
  Since you mentioned Aumann, it is helpful to translate this into Bayesian terms. Aumann's Agreement Theorem assumes agents have **Common Priors** and receive signals that they interpret via a **Common Likelihood Function**.

  Your scenario describes a failure of the **Common Likelihood Function** assumption.
  *   **Agent A:** $P(\text{Anecdote} | \text{Theory}) \approx P(\text{Anecdote} | \neg\text{Theory})$. (The anecdote is noise; it doesn't shift the posterior.)
  *   **Agent B:** $P(\text{Anecdote} | \text{Theory}) \gg P(\text{Anecdote} | \neg\text{Theory})$. (The anecdote is strong signal.)

  Technically, this isn't a disagreement about the *Prior* ($P(\text{Theory})$), but about the **Model** of how the world generates evidence. In economics and game theory, this is sometimes referred to as **Model Disagreement**. They aren't just starting from different places; they are playing different games with the same pieces.

  ### 4. Why the Filter Doesn't Update: Hinge Epistemology
  You noted the "weird part": neither takes the persistent disagreement as a reason to doubt their filter. This is explained by **Hinge Epistemology** (based on Wittgenstein's *On Certainty*).

  Wittgenstein argued that for any inquiry to take place, certain propositions must act as "hinges" that remain fixed for the door of inquiry to swing.
  *   If my hinge is "Statistical studies are the gold standard," I cannot use a statistical study to prove that statistical studies are the gold standard (circular).
  *   If I try to use an anecdote to prove statistics are bad, you will reject the anecdote based on your hinge.

  Because the filter is the *precondition* for evaluation, it is insulated from the evaluation. This creates the **Epistemic Circularity** you observed. They don't doubt the filter because, within their system, the filter is the tool used to measure doubt.

  ### Summary
  Is it just "deep disagreement with extra steps"? **No.** It is a specific subclass of deep disagreement characterized by **divergent likelihood functions** or **conflicting epistemic norms**.

  If you need a label for your writing or thinking, the most accurate technical phrase is **Second-Order Epistemic Disagreement** or **Disagreement over Epistemic Norms**.

  *   **If you want to sound philosophical:** Call it a **Deep Disagreement over Hinge Commitments**.
  *   **If you want to sound mathematical:** Call it a **Divergence in Likelihood Functions**.
  *   **If you want to sound practical:** Call it **Incommensurable Evidential Standards**.

  The reason convergence fails isn't stubbornness; it's that they are effectively running different operating systems. One is running Windows, the other is running macOS, and they are arguing about why the `.exe` file won't open. They aren't disagreeing about the file; they are disagreeing about the architecture required to read it.
