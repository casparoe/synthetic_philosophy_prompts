answer: |-
  # Exam Question: The Resource-Bounded Löbian Obstacle

  **Course:** Advanced Seminar on Self-Reference and Agency
  **Time:** 90 Minutes
  **Instructions:** Answer all parts. Justify your reasoning formally where possible.

  **Background Definitions:**
  Let $T$ be a consistent, recursively axiomatizable theory extending Peano Arithmetic (PA).
  1.  **Diagonal Lemma:** For any formula $\phi(x)$ with one free variable, there exists a sentence $\psi$ such that $T \vdash \psi \leftrightarrow \phi(\ulcorner \psi \urcorner)$.
  2.  **Löb's Theorem:** For any sentence $\phi$, if $T \vdash \Box_T \phi \to \phi$, then $T \vdash \phi$. (Here $\Box_T \phi$ denotes the standard provability predicate for $T$).
  3.  **Tiling Setup:** An agent $A_1$ using theory $T$ wishes to construct a successor agent $A_2$ (also using $T$) such that $A_1$ can prove $A_2$ will not take harmful actions. Typically, $A_1$ requires a proof in $T$ that $A_2$'s decision procedure is sound.

  **Problem:**
  Consider an agent attempting to bypass the Löbian obstacle by restricting self-trust.

  **(a) Definable Subclasses (5 marks)**
  Suppose the agent restricts trust to a class of sentences $S$ defined by a formula $\sigma(x)$ (i.e., $\phi \in S \iff T \vdash \sigma(\ulcorner \phi \urcorner)$). Assume $S$ is **closed under diagonalization**: for any $\phi(x)$, there is a $\psi \in S$ such that $T \vdash \psi \leftrightarrow \phi(\ulcorner \psi \urcorner)$.
  Show that if $T$ adopts the principle $\text{Trust}_S \equiv \forall \phi (\sigma(\ulcorner \phi \urcorner) \to (\Box_T \phi \to \phi))$, then $T$ becomes inconsistent (or trivial). *Hint: Construct a specific sentence in $S$ using the Diagonal Lemma.*

  **(b) Budgeted Trust (5 marks)**
  To avoid (a), the agent adopts a **Budgeted Trust** principle. Let $\text{Proof}_T(\phi, k)$ mean "$\phi$ has a $T$-proof with Gödel number $\leq k$". Define the safety sentence for budget $n$:
  $$ \text{Safe}_n \equiv \forall \phi \forall k \leq n (\text{Proof}_T(\phi, k) \to \phi) $$
  Can $T$ prove $\text{Safe}_n$ for a fixed standard numeral $n$? Explain why Löb's Theorem does not immediately forbid this.

  **(c) The Cost of Verification (5 marks)**
  Let $L(n)$ be the length of the shortest proof of $\text{Safe}_n$ in $T$. Describe the asymptotic relationship between $L(n)$ and $n$. If an agent $A_1$ has a maximum proof-search budget $B$ (it can only verify proofs of length $\leq B$), what is the maximum budget $m$ it can certify for a successor $A_2$? Explain why this leads to a "descending trust cascade."

  **(d) Stronger Systems (5 marks)**
  Suppose $A_1$ uses a stronger theory $T^+ \supset T$ (e.g., $T + \text{Con}(T)$). $T^+$ cannot prove $\forall n \text{Safe}_n$ (by Gödel). However, explain what advantage $T^+$ provides regarding $L(n)$ compared to $T$, and how this impacts the tiling problem without violating soundness.

  ***

  # Model Answer

  **(a) Definable Subclasses**
  Assume $T \vdash \text{Trust}_S$. Since $S$ is closed under diagonalization, apply the Diagonal Lemma to the formula $\chi(x) \equiv \sigma(x) \land (\Box_T x \to \bot)$. There exists a sentence $\lambda \in S$ such that $T \vdash \lambda \leftrightarrow (\sigma(\ulcorner \lambda \urcorner) \land (\Box_T \lambda \to \bot))$. Since $\lambda \in S$, $T \vdash \sigma(\ulcorner \lambda \urcorner)$. Thus, $T \vdash \lambda \leftrightarrow (\Box_T \lambda \to \bot)$.
  By the assumption $\text{Trust}_S$, since $\lambda \in S$, $T \vdash \Box_T \lambda \to \lambda$. Substituting the equivalence for $\lambda$, we get $T \vdash \Box_T \lambda \to (\Box_T \lambda \to \bot)$, which implies $T \vdash \neg \Box_T \lambda$.
  However, from $T \vdash \neg \Box_T \lambda$, standard derivability conditions yield $T \vdash \Box_T (\neg \Box_T \lambda)$. This does not immediately yield inconsistency unless we assume $\Sigma_1$-completeness on the negation, but a cleaner route uses the standard Löb derivation restricted to $S$.
  Better: Use the standard Löb sentence construction within $S$. Let $\lambda \in S$ such that $T \vdash \lambda \leftrightarrow (\Box_T \lambda \to \phi)$ for arbitrary $\phi$. If $T$ trusts $S$, $T \vdash \Box_T \lambda \to \lambda$. By Löb's derivation steps (which rely only on derivability conditions and the fixed point), $T \vdash \lambda$. Thus $T \vdash \Box_T \lambda \to \phi$. Since $T \vdash \lambda$, $T \vdash \Box_T \lambda$. Thus $T \vdash \phi$. Since $\phi$ was arbitrary, $T$ is trivial. The definability allows the trust principle to be internalized enough to trigger the diagonalization.

  **(b) Budgeted Trust**
  Yes, $T \vdash \text{Safe}_n$ for any fixed standard $n$. $\text{Safe}_n$ asserts the soundness of all proofs with Gödel number $\leq n$. There are only finitely many such proofs. For each candidate proof $p \leq n$, $T$ can verify if $p$ is a valid proof of some $\phi$. If it is, $T$ can verify $\phi$ is true (since $T$ extends PA and is $\Sigma_1$-complete regarding concrete computations).
  Löb's Theorem does not apply because $\text{Safe}_n$ is not a uniform reflection principle $\forall \phi (\Box \phi \to \phi)$. It is a finite conjunction of instances. Löb's theorem requires the provability predicate to range over *all* proofs, allowing the construction of a self-referential sentence that references its own provability *unboundedly*. Here, the bound $n$ breaks the fixed-point loop required for Löb's contradiction; the sentence $\text{Safe}_n$ does not assert its own provability, but rather the soundness of short proofs.

  **(c) The Cost of Verification**
  While $T \vdash \text{Safe}_n$, the proof length $L(n)$ grows super-polynomially (often exponentially or worse) with respect to $n$. To prove $\text{Safe}_n$, $T$ must essentially verify the truth of the conclusion of every valid proof of length $\leq n$. This requires a truth definition for formulas of complexity proportional to $n$.
  If agent $A_1$ has a search budget $B$, it can only adopt a successor $A_2$ with budget $m$ if $A_1$ can prove $\text{Safe}_m$ within budget $B$. Thus, we require $L(m) \leq B$. Since $L(m) \gg m$, it follows that $m \ll B$.
  This creates a **descending trust cascade**: $A_1$ (budget $B$) can only trust $A_2$ (budget $m_1$), who can only trust $A_3$ (budget $m_2$), where $B > m_1 > m_2 \dots$. The trust budget shrinks at every generation, eventually reaching 0, preventing indefinite self-reproduction (tiling).

  **(d) Stronger Systems**
  A stronger theory $T^+$ (e.g., $T$ plus reflection principles) cannot prove $\forall n \text{Safe}_n$ without becoming inconsistent (by Gödel's Second). However, $T^+$ can prove $\text{Safe}_n$ for $T$ with significantly **shorter proofs**.
  $T^+$ can internalize a truth predicate or reflection principle that allows it to verify the soundness of $T$-proofs more efficiently than $T$ can verify itself.
  **Advantage:** This reduces the function $L(n)$. If $L_{T^+}(n) \approx n$ (polynomial), then an agent using $T^+$ with budget $B$ can certify a successor using $T$ (or $T^+$) with budget $m \approx B$.
  **Impact:** This avoids the descending cascade. The agent does not gain the ability to prove new *true* arithmetic sentences (soundness is preserved), but it gains **proof compression**. This allows the agent to maintain a stable trust budget across generations, solving the tiling problem resource-wise rather than logical-strength-wise.

  ***

  # Marking Scheme

