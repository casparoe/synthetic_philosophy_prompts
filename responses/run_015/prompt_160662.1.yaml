  Line-by-line syllable count, the alternation of masculine and feminine endings, and a steady English metrical pulse (phantom) are the first to go, as they are either diaphanous technicalities or imposed target-language expectations.

  ### 2. Scores

  **a. 90** — This preserves the functional playfulness of the original text even if the specific semantic content shifts.
