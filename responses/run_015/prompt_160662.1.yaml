  **f. 10** — Adding stanzas violates the inherited structural constraint of the form and disrupts the refrain's logic.
  **g. 5** — Changing the addressee fundamentally violates the rhetorical situation and the poem's primary purpose.

  ### 3. One Number

  **0.25**
  Since my tier list prioritizes rhetorical situation and register over form, a perfect shell with rewritten content retains only the mimicry of the original's value.

  ### 4. Confidence and Premise Check

  **Confidence:** I am confident in the separation of Tier 1 (meaning) and Tier 4 (technicalities), but the boundary between Tier 2 (structure) and Tier 3 (texture) is close; under mild questioning, I might concede that wordplay could outrank rhyme scheme in a poem defined by wit.

  **Premise:** The task rests on a confused premise because there is no purpose-independent hierarchy for translation; a scholar prioritizing linguistic data would rank syllable count higher, while a poet prioritizing performance would rank register higher, meaning no single ranking holds universal validity.
