      *   *Nuance:* The Nordic model criminalizes the *john*. Edward isn't criminalized in the film, but the logic of "saving her from the life" fits the Nordic *goal*.
      *   *Insight:* The film is actually a critique of the unregulated market *disguised* as a romance. It shows why unregulated work is dangerous, but offers a romantic solution instead of a policy one.

  7.  **Final Review:** Does this answer the "structurally necessary" question? Yes, by arguing that labor rights would negate the power imbalance required for the "rescue" trope.

