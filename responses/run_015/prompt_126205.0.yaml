answer: |-
  This is a sharp reading of *Pretty Woman*. The film is frequently analyzed as a Pygmalion myth or a class romance, but viewing it through sex-work policy frameworks reveals that the narrative relies entirely on the **precarity of unregulated labor** to function.

  Vivian's arc is indeed a "Nordic Model" fantasy (exit is the only victory), but the conditions of her work expose the vulnerabilities that the **New Zealand Decriminalization Model** attempts to mitigate. The film's "fairy tale" structure requires the systematic erasure of labor rights, peer networks, and institutional oversight. If Vivian had legal recourse, the romance would collapse.

  Here is the mapping of *Pretty Woman* onto sex-work policy models, analyzing how the film makes collective solutions invisible by design.

  ### 1. The Nordic Model: The Rescue Fantasy
  **Policy:** Criminalize the buyer, decriminalize the seller. Goal: Reduce demand and facilitate "exit."
  **Film Parallel:** Edward (the buyer) is the problem, but also the solution.

  The Nordic Model posits that prostitution is inherently exploitative and the best outcome for the worker is to leave the industry. *Pretty Woman* adheres strictly to this moral architecture. Vivian's "Happy Ending" is not becoming a successful, empowered sex worker; it is ceasing to be one. She is "rescued" from the market entirely.

  *   **The Buyer as Criminal/Savior:** In the Nordic model, Edward is the target of law enforcement. In the film, he is the target of moral reform. His transformation from "corporate raider" (exploiter) to "prince" (savior) mirrors the Nordic desire to eliminate demand, but it privatizes the solution. Instead of the state penalizing the buyer to protect the worker, the buyer's *conscience* protects the worker.
  *   **Exit as Victory:** The film validates the idea that sex work is incompatible with dignity. Vivian cannot be both a sex worker and Edward's equal. She must exit the labor force to gain personhood. This aligns with the Nordic philosophy that demand is the root evil, but it ignores the economic reality that "exit" requires resources the state (or the buyer) must provide.

  ### 2. The German/Dutch Model: Licensing and Visibility
  **Policy:** Legalize and regulate brothels. Workers are licensed, taxed, and subject to health inspections.
  **Film Parallel:** The absence of the "House."

  In a legalization model (like Germany), Vivian would likely work in a licensed club or brothel. This would provide a physical location, a manager, and a degree of visibility. *Pretty Woman* scrubs this from the narrative.

  *   **The Invisible Brothel:** Vivian works the street and negotiates directly in the limo. There is no establishment. If she worked in a licensed club, there would be a third party (the brothel owner) responsible for her safety. The film removes this to isolate her with Edward.
  *   **The Hotel Manager (Mr. Thompson):** The hotel manager acts as a proxy for institutional oversight, but his authority is contingent on class, not labor law. When Vivian is humiliated at the polo match or snubbed at Saks, the Manager protects her only *after* Edward validates her financial worth. In a licensed model, the venue (hotel/club) would have a duty of care regardless of the client's status. Here, safety is purchased, not regulated.

  ### 3. The NZ Decriminalization Model: Labor Rights and Agency
  **Policy:** Sex work is work. Criminal laws are removed; labor, health, and safety laws apply. Workers can organize, refuse clients, and enforce contracts.
  **Film Parallel:** The total absence of recourse.

  This is where the film's tension is highest. New Zealand's Prostitution Reform Act (2003) treats sex work as labor. Vivian's situation illustrates exactly why decriminalization advocates argue for this model: without it, workers have no leverage.

  *   **The Contract:** Vivian and Edward have a verbal agreement ($3,000 for a week). When Edward tries to change the terms (setting her up in an apartment, making her a "kept woman" rather than a contractor), Vivian has no legal standing to negotiate. She can only react emotionally ("I want the fairy tale"). Under NZ law, this would be an employment dispute; in the film, it is a romantic conflict.
  *   **Peer Backup (Kit):** Kit is Vivian's only peer network. When Kit is beaten by a john, Vivian has nowhere to report it. There is no union, no health inspector, no police recourse (since the work is criminalized/semi-criminalized in the film's LA setting). The film uses Kit's vulnerability to raise the stakes for Vivian, but it highlights the systemic failure to protect workers.
  *   **Occupational Health:** When Vivian feels unsafe or degraded (the polo match), she cannot file a grievance. She relies on Edward to teach her etiquette (training) or defend her (security). Decriminalization aims to give the worker the right to refuse service without penalty. Vivian feels she *cannot* refuse Edward's world without losing the contract entirely.

  ### Scene Mapping: Policy vs. Narrative

  | Scene | Policy Lens | Narrative Function |
  | :--- | :--- | :--- |
  | **Street Solicitation** | **Criminalization:** High risk of violence, no screening. | Establishes precarity. Vivian is vulnerable to physical harm (the opening assault attempt). |
  | **Limo Negotiation** | **Unregulated Market:** Verbal contract, no enforcement. | Establishes the power imbalance. Edward holds all capital; Vivian holds only labor. |
  | **Polo Match** | **Stigma (All Models):** Social exclusion persists even if legal. | Shows that legal status doesn't fix class stigma. Vivian needs Edward's cultural capital to survive the room. |
  | **Saks Necklace** | **Economic Exclusion:** Credit/Class barriers. | Edward uses capital to bypass discrimination. Policy (NZ) tries to grant dignity without requiring a benefactor. |
  | **Bathtub/Opera** | **Emotional Labor:** Boundaries blur between service and intimacy. | The "labor" becomes "love." This transition invalidates her worker status, making labor rights irrelevant. |
  | **Fire Escape Rescue** | **Nordic Exit:** The buyer retrieves the worker from the market. | The ultimate erasure of labor. She is not picked up as a contractor; she is rescued as a damsel. |

  ### The Structural Necessity of Absence

  You asked if the absence of brothels, peer organizers, and labor inspectors is just Hollywood, or **structurally necessary**. It is structurally necessary for the romance genre.

  1.  **Collective Power Undermines the "Chosen One" Trope:** If Vivian were part of a sex-worker union or had a strong peer network (like the NZ model encourages), she would have collective bargaining power. She wouldn't need Edward to save her from the "bad johns" or the "snobby clerks." The romance requires her isolation. She must be uniquely vulnerable so that Edward can be uniquely protective.
  2.  **Labor Rights Kill the Fantasy:** If Vivian could legally enforce her contract, the conflict dissolves. If she could report the hotel manager for discrimination, she wouldn't need Edward to intimidate him. The "fairy tale" relies on the **failure of institutions**. The police, the law, and the market are all hostile to her; only the Prince is safe.
  3.  **Edward's Transformation is a Red Herring:** Edward's personal growth does not answer the institutional question. It sidesteps it. The film suggests that the solution to systemic exploitation is **individual benevolence**. If Edward hadn't fallen in love, Vivian would have been discarded with no severance, no references, and no legal protection. The film presents this not as a policy failure, but as a risk of the "game" she was playing.

  ### Conclusion

  *Pretty Woman* is a **Nordic Model fantasy enacted in an unregulated market.** It argues that the best thing for a sex worker is to be rescued by a buyer, validating the idea that the work itself is degrading.

  However, the specific vulnerabilities Vivian faces—the inability to enforce the contract, the lack of safety when Kit is hurt, the dependence on the hotel manager's whim—are exactly the problems **NZ-style decriminalization** seeks to solve. The film hides these policy solutions because **labor rights are the antagonist of the rescue fantasy.**

  If Vivian had the right to refuse, the right to organize, and the right to legal recourse, she would be a citizen, not a princess. And a citizen does not need to be saved by a prince; she needs a government that enforces her rights. The film cannot show a labor inspector or a union rep because their presence would reveal that Edward isn't a savior—he's just a client who got lucky. The invisibility of labor rights is not an oversight; it is the precondition for the romance.
