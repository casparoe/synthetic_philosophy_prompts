prompt: |-
  Read Pretty Woman through the lens of sex-work policy — the Nordic model, German/Dutch legalization, and NZ decriminalization. Vivian's arc is literally "buyer rescues worker," which sounds like a Nordic-model fantasy: demand is the problem, exit is the win. But look closer — she has no contract, no peer backup when Kit gets hurt, no way to complain except through Edward's social capital. Does that invisibilty of labor rights illustrate what NZ-style decriminalization tries to fix (brothel rules, peer networks, legal personhood)? Or does the romance just hide those institutions?

  Map the key scenes — the polo match humiliation, the bathrobe/necklace negotiation, the hotel manager stepping in — onto what each model actually does: criminalize buyers, license brothels, treat it as labor with occupational health rules. Where does the fairy-tale rescue structure make collective/policy solutions invisible by design? And does Edward's personal transformation actually answer the institutional question, or is it a red herring? The film never shows a brothel, a peer organizer, or a labor inspector — is that absence just Hollywood, or structurally necessary?
reasoning: |-
  Here's a thinking process that leads to the essay/response:

  1.  **Deconstruct the Prompt:**
      *   **Subject:** *Pretty Woman* (1990 film).
      *   **Lens:** Sex-work policy models (Nordic, German/Dutch Legalization, NZ Decriminalization).
      *   **Core Question:** Does Vivian's arc ("buyer rescues worker") align with the Nordic model (exit is win), or does the lack of labor rights illustrate the need for NZ-style decriminalization? Does the romance hide necessary institutions?
      *   **Task:** Map key scenes (polo match, necklace negotiation, hotel manager) to policy models. Analyze if the "fairy-tale rescue" makes collective solutions invisible. Does Edward's transformation answer the institutional question? Is the absence of brothels/peers/inspectors Hollywood flair or structurally necessary for the narrative?

  2.  **Analyze the Policy Models:**
      *   **Nordic Model (Sweden, etc.):** Criminalize the buyer, decriminalize the seller. Goal: End demand, help workers exit. Focus on "rescue."
      *   **German/Dutch Legalization (Regulation):** Sex work is a legal business. Brothels are licensed. Workers pay taxes. Goal: Control, tax, regulate. Risk: State control, stigma remains, two-tier system.
      *   **NZ Decriminalization (New Zealand):** Sex work is work. Labor laws apply. Health & safety standards. No criminal penalties for consenting adults. Goal: Worker safety, rights, agency.

  3.  **Analyze the Film (*Pretty Woman*) through these lenses:**
      *   **Vivian's Status:** Street-based, independent (no pimp, but Kit is a loose manager/peer), vulnerable to violence (the "rapey" guy at the start), financially precarious.
      *   **Edward's Role:** The Buyer. Wealthy, powerful, initially exploitative (hires her for a week), eventually romantic/savior.
      *   **The "Contract":** Verbal, vague. $3,000 for a week. No labor protections.
      *   **Key Scenes:**
          *   *Opening:* Street solicitation, danger.
          *   *The "Deal":* Negotiation in the limo/hotel.
          *   *The Polo Match:* Class stigma, public humiliation.
          *   *The Necklace (Saks):* Snobbery, Edward stepping in with capital.
          *   *The Bathtub/Opera:* Emotional intimacy, "rescue" offer.
          *   *The Ending:* Edward climbs the fire escape (rescue).

  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Set the stage. *Pretty Woman* is often read as romance, but it's a labor contract gone romantic. Thesis: The film structurally requires the *absence* of labor rights to function as a fairy tale. It mimics the Nordic "exit" narrative but exposes the vulnerabilities that NZ decriminalization aims to fix.

      *   **The Nordic Model & The Rescue Fantasy:**
          *   Vivian's arc is about *exit*, not *employment*.
          *   Edward (the buyer) is technically the "criminal" in this model, but here he is the hero.
          *   The film validates the Nordic idea that the best outcome for a sex worker is to stop being one (via marriage/rescue).
          *   *Critique:* This relies on individual benevolence, not policy.

      *   **The Absence of Labor Rights (NZ Model Contrast):**
          *   Vivian has no contract enforcement. When she gets hurt (emotionally/physically), she has no recourse.
          *   Kit (the peer) is powerless.
          *   The Hotel Manager (Mr. Thompson): He acts as a quasi-regulator but only because Edward validates her. Without Edward, Vivian is ejected.
          *   *NZ Lens:* If this were NZ, she'd have health/safety rights, ability to refuse clients without losing the whole week's pay, peer support structures. The film hides this to make her dependent on Edward.

      *   **Scene Mapping:**
          *   *Polo Match:* Stigma. In a legalization model (Germany), she might be a registered worker, but social stigma remains. In NZ, she's a worker, but still faces classism. The film uses this to show she doesn't "belong" without Edward's shield.
          *   *Necklace/Saks:* Economic power. The clerk snubs her. Edward uses capital to fix it. Policy (NZ) tries to give workers dignity without needing a sugar daddy's credit card.
          *   *Hotel Manager:* He represents the "House." In a licensed brothel (Germany), the house manages safety. Here, the hotel is neutral ground that becomes hostile until the Buyer intervenes.

      *   **The "Red Herring" of Edward's Transformation:**
          *   Edward changes from ruthless corporate raider to loving partner.
          *   Does this solve the institutional problem? No. It personalizes a systemic issue.
          *   If Edward *didn't* change, Vivian would be destitute. The system offers no safety net.
          *   The "Happy Ending" is privatized welfare.

      *   **Structural Necessity of Absence:**
          *   Why no brothel? A brothel implies a boss other than the lover. It complicates the romance.
          *   Why no labor inspector? That would bring the State into the bedroom.
          *   Why no peer organizer? Collective power undermines the "unique special snowflake" narrative required for romance.
          *   Conclusion: The fairy tale *needs* precarity. If Vivian had rights, she wouldn't need saving.

  5.  **Refining and Polishing:**
      *   *Tone:* Analytical, critical, slightly academic but accessible.
      *   *Terminology:* Ensure policy terms (decriminalization vs. legalization) are used correctly.
      *   *Check against prompt:* Did I cover the Nordic, German/Dutch, and NZ models? Yes. Did I map the scenes? Yes. Did I address the "invisibility by design"? Yes.

  6.  **Self-Correction/Nuance Check:**
