      *   **The Big Miss:** They are arguing about *solution concepts* but haven't defined the *utility functions*. You can't run NBS or KS on dollars directly when marginal utilities differ. They need to map dollars to utility first. Also, they need to define the Disagreement Point clearly.

  4.  **Drafting the Response:**
