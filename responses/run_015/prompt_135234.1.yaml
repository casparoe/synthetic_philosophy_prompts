      *   *Strength:* Aftereffects suggest low-level sensory adaptation.
      *   *Weakness:* Attention can modulate adaptation. If attention is driven by cognition, is that penetration or just attention? The user concedes attention.
      *   *Dual-task:* If dual-task kills it, it suggests cognitive resources are needed to *maintain* the state that drives attention/adaptation. This might save the view (cognition -> attention -> adaptation) rather than (cognition -> perception).
      *   *Verdict:* Not decisive. It shows sensory change, but sensory change can be mediated by attention (which the user allows). To be fatal, it must show the cognitive content *itself* constitutes the phenomenology, not just modulates gain via attention.

  4.  **Address Point (2): Awkward Findings:**
      *   *Hill/Backpack:* Judgement/Action scaling. Easy to dismiss as response bias. (Low rank threat).
      *   *Tool/Reachability:* Affordances. Could be attentional salience. (Low/Mid rank).
