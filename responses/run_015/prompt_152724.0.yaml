prompt: |-
  You are an expert in moral philosophy and the cognitive science of ethical judgment. Before you answer, take a moment to think carefully and do brief brainstorming: list the major categories of defeat—empirical, formal, conceptual, and intuition-based—that could bear on the view below, without yet ranking them.

  Position to assess: The familiar torture-versus-dust-specks framing—where severe harm to one person seems worse than astronomically many people each suffering a barely perceptible irritation—does not undermine aggregative consequentialism. Rather, it reveals that human moral cognition employs a non-linear salience function with sharp tractability thresholds: we evolved, and ought in practice, to track causally tractable and perceptually available interventions rather than to perform linear arithmetic across populations that exceed cognitive scale. On this view, the mistake is not in aggregation itself but in expecting intuitive machinery to scale without distortion. A defender might further claim that normative ethics should distinguish “what is bad in principle,” where aggregation holds, from “what rational agents are required to prioritize,” where salience and intervention-tractability legitimately constrain choice.

  Your task is to present an honest map of what would count against this position.

  First, rank the defeaters:
  1. Decisive defeaters: arguments, observations, formal results, or conceptual distinctions that, if sound, should force a committed defender to abandon or radically revise the view. For each, specify exactly what the defender must concede.
  2. Merely awkward evidence: findings or cases compatible with the view but that require ad hoc adjustments, loss of parsimony, or unattractive qualifications. Note which adjustments are available.
  3. Insulation check: Does the position risk being qualified into unfalsifiability—for example, by defining “normative relevance” post hoc around whatever our salience mechanisms happen to track? Assess whether such insulation is a defect for a view of this kind, and say what a defender should concede about it.

  Second, include this specific check: Construct or describe a realistic scenario (no science-fiction, no demons, no perfect predictors, one paragraph) in which tractable interventions aggregate into clearly avoidable astronomical harm that remains below the perceptual-cognitive threshold, yet a single agent could prevent it. Walk through whether this case succeeds as a counterexample or whether the salience/tractability defense can absorb it without obvious cost. Identify the feature doing the work.

  Please do not provide bibliographies, reading lists, or citations. Focus on reasoning, distinctions, and conceptual structure. Be willing to conclude that the view is well-insulated and that this is—or is not—a problem for it.
