  7.  **Final Polish:** Check against constraints. No citations. Honest map. Specific scenario one paragraph. Ensure the distinction between "bad in principle" and "rational priority" is scrutinized.

      *(Self-Correction during drafting)*: I need to be careful with the "Decisive" category. A view that separates principle from practice is hard to kill decisively because it can always retreat to "practice." The most decisive attack is internal inconsistency: if the *goal* is good consequences, and the *method* ignores good consequences, the method is bad by the goal's lights.

