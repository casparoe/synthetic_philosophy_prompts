answer: |-
  ### Brainstorming Categories of Defeat

  Before ranking, I identify four broad vectors of criticism relevant to this hybrid cognitive-normative position:

  1.  **Empirical/Psychological:** Claims about the rigidity of human salience thresholds may be false. Training, institutional design, or technological augmentation might allow humans to "feel" or effectively process aggregated small harms, rendering the evolutionary constraint obsolete.
  2.  **Formal/Normative:** The distinction between "bad in principle" and "rational priority" may create a normative schizophrenia. If aggregation defines the *good*, a rational agent maximizing the *good* is contradictory if systematically ignoring the *good* due to cognitive limits.
  3.  **Conceptual:** The definition of "tractability" is unstable. Is an intervention tractable if it requires a calculator? If it requires a committee? If the view defines tractability by what agents *actually* do, it becomes descriptive, not normative.
  4.  **Intuition-Based (Moral):** The view may permit "death by a thousand cuts" scenarios where an agent knowingly allows astronomical harm because no single cut triggers the salience alarm, violating deep-seated duties of beneficence.

  ---

  ### Ranking the Defeaters

  #### 1. Decisive Defeaters
  These are arguments that, if sound, force the defender to abandon the core distinction between principled aggregation and practical salience.

  *   **The Consequentialist Self-Defeat:**
      *   *Argument:* The position claims aggregative consequentialism is correct "in principle." Consequentialism evaluates actions (or rules/heuristics) by their outcomes. If the "salience heuristic" systematically produces worse outcomes than a "calculation heuristic" (even a rough one), consequentialism *in principle* condemns the salience heuristic.
      *   *Concession Required:* The defender must concede that "what rational agents are required to prioritize" cannot diverge significantly from "what is bad in principle" without the view ceasing to be consequentialist. If the heuristic fails to maximize the good defined by the principle, the principle rejects the heuristic.
  *   **The Epistemic Override:**
      *   *Argument:* The view relies on *perceptual* salience. However, moral agents often act on *epistemic* knowledge rather than perception (e.g., we donate to famine relief we do not see). If an agent *knows* via testimony or math that dust specks aggregate to torture-level disvalue, the cognitive limit is bypassed by knowledge. The "ought" of rationality applies to informed agents, not just biologically constrained sensors.
      *   *Concession Required:* The defender must concede that once the aggregation is *known*, the salience constraint dissolves. This collapses the view back into standard aggregative consequentialism for any educated agent, rendering the cognitive limitation argument irrelevant for normative theory.

  #### 2. Merely Awkward Evidence
  These are findings compatible with the view but requiring unattractive qualifications or loss of parsimony.

  *   **The Sorites of Tractability:**
      *   *Evidence:* There is no clear line where a harm becomes "salient" or an intervention "tractable." Is saving 1,000 people tractable? 1,001?
      *   *Adjustment:* The defender must introduce a fuzzy logic or probabilistic threshold for obligation. This reduces the precision of the normative theory, making it difficult to adjudicate borderline cases (e.g., effective altruism causes that are on the margin of perceptibility).
  *   **Historical Contingency of Obligation:**
      *   *Evidence:* As technology improves (e.g., automated giving platforms), previously intractable aggregations become tractable.
      *   *Adjustment:* The defender must accept that moral obligations expand with technology. While plausible, this makes "duty" highly volatile depending on the state of cognitive aids, complicating moral education and blame.

  #### 3. Insulation Check
  *   **Risk:** The position risks unfalsifiability by defining "rational priority" as whatever aligns with our evolved salience mechanisms. If we ignore a harm, the theorist can retroactively claim it was below the tractability threshold. If we attend to it, they claim it was above.
  *   **Assessment:** This is a significant defect for a *normative* view. A normative theory should guide action, not merely describe cognitive limitations. If "ought" is fully constrained by "can" (where "can" is defined by current evolutionary psychology), the view loses its critical bite. It becomes a rationalization of status quo bias.
  *   **Concession:** The defender must concede that the view is only stable if it posits an *idealized* tractability (what we could track with reasonable effort) rather than *actual* psychological friction. If they retreat to actual friction, the view is descriptive psychology masquerading as ethics.

  ---

  ### Specific Check: The "Latency Tax" Scenario

  **Scenario:**
  A lead software engineer at a major cloud provider discovers that a recent optimization update increases server latency by 40 milliseconds for every user request. No individual user can perceive a 40ms delay; it is below the threshold of human notice and causes no perceptible frustration or functional loss to any single client (below perceptual-cognitive threshold). However, given the platform's 5 billion daily requests, the aggregate lost time amounts to roughly 55 years of human life every day, purely wasted in waiting. The engineer can revert the update with a single command keystroke at zero personal cost and no risk to system stability (highly tractable intervention). The harm is invisible to the victims and the engineer feels no emotional salience when considering the "milliseconds," yet the aggregate harm dwarfs many disasters we consider morally urgent.

  **Analysis:**
  This case succeeds as a strong counterexample that the salience/tractability defense cannot absorb without obvious cost.

  1.  **Tractability:** The intervention is maximally tractable (one keystroke). The view's constraint to "track causally tractable interventions" should mandate action.
  2.  **Salience:** The harm is below the perceptual threshold. The view's constraint to prioritize "perceptually available" interventions suggests the agent is *not* required to act, as the harm does not trigger the evolved alarm system.
  3.  **The Conflict:** Here, tractability and salience come apart. The view argues we ought to track *both*. If the agent acts on tractability alone, they violate the "salience" constraint (acting on abstract math rather than felt need). If they follow salience, they ignore the tractable fix.
  4.  **Absorption Cost:** To absorb this, the defender must argue that *epistemic access* (knowing the math) substitutes for *perceptual salience*. But if they concede this, they admit that cognitive limits are not the real barrier—only ignorance is. If they insist that *felt* salience is required even when the math is known, the view implies the engineer is *rationally permitted* to waste 55 years of human life daily because their brain doesn't "feel" the loss. This renders the normative component inert against known, preventable catastrophe.

  **Feature Doing the Work:**
  The decisive feature is **Epistemic Transparency**. The scenario removes the excuse of ignorance or computational difficulty. The harm is cognitively accessible via simple arithmetic, even if not perceptually salient. The view fails because it cannot explain why a rational agent, knowing the aggregation is real and the fix is easy, should be constrained by a lack of *emotional* salience. It conflates *motivational difficulty* with *normative permission*.
