answer: |-
  Here is the audit of the Doomsday Argument (DA) translated into your experimentation vocabulary, followed by the residue report and the required JSON summary.

  ### Part 1: Statistical Translation of the Argument

  You are correct that the DA is fundamentally a model specification problem. Here is how the philosophical moves map to your experimentation toolkit.

  1.  **The Observation (Birth Rank):**
      *   **Philosophy:** "I am roughly the 100 billionth human."
      *   **Your Vocabulary:** A single sample statistic $n$ drawn from a population of size $N$.
      *   **Status:** **Clean.** This is just data. $n \approx 10^{11}$.

  2.  **The Likelihood (The Sampling Model):**
      *   **Philosophy:** "Given a total population $N$, what is the probability of observing rank $n$?"
      *   **Your Vocabulary:** The sampling distribution $P(n|N)$.
      *   **The Fight:**
          *   *Standard DA (SSA):* Assumes uniform sampling without replacement from the set of *actual* observers. $P(n|N) = 1/N$ for $n \leq N$. This is the **German Tank** estimator. It implies small $N$ is more likely to produce a low $n$ than large $N$ is.
          *   *Counter-Argument (SIA):* Assumes the probability of the world existing is proportional to the number of observers in it. Effectively, $P(\text{World}_N) \propto N$. The likelihood becomes $P(n|N) \propto N \times (1/N) = \text{constant}$.
      *   **Status:** **Distorted.** In your work, the sampling protocol is usually fixed by the experiment design (e.g., random assignment). Here, the "experiment design" is metaphysics. You cannot A/B test the sampling protocol of your own existence.

  3.  **The Prior (Total Population Size):**
      *   **Philosophy:** "What is the prior probability distribution over total humans $N$?"
      *   **Your Vocabulary:** The prior distribution $P(N)$.
      *   **The Fight:** Often assumed to be scale-invariant (Jeffreys prior, $1/N$) or based on population growth models.
      *   **Status:** **Clean.** This is standard Bayesian prior specification, though often improper in DA contexts.

  4.  **The Conclusion (Doomsday Soon):**
      *   **Philosophy:** "The posterior probability mass shifts toward smaller $N$, implying fewer future humans."
      *   **Your Vocabulary:** The posterior predictive distribution for future duration.
      *   **Status:** **Clean.** If the likelihood is $1/N$, the posterior favors small $N$. If the likelihood is constant (SIA), the posterior equals the prior (no update).

  5.  **The Rival Rules (SSA vs. SIA):**
      *   **Philosophy:** Self-Sampling Assumption (SSA) vs. Self-Indication Assumption (SIA).
      *   **Your Vocabulary:** **Registry Protocol** (SSA) vs. **Draw Protocol** (SIA).
      *   **Status:** **Distorted.** In your work, you choose the protocol based on logistics. Here, the protocol determines the ontology. SSA says "sample from actuals." SIA says "weight hypotheses by how many samples they *would* produce."

  ### Part 2: The Residue Report

  This section identifies what falls out of your statistical toolkit during the translation.

  1.  **Item:** "I might have been a different observer."
      *   **Diagnosis:** **vocabulary_too_thin**
      *   **Explanation:** Your toolkit conditions on the sample you have; it does not model the probability of *you* being the sampler versus someone else. This is an indexical uncertainty problem that frequentist and standard Bayesian frameworks do not natively represent.

  2.  **Item:** "The reference class is the set of observers relevantly like me."
      *   **Diagnosis:** **genuinely_open**
      *   **Explanation:** In your work, this is a feature engineering or segmentation problem (e.g., "active users" vs. "all signups"). In DA, there is no ground truth for the segmentation rule, making the parameter $N$ ill-defined regardless of the math.

  3.  **Item:** "Existence itself is the data."
      *   **Diagnosis:** **argument_less_contentful**
      *   **Explanation:** Conditioning on "I exist" risks tautology. In sequential testing, you condition on the experiment running; here, the "experiment running" is the variable being predicted. This creates a circularity that looks like selection bias but is deeper.

  ### Part 3: Audit Verdicts

  **On Your Hunch:**
  You are **partly right**. You correctly identified that the dispute is entirely about the likelihood function (the sampling model) and that data cannot distinguish between the protocols. However, your framing suggests the protocols are neutral descriptions of a DGP. They are not; choosing the protocol *is* choosing the conclusion. It is less like an un-pre-registered analysis and more like an **unidentified model**: you have one equation (observation) and two unknowns (Total $N$ and Sampling Protocol).

  **On the Protocol Framing:**
  Calling it a "data-generating process" **smuggles the assumption**. To say there *is* a DGP implies a mechanism outside the system generating the indices. The "Registry" assumes indices exist before observers (favoring SSA). The "Draw" assumes observers generate the probability of the draw (favoring SIA). You cannot empirically verify which DGP applies without external data about the "urn maker."

  **On Optional Stopping:**
  This is **something_in_between**. It is not optional stopping in the frequentist sense (where you choose to stop based on interim significance). It is **length-biased sampling** (the Inspection Paradox). You are more likely to find yourself in a long-lived civilization than a short-lived one simply because long-lived civilizations contain more observer-moments. Whether this cancels the DA or confirms it depends on whether you treat "finding yourself" as data (SIA) or as a fixed condition (SSA).

  **Advice to Team:**
  Do not ship the Doomsday Argument as a hard signal in your tail-risk models. Treat it as a **prior sensitivity analysis**. Run your risk simulations with both the SSA likelihood (German Tank) and the SIA likelihood (Flat). If your system's safety margins depend on the difference, your model is under-identified, and you need external data (e.g., planetary lifespan estimates) rather than anthropic reasoning.

