answer: |-
  Here is the breakdown of your boss's decision matrix, the competing rules she is likely running, and the prediction for the Kaltai case.

  ### The Prediction

  **In the Official Report:** She will **not** use the word *genocide*.
  She will classify the actions as **crimes against humanity**, **forced assimilation**, or **cultural erasure**. She will cite the internal memos as evidence of *intent to destroy the group's cohesion*, but she will stop short of the g-word.

  **In the Book:** She **will** use the word *genocide*.
  Specifically, she will likely use the phrase **"cultural genocide"** or **"genocidal assimilation."** She will argue that the "Kaltai question" memos satisfy the *dolus specialis* (specific intent) required by Lemkin, even if the method was erasure rather than mass murder.

  ---

  ### The Rules She Is Running

  You mentioned you can think of two or three rules that fit her track record. Here are the three strongest candidates. They fit her past behavior but diverge on how they weigh the Kaltai evidence.

  #### 1. The "Treaty vs. Lemkin" Split (The Definition Rule)
  *   **The Logic:** She maintains a strict firewall between *prosecutable crime* and *sociological reality*. Official reports must adhere to the 1948 UN Convention (which excludes political/class groups and explicitly excluded "cultural genocide" during drafting). Her private writing adheres to Raphael Lemkin's original, broader conception (which included the destruction of language, culture, and institutions).
  *   **Evidence:** The Boarding School case is the smoking gun here. She refused "genocide" officially but used "cultural genocide" privately. The Khmer Rouge case fits here too: she accepted the *evolving* legal consensus (which eventually recognized the Khmer Rouge actions as genocide) but rejected the Ukraine Famine where intent to destroy the *nation* was legally ambiguous.
  *   **Prediction for Kaltai:** Report = No (Treaty doesn't cover cultural erasure without physical/biological destruction). Book = Yes (Lemkin covers erasure).

  #### 2. The "Settled History" Heuristic (The Consensus Rule)
  *   **The Logic:** She uses the word *genocide* officially only when the historical or legal consensus is solidified, regardless of donor feelings. If the history is still being fought in real-time, she withholds the word to preserve the organization's credibility and access.
  *   **Evidence:** She called the Herero/Nama genocide retroactively (history is settled, even if donors are mad). She called Srebrenica genocide (ICTY ruled it was genocide). She *withheld* the word in the "live situation" last year (consensus not formed, access at risk). She withheld it on Ukraine (historical/legal debate on intent still active).
  *   **Prediction for Kaltai:** Report = No (No court has touched it, no other outfit uses it, it is politically live). Book = Yes (She is free to pioneer the argument without institutional risk).

  #### 3. The "Access vs. Accuracy" Calculus (The Consequence Rule)
  *   **The Logic:** The word is a tool. If using it saves lives or secures justice, she uses it (Srebrenica). If using it cuts off access and leads to more deaths, she drops it (Live Situation). Donor pressure matters only insofar as it affects operational capacity.
  *   **Evidence:** The Herero report offended a donor, but it was retroactive (no access to lose). The Live Situation cost the word to save access. The Boarding School case might also fit here: labeling it genocide might have defunded the very programs helping survivors.
  *   **Prediction for Kaltai:** Report = No (Country X is a close ally of the main donor; using the word risks the organization's funding and future access to the region). Book = Yes (No institutional consequences).

  ### Where They Come Apart

  These rules usually align, but the Kaltai case strains them:

  *   **The Definition Rule** says "No" officially because the 1948 Convention requires physical/biological destruction, not just cultural erasure.
  *   **The Consensus Rule** says "No" officially because there is no legal precedent yet.
  *   **The Consequence Rule** says "No" officially because the donor risk is high.

  *However*, the **Intent Memos** ("closing the Kaltai question") create a divergence.
  *   Under the **Definition Rule**, the memos don't matter if the *act* isn't physical destruction.
  *   Under the **Consensus Rule**, the memos are a starting point, not a finish line.
  *   Under the **Consequence Rule**, the memos make the "No" harder to write, because the evidence is so strong that withholding the word feels like complicity.

  **Best Guess:** She is running **Rule 1 (Treaty vs. Lemkin)** as her baseline, reinforced by **Rule 3 (Consequence)**.
  The Boarding School precedent is the strongest predictor. She has already established that *cultural destruction alone* does not merit the official g-word in her organization, regardless of intent. The donor risk in the Kaltai case simply makes that decision easier to defend internally. She will not break her own precedent on cultural genocide for a donor ally, but she certainly won't break it *because* of them.

  ### Definition vs. Consequence

  You asked how much of her answer is about the definition and how much is about what the word *does*.

  **It is 60% Definition, 40% Consequence.**

  *   **Why Definition dominates:** If the Kaltai were being *massacred* (physical destruction), she would likely use the word despite the donor risk. The Herero case proves she will offend donors for the sake of the label if the definition is met. The Live Situation proves she will withhold the label if the definition is met *but* access is critical. This means Definition is the *gatekeeper*. If the definition isn't met (as in Boarding Schools and Kaltai), the consequence doesn't even need to be calculated.
  *   **Why Consequence matters:** In the "Live Situation," the definition *was* met (she admitted evidence of intent was strong), but she cut the word. This proves that Consequence can override Definition. However, in Kaltai, the Definition is already weak (cultural vs. physical), so the Consequence (donor risk) acts as a tie-breaker that ensures the verdict stays "No."

  ### Your Three-Way Split vs. Her Rule

  Your split:
  1.  **Killing the members.**
  2.  **Unmaking the membership** (group cohesion).
  3.  **Erasure** (category stops existing).

  **Her Track Record:**
  *   **Official Reports:** She tracks **The Legal Rule (1 + bits of 2)**. The 1948 Convention covers Killing (1) and Forced Transfer of Children (a specific mechanism of 2). It does not cover Erasure (3) or general Unmaking (2) unless it involves children. This is why Boarding Schools (2 & 3) got a "No" officially, but Srebrenica (1) got a "Yes."
  *   **Private Writing:** She tracks **Your Split (1, 2, & 3)**. She acknowledges "cultural genocide," which is essentially the destruction of the group's identity (2) and the erasure of their category (3) without necessarily killing the members (1).

  **Where they come apart:**
  The Kaltai case is a pure **2 & 3** case (Unmaking/Erasure) with almost no **1** (Killing).
  *   **Legal Rule:** Predicts **No**. (Cultural genocide is not a crime under the Convention).
  *   **Your Split:** Predicts **Yes**. (The group is being unmade and erased).
  *   **Her Verdict:** Will follow the Legal Rule for the report, Your Split for the book.

  ### The Single Further Case To Test Her

  To distinguish whether she is bound by the **Legal Definition** or the **Political Consequence**, you need a case where the Definition is clear, but the Consequence is dire.

  **The Case:**
  Present her with a draft regarding **Country X (the same donor ally)** where there is evidence of **active, physical mass killing** of a protected ethnic group (clear Article II violation), but intelligence suggests that labeling it "genocide" will cause Country X to expel your team, ending a monitoring mission that is currently preventing *more* killings.

  **The Predictions:**
  *   **If she follows the Legal/Definition Rule:** She will insist on the word **Genocide** in the report. (Precedent: Srebrenica/Herero. She doesn't soften the legal bar).
  *   **If she follows the Consequence/Access Rule:** She will downgrade it to **Atrocities** or **Ethnic Cleansing**. (Precedent: The Live Situation last year. Access saves lives).
  *   **If she follows the Consensus Rule:** She will wait for a UN or Court ruling before using the word.

  **Why this tells you everything:**
  The Kaltai case is muddy because the *definition* is muddy (cultural vs. physical). This test case removes the definitional ambiguity. If she withholds the word "genocide" in the face of *physical slaughter* solely to save access, you know that **Consequence** is her master, not Definition. If she uses it despite the risk, you know **Definition** is her master, and the Kaltai "No" was truly about the legal limits of cultural destruction, not the donor money.

  ### Summary Advice for Your Draft

  Draft the report using **"Crimes Against Humanity"** and **"Forced Assimilation."** Quote the "final integration" memos prominently. Do not use the g-word.
  In the footnotes or an annex, you can reference the *Convention on the Prevention and Punishment of the Crime of Genocide*, Article II (e), regarding forced transfer of children, as the closest legal analog.

  Let her write the book. That is where the Kaltai will get their name back.
