answer: |-
  **Brainstorming Pass: Candidate Accounts of Money**

  1.  **Measure of Value:** Money exists to compare disparate goods. *Counter-feature:* The state forbids private contracts from using the official reference basket, undermining money's function as a stable measure.
  2.  **Creature of Law (Chartalism):** Money is value because the state says it is. *Counter-feature:* The equitable reopening clause allows courts to adjust obligations based on economic reality, suggesting law recognizes value outside its own fiat.
  3.  **Commodity (Metallism):** Money derives value from intrinsic material worth. *Counter-feature:* Redenomination is purely numerical (divide by 1,000) without material change, and commodity pegs are invalidated.
  4.  **Credit/Debt:** Money is a social relationship of owing and being owed. *Counter-feature:* Legal tender forces acceptance at face value regardless of the issuer's creditworthiness or the debt's real value.
  5.  **Numeraire/Accounting Device:** Money is a neutral unit for calculation. *Counter-feature:* The state's own indexing (taxes, pensions) admits the unit is unstable, contradicting the rule that private contracts must treat it as stable.

  ***

  **Analysis of the Monetary Scheme**

  (a) The implicit theory of money presupposed by the nominal-value rule, legal tender, and continuity on redenomination is State Nominalism. This theory holds that money is purely a creature of sovereign fiat, defined exclusively by the state's declaration of what counts as a unit. On this view, the obligation in a contract is to pay a specific number of units, not a specific amount of purchasing power. The state's specification is conclusive in court, meaning the law protects the integrity of the number, not the value behind it. This treats money as a conventional measure that the community agrees to use, but crucially, it assigns the state the sole authority to redefine that convention without altering the substance of private obligations. If you deny this, you must argue that the law protects purchasing power rather than numerical face value.

  (b) Strictly presupposed by this theory are legal tender and continuity on redenomination; without these, the state's definition of the unit would not be conclusive. However, the state's own indexing practices (taxes, pensions, bonds) are merely consistent with State Nominalism, not required by it. They fit well with a pragmatic acknowledgment of inflation but are not logically forced by the theory. This scheme strictly rules out Metallism, as commodity pegs are invalidated and redenomination is abstract. It leaves Credit Theory available but subordinated; money remains a debt relationship, but the state dictates the terms of discharge. It also leaves the Numeraire view open, provided one accepts the state as the sole accountant. The tension arises because the state acts as a nominalist toward citizens but a realist toward itself.

  (c) The scheme is internally inconsistent regarding justice, though legally coherent regarding power. The state demands citizens treat the currency as a stable number while simultaneously admitting through its own indexed bonds and taxes that the unit is unstable. This creates a asymmetry: the state protects itself from inflation risk via indexing while forcing private creditors to bear that risk via nominalism. This is coherent only if one accepts sovereign privilege as a valid legal principle—that the state stands outside the mutual obligations it imposes on subjects. If justice requires symmetry, this is a betrayal of the measure's purpose. If law is merely command, it is consistent. The maintenance of a reference basket that cannot be used privately highlights this: the state measures value for itself but forbids citizens from doing the same, treating the measure as public property rather than a common good.

  (d) The equitable reopening clause presupposes that nominalism can fail to deliver justice. It is incompatible with strict State Nominalism, as it allows courts to look behind the number to the real position intended. It quietly imports an Aristotelian view as an exception. This is better justified as a correction preserving proportional equality than as an act of mercy. Mercy implies a gift; this clause restores the balance of exchange that inflation distorted. It acknowledges that when the measure drifts too far (forty per cent), the convention no longer secures the equality exchange requires. However, by limiting it to long-term obligations and debtor applications, it treats this justice as a safety valve rather than a standard, preserving nominalism as the default while admitting its moral limits.

  (e) If Aristotle's account were adopted as the governing theory, concrete changes would be extensive. Interest would likely be prohibited or strictly capped, as breeding money from money is unnatural. Indexation would not be optional for the state but mandatory for all long-term contracts to ensure proportional equality. The unit itself would be defined by the reference basket, not sovereign fiat. What would be made worse is certainty and liquidity; markets rely on the simplicity of nominalism to price risk quickly. An Aristotelian system requires courts to constantly assess real value, creating litigation risk and slowing exchange. The gain is justice in exchange; the loss is the efficiency of the convention. Where theories agree, such as on continuity during redenomination, non-philosophical considerations like administrative cost should decide.

