      *   *Goal:* Explain the epistemological stance of these systems.
      *   *Content:* They treat self-reports as privileged data. This aligns with Cartesian privileged access or neo-incorrigibility. The number *is* the state.
      *   *Drafting:* These institutional frameworks presuppose a robust form of first-person authority, echoing a Cartesian or neo-incorrigibilist view of introspection. By treating a self-reported number as the definitive metric of an internal state, the system assumes individuals possess direct, non-inferential access to their own phenomenology. The rating isn't treated as an interpretation or a hypothesis about one's condition; it is treated as the condition itself. This operationalizes introspection as a transparent window, bypassing the need for external verification. Epistemologically, this grants the subject exclusive jurisdiction over their mental landscape, privileging the "I feel" over the "I behave." Consequently, the algorithm accepts the input as ground truth, assuming no significant gap between the experience of pain or anxiety and the linguistic act of reporting it. This simplifies complex qualitative states into quantifiable data points, relying on the assumption that introspection is both accurate and honest.
