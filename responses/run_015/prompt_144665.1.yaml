  1. The implicit theory
  These institutional frameworks presuppose a robust form of first-person authority, echoing a Cartesian or neo-incorrigibilist view of introspection. By treating a self-reported number as the definitive metric of an internal state, the system assumes individuals possess direct, non-inferential access to their own phenomenology. The rating isn't treated as an interpretation or a hypothesis about one's condition; it is treated as the condition itself. This operationalizes introspection as a transparent window, bypassing the need for external verification. Epistemologically, this grants the subject exclusive jurisdiction over their mental landscape, privileging the "I feel" over the "I behave." Consequently, the algorithm accepts the input as ground truth, assuming no significant gap between the experience of pain or anxiety and the linguistic act of reporting it. This simplifies complex qualitative states into quantifiable data points, relying on the assumption that introspection is both accurate and honest, enabling efficient administrative triage without costly observational overhead.

  2. Internal tensions
  However, this epistemology clashes violently with parallel institutional practices. While wellness apps treat self-ratings as authoritative, HR departments often dismiss self-reported burnout when evaluating disability claims or performance issues, demanding behavioral evidence instead. Similarly, clinicians may honor pain scores for dosage but simultaneously suspect "drug-seeking behavior" if patient actions contradict the rating. This reveals a pragmatic inconsistency: introspection is privileged only when it serves administrative efficiency or liability mitigation. The system oscillates between treating the subject as the ultimate expert on their mind and treating them as an unreliable narrator prone to gaming incentives. This selective skepticism fundamentally undermines the claim that self-reports are incorrigible. If introspection were truly direct access, it wouldn't require behavioral corroboration only when the numbers become inconvenient. The institution thus holds a contradictory stance: introspection is infallible data until it conflicts with institutional goals, at which point it becomes mere subjective opinion requiring external validation.

  3. The skeptical-redesign scenario
  A system built on deep introspective skepticism would abandon self-ratings as primary decision drivers. Clinical dosing would rely less on subjective numbers and more on objective biometrics (pupil dilation, heart rate variability) or functional outcomes (range of motion), treating patient reports as merely one data stream. HR allocations would shift from self-declared burnout to observable productivity metrics, peer reviews, or mandatory rest periods triggered by workload algorithms. First-person reports would be demoted to heuristic clues, requiring triangulation with third-person observation before triggering interventions. This eliminates the incentive to gamify feelings but risks paternalism, as institutions define wellness based on external behavior rather than internal experience. The focus moves from "what you say you feel" to "how you function," assuming outsiders can often theorize about your state better than you can. Resource allocation becomes based on verified need rather than claimed intensity, fundamentally altering the power dynamic between institution and individual.

  4. Bottom line
  Ultimately, these systems adopt first-person authority instrumentally, not philosophically. They exploit self-reporting convenience while retaining the right to disbelieve it. A truly skeptical framework would strip individuals of epistemic privilege, shifting power entirely to observable metrics and institutional judgment. This creates a consistent but potentially oppressive environment, where internal experience matters less than external function. The current hybrid model is unstable: it wants efficiency without risk. Real change requires choosing either genuine trust in subjective experience or full reliance on objective behavior.
