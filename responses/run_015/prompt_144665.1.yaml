  3.  **Drafting - Section 2: Internal Tensions**
      *   *Goal:* Point out inconsistencies (privileging self-report here, dismissing it there).
      *   *Content:* HR/Clinics often distrust self-reports elsewhere (disability claims, performance reviews). Pain scales get scrutinized if behavior doesn't match.
      *   *Drafting:* However, this epistemology clashes violently with institutional practices elsewhere. While wellness apps treat self-ratings as authoritative, HR departments often dismiss self-reported burnout when evaluating disability claims or performance issues, demanding behavioral evidence instead. Similarly, clinicians may honor pain scores for dosage but simultaneously suspect "drug-seeking behavior" if patient actions contradict the rating. This reveals a pragmatic inconsistency: introspection is privileged only when it serves administrative efficiency or liability mitigation. The system oscillates between treating the subject as the ultimate expert on their mind and treating them as an unreliable narrator prone to gaming incentives. This selective skepticism undermines the claim that self-reports are incorrigible. If introspection were truly direct access, it wouldn't require behavioral corroboration only when the numbers become inconvenient. The institution thus holds a contradictory stance: introspection is infallible data until it conflicts with institutional goals, at which point it becomes mere subjective opinion requiring external validation.
