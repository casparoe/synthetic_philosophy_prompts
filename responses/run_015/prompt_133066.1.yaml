answer: |-
  Dear Student,

  Based on the pattern of rulings you have described from your professor, I predict she will declare the new constitutional amendment creating the unelected stability council illegitimate. To understand why, we have to look at the underlying principle she seems to be applying, which distinguishes between precommitments that protect fundamental human agency and those that lock in specific policy preferences. In her view, a clause banning torture is legitimate because it safeguards a basic human right that is a precondition for any meaningful citizenship, effectively protecting future generations from their own potential worst impulses regarding human dignity. Similarly, the savings account lock was acceptable only because it included a court-ordered escape hatch, preserving a mechanism for relief if circumstances change drastically. However, she rejected the carbon tax and the national education curriculum because those measures bind future citizens to specific economic and social policies they did not choose, violating the sovereignty of generations who never signed on to that social contract. The stability council fits this latter category of illegitimacy because it does not protect a fundamental right like the torture ban, nor does it offer an escape hatch like the savings account. Instead, it imposes a specific governance structure and policy veto based on a particular view of long-term harm, restricting the democratic power of future citizens to legislate according to their own needs and values.

  While the rule regarding fundamental rights versus policy locks fits her past verdicts well, there is another plausible rule that could explain her decisions, focusing instead on reversibility and scope. Under this alternative framework, precommitment is legitimate only if the constraint is local and easy to undo, like the town forest, or if it includes a procedural safety valve, like the savings account. The torture ban would be treated as a unique exception for moral absolutes where reversibility is irrelevant because the act is inherently impermissible. The carbon tax and curriculum were rejected because they were national in scope and rigidly entrenched, making them difficult for future majorities to reverse. The stability council would also fail under this rule because it is a national structure with thirty-year terms and constitutional status, making it highly rigid and difficult to undo, without qualifying as a moral absolute like the torture ban. Both rules lead to the same conclusion for the stability council, but they diverge on what makes a precommitment acceptable in the first place.

  To split these two rules and test which one your professor is actually using, you would need a case involving a national, rigid entrenchment of a substantive right that is not a physical moral absolute. Consider a constitutional amendment that guarantees free access to public universities funded by a dedicated tax, which can only be changed by a ninety percent vote. Under the primary rule regarding rights versus policy, this might be deemed illegitimate because funding specific social programs is a policy choice similar to the carbon tax, binding future generations to economic arrangements they did not consent to. However, under the alternative rule focusing on moral absolutes versus rigid policy, a proponent might argue that education is a fundamental right akin to freedom from torture, making the entrenchment legitimate despite the lack of an escape hatch. If your professor calls this education amendment illegitimate, she is prioritizing the distinction between rights and policy preferences. If she calls it legitimate, she is likely prioritizing the substantive value of the right over the procedural lock, suggesting that certain social rights can justify binding future generations even without an escape hatch. This case would force her to clarify whether the legitimacy of precommitment rests on the type of right being protected or the flexibility of the mechanism used to protect it.

  I hope this helps you prepare for the upcoming class discussion. It sounds like a fascinating semester exploring the limits of how one generation can bind the next.

  Best regards

  Your Legal Analyst
