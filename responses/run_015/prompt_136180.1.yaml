  3.  **Drafting - Section by Section:**

      *   **Introduction:** Start with the building. It's not a neutral container. It's part of the argument. Acknowledge the "unequal galleries." This mirrors the unequal nature of memory itself.
      *   **The Novelist's Lens:** Mention my background. I write about cities that don't bury dead. This institute is a city of the dead.
      *   **Defining Jurisdiction:** This is the state's voice. Laws, textbooks, statues. It wants order. It wants a "final draft" of history.
      *   **Defining Inheritance:** This is the blood's voice. Silence at the dinner table, a box in the attic, a song. It's messy. It doesn't care about state coherence.
      *   **The Conflict:** When the state builds a monument (Jurisdiction), it often silences the family story (Inheritance). When a family keeps a secret (Inheritance), it breaks the state's narrative (Jurisdiction).
