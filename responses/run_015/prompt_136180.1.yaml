          2.  **Defining the Terms:** Introduce *Mnemonic Jurisdiction* and *Mnemonic Inheritance* clearly.
          3.  **The Antagonism:** Explain why they fight each other. Use examples from the four cases without equating them.
          4.  **The Risk of Comparison:** Address the fear of false equivalence. Explain why comparison is necessary despite the differences.
          5.  **The Role of the Institute:** What do we do here? Not to solve, but to witness the tension.
