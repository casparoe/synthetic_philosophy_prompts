      *   **Core Argument:** These two modes are *antagonistic*, not complementary. Jurisdiction displaces inheritance; inheritance undermines jurisdiction's coherence.
      *   **Key Constraint:** Avoid false equivalence (the four cases are incompatible regimes of truth) but avoid easy pluralism (relativism where "everyone remembers their own way").
      *   **Format:** Opening remarks speech, approx. 15 minutes (roughly 1,800 - 2,200 words spoken at a moderate pace).
