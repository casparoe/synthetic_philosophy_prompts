      *   **The Purpose of Comparison:** It's not to rank suffering. It's to see the *mechanism* of memory. To see how power tries to shape grief.
      *   **Conclusion:** The institute is not a tomb; it's a workshop of tension. We are here to keep the wound open enough to breathe, but not enough to bleed out.

