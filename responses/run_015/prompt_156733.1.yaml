answer: |-
  This is a sharp approach. Using the Photodiode Paradox as the *engine* of the session rather than a footnote forces students to engage with the postulates as solutions to problems, not just a checklist.

  However, there is a technical trap in your premise: **In standard IIT 3.0/4.0, a single photodiode has $\Phi = 0$.** It has *information* (differentiates states) but zero *integration* (no internal causal constraints). If you tell them a single diode has "high Phi," you will be factually incorrect according to the theory you are teaching.

  **The Fix:** Frame the paradox as: *"Critics argue IIT implies a photodiode is conscious. Let's use the postulates to see if that's true."* This allows you to use the diode to demonstrate why $\Phi$ is actually zero (lack of integration), which validates the theory against the intuition.

  Here is the dependency order and session arc.

  ### 1. The Dependency Order (The Logical Arc)
  You cannot start with Exclusion. Exclusion is a boundary condition; you need to know *what* is being bounded first. You also cannot skip Intrinsic Existence, or they will treat consciousness as a functional input/output task.

  **Correct Sequence:**
  1.  **Intrinsic Existence:** Establish that consciousness must exist *for itself*, not for an observer. (Crucial for defeating the "diode detects light" argument).
  2.  **Information:** The system must distinguish states. (The diode passes this).
  3.  **Integration:** The system must be unified; parts must constrain each other. (The diode fails this).
  4.  **Exclusion:** The system must be at the specific scale where $\Phi$ is maximized. (Solves the "where" and "panpsychism" worry).

  **Why this order?**
  *   **Intrinsic before Integration:** If you start with Integration, they will think integration is just "wiring complexity" for the sake of function. Intrinsic Existence forces them to see integration as *causal power over itself*, independent of input/output.
  *   **Exclusion Last:** Exclusion resolves the "overlap" problem. You can't explain why a conscious system isn't just a part of a larger conscious system until you've defined what makes a system conscious (Integration).

  ### 2. The Carrying Example: The Photodiode
  To make the paradox work, you need to contrast the **Single Diode** with a **Diode Loop**.

  *   **The Single Diode (The Control):**
      *   **Must Have:** State differentiation (Light ON vs. Light OFF). This satisfies *Information*.
      *   **Must Lack:** **Feedback/Internal Connectivity.** It must be purely feedforward (Input $\to$ State $\to$ Output).
      *   **Lesson:** Without feedback, the current state does not constrain the future state *independently of the input*. Therefore, $\Phi = 0$. It is not conscious.
  *   **The Diode Loop (The Challenge):**
      *   **Must Have:** Two diodes connected so A affects B and B affects A.
      *   **Lesson:** Now $\Phi > 0$. This triggers the panic: "Is this loop conscious?" This sets up the need for *Exclusion*.

  ### 3. Addressing Misconceptions (Timing is Key)

  **Misconception A: "$\Phi$ is just wiring complexity."**
  *   **When to head it off:** During **Integration**.
  *   **How:** Draw a "feedforward grid" (complex wiring, no loops) vs. a "small loop" (simple wiring, high integration). Show that the complex grid has $\Phi = 0$ because cutting it doesn't change the causal power.
  *   **Script:** "Complexity is about how many parts you have. Integration is about how much the parts *need* each other to exist causally. A library is complex; a brain is integrated."

  **Misconception B: "IIT proves Panpsychism (rocks are conscious)."**
  *   **When to head it off:** During **Exclusion**.
  *   **How:** Explain that while $\Phi$ might be non-zero for many systems, consciousness only exists at the *maximum* $\Phi$ scale.
  *   **Script:** "A rock has atoms. Atoms might have tiny $\Phi$. But the rock as a whole has $\Phi = 0$ because the atoms don't integrate causally. The consciousness is at the atom level (if anywhere), not the rock level. IIT is gradualist, but Exclusion prevents 'everything' from being a single conscious blob."

  ### 4. The Whiteboard Check-Question (Exclusion Postulate)
  Do not ask them to calculate $\Phi$. Ask them to identify the *locus* of consciousness based on the Exclusion postulate (the principle of maximum cause-effect power).

  **The Setup:**
  Draw two overlapping circles on the board.
  *   **System A:** 5 neurons, tightly integrated. $\Phi = 10$.
  *   **System B:** 5 neurons (3 shared with A, 2 unique), tightly integrated. $\Phi = 10$.
  *   **System A+B:** The combined 7 unique neurons. Due to noise between the A and B clusters, the integration drops. $\Phi = 5$.

  **The Question:**
  "According to the Exclusion Postulate, where does the conscious experience reside?"

  **Correct Answer:**
  "There are **two** distinct conscious experiences (one in A, one in B). There is **no** consciousness in A+B."

  **Why this works:**
  *   If they say "A+B," they miss Exclusion (it's not the maximum).
  *   If they say "Neither," they miss Intrinsic Existence.
  *   If they say "Only one," they miss that overlapping maxima create distinct subjects (no fusion).
  *   *This proves they understand that consciousness is 'definite' and cannot overlap or merge arbitrarily.*

  ### 5. What to Openly Refuse to Explain
  **The Cause-Effect Repertoire Calculus.**
  *   **The Refusal:** "We are not doing the math of perturbations today. We are treating 'causal power' as a conceptual black box."
  *   **Why:** First-years will get bogged down in conditional probabilities ($P(\text{future}|\text{past})$). This kills the philosophical intuition.
  *   **The Substitute:** Use the "Cut" metaphor. "If I cut the wire, does the system's ability to determine its own future drop? If yes, that wire contributes to $\Phi$."

  ### 6. The Collapse Point (Hidden Dependency)
  **The Risk:** **Intrinsic vs. Extrinsic Causation.**
  *   **The Hidden Dependency:** The entire session collapses if students conflate *doing* (function) with *being* (existence).
  *   **The Failure Mode:** A student asks: "But the photodiode *does* something. It turns on the light. Why isn't that consciousness?"
  *   **Why it Collapses:** If you cannot convince them that consciousness is **Intrinsic** (about the system's state constraining *itself*) rather than **Extrinsic** (about the system affecting the *outside world*), IIT makes no sense. IIT explicitly says input/output is irrelevant to consciousness (the "black box" requirement).
  *   **The Fix:** You must hammer **Intrinsic Existence** in the first 10 minutes. Use the "Dreaming" argument. "When you dream, your input/output is zero, but your consciousness is high. Therefore, consciousness cannot depend on input/output."
  *   **If you skip this:** They will think the photodiode is conscious because it reacts to light. You will spend the rest of the hour fighting functionalism, not teaching IIT.

  ### Summary Checklist for the Board
  1.  **Axiom 1:** Intrinsic Existence (Dreaming argument).
  2.  **Example:** Photodiode (Has Info, Lacks Integration).
  3.  **Axiom 2:** Integration (Feedback loops required).
  4.  **Misconception Check:** Complexity $\neq$ Integration.
  5.  **Axiom 3:** Exclusion (Max $\Phi$ wins; no overlap).
  6.  **Whiteboard Quiz:** Overlapping systems A, B, A+B.
  7.  **Hard Stop:** No calculus, no panpsychism defense (just structural limits).
