answer: |-
  The lens focuses light inside the eye,
  Built by steps that were entirely blind,
  Serving a clear and vital purpose,
  Like gears turning inside a cold machine,
  Where signals add up to carry meaning,
  Following a strict and silent rule.

  Who writes the strict and silent rule?
  To guide the focus of the eye?
  Does syntax generate true meaning?
  Or is the history merely blind?
  In the clockwork of the working machine,
  Where nothing strives for the purpose.

  No agent ever seeks the purpose,
  Yet the pattern follows every rule.
  Inside the working of the machine,
  As clearly as within the eye,
  The path is traveled fully blind,
  Yet the result carries meaning.

  The sum is correct, it has meaning,
  Though no part knows the purpose.
  The steps are separate, distinct, and blind,
  Bound by the logic of the rule,
  Seen by the single watching eye,
  Calculated by the machine.

  Calculated by the machine,
  The output holds its meaning,
  Reflected in the human eye,
  Whatever the source of purpose,
  It obeys the same hard rule,
  No matter if the path was blind.

  No matter if the path was blind,
  Inside the silent machine,
  Or grown by a living rule,
  The competence remains, the meaning,
  And the function, the purpose,
  Held in the single seeing eye.

  If the blind steps build no meaning,
  Why does the machine achieve its purpose?
  Who follows the rule but the seeing eye?
