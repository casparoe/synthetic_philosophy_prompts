  # SCORING KEY & LEAF DEFINITIONS (BACK)

  **LEAF DEFINITIONS & COMMITMENTS**
  1.  **Leeway Incompatibilist (Plain):** (Q1:No, Q3:No). *Commitment:* You must reject the intuition that Jones is responsible in Q1 despite his normal reasoning, or argue the "could have done otherwise" principle survives Frankfurt.
  2.  **Leeway Incompatibilist (Flicker):** (Q1:Yes, Q2:No, Q3:No). *Commitment:* You must defend the moral relevance of avoiding a mere twitch or prior sign as sufficient for responsibility.
  3.  **Semicompatibilist:** (Q1:Yes, Q2:Yes, Q3:No). *Commitment:* You must maintain that responsibility is compatible with determinism, even if "freedom to do otherwise" is not.
  4.  **Frankfurt/Identification:** (Q1:Yes, Q2:Yes, Q3:Yes, Q4:No). *Commitment:* You must accept that an agent engineered 30 years ago is responsible if they currently identify with the choice, regardless of origin.
  5.  **Source Incompatibilist:** (Q1:No, Q3:No, Q4:Yes). *Commitment:* You must argue that the *source* of the will matters morally, even if the current psychological mechanism is identical.
  6.  **Skeptic (Forward-Looking):** (Q1:No, Q3:No, Q5:No, Q7:No). *Commitment:* You deny desert-entailing control exists. *Note:* This is a **Codicil Leaf**; you may hold these verdicts but still support blame practices for forward-looking reasons (deterrence/reform).
  7.  **Tracing Incompatibilist:** (Q1:No, Q3:No, Q5:Yes). *Commitment:* You deny control in standard cases but allow responsibility to transfer from a prior free act to a later unfree act.
  8.  **Historical Compatibilist:** (Q1:Yes, Q3:Yes, Q4:Yes). *Commitment:* You accept determinism but draw a line at recent manipulation, requiring a specific history for responsibility.

  **EMPTY CELLS & INCONSISTENCIES**
  *   **The "Q1 No / Q3 Yes" Cell:** Logically possible but rare. Implies Frankfurt cases remove responsibility *more* than determinism does. Likely **Unexplored** or **Incoherent** (why does a counterfactual intervener remove responsibility when laws do not?).
  *   **The "Q6 No" Pattern:** If you say Jones is blameworthy under Death Threat (Q6), your threshold for coercion is unusually high. If you say he is *not* praiseworthy for Reward, you may hold a **Strict Duty** view.
  *   **Q8 Variance:** If Q8 changes Q1, you hold an **Epistemic Condition** on responsibility. This does not create a new leaf but modifies any leaf above.
  *   **Indistinguishable Leaves:** The tree cannot separate **Hard Determinists** from **Leeway Incompatibilists** on verdicts alone (both say No to Q1/Q3). They differ only on *why* (metaphysics vs. intuition).

  **INSTRUCTION FOR INCONSISTENT PATTERNS:**
  If your answers do not fit the Routing Tree (e.g., Q1 Yes, Q3 No, Q2 Yes), you likely hold a **Hybrid View**. Re-evaluate Q2 and Q4; these are the most common points of intuitive slippage.

