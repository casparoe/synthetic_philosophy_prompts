answer: |-
  # MORAL RESPONSIBILITY SORTING INSTRUMENT (FRONT)

  **Instructions:** Answer **Yes** or **No** to each case based on your immediate verdict on *blameworthiness* (is the agent an apt target of resentment/rebuke?). Do not worry about consistency yet.

  **Q1 (Standard Frankfurt):** Jones decides to do X on his own. Black would have forced Jones to do X if Jones showed signs of hesitating, but Jones never hesitates. Black does nothing. Jones does not know about Black. Is Jones blameworthy for X?
  **Q2 (Flicker/Sign):** Same as Q1, but Black monitors an involuntary twitch that occurs *before* Jones decides. The twitch guarantees X. The only thing Jones could avoid was the twitch, not X. Is Jones blameworthy for X?
  **Q3 (Plain Determinism):** No Black. The laws of nature and the past fix that Jones must do X. Jones reasons normally. Is Jones blameworthy for X?
  **Q4 (Manipulation Time):** Scientists engineered Jones's character to choose X. Case A: Engineering happened 5 minutes ago. Case B: Engineering happened 30 years ago. In both, Jones now reasons normally. Is he blameworthy in Case B but *not* Case A?
  **Q5 (Tracing/Keys):** Jones could not do otherwise at the time of driving drunk because he gave his keys to a friend earlier to prevent this. He forgot the friend lost them. Is Jones blameworthy for driving?
  **Q6 (Threat vs. Reward):** Black threatens to kill Jones's family if Jones doesn't do X (Threat). Black offers Jones's family a million dollars if Jones does X (Reward). Jones does X. Is Jones blameworthy in Threat but praiseworthy in Reward?
  **Q7 (Hard Choice):** No Black. Jones must choose X (bad) or Y (worse). No law fixes the choice, but every option is terrible. Jones chooses X. Is Jones blameworthy for X?
  **Q8 (Knowledge):** Standard Frankfurt setup (Q1), but Jones *knows* about Black and chooses X anyway. Does this change your verdict from Q1?

  ***

  ### DECISION LOGIC (ROUTING TREE)

  **START at Q1.**
  *   **If NO:** Go to **Q3**.
      *   **If Q3 NO:** Go to **Q4**.
          *   **If Q4 YES (Time matters):** You are a **Source Incompatibilist**.
          *   **If Q4 NO (Time irrelevant):** Go to **Q5**.
              *   **If Q5 YES:** You are a **Tracing Incompatibilist**.
              *   **If Q5 NO:** Go to **Q7**.
                  *   **If Q7 NO:** You are a **Skeptic (Forward-Looking)**.
                  *   **If Q7 YES:** You are a **Hard Determinist (Leeway)**.
      *   **If Q3 YES:** *Inconsistent Pattern* (See Back).
  *   **If YES:** Go to **Q2**.
      *   **If Q2 NO:** You are a **Flicker Defender (Leeway)**.
      *   **If Q2 YES:** Go to **Q3**.
          *   **If Q3 NO:** You are a **Semicompatibilist (Actual Sequence)**.
          *   **If Q3 YES:** Go to **Q4**.
              *   **If Q4 NO (History irrelevant):** You are a **Frankfurt/Identification Compatibilist**.
              *   **If Q4 YES (History matters):** You are a **Historical Compatibilist**.

