  # CODA: EPISTEMIC REGISTER & CRITIQUE

  **Settled vs. Contested**
  *   **Settled:** The simple "Principle of Alternative Possibilities" (PAP) is widely rejected in the literature following Frankfurt (1969). Most specialists accept Q1=Yes.
  *   **Contested:**
      *   **Flickers (Q2):** It is disputed whether avoidable "flickers" (twitches/signs) preserve PAP enough to save Incompatibilism. *Confidence: Medium.*
      *   **Manipulation (Q4):** It is disputed whether a difference in *history* (30 yrs vs 5 mins) matters if current psychology is identical. *Confidence: Low.*
      *   **Skepticism (Leaf 6):** It is disputed whether forward-looking practices can be justified without *any* desert base. *Confidence: Medium.*

  **Instrument Critique**
  1.  **Repackaged Cases:** Q6 (Threat/Reward) and Q7 (Hard Choice) are structurally identical (external constraints on options). Distinguishing them tests intuition about *agency* vs. *circumstance*, but logically they may collapse.
  2.  **Question-Begging Nodes:** Q1 assumes "Blameworthy" is univocal. A specialist would argue Q1 conflates *accountability* (answer Yes) with *desert* (answer No). The tree forces you to choose one, potentially distorting your view.
  3.  **Smuggled Assumptions:**
      *   **Unity of Responsibility:** The tree assumes "responsibility" is a single property to be sorted. It may be a family of practices (moral, legal, aretaic) that come apart.
      *   **Control Condition:** The tree assumes there is one "control" condition underlying all blame. If blame is sometimes about relationship repair rather than control, the leaves misdescribe your position.
  4.  **The Skeptic Leaf:** Leaf 6 is flagged as a codicil because one can be a Skeptic about *desert* while occupying any other leaf regarding *practice*. The tree forces a verdict on cases, which presupposes some normativity, potentially excluding the radical skeptic who rejects the question itself.
