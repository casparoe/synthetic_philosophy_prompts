      *   *Section 1: The Translation.* Go through (i)-(iv) using RG terms.
      *   *Section 2: The Residue Report.* What's lost? (The "Why" of the laws, the status of the limit).
      *   *Section 3: The Orphan Limit.* This is the killer argument. If the UV doesn't exist, reductionism is dead.
      *   *Section 4: Epistemic vs. Ontological.* Map to Computability vs. Structural Stability.
      *   *Section 5: The Commitment.* Marco is pragmatically right, metaphysically incomplete.
      *   *Section 6: Confidence & Falsification.*

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I avoid the "derivable + error bars = done" trap?
