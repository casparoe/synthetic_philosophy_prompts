      *   Tone: Political Philosophy independent study (analytical, critical).

  9.  *(Self-Correction during drafting)*: Make sure to emphasize that in the Dollar Auction, *both* pay. In war, both pay costs, but the loser pays the *additional* cost of defeat. This distinction is crucial. The US fear wasn't just spending money; it was spending money *and* losing credibility (the second-bidder penalty).

