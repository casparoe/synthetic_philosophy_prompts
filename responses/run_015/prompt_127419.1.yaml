      *   *Wait, check 1 vs 4 again.* 1 says "theories are at least approximately true." 4 says "approximately true is nonsense." This is a direct contradiction. The user *must* change 1 or 4. Since they want to keep 1 (Realism), they need to rephrase 1 to not rely on the phrase "approximately true" or they need to solve 4. Better to drop the phrase "approximately true" from 1 and replace it with something like "correctly identifies causal structures."
