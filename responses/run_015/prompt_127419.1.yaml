      *   *Best Fix:* **Epistemic Structural Realism.** We know the structure (the kinetics, the inhibition), not the nature of the relata (the specific protein). This saves 1 (realism about structure), 2 (history shows natures change), 4 (no need for approximate truth of natures), 5 (prediction tracks structure), 6 & 7 (reference fixes to the causal node, meaning changes).

