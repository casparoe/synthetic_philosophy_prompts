      *   *Key Distinction:* Sartre distinguishes between "facticity" (the brute facts) and the "meaning" given to them. Elias claims the meaning of "husband" is mutable. Mara experiences the brute fact of "abandonment" if he changes too much.
      *   *The "Spirit of Seriousness":* Usually, this means treating values as pre-existing things. Elias avoids this. But is there a "Seriousness of Freedom"?
      *   *The Crucial Point:* Sartre's ontology is solipsistic in *Being and Nothingness*. He struggles with genuine reciprocity. This scenario highlights that gap. The harm isn't objectification; it's *ontological insecurity* inflicted by the Other's refusal to be an object.
      *   *Terminology:* Use "Transcendence," "Facticity," "Being-for-Others," "The Look," "Bad Faith."

