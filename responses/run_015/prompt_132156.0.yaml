      *(Self-Correction during drafting)*: Make sure to explicitly address whether this *is* bad faith. Sartre defines bad faith as lying to oneself. Is Elias lying? He might be lying about the *weight* of his facticity. He pretends his past vows don't create a situation that limits his current possibilities. But more importantly, is he in bad faith regarding the *Other's* freedom? Sartre says I am responsible for all men. If my authenticity destroys the Other's world, am I acting in bad faith about my responsibility?

      *Decision:* Frame it as a "Bad Faith of Transcendence" regarding the *relationship*. He treats the relationship as pure project, ignoring its factic weight on the Other.

