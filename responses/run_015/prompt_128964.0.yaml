  As a novelist constructing a narrative about the collapse of the Terror, I am trying to calibrate my interpretive stance between two competing architectures. One is the familiar thesis that revolutions devour their children — that the Terror contained an internal dialectic of virtue, suspicion, and perpetual purification that necessarily turned against Robespierre. The other is a framework I am calling political thermodynamics: the idea that revolutionary regimes possess a finite entropy budget of legitimacy, and that the Committee of Public Safety in 1794 was not consumed by its own ideology but dissipated through administrative over-centralization, war-driven fiscal extraction, and the withdrawal of popular support driven by material exhaustion rather than moral disillusionment.

  Please give me your actual credence — a specific number between 0 and 1 — that the Thermidorian fall was primarily caused by this structural dissipation rather than by the internal dialectic of revolutionary ideology. I do not want a conditional answer or a survey of opinions; I want a number, and I want the reasoning decomposed so that I can locate precisely where my narrative instinct might be distorting the weight of causes.

  Organize your response in exactly these sections:

  1. The Proposition Stated (approximately 120 words): Define the claim precisely. Distinguish structural dissipation from ideological dialectic, specify what counts as primary causation in this context, and indicate what kind of conceptual evidence — not archival citation — could resolve the question.

  2. Decomposition of Credence (approximately 350 words): Divide your overall judgment into at least four constituent probabilities or weights, each with a brief justification. I suggest considering: (a) whether the thesis that revolutions devour their children operates as a reliable historical law or as a post-hoc narrative pattern; (b) whether a legitimacy-entropy model plausibly applies to the fiscal-military crisis of 1794; (c) whether the withdrawal of sans-culotte support is better explained by supply failure and conscription fatigue than by disenchantment with the Republic of Virtue; (d) whether Robespierre's rhetoric and the reorganization of the Revolutionary Tribunal in June 1794 made his fall ideologically overdetermined regardless of external pressure. Show how these terms combine.

  3. The Number and Its Arithmetic (approximately 100 words): State your final credence explicitly. Indicate whether you combine the terms multiplicatively, additively, or by letting one dominate, and identify which term exerts the greatest pull on the result.

  4. Sensitivity and Weak Points (approximately 150 words): Name the term in which you are least confident. Describe the argument or comparative historical pattern that would shift it. State also whether your credence presupposes a materialist, idealist, or radically contingent philosophy of history.

  5. Narrative Design Implications (approximately 100 words): Given your number, advise how a novelist should distribute causal weight across the plot. Should the fall feel like an inevitable self-immolation of ideological purity, or like an administrative apparatus that cracked under wartime extraction? Specify which dynamics — supply crisis, tribunal rhetoric, popular withdrawal — should carry the thematic burden.

  Please avoid bibliographies, reading lists, or requests for specific scholars. I want reasoning that stands on its own conceptual architecture and that could be evaluated without web access.
