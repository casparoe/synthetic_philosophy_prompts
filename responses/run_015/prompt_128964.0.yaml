  1. The Proposition Stated
  The claim asserts Thermidor resulted primarily from structural dissipation rather than ideological self-cannibalization. Structural dissipation denotes exhaustion of administrative capacity and legitimacy due to material constraints—food supply, conscription, fiscal inflation—whereas ideological dialectic posits inevitable moral purification turning against architects. Primary causation means the factor without which the regime's collapse at that juncture becomes counterfactual. Conceptual evidence requires isolating variables: if material conditions stabilized while rhetoric radicalized, would Robespierre have fallen? Conversely, if rhetoric moderated while starvation persisted, would the Convention have revolted? The distinction lies between a regime dying of suicide (ideology) versus organ failure (structure).

  2. Decomposition of Credence
  (a) The "devour children" thesis functions more as literary pattern than historical law. Many revolutions stabilize without purging leaders. It explains timing poorly. I assign this a low predictive weight of 0.3.
  (b) The entropy model fits the fiscal-military crisis well. By mid-1794, the Law of Maximum was unenforceable; assignats collapsed. The state could no longer extract resources without breaking social contracts. This creates a hard limit on power. The administrative machinery literally could not process the volume of denunciations while managing supply lines. Weight: 0.8.
  (c) Sans-culotte support withdrew due to bread shortages and conscription, not virtue fatigue. When stomachs empty, ideology fades. This material base explains the passive acceptance of Thermidor; the streets remained quiet because they were exhausted. Weight: 0.75.
  (d) Robespierre's June rhetoric alienated elites, but elites only acted because popular cover vanished. Ideology provided the pretext, not the engine. Without the material crisis, the Convention would have feared the mobs too much to strike. Weight: 0.4.
  To combine: I treat (b) and (c) as necessary conditions for the structural argument, while (a) and (d) represent the competing ideological argument. The structural factors outweigh the ideological triggers. The arithmetic favors the material base because elite conspiracy requires popular acquiescence to succeed. The fiscal collapse forced the Convention's hand more than Robespierre's speech did. The entropy budget was spent; ideology was merely the language describing bankruptcy. The interaction is multiplicative regarding the structural side: if either supply or legitimacy holds, the regime survives. Since both failed, structural probability dominates, rendering ideological dialectic secondary—a symptom rather than a cause. The Convention's fear was not of Robespierre's virtue, but of empty granaries. Thus, structural weights carry the decisive burden. Ideological factors are noise variables amplifying the signal but not generating it. Consequently, probability mass clusters heavily around the thermodynamic failure of the state.

  3. The Number and Its Arithmetic
  My credence is 0.72. I combine terms by letting structural components dominate ideological ones, treating the latter as conditional. The calculation is a weighted sum where material exhaustion acts as a threshold function. Once the entropy budget is breached, ideological coherence becomes irrelevant. The term exerting the greatest pull is (c), withdrawal of sans-culotte support due to material fatigue. Without the streets, the Convention could not have been saved. This variable dictates the possibility space. Structural failure sets the stage; ideology merely writes the lines.

  4. Sensitivity and Weak Points
  I am least confident in term (d), regarding Robespierre's rhetoric. It is difficult to disentangle his specific verbal errors from the structural pressures forcing his hand. If evidence emerged that the Convention plotted his fall independently of popular sentiment—driven purely by fear of the Tribunal—the credence would drop toward 0.5. A comparative pattern showing regimes surviving material collapse through sheer ideological terror would also shift this. My credence presupposes a materialist philosophy of history, prioritizing economic and administrative constraints over ideas. However, it acknowledges contingency: the specific date of Thermidor was accidental, even if the collapse was structural. If one adopts an idealist stance, where ideas drive material conditions, the weighting inverts completely. The weak point remains the human element: whether Robespierre could have maneuvered differently within the same structural constraints to survive longer.

  5. Narrative Design Implications
  Structure the fall as administrative cracking, not moral suicide. Depict the Committee drowning in paperwork and supply failures. The thematic burden should rest on supply crisis and popular withdrawal. Show the streets growing quiet not because they love liberty, but because they seek bread. Robespierre's rhetoric should feel desperate, an attempt to rally energy from a vacuum. The climax is not a duel of virtues, but a ledger balancing failure. Make the Convention's revolt feel like a pragmatic survival instinct against a broken machine, rather than a righteous purge of tyranny.
