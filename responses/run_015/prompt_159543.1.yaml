      *   **Refining the "Misleading" vs. "Lying" distinction:** Some philosophers argue misleading is *worse* (cowardly). Some argue lying is *worse* (breaks the tool of language). For the committee's purpose, they should be treated *equally* in terms of outcome, but the justification matters.
