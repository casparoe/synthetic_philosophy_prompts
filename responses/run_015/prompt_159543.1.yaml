      *   *So:* Reject (1)'s sufficiency. The wrong is aiming to leave someone with a false belief *by invoking a norm of truth-telling that you intend to violate*.
      *   *Application:*
          *   Teacher asks student: Norm invoked. Student violates it (even via implicature). -> Guilty.
          *   Phone hiding: Norm of exam integrity invoked. Student violates it. -> Guilty.
          *   Stranger in hall: No norm of communication invoked. -> Not guilty.
          *   Murderer: Norm of mutual respect/safety overrides norm of truth. -> Permissible to mislead.

  7.  **Structure of the Response:**
      *   **Validation:** Acknowledge the sophistication of the argument. It's a known paradox (the "slippery slope" from lying to silence).
      *   **The Pivot:** The error is in Premise (1). It reduces the wrong to *epistemic harm* (false belief). It ignores *deontic duty* (the obligation created by the act of asking/answering).
      *   **The Principle:** The "Norm of Assertion" or "Invitation to Trust." Lying and Misleading (in response to inquiry) both accept an invitation to trust and betray it. Silence does not accept the invitation.
      *   **Addressing the Cases:**
          *   Group Chat: Accepted the invitation (answered the question), betrayed the trust. Guilty.
          *   Phone Hider: Active manipulation of the informational environment. Guilty.
          *   Stranger: No invitation accepted. Not guilty.
