          *   Student vs. Student (Exam): There is a duty of fairness, but not necessarily a duty of assistance.
          *   Stranger: No duty.
          *   Murderer: Duty to protect life overrides duty to tell truth.

      *   *Critique of Duty-Based:* The user's argument (1) tries to ground the wrong in the *act itself* (inducing false belief), not the *relationship*. If I switch to "Duty," I am rejecting (1). The user asks: "does the line actually fall somewhere else, between (1) and (2)?"
