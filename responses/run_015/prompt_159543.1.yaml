answer: |-
  This is a sophisticated piece of moral reasoning. You have reconstructed a version of the "slippery slope" argument that philosophers of language and ethics have wrestled with for decades (often discussed under the headings of *lying vs. misleading*, *commission vs. omission*, and the *Kantian murderer at the door*).

  Your logic is tight, which is why the conclusion feels inescapable. However, to save your intuition (that the student is guilty, but the silent passerby is not), you must reject the move from **(1) to (2)**.

  Premise (1) identifies a *consequence* of lying (inducing a false belief), but it mistakes that consequence for the *source* of the wrong. If the only wrong were the false belief itself, then (4) and (5) would indeed follow. But the wrong of dishonesty in an academic (or legal, or social) context is not merely epistemic (about beliefs); it is **normative** (about duties and expectations).

  Here is the principled line, the cost of drawing it, and how it handles your specific cases.

  ### The Break Point: Rejecting the Sufficiency of (1)

  You should reject the claim in (1) that "What makes lying wrong is that you aim to leave someone with a false belief." That is a necessary condition, but not a sufficient one.

  The specific wrong of lying (and of misleading in a context of inquiry) is the **violation of an invitation to trust.**

  When a teacher asks a student a direct question in an integrity hearing, they are not merely requesting data; they are invoking a specific **norm of assertion**. They are saying, "I am relying on your commitment to the truth to resolve this matter." By answering, the student accepts that reliance.
  *   **Lying** violates this by asserting what is false.
  *   **Misleading** (your group-chat case) violates this by exploiting the reliance to implant a falsehood without technically breaking the rule of assertion. It is a betrayal of the *spirit* of the inquiry.
  *   **Silence** (the hallway case) does not accept the reliance. No invitation to trust was extended or accepted.

  Therefore, the line falls between **(1) and (2)**. The wrong is not *just* aiming at a false belief; it is aiming at a false belief **by betraying a specific duty of candor that you have voluntarily undertaken.**

  ### Applying the Principle to Your Cases

  Here is how this distinction resolves your four scenarios while keeping the student guilty and the passerby innocent.

  **1. The Group-Chat Student (Guilty)**
  *   **Analysis:** The teacher asked a direct question ("Did you pass the key to anyone?"). This created a context of inquiry. The student chose to speak, thereby accepting the duty to be helpful and truthful. By crafting a sentence that was technically true but designed to be understood as false, she accepted the teacher's trust only to weaponize it.
  *   **Verdict:** She is guilty. She violated the duty of candor inherent in the hearing. The "route" (implicature vs. assertion) does not matter because the **betrayal of the communicative contract** is identical.

  **2. The Phone-Hider (Guilty)**
  *   **Analysis:** This is "staging." While not verbal, it is **active deception**. In an exam context, there is a standing rule: "Do not manipulate evidence to create a false impression of compliance." By hiding the phone, the student is actively constructing a false reality for the invigilator.
  *   **Verdict:** Guilty. This falls under the same principle as lying: actively creating a false belief in a context where you have a duty not to.

  **3. The Silent Classmate (Not Guilty)**
  *   **Analysis:** The classmate walking to the wrong room has not asked you for help. You have no standing duty to correct their epistemic state. You did not create their false belief (the timetable did); you merely allowed it to persist. While your *motive* (wanting them to fail) is cruel, and perhaps violates a general duty of beneficence, it does not violate the specific duty of **honesty**.
  *   **Verdict:** Not guilty of dishonesty. You might be a bad person for not helping, but you are not a liar. This stops the slide to (5).

  **4. The Murderer at the Door (Room to Maneuver)**
  *   **Analysis:** This is the hardest case. If the wrong is "betraying an invitation to trust," does the murderer extend a valid invitation? Most ethical frameworks argue that rights are reciprocal. The murderer, by threatening your friend's life, has **forfeited their right to the truth**. They are not engaging in a cooperative exchange; they are engaging in coercion.
  *   **Verdict:** You are permitted to mislead. The norm of truth-telling presupposes a moral community. The murderer has opted out of that community. Therefore, you owe them no duty of candor, and misleading them is not a violation of the "invitation to trust" because no valid invitation exists.

  ### The Costs of This Line

  You asked for an honest account of the costs. Drawing the line here (between *betraying a duty of candor* and *merely allowing a false belief*) is not free. Here is what you pay for it:

  **1. Context-Dependence**
  You lose the simplicity of a universal rule ("Never induce false beliefs"). Instead, honesty becomes relational. You must determine in every case: *Is there a duty of candor here?*
  *   *Cost:* This makes adjudication harder. The committee must argue not just about what the student did, but about what the student *owed* the teacher. (In a school setting, this is usually clear, but it requires articulation).

  **2. The "Cruel Silence" Loophole**
  As seen in case (4), this view admits that you can be morally culpable for *cruelty* without being culpable for *dishonesty*.
  *   *Cost:* You cannot punish the silent classmate for "academic dishonesty." If your school code only punishes dishonesty, that student escapes sanction. You may need a separate clause for "failure to act" or "malevolent conduct" if you want to catch that behavior. You have to accept that dishonesty is a specific sin, distinct from general unkindness.

  **3. The Definition of "Question"**
  If the wrong relies on the "invitation to trust," you must define what counts as invoking that invitation.
  *   *Cost:* Does a rhetorical question count? Does a casual query in the hallway count? You must distinguish between an *official inquiry* (where the duty exists) and casual conversation (where the duty is weaker). If you draw this line too narrowly, students can play semantic games. If you draw it too broadly, you approach the "silence is lying" problem again. You will need to define "official proceedings" clearly in your code.

  **4. The Murderer's Nuance**
  This view justifies misleading the murderer, but it does so by claiming they *forfeit* their right to truth.
  *   *Cost:* This is a heavy philosophical claim. It implies that rights to information are conditional on moral behavior. Some strict deontologists (like Kant) would reject this, arguing you must never lie, even to a murderer. By choosing this path, you are aligning your committee with a **rights-based** or **contractual** ethics rather than a strict **absolutist** ethics. You must be comfortable with the idea that truth-telling is a duty we owe to members of our moral community, not a cosmic absolute.

  ### Summary for Your Committee

  To finish your argument without accepting the absurd conclusion:

  > "The wrong of dishonesty is not merely causing someone to believe a falsehood. If it were, silence would be lying. The wrong is **betraying a specific expectation of truthfulness that arises in contexts of inquiry.**
  >
  > When the teacher asked the student, 'Did you pass the key?', she invoked a duty of full disclosure. The student accepted that duty by speaking, but violated it by exploiting technicalities to mislead. That is dishonesty.
  >
  > When a stranger walks to the wrong room, they have not invoked a duty of disclosure upon me. I may be unkind for not speaking, but I am not dishonest.
  >
  > Therefore, we can condemn the student's misleading statement as a breach of academic trust, without committing ourselves to the absurdity that all silence is lying."

  This preserves your verdict, protects the passerby, and leaves the door open for the murderer, at the cost of making "honesty" a contextual duty rather than a universal state of mind.
