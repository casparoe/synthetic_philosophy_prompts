      *   **Identify the Break Point:** Reject (1) or the inference from (1) to (2). The wrong of lying isn't *just* the false belief; it's the **violation of the assurance given by assertion**.
      *   **The "Assertion" Distinction:** When you speak in response to a direct question, you offer an assurance. When you mislead via implicature, you technically keep the letter of the assurance but violate the spirit. When you stay silent, you offer no assurance.
      *   **Addressing the Costs:**
