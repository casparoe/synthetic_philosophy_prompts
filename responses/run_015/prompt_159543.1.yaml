          *   It admits that misleading is technically distinct from lying but morally equivalent *in contexts of inquiry*.
          *   It requires defining "contexts of inquiry" carefully.

  8.  **Refining the "Murderer" point:** This is the hardest part. If the wrong is "violating the norm of assertion," how do we justify lying to the murderer?
      *   *Solution:* The murderer is not engaging in a legitimate cooperative exchange. The norm of truth-telling presupposes a moral community. The murderer opts out. Or, the right to life trumps the right to truth.
      *   *Alternative:* You don't lie; you refuse to answer. But the user wants to know if there is room for the person at the door to *mislead* (as per their friend's point).
