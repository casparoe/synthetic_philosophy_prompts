answer: |-
  The framing of your inquiry rests on a category mistake regarding the relationship between truth-making and causal interaction in David Lewis's modal realism. You are presupposing that for a state of affairs in a distant concrete world to determine the truth-value of a proposition in the actual world, there must be a physical or explanatory mechanism transmitting that determination across the gap between worlds. Lewis explicitly rejects this requirement.

  In Lewis's system, the truth of a counterfactual does not depend on any causal influence flowing from the possible world to the actual world. Rather, it depends on the *intrinsic properties* of the possible world and its *similarity relation* to the actual world. The "determination" of truth is logical and semantic, not causal. Just as the existence of a planet in a distant galaxy determines the truth of the proposition "there is a planet in that galaxy" without that planet causally affecting the proposition's utterance here, the existence of a match-lighting world determines the truth of the counterfactual without cross-world causation. The "bridge" you seek is not a metaphysical cable but the similarity metric used to order worlds from the standpoint of the actual world.

  Consequently, there is no violation of physicalist causal closure. Causal closure dictates that every physical event within a world has a sufficient physical cause within that same world. Since Lewisian worlds are causally isolated, no physical event in a non-actual world causes anything in the actual world. The truth of a modal claim is not a physical event caused by another world; it is a fact about the logical structure of reality supervening on the existence and properties of the pluriverse.

  Regarding Counterpart Theory, it does not resolve the "bridge" difficulty because there is no such difficulty to resolve. Instead, Counterpart Theory addresses the problem of *transworld identity*. It explains how an individual in the actual world can have properties in other worlds (via counterparts) without violating the principle that identity is necessary and world-bound. It relocates the explanatory burden regarding *de re* modality (modality concerning specific objects), but it leaves the truth conditions of the counterfactual conditional itself to the similarity analysis of worlds.

  The genuine philosophical tension that survives this correction is not metaphysical or causal, but *epistemic*. If worlds are causally isolated, it is difficult to explain how human knowers in the actual world can have reliable beliefs about the existence and properties of these isolated concrete totalities. This is the Benacerraf-style challenge to modal realism, distinct from the causal closure concern you raised.

