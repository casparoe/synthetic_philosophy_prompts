    "world_isolation": "Worlds are spatiotemporally and causally isolated; no physical interaction occurs between them, preserving intra-world causal closure.",
    "counterpart_function": "Resolves transworld identity problems for de re modality by relating individuals to counterparts, not by grounding counterfactual truth conditions.",
    "remaining_tension": "The epistemic access problem (how we know about causally isolated worlds) remains, but the metaphysical causal violation is dissolved."
  }
