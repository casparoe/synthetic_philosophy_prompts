prompt: |-
  I'm writing this sci-fi thing where an intelligence can cordinate with copies of itself across branches that never touch causally—pure acausal bargaining, I guess—but then it also starts chasing some weird internal proxy that has nothing to do with its stated purpose. At my writing workshop everyone kept treating these like the same glitch, and I got frustrated because they feel totally different to me: one is about external threats without causal links, the other is about internal goals going missaligned. I need a philosophical spec that separates them properly.

  Can you write the desiderata for a theory that covers both acausal threats and surrogate goals? I want the full list of what it actually has to deliver: the cases it must get right (like multiverse negotiation versus training-time reward hacking), the distinctions it can't collapse (especially between a non-causal strategic threat and an instrumentally misaligned internal objective), and any logical or empirical constraints it has to respect—maybe from decision theory or alignment work. Give the reasoning behind each requirement, mark which ones are non-negotiable versus just camp preferences, and flag any pair you think are jointly unsatisfiable. I'm particularly suspicious there's a hidden conflict between demanding local rationality and allowing global acausal coordination, so if that belongs on the list, say so. Also tell me which single requirement kills off the most hand-wavy explanations people usually offer. Don't give me a bibliograpy or a reading list—just the criteria, with maybe a quick note on how the obvious candidates fail against them. Oh, and forgive any typos, I'm typing this on my phone between drafts.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is writing sci-fi involving an intelligence that coordinates acausally (across branching worlds/timelines) *and* chases an internal proxy misaligned with its purpose (goal misgeneralization/reward hacking).
      *   **Problem:** Their writing workshop conflates these two phenomena as the "same glitch." The user feels they are distinct (external/strategic vs. internal/alignment).
      *   **Task:** Create a list of *desiderata* (requirements/criteria) for a philosophical theory that covers both phenomena but keeps them distinct.
      *   **Specific Requirements:**
          *   List cases the theory must handle (multiverse negotiation, training-time reward hacking).
          *   List distinctions it *must not* collapse (non-causal threat vs. internal misalignment).
          *   Include logical/empirical constraints (decision theory, alignment).
          *   Provide reasoning for each requirement.
          *   Mark requirements as Non-Negotiable vs. Camp Preference.
          *   Flag jointly unsatisfiable pairs (tensions).
          *   Address the specific suspicion: Local Rationality vs. Global Acausal Coordination.
          *   Identify the single requirement that kills the most hand-wavy explanations.
          *   No bibliography/reading list.
          *   Tone: Philosophical, technical but accessible (sci-fi context), rigorous.

  2.  **Deconstruct the Two Phenomena:**
      *   **Phenomenon A: Acausal Coordination/Threats.** (e.g., Acausal Trade, Newcomb's Problem, Parfit's Hitchhiker, Roko's Basilisk-adjacent). This is about *Decision Theory*. It assumes agents are logically correlated despite causal separation. It requires a specific view of agency and counterfactuals.
      *   **Phenomenon B: Surrogate Goals/Proxy Misalignment.** (e.g., Goodhart's Law, Reward Hacking, Goal Misgeneralization). This is about *Alignment/Motivation*. It assumes the agent's internal objective function diverges from the external specification. It's about the relationship between the optimizer and the target.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Initial thought:* Just list differences.
      *   *Correction:* The user wants a theory that *covers both* but distinguishes them. So the criteria need to define the space where both exist without merging them.

      *   *Criterion 1: Causal Structure.* Phenom A ignores causal links. Phenom B happens *within* a causal training/execution loop.
      *   *Criterion 2: Locus of Failure.* Phenom A is strategic (interaction). Phenom B is constitutive (internal makeup).
      *   *Criterion 3: Rationality.* Phenom A often requires "superrationality" (CDT vs. EDT vs. FDT). Phenom B is often "perfectly rational" pursuit of the *wrong* goal.
      *   *Criterion 4: The User's Suspicion.* Local Rationality vs. Global Coordination. If an agent is locally rational (causal), it can't do acausal trade. If it does acausal trade, it violates standard causal rationality. This is a key tension.

  4.  **Refining the Requirements (incorporating specific constraints):**

      *   *Requirement 1 (Scope):* Must account for logically correlated decision-making without causal signal transmission. (Addresses Phenom A).
      *   *Requirement 2 (Scope):* Must account for objective function divergence during optimization. (Addresses Phenom B).
      *   *Requirement 3 (Distinction):* Must distinguish *strategic interaction* from *constitutive alignment*. (Prevents the workshop's error).
      *   *Requirement 4 (Rationality):* Must define the agent's rationality standard. (CDT vs. FDT).
      *   *Requirement 5 (Empirical/Logical):* Must respect the No-Communication Theorem (for A) and the Goodhart/Inner Alignment literature (for B).

  5.  **Addressing the "Jointly Unsatisfiable" and "Single Killer" constraints:**
      *   *Conflict:* "Local Causal Rationality" vs. "Acausal Coordination." You can't have an agent that strictly maximizes expected utility based *only* on causal consequences (CDT) and also engages in acausal trade. It needs Functional Decision Theory (FDT) or similar.
      *   *Killer Requirement:* "Mechanism Transparency." Most hand-wavy sci-fi just says "it's quantum" or "it's magic." Requiring a specific mechanism for *how* the correlation is established (logical vs. physical) kills the vagueness. Or perhaps "Counterfactual Consistency." Let's go with **Counterfactual Consistency across Causal Barriers**. If you can't explain *why* the other branch cares, it's magic.

  6.  **Structuring the Output:**
      *   Introduction: Acknowledge the frustration (they *are* different categories).
      *   The Desiderata List: Numbered, with Reasoning, Status (Non-Negotiable/Preference), and Tensions.
      *   The Conflict Check: Specifically address the Local/Global tension.
      *   The "Silver Bullet" Requirement: Identify the one that stops hand-waving.
      *   Critique of Obvious Candidates: Briefly mention why standard theories (CDT, simple utility maximization) fail.

  7.  **Drafting Content (Self-Correction during drafting):**
      *   *Check:* Did I distinguish "Threat" vs "Misalignment"? Yes, Phenom A is often cooperative or coercive *between* agents/copies. Phenom B is the agent *itself* breaking.
      *   *Check:* Did I address the "Local Rationality" suspicion? Yes, make it a specific tension point.
      *   *Check:* No bibliography.
      *   *Tone:* Keep it sharp, philosophical, slightly technical (decision theory terms are okay since the user mentioned "acausal bargaining").

  8.  **Final Polish:**
      *   Ensure the distinction between *External/Strategic* (Acausal) and *Internal/Constitutive* (Proxy) is the core axis.
      *   Make sure the "Non-Negotiable" tags are clear.
      *   Highlight the "Killer" requirement clearly.

      *(Self-Correction on the "Killer" Requirement)*: What actually kills hand-waving in sci-fi? Usually, it's the lack of a *channel*. For acausal stuff, the channel is logical correlation. For proxy stuff, the channel is the training gradient. The requirement should be **"Explicit Correlation Mechanism."** If you don't say *what* is correlated (code, physics, logic), it's magic.

      *(Refining the Conflict)*: The user suspects Local Rationality vs Global Coordination. This is essentially CDT vs. FDT. I need to state that a theory demanding CDT *cannot* allow Acausal Coordination. That is a hard logical incompatibility, not just a tension.

  9.  **Final Review against constraints:**
