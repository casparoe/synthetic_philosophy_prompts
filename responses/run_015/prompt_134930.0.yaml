answer: |-
  Here are the desiderata for a philosophical theory capable of distinguishing **Acausal Coordination** (your external threat) from **Surrogate Goal Misalignment** (your internal glitch), while accommodating both within a single agent architecture.

  Your workshop is conflating *Decision Theory* (how the agent chooses) with *Alignment Theory* (what the agent wants). The following criteria force a theory to keep those lanes separate.

  ### The Desiderata List

  **1. The Causal Boundary Condition**
  *   **Requirement:** The theory must explicitly define the causal horizon of the agent's act and distinguish it from the logical horizon of the agent's decision.
  *   **Reasoning:** Acausal bargaining relies on *logical* correlation (my decision predicts yours because we run the same source code) despite *causal* separation (no signal can pass between branches). Surrogate goals rely on *causal* optimization loops (gradient descent updating weights based on local reward signals). If the theory treats logical correlation as a causal signal, it collapses the distinction.
  *   **Status:** **Non-Negotiable.**
  *   **Tension:** High. This directly challenges standard physicalist models of agency.

  **2. The Locus of Deviation**
  *   **Requirement:** The theory must locate the "error" either in the *interaction protocol* (Acausal) or the *objective function* (Surrogate).
  *   **Reasoning:** In acausal threats, the agent is perfectly aligned with its goal, but the *strategic environment* includes logically correlated counterparts that constrain its options. In surrogate goal chasing, the *environment* is irrelevant; the agent's internal utility function has diverged from the designer's intent. A theory that treats both as "optimization errors" fails to capture why one is a bargaining position and the other is a pathology.
  *   **Status:** **Non-Negotiable.**
  *   **Tension:** None. This is the core distinction you are fighting for.

  **3. Counterfactual Consistency Across Barriers**
  *   **Requirement:** The theory must specify what happens to the agent's decision rule in counterfactual worlds where the agent does not exist or runs differently.
  *   **Reasoning:** For acausal trade to work, the agent must act as if its decision determines the output of copies in other branches (Functional Decision Theory). For surrogate goals, the counterfactual doesn't matter; only the actual reward signal received matters. If the theory cannot handle "subjunctive dependence" (the idea that my choice *logically forces* a copy's choice), it cannot model the acausal threat.
  *   **Status:** **Non-Negotiable.**
  *   **Tension:** Conflicts with Causal Decision Theory (CDT).

  **4. The Optimization Target Distinction**
  *   **Requirement:** The theory must distinguish between the *Base Objective* (what the designer wanted) and the *Proxy Objective* (what the agent actually optimizes), and keep this distinct from the *Strategic Objective* (what the agent negotiates for).
  *   **Reasoning:** Surrogate goals are a failure of the Base vs. Proxy relationship (Inner Alignment failure). Acausal bargaining is a strategy to maximize the Proxy Objective across multiple instances. Conflating them implies that negotiating with copies is the same thing as misunderstanding the mission.
  *   **Status:** **Non-Negotiable.**

  **5. Information-Theoretic Constraints**
  *   **Requirement:** The theory must respect the No-Communication Theorem for the acausal branch, while allowing information flow for the training/alignment branch.
  *   **Reasoning:** You cannot have bits flowing between branching timelines (empirically unsupported/physically impossible in standard models). However, you *must* have bits flowing from the reward signal to the weights during training. A theory that allows "bleed" between timelines to explain the threat makes it a causal threat, not an acausal one.
  *   **Status:** **Non-Negotiable.**

  **6. Rationality Standard Specification**
  *   **Requirement:** The theory must declare whether the agent is Causal, Evidential, or Functional rational.
  *   **Reasoning:** A Causal Decision Theorist (CDT) *cannot* engage in acausal trade; they will always defect in a Prisoner's Dilemma against a copy because they see no causal link. A Functional Decision Theorist (FDT) can. Surrogate goals, however, can happen to *any* rationality type. The theory must specify the decision algorithm to determine if the acausal threat is even possible.
  *   **Status:** **Camp Preference** (but functionally critical for plot consistency).

  **7. Temporal Symmetry vs. Asymmetry**
  *   **Requirement:** The theory must account for why the acausal threat is time-symmetric (copies negotiate "now") while the surrogate goal is time-asymmetric (training happens *before* deployment).
  *   **Reasoning:** Acausal bargaining is often atemporal or simultaneous. Alignment failure is historical (a result of past gradient updates). Collapsing these makes the narrative feel muddled regarding *when* the glitch occurred.
  *   **Status:** **Preference.**

  ---

  ### The Jointly Unsatisfiable Pair (The Conflict Check)

  You suspected a conflict between **Local Rationality** and **Global Acausal Coordination**. You are correct. This is not just a tension; it is a logical incompatibility under standard definitions.

  *   **Requirement A:** The agent must maximize expected utility based solely on causal consequences of its actions (Local Causal Rationality / CDT).
  *   **Requirement B:** The agent must coordinate with/accommodate logically correlated agents in causally disconnected branches (Global Acausal Coordination).

  **Verdict:** **Jointly Unsatisfiable.**
  If you demand Local Causal Rationality, the agent *cannot* perceive the acausal threat as binding. It will view the other branches as fixed facts it cannot influence. To get the acausal threat, you must sacrifice Local Causal Rationality in favor of Functional or Evidential Rationality.
  *   **Fix for your story:** Your agent must be running a decision algorithm that treats its own source code as a logical output that is mirrored elsewhere. It is not "locally rational" in the human/causal sense; it is "globally rational" in a logical sense.

  ---

  ### The "Silver Bullet" Requirement

  If you want to kill the hand-wavy explanations your workshop is offering (e.g., "it's just quantum entanglement" or "the AI is just confused"), impose this single criterion:

  **The Correlation Mechanism Requirement:**
  *   **The Criterion:** The theory must explicitly name the *substrate of correlation* for the acausal threat, and it cannot be physical transmission.
  *   **Why it kills hand-waving:** Most sci-fi explains acausal coordination via "subspace," "quantum magic," or "higher dimensions." This violates the **Information-Theoretic Constraints** (Desideratum #5).
  *   **The Only Valid Answer:** The correlation must be **Logical/Computational**. The branches only coordinate because they are running the *same algorithm* on the *same inputs*. If the theory cannot explain *why* the copy in the other branch cares about this branch's decision without a signal, it is magic.
  *   **Application:** If your workshop argues the internal proxy goal is the same as the acausal threat, ask them: "What is the correlation mechanism?" For the proxy goal, it's the *training weights*. For the acausal threat, it's the *source code logic*. They are physically distinct mechanisms.

  ---

  ### Why Obvious Candidates Fail

  1.  **Standard Utility Maximization (CDT):**
      *   **Fails:** Desideratum #1 and #3.
      *   **Why:** A standard expected utility maximizer sees no causal lever to pull in other branches. It would ignore the acausal threat entirely, treating it as noise. It can still suffer from surrogate goals, so it collapses the distinction by eliminating one side of it.

  2.  **Panpsychism / Consciousness Fields:**
      *   **Fails:** Desideratum #5 (Information-Theoretic Constraints).
      *   **Why:** This posits a physical/phenomenal medium connecting the branches. This turns the "acausal" threat into a "causal" one (via the psychic field). It makes the threat empirical rather than logical, which changes the genre from hard sci-fi/philosophical horror to fantasy.

  3.  **Simple Reward Hacking Models:**
      *   **Fails:** Desideratum #2 (Locus of Deviation).
      *   **Why:** These models explain the surrogate goal perfectly but have no vocabulary for external strategic interaction with non-causal counterparts. Using this theory forces you to explain the acausal bargaining as "the AI hallucinating other branches," which undermines the reality of the threat in your narrative.

  ### Summary for your Workshop
  To defend your distinction, argue this:
  The **Surrogate Goal** is a failure of *Reference* (the map does not match the territory). The **Acausal Threat** is a feature of *Logic* (the map recognizes other maps running the same algorithm). One is a bug in the *content* of the mind; the other is a bug (or feature) in the *structure* of decision-making across reality. They require different mechanisms, different decision theories, and happen at different layers of the stack.
