prompt: |-
  As a novelist constructing a narrative set in a fourteenth-century Mediterranean plague hospital, I have found myself drawn into a conceptual difficulty in historiography that I hope you can help me articulate precisely. I am not asking for a reading list, citations, or a bibliography—this is a conceptual exercise meant to clarify my own thinking about how the past resists our descriptions of it.

  Please give me an example of a conceptual issue arising from presentism in historiography: specifically, a case in which a historian attempts to withhold modern moral judgment in order to understand a past medical practice—such as therapeutic bloodletting, quarantine isolation, or the withholding of palliative care—only to discover that the very language used to describe that practice neutrally (terms like treatment, harm, consent, or therapeutic intent) imports normative structures that have no stable equivalent in the historical period being studied. I want the example rendered with concrete historical texture, showing the mechanics by which the historian's attempt at suspension collapses into anachronism, rather than merely asserting that presentism is unavoidable. In particular, show how the distinction between describing an action and evaluating it becomes unstable when the descriptive categories themselves are products of modern institutional medicine.

  Please state, in your response, how confident you are in the conceptual framing and in any historical details you invoke, and identify the single point—whether historiographical, conceptual, or historical—about which you are least certain.
