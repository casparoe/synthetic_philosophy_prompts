answer: |-
  You have stumbled onto one of the most famous and persistent objections in the philosophy of truth. Your intuition is correct: your mate's version of deflationism (often called the **Redundancy Theory**) is too simple to handle the cases you described.

  Here is the breakdown of the established concepts, how they differ, and whether this actually breaks your mate's argument.

  ### 1. The Established Name
  The specific phenomenon you are describing is called **"Blind Truth Ascription"** (sometimes "Global Truth Ascription"). The logical problem it creates for the Redundancy Theory is known as **"The Generalization Problem."**

  This was famously articulated by the philosopher Peter Geach in the 1960s. He argued that if "is true" were merely redundant decoration, we couldn't make general claims about propositions we cannot explicitly state.

  ### 2. The Concepts and How They Differ

  To see why your mate's view struggles here, we need to distinguish three ways of looking at "true."

  **A. Simple Redundancy (Your Mate's View)**
  *   **The Idea:** "It is true that P" means exactly the same as "P". The words "is true" can be deleted without loss of meaning.
  *   **Why it fails your examples:** You cannot delete "is true" in your examples.
      *   *Example:* "Everything Gran said was true."
      *   *Deletion attempt:* "Everything Gran said was." (This is nonsense).
      *   *Your Mate's Defense:* He would say this is just shorthand for "Gran said X, and X; and Gran said Y, and Y..."
      *   *The Flaw:* As you noted, in the "sealed report" or "Gran's unspoken implications" cases, that list **does not exist**, even in principle. You are quantifying over a domain of propositions that is inaccessible. Redundancy theory requires a specific sentence to redundantly attach to. Blind ascription has no specific sentence.

  **B. Propositional Quantification (The Logical Fix)**
  *   **The Idea:** This is the sophisticated deflationist response. It argues that "true" is not a property of sentences, but a **logical device** that allows us to use variables.
  *   **How it works:** Instead of listing sentences, the word "true" allows you to say: "For all propositions *p*, if Gran asserted *p*, then *p*."
  *   **Difference from Redundancy:** It admits "true" isn't redundant *grammar*; it's a necessary *operator*. It lets you bind variables (like *x* in math) but for whole sentences.
  *   **Does it match your intuition?** Partially. It explains how the sentence has a definite meaning without a list. But it feels cold. It doesn't capture your feeling of "vouching for a source."

  **C. Substantive/Correspondence Theory (The Traditional View)**
  *   **The Idea:** "True" names a real property (correspondence with reality).
  *   **Why you rejected it:** You said, "It doesn't feel like I'm doing that [matching facts]; I'm doing something more like vouching for a source."
  *   **The Conflict:** In Blind Ascription, you *cannot* check the correspondence. You don't know the facts. So, if truth is just "matching facts," you shouldn't be able to make the claim meaningfully. Yet you can.

  ### 3. The Best Fit: "Pro-Sentential Theory"
  There is a specific niche theory that fits your description best, developed by Dorothy Grover, Joseph Camp, and Nuel Belnap. They call it the **Pro-Sentential Theory of Truth**.

  *   **The Concept:** They argue "true" acts like a **pronoun**. Just as "he" stands in for "John," "that is true" stands in for a whole sentence.
  *   **Why it fits:** Pronouns allow us to refer to things without naming them. "He is tall" works even if I can't list every cell in John's body. Similarly, "What Gran said is true" works even if I can't list every proposition Gran uttered.
  *   **The "Vouching" Feeling:** This theory captures the *function* (referring back to a source) without requiring the *metaphysics* (matching facts).

  However, none of these fully capture your specific intuition that you are **"vouching for a source."** That intuition points to a conflation between **Truth** (semantic) and **Reliability** (epistemic).

  ### 4. Boundary Cases (Applying the Logic)

  You asked for boundary cases to test this. Let's apply the **Propositional Quantification** view (the strongest deflationist defense) to your scenarios.

  **Case 1: The Habitual Liar**
  *   *Scenario:* You say "Everything Gran said is true." Gran was a liar, but unknown to anyone, she told the truth this once.
  *   *Analysis:* Your statement was **false**.
  *   *Why:* "Everything Gran said" quantifies over *all* her statements. If she told one lie in 1947, the universal claim fails.
  *   *The "Vouching" Conflict:* You felt you were vouching for her *reliability*. But truth is not reliability. You can vouch for a source who turns out to be wrong. If you meant "Gran is usually reliable," that's a different claim. If you meant "Every proposition she asserted corresponds to fact," you were wrong, even if you couldn't know it.

  **Case 2: Retrospective Falsification**
  *   *Scenario:* You say "What's in the letter is true." Twenty years later, we open it and half is false.
  *   *Analysis:* Your original ascription was **false all along**.
  *   *Why:* Truth is generally considered timeless in this context. The propositions inside the letter were either factually correct or not at the time you spoke. Your ignorance doesn't change the truth value of your ascription, only your *justification* for making it.
  *   *The "Vouching" Conflict:* This hurts your intuition. You feel like you made a reasonable move at the time. But in logic, a blind ascription is a bet on reality, not a bet on your current knowledge.

  ### 5. Does This Hurt Your Mate's View?

  **Yes, but it doesn't kill it.**

  *   **Where he is wrong:** He is wrong that "true" is *just decoration* or *synonymous* with the sentence. If it were, Blind Ascription would be impossible. He needs to upgrade his view from "Redundancy" to "Logical Device for Quantification."
  *   **Where he is right:** He is likely right that "true" is not a **substantive property**. You don't need to believe in a mysterious "Truth Substance" that glues sentences to the world to make sense of your examples. You just need the logical machinery to quantify over sentences.

  So, the "Generalization Problem" forces deflationists to be more sophisticated, but it doesn't force them to admit that Truth is a real property like Mass or Charge.

  ### 6. Confidence and Uncertainty

  **Confidence Level:** **High (85%)** on the philosophical classification; **Medium (60%)** on the interpretation of your specific "vouching" intuition.

  **The Bit I Am Least Sure About:**
  I am least certain about how to categorize your feeling of **"vouching for a source."**
  Standard philosophy treats this as a confusion between *Truth* (is the claim correct?) and *Warrant* (am I justified in believing it?). However, some pragmatic philosophers (like Robert Brandom) argue that asserting truth *is* fundamentally a social act of endorsing a claim within a community, rather than a static relation to facts.

  If Brandom is right, your intuition isn't a confusion; it's a deeper insight than the standard logic suggests. In that view, saying "What Gran said is true" *is* literally "I endorse Gran's claims," which makes your "vouching" feeling the primary definition, not a side effect. This is a minority view compared to the logical/deflationary account, which is why I flag it as uncertain.

  **Summary for your mate:**
  Tell him he's run into **Geach's Generalization Problem**. "True" isn't redundant decoration; it's a **logical operator for propositional quantification**. It lets us say things about sentences we can't name. It doesn't prove Truth is a magical property, but it does prove "true" does a job that mere repetition of sentences cannot do.
