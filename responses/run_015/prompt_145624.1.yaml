prompt: |-
  Hi — I chair the language standards group at a mid-sized nonprofit newsroom (~60 journalists, plus a comment section we still, foolishly, moderate ourselves). We recieve somewhere between twenty and forty requests a week from reporters and producers about slurs: do we print the word, bleep it on audio, write the initialism, use a euphemism like "the N-word", describe the act in other words, or reproduce it because it's in a document, lyric, or post we're quoting. Right now it's whichever duty editor is on, deciding in under ten minutes with no training in any of this, then having to defend the call to readers and to our own staff, and the answers are wildly inconsistent.

  What I need is a decision procedure, not an essay. Something the duty editor can actually walk through at speed: the questions in order, what counts as a good enough answer to each one, the point where the answer is just "no, don't" and we stop, and the point where it gets handed up to me or to the standards group because what's left is a question about what we care about, not about what the word does. Please use whatever the semantics/pragmatics side of this actually distinguishes — I don't want a reading list or citations, I want the distinctions themselves: what a slur contributes to what's said versus what it does to the people hearing it, whether the derogatory bit is part of the meaning or a side-effect of the use, what changes when the word is quoted or reported or mentioned rather than used, whether "who is speaking" and "who is listening" matter differently.

  The cases our current policy handles badly, and that the procedure has to handle: in-group or reclaimed use that we're quoting from a source; a commenter who never types the word but writes something that only does its work if the reader supplies it (initialisms, "you know which one", emoji, leetspeak); a term being reclaimed by one group while outsiders still use it as a slur against a different group; historical documents, song titles, and place names; and cases where the target group has essentially no one in the conversation.

  Then run it on three: a producer who wants to quote a council member's voicemail verbatim in a story about that council member; a music review quoting a lyric in which the artist uses a slur for their own group; and our blanket house rule of always substituting the initialism, always, in every context — including in a piece we're planning on reclamation. I suspect that last one does not survive the procedure, but if it does survive, say that too. Also: say plainly where the procedure misfires and what it can't settle, since whatever we adopt has to be explainable in one sentence to a reader who's angry about it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Chair of language standards group at a mid-sized nonprofit newsroom (~60 journalists + moderated comments).
      *   **Problem:** Inconsistent handling of slurs (20-40 requests/week). Duty editors decide in <10 mins with no training.
      *   **Need:** A *decision procedure* (flowchart/algorithm style), not an essay. Fast, actionable, distinct thresholds for "No," "Yes," and "Escalate."
      *   **Theoretical Basis:** Use semantics/pragmatics distinctions (use vs. mention, derogatory content vs. expressive force, speaker/hearer context) without academic jargon/citations.
      *   **Specific Edge Cases to Handle:** Reclaimed/in-group use (quoted), dog whistles (initialisms/emoji), contested reclamation (one group reclaims, another slurred), historical/cultural artifacts (docs, songs, places), absent target group.
      *   **Test Cases:**
          1.  Council member's voicemail (verbatim quote in news story).
          2.  Music review (artist using slur for own group).
          3.  House rule: "Always initialism" (even in reclamation pieces).
      *   **Requirement:** Identify where the procedure misfires/needs escalation and provide a one-sentence explanation for readers.

  2.  **Deconstruct the Linguistic/Pragmatic Distinctions:**
      *   *Use vs. Mention:* Are we using the word to insult, or mentioning it as data? (Quote vs. Narrative).
      *   *Derogatory Content vs. Expressive Force:* Is the hatred part of the truth conditions (rare for slurs) or the attitude conveyed (common)?
      *   *Speaker Identity:* Who said it? (Target group vs. Out-group).
      *   *Audience Impact:* Who hears it? (Target group harmed vs. General public informed).
      *   *Necessity:* Is the specific phonetic string required for the story's integrity?

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Attempt 1 (Mental Outline):* Is it a slur? Yes. Is it a quote? Yes. Print it. No? Don't. Wait, what about reclaimed? What about dog whistles? Too simple.
      *   *Attempt 2 (Adding Nuance):* Check if it's a dog whistle. Check if the speaker is from the group. Check if it's historical. Still feels messy. Need a linear flow.
      *   *Attempt 3 (Structuring for Speed):* Start with the highest barrier (Harm). Then move to Necessity. Then Context. Then Escalation.

      *   *Refining the "Dog Whistle" issue:* If someone writes "N***" or uses an emoji, is that printing the slur? Pragmatically, yes, it triggers the same cognitive association. The procedure needs to treat "evocation" same as "inscription."

      *   *Refining "Reclamation":* If an artist from Group X uses Slur-X against Group X, printing it preserves the art. If a reporter uses it, it's appropriation. The *source* matters more than the *word*.

      *   *Refining "Escalation":* When does the editor stop? When the harm/benefit balance isn't clear, or when policy contradicts the specific case (like the "Always Initialism" rule).

  4.  **Developing the Decision Procedure (The "Algorithm"):**

      *   *Step 1: Identification.* Is this a slur or a dog whistle? (Include emoji/initials).
      *   *Step 2: Function.* Are we *using* it (to insult/label) or *mentioning* it (reporting that it was said)? *Crucial distinction.*
      *   *Step 3: Source.* Who said it? (Target group vs. Outsider).
      *   *Step 4: Necessity.* Is the specific word essential to the story? (Evidence vs. Flavor).
      *   *Step 5: Harm Check.* Does printing it re-inflict harm on the target audience without adding proportional news value?

  5.  **Addressing the Test Cases:**

      *   *Case 1 (Council Voicemail):* Source is outsider (presumably). Function is evidence. Necessity is high (verbatim record). *Verdict:* Print with warning/context? Or bleep? Usually, news value of verbatim evidence outweighs harm *if* contextualized. But if it's gratuitous? Let's say "Print with warning" but check if the *point* is the slur itself.
      *   *Case 2 (Music Review):* Source is In-group (reclamation). Function is artistic analysis. Necessity is high (can't review lyric without lyric). *Verdict:* Print.
      *   *Case 3 (Blanket Initialism Rule):* This is a policy constraint. Does it survive? If the procedure says "Print" for reclamation, but policy says "Initialism," the procedure flags a conflict. *Verdict:* Fails. It prevents accurate reporting on reclamation.

  6.  **Refining the "Misfire" and "One Sentence" requirements:**
      *   Where does it break? When "News Value" is subjective. When the target community is not monolithic (some want it printed, some don't).
      *   One sentence explanation needs to be robust. "We print only when the word itself is the news, not when it is the vehicle."

  7.  **Finalizing the Structure:**
      *   **Preamble:** Define the scope (Use vs. Mention).
      *   **The Flowchart (Text-based):** Numbered steps with Go/No-Go/Escalate.
      *   **The Test Runs:** Applying the logic.
      *   **The Failure Modes:** Where human judgment is still needed.
      *   **The One-Sentence Policy:** For public facing explanation.

  8.  **Self-Correction during drafting:**
      *   *Critique:* Is "Dog Whistle" too hard for a 10-min decision?
      *   *Fix:* Make it a definition. If the reader *must* supply the slur to understand the insult, it counts as printing the slur.
      *   *Critique:* What about the "absent target group" case?
      *   *Fix:* Add a step about "Proxy Harm." Just because they aren't in the room doesn't mean they aren't the audience.
      *   *Critique:* The user wants semantic distinctions.
      *   *Fix:* Explicitly label steps with the pragmatic concept (e.g., "Use vs. Mention," "Expressive Content").

  9.  **Final Polish:** Ensure tone is professional, direct, and respects the user's expertise (they know the theory, they want the tool). (Self-correction: Keep the linguistic theory implicit in the logic but explicit in the labels so they know *why* the step exists).

      *(Self-Correction on Case 1)*: Council member voicemail. If the story is about the *policy*, the slur might be bleeped. If the story is about the *racism*, the slur is the evidence. The procedure needs to distinguish *why* we are quoting.
      *(Self-Correction on Case 3)*: The "Always Initialism" rule. If the procedure allows full spelling for reclamation analysis, the rule fails. I need to be clear that the rule is too blunt.

  10. **Final Review against constraints:**
      *   Decision procedure? Yes.
      *   No essay/citations? Yes.
      *   Semantic distinctions used? Yes (Use/Mention, Expressive/Descriptive).
      *   Specific edge cases covered? Yes.
      *   Three test cases run? Yes.
      *   Misfire points identified? Yes.
      *   One-sentence explanation? Yes.

      *Let's build the response.*
answer: |-
  ### The Slur Decision Procedure (SDP)

  **Scope:** Applies to all text, audio, video, and user-generated content moderated by the newsroom.
  **Time Limit:** 10 Minutes.
  **Authority:** Duty Editor (DE). Escalate to Standards Chair (SC) at Step 5.

  **Definitions for Speed:**
  *   **Use:** Employing the word to label or insult a target (e.g., "He is a [slur]").
  *   **Mention:** Reporting that the word was spoken, or analyzing the word itself (e.g., "He said the [slur]" or "The song contains the [slur]").
  *   **Dog Whistle:** Any string (initials, emoji, misspelling) that requires the reader to supply the slur to understand the insult. Treat these as **printing the slur.**
  *   **News Value:** Does the specific phonetic string provide evidence that a euphemism cannot?

  ---

  #### Step 1: The Dog Whistle Check (Pragmatic Equivalence)
  **Question:** Is the content an initialism, emoji, leetspeak, or euphemism where the *only* function is to evoke the slur without typing it?
  *   **YES:** Treat as if the full slur is printed. Proceed to Step 2.
  *   **NO:** Proceed to Step 2.
  *   **STOP (Reject):** If a commenter/user is doing this to bypass filters, delete/ban. Do not publish.

  #### Step 2: Use vs. Mention (Semantic Function)
  **Question:** Is the newsroom *using* the word to describe a person/situation, or *mentioning* it as data/evidence/art?
  *   **USE (We are applying the label):** **STOP.** Do not print. Substitute "the [racial/identity] slur" or describe the sentiment.
      *   *Exception:* Only if the story is *about* the word's usage in society (e.g., a linguistics piece). Escalate to SC.
  *   **MENTION (We are reporting it was said/sung/written):** Proceed to Step 3.

  #### Step 3: Source Identity & Reclamation (Expressive Content)
  **Question:** Who originated the word in the material we are quoting?
  *   **OUT-GROUP (Hostile use):** The speaker is not a member of the targeted group and is using it derogatorily. Proceed to Step 4.
  *   **IN-GROUP (Reclaimed/Artistic use):** The speaker is a member of the targeted group using it for reclamation, art, or intra-group description.
      *   **Action:** You may print the full word *if* Step 4 is met.
      *   **Note:** This overrides blanket "initialism only" rules. Accurate reporting on reclamation requires the reclaimed term.

  #### Step 4: Necessity & Evidence (Truth Conditions)
  **Question:** Is the specific word required for the audience to understand the gravity/evidence of the story, or does a redaction/initialism preserve the news value?
  *   **NO (Flavor/Shock):** The story works without the specific letters. (e.g., "He yelled a racial slur.") **STOP.** Redact or initialism.
  *   **YES (Evidence/Record):** The specific word is the evidence. (e.g., A voicemail proving harassment; a lyric being analyzed; a legal document where the specific wording is contested.)
      *   **Action:** You may print the full word.
      *   **Constraint:** Must include a content warning (audio/text) before the exposure.

  #### Step 5: Harm vs. Value Balance (Escalation Point)
  **Question:** Does printing the full word (even if justified above) risk re-inflicting trauma on the target audience disproportionate to the public's need to see it?
  *   **UNCLEAR / HIGH RISK:** **ESCALATE to Standards Chair.**
      *   *Triggers:* The target community is not monolithic (some demand printing, some forbid it); The story is about a marginalized group but no members of that group are on staff to consult; The "News Value" is borderline.
  *   **CLEAR LOW RISK:** Proceed to Publish with Warning.

  ---

  ### Test Cases

  #### Case 1: Council Member's Voicemail (Verbatim Quote)
  *   **Step 1:** Not a dog whistle. (Pass)
  *   **Step 2:** Mention. We are reporting what was said, not calling someone the slur ourselves. (Pass)
  *   **Step 3:** Out-Group. Council member (presumably) using it against a constituent/group. (Hostile)
  *   **Step 4:** Necessity. Is the story about the *policy* or the *misconduct*?
      *   If *Policy*: Redact. The slur is not evidence of the policy.
      *   If *Misconduct/Racism*: The slur *is* the evidence. Printing is necessary.
  *   **Step 5:** Harm Check. High visibility public official. Public interest is high.
  *   **Verdict:** **Print full word with audio bleep/text warning.** The news value (evidence of official misconduct) outweighs the harm, provided it is contextualized as evidence, not narrative.

  #### Case 2: Music Review (Artist quoting own lyric)
  *   **Step 1:** Not a dog whistle. (Pass)
  *   **Step 2:** Mention/Analysis. We are reviewing the art. (Pass)
  *   **Step 3:** In-Group. Artist is member of targeted group using reclaimed term. (Pass)
  *   **Step 4:** Necessity. You cannot review a lyric without quoting it. (Pass)
  *   **Step 5:** Harm Check. Low. Context is artistic expression/reclamation.
  *   **Verdict:** **Print full word.** The "Always Initialism" house rule must yield here to accurately report on the art and the reclamation context.

  #### Case 3: House Rule ("Always Initialism, Even in Reclamation Pieces")
  *   **Step 1:** N/A.
  *   **Step 2:** Mention.
  *   **Step 3:** In-Group/Reclamation.
  *   **Step 4:** Necessity. To report on reclamation, you must show *what* is being reclaimed. "The N-word" obscures the linguistic act of reclamation.
  *   **Verdict:** **The Rule Fails.** It violates Step 3 and Step 4. It prevents accurate reporting on in-group dynamics and artistic intent. It treats reclaimed use (expressive/solidarity) identical to hostile use (derogatory/harmful), which is semantically false.
  *   **Recommendation:** Amend rule to "Always Initialism *except* when reporting on reclamation, linguistics, or when the word itself is the primary evidence of misconduct."

  ---

  ### Failure Modes & Escalation

  **Where the Procedure Misfires:**
  1.  **Non-Monolithic Targets:** When Group X is the target, but half of Group X wants the word printed (transparency) and half wants it redacted (safety). The procedure cannot weigh internal community debate. **Escalate.**
  2.  **Historical Distance:** When a document is 100 years old. The harm is lower, but the "evidence" value is also lower. The procedure leans toward printing; human judgment may lean toward redaction for sensitivity. **Escalate.**
  3.  **The "Absent Target" Problem:** When the story is about a group not currently represented in your newsroom or comment section. You cannot assess "Harm" (Step 5) accurately. **Escalate.**

  **The One-Sentence Explanation for Readers:**
  > "We print the word only when the word itself is the evidence or the subject of the story; we redact it when it is merely the vehicle for an insult."

  **Why this works:** It distinguishes *mention* (word is subject) from *use* (word is vehicle) without using linguistic jargon. It explains why we print it in a trial transcript (evidence) but not in a summary of a fight (vehicle).
