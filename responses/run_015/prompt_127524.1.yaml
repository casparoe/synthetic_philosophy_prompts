  everyone repeats the same examples (the smoker telling someone to quit, the politician yelling about corruption) and nobody moves. my working theory is that this isn't really about hypocracy at all, but about whether moral blame needs some relational 'clean hands' property, or whether it's just a factual report that harm occured. but i might be wrong.

  can you diagnose why this debate is stalled? are they disagreeing about what blame does — expressive vs. corrective — about a hidden empirical claim about how people actually respond to hypocrites, or are they just answering different questions (one about social legitimacy, one about moral correctness) under the same word 'standing'? and given that diagnosis, is there actually a distinction or experiment or formal result that could break the deadlock, or is it just bedrock intuitions about fairness that won't budge?
