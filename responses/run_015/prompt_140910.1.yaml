          4.  **Model Diversity:** Require distinct model architectures for the two debaters to mitigate shared blind spots (Issue 3).
      *   *Status Quo:* Acknowledge current 66% inter-rater reliability is unacceptable long-term, so innovation is necessary.
      *   *Timeline:* Semester 1 (Tech setup + Seed injection), Semester 2 (Full rollout + Mid-point review).

  6.  **Review against Constraints:**
