          *   *Issue 3 (Shared Blind Spots):* Need external validation.
          *   *Issue 4 (Incentives):* Acknowledge but don't dwell.
          *   *Issue 5 (Status Quo):* Acknowledge current system is flawed, so change is needed, but not at the cost of validity.
      *   **Falsifiable Condition:** This is crucial. Need a metric. Idea: Insert "golden seed" answers where the correct grade is known by experts but hidden from judges. If judges deviate based on AI rhetoric on these seeds, the system fails.
      *   **Timeline:** Two semesters as proposed, but with mid-point review.
      *   **Closing:** Reiterate commitment to assessment integrity.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check Word Count:* Need to stay between 700-900.
      *   *Check Tone:* Professional, decisive, nuanced.
      *   *Check Specific Instructions:*
          *   Don't just say "pushes the problem up a level." Explain it: It shifts the burden from knowing CS to knowing AI rhetoric.
          *   Don't let TA job loss be the main argument.
          *   Acknowledge status quo flaws.
          *   Include falsifiable condition.

  5.  **Drafting - Step-by-Step:**

