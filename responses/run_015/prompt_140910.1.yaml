      *   **Mechanism:** Two AI systems argue for high/low scores based on rubric/student answer. A human grader (who doesn't know the material) picks the winner. That verdict becomes the grade.
      *   **Goal:** Reduce TA staffing needs while keeping essay exams.
      *   **Key Issues Identified:**
          1.  Accuracy is high on obvious disagreements, low on subtle rubric-weighting disagreements. CS wants to route only high-disagreement items, undermining time savings.
          2.  Free-form follow-ups help factual disputes but hurt rubric disputes (reframing risk). Fix: Fixed menu templates.
          3.  Shared base model risk (shared blind spots) vs. vendor claim (adversarial setup decorrelates).
          4.  Incentive wrinkle: Judges are TAs whose jobs might be cut.
          5.  Status quo baseline is messy (2/3 inter-rater reliability, rarely audited).
      *   **Constraints & Tone:**
          *   Length: 700–900 words.
          *   Audience: Committee members.
          *   Decision: Approve, Reject, or Approve-with-Conditions (needs actual timeline/conditions).
          *   Core Argument: Focus on whether the judge is tracking facts or just fluency/confidence (epistemic authority), not just standard integrity/job loss arguments.
          *   Avoid: Empty slogans like "pushes the problem up a level" without explanation.
          *   Honesty: Acknowledge flaws in the status quo (it's not reliable either).
          *   Requirement: At least one falsifiable condition/metric for the pilot to distinguish "tracking truth" vs. "being persuaded."

  2.  **Determine the Decision:**
      *   *Reject?* Too blunt. The status quo is admitted to be unreliable (2/3 agreement). Rejecting leaves us with a broken system.
      *   *Approve?* Too risky given the subtle disagreement failure rate and shared blind spots.
      *   *Approve-with-Conditions?* Best fit. Allows experimentation but mitigates the specific epistemic risks identified. It aligns with the request for "actual timeline and conditions."

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
