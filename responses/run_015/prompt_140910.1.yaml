answer: |-
  **TO:** Assessment Review Committee
  **FROM:** [Your Name/Role]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Memo: CS Department Debate Grading Pilot

  **Decision:** Approve with Conditions

  The Committee recommends approving the Computer Science Department's proposal for a two-semester pilot of "debate grading," subject to the specific modifications and validation metrics outlined below. We recognize the department's constraint: maintaining essay-based assessment in large courses without sufficient subject-matter TA staffing. We also acknowledge the honest admission regarding our status quo. Current inter-rater reliability sits at approximately 66%, with minimal auditing. Retaining a system we collectively agree is unreliable is not a viable alternative. However, approval is contingent on resolving the epistemic risks inherent in delegating judgment to non-experts.

  **The Core Epistemic Risk**
  Our primary concern is not the usual discourse on academic integrity or TA displacement, though those remain relevant. The fundamental issue is whether a judge who cannot independently verify the subject matter is tracking the facts of the student's paper or merely selecting the more fluent argument. 

  Critics often argue that adversarial AI "pushes the problem up a level." In this specific pilot, that slogan translates to a concrete risk: the assessment shifts from measuring student CS knowledge to measuring the human judge's ability to detect AI rhetoric. If the judge lacks the technical knowledge to verify claims, confidence and fluency become proxies for correctness. The validation data supports this concern; judge verdicts matched instructor grades on obvious disagreements but fell to barely above chance on subtle rubric-weighting disputes. If the system only works where the answer is already clear, it does not solve the staffing bottleneck for complex grading.

  **Conditions for Approval**
  To mitigate these risks, the CS Department must adhere to the following conditions:

  1.  **Interaction Restrictions:** Following the validation data showing decreased accuracy on rubric disputes during free-form follow-ups, judges must be restricted to a fixed menu of question templates when querying debaters on rubric weighting. Free-form questioning is permitted only for factual disputes (e.g., "Did the code compile?"), where accuracy improved.
  2.  **Model Diversity:** To address the risk of shared blind spots from using the same base model, the two debaters must be drawn from distinct model architectures or distinct preference-tuning sets. The vendor's claim that adversarial setup decorrelates them is insufficient without empirical evidence of divergent error modes.
  3.  **Routing Transparency:** The department proposes routing only high-disagreement items to debate. We require a mid-semester report detailing the volume of these items. If high-disagreement items constitute more than 40% of the total grading load, the pilot must be paused. If the hard cases require full human review anyway, the promised efficiency gains are illusory.
  4.  **Incentive Mitigation:** We note the incentive wrinkle wherein judges are TAs whose hours this system may reduce. To prevent unconscious bias or sabotage, judges will be blinded to the pilot's staffing goals and compensated at a fixed rate unrelated to grading volume during the pilot period.

  **Falsifiable Validation Metric**
  The committee requires a falsifiable condition to distinguish whether judges are tracking truth or persuasion. During both semesters, the department must inject "golden seed" submissions into the grading pool. These are student answers pre-graded by senior faculty with unanimous agreement on the correct score and rubric weighting. These seeds will be processed through the debate system like any other paper.

  **Stop Signal:** If the judge's verdict on golden seeds diverges from the expert consensus by more than one grade band in instances where the AI debaters presented conflicting arguments, the pilot will be terminated immediately. This metric specifically tests whether the judge is swayed by rhetorical confidence over factual correctness when they lack the expertise to verify the content.

  **Timeline**
  *   **Semester 1:** Implementation of model diversity and template restrictions. Injection of golden seeds (5% of pool). Mid-semester review of routing volumes.
  *   **Semester 2:** Full rollout if Semester 1 metrics are met. Final audit comparing debate grades against instructor audits on a random 10% sample.
  *   **Post-Pilot:** Final report due June 1, assessing whether the system improved reliability over the 66% baseline without compromising epistemic validity.

  We approve this pilot not because we are convinced it will work, but because the alternative is maintaining a broken baseline. However, we must ensure that in solving for scalability, we do not replace human error with automated persuasion.

  **Recommendation:** Approve with Conditions.
