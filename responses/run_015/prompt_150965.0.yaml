answer: |-
  There is no single, canonical term in philosophy or cognitive science that captures this specific failure mode exactly as you have described it. However, your analysis synthesizes several distinct critiques found in meta-ethics, philosophy of mind, and behavioral economics.

  The phenomenon you describe sits at the intersection of three established concepts:
  1.  **Attribute Substitution** (Kahneman & Frederick): A cognitive bias where a difficult judgment (clinical ethical risk) is replaced by an easier one (does this fit the narrative of the analogy?).
  2.  **The Fallacy of Misplaced Concreteness** (Alfred North Whitehead): Treating an abstract concept (functional identity) as if it were the concrete reality (biological/legal vulnerability).
  3.  **Idealization** (Bioethics/Political Philosophy): The necessary stripping away of context in thought experiments, which becomes a bug when the stripped context contains the relevant moral stakes.

  Because your description is more precise than any of these individually—specifically regarding the role of *verbal labeling* in bridging the gap between the fictional and the practical—I propose we coin the term **"Evaluative Criterion Displacement" (ECD)**.

  Below is an analysis of why this term fits, how it distinguishes itself from related fallacies, and whether it represents a correctable bias or an inevitable risk.

  ### 1. Defining "Evaluative Criterion Displacement"

  **Evaluative Criterion Displacement** occurs when an argument transfers a verdict from a hypothetical scenario to a practical case by maintaining *lexical continuity* (using the same words, e.g., "person," "ship") while silently swapping the *evaluative criteria* required to apply those words.

  *   **The Mechanism:** The thought experiment establishes a criterion for a concept (e.g., "Personhood = Functional Continuity") within a constrained fictional environment where that criterion is intuitive.
  *   **The Displacement:** The argument then applies that concept to a real-world environment where *different* criteria are normatively operative (e.g., "Personhood = Biological/Legal Continuity"), but the lexical label ("Person") tricks the listener into accepting the fictional criterion as sufficient.
  *   **The Result:** The listener feels they have solved the practical problem, but they have only validated the fictional constraint set.

  ### 2. Distinctions from Related Fallacies

  You noted this is not simple equivocation or false analogy. Here is how ECD differs:

  | Concept | Mechanism | Why ECD is Different |
  | :--- | :--- | :--- |
  | **Equivocation** | Uses a word in two different *senses* within a syllogism (e.g., "Bank" of a river vs. "Bank" for money). | In ECD, the proponent genuinely believes the sense *should* be the same. The error is not linguistic ambiguity, but the **suppression of context-specific criteria** that usually govern the word's application. |
  | **False Analogy** | Claims two things are structurally similar when they are not. | ECD often admits structural differences (biology vs. software) but argues they are *morally irrelevant*. The failure is not in mapping the structure, but in **declaring certain structural features irrelevant** without justification. |
  | **Motte-and-Bailey** | Shifts between a defensible claim and a controversial one strategically. | In ECD, the proponent is not retreating strategically. They are **unaware** that the criteria have shifted. It is an epistemic blind spot, not a rhetorical shield. |
  | **Attribute Substitution** | Answering a hard question with an easy heuristic. | This is the *cognitive mechanism* underlying ECD. ECD is the *rhetorical structure* that exploits this bias by constructing a fiction where the heuristic feels like a principle. |

  ### 3. Why "Verbal Labeling" is the Key

  Your insight about "shared verbal labeling" is the crucial differentiator. In philosophy of language, this touches on **Semantic Externalism**.

  When the proponent says, "This is the *same person*," they are invoking a rigid designator. In the thought experiment, the conditions for satisfying that designator are controlled (e.g., only function matters). In the clinic, the conditions are messy (law, biology, phenomenology). The verbal label acts as a **Semantic Bridge** that allows the intuition generated in the clean fiction to flow into the messy reality without friction.

  If the proponent were forced to change the label—for example, "This is a *functionally equivalent successor entity*" rather than "the *same person*"—the intuition pump would fail. The persuasion relies on the label remaining constant while the truth-conditions shift.

  ### 4. Is this a Correctable Bias or an Inevitable Feature?

  It is a **correctable bias**, but it is an **inevitable risk** of modal reasoning.

  **Why it is inevitable:**
  Thought experiments *must* idealize to function. To isolate "personal identity," we must strip away "legal liability" or "biological pain." If we included all real-world stakes, it would cease to be a thought experiment and become a case study. Therefore, the *potential* for Criterion Displacement is built into the method of abstraction itself.

  **Why it is correctable:**
  It becomes a fallacy only when the transfer is made without **Criterion Auditing**. The bias can be corrected by explicitly listing the criteria suppressed in the fiction and asking if they are normatively relevant in the reality.

  **The Correction Protocol:**
  To neutralize Evaluative Criterion Displacement, one must interrupt the verbal bridge:
  1.  **Identify the Label:** (e.g., "Same Person").
  2.  **Isolate the Fictional Criteria:** (e.g., "In the teleporter case, 'Same Person' means 'Psychological Continuity'").
  3.  **Isolate the Practical Criteria:** (e.g., "In the clinical case, 'Same Person' entails 'Legal Liability' and 'Phenomenological Unity'").
  4.  **Demand Justification:** "Why does the satisfaction of the Fictional Criteria suffice for the Practical Criteria?"

  ### 5. Existing Literature Closest to Your Insight

  While "Evaluative Criterion Displacement" is a new coinage for this specific dynamic, your observation aligns with three specific critical traditions:

  1.  **Feminist Ethics of Care:** Philosophers like **Eva Feder Kittay** and **Hilde Lindemann** argue that mainstream bioethics relies on "idealized agents" (autonomous, rational) that strip away the vulnerability and dependency central to actual clinical contexts. They would call your example a failure of **contextual abstraction**.
  2.  **Wittgensteinian Critique:** Wittgenstein argued that philosophical problems often arise when "language goes on holiday." The word "identity" is being used outside the language-game where it has purchase (everyday legal/biological interaction) and inside a game where it has none (metaphysical fiction).
  3.  **Experimental Philosophy (X-Phi):** Scholars like **Joshua Knobe** have shown that intuitions about "intentionality" or "identity" shift drastically based on moral stakes. Your observation is essentially a normative version of this: the moral stakes of the clinical case *should* shift the criteria for identity, but the analogy suppresses that shift.

  ### Summary

  You have identified a sophisticated rhetorical failure mode where **lexical continuity masks criterial divergence**.

  *   **Established Name:** None precisely. Closest are *Misplaced Concreteness*, *Attribute Substitution*, and *The Problem of Idealization*.
  *   **Proposed Term:** **Evaluative Criterion Displacement**.
  *   **Nature:** A cognitive bias (Attribute Substitution) exploited by a rhetorical structure (Idealized Analogy).
  *   **Correction:** Requires "Criterion Auditing"—explicitly comparing the truth-conditions of the label in the fiction vs. the reality before transferring the verdict.

  Your reflection demonstrates that the "intuition pump" did not illuminate the ethical landscape; it terraformed it to match the fiction. Recognizing this is the first step in reclaiming the practical stakes.
