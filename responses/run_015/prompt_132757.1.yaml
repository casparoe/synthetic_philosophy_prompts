answer: |-
  Mara: Let's return to the metaphysical foundation. If sovereign right is coextensive with power, then democracy is the absolute form of government simply because it aggregates the most power. The transition from the state of nature to the civil state is a quantitative shift, not a qualitative one. We are adding together individual *conatus*, not transforming them into something else. Therefore, the democratic sovereign doesn't need the multitude to achieve rational agreement through common notions; it just needs their powers to be structurally aligned so they don't cancel each other out.

  Elias: But that aggregation is precisely the problem. If you simply sum individual *conatus* governed by inadequate ideas, you don't get a stable whole; you get a collision of passions. Spinoza is clear that affects driven by external causes are fluctuating and contradictory. A mob has great power, but it is self-undermining power. For the state to persist—and thus to maintain its right—the collective power must be oriented toward what is truly useful, which requires adequate ideas. Without that orientation, you haven't established a sovereign; you've just established a temporary imbalance of forces.

  Mara: You're assuming that stability requires rational unanimity, but Spinoza's institutional design suggests otherwise. Look at the recommendations for large councils and rotation in office. These aren't designed to filter for philosophers; they are designed to ensure that no single passion dominates. If one faction is driven by hope and another by fear, the institutional structure forces a compromise that mimics rational decision-making without requiring the citizens to actually possess adequate ideas. The conflict of passions produces a stable outcome through mechanics, not metaphysics.

  Elias: Mechanics alone cannot sustain a state against internal dissolution. If the members of those councils share no adequate ideas, their compromises are merely temporary truces between enemies, not laws binding a citizenry. Spinoza's restrictions on property qualifications and his emphasis on secret ballots aren't just about balancing passions; they are attempts to approximate rational governance by limiting the domains where immediate affective reactions can dictate policy. He knows the multitude is largely governed by imagination, so he builds constraints that force them to act *as if* they were rational. That implies the validity of the democracy depends on this hidden aristocracy of reason embedded in the structure.

  Mara: But if the validity depends on reason, then you've collapsed democracy back into aristocracy. Spinoza distinguishes the regimes based on who holds sovereignty. In an aristocracy, a select group rules; in a democracy, the whole multitude rules. If you argue that the democratic state is only legitimate or stable when guided by adequate ideas held by a few or simulated by constraints, you're saying the democratic form is redundant. Why not just advocate for the aristocracy of the rational explicitly? The whole point of the democratic claim is that it preserves natural right most fully precisely because it doesn't demand that people cease being passionate beings.

  Elias: Because an aristocracy of the rational is unstable in practice—it fractures into factions competing for the title of "rational." Democracy is the only form that can stabilize reason because it grounds sovereignty in the actual power of the multitude. But—and this is the crux—that power must be transformed. The transition isn't just quantitative aggregation; it's the composition of relations. If the relations remain governed by inadequate ideas, the state is always on the verge of returning to the state of nature. The institutional constraints aren't a hidden aristocracy; they are the mechanism by which the multitude elevates its own *conatus* from passive affects to active reasoning. Without that qualitative shift, the "power" you speak of is just the capacity for self-destruction.

  Mara: Yet Spinoza insists that the sovereign cannot command minds. If the state requires citizens to possess adequate ideas to function, it oversteps its power. The popular-affective reading respects the limit of sovereignty: the state manages actions, not thoughts. By relying on the balance of affects, the democratic council respects the natural right of the passionate multitude. Your reading requires the state to cultivate reason to survive, which risks tyranny because it demands a transformation of human nature that the sovereign cannot enforce. The democracy works *with* inadequate ideas, not against them.

  Elias: It works with them only insofar as it redirects them toward common notions. If the sovereign ignores the cognitive quality of its subjects, it loses the ability to predict and channel their power. A state governed purely by aggregated passion is impotent because it cannot form a consistent plan of action; it reacts rather than acts. Spinoza's freedom is not just the absence of external constraint but the presence of internal necessity derived from reason. A democracy that ignores this is not preserving natural right; it is forfeiting the power that constitutes that right. The institutions are there to ensure that the collective mind moves from imagination toward reason, however gradually.

  Mara: But that gradual movement is a hope, not a condition of sovereignty. You are conflating the ideal free state with the actual democratic state. The actual state derives its right from the power it actually holds, not the power it would hold if everyone were rational. If you make rational orientation a condition for the validity of democratic sovereignty, you make democracy contingent on an ethical achievement that may never occur. Spinoza's realism suggests he accepts the democracy of the passionate because there is no other option, not because it is a stepping stone to an elite rationality.

  Elias: And my realism suggests that a democracy of the passionate is a contradiction in terms because passion divides while reason unites. You cannot have a sovereign multitude if the multitude is fundamentally divided by incompatible affects. The "absolute" form of government is absolute only if it can sustain itself. It sustains itself only through common notions. Therefore, the institutional recommendations are not merely passion-balancing tools; they are epistemic filters. If they fail to produce outcomes aligned with adequate ideas, the democracy fails, regardless of how many people participate.

  Mara: Then you are judging the regime by its output rather than its constitution. Spinoza defines the regime by who holds the right to rule. If you say the many hold the right only when they rule wisely, you have changed the definition of democracy to mean "rule by the wise," regardless of the number. That erases the specific political innovation Spinoza is offering: that the aggregation of natural power is sufficient for right, even if that power is cognitively flawed.

  Elias: I am judging the regime by its power, and power is the capacity to persist. A regime that does not orient itself toward adequate ideas lacks the capacity to persist. Therefore, it lacks power, and therefore it lacks right. The composition of the multitude into a single body requires a unity of mind that mere aggregation cannot provide. That unity is found only in common notions. So, while the many may hold the office, the authority they wield must be grounded in reason to be actual sovereignty rather than mere force.

  \answer{The two interpretations remain irreconcilable on whether the sovereign's power is constituted by the raw aggregation of natural right regardless of cognitive quality, or whether that power only becomes politically viable when qualitatively transformed by adequate ideas.}
