answer: |-
  Here is a conceptual map of the slogan **"Those subject to coercive law ought to author it."** You are right to suspect it conflates distinct premises. Depending on how you define "subject," "coercive law," and "author," the principle either reinforces state borders or dissolves them entirely.

  Below are four distinct readings, broken down by their logical structure, their treatment of your specific cases, and their boundary implications.

  ### 1. The Juridical Reading (Formal Status)
  *   **The Logic:** Conceptual. "Subject to" means formally falling under the state's jurisdiction. Coercion is the legitimate monopoly on violence defined by legal status.
  *   **The Boundary:** Draws strictly at **state lines and legal classification**.
  *   **Undocumented Immigrants:** **Excluded.** Unless they have formal residency status, they are technically "outside" the legal order, even if physically present. They are objects of enforcement, not subjects of the law.
  *   **Short-Term Visitors:** **Included.** Tourists are formally subject to local laws (you can arrest them for theft). However, you can exclude them if you argue "authorship" requires permanent membership, not transient subjection.
  *   **Global Workers/Climate Refugees:** **Excluded.** They are outside the jurisdiction.
  *   **Verdict:** This is the safest reading for maintaining current borders, but it fails to capture the moral intuition that undocumented people *are* coerced by the state.

  ### 2. The Enforcement Reading (Empirical Fact)
  *   **The Logic:** Empirical/Descriptive. "Subject to" means actually encountering the state's force. If the police can detain you, deport you, or seize your property, you are subject.
  *   **The Boundary:** Draws at **physical presence and enforceability**.
  *   **Undocumented Immigrants:** **Included.** They are directly targeted by state coercion (raids, deportation). The law binds them in practice, if not in theory.
  *   **Short-Term Visitors:** **Included.** They are subject to traffic stops, customs, and criminal law while present. To exclude them, you must argue that temporary coercion doesn't trigger a right to *authorship*, only compliance.
  *   **Global Workers/Climate Refugees:** **Excluded.** Unless the state projects force extraterritorially (e.g., drone strikes, border patrols abroad), these groups do not face direct enforcement.
  *   **Verdict:** This is the strongest reading for including undocumented immigrants without opening the door to global democracy. It keeps the boundary at the point where the state's guns actually show up.

  ### 3. The Autonomy Reading (Normative Moral Agency)
  *   **The Logic:** Normative/Kantian. Coercion violates autonomy unless the coerced agent has consented to the law. To remain free, one must be a co-legislator.
  *   **The Boundary:** Draws at **moral agency within a coercive regime**.
  *   **Undocumented Immigrants:** **Included.** Their autonomy is compromised by laws they had no hand in making. Justice requires they be brought into the authorship circle.
  *   **Short-Term Visitors:** **Ambiguous/Excluded.** You can argue that temporary subjection does not sufficiently compromise their overall autonomy to require full political authorship. Their "life plan" isn't bound by the state long-term.
  *   **Global Workers/Climate Refugees:** **Excluded.** Unless you argue that foreign states fundamentally undermine their autonomy (a high bar), their primary coercive relationship is with their *own* state, not yours.
  *   **Verdict:** This licenses including undocumented immigrants based on moral respect rather than physical presence. It survives the state boundary unless you argue that global economics destroys autonomy universally.

  ### 4. The Structural Reading (Causal Impact)
  *   **The Logic:** Metaphysical/Sociological. "Coercion" is not just force; it is the structural shaping of life options. If a state's policies determine your survival, you are subject to them.
  *   **The Boundary:** Draws at **causal impact** (bleeds into the "All Affected Principle").
  *   **Undocumented Immigrants:** **Included.**
  *   **Short-Term Visitors:** **Included.**
  *   **Global Workers/Climate Refugees:** **Included.** If U.S. trade policy destroys local livelihoods or U.S. emissions drive climate migration, those workers are "subject" to U.S. power structures.
  *   **Verdict:** This reading collapses the state boundary. It turns the demos seminar into a global justice seminar. It makes the slogan impossible to implement within a nation-state framework.

  ---

  ### Summary Matrix

  | Reading | Undocumented Immigrants | Short-Term Visitors | Global Supply/Climate Workers | Boundary Logic |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Juridical** | Exclude | Include (usually) | Exclude | Legal Status / Borders |
  | **2. Enforcement** | **Include** | Include (usually) | Exclude | Physical Force / Borders |
  | **3. Autonomy** | **Include** | **Exclude** (if transient) | Exclude | Moral Agency / Regime |
  | **4. Structural** | **Include** | **Include** | **Include** | Causal Impact / Global |

  ### Where the Argument Breaks
  *   **To include undocumented immigrants without going global:** Stick to **Reading 2 (Enforcement)** or **Reading 3 (Autonomy)**. These rely on the specific coercive relationship between the individual and the state apparatus within the territory.
  *   **To exclude short-term visitors:** You must use **Reading 3 (Autonomy)** and add a "continuity" clause. Argue that authorship is only owed to those whose *life plans* are bound by the law, not those merely passing through.
  *   **Where it falls apart:** **Reading 4 (Structural)**. Once you define "coercion" as "structural impact on options," you cannot stop at the border. Supply-chain workers in Bangladesh are subject to U.S. corporate law and trade policy. If you use this reading, you cannot defend a closed border without contradicting the slogan.

  ### Recommendation for the Seminar
  If you want to push back on open borders *and* closure-only views without committing to global democracy, combine **Reading 2** and **Reading 3**.

  Argue that undocumented immigrants are subject to *direct enforcement* and have their *autonomy bound* long-term, whereas short-term visitors do not, and global workers are not subject to *direct state coercion* (only market forces). This keeps the boundary at the state's enforceable jurisdiction while acknowledging the moral claim of those living within it without status.
