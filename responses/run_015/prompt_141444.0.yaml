answer: |-
  The primary explanatory job of proper function attributions is to explain the presence of a trait type in a population by referencing its history of selection. To say a trait has a function is to say it is there *because* ancestors performed that effect. In the case of the lancet cell, attributing a proper function fails this job. The lancet cell type is not present because past lancet cells defended colonies; it is present because past fragile sites produced them. The explanatory weight rests entirely on the heritable site, not the somatic product. To assign a function to the cell is to misidentify the locus of selection. Consequently, we should categorize lancet cells not as functional traits, but as *adaptive outputs*. They are beneficial effects of a functional mechanism, distinct from the mechanism itself. This is not a terminological concession; it preserves the distinction between the unit of selection (the genome/site) and the phenotypic expression (the cell). Collapsing this distinction obscures the evolutionary mechanism, implying a lineage of cells where there is only a lineage of developmental potentials.

  The etiological theorist's standard escape hatch is to allow the cell to borrow function from the selected mechanism that produces it. Since the fragile site is selected for producing lancet cells, the cells might inherit the function of colony defense. This move must be rejected because it proves too much. If any output of a selected mechanism inherits proper function, then every reliable byproduct becomes functional. Consider a heart selected for pumping blood, which reliably produces thumping sounds that scare predators. The heart mechanism is selected for pumping, but if outputs inherit function, the sounds acquire a proper function simply by being produced by a selected organ. This erodes the crucial boundary between selected effects and beneficial byproducts, a boundary both accounts need to maintain. In the lancet case, allowing borrowing implies that the cell itself is the unit of evolutionary assessment. It is not. The cell is ephemeral; the site is the enduring target of selection. Borrowing function here treats the somatic product as if it were a replicator, conflating the vehicle of selection with its immediate phenotypic consequence.

  This verdict faces an objection from normativity. The etiological account is prized for grounding malfunction: a trait malfunctions when it fails to perform its selected effect. If lancet cells have no proper function, a cell that misfires cannot be defective. This seems to lose a vital normative grip. However, the position survives by relocating the normativity. The standard of correctness attaches to the heritable fragile site, not the somatic cell. A site that reliably produces misfiring cells is defective; a site producing working cells is functional. The individual cell is merely the test case for the site's functionality. To call the cell itself "defective" is a shorthand for saying it fails to meet the standard set by the site's selection history. We do not need to grant the cell its own proper function to preserve the judgment that it failed to perform. The normativity is inherited from the mechanism, but the *function* remains with the mechanism. This preserves the explanatory power of malfunction claims without falsely attributing evolutionary history to the somatic token.

  The causal-role theorist's strongest reply is that working biologists attribute functions based on current capacity, not history. A field biologist writing that "the function of the lancet cell is defense" is describing how the colony works now, not making a claim about selection history. To deny this is to read historical claims into ahistorical practice. The reply fails because it conflates two distinct explanatory projects. Biologists often speak loosely, but when they model evolutionary stability, they must distinguish between what a trait *does* and why it is *there*. The causal-role account captures the former, the etiological the latter. If we accept the causal-role verdict as sufficient, we lose the ability to distinguish between traits maintained by selection and traits maintained by developmental constraint or drift that happen to be useful. The lancet cell case exposes this: the cell contributes to capacity, but only the site explains the presence. Insisting on the etiological verdict forces precision where loose talk hides the mechanism. We should respect the biologist's capacity talk as valid regarding system dynamics, but refuse to elevate it to "proper function" when explaining evolutionary presence.

  **Coda**

  The premise I am least confident in is the claim that relocating normativity to the fragile site fully preserves the intuition that a misfiring cell is defective. It risks making defectiveness a property of the genotype only, leaving the phenotype normatively inert. What would change my mind is observing actual biological practice where somatic traits are treated as independent units of selection in evolutionary models—for instance, if researchers successfully model the lineage of lancet cells themselves as evolving via somatic selection distinct from the germline site. If the practice treats the cell lineage as the target of selection, my distinction between site and output collapses.
