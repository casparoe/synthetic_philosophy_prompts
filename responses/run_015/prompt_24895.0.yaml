      2.  *Functional Parity:* Substantive. Clark & Chalmers' "Inga vs. Otto" argument. Defensible but requires strict criteria (availability, trust, automatic endorsement).
      3.  *Constitutive Extension:* Controversial. The "Coupling-Constitution Fallacy" (Adams & Aizawa). Is it *part* of the memory or just *used* by memory?
