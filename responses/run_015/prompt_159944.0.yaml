answer: |-
  ### 1. The Order

  Your instinct to separate the technical and broader problems is correct, but the transition point is critical. If you solve the technical problem too cleanly, the broader problem looks like a different topic entirely. If you introduce the broader problem too early, they lack the formal context to see why it's a "problem" for AI specifically.

  **Sequence of Moves:**

  1.  **The Planning Recap (5 mins):**
      *   *Move:* Re-establish the classical planning model they saw in lecture. State = list of true propositions. Action = deletes some, adds some.
      *   *Prerequisite:* They must accept that the computer sees the world *only* as this list.
      *   *Withhold:* Do not mention time or persistence yet.

  2.  **The Logical Burden / Technical Frame Problem (10 mins):**
      *   *Move:* Show that to deduce the *next* state, the logic requires explicit confirmation that everything else stayed the same. Use a tiny state (3 facts) to show you need 2 frame axioms. Scale to 1,000 facts to show you need 999 axioms per action.
      *   *Prerequisite:* They must understand that in logic, what isn't stated isn't true (or derivable).
      *   *Block:* **The Cost Misconception.** Explicitly state: "This is not about memory space. Even with infinite memory, if the axiom isn't there, the deduction fails."

  3.  **The Formal Fix (5 mins):**
      *   *Move:* Describe (do not derive) the standard AI solution: Successor State Axioms. Essentially, we change the representation so we only list what *changes*, and the logic assumes persistence by default.
      *   *Prerequisite:* They must feel the pain of the previous step.
      *   *Withhold:* Do not claim this solves the *whole* problem. Present it as "The Engineer's Solution."

  4.  **The Relevance Gap / Philosophical Frame Problem (15 mins):**
      *   *Move:* Switch goals in your carrying example. Show that while the Engineer's Solution handles *persistence*, it does not tell the agent which of those persistent facts *matter* for the new goal.
      *   *Prerequisite:* They must believe the Technical Problem is "solved" enough to move on.
      *   *Block:* **The "Solved" Misconception.** This is the pivot. "We fixed the logic, but we haven't fixed the thinking."

  5.  **The Stakes (10 mins):**
      *   *Move:* Connect to cognition. If relevance isn't intrinsic, how do humans do it? Briefly touch on the computationalism argument.
      *   *Prerequisite:* They must grasp that relevance is goal-relative.
      *   *Block:* **The Holism Misconception.** Ensure they don't leave thinking "everything connects to everything."

  **What to Withhold:**
  Withhold the distinction between the Technical and Philosophical problems until Move 4. Call it all "The Frame Problem" initially. If you label them "TFP" and "PFP" at the start, they will compartmentalize them as two separate topics rather than seeing the second as the shadow of the first.

  ### 2. The Carrying Example

  **Critique of the Robot/Battery/Wagon/Bomb:**
  Discard it. It is historically contaminated by the *Qualification Problem* (what if the wagon is bolted down?) and the *Ramification Problem* (the bomb explodes, which is a change, not a non-change). It is difficult to make the bomb's relevance "flip" based on a goal without changing the physical setup. It encourages students to think about danger rather than relevance.

  **Proposed Scenario: The Smart Door Lock**
  This scenario is domestic, computationally clear, and allows for clean state separation.

  *   **The Setup:** An automated door lock in a secure building.
  *   **The Action:** `Unlock_Door`.
  *   **The State Description (Simplified):**
      1.  `Bolt_Retracted` (Local, Mechanical)
      2.  `Access_Log_Updated` (Remote, Server)
      3.  `Security_Alarm_Armed` (Local, System)
      4.  `Dust_Particle_Count` (Local, Environment)
      5.  `Owner_Sleeping` (Remote, Biometric Sensor)

  *   **The Consequences (Meeting your constraints):**
      1.  **Close & Irrelevant:** `Dust_Particle_Count`. The air shifts when the door opens. It is physically immediate but rarely bears on the action's success.
      2.  **Far-flung & Relevant:** `Access_Log_Updated`. The action triggers a database write in a cloud server. It is physically distant but constitutive of the action's function.
      3.  **The Relevance Flipper:** `Security_Alarm_Armed`.
          *   *Goal 1 (Enter Building):* Alarm status is irrelevant (assuming authorized entry).
          *   *Goal 2 (Stealth Entry):* Alarm status is critical.
          *   *Goal 3 (Test System):* Alarm status is the *primary* focus; `Bolt_Retracted` becomes secondary.

  *   **What it must have:** A clear distinction between the *mechanical effect* (bolt moves) and the *informational effect* (log updates). This helps computing students see that "state" includes data, not just physics.
  *   **What it must lack:** Any element that *could* physically prevent the action (like a bolted wagon). That invites the Qualification Problem. The door *must* open; the question is what else the system needs to track.

  ### 3. The Misconceptions

  Here is where to intercept each misconception in the sequence outlined above.

  1.  **"It's a problem of computational cost."**
      *   *Intercept:* **Move 2 (The Logical Burden).**
      *   *Tactic:* "Imagine the computer is a million times faster. It still cannot deduce the wall color didn't change if you haven't given it a rule saying so. Speed doesn't fix missing premises."
  2.  **"It is the same as the Qualification or Ramification problem."**
      *   *Intercept:* **Move 1 (The Planning Recap).**
      *   *Tactic:* Draw three boxes.
          *   Qualification: "What could stop the action?" (Preconditions).
          *   Ramification: "What else changes?" (Side effects).
          *   Frame: "What stays the same?" (Persistence).
          *   Tell them: "Today we only open the third box."
  3.  **"It was solved by the late 1980s."**
      *   *Intercept:* **Move 4 (The Relevance Gap).**
      *   *Tactic:* "The logic was solved (Move 3). The cognition was not. If you build a robot today, it still struggles to know what to ignore in a new room."
  4.  **"Relevance is a property a belief has on its own."**
      *   *Intercept:* **Move 4 (The Relevance Gap).**
      *   *Tactic:* Use the **Relevance Flipper** in the Smart Door example. Ask: "Is `Security_Alarm_Armed` relevant?" Force them to answer "It depends on the goal."
  5.  **"The takeaway is vague holism (everything bears on everything)."**
      *   *Intercept:* **Move 5 (The Stakes).**
      *   *Tactic:* "The problem isn't that everything *does* bear on everything. It's that anything *could*. The system needs a way to rule things out, not rule them in."

  **Missing Misconceptions:**
  1.  **"Machine Learning solves this."** Your computing students will assume neural nets bypass symbolic representation.
      *   *Intercept:* **Move 5.** Clarify that ML systems face a version of this in feature selection, but the philosophical problem regards *reasoning*, not pattern matching.
  2.  **"It's a perception problem."** Students often think the robot just doesn't *see* the wall color.
      *   *Intercept:* **Move 2.** Emphasize this is about *representation*, not sensors. The robot "knows" the wall is white; the problem is knowing it *stayed* white.

  ### 4. The Two Further Questions

  **1. The Yale Shooting Problem (Include or Exclude?)**
  **Exclude.**
  You are correct; it is a trap. The Yale Shooting Problem requires understanding non-monotonic logic and minimization policies to grasp why the "fix" fails in temporal projection. For first-years with only truth tables, this will look like magic trickery. It pulls focus back to the Technical Problem (TFP) just as you are trying to elevate them to the Philosophical Problem (PFP). It suggests the problem is about *time*, when you want them to see it is about *relevance*.

  **2. The Fodor/Computationalism Argument (Include or Exclude?)**
  **Include, but conditionally.**
  This is the payoff for the Philosophy half of their degree. However, it only lands if **Move 4** is secure.
  *   *Condition:* You must have successfully established that relevance is not intrinsic to the data.
  *   *Execution:* Spend the final 3 minutes here. "If a computer needs a rule to tell it what is relevant, and relevance depends on context, and context is potentially infinite... can a finite system ever think like a human?"
  *   *Warning:* Do not present this as "AI is impossible." Present it as "This is why cognitive science is still arguing about this."

  ### 5. Check and Omission

  **The Assessment Question:**
  Your idea of three vignettes is too ambitious for a 5-minute slot; reading and triaging three texts will eat the time.
  **Better:** Use **one** vignette (The Smart Door) and ask **three** specific questions.
  *   *Vignette:* "The robot unlocks the door. The dust shifts. The log updates. The alarm stays off."
  *   *Q1 (Technical):* "Which of these facts requires a frame axiom to ensure it remains true in the next state?" (Tests TFP: Dust/Alarm).
  *   *Q2 (Broader):* "If the robot's goal is 'Stealth', which of these facts becomes relevant to check *before* acting?" (Tests PFP: Alarm).
  *   *Q3 (Distinction):* "If the robot checks the dust count, is that a Frame Problem error or a Cost error?" (Tests Misconception: It's a relevance error, not cost).

  **The Refusal:**
  **What to refuse:** Do not explain the *syntax* of Successor State Axioms. Do not write out the predicate logic.
  **How to make it principled:** "We are studying the *shape* of the problem, not the engineering of the solution. The logic notation is the mechanic's toolkit; today we are the designers asking what the engine needs to do. If you take the Advanced AI module next year, you will write the axioms. Today, you must understand why we need them."
  This frames the omission as a pedagogical boundary (Design vs. Implementation) rather than a gap in your explanation.
