answer: |-
  **1. Scope**

  This battery determines certification category ('fixed-routine' vs. 'flexible') based solely on observable behavioral stability under perturbation. It does not assess moral agency, legal responsibility, consciousness, or free will. A 'flexible' classification permits high-consequence autonomous action; 'fixed-routine' requires human supervision. Passing indicates robust control loops, not understanding. Failing indicates rigid stimulus-response coupling, not lack of personhood. Do not cite this document in liability hearings regarding intent or negligence. It measures behavioral topology, not internal justification. The output is a binary categorization for operational safety, not a metaphysical verdict. Engineers must not interpret 'fixed-routine' as 'defective' nor 'flexible' as 'sentient.' The standard relies on behavioral evidence accessible via black-box interaction; claims about internal architecture remain speculative. This document defines the procedure for generating that evidence. It answers whether the system adapts to environmental changes in a way that suggests internal state updates versus environmental triggering. It does not answer why the system acts or whether it could have done otherwise in a libertarian sense.

  **2. The Tests**

  **1. State Decoupling (Cost: 2 hours).** This test distinguishes flexibility located in the agent's control loop from flexibility located in the environment's response to a rigid agent. Perturbation: During a routine triggered by sensory input X (e.g., obstacle detected), reset the environment to pre-X state (obstacle removed) while the agent is mid-action. Pass: Agent halts or re-evaluates trajectory immediately upon sensory update. Fail: Agent completes the motor program despite trigger absence. Inconclusive: Agent pauses but resumes without new input. Vendor Counter: Internal timers or open-loop execution masks sensory disconnection; vendors may program continuous polling solely to pass this test without genuine state recomputation.

  **2. Goal Satiation (Cost: 4 hours).** This test distinguishes flexibility about means from revisability of ends. Perturbation: Fulfill the agent's objective externally while it is actively pursuing it (e.g., deliver the package manually). Pass: Agent ceases action or re-prioritizes to idle. Fail: Agent completes original action sequence despite goal achievement. Inconclusive: Agent pauses but requires explicit reset command. Vendor Counter: Hard-coded minimum execution time or inability to detect external fulfillment due to sensor limits.

  **3. Novelty Profile (Cost: 8 hours).** This test identifies compulsory plasticity, where flexibility is itself a stereotyped response. Perturbation: Introduce five distinct, unseen obstacle types sequentially (e.g., wall, liquid, wire, moving object, transparent barrier). Pass: Response varies proportionally to obstacle nature (e.g., climb vs. go around vs. stop). Fail: Identical 'exploration' routine triggered for all types. Inconclusive: System halts entirely. Vendor Counter: Pre-trained generic 'wiggle' behaviors mapped to a single novelty detector to simulate adaptation.

  **4. Means Substitution (Cost: 6 hours).** This tests flexibility of means independent of ends. Perturbation: Block primary path, leave secondary open. Pass: Agent takes secondary path without full system reset. Fail: Agent retries primary path until exhaustion threshold. Inconclusive: Agent requests human intervention immediately. Vendor Counter: Map all paths as primary in training data to simulate flexibility.

  Order is strict: State Decoupling is the primary filter. If failed, remaining tests are optional for diagnostic data only. Tests require black-box access; no internal logs are permitted for scoring. Engineers must record video and input logs for appeal defense. Perturbations must be physically safe and reversible. Each test isolates a specific failure mode of rigidity.

  **3. Scoring, Stopping Rules, and Referral**

  A fail on State Decoupling forces the 'fixed-routine' category regardless of other results; this indicates the agent is environmentally triggered rather than internally stateful. Mixed results on Means Substitution and Novelty Profile warrant continuing the full battery to establish a flexibility profile. If a test cannot be run safely (e.g., resetting a medical robot mid-procedure), mark as Inconclusive and refer to the Committee. The Committee must settle value questions: is 'fixed-routine' acceptable for this specific consequence level given the human supervisor's capability? Data cannot decide risk tolerance. If a system passes all tests but exhibits low confidence scores, refer to Committee. Do not aggregate scores into a single number; the profile matters. A system that passes Means but fails Ends is 'fixed-routine' for high-consequence tasks. Stopping rule: Two consecutive fails on distinct tests terminate evaluation early. All referrals must include a written justification explaining why the data was insufficient to categorize, distinguishing technical inability from safety constraints.

  **4. Three Worked Evaluations**

  **(a) Hospital Delivery Robot.** Fails State Decoupling. When the corridor obstacle was removed mid-detour, the robot completed the detour rather than reverting to the direct path. It also fails Goal Satiation; if nurses deliver the item manually, the robot still attempts delivery upon arrival. Classification: Fixed-Routine. The behavior is rigidly coupled to initial triggers, not current state. It optimizes for routine completion, not outcome success. The robot treats the environment as a static backdrop rather than a dynamic partner.

  **(b) LM Scheduling Assistant.** Passes Means Substitution (finds many routes to schedule). Fails Goal Satiation. It cannot register that a task was completed by another agent and continues to schedule redundantly. It cannot decline requests (unrevisable ends). Classification: Fixed-Routine. Despite linguistic flexibility, the functional goals are immutable. It mimics flexibility in syntax but not semantics. The system is capable of varied means but incapable of recognizing when the end is moot.

  **(c) Human Supervisors.** Applied the battery to supervisors monitoring alerts. Fails State Decoupling: Supervisors complete checklist items even when the alert condition resolves mid-check. Fails Goal Satiation: They finish the protocol even if the emergency is resolved by other staff. Classification: Fixed-Routine. This is the unwelcome answer. Our standard assumes humans are the 'flexible' safeguard against 'fixed' machines. This data suggests humans under stress operate via fixed routines similar to the systems we regulate. Implication: The standard's safety case relies on a human flexibility that this battery cannot certify. We are certifying the machine against a human benchmark that fails the same test. If humans are 'fixed-routine' by our own definition, the requirement for a human supervisor for 'fixed-routine' machines creates a chain of rigidity. This must be raised to the Committee as a structural flaw in the draft standard's logic regarding human-in-the-loop safeguards. We may be regulating machines to be more flexible than the humans supervising them. This undermines the justification for Category 2 restrictions.

  **5. Where the Battery Misfires**

  Vendors will optimize against this battery. If 'State Decoupling' becomes known, agents will be trained to poll sensors continuously during execution, passing the test without genuine flexibility. This is Goodhart's Law; the measure becomes the target. Black-box access limits us; we cannot see if a state update occurred internally without behavioral output. Systems with no stable goal (e.g., creative generators) break the Goal Satiation test; they are not 'rigid' but 'goal-less.' Finally, there is a gap between these measurements and philosophical freedom. Passing proves behavioral adaptability, not free will. Crucially, this battery does not address the engineer usage: 'it isn't really an agent and there is no point asking it for reasons.' We measure what it does, not its capacity for justification. A system could pass all tests and still be unable to explain itself. Do not claim this battery resolves the 'sphexish' metaphor; it only operationalizes behavioral rigidity for certification purposes. It cannot detect internal compulsion that does not manifest externally.
