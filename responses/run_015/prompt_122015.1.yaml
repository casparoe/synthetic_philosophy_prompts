  **The question**

  The presumption of independence is a staple of heuristic reasoning, yet formal epistemology treats it as a monolithic normative principle. This paper asks: Is the presumption of independence a single epistemic norm, or a conflation of distinct principles that behave differently under scrutiny? Specifically, does splitting the presumption along a justification axis (maximum-entropy vs. causal isolation) and an algebraic axis (partition granularity) explain why some independence-based heuristics yield robust truths despite false assumptions, while others compound errors? The answer will determine whether we should evaluate heuristic success by the truth of independence assumptions or by the structural stability of the inference under aggregation. A determinate answer requires showing that one axis predicts robustness better than the other. If the split holds, the unit of assessment shifts from assumption truth to error propagation dynamics. This proposal argues that the literature's monolithic treatment obscures the mechanism of heuristic success, and that resolving this ambiguity is necessary for a coherent account of non-deductive reasoning in formal settings. This is a structural question about probabilistic norms.

  **What the standard treatments give and where they stop**

  Standard treatments in formal epistemology typically codify the presumption of independence as a unified default rule triggered by an absence of evidence for correlation. Whether grounded in principles of indifference, maximum entropy, or causal graphs, these treatments generally operate with a binary switch: either independence is justified, or it is defeated. When defeated, the heuristic is typically dismissed as flawed. This approach stops short of analyzing the *type* of justification invoked. It does not distinguish between independence assumed because no structure is known (entropy) versus independence assumed because no causal mechanism connects variables. This conflation matters because entropy-based defaults tolerate structural noise differently than causal defaults.

  Furthermore, standard treatments rarely address the algebraic instability of independence. They assume that if $A$ and $B$ are independent, the assumption holds across relevant Boolean combinations. They fail to account for the fact that independence at a coarse partition often implies dependence at a finer grain. For instance, assuming independence for events $A$ and $B$ does not guarantee independence for $A$ and $A \land B$. Consequently, the literature lacks the resources to explain why some heuristics succeed despite known dependencies. It treats all independence failures as equally fatal, ignoring the possibility of error cancellation or arithmetic correction. By failing to separate the source of the presumption from its algebraic scope, current frameworks cannot predict when a false independence assumption is benign versus when it is catastrophic. In practice, scientists rely on independence heuristics that are known to be strictly false yet yield correct asymptotic results. The literature currently lacks a vocabulary to describe this phenomenon other than "luck." By treating the presumption as a single principle, standard accounts miss the structural reasons why some errors cancel out while others compound. They do not differentiate between a presumption that acts as a placeholder for missing information versus one that acts as a claim about physical separation. Without this distinction, the evaluation of heuristic arguments remains coarse-grained, unable to capture the nuance of robustness.

  **Method**

  The paper will proceed in three distinct stages, moving from formal definition to comparative application. I will proceed in strict order: definition, application, then evaluation.

  First, I will formalize the two axes of distinction to create a taxonomy of independence presumptions. The justification axis will contrast maximum-entropy defaults, which minimize assumed structure beyond marginals, with causal-no-connection defaults, which assert the absence of linking mechanisms. I will define the conditions under which each licenses an inference. The algebraic axis will define independence relative to a specific Boolean algebra. I will demonstrate formally how independence at a coarse partition logically implies dependence at a finer grain, specifically showing the incompatibility between independence of $A$ from $B$ and $A$ from $A \land B$. I will derive a metric for "robustness," defined as the divergence between the heuristic output and the true probability under small perturbations of the independence assumption. This will involve sensitivity analysis on the joint probability distribution.

  Second, I will construct two worked case studies to test this taxonomy. The first will examine probabilistic heuristics in number theory, specifically the Cramér model for prime patterns. Here, independence is justified by a lack of arithmetical structure (entropy), yet dependencies exist due to divisibility rules. I will analyze the specific arithmetic correction factors that repair the independence assumption, showing how the heuristic remains asymptotically correct. I will map the algebraic refinement from "integer is prime" to "integer is prime modulo $k$." The second case study will focus on forensic reasoning, where chained multiplications of per-instance probabilities are common. Here, independence is often assumed causally but fails upon partition refinement (e.g., grouping evidence types). I will model how dependencies compound in this chain, showing where the algebraic scope breaks the causal justification.

  Third, I will compare the error propagation in both cases. I will test whether the justification type predicts the algebraic stability. Does the entropy-based presumption in number theory allow for self-correction under aggregation, while the causal presumption in forensics leads to compounding errors? I will look for structural features that enable error cancellation, such as symmetry in the error terms. The analysis will remain strictly formal, focusing on the probabilistic structures and logical relations rather than empirical data, ensuring the project fits the seminar's constraints. I will conclude by mapping the results back to the taxonomy to see if the split explains the differential success rates. The method relies on logical reconstruction of the arguments rather than historical exegesis.

  **Possible conclusions and what would decide between them**

  There are three primary possible conclusions. First, the justification axis may be decisive: entropy-based presumptions might prove inherently more robust because they anticipate structural noise, whereas causal presumptions fail brittlely when hidden connections emerge. This would suggest that epistemic humility (admitting ignorance) is safer than ontological claims (asserting no connection). Second, the algebraic axis may dominate: regardless of justification, coarse-grained independence assumptions may always hide compounding errors, suggesting the problem is purely one of partition selection. This would imply that all heuristics are vulnerable to refinement. Third, an interaction effect may exist: only entropy-based presumptions at coarse partitions are self-correcting, while causal presumptions require fine-grained accuracy.

  What would decide between these is the behavior of the error terms in the case studies. If the number theory heuristic succeeds because the errors sum to zero (symmetry), justification is key. If it succeeds only because the partition is coarse enough to smooth over dependencies, algebra is key. If the forensic case fails specifically because refining the partition exposes causal links, the interaction is key. The deciding factor will be whether the mathematical structure of the error propagation correlates with the type of justification originally offered for the independence assumption. A successful outcome will provide a normative rule for when to trust independence heuristics: not when they are true, but when their specific justification aligns with their algebraic scope to permit error cancellation. This would shift the evaluative criterion from truth to stability, offering a new standard for assessing non-deductive arguments in formal epistemology.

  **How this could fail, and how I would scope it down**

  The primary risk is that the formalization becomes too technically demanding for a 4000-word limit. Deriving robustness metrics and modeling prime distributions could consume the entire word count, leaving no room for epistemological analysis. Additionally, the case studies might prove disanalogous, making comparison difficult. There is also the risk that the "justification" distinction collapses upon formal inspection, revealing itself as merely semantic. To scope this down, I would prioritize the algebraic axis. If the justification distinction proves too vague to formalize quickly, I will focus solely on how partition refinement affects independence defaults across both domains. I would drop the forensic case study if necessary and focus entirely on the number theory example, using it to demonstrate the general logical point about algebraic instability. This would ensure a complete argument within the word limit, even if the taxonomy remains binary rather than dual-axial. The core claim—that independence is algebraically unstable—would remain intact. This contingency plan preserves the philosophical contribution.
