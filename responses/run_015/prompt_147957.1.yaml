answer: |-
  Mapping the four criteria against your pressure points reveals divergent franchises. The **All Affected Interests (AAI)** principle casts the net widest. It demands the inclusion of the rest of the UK (rUK), whose currency, defence, and EU status were materially implicated. It requires including Scots abroad, whose familial and economic interests remain tied to Scotland. Crucially, if affectedness justifies enfranchising 16- and 17-year-olds, consistency demands including 15-year-olds and the unborn, who will live longest with the consequences. AAI renders the 2014 franchise defective for excluding rUK and the young/unborn.

  The **All Subject to Coercion (ASC)** principle focuses on subjection to the resulting state's laws. It supports including EU citizens resident in Scotland and 16- and 17-year-olds, as both are subject to Holyrood's coercion. It excludes Scots living in England (not subject to Scottish law) and rUK voters (not subject to the independent Scotland's laws). ASC aligns closely with residence but struggles with the "twice-transformed" citizenship of EU residents, whose subjection would change status upon independence.

  The **Constituent Power** view defines the demos as the pre-political nation. This likely includes Scots abroad as members of the people but excludes EU citizens as non-members of the Scottish nation. It offers no clear principle for the voting age, relying instead on cultural definitions of maturity. It contradicts the actual franchise on both EU inclusion and Scottish exclusion.

  The **Civic Residence** view holds that lawful residence and a stake in the community suffice. This includes EU citizens and 16- and 17-year-olds but excludes Scots abroad and rUK. It draws a line at legal capacity and residence, excluding 15-year-olds and the unborn not because they are unaffected, but because they lack legal standing or presence.

  The actual 2014 franchise best matches the **Civic Residence** criterion, hybridised with **ASC**. It flatly contradicts **AAI** (by excluding rUK and the unborn) and **Constituent Power** (by including non-national EU citizens and excluding national Scots abroad).

  Regarding your first theoretical feature: the **Chosen Demos**. The criteria presume a neutral arbiter to apply the boundary test. The Edinburgh Agreement demonstrates the boundary was a negotiated settlement between governments, where specific elements (lowered age, residence rules) were strategically selected, widely perceived to favour the Yes campaign. This is a genuine gap. None of the criteria absorb the question of *who selects the criterion*. Democratic theory typically treats the boundary as a precondition for democracy, not a democratic decision itself. Consequently, the theory falls silent on the legitimacy of a boundary strategically drawn by a party to the dispute. The circularity is unavoidable: you cannot democratically decide the demos without already having a demos.

  Regarding your second feature: the **Reconstitution Condition**. This does not collapse into AAI or ASC; it introduces a temporal constraint on democratic continuity. It argues that the unit dissolving a union must be capable of reconstituting it. It does not necessarily condemn the American or Irish cases if we accept their initial *pouvoir constituant* was legitimate, but it highlights a defect in irreversible decisions where the electorate inheriting the consequences differs radically from the one that decided.

  Does it work on the Chosen Demos problem? It relocates it one level up. If the initial franchise is strategically chosen to secure independence, the Reconstitution Condition locks that strategic choice in permanently. The excluded (rUK, Scots abroad, the unborn) cannot vote to reverse the outcome because the new boundary renders them external. Thus, the condition exposes that a strategically chosen demos creates a democratic asymmetry: the power to dissolve is easier to exercise than the power to restore, precisely because the dissolution alters the very electorate required to consent to restoration. It shows that boundary decisions are not merely technical applications of theory but constitutive acts that determine future democratic possibility.
