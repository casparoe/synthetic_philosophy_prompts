answer: |-
  **Exam Question**

  The paradox of deontology suggests a tension between the paramount importance of moral constraints and the refusal to minimize their violation across agents. Some theorists propose this paradox arises from erroneously treating agent-relative prohibitions as linearly aggregable values, analogous to the physical assumption that interactions always scale proportionally without saturation or interference effects. State the paradox precisely without relying on specific numerical trade-off scenarios. Assess whether diagnosing this as a category error regarding aggregability resolves the normative tension or merely relocates it to the justification of agent-relativity. Finally, defend a substantive position on whether moral constraints possess a non-linear moral "physics" that invalidates minimization strategies.

  **Model Answer**

  The paradox of deontology, articulated by Samuel Scheffler, emerges from the conflict between the stringency of agent-relative constraints and the intuitive demand to minimize their violation. If morality forbids killing an innocent person, it seems irrational to refuse killing one person to prevent five others from being killed by different agents. The paradox lies in asserting that constraints are so important that they override consequentialist calculations, yet refusing to minimize the total number of times these constraints are violated. This implies that the moral value of a constraint is not solely determined by its instantiation in the world but by its relation to the agent.

  The proposed diagnosis suggests this paradox arises from treating agent-relative prohibitions as linearly aggregable values. In classical physics, forces often scale proportionally; two units of force add to four. However, in complex systems, interactions exhibit saturation or interference, where scaling is non-linear. Applying this to ethics, the diagnosis posits that assuming 'my violation' plus 'your violation' equals 'two units of bad' is a category error. Agent-relative constraints function like interference patterns; the moral 'force' of my killing cannot be simply added to your killing because the agency involved is distinct. My moral integrity saturates at my own actions; I cannot absorb the moral weight of another's violation by committing a violation myself.

  Assessing whether this resolves or merely relocates the tension requires distinguishing logical coherence from normative justification. The scaling diagnosis successfully resolves the logical contradiction by showing that the paradox depends on a false premise of aggregability. It demonstrates that deontology is not irrational if one rejects the linear model of moral value. However, this merely relocates the tension to the metaphysical justification of agent-relativity. We are left asking why moral physics should be non-linear in this specific way. The paradox of why I should not minimize violations becomes the paradox of why my agency is morally privileged against the global good.

  Defending a substantive position, I argue that the diagnosis is a crucial diagnostic tool but not a complete ethical theory. It effectively dissolves the charge of irrationality by analogizing deontology to non-linear physical systems where superposition fails. Yet, pointing out that moral interactions do not scale linearly does not explain why they should not. To fully defend the position, one must ground this non-linearity in a conception of personal integrity or the separateness of persons. Therefore, the scaling analogy removes the logical paradox but leaves the normative burden intact. The tension is resolved only if we accept that agents are not mere vessels for value maximization but loci of specific moral responsibility. Ultimately, the physics analogy illuminates the structure of the error but cannot generate the moral force required to justify the constraint itself.

  **Marking Scheme**

  1. Excellent answers will precisely formulate Scheffler's paradox without relying on consequentialist comparisons of outcome value.
  2. Competent responses often fail to distinguish between minimizing violations and minimizing harm, conflating the structural paradox with standard trolley problems.
  3. Top marks require analyzing whether the non-linear analogy explains the origin of the paradox or merely restates agent-relativity in different terminology.
  4. Marks should be deducted if students claim the scaling diagnosis fully justifies deontology rather than explaining its logical structure.
  5. Excellent defenses will identify that relocating the tension to the justification of agent-relativity is more philosophically honest than claiming a complete resolution.
