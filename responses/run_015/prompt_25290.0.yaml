prompt: |-
  I'm teaching an undergraduate course on rational choice theory and want to give my students a diagnostic quiz that sorts them into positions on the paradox of voting. The paradox, briefly: in a large election, the probability that any individual vote will be decisive is vanishingly small, so the expected instrumental benefit of voting seems far lower than the cost of going to the polls — yet millions of people vote. The quiz should help students discover which resolution of the paradox their own reasoning actually commits them to, before we study the positions explicitly.

  Please write a ten-question sorting quiz. Each question should present a concrete scenario — a thought experiment, a vignette, or a forced choice — with two or three answer options. No question should name a philosophical position or use jargon like "expressive voting," "pivot probability," or "rule consequentialism." The questions should probe the fault lines that actually separate the major positions: whether the act of voting has intrinsic value apart from its effect on the outcome, whether universalization gives reasons that act-consequentialist calculation misses, whether regret-avoidance is a legitimate basis for decision, whether group membership changes the rational calculus for an individual, and whether the sheer magnitude of the stakes can overcome a minuscule probability.

  The positions the quiz should sort into are:

  - **Expressive voting**: voting is an expressive act, like cheering or wearing a pin; its value doesn't depend on affecting the outcome.
  - **Ethical-altruistic voting**: the expected utility of voting is enormous once you multiply the per-person stakes by the number of people affected, so voting is straightforwardly rational even with tiny pivot probabilities.
  - **Duty-based voting**: voting is a civic or moral obligation that doesn't reduce to expected consequences.
  - **Rule-consequentialist voting**: the right question is not "what happens if I vote?" but "what if everyone in my situation reasoned the same way?"
  - **Minimax regret**: one should vote to avoid the worst-case regret — your side losing by exactly one vote while you stayed home.
  - **Rational-irrationality / ignorance**: people vote because they systematically misjudge the probabilities, or because it's a low-cost action that feels momentous; a fully rational agent wouldn't vote (or would vote only for non-instrumental reasons they don't genuinely have).
  - **Group-agency voting**: individuals vote as members of groups; the group decides collectively to turn out, and the individual's obligation derives from group membership rather than from individual expected-utility calculation.

  Include a scoring key that maps answer patterns to positions. Some students may fit more than one position; the key should acknowledge this and flag which pairs of positions the quiz cannot cleanly separate and why. Also note any logically possible answer patterns that correspond to no defended position — and briefly say whether the combination is incoherent, merely unattractive, or simply underexplored in the literature.

  The quiz should be suitable for undergraduates with no background in formal decision theory, though they should be comfortable with the basic idea of weighing costs against benefits. Write the questions in a clear, engaging style. Respond in the style of an expert in political philosophy and rational choice theory. Think very carefully about which answer patterns map to which positions before finalizing the scoring key.
reasoning: |-
  Here's a thinking process that leads to the suggested quiz:

  1.  **Analyze the Request:**
      *   **Goal:** Create a 10-question diagnostic quiz for undergraduates on the Paradox of Voting.
      *   **Purpose:** Sort students into philosophical positions *before* teaching the material (discovery learning).
      *   **Constraints:** No jargon (e.g., "expressive," "pivot probability," "rule consequentialism"). Concrete scenarios/vignettes. Clear, engaging style.
      *   **Target Positions:**
          1.  Expressive Voting (Act as expression).
          2.  Ethical-Altruistic Voting (Huge stakes $\times$ tiny prob = positive EU).
          3.  Duty-Based Voting (Obligation independent of consequences).
          4.  Rule-Consequentialist Voting (Universalization test).
          5.  Minimax Regret (Avoid worst-case regret).
          6.  Rational-Irrationality/Ignorance (Miscalculation or low-cost heuristic).
          7.  Group-Agency Voting (Collective action/identity).
      *   **Deliverables:** 10 Questions + Scoring Key (mapping patterns to positions, handling overlaps, noting incoherent patterns).
      *   **Tone:** Expert in political philosophy and rational choice theory.

  2.  **Deconstruct the Positions & Identify Fault Lines:**
      *   *Expressive:* Value is in the *doing*, not the *result*. Analogy: Cheering at a game.
      *   *Ethical-Altruistic:* Value is in the *result*, but the result is massive (social welfare), outweighing the tiny probability.
      *   *Duty-Based:* Value is in *obligation*. "I ought to do this" regardless of math.
      *   *Rule-Consequentialist:* Value depends on *what if everyone did this?* Not individual causality.
      *   *Minimax Regret:* Value is avoiding *psychological pain* of "what if."
      *   *Rational-Irrationality:* Voting is *mistaken* or based on false beliefs about probability.
      *   *Group-Agency:* Value is in *solidarity* or fulfilling a role within a collective.

      *Key Distinctions to Probe:*
      *   Instrumental vs. Non-instrumental value.
      *   Individual vs. Collective reasoning.
      *   Actual consequences vs. Hypothetical consequences (universalization).
      *   Probability assessment (accurate vs. inflated vs. irrelevant).
      *   Emotional drivers (regret, pride, duty).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1 (Instrumental vs. Expressive):* Scenario: A vote definitely won't change the outcome. Why vote?
          *   Option A: To feel like I participated (Expressive).
          *   Option B: Because there's still a non-zero chance (Altruistic/Instrumental).
          *   Option C: Because it's wrong not to (Duty).
      *   *Q2 (Magnitude of Stakes):* Scenario: Election affects millions vs. affects only you.
          *   Option A: Only matters if it affects me personally (Rational-Irrationality/Self-interest).
          *   Option B: Matters more if it affects millions (Altruistic).
          *   Option C: Matters the same regardless (Duty/Expressive).
      *   *Q3 (Universalization):* Scenario: Everyone like you stays home.
          *   Option A: Disaster, so I must vote (Rule-Consequentialist).
          *   Option B: My vote doesn't change their choice (Instrumental).
          *   Option C: I don't care what they do (Expressive/Duty).
      *   *Q4 (Regret):* Scenario: Lose by 1 vote vs. Lose by 1 million.
          *   Option A: Much worse if by 1 vote (Minimax Regret).
          *   Option B: Same outcome either way (Instrumental).
          *   Option C: I did my part either way (Duty).
      *   *Q5 (Group Identity):* Scenario: Voting as part of a union/community.
          *   Option A: My vote counts as part of the block (Group Agency).
          *   Option B: My vote is just one drop (Instrumental).
          *   Option C: It shows loyalty (Expressive).
      *   *Q6 (Probability Assessment):* Scenario: Mathematician tells you odds are 1 in 100 million.
          *   Option A: I still vote because math misses the point (Duty/Expressive).
          *   Option B: I stop voting (Rational-Irrationality - admits irrationality).
          *   Option C: I still vote because 1 in 100 million $\times$ big number > cost (Altruistic).
      *   *Q7 (Cost-Benefit):* Scenario: Cost of voting rises (long line, rain).
          *   Option A: I stop if cost > expected benefit (Instrumental/Rational).
          *   Option B: I go anyway, cost is irrelevant (Duty).
          *   Option C: I go because the statement matters more when costly (Expressive/Signaling).
      *   *Q8 (Secret vs. Public):* Scenario: Vote is secret vs. public record.
          *   Option A: Doesn't matter, I know I did it (Duty/Expressive internal).
          *   Option B: Matters, I want others to know (Expressive external/Group).
          *   Option C: Doesn't matter, only outcome counts (Instrumental).
      *   *Q9 (The "Waste" Intuition):* Scenario: Friend says "Your vote is wasted."
          *   Option A: They are right logically, but I do it anyway (Rational-Irrationality).
          *   Option B: They are wrong; it's not wasted (Altruistic/Rule).
          *   Option C: It's not about waste, it's about voice (Expressive).
      *   *Q10 (Hypothetical Clone):* Scenario: 1,000 clones of you decide together.
          *   Option A: We vote together (Group/Rule).
          *   Option B: I decide alone (Individual Instrumental).
          *   Option C: We express our shared will (Expressive/Group).

      *Refining Questions for Clarity and Distinction:*
      Need to ensure the options map cleanly to the scoring key. Let's make sure "Rational-Irrationality" gets a chance to admit that voting *is* irrational instrumentally. Let's make sure "Altruistic" gets the "Big Stakes" math.

      *Revision on Q6:* Make sure the "Altruistic" option explicitly references the total benefit to others, not just the probability.
      *Revision on Q3:* Ensure the Rule-Consequentialist option focuses on the *principle* of reasoning, not just "disaster."

  4.  **Developing the Scoring Key:**
      *   This is the hardest part. I need to map specific answer choices to specific positions.
      *   Let's assign letters (A, B, C) to positions for each question.
      *   *Challenge:* Some positions overlap (e.g., Duty and Expressive often look similar on "Why do you vote?" but differ on "Does cost matter?").
      *   *Challenge:* Rational-Irrationality is the "None of the above" or "I admit the math wins" position.
      *   *Strategy:* I will create a tally system. Each answer choice adds points to specific buckets.
      *   *Overlap Note:* Expressive and Duty are hard to separate without deep meta-ethics. Rule-Consequentialist and Altruistic are hard to separate without asking about the *mechanism* of the calculation.
      *   *Incoherent Patterns:* E.g., claiming probability is zero but stakes don't matter, yet voting anyway for no reason. Or claiming to be purely instrumental but ignoring the math.

  5.  **Drafting the Content (incorporating the "Expert Tone"):**
      *   Intro: Set the stage.
      *   Questions: Ensure vignettes are relatable (rain, lines, friends, math).
      *   Scoring Key: Detailed instructions.
      *   Analysis of Overlaps/Incoherence: Crucial for the instructor.

  6.  **Review against Constraints:**
      *   10 Questions? Yes.
      *   No jargon? Check (no "pivotal," "deontology," "utility").
      *   Concrete scenarios? Yes.
      *   All 7 positions covered? Yes.
      *   Scoring key with overlap analysis? Yes.

  7.  **Final Polish:**
      *   Check for bias in wording.
      *   Ensure the "Rational-Irrationality" option doesn't sound stupid, but rather "honest about the math."
      *   Ensure "Group Agency" distinguishes itself from "Rule Consequentialism" (one is about identity/solidarity, the other about logical universalization).

      *(Self-Correction during drafting Q5)*: Group Agency is tricky. It's not just "I feel part of a group" (that's expressive). It's "We act as one." I need to phrase the option to reflect a collective decision-making unit.
      *(Self-Correction during drafting Q3)*: Rule Consequentialism is "What if everyone reasoned like me?" not just "What if everyone voted?" I need to be precise there.

      *(Refining the Scoring Key)*: Instead of a simple A=1, B=2, I should group answers by "Primary Motivation." I will assign each option a code (e.g., EXP, ALTR, DUTY, RULE, REGRET, RAT, GRP). Then the user tallies the codes. This is more flexible and accurate than a rigid A/B/C mapping.

      *Wait, one constraint:* "Two or three answer options." I should stick to 3 for consistency.
      *Wait, another constraint:* "Respond in the style of an expert." I need an intro and outro that frames this pedagogically.

      *Let's finalize the mapping for the Scoring Key.*
      Q1: Expressive vs Instrumental vs Duty.
      Q2: Altruistic (Stakes) vs Self-Interest vs Duty/Expressive.
      Q3: Rule vs Individual vs Expressive.
      Q4: Regret vs Outcome vs Duty.
      Q5: Group vs Individual vs Expressive.
      Q6: Duty/Expressive vs Rational (Don't Vote) vs Altruistic (Math works).
      Q7: Instrumental (Cost) vs Duty vs Expressive (Signaling).
      Q8: Internal vs External vs Instrumental.
      Q9: Admit Irrationality vs Defend Rationality (Altruistic/Rule) vs Expressive.
      Q10: Collective Agency vs Individual vs Expressive.

      *Actually, a tally system is best.* I will label each option with a hidden tag in the key, not in the quiz.

      *Incoherent Patterns:* If someone chooses "Math says don't vote" (Rat) but also "I vote to change the outcome" (Instrumental), that's the paradox itself, not a resolution. If they choose "Probability is zero" and "I vote to change outcome," that's logically incoherent.

      *Let's write it.*

      *(Final check on "Rational-Irrationality")*: This position (associated with Brennan/Lomasky or Achen/Bartels) suggests people vote due to error or because the cost is low enough that they don't bother calculating. The quiz option needs to reflect "I know the odds are bad, maybe I'm just wrong/misguided."

      *(Final check on "Group Agency")*: This is less standard in intro courses but requested. It implies the unit of agency is the group. Option should reflect "We decided."

      *Okay, ready to generate.*
answer: |-
  # The Voter's Dilemma: A Diagnostic Quiz

  **Instructor's Note:** *This quiz is designed to be administered before lecturing on the Paradox of Voting. Its purpose is not to test knowledge, but to reveal intuitions. Ask students to answer honestly based on what they feel is the *right* reason to act, not what they think a political scientist might want to hear. There are no correct answers.*

  ***

  ### Part I: The Scenarios

  **1. The Certain Loss**
  Imagine an election where the polls close in one hour. A reliable source tells you that your preferred candidate is currently losing by 500,000 votes. There are only 1,000 voters left in line, and you are at the back. You know for a fact your vote cannot change the winner. Do you still cast a ballot?
  *   **A.** No. Since the outcome is fixed, voting is a waste of time and resources.
  *   **B.** Yes. The outcome is fixed, but casting the ballot is a meaningful act in itself.
  *   **C.** Yes. Even if this election is lost, I have an obligation to participate regardless of the score.

  **2. The Scale of Stakes**
  Consider two elections. In Election X, the winner decides a policy that affects only your personal tax bill by $100. In Election Y, the winner decides a policy that affects the national healthcare of 10 million people, but your personal tax bill remains unchanged. In which election is your vote more "worth it"?
  *   **A.** Election X. Politics is ultimately about how things affect me directly.
  *   **B.** Election Y. The total benefit to millions of people outweighs the tiny chance of affecting the result.
  *   **C.** They are equal. The value of voting isn't about the dollar amount at stake.

  **3. The Twin Thought Experiment**
  Suppose there is an exact clone of you in a neighboring district who thinks exactly like you. If you decide to stay home because "my vote doesn't matter," your clone will reason the exact same way and stay home. If you vote, your clone votes. Does this connection change your decision?
  *   **A.** No. I can only control my own body, not my clone's. I must calculate based on my single vote.
  *   **B.** Yes. If everyone who reasoned like me stayed home, democracy would collapse. I must vote to set the right example.
  *   **C.** Yes. We are effectively a team of two. Our combined action matters, so I should act as part of that team.

  **4. The Margin of Defeat**
  Your candidate loses. Two scenarios are possible: Scenario 1, they lose by one single vote. Scenario 2, they lose by one million votes. In which scenario do you feel more regret about staying home?
  *   **A.** Scenario 1. Being the one person who could have tipped the scale would be unbearable.
  *   **B.** Scenario 2. The magnitude of the loss matters more than the margin.
  *   **C.** Neither. If I stayed home for a good reason, the margin doesn't change my conscience.

  **5. The Union Hall**
  You are a member of a large labor union. The union leadership has officially endorsed a candidate and organized a bloc vote. They expect all members to participate to show strength. How do you view your vote?
  *   **A.** As my own private choice. The union's expectation doesn't change the math of my individual impact.
  *   **B.** As a contribution to a collective action. My vote counts as part of the union's total power, not just as one isolated mark.
  *   **C.** As a signal of loyalty. It shows the leadership and my peers that I stand with them.

  **6. The Mathematician's Warning**
  A mathematician proves to you that the statistical probability of your vote deciding the election is literally 1 in 100 million. The cost of voting (time, travel) is worth $20 to you. The benefit of your candidate winning is worth $10,000 to you. The expected value is negative. What do you do?
  *   **A.** I stay home. The math is clear, and I shouldn't act against clear evidence.
  *   **B.** I vote anyway. The math ignores the moral duty I have to my community.
  *   **C.** I vote anyway. When you multiply that tiny probability by the benefit to the whole country, the math actually works out in favor of voting.

  **7. The Storm**
  On election day, a severe storm hits. Going to the polls is now difficult, dangerous, and time-consuming. The cost of voting has gone up significantly. Does this change your obligation to vote?
  *   **A.** Yes. If the cost exceeds the likely benefit, a rational person stays home.
  *   **B.** No. A duty is a duty; hardship makes fulfilling it more important, not less.
  *   **C.** Yes, but differently. Voting in the storm sends a stronger message of commitment than voting in the sun.

  **8. The Secret Ballot**
  Imagine a system where votes are perfectly secret. No one will ever know if you voted, not even the government. You will only know yourself. Does this change your motivation?
  *   **A.** Yes. Without public recognition or social pressure, there is little reason to bother.
  *   **B.** No. I vote for my own satisfaction and to express my values, regardless of an audience.
  *   **C.** No. I vote because it is the right thing to do, even if no one is watching.

  **9. The Honest Friend**
  A friend says to you: "Look, you're not going to change anything. You're voting because it makes you feel good, not because it does any good." How do you respond?
  *   **A.** "You're probably right. I know it doesn't make sense instrumentally, but I do it anyway."
  *   **B.** "You're wrong. It does do good, because we have to think about what happens if everyone acts like you."
  *   **C.** "You're wrong. It's not about 'doing good' in terms of results; it's about having a voice."

  **10. The Collective Decision**
  Imagine your neighborhood forms a small association. The association votes on whether the *individuals* within it should go to the national polls. The association decides "Yes." Do you go?
  *   **A.** Only if I agree with the decision. I am the ultimate decider of my own actions.
  *   **B.** Yes. As a member of the association, their decision is my decision. We act as one body.
  *   **C.** Yes. But mostly because I don't want to be the outlier who broke the group's consensus.

  ***

  ### Part II: Scoring Key & Interpretation

  **Instructions for the Instructor:**
  Have students tally which letter they selected most frequently. However, the diagnostic power lies in specific *combinations* of answers. Below is a mapping of answer choices to theoretical positions.

  **Position Codes:**
  *   **[EXP]** Expressive Voting
  *   **[ALTR]** Ethical-Altruistic Voting
  *   **[DUTY]** Duty-Based Voting
  *   **[RULE]** Rule-Consequentialist Voting
  *   **[REG]** Minimax Regret
  *   **[RAT]** Rational-Irrationality / Ignorance
  *   **[GRP]** Group-Agency Voting

  **Answer Mapping:**

  | Q | Option A | Option B | Option C |
  | :--- | :--- | :--- | :--- |
  | **1** | [RAT] | [EXP] | [DUTY] |
  | **2** | [RAT] | [ALTR] | [EXP/DUTY] |
  | **3** | [RAT/EXP] | [RULE] | [GRP] |
  | **4** | [REG] | [ALTR] | [DUTY] |
  | **5** | [RAT/EXP] | [GRP] | [EXP] |
  | **6** | [RAT] | [DUTY] | [ALTR] |
  | **7** | [RAT] | [DUTY] | [EXP] |
  | **8** | [EXP] | [EXP] | [DUTY] |
  | **9** | [RAT] | [RULE] | [EXP] |
  | **10** | [RAT/EXP] | [GRP] | [EXP] |

  *(Note: Some options map to multiple positions because the vignettes are designed to be accessible, not formally rigorous. The scoring key below prioritizes the strongest signal.)*

  #### Primary Diagnostics (Dominant Patterns)

  1.  **The Expressive Voter ([EXP]):**
      *   **Pattern:** High frequency of B/C on Q1, Q2, Q8, Q9.
      *   **Logic:** They view voting as consumption, not investment. They value the act itself (voice, loyalty, identity) over the outcome.
      *   **Key Indicator:** Q9 Option C ("It's about having a voice") and Q1 Option B ("Meaningful act in itself").

  2.  **The Ethical-Altruist ([ALTR]):**
      *   **Pattern:** High frequency of B on Q2, Q4, Q6.
      *   **Logic:** They accept the instrumental framework but argue the *benefit* term in the equation is massive (social welfare), outweighing the low probability.
      *   **Key Indicator:** Q6 Option C (Accepts the math but argues the social benefit makes the expected value positive).

  3.  **The Duty-Bound Citizen ([DUTY]):**
      *   **Pattern:** High frequency of C on Q1, Q6, Q7, Q8.
      *   **Logic:** Voting is a categorical obligation. Costs and probabilities are morally irrelevant.
      *   **Key Indicator:** Q7 Option B (Voting even in a storm due to obligation) and Q6 Option B (Rejecting the math in favor of moral duty).

  4.  **The Rule-Consequentialist ([RULE]):**
      *   **Pattern:** High frequency of B on Q3, Q9.
      *   **Logic:** They universalize the maxim of their action. "What if everyone reasoned that voting is pointless?"
      *   **Key Indicator:** Q3 Option B (The clone reasoning) and Q9 Option B (What happens if everyone acts like you).

  5.  **The Regret-Avoider ([REG]):**
      *   **Pattern:** Dominant A on Q4.
      *   **Logic:** Decision-making is driven by minimizing the emotional pain of the "worst-case scenario" (losing by one vote).
      *   **Key Indicator:** Q4 Option A is the nearly exclusive marker for this position.

  6.  **The Rational-Irrationalist ([RAT]):**
      *   **Pattern:** High frequency of A on Q1, Q6, Q7, Q9.
      *   **Logic:** They admit that, strictly speaking, voting makes no instrumental sense. They vote due to habit, error, or low-cost heuristic.
      *   **Key Indicator:** Q9 Option A ("You're probably right... I do it anyway") and Q6 Option A (Following the negative expected value).

  7.  **The Group-Agent ([GRP]):**
      *   **Pattern:** High frequency of B/C on Q3, Q5, Q10.
      *   **Logic:** The individual is a limb of a larger body (union, party, community). The unit of agency is the collective.
      *   **Key Indicator:** Q10 Option B ("Their decision is my decision") and Q5 Option B (Vote as part of bloc power).

  ***

  ### Part III: Instructor's Guide to Overlaps and Incoherence

  **1. The Expressive/Duty Overlap**
  *   **The Issue:** Questions 1, 7, and 8 often yield similar answers for Expressive and Duty voters. Both reject cost-benefit analysis.
  *   **Differentiation:** Look at **Q9**. Expressive voters talk about "voice" or "feeling." Duty voters talk about "obligation" or "right thing." Look at **Q7**. Duty voters vote *despite* cost; Expressive voters might vote *because* the cost signals commitment (Option C).
  *   **Pedagogical Note:** If a student scores high on both, they likely hold a hybrid view where civic duty is internalized as a form of identity expression. This is a stable position (often called "Civic Republicanism").

  **2. The Rule-Consequentialist / Altruist Overlap**
  *   **The Issue:** Both positions conclude "Vote!" based on large-scale consequences.
  *   **Differentiation:** Look at **Q3** and **Q6**. The Altruist believes *their specific vote* has expected value because the stakes are high (Causal). The Rule-Consequentialist believes *their reasoning* must be universalizable to avoid disaster (Logical).
  *   **Pedagogical Note:** Students who choose Q6-C (Math works) are Altruists. Students who choose Q3-B (Clone reasoning) are Rule-Consequentialists. This is a crucial distinction for later lectures on Kantian vs. Utilitarian reasoning.

  **3. Logically Incoherent Patterns**
  *   **The "Magic Vote" Pattern:** Selecting **Q1-A** ("Vote is a waste" / Outcome fixed) AND **Q4-A** ("Regret losing by 1 vote").
      *   **Diagnosis:** This student believes the vote cannot change the outcome (Q1) but simultaneously fears it *would have* changed the outcome (Q4).
      *   **Classroom Use:** This is a prime candidate for discussing probability misperception. They are emotionally committed to the Minimax Regret model but intellectually committed to the Rational-Irrational probability assessment.
  *   **The "Selfless Self-Interest" Pattern:** Selecting **Q2-A** (Only personal stakes matter) AND **Q6-B** (Moral duty to community).
      *   **Diagnosis:** Contradictory motivations regarding the source of value.
      *   **Classroom Use:** Highlights the tension between Public Choice theory (self-interest) and Normative Theory (obligation).

  **4. The "Unexplored" Pattern**
  *   **Pattern:** High scores on **Group-Agency** combined with **Rational-Irrationality**.
      *   **Diagnosis:** "I vote because my group tells me to, even though I know the group's vote doesn't mathematically matter."
      *   **Literature Status:** This is underexplored in standard rational choice texts, which focus on the individual. It aligns more with sociological models of voting (e.g., Rosenstone & Hansen) or identity politics. It is not incoherent, but it challenges the methodological individualism of the course.

  **5. The "Pure Instrumentalist" (The Null Result)**
  *   **Pattern:** Dominant **A** responses across the board.
  *   **Diagnosis:** This student is the "Homo Economicus" ideal type. They likely do not vote in real life, or they admit they are irrational when they do.
  *   **Classroom Use:** Use this student as the baseline for the Paradox. Their behavior is the control group against which the other theories are measured.

  ### Final Pedagogical Recommendation
  Do not reveal the "correct" theoretical labels immediately. After collecting the quizzes, display the aggregate class data anonymously. Ask: *"Why did 40% of you choose Option B on Question 6, while 30% chose Option A?"* Let the students debate the reasoning first. Then, introduce the theoretical labels (Expressive, Duty, etc.) as names for the clusters of reasoning they have already demonstrated. This validates their intuition before subjecting it to formal critique.
