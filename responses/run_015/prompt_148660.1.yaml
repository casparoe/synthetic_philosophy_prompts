prompt: |-
  quick context: i'm a 4th-year and I'm finally writing the framework/lit section of a paper on pragmatic encroachment, and I've realised I spend all my time arguing about individual cases instead of about what the cases are supposed to show. So: help me write the spec. What does a theory of the stakes-sensitivity of knowledge attributions have to be able to do to count as adequate? I want desiderata with the case or consideration behind each one, and I want them sorted into three buckets — (i) genuine adequacy conditions that any view in this area has to meet, (ii) conditions that are only non-negotiable if you've already bought into one camp's wider commitments (stuff like: knowledge is the norm of assertion; knowledge is the norm of practical reasoning; attributions must be objective in whatever sense factivity is supposed to guarantee; the semantics has to be compositional and behave normally under embedding; the view has to deliver some particular anti-skeptical or pro-skeptical datum), and (iii) things people demand that are really just prejudice. My supervisor keeps asking whose stakes and I never have a good answer, which is part of why I want the list.

  Fix the purpose as follows: the theory is meant to be a semantics (plus pragmatics if that's where the action is) for 'S knows that p' in ordinary English — including inside conditionals, belief reports and questions, which is where my friend in formal semantics says all the contextualist views quietly cheat — and it's also meant to do three jobs in epistemology: explain the pull of the skeptical argument without turning ordinary knowledge claims into noise, explain why knowledge rather than mere justified true belief is what we cite when we say someone is in a position to assert or to act, and say something about why knowledge is what we care about having. Every family of view is on the table: attributor-contextualism, interest-relative/subject-sensitive invariantism, relativist views where the standards of assessment come apart from the standards of use, hybrids, whatever.

  My starting list, which I'm sure is partly garbage — tell me which entries are real desiderata, which are two entries wearing a coat, and what's missing. (a) the bank/airport family: the theory has to say whether the datum is about knowledge at all or just about what the subject ought to do next (go check the schedule), and whether it is the stakes, the cost of further inquiry, or the salience of the error possibility that's doing the work. (b) what stakes even are: expected disvalue, worst-case magnitude, how many people are affected, or the subject's actual preferences — test it with the agent who stands to lose everything and couldn't care less, and with the anxious agent for whom every decision is life-or-death. (c) whose stakes, when the subject's and the attributor's come apart: I tell you Sam knows the train goes at 4; you're deciding whether to stake something huge on it, I'm making small talk; and if the view gives a different verdict for each of us, does it also have to say that you and I are having a genuine disagreement rather than talking past each other, given we share all the evidence and the conversational score? (d) the looping case I made up and can't get anyone to engage with: whether it's correct to attribute knowledge to the resident depends on whether the attending will treat the question as settled, and whether the attending treats it as settled depends on whether she takes the resident to know — so the theory should say whether knowledge attributions there have a determinate truth value at all, and whether self-fulfilling attributions are allowed. (e) the emergency/no-time-to-inquire case, where stakes are maximal and getting more evidence is impossible: does the view predict knowledge gets easier or harder, and if it predicts harder in both directions is it just redescribing a norm of action? (f) whether other epistemic vocabulary shifts in tandem — certain, sure, has checked, is in a position to know, warranted, the evidence supports — and whether it's a cost if it doesn't. (g) whether there's a sharp evidential threshold on a continuous scale, with the lottery-style worries that invites and the question of whether 'knows' ends up gradable like 'flat'. (h) the legal end: the fact that in high-stakes settings we refuse to treat bare statistical evidence as enough, and what a stakes-based theory should say about that. Plus the time-travel worry: in a calm conversation later, we assess what somebody said during the high-stakes one, and the view should say which standards govern that assessment.

  Then the part I actually want: flag any pair or subset of the desiderata that can't be jointly satisfied — if the list is inconsistent that's a result I can use in the paper — and tell me which single requirement is doing the most exclusionary work across the families of view above. Keep any scorecard to two or three lines per view; the criteria are the deliverable, I'll do the arguing myself in the seminar on thursday.
