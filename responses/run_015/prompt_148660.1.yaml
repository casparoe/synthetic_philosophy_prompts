answer: |-
  This is a strong pivot. Moving from "intuition-pumping" to "theoretical specification" is exactly what distinguishes a 4th-year paper from a term essay. Your supervisor's question ("Whose stakes?") is the lever that breaks the cases open; the framework needs to treat the answer to that not as a bug, but as the primary parameter of variation between theories.

  Here is the specification for a theory of stakes-sensitive knowledge attributions, sorted by necessity, followed by the inconsistency check and the exclusionary constraint.

  ### I. The Desiderata Specification

  #### (i) Genuine Adequacy Conditions
  *These are structural requirements. Any view claiming to offer a semantics + epistemology must provide a mechanism to handle these, even if the output is "knowledge is invariant."*

  1.  **The Embedding Constraint (The "Friend's" Demand):** The theory must assign truth conditions to 'S knows that p' that compose normally under negation, conditionals, and attitude reports.
      *   *Case:* "If Sam knows the train leaves at 4, we should buy the tickets now." If stakes-sensitivity is purely pragmatic, this conditional often fails to bind the practical parameter correctly. A semantic view must explain how the stakes parameter projects or shifts inside the 'if'.
  2.  **The Disagreement Constraint:** The theory must explain whether two attributors assessing the same subject with the same evidence but different practical contexts are contradicting each other or talking past one another.
      *   *Case:* (Your list c). I say "Sam knows" (low stakes); you say "Sam doesn't know" (high stakes). Do we disagree? A semantics must fix the parameters of evaluation to determine if this is a contradiction.
  3.  **The Retrospective Assessment Constraint:** The theory must specify which context governs the truth of past-tense knowledge claims.
      *   *Case:* (Your list h, time-travel). In a calm debrief, we say "You knew it then." Do we evaluate based on the stakes *then* (subject's) or *now* (attributor's)? The theory must pick a parameter for temporal shift.
  4.  **The Vocabulary Cohesion Constraint:** The theory must predict whether neighboring epistemic terms ('certain', 'evidence', 'justified') shift in tandem with 'knows' or remain fixed.
      *   *Case:* (Your list f). If 'knows' shifts with stakes but 'evidence' does not, the theory must explain the disconnect without making 'knows' look like an outlier in the lexicon.

  #### (ii) Camp-Specific Commitments
  *These are non-negotiable only if you accept specific epistemic norms or metaphysical pictures. They define the "families" of views.*

  1.  **The Action-Knowledge Link:** If you hold that knowledge is the norm of practical reasoning/assertion, the theory must predict knowledge loss when action becomes too risky.
      *   *Case:* (Your list a & e). In the Bank/Emergency cases, if you can't act on *p*, do you fail to know *p*? (SSI says Yes; Contextualism says No, you just can't assert).
  2.  **The Statistical Evidence Constraint:** If you hold that knowledge explains the legal refusal of bare statistical evidence, the theory must explain why high stakes make statistical evidence insufficient.
      *   *Case:* (Your list h, legal end). Does the stakes-sensitivity explain the "gatecrasher" paradox, or is that a separate normative rule?
  3.  **The Skeptical Pressure Valve:** If you prioritize dissolving skepticism, the theory must allow 'knows' to be true in ordinary contexts despite uneliminated error possibilities.
      *   *Case:* Contextualism treats this as a hard constraint; Invariantism treats it as a bullet to bite. Your theory must declare its stance on ordinary error.

  #### (iii) Prejudice / Implementation Details
  *These are often demanded as "gotchas" but are actually metaphysical or psychological implementation details, not semantic adequacy conditions.*

  1.  **The Metric of Stakes:** Demanding a specific definition of stakes (expected utility vs. worst-case) is premature.
      *   *Case:* (Your list b). The anxious agent vs. the indifferent agent. A semantic theory can plug in *any* decision-theoretic model. Demanding one specific metric confuses the semantics with the psychology of the subject.
  2.  **Determinacy in Loops:** Demanding a binary truth-value in self-fulfilling loops begs the question against supervaluationist or relativist gaps.
      *   *Case:* (Your list d). The resident/attending loop. It is a valid stress test, but requiring a *determinate* "True/False" output assumes bivalence where the phenomenon might be indeterminate.
  3.  **Anti-Skeptical Outcomes:** Demanding the theory *preserve* ordinary knowledge claims is a bias, not a datum.
      *   *Case:* A theory is adequate if it explains *why* we make the claims, even if it concludes they are mostly false (skepticism).

  ---

  ### II. Inconsistencies and Trade-offs

  Your list contains a "Trilemma" that generates the inconsistency you can exploit in the paper. You cannot jointly satisfy the following three without significant theoretical cost (usually paid by Relativism):

  1.  **Stakes-Sensitivity:** The truth of 'S knows' varies with practical interests (from the PE commitment).
  2.  **Standard Compositionality:** The semantics behaves like standard predicates under embedding (from the Semantic commitment).
  3.  **Genuine Disagreement:** Attributors in different contexts can genuinely contradict each other about the same subject (from the Disagreement Constraint).

  **The Conflict:**
  *   **Contextualism** satisfies (2) and (3) only by redefining disagreement (we talk past each other), but sacrifices the intuition that we are arguing about the *same* knowledge.
  *   **SSI (Invariantism)** satisfies (2) and (3) only by making knowledge invariant (denying 1), or by making 'knows' sensitive to the *subject's* stakes, which makes *attributor* disagreement inexplicable (if I'm low stakes and you're high stakes, why am I wrong to say Sam knows?).
  *   **Relativism** satisfies (1) and (3) but struggles with (2). It treats the "circumstance of evaluation" as including the assessor's context, which breaks standard embedding in conditionals (e.g., "If I know, I'll bet" — whose stakes govern the conditional?).

  **Missing from your list:** You need to explicitly add **The Embedding Constraint** (from Bucket i above) to your list (a-h). Your friend in formal semantics is right: this is where Contextualism usually hides the stakes-sensitivity in pragmatics to avoid breaking the logic. If you move it to semantics to satisfy the epistemic jobs, you break the logic.

  ---

  ### III. The Most Exclusionary Requirement

  **The Embedding Constraint under Stakes-Sensitivity.**

  This is the single requirement doing the most exclusionary work.
  *   **Why:** It is relatively easy to say "stakes matter for action" (Epistemology). It is relatively easy to say "context shifts meaning" (Semantics). It is extremely difficult to say "the truth value of 'S knows' depends on practical interests *and* this dependency survives inside 'If...', 'Believes...', and 'Necessarily...'."
  *   **Impact:** This requirement kills "pragmatic-only" encroachment (which says 'knows' is invariant but assertion is sensitive) because it fails the *Epistemic Job* (explaining why knowledge itself is what we care about). It kills standard SSI because it cannot easily explain how *my* assessment of *your* knowledge claim embeds in my reasoning. It forces the theory to choose between being a good semantics (Contextualism) or a good epistemology (SSI), with Relativism attempting a costly hybrid.

  ---

  ### IV. View Scorecards

  **Attributor-Contextualism**
  *   *Semantics:* 'Knows' indexical to attributor's context. Embeds well.
  *   *Epistemology:* Fails the "Norm of Action" job (Subject's stakes don't affect truth).
  *   *Disagreement:* Explains away cross-context disagreement as verbal.

  **Subject-Sensitive Invariantism (SSI/IRI)**
  *   *Semantics:* 'Knows' sensitive to subject's stakes. Embedding is problematic in conditionals.
  *   *Epistemology:* Excellent fit for "Knowledge norms action."
  *   *Disagreement:* Struggles to explain why low-stakes attributor is wrong about high-stakes subject.

  **Assessment-Relativism**
  *   *Semantics:* Truth relative to assessor. Embedding requires non-standard logic.
  *   *Epistemology:* Captures retrospective assessment (Time-travel) best.
  *   *Disagreement:* Preserves genuine disagreement, but at high metaphysical cost.

  **Recommendation for Thursday:** Frame the paper not as "Which view wins?" but as "Which cost is acceptable?" Use the **Embedding Constraint** to show why pragmatic encroachment is semantically unstable, and the **Action-Knowledge Link** to show why invariantism is epistemologically inert. The "Whose Stakes" question is the pivot: if it's the Subject's, you break semantics; if it's the Attributor's, you break epistemology.
