      *   **Scope:** Semantics + Pragmatics for 'S knows that p' (including embeddings) + 3 Epistemic Jobs (Skepticism, Norm of Assertion/Action, Value of Knowledge).
      *   **Views on Table:** Contextualism, Subject-Sensitive Invariantism (SSI/IRI), Relativism, Hybrids.
