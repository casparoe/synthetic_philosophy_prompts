answer: |-
  # Sidebar Blueprint: The Therapy/Enhancement Decision Tree

  ## Part 1: The Interactive Script (Reader View)
  *Seven questions. Answer honestly. The path determines your position.*

  **1. The Stimulant Case**
  A student takes focus medication. They perform better, but have no diagnosis. Is this cheating?
  *   **A:** Yes, without a diagnosis it's illicit. (Go to 2)
  *   **B:** No, only the result matters. (Go to 3)

  **2. The Authority Case (GLP-1)**
  A healthy person wants weight-loss drugs. Who decides if they qualify?
  *   **A:** Doctors, based on biological facts. → **Leaf: Skeptical Institutionalism**
  *   **B:** Society, through democratic debate. → **Leaf: Democratic Proceduralism**

  **3. The Mismatch Case (Attention)**
  Your brain is species-typical, but modern life breaks your focus. Fixing this is:
  *   **A:** Repairing a broken fit. (Go to 4)
  *   **B:** Upgrading a working system. (Go to 5)

  **4. The Context Case (Growth Hormone)**
  In a country where everyone is short, is tallness a medical need?
  *   **A:** Yes, health depends on functioning in your society. → **Leaf: Fair Equality of Opportunity** (Daniels)
  *   **B:** No, health is biological, not social. → **Leaf: Species-Typical Normalism** (Boorse)

  **5. The Ceiling Case (Testosterone)**
  Restoring a 70-year-old to their own 30-year-old hormone levels is:
  *   **A:** Medicine (Restoration). (Go to 6)
  *   **B:** Enhancement (Aging is natural). (Go to 7)

  **6. The Threshold Case (Vaccination)**
  Vaccines exceed natural immunity. We allow them because:
  *   **A:** We need a sufficient shield against harm. → **Leaf: Capabilities Threshold** (Nussbaum)
  *   **B:** More protection is always better. → **Leaf: Welfarist Consequentialism** (Savulescu)

  **7. The Identity Case (Memory)**
  Damping a traumatic memory is:
  *   **A:** Healing a wound. → **Leaf: Positional/Arms-Race View** (Hirsch)
  *   **B:** Editing the self. → **Leaf: Giftedness/Openness** (Sandel)

  *(Note: To reach 10 leaves, split Leaf 7B into **Strict Naturalism** [Reject vaccines] and **Giftedness** [Accept vaccines, reject memory edit], and add **Radical Liberty** [No line ever] from 5B.)*

  ***

  ## Part 2: The Logical Map (Editor's Key)

  **The Leaves (10 Total)**
  1.  **Skeptical Institutionalism:** The line tracks whatever diagnostic institutions recognize this decade. *Awkward commitment:* If psychiatry expands tomorrow, therapy expands with it.
  2.  **Democratic Proceduralism:** The distinction has no moral force but an administrative line must be drawn democratically. *Awkward commitment:* A vote could ban insulin tomorrow.
  3.  **Fair Equality of Opportunity:** Health is the capacity to participate in one's specific society. *Awkward commitment:* Moving to a more demanding society makes you sicker.
  4.  **Species-Typical Normalism:** Health is functioning within the species-typical range. *Awkward commitment:* If everyone becomes obese, obesity becomes healthy.
  5.  **Capabilities Threshold:** Interventions are required to reach a sufficiency threshold, not maximize. *Awkward commitment:* We owe you a cure, but not an upgrade.
  6.  **Welfarist Consequentialism:** There is no morally relevant discontinuity, only a graded cost-benefit profile. *Awkward commitment:* We should enhance children if it makes them happier.
  7.  **Positional/Arms-Race:** Therapy and enhancement come apart because some goods are comparative. *Awkward commitment:* We must ban cures if they create unfair advantages.
  8.  **Giftedness/Openness:** We must remain open to the unbidden; editing the self is hubris. *Awkward commitment:* Suffering may be a gift we shouldn't refuse.
  9.  **Strict Naturalism:** (Split from 7B) Nature is the sole guide; vaccination is suspect. *Awkward commitment:* Antibiotics are immoral interference.
  10. **Radical Liberty:** (Split from 5B) Market freedom overrides all biological lines. *Awkward commitment:* Safety regulations are paternalistic overreach.

  **Empty Combinations**
  *   **Giftedness + Welfarist:** *Incoherent.* You cannot value unbidden limits while maximizing welfare without limit.
  *   **Strict Naturalism + Vaccination:** *Unattractive.* Rejecting immune enhancement while accepting therapy is biologically inconsistent.
  *   **Democratic + Skeptical:** *Unexplored.* Why vote on a line if you believe experts alone can find the biological truth?

  **Special Case Adjudication**
  *   **Mismatch Repair:** Routes to **Fair Equality** (Node 3A). *Cost:* Admits "disease" is partly environmental, not just biological.
  *   **Counterfactual-Person Baseline:** Routes to **Skeptical/Normalism** (Node 1A). *Cost:* Relies on institutional diagnosis rather than individual trajectory.

  **Indistinguishable Leaves**
  *   **Fair Equality vs. Capabilities:** Both demand social provision for function.
  *   **Separating Case:** *Expensive Tastes.* If reaching the threshold requires rare, costly resources, Capabilities may demand provision while Fair Equality may not.
