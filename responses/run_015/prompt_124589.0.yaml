answer: |-
  ### Part 1: Brainstorming Session Shapes

  1.  **The Human Dataset:** Each student represents 5–10 patients holding a card. They physically cluster by treatment, then by covariate.
      *   *Pros:* High energy, visceral sense of sample size.
      *   *Cons:* Hard to count accurately while standing; difficult to re-sort for the "dial" phase without chaos; 14 students limits data resolution.
  2.  **The Consultant War:** Split class into two firms. Both get the same data packet. Firm A must argue for Treatment A; Firm B for Treatment B. They present summary stats to a "board" (you).
      *   *Pros:* Directly hits Goal 1 (honest disagreement); creates adversarial engagement.
      *   *Cons:* Risks degenerating into rhetoric; might obscure the math mechanics of the paradox in favor of persuasion.
  3.  **The Audit Team (Selected):** Four teams of analysts receive identical decks of patient cards. They must sequentially audit the data: first overall, then by severity, then by severity + clinic.
      *   *Pros:* Forces everyone to touch the data; makes the "partition dial" physical (sorting piles); naturally reveals empty cells in Phase 3.
      *   *Cons:* High prep load (writing cards); requires tight timekeeping to avoid getting stuck in arithmetic.

  **Selection:** I'd run **The Audit Team**. It best serves Goal 3 (the partition dial) because physical sorting makes the "thin strata" problem tangible—you literally run out of cards. It also neutralizes the stats/philosophy divide by making counting a collective manual task rather than a conceptual debate initially.

  ---

  ### Part 2: Full Session Design

  **Title:** The Policy Audit
  **Time:** 75 Minutes
  **Materials:** 
  *   4 decks of 60 index cards (240 total). 
  *   Whiteboard & markers.
  *   One handout per team (simple tally sheet).

  **The Data (For your prep):**
  You need 4 identical decks. Each deck has 60 cards. Each card has 4 fields: **Treatment** (New/Old), **Outcome** (Success/Fail), **Severity** (Mild/Severe), **Clinic** (A/B).
  *Write these counts on the cards (batch write them to save time):*

  | Severity | Treatment | Clinic | Outcome | Count | Notes |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Mild** | New | A | Success | 12 | |
  | | | | Fail | 12 | |
  | | Old | A | Success | 1 | *Rare* |
  | | | | Fail | 0 | |
  | | Old | B | Success | 3 | |
  | | | | Fail | 2 | |
  | **Severe** | New | A | Success | 0 | *Empty Cell* |
  | | | | Fail | 1 | |
  | | New | B | Success | 1 | |
  | | | | Fail | 4 | |
  | | Old | B | Success | 5 | |
  | | | | Fail | 19 | |

  *Check sums:* 
  New Total: 12+12+1+0+1+4 = 30 cards. (13 Success, 17 Fail). Success Rate = 43%.
  Old Total: 1+0+3+2+5+19 = 30 cards. (9 Success, 21 Fail). Success Rate = 30%.
  *Aggregate:* New looks better (43% vs 30%).

  *Check Stratified (Severity):*
  Mild New: 12/24 = 50%.
  Mild Old: 4/6 = 67%. (Old better)
  Severe New: 1/6 = 17%.
  Severe Old: 5/24 = 21%. (Old better)
  *Stratified:* Old looks better in both.

  *Check Stratified (Severity + Clinic):*
  Mild + Clinic B: New has 0 cards. Old has 5. (Cannot compare).
  Severe + Clinic A: New has 1 card. Old has 0 cards. (Cannot compare).
  *Fine Strata:* Comparison breaks down.

  **Timeline & Flow:**

  **0:00 – 0:05 | Setup & Roles**
  *   Divide into 4 teams (3-4 students each). Mix stats/philosophy majors evenly.
  *   Hand each team a deck of 60 cards and a tally sheet.
  *   **Instruction:** "You are auditors for the Health Ministry. You have raw patient records. Do not theorize yet. Just count."

  **0:05 – 0:20 | Phase 1: The Aggregate**
  *   **Task:** Calculate the overall success rate for New vs. Old treatment.
  *   **Action:** Teams sort cards into two piles (New/Old) and count successes.
  *   **Vote:** "Based *only* on this, which treatment do you approve?" (Expect consensus: New).
  *   **Board:** Write the two rates on the board (43% vs 30%).

  **0:20 – 0:45 | Phase 2: The Confounder**
  *   **Task:** "We suspect patient health matters. Sort by Severity (Mild/Severe). Calculate success rates within each group."
  *   **Action:** Teams re-sort into 4 piles (New/Mild, Old/Mild, New/Severe, Old/Severe).
  *   **Conflict:** Teams will discover Old is better in both groups.
  *   **Vote:** "Based *only* on this, which treatment do you approve?" (Expect consensus: Old).
  *   **Board:** Write the four rates. Highlight the reversal.
  *   **Prompt:** "Did the data change? No. Did the math change? No. What changed?" (Elicit: The question we asked).

  **0:45 – 0:60 | Phase 3: The Dial**
  *   **Task:** "We need to be more precise. Control for Clinic location as well. Sort by Severity AND Clinic."
  *   **Action:** Teams attempt to sort into 8 piles (e.g., Mild/A/New, Mild/A/Old, etc.).
  *   **Discovery:** They will find empty piles (Mild/B/New has 0 cards; Severe/A/Old has 0 cards).
  *   **Crisis:** They cannot calculate a rate for New in Mild/B. The comparison vanishes.
  *   **Prompt:** "You turned the dial finer. Did you get closer to the truth, or did you break the measurement?"

  **0:60 – 0:75 | Debrief & Synthesis**
  *   Discuss the three goals (see below).
  *   Address the "Fourth Thing" (see below).
  *   Final takeaway: Data tables are silent; causal graphs speak.

  ---

  ### Part 3: Debrief Plan & Pitfall Management

  **Mapping Activities to Your Goals:**

  1.  **Honest Disagreement (Goal 1):** This happens between Phase 1 and Phase 2 votes. Both sets of numbers are true. The "work" the summary is doing is hiding the selection bias (New treatment went mostly to Mild patients).
      *   *If nobody bites:* Ask the Polisci students: "If you were opposing counsel, how would you use the Phase 1 numbers to sue the Ministry?" Then ask Philosophy students: "Is the Phase 1 number a lie?"
  2.  **Table vs. Story (Goal 2):** This is the core of the Phase 2 shock. The table didn't change, the recommendation flipped.
      *   *What to say:* "The table tells you *what happened*. It does not tell you *why* Treatment was assigned. If New was assigned to Mild patients because doctors knew it was weaker, Phase 2 is truth. If New was assigned to Mild patients because doctors knew it was stronger, Phase 1 might be truth. The numbers can't tell you which story is real."
  3.  **The Partition Dial (Goal 3):** This is Phase 3. Coarse (Phase 1) = Confounded. Medium (Phase 2) = Reversal. Fine (Phase 3) = Empty Cells (Positivity Violation).
      *   *What to say:* "You can't just 'control for everything.' If you control for enough, you end up comparing unique individuals, and statistics dies. You need to stop where the causal story says comparisons are fair, not where the data is thinnest."

  **Handling Predictable Pitfalls:**

  *   **Pitfall 1: The Early Spoiler.** A student says "It's Simpson's Paradox" in Phase 1.
      *   *Deflection:* "Great, you know the name. But names don't solve policy. If you were the doctor, which number do you put in the consent form? The 43% or the 50%? You have to choose one to act on."
  *   **Pitfall 2: Stats Students Dominate.** The Polisci majors do the math; philosophers watch.
      *   *Fix:* Enforce roles in Phase 1. One "Counter" (reads cards), one "Recorder" (writes tallies), one "Checker" (verifies sums). Rotate roles in Phase 2.
  *   **Pitfall 3: Relativism.** "So both are true? It just depends?"
      *   *Hard Stop:* "No. In reality, only one recommendation saves more lives. 'It depends' is a surrender. The data alone doesn't tell you which, which is exactly why you need a causal model (draw a DAG on board). Without the arrow direction, you are blind."

  **The "Fourth Thing" (Math Verification):**
  You are correct. You can construct a case where the treatment effect is **zero** in every subgroup, but the aggregate shows a **large** effect.
  *   *Math:* Let $P(Y|T=1, Z) = P(Y|T=0, Z)$ for all $Z$ (No causal effect).
  *   If $P(Z|T=1) \neq P(Z|T=0)$ (Selection bias) AND baseline risk $P(Y|Z)$ varies, then $P(Y|T=1) \neq P(Y|T=0)$.
  *   *Example for Class:* "Imagine a drug that does nothing. But doctors only give it to healthy people. The drug group has 90% survival. The no-drug group (sick people) has 10% survival. The table says the drug saves lives. The truth is it does nothing."
  *   *Where to use it:* Drop this in the last 5 minutes of debrief. It drives home that association is not causation even without a reversal—sometimes there's no effect at all.

  **Honesty Check: What This Game Can't Deliver**
  *   **The Causal Graph:** The activity proves the table is insufficient, but it doesn't tell them *how* to choose the right partition. You must explicitly state at the end: "This game leaves you in crisis. The solution is not more math, it's a diagram of the causal process (DAG). We will read Pearl next week to solve the crisis you just felt."
  *   **Statistical Uncertainty:** With 60 cards, the rates are exact. In reality, small strata mean high variance. You'll need to mention that empty cells are worse than noisy cells, but the activity treats them as absolute zeros.

  **Prep Note:**
  Write the cards clearly. Use colored dots for Treatment (Red=New, Blue=Old) to speed up Phase 1 sorting. Write Severity and Clinic in text. This saves 5 minutes of sorting time which you will need for the debrief.
