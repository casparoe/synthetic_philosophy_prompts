answer: |-
  You are running into one of the oldest and sharpest fights in economic theory. Your intuition is correct: your friend is using a logical maneuver that protects the theory of Rational Choice by making it unfalsifiable.

  Here is the breakdown of the phenomenon, the name of the maneuver, the distinction you need, and the criteria for when the explanation is honest versus a dodge.

  ### 1. The Phenomenon: The Decoy Effect
  What you are observing is the **Decoy Effect** (or **Asymmetric Dominance Effect**).
  *   **The Axiom Violated:** It violates the **Independence of Irrelevant Alternatives (IIA)**. Standard rationality says if you prefer A over B, adding C shouldn't change that preference unless C is chosen.
  *   **The Reality:** C changes the *perceived value* of B by making it look like a better deal relative to C, even if C is never bought.

  ### 2. The Friend's Move: "The Revealed Preference Shield"
  Your friend is invoking the **Revealed Preference Tautology**.
  *   **The Logic:** In strict neoclassical economics (following Paul Samuelson), "utility" is not a feeling; it is a number assigned to whatever was chosen. If a person chooses {A,B,C} over {A,B}, they *revealed* a preference for the larger set. If they choose A in one context and B in another, they simply have different utility functions for those contexts.
  *   **The Name:** In philosophy of economics, this is often called **"Rationalization by Redescription."** By expanding the "good" being chosen from the *plan* to the *menu*, any behavior can be described as rational.
  *   **The Critique:** The Nobel laureate **Amartya Sen** dismantled this in his famous 1977 paper, *"Rational Fools."* He argued that if you define rationality broadly enough to include "choosing the context," the word "rational" loses all meaning. It becomes a **Theory Protectionist** move: it saves the axioms from being proven wrong by redefining the data.

  **Coined Term for the Move:**
  Since you asked for a term if none fits perfectly, call this **"Post-Hoc Menu Reification."**
  *   **Definition:** The act of retroactively defining the *choice set* (the menu) as the *object of choice* to explain away a preference reversal, without having predicted that reversal in advance.
  *   **Why it fits:** It turns the *frame* (the menu) into a *thing* (the reified object) only after the data comes in.

  ### 3. The Distinction You Need: Naive vs. Sophisticated
  You asked for the distinction between "wanting options present" (flexibility) and "wanting options gone" (commitment). Your friend lumps these together as "choosing a menu." You need to separate them based on the user's **awareness**.

  In behavioral economics (specifically the work of **O'Donoghue & Rabin**), this is the distinction between **Naive** and **Sophisticated** agents.

  *   **Sophisticated (Honest Re-description):** The user *anticipates* their own future irrationality.
      *   *Example:* "I know I will binge-watch if I have autoplay, so I choose the plan without autoplay."
      *   *Why it's rational:* They are using a **Commitment Device**. They are paying to restrict their future self to maximize long-term utility.
      *   *Prediction:* They will express this desire *before* the temptation arises.
  *   **Naive (The Sleight of Hand):** The user is *influenced* by the menu without knowing it.
      *   *Example:* "I didn't think Plan C mattered, but somehow I bought Plan B."
      *   *Why it's a bias:* This is the **Decoy Effect**. They are not choosing the menu; the menu is choosing them.
      *   *Prediction:* They will deny the influence if asked (as you observed).

  **The Boundary:**
  The re-description is honest **only if the agent is Sophisticated.** If the user cannot articulate *why* the menu structure matters, claiming they "chose the menu" is a dodge.

  ### 4. When is the Re-description Honest? (The Prediction Test)
  You asked: *"Under what conditions would the re-description be honest rather than a dodge — what would it have to pay for, predict, or commit to in advance?"*

  This is the **Falsifiability Criterion** (Karl Popper).
  *   **The Dodge:** "They chose B because they preferred the {A,B,C} menu." (Explains everything, predicts nothing).
  *   **The Honest Model:** "Because this user segment exhibits high 'Need for Closure,' adding a decoy will shift 15% of users from A to B, *and* removing the decoy will shift them back."

  **The Test:**
  To stop the "Post-Hoc Menu Reification," demand **Ex-Ante Structural Prediction.**
  1.  **Commitment:** Before running the test, the model must state: "If we add C, B's share will rise by X%."
  2.  **Reversibility:** If we remove C, B's share must fall. (If it doesn't, the preference was latent, not constructed).
  3.  **Cross-Context Consistency:** If they claim users "value the 3-option menu," those same users should value 3-option menus in *other* categories (e.g., phone plans, insurance). If they only value it here, it's a nudge, not a preference.

  ### 5. Does Self-Reporting Matter?
  You asked: *"Does it matter that people will say out loud that the third plan shouldn't matter to them and then still get moved by it?"*

  **Yes. It is the smoking gun.**
  *   **Decision Utility vs. Experienced Utility:** Daniel Kahneman distinguishes between what we choose (Decision) and what we actually want/experience (Experienced).
  *   **Process Tracing:** If users say "C is irrelevant," they are reporting their **Decision Process**. If C changes their choice, the process is **Subconscious/Heuristic**.
  *   **The Implication:** If the user *says* it shouldn't matter, they are **Naive**. If they are Naive, your friend's claim that they "chose the menu" is false. They didn't choose the menu; they were manipulated by it.

  ### Summary for your next meeting
  When your friend says "They just preferred the 3-option menu," you can say:

  1.  **Name the Move:** "That is **Post-Hoc Menu Reification**. It makes the theory unfalsifiable."
  2.  **Name the Distinction:** "We need to distinguish between **Commitment Devices** (Sophisticated users restricting themselves) and **Decoy Effects** (Naive users being nudged)."
  3.  **The Test:** "If this is a genuine preference for the menu, we should be able to predict the shift **ex-ante** and reverse it by removing the option. If we can't, it's a bias, not a preference."
  4.  **The Evidence:** "The users explicitly state the third option is irrelevant. That confirms **Naivety**, which invalidates the 'rational choice of menu' defense."

  **The Term to Use:**
  Call it **"The Revealed Preference Shield."**
  *   **Definition:** A defensive maneuver where context-dependent biases are re-described as rational preferences for the choice set itself, solely to preserve the assumption of rationality after the data is observed.
  *   **Boundary:** It stops being a shield when the model generates **pre-registered predictions** about how specific context changes will alter specific choices across different scenarios.

  You are not seeing rational agents choosing menus; you are seeing **Constructed Preferences**. The menu isn't the meal; it's the table setting that changes how the food tastes. Your friend is arguing that because they ate the food, they must have chosen the table setting. You have the data to prove they didn't.
