          *   **Ending:** A single line starting with "Verdict:" followed by a brief judgment.

  2.  **Understand the Source Material ("A Person Paper on Purity in Language"):**
      *   Published in 1985 (in *Metamagical Themas*).
      *   Hofstadter creates a fictional society where race is grammaticalized like gender is in English. "He" becomes "whe" (white he) or "ble" (black he). "Man" becomes "whiteman" or "blackman."
