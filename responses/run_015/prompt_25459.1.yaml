      *   *Mapping to Bostrom:* Code review is "coordination/discussion." CI/CD is "automated constraints." A "central authority" would be a CTO who personally approves every commit (which doesn't scale).
      *   This helps validate the user's skepticism. Top-down control isn't the *only* way; process and culture work too.

  6.  **Draft the Response Structure:**
