      *   Elena: "We use probabilistic estimates."
      *   Marcus: "Probability doesn't escape the diagonal lemma."
      *   Elena: "We don't need 100% trust."
      *   Marcus: "What is 90% trust in a proof?"
      *   Elena: "It means we check the proof."
      *   Marcus: "Who checks the checker?"
