answer: |-
  It is a pleasure to engage with a colleague who understands the weight of inverse problems; you are essentially asking why the "forward model" of evolutionary theory (theory predicting simulation) is yielding residuals that you cannot account for. Given your background, you will appreciate that we are dealing with a system where the signal (selection for cooperation) is being drowned out by noise (stochastic dynamics and implementation errors).

  Before we diagnose the specific failure of your model, I must address your suspicion that you have conflated distinct theoretical concepts. In evolutionary game theory, precision of definition is everything, and three specific distinctions are likely blurring your interpretation of the results.

  **1. Nash Equilibrium vs. Evolutionary Stability**
  You cite the Folk Theorem, which guarantees that mutual cooperation is a *Nash Equilibrium* (NE) at $w=0.9$. An NE is a static condition: given that everyone else is playing the strategy, no *individual* can improve their payoff by unilaterally switching. However, evolution is a dynamic process driven by *Evolutionary Stable Strategies* (ESS). An ESS must not only be a Nash Equilibrium; it must be robust against invasion by a small population of mutants. Crucially, a strategy can be a Nash Equilibrium but fail to be an ESS if a mutant can do *equally well* (neutral invasion) and then drift to fixation due to finite population size. The Folk Theorem promises you a stable point in rational choice theory, not a stable attractor in evolutionary dynamics.

  **2. Protection Against Invasion vs. Protection Against Drift**
  Closely related is the distinction between *selection* and *drift*. Your arithmetic regarding the threshold for Tit-for-Tat (TFT) stability ($w > 2/3$) calculates whether AllD (Always Defect) can *selectively invade* TFT. If $w=0.9$, AllD cannot gain a foothold by selection alone. However, TFT is *neutrally* vulnerable to AllC (Always Cooperate). Against a population of TFT, AllC gets the exact same payoff. In a finite population (N=1000) with mutation (1%), AllC will inevitably appear. Once AllC drifts to a significant frequency, the "shield" against AllD disappears, because AllD thrives against AllC. This is the "subversion from within" problem. You are looking for a barrier against invasion, but your system is leaking via neutral drift.

  **3. Algorithmic Definition vs. Phenotypic Expression**
  Finally, you distinguish between the strategy as written in your code and the strategy as "played" in the environment. You treated the 0.5% execution error as a "harmless detail." In the physics of the Prisoner's Dilemma, noise is never harmless for TFT. TFT is a deterministic trigger strategy. In a noiseless world, TFT vs. TFT yields perpetual cooperation ($R$). In a noisy world, a single error triggers an endless alternating chain of retaliation (C,D $\to$ D,C $\to$ C,D...). The average payoff drops from $R=3$ to $(T+S)/2 = 2.5$. This reduces the fitness of cooperators relative to defectors, effectively lowering your $w$ below the stability threshold. You are simulating a "noisy TFT," which is a different strategy than the "perfect TFT" your arithmetic describes.

  ***

  ### Diagnosing the Collapse

  Based on these distinctions, your code is likely "correct" in that it accurately simulates the premises you gave it; rather, your premises about the robustness of TFT are the ones that do not hold up under the specific conditions you built.

  The collapse is almost certainly driven by the **0.5% execution error**, compounded by the **neutral drift of AllC**.

  Here is the logic: With 0.5% error, TFT playing against itself loses roughly 10-15% of its potential payoff due to feuds. This lowers the average fitness of the cooperative cluster. Meanwhile, your 1% mutation rate constantly reintroduces AllD and AllC. Because TFT cannot distinguish itself from AllC (neutral drift), AllC accumulates. Once AllC is present, AllD finds a niche. In a well-mixed population, there is no spatial structure to protect the cooperators, and the Fermi rule (imitation) relies on payoff differences. If noise reduces the payoff difference between Cooperators and Defectors, selection becomes weak, and random drift dominates. The system drifts toward the only absorbing state that is robust to noise and mutation: AllD.

  The "result" you recall—that no pure strategy is evolutionarily stable in the repeated Prisoner's Dilemma—is technically true in the limit of infinite horizons without discounting, but the practical version is that **TFT is not robust to noise.** The tournaments you remember (Axelrod's) were largely noiseless. When noise was introduced in later literature (e.g., by Nowak and Sigmund), TFT was dethroned by strategies like *Win-Stay-Lose-Shift* (WSLS) or *Generous TFT*.

  ### The Diagnostic Run

  To distinguish between "my code is broken," "error is the killer," and "TFT is fundamentally unstable," I recommend a single, clean change to your model.

  **The Change:** **Set the execution error rate to 0%.** Leave everything else (mutation, menu, Fermi rule, population size) exactly as it is.

  **The Predictions:**

  1.  **If Cooperation Stabilizes:** This confirms that your code logic is sound and that the **execution error** was the primary driver of collapse. It validates the theoretical claim that TFT is stable at $w=0.9$ *in the absence of noise*. It teaches you that reciprocity is fragile to implementation error.
  2.  **If Cooperation Still Collapses:** This indicates that **Neutral Drift (AllC)** or **Mutation Pressure** is the killer. Even without error, if AllC drifts into the population (since it does as well as TFT against TFT), AllD will eventually invade. This would confirm that TFT is not *asymptotically* stable in a finite population with mutation, regardless of noise.

  *Secondary Diagnostic (if you have time):* If the zero-error run still collapses, replace **Tit-for-Tat** with **Win-Stay-Lose-Shift** (cooperate if the last round was C,C or D,D; defect otherwise). WSLS corrects errors (D,D $\to$ C,C) and punishes AllC. If WSLS sustains cooperation where TFT failed, you have proven that the *mechanism* of reciprocity matters more than the *fact* of reciprocity.

  ### What to Tell Your Reading Group

  You asked what this says about cooperation. You should not tell them that "cooperation is impossible in well-mixed populations." That is too strong. Instead, you should tell them that **"Cooperation is robust only when the mechanism is robust to noise."**

  The collapse in your model demonstrates that reciprocity (direct exchange) is not a magic bullet. It requires specific conditions to function as a stabilizing force:
  1.  **Low Noise:** Or, more realistically, strategies that can forgive errors (like WSLS).
  2.  **Protection from Neutral Drift:** Mechanisms to distinguish cooperators from "suckers" (AllC).
  3.  **Assortment:** In nature, well-mixed populations are rare. Spatial structure or kin recognition allows cooperators to cluster, protecting them from the inevitable invasion of defectors.

  Your model did not fail to find cooperation because cooperation is mysterious; it failed because you built a model where the *specific engine* of cooperation you chose (TFT) was mechanically brittle. The philosophical lesson is that the existence of a Nash Equilibrium (a logical possibility for cooperation) does not guarantee its evolutionary accessibility. Nature does not select for logical consistency; it selects for dynamic resilience. Your simulation successfully demonstrated that while cooperation is *possible*, maintaining it requires more than just the willingness to reciprocate; it requires the capacity to recover from mistakes.

  In summary: Your arithmetic was correct for a idealized world. Your simulation was correct for a noisy one. The discrepancy is not a bug; it is the most interesting feature of the system. Turn off the error, watch it stabilize, and then turn it back on to show your group why "forgiveness" is mathematically necessary for peace.
