  **INTERNATIONAL COMMISSION ON STRATIGRAPHY**
  **SUBCOMMISSION ON QUATERNARY STRATIGRAPHY**
  **WORKING GROUP ON ANTHROPOCENE FORMALIZATION (WG-AF)**

  **CALL FOR NOMINATIONS: GLOBAL BOUNDARY STRATOTYPE SECTION AND POINT (GSSP) FOR THE BASE OF THE ANTHROPOCENE SERIES**

  **1.0 PREAMBLE**
  Following the dissolution of the previous Anthropocene Working Group and the subsequent non-ratification of the Crawford Lake proposal, the WG-AF hereby invites submissions for a definitive Global Boundary Stratotype Section and Point (GSSP). While the term "Anthropocene" remains in widespread colloquial and interdisciplinary usage, stratigraphic rigor requires a fixed horizon. The objective is to identify a physical boundary that resolves the diachroneity of anthropogenic impact into a synchronous stratigraphic event.

  **2.0 ELIGIBILITY**
  2.1 Nominations may be submitted by National Geological Surveys, accredited research consortia, or permanent custodial institutions.
  2.2 Private entities may submit only if partnered with a sovereign state member of the International Union of Geological Sciences.
  2.3 Sites currently inhabited by active human populations must demonstrate a legally binding preservation covenant guaranteeing zero disturbance for a minimum of 10,000 years.

  **3.0 EVALUATION CRITERIA AND SCORING RUBRIC**
  Submissions will be assessed on a 100-point scale. A minimum score of 85 is required for inclusion on the ratification ballot.

  *   **3.1 Stratigraphic Continuity (20 points):** The section must exhibit uninterrupted sedimentation across the proposed boundary. Gaps exceeding five years are disqualifying.
  *   **3.2 Global Synchrony (30 points):** The primary marker must be demonstrably simultaneous across all latitudes. Diachronous signals (e.g., plastic accumulation, carbon isotopes) must be corrected via modeled transfer functions to a single instantaneous horizon.
  *   **3.3 Preservability (20 points):** The marker must remain legible to standard lithological analysis after 10 million years of diagenesis. Organic markers must be mineralized or encapsulated.
  *   **3.4 Accessibility (10 points):** The site must be accessible to visiting geologists without requiring visas subject to geopolitical fluctuation.
  *   **3.5 Political Stability (20 points):** The host region must possess a governance structure capable of protecting the type section from the very civilization processes the section records.

  **4.0 ILLUSTRATIVE CASE STUDY**
  To clarify expectations regarding Criterion 3.2 and 3.3, the WG-AF provides the following abstract from a preliminary prospectus (Site ID: NULL-88):

  *   **Proposed Marker:** The Vitreous Capsule Horizon.
  *   **Description:** A concentrated layer of borosilicate glass capsules containing standardized isotopic signatures, intentionally buried at a depth of 4.5 meters within a stable cratonic basin.
  *   **Justification:** Unlike atmospheric radionuclides, which decay below detection thresholds, the capsules provide a permanent, non-decaying signal. The burial date is recorded on durable ceramic plques adjacent to the section.
  *   **Synchrony Protocol:** All capsules were buried simultaneously via coordinated detonation across twelve candidate sites, ensuring a globally synchronous physical event regardless of local sedimentation rates.

  **5.0 VOTING MEMBERSHIP**
  Ratification requires a two-thirds majority vote by the Subcommission on Quaternary Stratigraphy. The voting body shall consist of twenty-four appointed members. In the event of a tie, the Chair shall cast the deciding vote. The electorate is selected based on stratigraphic expertise, not regional representation.

  **6.0 APPENDIX A: EXEMPLAR FIELD LOG**
  *The following log entry demonstrates the intended legibility of the proposed stratum to future observers.*

  > **Log ID:** FUTURE-REF-01
  > **Observer:** Stratigrapher Kaelen, Cycle 440
  > **Location:** Type Section Sector 7
  > **Observation:** Boundary identified at 12.4 meters. Distinct shift from Holocene organic loam to Anthropocene technofossil breccia. Primary marker is a continuous lamina of high-density polyethylene, fused with fly ash. No bioturbation observed. The layer is sterile. The date inscribed on the adjacent titanium plate reads 2024, though the sedimentation rate suggests accumulation over forty years. We accept the plate date as the boundary definition. The discrepancy is noted but stratigraphically irrelevant.

  **7.0 CONTINGENCY PROTOCOLS FOR SYNCHRONY**
  7.1 Should no natural candidate achieve the required score for Global Synchrony (Criterion 3.2), the WG-AF reserves the right to designate an artificial boundary.
  7.2 In such instances, the base of the Anthropocene shall be defined as the exact Coordinated Universal Time (UTC) timestamp at which the ratification vote is successfully concluded.
  7.3 This timestamp shall be physically inscribed into the chosen Type Section post-ratification using laser ablation or permanent embedment.
  7.4 This procedure ensures that the boundary is perfectly synchronous globally, as the moment of definition becomes the moment of occurrence. All prior evidence of anthropogenic impact shall be reclassified as "Pre-Anthropocene" until the ratified timestamp is reached in the stratigraphic record.
  7.5 Sites unable to accommodate post-hoc inscription due to existing lithification will be excavated and re-deposited to ensure the marker lies at the correct stratigraphic level relative to the vote date.

  **8.0 SUBMISSION DEADLINE**
  Proposals must be received by 31 December 2025. Late submissions will be stratigraphically truncated.

  **END OF DOCUMENT**
