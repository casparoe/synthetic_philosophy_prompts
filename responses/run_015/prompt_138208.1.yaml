  The principle underlying your verdicts is not a single definition, but a **categorical distinction between the *engine* of growth and the *trajectory* of impact.**

  Your verdicts consistently treat **Intelligence Explosion** as a claim about *mechanism* (specifically, recursive self-acceleration), and **Fast Takeoff** as a claim about *shape* (specifically, the elapsed time to transformative impact). They are orthogonal axes. One describes *how* the change happens; the other describes *how fast* the world feels it.

  Here is the precise formulation of that principle, followed by the test cases and the honest limitations.

  ### The Principle: Decoupled Kinetics

  1.  **Intelligence Explosion (The Engine):**
      *   **Definition:** A regime where the **research doubling time decreases** over successive generations.
      *   **Condition:** This requires $R$ (AI share of AI R&D) to be sufficiently high *and* the loop gain to be sufficiently large that the time required to produce the next generation of AI is shorter than the time required to produce the current one.
      *   **Key Metric:** $\frac{d}{dt}(\text{Research Velocity}) > 0$.
      *   **Independence:** This can occur even if $L$ (deployment lag) is long. An explosion can be "bottled" in the research lab.

  2.  **Fast Takeoff (The Trajectory):**
      *   **Definition:** A regime where the **elapsed time** between AI reaching human-level economic utility and AI surpassing the aggregate productive capacity of human civilization is short (e.g., < 1 year).
      *   **Condition:** This requires the *deployed* capability curve to be steep. It does not require $R$ to be high; human-driven scaling can produce a takeoff.
      *   **Key Metric:** $\Delta t(\text{Human} \to \text{Superhuman})$ is small.
      *   **Independence:** This can occur even if $R = 0$. A "Manhattan Project" style mobilization can produce a takeoff without an explosion.

  ### Application to Your Unlisted Cases

  **Case A: $R$ crosses 0.9 quickly, but human institutions bind downstream constraints.**
  *   **Analysis:** The research loop is accelerating (Research Velocity increases), satisfying the Explosion condition. However, the deployment lag $L$ is effectively infinite due to institutional friction, keeping the deployed capability curve flat.
  *   **Verdict:** **Intelligence Explosion without Fast Takeoff.**
  *   **Reasoning:** The "engine" is screaming, but the "wheels" are stuck in the mud. The potential energy is explosive; the kinetic energy is not.

  **Case B: Individual system capability is smooth, but the number of systems doubles every month.**
  *   **Analysis:** Aggregate capability is growing exponentially with a short doubling time (1 month). This satisfies the Takeoff condition (steep deployed curve). However, if the *production* of these systems is constrained by human-built fabs and power plants ($R \approx 0$ for the scaling work), the research/production loop is not self-accelerating.
  *   **Verdict:** **Fast Takeoff without Intelligence Explosion.**
  *   **Reasoning:** This is a "scaling takeoff." The world changes incredibly fast (Takeoff), but the improvement is driven by external capital and labor, not internal recursive insight (No Explosion).

