answer: |-
  **The Value of the Non-Moral: Why Maximal Goodness Is an Undesirable Ideal**

  In her seminal 1982 paper "Moral Saints," Susan Wolf poses a question that strikes at the heart of ethical theory: Would we really want to be moral saints? By "saint," Wolf does not mean a religious figure, but a person whose every action is as morally good as possible. Intuitively, one might assume that maximal moral goodness is the highest human ideal. Wolf challenges this, suggesting that a life dedicated exclusively to moral optimization is not only psychologically difficult but genuinely undesirable.

  This debate often stalls over a confusion between being *maximally good* and being *morally obsessed*. Critics argue that a smart moral agent would know when to rest, implying sainthood is compatible with a rich life. Defenders of Wolf argue that even if a saint rests, they do so for the wrong reasons. Furthermore, the discussion expands to the social sphere: perhaps society requires a moral division of labor, where some pursue art or politics while others tend to moral duties. But if everyone were a saint, would this problem vanish?

  To answer whether maximal moral goodness is desirable, we must untangle the psychological from the normative. While it is possible to conceive of a saint who is not neurotically obsessed, the ideal remains undesirable. Maximal moral goodness is not a coherent universal ideal because it instrumentalizes human life, stripping non-moral goods of their intrinsic value. Therefore, we should reject sainthood not because morality is unimportant, but because a life well-lived requires values that stand outside the moral ledger.

  **The Conflation of Maximization and Obsession**

  The first hurdle in this debate is a persistent conflation between the *standard* of goodness and the *psychology* of the agent. Wolf describes two types of saints: the "Rational Saint," who sacrifices personal interests for duty with a heavy heart, and the "Loving Saint," who finds their greatest joy in moral action. Critics often attack Wolf by focusing on the Rational Saint, arguing that this is a caricature. They suggest that a "maximally good" person would recognize that burning out reduces their long-term utility. Therefore, a sophisticated saint would enjoy hobbies, rest, and relationships, provided these activities recharged them for further moral work.

  This argument conflates *maximizing* with *obsessing*. Obsession is a psychological state of compulsion; maximization is a normative standard of justification. One can be a maximizer without being obsessed. A Utilitarian saint might play chess not because they are compelled to ignore morality, but because they have calculated that chess makes them a more effective altruist tomorrow.

  However, untangling this conflation does not save the desirability of sainthood; it clarifies why it is undesirable. The problem is not that the saint is miserable (the Rational Saint), but that their relationship to their own life is purely instrumental (even the Loving Saint). If the saint enjoys a symphony only because it boosts their morale for charity work, they do not value the symphony for itself. They value it as a tool. As Wolf notes, this renders the saint "one-dimensional." Even if they are not psychologically tortured, they are normatively constrained. They cannot truly love the world; they can only love the world's moral potential. A life where every joy is a means to a moral end is a life where no joy is truly free.

  **The Division of Labor and the Universal Sainthood Reply**

  This leads to the second major contention: the moral division of labor. Wolf implies that society benefits from having people who are not saints—people who pursue art, science, or humor for their own sake. These "non-saints" generate the culture that makes life worth living. A common counter-argument is that this relies on a coordination problem. If *everyone* were a moral saint, perhaps the constraints would loosen. In a world of perfect cooperation, the marginal utility of saving a life might drop, allowing saints to pursue art without guilt. If everyone is perfectly efficient, perhaps we can all be saints and still have a vibrant culture.

  This "Universal Sainthood" hypothesis attempts to solve the desirability problem by changing the context. It suggests that sainthood is only undesirable in a non-ideal world. However, this reply fails to address the core axiological issue. Even in a world where everyone is a moral saint, the *reason* for creating art remains moral. In a universal saint society, we do not paint because we are compelled by beauty; we paint because a world with beauty is morally preferable to one without.

  This distinction is crucial. The value of art, humor, and personal projects lies partly in their autonomy from moral justification. When we read a poem, its value is diminished if we view it solely as a vehicle for moral improvement. A society of universal saints creates a value monoculture. While coordination problems might be solved (no free-riders, perfect charity), the society loses the pluralism of value that makes human existence rich. The division of labor is not just about economic efficiency; it is about ontological diversity. We need some people—and indeed, aspects of all people—to operate outside the moral framework so that non-moral goods can exist as ends in themselves, not just as moral instruments.

  **The Verdict: Why Maximality Fails**

  So, is maximal moral goodness desirable? The verdict must be no. This is not a defense of immorality, nor a claim that we should be selfish. It is a claim that "maximal moral goodness" is a category error when applied to the ideal of a human life.

  To defend this, we must look at what morality is for. Morality is a system for regulating our interactions to prevent harm and ensure fairness. It is a framework for the "right." But the "good life" encompasses more than the right. It encompasses excellence, beauty, passion, and idiosyncrasy. When we make morality the *maximal* governing principle of life, we subordinate the "good" to the "right."

  Consider the implication of accepting maximal moral goodness as desirable. If it is desirable, then we should wish for our children to become moral saints. We should hope they never develop a passion for golf unless it aids the poor, and never cultivate a wit that doesn't serve justice. But to wish this is to wish for them to be less fully human. It is to wish that they view their own talents not as gifts to be explored, but as resources to be deployed.

  The proponent of universal sainthood might argue that in a perfect world, moral duty *would* command us to explore our talents. But this collapses the distinction between morality and prudence. If "being moral" simply swallows up "being happy" or "being creative" by redefining them as duties, then morality has become totalitarian. It has annexed the entire territory of human value.

  Therefore, maximal moral goodness is undesirable because it demands a homogenization of human motivation. It requires that every action, no matter how intimate or trivial, be justifiable by a moral metric. This erodes the integrity of personal projects. A friendship is valuable because I care about my friend, not because caring for them maximizes global utility. If I care for them *only* because it is morally optimal, I am not truly a friend; I am a moral agent playing the role of a friend.

  **Conclusion**

  Susan Wolf's critique of moral saints survives the charge of conflation. Even if we distinguish between the obsessed neurotic and the rational maximizer, the ideal of the moral saint remains unattractive. The "Universal Sainthood" reply fails because it solves coordination problems at the cost of value pluralism. It creates a world where everything is done for the sake of morality, leaving nothing done for the sake of life itself.

  Maximal moral goodness is not desirable because it turns the agent into a vessel for value rather than a source of it. We should aim to be morally *adequate*—to meet our obligations and respect the rights of others—but we should not aim to be morally *maximal*. A good society is not one where everyone is a saint; it is one where morality sets the boundaries within which people are free to be poets, fools, lovers, and dreamers for no reason other than that they choose to be. To desire maximal moral goodness is to desire a world where nothing is loved for itself, and that is a world no one should want.
