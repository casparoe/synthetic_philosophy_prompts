      *   **The Problem:** Struggling with the distinction between "knowing how" (procedural knowledge) and "knowing that" (propositional knowledge). His brother-in-law claims "knowing how is just knowing a bunch of facts," which the user intuitively rejects but couldn't articulate why.
      *   **The Data:** He provides 10 specific cases/anecdotes (Uncle stick shift, Video kid, Checklist plant guy, Climbing instructor, Concrete guy, Jig student, Rusty bike/piano, Tennis/Runner overthinking, Pitching coach).
