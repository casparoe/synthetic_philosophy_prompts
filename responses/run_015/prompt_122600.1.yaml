answer: |-
  Your brother-in-law is wrong. You were right to feel that in your gut, even if you couldn't put it into words at the time. If knowing how were just a stack of facts in your head, thinking about those facts would make you better at the task. But as you saw with the tennis player and the runner, thinking about the facts often jams the machinery. The body isn't a computer reading a script; it's a system that reacts to feel.

  Here is the principle that fits your cases, repairs your rule, and handles the new ones.

  ### The Principle

  **You know how to do X when you have the internal capacity to steer your own actions toward a goal, correcting for mistakes in real-time, without needing perfect conditions or outside help.**

  There are three gears in this machine. If one is missing, you don't fully "know how."

  1.  **Internal Capacity:** The knowledge is in your nerves and muscles, not just on a piece of paper or in a jig.
  2.  **Steering (Correction):** You can feel when you are drifting off target and fix it while you are doing it.
  3.  **Resilience:** You can still hit the target when the environment changes (wind, fit-up, darkness).

  Here is how this principle sorts your cases, where it forces you to be tough, and how it answers your new questions.

  ### Sorting Your Cases

  **The Clear Wins**
  *   **The Uncle (Stick Shift):** He passes all three tests. He steers the clutch by feel (Internal), he prevents stalls by adjusting pressure (Steering), and he does it in traffic or rain (Resilience). The fact that he can't explain it proves the knowledge isn't "facts."
  *   **The Video Kid:** Fails immediately. He has facts, but no Internal Capacity. He cannot steer the rod.
  *   **The Concrete & Climbing Guys:** They pass. Their explanations are wrong, but that doesn't matter. The principle cares about *doing*, not *explaining*. They can steer and correct. The bogus story is just noise.
  *   **The Rusty Bike/Piano:** They pass. The capacity was dormant, like a tool in a toolbox. The wobble is just rust clearing off. The Internal Capacity was still there, waiting to be engaged.
  *   **The Tennis/Runner:** This is the smoking gun against your brother-in-law. Their "knowing how" lives in the automatic steering system. When they try to move it to the "facts" part of the brain, the connection breaks. This proves knowing how is *not* facts.

  **The Hard Cases (Where your rule needed repair)**
  *   **The Checklist Plant Guy:** Your gut said this was a "thinner version" of knowing how. The principle agrees, but gets more specific. He lacks **Steering** and **Resilience**. If the wind blows or the gap changes, he stops. He doesn't know how to *weld*; he knows how to *follow a welding checklist*. That is a different skill. It's fragile. If you take the checklist away, the skill vanishes. So, count him as "knowing how to follow instructions," not "knowing how to weld."
  *   **The Jig Student:** You felt this was worse than the Checklist Guy, even though both rely on crutches. The principle explains why. The Checklist Guy is using his *brain* to bridge the gap. The Jig Student is using *hardware* to bridge the gap. The Jig Student has outsourced the **Steering** to the fixture. If the jig goes, he has nothing left—not even a list. He is less skilled than the Checklist Guy because he hasn't even engaged his mind yet. He is letting the tool do the knowing.
  *   **The Pitching Coach:** Here I need to correct your verdict. You want to say he knows how to *pitch*. He doesn't. He knows how to *diagnose pitching*. He has the **Internal Capacity** to see errors and the knowledge to fix them in others, but he lacks the physical capacity to execute it himself. He knows how to *coach*, which is a different "how" than *throwing*. Don't let the fact that he understands the mechanics fool you. If he can't throw, he doesn't know how to throw. He knows how to fix throwers.

  ### Testing Your Two New Cases

  **Case 1: The Student Who Needs You in the Room**
  *   **Verdict:** He does not know how yet.
  *   **Why:** He fails the **Internal Capacity** test. The regulation is coming from *you*, not him. You are his external steering system. When you walk away, the steering column disconnects. He knows how to *listen to you*, but he doesn't know how to *weld*. He is in the "Checklist" phase, but you are the checklist. He only graduates when he can hear your voice in his head without you being there.

  **Case 2: Your First Successful Bead**
  *   **Verdict:** You acquired the knowing how *in the doing*.
  *   **Why:** Before that bead, you were guessing. You had no feedback loop. You didn't know what "right" felt like until you hit it. That first good bead was the moment your brain connected the action to the result. Did you know how *before* you struck the arc? No. You knew the steps. But "knowing how" requires the proof of the result. You can't steer toward a target you've never seen. That first bead painted the target on the wall. So, you didn't know how until you did it.

  ### Where Your Tentative Rule Broke
  Your rule was: *(a) land it when conditions shift* and *(b) show a beginner.*

  *   **Breakdown on (a):** The Checklist Guy fails this, but you still wanted to give him partial credit. My principle clarifies that he gets credit for *following*, not *welding*. That validates your "thinner version" feeling.
  *   **Breakdown on (b):** The Pitching Coach passes this (he can show/fix a beginner), but he can't do it himself. My principle separates *diagnostic* skill from *performance* skill.
  *   **The Jig Problem:** Your rule couldn't distinguish the Jig Student from the Checklist Guy. My principle distinguishes them by looking at *where the steering lives* (in the brain vs. in the tool).

  ### Final Position
  I am highly confident in this. It aligns with how trade skills actually work. The brother-in-law is looking at knowledge like a library (books on shelves). You are looking at knowledge like a workshop (tools in hand).

  If I had to change my mind, you would need to show me a case where someone can consistently steer and correct their actions in bad conditions, but we still refuse to say they "know how." I don't think that case exists.

  **One last thing:** Don't feel bad about not having the academic words for this. You've been teaching it for years. The fact that you spotted the difference between the Jig Student and the Checklist Guy means you understand the machinery better than a philosopher ever could. They talk about the map; you're the one driving the car.
