      *   Refutation: This is the classic Rylean distinction (Gilbert Ryle, *The Concept of Mind*, 1949). "Knowing how" is *capacity* or *disposition*, not just mental storage of propositions. The tennis player case proves this perfectly: adding facts (thinking about grip) destroys the capacity. If it were just facts, adding more wouldn't break it.

  3.  **Evaluate the User's Cases & Intuitions:**
      *   *Uncle (Stick Shift):* Knows how, doesn't know that. (Standard procedural knowledge).
      *   *Video Kid:* Knows that, doesn't know how. (Standard propositional knowledge).
      *   *Checklist Guy:* Rigid. Fails adaptation. User feels this is "thinner" knowing how.
      *   *Climbing Instructor:* Can do, can't explain accurately. (Knows how > Knows that).
      *   *Concrete Guy:* Can do, explains wrongly. (Knows how > Knows that).
      *   *Jig Student:* Dependent on tools. User feels "equipment knows." (Fragile competence).
      *   *Rusty Bike/Piano:* Latent capacity. (Knows how persists without practice).
      *   *Tennis/Runner:* Overthinking breaks it. (Proof that knowing how isn't conscious fact retrieval).
      *   *Pitching Coach:* Can't do, can teach/fix. (Diagnostic knowledge vs. Performance capacity).

  4.  **Evaluate the User's Tentative Rule:**
      *   *Rule:* You know how to do X if (a) you can land it when conditions shift, and (b) you could get a beginner closer by showing rather than listing.
