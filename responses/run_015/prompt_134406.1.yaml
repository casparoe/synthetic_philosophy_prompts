  **Empirical Characterisation of the Wilt Chamberlain Perturbation in Simulated Distributive Systems**

  **H. J. Thistlethwaite**
  *Department of Metrological Philosophy, University of Oxbridge*

  **Abstract**
  For decades, distributive justice has remained a purely theoretical construct, resistant to quantitative analysis. This study treats Nozick's entitlement theory not as a normative claim, but as a reproducible laboratory phenomenon. We establish a baseline patterned distribution (State D1), introduce a high-value agent (the Chamberlain analogue), and measure the subsequent collapse into State D2. Results indicate that liberty functions as a thermodynamic instability within patterned systems.

  **Introduction**
  Having spent forty years measuring quark spins, I recently turned my attention to the softer sciences. It became apparent that political philosophy suffers from a lack of empirical rigour. Specifically, the claim that liberty upsets patterns is treated as a logical deduction rather than a physical observable. This experiment sought to quantify the stability of end-state principles under conditions of voluntary exchange.

  **Methods**
  A simulated economy was constructed comprising $10^5$ autonomous agents. Initial conditions were set to State D1, defined by a Gini coefficient of 0.00 and perfect resource symmetry. A single agent, designated $C$ (Chamberlain), was endowed with a unique skill set offering high utility to the population. Agents were permitted to voluntarily transfer 25% of their endowment to $C$ in exchange for access to this skill.

  Ethical approval was granted under Protocol 77-B (Voluntary Wealth Accumulation). The Review Board noted significant concern regarding the psychological impact of allowing subjects to become millionaires while others remained stagnant. However, since all transfers were consensual, the risk was deemed acceptable provided no coercion was detected. Two novel metrics were developed: the Justice Entropy Coefficient (JEC), measuring disorder in distribution, and the Transfer Fidelity Index (TFI), quantifying the voluntariness of exchange on a scale of 0 to 1.

  **Results**
  Upon activation of agent $C$, the system underwent a rapid phase transition. Within 400 cycles, State D1 collapsed into State D2. The JEC spiked from 0.0 to 0.84 ($\pm$ 0.02), indicating a massive increase in distributive disorder. Crucially, the TFI remained at 0.99 ($p < 0.0001$), confirming that the inequality resulted from free exchange rather than external interference. Confidence intervals (95%) suggest that any patterned principle requiring maintenance of D1 would necessitate continuous intervention equivalent to a coercive force of 4.5 Newtons per agent.

  **Discussion**
  The data suggests that patterned distributions are thermodynamically unstable. Much like a sandcastle facing the tide, State D1 cannot withstand the kinetic energy of voluntary transaction. The observed collapse does not necessarily falsify egalitarianism as a moral ideal, but it does indicate it is an artefact of static design. To maintain D1, one must inhibit the TFI, effectively freezing agent behaviour. This supports the historical entitlement view: justice is not a snapshot of resource allocation, but a record of acquisition and transfer. The attractiveness of the resulting distribution (State D2) is irrelevant to its legitimacy, provided the TFI remains high.

  However, one must consider whether the simulation environment itself biases the outcome. If agents are programmed to maximise utility, they will naturally flock to $C$. Yet, even allowing for variable risk aversion, the trend toward inequality persisted across 500 iterations. The pattern collapses not because the agents are greedy, but because the pattern requires a closed system, and liberty opens the valves.

  **Conclusion**
  It is disheartening to report that the philosophical community remains resistant to data that do not fit their priors. When presented with the JEC spikes, several theorists argued that the simulation failed to capture the "nuance" of moral desert. This is akin to arguing that gravity behaves differently because one dislikes falling. The Wilt Chamberlain perturbation is not a thought experiment; it is a measurable event. Until philosophers accept that justice operates under constraints similar to conservation laws, their theories will remain elegant, untestable, and ultimately useless. The laboratory does not care for your principles; it only records what happens when you let people choose.
