answer: |-
  Here are five candidate concepts or labels that a specialist might reach for when presented with your description:

  1.  **Evidential Decision Theory (EDT):** The general framework where acts are chosen based on the news they bring, rather than their causal consequences.
  2.  **Superrationality:** The hypothesis that identical reasoners will converge on identical strategies, creating a correlation without communication.
  3.  **The Calculus of Voting:** The economic analysis of whether the cost of voting is outweighed by the expected benefit of influencing the outcome.
  4.  **Logical Decision Theory (LDT):** A modern framework that treats decisions as outputs of a logical algorithm, linking agents who run similar code.
  5.  **Evidential Cooperation in Large Worlds (ECL):** A specific application of evidential reasoning to scenarios where many agents face similar decisions with weak correlations.

  ### The Arithmetic Check

  Your arithmetic captures the correct scaling logic but glosses over a technical detail regarding the definition of "correlation."

  You posit a correlation coefficient $\rho = 0.001$ between your act and any specific other act. You assume this shifts the probability of the other person contributing by exactly $0.001$. Strictly speaking, the shift in conditional probability depends on the base rate of contribution.

  If the probability of contribution is $p$, the standard deviation is $\sqrt{p(1-p)}$. The shift in probability $\Delta P$ given a correlation $\rho$ is approximately $\rho \times \frac{\sigma_{other}}{\sigma_{you}} \times \frac{1}{P(\text{you contribute})}$. If we assume a symmetric case where everyone has a 50% prior propensity to contribute, the shift is actually $0.5 \rho$, not $\rho$. If contributions are rare (small $p$), your approximation holds more closely.

  However, your core insight regarding the *magnitude* is correct: the expected shift in the *aggregate* number of contributors scales linearly with $N$.
  $$ \text{Total Evidential Benefit} \approx N \times \Delta P \times \text{Benefit per Person} $$
  Since $N$ is in the millions and $\Delta P$ is small but non-zero, the product can indeed exceed the fixed cost of 1 unit. Your break-even calculation ($N=100,000$) is arithmetically consistent with your stated parameters, provided we accept your definition of the probability shift. The logic of the "flip" is sound: there is a threshold population size where the aggregated weak evidence outweighs the certain cost.

  ### Evaluation of Candidates

  **Superrationality** and **Logical Decision Theory** are the closest neighbours, but they fail your first feature. They rely on the premise that other agents are running the same "reasoning algorithm" as you, or that you are logically identical to them. Your case explicitly rejects this; the correlation arises from a common cause (e.g., reading the same newspaper), not shared logic. You are not choosing *for* them; you are learning *about* them.

  **The Calculus of Voting** typically relies on Causal Decision Theory (CDT). It asks: "What is the probability my vote is pivotal?" In a large population, that causal probability is effectively zero. Your argument concedes the causal probability is zero but insists the evidential probability is high. Thus, standard voting theory does not capture the mechanism you are describing.

  **Evidential Decision Theory (EDT)** is the correct *framework*, but it is too broad. EDT applies to Newcomb's Problem, the Smoking Lesion, and your case alike. It does not name the specific phenomenon of *aggregating* negligible correlations across a large population to flip a verdict.

  **Evidential Cooperation in Large Worlds (ECL)** is the specific label your friend muttered. It is the precise term currently used in decision-theoretic literature to describe this exact setup: using EDT to justify cooperation in large, one-shot dilemmas where correlations are weak but aggregate significance is high. It fits your description better than any classical term.

  ### The Carving: Why This Is Distinct

  You asked for the carving, not just the label. The distinction lies in how this argument handles the **Reference Class Problem** and the **Common Cause Objection**.

  In standard EDT (like the Smoking Lesion), a correlation between your act and a bad outcome is often dismissed as "spurious" if you know the common cause (the lesion). If you know you have the lesion, smoking doesn't add evidence. Your argument survives this only if the common cause (the newspaper, the culture) is *not* fully screened off by your introspection. You are treating your own decision as a *sample* from the population distribution. By deciding to contribute, you update your estimate of the population's propensity to contribute.

  The "carving" is this: **Your act is treated as a statistical sample of size one from the population of decision-makers.**

  In a small population, a sample of one is noisy and worthless. In a population of a million, a sample of one provides a statistically significant update on the mean behaviour of the group. Because your payoff depends on the *sum* of the group's behaviour, a small update on the mean translates to a large update on the total payoff.

  This distinguishes it from Superrationality (which claims your act *determines* the others) and CDT (which claims your act *affects* nothing). This view claims your act *informs* you about the others, and in large numbers, information about the aggregate is valuable enough to act upon.

  ### Addressing Your Five Features

  1.  **No Twinhood:** Correct. This view requires only statistical correlation, not logical identity. It works even if the others are reasoning differently, provided the output is correlated.
  2.  **No Causal Efficacy:** Correct. It concedes the CDT point entirely. It argues that rationality is about maximizing expected utility conditional on the act, not causal impact.
  3.  **Aggregate News:** This is the crux. It is legitimate within EDT to sum expected values. If learning you contributed raises the expected count of others by 100, and each is worth 0.01, the evidential value is 1.0. The "negligible shift" per person is irrelevant; only the total shift matters.
  4.  **The Population Problem:** This is the argument's greatest vulnerability. If the verdict depends on $N$, and $N$ is flexible (city vs. country), the rational verdict becomes subjective to how the agent individuates the reference class. A rigorous version of this view requires a principled theory of **Relevant Similarity**. You cannot count people who did not face the decision; you must count agents whose decision-processes are correlated with yours. If you can gerrymander the class, you can force any verdict. This suggests the argument is incomplete without a constraint on admissible reference classes.
  5.  **Generalisation to Smoking:** You are correct. This is exactly the Smoking Lesion problem scaled up. If smoking is correlated with a million tiny risks, EDT says don't smoke. CDT says smoke (if the lesion is already present). Whether this is a "vice" or "virtue" depends on whether you think rationality should heed spurious correlations. If the correlation is real (even if common-caused), EDT says you should act to avoid the news. Most philosophers reject this (preferring CDT), but the logic is consistent within EDT.

  ### Boundary Cases

  *   **Correlation Exactly Zero:** The argument collapses. Without correlation, your act provides no evidence about others. You pay 1 for 0 return. CDT and EDT agree: do not contribute.
  *   **Negative Correlation:** If your contributing makes it *less* likely others contribute (e.g., a niche market saturation), the evidential value becomes negative. You should definitely not contribute.
  *   **Common Cause Conditioned On:** If you already know the state of the common cause (e.g., you know exactly who read the newspaper and how they react), the correlation is screened off. Your act provides no *new* evidence about them. The argument fails. It requires residual uncertainty about the common cause.
  *   **Gerrymandered Population:** If you include people whose acts do not affect you (e.g., people in a different game), the arithmetic inflates $N$ without increasing benefit. The argument must restrict $N$ to those whose contributions causally impact your payoff.
  *   **Certainty of Action:** If you already know with certainty what you will do (no free will/choice), there is no decision to make. If you know you will contribute, you already know the news you will bring. The expected utility is fixed. The argument presumes you treat your decision as a variable you can set to update your world-model.

  ### Is It a Real Phenomenon?

  You asked whether you have confused "is evidence of" with "makes more likely by an amount worth caring about."

  Within the framework of Evidential Decision Theory, this is a **real phenomenon**. It is not a confusion; it is a mathematical consequence of aggregating weak conditional probabilities over a large domain. The expected utility *does* shift.

  However, within Causal Decision Theory (the dominant view in academic philosophy), this is a **confusion**. CDT argues that "evidence" that does not track causal influence is irrelevant to rational choice. They would say you are "managing the news" rather than managing the world.

  The argument "goes through" logically if you accept EDT. It fails if you accept CDT. The "thing you were reaching for" is the recognition that in large worlds, the distinction between managing news and managing the world blurs, because the news about the aggregate *is* the payoff.

  ### The Name

  Your friend was correct. The specific configuration of parameters you described—weak correlations, large populations, one-shot interactions, and the resulting flip in verdict—is the defining case of the concept currently termed in the literature as:

  **Evidential Cooperation in Large Worlds**
