answer: |-
  Here is a five-step decision procedure designed for speed and philosophical rigor. It synthesizes H.L.A. Hart's legal definition, Joel Feinberg's expressive theory, and utilitarian deterrence models into a binary checklist.

  ### The "Punishment Audit" (15-Minute Procedure)

  **Instructions:** For each gate, gather evidence from public statements, Terms of Service (TOS) archives, and press releases. Answer **Yes** or **No**. If you answer **No** at any stage, the action is likely a *Social Sanction* or *Administrative Management*, not *Punishment*.

  **[FLAG: FACT VS. VALUE]**
  *Steps 1, 2, and 5 are factual. Steps 3 and 4 require interpreting intent. This is where your values enter the analysis. Proceed with caution.*

  #### Gate 1: The Hardness Test
  **Question:** Does the action intentionally impose a hardship (loss of money, access, status, or liberty) that the subject would not otherwise suffer?
  *   **Evidence:** Bank records, access logs, invitation letters.
  *   **Yes:** Proceed to Gate 2.
  *   **No:** Not punishment. (It's a neutral administrative change).

  #### Gate 2: The Ex Post Facto Test (Legality)
  **Question:** Did a clear rule prohibiting the specific conduct exist *before* the conduct occurred?
  *   **Evidence:** Wayback Machine archives of TOS, student handbooks, or conduct codes dated prior to the act.
  *   **Yes:** Proceed to Gate 3.
  *   **No:** **Not Punishment.** (This is *Preemptive Risk Management* or arbitrary force. Punishment requires a breach of established law/rule).

  #### Gate 3: The Feinberg Gate (Expression)
  **Question:** Does the authority's statement explicitly assign *moral blame* or condemnation, rather than citing contractual ineligibility or safety risk?
  *   **Evidence:** Press releases. Look for words like "unacceptable," "harmful," "violates values" (Yes) vs. "ineligible," "policy update," "risk mitigation" (No).
  *   **Yes:** Proceed to Gate 4.
  *   **No:** **Not Punishment.** (This is *Contract Enforcement*. Feinberg argues punishment must communicate reprobation, not just a price change).

  #### Gate 4: The Temporal Test (Retributive vs. Deterrent)
  **Question:** Is the primary justification backward-looking (you did this, so you pay) rather than forward-looking (we must stop this from happening again)?
  *   **Evidence:** Statements of purpose. "In response to past actions" (Yes) vs. "To ensure future community safety" (No).
  *   **Yes:** Proceed to Gate 5.
  *   **No:** **Not Punishment.** (This is *Utilitarian Deterrence/Management*. While punishment can deter, pure forward-looking risk mitigation without blame is sanitation, not punishment).

  #### Gate 5: The Authority Test (Quasi-Public)
  **Question:** Is the entity acting as a sovereign authority (or quasi-public steward) rather than a private service provider protecting assets?
  *   **Evidence:** Funding sources, public mandate, monopoly status.
  *   **Yes:** **Verdict: PUNISHMENT.**
  *   **No:** **Verdict: PRIVATE SANCTION.** (It hurts, but lacks the public/sovereign character of true punishment).

  ***

  ### Case Run-Throughs

  #### Case 1: University Pulls Speaker Invite (Old Tweets Resurface)
  *   **Gate 1 (Hardness):** **Yes.** Loss of honorarium, platform, and travel.
  *   **Gate 2 (Rule):** **Yes.** Universities have conduct codes regarding "community standards" that pre-date the tweets, even if vaguely applied.
  *   **Gate 3 (Feinberg/Blame):** **Yes.** Statements usually cite "values inconsistent with the university" or "harmful rhetoric." This is moral condemnation.
  *   **Gate 4 (Temporal):** **Yes.** The action is triggered by *past* tweets, not a future threat. It is retributive for the speech act.
  *   **Gate 5 (Authority):** **Yes.** Universities are quasi-public trusts with educational mandates, not mere private clubs.
  *   **VERDICT:** **PUNISHMENT.** (Retributive/Expressive).

  #### Case 2: Platform Demonetizes Creator (One Video, New Policy)
  *   **Gate 1 (Hardness):** **Yes.** Loss of revenue.
  *   **Gate 2 (Rule):** **Yes.** *Crucial Detail:* The policy was added yesterday. Assuming the video was uploaded *after* the policy went live, the rule existed before the specific act of monetization eligibility was claimed.
  *   **Gate 3 (Feinberg/Blame):** **No.** Platforms typically use sterile language: "Not eligible for ads," "Limited inventory," "Policy update." They avoid saying "You are bad." They say "This content is not advertiser-friendly."
  *   **Gate 4 (Temporal):** **No.** The goal is future brand safety and ad revenue protection, not paying back for the video.
  *   **Gate 5 (Authority):** **No.** Private corporation.
  *   **VERDICT:** **NOT PUNISHMENT.** (Contractual Management).
      *   *Why this fights your gut:* It feels like punishment because it hurts. But philosophically, it fails the **Feinberg Gate** (no moral blame) and the **Temporal Test** (forward-looking risk management). It is a change in service terms, not a penalty for a crime.

  ***

  ### What This Procedure Cannot Do

  1.  **Measure Power Asymmetry:** A private platform demonetizing a creator *feels* like punishment because the platform holds sovereign-like power over public discourse. This procedure classifies that as "Private Sanction," which may underestimate the political reality.
  2.  **Detect Dog Whistles:** An authority can use sterile language (Gate 3: No) while intending moral condemnation. This procedure relies on public text, not internal memos.
  3.  **Account for Disproportionality:** A punishment can be unjust without ceasing to be punishment. This procedure identifies *what* it is, not whether it is *fair*.

  ### The Differentiation Case: Expressive vs. Retributive

  To determine if you are analyzing a situation through an **Expressive** lens (Feinberg) or a **Retributive** lens (Kant/Desert), run this single test case:

  **The "Apology Waiver" Case:**
  *An individual is sanctioned. They offer a full, public apology and restitution.*

  *   **If the sanction is lifted:** You are running an **Expressive Model**. The goal of the punishment was to extract public condemnation and reaffirm norms. Once the message is sent (via apology), the suffering is no longer needed.
  *   **If the sanction remains:** You are running a **Retributive Model**. The goal is "payback" or desert. The suffering is required regardless of the offender's change of heart, because the debt must be paid.

  *Use this to check your own writing:* If you argue a disinvitation is unnecessary because the speaker apologized, you are prioritizing the Expressive function. If you argue they must still be disinvited to "face consequences," you are prioritizing Retribution.
