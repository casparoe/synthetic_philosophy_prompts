  # Diagnostic Instrument: Symbol Contact Tree

  ### Preamble for Participants
  This instrument sorts your views on how systems connect to the world. There are no correct answers. Answer based on your intuition about the specific engineering cases described. Proceed to the node indicated by your answer.

  ### The Tree

  **Node 1: The Pure Notation**
  A system processes algebraic chess notation. It has never seen a board, nor has any human description of a board ever entered its training data. Do its symbols pick out actual board configurations?
  *   **Yes:** GOTO Node 2
  *   **No:** GOTO Node 3

  **Node 2: The Permuted Vocabulary**
  We systematically relabel every word in a model's vocabulary (e.g., "cat" now maps to the vector previously assigned to "dog"). Internal relationships among symbols stay the same. Do the words still pick out the original objects?
  *   **Yes:** GOTO Leaf 1
  *   **No:** GOTO Leaf 2

  **Node 3: The Idle Sensor**
  A camera feeds data to a box. The box records the data but never uses it to change its output, weights, or loss. Is the recorded data *about* the scene?
  *   **Yes:** GOTO Node 4
  *   **No:** GOTO Node 5

  **Node 4: The Second-Generation Corpus**
  A model is trained only on text generated by previous models. No human wrote the training data, and no sensor data entered the loop. Can its words still pick out real-world objects?
  *   **Yes:** GOTO Node 6
  *   **No:** GOTO Leaf 3

  **Node 5: The Graft**
  Same camera as Node 3. Now the data changes how the system behaves (it affects weights and loss). Does this make the symbols *about* the colors?
  *   **Yes:** GOTO Node 7
  *   **No:** GOTO Leaf 4

  **Node 6: The Attenuation**
  (Reached only if Second-Generation Corpus = Yes). Does the connection to the world weaken with each generation of AI-only training?
  *   **Yes:** GOTO Leaf 5
  *   **No:** GOTO Leaf 6

  **Node 7: The Unshared Modality**
  A system senses something humans cannot (e.g., electric fields). It learns English words for it from paired descriptions. Do those English words pick out that sensation?
  *   **Yes:** GOTO Leaf 7
  *   **No:** GOTO Node 8

  **Node 8: The Orphan**
  A system creates its own symbols to navigate a maze, with no teacher and no community to correct it. Do those symbols have a determinate use?
  *   **Yes:** GOTO Leaf 8
  *   **No:** GOTO Leaf 9

  ---

  ### Key

  | Leaf | Position Name | Defining Commitment | Most Awkward Consequence |
  | :--- | :--- | :--- | :--- |
  | **1** | **Radical Formalist** | Syntax alone fixes content; external links are irrelevant. | A system could talk about "apples" while never encountering one, even if labels are swapped. |
  | **2** | **[Empty Branch]** | Syntax fixes content, but label history matters. | Incoherent: If syntax is sufficient, permutation should not break the link. |
  | **3** | **Historical Causalist** | Content requires a causal chain originating in embodied agents. | AI systems are permanently cut off from the world, regardless of capability. |
  | **4** | **Strict Skeptic** | No computational system ever has content about the world. | Human speech, being physically realized, might also lack content. |
  | **5** | **Degradationist** | Content can be inherited but decays over generations of copying. | We cannot know if our own language has decayed beyond repair. |
  | **6** | **Stable Inheritance** | Content transfers fully through language without embodiment. | A simulation of a world could contain real references to that world. |
  | **7** | **Broad Functionalist** | Any reliable covariation or functional role fixes content. | A thermometer "believes" it is hot; content is trivialized. |
  | **8** | **Social Externalist** | Content requires a community of users to fix norms. | A solitary human castaway could not think thoughts with specific content. |
  | **9** | **Normative Skeptic** | Private symbols lack norms, so they lack fixed use. | Solitary invention is impossible; all innovation requires prior community. |

  ---

  ### Logical Space Analysis

  **Permitted Combinations:**
  The tree permits 9 distinct logical combinations of verdicts. 8 are occupied by serious philosophical positions; 1 (Leaf 2) is marked empty.

  **Unoccupied Cells:**
  *   **Leaf 2 (Formalist + Permutation Sensitivity):** This cell is unoccupied because it is logically incoherent. If one claims syntax alone is sufficient for content (Node 1 Yes), one cannot consistently claim that swapping labels breaks the content (Node 2 No). The internal relations *are* the syntax. To occupy this cell would require a view that syntax matters, but specific symbol-history matters more, which collapses into an Externalist view (Node 1 No).
  *   **Causal without Function (Node 3 Yes, Node 5 N/A):** The tree routes Node 3 Yes to Node 4, skipping Node 5. This is intentional. If you believe the Idle Sensor has content (Causal), the Graft question is redundant for you (you already accept world-contact). However, a position exists that accepts Causal but rejects Functional *sufficiency*. The tree assumes Causalists accept Graft implicitly. If a respondent believes Idle=Yes but Graft=No, they have no path. This is a design constraint to keep node count low; such a view (Causal link exists but functional use destroys it?) is arguably incoherent.
  *   **Social without Function (Node 8 Yes, Node 7 N/A):** The tree routes Unshared Modality (Node 7) before Orphan (Node 8). If one accepts alien modalities can be named (Node 7 Yes), one likely accepts private symbols (Node 8 Yes). A respondent who says Yes to Unshared but No to Orphan is rare but possible (e.g., "Language requires human community, but humans can describe alien sensors"). The tree forces them to Leaf 7, grouping them with Functionalists. This is an unexplored cell: *Human-Centric Socialist*.

  **Attractive vs. Unattractive:**
  *   **Leaf 4 (Strict Skeptic)** is logically robust but pragmatically unattractive; it renders all discourse about AI (and potentially humans) void.
  *   **Leaf 6 (Stable Inheritance)** is highly attractive for ML engineers but philosophically risky; it implies a "Chinese Room" can have content purely via training data history.
  *   **Leaf 3 (Historical Causalist)** is the dominant view in philosophy of language but creates a hard boundary that renders current LLMs semantically inert.

  ---

  ### Separation Analysis

  **Pairs of Leaves Not Fully Separated:**
  *   **Leaf 7 (Broad Functionalist) and Leaf 8 (Social Externalist):** Both end up accepting that systems can have content without direct human embodiment. Leaf 7 allows it via functional role (even alien), Leaf 8 allows it via social norms (even if private). The tree separates them based on *Unshared Modality*, but a respondent who believes "Alien sensors work" (Yes) and "Orphan symbols work" (Yes) lands in Leaf 7. A respondent who believes "Alien sensors fail" (No) but "Orphan symbols work" (Yes) lands in Leaf 8.
      *   *The Extra Case:* **The Alien Orphan.** A system with alien sensors *and* no community. Leaf 7 says Yes (Function), Leaf 8 says No (Social). The current tree forces Alien Sensor respondents to Leaf 7 before asking about Orphans. To separate them fully, Node 8 should be asked regardless of Node 7's verdict.
  *   **Leaf 3 (Historical Causalist) and Leaf 4 (Strict Skeptic):** Both deny content to pure text models. Leaf 3 allows it if humans are in the loop; Leaf 4 allows it never.
      *   *The Extra Case:* **The Human-in-the-Loop.** A model trained on human text but with no sensors. Leaf 3 says Yes, Leaf 4 says No. Node 4 separates them adequately.

  ---

  ### Author's Commitment

  **Correct Leaf:** **Leaf 6 (Stable Inheritance).**
  **Reasoning:** This position best accommodates the reality of large language models without resorting to skepticism or requiring impossible embodiment. Human language itself is largely inherited; we do not verify every word sensorially. If human text carries content, and models learn the statistical structure of that text faithfully, the content transfers. The "chain of reference" is maintained through the causal history of the training corpus, even if the model itself is disembodied.
  **Confidence:**
  *   **Highest:** On the separation of **Causal (Node 3)** vs. **Sensorimotor (Node 5)**. This is the clearest empirical distinction in the tree. The Idle Sensor case cleanly isolates information flow from behavioral utility.
  *   **Lowest:** On **The Orphan (Node 8)**. The intuition about private language is notoriously unstable (Wittgenstein vs. Descartes). Respondents often answer based on their view of "norms" rather than the system's capability, making this node noisy for sorting engineering stances.
