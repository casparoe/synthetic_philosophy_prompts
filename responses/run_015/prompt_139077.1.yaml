      *   Section 4: The Two Conclusions (Moral vs. Bluff).
      *   Section 5: Complication 1 (Inheritance/Maintenance).
      *   Section 6: Complication 2 (Automation/Delegation).
      *   Section 7: Alternative Frame (Risk/Explosive).
      *   Conclusion: Summary of the trade-off.

      *(Self-Correction during drafting)*: Make sure to explicitly answer whether the "Release" disanalogy is genuine. Yes, it is. Geography is immutable. Security is mutable.
      *(Self-Correction on Automation)*: Be clear that automation makes the *threat* more credible (bad for bluff argument) but the *actor* less morally agentic (complicates moral verdict, though usually strengthens condemnation of the system). Actually, automation makes the *system* the captor, not the human. This strengthens the moral condemnation of the *posture* but weakens the blame on the *leader*.
      *(Refining the "Bluff" argument)*: The colleague says "nobody incinerates a country at the price of national suicide." Automation bypasses this. So automation kills the bluff argument.

