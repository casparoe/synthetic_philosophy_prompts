prompt: |-
  I am teaching a first-year seminar on the definition of death, and I want to set Kazuo Ishiguro's *Never Let Me Go* as a set text alongside the standard positions: the whole-brain criterion, the higher-brain or neocortical criterion, and the older circulatory-respiratory criterion, together with the familiar quarrel about whether these are rival accounts of one biological event or competing proposals for drawing a line that serves our practices. What I want from you is a reading of the novel through that debate — and a reading that is tested rather than merely asserted.

  My hypothesis is this. The donation programme removes vital organs from living, breathing donors, and Kathy's charges are said to complete, almost always after their fourth donation. If completion is death, the programme cannot be working with a circulatory criterion, because the circulation stops *because* the organ has been taken, not the other way about: on any ordinary cardiopulmonary view the operation is what kills the donor, and each donation would be a homicide. So the programme must be presupposing something more like a neurological criterion. And yet, so far as I can tell, the novel never specifies a criterion at all; it does not say brain death, and it hardly says death either, only completion and donation.

  Three things follow that I would like you to work through. First: is completion best read as a fourth criterion in its own right — a criterion of exhaustion, on which you count as dead once you have yielded what was wanted from you — and is the novel then a dramatisation of the suspicion that criteria of death are settled by what we want to be able to do to bodies rather than discovered by medicine? Second: press the objection that the novel's scandal lies elsewhere. Its real subject may be that the donors were never fully accorded the standing of persons — Hailsham existed to prove, through the Gallery, that its students had souls at all — in which case the question of whether a donor is dead is downstream of the question of whether she is a someone, and the brain-death literature, which takes personhood for granted, is not being addressed at all. Can a defender of the whole-brain criterion reply that the novel only indicts consent and not the criterion? Third: tell me where the reading distorts the book. Which scenes would you put on the seminar handout — Miss Emily's account of what the artwork was for, a donor's bad first donation, Tommy's anger after the visit to Madame and Miss Emily, Kathy's eleven years of caring, the fence at Norfolk — and what, if anything, does the novel show about death that the arguments in the literature cannot show?

  Please answer in British English, and say plainly if you think my hypothesis is wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** First-year seminar on the definition of death.
      *   **Core Text:** Kazuo Ishiguro's *Never Let Me Go*.
      *   **Standard Positions:** Circulatory-respiratory, Whole-brain, Higher-brain (Neocortical).
      *   **Philosophical Debate:** Rival accounts of one biological event vs. competing proposals for drawing a line serving practices.
      *   **User's Hypothesis:**
          1.  The donation programme implies a neurological criterion (since circulation stops *due* to organ removal, not vice versa).
          2.  "Completion" might be a fourth criterion (exhaustion/utility).
          3.  The novel suggests criteria are settled by utility, not biology.
          4.  Counter-objection: The real issue is personhood/soul (Hailsham/Gallery), making death criteria downstream.
          5.  Task: Test the hypothesis, address the personhood objection, identify distortions, select key scenes for a handout, and articulate what the novel shows that arguments cannot.
      *   **Constraints:** British English, plain speaking if the hypothesis is wrong.

  2.  **Evaluate the Hypothesis (Step 1 & 2):**
      *   *Hypothesis:* The programme presupposes a neurological criterion because donors are alive during organ removal.
      *   *Critique:* This is partially correct but misses the specific horror of the book. In standard brain death protocols, the body is maintained on ventilation *after* legal death to harvest organs. In *Never Let Me Go*, the donors are clearly *not* legally dead in the standard sense during the early donations. They walk, talk, recover, and return to the recovery centre. They are living donors.
      *   *Implication:* This isn't just brain death; it's a suspension of the definition of death entirely for a specific class of beings. It's not that they are "brain dead"; it's that their death doesn't count as murder *while* it is happening.
      *   *Hypothesis:* "Completion" is a fourth criterion (exhaustion).
      *   *Critique:* This is a strong reading. "Completion" functions as a euphemism that masks the moment of death. It shifts the definition from a biological threshold to a functional endpoint. This aligns with the "competing proposals for drawing a line that serves our practices" view (pragmatic/social constructionist).
      *   *Verdict:* The hypothesis is insightful but needs nuance regarding the "living donor" aspect. It's not strictly neurological; it's a utilitarian suspension of personhood that allows killing without calling it killing.

  3.  **Address the Personhood Objection (Step 2):**
      *   *Objection:* The scandal is about personhood (souls), not death criteria. Brain death literature assumes personhood; the novel questions if clones have it.
      *   *Analysis:* This is a crucial distinction. Bioethics usually asks "When does a person die?" Ishiguro asks "Is this a person?" If they aren't persons, the definition of *human* death doesn't apply.
      *   *Defender of Whole-Brain Criterion:* Could argue the criterion is biologically sound regardless of who the patient is. If a clone's brain stops, they are dead. But the novel shows the brain *doesn't* stop until the end. The issue is the *killing* prior to that.
      *   *Synthesis:* The novel bridges the two. By treating them as persons (Kathy's narration) but killing them as livestock, it exposes how definitions of death rely on prior definitions of life/personhood. You can't define death without defining what is dying.

  4.  **Identify Distortions and Key Scenes (Step 3):**
      *   *Distortion:* Reading the book *only* as a bioethics treatise risks ignoring the emotional, nostalgic, and resigned tone. It's not a polemic; it's a tragedy. The clones accept their fate. A purely philosophical reading might miss the "why don't they run away?" aspect (social conditioning vs. biological destiny).
      *   *Scenes:*
          *   Miss Emily's revelation (The Gallery's purpose): Essential for the personhood argument.
          *   Tommy's anger (after the revelation): Shows the futility of proving personhood.
          *   Kathy's caring: Shows their humanity/capacity for love, contrasting with their treatment as spare parts.
          *   The "Completion" moments (e.g., Ruth's death): Shows the euphemism in action.
          *   The fence at Norfolk (maybe less relevant to death definition, more to hope/destiny, but could illustrate the boundaries placed on them). Let's swap this for Ruth's actual death scene or the discussion of "possible" donors.
      *   *What the novel shows:* Arguments deal in abstractions; the novel deals in the *experience* of waiting to die and the linguistic softening of killing. It shows the *social cost* of a utilitarian definition of death.

  5.  **Drafting the Response (incorporating British English and tone):**
      *   *Tone:* Academic, collegial, critical but supportive.
      *   *Structure:*
          1.  Direct assessment of the hypothesis (Plain speaking).
          2.  Analysis of "Completion" as a criterion.
          3.  The Personhood Objection (The "Downstream" argument).
          4.  Distortions and Pedagogical Selection (Scenes).
          5.  Conclusion: What the novel adds to the seminar.

      *   *Refining the "Neurological" point:* I need to be careful here. The user suggests the programme *must* be presupposing a neurological criterion. I should point out that if they were brain dead, they wouldn't wake up between donations. They are *living* donors. This makes it worse than brain death; it's sanctioned homicide masked by language. This strengthens the "criteria serve practices" argument.
      *   *Refining "Completion":* Yes, treat this as a functionalist criterion.
      *   *Refining Personhood:* Acknowledge this is the stronger philosophical critique. The definition of death is irrelevant if the subject isn't granted the right to life.
      *   *Scenes:* Select those that highlight the *language* of death (completion) and the *proof* of life (art/caring).

  6.  **Final Review against Constraints:**
      *   British English? (Check spelling: *programme, centre, honour, euphemism*, etc.)
      *   Plain speaking on hypothesis? (Yes, validate but correct the medical nuance).
      *   Address all three points? (Yes).
      *   Tested rather than asserted? (Ensure arguments are weighed).

  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure not to say the hypothesis is *wrong*, but that it requires adjustment regarding the "living donor" status. The user says "removes vital organs from living, breathing donors" — they acknowledge this. But then they say "programme must be presupposing something more like a neurological criterion." This is the weak link. If they are living, it's not brain death. It's a suspension of the prohibition on killing. I need to clarify this distinction.
      *   *Emphasis:* Focus on the *euphemism* "completion". That is the linguistic bridge between bioethics and the novel.

  8.  **Final Output Generation** (Proceed to write response).
answer: |-
  Here is a reading of *Never Let Me Go* tested against your seminar's framework, addressing your three points in turn. I shall be plain where I believe your hypothesis requires adjustment, as you requested.

  ### 1. On 'Completion' as a Criterion of Death

  Your hypothesis contains a sharp insight regarding the function of language, but it stumbles slightly on the medical mechanics. You suggest that because the donors are breathing during organ removal, the programme must presuppose a neurological criterion. I would argue the opposite: the horror of the novel lies precisely in the fact that *no* standard medical criterion is being met.

  In a standard whole-brain death protocol, the patient is legally dead before the ventilator is switched off or organs are harvested. In *Never Let Me Go*, the clones are demonstrably alive. They converse, they recover from anaesthesia, they walk between donations. If one applied the circulatory-respiratory criterion, the first donation would be murder. If one applied the whole-brain criterion, the donor would not be waking up in the recovery centre.

  Therefore, 'completion' is not merely a fourth criterion; it is a suspension of criteria. It is a bureaucratic terminus rather than a biological threshold. This strongly supports the 'competing proposals' view you mention—the idea that definitions of death are drawn to serve social practices. In the novel, the practice is the procurement of organs; the definition of death is retrofitted to ensure the practice can continue without legal interruption. 'Completion' functions as a euphemism that allows the state to bypass the question of death entirely until the body is no longer useful.

  So, to answer your first question: yes, 'completion' is best read as a functionalist criterion of exhaustion. However, it is not a *medical* criterion at all. It dramatises the suspicion that when a specific class of beings is instrumentalised, the definition of their death shifts from a biological event to an administrative conclusion. The novel suggests that 'death' is not discovered by medicine so much as authorised by the state.

  ### 2. The Personhood Objection

  Your second point presses the objection that the scandal is one of personhood, not mortality. This is the stronger philosophical critique. The bioethical literature on brain death generally takes for granted that the subject is a human person with a right to life; the debate is only about *when* that life ends. Ishiguro's clones exist in a space prior to that debate.

  Hailsham's experiment was not to determine when the clones died, but whether they lived in the moral sense. Miss Emily's revelation—that the Gallery was intended to prove the students had souls—is an admission that their status as 'persons' was contingent, not inherent. If the donors are not fully accorded the standing of persons, the question of whether a donor is dead is indeed downstream of the question of whether she is a 'someone'.

  Can a defender of the whole-brain criterion reply that the novel only indicts consent and not the criterion? They could try. They might argue that even if clones are persons, the whole-brain criterion remains the scientifically robust definition of human death, and the tragedy here is simply that the clones were killed before reaching that threshold (i.e., they were murdered living persons).

  However, this defence fails to grasp the novel's specific indictment. The tragedy is not just that they were killed, but that the language of 'donation' and 'completion' was allowed to obscure the killing. A defender of the whole-brain criterion relies on the precision of language to distinguish death from homicide. Ishiguro shows that when the political will exists, that precision can be dissolved. The novel suggests that without the prior settlement of personhood, a neurological criterion is useless. You cannot define the death of a 'someone' if the law treats them as 'something'. Thus, the brain-death literature is not merely unaddressed; it is rendered inapplicable by the clones' ontological ambiguity.

  ### 3. Distortions and Pedagogical Selection

  Where does this reading distort the book? The risk in teaching *Never Let Me Go* as a bioethics case study is that it encourages students to view the clones as patients in a system they might fix, rather than victims in a tragedy they must witness. The novel is not a polemic about organ harvesting; it is a meditation on mortality, memory, and resignation. The clones do not rebel; they do not run away. They accept their 'completion'. A purely philosophical reading might miss this profound passivity, which suggests that the definition of death is not just imposed from above, but internalised from within.

  Furthermore, focusing too heavily on the 'criteria' might obscure the emotional reality of caring. The bioethics debate is often cold and categorical; the novel is warm and gradual.

  For your seminar handout, I would recommend the following four scenes, selected to bridge the gap between abstract criteria and lived experience:

  1.  **Miss Emily's Account (The Gallery's Purpose):** This is essential for the personhood argument. It establishes that the clones' humanity was an open question to be proved, not a given. It contextualises why the definition of their death is flexible: because their life was never fully secured.
  2.  **Ruth's 'Completion':** Do not use a generic donation scene; use Ruth's death. Note the language used by the carers and the donors. They speak of 'finishing' or 'completing', never dying. This illustrates the linguistic softening you identified in your hypothesis. It shows the 'criterion of exhaustion' in action.
  3.  **Tommy's Anger (after the visit to Madame and Miss Emily):** This scene is crucial for testing the personhood objection. Tommy realises that proving they had souls changed nothing. The system did not require them to be persons; it required them to be organs. This undermines the idea that better ethical criteria would have saved them.
  4.  **Kathy's Eleven Years of Caring:** This is what the arguments in the literature cannot show. Bioethics discusses the *moment* of death. Ishiguro shows the *waiting* for death. It demonstrates the social cost of the 'completion' criterion: it creates a class of people whose entire adult life is a preparation for disassembly.

  **What the novel shows that the literature cannot:**
  The philosophical literature treats the definition of death as a line to be drawn on a graph of biological functions. *Never Let Me Go* shows that the definition of death is a story we tell ourselves to manage our fear of mortality and our need for resources. The literature asks, 'Is the brain stem functioning?' The novel asks, 'What does it do to the living when we treat the dying as spare parts?'

  It reveals that the danger is not necessarily getting the biological criterion wrong, but creating a society where the criterion can be ignored for the sake of convenience. It shows that a definition of death is only as secure as the human rights of the person to whom it is applied.

  **Verdict on your hypothesis:**
  You are right that 'completion' functions as a utilitarian criterion of exhaustion, and you are right that this supports the view that death criteria serve social practices. However, be cautious in asserting the programme presupposes a neurological criterion. It presupposes nothing of the sort; it presupposes a suspension of ethics. The donors are not brain-dead; they are living sacrifices. The novel is not an argument for a better definition of death, but a warning that no definition of death protects us if we are not first agreed to be fully alive.
