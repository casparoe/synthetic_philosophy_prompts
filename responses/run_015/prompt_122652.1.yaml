answer: |-
  # HANDOUT: The Laws of Nature Decision Tree
  **Metaphysics Reading Group | Humean vs. Anti-Humean Diagnostics**

  **Instructions:** Start at **Node 1**. Follow the path dictated by your intuitions on the concrete cases. Do not look at the leaf names until the end. If you hit a **⚠️ FLAG**, stop and read the warning.

  ---

  ### THE BRANCH NODES

  **1. The Distant Galaxy (Supervenience)**
  Imagine a stray event occurs on the far side of the galaxy that has no causal impact on Earth. Does this change *what the laws of nature are* here?
  *   **YES:** Laws depend on the total distribution of events. (Go to 2)
  *   **NO:** Laws are independent of the total mosaic. (Go to 5)

  **2. The Categorical Base (Mosaic Content)**
  Are the fundamental properties in the mosaic defined by what they *are* (categorical) or by what they *must do* (powers/potentials)?
  *   **POWERS:** Properties are essentially dispositional. (Go to **Leaf D**)
  *   **CATEGORICAL:** Properties are non-modal; powers are derived. (Go to 3)

  **3. The Billion Particles (Governance)**
  A billion particles move in straight lines and then stop. There is no enforcement mechanism, they just *happen* to match this pattern. Is there a **law** here?
  *   **YES:** Regularity is sufficient for lawhood. (Go to 4)
  *   **NO:** Laws require something to *enforce* the regularity. (Go to **⚠️ FLAG A**)

  **4. The Bookkeeping Test (Steering)**
  Does the law merely keep score of the particles' behavior, or does it have a hand in *making* them behave that way?
  *   **SCOREKEEPING:** Laws summarize; they don't produce. (Go to 7)
  *   **STEERING:** Laws produce/govern the instances. (Go to **⚠️ FLAG B**)

  **5. The Singleton World (Complexity)**
  A universe contains exactly one particle moving at constant velocity forever. Is there a law of nature in this world?
  *   **YES:** Laws can exist without complex regularities. (Go to 6)
  *   **NO:** Laws require a system of facts to summarize. (Go to **Leaf P**)

  **6. The Explanatory Direction (Grounding)**
  Does the law explain *why* the particle moves, or does the particle's motion explain the law?
  *   **LAW EXPLAINS MOTION:** Downward grounding. (Go to 8)
  *   **MOTION EXPLAINS LAW:** Upward grounding. (Go to **Leaf P**)

  **7. The Simplicity Metric (Objectivity)**
  In the "Best System" analysis, is the tradeoff between simplicity and strength objective or indexed to creatures like us?
  *   **OBJECTIVE:** There is a mind-independent best system. (Go to **Leaf MRL**)
  *   **INDEXED:** Simplicity is relative to our cognitive interests. (Go to **Leaf PROJ**)

  **8. The Relata Test (Universals)**
  Is the law a relation of necessitation between universals (e.g., *N(F, G)*)?
  *   **YES:** Laws are relations among properties. (Go to **Leaf ADT**)
  *   **NO:** Laws are not relations among universals. (Go to 9)

  **9. The Brute Operator (Primitivism)**
  Are laws fundamental, unanalyzable logical operators on states of affairs?
  *   **YES:** Laws are primitive features of reality. (Go to **Leaf MAU**)
  *   **NO:** (You have rejected all Anti-Humean ontologies. Revisit Node 2 or 5).

  ---

  ### ⚠️ WARNING FLAGS

  **⚠️ FLAG A: The "Governance without Independence" Trap**
  *Path: Node 1 (YES) → Node 3 (NO)*
  You think laws supervene on the mosaic (Humean) but also require enforcement (Anti-Humean).
  *   **Status:** **UNOCCUPIED / INCOHERENT.**
  *   **Why:** If laws supervene, the mosaic determines the laws. If laws govern, the laws determine the mosaic. This creates circular determination. You must choose: either laws float free of the mosaic (Anti-Humean) or they don't govern it (Humean).

  **⚠️ FLAG B: The "Steering Humean" Trap**
  *Path: Node 1 (YES) → Node 4 (STEERING)*
  You think laws supervene on the mosaic but also *make* the mosaic happen.
  *   **Status:** **METAPHYSICALLY UNSTABLE.**
  *   **Why:** Similar to Flag A. Standard Humeanism (Lewis) explicitly denies steering to avoid this circularity. If you want steering, you usually must deny supervenience (go back to Node 1).

  **⚠️ FLAG C: The "Twin Leaves" Problem**
  *Leaves: ADT vs. MAU*
  *   **Status:** **EMPIRICALLY INDISTINGUISHABLE.**
  *   **Why:** Armstrong-Dretske-Tooley (ADT) and Maudlin-style Primitivism (MAU) both predict the same physical outcomes (Governing, Anti-Humean). The split is purely ontological: are laws *relations* (ADT) or *primitive operators* (MAU)? Your empirical intuitions cannot separate these; only your preference for ontological parsimony vs. structural explanation can.

  ---

  ### THE LEAVES (POSITIONS)

  *   **Leaf MRL:** **Mill–Ramsey–Lewis Best-System.** (Humean, Objective, No Steering). Laws are theorems of the system that best balances simplicity and strength over the categorical mosaic.
  *   **Leaf PROJ:** **Deflationary / Projectivist.** (Humean, Subjective, No Steering). Laws are useful human projections onto the mosaic, not features of the world itself.
  *   **Leaf D:** **Dispositional Essentialism.** (Anti-Humean, Powers, Steering). Laws are metaphysically necessary truths grounded in the essential powers of properties (Bird/Ellis).
  *   **Leaf ADT:** **Nomic Necessitation.** (Anti-Humean, Universals, Steering). Laws are contingent relations of necessitation between universals (Armstrong/Dretske/Tooley).
  *   **Leaf MAU:** **Primitivism.** (Anti-Humean, Brute, Steering). Laws are fundamental, irreducible features of the world that govern matter without reducing to powers or universals (Maudlin).
  *   **Leaf P:** **(Empty/Rejected).** If you landed here, you likely hold a view that denies laws in simple worlds but accepts supervenience. This is often unstable (see Node 5).

