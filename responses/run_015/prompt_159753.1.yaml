  ### The Repaired Principle of Indifference

  1.  **The Mechanism Clause:** For continuous physical quantities, you may only apply indifference over the specific control variable of the generating mechanism. If the mechanism is unknown, no single probability is defined. *(Motivated by: Cubes, Chords, Tiles)*
  2.  **The Symmetry Clause:** For discrete, finite sets of outcomes where no distinguishing information exists between the labels, you may apply indifference over the outcomes themselves. *(Motivated by: Dice, Doors)*
  3.  **The Causal Structure Clause:** You may not apply indifference to binary splits where the underlying causal processes are known to be asymmetric or complex. *(Motivated by: Rain, Sister)*
  4.  **The Infinity Clause:** You may not apply indifference over unbounded countable sets. *(Motivated by: Integers)*
  5.  **The Propensity Clause:** For repeatable events with unknown bias, apply indifference over the *propensity parameter* (the chance of the event occurring), not the binary outcome itself. *(Motivated by: Sunrise)*

  ***

