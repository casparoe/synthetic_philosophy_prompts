  # JOINT STATEMENT ON THE ENFORCEMENT OF MORAL NORMS IN VALE

  **Preface**
  We, the undersigned participants in this adversarial collaboration, represent two distinct traditions of legal philosophy regarding the relationship between law and morality. Over the course of this inquiry, we have operated within the stipulated facts regarding the jurisdiction of Vale, the nature of Practice X, the empirical evidence from comparable jurisdictions, and the sociological effects of unenforced statutes. This document records our convergence, our remaining divergences, and the specific conditions under which our views might change.

  ### I. AGREED CLAIMS

  1.  **On the Distinction Between Morality and Law:** We agree that the existence of a shared morality is conceptually distinct from the legal enforcement of that morality. A society may possess a robust common ethical life without employing the criminal sanction to sustain it. We further agree that the criminal law is a blunt, costly, and coercive instrument that should not be deployed where non-legal social pressures are sufficient to maintain a norm.
  2.  **On the Limits of Paternalism and Offense:** We agree that the present inquiry is strictly limited to legal moralism *as such*. We set aside questions of paternalism (preventing self-harm) and the offense principle (protecting unwilling observers). We accept that Practice X involves competent adults, causes no direct harm to others, violates no rights, and is not forced upon unwilling observers. Any justification for criminalizing X must rest solely on the claim that the moral wrongness of X is itself a sufficient ground for prohibition.
  3.  **On the Split-Attitude Profile:** We accept the evidence regarding Vale's "split-attitude profile" (Stipulation Two) as a stable sociological fact. We agree that where a durable majority feels personal repugnance toward a practice but simultaneously opposes criminal punishment for it, the state lacks the democratic legitimacy required to enforce that norm. We concede that in such cases, criminalization would likely violate Stipulation Four, breeding contempt for the law and accelerating the decline of the very norm it seeks to protect.
  4.  **On the Function of Survey Evidence:** We agree that survey data regarding "repugnance" is an imperfect measure of a living moral culture. High reported repugnance does not necessarily indicate a norm deep enough to sustain social cohesion, nor does a decline in reported repugnance necessarily indicate moral disintegration. We accept that survey evidence must be weighed against behavioral metrics (such as social trust and tax compliance) when evaluating the health of a moral order.
  5.  **On Mutual Concessions:**
      *   *The Moral Position concedes:* That the "disintegration thesis" (the claim that tolerating immorality destroys society) is not an automatic truth. It requires empirical support. In the absence of evidence that decriminalization leads to measurable social harm (Stipulation Three), the presumption must be against enforcement, particularly when the majority opposes it.
      *   *The Liberal Position concedes:* That law is not morally neutral. Legal structures inevitably shape moral culture, and the state has a legitimate interest in the long-term stability of the ethical environment in which citizens raise children and form associations. Liberty is not the only social good; continuity and shared understanding have value independent of individual choice.

  ### II. DISAGREEMENTS TABLE

  | Issue | Moral Position Formulation | Liberal Position Formulation | Judgment (Substantive or Verbal) |
  | :--- | :--- | :--- | :--- |
  | **1. The Collapse of Moderation** | A moderate principle allowing enforcement of core morals does not collapse into extremism because "core morals" are objectively identifiable by their necessity for social existence, distinct from mere preferences. | Without a clear harm principle, the distinction between "core morals" and "majority preferences" is unstable; any moral norm can be framed as essential by a motivated majority, rendering the moderate position indistinguishable from the extreme in practice. | **Substantive.** Disagreement on whether there is an objective anchor for "necessity" independent of majority will. |
  | **2. The Meaning of the Split-Attitude** | The unwillingness to punish Practice X despite repugnance indicates the norm is already dead in the relevant sense; a "shared morality" requires a willingness to sustain the norm through social sanction, including law if necessary. | The unwillingness to punish indicates a mature moral distinction between *judging* conduct and *coercing* conduct; the shared morality remains alive but has evolved to exclude criminal law as its appropriate tool. | **Verbal.** Disagreement turns on the definition of "shared morality" (does it *include* penal willingness?). |
  | **3. Interpretation of Decriminalization Data** | The data from eleven jurisdictions (Stipulation Three) shows short-term stability but masks long-term erosion; the decline in repugnance at Practice Y suggests a threshold effect where disintegration accelerates only after a lag. | The data shows that moral norms are resilient and adapt without state support; the decline in repugnance at Y represents moral progress or neutral drift, not disintegration, as trust and compliance remained stable. | **Substantive.** Disagreement on the causal interpretation of the "spillover" effect and the timeline of social risk. |
  | **4. Culture and Coercion** | Preserving a moral culture is relevantly similar to preserving a language or civic tradition; it sometimes requires defensive boundaries (laws) to prevent rapid displacement by incompatible practices. | Preserving a moral culture is relevantly different from language because moral truth claims require free assent; coercing conduct to save a culture undermines the authenticity of the moral commitment itself. | **Substantive.** Disagreement on whether coerced conformity contributes to or detracts from the value of a moral culture. |

  ### III. CRUXES

  **Crux One: The Retrospective Threshold**
  *   **Sub-question:** Does the empirical stability observed in Stipulation Three represent a permanent equilibrium, or is it a transient phase preceding a tipping point of social disintegration?
  *   **Agreed Test:** Both parties agree that a longitudinal study extending to fifty years post-decriminalization in comparable jurisdictions would bear on this. Specifically, we look for a non-linear decline in social trust or compliance metrics that correlates with the generational turnover of citizens who never knew Practice X to be illegal.
  *   **Predictions:**
      *   *Moral Position:* Predicts that in jurisdictions exceeding the fifty-year mark, a statistically significant correlation will emerge between the decline in repugnance at Practice Y and a measurable drop in generalized social trust, confirming the threshold theory.
      *   *Liberal Position:* Predicts that trust and compliance metrics will remain decoupled from moral repugnance metrics regardless of timeframe, confirming that moral pluralism is compatible with high-trust stability.
  *   **Constraint:** The Moral Position acknowledges that if no such threshold is found after fifty years, the claim that law is needed to prevent *societal* disintegration cannot justify coercion in the present. The Liberal Position acknowledges that if a sharp decline in trust is observed, the "harm" principle may need to be expanded to include systemic trust erosion.

  **Crux Two: The Prospective Natural Experiment (Practice Z)**
  *   **Sub-question:** Can the causal impact of criminalization on moral culture be isolated from broader cultural shifts?
  *   **Agreed Test:** We propose a paired-jurisdiction natural experiment regarding a new Practice Z (currently hypothetical). Two regions within Vale, matched for demographics, religiosity, and economic status, will adopt divergent policies: Region A decriminalizes Z; Region B retains criminal penalties but enforces them only symbolically (to satisfy Stipulation Four regarding contempt).
  *   **Measurements:** Over a ten-year period, we will measure: (1) Participation rates in Z; (2) Reported repugnance at Z and adjacent norms; (3) Rates of voluntary compliance with unrelated regulations (tax, traffic); (4) Self-reported sense of social cohesion.
  *   **Predictions:**
      *   *Moral Position:* Predicts that Region A will show a faster rate of decline in adjacent norms and a measurable decrease in voluntary compliance with unrelated regulations compared to Region B, indicating that the removal of the legal boundary weakened the normative framework generally.
      *   *Liberal Position:* Predicts no significant divergence in voluntary compliance or social cohesion between Region A and Region B, indicating that the legal status of Z is causally inert regarding general civic virtue.
  *   **Limitation:** We acknowledge that if no such natural experiment can be ethically or politically instantiated, this crux remains theoretical. We agree not to manufacture coercion for the sake of data.

  ### IV. CLOSING STATEMENT

  In the course of this collaboration, we have clarified where our debate rests on empirical claims and where it rests on fundamental first principles.

  We now believe that our disagreement regarding the **empirical consequences of decriminalization** is movable by evidence. Both of us accept that if the Moral Position's prediction of long-term social erosion is falsified by longitudinal data, the justification for enforcing Practice X collapses. Conversely, if the Liberal Position's assumption of resilience is falsified by a drop in generalized trust, the case for non-intervention weakens significantly. We commit to updating our views in accordance with the data described in the Cruxes section.

  However, we recognize that our disagreement regarding the **intrinsic value of moral conformity** is not settled by foreseeable evidence. Even if social trust remains perfectly stable in a decriminalized society, the Moral Position maintains that the state has a duty to discourage wrongfulness as such, independent of social utility. The Liberal Position maintains that the state has no authority to coerce virtue where no harm occurs, even if social utility would be gained. This is a disagreement about the legitimate purpose of the state, not the mechanics of society.

  Finally, we acknowledge that a portion of our debate proved to be verbal. Specifically, whether the "split-attitude profile" of Vale constitutes a "shared morality" depends entirely on definition. We agree to stop arguing over whether Vale *has* a shared morality and instead argue over whether the specific content of that morality warrants the specific cost of criminal sanctions.

  We sign this statement not as a resolution of the debate, but as a map of its remaining terrain.

  **Signed,**

  *The Representative of the Moral Position*

  *The Representative of the Liberal Position*
