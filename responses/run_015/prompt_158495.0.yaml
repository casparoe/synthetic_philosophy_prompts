          *   Relevance to Friend: Actually undermines the friend if pushed too hard (unjust combatants are *more* liable).

      *   *Thesis 5: The Institutional Agency Claim.*
          *   Claim: Soldiers are instruments of the state; blame lies with leaders.
          *   Status: Substantive, defensible to a degree (mitigates blame), but doesn't erase moral agency.
          *   Relevance to Friend: Supports "don't blame," but doesn't necessarily mean "morally equal" in terms of right to kill.

  4.  **Refining the Analysis for Each Thesis:**
      *   *Trivial vs. Substantive:* Is it a tautology or a real claim?
