      *   *Traditional JWT (Walzerian):* Combatants on both sides have equal right to kill each other, provided they follow *jus in bello* (rules of engagement). *Jus ad bellum* (justice of war) is separate.
      *   *Revisionist JWT (McMahan):* MEC is false. If your cause is unjust, you don't have a right to kill.
      *   *Legal vs. Moral:* International Humanitarian Law (IHL) treats them equally for practical reasons, but that doesn't necessarily mean they are *morally* equal.
      *   *Blame/Responsibility:* Are soldiers blameworthy for fighting an unjust war?

  3.  **Drafting the Theses (The "Menu"):**
      I need to categorize the different ways the friend might be using the phrase. I'll aim for 4-5 distinct interpretations that cover the user's intuitions and the philosophical landscape.

      *   *Thesis 1: The Legal/Functional Equality (IHL perspective).*
