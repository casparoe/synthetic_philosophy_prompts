          *   Status: Defensible as law, but doesn't prove moral equality.
          *   Relevance to Friend: Weak support. Law $\neq$ Morality.

      *   *Thesis 2: The Epistemic Excuse (Ignorance/Coercion).*
          *   Claim: Soldiers can't know the war is unjust or are forced (conscription).
          *   Status: Substantive, defensible for *some* soldiers, but not a universal principle.
          *   Relevance to Friend: Strong support for conscripts, weak for volunteers. Distinguishes conscripts from defenders (who know they are defending).

      *   *Thesis 3: The Separation Thesis (Walzerian).*
          *   Claim: *Jus ad bellum* (cause) and *jus in bello* (conduct) are independent.
