answer: |-
  You have hit on a crucial insight: the phrase "the moral equality of combatants" is often used as a conversation-stopper, but it is actually a umbrella term covering several distinct, and often incompatible, claims. In academic Just War Theory, this is the central fault line between "Traditionalists" (like Michael Walzer) and "Revisionists" (like Jeff McMahan).

  Your friend is conflating **legal status**, **liability to attack**, and **moral culpability**. To help you dismantle the argument, here is a menu of four distinct theses that phrase might express. For each, I have analyzed its substance, its defensibility, and whether it actually supports your friend's specific conclusion (that an aggressor conscript is morally equivalent to a defending volunteer).

  ### 1. The Legal-Pragmatic Thesis
  **The Claim:** International Humanitarian Law (IHL) treats combatants symmetrically to ensure compliance. If we told soldiers on the "unjust" side that they were criminals simply for fighting, they would have no incentive to follow the rules of war (e.g., not killing civilians). Therefore, the law grants them equal permissions and protections.

  *   **Trivial or Substantive?** Substantive. It makes a claim about why laws are structured the way they are (pragmatism vs. moral truth).
  *   **Defensible or False?** **Defensible.** This is the standard justification for the Geneva Conventions. It is widely accepted in international law that legal equality is a tool to minimize suffering, not a declaration of moral purity.
  *   **Does it support your friend?** **No.** This thesis explicitly separates *legal* status from *moral* status. It admits that one side might be morally wrong but argues we should treat them equally *for the sake of order*. Your friend is arguing that the soldiers are *morally* equal ("should not be judged differently"). This thesis says the law treats them the same *despite* potential moral inequality. Using this argument admits your friend is wrong about the morality, only right about the bureaucracy.

  ### 2. The Epistemic and Coercive Excuse Thesis
  **The Claim:** Individual soldiers lack the information (epistemic access) or the freedom (coercion/conscription) to judge the justice of the war. Therefore, they cannot be held personally responsible for the *cause*, only for their *conduct*.

  *   **Trivial or Substantive?** Substantive. It relies on empirical claims about what soldiers know and how much choice they have.
  *   **Defensible or False?** **Partially Defensible.** It is strong for conscripts in closed societies (e.g., a North Korean draftee) but weak for volunteers in open societies (e.g., a US volunteer post-2003). It is also asymmetrical: defenders usually *know* they are defending (their homes are burning), whereas aggressors must take their government's word.
  *   **Does it support your friend?** **Only partially.** This supports the idea that the *conscript* might be excused, but it does not make them *equal* to the defender. The defender is acting on immediate, verifiable necessity (self-defense). The conscript is acting on deferred trust (state authority). This thesis suggests the conscript is *less blameworthy than their leaders*, not that they are *morally identical to the victim*. It creates a hierarchy of innocence, not equality.

  ### 3. The Separation Thesis (The Walzerian View)
  **The Claim:** The justice of the war (*jus ad bellum*) and the conduct within the war (*jus in bello*) are logically independent. A soldier can fight for an unjust cause but still fight honorably. Once they put on the uniform, they become a "threat" in a structural sense, and their opponent's right to kill them is based on that threat, not the underlying politics.

  *   **Trivial or Substantive?** Highly Substantive. This is the core of Traditional Just War Theory.
  *   **Defensible or False?** **Contested.** It was the dominant view for 40 years but is now heavily criticized by Revisionist philosophers. The criticism is: If I have no right to start a fight, I have no right to shoot you when you try to stop me. If your cause is unjust, your "threat" is illegitimate, so you don't gain an equal right to kill.
  *   **Does it support your friend?** **Yes, but with a catch.** This is the thesis your friend is implicitly using ("the justice of the cause washes off"). However, this thesis traditionally applies to **liability** (can I shoot them?), not **culpability** (are they bad people?). Your friend is using it to argue about *judgment/blame*. Even Walzer admits that soldiers fighting an unjust war are doing something tragic and wrongful, even if they are permitted to fight. This thesis supports the idea that the defender can shoot the conscript, but it does not necessarily support the idea that the conscript is *morally blameless*.

  ### 4. The Instrumental Agency Thesis
  **The Claim:** Soldiers are merely instruments of the state. Moral agency resides with the leaders who decide to wage war. Soldiers are "tools" rather than "actors," so blame attaches exclusively to the state.

  *   **Trivial or Substantive?** Substantive. It makes a claim about the nature of human agency within hierarchies.
  *   **Defensible or False?** **Mostly False.** While hierarchy mitigates blame, it does not erase agency. Soldiers are moral agents who can refuse unlawful orders (e.g., shooting civilians). If they retain agency for *in bello* crimes (war crimes), they must retain some agency for *ad bellum* participation (joining the army). To say they have *no* agency is to treat them as children or robots.
  *   **Does it support your friend?** **Superficially, but it collapses.** If soldiers are mere instruments, they are indeed interchangeable. But if they are mere instruments, they are also incapable of *moral* judgment entirely. This would mean the *defending volunteer* is also just a tool, which undermines the moral value of their sacrifice. You cannot claim the aggressor is "not to be judged" because they are a tool, while simultaneously praising the defender for their "courage" or "duty," which implies they *are* moral agents.

  ### Summary for Your Debate

  Your friend is relying primarily on **Thesis 3 (The Separation Thesis)**, but they are smuggling in conclusions from **Thesis 4 (Instrumental Agency)** to avoid blaming the conscript.

  **Here is the counter-argument you can offer:**

  1.  **Distinguish Liability from Culpability:** "Are you saying the defender isn't allowed to shoot the conscript (Liability), or that the conscript isn't a tragic participant in a wrong (Culpability)? The 'Moral Equality' doctrine usually only protects the conscript from being murdered *by the defender*; it doesn't absolve them of participating in an injustice."
  2.  **The Asymmetry of Knowledge:** "The defender knows they are defending; the aggressor must trust their leaders. That is an epistemic difference. Excusing the aggressor for ignorance doesn't make them *equal* to the defender; it just makes them *excused*. An excused wrongdoer is not morally identical to a righteous defender."
  3.  **The "Uniform" Fallacy:** "If wearing a uniform washes away the justice of the cause, then war crimes would also be washed away if the uniform authorized them. We agree soldiers are responsible for war crimes even in uniform. Why are they not responsible for the crime of aggressive war?"

  **The Verdict:**
  The phrase "Moral Equality of Combatants" is **defensible as a legal rule** (Thesis 1) to keep wars humane, and **partially defensible as an excuse for conscripts** (Thesis 2), but it is **philosophically false as a claim of moral symmetry** (Thesis 3 & 4).

  Your friend is treating a **legal convention** (we treat them the same to stop atrocities) as if it were a **moral truth** (they are the same). You can grant that the conscript shouldn't be *prosecuted* (legal/pragmatic) without granting that they are *morally equal* to the defender (ethical).
