      *   **Maya Example:** The Classic Maya collapse was regional (Southern Lowlands). The Northern Lowlands flourished. The *political system* of the Classic period collapsed, even if "Maya culture" persisted.
      *   **Easter Island Example:** Even here, recent scholarship suggests a more nuanced picture (population decline due to contact, not just ecological suicide), but certainly, the moai culture ended.

  4.  **Formulate the Response:**
      *   **Acknowledge and Validate:** Start by acknowledging the insight. It's a good observation that "collapse" is often used loosely.
      *   **Correct the Premise:** Gently inform the user that the "70%/100yr/500yr" rule isn't a standard academic consensus (Diamond doesn't use math like that). It sounds like a heuristic from a specific commentator (maybe Luke Kemp or a podcast summary of Tainter).
      *   **Address the Core Question (The Flaw):** Why is recovery time a bad sole metric?
          1.  **Civilizational Identity:** If Society A vanishes and Society B arises 300 years later in the same spot, Society A still collapsed. (e.g., Mycenae vs. Archaic Greece).
          2.  **Human Suffering:** "Collapse" describes a lived experience of catastrophe, not just a long-term historical trend. A 300-year dark age is still a collapse for the generations living through it.
