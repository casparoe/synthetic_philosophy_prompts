  3.  **Evaluate the "Collapse" Concept:**
      *   **Definitional Issues:** "Collapse" is a loaded term. Academics prefer terms like "transformation," "reorganization," or "loss of complexity."
      *   **The User's Metric:** The metric focuses on *institutional permanence*. If it comes back, it didn't collapse.
      *   **The Flaw:** This ignores the *human cost* and the *discontinuity of experience*. Just because writing returns 300 years later doesn't mean the people who suffered during the interim didn't experience a collapse. It also ignores regional variation (e.g., Mycenae collapsed, even if Athens survived).
