  3.  **Step 1: Correspondence Table:**
      *   *Instrument:* The agent's character/psychological disposition.
      *   *Quantity:* Moral truth/Right action/The Good.
      *   *Calibration:* Moral education/socialization/habituation (Aristotelian *ethos*).
      *   *Design Range:* Ordinary moral situations (low stakes, familiar context).
      *   *Interfering Conditions:* Situationist variables (hurry, authority, peer pressure).
      *   *Reliable Reading:* Virtuous action.
      *   *Experimentalist:* The philosopher/psychologist evaluating the agent (or the agent themselves?). *Correction:* In the analogy, the *situationist* is the one testing the instrument. The *virtue ethicist* is the defender of the instrument's validity. Let's refine: The "Experimentalist" in the analogy is usually the *situationist psychologist* running the test, but the virtue ethicist claims they are *bad* experimentalists for ignoring specs. Or, the "Instrument" is the person, and the "Experimentalist" is the world testing them. Let's stick to the prompt's framing: The virtue ethicist compares the *virtue* to the *instrument*. So who is the experimentalist? Ideally, the moral agent using the virtue to navigate the world? No, the prompt says "no competent experimentalist concludes..." implying the *observer* of the data. Let's map the Situationist as the "Competent Experimentalist" (who the VE claims is being *incompetent* in this specific instance).
      *   *Refinement:*
          *   Instrument = Virtuous Character Trait.
          *   Quantity = Moral Demand/Requirement of the Situation.
          *   Calibration = Moral Upbringing/Habituation.
          *   Design Range = "Normal" Moral Contexts.
          *   Interference = Situational Pressures (Milgram, etc.).
          *   Reading = Behavioral Output.
          *   Experimentalist = The Situationist Psychologist (accused of misuse).

  4.  **Step 2: Identify Disanalogies:**
      *   *Design/Teleology:* Instruments have designers and specs. Virtues (on naturalistic views) evolve or are constructed socially without a clear "spec sheet" known *a priori*.
      *   *Independence of Quantity:* We know voltage exists independently of the voltmeter. Do we know "The Good" exists independently of the virtuous agent? (Euthyphro dilemma vibes).
      *   *Noise vs. Signal:* In instruments, noise is random or systematic error. In behavior, is "situational influence" noise, or is it *constitutive* of the action?
      *   *Calibration Verification:* We can check a voltmeter against a standard. How do we check a virtue against a moral standard without circularity?
      *   *Range Definition:* We can measure a thermometer's range. How do we define the "normal range" for courage without begging the question (i.e., "where courage works")?
      *   *Aggregation:* Instruments are singular. Character is supposed to be cross-situational consistency (Globalism). Situationists argue consistency is low. Instruments don't change their internal mechanism based on the box they are put in (usually).

  5.  **Step 3: Critical vs. Incidental Disanalogies:**
      *   *Incidental:* Instruments are metal/plastic; virtues are neural/psychological. (Irrelevant to logic).
      *   *Critical:*
          1.  *The Spec Sheet Problem:* We don't know the "design range" of virtue independently of observing where it succeeds. This makes the defense ad hoc.
          2.  *The Quantity Problem:* In physics, the quantity (e.g., magnetic field) is ontologically secure. In ethics, the "moral demand" is contested. If the instrument fails often, maybe the "quantity" isn't a stable property of the world accessible by internal traits.
          3.  *The Consistency Requirement:* A spectrometer measures *the same thing* consistently. Situationists argue virtues predict *cross-situational consistency*. If the "instrument" only works in one specific box, is it a general instrument or a specific reflex?
          4.  *Calibration Access:* We can recalibrate a gauge. Moral recalibration (repentance, therapy) is opaque and slow.

  6.  **Step 4: Evaluate the Conclusion:**
      *   Does the analogy save virtue ethics?
      *   *Verdict:* It weakens the situationist *fatalism*, but it costs the virtue ethicist the *globalism* they usually want.
      *   If virtues only work in "design ranges," then they are local traits, not global character. This concedes the main point of situationism (that global traits are empirically unsupported) while saving the *concept* of traits.
      *   The analogy fails to protect *Aristotelian* virtue ethics specifically, which claims virtues are stable hexis (states) that persist across varying contexts.
      *   The "Boundary Condition" defense is ad hoc unless the VE can specify the boundaries *before* the data comes in.

  7.  **Step 5: Better Analogy or Explanation:**
      *   *Better Analogy:* Immune System? (Works generally, overwhelmed by specific pathogens, highly context-dependent). Or *Skills* (Expertise).
      *   *Skill Analogy:* A chess master can be distracted. But we still call them a master. However, if they lose to a novice because of a loud noise, are they a master?
      *   *Best Approach:* Acknowledge that physical analogies fail because moral traits are *normative* and *constitutive*, not just *causal*.
      *   *Alternative:* Focus on "Fragmentation" or "Local Traits" (Doris's view) rather than saving Global Traits.
      *   *Conclusion:* No physical analogy settles the metaphysical status of traits because the dispute is about *prediction of behavior* vs. *normative evaluation*.

  8.  **Drafting the Response (incorporating the Physicist Persona):**
      *   Use terminology the user respects (signal-to-noise, boundary conditions, ad hoc hypotheses, operationalization).
