          5.  Propose a better analogy or explain why physical analogies fail here.
      *   **Tone:** Rigorous, analytical, respectful of the user's background, philosophically nuanced but grounded in the logic of experimentation.

  2.  **Deconstruct the Instrument Analogy:**
      *   *Core Claim:* Virtues are like instruments. Situationist experiments are like stressing instruments beyond specs. Failure under stress doesn't prove the instrument (virtue) doesn't exist.
