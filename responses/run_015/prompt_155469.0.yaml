      *   **Key Distinction 3: The Nature of Will.** For Leibniz, the will is inclined by the intellect but not necessitated by it (unless the good is perfectly clear, which it rarely is for humans). Sin is not just error; it's a disorder of love/appetite resulting from confused perception.
