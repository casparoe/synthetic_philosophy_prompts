      *   **Specific Question:** Where is the false step in the inference from pre-established harmony/necessary truths to the conclusion that interpersonal moral conflict is *metaphysically impossible* rather than *epistemically obscured*? How does Leibniz preserve space for moral uncertainty/failure without slipping into voluntarism?

