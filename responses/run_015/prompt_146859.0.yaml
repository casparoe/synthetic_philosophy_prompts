prompt: |-
  I'm a retired physicist who's only recently started taking philosphy seriously, and I'm wondering wether reinforcement-learning agents can genuinely suffer. Could you build me a thought experiment to these specifcations? I want a realistic, non-science-fiction scenario—no demons, no perfect predictors—of an industrial robot that gets negative reward signals not for physical damage but for failing a sorting task, yet it has developed an internal predictive model of its own reward channel (a kind of 'reward self-model') with no interoceptive link to bodily harm. Keep the scenario to one paragraph.

  Then do the check: state the belief/state in question, the key feature present, the nearby worlds where it's absent, and why a functionalist who equates suffering with negative reward valence says the robot suffers, while an integrated-information or embodied view that ties suffering to homeostatic information integration says it doesn't. Also say what happens if you remove the reward self-model—does the functionalist verdict change?

  Finish with an honest note on which feature does all the work, and how a functionalist defender would attack the case—what weakness they'd claim you've smuggled in. And please answer in British English, with British spelling like behaviour and centre; no bibliography or paper references, just reason it through from first principles.
