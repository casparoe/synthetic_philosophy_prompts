prompt: |-
  Quick bit of context: I TA for a moral responsibility seminar, and this term the professor is trying something a little unusual -- pairing the standing-to-blame literature with a play. The play is Measure for Measure, whose title is lifted straight from the Sermon on the Mount -- judge not, lest ye be judged, for "with what measure ye mete, it shall be measured to you again" -- and the reading packet has the usual suspects on hypocrisy and standing: the Cohen piece on who has standing to condemn terrorists, Wallace on hypocrisy and equal standing, the argument over whether a hypocrite's blame is undercut by a real fairness problem or whether that's just tu quoque and shouldn't touch whether the blamed act was actually wrong. I don't need help finding more of that stuff, I can go chase down papers myself -- what I want from you is the actual reading, worked out scene by scene rather than in generalities, since that's the part I keep going in circles on for my discussion notes.

  Here's where I'm stuck. Angelo sentences Claudio to death for fornication under a law Angelo has, as far as anyone in the play knows, never had to resist breaking himself -- so is his standing already shaky before he ever lays eyes on Isabella, on some "untested virtue isn't standing" principle, or does standing really require he be guilty of something comparable, so it's only the later attempt to blackmail Isabella into bed that actually costs him his standing? And if it's the later thing, does that damage travel backwards and unmake the legitimacy of Claudio's sentence, or is the sentence's validity a seperate question from whether Angelo personally had any business handing it down? Then there's the Duke, an even weirder case -- he all but admits that enforcing his own long-neglected laws himself would make him look tyrannical, so he hands the dirty work to a deputy and hides in a friar's disguise to watch what happens -- does manufacturing someone else's temptation and then judging them for failing it launder your own standing problem or just relocate it onto someone else? And I'd love your take on Isabella, who is savage to Claudio in the cell for begging her to trade her body for his life, then in the last scene kneels next to Mariana to beg mercy for Angelo -- while still believing he'd had her brother executed -- on the oddly legalistic ground that his "act did not o'ertake his bad intent." Is that forgiveness doing work a standing argument would otherwise do, or is she making a standing argument of a different kind?

  Don't feel you need to tie it up neatly -- tell me where the plays ending (the public unmasking, marriages handed out like sentences, Claudio turning up alive after all) actually resolves the standing question, and where it just changes the subject to mercy instead. And if the philosophical literature and the play are pulling in different directions somewhere, say so rather than smoothing it over, I'd genuinely rather know. Take your time on this one and think it through properly, like you're about to defend the reading in front of the seminar rather than hand in a tidy study guide.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is a TA for a moral responsibility seminar.
      *   **Topic:** Pairing the "standing to blame" literature (Cohen, Wallace, hypocrisy, *tu quoque*) with Shakespeare's *Measure for Measure*.
      *   **Specific Need:** A scene-by-scene reading of the play through the lens of standing-to-blame, not generalities.
      *   **Key Questions/Stuck Points:**
          *   Angelo's standing: Is it shaky *before* the attempt on Isabella (untested virtue) or only *after* (actual hypocrisy/guilt)?
          *   Retroactivity: Does Angelo's loss of standing invalidate Claudio's sentence?
          *   The Duke: Does delegating enforcement and hiding launder his standing or relocate the problem?
          *   Isabella: Her shift from savagery to Claudio to begging mercy for Angelo. Is this forgiveness or a standing argument?
          *   The Ending: Does it resolve the standing question or pivot to mercy?
      *   **Tone/Style:** Academic but conversational (TA to TA/Professor), rigorous, willing to admit tensions between the text and the philosophy, not smoothing over contradictions. "Think it through properly, like you're about to defend the reading."

  2.  **Deconstruct the Philosophical Framework (Mental Sandbox):**
      *   *Standing to Blame:* It's not about whether the act is wrong (Claudio *did* break the law), but whether the *blamer* has the right to issue the blame/punishment.
      *   *Hypocrisy:* Wallace argues hypocrisy undermines standing because it violates equal standing/respect. Cohen looks at specific relationships/authority.
      *   *Tu Quoque:* "You did it too." Usually a fallacy regarding the *truth* of the claim, but potentially valid regarding the *authority* of the speaker.
      *   *The Play's Title:* "Measure for Measure" (Matthew 7:2). Divine judgment mirrors human judgment.

  3.  **Scene-by-Scene Analysis (Drafting the Core Content):**

      *   **Act 1 (The Setup):**
          *   *Duke's Exit:* Duke admits he let laws slide. He fears enforcing them now makes *him* a tyrant. He appoints Angelo (known for strictness/chastity).
          *   *Philosophical Angle:* The Duke is outsourcing moral risk. Is he washing his hands? If he enforces, he admits past negligence. By using Angelo, he creates a "clean" enforcer. But is Angelo clean?
          *   *Claudio's Arrest:* Claudio admits guilt ("From too much liberty..."). The law is clear. Angelo applies it.
          *   *Angelo's Standing (Phase 1):* At this point, Angelo is *technically* innocent of the specific crime. But is "untested virtue" enough for standing? Wallace might say yes (he respects the norm *now*), but the Duke's setup suggests the norm is arbitrary.

      *   **Act 2 (The Proposition):**
          *   *Angelo & Isabella:* Angelo demands sex for Claudio's life.
          *   *The Shift:* This is the moment Angelo loses standing. He violates the very norm he is enforcing.
          *   *Philosophical Angle:* This is the "hypocrisy" moment. It's not just *tu quoque*; it's a violation of the moral community's equality. He places himself above the law he wields.
          *   *Retroactivity:* Does this invalidate the sentence? Legally, no. Morally/Philosophically? Yes, it reveals the enforcement was never about justice, but about power/lust. The *authority* is corrupted.

      *   **Act 3 (The Cell & The Plan):**
          *   *Isabella & Claudio:* Isabella blasts Claudio ("Thy sin's not accidental, but a trade"). She is fierce on moral principle.
          *   *Isabella's Standing:* She is "pure." But is her severity a form of moral pride? She claims standing based on her own chastity.
          *   *The Duke (as Friar):* He orchestrates the "bed trick." He is manipulating facts to test/save people.
          *   *Philosophical Angle:* The Duke is playing God. Does a God-figure have standing? Or does manipulation undermine standing? He is creating entrapment scenarios.

      *   **Act 4 (Barnardine & The Heads):**
          *   *Barnardine:* A prisoner who refuses to die. "I am not fitted for it."
          *   *Standing Check:* The Duke (Friar) intervenes. He recognizes the state's lack of standing to kill an unprepared soul. This contrasts with Claudio.
          *   *Ragozine's Head:* Substitution. Faking justice. The Duke is complicit in lying to Angelo. This complicates the Duke's own moral standing to judge Angelo later.

      *   **Act 5 (The Unmasking):**
          *   *The Return:* Duke returns, sheds disguise.
          *   *Isabella's Plea:* She kneels for Angelo. "His act did not o'ertake his bad intent."
          *   *Philosophical Angle:* This is crucial. She isn't saying he's innocent. She's arguing for a distinction between *intent* and *act* regarding punishment. But wait, she thinks Claudio is dead. So she is begging mercy for a murderer (in her eyes).
          *   *Is this Standing?* It's more than standing. It's *forgiveness* acting as a substitute for standing. If the blamer forgives, the question of their standing to blame becomes moot.
          *   *The Duke's Judgments:* He metes out punishments that turn into marriages.
          *   *Resolution:* Does it resolve standing? No. It dissolves it into sovereignty. The Duke has standing because he is the Duke, not because he is moral.

  4.  **Addressing the User's Specific Stuck Points:**

      *   *Angelo's Timing:* It's the *attempt* that kills standing, but the *untested virtue* makes it fragile. The play suggests untested virtue is indistinguishable from vice until tested. So his standing was always provisional.
      *   *Retroactivity:* The sentence's *legal* validity holds, but its *moral legitimacy* evaporates. The play treats them as separate (Claudio is pardoned, not exonerated of the crime).
      *   *The Duke:* He doesn't launder standing; he hoards it. He creates a "trap" to prove his own wisdom. He lacks standing to judge Angelo's lust because he engineered the situation (entrapment).
      *   *Isabella:* Her shift isn't a standing argument; it's a move from *retributive justice* (you broke the law) to *redemptive mercy* (intent matters, life matters). It sidesteps standing by changing the currency from "blame" to "grace."
      *   *The Ending:* It changes the subject. "Measure for Measure" implies reciprocity, but the Duke gives *more* than measure (mercy/marriage). The philosophical tension (who can blame?) is solved by fiat (I am the Duke).

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Critique:* Make sure I don't just summarize the plot. Keep the philosophical terminology (standing, hypocrisy, moral authority) tight.
      *   *Tension:* The user wants to know where the play and philosophy pull apart.
      *   *Point of Divergence:* Philosophy cares about the *conditions* for blame. The play cares about the *consequences* of blame. The Duke resolves everything by power, not by moral logic. This is a crucial distinction. The play is skeptical of *human* standing, suggesting only sovereignty (or divinity) can resolve the mess.
      *   *Isabella's "Intent":* This is legally weird. Attempted rape *is* a crime. But she argues the "act" (sex) didn't happen. She is technically correct about the bed trick, but morally she is forgiving the *intent*. This aligns with the "inner court" vs. "outer court" distinction in responsibility.

  6.  **Final Polish:**
      *   Structure: Introduction (setting the stage), Act-by-Act breakdown, Specific responses to the User's Questions, Conclusion (The Divergence).
      *   Tone: Collegial, rigorous, slightly informal but dense.
      *   Check: Did I answer the "untested virtue" vs. "actual guilt" question? Yes. Did I address the Duke's laundering? Yes. Did I tackle Isabella's shift? Yes.

  7.  **Drafting the Response:** (Mental or scratchpad)
      *   *Intro:* Acknowledge the richness of the pairing.
      *   *Act 1:* Angelo's "clean slate" is a fiction. The Duke knows it.
      *   *Act 2:* The proposition is the collapse of standing.
      *   *Act 3/4:* Isabella's severity vs. Duke's manipulation.
      *   *Act 5:* The pivot to mercy.
      *   *Synthesis:* The play suggests standing is impossible for humans; only mercy (or power) saves us. Philosophy wants conditions; the play shows the failure of conditions.

  8.  **Final Review against constraints:** "Don't feel you need to tie it up neatly." "Tell me where the plays ending... actually resolves the standing question, and where it just changes the subject." "If the philosophical literature and the play are pulling in different directions... say so." -> *Okay, I need to emphasize the mismatch between the philosophical desire for clean conditions of standing and the play's messy reliance on sovereign power.*

  (Proceed to generate output based on these thoughts.)
answer: |-
  This is a fantastic pairing, and you're right to feel that the play resists the neat categorization the philosophical literature often aims for. The standing-to-blame literature (Wallace, Cohen, etc.) tends to treat standing as a binary switch: you either have the moral authority to blame, or you don't, based on specific conditions (hypocrisy, partiality, etc.). *Measure for Measure* treats standing as a fluid, corruptible commodity that is inextricably linked to power, secrecy, and the impossibility of human perfection.

  Here is a scene-by-scene walkthrough of the standing problem, followed by a direct engagement with your specific stuck points and the divergence between the text and the seminar readings.

  ### Act 1: The Delegation of Standing
  **The Setup:** The Duke exits, claiming he needs to enforce the laws but fears doing so himself makes him a tyrant because he let them slide for so long. He appoints Angelo.
  **The Standing Question:** Can you delegate standing?
  **Reading:** The Duke admits he lacks the standing to enforce the laws *now* because his past negligence makes him complicit in the culture of liberty he now wants to curb. This aligns with the "complicity" condition in standing literature. However, he assumes Angelo *has* standing because Angelo is "untested."
  **The Problem:** The Duke knows human nature (he says he knows Angelo's "scope" is not fully known). By appointing Angelo, the Duke is essentially betting that Angelo's *reputation* confers standing. But as the seminar likely discusses, reputation isn't moral authority. The Duke is laundering his own lack of standing by using Angelo as a proxy. If the principal (Duke) lacks standing due to past negligence, can the agent (Angelo) possess it? The play suggests the answer is no, because the law itself has been rendered arbitrary by the Duke's neglect.

  ### Act 2: The Collapse of Angelo's Standing
  **The Setup:** Angelo sentences Claudio. Then, he propositions Isabella.
  **The Standing Question:** Is Angelo's standing shaky *before* the proposition (untested virtue) or only *after* (hypocrisy)?
  **Reading:**
  *   **Pre-Proposition:** In the philosophical literature (e.g., Wallace), a non-hypocrite has standing. Angelo hasn't broken the law *yet*. However, the play pushes a harder line: **Untested virtue is not standing.** Angelo's strictness is revealed to be a lack of opportunity, not moral strength. When he says, "It is the law, not I, condemn your brother," he is hiding behind the law to avoid moral agency.
  *   **The Proposition:** This is the moment standing evaporates. It's not just that he becomes a hypocrite; it's that he converts public authority into private leverage.
  *   **Retroactivity:** You asked if this damages the legitimacy of Claudio's sentence. Legally, no. Morally? **Yes.** The sentence was predicated on Angelo being a neutral arbiter of the law. Once he reveals himself as a violator of the very norm he enforces, the sentence is revealed not as justice, but as an exercise of power. The *validity* of the law remains (Claudio admits guilt), but the *authority* to punish is corrupted. The play treats the sentence as voidable not because Claudio is innocent, but because the judge is forfeit.

  ### Act 3: Isabella's Severity and the Duke's Manipulation
  **The Setup:** Isabella berates Claudio for begging her to sleep with Angelo. The Duke (as Friar) orchestrates the bed trick.
  **The Standing Question:** Does Isabella have standing to condemn Claudio? Does the Duke have standing to test Angelo?
  **Reading:**
  *   **Isabella:** She is savage to Claudio ("Thy sin's not accidental, but a trade"). She claims standing based on her own chastity. But this is **moral pride**, which is a standing defeater in its own right. She places herself above Claudio in the moral hierarchy. The literature often discusses "partiality," but here it's "superiority." She lacks the equal standing Wallace requires because she views herself as categorically different from the sinner.
  *   **The Duke:** He sets a trap. He arranges for Mariana to sleep with Angelo. This is **entrapment**. In legal and moral theory, if you manufacture the crime, you lose the standing to punish it. The Duke is actively creating the conditions for Angelo's sin to prove a point. He is not observing; he is directing. This severely compromises his standing to judge Angelo in Act 5. He isn't a neutral observer; he's a co-conspirator in the deception.

  ### Act 4: Barnardine and the Limits of Authority
  **The Setup:** Barnardine refuses to be executed. The Duke substitutes Ragozine's head.
  **The Standing Question:** Can the state blame/kill without the subject's recognition of authority?
  **Reading:** Barnardine says, "I am not fitted for it." He refuses to accept the state's narrative of his death. This is a radical challenge to standing: **Blame requires uptake.** If the blamed party does not recognize the authority of the blamer, the blame fails to land. The Duke recognizes this and spares him. This contrasts with Claudio, who accepted the law's authority. The Duke's decision to fake the execution (Ragozine's head) further erodes his own standing. He is now lying to Angelo, the public, and Isabella. He is building a house of cards to justify his return.

  ### Act 5: The Unmasking and the Pivot to Mercy
  **The Setup:** The Duke returns. Isabella pleads for Angelo. Marriages are decreed.
  **The Standing Question:** Does the ending resolve the standing issue or change the subject?
  **Reading:**
  *   **Isabella's Plea:** She kneels for Angelo, believing he had Claudio executed. She argues his "act did not o'ertake his bad intent."
      *   *Philosophical Note:* This is legally dubious (attempted rape/abuse of power is still a crime) but morally significant. She is shifting the metric from **consequences** to **intent**.
      *   *Standing vs. Forgiveness:* You asked if this is forgiveness doing work a standing argument would otherwise do. **Yes.** If she forgives him, she waives her right to blame. She removes herself from the equation. But she also petitions the Duke to forgive. She is arguing that **sovereign mercy** supersedes **moral standing**. She isn't arguing Angelo *has* standing; she's arguing he doesn't *need* to be held to account by human standards.
  *   **The Duke's Judgments:** He hands out marriages like sentences. He forces Angelo to marry Mariana (restoring her honor but punishing Angelo with the woman he tried to discard). He forces Lucio to marry a prostitute.
  *   **The Resolution:** The Duke does not solve the standing problem; he **overwrites** it. He reveals he knew everything all along. His standing comes not from moral purity (he lied, entrapped, and deceived) but from **sovereignty**. He is the Duke. The play ends not with a moral reconciliation where everyone has clean hands, but with a political reconciliation where the Sovereign absorbs the moral debt.

  ### Addressing Your Specific Stuck Points

  **1. Angelo: Untested Virtue vs. Actual Guilt**
  The play argues that **untested virtue is insufficient for standing.** The Duke's opening speech makes this clear: he knows the laws are dormant, and waking them requires a purity that no human possesses. Angelo's standing is *provisional* from Scene 1. The attempt on Isabella doesn't *create* the lack of standing; it *reveals* it.
  *   *Philosophical Tension:* In the literature (e.g., Cohen), we often look for a specific act of hypocrisy to undercut standing. The play suggests the *condition* of being a fallible human enforcing rigid law is itself a standing deficit. Angelo's later guilt just makes it visible.
  *   *Retroactivity:* The sentence's validity is separate from Angelo's standing, but the play conflates them. Claudio is pardoned not because the law was wrong, but because the *enforcement* was corrupted. The play suggests you cannot separate the justice of the law from the morality of the enforcer.

  **2. The Duke: Laundering or Relocating?**
  He is **relocating** the problem, and failing. He tries to launder his standing by using a disguise (Friar) to gain "spiritual" authority while retaining "political" authority. But by engineering the bed trick, he becomes morally complicit in the sexual deception he later condemns.
  *   *The Verdict:* The Duke has no moral standing to judge Angelo. He entrapped him. The only reason his judgment sticks is because he holds the sword. The play is deeply cynical here: **Standing is ultimately a function of power, not moral cleanliness.** The literature wants standing to be a moral check on power; the play shows power subsuming standing.

  **3. Isabella: Savagery to Mercy**
  Her shift is the crux of the play's theological argument.
  *   *Act 3:* She claims standing based on **purity**. She is the "blameless blamer."
  *   *Act 5:* She claims mercy based on **shared fallibility**. By kneeling, she abdicates her standing to blame.
  *   *Is it a Standing Argument?* No, it's an **anti-standing argument.** She is effectively saying, "If we insist on strict standing and strict justice, we are all condemned." Her plea ("His act did not o'ertake his bad intent") is a legal fiction she uses to grant the Duke an opening to show mercy. She knows the Duke has Claudio. She is playing the Duke. She creates a legal loophole so the Duke can exercise grace without undermining the law entirely.

  **4. The Ending: Resolution or Distraction?**
  It changes the subject.
  *   *Philosophical Expectation:* We want to know if Angelo *deserved* blame, and if the Duke *had the right* to give it.
  *   *Play's Answer:* It doesn't matter. The Duke marries them off. Lucio is punished but given a wife. Angelo is spared but bound to Mariana.
  *   *The Divergence:* The philosophical literature assumes we want to clarify the conditions of responsibility. The play assumes the conditions of responsibility are impossible for humans to meet, so we must rely on **grace** (or tyranny, depending on your read). The title *Measure for Measure* (Matthew 7:2) implies strict reciprocity. But the ending is **not** measure for measure. It is measure for *more*. Angelo deserves death; he gets marriage. Claudio deserves death; he gets life. The Duke breaks the biblical rule the title cites.
  *   *Conclusion:* The play suggests that **strict standing leads to a deadlock of universal guilt.** The only way out is for someone with absolute power (the Duke) to arbitrarily suspend the rules of standing.

  ### Where the Literature and Play Pull Apart
  If I were defending this in seminar, here is where I'd flag the tension for the students:

  1.  **The Possibility of Clean Hands:** The literature (Wallace, etc.) often operates as if it's possible to *have* standing if you avoid specific defeaters (hypocrisy, partiality). The play argues that in a fallen world, **no human has clean hands.** The Duke is a liar. Angelo is a hypocrite. Isabella is prideful. Claudio is a fornicator. If standing requires purity, no one can blame anyone.
  2.  **The Role of Sovereignty:** The literature treats standing as a moral property of agents in a community. The play treats standing as a political property of the Sovereign. The Duke's standing is restored not because he confesses his deception, but because he reveals his crown. The play suggests that **political authority can override moral deficits in standing.** This is a uncomfortable thought for moral philosophers who want authority to derive from morality.
  3.  **Forgiveness vs. Standing:** The literature treats forgiveness as a response to blame. Isabella treats forgiveness as a **replacement** for blame. She doesn't argue Angelo shouldn't be blamed; she argues he should be forgiven *despite* the blame. She sidesteps the standing question entirely by appealing to a higher economy (Grace) where standing doesn't apply.

  **Summary for your Discussion Notes:**
  Don't let the seminar smooth over the Duke's deception. The "happy ending" is built on lies (the head trick, the bed trick, the disguised Duke). If standing requires truthfulness and transparency (as some arguments imply), the Duke has the least standing of anyone. The fact that he resolves the play suggests that **standing is a luxury we can't afford.** We need mercy, or we need a tyrant. The play leaves us unsure which one the Duke is. That uncertainty is where the discussion should live.
