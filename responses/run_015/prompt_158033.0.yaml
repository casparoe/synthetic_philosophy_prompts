answer: |-
  In your vocabulary, a decision theory is a strategy for optimizing a program $P$ within a computational context. Let the policy be a function $\pi: \text{Observation} \to \text{Action}$. The "agent" is the runtime instantiation of $\pi$. The "world" is the evaluation context containing call sites, continuations, and payoff functions $U$.

  **Causal and Evidential Decision Theory (CDT/EDT)** operate at the call site. Upon receiving an observation $o$, the agent evaluates $\pi(o)$. CDT treats the return value as causally isolated from other call sites; it optimizes the local continuation given $o$. EDT treats the return value as evidence; it conditions the expected utility on the event $\pi(o) = a$, updating beliefs about other parts of the system. In both cases, the optimization happens *after* the input $o$ is bound. Semantically, this is $\beta$-reduction followed by optimization of the residual term.

  **Updateless Decision Theory (UDT)** operates at the definition site. It selects $\pi$ *before* $o$ is bound. It optimizes the function body such that for all possible inputs $o$, the application $\pi(o)$ maximizes $U$, considering that other call sites may evaluate the same $\pi$ (or a logically correlated function). In your staging vocabulary: UDT insists that specialization on $o$ must be performed by the environment (the caller), not the agent (the callee). If the agent specializes itself on $o$ (converting $\pi$ to a constant function $\lambda \_. a$), it breaks the structural sharing with other instantiations of $\pi$ that might receive different inputs or exist in counterfactual branches. UDT demands the agent remain a general function $\pi$ during deliberation, allowing the optimizer to see the global dependency graph of all potential call sites.

  **The Concrete Setting:**
  You have $N$ binaries running $P$ on separated machines. Payoff is $U(out_1, \dots, out_N)$. The agent knows $N$ and $U$, and knows all run $P$, but lacks indexical knowledge of which $i \in \{1..N\}$ it is.
  The updateless recommendation is: Optimize the source code of $P$ to maximize $U(P(1), \dots, P(N))$ at compile time. The indexical uncertainty is irrelevant to the code selection because the code is identical across all $N$. The "agent" is merely the compiler. The recommendation amounts exactly to optimizing the entire input-output graph of $P$ at compile time rather than the value returned at one call site. The "decision" is the selection of the closure; the "action" is the application.

  **Evaluating Your Identifications:**

  1.  **Updatelessness as Staging:** Vindicated. This is the strongest translation. Conditioning on evidence is partial evaluation where the observation is a static parameter. UDT forbids the agent from performing this partial evaluation on itself. It requires the agent to remain a residual program waiting for runtime input, ensuring that the "compile-time" choice of algorithm remains synchronized across all physical instantiations. If you specialize early, you fork the program identity; if you specialize late (environment does it), the shared code structure remains intact for global analysis.

  2.  **Logical Correlation as Code Identity:** Broken, or at least incomplete. In formal semantics, program equivalence is extensional (input-output behavior) or intensional (syntax). It is binary: two terms are equivalent or they are not. UDT, however, often relies on *graded* correlation between agents running similar but not identical code (e.g., one is obfuscated, or uses a different heuristic). Your vocabulary lacks a native metric for "logical similarity" distinct from equivalence. Furthermore, standard semantics does not support probabilities over logical facts (e.g., "probability that $P_1 = P_2$"). It supports probabilities over inputs, but the behavior of deterministic code is a fixed fact. To make UDT work on non-identical agents, you must import a notion of *logical uncertainty*—a probability distribution over the output of a fixed program—which is not part of standard denotational or operational semantics.

  **The Residue:**

  *   **Translates without strain:** The staging analogy. The distinction between optimizing a function definition versus optimizing a function application is precise in PL. The fixed-point construction for self-reference maps cleanly to recursive definitions and fixed-point combinators.
  *   **Translates only with imported assumptions:** The notion of "deliberation." In PL, a program does not deliberate; it executes. To say $P$ "chooses" its output table requires viewing the fixed-point constructor as an optimizer rather than a semantic rule. More critically, handling *partial similarity* requires importing logical induction or a similarity metric over program space. Standard semantics offers no handle for "these two programs are 90% likely to agree."
  *   **No expression:** Indexicality as a semantic primitive. In your $N$-binary case, the uncertainty "which binary am I?" is epistemic, not semantic. If the code is identical, the denotation is identical. The "self" is just a process ID passed as an argument. UDT treats this indexical uncertainty as driver for decision-making, but in PL semantics, if $P$ is pure, the process ID does not affect the return value unless explicitly passed. The "agent's uncertainty about its own output" is also distinct from Rice-style undecidability. Rice's theorem limits *decidability* of properties; UDT assumes we can assign *probabilities* to those properties. This is not a limit of computation, but a proposal for a new logic (logical probability) that sits outside standard computability theory.

  **Verdict:**

  The residue indicates that the central updateless notion is less well-defined than its exposition suggests, rather than your vocabulary missing notions. Your vocabulary is sufficient to describe computation, optimization, and equivalence precisely. The friction arises because UDT posits a causal structure over logical facts—counterfactuals like "If I changed my output, the other copy would change theirs"—that standard semantics does not support. In PL, if two programs are identical, their outputs are identical by definition, not by causal influence. There is no "lever" to pull on one that moves the other; there is only the shared structure.

  UDT attempts to treat logical necessity as if it were causal contingency to facilitate optimization. Your staging analogy captures the *mechanism* (compile-time vs. runtime optimization), but the *justification* relies on a semantics of logical counterfactuals that does not exist in standard formal methods. The "agent" in UDT is not a runtime process but a global optimizer over the space of possible programs. When UDT speaks of "correlation" between distinct agents, it is reaching for a metric of program similarity that formal semantics treats as binary. Thus, the difficulty is not a lack of "agency" in your vocabulary, but that UDT imports a metaphysical causal graph over mathematical truths that your formal tools correctly refuse to encode. The theory works best when agents are code-identical (where your vocabulary suffices); it becomes vague precisely when it leaves the realm of strict equivalence, pointing to a gap in the decision theory, not the programming language semantics.
