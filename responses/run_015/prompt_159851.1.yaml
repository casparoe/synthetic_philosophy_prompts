  "I make things for people who can't receive them, on the condition they do the same for me, but we never check delivery. We just verify we're both the type of idiot who ships to nowhere."

  *   **Why it works:** For laypeople, "ships to nowhere" is a funny image of futility. For the expert, it lands on the lack of causal contact (disjoint light cones) and the core mechanism of Functional Decision Theory: you aren't trading goods, you're correlating decision procedures ("the type of idiot"). The laugh comes from recognizing that "being the type" is the only enforcement mechanism available.

  **Option 2: The Simulation Incentive (Bonus)**
  "Honestly, most of my work is just trying to prove I'm boring enough to be trusted. If you're too complex to simulate, no one can run the model that proves you won't cheat on a contract you never signed."

  *   **Why it works:** The layperson hears social anxiety ("boring enough to be trusted"). The expert hears the computational complexity constraint on acausal trade: if your source code is too expensive to run, a potential partner can't simulate you to determine if you're a cooperater, so you lose trade opportunities. "Contract you never signed" nails the lack of enforcement; the only penalty is being modeled as a defector.

  **Option 3: The Heckler's Comeback**
  **Guest:** "So it's just narcissism with extra steps?"
  **Mara:** "Then I'm paying for the comfort of believing I'm not unique, which is still a valuable good."

  *   **Why it works:** The guest's joke targets the "similarity vs. correlation" objection (i.e., "you're just assuming they're like you"). Mara's retort deflects by admitting the trade good is internal ("comfort"), which is technically accurate: in acausal trade, the only value you can actually capture is the utility you manufacture in your own region (your own peace of mind) based on the logical expectation of the other side. It's defensive, dry, and theoretically sound.
