answer: |-
  **Seminar Case Study: The Janus Protocol**

  **1. The Thought Experiment**

  **Subject:** Elias Vane, 45, diagnosed with rapid-onset cortical degradation.
  **Procedure:** The Janus Protocol (Gradual Functional Migration).
  **Duration:** Six months.

  **The Setup:**
  Elias consents to an experimental neuro-prosthetic intervention. A synthetic neural lattice is implanted into his cranial vault, interfacing directly with his biological cortex. Unlike standard prosthetics, this lattice is not housed within his skull alone; it is connected via high-bandwidth wireless link to a remote synthetic chassis (an android body) kept in a nearby facility.

  **The Process:**
  Over six months, cognitive processing is gradually offloaded from biological neurons to the synthetic lattice.
  1.  **Months 1–3:** The lattice mirrors biological activity. Elias reports feeling "double-embodied." He can feel the hospital bed with his biological hands and the synthetic chair with his synthetic hands simultaneously. He is co-conscious in both loci.
  2.  **Months 4–6:** The biological brain is progressively dampened. It remains perfused, alive, and sentient (capable of feeling pain, warmth, basic awareness), but its capacity for higher-order narrative integration is suppressed pharmacologically and via interface control. It experiences the moment but cannot weave these moments into a continuing life-story.
  3.  **The Synthetic Counterpart:** The remote chassis, driven by the lattice, continues to form memories, make decisions, and integrate experiences into a coherent self-model. It speaks, writes, and interacts socially as Elias.
  4.  **Termination:** At month six, the link is severed.

  **The Outcome:**
  Two beings exist.
  *   **Biological Elias:** Still alive in the hospital bed. Conscious. However, his psychological development was interrupted at month zero. He possesses basic awareness but lacks the narrative memory of the transition. He is, psychologically, a fragment.
  *   **Synthetic Elias:** Active in the synthetic body. Possesses full, unbroken memory of the six months, including the sensation of the biological body during the overlap. He claims to be the continuation of Elias.

  **2. Theoretical Verdicts**

  **Bodily-Continuity Theory**
  *   **Survivor:** Biological Elias.
  *   **Reasoning:** Survival is grounded in the persistence of the living organism. The biological body maintained spatio-temporal continuity, metabolic function, and genetic identity throughout. The synthetic chassis is merely a sophisticated tool or a copy. The fact that the biological brain was "dampened" does not cease it from being the same human animal. As long as the biological organism lives, the person survives.

  **Psychological-Continuity Theory (Standard Lockean)**
  *   **Survivor:** Indeterminate / Neither.
  *   **Reasoning:** This theory relies on overlapping chains of memory and character. While Synthetic Elias has full continuity, Biological Elias was conscious throughout. This creates a *fission* scenario. During the overlap, one psychological stream branched into two distinct centres of consciousness. Standard psychological continuity often demands non-branching for strict identity. Since both candidates have a claim (Bio has basic consciousness continuity; Synth has narrative memory continuity), the theory struggles to identify a *unique* survivor. It may conclude that Elias ceased to exist as a unique entity at the point of fission, leaving two successors.

  **Narrative-Identity Theory**
  *   **Survivor:** Synthetic Elias.
  *   **Reasoning:** Identity is constituted by the coherence and continuity of the self-narrative—the story one tells about oneself. During the six-month overlap, the *authorship* of the life story migrated to the synthetic locus. The biological body became a passenger; it experienced qualia but did not integrate them into the 'plot'. Because the synthetic recipient holds the uninterrupted narrative thread—the commitments, relationships, and projects continued there—it is the true survivor. 'What matters' is not just having memories, but holding the pen.

  **3. The Structural Feature: Temporal Overlap and Co-Consciousness**

  The single feature driving the divergence here is the **temporal overlap of co-consciousness**.

  Because Elias was conscious in both bodies *simultaneously* during the transition, the biological body cannot be said to have simply "ended" (which would favour the synthetic copy on psychological grounds) nor did it simply "persist" (which would favour it on bodily grounds). The overlap creates a period where the 'self' was distributed.

  This feature allows Narrative Identity to split away from the other two:
  *   It defeats **Bodily Continuity** by showing that the body can persist while the *person* (the narrator) leaves it.
  *   It complicates **Psychological Continuity** by creating branching (fission), rendering the verdict indeterminate under standard criteria.
  *   It empowers **Narrative Identity** to select the synthetic recipient based on *where the story went*, rather than just where the memories or the flesh went. The overlap proves the narrative thread was transferable without breaking, even while the biological substrate remained active.

  **4. Counterfactual: Removing the Feature**

  If you remove the overlap—for example, if Elias is placed under general anaesthesia for the six months while the transfer occurs, or if the transfer is instantaneous—the case collapses.

  *   **Scenario:** Elias is unconscious. Biological body wakes up with a gap. Synthetic body wakes up with a gap (or claims continuity).
  *   **Result:** This becomes a standard Parfit-style teleportation case.
  *   **Impact:** Without the co-conscious overlap, there is no period of distributed authorship. The Biological body now has a clear psychological break (amnesia). The Synthetic body has a claim based on copied data.
  *   **Theories:**
      *   Bodily: Still Bio.
      *   Psychological: Likely Synth (if we ignore branching) or Neither (if we count the break as death).
      *   Narrative: Synth.
  *   **Collapse:** The unique leverage of the Janus Protocol is lost. We return to the standard debate: is a copy with memories the same as the original? The specific isolation of *narrative authority* versus *biological persistence* is blurred because the biological candidate now also lacks psychological continuity. The overlap was necessary to keep the biological candidate *conscious* (satisfying bodily intuitions) while stripping it of *narrative authority* (satisfying narrative intuitions).

  **5. Critique and Vulnerability**

  **The Bodily-Continuity Defence:**
  A defender of bodily continuity would attack the coherence of the "narrative migration." They would argue that consciousness is a biological phenomenon. If the biological brain was conscious during the six months, *it* was Elias. The synthetic entity is a philosophical zombie or a distinct being with delusions of identity. They would argue that "narrative" is a post-hoc description, not a metaphysical constituent. You cannot separate the "story" from the "storyteller" (the organism). To them, the Janus Protocol doesn't move the person; it creates a duplicate and leaves the original in a damaged state.

  **Does removing the feature collapse it to Parfit?**
  Yes. If the transfer happens while the patient is unconscious (or if the biological brain is destroyed at the end), the scenario becomes structurally identical to Parfit's Teleporter.
  *   In Parfit's case, the original is destroyed. Here, the original lives.
  *   However, if you remove the *overlap* (making it a switch rather than a migration), the biological body wakes up with a gap. This makes it a "fission without overlap" case.
  *   The specific tension of the Janus Protocol—that the original is *right there*, conscious, yet intuitively not the 'main character' anymore—relies entirely on the gradual, co-conscious handover. Without that, you simply have a copy and a damaged original, which is a standard problem in the literature. The Janus Protocol's value is in forcing us to admit that 'what matters' might follow the narrative thread even when the biological light is still on.
