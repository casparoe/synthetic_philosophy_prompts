  2.  **Deconstruct the Philosophical Problem:**
      *   **Strawson's Core Idea:** Reactive attitudes are responses to the *quality of will* (goodwill, ill will, indifference) manifested by agents toward us (personal) or others (vicarious/indignation). They presuppose participation in a moral community of mutually accountable agents.
      *   **Tension Points in User's Cases:**
          *   *Collectives:* Can a corporation have a "quality of will"? (Case 2)
          *   *Excuses/Exemptions:* Blackmail is an excuse (Case 3).
          *   *Self-Resentment:* Strawson focuses on *interpersonal* attitudes. Self-reactive attitudes (guilt, shame) are analogues. Resentment toward a *past* self is tricky because the "community" is diachronic. (Case 4)
          *   *AI/Systems:* Can non-humans have quality of will? (Case 5)
          *   *Political/Democratic:* Is voting a participatory act of will comparable to individual action? Is the resentment interpersonal or political/impersonal? (Case 6)

  3.  **Drafting the Principle:**
      *   I need a principle that captures the *fittingness* conditions.
      *   *Candidate:* **The Reciprocal Accountability Principle.**
      *   *Clauses:*
          1.  **Agency:** The target must be capable of understanding moral demands. (Motivated by AV case).
          2.  **Quality of Will:** The action must reflect a choice/attitude (ill will/indifference), not just causal harm. (Motivated by Blackmail case).
          3.  **Membership:** The target must be a member of the moral community relevant to the attitude holder. (Motivated by Collective/Corporate case).
          4.  **Identity:** The target must be continuous with the agent of the act. (Motivated by Past Self case).

  4.  **Testing the Principle against Cases:**
      *   *Colleague:* Fits all clauses. (Fitting).
