      *   *AV with Learning:* Strict Strawsonism says no fittingness because no *moral* capacity. The user's intuition says "something like resentment." The principle must admit this is a *quasi*-reactive attitude, not genuinely fitting.

  7.  **Developing the Prediction (Animal Case):**
      *   If the principle requires *reciprocal* accountability, animals fail (they can't understand moral demands).
      *   Therefore, we cannot feel *indignation on behalf of an animal* in the strict Strawsonian sense (which requires the victim to be a member of the moral community).
      *   However, we feel *sympathy* or *protective anger*.
      *   *Prediction:* The principle verdicts that genuine Strawsonian indignation is *not* fitting, though a protective analogue is.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the depth of the inquiry.
      *   **The Principle:** State "The Principle of Reciprocal Moral Address." Define clauses clearly.
      *   **Mapping Cases:** Show how clauses map to the user's examples (Colleague, Friend, AV, Corp).
      *   **The Prediction:** Apply to the Animal case.
      *   **The Failures (Crucial Step):** Explicitly identify where the principle breaks down or requires modification (Past Self, Democratic Voting).
      *   **Conclusion:** Unified account vs. Family Resemblance.

  9.  **Refining the Democratic Voting Analysis:**
      *   This is the specific "reversing" case the user mentioned.
      *   *Option A:* It is fitting resentment. (Implies voters are directly accountable to the minority as individuals).
      *   *Option B:* It is political indignation. (Impersonal).
      *   *Strawsonian View:* Reactive attitudes bind the moral community. If the voters exclude the minority from the community, they violate the precondition of the attitude.
      *   *Decision:* I will argue the principle suggests this is *not* standard interpersonal resentment but a hybrid political-moral response, because the reciprocal link is severed by the vote itself.

  10. **Refining the Past Self Analysis:**
      *   Strawson separates resentment (toward others) from guilt/remorse (toward self).
      *   User feels *resentment* toward past self.
      *   Principle based on *interpersonal* address cannot fully accommodate *self*-resentment without blurring Strawson's distinction. I need to be honest about this limitation.

  11. **Final Review against Constraints:**
