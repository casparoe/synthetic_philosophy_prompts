      *   *Friend:* Clause 2 handles this (coercion negates quality of will). (Fitting that resentment dissolves).
      *   *Past Self:* Clause 4 is the stress point. Psychological continuity allows for self-reactive attitudes, but *resentment* is specifically interpersonal in Strawson. This is a known tension in the literature (self-reactive vs. personal reactive attitudes).
      *   *AV:* Clause 1 handles standard AV. The "adaptive learning" case pushes Clause 1. If it *simulates* will without *having* will, is it fitting? Strawson would say no (it's an objective attitude). The user says they *feel* something like resentment. The principle should distinguish *felt* from *fitting*.
      *   *Democratic Voting:* This is the hardest. Is it interpersonal? Or is it a structural injustice?

  5.  **Refining the Principle for Precision:**
      Let's try to formulate **The Principle of Mutual Moral Address**.
      *   *Condition 1 (Capacity):* Target must possess the capacity to recognize and respond to moral reasons. (Excludes standard AVs, includes Executives).
      *   *Condition 2 (Volition):* The harmful outcome must stem from a voluntary expression of will (ill will or indifference), not coercion or ignorance. (Excludes Blackmailed Friend).
      *   *Condition 3 (Community):* Target and Attitude-Holder must stand in a relationship of reciprocal accountability. (Handles Colleague, raises questions on Corporation and Democracy).
      *   *Condition 4 (Diachronic Identity):* For self-directed attitudes, psychological continuity must suffice for accountability. (Handles Past Self).

  6.  **Addressing the "Cannot Accommodate" Requirement:**
      *   *Past Self:* Strawson distinguishes *personal* reactive attitudes (resentment) from *self*-reactive attitudes (guilt). Resenting a past self is a category mistake in strict Strawsonian terms, though psychologically real. The principle might struggle to justify *resentment* specifically, rather than *guilt*.
