          3.  *Blackmailed Friend:* Resentment dissolves into sympathy (Quality of will matters, not just harm).
          4.  *Past Self:* Sustained resentment toward past self (Temporal identity/ownership matters), but not toward a stranger making the same choice.
          5.  *Autonomous Vehicle (AV):* No resentment for malfunction. Resentment-like feeling if adaptive learning prioritized speed over safety (System vs. Designers).
          6.  *Democratic Voting (The "Reversing" Case):* Citizens voting to deprive minorities of rights. Is this interpersonal resentment or a different kind of moral response?
