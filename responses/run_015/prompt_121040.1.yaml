      *   Indicate motivating cases? Yes.
      *   Predict animal case? Yes.
      *   Explicit about failures (Past Self, Democracy)? Yes.
      *   Address Unified vs. Family Resemblance? Yes.

      *(Self-Correction during drafting)*: Make sure not to be too dogmatic. Strawson's framework is interpretive. I should present the principle as the *best reconstruction* of Strawsonian logic, while highlighting where the user's intuitions (which are philosophically sophisticated) press against the boundaries of that logic. The "Past Self" case is particularly notorious in the literature (e.g., MacIntyre, Schechtman). The "Democratic" case touches on structural injustice (Young). I should reference these tensions implicitly.

