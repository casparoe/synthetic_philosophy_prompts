prompt: |-
  I'm part of this local group in a town that was literally built in 1978 around a factory. We started doing this autumn festival about ten years ago — it's a mix of old farming songs and a "blessing of the soil" thing our organizer pulled from a 1923 ethnography that later turnes out to be half fabricated. Now there's a fight: some people say only familes who lived here before 1990 can lead the ceremony, because they're the "real" community, and newcomers are just cosplaying heritage. I feel like that's wrong but I can't say why — the whole thing is obviously recent, yet it feels genuinely ours. Is there a principled way to decide who belongs without pretending we have ancient roots? Or is authenticity basically just shared belief?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Context:** A town built in 1978 around a factory (very new, industrial origin).
      *   **Tradition:** An autumn festival started ~10 years ago (around 2013/2014).
      *   **Content:** Mix of old farming songs + a "blessing of the soil" ritual based on a 1923 ethnography (later found to be half-fabricated).
      *   **Conflict:** A faction wants to restrict leadership of the ceremony to families present before 1990 ("real" community vs. "cosplaying" newcomers).
      *   **User's Intuition:** Feels wrong to exclude newcomers, but struggles to articulate why given the tradition's recent and somewhat artificial origins.
      *   **Core Question:** Is there a principled way to decide belonging without faking ancient roots? Or is authenticity just shared belief?

  2.  **Deconstruct the Core Concepts:**
      *   **Authenticity:** The user is grappling with the definition of authenticity. Is it historical continuity? Is it sincerity? Is it community consensus?
      *   **Invented Tradition:** This is a classic sociological concept (Hobsbawm & Ranger). All traditions are "invented" at some point. The key is *why* and *how* they function now.
      *   **Community Boundaries:** Who gets to define the "we"? Is it based on tenure (time) or participation (action)?
      *   **The "1990" Cutoff:** Why 1990? It's arbitrary. The town started in 1978. 1990 is only 12 years later. It's not "founding fathers" status, it's just "early adopters."

  3.  **Formulate the Argument:**
      *   *Validate the User:* Acknowledge that their intuition is correct. Exclusion based on tenure in a 10-year-old tradition within a 45-year-old town is logically inconsistent.
      *   *Address "Invented Tradition":* Explain that *all* traditions are made up. The fact that the 1923 source was fabricated doesn't matter as much as the meaning the community *now* assigns to it.
      *   *Define "Authenticity":* Shift the definition from "historical accuracy" to "sincere participation" and "stewardship."
      *   *Address the Conflict:* The 1990 cutoff is a power grab disguised as heritage protection. It's gatekeeping.
      *   *Propose a Principled Framework:* How to decide who belongs?
          *   Commitment to the future, not just presence in the past.
          *   Contribution to the ritual's vitality.
          *   Inclusivity as a value of the ritual itself (harvest/soil is usually about abundance/sharing).
      *   *Answer the Final Question:* Authenticity isn't *just* shared belief, but it *is* shared practice and intent.

  4.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the feeling. It *is* wrong. The logic doesn't hold up.
      *   *Concept 1: The "Invented Tradition":* Reference Hobsbawm. Point out that 10 years is enough time for a tradition to take root. The 1978 origin story is the *real* history, not the fake 1923 one.
      *   *Concept 2: The 1990 Cutoff:* Expose the arbitrariness. 1990 isn't "ancient." It's just "earlier." Excluding people who have lived there for 5+ years (if the festival is 10 years old) is divisive.
      *   *Concept 3: Redefining Authenticity:* Move from "Origins" to "Function." Does the ritual bring people together? Does it care for the town? If so, it's authentic *now*.
      *   *Concept 4: Stewardship vs. Ownership:* Leaders shouldn't "own" the tradition; they should serve it. Exclusion kills traditions.
      *   *Actionable Advice:* How to argue this in the meeting? Focus on the *purpose* of the festival. Is it to honor the past or build the future?
      *   *Philosophical Conclusion:* Authenticity is a verb, not a noun. It's what you *do*.

  5.  **Refining the Tone:**
      *   Needs to be empathetic but analytical.
      *   Avoid academic jargon where possible, but use the right concepts (invented tradition, social capital).
      *   Be firm on the ethics: Exclusion is harmful.
      *   Acknowledge the emotional weight: People *feel* attached to this, even if the history is shaky. Don't dismiss their feelings, just reframe them.

  6.  **Self-Correction/Nuance Check:**
      *   *Wait, is the 1923 fabrication important?* Yes, it undermines the "historical purity" argument. If the source is fake, claiming "historical accuracy" is impossible.
      *   *Is the 1990 date significant?* Maybe the factory changed ownership? Or the first generation retired? Even so, for a 10-year-old festival, it's irrelevant.
      *   *Don't be too harsh on the "old timers".* They probably feel displaced by gentrification or change. Acknowledge their fear of loss, but argue that inclusion is the only way to preserve the tradition.

  7.  **Final Polish:** Structure with clear headings. Ensure the "principled way" question is directly answered. (The resulting output matches the detailed response provided previously.)
answer: |-
  This is a fascinating and deeply human problem. You are grappling with what sociologists call **"invented tradition,"** and you have stumbled upon a conflict that towns, nations, and religious groups have faced for centuries.

  Your intuition is correct: excluding newcomers from a ten-year-old tradition in a forty-five-year-old town based on a fabricated 1923 ritual is logically inconsistent. However, telling people "this is fake so you can't gatekeep it" will likely backfire. People aren't fighting over facts; they are fighting over **belonging.**

  Here is a principled way to navigate this, grounded in how traditions actually work, without pretending you have ancient roots.

  ### 1. Reframe "Authenticity" as Stewardship, Not Origin
  The faction demanding the 1990 cutoff is operating under **Provenance Authenticity**. They believe value comes from the *source* (old families, old texts, old dates).

  You should argue for **Functional Authenticity**. In this view, a tradition is authentic if it successfully performs its social function *now*.
  *   **The Argument:** "The purpose of this festival is to bind the community together and honor the land we live on. If we exclude neighbors who have lived here for 5, 10, or 20 years, we are actively breaking the community bonds the festival is supposed to strengthen. A ritual that divides us is failing its function."
  *   **The Principle:** Authenticity is not about where the ritual *came from*; it is about what the ritual *does*. If it creates genuine connection, it is real.

  ### 2. Expose the Arbitrariness (Gently)
  The town was built in 1978. The festival started roughly 2013.
  *   The "1990 cutoff" group is claiming "founder status" for people who arrived up to 12 years *after* the town was built.
  *   They are claiming "heritage authority" over a festival that didn't exist when they arrived.

  You don't need to mock this. You just need to point out that **everyone in that room is a participant in a new tradition.** The people who started the festival 10 years ago were once "newcomers" to the town. If they had been excluded by the 1990 group, the festival wouldn't exist.
  *   **The Principle:** Precedent. If the founders of the festival (10 years ago) had been excluded by the "pre-1990" rule, we wouldn't be here. Therefore, the rule contradicts the existence of the event itself.

  ### 3. Address the "Fabricated" Ethnography
  The fact that the 1923 source was half-fabricated is actually your strongest philosophical tool. It proves that **meaning is made, not found.**
  *   The organizer in 2013 took a text, found meaning in it, and built a ritual that resonated with people. That act of *making meaning* is the heritage, not the 1923 text itself.
  *   **The Argument:** "Our heritage isn't the 1923 book. Our heritage is the act of coming together for the last decade to care about this town. The 'blessing of the soil' is real because we believe in caring for this town, not because a guy in 1923 wrote it down."

  ### 4. Propose a "Stewardship Model" of Leadership
  Instead of leadership based on *tenure* (how long you've been here), propose leadership based on *contribution* (what you do for the festival).
  *   **The Problem:** The "pre-1990" group wants ownership.
  *   **The Solution:** Shift to stewardship. No one owns the festival; everyone serves it.
  *   **The Criteria:** Anyone who has volunteered X hours, or attended Y years, or helped organize Z event is eligible to lead. This rewards **commitment**, which is a virtue, rather than **residency date**, which is an accident of history.

  ### 5. Answering Your Final Question
  > *Is authenticity basically just shared belief?*

  It is **shared belief enacted through shared practice.**

  If you believe the soil is blessed, and you gather to honor it, the blessing is sociologically real. It affects how you treat the land and each other. The "pre-1990" group is trying to turn a living practice into a museum exhibit. Museums preserve dead things; festivals celebrate living ones.

  **A Principled Statement for Your Group:**
  You might say something like this at the next meeting:

  > "We are not a 300-year-old village. We are a town built in 1978 that decided, ten years ago, to start caring about our shared space in a new way. That decision is our real history.
  >
  > If we say only people from 1990 can lead, we are lying about our own history. We are pretending this festival is older than it is, and that some of us are more 'native' than others.
  >
  > The only way to honor the last ten years is to ensure there is a festival in ten more years. Traditions die when they stop accepting new blood. If we want this to be 'ours,' we have to let 'us' include everyone who is willing to do the work."

  ### Summary
  You don't need ancient roots to have deep ones. Trees planted in 1978 have roots now.
  *   **Don't** argue that the history doesn't matter.
  *   **Do** argue that the *continuation* of the tradition matters more than the *purity* of the participants.
  *   **Do** argue that exclusion is the fastest way to kill a young tradition.

  The "pre-1990" group is afraid of losing their identity. The best way to reassure them is to show that including newcomers doesn't dilute the tradition; it secures its future. Authenticity is a verb. It's what you *do*, not when you *arrived*.
