answer: |-
  Here is the plan. It is designed to be drawn and spoken in 45 minutes using only the whiteboard and the vial.

  ### 1. The Board Layout & Epistemic Placement

  Draw three vertical columns on the board. Do not title them yet.

  **Column 1 (Left): "The Input"**
  **Column 2 (Middle): "The Dimensions"**
  **Column 3 (Right): "The Trade-Off"**

  **Where the Epistemic Stuff Goes:**
  Put the UK Law, the 2024 Statement, and the "Other Minds" problem in **Column 1**, immediately.
  *   **Why:** If you save it for last, the PI and the skeptics will spend the whole session thinking, "But are they *really* conscious?" and miss your point about dimensions. If you lead with it as a *conclusion*, the room polarizes.
  *   **How:** Frame it as a **working premise**, not a verdict.
  *   **Script:** "We are not solving the hard problem of consciousness today. We are taking the 2024 consensus statement as our *working input*: there is a non-negligible chance insects are sentient. UK law currently draws the line at cephalopods/crustaceans, not insects. For the next 40 minutes, assume the 2024 statement is right. If they have *some* status, how do we measure it? If the premise is wrong, this session costs you nothing but 45 minutes. If it's right, we need better math."
  *   **Action:** Write "2024 Consensus: Real Chance" and "UK Law: Vertebrates + Cephalopods/Crustaceans" in Column 1. Draw a box around them labeled **"Assume True for Argument."**

  ### 2. The One Example

  **The Carrier:** The vial of flies on the bench.
  **The Comparison:** The vial on the bench (Room Temp) vs. The vial in the incubator (4°C) vs. A mouse in a trap.

  **Why this combination:**
  *   **Vial (Room Temp) vs. Vial (Cold):** This isolates the **Rate** dimension. It controls for brain size, phylogeny, and intensity capacity. It forces them to see that "one minute of clock time" contains different amounts of "experience time."
  *   **Vial vs. Mouse:** This isolates the **Intensity** and **Unity** dimensions.

  **What the example must have:**
  1.  **Intensity:** The mouse in the trap has high-intensity valenced states (panic, pain). The fly has lower intensity (assumed).
  2.  **Rate (Frame Rate):** The room-temp fly processes sensory data faster than the cold fly. The cold fly is "lagging."
  3.  **Unity:** The mouse likely has a continuous narrative self over its 2-year life. The fly (6 weeks) may be a sequence of disjointed "nows."

  **What it must not have:**
  *   **Do not use the Robot/Laptop:** It invites the "it's just code" dismissal and wastes 15 minutes on AI philosophy.
  *   **Do not use the Boiled Lobster:** It triggers visceral disgust which shuts down analysis.
  *   **Do not use the Thermostat:** It invites the "slippery slope" argument too early.

  **How to run it (Minutes 5–20):**
  1.  Hold up the vial. "This is Room Temp. It is moving."
  2.  Point to the incubator. "That is 4°C. It is torpid."
  3.  **Ask:** "If I leave both for 10 minutes of *clock time*, which contains more moments of experience?"
      *   *Goal:* Get them to agree the Room Temp fly is running at a higher frame rate.
      *   *Board:* In Column 2, write **"1. Temporal Density (Frames/Min)."**
  4.  **Ask:** "If I pinch the mouse vs. swat the fly, which has higher peak intensity?"
      *   *Board:* In Column 2, write **"2. Valence Intensity."**
  5.  **Ask:** "Does the fly at Day 10 know it's the same subject as Day 1? Does the mouse?"
      *   *Board:* In Column 2, write **"3. Subject Unity (Narrative Self)."**
  6.  **The Pivot:** "The Cold Fly has low Density. The Mouse has high Intensity. The Room Temp Fly has... what? If I ask 'Which is worse?', you have to pick which dimension matters more. There is no single axis."

  ### 3. Misconceptions & Cut-Off Points

  Do not debate these. Label them, park them, and move on.

  **1. "Nociception is Pain" (The Behaviorist Objection)**
  *   **When:** During Dimension 2 (Intensity).
  *   **Cut-off:** "Nociception is the circuit; pain is the experience. We are assuming the 2024 statement is right (Column 1). If we assume the circuit produces experience, does the *amount* of experience reduce to the circuit complexity? No, because of the Cold Fly. A cold circuit processes slower. Move on."

  **2. "Slippery Slope / Fungi" (The Absurdity Objection)**
  *   **When:** Immediately after introducing Dimensions.
  *   **Cut-off:** "Complexity is not a slope, it's a threshold. We are discussing animals with nervous systems. A thermostat has no 'frame rate' to slow down. We are not talking about rocks. Next."

  **3. "Brain Size / Evolutionary Tree" (The Proxy Objection)**
  *   **When:** During Dimension 3 (Unity).
  *   **Cut-off:** "Brain size might predict capacity, but it doesn't tell us how the dimensions weight against each other. A bigger brain doesn't tell me if 'Intensity' outweighs 'Density.' That's a moral question, not an anatomical one."

  **4. The PI's Objection: "Policy Needs a Cutoff"**
  *   **When:** Column 3 (The Trade-Off).
  *   **Cut-off:** **Validate, then isolate.** "You are right. *Policy* requires a binary decision (approve/deny). *Ontology* (what is actually happening) does not. We can acknowledge the reality is a partial ordering while still drawing a line for the IACUC. But we must admit the line is arbitrary, not discovered. Don't confuse the map for the territory."

  **5. The Rotation Student's Objection: "No Line = Murder"**
  *   **When:** Immediately after the PI.
  *   **Cut-off:** **Mirror the PI.** "If the moral status is multidimensional, 'murder' implies violating a single scalar right. If there is no single scalar, 'murder' is the wrong category. It's not that everything is forbidden; it's that the trade-off calculation is broken. You can't sum the variables."

  ### 4. The Closing Question

  **Time:** Minute 40.
  **Action:** Erase Column 3. Write: **"1 Mouse = _____ Flies."**

  **The Instruction:**
  "Based on the three dimensions we just drew—Intensity, Density, Unity—write down the number that goes in that blank. You have 30 seconds."

  **The Follow-up (The Test):**
  When they hesitate or laugh or write "?":
  "If you understood the session, you cannot write a number. If you write '100', you have collapsed Density into Intensity. If you write '0', you ignored Column 1. The correct answer is 'The equation is malformed.' If you walk out thinking we just need better data to find that number, I failed. The point is that the number does not exist."

  ### 5. What to Decline to Settle

  You must explicitly state what you are *not* doing, or they will think you are being evasive.

  **Say this at Minute 42:**
  "I am not going to tell you whether to use flies or mice. I am not going to tell you if the 2024 statement is definitely true. And I am not going to give you a new protocol."

  **Why:**
  "My job was not to solve the policy problem. My job was to show you that the *tool* you were using to solve it (a single scale of moral worth) is broken. You can still go to lunch. You can still run your protocols. But when you fill out the ethics form, don't pretend the math is simpler than it is."

  **Final Board State:**
  *   **Left:** Assumptions (Consciousness is possible).
  *   **Middle:** 3 Dimensions (Intensity, Density, Unity).
  *   **Right:** "1 Mouse = ___ Flies" (Crossed out).

  **End of Session.**
