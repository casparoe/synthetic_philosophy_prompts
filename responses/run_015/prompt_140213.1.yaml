  5.  **Self-Correction/Review against Constraints:**
      *   *User Warning:* "Don't explain the philosophy to me." -> Keep instructions actionable. "Write this," "Say this."
      *   *Tone:* Pragmatic, lab-focused, respectful of the PI's position but firm on the logic.
      *   *Epistemic Placement:* I need to be sure about where the UK Law/2024 statement goes. If I put it first, does it hijack the room?
      *   *Decision:* Put it first but frame it as "The Starting Assumption." If we assume *some* moral status exists, *how do we measure it?* This bypasses the "are they conscious?" debate which stalls everything.
      *   *The Example:* The "Cold Fly" is the strongest lever for the "Frame Rate" argument. I need to make sure the "Unity" argument lands. Maybe use the "reset" button idea (memory wipe).
      *   *Misconceptions:* The PI's objection is the most dangerous. If I dismiss it, I lose the room. I must validate it ("You are right for policy") while undermining it ("But that doesn't make the underlying reality a scalar").

  6.  **Final Polish:** Check the specific questions asked in the prompt.
      *   1. Board order/Epistemic stuff.
      *   2. The One Example.
      *   3. Misconceptions order/cut-off.
      *   4. Closing question.
      *   5. What to decline.

      *Let's tighten the "Example" section.* The prompt asks for *one* example that carries the whole thing. The "Cold Fly vs. Mouse" is good, but I need to make sure the *Unity* dimension is clear.
      *Revised Example:* **The Vial on the Bench (Warm/Active) vs. The Vial in the Fridge (Cold/Torpid) vs. The Mouse in the Trap.**
      *   *Intensity:* Mouse trap > Fly swat.
      *   *Rate:* Warm Fly > Cold Fly (per clock minute).
      *   *Unity:* Mouse > Fly (likely).
      *   *Why this works:* It uses the prop (vial). It creates a 3-way split where no single entity is "highest" on all three axes. (Mouse wins Intensity/Unity, Warm Fly wins Rate over Cold Fly, Cold Fly loses on Rate). Actually, to show *incommensurability*, I need a case where A > B on one axis, but B > A on another.
      *   *Better:* **The Cold Fly vs. The Warm Fly.**
          *   Same organism type (controls for phylogeny/brain size).
          *   Different states.
          *   If I kill a cold fly vs. a warm fly, have I done the same amount of harm?
          *   Intensity: Similar?
          *   Rate: Warm > Cold.
          *   Unity: Similar?
          *   *Wait, I need to compare Fly to Mouse to show the "How many flies = 1 mouse" problem.*
          *   *Okay, stick to the User's instinct:* **One Mouse's Bad 5 Minutes vs. One Fly's Afternoon in the Cold Room.**
          *   *Why:* It highlights the *Time/Rate* dimension specifically.
          *   *Add Unity:* Mention the fly's lifespan vs. mouse's lifespan.
          *   *Add Intensity:* Mention the nature of the suffering.
          *   *Decision:* I will instruct the user to use **The Vial (Cold vs. Warm)** to illustrate the *internal* dimensions of the fly, and **The Mouse** only as the contrast for the "Exchange Rate" problem. This keeps the focus on the fly (their work) while addressing the grant (the mouse comparison).

      *Let's re-read the prompt on the Example:* "It should be something they're already holding or looking at (there is literally a vial of flies on the bench)."
      *Okay, the example MUST center the vial.*
      *Scenario:* **The Vial on the Bench (Room Temp) vs. The Vial in the Incubator (4°C).**
      *   *Dimension 1 (Intensity):* Assume similar capacity for pain.
      *   *Dimension 2 (Rate):* Room temp fly processes faster. More "moments" per minute.
