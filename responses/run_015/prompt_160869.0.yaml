      *   **Task:** Define the *specifications* (requirements) for a theory of consciousness suitable for regulatory/policy use (not abstract metaphysics).
      *   **Specific Inputs:** The user provides six specific "breakdown points" (Anchoring, Discordance, Ersatz-Flexibility, Split/Interrupted Subject, Distinction Collapses, Numbers/Uncertainty).
      *   **Specific Outputs:**
          1.  Turn the breakdown points into requirements (or reject them if they are bad demands).
          2.  Mark requirements as Non-Negotiable vs. Preference/Camp-Specific.
          3.  Flag any internal inconsistencies among requirements.
          4.  Identify the single requirement that knocks out the most theories.
          5.  Provide a brief scorecard for four broad styles of view (Structure-First, Behavioral/Marker, Functional/Organizational, Pluralist/Weight-of-Evidence).
      *   **Constraints:** No bibliography, no citations, argumentative tone ("arguments I can put to people across a table"), focus on adequacy for regulation.

  2.  **Deconstruct the Six Breakdown Points (Requirements Formulation):**

      *   *Anchoring Dilemma:* Human self-report is the only ground truth, but human hardware is specific. *Requirement:* The theory must provide a *translational bridge* that justifies extrapolating from human report to non-human non-reporters without relying solely on structural homology.
      *   *Discordance Problem:* Markers conflict (behavior vs. physiology vs. neural). *Requirement:* The theory must specify a *decision rule* for conflicting evidence (hierarchy, veto power, or weighting), not just a checklist.
      *   *Ersatz-Flexibility Control:* Simple systems mimic complex behaviors (slime moulds, RL agents). *Requirement:* The theory must distinguish *mechanism* from *output*, ruling out functional mimicry by non-sentient systems.
      *   *Split/Interrupted Subject:* Colonial organisms, metamorphosis, sleep/hibernation. *Requirement:* The theory must define the *unit* and *temporal boundary* of the subject (individuation conditions).
      *   *Distinction Collapses:* Conscious vs. Conscious of X vs. Degree vs. Moral Weight. *Requirement:* The theory must separate *ontological status* (is it sentient?) from *moral weighting* (how much does it count?), preventing category errors in policy.
      *   *The Numbers:* High uncertainty + huge populations (insects). *Requirement:* The theory must be *actionable under uncertainty* (provide a decision threshold or precautionary principle integration), not just a probability estimate.

  3.  **Evaluate Requirements (Non-Negotiable vs. Preference):**
      *   *Anchoring:* Non-negotiable. Without this, you have no calibration.
      *   *Discordance:* Non-negotiable. Regulators need a Yes/No, not "well, it depends."
      *   *Ersatz:* Non-negotiable. Otherwise, you protect thermostats or include plants.
      *   *Split/Interrupted:* Non-negotiable for law. You need to know *what* you are protecting.
      *   *Distinctions:* Non-negotiable. Law needs to know if it's banning pain or banning killing.
      *   *Numbers:* This is tricky. Is it a requirement of the *theory* or the *policy*? The user asks if it's smuggling in decision theory. I should argue it *is* a requirement for a regulatory theory, even if metaphysics doesn't care. Let's call it Non-Negotiable for *this purpose*.

  4.  **Check for Internal Inconsistencies:**
      *   *Tension:* "Anchoring" (rely on human hardware) vs. "Ersatz" (don't rely on specific outputs/hardware).
      *   *Tension:* "Discordance" (need a clear decision rule) vs. "Numbers/Uncertainty" (science is uncertain).
      *   *Biggest Conflict:* The demand for *certainty/clear decision rules* (Discordance) clashes with the biological reality of *gradient/uncertain evidence* (Numbers). A theory that is precise enough to satisfy regulators often lacks the biological nuance to be true, and vice versa.
      *   *Resolution:* The "Decision Rule" requirement usually forces a simplification that violates the "Translational Bridge" requirement's nuance.

  5.  **Identify the "Killer" Requirement:**
      *   Which one kills the most theories?
      *   *Structure-First* fails Anchoring (can't extrapolate from human brain to insect brain).
      *   *Behavior-First* fails Ersatz (can't distinguish mimicry).
      *   *Functional-First* fails Split/Interrupted (hard to define boundaries).
      *   *Pluralist* fails Discordance (no decision rule).
      *   *Winner:* The **Discordance/Decision Rule** requirement. Most theories describe *indicators*, not *adjudication procedures*. They say "look for X," not "If you have X but not Y, do what?"

  6.  **Drafting the Scorecard (Four Styles):**
      *   *Structure-First (Neuroanatomy):* Good on Anchoring (homology), bad on Ersatz (convergent evolution). Fails hardest on Anchoring for invertebrates (different hardware).
      *   *Behavioral/Marker:* Good on practicality, bad on Ersatz (false positives). Fails hardest on Ersatz.
      *   *Functional/Organizational (GWT, etc.):* Good on Mechanism, bad on Split/Interrupted (where is the workspace?). Fails hardest on Split/Interrupted.
      *   *Pluralist/Weight-of-Evidence:* Good on nuance, bad on Discordance (no tie-breaker). Fails hardest on Discordance.

  7.  **Refining the Tone:**
      *   Needs to be sharp, analytical, slightly provocative ("see how they squirm").
      *   Avoid academic hedging.
      *   Focus on the regulatory utility.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "Numbers" point correctly? The user asks if it's a legitimate desideratum. I need to confirm it is, because a theory that yields "51% chance" for 10 quintillion insects paralyzes policy.
      *   *Check:* Did I distinguish between "Consciousness" and "Moral Weight"? Yes, crucial for the "Distinction" point.
      *   *Check:* Ensure I explicitly state which requirements are non-negotiable vs. preferences. Actually, looking closely, some *are* preferences dressed up. For example, demanding a specific *type* of decision rule (hierarchy vs. weighting) might be a preference, but demanding *a* rule is non-negotiable. I will clarify this distinction.
      *   *Check:* The "Anchoring" requirement. Is it possible to satisfy? It's the hardest. I need to be clear that most theories fail here.
      *   *Check:* The "Inconsistency" section. I need to be bold. The inconsistency lies between the need for binary legal categories and the continuous nature of biological evidence.

  9.  **Final Polish:**
      *   Ensure the "Killer Requirement" is clearly identified.
      *   Ensure the Scorecard is brief and punchy.
      *   Make sure the "Non-negotiable vs. Preference" distinction is clear in the requirements section.

  *(Self-Correction on "Preferences"):* Actually, looking at the user's prompt, they want me to tell them *if* any of their cases are bad demands.
  *   *Anchoring:* Valid demand.
