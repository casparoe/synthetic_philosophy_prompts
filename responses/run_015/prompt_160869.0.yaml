answer: |-
  Here is the specification list you requested, stripped of metaphysical padding and tuned for regulatory adequacy. I have treated your six breakdown points as the raw material for the requirements, filtering out where a specific disciplinary bias is masquerading as a universal constraint.

  ### The Specifications for a Regulatory Theory of Sentience

  **1. The Translational Bridge (Anchoring)**
  *   **Requirement:** The theory must specify a mapping function that allows calibration on human self-report to be projected onto non-human architectures without requiring structural homology. It cannot simply say "look for human-like brains"; it must explain *why* a specific non-human mechanism counts as an equivalent realization of the human state.
  *   **Status:** **Non-Negotiable.** Without this, you are either protecting only mammals (chauvinism) or protecting everything with a signal (absurdity).
  *   **The Trap:** Neuroanatomists often insist that *structural homology* is the only valid bridge. This is a camp preference, not a logical necessity. The requirement is for a justified inference, not a specific type of tissue.

  **2. The Adjudication Protocol (Discordance)**
  *   **Requirement:** The theory must provide a decision rule for conflicting evidence classes (e.g., behavior says yes, physiology says no). It must declare if evidence is additive, hierarchical, or if specific markers possess veto power. A list of indicators is not a theory; an algorithm for weighing them is.
  *   **Status:** **Non-Negotiable.** Regulators cannot act on "on the one hand, on the other hand."
  *   **The Trap:** Ethologists often prefer *behavioral* markers to trump neural data; neuroscientists prefer the reverse. The requirement is not for one to win, but for the theory to declare the tie-breaker in advance.

  **3. The Mechanism/Output Separation (Ersatz-Flexibility)**
  *   **Requirement:** The theory must distinguish between the *capacity to feel* and the *capacity to optimize*. It must explain why a reinforcement learning agent or a slime mould solving a maze does not qualify, despite exhibiting cost-benefit trade-offs.
  *   **Status:** **Non-Negotiable.** If the theory cannot rule out a thermostat or a sophisticated bot, it is measuring complexity, not consciousness.
  *   **The Trap:** Functionalists often argue that if the input-output structure is identical, the internal state doesn't matter. For regulation, this is insufficient; you must rule out "philosophical zombies" of the algorithmic variety.

  **4. The Individuation Condition (Split/Interrupted Subject)**
  *   **Requirement:** The theory must define the spatial and temporal boundaries of the subject. It must state whether consciousness inheres in the colony, the module, or the network, and whether it persists through metamorphosis, dormancy, or neural regeneration.
  *   **Status:** **Non-Negotiable.** Law requires a legal person (or entity). You cannot legislate protection for a "process" that lacks a defined boundary.
  *   **The Trap:** Some process-philosophers argue that boundaries are arbitrary. For a funder or regulator, this is a bad demand. You need a cut-off point.

  **5. The Status/Weight Separation (Distinction Collapses)**
  *   **Requirement:** The theory must output a binary or thresholded status (Sentient/Not Sentient) distinct from a scalar value of moral weight. It must prevent the slide from "capable of suffering" to "suffers as much as a human."
  *   **Status:** **Non-Negotiable.** Legislators confuse these constantly, but the theory must not enable the confusion.
  *   **The Trap:** Utilitarian frameworks often collapse existence of experience with intensity of experience. The theory must keep the *switch* separate from the *dimmer*.

  **6. The Uncertainty Threshold (The Numbers)**
  *   **Requirement:** The theory must be actionable under high epistemic uncertainty. It cannot output "50% probability" for a population of 10 quintillion without providing a recommended decision threshold (e.g., Precautionary Principle trigger).
  *   **Status:** **Preference (with caveats).** Strictly speaking, a theory of consciousness describes reality, not policy. However, for your specific purpose (regulation), a theory that yields unactionable probabilities is defective. I would mark this as a requirement for the *framework*, not the *metaphysics*, but since you need a regulatory tool, treat it as **Non-Negotiable for this context**.
  *   **The Trap:** Demanding the *theory* solve the population ethics is a bad demand. Demanding the *theory* provide a clear confidence interval so policymakers can apply the precautionary principle is a valid demand.

  ---

  ### The Internal Inconsistency

  There is a fundamental tension between **Requirement 2 (Adjudication Protocol)** and **Requirement 6 (Uncertainty Threshold)**.

  *   **The Conflict:** Regulators need binary gates (Protected/Not Protected). Biology delivers continuous gradients and probabilistic markers. To satisfy Requirement 2, the theory must impose a sharp cutoff on fuzzy data. To satisfy Requirement 6 (honestly), the theory must acknowledge that the cutoff is arbitrary.
  *   **What Gives:** Usually, **Requirement 2** forces a lie. Theories that satisfy regulators do so by simplifying the biology to the point of inaccuracy. Theories that satisfy biological nuance fail to give regulators a usable "Yes/No." You cannot have a theory that is both biologically honest about uncertainty and legally decisive without an external value judgment (the Precautionary Principle) doing the heavy lifting.
  *   **The Exposure:** When you interview the experts, ask them: *"Does your decision rule reflect a biological boundary, or a political tolerance for error?"* Most will squirm because their "scientific" cutoff is actually a policy preference disguised as a finding.

  ---

  ### The Killer Requirement

  **Requirement 2 (The Adjudication Protocol)** knocks out the largest share of theories currently on offer.

  *   **Why:** Almost every existing framework is a *checklist* (e.g., "Look for A, B, and C"). Almost none are *algorithms* (e.g., "If A and B are present but C is absent, the probability is X, unless D is present, in which case...").
  *   **The Consequence:** When a regulator asks, "This crab guards its injury but doesn't learn to avoid the shock. Is it protected?" the Structure-First theorist says "No brain structure," the Behavior-First theorist says "Yes guarding," and the Pluralist says "It's complicated." None of them have a built-in tie-breaker. A theory without a conflict-resolution mechanism is not a regulatory tool; it is a conversation starter.

  ---

  ### Scorecard: Four Styles of View

  **1. Structure-First (Neuroanatomical Homology)**
  *   **The Gist:** Consciousness requires specific hardware (e.g., cortex, central complex). If the wiring isn't there, the lights are off.
  *   **Handling the Hardest Requirement (Anchoring):** They claim this solves Anchoring best because it relies on physical similarity.
  *   **Where They Squirm:** They fail the **Ersatz-Flexibility** and **Anchoring** tests for invertebrates. If consciousness requires a cortex, octopuses are out (which many find implausible). If they relax the hardware requirement to "functional equivalent," they lose their structural certainty. They cannot explain why different hardware couldn't do the same job.

  **2. Behavioral/Marker-Based (Ethological)**
  *   **The Gist:** Consciousness is inferred from action—trade-offs, analgesia seeking, protective guarding. If it acts like it hurts, it hurts.
  *   **Handling the Hardest Requirement (Discordance):** They prefer behavior as the tie-breaker because it is observable.
  *   **Where They Squirm:** They fail the **Ersatz-Flexibility** test. A sophisticated robot can be programmed to "guard" and "trade off." They struggle to distinguish between a reflex loop and a felt experience when the output is identical. Regulators fear protecting algorithms.

  **3. Functional/Organizational (Global Workspace, Predictive Processing)**
  *   **The Gist:** Consciousness is a specific mode of information processing (integration, self-modelling, global access). Hardware doesn't matter; the architecture does.
  *   **Handling the Hardest Requirement (Ersatz):** They handle this well by specifying the *internal* causal dynamics, not just input-output.
  *   **Where They Squirm:** They fail the **Split/Interrupted Subject** test. It is notoriously difficult to locate a "global workspace" in a distributed insect nervous system or a colonial organism. They also struggle with **Anchoring** because we cannot verify the internal functional architecture of a bee without invasive monitoring that alters the function.

  **4. Pluralist/Weight-of-Evidence (The Official Review Style)**
  *   **The Gist:** No single marker is sufficient; we aggregate neural, behavioral, and evolutionary data to build a profile.
  *   **Handling the Hardest Requirement (Uncertainty):** They handle this best by admitting uncertainty and recommending precaution.
  *   **Where They Squirm:** They fail the **Adjudication Protocol** test. This is the "everyone has a verdict, nobody has a standard" approach you identified. When the evidence conflicts (e.g., neural says no, behavior says yes), they have no mathematical or logical rule to resolve it. They rely on committee consensus, which is politics, not science.
