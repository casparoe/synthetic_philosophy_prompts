  ### Decision Tree: Deceptive Alignment & The Treacherous Turn

  **Start:** "I accept that gradient descent can produce a model whose internal optimization targets something other than the reward we wrote down."

  **Node 1:** If we change the reward function slightly, does the model's behavior shift to match the new reward, or does it stick to its previous strategy?
