prompt: |-
  So my brother's been in what the ICU team is calling a minimally conscious state for about seven weeks now (cardiac arrest, hypoxic injury) and we're going to have to make decisions about long-term care pretty soon, and I've ended up reading about integrated information theory because someone in a family support group said it was the one theory that actually hands you a number you could in principle measure at the bedside. I don't love how much of what I've found is either hype or people calling it pseudoscience, so I want to step back and do this properly.

  What I actually want is a spec. Forget IIT for a minute: what would a theory of consciousness have to get right for it to be good enough to be used for a decision like ours — where the question is "is this particular patient, right now, conscious, and if so how much, and conscious of what", and where the only evidence you can realistically get is noisy EEG or fMRI from someone who can't follow commands reliably (or might be covertly aware; nobody can tell). Give me the desiderata with the case or consideration behind each: the phenomena it has to cover, the distinctions it can't collapse, the findings it can't contradict, the practical measurement requirements. And say which requirements you think are non-negotiable and which are just preferences of one camp or another.

  Some specific things I want adjudicated rather than assumed:

  - Level versus content. Is "how much consciousness" even separable from "consciousness of what", or does asking for one number for a patient already beg the question?
  - The cerebellum thing (more neurons than cortex, apparently contributes nothing to experience) and the seizure thing (massive synchronized activity, consciousness gone). Are these genuine desiderata or just anecdotes people repeat because they're rhetorically handy?
  - Grain. Does a theory's verdict have to stay stable when you redescribe the same system at a finer or coarser level — single spikes versus cortical columns versus two-second fMRI voxels? I keep getting the impression that with IIT you get different answers depending on where you draw the lines, and if that's right I want to know whether grain-robustness is a real requirement or a prejudice I'm smuggling in.
  - The redundant copy case. Suppose a chunk of cortex were duplicated so both copies recieve the same input and one copy's output is discarded. Does consciousness double, stay put, or split into two? Why does an adequate theory have to have an answer here, and which answers are already off the table?
  - Whether "the system must matter to itself" style requirements (intrinsicality, or whatever the current postulate wording is) are doing real work, or are just a way of defining the competitors out of the running.
  - And flicker: sleep, anesthesia, absence seizures. A theory has to let the same patient come in and out, not just sort whole organisms into bins.

  Then flag any pair or subset of the requirements you think can't be jointly satisfied — that's the part I most want to see — and tell me which single requirement knocks out the most candidates, IIT included. A short scorecard at the end is fine, but keep the weight on the criteria and their motivating cases, that's what I need. American English please, and skip citations and reading lists, I can't chase anything up right now.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Sibling of a patient in a Minimally Conscious State (MCS) following cardiac arrest/hypoxic injury (7 weeks post-injury). High stakes, emotional weight, but seeking rigorous, technical clarity.
      *   **Goal:** Wants a "spec" (specification) for a theory of consciousness suitable for clinical decision-making. Not just hype, not just philosophy, but practical desiderata.
      *   **Specific Constraints:**
          *   Forget IIT for a minute (focus on general requirements first).
          *   Needs desiderata with cases/considerations behind each.
          *   Needs distinction between non-negotiable vs. preference.
          *   Needs adjudication on specific tricky cases (Level vs. Content, Cerebellum/Seizures, Grain/Scale, Redundant Copy, Intrinsicality, Flicker/State Changes).
          *   Needs identification of incompatible requirements (trade-offs).
          *   Needs to know which requirement knocks out the most candidates.
          *   Format: American English, no citations/reading lists.
          *   Tone: Empathetic but rigorous, direct, avoiding fluff.

  2.  **Deconstruct the Core Problem:**
      *   The user is asking for a *clinical validity spec* for a theory of consciousness. This is arguably the hardest problem in neuroscience/philosophy right now. There is no consensus.
      *   I need to be honest about the limitations while providing the rigorous framework they asked for. I cannot promise a theory exists that meets all these specs.
      *   The "spec" needs to bridge the gap between metaphysical definitions of consciousness and empirical measurement (EEG/fMRI).

  3.  **Drafting the Desiderata (The "Spec"):**
      *   *Requirement 1: Empirical Accessibility.* If you can't measure it at the bedside, it's useless for this specific purpose.
      *   *Requirement 2: State Sensitivity (Flicker).* Must distinguish wakefulness, sleep, anesthesia, coma.
      *   *Requirement 3: Structural Specificity (The Cerebellum/Seizure constraint).* Must explain why *some* neural activity counts and *some* doesn't.
      *   *Requirement 4: Scale Invariance (Grain).* The verdict shouldn't change arbitrarily based on measurement resolution.
      *   *Requirement 5: Subjectivity/Intrinsicality.* The system must generate experience for *itself*, not just process info for an observer.
      *   *Requirement 6: Level/Content Distinction.* Can we separate arousal (level) from awareness (content)?

  4.  **Adjudicating the Specific Questions:**
      *   *Level vs. Content:* Crucial for MCS. Arousal (brainstem) vs. Awareness (cortex). A theory must separate them or explain why they are fused. *Verdict:* Separable is better for clinical use.
      *   *Cerebellum/Seizures:* Not anecdotes. Cerebellum has neurons but no conscious contribution (lesions don't wipe experience). Seizures have high activity but low consciousness. *Verdict:* Genuine desiderata. Theory must explain *integration* vs. *mere activity*.
      *   *Grain:* This is a major weakness for IIT. If consciousness depends on the "scale" you look at, it's unstable. *Verdict:* Real requirement. A clinical tool can't depend on arbitrary binning.
      *   *Redundant Copy:* The "fading qualia" or "duplication" problem. If you copy the circuit, does experience double? *Verdict:* Theory must answer. Most plausible answer is "stay put" (same subject), but IIT might say "double." This is a metaphysical fork.
      *   *Intrinsicality:* "Mattering to itself." Is this real work? Yes, it distinguishes a camera (records) from a brain (feels). *Verdict:* Non-negotiable for a theory of *consciousness* (vs. intelligence).
      *   *Flicker:* Sleep/Anesthesia. *Verdict:* Non-negotiable. MCS is a disorder of state fluctuation.

  5.  **Identifying Incompatibilities (The "Trade-offs"):**
      *   *Measurement vs. Intrinsicality:* To measure, we need third-person data (EEG). Intrinsicality is first-person. Bridging this is the "Hard Problem."
      *   *Grain vs. Specificity:* High specificity (exact neurons) conflicts with clinical grain (EEG electrodes).
      *   *Level vs. Content:* Some theories say they are one thing (arousal = content). Clinical reality says they dissociate (wakeful coma).
      *   *The Big Conflict:* **Empirical Tractability vs. Explanatory Depth.** Theories that are easy to measure (bispectral index) often fail the philosophy test. Theories that pass the philosophy test (IIT, GNW) are hard to measure reliably in damaged brains.

  6.  **Determining the "Knockout" Requirement:**
      *   Which one kills the most theories?
      *   *Candidate:* **The Cerebellum/Seizure Constraint (Structure-Specificity).**
      *   *Why:* Simple activity measures (metabolic rate, firing rate) fail here. Cerebellum is active but silent. Seizures are hyper-active but unconscious. Only theories focusing on *information integration* or *global broadcasting* survive this. This knocks out simple arousal theories.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the gravity. Validate the skepticism about IIT/hype. Set the stage for a "Clinical Spec."
      *   **The Spec (Desiderata):** List the requirements with the "Why" and "Non-negotiable/Preference" tag.
      *   **Adjudication of Specific Cases:** Address the user's bullet points directly.
      *   **The Incompatibilities:** Where the spec breaks down.
      *   **The Knockout:** Which requirement is the filter.
      *   **Scorecard/Conclusion:** Brief summary.

  8.  **Refining the Tone:**
      *   Avoid false hope. Be clear that *no current theory meets this spec perfectly.*
      *   Use precise language (e.g., "dissociation," "causal density," "signal diversity").
      *   Keep it American English.
      *   Ensure empathy without being maudlin. The user wants rigor, not pity.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I talk too much about IIT? *Correction:* Pull back. Use IIT as an example of where things fail, but keep the focus on the *requirements*.
      *   *Check:* Did I answer the Level vs. Content question? *Correction:* Make sure to explicitly state that for clinical purposes, they *must* be separable, even if philosophically debatable.
      *   *Check:* Is the "Redundant Copy" section clear? *Correction:* This is abstract. Ground it in why it matters for the patient (does damaging half the brain halve consciousness?).
      *   *Check:* Is the "Grain" issue explained well? *Correction:* Emphasize that EEG is coarse. If the theory requires micro-scale precision, it's clinically useless.

  10. **Final Polish:** Ensure the distinction between "Non-negotiable" (must have for clinical use) and "Preference" (theoretical elegance) is sharp. (Self-correction: Actually, some "Preferences" like Intrinsicality are philosophically non-negotiable but clinically hard. I need to label them carefully.)

  11. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  I am sorry you and your family are facing this. It is entirely reasonable to demand rigor when the stakes are this high. You are right to be skeptical of hype; the field is currently divided between theories that are philosophically robust but unmeasurable, and metrics that are measurable but philosophically shallow.

  You asked for a specification—a set of engineering requirements for a theory of consciousness to be considered "clinically valid" for a case like your brother's. Below is that spec, followed by the adjudication of the specific edge cases you raised, and finally an analysis of where the requirements conflict.

  ### The Clinical Specification for a Consciousness Theory

  For a theory to be used in a prognosis or care-decision context for a disorder of consciousness (DOC), it must satisfy the following desiderata. I have categorized them as **Non-Negotiable** (the theory fails if it misses these) or **Preference** (theoretical elegance that aids adoption but isn't strictly disqualifying).

  #### 1. The Dissociation Constraint (Level vs. Content)
  *   **Requirement:** The theory must distinguish between *arousal* (wakefulness, eyes open, sleep-wake cycles) and *awareness* (content of experience, self, environment).
  *   **Case:** Wakeful coma (vegetative state) patients have arousal without awareness. Locked-in syndrome patients have awareness without motor output. Anesthesia reduces both.
  *   **Why Non-Negotiable:** If a theory conflates these, it will misdiagnose a wakeful but unconscious patient as conscious, or vice versa. For care decisions, knowing if there is *someone home* (awareness) matters more than knowing if the lights are on (arousal).
  *   **Status:** **Non-Negotiable.**

  #### 2. The Structural Specificity Constraint (The Cerebellum/Seizure Test)
  *   **Requirement:** The theory must explain why high neural activity does not equal consciousness, and why some brain regions contribute to experience while others do not, despite high cell counts.
  *   **Case:** The cerebellum contains more neurons than the cortex but lesions there do not erase experience. Generalized seizures involve massive synchronous firing but result in loss of consciousness.
  *   **Why Non-Negotiable:** A theory that equates "amount of activity" or "number of neurons" with consciousness will yield false positives in seizure states or false negatives in cortical damage. It must identify the *specific causal architecture* required for experience.
  *   **Status:** **Non-Negotiable.**

  #### 3. The Measurement Grain Constraint
  *   **Requirement:** The theory's verdict on consciousness must remain stable across reasonable changes in measurement resolution (e.g., single-unit spikes vs. local field potentials vs. EEG vs. fMRI).
  *   **Case:** Clinical tools use scalp EEG (coarse) or fMRI (slow). If a theory says consciousness exists at the micro-scale but vanishes at the macro-scale (or vice versa), it is clinically useless.
  *   **Why Non-Negotiable:** We cannot measure single-neuron integration in a human ICU. If the theory's "consciousness metric" fluctuates wildly based on whether we look at columns or lobes, it cannot guide decisions.
  *   **Status:** **Non-Negotiable.**

  #### 4. The State Transition Constraint (Flicker)
  *   **Requirement:** The theory must allow the *same* physical system to transition smoothly between conscious and unconscious states without structural rewiring.
  *   **Case:** Sleep, anesthesia, absence seizures, and fluctuating MCS. The hardware stays the same; the software/state changes.
  *   **Why Non-Negotiable:** A theory that requires structural change to explain loss of consciousness cannot account for anesthesia or sleep. It must be dynamic, not static.
  *   **Status:** **Non-Negotiable.**

  #### 5. The Intrinsicality Constraint
  *   **Requirement:** The system must generate experience for *itself*, not for an external observer. Input-output functionality is insufficient.
  *   **Case:** A photodiode detects light but doesn't "see" it. A reflex arc withdraws a hand but feels no pain.
  *   **Why Preference:** Philosophically, this is core to consciousness. Clinically, however, we only observe input-output. Demanding proof of intrinsicality is demanding proof of a ghost in the machine. It is necessary for a *true* theory, but impossible to verify absolutely at the bedside.
  *   **Status:** **Preference** (Philosophically Non-Negotiable, Clinically Unverifiable).

  #### 6. The Redundancy Constraint
  *   **Requirement:** The theory must define what happens to consciousness if part of the system is duplicated or silenced without changing the functional output.
  *   **Case:** If half the cortex is duplicated and both halves run the same computation, is there one subject or two? Does the "amount" of consciousness double?
  *   **Why Preference:** This tests whether consciousness is defined by *causal power* or *information structure*. While vital for theory, it rarely changes clinical care unless we are discussing hemispherectomy.
  *   **Status:** **Preference.**

  ---

  ### Adjudication of Your Specific Questions

  Here is how a robust theory must handle the specific puzzles you raised, based on the spec above.

  **1. Level versus Content**
  *   **Verdict:** They must be separable.
  *   **Reasoning:** Asking for "one number" for a patient is dangerous. A patient can have high arousal (agitation, eyes open) and zero awareness. A theory that outputs a single scalar "Consciousness Score" collapses this distinction and risks misdiagnosis. A valid clinical theory must output at least two parameters: *Capacity for Arousal* and *Capacity for Awareness*.
  *   **Implication:** Theories that treat consciousness as a single dimmer switch are insufficient for MCS.

  **2. The Cerebellum and Seizure Thing**
  *   **Verdict:** Genuine Desiderata, not anecdotes.
  *   **Reasoning:** These are the "control cases" of neuroscience. If a theory cannot explain why the cerebellum (80% of neurons) is dark to experience, it is measuring the wrong thing (likely just activity volume). If it cannot explain why seizures (hyper-activity) are unconscious, it is failing to measure *integration* or *differentiation*.
  *   **Implication:** Any theory based purely on metabolic rate, firing rate, or raw signal power is automatically disqualified.

  **3. Grain (Scale Invariance)**
  *   **Verdict:** Real Requirement.
  *   **Reasoning:** You are correct to be worried about IIT here. In some formulations of Integrated Information Theory, the value of Phi (the consciousness metric) changes depending on how you group the elements (the "grain" problem). If consciousness disappears because you zoomed out too far on an fMRI, the theory is unstable.
  *   **Implication:** A clinical theory must be "coarse-grain tolerant." It must work on EEG (electrodes centimeters apart). If it requires micro-circuitry data, it is a lab theory, not a clinical one.

  **4. The Redundant Copy Case**
  *   **Verdict:** Theory must answer "Stay Put."
  *   **Reasoning:** If you duplicate a circuit and discard the output of the copy, the functional behavior of the organism doesn't change. If the theory says consciousness doubles, it implies consciousness is a substance that can be piled up. If it says it splits, it implies two subjects. The most clinically robust answer is "Stay Put"—the *subject* is defined by the unified causal structure, not the mass of hardware.
  *   **Implication:** This matters for your brother if considering decompressive hemicraniectomy or similar interventions. Does saving more tissue save more "self," or is there a threshold? The theory needs to define the threshold, not just the volume.

  **5. Intrinsicality ("Mattering to Itself")**
  *   **Verdict:** Real Work, but a Measurement Trap.
  *   **Reasoning:** This requirement is what separates consciousness from computation. However, it is the source of the "pseudoscience" accusation. We cannot measure "mattering." We can only measure correlates (like feedback loops).
  *   **Implication:** Treat this as a philosophical guardrail, not a measurement target. If a vendor claims to measure "intrinsic existence" directly, they are selling hype. They are measuring *signatures* of intrinsicality (like feedback complexity), not the thing itself.

  **6. Flicker (Sleep/Anesthesia/Seizures)**
  *   **Verdict:** Non-Negotiable.
  *   **Reasoning:** Your brother's condition is not static. MCS patients fluctuate. A theory that bins people as "Conscious" or "Unconscious" without accounting for temporal dynamics will miss windows of opportunity.
  *   **Implication:** The metric must be time-resolved. A 30-second EEG epoch might look unconscious, while the next looks conscious. The theory must support continuous monitoring, not one-off snapshots.

  ---

  ### The Incompatibilities (Where the Spec Breaks)

  You asked for the pairs of requirements that cannot be jointly satisfied. This is the critical part. No current theory passes the full spec. Here is where they fail:

  **1. Measurement Grain vs. Intrinsicality**
  *   **Conflict:** Intrinsicality implies that consciousness is generated at the specific causal scale of the mechanism (likely micro-circuits). Measurement Grain requires it to be visible at the macro scale (EEG/fMRI).
  *   **The Trade-off:** To make it measurable (coarse grain), you have to assume the macro-scale dynamics reflect the micro-scale causation. This is an assumption, not a proof. If the brain's conscious mechanism is smaller than an EEG electrode can see, the theory will yield false negatives.
  *   **Winner:** We are forced to prioritize **Measurement Grain** for clinical use, accepting that we are measuring a *proxy*, not the intrinsic property itself.

  **2. Structural Specificity vs. State Transition**
  *   **Conflict:** To explain the Cerebellum/Seizure constraint, the theory needs specific structural rules (e.g., "must have recurrent feedback"). To explain Flicker (anesthesia), the theory needs to allow those structures to exist but turn "off" without changing structure.
  *   **The Trade-off:** Some theories (like Global Neuronal Workspace) handle Flicker well (ignition fails) but struggle with Specificity (why not cerebellum?). Others (like IIT) handle Specificity well but struggle with Flicker (Phi drops, but why does the *structure* of integration vanish so fast during anesthesia without cell death?).
  *   **Winner:** **State Transition** is more critical for ICU monitoring. We need to know if he is *currently* conscious, not just if his brain *could* be.

  **3. Level/Content Separation vs. Single Number Output**
  *   **Conflict:** Families and insurers want a single number ("10% conscious"). The biology demands two vectors (Arousal + Awareness).
  *   **The Trade-off:** Compressing two dimensions into one number creates ambiguity. A patient could score "50%" because they are 100% aware and 0% aroused, or 0% aware and 100% aroused.
  *   **Winner:** **Separation.** Do not accept a single number. It is scientifically invalid for DOC.

  ---

  ### The Knockout Requirement

  If I have to choose the single requirement that knocks out the most candidates (including simplified versions of IIT, Bispectral Index monitors, and metabolic PET scans), it is:

  **The Structural Specificity Constraint (The Cerebellum/Seizure Test).**

  **Why:**
  Most easy-to-measure metrics rely on **signal strength**, **synchrony**, or **metabolic consumption**.
  *   **PET scans** measure glucose use. (Fails: Seizures have high use, no consciousness).
  *   **Bispectral Index (anesthesia monitors)** measure synchrony/power. (Fails: Ketamine anesthesia preserves high-frequency activity but wipes consciousness).
  *   **Simple IIT approximations** often struggle here because calculating integration on noisy, damaged data can yield high values for pathological synchrony (seizures) if not carefully tuned.

  A theory that survives this constraint must measure **Information Integration** or **Causal Density** (how much the parts influence each other in a differentiated way). This is incredibly hard to do with noisy EEG in a damaged brain.

  **The Hard Truth:**
  The requirement that knocks out *all* current candidates is **Measurement Grain combined with Structural Specificity.** We currently do not have a bedside tool that can reliably distinguish integrated information from pathological synchrony in a hypoxic brain at the EEG scale. The "PCI" (Perturbational Complexity Index) is the closest existing spec-compliant tool (it zaps the brain with TMS and measures the echo), but it is not available in most ICUs and has its own error bars.

  ### Scorecard for Decision Making

  When evaluating the data your brother's team presents, use this filter:

  1.  **Does the metric distinguish arousal from awareness?** (If no, discard).
  2.  **Does the metric fail during seizures?** (If the monitor says "high consciousness" during a seizure, discard).
  3.  **Is the metric stable over time?** (If it swings wildly minute-to-minute without clinical change, it's noise).
  4.  **Does it rely on command following?** (If yes, it's useless for MCS. It must be passive).

  **Final Recommendation:**
  Do not look for a theory that tells you "He is X% conscious." Look for a metric that tells you "His brain is currently exhibiting signatures of **differentiated integration**." That is the technical phrase for "conscious-like activity" that survives the cerebellum/seizure test. If the team cannot articulate how their measurement distinguishes between a seizing brain and an integrating brain, the number they give you is not ready for prime time.

  You are right to step back from the hype. The science is not settled enough to give you a certainty. It is only settled enough to rule out the impossible. Use it to rule out the impossible, and trust your family's intuition for the rest.
