      *   *Why does Molyneux's Problem matter to him?* It supports his empiricist thesis that there are no innate ideas. If the connection between sight and touch were innate/natural, the man would know immediately. Since he doesn't, the connection must be learned through experience (association).
      *   *Is it a "picture theory"?* Locke often uses spatial/visual metaphors (ideas are "before the mind," "imprinted," etc.). However, he distinguishes between primary qualities (resembling objects) and secondary qualities (not resembling). So, it's not *just* a picture, but it is representational.
