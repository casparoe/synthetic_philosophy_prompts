  Hey, it makes total sense that you're stuck on this because that podcast probably brushed up against the hardest problem in value theory which is whether you can really measure agony against joy on the same ruler. I've been turning over those three models you mentioned and trying to see which one actually holds up when you press it against the commensurability objection without just turning into pure negative utilitarianism where pleasure stops mattering entirely. If I had to rank them from best to worst at walking that tightrope, I think the weighted discontinuity model actually lands in the best position because it is the only one that tries to meet the mathematical objection on its own terms rather than sidestepping it. By proposing a shared metric where the exchange rate goes infinite near zero suffering, you keep the utilitarian calculus intact so you aren't accused of incoherence, but you still preserve the lexical intuition that suffering is infinitely more urgent. It avoids collapsing into regular negative utilitarianism in principle because it allows for a state where suffering is zero and pleasure suddenly gains traction, whereas strict negative utilitarianism says pleasure never has intrinsic value. This model saves the lexical view by showing how it can function as a limit case within a coherent system, which is exactly what the commensurability objection demands.

  Moving down the list, the strict lexical ordering where any pain above a threshold dominates any pleasure comes in second because while it is the most philosophically honest about the priority of suffering, it fails your specific constraint about not collapsing back into regular negative utilitarianism. If you hold that any amount of threshold pain automatically outweighs any amount of pleasure, then in any real-world scenario where suffering exists, pleasure effectively has zero weight in your decision calculus. This makes it practically indistinguishable from pure negative utilitarianism even if you theoretically allow pleasure to matter once suffering is eliminated. It answers the commensurability objection by simply denying commensurability, which is a valid move, but it doesn't save the lexical view from becoming negative utilitarianism in practice, which was the thing you wanted to avoid. It's a stronger position than the third option, but it sacrifices the hybrid nature you're looking for.

  That leaves your local-denial hybrid where incommensurability holds only inside small pain neighborhoods but gets restored globally, and unfortunately this lands in the worst spot because it undermines the very lexical view it's trying to save. If you restore commensurability globally, you are eventually allowing pain and pleasure to be traded off against each other at the scale that actually matters for ethics and policy. This means enough pleasure could theoretically outweigh significant pain once you zoom out, which violates the core lexical claim that pain has priority. It tries to have it both ways by compartmentalizing the incommensurability, but this feels ad hoc and doesn't really solve the mathematical incoherence so much as hide it inside arbitrary neighborhood definitions. It avoids collapsing into negative utilitarianism, sure, but only by collapsing into standard utilitarianism instead, so it fails to do the job of saving the lexical view specifically. So yeah, the weighted model is your best bet for keeping the math coherent without killing the value of pleasure, while the strict ordering is too close to pure negative utilitarianism and the hybrid idea dissolves the lexical priority entirely.
