answer: |-
  # Workshop Plan: The Correlated Consensus Game

  **Topic:** Echo Chambers vs. Epistemic Bubbles
  **Time:** 75 Minutes
  **Participants:** 14 Postgrads
  **Props:** 14 Envelopes, 30 Chocolate Coins (or points), Whiteboard, Markers, 1 "Master Card" (kept by you).

  ## The Setup (Secret Prep)
  You need two types of Intel Cards inside the envelopes.
  *   **Type A (The Echo):** 10 cards. They all contain the same specific claim (e.g., "The bridge is structurally sound"). They look slightly different (different fonts or colours) so they *appear* independent, but the core data is identical.
  *   **Type B (The Dissent):** 4 cards. They contain contradictory claim (e.g., "The bridge shows critical fatigue"). These are genuinely independent reports.
  *   **The Hidden Source:** You hold one **Master Card**. It matches the Type A claim.
  *   **The Trick:** You tell them all cards are independent field reports. They are not. The Type A cards are all derivatives of your Master Card.

  ## Timeline & Rules

  ### 1. Briefing (10 mins)
  Tell them they are an intelligence taskforce. There's a binary decision to make (Bridge Safe/Unsafe). They need to reach a consensus to "release the funds".
  *   **Stakes:** If the group agrees on the *truth* (which is actually Type B, the dissent), everyone gets chocolate. If they agree on the *falsehood* (Type A), only the majority gets chocolate. (This creates tension).
  *   **Rule 1:** You must show your card to at least 3 other people.
  *   **Rule 2:** You must submit a "Credibility Vote" for 3 peers. You get 3 tokens to distribute. You cannot vote for yourself.

  ### 2. Phase One: Intel Trading (15 mins)
  Let them mingle. They will show cards.
  *   **What happens:** The 10 Type A holders will find lots of confirmation. "Oh, you got the same report? Must be true."
  *   **The 4 Type B holders:** They will try to show their cards. The Type A holders will glance at them and say, "That's odd, everyone else says Safe."
  *   **Crucial:** Do not intervene. Let the Type B students feel the friction of being ignored. They *have* the info, but it's not landing.

  ### 3. Phase Two: The Trust Auction (20 mins)
  Collect the Credibility Votes. Tell them you need to calculate the "Network Trust Score".
  *   **The Hidden Mechanism:** This is where you rig it.
      *   If a student voted for a **Type A** holder: You count that vote as **2 points**.
      *   If a student voted for a **Type B** holder: You count that vote as **1 point**.
      *   *Why?* You tell them later this represents "hidden trust correlations". For now, just say you're using a "weighted algorithm" to account for network density. (Lie slightly, or just say "we normalise for cluster density").
  *   **The Result:** When you write the scores on the board, the Type A holders will have massively inflated scores. The Type B holders will look like outliers with low credibility.
  *   **The Pressure:** Ask the group: "Based on the Trust Scores and the Intel, what is the decision?"
  *   **Predictable Outcome:** They will vote "Safe" (Type A). The Type B students will likely concede because the "math" says they are unreliable.

  ### 4. The Crisis & Reveal (15 mins)
  Announce the decision is locked. Then, drop the bomb.
  *   **Reveal 1:** Ask the Type A holders to stand. Show them your **Master Card**. Reveal that their 10 cards were not independent observations. They were all photocopies of your one source.
  *   **Reveal 2:** Explain the Voting Rig. Tell them you weighted votes for Type A higher because they aligned with the Master Source.
  *   **The Kicker:** The Type B cards were the only *actually* independent data. The group systematically discounted true dissent because the "trust network" was artificially correlated around a single point of failure.

  ### 5. Debrief (15 mins)
  Map the game to the philosophy.
  *   **Epistemic Bubble:** If the Type B students had been locked in a different room and never heard the Type A info, that's a bubble. Omission.
  *   **Echo Chamber:** In this game, the Type B students *were* in the room. They spoke. They showed cards. But the structure of trust (the weighted votes + the false independence of Type A) meant their info was *discredited* rather than just missed.
  *   **Hidden Correlation:** Explain that in real life, this isn't usually a facilitator rigging scores. It's shared media diets, algorithmic amplification, or relying on the same wire services while thinking you're reading independent papers.
  *   **The Feeling:** Ask the Type B students how it felt to be ignored despite having evidence. Ask the Type A students how it feels to know their "consensus" was manufactured.

  ## What Will Predictably Go Wrong
  1.  **The Math is Too Obvious:** Postgrads are sharp. Someone might notice the scores don't add up to the votes cast. If they call you out mid-game, admit it's part of the "black box algorithm" simulation and keep going. Don't break character until the reveal.
  2.  **The Type B Students Quit:** If the 4 dissenters feel too isolated, they might stop engaging. Keep an eye on them. If they go quiet, prompt them: "Does anyone have conflicting data?"
  3.  **Chocolate Distribution:** If you promise chocolate for the truth and they vote false, you'll have to withhold it. This can cause genuine annoyance. Keep the stakes light—maybe it's just bragging rights or a single coin each. Don't make them hungry for it.
  4.  **Time Creep:** The mingling phase always runs long. Be strict with the 15-minute cut-off. Use a phone timer loudly.

  ## Limitations (Be Frank About This)
  *   **No Identity Protection:** Real echo chambers aren't just about data correlation; they're about *identity*. People reject info because accepting it would mean losing social status or admitting their tribe is wrong. This game is too rational; it misses the emotional defence mechanisms.
  *   **The Facilitator is God:** In the real world, there's no single "Master Card" holder. The correlation is emergent, not top-down. This simulates the *structure* of an echo chamber, but not the *organic formation* of one.
  *   **Easy Fix:** Once you reveal the trick, the spell breaks instantly. In reality, even after showing people the Master Card, they might still distrust the Type B data because they've already committed to the Type A identity. The game makes resolution too easy.

  ## Final Note for You
  Make sure you emphasise that an epistemic bubble is fixed by *adding* info (which you did—they heard the Type B cards). An echo chamber requires *rebuilding trust* (which they failed to do). The game works because they had the info but lacked the trust structure to process it.

  Oh, and watch out for teh typo in the handouts, I always mess that up when rushing. Good luck.
