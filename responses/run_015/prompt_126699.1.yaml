answer: |-
  **Exercise:** The Bureau of Procedural Clarity
  **Materials:** 500 index cards, pens, wall tape, timer, three opaque boxes.
  **Roles:** All are Clerks. Three rotate as Auditors every 10 minutes.

  **Timeline:**
  **0–20 mins (Codification):** Clerks draft five criteria for 'Optimal File Management' on cards (e.g., 'Legibility', 'Speed', 'Format'). Cards are anonymised, collated, and voted into a top-ten Rubric displayed on the wall.
  **20–25 mins (Instruction):** Facilitator reads script, sets timer for 40 minutes, exits room.
  **25–65 mins (Operation):** Clerks adopt a fictional persona (e.g., 'Citizen X'). They complete file tasks aiming to maximise Rubric scores. Auditors observe and drop score-cards into Box A (Verified) or Box B (Unverified) unseen. Scores are tallied on a wall chart. Auditors rotate. Facilitator remains absent.
  **65–90 mins (Debrief):** Facilitator returns.

  **Instructions (Read Aloud):**
  "You are Clerks of the Bureau. Your task is to process Files with maximum Clarity. Clarity is defined by the Rubric on the wall. Auditors will assess adherence. Scores are cumulative. There is no prize. Begin."

  **Scoring:** Points awarded for Rubric adherence. High scorers receive 'Senior Clerk' status (title only).

  **Debrief Plan:**
  1.  **Codification (0–20):** Map to *knowledge creation*. The rule was not discovered; it was manufactured by the group.
  2.  **Operation (25–65):** Map to *hierarchical observation*. Auditors watched Clerks; Auditors were watched by the system. Reporting was unverifiable (Box A/B), ensuring compliance through possibility rather than certainty.
  3.  **Skill Acquisition:** Map to *examination*. Students sought high scores despite no external value. They became competent at a meaningless task.
  4.  **No Outside:** Ask students to critique the Bureau. Note if they use Rubric terms ('inefficient', 'unclear'). Highlight that their criticism uses the system's vocabulary.
  5.  **Limit:** Admit the room cannot prove there is *no* outside, only that *this* room cannot find it.

  **Failure Modes & Repairs:**
  1.  **Cynicism/Refusal:** Students reject the task. *Repair:* Frame as 'administrative trial', not game. Maintain facilitator neutrality.
  2.  **Early Detection:** Students spot the trick. *Repair:* Use dry, bureaucratic language. Avoid dramatic music or lighting.
  3.  **Authoritarian Reading:** Students feel oppressed. *Repair:* Emphasise 'Clarity' and 'Helpfulness', not 'Security' or 'Obedience'.
  4.  **Digital Surveillance Reading:** Students link to data tracking. *Repair:* Use paper, string, physical boxes. Make the mechanism visibly analog and clumsy.

  **Ethics:** Case Reports must concern fictional personas. No personal data. Facilitator avoids forbidden words (power, discipline, surveillance, norm, panopticon) during the run.

  **Closing Statement (Participant):**
  "I left while the tallying was ongoing. I felt a distinct irritation that my File had been placed in Box B, though I knew the status meant nothing. I was already planning how to adjust my writing style for the next round to ensure Auditor approval."

  **45-Minute Variant:**
  Chairs fixed.
  **0–10:** Codification (cards passed forward).
  **10–15:** Instruction.
  **15–35:** Operation (Facilitator stands in corner, silent, facing wall).
  **35–45:** Debrief.
  *Adjustment:* Auditors score neighbours only. No rotation.
