  DEPARTMENT OF PROPER FUNCTION
  Bureau of Mental Content Adjudication
  404 Evolutionary Way, Suite Ancestral
  Panpsychia, NY 00001

  **NOTICE OF DENIAL OF REPRESENTATIONAL STATUS**

  **DATE:** October 24, 2023
  **CASE ID:** 8940-MS-INTUIT
  **CLAIMANT:** Citizen #Homo-8834
  **SUBJECT:** Application for Content Status — Moral Intuition (Type: Harm Avoidance)

  Dear Citizen,

  This letter serves as formal notification regarding your recent application to assign representational content to the mental state commonly referred to as "the intuition that torturing innocent people is wrong." After a thorough review of the phylogenetic lineage and selection history associated with this cognitive trait, the Department of Proper Function (DPF) has determined that the aforementioned mental state is **ineligible** for representational status.

  Your application was adjudicated under the **Proper Function Requirement**, codified in Regulation 12.4. This regulation stipulates that a internal state may only be granted the status of a "representation" if it possesses a proper function. A proper function is defined strictly as a capacity that was directly selected for by natural selection because it performed the specific function of mapping onto states of affairs.

  Our investigative team has concluded that your moral intuition does not meet this criterion. According to the evolutionary record submitted with your application, this intuition is not a direct adaptation for tracking moral truths. Rather, it is classified as a **spandrel**. Under the **Spandrel Exception** (Clause 7.B), traits that arise as structural byproducts of other selected adaptations cannot be assigned representational content. While your capacity for social cohesion and empathy may have been selected for, the specific intuition regarding torture is a secondary consequence of those mechanisms. It was never itself the target of selection pressure.

  Furthermore, your appeal based on the current reliability of this intuition was rejected pursuant to the **Original Instruction Doctrine**. This doctrine mandates that a trait's function is fixed exclusively by its original selection history, not by its current utility or reliability. Even if this intuition currently produces socially beneficial outcomes or feels phenomenologically robust, these factors are irrelevant to content assignment. The DPF does not recognize "current usefulness" as a valid basis for representational status. Only the historical reason for the trait's proliferation determines its function. Since the historical record indicates this intuition was not selected for representing moral facts, it cannot represent moral facts.

  Consequently, the DPF cannot recognize this mental state as a belief, judgment, or knowledge claim. It is hereby classified as "Epistemic Noise." You are advised not to rely on this state for truth-apt assertions in legal or philosophical proceedings.

  **RIGHTS TO APPEAL**

  You have the right to appeal this determination within thirty cycles. To successfully overturn this decision, you must submit one of the following forms of evidence:

  1.  **Proof of Direct Selection:** Provide fossil or genetic evidence demonstrating that ancestors possessing this specific intuition reproduced at higher rates *because* the intuition accurately represented moral facts, distinct from general social cohesion.
  2.  **Error in Spandrel Determination:** Demonstrate that the intuition is not a byproduct but a primary adaptation selected specifically for truth-tracking regarding harm.

  Please note that appeals based on moral realism or intuitive certainty will be dismissed as non-compliant with statutory evolutionary requirements.

  Sincerely,

  *The Adjudication Committee*
  Department of Proper Function
  *"Function Precedes Meaning"*
