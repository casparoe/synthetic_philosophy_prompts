answer: |-
  Dear Friend,

  It is wonderful to hear that you are bringing rationality training to undergraduates, and given your background, you know better than anyone that the sunk cost fallacy is best learned through the visceral sting of loss rather than abstract definition. For your seventy-five-minute workshop with twenty-four students, I recommend a simulation I call the Deep Sea Drill, which structures play money and escalating risks to force a collision between cold expected value calculations and the warm psychological desire to see things through. You will need only printed decision sheets, standard six-sided dice, and enough play money to give each of your six teams an endowment of one thousand units, which you can simulate with slips of paper if currency is unavailable. The goal is to run two distinct rounds of investment where the mathematical imperative to quit clashes with a mechanic designed to simulate the value of perseverance, allowing you to debrief the distinction between irrational stubbornness and rational grit without ever mentioning the term sunk cost until the students have already felt its pull.

  To begin, divide your twenty-four participants into six teams of four, ensuring mixed majors within each group to diversify their risk tolerances and analytical approaches. Hand each team their initial endowment and explain that they are deep sea salvage operators bidding on rights to drill for treasure in two separate zones, Round One and Round Two. In Round One, the project has four stages, and to proceed to each subsequent stage, the team must pay an escalating cost from their endowment, starting at one hundred units for the first stage, then two hundred, then four hundred, and finally eight hundred for the fourth stage. The probability of finding the treasure at any stage is fixed at twenty percent, determined by rolling a six on a die, but the payout of two thousand units is only awarded if they reach the stage where the treasure is found. Crucially, if they choose to stop drilling at any point, they keep their remaining money but forfeit any chance at the payout, and if they drill and fail to find treasure at a stage, they must decide whether to pay the higher cost for the next stage or abandon the site entirely. The mathematics here are rigged so that the expected value is positive for the first two stages, neutral for the third, and sharply negative for the fourth, yet because they have already spent money to reach the later stages, the emotional pressure to recoup that investment will be intense.

  Round Two follows the same mechanical structure with identical costs and probabilities, but with a critical modification to the payoff scheme that introduces the tension regarding perseverance. Before Round Two begins, inform the teams that any team that completed all four stages in Round One, regardless of whether they found treasure, will receive a Trust Multiplier of one point five on their final Round Two earnings, whereas teams that abandoned Round One early will have a multiplier of one point zero. This rule simulates the real-world benefit of being known as a finisher, creating a scenario where honoring the sunk costs of Round One might be instrumentally rational for the sake of Round Two, even if Round One itself was a losing proposition. This setup forces them to weigh the immediate loss of throwing good money after bad against the long-term benefit of maintaining their status as a committed operator, mirroring the philosophical dispute about whether finishing builds valuable self-trust or merely compounds errors. You should allocate fifteen minutes for setup and rules, forty minutes for the two rounds of play including decision time, and twenty minutes for the debrief, though you must remain flexible if the teams become deeply engrossed in negotiation.

  When running the game, you will likely encounter a few predictable failures that you should handle with light touches to preserve the learning environment. The most common issue is that one dominant student will seize control of the play money and dictate decisions, robbing the team of the collective deliberation you want to observe, so you should intervene by reminding teams that every member must sign off on the decision sheet before a drill stage is purchased. Another frequent problem is arithmetic confusion, where teams lose track of their total spent versus their remaining endowment, leading to decisions based on false premises, so circulate among the tables and quietly verify their ledgers without correcting their strategy. You may also find that teams treat the play money as worthless and gamble recklessly, so emphasize at the start that the team with the highest final net worth will receive a tangible prize, such as priority choice of topics for the next workshop or a small gift card, to ground the stakes. If a team quits immediately without drilling, remind them that the goal is to maximize returns, not minimize activity, and if a team drills until bankruptcy, simply let them sit out the remainder of the round as a natural consequence of their risk management.

  The debrief is where the actual rationality training occurs, and you must guide them to map their specific decisions to forward-looking expected value versus backward-looking reasons without initially labeling the fallacy. Start by asking the teams that abandoned the project in Round One to explain their reasoning, followed by those who continued to the end, writing their justifications on the board. Then, walk them through the expected value calculation for the final stage of Round One, showing clearly that the cost of eight hundred units outweighs the twenty percent chance of winning two thousand units, which yields an expected return of only four hundred. Ask them why they felt compelled to continue despite this negative expectation, and listen for answers referencing the money already spent, which is your cue to introduce the concept of sunk costs as resources that are gone regardless of future action. Next, shift the discussion to Round Two and the Trust Multiplier, asking if the decision to finish Round One was actually a fallacy if it secured a bonus in Round Two, using this to illustrate the nuance that while past costs are irrelevant, the habit of finishing can have independent future value. This allows you to validate the intuition that perseverance is good while distinguishing it from the error of counting sunk costs as a reason to continue.

  There is, however, a part of the philosophical dispute that this game cannot reproduce and must be supplied by your discussion, specifically the internal psychological cost of breaking a promise to oneself. In the game, the penalty for quitting is external and quantifiable via the multiplier, but in life, the damage of quitting often lies in the erosion of self-trust and the weakening of one's identity as a reliable agent, which is a slow-acting variable that a seventy-five-minute simulation cannot capture. You should explain to them that while the game models the reputational externalities of quitting, it cannot simulate the internal feedback loop where quitting makes future quitting easier, which is the core argument for why we sometimes honor sunk costs to maintain our own psychological integrity. Encourage them to consider that rationality involves optimizing for the long-term structure of their decision-making habits, not just the immediate expected value of a single bet, and that knowing when to quit is a skill that requires distinguishing between a project that is truly dead and one that is merely difficult. By leaving them with this distinction, you ensure they walk away not just with a warning against waste, but with a sophisticated understanding of when persistence is a virtue and when it is a vice.

  I hope this structure serves your workshop well and sparks the kind of lively disagreement that leads to genuine updating. It is always a pleasure to see these concepts passed on to a new generation, and I am confident your students will find the tension between the math and the money just as compelling as we do. Please feel free to adjust the numbers if you find the groups are running out of funds too quickly, as the specific values matter less than the ratio of cost to probability. I look forward to hearing how the Deep Sea Drill performs in the wild.

  Warmly,

  A Fellow Traveler
