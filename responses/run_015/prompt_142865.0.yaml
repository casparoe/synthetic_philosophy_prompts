ummary as a JSON object with exactly these fields and plain text values: setting, group_size, duration_minutes, core_mechanism_name, rules_summary, materials_list, payoff_scheme, debrief_mapping, predicted_first_run_failure, irreplaceable_feature, niche_injected_concept.
