answer: |-
  You have not merely reinvented a wheel; you have independently reconstructed a specific and well-known counterexample in the foundations of decision theory. The configuration you describe is known in the literature as the **Pasadena Game**.

  It was introduced by Alan Hájek and Harris Nover in their 2004 paper *"The Pasadena Game"* (and further elaborated in subsequent work by Kenny Easwaran and others). Your intuition that this differs from the standard St. Petersburg paradox is mathematically precise: where St. Petersburg has an **infinite** expectation, the Pasadena Game has an **undefined** expectation.

  Here is the "carving" you are looking for, separating the mathematical status, the decision-theoretic implications, and the relationship to the truncation argument.

  ### 1. The Mathematical Carving: Undefined vs. Infinite

  In standard measure-theoretic probability (the Kolmogorov framework), the expectation $E[X]$ of a random variable $X$ is defined as the Lebesgue integral $\int X \, dP$.

  For this integral to exist as a finite number, the variable must be **absolutely integrable**: $E[|X|] < \infty$.
  *   **St. Petersburg:** $X_n = 2^n$, $P_n = 2^{-n}$. $E[X] = \sum 1 = \infty$. The expectation exists but is infinite.
  *   **Pasadena (Your Variant):** $X_n = (-1)^{n-1} \frac{2^n}{n}$, $P_n = 2^{-n}$. The term-wise product is $\frac{(-1)^{n-1}}{n}$.
      *   Positive part expectation: $E[X^+] = \sum_{k=1}^\infty \frac{1}{2k-1} = \infty$.
      *   Negative part expectation: $E[X^-] = \sum_{k=1}^\infty \frac{1}{2k} = \infty$.

  Because both the positive and negative parts diverge, the expectation $E[X] = E[X^+] - E[X^-]$ involves the subtraction $\infty - \infty$. In standard analysis, **this is undefined.** It is not zero, it is not $\ln(2)$, it does not exist.

  The value $\ln(2)$ arises only if you treat the expectation as a Riemann series $\sum x_n p_n$ and enforce the **natural ordering** of the sample space (toss 1, toss 2, toss 3...). The Riemann Rearrangement Theorem tells us that for any conditionally convergent series, we can reorder the terms to sum to any real number (or diverge). Since the sample space $\Omega$ is mathematically an unordered set, standard integration theory refuses to privilege the "time order" of the coin tosses when defining the integral.

  ### 2. Does Truncation Rescue $\ln(2)$?

  You asked: *"Does the truncation argument I sketched actually rescue the logarithm of two, or does it assume what the rearrangement argument denies?"*

  This is the crux of the philosophical debate surrounding the Pasadena Game.

  **The Rearrangement View:** The truncation argument assumes that the *temporal sequence* of the outcomes is intrinsic to the value of the gamble. It privileges the enumeration $\omega_1, \omega_2, \dots$ over any other bijection from $\mathbb{N}$ to $\Omega$. Mathematically, this is an extra assumption not contained in the definition of the random variable itself. If you define the game purely by the probability mass function and the payoff values, the order is irrelevant, and the expectation is undefined.

  **The Physical/Process View:** However, a coin toss is a physical process. We cannot observe "the outcome where heads appears on toss $10^{100}$" without waiting for the intermediate tosses. The "time order" is physically privileged. If you cap the game by *time* (stop after $N$ tosses), the expected value is indeed the $N$-th partial sum, which converges to $\ln(2)$.

  **The Resolution (Weak Expectation):**
  Kenny Easwaran (2008) proposed a distinction that likely matches the "carving" you are groping at:
  *   **Strong Expectation:** The standard Lebesgue integral. Requires absolute convergence. For the Pasadena Game, this **does not exist**.
  *   **Weak Expectation:** The limit of the average payoff over $n$ repeated plays of the game as $n \to \infty$.

  Remarkably, while the Strong Expectation is undefined, the **Weak Expectation of the Pasadena Game is $\ln(2)$**. If you play this game many times, the average payoff will converge to $\ln(2)$ (in probability), even though the expected value of a single game is undefined. Easwaran argues that for decision theory, the Weak Expectation is often the physically relevant quantity, effectively validating your truncation intuition while acknowledging the mathematical pathology.

  ### 3. Decision Theoretic Implications

  You asked where the moral lands: *definition of expectation, countable additivity, admissibility of unbounded utility, or fair price?*

  1.  **Fair Price:** If you accept standard Von Neumann-Morgenstern (VNM) axioms, a gamble must have a definite utility to be comparable. Since the expectation is undefined, the Pasadena Game creates a gap in the preference ordering. You cannot rationally price this ticket using standard expected utility theory.
  2.  **Countable Additivity:** The paradox does not necessarily violate countable additivity of probability (the probabilities sum to 1). It violates the linearity of expectation when extended to non-absolutely convergent series.
  3.  **Unbounded Utility:** Like St. Petersburg, this requires unbounded utility. However, St. Petersburg can be "solved" by bounded utility functions (e.g., log utility). The Pasadena Game is more robust; even with bounded utility, if the probabilities and payoffs are structured to create conditional convergence, the problem can reappear (though less naturally).
  4.  **Dominance:** The Pasadena Game violates **Countable Additivity** in decision theory if one tries to assign it a value. If you assign it value $V$, you can construct a "Altadena Game" (Pasadena + $1$) which should be worth $V+1$, but the series manipulation makes this inconsistent.

  ### 4. Relation to the Two Envelopes Puzzle

  You noted they seem similar but for a different reason. You are correct.

  *   **Two Envelopes:** The paradox usually arises from an **improper prior** (a probability distribution that sums to $>1$ or $\infty$) or a confusion of conditional expectations. The expectation of the amount in your envelope is often infinite, or the conditional expectation $E[\text{other} | \text{current} = x]$ is calculated using inconsistent priors.
  *   **Pasadena:** The probability distribution is proper (sums to 1). The paradox arises strictly from the **conditional convergence of the utility series**.

  They are cousins in the "pathologies of infinity" family, but Two Envelopes is typically a Bayesian/Conditional probability error, whereas Pasadena is a Measure Theory/Integration error.

  ### 5. Recommended Literature

  To pursue this further, you should look at the following specific works. They address your exact hesitation regarding truncation and ordering.

  1.  **Nover, H., & Hájek, A. (2004). "Vexing Expectations." *Mind*, 113(450), 237-249.**
      *   The original paper introducing the Pasadena Game. They argue this shows Expected Utility Theory is incomplete.
  2.  **Easwaran, K. (2008). "Strong and Weak Expectations." *Mind*, 117(467), 633-641.**
      *   This is the most important paper for you. It explicitly distinguishes between the undefined integral and the convergent average (Weak Expectation), validating the intuition that $\ln(2)$ is the "physical" value despite the mathematical undefinedness.
  3.  **Seidenfeld, T., Schervish, M. J., & Kadane, J. B. (2009). "Preference for Equivalent Random Variables."**
      *   Discusses how rearrangements affect rational preference.

  ### Summary

  You have stumbled upon the **Pasadena Game**.
  *   **Mathematical Status:** The expectation is **undefined** (not infinite, not $\ln(2)$).
  *   **Truncation:** Your truncation argument privileges the temporal ordering of the sample space. This yields $\ln(2)$, which corresponds to the **Weak Expectation**.
  *   **The Moral:** Standard Expected Utility Theory (based on Strong Expectation) cannot handle this gamble. However, a decision theory based on long-run averages (Weak Expectation) can assign it the value $\ln(2)$.

  Your hesitation was well-founded: the "rearrangement worry" is mathematically fatal to the standard definition of expectation, but the "truncation argument" is physically fatal to the idea that the order doesn't matter. The literature resolves this by splitting the concept of expectation into two distinct tools.
