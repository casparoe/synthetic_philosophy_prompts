          1.  *Numbered List of Agreed Claims:* Canonical cases, explanatory targets, ruled-out solutions/desiderata.
          2.  *Disagreements Table:* Precise statement, why it matters, suspicion of verbal dispute + test.
          3.  *Crux List:* Sub-questions where agreement would change a view, concrete cases/arguments, predictions, serious concessions.
      *   **Tone/Constraint:** Fair, precise, non-resolving, signable by both without reservation.

  2.  **Deconstruct the Philosophical Positions:**
      *   *The WKR Problem:* Arises from the "Wrong Kind of Reasons" for attitudes (e.g., admiration, belief).
      *   *Canonical Cases:*
          *   *The Demon Case:* A demon threatens to punish you unless you admire him. You have a pragmatic reason to admire him, but intuitively, this isn't a reason *for admiring* (it doesn't make him admirable).
          *   *The Grant Case:* You get a grant if you believe a mediocre paper is excellent. You have a reason to *bring it about* that you believe, but is it a reason *for believing*?
      *   *Bifurcationist View:* There are two distinct types of reasons (object-given vs. state-given, or correctness-constituting vs. pragmatic). This distinction is fundamental.
      *   *Reductivist View:* There is only one kind of normative reason (usually tied to "ought" or "rationality"). The distinction is derivative or explanatory, not fundamental. We can explain the intuition without positing two *kinds* of reasons (e.g., via scope distinctions, or different normative properties).

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to establish common ground on the *data* before fighting about the *theory*.
      *   *Claim 1 (Cases):* Acknowledge the standard examples (Demon, Grant, Pascal's Wager variants).
      *   *Claim 2 (Intuitions):* Agree that there is a *difference* in intuition between "reason to admire" and "reason to want to admire."
      *   *Claim 3 (Target):* A theory must explain why WKR don't make the attitude fitting/correct.
      *   *Claim 4 (Ruled Out):* Simple "reasons for persons" vs. "reasons for attitudes" distinction is too crude (both agree it needs more nuance). Simple error theory is out (the intuitions are robust).
      *   *Refinement:* Ensure the wording doesn't sneak in metaphysical commitments (e.g., don't say "there *are* two kinds" in the agreement, just that there is a *distinction to be explained*).

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Column 1 (Statement):* Needs to be neutral but capture the core metaphysical/semantic dispute.
          *   *Bifurcationist:* The distinction is fundamental/primitive.
          *   *Reductivist:* The distinction is derivative/unified.
      *   *Column 2 (Why it matters):* Impacts the structure of normativity, the analysis of 'ought', and the unity of practical/theoretical reason.
      *   *Column 3 (Verbal Dispute):* Is it just about the word "reason"?
          *   *Test:* Paraphrase test. Can we state the theory without using the word "reason" and see if the disagreement persists? Or substitute "consideration counting in favor."

  5.  **Drafting Section 3: Crux List:**
      *   Need specific pivot points.
      *   *Crux 1: The Transparency of Reason.* Can we deliberate on WKR directly?
          *   *Case:* Trying to admire the demon.
          *   *Bifurcationist:* You can't deliberate on this directly; it's the wrong kind.
          *   *Reductivist:* You can, but it reveals a different normative force.
          *   *Concession:* If direct deliberation is possible, Bifurcationist loses "fundamental kind" claim. If impossible, Reductivist loses "unified deliberative scope."
      *   *Crux 2: The Normative Force of WKR.* Do WKR justify the attitude or just the cultivation of it?
          *   *Case:* Self-fulfilling belief (believing you will succeed helps you succeed).
          *   *Bifurcationist:* Reason to cultivate belief, not reason for belief.
          *   *Reductivist:* Reason for belief, but doesn't make belief true/fitting.
          *   *Concession:* If WKR can justify the attitude *as such*, Bifurcationist distinction blurs. If they never justify the attitude, Reductivist must explain why without bifurcation.
      *   *Crux 3: The "Fittingness" Primitive.* Is fittingness analyzable via reasons?
          *   *Argument:* The "Reasons First" vs. "Fittingness First" debate.
          *   *Concession:* If Fittingness is primitive, Bifurcationist wins. If Reasons are primitive and cover fittingness, Reductivist wins.

      *Refining Cruxes for Adversarial Collaboration:* The cruxes need to be things where *agreement* changes a view.
      *   *Crux 1: Deliberative Availability.* Can WKR figure in sound practical deliberation about *whether to F*?
      *   *Crux 2: The Explanation of 'Fittingness'.* Can 'fitting' be defined wholly in terms of 'reasons'?
      *   *Crux 3: The Scope of 'Ought'.* Does 'ought' cover both RKR and WKR equally?

  6.  **Review and Refine:**
      *   *Tone Check:* Is it neutral? Yes.
      *   *Accuracy:* Do the positions match the prompt's description?
          *   Bifurcationist: "Genuine normative joint."
          *   Reductivist: "Artifact of narrow conception," "Unified theory."
      *   *Formatting:* Numbered list, Table, List with sub-bullets.
      *   *Sign-off:* Add a signature block.

  7.  **Self-Correction during drafting:**
