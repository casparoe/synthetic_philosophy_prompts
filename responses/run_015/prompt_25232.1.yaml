answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Topic:** The Wrong Kind of Reasons (WKR) Problem
  **Participants:** The Bifurcationist & The Reductivist
  **Date:** October 26, 2023

  ## I. AGREED CLAIMS

  The undersigned agree to the following claims as the common ground for this collaboration. These claims establish the data and desiderata that any successful theory must accommodate, without committing to a specific metaphysical explanation of that data.

  1.  **Canonical Cases:** We agree that the following cases constitute the core data set for the WKR problem:
      *   *The Evil Demon:* An agent is threatened with torture by a demon unless they admire the demon. The threat provides a strong pragmatic consideration to *bring it about* that they admire the demon, but intuitively does not make the demon admirable.
      *   *The Grant:* An agent is offered a significant research grant conditional on believing that the grantor's mediocre work is excellent. The grant provides a consideration to *bring it about* that they hold the belief, but intuitively does not constitute evidence for the work's excellence.
      *   *Pascal's Wager Variants:* Considerations regarding the benefits of believing in God (e.g., eternal reward) provide reasons to cultivate belief, but intuitively do not count as evidence for God's existence.

  2.  **The Intuitive Distinction:** We agree that there is a robust, pre-theoretical intuitive distinction between:
      *   (A) Considerations that count in favor of an attitude in virtue of making the attitude **correct, fitting, or accurate** (e.g., the demon's wit makes him admirable).
      *   (B) Considerations that count in favor of **having** the attitude in virtue of the benefits, consequences, or requirements associated with being in that state (e.g., avoiding torture makes admiring the demon prudent).

  3.  **Explanatory Target:** We agree that a satisfactory account must explain why considerations of type (B) seem unable to render an attitude fitting or correct, even when they overwhelmingly recommend adopting the attitude. Specifically, the account must explain why one cannot typically adopt the attitude *directly* on the basis of considerations of type (B).

  4.  **Ruled-Out Solutions:** We agree that the following simplistic solutions are insufficient:
      *   *The Error Theory:* Denying that the intuitive distinction exists or claiming it is systematically mistaken is unacceptable, given the robustness of the intuitions in canonical cases.
      *   *The Simple Object/State Distinction:* Merely labeling reasons as "object-given" vs. "state-given" is a taxonomy, not an explanation. Both sides agree an account is needed for *why* this taxonomy tracks a normative difference (or why it merely appears to).
      *   *The "No Reasons" View:* Denying that pragmatic considerations are normative reasons *at all* is unacceptable; both sides agree that the threat of torture provides *some* kind of normative reason to act (e.g., to try to admire), even if it is not a reason for the attitude itself.

  5.  **Shared Desideratum:** Any proposed solution must preserve the normative force of pragmatic considerations (we *ought* to avoid torture) without collapsing the distinction between fittingness and prudence.

  ***

  ## II. DISAGREEMENTS TABLE

  | Precise Statement of Disagreement | Why It Matters (Downstream Consequences) | Suspicion of Verbal Dispute & Proposed Test |
  | :--- | :--- | :--- |
  | **The Metaphysical Status of the Distinction**<br><br>**Bifurcationist:** The distinction between RKR (Right Kind) and WKR (Wrong Kind) tracks a fundamental, primitive joint in normative reality. There are two distinct normative relations (e.g., *fittingness-support* vs. *reason-support*).<br><br>**Reductivist:** The distinction is not fundamental. There is only one normative relation (*reason-for*). The appearance of bifurcation arises from the different roles reasons play in deliberation or the different properties (fittingness vs. goodness) they explain. | **The Unity of Normativity:**<br>If the Bifurcationist is correct, normative theory requires a pluralistic foundation (e.g., separate axioms for ethics and epistemology, or fittingness and prudence).<br><br>If the Reductivist is correct, a unified theory of 'ought' and 'reason' is possible, potentially simplifying the architecture of metaethics and philosophy of action. | **Suspicion:** Both sides suspect the disagreement may hinge on the definition of "reason" or "kind."<br><br>**Test:** **The Paraphrase Test.**<br>We will attempt to restate our respective positions without using the word "reason" or "kind," substituting terms like "normative consideration counting in favor." If the disagreement persists when framed purely in terms of *what explains fittingness* vs. *what explains rationality*, the dispute is substantive. If the disagreement dissolves, it is terminological. |
  | **The Deliberative Constraint**<br><br>**Bifurcationist:** WKR are excluded from direct deliberation about whether to hold an attitude because they are the wrong *type* of input for that cognitive process.<br><br>**Reductivist:** WKR are not excluded by type, but by scope. They bear on the question of whether to *cause* oneself to hold the attitude, not whether the attitude is correct, but this is a pragmatic limitation, not a metaphysical one. | **Theory of Rational Agency:**<br>This determines whether we view agents as capable of responding directly to all normative reasons, or whether our cognitive architecture imposes hard limits on which reasons we can respond to directly. | **Suspicion:** Low. Both sides agree on the phenomenology of deliberation but disagree on the explanation.<br><br>**Test:** **The Intervention Test.**<br>We will examine cases of indirect self-manipulation (e.g., taking a pill to believe). If the Reductivist can show the WKR functions identically to RKR in the chain of justification, the bifurcation is less likely to be fundamental. |

  ***

  ## III. CRUX LIST

  The following are sub-questions such that, if both sides came to agree on the answer, at least one side would be compelled to revise their core position.

  ### Crux 1: The Analyzability of Fittingness
  *   **Sub-Question:** Can the property of "fittingness" (or correctness) be fully analyzed in terms of "there being sufficient reasons of the right kind," or is fittingness a primitive property that *generates* reasons?
  *   **Concrete Case/Argument:** *The Idiosyncratic Admirer.* An agent admires a demon solely because the demon has a witty sense of humor, ignoring the threat. The Bifurcationist argues this response is fitting because of the wit (RKR). The Reductivist argues the wit provides a reason that makes the admiration rational.
  *   **Predictions:**
      *   *Bifurcationist:* Predicts that "fittingness" cannot be reduced to "reasons" without circularity. Reasons of the right kind are defined by their relation to fittingness, not vice versa.
      *   *Reductivist:* Predicts that "fittingness" is analyzable as "the attitude supported by the balance of object-given reasons."
  *   **Serious Concessions:**
      *   *If Reductivist is right:* The Bifurcationist must concede that the "joint" is not metaphysical but conceptual/analytical.
      *   *If Bifurcationist is right:* The Reductivist must concede that "reasons" cannot be the sole primitive of normative theory; fittingness is equally fundamental.

  ### Crux 2: Direct Deliberative Availability
  *   **Sub-Question:** Is it *conceptually impossible* or merely *psychologically difficult* to adopt an attitude directly on the basis of WKR?
  *   **Concrete Case/Argument:** *The Successful Self-Fulfilling Belief.* An agent believes they will recover from an illness *because* believing so will increase their chances of recovery (and they know this). They successfully adopt the belief directly on this pragmatic ground.
  *   **Predictions:**
      *   *Bifurcationist:* Predicts this is a rare anomaly or a different attitude (e.g., "acceptance" rather than "belief"). If it is belief, it is irrational/incorrect, proving WKR cannot justify the attitude *as belief*.
      *   *Reductivist:* Predicts this shows WKR *can* justify the attitude, but the attitude's correctness conditions (truth) remain separate from its justificatory conditions (reasons).
  *   **Serious Concessions:**
      *   *If Bifurcationist is right:* The Reductivist must concede that there is a structural barrier in normativity that prevents WKR from justifying attitudes directly, supporting a bifurcated theory.
      *   *If Reductivist is right:* The Bifurcationist must concede that the "Wrong Kind" label is misleading; they are reasons of the right kind that simply don't guarantee truth/fittingness.

  ### Crux 3: The Scope of the Normative 'Ought'
  *   **Sub-Question:** Does a single, univocal normative 'ought' cover both RKR and WKR scenarios, or are there distinct 'oughts' (e.g., 'ought to believe' vs. 'ought to want to believe')?
  *   **Concrete Case/Argument:** *The Conflicted Agent.* An agent knows the evidence against a proposition is strong (RKR against belief) but the stakes of disbelief are catastrophic (WKR for belief). We ask: "What ought they to believe?"
  *   **Predictions:**
      *   *Bifurcationist:* Predicts the question is ambiguous. There is an epistemic 'ought' (don't believe) and a pragmatic 'ought' (bring it about that you believe). They do not aggregate.
      *   *Reductivist:* Predicts the question is univocal. The reasons aggregate into a single all-things-considered verdict, even if the belief remains false/unfitting.
  *   **Serious Concessions:**
      *   *If Bifurcationist is right:* The Reductivist must abandon the project of a unified theory of practical/theoretical reason.
      *   *If Reductivist is right:* The Bifurcationist must concede that the distinction between RKR and WKR does not track distinct normative authorities, but merely distinct outcomes of a single authority.

  ***

  **Signed:**

  _________________________ (The Bifurcationist)

  _________________________ (The Reductivist)

  _________________________ (Workshop Moderator)
