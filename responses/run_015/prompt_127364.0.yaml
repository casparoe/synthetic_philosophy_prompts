  The core tension lies between endurantism, where objects are wholly present at each moment, and perdurantism, where objects are extended spacetime worms composed of temporal parts. In material constitution, the former struggles with coincident entities occupying the same space, while the latter resolves this by allowing distinct worms to share specific temporal slices without being identical.

  1. Under four-dimensionalism, restoring an artwork replaces specific temporal parts rather than repairing a wholly present entity. This implies the restored piece is numerically distinct from the original spacetime worm despite maintaining causal continuity.
  2. Legal ownership claims over destroyed sculptures must shift from possessing a persistent substance to holding rights over specific temporal segments. Consequently, inheritance becomes problematic when the object's later stages cease to exist entirely.
  3. Radical deformation constitutes the termination of one spacetime worm and the initiation of another, rendering coherent survival impossible unless the deformation aligns with the object's defined temporal boundaries.
  4. This framework dissolves the coincidence puzzle by positing that the statue and clay merely share current temporal parts while diverging in their past or future extensions. Thus, material constitution is reconceived as partial overlap rather than total identity.
  5. Identity becomes a relation between temporal stages rather than strict numerical sameness across time, fundamentally altering how we assign responsibility for artistic integrity.
