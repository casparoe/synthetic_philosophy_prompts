          2.  Use/Exchange/Digital (Most novel, but risky).
          3.  Barren Money/Carbon (Most problematic).

      *   *Tractability:* Degrowth is too big. Needs narrowing. Digital is manageable.
      *   *Importance:* Degrowth is high stakes.
      *   *DOA:* Carbon Tax is the DOA candidate.

      *   *Wait, I need to make sure I don't just say "Degrowth is best."* I need to explain *why* it's the best *philosophical* project. It engages with Teleology. The others engage with Application. A dissertation needs philosophical depth.

      *   *Let's structure the "DOA" section carefully.* The Carbon Tax one rests on a confusion about what "barren" means. The Digital one rests on a confusion about "rivalry." The Degrowth one rests on a confusion about "scale" (household vs state). I need to point out how to avoid the DOA trap in the winning topic.

