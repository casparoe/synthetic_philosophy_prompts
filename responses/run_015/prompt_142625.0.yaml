      *   The Implicit Theory: Metric Monism & Latent Variable Realism.
      *   Strict Requirements vs. Pragmatic Fit.
      *   The Pluralist Alternative: Vector Governance & Deontological Constraints.
      *   Regulatory Intelligibility: From Risk Management to Constitutional Constraints.
