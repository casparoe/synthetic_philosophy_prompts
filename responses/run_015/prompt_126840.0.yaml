      *Self-Correction on Causation:* The user says "unplugging a ventilator... are all causing the death." On interventionism, *removing* the plug is an intervention. *Not replacing* the plug is also an intervention (in the model). The worry is that this erases the *category* of omission. I need to clarify that interventionism *can* distinguish omissions (as absence of intervention), but the user's worry is that morally they become equivalent.
