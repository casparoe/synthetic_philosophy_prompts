      *   *Refining the Empirical Worry:* If kids show the bias, is it innate morality or cognitive heuristic? If it's a heuristic (e.g., salience of motion), it supports the user (it's a proxy for cognitive ease, not moral truth). If it's innate *normative* structure, it challenges the user.

      *   *Refining the Ranking:*
          1.  **Fatal:** The "Minimal Pair" that controls for *all* proxies (including subtle agency/rights cues) and still yields divergent verdicts. (The "Pure Intuition" counterexample).
          2.  **Fatal/Serious:** The "Collapse" leading to explanatory emptiness. If "letting die" is just "causing by omission," and you say "causing is what matters," you haven't explained why we *feel* the difference. You've just erased the phenomenon.
