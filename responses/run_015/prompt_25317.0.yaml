          *   Pos B: No, it's just initial conditions. It looks like conspiracy only if you assume settings *could* have been otherwise (counterfactuals).
          *   Verbal?: Yes, "conspiracy" is loaded.
      *   *Point 3: Ontology of Causation.*
          *   Neutral: What does it mean to say the world is "nonlocal"?
          *   Pos A: It means Bell's Local Causality is violated. Influences (or dependencies) traverse spacelike intervals.
          *   Pos B: It means nothing travels. The correlation is common-cause (in the past). Locality is preserved.
          *   Verbal?: Substantive. One posits spacelike connection, one posits timelike common cause.
      *   *Point 4: Scientific Methodology.*
          *   Neutral: Does Superdeterminism render science impossible?
          *   Pos A: Yes, if we can't assume independence, we can't test theories.
          *   Pos B: No, we just need new methods to model the correlation function.

  5.  **Drafting Section 3: Cruxes:**
      *   Need specific things that would change minds.
      *   *Crux 1: A Model.* Superdeterminism needs a concrete, working model that reproduces QM without fine-tuning. (Pos A says unlikely, Pos B says work in progress).
      *   *Crux 2: Cosmological Initial Conditions.* If we find a physical mechanism (e.g., specific inflationary model) that naturally correlates $\lambda$ and settings.
      *   *Crux 3: Methodological Impact.* Can we formulate a version of superdeterminism that allows for *some* experimental testing? (e.g., 't Hooft's Cellular Automaton).
      *   *Crux 4: Causal Structure.* If we can define causation interventionally (Woodward), does SD fit?

