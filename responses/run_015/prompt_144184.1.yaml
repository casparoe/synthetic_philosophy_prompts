      *   *Potential Defeater 2: The "Moral Ecosystem" Ontology.* What *is* a moral ecosystem? Is it a metaphysical entity? If it's just a aggregation of human attitudes, isn't it reducible to human interest after all? (Nozick hates utilitarianism/aggregation).
