answer: |-
  This is a fantastic rabbit hole. You have the right instinct: most people treat counterfactuals as parlor games ("If Hitler died in WWI..."), but you're asking about the *structural integrity* of the alternative timeline. Given your logic background and the specific stakes (1929 Chicago is a singular node in the causal graph of the 20th century), here is how I would rank these lines of inquiry for a one-year deep dive.

  ### The Ranking

  **1. The Methodological Issue: Minimal-Rewrite Rules & Causal Coherence**
  **2. Pre-Digital Institutional Drift (Path Dependence)** *(I am inserting this here because it is the mechanism that makes #1 matter)*
  **3. The Philosophical Debate: Structural Forces vs. Individual Agency**
  **4. The Ethical Implication: Contingency and Moral Instability**

  ---

  ### Defense of the Ordering

  #### 1. Minimal-Rewrite Rules (The Engine)
  **Why it's upstream:** You cannot debate whether history is inevitable (Option 3) or whether your family deserves praise (Option 4) until you establish a coherent protocol for generating the alternative timeline. If your counterfactual is incoherent (e.g., "GGF moves to Chicago but somehow avoids the 1929 Crash while working in a factory"), the rest of the inquiry collapses.
  **Tractability for a Logic Mind:** This is essentially **possible worlds semantics** (David Lewis) applied to causal inference (Judea Pearl). You are looking for the "closest possible world" where the antecedent (GGF takes the job) is true.
  *   **The Work:** Study the "minimal rewrite rule." How many subsequent facts must you alter to maintain consistency? If GGF moves to Chicago, does he meet a different spouse? Do his children exist? If the children don't exist, does "your" obsession vanish?
  *   **Why prioritize:** It gives you a formal toolkit. You can draw causal graphs. You can define "distance" between worlds. It turns a vague worry into a solvable constraint satisfaction problem.

  #### 2. Institutional Drift / Path Dependence (The Transmission)
  **Why it's here:** You specifically asked about this, and it is the *only* thing that bridges the gap between a micro-choice (GGF's decision) and macro-history (the Great Depression/WWII/etc.).
  **The Connection to Inevitability:** This is where you defeat the "Structure Swallows Agency" argument. Structuralists argue the Crash was inevitable regardless of GGF. Path dependence argues that *how* the Crash impacted your lineage depended on bureaucratic lock-in.
  *   **The Concept:** Institutions (unions, banks, relief agencies) develop habits that persist long after their original purpose is gone. If GGF entered the Chicago factory system, he might have entered a specific union pension scheme. That scheme has inertia. It locks your family into a specific socioeconomic trajectory for 40 years.
  *   **Tractability:** Read W. Brian Arthur or Paul David on path dependence, and Douglass North on institutional economics. It's concrete. You can trace how a 1929 hiring decision locks into a 1950s mortgage eligibility, which locks into a 1970s school district.
  *   **Why it beats Structure/Agency:** It avoids the metaphysical swamp of "free will" and focuses on "sticky constraints." It explains how small contingencies become massive structural realities.

  #### 3. Structure vs. Agency (The Context)
  **Why it's lower:** This is the "God vs. Free Will" debate of history. It is notoriously unresolvable.
  **The Trap:** If you start here, you will read Marx, then Weber, then Braudel, and end up with two piles of notes that contradict each other. It is downstream of Methodology. You need to know *how* to model the counterfactual (Rank 1) before you can judge if structural forces would have corrected the deviation (Rank 3).
  **The Verdict:** Treat this as background noise. Assume both exist: Structures set the boundaries of the game; agency picks the moves. Your GGF story is interesting precisely because 1929 was a moment where structural boundaries were dissolving, maximizing agency.

  #### 4. Moral Instability (The Consequence)
  **Why it's last:** This is the emotional payoff, not the investigative engine.
  **The Logic:** If Rank 1 shows that the timeline is highly sensitive to initial conditions (chaos theory), then Rank 4 becomes true: praise and blame are unstable because luck dominates. If Rank 1 shows that history is an "attractor state" (it snaps back regardless of GGF's choice), then praise/blame is irrelevant because the outcome was fixed.
  **Why deprioritize:** You can't solve the ethics until you solve the mechanics. Spending a year on moral philosophy without knowing if the counterfactual holds water is premature optimization.

  ---

  ### The "Institutional Drift" Connection
  You asked if bureaucratic lock-in connects back to inevitability. **Yes, aggressively.**

  This is the concept of **Hysteresis**. In physics, it's when the state of a system depends on its history. In history, it means that once a bureaucracy forms to handle a crisis (like the New Deal agencies formed *because* of the 1929 Crash), it creates a new "normal."
  *   **If GGF stays:** He navigates the Depression in a rural/small-town context. Relief is informal.
  *   **If GGF goes:** He is in Chicago. He interacts with federal relief bureaucracies earlier. He becomes a data point in a new administrative system.
  *   **The Lock-in:** That administrative system creates categories (unemployed, unionized, relief-recipient) that define your family's legal and economic reality for generations.
  *   **The Inevitability Link:** This suggests history isn't "inevitable" in a grand sense, but it is "sticky" in a local sense. Once a path is taken, the cost of switching increases. This makes the 1929 decision *more* important, not less, because it selected which "sticky" path your family entered.

  ---

  ### What Would Change My Ranking?

  You asked: *What if micro-level counterfactuals almost never survive robustness checks?*

  If you dig into the methodology (Rank 1) and find strong evidence for **Convergent History** (the "Waterbed Effect"), my ranking flips.
  *   **The Scenario:** Suppose you find that even if GGF moves to Chicago, he gets laid off in 1930 anyway, moves back to the original location in 1935, and marries the same person. The macro-structures (the Depression, the Dust Bowl, the War) are so powerful they crush micro-variations.
  *   **The Shift:**
      1.  **Structure vs. Agency moves to #1.** If micro-choices don't survive, then structural forces are the dominant variable. You need to understand the structures, not the choices.
      2.  **Moral Instability moves to #2.** If outcomes are inevitable, then family pride/guilt is objectively unfounded. This becomes the most urgent philosophical realization.
      3.  **Minimal-Rewrite drops to #3.** It becomes a purely academic exercise with no bearing on actual outcomes.

  **How to test this early:**
  Don't spend a year guessing. Spend a month looking at **cliodynamics** or quantitative historical sociology (e.g., Peter Turchin or James Scott). Look for studies on "mobility persistence." If intergenerational mobility was near-zero in the 1930s regardless of location, the Structure argument wins. If location was the primary predictor of survival/outcome, the Agency/Path Dependence argument wins.

  ### Summary Recommendation for Your Year
  1.  **Months 1-3:** Learn **Causal Inference** basics (Pearl's *Causal Diagrams*). Apply it to your GGF story. Map the nodes.
  2.  **Months 4-6:** Study **Path Dependence** in economic history. Look specifically at labor markets in 1929 Chicago vs. your GGF's actual location.
  3.  **Months 7-9:** Read **Philip Tetlock** (*Virtual History*). He tackles the "minimal rewrite" problem explicitly with expert panels. See how often experts agree on counterfactuals.
  4.  **Months 10-12:** Synthesize. If the causal chain holds, then you have earned the right to worry about the Moral Instability (Rank 4).

  This keeps you in the "conceptual machinery" lane without drowning in historiography. You're building a model, not writing a biography.
