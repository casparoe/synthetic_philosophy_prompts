answer: |-
  This is a remarkably precise description of a well-known pathology in the field. You are right to suspect that the stagnation is not due to a lack of ingenuity on either side, but to a structural feature of the debate itself.

  Here is a diagnosis, structured for your lecture, followed by the requested mapping of settled/contested claims and flags on my own diagnostic commitments.

  ### 1. Diagnosis: Two Questions Sharing a Name

  Your hypothesis is close, but I would sharpen it. It is not merely a disagreement about whether the theory is "classificatory" or "interpretive." It is a conflation of **two distinct questions** that both use the word "content."

  1.  **The Metaphysical Question (Grounding):** In virtue of what does a physical state count as a representation *at all*? What natural relation turns a neural firing into a *aboutness* relation?
  2.  **The Explanatory Question (Individuation):** Which way of carving up representational states yields the best psychological/biological explanations of behavior?

  **The Teleosemanticist** is primarily answering Question 1. They want to naturalize normativity. They need a fact of the matter about whether the state is *wrong* (misrepresenting) even if the organism survives. For them, the translocation case is a test of whether normativity survives environmental shift. Their answer ("Predator-A, and it misrepresents") preserves the *history-dependent norm*.

  **The Informationalist** is often (though not always) answering Question 2, or a version of Question 1 that prioritizes current causal efficacy. They want to know what the state *does* for the system *now*. For them, the translocation case is a test of whether the state guides action successfully. Their answer ("Predator-ish-chemical" or "Indeterminate") preserves the *current causal relevance*.

  **Why the deadlock?**
  Because both sides assume **Monism**: they assume there is a single property, *Content*, that must satisfy both the metaphysical demand (naturalize normativity) and the explanatory demand (predict behavior).
  *   In your translocation case, the metaphysical demand points to History (Teleo).
  *   The explanatory demand points to Current Covariation (Info).
  *   Since no single property can be both wholly history-dependent and wholly current-dependent, the debate cycles. The Teleo side sacrifices explanatory granularity for normativity. The Info side sacrifices normativity for causal granularity.

  **Verdict on your options:**
  *   **Verbal?** No. They disagree on the structure of the world (whether selected functions are real properties).
  *   **Substantive-but-deep?** Yes, but specifically about the *nature of naturalization*.
  *   **Two questions sharing a name?** **Yes.** This is the most productive diagnosis.
  *   **Ill-posed?** Only if you accept the Monism assumption.

  ### 2. The Empirical/Psych Objection

  Your psych colleagues are not entirely wrong, but they are drawing the wrong conclusion.

  **What is empirically settled:**
  Neuroscience does not individuate states by "content" in the philosophical sense. It individuates by **causal role** (afferent/efferent connectivity, activation patterns, computational function). A neuron firing in the translocated fish is individuated by its input (Chemical B) and output (Alarm Behavior). Neuroscience does not care if that counts as "misrepresentation."

  **Why this doesn't dissolve the philosophy:**
  The philosophical problem arises when we try to bridge the gap between *causal role* and *intentional stance*. If we want to say the fish is *afraid* (not just alarm-disposing), we need a bridge principle.
  *   The Teleo bridge: It is afraid because the mechanism is *supposed* to detect predators.
  *   The Info bridge: It is afraid because the state carries information about danger (or did).

  **The Hidden Empirical Question:**
  There is no hidden empirical fact about the fish that will settle this. However, there is an empirical question about **cognitive architecture**: Do cognitive systems actually store information in a way that respects historical kinds, or only in a way that respects current statistical regularities?
  *   If learning mechanisms rapidly retune the alarm to Chemical B (plasticity), the Info view gains traction.
  *   If the mechanism is rigid and the organism behaves "maladaptively" relative to the new environment but "correctly" relative to the old design, the Teleo view gains traction.
  *   *Current Consensus:* Most biological mechanisms are a mix. This empirical messiness is why the philosophical clean-up fails.

  ### 3. What Counts as Progress?

  Given the "Two Questions" diagnosis, progress does not look like a knockout argument for one side. It looks like one of the following:

  1.  **Pluralism about Content:** Acknowledging that "Content-S" (Selected) and "Content-C" (Covariational) are distinct properties. We stop asking "Which one is *the* content?" and ask "Which one is relevant for this explanation?" (See: Nick Shea's *Representation in Cognitive Science*, or Ruth Millikan's later work on 'pushmi-pullyu' representations).
  2.  **Formal Result:** A demonstration that under specific constraints (e.g., stable environments), the two extensions converge, but in unstable environments (like your case), they diverge systematically. This turns the debate from "Who is right?" to "Where does the divergence matter?"
  3.  **Dissolution:** Arguing that "Content" is a folk-psychological term that has no place in a mature naturalistic science (Eliminativism/Deflationism). If the psych colleagues are right, the philosophical project is trying to naturalize a ghost. (See: Hutto & Myin, *Radicalizing Enactivism*).

  **Recommendation for the Seminar:**
  Shift the question from "What is content?" to "What work do we want content to do?" If the work is explaining error, Teleo wins. If the work is explaining learning/adaptation, Info wins. If the work is explaining neural implementation, neither wins.

  ### 4. Map: Settled vs. Contested

  *Caution: In this field, "settled" often means "agreed upon as the structure of the problem," not "agreed upon solution."*

  | Claim | Status | Notes |
  | :--- | :--- | :--- |
  | **Pure causal covariation (without asymmetry) cannot handle misrepresentation.** | **Settled** | Both sides agree Fodor's early "disjunction problem" is fatal to simple causal theories. |
  | **Pure selected history cannot handle novel environments (Swampman/Translocation).** | **Settled** | Both sides agree Teleosemantics struggles with entities lacking history or in radically new niches. |
  | **The translocation case creates a divergence between History and Current Covariation.** | **Settled** | This is the empirical setup of your case. Everyone agrees on the biology. |
  | **Normativity (the possibility of error) is a datum that must be explained.** | **Contested** | Teleo says Yes. Some Info theorists (and Psych colleagues) say "Error" is just causal mismatch, not semantic error. |
  | **Selected Functions are objective biological facts.** | **Contested** | Teleo says Yes (Millikan/Neander). Info/Critics say No (functions are ascribed by observers, Godfrey-Smith). |
  | **Content properties causally explain behavior.** | **Contested** | Info says Yes (content drives the system). Teleo says Content explains *success/failure*, not necessarily the *movement*. Psych says Neural properties explain movement; content is epiphenomenal. |
  | **There is a single property of "Content."** | **Contested (Implicit)** | The debate assumes this. Pluralists reject it. |

  ### 5. Flags on This Diagnosis

  As requested, here is where my diagnosis itself is vulnerable to criticism from defenders of the positions.

  **Flag 1: The Teleosemanticist Objection**
  *   *Critique:* A committed Teleosemanticist (e.g., Millikan, Neander) will reject the claim that they are answering a different question than the Informationalist. They will insist that *only* selected functions naturalize intentionality. They will argue that the Informationalist isn't offering a theory of *content* at all, but a theory of *correlation*.
  *   *Implication:* They will reject the "Two Questions" diagnosis as a concession. They will say: "There is only one question (Grounding), and we answered it. The Info side is changing the subject."
  *   *Lecture Note:* If you present the "Two Questions" view, expect the Teleo students to defend the unity of the concept.

  **Flag 2: The Informationalist Objection**
  *   *Critique:* A sophisticated Informationalist (e.g., Fodor with Asymmetric Dependency, or Dretske) will argue that history *is* part of the causal profile. They might argue that the "current covariation" is fixed by the learning history. They will reject the idea that they sacrifice normativity; they will claim their asymmetry conditions *define* error.
  *   *Implication:* They will argue the divergence in your translocation case is temporary. Once the system stabilizes, the content shifts. They see the Teleo view as magical thinking (ghosts of environments past).

  **Flag 3: The "Empirically Empty" Objection (Your Psych Colleagues)**
  *   *Critique:* They will reject the entire "Two Questions" framework. They will argue that *neither* question is scientific. To them, positing "Content-S" vs "Content-C" is like debating how many angels fit on a pinhead. The only real question is: "What are the neural mechanisms?"
  *   *Implication:* If this view is correct, my diagnosis is still too generous to the philosophers. It treats the debate as a deep conceptual confusion rather than a category error.

  ### 6. Summary for the Lecture

  If I were teaching this week, I would frame the deadlock not as a failure of argument, but as a **clash of explanatory interests**.

  1.  **Acknowledge the stalemate:** The arguments are valid; the premises are plausible; the conclusions contradict.
  2.  **Deploy the Translocation Case:** Use it not to solve the problem, but to reveal the divergence. Show that "Content" fractures under environmental stress.
  3.  **Propose the Diagnosis:** We are asking one word ("Content") to do two jobs (Ground Normativity vs. Track Causal Relevance).
  4.  **Invite the Psych Critique:** Ask if "Content" is the right level of analysis for a science of mind.
  5.  **Conclusion:** Progress requires either **Pluralism** (accepting two kinds of content) or **Eliminativism** (dropping content for causal role). The "One True Theory" project is likely the source of the stall.

  **Honest Answer:**
  Is it bedrock? **Yes.** It rests on whether you prioritize the *normative* aspect of intentionality (Teleo) or the *causal/nomological* aspect (Info). There is no neutral ground to arbitrate that priority without already assuming one side's definition of intentionality. If you want the seminar to move, stop trying to find the winner and start analyzing the cost of each choice.
