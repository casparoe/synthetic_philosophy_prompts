answer: |-
  Your hypothesis is correct, but it is not the whole story. You have accurately identified the *surface* structure of the impasse (three different questions), but the *deep* structure is a methodological incommensurability between two different conceptions of what economic theory is for.

  Here is the diagnosis of the disagreement, the refutation of your friend's objections, and an assessment of what progress looks like.

  ### 1. The Structure of the Disagreement: Ontology, Not Arithmetic

  You are right that Mises, Lange, and Hayek were answering different questions, but characterizing them merely as "prices," "computation," and "knowledge" understates the divergence. The conflict is between **Walrasian General Equilibrium** (Lange) and **Austrian Market Process** (Mises/Hayek).

  *   **Mises's Question (The Accounting Problem):** *Can value be imputed without property titles?* Mises argues that prices are not just numbers; they are expressions of entrepreneurial judgment regarding future scarcity. Without private ownership of the means of production, there is no genuine exchange, and therefore no price. Without price, there is no common denominator to compare input A vs. input B. This is an ontological claim: socialist prices are fictitious.
  *   **Lange's Question (The Engineering Problem):** *Can a system of equations be solved?* Lange accepts the Walrasian paradigm. He treats the economy as a static allocation problem. If we assume preferences and technologies are *given*, can a central board find the vector of prices that clears markets? His answer is yes, via trial and error (iterative tatonnement). He treats prices as parameters to be adjusted by an algorithm.
  *   **Hayek's Question (The Epistemological Problem):** *Where do the parameters come from?* Hayek grants Lange's math but attacks his premises. The data (preferences, local conditions, technological possibilities) are not "given" to a single mind (or board). They are dispersed, tacit, and often only revealed *through* the act of trading. Furthermore, the data change faster than the iteration can converge.

  **The Diagnosis:** The debate is not verbal, nor is it purely empirical. It is a **methodological clash**.
  Lange is working within a **physics-inspired model** of equilibrium (states, variables, convergence).
  Hayek is working within a **biology-inspired model** of coordination (adaptation, discovery, evolution).

  When Lange says "calculation is possible," he means "the solution exists and is computable *if* we have the data."
  When Mises/Hayek say "calculation is impossible," they mean "the data required for the calculation *do not exist* prior to the market process."

  Therefore, the impasse is not a standoff between two complete arguments on a shared question. It is a collision between a theory of **allocation** (Lange) and a theory of **learning** (Hayek).

  ### 2. Refuting the Complications

  Your friend's objections are standard, but they fail because they accept Lange's premises while trying to refute Hayek's conclusions.

  **A. The Operations Research Objection ("We have laptops now")**
  *   **The Claim:** Computational power solves the calculation problem.
  *   **The Refutation:** This confuses *processing* with *acquisition*. Mises and Hayek never argued that the human brain was too slow to solve the equations (though Hayek hinted at it). They argued that the **inputs** for the equations cannot be gathered without a market.
      *   In a market, I reveal my preference for apples over oranges by spending money.
      *   In a planned economy, I must tell the planner my preference. Why would I tell the truth? If I say I need more steel, I might get more steel. If I say I can produce more with less, my quota goes up.
      *   Even with infinite compute, if the input data are strategically distorted or simply non-existent (because the knowledge is tacit "know-how" held by a machine operator who cannot articulate it), the output is garbage.
      *   **Verdict:** This objection begs the question against Mises. It assumes the data exists to be computed.

  **B. The Amazon Objection ("Firms are planned economies")**
  *   **The Claim:** Large firms allocate resources by directive, not internal prices, and they succeed. Therefore, planning works at scale.
  *   **The Refutation:** This ignores the **boundary of the firm**. Firms exist *within* a market ecosystem.
      *   Amazon does not need to calculate the shadow price of silicon, electricity, or trucking fuel; the external market provides those prices. Amazon's internal planning is anchored by external market signals.
      *   If Amazon were the *only* entity in the economy (i.e., if the firm became the state), it would lose the external price anchors that make its internal calculation rational. It would have to determine the opportunity cost of silicon vs. labor without an external reference.
      *   Ronald Coase's theory of the firm explains that firms expand until the cost of internal organization equals the cost of using the market. A socialist state removes the market option entirely, forcing internal organization beyond the point of efficiency.
      *   **Verdict:** This objection begs the question against Hayek. It assumes the knowledge problem is solved by the external environment in which the firm operates.

  ### 3. Which Question is the "Real" One?

  If we must choose one, **Hayek's question is the fundamental one.**

  Mises's argument is strong, but it relies on a specific definition of "price" tied to property titles. A clever planner could argue, "We will simulate property titles."
  Lange's argument is mathematically sound but empirically empty. It proves that *if* the world were static and information were free, socialism would work.
  Hayek's argument destroys the *if*. He identifies that the economic problem is not merely allocating known resources to known ends, but **utilizing knowledge that is not given to anyone in its totality.**

  If Hayek is right, Lange's model is a solution to a problem that does not exist (static allocation), while ignoring the problem that does exist (dynamic discovery).

  ### 4. What Would Count as Progress?

  We should not expect a "verdict" in the sense of a mathematical proof or a definitive historical experiment, because the disagreement is partly philosophical. However, progress has occurred, just not in the terms of the 1930s.

  **A. Formal Progress: Mechanism Design Theory**
  The modern formalization of the Socialist Calculation Debate is **Mechanism Design** (Hurwicz, Maskin, Myerson).
  *   This field asks: Given that individuals have private information and incentives to lie, can we design a mechanism (a set of rules) that induces them to reveal the truth and achieves a specific outcome?
  *   **The Result:** The **Revelation Principle** and related impossibility theorems largely vindicate Hayek. They show that without specific property rights and incentive structures, efficient allocation is generally impossible because agents will not reveal private information truthfully.
  *   **Progress:** Moving the debate from "Can we compute?" to "Is it incentive-compatible?" is the major theoretical advance.

  **B. Computational Progress: Agent-Based Modeling (ABM)**
  Linear programming (Lange's tool) assumes static constraints. ABM allows for heterogeneous agents who learn and adapt.
  *   **Progress:** Simulations show that decentralized systems often find robust solutions to complex problems where centralized optimizers fail due to fragility or information lag. This provides computational evidence for Hayek's "competition as a discovery procedure."

  **C. Conceptual Progress: The Nature of Knowledge**
  The most significant progress is the recognition that **economic knowledge is not data.**
  *   Data is objective and transferable (e.g., "There are 50 tons of steel").
  *   Economic knowledge is often subjective and contextual (e.g., "This machine makes a noise that suggests it will break next week," or "Customers in this neighborhood prefer blue packaging").
  *   Progress lies in abandoning the view that the planner's problem is a data-processing problem.

  ### 5. Conclusion: Why No Final Verdict?

  You should expect no final verdict for two reasons:

  1.  **Paradigmatic Incommensurability:** As long as economics is dominated by the Walrasian equilibrium paradigm (which assumes given preferences and technologies), Lange's view will seem like the "default" and Hayek's view will seem like a philosophical add-on. As long as economics is viewed as a study of human action and ignorance (the Austrian view), Mises/Hayek will seem obvious. The profession largely chose Walras in 1950, which is why the debate "ended" with Lange ostensibly winning in the textbooks.
  2.  **The Counterfactual Problem:** We cannot run a controlled experiment of a democratic, non-authoritarian socialist economy with advanced technology. The historical failures of the USSR conflate the *calculation problem* with the *incentive problem* (authoritarianism, corruption). Defenders of socialism can always say, "That wasn't *real* socialism (Lange's model)," while defenders of the market can say, "That proves calculation is impossible."

  **Recommendation for your group:**
  Stop asking "Who won?"
  Start asking: **"Under what conditions does the price mechanism fail to encode information, and under what conditions does hierarchical planning fail to elicit it?"**

  That shifts the debate from ideology to **comparative institutional analysis**. The answer isn't "Markets good, Planning bad." The answer is "Markets are superior for discovering dispersed knowledge and coordinating complex supply chains; Planning is superior for internalizing externalities and providing public goods within the constraints of the information available."

  The SCD isn't a dead end; it's the foundation of Information Economics. Your friend is wrong that it's obsolete; she is just looking at the 1930s formulation rather than the modern mechanism design formulation. The debate is alive, it just changed its name.
