answer: |-
  You have identified the meta-ethical fault line that usually sinks these debates. Your friend is defending a *definition*; you are attacking a *political morality*. Luck egalitarianism (LE) often fails because it attempts to derive a political morality directly from a metaphysical definition of luck without bridging the gap of human vulnerability.

  To settle the argument, you need to move from "What is luck egalitarianism?" to "What must a luck-egalitarian theory *do* to function as a constitution for a society?" Below is the specification you requested. It breaks down the architectural load-bearing walls of the theory, identifies where the stress fractures appear, and isolates the impossibility result that likely underpins your disagreement.

  ### Part I: The Specification of Adequacy

  For a luck-egalitarian account to be adequate as a foundational principle of distributive justice, it must satisfy the following five requirements. Each includes the motivating case that forces the requirement.

  #### 1. The Principled Distinction Requirement
  **The Demand:** The theory must distinguish between *brute luck* (unchosen circumstances) and *option luck* (the result of calculated gambles) based on a criterion that is not circular. It cannot simply define "justice" as "neutralizing brute luck" and then define "brute luck" as "whatever justice should neutralize."
  **The Motivating Case:** *The Genetic Smoker.* Person A smokes because they enjoy it (preference). Person B smokes because they have a genetic addiction that makes cessation psychologically impossible without medical aid. A pure LE theory must explain why B's lung cancer is a claim on social resources while A's is not, without relying on a moralistic judgment about "bad habits."
  **Why it matters:** Without this, the theory is either tautological or arbitrary.

  #### 2. The Non-Trivial Responsibility Requirement
  **The Demand:** The account of choice/responsibility must be robust enough to justify inequality, but not so robust that it validates all existing inequalities. It must navigate between *hard determinism* (no one is responsible, so all inequality is brute luck) and *libertarian voluntarism* (everyone is responsible for their position, so no redistribution is owed).
  **The Motivating Case:** *The Uneducated Choice.* A person grows up in a culture where higher education is unseen and unvalued. They "choose" not to go to university. Is this option luck (a choice) or brute luck (a circumstance of socialization)?
  **Why it matters:** If the bar for "genuine choice" is too high, LE collapses into strict egalitarianism (everything is brute luck). If the bar is too low, it collapses into libertarianism (everything is choice).

  #### 3. The Endowment Sensitivity Requirement
  **The Demand:** The theory must compensate for unchosen disadvantages in natural and social endowments (disabilities, low talent, poor upbringing) without compensating for "expensive tastes" that the agent cultivates voluntarily.
  **The Motivating Case:** *The Disabled vs. The Connoisseur.* Person C is born with a mobility impairment requiring expensive equipment. Person D is born able-bodied but cultivates a taste for expensive champagne. Both need extra resources to reach the same welfare level. LE must compensate C but not D.
  **Why it matters:** This is the core intuition LE is built to serve. If it fails here, it is not luck egalitarianism.

  #### 4. The Epistemic Accessibility Requirement
  **The Demand:** For an outcome to count as option luck (and thus for the agent to bear the cost), the agent must have had reasonable access to information regarding the risks involved at the time of the choice.
  **The Motivating Case:** *The Asbestos Worker.* A worker in 1950 chooses not to wear a mask because the employer says it is safe. Later they get mesothelioma. Was this option luck? If the risk was concealed, it reverts to brute luck.
  **Why it matters:** This prevents the theory from blaming victims for risks they could not reasonably calculate.

  #### 5. The Non-Abandonment (Harshness) Requirement
  **The Demand:** The theory must not imply that society is permitted to let individuals fall into destitution, starvation, or severe deprivation solely because they made a bad voluntary choice.
  **The Motivating Case:** *The Reckless Motorcyclist.* A rider chooses not to wear a helmet (fully informed, voluntary). They crash and suffer permanent, debilitating brain injury. They can no longer work. A "Pure" LE suggests society owes them nothing, as this is option luck.
  **Why it matters:** If the theory mandates abandonment here, it violates the basic humanitarian constraint required of any *political* theory of justice.

  ---

  ### Part II: Desiderata vs. Smuggled Prejudices

  In your argument, you and your friend likely conflated genuine requirements for the theory with external ideological demands. Here is how to sort them:

  | Demand | Status | Analysis |
  | :--- | :--- | :--- |
  | **Inequalities must track responsibility.** | **Genuine Desideratum** | This is the definitional core of LE. Without it, the theory loses its distinctive value. |
  | **No one should starve.** | **Genuine Desideratum** | This is a constraint of *political legitimacy*. A theory of justice that mandates letting citizens die is practically self-refuting. |
  | **Redistribution must not punish prudence.** | **Genuine Desideratum** | If the prudent subsidize the reckless without limit, the theory violates fairness. |
  | **"You chose it, you keep it." (Libertarian)** | **Smuggled Prejudice** | This assumes property rights in one's luck are pre-political. LE is a theory of *distribution*, not property rights. |
  | **"Equality is the only value." (Strict Egalitarian)** | **Smuggled Prejudice** | LE explicitly trades off some equality for the sake of responsibility. Demanding total equality ignores the "Option Luck" clause. |
  | **"Needs trump choices." (Sufficientarian)** | **Smuggled Prejudice** | While the Non-Abandonment constraint is necessary, a full sufficientarian floor that ignores *why* someone is below the line undermines the LE incentive structure. |

  ---

  ### Part III: Negotiability and the Impossibility Result

  This is the critical section for your next argument. You asked which requirements are non-negotiable and whether they are jointly satisfiable.

  **The Non-Negotiables:**
  1.  **The Brute/Option Distinction:** If you remove this, you no longer have Luck Egalitarianism.
  2.  **The Non-Abandonment Constraint:** If you remove this, you no longer have a viable theory of *political justice* (you have a metaphysical puzzle).

  **The Negotiables:**
  1.  **The Currency of Justice:** Whether we equalize resources (Dworkin), welfare (Arneson), or access to advantage (Cohen). This is internal engineering.
  2.  **The Threshold of Risk:** How "reasonable" a risk must be to count as option luck.

  **The Impossibility Result (The Trilemma):**
  There is a strong philosophical case that the following three propositions are **jointly unsatisfiable** in a "Pure" Luck Egalitarian framework:

  1.  **Strict Responsibility:** Inequalities resulting from genuine option luck are just and require no redistribution.
  2.  **Basic Humanity:** No citizen should be left below a threshold of basic subsistence/dignity due to distributive rules.
  3.  **Real-World Epistemology:** In the real world, truly "genuine" choices (free from social coercion, ignorance, or psychological compulsion) are vanishingly rare.

  **Why they clash:**
  If you hold to (1) and (3), you find that almost no inequalities are truly "option luck," so you must redistribute almost everything (collapsing into Strict Egalitarianism).
  If you hold to (1) and (2), you must admit that sometimes people make genuine choices that ruin them, and you must bail them out anyway to satisfy (2). But if you bail them out, you violate (1).
  If you hold to (2) and (3), you end up with a Sufficientarian view where the *cause* of the deprivation matters less than the *fact* of it.

  **Conclusion on "Pure" Theory:**
  Your friend is defending a "Pure" version (Requirement 1 is absolute). You are objecting based on Requirement 5 (Non-Abandonment). **The "Pure" theory is impossible as a standalone political foundation.** It cannot satisfy the Non-Abandonment requirement without ceasing to be "Pure." It requires a hybrid structure (e.g., LE for inequalities above a threshold, Sufficientarianism below it).

  ---

  ### Part IV: The Bottleneck Requirement

  You asked for the single requirement that does the most work excluding candidate theories.

  **The Winner: The Non-Abandonment (Harshness) Requirement.**

  **Why:**
  This is the filter that kills the "Pure" Luck Egalitarian position.
  *   **Libertarianism** fails this immediately (it permits abandonment).
  *   **Strict Egalitarianism** passes this but fails the *Responsibility* requirement.
  *   **Pure Luck Egalitarianism** (Dworkin's earlier formulations, some readings of Cohen) struggles here. If they insist that the reckless motorcyclist gets *nothing*, they fail the requirement. If they say the motorcyclist gets *something*, they have to explain why this isn't a violation of their own core principle (that option luck costs should be borne by the chooser).

  Most contemporary luck egalitarians (like Elizabeth Anderson) argue that this requirement forces the theory to abandon its core focus on *distribution* and shift to *relational equality*. If you have to bail people out regardless of choice to avoid harshness, then "choice" stops being the primary determinant of justice.

  **How to use this:** Tell your friend: *"You can keep the Pure Theory, but you must accept that it mandates letting the reckless starve. If you find that conclusion repugnant, you have already accepted a constraint (Non-Abandonment) that breaks the Pure Theory. You are actually a Hybrid Theorist, not a Pure Luck Egalitarian."*

  ---

  ### Part V: Brief Scorecard on Contenders

  *   **Ronald Dworkin (Resource Egalitarianism):**
      *   *Strengths:* Excellent on Endowment Sensitivity (the insurance scheme).
      *   *Weaknesses:* Struggles with Non-Abandonment. The hypothetical insurance market is a fiction; in reality, people who "choose" not to insure (or can't afford to) are left behind.
  *   **Richard Arneson (Welfare Opportunity):**
      *   *Strengths:* Handles the "Genetic Smoker" better by focusing on expected welfare rather than outcomes.
      *   *Weaknesses:* Measurement problem. How do we measure "opportunity for welfare"? Also vulnerable to the Harshness Objection if the opportunity was there but the outcome was disastrous.
  *   **G.A. Cohen (Access to Advantage):**
      *   *Strengths:* Tries to mitigate harshness by distinguishing between "unchosen disadvantages" and "chosen costs."
      *   *Weaknesses:* Still collapses when the "chosen cost" is catastrophic. Cohen eventually moved toward a more communal ethos to patch this, admitting the distributive rule alone wasn't enough.
  *   **Elizabeth Anderson (The Critic):**
      *   *Verdict:* She argues the list of requirements proves LE is incoherent. She suggests the Non-Abandonment requirement should be the *foundation*, not an add-on, shifting the focus from "compensating for luck" to "ending oppressive social relations."

  ### Summary for Your Next Argument

  Your friend is treating Luck Egalitarianism as a **metaphysical claim** (What is the moral status of luck?). You are treating it as a **political claim** (How do we live together?).

  The specification above shows that a theory can be metaphysically consistent (Pure LE) but politically inadequate (fails Non-Abandonment). To have a "real theory of how a society ought to distribute," you must prioritize the **Non-Abandonment Requirement**.

  If your friend agrees that letting people starve is unjust, they must concede that **Choice cannot be the sole determinant of distribution.** At that point, you are no longer arguing about Luck Egalitarianism; you are arguing about where to draw the line between the "Luck" floor and the "Choice" ceiling. That is a productive argument. The previous one was not.
