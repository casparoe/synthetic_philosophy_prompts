answer: |-
  # Q&A Prep Sheet: Simpson's Paradox, Adherence, and Collider Bias

  **Context:** Methods Grand Rounds, School of Public Health.
  **Audience:** Mainstream Epi/Biostats. Fluent in DAGs/PO. Skeptical of ITT (too conservative). Sympathetic to Per-Protocol/Adherence analyses.
  **Goal:** Defend ITT as unbiased for *assignment*; characterize adherence-stratified reversal as collider bias artifact.

  ---

  ### 1. The Clinical Utility Objection (Most Damaging)
  **Objection:** "I understand the causal diagram, but clinicians don't prescribe 'randomization assignment.' They prescribe drugs to patients who will take them. If ITT dilutes the effect because of noncompliance, aren't you advocating for an estimand that is scientifically correct but clinically useless? We need to know the effect in adherers to make prescribing decisions."

  *   **Concede:** ITT does not estimate the biological effect of *taking* the drug. It estimates the effect of *being assigned* to the treatment policy.
  *   **Hold:** Simple stratification by adherence does *not* estimate the effect in adherers either; it estimates a biased mix of treatment effect and prognostic selection.
  *   **2-Minute Reply:** "You are right that clinicians care about the effect of treatment receipt. But the stratified analysis you are sympathetic to does not give you that. It gives you the effect of treatment *plus* the effect of being the kind of person who adheres. In my example, the drug had zero effect, yet adherers died more often. If you prescribe based on that stratified estimate, you withhold a neutral drug from patients who are likely to adhere, believing it harms them. If you want the effect in adherers, you need an Instrumental Variable (CACE) or G-estimation, which rely on untestable assumptions. But you must not mistake the biased stratified estimate for the causal effect. ITT is the only estimate that requires no assumptions about post-randomization behavior."
  *   **Weakest Point:** Acknowledging that CACE is the "real" answer might undermine the defense of ITT as the primary takeaway.

  ### 2. The "Old News" Objection (Most Likely)
  **Objection:** "This is standard causal inference 101. We all know conditioning on a post-treatment collider induces bias. Serious trialists haven't used simple adherence stratification for causal inference in decades; we use Instrumental Variables or Per-Protocol analyses with inverse probability weighting. What is the novel contribution here?"

  *   **Concede:** The theoretical mechanism (collider bias) is well-established in the methods literature.
  *   **Hold:** Despite this, stratified tables are routinely published and interpreted causally in top medical journals, often by the very people in this room.
  *   **2-Minute Reply:** "Theoretically, you are correct. But empirically, look at the last issue of *NEJM* or *Lancet*. Subgroup tables by adherence are standard, and the discussion sections often interpret these differences as biological heterogeneity or safety signals. This talk isn't for the causal inference theorists in the front row; it's a reminder for when we review grants or papers. We know better, but we still do it. My goal is to align our peer review standards with our theoretical knowledge. We shouldn't let the 'standard practice' of publishing stratified tables legitimize a biased estimator."
  *   **Weakest Point:** Risks sounding preachy or dismissive of the audience's expertise.

  ### 3. The Safety Signal Objection
  **Objection:** "Even if the stratified estimate is biased for efficacy, isn't it still a valid descriptive safety signal? If patients who take the drug die more often than those who don't, shouldn't we investigate that, regardless of the causal structure?"

  *   **Concede:** It is a valid *descriptive* association within the trial arm.
  *   **Hold:** It is a misleading *safety* signal because it conflates drug toxicity with the underlying prognosis that drove adherence.
  *   **2-Minute Reply:** "It is a signal of *association*, not toxicity. In the example I showed, the drug was inert. The 'signal' was entirely driven by sicker patients being more motivated to adhere. If you treat this as a safety signal, you trigger expensive follow-up studies or halt a trial based on an artifact. A better safety analysis compares the *assigned* treatment arm to the *assigned* control arm (ITT), or uses methods that adjust for the prognostic factors driving adherence. Relying on the stratified descriptive statistic prioritizes a visible bias over a hidden truth."
  *   **Weakest Point:** Hard to dismiss "safety" concerns without sounding like you are ignoring patient welfare.

  ### 4. The Effect Modification Objection
  **Objection:** "You've shown us a null example. But in reality, treatment effects often vary by adherence. Maybe the drug *is* harmful to adherers because of a biological interaction. How do you distinguish your collider bias from true effect modification without just assuming the null?"

  *   **Concede:** True effect modification by adherence status is possible (e.g., dose-response).
  *   **Hold:** Simple stratification cannot distinguish effect modification from selection bias.
  *   **2-Minute Reply:** "That is precisely the problem. The stratified estimate is the sum of the causal effect and the selection bias. Without strong assumptions or an external anchor, you cannot disentangle them. In my example, I *knew* it was bias because I simulated the data. In real data, you don't know. That is why you cannot interpret the stratified estimate as evidence of effect modification. To claim effect modification, you need to show the interaction persists in a CACE framework or is supported by baseline predictors of adherence, not the post-treatment adherence variable itself."
  *   **Weakest Point:** Admitting that in real data, you can't distinguish bias from truth without assumptions weakens the certainty of the thesis.

  ### 5. The Time-Varying Objection
  **Objection:** "Your DAG treats adherence as a baseline binary variable. In most trials, adherence is longitudinal and time-varying, and past adherence affects future prognosis and future adherence. Doesn't this simple collider story break down with time-varying confounding?"

  *   **Concede:** The static DAG is a simplification of a complex longitudinal process.
  *   **Hold:** The fundamental collider problem persists and often worsens in longitudinal settings (time-dependent confounding).
  *   **2-Minute Reply:** "You are right that the reality is more complex. In longitudinal settings, adherence at time *t* is a collider for assignment and health status at *t-1*. Conditioning on it opens bias paths at every time step. This doesn't invalidate the thesis; it strengthens it. Simple stratification is even *less* defensible in longitudinal settings. The solution isn't stratification; it's Marginal Structural Models or G-estimation. The takeaway remains: do not condition on post-treatment variables without a structural model."
  *   **Weakest Point:** Requires the audience to accept that you know the solution (MSM) works better, which invites questions about the assumptions of MSM.

  ### 6. The Transportability Objection
  **Objection:** "ITT is unbiased for this trial, but the effect of assignment depends on the trial's specific adherence rate. If adherence is 50% here but 90% in practice, the ITT doesn't transport. The adherence-stratified effect seems more transportable to a clinical setting where we ensure adherence."

  *   **Concede:** ITT is specific to the trial's context and adherence levels.
  *   **Hold:** The stratified estimate does not transport either, because the *selection bias* structure (the correlation between prognosis and adherence) will differ in the clinic.
  *   **2-Minute Reply:** "The stratified estimate transports the bias, not just the effect. In the trial, adherence might be driven by side effects. In the clinic, it might be driven by insurance coverage. The correlation between prognosis and adherence changes, so the magnitude of the collider bias changes. You cannot transport a biased estimator and expect it to become unbiased. If you want transportability, you need to model the causal mechanism (CACE), not the biased descriptive strata."
  *   **Weakest Point:** Acknowledges ITT limitations without fully solving the transportability problem.

  ### 7. The Measurement Error Objection
  **Objection:** "Adherence is notoriously hard to measure (self-report vs. pill count). If adherence is misclassified, doesn't that attenuate the bias? Maybe the reversal you show relies on perfect measurement of the collider."

  *   **Concede:** Measurement error complicates the bias structure (often attenuating it).
  *   **Hold:** Measurement error does not eliminate the bias; it makes it unpredictable and potentially worse (differential misclassification).
  *   **2-Minute Reply:** "Measurement error doesn't fix the causal structure; it just adds noise. If misclassification is differential—for example, sicker patients over-report adherence—you might still see a reversal, or you might mask a real effect. Relying on a mismeasured post-treatment variable to guide causal inference is doubly dangerous. It's better to rely on the randomized assignment, which is measured without error, than the adherence variable, which is both a collider and mismeasured."
  *   **Weakest Point:** A technical quibble that might distract from the main causal argument.

  ### 8. **THE "HOPE NOBODY ASKS" OBJECTION: The Identifiability Objection**
  **Objection:** "You've demonstrated that stratification is biased using a simulation where you *knew* the truth was null. In real data, we don't know the truth. Without untestable assumptions like the Exclusion Restriction or Monotonicity required for IV/CACE, how do you actually *know* the stratified result is bias and not a real harmful effect? Aren't you just swapping one untestable assumption (stratification is unbiased) for another (IV assumptions)?"

  *   **Concede:** We cannot empirically prove the stratified estimate is bias without assumptions.
  *   **Hold:** We *can* prove theoretically that stratification is biased under the DAG you all accept. ITT requires *fewer* assumptions (only randomization).
  *   **2-Minute Reply:** "This is the crux. You are correct that distinguishing bias from truth requires assumptions. My argument is not that ITT reveals the biological truth without assumptions. It is that ITT reveals the *randomized* truth without *post-randomization* assumptions. Stratification requires the assumption that 'Adherence is not a collider,' which contradicts the DAG we all agree on. CACE requires Exclusion Restriction. Yes, both require assumptions. But stratification requires an assumption we *know* is false (that adherence is independent of prognosis given assignment). So while we can't prove the specific numeric bias in your trial, we know the *method* is structurally invalid. ITT is the conservative anchor; everything else floats away from it."
  *   **Weakest Point:** **This is the vulnerability.** It forces an admission that ITT doesn't answer the biological question, and that *any* method recovering the biological effect (CACE) relies on assumptions just as strong as the ones being criticized. It exposes that the talk critiques a naive method without fully validating the sophisticated alternatives in the absence of known truth.
