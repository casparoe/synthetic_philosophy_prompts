  Dear Friend,

  I have been giving some thought to the puzzle you presented regarding your graduate school friend and her strikingly consistent verdicts on various decision-theory cases. It is a fascinating exercise to reverse-engineer the implicit algorithm driving her choices, and based on the data you provided, I believe I can offer a confident assessment of her underlying framework, her likely responses to the upcoming seminar topics, and how we might further probe the boundaries of her reasoning.

  The pattern of her past verdicts points strongly toward Causal Decision Theory, often abbreviated as CDT. To see why, we must look closely at how she handled the Smoking Lesion and the XOR Blackmail cases, as these are the most diagnostic. In the Smoking Lesion problem, where smoking is merely evidence of a lesion that causes cancer rather than a cause of cancer itself, she chose to smoke. This immediately rules out Evidential Decision Theory, which would advise against smoking because doing so provides bad news about one's health. By smoking, she demonstrated that she cares only about the causal consequences of her actions, not the evidential correlations. However, the true tell is her response to the XOR Blackmail setup. In that scenario, a perfect predictor sends a message if and only if either the agent pays or termites exist, but not both. Functional Decision Theory and Updateless Decision Theory typically advise paying in this case because the agent's decision policy logically determines whether the letter is sent in the first place, thereby ensuring the letter only arrives in the world where termites are absent. Your friend, however, refused to pay. This is the hallmark of Causal Decision Theory, which treats the sending of the letter and the presence of termites as fixed past facts that her current payment cannot causally influence. Her behavior in the coin-flip Newcomb case and the ordinary blackmail case is consistent with this, as CDT agents two-box when prediction is removed and refuse to pay when no causal leverage exists.

  Given that she appears to be running Causal Decision Theory, I can predict with high confidence what she will say about next week's cases. In the standard Newcomb problem with a ninety percent accurate predictor, she will almost certainly take both boxes. A CDT agent reasons that the money is already in the boxes or not, and her choice now cannot causally affect the predictor's past action, so taking both yields more money regardless of the content. In the counterfactual mugging case, where the coin has already landed tails and she is asked for money, she will refuse to pay. Since the coin flip is a past event and the offer in the heads world is a counterfactual that did not happen, her payment now has no causal power to bring about the reward in the other branch. Finally, in Parfit's hitchhiker case, once she is safely in town and the driver cannot retaliate, she will refuse to pay the reward. From her perspective, the rescue is a completed past event, and paying now only reduces her wealth without causally securing any benefit.

  While Causal Decision Theory is the best fit, there are alternative rules that could explain her past behavior. For instance, she might be following a simple heuristic such as never paying money in response to post-facto demands or threats, which would cover the blackmail cases, the hitchhiker scenario, and the counterfactual mugging. This heuristic would also be consistent with the Smoking Lesion case since smoking is not a payment. However, this rule becomes ambiguous in the standard Newcomb problem, where one-boxing is technically taking money rather than paying it, though a strict interpretation might still lead her to two-box. To distinguish between pure Causal Decision Theory and a heuristic like never pay extortion, the standard Newcomb problem is the best of the three new cases you listed. Because Newcomb's problem does not involve a threat or a demand for payment, her verdict there will rely purely on her handling of prediction and correlation rather than any aversion to coercion. If she two-boxes, it reinforces the CDT hypothesis over the heuristic, as the heuristic has no clear purchase on a non-adversarial prediction case.

  That said, if you wish to settle the question more cleanly than any of the three upcoming cases allow, I would suggest presenting her with the Psychopath Button case. In this scenario, she is told that only psychopaths press a certain button, and pressing it kills all psychopaths. She is not a psychopath, but she knows that anyone who presses the button must be one. A Causal Decision Theory agent will press the button because pressing it does not causally make her a psychopath, whereas an Evidential or Functional Decision Theory agent will refrain because pressing is strong evidence or logical proof of being a psychopath. This case isolates the distinction between causal and evidential reasoning without the confounding variables of blackmail, human drivers, or opaque boxes, providing the sharpest possible test of whether she truly ignores evidential links in favor of causal ones. I hope this analysis helps you prepare for the seminar, and I would be keen to hear how she actually responds when the time comes.

  Warmly,

  Your Colleague
