prompt: |-
  Hey — imagine you're the outside reviewer for a small foundation that's decided to spend something like four million dollars over five years on the premise that a society's dominant moral emotion is something you can deliberately nudge, and that guilt is the better one to nudge toward. The board is already sold on that; your job is to tell them which questions to actually buy answers to first, before the money goes out the door, and which parts of their premise are assumed rather than established.

  I dont want a survey of the guilt/shame literature or a reading list. I want a defended ordering: which open questions you'd fund, in what sequence, and why — judged on things like how much of the rest of the program depends on the answer, whether it's answerable in five years by people doing conceptual plus empirical work rather than needing a generation of actual cultural change, and how likely the answer is to change what they'd do with the money. Say explicitly what you'd deprioritize because its answer wouldn't move anything downstream, and what evidence in the first two years would push items up or down the list.

  A few things I keep running into, which you should feel free to tear apart or replace with better ones: (a) the asymmetry that guilt seems to come with an exit ritual — confession, apology, repair — while shame seems to have no discharge at all except concealment or expelling the person, which would make the choice between them really a choice about institutions and rituals rather than about feelings; (b) the worry that guilt is more audience-dependent than it looks, since feeling guilty seems to require an imagined victim or judge, so the story about guilt as the internalized, self-directed, autonomous emotion may be overstated; (c) the possibility that guilt versus shame isn't the load-bearing axis at all — maybe what matters is whether the emotion points at something repairable, or whether it has any exit route, or something else, and the binary is crowding out a third family of responses (indignation, contempt, disgust) that the board should be spending on instead.

  And take the title question seriously: can a culture choose here, or is that a category mistake about how moral emotions change? If you think the whole choose-your-moral-emotion framing is confused, say so and tell them what to fund instead.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Outside Reviewer for a small foundation.
      *   **Budget:** $4 million over 5 years.
      *   **Premise:** A society's dominant moral emotion can be deliberately nudged, and guilt is better than shame.
      *   **Task:** Defend an ordering of open questions to fund *first*. Identify assumptions vs. established facts. Deprioritize low-impact questions. Define triggers for reprioritization. Address the "category mistake" possibility (can a culture choose?).
      *   **Constraints:** No literature survey/reading list. Focus on strategic funding allocation. Address specific user-provided hypotheses (a, b, c).
      *   **Tone:** Critical, strategic, pragmatic, philosophical but actionable.

  2.  **Deconstruct the Foundation's Premise:**
      *   *Core Claim 1:* Moral emotions are levers for social change.
      *   *Core Claim 2:* Guilt is superior to Shame.
      *   *Core Claim 3:* A culture can "choose" or be "nudged" toward one dominant emotion on a 5-year timeline.
      *   *Risk:* This is high-risk. Psychology and sociology don't usually move that fast. $4M is peanuts for cultural engineering but decent for research/pilots.

  3.  **Evaluate the User's Hypotheses:**
      *   *(a) Exit Rituals:* Guilt = repair; Shame = concealment/expulsion. This is the strongest functional argument for guilt. It shifts focus from *feeling* to *institution*.
      *   *(b) Audience Dependence:* Guilt requires a victim/judge. Challenges the "internalized/autonomous" narrative. Important for implementation (who is the audience?).
      *   *(c) Wrong Axis:* Maybe "repairability" matters more than guilt/shame. Or maybe indignation/disgust are the real drivers. This challenges the core binary.

  4.  **Develop the Strategic Framework (The "Review"):**
      *   *Goal:* Maximize the value of information (VOI). Spend money on questions that, if answered, change the strategy.
      *   *Timeline:* 5 years is short for cultural change, long enough for pilot studies and conceptual clarification.
      *   *Budget:* $4M. Need to allocate wisely.

  5.  **Drafting the Ordering (The "Defended Ordering"):**

      *   *Priority 1: The Mechanism of Choice (Can we actually do this?)*
          *   If cultures can't choose their dominant moral emotion, the rest is moot.
          *   Focus: Historical/Anthropological case studies + Behavioral pilots.
          *   Why: Highest risk. If "No," stop funding.
      *   *Priority 2: The Functional Axis (Guilt/Shame vs. Repair/Expel)*
          *   Test hypothesis (c). Is the binary real?
          *   Focus: Experimental psychology + Institutional analysis.
          *   Why: If "Repairability" is the key, we might not need to nudge guilt specifically, just repair mechanisms.
      *   *Priority 3: The Institutional Vehicle (Rituals vs. Feelings)*
          *   Test hypothesis (a).
          *   Focus: Designing/Testing specific rituals.
          *   Why: Implementation depends on this.
      *   *Priority 4: Audience & Autonomy*
          *   Test hypothesis (b).
          *   Focus: Social psychology.
          *   Why: Refines the "how," but less likely to kill the project than P1 or P2.

  6.  **Addressing the "Category Mistake" (The "Hard Truth"):**
      *   The prompt asks to take this seriously. I need to challenge the idea that a foundation can "choose" a moral emotion like picking a software update.
      *   Moral emotions are emergent properties of material conditions, power structures, and narratives.
      *   *Recommendation:* If the "choice" premise is weak, fund *institutional design* that *elicits* guilt-like responses (repair) without necessarily trying to engineer the *emotion* itself.

  7.  **Refining the Funding Allocation (The $4M):**
      *   Year 1-2: Heavy on research/definition (P1 & P2). ~$1.5M.
      *   Year 3-4: Pilots/Interventions (P3). ~$2M.
      *   Year 5: Evaluation/Dissemination. ~$0.5M.
      *   *Kill Switch:* If P1 fails, pivot or close.

  8.  **Addressing Specific User Hypotheses:**
      *   (a) *Exit Rituals:* Elevate this. It's the most actionable insight. Fund the design of rituals, not just the study of feelings.
      *   (b) *Audience:* Important nuance. Fund research on "who is the victim?" in abstract societal harms (climate, inequality).
      *   (c) *Wrong Axis:* This is the biggest threat. Fund a "Red Team" to attack the guilt/shame binary.

  9.  **Structuring the Response:**
      *   **Executive Summary:** Direct answer to the "Category Mistake" question.
      *   **The Assumptions Audit:** What is assumed vs. established.
      *   **The Funding Queue (Priorities 1-4):** With rationale and "Kill Criteria."
      *   **Deprioritized List:** What not to fund.
      *   **Triggers for Reprioritization:** What evidence changes the plan.
      *   **Final Recommendation:** The pivot if the premise is flawed.

  10. **Self-Correction/Refinement during drafting:**
      *   *Initial thought:* Maybe suggest funding media campaigns.
      *   *Correction:* No, $4M is too small for mass media cultural change. Focus on *mechanisms* and *local pilots*.
      *   *Initial thought:* Accept the Guilt > Shame premise.
      *   *Correction:* As a reviewer, I must challenge it. Hypothesis (c) is crucial. If "Repair" is the variable, not "Guilt," the strategy changes.
      *   *Tone Check:* Ensure I sound like a reviewer, not a collaborator. Critical but constructive.
      *   *Timeline Check:* 5 years is tight. Emphasize that "cultural change" won't be visible, but "mechanism validation" will.

  11. **Final Polish:** Check against all constraints in the prompt. (No reading lists, defended ordering, address a/b/c, address category mistake). *Self-correction: Make sure to explicitly state what evidence in years 1-2 moves items up/down.*

  12. (Drafting the response based on these points...)
answer: |-
  **To:** The Board of Directors
  **From:** External Review Committee
  **Re:** Strategic Allocation of $4M Moral Emotion Initiative (5-Year Horizon)

  ### Executive Summary: The Category Mistake Warning

  You have asked me to order questions for funding. Before I do, I must address the title question: *Can a culture choose its dominant moral emotion?*

  **My verdict: No, not directly.** Treating "guilt" or "shame" as a dial a foundation can turn is a category mistake. Moral emotions are not free-floating preferences; they are emergent properties of specific institutional arrangements, power dynamics, and narrative structures. You cannot fund a campaign to "make people feel more guilt" any more than you can fund a campaign to "make people prefer feudalism."

  However, you *can* fund the **institutional and ritual architectures that elicit specific emotional responses.** If guilt is associated with repair and shame with expulsion, you do not fund "guilt promotion"; you fund **repair mechanisms.**

  Therefore, my funding order prioritizes validating the *mechanism* over validating the *emotion*. If the mechanism (repair) works, the emotion (guilt) is a byproduct, not the target. This distinction saves you from trying to engineer psychology directly, which is expensive and ethically fraught, and focuses you on engineering institutions, which is actionable within five years.

  ---

  ### Part I: The Assumptions Audit

  Before spending a dollar, the Board must acknowledge which parts of your premise are theology and which are data.

  1.  **Assumed:** That "Guilt" and "Shame" are stable, cross-cultural categories.
      *   *Reality:* Anthropological data suggests these are Western constructs. In many cultures, the distinction collapses. Funding must account for the possibility that you are measuring a linguistic artifact, not a psychological universal.
  2.  **Assumed:** That Guilt is inherently pro-social and Shame is inherently anti-social.
      *   *Reality:* Pathological guilt leads to depression and paralysis; "honor shame" can enforce strong community cohesion. The binary is too clean.
  3.  **Established:** That *repairability* correlates with better social outcomes than *exclusion*.
      *   *Reality:* Restorative justice data supports this. This is your strongest load-bearing beam.
  4.  **Assumed:** That a $4M intervention can shift a "dominant moral emotion" in 5 years.
      *   *Reality:* Impossible. You must redefine success as **proving the viability of specific nudges** in localized contexts, not shifting the culture at large.

  ---

  ### Part II: The Defended Funding Order

  I have ordered these four research/practice clusters by **Value of Information (VOI)**. If Question 1 fails, the rest of the program is worthless. If Question 4 fails, you just tweak the messaging.

  #### Priority 1: The "Repairability" Hypothesis (Testing Hypothesis C)
  *   **The Question:** Is the Guilt/Shame binary the actual driver of outcomes, or is it merely a proxy for **Repair vs. Expulsion**?
  *   **The Work:** Fund a "Red Team" of anthropologists and experimental psychologists to design scenarios where Shame leads to repair and Guilt leads to paralysis. Simultaneously, fund small-scale institutional pilots (e.g., school disciplinary boards, corporate HR processes) that mandate repair rituals regardless of the emotion felt.
  *   **Budget:** $1.2M (Years 1-3)
  *   **Why First:** If Hypothesis (c) is correct—that the binary is crowding out the real variable—your entire strategy is mislabeled. You might find that funding "indignation" (which drives enforcement of repair) is more effective than funding "guilt." You need to know if you are buying "guilt" or buying "repair protocols."
  *   **Kill Criteria:** If data shows that repair rituals fail to reduce recidivism/conflict *unless* accompanied by specific emotional states you cannot control, the program pivots to emotional regulation training or shuts down.

  #### Priority 2: The Institutional Vehicle (Testing Hypothesis A)
  *   **The Question:** You noted guilt comes with an exit ritual (apology/repair) while shame leads to concealment. Is the *ritual* the cause of the emotion, or the result?
  *   **The Work:** Do not fund awareness campaigns. Fund **Ritual Design.** Create specific, repeatable scripts for apology and restitution in three distinct sectors (e.g., a tech community, a local municipality, a religious group). Measure if enforcing the *script* generates the *feeling* of guilt/responsibility, or if it just generates compliance.
  *   **Budget:** $1.5M (Years 2-5)
  *   **Why Second:** This is your implementation path. If cultures can't choose emotions, they can choose rituals. If you can standardize a "Guilt Exit Ritual," you bypass the need to engineer the feeling directly.
  *   **Kill Criteria:** If participants perform the rituals cynically (as "box-checking") without behavioral change, the ritual approach is dead.

  #### Priority 3: The Audience Problem (Testing Hypothesis B)
  *   **The Question:** Guilt requires a victim/judge. In systemic harms (climate, inequality), the victim is abstract. Can guilt be nudged without a concrete face?
  *   **The Work:** Narrative and media pilots. Test messaging that personifies abstract victims vs. messaging that emphasizes abstract principles. Determine if "Guilt" collapses when the "Judge" is invisible.
  *   **Budget:** $800k (Years 3-4)
  *   **Why Third:** This refines *how* you deploy the rituals from Priority 2. If guilt requires a face, your interventions must focus on local, interpersonal harm, not systemic abstraction. This limits your scale but increases success probability.
  *   **Kill Criteria:** If "abstract guilt" proves psychologically impossible to sustain, you must restrict the foundation's scope to interpersonal/local issues only.

  #### Priority 4: The Stability of the Shift
  *   **The Question:** If we successfully nudge a group toward guilt-based repair, does it stick, or does it revert under stress?
  *   **The Work:** Longitudinal tracking of the Priority 2 pilots. Stress-test the groups during a crisis.
  *   **Budget:** $500k (Years 4-5)
  *   **Why Last:** This is evaluation. It doesn't inform the strategy; it justifies the expenditure to future donors.

  ---

  ### Part III: What to Deprioritize (The "Do Not Fund" List)

  1.  **General Public Awareness Campaigns:** $4M is too small to move the needle on national culture, and too large to waste on ads that don't test a mechanism. Do not fund "Guilt is Good" billboards.
  2.  **Pure Neuroscience/Biology of Guilt:** Understanding the fMRI signature of guilt won't tell you how to build a better school discipline policy. It's interesting but low-VOI for a 5-year social program.
  3.  **Historical Surveys of Guilt:** We know enough history. We don't need another book on Puritan guilt. We need forward-looking pilots.
  4.  **Shame Eradication:** Do not fund anti-shame campaigns. Shame is a functional social immune system. The goal is not to kill shame, but to prevent it from becoming the *dominant* response to error. Funding "anti-shame" often triggers a shame response about feeling shame.

  ---

  ### Part IV: Triggers for Reprioritization (Years 1-2)

  You asked what evidence would move items up or down. Here are the specific tripwires:

  *   **Move Priority 3 (Audience) to #1 IF:** Early pilot data shows that participants cannot identify a victim in your test cases. If they say "I broke the rule" but not "I hurt *someone*," the guilt mechanism is broken. You must solve the victim-visibility problem before designing rituals.
  *   **Move Priority 2 (Rituals) to #1 IF:** The Red Team (Priority 1) confirms that the emotion doesn't matter, only the behavior does. If "fake it till you make it" works (i.e., forced apology leads to reduced conflict regardless of felt guilt), you skip the psychology and fund the scriptwriting immediately.
  *   **Terminate Program IF:** In Year 2, the "Repair" pilots show that enforced apology increases resentment or polarization. This would indicate that without the authentic emotion, the ritual is toxic.

  ### Part V: The Reviewer's Recommendation

  The Board's premise contains a fatal optimism: that moral emotions are levers. They are not; they are dashboard lights. You cannot fix the engine by taping over the "Check Engine" light (shame) and installing a new one (guilt).

  **My recommendation is to pivot the mission statement.**
  Do not fund "Nudging Society Toward Guilt."
  Fund **"Designing Institutions for Repair."**

  If you fund the *architecture of repair* (restorative justice circles, corporate restitution protocols, community mediation), you will likely get the "guilt" response as a downstream effect, because guilt is the emotional correlate of acknowledging a debt that can be paid.

  If you fund "guilt" directly, you risk creating a culture of neurotic self-flagellation without repair (pathological guilt).

  **Final Allocation Advice:**
  Spend the first $1.5M (Years 1-2) entirely on **Priority 1 and 2 combined.** Treat them as one R&D stream: *Can we build a ritual that forces repair, and does that ritual generate the desired psychological state?*

  If the answer is yes by Month 24, spend the remaining $2.5M scaling those specific rituals. If the answer is no, return the remaining capital. Do not drift into "awareness" or "education" just to keep the money moving.

  This approach respects the complexity of human psychology while giving you a concrete product (a protocol/ritual) to show for the investment, rather than a vague hope that the culture "felt different."
