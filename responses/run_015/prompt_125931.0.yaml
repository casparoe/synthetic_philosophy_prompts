  My opening. Build a decoder for one subject. For a few weeks you wake her out of REM and record what she says; then you train a model that maps her brain activity over the last two minutes before waking onto the sequence of events in her report. Now two fresh nights. Night one: you don't wake her, you just record, and the decoder reads off a clean order — she is on a train, the train halts between fields, a woman in a red coat gets on — and then you do wake her, and she reports exactly that, in that order. Night two: the decoder again reads off train, halt, red coat; but when you wake her she says no, it was a bus, nobody got on, and it wasnt a sequence at all, it was all there at once. So the decoder and the report agree in one case and come apart in the other.

