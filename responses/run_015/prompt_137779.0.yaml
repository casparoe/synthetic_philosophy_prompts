prompt: |-
  I chair the clinical guidelines committee at my hospital, a role I took up in January and was not prepared for. In March a large pragmatic trial reported against a practice our unit has recommended for twenty years. Nine months on we have still not changed the guidance, and not because anyone has found a flaw in the trial. A majority of the committee keeps reasoning, more or less out loud: what the trial appears to show cannot be true, since we know the practice works, so the trial must be misleading somewhere. I have come to believe this is not only stubbornness or vested interest but a structural feature of how a well-supported belief meets contrary evidence, and I want the committee to see the structure. What I need is a plan for a single forty-five-minute session with them in the new year: fourteen people, mostly senior clinicians plus two lay members, one whiteboard, no slides, and no usable way of saying the word dogmatism without the room closing.

  The argument as I currently have it is this. If I am justified in believing H, and the new evidence E is incompatible with H, then my justification for H is already a reason to think E is misleading. If E is misleading, it is not a reason to doubt H. So a principle that sounds like plain rational stability, the principle that you should not abandon a well-supported belief on the strength of evidence you have reason to distrust, appears to license never revising anything at all. My own guess is that the damage is done by the slide from H entails that E is misleading to H explains why E came out looking the way it does, and that the legitimate cases are the ones where the explanation of the apparent counter-evidence is a further hypothesis one could go and test on its own. But I cannot get that distinction to land when I try to say it in the room.

  So I would like the plan rather than the explanation. What has to be established before the argument can even be stated, and in what order, and what depends on what in a way I cannot reorder. Should I run it with full belief and outright rejection first, or go straight to degrees of confidence: these people live in confidence intervals and p-values, and the binary version may strike them as a philosopher's toy. Which single example should carry the whole thing, and what must it have and what must it lack: I tried a medical example and they simply re-litigated the medical example, so it cannot be one about which they hold a view, and I have been considering a historical case in which an apparent anomaly was explained by an auxiliary hypothesis that was then independently confirmed by pointing an instrument at a predicted location, though I suspect that example either does all the work or smuggles in precisely the thing at issue.

  Then the misconceptions, and the point in the sequence at which to head off each. I expect at least four. Some will conclude that no belief is ever rationally revisable and some will conclude the opposite, that one is entitled to discount whatever one likes, and I would rather neither of those be the takeaway. Several will say that this is just confirmation bias with the serial numbers filed off, and I need to know where that objection is actually right and where it misses the target, since I would rather concede the overlap early than have it raised as a debunking at the end. One member reads a little philosophy and will have heard dogmatism used for a thesis about whether perceptual experience can justify belief without independent reason to trust the senses, so he will think the word means something other than what I mean and I need to know whether to disarm that at the start or let it surface. And at least one will say that a Bayesian update settles the whole matter, which I suspect is both true and inert: true because conditioning does rank the cases correctly, inert because it does not by itself say why the discounting move feels compelling.

  The part I expect to be hardest is the twenty years of experience objection. It is fair, and I do not want to defeat it, because a well-supported belief really is entitled to a higher bar than a hunch; the disease seems to be the bar rising without limit rather than rising at all. Where in the sequence does that point belong, and what has to be in place for it to be heard as a concession rather than as a capitulation?

  Finally: what should I openly refuse to explain in forty-five minutes and say that I am refusing, and what question can I put to them in the last five minutes whose answers would show me they have hold of the distinction rather than of a slogan?
reasoning: |-
  Here's a thinking process that leads to the suggested plan:

  1.  **Analyze the User and Context:**
      *   **Role:** Chair of a Clinical Guidelines Committee.
      *   **Situation:** Took role in Jan (unprepared). Large pragmatic trial in March contradicted 20-year-old unit practice. 9 months later, no change.
      *   **Problem:** Committee members (senior clinicians + 2 lay) are stuck in a loop: "We know H works, so E (trial) must be wrong." They see this as rational stability, not dogmatism.
      *   **Goal:** A 45-minute session plan to help them see the *structure* of the problem (the distinction between $H$ entails $E$ is misleading vs. $H$ explains *why* $E$ looks misleading via a testable auxiliary).
      *   **Constraints:** 14 people, 1 whiteboard, no slides, no using the word "dogmatism" (triggers defensiveness).
      *   **User's Intellectual Level:** High. They understand epistemology (justification, entailment, auxiliary hypotheses, Bayesian updates). They want a *plan*, not just an explanation. They want to know the *order of operations*.

  2.  **Deconstruct the Epistemological Core:**
      *   The user's argument: Justified Belief ($H$) + Incompatible Evidence ($E$) $\rightarrow$ Reason to think $E$ is misleading $\rightarrow$ $E$ doesn't undermine $H$. This creates a closed loop (immunization).
      *   The Solution: Distinguish between *dismissing* $E$ because of $H$ vs. *explaining* $E$ using $H$ + Auxiliary ($A$), where $A$ is independently testable.
      *   Key Distinction: "This evidence is wrong because I'm right" vs. "This evidence looks wrong because of [Specific Mechanism], and we can check for that mechanism."

  3.  **Address Specific User Queries/Constraints:**
      *   **Order of Operations:** What must be established first? (Shared epistemic norms before specific application).
      *   **Binary vs. Probabilistic:** Clinicians live in CIs and p-values. Binary logic might feel like a "philosopher's toy." Need to bridge this.
      *   **The Example:** Cannot be medical (they will re-litigate). Needs to be historical or physical, but not too abstract. The user suggested a historical anomaly/instrument case. *Decision:* Use a non-medical, high-stakes physical example where the "auxiliary hypothesis" was testable. (e.g., Neptune/Uranus vs. Mercury/Vulcan, or a navigation error). Let's go with the **Neptune vs. Vulcan** distinction. It perfectly illustrates "saving the theory via a testable auxiliary" (Neptune) vs. "saving the theory via an untestable/failed auxiliary" (Vulcan).
      *   **Misconceptions:**
          1.  *Nothing is revisable.*
          2.  *Anything can be discounted.*
          3.  *It's just confirmation bias.* (Need to concede overlap but distinguish structure).
          4.  *Philosophical "Dogmatism".* (Avoid the word, address the concept if raised).
          5.  *Bayesian Update.* (Acknowledge it, but note it doesn't solve the *psychological/structural* hurdle of generating the auxiliary).
      *   **The "20 Years Experience" Objection:** This is valid. High prior probability *should* raise the bar for new evidence. The problem is the *infinite* bar. Need to place this *after* the structural distinction is made, so it's seen as a parameter setting, not a veto.
      *   **Refusals & Final Question:** What to cut? (Deep Bayesian math). Final question needs to test application of the distinction.

  4.  **Drafting the Plan - Section by Section:**

      *   **Preparation (The Whiteboard):** Needs to be set up before they arrive. Two columns.
      *   **Opening (5 mins):** Set the tone. No blame. Focus on "Epistemic Hygiene." Acknowledge the trial without debating the trial.
      *   **The Core Distinction (15 mins):** This is the meat. Use the Non-Medical Example.
          *   *Why not binary?* Frame it as "Weight of Evidence" but keep the logic binary for clarity on the board, then translate to probability. Actually, the user asked: "Should I run it with full belief... or go straight to degrees of confidence?" *Decision:* Start with the logical structure (binary) to show the *loop*, then translate to confidence (Bayesian) to show the *cost*. Clinicians understand logic gates and flowcharts.
          *   *Example:* Uranus orbit anomaly. Newtonian Physics ($H$). Observation ($E$).
          *   *Path A (Good):* Maybe another planet ($A$). Go look. Found Neptune.
          *   *Path B (Bad):* The telescope is biased because the theory is true. Don't look.
      *   **Addressing Misconceptions (10 mins):** Weave this into the discussion of the example.
          *   *Confirmation Bias:* Acknowledge it. The structure *enables* bias if the Auxiliary isn't testable.
          *   *Bayesian:* Write $P(H|E)$. Show that $P(E|H)$ is low only if you assume the Auxiliary.
          *   *20 Years Experience:* This is the Prior $P(H)$. High prior is fine. Infinite prior is the problem.
      *   **Application to Current Situation (10 mins):** Bring it back to the trial. Do not debate the trial. Debate the *process* of evaluating the trial.
      *   **Closing (5 mins):** The Refusal and The Question.

  5.  **Refining the "20 Years Experience" Point:**
      *   This needs to be a concession. "You are right to trust experience."
      *   Placement: After the structural distinction. If placed before, it justifies the status quo. If placed after, it becomes a variable in the new framework.
      *   Framing: "Experience raises the bar for the *Auxiliary*, not the *Evidence*."

  6.  **Refining the "Dogmatism" Word:**
      *   User says: "no usable way of saying the word dogmatism without the room closing."
      *   Strategy: Don't say it. If the philosophy-reading member brings it up, acknowledge the term exists but pivot to "Immunization Strategies" or "Epistemic Closure."

  7.  **Refining the Bayesian Objection:**
      *   User suspects it's "true and inert."
      *   Strategy: Agree it's the *math* of the situation, but the *work* is in specifying the likelihood ratio. The "inertia" is failing to specify the alternative hypothesis (the Auxiliary).

  8.  **Final Question Design:**
      *   Needs to force them to generate a testable auxiliary, not just dismiss.
      *   "What specific, observable feature of the trial data would we need to find to justify our skepticism *without* referencing our prior success?"

  9.  **Review against Constraints:**
      *   45 mins? Yes, tight timing.
      *   14 people? Need to manage discussion.
      *   Whiteboard only? Yes.
      *   No "Dogmatism"? Yes.
      *   Plan focus? Yes.

  10. **Self-Correction/Polishing:**
      *   *Critique:* Is the Uranus example too cliché?
      *   *Fix:* It's cliché for a reason—it works. But make sure to emphasize the *search* for Neptune, not just the discovery. The *action* of testing the auxiliary is the key.
      *   *Critique:* Will clinicians accept a physics example?
      *   *Fix:* Frame it as "Error Analysis," which they do in labs.
      *   *Critique:* The user asked about Binary vs. Confidence.
      *   *Fix:* I need to explicitly answer this in the plan. Start with Logic (to show the paradox), move to Confidence (to show the cost).
      *   *Critique:* The "20 years" objection.
      *   *Fix:* Ensure the plan explicitly schedules this *after* the structural distinction is drawn.

  11. **Final Polish of the Plan Structure:**
      *   **Phase 1: Setup & Safety (5 min)**
      *   **Phase 2: The Logical Trap (10 min)** - Binary logic to show the loop.
      *   **Phase 3: The Escape Route (10 min)** - The Auxiliary Hypothesis (Uranus).
      *   **Phase 4: Translating to Clinical Confidence (10 min)** - Priors, Bayes, and the "20 Years" point.
      *   **Phase 5: Application & Close (10 min)** - Refusal & Final Question.

      *(Self-Correction during drafting)*: Wait, 45 minutes is very short for 14 people. I need to be prescriptive about *who talks*. The Chair must control the whiteboard.
      *(Refining the "Refusal")*: Refuse to solve the specific trial in the room. Refuse to calculate exact priors.
      *(Refining the "Final Question")*: Make it about the *mechanism of error*, not the *truth of the guideline*.

  12. **Final Review of User's Specific Questions:**
      *   *Order:* Logic -> Structure -> Probability -> Application.
      *   *Binary vs Confidence:* Use Logic to reveal the paradox, Confidence to resolve it.
      *   *Example:* Uranus/Neptune (Testable Auxiliary) vs. Ad Hoc rescue.
      *   *Misconceptions:* Address Confirmation Bias as a risk of the structure, not the structure itself. Address Bayes as the math, not the method.
      *   *20 Years:* Place in Phase 4.
      *   *Refusal/Question:* Defined in Phase 5.

      *Let's write the response.*
answer: |-
  This is a delicate epistemic intervention. You are not trying to change their minds about the guideline in this session; you are trying to change the *rules of engagement* by which they evaluate evidence. If you succeed, the guideline change becomes a downstream consequence. If you fail, you remain stuck in the loop of "Trust Us vs. Trust The Trial."

  Here is the plan for the forty-five-minute session.

  ### I. Pre-Session Setup (The Whiteboard)
  Before they enter, draw a flowchart on the left side of the board. Leave the right side blank.
  **Left Side:**
  1.  **Belief H** (High Confidence)
  2.  **Evidence E** (Incompatible with H)
  3.  **Arrow from H to E:** "E is likely misleading."
  4.  **Arrow from E to H:** "H remains justified."
  5.  **Label:** "The Stability Loop."

  ### II. The Sequence (45 Minutes)

  #### Phase 1: Framing and Safety (0–5 Minutes)
  **Goal:** Lower defensiveness. Establish that this is about *process*, not the specific trial.
  **Action:** Do not mention the trial's findings or the guideline's content.
  **Script:** "We have a disagreement between twenty years of unit experience and a new pragmatic trial. This is a healthy tension. But for nine months, our discussion has stalled. I believe we are stuck in a structural loop, not a factual one. Today, we are not deciding the guideline. We are deciding how we decide. I want to look at the logic of how experienced clinicians handle contradictory data, because getting this wrong risks patient safety either by abandoning good practice too soon or keeping bad practice too long."

  #### Phase 2: The Logical Trap (Binary First) (5–15 Minutes)
  **Goal:** Demonstrate the paradox using binary logic.
  **User Question:** *Should I run it with full belief or degrees of confidence?*
  **Answer:** **Start with Binary.** Clinicians use probabilities, but the *logical error* is binary. If you start with confidence intervals, they will argue about the width of the interval. Start with the structure of the justification.
  **Action:** Point to the Left Side of the board.
  **Script:** "If I am justified in believing H, and E contradicts H, rationality suggests I should scrutinize E. If E is flawed, H stands. This looks like stability. But notice the loop: My justification for H is the *only* reason I have to distrust E. If I distrust E, I have no reason to lower confidence in H. This structure allows a belief to become immune to any evidence, forever. That is not stability; it is insulation."
  **Check:** Ask the room: "Is there any possible evidence that could enter this loop and change H?" (Wait for silence). "If the answer is no, the system is broken."

  #### Phase 3: The Escape Route (The Example) (15–25 Minutes)
  **Goal:** Distinguish between *dismissing* evidence and *explaining* it via a testable auxiliary.
  **User Question:** *Which single example?*
  **Answer:** **The Discovery of Neptune (1846).** It is physical, high-stakes, and separates "saving the theory" from "testing the error."
  **Action:** Move to the blank Right Side of the board. Draw two columns: **Neptune** vs. **Vulcan**.
  **Script:** "In 1840s astronomy, Newtonian Physics (H) predicted Uranus's orbit. Observations (E) showed Uranus was in the wrong place.
  *   **Path A (Neptune):** Astronomers hypothesized an *auxiliary fact*: A hidden planet is pulling it ($A$). This $A$ made a new prediction: Look at *this* spot in the sky. They looked. They found Neptune. H was saved, but only because $A$ was independently tested.
  *   **Path B (Vulcan):** Later, Mercury's orbit didn't fit. They hypothesized another hidden planet ($A$). They looked for decades. Never found it. Eventually, they had to change H (General Relativity)."
  **The Distinction:** "The difference isn't that they trusted Newton. It's that in Path A, the reason for the error became a *new object of investigation*. In Path B, the reason for the error was just 'the theory is right.'
  **Rule:** We are allowed to discount E if H is strong, *only if* we can specify an Auxiliary Hypothesis ($A$) that explains the error, and $A$ is testable *independently* of H."

  #### Phase 4: Translating to Confidence & The "20 Years" Objection (25–35 Minutes)
  **Goal:** Address the Bayesian objection and the "20 Years Experience" point.
  **User Question:** *Where does the "20 years" point belong?*
  **Answer:** **Here.** It belongs after the structural distinction is established. If you raise it earlier, it sounds like a veto. Here, it is a *parameter*.
  **Action:** Erase the Binary Loop on the Left. Write: $P(H)$ = Prior Confidence.
  **Script:** "Someone will say, 'But Bayesian updating settles this.' Yes, mathematically. If $P(H)$ is high, $E$ shifts it less. But Bayes requires us to state *why* $E$ is unlikely given $H$. That 'why' is the Auxiliary.
  Now, the 'Twenty Years' objection. You are right. Twenty years of success means $P(H)$ is very high. That raises the bar for $E$. It does *not* remove the requirement for $A$.
  **Concession:** Experience entitles you to a higher bar for the *Auxiliary*. You can demand stronger proof that the trial was flawed.
  **Limit:** Experience does not entitle you to *no* Auxiliary. If the only explanation for the trial's failure is 'The trial is wrong because we are right,' that is Path B (Vulcan). We need a specific, testable mechanism of trial failure."

  #### Phase 5: Misconceptions & Closing (35–45 Minutes)
  **Goal:** Head off the "Confirmation Bias" and "Dogmatism" objections, refuse the unanswerable, and test understanding.

  **Handling Misconceptions:**
  1.  **Confirmation Bias:** "Is this just confirmation bias? Yes, structurally. This framework is designed to *catch* bias. Bias says 'Ignore E.' This framework says 'Explain E via A, then test A.' If you won't test A, it's bias."
  2.  **Philosophical Dogmatism:** If the philosophy-reading member raises it: "You may know 'dogmatism' as a thesis on perceptual justification. I am using it colloquially as 'immunization from revision.' We are avoiding the term to focus on the mechanism."
  3.  **Bayesian Inertia:** "Bayes tells us *how much* to shift. It doesn't tell us *how* to generate the Auxiliary. That is the clinical work."

  **The Refusal:**
  **Script:** "I am going to refuse to do two things today.
  1.  I will not solve the specific trial discrepancy in this room. We don't have the data.
  2.  I will not calculate the exact probabilities. We don't have the numbers.
  We are setting the *protocol* for the next month's work."

  **The Final Question (Last 5 Minutes):**
  **Goal:** Test if they hold the distinction or a slogan.
  **Script:** "I want everyone to write down one sentence. Do not tell me whether the guideline should change. Tell me this:
  **'If we are to maintain the current guideline despite this trial, what specific, observable flaw (Auxiliary) in the trial design will we investigate next month, and what result would prove that flaw exists?'**
  If your answer is 'The population was different,' the follow-up is 'Show us the subgroup analysis.' If your answer is 'The protocol wasn't followed,' the follow-up is 'Show us the adherence data.'
  If you cannot name the test, you are in the Vulcan column."

  ### III. Strategic Notes for the Chair

  **1. Order of Operations:**
  You cannot reorder this.
  *   If you start with **Confidence/Priors**, they will argue about the weight of experience (Phase 4) before accepting the need for an Auxiliary (Phase 3).
  *   If you start with the **Medical Example**, they will re-litigate the medicine. The Physics analogy (Phase 3) is essential to create cognitive distance.
  *   If you address **Confirmation Bias** too early, they will feel accused. Address it in Phase 5 as a structural risk you are mitigating, not a personal failing.

  **2. Managing the "20 Years" Objection:**
  This is the emotional core. When it arises (likely in Phase 4), validate it immediately. "Correct. High prior probability is rational." Then pivot: "But a high prior reduces the *speed* of revision, it does not remove the *mechanism* of revision. The mechanism is the testable Auxiliary."
  This turns their experience from a shield into a burden of proof: "Because we have 20 years of experience, we owe it to the science to find the specific mechanism of the trial's failure, not just assert it."

  **3. The "Dogmatism" Word:**
  Do not use it. It is a trigger. If the philosophy member brings it up, nod and say, "That is one label for the structural closure I am describing. I am more interested in the escape route than the label."

  **4. What Depends on What:**
  *   The **Binary Loop** (Phase 2) must be established to show *why* the current reasoning is circular.
  *   The **Neptune Example** (Phase 3) must follow to show *how* to break the circle.
  *   The **Bayesian/Prior Discussion** (Phase 4) must follow the Example, so "Priors" are understood as inputs to the Neptune model, not replacements for it.
  *   The **Final Question** (Phase 5) tests whether they can apply the Neptune model to the Clinical context.

  **5. Contingency:**
  If they try to debate the trial during Phase 3: "That is exactly the move I am asking us to pause. We are discussing *how* we debate the trial, not the trial itself. Is the mechanism of error testable? That is the only question for now."

  ### IV. Summary of the Plan's Logic
  1.  **Show the Trap:** Logic shows that "Trust H" + "Distrust E because H" = No possible revision.
  2.  **Show the Key:** Science revises by turning "E is wrong" into "A caused E to look wrong," then testing A.
  3.  **Set the Parameters:** Experience raises the bar for A, it doesn't remove the need for A.
  4.  **Assign the Task:** Produce a testable A, or concede the point.

  This plan respects their expertise while exposing the structural flaw in their reasoning, without triggering the defensiveness that comes from accusing them of bias.
