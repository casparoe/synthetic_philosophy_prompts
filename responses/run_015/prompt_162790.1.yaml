      *   *Check:* The reflexive wrinkle.
      *   *Correction:* This is tricky. If I learn about my own policy, it implies uncertainty over my own parameters (Bayesian RL). If the act of observing changes the policy *structure* (not just parameters), that's non-stationarity. I need to frame this as uncertainty over $\theta$ in $P(s|r, \theta)$.
      *   *Check:* Residue on "rational agent acting on all evidence."
      *   *Correction:* In robust control, sometimes ignoring evidence (regularization) is better for worst-case performance. This contradicts the "act on all evidence" principle if "evidence" includes noise that expands the robustness set unnecessarily.

  9.  **Final Polish:** Organize into sections: Translation, Wrinkles, Residue. Ensure the distinction between Ex Ante (value of the experiment) and Ex Post (realized belief value) is sharp.

  **(Self-Correction on Wrinkle 2):** The user mentions "signal changes the thing it is a signal about." This sounds like the *observer effect* in quantum mechanics or *performative prediction*. In control, this is $P(s'|s, a, o)$ where $o$ depends on $a_{measure}$ and affects $s'$. Or it implies the policy $\pi$ is part of the state $s$. If $\pi$ is part of $s$, and $o$ reveals $s$, then $o$ reveals $\pi$. But if computing $o$ changes $\pi$ (e.g. gradient update triggered by data), then the system is non-stationary during the episode. I should frame this as *non-stationary dynamics induced by the learning rule* or *causal intervention on the policy parameters*.

  Let's stick to the Bayesian RL framing for Wrinkle 2. The "thing" is the parameter $\theta$. The signal updates $b(\theta)$. The policy is $\pi(b)$. The worry is that updating $b$ changes $\pi$ in a way that lowers value. Good's theorem says $E[V(b')] \ge V(b)$. If this fails, either the expectation is wrong (model mismatch) or the update rule is not Bayes-optimal (computational boundedness). I need to point out that Good's theorem assumes *optimal* processing of information. If the processing is heuristic (e.g., SGD), VoI can be negative.

