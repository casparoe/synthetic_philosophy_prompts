      *   *Reaction:* The Ordnung side doesn't riot. They go *quiet*. They stop filing paperwork. They stop grading. The system halts not because of violence, but because the *meaning* of the rules evaporated. The "Silent Riot" is bureaucracy striking.
      *   *Wait, let's flip it.* If he enforces the rule, the child dies. The Gewissen side riots. But the prompt asks to show which morality holds up *in practice*.
      *   *Better angle:* Elian realizes the fungus is his. He is the bridge. He makes a third option? No, binary choice is sharper.
      *   *Let's go with:* He releases the drug. The Ordnung system doesn't break with a bang, but with a whimper. The "grades" stop mattering. People see that survival > procedure. The "Silent Riot" is the cessation of belief in the system.

  6.  **Writing - Focusing on Sensory Details:**
