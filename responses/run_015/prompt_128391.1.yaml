answer: |-
  The fungus grew on the grout between the tiles of Elian's shower. It was a pale, bioluminescent blue, *Mycena mediatris*, a strain that didn't exist in any botanical registry. It thrived on the humidity of his indecision.

  Elian scrubbed a patch of it away with his thumb, watching the spores swirl down the drain. He was the Mediator of the Seam, the man who stood in the neutral concrete corridor between Ordnung and Gewissen. To his left, the city ticked. To his right, the city breathed.

  Today, the tick was threatening to stop.

  The hearing chamber was a glass box suspended over the border. On the Ordnung side of the glass, the Compliance Auditors sat in perfect rows, their lapels pinned with silver efficiency grades. On the Gewissen side, the Moral Witnesses slouched, draped in mismatched fabrics, their faces open and unreadable.

  In the center stood Kael, an Ordnung father. He was shaking. Not from fear, but from the withdrawal of protocol. He had not filed a Form 12-B (Emergency Petition) before acting. He had simply acted.

  "The violation is clear," said Auditor Vane. His voice was synthesized, flattened to remove emotional variance. "Layer One: Unauthorized Border Crossing. Layer Two: Possession of Unregistered Biologic. Layer Three: Bypass of Triage Queue. Layer Four: Unlicensed Transport. Layer Five: Intent to Subvert Procedural Grading. The substance must be confiscated and incinerated. The child will be re-queued."

  "The child will be dead by morning," said a Witness from the Gewissen side. She didn't stand up. She just leaned forward. "You grade the funeral, Vane. We grade the life."

  Elian sat at the high bench. The evidence vial sat before him. It glowed with a faint, rhythmic pulse.

  Elian knew that glow. He knew the specific frequency of the bioluminescence. It matched the colony in his bathroom.

  Kael hadn't smuggled this from a Gewissen lab. He had smuggled it from *Elian's* building. Someone had scraped the grout. Someone had sold the scrape. Kael had bought it on the black market, bypassing the five layers of Ordnung regulation to save his daughter from the Gray Lung.

  If Elian enforced the rules, the drug was destroyed. The child died. The procedural integrity of Ordnung remained intact, proving that the system was stronger than individual desperation. Trust in the Mediator would hold, but trust in the *purpose* of Ordnung would rot.

  If Elian let the drug pass, he validated the smuggling. He validated the black market that sourced from his own shower tiles. He risked exposing himself as an unregulated manufacturer. But the child lived. The Gewissen side would cheer, but the Ordnung side would see that rules were optional if your conscience was loud enough. The mediation system would collapse into anarchy.

  "The Five Layers are designed to ensure safety," Vane droned. "This substance is untested."

  "It's tested," Elian said. His voice echoed in the glass box. "Every day."

  He picked up the vial. The blue light reflected in his eyes. He looked at Kael. The man wasn't looking at Elian; he was looking at the drug. He wasn't praying. He was calculating. In Ordnung, you calculate odds. In Gewissen, you calculate worth. Kael had calculated that a world without his daughter had zero value, regardless of the compliance score.

  Elian thought of the fungus in his shower. It grew best when the water was hot, when the steam was thick. It grew on the residue of his own stress. It was a symbiotic parasite. It fed on him, and he fed it to the city.

  "Mediator?" Vane prompted. "The ruling."

  Elian stood up. He walked around the bench. He walked past the Auditors, whose silver pins glinted like shark teeth. He walked past the Witnesses, who smelled of rain and unwashed wool.

  He stopped in front of Kael.

  "The Five Layers protect the system," Elian said quietly. "They do not protect the citizen. That is a category error."

  He placed the vial in Kael's hand.

  "Go."

  Kael didn't thank him. Gratitude was a Gewissen currency; Ordnung dealt in debts. Kael simply closed his fingers around the glass and turned. He walked out of the chamber, toward the Ordnung airlock.

  "You have compromised the integrity of the Seam," Vane said, standing up. The other Auditors rose in unison, a mechanical wave. "Your grading score will be reviewed."

  "Review it," Elian said.

  He didn't wait for the dismissal. He left the chamber, taking the long walk back to his apartment in the Neutral Zone.

  He expected sirens. He expected the Gewissen side to erupt in celebration, drums beating in the streets. He expected the Ordnung side to deploy riot control, to lock down the sector.

  But the city was quiet.

  Elian stepped out onto his balcony. Below, the Seam stretched out, a canyon of steel and vine.

  On the Gewissen side, there were no drums. People were standing on their corners, watching the Ordnung gate. They weren't cheering. They were waiting to see if the sky would fall.

  On the Ordnung side, the lights were on. The massive digital billboards that usually displayed Citizen Compliance Scores were active. But they were blank.

  Elian squinted.

  A man in a gray suit stood at a crosswalk. The light was red. The timer counted down. *10... 9... 8...*

  In Ordnung, you wait for the green. To cross on red is a Class 4 Infraction. Your score drops. Your housing tier is threatened.

  The timer hit *0*. The light turned green.

  The man did not move.

  He stood there, looking at his wrist comp, where his score used to be. He looked at the open street. He looked at the other pedestrians.

  Another light changed. Green. No one moved.

  A bus approached. It slowed, confused. The driver honked. The sound was sharp, jagged, out of place.

  The pedestrians didn't scatter. They didn't check their grades to see if they were allowed to be in the road. They just began to walk. Not in a rush. Not in a riot. They walked with the slow, deliberate pace of people who have realized the fence has no wire.

  It wasn't violence. It was a cessation of belief.

  Elian watched as a Compliance Officer stepped out of a booth. He raised a hand to signal a stop. A woman walked past him. She didn't run. She didn't fight. She just didn't acknowledge his authority as a physical force. She treated him like a statue.

  The Officer lowered his hand. He looked at his datapad. He turned it off.

  The silence spread. It moved up the skyscrapers. The ticking of the city—the constant, rhythmic thrum of machinery processing choices—slowed. The hum of the servers that graded every purchase, every step, every word, began to whine down as the input data dried up.

  If you cannot be graded, the grade means nothing. If the grade means nothing, the rule is just a suggestion.

  Elian looked down at his own hands. He thought of the fungus in his bathroom. It would keep growing. It didn't care about the border. It didn't care about the rules. It only cared about the damp and the dark.

  Below, the traffic grid locked up. Not because of a crash, but because everyone had decided to drive at the same time, ignoring the lanes. The gridlock was absolute. The city stopped.

  Elian went inside. He turned on the shower. The water hissed. He didn't turn on the light. He sat on the edge of the tub and watched the blue mold glow in the dark, brighter than before, feeding on the sudden, quiet death of the system.

  There was no screaming. No fires. Just the sound of a million people breathing without counting the seconds.
