      *   Scope limitations? Yes.
      *   No specific citations? Yes.

  8.  **Final Polish:** (Proceeding to generate text based on these thoughts, keeping an eye on word count). *Note: I will need to ensure the language is dense enough to fit the word count requirements without fluff.*

      *(Self-Correction on Word Count)*: If I find myself running short, I will expand on the philosophical implications of "waste" versus "investment." If running long, I will trim the introduction.

      *(Final check on "Intermediate Regime")*: This is the crux. It's not just "waste." It's "waste that stabilizes." I need to make sure this is clear. It's a cost that prevents *entry* or *mimicry* not by filtering quality, but by demanding commitment that only a credible group would sustain.

