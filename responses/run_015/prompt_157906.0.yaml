      *   Model: Standard EGT says cost must equal benefit. I propose decoupling them via group selection.
      *   Method: Compare institutions that cut costs vs. those that keep them. Look at trust, not just output.
      *   Outcomes: If trust drops without quality drop -> Handicap. If quality drops -> Function.
      *   Scope: Too big for one paper. Needs simulation.

  6.  **Drafting - Iteration 2 (Writing and Polishing):**
      *   *Self-Correction during writing:* Make sure I don't sound like I'm advocating for bureaucracy. I'm analyzing the *logic* of the justification.
      *   *Check Constraint:* "Do not provide a bibliography." Okay.
