answer: |-
  **Title:** Signaling Through Friction: Distinguishing Handicap Mechanisms from Hidden Functions in Institutional Rituals

  **Introduction**
  Expert institutions—from peer-review panels to judicial bodies and charitable governance boards—rely fundamentally on public trust. Yet, the procedures maintaining this trust are frequently characterized by visible friction: deliberative slowness, administrative opacity, and burdensome compliance requirements. To the external observer, these features appear inefficient. To the institutional insider, they are often defended as necessary safeguards. This proposal addresses a conceptual tension regarding the ontological status of these burdens. One interpretation, drawing on the handicap principle, suggests these costs act as credible signals: the institution demonstrates commitment by willingly bearing a burden that "cheap talk" competitors cannot afford. A competing interpretation, rooted in evolutionary efficiency, argues that competitive selection eliminates genuinely wasteful practices; therefore, any surviving burden must covertly serve a functional role, such as error correction or coordination.

  The central research question is whether there can exist a stable institutional regime in which a practice is genuinely costly—wasteful from the standpoint of individual rational optimization—yet persists not because of hidden functionality, but because the cost itself is the mechanism that maintains collective credibility. This project seeks to formulate a precise, non-reductive version of this dispute, moving beyond the binary of "necessary function" versus "parasitic waste."

  **The Conceptual Problem: The Collapse of the Intermediate Regime**
  The core theoretical difficulty lies in how standard evolutionary game-theoretic (EGT) models handle cost. In canonical signaling models, a handicap is stable only if the cost is differential; it must be less costly for high-quality types to bear than for low-quality types. This ensures the signal separates the competent from the incompetent. However, in the context of institutional rituals, the "cost" is often uniform (e.g., waiting times apply to all applicants) and does not necessarily correlate with the quality of the output.

  Standard EGT approaches tend to collapse the intermediate possibility into one of two poles. First, if the cost yields no functional benefit (e.g., it does not improve error detection), the model treats it as pure waste. In a competitive environment, an institution bearing pure waste should be outcompeted by a leaner rival, rendering the regime unstable. Second, if the regime is stable, the model assumes the cost must purchase a functional benefit (e.g., the delay allows for better information aggregation). In this case, the practice is not a handicap in the strict sense, but an investment in quality.

  This binary leaves no room for the specific claim advanced by institutional defenders: that the friction *itself* generates trust, independent of its impact on output quality. The claim is that the willingness to endure inefficiency signals a prioritization of procedural integrity over speed, a preference structure that stakeholders value. Standard models struggle to capture this because they typically equate stability with efficiency. They lack a mechanism to explain why a group would sustain a cost that does not improve individual payoffs or output quality, yet prevents the collapse of collective reputation. The challenge is to model a scenario where the cost acts as a barrier to mimicry not by filtering agent quality, but by filtering *institutional type*—distinguishing those committed to long-term reputation from those seeking short-term extraction.

  **Proposed Analytical Strategy**
  To discriminate between the handicap interpretation and the hidden-function interpretation, I propose a two-level selection framework that separates individual-level inefficiency from institution-level equilibrium stability. This approach treats the institution not merely as an aggregate of rational actors, but as a distinct unit of selection with its own fitness criteria (e.g., longevity, prestige, funding stability).

  The strategy involves a structured comparative analysis of isomorphic institutions—specifically non-profit governance boards and peer-review bodies—operating under varying regulatory constraints. The analysis will focus on "natural experiments" where administrative burdens are exogenously reduced (e.g., through digitization or regulatory reform).

  Under the **Hidden-Function Hypothesis**, reducing the burden should lead to a measurable decline in output quality (e.g., higher error rates in grant allocation, increased legal reversals). The cost was purchasing accuracy.
  Under the **Pure-Waste Hypothesis**, reducing the burden should lead to improved efficiency with no loss of quality, and the institution should gain a competitive advantage.
  Under the **Intermediate Handicap Hypothesis**, reducing the burden should lead to a decline in *trust* or *legitimacy* metrics, even if output quality remains constant. Stakeholders may perceive the streamlined process as less rigorous, leading to reduced compliance or cooperation, thereby destabilizing the institution despite its increased efficiency.

  To formalize this, I will develop a simulation model where agents choose institutions based on perceived credibility. Credibility is a function of both output quality and visible procedural cost. The model will test whether a high-cost/medium-quality equilibrium can outcompete a low-cost/medium-quality equilibrium solely due to the signaling value of the cost. This decouples the "signal" from the "output," allowing for the possibility that the friction is the product being consumed by the public, rather than a byproduct of production.

  **Criteria for Support and Scope Limitations**
  Support for the intermediate regime would be established if the analysis demonstrates that institutions maintaining higher procedural costs retain higher levels of stakeholder cooperation and funding stability, controlling for output quality. Specifically, if removing the cost triggers a "crisis of legitimacy" without a corresponding "crisis of performance," the handicap interpretation gains traction. This would suggest that the cost is not an unfortunate byproduct of quality control, but a constitutive element of the institution's social contract.

  Conversely, a retreat to the **Hidden-Function** position would be forced if efficiency gains correlate strictly with maintained or improved trust, implying that the previous burdens were merely unresolved inefficiencies. A retreat to the **Pure-Waste** position would occur if high-cost institutions are systematically outcompeted by leaner rivals over time, indicating that the signaling value of the cost is insufficient to offset the economic burden.

  It must be acknowledged that fully resolving this dispute is a multi-semester project rather than a single workshop paper. The primary limitation is the difficulty in isolating "trust" from "quality" in empirical settings; stakeholders often conflate the two. Furthermore, the timescales required to observe institutional selection pressures exceed the scope of immediate data collection. Consequently, this proposal focuses on establishing the conceptual coherence of the intermediate regime and designing the simulation parameters. Historical verification of specific institutional collapses is beyond the current scope, as is access to proprietary internal data regarding decision-making latency. The immediate goal is to validate the logical possibility of the intermediate regime, providing a theoretical foundation for future empirical work.

  **Conclusion**
  By rigorously distinguishing between costs that buy quality and costs that buy credibility, this research clarifies the normative landscape of institutional design. If the intermediate regime exists, then efforts to streamline expert institutions may inadvertently undermine the very trust they seek to serve. This project aims to provide the conceptual tools necessary to identify when friction is a bug, and when it is, paradoxically, the feature that sustains the system.
