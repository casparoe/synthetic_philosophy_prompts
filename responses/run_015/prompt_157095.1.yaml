  # Part 5: Appendix

  ### A. Indistinguishable Leaves
  The following positions cannot be empirically separated by this instrument because they differ only in linguistic prescription, not in empirical prediction regarding the cases above.

  *   **Continuous-Gradualism vs. Deflationary Instrumentalism vs. Eliminativism:**
      *   *Diagnosis:* All three agree that there are no sharp ontological boundaries (Q1/Q2 = B). They differ only on whether to keep the word (Eliminativism says no; Instrumentalism says yes as a bin; Gradualism says yes as an approximation). A student who answers "No sharp boundaries" but "Keep the word for convenience" could validly be classified as either Gradualist or Instrumentalist. The tree places them based on their *attitude* toward the term (Q12 implied), but in practice, these views often overlap.

  *   **Skeptical Discursive vs. Eliminativism:**
      *   *Diagnosis:* Both view the category as lacking reality. The Skeptic may study the *discourse* of generations, while the Eliminativist refuses to study it at all. This is a methodological difference, not an ontological one detectable by the case questions.

  ### B. Empty Logical Space
  The following combinations of answers are logically possible but correspond to no defended position in the literature.

  1.  **Sharp Boundaries + No Causal Power:**
      *   *Diagnosis:* **Incoherent.** If boundaries are sharp (ontologically real), they must mark a difference in properties. Claiming a real boundary that changes nothing is a contradiction.
  2.  **Recurrent Types + Unique Historical Particulars:**
      *   *Diagnosis:* **Contradictory.** One cannot hold that generations are both unique events never to be repeated *and* instances of a recurring cyclical archetype.
  3.  **Exposure Pluralism + Sharp Boundaries:**
      *   *Diagnosis:* **Unattractive/Unstable.** If cohorts are defined by exposure (which varies by domain), boundaries cannot be sharp (as domains overlap). Defending sharp cutoffs on exposure grounds requires assuming all domains synchronize perfectly, which the Diagonal Problem (Q3) denies.
  4.  **Eliminativism + Generational Responsibility:**
      *   *Diagnosis:* **Incoherent.** One cannot argue the category should be discarded because it is false, while simultaneously assigning moral responsibility to that same category.
  5.  **Demographic Realism + No Mass Media:**
      *   *Diagnosis:* **Unattractive.** Defining generations purely by birth years (Demographic Realism) in a population with no synchronized media or events (Q9) renders the category descriptively empty, a position no realist defends (they always appeal to *some* shared context).
