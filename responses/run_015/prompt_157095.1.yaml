  # Part 4: The Leaves (Views & Commitments)

  1.  **Realism about sharply bounded cohorts:** Generations are natural kinds with genuine discontinuities at birth-year cutoffs.
      *   *Least Comfortable Commitment:* You must accept that two people born one day apart possess causally distinct social powers.
  2.  **Continuous-cohort gradualism:** "Generation" is coarse binning of a smooth birth-year surface; useful but ontologically imprecise.
      *   *Least Comfortable Commitment:* You must admit that every statement using the word "generation" is technically false, though pragmatically acceptable.
  3.  **Exposure-profile pluralism:** There are many overlapping cohorts (war, tech, school) and no canonical one; membership is domain-relative.
      *   *Least Comfortable Commitment:* You must accept that a single individual can simultaneously belong to three different, contradictory generations.
  4.  **Generations as unique historical particulars:** Cohorts are born and pass away with their defining events; they are not repeatable.
      *   *Least Comfortable Commitment:* You must deny any cyclical patterns in history, treating every social shift as unprecedented.
  5.  **Generations as repeatable types:** Archetypes (e.g., "Civic," "Idealist") recur in a cycle; the content changes but the structure remains.
      *   *Least Comfortable Commitment:* You must accept that a 20-year-old today is psychologically analogous to a 20-year-old in 1920, despite radically different material conditions.
  6.  **Looping social-kind constructivism:** The cohort is real and causally effective *because* it is classified and internalized (the label makes the thing).
      *   *Least Comfortable Commitment:* You must admit that if everyone stopped using the label "Millennial," the generation would cease to exist as a social force.
  7.  **Skeptical discursive view:** Cohort labels are journalistic and marketing artefacts with no kind behind them; they describe talk, not people.
      *   *Least Comfortable Commitment:* You must treat all generational analysis as essentially equivalent to analyzing horoscopes or fashion trends.
  8.  **Eliminativism about the term:** The concept is so flawed it should be removed from scientific and political vocabulary.
      *   *Least Comfortable Commitment:* You must forfeit a powerful shorthand for explaining macro-social change, risking descriptive impoverishment.
  9.  **Deflationary instrumentalism:** We keep the word as a stipulated bin for data aggregation while making no ontological claim about its reality.
      *   *Least Comfortable Commitment:* You must use a term you believe refers to nothing real, risking the reification of the category by your audience.
  10. **Purpose-relative pluralism:** Several incompatible slicings are equally legitimate depending on the inquiry (e.g., economics vs. culture).
      *   *Least Comfortable Commitment:* You must accept that contradictory claims (e.g., "This cohort is rich" vs. "This cohort is poor") can both be true simultaneously.

