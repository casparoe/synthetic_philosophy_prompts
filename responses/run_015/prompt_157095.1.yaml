answer: |-
  # Part 1: The Logical Space

  Before administering the instrument, students should understand the four dimensions of variation that structure the debate. The decision tree below sorts respondents based on how they resolve tensions within these dimensions.

  1.  **Continuity:** Is the social world divided by sharp breaks (discontinuities) at specific birth dates, or is it a smooth surface where "generations" are merely arbitrary bins drawn over a gradient?
  2.  **Constitution:** What makes a cohort cohere? Is it **Demography** (birth year alone), **Exposure** (shared experience during a formative window), or **Discourse** (shared labels and self-identification)?
  3.  **Multiplicity:** Is there one true way to slice the population (a canonical generation), or are there many overlapping, domain-relative slicings (e.g., a "war cohort" that differs from a "tech cohort")?
  4.  **Status:** Does the category refer to something mind-independent (Real), something brought into existence by classification (Construct), or something false/useful (Fiction/Instrument)?

  ***

  # Part 2: The Diagnostic Instrument (12 Items)

  *Instructions: For each item, select the option that best matches your intuition. Do not worry about technical terminology; answer based on the concrete scenario.*

  **1. The Boundary Lottery**
  Two people are born in the same hospital, to similar parents, in the same city. One is born December 31, 1980; the other January 1, 1981. A popular generational cutoff places them in different generations.
  *   **A.** It is plausible that they possess significantly different causal social powers or cultural dispositions *because* of this date difference.
  *   **B.** Any difference between them is negligible; the cutoff is arbitrary.

  **2. The Cross-National Audit**
  A massive study finds that across 50 countries, social outcomes (voting, spending, health) follow smooth, continuous birth-year trends with near-zero statistical discontinuities at conventional generational cutoffs.
  *   **A.** Generations still exist; the study just measured the wrong things or used the wrong bins.
  *   **B.** This evidence suggests "generations" do not exist as distinct natural kinds.

  **3. The Diagonal Problem**
  Consider a group shaped by the Vietnam War (exposure ages 18–25) and a group shaped by the rise of the Internet (exposure ages 10–15). These windows capture different birth years.
  *   **A.** These are two different cohorts; "the generation" splinters depending on which domain you study.
  *   **B.** There must be one dominant timeline (e.g., schooling) that determines the "real" generation, overriding other domains.

  **4. The Late-Arriving Migrant**
  A person migrates to a new country at age 24. They missed the local schooling and childhood media of their birth-year peers in that country but adopt the local politics and media as an adult.
  *   **A.** They belong to the cohort of their country of origin (defined by birth/early socialization).
  *   **B.** They belong to the cohort of their destination country (defined by current exposure/context).

  **5. The Grandparent-Raised Child**
  A child born in 1995 is raised in isolation by grandparents born in 1925, absorbing their media, habits, and political views exclusively.
  *   **A.** They are culturally a member of the 1920s cohort, despite their birth year.
  *   **B.** They are a member of the 1990s cohort; their personal upbringing is an exception, not a redefinition.

  **6. The Unconscious Stratum**
  Consider a birth-year stratum (e.g., 1950–1955) that shares an objective demographic location but never develops any shared self-consciousness, label, or distinctive culture.
  *   **A.** They are still a generation; the reality is objective, regardless of awareness.
  *   **B.** Without shared awareness or culture, they are just a demographic aggregate, not a generation.

  **7. The Late Naming**
  A birth cohort begins to describe itself using a specific generational label (e.g., "Baby Boomers") only when its members are in their mid-fifties.
  *   **A.** The generation existed before the name; the label just caught up to reality.
  *   **B.** The generation was brought into being *by* the naming; it did not exist as a social force prior.

  **8. The Exported Label**
  An Anglophone label (e.g., "Millennial") is applied to a country with a different schooling timeline, different internet diffusion curve, and its own indigenous cohort vocabulary.
  *   **A.** This is invalid; generations are context-specific and cannot be exported.
  *   **B.** This is valid; global forces create synchronized generations across borders.

  **9. The No-Media Population**
  Consider a hypothetical population with no mass media, no national schooling, and no synchronized national events.
  *   **A.** They can still have generations (based on biology or kinship).
  *   **B.** Without synchronized cultural exposure, "generations" are impossible.

  **10. The Responsibility Question**
  Can a generation (e.g., "Boomers") be meaningfully held morally responsible for collective outcomes (e.g., climate debt) in a way that individuals cannot?
  *   **A.** Yes, generations can be bearers of responsibility.
  *   **B.** No, only individuals can bear responsibility; generational blame is category error.

  **11. The In-Betweener**
  Someone born on a boundary year (e.g., 1977) rejects both adjacent labels and adopts an "in-between" label (e.g., "Xennial").
  *   **A.** This corrects a mistake in the boundary; the in-between category is real.
  *   **B.** This is merely a personal identity preference; the structural boundary remains.

  **12. The Cycle Question**
  Do generational archetypes (e.g., "Idealist," "Civic") recur in a predictable cycle across history?
  *   **A.** Yes, history moves in generational cycles.
  *   **B.** No, every generation is a unique historical particular.

  ***

  # Part 3: The Routing Key (Decision Tree)

  *Follow the path determined by your answers. Leaves are bolded.*

  **START:**

  **Node 1: Continuity (The Boundary Test)**
  *   Look at **Q1 (Boundary Lottery)** and **Q2 (Audit)**.
