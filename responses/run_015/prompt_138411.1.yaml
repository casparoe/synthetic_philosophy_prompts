      *   *The Fourth Option (The Pragmatic/Argumentative Turn):* This is the core value add. Shift from "Logical Validity" to "Argumentative Burden."
          *   Use Toulmin's model (Data, Claim, Warrant). The gap lives in the Warrant.
          *   Policy context: Distinguish between *technical* means-ends (instrumental) and *political* ends (value).
      *   *Addressing the Three Difficulties:*
          1.  *Instrumental:* The norm is the principle of efficiency/rationality. It *is* a normative premise, just often suppressed. In policy, make it explicit: "We ought to pursue efficient means."
          2.  *Institutional Facts (Promising):* "Promising" is a thick concept. It looks descriptive but functions normatively. The gap warns us to unpack "thick" terms.
          3.  *Triviality:* The point isn't validity, it's *contestability*. Making the norm explicit allows it to be challenged.
      *   *Naturalistic Fallacy:* Clarify the distinction. Moore vs. Hume.
      *   *Recommendation for the Handbook:* How to phrase this for policy pros? "The Burden of Normative Justification."

  7.  **Refining the "Fourth Option" for Policy Professionals:**
      *   Policy analysts deal with "evidence-based policy." They often think data dictates decisions. The Is-Ought gap is the tool to show them where their values are entering.
      *   Don't call it a "logical law." Call it a "diagnostic heuristic."
