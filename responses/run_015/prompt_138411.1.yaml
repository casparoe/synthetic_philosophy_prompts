prompt: |-
  I am revising the chapter on the fact–value distinction in a handbook of argument analysis for policy professionals, and I want the statement of the is–ought gap to be one a reader could actually apply. The version I have been working with is syntactic: classify every atomic claim in an argument as descriptive or normative, and treat any inference step as illegitimate if none of its premises is normative while its conclusion is. Three difficulties have made me doubt this formulation, and I would like to know which of the diagnoses I can see is the right one, or whether the formulation should be abandoned.

  First, the apparent counterexamples. A duty engineer wants the substation not to flood, and pumping the sump is the only means available to her of preventing it; so she ought to pump the sump. No premise contains "ought," "good," "bad," "reason," or "should," and yet the reasoning strikes me as impeccable. Either Hume's law is false, or instrumental reasoning is a recognised exception to it, and I cannot tell which — though the difference clearly matters for what I tell my readers.

  Second, the cases where the norm seems already to be inside the descriptive-looking premise. N promised the Board she would keep the records dry; so N ought to keep the records dry. If promising is the sort of thing that binds, the "ought" is packed into the first premise rather than produced by the step, and then whether my rule flags an argument depends only on where the norm is parked, which cannot be a real difference. A student of mine has also pointed out that from "the gauge reads four metres" one may validly infer "the gauge reads four metres or the Board ought to resign," which my rule flags as well, and which surely cannot be what anyone meant to prohibit.

  Third, if I retreat to the safer claim that a normative conclusion requires a normative premise somewhere, the thesis begins to look like mere bookkeeping: any argument can be made to satisfy it simply by making the normative premise explicit, and nothing follows about whether the argument is any good. Yet the gap is standardly treated as a deep thesis about the autonomy of ethics, which suggests that in retreating I have lost whatever content it had.

  So, as I see it, I have three options: (a) the law, stated syntactically, has counterexamples and should be given up; (b) it survives only because "descriptive" and "normative" are defined so that any premise from which an "ought" follows counts as normative, which makes it circular and unfalsifiable; or (c) what I have been calling the is–ought gap is really only the naturalistic fallacy — the prohibition on analysing "good" as some natural property — and has nothing to say about inference at all.

  Which of these is correct, and is there a fourth option I am missing? If the answer is (b), what exactly is the non-trivial claim, what sort of argument would violate it that I would otherwise have been willing to accept, and what would count as successfully bridging the gap rather than merely relabelling a premise as normative? Finally: is the naturalistic fallacy the same thesis as the is–ought gap, a consequence of it, or a separate doctrine that I have been conflating with it?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Revising a chapter on the fact-value distinction for a *handbook of argument analysis for policy professionals*.
      *   **Goal:** A statement of the is-ought gap that is *applicable* (practical utility).
      *   **Current Formulation:** Syntactic rule (classify atomic claims; inference illegitimate if no normative premise leads to normative conclusion).
      *   **Three Difficulties Identified:**
          1.  *Instrumental Reasoning:* "Want X, Y is means to X" $\rightarrow$ "Ought to do Y" (No explicit 'ought' in premises).
          2.  *Hidden Norms/Logical Quirks:* "Promised X" $\rightarrow$ "Ought to do X" (Is 'promising' descriptive or normative?). Also, the disjunction problem ($P \rightarrow P \lor Q$).
          3.  *Triviality/Bookkeeping:* If we just add a hidden normative premise, the rule is satisfied but tells us nothing about the argument's quality.
      *   **User's Proposed Options:**
          (a) Give up the syntactic law (it has counterexamples).
          (b) It's circular/unfalsifiable (definitions shift to save the law).
          (c) It's just the Naturalistic Fallacy (no inference prohibition).
      *   **Questions:** Which option is correct? Is there a fourth option? If (b), what is the non-trivial claim? Is the Naturalistic Fallacy the same as the Is-Ought Gap?

  2.  **Evaluate the User's Diagnosis:**
      *   The user is very sharp. They have identified the classic philosophical problems with Hume's Law (the is-ought gap) when applied rigorously.
      *   *Difficulty 1 (Instrumental Reasoning):* This is the "Hypothetical Imperative" issue. Kant and others distinguish categorical vs. hypothetical oughts. In policy, instrumental rationality is key. The syntactic rule fails here unless "wanting" implies a normative commitment.
      *   *Difficulty 2 (Institutional Facts/Disjunction):* "Promising" is an institutional fact (Searle). It describes an action but entails a norm. The disjunction problem ($P \vdash P \lor Q$) is a classic logical counterexample to the idea that you can't derive an 'ought' from an 'is' in formal logic (Prior's counterexample).
      *   *Difficulty 3 (Triviality):* This is the "Enthymeme" problem. Any bad argument can be made valid by adding a premise. If the gap just means "you need a normative premise," it doesn't tell you *which* normative premises are justified.

  3.  **Assess the Options:**
      *   *(a) Give it up:* Too drastic. The intuition behind the gap is useful for policy professionals (don't slide from data to values without justification).
      *   *(b) Circular/Unfalsifiable:* Close to the truth regarding the *syntactic* formulation, but there is a non-trivial version (justification burden).
      *   *(c) Naturalistic Fallacy:* Incorrect. Moore's Naturalistic Fallacy is about *definitions* (Good = Pleasure), whereas Hume's Gap is about *inference* (Is $\rightarrow$ Ought). They are related but distinct.

  4.  **Develop the "Fourth Option" (The Pragmatic/Argumentative Approach):**
      *   Since the audience is *policy professionals*, a purely metaphysical or logical formulation is less useful than an *argumentative* one.
      *   The gap isn't a logical prohibition (logic allows $P \vdash P \lor O$). It's a *burden of proof* rule.
      *   *Reformulation:* The gap indicates where the *justificatory work* lies. If you move from descriptive premises to a normative conclusion, you must provide a *warrant* that connects them. That warrant itself carries normative weight.
      *   This addresses the "Hidden Norm" issue: The norm isn't "parked" in the premise; it's in the *inference rule* or the *warrant*.
      *   This addresses Instrumental Reasoning: The warrant is the principle of instrumental rationality (if you will the end, you ought to will the means). This is a normative principle, even if often assumed.
      *   This addresses Triviality: It forces the analyst to make the *normative warrant* explicit and subject it to scrutiny, rather than just checking boxes.

  5.  **Address the Specific Questions:**
      *   *Which option is correct?* None of (a), (b), or (c) is fully satisfactory. (b) is closest regarding the syntactic version, but misses the pragmatic point.
      *   *Is there a fourth option?* Yes. Treat it as a rule of *argumentative burden* rather than logical validity.
      *   *If (b), what is the non-trivial claim?* The non-trivial claim is that normative conclusions require normative *justification*, not just normative *premises*. It exposes hidden value judgments.
      *   *Naturalistic Fallacy vs. Is-Ought:* Distinct. Moore (NF) = Definition. Hume (Gap) = Inference/Derivation.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the query. Validate that the syntactic formulation is indeed problematic (Prior, Searle, etc.).
