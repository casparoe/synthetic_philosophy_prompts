          *   Actually, the User thinks the Friend is wrong. Why? Because even if statues are about *us*, our decision about *us* depends on what the figure represents. If the figure is blameworthy (2), they represent something we might not want to affirm. If they are excused (1), they represent human limitation. So 1 & 2 inform 3.
