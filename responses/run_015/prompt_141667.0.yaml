      *   Audit the points? Yes.
      *   Which pull against each other? Yes.
      *   Ordered by severity? Yes.
      *   What to give up/cost for each? Yes.
      *   No recommendations? Yes.

      *(Self-Correction on Severity)*: Actually, the Friend's objection is conceptually important but practically solvable. The tension between (2) and (4)/(5) is existentially more troubling for the user's peace of mind. I will rank the Friend's objection as #3 (least severe), the Churchill/Columbus distinction as #2 (medium), and the Forgiveness/Availability tension as #1 (most severe).

      *(Wait, let's look closer at the Friend's objection)*: If statues are purely about *us* (3), then whether Jefferson is *blameworthy* (1/2) matters less than whether he represents values we *currently* reject. However, usually, we reject values *because* we judge them blameworthy. So 1/2 inform 3. The clash is only if 3 is interpreted as "Statues have *nothing* to do with the person's morality." I should frame this as a definitional clash.

      *(Let's look at Churchill/Columbus)*: The user says Churchill's honor is detachable. This requires a theory of "moral fungibility" or "compartmentalization." If they keep (5), they commit to the idea that some goods outweigh or sit apart from bads. If they keep (2) strictly, Columbus and Churchill should be treated similarly if criticism existed for both. So (2) threatens (5).

      *(Let's look at 2 vs 4)*: (2) says "If criticism existed, you are on the hook." (4) says "We will be on the hook for things no one criticizes us for yet." This is the "Moral Luck" problem. If I am lucky that no one objects to eating meat, (4) says I'm still guilty later. (2) says if a vegetarian existed in 1500, Columbus is guilty. This is a clash about *moral epistemology*.

      Okay, ready to write.

