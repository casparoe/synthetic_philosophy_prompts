          3.  Judging the *person* vs. deciding on *statues/names* are distinct questions (statues = current affirmation).
          4.  Future generations will rightly condemn current practices (animals, global poor).
          5.  Complex figures (Churchill) can be honored for specific contributions despite moral flaws.
