      *   *Revised Mechanism:* **The "Redaction" Method.** When a capacity is voted away, the *words* associated with it are redacted from the discussion. If "Grief" is removed, you cannot use words like "sad," "loss," "miss," "gone." This forces them to experience the linguistic/cognitive limitation of the emotional loss. This is doable and powerful.

