      *   *Selected Mechanism:* **"The Capacity Deck."** There are 14 cards on the table representing emotional capacities (e.g., "Deep Mourning," "Righteous Anger," "Guilt"). To raise the "Well-Being Floor," you must burn cards. You vote on which cards to burn to achieve the next level of safety.
      *   *Wait, one more refinement:* The prompt asks for a "graduated affective calibration policy." Let's make it a vote on *Levels*. Level 1 to 5. Each level has a predefined cost (a specific capacity lost). The group must vote to unlock the next level. If they vote Yes, the capacity is *gone* for the remainder of the simulation.
