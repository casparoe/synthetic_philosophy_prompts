      *   *Better Idea:* Use a physical "Calibration Dial" (a visual prop). The trade-offs are written on cards that get removed from the pool as the dial turns.
      *   *The Split:* Start with Level 0 (Current State). Move to Level 5 (No Suffering). Each level removes a specific emotional capability.
      *   *The Twist:* Participants aren't just voting for society; they are voting for *themselves* in the simulation. If the vote passes, they "lose" the capacity for the rest of the game. How do we simulate losing a capacity? Maybe they lose the ability to vote on certain types of issues? Or they lose the ability to express certain arguments?
      *   *Refinement:* To make it physical/social, let's have them stand in zones or hold cards. Let's use a "Consensus Bar."
