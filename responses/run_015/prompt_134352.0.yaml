          2.  Social Death > Biological Death: Exclusion from recognition severs ontological status more than biological end.
          3.  Contrast with Western Relational Autonomy (Mackenzie/Stoljar): Western views need minimal agency; Asymmetrical Ubuntu does not.
      *   **Specific Questions to Address:**
          1.  Coherence: Does it collapse into paternalism or essentialism?
          2.  Fidelity: Is this genuinely Ubuntu or an artificial imposition?
