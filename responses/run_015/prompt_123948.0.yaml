  # JOINT STATEMENT ON SEX WORK POLICY AND PRINCIPLE
  **Issued by the Adversarial Collaboration Working Group on Sex Work Regulation**

  **Preamble**
  We, the undersigned advocates representing the Nordic Model (asymmetrical criminalization) and Full Decriminalization (New Zealand Model) perspectives, hereby record the outcomes of our good-faith adversarial collaboration. While we remain divided on the optimal legal framework for governing sexual services, we commit to the following shared factual understandings, normative commitments, and identified cruxes. This document is intended to clarify the terrain of disagreement for policymakers and researchers, distinguishing empirical disputes from foundational moral divergences.

  ### I. AGREED CLAIMS

  1.  **Legal Architectures:** We agree on the structural distinctions between the three primary regulatory models currently in operation:
      *   **The Nordic Model:** Criminalizes the purchase of sexual services while decriminalizing the sale, often accompanied by state-funded exit services for sellers.
      *   **The Legalization Framework (e.g., German/Dutch):** Permits the sale and purchase of sexual services but subjects them to specific licensing, registration, and zoning regulations distinct from general commerce.
      *   **The Full Decriminalization Framework (e.g., New Zealand):** Removes sex-work-specific criminal provisions entirely, treating the provision of sexual services under general commercial and labor law without mandatory registration or licensing of individual workers.

  2.  **Empirical Patterns:** We acknowledge the following as established empirical patterns, distinct from contested causal claims:
      *   Violence and coercion occur within the sex industry across all jurisdictions.
      *   Stigma against sex workers exists independently of legal status, though its intensity and operational impact vary by regime.
      *   Migration status is a significant determinant of vulnerability regardless of the domestic regulatory model.
      *   Data regarding the causal impact of specific laws on violence rates remains contested due to methodological limitations, including underreporting and selection bias.

  3.  **Normative Aims:** We accept the following as legitimate aims of state policy, even if we prioritize them differently:
      *   **Worker Safety:** The physical and psychological security of individuals providing sexual services.
      *   **Reduction of Coercion:** The minimization of trafficking, force, and exploitative third-party control.
      *   **Autonomy:** The capacity of individuals to make decisions regarding their own bodies and labor.
      *   **State Accountability:** The obligation of the state to enforce laws consistently and provide recourse for rights violations.

  4.  **Conceptual Distinctions:** We agree to employ the following distinctions precisely:
      *   **Decriminalizing Sellers:** Removing penalties for the individual providing services.
      *   **Criminalizing Buyers:** Imposing penalties on the individual purchasing services.
      *   **Labor Regulation:** Applying standard employment law (wages, safety, contracts) versus applying *sui generis* regulatory codes specific to sexual commerce.
      *   We acknowledge that "decriminalization" is often used ambiguously; for the purpose of this statement, "Full Decriminalization" refers specifically to the New Zealand benchmark of removing sex-work-specific criminal provisions and applying general labor law, distinct from partial decriminalization or legalization regimes.

  ### II. DISAGREEMENTS TABLE

  | Topic | Nordic Model Formulation | Full Decriminalization Formulation |
  | :--- | :--- | :--- |
  | **Asymmetrical Criminalization** | Criminalizing the buyer reduces net harm by suppressing demand, signaling that sexual access is not a commodity, and reducing the market size within which coercion can hide. | Criminalizing the buyer displaces risk by driving transactions underground, impairing workers' ability to screen clients, and reducing leverage to negotiate safety terms without police interference. |
  | **Exit Services** | State-funded exit services expand meaningful choice by providing viable economic alternatives to those who wish to leave, thereby ensuring that remaining participation is more genuinely voluntary. | State-funded exit services impose a conditional welfare framework that presumes sex work is inherently harmful, undermining the voluntariness it claims to protect by conditioning support on the rejection of current labor. |
  | **Labor Contract Logic** | Sexual services cannot be coherently governed by standard labor-contract logic because intimacy and stigma create a unique power dynamic that renders consent to commercial sex morally distinct from consent to other labor. | Sexual services can be coherently governed by standard labor-contract logic; the unique stigma is a social problem to be remedied by rights, not a justification for excluding workers from standard labor protections. |
  | **Licensing and Dual Markets** | Legalization regimes that license brothels create a dual market that systematically disadvantages undocumented or unregistered workers, proving that state regulation of sex work inevitably creates a class of excluded, unprotected individuals. | Legalization regimes that license brothels create a dual market that systematically disadvantages undocumented workers, proving that *restrictive licensing* is flawed; however, full decriminalization avoids this by removing registration barriers entirely. |

  ### III. CRUXES FOR FUTURE RESOLUTION

  We identify the following three cruxes as sub-questions where resolution would materially shift the policy consensus. For each, we specify the concrete case or argument, the empirical or conceptual bearing, and the explicit predictions held by each side.

  #### 1. The Conceptual Crux: Indexing Consent Under Constraint
  *   **The Question:** Whether consent to exchange sexual services under severely constrained economic alternatives should be indexed to the same moral framework as consent in other labor markets, and whether the responsibility for expanding those alternatives lies with the state (via exit services) or with the individual worker (via labor rights).
  *   **Bearing:** This determines whether the state's primary obligation is to abolish the market (Nordic) or to regulate it for safety (Decrim).
  *   **Nordic Prediction:** If economic constraints are alleviated via robust social welfare, the majority of sellers will choose to exit the industry, validating the view that participation is primarily driven by necessity rather than preference.
  *   **Decrim Prediction:** If economic constraints are alleviated, participation rates will remain stable among those who view the work as preferable to available alternatives, validating the view that sex work is a legitimate labor choice distinct from coercion.
  *   **Undermining Evidence:**
      *   *Nordic:* Data showing stable or increased participation rates in sex work despite significant expansions in general social welfare and exit funding.
      *   *Decrim:* Data showing that workers in full decriminalization regimes report higher rates of coerced entry than workers in Nordic regimes, suggesting labor rights alone cannot mitigate recruitment coercion.
  *   **Verbal Disagreement:** We note a partial verbal disagreement regarding the definition of "voluntariness." The Nordic side indexes voluntariness to the availability of *meaningful alternatives* (substantive autonomy), while the Decrim side indexes voluntariness to the absence of *direct force or fraud* (procedural autonomy).

  #### 2. The Predictive Crux: Displacement and Safety Reporting
  *   **The Question:** What both sides agree is the relevant evidence about displacement effects and worker-reported safety under each regime, specifically regarding the willingness to report violence to authorities.
  *   **Bearing:** This determines whether criminalizing buyers protects workers by reducing market size or harms them by reducing access to justice.
  *   **Nordic Prediction:** Over a ten-year period, Nordic-model jurisdictions will show a decrease in the prevalence of sex trafficking and an increase in the proportion of workers engaging with social services, even if police reporting rates remain static.
  *   **Decrim Prediction:** Over a ten-year period, Full Decriminalization jurisdictions will show higher rates of violence reporting to police and higher rates of successful prosecution for crimes against workers compared to Nordic-model jurisdictions.
  *   **Undermining Evidence:**
      *   *Nordic:* If Full Decriminalization jurisdictions demonstrate lower rates of worker-reported violence and higher conviction rates for assaults against workers than Nordic jurisdictions.
      *   *Decrim:* If Nordic-model jurisdictions demonstrate higher rates of worker engagement with health and justice systems without fear of arrest compared to Full Decriminalization jurisdictions.
  *   **Verbal Disagreement:** None identified. Both sides agree that "worker-reported safety" and "reporting rates" are the relevant metrics.

  #### 3. The Institutional Crux: Third-Party Management
  *   **The Question:** Whether third-party management in this sector is more analogous to standard labor brokerage or to a uniquely coercive risk vector, and what concrete regulatory feature would serve as the decisive test case.
  *   **Bearing:** This determines whether brothels and agencies can be legitimate employers or must be prohibited as exploiters.
  *   **Test Case:** The regulatory treatment of worker-led cooperatives versus licensed-employer oversight.
  *   **Nordic Prediction:** Even in worker-led cooperatives, the commodification of intimacy will reproduce internal hierarchies and coercion, requiring state intervention to dissolve the commercial structure.
  *   **Decrim Prediction:** Worker-led cooperatives operating under general labor law will demonstrate higher safety standards and lower coercion rates than both independent solo work and licensed-employer models.
  *   **Undermining Evidence:**
      *   *Nordic:* Evidence that worker-led cooperatives successfully eliminate coercion and provide long-term safety without state abolition of the cooperative structure.
      *   *Decrim:* Evidence that worker-led cooperatives inevitably devolve into exploitative management structures indistinguishable from traditional pimping, regardless of labor law protections.
  *   **Verbal Disagreement:** We note a disagreement on the term "exploitation." The Nordic side defines exploitation to include the *structure* of selling sexual access itself. The Decrim side defines exploitation as the *extraction of surplus value* or violation of labor standards within the sale.

  ***

  **Signed,**

  *Representative, Nordic Model Advocacy Coalition*
  *Representative, Full Decriminalization Policy Network*

  *Date: October 26, 2023*
