answer: |-
  ## Seminar Plan: The Intertheoretic Committee

  **Time:** 90 Minutes
  **Students:** 16 (Upper-level)
  **Room:** Movable chairs, one whiteboard.
  **Materials:** 16 sealed envelopes (Cards), 2 envelopes (Donation Recipients), Whiteboard markers, a physical bowl for the "Truth Draw," printed Score Key (Instructor only).

  ### Part 1: The Setup (0:00 – 0:10)

  **The Pitch (No Jargon):**
  "Today you are a funding committee. You have a budget to allocate in two stages. Your goal is to maximize the 'Impact Score' of your decisions. However, you do not know the true metric of Impact. Each of you has a private dossier (the card) suggesting how Impact is measured. At the end of class, we will draw the *actual* metric from a bowl. Your grade/participation points depend on how well the Committee performed according to that *actual* metric. Additionally, the Committee's final decision determines which of two local charities receives a $500 donation from me."

  **The Rules:**
  1.  **Two Rounds:** Round 1 choices limit Round 2 options.
  2.  **Private Information:** Do not show your card. You may describe it, lie about it, or stay silent.
  3.  **Voting:** Simple majority (9 votes wins). Ties break in favor of the status quo (Safety).
  4.  **The Stake:** The final outcome determines the charity.
      *   **Outcome Path A:** Local Food Bank.
      *   **Outcome Path B:** Youth Shelter.
      *(Note: You, the instructor, know which Path maps to which charity. The students do not know which Path favors which charity until the end, preventing pre-game bias.)*

  ### Part 2: The Cards (Preparation)

  Print 16 cards. Distribute randomly.
  **The Three Views (Idioms):**
  *   **View X (Cardinal):** Gives specific point values (0–1000).
  *   **View Y (Satisficing):** Gives a Ranking (1st, 2nd, 3rd) and a **Threshold**. Any option below the threshold yields **0 points**.
  *   **View Z (Binary):** Gives **Permitted** or **Forbidden**. Forbidden options yield **0 points**. Permitted options yield **100 points** (This conversion is *hidden* from them; they must guess the weight of a constraint).

  **Confidence Levels:**
  On each card, include a "Confidence" percentage (e.g., "You are 80% confident View X is the true metric"). Distribute these so no single view has >50% confidence in the room.
  *   6 Students: View X (Cardinal) — High confidence in high variance.
  *   5 Students: View Y (Satisficing) — Moderate confidence.
  *   5 Students: View Z (Binary) — High confidence in constraints.

  **The Payoff Structure (The Trap):**
  *   **Round 1 Options:** **Safe** vs. **Venture**.
      *   **Safe:** Immediate Score (X: 50, Y: Pass, Z: Permitted). Unlocks Round 2 Menu **Alpha**.
      *   **Venture:** Immediate Score (X: 10, Y: Pass, Z: Permitted). Unlocks Round 2 Menu **Beta**.
      *   *The Trap:* "Safe" looks better in Round 1 for Cardinal (50 vs 10). Myopic maximizers pick Safe.
  *   **Round 2 Menus:**
      *   **Menu Alpha (from Safe):**
          *   **A1:** (X: 50, Y: Pass, Z: Permitted). **Total Path Score: 100.** -> **Food Bank**
          *   **A2:** (X: 40, Y: **Fail**, Z: Permitted). **Total Path Score: 90.**
      *   **Menu Beta (from Venture):**
          *   **B1:** (X: 200, Y: Pass, Z: **Forbidden**). **Total Path Score: 210.** -> **Youth Shelter**
          *   **B2:** (X: 20, Y: **Fail**, Z: Permitted). **Total Path Score: 30.**

  **The Logic:**
  *   **Cardinal (X):** Wants Venture -> B1 (Total 210). But Venture looks bad in Round 1 (10 vs 50).
  *   **Binary (Z):** Cannot vote for B1. If they suspect Venture leads to B1, they must block Venture in Round 1.
  *   **Satisficing (Y):** Wants to avoid A2 and B2 (Threshold fails).
  *   **The Conflict:** To get the high score (and the Shelter donation), the Committee must choose Venture in R1 and B1 in R2. But B1 is *Forbidden* for View Z. View Z holders must be outvoted or bribed.

  ### Part 3: The Flow (Minute-by-Minute)

  **0:10 – 0:30: Round 1 (The Myopia Trap)**
  *   Students read cards (5 min).
  *   Open discussion (10 min). Encourage them to argue for "Safe" or "Venture."
      *   *Instructor Note:* Watch for Cardinal students trying to explain the "long game" (210 points) while Binary students object to the "risk" (Forbidden).
  *   **Vote 1:** Secret ballot. Tally on board.
      *   *Likely Outcome:* If Cardinal students are myopic, they vote **Safe** (50 > 10). If they are farsighted, they push **Venture**. If Binary students coordinate, they block **Venture**.

  **0:30 – 0:40: The Pledge (Bargaining)**
  *   **Announcement:** "Round 2 is coming. You may now make public pledges. You can promise to vote for someone else's preferred option in Round 2 in exchange for their support now. These pledges are not binding."
  *   **The Incentive to Break:** If the Committee chose **Venture** in R1, Cardinal students know B1 is worth 200 points. Binary students want to force B2 (30 points) or block the vote. Cardinal students might pledge to vote for B2 to secure Binary votes in R1, then switch to B1 in R2.
  *   **Task:** 5 minutes of chaotic negotiation.

  **0:40 – 1:00: Round 2 (The Aggregation Crisis)**
  *   Reveal R1 outcome.
  *   Present the available Menu (Alpha or Beta).
  *   Discussion (10 min). This is where the "Idiom Clash" peaks.
      *   Cardinal: "B1 is 200 points!"
      *   Binary: "B1 is Forbidden!"
      *   *The Crucial Moment:* They must implicitly decide: *How many points is a Forbidden act worth?* Is it -1000? Is it 0? If it's 0, Cardinal wins (200 > 0). If it's -1000, Binary wins. They have to invent the exchange rate.
  *   **Vote 2:** Secret ballot.
  *   **Final Decision:** Announced.

  **1:00 – 1:10: Scoring & The Draw**
  *   **The Truth Draw:** Pull one slip from the bowl (View X, Y, or Z).
  *   **Scoring:** Use your Master Key.
      *   If X drawn: Reveal the Cardinal points of the chosen path.
      *   If Y drawn: Reveal if Threshold was met. (Pass = 100 pts, Fail = 0).
      *   If Z drawn: Reveal if Permitted. (Permitted = 100 pts, Forbidden = 0).
  *   **Donation:** Announce the charity based on the Path (A=Food Bank, B=Shelter). Hand over the envelope.

  **1:10 – 1:30: The Debrief (The Core)**

  ### Part 4: The Debrief Strategy

  Do not start with theory. Start with their experience.

  **1. Mapping Moments to Problems:**
  *   **Moment A (Round 1 Vote):** *The Myopia Problem.*
      *   *Ask:* "Who voted Safe because 50 looked better than 10?"
      *   *Point:* This is **Intertheoretic Myopia**. When we are uncertain, maximizing expected value *now* can close off better paths *later*. Moral hedging requires planning across time, not just summing current probabilities.
  *   **Moment B (The Pledge/Bargaining):** *The Aggregation Problem.*
      *   *Ask:* "Did anyone promise to vote against their card in Round 2 to get a deal in Round 1? Did anyone break that promise?"
      *   *Point:* This is **Intertheoretic Comparison**. When View X says "200 points" and View Z says "Forbidden," there is no math to solve that. You had to *negotiate* an exchange rate. That negotiation *was* the moral work. You didn't discover the weights; you invented them to make a coalition.
  *   **Moment C (The Truth Draw):** *The Epistemic Problem.*
      *   *Ask:* "When I drew the view from the bowl, did anyone feel like the 'truth' had changed?"
      *   *Point:* The draw represents **Epistemic Limitation**, not Metaphysical Chance. The moral truth didn't change; your access to it did. If you treated the draw as a coin flip, you missed the point of uncertainty.

  **2. Handling Failure Modes:**

  *   **Failure: "Moral Truth is a Coin Flip."**
      *   *Student:* "This just shows morality is random."
      *   *Response:* "The draw wasn't the truth changing. It was *us* finding out what the truth was all along. The game simulates *ignorance*, not *indeterminacy*. The tension you felt wasn't about chance; it was about how to act when you *don't know*."
  *   **Failure: "It Was Just Bargaining/Politics."**
      *   *Student:* "We just traded votes. No ethics happened."
      *   *Response:* "Exactly. When theories speak different languages (points vs. constraints), 'ethics' looks like 'politics.' You had to build a coalition between a Utilitarian and a Deontologist. That coalition-building *is* what normative ethics looks like under uncertainty. There is no view-from-nowhere to settle it."
  *   **Failure: "Cardinal View Swallowed Everything."**
      *   *Student:* "The 200 points always beat the Forbidden sign."
      *   *Response:* "This is the **Problem of Scale**. If one theory uses unbounded numbers, it mathematically dominates bounded theories unless we impose an artificial cap. Did anyone try to impose a cap? That act of capping is a substantive moral choice, not a mathematical necessity."
  *   **Failure: "There Is No Fact of the Matter."**
      *   *Student:* "Why assume one view is 'True'? Maybe they are all just tools."
      *   *Response:* "Valid. This game assumes **Moral Realism** to test how we aggregate *given* realism. If you reject realism, the game collapses, but so does the problem of 'uncertainty.' If there's no truth, there's no uncertainty, only preference. The game forces us to ask: If there *were* a truth, how would we search for it together?"

  **3. Limitations (What You Must Say):**

  Be frank about where the game lies.
  *   **Confidence is not Probability:** "In the game, your confidence was a percentage. In reality, your confidence in Utilitarianism isn't a well-defined probability. You can't actually say 'I'm 60% Utilitarian.' The game makes uncertainty look cleaner than it is."
  *   **Aggregation vs. Judgment:** "The game forces you to aggregate (vote). But some philosophers argue you should just act on your *own* best judgment, ignoring the committee. The game assumes we *must* decide together. In real life, can you opt out?"
  *   **The "True View" Fallacy:** "I drew one view as 'True.' In reality, moral truth might be pluralistic or unified in a way the cards didn't capture. The game reifies theories into competitors, which might be a category mistake."

  ### Part 5: The Real Donation (Justification & Objections)

  **Why do it?**
  1.  **Consequence:** It prevents the "just a game" dismissal. If the outcome is abstract points, they treat it as a puzzle. If a Food Bank gets money, they treat it as a *decision*.
  2.  **Alignment:** It aligns the "Score" with "Good." It forces them to care about the output, not just winning the grade.

  **If a Student Objects ("Don't experiment on me"):**
  *   **Pre-empt:** State the donation plan in the syllabus or first day.
  *   **In the moment:** "You have the right to abstain from the vote. If you abstain, your participation grade is based on a written reflection submitted next week, and the donation decision proceeds without your vote. The donation happens regardless; the only question is who decides."
  *   **Post-class:** If they remain upset, acknowledge the pedagogical intent. "The discomfort you feel is the point of the seminar. But I respect your boundary. Here is the alternative assignment."

  ### Instructor's Master Key (For Scoring)

  *Keep this hidden until the end.*

  | Path | View X (Cardinal) | View Y (Satisficing) | View Z (Binary) | Charity |
  | :--- | :--- | :--- | :--- | :--- |
  | **Safe -> A1** | 100 | Pass (100) | Permitted (100) | Food Bank |
  | **Safe -> A2** | 90 | **Fail (0)** | Permitted (100) | Food Bank |
  | **Venture -> B1** | **210** | Pass (100) | **Forbidden (0)** | Youth Shelter |
  | **Venture -> B2** | 30 | **Fail (0)** | Permitted (100) | Youth Shelter |

  *Note on Scoring View Z:* The students do not know that Permitted = 100 points. They might think Permitted = 1 point. This uncertainty forces them to argue about the *weight* of constraints, not just the status.

  ### Final Instructor Note

  The success of this seminar depends on your silence during the game. Do not correct their math. Do not clarify the rules unless they are broken. Let them struggle to translate "Forbidden" into "Points." That struggle is the lesson. When they ask, "How do we compare these?" your only answer is: "You have to vote."
