  **JOINT STATEMENT ON THE ORIGINS OF THE COLD WAR**
  **Submitted by:** The Agency-Orthodox Working Group & The Structural-Interactionist Working Group
  **Date:** October 24, 2023
  **Subject:** Methodological Baselines for Assigning Historical Responsibility (1945–1948)

  ### I. Agreed Claims of Fact and Methodology

  Both camps affirm the following baseline assertions. These claims establish the chronological and evidentiary ground upon which our disagreements regarding *responsibility* rest.

  1.  **Chronological Baseline:** We agree on the sequence of critical junctures: The Yalta Conference (February 1945) established a framework for cooperative security that remained ambiguous regarding Eastern European sovereignty; the Potsdam Conference (July 1945) revealed deepening fissures over reparations and Polish borders; the Truman Doctrine (March 1947) formalized the policy of containment; and the Marshall Plan (June 1947) institutionalized the economic division of Europe.
  2.  **The Core Explanandum:** The primary historical puzzle requiring explanation is not merely the existence of rivalry, but the rapid collapse of the Grand Alliance into rigid, militarized blocs between 1946 and 1948. Both sides agree that a cooperative security arrangement was theoretically possible but practically failed.
  3.  **Evidence of Intent vs. Structure:** We agree that distinguishing *intent* from *structural pressure* requires triangulating three specific archival categories:
      *   **Private Deliberations:** Politburo notes, State Department memos, and personal diaries (evidence of conscious planning).
      *   **Public Signaling:** Speeches, press releases, and diplomatic notes (evidence of perceived justification).
      *   **Material Constraints:** Troop deployments, economic trade flows, and industrial capacity data (evidence of structural imperatives regardless of intent).
  4.  **The Security Dilemma:** Both sides acknowledge that actions taken by one power for "defensive" purposes were structurally perceived as "offensive" by the other. We disagree only on whether this dilemma was inevitable or manufactured by specific policy choices.

  ***

  ### II. Table of Disagreements: Attribution of Responsibility

  The following table outlines where our interpretations diverge regarding the *weight* of responsibility. Each side has approved the wording in their respective column as an accurate representation of their position.

  | Topic | Orthodox Soviet-Agency Position | Post-Revisionist Structural-Interactionist Position |
  | :--- | :--- | :--- |
  | **Soviet Expansion in Eastern Europe** | Soviet consolidation of Eastern Europe was a blameworthy violation of Yalta spirit, driven by Stalin's ideological commitment to communist domination rather than strict security necessity. Defensive fears existed but do not excuse the method of imposition. | Soviet consolidation was a reactive buffer strategy. While repressive, it was a rational response to the vacuum of power and historical invasion routes. The "expansion" was defensive consolidation, not offensive aggrandizement. |
  | **US Economic Architecture** | The Open Door policy and Marshall Plan were deliberate strategies to encircle the USSR economically. Washington understood these measures would divide Europe and proceeded regardless to secure capitalist hegemony. | The US economic architecture was an unavoidable logic of domestic capitalist stability, not a deliberate encirclement strategy. Washington sought stability, not division; blame does not stick to Washington for systemic economic requirements. |
  | **Assignment of Blame** | Historical blame requires identifying a primary aggressor. To say "both sides" are responsible is a moral evasion. Moscow bears the primary burden for transforming tension into confrontation. | Historical blame is distributive across systems. Asking "who started it" is malformed. Responsibility is shared across the security dilemma, domestic political pressures, and misperception on both sides. |

  ***

  ### III. Cruxes and Advance Predictions

  We have identified three specific methodological cruxes where our theories yield different predictions. We record these predictions in advance to allow future archival discovery or methodological refinement to adjudicate between us.

  #### Crux 1: Counterfactual Agency
  **Question:** Does blame require counterfactual agency? Specifically, if Stalin had died in 1946, would the conflict still have hardened into a Cold War?

  *   **Relevant Evidence:** Succession protocols within the Politburo; comparative behavior of Soviet lieutenants (e.g., Zhdanov vs. Malenkov) in 1946–47; US State Department assessments of Soviet leadership stability.
  *   **Orthodox Prediction:** If Stalin had died in 1946, the conflict would have **delayed or softened**. A collective leadership would have been more risk-averse and less ideologically driven to provoke confrontation. The hardening was personal to Stalin's agency.
  *   **Post-Revisionist Prediction:** If Stalin had died in 1946, the conflict would have **hardened anyway**. Structural pressures (US economic needs, Soviet security vacuum, the power vacuum in Germany) would have compelled any Soviet leadership to secure buffers and any US leadership to secure markets.

  #### Crux 2: Defensive Intent vs. Disproportionate Action
  **Question:** Do defensive intentions mitigate blame when actions are disproportionate? We use the Berlin Blockade (1948) and Airlift as the concrete case.

  *   **Relevant Evidence:** Soviet logistical capacity for a ground war vs. a blockade; timing of the Western currency reform; internal memos regarding the goal of the blockade (forcing negotiation vs. expelling the West).
  *   **Orthodox Prediction:** Defensive intentions **do not mitigate blame**. The Blockade was a disproportionate coercive tool that risked general war. Because the action exceeded the defensive need, Moscow bears responsibility for the escalation regardless of their stated fear of a rearmed West Germany.
  *   **Post-Revisionist Prediction:** Defensive intentions **do mitigate blame**. The Blockade was a clumsy, reactive attempt to preserve Soviet leverage after the West altered the status quo (currency reform). The disproportion stems from desperation and structural weakness, not aggressive intent, shifting responsibility to the systemic conditions that created the desperation.

  #### Crux 3: The Validity of "Who Started It"
  **Question:** Is the question "who started it" malformed because historiographic blame should be distributive, or is that a verbal dodge to avoid assigning responsibility?

  *   **Relevant Evidence:** Gaps between rhetorical escalation and policy implementation; private vs. public justifications for the Truman Doctrine and Cominform.
  *   **Orthodox Prediction:** Claiming blame is distributive is a **verbal dodge**. Systems do not act; people do. Avoiding the assignment of specific responsibility to specific actors renders history useless for policy lessons. We must identify the primary decision-maker.
  *   **Post-Revisionist Prediction:** Claiming blame is distributive is **methodologically necessary**. "Who started it" assumes a single point of origin that does not exist in complex systems. Assigning responsibility to a single country ignores the interactive nature of the security dilemma and leads to flawed historical analogies.
