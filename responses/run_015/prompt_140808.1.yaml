      *   *Critique:* It's a strong start, but "Right-making" is likely a category error here. Moral *worth* isn't usually what makes an *action* right (that's normative ethics). Moral worth is about the *agent's relation* to the right action (meta-ethics/moral psychology). So the user's third category is slightly off. It's more about *Attribution* vs. *Cultivation* vs. *Ontology of Motivation*.
