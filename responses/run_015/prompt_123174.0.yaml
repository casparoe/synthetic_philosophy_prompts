  **The Compliance Grant**

  You stand before two boxes in a funding clinic: Box A (transparent) contains \$5,000; Box B (opaque) contains \$100,000 or nothing. You may take both boxes (Two-Box) or Box B only (One-Box). A Review Panel watches your choice and, valuing humility, *causally ensures* Box B is funded if you One-Box, but voids it if you Two-Box. However, unknown to you, a prior Compliance Audit has already determined your eligibility: 50% of applicants are "Flagged" (legally barred from receiving Box B funds regardless of the Panel), while 50% are "Cleared." Crucially, applicants who were Flagged often sense their precarious status and, out of desperation, One-Box 99% of the time; Cleared applicants, advised by counselors to secure the stipend, One-Box only 1% of the time.

  ***

  **Supporting Work**

  **1. Probabilities and Verdicts**
  Let $C$ be Cleared, $F$ be Flagged. $P(C) = P(F) = 0.5$.
  Let $1B$ be One-Box, $2B$ be Two-Box.
  Propensities: $P(1B | F) = 0.99$, $P(1B | C) = 0.01$.
  Payoffs:
  *   If $F$: Box B is legally empty (\$0).
  *   If $C$ and $1B$: Panel funds Box B (\$100,000).
  *   If $C$ and $2B$: Panel voids Box B (\$0).
  *   Box A is always \$5,000 if taken.

  **CDT Calculation:**
  CDT evaluates $P(\text{Payoff} | \text{do}(Act))$. The intervention $\text{do}(1B)$ breaks the correlation between Act and Audit Status.
  *   $E[U | \text{do}(1B)] = P(C) \times \$100,000 + P(F) \times \$0 = 0.5 \times 100,000 = \$50,000$.
  *   $E[U | \text{do}(2B)] = \$5,000 + (P(C) \times \$0 + P(F) \times \$0) = \$5,000$.
  *   **Verdict:** One-Box (\$50,000 > \$5,000).

  **EDT Calculation:**
  EDT evaluates $P(\text{Payoff} | Act)$, conditioning on the evidence the act provides about Status.
  *   $P(1B) = P(1B|F)P(F) + P(1B|C)P(C) = (0.99 \times 0.5) + (0.01 \times 0.5) = 0.5$.
  *   $P(C | 1B) = \frac{P(1B|C)P(C)}{P(1B)} = \frac{0.005}{0.5} = 0.01$.
  *   $E[U | 1B] = P(C | 1B) \times \$100,000 = 0.01 \times 100,000 = \$1,000$.
  *   $E[U | 2B]$: Since Box B is voided by Panel for $2B$ (if Cleared) or Law (if Flagged), payoff is just Box A.
  *   $E[U | 2B] = \$5,000$.
  *   **Verdict:** Two-Box (\$5,000 > \$1,000).

  **Robustness:**
  If $P(1B|C)$ rises to 0.05 (Cleared applicants are less disciplined), $P(C|1B) \approx 0.05$. $E[U|1B] \approx \$5,000$. The verdicts tie. If $P(1B|C)$ is 0.02, EDT still Two-Boxes (\$2,000 < \$5,000). The disagreement holds for a reasonable range of propensities.

  **2. Structural Feature and Familiar Cases**
  The structural feature is **Causal Efficacy Screened Off by a Common Cause**. The Act causally produces the Payoff (Newcomb ingredient), but the Act is also an effect of a Hidden State that prevents the Payoff (Smoking Lesion ingredient).
  *   **Delete Causal Link** (Panel does not react to choice): You are left with a Hidden State causing both the Act and the Payoff outcome. This is the **Smoking Lesion** structure (correlation without causation).
  *   **Delete Evidential Link** (Choice independent of Audit): You are left with an Act causally determining a Payoff subject to independent risk. This collapses to **Ordinary Newcomb** *structure* (State determines Payoff, Act evidences State), though with reversed valence; without the correlation, both theories agree, resembling a standard causal decision.

  **3. Strongest Reply for EDT**
  The defender of EDT argues: *"The causal link is subordinate to the eligibility constraint. You cannot causally generate a payoff you are legally barred from receiving; your choice only reveals the bar."*
  This is a **principled fix** (appealing to a hierarchy of constraints: logical/legal impossibility trumps causal propensity), not merely a patch. It suggests EDT should treat "State-determined impossibility" as a screening condition that overrides "Act-determined possibility."

  **4. Implication for the Slogan**
  This case proves that **"One-Boxing is Evidential, Two-Boxing is Causal" is a setup artifact, not a theoretical law.** The verdicts depend entirely on whether the Act is *good news* (Standard Newcomb) or *bad news* (Compliance Grant) about the hidden state enabling the payoff.

  **5. Functional Decision Theory (FDT)**
  FDT prescribes **One-Boxing**, because it treats the choice as the output of a decision algorithm that the Panel causally responds to, while treating the Audit Status as a fixed environmental fact that does not logically depend on the algorithm's output.

  **6. Real-World Analog**
  This pattern is known in economics as **Adverse Selection in Credit Markets** (Stiglitz & Weiss, 1981): Applying for a loan (Act) causally secures funds (Panel), but applying evidences high risk (Audit), which increases the probability of default or regulatory block (State).
