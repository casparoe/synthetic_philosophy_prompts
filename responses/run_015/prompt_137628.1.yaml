  6.  **Refining the "Silence" Point:**
      *   The facilitator must stop explaining *why* they should keep doing the ritual once the "Doctrine is False" card is dealt. The students must sit with the absurdity of performing a ritual they are told is based on a lie.

  7.  **Addressing the "What Goes Wrong":**
