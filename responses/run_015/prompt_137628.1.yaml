      *   *Nostalgia:* They might think keeping practice is just comfort. *Fix:* Emphasize the *cost* (Vitality) in the debrief.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Scenario:* 1844. Vestry meeting.
