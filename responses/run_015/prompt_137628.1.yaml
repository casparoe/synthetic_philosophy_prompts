answer: |-
  # Activity Title: The Vestry of St. Jude's (1844)

  ## 1. Framing and Minimal Setup Script
  **Room Setup:** Arrange tables for four groups of four students. Place a small bowl in the center of each table containing 10 Blue Chips ("Vigor") and 0 Red Chips ("Observance"). Give each group one envelope marked "Confidential."

  **Facilitator Script (Minutes 0–10):**
  "You are the Vestry Committee of St. Jude's Parish, 1844. You manage the parish's moral and material resources. Your goal is to ensure the Parish survives the year with its 'Welfare' intact.

  You have two resources:
  1.  **Vigor (Blue Chips):** This represents your energy, intellectual ease, and emotional comfort. You start with 10.
  2.  **Observance (Red Chips):** This represents the disciplined habit of attending to others. You start with 0.

  **The Rules:**
  Each 'Month,' I will present a **Devotional Duty**.
  *   To perform the Duty, your group must pay **2 Vigor**.
  *   If you pay, you receive **2 Observance**.
  *   If you do not pay, you keep your Vigor, but gain no Observance.

  Normally, performing the Duty also grants 'Salvation' (points toward your final grade/participation). However, today, we are testing the Parish's *secular* survival. Salvation points are suspended. Your only metric is Parish Welfare at the end of the session.

  Open your envelopes. Inside is the Parish Ledger for Month 1."

  ## 2. Roles and Constraints
  *   **Groups:** 4 Households (4 students each).
  *   **Decision Mechanism:** Consensus. The group must agree to spend Vigor or hoard it.
  *   **Constraint:** Vigor is non-transferable between groups. Observance is non-transferable.
  *   **Information Asymmetry:** The value of Observance is hidden until the Crisis.

  ## 3. Sequence and Timeline (90 Minutes)

  ### Phase 1: Orthodoxy (Minutes 10–25)
  *   **Action:** Distribute **Ledger Card 1**.
      *   *Text:* "The Harvest Festival. The parish expects the Vestry to lead prayers for the crops."
      *   *Cost:* 2 Vigor.
      *   *Reward:* 2 Observance.
      *   *Bonus:* "Because the Doctrine is True, regain 1 Vigor (Comfort of Belief)."
  *   **Deliberation:** Groups decide. Most will pay the cost because the net loss is only 1 Vigor, and they are told "Doctrine is True."
  *   **Facilitator Role:** Circulate. Confirm transactions. Validate that belief makes the cost low.

  ### Phase 2: The Crisis of Belief & The Silence (Minutes 25–45)
  *   **Action:** Distribute **Ledger Card 2**.
      *   *Text:* "New Geological Findings. The local strata contradict Genesis. The Clergy admits the literal Doctrine may be false."
      *   *Cost:* 2 Vigor.
      *   *Reward:* 2 Observance.
      *   *Bonus:* **REMOVED.** "No Vigor refund. The Comfort of Belief is gone."
  *   **The Silence (Critical Moment):**
      *   Once you hand out Card 2, **stop speaking.**
      *   Do not explain *why* they should continue.
      *   Do not answer questions like "Is there any point?" or "What is Observance for?"
      *   Stand at the front of the room, arms crossed, looking at the clock.
      *   Let them sit with the absurdity of paying a high cost (2 Vigor) for a token (Observance) that appears to have no value, driven by a Doctrine they now know is suspect.
      *   *Duration:* 10 minutes of pure deliberation within groups.
  *   **Action:** Distribute **Ledger Card 3** (Minutes 35–45).
      *   *Text:* "Winter Sickness. The parish expects visitation."
      *   *Cost:* 2 Vigor.
      *   *Reward:* 2 Observance.
      *   *Bonus:* None.
  *   **Facilitator Role:** Collect payments. Update token counts publicly on the board (e.g., "Group A: 4 Vigor, 4 Observance"). Do not comment on the disparity between groups.

  ### Phase 3: The Moral Crisis (Minutes 45–60)
  *   **Action:** Distribute **The Crisis Card** to all groups simultaneously.
      *   *Text:* "A laborer's family has been evicted. They are starving. The Parish Fund is empty. The only way to secure private aid is through a **Sustained Appeal**. This requires deep, disciplined attention to the family's complex needs over time."
      *   *Requirement:* To resolve the Crisis, you must spend **4 Observance**.
      *   *Constraint:* **Vigor cannot be substituted.** You cannot buy your way out with energy or good intentions. You must have the habit.
      *   *Outcome:* If you pay 4 Observance, the family is saved (Parish Welfare Secured). If you cannot pay, the family is ruined (Parish Welfare Failed).
  *   **Deliberation:** Groups realize the value of the "useless" Red chips. Groups that hoarded Vigor (Blue) by skipping rituals now find themselves wealthy in energy but powerless to help.
  *   **Resolution:** Groups announce if they saved the family.

  ### Phase 4: Debrief (Minutes 60–90)
  *   (See detailed debrief script below).

  ## 4. Materials
  1.  **Tokens:** 64 Blue Chips (Vigor), 64 Red Chips (Observance) total (or paper squares).
  2.  **Envelopes:** 4, containing Ledger Cards 1, 2, 3, and Crisis Card.
  3.  **Whiteboard:** To track group resources publicly.
  4.  **Handout:** "The St. Jude's Ledger" (a simple sheet to track their own token counts).

  ## 5. Token Payoff Scheme
  *   **Vigor (Blue):** Represents intellectual honesty (not lying to oneself about doctrine) and emotional comfort.
      *   *Start:* 10 per group.
      *   *Cost:* 2 per Round if practicing.
      *   *Refund:* 1 per Round *only* in Round 1 (Belief intact).
  *   **Observance (Red):** Represents the liturgical residue (discipline of attention).
      *   *Start:* 0 per group.
      *   *Gain:* 2 per Round if practicing.
      *   *Value:* Only redeemable during The Crisis.
  *   **Win Condition:** Having enough Observance to pay the Crisis cost (4 tokens). Vigor surplus does not count toward winning.

  ## 6. The Silence Point
  **Exact Moment:** Immediately after distributing **Ledger Card 2** (The Geological Findings).
  **Instruction:** When a student asks, "Why should we spend Vigor if we get no Comfort back?" or "What do Red chips do?", you must reply: **"That is a Vestry decision."** Then return to silence.
  **Purpose:** This forces them to experience the *cost* of practice without the *justification* of belief. They must decide if the practice has intrinsic value or if it is merely instrumental to belief. If they stop practicing, they are acting rationally based on the information given (belief is false, cost is high, reward is unknown). This mirrors the intellectual position of the secularizing Victorian.

  ## 7. Debrief Script and Mapping
  **Step 1: The Post-Mortem (Minutes 60–70)**
  Ask the groups who failed the Crisis: "You had plenty of Vigor. You were intellectually honest. You saved your energy. Why couldn't you save the family?"
  *   *Expected Answer:* "We didn't have the Red chips." "We stopped going to the visits because it seemed pointless."
  Ask the groups who succeeded: "You lost Vigor. You spent energy on something you were told might be false. Why did you keep doing it?"
  *   *Expected Answer:* "We thought it might matter." "It felt like we should keep the routine." "We didn't want to lose the habit."

  **Step 2: Mapping to the Claim (Minutes 70–80)**
  Draw three columns on the board: **Doctrine**, **Practice**, **Residue**.
  *   **Doctrine:** Map this to the "Comfort Refund" in Round 1. When the geology card hit, the Doctrine collapsed. The refund stopped.
  *   **Practice:** Map this to the payment of 2 Vigor. This is the act of prayer, visitation, or confession. It costs energy regardless of belief.
  *   **Residue:** Map this to the Red Chips (Observance).
  *   **The Argument:** "In the game, if you stopped the Practice because the Doctrine was false, you lost the capacity to generate Residue. When the Moral Crisis hit, Vigor (good intentions/intellectual honesty) was not enough. You needed the specific capacity built by the Practice."
  *   **Connect to Eliot:** "George Eliot lost the 'Comfort Refund.' She could not believe in the literal truth of the Bible or divine judgment. But she noticed that people who kept the 'Visitation' habit—even without the belief—were better at noticing suffering. She calls this **Liturgical Residue**. The form of the religion survives the death of the faith, and that form trains the muscles of sympathy."

  **Step 3: The Takeaway (Minutes 80–90)**
  " Eliot does not argue you should pretend to believe. She argues that if you abandon the *practice* along with the *belief*, you risk atrophying the moral muscles that the practice built. The 'Red Chips' are not salvation; they are **attention**. In a secular world, we still have to save the evicted family. Eliot asks: Where do we get the discipline to do that if we throw away the liturgy that trained us?"

  ## 8. Troubleshooting: What Will Go Wrong
  **1. Gaming the System (The "Meta" Problem)**
  *   *Risk:* A student in a previous class or a savvy gamer might guess that "Observance" is the winning token and tell everyone to hoard them regardless of the narrative.
  *   *Fix:* If this happens, lean into it during the debrief. "Even if you guessed the mechanic, you had to *act* as if the practice was worth the cost while believing it was useless. That *is* the argument. You had to value the discipline over the doctrine."
  *   *Prevention:* Call Red Chips "Routine Markers" initially, not Observance, to obscure the moral value.

  **2. Collapsing the Distinction (The "Hypocrisy" Objection)**
  *   *Risk:* Students will argue, "If you don't believe the prayer works, saying the prayer is lying. You can't have practice without belief."
  *   *Response:* This is the exact tension Eliot explores. Acknowledge it. "Eliot agrees it feels like lying. But she suggests the *action* of visiting the sick changes the visitor, regardless of who they think is listening. The activity forces you to decide: Is the value in the *truth claim* (Doctrine) or the *behavioral training* (Practice)?"

  **3. Treating Practice as Nostalgia**
  *   *Risk:* Students who kept the practice might say, "We did it because it felt nice/comforting."
  *   *Response:* Point to the token cost. "You paid 2 Vigor per round. That was a net loss of energy. It wasn't comfort; it was a tax. Eliot's point is that this tax builds a resource that comfort does not."

  **4. The "Vigor" Misunderstanding**
  *   *Risk:* Students think Vigor represents "Goodness."
  *   *Response:* Clarify in debrief: "Vigor is capacity/energy/intellectual honesty. You can be a good person with high Vigor, but without Observance, you lack the *trained mechanism* to deploy that goodness in a crisis."

  ## 9. Limitations: What the Activity Cannot Do
  **1. The Inner Life**
  The activity simulates the *structural* logic of Eliot's claim (Practice $\rightarrow$ Capacity), but it cannot reproduce the *affective* texture. Eliot's fiction is filled with the *feeling* of sympathy—the warmth, the pain, the quietude. The token exchange is cold and transactional.
  *   *Facilitator Duty:* You must supply the emotional weight in the debrief. Describe the "evicted family" not as a game loss, but as a human tragedy that requires sustained, uncomfortable attention to resolve.

  **2. The Community Aspect**
  Eliot often argues that liturgical residue sustains *communities*, not just individuals. This activity is group-vs-group, which encourages competition.
  *   *Facilitator Duty:* In the debrief, ask: "If one Household had failed, would it have affected the others?" Use this to pivot to Eliot's view of social interdependence (the "web" of society in *Middlemarch*).

  **3. The Content of the Practice**
  In the game, the practice is abstract (pay 2 chips). In Eliot, the practice is specific (prayer, hymn, confession). The specific content matters because it shapes *how* we attend.
  *   *Facilitator Duty:* Mention that Eliot believes specific forms (like confession) train specific virtues (humility). The game abstracts this, but the principle remains: form shapes function.

  **4. No "Right" Answer**
  The activity makes keeping the practice look "winning." Eliot is more ambivalent; she knows some practices are harmful or oppressive.
  *   *Facilitator Duty:* Acknowledge that not all liturgical residue is good. Some habits train prejudice, not sympathy. Eliot's project is discerning *which* residues to keep. The game simplifies this to show the *possibility* of secular moral capacity derived from religious form.
