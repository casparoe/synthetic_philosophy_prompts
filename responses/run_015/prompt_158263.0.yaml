answer: |-
  Here's the quick hit while you grab coffee.

  **The Scenario**
  Alice, a nervous VP in New York, Slacks Raj in Mumbai: "It would be fantastic if you could circle back on the compliance docs by Thursday, no rush though." The statistical MT renders this into flawless Hindi that preserves the polite optionality, so Raj, trusting the text, prioritizes other work until Friday morning when the audit fails and the company gets fined. Meanwhile, a human translator named Priya, who knows Alice uses "no rush" specifically when she's terrified of auditors, had earlier told Raj over the phone: "Alice is scared. Do Thursday." Raj stays late, the audit passes, and disaster is averted despite Priya butchering the grammar.

  **The Breakdown**
  *   **Hofstadter's Worry:** The MT is just shuffling symbols without grounding; it lacks the "inner light" to know that "no rush" actually signals *panic*, not leisure. It misses the speaker's mental state.
  *   **Functionalist Counter:** Who cares about the "spark"? If the output gets the job done, it's valid translation. The human won this round, but the metric is successful communication, not philosophical understanding.
  *   **The Feature:** **Pragmatic Implicature.** It's the gap between lexical stats (what the words say) and social intent (what the power dynamic means).
  *   **If You Remove It:** If Alice writes "Deadline: Thursday. Mandatory," the MT wins on speed and accuracy every time. The ambiguity is the bug, not the translator.
  *   **MT Defense:** Don't blame the tool for bad management. A defender argues that relying on hidden social cues is a brittle communication protocol; the organization should enforce explicit writing standards where MT excels, rather than optimizing for office gossip.
