  # Research Proposal: The Normative Middle

  **Project Title:** The Expected-but-Not-Required: A Third Normative Status?

  **The Question**
  Is the category of actions that are socially expected but not morally obligatory (e.g., replying to emails promptly, splitting bills fairly) a distinct normative status sui generis, or is it reducible to optionality plus statistical regularity, or merely an unstable transitional phase toward obligation?

  **Timeline Assessment**
  Twelve weeks is sufficient for a conceptual paper of 8,000 words, provided you do not attempt empirical validation of the norms themselves. You are analyzing the *logic* of the norms, not their sociological prevalence. If you find yourself trying to survey people about their expectations, you are out of time. Stick to armchair reflection on speech acts and reactive attitudes.

  **Why the Standard Two-Tier Picture Fails**
  The standard binary divides acts into Obligatory (omit = blame; do = no credit) and Supererogatory/Optional (omit = no blame; do = credit). Standard mechanisms for drawing this line fail to capture the middle class:
  1.  **Cost Thresholds:** The middle-class acts are low-cost (texting back), yet not required. High-cost acts are often optional, but low-cost acts are not automatically required.
  2.  **Demandingness:** These acts are not demanding, yet claiming them as obligations feels like an overreach.
  3.  **Best Available Option:** These acts are rarely the *best* thing one could do (donating the money saved on the bill is better), yet failing to do them registers as a negative mark in a way that failing to do the *best* thing does not.
  4.  **Reactive Attitudes:** The binary predicts blame or nothing. The middle tier generates *disappointment* and *loss of standing*, which are normative sanctions distinct from moral blame but stronger than mere preference frustration.

  **The Collapse Worry and The Proposed Test**
  Your worry is correct: if we define "expected" as "what people usually do," the middle tier collapses into Option (a) (Optional + Statistics). To avoid this, we need a test that measures normative force independent of frequency.

  **The Speech Act Felicity Test:**
  We distinguish the tiers by which speech acts are felicitous (appropriate) when addressing non-compliance.
  *   **Optional:** You can beg, but you cannot remind or demand. ("Please come if you want" vs. "You should come.")
  *   **Required:** You can demand and blame. ("You must come," "You were wrong not to.")
  *   **Middle:** You can *remind* and express *disappointment*, but not *blame*. ("I expected you," "You let me down," but not "You violated a duty.")

  If the middle tier were merely statistical (Option A), the reaction to omission would be predictive surprise ("I thought you would, but you didn't") rather than normative disappointment ("You should have"). The persistence of "should" without "blame" indicates a normative status distinct from mere habit. If the middle tier were unstable (Option B), we would see historical drift where these acts either become fully obligatory or fully optional over time. The project will test whether the logical space for "should without blame" is stable.

  **Work Plan (12 Weeks)**

  *   **Month 1: Mapping the Terrain.** Collect 10-15 clear case studies of middle-tier acts. Categorize the reactive attitudes associated with them. Draft the section critiquing the two-tier model (cost, demandingness, best-option).
  *   **Month 2: Developing the Test.** Formulate the Speech Act Felicity Test. Argue against the "Optional + Statistics" reduction by showing that statistical regularity does not license reminding/prompting. Argue against the "Unstable Way-Station" by showing the functional utility of having a low-stakes normative layer.
  *   **Month 3: Writing and Refining.** Draft the full paper. Ensure the argument moves from cases to the theoretical implication. Write the two-page note for the panel, translating the metaethical distinction into implications for professional conduct and evaluation.

  **Possible Conclusions**
  1.  **Third Status:** The middle tier is distinct. *Decided by:* Showing that "disappointment" is a normative sanction irreducible to blame or preference frustration.
  2.  **Reducible to Optional + Stat:** The middle tier is an illusion. *Decided by:* Showing that all "expectations" dissolve when compliance rates drop, proving they are merely predictive.
  3.  **Unstable Way-Station:** The middle tier is transient. *Decided by:* Showing that these norms inevitably harden into obligations or dissolve into options over time.

  **Deliverable for the Dean**
  A two-page note titled "Normative Expectations in Professional Life." It will explain that professional conduct relies heavily on this middle tier (responsiveness, fairness, courtesy). Treating these as mere options undermines collegiality; treating them as strict obligations creates burnout. Recognizing them as a distinct category allows for better management of professional relationships without resorting to formal grievance procedures.

  **Failure Condition**
  The project fails if you cannot distinguish the speech acts available in the middle tier from the optional tier without referencing frequency. If the only way to explain why you can "remind" someone to text back is "because everyone else does," you have conceded to Option (a) and the distinct status collapses.

  ***

