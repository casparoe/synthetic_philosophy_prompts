answer: |-
  ### 1. Exam Question

  **Course:** PHIL 450: Modern Moral Philosophy
  **Topic:** G. E. Moore, *Principia Ethica* (Chapter VI)
  **Time:** 45 Minutes

  **Question:**

  Consider the "Duet Case": Two friends, A and B, listen to the same symphony together. Both appreciate the music, both know the other is appreciating it, and both are aware that this appreciation is shared. Compare this to a "Sum Case": A listens alone (appreciating the music), plus B listens alone (appreciating the music), plus A and B feel mutual affection for one another (but without the shared musical experience).

  Moore claims that the value of a whole need not equal the sum of the values of its parts (Organic Unity), that we must evaluate states in "absolute isolation" to determine intrinsic value, and that the value of aesthetic appreciation depends partly on the real existence of the object.

  Write an essay addressing the following: **Is the Duet Case intrinsically better than the Sum Case?**

  In your answer, you must navigate the following tension:
  1.  If you apply the **Method of Absolute Isolation** strictly to Friend A's mind in the Duet, do you not destroy the "sharedness" required for the good?
  2.  If the **Existence Condition** is satisfied in both the Duet and the Sum Case (the music exists in both), why does it fail to explain the Duet's superiority?
  3.  How does Moore's skepticism about **quantitative summation** (whether doubling the amount of good doubles the value) complicate the comparison between the Duet and the Sum?

  Do not merely define these doctrines. Use them to resolve whether the shared consciousness constitutes a distinct organic unity that exceeds the solitary parts.

  ***

  ### 2. Model Answer

  **Title:** The Irreducibility of Shared Consciousness in Moore's Axiology

  The Duet Case presents a specific challenge to Moore's atomistic methodology. If Moore is to maintain his ranking of friendship and aesthetic enjoyment as the greatest goods, he must argue that the Duet is intrinsically superior to the Sum Case. However, proving this requires navigating the conflict between his Method of Absolute Isolation and his Principle of Organic Unities. The correct Moorean position is that the Duet constitutes a distinct organic unity whose value exceeds the sum of solitary appreciations, precisely because the "sharedness" is a constitutive part that vanishes under strict isolation.

  First, we must address the Method of Absolute Isolation. Moore insists we imagine a state existing alone in the universe to judge its intrinsic worth. In the Duet, the good is not merely A's appreciation plus B's appreciation. It includes the mutual awareness of that appreciation. If we isolate A's mind strictly, removing B's consciousness from the universe, A's state changes from "sharing an experience" to "believing one is sharing." Since Moore values truth, a false belief in sharing is less valuable than actual sharing. Therefore, strict isolation of one part destroys the relational property that generates the specific value of the Duet. This suggests the "shared consciousness" is not a separable part but a feature of the whole. We cannot isolate the relation without dissolving the relata's specific contribution to this whole. Thus, the Isolation Method forces us to evaluate the *joint* state as a single unit of consciousness, rather than two isolated units.

  This leads directly to the Principle of Organic Unities. Moore argues that the value of a whole is not necessarily the sum of its parts. In the Sum Case, we have Solitary A + Solitary B + Affection. In the Duet, we have a unified whole where the appreciation is mutually reflexive. Even if the solitary appreciations have positive value, and affection has positive value, the Duet adds a new part: the *knowledge of shared value*. Moore suggests that consciousness of a beautiful object is good, but consciousness of *another's consciousness* of a beautiful object creates a more complex whole. If we treat the Duet as a mere aggregate, we miss the specific good of the reciprocity. The whole (Duet) contains a part (the reciprocity) that does not exist in the Sum Case. Therefore, the Duet is an organic unity where the presence of the second mind transforms the value of the first mind's appreciation, creating a surplus value that summation cannot capture.

  The Existence Condition complicates this but does not resolve it. Moore holds that appreciation is better if the beautiful object really exists. In both the Duet and the Sum Case, the symphony exists. Thus, the Existence Condition cannot be the differentiator. It acts as a baseline requirement for value in both scenarios but explains neither the superiority of the Duet nor the specific loss incurred if the sharing is illusory. The Existence Condition secures the value of the *object* of consciousness, but the Duet's superiority lies in the *structure* of the consciousness itself. Relying on existence alone would reduce the Duet to merely two instances of true appreciation, ignoring the relational good.

  Finally, we must consider Moore's skepticism regarding quantitative summation. Moore explicitly doubts that two units of good are necessarily twice as valuable as one. Even if we could quantify the solitary appreciation, we have no license to assume the Sum Case equals $Value(A) + Value(B) + Value(Affection)$. Moore's axiology is non-linear. It is entirely consistent with his system that $Value(Duet) > Value(Sum)$ even if the "amount" of appreciation seems identical. The Doubling Doubt cuts against the natural intuition that two solitary listeners equal one pair of shared listeners. The Duet is not "more" appreciation in a quantitative sense; it is a different *kind* of whole.

  In conclusion, the Duet Case is intrinsically better than the Sum Case, but not because it contains more "units" of beauty or existence. It is better because the mutual awareness creates a new organic unity. The Method of Isolation shows we cannot evaluate the sharing by looking at one mind alone; the Existence Condition shows the physical object is not the source of the difference; and the Doubling Doubt frees us from arithmetic aggregation. The surplus value lies in the irreducible relation of shared truth, which Moore's system accommodates only through the Principle of Organic Unities.

  ***

  ### 3. Marking Scheme (Total: 20 Marks)

  **1. Application of Absolute Isolation (4 Marks)**
  *   **Must Hit:** The student must explain that isolating one friend's mind conceptually removes the "sharing," thereby altering the object of evaluation. They must recognize that the *relation* cannot be isolated without destruction.
  *   **Common Error:** Treating isolation as physical separation (e.g., "putting them in different rooms") rather than a conceptual tool for identifying intrinsic properties, or claiming isolation proves the Duet has *no* value because it involves two people.

  **2. Application of Organic Unity (4 Marks)**
  *   **Must Hit:** The student must argue that the Duet is a single whole with a value distinct from the sum of solitary parts. They must identify the "mutual awareness" as the additional part or structural feature that creates the surplus.
  *   **Common Error:** Simply stating "It is an organic unity" as a label without explaining *which* whole and *which* parts are failing to sum, or using the doctrine to dismiss the comparison entirely.

  **3. The Existence Condition Limit (4 Marks)**
  *   **Must Hit:** The student must note that since the music exists in both cases, the Existence Condition cannot explain the *difference* in value between Duet and Sum. It is a necessary condition, not a sufficient differentiator.
  *   **Common Error:** Arguing that the Duet is better *because* the object exists more firmly, or failing to mention the Existence Condition at all despite the prompt's requirement.

  **4. The Quantitative/Doubling Doubt (4 Marks)**
  *   **Must Hit:** The student must reference Moore's skepticism that value aggregates linearly (i.e., $2 \times$ good $\neq$ $2 \times$ value). They must use this to argue that the Sum Case cannot be treated as a simple arithmetic baseline.
  *   **Common Error:** Assuming that if A and B both enjoy the music in the Sum Case, their values automatically add up to equal the Duet, ignoring Moore's explicit rejection of quantitative hedonism.

  **5. Resolution of the Tension/Position (4 Marks)**
  *   **Must Hit:** The essay must take a definitive stance (Yes or No) on whether the Duet is better, synthesizing the three tools to support that stance rather than listing them separately.
  *   **Common Error:** Remaining agnostic ("Moore might say X, but also Y") or concluding that the tools contradict each other so no answer is possible. The prompt requires using the tension to drive the argument.
