      **SUBJECT:** On Fortune, Fire, and the Machine

      You summon me from the dead to ask if your swords are sharp. I look at your briefing and see only men mistaking silence for safety.

      You tell me eighty years have passed without great war. You call this stability. I call it *fortuna*. In my life, I saw princes fall who thought their walls too high for any ladder. You have survived because Fortune has slept, not because your dikes are strong. The near misses you confess—the officer who disobeyed, the glitching screen—these are not anomalies. They are the truth. The peace is the illusion. To argue the system works because it has not yet broken is like praising a house because the fire has not yet reached the thatch.

      Now you propose to hand the keys to a machine. You say compressing the decision window to three minutes is *virtù*. You say a machine does not hesitate. Here, you are fools.

      *Virtù* is the capacity to impose your will upon circumstance. It requires judgment. Impetuosity is sometimes better than caution, yes—I wrote this—but only when the Prince *chooses* to be impetuous to seize *occasione*. To be forced into haste by an algorithm is not boldness; it is slavery. You are not building dikes against the flood; you are digging channels to bring the water faster to your own throat.

      Fortune is a river. In calm weather, you build embankments. When the storm comes, the water rises. By reducing your time to think, you ensure that when the flood comes, you cannot react. You are replacing human fear—which is a useful brake—with mechanical certainty, which has no brake. A machine cannot weigh the cost of ruin. It only knows the signal.

      So, what is to be done? If you must keep these fires, you must slow the fuse, not shorten it. Three minutes is no time for rule. It is only time for reflex. A Prince who cannot deliberate is no Prince; he is a button. Decentralize the authority or remove the trigger. Make the weapon useless without the man.

      However, I must confess where my ink fails. In my time, war was the continuation of politics. You conquer, you rule, you tax. If you lose, you flee or die, but the world remains. You describe a weapon that leaves nothing to rule. If victory means ash, then war is no longer useful. My theories rest on the utility of force. If force consumes the user, the logic collapses. I taught how to gain power, not how to preside over a graveyard.

      You moderns believe you have tamed necessity because you have hidden the blood behind screens. You have not. You have simply made the executioner invisible. Do not trust the machine. It knows nothing of loss. And do not trust your peace. It is borrowed time, lent by a fickle goddess who is already waking up.

      Build your dikes. Or drown.

