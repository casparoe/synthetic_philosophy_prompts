  Nozick's Wilt Chamberlain argument is potent because it links justice to liberty. However, here are the strongest counters, ranked:

  1.  **Historical Justice (Dealbreaker):** Nozick admits if the starting distribution is unjust (theft, colonization), the result is unjust. Given real-world history, almost all current holdings are tainted. This collapses the theory in practice.
  2.  **Democratic Self-Defense (Strong):** G.A. Cohen argues liberty doesn't necessarily upset patterns if people voluntarily maintain them. If society values equality, taxing Wilt isn't coercion; it's enforcing a collective choice everyone agreed to initially.
  3.  **Coercion/Necessity (Awkward):** If "voluntary" transactions occur under duress (e.g., paying for survival), they aren't truly free. Nozick assumes a baseline of rights that might not exist.
  4.  **Digital Goods (Specific):** Your friend is right. Non-rivalrous goods don't require scarcity-based allocation. Entitlement theory struggles with IP and digital assets where copying doesn't deprive others.

  **Predictions:** Nozick predicts a minimal state (taxation = forced labor). Rawlsians predict redistribution to maximize the minimum position. Nozick allows massive inequality; rivals prioritize fairness.

  **Insulation:** The view is logically insulated against end-state critiques but vulnerable to historical ones. Hardcore fans admit the "initial acquisition" problem stings—it's hard to prove any property was originally justly acquired without violating the Lockean proviso (leaving enough for others).

  **Verdict:** It's well-insulated theoretically but empirically fragile. The risk is that by qualifying the theory to accommodate historical injustice, it loses its protective power for current wealth. It becomes a radical critique of existing property rights rather than a defense of them. It's a strong shield for ideal cases, but weak for actual ones.
