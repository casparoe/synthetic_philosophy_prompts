prompt: |-
  So my brother's been in what the ICU team is calling a minimally conscious state for about seven weeks now (cardiac arrest, hypoxic injury) and we're going to have to make decisions about long-term care pretty soon, and I've ended up reading about integrated information theory because someone in a family support group said it was the one theory that actually hands you a number you could in principle measure at the bedside. I don't love how much of what I've found is either hype or people calling it pseudoscience, so I want to step back and do this properly.

  What I actually want is a spec. Forget IIT for a minute: what would a theory of consciousness have to get right for it to be good enough to be used for a decision like ours — where the question is "is this particular patient, right now, conscious, and if so how much, and conscious of what", and where the only evidence you can realistically get is noisy EEG or fMRI from someone who can't follow commands reliably (or might be covertly aware; nobody can tell). Give me the desiderata with the case or consideration behind each: the phenomena it has to cover, the distinctions it can't collapse, the findings it can't contradict, the practical measurement requirements. And say which requirements you think are non-negotiable and which are just preferences of one camp or another.

  Some specific things I want adjudicated rather than assumed:

  - Level versus content. Is "how much consciousness" even separable from "consciousness of what", or does asking for one number for a patient already beg the question?
  - The cerebellum thing (more neurons than cortex, apparently contributes nothing to experience) and the seizure thing (massive synchronized activity, consciousness gone). Are these genuine desiderata or just anecdotes people repeat because they're rhetorically handy?
  - Grain. Does a theory's verdict have to stay stable when you redescribe the same system at a finer or coarser level — single spikes versus cortical columns versus two-second fMRI voxels? I keep getting the impression that with IIT you get different answers depending on where you draw the lines, and if that's right I want to know whether grain-robustness is a real requirement or a prejudice I'm smuggling in.
  - The redundant copy case. Suppose a chunk of cortex were duplicated so both copies recieve the same input and one copy's output is discarded. Does consciousness double, stay put, or split into two? Why does an adequate theory have to have an answer here, and which answers are already off the table?
  - Whether "the system must matter to itself" style requirements (intrinsicality, or whatever the current postulate wording is) are doing real work, or are just a way of defining the competitors out of the running.
  - And flicker: sleep, anesthesia, absence seizures. A theory has to let the same patient come in and out, not just sort whole organisms into bins.

  Then flag any pair or subset of the requirements you think can't be jointly satisfied — that's the part I most want to see — and tell me which single requirement knocks out the most candidates, IIT included. A short scorecard at the end is fine, but keep the weight on the criteria and their motivating cases, that's what I need. American English please, and skip citations and reading lists, I can't chase anything up right now.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Sibling of a patient in a Minimally Conscious State (MCS) following cardiac arrest/hypoxic injury (7 weeks post).
      *   **Context:** Facing high-stakes medical decisions (long-term care, potentially withdrawal of support). Encountered Integrated Information Theory (IIT) via a support group. Skeptical of hype/pseudoscience claims. Wants a rigorous, practical evaluation framework.
      *   **Task:** Provide a "spec" (specification/desiderata) for a theory of consciousness suitable for clinical decision-making.
      *   **Specific Constraints:**
          *   Forget IIT for a minute (focus on general theory requirements).
          *   Address specific philosophical/technical questions (Level vs. Content, Cerebellum/Seizures, Grain/Scale, Redundant Copy, Intrinsicality, Flicker/States).
          *   Identify incompatible requirements (trade-offs).
          *   Identify the single most eliminative requirement.
          *   Provide a scorecard (brief).
          *   Tone: American English, no citations/reading lists, empathetic but rigorous/objective.
          *   **Crucial Ethical/Safety Note:** This is a medical decision context. I must not give medical advice or validate IIT (or any theory) as a clinical diagnostic tool. I need to be clear that *no* current theory is validated for this purpose.

  2.  **Determine the Core Challenge:**
      *   The user is asking for a "spec" for a theory of consciousness to be used *clinically* to determine consciousness in a non-communicative patient.
      *   *Hard Truth:* There is no such theory currently validated for clinical use. IIT is experimental. The "Perturbational Complexity Index" (PCI) derived from IIT concepts is the closest thing, but it's not a definitive "consciousness meter."
      *   *Goal:* I need to answer the philosophical/theoretical questions rigorously while maintaining the boundary that this is theoretical, not clinical advice. I need to validate their skepticism without crushing hope, but definitely without overstating scientific certainty.

  3.  **Drafting the Desiderata (The "Spec"):**
      *   I need to categorize the requirements into: Phenomenological Fit, Physical/Neural Fit, and Practical/Clinical Feasibility.
      *   *Phenomenological:* Must account for wakefulness vs. awareness (Level vs. Content). Must account for state changes (Flicker).
      *   *Physical/Neural:* Must explain the Cerebellum (high neuron count, low consciousness contribution). Must explain Seizures (high activity, low consciousness). Must handle Grain/Scale.
      *   *Practical:* Must be measurable at the bedside (EEG/fMRI compatible). Must be robust to noise.

  4.  **Addressing Specific Adjudications:**
      *   *Level vs. Content:* Crucial distinction. Arousal (wakefulness) vs. Awareness (content). A single number is likely insufficient. *Verdict:* Separable but interacting. A theory needs both.
      *   *Cerebellum/Seizures:* These are not anecdotes; they are hard constraints. Cerebellum = feedforward/low integration. Seizures = hypersynchronous/low differentiation. A theory *must* explain why more neurons or more activity $\neq$ more consciousness.
      *   *Grain:* This is the "scale problem." IIT struggles here (exclusion postulate tries to fix it). A clinical theory *must* be robust to measurement scale (EEG vs. fMRI). If the answer changes based on the tool, it's useless clinically.
      *   *Redundant Copy:* This is the "fading qualia" or "duplication" puzzle. For clinical use, this is less critical than the others, but theoretically, consciousness shouldn't double just because hardware is duplicated without functional integration.
      *   *Intrinsicality ("Matter to itself"):* This is the core of IIT. Is it real work? Yes, it distinguishes feedforward (camera) from recurrent (brain). But it's hard to measure.
      *   *Flicker:* Non-negotiable. Sleep/anesthesia/coma are dynamic. A static theory fails.

  5.  **Identifying Incompatible Requirements (The Trade-offs):**
      *   *Precision vs. Feasibility:* To get the "true" answer (intrinsicality, exact grain), you need invasive or impossibly complex measurements. To get a bedside answer (EEG), you lose resolution.
      *   *Level vs. Content:* Collapsing them into one number (like $\Phi$) simplifies measurement but loses clinical nuance (e.g., locked-in vs. vegetative).
      *   *Grain Robustness vs. Physical Specificity:* If you demand the answer be the same at the neuron level and the voxel level, you might rule out theories that depend on specific micro-architecture.

  6.  **Identifying the "Knockout" Requirement:**
      *   What kills the most theories (including IIT)?
      *   *Candidate 1:* Clinical Feasibility (kills almost all philosophical theories).
      *   *Candidate 2:* The Cerebellum/Seizure Constraint (kills simple "activity level" or "neuron count" theories).
      *   *Candidate 3:* Grain Robustness (kills theories dependent on specific scales).
      *   *Selection:* **Empirical Validation in Disorders of Consciousness (DOC).** A theory might fit the philosophy, but if it doesn't correlate with behavioral recovery or covert awareness markers (like command following) in *this specific population*, it's useless. However, sticking to the *theoretical* constraints requested: **The Cerebellum/Seizure Constraint (Differentiation + Integration)** is the hardest physical constraint that rules out naive metrics.
      *   *Wait, looking closer at the prompt:* "Which single requirement knocks out the most candidates, IIT included."
      *   IIT actually handles Cerebellum/Seizures well (that's its selling point).
      *   What knocks out IIT? **Grain/Scale Robustness** and **Clinical Feasibility/Validation.**
      *   Let's go with **Measurement Invariance (Grain) + Clinical Correlation.** Actually, the prompt asks for *theoretical* desiderata. The hardest theoretical constraint that creates tension is **Grain Robustness vs. Physical Causality.**
      *   *Better angle:* The requirement that kills the most *practical* utility is **Level/Content Separation.** If a theory gives one number, it's clinically dangerous.
      *   *Best angle for "Knockout":* **Empirical Adequacy in Pathological States.** Many theories work for healthy brains, fail for injured ones.
      *   *Refining:* Let's focus on **Differentiation + Integration (The Seizure/Cerebellum constraint).** This kills "activity level" theories. But does it kill IIT? No.
      *   *Let's look at the "Incompatible Requirements" section.* The tension between **Intrinsicality** (hard to measure) and **Bedside Feasibility** (noisy EEG) is the real killer.
      *   *Decision:* The "Knockout" is **Operationalizability at the Bedside without Behavioral Assumptions.** Most theories assume behavior to validate. In DOC (Disorders of Consciousness), behavior is absent by definition. A theory that requires behavioral validation to calibrate is circular here.

  7.  **Structuring the Response:**
      *   **Disclaimer:** Immediate, clear statement that this is theoretical, not medical advice. No theory is currently standard of care.
      *   **Introduction:** Acknowledge the gravity of the situation. Validate the skepticism.
      *   **The Spec (Desiderata):** Grouped by Phenomena, Physical Constraints, and Measurement.
      *   **Adjudications:** Address the specific bullet points (Level/Content, Cerebellum, Grain, Copy, Intrinsicality, Flicker).
      *   **Incompatibilities:** Where the specs fight each other.
      *   **The Knockout:** The single hardest filter.
      *   **Scorecard:** Brief summary.
      *   **Closing:** Compassionate but firm boundary on decision-making.

  8.  **Refining the Tone:**
      *   Needs to be respectful, clear, direct (American English), and devoid of academic fluff.
      *   Avoid giving false hope about IIT.
      *   Ensure the distinction between "arousal" and "awareness" is clear, as this is critical for MCS vs. Vegetative State.

  9.  **Self-Correction/Safety Check during drafting:**
      *   *Risk:* User might use this to demand PCI testing or make a decision based on a "score."
      *   *Mitigation:* Reiterate that *no* metric is definitive. Emphasize that "consciousness" in a clinical setting is often defined by *capacity for experience*, which is inferred, not measured directly.
      *   *Risk:* Validating IIT too much.
      *   *Mitigation:* Highlight IIT's weaknesses (grain, calculation complexity) alongside strengths.
      *   *Risk:* Validating IIT too little.
      *   *Mitigation:* Acknowledge why the support group mentioned it (PCI is the leading candidate for *measurement*, even if the theory is debated).

  10. **Final Polish:** Check against all specific constraints in the prompt (Level vs Content, Cerebellum, Grain, Copy, Intrinsicality, Flicker, Incompatibilities, Knockout, Scorecard).

  *(Self-Correction on the "Knockout"):* The prompt asks what knocks out candidates *including IIT*. IIT is often criticized for the "Grain" problem (Exclusion Postulate is controversial) and the "Panpsychism" implication (which doesn't affect clinical use but affects theoretical validity). However, the most practical knockout for *clinical use* is **Validation against Covert Awareness.** If a theory says a patient is conscious but they never show signs of command following (or vice versa), it fails. But that's empirical. Theoretically? **Grain Robustness.** IIT struggles to define *why* the macro scale is the conscious one without begging the question. Let's go with **Measurement Invariance (Grain)** as the theoretical knockout, and **Clinical Validation** as the practical one. I will combine them: **Operational Invariance.**

  *Wait, one more check:* "Level versus content... does asking for one number... beg the question?" This is a key insight. I need to affirm that collapsing them is a category error for clinical decisions.

  *Okay, ready to write.*
answer: |-
  I am deeply sorry you and your family are facing this. It is an incredibly heavy burden to carry, and your instinct to step back from the hype and demand a rigorous specification is the right one. You are right to be skeptical. There is currently no "consciousness meter" validated for clinical decision-making. No theory, including Integrated Information Theory (IIT), is the standard of care.

  What follows is a theoretical specification for what a *usable* theory would need to look like in your brother's specific context (Disorders of Consciousness, or DOC). This is not medical advice, and it is not an endorsement of any specific test. It is a framework for evaluating the claims being made to you.

  ### The Specification: Desiderata for a Clinical Theory of Consciousness

  For a theory to be useful in a case like your brother's, it must satisfy three categories of requirements: Phenomenological (what it claims to measure), Physical (how it maps to the brain), and Operational (how we measure it).

  #### 1. Phenomenological Requirements
  *   **The Flicker Constraint (State Sensitivity):** The theory must allow the *same* physical system to transition between conscious and unconscious states without structural change.
      *   *Consideration:* Your brother's brain structure hasn't changed much week-to-week, but his state might have. A theory that defines consciousness by anatomy alone (e.g., "if the cortex is intact, he is conscious") fails. It must account for sleep, anesthesia, and coma dynamics.
  *   **The Level/Content Distinction:** The theory must distinguish between *arousal* (wakefulness, eyes open, sleep-wake cycles) and *awareness* (the subjective experience of content).
      *   *Consideration:* A patient can be awake but unaware (Vegetative State/Unresponsive Wakefulness Syndrome) or aware but unable to move (Locked-In Syndrome). Collapsing these into a single number is clinically dangerous.
  *   **The Suffering Constraint:** If the theory posits consciousness, it must be able to indicate the *valence* (positive/negative) or at least the capacity for suffering.
      *   *Consideration:* The ethical weight of the decision rests on whether he can suffer. A theory that detects "information processing" but cannot distinguish between a reflex and pain is insufficient.

  #### 2. Physical/Neural Requirements
  *   **The Cerebellum Constraint:** The theory must explain why the cerebellum (containing ~80% of the brain's neurons) can be removed or silenced without abolishing consciousness, while much smaller cortical areas are critical.
      *   *Consideration:* This rules out any theory that equates consciousness with simple neuron count or raw firing rates.
  *   **The Seizure Constraint:** The theory must explain why generalized seizures (massive, high-energy, synchronized electrical activity) correlate with a *loss* of consciousness.
      *   *Consideration:* This rules out theories that equate consciousness with "high activity" or "global synchronization."
  *   **The Feedforward Constraint:** The theory must distinguish between a system that processes information and discards it (like a camera or the cerebellum) and one that integrates it.
      *   *Consideration:* A reflex arc processes input and produces output without conscious experience. The theory must identify the specific architecture that turns processing into experience.

  #### 3. Operational Requirements
  *   **Noise Robustness:** The metric must be stable despite the artifacts present in ICU monitoring (movement, life-support machines, medication effects).
  *   **Grain Invariance:** The verdict (conscious/unconscious) should not flip-flop simply because you change the measurement resolution (e.g., single neurons vs. EEG electrodes vs. fMRI voxels).
  *   **Behavioral Independence:** The theory cannot rely on the patient following commands to validate the measurement.
      *   *Consideration:* In DOC, behavioral absence is the definition of the problem. A theory that requires a button press to calibrate is circular.

  ---

  ### Adjudication of Specific Cases

  Here is how a robust theory must handle the specific puzzles you raised.

  **1. Level versus Content**
  *   **Verdict:** They are separable, and asking for one number is a category error.
  *   **Reasoning:** "How much" consciousness (level) and "what" consciousness (content) rely on different neural mechanisms. Arousal is largely brainstem/thalamic; awareness is cortico-thalamic. A single scalar value (like IIT's $\Phi$) conflates the *capacity* for experience with the *complexity* of the experience. For your decision, you need to know if there is *any* capacity for suffering (Level > 0), not how complex his thoughts are. A theory that outputs only one number is clinically under-specified.

  **2. The Cerebellum and Seizure Thing**
  *   **Verdict:** These are non-negotiable hard constraints, not anecdotes.
  *   **Reasoning:** These are the "control groups" nature has provided.
      *   *Cerebellum:* It has high neuron density but is wired in a feedforward, modular fashion. It does not re-enter information into the main processing loop. A theory must require **recurrent integration**, not just processing power.
      *   *Seizures:* During a seizure, neurons fire together so synchronously that the system loses **differentiation**. If everyone shouts the same word at the same time, no information is exchanged. A theory must require a balance of Integration (unity) and Differentiation (complexity). If it doesn't explain why seizures wipe out consciousness, discard it.

  **3. Grain (Scale)**
  *   **Verdict:** Grain-robustness is a non-negotiable requirement for clinical use.
  *   **Reasoning:** If a theory says a patient is conscious at the level of cortical columns but unconscious at the level of EEG electrodes, it is useless to you. You cannot measure cortical columns at the bedside. IIT attempts to solve this with the "Exclusion Postulate" (consciousness exists at the scale of maximum integration), but this is theoretically controversial and practically hard to verify. For a clinical spec, the metric must be stable across the resolution of the available tools (EEG/fMRI). If the answer depends on where you draw the line, the theory is not ready for prime time.

  **4. The Redundant Copy Case**
  *   **Verdict:** Consciousness should stay put (or split, but not double in a way that matters ethically).
  *   **Reasoning:** If you duplicate a cortex and discard the output of one, you have not created two independent centers of experience because they are not causally distinct in the system's logic. They are receiving the same drive. An adequate theory must tie consciousness to **causal autonomy**. If the copy is causally redundant, it adds no new "point of view." This matters because it prevents us from inflating the moral status of a patient based on redundant tissue growth or swelling.

  **5. Intrinsicality ("Matter to itself")**
  *   **Verdict:** This is doing real work, but it is the hardest to measure.
  *   **Reasoning:** This requirement distinguishes a "zombie" system (which processes data but experiences nothing) from a conscious one. It demands that the system's current state constrains its own past and future states more than it is constrained by outside inputs. This is the core insight behind why a camera isn't conscious. However, for your purposes, this is a "black box" requirement. You cannot measure intrinsicality directly; you can only infer it from connectivity. It is a necessary theoretical condition, but practically, you are relying on proxies.

  **6. Flicker (Sleep/Anesthesia/Coma)**
  *   **Verdict:** Non-negotiable. The theory must be dynamic.
  *   **Reasoning:** Consciousness is a process, not a substance. A theory that sorts organisms into bins (Human = Conscious, Rock = Unconscious) fails to explain why *you* were unconscious last night. It must track the *capacity* to sustain complex states over time. In the ICU, this means the metric must fluctuate with medication levels and circadian rhythms.

  ---

  ### Incompatible Requirements (The Trade-offs)

  You asked for pairs or subsets of requirements that cannot be jointly satisfied. This is where the rubber meets the road.

  **1. Grain Invariance vs. Physical Specificity**
  *   **Conflict:** To be truly accurate, a theory probably needs to know the exact micro-architecture (which neurons connect to which). To be clinically usable, it must work on coarse data (EEG electrodes centimeters apart).
  *   **Result:** You cannot have both perfect theoretical accuracy and bedside feasibility. Any theory used at the bedside is necessarily a **heuristic approximation**. It is trading truth for usability. You must accept that a bedside "score" is a probability, not a fact.

  **2. Intrinsicality vs. Observability**
  *   **Conflict:** Intrinsicality requires knowing the system's internal causal power from the *inside* (in principle). We are always on the *outside*. We can only measure correlations (input/output).
  *   **Result:** We can never strictly prove intrinsicality. We assume it based on structural similarity to healthy brains. This means any diagnosis of consciousness in a non-communicative patient is an **inference to the best explanation**, not a direct measurement.

  **3. Level/Content Separation vs. Single-Number Simplicity**
  *   **Conflict:** Families and clinicians want a single "percentage of consciousness" to make decisions easier. But as established, Level and Content are distinct.
  *   **Result:** Demanding a single number forces the theory to lie. It will either overestimate (counting arousal as awareness) or underestimate (missing low-complexity awareness). A theory that offers one number is simplifying the ethics for you, not clarifying them.

  ---

  ### The Knockout Requirement

  If I must choose one requirement that knocks out the most candidates, including IIT in its full theoretical form:

  **Operational Invariance at the Bedside (Grain + Noise Robustness).**

  Here is why: Many theories (including IIT) work beautifully in simulation or on healthy, cooperative subjects with high-resolution equipment. They fail when applied to an injured brain measured by noisy EEG in a noisy ICU.
  *   **Why it knocks out IIT:** Calculating the true theoretical metric of IIT ($\Phi$) is computationally intractable for a human brain. The clinical version (PCI - Perturbational Complexity Index) is an approximation. It works well for distinguishing wakefulness from sleep/anesthesia, but its accuracy in chronic Disorders of Consciousness (like your brother's 7-week state) is still being validated. It is not yet a "truth meter."
  *   **Why it knocks out others:** Global Workspace Theory is hard to measure without behavioral reports. Higher-Order Thought theories are impossible to measure in non-communicative patients.

  **The Single Hardest Filter:** **The Seizure/Cerebellum Constraint.**
  If a theory cannot explain why the cerebellum doesn't generate consciousness despite its size, or why seizures abolish it despite high energy, it is scientifically dead. This kills all "quantity of activity" theories. It leaves only "quality of connectivity" theories (like IIT or Global Neuronal Workspace). Between those two, the **Operational Invariance** is what determines clinical utility.

  ---

  ### Scorecard

  | Requirement | Status | Notes for Decision Making |
  | :--- | :--- | :--- |
  | **Level/Content Split** | **Critical** | Do not accept a single number. Ask specifically about *awareness*, not just wakefulness. |
  | **Cerebellum/Seizure** | **Critical** | If a proponent ignores these, stop listening. They are the baseline validity check. |
  | **Grain Invariance** | **High** | Ask if the test result changes if they use EEG vs. fMRI. If yes, the result is fragile. |
  | **Flicker/State** | **High** | Ensure testing is done when sedation is minimized and at different times of day. |
  | **Intrinsicality** | **Medium** | Theoretically vital, but practically invisible. Rely on connectivity proxies. |
  | **Redundant Copy** | **Low** | Philosophically interesting, rarely impacts clinical prognosis in hypoxic injury. |

  ### Final Consideration

  You are looking for a spec to help you make a decision about long-term care. I need to be brutally honest about the limitation of this exercise: **Consciousness theories describe *capacity*, not *quality of life*.**

  Even if a theory confirms your brother is "conscious" (has some integrated information), it does not tell you if he is in pain, if he recognizes you, or if he would want to continue in his current state. A theory can tell you the lights are on, but it cannot tell you if anyone is home who wants to stay.

  The most robust clinical approach right now is not a single theory, but **multimodal convergence**. If the EEG suggests awareness, *and* the fMRI shows command-following (motor imagery), *and* the clinical exam shows visual tracking, the confidence is high. If they conflict, the theory is less important than the uncertainty.

  Use these criteria to vet the experts talking to you. If they cannot explain why the cerebellum doesn't count, or if they offer you a single percentage number as a fact, they are overselling. If they acknowledge the grain problem and the distinction between arousal and awareness, they are being honest with you.

  I hope this gives you the leverage you need to navigate the conversations ahead.
