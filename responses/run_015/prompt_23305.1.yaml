answer: |-
  Here is a draft position paper tailored for your seminar. It is structured to be concise, argumentative, and philosophically rigorous, focusing on the normative undecidability of the aggregation rule itself.

  ***

  **Title:** Beyond Formalism: The Discursive Dilemma as a Substantive Crisis of Collective Agency

  **1. Introduction**
  The discursive dilemma (or doctrinal paradox) is frequently treated in formal social choice theory as a consistency problem to be managed. The standard deflationary view holds that the paradox arises merely from an ambiguity in the agenda: once a group commits *ex ante* to either a premise-based procedure (PBP) or a conclusion-based procedure (CBP), the logical inconsistency vanishes. In this seminar, I contend that this "technical fix" response misunderstands the philosophical weight of the dilemma. The discursive dilemma is not a bug in the aggregation mechanism that can be patched by selecting a rule; it is a substantive, normative crisis regarding collective agency. The core problem is not that majority voting yields inconsistent sets of judgments, but that the choice *between* aggregation rules is itself undecidable from the inside of the democratic process without sacrificing core values of reason-responsiveness or democratic sovereignty.

  **2. The Concrete Stakes: The Jury Trilemma**
  To ground this, consider the classic three-judge jury case regarding a defendant's liability. Let $p$ represent *actus reus*, $q$ represent *mens rea*, and $r$ represent the verdict "Guilty," where the doctrinal constraint is $r \leftrightarrow (p \land q)$.

  | Judge | $p$ (Actus) | $q$ (Mens Rea) | $r$ (Guilty) |
  | :--- | :---: | :---: | :---: |
  | **1** | Yes | Yes | Yes |
  | **2** | Yes | No | No |
  | **3** | No | Yes | No |
  | **Majority** | **Yes** | **Yes** | **No** |

  Here, the majority accepts the premises ($p$ and $q$) but rejects the conclusion ($r$). If we aggregate on premises (PBP), the verdict is Guilty. If we aggregate on conclusions (CBP), the verdict is Not Guilty.

  The deflationary objection suggests this is merely a coordinate error. "Simply decide beforehand," the objection goes, "whether you are voting on the reasons or the outcome." Once the rule is fixed, the inconsistency disappears.

  **3. The Undecidability of the Aggregation Rule**
  I argue that this objection fails because it treats the selection of the aggregation rule as a neutral, procedural meta-decision. It is not. The choice between PBP and CBP embodies a conflict between two competing democratic ideals: **collective rationality** (the group's views should be logically integrated) and **collective sovereignty** (the group's will on the outcome should prevail).

  If the group attempts to resolve this choice democratically—by voting on which rule to use—they face the discursive dilemma again at the meta-level.
  *   If they vote on *which rule to use* (a conclusion), they are using CBP to decide the rule, which privileges the outcome over the reasons for the rule.
  *   If they vote on the *premises of which rule is better* (e.g., "Is reason-responsiveness valuable?"), they are using PBP, which presupposes the value of reason-responsiveness.

  There is no "view from nowhere" to select the rule. The choice is undecidable from the inside because any procedure used to select the aggregation rule already presupposes a commitment to either premise-priority or conclusion-priority. To say "just pick one" is to arbitrary impose a normative hierarchy that the group itself cannot justify without circularity.

  **4. Substantive Costs, Not Technical Glitches**
  Treating the dilemma as a technical artifact ignores the substantive costs of the "solutions."

  *   **The Cost of PBP:** If we enforce premise-based aggregation to ensure logical consistency, we risk overriding the majority's will on the ultimate outcome. In the jury case, PBP renders a "Guilty" verdict even though a majority of judges believe the defendant is "Not Guilty." This creates a "reasons tyranny," where the logical implications of the premises override the explicit judgment of the majority on the matter at hand.
  *   **The Cost of CBP:** If we enforce conclusion-based aggregation to respect the majority verdict, we sever the connection between the group's decision and its reasons. The group ends up with a "Guilty/Not Guilty" verdict that is not supported by the majority's view on the constitutive elements of that verdict. This renders the collective agent irrational; it holds a belief ($r$) that it does not endorse the grounds for ($p \land q$).

  Therefore, the dilemma is not resolved by picking a rule; it is merely displaced. We are forced to choose between a group that is rational but potentially undemocratic (PBP) or a group that is democratic but potentially irrational (CBP).

  **5. Implications for Collective Agency**
  The deeper tension here points to a limitation in the concept of collective agency itself. Individual agents rarely face this dilemma because their beliefs and intentions are usually integrated psychologically. If I believe $p$ and $q$, and I know $r \leftrightarrow (p \land q)$, I generally cannot help but believe $r$.

  Groups, however, are plural. The discursive dilemma reveals that a group cannot simultaneously satisfy the conditions of **responsiveness** (tracking members' views), **consistency** (holding logical beliefs), and **anonymity** (treating members equally) across interconnected propositions. This is not a formal quirk; it is an ontological constraint on group minds. It suggests that "collective rationality" is not isomorphic to "individual rationality." A group cannot simply be a "super-individual."

  **6. Conclusion**
  To dismiss the discursive dilemma as a technical artifact solvable by fixing an aggregation rule is to ignore the normative vacuum at the center of collective decision-making. The inability to non-arbitrarily choose between premise-based and conclusion-based procedures demonstrates that the dilemma is substantive. It highlights a fundamental tension in how groups form beliefs: we cannot have both perfect democratic responsiveness to individual judgments and perfect logical consistency in collective output. The discursive dilemma is not a puzzle to be solved; it is a feature of collective agency that we must manage, acknowledging that every aggregation rule entails a normative loss.

  ***

  ### Tips for Seminar Defense:
  *   **If they say:** "But in practice, courts *do* just pick a rule (e.g., special verdicts vs. general verdicts)."
      *   **You say:** "Exactly, but that's an institutional *imposition*, not a democratic resolution. The fact that an external authority (the law) must dictate the rule proves my point: the group cannot generate the rule from within without facing the paradox again."
  *   **If they say:** "Isn't this just solved by supermajorities?"
      *   **You say:** "No, that just changes the threshold. The structural inconsistency remains if the propositions are logically connected. You can dilute the probability of the paradox occurring, but you haven't resolved the normative conflict between the two procedures."
  *   **Key Citation to drop:** Philip Pettit (on the "discursive dilemma" and group agency) or Christian List (on the impossibility theorem). Mentioning Pettit's idea that groups must "discipline" themselves to be agents strengthens the "substantive" argument.
