answer: |-
  The separateness-of-persons objection asserts that society is not a super-person whose gains and losses can be balanced across individual boundaries. Applying this to a compensation fund requires distinguishing between three interpretations of the constraint.

  The **no-substitution reading** claims outcomes must not trade one person's loss for another's gain. The **reasons-that-are-yours reading** claims the *justification* for an award cannot rely on aggregate welfare. The **no-mere-channels reading** claims persons cannot be treated as conduits for welfare flow.

  These readings diverge sharply when applied to the fund's features. Under the **earnings-based formula**, no-substitution permits the variance because it tracks individual loss, not aggregate utility. Reasons-that-are-yours also permits it, provided the justification cites the individual's earning capacity, not the need to save money for others. No-mere-channels is silent here, as pricing lives differently does not necessarily treat them as conduits.

  The **narrowing-the-gap rule** is the critical test. No-substitution forbids it if it reduces a high-earner's award solely to boost a low-earner's; it demands full compensation of loss regardless of the total. Reasons-that-are-yours forbids it if the Special Master's justification cites "fairness across the group" or "budget management" as the reason for reducing a specific claim. However, if the justification is that marginal utility of money diminishes for the specific recipient (a claim about the individual, not the group), it might pass. No-mere-channels forbids it if the rule treats the claimant pool as a single body to be equilibrated.

  Regarding **offsets** for collateral sources, no-substitution permits them (the individual loss is genuinely smaller). Reasons-that-are-yours permits them if justified by the individual's receipt of funds, not by the fund's solvency. No-mere-channels permits them.

  For the **non-adversarial appeal** and **waiver of suit**, no-substitution is indifferent to process. Reasons-that-are-yours permits non-adversarial processes unless they prevent the claimant from asserting their distinct status. No-mere-channels might prefer adversarial processes as affirmations of individual standing, but does not strictly require them.

  On **claimant inclusion**, no-substitution demands compensation for all harmed persons. Reasons-that-are-yours forbids excluding groups (like rescue workers) if the justification is budgetary containment rather than principled causation. No-mere-channels forbids exclusion that treats certain humans as outside the moral community.

  **The Actual Content of the Objection**
  The **reasons-that-are-yours** reading is the actual content of the objection. The no-substitution reading is too rigid for a world of scarcity; it demands full compensation even when the pie is too small, rendering the theory action-guiding only in ideal conditions. The no-mere-channels reading is metaphysically vague; it describes a status but offers little administrative traction. The reasons-based reading captures the moral injury: it is not the inequality itself that violates separateness, but the justification that uses one person as a means to balance the books for others. It forbids aggregative justification, not aggregative outcomes necessitated by scarcity.

  **Complications**
  First, the **identity problem**. In wrongful death, the decedent cannot be a rights-bearer. The separateness to be respected belongs to the **survivors**. They are the distinct persons suffering the secondary loss of support and companionship. Treating the estate as a single legal person risks violating the separateness of multiple survivors (e.g., a spouse versus distant heirs) if the fund distributes based on estate value rather than survivor loss.

  Second, the **constituency problem**. The objection constrains **who counts** as much as how they are paid. If the allocation rule defines the claimant group to keep numbers manageable (e.g., excluding residents with respiratory claims to save money for families of the dead), it violates separateness. It treats the excluded as non-persons for the purpose of the fund. The boundaries must be drawn by principled causation, not budgetary convenience.

  Third, the **counterfactual-claimant problem**. Because the fund was capped while the population was uncapped, each award depended on how many others showed up. This **is** the kind of aggregation the objection targets. If my award is reduced because you filed a claim, the fund is treating us as competitors for a fixed resource rather than distinct victims owed redress. However, if the scarcity is exogenous (true lack of resources) rather than endogenous (arbitrary cap), the objection loses traction. Here, the cap was statutory, making the scarcity political. Therefore, the dependency of my award on your presence violates separateness because it makes my right contingent on your numbers.

  **Where the Theory Goes Silent**
  The theory offers no formula for distributing insufficient funds. It forbids using aggregate justification, but if the total money is less than the total loss, some aggregation is inevitable. It does not dictate whether an adversarial process is more respectful than a uniform formula; a uniform formula might actually better respect separateness by treating like cases alike without forcing individuals to fight for recognition. Finally, the expressive function of the state addressing a crowd is not ruled out by separateness, provided the message acknowledges individual distinctness. That is a dignity consideration, not a separateness constraint.

  **Observable Symptom of Violation**
  An outside observer could detect a violation if the fund's internal documents show **line-item budgeting affecting individual awards**. If adjudicators are instructed to "keep the average award under $X to ensure solvency for future claimants," the fund is using current claimants as channels for future stability.

  **Design Recommendations**

  1.  **Rule:** Calculate economic loss based strictly on individual decedent earnings and survivor dependency, without reference to the total fund balance.
      *   **Reading:** Reasons-that-are-yours.
      *   **Status:** Required.

  2.  **Rule:** Do not adjust individual awards to narrow the gap between high and low earners unless the justification cites the specific marginal utility of money to that recipient, not group equity.
      *   **Reading:** Reasons-that-are-yours.
      *   **Status:** Required.

  3.  **Rule:** Define eligibility based on physical presence and medical causation, not on the availability of funds to pay subsequent claims.
      *   **Reading:** Constituency Problem (derived from Reasons-that-are-yours).
      *   **Status:** Required.

  4.  **Rule:** Allow claimants to opt for a presumptive award based on averages rather than individualized proof, to reduce administrative burden.
      *   **Reading:** No-mere-channels.
      *   **Status:** Merely Permitted (separateness does not demand adversarial proof).

  5.  **Rule:** Disclose collateral offsets only as they relate to the specific survivor's receipt of funds, not to the fund's need to preserve capital.
      *   **Reading:** Reasons-that-are-yours.
      *   **Status:** Required.

  **Decisions Left to Other Grounds**

  1.  **Proration Mechanism:** If total validated claims exceed the cap, the objection does not tell us whether to prorate everyone equally or prioritize certain classes (e.g., families over businesses). This must be decided on grounds of political legitimacy or prioritarianism.

  2.  **Process Style:** The objection does not determine whether an informal, non-adversarial hearing is preferable to a court-like trial. This should be decided based on efficiency and the psychological needs of the grieving, not separateness.
