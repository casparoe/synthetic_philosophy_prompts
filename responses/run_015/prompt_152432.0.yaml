          *   Brain/Body separation $\rightarrow$ Compute/Storage separation.
          *   Teletransportation $\rightarrow$ State migration/snapshotting.
          *   Duplicate bodies $\rightarrow$ Split-brain/Active-Active replication.
          *   "Where am I?" $\rightarrow$ "Which node is Primary?"
      *   *Distortions:*
