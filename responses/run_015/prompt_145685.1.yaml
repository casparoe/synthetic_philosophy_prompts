  Here is the breakdown of the rule she is using, an alternative rule that fits her data just as well, and the scenario that exposes the crack between them.

  ### 1. Her Actual Rule: "Causal-Functional Continuity"
  Your friend is not a "Matter" theorist (otherwise Verdict 1 would be "Different") and not a pure "Form" theorist (otherwise Verdict 4 would be "Same").

  She is a **Causal-Historical** theorist. To her, the ship is not a collection of wood or a shape; it is a **single, unbroken event in spacetime.**

  *   **Verdict 1 (Gradual):** The event never stops. The causal chain is unbroken. **(Same)**
  *   **Verdict 2 (Rebuild Elsewhere):** The event was terminated. The planks were made into a *new* object (a museum exhibit). The causal chain of the *vessel* was broken to create a *memorial*. **(Different)**
  *   **Verdict 3 (Sink/Rebuild):** The event was interrupted by trauma, not terminated by intent. Because it was recovered *in situ* (same spot), the narrative of the object resumes rather than restarts. It's a "survivor," not a "replica." **(Same)**
  *   **Verdict 4 (3D Print):** This is a copy. It shares data, not history. The causal chain starts fresh at the printer. **(Different)**

  **The Rule:** *Identity persists if there is an unbroken chain of functional existence, or if a break is accidental but repaired in the original context with majority matter.*

  ### 2. The Alternative Rule: "Critical Mass + Anchor"
  We can construct a different rule that fits her four verdicts perfectly but relies on different mechanics. Let's call this the **"Material Threshold" Rule.**

  This rule states: *An object retains identity only if it retains >50% of its original matter at any given time, unless it is reconstructed on its original anchor point.*

  *   **Verdict 1 (Gradual):** You never replace more than 50% at once. The "core" always remains. **(Same)**
  *   **Verdict 2 (Rebuild Elsewhere):** You removed 100% of the matter. The core was lost. Plus, the location changed. **(Different)**
  *   **Verdict 3 (Sink/Rebuild):** You kept 90% of the matter (above the threshold) and kept the location anchor. **(Same)**
  *   **Verdict 4 (3D Print):** 0% original matter. **(Different)**

  This rule fits her data points just as tightly as the Causal one.

  ### 3. Predictions for a, b, and c

  Here is where we apply both rules to your new scenarios.

  **a) Every plank replaced suddenly in drydock with synthetic ones + sensors.**
  *   **Her Rule (Causal):** She will likely say **SAME.** To her, drydock is just "hospitalization." The ship's registry, function, and causal timeline continue. The sensors are just a digital log of its history, reinforcing the narrative continuity. It's a refit, not a new build.
  *   **Alternative Rule (Material):** This rule says **DIFFERENT.** You have 0% original matter. The "Critical Mass" was breached instantly. The sensors don't count as matter.
  *   **Verdict:** **SPLIT.**

  **b) Ground into mulch, trees grow, carved into same shape.**
  *   **Her Rule (Causal):** **DIFFERENT.** The causal chain of the *artifact* was destroyed when it was ground up. The trees are a biological continuation, but the "ship" event ended. The carving is a new event.
  *   **Alternative Rule (Material):** **DIFFERENT.** While the atoms are technically the same, they were dispersed and reconstituted through biology. The "Critical Mass" of the *structure* was lost.
  *   **Verdict:** **NO SPLIT.** (Both say No).

  **c) Quantum-entangled duplicate.**
  *   **Her Rule (Causal):** **DIFFERENT.** Entanglement is a physical link, but not a *historical* one. The duplicate has no past; it just popped into existence.
  *   **Alternative Rule (Material):** **DIFFERENT.** The atoms are new (or newly arranged). No original matter retained.
  *   **Verdict:** **NO SPLIT.** (Both say No).

  ### 4. The Splitter and the "Form vs. Matter" Comment

  **Scenario (a) is your best splitter.**
  If you propose scenario (a) to her, her answer tells you which rule she's actually running.
  *   If she says **"It's still the ship"** (because it never stopped being the ship in the logs/registry), she is running **Causal Continuity**.
  *   If she says **"It's a new ship"** (because there's no original wood left), she is running **Material Threshold**.

  Given her Verdict 3 (sinking/rebuild), I suspect she will say **(a) is the Same Ship.** Verdict 3 shows she values the *narrative of the specific vessel* over the wood itself (since 10% of the wood was lost/changed in the sink). The sensors in (a) act as the "narrative glue."

  **Regarding "Form vs. Matter":**
  She wasn't winging it, but she was using the wrong labels.
  *   **Matter** = The planks.
  *   **Form** = The shape/design.
  *   **What she actually means** = **History.**

  In philosophy, this is close to *Spatio-Temporal Continuity*. She rejects "Form" (Verdict 4 is a perfect form match, but she says Different) and she rejects "Matter" (Verdict 1 is a matter mismatch, but she says Same). She is arguing that **Identity is a Verb, not a Noun.** The ship is the *act of sailing*, not the wood or the blueprint.

  **Summary for your next drink:**
  Tell her scenario (a). If she says it's the same ship, tell her she's a "Causal Continuity" theorist, not a Form/Matter one. If she says it's a new ship, tell her she's secretly a "Material Essentialist" who made an exception for the sinking because of sentimentality.
