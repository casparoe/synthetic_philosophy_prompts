  I'm a retired astrophysicist — most of my working life was spent worrying about selection effects in galaxy surveys, which is probably why this one is bugging me — and since I stopped I've been going to a philosophy reading group down at the local uni. The postdoc who runs it has been handing down verdicts on a long list of chance cases, and I've been trying to work out what he'd say about one I made up myself. His rulings so far: (i) you're told the chance this atom decays within the next hour is 0.5 and that's all you know — 0.5. (ii) same, except you also learn that 90 of the last 100 runs of this apparatus decayed inside the hour — still 0.5, the chance screens off the outcome statistics. (iii) same, except a notebook that has never once been wrong, written after the fact, says it decayed — basically 1. (iv) a source that's right 60% of the time says it decayed — about 0.6. (v) the chance now is 0.5, but you learn for certain that a switch will be thrown before the window opens, which will make the chance 0.9 from then on — 0.9, not 0.5. (vi) the preparation gives the atom a true chance of 0.9 with chance 0.7 and a chance of 0.1 with chance 0.3 — 0.66, the average, definately not the most likely single-case chance.

  My case: the display in the lab says the chance this atom decays in the hour is 0.5, and that's exactly right as a lab-wide figure — half of all runs in that lab do decay in the hour. Then I learn two more things. First, there are no setups with a true single-case chance of 0.5: a setup is either hot (true chance 0.9) or cold (true chance 0.1), the prep produces each kind half the time, so the 0.5 is only the population average. Second, the only reason I'm watching this particular run is that the software puts a run on the watch-list only if the atom is still intact after a ten-second preliminary check: hot atoms pass that check with chance 0.1, cold ones with chance 0.9, and once you condition on which kind of setup it is, passing the check tells you nothing more about whether it decays in the hour. My own arithmetic says that makes it 0.18 — the expectation of the true single-case chance given that I'm watching it at all, which comes out the same as just doing the Bayesian update on the check.

  So: does he go with the 0.5 he was handed, or with the 0.18? Really what I want from you is the rule behind whatever number you predict, because his six verdicts seem to me to fit more than one. Is he deferring to the chance figure for the broad class he was given, or to the single-case chance for the narrowest class he now knows he's in, or to his expectation of the true chance — and is there a fourth rule that fits all six just as well? Which of the earlier rulings pull which way, and is it a problem that the lab-wide frequency among watch-listed runs is itself 0.18, so that a narrowest-reference-class version of the first rule and the single-case rule seem to collapse into each other? Last thing: tell me what variant of my case would actually force him to show his hand — one where the preliminary check is perfectly diagnostic of kind, one where it's only mildly diagnostic, or one where what selects the run into the watch-list is downstream of the decay rather than a common cause of it — and say what principle he'd be committing himself to with each answer, since I suspect the six verdicts genuinely underdetermine this one.
