  1. **What you think I'm saying**
  You're arguing the statue debate is stuck because everyone asks the wrong questions. Instead of whether the founder currently deserves honor (verdict) or causes harm (consequences), you propose asking whether the community actually authorized the honor (standing). You treat monuments as speech acts by the community, not historical claims. If the original installation excluded parts of the community, the act was infelicitous—it never successfully spoke for "us." Removing or relocating the statue isn't about erasing history, but correcting who speaks for the town. You also suggest street names differ because they force residents to speak the name daily, requiring a different remedy than statues.

  2. **Where it breaks**
  Your framework is elegant, but it relies on definitions that won't survive contact with an angry room.

