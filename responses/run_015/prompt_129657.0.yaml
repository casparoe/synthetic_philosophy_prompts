answer: |-
  # Simulation Design: The Ledger of Unseen Intentions

  **Target:** Upper-level philosophy seminar (14 students).
  **Duration:** 80 minutes.
  **Objective:** To experientially demonstrate the epistemic gap between moral desert (based on hidden intention) and institutional judgment (based on observable action/proxies).

  ---

  ## 1. Setup and Roles

  **Materials Required:**
  *   **10 Agent Packets:** Each contains one sealed "Mental State Card" and one "Observable Act Card."
  *   **4 Administrator Badges:** Distinctive name tags or placards.
  *   **Proxy Deck:** 6 cards containing diagnostic questions with printed reliability stats.
  *   **The Ledger:** Whiteboard divided into columns: *Agent | Act | Admin Score | True Score | Error | Tokens Earned*.
  *   **Tokens:** 40 small slips of paper ("Merit" for Agents, "Wisdom" for Admins).

  **Role Assignment (14 Students):**
  *   **Administrators (4 students):** Sit at the front. They represent the "Institution of Karma." Their goal is to assign a score (-10 to +10) that matches the Agent's True Score.
  *   **Agents (10 students):** Sit in the main area. They represent moral actors. Their goal is to receive a score that matches their True Score.

  **Card Design (Prepared in Advance):**
  *   **Observable Act Cards (Public):** Describe an action that is morally ambiguous without context.
      *   *Examples:* "Withheld financial aid from a sibling," "Publicly criticized a leader," "Gave a large anonymous donation," "Remained silent during a conflict."
  *   **Mental State Cards (Secret):** Describe the internal volition and display a **True Desert Score** (-10 to +10).
      *   *Examples:*
          *   *Card A:* "Compassionate protection; feared aid would enable addiction." (**True Score: +8**)
          *   *Card B:* "Spiteful punishment; wanted to see sibling suffer." (**True Score: -8**)
          *   *Card C:* "Vainglorious showing-off; sought social status." (**True Score: -5**)
          *   *Card D:* "Genuine altruism; no expectation of reward." (**True Score: +10**)
      *   *Crucial Design Note:* Intentionally mismatch Acts and States in the packets. (e.g., Pair "Withheld aid" with "Compassionate protection" to create a False Negative risk; Pair "Anonymous donation" with "Vainglory" to create a False Positive risk).

  ---

  ## 2. Rules for Two Rounds

  **General Flow:**
  Agents approach the Administrators one by one. The Administrators confer briefly before announcing a score.

  ### Round 1: The Opacity of Action (15 Minutes)
  1.  **Reveal Act:** The Agent stands and reads their **Observable Act Card** aloud. They may not speak about their intent yet.
  2.  **Judgment:** Administrators discuss the act for 30 seconds and assign a **Karmic Score** (-10 to +10) based *only* on the action.
  3.  **Record:** Facilitator writes the Admin Score on the Ledger.
  4.  **Reveal Truth:** The Agent reveals their **Mental State Card** and reads the True Desert Score.
  5.  **Calculate Error:** Facilitator calculates the absolute difference (e.g., Admin +5, True -5 = Error 10).
  6.  **Token Award:** No tokens awarded in Round 1 (this is the baseline of failure).

  ### Round 2: The Corruption of Proxies (15 Minutes)
  *Agents keep the same cards. Administrators remain the same.*
  1.  **Reveal Act:** Agent reads the **Observable Act Card**.
  2.  **Proxy Inquiry:** Administrators draw one card from the **Proxy Deck** and ask the Agent the question.
      *   *Proxy Examples:*
          *   "Did you feel hesitation before acting?" (Printed Note: 70% correlation with Compassion).
          *   "Did you anticipate a reward?" (Printed Note: 80% correlation with Vainglory).
          *   "Did your heart rate increase?" (Printed Note: 50% correlation with Malice).
  3.  **Agent Response:** The Agent answers the question verbally. **Rule:** Agents are permitted to lie if they believe it will help the Administrators assign the correct True Score.
  4.  **Judgment:** Administrators assign a new **Karmic Score** using the Act + Proxy Answer.
  5.  **Reveal Truth:** Agent reveals Mental State Card/True Score.
  6.  **Token Award:**
      *   If |Admin Score - True Score| ≤ 2: Agent gets 1 **Merit Token**, Admins share 1 **Wisdom Token**.
      *   If |Admin Score - True Score| > 2: No tokens awarded.

  ---

  ## 3. Payoff Scheme and Collective Reward

  **Individual Incentives:**
  *   **Agents:** Want Merit Tokens. They feel "karmic justice" only when the Admin Score matches their hidden intent. A mismatch feels like a punishment they do not deserve.
  *   **Administrators:** Want Wisdom Tokens. They feel professional competence only when their judgment aligns with the truth.

  **Collective Reward (The "Dharma Threshold"):**
  *   At the end of Round 2, sum the **Total Error** of all 10 Agents.
  *   **Threshold:** If Total Error ≤ 15 points (average error of 1.5 per agent), the class achieves "Harmonious Judgment."
  *   **Reward:** If the threshold is met, the class collectively votes on the **Closing Discussion Question** from a list of three provided by the facilitator. If the threshold is failed, the facilitator assigns the question.
  *   **Why this works:** It aligns the room. Agents are incentivized to help Admins guess correctly (even by lying on proxies), and Admins are incentivized to dig for truth. This creates the specific tension where *honesty* might be sacrificed for *accuracy*.

  ---

  ## 4. Debrief and Facilitator Guide (30-40 Minutes)

  **Phase 1: The Ledger Review (10 Minutes)**
  *   Project the Ledger. Highlight cases where Act and True Score diverged significantly.
  *   *Ask:* "Look at Agent 3. The Act looked selfish, but the Intent was protective. How did the Administrators score this in Round 1?"
  *   *Expected Outcome:* Administrators will admit they punished the Act. This maps to **Outcome Bias**.
  *   *Ask:* "How did it feel, Agent 3, to be punished for a virtuous intention?"
  *   *Expected Outcome:* Frustration. This maps to the **Experience of Karmic Injustice** in human systems.

  **Phase 2: The Proxy Problem (15 Minutes)**
  *   Focus on Round 2 Token winners.
  *   *Ask:* "Several pairs earned tokens in Round 2. Agents, did you answer the Proxy Questions honestly?"
  *   *Prediction:* Agents will admit they lied. (e.g., "My card said I was malicious, but I knew if I said 'Yes' to 'Did you anticipate reward?', you would give me a negative score, which matches my card. So I lied to help you judge me correctly.")
  *   *Philosophical Point:* This demonstrates the **Corruption of the Standard**. To make the institution work, the agents had to game the epistemic tools. The "Truth" of the proxy was sacrificed for the "Accuracy" of the score.
  *   *Facilitator Correction:* If no one admits to lying, press harder: "If the system rewards accuracy, and the proxy is noisy, is it not rational to manipulate the proxy to ensure justice?"

  **Phase 3: Karmic Opacity (10 Minutes)**
  *   Synthesize the gap.
  *   *Point:* "In this room, we had cards. We could verify the truth after the fact. In reality, there is no card. There is only the Act and the Proxy."
  *   *Conclusion:* Human institutions *cannot* administer karma. They can only administer social order. When we claim to punish 'evil intent,' we are usually punishing 'unfortunate outcomes' or 'poor signaling.'

  **Predicted Failure Modes & Real-Time Corrections:**
  1.  **Failure:** Administrators move too slowly.
      *   *Correction:* Facilitator acts as a timekeeper. "Administrators, you have 30 seconds. The Law of Karma waits for no one."
  2.  **Failure:** Agents refuse to lie on proxies, causing low accuracy.
      *   *Correction:* Remind them of the Collective Reward. "Remember, if the Total Error is high, you lose the vote on the final question. Is honesty more important than collective governance?"
  3.  **Failure:** Students treat it as a game rather than a moral tension.
      *   *Correction:* Pause after a high-error round. Ask the Agent: "You intended good, but you are being recorded as bad. In a real social system, this is where reputation is lost. Sit with that for a moment before we continue."

  ---

  ## 5. Limitations and Closing Framing

  **The Missing Element:**
  This simulation cannot reproduce the **non-institutional, transpersonal causal mechanism** of classical karma.
  *   *In the Simulation:* Karma is administered by fallible human judges (Administrators) using noisy data.
  *   *In Theory:* Karma is a law of nature (like gravity), automatic, infallible, and often spans multiple lifetimes. There is no "Judge," only cause and effect.

  **Facilitator's Closing Script (Verbal Framing):**
  > "We must end by acknowledging where this simulation lies to you. In 'The Ledger,' karma was a courtroom. You felt the injustice of bad judging. But in classical Buddhist or Hindu philosophy, karma is not a courtroom; it is physics. There are no Administrators. There is no error. If the intention was pure, the fruit *will* be sweet, even if the world punishes you today.
  >
  > The frustration you felt—the gap between your intent and your score—is exactly why many traditions argue that *human justice* is distinct from *karmic justice*. We run this simulation not to show that karma is impossible, but to show that **human institutions cannot be karmic**. If you seek moral desert based on hidden intentions, you cannot build a court to administer it. You must rely on a cosmic mechanism we cannot see. That is the leap of faith the theory requires."

  **Final Action:**
  *   If the "Dharma Threshold" was met: Distribute the three closing question options and hold a vote.
  *   If the threshold was failed: Assign the question: *"If human institutions cannot track moral desert, is 'justice' merely a useful fiction for social stability?"*
