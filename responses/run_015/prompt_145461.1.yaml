      *   *Epistemics:* If it's undecidable, why adopt the lexical rule? Because of precautionary principle? That slides into risk-aversion, not NU. I need to clarify that "undecidable" might collapse into "pragmatically adopt lexicality," which is a shift from metaphysics to policy.

  9.  **Final Polish:** Ensure tone is rigorous, philosophical, and directly answers the prompt's constraints (ranking, separating concessions, honesty about risklessness).

      *(Self-Correction on Ranking)*: I need to be careful about what counts as "Fatal." A fatal defeater makes the view incoherent or logically untenable. An awkward one makes it unpalatable.
      *   *Fatal:* If Aggregation forces commensurability, the lexical claim is logically void.
