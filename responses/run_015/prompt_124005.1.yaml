prompt: |-
  I'm a software engineer without formal philosophy training, and I've been working through Al-Ghazālī's occasionalism—particularly his argument that fire does not burn cotton by its own power, but rather that God creates the burning on the occasion of the fire's presence. Rather than a standard summary, I want an adversarial-collaboration document drafted as if two opposing interpretive camps had argued in good faith for a year and now need to produce a shared statement they could both sign.

  Name the camps precisely:
  - Camp A (the hard occasionalist camp): Al-Ghazālī denies all intrinsic causal efficacy to created things; apparent natural causation is nothing more than a divinely maintained habit (ʿāda) of constant conjunction, structurally comparable to a deterministic pipeline in which every output is directly authored by a central scheduler with no autonomous processing at intermediate nodes.
  - Camp B (the delegated-efficacy camp): Al-Ghazālī targets only the philosophers' claim that causal powers are necessary and self-grounding; on this reading, creatures possess real but radically dependent causal powers—analogous to microservices that execute logic but only because an underlying orchestrator continuously authorizes and sustains their operation.

  The document must contain:
  1. A numbered section of agreed claims about what Al-Ghazālī actually argues—what he asserts in the fire/cotton example, about the distinction between necessary and habitual connection, about the role of divine custom, and about whether his view permits predictive science and technological intervention.
  2. A disagreements table. For each camp, state its position in wording that camp itself would accept. Cover at least: (a) whether Al-Ghazālī's critique applies to all causal talk or only to a specific Aristotelian/Avicennian version of it; (b) whether occasionalism eliminates secondary causation entirely or merely subordinates it to divine action.
  3. The cruxes—those sub-questions such that settling them would move at least one camp. I specifically want two addressed:
     - Crux 1: Whether Al-Ghazālī's denial of necessary connection amounts to a denial of causal power as such, or only of causal autonomy.
     - Crux 2: Whether occasionalism can support empirical prediction and engineering practice without smuggling in real creaturely causal powers—parallel to asking whether a fully orchestrated distributed system can be debugged and relied upon without attributing independent agency to its nodes.
  4. For each crux, identify a concrete case, analog, or argument that both camps agree is relevant. Then record, in advance, what each camp predicts that case or argument will show.
  5. A final section assessing whether part of the dispute is verbal—specifically, whether disagreements about "cause," "power," or "habit" reflect genuinely different metaphysical commitments or only different semantic uses, comparable to how "dependency" in software can mean either a static import or a runtime call.

  Constraints:
  - Write in formal, polished American English.
  - Do not include bibliographies, reading lists, or requests for citations.
  - Do not put any real text in quotation marks unless the exact passage can be fetched and copied; otherwise paraphrase without quotation marks.
  - Do not hinge the prompt on exact editions, page numbers, or highly niche interpretive theories that a model without web access could not reliably reconstruct.
  - You may reference Al-Ghazālī's well-known work Tahāfut al-falāsifa by name, but do not depend on specific pagination.
  - Format the deliverable as the numbered agreed-claims section followed by the disagreements table, then the cruxes with predictions, then the verbal-dispute assessment.
