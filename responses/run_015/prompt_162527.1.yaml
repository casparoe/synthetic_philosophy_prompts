      *   **Current Interest:** Philosophy of history, specifically archival silences and subaltern studies.
      *   **Core Analogy:** Archival silence $\approx$ Non-detection in ecology.
      *   **Core Question:** Why do historians (especially of subaltern groups) treat silences as the *object of study* rather than a *nuisance parameter* to be corrected/estimated away? Why is the "correction" ambition seen as a category mistake rather than just a hard estimation problem?
