  # Handout: The "Human Nature" Sorting Tree
  **Course:** Intro to Chinese Philosophy  
  **Topic:** Beyond "Good vs. Bad"  
  **Instructions:** Answer the four questions below. Follow your arrows to find your philosophical position. Don't worry about knowing the names yet; focus on the concrete cases.

  ---

  ### **START: The Toddler Case**
  **Q1. Imagine a toddler sees another child fall and cry. The toddler looks worried and moves to help. Why?**
  *   **(A) Internal Pull:** They feel a genuine pang of distress themselves. The drive to help comes from *inside* their chest, like hunger or sight.  
      → *Go to Question 2 (The Growth Path)*
  *   **(B) External/Neutral:** They are reacting to noise/movement, or they have no feeling at all yet. The drive to be "good" must come from *outside* (parents, rules, praise).  
      → *Go to Question 3 (The Construction Path)*

  ---

  ### **PATH A: The Growth Path (Internal Pull)**

  **Q2. The Sage Case: Imagine a person who is perfectly "Good." Do they still have to try hard to stay that way?**
  *   **(A) Self-Sustaining:** No. Being good feels natural and easy, like a grown tree standing in the sun. If they have to try hard, something is wrong.  
      → *Go to Question 4A*
  *   **(B) Needs Upkeep:** Yes. Even good people need constant practice, teachers, and vigilance, like a garden that grows weeds if you look away.  
      → *Go to Question 4B*

  **Q4A. The Twin Case: If everyone has this internal pull, why are some people bad?**
  *   **(A) Environment Blocks It:** Everyone is the same deep down. Bad people are like trees crushed by rocks—their growth was blocked from the *outside*.  
      → **LEAF 1: The Textbook Mencian**  
      *(Nature is good sprouts; society crushes them. Remedy: Protect the sprouts.)*
  *   **(B) Material Clouds It:** Everyone starts the same, but some people are born with "cloudier" physical stuff (temperament/energy) that blocks the light.  
      → **LEAF 2: The Later Confucian (Neo-Confucian)**  
      *(Original Nature is good, but Physical Nature varies. Remedy: Polish the Qi.)*

  **Q4B. The Soil Case: Why does the garden need weeding?**
  *   **(A) Mixed Seeds:** We are all born with some good seeds and some bad seeds. You have to cultivate one and starve the other.  
      → **LEAF 3: The Han-Era Mixture View**  
      *(Nature is a mix of good/bad elements. Remedy: Selective cultivation.)*
  *   **(B) External Scarcity:** The seeds are fine, but we live in a world of limited resources that makes us fight. The "weeds" are actually survival instincts.  
      → **LEAF 4: The Calibration Mismatch (Unoccupied)**  
      *(Nothing is morally bad; our instincts are tuned for scarcity, not abundance. Remedy: Fix institutions, not souls. **Status:** Untried in classical texts; arguably incoherent for Confucians who think ritual is intrinsic.)*

  ---

  ### **PATH B: The Construction Path (External/Neutral)**

  **Q3. The Clay Case: You are shaping human behavior like a potter shapes clay. How does the clay behave?**
  *   **(A) Resistant/Hostile:** The clay actively fights you. It wants to slump back into a puddle. You have to force it into shape and hold it there.  
      → *Go to Question 5A*
  *   **(B) Passive/Neutral:** The clay doesn't care. It has no direction of its own. It goes wherever you push it (like water flowing east or west).  
      → *Go to Question 5B*

  **Q5A. The Scaffold Case: Once the pot is fired (the person is educated), does it hold its shape?**
  *   **(A) Needs Permanent Scaffolding:** No. If you remove the laws, teachers, and rituals, the person slumps back into selfishness immediately.  
      → **LEAF 5: The Textbook Xunzian**  
      *(Nature is disorderly desire. Goodness is artificial construction. Remedy: Strict ritual/teacher.)*
  *   **(B) Systemic Fix:** The problem isn't that people slump, but that the "pottery wheel" (society) is broken. If we fix the material conditions, the shaping happens automatically.  
      → **LEAF 6: Niche-Construction / Developmental (Unoccupied)**  
      *(The nature/culture split is false; we build environments that build us. **Status:** Untried in classical texts; attractive but dissolves the moral agency Confucians care about.)*

  **Q5B. The Channel Case: If the clay/water is neutral, why do people end up bad?**
  *   **(A) Bad Channels:** The environment (rivers/dikes) is poorly designed. If you channel them right, they become good; channel them wrong, they become bad.  
      → **LEAF 7: Gaozi-Style (Water Metaphor)**  
      *(Nature is indifferent. Good/Bad is entirely external direction. Remedy: Better guidance.)*
  *   **(B) Cutting/Shaping:** The material is neutral but formless. It *must* be cut and bent (like a willow into a basket) to be useful. It doesn't fight, but it doesn't grow into a basket on its own.  
      → **LEAF 8: Gaozi-Style (Willow Metaphor)**  
      *(Nature is raw material. Goodness is imposed form. Remedy: Education as shaping.)*

  ---

  ### **Instructor's Notes & Discussion Flags**

  **1. The "Upkeep" Split (Q2 & Q5A)**
  *   **Why this matters:** This is the branch I invented for us. Standard textbooks focus on "Good vs. Bad," but Mencius and Xunzi might actually agree that *most* people need training. They disagree on whether a *Sage* still needs to try.
  *   **Discussion Flag:** Mencius says the Sage acts "without thinking" (spontaneous). Xunzi says the Sage acts "without error" (calculated). Does this mean Xunzi's Sage is *tired*?

  **2. The Unoccupied Leaves (4 & 6)**
  *   **Leaf 4 (Calibration Mismatch):** This view says human desires aren't *evil*, just mismatched to modern life (e.g., craving sugar/fat was good in the Stone Age, bad now).
      *   *Why empty?* Classical thinkers generally thought desires *were* the moral problem, not just a design error. They wanted to transform desire, not just manage it.
  *   **Leaf 6 (Niche Construction):** This view says we can't separate "human nature" from "the world we built."
      *   *Why empty?* Confucians need a stable "Nature" to ground their ethics. If nature changes with society, there's no anchor for the Dao.

  **3. The Gaozi Split (Leaves 7 & 8)**
  *   **Uncertainty Flag:** I am not 100% sure Gaozi held *both* views consistently. The "Water" metaphor suggests total neutrality (Flow). The "Willow" metaphor suggests material resistance (Bending).
      *   *Specialist Critique:* A specialist might tell me I'm splitting hairs here. Gaozi's core point is just "Nature is not Moral." The difference between water and willow might be rhetorical, not philosophical. Use this to ask students: *Does the metaphor change the ethics?*

  **4. Confidence Level**
  *   **Overall Confidence:** 85%. The Mencius/Xunzi/Gaozi splits are standard. The Neo-Confucian and Han splits are historically accurate but simplified.
  *   **Most Vulnerable Branch:** **Q1 (Internal vs. External).**
      *   *Why:* A specialist might argue Xunzi *also* thinks we have internal equipment (intelligence, capacity to learn), so he isn't purely "External." He thinks the *moral direction* is external. If a student says, "Xunzi believes we have the internal capacity to learn rituals," they are right, and this tree forces them into Path B.
      *   *Fix:* If a student objects here, tell them: "You're right. For this tree, 'Internal' means 'Internal Moral Compass,' not 'Internal Brain.'"

  **5. The "Standard" Hunch (Instructor Note)**
  *   You suspected they disagree hardest on "Where the standard comes from."
  *   **Verdict:** The tree confirms this. Q1 is the deepest split. Once you decide whether the blueprint is inside (Path A) or outside (Path B), almost everything else follows. The "Reliably Decent" question (Q2) splits them, but less violently than Q1.

  ---
  *Handout End.*
