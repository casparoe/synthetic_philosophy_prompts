answer: |-
  This is a sophisticated seminar concept. "Posthumous Narrative Capture" (PNC) effectively bridges the gap between *narrative ethics* (how stories shape moral understanding) and *posthumous rights* (what we owe the dead). It moves beyond the boring "fact-checking" debate into the structural violence of storytelling.

  Here is a breakdown of how to frame your argument using *Selma*, including the specific constraints you asked for.

  ### 1. Applying PNC to *Selma*: Who is Harmed?

  If we accept PNC, the harm in *Selma* is not merely that LBJ's diary entries contradict the script (factual error); it is that the *relationship* between two complex political operators is flattened into a Mythic Hero's Journey.

  *   **MLK (The Primary Subject of Capture):** MLK is harmed most significantly here. PNC argues that forcing a life into a teleological arc serves the *filmmaker's* meaning-making. Director Ava DuVernay needed a clear moral victory. To achieve this, MLK's messy political maneuvering (compromises, strategic alliances, internal SCLC conflicts) is scrubbed to make him a pure moral vessel. The harm is **reductionism**: MLK is denied his political agency and turned into a saintly plot device. His life is "captured" to serve a narrative of moral triumph rather than political grind.
  *   **LBJ (The Collateral Damage):** LBJ is harmed, but differently. He is not the protagonist being "captured" for a biopic arc; he is cast as the **Threshold Guardian**. In narrative structure, the Hero needs an obstacle. By casting LBJ as the obstacle, the film imposes a teleology on *his* legacy where his pragmatism is re-coded as obstructionism. This is a harm of **caricature**.
  *   **The Audience (Epistemic Harm):** The audience suffers a loss of historical literacy regarding *how change happens*. They learn that change occurs when a Moral Hero defeats a Reluctant Power, rather than through messy coalition building. This is a harm to **civic understanding**.

  **Verdict:** Under PNC, **MLK is the primary victim** because the film is ostensibly *his* narrative vehicle (even if titled *Selma*). His life is the one being captured to fit the arc. LBJ is a secondary victim of the structural need for conflict.

  ### 2. Does *Selma* Help, Hurt, or Limit the Theory?

  *Selma* **stresses the limits** of PNC rather than breaking it.

  *   **Why it helps:** It perfectly illustrates the "teleological arc" problem. The film *required* conflict to function as a drama. A movie where LBJ and MLK agree in the first 20 minutes and sign the bill in the next 20 has no third act. PNC explains *why* the distortion happened: not out of malice, but out of narrative necessity.
  *   **Where it limits the theory:** PNC is defined as turning "a dead real person's life into a movie plot." *Selma* is not a biopic; it is a **historical event drama**.
      *   *The Tension:* Does PNC apply to people who are *characters* in an event, or only *subjects* of a biography? If PNC only applies to biopics (e.g., *Lincoln*, *Gandhi*), then *Selma* falls outside its scope. If you want your theory to hold, you must argue that **any** dramatic representation of a dead person constitutes "capture," regardless of whether it is their biopic. *Selma* forces you to expand the definition from "Biographical Capture" to "Historical Capture."

  ### 3. Where the Theory is Silent (Do not force it)

  You asked to identify where PNC doesn't speak. Honesty here will boost your grade.

  *   **The Consent of the Living Heirs:** PNC focuses on the dead subject. It is silent on the rights of the estate. The Coretta Scott King estate endorsed *Selma*. Does living consent negate posthumous harm? PNC has no mechanism to weigh the wishes of the heirs against the integrity of the dead's narrative.
  *   **Social Utility vs. Narrative Integrity:** PNC seems deontological (it is wrong to distort the arc). It is silent on **consequentialism**. If the "lie" of LBJ's obstruction inspires a new generation to vote (a tangible good), does that outweigh the "harm" of narrative capture? The theory treats the distortion as an intrinsic evil, ignoring potential extrinsic goods.
  *   **Collective vs. Individual Harm:** *Selma* is about a movement. PNC is framed around "a dead real person's life" (singular). It struggles to address harm done to a **collective memory** (the Civil Rights Movement) where the "subject" is not one person but a coalition.

  ### 4. The Falsification Test: What would make you drop PNC?

  To show philosophical rigor, you need to know when your theory fails. Here is the argument that would kill PNC:

  **The "Inaccessibility of the Real" Argument.**
  PNC relies on the premise that there is a "messy actual life" that exists prior to the narrative. It assumes we can access the "truth" of a life to measure the distortion against.
  *   *The Counter:* If you accept a strong **narrativist view of history** (e.g., Hayden White), you must admit that *no* access to a life exists outside of narrative. We only know LBJ and MLK through archives, speeches, and memoirs—all of which are already curated narratives.
  *   *The Kill Shot:* If there is no "pre-narrative life," there can be no "capture." You cannot distort a life into a story if the life is *already* only accessible as a story. If you cannot refute the idea that "all history is fiction," PNC collapses because it loses its baseline for truth.

  ### 5. The Weakest Part of My Reasoning (Self-Critique)

  Here is the vulnerability in the analysis above:

  I have conflated **factual falsehood** with **narrative capture**.
  In *Selma*, historians didn't just argue that the *arc* was wrong; they argued specific meetings and quotes were fabricated. My application of PNC tries to argue that the harm exists *even if the facts were right*. But in reality, the film used factual lies to achieve the narrative arc.
  *   *The Weakness:* It is difficult to isolate "narrative harm" from "factual harm" in this specific case. To make PNC work, I have to imagine a version of *Selma* where every quote is real, but the *editing* implies conflict where there was cooperation. Since the actual film relied on fabrication, using it as a pure example of PNC is slightly muddy. A stronger test case would be a film like *The Social Network* (where the subject is alive, so PNC doesn't apply) or *Oppenheimer* (where facts are debated but the arc is the main driver). Using *Selma* risks the professor saying, "This is just a accuracy debate, not a philosophy of art debate."

  ### Summary for your Paper's Thesis

  Your argument should look like this:
  *"While the controversy over Selma is typically framed as a debate over historical accuracy, the concept of Posthumous Narrative Capture reveals a deeper ethical violation: the structural necessity of cinema forced MLK's political complexity into a mythic teleology. However, applying PNC to Selma exposes the theory's limitation regarding event-based dramas and its silence on the trade-off between narrative integrity and social utility."*

  This shows you understand the tool, you can wield it, but you also know where it breaks.
