  ### Commitment and Consequences

  I recommend putting the package **{D1, D2, D3, D4, R8}** into the contract. This specification prioritises system integrity and auditability over individual outcome recourse and formal uniformity.

  **Sacrifices:**
  I am sacrificing **D5 (Individual Contestability)** regarding outcomes. An applicant rejected from the list cannot prove they were unfairly denied housing because we do not collect the data to prove it. We will only allow appeals on procedural grounds (e.g., data entry errors), not on the merits of their need score relative to the cutoff. I am also sacrificing **R6 (Blindness)** and **R7 (Uniform Cutoff)**. We must collect group data to audit for bias, and we must be willing to adjust cutoffs per group if calibration drifts, to ensure the score means the same thing (R8) for everyone.

  **Consequences:**
  Group T (low base rate) may perceive unfairness if their selection rate remains lower than Group S (high base rate), even if the score meaning is identical. They lose the comfort of a uniform cutoff rule. Group S gains higher access relative to population size, reflecting their higher urgency rate. The authority loses the ability to promise any individual applicant that a specific score guarantees a specific outcome, as the cutoff moves with the budget (D1).

  **Least Certain Claim:**
  I am least certain that **D3 (Stability under adaptation)** can be enforced via the proposed audit. My enforcement test relies on monitoring score distributions. However, if applicants collaborate to game the system in a way that preserves the mean and variance of the scores while swapping positions (e.g., trading answers), the distribution monitoring will not detect it. I would change my mind if a pilot study showed that applicants could successfully manipulate their scores to cross the cutoff without changing their underlying need profile, while keeping the aggregate statistics stable. In that case, D3 would need to be replaced with a requirement for periodic model retraining on fresh, ungamable data sources.
