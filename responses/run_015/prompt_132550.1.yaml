answer: |-
  ### Table of Requirements

  | ID | Requirement | Failure case that motivates it | Status | Which other requirements it conflicts with | What it rules out |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **D1** | All-cutoff validity | A metric passes at the current budget cutoff but fails when the budget shrinks and the cutoff rises, causing sudden disparate impact. | Non-negotiable | R7, R9 (Equal Error Rates) | Metrics dependent on a single operating point (e.g., specific false positive rate). |
  | **D2** | Auditability under selective labels | The vendor claims fairness based on outcomes for rejected applicants, but no such outcome data exists in our records. | Non-negotiable | D5, R9 | Any criterion requiring ground truth for wait-listed applicants (e.g., false negative rate). |
  | **D3** | Stability under adaptation | Applicants learn the cutoff and inflate scores without changing underlying need, shifting the score distribution until the metric breaks. | Non-negotiable | None (foundational) | Metrics that incentivize gaming (e.g., rewarding raw score thresholds without distribution checks). |
  | **D4** | No reward for worse predictions | A constant score of 0.5 for everyone satisfies the fairness metric by eliminating group differences, but allocates housing randomly. | Non-negotiable | None (foundational) | Trivial solutions (randomisation, reject all) and metrics that penalise accuracy improvements. |
  | **D5** | Contestability | An applicant rejected at 0.49 (cutoff 0.50) claims they were urgently needy, but we cannot verify their need status. | Genuine but negotiable | D2 | Individual outcome-based appeals; limits appeals to procedural errors only. |
  | **R6** | Blindness (No group data) | The model uses postcode as a proxy for group membership to bypass the ban, hiding bias we cannot audit without group labels. | Camp prejudice | D2, R8 | Explicit bias correction; disparate impact auditing using protected characteristics. |
  | **R7** | Uniform cutoff | Group S (1/3 need) and Group T (1/10 need) are calibrated correctly; a uniform cutoff selects far more S than T relative to population size. | Camp prejudice | D1, R8 | Group-specific thresholds that could equalise opportunity rates given base rate differences. |
  | **R8** | Cross-group calibration | A score of 0.8 means 80% chance of need in Group R, but only 50% in Group T, leading to misallocation when cutoffs move. | Genuine but negotiable | R7, R6 | Group-specific scoring models that yield different probabilities for the same feature set. |

  ### Unsatisfiable Sets of Requirements

  **Set 1: {D2, D5}**
  *Argument:* You cannot adjudicate an individual claim about a false negative (D5) if the system design explicitly prevents you from observing the ground truth for rejected applicants (D2). Without outcome labels for the wait-listed, any individual complaint regarding need is unverifiable speculation.
  *Example:* 100 applicants; 50 fast-tracked (outcomes known), 50 wait-listed (outcomes unknown). Applicant #51 (wait-listed) claims urgent need. The database records only "Wait-listed" for #51. The panel has no arithmetic means to confirm or deny the claim.
  *Status:* This is the deepest conflict because it strikes at the limit of what is knowable. No mathematical adjustment can recover data that was never collected.

  **Set 2: {D1, R7, R8}**
  *Argument:* If scores are calibrated across groups (R8) but base rates of need differ (S=1/3, T=1/10), the average score for S will exceed T. A uniform cutoff (R7) will therefore select a higher proportion of S than T. Because the score distributions differ, changing the cutoff (D1) will change the selection ratio between groups, making stable relative representation impossible.
  *Example:* Group S needy scores: {0.6, 0.9}. Group T needy scores: {0.5, 0.7}. Both calibrated. Cutoff 0.8 selects 1 S, 0 T. Cutoff 0.55 selects 2 S, 1 T. The ratio of selected S:T shifts from undefined to 2:1 as the budget changes.
  *Status:* This is a structural conflict arising from base rate differences. It forces a choice between uniform treatment (R7) and stable relative outcomes (D1).

  **Deepest Conflict:** {D2, D5}.
  *Reasoning:* The conflict between {D1, R7, R8} is mathematical but manageable via policy choices (e.g., accepting disparate selection rates). The conflict between {D2, D5} is epistemological. We cannot enforce individual justice on outcomes we cannot observe. Sacrificing D5 is not a policy preference but an acknowledgement of data reality.

  ### JSON Specification

  ```json
  {
    "unsatisfiable_sets": [
