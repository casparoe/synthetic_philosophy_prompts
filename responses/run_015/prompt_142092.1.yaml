answer: |-
  ### Brainstorming: Framing the Question

  1.  **The Phenomenology of Loss:** Focus on the subjective experience of a hinge slipping away. *Drop:* Too psychological; misses the normative/epistemic structure the committee cares about.
  2.  **The Sociology of Trust:** Frame hinges as social contracts that expire when trust erodes. *Drop:* Reduces epistemology to sociology; doesn't address the rationality of the transition itself.
  3.  **Hinge Demotion & Succession:** Focus on the functional lifecycle: how a commitment moves from bedrock to empirical status (and vice versa). *Keep:* Directly targets the user's insight about slow erosion vs. sudden doubt.
  4.  **The Logic of Epistemic Drift:** Attempt to formalize the transition rules for hinges. *Drop:* Too abstract; risks missing the "slow, invisible" nature of the phenomenon described in OC.
  5.  **Pathology vs. Health:** Distinguish between healthy hinge succession and epistemic sickness (dogmatism). *Drop:* Too metaphorical; hard to define norms without begging the question.
  6.  **Diachronic Coherentism:** Argue hinges are just temporary coherence maxima. *Drop:* Too close to standard coherentism; loses the specific Wittgensteinian edge about "groundless acting."

  **Selection:** **Hinge Demotion & Succession.** It isolates the specific gap in the literature (the *process* of change) without collapsing into psychology or sociology, and it allows for a normative evaluation of the transition itself.

  ***

  ### Research Proposal: Hinge Demotion and Succession
  **Project Title:** The Diachronic Normativity of Epistemic Bedrock
  **Duration:** 5 Months
  **Deliverable:** 25–30 page paper (Dissertation Chapter)

  **1. Project Summary**
  Contemporary hinge epistemology is obsessed with the *static* structure of certainty. The debate is entrenched: Are hinges propositions or acts? Are they arational bedrock or context-sensitive norms? Can they be doubted? This literature treats hinges as either immutable or changing via sudden "conversion" (a leap akin to religious change). This project argues that this binary misses the actual lifecycle of epistemic commitments. In practice, hinges rarely shatter; they erode. A commitment doing hinge work (unchecked, constitutive of the practice) gradually becomes an empirical claim (checked, uncertain), while a successor commitment quietly inherits the hinge role.

  I call this **Hinge Demotion** and **Hinge Succession**. The central question is not whether hinges can be doubted, but whether they can lose their status *without* doubt, and whether this transition is subject to epistemic evaluation. If a lab standard loses its hinge status because results drift, not because someone doubted it, was that shift rational? Or is the transition invisible to reason, only describable from within the successor practice?

  **2. The Gap**
  The committee knows *On Certainty*. You know the move against skepticism. But the current literature (e.g., Moyal-Sharrock, Pritchard, Coliva) leaves a normative blindspot.
  *   **Propositional readings** tie hinge status to immunity properties. They can only model change as "conversion," which looks like an unjustified leap.
  *   **Practical readings** describe the change but claim it is arational (just "how we act").
  *   **Quietist readings** deny there is a theory to be had.

  None account for **slow demotion**. If hinge status is functional, not intrinsic, then the transition should be traceable. If it is traceable, it might be normative. If it is normative, the "arational bedrock" slogan needs serious revision. This project forces hinge epistemology to account for time.

  **3. Case Studies**
  I will avoid abstract skepticism (Moore's hands) and focus on functional erosion where no explicit doubt is formulated.
  1.  **Instrumental Calibration:** A lab standard (e.g., a specific constant or instrument baseline) functions as a hinge. Over years, results drift. Researchers don't doubt the standard; they simply start citing its uncertainty in methods sections. It becomes an empirical variable. A new standard inherits the hinge role.
  2.  **Medical Consensus (The Swap):** The user's "family letters" case is too private. I propose the **Ulcer Paradigm Shift**. For decades, "stress causes ulcers" was a hinge of gastroenterology. It wasn't doubted; it was the background against which treatments were tested. Slowly, *H. pylori* evidence accumulated. The old hinge wasn't refuted by a skeptic; it was demoted to a false empirical claim. The new hinge ("bacteria causes ulcers") succeeded it.
  3.  **Conversational Drift:** In long-term dialogue, a key term (e.g., "freedom" or "security") functions as a hinge ensuring understanding. Without anyone noticing, the usage shifts. Participants start asking for definitions. The term moves from hinge to empirical object of negotiation.
  4.  **Legal Precedent:** A constitutional interpretation functions as a hinge for legislation. It isn't overturned by doubt, but by gradual distinction until it is treated as a contingent ruling rather than foundational law.

  **4. Methodology (Month-by-Month)**
  *   **Month 1: Taxonomy & Lit Review.** Map the existing accounts of hinge change (conversion vs. context-switching). Define "Demotion" vs. "Doubt." Finalize the four cases.
  *   **Month 2: Case Analysis (Instrumental & Medical).** Code the historical/practical records for the moment of status change. Identify if there was a "reason" given *at the time* or only in retrospect.
  *   **Month 3: Case Analysis (Linguistic & Legal) + Framework.** Draft the functional account of hinge status. Establish criteria for when a commitment is "doing hinge work."
  *   **Month 4: Normative Evaluation.** Test the transition against epistemic norms. Is demotion rational? Or is rationality only internal to the hinge regime? Draft the core argument.
  *   **Month 5: Writing & Revision.** Assemble the paper. Stress-test against the "coherentism" objection. Final polish.

  **5. Possible Conclusions & Decision Criteria**
  The paper will argue for one of the following, decided by the case analysis:
  1.  **The Rationalist Outcome:** Demotion is guided by internal tensions (anomalies). Hinges are not arational; they are *hyper*-confirmed beliefs that lose status when cost-of-maintenance exceeds utility. (Decision: If cases show explicit anomaly tracking before status loss.)
  2.  **The Functionalist Outcome:** Demotion is neither rational nor irrational; it is a causal shift in practice. Rationality applies only *within* a hinge regime. (Decision: If cases show no reasons given until after the shift.)
  3.  **The Distinctive Outcome:** Demotion is a third category distinct from belief revision and conversion. It has its own norms (e.g., "do not demote too quickly"). (Decision: If cases show criticism of *timing* of demotion.)
  4.  **The Null Hypothesis:** There is no distinct hinge phenomenon. These are just high-confidence beliefs undergoing standard abductive revision. (Decision: If the "hinge" label adds no explanatory power over standard epistemology.)

  **6. Deliverable for the Skeptic**
  For the committee member unconvinced that "hinges" are a genuine epistemic kind: The paper must show that standard epistemology (foundationalism/coherentism) cannot explain the **transition cost**. In standard views, changing a basic belief is costly and explicit. In these cases, the change is cheap and invisible. If hinge epistemology can explain *why* this transition is invisible and low-cost while standard views cannot, the concept earns its keep. The deliverable is not just a reading of Wittgenstein, but a functional tool for analyzing epistemic change.

  **7. Failure Conditions & Scope**
  *   **Failure Mode 1:** Every case turns out to be plain abductive belief revision. If I cannot distinguish "demotion" from "changing your mind about a fact," the project collapses into the Null Hypothesis. *Mitigation:* I will focus specifically on cases where the proposition was *uncheckable* during its hinge phase.
  *   **Failure Mode 2:** The account becomes purely descriptive ("wait and see which practice wins"). If I cannot say whether a demotion was *correct*, only that it happened, the normative value is lost. *Mitigation:* I will look for retrospective evaluations within the practices themselves (e.g., scientists criticizing earlier labs for holding the standard too long).
  *   **Scope Cut:** If the Linguistic case proves too vague (hard to trace "drift"), I will cut it and deepen the Medical and Instrumental cases. The Legal case is a backup if the Medical case is too historically complex for 5 months.

  **8. Feasibility**
  This is a conceptual project grounded in case studies, not empirical fieldwork. The cases are documented (history of science, legal records, transcript analysis). The theoretical heavy lifting is re-framing existing OC commentary, not generating new data. Five months is sufficient to draft a tight 30-page argument because the scope is narrow: not "what are hinges," but "how do they die." This specificity ensures completion.
