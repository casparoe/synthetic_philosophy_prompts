answer: |-
  Begin by dramatizing the gap between your stable values and your fatigue-distorted actions before introducing the idealized self, and keep the fridge example but ensure it hinges on temptation-induced blindness rather than simple rule-breaking.

  **Teaching Arc**
  1.  **The Phenomenology of Regret (15 mins):** Do not start with definitions. Ask students to describe a time they violated their own standards due to non-moral factors (exhaustion, stress, lack of info) and felt regret later. This establishes the *problem* (actual self is noisy) without invoking moral perfectionism.
  2.  **Constructing the Idealized Agent (15 mins):** Introduce the idealized self strictly as "you minus the noise" (full info, no fatigue, same core values). Explicitly state this is not a moral upgrade but a cognitive cleanup.
  3.  **The Binding Mechanism (15 mins):** Explain that the norm binds because the idealized self has authority over the actual self, similar to how a sober you binds a drunk you, not because the rule is inherently sacred.
  4.  **Application (15 mins):** Apply the framework to the example.
  5.  **Check Question (5 mins):** Deploy the assessment.

  **The Fridge Example**
  The example survives but requires tuning to avoid triviality. It must not be about "stealing is wrong"; it must be about *authority derived from conditions*.
  *   **Property 1 (Temptation):** The actual self is hungry/tired and rationalizes ("I'll replace it tomorrow").
  *   **Property 2 (Pattern Recognition):** The idealized self sees the downstream effect (this starts a habit of disrespect) which the actual self obscures.
  *   **Property 3 (Identity):** The idealized self isn't a roommate or a saint; it's *you* at 100% capacity.
  *   **Why it works:** It shows the norm binds not because "leftovers are sacred," but because your own best judgment endorsed a constraint to protect your values against your own weakness.

  **Misconceptions and Interventions**
  1.  **"Why not just be perfect?" (Occurs in Phase 1):** Students will ask why we need a proxy if we should just do the right thing.
      *   **Head Off:** Emphasize *cognitive limitation*. You literally cannot access the "right thing" when fatigued/biased; the idealized self is a tool to bypass actual cognitive constraints, not a moral demand.
  2.  **"The Ideal Me is a Saint" (Occurs in Phase 2):** Students will assume the idealized self has better *values*.
      *   **Head Off:** Stress *identity continuity*. The idealized self shares your core commitments (e.g., loyalty to friends) but processes them without interference. If you value fun, the ideal self values fun, just sustainably.
  3.  **"This is Hypocrisy/External Voice" (Occurs in Phase 3):** Students will feel alienated from the idealized self's demands.
      *   **Head Off:** Frame it as *self-binding*. The authority is internal; you are obeying your own deepest endorsement, not an external command. The "hypocrisy" is actually integrity across time.

  **What to Refuse to Explain**
  *   **Contractualist Texts:** Do not introduce Rawls' Original Position or Scanlon's *What We Owe to Each Other*. It adds historical baggage they don't need.
  *   **Meta-ethical Status:** Do not debate whether the idealized self "exists" or is a fiction. Treat it as a procedural heuristic.
  *   **Specific Content of Norms:** Do not let the session drift into debating which norms are correct; keep the focus on the *source* of the binding (the endorsement).

  **End-of-Session Check Question**
  "If your idealized self endorses a rule that your actual self currently finds painful to follow, is the obligation to follow it derived from the rule's content or the endorsement's source? Explain why the distinction matters for whether you are bound."
  *   **Pass:** They identify the source (the endorsement procedure) as the binding factor, acknowledging that current pain/disagreement doesn't invalidate the idealized authority.
  *   **Fail:** They argue the obligation depends on whether the rule seems "good" to the actual self right now (collapsing back into direct normativity).
