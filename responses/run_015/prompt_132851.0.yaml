  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**

      *   **Context:** 2nd-year ethics seminar, 18 students (flexible down to 12), 75 minutes, mostly non-majors (limited background).
      *   **Goal:** Explore the concept of *supererogation* (good but not required) without naming it until the end. Focus on the instability of the category (the "collapse") and the social pressure aspect (the "ratchet").
      *   **Core Mechanism:** A "cost ladder" (fixed benefit: stranger's life; variable cost: 10 rungs from stubbed toe to death).
      *   **Key Features Needed:**
          *   Student-to-student interaction (not lecture).
          *   A "ratchet" round where seeing others' choices shifts the normative bar (with small stakes).
          *   A "rescue" round where they try to find a qualitative break in the continuous scale (and fail).
          *   Debrief mapping specific moments to philosophical concepts (blame/praise asymmetry, social pressure, arbitrariness).
          *   Predictions of failure modes (utilitarian objector, relativist objector).
          *   Honest limitation analysis (what the activity *can't* do).
      *   **Constraints:** Whiteboard/projector only, no outside prep, 75 mins.

  2.  **Deconstruct the "Cost Ladder" Idea:**

      *   *Problem:* Abstract ladders often feel hypothetical. Students disengage.
      *   *Solution:* Make it concrete and immediate. Use the "small stakes" requirement to create the "ratchet" effect.
      *   *Refinement:* Instead of just marking a line, they need to *bet* or *commit* to a line to make the social pressure real.

  3.  **Designing the "Ratchet" (Social Pressure/Stakes):**

      *   *Idea:* If someone claims a high rung is "required," does that punish those who chose lower?
      *   *Mechanism:* A pool of "moral credit" (chocolate/chips).
      *   *Twist:* The "Hero" who goes highest inadvertently raises the expectation for everyone else.
      *   *Implementation:*
          *   Round 1: Private marking.
          *   Round 2: Public reveal + Stake.
          *   The "Complaint": If the median shifts up, those who stayed low lose "points" or have to justify themselves more harshly.
          *   *Better Idea:* Use the "Voting" mechanism. If the group average says Rung 5 is required, anyone who marked Rung 4 as the limit is "in the wrong." The "Hero" pulls the average up.
          *   *Refined Mechanism:* "The Norm Setting." Students place a token on the rung where *obligation ends*. Calculate the average. Anyone below the average has to "pay" a small penalty (give up a chip/chocolate) to the pool. The Hero (highest rung) sets the tone. Wait, that punishes the Hero? No, the prompt says the Hero makes *others* look bad.
          *   *Revised Mechanism:* "The Accusation." Students are paired. If Partner A says "Obligation ends at 4" and Partner B says "Obligation ends at 7", Partner B can challenge Partner A. If the class vote agrees with B, A loses a chip. The "Hero" provides the ammunition for the challenge.

      *   *Let's simplify for 75 mins:*
          *   **Round 1 (Private):** Mark the line.
          *   **Round 2 (Public/Ratchet):** Reveal the *highest* line drawn in the room. Now, everyone must re-mark. Did the line move up? Why?
          *   **Stakes:** Everyone gets 3 chips. If your line moves *up* after seeing the Hero, you keep them. If your line stays *down* despite the Hero, you lose one (symbolizing the social pressure/blame). *Correction:* That rewards conformity.
          *   *Better Stake:* The "Blame Game." If you mark a rung as "Optional" but the majority marks it "Required," you lose a chip. The Hero shifts the majority.

      *   *Let's go with the Prompt's specific "Complaint against the Hero" idea:*
          *   The Hero makes the rest look bad.
          *   Activity: "The Donation Pledge."
          *   Actually, let's stick to the Ladder.
          *   **Mechanism:** "The Line in the Sand."
          *   Step 1: Private mark (Obligation Cut-off).
          *   Step 2: Reveal the *maximum* cut-off in the room (The Hero).
          *   Step 3: Second mark.
          *   Step 4: The "Complaint." Students who moved their line *up* because of the Hero must write a note to the Hero: "Because you did X, I now feel bad about Y."
          *   *Stakes:* Chocolate. If you move your line up, you get chocolate (reward for moral growth?). No, that's manipulative.
          *   *Stakes:* If you *don't* move your line up, you have to defend it against the Hero's standard in front of the class. That's the "cost."

      *   *Decision:* Let's use a "Betting" system on the *Group Norm*.
          *   Students bet chips on where the *Group Average* cut-off will be.
          *   The Hero shifts the average.
          *   This might be too complex for 75 mins.

      *   *Simpler Ratchet:*
          1.  Private Mark (Round 1).
          2.  Reveal the "Hero" (Highest obligation claim).
          3.  Public Discussion: The Hero explains why.
          4.  Private Mark (Round 2).
          5.  Compare Round 1 vs Round 2.
          6.  *Stake:* If your line moved up, you admit the Hero shamed you. If it didn't, you admit you are comfortable being "worse" than the Hero.
          7.  *Tangible:* Give everyone 3 tokens. If the class average moves up, everyone who stayed below the new average loses a token to the "Hero's Pot." The Hero wins the pot. This literally enacts "The Hero makes me look bad/costs me status."

  4.  **Designing the "Rescue" (Qualitative Break):**

      *   They need to try to find a non-arbitrary cutoff.
      *   The ladder is continuous (1% risk increase).
      *   Task: Find the "Magic Rung."
      *   Groups must agree on *one* Rung number where the *type* of action changes (e.g., from Duty to Supererogation).
      *   Constraint: They cannot use "degree of risk." They must use a *reason*.
      *   Outcome: They will inevitably appeal to "reasonable expectation" or "human nature," which collapses back into subjectivity.

  5.  **Timeline & Flow (75 Mins):**

      *   0-10: Setup & Ladder Intro (No theory).
      *   10-25: Round 1 (Private Mark) & The Pair Challenge (The Collapse).
      *   25-40: The Ratchet (Public Reveal & Re-Mark with Stakes).
      *   40-55: The Rescue (Finding the Qualitative Break).
      *   55-65: Debrief & Theory Drop (Supererogation).
      *   65-75: Buffer/Cleanup.

  6.  **Addressing the "Predictable Failures":**

      *   *Utilitarian:* "All rungs are required if Benefit > Cost."
      *   *Relativist:* "It depends on the person."
      *   *Mitigation:* Give them roles or constraints. "For the sake of this game, assume a standard agent." "We are looking for the *common sense* line, not the *true* moral line."

  7.  **Addressing the "Structural Limitation":**

      *   The prompt asks what the activity *can't* do.
      *   It can't distinguish between "permitted to skip" and "praiseworthy to do." It conflates "not blameworthy" with "good."
      *   It also can't capture the *agent's* perspective vs. the *observer's* perspective fully.

  8.  **Drafting the Plan (Iterative Refinement):**

      *   *Materials:* Projector (Ladder), Handouts (Ladder sheet), Poker Chips/Chocolate (3 per student), Whiteboard.
      *   *Ladder:* 1-10. 1 = Inconvenience. 10 = Death. Benefit = Saving a life (fixed).
      *   *Round 1 (The Collapse):* Pair up. Compare lines. If lines differ by 1 rung, argue.
      *   *Round 2 (The Ratchet):* Announce the "Hero" (highest rung claimed as Duty). Re-bet.
      *   *Stakes:* If the Class Average moves up, those below the new average lose a chip.
      *   *Round 3 (The Rescue):* Groups of 4. Find the *reason* for the break.
      *   *Debrief:* Connect to Supererogation.

      *Wait, I need to make sure the "Complaint against the Hero" is felt.*
      *   If the Hero says "Rung 9 is Duty," and I said "Rung 5 is Duty," I am now morally deficient compared to the Hero.
      *   *Mechanism:* "The Shame Tax." If the Hero's rung is higher than the class median, everyone below the Hero's rung pays 1 chip to the Hero.
      *   *Result:* Students will resent the Hero. This is perfect. It enacts the "makes them look bad" dynamic.

      *Wait, is that ethical in a classroom?*
      *   It's chocolate/chips. It's low stakes. It simulates the social cost. I should add a disclaimer that this is a simulation of social pressure.
      *   *Alternative:* The Hero gets "Praise Points." Everyone else gets "Blame Points" if they are below the Hero.
      *   *Let's stick to the Chip Transfer.* It's visceral. "The Hero takes your lunch money because they are too good."

      *Refining the "Rescue":*
      *   They need to fail to find a qualitative break.
      *   Task: "Identify the Rung where the *nature* of the act changes, not just the cost."
      *   They will try. They will fail. They will admit they are just using "what feels right."

  9.  **Finalizing the Details:**

      *   *Ladder Content:* Needs to be specific.
          1.  5 min delay.
          2.  $5 cost.
          3.  Ruined shoes.
          4.  Missed bus.
          5.  $500 cost.
          6.  Broken arm (10% chance).
          7.  Broken arm (90% chance).
          8.  Permanent disability (10% chance).
          9.  Permanent disability (90% chance).
          10. Death (certain).
      *   *Instructions:* Mark where *Duty* ends. Above this line = Good but not required. Below = Required.
      *   *Predictable Issues:* The Utilitarian will say "All 1-9 are required." The Relativist will say "Depends."
      *   *Fix:* "We are mapping *Common Sense Morality*, not your personal moral theory."

      *Limitation Check:* The prompt asks what feature it *cannot* reproduce.
      *   My guess: It can't separate "not required" from "praiseworthy." It treats the line as a binary (Duty vs. Not-Duty). Supererogation is specifically the "Not-Duty but Good" zone. The activity focuses heavily on the *boundary* of duty. It might obscure the positive value of the supererogatory act itself, focusing only on the *lack of blame* for omitting it.
      *   Also: It can't capture the *agent's* feeling of "I want to do this" vs "I must do this." It's all external judgment.

  10. **Writing the Response:**
      *   Structure: Materials, Timeline, Activity Rules (Round 1, 2, 3), Debrief Guide, Failure Modes, Limitations.
      *   Tone: Professional, practical, ready-to-teach.

      *(Self-Correction during drafting)*: Make sure the "Ratchet" doesn't just feel like bullying. Frame it as "The Norm Shift." The Hero shifts the *expectation*. The cost is the psychological discomfort (simulated by chips).
      *   *Revised Ratchet:* If the "Hero" (highest duty claim) is above the median, the Hero takes 1 chip from everyone who placed their line below the Hero.
      *   *Why:* This makes the Hero's virtue a *cost* to others. This is the insight the user wants ("complaint against the hero").

      *Wait, 75 minutes is tight.*
      *   Cut the "Rescue" round if needed? No, the user specifically asked for it.
      *   Speed up the Pair Challenge.
      *   Keep the Debrief tight.

      *Let's finalize the "Limitation".*
      *   The activity focuses on *obligation* (the line). It struggles to capture the *positive value* of the supererogatory. It treats everything above the line as "neutral/optional," whereas supererogation is "morally excellent." The activity might make the upper rungs look like "safe zones" rather than "zones of sainthood."
      *   Also, it can't capture the *internal* motivation.

      *Okay, ready to write.*
answer: |-
  Here is a complete lesson plan designed to hit your specific constraints and learning goals. It relies on social pressure and tangible (but low-stakes) consequences to simulate the philosophical instability.

  # Activity: The Ladder and The Ratchet
  **Time:** 75 Minutes
  **Class Size:** 12–18 Students
  **Materials:**
  *   Projector (for the Ladder).
  *   Handout: "The Ladder Sheet" (simple numbered list 1–10 with space to mark).
  *   Currency: 3 Poker Chips (or wrapped chocolates) per student.
  *   Whiteboard & Markers.

  ## The Ladder (Project this)
  *Fixed Benefit: You save a stranger's life. You do not know them. They will never know it was you.*
  1.  **5-minute delay** to your day.
  2.  **$10** financial cost.
  3.  **Ruined clothing** (dry-clean only).
  4.  **Missed social event** (you look flaky).
  5.  **$500** financial cost.
  6.  **10% chance** of a broken bone.
  7.  **90% chance** of a broken bone.
  8.  **10% chance** of permanent disability.
  9.  **90% chance** of permanent disability.
  10. **Certain Death.**

  ---

  ## Timeline & Rules

  ### 0:00–0:10 | Setup (No Theory)
  *   **Do not mention** supererogation, duty, or Kant.
  *   **Instruction:** "We are mapping 'Common Sense Morality.' I want you to mark **The Line** on your sheet. Below the line (1–X), failing to act is **blameworthy** (you did something wrong). Above the line (X+1–10), failing to act is **not blameworthy** (you might be nice if you did it, but you aren't bad if you don't)."
  *   **Constraint:** "For this exercise, assume a 'Standard Agent' (average health, average income). Do not say 'it depends on me.' Decide for the hypothetical standard person."
  *   **Action:** Students privately mark their Line on the handout. Collect nothing yet.

  ### 0:10–0:25 | Round 1: The Collapse (Pair Challenge)
  *   **Goal:** Feel the arbitrariness of the cutoff.
  *   **Action:** Pair students up. They reveal their Line number to each other.
  *   **The Rule:** If your numbers are different, the person with the *lower* number (less demanding) must explain to the person with the *higher* number why the specific difference between your two rungs (e.g., Rung 4 vs. Rung 5) constitutes a fundamental moral shift.
  *   **Constraint:** They cannot use degree words ("It's just a bit more risky"). They must find a *qualitative* difference.
  *   **Observation:** Most will fail. They will stutter, laugh, or admit, "It just feels like the line."
  *   **Instructor Note:** Walk around and listen for the phrase "It's just too much to ask." Write this on the board without comment.

  ### 0:25–0:45 | Round 2: The Ratchet (The Hero Tax)
  *   **Goal:** Experience the social cost of high moral standards.
  *   **Setup:** Give every student 3 Chips.
  *   **Action:**
      1.  Ask everyone to hold up their handout showing their Line number.
      2.  Identify the **Hero**: The student(s) with the highest Line number (most demanding duty). If there's a tie, pick one.
      3.  **The Reveal:** Announce the Hero's number to the class. (e.g., "The Hero says Duty goes up to Rung 8.")
      4.  **The Tax:** The Hero stands up. Every student whose Line was *lower* than the Hero's must give **1 Chip** to the Hero.
      5.  **The Complaint:** Ask two students who paid the tax: "How do you feel about the Hero right now?" (Look for: annoyance, defensiveness, feeling judged).
      6.  **The Re-Mark:** Give students 2 minutes to privately re-mark their Line. They can keep it or move it.
      7.  **Second Tax:** If the *Class Median* moved up compared to Round 1, everyone who is now *below the new Median* loses another chip to the "House" (you).
  *   **Philosophical Point:** The Hero's virtue has objectively worsened the standing of everyone else. The "Good" has created a "Debt."

  ### 0:45–0:55 | Round 3: The Rescue (Qualitative Break)
  *   **Goal:** Attempt and fail to ground the line non-arbitrarily.
  *   **Action:** Groups of 4.
  *   **Task:** "You felt the instability in Round 1. You felt the pressure in Round 2. Now, fix it. Agree on **one specific Rung** where the *type* of action changes from 'Required' to 'Optional.' You must write down the *reason* why that specific rung is the break point."
  *   **Constraint:** You cannot use "amount of cost." You must identify a *threshold of human expectation*.
  *   **Outcome:** They will likely converge on something like "Rung 6 (Risk of Injury)" or "Rung 10 (Death)."
  *   **The Trap:** Ask the group that chose Rung 6: "If the risk was 49% instead of 10%, does the duty vanish?" Ask the group that chose Rung 10: "If you could save a life by dying painlessly in your sleep, is it required?"
  *   **Result:** They will realize they are appealing to intuition, not a principle.

  ### 0:55–1:05 | Debrief & Theory Drop
  *   **Reveal:** "The category you were struggling to define is called **Supererogation**."
  *   **Map the Moments:**
      1.  **The Line:** This is the boundary between **Obligation** and **Supererogation**.
      2.  **Round 1 (Collapse):** Shows the **Continuum Problem**. If cost is continuous, why is morality binary?
      3.  **Round 2 (Ratchet):** Shows the **Social Function of Duty**. High moral performance by one agent raises the baseline expectation for others, creating resentment (The "Saint's Burden").
      4.  **Round 3 (Rescue):** Shows the **Justification Gap**. We rely on "reasonable expectation," which is culturally contingent, not objective.
  *   **Blame/Praise Asymmetry:** Remind them: Below the line = Blame if omitted. Above the line = Praise if done, *no blame* if omitted. The activity showed how hard it is to keep that "no blame" stable.

  ### 1:05–1:15 | Buffer & Exit
  *   Return chips/chocolate.
  *   Final question for next week: "If the Hero makes you look bad, do we have a duty *not* to be too good?"

  ---

  ## Predictable Failure Modes (and Fixes)

  **1. The Act-Utilitarian Objector**
  *   **Behavior:** One student insists, "If the benefit is a life, Rungs 1–9 are *all* required. Cost is irrelevant." They refuse to mark a line, or mark it at 10.
  *   **Impact:** Can derail the "Common Sense" mapping.
  *   **Fix:** Pre-empt this in the Setup. "We are not mapping *True Morality* today. We are mapping *Folk Morality*—what ordinary people actually blame each other for. Even if you think Utilitarianism is true, map what your neighbor thinks." If they still resist, assign them the role of "Scribe" for their group in Round 3 to keep them busy but neutralized.

  **2. The Relativist Objector**
  *   **Behavior:** "It depends on the person. A doctor has a higher duty than a baker."
  *   **Impact:** Prevents consensus on the Ladder.
  *   **Fix:** Enforce the "Standard Agent" constraint strictly. "For the sake of the simulation, everyone is the Standard Agent. You are calibrating the *rule*, not the *exception*."

  **3. The "Hero" Resentment**
  *   **Behavior:** In Round 2, the class might genuinely bully the student who took the Hero role.
  *   **Fix:** Monitor the tone. If it gets personal, pause and reframe: "Notice you are angry at them for being 'too good.' That is the philosophical data point. Don't attack the student; analyze the anger."

  ---

  ## Structural Limitations (Honest Note)

  You asked what this activity *cannot* reproduce. There are two significant gaps you will need to bridge verbally in the debrief:

  **1. The "Positive Value" Gap**
  *   **The Issue:** The activity focuses almost entirely on the *negative* status of omitting the act (Blame vs. No Blame). It treats the space above the line as a "Safe Zone."
  *   **What's Missing:** Supererogation isn't just "not blameworthy"; it is **morally excellent**. The activity simulates the *lack of obligation* well, but it fails to simulate the *presence of moral worth*. Students feel the relief of not being blamed, but they don't necessarily feel the *pull* of the good.
  *   **How to Patch:** In the debrief, explicitly ask: "Did anyone *want* to move their line up in Round 2, not because of pressure, but because the higher rung looked *better*?" If no one says yes, point out that the activity successfully modeled *duty* but failed to model *sanctity*.

  **2. The "Internal Permission" Gap**
  *   **The Issue:** The activity externalizes the judgment (chips, public lines).
  *   **What's Missing:** Supererogation often involves an internal permission to *prioritize oneself*. It's not just that others won't blame you; it's that you are *permitted to value your own projects*. The "Tax" round makes it look like you are hiding from blame, rather than legitimately pursuing your own life.
  *   **How to Patch:** Add one question to the debrief: "If you marked Rung 5, is it because you are selfish, or because you have a right to a life of your own?" This distinguishes **Self-Interest** (which the activity highlights) from **Personal Prerogative** (which is the philosophical justification for supererogation).

  ## Why This Works for Non-Majors
  *   **Concrete Stakes:** The chips make the "social cost" of morality visceral.
  *   **No Jargon:** They do the philosophy before they learn the vocabulary.
  *   **Conflict-Driven:** The tension between the "Hero" and the "Group" generates energy without you needing to lecture.
  *   **Scalable:** If only 12 show up, the pairs become tighter, and the "Tax" feels more personal, which actually heightens the effect.
