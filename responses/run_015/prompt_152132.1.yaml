answer: |-
  **The Free Commonwealth of Potentia**

  **Introduction**
  Welcome to Potentia, the world's only state founded strictly on the *Tractatus Politicus*. Travellers should immediately discard Western notions of inalienable rights. Here, right is co-extensive with power. If the state can crush you, it has the right to do so; if you can resist, you retain your right. It is a refreshingly honest system, though perhaps taxing for the litigious. The sovereign is absolute, yet paradoxically, there is no monarch. Sovereignty resides in the multitude itself, provided the multitude can agree on anything other than where to have lunch.

  **Governance & Civic Life**
  Do not expect frequent elections. Locals will tell you that voting is merely a procedural artifact, not the essence of liberty. The true essence is the absence of a single ruler. However, do not mistake this for licence. The Commonwealth is guided by *notiones communes*—common notions derived from reason—rather than mere public opinion. You may notice citizens ignoring popular sentiment if it lacks adequate ideas. A proposal to ban rain, for instance, was voted down not because it was impossible, but because it stemmed from imagination rather than reason.

  The assembly is open, but debate is strictly rationed. Passions are viewed as a public health hazard. If a speaker becomes too animated, they are gently reminded that affects diminish one's power of acting. Consequently, parliamentary proceedings are conducted in a monotone whisper. It is deeply calming, unless you require urgent infrastructure funding.

  **Citizenship Requirements**
  Visa regulations are rigorous and somewhat dated. According to the founding charter (Chapter 11), the sovereign body comprises only independent men. Women, servants, children, and foreigners are excluded from voting rights. Officials insist this is not discrimination but a metaphysical necessity regarding dependancy and property. Attempting to argue otherwise is considered a passion-driven disturbance. Female travellers are advised to enjoy the scenery but refrain from policy suggestions. It is an awkward dynamic at dinner parties, but one learns to navigate it with stoic resignation.

  **Safety & Stability**
  Potentia is the most natural form of government, yet also the most prone to collapse. The theory holds that democracy collapses when the multitude is guided by passion rather than reason. Consequently, the country oscillates between periods of hyper-rational stagnation and sudden factional violence. Travellers should monitor the 'Affect Index'. If the populace begins shouting about honour or religion, proceed to the embassy. The state remains absolute only so long as it holds the power; should a faction seize the armory, right instantly transfers to them. It is a fluid legal system, best suited for those comfortable with existential uncertainty.

  **Getting Around**
  Public transport is free, provided you have the power to board the bus. If you are shoved off, you had no right to the seat. It is Social Darwinism with a rationalist veneer.

  ***

  **Author's Note**

  **Settled Scholarship:** It is textually certain that in the *Tractatus Politicus* (TP), Spinoza defines democracy as the absence of monarchy (TP 11.1) and identifies natural right with power (TP 2.3). It is also undisputed that TP 11.4 explicitly excludes women, servants, and children from the voting body, grounding this in claims about their dependancy and lack of independent power.

  **Contested Interpretations:** Scholars debate whether these exclusions render Spinoza's democratic theory incoherent given his metaphysics in the *Ethics* (which suggests women are not naturally inferior). Some argue Spinoza was describing a historical reality rather than prescribing an ideal; others contend he believed women were naturally less capable of reason. The parody above treats the exclusions as active policy, which is a literal reading of the TP but ignores debates about his broader philosophical consistency.

  **Parody Liberties:** The guide simplifies the mechanism of *notiones communes* (common notions) as a procedural rule rather than an epistemological category. It also exaggerates the instability; while Spinoza warns democracies are prone to turmoil, he argues they are also the most stable *if* well-ordered. The line "If you are shoved off, you had no right to the seat" is a satirical reduction of the *potentia*/*jus* identity, which Spinoza applies primarily to sovereign states, not necessarily individual bus queues.
