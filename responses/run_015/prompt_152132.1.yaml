      *   *Democracy:* Defined negatively often (absence of monarchy/aristocracy) or as the most natural state where everyone transfers power to the whole society.
      *   *The Multitude:* Needs to be guided by reason to be stable. If guided by passion, it collapses.
      *   *Exclusions:* TP Chapter 11, Section 4 explicitly excludes women, servants, children, and foreigners from voting rights. This is a major point of tension for modern readers.
