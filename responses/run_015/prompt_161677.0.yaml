prompt: |-
  I chair the Clinical Priorities Committee of a regional hospital network — six hospitals, roughly nine hundred beds, a mix of urban and rural sites. We meet monthly for ninety minutes and we decide two kinds of thing. The first is standing allocation protocols: who gets the scarce dialysis places, how a short supply of a costly drug is rationed, which exceptions to the transplant waiting list we will endorse. The second, perhaps five or six times a year, is an individual case escalated to us, usually a request for a treatment we would not normally fund. Our members are two physicians, a nurse manager, a pharmacist, and a lay member. None of us has training in philosophy or in health economics. Every decision has to survive two audiences: it must be explainable in a one-page written rationale to the patient or family it burdens, and it must be defensible to a board that thinks mainly in terms of value for money. Anything with a budget impact above a set threshold requires the chief medical officer's counter-signature, and anything that reverses our own standing protocol goes to the board.

  Our working method is cost-effectiveness arithmetic. We estimate benefit in quality-adjusted units, sum across the people affected, and compare totals. It is transparent, it is auditable, and it is straightforwardly aggregative. Last year the daughter of a patient wrote to complain that we had treated her father as a unit in a calculation, and my own sense — which I have not been able to shake — is that the complaint identified something our method is structurally unable to register: that the gains and losses we add up fall on different people, and that a large sum of small benefits distributed across many does not by itself constitute an answer to the one person who is asked to bear something concentrated. The board has now asked us to build an explicit separateness check into our process.

  What I need from you is that check as a procedure rather than as a principle. Concretely: an ordered set of questions we can run in about twenty minutes of committee time on any proposal whose justification aggregates benefits and burdens across distinct patients; what counts as a sufficient answer to each; the points at which the procedure stops and returns a no; and the points at which it stops and hands the decision to a named person on the grounds that what remains is a judgment about values rather than a finding. I want it to be capable of actually biting, and I want the hand-off points to be honest rather than an escape hatch from every difficult case.

  Three of the tests I have in mind are these, and I would like you to build them, tighten them, or replace them if you can show they are the wrong instruments.

  First, an addressability test. The committee should have to state, in one sentence addressed to the person who bears the largest single-person loss, what that person is being asked to accept and why. The test should distinguish a reason that is genuinely a reason for that person — one that survives being generalized to everyone in their position — from a reason that only appears when the case is described from an impersonal standpoint, and whose entire content is that other people gain more.

  Second, a re-description audit. Before we sum, we should have to say what the units being summed are, and check whether they are persons or slots. A benefit described as life-years produced, cases detected, or readmissions averted is a benefit whose bearer has been made interchangeable; a benefit described as this patient's remaining years, or this patient's settled refusal being respected, is not. Where the ranking of options changes depending on which description we adopt, I want the procedure to say so and to rule on whether the slot-description is licensed.

  Third, a ratified-pool test. Aggregation within a single person's life — their own present burden traded against their own longer future — seems to me to raise a much weaker version of the worry than aggregation across lives. I also suspect that aggregation across people is least problematic where those people have in some sense authorized the conversion: they joined a scheme with published rules, they registered under a protocol they knew pooled风险 and benefit, they left an advance directive. My tentative view is that cross-person conversion without ratification is what stands in need of special justification, and that this gives the procedure a principled place to stop rather than a series of ad hoc thresholds. Tell me whether that is defensible and where it breaks.

  I also want a concentration threshold of some kind, but I do not know how to set or defend one, so tell me what the procedure should do when the largest single-person loss is severe and irreversible even though the aggregate favours proceeding.

  The hard cases the procedure must be able to process without collapsing: benefits and burdens falling on statistical rather than identified people; people who cannot be addressed at all, such as infants, patients with advanced dementia, or the unconscious; burdens falling on people who are not yet patients or not yet born; cases where the aggregative and non-aggregative answers diverge only because of how the benefit is described; genuine emergencies decided in minutes; and proposals where the same people appear on both sides of the ledger, so that a rule that protects them as losers also deprives them as winners.

  Then run the procedure on three of our actual recurring cases. One: closing a satellite dialysis unit that serves eleven named patients in a rural town, and redirecting the money to a screening programme that will, on the evidence, prevent a small number of deaths across a much larger population. Two: a request to fund an extremely expensive last-line therapy for one identified patient, where the same money would fund a nurse-led follow-up service that prevents many readmissions — I expect this is the case where the procedure will tell us something we do not want to hear, and I want you to let it. Three: a proposed rule for allocating a scarce drug during a shortage, under which expected benefit governs entirely and the fact that a candidate is already under this hospital's care, with an established clinical relationship, counts for nothing.

  Finally, I want a clear statement of what the procedure cannot do: which of its inputs are set by judgment rather than by the theory, how a committee without philosophical training should set and revisit them, where we should expect it to misfire or to be gamed by a clever re-description, and what brief minute we should record so that the board can audit that the check was run rather than accept our assurance that it was. Please argue for the view rather than survey it: no citations, no bibliography, and no references to particular papers or authors, since I have no library access and no way to check them.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Chair of a Clinical Priorities Committee (regional hospital network, 6 hospitals, 900 beds).
      *   **Context:** Monthly meetings, 90 mins. Decides standing allocation protocols and individual escalated cases.
      *   **Current Method:** Cost-effectiveness arithmetic (QALYs/utilitarian aggregation).
      *   **Problem:** A complaint highlighted the "separateness of persons" issue (aggregating small gains for many vs. large loss for one). The Board wants an explicit "separateness check."
      *   **Committee Composition:** 2 physicians, 1 nurse manager, 1 pharmacist, 1 lay member. No philosophy/economics training.
      *   **Requirements:**
          *   A *procedure*, not just a principle.
          *   Ordered set of questions (approx. 20 mins).
          *   Criteria for sufficient answers.
          *   Stop points (returns "No").
          *   Hand-off points (passes to named person for value judgment).
          *   Must "bite" (not just an escape hatch).
          *   Must handle hard cases (statistical people, non-autonomous patients, future generations, emergencies, same people on both sides).
          *   Must incorporate/evaluate three specific tests proposed by the user (Addressability, Re-description, Ratified-Pool).
          *   Must address the "Concentration Threshold" (severe/irreversible loss vs. aggregate gain).
          *   Must run on three specific cases (Dialysis unit closure, Expensive last-line therapy, Scarce drug allocation rule).
          *   Must include limitations/audit trail instructions.
          *   **Constraint:** No citations, no bibliography, no references to specific papers/authors. Argue for the view.

  2.  **Deconstruct the User's Proposed Tests:**
      *   *Addressability Test:* Can we justify this to the loser directly without relying solely on "others gain more"?
          *   *Critique:* Hard to pass if the *only* reason is aggregate gain. Needs refinement to allow for systemic stability arguments (e.g., "if we don't do this, the system collapses for everyone including you").
      *   *Re-description Audit:* Are we summing "slots" or "persons"?
          *   *Critique:* Good distinction. Needs to be operationalized. If the ranking changes based on description, it flags a moral hazard.
      *   *Ratified-Pool Test:* Is there prior consent/authorization for aggregation?
          *   *Critique:* Defensible but breaks down for emergencies, infants, unconscious. Needs a "presumed ratification" clause for standard care, but strict scrutiny for exceptions.

  3.  **Develop the Procedure (The "Separateness Protocol"):**
      *   *Goal:* 20 minutes max. 5 steps.
      *   *Step 1: The Loss Identification.* Who loses most? How much?
      *   *Step 2: The Addressability Statement.* (User's Test 1). Draft the sentence.
      *   *Step 3: The Unit Audit.* (User's Test 2). Slots vs. Persons.
      *   *Step 4: The Ratification Check.* (User's Test 3). Consent/Protocol.
      *   *Step 5: The Concentration Threshold.* (User's additional request). Severe/irreversible loss.
      *   *Decision Nodes:* Pass, Fail (No), Hand-off (CMO/Board).

  4.  **Refining the Tests for Operational Use:**
      *   *Addressability:* It's impossible to tell a patient "You lose so others win" and call it a reason *for them*. However, "You lose so the system survives for everyone, including you" is a universalizable reason. The test must distinguish *sacrifice for others* vs. *sacrifice for system integrity*.
      *   *Re-description:* If describing benefits as "life years" (slots) yields a different result than "patients saved" (persons), the slot view is suspect unless ratified.
      *   *Ratified-Pool:* This is the strongest filter. If a patient opted into a trial or a specific protocol, aggregation is easier. If it's an ad-hoc extraction from an individual to help strangers, it's harder.
      *   *Concentration Threshold:* Needs a "Veto" mechanism. If the loss is catastrophic (death, permanent vegetative state) and the gain to others is marginal (minor QALY improvements), the procedure should stop.

  5.  **Drafting the Procedure Steps (Iterative refinement):**
      *   *Time limit:* 20 mins means ~4 mins per step.
      *   *Language:* Plain English, no jargon.
      *   *Outcomes:* Clear "Proceed," "Reject," or "Escalate."

  6.  **Addressing the Hard Cases:**
      *   *Statistical/Unborn:* Addressability fails. Need a proxy (e.g., "representative member of the class").
      *   *Infants/Dementia:* Ratification impossible. Rely on "Best Interest" + "Standard Protocol."
      *   *Emergencies:* Protocol must have an "Emergency Bypass" (decide now, review later).
      *   *Same people on both sides:* Aggregation is usually fine here (insurance model).

  7.  **Running the Three Cases:**
      *   *Case 1 (Dialysis vs. Screening):* Rural patients lose access (high burden). Population gains small risk reduction. Addressability fails ("Your kidney failure helps strangers"). Ratification fails (didn't sign up for this). *Result:* Likely Fail or Escalate.
      *   *Case 2 (Expensive Drug vs. Nurse Service):* One identified loser vs. many readmissions prevented. Addressability hard. Concentration threshold (death vs. readmission). *Result:* Fail (Procedure bites).
      *   *Case 3 (Scarce Drug Rule):* Standing protocol. "First come" vs. "Best Outcome." Addressability to the one denied care due to lower score. Ratification (hospital admission implies acceptance of triage rules?). *Result:* Pass with conditions (transparency).

  8.  **Defining Limitations & Audit:**
      *   *Inputs:* The definition of "Severe/Irreversible" is judgment-based.
      *   *Gaming:* Re-describing a person as a statistic.
      *   *Audit:* The minute must record the "Addressability Sentence" verbatim.

  9.  **Review against Constraints:**
      *   No citations? Check.
      *   Argue for the view? Check.
      *   20 minutes? Check.
      *   Hand-off points? Check.
      *   Concentration threshold? Check.

  10. **Final Polish:** Ensure tone is respectful of the Chair's expertise but firm on the ethical mechanics. The "Hand-off" needs to be specific (CMO or Board). The "Concentration Threshold" needs a specific trigger (e.g., "Catastrophic Loss").

  *(Self-Correction during drafting)*: I initially thought about suggesting a voting mechanism. No, the prompt asks for a *procedure* that returns a result or hand-off. Voting hides the reasoning. The procedure must force the reasoning into the open.
  *Refining the Addressability Test:* The user wants to distinguish reasons that survive generalization. I need to make sure the committee doesn't just say "Because it's policy." The reason must be moral, not bureaucratic.
  *Refining the Ratified-Pool:* The user asked if this is defensible. It is, *except* for public health measures. I need to carve out "System Viability" as a form of implicit ratification for standing protocols, but not for individual exceptions.

  11. **Final Structure:**
      *   Introduction: Acknowledge the tension.
      *   The Procedure (The Separateness Protocol): 5 Steps.
      *   Decision Logic (Stop/Go/Hand-off).
      *   Application to Three Cases.
      *   Limitations & Audit.
      *   Conclusion.

  (Proceed to generate response based on this structure.)
answer: |-
  This is a request for an operational ethic, not a theoretical one. You need a tool that fits into a ninety-minute meeting, survives audit, and prevents the committee from hiding behind arithmetic when a moral remainder exists. The core insight from the complaint is correct: summation erases the boundaries between people. A procedure cannot solve the philosophical problem of aggregation, but it can force the committee to acknowledge where the arithmetic stops and the moral cost begins.

  Below is the **Separateness Protocol**. It is designed to take twenty minutes. It incorporates your three proposed tests but tightens them to prevent evasion. It adds a concentration threshold and defines the hand-off points.

  ### The Separateness Protocol

  **Time Allocation:** 20 Minutes maximum.
  **Applicability:** Any proposal where the net benefit relies on aggregating gains across multiple people to outweigh a loss concentrated on one or few identifiable people. (Not required for emergency clinical decisions made in the moment, but required for retrospective review of those decisions).

  #### Step 1: The Loss Identification (3 Minutes)
  **Question:** Who bears the largest single-person burden if this proposal proceeds?
  **Requirement:** Identify a specific person or a specific, closed class of persons (e.g., "the eleven patients at Satellite Unit X").
  **Sufficient Answer:** A name, or a description narrow enough that the individuals could be named without changing the nature of the loss.
  **Stop Point:** If the loss cannot be identified even as a closed class (e.g., "statistical lives saved" vs. "statistical lives lost" with no identifiable losers), the Protocol does not apply. Proceed with standard cost-effectiveness analysis.
  **Note:** If the "losers" are the same people as the "winners" (e.g., a general tax on all patients to fund a benefit for all patients), the Protocol stops here. Aggregation is permitted.

  #### Step 2: The Addressability Statement (5 Minutes)
  **Question:** Draft the sentence that will be spoken to the person identified in Step 1.
  **Requirement:** The sentence must follow this form: *"We are asking you to accept [Specific Loss] because [Reason]."*
  **Test:** The [Reason] must remain a valid reason if you swap the identity of the loser with any other person in the same clinical position. It cannot rely on the identity of the winners.
  **Sufficient Answer:** A reason that appeals to system integrity or universalizability.
  *   *Pass:* "We are asking you to accept transfer to a distant unit because maintaining this satellite unit would bankrupt the regional dialysis network, causing collapse of care for you and everyone else within six months." (Appeal to shared fate).
  *   *Fail:* "We are asking you to accept transfer to a distant unit because the money saves more lives if spent on screening." (Appeal to net utility).
  **Stop Point:** If the committee cannot draft a sentence that does not essentially say "because others gain more," the proposal returns a **No**.
  **Hand-off:** If the reason is "system integrity" but the loss is catastrophic (see Step 5), hand off to the Chief Medical Officer (CMO).

  #### Step 3: The Unit Audit (4 Minutes)
  **Question:** Look at the benefit column in your cost-effectiveness model. Are the units "Person-Units" or "Slot-Units"?
  **Definition:**
  *   *Person-Unit:* A benefit tied to a specific individual's narrative continuity (e.g., "Mr. Jones's remaining years," "Ms. Smith's ability to walk").
  *   *Slot-Unit:* A benefit tied to a capacity metric (e.g., "Life-years generated," "Readmissions averted," "QALYs").
  **Test:** Re-calculate the decision if you count *heads* instead of *units*. Does the ranking of options change?
  **Sufficient Answer:** "The ranking does not change," OR "The ranking changes, but the Slot-Unit description is licensed by Step 4."
  **Stop Point:** If the ranking changes (i.e., the decision depends on counting slots, not people) AND Step 4 fails, the proposal returns a **No**.
  **Note:** This prevents hiding a large loss to one person behind a massive sum of tiny gains to many by inflating the "units" of gain.

  #### Step 4: The Ratified-Pool Check (4 Minutes)
  **Question:** Did the person identified in Step 1 enter a scheme where this specific trade-off was a known, published rule?
  **Requirement:** Evidence of explicit consent, signed protocol, or advance directive that authorizes this specific type of aggregation.
  **Sufficient Answer:** "Yes, the patient enrolled in a trial with this randomization rule," or "Yes, this is a standing triage protocol published at admission which the patient accepted by seeking care during a declared shortage."
  **Fail:** "No, this is an ad-hoc decision," or "No, the patient is unconscious and has no directive."
  **Hand-off:** If the answer is "No" (no ratification), but the aggregate benefit is overwhelming, hand off to the Board. This is a value judgment about whether the hospital has the right to impose unconsented trade-offs.
  **Exception:** For infants, incapacitated, or unconscious patients, "Best Interest" standard applies. If the trade-off is not in *their* best interest, but in the *population's* interest, treat as **No Ratification**.

  #### Step 5: The Concentration Threshold (4 Minutes)
  **Question:** Is the loss identified in Step 1 "Catastrophic"?
  **Definition:** Death, permanent vegetative state, loss of fundamental autonomy, or irreversible loss of a major bodily function.
  **Test:** Compare the Catastrophic Loss against the Aggregate Gain.
  **Rule:** A Catastrophic Loss to one identified person cannot be traded for *non-catastrophic* gains to others, regardless of the sum.
  **Sufficient Answer:** "The loss is not catastrophic" OR "The gains to others are also catastrophic (i.e., preventing death)."
  **Stop Point:** If Loss = Catastrophic and Aggregate Gain = Non-Catastrophic (e.g., quality of life improvements, minor risk reductions), the proposal returns a **No**.
  **Hand-off:** If Loss = Catastrophic and Aggregate Gain = Catastrophic (e.g., one dies so five don't), hand off to the Board. This is a tragic choice, not an arithmetic one.

  ---

  ### Decision Logic Summary

  1.  **Return "No":**
      *   Addressability Statement relies solely on "others gain more."
      *   Unit Audit shows decision depends on Slot-Units *and* Ratification fails.
      *   Concentration Threshold: Catastrophic Loss traded for Non-Catastrophic Gain.
  2.  **Proceed:**
      *   All tests passed.
  3.  **Hand-off to CMO:**
      *   Addressability relies on "System Integrity" but Loss is Catastrophic.
  4.  **Hand-off to Board:**
      *   Ratification fails (unconsented trade-off) but aggregate benefit is high.
      *   Concentration Threshold: Catastrophic Loss traded for Catastrophic Gain (tragic choice).

  ---

  ### Application to Recurring Cases

  Here is how the Protocol processes your three specific scenarios.

  #### Case 1: Closing the Satellite Dialysis Unit
  *Scenario:* Close rural unit (11 patients lose local access, high burden) to fund screening (prevents small number of deaths in large population).
  *   **Step 1 (Loss):** The 11 rural patients. Identifiable.
  *   **Step 2 (Addressability):** Draft: "We are asking you to travel 40 minutes for dialysis because the money saves more lives elsewhere." -> **Fail.** This is purely aggregative.
      *   *Attempt 2:* "We are asking you to travel because keeping this unit open risks the solvency of the network." -> **Pass** (if financially true).
  *   **Step 3 (Unit Audit):** Benefit is "deaths prevented" (Slot) vs. "access lost" (Person). Ranking likely depends on the high volume of screening.
  *   **Step 4 (Ratification):** Did the 11 patients agree to be closed down for population health? No. **Fail.**
  *   **Step 5 (Concentration):** Is loss of local dialysis "Catastrophic"? For some, travel distance makes treatment impossible, leading to death. If so, **Catastrophic**. Gain is statistical risk reduction (Non-Catastrophic for any specific individual).
  *   **Result:** **No.** The Protocol blocks this. The burden is concentrated, unconsented, and potentially catastrophic, traded for diffuse statistical gain.
  *   **Action:** To proceed, this must go to the **Board** as a value judgment on rural equity vs. population efficiency. The Committee cannot approve this under the Protocol.

  #### Case 2: Expensive Last-Line Therapy vs. Nurse Follow-Up
  *Scenario:* Fund drug for one identified patient (high cost, marginal gain) vs. nurse service preventing many readmissions.
  *   **Step 1 (Loss):** The many patients who will be readmitted because the nurse service wasn't funded. Wait—the proposal is to *fund the drug*. So the "Loss" falls on the population who lose the nurse service.
      *   *Correction:* The proposal is to fund the drug. The "Loss" is the opportunity cost. The Protocol asks about the person bearing the *largest single-person loss*. If we fund the drug, the "losers" are the readmitted patients. They are statistical.
      *   *Re-frame:* The Protocol applies to the *request*. The request imposes a burden on the system to benefit one. Let's look at the *denial*. If we deny the drug, the "Loss" is the one patient (death/progression). If we deny the nurse service, the "Loss" is distributed.
      *   *Protocol Trigger:* The decision aggregates the small burdens of many (readmissions) to outweigh the large burden of one (death).
  *   **Step 1 (Loss):** The single patient denied the drug.
  *   **Step 2 (Addressability):** "We are denying you this drug because the money prevents readmissions for others." -> **Fail.**
  *   **Step 3 (Unit Audit):** Benefit of nurse service is "readmissions averted" (Slot). Benefit of drug is "patient's life" (Person). Ranking changes if we count heads.
  *   **Step 4 (Ratification):** Did the patient agree to be denied life-saving care to fund readmission prevention? No. **Fail.**
  *   **Step 5 (Concentration):** Loss = Death (Catastrophic). Gain = Avoided readmission (Non-Catastrophic).
  *   **Result:** **No.** The Protocol bites hard here. It forbids trading a identified person's life for a sum of quality-of-life improvements for others.
  *   **Action:** This confirms your suspicion. Under this procedure, you cannot deny the drug on aggregative grounds alone. To deny it, you must argue the drug is *clinically futile* (no benefit to the patient), not that the money is better spent elsewhere. If it is clinically effective, the **Board** must decide if they are willing to violate the Concentration Threshold.

  #### Case 3: Scarce Drug Allocation Rule
  *Scenario:* Rule states "Expected Benefit Governs." Existing clinical relationship counts for nothing.
  *   **Step 1 (Loss):** The patient currently under care who is displaced by a new patient with higher expected benefit.
  *   **Step 2 (Addressability):** "We are stopping your treatment because this new patient will benefit more." -> **Fail** (Aggregative/Comparative).
      *   *Attempt 2:* "We are applying a rule that maximizes survival for everyone, which you benefit from when you are the higher-benefit candidate." -> **Pass** (Universalizable).
  *   **Step 3 (Unit Audit):** Units are "Life Years" (Slot). Ranking depends on this.
  *   **Step 4 (Ratification):** Is this a published standing protocol? If yes, admission to the hospital during shortage implies acceptance. **Pass.** (This is the strength of standing protocols over ad-hoc decisions).
  *   **Step 5 (Concentration):** Loss = Death (Catastrophic). Gain = Another's Life (Catastrophic prevention).
  *   **Result:** **Hand-off to Board.** This is a tragic choice (one dies so another lives). However, because it is a *standing protocol* (Ratification Pass) and *Universalizable* (Addressability Pass), the Committee can recommend it, but the Board must own the "Catastrophic vs. Catastrophic" trade.
  *   **Action:** Committee recommends approval. Minute records that the "Clinical Relationship" was explicitly overridden by "Expected Benefit" and that this constitutes a Catastrophic/Catastrophic trade authorized by published protocol.

  ---

  ### Limitations and Audit Instructions

  You asked for honesty about where this procedure relies on judgment rather than theory, and how to prevent gaming.

  **1. Inputs Set by Judgment**
  The Protocol does not generate its own moral values; it tests the consistency of yours. Three inputs require committee judgment:
  *   **Definition of "Catastrophic":** Is loss of a limb catastrophic? Is permanent dialysis catastrophic? The committee must define this once per year and record it. Do not decide it case-by-case, or you will game it.
  *   **System Integrity Claims:** In Step 2, claiming "bankruptcy" to justify a loss is easy to fake. The Finance Director must verify any claim that "not doing this collapses the system."
  *   **Statistical vs. Identified:** In Case 2, the "losers" of the nurse service are statistical. The Protocol protects the identified. This is a bias. It privileges the "rule of rescue." You must accept this bias as the cost of protecting separateness.

  **2. Vulnerability to Re-description (Gaming)**
  A clever chair can game Step 3 (Unit Audit) by describing benefits as "Person-Units" when they are actually "Slot-Units."
  *   *Counter-measure:* The Lay Member's specific role in this Protocol is to veto the Unit Description. If the Lay Member says, "That sounds like a slot, not a person," the description defaults to "Slot" unless unanimously overruled. This empowers the non-clinical voice to check clinical abstraction.

  **3. The "Emergency Bypass"**
  You cannot run this in a code blue.
  *   *Rule:* In genuine emergencies, clinicians act on best interest. The Protocol is applied *retrospectively* to any emergency decision where resources were diverted from one identified patient to another. If the Protocol returns a "No" retrospectively, the clinical team is not punished, but the *policy* that forced the choice must be reviewed by the Board.

  **4. The Audit Minute**
  To satisfy the Board that the check was run without reading transcripts, the committee minute must contain a specific **Separateness Box**:
  *   *Identified Loser:* [Name/Class]
  *   *Addressability Sentence:* [Verbatim text]
  *   *Unit Type:* [Person / Slot]
  *   *Ratification:* [Yes / No / Protocol Ref]
  *   *Loss Severity:* [Catastrophic / Non-Catastrophic]
  *   *Outcome:* [Proceed / No / Hand-off to X]

  If the Box is empty, the decision is procedurally invalid.

  ### Why This Works for Your Context

  This procedure accepts your current arithmetic method but builds a fence around it. It acknowledges that cost-effectiveness is valid *until* it requires sacrificing an identified person for a diffuse sum.

  It defends the **Ratified-Pool** test as you suspected: aggregation is morally easier when people have opted into the pool (insurance, trial, published triage protocol). It breaks, as you feared, for those who cannot consent, which is why the **Concentration Threshold** acts as the safety net for the vulnerable. If they didn't consent, you cannot take their life for a sum of minor gains.

  It forces the **Addressability** issue. You can no longer write a rationale that says "Total QALYs gained = 50." You must write "We asked Mr. Smith to accept X because Y." If Y is "others gained," the sentence fails the test. This makes the rationale human-readable for the family, satisfying your first audience, while the Audit Box satisfies the Board's need for process.

  Finally, it creates honest **Hand-off Points**. By sending "Catastrophic vs. Catastrophic" decisions to the Board, you protect the Committee from being the moral scapegoat for tragic choices, while retaining authority over procedural justice. The Board wants value for money; this procedure tells them exactly where value for money requires a moral cost they must own.
