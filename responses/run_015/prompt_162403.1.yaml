  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | **Boundary Invariance:** Membership conditions must not change when administrative definitions change without a change in the subject's properties. | The birth-year band that is a Millennial on one organization's definition and Gen X on another's, so that the same person changes kind without changing any property. | Naive realism about marketing categories; any theory treating cohort as a fixed natural property of birth date alone. | Non-negotiable | 4, 5 |
  | 2 | **Causal Identifiability:** The theory must specify how cohort causality is mathematically or conceptually separable from age and period effects. | The fact that cohort effects are not separately identifiable from age and period effects without extra assumptions, since cohort is fixed once age and period. | The license to include cohort as an independent causal variable in standard regression models without strong structural assumptions. | Non-negotiable | 6, 7 |
  | 3 | **Historical Specificity:** The kind must track exposure to shared formative events rather than merely tracking calendar time across distinct geopolitical contexts. | The Anglophone labels being exported to populations whose formative events — a war, a currency collapse, a draft, a one-child policy — sort birth years into entirely different groupings. | Universalist claims that "Gen Z" is a global natural kind rather than a regionally specific historical classification. | Costly to drop | None |
  | 4 | **Experiential Grounding:** Kind membership must depend on the completion of formative experiences rather than on birth date alone. | A label attached to people while they are still children, before the experiences said to constitute the cohort have occurred. | Predictive essentialism; the view that cohort traits are innate or determined at birth rather than acquired. | Camp preference | 1, 5 |
  | 5 | **Ontological Independence:** The kind's existence and boundaries must not depend primarily on the discourse that names and describes it. | The feedback case: coverage of a generation's supposed traits changing how its members act and self-describe, which seems to make the kind causally efficacious and also seems to make it an artifact of the discourse about it. | Pure constructivism; the view that the label creates the reality it describes (looping kinds). | Costly to drop | 1, 4 |
  | 6 | **Scale Justification:** The temporal width of the cohort must be justified by the duration of the proposed socializing mechanism rather than arbitrary convention. | The grain question — why roughly decade-scale bands rather than three-year or thirty-year ones, and what it would take for a finer or coarser grain to be the right one. | Arbitrary periodization; the use of 15-year bands solely for data smoothing or journalistic rhythm. | Non-negotiable | 2 |
  | 7 | **Relational Distinction:** The theory must distinguish cohort membership from kinship lineage to avoid conflating historical position with familial position. | The contrast between the cohort sense of generation and the lineage sense, where generational position is a relation within a family rather than a property of a birth band. | Biological reductionism; the assumption that "generation" implies a biological or familial replication cycle. | Camp preference | None |

  ### (a) Unsatisfiable subsets
  The most critical tension exists between **Boundary Invariance (1)**, **Experiential Grounding (4)**, and **Ontological Independence (5)**. If you insist that boundaries are invariant (1), you must ignore that individual experiences vary wildly within a birth band (4). If you acknowledge that media discourse shapes the behavior of the cohort (5), you surrender Ontological Independence, because the kind is now partially constituted by the label itself. To resolve this, I would drop **Ontological Independence (5)** as non-negotiable. Social kinds are often "interactive kinds" (in Ian Hacking's sense) where the classification changes the classified; demanding they be mind-independent like chemical elements sets a bar that almost no social category can clear. We should accept they are real *social* kinds without requiring them to be *natural* kinds.

  ### (b) The load-bearing requirement
  **Causal Identifiability (2)** excludes the most candidate theories. Most popular and journalistic theories of generations rely on observing correlations between birth year and attitude. However, because Age, Period, and Cohort are linearly dependent (Cohort = Period − Age), you cannot statistically isolate the cohort effect without imposing arbitrary constraints (e.g., assuming age effects are zero after a certain point). Any theory that claims generations are causal mechanisms but cannot solve the identification problem fails the primary test for decision (i): it is not licensed for causal modeling. This requirement does the heaviest lifting in distinguishing a rigorous sociological theory from a journalistic convenience.

  ### (c) What we were each assuming
  Your friend's appeal to cohort effects in the data implicitly presupposed **Causal Identifiability (2)** was already solved or negligible; she assumed that because a correlation exists, a distinct cohort mechanism must be the cause, ignoring the APC confound. Your appeal to shifting boundaries implicitly presupposed **Boundary Invariance (1)** is a necessary condition for reality; you assumed that if the definition is fluid, the thing defined cannot be real. Neither of you was demanding something illegitimate, but you were arguing across domains: she was arguing from *predictive utility* (does it correlate?), while you were arguing from *ontological stability* (is it a fixed thing?). The dispute stalled because utility does not guarantee stability, and stability is not required for utility.

  ### (d) Verdict, in one sentence only
  Generations are not real kinds in the sense required for causal modeling, primarily because they fail the **Causal Identifiability** test, though they remain useful interactive classifications for ordinary conversation.
