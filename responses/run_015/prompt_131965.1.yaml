      The development of ISOTYPE does not resolve this tension; rather, it exposes the incompatibility between the picture-language project and the reductionist demands of physicalism. ISOTYPE demonstrates that visual representation is always mediated by conventions. Instead of providing a transparent window onto physical reality, pictures function as tools for education and engineering. This insight aligns with Neurath's later coherentism but contradicts the physicalist hope that protocol sentences could serve as unambiguous, reductionist anchors for scientific truth. The *Bildersprache* reveals that the quest for a direct, ambiguity-free representation of reality is untenable, even within a physicalist framework.

