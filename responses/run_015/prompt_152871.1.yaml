      *   *PP Translation:* Emotions are high-level *priors* in the generative model that encode value-laden expectations about hidden causes in the environment. A "judgment" is a posterior belief resulting from inference.
      *   *Mapping:* "Judgment" $\rightarrow$ High-level posterior belief / Prior expectation. "Evaluation" $\rightarrow$ Precision weighting based on utility/allostatic relevance.
      *   *Twisting:* Judgments are usually conscious and propositional ("I judge that X is bad"). PP priors are often sub-personal and probabilistic. Need to equate "propositional content" with "structured latent causes."
