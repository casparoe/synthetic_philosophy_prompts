      *   *Key Variables:* Priors (beliefs), Likelihoods, Posteriors, Precision (gain control/attention), Prediction Errors (PE).
      *   *Interoception:* Inference about the physiological state of the body for allostasis (regulating energy expenditure).
      *   *Emotion (in PP):* Often viewed as high-level priors about interoceptive states that drive action to maintain homeostasis/allostasis, or as precision-weighting policies over sensory channels.

  3.  **Drafting Translation 1: Emotions as Judgments (Nussbaum/Solomon)**
