answer: |-
  Your instincts are excellent. You have spotted a mix of solid scholarship, anachronistic interpretation, and a biographical fallacy. A Hobbes specialist would agree with about 60% of that passage, reject the ontological claims about geometry, and roll their eyes at the conclusion drawn from the circle-squaring incident.

  Here is a breakdown of what is fair, what is distorted, and why the "castle in the air" conclusion is bad historiography.

  ### 1. What the Passage Gets Right (The Fair Parts)

  **The "Construction" Thesis:**
  The passage is correct that Hobbes believed geometry is certain because we construct the objects. For Hobbes, to have *scientia* (scientific knowledge) of something, you must know its cause. In geometry, the cause of a circle is the motion of the line that generates it. Since we stipulate that motion, we know the cause perfectly. In physics (natural philosophy), we usually see the effect (e.g., a stone falling) and have to guess the cause (gravity? magnetism? impulse?), so physics is inherently less certain than geometry.

  **Genetic Definitions:**
  It is also correct that Hobbes insisted on "genetic" definitions. He criticized Euclid for defining a point as "that which has no part" (a static description) and preferred to think of it as the end of a moving line. For Hobbes, all reality is matter in motion; therefore, geometric definitions should reflect generation by motion.

  **The Politics Analogy:**
  This is the strongest part of the passage. Hobbes explicitly argues in *De Cive* and *Leviathan* that civil philosophy (politics) can be as certain as geometry. Why? Because just as we construct geometric figures, **we construct the Commonwealth.** We are the cause of the state's existence through the social contract. Therefore, we can have certain knowledge of it, unlike our knowledge of nature (where God is the cause, and His ways are hidden). The passage is right to link his geometric method to his political project.

  ### 2. Where the Passage Slides into Distortion

  **"True by Convention / Tells Us Nothing About Nature":**
  This is the most problematic claim. It sounds like the author is projecting 20th-century logical positivism or formalism (the idea that math is just a symbol game) onto Hobbes.

  *   **Hobbes was a Materialist:** You are right to trust your prior knowledge here. For Hobbes, there is no realm of "abstract forms" separate from reality. Geometry is the study of *quantity* and *figure*, which are universal "accidents" of all bodies. Therefore, geometry is not a game detached from nature; it is the **foundational language of physics.**
  *   **Nominalism vs. Conventionalism:** Hobbes was a nominalist. He believed that "truth" resides in propositions (language), not in things. So, in a specific sense, he thought truths are dependent on the correct use of names (conventions). *However*, saying geometry "tells us nothing about nature" is wrong. Hobbes believed geometry describes the necessary spatial properties of the material world. It is certain *because* we define the terms, but it applies *because* the world is made of bodies that occupy space.
  *   **The "Game" Metaphor:** Describing it as a "game played with our own rules" implies arbitrariness. Hobbes would argue the rules are arbitrary (we choose to define a line this way), but the consequences are **necessary**. Once you define the generation of a circle, you cannot arbitrarily decide its properties. The necessity is real, not ludic.

  **Why the author likely wrote this:**
  The author is trying to explain how Hobbes bridges the gap between "made-up definitions" and "certain truth." But they oversimplify Hobbes's nominalism into a modern "conventionalism," stripping geometry of its physical reality in Hobbes's system.

  ### 3. The Circle-Squaring Incident (The Overreach)

  **The Facts:**
  Late in life (1650s–1660s), Hobbes became obsessed with the problem of squaring the circle. He published several flawed proofs. John Wallis, the Savilian Professor of Geometry at Oxford, systematically debunked him. The feud became personal and nasty, involving accusations of incompetence on both sides.

  **The Historiographical Error:**
  The passage concludes that this episode shows Hobbes's epistemological project was a "castle in the air." This is a **genetic fallacy** (or *ad hominem* reasoning).

  *   **Competence vs. Framework:** A philosopher can have a robust theory of knowledge while being bad at doing the specific math. Einstein was wrong about quantum mechanics ("God does not play dice"); that doesn't mean his epistemology of physics was a "castle in the air."
  *   **Hubris, not Falsehood:** The incident proves Hobbes was arrogant and perhaps past his prime mathematically. It does not prove that his claim—"knowledge is certain when we know the causes we created"—is false.
  *   **Context:** Historians (like Shapin and Schaffer in *Leviathan and the Air-Pump*) use the Wallis-Hobbes feud to show the struggle over *what counts* as knowledge in the Royal Society, not to dismiss Hobbes's philosophy entirely.

  ### 4. How a Specialist Would Summarize It

  A Hobbes specialist would likely summarize the situation like this:

  > "Hobbes sought to model civil philosophy on geometry because both deal with objects whose causes are known to the knower (since we construct them). While Hobbes was a materialist who viewed geometry as the science of bodily quantity, his nominalism led him to locate certainty in the correct manipulation of definitions. His later failure to square the circle demonstrates his personal mathematical limitations and his refusal to accept peer review, but it does not invalidate his broader epistemological claim that 'demonstrative knowledge' requires constructive causes."

  ### 5. Recommended Reading

  If you want to check this against better sources, these are the standard works that handle this nuance correctly:

  1.  **Steven Shapin and Simon Schaffer, *Leviathan and the Air-Pump* (1985):** Specifically the chapters on the Hobbes-Boyle and Hobbes-Wallis disputes. It treats the circle-squaring as a sociological battle over scientific authority, not a refutation of Hobbes's philosophy.
  2.  **Noel Malcolm, *Aspects of Hobbes* (2002):** Malcolm is perhaps the leading contemporary Hobbes scholar. He takes Hobbes's mathematics seriously without excusing his errors.
  3.  **Tom Sorell, *Hobbes* (1986) or *The Cambridge Companion to Hobbes*:** Good for clarifying the materialist/nominalist tension.
  4.  **Patricia Springborg (ed.), *The Cambridge Companion to Hobbes's Leviathan*:** Contains essays specifically on his science and mathematics.

  ### Verdict
  Your suspicion is well-founded. The passage is **pedagogically useful but philosophically sloppy.** It correctly identifies Hobbes's motivation (certainty via construction) and his political analogy, but it misrepresents his ontology (geometry as detached from nature) and uses his mathematical failure as a cheap way to dismiss his philosophical system. It's a "popular history" shortcut that sacrifices accuracy for a punchy ending.

  **Summary for your notes:**
  *   **Geometry as certain because we construct it:** True.
  *   **Politics is certain because we construct the State:** True.
  *   **Geometry is a "game" detached from nature:** False (Hobbes was a materialist).
  *   **Failed quadrature invalidates his epistemology:** False (Biographical fallacy).

  You are reading the text critically, which is exactly what a historian of science should do. Keep trusting that instinct.
