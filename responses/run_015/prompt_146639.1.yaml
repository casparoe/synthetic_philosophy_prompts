answer: |-
  There is no single canonical term for this specific methodological inconsistency, though it constitutes logical special pleading within hermeneutics. Unlike general anti-intentionalism, which uniformly rejects authorial biography, this approach selectively invokes the speaker-author distinction solely to neutralize contradictory evidence while accepting biographical readings when convenient. It differs from ordinary ambiguity resolution because it lacks consistent criteria for distinguishing persona from person, functioning instead as an ad hoc rescue device. I propose labeling this practice "selective intentionalism." This captures the asymmetrical application of critical frameworks where the author is summoned to validate preferred readings but dismissed to invalidate inconvenient ones, undermining analytical integrity by prioritizing confirmation over consistent methodology.
