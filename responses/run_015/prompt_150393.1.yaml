  10. **Final Polish:** Structure into: 1. Diagnosis of the Intuition, 2. The Proposed Principle, 3. Stress Testing (Case 4), 4. The Cognitive Limit Scenario, 5. Recommendation for the Project. (Proceed to generate output).

  *(Self-Correction on Case 3)*: Case 3 involves risk. Expected Utility would say 1% of Torture might be less than 100% of Dust Specks if the disutility of torture isn't *infinitely* worse. The user prefers avoiding the risk. This supports the Lexical view (even a small probability of a lexical violation outweighs certainty of non-violations).

  *(Self-Correction on Case 4)*: This is the hardest one. 10,000 years of pain is a lot. If the principle is "Quality over Quantity," it holds. If the principle is "Threshold of Total Suffering," it fails. I need to help the user distinguish these.

