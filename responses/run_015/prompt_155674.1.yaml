  4. A: These structural constraints are merely procedural guardrails that allow the system to function agnostically, avoiding the paralysis of undefined human preferences.
  B: Procedural neutrality is impossible here because choosing which guardrails to install determines whether the bacteria survive the thermal correction or perish as collateral damage.

  5. A: Even if hidden judgments exist, the definition remains coherent for low-impact goals because it successfully limits catastrophic deviation without specifying a telos.
  B: But limiting deviation only makes sense relative to a baseline, and selecting the thermal equilibrium as that baseline implicitly assigns value to stability over biological flux.
