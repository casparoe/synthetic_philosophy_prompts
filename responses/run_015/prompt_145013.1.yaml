  3. Conscious processing does not conclude at a specific spatiotemporal finish line where content becomes definite. This is an empirically loaded claim about cognitive architecture, used to dismiss reports by arguing the subject cannot pinpoint when an experience actually occurred.
  4. Subjective experience consists of distributed, competing narrative fragments rather than a single stable stream. This is an empirically loaded claim about cognitive architecture, used to dismiss reports by characterizing them as post-hoc confabulations rather than direct observations.
  5. There is no unified phenomenal narrative that exists fully formed at any given instant of time. This is a substantive claim often regarded as false, used to dismiss reports by denying the subject's authority over the synchronic structure of their experience.
