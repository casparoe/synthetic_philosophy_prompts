      *   *(b) The Diverging Feature:*
          *   *Feature:* **Diachronic Identity vs. Membership Turnover.**
          *   *Essential or Quirk?* Essential. Individual precommitment relies on the persistence of the agent. Collective precommitment involves a changing composition of agents. This is the "Dead Hand" problem. It's not a quirk; it's fundamental to the ontology of groups vs. persons.

      *   *(c) Tweaking the Constitution:*
          *   *Fix:* Add a sunset clause or an amendment procedure that requires less than unanimity (e.g., supermajority).
          *   *Analogy:* Does this break the analogy? Yes, because individuals don't usually have "amendment procedures" for their own will (except therapy/time). If Mara could just "vote" to release the lock easily, it's not a precommitment. So, fixing the legitimacy problem weakens the precommitment strength, breaking the structural analogy.

  5.  **Refining the Output:**
      *   Make sure the scenario is tight (one paragraph).
      *   Ensure the reasoning draws on Elsterian concepts (akrasia, time inconsistency) but also political theory (consent, legitimacy).
      *   Check constraints: No nation-states. (Co-op is fine).
      *   Check verdicts: Individual = Binding. Collective = Not Binding.

      *(Self-Correction during drafting)*: I need to make sure the "temptation" is truly a *temptation* (short-term gain, long-term pain) in both cases, not just an accident.
      *   *Revised Scenario:* The co-op bans "high-risk clients" to protect culture. New members want to take a high-risk client to save the business.
      *   *Actually, the social media/penalty one is cleaner for "mechanism."* Let's stick with the financial penalty for a specific action.
      *   *Wait, one nuance:* If the co-op members *voluntarily* joined knowing the rule, is it binding? Yes, contractually. So the scenario *must* involve new members who didn't fully consent or conditions changed such that the rule is now destructive.
      *   *Better:* The "Emergency Override."
      *   *Individual:* Ulysses ties himself. He hears sirens. He stays tied.
      *   *Collective:* Ship crew ties captain. Storm hits. Crew should untie him.
      *   *Why?* Because the crew's survival is at stake and they are distinct agents.
      *   *Let's try to match the prompt's "structural analogy" more closely.*
      *   *Scenario:*
          **Scenario:** Elias, a writer, uses a software lock that deletes his draft if he visits news sites before 5 PM to prevent procrastination; analogously, a small architectural firm's founding partners encode a governance rule that automatically dissolves the partnership if the firm ever accepts a government contract, intended to prevent mission drift toward bureaucratic work. Five years later, Elias feels the urge to read the news to avoid a difficult paragraph, while the firm, now staffed mostly by junior architects who joined after the rule was set, faces bankruptcy unless they accept a specific municipal redevelopment grant that requires a standard government contract. Elias ought to let the draft be deleted rather than unlock the software, but the junior architects ought to vote to override the dissolution clause and accept the grant.

      *   *Analysis:*
          *   (a) Elias: Self-regarding, identity continuity. Firm: Heterogeneous interests, new members didn't consent to "suicide pact."
          *   (b) Feature: **Composition Stability.** Essential distinction.
          *   (c) Fix: Amendment clause. Breaks analogy because it reduces the "bind."

  6.  **Final Polish:** Check tone. Academic but accessible. Ensure Elster is referenced implicitly or explicitly where helpful (Ulysses, time inconsistency). Ensure the "normative force" argument is clear.

