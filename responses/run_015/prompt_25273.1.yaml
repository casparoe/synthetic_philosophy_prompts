answer: |-
  **Scenario**
  Consider a recovering addict, Jonas, who installs a biometric lock on his home safe that denies him access to his cash savings for 12 months to prevent relapse-funded binges; structurally analogous is a vegan food co-op's founding board encoding a bylaw that permanently bans the sale of any non-organic products, enforced by an automatic forfeiture of the co-op's operating reserve if violated, to prevent profit-driven mission drift. Two years in, Jonas craves a binge and could easily override the lock if he chose to break it, while the co-op, now run by a completely new set of member-owners who purchased their shares after the bylaw passed, faces a supply chain crisis where selling a specific non-organic staple is the only way to keep the store solvent. Jonas ought to respect the lock and endure the craving, but the new co-op members ought to vote to sell the staple and ignore the forfeiture clause.

  **(a) Normative Justification**
  In Jonas's case, the normative force derives from **diachronic autonomy**. Following Elster, the precommitment is justified because it resolves a time-inconsistency problem within a single agent: Past-Jonas (sober, rational) is protecting the interests of Future-Jonas (vulnerable to akrasia) against a transient passion. Because the agent is identical over time, the "binding" is an act of self-governance; breaking it would be a failure of autonomy. In the co-op's case, the normative force fails because of **democratic legitimacy and consent**. The founding board is not identical to the current membership. By enforcing the forfeiture clause, the founders are not binding their own future selves, but rather binding *different* people who did not consent to that specific constraint. While Jonas has a duty to his own long-term welfare, the new co-op members have a primary duty to the organization's survival and their own economic agency, which outweighs the "dead hand" control of predecessors who are no longer stakeholders.

  **(b) The Diverging Feature**
  The feature that makes them come apart is **compositional stability** (or the persistence of the agent). In the individual case, the binder and the bound are ontologically the same entity; in the collective case, the binder (founders) and the bound (current members) are distinct entities with potentially divergent interests. This is not a quirk of this specific co-op scenario but is **essential to the individual/collective distinction**. Individual precommitment relies on the metaphysical continuity of personal identity to justify why the past self has authority over the future self. Collective precommitment lacks this continuity unless membership is perfectly static (which is empirically rare and normatively undesirable in free associations). Therefore, the "Ulysses" analogy breaks down whenever group turnover occurs, because the "self" being bound has fundamentally changed.

  **(c) Tweaking the Constitution**
  A defender of constitutional precommitment could fix the legitimacy problem by adding a **supermajority amendment clause** (e.g., "This ban can be lifted if 75% of current members agree"). This restores legitimacy by allowing current members to release themselves from the bind if they collectively deem it necessary. However, this **breaks the structural analogy** to the Ulysses contract. The point of Ulysses tying himself to the mast was to make the temptation *impossible* or prohibitively costly to act upon, even if he wanted to. By adding an amendment clause, the collective precommitment becomes a "gentlemen's agreement" rather than a true bind; it transforms the mechanism from *precommitment* (removing choice) to *decision rule* (changing the cost of choice). Thus, you can fix the normative problem of binding others, but only by sacrificing the very rigidity that makes it a Ulysses-style precommitment in the first place.
