answer: |-
  ### Q&A Prep Sheet: Reciprocal Priority Credit

  **Context:** 20-min talk, 25-min Q&A. No philosophers.
  **Goal:** Move from "Is this morally permissible?" to "Is this administratively viable?"

  ---

  ### I. Strategic Concessions (Slide 1 & 2)
  *Do not wait for them to force these. Put them up front to disarm the room.*

  1.  **Concede the Data Gap:** Explicitly state: "I do not have elasticity numbers. I cannot tell you exactly how many extra kidneys this yields. If this requires a precise ROI before piloting, it will never launch."
      *   *Why:* Pre-empts the Health Economist's first strike and signals you aren't selling a miracle.
  2.  **Concede the "Market" Label:** "If calling this a 'market' makes it legally or ethically toxic, I am happy to call it a 'reciprocity protocol.' The mechanism matters more than the noun."
      *   *Why:* Gives the Ethicist and Surgeon cover. It signals you care about implementation, not semantic victory.
  3.  **Concede Inequality Risks:** "This system relies on donors having someone to name. It may advantage those with social ties over the isolated. I acknowledge this is a distributive concern, not a solution to one."
      *   *Why:* Disarms the Patient Advocate. If you admit the flaw, she doesn't have to discover it to attack you.

  ---

  ### II. The Six Objections (Ordered by Damage Potential)

  #### 1. The Patient Advocate (Highest Damage)
  **The Objection:** "I spent four years on dialysis watching people die because they didn't have the 'right' connections. You're telling me a donor can jump the line by naming a favorite? That turns the deceased list into a networking game. It punishes the lonely."
  **The Reply (60–90s):** "You're right that the deceased list must remain a place of last resort for the urgent, not the connected. That's why the credit only moves a patient *within* their existing medical band. If your match quality and urgency are low, a credit doesn't bump you over someone who is dying tomorrow. It only helps when you are medically identical to someone else. It doesn't change *who* gets saved based on urgency, it breaks ties based on reciprocity. I agree the lonely are disadvantaged, but currently, the lonely also die waiting. This gives the connected a reason to donate to help the unconnected get organs."
  **The Soft Spot:** You are asserting that "within band" allocation is ethically neutral. She may argue that *any* non-medical tie-breaker is corruption. You have no empirical proof that "within band" is safe from gaming.

  #### 2. The Health Policy Guy (Hard Stop)
  **The Objection:** "Under NOTA (National Organ Transplant Act), 'valuable consideration' for an organ is a felony. HHS interprets that broadly. If a court decides this credit has monetary value, you've turned the Chair into a felon."
  **The Reply (60–90s):** "I've consulted the statutory language. 'Valuable consideration' usually implies transferable wealth or property. This credit is non-transferable, non-saleable, expires in ten years, and cannot be inherited. It functions more like a 'priority token' in a closed system than an asset. We would need an OIG advisory opinion, but the design is specifically built to avoid the definition of property. It's a status change, not a payment."
  **The Soft Spot:** You are asserting a legal interpretation without being a lawyer. If HHS has cracked down on similar 'priority' schemes in other contexts, you might be wrong. This is the binary kill-switch.

  #### 3. The Surgeon/Chair (Optics Risk)
  **The Objection:** "I believe you, but the headline writes itself: 'Hospital Pays Donors with Priority Tickets.' I can't defend this if the press says we're auctioning kidneys."
  **The Reply (60–90s):** "The headline is the real risk. That's why the framing must be 'Community Reciprocity,' not 'Donor Rewards.' We don't market this to the public as a benefit; we administer it as a recognition. Also, because there is no cash, it's harder to sensationalize than a $50,000 check. But I agree: if we launch, it needs to be quiet, evaluated internally, and framed as a pilot for living donor *protection*, not deceased list *manipulation*."
  **The Soft Spot:** You are asking him to trust a semantic framing against a hungry press. You can't guarantee the optics.

  #### 4. The Nephrologist (Utility/Integrity)
  **The Objection:** "My job is to maximize graft survival. If I move Patient B up because of a credit, but Patient A has a slightly better HLA match, I am knowingly worsening medical outcomes. I won't sign off on that."
  **The Reply (60–90s):** "I'm not asking you to violate match quality. The credit applies only within the *same* match-and-urgency band. If Patient A is a better match, they are in a higher band. This credit only functions as a tie-breaker when the medical utility is effectively equal. It doesn't ask you to transplant a worse kidney; it asks you to choose between two medically equivalent recipients based on who supported the system."
  **The Soft Spot:** You are assuming "bands" are wide enough for this to matter but narrow enough to be medically safe. If their bands are very tight, the credit is useless. If they are wide, outcomes might suffer.

  #### 5. The Clinical Ethicist (Motivation)
  **The Objection:** "You say this isn't a market, but it introduces a quid pro quo. It corrupts the 'gift' relationship. Donors should give freely, not to bank favors. This crowds out altruism."
  **The Reply (60–90s):** "I share the worry about crowding out. But we already crowd out altruism by making donation financially punitive—lost wages, travel costs, insurance gaps. We ask for a gift but impose a tax. This isn't a payment; it's insurance against the risk of donation. It aligns the donor's interest with the community's. It's not 'I give so I get,' it's 'I give, and the community promises not to let me drown if I sink.'"
  **The Soft Spot:** You are asserting that "reciprocity" doesn't feel like "payment" psychologically. There is literature on motivational crowding-out you are hand-waving away.

  #### 6. The Health Economist (Feasibility)
  **The Objection:** "What's the elasticity? If only 5% of donors use this, but the administrative cost is high, you've added bureaucracy for zero supply shock. Do you have a model?"
  **The Reply (60–90s):** "I don't have a model, and I won't fake one. My hypothesis is that the *option value* matters more than the *exercise value*. People might donate because the safety net exists, even if they never use it. But you're right: without a pilot, we don't know the magnitude. I'm proposing this as a mechanism design to be tested, not a policy to be scaled tomorrow."
  **The Soft Spot:** You are asking them to spend resources on a pilot with no guaranteed yield. She will view this as inefficient.

  ---

  ### III. Handling the Economist (Specific Strategy)
  When she presses for effect sizes:
  *   **Do not bluff.** If you guess a number, she will dismantle it and your credibility goes with it.
  *   **The Pivot:** "The literature on paid donation suggests high elasticity, but high ethical cost. The literature on pure altruism suggests low elasticity. We are in the middle. I can't give you a number, but I can give you a *condition*: If the administrative cost per donor is less than the cost of one year of dialysis, and we get even a 2% increase in living donation, it breaks even. I need your help to build that model, not my speculation."
  *   **Why:** It turns her from an adversary into a collaborator. It acknowledges her expertise without exposing your ignorance.

  ---

  ### IV. The Single Reply That Must Land
  **Target:** The Patient Advocate.
  **Reason:** The Surgeon is "terrified of how this looks." The Patient Advocate *defines* how it looks to the public. If she says "This exploits the desperate," the Surgeon will veto it to protect the hospital's reputation. The Policy guy can find legal workarounds; the Ethicist can be debated; but if the patient voice says "This hurts people like me," the room will close ranks.
  **The Core Message:** "This does not allow the rich to buy kidneys. It allows the generous to secure safety nets. It protects the donor, not the buyer."
  **Execution:** Maintain eye contact. Do not use philosophical terms. Speak to her dialysis experience. Acknowledge the fear that the system is rigged.

  ---

  ### V. The Question You Hope Nobody Asks
  **The Question:** "If I donate a kidney and name my brother as my designee, and five years later he needs a kidney, isn't that just a directed deceased-donor transplant arranged through a backdoor? Haven't I just bypassed the waitlist for my family member?"
  **Why it's dangerous:**
  1.  **Equity:** It confirms the Advocate's fear that this is for the "connected."
  2.  **Utility:** It suggests the credit will be used for family clustering, which might violate blood type distribution norms.
  3.  **Optics:** It sounds exactly like "buying a kidney for your brother."
  **Preparation:**
  *   *If asked:* "It is a directed priority, yes, but only within the constraints of blood type and match compatibility. He still has to be on the list. He still has to be sick. He doesn't get a kidney from thin air; he gets one from the pool that was available that day. It's not a bypass; it's a tie-breaker. But I concede: we would need to cap how many credits can be applied to a single family to prevent hoarding."
  *   *Note:* This is a weak point. Be prepared to concede a "family cap" limitation immediately.

  ---

  ### VI. General Tone Notes
  *   **Avoid:** "Commodification," "Repugnance," "Normative Framework," "In-kind transfer."
  *   **Use:** "Safety net," "Tie-breaker," "Administrative pilot," "Donor protection."
  *   **Body Language:** When the Surgeon looks worried, stop talking and nod. When the Advocate speaks, lean in. When the Economist asks for data, open your hands (gesture of honesty).
  *   **Closing:** "I know this is uncomfortable. Organ donation is uncomfortable. But doing nothing is also a policy choice. I'm asking for permission to test if this specific mechanism makes the hard thing slightly easier."
