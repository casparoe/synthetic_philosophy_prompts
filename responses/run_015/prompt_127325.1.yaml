      *   **Conflict:** The committee is stuck on how to interpret the "ratings" provided by applicants and the ethical framework for decision-making.
      *   **Key Characters:**
          *   User (Narrator): Skeptical of aggregating ratings, sympathetic to the lottery (D), concerned about fairness and justification.
          *   Priya: Utilitarian approach (sum the ratings), favors C (Exhibition), rejects C because beneficiaries are mostly outsiders.
          *   Other Member: Maximin approach (help the worst off), favors C (because Maya gets *something*), ignores magnitude of benefit.
          *   Adviser: Suggested "Veil of Ignorance" (decide as if you had an equal chance of being any finalist).
      *   **The Options:**
          *   A: One full research placement. (Winner: 10, Others: 0). High impact, low coverage.
          *   B: Shared equipment. (4 get 3, 1 gets 0). Medium impact, medium coverage.
          *   C: School exhibition. (700 people get 0.2, including all 5 finalists). Low impact per person, massive coverage (mostly outsiders).
          *   D: Lottery for the placement. (1 gets 10, 4 get 0, but ex-ante equal chance). High impact, equal opportunity.
      *   **The Data Problem:** Ratings are incomparable (interpersonal utility comparison problem). One student uses 1-10, another uses all 6s, another uses qualitative text.
      *   **The Ethical Problem:** Utilitarianism (Priya) vs. Maximin/Rawlsian (Other Member) vs. Ex-ante Equality/Lottery (User) vs. School Mission (Priya's objection to C).
      *   **Specific Concern:** Maya (worst off) is not helped by A or B. C helps her negligibly. D gives her a chance.
      *   **Goal:** Resolve the ethical deadlock, validate the user's intuition about the numbers, and draft the one-paragraph justification.

