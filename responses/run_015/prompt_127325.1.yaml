      *   *The Paragraph:* Must not reveal the internal dysfunction. Must sound decisive.

  6.  **Final Polish:** Ensure tone is empathetic to a high school junior dealing with a heavy ethical burden. Use clear headings. Provide a concrete draft for the paragraph. (Make sure to explicitly answer the four questions at the end of the prompt).

      *   *Q1: Is the lottery really the worse option?* No, it's often the fairest when merit is indistinguishable.
