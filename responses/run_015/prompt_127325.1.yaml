      *   **Recommendation:** The committee needs to agree on *principles* before voting. They should likely reject C (drifts from mission, negligible benefit to finalists) and B (Maya gets nothing, less impact than A). The choice is between A (Merit/Impact) and D (Equality/Chance). Given the flawed ratings, D is ethically safer, but A is often more satisfying to donors. However, D *is* A with a fair selection mechanism.
      *   **The Paragraph:** Needs to be honest but diplomatic. Acknowledge the difficulty, state the principle chosen (fairness/opportunity), and affirm the value of the applicants.

