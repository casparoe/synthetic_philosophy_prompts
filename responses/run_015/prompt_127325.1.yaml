      *   *Q3: Are we entitled to combine these numbers?* No.
      *   *Q4: What should we settle before we vote?* The metric of value (impact vs. breadth) and the validity of the data.
      *   *Q5: What to put in the paragraph?* Focus on the intent of the gift and the fairness of the process.

  7.  **Final Review against constraints:** The user asked specific questions at the end. I need to make sure I answer them directly while weaving them into the advice. The paragraph draft is crucial.

