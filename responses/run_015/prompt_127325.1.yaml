          *   Option C: 100% chance of 0.2. EV = 0.2. (This is tiny compared to the placement value).
          *   Option D: 20% chance of 10, 80% chance of 0. EV = 2. (Same as A, but fairer process).
          *   *Correction on C:* The prompt says C helps 700 people at 0.2 each. But the Veil of Ignorance applies to *the five finalists* according to the adviser ("decide as if you had an equal chance of being any one of the five finalists"). If we restrict the Veil to the five, C is terrible (0.2 vs 2 or 2.4). If we expand the Veil to the *whole school*, C looks better utilitarian-wise, but violates the gift's intent (support *student projects*, usually implying the applicants).
      *   **Maya's Situation:** She is the "worst off."
          *   A: 0.
          *   B: 0 (Prompt says "only one student can hold" for A, and B gives "four of the five" benefit. It implies Maya is the excluded one in both, or at least in A. Actually, prompt says "Maya... is not served by A or B". So she gets 0 in both).
          *   C: 0.2.
          *   D: 20% chance of 10.
          *   *Maximin Critique:* The other member says Maximin selects C because 0.2 > 0. But is a negligible benefit better than a life-changing chance? This is the "tokenism" trap.
      *   **The Lottery (D):**
          *   Objection: "Cannot justify randomness to the four who lose."
          *   Counter: It treats ex-ante equality seriously. It acknowledges the incomparability of the ratings. It respects the intensity of the need (the placement) without playing god regarding who "deserves" it most based on flawed metrics.
      *   **The School Mission:** The gift is to "support student projects." Option C (Exhibition) benefits 700 people, mostly outsiders. Priya is right that this might drift from the intent, even if the "sum" is higher.

  3.  **Formulate the Advice:**
      *   **Validate the User:** Confirm their intuition is philosophically sound. The numbers *cannot* be added. This is a classic problem in welfare economics (utility is ordinal, not cardinal, and not interpersonally comparable).
      *   **Address the Lottery:** The objection to the lottery isn't about outcomes (A and D have the same outcome distribution), it's about *agency* and *responsibility*. A committee choosing a winner feels like judgment; a lottery feels like abdication. However, when judgment is impossible (due to bad data), the lottery is the only fair procedure.
