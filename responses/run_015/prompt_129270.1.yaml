answer: |-
  Here's a set of 10 prep questions. I've bolded the three mandatory ones with their follow-ups keyed to her likely responses. Kept the tone loose since these are just notes.

  **1. Thick Concepts & Description**
  You focus heavily on thick concepts like *cruel* or *brave*. If these aren't defeasible rules guiding us, what are they doing? Are they more like perceptual labels we slap on a situation once the "network" clicks into place, or do they actively help build the network itself?

  **2. [REQUIRED] The "Hidden Generality" Charge**
  I have to press on the terminology here: "Local coherence networks" sounds suspiciously like patterns. If a human can spot the pattern enough to act on it, isn't there *some* generalizable structure there? Why isn't this just a general principle that's really hard to write down, rather than no principle at all?
  *   **Follow-up (if she appeals to holistic perception/non-codifiability):** If it's truly non-codifiable because it's holistic, doesn't that make moral communication impossible? How do I explain *why* something was brave to you if I can't point to the rule or pattern I saw?

  **3. [REQUIRED] Epistemology & Error Correction**
  Let's talk about getting it wrong. In a rule-based system, I know I made a mistake because I violated the rule. In your framework, if there's no external standard, how do we spot errors inside a network? Is it just a feeling of dissonance, or is there a check mechanism?
  *   **Follow-up (if she says "mature judgment" or "shared sensitivity"):** Isn't that circular? If the only way to check the judgment is by using another judgment from the same network, how do we ever escape a local error? It seems like you've removed the safety rail.

  **4. [REQUIRED] Reason Holism (The Dancy Question)**
  Dancy argues reasons shift their moral valence depending on context (e.g., pleasure is good, unless it's sadistic). Does your "network" view make this shifting redundant? Like, does the network absorb the shift so the reason doesn't actually change weight, or does it just relocate the problem into the network structure?
  *   **Follow-up (if she says it relocates the problem to the network):** If the network determines the weight, isn't the network itself functioning as a mega-rule? What stops the network from being just a complicated principle we haven't mapped yet?

  **5. Moral Education & Novices**
  If practical wisdom isn't a black-box algorithm, how do we teach it? If I'm a moral novice, I can't see the "coherence network" yet. Do I have to learn rules first as scaffolding and then throw them away, or is there another way in?

  **6. Deep Disagreement**
  What happens when two people are operating from totally different local coherence networks? If there's no overarching principle to appeal to, is moral disagreement just a clash of intuitions? How do we resolve that without smuggling in a general norm?

  **7. The "Algorithm" Critique**
  You've said generalists treat wisdom like a black-box algorithm. But isn't there a risk on your end of making morality *too* mysterious? If we can't articulate the reasoning, does it just become "trust the expert"? That feels kinda elitist.

  **8. Role of Heuristics**
  Even if you're right that principles aren't foundational, do generalizations have *any* utility? Like, can we use rules as rough heuristics or placeholders, even if they aren't ultimately what makes the action right? Or is even that dangerous?

  **9. Emotion & Perception**
  Where do emotions fit in these networks? Are they data points that help form the coherence, or are they the lens through which we see the network? I'm wondering if you're leaning towards a sentimentalist view without calling it that.

  **10. Practical Paralysis**
  Last one: Does this view slow us down? If I have to assess the whole local coherence network before acting, rather than checking a few key rules, do I risk paralysis? How do you handle urgent moral decisions?
