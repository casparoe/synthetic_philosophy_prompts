          *   *Verdict:* Dev is partially right about trust, but Marta is likely right that the *nature* of the property differs.

      *   **(2) Marta (Prediction vs. Verdict):** Marta argues the critic offers a prediction of Dev's reaction, not a verdict on the object's value.
          *   *Strength:* Captures the subjective/experiential nature of art.
