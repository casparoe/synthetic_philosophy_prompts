      *   **Context:** Two roommates (Dev and Marta) arguing about aesthetic testimony.
      *   **The Core Issue:** Can you legitimately claim a work of art is a "masterpiece" based *only* on a trusted critic's say-so, without experiencing it yourself?
      *   **The Task:** Analyze the six specific moves in their dialogue, evaluate the analogies (mechanic, restaurant, destroyed record), and integrate the user's own insight (the "listen-for-it" point) to determine who is right, where they went wrong, and if they carved up the options correctly.

  2.  **Analyze the Six Moves:**

