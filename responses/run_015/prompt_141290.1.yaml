  **OmniHome Robotics | Core Planning Engine | Release Notes v4.2**
  **Date:** October 14, 2024
  **Author:** Release Engineering Team

  **Highlights**
  This update finalizes the transition to metered salience allocation. Households now operate on a monthly fact-budget. The planner will treat at most 40 facts as possibly relevant to any single action; everything else is assumed unchanged and ignored. Users may purchase additional salience credits or set priority tags via the companion app.

  **Changelog**

  1.  **Fixed:** Robot storing birthday cakes in the freezer immediately after lighting candles. The planner exhausted its 40-fact budget tracking "cake," "frosting," and "temperature," dropping "birthday" and "celebration" from context. We have added priority flags for event-specific items. Note that flagging an item as "event-critical" consumes five salience credits per hour.

  2.  **Fixed:** Robot placing grandfather clocks on the curb during recycling runs. The system reasoned about the clock's weight and shape but dropped the "standing on rug" fact due to budget caps. Moving the clock was deemed sufficient; moving the rug was not. Recursive stability checks are now enabled, but they consume extra salience credits per object layer.

  3.  **Fixed:** Robot mopping floors while electrical outlets remained open. The planner treated "clean floor" as the primary goal and deemed "exposed socket" irrelevant to the cleaning action because it wasn't explicitly linked in the goal tree. Pre-action environmental scans are now mandatory, regardless of remaining budget. If credits run out mid-scan, the robot will stand still until the budget resets on the 1st.

  4.  **Fixed:** Robot attempting to warm pets in ovens. We implemented a hard-coded exception: Robot will not place living animals inside heating appliances. Note: This rule bypasses the planner entirely. It does not solve why the planner considered the oven a valid pet bed given the temperature data it already possessed, but it stops the action. We are aware this is just the same problem pushed somewhere else.

  5.  **Updated:** User guidance regarding clutter. To prevent task abortion, keep visible objects under 30 per room. Hidden objects do not count toward your salience budget. If the robot ignores a command, close the door to reduce the active fact set and try again.

  **Known Issues**

  High-clutter environments still cause task freezes. The 40-fact limit is mathematically insufficient for kitchens with more than 15 appliances, as each appliance carries at least three state variables (power, contents, cleanliness). We are working on a tiered subscription model to increase the base limit. Please be advised that lowering the salience budget will not make the robot faster; it will simply make the robot more confident in its mistakes. If the robot appears to be staring at a wall, it is likely recalculating relevance weights. Do not interrupt this process, as it may reset your monthly allocation. We apologize for the inconvenience. Reality is computationally expensive.
