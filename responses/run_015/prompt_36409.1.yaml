answer: |-
  This is a wonderful question, and it cuts right to the bone of why philosophy of biology remains necessary even when the mathematics seems settled. You are right to be puzzled: if the Price equation allows us to partition selection covariance arbitrarily, and if the transformations between kin selection (inclusive fitness) and multilevel selection (MLS) are formally isomorphic in most standard cases, why the continued acrimony?

  Your hypothesis and your colleague's hypothesis are not mutually exclusive. In fact, the persistence of the debate is best diagnosed as a three-layered problem: a semantic ambiguity regarding the word "unit," a substantive disagreement about causal ontology (your colleague's point), and a divergence in explanatory aims (your point).

  Here is the diagnosis of the remaining disagreement.

  ### 1. The Semantic Layer: "Unit" is an Ambiguous Term
  Much of the heat comes from the fact that "Unit of Selection" was never a univocal term. In the 70s and 80s, when you were working, the Dawkins/Williams view won by redefining the terms. They distinguished between:
  *   **Replicators:** Entities that pass on their structure largely intact (genes).
  *   **Interactors:** Entities that interact with the environment such that replication is differential (organisms, sometimes groups).
  *   **Beneficiaries:** Who accumulates the adaptation?

  Dawkins argued that because only genes are replicators with high fidelity, they are the only true "units of selection." Everything else is a vehicle.

  Sober and Wilson (and later Okasha) revived the debate by shifting the definition. For them, a "unit of selection" is simply a biological entity at which there is variance in fitness that is heritable. If groups vary in productivity, and that variance is heritable (via fission or propagation of group traits), groups are units of selection.

  **Diagnosis:** A significant portion of the argument is indeed verbal. When a gene-centrist says "Groups aren't units of selection," they mean "Groups aren't *replicators*." When an MLS proponent says "Groups are units of selection," they mean "Groups are *interactors* with heritable variance." They are agreeing on the math but disagreeing on the label. However, if it were *only* this, the debate would have died down. It hasn't, which leads to the deeper layers.

  ### 2. The Ontological Layer: Causal Structure vs. Statistical Partition
  This is where your colleague is right: there is a metaphysical residue that mathematical equivalence does not dissolve.

  The Price equation is a statistical identity. It describes *change*. It does not, by itself, describe *causation*. You can partition the covariance between trait and fitness into "within-group" and "between-group" components mathematically. But does that partition map onto the causal structure of the world?

  *   **The Gene-Centric View:** Causation flows from the bottom up. The "group effect" is just an aggregate of individual gene effects interacting in a specific environment. To posit a group cause is to commit the fallacy of reification.
  *   **The MLS View:** Causation can be top-down or emergent. A group trait (e.g., swarm density, social structure) can constrain individual fitness in a way that is not reducible to the sum of individual genotypes.

  **The "Causal Joint" Argument:** Philosophers like Ellen Clarke and Samir Okasha have argued that while the *predictions* are equivalent, the *causal stories* are not. If you intervene on the group structure (e.g., break up the groups), does the evolutionary outcome change in a way that is best predicted by the group term in the Price equation? MLS proponents argue yes. Gene-centrists argue that any such intervention is just changing the environment of the genes.

  This is a substantive dispute about **causal granularity**. It is the difference between saying "The window broke because the stone hit it" (individual causation) vs. "The window broke because of the storm" (aggregate causation). Both are true, but one might be more explanatorily relevant depending on the context. The dispute persists because biologists want their models to reflect *causal mechanisms*, not just predict allele frequencies. If the math is equivalent but one formalism obscures the actual causal mechanism (e.g., by hiding a crucial group-level interaction inside a complex relatedness coefficient), biologists will fight over which formalism is "true."

  ### 3. The Explanatory Layer: Adaptation vs. Dynamics
  Your hypothesis is also correct: the sides are often answering different questions.

  *   **Inclusive Fitness (Kin Selection):** Excellent at answering "Why did this altruistic trait evolve?" It tracks the *cumulative benefit* to the gene. It is an accountant's view of the long-term ledger.
  *   **Multilevel Selection:** Excellent at answering "How is this social structure maintained?" It tracks the *current causal pressures*. It is a physicist's view of the forces acting on the system.

  The frustration you sense comes from people demanding one type of answer while being given the other. When a kin selectionist asks, "Where does the adaptation accumulate?" and an MLS theorist answers, "At the group level," the kin selectionist hears, "Genes don't matter," which is false. When an MLS theorist asks, "What is the causal pressure suppressing selfishness?" and the kin selectionist answers, "High relatedness," the MLS theorist hears, "Group structure doesn't matter," which is also false.

  ### 4. The Pedagogical and Political Economy
  Finally, do not underestimate the sociological factor.
  *   **The Stigma of Functionalism:** In the 60s, "group selection" was associated with naive functionalism (things evolve for the good of the species). Williams' *Adaptation and Natural Selection* was a necessary corrective. The term "group selection" still carries the scent of that error for older geneticists.
  *   **The Meme of the "Selfish Gene":** It is a incredibly powerful pedagogical tool. It is easier to teach students to imagine genes as little agents than to teach them contextual analysis or Price equation partitions.
  *   **Major Transitions:** The debate reignited because of the "Major Transitions in Evolution" (Maynard Smith & Szathmáry). How do individuals become groups (e.g., cells to multicellular organisms)? Here, MLS seems ontologically necessary. You cannot explain the evolution of the eukaryotic cell solely through gene-level competition without acknowledging the emergence of a new unit of reproduction. This forced the gene-centrists to concede some ground (hence the acceptance of MLS2), but the boundary lines remain contested.

  ### Will it ever settle?
  You asked if there is a class of cases or a distinction that would settle it.
  1.  **Empirical Asymmetry:** There are rare cases where the formalisms are *not* perfectly equivalent (e.g., non-additive fitness interactions, or specific types of cultural evolution). If empirical work consistently showed that MLS models predicted outcomes where Kin Selection models failed (or vice versa), one would win. But generally, they are too robustly equivalent.
  2.  **Vocabulary Shift:** The most likely resolution is a dissolution of the terms. Philosophers like Samir Okasha argue for **Explanatory Pluralism**. The question "What is the *true* unit of selection?" is a bad question. The good question is: "At which level does modeling the variance provide the most causal insight for this specific problem?"

  **Prognosis:** Your grandchildren's textbooks will likely still mention the debate, but hopefully as a historical lesson in the difference between statistical partitioning and causal ontology. The "fight" will persist as long as biologists conflate **predictive adequacy** (where the formalisms are equivalent) with **explanatory depth** (where they differ).

  **Summary Diagnosis:**
  The debate persists because it is **not** a debate about population genetics (where you are right, the math is settled). It is a debate about **scientific realism**.
  *   **Side A (Gene):** Wants an ontology that minimizes entities (parsimony) and tracks historical lineage.
  *   **Side B (MLS):** Wants an ontology that captures emergent causal powers and current structural constraints.

  Your colleague is right that it is metaphysical, but it is a "local" metaphysics (about how we carve nature at its joints for modeling), not a "global" metaphysics (about the fundamental stuff of the universe). Your hypothesis is right that it is about explanation. The tragedy is that both sides think admitting the other's validity weakens their own explanatory power, when in fact, they are complementary tools for different jobs.

  If you want to read one thing to confirm this diagnosis, look at Samir Okasha's *Evolution and the Levels of Selection* (2006). He formalizes exactly what you are sensing: that the "equivalence thesis" holds mathematically, but breaks down when we ask what the terms *refer to* in the causal structure of the world.
