      *   *Standard View:* Backward induction (BI) requires Common Knowledge of Rationality (CKR). If CKR holds, players defect immediately. If they don't, it's usually attributed to altruism, confusion, or bounded rationality (quantal response, level-k).
      *   *User's View:* It's not about *being* irrational or altruistic; it's about the *process* of reasoning being fallible over distance. The further down the game tree, the less certain I am that *you* will reason correctly there, and the less certain I am that *I* will reason correctly there.
