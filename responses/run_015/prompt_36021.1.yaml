  hey, so I need your help modeling someone. I'm a PhD student in behavioral economics — dissertation on time-inconsistent preferences and commitment devices, so basically hyperbolic discounting and sophisticated-vs-naive agents all day — and my roommate (zero philosophy training but scary good at hypotheticals, definately not a case of bluffing confidence) has been issuing verdicts on intention-formation cases all week. I want you to predict her verdicts on two new cases, figure out the rule(s) she's actually running, and design the case that would settle which rule it is.

