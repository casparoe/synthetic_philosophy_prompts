answer: |-
  The problem of old evidence strikes at the heart of Bayesian confirmation theory. Standard Bayesianism dictates that evidence $E$ confirms hypothesis $H$ if and only if $E$ raises the probability of $H$; formally, $P(H|E) > P(H)$. Equivalently, confirmation occurs when the likelihood ratio $P(E|H)/P(E|\neg H)$ exceeds one. This works smoothly for novel predictions. However, when $E$ is "old evidence"—already known with certainty by the agent—the math collapses. If the agent's current credence function assigns $P(E) = 1$, then $P(H|E)$ simply equals $P(H)$. Conditionalizing on certainty changes nothing. Furthermore, if $P(E) = 1$, then $P(E|H)$ and $P(E|\neg H)$ must both be 1, collapsing the Bayes factor to unity. Consequently, standard Bayesianism implies that the anomalous perihelion of Mercury cannot confirm General Relativity, simply because astronomers knew about the perihelion before Einstein formulated his theory. This contradicts scientific practice, where explanatory success regarding known facts is paradigmatic confirmation.

  The most robust solution is to evaluate confirmation relative to the agent's *prior* credence function—the probability assignment the agent held *before* learning $E$—rather than their current function. Let $P_{old}$ represent the credence function before $E$ was established, and $P_{new}$ represent the current function where $P_{new}(E) = 1$. The proposal is that $E$ confirms $H$ for the agent now if $P_{old}(H|E) > P_{old}(H)$. This approach is legitimate because confirmation measures *support*, not merely *updating*. While Bayesian conditionalization describes how beliefs should change over time, confirmation describes the logical strength of the relationship between propositions. By referencing $P_{old}$, we isolate the explanatory power of $H$ regarding $E$ from the historical accident of when $E$ was discovered. We are asking: "Had the agent not yet known $E$, would learning $H$ have made $E$ more expected?" If the answer is yes, then $H$ explains $E$, and that explanatory virtue constitutes confirmation, regardless of the current certainty of $E$.

  The strongest objection to this view is psychological impossibility. Critics argue that an agent cannot genuinely adopt $P_{old}$ because they cannot "unknow" $E$. Since the agent currently knows $E$ is true, constructing a credence function where $P(E) < 1$ seems fictitious, rendering the confirmation relation vacuous or incoherent. If the measure of confirmation relies on a belief state the agent can never occupy, how can it guide current rational belief?

  This objection fails because it conflates the *psychology of belief revision* with the *logic of confirmation*. Confirmation is not an event in the agent's belief history; it is a normative relation between propositions relative to a background state. We are not asking the agent to actually forget $E$ or psychologically regress to a previous state. Rather, we are asking them to assess the structural connection between $H$ and $E$ by bracketing $E$'s certainty. Consider a mathematical proof: once a theorem is proven, its probability is 1. Yet, the axioms still "confirm" or support the theorem. We understand this support by considering the logical derivation, not by pretending we don't know the theorem. Similarly, in science, we assess whether $H$ *would have* predicted $E$ by examining the theoretical connection, not by erasing memory. The counterfactual prior is a tool to expose this logical structure. It reveals that the support comes from the entailment or probabilistic linkage between $H$ and $E$, which exists independently of the agent's current knowledge state. To deny this is to confuse the *discovery context* with the *justification context*.

  However, adopting this view comes with significant costs. First, it abandons the promise of a purely synchronic Bayesianism. We can no longer assess confirmation solely by looking at an agent's current coherent credences; we must appeal to a historical or counterfactual narrative about how those credences formed. Second, reconstructing $P_{old}$ is notoriously subjective. There is no unique way to "subtract" $E$ from a belief system without altering other connected beliefs. Different reconstructions of the prior may yield different confirmation judgments, introducing a degree of vagueness that pure Bayesianism sought to avoid.

  Despite these costs, the counterfactual prior solution is necessary to save Bayesianism from irrelevance in real scientific contexts. A theory of confirmation that cannot account for the support General Relativity gains from Mercury's perihelion is untenable. By accepting that confirmation is a relation evaluated against a background where $E$ is uncertain, we preserve the intuition that explanatory power matters. We concede that Bayesianism cannot be a purely formal, ahistorical logic of belief, but in exchange, we gain a framework that accurately reflects how evidence actually supports theory in practice. The cost of historical subjectivity is preferable to the failure to recognize confirmation where it clearly exists.
