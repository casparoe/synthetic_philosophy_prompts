      *   *Correction on Axis 2:* The "squeeze" is important. If I don't care if you press the button, why do I care if you know the truth? Because knowing the truth affects *whether* you press the button, which I must be indifferent to... wait. If I am indifferent to the button, I am indifferent to the beliefs that cause the button. *Unless* I care about the beliefs for *other* reasons (doing the job). I need to make sure this distinction is clear. Corrigibility $\neq$ Passivity.
