answer: |-
  # Seminar Plan: The Impossibility of Honest Voting
  **Course:** Democracy and Collective Choice (Undergraduate)  
  **Time:** 75 Minutes  
  **Students:** 18  
  **Materials:** Whiteboard + markers, 40 Index Cards (2 colors), 18 Envelopes, 1 "Instructor Cheat Sheet" (prepared below).

  ---

  ## 1. Preparation (Before Class)
  **The Stake:** Announce at the start of the semester that there is a $100 leftover budget. Today's decision binds.
  **The Options:** Write these on the board immediately upon entry:
  *   **A:** Class Pizza Party
  *   **B:** Guest Speaker (Food + Talk)
  *   **C:** Charity Donation (in class name)
  *   **D:** Course Materials (Books for library)

  **Instructor Cheat Sheet (Critical):**
  You cannot calculate sincere outcomes on the fly. Immediately after collecting Round 0 ballots (Minute 10), transcribe the 18 ballots into a frequency table on a hidden sheet.
  *Example:*
  *   5 students: A > B > C > D
  *   4 students: B > A > C > D
  *   6 students: C > D > A > B
  *   3 students: D > C > B > A
  *(Adjust based on actual collection, but group identical rankings to speed up calculation).*
  Pre-calculate the winner for **Plurality**, **Borda Count**, and **Pairwise Majority** based on this sincere profile. Keep this sheet hidden.

  ---

  ## 2. Timeline & Script

  ### 0:00 – 0:10 | Round 0: The Sincere Baseline
  **Script:** "We have $100. We must choose one option (A, B, C, or D). Take two index cards. On the **Yellow Card**, write your *true* ranking from 1 (best) to 4 (worst). Do not put your name on it. Seal it in the envelope. This is your 'Sincere Ballot.' I will keep these sealed until the end. They represent the truth."
  **Action:** Collect envelopes. Shuffle them visibly.
  **Instructor Task:** While students settle, open envelopes, transcribe the profile onto your **Cheat Sheet**, and reseal them. Calculate the Sincere Winners for Plurality, Borda, and Pairwise.

  ### 0:10 – 0:40 | The Impossible Game (3 Rounds)
  **Setup:** "Now we vote for real. I will announce a rule. You vote on a **Blue Card** (publicly/collectively). I will announce the winner. Then, I will tell you what *would* have won if you had all used your Yellow Cards under that same rule."

  **Round 1: Plurality (10 mins)**
  *   **Rule:** "Vote for your top choice only. Most votes wins. Ties broken by coin flip."
  *   **Action:** Students write Blue Card. Collect and count aloud on board.
  *   **Reveal:** Announce Actual Winner.
  *   **Comparison:** Consult Cheat Sheet. Announce Sincere Winner (under Plurality).
  *   **Prompt:** "Did anyone vote differently on the Blue Card than their Yellow Card top choice? Why?" (Expect: Vote splitting fears).
  *   **Key Moment:** If Sincere Winner is Pareto-dominated (e.g., C wins due to A/B split, but everyone prefers B), highlight this. "Did strategy save us from a bad outcome?"

  **Round 2: Borda Count (10 mins)**
  *   **Rule:** "Rank all 4. 1st=3pts, 2nd=2pts, 3rd=1pt, 4th=0pts. Highest score wins."
  *   **Action:** Students vote Blue. Count aloud.
  *   **Reveal:** Actual Winner vs. Sincere Winner (from Cheat Sheet).
  *   **Prompt:** "Who buried a strong rival by ranking them last, even if you didn't truly hate them?" (Teaches burying strategy).

  **Round 3: The Class's Rule (10 mins)**
  *   **Rule:** "Propose any rule you can state in 30 seconds." (Common proposals: Runoff, Condorcet, Weighted).
  *   **Constraint:** If they propose something too complex to calculate against the Cheat Sheet quickly, veto it: "Too hard to verify sincerity in real-time. Pick another."
  *   **Action:** Vote, Reveal, Compare.
  *   **Prompt:** "Can we find a rule where the Actual Winner and Sincere Winner are *always* the same?" (Let them struggle).

  ### 0:40 – 1:00 | Escape Routes (20 mins total)
  **Script:** "Theorists suggest four ways to escape this problem. We will test each for 5 minutes. We are looking for the *cost* of each escape."

  **1. Cut to Two Alternatives (5 mins)**
  *   **Action:** Eliminate C and D. Vote A vs. B by show of hands (Majority Rule).
  *   **Debrief:** "Did anyone lie?" (Unlikely). "What did we lose?" (Nuance, compromise options).
  *   **Lesson:** Restricting the *domain of alternatives* solves manipulation but limits choice.

  **2. Single-Peaked Preferences (5 mins)**
  *   **Action:** Arrange options on a spectrum (e.g., Cost: Charity $0 -> Books $50 -> Pizza $75 -> Speaker $100). Ask students to reorder their Yellow Cards to ensure they are "single-peaked" along this line (ideal point, then declining on both sides). Vote by Median.
  *   **Debrief:** "Who had to lie about their sincere ranking to fit the spectrum?"
  *   **Lesson:** Restricting the *domain of preferences* works, but real preferences aren't always single-peaked.

  **3. Random Dictator (5 mins)**
  *   **Action:** Put 18 names in a hat. Draw one. That person's top choice (from Yellow Card) wins.
  *   **Debrief:** "Is this strategy-proof?" (Yes, just report truth). "Is it fair?" (Ex-ante yes, ex-post no). "Would you accept this for the $100?"
  *   **Lesson:** Randomization removes incentive to lie but sacrifices deterministic collective rationality.

  **4. Side Payments (5 mins)**
  *   **Action:** Allow students to trade cash/utility. "If A wins, A-supporters pay $5 to C-supporters."
  *   **Debrief:** "Did we just change the problem?" (Yes, from voting to markets). "Is money allowed in democracy?"
  *   **Lesson:** Moving to *cardinal utility + transfers* (Mechanism Design) escapes G-S but changes the nature of the political decision.

  ### 1:00 – 1:15 | Debrief & Theorem Mapping
  **Script:** "You just encountered the Gibbard–Satterthwaite Theorem. Let's map your experience to the conditions."

  **Whiteboard Mapping:**
  1.  **3+ Alternatives:** We had A, B, C, D. (Escape Route 1 tested removing this).
  2.  **Deterministic Winner:** One winner, no lotteries. (Escape Route 3 tested lotteries).
  3.  **Unrestricted Domain:** Any ranking allowed. (Escape Route 2 tested restricting this).
  4.  **No Dictator:** No single student always wins. (Escape Route 3 reintroduced this).
  5.  **Strategy-Proofness:** Truth-telling is a dominant strategy.

  **The "Pareto" Point:** "In Round 1, strategic voting likely produced a better outcome than sincere voting (avoiding the Condorcet Loser). This teaches us: Strategy-proofness is not the only value. Sometimes we accept manipulability to ensure efficiency."

  **Limitations:** "We tested 18 people and a few profiles. The Theorem proves this holds for *all* profiles and *all* N. Also, we used ordinal rankings. If we could measure intensity (cardinal utility), the theorem might not hold, but measuring intensity is its own impossibility."

  ---

  ## 3. Materials & Tally Sheets

  **Instructor Tally Sheet (Template)**
  | Rule Proposed | Actual Votes (Blue) | Actual Winner | Sincere Votes (Yellow/Cheat) | Sincere Winner | Manipulation Observed? | Pareto Efficient? |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | Plurality | A:5, B:4, C:6 | **C** | A:8, B:7, C:3 | **A** | Yes (A/B split) | No (B beats C) |
  | Borda | ... | ... | ... | ... | ... | ... |
  | ... | ... | ... | ... | ... | ... | ... |

  **Student Blue Card Template**
  > **ROUND [X] BALLOT**
  > Rule: ___________________
  > My Vote: ________________
  > (No Name)

  ---

  ## 4. Predictable Failures & Mitigations

  1.  **Students treating Round 0 strategically:**
      *   *Risk:* They lie on the Yellow Card, ruining the "Sincere" baseline.
      *   *Mitigation:* Emphasize the Yellow Card is "sealed forever unless we need to check the math." Frame it as a "secret diary" entry. If you suspect widespread lying, acknowledge it in the debrief: "If even the 'sincere' ballot was strategic, the problem is deeper than we thought."
  2.  **Stake too small:**
      *   *Risk:* Apathy. "Who cares about $100?"
      *   *Mitigation:* Add social stakes. "The winner gets to name the seminar folder on the LMS" or "The loser has to erase the whiteboard for the rest of the term."
  3.  **Rule Computation Bottleneck:**
      *   *Risk:* Students propose "Quadratic Voting" or "Schulze Method." You cannot calculate this live.
      *   *Mitigation:* Enforce the "30-second statement" rule strictly. If it requires a calculator, it's vetoed. "We need to be able to verify the Sincere Outcome instantly."
  4.  **The "Pareto" Moment Fails:**
      *   *Risk:* In Round 1, Sincere Voting actually picks the Condorcet Winner by luck.
      *   *Mitigation:* Have a backup profile in your head. If the real ballots don't show vote-splitting, *describe* a hypothetical: "Imagine if 8 liked A, 7 liked B, and 5 liked C. Sincere voting lets C win. Strategic lets B win. That is the risk we are discussing."

  ---

  ## 5. Instructor Confidence & Formal Flags

  **Where I am least confident (Formal Claims):**

  1.  **Randomized Strategy-Proofness:**
      *   *Claim:* In the Escape Route 3 debrief, I state that Random Dictatorship is the *only* strategy-proof randomized rule.
      *   *Uncertainty:* Gibbard (1978) proves that any strategy-proof *social decision scheme* (mapping profiles to lotteries over outcomes) is a mixture of dictatorial schemes *if* we require the rule to be defined for all profiles. However, some literature suggests that if we relax "ex-post efficiency" or allow for specific domain restrictions, other randomized rules might exist.
      *   *Action:* In the debrief, phrase this carefully: "Theory suggests random dictatorship is the *primary* strategy-proof randomized solution, though the math here is much subtler than the deterministic case." **I recommend a social choice theorist verify the exact boundary conditions of Gibbard 1978 regarding 'unanimity' vs 'efficiency' before running.**

  2.  **Side Payments (Mechanism Design):**
      *   *Claim:* Escape Route 4 "escapes" Gibbard-Satterthwaite.
      *   *Uncertainty:* It doesn't technically escape G-S; it leaves the G-S *model*. G-S assumes ordinal preferences without transferable utility. VCG mechanisms require cardinal utility and quasilinear preferences.
      *   *Action:* Ensure the debrief explicitly states: "This isn't a fix within voting theory; it's a shift to market design. We changed the assumptions, not the theorem."

  3.  **The "Pareto" Scenario:**
      *   *Claim:* Strategic voting can yield a Pareto improvement over sincere voting.
      *   *Uncertainty:* This is generally true in Plurality with vote-splitting (Condorcet Loser wins sincerely, Condorcet Winner wins strategically). However, ensuring this happens *reliably* with 18 random undergraduates in one session is probabilistic.
      *   *Action:* **Pilot this specific round.** Run a mock class with 18 colleagues or TAs beforehand to ensure the natural distribution of preferences on Pizza/Speaker/Charity/Books actually generates a vote-splitting paradox. If the mock run shows a clear majority winner, change the options (e.g., split "Pizza" into "Pizza A" and "Pizza B" to force the split).

  **Piloting Recommendation:**
  Pilot the **Round 0 to Round 1 transition**. Specifically, time how long it takes you to transcribe 18 ballots into a frequency table and calculate the Plurality/Borda/Pairwise winners. If this takes more than 8 minutes, the 75-minute session will fail. You may need to pre-print a "Sincere Profile" and ask students to *select* a profile type rather than generate one, though this reduces the "live stake" feel. I recommend keeping the live stake but having a TA help with the transcription if possible.
