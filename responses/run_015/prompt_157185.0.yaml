answer: |-
  ### Brainstorming & Conceptual Distinctions

  Before drafting the proposal, we need to sharpen the distinction between the standard model and your proposed twist.

  1.  **Standard Diachronic Money Pump:**
      *   **Structure:** Agent has credences $P_1$ at $t_1$. Evidence $E$ arrives at $t_2$. Agent updates to $P_2 \neq P_1(\cdot|E)$.
      *   **The Pump:** A bookie offers a bet at $t_1$ based on $P_1$, and a counter-bet at $t_2$ based on $P_2$.
      *   **Utility Assumption:** The agent evaluates the total sequence of trades as the sum of utilities at each node. Crucially, the utility of the final payoff is independent of the path taken to get there (Time-Separable Utility, or TSU). The "loss" is calculated ex-ante as a sure loss of money for no gain in truth-accuracy or world-state.

  2.  **The Interdependent Value Twist:**
      *   **Structure:** Same belief dynamics (incoherent updating).
      *   **Utility Assumption:** Utility is defined over *histories* or *paths*, not just terminal nodes. Specifically, $U(history)$ depends on the relation between preferences at $t_1$ and preferences at $t_2$.
      *   **The Block:** If the agent values *consistency of preference* or *trajectory of mind* non-instrumentally, the "loss" calculated in the standard pump might not register as a loss in the interdependent model. The agent might prefer the path where they pay the pump fee because it preserves a valued relation between their temporal selves, even if the terminal monetary state is worse.
      *   **Key Distinction:** This is not just "resolute choice" (binding oneself to a plan). It is a claim that the *goodness* of the outcome is constitutively tied to the preference structure held along the way.

  3.  **Feasibility Check:**
      *   3 months is very short for developing a new axiomatic system.
      *   *Strategy:* Do not try to axiomatize interdependent utility from scratch. Instead, take an existing model of path-dependent utility (e.g., from behavioral econ or temporal holism) and test the standard money pump theorems against it.
      *   *Deliverable:* A formal counter-model (if the pump breaks) or a modified theorem (if the pump survives).

  ***

  ### Research Proposal

  **Project Title:** Diachronic Coherence Without Separability: Testing Money Pump Arguments Under Interdependent Value Structures

  **1. Research Question**
  Do pragmatic diachronic coherence arguments (specifically money pump arguments for Conditionalization) presuppose Time-Separable Utility (TSU), and if so, do these arguments retain their normative force when agents possess Interdependent Value Structures (IVS) where present utility depends non-instrumentally on future preference states?

  **2. Background and Motivation**
  Pragmatic arguments for Bayesian Conditionalization rely on the claim that an agent who updates incoherently is vulnerable to a sequence of trades that guarantees a loss (a money pump). Standard treatments (e.g., Christensen, Maher, Douven) construct decision trees where the agent's preferences at $t_1$ and $t_2$ are evaluated independently regarding the final payoff. The "sure loss" is derived by summing utilities across time slices, assuming that the value of a terminal outcome is invariant to the history of trades that produced it.

  This proposal identifies a hidden premise in these arguments: **Time-Separable Utility.** TSU assumes that an agent's evaluation of an outcome at $t_n$ is independent of the preference orderings held at $t_{n-1}$. However, in many plausible psychological and normative models, value is temporally holistic. An agent may care about *who they become* during the decision process. For example, an agent might disvalue being the kind of person whose preferences shift arbitrarily, or they might value the *continuity* of their commitment structure non-instrumentally.

  Current formal epistemology leaves this open. Diachronic coherence theorems typically stipulate utility functions over terminal nodes without defending the separability assumption. If the "loss" in a money pump is only a loss relative to a separable utility function, then the normative force of the pump collapses for agents with interdependent values. This project seeks to determine whether the vulnerability to money pumps is a feature of *incoherent belief revision* or merely a feature of *separable valuation*.

  **3. Methodology**
  The project will employ formal modeling within a decision-theoretic framework. The work will proceed in three phases over the three-month fellowship:

  *   **Phase 1: Formalizing the Baseline and the Twist (Month 1)**
      *   Reconstruct a standard diachronic money pump argument for Conditionalization using a finite decision tree. Explicitly formalize the TSU assumption (i.e., $U_{total} = \sum U_{node}$).
      *   Define a class of Interdependent Value Structures (IVS). Here, utility is defined over paths, not just nodes: $U(path) = f(outcome, P_{t1}, P_{t2})$. Crucially, $P_{t2}$ (future preference) enters the utility function at $t_1$ non-instrumentally.
      *   *Constraint:* To ensure feasibility, I will restrict IVS to a specific parametric form (e.g., a penalty term for preference reversal) rather than attempting a general axiomatization.

  *   **Phase 2: Stress-Testing the Pump (Month 2)**
      *   Run the standard money pump scenario against the IVS model.
      *   **Scenario A (Incoherent Beliefs + TSU):** Replicate the standard result (vulnerability).
      *   **Scenario B (Incoherent Beliefs + IVS):** Determine if the agent accepts the sequence of trades. The key test is the "extraction step": Does the agent pay to switch options at $t_2$? Under IVS, paying to switch might restore a valued preference relation, offsetting the monetary loss.
      *   Construct a formal proof or counter-model showing whether a guaranteed sure-loss (in terms of IVS) still exists.

  *   **Phase 3: Interpretation and Refinement (Month 3)**
      *   Analyze the results. If the pump fails under IVS, characterize the specific conditions under which diachronic coherence becomes optional.
      *   If the pump survives, identify the modified utility constraints required to reconstruct the argument.
      *   Draft the final paper focusing on the implications for the normativity of Conditionalization.

  **4. Expected Results**
  There are two primary outcomes, both of which are philosophically significant:

  1.  **The Breakdown Result:** The money pump fails under IVS. This would demonstrate that standard diachronic coherence arguments are not universally binding but rely on a contentious metaphysical assumption about the separability of temporal value. This would shift the burden of proof to Bayesians to justify TSU.
  2.  **The Reconstruction Result:** The money pump survives even under IVS. This would require showing that any rational interdependent value structure still penalizes the specific trajectory of incoherent updating more than it rewards preference continuity. This would strengthen the money pump argument by showing its robustness across utility classes.

  Most likely, the result will be nuanced: the pump breaks for *some* IVS structures but can be reconstructed for a restricted class of "rationally permissible" IVS structures.

  **5. Feasibility and Risk Assessment**
  **Scope Management:** The primary risk is the complexity of formalizing Interdependent Value Structures. A full axiomatization of path-dependent utility is a multi-year project.
  *   *Mitigation:* I will not derive IVS from first principles. Instead, I will adopt a "phenomenological" approach, defining IVS via a specific modification to the utility function (e.g., adding a "consistency cost" term) sufficient to test the pump. This keeps the math tractable for a 3-month timeline.

  **Technical Complexity:** Proving the non-existence of a pump is harder than constructing one.
  *   *Mitigation:* I will focus on constructing specific counter-examples (existence proofs) where the pump fails. This is sufficient to challenge the universality of the standard argument without requiring a general impossibility theorem.

  **Deliverable:** A 15–20 page paper suitable for submission to a journal such as *Philosophy of Science*, *British Journal for the Philosophy of Science*, or *Erkenntnis*, containing the formal models and philosophical analysis.

  **6. Conclusion**
  This project isolates a critical, under-examined assumption in the foundations of rational choice. By decoupling diachronic belief coherence from time-separable utility, it clarifies whether the requirement to Conditionalize is a demand of rational belief or merely an artifact of how we model rational value. Given the fellowship's duration, the focused scope on the "extraction step" of the money pump ensures a concrete, completable result that advances the debate beyond the standard conditionalization literature.
