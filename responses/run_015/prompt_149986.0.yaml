  **TERMS OF SERVICE AND EPISTEMIC WAIVER**
  **SIDGWICK INSTITUTE FOR RATIONAL INTUITION AND TELEPATHIC VERIFICATION (SIRITV)**

  By clicking "I Agree," the Participant (hereinafter "the Sitter") acknowledges that all psychical phenomena are subject to the same rigorous scrutiny as moral axioms. Access to the etheric plane constitutes acceptance of the following methodological clauses.

  **1. Methodological Compliance**
  All manifestations must be validated under three concurrent frameworks. First, **Egoistic Hedonism**: the Sitter must confirm the apparition yields net pleasure to the self. Second, **Utilitarianism**: the manifestation must maximize universal spiritual welfare, regardless of personal terror. Third, **Common-Sense Morality**: the ghost must adhere to socially accepted norms of haunting. Failure to satisfy all three methods voids the warranty on reality.

  **2. The Dualism of Practical Reason**
  The Sitter acknowledges that Rational Egoism and Universal Good may conflict during mediumship. If a spirit demands self-sacrifice without promise of future sanction, the Institute is not liabilty for the resulting metaphysical crisis. Participants accept that reason may not reconcile personal safety with cosmic duty.

  **3. Rational Intuitionist Seance Protocol**
  All sessions follow the strict "Rational Intuitionist Seance" procedre.
  *   **3.1 Ectoplasmic Common Sense:** Any materialized substance must be self-evident to careful reflection. If the ectoplasm requires empirical verification beyond intuition, the session is paused for philosophical review.
  *   **3.2 Universal Point of View Disclosure:** The medium must channel the "Point of View of the Universe." Partial perspectives are rejected. The spirit must demonstrate knowledge of total universal happiness to prove validity.

  **4. Limitation of Epistemic Liability**
  The Institute provides no guarantee that psychical evidence will resolve the conflict between virtue and self-interest. We are not responsible for lingering doubts regarding divine justice or the existence of post-mortem sanctions. By participating, you waive the right to demand coherence between your ethical intuitions and the poltergeist activity recieve in your parlor.

  **5. Termination**
  Access may be revoked if the Sitter reverts to naive empiricism without prior intuitive validation.

  ***

  **Author's Note**
  Henry Sidgwick's involvement with the Society for Psychical Research (SPR) is historical fact; he was a founding member and served as president. It is widely accepted by scholars (e.g., Bart Schultz, David Phillips) that Sidgwick hoped psychical research might provide empirical evidence for survival after death and divine justice, which he saw as necessary to reconcile the "Dualism of Practical Reason" (the conflict between self-interest and duty). However, the degree to which this hope drove his work is debated, and the "Rational Intuitionist Seance" protocol described above is pure satirical invention. Sidgwick applied rigorous evidential standards to the SPR, though critics argue his desire for a solution to the dualism lowered his skepticism regarding specific mediums.
