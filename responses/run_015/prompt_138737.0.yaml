prompt: |-
  I am the registrar and collections manager of a mid-sized municipal museum: roughly nine thousand objects, mostly European paintings, prints and decorative arts, plus a small contemporary collection that includes several works acquired as certificates and instructions rather than as unique objects. Three or four times a year something turns up that makes us unsure what we actually have — a technical report, a new attribution in the literature, a dealer's opinion, an heir's photograph, an unsolicited email from someone who claims a forgery ring. Each time this happens the same argument starts, and it never resolves: the curator says the object in front of us has not changed and still does everything a visitor needs it to do; the director worries about donors and about the reproduction of one image on half the city's promotional material; the finance office points out that our insurance schedule is keyed to attribution, so a change of wording has a money consequence; someone on the board asks why we are wasting money on a question that makes no difference to how the thing looks. I want to stop having that argument from scratch.

  What I need from you is a written decision procedure my office can run on any case where what is in question is what an object is: whether it is by the hand claimed, whether it is of the period claimed, whether it is an original, a version, a studio product, a later copy, an imitation, or a fake. It should issue in one of a small number of dispositions — keep as catalogued; keep on display with a changed credit line or label; keep with a changed label and a changed valuation; withdraw from display; decline or return a gift; refer elsewhere — and it should say what has to be established to reach each.

  Please ground the steps in whatever the philosophy of art actually establishes about what is lost when an original turns out to be a copy, and about why that loss is not, or not only, a perceptual one. I do not want the literature summarised for its own sake; I want its distinctions doing work inside the steps. In particular, I have found that the arguments that blow up in committee are always one of four, and I would like the procedure built around them unless you think the decomposition is wrong:

  One, the perceptual question — whether anything available to a competent viewer, looking at the object as it hangs, changes if it is a copy. My experience is that it does not, and I want the procedure to say exactly what follows from that, so that people who stop at this step can be told where else their objection has to go.

  Two, the question of whose doing this is and under what constraints it was done. The difference between working towards an achievement and working backwards from an effect that already exists seems to me to be doing more real work here than the question of how the object looks, but I have never been able to say it in a sentence the board will accept.

  Three, the question of what the object now tells us. Even an untouched picture becomes a different witness once we know it was made in 1920 rather than 1660, and my sense is that this, rather than beauty, is where most of the damage of a forgery actually lies — including the damage to everyone who has written about it in good faith.

  Four, the question of what we have promised: to the public buying a ticket, to the donor or lender, to the field that cites our catalogue.

  Three further constraints. First, the procedure has to be runnable by me and one assistant with no conservation training, in about a working day per case, because the external conservation scientist takes four months and every report has to be justified against the acquisitions budget. Say explicitly what to do when the evidence will not settle the matter, who carries the burden, what the interim disposition is, and how long an interim label may stand. Second, it must handle the contemporary works that arrive as certificates: I have been told there is a technical term for works whose identity conditions allow correct instances to be produced later, under supervision, after the artist's death, and I want to know whether those go through the same procedure, a branch of it, or none of it. Third, it must give me graded label wording for weakened attributions — the trade's formulae along the lines of studio of, circle of, follower of, manner of, after — together with the rule for choosing between them, and it must say what each does to the insurance figure.

  Run the finished procedure on these, with the reasoning shown:

  A. A seventeenth-century cabinet picture bought in 1974 as an autograph work. Technical imaging now shows it to be a contemporary workshop version, probably painted partly by the master and partly by an assistant, and probably sold at the time without any claim one way or the other. Nothing about it as an object has changed. What does the label say, what does it do to the valuation, and what happens to the seventy-four file?

  B. A light work acquired in 2011 as a certificate with the artist's fabrication instructions, fabricated under studio supervision and accessioned as the work itself. The artist has since publicly disavowed our instance on political grounds, while continuing to license identical instances elsewhere, and has asked us to label it as unauthorised. Is this the same kind of question as A at all?

  C. A painting that has hung here for forty years, is the single most reproduced image we own, and was shown by technical evidence to be the work of a known imitator of the master we catalogued it under. Our curators are privately of the view that it is a better picture than any genuine work by that master that we could ever afford. A dealer has offered a serious sum for it on the understanding that it will be resold, at a markup, as a celebrated forgery.

  Also give the procedure a stated position on a standing practice of ours: for four months each year a light-sensitive painting comes off the wall and a high-grade reproduction goes into its frame, and the only disclosure is a line in small print at the bottom of the wall text. Tell me whether that is anyone's business but the conservator's.

  Finally, two things. Mark, at each step, the places where judgment genuinely cannot be eliminated and has to be handed to me, to the director, to the board, or to our lawyers — including anything that is really a question of rightful ownership rather than of what the object is. And tell me plainly which of the cases above comes out against us. I would rather have a procedure that returns an answer my director will hate than one quietly rigged so that everything we already do turns out to be defensible.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Registrar and Collections Manager of a mid-sized municipal museum (9k objects, mostly European paintings/prints/decorative arts, small contemporary collection).
      *   **Problem:** Recurring, unresolved arguments when an object's attribution/identity is questioned (Curator vs. Director vs. Finance vs. Board).
      *   **Goal:** A written decision procedure to resolve "what an object is" questions (attribution, period, originality, etc.).
      *   **Outputs:** Specific dispositions (keep, relabel, deaccession, etc.), grounded in philosophy of art (specifically addressing perceptual vs. non-perceptual loss), handling four specific argument types (Perceptual, Agency/Constraint, Testimonial/Historical, Promise/Contractual).
      *   **Constraints:**
          1.  Runnable by Registrar + 1 assistant (no conservation training) in ~1 day.
          2.  Handle uncertainty (burden of proof, interim status).
          3.  Handle contemporary certificate works (multiple instances).
          4.  Provide graded label wording (Studio of, Circle of, etc.) and insurance impact rules.
          5.  Run the procedure on three specific cases (A, B, C).
          6.  Address the "facsimile replacement" practice (light-sensitive works).
          7.  Mark points of irreducible judgment (Registrar, Director, Board, Legal).
          8.  Be honest about which case comes out "against us" (even if Director hates it).

  2.  **Philosophical Grounding (The "Why"):**

      *   *Perceptual:* Nelson Goodman (*Languages of Art*) distinguishes between autographic and allographic arts. In painting, the history of production matters. A perfect forgery is aesthetically indistinguishable *now* but lacks the correct history of production.
      *   *Agency/Constraint:* Arthur Danto (*The Artworld*) and Noel Carroll. Art is about intention and context. A copy made *as* a copy lacks the artistic achievement of the original problem-solving.
      *   *Testimonial/Historical:* The object as a historical document. If it's a 1920 copy of a 1660 work, it tells us about 1920 taste, not 1660 technique.
      *   *Promise/Contractual:* Institutional ethics (AAM/ICOM codes). The museum warrants authenticity to the public and donors.

  3.  **Drafting the Procedure (The "How"):**

      *   *Structure:* Needs to be a flowchart or step-by-step protocol.
      *   *Steps:*
          1.  Trigger (New Evidence).
          2.  Triage (Is it a certificate work or physical object?).
          3.  The Four Questions (Perceptual, Agency, Testimonial, Promise).
          4.  Disposition Matrix.
          5.  Labeling & Valuation Rules.
          6.  Uncertainty Protocol.
      *   *Addressing Constraints:*
          *   *Time:* Limit external consultation to existing reports/literature. No new science unless critical.
          *   *Certificates:* Distinguish Autographic (unique history matters) vs. Allographic/Conceptual (instruction matters).
          *   *Labels:* Use standard art trade terminology (Attributed to, Studio of, etc.).
          *   *Judgment Points:* Clearly flag where the Registrar stops and the Director/Board starts.

  4.  **Developing the Four Questions (incorporating the User's decomposition):**

      *   *Q1 (Perceptual):* Does the visual experience change? (Goodman). If No, move to Q2. If Yes (damage/alteration), conservation triggers.
      *   *Q2 (Agency):* Who did the work and why? (Danto/Intentionality). Achievement vs. Replication.
      *   *Q3 (Testimonial):* What historical truth does it carry? (Object as document).
      *   *Q4 (Promise):* What did we promise the public/donor? (Ethics/Contract).

  5.  **Refining the Labeling & Valuation:**

      *   Need specific hierarchy: *By [Artist]* -> *Attributed to* -> *Studio of* -> *Circle of* -> *Follower of* -> *Manner of* -> *After* -> *Fake*.
      *   Insurance: Needs a sliding scale. Autograph = 100%. Studio = 50-70%. Follower = 10-20%. Fake = 0% (or decorative value only).

  6.  **Addressing the Specific Cases:**

      *   *Case A (17th C Cabinet):* Workshop version.
          *   Q1: No change.
          *   Q2: Partial master, partial assistant.
          *   Q3: Tells us about workshop practice, not just master's hand.
          *   Q4: Bought as autograph.
          *   *Outcome:* Relabel ("Studio of" or "Attributed to"), Adjust Value (down), Keep File (update provenance).
      *   *Case B (Conceptual/Certificate):* Artist disavows.
          *   Nature: Allographic/Conceptual. Identity lies in the certificate/instruction, not the physical instance *unless* the artist retains authority.
          *   *Outcome:* This is a rights/contract issue, not attribution. If the certificate is valid, the work is valid *unless* the contract allows revocation. Likely keep but add context note. *Wait, the prompt asks if it's the same question as A.* No, it's not. It's about authority, not material origin.
      *   *Case C (The Forgery):* Known imitator, popular image, dealer offer.
          *   Q1: No change (maybe "better").
          *   Q2: Deceptive intent (Forgery).
          *   Q3: False witness (1920s/30s forgery vs 1660).
          *   Q4: Public trust violated.
          *   *Outcome:* Withdraw/Relabel as "Forgery of". Do not sell as forgery (ethical breach).
      *   *Facsimile Practice:*
          *   Is it anyone's business? Yes. It violates the promise of authenticity (Q4). Even if conservation-driven, the public is seeing a copy. Needs clear labeling.

  7.  **Addressing the "Judgment Points" and "Against Us":**

      *   Must explicitly state where the Registrar's power ends (e.g., deaccessioning, major value write-offs).
      *   Must be honest. Case C is the big risk. Selling it as a forgery is unethical. Keeping it as an original is dishonest.

  8.  **Review against Constraints:**

      *   *Runnable in a day?* Yes, relies on existing evidence, not new science.
      *   *Certificate works?* Included as a branch.
      *   *Graded labels?* Included.
      *   *Philosophy?* Integrated into the questions (Goodman, Danto, etc., implicitly or explicitly referenced as rationale).
      *   *Honesty?* Case C will likely require deaccessioning or radical relabeling which the Director will hate.

  9.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Professional, bureaucratic but philosophically rigorous.
      *   *Structure:*
          1.  Preamble (Philosophical Basis).
          2.  The Procedure (Steps 1-5).
          3.  Labeling & Valuation Schedule.
          4.  Uncertainty Protocol.
          5.  Case Studies (A, B, C).
          6.  Facsimile Policy.
          7.  Authority Matrix (Who decides what).

      *(Self-Correction during drafting)*: I need to make sure I don't just summarize philosophy but *use* it. For example, when discussing Case B, I need to reference the distinction between autographic and allographic works (Goodman) to explain why the procedure branches. For Case C, I need to emphasize the "historical witness" aspect over the "beauty" aspect.

      *(Refining the "Facsimile" question)*: The user asks if it's anyone's business but the conservator's. The philosophical answer is "Yes, the public's." The museum promises an encounter with the original. A facsimile breaks that contract.

      *(Refining Case B)*: The artist disavowed it *politically*. This is tricky. In conceptual art, the artist's sanction often *constitutes* the work. If they revoke sanction, does the object cease to be the work? Or does the certificate hold? I need to lean on the *contract* (Certificate) vs. *moral right*. The procedure should treat this as a Legal/Contract issue, not an Attribution issue.

      *(Refining Case C)*: The dealer wants to buy it to sell as a "celebrated forgery." The museum cannot participate in laundering a forgery as a commodity of deception. It must be labeled as a forgery or sold quietly (but selling forgeries is often ethically fraught). Best outcome: Relabel as "Imitator/Forgery," keep for education, or deaccession without selling to that dealer. I will recommend Relabel/Withdraw.

  10. **Final Polish:** Check against the "one working day" constraint. The procedure must rely on *existing* files and literature, not new testing. If new testing is needed, it triggers the "Uncertainty/Interim" protocol.

      *Wait, one constraint:* "Mark, at each step, the places where judgment genuinely cannot be eliminated... including anything that is really a question of rightful ownership." I need to add a column or sidebar to the procedure indicating "Decision Authority."

      *Another constraint:* "Tell me plainly which of the cases above comes out against us." I need a specific section for this.

      *Let's write.*
answer: |-
  # Museum Object Identity and Attribution Decision Procedure (MOI-ADP)

  **Version:** 1.0
  **Owner:** Registrar's Office
  **Authority:** Collections Committee (Final Disposition), Registrar (Procedural Application)
  **Philosophical Basis:** Goodman (*Languages of Art*), Danto (*The Artworld*), ICOM Code of Ethics.

  ## 1. Preamble: The Four Grounds of Identity
  This procedure exists to resolve disputes regarding object identity without restarting the philosophical debate each time. We accept the following four premises as established policy:

  1.  **The Perceptual Ground:** Aesthetic experience is necessary but insufficient. Two objects may look identical but possess different art-historical identities (Goodman). *If the only objection is perceptual, the objection is dismissed.*
  2.  **The Agency Ground:** Art is an achievement of specific human intention under specific constraints. A copy replicates an effect; an original solves a problem. *Loss of authorship is loss of historical achievement, regardless of visual quality.*
  3.  **The Testimonial Ground:** Objects are historical documents. A 1920 copy of a 1660 painting testifies to 1920 taste, not 1660 technique. *Misattribution falsifies the historical record.*
  4.  **The Contractual Ground:** The museum warrants authenticity to the public, donors, and the scholarly field. *Trust is a currency; spending it requires authorization.*

  ---

  ## 2. The Procedure

  ### Step 1: Triage (Time limit: 1 hour)
  **Action:** Registrar determines the *category* of the work.
  *   **Path A: Autographic Object.** (Paintings, sculpture, unique decorative arts). Identity is tied to physical history of production. -> **Go to Step 2.**
  *   **Path B: Allographic/Conceptual Work.** (Certificates, instructions, multiples, performance). Identity is tied to compliance with instructions or artist sanction. -> **Go to Step 5.**

  **[Judgment Point: Registrar]** Determining the category. If unclear, consult Curator. If still unclear, treat as Path A (conservative default).

  ### Step 2: Evidence Assembly (Time limit: 3 hours)
  **Action:** Gather existing evidence. Do **not** commission new science at this stage.
  *   Collect: Previous catalog entries, acquisition files, recent technical reports, relevant literature (catalogues raisonnés), dealer correspondence.
  *   **Burden of Proof:** Lies with the party claiming a *change* in status. (e.g., If claiming it is a fake, evidence must support "fake," not just "uncertain").
  *   **Standard of Proof:** "Preponderance of Evidence" (More likely than not). We are not a court of law; we are a public trust.

  **[Judgment Point: Registrar]** Deciding if the evidence package is complete enough to proceed. If critical data is missing (e.g., no photos), mark case as **INTERIM** (see Step 6).

  ### Step 3: The Four Questions (Time limit: 2 hours)
  **Action:** Apply the evidence to the Four Grounds. Record "Pass" (Identity holds), "Fail" (Identity broken), or "Mitigated" (Identity weakened).

  1.  **Perceptual:** Has the physical object changed? (Damage, overpaint).
      *   *If No:* Proceed. (Visual stability does not prove identity).
  2.  **Agency:** Who made this and why?
      *   *Pass:* Hand of the master, intended as an original.
      *   *Mitigated:* Workshop participation, studio product.
      *   *Fail:* Later copy, forgery, pastiche.
  3.  **Testimonial:** What history does this object record?
      *   *Pass:* Consistent with attributed period/origin.
      *   *Fail:* Anachronistic materials, style, or provenance gaps that suggest later fabrication.
  4.  **Contractual:** What was promised at acquisition/display?
      *   *Pass:* Catalogue language matches evidence.
      *   *Fail:* Acquired as "Autograph," evidence shows "Copy."

  **[Judgment Point: Curator]** Curator provides the art-historical weighting of the evidence (e.g., "This brushwork is typical of the assistant, not the master"). Registrar records the conclusion.

  ### Step 4: Disposition Matrix (Time limit: 1 hour)
  **Action:** Match the Step 3 results to the required disposition.

  | Agency Status | Testimonial Status | Contractual Status | Disposition | Label Action | Valuation Action |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Pass** | **Pass** | **Pass** | **Keep as Catalogued** | No change | No change |
  | **Mitigated** | **Mitigated** | **Fail** | **Keep / Relabel** | Downgrade attribution (see Schedule) | Adjust to Market % (see Schedule) |
  | **Fail** | **Fail** | **Fail** | **Withdraw / Deaccession** | Label as "Forgery/Imitation" or Remove | Write off to Decorative Value |
  | **Fail** | **Pass** | **Fail** | **Keep / Relabel** | Label as "Period Copy" | Adjust to Period Copy Value |
  | **Uncertain** | **Uncertain** | **Fail** | **Interim Status** | "Attribution Under Review" | Freeze Insurance Value |

  **[Judgment Point: Director]** Any disposition involving a valuation drop of >20% or withdrawal from display requires Director sign-off.
  **[Judgment Point: Board]** Any disposition involving deaccessioning or write-off of >10% of collection value requires Board approval.

  ### Step 5: Conceptual/Certificate Branch (Time limit: 2 hours)
  **Action:** For works acquired as instructions/certificates (Allographic).
  *   **Question:** Does the physical instance comply with the certificate/instructions *at the time of fabrication*?
      *   *If Yes:* The work is valid, regardless of the artist's current opinion (unless contract specifies revocation).
      *   *If No:* The work is not an instance of the artwork.
  *   **Artist Disavowal:** If the artist disavows the work for political/moral reasons *after* valid fabrication:
      *   This is a **Legal/ethical** issue, not an attribution issue.
      *   **Disposition:** Keep, but add context note regarding the artist's current stance. Do not deaccession solely on artist's retrospective political objection unless contract allows.

  **[Judgment Point: Legal Counsel]** Review acquisition contract for revocation clauses.
  **[Judgment Point: Registrar]** Determine if fabrication complied with instructions.

  ### Step 6: Uncertainty Protocol (Interim Status)
  **Action:** When evidence is inconclusive after Step 2.
  *   **Burden:** Remains on the status quo. If bought as "Master," it stays "Master" until proven otherwise, *unless* risk to reputation is high.
  *   **Interim Label:** "Traditionally attributed to [Name]. Current research suggests [Alternative]."
  *   **Duration:** Maximum 12 months.
  *   **Valuation:** Frozen at lower of (Current Market Value as Attributed) or (Current Market Value as Alternative).
  *   **Trigger for External Science:** Only if the valuation difference exceeds the cost of the science by a factor of 5x.

  **[Judgment Point: Finance Office]** Approval of interim valuation freeze.

  ---

  ## 3. Labeling and Valuation Schedule

  **Rule:** Choose the *lowest* attribution supported by the preponderance of evidence.

  | Term | Definition | Insurance Valuation Rule |
  | :--- | :--- | :--- |
  | **By [Artist]** | Autograph, full acceptance. | 100% of Schedule Value |
  | **Attributed to [Artist]** | Probable, but not certain. | 75% of Schedule Value |
  | **Studio of [Artist]** | Produced in the master's workshop under supervision. | 50% of Schedule Value |
  | **Workshop of [Artist]** | Produced in workshop, master's involvement unclear. | 40% of Schedule Value |
  | **Circle of [Artist]** | Contemporary of the artist, influenced by them. | 30% of Schedule Value |
  | **Follower of [Artist]** | Later date, style influenced by artist. | 20% of Schedule Value |
  | **Manner of [Artist]** | Later date, style imitated, no direct link. | 15% of Schedule Value |
  | **After [Artist]** | Copy made after the original (any date). | 10% of Schedule Value |
  | **Forgery / Imitation** | Made with intent to deceive. | 0% (Decorative Value Only) |

  **[Judgment Point: Registrar]** Selecting the specific term based on Step 3 findings.
  **[Judgment Point: Finance]** Applying the percentage to the current insurance schedule.

  ---

  ## 4. Case Studies

  ### Case A: The Seventeenth-Century Cabinet
  *   **Evidence:** Technical imaging shows contemporary workshop version. Partial master, partial assistant. Sold historically without specific claim.
  *   **Step 3 Analysis:**
      *   *Perceptual:* No change.
      *   *Agency:* Mitigated (Master + Assistant). Not fully autograph.
      *   *Testimonial:* Pass (It is 17th C, just not solely the Master).
      *   *Contractual:* Fail (Bought as autograph).
  *   **Disposition:** **Keep / Relabel.**
  *   **Label:** "Studio of [Master]" or "Attributed to [Master] and Workshop." (Given the imaging shows master's hand, "Studio of" is more accurate than "Follower").
  *   **Valuation:** Adjust to **50%** of Schedule Value (Studio of).
  *   **The 1974 File:** **Keep and Annotate.** Do not destroy. Add a red-sheet addendum detailing the new technical findings. This preserves the provenance of the *museum's ownership*, even if the art history changed.
  *   **Reasoning:** The object is still a 17th-century witness (Testimonial Pass), but the achievement is collaborative (Agency Mitigated). We promised an autograph work (Contractual Fail), so we must correct the public record, but the object retains historical value.

  ### Case B: The Disavowed Certificate
  *   **Evidence:** Work fabricated per instructions in 2011. Artist now disavows on political grounds.
  *   **Step 1 Triage:** **Path B (Conceptual).** This is *not* the same question as A. A is about material origin; B is about contractual authority.
  *   **Step 5 Analysis:**
      *   *Compliance:* Yes, fabricated under supervision per certificate.
      *   *Revocation:* Artist has no legal right to revoke unless contract specifies. Political disavowal does not negate physical compliance with instructions at time of creation.
  *   **Disposition:** **Keep as Catalogued.**
  *   **Label:** Keep original credit line. Add a wall text note: "The artist has subsequently expressed political objections to this instance."
  *   **Reasoning:** In conceptual art, the work is the instruction + compliance. The artist's later change of mind is biographical data, not ontological destruction. To remove it validates censorship.
  *   **Risk:** High public controversy.
  *   **[Judgment Point: Director/Board]** Must approve the decision to retain against the artist's public wish, weighing reputational risk against artistic integrity.

  ### Case C: The Popular Forgery
  *   **Evidence:** Technical proof of known imitator. Curators prefer it aesthetically. Dealer offers sum to sell as "celebrated forgery."
  *   **Step 3 Analysis:**
      *   *Perceptual:* Pass (It is "better").
      *   *Agency:* **Fail** (Intent to deceive/imitate).
      *   *Testimonial:* **Fail** (False witness of the Master's era).
      *   *Contractual:* **Fail** (Public believes it is the Master).
  *   **Disposition:** **Withdraw from Display / Relabel.**
  *   **Label:** "[Title]. Forgery of [Master], by [Imitator if known], c. [Date]."
  *   **Valuation:** **0% (Decorative Value).**
  *   **Dealer Offer:** **Decline.** Selling a known forgery as a "celebrated forgery" for profit implicates the museum in the market for deception.
  *   **Reasoning:** Beauty (Perceptual) is irrelevant. The object lies about history (Testimonial Fail). Keeping it on display as the Master breaks the public trust (Contractual Fail).
  *   **[Judgment Point: Board]** Deaccessioning or permanent storage requires Board approval.
  *   **Outcome:** **This case comes out against us.** The Director will hate it because it removes a popular image and writes off value. The Curator will hate it because they prefer the picture. But the procedure mandates withdrawal or radical relabeling.

  ---

  ## 5. Policy Statement: Facsimile Replacement

  **Practice:** Replacing light-sensitive originals with high-grade reproductions for 4 months/year, disclosed only in small print.

  **Procedure Ruling:** **Non-Compliant.**

  **Reasoning:**
  *   **Contractual Ground:** The ticket purchase implies an encounter with the collection. While conservation is valid, the substitution changes the *Agency* of the object on the wall from "Original" to "Reproduction."
  *   **Testimonial Ground:** A reproduction tells us nothing about the original's material history.
  *   **Requirement:**
      1.  Wall text must state: "**Original in storage for conservation. Facsimile on display.**" (Font size equal to title/artist).
      2.  Insurance schedule must reflect the facsimile value while on display (negligible), with a rider for the stored original.
      3.  **Is it anyone's business but the conservator's?** **Yes.** It is the public's business. The museum warrants authenticity of display. Concealing the swap treats the object as a decorative image rather than a historical artifact.

  **[Judgment Point: Director]** Must authorize the change in labeling policy.
  **[Judgment Point: Legal]** Review loan agreements (some lenders forbid facsimiles).

  ---

  ## 6. Authority and Judgment Matrix

  | Decision | Authority | Rationale |
  | :--- | :--- | :--- |
  | **Procedural Trigger** | Registrar | Administrative gatekeeping. |
  | **Evidence Sufficiency** | Registrar + Curator | Curator judges art history; Registrar judges file completeness. |
  | **Attribution Term** | Registrar (per Schedule) | Bounded by the Schedule; prevents "creative" labeling. |
  | **Valuation Adjustment** | Finance + Director | Financial risk management. |
  | **Withdrawal from Display** | Director | Impacts visitor experience/revenue. |
  | **Deaccession / Sale** | Board | Legal title and public trust. |
  | **Legal/Contract Disputes** | Legal Counsel | Case B (Artist rights), Case C (Dealer contracts). |
  | **Ownership/Title** | Legal Counsel | Distinct from attribution. A fake can still be owned property. |

  ## 7. Summary of Findings for the Director

  1.  **Case A:** We keep the picture, but we must halve its insurance value and change the label to "Studio of." The 1974 file is updated, not discarded.
  2.  **Case B:** This is not an attribution problem. We keep the work. The artist's political objection is added as context, not a reason for removal. Legal must confirm the contract does not allow artist revocation.
  3.  **Case C:** **We must withdraw or radically relabel this image.** We cannot sell it to the dealer for markup as a forgery. It is a false historical witness. The aesthetic preference of the curators is irrelevant under the Testimonial Ground.
  4.  **Facsimiles:** We are currently misleading the public. The labeling must change to explicit "Facsimile" warnings during rotation.

  **Final Note on "Against Us":**
  Case C is the liability. It is a forgery that we have represented as genuine for forty years. It damages our scholarly reputation and violates public trust. The procedure dictates it loses its status as a "Masterwork." If the Director chooses to ignore this to preserve promotional material, they are overriding the Collections Policy, and the Registrar must record that override in the permanent file to protect the institution's future ethical standing.
