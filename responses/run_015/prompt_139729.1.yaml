answer: |-
  ### I. The Mapping

  To read the He Jiankui episode as an instance of the unilateralist's curse, we must abstract from the biology to the decision-theoretic structure. The curse, as formalized by Bostrom, Douglas, and Sandberg, arises when multiple agents can independently undertake an initiative that is socially harmful but privately beneficial, where the action of *any single agent* is sufficient to trigger the harm.

  **1. The Agents**
  The agent set is not merely He Jiankui. It is the competitive ecosystem of principal investigators capable of performing germline editing on viable embryos. This includes:
  *   **Individual Labs:** Competing for priority in high-impact journals and breakthrough status.
  *   **Institutions & Funders:** Universities and venture capital seeking prestige and IP rights in a nascent biotech market.
  *   **States as Jurisdictions:** Regulatory environments (e.g., China vs. US vs. UK) competing for biotech dominance. The work was done in Shenzhen not merely by chance, but because the regulatory friction was perceived to be lower (or enforcement weaker) than in the West.
  *   **The "Unilateralist":** He Jiankui is the specific agent who pulled the trigger, but he acted within a distribution of agents who *could* have.

  **2. The Action and Option Set**
  *   **Action:** Clinical implantation of CRISPR-edited embryos resulting in live birth.
  *   **Option Set:**
      *   *Option A (Restraint):* Adhere to the international consensus (2015/2017 summits) that clinical use is premature pending safety/ethical resolution.
      *   *Option B (Defection):* Proceed unilaterally to achieve the first "CRISPR babies."
  *   **Sufficiency:** The social harm (irreversible germline contamination, public backlash) occurs if *one* agent chooses Option B. It does not require a majority.

  **3. Payoff Asymmetry**
  *   **Private Upside (Captured by Actor):** Priority claim (the "first"), potential commercial IP, massive media attention, funding leverage, and the claimed medical benefit to the specific patients (HIV resistance).
  *   **Social Downside (Distributed):**
      *   *Field-wide:* Loss of public trust, heightened regulatory scrutiny, moratoria that delay legitimate research (the "license to operate").
      *   *Subject-level:* Unknown health risks to the children and their descendants (non-consenting third parties).
      *   *Geopolitical:* Erosion of norms regarding human experimentation.
  *   **The Asymmetry:** He internalized the fame and potential profit; the field and the children internalized the risk and reputational cost.

  **4. The Formal Result and Counterintuitive Half**
  The formal model predicts that the probability of the risky action occurring is $1 - (1-p)^n$, where $p$ is the probability an individual agent judges the action favorable, and $n$ is the number of capable agents.
  *   **Prediction:** As the field matures, $n$ increases (more labs can do it) and technical friction decreases.
  *   **Counterintuitive Half:** Improving the capability of agents or disseminating information (making CRISPR cheaper/easier) *increases* the likelihood of the harmful outcome, even if no individual agent becomes more reckless. The very success of the scientific community in democratizing the technology makes the taboo more fragile.

  ---

  ### II. The Honest Part: Where the Frame Distorts

  The unilateralist's curse is a clean theoretical model; the He Jiankui case is a messy sociological reality. Here is where the mapping strains.

  **(i) The Commons vs. The Curse**
  You ask if this is simply a commons problem. A Tragedy of the Commons involves rivalrous consumption of a shared resource (here, public trust). A commons analysis explains *why* trust is depleted. However, the "Curse" label earns its keep by explaining the *dynamics of capability*. In a standard commons, adding more agents usually dilutes individual impact. In the unilateralist's curse, adding more capable agents *increases* the systemic risk because the threshold for harm is singular (one birth is enough to trigger the backlash). The label is useful only insofar as it highlights that *scientific progress itself* (more $n$, better tech) is the risk multiplier, not just greed.

  **(ii) The Ex Post Private Cost**
  The payoff structure assumes the unilateralist gains. He Jiankui was imprisoned, disgraced, and his work retracted.
  *   *Distortion:* The model assumes rational calculation *ex ante*. He likely discounted the probability of criminal enforcement (China had no specific ban at the time, though general medical laws applied). He anticipated a Nobel trajectory, not a prison cell.
  *   *Break:* If the private cost *ex ante* was accurately priced (i.e., if he knew jail was certain), the curse wouldn't trigger because $p$ (probability of judging it favorable) would drop to near zero. The episode suggests the actor was either irrational or operating on flawed intelligence regarding enforcement, which the standard curse model (assuming rational agents) does not fully capture.

  **(iii) Norms vs. Mechanisms**
  The curse prescribes a "principle of conformity": defer to the consensus or the most conservative member.
  *   *Distortion:* The field actually built registration and moratoria *after* the fact. You cannot register a unilateralist before they act; the first act is by definition unregistered.
  *   *Break:* The curse literature assumes agents can voluntarily adopt a norm of restraint. In reality, the "mechanism" installed (criminal bans, registration databases) is coercive and post-hoc. The curse describes a failure of *voluntary* coordination; the solution required *involuntary* governance. The theory explains the failure but offers no practical tool for prevention other than "don't do it," which is precisely what failed.

  **(iv) The Fourth Break: Secrecy and Fraud**
  The standard unilateralist's curse assumes agents decide independently but openly (or at least, that the decision is a matter of judgment). He Jiankui did not merely disagree with the consensus; he violated it through deception. He forged ethics approval documents and concealed the pregnancy until birth.
  *   *Break:* This is not a disagreement on value (where the curse applies); it is a breach of protocol and law. The curse models honest disagreement among well-meaning actors. It does not model bad actors gaming the system. By framing this as a "curse," we risk sanitizing the fraud as a mere coordination failure.

  ---

  ### III. Evaluation: Prescription, Positioning, and Verdict

  **What Theory Would Have Prescribed**
  The unilateralist's curse prescribes a **pre-commitment strategy**. Agents capable of the action should bind themselves to a decision procedure (e.g., a binding international registry) *before* acquiring the capability to act individually. It demands that the decision to edit germlines be removed from the individual lab level to a collective body.

  **Positioning**
  Was anyone positioned to follow this?
  *   **No.** The international summits (2015, 2017) produced guidelines, not treaties. There was no supranational body with enforcement power.
  *   **He Jiankui:** Positioned to defect because jurisdictional arbitrage allowed him to operate in a regulatory gap.
  *   **The Field:** Positioned only to condemn, not to prevent. They lacked the mechanism to enforce the "principle of conformity."

  **Verdict: Anomaly or Wrong Instrument?**
  The episode is an **anomaly that stresses the instrument to breaking**.
  *   It **confirms** the incentive structure: The race for priority and the diffusion of technology created the pressure for defection.
  *   It **contradicts** the rationality assumption: The level of deception suggests this was not a "well-meaning unilateralist" scenario (the classic case for the curse) but a calculated fraud.
  *   **Conclusion:** The unilateralist's curse is the *wrong instrument* if used to excuse the behavior as a systemic inevitability. It is the *right instrument* only to explain why the *systemic safeguards* failed to scale with the *technical capability*. It explains the vulnerability, not the specific crime.

  ---

  ### IV. Required Extensions

  To call this an instance of the curse without it being mere relabeling, the theory requires three specific extensions:

  1.  **Jurisdictional Competition:** The standard model assumes a homogeneous agent set. This case requires modeling agents embedded in competing regulatory states. The "cost" of restraint is higher for agents in lax jurisdictions, skewing $p$ (probability of action) based on geography, not just ethics.
  2.  **Externalities on Non-Agents:** The curse typically concerns public goods (e.g., geoengineering). Here, the primary victims (the children) were outside the agent set and could not consent. The theory must be extended to account for *intergenerational* and *subject-level* externalities, not just field-wide reputational damage.
  3.  **Stealth Unilateralism:** The standard curse assumes the action is observable or that the decision is the critical point. He Jiankui's action was hidden until irreversible. The theory must be extended to cover **information asymmetry**, where the unilateralist hides the action until the "harm" (birth) is a *fait accompli*, rendering pre-emptive coordination impossible.

  Without these extensions, applying the "unilateralist's curse" to He Jiankui is a category error that treats a regulatory failure and ethical breach as a game-theoretic inevitability. With them, it becomes a powerful diagnostic for why global scientific governance fails in the face of rapid, decentralized technological diffusion.
