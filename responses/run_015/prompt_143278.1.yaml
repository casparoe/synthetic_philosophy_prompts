answer: |-
  Your tripartite hypothesis—Specifiability, Solvability, and Maintainability/Incentive-Compatibility—is the correct diagnostic key. The deadlock persists because the two sides are arguing past each other across these three dimensions, treating a failure in one as a refutation of the whole. The modern claim (that data and compute settle the debate) is indeed vulnerable to your suspicion: it largely addresses Solvability, makes a contested claim about Specifiability, and frequently ignores Maintainability.

  Here is the diagnosis of the impasse, broken down by the nature of the disagreement.

  ### 1. The Verbal Disagreement: The Ontology of "Data"
  A significant portion of the impasse is verbal, turning on whether "data" is treated as a *property of the world* or a *byproduct of interaction*.

  The pro-planning side (modern algorithmic variant) treats Specifiability as an engineering problem: if we have enough sensors and logs, we have the data. The anti-planning side (Hayekian variant) treats data as epistemic: the relevant "data" (opportunity costs, subjective trade-offs) do not exist until agents are forced to choose under scarcity. To Mises and Hayek, a price is not a measurement of a pre-existing magnitude; it is the crystallization of a counterfactual negotiation. Machine learning excels at interpolating within existing data distributions but struggles to price goods or states that lie outside the training distribution (the "new goods" problem).

  **Distinction to apply:** "Distinguish whether your algorithm treats preferences as fixed inputs to be optimized or as emergent outputs of a discovery process."

  ### 2. The Clash of Standards: Existence Proofs vs. Epistemic Processes
  The second layer is a clash of standards of evidence. The Lange/Modern side relies on *existence and convergence* results (Solvability). If you can write the Lagrangian and show the gradient descent converges, the problem is "solved." The Mises/Hayek side relies on *process* arguments (Maintainability). They argue that the time required to converge exceeds the time in which the parameters remain valid.

  In computational terms, this is a race between the *iteration speed* of the planner and the *volatility* of the environment. A convergence proof is mathematically valid but economically vacuous if the objective function mutates faster than the optimizer can descend. The 1989 collapse is cited as evidence that the iteration speed was too low; the modern claim is that compute has increased iteration speed enough to win the race. This is an empirical claim, not a theoretical one, but it is often defended with theoretical proofs.

  **Distinction to apply:** "Ask whether the convergence guarantee holds when the objective function changes faster than the iteration step."

  ### 3. The Substantive Disagreement: Codifiability and Incentives
  The deepest layer is substantive, concerning the nature of knowledge and the integrity of the input stream.

  **On Specifiability (Codifiability):** The modern claim assumes that "knowledge of particular circumstances of time and place" can be digitized without loss. However, much economic knowledge is tacit (Polanyi's problem) or contextual. A sensor can measure inventory, but it cannot easily measure the *likelihood* of a machine breaking down next week based on a specific vibration sound known only to the operator, unless that operator has an incentive to label it. If the data required for Specifiability requires human interpretation to generate, you have not solved Specifiability; you have merely pushed it back one step to the human interface.

  **On Maintainability (Incentives):** This is where your hypothesis is strongest. Lange's model assumed benevolent managers. Modern platform logistics often assume compliant users or employees. But if the algorithm sets quotas based on reported capacity, agents have a strict incentive to under-report capacity (ratcheting). Mechanism design solves this theoretically (VCG, etc.), but implementing truth-telling mechanisms at the scale of a national economy (or even a large platform's internal labor market) introduces transaction costs that often outweigh the efficiency gains of centralization. The modern argument often conflates *technical feasibility* (we can process the data) with *institutional feasibility* (agents will provide accurate data).

  **Distinction to apply:** "Verify whether the agents providing the training data benefit from misrepresenting their local constraints."

  ### The Hidden Empirical Question
  There is a hidden empirical question doing most of the work, and it is in principle answerable, though difficult to measure. It is the **Lag-to-Volatility Ratio**.

  *   **Lag:** The time delay between a change in local conditions, the reporting of that change to the central algorithm, the re-computation of the plan, and the dissemination of new instructions.
  *   **Volatility:** The rate at which local conditions change in a way that renders the previous plan suboptimal.

  If Lag < Volatility, central planning (or algorithmic coordination) is viable for that domain. If Lag > Volatility, decentralized price signals are superior because they compress the information into a single magnitude instantly.

  In 1920, Lag was measured in months (statistical bureaus) and Volatility was high. In 2020, Lag is measured in milliseconds (APIs) for some domains (logistics, ad auctions) but remains high for others (R&D, capital investment). The debate is deadlocked because one side points to the domains where Lag < Volatility (Amazon warehouses) and the other points to where Lag > Volatility (innovation, labor reallocation).

  ### What Counts as Progress?
  Progress will not come from a verdict on 1920 or 1989. It will come from decomposing the economy into sectors based on the Lag-to-Volatility Ratio and the Codifiability of Knowledge.

  A productive reframing would stop asking "Is planning possible?" and start asking "For which subsets of economic activity does the marginal cost of codifying knowledge exceed the marginal benefit of coordinating it centrally?"

  **Distinction to apply:** "Measure the fraction of relevant production knowledge that can be digitized without losing its operational utility."

  ### Diagnosis of the Modern Claim
  Your suspicion is correct: the modern argument re-runs the original dispute by claiming that "Big Data" solves Specifiability and "Deep Learning" solves Solvability, while treating Maintainability as an engineering bug rather than a structural feature.

  However, you should test this by looking for *hybrid* architectures. The most successful modern "planning" systems (e.g., internal logistics at large firms) are not purely central nor purely market. They use central algorithms for routine, high-frequency, low-codifiability-cost tasks (Solvability/Specifiability met) and internal transfer prices or autonomy for novel, low-frequency, high-codifiability-cost tasks (Maintainability/Incentives preserved).

  The deadlock breaks if you stop treating "Market" and "Plan" as binary states and treat them as points on a spectrum of *information compression*. Prices are high-compression lossy signals; Plans are low-compression lossless signals (attempted). The economic question is simply: how much loss can the system tolerate before the signal becomes useless?

  **Distinction to apply:** "Determine the compression ratio at which the central signal loses enough fidelity that local deviation becomes more profitable than compliance."

  ### Summary
  The impasse is 20% verbal (definition of data), 30% methodological (proof vs. process), and 50% substantive (incentives and the speed of change). The modern claim fails to settle the debate because it addresses the 20% and 30% while assuming the 50% away. Progress lies in measuring the boundary conditions where the 50% becomes binding.
