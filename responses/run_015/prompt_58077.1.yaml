answer: |-
  This is one of the classic problems in political theory, often called the **"Boundary Problem"** or the question of **"Who constitutes the *demos*?"**

  Your observation hits on a fundamental tension in the American system: Is the US a club of **citizens** (a national community), or is it a **government of a territory** (a geographic jurisdiction)?

  Here is the breakdown of what the current patchwork presupposes, where it contradicts itself, and what would happen if you actually switched to the "All Affected Principle."

  ---

  ### 1. What the Current Setup Presupposes

  To make sense of the current rules (Expat votes, Green Card holder doesn't, School Board sometimes does), the US system is operating on three different, conflicting theories of membership simultaneously.

  #### A. The Federal Rule: Citizenship as "Perpetual Allegiance"
  **The Rule:** Your cousin in London votes; your neighbor with the Green Card does not.
  **What must be true for this to make sense:**
  *   **Membership is identity-based, not location-based.** The US presupposes that political membership is a bond of blood or legal naturalization that never truly breaks, even if you leave the territory.
  *   **The State belongs to the Nation, not the Land.** Sovereignty resides in "We the People" (defined legally as citizens), not in "Everyone currently on this soil."
  *   **Expats retain a "potential return" interest.** The law assumes your cousin might come back, so she needs a say in who leads the country she might return to.

  #### B. The Local Exception: Stakeholder Theory
  **The Rule:** Some cities let non-citizens vote for school boards.
  **What must be true for this to make sense:**
  *   **Membership is about specific investment.** If you pay into a specific system (property taxes/school taxes) and your direct dependents use it (kids in school), you earn a voice *for that specific issue*.
  *   **Local governance is administrative, not sovereign.** Cities view themselves more as service providers (HOAs) than nations. If you pay the HOA fees, you get to vote for the board, regardless of your passport.

  #### C. The General Exclusion: Legal Status over Contribution
  **The Rule:** Your Green Card neighbor pays taxes and obeys laws but can't vote for Mayor.
  **What must be true for this to make sense:**
  *   **Voting is a privilege of membership, not a right of subjection.** The system presupposes that being subject to the law ("stuck living with the decisions") is not enough to grant power. You must be initiated into the "club" (naturalization).
  *   **Integration is a prerequisite for trust.** The state assumes that without the formal oath of citizenship, you cannot be trusted with the levers of power, regardless of how long you've lived there.

  ---

  ### 2. Is it Inconsistent?

  **Yes.** The expat part and the Green Card part presuppose opposite things.

  *   **The Expat Vote** presupposes that **Citizenship > Residence.** (You don't live here, but you belong, so you vote.)
  *   **The Green Card Exclusion** presupposes that **Citizenship > Contribution/Subjection.** (You live here and pay, but you don't belong, so you don't vote.)

  **What "Kinda Fits" vs. What "Strictly Needs to be True":**

  *   **What Strictly Needs to be True:** For the current system to be logically consistent, you must accept that the United States is a **national ethnic-legal community** first and a geographic territory second. The primary unit of democracy is the *citizen*, not the *resident*.
  *   **What it Only "Kinda Fits" With:**
      *   **"No Taxation Without Representation":** This is violated by the Green Card holder. They pay federal and local taxes but have no vote.
      *   **"Consent of the Governed":** This is violated by both. The expat is rarely "governed" by US daily law in London, while the Green Card holder is fully governed but hasn't consented via the ballot.
      *   **"One Person, One Vote":** This is violated by the sheer existence of a class of adult residents (Green Card + undocumented) who are numerically significant in some districts but politically invisible.

  ---

  ### 3. Switching to the "All Affected Principle"

  If we actually switched to the rule you suggested—**"Anyone affected by a government decision gets a say"** (often called the *All Affected Principle* in political philosophy)—the practical changes would be radical and administratively chaotic.

  Here is what would have to change in practice:

  #### A. The Voter Rolls Would Explode (and Shift)
  *   **Green Card Holders:** Would immediately gain voting rights in **all** elections (Federal, State, Local). In states like CA, NY, and FL, this would shift electoral outcomes significantly.
  *   **Undocumented Residents:** If the rule is "affected by decisions," undocumented people are subject to laws, police, and taxes. They would likely qualify for voting rights in local and potentially federal elections.
  *   **Expats:** Your cousin in London might **lose** her vote. Unless she can prove she is materially affected by US policy (e.g., she receives Social Security or has income sourced in the US), mere citizenship wouldn't count. The "affected" principle cares about *impact*, not *passports*.

  #### B. The Age of Voting Would Drop
  *   Children are profoundly affected by government decisions (schools, environment, debt). A strict "all affected" rule often leads theorists to argue for **lowering the voting age** (to 16 or even 14) or implementing "demyocracy" (parents casting proxy votes for kids), because kids are subject to the laws just as much as adults.

  #### C. Jurisdictional Boundaries Would Blur
  *   **Transnational Voting:** If the US passes a climate law that affects Mexico, do Mexicans get a say? If the Fed raises interest rates and crashes the Euro, do Europeans vote for the Fed Chair?
      *   *Practical Fix:* Usually, this principle is limited to **"All Subjected"** (everyone within the jurisdiction) rather than **"All Affected"** (everyone in the world impacted). If you limit it to "All Subjected," non-citizen residents vote, but foreigners don't.
  *   **Prisoners:** Felons in prison are heavily affected by laws. Disenfranchisement would end immediately.

  #### D. Administrative Nightmare
  *   **Verification:** Currently, voter rolls are checked against citizenship databases (SSN, Naturalization records). Under an "affected/resident" model, verification would switch to **tax records or census data**.
  *   **Turnover:** Voter rolls would become much more volatile. People move in and out of "affected" status (or residency) much faster than they gain/lose citizenship. Elections would require constant registration updates.

  #### E. Political Incentives Would Change
  *   **Immigration Policy:** Currently, citizens vote on immigration rules for non-citizens. If non-citizens could vote, immigration policy would likely become much more liberal, as the people currently excluded would be voting on their own inclusion.
  *   **Foreign Policy:** If expats lost the vote, foreign policy might become less focused on diaspora interests and more focused on domestic concerns.

  ### Summary

  The current US patchwork presupposes that **the Nation (citizens) owns the State.** It prioritizes the integrity of the national club over the democratic legitimacy of the territory's governance.

  *   **Current Logic:** "You vote because you are **one of us** (Citizen), not because you are **here** (Resident)."
  *   **Your Proposed Logic:** "You vote because you are **here** (Resident/Affected), regardless of whether you are **one of us** (Citizen)."

  Switching to your rule would solve the "taxation without representation" problem for your Green Card neighbor, but it would create a new problem: it would detach voting from national allegiance, potentially turning elections into a contest of temporary residents rather than a long-term community deciding its future. It trades **National Identity** for **Democratic Consistency.**
