      *   *The "One vs. Two" Question:* This is the crux. Use the "pattern" argument. If the loop encompasses both, it's one "I".
      *   *The Shared Vocabulary:* This is the killer feature. If the symbol "I" is defined by the interaction, cutting the link breaks the definition. It's not just losing a connection; it's losing the *meaning* of the symbol.
      *   *The Split:* When the bridge cuts, the "I" doesn't just divide; it *shatters* or *fades*. Both survivors are "ghosts" of the original pattern.
      *   *The Misconception:* The "WiFi" analogy. Explain why bandwidth and *type* of signal matter (qualia/symbol grounding vs. data packets).
      *   *Conclusion:* Summarize the ontological status. The self is a verb, not a noun.

  8.  **Refining the Tone:**
