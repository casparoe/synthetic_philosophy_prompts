answer: |-
  They claim they cannot logically know
  If I intend the test for Monday.
  They start their proof upon a Thursday,
  Saying it cannot be a Tuesday,
  Nor any prior day like Wednesday,
  Until they ban the final Friday.

  With no escape allowed on Friday,
  They say the outcome they will know.
  So Thursday cannot stand on Wednesday,
  For if it did, then preceding Monday
  Would make it simply Tuesday.
  So logic cancels out the Thursday.

  They quietly erase the Thursday,
  And say the pattern holds for Friday.
  But if the test is set for Tuesday,
  Then no one here can claim to know.
  Unless we reach the final Monday.
  So Wednesday is stripped away, Wednesday.

  The week begins with Wednesday.
  And ends before the Thursday.
  The logic tightens round the Monday.
  They say they cannot fail on Friday,
  Nor find a way to stop and know.
  The calendar is blank on Tuesday.

  They eat the Tuesday, eat the Wednesday,
  And clean the plate before the Friday.
  Then turn their hungry eyes to Thursday.
  And find the room is empty Thursday.
  There is no way for them to know.
  The calendar is blank on Monday.

  The week is gone, beginning Monday.
  And ending with the last of Tuesday.
  They think they have the right to know.
  But I have held the paper Friday.
  And waited through the long of Wednesday.
  To give the test and let them know.

  They say they know the date on Monday,
  That Tuesday hid behind the Thursday,
  But Wednesday was the Friday surprise.
