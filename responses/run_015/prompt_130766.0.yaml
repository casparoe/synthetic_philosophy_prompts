answer: |-
  Hi there, good luck with the reading group next week, it sounds like a proper minefield but also genuinely interesting stuff. Here is the prep sheet you asked for, written out as a continuous note so you can just read through it without getting distracted by formatting. The first objection you will almost certainly get comes from the metaphysicians, probably the senior one who likes talking about supervenience, and they will say that you are conflating epistemic access with ontological structure, arguing that just because an embedded observer cannot specify initial conditions doesn't mean the conditions themselves aren't determinate. Your reply should be that specification is a physical process requiring energy and information storage which is subject to the same chaotic dynamics, so the conditions cannot exist independently of the apparatus specifying them, meaning you concede that a God's eye view might logically hold but hold firm that for any physical agent determinism is undefined, and the soft spot here is that you are leaning heavily on a verificationist principle which alot of realists will reject outright. Next the climate modeller will jump in, likely quite politely but with dangerous precision, to say that shadowing lemmas are strictly about numerical stability in discrete maps and not about belief revision or ontology, so you need to reply that the structural stability required for shadowing implies a constraint on how any physical subsystem can track the whole, conceding that the maths is numerical but holding that the physical instantiation of that maths in a brain or computer inherits the limitation, though you must admit this is where your analogy is stretched thinnest because numerical error isn't exactly the same as semantic belief. Then one of the metaphysicians will bring up Laplace's Demon explicitly, asking why the demon couldn't just be outside the system, to which you should say that a demon outside the universe is physically impossible and therefore irrelevant to a philosophy of science grounded in actual practice, conceding that it works as a logical possibility but holding that it has no purchase on scientific realism, and be careful here because this sounds like you are changing the subject from metaphysics to methodology. The grad student will inevitably ask if this saves free will, probably looking quite hopeful, and you need to shut that down gently by saying this is about the conditions of knowledge not agency, conceding that it makes determinism less threatening but holding that it doesn't grant libertarian freedom, which is a soft point because it might look like you are dodging the exciting implication they want to hear. Another metaphysician will ask whether you are denying the reality of trajectories altogether, suggesting you are slipping into instrumentalism, so you should reply that trajectories are real but not uniquely identifiable, conceding that something causes the weather but holding that the specific path is model-relative, which is risky because it sounds like anti-realism. The modeller might come back with a point about data assimilation, noting that they do successfully update beliefs about the climate state all the time, and you should agree that this is exactly your point, that successful assimilation is shadowing in action, conceding that they do it practically but holding that the philosophical implication is that the 'true state' is always a posterior construct, and the weakness is that this might make your view trivially true. Someone might then worry about solipsism, asking if embedding the observer means we lose objective science, to which you reply that intersubjective agreement is just multiple observers shadowing the same attractor, conceding that objectivity is weakened but holding it is not lost, though this is vague and you might struggle to define the shared attractor. Finally the question you are praying nobody asks is whether this whole argument collapses if quantum mechanics is true, since classical chaos assumes continuous states and QM introduces fundamental indeterminacy anyway, and if they ask this you should admit it is out of scope but note that classical chaos is still the relevant scale for macroscopic science, conceding that fundamental physics might be indeterministic but holding that your argument works for the effective theories we actually use, which is honestly your weakest link because if the base layer is indeterministic your whole critique of determinism becomes moot. Just remember to breathe and don't let the modeller bully you on the maths, you are doing philosophy not running simulations, and try not to sweat too much about the typos in your slides nobody will notice.
