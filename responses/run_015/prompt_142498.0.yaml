  There is no paper **letter**,
  Only the heart's own **measure**.
  I try to be **faithful**,
  But truth slips off the **tongue**.
  You say you were never **seen**,
  Only in stories **told**.

  Everything you **told**
  Arrives like a **letter**,
  As if it had been **seen**.
  I keep the time, the **measure**,
  I hold my **tongue**,
  Pretending to be **faithful**.

  How to be **faithful**
  To what was **told**,
  When the rhythm binds the **tongue**?
  The ink fixes the **letter**,
  The pulse demands a **measure**,
  Even if you weren't **seen**.

  I swear that you were **seen**,
  To make the vow **faithful**,
  To keep the steady **measure**.
  Though only rumors **told**
  Survive inside the **letter**,
  I speak it with my **tongue**.

  My **tongue**
   Lies that it has **seen**.
  The **letter**
   Remains **faithful**
   To the rhyme, not what is **told**,
   Bound by the **measure**.

  This is the **measure**:
  To speak with a borrowed **tongue**.
  Nothing is **told**
  Unless it is **seen**.
  The form stays **faithful**.
  The truth leaves the **letter**.

  *Envoi:*
  If I keep the **measure** strict, my **tongue**
  Claims what was never **seen** remains **faithful**;
  So much is **told** within this final **letter**.

  ***

  This poem argues that a form-preserving translation is not a copy of the original's meaning, but a recreation of its *constraint*; the version that keeps the meter is the more faithful one because it forces the translator to inhabit the same structural pressures as the source poet, even if that pressure distorts the facts. To achieve this, my version deliberately sacrificed the marking of who witnessed what (the evidentiality), defaulting to direct knowledge ("seen") wherever the meter demanded certainty, rather than preserving the original's nuance of hearsay ("told"). The strongest objection a disagreeing translator would make is that this is an ethical breach: by smoothing over the evidential markers to save the rhythm, I have falsified the epistemic status of the utterance, turning a poem about uncertainty into one of false witness, and thereby betraying the source culture's grammar of truth.
