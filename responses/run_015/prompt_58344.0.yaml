answer: |-
  **(Walk to the podium, take a breath, smile)**

  Hi everyone. Congrats. Seriously. Look around. You did the thing.

  I know what's sitting in the back of the room besides your proud parents. I know you're all thinking about the elephant in the room. The AI elephant. You're worried you're graduating into a world where the junior developer job is already extinct.

  I'm a backend dev now, and I deal with this stuff daily. I'm not going to stand here and tell you "AI won't take your job." That's a lie. And I'm not going to tell you "It's just a fancy autocomplete, ignore the hype." That's also a lie.

  Here's the truth, told through two stories about a customer support bot my team runs.

  Story one: A user sends a ticket. It's a mess. It's half English, half Tagalog slang, and it uses the word "blorpt." "Blorpt" is our internal nickname for a stuck deployment. It is not a real word. The AI had never seen it in its training. But, we had uploaded our internal instruction manual into the tool. The bot looked at the mess, cross-referenced the manual, and figured out the user didn't want a refund—they wanted to cancel a stuck process. It stitched together the right steps. It looked… smart. It looked like it understood us.

  Story two: One week later. Same bot. A customer asks about our API version 4.7. There is no version 4.7. The bot confidently explains the new features of version 4.7, including "time-travel rollbacks." When the customer said, "That doesn't exist," the bot doubled down. It argued. It lied with total conviction.

  So, here is the question those two stories ask: Is this tool a brilliant teammate, or is it a liar that memorized a library?

  Here is what is settled science: We know how these things are built. They are math models designed to predict the next word in a sentence. They are looking for patterns. When it solved the "blorpt" ticket, it was matching patterns from our manual to the user's words.

  Here is what is *not* settled: Does matching patterns count as "thinking"? Does it "understand" what a refund is?

  Some of your instructors will tell you it's just statistics. No mind behind the eyes. Others will tell you it's reasoning emerging from complexity. Philosophers and computer scientists are still fighting about this. There is no consensus.

  And honestly? That uncertainty is your job security.

  Because whether the bot is "thinking" or just "predicting," it cannot take responsibility. When the bot invented time-travel rollbacks, it didn't care. It doesn't care if the code compiles. It doesn't care if the server crashes. It doesn't care if the customer gets refunded.

  You do.

  That is the advice I have for you. Don't try to out-code the machine. Don't try to ignore the machine. Use it like a very fast, very well-read intern who has no concept of truth.

  When it writes code, you verify it. When it suggests a fix, you test it. When it confidently tells you about API version 4.7, you check the documentation.

  The tool can handle the syntax. You handle the semantics. The tool can handle the pattern. You handle the purpose.

  Your parents here might not know what a pull request is, but they know what responsibility looks like. They know that showing up, doing the work, and owning the outcome is what matters. That is something a text predictor cannot do.

  So, let the instructors argue about whether the machine has a soul. You don't need to solve that today. You just need to know that while the machine can predict the next word, only you can decide if it's the right one.

  Go build something real. Verify your outputs. Own your mistakes. And please, never name a deploy state "blorpt" in production.

  Congratulations. You're hired.
