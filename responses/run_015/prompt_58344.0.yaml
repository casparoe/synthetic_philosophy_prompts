prompt: |-
  hey, I'm a backend dev with zero philosophy background, I dropped intro phil after like two weeks lol, and I got roped into giving a 5 minute pep talk to open my old coding bootcamp's graduation next Saturday and I could use help writing it.

  audience is tricky: like 40 new grads who are all freaking out that AI is gonna take their first junior job before they even start, plus their instructors, plus parents in the back who barely know what a chatbot is. two of the instructors are super vocal that LLMs are just autocomplete on steroids and don't actually understand anything so the grads shouldn't worry, and two others basically talk about our tools like they are junior teammates who get what you mean. I don't wanna get booed by either side and I definately don't wanna BS the grads just to make them feel better.

  I wanna build the whole speech around two weird moments I had with the customer support bot my team runs at work, because I think they show why this is confusing:

  one time a user wrote this messy ticket mixing english and tagalog slang plus our weird internal nickname blorpt for a stuck deploy state, a word the model could never have seen in training, but we had pasted our internal runbook into the context window. the bot correctly figured out from the mess that they wanted a cancel not a refund and stitched the runbook steps together with normal reasoning in a way that felt smart.

  and then like a week later the same bot confidently invented a fake version 4.7 of our API with time-travel rollbacks, and when the customer pushed back it doubled down and explained how to use the fake endpoint. totally made up.

  so I need a short, funny but honest opener that uses those two stories to give the grads some actually useful advice about working alongside these things without pretending we have solved whether they understand stuff or are just really good at predicting text. it can't be a lecture, my old teacher said keep jargon to zero so parents can follow, but it still has to land for the instructors who know all the parrot vs understanding debate talking points.

  can you draft it for me, and please make the speech itself clear about what is actually settled about how these models work vs what is still genuinely debated by people who study this stuff, don't present a contested take as the consensus just to make the advice sound cleaner.
