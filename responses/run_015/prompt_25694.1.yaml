prompt: |-
  Okay so this has become weirdly personal for me recently. My partner and I had this huge fight a couple months ago, and in the middle of it I realized I was absolutely certain I was right about what happened, but I also knew — at the very same time — that I was furious, sleep-deprived, and that my memory for arguments is notoriously terrible. I had this clear higher-order belief that my belief-forming processes were compromised, and yet my first-order confidence didn't budge. I was a walking case of epistemic akrasia. And it felt, honestly, irrational. Like I was doing something wrong epistemically, not just interpersonally.

  So I went down a rabbit hole on this and I've come to hold the view that epistemic akrasia is always irrational. Specifically: it's irrational to have a credence of, say, 0.9 in P while simultaneously believing that, given your evidence and your current cognitive state, a credence of 0.9 in P isn't the one your evidence supports. Your first-order attitudes have to be sensitive to your higher-order evidence about your own reliability. The levels can't float free.

  Now here's what I want. I want you to tell me what would count against this view. Not just the standard counterexamples that get trotted out in intro epistemology — I've already read about the drugged reasoner who still gets the math right. I want the full map of defeaters. What empirical results should worry me? What formal results? What edge cases that haven't been discussed much? Which objections do defenders of the no-akrasia view themselves concede have force, and which do they dismiss as question-begging? I want the defeaters ranked from "this might actually sink the view" down to "this is annoying but survivable."

  And I want an honest answer to this: has the no-akrasia position been qualified and hedged to the point where nothing could count against it? And if it has — is that actually a problem for a normative epistemic claim, or is that just what normative claims are like? I've noticed that when I try to pin down exactly what the view forbids, the goalposts seem to shift between "you can't have mismatched beliefs" and "you can't have mismatched beliefs while attending to the mismatch" and "you can't have mismatched beliefs that survive reflection." If the view just says "ideally rational agents don't do this," then what would ever show that an ideal agent could?

  Think very carefully before answering, and respond in the style of an expert epistemologist who's been in the trenches on this debate.
