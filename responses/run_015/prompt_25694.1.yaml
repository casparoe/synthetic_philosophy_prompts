      *   **Emotional State:** Personal investment ("weirdly personal," "huge fight," "felt... irrational"). There's a desire for clarity and rigor, perhaps to resolve internal tension about their own rationality during that fight.
      *   **Core Thesis:** Epistemic akrasia is *always* irrational. (The "No-Akrasia Principle" or NAP).
