  # JOINT STATEMENT ON DIACHRONIC CHOICE AND EXPLOITABILITY

  ## I. AGREED CLAIMS
  *The following claims regarding the mechanics and phenomenology of the money pump scenario are accepted by both camps as accurate descriptions of the setup.*

  1.  **Net Loss:** In the standard dynamic pump scenario, the agent ends with less of the relevant resource (e.g., money) than they started with, having completed a cycle of trades.
  2.  **Voluntary Exchange:** At each individual choice node, the agent chooses the trade voluntarily, without coercion, threat, or deception by the operator.
  3.  **Foreseeability:** In the standard dynamic case, the agent at the initial time ($t_0$) can foresee the sequence of offers and the resulting net loss before making the first choice.
  4.  **Preference Stability:** The agent's underlying ordinal preferences over the options remain constant throughout the sequence (e.g., $A \succ B \succ C \succ A$), unless explicitly altered by an act of will or precommitment.
  5.  **Ex Ante Welfare:** By the agent's own evaluation at $t_0$, the final state (after the cycle) is strictly worse than the initial state.
  6.  **No Interpersonal Transfer:** In the standard single-agent case, the loss is not offset by a gain to another party within the agent's locus of concern; the operator's profit is external to the agent's utility function.

  ## II. DISAGREEMENTS TABLE
  *The following core disagreements are stated neutrally. Each row describes the same point of contention, phrased in the terminology native to each camp.*

  | Topic | Camp A Formulation (Diachronic/Plan) | Camp B Formulation (Synchronic/Node) |
  | :--- | :--- | :--- |
  | **Locus of Assessment** | Rationality is a property of an extended agency; a defect in the temporal structure of choices constitutes a failure of rationality. | Rationality is a property of a discrete choice; a match between choice and current preference constitutes a success of rationality. |
  | **Nature of the Loss** | The net loss demonstrates **self-defeat**: the agent's own decision-making architecture undermines their own ends. | The net loss demonstrates **environmental cost**: the world is structured such that satisfying local preferences incurs a tax. |
  | **Role of Resoluteness** | Sticking to a prior plan is a **requirement** of rationality; deviating is a rational failure (dynamic inconsistency). | Sticking to a prior plan is a **virtue** of willpower; deviating is a rational success (fidelity to current preference) but a volitional failure. |
  | **Normative Force** | The possibility of a pump proves the preferences themselves are **defective** and ought to be revised. | The possibility of a pump proves the environment is **hostile** and ought to be navigated, but preferences need not change. |

  ## III. SPECIFIC CRUXES AND PREDICTIONS
  *For each of the following three scenarios, both camps agree on the factual setup. They disagree on the normative classification. Each camp has recorded a prediction regarding how the scenario bears on the theory of rationality.*

  ### Crux 1: Free Precommitment
  **Scenario:** At $t_0$, the agent knows the pump sequence is coming. She is offered a costless, irreversible mechanism to bind her future choices to prevent the cycle. She declines to use it.

  *   **Shared Test:** Does declining the bind constitute a *new* rational error, the *same* error as the pump susceptibility, or *no* error?
  *   **Camp A Prediction:** Declining is a **distinct, second-order irrationality**. The agent had the capacity to secure diachronic consistency and failed to exercise it. This is a failure of self-governance separate from the preference cycle itself.
  *   **Camp B Prediction:** Declining is **rationally permissible**. At $t_0$, binding the future self restricts the future self's ability to act on its local preferences. Declining preserves future rational agency. Any regret at the end is a cost of rationality, not a failure of it.

  ### Crux 2: The Impersonal Pump
  **Scenario:** Three distinct agents ($X, Y, Z$) exist simultaneously. They share identical cyclic preferences. $X$ trades with $Y$, $Y$ with $Z$, $Z$ with $X$. An operator facilitates the trades and profits. No agent trades with themselves over time.

  *   **Shared Test:** Does the normative criticism of the preferences (that they are "irrational" or "defective") survive the removal of diachronic identity?
  *   **Camp A Prediction:** The criticism **fails**. Without a single diachronic agent, there is no self-defeat. The loss is merely a distributive outcome of trade, not evidence of irrational preferences. The pump argument *requires* diachronic identity.
  *   **Camp B Prediction:** The criticism **was never valid**, but this case clarifies why. It shows that "exploitation" is simply a feature of markets with cyclic preferences. It confirms that node-rationality is compatible with group-level loss, reinforcing that rationality is not about preventing all losses.

  ### Crux 3: The Unvisited Agent
  **Scenario:** An agent possesses the same cyclic preferences but lives in a world where the specific sequence of trades is never offered. She never loses resources.

  *   **Shared Test:** Is the agent irrational/defective *now*, or only conditional on facing the pump?
  *   **Camp A Prediction:** The agent is **dispositionally defective**. Rationality is about the structure of the will, not actual outcomes. Possessing pumpable preferences is a flaw even if the flaw is never triggered, akin to having a logical inconsistency in one's belief system that is never queried.
  *   **Camp B Prediction:** The agent is **in no way defective**. Rationality assesses actual choices made. Without the offer sequence, there is no choice sequence to evaluate. A disposition to choose locally rationally cannot be a fault if it never leads to actual choice conflicts.

  ## IV. ANALYSIS OF VERBAL DISPUTE
  *Assessment of whether the disagreement is substantive or definitional.*

  A significant portion of the dispute is **verbal**, specifically regarding the definition of the term "rational."
  *   **Camp A** uses "rational" to mean "globally effective at achieving one's own ends over time."
  *   **Camp B** uses "rational" to mean "locally consistent with one's current motivational state."

  However, the dispute is not *purely* verbal. There is a **substantive** disagreement regarding the **normativity of planning**.
  *   If Camp A is correct, an agent *ought* to prioritize their $t_0$ evaluation over their $t_1$ evaluation when they conflict.
  *   If Camp B is correct, an agent *ought* to prioritize their $t_1$ evaluation over their $t_0$ evaluation when they conflict (or is at least permitted to do so).

  This substantive divergence persists even if we rename the concepts (e.g., "Rationality*" vs. "Rationality**"). The camps disagree on whether an agent is blameworthy for succumbing to a local preference that contradicts a prior plan, even when both are fully informed. Therefore, the dispute is a mixture of terminological divergence and conflicting normative commitments regarding the authority of past vs. present selves.

  \answer{mixed}
