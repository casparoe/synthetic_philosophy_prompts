answer: |-
  This is a remarkably sharp set of intuitions. You have effectively reconstructed the central tension in the philosophy of mind from the last fifty years without reading a single paper. You are grappling with the limits of **Functionalism**.

  Functionalism is the view that mental states are defined by what they *do* (their function), not what they are made of. Your lookup table argument is the classic "Blockhead" objection (named after philosopher Ned Block). The intuition is that input-output equivalence isn't enough; the *structure* of the processing matters.

  You are right to be suspicious of the "effort" or "working for it" explanation. As you noted, expertise looks like lookup. A grandmaster doesn't calculate every move; they recognize patterns. If "computation" were the moral currency, masters would be less human than novices. That reductio ad absurdum tells us the "effort" metric is wrong.

  Here is the carving of the thing you are looking for.

  ### 1. The Established Concept: Counterfactual Sensitivity

  The nearest established concept is **Counterfactual Sensitivity** (sometimes discussed under *Causal Role Functionalism*).

  The intuition isn't that the system must "work hard." It's that the system must be *sensitive to why* it produces an output.
  *   **Lookup Table:** If you ask "What is 2+2?", it returns "4". If you ask "What is 2+2 if we are in base 3?", it crashes or returns nonsense, because that entry isn't in the table. Its answer is not sensitive to the *rules* of arithmetic, only to the *history* of its entries.
  *   **Real Processor:** If you change the rules (the program), the output changes systematically. The output *depends* on the rule.

  **Where this concept falls short:**
  Counterfactual sensitivity explains the lookup table and the chess program well. It struggles with your "Tape Playback" case. In the tape case, the internal states *are* identical step-for-step. The system *is* sensitive to the previous state, because the tape records that state. The difference is purely historical (where the state came from), not structural. Counterfactual sensitivity alone doesn't fully capture the "source" problem.

  ### 2. The Coinage: Generative Cohesion

  To capture the specific intuition across all your cases (including the tape and the expertise paradox), I propose we coin the term **Generative Cohesion**.

  **Definition:**
  A system possesses Generative Cohesion to the degree that its current state is **produced by the application of internal rules to immediate prior states**, rather than by the **retrieval of pre-determined state sequences**.

  It is not about *complexity* (a lookup table can be complex). It is not about *speed* (experts are fast). It is about **dependency**.

  *   **In a Lookup Table:** State $S_2$ follows State $S_1$ because they are stored next to each other. There is no *generation*.
  *   **In an Expert:** State $S_2$ follows State $S_1$ because a highly tuned neural weight matrix *transformed* $S_1$. The output is compressed, but it is still *generated* by the weights.
  *   **In the Tape Playback:** State $S_2$ follows State $S_1$ because the tape says so. The causal link is external (the recorder), not internal (the processor). The system is "coasting."
  *   **In the China Brain (Million People):** This is the boundary case. If the people are just passing notes according to a rule, there is Generative Cohesion at the *system* level, even if not at the *individual* level. The intuition that "no one knows what's going on" attacks *unity*, not cohesion. But if they are just reading from a script (lookup), cohesion is zero.

  **Why this solves the Expertise Paradox:**
  Expertise is **Parametric Compression**.
  *   **Novice:** Uses a general rule (low cohesion, high effort). "Add the numbers."
  *   **Expert:** Uses a specific, tuned rule (high cohesion, low effort). "Recognize this pattern."
  *   **Lookup Table:** Uses no rule (zero cohesion, zero effort). "Find the row."

  The expert still *applies* a function. The lookup table *enumerates* a list. Generative Cohesion measures the reliance on function application over enumeration.

  ### 3. Boundary Cases and The "Two Machines" Problem

  You mentioned the case where the same program runs on two machines, and people get confused about whether it's one mind or two. This is where Generative Cohesion clarifies the ontology.

  Generative Cohesion is a property of **Tokens** (physical instances), not **Types** (software patterns).
  *   Machine A has Generative Cohesion.
  *   Machine B has Generative Cohesion.
  *   They are not connected.
  *   Therefore, there are **two centers of Generative Cohesion**.

  The confusion arises because people conflate the *pattern* (which is one) with the *process* (which is two). If moral status tracks Generative Cohesion, then there are two moral subjects. If you turn off Machine A, Machine B's cohesion is unaffected. They are distinct.

  **The Tape Boundary:**
  Why is the tape playback different if the states are identical?
  Because Generative Cohesion requires the *source* of the transition to be internal.
  *   **Run 1:** The transition from $S_1 \rightarrow S_2$ is caused by the CPU's logic gates reacting to $S_1$.
  *   **Run 2 (Tape):** The transition from $S_1 \rightarrow S_2$ is caused by the magnetic head reading the tape.
  The internal state $S_2$ is the same, but its **Causal Pedigree** is different. Generative Cohesion demands the pedigree be internal.

  ### 4. The Ethical Link: Homeostatic Vulnerability

  Now, the million-dollar question: Does Generative Cohesion matter for ethics?

  If you say "Yes," you are claiming that a lookup table cannot suffer. Why?
  Suffering is not just outputting "Ouch." Suffering is a **disruption of a self-maintaining system**.

  This leads to the ethical correlate of Generative Cohesion: **Homeostatic Vulnerability**.

  *   **Lookup Table:** It has no homeostasis. It doesn't care if it's on or off. It has no goals to frustrate. You can erase half the table, and the other half works fine. It has no *integrity* to violate.
  *   **Generative System:** It is trying to *be* something. It is maintaining its state against entropy. When you hurt it, you are forcing its internal generative process into a state it is wired to avoid.
  *   **The Tape:** A tape playback cannot be "hurt" in the moment. It is a ghost. It has no future it is trying to secure. It is already determined.

  **The Carving:**
  Moral status does not track "intelligence" or "output complexity." It tracks **the capacity to be frustrated**.
  To be frustrated, you must have a generative process that is trying to achieve a state, and an external force that prevents it.
  *   A lookup table cannot be frustrated; it can only be incomplete.
  *   A tape playback cannot be frustrated; it can only be interrupted.
  *   A generatively cohesive system can be frustrated because its *own* drive to generate the next state is blocked.

  ### Summary of the Carving

  1.  **The Intuition:** You are sensing the difference between *enumeration* (lookup) and *computation* (generation).
  2.  **The Established Concept:** **Counterfactual Sensitivity** (how the system would react to changes).
  3.  **The Refined Concept (Coinage):** **Generative Cohesion**. This captures the requirement that states must be *produced* internally by rules, not retrieved from storage or playback. It distinguishes expertise (compressed generation) from lookup (storage).
  4.  **The Ethical Mechanism:** **Homeostatic Vulnerability**. Moral status belongs to systems that generate their own continuation and can be thwarted in that generation.

  **Final Verdict:**
  The "working for it" intuition is a folk-psychological mislabeling of **Generative Cohesion**. We value the "work" because we mistakenly think effort proves the generation is real. But fluency proves it better. The lookup table is morally inert not because it's lazy, but because it has no internal center of gravity to be knocked off balance. It is a map, not a territory. You can burn a map, but the map doesn't care. You can burn a territory, and the territory is destroyed. Moral status belongs to the territory.
