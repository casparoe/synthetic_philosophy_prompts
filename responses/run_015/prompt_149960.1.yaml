  ### Philosophical Context Note

  **What's Settled (mostly):**
  *   **Wittgenstein rejected Essentialism:** Scholars agree Wittgenstein argued against the idea that all instances of a concept (like "game" or "language") share one common defining feature.
  *   **Family Resemblance:** The idea that concepts are held together by overlapping similarities (PI §66-67) is standard exegesis.
  *   **Meaning as Use:** The dictum that meaning is found in use within a specific context is foundational to both characters' arguments.

  **What's Contested (The Live Debate):**
  *   **Criteria vs. Symptoms:** There is significant disagreement over Wittgenstein's distinction between "criteria" (logically necessary conditions for applying a concept) and "symptoms" (empirically correlated evidence). Juno leans on a "criteria" reading (there *are* necessary conditions for "conversation"), while Mara leans on a "normative practice" reading (criteria shift based on community use).
  *   **Form of Life (*Lebensform*):** Scholars disagree on how restrictive this is. Does it require biological embodiment and shared human needs (Juno's view), or is it flexible enough to include new technological practices (Mara's view)?
  *   **The LLM Verdict:** There is no consensus. Some philosophers argue LLMs are merely "stochastic parrots" lacking intentionality (aligning with Juno), while others argue that if the functional role in society is identical, the philosophical distinction is moot (aligning with Mara).
  *   **Is Family Resemblance "Secretly Essentialist"?** Some critics (like Kripke or certain analytic philosophers) argue that selecting *which* similarities count as relevant presupposes a prior rule or essence, which is Juno's core accusation against Mara.
