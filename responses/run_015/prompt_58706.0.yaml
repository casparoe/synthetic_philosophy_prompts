  Core Idea in Plain Terms
  Tolstoy argues art is not about beauty or skill, but communication. A project counts as art only if the maker feels something specific and successfully transmits that feeling to the audience. The quality depends on "infectiousness": how sincerely the artist feels it, how clearly they express it, and how distinct the feeling is. Crucially, funding should prioritize feelings that unite people (grief, joy, forgiveness) over feelings that exclude or merely titillate (luxury, eroticism, exclusivity). Your job is not to judge technique, but to judge whether the proposed work will make strangers feel what the artist felt.

  Step-by-Step Procedure
  1.  **Identify the Claimed Feeling:** What specific emotion does the artist intend to transmit? If the proposal focuses on technical innovation, beauty, or pure entertainment without emotional transmission, **Stop and Reject.** Art must communicate feeling, not just display skill.
  2.  **Assess Infectiousness:** Will the audience catch this feeling? Evaluate three markers: **Sincerity** (does the artist seem compelled?), **Distinctness** (is the feeling specific?), and **Clarity** (is the expression accessible?). If the work relies on obscurity or seems commercially calculated rather than felt, **Stop and Reject.** Volunteers should ask: "Does this feel true?" If the description feels cold or marketing-driven, it fails. Given twenty minutes, trust your immediate emotional response.
  3.  **Assess Universality:** Does the feeling unite people or divide them? Prioritize feelings accessible to all humans (grief, joy, forgiveness) over exclusive feelings (class status, sectarian pride, sexual titillation). If the feeling is exclusive or merely fashionable, **Stop and Reject.** This ensures public funds serve the public unity.
  4.  **Panel Valuation:** Proposals passing steps 1–3 proceed to final voting. The panel must judge the *degree* of infectiousness. Philosophy sets the threshold; volunteers measure the intensity. This step acknowledges that philosophy cannot rank art, only define it. Document reasons in plain language for Council: "This project transmits shared grief clearly," not "It exhibits high aesthetic merit." If readers disagree on sincerity, **Flag for Discussion.** Select the most infectious until funds deplete and city requirements.

  Three Trial Applications
  **Proposal A (Choir):** Step 1 identifies grief (pass). Step 2 finds high sincerity and clarity despite technical clumsiness (pass). Readers note non-musicians are moved. Step 3 confirms grief is universal (pass). **Result: Fund.** The procedure values emotional transmission over musical skill, rewarding the amateur choir because they successfully unite the audience in shared loss. The clumsiness is irrelevant if the feeling travels.

  **Proposal B (Light Show):** Step 1 identifies "awe" but Step 2 reveals it is market-tested, lacking sincerity and distinctness (fail). It produces momentary stimulation, not lasting feeling. The emotion is manufactured, not felt by the maker. **Result: Reject.** Technical dazzle does not equal art under this framework. It classifies as entertainment, which is ineligible. The "awe" is physiological, not spiritual union. The proposal admits to using market-tested effects, failing the sincerity test immediately. It leaves no residual emotional connection.

  **Proposal C (Melodrama):** Step 1 identifies forgiveness (pass). Step 2 confirms sincerity and clarity (pass). Step 3 confirms universality (pass). **Result: Fund.** This outcome may displease the panel. They usually dismiss sentimental melodrama as lowbrow. However, Tolstoy's procedure requires funding it because it succeeds in transmitting a moral feeling to ordinary people more effectively than obscure, high-status work. The procedure forces you to privilege emotional truth over cultural prestige. You must fund the "bad" art that works over the "good" art that doesn't. This conflicts with typical arts council preferences for innovation, but aligns with the mandate for public unity. The panel must accept that "quality" here means moral reach, not sophistication. This is the disliked outcome: funding kitsch because it unites, while rejecting complex work that isolates. You cannot reject it based on taste.

  Limits and Required Judgments
  This procedure cannot objectively measure emotional intensity. Philosophy defines the *type* of value (union vs. exclusion), but volunteers must judge the *degree* of sincerity. You cannot algorithmically detect fake emotion; you must rely on human intuition. Additionally, "universality" is culturally contingent; what feels universal to one panel may seem exclusive to another. The procedure cannot resolve disputes about whether a feeling is truly moral or merely sentimental. Finally, it cannot predict future reception; it relies on projected infectiousness. When readers disagree on sincerity, philosophy offers no tiebreaker. You must vote. The system filters out non-art (entertainment/skill) but cannot rank valid art without human discretion. Council requires plain language, so avoid theoretical jargon when explaining rejections based on exclusivity. This requires courage.
