prompt: |-
  Write the joint statment that a committed Browning-style situationist and a committed Goldhagen-style cultural-eliminationist could both sign after a good-faith adversarial colaboration. I want a numbered section of agreed claims about Reserve Police Battalion 101—what they actually did during the 1942-43 actions, documented refusal rates, peer dynamics, and pre-war antisemitic socialization levels in the unit. Then a disagreements table with each side's position in wording they'd accept: one camp saying situational pressure and bureaucratic normalization explain the escalation, the other saying only a deep eliminationist culture makes near-universal compliance intelligible.

  The cruxes should cover (1) whether the escalation curve tracks cumulative moral injury and peer bonding more than activation of latent beliefs, (2) whether local-initiative killings like Jedwabne break the situational model or can be folded into peer-escalation dynamics under regional SS pressure during Operation Reinhard, and (3) whether 'ordinary' is descriptive or exculpatory.

  For each crux, name one concrete case or data pattern both sides agree is relevant—maybe company-level refusal-rate variation versus prior party membership in the Lublin district, or documented shaming rituals in specific platoons—and record each side's prediction in advance. If part of the dispute is verbal, say which part and why. Don't ask for citations, bibliographies, or reading lists; just draft the documment. Reach actual formulations they could both put their names to, not vague platitudes.
