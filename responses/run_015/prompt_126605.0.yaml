answer: |-
  ### Brainstorming Notes

  *   **Textual Location:** *Summa Theologiae*, II-II, Question 64, Article 7. Crucial to note Aquinas never uses the phrase "Doctrine of Double Effect" (DDE); that's a 20th-century label (often attributed to G.E.M. Anscombe or later Catholic moralists).
  *   **The Core Mechanism:** It's not just about "bad side effects." It's about the *object of the act*. The act itself must be morally neutral or good *before* consequences are weighed.
  *   **Intentionality:** Is intention a psychological feeling (what I feel in my heart) or a structural description of the action (what my will is directed toward)? Aquinas leans structural; moderns often read it psychologically.
  *   **The AI Problem:** DDE requires a *will*. Code has optimization functions, not wills. Does mapping "loss minimization" onto "intention" commit a category error? Or is functionalism enough?
  *   **Programmer vs. Car:** If the car is a tool (like Aquinas's sword), the moral burden shifts to the programmer. But if the car learns (machine learning), the programmer's original intent might diverge from the car's actual decision tree.
  *   **Proportionality:** Aquinas mentions "moderate force." In SDCs, this translates to risk thresholds. Is a 1% chance of death "disproportionate"?

  ***

  ### Part 1: Aquinas's Actual View (Settled vs. Contested)

  You are reading the right text, but we need to be careful not to project modern utilitarian calculations onto a 13th-century metaphysician.

  **What is Settled:**
  In *ST* II-II, Q. 64, Art. 7, Aquinas outlines three necessary conditions for lawful self-defense:
  1.  **The Object:** The act itself must be lawful (defending one's life is natural law).
  2.  **The Intention:** The agent must intend self-preservation, not the killing of the aggressor. He uses the phrase *praeter intentionem* (outside the intention) regarding the death.
  3.  **Proportionality:** The force used must be moderate (*moderamen inculpatae tutelae*). You cannot use a cannon to swat a fly, even in self-defense.

  **What is Contested:**
  Scholars disagree on how rigid the "intention" condition is.
  *   **The Psychological Reading:** Some argue Aquinas requires a specific internal mental state. You must consciously say, "I will to live, I do not will his death." If you feel a secret joy at the aggressor's death, the act becomes sinful, even if objectively necessary.
  *   **The Structural Reading:** Others (following Elizabeth Anscombe's revival of the concept) argue Aquinas is describing the *logic of the action*, not your feelings. If the death is not the *means* by which you save yourself, it is *praeter intentionem*, regardless of your emotional state. For example, if stopping the aggressor *requires* killing them (no other way), some argue the killing becomes intended as a means, violating Aquinas's condition. Others argue that as long as the *goal* is stopping the threat, the death remains a side effect even if foreseen as inevitable.

  Aquinas is not doing a cost-benefit analysis. He is determining the *moral species* of the act. If the death is intended, it is murder. If it is a side effect of a lawful act, it is not.

  ### Part 2: Intention — Wanting the Good vs. Not Wanting the Bad

  You asked: *Does not intending mean you have to actively want the good outcome, or just that you dont want teh bad one?*

  This is the crux of the "intention/foresight" distinction, and it is genuinely debated in moral philosophy.

  **The Minimalist View (Just don't want the bad):**
  Some interpreters suggest that as long as the bad effect (death) is not your *goal* or *chosen means*, DDE is satisfied. You could theoretically be indifferent to the good outcome (survival) as long as you aren't aiming at the bad one.
  *   *Critique:* Most scholars reject this for Aquinas. For him, human acts are defined by their *end* (telos). If you don't will the good end (self-preservation), the act lacks moral coherence. You must intend the good.

  **The Robust View (Actively will the good):**
  The stronger reading of Aquinas is that the will must be positively oriented toward the good effect. The bad effect is tolerated (*permittitur*), but the good effect is chosen (*eligitur*).
  *   *The "Weeds" Detail:* There is a nuance here called **oblique intention**. If I know with 100% certainty that the aggressor will die when I push them away, am I "intending" it?
      *   **Strict View:** Yes. If it's inevitable, it's effectively intended.
      *   **Loose View:** No. Inevitability does not equal intentionality. I can foresee the sun rising tomorrow without intending it. Aquinas seems to lean here: the death is *foreseen* but not *intended* because it falls outside the scope of what makes the action rational (saving oneself).

  **Verdict:** You cannot simply "not want the bad." You must positively will the good. However, you do not need to "desire" the good emotionally; you must choose it as the rational end of the action. The bad must be truly incidental to the plan, not a step in the plan.

  ### Part 3: The Algorithmic Twist (Can Code Intend?)

  This is where your intuition is sharp. Applying DDE to self-driving cars (SDCs) is a hot topic in machine ethics, but it hits a metaphysical wall.

  **The Problem of Agency:**
  DDE is a doctrine about *moral agents* (beings with reason and will).
  *   **View A: The Instrumentalist Position (Settled in Law, Contested in Ethics):** The car is a sword. A sword does not intend anything; the wielder does. Therefore, DDE applies to the **programmer** or the **manufacturer**, not the car.
      *   *Implication:* If the programmer writes code that says `if (pedestrians > 1) { swerve(); }`, the programmer is intending the death of the single pedestrian as a *means* to save the five. The programmer fails the DDE test because the death of the one is the mechanism by which the five are saved.
      *   *Counter-argument:* The programmer isn't in the car. They are setting a policy, not acting in self-defense. DDE might not fit this context at all.

  *   **View B: The Functionalist Position (Contested):** Some philosophers of AI (like those influenced by Daniel Dennett) argue that "intention" is just a stance we take toward systems that behave purposively. If the car's optimization function minimizes a "harm variable," we can speak metaphorically of the car "intending" to minimize harm.
      *   *The DDE Application:* If we treat the car as a quasi-agent, does it satisfy DDE?
      *   *The Glitch:* In code, the "decision" is often a calculation of probabilities. If the car calculates a 90% chance of killing Person A to save Persons B–F, is Person A's death a "side effect" or a "cost variable"?
      *   *Critique:* In DDE, the bad effect cannot be the *means*. In many SDC algorithms, the sacrifice of the one *is* the means to save the five (physically clearing the path). This violates the "means/ends" constraint of DDE. The algorithm treats the death as a weighted cost, which looks more like utilitarianism than double effect.

  *   **View C: The Rejectionist Position:** Many ethicists argue DDE is useless for AI because AI lacks *conscious foresight*.
      *   *Argument:* Aquinas requires the agent to *know* the bad effect is happening and *choose* to proceed anyway for a higher good. A sensor detects an object; a script executes. There is no "foreseeing" in the moral sense, only data processing.
      *   *Consequence:* We cannot use DDE to absolve the system. We must judge the outcomes directly (consequentialism) or judge the designers' negligence.

  **The "Spread Across Code" Issue:**
  You mentioned the decision being "spread across code and sensors." This touches on the **Problem of Many Hands**.
  *   In modern machine learning (neural networks), the decision isn't a clear `if/then` statement written by a human. It emerges from weights adjusted during training.
  *   *Philosophical Consequence:* No single human *intended* the specific swerve. The system "learned" it. If no one intended the death, can DDE apply?
  *   *Consensus:* There is no consensus. Some argue this creates a "responsibility gap" where DDE cannot function because there is no intentional agent to hold accountable. Others argue the deployment of the system constitutes a "general intention" to accept whatever risks the optimization function produces.

  ### Summary of the Weeds

  1.  **Aquinas:** Requires you to positively will the good (survival), not just dislike the bad (death). The death must not be the *method* of survival, just an unavoidable consequence of the method.
  2.  **Algorithms:** Do not have wills. If DDE applies, it applies to the humans behind the code.
  3.  **The Conflict:** SDC logic is usually utilitarian (minimize total harm score). DDE is deontological (certain acts are forbidden even for good outcomes). If the car sacrifices one to save five, it is treating the one's death as a *means* to the greater good. Aquinas would likely call this unlawful, regardless of the "good outcome."
  4.  **The Verdict:** You can't easily port DDE onto AI without redefining "intention." If you treat the code's optimization function as "intention," the car usually fails DDE because it calculates the death as a necessary cost (means), not a side effect.

  You've hit on a genuine tension in machine ethics: we want to use human moral frameworks (like DDE) to judge machines, but machines operate on logic (utilitarian optimization) that often violates the structural constraints of those frameworks.
