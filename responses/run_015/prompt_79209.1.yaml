      *   **Key Components Required:**
          *   Requirements list with cases (logged vs. pasture, dam, rewilding, rainforest vs. oil palm, r-strategists, empty forests).
          *   Distinctions that must not be collapsed (total vs. average, numbers vs. quality, fewer animals vs. less suffering).
          *   Currency problem (individual, hectare, biomass, NPP).
          *   Counterfactual problem (baseline).
          *   Ecological consistency (trophic cascades, density dependence, invertebrate dominance).
          *   Time horizon.
          *   Differentiation between genuine requirements vs. camp prejudices.
          *   **Crucial:** Flag incompatible requirements (trade-offs).
          *   **Crucial:** Identify the single requirement that knocks out the most popular answers.
          *   Format: List + Table is fine.

  2.  **Deconstruct the Core Problem:**
      *   The user is asking for a *normative* theory of ecosystem value based on *welfare* (sentience/suffering/flourishing), not just *descriptive* ecology or *instrumental* human value. This is effectively asking for a specification of "Wild Animal Suffering" (WAS) ethics or Ecological Utilitarianism.
      *   The challenge is that ecology describes *what is*, while welfare describes *what matters*. Bridging them is notoriously difficult.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Requirement 1: Case Coverage.* Needs to handle the specific examples given.
          *   *Case:* Logged vs. Pasture. (Complexity vs. Simplicity).
          *   *Case:* Dam. (Flow disruption).
          *   *Case:* Rewilding. (Intervention).
          *   *Case:* Rainforest vs. Oil Palm. (Biodiversity crash).
          *   *Case:* R-strategists. (The numbers game).
