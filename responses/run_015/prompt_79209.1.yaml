      *   *Requirement 2: Distinctions.* Total vs. Average is the classic repugnant conclusion problem. Numbers vs. Quality is intensity vs. duration.
      *   *Requirement 3: Currency.* Who counts? Individuals are the standard for welfare, but ecology thinks in biomass/energy.
      *   *Requirement 4: Counterfactuals.* Baseline is tricky. Pre-human? Current trajectory?
      *   *Requirement 5: Ecological Consistency.* Must respect trophic levels and the sheer volume of invertebrates.
      *   *Requirement 6: Time.* Discount rates? Long-term stability?

  4.  **Filtering Prejudice vs. Requirement:**
