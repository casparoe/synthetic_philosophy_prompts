  5.  **Identifying Incompatibilities (The "Hard Part"):**
      *   *Conflict 1:* Invertebrate Inclusion vs. Empirical Tractability. If invertebrates count, the numbers are astronomical and unknowable. If they don't, the theory is arbitrary.
      *   *Conflict 2:* Total Welfare vs. Ecological Stability. Maximizing total welfare might require unstable boom/bust cycles (r-strategists), while stability might mean lower total throughput.
      *   *Conflict 3:* Individual Currency vs. Ecosystem Holism. Welfare happens to individuals, but ecosystems function as systems. Aggregating individual welfare to an "ecosystem score" loses systemic properties.

  6.  **Identifying the "Killer" Requirement:**
      *   Which requirement kills the most popular views?
      *   *Candidate:* "Empirical Grounding." Most theories are philosophical hand-waving.
      *   *Candidate:* "Invertebrate Inclusion." If you include insects/nematodes, "preserve the rainforest" might become "burn it down to stop suffering" (depending on the balance of pleasure/pain). This upends conservationism.
      *   *Decision:* The "Sentience Boundary + Empirical Grounding" combo is the killer. But specifically, the requirement to *aggregate individual welfare across trophic levels* kills both naive preservationism and naive interventionism. Let's pinpoint the *Currency Problem* combined with *Ecological Consistency*. Actually, the **Counterfactual Baseline** is often the silent killer. No, the **Invertebrate Problem** is the biggest bullet to bite. If you count them, conservation changes radically. If you don't, you're arbitrary.
      *   *Refinement:* The requirement that knocks out the most answers is **Empirical Tractability of Sentience**. Most theories assume we know who suffers. We don't.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the rigor of the request. Define the scope (Normative Ecology/Welfare Ecology).
