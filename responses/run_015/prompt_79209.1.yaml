  9.  **Final Polish:** Check against the prompt's specific constraints (table is fine, flag prejudices, flag incompatibilities). Ensure the tone matches the user's analytical skepticism. (e.g., use terms like "normative spec," "empirical tractability," "moral patienthood").

  **(Self-Correction on the "Killer Requirement"):**
  I initially thought about Empirical Tractability. But actually, the requirement that **"The theory must yield a determinate verdict on the Rainforest vs. Oil Palm case without smuggling in 'biodiversity = good'"** is the real killer. Most conservation ethics rely on biodiversity as a proxy for good. If the metric is *welfare*, biodiversity might be neutral or bad (if more species = more predation/suffering). So the killer is **Decoupling Welfare from Biodiversity.**
