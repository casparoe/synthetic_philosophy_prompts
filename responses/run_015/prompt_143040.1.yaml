  # Seminar Sorting Tree: Virtue Ethics & The Situationist Challenge

  **Instructions:** Follow the branches based on your intuitive response to the claims. Note the epistemic status markers **[Settled]** and **[Contested]** at each node. These indicate where empirical data is robust versus where philosophical interpretation is still debated.

  ---

  ### NODE 1: The Empirical Premise
  **Claim:** Based on classic social psychology experiments (e.g., honesty tests, bystander effect), do you accept that cross-situational consistency in human behavior is **basically near-zero**?

  *   **[Settled]:** Behavior varies significantly more by situation than folk psychology predicts.
  *   **[Contested]:** Whether this variation amounts to "near-zero" consistency or merely "imperfect" consistency.

  *   **→ YES (Consistency is negligible):** Go to **NODE 3**.
  *   **→ NO (Consistency is significant enough to matter):** Go to **NODE 2**.

  ---

  ### NODE 2: The Scope of Consistency
  *(Only for those who answered NO to Node 1)*
  **Claim:** If people do show consistency, is it **global** (the same trait appears everywhere) or **local/role-bound** (traits depend on the context)?

  *   **Concrete Case:** If someone is honest on their taxes, must they also be honest with their spouse and friends to count as "honest"? Or can they be honest at work but cowardly in social settings?
  *   **[Contested]:** Whether local dispositions are robust enough to ground moral praise or count as "virtues."

  *   **→ GLOBAL (Same trait everywhere):** Go to **NODE 3**.
  *   **→ LOCAL (Trait depends on context):** Go to **NODE 3**.

  ---

  ### NODE 3: The Locus of Virtue
  *(For all paths)*
  **Claim:** Should we reconceive virtue as **distributed across social ecologies** (institutional patterns, relational structures) rather than residing primarily inside individual souls?

  *   **Concrete Case:** Is a "just person" someone with a specific internal psychology, or is "justice" a pattern that emerges only when a person is embedded in the right community structures?
  *   **[Contested]:** Whether virtue can exist externally to the individual agent; whether this changes the subject from "ethics" to "sociology."

  *   **→ YES (Virtue is distributed/ecological):** Go to **LEAVES A, B, or C**.
  *   **→ NO (Virtue is internal/individual):** Go to **LEAVES D, E, or F**.

  ---

  ### THE LEAVES (Positions)

  #### Path: YES to Node 1 (Near-Zero Consistency)
  *   **→ YES to Node 3 (Distributed):**
      *   **Position Name:** **Ecological Virtue Theory / Structural Situationism**
      *   **View:** Individual character is mostly a myth, but we can engineer "virtue" by designing better social systems and environments.
  *   **→ NO to Node 3 (Individual):**
      *   **Position Name:** **Virtue Eliminativism / Hard Situationism**
      *   **View:** Virtue terms refer to nothing real. Moral praise/blame focused on character is misguided because stable traits do not exist.

  #### Path: NO to Node 1 + GLOBAL (Node 2)
  *   **→ YES to Node 3 (Distributed):**
      *   **Position Name:** **Unnamed / Global Ecological Hybrid**
      *   **View:** Traits are global and robust, but they are co-constituted by external structures. (Rare position; logically possible but seldom defended).
  *   **→ NO to Node 3 (Individual):**
      *   **Position Name:** **Globalist Virtue Ethics (Traditional Aristotelian)**
      *   **View:** Virtues are unified, stable dispositions internal to the agent. The situationist data is either flawed or describes people who haven't yet achieved full virtue.

  #### Path: NO to Node 1 + LOCAL (Node 2)
  *   **→ YES to Node 3 (Distributed):**
      *   **Position Name:** **Relational Virtue Ethics / Weak Ecological View**
      *   **View:** Virtues are real but fragmented (local); they depend heavily on specific relationships and environments to function.
  *   **→ NO to Node 3 (Individual):**
      *   **Position Name:** **Interactionist Virtue Ethics / Localist Virtue Ethics**
      *   **View:** Virtues are real internal dispositions, but they are specific to domains (e.g., "professional honesty" vs. "domestic honesty"). Behavior is an interaction between trait and situation.

  ---

  ### BOUNDARY FLAGS (Blurred Distinctions)

  **1. Interactionist VE vs. Relational/Weak Ecological View**
  *   **The Blur:** Both agree traits are local. The line blurs when determining how much "weight" the environment carries. If an Interactionist admits the environment does 50% of the work, are they secretly an Ecological theorist?
  *   **Seminar Tip:** Ask proponents of each: "Can the virtue exist if you remove the specific social context?"

  **2. Virtue Eliminativism vs. Ecological Virtue Theory**
  *   **The Blur:** Both accept the strong situationist data (Node 1: Yes). The difference is purely normative: one says "stop talking about virtue" (Eliminativism), the other says "redefine virtue as system design" (Ecological).
  *   **Seminar Tip:** Ask: "Is this a change in metaphysics (what virtue *is*) or just semantics (what we *call* it)?"

  **3. Globalist VE vs. Localist VE**
  *   **The Blur:** Traditionalists often argue that "local" virtues are just immature versions of "global" virtues. A Localist might argue a "global" virtue is just many local virtues working in harmony.
  *   **Seminar Tip:** Ask: "Is unity of virtue a requirement for moral maturity, or a philosophical fantasy?"

  ---

  ### EPISTEMIC STATUS KEY

  *   **[Settled]:** Broad agreement in empirical literature or logical necessity. (e.g., Situations influence behavior significantly).
  *   **[Contested]:** Active philosophical debate; no consensus. (e.g., Whether local traits justify moral praise).
