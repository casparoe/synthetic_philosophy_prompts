answer: |-
  ### Instructor's Preamble: Mapping the Logical Space

  Before handing this out, note that the nine cases you provided cluster into four conceptual tensions. To get eight branch questions out of them without padding, we have to treat some cases as "tie-breakers" for views that look similar on the surface.

  **The Four Tensions:**
  1.  **Obstacle Source:** Is the constraint *outside* me (walls, people, money) or *inside* me (desires, beliefs)?
  2.  **Modal Status:** Does the constraint have to be *active* (firing, hitting) or just *possible* (power to fire, law on books)?
  3.  **Capacity vs. Permission:** Is unfreedom about being *stopped* or about lacking the *means*?
  4.  **Epistemic State:** Does it matter if I *know* I'm blocked (or unblocked)?

  **Redundancy Alert:**
  *   **The Slaveholder and the Worker:** These do identical work (testing unexercised arbitrary power). I have placed them on sequential nodes to force students to check for consistency, but conceptually they are the same test.
  *   **No Money and Wheelchair:** Both test capability vs. interference. I have split them to distinguish "social resources" from "physical design," though many theories collapse these.
  *   **Addict and Cult:** Both test internal constraints. The Addict tests *conflict* (I want X but do Y); the Cult tests *alignment* (I want Y and do Y, but Y is "bad").

  **Empty/Unstable Cells:**
  *   **The "Happy Domination" Cell:** A view that says unexercised power *doesn't* reduce freedom, but internal psychology *does*. (Why unstable? If you care about internal states, you usually care about the anxiety of potential interference).
  *   **The "Legitimate Interference" Cell:** A view that says the Citizen is unfree even if she voted for the law, but the Slave is free if the master is kind. (Unattractive: inconsistent treatment of authority).

  ***

  # SEMINAR HANDOUT: The Freedom Diagnostic

  **Instructions:** Answer **Yes** or **No** to each claim below. Follow the arrows. Do not worry about what you think "freedom" means theoretically; answer based on your gut reaction to the specific case.

  **NODE 1: The Outvoted Citizen**
  *A citizen votes against a law, but it passes by a fair majority. She is forced to obey it.*
  **Claim:** This coercion reduces her freedom, even though she accepts the voting system as fair.
  *   **YES** → Go to Node 2.
  *   **NO** → (You believe legitimate authority is compatible with freedom). → **LEAF A**

  **NODE 2: The Bread Buyer**
  *A person wants bread. No one stops them, but they have no money.*
  **Claim:** This person is unfree to buy bread, not just poor.
  *   **YES** → Go to Node 3.
  *   **NO** → Go to Node 5.

  **NODE 3: The Wheelchair User**
  *A town hall has steps and no ramp. No one forbids the wheelchair user from entering.*
  **Claim:** This design makes the user unfree to enter, just like lacking money.
  *   **YES** → **LEAF B**
  *   **NO** → (You think money restricts freedom, but bad design does not). → **LEAF C**

  **NODE 4: The Kindly Slaveholder**
  *A slaveholder has total legal power to punish their slave but never does.*
  **Claim:** The slave is unfree, even if they are never physically interfered with.
  *   **YES** → Go to Node 6.
  *   **NO** → Go to Node 7.
  *(Note: If you reached Node 4, you said "No" to the Bread Buyer.)*

  **NODE 5: The Addict (Conflict)**
  *An addict wants to quit drugs but cannot stop themselves.*
  **Claim:** This internal conflict makes them unfree, even if no one else is involved.
  *   **YES** → Go to Node 8.
  *   **NO** → **LEAF D**

  **NODE 6: The Scheduled Worker**
  *An employer can fire a worker at any moment without reason, but rarely does.*
  **Claim:** This power makes the worker unfree, similar to the slave.
  *   **YES** → **LEAF E**
  *   **NO** → (You think legal slavery reduces freedom, but economic power does not). → **LEAF F**

  **NODE 7: The Jammed Gun**
  *A robber points a gun at you, but the gun is jammed and cannot fire. You don't know it's jammed.*
  **Claim:** You are unfree to leave, because a threat was made.
  *   **YES** → **LEAF D**
  *   **NO** → **LEAF G**

  **NODE 8: The Cult Member**
  *A cult member sincerely reports being happy and chooses to stay.*
  **Claim:** They are unfree because their desires are manipulated, even if they feel free.
  *   **YES** → **LEAF B**
  *   **NO** → (You think internal addiction reduces freedom, but sincere belief does not). → **LEAF H**

  *(Note: The Prisoner Case is used in the Leaf Analysis below to test your consistency.)*

  ***

  # INSTRUCTOR'S KEY: Leaves & Analysis

  ### The Leaves (Views)

  **LEAF A: Democratic Authorization**
  *   **View:** Freedom is compatible with coercion if the procedure is legitimate.
  *   **Awkward Commitment:** You must accept that a unanimous vote against you still leaves you free.
  *   **Least Comfortable Case:** *The Prisoner whose cell door is unlocked.* (If procedure makes coercion free, does ignorance make walls free?)

  **LEAF B: Capability & Design**
  *   **View:** Freedom is what you are actually able to do and be, regardless of interference or internal state.
  *   **Awkward Commitment:** You must treat a lack of money and a lack of ramps as identical restrictions on liberty.
  *   **Least Comfortable Case:** *The Cult Member.* (If capability is all that matters, a happy cult member with full resources is fully free).

  **LEAF C: Resource Interference**
  *   **View:** Lack of social means (money) reduces freedom, but physical obstacles do not count as unfreedom.
  *   **Awkward Commitment:** You must claim a staircase restricts your movement but does not reduce your freedom.
  *   **Least Comfortable Case:** *The Wheelchair User.* (This view implies the town hall is accessible in terms of freedom, just not ability).

  **LEAF D: Strict Non-Interference**
  *   **View:** Only actual interference by other people reduces your freedom.
  *   **Awkward Commitment:** You must claim the kindly slaveholder leaves the slave free.
  *   **Least Comfortable Case:** *The Kindly Slaveholder.* (This is the classic intuition pump against this view).

  **LEAF E: Non-Domination**
  *   **View:** Being exposed to someone else's arbitrary power reduces freedom, even when unexercised.
  *   **Awkward Commitment:** You must treat a benign boss and a benign slaveholder as identical threats to liberty.
  *   **Least Comfortable Case:** *The Citizen Outvoted.* (If arbitrary power is the enemy, does majority rule count as arbitrary power?)

  **LEAF F: Legalist Domination**
  *   **View:** Only formal legal status (slavery) creates domination; economic dependence does not.
  *   **Awkward Commitment:** You must claim a worker who can be fired instantly is freer than a slave who is never beaten.
  *   **Least Comfortable Case:** *The Scheduled Worker.* (Most students find this distinction unsustainable upon reflection).

  **LEAF G: Objective Opportunity**
  *   **View:** Freedom depends on the actual physical possibility of action, not threats or beliefs.
  *   **Awkward Commitment:** You are free to walk out of the prison if the door is unlocked, even if you think it's locked.
  *   **Least Comfortable Case:** *The Prisoner whose cell door is unlocked.* (This implies ignorance of freedom is still freedom).

  **LEAF H: Rational Self-Mastery**
  *   **View:** Freedom is a kind of self-mastery, so internal obstacles count only if you reject them.
  *   **Awkward Commitment:** You must claim the addict who loves drugs is freer than the addict who hates them.
  *   **Least Comfortable Case:** *The Addict who doesn't want to stop.* (This suggests freedom is about conflict, not control).

  ***

  ### Diagnostic Notes for the Instructor

  **Indistinguishable Leaves:**
  *   **Leaf B (Capability) and Leaf H (Self-Mastery):** Your tree cannot fully separate these if a student answers "Yes" to both Bread and Addict but "No" to Cult.
      *   *Further Case to Pry Apart:* **The Happy Hermit.** A person lives in a cave by choice with no resources. Leaf B says they are unfree (low capability); Leaf H says they are free (self-mastery).
  *   **Leaf D (Strict Interference) and Leaf G (Objective Opportunity):** These often collapse.
      *   *Further Case to Pry Apart:* **The Unknowable Barrier.** A bridge is out 10 miles away. You don't know. Are you free to drive there? Leaf G says No (objective block); Leaf D says Yes (no one is stopping you *here*).

  **Redundant Cases:**
  *   **Cut:** *The Scheduled Worker.*
  *   **Reason:** It does the exact same work as *The Kindly Slaveholder*. It tests the "unexercised power" intuition. Keep the Slaveholder for historical weight; use the Worker only if students resist the Slaveholder as "too extreme."
  *   **Cut:** *The Addict (doesn't want to stop).*
  *   **Reason:** It is the negative control for *The Addict (wants to stop)*. You only need one to test the Internal Constraint view. The "wants to stop" version is more diagnostically powerful for first-years.

  **Empty Combinations:**
  *   **The "Subjective Domination" View:** A student who says the Slave is *Free* (power doesn't matter) but the Cult Member is *Unfree* (psychology matters).
      *   *Why Empty/Unattractive:* It implies external power is less restrictive than internal belief. It is logically possible but politically rare; students usually align external and internal constraints (either both matter or neither).
  *   **The "Legitimate Slavery" View:** A student who says the Citizen is *Free* (procedure matters) but the Slave is *Free* (no interference).
      *   *Why Empty:* Inconsistent treatment of authority. If procedure legitimizes coercion for the citizen, why doesn't contract legitimizes it for the slave? (This usually reveals a confusion about voluntariness).
