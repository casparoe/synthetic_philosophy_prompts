answer: |-
  ### Menu of Theses: "What Goes Around Comes Around"

  The following table disambiguates the slogan into seven distinct readings, ordered from thin (naturalistic/descriptive) to thick (metaphysical/normative).

  | Reading | Verdict, Status & Metaphysical Commitments | Jobs Performed (1: Fitting Death, 2: Appropriate Gladness, 3: Debt Discharged) |
  | :--- | :--- | :--- |
  | **1. The Sociological Risk Claim**<br>*(Descriptive)*<br>Asserts: Systematic wrongdoing creates enemies, reputational risk, and isolation, statistically increasing the likelihood of misfortune or lack of support in crisis. | **Status:** Platitude / Empirical hypothesis.<br>**Truth Conditions:** Requires data showing cheaters suffer more negative social outcomes than cooperators over time.<br>**Metaphysics:** Fully naturalistic. Requires no cosmic order, only human psychology and social networks.<br>**Test Case Sensitivity:** Fails the "Reformed Landlord" test (if he repaid, risk should drop, but illness remained). | **1:** ❌ (Merely unfortunate/causal)<br>**2:** ❌ (Gladness is mere spite)<br>**3:** ❌ (Tenants remain unpaid) |
  | **2. The Constitutive Vice Claim**<br>*(Psychological)*<br>Asserts: The traits required to wrong others (paranoia, greed, callousness) are inherently corrosive to the agent's well-being, health, or peace of mind. | **Status:** Substantive but defensible thesis (Aristotelian).<br>**Truth Conditions:** Requires that vice is intrinsically self-harming, not just instrumentally risky.<br>**Metaphysics:** Naturalistic. Requires no cosmic order, only a theory of human flourishing.<br>**Test Case Sensitivity:** Fails "Reformed Landlord" (if he changed, the vice was gone, so illness shouldn't fit). | **1:** ❌ (Tragic, not fitting)<br>**2:** ❌ (Pity is appropriate, not gladness)<br>**3:** ❌ (Internal harm ≠ external repayment) |
  | **3. The Retributive Desert Claim**<br>*(Moral)*<br>Asserts: Wrongdoers objectively *deserve* to suffer; their suffering is intrinsically good (or non-bad) because it instantiates justice, regardless of consequences. | **Status:** Controversial normative thesis.<br>**Truth Conditions:** Requires that "desert" is a real moral property and that suffering can be a good thing when deserved.<br>**Metaphysics:** Requires objective moral values, but not necessarily a cosmic *mechanism* (could be unconnected luck that happens to align with desert).<br>**Test Case Sensitivity:** Passes "Device A" (secret pain is good), fails "Device B" (loved one's pain doesn't satisfy *his* desert). | **1:** ✅ (By definition)<br>**2:** ✅ (Moral satisfaction)<br>**3:** ❌ (Suffering is not currency) |
  | **4. The Moral Ledger Claim**<br>*(Metaphorical)*<br>Asserts: Wrongdoing creates a "debt" to the moral order; misfortune acts as a counter-weight that restores equilibrium to the universe's balance sheet. | **Status:** Metaphorically substantive, literally incoherent without further machinery.<br>**Truth Conditions:** Requires that "moral balance" is a real state that can be tipped and restored.<br>**Metaphysics:** Quasi-cosmic. Treats the universe as a system that values equilibrium.<br>**Test Case Sensitivity:** Passes "Device A," ambiguous on "Device B" (does the balance care *who* suffers?). Fails "Reformed Landlord" (unless debt persists after repayment). | **1:** ✅ (Balanced)<br>**2:** ✅ (Equity restored)<br>**3:** ❌ (Debt is to Universe, not Tenants) |
  | **5. The Aesthetic Fittingness Claim**<br>*(Symbolic)*<br>Asserts: There is a narrative or poetic appropriateness to the villain suffering; it completes the story arc. Our gladness is aesthetic appreciation of this symmetry. | **Status:** Subjective but coherent.<br>**Truth Conditions:** Requires only that humans perceive narrative symmetry as satisfying.<br>**Metaphysics:** Naturalistic (human psychology of storytelling).<br>**Test Case Sensitivity:** Passes "Device A" (good story), Fails "Device B" (less narratively tight). | **1:** ✅ (Narratively fitting)<br>**2:** ✅ (Aesthetic satisfaction)<br>**3:** ❌ (Stories don't pay rent) |
  | **6. The Expiatory Discharge Claim**<br>*(Soteriological)*<br>Asserts: Suffering functions as *payment*. The pain literally cancels the moral debt owed to the victims, reducing or eliminating the obligation to repay. | **Status:** Highly ambitious/theological.<br>**Truth Conditions:** Requires that pain is a convertible currency for material or moral harm.<br>**Metaphysics:** Strong cosmic order. Requires a mechanism where suffering transfers value from wrongdoer to victim (even if victims don't know).<br>**Test Case Sensitivity:** Passes "Device A." Fails "Reformed Landlord" (if he repaid, no debt remains to discharge). | **1:** ✅ (Fitting)<br>**2:** ✅ (Just)<br>**3:** ✅ (If pain = currency) |
  | **7. The Mechanistic Karma Claim**<br>*(Cosmological)*<br>Asserts: The universe contains a causal law (like gravity) that automatically generates misfortune for wrongdoing, potentially across lifetimes. | **Status:** Religious/Supernatural claim.<br>**Truth Conditions:** Requires a law of moral causation.<br>**Metaphysics:** Strong cosmic order. Supernatural or paranormal.<br>**Test Case Sensitivity:** Passes "Device A" (if device mimics karma). Fails "Reformed Landlord" (unless karma lags or covers past lives). | **1:** ✅ (Causally fitting)<br>**2:** ✅ (Law upheld)<br>**3:** ❌ (Unless linked to Reading 6) |

  ***

  ### Analysis of the Test Cases

  Your test cases are excellent discriminators. They reveal that your friend likely holds a hybrid of **Reading 3 (Desert)** and **Reading 4 (Ledger)**, but struggles with **Reading 6 (Discharge)**.

  **1. The Punishment Device (Secret vs. Loved One)**
  *   **The Distinction:** If your friend agrees that the device inflicting pain on the *loved one* (Device B) is *also* "what goes around comes around," he is committed to the **Moral Ledger (Reading 4)**. This suggests the universe cares about the *quantity* of suffering, not who experiences it. If he agrees only Device A fits the slogan, he is committed to **Retributive Desert (Reading 3)**, where the *wrongdoer* specifically must be the locus of the correction.
  *   **The Implication:** Most people intuitively reject Device B as "justice." This suggests the slogan is usually about the *wrongdoer's* state, not a universal balance. If so, the slogan is about **Desert**, not **Ledger**.
  *   **Secrecy:** If the device works secretly (no one knows), and your friend still says it is "fitting," he rejects the **Sociological (Reading 1)** and **Aesthetic (Reading 5)** readings. He believes the fittingness exists even without an audience. This pushes him toward **Cosmological (Reading 7)** or **Objective Desert (Reading 3)**.

  **2. The Reformed Landlord**
  *   **The Distinction:** If the landlord repaid everyone and changed his ways, but *then* got sick, would your friend still say "what goes around comes around"?
      *   **If Yes:** He believes in a **Lagging Ledger** or **Karma (Reading 4/7)** where past debts persist regardless of current character.
      *   **If No:** He believes in **Constitutive Vice (Reading 2)** or **Desert based on current state (Reading 3)**.
  *   **The Asymmetry:** You noted we rarely use the slogan when decent people prosper. This suggests the phrase is not a general law of moral causation (which would predict good for good), but a specific **Retributive Heuristic**. It is used to comfort the observer that *evil* does not triumph, not to promise *good* triumphs. This weakens the **Cosmological (Reading 7)** claim (which should be symmetrical) and strengthens the **Psychological Comfort** aspect of **Reading 3**.

  ***

  ### The Conditions of Desert: Recipient, Beneficiary, Currency

  You asked whether desert needs a recipient, a beneficiary, or a matching currency to do the work your friend wants (specifically Job 3: making a difference to what is owed).

  1.  **Does Desert Need a Recipient?**
      *   **Yes.** For the death to be *fitting* (Job 1) and your friend's gladness *appropriate* (Job 2), the **wrongdoer** must be the recipient of the suffering. If the suffering falls on a random innocent person, it is tragedy, not justice. If it falls on the wrongdoer's loved one (Device B), it is only justice on the **Ledger** view, which most find intuitively lacking.
      *   *Verdict:* The slogan implies the wrongdoer must suffer.

  2.  **Does Desert Need a Beneficiary?**
      *   **For Jobs 1 & 2:** No. The **Retributive (Reading 3)** view holds that justice is satisfied even if the victims are dead, unaware, or uncompensated. The "beneficiary" is the Moral Order itself.
      *   **For Job 3:** Yes. To affect what is *owed to the tenants*, the tenants (or their estates) must be the beneficiaries.
      *   *Verdict:* Your friend's claim that the illness was "fitting" works without a beneficiary (Reading 3). His implication that this settles things (Job 3) *requires* a beneficiary. Since the tenants received nothing, Job 3 fails on all readings except **Expiatory Discharge (Reading 6)**.

  3.  **Does Desert Need a Matching Currency?**
      *   **This is the critical failure point.** For Job 3 to be true (the debt is settled), there must be an exchange rate between **Pain** and **Money/Dignity**.
      *   **Reading 6 (Discharge)** asserts this exchange rate exists (his pain pays their loss).
      *   **Readings 1–5 & 7** generally deny this. On these views, the landlord's pain is *justice*, but the tenants' money is *debt*. One does not cancel the other. A thief can be imprisoned (fitting) and still owe restitution (debt).
      *   *Verdict:* Unless your friend argues for **Reading 6**, the illness makes the death fitting (Job 1) and your gladness appropriate (Job 2), but it **does not** absolve the landlord of the debt to the tenants (Job 3). The tenants are still owed. The universe may be balanced, but the ledger between landlord and tenant remains red.

  ### Summary for Your Friend

  You can present this conclusion to him:

  *"If you mean 'what goes around comes around' as a description of risk or vice, his death was just bad luck, and my gladness is just spite. If you mean it as Karma or Cosmic Justice, his death was fitting, and my gladness is moral satisfaction. But unless you believe his pain literally functioned as currency to pay back the tenants (Expiation), the slogan does not mean he died even with them. It means he died even with the Universe. The tenants are still owed."*
