      *   *Let's try a pure Coordination/Belief Game:* **The "Green/Red" Button Game (adapted for cards).**
          *   Scenario: A "Project" will succeed if at least 80% of the team commits. If it succeeds, everyone gets a donut. If it fails, no donuts.
