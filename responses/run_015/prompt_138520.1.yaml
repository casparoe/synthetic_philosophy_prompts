          *   Must avoid collapsing into "positive thinking is good."
          *   Don't mention Clifford/James until debrief.
          *   Need timeline, script guidance, debrief plan, failure modes, and limitations.
          *   Tone: Honest, practical, philosophically rigorous but accessible to tired 17-year-olds.

  2.  **Deconstruct the Philosophical Problem for Game Design:**

      *   *Core Mechanic:* A coordination game where success depends on *everyone* committing, but commitment is only valuable if *everyone knows* everyone else is committed.
      *   *The "Loop":* If I think you believe, I'm more likely to believe. If you know I believe, you're more likely to believe.
      *   *The "Clifford" Trap:* If we just say "we believe" without actually coordinating, are we lying? Is the success manufactured?
      *   *The "James" Defense:* The belief *is* the causal factor. Without it, the fact (success) doesn't exist.
