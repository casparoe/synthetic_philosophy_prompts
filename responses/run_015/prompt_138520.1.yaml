          *   *Why this works:* In Round 1, I might want to invest, but I don't know if *you* will. So I hold. In Round 2, we establish common knowledge. "We all agree to stand." Now, my belief that *you* will stand justifies *my* standing.
          *   *The "Belief Creates Truth" angle:* The success condition is *dependent* on the number of investors. The belief (that enough people will invest) causes the investment, which causes the success.
          *   *Clifford Objection:* In Round 2, did we just "agree to believe"? Is that evidence? Or is it a pact?
          *   *This fits Maya's point perfectly.*

  3.  **Drafting the Plan:**

      *   **Title:** The Threshold Pact.
      *   **Materials:** Index cards, pens, whiteboard, donuts, timer.
