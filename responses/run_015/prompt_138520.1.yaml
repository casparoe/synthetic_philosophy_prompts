          *   *Modification:* Add a "Sabotage" element? No, too adversarial.
          *   *Modification:* Add a "Doubt Tax." If the box falls, everyone who wrote "High Confidence" privately has to admit it.
          *   *Actually, let's look at the "Common Knowledge" definition.* It's not just "I know you know." It's "I know you know I know."
          *   *Game:* **The "Secret Threshold" Game.**
          *   I (Facilitator) set a secret threshold (e.g., 10 people).
          *   Students must decide whether to "Invest" (stand up) or "Hold" (stay seated).
          *   If Investments >= Threshold, Investors win donuts. If < Threshold, Investors do jumping jacks. Holders are safe either way.
          *   *Round 1:* Private written decision. (Tragedy of the commons/Coordination failure).
