      *   Clifford would say: A verbal agreement isn't evidence that the project will succeed, it's just words. You need *past performance* data.
      *   James would say: In a novel situation (like this game), the only evidence available *is* the mutual commitment.
      *   *Crucial Detail:* I need to make sure the "Public Discussion" doesn't just become "Let's all lie." It needs to be a genuine pledge.
