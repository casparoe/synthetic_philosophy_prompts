          *   *Round 2:* Public declaration. Everyone says "I am in" out loud, looking at each other. Attempt the move. (Likely to succeed).
          *   *Debrief:* Why did Round 2 work? The physics didn't change. The *shared knowledge* changed the behavior (steadier hands, better anticipation).
          *   *Refinement:* This is good. It shows that the *social fact* of confidence changes the *physical outcome*.
          *   *Stakes:* Donuts if successful. Jumping jacks if failed.
          *   *Clifford Check:* Did we lie in Round 2? If someone said "I am in" but secretly doubted, did they corrupt the evidence?
          *   *James Check:* Did the public declaration *create* the stability?

      *   *Let's sharpen the "Loop" aspect.*
