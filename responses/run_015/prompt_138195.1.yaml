answer: |-
  Here is a menu of distinct theses underlying the claim that the composition dispute is "merely verbal," evaluated against your criteria, followed by an analysis of the two complications.

  ### The Menu of "Merely Verbal" Theses

  #### 1. Lexical Ambiguity (Different Senses)
  **Thesis:** The parties are using the word "object" (or "exists") with different lexical meanings. One side uses it to mean *simple*, the other to mean *aggregate*. They are not contradicting each other any more than one person saying "The bank is steep" and another saying "The bank is open" are contradicting.
  *   **Platitude?** Close to one. It is trivially true that words can have multiple meanings.
  *   **Substantive/Defensible?** Substantive as applied here. It requires arguing that the philosophical usage is not a technical stipulation but a reflection of pre-existing ambiguity. Defensible (Hirsch), but contested (Sider).
  *   **False?** Potentially. If both parties explicitly stipulate they are using a "philosophical" sense of existence intended to be univocal, this thesis accuses them of failing to do so.
  *   **Entitles move on?** Yes. If they are talking past each other, argument is futile until meanings are fixed.

  #### 2. Fact-Verbalism (Agreement on Non-Linguistic Facts)
  **Thesis:** The parties agree on every non-merological fact (physics, arrangement of simples). The disagreement is solely about which linguistic label to apply to that agreed-upon base. There is no "merological fact" over and above the "simples fact."
  *   **Platitude?** No. It implies a specific supervenience claim (that merological facts add nothing).
  *   **Substantive/Defensible?** Highly substantive. It denies that composition is a fundamental feature of reality. Defensible via parsimony, but begs the question against those who think composition is fundamental.
  *   **False?** Arguably false if one believes composition is a fundamental, non-supervenient relation (e.g., certain forms of realism).
  *   **Entitles move on?** Yes. If all "hard" facts are agreed upon, the rest is terminology.

  #### 3. Metaphysical Anti-Realism (No Language-Independent Truth Value)
  **Thesis:** Sentences about composite objects lack truth values independent of a conceptual scheme. "There are tables" is true-in-the-folk-scheme and false-in-the-nihilist-scheme. There is no "God's eye" view to adjudicate.
  *   **Platitude?** No. This is a robust anti-realist or relativist metaphysical stance.
  *   **Substantive/Defensible?** Very substantive. Defensible via arguments against ontological privilege, but controversial in analytic metaphysics.
  *   **False?** Realists argue it is false; there is a mind-independent fact about what exists.
  *   **Entitles move on?** Yes. It dissolves the dispute by removing the possibility of a single correct answer.

  #### 4. Joint-Carving Indifference (Metaphysical Privilege)
  **Thesis:** The dispute is verbal because *neither* way of counting "carves nature at the joints" (or both do equally well). If composition were a fundamental structural feature of the universe, the dispute would be substantive. Since it isn't (or is arbitrary), the choice is conventional.
  *   **Platitude?** No. Relies on the technical notion of "joint-carving" (Sider).
  *   **Substantive/Defensible?** Substantive. Requires a theory of metaphysical structure. Defensible if one thinks structure is limited to physics/logic.
  *   **False?** False if one believes composite objects are genuine structural features of reality.
  *   **Entitles move on?** Yes, *if* one accepts that only joint-carving disputes are worth having.

  #### 5. Pragmatic/Instrumental Equivalence
  **Thesis:** The real question is which language serves our explanatory or practical purposes better. Both are "true enough" for their contexts. The dispute is verbal in the sense that it treats a pragmatic choice as a truth-conditional one.
  *   **Platitude?** No. It shifts the norm from truth to utility.
  *   **Substantive/Defensible?** Substantive. Defensible via pragmatist metaphysics.
  *   **False?** False if one believes ontology is descriptive, not prescriptive.
  *   **Entitles move on?** Yes, but shifts the argument to "which is more useful?" rather than ending inquiry entirely.

  #### 6. Conceptual Ethics (Further Reading)
  **Thesis:** The dispute is not about what exists (which is fixed) but about which concepts we *ought* to employ. The "verbal" claim means the parties are engaged in conceptual engineering without realizing it.
  *   **Platitude?** No. Distinguishes "conceptual metaphysics" from "descriptive metaphysics."
  *   **Substantive/Defensible?** Substantive. Defensible (Cappelen, Burgess), but requires accepting the is/ought distinction for concepts.
  *   **False?** False if one believes our concepts are constrained by reality rather than choice.
  *   **Entitles move on?** Only to stop arguing about *truth*. It invites argument about *value*.

  ---

  ### Likely Intent of the Group Member

  The person in your group was most likely invoking **Thesis 2 (Fact-Verbalism)**, possibly underpinned by **Thesis 1 (Lexical/Quantifier Variance)**.

  The specific remark—"both sides agree about which simples there are and how they are arranged"—is the classic fingerprint of **Eli Hirsch's Quantifier Variance** or a Carnapian internal/external distinction. The intuition is that since the "base level" reality (the simples) is agreed upon, the "higher level" (composites) is just a matter of how we choose to quantify over that base. They likely assume that once the physical facts are fixed, there is no "further fact" about composition left to discover, making the disagreement purely about how to map language onto those fixed facts.

  ---

  ### Complication 1: The Second-Order Disagreement

  *Suppose the parties disagree about whether there is a language-independent fact as to which way of counting is natural/joint-carving.*

  *   **On Thesis 1 (Ambiguity) & 2 (Fact-Verbalism):** The second-order dispute is **substantive**. Whether a language corresponds to reality's structure is a fact about the world/language relation, not a matter of linguistic convention. If Nihilists claim "My language matches the joints" and Universalists claim "No, mine does," they are making a substantive metaphysical claim that cannot be dismissed as verbal on these readings.
  *   **On Thesis 3 (Anti-Realism):** The second-order dispute is **also verbal**. If there are no language-independent truth values for composition, there are likely none for "naturalness" either (unless naturalness is cashed out purely physically). The claim "X is more natural" is itself scheme-relative.
  *   **On Thesis 4 (Joint-Carving):** This reading *generates* the second-order dispute. If the first-order is verbal *because* neither carves nature, then the claim "Neither carves nature" is a substantive metaphysical premise. If the parties disagree on *that*, the dispute has moved to substantive metaphysics (the nature of structure), even if the original composition question remains verbal.
  *   **On Thesis 5 (Pragmatism):** The second-order dispute becomes **pragmatic**. It is no longer about "fact" but about "which framework yields better predictions/coherence." It survives as a dispute, but not a metaphysical one.

  **Verdict:** On the most common readings (1 & 2), the second-order disagreement **survives as distinct and substantive**. You cannot dismiss the debate about "naturalness" as verbal simply by dismissing the debate about "composition" as verbal, unless you are a full-blown anti-realist (Thesis 3).

  ---

  ### Complication 2: Recalcitrant Truth Claims

  *Suppose each side calls the other's sentences straightforwardly false and treats ordinary claims (e.g., "I bought a table") as true on one ontology and false on the other.*

  *   **Which readings still count the dispute as verbal?**
      *   **Thesis 1 (Ambiguity/Quantifier Variance):** **Yes.** This reading can survive recalcitrance. The verbalist argues that the parties are *mistaken* about their own semantic intentions. They *think* they are disagreeing about truth, but they are actually speaking different languages. The verbalist posits an error theory about the disputants' self-understanding.
      *   **Thesis 2 (Fact-Verbalism):** **Strained.** If they treat "I bought a table" as false under nihilism, they are disagreeing on the truth conditions of ordinary sentences, not just technical ones. This makes it harder to claim they agree on "all non-linguistic facts," as the truth of ordinary claims is usually considered a fact.
      *   **Thesis 3 (Anti-Realism):** **Yes.** Truth is relative to the scheme. They are right to call the other false *relative to their own scheme*, but wrong to think that falsity transfers across schemes.
      *   **Thesis 4, 5, 6 (Carving/Pragmatic/Ethics):** **No.** If the parties insist on robust truth conditions, these readings lose their grip. You cannot tell someone "it's just about utility" if they insist "it's about reality."

  *   **Does the slogan retain dismissive force?**
      *   **Significantly Reduced.** The slogan "it's merely verbal" functions dialectically to dissolve tension. If the parties insist, "No, one of us is wrong about the world," the verbalist can no longer simply wave their hand. They must now argue for **Semantic Charity** (Thesis 1) or **Error Theory**.
      *   To maintain the dismissive force, the verbalist must say: "You are both suffering from a semantic illusion." This is a heavier argumentative burden than simply saying "You agree on the simples."
      *   If the nihilist says "It is *false* that there are tables," and the verbalist says "That's just verbal," the nihilist hears "You are confused about logic." The dismissive force remains only if the verbalist can prove the nihilist is semantically confused. If the nihilist's semantics are defensible, the "verbal" label becomes an insult rather than a solution.

  **Verdict:** **Thesis 1 (Ambiguity)** is the only reading robust enough to withstand recalcitrant truth claims, but it loses its *immediate* dismissive force. It transforms from a "stop sign" into a positive semantic thesis that requires defense against the speakers' own intuitions.
