      *   *Decision:* I will defend a **Hybrid Framework**, but specifically one where the Inside View is not an alternative to the Outside View, but the *necessary mechanism* for applying it. Epistemic modesty demands we use structural reasoning to *build* the reference class, not to bypass it. This avoids the circularity charge by making the process iterative rather than hierarchical.

  3.  **Outline the Essay:**
