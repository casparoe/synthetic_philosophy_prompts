      *   **Section 3: The Second-Order Trap.**
          *   If we use OV to decide when to use OV, we get circularity.
          *   We need a metric to judge the quality of the reference class. That metric is Inside View reasoning.
      *   **Section 4: The Synthesis - Modesty as Construction.**
