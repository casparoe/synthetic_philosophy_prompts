answer: |-
  The error lies in Step (3). You model the payoff as $P - c$, treating $P$ as a constant independent of the evidence threshold $\tau$. However, your setup states that the action's worth "depends on a state of the world" about which parties gather evidence. Committing earlier (lower $\tau$) increases the probability of winning but decreases the expected value of the prize conditional on winning, because the decision is based on weaker evidence. Step (3) ignores this trade-off, assuming expected value depends only on win probability.

  Once you recognize that $E[P]$ is a function of $\tau$, Step (4) fails: expected value is not strictly decreasing in $\tau$. There is a tension between winning sooner and winning correctly. This generates an interior optimum for $\tau$, blocking the race to zero. You retain the reality of commitment races (agents do race to lower $\tau$ than socially optimal) without accepting the absurdity of total blindness.

  This diagnosis disables (8c). Ordinary competitive actions (submitting papers, traffic) also involve quality payoffs dependent on evidence. You shouldn't drive blindly just to enter an intersection first because the payoff (safety/arrival) depends on seeing the road. The argument only supports blind commitment if the prize value is truly independent of correctness, which is rare outside abstract games.

