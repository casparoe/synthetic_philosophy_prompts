          *   *Correction:* Jaspers explicitly says political guilt is *not* moral guilt. Representatives cannot perform moral acts on behalf of citizens. Moral guilt is strictly individual. By conflating political apology with discharging *moral* guilt, the student undermines Jaspers's core distinction and risks the "collective guilt" Jaspers rejects.
      *   *Metaphysical Guilt (Part b):* **Major Error.** The student writes: *"...metaphysical guilt attaches to the community rather than the individual and is carried forward into later generations, so that descendants can bear it for deeds in which they had no part."*
          *   *Correction:* Jaspers defines metaphysical guilt as solidarity among *contemporaries* ("co-responsible for wrongs committed in their presence"). He does *not* argue it is inherited by descendants who were not alive. This contradicts the prompt's hint ("given that on his account it is not tied to membership of a nation") and Jaspers's actual text. The student effectively turns metaphysical guilt into the hereditary collective guilt Jaspers warns against.
