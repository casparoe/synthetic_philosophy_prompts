  1. The standard Joyce-style norm: maximize global expected accuracy using a uniform Brier-score weighting across the entire belief set.
  2. A humility-weighted variant: apply the same scoring rule, but scale the epistemic utility of each credence downward by the agent's own second-order uncertainty about that credence.
  3. A domain-split rule: partition beliefs into empirical and structural domains, apply the Brier score to the former and a flat-prior logarithmic score to the latter, deliberately tolerating global incoherence if it improves local calibration.

