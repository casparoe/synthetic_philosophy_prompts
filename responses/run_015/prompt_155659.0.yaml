          Your observation identifies a specific epistemic maneuver that has troubled archaeological theory for decades, particularly since the shift from processual to post-processual frameworks in the late twentieth century. While there is no single universally standardized term like gravity or entropy, the phenomenon you are describing is most accurately understood as the reification of a residual category through negative operationalization. In the philosophy of science, this is a specific subtype of category error where a class of objects is defined not by shared positive attributes but by the absence of a known function, and that absence is then treated as a positive presence of social meaning. If we were to coin a term specifically for this archaeological instantiation, it would be the Ritual Residue Fallacy. This label captures the dual nature of the error: the objects are treated as residue left over after utilitarian explanation fails, and that residue is fallaciously elevated to the status of a distinct institutional fact.

