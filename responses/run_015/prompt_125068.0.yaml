answer: |-
  ### Where the argument breaks

  Your reasoning contains one trivial truth, one false step, and one unearned inference. It is trivially true that VNM utilities are unique only up to positive affine transformation and that raw interpersonal comparisons are undefined without further stipulation. The false step is the claim that attainable-range normalization is "forced by the mathematics." Fixing the zero and unit requires choosing *which* outcomes serve as anchors; selecting the feasible minimum and maximum is a substantive ethical choice, not a mathematical necessity. Consequently, your inference that menu-dependence is a discretization artefact is unearned. It is a structural feature of defining utility relative to the choice set. By treating a specific normalization convention as a mathematical implication of VNM, you conceal an ethical weighting scheme behind a technical procedure. The argument breaks where you move from "scale is arbitrary" to "this specific method of fixing scale is neutral."

  ### What affine uniqueness does and does not entail

  Affine uniqueness entails that within a single agent's preference ordering, ratios of utility *differences* are invariant. It does not entail that interpersonal comparisons are meaningless or impossible; rather, the VNM framework is silent on them. The representation theorem constructs a scale for individual rationality under risk, not a common metric for social welfare. To say comparisons are "ill-formed" is to confuse the framework's limitations with ontological impossibility. The framework lacks the information to compare Person A's "util" to Person B's "util," much like a ruler lacks the information to compare temperature. This silence leaves room for extra-theoretical stipulations—ethical or empirical—to bridge the gap. Impossibility theorems often assume this silence as a constraint (ordinal, non-comparable utility). If you explicitly introduce an informational assumption that utilities are cardinally unit-comparable, you do not violate VNM; you simply augment the informational basis available to the social planner. The mathematics permits comparability; it merely does not generate it from individual preference orderings alone.

  ### Attainable-range normalization: what it buys and what it costs

  Your menu-dependence symptom is not an implementation artefact; it is a structural feature known in social choice as the failure of Independence of Irrelevant Alternatives (IIA), characteristic of "relative utilitarianism." By normalizing against the feasible set, you define a person's utility unit as their specific range of potential welfare in that context. This buys you a cardinal scale without external reference, but it costs you consistency across choice sets. If you add a dominated option that extends someone's theoretical maximum (even if unchosen), their normalized utility for all other options drops, altering the social sum.

  Regarding redistribution, this scheme systematically biases weight toward individuals with wider attainable ranges. If Person A faces outcomes ranging from death to wealth, and Person B faces outcomes ranging from mild discomfort to moderate comfort, Person A's single utility unit represents a much larger absolute welfare span than Person B's. Summing normalized units effectively weights Person A more heavily. You are not merely "bookkeeping"; you are implementing a specific, context-sensitive equity view that prioritizes those with more at stake. This is a defensible ethical position, but it is not the neutral arithmetic consequence you suppose.

  ### Is interpersonal comparison impossible? What the impossibility results say

  There is no theorem proving interpersonal comparison is metaphysically impossible. Arrow's Impossibility Theorem establishes that no social welfare function can satisfy a set of reasonable axioms (Pareto, IIA, Non-dictatorship) given an informational basis of *ordinal, non-comparable* utilities. The "impossibility" arises from the scarcity of information, not the incoherence of comparison. If you relax the informational constraint to allow Cardinal Unit Comparability (CUC), Arrow's impossibility vanishes; utilitarian summation becomes a valid solution.

  Sen's work clarifies this by classifying social welfare functionals based on their informational bases. The results show trade-offs: to escape Arrow's result, you must admit more information (like cardinal comparability), but doing so may force you to accept other constraints or weaken other axioms (like IIA, as you observed). Thus, adding interpersonal comparability is a way of *escaping* Arrow's theorem, not something it rules out. The theorems tell you that you cannot have it all (full consistency, minimal information, and democratic constraints); they do not forbid you from enriching the information set to make comparisons well-defined.

  ### Comparability versus aggregation

  Securing comparability does not entail summation. Comparability ensures that the statement "Person A gains 10 units" has the same metric content as "Person B loses 10 units." Aggregation decides what social state results from that distribution. Summation (Classical Utilitarianism) is merely one aggregation rule compatible with full comparability. You could instead adopt Prioritarianism (summing a concave transformation of utility), Rawlsian Maximin (maximizing the minimum), or Egalitarian rules (minimizing variance). Treating "comparable" and "additive" as a single requirement conflates measurement with evaluation. Comparability allows you to weigh trade-offs; aggregation determines the social objective function. You must choose the aggregation rule explicitly based on the equity-efficiency trade-offs your institution is willing to endorse, as the mathematics of comparability alone does not dictate that one unit to A should cancel one unit to B.

  ### A defensible procedure for the tool

  To make the tool defensible, you must externalize the normalization anchors. Do not use the feasible set. Instead, define a fixed reference lottery common to all individuals (e.g., "death vs. perfect health" or a standard income bundle) and estimate utilities relative to that fixed scale. This eliminates menu-dependence. Alternatively, if you cannot fix a common reference, acknowledge that your normalization is an ethical weight. Explicitly label the method as "Relative Utilitarianism" and document its bias toward agents with wider outcome variances.

  Someone with policy authority must explicitly approve the aggregation rule (e.g., utilitarian sum vs. prioritarian sum) and the normalization anchors. The mathematics cannot make these choices; they are value judgments about how to weigh different people's welfare. Your tool should output the ranking *given* these parameters, allowing stakeholders to see how changing the ethical assumptions (the anchors or the aggregation function) alters the policy recommendation. Transparency about the ethical inputs is the only way to resolve the conceptual snag.
