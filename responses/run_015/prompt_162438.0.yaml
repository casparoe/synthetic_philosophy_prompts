  **The Scenario**

  In a high-dependency unit, two patients with identical C4 spinal cord injuries lie side-by-side, both permanently ventilator-dependent but stable on hourly manual bagging by a nurse to clear secretions and provide breaths; both have identical advance directives requesting full routine nursing care but no resuscitation if cardiac arrest occurs. Nurse A, attending Patient A, administers a scheduled dose of opioids for pain which slightly depresses respiratory drive, after which Patient A suffers a fatal arrhythmia inherent to the injury's autonomic instability. Nurse B, attending Patient B, simply fails to perform the scheduled manual bagging routine due to distraction, after which Patient B suffocates on secretions and hypoxia. Both nurses act with identical motive (adherence to protocol or comfort), exert identical effort, hold identical roles, and face identical certainty of death given their specific choices, with no difference in the patients' prior prognosis or quality of life.

  **Verdicts and Reasoning**

  *   **Agent A (Nurse A)**
      *   **Causal Account:** **Doing.** The injection of opioids is a positive behavior that figures in the causal route to the respiratory depression contributing to death.
      *   **Threat/Aid Account:** **Doing.** Administering a drug introduces a substance into the victim's body, which counts as active intervention rather than mere absence of aid.
      *   **Baseline Account:** **Letting Die.** The death is due to the victim's own pathological functioning (autonomic instability from spinal injury); the nurse failed to counteract this process but did not interfere with an established stable function.
  *   **Agent B (Nurse B)**
      *   **Causal Account:** **Allowing.** The failure to bag is an omission; the nurse's behavior (sitting still) does not positively figure in the causal route to suffocation in the same way an action does.
      *   **Threat/Aid Account:** **Allowing.** The nurse merely failed to supply the aid (air/clearing) the victim needed, without introducing a new threat.
      *   **Baseline Account:** **Killing.** The victim's respiratory functioning was constituted by the nurse's routine input; ceasing this input interferes with the victim's *current* functioning (breathing) rather than merely failing to counteract the underlying injury.

  **Structural Feature and Collapse**

  The single structural feature doing the work is the **constitutive status of the agent's input relative to the victim's current functioning**. For Agent A, the input (opioids) is superimposed on a dying baseline (pathology), so acting is "Doing" but the death remains "Letting Die." For Agent B, the input (bagging) *constitutes* the living baseline (functioning), so omitting is "Allowing" but the death counts as "Killing" (interference with that functioning). If this feature is removed by equalizing the baseline—either by viewing both patients as "dying of injury" (collapsing both to Letting Die) or both as "living by care" (collapsing both to Killing)—the distinctions align. Specifically, if the bagging is viewed merely as counteracting the injury (like the opioids), B's verdict collapses to Letting Die; if the opioids are viewed as interfering with autonomic function, A's verdict collapses to Killing.

  **Strongest Objection and Softness**

  The strongest objection is that the **Baseline Account is arbitrary**: a critic arguing that the distinctions are one (or inert) will claim the "baseline" is merely a rhetorical choice between "natural biological function" (where both are Letting Die) and "clinical status quo" (where both are Killing). They will argue that only foresight, intention, and outcome matter, rendering the D/A and K/LD labels morally inert descriptions of the same causal/normative facts. The case is softest on **Agent B's classification as Killing**: because the nurse did not create the dependency (the injury did), describing the omission as "interference with functioning" rather than "failure to counteract pathology" relies on a contentious drawing of the baseline that treats established care as part of the victim's "own" functioning, which a skeptic can reject as conflating aid with biology.
