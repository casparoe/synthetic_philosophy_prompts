      *   7. Feasibility? This is the tricky part. Is the moral exposure *actually* higher? Or just different?
      *   *Critique:* If God is perfectly good, He wouldn't choose a world with gratuitous evil. If the theft is gratuitous (no greater good), why did God choose *that* world?
      *   *Constraint 4 says:* "God's reason... independent of the wrongdoing." This implies the wrongdoing is *not* the reason, but it also implies we aren't looking for a greater good *from* the wrongdoing. It implies the world is chosen for Reason X, and the wrongdoing is a side effect.
      *   *Problem:* If there is a feasible world where the husband meets the wife *and* no theft occurs (Bob finds wallet), a perfectly good God *should* pick that one.
      *   *Molinist Defense:* Maybe the "Bob finds wallet" world isn't feasible? No, Molinism says CCFs are true prior to creation. If "Bob finds -> Returns" is true, that world is feasible.
      *   *So:* If Molinist God picks "Alice finds -> Steals" over "Bob finds -> Returns" for a *non-moral* reason (husband meeting timing), He seems to value the timing over the sin.
      *   *SF Defense:* SF God doesn't know "Bob finds -> Returns" is true. He only knows "Alice finds -> Steals." He picks the world for the husband meeting. He doesn't know he's avoiding a sin-free alternative.
      *   *Result:* Molinist God looks negligent or complicit for ignoring a known sin-free alternative for a trivial reason. SF God is ignorant of the alternative, so less culpable for not picking it.
      *   *This works.* It flips the "control" advantage into a "culpable ignorance/negligence" disadvantage.

