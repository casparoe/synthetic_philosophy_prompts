      *   *Total:* 9 questions. Perfect.

  5.  **Refining the Follow-ups:**
      *   The prompt asks for follow-ups "keyed to the answer he's most likely to give." I need to anticipate the standard philosophical defenses (e.g., "appeal to epistemic uncertainty," "bite the bullet," "distinction between risk and ambiguity").
      *   *Constraint Check:* The user knows the pop-level stuff. Don't explain Pascal's Mugging. Don't let him use the "Arbitrariness Jab."
      *   *Tone:* Journalistic, slightly adversarial but fair.

  6.  **Final Review against Constraints:**
      *   8-10 questions? Yes (planning 9).
      *   Follow-ups included? Yes.
      *   Topics covered? Audit, Portfolio, Negative, Actual Branch, Falsification.
