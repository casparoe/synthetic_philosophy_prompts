prompt: |-
  I do a podcast about ideas that wreck people's intuitions — I'm a science journalist, not a philosopher, so assume I already know the pop-level stuff (Pascal's mugging, the EA habit of multiplying huge stakes by tiny probabilities, the St Petersburg flavor of worry) and skip the 101.

  Next week's guest is a philosopher who defends expected value fanaticism straight up: no discounting small probabilities, no cap on utility, no threshold below which you're allowed to ignore a payoff — if the expected value is positive at any nonzero probability, you take it. I've read enough to know his two stock moves: the arbitrariness jab (pick any cutoff and I'll ask why *there*, and there's no non-arbitrary answer) and the step-by-step argument where each individual trade looks obviously fine but the endpoint is handing your wallet to a mugger. Assume he's already made both, and don't let him just restate them.

  Give me eight to ten questions, each with a follow-up keyed to the answer he's most likely to give. At least one on each of these:

  - The audit problem. At the probabilities that do the work here, the numbers come out of models with no track record — so the view seems to relocate all the action into the probability estimate rather than the value. Bit of scaffolding for you: a fictional Office of Long Shots that funds whatever tops the speculative-EV league table, staffed by people who know they'll never live to learn whether they were right. Ask him what its budget should be, and how it audits models it can never validate.
  - The portfolio point. One one-in-a-million shot at an astronomical payoff feels insane; ten thousand of them, pooled, looks like venture capital or a research portfolio and starts to feel sane. Does fanaticism get more plausible in basket form, and if so does that make the single-shot mugging intuition untrustworthy as evidence *against* the view?
  - Negative fanaticism. Is it symmetric? A tiny chance of astronomically bad outcomes — does the same reasoning that drags you toward the upside also let a micro-probability of catastrophe dominate every ordinary choice and freeze us, or is there an asymmetry he can defend?
  - The branch you actually land in. Take the long shot every time and you lose essentially always. What does the view say about the value of the 99.99999% world you burned the money in — does it commit him to a kind of indifference to what actually happens, and is that a bullet he bites or a cost he's been hiding?

  Close with one question about what would count as evidence against the view — not "what if the mugger is lying," I mean what actual empirical or theoretical finding would make him give it up.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Host:** Science journalist, podcast about counter-intuitive ideas. Knows the basics (Pascal's Mugging, EA, St. Petersburg). Wants to skip 101.
      *   **Guest:** Philosopher defending "Expected Value Fanaticism" (no discounting small probs, no utility caps, take any positive EV).
      *   **Guest's Known Moves:** "Arbitrariness Jab" (why *that* cutoff?) and "Step-by-Step Argument" (each trade looks fine, endpoint is mugging). *Constraint:* Don't let him just restate these.
      *   **Deliverable:** 8-10 questions, each with a follow-up keyed to the likely answer.
      *   **Required Topics:**
          1.  The Audit Problem (models with no track record, Office of Long Shots).
          2.  The Portfolio Point (single shot vs. pooled venture capital style).
          3.  Negative Fanaticism (symmetry with catastrophic risk).
          4.  The Branch You Actually Land In (losing almost always, indifference to actual outcomes).
          5.  Falsification (what evidence would change his mind?).
      *   **Tone:** Sharp, informed, pressing, avoiding rehashing standard objections he has ready-made answers for.

  2.  **Deconstruct the Guest's Position (Fanaticism):**
      *   Core claim: Maximize Expected Value (EV) regardless of probability size or utility magnitude.
      *   Strengths: Mathematical consistency, avoids arbitrary thresholds.
      *   Weaknesses: Vulnerable to bad faith actors (muggers), epistemic humility (can we really estimate $10^{100}$ utility?), practical paralysis (negative fanaticism), disconnect from lived experience (you almost always lose).

  3.  **Drafting Questions - Topic by Topic:**

      *   **Topic 1: The Audit Problem (Office of Long Shots)**
          *   *Goal:* Press on epistemic reliability. If we can't verify outcomes, how do we trust the inputs?
          *   *Draft Q:* You propose an Office of Long Shots. How do they audit models they can't test?
          *   *Refinement:* Make it sharper. Focus on the *budget allocation*. If the EV is infinite/high enough, shouldn't *all* money go there?
          *   *Follow-up:* He'll likely say "we use epistemic penalties" or "model uncertainty." Push back: Isn't that just a disguised probability discount?
          *   *Final Polish:* Focus on the "League Table." If the top entry is "Simulate Ancestors" vs. "Cure Malaria," how does the audit distinguish noise from signal when signal is unobservable?

      *   **Topic 2: The Portfolio Point**
          *   *Goal:* Explore if diversification saves fanaticism from insanity.
          *   *Draft Q:* Is it better if you take many small bets? Like VC?
          *   *Refinement:* Connect the intuition shift. If a portfolio of muggings feels sane, does that mean the single mugging intuition is wrong? Or does the portfolio only work because of law of large numbers (which doesn't apply to tail events)?
          *   *Follow-up:* He'll say "Diversification helps." Push back: In the tails, correlation is high (all models fail together). Does the portfolio argument collapse when the events aren't independent?

      *   **Topic 3: Negative Fanaticism**
          *   *Goal:* Symmetry test. If tiny prob * huge good = act, does tiny prob * huge bad = freeze?
          *   *Draft Q:* What about existential risk? Does a tiny chance of doom stop us?
          *   *Refinement:* Focus on *paralysis*. If every action has a non-zero chance of triggering a catastrophe (chaos theory), are we forbidden from acting?
          *   *Follow-up:* He might argue probabilities are *too* small. Push back: If you can't discount based on size, how do you distinguish a credible x-risk from a superstitious curse?

      *   **Topic 4: The Branch You Actually Land In**
          *   *Goal:* The "Almost Always Lose" problem.
          *   *Draft Q:* You lose 99% of the time. Do you care about the actual world?
          *   *Refinement:* Frame it as "Actualist" vs. "Expectabilist." If you burn resources in the actual world for a win in a counterfactual branch that never materializes, did you make a mistake *in this world*?
          *   *Follow-up:* He'll bite the bullet (EV is the only metric). Push back: Is this a theory of *rationality* or a theory of *math*? Does it cease to be action-guiding for agents embedded in a single timeline?

      *   **Topic 5: Falsification (Closing)**
          *   *Goal:* What changes his mind?
          *   *Draft Q:* What proves you wrong?
          *   *Refinement:* Exclude "Mugger is lying." Look for structural or empirical shifts. Maybe bounded utility evidence? Or a proof that EV diverges?
          *   *Follow-up:* If he says "Nothing, it's a priori," challenge the utility of the philosophy.

      *   **Filling the Gap (Need 8-10 questions total):**
          *   I have 5 core topics. I need to expand these into 8-10 distinct questions, perhaps splitting the complex ones or adding related angles (e.g., Computational Tractability, Moral Desert, or The "Cluelessness" Objection).
          *   *Idea A (Epistemic vs. Aleatory):* Distinguish between "probability is low" vs. "I don't know the probability." Fanaticism often conflates these.
          *   *Idea B (The "Why Now?" Question):* If these opportunities are everywhere, why hasn't history been full of them?
          *   *Idea C (Moral Status of the Mugged):* If I give money to the mugger, I deprive real people. Does the fanatical view sacrifice definite welfare for speculative welfare?

  4.  **Developing the Questions (Iterative Process):**

      *   *Q1 (Audit):* Focus on the "Office of Long Shots" budget.
      *   *Q2 (Audit Follow-up):* Focus on "Epistemic Humility" as a disguised discount.
      *   *Q3 (Portfolio):* The VC analogy. Does pooling validate the intuition?
      *   *Q4 (Portfolio Follow-up):* Independence assumption. Do tail risks correlate?
      *   *Q5 (Negative Fanaticism):* Paralysis by catastrophe.
      *   *Q6 (Negative Follow-up):* Distinguishing superstition from risk without thresholds.
      *   *Q7 (The Actual Branch):* Sacrificing the actual for the possible.
      *   *Q8 (Actual Follow-up):* Is rationality timeline-relative?
      *   *Q9 (Cluelessness/Model Dependence):* (New angle) The inputs are model-dependent. If EV depends entirely on the model choice, isn't the "objective EV" a mirage?
      *   *Q10 (Falsification):* The closing constraint.

      *Wait, I need to ensure I hit the specific prompts requested.*
