  8.  **Final Polish:** Check the flow. Start with the institutional implementation (Audit), move to the strategy (Portfolio), then the risks (Negative), then the lived reality (Branch), end with the epistemology (Falsification). This creates a narrative arc.

  *(Self-Correction on Follow-ups)*: Make sure the follow-up isn't just "Okay, but..." but specifically targets the *likely* defense. For example, if he says "We use epistemic discounts," the follow-up should be "Isn't that just the threshold you claimed was arbitrary?"

