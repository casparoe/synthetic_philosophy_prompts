answer: |-
  Here are nine questions designed to bypass his standard defenses and press on the implementation and consequences of the view.

  ### 1. The Office of Long Shots Budget
  Let's operationalize this. Imagine we create an "Office of Long Shots" tasked with funding whatever tops the speculative-EV league table. Given your view, if a project promises $10^{50}$ utility at probability $10^{-20}$, it dwarfs any certain good. Does this office get 100% of the discretionary budget immediately? If not, what non-arbitrary constraint stops you from liquidating all certain welfare to buy lottery tickets against the cosmos?

  **Follow-up:** *If he says "No, we must account for model uncertainty/epistemic humility":*
  Isn't "model uncertainty" just a backdoor probability discount? You've argued against capping utility or cutting off probabilities because it's arbitrary; but assigning a "credibility weight" to a model that can't be tested seems to require exactly the kind of intuitive cutoff you claim is illegitimate. Where does that weight come from if not intuition?

  ### 2. Auditing the Unverifiable
  That Office needs to audit its grants. But by definition, the projects that win these fanatical EV calculations are things we won't live to see verified (e.g., influencing the far future, simulating ancestors). If the auditors know they will never receive feedback on whether the models worked, what metric do they use to fire a bad analyst? If the answer is "internal consistency," aren't you just funding the best science fiction writers?

  **Follow-up:** *If he says "We use calibration on smaller, testable analogues":*
  But the fanaticism kicks in precisely where the analogues break down—that's the whole point of the tail events. If the model's predictive power holds only up to a certain scale, and the EV relies on the power holding *beyond* that scale, you're extrapolating a trend line into a zone where you've admitted you have no data. How is that mathematically distinct from guessing?

  ### 3. The Portfolio Intuition Shift
  Critics find the single mugging case insane, but a portfolio of ten thousand long shots looks like venture capital or basic research. Does the plausibility of your view depend on this aggregation? If so, are you admitting that the "mugging intuition" isn't evidence against the math, but just evidence that humans are bad at visualizing sample sizes?

  **Follow-up:** *If he says "Yes, aggregation makes it rational":*
  Venture capital works because returns are independent; one startup's failure doesn't tank the others. But existential long shots (e.g., "prevent simulation shutdown") are highly correlated—if the physics is wrong, they all fail. If the correlation approaches 1 in the tails, doesn't the portfolio argument collapse back into the single-shot insanity?

  ### 4. Negative Fanaticism and Paralysis
  Your argument for upside seems symmetrical. If a tiny probability of astronomical good compels action, does a tiny probability of astronomical bad compel paralysis? If every action has a non-zero Chaotic Butterfly chance of triggering a catastrophe, does the view forbid leaving the house?

  **Follow-up:** *If he says "The probabilities of catastrophe are sufficiently lower than the upside":*
  On what basis? If we are dealing with probabilities like $10^{-30}$, we are deep in the realm where we cannot distinguish signal from noise. How do you justify a precise probability ratio between "unbounded good" and "unbounded bad" without empirical track records? It looks like you're smuggling in a optimism bias as a premise.

  ### 5. Distinguishing Risk from Superstition
  Following on that: A fanatic must ignore a $10^{-100}$ chance of eternal hell, but accept a $10^{-100}$ chance of eternal heaven. What structural feature of the *model* allows you to dismiss the superstitious curse while accepting the speculative payoff? If the answer is "the curse model is less rigorous," isn't rigor irrelevant at probabilities that low?

  **Follow-up:** *If he says "We only consider physically possible outcomes":*
  But physics at those scales is exactly what's in dispute. If you restrict the hypothesis space to "current physics allows it," you've imposed a conservative prior that caps your EV. You're essentially saying "I will only be fanatical about things the current paradigm deems possible," which seems to defeat the purpose of betting on paradigm shifts.

  ### 6. The Branch You Actually Land In
  Let's talk about the actual world. If you take the fanatical bet every time, you lose in 99.999...% of outcomes. In the world you actually inhabit—the one where the money is gone and the miracle didn't happen—did you make a mistake? Or does the view commit you to saying the actual outcome is irrelevant to the rationality of the choice?

  **Follow-up:** *If he says "Rationality is about the decision, not the outcome":*
  That's standard, but usually, we expect rational decisions to yield better outcomes *on average* over a lifetime. Here, the "average" is a mathematical abstraction that never manifests in experience. If a policy guarantees impoverishment in the actual timeline for the sake of a ghost timeline, in what sense is it "action-guiding" for an embedded agent?

  ### 7. Sacrificing the Definite for the Speculative
  To fund these long shots, you must divert resources from certain, high-confidence goods (e.g., curing malaria now). You are effectively trading definite welfare for speculative welfare. Does the view imply that people suffering *now* have less moral weight than potential people in the high-utility tail? Is this a feature or a bug?

  **Follow-up:** *If he says "It's not about moral weight, it's about total magnitude":*
  But magnitude is a function of the probability estimate. So you are allowing a highly uncertain estimate to override a highly certain need. If the estimate is wrong (and it likely is), you have harmed real people for a ghost. Does the view offer any recourse for the people who suffered due to a model error?

  ### 8. Computational Tractability
  If EV is sensitive to tiny probabilities of huge utilities, calculating EV becomes computationally intractable—you have to search the entire hypothesis space for every action to ensure you haven't missed a "mugging" scenario. How is a human or AI supposed to function without ignoring these tails for the sake of efficiency? Is "ignoring them" rational if it's necessary for functioning?

  **Follow-up:** *If he says "We use heuristics for computation, but the norm remains":*
  So the normative theory tells us to do something the agent literally cannot do without breaking its own cognitive architecture. Is a philosophy that requires agents to violate their own computational limits to be "rational" still a philosophy of rationality, or just a mathematical idealization?

  ### 9. Falsification Conditions
  Finally, what would count as evidence against this view? I don't mean "what if the mugger is lying." I mean: is there an empirical finding or a theoretical proof that would make you abandon expected value maximization in the tails? Or is this an a priori commitment that no data can touch?

  **Follow-up:** *If he says "It's a conceptual truth, so no data can refute it":*
  If no empirical outcome can refute it, and it prescribes actions that lead to ruin in the actual world, we need to be clear: you're defending a theological commitment, not a scientific or decision-theoretic one. Should we label it as such?
