      *   Avoid his stock moves? Yes, the questions are designed to bypass the "arbitrariness" and "step-by-step" defenses by focusing on implementation and consequences.

  7.  **Drafting the Content:** (Self-Correction during drafting)
      *   *Correction on Q1:* Make sure the "Office of Long Shots" framing is prominent as requested.
