prompt: |-
  I'm on the standards committee for a farmed-seafood certification scheme — we audit maybe 200 sites, mostly salmon and trout, plus a handful of shrimp farms and one crab operation. Our own precedents: we banned ice-slurry chilling for warm-water species because it seems to prolong consciousness rather than end it; we allowed CO2 narcosis for trout only after a phase-in and only where the water's buffered; we've never certified a decapod site that ships animals live to market; and last year we approved a pilot outcome metric alongside the methods list — no corneal or vestibulo-ocular response within 20 seconds of stun.

  Now a big member wants us to go fully outcome-based: scrap the approved-methods list, any slaughter method allowed as long as the site can demonstrate the metric at audit. The wrinkle is that nobody's got a validated unconsciousness indicator for shrimp or crab, so for those species the metric can't really be failed.

  Draft the memo I'll circulate before Thursday. I want an actual recommendation (accept, reject, or accept with conditions, and which conditions), reasons the applicant can engage with rather than welfare boilerplate, and a serious treatment of their best point — that our methods list is already out of date and quietly locks in expensive kit only big producers can afford. Also tell me what we'd be commiting to on decapods either way, since I suspect that's the real decision hiding in this one.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**

      *   **Role:** Member of a standards committee for a farmed-seafood certification scheme.
      *   **Context:** Auditing ~200 sites (mostly salmon/trout, some shrimp, one crab).
      *   **Current Precedents:**
          *   Banned ice-slurry for warm-water species (welfare concern: prolongs consciousness).
          *   Allowed CO2 narcosis for trout only with buffering/phase-in.
          *   Never certified decapod sites shipping live to market.
          *   Recently approved a pilot outcome metric: No corneal or vestibulo-ocular response within 20 seconds of stun.
      *   **The Proposal:** A big member wants to go fully outcome-based (scrap approved methods list, allow any method if the metric is met).
      *   **The Problem:** No validated unconsciousness indicator exists for shrimp/crab. For these species, the metric can't really be failed (loophole).
      *   **The Goal:** Draft a memo to circulate before Thursday.
      *   **Requirements:**
          *   Actual recommendation (Accept/Reject/Conditional).
          *   Reasons the applicant can engage with (practical/technical, not just welfare boilerplate).
          *   Address their best point (methods list locks in expensive kit/big producers).
          *   Highlight the decapod commitment (the "real decision").
      *   **Tone:** Professional, committee-appropriate, decisive but nuanced, acknowledging the complexity.

  2.  **Determine the Recommendation:**

      *   *Option A: Accept.* Too risky. The decapod loophole undermines the scheme's integrity. If shrimp/crab can't fail the metric, any method is allowed, potentially including inhumane ones.
      *   *Option B: Reject.* Safe, but ignores the valid point about innovation and barrier to entry for smaller producers. Might alienate the big member.
      *   *Option C: Accept with Conditions.* This is the sweet spot. It acknowledges the shift to outcomes but plugs the decapod hole and manages the transition risk.
      *   *Decision:* **Accept with Conditions.** specifically regarding species-specific validation and a transitional hybrid model.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the proposal's merit (innovation) but flag the critical gap (decapods).
      *   **The Applicant's Strongest Point:** Address the "methods list locks in expensive kit" argument. Validate it. It's about fairness and innovation. This builds rapport.
      *   **The Critical Flaw (Decapods):** Explain the scientific gap. No validated indicator for shrimp/crab = metric is meaningless for them = *de facto* deregulation. This is the "real decision."
      *   **The Recommendation:** "Accept in Principle, Implement in Phases."
      *   **Conditions:**
          1.  **Species-Specific Validation:** Outcome metrics only apply where scientifically validated (Salmon/Trout yes, Decapods no).
          2.  **Hybrid Model:** Keep methods list for decapods until science catches up.
          3.  **Audit Verification:** How do auditors actually check this without specialized tech?
          4.  **Live Shipping:** Reiterate the ban on live shipping for decapods (precedent).
      *   **Implications/Commitments:** What does this mean for the future? R&D burden, potential decapod decertification if science doesn't advance.
      *   **Closing:** Call to action for the Thursday meeting.

  4.  **Refining the Content (Self-Correction/Nuance):**

      *   *Tone Check:* Is it too academic? Needs to be business-like. Is it too soft? Needs to be firm on the welfare science.
      *   *The "Ice-Slurry" Precedent:* Mention this to show consistency. We ban methods that *look* okay but aren't. A metric that *looks* okay but can't be measured is similar.
      *   *The "Big Member" Aspect:* Don't name them, but acknowledge their market influence. The recommendation needs to be something they can live with (innovation path) while protecting the label.
      *   *The Decapod "Real Decision":* Make sure this is highlighted. If we go fully outcome-based now, we effectively certify inhumane crab slaughter because we can't prove it's humane. If we keep the methods list, we limit innovation. The compromise is the hybrid approach.

  5.  **Drafting the Memo (Iterative Process):**

      *   *Subject Line:* Needs to be clear. "Proposal for Outcome-Based Slaughter Standards."
      *   *Executive Summary:* Get straight to the recommendation.
      *   *Section 1: The Merit.* Acknowledge the cost/innovation argument. It's valid.
      *   *Section 2: The Risk.* The decapod gap. Use the term "regulatory vacuum."
      *   *Section 3: Recommendation.* Conditional Acceptance.
      *   *Section 4: The Decapod Commitment.* Be explicit. If we do this, we are committing to funding/finding science, or potentially dropping decapods.
      *   *Section 5: Next Steps.*

  6.  **Final Polish:**

      *   Ensure the "20 seconds of stun" metric is referenced correctly.
      *   Ensure the distinction between teleosts (fish) and decapods is clear.
      *   Check that the "live to market" precedent is reinforced.
      *   Make sure the tone is collaborative but authoritative. (e.g., "We cannot certify what we cannot measure.")

  7.  **Final Review against constraints:**
      *   Memo format? Yes.
      *   Recommendation included? Yes.
      *   Reasons applicant can engage with? Yes (innovation, cost, audit feasibility).
      *   Treatment of their best point? Yes (barrier to entry).
      *   Decapod commitment highlighted? Yes.
      *   Before Thursday? (Implied urgency in tone).

  *(Self-Correction during drafting)*: I initially thought about suggesting a moratorium on decapod certification. But the prompt says there's only *one* crab operation and a handful of shrimp. A moratorium might be too aggressive. Better to keep the *methods list* for them specifically. That achieves the same welfare protection without kicking them out immediately, provided they follow the old rules.

  *(Refining the "Commitment")*: The prompt asks "what we'd be committing to on decapods either way." I need to make sure the memo explicitly states that adopting this proposal commits the committee to solving the decapod science problem, or admitting we can't certify them humanely.

  8.  **Final Output Generation** (Proceeding to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Standards Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Proposal for Fully Outcome-Based Slaughter Standards

  **Executive Summary**

  The proposal from [Member Name] to transition from a prescriptive methods list to a fully outcome-based standard is strategically sound regarding innovation and market access, but scientifically premature for our full species scope.

  **Recommendation:** **Accept with Conditions.**
  We should adopt the outcome-based framework for teleosts (salmon/trout) immediately, but retain the prescriptive methods list for decapods (shrimp/crab) until species-specific unconsciousness indicators are validated. Additionally, we must codify the existing precedent prohibiting live shipment for decapods into the core standard to prevent regulatory arbitrage.

  **1. Engaging the Applicant's Core Argument**

  The applicant argues that our current approved-methods list creates a barrier to entry that favors large producers with capital for specific proprietary kit (e.g., specific percussive stunners or buffered CO2 systems). They are correct.

  By locking certification to specific technologies, we inadvertently stifle innovation. A smaller producer might develop a novel electrical or thermal method that is more humane and cost-effective than our current approved list, but cannot be certified under the current regime. Furthermore, maintaining a methods list requires us to constantly audit equipment rather than animal welfare, which is a resource drain. Moving to outcome-based metrics aligns with our pilot metric (no corneal/vestibulo-ocular response within 20 seconds) and shifts the burden of proof to the operator, which is the correct long-term position for the scheme.

  **2. The Critical Gap: Decapod Validation**

  While the logic holds for salmon and trout, it collapses for decapods. Our pilot metric relies on reflex testing (corneal/vestibulo-ocular). These reflexes are validated indicators of unconsciousness in fish. They are **not** validated for shrimp or crab.

  If we scrap the methods list for decapods now, we create a regulatory vacuum. A site could process crabs using any method—including those we previously deemed unacceptable—and technically "pass" the audit because the metric cannot be scientifically failed. The absence of a reflex in decapods does not equate to the absence of consciousness in the same way it does for trout.

  Adopting the proposal fully would effectively decertify our welfare standards for decapods while keeping the label on the product. Given we have never certified a decapod site that ships live to market, moving to a metric we cannot measure contradicts our precedent of precautionary welfare management (similar to our ban on ice-slurry for warm-water species).

  **3. Proposed Conditions for Approval**

  To accept the proposal without compromising scheme integrity, I propose the following conditions:

  *   **Species-Specific Applicability:** The outcome metric is mandatory and sufficient for salmonids. For decapods, the outcome metric is *aspirational only* until validated. Decapod sites must continue to comply with the prescriptive methods list (e.g., specific electrical stunning parameters) until independent validation of decapod unconsciousness indicators is published.
  *   **Audit Verification Protocol:** For the outcome metric to be auditable, sites must provide video evidence of the 20-second window for a statistically significant sample size per batch, reviewed by a third-party veterinarian, rather than relying solely on spot-checks by generalist auditors.
  *   **Live Shipment Codification:** The precedent regarding live shipment for decapods must be moved from "committee precedent" to "explicit standard." If we allow outcome-based slaughter for decapods in the future, we cannot allow the welfare gain to be negated by live transport to market.

  **4. The Hidden Decision: Our Commitment on Decapods**

  We need to be clear about what this decision commits us to regarding crustaceans.

  *   **If we reject the proposal:** We maintain the status quo. Decapod welfare remains static, locked to current technology. We avoid risk, but we acknowledge we are certifying based on equipment rather than confirmed welfare outcomes.
  *   **If we accept (with the conditions above):** We are committing the scheme to funding or commissioning the scientific validation of decapod unconsciousness indicators within 24 months.

  If that science does not emerge, we must be prepared to either **suspend decapod certification** or **revert to a strict prescriptive ban** on certain methods. We cannot indefinitely certify a species where we admit we cannot measure the primary welfare outcome.

  **5. Next Steps**

  I recommend we circulate this position to the applicant before Thursday's call. It signals willingness to modernize the standard (addressing their cost/innovation concern) while protecting the scheme from the liability of certifying unverifiable welfare outcomes in decapods.

  Please review and let me know if you support this conditional approach.

  [Your Name]
  Standards Committee Member
