      *   *Point 4: Succession/Consent.* Must address the new province. Autonomy cannot be inherited without a mechanism for accession or exit. (Common error: Dismissing this as standard constitutional law rather than a behavioural precommitment issue).
      *   *Point 5: The Fix Paradox.* Must discuss how making the lock easier to change (sunset/review) undermines its purpose (resisting temptation). (Common error: Proposing fixes without analyzing the trade-off).
      *   *Subjectivity Flag:* Point 5 is the most theoretical and open to debate.

  5.  **Differentiating A vs. B:**

      *   *B Answer:* Identifies the problems and applies the autonomy test mechanically. Good structure, correct conclusions.
      *   *A Answer:* Grapples with the *tension*. Recognizes that precommitment is inherently paradoxical. Discusses how the "Crew" problem interacts with the "Wrong-Siren" problem (e.g., if the Guard had discretion, would that solve the siren problem or create a crew problem?). Synthesizes the issues rather than listing them.

