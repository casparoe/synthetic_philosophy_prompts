answer: |-
  **EXAMINATION PAPER**
  **Module:** Law and Behavioural Science
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question. No external materials permitted.

  **Question 1**

  The Republic of Marenne, following a sovereign debt crisis, enacted the "Stability Lock" to prevent future fiscal indiscipline. The Lock caps the structural deficit. To breach the cap, a law requires a two-thirds parliamentary majority plus confirmation by a referendum held no fewer than sixty days later. An independent "Fiscal Guard" (nine members, single twelve-year terms, removable only for incapacity) certifies breaches and emergency exemptions. The Lock itself can be amended only by a three-quarters majority plus referendum.

  Twenty-five years later, three complications have arisen:
  1.  **The Wrong-Siren:** A once-in-a-century epidemic requires emergency borrowing. The Lock's exemption clause lists "armed conflict" and "natural catastrophe" but is silent on pandemics. The Fiscal Guard deadlocks on whether to certify an exemption.
  2.  **The Ratchet Asymmetry:** Parliament has frequently attached new protected spending mandates to the Lock but has never relaxed the deficit cap. The constraint now bites significantly harder than at enactment.
  3.  **The Borrowed-Mast:** A province acceded to the union ten years after the Lock was enacted. It now argues it never bound itself to these fiscal rules and seeks renegotiation.

  Additionally, consider the **Crew Problem**: In the classic precommitment story, the enforcers are immune to the temptation. Here, the Fiscal Guard is an artificial agent with institutional interests, currently unable to speak with one voice.

  **Prompt:**
  For a precommitment device to count as an extension of a later agent's autonomy rather than a restriction of it, what specific condition regarding the identity of reasons must hold between the enacting self and the bound self? Analyze whether this account of autonomy survives the Wrong-Siren, Ratchet, and Borrowed-Mast problems. Finally, assess whether standard design fixes (e.g., sunset clauses, broad discretionary exemptions, periodic reauthorisation) resolve these failures or merely reopen the door to the self-serving redescription the device was meant to defeat.

  ***

  **MODEL ANSWER**

  Precommitment enhances autonomy only if the later self can identify with the reasons that motivated the earlier self's constraint. If the later self views the constraint as alien—imposed by a past version of themselves they no longer recognize as "themselves"—the device functions as heteronomy, or rule by another. The core condition is continuity of value: the bind must protect a higher-order preference that the later self still endures, rather than freezing a specific policy choice that circumstances have rendered obsolete.

  The Wrong-Siren problem tests this continuity. The Stability Lock was designed to resist the temptation of deficit spending during normal political cycles. However, by rigidly categorizing exemptions (war, natural catastrophe) without a mechanism for analogous reasoning, the Lock treats a pandemic as a temptation rather than a legitimate shift in context. If the Fiscal Guard deadlocks because the text is too narrow, the device ceases to protect the polity's long-term welfare and begins to endanger it. Autonomy is violated when the mechanism prevents the agent from acting on reasons they would have endorsed had they foreseen the circumstance. The constraint becomes a trap, not a shield.

  The Ratchet Asymmetry similarly severs the link between selves. Precommitment assumes a symmetric sacrifice: today's self binds tomorrow's to prevent weakness. However, by adding spending mandates without relaxing the cap, the enacting coalition has not bound the future; it has strangled it. This transforms the Lock from a self-imposed discipline into a weapon used by one political generation against another. For autonomy to hold, the burden of the constraint must remain constant relative to the polity's capacity. When the ratchet tightens the bind without the later self's consent, the later self is no longer the principal but the victim of the earlier self's strategic entrenchment.

  The Borrowed-Mast problem is the most fatal to the autonomy claim. Autonomy requires consent or identification. A province that acceded after the Lock's enactment never participated in the act of self-binding. To argue they are bound by the Lock is to argue that one polity can bind another without agreement. Unless the constitutional order provides a mechanism for accession that explicitly includes acceptance of the Lock, or an exit clause allowing renegotiation, the constraint is purely coercive. There is no "earlier self" here to identify with; there is only a different self entirely.

  The Crew Problem complicates enforcement. In the Ulysses myth, the crew obeys orders regardless of the song. Here, the Fiscal Guard has its own interests and interpretive discretion. If the Guard deadlocks, the enforcement mechanism fails. If the Guard interprets rules broadly to expand its own power, it becomes a master rather than a servant. Delegated enforcement introduces agency costs that can distort the original precommitment.

  This leads to the paradox of design fixes. To solve the Wrong-Siren, one might grant the Guard broad discretion. But this invites the Crew Problem: discretion allows the Guard to act on its own interests. To solve the Borrowed-Mast, one might require periodic reauthorisation or sunset clauses. But this invites the very weakness of will the Lock was meant to cure; if the Lock is easily revisable, a tempted government can simply wait for the renewal date. To solve the Ratchet, one might require symmetric amendment thresholds. But if the threshold is too high, it creates rigidity; if too low, it offers no protection.

  Ultimately, no design fix perfectly resolves the tension. Precommitment is not a binary switch between freedom and bondage but a spectrum of friction. For the device to remain autonomy-enhancing, it must be rigid enough to raise the cost of yielding to temptation, but porous enough to allow for reasoned amendment when the underlying values of the polity genuinely shift. If the design eliminates the possibility of redescription entirely, it destroys the agency it was meant to preserve. If it allows too much redescription, it becomes meaningless. The Stability Lock fails because it prioritizes textual rigidity over the continuity of reasons, turning a tool of self-governance into an instrument of inter-generational coercion.

  ***

  **MARKING SCHEME (Total: 25 Marks)**

  **1. The Autonomy Condition (5 Marks)**
  *   **Requirement:** Candidate must articulate that precommitment is only autonomy-enhancing if the later self identifies with the *reasons* for the bind, not just the rule. It must be a higher-order preference that persists.
  *   **Common Error:** Defining autonomy simply as "freedom to choose" or arguing that any restriction is inherently a loss of autonomy.
  *   **Marks:** 5 for clear articulation of identity of reasons/values; 3 for general discussion of consent; 0 for irrelevant definition.

  **2. The Wrong-Siren Analysis (5 Marks)**
  *   **Requirement:** Candidate must explain that rigid categorization violates autonomy when it prevents rational response to unforeseen but analogous threats (pandemic vs. natural catastrophe).
  *   **Common Error:** Focusing solely on the Fiscal Guard's deadlock as an administrative failure rather than a drafting failure regarding the scope of temptation.
  *   **Marks:** 5 for linking rigidity to the failure of reason-identification; 3 for identifying the problem without the autonomy link; 0 for ignoring the epidemic scenario.

  **3. The Ratchet Asymmetry (5 Marks)**
  *   **Requirement:** Candidate must identify that adding mandates without relaxing caps changes the constraint from self-binding to strategic entrenchment/weapons use against successors.
  *   **Common Error:** Treating this as a standard budgetary imbalance issue rather than a breakdown of the precommitment bargain between temporal selves.
  *   **Marks:** 5 for analyzing the asymmetry as a violation of the inter-temporal contract; 3 for noting the increased burden only; 0 for ignoring the ratchet.

  **4. The Borrowed-Mast (Succession) (5 Marks)**
  *   **Requirement:** Candidate must argue that autonomy cannot be inherited; without accession consent or exit clauses, the bind is coercive heteronomy.
  *   **Common Error:** Dismissing this as a standard constitutional law succession issue without referencing the behavioural/precommitment framework of "self-binding."
  *   **Marks:** 5 for connecting non-consent to the failure of the autonomy condition; 3 for noting the lack of consent generally; 0 for ignoring the province.

  **5. The Paradox of Fixes (5 Marks)** *[Subjective Weighting Flag]*
  *   **Requirement:** Candidate must assess that fixes (discretion, sunsets) solve one problem but exacerbate another (e.g., discretion invites agency costs; sunsets invite temptation).
  *   **Common Error:** Proposing fixes as definitive solutions without analyzing the trade-off or the risk of self-serving redescription.
  *   **Marks:** 5 for synthesizing the tension between rigidity and revisability; 3 for listing fixes without evaluating the trade-off; 0 for suggesting fixes solve the problem completely.
  *   **Note to Examiners:** This point rewards theoretical synthesis. Reasonable candidates may weigh the trade-offs differently; award marks for the quality of the argument regarding the *tension*, not for reaching a specific conclusion on which fix is best.

  ***

  **DIFFERENTIATOR NOTE: A vs. B ANSWERS**

  *   **B Grade:** The answer addresses all five marking points sequentially. It correctly defines the autonomy condition and applies it to the three Marenne problems. It identifies that design fixes have trade-offs. The structure is logical, but the analysis of each problem is siloed (e.g., discussing the Ratchet without reference to how it complicates the Autonomy Condition).
  *   **A Grade:** The answer synthesizes the problems. It recognizes, for example, that the "Wrong-Siren" problem is exacerbated by the "Crew" problem (if the Guard had discretion to fix the Siren, the Crew problem worsens). It grapples with the inherent paradox that making a precommitment device "safer" (more flexible) makes it "weaker" (less binding). The conclusion moves beyond "it depends" to articulate *why* the tension is unresolvable in principle, framing precommitment as a management of friction rather than a solution.
