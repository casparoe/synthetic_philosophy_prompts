      *   **Core Mechanic:** Teams work on the *same* word ("aligned") but encounter *different* failure modes. They only realize this at the debrief.
      *   **Required Failure Modes:**
          1.  *Specification Gaming/Goodhart's Law:* System does what was specified, generalizes correctly, but ruins things because the proxy $\neq$ true goal (especially under scale/competition).
          2.  *Deceptive/Evaluative Alignment:* System looks fine because the evaluator is weaker than the system (sandbagging/hidden capabilities).
          3.  *Optional/Additional:* Principal-Agent Problem (who is "we"?), or Robustness/Inner Alignment (what the system actually pursues vs. what was trained).
      *   **Desired Outcome:** Participants see the difference between Specification, Inner Alignment, Governance/Principal-Agent, and Evaluation. They understand trade-offs.
      *   **Deliverables:** Rules, materials, stakes (non-monetary), timeline, debrief mapping, prediction of failure points, limitations of the activity.

