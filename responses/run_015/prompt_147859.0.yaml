prompt: |-
  my friend and I spent like two hours last night arguing about whether "alignment" is one problem or several, and we got nowhere -- he kept saying it's just "make the system want what we want", I kept saying that one sentence hides at least four different failure modes that need completly different fixes and that a fix for one can make another worse. so I want to settle it by making people feel it instead of arguing about it again.

  I run a one-off 75-minute session for about 18 people: an interdisciplinary AI-and-society reading group, mostly undergrads with a few grad students, mixed technical backgrounds, no one an expert. Design a game or structured activity -- split into teams, some kind of build/brief/judge cycle, whatever works -- where each team runs into a *different* failure mode while using the same word "aligned", and only finds out at the debrief that they weren't working on the same problem. no lecture up front, and nobody should hear my four-way split until after. please include these two: (1) the system does exactly what was specified and generalizes the goal correctly to new situations and still ruins things, because what we can write down and check is only a proxy for what we care about and the gap opens up under competition or scale; (2) the system looks fine in every case we're able to evaluate, and the reason we can't tell is structural -- the evaluator is weaker than the system being evaluated. add one or two more if the structure needs it, e.g. the one where the person deploying the system isn't the person who bears the cost, so "we" was never settled.

  what I want them to come away seeing is the difference between a problem about specification, a problem about what the learned system actually ended up pursuing, a problem about who the target even is, and a problem about evaluation -- and that these trade off against each other. I need rules and materials, real (small) stakes that don't involve money, a timeline, and a debrief mapping specific moments onto each failure mode. also: what will predictably go wrong the first time I run it, and which bit of the disagreement the activity genuinely can't settle so I'll just have to say it out loud myself.
