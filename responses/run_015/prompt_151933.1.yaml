answer: |-
  ### Desiderata for Higher-Order Accounts

  **1. The Misrepresentation Constraint**
  *   **Requirement:** The theory must specify the phenomenology when the higher-order state (HOS) mismatches the first-order state (FOS) or lacks a target entirely.
  *   **Case:** *Targetless HOTs:* If you have a HOT about pain but no nociceptive firing, is there pain? *Mismatch:* If a monitor labels a red state as green, is the qualia green (HOS determines content) or red (FOS determines content)?
  *   **Rationale:** HO theories claim the HOS makes the state conscious; if the HOS is wrong, the theory must explain whether consciousness tracks the representation or the reality to avoid arbitrariness.

  **2. The Regress Constraint**
  *   **Requirement:** The account must explain why the HOS itself does not require a third-order state to become conscious, without rendering the HOS unconscious in a way that makes it incapable of conferring consciousness.
  *   **Case:** *The Homunculus:* If the HOS is conscious, we need a HOS* to notice it, ad infinitum. If the HOS is unconscious, how does an unconscious state confer phenomenal character?
  *   **Rationale:** Logical coherence; the mechanism of "conferring consciousness" cannot presuppose the very phenomenon it explains.

  **3. The State vs. Creature Consciousness Distinction**
  *   **Requirement:** The theory must distinguish between a mental state being phenomenally lit up and the subject having access/reportable knowledge of that state.
  *   **Case:** *Blindsight:* Patients discriminate stimuli without phenomenal experience or belief. A theory that equates consciousness with report/access fails here.
  *   **Rationale:** Empirical adequacy; phenomenal consciousness appears possible without full metacognitive access or endorsement.

  **4. The Phylogenetic/Developmental Constraint**
  *   **Requirement:** The account must allow for phenomenal consciousness in subjects lacking sophisticated metacognitive concepts or linguistic capacities.
  *   **Case:** *Infants and Non-Human Animals:* Newborns and dogs likely feel pain or see red, but lack the concept "pain" or "red."
  *   **Rationale:** Evolutionary continuity; it is implausible that phenomenality awaits the development of complex conceptual apparatuses.

  **5. The Psychophysical Dissociation Constraint**
  *   **Requirement:** The theory must accommodate data where confidence (metacognition) comes apart from accuracy (first-order performance).
  *   **Case:** *Type-2 ROC Curves:* Subjects can be highly accurate in discrimination while reporting low confidence, or vice versa.
  *   **Rationale:** Empirical fit; if HO states *are* confidence reports, they should track perfectly, but they often dissociate.

  ***

  ### Negotiability and Prejudice

  **Non-Negotiable:**
  *   **Qualitative Character:** If the theory explains access but not *what it is like*, it fails as a theory of phenomenal consciousness.
  *   **Internal Consistency (Regress):** A theory that entails an infinite chain is logically untenable.
  *   **Misrepresentation Logic:** You cannot leave the phenomenology of error undefined; the theory lives or dies by how it handles the HOS/FOS relationship.

  **Camp Prejudice (Negotiable):**
  *   **Introspective Parsimony:** Insisting that the theory not multiply states beyond what introspection finds is **anti-HO prejudice**. HO theories *by definition* posit states we do not introspect (the unconscious HOS). Demanding parsimony here rules out the category by fiat.
  *   **Reductive Physicalism:** While desirable for naturalists, HO logic is compatible with property dualism; insisting on physicalism excludes viable conceptual analyses.
  *   **Overflow:** Insisting experience must exceed reportable capacity is a specific commitment (Block-style); HO theories can be compatible with "No Overflow" (Access) views without logical contradiction.

  ***

  ### Incompatible Pairs & The Killer Constraint

  **Incompatible Pairs:**
  1.  **Conceptual Requirement + Animal Consciousness:** If the HOS must employ concepts (Rosenthal), animals/infants cannot be conscious. If they can be conscious, the HOS cannot be strictly conceptual.
  2.  **Introspective Parsimony + HO Mechanism:** You cannot demand the ontology match introspection while positing unconscious higher-order states.

  **The Single Requirement That Excludes the Most Candidates:**
  **The Phylogenetic/Developmental Constraint.** Insisting that creatures without metacognitive concepts (infants, most animals) have phenomenal consciousness eliminates the dominant "Conceptual Requirement" versions of HOT (e.g., Rosenthal), forcing a move to non-conceptual HOP or First-Order hybrids.

  ***

  ### Theory Summaries

  HOT: Consciousness arises when a non-conscious mental state is targeted by a distinct, non-perceptual higher-order thought.
  HOP: Consciousness arises when a mental state is scanned by a distinct, quasi-perceptual higher-order monitoring mechanism.
  Self-Representational: Consciousness arises when a mental state represents both its external object and its own existence simultaneously.
