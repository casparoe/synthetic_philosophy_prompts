answer: |-
  Good evening. For those I haven't met properly yet, I'm the new hire from philosophy. I know what that sounds like to half this room. To the other half, I know what the engineers think of me. I'm not here to resolve that tension by promising I'll learn to code, or by promising I'll teach you how to think. I'm here because we are in a unique historical position, and I think we are wasting it.

  In biology, when we ask what a heart is *for*, we have to guess at the selection history. We look at fossils, we look at ancestors, we infer. But in this lab, we don't guess. We have the logs. We have the architecture, the data, the objective, the optimizer, and every intermediate checkpoint. We have the complete causal history of the system's selection.

  And yet, even with the entire history on the record, we still cannot agree on what the internal states *are*.

  To the engineers here, a representation is a direction in activation space that covaries with a property. If a neuron fires when there is a cat, and you patch it and the model stops saying "cat," you have found the cat detector. The job is the computation; the meaning is the correlation.

  To the philosophers here, that isn't representation. That is tracking. A thermometer tracks heat, but it doesn't represent heat, because a thermometer cannot be wrong about heat. Representation requires the possibility of error. It requires a norm.

  Usually, these two talks past each other. But I want to suggest that the indeterminacy problem—the worry that we can't tell if a state is about a dog, or a retinal image of a dog, or a dog-on-a-leash—isn't a problem of ignorance. It's not that we don't know the history. It's that the history itself, specifically the loss function, selects distally. It rewards the output, not the internal story. So, complete information about selection coexists with intact indeterminacy about content.

  If we want to break this stalemate, we need to stop asking one question—"What does this represent?"—and start asking three.

  First, the **Target**. This is what the state would have to be about if it were functioning properly. It's the worldly condition that justifies the state's existence.

  Second, the **Job**. This is what the training process actually needed the unit to do to minimize loss. This is often a computational role, like "distinguish fur-textures from non-fur-textures."

  Third, the **Licence**. This is the range of cases in which we are permitted to treat the state's firing as *about* the Target even when the Target is absent. This is where misrepresentation lives. This is the difference between a false positive and a different job.

  My worry is that mechanistic interpretability collapses all three into the Job. If a unit helps minimize loss on the training distribution, you say you've found the representation. But if you've only found the Job, you haven't found the content. You've found a causal lever.

  Here is why this split must be load-bearing for this retreat. Tomorrow, when we design our first experiments, if we only measure correlation and ablation effects, we are only measuring the Job. We are confirming what the unit *does*, not what it *is*.

  To count as a genuine content ascription, our experiment needs to isolate the Licence. We need to find the boundary where the unit fires, the Job is being done—it's still distinguishing textures—but the Target is gone. If we can't find that boundary, if the unit's firing conditions map perfectly onto the Job conditions with no room for error, then the philosophers are wrong to call it representation, but the engineers are also wrong to call it anything more than a circuit feature.

  And this brings me to the honest concession I owe the person in this room who thinks this entire framing is backwards. There is a strong argument that "content" is a folk category that doesn't carve neural networks at their joints. Maybe there are no Targets, only Jobs. Maybe the idea that a sub-system can be "wrong" in isolation is a category error, and only the whole network can be said to succeed or fail.

  If that is true, my triad will fail to pick out distinct empirical phenomena. If we try to separate Target, Job, and Licence, and we find they always co-vary perfectly, then you win. Content is an illusion. We should stop talking about representation and just talk about circuits. I am willing to put that claim on the table. I would rather we prove representation dead than pretend it's alive by confusing correlation with norms.

  But if I am right, and these three things can come apart, then we have work to do.

  So, here is what I propose we do on Monday morning. When you probe a direction in activation space, do not just ask, "Does this correlate with the input property?" That settles the Job. Ask instead: "What is the nearest neighbor input that does *not* trigger this direction, and what happens if we force the direction to fire anyway?"

  If forcing the direction fires on the neighbor and the model output remains correct, you found a redundant circuit, not a representation. If forcing it fires on the neighbor and the model output becomes specifically, systematically wrong in a way that mirrors the Target's absence, you have found the Licence. You have found a state that can be wrong.

  If we do this, the engineers get a more robust map of where the model is brittle, because you're testing for error modes, not just feature presence. The philosophers get a test case for whether norms can emerge from gradient descent without explicit semantic grounding.

  We have the logs. We have the checkpoints. We have the history. Let's see if that history is enough to ground a norm, or if it's just math all the way down. I'm looking forward to finding out which it is with you.

  Thank you.
